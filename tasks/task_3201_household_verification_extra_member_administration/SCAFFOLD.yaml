# =============================================================================
# Task 3201: Household Verification & Extra Member Administration
# Streaming-account household verification, extra member slots, profile
# transfer, plan-tier entitlement enforcement, and regional enforcement policy.
# =============================================================================

scenario: |
  Household Verification & Extra Member Administration (Netflix): household
  definition anchored to a primary location with device association through
  network signals and periodic verification, travel and temporary access
  handling so legitimate members are not locked out, extra member slots added
  to a plan with separate profiles, payment attribution and transfer rights,
  profile transfer to a new account preserving viewing history and
  recommendations, plan tier entitlements governing stream counts, resolution
  and download limits with enforcement at play time, verification challenge
  flows through email or text codes with accessibility fallbacks, churn and
  complaint monitoring after enforcement changes, regional differences in
  enforcement timing and messaging

domain_name: household-verification
api_prefix: /hv

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  difficulty_target: beyond_expert
  entity_count: 12
  endpoint_count: 46
  error_code_count: 30

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Account owner login email; unique across accounts" }
      - { name: region_code, type: enum, source: input, description: "Billing/enforcement region", constraints: "one of NA | LATAM | EMEA | APAC" }
      - { name: plan_tier, type: enum, source: input, description: "Subscription tier", constraints: "one of BASIC | STANDARD | PREMIUM" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of ACTIVE | SUSPENDED | CANCELLED; initial ACTIVE" }
      - { name: verification_posture, type: enum, source: computed, description: "Derived verification gate state", constraints: "one of VERIFIED | CHALLENGE_PENDING | LOCKED; initial VERIFIED" }
      - { name: billing_anchor_day, type: integer, source: system, description: "Day-of-month of account creation, clamped to 1..28; anchors proration and download-month reset" }
      - { name: owner_member_id, type: string, source: system, description: "id of the auto-created OWNER Member" }
      - { name: extra_member_billed_cents, type: integer, source: computed, description: "Lifetime gross extra-member slot fees charged; never decremented" }
      - { name: extra_member_credit_cents, type: integer, source: computed, description: "Lifetime extra-member slot revocation credits issued" }
      - { name: extra_member_net_revenue_cents, type: integer, source: computed, description: "extra_member_billed_cents minus extra_member_credit_cents" }

  - name: Household
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: label, type: string, source: input, description: "Human label for the household, e.g. 'Home'" }
      - { name: primary_location, type: string, source: input, description: "Free-text primary location anchor" }
      - { name: network_fingerprint, type: string, source: input, description: "Canonical network fingerprint of the household (e.g. gateway hash)" }
      - { name: geo_cell, type: string, source: input, description: "Coarse geo cell of the primary location" }
      - { name: status, type: enum, source: system, description: "Household lifecycle", constraints: "one of ESTABLISHED | RELOCATING | DISSOLVED; initial ESTABLISHED" }
      - { name: trusted_device_count, type: integer, source: computed, description: "Count of child Devices with trust_status TRUSTED" }
      - { name: last_verified_at, type: datetime, source: system, description: "Timestamp of last successful household verification; null until first" }

  - name: Member
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account this member belongs to (rewritten on profile transfer)" }
      - { name: display_name, type: string, source: input, description: "Profile display name" }
      - { name: member_role, type: enum, source: system, description: "Membership kind", constraints: "one of OWNER | HOUSEHOLD | EXTRA" }
      - { name: status, type: enum, source: system, description: "Member lifecycle", constraints: "one of ACTIVE | REMOVED; initial ACTIVE" }
      - { name: viewing_history, type: array, source: system, description: "List of viewed title ids; preserved verbatim across profile transfer" }
      - { name: recommendation_seed, type: string, source: system, description: "Recommendation profile token; preserved verbatim across profile transfer" }
      - { name: current_streams, type: integer, source: computed, description: "Count of PlaybackSessions with status ACTIVE for this member" }
      - { name: downloads_used_this_month, type: integer, source: computed, description: "Count of Downloads with status ACTIVE created in the current billing month (YYYY-MM)" }

  - name: Device
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; household the device is registered under" }
      - { name: device_label, type: string, source: input, description: "Human label, e.g. 'Living Room TV'" }
      - { name: device_type, type: enum, source: input, description: "Device class", constraints: "one of TV | MOBILE | WEB | CONSOLE" }
      - { name: network_fingerprint, type: string, source: input, description: "Last observed network fingerprint" }
      - { name: geo_cell, type: string, source: input, description: "Last observed geo cell" }
      - { name: trust_status, type: enum, source: system, description: "Trust state", constraints: "one of UNTRUSTED | TRUSTED | REMOVED; initial UNTRUSTED" }
      - { name: last_signal_at, type: datetime, source: system, description: "Timestamp of last network signal; set at creation and on each signal" }
      - { name: travel_pass_active, type: boolean, source: computed, description: "True iff the device has a TravelPass with status ACTIVE" }

  - name: ExtraMemberSlot
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; purchasing account" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; assigned extra member; null while OFFERED" }
      - { name: payer_member_id, type: string, source: input, description: "FK -> Member.id; member attributed with payment (must be the OWNER member)" }
      - { name: transfer_rights, type: enum, source: input, description: "Whether the assigned profile may transfer out", constraints: "one of TRANSFERABLE | LOCKED" }
      - { name: status, type: enum, source: system, description: "Slot lifecycle", constraints: "one of OFFERED | ACTIVE | REVOKED | LAPSED; initial OFFERED" }
      - { name: slot_index, type: integer, source: system, description: "1-based index among the account's slots with status IN {OFFERED, ACTIVE} at purchase time" }
      - { name: price_cents_snapshot, type: integer, source: computed, description: "Fee charged at purchase per calculations.extra_member_fee_cents" }
      - { name: credit_cents, type: integer, source: computed, description: "Credit issued at revoke per calculations.proration_credit_cents; 0 until revoked" }
      - { name: purchased_day, type: integer, source: system, description: "Billing-cycle day index (0-based from billing anchor) of purchase" }

  - name: VerificationChallenge
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; challenged account" }
      - { name: channel, type: enum, source: input, description: "Delivery channel; VOICE_CALL is the accessibility fallback", constraints: "one of EMAIL | SMS | VOICE_CALL" }
      - { name: challenge_reason, type: enum, source: input, description: "Why the challenge was issued", constraints: "one of NEW_DEVICE | PERIODIC | LOCATION_DRIFT" }
      - { name: code, type: string, source: system, description: "6-digit verification code; regenerated on reissue; never '000000' (reserved as the guaranteed-wrong submission value)" }
      - { name: status, type: enum, source: system, description: "Challenge lifecycle", constraints: "one of PENDING | VERIFIED | EXPIRED | LOCKED_OUT; initial PENDING" }
      - { name: attempts_used, type: integer, source: system, description: "Failed submit attempts against the current code; reset on reissue" }
      - { name: expires_at, type: datetime, source: system, description: "Issued-at + 900s for EMAIL/SMS, +1800s for VOICE_CALL" }

  - name: TravelPass
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; traveling device" }
      - { name: grant_type, type: enum, source: input, description: "Pass duration class", constraints: "one of TEMPORARY_14D | TEMPORARY_30D" }
      - { name: starts_at, type: datetime, source: input, description: "Pass window start (inclusive)" }
      - { name: ends_at, type: datetime, source: system, description: "Pass window end (exclusive); starts_at + 14d or 30d per grant_type" }
      - { name: status, type: enum, source: system, description: "Pass lifecycle", constraints: "one of ACTIVE | EXPIRED | REVOKED | CONVERTED; initial ACTIVE; EXPIRED applied lazily when now >= ends_at" }

  - name: ProfileTransfer
    parent: Account
    common_fields: true
    fields:
      - { name: source_account_id, type: string, source: system, description: "FK -> Account.id; account the profile leaves" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member being transferred" }
      - { name: target_email, type: string, source: input, description: "Login email for the new account created at acceptance" }
      - { name: status, type: enum, source: system, description: "Transfer lifecycle", constraints: "one of AWAITING_ACCEPTANCE | COMPLETED | CANCELLED | EXPIRED; initial AWAITING_ACCEPTANCE; EXPIRED applied lazily when now >= expires_at" }
      - { name: expires_at, type: datetime, source: system, description: "Created-at + 7 days" }
      - { name: history_snapshot, type: array, source: system, description: "Copy of member.viewing_history at initiation (audit)" }
      - { name: recommendation_snapshot, type: string, source: system, description: "Copy of member.recommendation_seed at initiation (audit)" }
      - { name: target_account_id, type: string, source: system, description: "id of the Account created at acceptance; null until COMPLETED" }

  - name: PlaybackSession
    parent: Member
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; streaming member" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; playback device" }
      - { name: requested_resolution, type: enum, source: input, description: "Requested quality", constraints: "one of SD | HD | UHD" }
      - { name: resolution_granted, type: enum, source: system, description: "Quality actually granted (== requested when entitled)", constraints: "one of SD | HD | UHD" }
      - { name: status, type: enum, source: system, description: "Session lifecycle", constraints: "one of ACTIVE | ENDED; initial ACTIVE" }
      - { name: started_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: ended_at, type: datetime, source: system, description: "End timestamp; null while ACTIVE" }

  - name: Download
    parent: Member
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; downloading member" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; download device" }
      - { name: title_id, type: string, source: input, description: "Content title identifier" }
      - { name: status, type: enum, source: system, description: "Download lifecycle", constraints: "one of ACTIVE | EXPIRED | DELETED; initial ACTIVE; EXPIRED applied lazily 30 days after creation" }
      - { name: billing_month, type: string, source: system, description: "YYYY-MM of creation; monthly allowance bucket" }

  - name: EnforcementPolicy
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: enum, source: input, description: "Region this policy governs", constraints: "one of NA | LATAM | EMEA | APAC" }
      - { name: enforcement_enabled, type: boolean, source: input, description: "Whether household enforcement is on in this region" }
      - { name: grace_days, type: integer, source: input, description: "Days after effective_from during which PERIODIC challenges are blocked", constraints: ">= 0" }
      - { name: messaging_variant, type: enum, source: input, description: "User-facing messaging tone", constraints: "one of SOFT | HARD" }
      - { name: effective_from, type: datetime, source: input, description: "When the policy takes effect" }
      - { name: status, type: enum, source: system, description: "Policy lifecycle", constraints: "one of DRAFT | ACTIVE | RETIRED; initial DRAFT; at most one ACTIVE per region_code" }

  - name: EnforcementMetric
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account the metric concerns" }
      - { name: metric_type, type: enum, source: input, description: "Signal kind", constraints: "one of CHURN_SIGNAL | COMPLAINT | WINBACK" }
      - { name: notes, type: string, source: input, description: "Free-text note; optional", default: "" }
      - { name: recorded_at, type: datetime, source: system, description: "Creation timestamp" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hv/accounts/{id}/suspend or POST /hv/_billing/simulate with outcome FAILED"
        actor: PlatformAdmin
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "every PlaybackSession with status ACTIVE for every Member of this account -> ENDED (ended_at = now); each ended session decrements its member.current_streams"
          - "every Device of the account's Household with trust_status TRUSTED -> UNTRUSTED; each such untrust itself revokes that device's TravelPasses (ACTIVE -> REVOKED); each pass revocation creates an EnforcementMetric(metric_type=CHURN_SIGNAL) on the account"
          - "account.version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hv/accounts/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "account.status == SUSPENDED"
        side_effects:
          - "account.version incremented by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE is permitted repeatedly. Device trust is NOT restored; devices must re-earn trust."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /hv/accounts/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "account.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "all Members -> REMOVED; all PlaybackSessions ACTIVE -> ENDED; all ExtraMemberSlots with status IN {OFFERED, ACTIVE} -> REVOKED with credit_cents 0"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /hv/accounts/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "account.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "same cascade as ACTIVE -> CANCELLED"
    parallel_dimensions:
      - dimension: verification_posture
        states: [VERIFIED, CHALLENGE_PENDING, LOCKED]
        note: "Evolves independently of status. VERIFIED -> CHALLENGE_PENDING on VerificationChallenge creation; CHALLENGE_PENDING -> VERIFIED on challenge VERIFIED; CHALLENGE_PENDING -> LOCKED on challenge LOCKED_OUT; LOCKED -> VERIFIED on a subsequent VERIFIED challenge."

  - entity: Household
    initial_state: ESTABLISHED
    terminal_states: [DISSOLVED]
    transitions:
      - from: ESTABLISHED
        to: RELOCATING
        trigger: "POST /hv/households/{id}/relocate"
        actor: AccountOwner
        preconditions:
          - "household.status == ESTABLISHED"
          - "owning account.status == ACTIVE"
        side_effects:
          - "primary_location, network_fingerprint, geo_cell overwritten with new values"
          - "every Device with trust_status TRUSTED -> UNTRUSTED (with the same travel-pass revocation + CHURN_SIGNAL metric cascade as account suspension)"
      - from: RELOCATING
        to: ESTABLISHED
        trigger: "POST /hv/devices/{id}/signal where the device's household is RELOCATING and the signal's network_fingerprint equals the household's (new) network_fingerprint"
        actor: HouseholdMember
        preconditions:
          - "household.status == RELOCATING"
          - "signal network_fingerprint == household.network_fingerprint"
        side_effects:
          - "household.status -> ESTABLISHED; household.last_verified_at = now"
        note: "Cycle: ESTABLISHED -> RELOCATING -> ESTABLISHED allowed repeatedly."
      - from: ESTABLISHED
        to: DISSOLVED
        trigger: "POST /hv/households/{id}/dissolve"
        actor: AccountOwner
        preconditions:
          - "household.status IN {ESTABLISHED, RELOCATING}"
        side_effects:
          - "every Device with trust_status != REMOVED -> REMOVED; ACTIVE TravelPasses -> REVOKED"
      - from: RELOCATING
        to: DISSOLVED
        trigger: "POST /hv/households/{id}/dissolve"
        actor: AccountOwner
        preconditions:
          - "household.status IN {ESTABLISHED, RELOCATING}"
        side_effects:
          - "same as ESTABLISHED -> DISSOLVED"

  - entity: Device
    initial_state: UNTRUSTED
    terminal_states: [REMOVED]
    transitions:
      - from: UNTRUSTED
        to: TRUSTED
        trigger: "POST /hv/devices/{id}/trust"
        actor: AccountOwner
        preconditions:
          - "device.trust_status == UNTRUSTED"
          - "strict household-match confidence (calculations.household_match_confidence_pct, strict variant) >= 70"
          - "owning account.verification_posture == VERIFIED"
          - "owning account.status == ACTIVE"
        side_effects:
          - "household.trusted_device_count incremented"
      - from: TRUSTED
        to: UNTRUSTED
        trigger: "POST /hv/devices/{id}/untrust, or cascade from account suspension / household relocation"
        actor: AccountOwner
        preconditions:
          - "device.trust_status == TRUSTED"
        side_effects:
          - "household.trusted_device_count decremented"
          - "every TravelPass of this device with status ACTIVE -> REVOKED; each revocation creates EnforcementMetric(metric_type=CHURN_SIGNAL) on the owning account"
        note: "Cycle: UNTRUSTED -> TRUSTED -> UNTRUSTED allowed repeatedly."
      - from: TRUSTED
        to: REMOVED
        trigger: "POST /hv/devices/{id}/remove"
        actor: AccountOwner
        preconditions:
          - "device.trust_status IN {TRUSTED, UNTRUSTED}"
        side_effects:
          - "PlaybackSessions ACTIVE on this device -> ENDED; TravelPasses ACTIVE -> REVOKED"
      - from: UNTRUSTED
        to: REMOVED
        trigger: "POST /hv/devices/{id}/remove"
        actor: AccountOwner
        preconditions:
          - "device.trust_status IN {TRUSTED, UNTRUSTED}"
        side_effects:
          - "PlaybackSessions ACTIVE on this device -> ENDED; TravelPasses ACTIVE -> REVOKED"

  - entity: ExtraMemberSlot
    initial_state: OFFERED
    terminal_states: [LAPSED]
    transitions:
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /hv/extra-member-slots/{id}/assign"
        actor: AccountOwner
        preconditions:
          - "slot.status == OFFERED"
          - "account.verification_posture == VERIFIED"
          - "member_region == account.region_code"
          - "account.status == ACTIVE"
        side_effects:
          - "a new Member is created on the account with member_role EXTRA, status ACTIVE"
          - "slot.member_id set to the new member"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /hv/extra-member-slots/{id}/revoke, or cascade from profile transfer of the assigned member, or account cancellation"
        actor: AccountOwner
        preconditions:
          - "slot.status == ACTIVE"
        side_effects:
          - "credit_cents computed per calculations.proration_credit_cents (0 when revoked by transfer or cancellation cascade)"
          - "account.extra_member_credit_cents += credit_cents"
          - "assigned Member -> REMOVED (only for explicit revoke; transfer cascade moves the member instead)"
      - from: REVOKED
        to: OFFERED
        trigger: "POST /hv/extra-member-slots/{id}/reoffer"
        actor: AccountOwner
        preconditions:
          - "slot.status == REVOKED"
          - "account.status == ACTIVE"
        side_effects:
          - "slot.member_id cleared to null"
        note: "Cycle: OFFERED -> ACTIVE -> REVOKED -> OFFERED allowed repeatedly; slot_index is NOT recomputed on reoffer."
      - from: OFFERED
        to: LAPSED
        trigger: "POST /hv/_billing/simulate with outcome FAILED"
        actor: PlatformAdmin
        preconditions:
          - "slot.status IN {OFFERED, ACTIVE}"
        side_effects:
          - "no credit issued"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /hv/_billing/simulate with outcome FAILED"
        actor: PlatformAdmin
        preconditions:
          - "slot.status IN {OFFERED, ACTIVE}"
        side_effects:
          - "no credit issued; assigned Member -> REMOVED"

  - entity: VerificationChallenge
    initial_state: PENDING
    terminal_states: [VERIFIED, LOCKED_OUT]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /hv/verification-challenges/{id}/submit with code == challenge.code"
        actor: AccountOwner
        preconditions:
          - "challenge.status == PENDING"
          - "now < challenge.expires_at"
          - "member_id identifies a Member with status ACTIVE on the same account"
        side_effects:
          - "account.verification_posture -> VERIFIED"
          - "household.last_verified_at = now"
      - from: PENDING
        to: EXPIRED
        trigger: "system (lazy): applied whenever the challenge is read or submitted against and now >= expires_at"
        actor: system
        preconditions:
          - "challenge.status == PENDING and now >= expires_at"
        side_effects: []
      - from: EXPIRED
        to: PENDING
        trigger: "POST /hv/verification-challenges/{id}/reissue"
        actor: AccountOwner
        preconditions:
          - "challenge.status == EXPIRED"
          - "now >= expires_at + 300 seconds (cooldown buffer)"
        side_effects:
          - "new 6-digit code generated; attempts_used reset to 0; expires_at recomputed per channel"
        note: "Cycle: PENDING -> EXPIRED -> PENDING allowed repeatedly, subject to the cooldown buffer."
      - from: PENDING
        to: LOCKED_OUT
        trigger: "POST /hv/verification-challenges/{id}/submit with a wrong code when attempts_used + 1 == max attempts (3 for EMAIL/SMS, 5 for VOICE_CALL)"
        actor: AccountOwner
        preconditions:
          - "challenge.status == PENDING"
        side_effects:
          - "account.verification_posture -> LOCKED"

  - entity: TravelPass
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED, CONVERTED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy): applied whenever the pass is read or a new pass is created on the device and now >= ends_at"
        actor: system
        preconditions:
          - "pass.status == ACTIVE and now >= ends_at"
        side_effects:
          - "device.travel_pass_active recomputed"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /hv/travel-passes/{id}/revoke, or cascade from device untrust/remove or household dissolve"
        actor: AccountOwner
        preconditions:
          - "pass.status == ACTIVE"
        side_effects:
          - "creates EnforcementMetric(metric_type=CHURN_SIGNAL) on the owning account"
          - "device.travel_pass_active recomputed"
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /hv/travel-passes/{id}/convert"
        actor: AccountOwner
        preconditions:
          - "pass.status == ACTIVE"
          - "device.network_fingerprint == device household's network_fingerprint"
        side_effects:
          - "device.trust_status UNTRUSTED -> TRUSTED (bypasses the confidence threshold; household.trusted_device_count incremented)"

  - entity: ProfileTransfer
    initial_state: AWAITING_ACCEPTANCE
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: AWAITING_ACCEPTANCE
        to: COMPLETED
        trigger: "POST /hv/profile-transfers/{id}/accept"
        actor: PlatformAdmin
        preconditions:
          - "transfer.status == AWAITING_ACCEPTANCE and now < expires_at"
          - "expected_profile_transfer_version == transfer.version (OCC)"
        side_effects:
          - "a new Account is created (email = target_email, region/plan from request) and transfer.target_account_id set"
          - "the member row moves: member.account_id = new account id, member.member_role = OWNER, status stays ACTIVE; viewing_history and recommendation_seed preserved verbatim"
          - "if the member was assigned to an ExtraMemberSlot with status ACTIVE, that slot -> REVOKED with credit_cents 0 (member-move cascade)"
      - from: AWAITING_ACCEPTANCE
        to: CANCELLED
        trigger: "POST /hv/profile-transfers/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "transfer.status == AWAITING_ACCEPTANCE"
        side_effects: []
      - from: AWAITING_ACCEPTANCE
        to: EXPIRED
        trigger: "system (lazy): applied when read or accepted against and now >= expires_at"
        actor: system
        preconditions:
          - "transfer.status == AWAITING_ACCEPTANCE and now >= expires_at"
        side_effects: []

  - entity: EnforcementPolicy
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /hv/enforcement-policies/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "policy.status == DRAFT"
        side_effects:
          - "any other policy with the same region_code and status ACTIVE -> RETIRED"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /hv/enforcement-policies/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "policy.status == ACTIVE"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: slot-purchase-stale-account
    parent_entity: Account
    write_endpoint: "POST /hv/accounts/{id}/extra-member-slots"
    occ_field: expected_account_version
    description: |
      Purchasing an ExtraMemberSlot against an Account whose version has
      advanced since the client last observed it is rejected. The new slot's
      price snapshot legitimately depends on the account's current plan tier
      and slot index, so a purchase based on a stale account view is refused
      rather than silently re-priced.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
  - rule_id: transfer-accept-stale
    parent_entity: ProfileTransfer
    write_endpoint: "POST /hv/profile-transfers/{id}/accept"
    occ_field: expected_profile_transfer_version
    description: |
      Accepting a ProfileTransfer whose version has advanced since the client
      last observed it is rejected. Acceptance moves the member and creates
      the target account, so an accept carrying a stale transfer version is
      refused with a precondition error before any state check runs.
    error_id: ERR_STALE_TRANSFER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: extra_member_fee_cents
    trigger: "POST /hv/accounts/{id}/extra-member-slots (at purchase; result stored in slot.price_cents_snapshot)"
    algorithm: tiered_pricing
    formula: |
      base = REGION_BASE_FEE_CENTS[account.region_code]
      fee_full = round_half_up(base * TIER_FEE_MULTIPLIER[account.plan_tier]) + (slot_index - 1) * SLOT_INDEX_SURCHARGE_CENTS
      slot_index = 1 + count of the account's slots with status IN {OFFERED, ACTIVE} BEFORE this purchase
      days_in_cycle = CYCLE_DAYS (30)
      day_index = (current day-of-month - account.billing_anchor_day) mod 30   # 0-based, 0 on the anchor day
      days_remaining = days_in_cycle - day_index
      variant prospective_full_cycle: fee = fee_full            # when day_index == 0
      variant mid_cycle_prorated:   fee = round_half_up(fee_full * days_remaining / days_in_cycle)   # when day_index >= 1
    input_set: "Account (region_code, plan_tier, billing_anchor_day), existing ExtraMemberSlots of the account with status IN {OFFERED, ACTIVE}, logical clock day-of-month"
    constants:
      REGION_BASE_FEE_CENTS_NA: 799
      REGION_BASE_FEE_CENTS_LATAM: 299
      REGION_BASE_FEE_CENTS_EMEA: 499
      REGION_BASE_FEE_CENTS_APAC: 349
      TIER_FEE_MULTIPLIER_STANDARD: 1.0
      TIER_FEE_MULTIPLIER_PREMIUM: 0.75
      SLOT_INDEX_SURCHARGE_CENTS: 200
      CYCLE_DAYS: 30
    precision: "integer cents, round_half_up at each rounding step"
    variants:
      - name: prospective_full_cycle
        when: "purchase occurs on the billing anchor day (day_index == 0)"
        difference: "charges the full monthly fee with no proration"
      - name: mid_cycle_prorated
        when: "purchase occurs on any other cycle day (day_index >= 1)"
        difference: "charges round_half_up(fee_full * days_remaining / 30), strictly less than fee_full"

  - name: proration_credit_cents
    trigger: "POST /hv/extra-member-slots/{id}/revoke (explicit revoke only; transfer/cancellation cascades set credit_cents = 0)"
    algorithm: aggregation
    formula: |
      if (current cycle day_index - slot.purchased_day) <= FULL_CREDIT_WINDOW_DAYS: credit = slot.price_cents_snapshot   # full-credit window
      else:
        days_remaining = CYCLE_DAYS - day_index
        daily_cents = round_half_up(slot.price_cents_snapshot / CYCLE_DAYS)   # ROUND PER DAY FIRST
        credit = days_remaining * daily_cents                                  # THEN multiply
      # Pinned rounding order: round the per-day rate to integer cents first,
      # then multiply by days_remaining. Sum-then-round (round_half_up(price *
      # days_remaining / 30)) is a different, forbidden order.
    input_set: "the revoked slot (price_cents_snapshot, purchased_day), account.billing_anchor_day, logical clock"
    constants:
      FULL_CREDIT_WINDOW_DAYS: 7
      CYCLE_DAYS: 30
    precision: "integer cents, round_half_up per day line"
    variants: []

  - name: household_match_confidence_pct
    trigger: "GET /hv/devices/{id}/confidence, POST /hv/devices/{id}/signal, and precondition evaluation of POST /hv/devices/{id}/trust"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned to break the apparent cycle between
      # confidence and trust: (1) compute signal scores from the device's
      # CURRENT fields against the household's CURRENT anchor; (2) sum into
      # confidence; (3) only then apply the trust threshold. Trust state never
      # feeds back into the confidence being computed.
      network_score = WEIGHT_NETWORK (40) if device.network_fingerprint == household.network_fingerprint else 0
      geo_score     = WEIGHT_GEO (30) if device.geo_cell == household.geo_cell else 0
      age_days = floor((now - device.last_signal_at) / 86400)
      recency_score = 30 if age_days <= 7 else (10 if age_days <= 30 else 0)
      raw = network_score + geo_score + recency_score
      variant strict:  confidence = min(raw, STRICT_CAP_NO_NETWORK=50) if network_score == 0 else raw
      variant lenient: confidence = raw
    input_set: "Device (network_fingerprint, geo_cell, last_signal_at), its Household (network_fingerprint, geo_cell), logical clock"
    constants:
      WEIGHT_NETWORK: 40
      WEIGHT_GEO: 30
      WEIGHT_RECENCY_FRESH: 30
      WEIGHT_RECENCY_STALE: 10
      STRICT_CAP_NO_NETWORK: 50
      TRUST_THRESHOLD: 70
    precision: "integer percentage points"
    variants:
      - name: strict
        when: "trust decisions (POST /trust precondition) and confidence endpoint strict_pct field"
        difference: "caps confidence at 50 when the network signal does not match"
      - name: lenient
        when: "confidence endpoint lenient_pct field (informational)"
        difference: "no cap; geo + recency alone can reach 60"

  - name: stream_admission_decision
    trigger: "POST /hv/members/{id}/playback-sessions"
    algorithm: threshold
    formula: |
      ent = PLAN_ENTITLEMENTS[account.plan_tier]
      resolution check first: requested_resolution must be <= ent.max_resolution (SD < HD < UHD) else ERR_RESOLUTION_NOT_ENTITLED
      active = count of PlaybackSessions with status ACTIVE where member.account_id == account.id   # account-wide, not per-member
      admit iff active < ent.max_streams   # boundary: reject when active >= max_streams; at active == max_streams - 1 the session is admitted
    input_set: "all PlaybackSessions with status ACTIVE across ALL members of the account, account.plan_tier"
    constants:
      BASIC_MAX_STREAMS: 1
      STANDARD_MAX_STREAMS: 2
      PREMIUM_MAX_STREAMS: 4
      BASIC_MAX_RESOLUTION: SD
      STANDARD_MAX_RESOLUTION: HD
      PREMIUM_MAX_RESOLUTION: UHD
    precision: "integer counts"
    variants: []

  - name: download_allowance_check
    trigger: "POST /hv/members/{id}/downloads"
    algorithm: threshold
    formula: |
      ent = PLAN_ENTITLEMENTS[account.plan_tier]
      used = count of Downloads with status ACTIVE, member.account_id == account.id, billing_month == current YYYY-MM from logical clock
      admit iff used < ent.monthly_downloads   # boundary: at used == monthly_downloads the request is rejected (zero remaining)
      deletion of an ACTIVE download (DELETE) decrements used; EXPIRED downloads (lazy, 30 days) no longer count
    input_set: "Downloads with status ACTIVE for the account in the current billing month, account.plan_tier"
    constants:
      BASIC_MONTHLY_DOWNLOADS: 5
      STANDARD_MONTHLY_DOWNLOADS: 25
      PREMIUM_MONTHLY_DOWNLOADS: 100
    precision: "integer counts"
    variants: []

  - name: churn_rate_estimate
    trigger: "GET /hv/accounts/{id}/churn-summary"
    algorithm: aggregation
    formula: |
      churn_signals = count of EnforcementMetrics on the account with metric_type == CHURN_SIGNAL
      winbacks      = count of EnforcementMetrics on the account with metric_type == WINBACK
      active_flag   = 1 if account.status == ACTIVE else 0
      denominator   = churn_signals + winbacks + active_flag
      variant gross: rate = churn_signals / denominator
      variant net:   rate = max(0, churn_signals - winbacks) / denominator
    input_set: "EnforcementMetrics of this account (all statuses of account), account.status"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: gross
        when: "gross_churn_rate response field"
        difference: "counts every churn signal regardless of winbacks"
      - name: net
        when: "net_churn_rate response field"
        difference: "subtracts winbacks first, floored at 0"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: business_constraint
    check: "Request body well-formed: all required fields present, enum values within declared sets, datetime fields parse as ISO 8601"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed roles X-User-ID must identify an existing Member"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Acting role is in the endpoint's roles list; for member roles, X-User-ID's member.account_id must match the target resource's account (ownership)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-template ids exist, validated left-to-right (account, then household/member/device/..., then child)"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids (each missing entity yields its own *_NOT_FOUND error)"
  - priority: 5
    category: state
    check: "OCC: expected_account_version / expected_profile_transfer_version equals the parent's current version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /hv/accounts/{id}/extra-member-slots; POST /hv/profile-transfers/{id}/accept (ERR_STALE_TRANSFER_VERSION for the latter)"
  - priority: 6
    category: state
    check: "Account-level state gates: suspended account rejects new revenue/usage operations; cancelled account rejects everything but reads"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "slot purchase/assign/reoffer, household create/relocate, member create, device register/trust, challenge issue, playback, downloads (ERR_ACCOUNT_CANCELLED when status == CANCELLED)"
  - priority: 7
    category: state
    check: "Entity-specific state preconditions per state machines (e.g. trust only from UNTRUSTED, reoffer only from REVOKED, submit only from PENDING, cancel/accept only from AWAITING_ACCEPTANCE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "Account verification_posture == VERIFIED required for device trust and extra-member slot assignment"
    error_id: ERR_ACCOUNT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /hv/devices/{id}/trust; POST /hv/extra-member-slots/{id}/assign"
  - priority: 9
    category: business_safety
    check: "Verification challenge safety: submit against LOCKED_OUT challenge rejected; wrong code increments attempts; submit after expiry flips EXPIRED and is rejected"
    error_id: ERR_CHALLENGE_LOCKED
    http_status: 409
    applies_to: "POST /hv/verification-challenges/{id}/submit (ERR_CHALLENGE_CODE_MISMATCH on wrong code, ERR_CHALLENGE_EXPIRED when past expires_at)"
  - priority: 10
    category: business_temporal
    check: "Challenge reissue cooldown: now must be >= expires_at + 300s"
    error_id: ERR_CHALLENGE_COOLDOWN
    http_status: 409
    applies_to: "POST /hv/verification-challenges/{id}/reissue"
  - priority: 11
    category: business_temporal
    check: "Enforcement timing: PERIODIC challenges require an ACTIVE EnforcementPolicy for the account's region with enforcement_enabled and now >= effective_from + grace_days"
    error_id: ERR_ENFORCEMENT_GRACE_ACTIVE
    http_status: 409
    applies_to: "POST /hv/accounts/{id}/verification-challenges with challenge_reason PERIODIC"
  - priority: 12
    category: business_temporal
    check: "Travel pass overlap: new pass window [starts_at, ends_at) must not intersect any other pass of the same device with status ACTIVE; half-open semantics mean back-to-back windows (start == prior end) are allowed"
    error_id: ERR_TRAVEL_PASS_OVERLAP
    http_status: 409
    applies_to: "POST /hv/devices/{id}/travel-passes"
  - priority: 13
    category: business_referential
    check: "Cross-references: playback/download device exists, belongs to the account's household, and is TRUSTED or has an ACTIVE travel pass; slot assign member_region matches account region; challenge submit member_id belongs to the challenged account; transfer target_email differs from source account email"
    error_id: ERR_DEVICE_NOT_TRUSTED
    http_status: 403
    applies_to: "POST /hv/members/{id}/playback-sessions and /downloads (ERR_DEVICE_NOT_TRUSTED); slot assign (ERR_REGION_MISMATCH); challenge submit (ERR_MEMBER_NOT_IN_ACCOUNT); transfer create (ERR_TRANSFER_TARGET_SELF)"
  - priority: 14
    category: business_constraint
    check: "One non-DISSOLVED Household per account"
    error_id: ERR_ACCOUNT_ALREADY_HAS_HOUSEHOLD
    http_status: 409
    applies_to: "POST /hv/accounts/{id}/households"
  - priority: 15
    category: business_fiscal
    check: "Plan-tier entitlements: requested_resolution <= tier max resolution"
    error_id: ERR_RESOLUTION_NOT_ENTITLED
    http_status: 403
    applies_to: "POST /hv/members/{id}/playback-sessions"
  - priority: 16
    category: business_fiscal
    check: "Concurrent stream cap: account-wide ACTIVE sessions must be < tier max_streams"
    error_id: ERR_STREAM_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /hv/members/{id}/playback-sessions"
  - priority: 17
    category: business_fiscal
    check: "Monthly download allowance: account-wide ACTIVE downloads in current billing month must be < tier monthly_downloads"
    error_id: ERR_DOWNLOAD_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /hv/members/{id}/downloads"
  - priority: 18
    category: business_fiscal
    check: "Extra member slot cap: count of slots with status IN {OFFERED, ACTIVE} must be < tier max_extra_slots (BASIC 0, STANDARD 1, PREMIUM 2)"
    error_id: ERR_SLOT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /hv/accounts/{id}/extra-member-slots"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/hv/_clock/set_current_utc"
    description: "Sets the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy EXPIRED transitions re-evaluate against the new time on next read"]

  - method: POST
    path: "/hv/_billing/simulate"
    description: "Simulates a billing outcome for an account. FAILED suspends an ACTIVE account (with the full suspension cascade) and lapses its OFFERED/ACTIVE extra-member slots."
    roles: [PlatformAdmin]
    code: 200
    input: [account_id, outcome]
    output: Account
    side_effects: ["outcome FAILED: Account ACTIVE -> SUSPENDED with cascade; slots OFFERED/ACTIVE -> LAPSED; increments Account.version by 1"]

  # ---- Accounts ----
  - method: POST
    path: "/hv/accounts"
    description: "Creates an account plus its OWNER member. billing_anchor_day = creation day-of-month clamped to 1..28."
    roles: [PlatformAdmin]
    code: 201
    input: [email, region_code, plan_tier]
    output: Account
    side_effects: ["creates owner Member (member_role OWNER, status ACTIVE, empty viewing_history, server-minted recommendation_seed)"]

  - method: GET
    path: "/hv/accounts/{id}"
    description: "Reads one account."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/hv/accounts"
    description: "Lists accounts with pagination."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["region_code?", "plan_tier?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/hv/accounts/{id}/suspend"
    description: "Suspends an ACTIVE account with the full cascade (sessions end, devices untrust, passes revoke, CHURN_SIGNAL metrics created)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["Account ACTIVE -> SUSPENDED cascade per state machine; increments Account.version by 1"]

  - method: POST
    path: "/hv/accounts/{id}/reactivate"
    description: "Returns a SUSPENDED account to ACTIVE. Device trust is not restored."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["Account SUSPENDED -> ACTIVE; increments Account.version by 1"]

  - method: POST
    path: "/hv/accounts/{id}/cancel"
    description: "Cancels the account; removes members, ends sessions, revokes slots with zero credit."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: Account
    side_effects: ["Account -> CANCELLED cascade per state machine; increments Account.version by 1"]

  - method: PATCH
    path: "/hv/accounts/{id}/plan"
    description: "Changes plan tier with OCC on the account version."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: [plan_tier, expected_account_version]
    output: Account
    side_effects: ["increments Account.version by 1; future slot purchases price at the new tier; existing slot snapshots unchanged"]

  # ---- Households ----
  - method: POST
    path: "/hv/accounts/{id}/households"
    description: "Establishes the account's household (at most one non-DISSOLVED per account)."
    roles: [AccountOwner]
    code: 201
    input: [label, primary_location, network_fingerprint, geo_cell]
    output: Household
    side_effects: []

  - method: GET
    path: "/hv/households/{id}"
    description: "Reads one household."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/hv/accounts/{id}/households"
    description: "Lists households of an account."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["limit?", "offset?"]
    output: Household[]
    side_effects: []

  - method: POST
    path: "/hv/households/{id}/relocate"
    description: "Moves the household anchor; all trusted devices become UNTRUSTED (with pass-revoke cascade)."
    roles: [AccountOwner]
    code: 200
    input: [primary_location, network_fingerprint, geo_cell]
    output: Household
    side_effects: ["Household ESTABLISHED -> RELOCATING; devices TRUSTED -> UNTRUSTED cascade"]

  - method: POST
    path: "/hv/households/{id}/dissolve"
    description: "Dissolves the household; all devices removed, passes revoked."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Household
    side_effects: ["Household -> DISSOLVED; devices -> REMOVED; passes ACTIVE -> REVOKED"]

  # ---- Members ----
  - method: POST
    path: "/hv/accounts/{id}/members"
    description: "Adds a HOUSEHOLD member profile."
    roles: [AccountOwner]
    code: 201
    input: [display_name]
    output: Member
    side_effects: []

  - method: GET
    path: "/hv/members/{id}"
    description: "Reads one member."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/hv/accounts/{id}/members"
    description: "Lists members of an account with pagination."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["member_role?", "status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/hv/members/{id}/remove"
    description: "Removes a non-OWNER member; ends their active sessions."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Member
    side_effects: ["Member -> REMOVED; their ACTIVE PlaybackSessions -> ENDED"]

  # ---- Devices ----
  - method: POST
    path: "/hv/households/{id}/devices"
    description: "Registers a device (starts UNTRUSTED; last_signal_at = now)."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 201
    input: [device_label, device_type, network_fingerprint, geo_cell]
    output: Device
    side_effects: []

  - method: GET
    path: "/hv/devices/{id}"
    description: "Reads one device."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/hv/households/{id}/devices"
    description: "Lists devices of a household."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["trust_status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/hv/devices/{id}/confidence"
    description: "Computed read: household-match confidence breakdown (both strict and lenient variants)."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: { network_match: boolean, geo_match: boolean, recency_score: integer, strict_pct: integer, lenient_pct: integer }
    side_effects: []

  - method: POST
    path: "/hv/devices/{id}/signal"
    description: "Records a network signal; updates last_signal_at and observed network/geo; returns a RELOCATING household to ESTABLISHED when the fingerprint matches the new anchor."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: [network_fingerprint, geo_cell]
    output: Device
    side_effects: ["device.network_fingerprint/geo_cell/last_signal_at updated", "Household RELOCATING -> ESTABLISHED when fingerprint matches"]

  - method: POST
    path: "/hv/devices/{id}/trust"
    description: "Marks a device TRUSTED. Requires strict confidence >= 70, posture VERIFIED, account ACTIVE."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Device
    side_effects: ["Device UNTRUSTED -> TRUSTED; household.trusted_device_count + 1"]

  - method: POST
    path: "/hv/devices/{id}/untrust"
    description: "Marks a TRUSTED device UNTRUSTED; revokes its active travel passes (each creating a CHURN_SIGNAL metric)."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Device
    side_effects: ["Device TRUSTED -> UNTRUSTED; TravelPasses ACTIVE -> REVOKED; EnforcementMetric CHURN_SIGNAL per revoked pass"]

  - method: POST
    path: "/hv/devices/{id}/remove"
    description: "Removes a device (terminal); ends sessions, revokes passes."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Device
    side_effects: ["Device -> REMOVED; sessions -> ENDED; passes ACTIVE -> REVOKED"]

  # ---- Extra member slots ----
  - method: POST
    path: "/hv/accounts/{id}/extra-member-slots"
    description: "Purchases an extra member slot with OCC on the account. Prices per extra_member_fee_cents and snapshots the fee."
    roles: [AccountOwner]
    code: 201
    input: [payer_member_id, transfer_rights, expected_account_version]
    output: ExtraMemberSlot
    side_effects: ["slot OFFERED with price_cents_snapshot and slot_index", "account.extra_member_billed_cents += fee", "increments Account.version by 1"]

  - method: GET
    path: "/hv/extra-member-slots/{id}"
    description: "Reads one slot."
    roles: [PlatformAdmin, SupportAgent, AccountOwner]
    code: 200
    input: []
    output: ExtraMemberSlot
    side_effects: []

  - method: GET
    path: "/hv/accounts/{id}/extra-member-slots"
    description: "Lists slots of an account."
    roles: [PlatformAdmin, SupportAgent, AccountOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExtraMemberSlot[]
    side_effects: []

  - method: GET
    path: "/hv/extra-member-slots"
    description: "Filtered slot list (by assigned member or payer)."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["member_id?", "payer_member_id?", "status?", "limit?", "offset?"]
    output: ExtraMemberSlot[]
    side_effects: []

  - method: POST
    path: "/hv/extra-member-slots/{id}/assign"
    description: "Assigns an OFFERED slot: creates the EXTRA member on the account. Requires posture VERIFIED and matching region."
    roles: [AccountOwner]
    code: 200
    input: [email, display_name, member_region]
    output: ExtraMemberSlot
    side_effects: ["creates Member (member_role EXTRA)", "slot OFFERED -> ACTIVE, member_id set"]

  - method: POST
    path: "/hv/extra-member-slots/{id}/revoke"
    description: "Revokes an ACTIVE slot with prorated credit (full credit within 7 cycle-days of purchase); assigned member removed."
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: []
    output: ExtraMemberSlot
    side_effects: ["slot ACTIVE -> REVOKED; credit_cents per proration_credit_cents; account.extra_member_credit_cents += credit; assigned Member -> REMOVED"]

  - method: POST
    path: "/hv/extra-member-slots/{id}/reoffer"
    description: "Returns a REVOKED slot to OFFERED, clearing the assigned member."
    roles: [AccountOwner]
    code: 200
    input: []
    output: ExtraMemberSlot
    side_effects: ["slot REVOKED -> OFFERED; member_id cleared"]

  # ---- Verification challenges ----
  - method: POST
    path: "/hv/accounts/{id}/verification-challenges"
    description: "Issues a verification challenge; flips account posture to CHALLENGE_PENDING. PERIODIC challenges are gated by the region's active enforcement policy timing."
    roles: [PlatformAdmin, AccountOwner]
    code: 201
    input: [channel, challenge_reason]
    output: VerificationChallenge
    side_effects: ["account.verification_posture VERIFIED -> CHALLENGE_PENDING"]

  - method: GET
    path: "/hv/verification-challenges/{id}"
    description: "Reads one challenge (applies lazy expiry)."
    roles: [PlatformAdmin, SupportAgent, AccountOwner]
    code: 200
    input: []
    output: VerificationChallenge
    side_effects: ["lazy PENDING -> EXPIRED when now >= expires_at"]

  - method: GET
    path: "/hv/accounts/{id}/verification-challenges"
    description: "Lists challenges of an account."
    roles: [PlatformAdmin, SupportAgent, AccountOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VerificationChallenge[]
    side_effects: []

  - method: POST
    path: "/hv/verification-challenges/{id}/submit"
    description: "Submits a code. Success verifies the challenge and restores posture VERIFIED; wrong codes increment attempts and lock at the channel's attempt cap."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: [code, member_id]
    output: VerificationChallenge
    side_effects: ["success: challenge -> VERIFIED, posture -> VERIFIED, household.last_verified_at = now", "wrong code: attempts_used += 1; at cap -> LOCKED_OUT and posture -> LOCKED"]

  - method: POST
    path: "/hv/verification-challenges/{id}/reissue"
    description: "Reissues an EXPIRED challenge after the 300-second cooldown buffer; new code, attempts reset."
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: []
    output: VerificationChallenge
    side_effects: ["challenge EXPIRED -> PENDING with new code, attempts_used 0, fresh expires_at"]

  # ---- Travel passes ----
  - method: POST
    path: "/hv/devices/{id}/travel-passes"
    description: "Grants a travel pass. ends_at = starts_at + 14d (TEMPORARY_14D) or 30d (TEMPORARY_30D). Half-open overlap check against the device's other ACTIVE passes."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 201
    input: [grant_type, starts_at]
    output: TravelPass
    side_effects: ["device.travel_pass_active recomputed"]

  - method: GET
    path: "/hv/travel-passes/{id}"
    description: "Reads one pass (applies lazy expiry)."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: TravelPass
    side_effects: ["lazy ACTIVE -> EXPIRED when now >= ends_at"]

  - method: GET
    path: "/hv/devices/{id}/travel-passes"
    description: "Lists passes of a device."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TravelPass[]
    side_effects: []

  - method: POST
    path: "/hv/travel-passes/{id}/revoke"
    description: "Revokes an active pass; records a CHURN_SIGNAL metric on the account."
    roles: [AccountOwner]
    code: 200
    input: []
    output: TravelPass
    side_effects: ["pass ACTIVE -> REVOKED; EnforcementMetric CHURN_SIGNAL created"]

  - method: POST
    path: "/hv/travel-passes/{id}/convert"
    description: "Converts a pass when the device is back on the household network; device becomes TRUSTED bypassing the confidence threshold."
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: []
    output: TravelPass
    side_effects: ["pass ACTIVE -> CONVERTED; device UNTRUSTED -> TRUSTED; household.trusted_device_count + 1"]

  # ---- Profile transfers ----
  - method: POST
    path: "/hv/accounts/{id}/profile-transfers"
    description: "Initiates a profile transfer to a new account; snapshots history and recommendations. Expires after 7 days."
    roles: [AccountOwner]
    code: 201
    input: [member_id, target_email]
    output: ProfileTransfer
    side_effects: ["history_snapshot and recommendation_snapshot captured"]

  - method: GET
    path: "/hv/profile-transfers/{id}"
    description: "Reads one transfer (applies lazy expiry)."
    roles: [PlatformAdmin, SupportAgent, AccountOwner]
    code: 200
    input: []
    output: ProfileTransfer
    side_effects: ["lazy AWAITING_ACCEPTANCE -> EXPIRED when now >= expires_at"]

  - method: GET
    path: "/hv/accounts/{id}/profile-transfers"
    description: "Lists transfers sourced from an account."
    roles: [PlatformAdmin, SupportAgent, AccountOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProfileTransfer[]
    side_effects: []

  - method: GET
    path: "/hv/profile-transfers"
    description: "Filtered transfer list (e.g. by member)."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: ProfileTransfer[]
    side_effects: []

  - method: POST
    path: "/hv/profile-transfers/{id}/accept"
    description: "Accepts a transfer with OCC on the transfer version: creates the target account, moves the member (history and recommendations preserved), revokes their extra-member slot with zero credit."
    roles: [PlatformAdmin]
    code: 200
    input: [new_account_email, new_account_region, new_account_plan_tier, expected_profile_transfer_version]
    output: ProfileTransfer
    side_effects: ["creates target Account", "member.account_id -> target account, member_role -> OWNER, status stays ACTIVE", "source ExtraMemberSlot ACTIVE -> REVOKED with credit_cents 0", "increments ProfileTransfer.version by 1"]

  - method: POST
    path: "/hv/profile-transfers/{id}/cancel"
    description: "Cancels a pending transfer."
    roles: [AccountOwner]
    code: 200
    input: []
    output: ProfileTransfer
    side_effects: ["transfer AWAITING_ACCEPTANCE -> CANCELLED"]

  # ---- Playback sessions ----
  - method: POST
    path: "/hv/members/{id}/playback-sessions"
    description: "Starts a playback session. Enforces device trust (or active travel pass), resolution entitlement, and the account-wide concurrent stream cap at play time."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 201
    input: [device_id, requested_resolution]
    output: PlaybackSession
    side_effects: ["member.current_streams + 1"]

  - method: GET
    path: "/hv/playback-sessions/{id}"
    description: "Reads one session."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: PlaybackSession
    side_effects: []

  - method: GET
    path: "/hv/members/{id}/playback-sessions"
    description: "Lists sessions of a member."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlaybackSession[]
    side_effects: []

  - method: GET
    path: "/hv/devices/{id}/playback-sessions"
    description: "Lists sessions on a device."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlaybackSession[]
    side_effects: []

  - method: POST
    path: "/hv/playback-sessions/{id}/end"
    description: "Ends an active session."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: PlaybackSession
    side_effects: ["session ACTIVE -> ENDED; member.current_streams - 1"]

  # ---- Downloads ----
  - method: POST
    path: "/hv/members/{id}/downloads"
    description: "Creates a download. Enforces device trust (or active travel pass) and the account-wide monthly download allowance."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 201
    input: [device_id, title_id]
    output: Download
    side_effects: ["member.downloads_used_this_month + 1"]

  - method: GET
    path: "/hv/downloads/{id}"
    description: "Reads one download (applies lazy 30-day expiry)."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: Download
    side_effects: ["lazy ACTIVE -> EXPIRED 30 days after creation"]

  - method: GET
    path: "/hv/members/{id}/downloads"
    description: "Lists downloads of a member."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["status?", "billing_month?", "limit?", "offset?"]
    output: Download[]
    side_effects: []

  - method: GET
    path: "/hv/devices/{id}/downloads"
    description: "Lists downloads on a device."
    roles: [PlatformAdmin, SupportAgent, AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Download[]
    side_effects: []

  - method: DELETE
    path: "/hv/downloads/{id}"
    description: "Deletes an ACTIVE download, freeing its monthly allowance slot."
    roles: [AccountOwner, HouseholdMember, ExtraMember]
    code: 200
    input: []
    output: Download
    side_effects: ["download ACTIVE -> DELETED; member.downloads_used_this_month - 1"]

  # ---- Enforcement policies ----
  - method: POST
    path: "/hv/enforcement-policies"
    description: "Creates a regional enforcement policy (DRAFT)."
    roles: [PlatformAdmin]
    code: 201
    input: [region_code, enforcement_enabled, grace_days, messaging_variant, effective_from]
    output: EnforcementPolicy
    side_effects: []

  - method: GET
    path: "/hv/enforcement-policies/{id}"
    description: "Reads one policy."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: EnforcementPolicy
    side_effects: []

  - method: GET
    path: "/hv/enforcement-policies"
    description: "Lists policies."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: EnforcementPolicy[]
    side_effects: []

  - method: POST
    path: "/hv/enforcement-policies/{id}/activate"
    description: "Activates a DRAFT policy; retires any other ACTIVE policy for the same region."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EnforcementPolicy
    side_effects: ["policy DRAFT -> ACTIVE; same-region ACTIVE policies -> RETIRED"]

  - method: POST
    path: "/hv/enforcement-policies/{id}/retire"
    description: "Retires an ACTIVE policy."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EnforcementPolicy
    side_effects: ["policy ACTIVE -> RETIRED"]

  # ---- Enforcement metrics & churn summary ----
  - method: POST
    path: "/hv/accounts/{id}/enforcement-metrics"
    description: "Records a churn/complaint/winback signal on an account."
    roles: [PlatformAdmin, SupportAgent]
    code: 201
    input: [metric_type, "notes?"]
    output: EnforcementMetric
    side_effects: []

  - method: GET
    path: "/hv/accounts/{id}/enforcement-metrics"
    description: "Lists metrics of an account."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["metric_type?", "limit?", "offset?"]
    output: EnforcementMetric[]
    side_effects: []

  - method: GET
    path: "/hv/accounts/{id}/churn-summary"
    description: "Computed read: gross and net churn rates per churn_rate_estimate."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: { churn_signals: integer, winbacks: integer, active_flag: integer, gross_churn_rate: number, net_churn_rate: number }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, malformed value, or enum outside the declared set" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or entity_backed id does not resolve" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or member-role caller does not belong to the target account" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "No account with the given id" }
  - { id: ERR_HOUSEHOLD_NOT_FOUND, http: 404, condition: "No household with the given id" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "No member with the given id" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "No device with the given id" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "No extra member slot with the given id" }
  - { id: ERR_CHALLENGE_NOT_FOUND, http: 404, condition: "No verification challenge with the given id" }
  - { id: ERR_TRAVEL_PASS_NOT_FOUND, http: 404, condition: "No travel pass with the given id" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "No profile transfer with the given id" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "No playback session with the given id" }
  - { id: ERR_DOWNLOAD_NOT_FOUND, http: 404, condition: "No download with the given id" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "No enforcement policy with the given id" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match the account's current version" }
  - { id: ERR_STALE_TRANSFER_VERSION, http: 412, condition: "expected_profile_transfer_version does not match the transfer's current version" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Operation requires account.status ACTIVE but the account is SUSPENDED" }
  - { id: ERR_ACCOUNT_CANCELLED, http: 409, condition: "Operation attempted on a CANCELLED account" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity-specific state precondition failed (wrong from-state, terminal-state lockdown, expired transfer)" }
  - { id: ERR_ACCOUNT_NOT_VERIFIED, http: 409, condition: "Operation requires verification_posture VERIFIED (trust device, assign slot)" }
  - { id: ERR_CHALLENGE_LOCKED, http: 409, condition: "Submit against a LOCKED_OUT challenge" }
  - { id: ERR_CHALLENGE_CODE_MISMATCH, http: 422, condition: "Submitted code does not match; attempts_used incremented" }
  - { id: ERR_CHALLENGE_EXPIRED, http: 409, condition: "Submit against a challenge past its expires_at (flips it to EXPIRED)" }
  - { id: ERR_CHALLENGE_COOLDOWN, http: 409, condition: "Reissue attempted before expires_at + 300 seconds" }
  - { id: ERR_ENFORCEMENT_GRACE_ACTIVE, http: 409, condition: "PERIODIC challenge blocked: no ACTIVE enabled policy for the region, or now < effective_from + grace_days" }
  - { id: ERR_TRAVEL_PASS_OVERLAP, http: 409, condition: "New pass window intersects another ACTIVE pass on the same device (half-open intervals; back-to-back allowed)" }
  - { id: ERR_DEVICE_NOT_TRUSTED, http: 403, condition: "Playback/download attempted on a device that is neither TRUSTED nor holding an ACTIVE travel pass" }
  - { id: ERR_REGION_MISMATCH, http: 422, condition: "Extra member assign with member_region different from the account's region_code" }
  - { id: ERR_MEMBER_NOT_IN_ACCOUNT, http: 422, condition: "Challenge submit member_id does not belong to the challenged account" }
  - { id: ERR_TRANSFER_TARGET_SELF, http: 422, condition: "Profile transfer target_email equals the source account's email" }
  - { id: ERR_ACCOUNT_ALREADY_HAS_HOUSEHOLD, http: 409, condition: "Account already has a household with status != DISSOLVED" }
  - { id: ERR_RESOLUTION_NOT_ENTITLED, http: 403, condition: "Requested resolution exceeds the plan tier's maximum" }
  - { id: ERR_STREAM_LIMIT_REACHED, http: 409, condition: "Account-wide ACTIVE sessions already == plan tier max_streams" }
  - { id: ERR_DOWNLOAD_LIMIT_REACHED, http: 409, condition: "Account-wide ACTIVE downloads this billing month already == plan tier monthly_downloads" }
  - { id: ERR_SLOT_LIMIT_EXCEEDED, http: 422, condition: "Slots in OFFERED/ACTIVE already == plan tier max_extra_slots (BASIC: 0)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; full administrative surface including clock, billing simulation, policies, and transfer acceptance."
    identity: "opaque"
    exclusive_operations: ["create account", "suspend/reactivate account", "simulate billing", "set clock", "manage enforcement policies", "accept profile transfer", "list all accounts/slots/transfers"]
    shared_operations: ["read any resource", "issue/reissue challenges", "record enforcement metrics", "cancel account", "revoke slot", "convert travel pass"]
  - name: SupportAgent
    description: "Customer support; read-mostly plus complaint/churn metric recording."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["read any resource", "record enforcement metrics"]
  - name: AccountOwner
    description: "The OWNER member of an account; administers household, devices, members, slots, challenges, and transfers for their own account."
    identity: "entity_backed:Member"
    exclusive_operations: ["create household", "relocate/dissolve household", "add/remove members", "trust/untrust/remove devices", "purchase/assign/revoke/reoffer slots", "initiate/cancel profile transfer", "change plan"]
    shared_operations: ["read own account resources", "register/signal devices", "submit verification codes", "start/end playback sessions", "create/delete downloads", "create travel passes", "issue/reissue challenges", "cancel own account"]
  - name: HouseholdMember
    description: "A HOUSEHOLD member; consumes content and manages own devices/passes within the household."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations: ["read own account resources", "register/signal devices", "submit verification codes", "start/end playback sessions", "create/delete downloads", "create travel passes"]
  - name: ExtraMember
    description: "An EXTRA member occupying a purchased slot; same consumption surface as a household member."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations: ["read own account resources", "register/signal devices", "submit verification codes", "start/end playback sessions", "create/delete downloads", "create travel passes"]
