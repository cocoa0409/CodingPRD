            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
          trigger:
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { v1: $.data.version }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { v1_again: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech2_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 30, expected_system_version: "${v1}" }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { rec1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { v2: $.data.version }
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sys1_id}", plan_type: "RETROFIT", target_refrigerant_type_id: "${rt448_id}", due_on: "2026-10-01T00:00:00Z", estimated_cost_usd: 120000.00, expected_system_version: "${v2}" }
