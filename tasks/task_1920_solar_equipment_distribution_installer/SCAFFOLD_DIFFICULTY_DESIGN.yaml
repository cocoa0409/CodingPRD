scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: landed_cost_provisional_vs_final_differ_on_tariff_change
        grounds:
          - calculations.landed_cost_per_unit
          - entities.InventoryLot.fields.unit_cost_cents_provisional
          - entities.InventoryLot.fields.unit_cost_cents_final
          - state_machines.Container.ARRIVED_to_RECEIVED
        distinguishing_aspect: |
          InventoryLot's provisional unit cost (computed at ContainerLine create
          using the booking-time TariffRate) MUST differ from the final unit cost
          (computed at container receive using the arrival-time TariffRate) when
          the tariff rate changed between booking and arrival. Operates on the
          InventoryLot/Container domain (cost accounting).
        test_recipe:
          setup:
            - "TariffRate R1 for HTS=8541.43: duty_rate_bp=1000 (10%), effective 2026-07-01, open-ended"
            - "Product MODULE P1 with hts_code=8541.43"
            - "Container C1 booked 2026-08-01, freight=100000c, insurance=20000c"
            - "ContainerLine L1 on C1: P1, qty_booked=10, declared=50000c/unit (total declared 500000c)"
            - "After C1 booked, NEW TariffRate R2 supersedes R1 effective 2026-08-15 with duty_rate_bp=2000 (20%); R1.effective_to set to 2026-08-15"
            - "Container departs 2026-08-05; arrives 2026-08-20 (after R2 effective)"
            - "Logical clock moved to 2026-08-20 before arrive"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "MOD-400", product_kind: "MODULE", manufacturer_name: "SolarCo", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/containers"
              payload: { container_number: "MSKU123", bol_number: "BL-1", origin_port: "CNSHA", eta_utc: "2026-08-20T00:00:00Z", freight_cost_cents: 100000, insurance_cost_cents: 20000 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 10, declared_unit_value_cents: 50000 }
              as: DistributionAdmin
              captures: { line_id: $.data.id, lot_id: $.data.inventory_lot_id }
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 2000, effective_from: "2026-08-15T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cont_v_arrived: $.data.version }
          trigger:
            - call: "GET /solar-dist/inventory-lots/${lot_id}"
              payload: {}
              as: DistributionAdmin
              captures: { prov_cost: $.data.unit_cost_cents_provisional }
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cont_v_arrived}"
                line_receipts: [{ container_line_id: "${line_id}", qty_received: 10, qty_damaged: 0 }]
              as: DistributionAdmin
            - call: "GET /solar-dist/inventory-lots/${lot_id}"
              payload: {}
              as: DistributionAdmin
              captures: { final_cost: $.data.unit_cost_cents_final }
          assert:
            - "Provisional: base=500000, duty=10% × 500000 = 50000, freight_share=100000, insurance=20000; total=670000; provisional_unit = 670000/10 = 67000"
            - "Final: base=500000, duty=20% × 500000 = 100000, freight_share=100000, insurance=20000; total=720000; final_unit = 720000/10 = 72000"
            - "InventoryLot.${lot_id}.unit_cost_cents_provisional == 67000"
            - "InventoryLot.${lot_id}.unit_cost_cents_final == 72000"
            - "InventoryLot.${lot_id}.unit_cost_cents_provisional != InventoryLot.${lot_id}.unit_cost_cents_final"

      - name: progress_vs_pto_invoice_split_reconciles_to_avc
        grounds:
          - calculations.progress_invoice_amount
          - entities.Invoice.fields.amount_cents
          - entities.Project.fields.payment_status
        distinguishing_aspect: |
          PROGRESS invoice uses the progress_payment_pct_bp fraction of AVC; PTO
          invoice uses the REMAINDER (avc - progress), NOT a recompute against a
          second percentage. The two variants operate on the Invoice/Project
          domain (progress-payment ledger), and their sum MUST equal AVC exactly
          — the rounding residue always lands on the PTO invoice. Different
          entity domain from the landed-cost instance.
        test_recipe:
          setup:
            - "Module MOD-400 product; Inverter INV-5k product"
            - "CompatibilityRule: 10..20 modules per inverter"
            - "Installer with progress_payment_pct_bp=8000 (80%) and credit_limit=10000000c"
            - "Project with 10 modules + 1 inverter, design locked"
            - "Container arrived with final landed cost module=67000c, inverter=300000c"
            - "Allocate 10 modules (10 × 67000 = 670000) + 1 inverter (1 × 300000 = 300000); AVC = 970000c"
            - "Ship both allocations → fulfillment SHIPPED → PROGRESS invoice auto-issued"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8504.40", duty_rate_bp: 500, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "MOD-400", product_kind: "MODULE", manufacturer_name: "SolarCo", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "INV-5K", product_kind: "INVERTER", manufacturer_name: "InvertCo", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 3, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/compatibility-rules"
              payload: { module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", max_modules_per_inverter: 20, min_modules_per_inverter: 10, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "SunInstall LLC", license_number: "CA-C10-12345", credit_limit_cents: 10000000, progress_payment_pct_bp: 8000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/installers/${inst_id}/projects"
              payload: { project_name: "Residence 5kW", site_postal_code: "94110", module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", module_qty: 10, inverter_qty: 1 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /solar-dist/projects/${proj_id}/lock-design"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/containers"
              payload: { container_number: "MSKU200", bol_number: "BL-2", origin_port: "CNSHA", eta_utc: "2026-08-05T00:00:00Z", freight_cost_cents: 50000, insurance_cost_cents: 10000 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 10, declared_unit_value_cents: 50000 }
              as: DistributionAdmin
              captures: { line_mod_id: $.data.id, lot_mod_id: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${inv_id}", qty_booked: 1, declared_unit_value_cents: 250000 }
              as: DistributionAdmin
              captures: { line_inv_id: $.data.id, lot_inv_id: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cont_v: $.data.version }
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cont_v}"
                line_receipts:
                  - { container_line_id: "${line_mod_id}", qty_received: 10, qty_damaged: 0 }
                  - { container_line_id: "${line_inv_id}", qty_received: 1, qty_damaged: 0 }
              as: DistributionAdmin
            - call: "GET /solar-dist/inventory-lots/${lot_mod_id}"
              payload: {}
              as: DistributionAdmin
              captures: { lot_mod_v: $.data.version }
            - call: "POST /solar-dist/projects/${proj_id}/allocations"
              payload: { inventory_lot_id: "${lot_mod_id}", qty_allocated: 10, expected_lot_version: "${lot_mod_v}" }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { alloc_mod_id: $.data.id }
            - call: "GET /solar-dist/inventory-lots/${lot_inv_id}"
              payload: {}
              as: DistributionAdmin
              captures: { lot_inv_v: $.data.version }
            - call: "POST /solar-dist/projects/${proj_id}/allocations"
              payload: { inventory_lot_id: "${lot_inv_id}", qty_allocated: 1, expected_lot_version: "${lot_inv_v}" }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { alloc_inv_id: $.data.id }
            - call: "POST /solar-dist/allocations/${alloc_mod_id}/ship"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/allocations/${alloc_inv_id}/ship"
              payload: {}
              as: DistributionAdmin
              captures: { _ignored: $.data.id }
            - call: "GET /solar-dist/projects/${proj_id}/invoices"
              payload: {}
              as: ChannelManager
              captures: { progress_inv_amount: $.data.0.amount_cents, progress_inv_id: $.data.0.id }
          trigger:
            # Drive permit approval so PTO can be invoiced
            - call: "GET /solar-dist/projects/${proj_id}/permit-packages"
              payload: {}
              as: ChannelManager
              captures: { pkg_id: $.data.0.id, pkg_docs: $.data.0.required_documents }
            - call: "POST /solar-dist/permit-packages/${pkg_id}/documents"
              payload: { document_slug: "spec-sheet-module" }
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/permit-packages/${pkg_id}/documents"
              payload: { document_slug: "spec-sheet-inverter" }
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/permit-packages/${pkg_id}/documents"
              payload: { document_slug: "site-plan" }
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/permit-packages/${pkg_id}/documents"
              payload: { document_slug: "warranty-registration" }
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/permit-packages/${pkg_id}/submit"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/permit-packages/${pkg_id}/approve"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/projects/${proj_id}/invoice-pto"
              payload: {}
              as: ChannelManager
              captures: { pto_inv: $.data }
          assert:
            - "AVC = 10 × 67000 + 1 × 300000 = 670000 + 300000 = 970000"
            - "PROGRESS invoice amount = round_half_up(970000 × 8000 / 10000) = 776000"
            - "PTO invoice amount = AVC - PROGRESS = 970000 - 776000 = 194000 (NOT a second recompute against a 2000bp fraction; rounding residue lands on PTO)"
            - "Invoice.${progress_inv_id}.amount_cents == 776000"
            - "Invoice.${pto_inv.id}.amount_cents == 194000"
            - "Invoice.${progress_inv_id}.amount_cents + Invoice.${pto_inv.id}.amount_cents == 970000"
            - "Project.${proj_id}.payment_status == PTO_BILLED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: landed_cost_nested_min_max_per_line_then_sum
        grounds:
          - calculations.landed_cost_per_unit
        distinguishing_aspect: |
          Mode (a): the formula has ≥3 inputs (declared value, duty rate,
          freight, insurance) with non-linear interaction via per-line waterfall
          allocation (each line's duty depends on its own declared value AND
          the proportional freight/insurance share depends on the ratio of this
          line's declared value to the container's total declared value). The
          per-line share fractions are rounded BEFORE summing across the
          container.
        test_recipe:
          setup:
            - "Two products with different HTS codes (different duty rates)"
            - "One container with two lines of unequal declared value (300000c vs 700000c)"
            - "freight=100000c, insurance=20000c — allocated pro-rata by declared value"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8504.40", duty_rate_bp: 500, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "MOD-X", product_kind: "MODULE", manufacturer_name: "SolarCo", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "INV-Y", product_kind: "INVERTER", manufacturer_name: "InvertCo", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 3, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/containers"
              payload: { container_number: "C1", bol_number: "B1", origin_port: "CNSHA", eta_utc: "2026-08-10T00:00:00Z", freight_cost_cents: 100000, insurance_cost_cents: 20000 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 10, declared_unit_value_cents: 30000 }
              as: DistributionAdmin
              captures: { line_mod: $.data.id, lot_mod: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${inv_id}", qty_booked: 1, declared_unit_value_cents: 700000 }
              as: DistributionAdmin
              captures: { line_inv: $.data.id, lot_inv: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cv}"
                line_receipts:
                  - { container_line_id: "${line_mod}", qty_received: 10, qty_damaged: 0 }
                  - { container_line_id: "${line_inv}", qty_received: 1, qty_damaged: 0 }
              as: DistributionAdmin
            - call: "GET /solar-dist/inventory-lots/${lot_mod}"
              payload: {}
              as: DistributionAdmin
              captures: { mod_final: $.data.unit_cost_cents_final }
            - call: "GET /solar-dist/inventory-lots/${lot_inv}"
              payload: {}
              as: DistributionAdmin
              captures: { inv_final: $.data.unit_cost_cents_final }
          assert:
            - "Total declared = 10×30000 + 1×700000 = 300000 + 700000 = 1000000"
            - "Line MOD: base=300000, duty=30000, freight_share=round_half_up(100000 × 300000/1000000)=30000, insurance=round_half_up(20000 × 300000/1000000)=6000; landed=366000; unit=36600"
            - "Line INV: base=700000, duty=round_half_up(700000×500/10000)=35000, freight_share=round_half_up(100000 × 700000/1000000)=70000, insurance=round_half_up(20000 × 700000/1000000)=14000; landed=819000; unit=819000"
            - "InventoryLot.${lot_mod}.unit_cost_cents_final == 36600"
            - "InventoryLot.${lot_inv}.unit_cost_cents_final == 819000"

      - name: credit_exposure_nested_rounding_then_sum_vs_sum_then_round
        grounds:
          - calculations.credit_exposure
          - calculations.rma_credit_amount
        distinguishing_aspect: |
          Mode (b): nested rounding where ORDER matters. RMA credit amounts are
          computed per-line (qty_approved × unit_cost snapshot), then a single
          CREDIT_MEMO invoice is created whose amount is the negative of that
          per-claim rounded value. The credit then applies oldest-first across
          open invoices. If the implementation instead summed unrounded
          fractional credits then rounded once at the end, the result would
          differ by cents. We pin per-claim rounding THEN summation across the
          waterfall (credit applied to invoices oldest-first, floor 0 per
          invoice, residual carried).
        test_recipe:
          setup:
            - "Installer with two shipped allocations of the same module (snapshot 66667c/unit each — chosen to expose a rounding artifact if summed unrounded)"
            - "Two RMA claims approved for qty=3 units each"
            - "Each claim's credit = 3 × 66667 = 200001c (round per claim)"
            - "Two open invoices: Inv1 = 150000c (oldest), Inv2 = 300000c"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "MOD-Z", product_kind: "MODULE", manufacturer_name: "SolarCo", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "INV-Z", product_kind: "INVERTER", manufacturer_name: "InvertCo", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 3, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8504.40", duty_rate_bp: 500, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/compatibility-rules"
              payload: { module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", max_modules_per_inverter: 20, min_modules_per_inverter: 5, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "RndTest", license_number: "L1", credit_limit_cents: 100000000, progress_payment_pct_bp: 10000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/installers/${inst_id}/projects"
              payload: { project_name: "P1", site_postal_code: "94110", module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", module_qty: 6, inverter_qty: 1 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /solar-dist/projects/${proj_id}/lock-design"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/containers"
              payload: { container_number: "C2", bol_number: "B2", origin_port: "CNSHA", eta_utc: "2026-08-05T00:00:00Z", freight_cost_cents: 0, insurance_cost_cents: 0 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 6, declared_unit_value_cents: 60609 }
              as: DistributionAdmin
              captures: { line_mod: $.data.id, lot_mod: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cv: $.data.version }
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cv}"
                line_receipts: [{ container_line_id: "${line_mod}", qty_received: 6, qty_damaged: 0 }]
              as: DistributionAdmin
            - call: "GET /solar-dist/inventory-lots/${lot_mod}"
              payload: {}
              as: DistributionAdmin
              captures: { lot_v: $.data.version, snapshot_cost: $.data.unit_cost_cents_final }
            # Two allocations of 3 modules each, both shipped
            - call: "POST /solar-dist/projects/${proj_id}/allocations"
              payload: { inventory_lot_id: "${lot_mod}", qty_allocated: 3, expected_lot_version: "${lot_v}" }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { alloc1: $.data.id }
            - call: "GET /solar-dist/inventory-lots/${lot_mod}"
              payload: {}
              as: DistributionAdmin
              captures: { lot_v2: $.data.version }
            - call: "POST /solar-dist/projects/${proj_id}/allocations"
              payload: { inventory_lot_id: "${lot_mod}", qty_allocated: 3, expected_lot_version: "${lot_v2}" }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { alloc2: $.data.id }
            - call: "POST /solar-dist/allocations/${alloc1}/ship"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/allocations/${alloc2}/ship"
              payload: {}
              as: DistributionAdmin
            - call: "GET /solar-dist/projects/${proj_id}/invoices"
              payload: {}
              as: ChannelManager
              captures: { prog_inv: $.data.0.id }
          trigger:
            # Two RMA claims, 3 units each
            - call: "POST /solar-dist/rma-claims"
              payload: { installer_id: "${inst_id}", product_id: "${mod_id}", allocation_id: "${alloc1}", qty_claimed: 3 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { rma1: $.data.id }
            - call: "POST /solar-dist/rma-claims/${rma1}/submit"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/rma-claims/${rma1}/approve"
              payload: { qty_approved: 3 }
              as: ChannelManager
            - call: "POST /solar-dist/rma-claims"
              payload: { installer_id: "${inst_id}", product_id: "${mod_id}", allocation_id: "${alloc2}", qty_claimed: 3 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { rma2: $.data.id }
            - call: "POST /solar-dist/rma-claims/${rma2}/submit"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/rma-claims/${rma2}/approve"
              payload: { qty_approved: 3 }
              as: ChannelManager
            - call: "POST /solar-dist/rma-claims/${rma1}/issue-credit"
              payload: {}
              as: CreditOfficer
            - call: "POST /solar-dist/rma-claims/${rma2}/issue-credit"
              payload: {}
              as: CreditOfficer
            - call: "GET /solar-dist/installers/${inst_id}"
              payload: {}
              as: CreditOfficer
              captures: { exposure: $.data.credit_exposure_cents }
          assert:
            - "Per-line: duty=round_half_up(6×60609×1000/10000)=round_half_up(36365.4)=36365; landed_total=363654+36365=400019; unit=round_half_up(400019/6)=66670"
            - "Snapshot unit_cost_cents_at_allocation = 66670 (same for both allocations)"
            - "PROGRESS invoice (100% at ship) = 6 × 66670 = 400020"
            - "RMA1 credit = 3 × 66670 = 200010; RMA2 credit = 3 × 66670 = 200010"
            - "After both credits: invoice balance_due = 400020 - 200010 - 200010 = 0"
            - "Installer.${inst_id}.credit_exposure_cents == 0"
            - "If implementation had computed per-claim unrounded (3 × 66669.8333...) then rounded at the END (400019.5 → 400020), credit would still equal 400020 — but the snapshot is computed PER LINE then divided by qty_received. Per-line rounding at receive time is the pinned behavior: unit = 66670, NOT 66669."
            - "InventoryLot.${lot_mod}.unit_cost_cents_final == 66670"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Project
          - entities.Project.fields.payment_status
          - entities.Project.fields.fulfillment_status
        distinguishing_aspect: |
          Project has TWO independent state dimensions (payment_status ×
          fulfillment_status) evolving in parallel on the same entity. Payment
          can reach PAID_IN_FULL before fulfillment completes; conversely
          fulfillment can reach SHIPPED before PTO invoice. The terminal
          COMPLETE state requires BOTH dimensions aligned (SHIPPED ×
          PAID_IN_FULL + permit APPROVED).
        test_recipe:
          setup:
            - "Project with fulfillment SHIPPED but payment still PROGRESS_BILLED"
            - "Permit approved, PTO invoice issued, both invoices fully paid"
            - "Verify payment_status=PAID_IN_FULL while fulfillment_status=SHIPPED (independent)"
            - "Then complete project"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
