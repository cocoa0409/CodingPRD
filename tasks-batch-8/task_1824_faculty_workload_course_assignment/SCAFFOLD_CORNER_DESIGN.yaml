  # ===========================================================================
  - section: endpoints
    instances:
      - name: c_response_envelope_shape
        claim_type: standard_crud
        grounds: ["response_envelope", "endpoints[GET /workload-terms/{termId}]"]
        distinguishing_aspect: "Every response carries the fixed envelope: meta.api_request_id + api_request_timestamp, response_type object for singleton GET and array for list GET with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["one term created"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "GET /workload-terms/${t_id}", as: DepartmentChair }
            - { call: "GET /workload-terms", as: DepartmentChair }
          assert:
            - "Singleton GET: response_type == object, meta.api_request_id is a non-empty string, data.id == ${t_id}"
            - "List GET: response_type == array, pagination fields limit/offset/total_count/has_more present with defaults limit 10 offset 0 total_count 1 has_more false"

      - name: c_close_census_reconciliation
        claim_type: computed_read
        grounds: ["endpoints[POST /workload-terms/{termId}/close-census]"]
        excluded_because:
          difficulty_instance: assignment_credit_provisional_vs_census_final
          rationale: "Census recompute + LoadSheet basis flip asserted with literal values in the named §1.8 instance."

