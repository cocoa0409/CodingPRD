  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_substantiated_incident_to_payout_zeroing_depth_six
        grounds:
          - state_machines.SafetyIncident.TRIAGED_to_SUBSTANTIATED
          - state_machines.Cook.CLEAR_to_SUSPENDED
          - state_machines.MenuItem.APPROVED_to_DELISTED
          - state_machines.ProductionWindow.OPEN_to_CANCELLED
          - state_machines.Order.ROUTED_to_CANCELLED
          - calculations.cook_safety_score
        distinguishing_aspect: |
          CASCADE-A end to end, six links deep from a single write: incident SUBSTANTIATED (1) ->
          safety_score recomputed to 50 (2) -> compliance_standing SUSPENDED (3) -> the APPROVED
          MenuItem DELISTED with delist_reason COOK_SUSPENDED (4) -> the ProductionWindow CANCELLED
          with cancelled_reason NO_APPROVED_MENU because the cook now has zero approved items (5)
          -> the ROUTED Order CANCELLED with cancelled_reason WINDOW_CANCELLED, payment VOIDED,
          committed_meals returned and pending_payout_cents recomputed to 0 (6). Each link has its
          own distinct reason code, so a truncated implementation is visible at the exact depth it
          stops.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Hana is ACTIVE and CLEAR with safety_score 100."
            - "Hana owns exactly one APPROVED MenuItem at 1500 cents - the only approved item, so delisting it empties her menu."
            - "One OPEN ProductionWindow with capacity_meals 10 and one order of quantity 2 in fulfillment_status ROUTED, payment_status AUTHORIZED, committed_meals 2."
            - "One CRITICAL SafetyIncident with subject_type ORDER on that order, triaged ACCEPT by officer so-1 (severity_points 50)."
          setup_api_calls:
            - call: "POST /state-policies"
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_ca_id: $.data.id }
            - call: "POST /cooks"
              payload: { legal_name: "Hana Iqbal", email: "hana@example.com", state_code: "CA", claimed_kitchen_type: "HOME_INSPECTED", weekly_capacity_meals: 10 }
              as: Anonymous
              captures: { cook_id: $.data.id, cook_v0: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-8080", issuing_authority: "CA DPH", issued_on: "2026-04-01", expires_on: "2028-04-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_doc_id: $.data.id }
            - call: "GET /cooks/${cook_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { cook_v1: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_INSPECTED", inspection_date: "2026-07-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_doc_id: $.data.id }
            - call: "POST /onboarding-documents/${cert_doc_id}/review"
              payload: { decision: "VERIFY" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /onboarding-documents/${insp_doc_id}/review"
              payload: { decision: "PASS" }
              as: ComplianceReviewer
              as_user_id: "rev-2"
            - call: "POST /cooks/${cook_id}/onboarding-decision"
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /menu-items"
              payload: { cook_id: "${cook_id}", name: "Chana Masala Pot", food_category: "NON_TCS", allergens: ["MUSTARD"], allergen_free_attested: false, shelf_life_days: 6, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 1500, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_id: $.data.id }
            - call: "POST /menu-items/${mi_id}/submit"
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /menu-items/${mi_id}/review"
              payload: { decision: "APPROVE", allergen_review_notes: "mustard declared" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /production-windows"
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 10 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { pw_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { state_policy_id: "${sp_ca_id}", zone_code: "CA-DOOR-5", state_code: "CA", service_mode: "DOOR_DELIVERY", postal_codes: ["94110"], max_cold_chain_minutes: 180 }
              as: PlatformAdmin
              captures: { dz_id: $.data.id }
            - call: "POST /orders"
              payload: { menu_item_id: "${mi_id}", production_window_id: "${pw_id}", delivery_zone_id: "${dz_id}", quantity: 2, diner_contact_email: "d1@example.com" }
              as: Diner
              as_user_id: "diner-1"
              captures: { o1_id: $.data.id }
            - call: "POST /orders/${o1_id}/route"
              payload: {}
              as: PlatformAdmin
            - call: "POST /safety-incidents"
              payload: { cook_id: "${cook_id}", subject_type: "ORDER", category: "FOODBORNE_ILLNESS", severity: "CRITICAL", description: "hospitalisation reported after handoff", occurred_at: "2026-08-01T12:00:00Z", order_id: "${o1_id}" }
              as: Diner
              as_user_id: "diner-1"
              captures: { inc_id: $.data.id }
            - call: "POST /safety-incidents/${inc_id}/triage"
              payload: { decision: "ACCEPT" }
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /safety-incidents/${inc_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE", resolution_note: "lab confirmed pathogen match" }
              as: SafetyOfficer
              as_user_id: "so-2"
          assert:
            - "link 1: SafetyIncident.${inc_id}.status == SUBSTANTIATED AND severity_points == 50 AND adjudicated_by_user_id == so-2"
            - "link 2: Cook.${cook_id}.safety_score == 50"
            - "link 3: Cook.${cook_id}.compliance_standing == SUSPENDED AND standing_reason == SAFETY_SCORE_SUSPEND AND onboarding_status == ACTIVE"
            - "link 4: MenuItem.${mi_id}.review_status == DELISTED AND delist_reason == COOK_SUSPENDED"
            - "link 5: ProductionWindow.${pw_id}.status == CANCELLED AND cancelled_reason == NO_APPROVED_MENU"
            - "link 6: Order.${o1_id}.fulfillment_status == CANCELLED AND cancelled_reason == WINDOW_CANCELLED AND payment_status == VOIDED"
            - "link 6: ProductionWindow.${pw_id}.committed_meals == 0"
            - "link 6: Cook.${cook_id}.pending_payout_cents == 0"
            - "Cook.${cook_id}.ytd_cottage_revenue_cents == 0 (a voided authorisation recognises no revenue)"

      - name: cascade_b_window_close_to_cap_reached_menu_bounce_depth_four
        grounds:
          - state_machines.ProductionWindow.IN_PRODUCTION_to_CLOSED
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - calculations.cottage_revenue_recognition
          - calculations.cottage_cap_projection
          - state_machines.MenuItem.APPROVED_to_DELISTED
          - state_machines.MenuItem.UNDER_REVIEW_to_REVISION_REQUESTED
        distinguishing_aspect: |
          CASCADE-B, four links from one window advance, and the fourth link FORKS by the target
          menu item's own state: window CLOSED (1) -> both HANDED_OFF orders CAPTURED with
          effective_year stamped (2) -> ytd_gross_sales_cents / ytd_cottage_revenue_cents /
          pending_payout_cents recomputed (3) -> cap_status becomes CAP_REACHED, which DELISTS the
          APPROVED item with delist_reason CAP_REACHED and, in the same cascade link, bounces the UNDER_REVIEW
          item back to REVISION_REQUESTED with revision_round 1 (4). Two menu items in different
          states must take two different edges from the same cascade link.
