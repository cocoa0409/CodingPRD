      - name: err_installment_not_payable_is_triggered_by_the_priority_conflict_probe
        claim_type: Error triggerable
        grounds:
          - "errors[ERR_INSTALLMENT_NOT_PAYABLE]"
        distinguishing_aspect: |
          The code is reachable from three states (SCHEDULED, PAID, ACCELERATED); the depth
          probe drives the SCHEDULED case with a competing fiscal violation.
        excluded_because:
          difficulty_instance: state_beats_fiscal_when_paying_a_scheduled_installment_with_a_wrong_amount
          rationale: "The depth probe already triggers ERR_INSTALLMENT_NOT_PAYABLE and pins it against ERR_PAYMENT_AMOUNT_MISMATCH, so a breadth instance would only re-trigger the same code from the same state."

      - name: err_4204_bond_insufficient_is_triggered_by_the_priority_conflict_probe
        claim_type: Error triggerable
        grounds:
          - "errors[ERR_4204_BOND_INSUFFICIENT]"
        distinguishing_aspect: |
          The bond shortfall is only interesting alongside the competing assumption
          failure, which is what fixes the tier order.
        excluded_because:
          difficulty_instance: safety_beats_constraint_when_certifying_an_underbonded_unassumed_sale
          rationale: "The depth probe triggers ERR_4204_BOND_INSUFFICIENT with ERR_4204_OBLIGATION_NOT_ASSUMED also violated; the assumption code alone is triggered here by certifying_a_sale_exemption_the_buyer_has_not_assumed_is_rejected."

      - name: err_valuation_year_missing_is_triggered_by_the_lookback_certification_probe
        claim_type: Error triggerable
        grounds:
          - "errors[ERR_VALUATION_YEAR_MISSING]"
        distinguishing_aspect: |
          The code fires once per uncertified lookback year, so the interesting trigger is
          the walk across all five years rather than any single one.
        excluded_because:
          difficulty_instance: assessment_creation_requires_every_lookback_valuation_certified
          rationale: "The depth probe triggers ERR_VALUATION_YEAR_MISSING five times in one chain, certifying one more year between each attempt."

      - name: err_review_request_not_decided_is_triggered_by_the_referential_priority_probe
        claim_type: Error triggerable
        grounds:
          - "errors[ERR_REVIEW_REQUEST_NOT_DECIDED]"
        distinguishing_aspect: |
          The code is only distinguishable from ERR_ARBITRATION_WINDOW_CLOSED when both
          conditions hold at once.
        excluded_because:
          difficulty_instance: referential_beats_temporal_when_arbitrating_a_pending_review_after_the_outer_window
          rationale: "The depth probe triggers ERR_REVIEW_REQUEST_NOT_DECIDED while the temporal rule is violated on the same call, which is the only configuration where the code's precedence is observable."

      - name: err_contribution_period_overlap_is_triggered_by_the_interval_semantics_probe
        claim_type: Error triggerable
        grounds:
          - "errors[ERR_CONTRIBUTION_PERIOD_OVERLAP]"
        distinguishing_aspect: |
          The code must fire on a one-year touch and must NOT fire on adjacency, so it is
          inseparable from its own negative case.
        excluded_because:
          difficulty_instance: contribution_record_plan_year_intervals_are_closed_and_adjacency_is_allowed
          rationale: "The depth probe triggers ERR_CONTRIBUTION_PERIOD_OVERLAP on a touching interval in the same chain that proves adjacency is accepted."

      - name: err_valuation_window_conflict_is_triggered_by_the_quiet_buffer_probe
        claim_type: Error triggerable
        grounds:
          - "errors[ERR_VALUATION_WINDOW_CONFLICT]"
        distinguishing_aspect: |
          The code fires on the day before the quiet buffer expires and must not fire on
          the buffer boundary itself.
        excluded_because:
          difficulty_instance: valuation_measurement_windows_are_half_open_with_a_thirty_day_quiet_buffer
          rationale: "The depth probe triggers ERR_VALUATION_WINDOW_CONFLICT one day inside the buffer and accepts the window that starts exactly at its end."

      - name: err_unamortizable_assessment_is_triggered_by_the_mass_withdrawal_variant_probe
        claim_type: Error triggerable
        grounds:
          - "errors[ERR_UNAMORTIZABLE_ASSESSMENT]"
        distinguishing_aspect: |
          The code only exists in the uncapped mass-withdrawal variant, where forgiveness
          is disapplied; the same numbers under the capped variant must succeed.
        excluded_because:
          difficulty_instance: amortization_cap_variant_capped_forgiveness_versus_mass_withdrawal_rejection
          rationale: "The depth probe triggers ERR_UNAMORTIZABLE_ASSESSMENT under mass_withdrawal_declared and shows the identical fixture being forgiven down to 20 years without it."

  # =======================================================================
  # SECTION: rbac - five roles under a segregation-of-duties model with one
  # entity-backed identity.
  # =======================================================================
  - section: rbac
    instances:

      - name: every_role_can_read_the_plan_registry
        claim_type: Shared operations
        grounds:
          - "roles.FundAdministrator"
          - "roles.Arbitrator"
          - "endpoints[GET /plans/{plan_id}]"
        distinguishing_aspect: |
          All five roles share every read endpoint, which is the deliberate asymmetry of
          this design: authority is segregated on writes only, because an arbitrator who
          cannot read the plan's pinned allocation method cannot rule on it. A server that
          scopes reads by role blocks the Arbitrator and the EmployerRepresentative first.
        test_recipe:
          setup:
            - "One plan exists with allocation_method MODIFIED_PRESUMPTIVE and interest_rate_bps 700."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanTrustee
              as_user_id: "tr-001"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-001"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: EmployerRepresentative
              as_user_id: "emp-unrelated"
          assert:
            - "All five calls return HTTP 200 with identical data payloads."
            - "Each response reports data.allocation_method == \"MODIFIED_PRESUMPTIVE\", data.interest_rate_bps == 700, data.employer_count == 0 and data.mass_withdrawal_declared == false."
            - "The EmployerRepresentative read succeeds even though the X-User-ID names no Employer row: the ownership rule at priority 6 governs writes only."

      - name: a_fund_administrator_cannot_issue_a_notice_and_demand
        claim_type: Exclusive operations
        grounds:
          - "roles.PlanTrustee"
          - "validations[priority=2]"
          - "errors[ERR_ROLE_NOT_PERMITTED]"
        distinguishing_aspect: |
          Issuance is the trustee's exclusive act, and the fund administrator is the role
          that created every row leading up to it - so an implementation that grants the
          creator implicit authority over its own aggregate fails here. The role check at
          priority 2 must also precede the priority-9 segregation-of-duties check, which
          the same request would otherwise pass.
        test_recipe:
          setup:
            - "The baseline with a DRAFT assessment ready to issue."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
