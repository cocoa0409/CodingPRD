      - name: get_certificate_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /certificates/{id}]
          - errors[ERR_CO_NOT_FOUND]
        distinguishing_aspect: "GET /certificates/{id} with a non-existent UUID returns ERR_CO_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /certificates/00000000-0000-4000-8000-000000000015"
              payload: {}
              as: BuildingOfficial
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CO_NOT_FOUND"
            - "response HTTP status == 404"

      - name: create_permit_missing_fee_method_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /permits]
          - errors[ERR_INVALID_REQUEST]
          - entities.PermitApplication.fields.fee_method
        distinguishing_aspect: "POST /permits omitting the required fee_method field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Jurisdiction and a Contractor exist."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-e2", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Ce2", license_number: "E-2", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", declared_valuation: 2000 }
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: create_permit_bad_work_class_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints[POST /permits]
          - errors[ERR_INVALID_REQUEST]
          - entities.PermitApplication.fields.work_class
        distinguishing_aspect: "POST /permits with work_class outside {NEW_CONSTRUCTION,ADDITION,ALTERATION,REPAIR} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Jurisdiction and a Contractor exist."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-e3", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Ce3", license_number: "E-3", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "DEMOLITION", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: create_permit_unknown_jurisdiction_returns_404
        claim_type: Parent Relationships
        grounds:
          - endpoints[POST /permits]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - entities.PermitApplication.fields.jurisdiction_id
        distinguishing_aspect: "POST /permits referencing a non-existent jurisdiction_id returns ERR_JURISDICTION_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A Contractor exists; no Jurisdiction with the referenced id."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { business_name: "Ce4", license_number: "E-4", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "00000000-0000-4000-8000-000000000001", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_JURISDICTION_NOT_FOUND"
            - "response HTTP status == 404"

      - name: create_permit_unknown_contractor_returns_404
        claim_type: Parent Relationships
        grounds:
          - endpoints[POST /permits]
          - errors[ERR_CONTRACTOR_NOT_FOUND]
          - entities.PermitApplication.fields.contractor_id
        distinguishing_aspect: "POST /permits referencing a non-existent contractor_id returns ERR_CONTRACTOR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A Jurisdiction exists; no Contractor with the referenced id."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-e5", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "00000000-0000-4000-8000-000000000002", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTRACTOR_NOT_FOUND"
            - "response HTTP status == 404"

      - name: jurisdiction_default_renewal_and_valid_days_applied
        claim_type: Defaults
        grounds:
          - endpoints[POST /jurisdictions]
          - entities.Jurisdiction.fields.renewal_fee_pct
          - entities.Jurisdiction.fields.permit_valid_days
        distinguishing_aspect: "POST /jurisdictions omitting renewal_fee_pct and permit_valid_days applies defaults 0.5 and 180."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "C-def", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
          assert:
            - "Jurisdiction.${jur_id}.renewal_fee_pct == 0.5"
            - "Jurisdiction.${jur_id}.permit_valid_days == 180"

      - name: list_permits_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /permits]
        distinguishing_aspect: "GET /permits returns a paginated array envelope with total_count and has_more; limit=1 over 2 permits yields has_more true and one element."
        test_recipe:
          setup:
            - "Two permits for the same contractor/jurisdiction."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-e6", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Ce6", license_number: "E-6", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
          trigger:
            - call: "GET /permits"
              payload: { contractor_id: "${con_id}", limit: 1, offset: 0 }
              as: PermitClerk
          assert:
            - "response meta envelope present; total_count == 2; has_more == true; data array length == 1"

      - name: feepayment_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.FeePayment.common_fields
          - endpoints[POST /permits/{id}/payments]
        distinguishing_aspect: "FeePayment has common_fields:false; its create response carries id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup:
            - "A SUBMITTED permit exists."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-e7", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Ce7", license_number: "E-7", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /permits/${permit_id}/payments"
              payload: { amount: 50.00 }
              as: Applicant
              captures: { pay_id: $.data.id }
          assert:
            - "FeePayment create response has no version field"
            - "FeePayment.${pay_id}.created_at present"

      - name: computed_fee_fields_correct_per_calculation
        claim_type: Computed Fields
        grounds:
          - calculations.total_permit_fee
          - entities.PermitApplication.fields.total_permit_fee
        excluded_because:
          difficulty_instance: assessed_valuation_method_vs_square_foot_method
          rationale: "Computed assessed_valuation/base/total correctness is asserted as literals by the named §1.8 dual_variant_calc instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: issue_from_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PermitApplication.APPROVED_to_ISSUED
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_issue
          rationale: "Issuing a SUBMITTED (non-APPROVED) permit returns ERR_INVALID_STATE as asserted by the named §1.8 priority_pair instance."

      - name: resolve_correction_twice_idempotency_second_fails
        claim_type: Idempotency
        grounds:
          - state_machines.CorrectionNotice.OPEN_to_RESOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Resolving the same CorrectionNotice twice: the second call finds item_status RESOLVED (not OPEN) and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Permit CORRECTIONS_REQUIRED with one CorrectionNotice already RESOLVED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-s1", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Cs1", license_number: "S-1", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "RevS1", cert_number: "SC-1" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "ALTERATION", fee_method: "VALUATION", declared_valuation: 100000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reviews"
              payload: { reviewer_id: "${rev_id}" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/correction-notices"
              payload: { code_section: "R302.1", description: "Fire separation" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { cn_id: $.data.id }
            - call: "POST /reviews/${review_id}/decide"
              payload: { decision: "CORRECTIONS" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
            - call: "POST /correction-notices/${cn_id}/resolve"
              payload: {}
              as: Applicant
          trigger:
            - call: "POST /correction-notices/${cn_id}/resolve"
              payload: {}
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response HTTP status == 409"

      - name: withdraw_then_withdraw_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_WITHDRAWN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A WITHDRAWN permit is terminal: a second withdraw returns ERR_INVALID_STATE (409); no further transition possible."
        test_recipe:
          setup:
            - "A SUBMITTED permit already WITHDRAWN."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-s2", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Cs2", license_number: "S-2", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/withdraw"
              payload: {}
              as: Applicant
          trigger:
            - call: "POST /permits/${permit_id}/withdraw"
              payload: {}
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "PermitApplication.${permit_id}.status == WITHDRAWN"
            - "response error_id == ERR_INVALID_STATE"

      - name: withdraw_submitted_permit_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_WITHDRAWN
          - entities.PermitApplication.fields.status
        distinguishing_aspect: "POST /permits/{id}/withdraw on a SUBMITTED permit moves status to WITHDRAWN and appends a WITHDRAWN PermitEvent."
        test_recipe:
          setup:
            - "A SUBMITTED permit."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-s3", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Cs3", license_number: "S-3", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /permits/${permit_id}/withdraw"
              payload: {}
              as: Applicant
              captures: { st: $.data.status }
          assert:
            - "PermitApplication.${permit_id}.status == WITHDRAWN"

      - name: stop_work_revokes_issued_certificate_cascade
        claim_type: Compensation
        grounds:
          - state_machines.CertificateOfOccupancy.ISSUED_to_REVOKED
          - state_machines.PermitApplication.ACTIVE_to_STOPPED
        distinguishing_aspect: "Issuing a StopWorkOrder while an ISSUED CofO exists cascades: the CofO co_status flips to REVOKED (compliance compensation) and work_status becomes STOPPED in the same request."
        test_recipe:
          setup:
            - "ISSUED permit with PASSED ROUGH and passed FINAL (one ISSUED CofO), work_status ACTIVE."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-s4", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Cs4", license_number: "S-4", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "RevS4", cert_number: "SC-4" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "InspS4", badge_number: "SB-4" }
              as: BuildingOfficial
