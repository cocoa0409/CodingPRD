      - name: stale_expected_order_version_on_claim_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-create-stale-order]", "errors[ERR_STALE_ORDER_VERSION]", "validations[priority=10]"]
        distinguishing_aspect: "Filing a claim advances Order.version; re-sending the SAME expected_order_version that succeeded a moment ago is now stale and returns ERR_STALE_ORDER_VERSION with HTTP 412, leaving the first claim's reservation intact."
        test_recipe:
          setup: ["An IN_NETWORK confirmed order; a first superseding claim already filed with the order's then-current version, which bumped Order.version."]
          setup_api_calls:
            - call: "POST /optical/insurance-policies"
