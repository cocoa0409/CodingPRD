      - name: version_advances_by_exactly_one_per_accepted_parent_write_and_never_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - entities.Request.version
          - entities.RecordSegment.version
          - endpoints.POST_/roi/record-segments
          - endpoints.POST_/roi/record-segments/{id}/disposition
        distinguishing_aspect: >
