      - name: reservation_create_stale_aircraft_version
        claim_type: optimistic_concurrency_stale_version
        grounds: ["concurrency_rules[reservation-create-stale-aircraft]"]
        distinguishing_aspect: "OCC on Aircraft.version (different parent entity): after a first create bumps the glider version, a second create with the stale captured version is rejected 412 ERR_STALE_AIRCRAFT_VERSION even on a non-overlapping window."
