            - "Nothing partial was written: GET /certificates with limit 10 and offset 0 returns total_count == 1, GET /vessel-jobs returns total_count == 1, GET /wps returns total_count == 2, GET /material-heats returns total_count == 2 and GET /welder-qualifications returns total_count == 2"

      - name: error_state_guard_family_on_certificate_renewal_and_receiving_inspection
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_INVALID_CERTIFICATE_STATE]
          - errors[ERR_INVALID_HEAT_STATE]
          - errors[ERR_TRACEABILITY_INCOMPLETE]
          - validations[priority=50]
          - validations[priority=80]
        distinguishing_aspect: "Three refusals that are easy to leave unimplemented because the happy path never meets them: a renewal against an already-ACTIVE certificate has no declared source transition, a second review of an already-REJECTED heat is not a replay of the first, and an ACCEPT decision on a heat whose mill test report was never received is a traceability failure rather than a strength failure — even when the certified numbers are comfortably above the minima."
        test_recipe:
          setup:
            - "ACTIVE certificate CA-U-8927 has one satisfactory CLOSED audit available as a renewal basis."
            - "Heat H-6500 (SA-516-70) is at QUARANTINE with mtr_received false but certified 45.0 ksi yield / 80.0 ksi tensile; heat H-6501 is at QUARANTINE with a complete report."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8927", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id, cv1: $.data.version }
            - call: "POST /shop-audits"
              payload: { certificate_id: "${cert_id}", audit_type: "TRIENNIAL_RENEWAL", scheduled_date: "2026-06-01" }
              as: ShopAdmin
              captures: { audit_id: $.data.id }
            - call: "POST /shop-audits/${audit_id}/close"
              payload: { closed_on: "2026-06-10", findings: [] }
              as: ShopAdmin
            - call: "POST /material-heats"
              payload: { heat_number: "H-6500", spec: "SA-516-70", form: "PLATE", mtr_received: false, mtr_certified_yield_ksi: 45.0, mtr_certified_tensile_ksi: 80.0, quantity_received_lb: 1000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_no_mtr: $.data.id }
            - call: "POST /material-heats"
              payload: { heat_number: "H-6501", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 41.0, mtr_certified_tensile_ksi: 75.0, quantity_received_lb: 1000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_ok: $.data.id }
            - call: "POST /material-heats/${heat_ok}/mtr-review"
              payload: { decision: "REJECT", reason: "Chemistry outside the ordered range on the ladle analysis" }
              as: QCInspector
              as_user_id: "${qc1_id}"
          trigger:
            - call: "POST /certificates/${cert_id}/renewals"
              payload: { expected_certificate_version: "${cv1}", renewal_audit_id: "${audit_id}", new_expires_on: "2032-01-01" }
              as: ShopAdmin
              captures: { e_cert_state: $.data.error_id }
            - call: "POST /material-heats/${heat_no_mtr}/mtr-review"
              payload: { decision: "ACCEPT" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_trace: $.data.error_id }
            - call: "POST /material-heats/${heat_ok}/mtr-review"
              payload: { decision: "ACCEPT" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_heat_state: $.data.error_id }
          assert:
            - "${e_cert_state} == ERR_INVALID_CERTIFICATE_STATE with HTTP 409: renewal is declared only from PROBATION, SUSPENDED or EXPIRED, and the version and audit cited were both valid"
            - "CertificateOfAuthorization.${cert_id}.version is still ${cv1}, expires_on is still 2029-01-01 and renewal_count is still 0"
            - "${e_trace} == ERR_TRACEABILITY_INCOMPLETE with HTTP 409, and MaterialHeat.${heat_no_mtr}.status is still QUARANTINE — the strength numbers were never the obstacle"
            - "${e_heat_state} == ERR_INVALID_HEAT_STATE with HTTP 409, and MaterialHeat.${heat_ok}.status is still REJECTED with version 2, not 3"

