            - "after POST /procurement/solicitations/${c_s28_id}/close-question-period the identical question call returns HTTP 409 ERR_QUESTION_PERIOD_CLOSED and creates no row"

      - name: corner_priority_state_error_precedes_temporal_error
        claim_type: Priority Ordering
        grounds:
