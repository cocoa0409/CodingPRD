  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_schedule_half_open_adjacency
        grounds:
          - validations[priority=9]
          - entities.RateSchedule.fields.effective_start
          - entities.RateSchedule.fields.effective_end
        distinguishing_aspect: |
          Interval semantics (a): half-open collision on RateSchedule via
          POST /rate-schedules — a new schedule whose effective_start equals an
          existing same-category schedule's effective_end is ADJACENT and
          allowed, while one overlapping by a single day is rejected with
          ERR_RATE_SCHEDULE_OVERLAP. Adjacency is not a collision here.
        test_recipe:
          setup:
            - "RateSchedule S1 EFFECTIVE for BUSINESS_ESTABLISHMENT, window 2026-01-01..2026-12-31"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-BE", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "BUSINESS_ESTABLISHMENT" }
              as: Admin
              captures: { s1: $.data.id }
            - call: "POST /rate-schedules/${s1}/activate"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2026-BE", effective_start: "2026-12-31T00:00:00Z", effective_end: "2027-12-30T00:00:00Z", rate_per_performance_microcents: 3000, min_fee_cents: 120000, category: "BUSINESS_ESTABLISHMENT" }
              as: Admin
              captures: { s2: $.data.id }
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2026-BE2", effective_start: "2026-06-01T00:00:00Z", effective_end: "2027-05-31T00:00:00Z", rate_per_performance_microcents: 3000, min_fee_cents: 120000, category: "BUSINESS_ESTABLISHMENT" }
              as: Admin
              captures: { err_ovl: $.data.error_id }
          assert:
            - "RateSchedule.${s2}.id exists (adjacent start == prior end is accepted under half-open semantics)"
            - "err_ovl == ERR_RATE_SCHEDULE_OVERLAP (interior overlap rejected)"

      - name: usage_report_inclusive_day_coverage
        grounds:
          - validations[priority=8]
          - entities.UsageReport.fields.period_start
          - entities.UsageReport.fields.period_end
        distinguishing_aspect: |
          Interval semantics (b) on a different resource (UsageReport, via
          POST /usage-reports/{id}/submit): coverage is INCLUSIVE of both end
          days — a report whose period_start equals a SUBMITTED sibling's
          period_end still conflicts (the shared day is double-reported), so
          adjacency IS a collision here, the opposite geometric treatment from
          rate schedules.
        test_recipe:
          setup:
            - "Licensee L ACTIVE under Schedule NS-1"
            - "Report R1 (2026-06-01..2026-06-30) SUBMITTED with one line"
            - "Report R2 (2026-06-30..2026-07-30) DRAFT with one line — shares exactly one day (2026-06-30) with R1"
          setup_api_calls:
