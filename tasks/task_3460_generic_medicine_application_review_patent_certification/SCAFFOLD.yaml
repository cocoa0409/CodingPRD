# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3460_generic_medicine_application_review_patent_certification
# Generic Medicine Application Review & Patent Certification
# =============================================================================

scenario: |
  Generic Medicine Application Review & Patent Certification (Food and Drug
  Administration generic drug program): abbreviated application submission
  demonstrating equivalence to a reference product with bioequivalence study
  data, patent certification categories declaring whether listed patents are
  expired, will be respected or are invalid or not infringed, notice to the
  patent holder triggering a litigation stay period that delays approval,
  exclusivity award to the first applicant challenging a patent with forfeiture
  events, review cycles with deficiency letters, response timelines and goal
  dates under user fee agreements, manufacturing facility inspection
  requirements including foreign sites before approval, labeling carve-outs
  when the reference product has protected indications, post-approval changes
  requiring supplements with different review pathways

domain_name: generic-medicine-application-review
api_prefix: /generic-drug-review

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - scheduled_deferred_actions      # clock-driven stays, lapses, expiries, CBE-30 effectivity
    - cascading_side_effects          # patent expiry -> certification deferral -> TA auto-approval
    - dual_variant_calculation        # BE adequacy; approval-blocked posture
    - optimistic_concurrency          # OCC on GenericApplication.version for amendments/certifications
  entity_topology: flat               # peer entities joined by foreign keys; sub-resource paths are convenience only
  state_machine_shape: cyclic         # application review loop RECEIVED -> TENTATIVE_APPROVAL -> RECEIVED; supplement parallel dimensions
  relationship_patterns:
    - one_to_many                     # application -> studies/certifications/cycles/amendments/supplements
    - cross_aggregate                 # certification -> listed patent; award -> application + reference product
  role_model: approval_chain          # ApplicantSponsor submits -> RegulatoryReviewer decides; InnovatorSponsor owns patent side
  consistency_model: immediate        # all side effects visible in the same request's response

# =============================================================================
# Table 1.0: Response Envelope (FIXED — do not edit)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# Calendar-date fields are ISO 8601 "YYYY-MM-DD" strings; instants are full
# ISO 8601 UTC datetimes with three fractional digits. All date arithmetic is
# pinned in calculations.month_arithmetic_convention.
# =============================================================================
entities:
  - name: ApplicantCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the generic drug applicant" }
      - { name: contact_email, type: string, source: input, description: "Regulatory contact email" }
      - { name: headquarters_country, type: string, source: input, description: "ISO 3166-1 alpha-2 country code of headquarters" }

  - name: ReferenceProduct
    parent: null
    common_fields: true
    fields:
      - { name: brand_name, type: string, source: input, description: "Brand name of the reference listed drug" }
      - { name: active_ingredient, type: string, source: input, description: "Active pharmaceutical ingredient" }
      - { name: strength, type: string, source: input, description: "Strength declaration, e.g. '20 mg'" }
      - { name: dosage_form, type: string, source: input, description: "Dosage form, e.g. TABLET | CAPSULE | INJECTION (free-form string)" }
      - { name: rld_approval_date, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the reference product was approved; anchors NCE submission bars" }
      - { name: is_new_chemical_entity, type: boolean, source: input, default: false, description: "True when the reference product enjoyed new-chemical-entity exclusivity" }
      - { name: indication_codes, type: array, source: input, description: "All approved indication codes, e.g. [\"IND-HTN\", \"IND-CHF\"]" }
      - { name: patent_owner_user_id, type: string, source: input, description: "Opaque X-User-ID of the InnovatorSponsor authorized to list patents and report litigation for this product" }

  - name: ListedPatent
    parent: null
    common_fields: true
    fields:
      - { name: reference_product_id, type: string, source: input, description: "FK -> ReferenceProduct.id; product this patent is listed against" }
      - { name: patent_number, type: string, source: input, description: "Patent number as listed in the patent register" }
      - { name: patent_type, type: enum, source: input, description: "DRUG_SUBSTANCE | DRUG_PRODUCT | METHOD_OF_USE" }
      - { name: use_code, type: string, source: input, default: null, description: "Method-of-use code (e.g. 'U-123'); required when patent_type is METHOD_OF_USE, null otherwise" }
      - { name: expiry_date, type: string, source: input, description: "Calendar date the patent expires" }
      - { name: status, type: enum, source: system, description: "LISTED -> EXPIRED (system, when logical clock passes expiry_date)" }

  - name: ProtectedIndication
    parent: null
    common_fields: true
    fields:
      - { name: reference_product_id, type: string, source: input, description: "FK -> ReferenceProduct.id" }
      - { name: indication_code, type: string, source: input, description: "Must be a member of the reference product's indication_codes" }
      - { name: effective_from, type: string, source: input, description: "Calendar date protection starts (inclusive)" }
      - { name: protected_until, type: string, source: input, description: "Calendar date protection ends (inclusive); must be >= effective_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> EXPIRED (system, when logical clock passes protected_until)" }

  - name: GenericApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> ApplicantCompany.id; must equal X-User-ID of the creating ApplicantSponsor" }
      - { name: reference_product_id, type: string, source: input, description: "FK -> ReferenceProduct.id the application claims equivalence to" }
      - { name: review_priority, type: enum, source: input, default: STANDARD, description: "STANDARD (10-month base goal) | PRIORITY (8-month base goal)" }
      - { name: labeling_mode, type: enum, source: input, description: "FULL (all reference indications, only valid when none are protected) | CARVE_OUT (protected indications carved out of the label)" }
      - { name: carved_indication_codes, type: array, source: input, default: [], description: "Indication codes carved out of the proposed label; must equal the set of ACTIVE ProtectedIndication codes of the reference product at submit time and re-validated at approval time" }
      - { name: status, type: enum, source: system, description: "DRAFT | RECEIVED | TENTATIVE_APPROVAL | APPROVED | REFUSED_APPROVAL | LAPSED | WITHDRAWN" }
      - { name: received_date, type: string, source: system, default: null, description: "Calendar date the application was filed (set by submit); anchors notice window, goal dates, TA-failure forfeiture" }
      - { name: current_cycle_number, type: integer, source: system, default: 0, description: "1-based number of the currently open review cycle; 0 while DRAFT" }
      - { name: tentative_approval_date, type: string, source: system, default: null, description: "Calendar date tentative approval was granted; cleared when an amendment reopens review" }
      - { name: approval_date, type: string, source: system, default: null, description: "Calendar date of full approval" }
      - { name: first_marketing_date, type: string, source: system, default: null, description: "Calendar date first commercial marketing was recorded (first-filer only)" }
      - { name: patent_blocked_until, type: string, source: computed, default: null, description: "Latest calendar date among active patent-side approval blocks (P3 deferral expiry, litigation stay_until, DECIDED_VALID patent expiry); null when no patent block is active. OPTIMISTIC variant: an open 45-day suit window with no suit filed contributes nothing" }
      - { name: exclusivity_blocked, type: boolean, source: computed, default: false, description: "True when another application's ExclusivityAward for the same reference product is in AWARDED or ACTIVE status" }
      - { name: open_deficiency_count, type: integer, source: computed, default: 0, description: "Count of this application's ReviewCycles with status CRL_ISSUED" }
      - { name: open_supplement_count, type: integer, source: computed, default: 0, description: "Count of this application's Supplements with review_status SUBMITTED" }

  - name: BioequivalenceStudy
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> GenericApplication.id" }
      - { name: study_type, type: enum, source: input, description: "FASTING | FED" }
      - { name: analyte, type: string, source: input, description: "Measured analyte name" }
      - { name: auc_ratio_pct, type: number, source: input, description: "Test/reference AUC geometric mean ratio, percent" }
      - { name: auc_ci_low_pct, type: number, source: input, description: "Lower bound of the 90% confidence interval for AUC ratio, percent" }
      - { name: auc_ci_high_pct, type: number, source: input, description: "Upper bound of the 90% confidence interval for AUC ratio, percent" }
      - { name: cmax_ratio_pct, type: number, source: input, description: "Test/reference Cmax geometric mean ratio, percent" }
      - { name: cmax_ci_low_pct, type: number, source: input, description: "Lower bound of the 90% confidence interval for Cmax ratio, percent" }
      - { name: cmax_ci_high_pct, type: number, source: input, description: "Upper bound of the 90% confidence interval for Cmax ratio, percent" }
      - { name: is_adequate, type: boolean, source: computed, description: "Per calculations.be_adequacy_determination; client-supplied value ignored" }
      - { name: status, type: enum, source: system, description: "ACCEPTED when is_adequate else DEFICIENT; set at creation, no transitions" }

  - name: PatentCertification
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> GenericApplication.id" }
      - { name: patent_id, type: string, source: input, description: "FK -> ListedPatent.id; patent must be listed on the application's reference product" }
      - { name: certification_type, type: enum, source: input, description: "PARAGRAPH_II_EXPIRED (patent expired) | PARAGRAPH_III_DEFER (applicant will not market until patent expiry) | PARAGRAPH_IV_CHALLENGE (patent invalid or not infringed). Absence of listed patents on the reference product is the implicit Paragraph I case and requires zero certifications" }
      - { name: status, type: enum, source: system, description: "CERTIFIED -> AMENDED_TO_P3 (only PARAGRAPH_IV_CHALLENGE may amend, only to PARAGRAPH_III_DEFER, only while application not APPROVED)" }
      - { name: filed_date, type: string, source: system, description: "Calendar date the certification was filed" }
      - { name: amended_date, type: string, source: system, default: null, description: "Calendar date of the P4->P3 amendment" }

  - name: PatentChallengeNotice
    parent: null
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: input, description: "FK -> PatentCertification.id; exactly one notice per PARAGRAPH_IV_CHALLENGE certification" }
      - { name: notice_date, type: string, source: system, description: "Calendar date the notice was sent (logical clock at creation)" }
      - { name: is_timely, type: boolean, source: computed, description: "True when notice_date - application.received_date <= 20 days; a late notice forfeits the applicant's exclusivity award" }
      - { name: suit_deadline, type: string, source: computed, description: "notice_date + 45 calendar days; suit filed on or before this date triggers the litigation stay" }
      - { name: suit_filed_date, type: string, source: system, default: null, description: "Calendar date the patent owner's infringement suit was filed" }
      - { name: stay_until, type: string, source: computed, default: null, description: "notice_date + 30 calendar months (clamped); set only when suit filed on time" }
      - { name: court_outcome, type: enum, source: system, default: NONE, description: "NONE | PATENT_VALID | PATENT_INVALID_OR_NOT_INFRINGED" }
      - { name: court_decision_date, type: string, source: system, default: null, description: "Calendar date of the court decision" }
      - { name: status, type: enum, source: system, description: "NOTICE_SENT -> SUIT_FILED | NO_SUIT_FILED; SUIT_FILED -> STAY_EXPIRED | DECIDED_VALID | DECIDED_INVALID" }

  - name: ReviewCycle
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> GenericApplication.id" }
      - { name: cycle_number, type: integer, source: system, description: "1-based cycle sequence for the application" }
      - { name: status, type: enum, source: system, description: "OPEN | CRL_ISSUED | AMENDMENT_RECEIVED | CLOSED | LAPSED" }
      - { name: opened_date, type: string, source: system, description: "Calendar date the cycle opened" }
      - { name: base_review_months, type: integer, source: system, description: "Snapshot of the goal base at cycle open: 8 for PRIORITY applications, 10 for STANDARD" }
      - { name: major_amendment_extensions_count, type: integer, source: system, default: 0, description: "Number of MAJOR amendments applied to this cycle; each adds 3 months" }
      - { name: goal_date, type: string, source: computed, description: "opened_date + base_review_months + 3 * major_amendment_extensions_count, calendar-month arithmetic with clamping" }
      - { name: deficiency_issued_date, type: string, source: system, default: null, description: "Calendar date the deficiency letter (complete response) was issued" }
      - { name: deficiency_response_due_date, type: string, source: computed, default: null, description: "deficiency_issued_date + 12 calendar months (clamped)" }
      - { name: deficiency_response_received_date, type: string, source: system, default: null, description: "Calendar date the applicant's responding amendment was received" }
      - { name: deficiency_summary, type: string, source: input, default: null, description: "Free-text summary of deficiencies issued" }
      - { name: closed_reason, type: enum, source: system, default: null, description: "APPROVAL | TENTATIVE_APPROVAL | REFUSAL | SUPERSEDED | LAPSED" }

  - name: Amendment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> GenericApplication.id" }
      - { name: classification, type: enum, source: input, description: "MAJOR (extends the current cycle goal by 3 months) | MINOR" }
      - { name: contains_new_be_data, type: boolean, source: input, description: "True when the amendment carries new bioequivalence data" }
      - { name: notes, type: string, source: input, default: null, description: "Free-text description" }
      - { name: submitted_date, type: string, source: system, description: "Calendar date received" }

  - name: ManufacturingFacility
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> ApplicantCompany.id; must equal X-User-ID of the creating ApplicantSponsor" }
      - { name: facility_name, type: string, source: input, description: "Site name" }
      - { name: fei_number, type: string, source: input, description: "Facility establishment identifier" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country code of the site" }
      - { name: is_foreign, type: boolean, source: computed, description: "True when country_code != \"US\"" }

  - name: FacilityInspection
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> ManufacturingFacility.id" }
      - { name: application_id, type: string, source: input, description: "FK -> GenericApplication.id; the pre-approval inspection is tied to this application" }
      - { name: inspection_type, type: enum, source: input, default: PRE_APPROVAL, description: "PRE_APPROVAL (only supported type)" }
      - { name: scheduled_start_date, type: string, source: input, description: "First calendar day of the inspection window (inclusive)" }
      - { name: scheduled_end_date, type: string, source: input, description: "Last calendar day of the inspection window (exclusive bound for overlap purposes); must be >= scheduled_start_date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PASSED | FAILED | WAIVED | CANCELLED" }
      - { name: outcome_date, type: string, source: system, default: null, description: "Calendar date the outcome was recorded" }

  - name: Supplement
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> GenericApplication.id; parent must be APPROVED" }
      - { name: change_type, type: enum, source: input, description: "MANUFACTURING_SITE | FORMULATION | LABELING | PACKAGING | EDITORIAL" }
      - { name: pathway, type: enum, source: input, description: "PRIOR_APPROVAL | CBE_30 | CBE_0 | ANNUAL_REPORT; must be permitted for change_type per calculations.supplement_pathway_map" }
      - { name: description, type: string, source: input, default: null, description: "Free-text description of the change" }
      - { name: review_status, type: enum, source: system, description: "SUBMITTED -> APPROVED | REJECTED | WITHDRAWN; ANNUAL_REPORT supplements are created directly in LOGGED (terminal, not reviewable)" }
      - { name: effectivity, type: enum, source: system, description: "NOT_EFFECTIVE -> EFFECTIVE -> REVOKED; parallel dimension to review_status, driven by pathway and logical clock per calculations.supplement_effectivity" }
      - { name: submitted_date, type: string, source: system, description: "Calendar date submitted" }
      - { name: effective_date, type: string, source: computed, default: null, description: "Calendar date the change became effective (per pathway rule); null while NOT_EFFECTIVE" }
      - { name: decision_date, type: string, source: system, default: null, description: "Calendar date of the review decision" }

  - name: ExclusivityAward
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> GenericApplication.id; the first-filing paragraph-IV applicant" }
      - { name: reference_product_id, type: string, source: system, description: "FK -> ReferenceProduct.id" }
      - { name: status, type: enum, source: system, description: "ELIGIBLE -> AWARDED -> ACTIVE -> EXPIRED; ELIGIBLE|AWARDED -> FORFEITED" }
      - { name: awarded_date, type: string, source: system, default: null, description: "Calendar date the first filer reached APPROVED" }
      - { name: approval_date, type: string, source: system, default: null, description: "Copy of the application's approval_date; anchors marketing_deadline" }
      - { name: marketing_deadline, type: string, source: computed, default: null, description: "approval_date + 75 calendar days; award forfeited if first marketing not recorded on or before this date" }
      - { name: first_marketing_date, type: string, source: system, default: null, description: "Calendar date first commercial marketing recorded" }
      - { name: exclusivity_end_date, type: string, source: computed, default: null, description: "first_marketing_date + 180 calendar days; competitor applications are blocked while clock < this date" }
      - { name: forfeiture_reason, type: enum, source: system, default: null, description: "NOTICE_LATE | CERTIFICATION_AMENDED | APPLICATION_WITHDRAWN | APPLICATION_LAPSED | TA_NOT_OBTAINED_30MO | MARKETING_NOT_COMMENCED_75D" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: GenericApplication
    initial_state: DRAFT
    terminal_states: [REFUSED_APPROVAL, LAPSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: RECEIVED
        trigger: "POST /generic-drug-review/applications/{id}/submit"
        actor: ApplicantSponsor
        preconditions:
          - "Application in DRAFT (ERR_INVALID_STATE)"
          - "At least one BioequivalenceStudy with status ACCEPTED (ERR_NO_ADEQUATE_BE_STUDY)"
          - "NCE bar per validations: before rld_approval_date + 4 years no submission; between +4 and +5 years at least one PARAGRAPH_IV_CHALLENGE certification required (ERR_NCE_SUBMISSION_BARRED)"
          - "Exactly one PatentCertification per LISTED patent of the reference product (ERR_CERTIFICATION_INCOMPLETE)"
          - "carved_indication_codes equals the set of ACTIVE ProtectedIndication codes (ERR_LABEL_CARVE_OUT_INCOMPLETE / ERR_CARVE_OUT_OF_UNPROTECTED)"
        side_effects:
          - "received_date := current logical date"
          - "current_cycle_number := 1"
          - "Create ReviewCycle 1 (status OPEN, opened_date := received_date, base_review_months := 8 if PRIORITY else 10)"
          - "If any certification is PARAGRAPH_IV_CHALLENGE and no ExclusivityAward exists for the reference product: create ExclusivityAward(status ELIGIBLE) for this application (first-filer determination per calculations.first_filer_determination)"
          - "Increments GenericApplication.version by 1"

      - from: RECEIVED
        to: APPROVED
        trigger: "POST /generic-drug-review/applications/{id}/approval-decision with decision=APPROVE and no active patent block and exclusivity_blocked == false"
        actor: RegulatoryReviewer
        preconditions:
          - "Application in RECEIVED (ERR_INVALID_STATE)"
          - "No ReviewCycle in CRL_ISSUED (ERR_DEFICIENCY_RESPONSE_OPEN)"
          - "At least one BioequivalenceStudy ACCEPTED (ERR_NO_ADEQUATE_BE_STUDY)"
          - "Facility clearance per calculations.facility_clearance_evaluation (ERR_FACILITY_CLEARANCE_FAILED)"
          - "Every PARAGRAPH_IV_CHALLENGE certification with status CERTIFIED has a PatentChallengeNotice (ERR_P4_NOTICE_REQUIRED)"
          - "Carve-out re-validation against currently ACTIVE ProtectedIndications (ERR_LABEL_CARVE_OUT_INCOMPLETE / ERR_CARVE_OUT_OF_UNPROTECTED)"
          - "patent_blocked_until is null or < current date AND exclusivity_blocked == false (otherwise decision APPROVE routes to TENTATIVE_APPROVAL instead)"
        side_effects:
          - "approval_date := current logical date"
          - "Close the current ReviewCycle (CLOSED, closed_reason APPROVAL)"
          - "If an ExclusivityAward for this application is ELIGIBLE: award -> AWARDED (awarded_date, approval_date set; marketing_deadline computed)"
          - "Increments GenericApplication.version by 1"

      - from: RECEIVED
        to: TENTATIVE_APPROVAL
        trigger: "POST /generic-drug-review/applications/{id}/approval-decision with decision=APPROVE while a patent block is active or exclusivity_blocked == true"
        actor: RegulatoryReviewer
        preconditions:
          - "Same scientific gates as RECEIVED -> APPROVED (state, open deficiency, BE, facility clearance, P4 notice presence, carve-out)"
        side_effects:
          - "tentative_approval_date := current logical date"
          - "Close the current ReviewCycle (CLOSED, closed_reason TENTATIVE_APPROVAL)"
          - "Increments GenericApplication.version by 1"

      - from: RECEIVED
        to: REFUSED_APPROVAL
        trigger: "POST /generic-drug-review/applications/{id}/approval-decision with decision=REFUSE"
        actor: RegulatoryReviewer
        preconditions:
          - "Application in RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "Close the current ReviewCycle (CLOSED, closed_reason REFUSAL)"
          - "No exclusivity side effect: refusal does NOT forfeit an ELIGIBLE award"
          - "Increments GenericApplication.version by 1"
        note: "REFUSED_APPROVAL is terminal and leaves an ELIGIBLE award in place; the 30-month TA-failure forfeiture clock keeps running and will forfeit the award via reason TA_NOT_OBTAINED_30MO"

      - from: TENTATIVE_APPROVAL
        to: APPROVED
        trigger: "system (automatic re-evaluation after any clock-set, litigation event, certification amendment, patent expiry, or exclusivity transition leaves no active block)"
        actor: system
        preconditions:
          - "Application in TENTATIVE_APPROVAL"
          - "patent_blocked_until is null or < current date AND exclusivity_blocked == false"
          - "Carve-out still valid against currently ACTIVE ProtectedIndications (if drifted, application stays TENTATIVE_APPROVAL until labeling is amended)"
        side_effects:
          - "approval_date := current logical date; tentative_approval_date retained as history"
          - "If an ExclusivityAward for this application is ELIGIBLE: award -> AWARDED"
          - "Increments GenericApplication.version by 1"

      - from: TENTATIVE_APPROVAL
        to: RECEIVED
        trigger: "POST /generic-drug-review/applications/{id}/amendments (any amendment to a tentatively approved application reopens review)"
        actor: ApplicantSponsor
        preconditions:
          - "Application in TENTATIVE_APPROVAL"
          - "OCC: expected_application_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "tentative_approval_date := null"
          - "Open a new ReviewCycle (cycle_number := current_cycle_number + 1, status OPEN, opened_date := current date, base_review_months per priority); the previous cycle is already CLOSED from the tentative approval"
          - "current_cycle_number += 1"
          - "If amendment classification is MAJOR: new cycle major_amendment_extensions_count := 1"
          - "Increments GenericApplication.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /generic-drug-review/applications/{id}/withdraw"
        actor: ApplicantSponsor
        preconditions: []
        side_effects:
          - "Increments GenericApplication.version by 1"

      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /generic-drug-review/applications/{id}/withdraw"
        actor: ApplicantSponsor
        preconditions: []
        side_effects:
          - "Close the current ReviewCycle (CLOSED, closed_reason SUPERSEDED)"
          - "If this application holds an ELIGIBLE or AWARDED ExclusivityAward: award -> FORFEITED (reason APPLICATION_WITHDRAWN), which clears exclusivity_blocked on sibling applications and triggers TENTATIVE_APPROVAL -> APPROVED re-evaluation for them"
          - "Increments GenericApplication.version by 1"

      - from: TENTATIVE_APPROVAL
        to: WITHDRAWN
        trigger: "POST /generic-drug-review/applications/{id}/withdraw"
        actor: ApplicantSponsor
        preconditions: []
        side_effects:
          - "If this application holds an ELIGIBLE or AWARDED ExclusivityAward: award -> FORFEITED (reason APPLICATION_WITHDRAWN) with sibling re-evaluation"
          - "Increments GenericApplication.version by 1"

      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /generic-drug-review/applications/{id}/withdraw"
        actor: ApplicantSponsor
        preconditions: []
        side_effects:
          - "If this application holds an AWARDED or ACTIVE ExclusivityAward: award -> FORFEITED (reason APPLICATION_WITHDRAWN) with sibling re-evaluation"
          - "Increments GenericApplication.version by 1"

      - from: RECEIVED
        to: LAPSED
        trigger: "system (automatic when the current ReviewCycle lapses: CRL_ISSUED and logical clock passes deficiency_response_due_date with no response)"
        actor: system
        preconditions: []
        side_effects:
          - "If this application holds an ELIGIBLE ExclusivityAward: award -> FORFEITED (reason APPLICATION_LAPSED) with sibling re-evaluation"
          - "Increments GenericApplication.version by 1"

  - entity: ReviewCycle
    initial_state: OPEN
    terminal_states: [CLOSED, LAPSED]
    transitions:
      - from: OPEN
        to: CRL_ISSUED
        trigger: "POST /generic-drug-review/review-cycles/{id}/issue-deficiency"
        actor: RegulatoryReviewer
        preconditions:
          - "Cycle in OPEN (ERR_INVALID_STATE)"
          - "Parent application in RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "deficiency_issued_date := current logical date"
          - "deficiency_response_due_date := deficiency_issued_date + 12 calendar months (clamped)"
          - "Parent application open_deficiency_count += 1"

      - from: CRL_ISSUED
        to: AMENDMENT_RECEIVED
        trigger: "POST /generic-drug-review/applications/{id}/amendments while this cycle is the application's current cycle"
        actor: ApplicantSponsor
        preconditions:
          - "Amendment received on or before deficiency_response_due_date (a later amendment is rejected because the cycle has already lapsed: ERR_INVALID_STATE)"
        side_effects:
          - "deficiency_response_received_date := current logical date"
          - "Parent application open_deficiency_count -= 1"
          - "If amendment classification is MAJOR: major_amendment_extensions_count += 1 and goal_date recomputed"

      - from: AMENDMENT_RECEIVED
        to: CLOSED
        trigger: "POST /generic-drug-review/review-cycles/{id}/issue-deficiency (second-round deficiencies close the current cycle and open the next one already carrying the new deficiency)"
        actor: RegulatoryReviewer
        preconditions:
          - "Cycle in AMENDMENT_RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "This cycle -> CLOSED with closed_reason SUPERSEDED"
          - "Create ReviewCycle cycle_number + 1 with status CRL_ISSUED, deficiency_issued_date := current date, deficiency_response_due_date := +12 months, base_review_months per priority, opened_date := current date"
          - "Parent application current_cycle_number += 1 and open_deficiency_count recomputed (new cycle contributes 1)"

      - from: OPEN
        to: CLOSED
        trigger: "system (application approval decision, withdrawal, or TA-reopening amendment closes the open cycle)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_reason set to APPROVAL | TENTATIVE_APPROVAL | REFUSAL | SUPERSEDED per the triggering event"

      - from: AMENDMENT_RECEIVED
        to: CLOSED
        trigger: "system (application approval decision or withdrawal)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_reason set per the triggering event"

      - from: CRL_ISSUED
        to: CLOSED
        trigger: "system (application approval decision or withdrawal before response)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_reason set per the triggering event; parent open_deficiency_count recomputed"

      - from: CRL_ISSUED
        to: LAPSED
        trigger: "system (logical clock passes deficiency_response_due_date with deficiency_response_received_date still null)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_reason := LAPSED"
          - "Parent application -> LAPSED (see GenericApplication machine for the exclusivity forfeiture cascade)"

  - entity: ListedPatent
    initial_state: LISTED
    terminal_states: [EXPIRED]
    transitions:
      - from: LISTED
        to: EXPIRED
        trigger: "system (logical clock passes expiry_date; also evaluated at creation: a patent created with expiry_date already in the past starts EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "All PARAGRAPH_III_DEFER certifications on this patent stop contributing to patent_blocked_until; DECIDED_VALID litigation blocks on this patent also lift"
          - "Every TENTATIVE_APPROVAL application referencing this patent is re-evaluated and auto-approves if no block remains"

  - entity: PatentCertification
    initial_state: CERTIFIED
    terminal_states: [AMENDED_TO_P3]
    transitions:
      - from: CERTIFIED
        to: AMENDED_TO_P3
        trigger: "POST /generic-drug-review/patent-certifications/{id}/amend"
        actor: ApplicantSponsor
        preconditions:
          - "Certification status CERTIFIED and certification_type PARAGRAPH_IV_CHALLENGE (ERR_CERTIFICATION_NOT_AMENDABLE)"
          - "Parent application not APPROVED and not in a terminal state (ERR_INVALID_STATE)"
        side_effects:
          - "certification_type is henceforth treated as PARAGRAPH_III_DEFER (deferral block to patent expiry applies)"
          - "amended_date := current logical date"
          - "If the parent application holds an ELIGIBLE or AWARDED ExclusivityAward: award -> FORFEITED (reason CERTIFICATION_AMENDED) with sibling TENTATIVE_APPROVAL re-evaluation"
          - "Parent application patent_blocked_until recomputed"

  - entity: PatentChallengeNotice
    initial_state: NOTICE_SENT
    terminal_states: [NO_SUIT_FILED, STAY_EXPIRED, DECIDED_VALID, DECIDED_INVALID]
    transitions:
      - from: NOTICE_SENT
        to: SUIT_FILED
        trigger: "POST /generic-drug-review/patent-notices/{id}/litigation-events with event_type SUIT_FILED and event_date <= suit_deadline"
        actor: InnovatorSponsor
        preconditions:
          - "Notice in NOTICE_SENT (ERR_INVALID_STATE)"
          - "event_date >= notice_date and event_date <= suit_deadline and event_date <= current logical date (ERR_INVALID_REQUEST)"
        side_effects:
          - "suit_filed_date := event_date"
          - "stay_until := notice_date + 30 calendar months (clamped)"
          - "Parent application patent_blocked_until recomputed (stay now contributes)"

      - from: NOTICE_SENT
        to: NO_SUIT_FILED
        trigger: "system (logical clock passes suit_deadline with no suit recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "No stay is created; parent application patent_blocked_until unchanged (an open window contributes nothing under the pinned optimistic variant)"
        note: "A SUIT_FILED event whose event_date is after suit_deadline can never be recorded: event_date must be <= the current logical date, and the clock passing suit_deadline has already moved the notice here, so the attempt is rejected ERR_INVALID_STATE from NO_SUIT_FILED"

      - from: SUIT_FILED
        to: STAY_EXPIRED
        trigger: "system (logical clock passes stay_until with court_outcome still NONE)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent application patent_blocked_until recomputed (stay lifts)"
          - "TENTATIVE_APPROVAL re-evaluation for the parent application"

      - from: SUIT_FILED
        to: DECIDED_INVALID
        trigger: "POST /generic-drug-review/patent-notices/{id}/litigation-events with event_type COURT_DECIDED and outcome PATENT_INVALID_OR_NOT_INFRINGED"
        actor: ProgramAdmin
        preconditions:
          - "Notice in SUIT_FILED (ERR_INVALID_STATE)"
          - "event_date >= suit_filed_date and event_date <= current logical date (ERR_INVALID_REQUEST)"
        side_effects:
          - "court_outcome := PATENT_INVALID_OR_NOT_INFRINGED; court_decision_date := event_date"
          - "Parent application patent_blocked_until recomputed (block lifts entirely)"
          - "TENTATIVE_APPROVAL re-evaluation for the parent application"

      - from: SUIT_FILED
        to: DECIDED_VALID
        trigger: "POST /generic-drug-review/patent-notices/{id}/litigation-events with event_type COURT_DECIDED and outcome PATENT_VALID"
        actor: ProgramAdmin
        preconditions:
          - "Notice in SUIT_FILED (ERR_INVALID_STATE)"
        side_effects:
          - "court_outcome := PATENT_VALID; court_decision_date := event_date"
          - "Parent application patent_blocked_until recomputed (block now runs to the patent's expiry_date instead of stay_until)"

  - entity: FacilityInspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, WAIVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /generic-drug-review/facility-inspections/{id}/record-outcome with outcome PASSED"
        actor: FacilityInspector
        preconditions:
          - "Inspection in SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "outcome_date := current logical date"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /generic-drug-review/facility-inspections/{id}/record-outcome with outcome FAILED"
        actor: FacilityInspector
        preconditions:
          - "Inspection in SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "outcome_date := current logical date"

      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /generic-drug-review/facility-inspections/{id}/record-outcome with outcome WAIVED"
        actor: FacilityInspector
        preconditions:
          - "Inspection in SCHEDULED (ERR_INVALID_STATE)"
          - "Facility is domestic (is_foreign == false) AND has another inspection with outcome PASSED and outcome_date within the prior 24 calendar months (ERR_FOREIGN_FACILITY_WAIVER)"
        side_effects:
          - "outcome_date := current logical date"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /generic-drug-review/facility-inspections/{id}/record-outcome with outcome CANCELLED"
        actor: FacilityInspector
        preconditions:
          - "Inspection in SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "A CANCELLED inspection never participates in clearance evaluation or overlap blocking"

  - entity: Supplement
    initial_state: "review_status SUBMITTED x effectivity per pathway (ANNUAL_REPORT: review_status LOGGED x effectivity EFFECTIVE)"
    terminal_states: ["review_status in {APPROVED, REJECTED, WITHDRAWN, LOGGED} x effectivity terminal per pathway"]
    note: "PARALLEL DIMENSIONS — review_status and effectivity evolve independently; e.g. a CBE_30 supplement reaches effectivity EFFECTIVE while review_status is still SUBMITTED"
    transitions:
      - from: "creation (PRIOR_APPROVAL)"
        to: "review_status SUBMITTED x effectivity NOT_EFFECTIVE"
        trigger: "POST /generic-drug-review/applications/{id}/supplements with pathway PRIOR_APPROVAL"
        actor: ApplicantSponsor
        preconditions:
          - "Parent application APPROVED (ERR_APPLICATION_NOT_APPROVED)"
          - "Pathway permitted for change_type (ERR_INVALID_PATHWAY_FOR_CHANGE)"
        side_effects:
          - "Parent application open_supplement_count += 1"

      - from: "creation (CBE_30)"
        to: "review_status SUBMITTED x effectivity NOT_EFFECTIVE"
        trigger: "POST /generic-drug-review/applications/{id}/supplements with pathway CBE_30"
        actor: ApplicantSponsor
        preconditions:
          - "Parent application APPROVED; pathway permitted for change_type"
        side_effects:
          - "Parent application open_supplement_count += 1"

      - from: "creation (CBE_0)"
        to: "review_status SUBMITTED x effectivity EFFECTIVE"
        trigger: "POST /generic-drug-review/applications/{id}/supplements with pathway CBE_0"
        actor: ApplicantSponsor
        preconditions:
          - "Parent application APPROVED; pathway permitted for change_type"
        side_effects:
          - "effective_date := submitted_date"
          - "Parent application open_supplement_count += 1"

      - from: "creation (ANNUAL_REPORT)"
        to: "review_status LOGGED x effectivity EFFECTIVE"
        trigger: "POST /generic-drug-review/applications/{id}/supplements with pathway ANNUAL_REPORT"
        actor: ApplicantSponsor
        preconditions:
          - "Parent application APPROVED; pathway ANNUAL_REPORT permitted only for change_type EDITORIAL (ERR_INVALID_PATHWAY_FOR_CHANGE)"
        side_effects:
          - "effective_date := submitted_date"
          - "open_supplement_count unchanged (LOGGED is terminal at creation)"

      - from: "effectivity NOT_EFFECTIVE (CBE_30, review_status SUBMITTED)"
        to: "effectivity EFFECTIVE"
        trigger: "system (logical clock reaches submitted_date + 30 calendar days while review_status is SUBMITTED)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_date := submitted_date + 30 days"

      - from: "review_status SUBMITTED"
        to: "review_status APPROVED"
        trigger: "POST /generic-drug-review/supplements/{id}/review-decision with decision APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "review_status SUBMITTED (ERR_INVALID_STATE); pathway != ANNUAL_REPORT (ERR_SUPPLEMENT_NOT_REVIEWABLE)"
        side_effects:
          - "decision_date := current logical date"
          - "If effectivity NOT_EFFECTIVE and pathway PRIOR_APPROVAL: effectivity := EFFECTIVE, effective_date := decision_date"
          - "CBE_30 effectivity timing is unchanged by approval"
          - "Parent application open_supplement_count -= 1"

      - from: "review_status SUBMITTED"
        to: "review_status REJECTED"
        trigger: "POST /generic-drug-review/supplements/{id}/review-decision with decision REJECT"
        actor: RegulatoryReviewer
        preconditions:
          - "review_status SUBMITTED (ERR_INVALID_STATE); pathway != ANNUAL_REPORT (ERR_SUPPLEMENT_NOT_REVIEWABLE)"
        side_effects:
          - "decision_date := current logical date"
          - "If effectivity was EFFECTIVE (CBE_0 or CBE_30 past day 30): effectivity := REVOKED (distribution must cease)"
          - "Parent application open_supplement_count -= 1"

      - from: "review_status SUBMITTED"
        to: "review_status WITHDRAWN"
        trigger: "POST /generic-drug-review/supplements/{id}/withdraw"
        actor: ApplicantSponsor
        preconditions:
          - "review_status SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "If effectivity was EFFECTIVE: effectivity := REVOKED"
          - "Parent application open_supplement_count -= 1"

  - entity: ExclusivityAward
    initial_state: ELIGIBLE
    terminal_states: [EXPIRED, FORFEITED]
    transitions:
      - from: ELIGIBLE
        to: AWARDED
        trigger: "system (the award-holding application reaches APPROVED, whether directly or via TENTATIVE_APPROVAL re-evaluation)"
        actor: system
        preconditions: []
        side_effects:
          - "awarded_date := approval date; approval_date copied; marketing_deadline := approval_date + 75 days"
          - "All sibling applications for the same reference product recompute exclusivity_blocked := true and become ineligible for full approval"

      - from: AWARDED
        to: ACTIVE
        trigger: "POST /generic-drug-review/applications/{id}/record-first-marketing"
        actor: ApplicantSponsor
        preconditions:
          - "Application APPROVED (ERR_INVALID_STATE) and holds this award in AWARDED status (ERR_INVALID_STATE)"
        side_effects:
          - "first_marketing_date := current logical date (both on the award and the application)"
          - "exclusivity_end_date := first_marketing_date + 180 days"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock reaches exclusivity_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Sibling applications recompute exclusivity_blocked := false; TENTATIVE_APPROVAL re-evaluation"

      - from: ELIGIBLE
        to: FORFEITED
        trigger: "system or applicant action: (a) certification amended P4->P3 (CERTIFICATION_AMENDED); (b) application withdrawn (APPLICATION_WITHDRAWN); (c) application lapsed (APPLICATION_LAPSED); (d) late P4 notice recorded (NOTICE_LATE); (e) logical clock passes application.received_date + 30 months without the application reaching TENTATIVE_APPROVAL or APPROVED (TA_NOT_OBTAINED_30MO)"
        actor: system
        preconditions: []
        side_effects:
          - "forfeiture_reason set"
          - "No successor award is created for the reference product; siblings' exclusivity_blocked unchanged (ELIGIBLE never blocked)"

      - from: AWARDED
        to: FORFEITED
        trigger: "system or applicant action: (a) certification amended (CERTIFICATION_AMENDED); (b) application withdrawn (APPLICATION_WITHDRAWN); (c) logical clock passes marketing_deadline with first_marketing_date null (MARKETING_NOT_COMMENCED_75D)"
        actor: system
        preconditions: []
        side_effects:
          - "forfeiture_reason set"
          - "Sibling applications recompute exclusivity_blocked := false; TENTATIVE_APPROVAL re-evaluation"

  - entity: ProtectedIndication
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock passes protected_until; also evaluated at creation: a window already in the past starts EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "Carve-out obligations of applications referencing this reference product change on the next submit/approval validation"

  - entity: BioequivalenceStudy
    initial_state: "ACCEPTED or DEFICIENT (computed at creation from is_adequate)"
    terminal_states: [ACCEPTED, DEFICIENT]
    transitions: []
    note: "No transitions; a superseding study is a new entity. status is system-set at creation and never changes."

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-application-version
    parent_entity: GenericApplication
    write_endpoint: "POST /generic-drug-review/applications/{id}/amendments"
    occ_field: expected_application_version
    description: |
      Creating an Amendment against a GenericApplication whose version has
      advanced since the client last observed it is rejected. Amendments are
      legitimately creatable in sequence (an unsolicited amendment may follow
      a deficiency response), so a stale view is the only failure mode this
      rule guards: the writer's expected version no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: certification-create-stale-application-version
    parent_entity: GenericApplication
    write_endpoint: "POST /generic-drug-review/applications/{id}/patent-certifications"
    occ_field: expected_application_version
    description: |
      Creating a PatentCertification against a GenericApplication whose version
      has advanced since the client last observed it is rejected. Certifications
      for different patents of the same reference product are legitimately
      creatable in sequence, so only a stale parent view is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: month_arithmetic_convention
    trigger: "any calendar-month addition (goal dates, stay periods, response due dates, NCE bars, TA-failure clock)"
    algorithm: chronological
    formula: |
      add_months(date, n): add n calendar months; if the resulting day-of-month
      overflows the target month, clamp to the last day of that month.
      Example: add_months(2027-01-31, 10) == 2027-11-30.
      add_days(date, n): plain calendar-day addition; no clamping.
      "Within N days of X" means (date - X) <= N days, inclusive of day N.
    precision: "whole calendar days"

  - name: be_adequacy_determination
    trigger: "BioequivalenceStudy creation"
    algorithm: threshold
    formula: |
      ROUND-FIRST RULE (pinned): each CI bound is rounded to 2 decimal places
      with round_half_up BEFORE any comparison (decimal arithmetic).
      is_adequate =
        round2(auc_ci_low_pct)  >= 80.00 AND
        round2(auc_ci_high_pct) <= 125.00 AND
        round2(cmax_ci_low_pct) >= 80.00 AND
        round2(cmax_ci_high_pct) <= 125.00
      Bounds are INCLUSIVE: a rounded bound of exactly 80.00 or 125.00 passes.
      status := ACCEPTED when is_adequate else DEFICIENT.
    constants:
      BE_CI_LOWER_BOUND_PCT: 80.00
      BE_CI_UPPER_BOUND_PCT: 125.00
    precision: "2 decimal places, round_half_up, per-bound before comparison"
    variants:
      - name: pooled_average_verdict
        when: "alternative (NOT implemented) reading: average all submitted studies' bounds, then judge once"
        difference: "Under the official per-study rule each study is judged alone and the application needs >= 1 ACCEPTED study; the pooled variant averages bounds across studies first. Divergence example: study A auc_ci_low_pct 79.00 (fails alone), study B auc_ci_low_pct 80.20 (passes alone); pooled average 79.60 fails. The official rule is per-study."

  - name: goal_date_computation
    trigger: "ReviewCycle creation and every MAJOR amendment applied to the cycle"
    algorithm: tiered_pricing
    formula: |
      base = 8 if application.review_priority == PRIORITY else 10
      goal_date = add_months(opened_date, base + 3 * major_amendment_extensions_count)
      Evaluation order (pinned): (1) snapshot base at cycle open;
      (2) each MAJOR amendment increments extensions by exactly 1 (no cap);
      (3) recompute goal_date on every increment.
    constants:
      STANDARD_REVIEW_MONTHS: 10
      PRIORITY_REVIEW_MONTHS: 8
      MAJOR_AMENDMENT_EXTENSION_MONTHS: 3
    precision: "whole calendar days"

  - name: litigation_stay_window
    trigger: "SUIT_FILED litigation event with event_date <= suit_deadline"
    algorithm: threshold
    formula: |
      suit timely iff suit_filed_date - notice_date <= 45 days (day 45 inclusive)
      stay_until = add_months(notice_date, 30)   # clamped per convention
      Stay blocks full approval while notice.status == SUIT_FILED and
      court_outcome == NONE and current date < stay_until.
    constants:
      SUIT_WINDOW_DAYS: 45
      LITIGATION_STAY_MONTHS: 30
    precision: "whole calendar days"

  - name: approval_blocked_posture
    trigger: "approval-decision and every system re-evaluation of TENTATIVE_APPROVAL applications"
    algorithm: aggregation
    formula: |
      patent block dates, per CERTIFIED-or-AMENDED certification whose patent
      is still LISTED (not EXPIRED):
        PARAGRAPH_II_EXPIRED      -> never blocks (patent already expired)
        PARAGRAPH_III_DEFER       -> patent.expiry_date (inclusive: blocked while current date < expiry_date)
        PARAGRAPH_IV_CHALLENGE    -> by notice posture:
             no notice yet            -> hard error at approval (ERR_P4_NOTICE_REQUIRED), not a date block
             NOTICE_SENT/NO_SUIT_FILED -> no block (open suit window contributes nothing: OPTIMISTIC variant)
             SUIT_FILED, no outcome   -> stay_until (blocked while current date < stay_until)
             DECIDED_INVALID          -> no block
             DECIDED_VALID            -> patent.expiry_date
      patent_blocked_until = max(block dates strictly greater than current date), else null
      exclusivity_blocked = exists another application's ExclusivityAward for the
        same reference_product_id with status in {AWARDED, ACTIVE} (and, for
        ACTIVE, current date < exclusivity_end_date)
      Full approval allowed iff patent_blocked_until is null and
      exclusivity_blocked == false; otherwise an APPROVE decision yields
      TENTATIVE_APPROVAL.
    variants:
      - name: conservative_window_blocking
        when: "alternative (NOT implemented) reading: an open 45-day suit window blocks approval until suit_deadline passes"
        difference: "Under the official optimistic variant an open window with no suit filed contributes no block, so approval may proceed immediately; the conservative variant blocks until suit_deadline. Divergence: notice sent 2026-09-10, clock 2026-09-15, no suit -> official approves now, conservative blocks until 2026-10-25."

  - name: first_filer_determination
    trigger: "GenericApplication submit (DRAFT -> RECEIVED)"
    algorithm: aggregation
    formula: |
      When an application with >= 1 PARAGRAPH_IV_CHALLENGE certification is
      filed (reaches RECEIVED) and no ExclusivityAward yet exists for its
      reference_product_id, create ExclusivityAward(ELIGIBLE) for it.
      Tie-break (pinned): the first application to reach RECEIVED wins; if two
      receipts land at the same logical instant, the one whose submit request
      was committed first wins. Random ids never participate.
    precision: "whole calendar days"

  - name: exclusivity_window_and_forfeiture
    trigger: "award transitions, record-first-marketing, clock-set"
    algorithm: threshold
    formula: |
      marketing_deadline   = add_days(approval_date, 75)         # marketing on the deadline day is timely
      exclusivity_end_date = add_days(first_marketing_date, 180) # block lifts AT this date (strict <)
      TA-failure clock     = add_months(application.received_date, 30)
      Forfeiture events (any one flips ELIGIBLE|AWARDED -> FORFEITED):
        NOTICE_LATE, CERTIFICATION_AMENDED, APPLICATION_WITHDRAWN,
        APPLICATION_LAPSED, TA_NOT_OBTAINED_30MO, MARKETING_NOT_COMMENCED_75D
    constants:
      EXCLUSIVITY_DAYS: 180
      FAILURE_TO_MARKET_DAYS: 75
      TA_FAILURE_MONTHS: 30
    precision: "whole calendar days"

  - name: deficiency_response_clock
    trigger: "issue-deficiency; clock-set lapse evaluation"
    algorithm: threshold
    formula: |
      deficiency_response_due_date = add_months(deficiency_issued_date, 12)  # clamped
      A responding amendment received ON the due date is timely.
      When the clock passes the due date with no response: cycle LAPSED and
      parent application LAPSED (cascade per state machines).
    constants:
      DEFICIENCY_RESPONSE_MONTHS: 12
    precision: "whole calendar days"

  - name: nce_submission_bar
    trigger: "GenericApplication submit"
    algorithm: threshold
    formula: |
      If reference_product.is_new_chemical_entity:
        current date <  add_months(rld_approval_date, 48)  -> ERR_NCE_SUBMISSION_BARRED
        in [+48, +60) months                                -> allowed only if the application
                                                               carries >= 1 PARAGRAPH_IV_CHALLENGE certification
        >= add_months(rld_approval_date, 60)                -> unrestricted
      Boundary is INCLUSIVE: submission exactly at +48 months with a P4
      certification is allowed; one day earlier is barred.
    constants:
      NCE_PIV_BAR_MONTHS: 48
      NCE_FULL_BAR_MONTHS: 60
    precision: "whole calendar days"

  - name: facility_clearance_evaluation
    trigger: "approval-decision (business_safety gate)"
    algorithm: aggregation
    formula: |
      Let F = distinct facility_ids over the application's inspections with
      status != CANCELLED. ERR_FACILITY_CLEARANCE_FAILED when F is empty.
      For each f in F, let latest(f) = the non-CANCELLED inspection with the
      latest outcome commit order (ties impossible: outcomes are recorded
      sequentially; created_at is the fallback ordering key, never id).
      Clearance requires, for every f in F: latest(f).status in {PASSED, WAIVED};
      and additionally, for every FOREIGN f in F (is_foreign == true): at least
      one inspection of f for this application with status PASSED (a waiver
      never clears a foreign site).
      Any violation -> ERR_FACILITY_CLEARANCE_FAILED.
    constants:
      DOMESTIC_WAIVER_PRIOR_PASS_MONTHS: 24
    precision: "whole calendar days"

  - name: supplement_pathway_map
    trigger: "Supplement creation"
    algorithm: threshold
    formula: |
      Permitted pathways per change_type (any other pairing -> ERR_INVALID_PATHWAY_FOR_CHANGE):
        MANUFACTURING_SITE -> [PRIOR_APPROVAL]
        FORMULATION        -> [PRIOR_APPROVAL]
        LABELING           -> [PRIOR_APPROVAL, CBE_30]
        PACKAGING          -> [PRIOR_APPROVAL, CBE_30, CBE_0]
        EDITORIAL          -> [CBE_0, ANNUAL_REPORT]
    precision: "n/a"

  - name: supplement_effectivity
    trigger: "Supplement creation, review-decision, clock-set"
    algorithm: threshold
    formula: |
      PRIOR_APPROVAL: effective on the review decision date iff APPROVED.
      CBE_30: effective at submitted_date + 30 days (inclusive) while
        review_status == SUBMITTED; a later REJECT revokes.
      CBE_0: effective immediately at creation; a later REJECT revokes.
      ANNUAL_REPORT: effective immediately; never reviewable, never revoked.
    constants:
      CBE30_EFFECTIVE_DAYS: 30
    precision: "whole calendar days"

  - name: notice_timeliness
    trigger: "PatentChallengeNotice creation"
    algorithm: threshold
    formula: |
      is_timely = (notice_date - application.received_date) <= 20 days (day 20 inclusive)
      A late notice is still recorded; its side effect is forfeiture of the
      applicant's ELIGIBLE ExclusivityAward (reason NOTICE_LATE).
    constants:
      P4_NOTICE_WINDOW_DAYS: 20
    precision: "whole calendar days"

  - name: inspection_overlap_rule
    trigger: "FacilityInspection creation"
    algorithm: interval_merge
    formula: |
      HALF-OPEN semantics: the occupied window is [scheduled_start_date, scheduled_end_date).
      A new inspection for the same facility conflicts with an existing
      SCHEDULED inspection iff new.start < existing.end AND existing.start < new.end.
      Adjacency is ALLOWED: new.start == existing.end does not conflict.
      Inspections in any terminal outcome status never block.
      Conflict -> ERR_INSPECTION_OVERLAP.
    precision: "whole calendar days"

  - name: indication_protection_overlap_rule
    trigger: "ProtectedIndication creation"
    algorithm: interval_merge
    formula: |
      CLOSED semantics: the occupied window is [effective_from, protected_until],
      inclusive on both ends. A new ACTIVE window for the same
      (reference_product_id, indication_code) conflicts with an existing ACTIVE
      window iff new.start <= existing.end AND existing.start <= new.end.
      ADJACENCY COUNTS AS CONFLICT (unlike inspections): new.start == existing.end
      is rejected with ERR_INDICATION_WINDOW_OVERLAP.
      EXPIRED windows never block.
    precision: "whole calendar days"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority; lower wins on conflict)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The caller's role must be listed for the endpoint"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Ownership: ApplicantSponsor's X-User-ID must equal the target application's (or facility's) applicant_id; InnovatorSponsor's X-User-ID must equal the reference product's patent_owner_user_id for patent listing and SUIT_FILED events. Evaluated only when the target resource exists; a missing resource yields the priority-4 existence error"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped endpoints (application actions, BE studies, certifications, notices, amendments, facilities, supplements, patent listing, SUIT_FILED)"

  - priority: 4
    category: existence
    check: "Path ids must exist, validated left-to-right; body-referenced ids (reference_product_id, patent_id, facility_id, application_id) must exist, validated in the endpoint's input declaration order"
    error_id: "ERR_APPLICANT_NOT_FOUND / ERR_REFERENCE_PRODUCT_NOT_FOUND / ERR_LISTED_PATENT_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_CERTIFICATION_NOT_FOUND / ERR_NOTICE_NOT_FOUND / ERR_REVIEW_CYCLE_NOT_FOUND / ERR_FACILITY_NOT_FOUND / ERR_INSPECTION_NOT_FOUND / ERR_SUPPLEMENT_NOT_FOUND / ERR_EXCLUSIVITY_AWARD_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Request body shape: required fields present, enum members valid, dates well-formed, scheduled_end_date >= scheduled_start_date, protected_until >= effective_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints
    note: "Unknown payload fields and client-supplied computed/system fields (id, created_at, version, is_adequate, status, ...) are IGNORED, never echoed and never rejected"

  - priority: 6
    category: state
    check: "OCC: expected_application_version must equal the application's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /generic-drug-review/applications/{id}/amendments, POST /generic-drug-review/applications/{id}/patent-certifications"

  - priority: 7
    category: state
    check: "State-machine preconditions of the target transition (e.g. submit only from DRAFT, approval-decision only from RECEIVED, record-outcome only from SCHEDULED, amend only on a CERTIFIED P4 certification)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: business_safety
    check: "Bioequivalence: submit and approval require at least one ACCEPTED BioequivalenceStudy"
    error_id: ERR_NO_ADEQUATE_BE_STUDY
    http_status: 422
    applies_to: "submit, approval-decision"

  - priority: 9
    category: business_safety
    check: "Facility clearance per calculations.facility_clearance_evaluation (at least one inspected facility; every inspected facility's latest outcome PASSED or WAIVED; foreign facilities require at least one PASSED)"
    error_id: ERR_FACILITY_CLEARANCE_FAILED
    http_status: 422
    applies_to: "approval-decision"

  - priority: 10
    category: business_safety
    check: "Waiver legitimacy: outcome WAIVED only for domestic facilities with a prior PASSED inspection whose outcome_date is within the prior 24 months"
    error_id: ERR_FOREIGN_FACILITY_WAIVER
    http_status: 422
    applies_to: "record-outcome"

  - priority: 11
    category: business_temporal
    check: "NCE submission bar per calculations.nce_submission_bar"
    error_id: ERR_NCE_SUBMISSION_BARRED
    http_status: 422
    applies_to: submit

  - priority: 12
    category: business_temporal
    check: "Inspection half-open overlap per calculations.inspection_overlap_rule"
    error_id: ERR_INSPECTION_OVERLAP
    http_status: 409
    applies_to: "POST /generic-drug-review/facility-inspections"

  - priority: 13
    category: business_temporal
    check: "Protected-indication closed-window overlap per calculations.indication_protection_overlap_rule"
    error_id: ERR_INDICATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /generic-drug-review/reference-products/{id}/protected-indications"

  - priority: 14
    category: business_constraint
    check: "Carve-out completeness: carved_indication_codes must EQUAL the set of ACTIVE ProtectedIndication codes of the reference product (evaluated at submit and re-evaluated at approval-decision); a missing carve or a FULL label with active protections fails one way, a carve of an unprotected indication fails the other"
    error_id: "ERR_LABEL_CARVE_OUT_INCOMPLETE / ERR_CARVE_OUT_OF_UNPROTECTED"
    http_status: 422
    applies_to: "submit, approval-decision, application creation"

  - priority: 15
    category: business_constraint
    check: "Certification completeness: at submit, exactly one PatentCertification per LISTED patent of the reference product"
    error_id: ERR_CERTIFICATION_INCOMPLETE
    http_status: 422
    applies_to: submit

  - priority: 16
    category: business_constraint
    check: "One certification per (application, patent); one notice per P4 certification"
    error_id: "ERR_DUPLICATE_CERTIFICATION / ERR_NOTICE_ALREADY_EXISTS"
    http_status: 409
    applies_to: "patent-certification creation, notice creation"

  - priority: 17
    category: business_constraint
    check: "P4 notice outstanding: every CERTIFIED PARAGRAPH_IV_CHALLENGE certification must have its notice recorded before approval"
    error_id: ERR_P4_NOTICE_REQUIRED
    http_status: 422
    applies_to: approval-decision

  - priority: 18
    category: business_constraint
    check: "Supplement pathway permitted for change_type per calculations.supplement_pathway_map"
    error_id: ERR_INVALID_PATHWAY_FOR_CHANGE
    http_status: 422
    applies_to: "supplement creation"

  - priority: 19
    category: business_referential
    check: "Certification's patent must be listed on the application's reference product"
    error_id: ERR_PATENT_NOT_LISTED_FOR_REFERENCE_PRODUCT
    http_status: 409
    applies_to: "patent-certification creation"

  - priority: 20
    category: business_referential
    check: "Inspection's facility must belong to the same applicant as the application (facility.applicant_id == application.applicant_id)"
    error_id: ERR_FACILITY_APPLICATION_MISMATCH
    http_status: 409
    applies_to: "POST /generic-drug-review/facility-inspections"

  - priority: 21
    category: business_referential
    check: "ProtectedIndication.indication_code must be a member of the reference product's indication_codes"
    error_id: ERR_INDICATION_NOT_ON_REFERENCE_PRODUCT
    http_status: 422
    applies_to: "POST /generic-drug-review/reference-products/{id}/protected-indications"

  - priority: 22
    category: business_referential
    check: "ListedPatent.use_code required iff patent_type == METHOD_OF_USE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "listed-patent creation"

# =============================================================================
# Table 1.5: API Endpoint Table
# GET endpoints list all five roles; ownership scoping does not hide reads.
# =============================================================================
endpoints:
  # --- Clock (test-driving; outside the business prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z and never wall-clock time. to_iso8601 must be >= current logical time (backward moves -> ERR_INVALID_REQUEST). Fires every system transition: patent and protection expiry, deficiency lapse, stay expiry, suit-window close, exclusivity forfeiture/expiry, CBE-30 effectivity, TENTATIVE_APPROVAL re-evaluation."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all time-driven system transitions re-evaluated"]

  # --- Companies ---
  - method: POST
    path: "/generic-drug-review/applicant-companies"
    description: "Register a generic applicant company"
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, contact_email, headquarters_country]
    output: ApplicantCompany
    side_effects: []

  - method: GET
    path: "/generic-drug-review/applicant-companies/{id}"
    description: "Get one applicant company"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: ApplicantCompany
    side_effects: []

  - method: GET
    path: "/generic-drug-review/applicant-companies/{id}/manufacturing-facilities"
    description: "List facilities owned by an applicant (reverse FK reachability for ManufacturingFacility.applicant_id)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: "ManufacturingFacility[]"
    side_effects: []

  # --- Manufacturing facilities ---
  - method: POST
    path: "/generic-drug-review/manufacturing-facilities"
    description: "Register a manufacturing facility owned by the acting applicant (applicant_id must equal X-User-ID)"
    roles: [ApplicantSponsor]
    code: 201
    input: [applicant_id, facility_name, fei_number, country_code]
    output: ManufacturingFacility
    side_effects: ["is_foreign computed from country_code"]

  # --- Reference products, patents, protected indications ---
  - method: POST
    path: "/generic-drug-review/reference-products"
    description: "Register a reference listed drug"
    roles: [ProgramAdmin]
    code: 201
    input: [brand_name, active_ingredient, strength, dosage_form, rld_approval_date, is_new_chemical_entity, indication_codes, patent_owner_user_id]
    output: ReferenceProduct
    side_effects: []

  - method: GET
    path: "/generic-drug-review/reference-products/{id}"
    description: "Get one reference product"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: ReferenceProduct
    side_effects: []

  - method: POST
    path: "/generic-drug-review/reference-products/{id}/listed-patents"
    description: "List a patent against the reference product (caller must be the product's patent_owner_user_id)"
    roles: [InnovatorSponsor]
    code: 201
    input: [patent_number, patent_type, expiry_date, "use_code?"]
    output: ListedPatent
    side_effects: ["status := EXPIRED immediately when expiry_date is already past"]

  - method: GET
    path: "/generic-drug-review/reference-products/{id}/listed-patents"
    description: "List patents of a reference product"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ListedPatent[]"
    side_effects: []

  - method: POST
    path: "/generic-drug-review/reference-products/{id}/protected-indications"
    description: "Register a protected (exclusivity- or method-of-use-covered) indication window; closed-interval overlap with an ACTIVE window of the same indication_code is rejected"
    roles: [ProgramAdmin]
    code: 201
    input: [indication_code, effective_from, protected_until]
    output: ProtectedIndication
    side_effects: ["status := EXPIRED immediately when protected_until is already past"]

  - method: GET
    path: "/generic-drug-review/reference-products/{id}/protected-indications"
    description: "List protected indications of a reference product"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ProtectedIndication[]"
    side_effects: []

  # --- Generic applications ---
  - method: POST
    path: "/generic-drug-review/applications"
    description: "Create a DRAFT abbreviated application (applicant_id must equal X-User-ID); carve-out set validated against currently ACTIVE protections"
    roles: [ApplicantSponsor]
    code: 201
    input: [reference_product_id, applicant_id, review_priority, labeling_mode, "carved_indication_codes?"]
    output: GenericApplication
    side_effects: ["status := DRAFT, current_cycle_number := 0"]

  - method: GET
    path: "/generic-drug-review/applications"
    description: "List applications with optional filters (reverse FK reachability for applicant_id and reference_product_id)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["applicant_id?", "reference_product_id?", "status?", "limit?", "offset?"]
    output: "GenericApplication[]"
    side_effects: []

  - method: GET
    path: "/generic-drug-review/applications/{id}"
    description: "Get one application including computed posture fields"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: GenericApplication
    side_effects: []

  - method: POST
    path: "/generic-drug-review/applications/{id}/submit"
    description: "File the application: runs the full filing gate (state, BE adequacy, NCE bar, certification completeness, carve-out), then DRAFT -> RECEIVED, creates ReviewCycle 1, and creates the first-filer ExclusivityAward when applicable"
    roles: [ApplicantSponsor]
    code: 200
    input: []
    output: GenericApplication
    side_effects: ["received_date set", "ReviewCycle 1 opened", "ExclusivityAward ELIGIBLE created for first P4 filer", "increments GenericApplication.version by 1"]

  - method: POST
    path: "/generic-drug-review/applications/{id}/approval-decision"
    description: "Review decision on the current cycle: APPROVE yields APPROVED when no block is active, else TENTATIVE_APPROVAL; REFUSE yields REFUSED_APPROVAL"
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision]
    output: GenericApplication
    side_effects: ["current cycle CLOSED", "on APPROVED: first-filer award -> AWARDED", "increments GenericApplication.version by 1"]

  - method: POST
    path: "/generic-drug-review/applications/{id}/withdraw"
    description: "Withdraw from DRAFT, RECEIVED, TENTATIVE_APPROVAL or APPROVED; forfeits the applicant's award"
    roles: [ApplicantSponsor]
    code: 200
    input: []
    output: GenericApplication
    side_effects: ["award -> FORFEITED (APPLICATION_WITHDRAWN) when ELIGIBLE/AWARDED/ACTIVE", "increments GenericApplication.version by 1"]

  - method: POST
    path: "/generic-drug-review/applications/{id}/record-first-marketing"
    description: "Record first commercial marketing of an approved first-filer; activates the 180-day exclusivity window"
    roles: [ApplicantSponsor]
    code: 200
    input: []
    output: ExclusivityAward
    side_effects: ["award AWARDED -> ACTIVE", "first_marketing_date and exclusivity_end_date set", "increments GenericApplication.version by 1"]

  # --- Bioequivalence studies ---
  - method: POST
    path: "/generic-drug-review/applications/{id}/bioequivalence-studies"
    description: "Submit a bioequivalence study (application DRAFT or RECEIVED); is_adequate and status computed per calculations.be_adequacy_determination"
    roles: [ApplicantSponsor]
    code: 201
    input: [study_type, analyte, auc_ratio_pct, auc_ci_low_pct, auc_ci_high_pct, cmax_ratio_pct, cmax_ci_low_pct, cmax_ci_high_pct]
    output: BioequivalenceStudy
    side_effects: ["is_adequate computed (round-first per bound)", "status := ACCEPTED | DEFICIENT"]

  - method: GET
    path: "/generic-drug-review/applications/{id}/bioequivalence-studies"
    description: "List BE studies of an application"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BioequivalenceStudy[]"
    side_effects: []

  # --- Patent certifications ---
  - method: POST
    path: "/generic-drug-review/applications/{id}/patent-certifications"
    description: "File a patent certification on a DRAFT application (OCC-guarded); one certification per patent"
    roles: [ApplicantSponsor]
    code: 201
    input: [patent_id, certification_type, expected_application_version]
    output: PatentCertification
    side_effects: ["filed_date set", "increments GenericApplication.version by 1"]

  - method: GET
    path: "/generic-drug-review/patent-certifications/{id}"
    description: "Get one patent certification"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: PatentCertification
    side_effects: []

  - method: GET
    path: "/generic-drug-review/patent-certifications"
    description: "List patent certifications with optional filters (reverse FK reachability for application_id and patent_id)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["application_id?", "patent_id?", "limit?", "offset?"]
    output: "PatentCertification[]"
    side_effects: []

  - method: POST
    path: "/generic-drug-review/patent-certifications/{id}/amend"
    description: "Amend a PARAGRAPH_IV_CHALLENGE certification to PARAGRAPH_III_DEFER (one-way); forfeits the applicant's exclusivity award"
    roles: [ApplicantSponsor]
    code: 200
    input: []
    output: PatentCertification
    side_effects: ["status -> AMENDED_TO_P3", "award -> FORFEITED (CERTIFICATION_AMENDED)", "sibling TA re-evaluation", "increments GenericApplication.version by 1"]

  # --- Paragraph IV notices and litigation ---
  - method: POST
    path: "/generic-drug-review/patent-certifications/{id}/notices"
    description: "Record the paragraph-IV notice to the patent holder (application must be RECEIVED or TENTATIVE_APPROVAL; certification CERTIFIED P4; one notice per certification)"
    roles: [ApplicantSponsor]
    code: 201
    input: []
    output: PatentChallengeNotice
    side_effects: ["notice_date := current logical date", "is_timely and suit_deadline computed", "late notice forfeits ELIGIBLE award (NOTICE_LATE)"]

  - method: GET
    path: "/generic-drug-review/patent-certifications/{id}/notices"
    description: "List notices for a certification (0 or 1 element)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: "PatentChallengeNotice[]"
    side_effects: []

  - method: POST
    path: "/generic-drug-review/patent-notices/{id}/litigation-events"
    description: "Record a litigation event: SUIT_FILED (InnovatorSponsor owning the underlying reference product) or COURT_DECIDED (ProgramAdmin). A timely suit creates the 30-month stay; a late-suit record moves the notice to NO_SUIT_FILED without a stay"
    roles: [InnovatorSponsor, ProgramAdmin]
    code: 200
    input: [event_type, event_date, "outcome?"]
    output: PatentChallengeNotice
    side_effects: ["stay_until computed on timely SUIT_FILED", "patent_blocked_until recomputed", "TA re-evaluation on stay expiry/court decision"]
    note: "SUIT_FILED requires event_type SUIT_FILED from the InnovatorSponsor owning the underlying reference product and event_date <= suit_deadline; COURT_DECIDED requires ProgramAdmin, a SUIT_FILED notice, and outcome PATENT_VALID | PATENT_INVALID_OR_NOT_INFRINGED"

  # --- Review cycles and deficiency letters ---
  - method: GET
    path: "/generic-drug-review/applications/{id}/review-cycles"
    description: "List review cycles of an application (reverse FK reachability for ReviewCycle.application_id); ordered by cycle_number ASC"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: "ReviewCycle[]"
    side_effects: []

  - method: POST
    path: "/generic-drug-review/review-cycles/{id}/issue-deficiency"
    description: "Issue a deficiency letter (complete response). From OPEN: cycle -> CRL_ISSUED. From AMENDMENT_RECEIVED: current cycle CLOSED (SUPERSEDED) and the next cycle opens already in CRL_ISSUED."
    roles: [RegulatoryReviewer]
    code: 201
    input: ["deficiency_summary?"]
    output: ReviewCycle
    side_effects: ["deficiency_issued_date and response due date set", "parent open_deficiency_count recomputed", "on second-round issuance: new cycle opened CRL_ISSUED"]

  # --- Amendments ---
  - method: POST
    path: "/generic-drug-review/applications/{id}/amendments"
    description: "Submit an amendment (OCC-guarded). Application must be RECEIVED or TENTATIVE_APPROVAL, else ERR_INVALID_STATE. While the current cycle is CRL_ISSUED it records the deficiency response (cycle -> AMENDMENT_RECEIVED); on any other open-cycle posture it is an unsolicited amendment. On a TENTATIVE_APPROVAL application it reopens review (application -> RECEIVED, new cycle OPEN). A MAJOR amendment extends the current cycle's goal date by 3 months."
    roles: [ApplicantSponsor]
    code: 201
    input: [classification, contains_new_be_data, expected_application_version, "notes?"]
    output: Amendment
    side_effects: ["cycle status updated per rules", "MAJOR extends goal date", "increments GenericApplication.version by 1"]

  - method: GET
    path: "/generic-drug-review/applications/{id}/amendments"
    description: "List amendments of an application (reverse FK reachability for Amendment.application_id)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: "Amendment[]"
    side_effects: []

  # --- Facility inspections ---
  - method: POST
    path: "/generic-drug-review/facility-inspections"
    description: "Schedule a pre-approval inspection of a facility for an application (facility must belong to the application's applicant; half-open overlap with the facility's SCHEDULED inspections is rejected)"
    roles: [RegulatoryReviewer]
    code: 201
    input: [facility_id, application_id, scheduled_start_date, scheduled_end_date]
    output: FacilityInspection
    side_effects: ["status := SCHEDULED"]

  - method: GET
    path: "/generic-drug-review/facility-inspections/{id}"
    description: "Get one facility inspection"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: FacilityInspection
    side_effects: []

  - method: GET
    path: "/generic-drug-review/facility-inspections"
    description: "List facility inspections with optional filters (reverse FK reachability for facility_id and application_id)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["facility_id?", "application_id?", "status?", "limit?", "offset?"]
    output: "FacilityInspection[]"
    side_effects: []

  - method: POST
    path: "/generic-drug-review/facility-inspections/{id}/record-outcome"
    description: "Record the inspection outcome; WAIVED requires a domestic facility with a prior PASSED inspection within 24 months"
    roles: [FacilityInspector]
    code: 200
    input: [outcome]
    output: FacilityInspection
    side_effects: ["status -> PASSED | FAILED | WAIVED | CANCELLED", "outcome_date set"]

  # --- Supplements ---
  - method: POST
    path: "/generic-drug-review/applications/{id}/supplements"
    description: "Submit a post-approval change supplement (application must be APPROVED); pathway validated against change_type"
    roles: [ApplicantSponsor]
    code: 201
    input: [change_type, pathway, "description?"]
    output: Supplement
    side_effects: ["review_status/effectivity initialized per pathway", "open_supplement_count updated"]

  - method: GET
    path: "/generic-drug-review/applications/{id}/supplements"
    description: "List supplements of an application (reverse FK reachability for Supplement.application_id)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Supplement[]"
    side_effects: []

  - method: POST
    path: "/generic-drug-review/supplements/{id}/review-decision"
    description: "Approve or reject a SUBMITTED supplement (ANNUAL_REPORT supplements are LOGGED and not reviewable)"
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision]
    output: Supplement
    side_effects: ["review_status -> APPROVED | REJECTED", "effectivity updated per pathway", "open_supplement_count recomputed"]

  - method: POST
    path: "/generic-drug-review/supplements/{id}/withdraw"
    description: "Withdraw a SUBMITTED supplement; an already-effective change is revoked"
    roles: [ApplicantSponsor]
    code: 200
    input: []
    output: Supplement
    side_effects: ["review_status -> WITHDRAWN", "effectivity -> REVOKED when EFFECTIVE", "open_supplement_count recomputed"]

  # --- Exclusivity awards ---
  - method: GET
    path: "/generic-drug-review/exclusivity-awards/{id}"
    description: "Get one exclusivity award"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: []
    output: ExclusivityAward
    side_effects: []

  - method: GET
    path: "/generic-drug-review/exclusivity-awards"
    description: "List exclusivity awards with optional filters (reverse FK reachability for reference_product_id and application_id)"
    roles: [ProgramAdmin, ApplicantSponsor, InnovatorSponsor, RegulatoryReviewer, FacilityInspector]
    code: 200
    input: ["reference_product_id?", "application_id?", "status?", "limit?", "offset?"]
    output: "ExclusivityAward[]"
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (applicant mismatch / patent_owner_user_id mismatch)" }
  # --- existence ---
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Applicant company id does not exist" }
  - { id: ERR_REFERENCE_PRODUCT_NOT_FOUND, http: 404, condition: "Reference product id does not exist" }
  - { id: ERR_LISTED_PATENT_NOT_FOUND, http: 404, condition: "Listed patent id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "Patent certification id does not exist" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "Patent challenge notice id does not exist" }
  - { id: ERR_REVIEW_CYCLE_NOT_FOUND, http: 404, condition: "Review cycle id does not exist" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Manufacturing facility id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Facility inspection id does not exist" }
  - { id: ERR_SUPPLEMENT_NOT_FOUND, http: 404, condition: "Supplement id does not exist" }
  - { id: ERR_EXCLUSIVITY_AWARD_NOT_FOUND, http: 404, condition: "Exclusivity award id does not exist" }
  # --- input shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, malformed date, end before start, invalid litigation event payload, backward clock move" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version does not match the application's current version" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the requested transition (includes terminal-state lockdown and second-notice/duplicate-transition attempts)" }
  - { id: ERR_DEFICIENCY_RESPONSE_OPEN, http: 409, condition: "Approval decision attempted while a review cycle is CRL_ISSUED with no response received" }
  - { id: ERR_CERTIFICATION_NOT_AMENDABLE, http: 409, condition: "Amend attempted on a certification that is not a CERTIFIED PARAGRAPH_IV_CHALLENGE" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Supplement or first-marketing action requires an APPROVED application" }
  - { id: ERR_SUPPLEMENT_NOT_REVIEWABLE, http: 409, condition: "Review decision attempted on an ANNUAL_REPORT (LOGGED) supplement" }
  # --- business: safety ---
  - { id: ERR_NO_ADEQUATE_BE_STUDY, http: 422, condition: "No ACCEPTED bioequivalence study exists for the application at submit or approval" }
  - { id: ERR_FACILITY_CLEARANCE_FAILED, http: 422, condition: "Facility clearance evaluation failed at approval (no inspected facility, a latest outcome not PASSED/WAIVED, or a foreign facility without a PASSED inspection)" }
  - { id: ERR_FOREIGN_FACILITY_WAIVER, http: 422, condition: "WAIVED outcome on a foreign facility or without a prior PASSED inspection within 24 months" }
  # --- business: temporal ---
  - { id: ERR_NCE_SUBMISSION_BARRED, http: 422, condition: "NCE bar: before rld_approval_date + 48 months, or before + 60 months without a PARAGRAPH_IV_CHALLENGE certification" }
  - { id: ERR_INSPECTION_OVERLAP, http: 409, condition: "Half-open inspection window collides with another SCHEDULED inspection of the same facility" }
  - { id: ERR_INDICATION_WINDOW_OVERLAP, http: 409, condition: "Closed protection window for the same indication_code overlaps or abuts an ACTIVE window" }
  # --- business: constraint ---
  - { id: ERR_LABEL_CARVE_OUT_INCOMPLETE, http: 422, condition: "An ACTIVE protected indication is missing from carved_indication_codes (or labeling_mode FULL used while protections are active)" }
  - { id: ERR_CARVE_OUT_OF_UNPROTECTED, http: 422, condition: "carved_indication_codes contains a code with no ACTIVE protection (carving more than the protected set)" }
  - { id: ERR_CERTIFICATION_INCOMPLETE, http: 422, condition: "At submit: not exactly one certification per LISTED patent of the reference product" }
  - { id: ERR_DUPLICATE_CERTIFICATION, http: 409, condition: "A certification already exists for this (application, patent) pair" }
  - { id: ERR_NOTICE_ALREADY_EXISTS, http: 409, condition: "A notice already exists for this paragraph-IV certification" }
  - { id: ERR_P4_NOTICE_REQUIRED, http: 422, condition: "Approval attempted with a CERTIFIED PARAGRAPH_IV_CHALLENGE certification lacking its notice" }
  - { id: ERR_INVALID_PATHWAY_FOR_CHANGE, http: 422, condition: "Supplement pathway not permitted for the change_type" }
  # --- business: referential ---
  - { id: ERR_PATENT_NOT_LISTED_FOR_REFERENCE_PRODUCT, http: 409, condition: "Certification references a patent not listed on the application's reference product" }
  - { id: ERR_FACILITY_APPLICATION_MISMATCH, http: 409, condition: "Inspection's facility belongs to a different applicant than the application" }
  - { id: ERR_INDICATION_NOT_ON_REFERENCE_PRODUCT, http: 422, condition: "Protected indication code is not a member of the reference product's indication_codes" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Agency program administrator: reference product registry, protected indications, applicant registration, court outcomes, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /generic-drug-review/applicant-companies"
      - "POST /generic-drug-review/reference-products"
      - "POST /generic-drug-review/reference-products/{id}/protected-indications"
      - "COURT_DECIDED litigation events"
    shared_operations: ["all GET endpoints"]

  - name: ApplicantSponsor
    description: "Generic drug applicant; acts only on applications and facilities it owns (X-User-ID == applicant_id)"
    identity: "entity_backed:ApplicantCompany"
    exclusive_operations:
      - "POST /generic-drug-review/manufacturing-facilities"
      - "POST /generic-drug-review/applications"
      - "POST /generic-drug-review/applications/{id}/submit | withdraw | record-first-marketing"
      - "POST /generic-drug-review/applications/{id}/bioequivalence-studies"
      - "POST /generic-drug-review/applications/{id}/patent-certifications and /amend"
      - "POST /generic-drug-review/patent-certifications/{id}/notices"
      - "POST /generic-drug-review/applications/{id}/amendments"
      - "POST /generic-drug-review/applications/{id}/supplements and /supplements/{id}/withdraw"
    shared_operations: ["all GET endpoints"]

  - name: InnovatorSponsor
    description: "Reference product sponsor / patent owner; X-User-ID must equal the product's patent_owner_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /generic-drug-review/reference-products/{id}/listed-patents"
      - "SUIT_FILED litigation events"
    shared_operations: ["all GET endpoints"]

  - name: RegulatoryReviewer
    description: "Agency reviewer: deficiency letters, approval decisions, supplement decisions, inspection scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /generic-drug-review/applications/{id}/approval-decision"
      - "POST /generic-drug-review/review-cycles/{id}/issue-deficiency"
      - "POST /generic-drug-review/facility-inspections"
      - "POST /generic-drug-review/supplements/{id}/review-decision"
    shared_operations: ["all GET endpoints"]

  - name: FacilityInspector
    description: "Field inspector recording pre-approval inspection outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /generic-drug-review/facility-inspections/{id}/record-outcome"
    shared_operations: ["all GET endpoints"]
