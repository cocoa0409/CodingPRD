          - state_machines.ScreeningCheck.HIT_PENDING_REVIEW_to_ESCALATED
          - state_machines.ScreeningCheck.HIT_PENDING_REVIEW_to_RELEASED
          - errors.ERR_SCREENING_NOT_CLEARED
          - errors.ERR_DUAL_USE_ESCALATED
          - calculations.sanctions_dual_use_score
          - entities.SettlementClaim.fields.status
