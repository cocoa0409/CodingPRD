            - call: "POST /registry/importers"
              payload: { firm_name: "Cascade Commodities", account_code: "IMP-701" }
              as: PlatformAdmin
              captures: { imp7: $.data.id }
            - call: "POST /registry/laboratories"
              payload: { lab_code: "LAB-FULL", daily_sample_capacity: 1 }
              as: PlatformAdmin
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp7}", facility_id: "${fac_k}", product_code: "PC-RICE-01", product_risk_class: "HIGH", transport_mode: "VESSEL", arrival_eta: "2026-10-02T12:00:00Z", declared_units: 80, unit_value_cents: 100, port_code: "US-SEA" }
              as: Importer
              as_user_id: "${imp7}"
              captures: { pn_k: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_k}" }
              as: Importer
              as_user_id: "${imp7}"
              captures: { ent_k: $.data.id }
            - call: "POST /registry/entries/${ent_k}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
            - call: "POST /registry/entries/${ent_k}/record-sample"
              payload: { lab_code: "LAB-FULL", sample_units: 1, analysis_date: "2026-09-30" }
              as: EntryReviewer
              as_user_id: "er-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T12:00:00Z" }
