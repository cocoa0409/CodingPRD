  - rule_id: cross_entity_state_dependency
    instances:
      - name: attempt_creation_requires_active_term
        grounds:
          - validations.priority_10_ERR_TERM_NOT_ACTIVE
          - state_machines.SubscriptionTerm.PENDING_to_ACTIVE
          - entities.AssessmentAttempt.fields.term_id
          - entities.AssessmentAttempt.fields.attempt_number
          - calculations.attempt_eligibility_ladder
        distinguishing_aspect: |
          Entity pair (AssessmentAttempt depends on SubscriptionTerm.status): the
          identical POST /assessment-attempts body is rejected with
          ERR_TERM_NOT_ACTIVE while the student's only term is PENDING and accepted
          the moment that OTHER entity is activated, with nothing about the attempt
          payload changing. The dependency is on the term's state, not on any field
          of the attempt.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with competency IT-101 worth 4 units and a single-reader blueprint"
            - "ACTIVE student whose only SubscriptionTerm is still PENDING (created but never activated), window 2026-09-01 to 2026-12-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
