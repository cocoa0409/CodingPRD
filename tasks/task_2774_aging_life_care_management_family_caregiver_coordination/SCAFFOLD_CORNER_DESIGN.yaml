              captures: { coi2: $.data.coi_status, ack_by: $.data.coi_acknowledged_by_contact_id }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { err_retainer: $.data.error_id }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 49999, received_at: "2026-08-13T10:00:00Z" }
              as: BillingAdministrator
              captures: { bal1: $.data.retainer_balance_cents }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { err_retainer_2: $.data.error_id }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 1, received_at: "2026-08-13T10:05:00Z" }
              as: BillingAdministrator
              captures: { bal2: $.data.retainer_balance_cents }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { final_status: $.data.auth_status }
          assert:
            - "At creation: data.retainer_floor_cents == 50000 (default) and data.retainer_balance_cents == 0"
            - "The authorization is created with coi_status == \"PENDING_DISCLOSURE\" and a non-null disclosure_text; Client.${cli}.risk_posture == \"ELEVATED\" (pending disclosure)"
            - "First AUTHORIZED attempt: HTTP 422 with data.error_id == \"ERR_COI_NOT_ACKNOWLEDGED\" — priority 51 pre-empts the retainer floor even though the balance is 0"
            - "After DISCLOSE: coi_status == \"DISCLOSED\"; the second AUTHORIZED attempt is still HTTP 422 ERR_COI_NOT_ACKNOWLEDGED (DISCLOSED is not in {NOT_REQUIRED, ACKNOWLEDGED})"
            - "After ACKNOWLEDGE: coi_status == \"ACKNOWLEDGED\" and coi_acknowledged_by_contact_id == ${fc}"
            - "Third AUTHORIZED attempt: HTTP 402 with data.error_id == \"ERR_RETAINER_INSUFFICIENT\" — the COI gate is satisfied, so priority 75 now surfaces"
            - "With a 49999-cent balance the attempt is still HTTP 402 ERR_RETAINER_INSUFFICIENT (49999 < 50000)"
            - "At a 50000-cent balance the attempt returns HTTP 200 with data.auth_status == \"AUTHORIZED\" — the floor comparison is inclusive"
            - "After success: CarePlan.${cp}.coverage_gap_flag == false, Client.${cli}.authorized_coverage_hours == 4 and Client.${cli}.risk_posture == \"ROUTINE\""

      - name: invoice_period_overlap_is_decided_by_shared_service_dates
