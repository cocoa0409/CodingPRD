scaffold_corner_design:
  - section: entities
    instances:
      - name: protocol_create_returns_declared_defaults_and_system_fields
        claim_type: creation
        grounds: ["entities.Protocol", "endpoints.POST_/citizen-science/protocols"]
        distinguishing_aspect: "POST /citizen-science/protocols returns 201 with status DRAFT, version_number 1, activated_at null, version 1 and a server-minted UUID id carrying no type prefix."
        test_recipe:
          setup:
            - "Empty database; the logical clock is untouched and therefore reads 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "GET /citizen-science/protocols"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /citizen-science/protocols"
              payload: { code: "CORNER-1", title: "Corner Protocol", required_certification_level: "BASIC", min_photo_count: 2, max_submission_lag_hours: 48, required_equipment_type: "GPS_LOGGER", certification_valid_days: 90 }
              as: ProgramAdmin
              captures: { pc: $.data.id, pc_status: $.data.status, pc_vn: $.data.version_number, pc_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "${pc_status} == DRAFT"
            - "${pc_vn} == 1"
            - "${pc_v} == 1"
            - "Protocol.${pc}.supersedes_protocol_id == null"
            - "Protocol.${pc}.activated_at == null"
            - "Protocol.${pc}.min_photo_count == 2"
            - "${pc} matches the bare UUID form with no type prefix"

      - name: protocol_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds: ["entities.Protocol.fields.required_equipment_type", "entities.Protocol.fields.certification_valid_days", "entities.SurveySite.fields.priority_weight"]
        distinguishing_aspect: "Omitting required_equipment_type and certification_valid_days yields NONE and 365; omitting priority_weight on a site yields 1.0."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /citizen-science/protocols"
              payload: { code: "DEF-1", title: "Defaults Protocol", required_certification_level: "BASIC", min_photo_count: 0, max_submission_lag_hours: 24 }
              as: ProgramAdmin
              captures: { pd: $.data.id }
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Defaults Campaign", protocol_id: "${pd}", season_start_date: "2026-08-01", season_end_date: "2026-08-31", target_observations_per_site: 2 }
              as: ProgramAdmin
              captures: { camd: $.data.id }
          trigger:
            - call: "POST /citizen-science/campaigns/${camd}/sites"
              payload: { site_code: "S-DEF", latitude: 40.0, longitude: -75.0, habitat_type: "URBAN" }
              as: ProgramAdmin
              captures: { sd: $.data.id, sd_pw: $.data.priority_weight }
          assert:
            - "Protocol.${pd}.required_equipment_type == NONE"
            - "Protocol.${pd}.certification_valid_days == 365"
            - "${sd_pw} == 1.0"
            - "SurveySite.${sd}.coverage_ratio == 0.00"
            - "SurveySite.${sd}.coverage_status == GAP"
            - "Campaign.${camd}.site_count == 1"

      - name: volunteer_get_returns_stored_row_with_system_fields
        claim_type: retrieval
        grounds: ["entities.Volunteer", "endpoints.GET_/citizen-science/volunteers/{id}"]
        distinguishing_aspect: "GET /citizen-science/volunteers/{id} echoes the stored row and shows the seeded quality_score 0.5, lifetime_quality_score 0.5, recognition_tier BRONZE and lifetime_points 0."
        test_recipe:
          setup: ["A single Volunteer row exists"]
          setup_api_calls:
            - call: "POST /citizen-science/volunteers"
              payload: { full_name: "Rex Reader", email: "rex@example.org", home_region_code: "SW-02" }
              as: ProgramAdmin
              captures: { vr: $.data.id }
          trigger:
            - call: "GET /citizen-science/volunteers/${vr}"
              payload: {}
              as: ProgramAdmin
              captures: { vr_status: $.data.status, vr_qs: $.data.quality_score, vr_tier: $.data.recognition_tier }
          assert:
            - "HTTP status == 200"
            - "${vr_status} == PENDING"
            - "${vr_qs} == 0.5"
            - "${vr_tier} == BRONZE"
            - "Volunteer.${vr}.lifetime_points == 0"
            - "Volunteer.${vr}.version == 1"

      - name: campaign_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints.GET_/citizen-science/campaigns", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three non-overlapping campaigns on one protocol, GET /citizen-science/campaigns?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["Protocol PAGE-1 with three campaigns whose closed season windows do not intersect"]
          setup_api_calls:
            - call: "POST /citizen-science/protocols"
              payload: { code: "PAGE-1", title: "Pagination Protocol", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 48 }
              as: ProgramAdmin
              captures: { pp: $.data.id }
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Window A", protocol_id: "${pp}", season_start_date: "2026-08-01", season_end_date: "2026-08-10", target_observations_per_site: 2 }
              as: ProgramAdmin
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Window B", protocol_id: "${pp}", season_start_date: "2026-08-12", season_end_date: "2026-08-20", target_observations_per_site: 2 }
              as: ProgramAdmin
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Window C", protocol_id: "${pp}", season_start_date: "2026-08-22", season_end_date: "2026-08-31", target_observations_per_site: 2 }
              as: ProgramAdmin
          trigger:
            - call: "GET /citizen-science/campaigns"
              payload: { protocol_id: "${pp}", limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /citizen-science/campaigns"
              payload: { protocol_id: "${pp}", limit: 2, offset: 2 }
              as: ProgramAdmin
          assert:
            - "the first call returns exactly 2 data rows with meta pagination total_count == 3 and has_more == true"
            - "the second call returns exactly 1 data row with total_count == 3 and has_more == false"
            - "response_type == array on both calls"

      - name: observation_get_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_OBSERVATION_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /citizen-science/observations/{id} with a well-formed but unknown UUID returns 404 ERR_OBSERVATION_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "GET /citizen-science/observations"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          trigger:
            - call: "GET /citizen-science/observations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_OBSERVATION_NOT_FOUND"
            - "response_type == error"

      - name: protocol_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting min_photo_count, a required input with no default, returns 422 ERR_INVALID_REQUEST and creates no Protocol row."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "GET /citizen-science/protocols"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /citizen-science/protocols"
              payload: { code: "MISS-1", title: "Missing Field Protocol", required_certification_level: "BASIC", max_submission_lag_hours: 48 }
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "GET /citizen-science/protocols returns total_count 0"

      - name: expert_create_verification_weight_out_of_range_rejected
        claim_type: type_constraints
        grounds: ["entities.Expert.fields.verification_weight", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "verification_weight 5.00 exceeds the declared 0.50..4.00 range and is refused with 422 ERR_INVALID_REQUEST, while 4.00 exactly is accepted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "GET /citizen-science/experts"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Over Weighted", specialty_taxon: "AVES", verification_weight: 5.00 }
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Max Weighted", specialty_taxon: "AVES", verification_weight: 4.00 }
              as: ProgramAdmin
              captures: { emax: $.data.id, emax_w: $.data.verification_weight }
          assert:
            - "the first trigger call returns HTTP 422 with ${err_id} == ERR_INVALID_REQUEST"
            - "the second trigger call returns HTTP 201 and ${emax_w} == 4.00"
            - "Expert.${emax}.status == ACTIVE"
            - "Expert.${emax}.vote_count == 0"

      - name: observation_photo_count_is_computed_and_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Observation.fields.photo_count", "calculations.photo_evidence_screening"]
        distinguishing_aspect: "photo_count is derived from ACCEPTED PhotoEvidence children only: it reads 0 at creation and 1 after one accepted upload, and it is not an accepted request input."
        test_recipe:
          setup: ["Protocol BBS-2026 ACTIVE, Vera ACTIVE and CERTIFIED, Campaign OPEN with site S-HI"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /citizen-science/protocols"
              payload: { code: "BBS-2026", title: "Breeding Bird Survey 2026", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 96, required_equipment_type: "NONE", certification_valid_days: 365 }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /citizen-science/protocols/${p1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/volunteers"
              payload: { full_name: "Vera Finch", email: "vera@example.org", home_region_code: "NE-01" }
              as: ProgramAdmin
              captures: { v1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Tess Trainer", specialty_taxon: "AVES", verification_weight: 1.00 }
              as: ProgramAdmin
              captures: { et: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Ada Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Bo Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e2: $.data.id }
            - call: "POST /citizen-science/certifications"
              payload: { volunteer_id: "${v1}", protocol_id: "${p1}", trainer_expert_id: "${et}", level: "ADVANCED" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /citizen-science/certifications/${c1}/complete-training"
              payload: { exam_score: 88 }
              as: Expert
              as_user_id: "${et}"
            - call: "POST /citizen-science/certifications/${c1}/grant"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Autumn Count", protocol_id: "${p1}", season_start_date: "2026-08-01", season_end_date: "2026-10-31", target_observations_per_site: 3 }
              as: ProgramAdmin
              captures: { cam1: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/sites"
              payload: { site_code: "S-HI", latitude: 44.0, longitude: -70.0, habitat_type: "WETLAND", priority_weight: 1.5 }
              as: ProgramAdmin
              captures: { s_hi: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/observations"
              payload: { campaign_id: "${cam1}", site_id: "${s_hi}", volunteer_id: "${v1}", observed_at: "2026-08-05T06:00:00Z", latitude: 44.0, longitude: -70.0, species_code: "BAEA", count_value: 3 }
              as: Volunteer
              as_user_id: "${v1}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /citizen-science/observations/${o1}/photos"
              payload: { file_hash: "ph-corner", captured_at: "2026-08-05T06:05:00Z", exif_latitude: 44.0, exif_longitude: -70.0 }
              as: Volunteer
              as_user_id: "${v1}"
              captures: { phc: $.data.id, phc_status: $.data.status, phc_delta: $.data.geo_delta_meters }
          assert:
            - "immediately after creation Observation.${o1}.photo_count == 0"
            - "${phc_status} == ACCEPTED"
            - "${phc_delta} == 0.00"
            - "after the upload Observation.${o1}.photo_count == 1"
            - "Observation.${o1}.provisional_quality_points == 60.00"

      - name: volunteer_system_fields_are_server_generated
        claim_type: system_fields
        grounds: ["entities.Volunteer", "entities.Volunteer.fields.status"]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server; status is a system field that always starts PENDING even though the client never supplies it."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "GET /citizen-science/volunteers"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /citizen-science/volunteers"
              payload: { full_name: "Sys Fields", email: "sys@example.org", home_region_code: "NE-09" }
              as: ProgramAdmin
              captures: { vs: $.data.id, vs_created: $.data.created_at, vs_v: $.data.version, vs_status: $.data.status }
          assert:
            - "${vs_v} == 1"
            - "${vs_status} == PENDING"
            - "${vs_created} is an ISO 8601 UTC timestamp with exactly three fractional digits"
            - "Volunteer.${vs}.updated_at == ${vs_created}"

      - name: verification_vote_is_append_only_with_no_version_field
        claim_type: immutability
        grounds: ["entities.VerificationVote", "endpoints.GET_/citizen-science/observations/{id}/votes"]
        distinguishing_aspect: "VerificationVote is declared common_fields false: no update or delete endpoint exists for it and a second vote in the same round is a new row only after the duplicate check passes, so the audit trail is append-only."
        test_recipe:
          setup: ["Observation o1 is UNDER_REVIEW with one CONFIRM vote of confidence 5 from expert Ada"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /citizen-science/protocols"
              payload: { code: "BBS-2026", title: "Breeding Bird Survey 2026", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 96, required_equipment_type: "NONE", certification_valid_days: 365 }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /citizen-science/protocols/${p1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/volunteers"
              payload: { full_name: "Vera Finch", email: "vera@example.org", home_region_code: "NE-01" }
              as: ProgramAdmin
              captures: { v1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Tess Trainer", specialty_taxon: "AVES", verification_weight: 1.00 }
              as: ProgramAdmin
              captures: { et: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Ada Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Bo Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e2: $.data.id }
            - call: "POST /citizen-science/certifications"
              payload: { volunteer_id: "${v1}", protocol_id: "${p1}", trainer_expert_id: "${et}", level: "ADVANCED" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /citizen-science/certifications/${c1}/complete-training"
              payload: { exam_score: 88 }
              as: Expert
              as_user_id: "${et}"
            - call: "POST /citizen-science/certifications/${c1}/grant"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Autumn Count", protocol_id: "${p1}", season_start_date: "2026-08-01", season_end_date: "2026-10-31", target_observations_per_site: 3 }
              as: ProgramAdmin
              captures: { cam1: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/sites"
              payload: { site_code: "S-HI", latitude: 44.0, longitude: -70.0, habitat_type: "WETLAND", priority_weight: 1.5 }
              as: ProgramAdmin
              captures: { s_hi: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/observations"
              payload: { campaign_id: "${cam1}", site_id: "${s_hi}", volunteer_id: "${v1}", observed_at: "2026-08-05T06:00:00Z", latitude: 44.0, longitude: -70.0, species_code: "BAEA", count_value: 3 }
              as: Volunteer
              as_user_id: "${v1}"
              captures: { o1: $.data.id }
            - call: "POST /citizen-science/observations/${o1}/photos"
              payload: { file_hash: "ph-o1-a", captured_at: "2026-08-05T06:05:00Z", exif_latitude: 44.0, exif_longitude: -70.0 }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /citizen-science/observations/${o1}/start-review"
              payload: {}
              as: Expert
              as_user_id: "${e1}"
              captures: { o1_v1: $.data.version }
            - call: "POST /citizen-science/observations/${o1}/votes"
              payload: { decision: "CONFIRM", confidence: 5, expected_observation_version: "${o1_v1}" }
              as: Expert
              as_user_id: "${e1}"
          trigger:
            - call: "GET /citizen-science/observations/${o1}/votes"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the listing returns exactly 1 VerificationVote row"
            - "that row carries id, created_at, observation_id, expert_id, round_number 0, decision CONFIRM, confidence 5 and weight_applied 2.2000"
            - "no PUT, PATCH or DELETE endpoint is declared for VerificationVote in the API surface"

      - name: site_create_under_unknown_campaign_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", "errors[ERR_CAMPAIGN_NOT_FOUND]"]
        distinguishing_aspect: "A SurveySite may only be created under an existing Campaign; an unknown campaignId path segment returns 404 ERR_CAMPAIGN_NOT_FOUND before any body validation runs."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "GET /citizen-science/campaigns"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /citizen-science/campaigns/00000000-0000-4000-8000-0000000000aa/sites"
              payload: { site_code: "S-ORPHAN", latitude: 1.0, longitude: 2.0, habitat_type: "COASTAL" }
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_CAMPAIGN_NOT_FOUND"

      - name: protocol_self_referential_version_chain_is_reverse_reachable
        claim_type: graph_topology
        grounds: ["entities.Protocol.fields.supersedes_protocol_id", "entities.Protocol.fields.version_number", "endpoints.GET_/citizen-science/protocols"]
        distinguishing_aspect: "The self-referential Protocol chain resolves: the successor reports version_number 2 and GET /citizen-science/protocols?supersedes_protocol_id={first} returns exactly the successor row."
        test_recipe:
          setup: ["Protocol CHAIN-1 exists and is ACTIVE"]
          setup_api_calls:
            - call: "POST /citizen-science/protocols"
              payload: { code: "CHAIN-1", title: "Chain Protocol v1", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 48 }
              as: ProgramAdmin
              captures: { pv1: $.data.id }
            - call: "POST /citizen-science/protocols/${pv1}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /citizen-science/protocols"
              payload: { code: "CHAIN-2", title: "Chain Protocol v2", required_certification_level: "ADVANCED", min_photo_count: 2, max_submission_lag_hours: 48, supersedes_protocol_id: "${pv1}" }
              as: ProgramAdmin
              captures: { pv2: $.data.id, pv2_vn: $.data.version_number }
            - call: "GET /citizen-science/protocols"
              payload: { supersedes_protocol_id: "${pv1}", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "${pv2_vn} == 2"
            - "Protocol.${pv2}.supersedes_protocol_id == ${pv1}"
            - "Protocol.${pv2}.status == DRAFT"
            - "Protocol.${pv1}.status == ACTIVE"
            - "the filtered list returns exactly 1 row whose id == ${pv2}"

  - section: state_machines
    instances:
      - name: certification_initial_state_is_enrolled
        claim_type: initial_state
        grounds: ["state_machines.Certification.initial_state", "entities.Certification.fields.status"]
        distinguishing_aspect: "A freshly created Certification is ENROLLED with exam_score, granted_at and expires_at all null and suspended_reason NONE."
        test_recipe:
          setup: ["Protocol BBS-2026 ACTIVE, one Volunteer and one trainer Expert exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /citizen-science/protocols"
              payload: { code: "BBS-2026", title: "Breeding Bird Survey 2026", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 96, required_equipment_type: "NONE", certification_valid_days: 365 }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /citizen-science/protocols/${p1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/volunteers"
              payload: { full_name: "Vera Finch", email: "vera@example.org", home_region_code: "NE-01" }
              as: ProgramAdmin
              captures: { v1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Tess Trainer", specialty_taxon: "AVES", verification_weight: 1.00 }
              as: ProgramAdmin
              captures: { et: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Ada Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Bo Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /citizen-science/certifications"
              payload: { volunteer_id: "${v1}", protocol_id: "${p1}", trainer_expert_id: "${et}", level: "BASIC" }
              as: ProgramAdmin
              captures: { cc: $.data.id, cc_status: $.data.status }
          assert:
            - "HTTP status == 201"
            - "${cc_status} == ENROLLED"
            - "Certification.${cc}.exam_score == null"
            - "Certification.${cc}.granted_at == null"
            - "Certification.${cc}.expires_at == null"
