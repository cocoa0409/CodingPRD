            - "Outfall.${of1_id}: status == ACTIVE, screening_status == NOT_SCREENED, tmdl_status == NOT_ASSESSED"
            - "ConstructionSite.${site_a_id}: plan_status == SUBMITTED and field_status == PRE_CONSTRUCTION"
            - "PostConstructionFacility.${fac_a_id}.agreement_status == PENDING, because ownership is PRIVATE"
            - "AnnualReport.${rep_id}: status == DRAFT with every statistic at its zero default and invalidation_count == 0"

      - name: activation_requires_the_whole_measure_set_and_is_not_repeatable
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PermitTerm.DRAFT->ACTIVE
          - validations[priority=74]
          - errors.ERR_MEASURE_SET_INCOMPLETE
          - errors.ERR_PERMIT_TERM_NOT_ACTIVE
          - errors.ERR_MEASURE_RETIRED
        distinguishing_aspect: "Five of six measures is a 422 ERR_MEASURE_SET_INCOMPLETE; adding the sixth flips the same call to 200; a second activate is 409 ERR_PERMIT_TERM_NOT_ACTIVE; and once ACTIVE no measure may be retired, because the term must keep all six."
        test_recipe:
          setup:
            - "a DRAFT permit term carrying only five of the six minimum control measures"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
