              payload: { foreign_state_code: "CA", foreign_registered_agent_id: "00000000-0000-0000-0000-deadbeef0000" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "$.data.error_id == ERR_NOT_FOUND  # existence (P=30) beats state-dissolved (P=45)"

      - name: ppvc_safety_vs_fiscal_boi_invalid_with_franchise_arrears
        grounds:
          - validations[priority=50]
          - validations[priority=95]
        distinguishing_aspect: |
          Different error-category pair (business_safety vs business_fiscal),
          observed on a FQ approve attempt with a malformed BOI side-payload
          would be irrelevant — so this instance crafts the conflict on the
          BOI SUBMIT endpoint where both checks bite: a payload with
          ownership_pct sum != 100 (P=50, business_safety) on a BOIDisclosure
          whose BusinessEntity has uncured arrears (P=95, business_fiscal,
          only relevant on FQ approve in our scaffold). Since FQ-approve
          doesn't accept a BOI payload, we observe the pair on the FQ APPROVE
          endpoint applied to a fixture where (a) the entity has uncured
          arrears (would trigger ERR_FRANCHISE_TAX_IN_ARREARS, P=95) and
          (b) the FQ-approve doesn't carry beneficial_owners_json — so safety
          isn't relevant. Re-cast: the safety-vs-fiscal pair lives on
          BOI submit with BOTH a malformed beneficial_owners_json (sum=80,
          P=50) AND uncured arrears would not bind because BOI submit has
          no fiscal rule. The cleanest pair for the same endpoint is
          BOI submit: P=50 (safety, malformed owners) vs P=75 (constraint,
          past BOI deadline). Both bite, P=50 wins. This uses different
          categories from instance #1 (safety vs constraint, not state vs
          existence).
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE; BOIDisclosure in AMENDED with a payload that has ownership_pct sum=80."
            - "Clock advanced past the 90-day FORMATION deadline (formed_at=2026-01-01, clock=2026-05-01)."
