            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor O1", email: "do1@x.org", donor_type: "BUSINESS" }, as: ProcurementOfficer, captures: { dn1: "$.data.id" } }
