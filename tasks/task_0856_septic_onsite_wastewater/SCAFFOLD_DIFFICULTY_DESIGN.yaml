  - rule_id: transitive_cascade
    instances:
      - name: unsafe_water_sample_cascades_well_to_parcel_to_monitoring_to_pumping_compliance
        grounds:
          - calculations.water_sample_result
          - state_machines.Well.CLEAR_to_CONDEMNED
          - calculations.parcel_risk_tier
          - calculations.pumping_interval
          - calculations.pumping_compliance_status
          - entities.OperatingPermit.fields.monitoring_required
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /wells/{id}/water-samples: (1) the sample resolves
          UNSAFE, (2) BECAUSE it is UNSAFE the Well moves CLEAR -> CONDEMNED, (3) BECAUSE the
          well is condemned Parcel.water_quality_flag flips true and risk_tier becomes
          ELEVATED, (4) BECAUSE the parcel flag flipped the OperatingPermit sets
          monitoring_required true which halves pumping_interval_months 36 -> 18 and pulls
          next_pumping_due_on from 2029-05-01 back to 2027-11-01, and (5) BECAUSE the due date
          moved, compliance_status is re-derived COMPLIANT -> DUE_SOON. Each hop is caused by
          the previous hop, not by the original request.
