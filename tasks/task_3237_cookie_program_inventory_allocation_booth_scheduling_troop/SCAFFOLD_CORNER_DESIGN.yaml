      - name: incentive_tier_boundaries_inclusive
        claim_type: correct_result
        grounds:
          - calculations.participant_incentive_tier
        distinguishing_aspect: "Thresholds are inclusive: 19->NONE, 20->BRONZE, 50->SILVER, 100->GOLD. Pinned via two agreements at 19 and 20."
        test_recipe:
          setup: ["Season OPEN with TM; troop T1; two agreements assigned 19 and 20 packages"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2401", name: "S2401", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id }
