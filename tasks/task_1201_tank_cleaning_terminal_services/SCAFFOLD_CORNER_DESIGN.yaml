  - section: errors
    instances:
      - name: err_gas_free_limits_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_GAS_FREE_LIMITS_EXCEEDED]"
        excluded_because:
          difficulty_instance: lel_strict_boundary_at_10pct
          rationale: "Triggered at the strict LEL boundary in §1.8."
      - name: err_contractor_not_qualified_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CONTRACTOR_NOT_QUALIFIED]"
        excluded_because:
          difficulty_instance: contractor_score_rolling_vs_lifetime
          rationale: "Triggered by the LIFETIME-variant qualification failure in §1.8."
      - name: err_cert_expired_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CERT_EXPIRED]"
        excluded_because:
