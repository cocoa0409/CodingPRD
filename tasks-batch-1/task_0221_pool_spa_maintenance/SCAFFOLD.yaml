# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Pool
    initial_state: CLOSED
    terminal_states: []
    transitions:
      - from: CLOSED
        to: OPEN
        trigger: "POST /pools/{id}/seasonal-events with event_type=OPEN then POST /seasonal-events/{id}/apply"
        actor: RouteManager
        preconditions:
          - "Pool.service_status == CLOSED"
          - "Pool has no WorkOrder with severity == CRITICAL and status IN {OPEN, DIAGNOSED, AWAITING_APPROVAL, ON_HOLD} (cross-entity: WorkOrder)"
        side_effects:
          - "Pool.service_status -> OPEN"
          - "increments Pool.version by 1"
        note: "Opening is blocked while an unresolved CRITICAL work order exists."
      - from: WINTERIZED
        to: OPEN
        trigger: "POST /seasonal-events/{id}/apply (event_type=OPEN)"
        actor: RouteManager
        preconditions:
          - "Pool.service_status == WINTERIZED"
          - "Pool has no WorkOrder with severity == CRITICAL and status IN {OPEN, DIAGNOSED, AWAITING_APPROVAL, ON_HOLD} (cross-entity: WorkOrder)"
        side_effects:
          - "Pool.service_status -> OPEN"
          - "increments Pool.version by 1"
      - from: OPEN
        to: GREEN_RECOVERY
        trigger: "POST /visits/{id}/complete with green_pool=true"
        actor: FieldTechnician
        preconditions:
          - "Pool.service_status == OPEN"
        side_effects:
          - "Pool.service_status -> GREEN_RECOVERY"
          - "auto-creates a RECOVERY_SCHEDULED follow-up ServiceVisit on the same plan_id and route_id (cascade hop 1)"
          - "increments Pool.version by 1"
        note: "Green-pool detected at completion flips the pool into recovery; see green-pool cascade in §1.8."
      - from: GREEN_RECOVERY
        to: OPEN
        trigger: "POST /visits/{id}/complete with green_pool=false on the RECOVERY_SCHEDULED follow-up"
        actor: FieldTechnician
        preconditions:
          - "Pool.service_status == GREEN_RECOVERY"
          - "the completing visit has status == RECOVERY_SCHEDULED"
        side_effects:
          - "Pool.service_status -> OPEN"
          - "increments Pool.version by 1"
      - from: OPEN
        to: WINTERIZED
        trigger: "POST /seasonal-events/{id}/apply (event_type=CLOSE)"
        actor: RouteManager
        preconditions:
          - "Pool.service_status == OPEN"
          - "Pool has no ServiceVisit in status SCHEDULED or RECOVERY_SCHEDULED (cross-entity: ServiceVisit)"
        side_effects:
          - "Pool.service_status -> WINTERIZED"
          - "cancels nothing (precondition guarantees no open visits)"
          - "increments Pool.version by 1"

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SKIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "ServiceVisit.status == SCHEDULED"
          - "Pool.service_status IN {OPEN, GREEN_RECOVERY} (cross-entity: Pool)"
          - "RouteAssignment.status == DISPATCHED (cross-entity: RouteAssignment)"
        side_effects:
          - "ServiceVisit.status -> COMPLETED"
          - "computes ServiceVisit.billed_amount_cents via calc final_visit_bill"
          - "recomputes ServicePlan.visits_remaining"
          - "if green_pool=true: triggers Pool OPEN->GREEN_RECOVERY (cascade)"
          - "increments ServiceVisit.version by 1"
      - from: RECOVERY_SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "ServiceVisit.status == RECOVERY_SCHEDULED"
          - "Pool.service_status == GREEN_RECOVERY (cross-entity: Pool)"
          - "RouteAssignment.status == DISPATCHED (cross-entity: RouteAssignment)"
        side_effects:
          - "ServiceVisit.status -> COMPLETED"
          - "computes ServiceVisit.billed_amount_cents via calc final_visit_bill (RECOVERY surcharge applies)"
          - "if green_pool=false: triggers Pool GREEN_RECOVERY->OPEN (cascade)"
          - "increments ServiceVisit.version by 1"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /visits/{id}/skip"
        actor: RouteManager
        preconditions:
          - "ServiceVisit.status == SCHEDULED"
        side_effects:
          - "ServiceVisit.status -> SKIPPED"
          - "ServiceVisit.skip_reason set from request"
          - "if skip_reason == WEATHER: auto-creates a SCHEDULED makeup ServiceVisit on next available capacity slot of the same route_id and sets makeup_visit_id (cascade hop 1)"
          - "if skip_reason IN {HOLIDAY, CUSTOMER_REQUEST}: no makeup is created"
          - "no billing is generated (skips are never billed)"
          - "increments ServiceVisit.version by 1"
        note: "WEATHER skips are made up; HOLIDAY and CUSTOMER_REQUEST skips are not."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: RouteManager
        preconditions:
          - "ServiceVisit.status == SCHEDULED"
        side_effects:
          - "ServiceVisit.status -> CANCELLED"
          - "increments ServiceVisit.version by 1"
      - from: RECOVERY_SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: RouteManager
        preconditions:
          - "ServiceVisit.status == RECOVERY_SCHEDULED"
        side_effects:
          - "ServiceVisit.status -> CANCELLED"
          - "if no other RECOVERY_SCHEDULED visit remains on the pool, reverts Pool GREEN_RECOVERY->OPEN (cascade)"
          - "increments ServiceVisit.version by 1"

  - entity: RouteAssignment
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: RouteManager
        preconditions:
          - "RouteAssignment.status == PLANNED"
          - "RouteAssignment has at least one SCHEDULED ServiceVisit (cross-entity: ServiceVisit)"
        side_effects:
          - "RouteAssignment.status -> DISPATCHED"
          - "increments RouteAssignment.version by 1"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /routes/{id}/close"
        actor: RouteManager
        preconditions:
          - "RouteAssignment.status == DISPATCHED"
          - "RouteAssignment has no ServiceVisit in status SCHEDULED or RECOVERY_SCHEDULED (cross-entity: ServiceVisit)"
        side_effects:
          - "RouteAssignment.status -> CLOSED"
          - "increments RouteAssignment.version by 1"

  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DIAGNOSED
        trigger: "POST /work-orders/{id}/diagnose"
        actor: FieldTechnician
        preconditions:
          - "WorkOrder.status == OPEN"
        side_effects:
          - "WorkOrder.status -> DIAGNOSED"
          - "WorkOrder.quoted_parts_cents and labor_minutes set from request"
          - "recomputes Pool.open_work_order_count"
          - "increments WorkOrder.version by 1"
      - from: DIAGNOSED
        to: AWAITING_APPROVAL
        trigger: "POST /work-orders/{id}/submit-for-approval"
        actor: FieldTechnician
        preconditions:
          - "WorkOrder.status == DIAGNOSED"
        side_effects:
          - "WorkOrder.status -> AWAITING_APPROVAL"
          - "increments WorkOrder.version by 1"
      - from: AWAITING_APPROVAL
        to: ON_HOLD
        trigger: "POST /work-orders/{id}/hold"
        actor: Customer
        preconditions:
          - "WorkOrder.status == AWAITING_APPROVAL"
          - "acting Customer owns the Pool (Pool.customer_id == X-User-ID)"
        side_effects:
          - "WorkOrder.status -> ON_HOLD"
          - "increments WorkOrder.version by 1"
        note: "Customer declines the quote; order parks ON_HOLD and may be re-diagnosed."
      - from: ON_HOLD
        to: DIAGNOSED
        trigger: "POST /work-orders/{id}/re-diagnose"
        actor: FieldTechnician
        preconditions:
          - "WorkOrder.status == ON_HOLD"
        side_effects:
          - "WorkOrder.status -> DIAGNOSED"
          - "WorkOrder.quoted_parts_cents and labor_minutes re-set from request"
          - "increments WorkOrder.version by 1"
        note: "Revert loop: ON_HOLD -> DIAGNOSED makes the state machine cyclic."
      - from: AWAITING_APPROVAL
        to: RESOLVED
        trigger: "POST /work-orders/{id}/resolve"
        actor: Customer
        preconditions:
          - "WorkOrder.status == AWAITING_APPROVAL"
          - "acting Customer owns the Pool (Pool.customer_id == X-User-ID)"
        side_effects:
          - "WorkOrder.status -> RESOLVED"
          - "computes WorkOrder.repair_total_cents via calc repair_total"
          - "recomputes Pool.open_work_order_count (cascade hop 1)"
          - "if Pool.open_work_order_count drops to 0 and Pool.service_status == GREEN_RECOVERY-blocked nothing; no auto-open"
          - "increments WorkOrder.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: RouteManager
        preconditions:
          - "WorkOrder.status == OPEN"
        side_effects:
          - "WorkOrder.status -> CANCELLED"
          - "recomputes Pool.open_work_order_count"
          - "increments WorkOrder.version by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: RouteManager
        preconditions:
          - "WorkOrder.status == ON_HOLD"
        side_effects:
          - "WorkOrder.status -> CANCELLED"
          - "recomputes Pool.open_work_order_count"
          - "increments WorkOrder.version by 1"

  - entity: SeasonalEvent
    initial_state: REQUESTED
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: REQUESTED
        to: APPLIED
        trigger: "POST /seasonal-events/{id}/apply"
        actor: RouteManager
        preconditions:
          - "SeasonalEvent.status == REQUESTED"
          - "the corresponding Pool transition's preconditions hold (see Pool state machine)"
        side_effects:
          - "SeasonalEvent.status -> APPLIED"
          - "drives the Pool open/close transition (cascade)"
          - "increments SeasonalEvent.version by 1"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /seasonal-events/{id}/void"
        actor: RouteManager
        preconditions:
          - "SeasonalEvent.status == REQUESTED"
        side_effects:
          - "SeasonalEvent.status -> VOIDED"
          - "increments SeasonalEvent.version by 1"

  - entity: ServicePlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-plans/{id}/activate"
        actor: AccountManager
        preconditions:
          - "ServicePlan.status == DRAFT"
          - "Customer.account_status == ACTIVE (cross-entity: Customer)"
        side_effects:
          - "ServicePlan.status -> ACTIVE"
          - "increments ServicePlan.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system on visit completion when ONE_TIME plan's only visit completes, or RECURRING plan reaches visits_remaining==0"
        actor: system
        preconditions:
          - "ServicePlan.status == ACTIVE"
          - "ServicePlan.visits_remaining == 0"
        side_effects:
          - "ServicePlan.status -> COMPLETED"
          - "increments ServicePlan.version by 1"
        note: "Bubble-up: visit completion drives plan completion."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /service-plans/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "ServicePlan.status == ACTIVE"
        side_effects:
          - "ServicePlan.status -> CANCELLED"
          - "cancels all SCHEDULED and RECOVERY_SCHEDULED ServiceVisits on this plan (cascade)"
          - "increments ServicePlan.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: AccountManager
        preconditions:
          - "Invoice.status == DRAFT"
          - "if visit_id set: the referenced ServiceVisit.status == COMPLETED (cross-entity: ServiceVisit)"
          - "if work_order_id set: the referenced WorkOrder.status == RESOLVED (cross-entity: WorkOrder)"
        side_effects:
          - "Invoice.status -> ISSUED"
          - "computes Invoice.amount_cents via calc invoice_total"
          - "recomputes Pool.balance_due_cents (cascade hop 1)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: AccountManager
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "Invoice.status -> PAID"
          - "recomputes Pool.balance_due_cents (cascade hop 1)"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: AccountManager
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects:
          - "Invoice.status -> VOIDED"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: AccountManager
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "Invoice.status -> VOIDED"
          - "recomputes Pool.balance_due_cents (cascade hop 1)"
          - "increments Invoice.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: visit-log-stale-pool
    parent_entity: Pool
    write_endpoint: "POST /pools/{id}/visit-logs"
    occ_field: "expected_pool_version"
    description: |
      Logging a same-day field visit-record against a Pool whose version has
      advanced since the client last observed it is rejected. A field visit-log
      supersedes the prior provisional log for the day per the product spec; the
      loser carries a stale expected_pool_version because another writer already
      posted a log (which legitimately supersedes the prior) and the current
      writer's view of the pool is therefore out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: dosing_recommendation
    trigger: "on POST /visits/{id}/readings (ChemicalReading creation)"
    algorithm: threshold
    formula: |
      # Subject: ChemicalReading on a ServiceVisit's Pool.
      # Step 1 — select target band by water_type:
      target_fc = FC_TARGET[Pool.water_type]          # free-chlorine target ppm
      target_ta = 100                                  # total alkalinity target ppm (all types)
      # Step 2 — chlorine deficit dose (only when below target; never negative):
      fc_deficit = max(0, target_fc - free_chlorine_ppm)
      vol_factor = volume_gallons / 10000.0
      chlorine_grams = fc_deficit * DOSE_PER_PPM_PER_10K[Pool.water_type] * vol_factor
      # Step 3 — alkalinity dose (only when below target):
      ta_deficit = max(0, target_ta - total_alkalinity_ppm)
      alk_grams = ta_deficit * ALK_DOSE_PER_PPM_PER_10K * vol_factor
      # Step 4 — pH penalty multiplier: if ph > 7.8, chlorine is less effective,
      # multiply chlorine_grams (NOT alk_grams) by PH_PENALTY:
      if ph > 7.8:
          chlorine_grams = chlorine_grams * PH_PENALTY
      # Step 5 — sum then round ONCE at the end (sum-then-round, not round-each):
      recommended_dose_grams = round(chlorine_grams + alk_grams, 1)   # 1 decimal, round_half_up
    input_set: "single ChemicalReading; constants keyed off the parent Pool.water_type"
    constants:
      FC_TARGET: { CHLORINE: 3.0, SALTWATER: 3.0, BROMINE_SPA: 4.0 }
      DOSE_PER_PPM_PER_10K: { CHLORINE: 14.0, SALTWATER: 20.0, BROMINE_SPA: 11.0 }
      ALK_DOSE_PER_PPM_PER_10K: 1.5
      PH_PENALTY: 1.25
    precision: "1 decimal place, round_half_up, sum-then-round (round once after summing both dose components)"
    variants:
      - name: provisional_route_estimate
        when: "estimated at route-plan time before any reading exists; uses the pool's last completed reading or band midpoints"
        difference: "uses last-known readings; recomputed to final on the actual ChemicalReading at visit time"

  - name: final_visit_bill
    trigger: "on POST /visits/{id}/complete (ServiceVisit SCHEDULED->COMPLETED or RECOVERY_SCHEDULED->COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      # Subject: ServiceVisit billing. Inputs: plan per_visit_rate_cents, visit status path,
      # skip surcharges, recovery surcharge, prepaid coverage. ≥3 inputs, branch on visit state.
      base = ServicePlan.per_visit_rate_cents
      # Recovery visits carry a flat surcharge:
      recovery_add = RECOVERY_SURCHARGE_CENTS if (this visit was RECOVERY_SCHEDULED) else 0
      # Green-pool initial visit (the OPEN->GREEN_RECOVERY trigger) carries a chemical surcharge
      # proportional to volume, tiered by volume bracket:
      if green_pool == true and this visit was SCHEDULED:
          if volume_gallons <= 15000:    green_add = GREEN_TIER1_CENTS
          elif volume_gallons <= 30000:  green_add = GREEN_TIER2_CENTS
          else:                          green_add = GREEN_TIER3_CENTS
      else:
          green_add = 0
      gross = base + recovery_add + green_add
      # Prepaid coverage: if the plan has visits_remaining > 0 BEFORE this completion
      # (RECURRING prepaid), the base portion is covered (billed_amount excludes base),
      # but surcharges are ALWAYS billed:
      if ServicePlan.plan_type == RECURRING and visits_remaining_before > 0:
          billed_amount_cents = recovery_add + green_add
      else:
          billed_amount_cents = gross
    input_set: "the completing ServiceVisit, its ServicePlan, the green_pool flag, and visits_remaining BEFORE this completion"
    constants:
      RECOVERY_SURCHARGE_CENTS: 4500
      GREEN_TIER1_CENTS: 12000
      GREEN_TIER2_CENTS: 18000
      GREEN_TIER3_CENTS: 26000
    precision: "integer cents, no rounding (all inputs are integer cents)"
    variants:
      - name: provisional_plan_quote
        when: "shown at plan activation as the expected per-visit charge"
        difference: "uses base only (no surcharges, assumes no green pool / no recovery); diverges from final whenever a surcharge fires"

  - name: repair_total
    trigger: "on POST /work-orders/{id}/resolve (WorkOrder AWAITING_APPROVAL->RESOLVED)"
    algorithm: aggregation
    formula: |
      # Subject: WorkOrder repair charge. Evaluation order is pinned: compute labor first,
      # then a severity multiplier on labor only, then add parts, then a single tax round.
      labor_cost = ceil(labor_minutes / 60.0) * LABOR_RATE_PER_HOUR_CENTS   # whole-hour billing, ceil
      sev_mult = SEVERITY_MULT[severity]                                    # MINOR 1.0, MAJOR 1.15, CRITICAL 1.35
      labor_adj = labor_cost * sev_mult                                     # multiplier on labor ONLY
      pre_tax = labor_adj + quoted_parts_cents                             # parts not multiplied, not taxed-separately
      repair_total_cents = round(pre_tax * (1 + TAX_RATE))                 # round once at the very end, round_half_up
    input_set: "single WorkOrder at resolution"
    constants:
      LABOR_RATE_PER_HOUR_CENTS: 9000
      SEVERITY_MULT: { MINOR: 1.0, MAJOR: 1.15, CRITICAL: 1.35 }
      TAX_RATE: 0.07
    precision: "integer cents; round once at the end (pre_tax computed exactly, then a single round_half_up on the taxed total)"

  - name: invoice_total
    trigger: "on POST /invoices/{id}/issue (Invoice DRAFT->ISSUED)"
    algorithm: aggregation
    formula: |
      # Subject: Invoice. Pins evaluation order over referenced entities.
      visit_part = ServiceVisit.billed_amount_cents if visit_id set else 0
      repair_part = WorkOrder.repair_total_cents if work_order_id set else 0
      amount_cents = visit_part + repair_part
    input_set: "single Invoice; reads billed_amount_cents and/or repair_total_cents from referenced entities"
    constants: {}
    precision: "integer cents, no rounding"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "all path/body referenced resources exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "ownership: a Customer acting on a WorkOrder must own the referenced Pool (Pool.customer_id == X-User-ID)"
    error_id: ERR_NOT_POOL_OWNER
    http_status: 403
    applies_to: "POST /work-orders/{id}/hold, POST /work-orders/{id}/resolve"
  - priority: 5
    category: state
    check: "target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_constraint
    check: "ONE_TIME plan MUST have frequency == NONE; RECURRING plan MUST have frequency != NONE"
    error_id: ERR_FREQUENCY_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /service-plans"
  - priority: 7
    category: business_constraint
    check: "slot_end_minute > slot_start_minute on visits; window_end_minute > window_start_minute on routes"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /visits, POST /routes"
  - priority: 8
    category: business_temporal
    check: "a new ServiceVisit slot [slot_start_minute, slot_end_minute) must lie within the route window [window_start_minute, window_end_minute) and MUST NOT overlap any existing non-terminal visit's half-open slot on the same route (adjacency at the boundary is allowed)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /visits"
  - priority: 9
    category: business_safety
    check: "a Pool may not transition CLOSED/WINTERIZED -> OPEN while it has a CRITICAL WorkOrder in {OPEN, DIAGNOSED, AWAITING_APPROVAL, ON_HOLD}"
    error_id: ERR_CRITICAL_REPAIR_BLOCKS_OPEN
    http_status: 409
    applies_to: "POST /seasonal-events/{id}/apply"
  - priority: 10
    category: business_temporal
    check: "a Pool may not transition OPEN -> WINTERIZED while it has any ServiceVisit in {SCHEDULED, RECOVERY_SCHEDULED}"
    error_id: ERR_OPEN_VISITS_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /seasonal-events/{id}/apply"
  - priority: 11
    category: business_constraint
    check: "a route may only be dispatched if it holds at least one SCHEDULED visit"
    error_id: ERR_EMPTY_ROUTE
    http_status: 409
    applies_to: "POST /routes/{id}/dispatch"
  - priority: 12
    category: business_constraint
    check: "a route at capacity (count of non-terminal visits == capacity_visits) rejects a new visit"
    error_id: ERR_ROUTE_AT_CAPACITY
    http_status: 409
    applies_to: "POST /visits"
  - priority: 13
    category: business_constraint
    check: "skip_reason must be provided and != NONE when skipping a visit"
    error_id: ERR_SKIP_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /visits/{id}/skip"
  - priority: 14
    category: business_fiscal
    check: "an invoice cannot be issued for a visit/work-order that produced a zero charge (amount_cents would be 0)"
    error_id: ERR_NOTHING_TO_BILL
    http_status: 422
    applies_to: "POST /invoices/{id}/issue"
  - priority: 15
    category: business_constraint
    check: "an Invoice must reference exactly one of visit_id or work_order_id (not both, not neither)"
    error_id: ERR_INVOICE_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /invoices"
  - priority: 16
    category: business_constraint
    check: "OCC: expected_pool_version must equal current Pool.version on visit-log supersede"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pools/{id}/visit-logs"
  - priority: 17
    category: business_constraint
    check: "request body validates against the endpoint input schema (types, enum membership, required fields, numeric ranges)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer account."
    roles: [AccountManager]
    code: 201
    input: ["full_name", "email", "billing_terms?"]
    output: Customer
    side_effects: ["Customer created with account_status=ACTIVE"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer."
    roles: [AccountManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a customer account (blocks plan activation)."
    roles: [AccountManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.account_status -> SUSPENDED", "increments Customer.version by 1"]

  # ---- Pool ----
  - method: POST
    path: "/pools"
    description: "Register a pool for a customer."
    roles: [AccountManager]
    code: 201
    input: [customer_id, label, water_type, volume_gallons]
    output: Pool
    side_effects: ["Pool created with service_status=CLOSED"]
  - method: GET
    path: "/pools/{id}"
    description: "Fetch a pool with computed open_work_order_count and balance_due_cents."
    roles: [AccountManager, RouteManager, FieldTechnician, Customer]
    code: 200
    input: []
    output: Pool
    side_effects: []
  - method: GET
    path: "/pools"
    description: "List pools, optionally filtered by customer_id."
    roles: [AccountManager, RouteManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Pool[]
    side_effects: []
  - method: POST
    path: "/pools/{id}/visit-logs"
    description: "Log a same-day field visit record that supersedes the prior provisional log; OCC-guarded on Pool.version."
    roles: [FieldTechnician]
    code: 201
    input: [expected_pool_version, note]
    output: Pool
    side_effects: ["records the field log", "increments Pool.version by 1"]

  # ---- ServicePlan ----
  - method: POST
    path: "/service-plans"
    description: "Create a service plan for a pool."
    roles: [AccountManager]
    code: 201
    input: ["pool_id", "plan_type", "frequency?", "per_visit_rate_cents", "prepaid_visit_count?"]
    output: ServicePlan
    side_effects: ["ServicePlan created with status=DRAFT, visits_remaining seeded"]
  - method: GET
    path: "/service-plans/{id}"
    description: "Fetch a plan with computed visits_remaining."
    roles: [AccountManager, RouteManager, Customer]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/service-plans"
    description: "List service plans, optionally filtered by pool_id."
    roles: [AccountManager, RouteManager]
    code: 200
    input: ["pool_id?", "limit?", "offset?"]
    output: ServicePlan[]
    side_effects: []
  - method: POST
    path: "/service-plans/{id}/activate"
    description: "Activate a draft plan."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["ServicePlan.status -> ACTIVE", "increments ServicePlan.version by 1"]
  - method: POST
    path: "/service-plans/{id}/cancel"
    description: "Cancel an active plan; cascades to its open visits."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["ServicePlan.status -> CANCELLED", "cancels SCHEDULED/RECOVERY_SCHEDULED visits", "increments ServicePlan.version by 1"]

  # ---- RouteAssignment ----
  - method: POST
    path: "/routes"
    description: "Create a route assignment for a technician on a date."
    roles: [RouteManager]
    code: 201
    input: [technician_id, service_date, window_start_minute, window_end_minute, capacity_visits]
    output: RouteAssignment
    side_effects: ["RouteAssignment created with status=PLANNED"]
  - method: GET
    path: "/routes/{id}"
    description: "Fetch a route."
    roles: [RouteManager, FieldTechnician]
    code: 200
    input: []
    output: RouteAssignment
    side_effects: []
  - method: GET
    path: "/routes"
    description: "List routes, optionally filtered by technician_id."
    roles: [RouteManager, FieldTechnician]
    code: 200
    input: ["technician_id?", "limit?", "offset?"]
    output: RouteAssignment[]
    side_effects: []
  - method: GET
    path: "/routes/{id}/visits"
    description: "List the visits on a route (reverse-reachability for ServiceVisit.route_id)."
    roles: [RouteManager, FieldTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/routes/{id}/dispatch"
    description: "Dispatch a planned route."
    roles: [RouteManager]
    code: 200
    input: []
    output: RouteAssignment
    side_effects: ["RouteAssignment.status -> DISPATCHED", "increments RouteAssignment.version by 1"]
  - method: POST
    path: "/routes/{id}/close"
    description: "Close a dispatched route with no open visits."
    roles: [RouteManager]
    code: 200
    input: []
    output: RouteAssignment
    side_effects: ["RouteAssignment.status -> CLOSED", "increments RouteAssignment.version by 1"]

  # ---- ServiceVisit ----
  - method: POST
    path: "/visits"
    description: "Schedule a visit slot on a route for a pool under a plan."
    roles: [RouteManager]
    code: 201
    input: [pool_id, plan_id, route_id, slot_start_minute, slot_end_minute]
    output: ServiceVisit
    side_effects: ["ServiceVisit created with status=SCHEDULED"]
  - method: GET
    path: "/visits/{id}"
    description: "Fetch a visit with computed billed_amount_cents."
    roles: [AccountManager, RouteManager, FieldTechnician, Customer]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/visits"
    description: "List visits, optionally filtered by pool_id or plan_id."
    roles: [AccountManager, RouteManager, FieldTechnician]
    code: 200
    input: ["pool_id?", "plan_id?", "route_id?", "makeup_visit_id?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/complete"
    description: "Complete a visit; computes billing, may flip pool into/out of GREEN_RECOVERY."
    roles: [FieldTechnician]
    code: 200
    input: [green_pool]
    output: ServiceVisit
    side_effects: ["ServiceVisit.status -> COMPLETED", "computes billed_amount_cents", "recomputes ServicePlan.visits_remaining", "may cascade Pool service_status", "increments ServiceVisit.version by 1"]
  - method: POST
    path: "/visits/{id}/skip"
    description: "Skip a visit; WEATHER skips auto-create a makeup."
    roles: [RouteManager]
    code: 200
    input: [skip_reason]
    output: ServiceVisit
    side_effects: ["ServiceVisit.status -> SKIPPED", "may auto-create makeup visit (WEATHER)", "increments ServiceVisit.version by 1"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "Cancel a scheduled or recovery visit."
    roles: [RouteManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["ServiceVisit.status -> CANCELLED", "may revert Pool GREEN_RECOVERY->OPEN", "increments ServiceVisit.version by 1"]
  - method: POST
    path: "/visits/{id}/readings"
    description: "Record a chemical reading during a visit; computes recommended_dose_grams."
    roles: [FieldTechnician]
    code: 201
    input: [free_chlorine_ppm, ph, total_alkalinity_ppm]
    output: ChemicalReading
    side_effects: ["ChemicalReading created", "computes recommended_dose_grams"]
  - method: GET
    path: "/visits/{id}/readings"
    description: "List readings for a visit (reverse-reachability for ChemicalReading.visit_id)."
    roles: [AccountManager, RouteManager, FieldTechnician, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ChemicalReading[]
    side_effects: []

  # ---- WorkOrder ----
  - method: POST
    path: "/work-orders"
    description: "Raise an equipment-repair work order for a pool."
    roles: [FieldTechnician, RouteManager]
    code: 201
    input: ["pool_id", "component", "severity", "raised_by_visit_id?"]
    output: WorkOrder
    side_effects: ["WorkOrder created with status=OPEN", "recomputes Pool.open_work_order_count"]
  - method: GET
    path: "/work-orders/{id}"
    description: "Fetch a work order with computed repair_total_cents."
    roles: [AccountManager, RouteManager, FieldTechnician, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "List work orders, optionally filtered by pool_id."
    roles: [AccountManager, RouteManager, FieldTechnician, Customer]
    code: 200
    input: ["pool_id?", "raised_by_visit_id?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/diagnose"
    description: "Diagnose an open work order; set quote."
    roles: [FieldTechnician]
    code: 200
    input: [quoted_parts_cents, labor_minutes]
    output: WorkOrder
    side_effects: ["WorkOrder.status -> DIAGNOSED", "recomputes Pool.open_work_order_count", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/submit-for-approval"
    description: "Submit a diagnosed order to the customer for approval."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status -> AWAITING_APPROVAL", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/hold"
    description: "Customer declines the quote; park the order ON_HOLD."
    roles: [Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status -> ON_HOLD", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/re-diagnose"
    description: "Re-diagnose a held order with a revised quote (cyclic revert)."
    roles: [FieldTechnician]
    code: 200
    input: [quoted_parts_cents, labor_minutes]
    output: WorkOrder
    side_effects: ["WorkOrder.status -> DIAGNOSED", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/resolve"
    description: "Customer approves; complete the repair and compute repair_total_cents."
    roles: [Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status -> RESOLVED", "computes repair_total_cents", "recomputes Pool.open_work_order_count", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel an open or held work order."
    roles: [RouteManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status -> CANCELLED", "recomputes Pool.open_work_order_count", "increments WorkOrder.version by 1"]

  # ---- SeasonalEvent ----
  - method: POST
    path: "/pools/{id}/seasonal-events"
    description: "Request a seasonal open/close for a pool."
    roles: [RouteManager]
    code: 201
    input: [event_type, effective_date]
    output: SeasonalEvent
    side_effects: ["SeasonalEvent created with status=REQUESTED"]
  - method: GET
    path: "/seasonal-events/{id}"
    description: "Fetch a seasonal event."
    roles: [RouteManager, AccountManager]
    code: 200
    input: []
    output: SeasonalEvent
    side_effects: []
  - method: GET
    path: "/pools/{id}/seasonal-events"
    description: "List seasonal events for a pool (reverse-reachability for SeasonalEvent.pool_id)."
    roles: [RouteManager, AccountManager]
    code: 200
    input: ["limit?", "offset?"]
    output: SeasonalEvent[]
    side_effects: []
  - method: POST
    path: "/seasonal-events/{id}/apply"
    description: "Apply a requested seasonal event; drives the Pool open/close transition."
    roles: [RouteManager]
    code: 200
    input: []
    output: SeasonalEvent
    side_effects: ["SeasonalEvent.status -> APPLIED", "drives Pool service_status transition", "increments SeasonalEvent.version and Pool.version by 1"]
  - method: POST
    path: "/seasonal-events/{id}/void"
    description: "Void a requested seasonal event."
    roles: [RouteManager]
    code: 200
    input: []
    output: SeasonalEvent
    side_effects: ["SeasonalEvent.status -> VOIDED", "increments SeasonalEvent.version by 1"]

  # ---- Invoice ----
  - method: POST
    path: "/invoices"
    description: "Create a draft invoice referencing a completed visit or resolved work order."
    roles: [AccountManager]
    code: 201
    input: ["pool_id", "visit_id?", "work_order_id?"]
    output: Invoice
    side_effects: ["Invoice created with status=DRAFT"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice with computed amount_cents."
    roles: [AccountManager, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices, optionally filtered by pool_id, visit_id, or work_order_id."
    roles: [AccountManager, Customer]
    code: 200
    input: ["pool_id?", "visit_id?", "work_order_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a draft invoice; computes amount_cents and accrues pool balance."
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice.status -> ISSUED", "computes amount_cents", "recomputes Pool.balance_due_cents", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an issued invoice paid; reduces pool balance."
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice.status -> PAID", "recomputes Pool.balance_due_cents", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a draft or issued invoice."
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice.status -> VOIDED", "recomputes Pool.balance_due_cents", "increments Invoice.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_NOT_POOL_OWNER
    http: 403
    condition: "acting Customer does not own the pool referenced by the work order"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state from which this transition is defined"
  - id: ERR_FREQUENCY_PLAN_MISMATCH
    http: 422
    condition: "ONE_TIME plan has frequency != NONE, or RECURRING plan has frequency == NONE"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "end minute <= start minute on a visit slot or route window"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "visit slot falls outside the route window or overlaps an existing non-terminal visit slot on the same route"
  - id: ERR_CRITICAL_REPAIR_BLOCKS_OPEN
    http: 409
    condition: "pool open attempted while an unresolved CRITICAL work order exists"
  - id: ERR_OPEN_VISITS_BLOCK_CLOSE
    http: 409
    condition: "pool winterize attempted while SCHEDULED or RECOVERY_SCHEDULED visits remain"
  - id: ERR_EMPTY_ROUTE
    http: 409
    condition: "dispatch attempted on a route with no SCHEDULED visit"
  - id: ERR_ROUTE_AT_CAPACITY
    http: 409
    condition: "new visit would exceed the route's capacity_visits"
  - id: ERR_SKIP_REASON_REQUIRED
    http: 422
    condition: "skip requested without a skip_reason or with skip_reason == NONE"
  - id: ERR_NOTHING_TO_BILL
    http: 422
    condition: "invoice issue would produce amount_cents == 0"
  - id: ERR_INVOICE_REFERENCE_MISMATCH
    http: 422
    condition: "invoice references both or neither of visit_id and work_order_id"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_pool_version does not match current Pool.version on visit-log supersede"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "request body fails input-schema validation (missing field, bad type, bad enum, out-of-range number)"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: AccountManager
    description: "Manages customers, pools, service plans, and billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /customers/{id}/suspend"
      - "POST /pools"
      - "POST /service-plans"
      - "POST /service-plans/{id}/activate"
      - "POST /service-plans/{id}/cancel"
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/pay"
      - "POST /invoices/{id}/void"
    shared_operations:
      - "GET reads on customers, pools, plans, visits, work-orders, invoices, seasonal-events"
  - name: RouteManager
    description: "Plans routes, schedules/skips/cancels visits, manages seasonal events, cancels work orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/dispatch"
      - "POST /routes/{id}/close"
      - "POST /visits"
      - "POST /visits/{id}/skip"
      - "POST /visits/{id}/cancel"
      - "POST /pools/{id}/seasonal-events"
      - "POST /seasonal-events/{id}/apply"
      - "POST /seasonal-events/{id}/void"
      - "POST /work-orders/{id}/cancel"
    shared_operations:
      - "POST /work-orders (shared with FieldTechnician)"
      - "GET reads on pools, plans, routes, visits, work-orders, seasonal-events"
  - name: FieldTechnician
    description: "Executes visits, records readings, logs field visits, diagnoses repairs."
    identity: "opaque"
    exclusive_operations:
      - "POST /pools/{id}/visit-logs"
      - "POST /visits/{id}/complete"
      - "POST /visits/{id}/readings"
      - "POST /work-orders/{id}/diagnose"
      - "POST /work-orders/{id}/submit-for-approval"
      - "POST /work-orders/{id}/re-diagnose"
    shared_operations:
      - "POST /work-orders (shared with RouteManager)"
      - "GET reads on pools, routes, visits, work-orders"
  - name: Customer
    description: "Pool owner; reads own resources and approves or holds repair quotes."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /work-orders/{id}/hold"
      - "POST /work-orders/{id}/resolve"
    shared_operations:
      - "GET reads on own customer, pools, plans, visits, work-orders, invoices"
