  - rule_id: non_linear_state_machine
    instances:
      - name: petition_continuance_cycle_returns_to_hearing_scheduled
        grounds:
          - state_machines.HoldPetition.HEARING_SCHEDULED_to_CONTINUED
          - state_machines.HoldPetition.CONTINUED_to_HEARING_SCHEDULED
          - entities.HoldPetition.fields.continuance_count
          - validations[priority=43]
          - errors[ERR_CONTINUANCE_LIMIT_REACHED]
        distinguishing_aspect: |
          HoldPetition re-enters HEARING_SCHEDULED after CONTINUED, so the same state is occupied
          three times on one row; the cycle is bounded by continuance_count < 2, so the third
          CONTINUED outcome is refused with ERR_CONTINUANCE_LIMIT_REACHED while the hearing stays
          SCHEDULED and the petition stays HEARING_SCHEDULED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T08:00:00Z (Thursday); evaluation signed at that instant, so release_deadline_at is 2026-09-06T08:00:00.000Z and petition_filing_deadline_at is 2026-09-08T09:00:00.000Z."
            - "Hold certified by a second psychiatrist, so status is ACTIVE and Patient.active_hold_count is 1."
            - "Extension petition FILED, and one hearing scheduled for 2026-09-04T09:00:00Z (Friday, inside the 09:00-16:00 court window and before release_deadline_at)."
            - "A RIGHTS_ADVOCATE clinician exists to carry the representation assignment."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Alma Reyes", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-1" }
              as: ComplianceOfficer
              captures: { c_psa: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Bo Fenn", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-2" }
              as: ComplianceOfficer
              captures: { c_psb: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Vera Cho", staff_role: "RIGHTS_ADVOCATE", license_number: "LIC-ADV-2367-1" }
              as: ComplianceOfficer
              captures: { c_adv: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-CY", legal_name: "Cycle Case", age_years: 47, gender_care_category: "NONBINARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_cy: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_cy}", danger_to_self: true, danger_to_others: false, grave_disability: false, capacity_present: false, clinical_summary: "Persistent suicidal intent, capacity absent." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_cy: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_cy}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_cy}", evaluation_id: "${e_cy}", hold_type: "EMERGENCY_72H" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { h_cy: $.data.id }
            - call: "POST /behavioral-health/holds/${h_cy}/certify"
              payload: { certification_note: "Independent certification." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psb}"
            - call: "POST /behavioral-health/petitions"
              payload: { hold_id: "${h_cy}", requested_hold_type: "EXTENSION_14D", petition_grounds: "Continued grave risk requires 14-day certification." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { pet_cy: $.data.id }
            - call: "POST /behavioral-health/hearings"
