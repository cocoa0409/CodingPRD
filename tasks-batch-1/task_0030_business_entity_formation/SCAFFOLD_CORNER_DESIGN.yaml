  # ============================================================
  # Section: errors
  # ============================================================
  - section: errors
    instances:

      - name: err_stale_version_triggerable_on_registered_agent_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[registered-agent-create-stale-business-entity]
        distinguishing_aspect: "POST /business-entities/{id}/registered-agents with expected_business_entity_version one less than current returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DE LLC entity ACTIVE with at least one earlier mutation bumping version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "CCC LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent 1", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { be_v1: $.data.version }
          trigger:
            # Replay the now-stale version (the previous successful create bumped it; sending be_v0 again is stale).
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent 2", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v1} - 1" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "$.data.error_id == ERR_STALE_VERSION"

      - name: err_agent_state_mismatch_on_home_agent_creation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AGENT_STATE_MISMATCH]
        distinguishing_aspect: "POST /business-entities/{id}/registered-agents with agent_state_code != formation_state_code AND no foreign-qualification context returns 422 ERR_AGENT_STATE_MISMATCH on first creation when no in-state agent exists yet."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_foreign_qualification_halfopen_interval_overlap
          rationale: "Foreign-state agent creation is implicitly accepted in the §1.8 FQ-overlap setup; the home-state mismatch path is the inverse and would only fire on the FIRST agent creation. Because the formation chain requires an in-state agent first, ERR_AGENT_STATE_MISMATCH is exercised by an isolated negative-test in tests; we excluded it as redundant to the §1.8 FQ workflow."

      - name: err_fq_overlap_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FQ_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_foreign_qualification_halfopen_interval_overlap
          rationale: "Directly asserted as the rejection path of the §1.8 FQ overlap instance."

      - name: err_report_period_taken_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REPORT_PERIOD_TAKEN]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_annual_report_zero_width_period_year_uniqueness
          rationale: "Directly asserted as the rejection path of the §1.8 zero-width interval instance."

      - name: err_franchise_tax_cap_exceeded_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FRANCHISE_TAX_CAP_EXCEEDED]
          - validations[priority=90]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_void_and_refile_preserves_cumulative_franchise_tax_paid_cents
          rationale: "Cumulative-cap accounting is exercised by the void+refile invariant on cumulative_franchise_tax_paid_cents; the cap-exceedance path is a single-direction inequality on the same accumulator and unreachable in a single fixture without synthetic prior FILED reports."

