              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { pool_1_id: $.data.id }
            - call: "POST /api/match-pools"
              payload: { campaign_id: "${camp_id}", sponsor_name: "Harbor Mutual", pool_amount_cents: 50000, match_ratio: 0.2, per_donation_cap_cents: 5000, min_donation_cents: 0, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { pool_2_id: $.data.id }
