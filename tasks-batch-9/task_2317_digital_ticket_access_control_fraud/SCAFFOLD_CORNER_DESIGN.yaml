      - name: zone_posture_restricted_band_at_exactly_the_zero_point_nine_ratio
        claim_type: precision
        grounds:
          - calculations.zone_posture
          - calculations.zone_posture.constants.RESTRICTED_RATIO
          - calculations.zone_posture.constants.FROZEN_RATIO
          - entities.AccessZone.fields.posture
        distinguishing_aspect: |
          The RESTRICTED band is entered on an exact ratio equality: with
          fire_code_capacity 10, the 8th issuance leaves ratio 0.80 and posture OPEN, the
          9th hits exactly 0.90 and must be RESTRICTED (a strict > reading would wrongly
          leave it OPEN), and the 10th hits exactly 1.00 and must be FROZEN. RESTRICTED
          still permits credential submission — only FROZEN blocks it.
        test_recipe:
          setup:
            - "Event ON_SALE; AccessZone SMALL with fire_code_capacity 10 and credential_capacity 4; Ada verified; 8 PAID tickets already issued into SMALL."
