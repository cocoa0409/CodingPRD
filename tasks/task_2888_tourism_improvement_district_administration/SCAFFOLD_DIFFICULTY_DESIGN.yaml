      - name: granted_dispute_cascades_through_funding_ratio_into_a_frozen_program
        grounds:
          - state_machines.AnnualWorkPlan.APPROVED_to_AMENDMENT_PENDING
          - state_machines.MarketingProgram
          - calculations.work_plan_compliance
          - validations.ERR_PROGRAM_SPEND_FROZEN
        distinguishing_aspect: |
          A dispute resolution on one statement propagates three entities away: the statement's
          effective assessment drops from 824,500 to 424,500, the district's fiscal-2027 forecast
          drops from 1,164,500 to 764,500, the approved plan's funding_ratio drops from 1.1645 to
          0.7645 and drives the plan to AMENDMENT_PENDING, and that flip freezes the RUNNING marketing
          program so its closure is refused. A later amendment reaches the fixed point and thaws the
          program without touching any statement.
        test_recipe:
          setup:
            - "district ACTIVE with an EXECUTED DMO agreement and a 400,000 lodging tax match pool"
            - "period FY2027-Q1 with b1 filed at 824,500 and b2 filed at 340,000, forecast 1,164,500"
            - "work plan for fiscal year 2027 approved at a 1,000,000 total, funding_ratio 1.1645"
            - "a 62,000 marketing program launched and RUNNING with no claims filed"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_find_st_b2
            - *k_file_st1_824500
            - *k_file_st2_340000
            - *k_plan_fy2027
            - *k_sponsor_plan
            - *k_approve_plan
            - *k_dmo_executed
            - *k_program_62000
            - *k_clock_launch
            - *k_launch_program
          trigger:
            - call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st1_id}", dispute_type: "CALCULATION_ERROR", claimed_adjustment_cents: 400000, dispute_note: "revenue basis double counted the resort fee" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { dsp2_id: "$.data.id" }
            - call: "POST /assessment-disputes/${dsp2_id}/proceedings"
              payload: { action: "OPEN_REVIEW", note: "docketed for hearing" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-disputes/${dsp2_id}/resolution"
              payload: { outcome: "ADJUSTED", granted_adjustment_cents: 400000, resolution_note: "resort fee excluded from the revenue basis" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /marketing-programs/${mp_id}/closure"
              payload: { closure_note: "attempted close while the plan is unfunded" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "GET /annual-work-plans/${wp_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp_v_pending: "$.data.version" }
            - call: "POST /annual-work-plans/${wp_id}/amendments"
              payload: { expected_work_plan_version: "${wp_v_pending}", expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 520000, narrative: "reduced paid search and group sales" }, { category: "ADMINISTRATION", amount_cents: 120000, narrative: "district staff and audit fees" }, { category: "CONTINGENCY_RESERVE", amount_cents: 80000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 80000, narrative: "scaled-back harbour festival" }], amendment_reason: "rebased on the adjusted assessment roll" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "hop 1: AssessmentDispute.${dsp2_id}.status == RESOLVED_ADJUSTED and granted_adjustment_cents == 400000"
            - "hop 2: AssessmentStatement.${st1_id}.granted_adjustment_cents == 400000 and effective_assessment_cents == 424500"
            - "hop 3: AnnualWorkPlan.${wp_id}.assessment_revenue_forecast_cents == 764500, funding_ratio == 0.7645 and status == AMENDMENT_PENDING"
            - "hop 4: MarketingProgram.${mp_id}.status is still RUNNING and spend_frozen == true"
            - "the closure attempt returns ERR_PROGRAM_SPEND_FROZEN with HTTP 409 and leaves MarketingProgram.${mp_id}.performance_flag == NOT_MEASURED"
            - "after the amendment, AnnualWorkPlan.${wp_id}.total_budget_cents == 800000, funding_ratio == 0.9556, status == APPROVED and revision_count == 1"
            - "after the amendment, MarketingProgram.${mp_id}.spend_frozen == false and status is still RUNNING"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents is still 424500, proving the propagation reached a fixed point without writing back to any statement"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: certified_statement_beats_closed_filing_window_with_occ_already_satisfied
        grounds:
          - validations.ERR_STATEMENT_ALREADY_CERTIFIED
          - validations.ERR_FILING_WINDOW_CLOSED
          - concurrency_rules.statement-amendment-stale-statement
        distinguishing_aspect: |
          An amendment against a CERTIFIED statement in a CLOSED period violates the priority-60 state
          rule and the priority-75 temporal rule at once, and the request also carries a correct
          expected_statement_version so the priority-65 OCC gate in between is satisfied and cannot
          hide the ordering. The server must answer ERR_STATEMENT_ALREADY_CERTIFIED; the companion
          call on a merely FILED statement in the same closed period proves the 75 rule is live.
        test_recipe:
          setup:
            - "district ACTIVE, period FY2027-Q1 with b1 filed at 824,500 and b2 filed at 340,000"
            - "clock advanced to 2026-11-16, past due_date 2026-11-15, and the period closed"
            - "b1's statement audited by auditor-01 and then certified by auditor-02, so filing_status is CERTIFIED"
            - "current versions of both statements read back so the OCC field can carry a correct value"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_find_st_b2
            - *k_file_st1_824500
            - *k_file_st2_340000
            - *k_clock_period_end
            - *k_close_q1
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audit_note: "reported figures accepted" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "CERTIFY", audit_note: "certified for the annual audit file" }
              as: IndependentAuditor
              as_user_id: "auditor-02"
            - call: "GET /assessment-statements/${st1_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st1_v_certified: "$.data.version" }
            - call: "GET /assessment-statements/${st2_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st2_v_filed: "$.data.version" }
          trigger:
            - call: "POST /assessment-statements/${st1_id}/amendments"
              payload: { expected_statement_version: "${st1_v_certified}", reported_room_nights: 2100, reported_gross_room_revenue_cents: 42000000, amendment_reason: "late correction attempted on a certified statement" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-statements/${st2_id}/amendments"
              payload: { expected_statement_version: "${st2_v_filed}", reported_room_nights: 650, reported_gross_room_revenue_cents: 21000000, amendment_reason: "late correction attempted on a filed statement" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
          assert:
            - "the first amendment returns ERR_STATEMENT_ALREADY_CERTIFIED with HTTP 409, not ERR_FILING_WINDOW_CLOSED and not ERR_STALE_STATEMENT_VERSION"
            - "the second amendment, on a statement whose filing_status is only FILED, returns ERR_FILING_WINDOW_CLOSED with HTTP 409, proving the priority-75 rule was genuinely violated in both calls"
            - "AssessmentStatement.${st1_id}.filing_status is still CERTIFIED and reported_room_nights is still 2000"
            - "AssessmentStatement.${st1_id}.amendment_count == 0"
            - "AssessmentStatement.${st2_id}.reported_room_nights is still 600 and amendment_count == 0"

      - name: segregation_of_duties_beats_administration_share_cap_on_plan_approval
        grounds:
          - validations.ERR_SEGREGATION_OF_DUTIES
          - validations.ERR_ADMIN_SHARE_EXCEEDED
          - calculations.work_plan_compliance
          - roles.BoardMember
        distinguishing_aspect: |
          A plan whose ADMINISTRATION share is 300,000 of 1,000,000 breaks the 15 percent cap, and the
          board member approving it is also its sponsor. Both violations are present in one request, and
          the priority-70 identity rule must answer first with 403; re-issuing the identical approval
          from a second board member then surfaces the priority-85 cap with 409, so neither rule is
          shadowed by the other.
        test_recipe:
          setup:
            - "district ACTIVE, period FY2027-Q1 with b1 filed at 824,500 and b2 filed at 340,000, so funding_ratio would be 1.1645 and the priority-90 funding rule is satisfied"
            - "a DRAFT fiscal-2027 plan totalling 1,000,000 with SALES_AND_MARKETING 600,000, ADMINISTRATION 300,000 and CONTINGENCY_RESERVE 100,000; only the administration cap of 150,000 is breached"
            - "the plan sponsored by board-member-01"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_find_st_b2
            - *k_file_st1_824500
            - *k_file_st2_340000
            - call: "POST /annual-work-plans"
              payload: { district_id: "${d_id}", fiscal_year: 2027, expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 600000, narrative: "paid search and trade shows" }, { category: "ADMINISTRATION", amount_cents: 300000, narrative: "district staff, deliberately over the cap" }, { category: "CONTINGENCY_RESERVE", amount_cents: 100000, narrative: "statutory reserve" }] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { bad_wp_id: "$.data.id" }
            - call: "POST /annual-work-plans/${bad_wp_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored by board-member-01" }
              as: BoardMember
              as_user_id: "board-member-01"
          trigger:
            - call: "POST /annual-work-plans/${bad_wp_id}/board-actions"
              payload: { action: "APPROVE", note: "sponsor attempts to approve their own plan" }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "POST /annual-work-plans/${bad_wp_id}/board-actions"
              payload: { action: "APPROVE", note: "a second board member approves the same plan" }
              as: BoardMember
              as_user_id: "board-member-02"
          assert:
            - "the first approval returns ERR_SEGREGATION_OF_DUTIES with HTTP 403, not ERR_ADMIN_SHARE_EXCEEDED"
            - "the second approval, from a different X-User-ID, returns ERR_ADMIN_SHARE_EXCEEDED with HTTP 409"
            - "AnnualWorkPlan.${bad_wp_id}.status is still BOARD_REVIEW after both attempts"
            - "AnnualWorkPlan.${bad_wp_id}.approver_user_id is null and approved_at is null"
            - "AnnualWorkPlan.${bad_wp_id}.administration_cents == 300000 against an admin cap of 150000"

      - name: closed_petition_window_beats_outside_boundary_signer
        grounds:
