              payload: { space_id: "${sb}", share_pct: 50, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-30T23:59:59Z" }
              as: FinanceController
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err_id} == ERR_SPACE_BUILDING_MISMATCH (NOT ERR_SPACE_SHARE_EXCEEDED, even though space ${sb} is already at 100% on those dates)"
            - "Space.${sb}.allocated_share_pct == 100 and Space.${sb}.free_share_pct == 0 (no row created)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sla_response_met_at_exact_deadline_inclusive
        grounds:
          - calculations.sla_evaluation
          - entities.Dispatch.fields.sla_response_met
          - state_machines.Dispatch.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Numeric/temporal threshold boundary on the accept endpoint: accepting at exactly
          dispatched_at + sla_response_minutes (09:00 + 60 = 10:00:00Z) is MET, because the comparison
          is `accepted_at <= sla_response_due_at`. One minute later it is a breach.
        test_recipe:
          setup:
            - "Vendor with sla_response_minutes 60; a work order dispatched at exactly 2026-05-04T09:00:00Z."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FacilityManager
          assert:
            - "Dispatch.${d1}.sla_response_met == true (accepted_at == sla_response_due_at, inclusive boundary)"
            - "Dispatch.${d1}.response_minutes == 60"
            - "WorkOrder.${wo1}.sla_state == WITHIN and WorkOrder.${wo1}.status == IN_PROGRESS"

      - name: kpi_empty_sets_return_full_compliance_not_zero
        grounds:
          - calculations.building_kpi_dashboard
          - endpoints["GET /fm/buildings/{building_id}/kpi"]
          - entities.Building.fields.operating_posture
        distinguishing_aspect: |
          An empty-collection boundary on a DIFFERENT metric and a DIFFERENT endpoint than the SLA
          deadline: with zero COMPLETED dispatches and zero ACTIVE PM plans, the KPI dashboard returns
          sla_compliance_pct 100.00 and pm_compliance_pct 100.00 (the pinned empty-set value), while
          occupancy_pct is 0.00 and energy_intensity_kwh_per_sqm is 0.0 because those sums really are
          empty — divide-by-zero must not surface as 0.0 compliance.
        test_recipe:
          setup:
            - "A freshly created building with one VACANT space, no assets, no PM plans, no dispatches and no utility readings."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 200, space_type: "OFFICE" }
              as: FacilityManager
          trigger:
            - call: "GET /fm/buildings/${b1}/kpi"
              payload: { window_start: "2026-05-01T00:00:00Z", window_end: "2026-05-31T23:59:59Z" }
              as: SustainabilityAnalyst
          assert:
            - "response.data.sla_compliance_pct == 100.00 (zero COMPLETED dispatches -> pinned empty-set value)"
            - "response.data.pm_compliance_pct == 100.00 (zero ACTIVE PM plans -> pinned empty-set value)"
            - "response.data.occupancy_pct == 0.00 and response.data.energy_intensity_kwh_per_sqm == 0.0"
            - "response.data.total_utility_cost == 0.00 and response.data.open_work_order_count == 0"
            - "response.data.posture == OPEN"

      - name: restricted_posture_at_exactly_two_open_p1_orders
        grounds:
          - calculations.building_operating_posture
          - state_machines.Building.OPEN_to_RESTRICTED
          - validations[priority=55]
          - errors[ERR_BUILDING_RESTRICTED]
        distinguishing_aspect: |
          Count-threshold boundary on a third metric and endpoint (POST /fm/work-orders): one open P1
          order leaves the building OPEN, the SECOND open P1 order flips it to RESTRICTED
          (open_p1_work_order_count >= 2), and only then are P3/P4 orders rejected.
        test_recipe:
          setup:
            - "Building with exactly one open P1 work order — posture still OPEN."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P1", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { p1a: $.data.id }
            - call: "GET /fm/buildings/${b1}"
              payload: {}
              as: FacilityManager
              captures: { posture_at_one: $.data.operating_posture }
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P1", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { p1b: $.data.id }
            - call: "GET /fm/buildings/${b1}"
              payload: {}
              as: FacilityManager
          assert:
            - "${posture_at_one} == OPEN (open_p1_work_order_count == 1 is below the >= 2 threshold)"
            - "Building.${b1}.open_p1_work_order_count == 2 and Building.${b1}.operating_posture == RESTRICTED"
            - "A subsequent POST /fm/work-orders with priority P3 on ${b1} returns 409 ERR_BUILDING_RESTRICTED"
            - "A subsequent POST /fm/work-orders with priority P2 on ${b1} returns 201 (only P3/P4 are gated by RESTRICTED)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: work_order_creation_depends_on_building_posture
        grounds:
          - validations[priority=55]
          - calculations.building_operating_posture
          - errors[ERR_BUILDING_FROZEN]
          - state_machines.Building.OPEN_to_FROZEN
        distinguishing_aspect: |
          Entity pair WorkOrder -> Building: whether a WorkOrder may be created at all depends on the
          Building's derived operating_posture. In a FROZEN building a PREVENTIVE P2 order is rejected
          with ERR_BUILDING_FROZEN while a CORRECTIVE P1 order (the repair that unfreezes the building)
          is accepted.
        test_recipe:
          setup:
            - "Building FROZEN because its CRITICAL asset is OUT_OF_SERVICE."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "CHILLER-01", category: "HVAC", criticality: "CRITICAL" }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", asset_id: "${a1}", wo_type: "PREVENTIVE", priority: "P2", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", asset_id: "${a1}", wo_type: "CORRECTIVE", priority: "P1", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo_ok: $.data.id }
          assert:
            - "The PREVENTIVE P2 create returns 409 with ${err_id} == ERR_BUILDING_FROZEN"
            - "The CORRECTIVE P1 create returns 201 and WorkOrder.${wo_ok}.status == NEW"
            - "Building.${b1}.operating_posture == FROZEN throughout (one open P1 order does not change it)"

      - name: dispatch_creation_depends_on_vendor_status
        grounds:
          - validations[priority=60]
          - entities.Vendor.fields.status
          - errors[ERR_VENDOR_SUSPENDED]
          - state_machines.SoftServiceShift.SCHEDULED_to_MISSED
        distinguishing_aspect: |
          A DIFFERENT entity pair from WorkOrder->Building: Dispatch -> Vendor. A dispatch against a
          vendor whose status is SUSPENDED (three MISSED shifts) is rejected with ERR_VENDOR_SUSPENDED,
          while a PROBATION vendor (two strikes) is still dispatchable.
        test_recipe:
          setup:
            - "Vendor SUSP suspended by three MISSED shifts; vendor PROB on two strikes (PROBATION)."
            - "Two open P3 work orders with no asset."
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "Z1", floor: 1, area_sqm: 200, space_type: "COMMON" }
              as: FacilityManager
              captures: { z1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "SuspCo", trade: "JANITORIAL", hourly_rate: 50.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { vs: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "ProbCo", trade: "SECURITY", hourly_rate: 50.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { vp: $.data.id }
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${vs}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-04-01T08:00:00Z", end_at: "2026-04-01T10:00:00Z", planned_headcount: 2 }
              as: FacilityManager
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${vs}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-04-01T10:00:00Z", end_at: "2026-04-01T12:00:00Z", planned_headcount: 2 }
              as: FacilityManager
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${vs}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-04-01T12:00:00Z", end_at: "2026-04-01T14:00:00Z", planned_headcount: 2 }
              as: FacilityManager
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${vp}", zone_space_id: "${z1}", service_type: "SECURITY", start_at: "2026-04-02T08:00:00Z", end_at: "2026-04-02T10:00:00Z", planned_headcount: 1 }
              as: FacilityManager
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${vp}", zone_space_id: "${z1}", service_type: "SECURITY", start_at: "2026-04-02T10:00:00Z", end_at: "2026-04-02T12:00:00Z", planned_headcount: 1 }
              as: FacilityManager
            - call: "POST /fm/buildings/${b1}/ops-run"
              payload: {}
              as: FacilityManager
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { w1: $.data.id, w1_v: $.data.version }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { w2: $.data.id, w2_v: $.data.version }
          trigger:
            - call: "POST /fm/work-orders/${w1}/dispatches"
              payload: { vendor_id: "${vs}", expected_work_order_version: "${w1_v}" }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
            - call: "POST /fm/work-orders/${w2}/dispatches"
              payload: { vendor_id: "${vp}", expected_work_order_version: "${w2_v}" }
              as: FacilityManager
              captures: { d_ok: $.data.id }
          assert:
            - "Vendor.${vs}.strike_count == 3 and Vendor.${vs}.status == SUSPENDED"
            - "Vendor.${vp}.strike_count == 2 and Vendor.${vp}.status == PROBATION"
            - "The dispatch to ${vs} returns 409 with ${err_id} == ERR_VENDOR_SUSPENDED and WorkOrder.${w1}.status stays NEW"
            - "The dispatch to ${vp} returns 201, Dispatch.${d_ok}.status == OFFERED and WorkOrder.${w2}.status == DISPATCHED"

      - name: statement_creation_depends_on_lease_status
        grounds:
          - validations[priority=52]
          - errors[ERR_LEASE_NOT_ACTIVE]
          - state_machines.Lease.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          A third entity pair: ChargebackStatement -> Lease. Drafting a statement against a lease still
          in DRAFT is rejected with ERR_LEASE_NOT_ACTIVE; the same call succeeds the moment the lease is
          activated.
        test_recipe:
          setup:
            - "Lease in DRAFT with one ACTIVE allocation (so it is activatable but not yet active)."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v_draft: $.data.version }
          trigger:
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v_draft}" }
              as: FinanceController
              captures: { err_id: $.data.error_id }
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v_active: $.data.version }
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v_active}" }
              as: FinanceController
              captures: { st_ok: $.data.id }
          assert:
            - "The first statement create returns 409 with ${err_id} == ERR_LEASE_NOT_ACTIVE"
            - "After activation Lease.${l1}.status == ACTIVE and the same create returns 201"
            - "ChargebackStatement.${st_ok}.base_rent == 1000.00 and ChargebackStatement.${st_ok}.total_amount == 1000.00"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vendor_shift_half_open_interval_adjacent_ok_overlap_rejected
        grounds:
          - validations[priority=70]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.SoftServiceShift.fields.start_at
          - entities.SoftServiceShift.fields.end_at
        distinguishing_aspect: |
          Interval semantics A — HALF-OPEN [start_at, end_at) on the VENDOR resource: a second shift for
          the same vendor starting exactly when the first ends (12:00) is accepted, but one starting a
          minute earlier (11:59) is rejected with ERR_SHIFT_OVERLAP even though it sits in a different
          building.
        test_recipe:
          setup:
            - "One janitorial vendor with a SCHEDULED shift 10:00-12:00 on 2026-05-06 in building 1."
            - "A second building with its own zone, so the collision can only come from the vendor, not the zone."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings"
              payload: { name: "Tower Two", code: "BLD-2", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b2: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "Z1", floor: 1, area_sqm: 200, space_type: "COMMON" }
              as: FacilityManager
              captures: { z1: $.data.id }
            - call: "POST /fm/buildings/${b2}/spaces"
              payload: { space_code: "Z2", floor: 1, area_sqm: 200, space_type: "COMMON" }
              as: FacilityManager
              captures: { z2: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CleanCo", trade: "JANITORIAL", hourly_rate: 40.00, sla_response_minutes: 120, sla_resolve_minutes: 480 }
              as: FacilityManager
              captures: { jv: $.data.id }
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${jv}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-05-06T10:00:00Z", end_at: "2026-05-06T12:00:00Z", planned_headcount: 3 }
              as: FacilityManager
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b2}", vendor_id: "${jv}", zone_space_id: "${z2}", service_type: "JANITORIAL", start_at: "2026-05-06T12:00:00Z", end_at: "2026-05-06T14:00:00Z", planned_headcount: 3 }
              as: FacilityManager
              captures: { sh2: $.data.id }
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b2}", vendor_id: "${jv}", zone_space_id: "${z2}", service_type: "JANITORIAL", start_at: "2026-05-06T11:59:00Z", end_at: "2026-05-06T13:00:00Z", planned_headcount: 3 }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "The 12:00-14:00 shift returns 201 and SoftServiceShift.${sh2}.status == SCHEDULED (touching endpoints do not collide under half-open semantics)"
            - "The 11:59-13:00 shift returns 409 with ${err_id} == ERR_SHIFT_OVERLAP (it intersects ${sh1} by one minute)"
            - "GET /fm/soft-service-shifts?vendor_id=${jv} returns exactly 2 shifts"

      - name: allocation_closed_interval_touching_date_aggregate_capacity
        grounds:
          - validations[priority=75]
          - errors[ERR_SPACE_SHARE_EXCEEDED]
          - calculations.space_share_conservation
          - entities.LeaseAllocation.fields.effective_to
        distinguishing_aspect: |
          Interval semantics B on a DIFFERENT resource entity (Space, not Vendor) with DIFFERENT
          geometry: FULLY CLOSED [effective_from, effective_to] plus AGGREGATE capacity. Two allocations
          may share the same space and the same dates as long as the summed share_pct stays <= 100, but
          the touching date 2026-05-31 is covered by BOTH intervals, so 60 + 50 = 110 is rejected while
          60 + 40 = 100 is accepted.
        test_recipe:
          setup:
            - "Space S1 (100 sqm) with a 60% allocation to lease LA covering 2026-05-01 .. 2026-05-31 (closed)."
            - "A second lease LB in the same building wanting the same space from 2026-05-31 (the touching date) to 2026-06-30."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Alpha", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-31T23:59:59Z" }
              as: FinanceController
              captures: { la: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Bravo", base_rate_per_sqm_month: 10.00, start_date: "2026-05-31T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: FinanceController
              captures: { lb: $.data.id }
            - call: "POST /fm/leases/${la}/allocations"
              payload: { space_id: "${s1}", share_pct: 60, effective_from: "2026-05-01T00:00:00Z", effective_to: "2026-05-31T23:59:59Z" }
              as: FinanceController
              captures: { al_a: $.data.id }
          trigger:
            - call: "POST /fm/leases/${lb}/allocations"
              payload: { space_id: "${s1}", share_pct: 50, effective_from: "2026-05-31T00:00:00Z", effective_to: "2026-06-30T23:59:59Z" }
              as: FinanceController
              captures: { err_id: $.data.error_id }
            - call: "POST /fm/leases/${lb}/allocations"
              payload: { space_id: "${s1}", share_pct: 40, effective_from: "2026-05-31T00:00:00Z", effective_to: "2026-06-30T23:59:59Z" }
              as: FinanceController
              captures: { al_b: $.data.id }
          assert:
            - "The 50% allocation returns 422 with ${err_id} == ERR_SPACE_SHARE_EXCEEDED (on 2026-05-31 the closed intervals overlap: 60 + 50 = 110 > 100)"
            - "The 40% allocation returns 201 and LeaseAllocation.${al_b}.status == ACTIVE (60 + 40 == 100 exactly, the inclusive capacity edge)"
            - "Space.${s1}.allocated_share_pct == 100 and Space.${s1}.free_share_pct == 0 as of the clock date 2026-05-31 is not asserted here; as of the clock 2026-05-15 only ${al_a} covers the date, so allocated_share_pct == 60 and free_share_pct == 40"
            - "Space.${s1}.occupancy_status == OCCUPIED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: capital_funds_conserved_across_work_order_create_and_cancel
        grounds:
          - state_machines.WorkOrder.NEW_to_CANCELLED
          - state_machines.CapitalProject.APPROVED_to_IN_FLIGHT
          - entities.CapitalProject.fields.committed_amount
          - entities.CapitalProject.fields.remaining_amount
          - calculations.capital_project_budget
        distinguishing_aspect: |
          Conserved quantity #1 — MONEY: budget_amount == remaining_amount + committed_amount +
          spent_amount must hold before and after the compensating action. Creating a funded work order
          commits 400.00 (remaining 700.00); cancelling it releases exactly 400.00, returning
          remaining_amount to 1100.00 with spent_amount still 0.00 and zero drift.
        test_recipe:
          setup:
            - "Clock at 2026-05-04T09:00:00Z (business hours)."
            - "CapitalProject with base_cost 1000.00 -> budget_amount 1100.00, APPROVED by a different FinanceController than the proposer."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/capital-projects"
              payload: { building_id: "${b1}", title: "Lobby refit", base_cost: 1000.00 }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { p1: $.data.id, p1_budget: $.data.budget_amount }
            - call: "POST /fm/capital-projects/${p1}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fc-2"
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 5, estimated_parts_cost: 0, funding_project_id: "${p1}" }
              as: FacilityManager
              captures: { wo1: $.data.id }
            - call: "GET /fm/capital-projects/${p1}"
              payload: {}
              as: FinanceController
            - call: "POST /fm/work-orders/${wo1}/cancel"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/capital-projects/${p1}"
              payload: {}
              as: FinanceController
          assert:
            - "${p1_budget} == 1100.00"
            - "After the create: CapitalProject.${p1}.committed_amount == 400.00, remaining_amount == 700.00, spent_amount == 0, status == IN_FLIGHT"
            - "After the create the invariant holds: 1100.00 == 700.00 + 400.00 + 0"
            - "After the cancel: CapitalProject.${p1}.committed_amount == 0, remaining_amount == 1100.00, spent_amount == 0"
            - "After the cancel the invariant holds with zero drift: 1100.00 == 1100.00 + 0 + 0"
            - "WorkOrder.${wo1}.status == CANCELLED and WorkOrder.${wo1}.estimated_amount == 400.00 (the released amount is exactly what was committed)"

      - name: occupancy_share_conserved_across_allocation_create_and_release
        grounds:
          - calculations.space_share_conservation
          - entities.Space.fields.allocated_share_pct
          - entities.Space.fields.free_share_pct
          - entities.Lease.fields.allocated_area_sqm
          - endpoints["DELETE /fm/lease-allocations/{allocation_id}"]
        distinguishing_aspect: |
          Conserved quantity #2 of a DIFFERENT TYPE — occupancy SHARE (a percentage capacity, not
          money): allocated_share_pct + free_share_pct == 100 on the space at every step. Allocating 40%
          drives free_share_pct to 60; releasing that allocation returns it to exactly 100 and the
          space back to VACANT, with lease.allocated_area_sqm back to 0.
        test_recipe:
          setup:
            - "Clock at 2026-05-15T09:00:00Z, inside the allocation interval."
            - "Space S1 of 200 sqm, fully free; one DRAFT lease."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 200, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 40, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { al1: $.data.id }
            - call: "GET /fm/spaces/${s1}"
              payload: {}
              as: FinanceController
            - call: "DELETE /fm/lease-allocations/${al1}"
              payload: {}
              as: FinanceController
            - call: "GET /fm/spaces/${s1}"
              payload: {}
              as: FinanceController
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
          assert:
            - "After the allocation: Space.${s1}.allocated_share_pct == 40, free_share_pct == 60, occupancy_status == OCCUPIED; 40 + 60 == 100"
            - "After the allocation: Lease.${l1}.allocated_area_sqm == 80.00 (200 * 0.40)"
            - "After the release: LeaseAllocation.${al1}.status == RELEASED"
            - "After the release: Space.${s1}.allocated_share_pct == 0, free_share_pct == 100, occupancy_status == VACANT; 0 + 100 == 100 with zero drift"
            - "After the release: Lease.${l1}.allocated_area_sqm == 0"
