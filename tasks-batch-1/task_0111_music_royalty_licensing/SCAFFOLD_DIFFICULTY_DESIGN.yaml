      - name: sync_subtotal_tier_boundary_500000
        grounds:
          - calculations.sync_quote_fee
          - entities.SyncLicense.fields.base_fee_cents
          - entities.SyncLicense.fields.quoted_fee_cents
        distinguishing_aspect: |
          A DIFFERENT metric (sync media-scaled subtotal) on a DIFFERENT endpoint (POST
          /sync-licenses): base 250000 FILM gives subtotal exactly 500000 (>= boundary -> terr 1.0
