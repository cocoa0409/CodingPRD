              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${m1}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comfort-exchanges"
