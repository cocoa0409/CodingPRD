              captures: { claim_after_refusal: $.data.validation_status, claim_adj_after: $.data.adjudicated_by_user_id }
            - call: "POST /incentives/claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-dual-1"
              captures: { claim_ok: $.data.validation_status, claim_amount: $.data.approved_amount_cents, claim_adj: $.data.adjudicated_by_user_id }
          assert:
            - "${p1_status} == PENDING_APPROVAL with ${p1_submitter} == u-dual-1, and ${p2_submitter} == u-designer-1"
            - "${err_sod_program} == ERR_SEGREGATION_OF_DUTIES (403) — u-dual-1 holds the IncentiveController role legitimately, so this is NOT ERR_UNAUTHORIZED; the refusal is about identity, not about role"
            - "${p1_after_refusal} == PENDING_APPROVAL and ${p1_approver_after} is null — the refused approval had no side effect"
            - "${p1_active} == ACTIVE with ${p1_approver} == u-controller-1"
            - "${p2_active} == ACTIVE with ${p2_approver} == u-dual-1 — the SAME user that was just refused on P1 approves P2 without complaint, because the rule compares the caller against THAT program's submitted_by_user_id"
            - "${del_validator} == u-auditor-1 and ${err_sod_claim} == ERR_SEGREGATION_OF_DUTIES — the auditor who validated the delivery may not adjudicate its claim"
            - "${claim_after_refusal} == SUBMITTED with ${claim_adj_after} null — again no partial effect"
            - "${claim_ok} == VALIDATED with ${claim_amount} == 25000 and ${claim_adj} == u-dual-1 — u-dual-1 may adjudicate here even though it submitted this very program, proving the two sites are independent and that the claim site reads ONLY delivery.validated_by_user_id"

