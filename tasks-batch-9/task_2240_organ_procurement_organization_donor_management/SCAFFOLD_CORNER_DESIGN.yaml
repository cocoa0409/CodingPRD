          gate at 45 wins (ERR_AUTHORIZATION_NOT_FINALIZABLE) and no state moves, and only once the
          packet is NOK_CONSENTED does the documentation gate at 65 surface - uniquely in this
          scaffold, that 422 also records a state move to DOCUMENT_DEFICIENT.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T08:00:00Z."
