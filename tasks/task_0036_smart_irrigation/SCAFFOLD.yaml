scenario: |
  Smart Agriculture Irrigation System: sensor data collection with multi-type sensors (soil moisture/temperature/EC/weather station), polling frequency configuration, data validity check, abnormal-value filtering, and historical data archiving; irrigation plan scheduling with crop-stage-based water demand model, plot-level plan generation, manual plan override, plan-conflict check across plots, and plan version control; valve control dispatch with valve group configuration, sequential and parallel control rules, pump-and-valve interlock, control command issuance, execution feedback, and offline-degraded local control; water quota management with quota allocation by plot/period, real-time usage tracking, quota-warning thresholds, over-quota approval workflow, and quota carry-forward rules; abnormal alerting with rule-based alerts (sensor offline/abnormal flow/pipe burst suspicion/valve fault), alert level classification, notification dispatch to operators, alert acknowledgment, and resolution tracking; water fee allocation and settlement with usage statistics by plot and tenant, tiered pricing, peak-and-off-peak rates, fee bill generation, payment collection, and dispute handling; event-driven synchronization with weather service, payment, and IoT device management; audit logging for control commands and quota changes.

domain_name: "smart-irrigation"
api_prefix: "/plots"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Scheduled / deferred actions"
  entity_topology: "hybrid"
  state_machine_shape: "parallel"     # WaterQuota has parallel state dimensions; ControlCommand has branching; IrrigationPlan has cycle
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "hierarchical_override"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Tenant display name"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email; used for fee notifications"
      - name: status
        type: enum
        source: system
        description: "Tenant lifecycle status"
        default: ACTIVE
        constraints: "enum values: ACTIVE, SUSPENDED"

  - name: Plot
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "Owning tenant UUID"
      - name: name
        type: string
        source: input
        description: "Human-readable plot name"
      - name: area_hectares
        type: number
        source: input
        description: "Plot area in hectares"
        constraints: "> 0"
      - name: crop_type
        type: enum
        source: input
        description: "Crop currently planted on the plot"
        constraints: "enum values: WHEAT, CORN, RICE, COTTON, VEGETABLE"
      - name: crop_stage
        type: enum
        source: input
        description: "Current growth stage; drives the water demand model"
        constraints: "enum values: SEEDLING, VEGETATIVE, FLOWERING, FRUITING, MATURE"
      - name: pump_id
        type: string
        source: input
        description: "Identifier of the upstream pump serving this plot (for interlock)"
      - name: status
        type: enum
        source: system
        description: "Plot operational status"
        default: ACTIVE
        constraints: "enum values: ACTIVE, FALLOW"
      - name: last_irrigated_at
        type: datetime
        source: computed
        description: "Timestamp the plot was most recently irrigated (set by ControlCommand EXECUTED)"
        default: null

  - name: Sensor
    parent: Plot
    common_fields: true
    fields:
      - name: plot_id
        type: string
        source: input
        description: "Plot the sensor is installed on"
      - name: sensor_type
        type: enum
        source: input
        description: "Type of sensor"
        constraints: "enum values: SOIL_MOISTURE, SOIL_TEMPERATURE, SOIL_EC, WEATHER_STATION"
      - name: poll_interval_seconds
        type: integer
        source: input
        description: "Polling cadence in seconds"
        default: 300
        constraints: ">= 30 and <= 3600"
      - name: min_valid_value
        type: number
        source: input
        description: "Inclusive lower bound for a reading to be considered valid"
      - name: max_valid_value
        type: number
        source: input
        description: "Inclusive upper bound for a reading to be considered valid"
      - name: status
        type: enum
        source: system
        description: "Operational state"
        default: ONLINE
        constraints: "enum values: ONLINE, OFFLINE, FAULTY"
      - name: last_reading_at
        type: datetime
        source: computed
        description: "Latest accepted reading timestamp"
        default: null

  - name: SensorReading
    parent: Sensor
    common_fields: false   # append-only event; only id + created_at
    fields:
      - name: sensor_id
        type: string
        source: input
        description: "Source sensor"
      - name: value
        type: number
        source: input
        description: "Raw reading value"
      - name: reading_timestamp
        type: datetime
        source: input
        description: "ISO8601 timestamp the reading was sampled"
      - name: validity
        type: enum
        source: computed
        description: "Validity classification produced by data validity check"
        constraints: "enum values: VALID, OUT_OF_RANGE, ABNORMAL_FILTERED, ARCHIVED"
      - name: archived
        type: boolean
        source: computed
        description: "Whether the reading has been archived to historical store"
        default: false

  - name: IrrigationPlan
    parent: Plot
    common_fields: true
    fields:
      - name: plot_id
        type: string
        source: input
        description: "Target plot"
      - name: window_start
        type: datetime
        source: input
        description: "Planned irrigation window start (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "Planned irrigation window end (exclusive — half-open interval)"
      - name: planned_volume_liters
        type: number
        source: computed
        description: "Volume produced by crop-stage water demand model (or override)"
      - name: source
        type: enum
        source: system
        description: "How the plan was created"
        constraints: "enum values: AUTO, MANUAL_OVERRIDE"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle"
        default: DRAFT
        constraints: "enum values: DRAFT, ACTIVE, SUSPENDED, COMPLETED, CANCELLED"
      - name: plan_version
        type: integer
        source: system
        description: "Monotonic plan version per plot; increments when ACTIVE plan is revised"
        default: 1
      - name: parent_plan_id
        type: string
        source: system
        description: "If this plan is a revision, points at the predecessor plan"
        default: null

  - name: ValveGroup
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "Owning tenant"
      - name: name
        type: string
        source: input
        description: "Valve group display name"
      - name: pump_id
        type: string
        source: input
        description: "Pump that feeds every valve in this group (for interlock)"
      - name: valve_ids
        type: array
        source: input
        description: "Ordered list of valve identifiers in this group"
        constraints: "non-empty; max length 16"
      - name: control_mode
        type: enum
        source: input
        description: "How valves in the group are dispatched"
        constraints: "enum values: SEQUENTIAL, PARALLEL"
      - name: max_parallel_valves
        type: integer
        source: input
        description: "Cap on simultaneously open valves; only meaningful when control_mode = PARALLEL"
        default: 1
        constraints: ">= 1; SEQUENTIAL forces value 1"

  - name: ControlCommand
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "Driving irrigation plan"
      - name: valve_group_id
        type: string
        source: input
        description: "Target valve group"
      - name: requested_volume_liters
        type: number
        source: input
        description: "Volume to deliver"
        constraints: "> 0"
      - name: dispatch_mode
        type: enum
        source: system
        description: "Effective dispatch mode"
        constraints: "enum values: REMOTE, LOCAL_DEGRADED"
      - name: status
        type: enum
        source: system
        description: "Command lifecycle"
        default: PENDING
        constraints: "enum values: PENDING, DISPATCHING, EXECUTING, EXECUTED, FAILED, OFFLINE_LOCAL"
      - name: actual_volume_liters
        type: number
        source: computed
        description: "Volume actually delivered; reported by execution feedback"
        default: 0
      - name: feedback_received_at
        type: datetime
        source: computed
        description: "When the device feedback closed the command"
        default: null
      - name: failure_reason
        type: string
        source: computed
        description: "Free-text failure reason populated on FAILED"
        default: null

  - name: WaterQuota
    parent: Plot
    common_fields: true
    fields:
      - name: plot_id
        type: string
        source: input
        description: "Plot this quota applies to"
      - name: period_start
        type: datetime
        source: input
        description: "Quota period start (inclusive)"
      - name: period_end
        type: datetime
        source: input
        description: "Quota period end (exclusive — half-open)"
      - name: allocated_liters
        type: number
        source: input
        description: "Base allocation for the period"
        constraints: ">= 0"
      - name: carry_forward_liters
        type: number
        source: computed
        description: "Unused liters carried in from prior period (capped at 20% of prior allocation)"
        default: 0
      - name: provisional_used_liters
        type: number
        source: computed
        description: "Real-time usage from in-flight ControlCommands (PENDING/DISPATCHING/EXECUTING)"
        default: 0
      - name: final_used_liters
        type: number
        source: computed
        description: "Reconciled usage: sum of EXECUTED ControlCommand.actual_volume_liters"
        default: 0
      - name: warning_threshold_pct
        type: number
        source: input
        description: "Percentage of effective allocation at which WARNING fires"
        default: 80
        constraints: ">= 1 and <= 100"
      - name: usage_state
        type: enum
        source: computed
        description: "Threshold state derived from final_used_liters / effective_allocation"
        default: UNDER
        constraints: "enum values: UNDER, WARNING, OVER"
      - name: approval_state
        type: enum
        source: computed
        description: "Independent approval dimension for over-quota usage"
        default: NOT_REQUIRED
        constraints: "enum values: NOT_REQUIRED, PENDING_APPROVAL, APPROVED, REJECTED"
      - name: approval_extra_liters
        type: number
        source: input
        description: "Additional liters granted by over-quota approval"
        default: 0

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: system
        description: "Tenant for routing notifications"
      - name: subject_type
        type: enum
        source: system
        description: "Entity type the alert refers to"
        constraints: "enum values: SENSOR, PLOT, VALVE_GROUP"
      - name: subject_id
        type: string
        source: system
        description: "ID of the alert subject"
      - name: rule_code
        type: enum
        source: system
        description: "Triggering rule"
        constraints: "enum values: SENSOR_OFFLINE, ABNORMAL_FLOW, PIPE_BURST_SUSPICION, VALVE_FAULT"
      - name: severity
        type: enum
        source: computed
        description: "Severity classification produced by alert_severity_score"
        constraints: "enum values: INFO, WARN, CRITICAL"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status"
        default: TRIGGERED
        constraints: "enum values: TRIGGERED, ACKNOWLEDGED, RESOLVED, REOPENED"
      - name: acknowledged_by
        type: string
        source: system
        description: "Operator user id that acknowledged the alert"
        default: null
      - name: resolved_by
        type: string
        source: system
        description: "Operator user id that resolved the alert"
        default: null

  - name: WaterBill
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "Billed tenant"
      - name: plot_id
        type: string
        source: input
        description: "Plot this bill covers"
      - name: period_start
        type: datetime
        source: input
        description: "Bill period start (inclusive)"
      - name: period_end
        type: datetime
        source: input
        description: "Bill period end (exclusive)"
      - name: peak_liters
        type: number
        source: computed
        description: "Liters consumed in peak window during the period"
        default: 0
      - name: offpeak_liters
        type: number
        source: computed
        description: "Liters consumed in off-peak window during the period"
        default: 0
      - name: line_items
        type: array
        source: computed
        description: "Per-tier per-window line items with rounded amount_cents"
      - name: total_amount_cents
        type: integer
        source: computed
        description: "Sum of line_item.amount_cents (already rounded per-line)"
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cumulative payment received"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Bill lifecycle"
        default: DRAFT
        constraints: "enum values: DRAFT, ISSUED, PAID, DISPUTED, CANCELLED"
      - name: dispute_reason
        type: string
        source: input
        description: "Reason captured when status flips to DISPUTED"
        default: null

  - name: AuditLog
    parent: null
    common_fields: false  # append-only; immutable
    fields:
      - name: actor_role
        type: string
        source: system
        description: "Role of the acting principal"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of the acting principal"
      - name: action_type
        type: enum
        source: system
        description: "Audited action category"
        constraints: "enum values: CONTROL_COMMAND_ISSUED, CONTROL_COMMAND_FAILED, QUOTA_ALLOCATED, QUOTA_OVERRIDE_APPROVED, QUOTA_OVERRIDE_REJECTED, PLAN_OVERRIDDEN"
      - name: subject_type
        type: enum
        source: system
        description: "Audited entity type"
        constraints: "enum values: CONTROL_COMMAND, WATER_QUOTA, IRRIGATION_PLAN"
      - name: subject_id
        type: string
        source: system
        description: "Audited entity id"
      - name: payload
        type: object
        source: system
        description: "Snapshot of relevant fields before/after the action"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IrrigationPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /plots/{plot_id}/irrigation-plans/{id}/activate"
        actor: Operator
        preconditions:
          - "Plot.status == ACTIVE"
          - "At least one Sensor on the plot has Sensor.status == ONLINE"
          - "There is no other IrrigationPlan on the same plot whose [window_start, window_end) overlaps and whose status IN {ACTIVE, SUSPENDED}"
          - "An owning WaterQuota exists for the plan window with usage_state != OVER OR approval_state == APPROVED"
        side_effects:
          - "WaterQuota.provisional_used_liters increases by IrrigationPlan.planned_volume_liters via reservation"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /plots/{plot_id}/irrigation-plans/{id}/suspend or system: WaterQuota.usage_state becomes OVER while approval_state == NOT_REQUIRED"
        actor: Operator | system
        preconditions:
          - "Plan.status == ACTIVE"
        side_effects:
          - "Pending ControlCommands tied to this plan transition PENDING → FAILED with failure_reason='PLAN_SUSPENDED'"
          - "WaterQuota.provisional_used_liters reduced by remaining reservation"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /plots/{plot_id}/irrigation-plans/{id}/resume"
        actor: Operator
        preconditions:
          - "WaterQuota for the plan window has usage_state IN {UNDER, WARNING} OR approval_state == APPROVED"
        side_effects:
          - "Plan reservation re-applied to WaterQuota.provisional_used_liters"
      - from: ACTIVE
        to: DRAFT
        trigger: "POST /plots/{plot_id}/irrigation-plans/{id}/override (manual revision)"
        actor: Operator
        preconditions:
          - "Plan.status == ACTIVE"
          - "Override request body provides new planned_volume_liters or window"
        side_effects:
          - "Reservation against WaterQuota released"
          - "A new IrrigationPlan record is created with parent_plan_id = current plan id, plan_version = current.plan_version + 1, source = MANUAL_OVERRIDE, status = DRAFT"
          - "AuditLog{action_type=PLAN_OVERRIDDEN} appended"
        note: "This is the cycle ACTIVE → DRAFT (revision loop)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: clock advances past window_end and all ControlCommands for the plan are in terminal states"
        actor: system
        preconditions:
          - "now() >= window_end"
          - "No ControlCommand for this plan in {PENDING, DISPATCHING, EXECUTING}"
        side_effects:
          - "Reservation reconciled to actual consumption on WaterQuota.final_used_liters"
      - from: DRAFT
        to: CANCELLED
        trigger: "DELETE /plots/{plot_id}/irrigation-plans/{id}"
        actor: Operator
        preconditions:
          - "Plan.status == DRAFT"
        side_effects: []

  - entity: ControlCommand
    initial_state: PENDING
    terminal_states: [EXECUTED, FAILED, OFFLINE_LOCAL]
    transitions:
      - from: PENDING
        to: DISPATCHING
        trigger: "POST /control-commands/{id}/dispatch"
        actor: Operator | system
        preconditions:
          - "ControlCommand.status == PENDING"
          - "IrrigationPlan.status == ACTIVE"
          - "Pump-and-valve interlock: no other ControlCommand on the same Plot.pump_id is in {DISPATCHING, EXECUTING} unless the same pump's active commands' valve groups all share dispatch_mode == PARALLEL"
        side_effects:
          - "AuditLog{action_type=CONTROL_COMMAND_ISSUED} appended"
      - from: DISPATCHING
        to: EXECUTING
        trigger: "POST /control-commands/{id}/feedback {phase: STARTED}"
        actor: system
        preconditions:
          - "ControlCommand.status == DISPATCHING"
        side_effects: []
      - from: EXECUTING
        to: EXECUTED
        trigger: "POST /control-commands/{id}/feedback {phase: COMPLETED, actual_volume_liters: N}"
        actor: system
        preconditions:
          - "ControlCommand.status == EXECUTING"
          - "feedback.actual_volume_liters >= 0"
        side_effects:
          - "ControlCommand.actual_volume_liters set; feedback_received_at = now()"
          - "Plot.last_irrigated_at = now()"
          - "WaterQuota.final_used_liters increases by actual_volume_liters; usage_state recomputed via threshold rule (cascade: WaterQuota → may emit Alert when crossing OVER if approval_state == NOT_REQUIRED)"
      - from: DISPATCHING
        to: FAILED
        trigger: "POST /control-commands/{id}/feedback {phase: ERROR}"
        actor: system
        preconditions:
          - "ControlCommand.status IN {DISPATCHING, EXECUTING}"
        side_effects:
          - "ControlCommand.failure_reason set"
          - "WaterQuota.provisional_used_liters reduced by reserved amount (compensating release)"
          - "AuditLog{action_type=CONTROL_COMMAND_FAILED} appended"
          - "Alert{rule_code=VALVE_FAULT, subject_type=VALVE_GROUP} created if failure_reason == 'VALVE_FAULT'"
      - from: EXECUTING
        to: FAILED
        trigger: "POST /control-commands/{id}/feedback {phase: ERROR}"
        actor: system
        preconditions:
          - "ControlCommand.status IN {DISPATCHING, EXECUTING}"
        side_effects:
          - "Identical to DISPATCHING → FAILED"
      - from: PENDING
        to: OFFLINE_LOCAL
        trigger: "POST /control-commands/{id}/dispatch with header X-Device-Mode: OFFLINE"
        actor: Operator | system
        preconditions:
          - "ControlCommand.status == PENDING"
          - "Plot.pump_id resolved; remote dispatch unavailable"
        side_effects:
          - "dispatch_mode set to LOCAL_DEGRADED; no further transitions; reservation persists until reconciled by feedback ingest"
        note: "Branch terminus: offline-degraded local control. Reconciliation occurs out-of-band; feedback API may still post to advance from OFFLINE_LOCAL to EXECUTED."
      - from: OFFLINE_LOCAL
        to: EXECUTED
        trigger: "POST /control-commands/{id}/feedback {phase: COMPLETED, actual_volume_liters: N}"
        actor: system
        preconditions:
          - "ControlCommand.status == OFFLINE_LOCAL"
        side_effects:
          - "Identical to EXECUTING → EXECUTED"

  - entity: WaterQuota
    initial_state: UNDER       # this is usage_state; approval_state is parallel
    terminal_states: []        # quota is reused across periods; not terminal
    transitions:
      - from: UNDER
        to: WARNING
        trigger: "system: ControlCommand EXECUTED feedback raises usage to >= warning_threshold_pct of effective_allocation but < 100%"
        actor: system
        preconditions:
          - "final_used_liters / effective_allocation >= warning_threshold_pct/100"
          - "final_used_liters / effective_allocation < 1.0"
        side_effects:
          - "Alert{rule_code=ABNORMAL_FLOW, severity=WARN, subject_type=PLOT} created"
      - from: WARNING
        to: OVER
        trigger: "system: ControlCommand EXECUTED feedback raises usage to >= 100% of effective_allocation"
        actor: system
        preconditions:
          - "final_used_liters >= effective_allocation"
        side_effects:
          - "If approval_state == NOT_REQUIRED: any IrrigationPlan on the plot with status == ACTIVE transitions to SUSPENDED (cross-entity cascade)"
      - from: WARNING
        to: UNDER
        trigger: "system: WaterQuota.allocated_liters increased by PUT /water-quotas/{id} (reallocation) such that final/effective drops below threshold"
        actor: WaterAdmin
        preconditions:
          - "After reallocation, final_used_liters / effective_allocation < warning_threshold_pct/100"
        side_effects: []
      - from: OVER
        to: WARNING
        trigger: "POST /water-quotas/{id}/approve-override (grants approval_extra_liters)"
        actor: WaterAdmin
        preconditions:
          - "approval_state == PENDING_APPROVAL"
        side_effects:
          - "approval_state = APPROVED; effective_allocation grows; usage_state recomputed; suspended IrrigationPlans on this plot may be resumed by operator"
    transitions_approval_dim:
      # Parallel approval_state dimension on the same WaterQuota row (independent of usage_state above)
      - from: NOT_REQUIRED
        to: PENDING_APPROVAL
        trigger: "POST /water-quotas/{id}/request-override"
        actor: Operator
        preconditions:
          - "usage_state == OVER"
          - "approval_state == NOT_REQUIRED"
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /water-quotas/{id}/approve-override"
        actor: WaterAdmin
        preconditions:
          - "approval_state == PENDING_APPROVAL"
          - "request body specifies extra_liters > 0 and <= 50% of allocated_liters"
        side_effects:
          - "approval_extra_liters = body.extra_liters; effective_allocation recomputed; AuditLog{action_type=QUOTA_OVERRIDE_APPROVED} appended"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /water-quotas/{id}/reject-override"
        actor: WaterAdmin
        preconditions:
          - "approval_state == PENDING_APPROVAL"
        side_effects:
          - "AuditLog{action_type=QUOTA_OVERRIDE_REJECTED} appended"

  - entity: Alert
    initial_state: TRIGGERED
    terminal_states: [RESOLVED]
    transitions:
      - from: TRIGGERED
        to: ACKNOWLEDGED
        trigger: "POST /alerts/{id}/acknowledge"
        actor: Operator | WaterAdmin
        preconditions:
          - "Alert.status == TRIGGERED OR Alert.status == REOPENED"
        side_effects:
          - "Alert.acknowledged_by = X-User-ID"
      - from: REOPENED
        to: ACKNOWLEDGED
        trigger: "POST /alerts/{id}/acknowledge"
        actor: Operator | WaterAdmin
        preconditions:
          - "Alert.status == REOPENED"
        side_effects:
          - "Alert.acknowledged_by = X-User-ID"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /alerts/{id}/resolve"
        actor: Operator | WaterAdmin
        preconditions:
          - "Alert.status == ACKNOWLEDGED"
        side_effects:
          - "Alert.resolved_by = X-User-ID"
      - from: RESOLVED
        to: REOPENED
        trigger: "system: rule_code re-fires within 24 hours of resolution on the same subject_id"
        actor: system
        preconditions:
          - "Alert.status == RESOLVED"
          - "now() < Alert.updated_at + 24h"
        side_effects:
          - "acknowledged_by reset to null"
        note: "Cyclic shape: RESOLVED → REOPENED → ACKNOWLEDGED → RESOLVED"

  - entity: WaterBill
    initial_state: DRAFT
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /water-bills/{id}/issue"
        actor: WaterAdmin
        preconditions:
          - "Bill.status == DRAFT"
          - "Bill.line_items is non-empty"
        side_effects:
          - "Bill.line_items frozen; total_amount_cents pinned"
      - from: ISSUED
        to: PAID
        trigger: "POST /water-bills/{id}/payments"
        actor: Tenant | WaterAdmin
        preconditions:
          - "Bill.status IN {ISSUED, DISPUTED} (payment can also resolve a dispute)"
          - "After payment: amount_paid_cents >= total_amount_cents"
        side_effects:
          - "Bill.amount_paid_cents incremented"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /water-bills/{id}/dispute"
        actor: Tenant
        preconditions:
          - "Bill.status == ISSUED"
          - "Body.dispute_reason non-empty"
        side_effects:
          - "Bill.dispute_reason set"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /water-bills/{id}/dispute-resolve {outcome: REJECT}"
        actor: WaterAdmin
        preconditions:
          - "Bill.status == DISPUTED"
        side_effects: []
        note: "Cyclic shape: ISSUED → DISPUTED → ISSUED"
      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /water-bills/{id}/dispute-resolve {outcome: ACCEPT}"
        actor: WaterAdmin
        preconditions:
          - "Bill.status == DISPUTED"
        side_effects:
          - "Bill.total_amount_cents set to 0; amount_paid_cents preserved"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two operators simultaneously activate two IrrigationPlans whose windows overlap on the same plot"
    guarantee: "At most one plan can be ACTIVE per overlapping window per plot"
    error_id: ERR_PLAN_WINDOW_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on IrrigationPlan.status flip from DRAFT to ACTIVE for that plot"

  - scenario: "Operator dispatches two ControlCommands simultaneously against valve groups sharing the same pump_id whose dispatch_mode is SEQUENTIAL"
    guarantee: "Pump-and-valve interlock: only one SEQUENTIAL command per pump may be in {DISPATCHING, EXECUTING}"
    error_id: ERR_PUMP_INTERLOCK_BUSY
    http_status: 409
    serialization: "First-writer-wins on ControlCommand.status flip from PENDING to DISPATCHING for that pump"

  - scenario: "WaterAdmin approves and rejects the same quota override request simultaneously"
    guarantee: "Exactly one terminal approval decision per request"
    error_id: ERR_OVERRIDE_ALREADY_DECIDED
    http_status: 409
    serialization: "First-writer-wins on WaterQuota.approval_state transition out of PENDING_APPROVAL"

  - scenario: "Tenant disputes a bill while WaterAdmin records a payment for the same bill"
    guarantee: "Exactly one of {DISPUTED, PAID} wins on the same bill version"
    error_id: ERR_BILL_STATE_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on WaterBill.version; loser must reload"

  - scenario: "Two devices post EXECUTED feedback for the same ControlCommand (duplicate feedback)"
    guarantee: "Only the first feedback advances state; duplicate is rejected without re-debiting quota"
    error_id: ERR_FEEDBACK_ALREADY_RECORDED
    http_status: 409
    serialization: "First-writer-wins on ControlCommand.status flip from EXECUTING to EXECUTED"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: crop_water_demand
    trigger: "POST /plots/{plot_id}/irrigation-plans (creation, source=AUTO) and on Plot.crop_stage update"
    algorithm: forward_looking
    formula: |
      base = STAGE_BASE_LITERS_PER_HECTARE[crop_stage] * area_hectares
      moisture_adj = max(0, (TARGET_MOISTURE_PCT[crop_type] - latest_valid_moisture_reading_pct) / 100)
      weather_adj = max(0, (1 - latest_rainfall_mm / RAINFALL_OFFSET_MM))
      planned_volume_liters = round(base * (1 + moisture_adj) * weather_adj, 2)
    input_set: |
      latest_valid_moisture_reading_pct: most recent SensorReading where Sensor.sensor_type == SOIL_MOISTURE
        AND SensorReading.validity == VALID, ordered by reading_timestamp DESC, take 1; if none, default to 50.
      latest_rainfall_mm: most recent SensorReading where Sensor.sensor_type == WEATHER_STATION
        AND SensorReading.validity == VALID within last 24h; if none, default to 0.
    constants:
      STAGE_BASE_LITERS_PER_HECTARE:
        SEEDLING: 20000
        VEGETATIVE: 35000
        FLOWERING: 50000
        FRUITING: 45000
        MATURE: 25000
      TARGET_MOISTURE_PCT:
        WHEAT: 60
        CORN: 65
        RICE: 80
        COTTON: 55
        VEGETABLE: 70
      RAINFALL_OFFSET_MM: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: auto_planned
        when: "IrrigationPlan.source == AUTO"
        difference: "planned_volume_liters is the formula output above"
      - name: manual_override
        when: "IrrigationPlan.source == MANUAL_OVERRIDE"
        difference: "planned_volume_liters is taken verbatim from override request body, formula skipped; AuditLog records the original auto value vs override"

  - name: quota_consumption_provisional_vs_final
    trigger: "On ControlCommand state transitions and on GET /water-quotas/{id}"
    algorithm: aggregation
    formula: |
      effective_allocation = allocated_liters + carry_forward_liters + approval_extra_liters
      provisional_used_liters = sum(ControlCommand.requested_volume_liters
                                    where ControlCommand.plan_id IN plans for this plot
                                          AND ControlCommand.status IN {PENDING, DISPATCHING, EXECUTING}
                                          AND ControlCommand.created_at IN [period_start, period_end))
      final_used_liters = sum(ControlCommand.actual_volume_liters
                              where ControlCommand.status == EXECUTED
                                    AND ControlCommand.feedback_received_at IN [period_start, period_end))
      usage_state = OVER  if final_used_liters >= effective_allocation
                  | WARNING if final_used_liters / effective_allocation >= warning_threshold_pct/100
                  | UNDER  otherwise
    input_set: "All ControlCommands tied (via plan_id → IrrigationPlan.plot_id) to this plot, partitioned by status. OFFLINE_LOCAL counts as provisional until reconciled."
    constants: {}
    precision: "liters: 2 decimal places, round_half_up; percentages compared as floats with epsilon 1e-6"
    variants:
      - name: provisional
        when: "Used to project remaining headroom for plan activation guardrails (preconditions on activate/resume)"
        difference: "Includes in-flight ControlCommands at requested_volume_liters; over-counts vs final"
      - name: final
        when: "Used by usage_state and Alert thresholds; only EXECUTED contributes"
        difference: "Excludes in-flight commands; relies on reconciled actual_volume_liters; may differ from provisional even with identical inputs"

  - name: alert_severity_score
    trigger: "On Alert creation and on system: SensorReading ingest"
    algorithm: weighted_scoring
    formula: |
      score = (W_RULE[rule_code] * 1.0)
            + (W_SUBJECT[subject_type] * 1.0)
            + (W_RECENT_ABNORMAL * recent_abnormal_count_24h)
      severity = CRITICAL if score >= 6.0
               | WARN     if 3.0 <= score < 6.0
               | INFO     if score < 3.0
    input_set: |
      recent_abnormal_count_24h:
        - provisional_variant: count of SensorReading on this subject_id (or its sensors if subject_type=PLOT)
            where validity == OUT_OF_RANGE OR validity == ABNORMAL_FILTERED, within 24h, NOT YET archived
        - reconciled_variant: same count but only readings where archived == true (i.e., the archive sweep
            has been run; ABNORMAL_FILTERED readings drop out because the archival step removes them
            from the abnormal count)
    constants:
      W_RULE:
        SENSOR_OFFLINE: 2
        ABNORMAL_FLOW: 3
        PIPE_BURST_SUSPICION: 5
        VALVE_FAULT: 4
      W_SUBJECT:
        SENSOR: 1
        PLOT: 2
        VALVE_GROUP: 3
      W_RECENT_ABNORMAL: 0.5
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional_at_trigger
        when: "Alert created in real time before archival sweep runs"
        difference: "recent_abnormal_count_24h includes ABNORMAL_FILTERED readings; severity skews higher"
      - name: reconciled_post_archive
        when: "On GET /alerts/{id} after archival sweep ran"
        difference: "ABNORMAL_FILTERED readings have been archived and excluded from the 24h count; severity may downgrade"

  - name: tiered_water_fee
    trigger: "POST /water-bills (DRAFT creation) and on POST /water-bills/{id}/issue"
    algorithm: tiered_pricing
    formula: |
      # combinatorial mode (a): three inputs (peak_window_membership, tier, tenant_class) with non-linear interaction
      # Step 1 — partition usage into peak vs offpeak
      peak_liters    = sum of EXECUTED ControlCommand.actual_volume_liters whose feedback_received_at hour IN PEAK_HOURS
      offpeak_liters = sum of EXECUTED ControlCommand.actual_volume_liters whose feedback_received_at hour NOT IN PEAK_HOURS
      # Step 2 — apply tiered rates per window using inclusive-lower / exclusive-upper boundaries
      # Tier table TIERS: list of {upper_bound_liters, rate_cents_per_liter}; last tier upper_bound is +inf
      def compute_window(liters, rate_table, tenant_multiplier):
        remaining = liters
        prev_bound = 0
        for tier in rate_table:
          slab = min(remaining, tier.upper_bound_liters - prev_bound)
          line_amount = slab * tier.rate_cents_per_liter * tenant_multiplier
          # Step 3 — round PER LINE ITEM, not at the end (this is the pinned rounding order)
          line_items.append({tier_index, window, slab, rate, amount_cents = round_half_up(line_amount)})
          remaining -= slab
          prev_bound = tier.upper_bound_liters
          if remaining <= 0: break
      compute_window(peak_liters, PEAK_TIERS, tenant_multiplier)
      compute_window(offpeak_liters, OFFPEAK_TIERS, tenant_multiplier)
      total_amount_cents = sum(line_items[*].amount_cents)   # already-rounded per line
    input_set: "All ControlCommands with status==EXECUTED whose feedback_received_at IN [bill.period_start, bill.period_end), grouped by hour-of-day membership in PEAK_HOURS."
    constants:
      PEAK_HOURS: [6, 7, 8, 9, 18, 19, 20, 21]
      PEAK_TIERS:
        - { upper_bound_liters: 100000, rate_cents_per_liter: 30 }
        - { upper_bound_liters: 250000, rate_cents_per_liter: 50 }
        - { upper_bound_liters: 999999999, rate_cents_per_liter: 80 }
      OFFPEAK_TIERS:
        - { upper_bound_liters: 100000, rate_cents_per_liter: 18 }
        - { upper_bound_liters: 250000, rate_cents_per_liter: 30 }
        - { upper_bound_liters: 999999999, rate_cents_per_liter: 50 }
      TENANT_MULTIPLIER:
        ACTIVE: 1.0
        SUSPENDED: 1.25  # punitive fee multiplier for suspended tenants
    precision: "amount_cents: integer cents, round_half_up applied per LINE ITEM (not at sum)"
    variants:
      - name: per_line_rounded
        when: "Default — pinned rounding order"
        difference: "Each tier slab amount is rounded to whole cents before summing"

  - name: bill_total_settlement
    trigger: "POST /water-bills/{id}/issue and on POST /water-bills/{id}/payments and POST /water-bills/{id}/dispute-resolve"
    algorithm: aggregation
    formula: |
      # combinatorial mode (b): nested rounding where order matters; pinned ordering below
      # Step 1 — line_items already produced by tiered_water_fee with PER-LINE rounding
      raw_subtotal_cents = sum(line_items[*].amount_cents)        # integers; no rounding here
      # Step 2 — apply carry_forward credit (in liters, not cents) only AFTER per-line rounding
      carry_forward_credit_cents = round_half_up(
        carry_forward_liters * BLENDED_RATE_CENTS_PER_LITER
      )
      total_amount_cents = max(0, raw_subtotal_cents - carry_forward_credit_cents)
      balance_due_cents  = total_amount_cents - amount_paid_cents
    input_set: "Bill.line_items (frozen at ISSUE), Bill.amount_paid_cents (running), WaterQuota.carry_forward_liters (snapshotted at issue)."
    constants:
      BLENDED_RATE_CENTS_PER_LITER: 25
    precision: "integer cents; carry_forward_credit_cents rounded round_half_up; subtotal is integer sum so no further rounding"
    variants:
      - name: at_issue
        when: "Bill freezes line_items and computes total once"
        difference: "Snapshots carry_forward_liters at issue time and locks it"
      - name: at_dispute_credit
        when: "Dispute resolved with outcome=ACCEPT"
        difference: "total_amount_cents forced to 0; balance_due_cents may go negative if amount_paid_cents > 0 (refund owed, surfaced as negative balance)"

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all (except POST /_clock/advance, POST /_sweep/run, POST /_events/emit)"

  - priority: 2
    category: auth
    check: "X-User-Role permitted to call this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters resolve left-to-right; e.g., {plot_id} exists, then {plan_id} exists and belongs to that plot"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: state
    check: "ControlCommand operations: command in expected status for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /control-commands/{id}/dispatch, POST /control-commands/{id}/feedback"

  - priority: 5
    category: state
    check: "IrrigationPlan operations: plan in expected status for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /plots/{plot_id}/irrigation-plans/{id}/activate, /suspend, /resume, /override, DELETE /plots/{plot_id}/irrigation-plans/{id}"

  - priority: 6
    category: state
    check: "WaterBill in expected status for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /water-bills/{id}/issue, /payments, /dispute, /dispute-resolve"

  - priority: 7
    category: business_safety
    check: "Sensor sanity: SensorReading.value within Sensor.[min_valid_value, max_valid_value] OR validity is set to OUT_OF_RANGE on ingest (rejection-by-classification, not 4xx); but explicit override of poll_interval_seconds outside [30, 3600] is rejected"
    error_id: ERR_POLL_INTERVAL_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /sensors, PATCH /sensors/{id}"

  - priority: 8
    category: business_safety
    check: "Pump-and-valve interlock: dispatching a SEQUENTIAL ControlCommand while another command on the same pump_id is in {DISPATCHING, EXECUTING}"
    error_id: ERR_PUMP_INTERLOCK_BUSY
    http_status: 409
    applies_to: "POST /control-commands/{id}/dispatch"

  - priority: 9
    category: business_referential
    check: "ControlCommand.valve_group_id resolves AND ValveGroup.pump_id matches Plot.pump_id (via IrrigationPlan.plot_id)"
    error_id: ERR_VALVE_GROUP_PUMP_MISMATCH
    http_status: 422
    applies_to: "POST /control-commands"

  - priority: 10
    category: business_temporal
    check: "IrrigationPlan window must not overlap an existing ACTIVE/SUSPENDED plan on the same plot — half-open interval [start, end)"
    error_id: ERR_PLAN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /plots/{plot_id}/irrigation-plans, POST /plots/{plot_id}/irrigation-plans/{id}/activate"

  - priority: 11
    category: business_constraint
    check: "ValveGroup.control_mode = SEQUENTIAL implies max_parallel_valves == 1; valve_ids non-empty; max_parallel_valves >= 1"
    error_id: ERR_VALVE_GROUP_INVALID
    http_status: 422
    applies_to: "POST /valve-groups, PATCH /valve-groups/{id}"

  - priority: 12
    category: business_fiscal
    check: "Quota guard: ControlCommand creation must not cause WaterQuota.usage_state to flip to OVER unless approval_state == APPROVED"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /control-commands"

  - priority: 13
    category: business_fiscal
    check: "Override approval extra_liters in [1, allocated_liters * 0.5]"
    error_id: ERR_OVERRIDE_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /water-quotas/{id}/approve-override"

  - priority: 14
    category: business_temporal
    check: "WaterBill.period_end > period_start; WaterBill.period_start aligned to a quota period start for the same plot"
    error_id: ERR_BILL_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /water-bills"

  - priority: 15
    category: business_constraint
    check: "Body shape: required fields present and types match"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all body-bearing endpoints"

  - priority: 16
    category: business_constraint
    check: "OCC: if request includes version, it must match current entity.version"
    error_id: ERR_STALE_VERSION
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Tenants
  - method: POST
    path: "/tenants"
    description: "Create a tenant"
    roles: [PlatformAdmin]
    code: 201
    input: [name, contact_email]
    output: Tenant
    side_effects: []

  - method: GET
    path: "/tenants/{tenant_id}"
    description: "Read a tenant"
    roles: [PlatformAdmin, WaterAdmin, Operator, Tenant]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  # --- Plots
  - method: POST
    path: "/plots"
    description: "Create a plot"
    roles: [WaterAdmin]
    code: 201
    input: [tenant_id, name, area_hectares, crop_type, crop_stage, pump_id]
    output: Plot
    side_effects: []

  - method: GET
    path: "/plots/{plot_id}"
    description: "Read a plot"
    roles: [PlatformAdmin, WaterAdmin, Operator, Tenant]
    code: 200
    input: []
    output: Plot
    side_effects: []

  - method: PATCH
    path: "/plots/{plot_id}"
    description: "Update plot crop_stage / pump_id"
    roles: [WaterAdmin]
    code: 200
    input: ["crop_stage?", "pump_id?", "version?"]
    output: Plot
    side_effects: ["If crop_stage changed, future irrigation plans use the new stage in crop_water_demand"]

  - method: GET
    path: "/plots"
    description: "List plots; supports tenant_id filter; supports limit/offset"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: ["tenant_id?", "limit?", "offset?"]
    output: "Plot[]"
    side_effects: []

  # --- Sensors
  - method: POST
    path: "/sensors"
    description: "Register a sensor on a plot"
    roles: [WaterAdmin]
    code: 201
    input: [plot_id, sensor_type, poll_interval_seconds, min_valid_value, max_valid_value]
    output: Sensor
    side_effects: []

  - method: PATCH
    path: "/sensors/{sensor_id}"
    description: "Update sensor poll interval / valid range"
    roles: [WaterAdmin]
    code: 200
    input: ["poll_interval_seconds?", "min_valid_value?", "max_valid_value?", "status?", "version?"]
    output: Sensor
    side_effects: ["If status flips ONLINE → OFFLINE: emit Alert{rule_code=SENSOR_OFFLINE, subject_type=SENSOR}"]

  - method: GET
    path: "/sensors/{sensor_id}"
    description: "Read sensor"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: []
    output: Sensor
    side_effects: []

  # --- SensorReadings
  - method: POST
    path: "/sensors/{sensor_id}/readings"
    description: "Ingest a sensor reading; classifies validity"
    roles: [DeviceAgent, WaterAdmin]
    code: 201
    input: [value, reading_timestamp]
    output: SensorReading
    side_effects:
      - "Classify validity: VALID if min<=value<=max, else OUT_OF_RANGE"
      - "If three consecutive OUT_OF_RANGE for same sensor: classify ABNORMAL_FILTERED and emit Alert{rule_code=ABNORMAL_FLOW, subject_type=SENSOR}"
      - "Update Sensor.last_reading_at"

  - method: GET
    path: "/sensors/{sensor_id}/readings"
    description: "List readings; supports limit/offset; include_archived flag"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: ["include_archived?", "limit?", "offset?"]
    output: "SensorReading[]"
    side_effects: []

  # --- IrrigationPlans
  - method: POST
    path: "/plots/{plot_id}/irrigation-plans"
    description: "Create irrigation plan; computes planned_volume_liters via crop_water_demand"
    roles: [Operator, WaterAdmin]
    code: 201
    input: ["window_start", "window_end", "source?", "planned_volume_liters?"]
    output: IrrigationPlan
    side_effects: ["plan_version = 1 (or parent.version+1 if from override path)"]

  - method: POST
    path: "/plots/{plot_id}/irrigation-plans/{plan_id}/activate"
    description: "Activate a DRAFT plan"
    roles: [Operator, WaterAdmin]
    code: 200
    input: []
    output: IrrigationPlan
    side_effects: ["DRAFT → ACTIVE; reservation against WaterQuota"]

  - method: POST
    path: "/plots/{plot_id}/irrigation-plans/{plan_id}/suspend"
    description: "Suspend an ACTIVE plan"
    roles: [Operator, WaterAdmin]
    code: 200
    input: []
    output: IrrigationPlan
    side_effects: ["ACTIVE → SUSPENDED; release in-flight ControlCommands"]

  - method: POST
    path: "/plots/{plot_id}/irrigation-plans/{plan_id}/resume"
    description: "Resume a SUSPENDED plan"
    roles: [Operator, WaterAdmin]
    code: 200
    input: []
    output: IrrigationPlan
    side_effects: ["SUSPENDED → ACTIVE"]

  - method: POST
    path: "/plots/{plot_id}/irrigation-plans/{plan_id}/override"
    description: "Manual override of an ACTIVE plan; creates a revision (cycle)"
    roles: [WaterAdmin]
    code: 201
    input: ["planned_volume_liters?", "window_start?", "window_end?"]
    output: IrrigationPlan
    side_effects:
      - "Original ACTIVE → DRAFT (cycle)"
      - "New IrrigationPlan with parent_plan_id, plan_version+1, source=MANUAL_OVERRIDE, status=DRAFT"
      - "AuditLog{action_type=PLAN_OVERRIDDEN}"

  - method: DELETE
    path: "/plots/{plot_id}/irrigation-plans/{plan_id}"
    description: "Cancel a DRAFT plan"
    roles: [Operator, WaterAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["DRAFT → CANCELLED"]

  - method: GET
    path: "/plots/{plot_id}/irrigation-plans"
    description: "List plans for a plot"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IrrigationPlan[]"
    side_effects: []

  # --- ValveGroups
  - method: POST
    path: "/valve-groups"
    description: "Configure a valve group"
    roles: [WaterAdmin]
    code: 201
    input: [tenant_id, name, pump_id, valve_ids, control_mode, max_parallel_valves]
    output: ValveGroup
    side_effects: []

  - method: PATCH
    path: "/valve-groups/{valve_group_id}"
    description: "Update valve group"
    roles: [WaterAdmin]
    code: 200
    input: ["name?", "valve_ids?", "control_mode?", "max_parallel_valves?", "version?"]
    output: ValveGroup
    side_effects: []

  - method: GET
    path: "/valve-groups/{valve_group_id}"
    description: "Read valve group"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: []
    output: ValveGroup
    side_effects: []

  # --- ControlCommands
  - method: POST
    path: "/control-commands"
    description: "Create a ControlCommand for an ACTIVE plan; status=PENDING"
    roles: [Operator, WaterAdmin]
    code: 201
    input: [plan_id, valve_group_id, requested_volume_liters]
    output: ControlCommand
    side_effects:
      - "Reserve requested_volume_liters against WaterQuota.provisional_used_liters"
      - "Quota guard validation"

  - method: POST
    path: "/control-commands/{command_id}/dispatch"
    description: "Issue dispatch; PENDING → DISPATCHING (or OFFLINE_LOCAL if X-Device-Mode: OFFLINE)"
    roles: [Operator, WaterAdmin]
    code: 200
    input: []
    output: ControlCommand
    side_effects: ["AuditLog{CONTROL_COMMAND_ISSUED}; pump-and-valve interlock check"]

  - method: POST
    path: "/control-commands/{command_id}/feedback"
    description: "Device feedback; advances state"
    roles: [DeviceAgent, WaterAdmin]
    code: 200
    input: ["phase", "actual_volume_liters?", "failure_reason?"]
    output: ControlCommand
    side_effects:
      - "phase=STARTED: DISPATCHING → EXECUTING"
      - "phase=COMPLETED: EXECUTING|OFFLINE_LOCAL → EXECUTED; debit WaterQuota.final_used_liters; recompute usage_state; cascade Alerts; update Plot.last_irrigated_at"
      - "phase=ERROR: → FAILED; release reservation; AuditLog{CONTROL_COMMAND_FAILED}; possibly emit Alert{VALVE_FAULT}"

  - method: GET
    path: "/control-commands/{command_id}"
    description: "Read command"
    roles: [PlatformAdmin, WaterAdmin, Operator, DeviceAgent]
    code: 200
    input: []
    output: ControlCommand
    side_effects: []

  - method: GET
    path: "/control-commands"
    description: "List commands; filterable by plan_id, status"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: "ControlCommand[]"
    side_effects: []

  # --- WaterQuotas
  - method: POST
    path: "/water-quotas"
    description: "Allocate quota for a plot/period; computes carry_forward_liters from prior period"
    roles: [WaterAdmin]
    code: 201
    input: ["plot_id", "period_start", "period_end", "allocated_liters", "warning_threshold_pct?"]
    output: WaterQuota
    side_effects:
      - "carry_forward_liters = min(prior_period.unused_liters, prior_period.allocated_liters * 0.20); 0 if no prior period"
      - "AuditLog{QUOTA_ALLOCATED}"

  - method: PATCH
    path: "/water-quotas/{quota_id}"
    description: "Reallocate quota (allocated_liters or warning_threshold_pct)"
    roles: [WaterAdmin]
    code: 200
    input: ["allocated_liters?", "warning_threshold_pct?", "version?"]
    output: WaterQuota
    side_effects: ["Recompute usage_state; may move WARNING → UNDER"]

  - method: POST
    path: "/water-quotas/{quota_id}/request-override"
    description: "Operator requests over-quota approval"
    roles: [Operator]
    code: 200
    input: [reason]
    output: WaterQuota
    side_effects: ["approval_state NOT_REQUIRED → PENDING_APPROVAL"]

  - method: POST
    path: "/water-quotas/{quota_id}/approve-override"
    description: "WaterAdmin grants approval_extra_liters"
    roles: [WaterAdmin]
    code: 200
    input: [extra_liters]
    output: WaterQuota
    side_effects:
      - "approval_state PENDING_APPROVAL → APPROVED; approval_extra_liters set"
      - "Recompute usage_state (may flip OVER → WARNING)"
      - "AuditLog{QUOTA_OVERRIDE_APPROVED}"

  - method: POST
    path: "/water-quotas/{quota_id}/reject-override"
    description: "WaterAdmin rejects override"
    roles: [WaterAdmin]
    code: 200
    input: ["reason?"]
    output: WaterQuota
    side_effects: ["approval_state PENDING_APPROVAL → REJECTED; AuditLog{QUOTA_OVERRIDE_REJECTED}"]

  - method: GET
    path: "/water-quotas/{quota_id}"
    description: "Read quota; reflects parallel usage_state and approval_state"
    roles: [PlatformAdmin, WaterAdmin, Operator, Tenant]
    code: 200
    input: []
    output: WaterQuota
    side_effects: []

  - method: GET
    path: "/water-quotas"
    description: "List quotas; filter by plot_id, period overlap"
    roles: [PlatformAdmin, WaterAdmin, Operator, Tenant]
    code: 200
    input: ["plot_id?", "limit?", "offset?"]
    output: "WaterQuota[]"
    side_effects: []

  # --- Alerts
  - method: GET
    path: "/alerts/{alert_id}"
    description: "Read alert; severity recomputed at read with reconciled variant"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: POST
    path: "/alerts/{alert_id}/acknowledge"
    description: "Acknowledge alert"
    roles: [Operator, WaterAdmin]
    code: 200
    input: []
    output: Alert
    side_effects: ["TRIGGERED|REOPENED → ACKNOWLEDGED; acknowledged_by = X-User-ID"]

  - method: POST
    path: "/alerts/{alert_id}/resolve"
    description: "Resolve alert"
    roles: [Operator, WaterAdmin]
    code: 200
    input: []
    output: Alert
    side_effects: ["ACKNOWLEDGED → RESOLVED; resolved_by = X-User-ID"]

  - method: GET
    path: "/alerts"
    description: "List alerts; filter by status, severity, subject_type"
    roles: [PlatformAdmin, WaterAdmin, Operator]
    code: 200
    input: ["status?", "severity?", "subject_type?", "limit?", "offset?"]
    output: "Alert[]"
    side_effects: []

  # --- WaterBills
  - method: POST
    path: "/water-bills"
    description: "Create draft bill for plot/period; runs tiered_water_fee then bill_total_settlement"
    roles: [WaterAdmin]
    code: 201
    input: [tenant_id, plot_id, period_start, period_end]
    output: WaterBill
    side_effects: ["line_items computed (per-line rounding); total computed via bill_total_settlement"]

  - method: POST
    path: "/water-bills/{bill_id}/issue"
    description: "Issue bill; freezes line_items"
    roles: [WaterAdmin]
    code: 200
    input: []
    output: WaterBill
    side_effects: ["DRAFT → ISSUED"]

  - method: POST
    path: "/water-bills/{bill_id}/payments"
    description: "Record payment"
    roles: [WaterAdmin, Tenant]
    code: 200
    input: [amount_cents]
    output: WaterBill
    side_effects: ["amount_paid_cents += amount_cents; if >= total_amount_cents, status → PAID"]

  - method: POST
    path: "/water-bills/{bill_id}/dispute"
    description: "Tenant disputes a bill"
    roles: [Tenant]
    code: 200
    input: [dispute_reason]
    output: WaterBill
    side_effects: ["ISSUED → DISPUTED"]

  - method: POST
    path: "/water-bills/{bill_id}/dispute-resolve"
    description: "Admin resolves dispute (REJECT or ACCEPT)"
    roles: [WaterAdmin]
    code: 200
    input: [outcome]
    output: WaterBill
    side_effects:
      - "outcome=REJECT: DISPUTED → ISSUED (cycle)"
      - "outcome=ACCEPT: DISPUTED → CANCELLED; total_amount_cents := 0"

  - method: GET
    path: "/water-bills/{bill_id}"
    description: "Read bill"
    roles: [PlatformAdmin, WaterAdmin, Tenant]
    code: 200
    input: []
    output: WaterBill
    side_effects: []

  - method: GET
    path: "/water-bills"
    description: "List bills"
    roles: [PlatformAdmin, WaterAdmin, Tenant]
    code: 200
    input: ["tenant_id?", "plot_id?", "status?", "limit?", "offset?"]
    output: "WaterBill[]"
    side_effects: []

  # --- Audit logs
  - method: GET
    path: "/audit-logs"
    description: "List audit logs; filter by subject_type, action_type, time window"
    roles: [PlatformAdmin, WaterAdmin]
    code: 200
    input: ["subject_type?", "action_type?", "since?", "until?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- Test-driving endpoints (required by §1.5 testability-completeness)
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock; triggers time-gated auto-transitions (e.g., IrrigationPlan COMPLETED, Alert REOPENED window expiry)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Re-evaluate IrrigationPlan time-gated transitions (ACTIVE → COMPLETED if now() >= window_end and no in-flight commands)"
      - "Re-evaluate Alert REOPENED expiry (24h since RESOLVED.updated_at)"

  - method: POST
    path: "/_sweep/run"
    description: "Run archival sweep over SensorReadings older than 24h or classified ABNORMAL_FILTERED; sets archived=true; recomputes alert_severity_score reconciled variant"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "SensorReading.archived = true for matching readings"
      - "Alert.severity recomputed at next read"

  - method: POST
    path: "/_events/emit"
    description: "Emit external event (weather service / payment / IoT device management) for synchronization"
    roles: [PlatformAdmin]
    code: 200
    input: [event_type, payload]
    output: null
    side_effects:
      - "event_type=WEATHER_RAINFALL: cached rainfall_mm updated (used by crop_water_demand)"
      - "event_type=DEVICE_OFFLINE: target Sensor.status → OFFLINE; emit Alert{SENSOR_OFFLINE}"
      - "event_type=PAYMENT_CONFIRMED: equivalent to POST /water-bills/{id}/payments"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role header missing/blank"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Caller's role not permitted for this endpoint per RBAC matrix"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameterized resource does not exist (validated left-to-right)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in expected status for the requested transition"

  - id: ERR_VALIDATION
    http: 400
    condition: "Generic body shape / type / required-field validation failure"

  - id: ERR_STALE_VERSION
    http: 409
    condition: "OCC: request.version does not match entity.version"

  - id: ERR_POLL_INTERVAL_OUT_OF_RANGE
    http: 422
    condition: "Sensor.poll_interval_seconds outside [30, 3600]"

  - id: ERR_VALVE_GROUP_INVALID
    http: 422
    condition: "ValveGroup definition violates SEQUENTIAL→max_parallel_valves==1 rule, empty valve_ids, or max_parallel_valves<1"

  - id: ERR_VALVE_GROUP_PUMP_MISMATCH
    http: 422
    condition: "ControlCommand's ValveGroup.pump_id does not match the Plot.pump_id"

  - id: ERR_PUMP_INTERLOCK_BUSY
    http: 409
    condition: "Pump-and-valve interlock: pump already serving a SEQUENTIAL command in {DISPATCHING, EXECUTING}"

  - id: ERR_PLAN_WINDOW_OVERLAP
    http: 409
    condition: "IrrigationPlan window collides with another ACTIVE/SUSPENDED plan on the same plot (half-open intervals)"

  - id: ERR_QUOTA_EXCEEDED
    http: 422
    condition: "ControlCommand creation would push WaterQuota.usage_state to OVER without an APPROVED override"

  - id: ERR_OVERRIDE_AMOUNT_INVALID
    http: 422
    condition: "Approve-override extra_liters not in (0, allocated_liters * 0.5]"

  - id: ERR_OVERRIDE_ALREADY_DECIDED
    http: 409
    condition: "Quota override already in APPROVED or REJECTED; second decision rejected"

  - id: ERR_FEEDBACK_ALREADY_RECORDED
    http: 409
    condition: "Duplicate ControlCommand feedback; command already in terminal state"

  - id: ERR_BILL_PERIOD_INVALID
    http: 422
    condition: "Bill period_end <= period_start, or period_start not aligned to a quota period for the plot"

  - id: ERR_BILL_STATE_CONFLICT
    http: 409
    condition: "Concurrent dispute and payment race resolved by version conflict"

  - id: ERR_PRECONDITION_NOT_MET
    http: 422
    condition: "Activate plan: plot has no ONLINE sensor, or no covering quota for the window"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the platform itself; provisions tenants and runs test-driving endpoints"
    identity: "opaque"
    exclusive_operations:
      - "POST /tenants"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /_events/emit"
    shared_operations:
      - "GET on all read endpoints"

  - name: WaterAdmin
    description: "Operates water resources for one or more tenants; allocates quota, configures valve groups, settles bills, can override anything an Operator can do (hierarchical override)"
    identity: "opaque"
    exclusive_operations:
      - "POST /plots"
      - "POST /sensors"
      - "PATCH /sensors/{sensor_id}"
      - "POST /valve-groups"
      - "PATCH /valve-groups/{valve_group_id}"
      - "POST /water-quotas"
      - "PATCH /water-quotas/{quota_id}"
      - "POST /water-quotas/{quota_id}/approve-override"
      - "POST /water-quotas/{quota_id}/reject-override"
      - "POST /water-bills"
      - "POST /water-bills/{bill_id}/issue"
      - "POST /water-bills/{bill_id}/dispute-resolve"
      - "POST /plots/{plot_id}/irrigation-plans/{plan_id}/override"
      - "PATCH /plots/{plot_id}"
    shared_operations:
      - "All Operator endpoints"
      - "GET reads"
      - "POST /water-bills/{bill_id}/payments"
      - "POST /sensors/{sensor_id}/readings"
      - "POST /control-commands/{command_id}/feedback"

  - name: Operator
    description: "Day-to-day field user; creates plans, dispatches commands, acknowledges/resolves alerts; cannot allocate quota or settle bills"
    identity: "opaque"
    exclusive_operations:
      - "POST /water-quotas/{quota_id}/request-override"
    shared_operations:
      - "POST /plots/{plot_id}/irrigation-plans"
      - "POST /plots/{plot_id}/irrigation-plans/{plan_id}/activate"
      - "POST /plots/{plot_id}/irrigation-plans/{plan_id}/suspend"
      - "POST /plots/{plot_id}/irrigation-plans/{plan_id}/resume"
      - "DELETE /plots/{plot_id}/irrigation-plans/{plan_id}"
      - "POST /control-commands"
      - "POST /control-commands/{command_id}/dispatch"
      - "POST /alerts/{alert_id}/acknowledge"
      - "POST /alerts/{alert_id}/resolve"
      - "GET reads scoped to operator's tenant"

  - name: DeviceAgent
    description: "Field IoT device or gateway posting sensor readings and control feedback"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /sensors/{sensor_id}/readings"
      - "POST /control-commands/{command_id}/feedback"
      - "GET /control-commands/{command_id}"

  - name: Tenant
    description: "End customer; views their own plots/quotas/bills, pays bills, opens disputes"
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /water-bills/{bill_id}/dispute"
    shared_operations:
      - "GET /tenants/{tenant_id} where tenant_id == X-User-ID"
      - "GET /plots, GET /plots/{plot_id} scoped to own tenant"
      - "GET /water-quotas, GET /water-quotas/{quota_id} scoped to own tenant"
      - "GET /water-bills, GET /water-bills/{bill_id} scoped to own tenant"
      - "POST /water-bills/{bill_id}/payments"
