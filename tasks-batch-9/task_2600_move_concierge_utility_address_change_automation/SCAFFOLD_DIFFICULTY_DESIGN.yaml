            - "MoveRecord.${mv_1_id}.readiness_score is not required to change, but MoveRecord.${mv_2_id}.readiness_score == 70 and its lifecycle_status == SCHEDULING"

      - name: handoff_void_restores_zero_deposit_liability
        grounds:
          - state_machines.UtilityOrder.SCHEDULED_to_PROVISION_FAILED
          - state_machines.CreditCheckHandoff.OPEN_HANDOFF_to_VOIDED
          - state_machines.UtilityOrder.OPEN_CREDIT_to_VOIDED
          - "entities.UtilityOrder.fields.deposit_amount_cents"
        distinguishing_aspect: |
          A THIRD conserved quantity: open_deposit_liability_cents(move), the sum of deposit_amount_cents
          over orders whose credit_status is DEPOSIT_DUE. A DEPOSIT_DUE order raises it to 18000; a
          provider-reported provision failure voids the credit dimension and its handoff, which must
          return the liability to exactly 0 while RETAINING the historical deposit_amount_cents 18000 and
          leaving deposit_paid_cents 0 — the compensation cancels the obligation without erasing the
          record of it, and a late payment attempt is then refused.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "ELECTRIC provider with deposit_policy CREDIT_SCORE_BASED, credit_check_required true, scheduling_lead_days 3, covering 30302."
            - "Move for 2026-08-20 verified with UTILITY_SETUP consent and mapped to ELECTRIC (deposit_estimate_cents 22500)."
            - "The credit check is raised BEFORE scheduling, so readiness_snapshot freezes at 40 and the 639 bureau answer yields deposit_amount_cents = round_half_up(15000 * 1.00 * 1.20) = 18000 with credit_status DEPOSIT_DUE."
            - "The order is then scheduled for 2026-08-20T09:00:00Z..13:00:00Z, which is legal because the credit dimension does not gate scheduling."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /utility-providers"
              payload: { name: "Georgia Metro Electric", utility_type: "ELECTRIC", required_account_fields: ["account_holder_name", "service_start_date"], deposit_policy: "CREDIT_SCORE_BASED", credit_check_required: true, scheduling_lead_days: 3 }
              as: PlatformAdmin
              captures: { prov_e_id: $.data.id }
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_e_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-01-01", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
              captures: { terr_e_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "PM_FEED", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { cs_util_id: $.data.id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "KBA" }
              as: MoveOpsAgent
              captures: { idv_id: $.data.id }
            - call: "POST /identity-verifications/${idv_id}/kba-result"
              payload: { outcome: "PASSED", score: 720 }
              as: ExternalServiceGateway
            - call: "POST /moves/${mv_id}/provider-mapping"
              payload: { utility_types: ["ELECTRIC"] }
              as: MoveOpsAgent
            - call: "GET /utility-orders"
              payload: { move_id: "${mv_id}", utility_type: "ELECTRIC" }
              as: MoveOpsAgent
              captures: { uo_e_id: "$.data[0].id" }
            - call: "POST /utility-orders/${uo_e_id}/credit-checks"
              payload: { bureau: "EXPERIAN" }
              as: MoveOpsAgent
              captures: { cch_id: $.data.id }
            - call: "POST /credit-check-handoffs/${cch_id}/bureau-response"
              payload: { score: 639 }
              as: ExternalServiceGateway
            - call: "POST /utility-orders/${uo_e_id}/schedule"
              payload: { requested_service_date: "2026-08-20", scheduled_window_start: "2026-08-20T09:00:00Z", scheduled_window_end: "2026-08-20T13:00:00Z", account_data: { account_holder_name: "Dana Ruiz", service_start_date: "2026-08-20" } }
              as: MoveOpsAgent
          trigger:
            - call: "POST /utility-orders/${uo_e_id}/provision-failure"
              payload: { failure_reason: "Meter not accessible at the premises" }
              as: ProviderAgent
              as_user_id: "${prov_e_id}"
            - call: "POST /utility-orders/${uo_e_id}/deposit-payments"
              payload: { amount_cents: 18000 }
              as: MoveOpsAgent
          assert:
            - "before the trigger: UtilityOrder.${uo_e_id}.readiness_snapshot == 40, deposit_amount_cents == 18000, credit_status == DEPOSIT_DUE, provision_status == SCHEDULED, so open_deposit_liability_cents(${mv_id}) == 18000"
            - "trigger call 1 returns HTTP 200 with provision_status == PROVISION_FAILED and failure_reason == Meter not accessible at the premises"
            - "compensation: UtilityOrder.${uo_e_id}.credit_status == VOIDED and CreditCheckHandoff.${cch_id}.handoff_status == VOIDED"
            - "open_deposit_liability_cents(${mv_id}) == 0 after trigger call 1 (no order remains in DEPOSIT_DUE)"
            - "history retained: UtilityOrder.${uo_e_id}.deposit_amount_cents == 18000, deposit_paid_cents == 0, deposit_estimate_cents == 22500, and CreditCheckHandoff.${cch_id}.score == 639 with result == DEPOSIT_REQUIRED"
            - "the occupancy window is released too: scheduled_window_start == null and scheduled_window_end == null"
            - "trigger call 2 returns HTTP 409 with error_id == ERR_ORDER_NOT_SCHEDULABLE (a voided credit dimension cannot accept a late deposit)"
            - "MoveRecord.${mv_id}.lifecycle_status == ATTENTION_REQUIRED with blocked_reason == PROVISION_FAILED and readiness_score == 40"
