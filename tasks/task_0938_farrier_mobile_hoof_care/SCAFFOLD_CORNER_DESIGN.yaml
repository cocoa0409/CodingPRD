        distinguishing_aspect: "reactivate is declared only from INACTIVE; a DECERTIFIED farrier must go through recertify, so reactivate returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE farrier stood down with reason CERT_EXPIRED."]
          setup_api_calls:
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
