            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T09:30:00Z", scheduled_end_utc: "2026-06-10T09:45:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { c3_id: $.data.id }
            - call: "POST /consults/${c3_id}/no-show"
