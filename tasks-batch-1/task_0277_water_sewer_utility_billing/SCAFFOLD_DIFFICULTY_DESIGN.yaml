# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Water & Sewer Utility Billing (task_0277)
#
# Canonical rate schedule reused by most instances (all cents):
#   fixed_water_charge_cents=1200, fixed_sewer_charge_cents=800
#   water_tiers = [{up_to_gallons:5000, rate:300}, {up_to_gallons:15000, rate:500}, {up_to_gallons:null, rate:800}] (per kgal, marginal)
#   sewer_rate_cents_per_kgal=600, sewer_ratio_pct=90, sewer_cap_gallons=null (uncapped)
#   assistance_discount_pct=25, leak_adjustment_rate_pct=50
#   arrears_shutoff_threshold_cents=7500, reconnect_fee_cents=5000, late_fee_pct=5
# Canonical consumption: potable=12000 (read 0 -> 12000), irrigation=8000 (read 0 -> 8000), total=20000.
#   water_volumetric_cents=10500 ; sewer billable=10800 -> sewer_volumetric_cents=6480
#   fixed_charge_cents=2000 ; amount_billed_cents=18980
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: budget_billing_estimate_vs_chronological_trueup
        grounds:
          - calculations.budget_billing_amount_and_trueup
          - state_machines.Bill.DRAFT_to_POSTED
          - entities.BudgetBillingPlan.fields.trued_up_delta_cents
        distinguishing_aspect: |
          The forward-estimate variant charges Bill.total_cents = flat monthly_amount_cents (10000),
          while the chronological true-up variant accumulates ACTUAL amount_billed_cents
          (18980 + 7240 = 26220) over the same two bills and yields trued_up_delta_cents == 6220 —
          same input bills, two different numbers. This dual-variant lives on the BudgetBillingPlan domain.
        test_recipe:
          setup:
            - "Account on ACTIVE BudgetBillingPlan (monthly_amount_cents=10000); two bills posted with actual amount_billed 18980 and 7240; clock advanced past both."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res 2026", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 St" }
              as: BillingClerk
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P1" }
              as: BillingClerk
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "IRRIGATION", serial: "I1" }
              as: BillingClerk
              captures: { mi_id: $.data.id }
            - call: "POST /accounts/${acct_id}/budget-billing-plans"
              payload: { monthly_amount_cents: 10000, expected_account_version: "${acct_v0}" }
              as: BillingClerk
              captures: { plan_id: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc1_id: $.data.id }
            - call: "POST /meters/${mp_id}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp_id}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi_id}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi_id}/reads"
              payload: { reading_gallons: 8000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc1_id}" }
              as: BillingClerk
              captures: { bill1_id: $.data.id, bill1_actual: $.data.amount_billed_cents }
            - call: "POST /bills/${bill1_id}/post"
              payload: {}
              as: BillingClerk
            - call: "POST /billing-cycles"
              payload: { label: "2026-02", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", due_date: "2026-03-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc2_id: $.data.id }
            - call: "POST /meters/${mp_id}/reads"
              payload: { reading_gallons: 18000, read_date: "2026-02-28T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc2_id}" }
              as: BillingClerk
              captures: { bill2_id: $.data.id, bill2_actual: $.data.amount_billed_cents }
            - call: "POST /bills/${bill2_id}/post"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /budget-billing-plans/${plan_id}/true-up"
              payload: {}
              as: BillingClerk
              captures: { delta: $.data.trued_up_delta_cents }
          assert:
            - "Bill.${bill1_id}.amount_billed_cents == 18980"
            - "Bill.${bill1_id}.total_cents == 10000"
            - "Bill.${bill2_id}.amount_billed_cents == 7240"
            - "Bill.${bill2_id}.total_cents == 10000"
            - "BudgetBillingPlan.${plan_id}.trued_up_delta_cents == 6220"

      - name: sewer_ratio_uncapped_vs_winter_capped
        grounds:
          - calculations.sewer_volumetric
          - entities.RateSchedule.fields.sewer_cap_gallons
          - entities.Bill.fields.billable_sewer_gallons
        distinguishing_aspect: |
          With identical potable=12000 and sewer_ratio_pct=90, the uncapped variant bills
          sewer_volumetric_cents=6480 (billable 10800 gal) while the winter-capped variant
          (sewer_cap_gallons=8000) bills sewer_volumetric_cents=4800 (billable 8000 gal) — same
          potable input, two different sewer numbers across two RateSchedule configs.
        test_recipe:
          setup:
            - "Two accounts on two rate schedules differing only in sewer_cap_gallons (null vs 8000); each with potable consumption 12000 in the cycle."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Uncapped", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_unc: $.data.id }
            - call: "POST /rate-schedules"
              payload: { name: "Capped", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90, sewer_cap_gallons: 8000 }
              as: BillingClerk
              captures: { rs_cap: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_unc}", holder_name: "U", service_address: "2 St" }
              as: BillingClerk
              captures: { acct_u: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_cap}", holder_name: "C", service_address: "3 St" }
              as: BillingClerk
              captures: { acct_c: $.data.id }
            - call: "POST /accounts/${acct_u}/meters"
              payload: { meter_type: "POTABLE", serial: "PU" }
              as: BillingClerk
              captures: { mpu: $.data.id }
            - call: "POST /accounts/${acct_c}/meters"
              payload: { meter_type: "POTABLE", serial: "PC" }
              as: BillingClerk
              captures: { mpc: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc_id: $.data.id }
            - call: "POST /meters/${mpu}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mpu}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mpc}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mpc}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_u}", billing_cycle_id: "${cyc_id}" }
              as: BillingClerk
              captures: { bill_u: $.data.id }
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_c}", billing_cycle_id: "${cyc_id}" }
              as: BillingClerk
              captures: { bill_c: $.data.id }
          assert:
            - "Bill.${bill_u}.billable_sewer_gallons == 10800"
            - "Bill.${bill_u}.sewer_volumetric_cents == 6480"
            - "Bill.${bill_c}.billable_sewer_gallons == 8000"
            - "Bill.${bill_c}.sewer_volumetric_cents == 4800"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_marginal_water_three_tiers_mode_a
        grounds:
          - calculations.tiered_water_volumetric
          - entities.RateSchedule.fields.water_tiers
          - entities.Bill.fields.water_volumetric_cents
        distinguishing_aspect: |
          Mode (a): tiered-rate selection with >=3 inputs (total gallons spanning three marginal
          tiers, each with a distinct rate). Total=20000 spans tier1(5000@300)+tier2(10000@500)+
          tier3(5000@800) = 1500+5000+4000 = 10500 cents; a flat-rate misread produces a different number.
        test_recipe:
          setup:
            - "Account with potable 12000 + irrigation 8000 = 20000 total gallons in the cycle."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "4 St" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "IRRIGATION", serial: "I" }
              as: BillingClerk
              captures: { mi: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
              payload: { reading_gallons: 8000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill: $.data.id }
          assert:
            - "Bill.${bill}.potable_consumption_gallons == 12000"
            - "Bill.${bill}.irrigation_consumption_gallons == 8000"
            - "Bill.${bill}.water_volumetric_cents == 10500"

      - name: budget_trueup_chronological_circular_eval_mode_c
        grounds:
          - calculations.budget_billing_amount_and_trueup
          - calculations.account_balance_reconciliation
          - entities.BudgetBillingPlan.fields.trued_up_delta_cents
        distinguishing_aspect: |
          Mode (c): evaluation-order pinning. trued_up_delta_cents depends on actual_to_date
          (sum of amount_billed across bills) AND installments_to_date (= cycles_elapsed * monthly_amount),
          where cycles_elapsed is itself bumped by each POST; the scaffold pins that amount_billed is
          computed at generation, total_cents installments are pinned at POST, and the delta is evaluated
          last on true-up over created_at-ASC order — making 6220 well-defined rather than order-ambiguous.
        test_recipe:
          setup:
            - "Same as budget_billing_estimate_vs_chronological_trueup: ACTIVE plan (10000), two posted bills (18980, 7240)."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "5 St" }
              as: BillingClerk
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "IRRIGATION", serial: "I" }
              as: BillingClerk
              captures: { mi: $.data.id }
            - call: "POST /accounts/${acct_id}/budget-billing-plans"
              payload: { monthly_amount_cents: 10000, expected_account_version: "${acct_v0}" }
              as: BillingClerk
              captures: { plan_id: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc1: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
              payload: { reading_gallons: 8000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc1}" }
              as: BillingClerk
              captures: { bill1: $.data.id }
            - call: "POST /bills/${bill1}/post"
              payload: {}
              as: BillingClerk
            - call: "POST /billing-cycles"
              payload: { label: "2026-02", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", due_date: "2026-03-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc2: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 18000, read_date: "2026-02-28T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc2}" }
              as: BillingClerk
              captures: { bill2: $.data.id }
            - call: "POST /bills/${bill2}/post"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /budget-billing-plans/${plan_id}/true-up"
              payload: {}
              as: BillingClerk
              captures: { delta: $.data.trued_up_delta_cents, ce: $.data.cycles_elapsed }
          assert:
            - "BudgetBillingPlan.${plan_id}.cycles_elapsed == 2"
            - "BudgetBillingPlan.${plan_id}.trued_up_delta_cents == 6220"
            - "BudgetBillingPlan.${plan_id}.status == TRUED_UP"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_parallel_billing_and_service_axes
        grounds:
          - state_machines.Account.PAST_DUE_to_SHUTOFF_PENDING
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - entities.Account.fields.service_status
        distinguishing_aspect: |
          Account carries TWO independent state dimensions: billing_status (CURRENT/PAST_DUE/
          SHUTOFF_PENDING) and service_status (ACTIVE/SUSPENDED/RESTORED). Scheduling a shutoff
          moves billing_status to SHUTOFF_PENDING while service_status stays ACTIVE; only execute
          moves service_status to SUSPENDED — parallel axes evolving independently on one entity.
        test_recipe:
          setup:
            - "Account PAST_DUE with past_due 19929 (one posted bill 18980 + late fee 949), clock 2026-03-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: BillingClerk
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "6 St" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "IRRIGATION", serial: "I" }
              as: BillingClerk
              captures: { mi: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
              payload: { reading_gallons: 8000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/post"
              payload: {}
              as: BillingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /billing-cycles/${cyc}/close"
              payload: {}
              as: BillingClerk
            - call: "POST /shutoff-orders"
              payload: { account_id: "${acct_id}", triggering_bill_id: "${bill}", scheduled_for: "2026-03-10T00:00:00Z" }
              as: FieldOps
              captures: { so_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: FieldOps
          trigger:
            - call: "POST /shutoff-orders/${so_id}/execute"
              payload: {}
              as: FieldOps
          assert:
            - "Account.${acct_id}.billing_status == SHUTOFF_PENDING"
            - "Account.${acct_id}.service_status == SUSPENDED"
            - "ShutoffOrder.${so_id}.status == EXECUTED"

      - name: shutoff_order_cyclic_schedule_execute_reconnect
        grounds:
          - state_machines.ShutoffOrder.SCHEDULED_to_EXECUTED
          - state_machines.ShutoffOrder.EXECUTED_to_RECONNECTED
          - entities.ShutoffOrder.fields.reconnect_fee_charged_cents
        distinguishing_aspect: |
          ShutoffOrder traverses the cyclic shape SCHEDULED -> EXECUTED -> RECONNECTED on a
          different entity than the Account axes; reconnect re-enters service (RESTORED) and posts
          the reconnect fee (5000), distinguishing it from a purely linear A->B->C pipeline.
        test_recipe:
          setup:
            - "ShutoffOrder EXECUTED for a SUSPENDED account (reusing the parallel-axes setup), clock 2026-03-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: BillingClerk
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "7 St" }
