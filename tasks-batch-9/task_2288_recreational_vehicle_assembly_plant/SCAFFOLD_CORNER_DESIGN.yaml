              as: PlantAdmin
              captures: { build_1: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", shipped_at: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              captures: { build_2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_1}", claim_type: "APPLIANCE", labor_hours: 3.50, parts_cost_cents: 68000, narrative: "water heater ignition board failed", goodwill_requested_cents: 60000 }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { claim_1: $.data.id, iw_1: $.data.in_warranty }
            - call: "POST /warranty-claims/${claim_1}/decide"
              payload: { decision: "APPROVED" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { tier_1: $.data.authority_tier, gw_1: $.data.goodwill_authorized_cents, tot_1: $.data.total_reimbursement_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-02T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_2}", claim_type: "APPLIANCE", labor_hours: 3.50, parts_cost_cents: 68000, narrative: "identical water heater ignition board failure", goodwill_requested_cents: 60000 }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { claim_2: $.data.id, iw_2: $.data.in_warranty }
            - call: "POST /warranty-claims/${claim_2}/decide"
              payload: { decision: "APPROVED" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
