  - rule_id: transitive_cascade
    instances:
      - name: term_expiry_gap_withdrawal_cascade
        grounds:
          - state_machines.LeadershipTerm.ACTIVE_to_EXPIRED
          - state_machines.FundingRequest.SUBMITTED_to_WITHDRAWN
          - entities.ErgGroup.fields.has_active_leader
        distinguishing_aspect: |
          Depth-3 chain triggered by the clock sweep (not by any group endpoint):
          set_current_utc -> LeadershipTerm EXPIRED -> ErgGroup.has_active_leader
          recomputed false -> FundingRequest SUBMITTED -> WITHDRAWN; each link is caused
          by the previous mutation, not by the clock call directly.
        test_recipe:
          setup:
            - "Program OPEN; group 'Cascade One' ACTIVE; leader emp_f01 term ACTIVE ending 2027-02-01T00:00:00Z (created at clock 2026-11-01)"
