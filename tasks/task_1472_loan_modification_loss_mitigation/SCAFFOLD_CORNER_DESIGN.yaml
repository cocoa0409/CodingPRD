  # =====================================================================
  # Section: complexity_layers
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_loan_version_on_application_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[application-create-stale-loan]", "errors[ERR_STALE_LOAN_VERSION]"]
        distinguishing_aspect: "Two strictly sequential application creates: the first bumps Loan.version 1->2; the second, still carrying the pre-mutation version 1, is rejected 412 — a deterministic stale-view rejection with no parallelism."
        test_recipe:
          setup: ["loan boarded (version 1)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Hugo H", email: "hugo@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OCC1", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "DISASTER", stated_monthly_income_cents: 200000 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_LOAN_VERSION, http 412 (Loan.version advanced to 2 by the first create)"
            - "only one application exists; LossMitApplication.${app1}.status still SUBMITTED (no supersession happened)"

      - name: occ_stale_application_version_on_evaluation_rerun
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[evaluation-rerun-stale-application]", "errors[ERR_STALE_APPLICATION_VERSION]"]
        distinguishing_aspect: "After a successful evaluation bumps the application version, a rerun carrying the pre-evaluation version is rejected 412 — note the OCC check (priority 6) fires BEFORE the state rule (the application is no longer COMPLETE_PACKAGE either), so 412 beats 409."
        test_recipe:
          setup: ["fixture A application COMPLETE_PACKAGE; one successful evaluation already run"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Ines I", email: "ines@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OCC2", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1", captures: { ev1: $.data.id } }
          trigger:
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_APPLICATION_VERSION, http 412 (not ERR_APPLICATION_NOT_COMPLETE — OCC outranks state)"
            - "exactly one evaluation exists; WaterfallEvaluation.${ev1}.status == ACTIVE"

      - name: occ_correct_version_supersede_succeeds
        claim_type: occ_happy_path
        grounds: ["concurrency_rules[application-create-stale-loan]", "entities.LossMitApplication.fields.superseded_by_application_id"]
        distinguishing_aspect: "The same create-with-supersede endpoint SUCCEEDS with the current version: the prior application auto-WITHDRAWs with superseded_by_application_id pointing at the new one, and Loan.version advances again."
        test_recipe:
          setup: ["loan with one SUBMITTED application (version now 2)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Juan J", email: "juan@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OCC3", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app1: $.data.id } }
            - { call: "GET /loans/${loan_id}", as: ServicingAdmin, captures: { loan_v2: $.data.version } }
          trigger:
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v2}", hardship_type: "DISASTER", stated_monthly_income_cents: 200000 }, as: Borrower, as_user_id: "${b_id}", captures: { app2: $.data.id } }
          assert:
            - "201; LossMitApplication.${app2}.status == SUBMITTED"
            - "LossMitApplication.${app1}.status == WITHDRAWN and superseded_by_application_id == ${app2}"
            - "Loan.${loan_id}.version == 3 (two creates, two increments)"

      - name: offer_deadline_inclusive_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.trial_performance_evaluation", "errors[ERR_TRIAL_PLAN_NOT_OFFERED]"]
        distinguishing_aspect: "OFFER_VALIDITY_DAYS == 30 evaluated against the logical clock: acceptance exactly AT offer_deadline succeeds (inclusive), one day later fails ERR_TRIAL_PLAN_NOT_OFFERED — two plans, same deadline, adjacent clocks."
        test_recipe:
