# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1178: Retail Construction Rollout Program Management
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------
  # Rule 1: dual_variant_calc — two calculations, different entity domains
  # ---------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: site_variance_provisional_vs_final_posture_divergence
        grounds:
          - calculations.site_budget_variance
          - entities.Site.fields.budget_posture
          - entities.Site.fields.variance_ratio_provisional_bp
        distinguishing_aspect: |
          On the Site fiscal domain, the final variant (committed only) yields
          ratio 444bp -> WITHIN while the provisional variant (committed + proposed)
          yields 578bp on identical data; budget_posture is pinned to the final
          variant, so the stored posture is WITHIN even though the provisional
          reading has crossed the WATCH threshold.
        test_recipe:
          setup:
            - "Awarded site with base_contract_cents 9000000 and budget_allocation_cents 10000000"
            - "One APPROVED change order of +400000 and one PROPOSED change order of +120000"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - call: "POST /rollout/municipality-profiles"
              payload: { municipality_code: "TX-DAL", statutory_review_days: 10, observed_avg_review_days: 20, permit_validity_days: 180, fee_base_cents: 50000, fee_per_sqft_cents: 250 }
              as: PermitCoordinator
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { ds: $.data.id }
            - { call: "POST /rollout/drawing-sets/${ds}/submit", payload: {}, as: DesignManager }
            - { call: "POST /rollout/drawing-sets/${ds}/approve", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/advance-design", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/submit-design", payload: {}, as: DesignManager }
            - call: "POST /rollout/permits"
              payload: { site_id: "${site}", permit_type: "BUILDING", drawing_set_id: "${ds}" }
              as: PermitCoordinator
              captures: { perm: $.data.id }
            - { call: "POST /rollout/permits/${perm}/file", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/start-review", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/issue", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/sites/${site}/mark-permitted", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/markets/${mkt}/open-bidding", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/bid-packages"
              payload: { market_id: "${mkt}", phase_wave: 1, scope_description: "Wave 1 GC", bid_open_at: "2026-05-01T00:00:00Z", bid_close_at: "2026-05-10T00:00:00Z", evaluation_mode: "LOWEST_PRICE", max_duration_days: 120 }
              as: ProcurementLead
              captures: { pkg: $.data.id }
            - { call: "POST /rollout/bid-packages/${pkg}/open", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC One LLC", license_no: "GC-100", license_state: "TX" }
              as: ProcurementLead
              captures: { gc1: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg}", contractor_id: "${gc1}", amount_cents: 9000000, duration_days: 90, tech_score: 80 }
              as: GCVendor
              as_user_id: "${gc1}"
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/bid-packages/${pkg}/close", payload: {}, as: ProcurementLead }
            - { call: "POST /rollout/bid-packages/${pkg}/award", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/change-orders"
              payload: { site_id: "${site}", description: "Added millwork", amount_cents: 400000, cost_category: "SCOPE" }
              as: SiteSuperintendent
              as_user_id: "sup-1"
              captures: { co1: $.data.id }
            - call: "GET /rollout/sites/${site}"
              payload: {}
              as: ProgramDirector
              captures: { sv1: $.data.version }
            - call: "POST /rollout/change-orders/${co1}/approve"
              payload: { expected_site_version: "${sv1}" }
              as: FinanceController
              as_user_id: "fin-1"
            - call: "POST /rollout/change-orders"
              payload: { site_id: "${site}", description: "Lighting upgrade", amount_cents: 120000, cost_category: "SCOPE" }
              as: SiteSuperintendent
              as_user_id: "sup-1"
          trigger:
            - call: "GET /rollout/sites/${site}"
              payload: {}
              as: ProgramDirector
          assert:
            - "Site.${site}.variance_ratio_final_bp == 444"
            - "Site.${site}.variance_ratio_provisional_bp == 578"
            - "Site.${site}.budget_posture == WITHIN"
            - "Site.${site}.committed_cents == 9400000"
            - "Site.${site}.proposed_co_cents == 120000"

      - name: bid_evaluation_mode_divergence_same_bids_different_winner
        grounds:
          - calculations.bid_evaluation
          - entities.BidPackage.fields.evaluation_mode
        distinguishing_aspect: |
          On the Bid procurement domain (different entity domain from the Site
          fiscal variant), identical bid tuples produce opposite winners under the
          LOWEST_PRICE vs BEST_VALUE variants: the 8000000-cent bid wins
          LOWEST_PRICE while the 8500000-cent tech-100 bid wins BEST_VALUE 95.88 to 88.00.
        test_recipe:
          setup:
            - "Program ACTIVE with two markets m1 (LOWEST_PRICE package) and m2 (BEST_VALUE package), both OPEN"
            - "Both packages carry identical bid tuples: gc1 8000000/90d/tech60, gc2 8500000/80d/tech100"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt1: $.data.id }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "Houston", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt2: $.data.id }
            - { call: "POST /rollout/markets/${mkt1}/open-bidding", payload: {}, as: ProcurementLead }
            - { call: "POST /rollout/markets/${mkt2}/open-bidding", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/bid-packages"
              payload: { market_id: "${mkt1}", phase_wave: 1, scope_description: "DFW wave 1", bid_open_at: "2026-05-01T00:00:00Z", bid_close_at: "2026-05-10T00:00:00Z", evaluation_mode: "LOWEST_PRICE", max_duration_days: 120 }
              as: ProcurementLead
              captures: { pkg1: $.data.id }
            - call: "POST /rollout/bid-packages"
              payload: { market_id: "${mkt2}", phase_wave: 1, scope_description: "HOU wave 1", bid_open_at: "2026-05-01T00:00:00Z", bid_close_at: "2026-05-10T00:00:00Z", evaluation_mode: "BEST_VALUE", max_duration_days: 120 }
              as: ProcurementLead
              captures: { pkg2: $.data.id }
            - { call: "POST /rollout/bid-packages/${pkg1}/open", payload: {}, as: ProcurementLead }
            - { call: "POST /rollout/bid-packages/${pkg2}/open", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC One LLC", license_no: "GC-100", license_state: "TX" }
              as: ProcurementLead
              captures: { gc1: $.data.id }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC Two LLC", license_no: "GC-200", license_state: "TX" }
              as: ProcurementLead
              captures: { gc2: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg1}", contractor_id: "${gc1}", amount_cents: 8000000, duration_days: 90, tech_score: 60 }
              as: GCVendor
              as_user_id: "${gc1}"
              captures: { bidA1: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg1}", contractor_id: "${gc2}", amount_cents: 8500000, duration_days: 80, tech_score: 100 }
              as: GCVendor
              as_user_id: "${gc2}"
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg2}", contractor_id: "${gc1}", amount_cents: 8000000, duration_days: 90, tech_score: 60 }
              as: GCVendor
              as_user_id: "${gc1}"
              captures: { bidA2: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg2}", contractor_id: "${gc2}", amount_cents: 8500000, duration_days: 80, tech_score: 100 }
              as: GCVendor
              as_user_id: "${gc2}"
              captures: { bidB2: $.data.id }
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/bid-packages/${pkg1}/close", payload: {}, as: ProcurementLead }
            - { call: "POST /rollout/bid-packages/${pkg2}/close", payload: {}, as: ProcurementLead }
          trigger:
            - call: "POST /rollout/bid-packages/${pkg1}/award"
              payload: {}
              as: ProcurementLead
              captures: { pkg1_after: $.data.awarded_bid_id }
            - call: "POST /rollout/bid-packages/${pkg2}/award"
              payload: {}
              as: ProcurementLead
              captures: { pkg2_after: $.data.awarded_bid_id }
            - call: "GET /rollout/bids/${bidA2}"
              payload: {}
              as: ProcurementLead
              captures: { scoreA2: $.data.evaluation_score }
            - call: "GET /rollout/bids/${bidB2}"
              payload: {}
              as: ProcurementLead
              captures: { scoreB2: $.data.evaluation_score }
          assert:
            - "BidPackage.${pkg1}.awarded_bid_id == ${bidA1}"
            - "BidPackage.${pkg2}.awarded_bid_id == ${bidB2}"
            - "Bid.${bidA2}.evaluation_score == 88.00"
            - "Bid.${bidB2}.evaluation_score == 95.88"

  # ---------------------------------------------------------------
  # Rule 2: combinatorial_formula — three instances, modes (a), (b), (c)
  # ---------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: best_value_responsiveness_filter_nested_min
        grounds:
          - calculations.bid_evaluation
          - entities.Bid.fields.is_responsive
        distinguishing_aspect: |
          Mode (a): the BEST_VALUE score combines >=3 inputs (amount_cents,
          tech_score, duration_days vs max_duration_days) with a conditional
          exclusion branch and a nested min over the FILTERED responsive set —
          the 7500000-cent bid is excluded for duration 150 > 120, so min_amount
          stays 8000000 and the 8500000/tech100 bid wins with 95.88.
        test_recipe:
          setup:
            - "BEST_VALUE package OPEN with three bids: A 8000000/90/60 responsive, C 7500000/150/90 non-responsive, B 8500000/80/100 responsive"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - { call: "POST /rollout/markets/${mkt}/open-bidding", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/bid-packages"
              payload: { market_id: "${mkt}", phase_wave: 1, scope_description: "DFW wave 1", bid_open_at: "2026-05-01T00:00:00Z", bid_close_at: "2026-05-10T00:00:00Z", evaluation_mode: "BEST_VALUE", max_duration_days: 120 }
              as: ProcurementLead
              captures: { pkg: $.data.id }
            - { call: "POST /rollout/bid-packages/${pkg}/open", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC One LLC", license_no: "GC-100", license_state: "TX" }
              as: ProcurementLead
              captures: { gc1: $.data.id }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC Two LLC", license_no: "GC-200", license_state: "TX" }
              as: ProcurementLead
              captures: { gc2: $.data.id }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC Three LLC", license_no: "GC-300", license_state: "TX" }
              as: ProcurementLead
              captures: { gc3: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg}", contractor_id: "${gc1}", amount_cents: 8000000, duration_days: 90, tech_score: 60 }
              as: GCVendor
              as_user_id: "${gc1}"
              captures: { bidA: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg}", contractor_id: "${gc3}", amount_cents: 7500000, duration_days: 150, tech_score: 90 }
              as: GCVendor
              as_user_id: "${gc3}"
              captures: { bidC: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg}", contractor_id: "${gc2}", amount_cents: 8500000, duration_days: 80, tech_score: 100 }
              as: GCVendor
              as_user_id: "${gc2}"
              captures: { bidB: $.data.id }
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/bid-packages/${pkg}/close", payload: {}, as: ProcurementLead }
          trigger:
            - call: "POST /rollout/bid-packages/${pkg}/award"
              payload: {}
              as: ProcurementLead
            - call: "GET /rollout/bids/${bidC}"
              payload: {}
              as: ProcurementLead
              captures: { c_resp: $.data.is_responsive }
            - call: "GET /rollout/bids/${bidB}"
              payload: {}
              as: ProcurementLead
              captures: { scoreB: $.data.evaluation_score }
          assert:
            - "BidPackage.${pkg}.awarded_bid_id == ${bidB}"
            - "Bid.${bidC}.is_responsive == false"
            - "Bid.${bidC}.status == REJECTED"
            - "Bid.${bidB}.evaluation_score == 95.88"
            - "Bid.${bidA}.status == REJECTED"

      - name: permit_fee_per_permit_rounding_order
        grounds:
          - calculations.permit_fee_schedule
          - entities.Site.fields.permit_fees_paid_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — fee is rounded per
          permit (50000 + round_half_up(4050*125/100) = 55063) and only then
          summed, giving 110126 for two permits; the forbidden sum-then-round
          order would give 110125, a 1-cent divergence the test pins.
        test_recipe:
          setup:
            - "Site (square_footage 4050, municipality TX-FTW with fee_base 50000, fee_per_sqft 125) in PERMITTING with an APPROVED drawing set"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "Fort Worth", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - call: "POST /rollout/municipality-profiles"
              payload: { municipality_code: "TX-FTW", statutory_review_days: 10, observed_avg_review_days: 20, permit_validity_days: 180, fee_base_cents: 50000, fee_per_sqft_cents: 125 }
              as: PermitCoordinator
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-FTW", address: "200 Oak St", square_footage: 4050, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-FTW" }
              as: DesignManager
              captures: { ds: $.data.id }
            - { call: "POST /rollout/drawing-sets/${ds}/submit", payload: {}, as: DesignManager }
            - { call: "POST /rollout/drawing-sets/${ds}/approve", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/advance-design", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/submit-design", payload: {}, as: DesignManager }
            - call: "POST /rollout/permits"
              payload: { site_id: "${site}", permit_type: "BUILDING", drawing_set_id: "${ds}" }
              as: PermitCoordinator
              captures: { perm1: $.data.id }
            - call: "POST /rollout/permits"
              payload: { site_id: "${site}", permit_type: "SIGNAGE", drawing_set_id: "${ds}" }
              as: PermitCoordinator
              captures: { perm2: $.data.id }
          trigger:
            - call: "POST /rollout/permits/${perm1}/file"
              payload: {}
              as: PermitCoordinator
              captures: { fee1: $.data.fee_cents }
            - call: "POST /rollout/permits/${perm2}/file"
              payload: {}
              as: PermitCoordinator
              captures: { fee2: $.data.fee_cents }
            - call: "GET /rollout/sites/${site}"
              payload: {}
              as: ProgramDirector
          assert:
            - "Permit.${perm1}.fee_cents == 55063"
            - "Permit.${perm2}.fee_cents == 55063"
            - "Site.${site}.permit_fees_paid_cents == 110126"

      - name: forecast_circular_evaluation_order_pinned
        grounds:
          - calculations.opening_date_forecast
          - entities.OpeningCommitment.fields.protection_posture
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the conservative vendor padding
          depends on the provisional budget ratio, the forecast depends on that
          padding, and the resulting protection_posture gates future change
          orders that would change the ratio. The pinned order (ratios -> slip
          factor -> forecast -> posture) yields forecast_open_on 2026-09-05 vs
          optimistic 2026-09-04; the 1-day delta proves the 500bp slip factor was
          applied before the forecast step.
        test_recipe:
          setup:
            - "Site IN_BUILD with base 9000000, allocation 10000000, and an APPROVED +500000 change order (provisional ratio 556bp -> slip factor 500bp)"
            - "FIXTURE and IT mobilizations COMPLETE; SIGNAGE SCHEDULED for [2026-08-10, 2026-08-25); clock at 2026-08-01"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - call: "POST /rollout/municipality-profiles"
              payload: { municipality_code: "TX-DAL", statutory_review_days: 10, observed_avg_review_days: 20, permit_validity_days: 180, fee_base_cents: 50000, fee_per_sqft_cents: 250 }
              as: PermitCoordinator
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { ds: $.data.id }
            - { call: "POST /rollout/drawing-sets/${ds}/submit", payload: {}, as: DesignManager }
            - { call: "POST /rollout/drawing-sets/${ds}/approve", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/advance-design", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/submit-design", payload: {}, as: DesignManager }
            - call: "POST /rollout/permits"
              payload: { site_id: "${site}", permit_type: "BUILDING", drawing_set_id: "${ds}" }
              as: PermitCoordinator
              captures: { perm: $.data.id }
            - { call: "POST /rollout/permits/${perm}/file", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/start-review", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/issue", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/sites/${site}/mark-permitted", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/markets/${mkt}/open-bidding", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/bid-packages"
              payload: { market_id: "${mkt}", phase_wave: 1, scope_description: "Wave 1 GC", bid_open_at: "2026-05-01T00:00:00Z", bid_close_at: "2026-05-10T00:00:00Z", evaluation_mode: "LOWEST_PRICE", max_duration_days: 120 }
              as: ProcurementLead
              captures: { pkg: $.data.id }
            - { call: "POST /rollout/bid-packages/${pkg}/open", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC One LLC", license_no: "GC-100", license_state: "TX" }
              as: ProcurementLead
              captures: { gc1: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg}", contractor_id: "${gc1}", amount_cents: 9000000, duration_days: 90, tech_score: 80 }
