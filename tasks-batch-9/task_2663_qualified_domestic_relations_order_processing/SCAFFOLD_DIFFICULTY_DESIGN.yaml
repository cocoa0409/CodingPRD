          setup:
            - "Fixture A: a PUBLISHED PERIOD_END plan (max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000) and a participant not in pay status."
            - "A plan account with three assignable sources whose balances 100000 / 1490125 / 2409875 sum to the assignable base 4000000, plus a non-assignable LOAN_RECEIVABLE of 300000; only AFTER_TAX carries basis (60000)."
            - "Snapshots 2026-06-30 at 4000000 and 2026-12-31 at 4120000, giving exactly 300 bps of period growth."
            - "A SEPARATE_INTEREST 4000 bps draft received at 2026-09-01 (hold 1600000) and qualified at 2026-09-15."
