  # ============================== 8. Cross-Cutting Complexity Layers
  # complexity_layers: cascading_side_effects, dual_variant_calculation,
  # optimistic_concurrency, selector_policy. selector_policy has no row in the
  # claim-extraction guide, so it contributes no instance here; the selector
  # itself is covered by the calculations section (carrier_selection).
