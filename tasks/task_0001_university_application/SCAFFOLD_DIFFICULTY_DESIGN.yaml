  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ed_exclusivity_aggregate_capacity_one_over_closed_window
        grounds:
          - validations[priority=7]
          - errors[ERR_ED_EXCLUSIVITY_VIOLATED]
          - entities.Application.fields.admission_track_snapshot
          - entities.Application.fields.status
        distinguishing_aspect: |
          Interval semantics: aggregate capacity-1 over a CLOSED window
          [submit_time, terminal_decision_time]. An applicant may have at
          most one EARLY_DECISION Application "occupying" a non-terminal
          status (SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, ENROLLED).
          Submitting a second ED application during the first's open
          window collides → ERR_ED_EXCLUSIVITY_VIOLATED. Resource:
          Applicant×Application slot.
        test_recipe:
          setup:
            - "Applicant A has a SUBMITTED ED Application at school S_ed1 (window still open — no terminal decision yet)."
