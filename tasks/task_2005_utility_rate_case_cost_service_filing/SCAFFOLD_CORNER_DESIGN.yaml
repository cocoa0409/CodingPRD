            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler, captures: { lock_st: $.data.status, lock_adj: $.data.adjusted_amount_cents } }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
          trigger:
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler, captures: { err: $.data.error_id } }
            - { call: "POST /api/v1/adjustments/${a2}/withdraw", payload: {}, as: UtilityFiler, as_user_id: "uf_alice" }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler, captures: { err2: $.data.error_id } }
          assert:
            - "${lock_st} == LOCKED and ${lock_adj} == 1050000000 (PROPOSED adjustment does not block lock and DOES count in the locked adjusted amount)"
            - "${err} == ERR_UNRESOLVED_ADJUSTMENTS (case-wide guard fires even though every entry is LOCKED)"
            - "After withdrawing A2: E1 stays LOCKED with adjusted_amount_cents == 1000000000, so the computed RR becomes 1,180,000,000 and the SAME proposed RR now fails differently: ${err2} == ERR_RR_MISMATCH (demonstrating the pinned guard order: with adjustments resolved, the fiscal check is reached)"


