        excluded_because:
          difficulty_instance: dual_variant_calc / reserve_adequacy_component_full_funding_vs_cash_flow_divergence
          rationale: "Both funding-method variants are computed on one association in the named §1.8 instance, with every intermediate and the delta asserted as literals."

      - name: corner_claim_reserve_variant_selection_changes_the_committed_amount
        claim_type: Variant Selection
        grounds:
