# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Fractional Jet Ownership & Share Management
# Breadth probe: every testable claim in SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8).

scaffold_corner_design:

  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: program_creation_applies_defaults_and_system_fields
        claim_type: creation_defaults
        grounds:
          - entities.Program
          - endpoints: "POST /programs"
        distinguishing_aspect: "POST /programs with valid body returns 201; program_posture computed ACTIVE; id/created_at/updated_at/version system-stamped; version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { program_code: "FJX-EN1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: ["2026-11-26"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, posture: $.data.program_posture, ver: $.data.version }
          assert:
            - "response code 201; Program.${prog_id}.program_posture == ACTIVE"
            - "Program.${prog_id}.version == 1; created_at == updated_at == 2026-08-01T00:00:00.000Z (clock default)"

      - name: share_invalid_fraction_denominator_rejected
        claim_type: type_constraint
        grounds:
          - entities.Share.fields.fraction_denominator
          - errors[ERR_INVALID_FRACTION]
        distinguishing_aspect: "fraction_denominator 5 is outside {4,8,16,32} → ERR_INVALID_FRACTION 422; numerator > denominator also rejected."
        test_recipe:
          setup:
            - "Program ACTIVE with LIGHT class and an owner"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-EN2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "LIGHT", hourly_rate_cents: 300000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 1500000, seats: 6 }
              as: ProgramAdmin
              captures: { cls_l: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "EN2 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
          trigger:
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_l}", fraction_numerator: 1, fraction_denominator: 5, purchase_price_cents: 1200000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_FRACTION; HTTP 422"

      - name: share_entitlement_computed_field
        claim_type: computed_field
        grounds:
          - entities.Share.fields.annual_entitlement_hours
          - calculations.annual_entitlement_hours
        distinguishing_aspect: "1/16 share activation computes annual_entitlement_hours == 50.00 and hours_remaining_cy == 50.00; client-supplied entitlement value is ignored."
        test_recipe:
          setup: ["Program ACTIVE, LIGHT class, owner, share 1/16 created"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-EN3", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "LIGHT", hourly_rate_cents: 300000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 1500000, seats: 6 }
              as: ProgramAdmin
              captures: { cls_l: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "EN3 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_l}", fraction_numerator: 1, fraction_denominator: 16, purchase_price_cents: 1200000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
          trigger:
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { ent: $.data.annual_entitlement_hours, rem: $.data.hours_remaining_cy }
          assert:
            - "Share.${share_id}.annual_entitlement_hours == 50.00"
            - "Share.${share_id}.hours_remaining_cy == 50.00"
            - "DepreciationSchedule for share created with basis_cents == 1200000"

      - name: entity_get_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB except one program"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-EN4", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
          trigger:
            - call: "GET /owners/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; HTTP 404"

      - name: list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints: "GET /aircraft-classes"
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more; defaults limit=10."
        test_recipe:
          setup: ["Program with 3 aircraft classes"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-EN5", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "LIGHT", hourly_rate_cents: 300000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 1500000, seats: 6 }
              as: ProgramAdmin
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "HEAVY", hourly_rate_cents: 900000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 4000000, seats: 14 }
              as: ProgramAdmin
          trigger:
            - call: "GET /aircraft-classes?program_id=${prog_id}&limit=2&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response contains 2 items; total_count == 3; has_more == true"
            - "GET with limit=2&offset=2 returns 1 item, has_more == false"

      - name: flight_leg_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.FlightLeg
        distinguishing_aspect: "FlightLeg has common_fields: false — no version field; no PUT/PATCH endpoint exists for it; created once at booking completion."
        test_recipe:
          setup: ["Completed booking producing a FlightLeg"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-EN6", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "LIGHT", hourly_rate_cents: 300000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 1500000, seats: 6 }
              as: ProgramAdmin
              captures: { cls_l: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "EN6 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_l}", fraction_numerator: 1, fraction_denominator: 4, purchase_price_cents: 4800000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N800EN", class_id: "${cls_l}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_l}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 1.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /bookings/${bk_id}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_block_hours: 1.25 }
              as: FleetOps
              captures: { leg: $.data }
          assert:
            - "FlightLeg response has id and created_at but NO version/updated_at fields"
            - "FlightLeg.peak_day_flag == false (2026-09-10 not in peak calendar)"
            - "FlightLeg.actual_block_hours == 1.25"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: booking_terminal_cancelled_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.BookingRequest
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "From CANCELLED, every action trigger (assign, complete, confirm, cancel) is rejected; no side effects fire."
        test_recipe:
          setup: ["Owner with ACTIVE 1/8 MID share; booking created then cancelled"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-SM1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "SM1 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N900SM", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 1.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id in {ERR_ALREADY_TERMINAL, ERR_INVALID_STATE}; HTTP 409"
            - "BookingRequest.${bk_id}.booking_status remains CANCELLED; assigned_aircraft_id remains null"

      - name: booking_request_expiry_via_clock
        claim_type: automatic_transition
        grounds:
          - state_machines.BookingRequest.REQUESTED_to_EXPIRED
        distinguishing_aspect: "System transition: clock advanced past scheduled_departure_utc while REQUESTED → booking auto-EXPIRED; no debit ever occurred."
        test_recipe:
          setup: ["Booking REQUESTED with departure 2026-09-10T15:00Z, never confirmed; clock advanced to 2026-09-10T15:00Z"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-SM2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "SM2 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 1.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T15:00:00Z" }
              as: ProgramAdmin
            - call: "GET /bookings/${bk_id}"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { st: $.data.booking_status }
          assert:
            - "BookingRequest.${bk_id}.booking_status == EXPIRED (clock >= scheduled_departure_utc)"
            - "Share.${share_id}.hours_remaining_cy == 100.00 (never debited)"

      - name: share_activation_blocked_in_suspended_program
        claim_type: guarded_transition
        grounds:
          - state_machines.Share.PENDING_ACTIVATION_to_ACTIVE
          - errors[ERR_PROGRAM_POSTURE_BLOCKS]
        distinguishing_aspect: "Cross-entity guard: share activate requires Program ACTIVE; SUSPENDED program rejects with ERR_PROGRAM_POSTURE_BLOCKS."
        test_recipe:
          setup: ["Program SUSPENDED; share PENDING_ACTIVATION"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-SM3", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "SM3 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /programs/${prog_id}/suspend"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_POSTURE_BLOCKS; HTTP 409"
            - "Share.${share_id}.share_status remains PENDING_ACTIVATION"

      - name: transfer_listing_sale_rebases_depreciation
        claim_type: side_effect_execution
        grounds:
          - state_machines.TransferListing.UNDER_OFFER_to_SOLD
        distinguishing_aspect: "close-sale side effects: share owner reassigned, share LISTED→ACTIVE, buyer's DepreciationSchedule basis == final_sale_price_cents and accumulated == 0, hours carried over."
        test_recipe:
          setup:
            - "Seller owner A with ACTIVE 1/8 MID share (confirmed 4.00h consumed → 96.00h remaining); listing LISTED at 10000000"
            - "Buyer owner B GOOD; accept then close-sale at 11000000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-SM4", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "SM4 Seller", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_a: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "SM4 Buyer", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_b: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_a}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N910SM", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-05T15:00:00Z", estimated_block_hours: 4.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_a}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_a}"
            - call: "POST /bookings/${bk_id}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_block_hours: 4.00 }
              as: FleetOps
            - call: "GET /shares/${share_id}"
              payload: {}
              as: Owner
              as_user_id: "${own_a}"
              captures: { share_v2: $.data.version }
            - call: "POST /transfer-listings"
              payload: { share_id: "${share_id}", asking_price_cents: 10000000, program_repurchase_flag: false, expected_share_version: "${share_v2}" }
              as: Owner
              as_user_id: "${own_a}"
              captures: { lst_id: $.data.id, lst_v: $.data.version }
          trigger:
            - call: "POST /transfer-listings/${lst_id}/accept"
              payload: { buyer_owner_id: "${own_b}", expected_listing_version: "${lst_v}" }
              as: Owner
              as_user_id: "${own_b}"
            - call: "POST /transfer-listings/${lst_id}/close-sale"
              payload: { final_sale_price_cents: 11000000 }
              as: FinanceOps
              captures: { lst_status: $.data.listing_status }
            - call: "GET /shares/${share_id}"
              payload: {}
              as: FinanceOps
              captures: { sh_owner: $.data.owner_id, sh_status: $.data.share_status, sh_hours: $.data.hours_remaining_cy }
            - call: "GET /depreciation-schedules?share_id=${share_id}"
              payload: {}
              as: FinanceOps
              captures: { dep_basis: "$.data[0].basis_cents", dep_accum: "$.data[0].accumulated_depreciation_cents" }
          assert:
            - "TransferListing.${lst_id}.listing_status == SOLD"
            - "Share.${share_id}.owner_id == ${own_b} and share_status == ACTIVE"
            - "Share.${share_id}.hours_remaining_cy == 96.00 (carried over, not reset)"
            - "DepreciationSchedule.basis_cents == 11000000 and accumulated_depreciation_cents == 0 for the buyer"

      - name: exit_reject_returns_share_to_active
        claim_type: compensation
        grounds:
          - state_machines.ExitRequest.SUBMITTED_to_REJECTED
          - state_machines.Share.IN_EXIT_to_ACTIVE
        distinguishing_aspect: "Compensation: rejecting a SUBMITTED exit returns the share to ACTIVE; expired bookings are NOT restored."
        test_recipe:
          setup: ["Owner with ACTIVE 1/8 MID share plus one REQUESTED booking; exit submitted (booking EXPIRED via cascade); exit rejected"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-SM5", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "SM5 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 1.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /shares/${share_id}/exit"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { exit_id: $.data.id }
          trigger:
            - call: "POST /exit-requests/${exit_id}/reject"
              payload: {}
              as: FinanceOps
            - call: "GET /shares/${share_id}"
              payload: {}
              as: FinanceOps
              captures: { sh_status: $.data.share_status }
            - call: "GET /bookings/${bk_id}"
              payload: {}
              as: FinanceOps
              captures: { bk_status: $.data.booking_status }
          assert:
            - "Share.${share_id}.share_status == ACTIVE (compensated)"
            - "BookingRequest.${bk_id}.booking_status == EXPIRED (NOT restored — one-way cascade)"

