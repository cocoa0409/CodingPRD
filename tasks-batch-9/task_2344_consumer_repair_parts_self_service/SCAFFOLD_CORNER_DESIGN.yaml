            - "${e4} == ERR_FORBIDDEN_ROLE and ${e5} == ERR_FORBIDDEN_ROLE — not ERR_ORDER_NOT_FOUND, even though ffffffff-ffff-ffff-ffff-ffffffffffff does not exist"
            - "${model_id} is a fresh row with ${support_state} == ACTIVE_PRODUCTION — the same request from ProgramAdmin returns 201"
