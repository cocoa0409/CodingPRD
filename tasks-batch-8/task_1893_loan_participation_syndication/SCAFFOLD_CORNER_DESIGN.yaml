      - name: version_increments_on_every_mutation
        claim_type: occ_stale_conflict
        grounds: [entities.Facility, entities.Participant]
        distinguishing_aspect: "common_fields versioning: facility version 1 at create, 4 after three commits (each commit mutates the facility); participant version 2 after its commit."
        test_recipe:
          setup: ["facility with three participants, all committed in sequence"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Ver B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Ver", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id, f_v0: $.data.version } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "V1", commitment_cents: 5000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "V2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "V3", commitment_cents: 2000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank, captures: { p1_v: $.data.version } }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v_end: $.data.version } }
          assert:
            - "Facility version == 1 at create and == 4 after three commits (each commit cascades committed_cents/status onto the facility)"
            - "Participant.${p1_id}.version == 2 immediately after its own commit"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_remit_readback
        claim_type: immediate_consistency
        grounds: [state_machines.DistributionRun.COMPUTED_to_REMITTED]
        distinguishing_aspect: "Immediate consistency: the remit response itself carries status REMITTED, remitted_at, and pools; a follow-up GET shows identical values (no asynchronous reconciliation)."
        test_recipe:
          setup: ["funded facility single participant; payment 50,000 value 2026-08-31; run created"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "IC B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac IC", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "IP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 50000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /api/distribution_runs/${run_id}/remit", payload: {}, as: AgentBank, captures: { st: $.data.status, ra: $.data.remitted_at } }
            - { call: "GET /api/distribution_runs/${run_id}", as: AgentBank, captures: { st2: $.data.status } }
          assert:
            - "remit response: status == REMITTED and remitted_at set in the SAME response"
            - "follow-up GET returns identical status REMITTED and identical pool values (fee 208, interest 10,000, principal 39,792)"


