scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_institution_health_inclusive_vs_post_recover
        grounds:
          - calculations.institution_health_status
          - state_machines.Institution.DEGRADED_to_BROKEN
          - state_machines.Institution.BROKEN_to_ACTIVE
        distinguishing_aspect: |
          Institution-domain dual variant: the same five BreakageEvents yield
          BROKEN under the inclusive_window variant, but ACTIVE under the
          post_recover_reset variant once recover stamps last_recovered_at —
          identical stored events, different status.
        test_recipe:
          setup:
            - "Institution I with an ACTIVE agreement (rate_limit_per_hour 100, permitted scope BALANCE)"
            - "Recipient R APPROVED with an ACTIVE tier assignment covering BALANCE (LOW)"
            - "Consent C ACTIVE for consumer cons_a under R with scopes [BALANCE], expiry 2026-12-31"
            - "Connection K ACTIVE under I and C (complete_auth succeeded)"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "First Mutual Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents", "available_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "BudgetWise App", declared_use_case: "personal budgeting", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "LowBal", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_a", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_v}" }
              as: Consumer
              as_user_id: cons_a
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_a", consent_id: "${consent_id}", method: "CREDENTIALS", reauth_cooldown_seconds: 600 }
              as: Consumer
              as_user_id: cons_a
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_a
          trigger:
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_a
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_a
            - call: "POST /connections/${conn_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_a
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_a
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_a
            - call: "POST /connections/${conn_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_a
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_a
            - call: "GET /institutions/${inst_id}"
              as: PlatformAdmin
              captures: { status_pre: $.data.status }
            - call: "POST /institutions/${inst_id}/recover"
              payload: {}
              as: PlatformAdmin
            - call: "GET /institutions/${inst_id}"
              as: PlatformAdmin
              captures: { status_post: $.data.status }
          assert:
            - "Five BreakageEvents accumulate: failures 1-2 break the connection (consecutive_failures 2 -> BROKEN), each valid reauth (cooldown 600s honoured by clock stillness is N/A because reauth_not_before is only set on REAUTH_REQUIRED entry, not on BROKEN entry) returns it to ACTIVE for the next failure"
            - "Institution.${inst_id}.status before recover == BROKEN (inclusive_window variant counts all 5 events; 5 >= 5)"
            - "Institution.${inst_id}.status after recover == ACTIVE (post_recover_reset variant excludes all events at or before last_recovered_at)"
            - "Connection.${conn_id}.status == REAUTH_REQUIRED (institution breakage cascade fires on the 5th event while the connection is ACTIVE) and it does NOT change on recover"

      - name: dual_variant_connection_cost_final_vs_provisional
        grounds:
          - calculations.connection_monthly_refresh_cost
          - calculations.refresh_cadence_gate
        distinguishing_aspect: |
          Connection-cost dual variant on a different entity domain (billing, not
          institution health): identical two SUCCEEDED FULL refreshes yield
          units=4, billable=0, cost_cents=0 in the finalized variant but
          units=14, billable=4, cost_cents=400 in the estimated_provisional
          variant, because September 2026 has 5 remaining weekly cadence
          refreshes (ceil(2592000/604800) = 5) at LOW FULL unit cost 2.
        test_recipe:
          setup:
            - "Institution, APPROVED BROAD recipient, LOW tier [BALANCE], ACTIVE consent [BALANCE], ACTIVE connection — clock left at the 2026-09-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Harbor Savings", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "CashTrack", declared_use_case: "spend tracking", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalLow", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_b", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_b
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_b", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_b
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_b
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL" }
              as: Consumer
              as_user_id: cons_b
          trigger:
            - call: "GET /connections/${conn_id}/cost_summary"
              as: Consumer
              as_user_id: cons_b
              captures: { units_f: $.data.units, cost_f: $.data.cost_cents }
            - call: "GET /connections/${conn_id}/cost_summary"
              payload: { include_pending: true }
              as: Consumer
              as_user_id: cons_b
              captures: { units_p: $.data.units, cost_p: $.data.cost_cents }
          assert:
            - "finalized variant: units == 4 (complete_auth FULL 2 + explicit FULL 2), billable_units == 0 (4 <= FREE_UNITS_LOW 10), cost_cents == 0"
            - "estimated_provisional variant: units == 14 (4 + 2 * ceil(2592000/604800)=5), billable_units == 4, cost_cents == 400"
            - "provisional cost_cents (400) strictly exceeds finalized cost_cents (0) for identical stored data"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_scope_coverage_three_input_set_logic
        grounds:
          - calculations.consent_scope_coverage
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (a): consent_scope_coverage combines three inputs (consent
          data_scopes, tier scopes_included, minimization policy forbidden set)
          with non-linear interaction — IDENTITY passes tier but fails STRICT
          policy, so the same consent is rejected for a STRICT recipient yet
          accepted for a STANDARD recipient on the same tier.
        test_recipe:
          setup:
            - "STRICT recipient R_strict APPROVED with ACTIVE tier T covering [BALANCE, IDENTITY]"
            - "STANDARD recipient R_std APPROVED with ACTIVE assignment to the same tier T"
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "StrictLoan", declared_use_case: "loan underwriting", minimization_policy: "STRICT" }
              as: PlatformAdmin
              captures: { rec_strict: $.data.id }
            - call: "POST /recipients"
              payload: { name: "StdLoan", declared_use_case: "kyc verification", minimization_policy: "STANDARD" }
              as: PlatformAdmin
              captures: { rec_std: $.data.id }
            - call: "POST /recipients/${rec_strict}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /recipients/${rec_std}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalIdent", scopes_included: ["BALANCE", "IDENTITY"], rate_class: "MEDIUM" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_strict}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "POST /recipients/${rec_std}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /recipients/${rec_strict}"
              as: PlatformAdmin
              captures: { rec_strict_v: $.data.version }
            - call: "POST /recipients/${rec_strict}/consents"
              payload: { consumer_ref: "cons_c", data_scopes: ["IDENTITY"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_strict_v}" }
              as: Consumer
              as_user_id: cons_c
              captures: { err_strict: $.data.error_id }
            - call: "POST /recipients/${rec_std}/consents"
              payload: { consumer_ref: "cons_c", data_scopes: ["IDENTITY"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_strict_v}" }
              as: Consumer
              as_user_id: cons_c
              captures: { consent_std: $.data.id }
          assert:
            - "STRICT recipient consent rejected: error_id == ERR_SCOPE_VIOLATES_MINIMIZATION (IDENTITY in STRICT_FORBIDDEN even though tier covers it)"
            - "STANDARD recipient consent accepted: ConsentRecord created with status == ACTIVE on the same tier and same scope"
            - "GET /consents/${consent_std}/grants returns exactly 1 DataScopeGrant with scope == IDENTITY"

      - name: combinatorial_health_threshold_with_aging_and_recovery_reset
        grounds:
          - calculations.institution_health_status
          - state_machines.Institution.ACTIVE_to_DEGRADED
          - state_machines.Institution.DEGRADED_to_ACTIVE
        distinguishing_aspect: |
          Mode (c): institution_health_status is order-sensitive — evaluation
          depends on the pinned order (filter window edges, then recovery reset,
          then >= thresholds): 3 failures make DEGRADED, then aging the clock
          past 86400s drops the count below 3 and flips back to ACTIVE without
          any recover call, proving window re-evaluation precedes thresholding.
        test_recipe:
          setup:
            - "Institution I2 (agreement rate_limit 100), APPROVED BROAD recipient, LOW tier [BALANCE], ACTIVE consent, ACTIVE connection"
            - "Clock at default 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Prairie Trust", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "SavePath", declared_use_case: "savings nudges", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalLow2", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_d", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_d
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_d", consent_id: "${consent_id}", method: "CREDENTIALS", reauth_cooldown_seconds: 0 }
              as: Consumer
              as_user_id: cons_d
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_d
          trigger:
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_d
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_d
            - call: "POST /connections/${conn_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_d
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_d
            - call: "GET /institutions/${inst_id}"
              as: PlatformAdmin
              captures: { status_degraded: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /institutions/${inst_id}"
              as: PlatformAdmin
              captures: { status_aged: $.data.status }
          assert:
            - "After the 3rd INSTITUTION_DOWN event (with a reauth between failures 2 and 3 to reopen the ACTIVE gate), Institution.${inst_id}.status == DEGRADED (3 >= DEGRADED_THRESHOLD, < 5)"
            - "Connection.${conn_id}.status was BROKEN after the 2nd failure, returned to ACTIVE by the reauth, and is ACTIVE after the 3rd failure (consecutive_failures reset semantics)"
            - "After clock advances 86401s, Institution.${inst_id}.status == ACTIVE (all 3 events aged out of the trailing window; order: window filter before threshold)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: non_linear_connection_reauth_cycle
        grounds:
          - state_machines.Connection.ACTIVE_to_REAUTH_REQUIRED
          - state_machines.Connection.REAUTH_REQUIRED_to_ACTIVE
          - calculations.reauth_cooldown_gate
        distinguishing_aspect: |
          Connection machine contains a true cycle ACTIVE -> REAUTH_REQUIRED ->
          ACTIVE: a credential-invalid refresh failure enters REAUTH_REQUIRED
          (with cooldown), reauth before the cooldown instant is rejected, and a
          valid reauth at or after the cooldown returns the connection to ACTIVE.
        test_recipe:
          setup:
            - "ACTIVE connection with reauth_cooldown_seconds = 600 under an ACTIVE [BALANCE] consent; clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cascade Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "Ledgerly", declared_use_case: "bookkeeping", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalLow3", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_e", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_e
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_e", consent_id: "${consent_id}", method: "CREDENTIALS", reauth_cooldown_seconds: 600 }
              as: Consumer
              as_user_id: cons_e
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_e
          trigger:
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "CREDENTIALS_INVALID" }
              as: Consumer
              as_user_id: cons_e
            - call: "POST /connections/${conn_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_e
              captures: { err_cooldown: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:10:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${conn_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_e
              captures: { status_after: $.data.status }
          assert:
            - "After CREDENTIALS_INVALID failure: Connection.status == REAUTH_REQUIRED and reauth_not_before == 2026-09-01T00:10:00Z"
            - "Immediate reauth rejected: error_id == ERR_REAUTH_COOLDOWN (clock 00:00:00 < 00:10:00)"
            - "After clock reaches the cooldown instant, valid reauth succeeds: status == ACTIVE, consecutive_failures == 0, reauth_not_before == null"
            - "A REAUTH_REQUIRED WebhookEvent exists for connection ${conn_id}"

      - name: non_linear_recipient_review_fork_and_appeal_cycle
        grounds:
          - state_machines.Recipient.PENDING_REVIEW_to_REJECTED
          - state_machines.Recipient.REJECTED_to_APPROVED
          - state_machines.Recipient.APPROVED_to_SUSPENDED
          - state_machines.Recipient.SUSPENDED_to_APPROVED
        distinguishing_aspect: |
          Recipient machine is branching with cycles on a different entity:
          PENDING_REVIEW forks to APPROVED or REJECTED, REJECTED loops back to
          APPROVED via appeal, and APPROVED -> SUSPENDED -> APPROVED cycles with
          divergent side-effect sets per branch (suspend revokes consents;
          reinstatement does not restore them).
        test_recipe:
          setup:
            - "Recipient R created by PlatformAdmin admin_1, still PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "ForkPath", declared_use_case: "analytics", minimization_policy: "STANDARD" }
              as: PlatformAdmin
              as_user_id: admin_1
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "REJECT" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
              captures: { st_rej: $.data.status }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_2
              captures: { st_app: $.data.status }
            - call: "POST /recipients/${rec_id}/suspend"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin_2
              captures: { st_sus: $.data.status }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
              captures: { st_rein: $.data.status }
          assert:
            - "REJECT branch: status == REJECTED (reviewer_1 != creator admin_1 passes SoD)"
            - "Appeal cycle REJECTED -> APPROVED succeeds only because reviewer_2 != reviewer_1 (SoD)"
            - "APPROVED -> SUSPENDED by admin_2 succeeds"
            - "Reinstatement SUSPENDED -> APPROVED by reviewer_1 succeeds (reviewer_1 != suspender admin_2)"
            - "A second suspend by admin_2 followed by review-APPROVE from reviewer_1 would repeat the cycle — cycle is unbounded"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_suspend_recipient_revokes_consents_disconnects_connections_emits_webhooks
        grounds:
          - state_machines.Recipient.APPROVED_to_SUSPENDED
          - state_machines.ConsentRecord.ACTIVE_to_REVOKED
          - state_machines.Connection.ACTIVE_to_DISCONNECTED
        distinguishing_aspect: |
          Depth-3 chain from recipient.suspend: Recipient -> SUSPENDED causes
          ConsentRecord -> REVOKED, whose revocation itself causes Connection ->
          DISCONNECTED, whose disconnection emits CONSENT_REVOKED WebhookEvents —
          each link caused by the previous link, not by the suspend directly.
        test_recipe:
          setup:
            - "Recipient R APPROVED with tier [BALANCE, TRANSACTIONS] (MEDIUM)"
            - "Consent C ACTIVE for cons_f with scopes [BALANCE, TRANSACTIONS]"
