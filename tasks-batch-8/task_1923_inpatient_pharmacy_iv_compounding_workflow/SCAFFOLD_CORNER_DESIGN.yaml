              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-DM", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_b}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id, pk_v: $.data.version }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 10, expected_pocket_version: "${pk_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/adc-pockets/${pk_id}/dispense"
              payload: { order_id: "${ord_id}", units: 1 }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DRUG_MISMATCH (422); on_hand stays 10; order remains READY"
      - name: error_substitution_not_pending
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUBSTITUTION_NOT_PENDING]", "validations[priority=32]"]
        distinguishing_aspect: "Substitute call on an order never flagged by an activation -> ERR_SUBSTITUTION_NOT_PENDING (422) even when an ACTIVE protocol exists for its drug."
        test_recipe:
          setup: ["Drug SHORT in_shortage; protocol ACTIVE (no orders existed at activation, so none flagged); order created AFTER activation"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr SN", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat SN", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
