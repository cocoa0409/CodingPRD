        grounds: ["validations[priority=40]", "errors[ERR_CLIENT_NOT_ACTIVE]", "state_machines.Contract.PENDING_SIGNATURE_to_ACTIVE"]
        distinguishing_aspect: "ACTIVATE on a PENDING_SIGNATURE contract whose Client is SUSPENDED answers ERR_CLIENT_NOT_ACTIVE (409); reinstating the client lets the same call through."
        test_recipe:
