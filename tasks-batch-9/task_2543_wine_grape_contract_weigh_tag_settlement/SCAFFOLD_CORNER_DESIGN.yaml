      - name: offer_then_accept_applies_every_declared_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.GrapeContract.lifecycle.DRAFT_to_OFFERED
          - state_machines.GrapeContract.lifecycle.OFFERED_to_ACTIVE
          - calculations.tonnage_cap_derivation
        distinguishing_aspect: |
          The accept edge is the heaviest side-effect bundle in the scaffold: it sets
          cap_scope, derives contract_cap_tons and hard_cap_tons, back-fills the
          allocation's block caps, stamps BOTH renewal window bounds, and cascade-creates
          one PaymentInstallment per plan element in PENDING_SETTLEMENT with
          planned_amount_cents 0. With committed_tons 40.000 and a 10.0 pct tolerance the
          expected caps are exactly 40.000 and 44.000, and with term_end_vintage 2026 and
          termination_notice_days 90 the window is [2026-08-03T00:00:00Z,
          2026-11-01T00:00:00Z). The offer edge also has to honour its optional price
          override: 460000 replaces the 450000 recorded on create.
        test_recipe:
          setup:
            - "A DRAFT TONNAGE contract on an ACTIVE grower with one allocation and a three-element installment plan 40/30/30 at 30/60/90 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-ACCEPT", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2026, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 40.0, due_offset_days: 30, lien_protected: true }, { installment_no: 2, pct_of_settlement: 30.0, due_offset_days: 60, lien_protected: true }, { installment_no: 3, pct_of_settlement: 30.0, due_offset_days: 90, lien_protected: false }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: { base_price_per_ton_cents: 460000 }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "GET /grower-relations/contract-block-allocations/${alloc_id}"
              payload: {}
              as: GrowerRelationsManager
            - call: "GET /grower-relations/payment-installments"
              payload: { contract_id: "${contract_id}" }
              as: AccountsPayableClerk
              captures: { first_planned: "$.data[0].planned_amount_cents", first_status: "$.data[0].status" }
          assert:
            - "The offer call returns 200 with lifecycle_status == \"OFFERED\", offer_round == 1 and base_price_per_ton_cents == 460000 — the override replaced 450000"
            - "The accept call returns 200 with lifecycle_status == \"ACTIVE\"; renewal_status is still \"NOT_DUE\", the other dimension being untouched"
            - "cap_scope == \"PER_CONTRACT\" (basis TONNAGE), contract_cap_tons == 40.000 and hard_cap_tons == 44.000 (40.000 * 1.10, 3 dp)"
            - "renewal_window_closes_at == 2026-11-01T00:00:00Z and renewal_window_opens_at == 2026-08-03T00:00:00Z (90 days earlier)"
            - "The allocation now carries block_cap_tons == 40.000 and block_hard_cap_tons == 44.000, back-filled by the accept even though cap_scope is PER_CONTRACT"
            - "GET /grower-relations/payment-installments reports total_count == 3, one per plan element"
            - "${first_status} == \"PENDING_SETTLEMENT\" and ${first_planned} == 0: the plan is materialised but not yet priced, because pricing happens at settlement-close"
            - "The three rows carry pct_of_settlement 40.0 / 30.0 / 30.0, due_offset_days 30 / 60 / 90 and lien_protected true / true / false, and due_at is still null on all three"

      - name: counter_offer_loop_returns_to_offered_and_carries_the_negotiated_price
        claim_type: cyclic
        grounds:
          - state_machines.GrapeContract.lifecycle.OFFERED_to_COUNTERED
          - state_machines.GrapeContract.lifecycle.COUNTERED_to_OFFERED
          - state_machines.GrapeContract.lifecycle.OFFERED_to_ACTIVE
        distinguishing_aspect: |
          The negotiation is a genuine cycle: OFFERED -> COUNTERED -> OFFERED. Each lap
          bumps offer_round, the counter records the grower's number without applying it,
          and the winery's re-offer is what actually moves base_price_per_ton_cents. The
          third offer must still be legal (offer_round reaching MAX_OFFER_ROUNDS is the
          ceiling, not the third lap), and an accept taken out of the middle of the cycle
          must lock in the LAST offered price, not the first one and not the counter.
        test_recipe:
          setup:
            - "A DRAFT contract at 450000 cents/ton with one allocation on an ACTIVE grower."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-CYCLE", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2026, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/counter"
              payload: { counter_base_price_per_ton_cents: 520000 }
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: { base_price_per_ton_cents: 480000 }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/counter"
              payload: { counter_base_price_per_ton_cents: 500000 }
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: { base_price_per_ton_cents: 495000 }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
          assert:
            - "After the first offer: lifecycle_status == \"OFFERED\", offer_round == 1, base_price_per_ton_cents == 450000 (no override supplied)"
            - "After the first counter: lifecycle_status == \"COUNTERED\", counter_base_price_per_ton_cents == 520000, and base_price_per_ton_cents is STILL 450000 — a counter is a proposal, not a price change"
            - "After the second offer: lifecycle_status is OFFERED again (the cycle closed), offer_round == 2 and base_price_per_ton_cents == 480000"
            - "After the third offer: offer_round == 3 and base_price_per_ton_cents == 495000; the third lap is accepted because MAX_OFFER_ROUNDS has only now been reached"
            - "The accept returns 200 with lifecycle_status == \"ACTIVE\" and base_price_per_ton_cents == 495000 — the last OFFERED price, not 450000 and not the 500000 counter"
            - "counter_base_price_per_ton_cents remains 500000 on the ACTIVE contract as an audit trace and is not used in any §1.3 pricing"

      - name: withdrawn_contract_is_terminal_and_rejects_every_further_trigger
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GrapeContract.lifecycle.OFFERED_to_WITHDRAWN
          - validations.priority_20
          - errors[ERR_CONTRACT_STATE_INVALID]
        distinguishing_aspect: |
          WITHDRAWN is a terminal lifecycle state with no outgoing edges. The corner is
          that the lockdown covers not just re-offer/counter/accept but also the CHILD
          writes that priority 20 gates: an allocation or a sampling visit that would
          have been legal in DRAFT or OFFERED is now refused too, all with the same
          ERR_CONTRACT_STATE_INVALID at 409.
        test_recipe:
          setup:
            - "An OFFERED contract with one allocation, then withdraw-offer. A second block and a crew exist so the child-write attempts fail only on contract state."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
