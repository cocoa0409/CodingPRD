          - entities.Partnership.fields.contract_structure
        distinguishing_aspect: "The two contract structures are mutually exclusive at creation: REVENUE_SHARE with a non-zero fee_schedule_monthly_cents is refused, so no partnership can be born with both economics."
        test_recipe:
