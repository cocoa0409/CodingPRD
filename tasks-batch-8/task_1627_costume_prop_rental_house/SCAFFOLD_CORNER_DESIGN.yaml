            - { call: "POST /rental-house/items", payload: { name: "I08", period: EDWARDIAN, category: SET_DRESSING, size_class: NONE, alteration_policy: PROHIBITED, replacement_value_cents: 90000, base_daily_rate_cents: 800, base_weekly_rate_cents: 4000 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I09", period: ANCIENT, category: PROP, size_class: NONE, alteration_policy: PROHIBITED, replacement_value_cents: 30000, base_daily_rate_cents: 400, base_weekly_rate_cents: 2000 }, as: HouseAdmin }
