  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: directory_endpoint_service_interval_overlap_half_open
        grounds:
          - validations[priority=8]
          - errors[ERR_ENDPOINT_INTERVAL_OVERLAP]
          - entities.DirectoryEndpoint.fields.effective_from
          - entities.DirectoryEndpoint.fields.effective_to
          - calculations.routing_endpoint_selection
        distinguishing_aspect: "Half-open adjacency: DirectoryEndpoint intervals are [effective_from, effective_to), so an endpoint opening exactly at another's effective_to is accepted while one opening one minute earlier is rejected — the adjacency point is NOT a collision."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Pharmacy holds one NEW_RX/BOTH endpoint on the 2022011 standard running [2026-01-01T00:00:00Z, 2026-07-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_closed_id: $.data.id }
          trigger:
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 20, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-06-30T23:59:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 20, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_adjacent_id: $.data.id }
          assert:
            - "the one-minute-earlier grant returns 422 with error_id == ERR_ENDPOINT_INTERVAL_OVERLAP"
            - "the exact-adjacency grant succeeds with 201 — [2026-01-01, 2026-07-01) and [2026-07-01, 2026-12-31) share only the instant 2026-07-01T00:00:00Z, which the half-open rule treats as non-overlapping"
            - "GET /network/directory-endpoints?participant_id=${ph_id} returns exactly 2 rows: ${ep_closed_id} and ${ep_adjacent_id}"
            - "a differently-scoped pair is accepted on the same window: a BENEFIT_COST endpoint does not collide with the NEW_RX one"

      - name: patient_consent_validity_window_overlap_closed_grant
        grounds:
          - validations[priority=10]
          - errors[ERR_CONSENT_INTERVAL_OVERLAP]
          - entities.PatientConsent.fields.expires_at
          - entities.PatientConsent.fields.scope
          - entities.Patient.fields.consent_version
        distinguishing_aspect: "Duration-closed windows: PatientConsent intervals are [granted_at, granted_at + duration_days) with the duration fixed by the request while granted_at is stamped by the server, so a second grant for the same scope always starts inside a still-ACTIVE window and is rejected, and only revoking or letting the window elapse frees the scope."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One patient holds an ACTIVE MEDICATION_HISTORY-scope consent of 365 days, granted at the logical clock, so its window is [2026-09-01T00:00:00Z, 2027-09-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/patients"
              payload: { full_name: "Vera Sandoval", date_of_birth: "1977-02-27T00:00:00Z", home_state: "MA" }
              as: PatientService
              captures: { pa_id: $.data.id, pa_v: $.data.version }
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 365 }
              as: PatientService
              captures: { cns_a_id: $.data.id, cns_a_expires: $.data.expires_at }
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "BENEFIT_CHECK", duration_days: 365 }
              as: PatientService
              captures: { cns_b_id: $.data.id }
          trigger:
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 30 }
              as: PatientService
              captures: { err_same_scope: $.data.error_id }
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "BOTH", duration_days: 30 }
              as: PatientService
              captures: { err_both_scope: $.data.error_id }
          assert:
            - "the same-scope grant returns 422 with error_id == ERR_CONSENT_INTERVAL_OVERLAP"
            - "the BOTH-scope grant against an ACTIVE MEDICATION_HISTORY window ALSO returns 422 with error_id == ERR_CONSENT_INTERVAL_OVERLAP, because BOTH covers MEDICATION_HISTORY"
            - "PatientConsent.${cns_a_id}.expires_at equals ${cns_a_expires} — the rejected grants neither moved nor truncated the live window"
            - "Patient.${pa_id}.consent_version == 2, incremented only by the two accepted grants, not by the two rejections"
            - "the parallel INTERVAL semantics differ from the endpoint rule: this one is duration-closed rather than open-ended because expires_at is pinned at grant time, so revoking is the only way to free the scope before the window elapses"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: fee_entry_reversal_preserves_net_fee_cents
        grounds:
          - state_machines.TransactionFeeEntry.transitions.POSTED_to_REVERSED
          - entities.TransactionFeeEntry.fields.period_net_total_cents
          - entities.TransactionFeeEntry.fields.reversal_of_entry_id
          - calculations.transaction_fee_settlement
        distinguishing_aspect: "Conserved quantity #1 is money: posting a fee entry and then posting its compensating row leaves sum(fee_cents) over ALL entries for the participant and month — status-agnostic — exactly at its pre-charge value, because the compensation carries the negated amount rather than a zeroed one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Northside Family Clinic is a MONTHLY sender holding two POSTED 2026-09 NEW_RX/SENT entries of 3600 and 10800 cents, so the participant's net total for the month is 14400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
              as: NetworkOperator
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 500 }
              as: NetworkOperator
              captures: { e_small_id: $.data.id, net_before: $.data.period_net_total_cents }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 2000 }
              as: NetworkOperator
              captures: { e_big_id: $.data.id, net_peak: $.data.period_net_total_cents }
          trigger:
            - call: "POST /network/transaction-fees/${e_big_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { comp_id: $.data.id, comp_fee: $.data.fee_cents, comp_count: $.data.transaction_count }
            - call: "GET /network/transaction-fees/${e_small_id}"
              payload: {}
              as: NetworkOperator
              captures: { net_after: $.data.period_net_total_cents }
          assert:
            - "TransactionFeeEntry.${e_big_id}.fee_cents == 10800 (1800*12 + 0*7) and the peak net total was 14400"
            - "TransactionFeeEntry.${e_small_id}.fee_cents == 3600 and its period_net_total_cents read 3600 before the second entry"
            - "the compensating row carries fee_cents == -10800 and transaction_count == -2000"
            - "CONSERVED: after the reversal period_net_total_cents is back to 3600 — the value it held before the 10800 charge — so the forward-and-compensating pair leaves the month's net money unchanged"
            - "the status-agnostic sum is what makes this work: ${e_big_id} still contributes +10800 despite status == REVERSED, and the compensating row contributes -10800"
            - "the chargeable volume is untouched: the ANCHOR_ROWS total for the cell is 2450 before and still 2450 after, because the compensating row carries a reversal_of_entry_id"

      - name: attempt_report_correction_preserves_chargeable_transaction_count
        grounds:
          - state_machines.RoutingAttempt.transitions.IN_PROGRESS_to_ACKNOWLEDGED
          - entities.TransactionFeeEntry.fields.transaction_count
          - entities.TransactionFeeEntry.fields.previous_count
          - entities.TransactionFeeEntry.fields.new_count
          - calculations.transaction_fee_settlement
        distinguishing_aspect: "Conserved quantity #2 is a count rather than money: reporting the same prescription twice on the same billing cell must leave the cell's chargeable transaction_count at one, which the CORRECTION row achieves by recording previous_count and new_count rather than by flipping a re-route into a second charge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Pharmacy holds two in-window NEW_RX endpoints and is CERTIFIED. One prescription has already been routed to and acknowledged by the first endpoint, so its sending cell holds one PARTIAL accrual of transaction_count 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
              as: NetworkOperator
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id, ph_v: $.data.version }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_B", sla_response_minutes: 30, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certify"
              payload: { expected_participant_version: "${ph_v}" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${cl_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certify"
              payload: { expected_participant_version: "${cl_v}" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/patients"
              payload: { full_name: "Greta Lindholm", date_of_birth: "1962-04-04T00:00:00Z", home_state: "MA" }
              as: PatientService
              captures: { pa_id: $.data.id }
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 3 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v0: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v0}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "GET /network/prescriptions/${rx_id}/attempts"
              payload: {}
              as: NetworkOperator
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /network/routing-attempts/${a1_id}/report-acknowledged"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT" }
              as: NetworkOperator
              captures: { cell_id: $.data.id, cell_count_before: $.data.transaction_count }
          trigger:
            - call: "GET /network/prescriptions/${rx_id}"
              payload: {}
              as: NetworkOperator
              captures: { v_before: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v_before}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "GET /network/prescriptions/${rx_id}/attempts"
              payload: {}
              as: NetworkOperator
              captures: { a2_id: "$.data[1].id" }
            - call: "POST /network/routing-attempts/${a2_id}/report-acknowledged"
              payload: {}
              as: NetworkOperator
              captures: { correction_id: $.data.correction_entry_id }
          assert:
            - "the first acknowledged report created a PARTIAL accrual of transaction_count 1 and a fee_cents of 0 on the clinic's 2026-09 NEW_RX/SENT cell"
            - "TransactionFeeEntry.${cell_id}.transaction_count == ${cell_count_before} before the second report"
            - "CONSERVED: after the second report the same cell's ANCHOR_ROWS total is still 1, not 2 — the second report produced TransactionFeeEntry.${correction_id} with entry_type == CORRECTION, previous_count == 1 and new_count == 2, which supersedes rather than adds"
            - "the report response carries correction_entry_id == ${correction_id}, proving the operator can observe which correction settled the double count"
            - "the money side is untouched by the correction: the cell's period_net_total_cents is unchanged because both the accrual and the correction carry fee_cents == 0"
            - "Prescription.${rx_id}.routing_attempt_count == 2 — two attempts really were made, which is exactly why the count must be conserved at the billing cell rather than at the attempt table"
