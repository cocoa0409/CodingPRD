          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
          trigger:
            - *c_veh1
            - call: "GET /evfleet/suppliers/${sup_id}/battery-modules"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { m1_status: "$.data[0].quality_status" }
            - call: "GET /evfleet/vehicle-orders/${ord_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { o_count: $.data.registered_count, o_status: $.data.status }
          assert:
