      - name: pcard_grant_reconcile_allowability_and_compensation
        claim_type: derived_field_reconciliation
        grounds: ["calculations.grant_budget_ledger", "state_machines.PCardTransaction.DISPUTED_to_REVERSED", "errors", "ERR_GRANT_CATEGORY_NOT_ALLOWABLE", "errors", "ERR_GRANT_BUDGET_EXCEEDED"]
        distinguishing_aspect: "Grant-funded P-card reconciliation composes three rules: the allowability check (category + provisional remaining) gates the write, the reconciled amount lands directly in grant.spent_cents (no encumbrance phase for P-cards), and a cardholder-favor reversal compensates spent back to zero."
        test_recipe:
          setup: ["Grant 50,000 (SUPPLIES only); card; txn T1 40,000 reconciled to GRANT/SUPPLIES; txn T2 60,000 attempts GRANT/TRAVEL then GRANT/SUPPLIES"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Recon", cost_center: "CC-5500", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "G-PC", sponsor: "NSF", total_award_cents: 50000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Quinn", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 40000, entry_type: "DEBIT", merchant_name: "Lab", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 60000, entry_type: "DEBIT", merchant_name: "Lab", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /pcard-transactions/${t1_id}/reconcile"
              payload: { receipt_reference: "rcpt-g1", allocation_type: "GRANT", grant_id: "${g_id}", cost_category: "SUPPLIES" }
              as: Cardholder
              as_user_id: "${pc_id}"
          trigger:
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { s_1: $.data.spent_cents, prov_1: $.data.provisional_remaining_cents }
            - call: "POST /pcard-transactions/${t2_id}/reconcile"
              payload: { receipt_reference: "rcpt-g2", allocation_type: "GRANT", grant_id: "${g_id}", cost_category: "TRAVEL" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /pcard-transactions/${t2_id}/reconcile"
              payload: { receipt_reference: "rcpt-g2", allocation_type: "GRANT", grant_id: "${g_id}", cost_category: "SUPPLIES" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /pcard-transactions/${t1_id}/dispute"
              payload: { reason: "double-billed" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcard-transactions/${t1_id}/resolve-dispute"
              payload: { outcome: "CARDHOLDER_FAVOR" }
              as: ProcurementAdmin
              captures: { t1_status: $.data.status }
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { s_2: $.data.spent_cents, prov_2: $.data.provisional_remaining_cents }
          assert:
            - "after T1 reconcile: grant spent_cents == 40000 and provisional_remaining_cents == 10000 (P-card spend books directly to spent, no encumbrance phase)"
            - "T2 as GRANT/TRAVEL: err1 == ERR_GRANT_CATEGORY_NOT_ALLOWABLE"
            - "T2 as GRANT/SUPPLIES: err2 == ERR_GRANT_BUDGET_EXCEEDED (60,000 > provisional remaining 10,000)"
            - "T1 reversed via dispute: transaction REVERSED and grant spent_cents == 0, provisional_remaining_cents == 50000 (full compensation, no drift)"

  - section: consistency_model
    instances:
      - name: immediate_consistency_side_effects_visible
        claim_type: immediate_consistency
        grounds: ["complexity_profile", "calculations.grant_budget_ledger"]
        distinguishing_aspect: "Immediate model: the approve-step response itself carries status APPROVED, and the very next read shows the encumbrance; a receipt post is likewise visible on the PO read with no lag or reconciliation window."
        test_recipe:
          setup: ["Department; vendor; grant 5,000,000 (SUPPLIES); grant requisition 1,000,000 submitted and DEPARTMENT-approved"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Imm", cost_center: "CC-5600", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "ImmCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "G-IMM", sponsor: "NIH", total_award_cents: 5000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "IMM", description: "scope", quantity: 1, unit_price_cents: 1000000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
          trigger:
            - call: "POST /requisitions/${r_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
              captures: { r_status: $.data.status }
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { enc: $.data.encumbered_cents }
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "final approve-step response body already shows status == APPROVED (no polling needed)"
            - "immediately after: budget-ledger encumbered_cents == 1520000 (charge 1,000,000 + 520,000 indirect visible in the same request chain)"
            - "immediately after the receipt post: PO read shows fulfillment_status == FULLY_RECEIVED"
