              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/members/${m}/verify"
              payload: {}
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /api/dues-invoices/${inv}/refund"
              payload: {}
              as: MembershipAdministrator
            - call: "GET /api/members/${m}"
              payload: {}
              as: MembershipAdministrator
              captures: { dues: $.data.lifetime_dues_paid_cents }
          assert:
            - "Member.${m}.lifetime_dues_paid_cents == 0 (settle +120000, refund -120000, net zero)"

      - name: benefit_entitlement_count_conserved_under_suspend_restore_cycle
        grounds:
          - calculations.benefit_suspension_propagation
          - entities.BenefitEntitlement
        distinguishing_aspect: |
          Conserved quantity = count of BenefitEntitlement rows per
          member. Forward action = Member -> GRACE (entitlements flip
          ACTIVE -> SUSPENDED, count unchanged); compensating action =
          renewal payment settles, Member -> ACTIVE (entitlements flip
          SUSPENDED -> ACTIVE, count unchanged). No entitlement row
          created or destroyed across the cycle. Different conserved
          quantity type from instance 1 (count vs cents).
        test_recipe:
          setup:
            - "Category PROF (grace=30), chapter, ANNIVERSARY policy, schedule published"
            - "Member M joined, settled, ACTIVE — five default BenefitEntitlement rows created (JOURNAL_ACCESS, CONFERENCE_DISCOUNT, CERTIFICATION_REGISTRY, VOTING_BALLOT, DIRECTORY_LISTING)"
            - "Clock advanced past current_period_end; scheduler runs -> Member GRACE; entitlements SUSPENDED"
          setup_api_calls:
