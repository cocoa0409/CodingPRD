scenario: |
  1032. Outdoor & Camping Co-op Store (REI style): SKU & gear-rental linkage,
  co-op membership & dividend, used-gear trade-in/resale, class/trip & guiding,
  repair/warranty, permit/pass sales, loyalty, special order

domain_name: outdoor-camping-coop
api_prefix: /coop

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities under a shared /coop namespace, wired by explicit foreign keys
  # (no ownership nesting in URL paths). Members, Products, RentalUnits, Trips,
  # Guides, etc. are all top-level collections referencing one another by FK.

  state_machine_shape: cyclic
  # TradeIn runs a bounded negotiation loop (OFFERED<->COUNTERED); RentalUnit
  # (AVAILABLE<->RENTED_OUT<->OUT_OF_SERVICE) and Member (ACTIVE<->LAPSED) cycle;
  # RepairOrder carries two independent parallel state dimensions.

  relationship_patterns:
    - one_to_many          # Product -> RentalUnit, Member -> Purchase/Reservation/Booking
    - many_to_many         # Member <-> Trip via TripBooking
    - cross_aggregate      # RentalReservation references both Member and RentalUnit

  role_model: peer_roles
  # Member acts on own resources; StoreStaff runs POS/rental/repair/trade-in desk;
  # Guide is entity-backed and reads assigned trips; CoopAdmin owns catalog,
  # dividends, and the logical clock. Admin is an operational superset for setup.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/contact email; unique across members" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: membership_tier, type: enum, source: input, default: "BASIC", description: "BASIC | PREMIER; PREMIER pays a higher join fee and earns a rental discount" }
      - { name: membership_status, type: enum, source: system, description: "PENDING | ACTIVE | LAPSED | CLOSED; starts PENDING at register" }
      - { name: join_fee_cents, type: integer, source: computed, description: "Read-only: BASIC=3000, PREMIER=12000 per membership_tier at registration" }
      - { name: loyalty_points_balance, type: integer, source: computed, description: "Read-only: sum of LoyaltyLedger.delta for this member (see loyalty_points_conservation); starts 0" }
      - { name: eligible_spend_cents, type: integer, source: computed, description: "Read-only: sum of Purchase.eligible_spend_cents over this member's COMPLETED purchases in the current dividend year (Jan 1 – Dec 31 of the logical clock's year); starts 0" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Read-only: store-credit balance in cents; credited by trade-in CREDIT payouts, trip-booking refunds, and admin adjustments; starts 0" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code; unique across products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "TENT | SLEEPING | COOKING | APPAREL | CLIMBING | PADDLE" }
      - { name: retail_price_cents, type: integer, source: input, description: "Shelf retail price in cents; also the trade-in valuation base" }
      - { name: tax_rate, type: number, source: input, description: "Sales-tax rate applied per line at purchase, e.g. 0.05" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Full replacement cost; caps a single rental fee" }
      - { name: is_rentable, type: boolean, source: input, default: false, description: "Whether physical RentalUnits may be created for this product" }
      - { name: base_daily_rate_cents, type: integer, source: input, default: 0, description: "Per-day rental rate in cents; required (>0) when is_rentable=true" }

  - name: RentalUnit
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the rentable SKU this physical unit instantiates" }
      - { name: asset_tag, type: string, source: input, description: "Physical asset label; unique across units" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RENTED_OUT | OUT_OF_SERVICE; starts AVAILABLE (physical-possession status; reservations hold windows, not the unit)" }
      - { name: condition, type: enum, source: system, default: "GOOD", description: "GOOD | DAMAGED; set DAMAGED on a damaged return" }

  - name: RentalReservation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the reserving member" }
      - { name: rental_unit_id, type: string, source: input, description: "FK -> RentalUnit.id; the physical unit held" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; copied from the unit at reservation time" }
      - { name: start_date, type: string, source: input, description: "Rental window start (ISO 8601 date-time, inclusive)" }
      - { name: end_date, type: string, source: input, description: "Rental window end (ISO 8601 date-time, exclusive of occupancy; buffer applies after)" }
      - { name: rental_days, type: integer, source: computed, description: "Read-only: ceil((end_date - start_date) in days), minimum 1" }
      - { name: status, type: enum, source: system, description: "RESERVED | PICKED_UP | RETURNED | DAMAGE_ASSESSED | CLOSED | CANCELLED; starts RESERVED" }
      - { name: rental_fee_cents, type: integer, source: computed, description: "Read-only: output of rental_fee_cents calc, pinned at reservation create" }

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Trip/class title" }
      - { name: guide_id, type: string, source: system, description: "FK -> Guide.id; assigned guide, null until assign-guide" }
      - { name: start_time, type: string, source: input, description: "Trip start (ISO 8601 date-time, inclusive)" }
      - { name: end_time, type: string, source: input, description: "Trip end (ISO 8601 date-time, inclusive)" }
      - { name: capacity, type: integer, source: input, description: "Maximum confirmed seats (>0)" }
      - { name: seats_confirmed, type: integer, source: computed, description: "Read-only: count of TripBooking with status IN {CONFIRMED, CHECKED_IN} for this trip; starts 0" }
      - { name: price_cents, type: integer, source: input, description: "Per-seat trip price in cents" }
      - { name: required_certification, type: enum, source: input, default: "NONE", description: "NONE | SWIFTWATER | ALPINE | WILDERNESS_FIRST_AID; a guide must hold this to be assigned" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | DEPARTED | COMPLETED | CANCELLED; starts DRAFT. Capacity is enforced by rejecting bookings (ERR_TRIP_FULL) while the trip stays OPEN — there is no FULL status" }

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Guide full name" }
      - { name: certifications, type: array, source: input, default: [], description: "List of held certification enums drawn from {SWIFTWATER, ALPINE, WILDERNESS_FIRST_AID}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE" }

  - name: TripBooking
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; the booked trip" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the booking member" }
      - { name: price_paid_cents, type: integer, source: computed, description: "Read-only: Trip.price_cents captured at booking time" }
      - { name: points_redeemed, type: integer, source: input, default: 0, description: "Loyalty points the member spends on this booking (1 point = 1 cent off wallet-charge)" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED; starts CONFIRMED" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member trading gear in" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the model being traded in (valuation base)" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C; grade drives valuation factor" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | OFFERED | COUNTERED | ACCEPTED | REJECTED; starts SUBMITTED" }
      - { name: offered_cash_cents, type: integer, source: computed, description: "Read-only: cash-payout variant from trade_in_valuation; set on offer" }
      - { name: offered_credit_cents, type: integer, source: computed, description: "Read-only: store-credit-payout variant from trade_in_valuation; set on offer" }
      - { name: counter_ask_cents, type: integer, source: input, required: false, description: "Member's counter figure; recorded on counter, non-binding" }
      - { name: rounds, type: integer, source: system, default: 0, description: "Number of completed OFFERED->COUNTERED loops; capped at MAX_TRADE_IN_ROUNDS" }
      - { name: accepted_payout_type, type: enum, source: input, required: false, description: "CASH | CREDIT; chosen on accept" }
      - { name: accepted_payout_cents, type: integer, source: computed, description: "Read-only: offered_cash_cents or offered_credit_cents per accepted_payout_type" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner requesting the repair" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the model under repair (warranty base)" }
      - { name: rental_unit_id, type: string, source: input, required: false, description: "FK -> RentalUnit.id; set when auto-created from a damaged rental return, else null" }
      - { name: purchase_date, type: string, source: input, description: "When the item was originally bought (ISO 8601 date); warranty window anchor" }
      - { name: repair_stage, type: enum, source: system, description: "RECEIVED | DIAGNOSED | IN_REPAIR | READY | PICKED_UP; parallel dimension 1, starts RECEIVED" }
      - { name: billing_stage, type: enum, source: system, description: "UNBILLED | INVOICED | SETTLED; parallel dimension 2, starts UNBILLED" }
      - { name: warranty_status, type: enum, source: system, default: "UNDETERMINED", description: "UNDETERMINED | COVERED | DENIED; decided at diagnose" }
      - { name: labor_cents, type: integer, source: input, default: 0, description: "Quoted labor charge, entered at diagnose" }
      - { name: parts_cents, type: integer, source: input, default: 0, description: "Quoted parts charge, entered at diagnose" }
      - { name: billed_cents, type: integer, source: computed, description: "Read-only: 0 if warranty_status=COVERED else labor_cents+parts_cents" }

  - name: Pass
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; pass holder" }
      - { name: pass_type, type: enum, source: input, description: "DAY | SEASON | ANNUAL permit/pass" }
      - { name: valid_from, type: string, source: input, description: "Validity start (ISO 8601 date-time, inclusive)" }
      - { name: valid_to, type: string, source: input, description: "Validity end (ISO 8601 date-time, exclusive)" }
      - { name: price_cents, type: integer, source: input, description: "Pass price in cents" }
      - { name: coverage_status, type: enum, source: computed, description: "Read-only: PENDING if clock<valid_from, ACTIVE if valid_from<=clock<valid_to, EXPIRED if clock>=valid_to, VOID if voided" }
      - { name: voided, type: boolean, source: system, default: false, description: "True once voided; forces coverage_status=VOID" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; requesting member" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; catalog item to special-order" }
      - { name: quantity, type: integer, source: input, description: "Units requested (>0)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | QUOTED | CONFIRMED | FULFILLED | CANCELLED; starts REQUESTED" }
      - { name: quoted_price_cents, type: integer, source: system, description: "Latest quote total in cents; null until first quote; superseded by each new quote" }
      - { name: deposit_cents, type: integer, source: computed, description: "Read-only: floor(quoted_price_cents * SPECIAL_ORDER_DEPOSIT_PCT) at confirm" }

  - name: Purchase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; buyer" }
      - { name: line_items, type: array, source: input, description: "Array of {product_id, quantity, unit_price_cents}; quantity>0" }
      - { name: points_redeemed, type: integer, source: input, default: 0, description: "Loyalty points spent on this purchase (1 point = 1 cent), capped by redemption rule" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only: sum of unit_price_cents*quantity across lines" }
      - { name: tax_cents, type: integer, source: computed, description: "Read-only: sum of per-line round_half_up(line_subtotal*product.tax_rate) — per-line rounding pinned" }
      - { name: loyalty_redemption_cents, type: integer, source: computed, description: "Read-only: min(points_redeemed, floor(MAX_REDEEM_PCT*subtotal_cents))" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only: subtotal_cents + tax_cents - loyalty_redemption_cents" }
      - { name: loyalty_points_earned, type: integer, source: computed, description: "Read-only: floor(eligible_spend_cents * POINTS_PER_CENT)" }
      - { name: eligible_spend_cents, type: integer, source: computed, description: "Read-only: subtotal_cents (pre-tax, before redemption) — the dividend-eligible amount" }
      - { name: status, type: enum, source: system, description: "COMPLETED | REFUNDED; starts COMPLETED" }

  - name: DividendDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Dividend fiscal year, e.g. 2026; unique across declarations" }
      - { name: declared_rate, type: number, source: input, description: "Final dividend rate applied to eligible_spend, e.g. 0.08" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED; starts DRAFT" }
      - { name: total_payout_cents, type: integer, source: computed, description: "Read-only: sum of per-member final_dividend_cents over eligible members; set at finalize" }
      - { name: payouts, type: array, source: computed, description: "Read-only: array of {member_id, eligible_spend_cents, final_dividend_cents} for members with eligible_spend_cents >= MIN_ELIGIBLE_SPEND_CENTS; set at finalize" }

  - name: LoyaltyLedger
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: delta, type: integer, source: system, description: "Signed points change (+earn, -redeem, +reversal)" }
      - { name: reason, type: enum, source: system, description: "PURCHASE_EARN | PURCHASE_REDEEM | BOOKING_REDEEM | BOOKING_REFUND | PURCHASE_REFUND_REVERSAL" }
      - { name: ref_id, type: string, source: system, required: false, description: "Id of the Purchase/TripBooking that produced this entry" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /coop/members/{id}/activate"
        actor: StoreStaff
        preconditions:
          - "Member.membership_status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "membership_status = ACTIVE"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /coop/members/{id}/lapse"
        actor: CoopAdmin
        preconditions:
          - "Member.membership_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "membership_status = LAPSED"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /coop/members/{id}/reactivate"
        actor: StoreStaff
        preconditions:
          - "Member.membership_status == LAPSED (else ERR_INVALID_STATE)"
        side_effects:
          - "membership_status = ACTIVE (cycle: ACTIVE<->LAPSED)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /coop/members/{id}/close"
        actor: CoopAdmin
        preconditions:
          - "Member.membership_status IN {ACTIVE, LAPSED} (else ERR_INVALID_STATE)"
        side_effects:
          - "membership_status = CLOSED"

  - entity: RentalUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RENTED_OUT
        trigger: "POST /coop/reservations/{id}/pickup (system side-effect)"
        actor: system
        preconditions:
          - "linked RentalReservation.status == RESERVED"
          - "RentalUnit.status == AVAILABLE"
        side_effects:
          - "status = RENTED_OUT (unit-count conserved: AVAILABLE -> RENTED_OUT)"
      - from: RENTED_OUT
        to: AVAILABLE
        trigger: "POST /coop/reservations/{id}/return with condition=GOOD (system side-effect)"
        actor: system
        preconditions:
          - "linked RentalReservation.status == PICKED_UP"
        side_effects:
          - "status = AVAILABLE (cycle back; unit-count conserved)"
      - from: RENTED_OUT
        to: OUT_OF_SERVICE
        trigger: "POST /coop/reservations/{id}/return with condition=DAMAGED (system side-effect)"
        actor: system
        preconditions:
          - "linked RentalReservation.status == PICKED_UP"
        side_effects:
          - "status = OUT_OF_SERVICE; condition = DAMAGED"
          - "CASCADE hop2: auto-create RepairOrder(rental_unit_id=this, repair_stage=RECEIVED, billing_stage=UNBILLED)"
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /coop/rental-units/{id}/service with action=RESTORE"
        actor: StoreStaff
        preconditions:
          - "RentalUnit.status == OUT_OF_SERVICE (else ERR_INVALID_STATE)"
        side_effects:
          - "status = AVAILABLE; condition = GOOD"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /coop/rental-units/{id}/service with action=RETIRE"
        actor: StoreStaff
        preconditions:
          - "RentalUnit.status == AVAILABLE (else ERR_INVALID_STATE)"
        side_effects:
          - "status = OUT_OF_SERVICE"

  - entity: RentalReservation
    initial_state: RESERVED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RESERVED
        to: PICKED_UP
        trigger: "POST /coop/reservations/{id}/pickup"
        actor: StoreStaff
        preconditions:
          - "RentalReservation.status == RESERVED (else ERR_INVALID_STATE)"
          - "RentalUnit.status == AVAILABLE (unit not currently out or OOS)"
        side_effects:
          - "status = PICKED_UP"
          - "RentalUnit.status AVAILABLE -> RENTED_OUT"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /coop/reservations/{id}/cancel"
        actor: Member
        preconditions:
          - "RentalReservation.status == RESERVED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED (window released; unit status unaffected)"
      - from: PICKED_UP
        to: RETURNED
        trigger: "POST /coop/reservations/{id}/return with condition=GOOD"
        actor: StoreStaff
        preconditions:
          - "RentalReservation.status == PICKED_UP (else ERR_INVALID_STATE)"
        side_effects:
          - "status = RETURNED then CLOSED"
          - "RentalUnit.status RENTED_OUT -> AVAILABLE"
      - from: RETURNED
        to: CLOSED
        trigger: "system (auto on good return)"
        actor: system
        preconditions:
          - "RentalReservation.status == RETURNED"
        side_effects:
          - "status = CLOSED"
      - from: PICKED_UP
        to: DAMAGE_ASSESSED
        trigger: "POST /coop/reservations/{id}/return with condition=DAMAGED"
        actor: StoreStaff
        preconditions:
          - "RentalReservation.status == PICKED_UP (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop1: status = DAMAGE_ASSESSED; RentalUnit.status RENTED_OUT -> OUT_OF_SERVICE (drives unit hop2 RepairOrder create)"

  - entity: Trip
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /coop/trips/{id}/open"
        actor: CoopAdmin
        preconditions:
          - "Trip.status == DRAFT (else ERR_INVALID_STATE)"
          - "Trip.guide_id is not null (a guide must be assigned first)"
        side_effects:
          - "status = OPEN"
      - from: OPEN
        to: DEPARTED
        trigger: "POST /coop/trips/{id}/depart"
        actor: CoopAdmin
        preconditions:
          - "Trip.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "status = DEPARTED"
      - from: DEPARTED
        to: COMPLETED
        trigger: "POST /coop/trips/{id}/complete"
        actor: CoopAdmin
        preconditions:
          - "Trip.status == DEPARTED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = COMPLETED; every TripBooking with status == CHECKED_IN -> COMPLETED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /coop/trips/{id}/cancel"
        actor: CoopAdmin
        preconditions:
          - "Trip.status IN {DRAFT, OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop1: status = CANCELLED; every TripBooking with status IN {CONFIRMED, CHECKED_IN} -> CANCELLED (drives booking hop2)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /coop/trips/{id}/cancel"
        actor: CoopAdmin
        preconditions:
          - "Trip.status IN {DRAFT, OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED (no bookings exist on a DRAFT trip)"

  - entity: TripBooking
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /coop/trip-bookings/{id}/check-in"
        actor: StoreStaff
        preconditions:
          - "TripBooking.status == CONFIRMED (else ERR_INVALID_STATE)"
          - "Trip.status == DEPARTED"
        side_effects:
          - "status = CHECKED_IN"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (auto when Trip -> COMPLETED)"
        actor: system
        preconditions:
          - "TripBooking.status == CHECKED_IN"
        side_effects:
          - "status = COMPLETED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /coop/trip-bookings/{id}/cancel OR Trip cancel cascade"
        actor: Member
        preconditions:
          - "TripBooking.status == CONFIRMED (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop2: status = CANCELLED; append LoyaltyLedger(delta=+points_redeemed, reason=BOOKING_REFUND); wallet_credit_cents += (price_paid_cents - points_redeemed) (drives member hop3 recompute)"
          - "Trip.seats_confirmed recomputed (drops by 1)"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "Trip cancel cascade"
        actor: system
        preconditions:
          - "parent Trip.status transitioning to CANCELLED"
        side_effects:
          - "CASCADE hop2: status = CANCELLED; append LoyaltyLedger(delta=+points_redeemed, reason=BOOKING_REFUND); wallet_credit_cents += (price_paid_cents - points_redeemed)"

  - entity: TradeIn
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: OFFERED
        trigger: "POST /coop/trade-ins/{id}/offer"
        actor: StoreStaff
        preconditions:
          - "TradeIn.status IN {SUBMITTED, COUNTERED} (else ERR_INVALID_STATE)"
        side_effects:
          - "compute offered_cash_cents and offered_credit_cents via trade_in_valuation; status = OFFERED"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /coop/trade-ins/{id}/counter"
        actor: Member
        preconditions:
          - "TradeIn.status == OFFERED (else ERR_INVALID_STATE)"
          - "rounds < MAX_TRADE_IN_ROUNDS (else ERR_TRADE_IN_ROUNDS_EXCEEDED)"
        side_effects:
          - "rounds += 1; record counter_ask_cents; status = COUNTERED (cycle OFFERED<->COUNTERED)"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /coop/trade-ins/{id}/offer"
        actor: StoreStaff
        preconditions:
          - "TradeIn.status IN {SUBMITTED, COUNTERED} (else ERR_INVALID_STATE)"
        side_effects:
          - "recompute offered_cash_cents and offered_credit_cents; status = OFFERED (loop)"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /coop/trade-ins/{id}/accept"
        actor: Member
        preconditions:
          - "TradeIn.status == OFFERED (else ERR_INVALID_STATE)"
          - "accepted_payout_type IN {CASH, CREDIT}"
        side_effects:
          - "accepted_payout_cents = offered_cash_cents if CASH else offered_credit_cents; status = ACCEPTED"
          - "if CREDIT: Member.wallet_credit_cents += accepted_payout_cents"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /coop/trade-ins/{id}/reject"
        actor: Member
        preconditions:
          - "TradeIn.status IN {OFFERED, COUNTERED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status = REJECTED"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /coop/trade-ins/{id}/reject"
        actor: Member
        preconditions:
          - "TradeIn.status IN {OFFERED, COUNTERED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status = REJECTED"

  - entity: RepairOrder
    initial_state: RECEIVED
    terminal_states: [PICKED_UP]
    transitions:
      - from: RECEIVED
        to: DIAGNOSED
        trigger: "POST /coop/repair-orders/{id}/diagnose"
        actor: StoreStaff
        preconditions:
          - "RepairOrder.repair_stage == RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "record labor_cents, parts_cents; set warranty_status COVERED if (clock - purchase_date) <= WARRANTY_DAYS else DENIED; recompute billed_cents; repair_stage = DIAGNOSED (parallel dim 1)"
      - from: DIAGNOSED
        to: IN_REPAIR
        trigger: "POST /coop/repair-orders/{id}/start"
        actor: StoreStaff
        preconditions:
          - "RepairOrder.repair_stage == DIAGNOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "repair_stage = IN_REPAIR; if billed_cents>0 then billing_stage UNBILLED -> INVOICED (parallel dim 2 advances independently)"
      - from: IN_REPAIR
        to: READY
        trigger: "POST /coop/repair-orders/{id}/ready"
        actor: StoreStaff
        preconditions:
          - "RepairOrder.repair_stage == IN_REPAIR (else ERR_INVALID_STATE)"
        side_effects:
          - "repair_stage = READY"
      - from: READY
        to: PICKED_UP
        trigger: "POST /coop/repair-orders/{id}/pickup"
        actor: StoreStaff
        preconditions:
          - "RepairOrder.repair_stage == READY (else ERR_INVALID_STATE)"
          - "billing_stage == SETTLED OR billed_cents == 0 (else ERR_REPAIR_UNSETTLED)"
        side_effects:
          - "repair_stage = PICKED_UP"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /coop/repair-orders/{id}/settle (billing dimension)"
        actor: StoreStaff
        preconditions:
          - "RepairOrder.billing_stage == INVOICED (else ERR_INVALID_STATE)"
        side_effects:
          - "billing_stage = SETTLED (independent of repair_stage)"

  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /coop/special-orders/{id}/quotes"
        actor: StoreStaff
        preconditions:
          - "SpecialOrder.status IN {REQUESTED, QUOTED} (else ERR_INVALID_STATE)"
          - "expected_special_order_version matches SpecialOrder.version (else ERR_STALE_VERSION)"
        side_effects:
          - "quoted_price_cents = payload quoted_price_cents (supersedes prior quote); status = QUOTED"
          - "increments SpecialOrder.version by 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /coop/special-orders/{id}/confirm"
        actor: Member
        preconditions:
          - "SpecialOrder.status == QUOTED (else ERR_INVALID_STATE)"
          - "Member.wallet_credit_cents >= floor(quoted_price_cents * SPECIAL_ORDER_DEPOSIT_PCT) (else ERR_INSUFFICIENT_WALLET)"
        side_effects:
          - "deposit_cents = floor(quoted_price_cents * SPECIAL_ORDER_DEPOSIT_PCT); Member.wallet_credit_cents -= deposit_cents; status = CONFIRMED"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /coop/special-orders/{id}/fulfill"
        actor: StoreStaff
        preconditions:
          - "SpecialOrder.status == CONFIRMED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = FULFILLED (vendor order placed, received, and handed over)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /coop/special-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "SpecialOrder.status IN {REQUESTED, QUOTED, CONFIRMED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED; if deposit_cents>0 refund Member.wallet_credit_cents += deposit_cents"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /coop/special-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "SpecialOrder.status IN {REQUESTED, QUOTED, CONFIRMED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /coop/special-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "SpecialOrder.status IN {REQUESTED, QUOTED, CONFIRMED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED; refund deposit to Member.wallet_credit_cents"

  - entity: Purchase
    initial_state: COMPLETED
    terminal_states: [REFUNDED]
    transitions:
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /coop/purchases/{id}/refund"
        actor: StoreStaff
        preconditions:
          - "Purchase.status == COMPLETED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = REFUNDED"
          - "append LoyaltyLedger(delta=-loyalty_points_earned, reason=PURCHASE_REFUND_REVERSAL); if points_redeemed>0 append LoyaltyLedger(delta=+loyalty_redemption_cents, reason=PURCHASE_REFUND_REVERSAL)"
          - "Member.eligible_spend_cents recomputed (this purchase no longer COMPLETED)"

  - entity: DividendDeclaration
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /coop/dividend-declarations/{id}/finalize"
        actor: CoopAdmin
        preconditions:
          - "DividendDeclaration.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "for each Member with eligible_spend_cents >= MIN_ELIGIBLE_SPEND_CENTS: final_dividend_cents = floor(eligible_spend_cents * declared_rate), credited to wallet_credit_cents"
          - "payouts and total_payout_cents pinned; status = FINALIZED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: special-order-requote-stale
    parent_entity: SpecialOrder
    write_endpoint: "POST /coop/special-orders/{id}/quotes"
    occ_field: "expected_special_order_version"
    description: |
      Issuing a new quote against a SpecialOrder whose version has advanced since
      the client last observed it is rejected. A new quote legitimately supersedes
      the prior one under the state machine (REQUESTED/QUOTED -> QUOTED), so a
      staffer working from a stale view of the order would otherwise silently
      overwrite a newer quote; OCC on SpecialOrder.version turns that into a
      deterministic stale-version rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_fee_cents
    trigger: "POST /coop/reservations (reservation create)"
    algorithm: threshold
    formula: |
      # Rule 2 mode (a): >=3 inputs, non-linear (multiplier + tiered discount + min cap).
      rental_days   = max(1, ceil((end_date - start_date) in whole days))
      raw           = product.base_daily_rate_cents * rental_days
      is_peak       = (PEAK_START <= start_date < PEAK_END)
      peak_adjusted = round_half_up(raw * PEAK_MULTIPLIER) if is_peak else raw
      tier_disc     = TIER_RENTAL_DISCOUNT[member.membership_tier]   # BASIC 0.00, PREMIER 0.10
      discounted    = round_half_up(peak_adjusted * (1 - tier_disc))
      rental_fee_cents = min(discounted, product.replacement_value_cents)   # cap at replacement value
      # Evaluation order pinned: raw -> peak -> discount -> round -> cap.
    input_set: "Single reservation; member.membership_tier and product fields at create time."
    constants:
      PEAK_START: "2026-06-01T00:00:00Z"
      PEAK_END: "2026-09-01T00:00:00Z"
      PEAK_MULTIPLIER: 1.25
      TIER_RENTAL_DISCOUNT: { BASIC: 0.00, PREMIER: 0.10 }
    precision: "integer cents, round_half_up at each pinned rounding step"

  - name: purchase_totals
    trigger: "POST /coop/purchases (purchase create)"
    algorithm: aggregation
    formula: |
      # Rule 2 mode (b): per-line tax rounding ORDER is pinned.
      for each line i: line_subtotal_i = line.unit_price_cents * line.quantity
      subtotal_cents = sum(line_subtotal_i)
      for each line i: line_tax_i = round_half_up(line_subtotal_i * product_i.tax_rate)  # round PER LINE
      tax_cents = sum(line_tax_i)                                                          # THEN sum
      loyalty_redemption_cents = min(points_redeemed, floor(MAX_REDEEM_PCT * subtotal_cents))
      total_cents = subtotal_cents + tax_cents - loyalty_redemption_cents
      eligible_spend_cents = subtotal_cents                    # pre-tax, before redemption
      loyalty_points_earned = floor(eligible_spend_cents * POINTS_PER_CENT)
      # Sum-then-round on tax is explicitly NOT used; per-line-then-sum is the pinned order.
    input_set: "Line items of one purchase; each line's product.tax_rate."
    constants:
      MAX_REDEEM_PCT: 0.50
      POINTS_PER_CENT: 0.01   # 1 point per 100 cents (=$1) of eligible spend
    precision: "integer cents; tax round_half_up per line; redemption/earn floor"

  - name: dividend_payout
    trigger: "GET /coop/members/{id}/summary (provisional) and dividend finalize (final)"
    algorithm: threshold
    formula: |
      # Rule 1 dual-variant on Member domain: same eligible_spend_cents, two rates.
      eligible = member.eligible_spend_cents
      provisional_dividend_cents = floor(eligible * PROVISIONAL_RATE)          # mid-year estimate
      final_dividend_cents       = floor(eligible * declaration.declared_rate) # year-end declared
      # A member is eligible for a FINAL payout only if eligible >= MIN_ELIGIBLE_SPEND_CENTS.
    input_set: "One member's eligible_spend_cents; provisional uses PROVISIONAL_RATE, final uses the declaration's declared_rate."
    constants:
      PROVISIONAL_RATE: 0.05
      MIN_ELIGIBLE_SPEND_CENTS: 100000   # $1000; boundary uses >= (Rule 6)
    precision: "integer cents, floor"
    variants:
      - name: provisional
        when: "read on member summary before any FINALIZED declaration for the year"
        difference: "uses fixed PROVISIONAL_RATE=0.05, ignores declared_rate"
      - name: final
        when: "dividend declaration finalized"
        difference: "uses declaration.declared_rate; only members with eligible_spend_cents >= MIN_ELIGIBLE_SPEND_CENTS receive a payout"

  - name: trade_in_valuation
    trigger: "POST /coop/trade-ins/{id}/offer"
    algorithm: weighted_scoring
    formula: |
      # Rule 1 dual-variant on TradeIn domain: same base+grade, two payout channels.
      base   = product.retail_price_cents
      gf     = GRADE_FACTOR[condition_grade]     # A 0.50, B 0.35, C 0.20
      offered_cash_cents   = floor(base * gf * CASH_FACTOR)     # cash pays less
      offered_credit_cents = floor(base * gf * CREDIT_FACTOR)   # store credit pays more
    input_set: "TradeIn.product retail_price_cents and condition_grade."
    constants:
      GRADE_FACTOR: { A: 0.50, B: 0.35, C: 0.20 }
      CASH_FACTOR: 0.80
      CREDIT_FACTOR: 1.00
      MAX_TRADE_IN_ROUNDS: 3
    precision: "integer cents, floor"
    variants:
      - name: cash
        when: "member accepts with accepted_payout_type=CASH"
        difference: "multiplies by CASH_FACTOR=0.80"
      - name: credit
        when: "member accepts with accepted_payout_type=CREDIT"
        difference: "multiplies by CREDIT_FACTOR=1.00; credited to wallet_credit_cents"

  - name: loyalty_points_conservation
    trigger: "any LoyaltyLedger append (purchase earn/redeem, booking redeem/refund, refund reversal, admin adjust)"
    algorithm: conservation_law
    formula: |
      # Rule 9 conserved quantity #1: loyalty points.
      Member.loyalty_points_balance == sum(LoyaltyLedger.delta WHERE member_id == Member.id)
      # A redeem (delta = -k) paired with its refund/reversal (delta = +k) leaves the balance unchanged.
    input_set: "All LoyaltyLedger rows for the member."
    precision: "integer points"

  - name: rental_unit_conservation
    trigger: "any RentalUnit status transition (pickup, return, service)"
    algorithm: conservation_law
    formula: |
      # Rule 9 conserved quantity #2: physical unit inventory per product.
      for a given product P:
        total_units(P) == count(units AVAILABLE) + count(RENTED_OUT) + count(OUT_OF_SERVICE)
      # pickup moves AVAILABLE->RENTED_OUT; the paired good-return moves RENTED_OUT->AVAILABLE,
      # so count(AVAILABLE) is restored and total_units(P) never changes.
    input_set: "All RentalUnit rows for product P."
    precision: "integer unit counts"

  - name: trip_seat_occupancy
    trigger: "TripBooking create/cancel"
    algorithm: aggregation
    formula: |
      Trip.seats_confirmed = count(TripBooking WHERE trip_id == Trip.id AND status IN {CONFIRMED, CHECKED_IN})
      trip_is_full = (seats_confirmed == capacity)     # Rule 6 boundary: == capacity rejects further bookings (ERR_TRIP_FULL); trip status stays OPEN
    input_set: "All TripBooking rows for the trip; status filter {CONFIRMED, CHECKED_IN}."
    precision: "integer seat counts"

  - name: special_order_deposit
    trigger: "POST /coop/special-orders/{id}/confirm"
    algorithm: threshold
    formula: |
      deposit_cents = floor(quoted_price_cents * SPECIAL_ORDER_DEPOSIT_PCT)
      # confirm requires Member.wallet_credit_cents >= deposit_cents (else ERR_INSUFFICIENT_WALLET)
    input_set: "SpecialOrder.quoted_price_cents at confirm time."
    constants:
      SPECIAL_ORDER_DEPOSIT_PCT: 0.20
    precision: "integer cents, floor"

  - name: warranty_billing
    trigger: "POST /coop/repair-orders/{id}/diagnose"
    algorithm: threshold
    formula: |
      covered = ((clock_date - purchase_date) in days) <= WARRANTY_DAYS
      warranty_status = COVERED if covered else DENIED
      billed_cents = 0 if covered else (labor_cents + parts_cents)
    input_set: "RepairOrder.purchase_date vs logical clock; labor_cents+parts_cents."
    constants:
      WARRANTY_DAYS: 365
    precision: "integer cents"

  - name: rental_window_conflict
    trigger: "POST /coop/reservations (window collision check)"
    algorithm: interval_merge
    formula: |
      # Rule 8 interval semantics #1: half-open windows + turnaround buffer, on RentalUnit.
      existing active reservations on the same unit = status IN {RESERVED, PICKED_UP}
      new reservation [new_start, new_end) collides with an existing [ex_start, ex_end) iff
        new_start < (ex_end + TURNAROUND_BUFFER_DAYS days) AND ex_start < (new_end + TURNAROUND_BUFFER_DAYS days)
      # Half-open: touching at a boundary is allowed ONLY if the gap >= TURNAROUND_BUFFER_DAYS.
    input_set: "All RESERVED/PICKED_UP reservations for the unit."
    constants:
      TURNAROUND_BUFFER_DAYS: 1
    precision: "whole-day interval arithmetic"

  - name: guide_schedule_conflict
    trigger: "POST /coop/trips/{id}/assign-guide (schedule collision check)"
    algorithm: interval_merge
    formula: |
      # Rule 8 interval semantics #2: CLOSED intervals, NO buffer, adjacency = conflict, on Guide.
      other trips already assigned to this guide with status IN {DRAFT, OPEN, DEPARTED}
      this trip [t_start, t_end] conflicts with an assigned trip [g_start, g_end] iff
        t_start <= g_end AND g_start <= t_end
      # Closed intervals: exact adjacency (t_start == g_end) COUNTS as a conflict (no buffer, inclusive).
    input_set: "All non-cancelled trips assigned to the guide."
    precision: "closed-interval arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /coop/members (register) and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity-backed roles act only on their own resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all role-restricted endpoints"

  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (member, product, rental unit, reservation, trip, guide, booking, trade-in, repair order, special order, purchase, declaration, pass), validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints referencing an id"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition (state-machine from-state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 4
    category: state
    check: "Trip.status == OPEN (not DRAFT/DEPARTED/COMPLETED/CANCELLED) when creating a booking"
    error_id: ERR_TRIP_NOT_OPEN
    http_status: 409
    applies_to: "POST /coop/trips/{id}/bookings"

  - priority: 4
    category: state
    check: "Cross-entity: acting Member.membership_status == ACTIVE when creating a reservation or a trip booking (LAPSED/PENDING/CLOSED rejected)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /coop/reservations, POST /coop/trips/{id}/bookings"

  - priority: 4
    category: state
    check: "Cross-entity: referenced RentalUnit.status != OUT_OF_SERVICE when creating a reservation (a retired/damaged unit cannot be reserved)"
    error_id: ERR_RENTAL_UNIT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /coop/reservations"

  - priority: 5
    category: business_safety
    check: "Assigned Guide holds Trip.required_certification (guide.certifications contains it) when assigning a guide"
    error_id: ERR_GUIDE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /coop/trips/{id}/assign-guide"

  - priority: 6
    category: business_temporal
    check: "Reservation window [start,end) does not collide with another reservation (status IN {RESERVED, PICKED_UP}) on the same unit within TURNAROUND_BUFFER_DAYS per rental_window_conflict (half-open + buffer)"
    error_id: ERR_RENTAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /coop/reservations"

  - priority: 6
    category: business_temporal
    check: "Assigned Guide has no other trip (status IN {DRAFT, OPEN, DEPARTED}) whose closed interval [start,end] overlaps or touches this trip's window per guide_schedule_conflict (adjacency counts as conflict; no buffer)"
    error_id: ERR_GUIDE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /coop/trips/{id}/assign-guide"

  - priority: 6
    category: business_temporal
    check: "end_date > start_date on reservation; end_time > start_time on trip; valid_to > valid_from on pass"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /coop/reservations, POST /coop/trips, POST /coop/passes"

  - priority: 7
    category: business_constraint
    check: "Trip.seats_confirmed < capacity when creating a booking (== capacity rejects)"
    error_id: ERR_TRIP_FULL
    http_status: 409
    applies_to: "POST /coop/trips/{id}/bookings"

  - priority: 7
    category: business_constraint
    check: "Purchase line quantity > 0 and unit_price_cents >= 0; special-order quantity > 0; trip capacity > 0"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /coop/purchases, POST /coop/special-orders, POST /coop/trips"

  - priority: 7
    category: business_constraint
    check: "expected_special_order_version matches SpecialOrder.version on re-quote (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coop/special-orders/{id}/quotes"

  - priority: 7
    category: business_constraint
    check: "TradeIn.rounds < MAX_TRADE_IN_ROUNDS when member counters"
    error_id: ERR_TRADE_IN_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /coop/trade-ins/{id}/counter"

  - priority: 8
    category: business_fiscal
    check: "Member holds enough loyalty points to cover points_redeemed on a booking or purchase"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    applies_to: "POST /coop/trips/{id}/bookings, POST /coop/purchases"

  - priority: 8
    category: business_fiscal
    check: "Member.wallet_credit_cents covers the required deposit on special-order confirm"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 402
    applies_to: "POST /coop/special-orders/{id}/confirm"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Members ---
  - method: POST
    path: "/coop/members"
    description: "Register a new member (self-service); starts PENDING."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, "membership_tier?"]
    output: Member
    side_effects: ["membership_status=PENDING", "join_fee_cents pinned from tier"]

  - method: GET
    path: "/coop/members"
    description: "List members."
    roles: [StoreStaff, CoopAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/coop/members/{id}"
    description: "Read a member."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/coop/members/{id}/summary"
    description: "Computed member summary incl. provisional_dividend_cents, loyalty_points_balance, eligible_spend_cents, wallet_credit_cents."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: "{ member_id: string, eligible_spend_cents: integer, provisional_dividend_cents: integer, loyalty_points_balance: integer, wallet_credit_cents: integer }"
    side_effects: []

  - method: GET
    path: "/coop/members/{id}/loyalty-ledger"
    description: "List a member's loyalty ledger entries (reverse-reachability for LoyaltyLedger.member_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "LoyaltyLedger[]"
    side_effects: []

  - method: POST
    path: "/coop/members/{id}/activate"
    description: "Collect join fee and activate a PENDING member."
    roles: [StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status PENDING->ACTIVE"]

  - method: POST
    path: "/coop/members/{id}/lapse"
    description: "Lapse an ACTIVE member."
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status ACTIVE->LAPSED"]

  - method: POST
    path: "/coop/members/{id}/reactivate"
    description: "Reactivate a LAPSED member (cycle)."
    roles: [StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status LAPSED->ACTIVE"]

  - method: POST
    path: "/coop/members/{id}/close"
    description: "Close a member (ACTIVE or LAPSED)."
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status ->CLOSED"]

  - method: POST
    path: "/coop/members/{id}/wallet/adjustments"
    description: "Admin store-credit adjustment (business/admin surface; also drives test setup of wallet balance)."
    roles: [CoopAdmin]
    code: 200
    input: [delta_cents, reason]
    output: Member
    side_effects: ["wallet_credit_cents += delta_cents"]

  # --- Products ---
  - method: POST
    path: "/coop/products"
    description: "Create a catalog product/SKU."
    roles: [CoopAdmin]
    code: 201
    input: [sku, name, category, retail_price_cents, tax_rate, replacement_value_cents, "is_rentable?", "base_daily_rate_cents?"]
    output: Product
    side_effects: []

  - method: GET
    path: "/coop/products"
    description: "List products."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["category?", "is_rentable?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/coop/products/{id}"
    description: "Read a product."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- Rental units ---
  - method: POST
    path: "/coop/rental-units"
    description: "Create a physical rental unit for a rentable product."
    roles: [CoopAdmin]
    code: 201
    input: [product_id, asset_tag]
    output: RentalUnit
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/coop/rental-units"
    description: "List/filter rental units (reverse-reachability for RentalUnit.product_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: "RentalUnit[]"
    side_effects: []

  - method: GET
    path: "/coop/rental-units/{id}"
    description: "Read a rental unit."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: RentalUnit
    side_effects: []

  - method: POST
    path: "/coop/rental-units/{id}/service"
    description: "Retire an AVAILABLE unit or restore an OUT_OF_SERVICE unit."
    roles: [StoreStaff, CoopAdmin]
    code: 200
    input: [action]
    output: RentalUnit
    side_effects: ["RETIRE: AVAILABLE->OUT_OF_SERVICE", "RESTORE: OUT_OF_SERVICE->AVAILABLE, condition=GOOD"]

  # --- Reservations ---
  - method: POST
    path: "/coop/reservations"
    description: "Reserve a rental unit for a date window; computes rental_fee_cents. Rejects if the unit is OUT_OF_SERVICE or the window collides with another active reservation on the unit within the turnaround buffer."
    roles: [Member, StoreStaff]
    code: 201
    input: [member_id, rental_unit_id, start_date, end_date]
    output: RentalReservation
    side_effects: ["rental_fee_cents pinned; no RentalUnit status change (window hold only)"]

  - method: GET
    path: "/coop/reservations"
    description: "List/filter reservations (reverse-reachability for member_id, rental_unit_id, product_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["member_id?", "rental_unit_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "RentalReservation[]"
    side_effects: []

  - method: GET
    path: "/coop/reservations/{id}"
    description: "Read a reservation."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: RentalReservation
    side_effects: []

  - method: POST
    path: "/coop/reservations/{id}/pickup"
    description: "Member picks up the reserved unit."
    roles: [StoreStaff]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["reservation RESERVED->PICKED_UP", "RentalUnit AVAILABLE->RENTED_OUT"]

  - method: POST
    path: "/coop/reservations/{id}/return"
    description: "Return a rented unit; condition GOOD closes it, DAMAGED assesses damage and cascades a RepairOrder."
    roles: [StoreStaff]
    code: 200
    input: [condition]
    output: RentalReservation
    side_effects: ["GOOD: reservation->CLOSED, unit->AVAILABLE", "DAMAGED: reservation->DAMAGE_ASSESSED, unit->OUT_OF_SERVICE, auto-create RepairOrder"]

  - method: POST
    path: "/coop/reservations/{id}/cancel"
    description: "Cancel a RESERVED reservation; releases the held window."
    roles: [Member, StoreStaff]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["reservation RESERVED->CANCELLED (unit status unaffected)"]

  # --- Guides ---
  - method: POST
    path: "/coop/guides"
    description: "Create a guide."
    roles: [CoopAdmin]
    code: 201
    input: [full_name, "certifications?"]
    output: Guide
    side_effects: []

  - method: GET
    path: "/coop/guides/{id}"
    description: "Read a guide."
    roles: [Guide, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Guide
    side_effects: []

  # --- Trips ---
  - method: POST
    path: "/coop/trips"
    description: "Create a trip/class in DRAFT."
    roles: [StoreStaff, CoopAdmin]
    code: 201
    input: [title, start_time, end_time, capacity, price_cents, "required_certification?"]
    output: Trip
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/coop/trips"
    description: "List/filter trips (reverse-reachability for Trip.guide_id)."
    roles: [Member, Guide, StoreStaff, CoopAdmin]
    code: 200
    input: ["guide_id?", "status?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/coop/trips/{id}"
    description: "Read a trip."
    roles: [Member, Guide, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: POST
    path: "/coop/trips/{id}/assign-guide"
    description: "Assign a certified, schedule-free guide to a trip."
    roles: [CoopAdmin]
    code: 200
    input: [guide_id]
    output: Trip
    side_effects: ["Trip.guide_id set"]

  - method: POST
    path: "/coop/trips/{id}/open"
    description: "Publish a DRAFT trip (requires an assigned guide)."
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Trip
    side_effects: ["status DRAFT->OPEN"]

  - method: POST
    path: "/coop/trips/{id}/depart"
    description: "Mark an OPEN trip DEPARTED."
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Trip
    side_effects: ["status OPEN->DEPARTED"]

  - method: POST
    path: "/coop/trips/{id}/complete"
    description: "Complete a DEPARTED trip; checked-in bookings auto-complete."
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Trip
    side_effects: ["status DEPARTED->COMPLETED", "CHECKED_IN bookings -> COMPLETED"]

  - method: POST
    path: "/coop/trips/{id}/cancel"
    description: "Cancel a trip; cascades booking cancellations and member refunds."
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Trip
    side_effects: ["status ->CANCELLED", "each active booking ->CANCELLED", "each cancellation refunds member points+wallet"]

  # --- Trip bookings ---
  - method: POST
    path: "/coop/trips/{id}/bookings"
    description: "Book a seat on an OPEN trip; optional loyalty redemption."
    roles: [Member]
    code: 201
    input: [member_id, "points_redeemed?"]
    output: TripBooking
    side_effects: ["status=CONFIRMED", "price_paid_cents pinned", "if points_redeemed>0 append LoyaltyLedger(-points)", "Trip.seats_confirmed recomputed (rises by 1)"]

  - method: GET
    path: "/coop/trip-bookings"
    description: "List/filter bookings (reverse-reachability for trip_id, member_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["trip_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "TripBooking[]"
    side_effects: []

  - method: GET
    path: "/coop/trip-bookings/{id}"
    description: "Read a trip booking."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: TripBooking
    side_effects: []

  - method: POST
    path: "/coop/trip-bookings/{id}/check-in"
    description: "Check a confirmed booking in on a departed trip."
    roles: [StoreStaff]
    code: 200
    input: []
    output: TripBooking
    side_effects: ["status CONFIRMED->CHECKED_IN"]

  - method: POST
    path: "/coop/trip-bookings/{id}/cancel"
    description: "Cancel a confirmed booking; refunds points and wallet, frees a seat."
    roles: [Member, StoreStaff]
    code: 200
    input: []
    output: TripBooking
    side_effects: ["status CONFIRMED->CANCELLED", "append LoyaltyLedger(+points_redeemed)", "wallet_credit_cents += (price_paid_cents - points_redeemed)", "Trip.seats_confirmed recomputed (drops by 1)"]

  # --- Trade-ins ---
  - method: POST
    path: "/coop/trade-ins"
    description: "Submit a used-gear trade-in."
    roles: [Member, StoreStaff]
    code: 201
    input: [member_id, product_id, condition_grade]
    output: TradeIn
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/coop/trade-ins"
    description: "List/filter trade-ins (reverse-reachability for member_id, product_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["member_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "TradeIn[]"
    side_effects: []

  - method: GET
    path: "/coop/trade-ins/{id}"
    description: "Read a trade-in."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: TradeIn
    side_effects: []

  - method: POST
    path: "/coop/trade-ins/{id}/offer"
    description: "Staff makes/updates a valuation offer (cash + credit variants)."
    roles: [StoreStaff]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["offered_cash_cents and offered_credit_cents computed", "status ->OFFERED"]

  - method: POST
    path: "/coop/trade-ins/{id}/counter"
    description: "Member counters the current offer (negotiation loop)."
    roles: [Member]
    code: 200
    input: [counter_ask_cents]
    output: TradeIn
    side_effects: ["rounds += 1", "status OFFERED->COUNTERED"]

  - method: POST
    path: "/coop/trade-ins/{id}/accept"
    description: "Member accepts the current offer with a payout channel."
    roles: [Member]
    code: 200
    input: [accepted_payout_type]
    output: TradeIn
    side_effects: ["accepted_payout_cents pinned", "status ->ACCEPTED", "CREDIT credits wallet_credit_cents"]

  - method: POST
    path: "/coop/trade-ins/{id}/reject"
    description: "Member rejects the trade-in."
    roles: [Member]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status ->REJECTED"]

  # --- Repair orders ---
  - method: POST
    path: "/coop/repair-orders"
    description: "Open a repair/warranty work order."
    roles: [Member, StoreStaff]
    code: 201
    input: [member_id, product_id, purchase_date]
    output: RepairOrder
    side_effects: ["repair_stage=RECEIVED", "billing_stage=UNBILLED", "warranty_status=UNDETERMINED"]

  - method: GET
    path: "/coop/repair-orders"
    description: "List/filter repair orders (reverse-reachability for member_id, product_id, rental_unit_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["member_id?", "product_id?", "rental_unit_id?", "repair_stage?", "limit?", "offset?"]
    output: "RepairOrder[]"
    side_effects: []

  - method: GET
    path: "/coop/repair-orders/{id}"
    description: "Read a repair order."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: POST
    path: "/coop/repair-orders/{id}/diagnose"
    description: "Diagnose: enter labor/parts, decide warranty coverage, compute billed_cents."
    roles: [StoreStaff]
    code: 200
    input: ["labor_cents?", "parts_cents?"]
    output: RepairOrder
    side_effects: ["warranty_status set COVERED/DENIED", "billed_cents computed", "repair_stage RECEIVED->DIAGNOSED"]

  - method: POST
    path: "/coop/repair-orders/{id}/start"
    description: "Begin repair; invoices billable work (billing dimension advances independently)."
    roles: [StoreStaff]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["repair_stage DIAGNOSED->IN_REPAIR", "if billed_cents>0 billing_stage UNBILLED->INVOICED"]

  - method: POST
    path: "/coop/repair-orders/{id}/ready"
    description: "Mark repair ready for pickup."
    roles: [StoreStaff]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["repair_stage IN_REPAIR->READY"]

  - method: POST
    path: "/coop/repair-orders/{id}/settle"
    description: "Settle the invoice (billing dimension)."
    roles: [StoreStaff]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["billing_stage INVOICED->SETTLED"]

  - method: POST
    path: "/coop/repair-orders/{id}/pickup"
    description: "Owner picks up a READY, settled repair."
    roles: [StoreStaff]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["repair_stage READY->PICKED_UP"]

  # --- Passes ---
  - method: POST
    path: "/coop/passes"
    description: "Sell a permit/pass with a validity window."
    roles: [Member, StoreStaff]
    code: 201
    input: [member_id, pass_type, valid_from, valid_to, price_cents]
    output: Pass
    side_effects: ["coverage_status computed from clock"]

  - method: GET
    path: "/coop/passes"
    description: "List/filter passes (reverse-reachability for Pass.member_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: "Pass[]"
    side_effects: []

  - method: GET
    path: "/coop/passes/{id}"
    description: "Read a pass (incl. computed coverage_status)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Pass
    side_effects: []

  - method: POST
    path: "/coop/passes/{id}/void"
    description: "Void a pass."
    roles: [StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Pass
    side_effects: ["voided=true", "coverage_status=VOID"]

  # --- Special orders ---
  - method: POST
    path: "/coop/special-orders"
    description: "Open a special order for a catalog item."
    roles: [Member, StoreStaff]
    code: 201
    input: [member_id, product_id, quantity]
    output: SpecialOrder
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/coop/special-orders"
    description: "List/filter special orders (reverse-reachability for member_id, product_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["member_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "SpecialOrder[]"
    side_effects: []

  - method: GET
    path: "/coop/special-orders/{id}"
    description: "Read a special order."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []

  - method: POST
    path: "/coop/special-orders/{id}/quotes"
    description: "Issue/replace a price quote (OCC-guarded; new quote supersedes prior)."
    roles: [StoreStaff]
    code: 200
    input: [quoted_price_cents, expected_special_order_version]
    output: SpecialOrder
    side_effects: ["quoted_price_cents set", "status ->QUOTED", "increments SpecialOrder.version by 1"]

  - method: POST
    path: "/coop/special-orders/{id}/confirm"
    description: "Member confirms a quote; charges a deposit from wallet."
    roles: [Member]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["deposit_cents computed", "wallet_credit_cents -= deposit_cents", "status ->CONFIRMED"]

  - method: POST
    path: "/coop/special-orders/{id}/fulfill"
    description: "Place with vendor, receive, and hand over a confirmed special order."
    roles: [StoreStaff]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status CONFIRMED->FULFILLED"]

  - method: POST
    path: "/coop/special-orders/{id}/cancel"
    description: "Cancel a special order; refunds any deposit."
    roles: [Member, StoreStaff]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status ->CANCELLED", "refund deposit to wallet if any"]

  # --- Purchases ---
  - method: POST
    path: "/coop/purchases"
    description: "Ring up a retail purchase; computes totals, tax, loyalty earn/redeem, eligible spend."
    roles: [StoreStaff]
    code: 201
    input: [member_id, line_items, "points_redeemed?"]
    output: Purchase
    side_effects: ["totals computed", "append LoyaltyLedger earn (+) and redeem (-)", "Member.eligible_spend_cents recomputed"]

  - method: GET
    path: "/coop/purchases"
    description: "List/filter purchases (reverse-reachability for Purchase.member_id)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "Purchase[]"
    side_effects: []

  - method: GET
    path: "/coop/purchases/{id}"
    description: "Read a purchase."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: Purchase
    side_effects: []

  - method: POST
    path: "/coop/purchases/{id}/refund"
    description: "Refund a completed purchase; reverses loyalty and eligible spend."
    roles: [StoreStaff]
    code: 200
    input: []
    output: Purchase
    side_effects: ["status COMPLETED->REFUNDED", "append reversal LoyaltyLedger entries", "Member.eligible_spend_cents recomputed"]

  # --- Dividends ---
  - method: POST
    path: "/coop/dividend-declarations"
    description: "Create a draft dividend declaration for a fiscal year."
    roles: [CoopAdmin]
    code: 201
    input: [year, declared_rate]
    output: DividendDeclaration
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/coop/dividend-declarations/{id}"
    description: "Read a dividend declaration (incl. payouts once finalized)."
    roles: [Member, StoreStaff, CoopAdmin]
    code: 200
    input: []
    output: DividendDeclaration
    side_effects: []

  - method: POST
    path: "/coop/dividend-declarations/{id}/finalize"
    description: "Finalize dividends; credit eligible members' wallets."
    roles: [CoopAdmin]
    code: 200
    input: []
    output: DividendDeclaration
    side_effects: ["compute per-member final_dividend_cents for eligible_spend_cents>=MIN_ELIGIBLE_SPEND_CENTS", "credit wallet_credit_cents", "status DRAFT->FINALIZED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CoopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; recomputes clock-derived fields (pass coverage_status)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted, or entity-backed role acting on another's resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, wrong type, unknown enum" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id does not resolve" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product id does not resolve" }
  - { id: ERR_RENTAL_UNIT_NOT_FOUND, http: 404, condition: "rental unit id does not resolve" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation id does not resolve" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "trip id does not resolve" }
  - { id: ERR_GUIDE_NOT_FOUND, http: 404, condition: "guide id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "trip booking id does not resolve" }
  - { id: ERR_TRADE_IN_NOT_FOUND, http: 404, condition: "trade-in id does not resolve" }
  - { id: ERR_REPAIR_ORDER_NOT_FOUND, http: 404, condition: "repair order id does not resolve" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "special order id does not resolve" }
  - { id: ERR_PURCHASE_NOT_FOUND, http: 404, condition: "purchase id does not resolve" }
  - { id: ERR_DECLARATION_NOT_FOUND, http: 404, condition: "dividend declaration id does not resolve" }
  - { id: ERR_PASS_NOT_FOUND, http: 404, condition: "pass id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the requested transition" }
  - { id: ERR_TRIP_NOT_OPEN, http: 409, condition: "Booking attempted on a trip whose status is not OPEN" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Reservation/booking attempted while member is not ACTIVE" }
  - { id: ERR_RENTAL_UNIT_UNAVAILABLE, http: 409, condition: "Reservation attempted on a unit whose status is not AVAILABLE" }
  - { id: ERR_GUIDE_NOT_CERTIFIED, http: 409, condition: "Assigned guide lacks the trip's required_certification" }
  - { id: ERR_RENTAL_WINDOW_CONFLICT, http: 409, condition: "Reservation window collides with an active reservation within the turnaround buffer" }
  - { id: ERR_GUIDE_SCHEDULE_CONFLICT, http: 409, condition: "Guide already assigned to a trip whose closed interval overlaps/touches this trip" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "end not strictly after start on a reservation/trip/pass" }
  - { id: ERR_TRIP_FULL, http: 409, condition: "Booking attempted when seats_confirmed == capacity" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Non-positive quantity/capacity or negative unit price" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_special_order_version does not match current SpecialOrder.version" }
  - { id: ERR_TRADE_IN_ROUNDS_EXCEEDED, http: 409, condition: "Member counters after MAX_TRADE_IN_ROUNDS reached" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 402, condition: "points_redeemed exceeds member loyalty_points_balance" }
  - { id: ERR_INSUFFICIENT_WALLET, http: 402, condition: "wallet_credit_cents below required special-order deposit" }
  - { id: ERR_REPAIR_UNSETTLED, http: 409, condition: "Repair pickup attempted while billed work is not SETTLED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a member."
    identity: "opaque"
    exclusive_operations: ["POST /coop/members (register)"]
    shared_operations: []

  - name: Member
    description: "Co-op member acting on own reservations, bookings, trade-ins, passes, special orders, repairs."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /coop/trips/{id}/bookings"
      - "POST /coop/trip-bookings/{id}/cancel (own)"
      - "POST /coop/trade-ins/{id}/counter"
      - "POST /coop/trade-ins/{id}/accept"
      - "POST /coop/trade-ins/{id}/reject"
      - "POST /coop/special-orders/{id}/confirm"
    shared_operations:
      - "POST /coop/reservations"
      - "POST /coop/reservations/{id}/cancel"
      - "POST /coop/trade-ins"
      - "POST /coop/repair-orders"
      - "POST /coop/passes"
      - "POST /coop/special-orders"
      - "POST /coop/special-orders/{id}/cancel"
      - "GET reads of own resources and catalog"

  - name: Guide
    description: "Trip guide; reads assigned trips and own profile."
    identity: "entity_backed:Guide"
    exclusive_operations: []
    shared_operations:
      - "GET /coop/guides/{id}"
      - "GET /coop/trips"
      - "GET /coop/trips/{id}"

  - name: StoreStaff
    description: "Front-desk/POS operator: rentals, purchases, trade-in offers, repairs, passes, special-order fulfillment."
    identity: "opaque"
    exclusive_operations:
      - "POST /coop/members/{id}/activate"
      - "POST /coop/members/{id}/reactivate"
      - "POST /coop/reservations/{id}/pickup"
      - "POST /coop/reservations/{id}/return"
      - "POST /coop/rental-units/{id}/service"
      - "POST /coop/trip-bookings/{id}/check-in"
      - "POST /coop/trade-ins/{id}/offer"
      - "POST /coop/repair-orders/{id}/diagnose"
      - "POST /coop/repair-orders/{id}/start"
      - "POST /coop/repair-orders/{id}/ready"
      - "POST /coop/repair-orders/{id}/settle"
      - "POST /coop/repair-orders/{id}/pickup"
      - "POST /coop/special-orders/{id}/quotes"
      - "POST /coop/special-orders/{id}/fulfill"
      - "POST /coop/purchases"
      - "POST /coop/purchases/{id}/refund"
      - "POST /coop/passes/{id}/void"
    shared_operations:
      - "POST /coop/reservations"
      - "POST /coop/trips"
      - "POST /coop/trade-ins"
      - "POST /coop/repair-orders"
      - "POST /coop/passes"
      - "POST /coop/special-orders"
      - "GET list/read endpoints"

  - name: CoopAdmin
    description: "Operator superset: catalog, rental-unit inventory, guides, trip lifecycle, dividends, wallet adjustments, logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /coop/products"
      - "POST /coop/rental-units"
      - "POST /coop/guides"
      - "POST /coop/trips/{id}/assign-guide"
      - "POST /coop/trips/{id}/open"
      - "POST /coop/trips/{id}/depart"
      - "POST /coop/trips/{id}/complete"
      - "POST /coop/trips/{id}/cancel"
      - "POST /coop/members/{id}/lapse"
      - "POST /coop/members/{id}/close"
      - "POST /coop/members/{id}/wallet/adjustments"
      - "POST /coop/dividend-declarations"
      - "POST /coop/dividend-declarations/{id}/finalize"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /coop/trips"
      - "GET list/read endpoints"
