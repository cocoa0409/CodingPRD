  # ==========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: stale_parcel_version_blocks_discretionary_notice
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[notice-create-stale-parcel]
          - errors[ERR_STALE_PARCEL_VERSION]
          - endpoints[POST /fire-district/parcels/{parcel_id}/violation-notices]
        distinguishing_aspect: |
          The discretionary-notice write is guarded by expected_parcel_version because a second notice is
          otherwise LEGITIMATE (it supersedes the first), so only the version token can tell a deliberate
          supersession from a lost update. A token of 1 held across the FAIL cascade — which bumped the
          parcel to 2 in ONE increment no matter how many cascade links fired — is refused 412
          ERR_STALE_PARCEL_VERSION with no notice created; re-reading and retrying succeeds.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a HIGH-risk parcel observed at version 1, then failed on an INITIAL inspection so its version advances behind the client's back."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-6601", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", v_stale: "$.data.version" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "GET /fire-district/parcels/${p1}"
              payload: {}
              as: ProgramAdmin
              captures: { v_now: "$.data.version", open_now: "$.data.open_violation_count" }
          trigger:
            - call: "POST /fire-district/parcels/${p1}/violation-notices"
              payload: { inspection_id: "${ins1}", notice_method: "EMAIL", expected_parcel_version: "${v_stale}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${v_stale} == 1 at observation time and ${v_now} == 2 after the FAIL completion — one write, exactly one version increment, even though five cascade links fired"
            - "HTTP 412 and ${err} == \"ERR_STALE_PARCEL_VERSION\""
            - "${open_now} == 1 and GET /fire-district/violation-notices with parcel_id ${p1} still returns total_count == 1: the refused write created no notice and voided none"
            - "Parcel.${p1}.version is still 2 after the refusal — a rejected OCC write does not itself bump the version"
            - "Re-issuing the identical request with expected_parcel_version ${v_now} returns 201, drives the cascade notice to VOIDED and leaves open_violation_count == 1"
            - "PATCH /fire-district/parcels/${p1} with expected_parcel_version ${v_stale} likewise returns 412 ERR_STALE_PARCEL_VERSION — the same token guards both write endpoints of this rule"

      - name: stale_program_version_blocks_enrollment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enrollment-create-stale-program]
          - errors[ERR_STALE_PROGRAM_VERSION]
          - endpoints[POST /fire-district/support-enrollments]
        distinguishing_aspect: |
          Enrollment is legitimately repeatable for OTHER parcels, so the only way to stop a second writer
          from being admitted against budget the first writer already reserved is the program version
          token: parcel B enrolling on the token observed before parcel A's admission is refused 412
          ERR_STALE_PROGRAM_VERSION even though a slot and budget remain, and the retry on the fresh token
          is admitted with the CORRECT post-reservation budget.
        test_recipe:
          setup:
            - "Active cycle; a COST_SHARE_GRANT program (budget 500000, 3 slots) observed at version 1; two HIGH-risk parcels; parcel A is admitted first and moves the program to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-6701", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pA: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-6702", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pB: "$.data.id" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "COST_SHARE_GRANT", budget_total_cents: 500000, capacity_slots: 3, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", v_stale: "$.data.version", budget0: "$.data.budget_remaining_cents" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pA}", vendor_invoice_cents: 200000, expected_program_version: "${v_stale}" }
              as: ProgramAdmin
              captures: { enA: "$.data.id", enA_award: "$.data.award_cents" }
            - call: "GET /fire-district/support-programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { v_now: "$.data.version", budget1: "$.data.budget_remaining_cents", slots1: "$.data.reserved_slots" }
          trigger:
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pB}", vendor_invoice_cents: 60000, expected_program_version: "${v_stale}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${budget0} == 500000 and ${v_stale} == 1 at observation time"
            - "${enA_award} == 120000, ${v_now} == 2, ${budget1} == 380000 and ${slots1} == 1 after parcel A"
            - "HTTP 412 and ${err} == \"ERR_STALE_PROGRAM_VERSION\" for parcel B on the stale token, even though 380000 budget and 2 slots remain"
            - "SupportProgram.${prog}.budget_remaining_cents is still 380000, reserved_slots still 1 and version still ${v_now}: the refused enrollment reserved nothing"
            - "GET /fire-district/support-enrollments with support_program_id ${prog} returns total_count == 1"
            - "Retrying parcel B with expected_program_version ${v_now} returns 201 APPROVED with award_before_bonus_cents 27000, bonus_pct 0.15, hardship_bonus_cents 0, award_cents 27000, and SupportProgram.${prog}.budget_remaining_cents == 353000 with version 3"

      - name: fail_cascade_five_links_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: inspection_fail_cascade_five_links_to_community_rate
          rationale: |
            That §1.8 transitive_cascade instance already verifies the full five-link chain
            Inspection -> Parcel -> ViolationNotice -> Community.compliance_rate_pct -> Community.status
            end-to-end from one completion request, including link 4's certificate revocation.

      - name: risk_score_two_variants_and_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: risk_score_intake_provisional_vs_post_inspection_verified
          rationale: |
            That §1.8 dual_variant_calc instance already computes both parcel_risk_score variants on the
            same parcel and pins the delta produced when risk_score_basis switches from INTAKE_PROVISIONAL
            to POST_INSPECTION_VERIFIED.

  # ==========================================================================
  - section: consistency model
    instances:

      - name: fail_completion_effects_visible_without_any_re_read_delay
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Inspection.NOTICED_to_COMPLETED_FAIL.side_effects
          - calculations.program_compliance_metrics
        distinguishing_aspect: |
          The declared model is immediate: the completion response itself already carries the recomputed
          inspection fields, and the FIRST read of every dependent row after that single request — parcel
          score/status, the brand-new notice with its computed deadline, and the persisted community rate —
          is fully converged at the same logical instant, with no clock movement and no second write. An
          eventually-consistent implementation that lets Community.compliance_rate_pct lag behind is
          distinguishable.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a community with three member parcels; a NOTICED INITIAL inspection on member parcel A with all three zones recorded as failing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
