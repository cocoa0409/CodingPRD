          - endpoints.GET_/moderation/review-queues
        distinguishing_aspect: "The only create-and-read entity in the model is exercised end to end, including the filtered collection read; ReviewQueue declares no update or delete endpoint, so the CRUD surface is deliberately partial."
        test_recipe:
