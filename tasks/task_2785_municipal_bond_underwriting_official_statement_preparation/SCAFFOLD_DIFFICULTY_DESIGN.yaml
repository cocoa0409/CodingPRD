            # ---------- Deal N: negotiated ----------
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026N", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_n_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_n_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { n_t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_n_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
