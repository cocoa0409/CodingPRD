            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s1_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-11-10T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a1_id: $.data.id } }
            - { call: "POST /assignments/${a1_id}/confirm", payload: {}, as: CrewingManager }
          trigger:
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s2_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-11-09T00:00:00Z", planned_relief_date: "2027-02-09T00:00:00Z", local_join: true }, as: CrewingManager, captures: { err: $.data.error_id } }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s2_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-11-10T00:00:00Z", planned_relief_date: "2027-02-10T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a3_id: $.data.id, a3_status: $.data.assignment_status } }
