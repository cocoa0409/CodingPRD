              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${la_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol_a_id: "$.data.id" }
            - call: "POST /league-policies/${pol_a_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol_a_id}/activate"
              payload: {}
