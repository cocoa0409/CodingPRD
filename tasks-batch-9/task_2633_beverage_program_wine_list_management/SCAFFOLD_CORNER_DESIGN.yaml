            - call: "POST /beverage-program/allocation-claims/${c1_id}/withdraw"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
          assert:
            - "allocating an offer with zero claims returns 422 ERR_NO_ELIGIBLE_CLAIMS and leaves fulfillment_state OPEN, allocated_at null and version ${off_v1}"
            - "the single claim for 6 of 10 bottles is fully granted: state GRANTED, granted_bottles 6, raw_share 6.0000 and remainder_awarded false"
            - "the allocation returns 200 with fulfillment_state ALLOCATED, unallocated_bottles 4 and allocated_at == 2026-09-01T00:00:00Z, while compliance_state stays PENDING_LICENSE_CHECK"
            - "the second venue's claim against the now-allocated offer returns 409 ERR_OFFER_NOT_OPEN even though 4 bottles are unallocated and the deadline has not passed"
            - "the first withdraw returns 200 (state WITHDRAWN) and the second returns 409 ERR_CLAIM_NOT_WITHDRAWABLE"
      - name: empty_submit_and_duplicate_wine_on_one_version_rejected
