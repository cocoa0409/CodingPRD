        distinguishing_aspect: "Selector eligibility: a DRAFT (never activated) agreement covering the scope contributes zero retention."
        test_recipe:
          setup:
            - "REGISTERED work K (W1 10000bp + pub); DRAFT agreement covering US/PERFORMANCE (never activated)"
            - "Statement with one matched line gross 3333"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000030002", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "No Retention Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_code: $.data.work_code, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000301" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000301-2" }, as: CopyrightSpecialist }
            - { call: "POST /sub-publishers", payload: { name: "US Sub", home_territory_code: "US" }, as: PublisherAdmin, captures: { sp: $.data.id } }
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["US"], income_types: ["PERFORMANCE"], retention_bp: 1500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PublisherAdmin }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 3333, lines: [ { line_number: 1, reported_title: "No Retention Song", reported_work_code: "${k_code}", gross_cents: 3333 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst, captures: { ret: $.data.retained_cents, tot: $.data.allocated_total_cents } }
          assert:
            - "${ret} == 0 (DRAFT agreement is outside the selector's eligibility set)"
            - "${tot} == 3333"

      - name: provisional_spread_remainder_to_earliest_line
        claim_type: precision
        grounds:
          - calculations.provisional_unmatched_spread
        distinguishing_aspect: "Spread remainder distribution: unmatched 1003 over two equal-gross (5000) matched lines floors to 501 each; the 1-cent remainder goes to the line with the earlier created_at, producing effective grosses 5502 vs 5501."
        test_recipe:
          setup:
            - "Writers W1, W2; REGISTERED works K1, K2 (each single writer 10000bp + pub); statement lines L1 5000 (K1), L2 5000 (K2), L3 1003 unmatched; header gross 11003"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000030003", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /writers", payload: { legal_name: "W2", ipi_number: "00000030004", pro_affiliation: "BMI" }, as: PublisherAdmin, captures: { w2: $.data.id } }
            - { call: "POST /works", payload: { title: "Spread One", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k1: $.data.id, k1_code: $.data.work_code, k1_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k1}", expected_work_version: "${k1_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss1: $.data.id } }
            - { call: "POST /split-sets/${ss1}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss1}", as: PublisherAdmin, captures: { s1l1: "$.data[0].id", s1l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${s1l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${s1l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /works", payload: { title: "Spread Two", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k2: $.data.id, k2_code: $.data.work_code, k2_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k2}", expected_work_version: "${k2_v}", lines: [ { participant_type: WRITER, writer_id: "${w2}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss2: $.data.id } }
            - { call: "POST /split-sets/${ss2}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss2}", as: PublisherAdmin, captures: { s2l1: "$.data[0].id", s2l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${s2l1}/confirm", payload: {}, as: Writer, as_user_id: "${w2}" }
            - { call: "POST /split-lines/${s2l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k1}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg1: $.data.id } }
            - { call: "POST /society-registrations/${reg1}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg1}/acknowledge", payload: { society_work_number: "880000302" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg1}/register", payload: { iswc: "T-900000302-1" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations", payload: { work_id: "${k2}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg2: $.data.id } }
            - { call: "POST /society-registrations/${reg2}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg2}/acknowledge", payload: { society_work_number: "880000303" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg2}/register", payload: { iswc: "T-900000303-2" }, as: CopyrightSpecialist }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 11003, lines: [ { line_number: 1, reported_title: "Spread One", reported_work_code: "${k1_code}", gross_cents: 5000 }, { line_number: 2, reported_title: "Spread Two", reported_work_code: "${k2_code}", gross_cents: 5000 }, { line_number: 3, reported_title: "Mystery", gross_cents: 1003 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst, captures: { tot: $.data.allocated_total_cents } }
            - { call: "GET /allocation-lines?statement_id=${st}&writer_id=${w1}", as: RoyaltyAnalyst, captures: { w1_amt: "$.data[0].provisional_amount_cents" } }
            - { call: "GET /allocation-lines?statement_id=${st}&writer_id=${w2}", as: RoyaltyAnalyst, captures: { w2_amt: "$.data[0].provisional_amount_cents" } }
          assert:
            - "${w1_amt} == 2751 (effective 5000 + 501 + 1 remainder = 5502; pool floor(5502/2))"
            - "${w2_amt} == 2750 (effective 5501; pool floor(5501/2))"
            - "${tot} == 11003 (provisional stage allocates everything; suspense 0)"

      - name: termination_window_dates_projected
        claim_type: constants_applied
        grounds:
          - calculations.termination_window_projection
          - entities.TerminationClaim.fields.window_open_date
        distinguishing_aspect: "Calendar-year projection constants (35/40 years; notice 10/2 years) appear verbatim in the create response."
        test_recipe:
          setup: ["Work K with grant_date 1990-06-15"]
          setup_api_calls:
            - { call: "POST /works", payload: { title: "Window Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id } }
          trigger:
            - { call: "POST /termination-claims", payload: { work_id: "${k}", statute_basis: "SEC_203", intended_effective_date: "2028-06-15T00:00:00Z" }, as: CopyrightSpecialist, captures: { wo: $.data.window_open_date, wc: $.data.window_close_date, ne: $.data.notice_earliest_date, nl: $.data.notice_latest_date, st: $.data.status } }
          assert:
            - "${wo} == 2025-06-15 (grant + 35y) and ${wc} == 2030-06-15 (grant + 40y)"
            - "${ne} == 2018-06-15 (effective - 10y) and ${nl} == 2026-06-15 (effective - 2y)"
            - "${st} == TRACKING or NOTICE_WINDOW_OPEN per the default clock 2026-08-01 (derived: NOTICE_WINDOW_OPEN since 2026-08-01 >= 2025-06-15)"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role headers fail authentication before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /writers", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (no X-User-ID / X-User-Role headers sent)"

      - name: unknown_role_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "An undeclared role string is an authentication failure (400), not an authorization failure (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /writers", as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (role Anonymous is not declared)"

      - name: existence_check_precedes_state_on_missing_id
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: "A submit against a non-existent registration id returns 404 ERR_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /society-registrations/00000000-0000-4000-8000-000000000000/submit", payload: {}, as: CopyrightSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: gross_mismatch_tie_out_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_GROSS_MISMATCH]
        distinguishing_aspect: "Header-vs-lines tie-out at allocate: header gross 1000 vs line sum 900 fails."
        test_recipe:
          setup: ["Licensee L; statement header gross 1000 with one line of 900, matched stage"]
          setup_api_calls:
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "MECHANICAL", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 1000, lines: [ { line_number: 1, reported_title: "Short Song", gross_cents: 900 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_GROSS_MISMATCH (900 != 1000)"

      - name: duplicate_society_registration_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_SOCIETY_REGISTRATION]
        distinguishing_aspect: "A second live registration (any of DRAFT/SUBMITTED/ACKNOWLEDGED/REGISTERED) for the same (work, society) is rejected."
        test_recipe:
          setup: ["Work K; Society S; registration R1 in DRAFT"]
          setup_api_calls:
            - { call: "POST /works", payload: { title: "Dup Reg Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id } }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_SOCIETY_REGISTRATION (R1 still live in DRAFT)"

      - name: duplicate_split_participant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_SPLIT_PARTICIPANT]
        distinguishing_aspect: "The same writer_id twice in one split set is a duplicate participant even with distinct shares."
        test_recipe:
          setup: ["Writer W1; Work K"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000030005", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Dup Split Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
          trigger:
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 6000 }, { participant_type: WRITER, writer_id: "${w1}", share_bp: 4000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_SPLIT_PARTICIPANT"

      - name: split_pool_sum_invalid_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_SPLIT_SUM_INVALID]
        distinguishing_aspect: "Writer pool must sum to exactly 10000 bp; 9000 fails on an otherwise valid work."
        test_recipe:
          setup: ["Writer W1; Work K"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000030006", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Bad Sum Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
          trigger:
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 9000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SPLIT_SUM_INVALID"

      - name: agreement_invalid_date_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "effective_from >= effective_to fails shape validation at create (before any overlap analysis)."
        test_recipe:
          setup: ["SubPublisher SP"]
          setup_api_calls:
            - { call: "POST /sub-publishers", payload: { name: "DE Sub", home_territory_code: "DE" }, as: PublisherAdmin, captures: { sp: $.data.id } }
          trigger:
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["DE"], income_types: ["PERFORMANCE"], retention_bp: 1500, effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PublisherAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_DATE_RANGE (empty half-open interval)"

      - name: statement_period_overlap_rejected_but_rejected_excluded
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: "Statement overlap ignores REJECTED statements: re-creating over a rejected statement's period succeeds, but overlapping a live (RECEIVED) statement fails under closed-inclusive semantics."
        test_recipe:
          setup: ["Licensee L; SA (Q1 2026) created then REJECTED; SB (Q1 2026) created successfully"]
          setup_api_calls:
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 100, lines: [ { line_number: 1, reported_title: "A", gross_cents: 100 } ] }, as: RoyaltyAnalyst, captures: { sa: $.data.id } }
            - { call: "POST /royalty-statements/${sa}/reject", payload: { reason: "bad feed" }, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 200, lines: [ { line_number: 1, reported_title: "B", gross_cents: 200 } ] }, as: RoyaltyAnalyst, captures: { sb: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-03-31T23:59:59Z", period_end: "2026-06-30T23:59:59Z", gross_amount_cents: 300, lines: [ { line_number: 1, reported_title: "C", gross_cents: 300 } ] }, as: RoyaltyAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "${sb} created (201): REJECTED statements are excluded from the overlap set"
            - "${err} == ERR_STATEMENT_PERIOD_OVERLAP (shared boundary 2026-03-31 conflicts with SB under inclusive semantics)"

      - name: audit_extrapolated_sample_base_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=9]
          - errors[ERR_AUDIT_SAMPLE_BASE_INVALID]
        distinguishing_aspect: "Conditional requiredness: EXTRAPOLATED findings need sampled_base_cents >= 1 and reported_base_cents >= sampled_base_cents."
        test_recipe:
          setup: ["Licensee L; EXTRAPOLATED audit in FIELDWORK"]
          setup_api_calls:
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /licensee-audits", payload: { licensee_id: "${lic}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T23:59:59Z", valuation_method: "EXTRAPOLATED" }, as: Auditor, captures: { aud: $.data.id } }
            - { call: "POST /licensee-audits/${aud}/begin-fieldwork", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /licensee-audits/${aud}/issue-findings", payload: { actual_shortfall_cents: 40000, sampled_base_cents: 0, reported_base_cents: 1000000 }, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_AUDIT_SAMPLE_BASE_INVALID (sampled_base_cents 0 would divide by zero)"

      - name: notice_deadline_passed_with_default_clock
        claim_type: temporal_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_NOTICE_DEADLINE_PASSED]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The unset logical clock reads exactly 2026-08-01T00:00:00Z: a claim whose notice_latest_date is 2026-06-15 is already past deadline at file-notice with no clock call."
        test_recipe:
          setup: ["Work K grant 1990-06-15; claim intended effective 2028-06-15 (notice window closes 2026-06-15); NO clock call made (default 2026-08-01)"]
          setup_api_calls:
            - { call: "POST /works", payload: { title: "Late Notice Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id } }
            - { call: "POST /termination-claims", payload: { work_id: "${k}", statute_basis: "SEC_203", intended_effective_date: "2028-06-15T00:00:00Z" }, as: CopyrightSpecialist, captures: { tc: $.data.id } }
          trigger:
            - { call: "POST /termination-claims/${tc}/file-notice", payload: { notice_ref: "N-LATE" }, as: CopyrightSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOTICE_DEADLINE_PASSED (default clock 2026-08-01 > notice_latest 2026-06-15; derived status NOTICE_WINDOW_OPEN passes the state check first)"

      - name: effective_date_outside_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_EFFECTIVE_DATE_OUTSIDE_WINDOW]
        distinguishing_aspect: "Create-time window validation: intended effective 2024-01-01 is before window_open 2025-06-15 (window_open < effective <= window_close required)."
        test_recipe:
          setup: ["Work K grant 1990-06-15"]
          setup_api_calls:
            - { call: "POST /works", payload: { title: "Bad Window Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id } }
          trigger:
            - { call: "POST /termination-claims", payload: { work_id: "${k}", statute_basis: "SEC_203", intended_effective_date: "2024-01-01T00:00:00Z" }, as: CopyrightSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_EFFECTIVE_DATE_OUTSIDE_WINDOW"

      - name: stale_distribution_run_blocked_on_approve
        claim_type: conditional_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_STALE_DISTRIBUTION_RUN]
