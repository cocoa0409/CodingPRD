              payload: { sku: "CS-1", description: "Belt", item_class: "STOCKED", list_price_cents: 800 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-CS", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "CN-A", location_type: "CENTRAL", region_state: "OH" }
              as: DistributionAdmin
              captures: { cnA: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "CN-B", location_type: "CENTRAL", region_state: "OH" }
              as: DistributionAdmin
              captures: { cnB: $.data.id }
            - call: "POST /mro/locations/${cnA}/restock"
              payload: { item_id: "${it_id}", qty: 4 }
              as: DistributionAdmin
            - call: "POST /mro/locations/${cnB}/restock"
              payload: { item_id: "${it_id}", qty: 9 }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${it_id}", qty: 5 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { fstat: $.data.fulfillment_status }
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { qc: "$.data[0].qty_central", qb: "$.data[0].qty_branch", src: "$.data[0].fulfillment_source" }
            - call: "GET /mro/locations/${cnB}/stock-balances"
              as: DistributionAdmin
              captures: { resB: "$.data[0].reserved_qty" }
            - call: "GET /mro/locations/${cnA}/stock-balances"
              as: DistributionAdmin
              captures: { resA: "$.data[0].reserved_qty" }
          assert:
            - "qb == 0 and qc == 5 and src == SPLIT_STOCK (0 branch + 5 central)"
            - "resB == 5 (central B, highest available 9, was selected) and resA == 0 (central A untouched)"
            - "fstat == ALLOCATED"

      - name: promise_date_null_for_standard_method
        claim_type: correct_result
        grounds: [calculations.promise_date]
        distinguishing_aspect: "STANDARD fulfillment never earns a will-call/same-day promise: promise_date is null after confirm regardless of the cutoff."
        test_recipe:
          setup: ["Customer, stocked item, STANDARD order"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "PN-1", display_name: "PromiseNull Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "PN-1", description: "Coupler", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-PN", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { pd: $.data.promise_date, st: $.data.status }
          assert:
            - "st == CONFIRMED and pd is null"

      - name: sla_breach_flag_set_only_when_ready_late
        claim_type: correct_result
        grounds: [calculations.promise_date, entities.SalesOrder.fields.sla_breach]
        distinguishing_aspect: "sla_breach is false when the branch marks ready on the promise date and true when it marks ready any day after; two identical orders differ only in mark-ready timing."
        test_recipe:
          setup: ["Customer, STOCKED item stock 2, branch cutoff 900; two WILL_CALL orders confirmed at 2026-08-01T14:00Z (promise 2026-08-01)"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "SLA-1", display_name: "Sla Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "SLA-1", description: "Gauge", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-SLA", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 2 }
              as: DistributionAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { o1: $.data.id }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { o2: $.data.id }
            - call: "POST /mro/orders/${o1}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${o2}/confirm"
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/orders/${o1}/mark-ready"
              as: BranchManager
              captures: { breach1: $.data.sla_breach, p1: $.data.promise_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: DistributionAdmin
            - call: "POST /mro/orders/${o2}/mark-ready"
              as: BranchManager
              captures: { breach2: $.data.sla_breach, p2: $.data.promise_date }
          assert:
