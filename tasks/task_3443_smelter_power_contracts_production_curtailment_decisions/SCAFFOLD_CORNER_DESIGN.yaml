- section: calculations
  instances:
  - name: latest_price_observation_selector_tiebreak
    claim_type: input_set_filtering
    grounds:
    - calculations.effective_power_cost
    distinguishing_aspect: 'The latest-observation selector orders by observed_at DESC then created_at DESC (never id): a
      later-dated print supersedes, and an equal-dated but later-posted print supersedes that.'
    test_recipe:
      setup:
      - Smelter with ACTIVE blended contract (FIXED 150 @ 32, MARKET 100, INTERRUPTIBLE 50).
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
          - component_type: MARKET_INDEXED
            volume_mw: 100
          - component_type: INTERRUPTIBLE
            volume_mw: 50
            interruptible_cap_hours_per_year: 500
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: POWER_SPOT
          region_code: NA_NORTHWEST
          observed_at: '2026-08-20T00:00:00Z'
          price_usd: 40.0
        as: EnergyManager
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: POWER_SPOT
          region_code: NA_NORTHWEST
          observed_at: '2026-08-25T00:00:00Z'
          price_usd: 44.0
        as: EnergyManager
      trigger:
      - call: GET /smelter-ops/power-contracts/${pc}
        as: EnergyManager
        captures:
          fwd1: $.data.forward_cost_per_mwh
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: POWER_SPOT
          region_code: NA_NORTHWEST
          observed_at: '2026-08-25T00:00:00Z'
          price_usd: 46.0
        as: EnergyManager
      - call: GET /smelter-ops/power-contracts/${pc}
        as: EnergyManager
        captures:
          fwd2: $.data.forward_cost_per_mwh
      assert:
      - 'first read: forward_cost_per_mwh == 36.17 ((4800 + 4400 + 1650)/300 — the 2026-08-25 print wins over 2026-08-20)'
      - 'second read: forward_cost_per_mwh == 37.08 ((4800 + 4600 + 1725)/300 — same observed_at, later-created print wins
        the tie)'
  - name: forward_cost_null_without_price_observation
    claim_type: correct_result
    grounds:
    - calculations.effective_power_cost
    - entities.PowerContract.fields.forward_cost_per_mwh
    distinguishing_aspect: Computed cost fields degrade to null (not an error, not zero) when the selector's input set is
      empty.
    test_recipe:
      setup:
      - Smelter with ACTIVE contract carrying a MARKET_INDEXED 100MW component; no price observations exist.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
