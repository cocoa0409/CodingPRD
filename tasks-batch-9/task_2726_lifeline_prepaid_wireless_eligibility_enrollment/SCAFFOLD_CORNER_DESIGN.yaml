  # =========================================================================
  # SECTION 3 - calculations  (claim-extraction-guide Table 3)
  # =========================================================================
  - section: calculations
    instances:

      - name: claim_final_amount_sums_voice_and_broadband_lines_at_declared_rates
        claim_type: correct_result
        grounds:
          - calculations.claim_support_amount
          - calculations.claim_support_amount.constants.BASE_SUPPORT_CENTS_PER_MONTH
          - calculations.claim_support_amount.constants.BROADBAND_UPLIFT_CENTS_PER_MONTH
        distinguishing_aspect: |
          The per-enrollment rate ladder is exercised with two DIFFERENT service types in
          one claim over a full 30-day June: a non-tribal VOICE line at 925 and a non-tribal
          BROADBAND line at 925 + 275 = 1200, so final_amount_cents must be exactly 2125 and
          covered_enrollment_count exactly 2. No proration and no rounding are involved, so
          a wrong answer here is a wrong RATE, not a wrong window.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50."
            - "Two non-colliding addresses A1 and A2 (different street numbers), one subscriber each, both non-tribal, both confirmed eligible."
            - "E1 is VOICE at A1 and E2 is BROADBAND at A2, both with benefit_start_date 2026-06-01."
            - "Clock then moved to 2026-07-02T00:00:00Z so the 2026-06 service month is closed."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143130", study_area_code: "489130", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1400 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
