              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "PROHIBITED_MATERIAL", severity: "CRITICAL" }
              as: Proctor
              as_user_id: "${proc_id}"
          trigger:
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${proc_id}"
          assert:
            - "ProctoringSession.${sess_id}.status == VOIDED (hop 1)"
            - "ProctoringSession.${sess_id}.void_reason == AUTO_THRESHOLD"
            - "Appointment.${appt_id}.status == CONSUMED (hop 2)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_temporal_on_checkin
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - state_machines.ProctoringSession.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Error-category pair {state (priority 5)} vs {business_constraint (priority 11)}: a check-in on an
          appointment already CHECKED_IN (state violation) AND whose proctor is overloaded returns ERR_INVALID_STATE,
          because state precedes the load check.
        test_recipe:
          setup:
            - "An appointment already CHECKED_IN (session active) on a proctor whose load is at capacity."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst I" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc I", concurrent_capacity: 1 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand I", email: "i@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Prio Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state priority 5 wins over business_constraint priority 11)"

      - name: existence_beats_business_safety_on_escalation_claim
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - state_machines.Escalation.OPEN_to_UNDER_REVIEW
        distinguishing_aspect: |
          Error-category pair {existence (priority 3)} vs {business_safety/segregation (priority 6)}: claiming a
          NON-EXISTENT escalation id (even as the very proctor who would violate segregation) returns ERR_NOT_FOUND,
          a different category pair than the state-vs-constraint conflict above.
        test_recipe:
          setup:
            - "A registered proctor exists; no escalation with the queried id exists."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst J" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Officer J", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { officer_id: $.data.id }
          trigger:
            - call: "POST /escalations/00000000-0000-4000-8000-000000000000/claim"
              payload: {}
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (existence priority 3 wins over business_safety priority 6)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: integrity_score_exactly_50_does_not_void
        grounds:
          - calculations.session_integrity_score
          - state_machines.ProctoringSession.ACTIVE_to_VOIDED
          - entities.ProctoringSession.fields.status
        distinguishing_aspect: |
          Numeric threshold crossing on session_integrity_score reached via POST /sessions/{id}/flags: a CRITICAL
          + 2 MINOR penalty (40+5+5=50) leaves score exactly 50.00, and because the auto-void rule is strict
          (< 50), the session stays ACTIVE; one more MINOR (score 45) would void it.
        test_recipe:
          setup:
            - "One ACTIVE LIVE session with a CRITICAL flag and a MINOR flag already raised (penalty 45, score 55)."
          setup_api_calls:
            - call: "POST /institutions"
