  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_batch_totals
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, entities.PaymentBatch]
        distinguishing_aspect: "Add-invoice response itself shows recomputed totals in the same request: total_gross_cents == 55000, total_withholding_cents == 12000 (24% backup on 50000 fee), total_net_cents == 43000 for a no-tax-doc domestic contributor — no re-read needed."
        test_recipe:
          setup: ["DeskConfig; DOMESTIC_US contributor WITHOUT tax doc (backup withholding); FLAT 50000 + TRAVEL expense 5000 REIMBURSABLE; invoice VERIFIED (gross 55000, withholding 12000, net 43000), APPROVED; OPEN batch"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Imm Ivan", email: "ivan@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_ivan: $.data.id, c_ivan_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${c_ivan}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 50000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${c_ivan_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_ivan}", title: "IS", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_ivan: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_ivan}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_ivan}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${c_ivan}"
            - call: "POST /freelance-desk/assignments/${asg_ivan}/expense-claims"
              payload: { category: "TRAVEL", requested_cents: 5000 }
              as: Contributor
              as_user_id: "${c_ivan}"
              captures: { exp_ivan: $.data.id }
            - call: "POST /freelance-desk/expense-claims/${exp_ivan}/decide"
              payload: { decision: "APPROVE" }
              as: Editor
            - call: "POST /freelance-desk/expense-claims/${exp_ivan}/submit"
              payload: { claimed_cents: 5000, receipt_attached: true }
              as: Contributor
              as_user_id: "${c_ivan}"
            - call: "POST /freelance-desk/assignments/${asg_ivan}/start"
              payload: {}
              as: Contributor
              as_user_id: "${c_ivan}"
            - call: "POST /freelance-desk/assignments/${asg_ivan}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_ivan}"
            - call: "GET /freelance-desk/assignments/${asg_ivan}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_ivan1: "$.data[0].id", rep_ivan2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_ivan1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_ivan2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/expense-claims/${exp_ivan}/settle-decision"
              payload: { decision: "REIMBURSE" }
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_ivan}/accept-for-publication"
              payload: { final_word_count: 100 }
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_ivan}/invoices"
              payload: { fee_claim_cents: 50000, expense_claim_cents: 5000 }
              as: Contributor
              as_user_id: "${c_ivan}"
              captures: { inv_ivan: $.data.id }
            - call: "POST /freelance-desk/invoices/${inv_ivan}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/invoices/${inv_ivan}/approve"
              payload: {}
              as: FinanceUser
              as_user_id: "fin-2"
            - call: "POST /freelance-desk/payment-batches"
              payload: { scheduled_pay_date: "2026-08-20T00:00:00Z" }
              as: FinanceUser
              captures: { batch_ivan: $.data.id }
          trigger:
            - call: "POST /freelance-desk/payment-batches/${batch_ivan}/add-invoice"
