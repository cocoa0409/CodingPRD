            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /applications/${app_id}/denial-notices", as: Underwriter, captures: { notice_id: "$.data[0].id" } }
            - { call: "POST /denial-notices/${notice_id}/appeals", payload: { grounds: "recheck income" }, as: Borrower, as_user_id: "${b_id}", captures: { appeal_id: $.data.id } }
          trigger:
            - { call: "POST /appeals/${appeal_id}/decision", payload: { outcome: "OVERTURNED" }, as: Underwriter, as_user_id: "uw_9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, http 403 (role gate, distinct from the segregation-of-duties check)"
            - "Appeal.${appeal_id}.status stays SUBMITTED"

      - name: appeal_reviewer_same_identity_as_underwriter_rejected
        claim_type: rbac_denial
        grounds: ["roles[AppealReviewer]", "errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=8]"]
        distinguishing_aspect: "Segregation of duties is identity-based: an AppealReviewer whose X-User-ID equals the denying notice's underwriter_user_id (uw_1) is rejected even though the ROLE is correct — the denial issuer may not review their own denial."
        test_recipe:
          setup: ["fixture C denial (underwriter uw_1) with appeal SUBMITTED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Dora D", email: "dora@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-RBAC4", property_state_code: "TX", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 100000, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /applications/${app_id}/denial-notices", as: Underwriter, captures: { notice_id: "$.data[0].id" } }
            - { call: "POST /denial-notices/${notice_id}/appeals", payload: { grounds: "recheck income" }, as: Borrower, as_user_id: "${b_id}", captures: { appeal_id: $.data.id } }
          trigger:
            - { call: "POST /appeals/${appeal_id}/decision", payload: { outcome: "OVERTURNED" }, as: AppealReviewer, as_user_id: "uw_1", captures: { err: $.data.error_id } }
            - { call: "POST /appeals/${appeal_id}/decision", payload: { outcome: "OVERTURNED" }, as: AppealReviewer, as_user_id: "rev_1", captures: { ok_status: $.data.status } }
          assert:
            - "first trigger: error_id == ERR_SEGREGATION_OF_DUTIES, http 403 (same identity as denying underwriter)"
            - "second trigger (different reviewer): ok_status == OVERTURNED — the identity check, not the appeal, was the blocker"

      - name: borrower_cannot_touch_foreign_borrower_resources
        claim_type: rbac_denial
        grounds: ["roles[Borrower]", "errors[ERR_BORROWER_OWNERSHIP]", "validations[priority=5]"]
        distinguishing_aspect: "entity_backed identity: Borrower B2's X-User-ID does not match loan.borrower_id on B1's chain, so B2's document submission to B1's application is denied at priority 5 (after existence, before state)."
        test_recipe:
          setup: ["two borrowers; B1 has a loan and an ACKNOWLEDGED application"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Eli E", email: "eli@x.com" }, as: ServicingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /borrowers", payload: { full_name: "Eve F", email: "evef@x.com" }, as: ServicingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b1}", loan_number: "LN-RBAC5", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b1}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
          trigger:
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BORROWER_OWNERSHIP, http 403; no document created"

      - name: foreclosure_counsel_cannot_apply_escrow_analysis
        claim_type: rbac_denial
        grounds: ["roles[ForeclosureCounsel]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ForeclosureCounsel is firewalled from escrow operations: apply is ServicingOps-only."
        test_recipe:
          setup: ["loan with a DRAFT escrow analysis"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Gia G", email: "gia@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-RBAC6", property_state_code: "WA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2026-08", comp_year_months: 12, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { an_id: $.data.id } }
          trigger:
            - { call: "POST /escrow-analyses/${an_id}/apply", as: ForeclosureCounsel, captures: { err: $.data.error_id } }
          assert:
