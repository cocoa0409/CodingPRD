  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: commit_then_withdraw_conserves_escrow_held
        grounds:
          - state_machines.Investment.COMMITTED_to_CANCELLED
          - calculations.escrow_held_amount
          - calculations.offering_committed_amount
          - entities.EscrowAccount.fields.held_amount_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = EscrowAccount.held_amount_cents (== Offering.committed_amount_cents): a commit
          of 300,000c followed by its withdrawal returns held_amount_cents and committed_amount_cents to
          their pre-commit values (both 0); the refund equals the commit exactly, zero drift.
        test_recipe:
          setup:
            - "Verified issuer; LIVE SAFE offering with empty escrow; one accredited investor commits 300,000c then withdraws it before the deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Cv Co", ein: "171717171", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "cv@inv.com", legal_name: "Cv Inv", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { req: $.data.id }
            - call: "POST /accreditation-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${inv_id}", amount_cents: 300000, expected_offering_version: "${v0}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { my_inv_id: $.data.id }
          trigger:
            - call: "POST /investments/${my_inv_id}/withdraw"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
              captures: { st: $.data.status, refund: $.data.refund_amount_cents }
          assert:
            - "Investment.${my_inv_id}.status == CANCELLED"
            - "Investment.${my_inv_id}.refund_amount_cents == 300000"
            - "Offering.${off_id}.committed_amount_cents == 0"
            - "EscrowAccount[0].held_amount_cents == 0"
            - "EscrowAccount[0].refunded_amount_cents == 300000"

      - name: failed_raise_conserves_zero_shares_and_full_capital_return
        grounds:
          - state_machines.Offering.LIVE_to_FAILED
          - state_machines.Investment.COMMITTED_to_REFUNDED
          - entities.CapTableEntry.fields.quantity
          - entities.EscrowAccount.fields.refunded_amount_cents
        distinguishing_aspect: |
          DIFFERENT CONSERVED QUANTITY = total issued shares (stays 0) AND total capital returned (== total
          committed): when a raise FAILS, no CapTableEntry is minted (zero shares ever issued) and the sum of
          refunds equals the sum of committed amounts (200,000c committed -> 200,000c refunded, 0 shares).
        test_recipe:
          setup:
            - "Verified issuer; LIVE EQUITY offering (price 1000c, min 500,000c, max 2,000,000c, deadline 2026-07-01); one accredited 200,000c commitment (< min). Offering final-closed -> FAILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
