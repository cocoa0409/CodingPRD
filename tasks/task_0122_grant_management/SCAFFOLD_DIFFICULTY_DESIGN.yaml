  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: restricted_fund_budget_capacity_overlap_aggregate
        grounds:
          - calculations.drawdown_waterfall_allocation
          - entities.RestrictedFund.fields.budgeted_cents
          - entities.RestrictedFund.fields.allocated_cents
          - validations[priority=13]
          - errors[ERR_BUDGET_WOULD_EXCEED]
        distinguishing_aspect: |
          Aggregate-capacity overlap on the RestrictedFund resource: a fund is a finite budget interval
          [0, budgeted_cents]; a new allocation 'overlaps' (collides) when allocated_cents + take >
          budgeted_cents. Interval semantics = aggregate capacity occupancy (sum of postings vs a ceiling),
          giving ERR_BUDGET_WOULD_EXCEED. A first 4000000 draw against a 5000000 fund succeeds; a second
          2000000 draw collides (4000000+2000000 > 5000000).
        test_recipe:
          setup:
            - "ACTIVE Award with a single RestrictedFund budget 5000000; one drawdown 4000000 DISBURSED (allocated=4000000); a second REQUESTED drawdown 2000000 against the same fund."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A15", applicant_org_name: "Org O", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app15_id: $.data.id }
            - call: "POST /applications/${app15_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app15_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app15_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award15_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award15_id}", category: "PERSONNEL", budgeted_cents: 5000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { rf15_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${award15_id}", amount_cents: 4000000, allocation_plan: [ { restricted_fund_id: "${rf15_id}", amount_cents: 4000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_15"
              captures: { dd15a_id: $.data.id }
            - call: "POST /drawdowns/${dd15a_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_15"
            - call: "POST /drawdowns"
              payload: { award_id: "${award15_id}", amount_cents: 2000000, allocation_plan: [ { restricted_fund_id: "${rf15_id}", amount_cents: 2000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_15"
              captures: { dd15b_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${dd15b_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_15"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BUDGET_WOULD_EXCEED"
            - "RestrictedFund.${rf15_id}.allocated_cents == 4000000"

      - name: award_federal_ceiling_lifetime_capacity_overlap
        grounds:
          - state_machines.Drawdown.REQUESTED_to_DISBURSED
          - entities.Award.fields.federal_ceiling_cents
          - entities.Award.fields.federal_drawn_cents
          - validations[priority=12]
          - errors[ERR_CEILING_EXCEEDED]
        distinguishing_aspect: |
          Different resource (Award) and different interval semantics from the per-fund aggregate: the
          award's lifetime federal cash is interval [0, federal_ceiling_cents]; a drawdown collides when
          federal_drawn_cents + amount_cents > federal_ceiling_cents, regardless of any single fund's
          headroom. Here funds have ample budget but the award ceiling (8000000) is the binding interval:
          first 8000000 draw fills the ceiling, a second 1 collides with ERR_CEILING_EXCEEDED.
        test_recipe:
          setup:
            - "ACTIVE Award total 10000000 federal_share 0.80 -> ceiling 8000000; one fund budget 20000000; first drawdown 8000000 DISBURSED (federal_drawn=8000000); second REQUESTED drawdown 1 cent."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A16", applicant_org_name: "Org P", requested_amount_cents: 10000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app16_id: $.data.id }
            - call: "POST /applications/${app16_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app16_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app16_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award16_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award16_id}", category: "PERSONNEL", budgeted_cents: 20000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { rf16_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${award16_id}", amount_cents: 8000000, allocation_plan: [ { restricted_fund_id: "${rf16_id}", amount_cents: 8000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_16"
              captures: { dd16a_id: $.data.id }
            - call: "POST /drawdowns/${dd16a_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_16"
            - call: "POST /drawdowns"
              payload: { award_id: "${award16_id}", amount_cents: 1, allocation_plan: [ { restricted_fund_id: "${rf16_id}", amount_cents: 1 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_16"
              captures: { dd16b_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${dd16b_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_16"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CEILING_EXCEEDED"
            - "Award.${award16_id}.federal_drawn_cents == 8000000"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: drawdown_return_conserves_award_federal_drawn
        grounds:
          - state_machines.Drawdown.DISBURSED_to_RETURNED
          - state_machines.Drawdown.REQUESTED_to_DISBURSED
          - entities.Award.fields.federal_drawn_cents
        distinguishing_aspect: |
          Conserved quantity Q1 = Award.federal_drawn_cents. Forward action disburse adds amount_cents;
          compensating action return subtracts the same amount_cents, so federal_drawn_cents MUST return to
          its exact pre-disburse value (0 here). Pinned formula: federal_drawn_cents_after_return ==
          federal_drawn_cents_before_disburse.
        test_recipe:
          setup:
            - "ACTIVE Award (federal_drawn=0); one fund budget 10000000; a drawdown 6000000 DISBURSED then RETURNED."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A17", applicant_org_name: "Org Q", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app17_id: $.data.id }
            - call: "POST /applications/${app17_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app17_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app17_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award17_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award17_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { rf17_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${award17_id}", amount_cents: 6000000, allocation_plan: [ { restricted_fund_id: "${rf17_id}", amount_cents: 6000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_17"
              captures: { dd17_id: $.data.id }
            - call: "POST /drawdowns/${dd17_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_17"
          trigger:
            - call: "POST /drawdowns/${dd17_id}/return"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_17"
          assert:
            - "Drawdown.${dd17_id}.status == RETURNED"
            - "Award.${award17_id}.federal_drawn_cents == 0"

      - name: drawdown_return_conserves_restricted_fund_allocated
        grounds:
          - state_machines.Drawdown.DISBURSED_to_RETURNED
          - calculations.drawdown_waterfall_allocation
          - entities.RestrictedFund.fields.allocated_cents
        distinguishing_aspect: |
          Different conserved quantity Q2 = sum of RestrictedFund.allocated_cents over the award's funds.
          Disburse posts the waterfall (raising allocated_cents on the touched funds); return reverses each
          FundAllocation, so every fund's allocated_cents MUST return to its pre-disburse value. Pinned
          formula: rf_a.allocated_cents + rf_b.allocated_cents == 0 after the return (both back to 0).
        test_recipe:
          setup:
            - "ACTIVE Award; two funds priority 1/2 budget 5000000/5000000; a drawdown 7000000 DISBURSED (fund1=5000000, fund2=2000000) then RETURNED."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A18", applicant_org_name: "Org R", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app18_id: $.data.id }
            - call: "POST /applications/${app18_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app18_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app18_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award18_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award18_id}", category: "PERSONNEL", budgeted_cents: 5000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { rf18a_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award18_id}", category: "TRAVEL", budgeted_cents: 5000000, priority_order: 2 }
              as: FinanceOfficer
              captures: { rf18b_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${award18_id}", amount_cents: 7000000, allocation_plan: [ { restricted_fund_id: "${rf18a_id}", amount_cents: 5000000 }, { restricted_fund_id: "${rf18b_id}", amount_cents: 2000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_18"
              captures: { dd18_id: $.data.id }
            - call: "POST /drawdowns/${dd18_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_18"
          trigger:
            - call: "POST /drawdowns/${dd18_id}/return"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_18"
          assert:
            - "Drawdown.${dd18_id}.status == RETURNED"
            - "RestrictedFund.${rf18a_id}.allocated_cents == 0"
            - "RestrictedFund.${rf18b_id}.allocated_cents == 0"
