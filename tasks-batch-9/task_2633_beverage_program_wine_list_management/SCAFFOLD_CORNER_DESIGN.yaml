  - section: calculations
    instances:
      - name: par_report_rounds_deficit_up_to_whole_cases_and_flags_urgent
        claim_type: Correct Result
        grounds:
          - calculations.par_reorder_quantity
          - constants_global.PAR_URGENT_FRACTION
          - endpoints["GET /beverage-program/venues/{venue_id}/par-report"]
        distinguishing_aspect: >-
          Two entries at par_bottles 12 on a case_pack of 6 pin both halves of the threshold rule: 4
          bottles on hand gives deficit 8 rounded UP to 12 (two whole cases) and is_urgent true, while
          6 bottles on hand — exactly ceil(12 * 0.5) — gives reorder 6 and is_urgent FALSE because the
          comparison is strict "<". The declared sort (urgent DESC, reorder DESC, sort_rank ASC) must
          put the urgent line first even though it was created second.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with bin A1 (capacity 48)."
            - "Two RED wines A and B, both case_pack 6."
            - "A PUBLISHED ListVersion with entry B at sort_rank 1 (par_bottles 12) and entry A at sort_rank 2 (par_bottles 12)."
            - "Lots: 6 bottles of wine B, 4 bottles of wine A, both ON_HAND, no granted claims anywhere."
