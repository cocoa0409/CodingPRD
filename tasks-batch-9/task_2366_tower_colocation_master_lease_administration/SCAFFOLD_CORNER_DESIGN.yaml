          - state_machines.ColocationApplication.transitions.UNDER_STRUCTURAL_REVIEW_to_CAPACITY_HOLD
          - calculations.tower_capacity_posture
        distinguishing_aspect: |
          Advancing the clock past a lease's term_end_date runs the sweep inside the same request:
          the lease becomes EXPIRED, the tower's posture becomes FROZEN, the reviewing application
          drops to CAPACITY_HOLD, open_review_count falls to 0, and the clock response reports
          expired_ground_lease_count 1 / expired_master_lease_count 0 / frozen_tower_count 1.
