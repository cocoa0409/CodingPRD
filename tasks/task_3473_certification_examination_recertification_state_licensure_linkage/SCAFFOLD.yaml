# =============================================================================
# SCAFFOLD — Certification Examination, Recertification & State Licensure
# Linkage (National Registry of Emergency Medical Technicians style domain)
# =============================================================================

scenario: |
  Certification Examination, Recertification & State Licensure Linkage (National Registry of Emergency Medical Technicians): candidate eligibility requiring completion of an accredited education program within a validity window, cognitive examination delivery through adaptive computer-based testing with pass determination and retake limits, psychomotor skill verification through state or program-administered testing with documentation submission, certification levels with distinct scopes and the relationship between national certification and state licensure requirements, recertification through continuing education models with distributed, individual and local components and audit sampling, lapsed certification reentry pathways with refresher requirements, disciplinary actions for exam security violations, falsified education or criminal conduct with due process, state adoption variations where some states use their own examination

domain_name: ems-certification-registry
api_prefix: /registry

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - selector_policy
  entity_topology: flat            # peer entities wired by foreign keys, no URL nesting
  state_machine_shape: cyclic      # rehearing loop, lapse->reentry loop, deny->resubmit loops
  relationship_patterns:
    - one_to_many
    - many_to_many                 # Certification <-> State via LicenseApplication junction
    - cross_aggregate
    - polymorphic                  # PsychomotorVerification submitted by ProgramDirector OR StateOfficial
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: beyond_expert
  entity_count: 17
  state_machine_count: 14
  calculation_count: 11
  endpoint_count: 66
  error_code_count: 51
  role_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LevelDefinition
    parent: null
    common_fields: false           # configuration entity: id + created_at only
    fields:
      - { name: code, type: enum, source: input, description: "Certification level code", constraints: "EMR | EMT | AEMT | PARAMEDIC; unique across LevelDefinition rows" }
      - { name: display_name, type: string, source: input, description: "Human-readable level name" }
      - { name: scope_summary, type: string, source: input, description: "Distinct scope-of-practice summary for this level" }
      - { name: cognitive_cut_score, type: number, source: input, description: "CAT pass cut score (theta threshold, 0..1)" }
      - { name: ce_total_hours, type: number, source: input, description: "Total CE hours required per recertification cycle (NCCP model)" }
      - { name: ce_national_min_hours, type: number, source: input, description: "Minimum NATIONAL component hours (NCCP model)" }
      - { name: ce_local_min_hours, type: number, source: input, description: "Minimum LOCAL component hours (NCCP model)" }
      - { name: ce_individual_min_hours, type: number, source: input, description: "Minimum INDIVIDUAL component hours (NCCP model)" }
      - { name: hourly_model_total_hours, type: number, source: input, description: "Flat total hours required under the HOURLY recertification model" }
      - { name: remedial_hours_required, type: number, source: input, description: "Remedial education hours gating cognitive attempts 4-6" }
      - { name: refresher_hours_required, type: number, source: input, description: "Refresher course hours required for TIER_REFRESHER reentry" }
      - { name: initial_application_fee_cents, type: integer, source: input, description: "Recorded fee for an initial ExamApplication at this level" }
      - { name: recert_application_fee_cents, type: integer, source: input, description: "Recorded fee for a RecertApplication at this level" }

  - name: StateAdoptionPolicy
    parent: null
    common_fields: false
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique across StateAdoptionPolicy rows" }
      - { name: adoption_mode, type: enum, source: input, description: "NREMT_ACCEPTED | STATE_EXAM | HYBRID — how this state links national certification to licensure" }
      - { name: accepted_level_codes, type: array, source: input, required: false, description: "Level codes accepted via the national-certification path (NREMT_ACCEPTED/HYBRID)" }
      - { name: jurisprudence_exam_required, type: boolean, source: input, default: false, description: "Whether the state requires a jurisprudence exam attestation" }
      - { name: base_license_fee_cents, type: integer, source: input, description: "Base licensure application fee" }
      - { name: national_verification_surcharge_cents, type: integer, source: input, required: false, default: 0, description: "Surcharge line applied on the NREMT verification path" }
      - { name: state_exam_fee_cents, type: integer, source: input, required: false, default: 0, description: "Fee line applied on the state-exam path" }
      - { name: registry_share_bps, type: integer, source: input, required: false, default: 1500, description: "Registry revenue share in basis points (1500 = 15%)" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Candidate legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, description: "REGISTERED | BARRED — BARRED on FINAL PERMANENT_BAR sanction" }
      - { name: disciplinary_hold, type: boolean, source: computed, default: false, description: "True while any non-FINAL DisciplinaryCase on this candidate carries interim_action HOLD_NEW_APPLICATIONS" }

  - name: EducationProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: level_id, type: string, source: input, description: "FK -> LevelDefinition.id; level this program teaches" }
      - { name: director_user_id, type: string, source: input, description: "Opaque X-User-ID of the ProgramDirector accountable for attestations" }
      - { name: accreditation_status, type: enum, source: system, description: "ACCREDITED | PROVISIONAL | SUSPENDED | REVOKED; initial ACCREDITED" }
      - { name: accreditation_history, type: array, source: system, description: "Append-only [{to_status, effective_date, recorded_at, reason}] event log; entry 0 is the initial ACCREDITED at creation with effective_date = created_at" }

  - name: ProgramCompletionRecord
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: program_id, type: string, source: input, description: "FK -> EducationProgram.id" }
      - { name: completion_date, type: string, source: input, description: "ISO date the candidate completed the program" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the attesting ProgramDirector" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | REJECTED | INVALIDATED" }
      - { name: verified_at, type: datetime, source: system, description: "Set on VERIFIED decision" }
      - { name: within_validity_window, type: boolean, source: computed, description: "completion_date <= now <= add_months(completion_date, 24)" }
      - { name: attempts_consumed, type: integer, source: computed, description: "CognitiveExamAttempts on this basis in SCORED_PASS | SCORED_FAIL (NO_SHOW and VOIDED excluded)" }
      - { name: attempts_remaining, type: integer, source: computed, description: "ATTEMPT_HARD_CAP(6) - attempts_consumed" }
      - { name: invalidated_by_case_id, type: string, source: system, description: "FK -> DisciplinaryCase.id; nullable; set when falsification invalidates the record" }

  - name: ExamApplication
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; from X-User-ID of the creating Candidate" }
      - { name: level_id, type: string, source: input, description: "FK -> LevelDefinition.id" }
      - { name: completion_record_id, type: string, source: input, description: "FK -> ProgramCompletionRecord.id; eligibility basis" }
      - { name: application_fee_cents, type: integer, source: computed, description: "Snapshot of level.initial_application_fee_cents at creation" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED" }
      - { name: denial_reason, type: string, source: system, description: "Nullable; set on DENIED" }
      - { name: decided_at, type: datetime, source: system, description: "Nullable; set on decision" }
      - { name: att_id, type: string, source: system, description: "Nullable; id of the AuthorizationToTest minted on APPROVED" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Increments on each DENIED -> SUBMITTED resubmit" }

  - name: AuthorizationToTest
    parent: null
    common_fields: true
    fields:
      - { name: exam_application_id, type: string, source: system, description: "FK -> ExamApplication.id" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id" }
      - { name: issued_on, type: datetime, source: system, description: "Issued at approval instant" }
      - { name: expires_on, type: datetime, source: system, description: "issued_on + 90 days; scheduling allowed while now <= expires_on" }
      - { name: attempt_id, type: string, source: system, description: "Nullable; the single CognitiveExamAttempt scheduled against this ATT" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONSUMED | EXPIRED | REVOKED" }

  - name: CognitiveExamAttempt
    parent: null
    common_fields: true
    fields:
      - { name: att_id, type: string, source: input, description: "FK -> AuthorizationToTest.id" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; derived from ATT" }
      - { name: level_id, type: string, source: system, description: "FK -> LevelDefinition.id; derived from the application" }
      - { name: basis_completion_record_id, type: string, source: system, description: "FK -> ProgramCompletionRecord.id; attempt-budget basis, derived from the application" }
      - { name: attempt_number, type: integer, source: computed, description: "attempts_consumed(basis) + 1 at scheduling" }
      - { name: scheduled_start, type: datetime, source: input, description: "Delivery window open (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Delivery window close (inclusive); must be > scheduled_start" }
      - { name: delivered_at, type: datetime, source: system, description: "Nullable; set when responses are scored" }
      - { name: responses, type: array, source: input, description: "[{item_id, difficulty_b (0.1..1.0), correct (bool)}], max MAX_ITEMS(12) entries, delivery order" }
      - { name: items_delivered_count, type: integer, source: computed, description: "Items processed until the stopping rule fired (or n if none)" }
      - { name: provisional_outcome, type: enum, source: computed, description: "PASS | FAIL | null — point-estimate outcome at k == MIN_ITEMS" }
      - { name: final_outcome, type: enum, source: computed, description: "PASS | FAIL | null — confidence-band stopping-rule outcome" }
      - { name: theta_final, type: number, source: computed, description: "Difficulty-weighted accuracy at stop, stored round_half_up to 4dp" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SCORED_PASS | SCORED_FAIL | NO_SHOW | VOIDED" }
      - { name: voided_by_case_id, type: string, source: system, description: "FK -> DisciplinaryCase.id; nullable" }

  - name: RemedialEducationRecord
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: level_id, type: string, source: input, description: "FK -> LevelDefinition.id" }
      - { name: hours, type: number, source: input, description: "Remedial hours completed (> 0, 0.5 increments)" }
      - { name: completed_date, type: string, source: input, description: "ISO date remediation completed" }
      - { name: provider_name, type: string, source: input, description: "Remedial provider" }
      - { name: attested_by_user_id, type: string, source: system, description: "X-User-ID of the attesting ProgramDirector; record is VERIFIED at creation" }

  - name: PsychomotorVerification
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: level_id, type: string, source: input, description: "FK -> LevelDefinition.id" }
      - { name: administered_by, type: enum, source: input, description: "PROGRAM | STATE — polymorphic submitter" }
      - { name: program_id, type: string, source: input, required: false, description: "FK -> EducationProgram.id; required iff administered_by == PROGRAM, forbidden otherwise" }
      - { name: evaluator_user_id, type: string, source: system, description: "X-User-ID of the submitting evaluator" }
      - { name: completion_record_id, type: string, source: input, description: "FK -> ProgramCompletionRecord.id; eligibility cross-reference" }
      - { name: exam_date, type: string, source: input, description: "ISO date of the psychomotor examination" }
      - { name: stations, type: array, source: input, description: "Non-empty [{station_code, passed (bool)}]" }
      - { name: documentation_attached, type: boolean, source: input, description: "True when supporting documentation accompanies the submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED" }
      - { name: verified_at, type: datetime, source: system, description: "Nullable; set on VERIFIED decision; validity window is [date(verified_at), add_months(verified_at,24))" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: level_id, type: string, source: input, description: "FK -> LevelDefinition.id" }
      - { name: basis_completion_record_id, type: string, source: input, description: "FK -> ProgramCompletionRecord.id" }
      - { name: basis_attempt_id, type: string, source: input, description: "FK -> CognitiveExamAttempt.id (must be SCORED_PASS)" }
      - { name: basis_psychomotor_id, type: string, source: input, description: "FK -> PsychomotorVerification.id (must be VERIFIED)" }
      - { name: issued_on, type: datetime, source: system, description: "Issuance instant (logical clock)" }
      - { name: expires_on, type: datetime, source: system, description: "add_months(issued_on, 24); extended by recertification, reset by reentry" }
      - { name: lapse_deadline, type: datetime, source: computed, description: "add_months(expires_on, 48); LAPSED -> EXPIRED sweep boundary" }
      - { name: renewed_count, type: integer, source: system, default: 0, description: "Approved recertifications applied" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | LAPSED | EXPIRED | REVOKED" }
      - { name: suspension_ends, type: datetime, source: system, description: "Nullable; set by SUSPENSION_12M sanction (finalized_at + 12 months)" }
      - { name: pre_sanction_status, type: enum, source: system, description: "Nullable; status captured before a disciplinary transition" }
      - { name: revoked_by_case_id, type: string, source: system, description: "FK -> DisciplinaryCase.id; nullable" }

  - name: RecertApplication
    parent: null
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: input, description: "FK -> Certification.id" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; derived from certification" }
      - { name: model, type: enum, source: input, description: "NCCP | HOURLY — continuing-education model" }
      - { name: cycle_window_start, type: datetime, source: computed, description: "add_months(cert.expires_on, -12) captured at creation" }
      - { name: cert_expires_on_at_creation, type: datetime, source: system, description: "Certification.expires_on pinned at creation; drives the anniversary-preserving extension" }
      - { name: recert_seq, type: integer, source: computed, description: "1 + count of prior applications for this certification that ever reached SUBMITTED" }
      - { name: audit_selected, type: boolean, source: computed, description: "Deterministic audit-selection flag (audit_sampling_selector)" }
      - { name: audit_reasons, type: array, source: computed, description: "Which selector predicates fired: SEQ_MOD | PRIOR_AUDIT_FAILURE | SINGLE_PROVIDER_CONCENTRATION" }
      - { name: national_credited_hours, type: number, source: computed, description: "ce_credit_waterfall output" }
      - { name: local_credited_hours, type: number, source: computed, description: "ce_credit_waterfall output" }
      - { name: individual_credited_hours, type: number, source: computed, description: "ce_credit_waterfall output (includes spill)" }
      - { name: total_credited_hours, type: number, source: computed, description: "Sum of the three credited components" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | AUDIT_PENDING | APPROVED | DENIED | AUDIT_FAILED | SUPERSEDED" }
      - { name: submitted_at, type: datetime, source: system, description: "Nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Nullable" }

  - name: CECreditEntry
    parent: null
    common_fields: true
    fields:
      - { name: recert_application_id, type: string, source: system, description: "FK -> RecertApplication.id" }
      - { name: component, type: enum, source: input, description: "NATIONAL | LOCAL | INDIVIDUAL" }
      - { name: hours, type: number, source: input, description: "> 0 and in 0.5-hour increments" }
      - { name: delivery_method, type: enum, source: input, description: "DISTRIBUTED | IN_PERSON" }
      - { name: course_code, type: string, source: input, description: "Unique within the parent application" }
      - { name: course_date, type: string, source: input, description: "ISO date; must fall inside [cycle_window_start, cert_expires_on_at_creation]" }
      - { name: provider_name, type: string, source: input, description: "CE provider" }
      - { name: status, type: enum, source: system, description: "RECORDED | VERIFIED | REJECTED (audit verdict)" }
      - { name: reject_reason, type: string, source: system, description: "Nullable; set when an audit verdict rejects the entry" }

  - name: ReentryApplication
    parent: null
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: input, description: "FK -> Certification.id (must be LAPSED)" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; derived from certification" }
      - { name: lapse_months_at_submission, type: number, source: computed, description: "Whole months between cert.expires_on and now (add_months semantics)" }
      - { name: tier, type: enum, source: computed, description: "TIER_CE_ONLY | TIER_REFRESHER (lapse > 24 months rejects creation)" }
      - { name: ce_makeup_hours_claimed, type: number, source: input, required: false, description: "CE make-up hours (required at approval for TIER_CE_ONLY)" }
      - { name: refresher_hours_claimed, type: number, source: input, required: false, description: "Refresher course hours (required at approval for TIER_REFRESHER)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED" }
      - { name: decided_at, type: datetime, source: system, description: "Nullable" }

  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; from X-User-ID" }
      - { name: state_code, type: string, source: input, description: "Target state; resolves the StateAdoptionPolicy" }
      - { name: level_id, type: string, source: input, description: "FK -> LevelDefinition.id" }
      - { name: policy_id, type: string, source: system, description: "FK -> StateAdoptionPolicy.id resolved at creation" }
      - { name: adoption_mode_snapshot, type: enum, source: system, description: "Policy adoption_mode pinned at creation" }
      - { name: registry_share_bps_snapshot, type: integer, source: system, description: "Policy registry_share_bps pinned at creation" }
      - { name: fee_lines_snapshot, type: array, source: system, description: "Policy fee lines pinned at creation" }
      - { name: path, type: enum, source: computed, description: "NREMT | STATE_EXAM — resolved from adoption_mode_snapshot and supplied references" }
      - { name: certification_id, type: string, source: input, required: false, description: "FK -> Certification.id; required for NREMT path" }
      - { name: certification_version_at_submission, type: integer, source: system, description: "Nullable; certification version pinned at creation (OCC token)" }
      - { name: state_exam_record_id, type: string, source: input, required: false, description: "FK -> StateExamRecord.id; required for STATE_EXAM path" }
      - { name: jurisprudence_completed, type: boolean, source: input, required: false, default: false, description: "Jurisprudence exam attestation" }
      - { name: assessed_fee_cents, type: integer, source: computed, description: "Nullable until GRANTED; sum of applicable fee lines" }
      - { name: registry_share_cents, type: integer, source: computed, description: "Nullable until GRANTED; per-line rounded registry share (see licensure_fee_assessment)" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | MORE_INFO_REQUIRED | GRANTED | DENIED" }
      - { name: decision_reason, type: string, source: system, description: "Nullable" }
      - { name: more_info_note, type: string, source: system, description: "Nullable" }
      - { name: granted_on, type: datetime, source: system, description: "Nullable" }

  - name: StateExamRecord
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: state_code, type: string, source: input, description: "State whose own examination this record reports" }
      - { name: level_id, type: string, source: input, description: "FK -> LevelDefinition.id" }
      - { name: exam_date, type: string, source: input, description: "ISO date of the state examination" }
      - { name: score, type: number, source: input, description: "Reported score" }
      - { name: passing_score, type: number, source: input, description: "State passing threshold" }
      - { name: passed, type: boolean, source: computed, description: "score >= passing_score" }
      - { name: status, type: enum, source: system, description: "VALID | VOIDED (voided by disciplinary FINAL with sanction >= REVOCATION)" }
      - { name: voided_by_case_id, type: string, source: system, description: "FK -> DisciplinaryCase.id; nullable" }

  - name: DisciplinaryCase
    parent: null
    common_fields: true
    fields:
      - { name: subject_candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: violation_type, type: enum, source: input, description: "EXAM_SECURITY | FALSIFIED_EDUCATION | CRIMINAL_CONDUCT" }
      - { name: description, type: string, source: input, description: "Allegation narrative" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the opener (RegistryAdmin or StateOfficial)" }
      - { name: interim_action, type: enum, source: input, default: "NONE", description: "NONE | SUSPEND_CERTIFICATION | HOLD_NEW_APPLICATIONS — applied immediately at creation" }
      - { name: implicated_attempt_ids, type: array, source: input, required: false, description: "FK -> CognitiveExamAttempt.id; array of implicated attempt ids" }
      - { name: implicated_completion_record_ids, type: array, source: input, required: false, description: "FK -> ProgramCompletionRecord.id; array of implicated completion-record ids" }
      - { name: hearing_officer_user_id, type: string, source: system, description: "Nullable; set at schedule-hearing; must differ from opened_by_user_id" }
      - { name: sanction_type, type: enum, source: system, description: "Nullable until DECIDED: NONE | WARNING | SUSPENSION_12M | REVOCATION | PERMANENT_BAR" }
      - { name: findings, type: string, source: system, description: "Nullable; hearing findings" }
      - { name: response_deadline, type: datetime, source: system, description: "notice_issued_at + 30 days" }
      - { name: appeal_deadline, type: datetime, source: system, description: "decided_at + 30 days" }
      - { name: decided_at, type: datetime, source: system, description: "Nullable" }
      - { name: finalized_at, type: datetime, source: system, description: "Nullable; set on entry to FINAL" }
      - { name: rehearing_count, type: integer, source: system, default: 0, description: "Increments each time an appeal is OVERTURNED" }
      - { name: status, type: enum, source: system, description: "OPENED | NOTICE_ISSUED | UNDER_REVIEW | HEARING_SCHEDULED | DECIDED | APPEAL_PENDING | REHEARING | FINAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Candidate
    initial_state: REGISTERED
    terminal_states: [BARRED]
    transitions:
      - from: REGISTERED
        to: BARRED
        trigger: "system (DisciplinaryCase enters FINAL with sanction_type == PERMANENT_BAR)"
        actor: system
        preconditions: []
        side_effects:
          - "Candidate can no longer create exam applications, recertification, reentry, or license applications (ERR_PERMANENTLY_BARRED)"

  - entity: EducationProgram
    initial_state: ACCREDITED
    terminal_states: [REVOKED]
    transitions:
      - from: ACCREDITED
        to: PROVISIONAL
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=PROVISIONAL)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["append accreditation_history entry"]
      - from: PROVISIONAL
        to: ACCREDITED
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=ACCREDITED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["append accreditation_history entry"]
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=SUSPENDED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["append accreditation_history entry"]
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=SUSPENDED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["append accreditation_history entry"]
      - from: SUSPENDED
        to: ACCREDITED
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=ACCREDITED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["append accreditation_history entry"]
      - from: ACCREDITED
        to: REVOKED
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=REVOKED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects:
          - "append accreditation_history entry"
          - "CASCADE hop 1: this program's ProgramCompletionRecords in PENDING_VERIFICATION -> REJECTED"
          - "CASCADE hop 1b: this program's ProgramCompletionRecords in VERIFIED with completion_date strictly after the revocation effective_date -> INVALIDATED"
          - "CASCADE hop 2: ExamApplications in SUBMITTED citing records invalidated in hop 1b -> DENIED (reason: program revocation)"
          - "CASCADE hop 3: Certifications whose basis_completion_record_id was invalidated in hop 1b (status ACTIVE | SUSPENDED | LAPSED) -> REVOKED (pre_sanction_status stored)"
          - "CASCADE hop 4: LicenseApplications in UNDER_REVIEW | MORE_INFO_REQUIRED citing certifications revoked in hop 3 -> DENIED"
        note: "Cascade steps execute in listed order; each hop's target set is computed after the previous hop lands."
      - from: PROVISIONAL
        to: REVOKED
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=REVOKED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["same cascade as ACCREDITED -> REVOKED"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /registry/education-programs/{id}/accreditation-events (to_status=REVOKED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["same cascade as ACCREDITED -> REVOKED"]

  - entity: ProgramCompletionRecord
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, INVALIDATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /registry/program-completion-records/{id}/decision (outcome=VERIFIED)"
        actor: RegistryAdmin
        preconditions:
          - "Record must be PENDING_VERIFICATION (ERR_COMPLETION_NOT_PENDING)"
          - "Program accreditation at completion_date in {ACCREDITED, PROVISIONAL} (ERR_PROGRAM_NOT_ACCREDITED_AT_COMPLETION)"
        side_effects: ["verified_at = now"]
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /registry/program-completion-records/{id}/decision (outcome=REJECTED)"
        actor: RegistryAdmin
        preconditions:
          - "Record must be PENDING_VERIFICATION (ERR_COMPLETION_NOT_PENDING)"
        side_effects: []
      - from: VERIFIED
        to: INVALIDATED
        trigger: "system (disciplinary FINAL with violation FALSIFIED_EDUCATION implicating this record, or program-revocation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "ExamApplications in SUBMITTED citing this record -> DENIED"
          - "Certifications whose basis_completion_record_id == this record (ACTIVE | SUSPENDED | LAPSED) -> REVOKED"
          - "LicenseApplications in UNDER_REVIEW | MORE_INFO_REQUIRED citing those certifications -> DENIED"

  - entity: ExamApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /registry/exam-applications/{id}/decision (outcome=APPROVED)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
          - "Completion record VERIFIED and within its 24-month validity window at decision time (ERR_EDUCATION_VALIDITY_EXPIRED)"
          - "Program accreditation at completion_date in {ACCREDITED, PROVISIONAL} (ERR_PROGRAM_NOT_ACCREDITED_AT_COMPLETION)"
          - "Completion record belongs to this candidate and teaches this level (ERR_CROSS_REFERENCE_MISMATCH)"
          - "Candidate not BARRED and no disciplinary hold (ERR_PERMANENTLY_BARRED / ERR_DISCIPLINARY_HOLD)"
          - "attempts_consumed(basis) < ATTEMPT_HARD_CAP (ERR_ATTEMPT_LIMIT_REACHED)"
          - "If attempts_consumed(basis) >= 3: a RemedialEducationRecord for this candidate+level with hours >= level.remedial_hours_required and completed_date strictly after the 3rd SCORED_FAIL's delivered date must exist (ERR_REMEDIAL_REQUIRED)"
        side_effects:
          - "Mint AuthorizationToTest (status ISSUED, issued_on = now, expires_on = now + 90 days) and set att_id"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /registry/exam-applications/{id}/decision (outcome=DENIED)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects: ["denial_reason set"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /registry/exam-applications/{id}/resubmit"
        actor: Candidate
        preconditions:
          - "Application must be DENIED (ERR_APPLICATION_NOT_DENIED)"
          - "Caller must own the application (ERR_FORBIDDEN_ROLE)"
        side_effects: ["resubmission_count += 1", "denial_reason cleared"]
        note: "Deny-resubmit cycle; each resubmission re-enters the full approval validation set."

  - entity: AuthorizationToTest
    initial_state: ISSUED
    terminal_states: [CONSUMED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: CONSUMED
        trigger: "system (the attempt scheduled against this ATT is scored via /responses, or is swept to NO_SHOW)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock sweep: expires_on < now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "system (disciplinary FINAL with sanction REVOCATION | PERMANENT_BAR on the candidate)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CognitiveExamAttempt
    initial_state: SCHEDULED
    terminal_states: [SCORED_PASS, SCORED_FAIL, NO_SHOW, VOIDED]
    transitions:
      - from: SCHEDULED
        to: SCORED_PASS
        trigger: "POST /registry/cognitive-exam-attempts/{id}/responses"
        actor: ExamProctor
        preconditions:
          - "Attempt must be SCHEDULED (ERR_ATTEMPT_NOT_SCHEDULED)"
          - "scheduled_start <= now <= scheduled_end (ERR_DELIVERY_WINDOW_NOT_OPEN)"
        side_effects:
          - "cat_adaptive_scoring computes provisional_outcome, final_outcome, theta_final, items_delivered_count"
          - "delivered_at = now"
          - "ATT -> CONSUMED"
      - from: SCHEDULED
        to: SCORED_FAIL
        trigger: "POST /registry/cognitive-exam-attempts/{id}/responses"
        actor: ExamProctor
        preconditions:
          - "Attempt must be SCHEDULED (ERR_ATTEMPT_NOT_SCHEDULED)"
          - "scheduled_start <= now <= scheduled_end (ERR_DELIVERY_WINDOW_NOT_OPEN)"
        side_effects:
          - "cat_adaptive_scoring computes provisional_outcome, final_outcome, theta_final, items_delivered_count"
          - "delivered_at = now"
          - "ATT -> CONSUMED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (clock sweep: scheduled_end < now and never delivered)"
        actor: system
        preconditions: []
        side_effects:
          - "ATT -> CONSUMED"
          - "NO_SHOW does NOT consume attempt budget (attempts_consumed excludes NO_SHOW)"
      - from: SCORED_PASS
        to: VOIDED
        trigger: "system (disciplinary FINAL, violation EXAM_SECURITY implicating this attempt, sanction >= SUSPENSION_12M)"
        actor: system
        preconditions: []
        side_effects:
          - "voided_by_case_id set"
          - "Certifications whose basis_attempt_id == this attempt (ACTIVE | SUSPENDED | LAPSED) -> REVOKED"
          - "LicenseApplications in UNDER_REVIEW | MORE_INFO_REQUIRED citing those certifications -> DENIED"
          - "VOIDED is excluded from attempts_consumed, so the attempt budget is restored"
      - from: SCORED_FAIL
        to: VOIDED
        trigger: "system (disciplinary FINAL, violation EXAM_SECURITY implicating this attempt, sanction >= SUSPENSION_12M)"
        actor: system
        preconditions: []
        side_effects: ["same compensation side effects as SCORED_PASS -> VOIDED"]

  - entity: PsychomotorVerification
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /registry/psychomotor-verifications/{id}/decision (outcome=VERIFIED)"
        actor: RegistryAdmin
        preconditions:
          - "Record must be SUBMITTED (ERR_PSYCHOMOTOR_NOT_SUBMITTED)"
          - "All stations passed and documentation_attached == true (ERR_PSYCHOMOTOR_REQUIREMENTS_UNMET)"
        side_effects: ["verified_at = now"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /registry/psychomotor-verifications/{id}/decision (outcome=REJECTED)"
        actor: RegistryAdmin
        preconditions:
          - "Record must be SUBMITTED (ERR_PSYCHOMOTOR_NOT_SUBMITTED)"
        side_effects: []

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (clock sweep: expires_on < now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: EXPIRED
        trigger: "system (clock sweep: lapse_deadline < now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /registry/reentry-applications/{id}/decision (outcome=APPROVED)"
        actor: RegistryAdmin
        preconditions: ["Reentry tier requirements validated (reentry_tier_assignment)"]
        side_effects:
          - "expires_on = add_months(now, 24) — fresh cycle from reinstatement, NOT anniversary-preserving"
          - "lapse_deadline recomputed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (DisciplinaryCase created with interim_action SUSPEND_CERTIFICATION, or FINAL sanction SUSPENSION_12M)"
        actor: system
        preconditions: []
        side_effects: ["pre_sanction_status stored"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (clock sweep: suspension_ends <= now and expires_on >= now; or FINAL sanction NONE | WARNING lifting an interim suspension)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: LAPSED
        trigger: "system (clock sweep: suspension_ends <= now and expires_on < now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system (disciplinary FINAL sanction REVOCATION | PERMANENT_BAR; falsified-education or exam-security cascade; program-revocation cascade)"
        actor: system
        preconditions: []
        side_effects: ["pre_sanction_status stored", "revoked_by_case_id set when discipline-driven"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (same revocation triggers)"
        actor: system
        preconditions: []
        side_effects: ["pre_sanction_status stored", "revoked_by_case_id set when discipline-driven"]
      - from: LAPSED
        to: REVOKED
        trigger: "system (same revocation triggers)"
        actor: system
        preconditions: []
        side_effects: ["pre_sanction_status stored", "revoked_by_case_id set when discipline-driven"]
    note: "Recertification approval mutates expires_on (+24 months, anniversary-preserving) WITHOUT a status transition — the certification stays ACTIVE."

  - entity: RecertApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /registry/recert-applications/{id}/submit (audit_selected == false)"
        actor: Candidate
        preconditions:
          - "Application must be DRAFT (ERR_RECERT_NOT_DRAFT)"
          - "Caller owns the application (ERR_FORBIDDEN_ROLE)"
          - "cycle_window_start <= now <= cert_expires_on_at_creation (ERR_RECERT_WINDOW_NOT_OPEN)"
          - "Certification must be ACTIVE (ERR_CERTIFICATION_NOT_ACTIVE)"
          - "CE sufficiency per model (ERR_CE_COMPONENT_SHORTFALL / ERR_CE_TOTAL_SHORTFALL)"
        side_effects: ["recert_seq computed", "audit_selected computed", "submitted_at = now"]
      - from: DRAFT
        to: AUDIT_PENDING
        trigger: "POST /registry/recert-applications/{id}/submit (audit_selected == true)"
        actor: Candidate
        preconditions: ["same as DRAFT -> SUBMITTED"]
        side_effects: ["recert_seq computed", "audit_selected computed", "audit_reasons recorded", "submitted_at = now"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /registry/recert-applications/{id}/decision (outcome=APPROVED)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be SUBMITTED (ERR_RECERT_NOT_SUBMITTED)"
          - "Certification must be ACTIVE at decision time (ERR_CERTIFICATION_NOT_ACTIVE)"
        side_effects:
          - "certification_expiry_extension: certification.expires_on = add_months(cert_expires_on_at_creation, 24)"
          - "certification.renewed_count += 1; certification.version increments"
      - from: AUDIT_PENDING
        to: APPROVED
        trigger: "POST /registry/recert-applications/{id}/audit-outcome (all entries VERIFIED and sufficiency still holds)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be AUDIT_PENDING (ERR_RECERT_NOT_AUDIT_PENDING)"
          - "Certification must be ACTIVE at decision time (ERR_CERTIFICATION_NOT_ACTIVE)"
        side_effects:
          - "Each CECreditEntry transitions per its verdict (RECORDED -> VERIFIED | REJECTED)"
          - "ce_credit_waterfall recomputed over VERIFIED entries"
          - "On approval: certification.expires_on = add_months(cert_expires_on_at_creation, 24); renewed_count += 1"
      - from: AUDIT_PENDING
        to: AUDIT_FAILED
        trigger: "POST /registry/recert-applications/{id}/audit-outcome (any entry REJECTED leaving sufficiency unmet)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be AUDIT_PENDING (ERR_RECERT_NOT_AUDIT_PENDING)"
        side_effects:
          - "Each CECreditEntry transitions per its verdict"
          - "ce_credit_waterfall recomputed over VERIFIED entries; certification is NOT extended"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /registry/recert-applications/{id}/decision (outcome=DENIED)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be SUBMITTED (ERR_RECERT_NOT_SUBMITTED)"
        side_effects: []
      - from: DENIED
        to: DRAFT
        trigger: "POST /registry/recert-applications/{id}/reopen"
        actor: Candidate
        preconditions:
          - "Application must be DENIED or AUDIT_FAILED (ERR_RECERT_NOT_REOPENABLE)"
          - "Caller owns the application (ERR_FORBIDDEN_ROLE)"
        side_effects: ["credited-hour fields recomputed on next submit"]
        note: "Deny/reopen cycle — a reopened application re-runs CE validation and audit selection on resubmission."
      - from: AUDIT_FAILED
        to: DRAFT
        trigger: "POST /registry/recert-applications/{id}/reopen"
        actor: Candidate
        preconditions:
          - "Application must be DENIED or AUDIT_FAILED (ERR_RECERT_NOT_REOPENABLE)"
        side_effects: ["REJECTED entries stay REJECTED; only RECORDED/VERIFIED entries count on resubmission"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new RecertApplication is created for the same certification)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CECreditEntry
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /registry/recert-applications/{id}/audit-outcome (verdict VERIFIED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["parent waterfall recomputed"]
      - from: RECORDED
        to: REJECTED
        trigger: "POST /registry/recert-applications/{id}/audit-outcome (verdict REJECTED)"
        actor: RegistryAdmin
        preconditions: []
        side_effects: ["reject_reason set", "parent waterfall recomputed"]

  - entity: ReentryApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /registry/reentry-applications/{id}/decision (outcome=APPROVED)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be SUBMITTED (ERR_REENTRY_NOT_SUBMITTED)"
          - "Certification must still be LAPSED (ERR_CERTIFICATION_NOT_LAPSED)"
          - "TIER_CE_ONLY: ce_makeup_hours_claimed >= level.ce_total_hours; TIER_REFRESHER: refresher_hours_claimed >= level.refresher_hours_required (ERR_REENTRY_REQUIREMENTS_UNMET)"
        side_effects:
          - "Certification LAPSED -> ACTIVE; expires_on = add_months(now, 24); lapse_deadline recomputed"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /registry/reentry-applications/{id}/decision (outcome=DENIED)"
        actor: RegistryAdmin
        preconditions:
          - "Application must be SUBMITTED (ERR_REENTRY_NOT_SUBMITTED)"
        side_effects: []

  - entity: LicenseApplication
    initial_state: UNDER_REVIEW
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /registry/license-applications/{id}/decision (outcome=GRANTED)"
        actor: StateOfficial
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_LICENSE_NOT_ACTIONABLE)"
          - "NREMT path: cited certification must still be ACTIVE (ERR_CERTIFICATION_NOT_ACTIVE)"
        side_effects:
          - "licensure_fee_assessment computes assessed_fee_cents and registry_share_cents from the pinned policy snapshot"
          - "granted_on = now"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /registry/license-applications/{id}/decision (outcome=DENIED)"
        actor: StateOfficial
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_LICENSE_NOT_ACTIONABLE)"
        side_effects: ["decision_reason set"]
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUIRED
        trigger: "POST /registry/license-applications/{id}/decision (outcome=MORE_INFO_REQUIRED)"
        actor: StateOfficial
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_LICENSE_NOT_ACTIONABLE)"
        side_effects: ["more_info_note set"]
      - from: MORE_INFO_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /registry/license-applications/{id}/respond"
        actor: Candidate
        preconditions:
          - "Application must be MORE_INFO_REQUIRED (ERR_LICENSE_NOT_AWAITING_RESPONSE)"
          - "Caller owns the application (ERR_FORBIDDEN_ROLE)"
        side_effects: []
        note: "Request-info / response cycle; policy snapshot remains pinned at the original creation."

  - entity: StateExamRecord
    initial_state: VALID
    terminal_states: [VOIDED]
    transitions:
      - from: VALID
        to: VOIDED
        trigger: "system (disciplinary FINAL on the candidate with sanction REVOCATION | PERMANENT_BAR)"
        actor: system
        preconditions: []
        side_effects: ["voided_by_case_id set"]

  - entity: DisciplinaryCase
    initial_state: OPENED
    terminal_states: [FINAL]
    transitions:
      - from: OPENED
        to: NOTICE_ISSUED
        trigger: "POST /registry/disciplinary-cases/{id}/issue-notice"
        actor: RegistryAdmin
        preconditions:
          - "Case must be OPENED (ERR_CASE_STAGE_MISMATCH)"
        side_effects: ["response_deadline = now + 30 days"]
      - from: NOTICE_ISSUED
        to: UNDER_REVIEW
        trigger: "POST /registry/disciplinary-cases/{id}/response (subject responds) OR system (clock sweep past response_deadline)"
        actor: Candidate | system
        preconditions:
          - "Case must be NOTICE_ISSUED (ERR_CASE_STAGE_MISMATCH)"
          - "Response: caller must be the subject candidate (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: HEARING_SCHEDULED
        trigger: "POST /registry/disciplinary-cases/{id}/schedule-hearing"
        actor: HearingOfficer
        preconditions:
          - "Case must be UNDER_REVIEW (ERR_CASE_STAGE_MISMATCH)"
          - "Hearing officer X-User-ID must differ from opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["hearing_officer_user_id = X-User-ID"]
      - from: REHEARING
        to: HEARING_SCHEDULED
        trigger: "POST /registry/disciplinary-cases/{id}/schedule-hearing"
        actor: HearingOfficer
        preconditions:
          - "Case must be REHEARING (ERR_CASE_STAGE_MISMATCH)"
          - "Hearing officer X-User-ID must differ from opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["hearing_officer_user_id = X-User-ID"]
      - from: HEARING_SCHEDULED
        to: DECIDED
        trigger: "POST /registry/disciplinary-cases/{id}/decide"
        actor: HearingOfficer
        preconditions:
          - "Case must be HEARING_SCHEDULED (ERR_CASE_STAGE_MISMATCH)"
          - "expected_case_version must match current version (ERR_STALE_VERSION)"
        side_effects:
          - "sanction_type and findings set; decided_at = now; appeal_deadline = now + 30 days"
          - "version increments"
          - "NO sanction side effects yet — sanctions are deferred until FINAL"
      - from: DECIDED
        to: APPEAL_PENDING
        trigger: "POST /registry/disciplinary-cases/{id}/appeal"
        actor: Candidate
        preconditions:
          - "Case must be DECIDED (ERR_CASE_STAGE_MISMATCH)"
          - "Caller must be the subject candidate (ERR_FORBIDDEN_ROLE)"
          - "now <= appeal_deadline (inclusive). Because the clock sweep finalizes any DECIDED case whose appeal_deadline has passed, a late appeal always observes FINAL and fails the stage check above (ERR_CASE_STAGE_MISMATCH)."
        side_effects: []
      - from: DECIDED
        to: FINAL
        trigger: "system (clock sweep: appeal_deadline < now with no appeal filed)"
        actor: system
        preconditions: []
        side_effects:
          - "finalized_at = now; sanction cascades apply (sanction_cascade)"
      - from: APPEAL_PENDING
        to: FINAL
        trigger: "POST /registry/disciplinary-cases/{id}/appeal-decision (outcome=AFFIRMED)"
        actor: RegistryAdmin
        preconditions:
          - "Case must be APPEAL_PENDING (ERR_CASE_STAGE_MISMATCH)"
        side_effects:
          - "finalized_at = now; sanction cascades apply (sanction_cascade)"
      - from: APPEAL_PENDING
        to: REHEARING
        trigger: "POST /registry/disciplinary-cases/{id}/appeal-decision (outcome=OVERTURNED)"
        actor: RegistryAdmin
        preconditions:
          - "Case must be APPEAL_PENDING (ERR_CASE_STAGE_MISMATCH)"
        side_effects:
          - "sanction_type, findings, decided_at, appeal_deadline cleared; rehearing_count += 1"
        note: "DECIDED -> APPEAL_PENDING -> REHEARING -> HEARING_SCHEDULED -> DECIDED is the due-process rehearing cycle. No sanction has been applied at any point on this loop, so overturning requires no compensation."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: recert-create-stale-certification
    parent_entity: Certification
    write_endpoint: "POST /registry/recert-applications"
    occ_field: expected_certification_version
    description: |
      Creating a RecertApplication against a Certification whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a recertification draft (which
      legitimately supersedes the prior DRAFT) or renewed the certification,
      and the current writer's view of the certification is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-create-stale-certification
    parent_entity: Certification
    write_endpoint: "POST /registry/license-applications"
    occ_field: expected_certification_version
    description: |
      Creating a LicenseApplication on the NREMT path with an
      expected_certification_version older than the certification's current
      version is rejected: the certification may have been renewed, suspended,
      or revoked since the client read it, and licensure must be pinned to the
      certification state the client actually observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: case-decide-stale-case
    parent_entity: DisciplinaryCase
    write_endpoint: "POST /registry/disciplinary-cases/{id}/decide"
    occ_field: expected_case_version
    description: |
      Recording a hearing decision with an expected_case_version older than
      the case's current version is rejected: an intermediate mutation (e.g.
      an appeal or a rehearing reschedule) has advanced the case, so the
      decision would be recorded against a stage the officer did not observe.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: add_calendar_months
    trigger: "shared primitive for all validity windows and extensions"
    algorithm: temporal_primitive
    formula: |
      add_months(t, n): advance the calendar month by n preserving the
      day-of-month; if the target month lacks that day, clamp to the target
      month's last day. Time-of-day and UTC zone preserved.
    input_set: "all date/datetime window arithmetic in this scaffold"
    precision: "UTC calendar arithmetic"

  - name: cat_adaptive_scoring
    trigger: "POST /registry/cognitive-exam-attempts/{id}/responses"
    algorithm: weighted_scoring
    formula: |
      Responses are processed in submission order i = 1..n, n = len(responses),
      n <= MAX_ITEMS; extra responses beyond MAX_ITEMS are rejected at input
      validation (ERR_INVALID_REQUEST).
      theta_k = sum(b_i * correct_i) / sum(b_i) for i = 1..k   (difficulty-weighted accuracy)
      sem_k   = sqrt(theta_k * (1 - theta_k) / k); sem_k = 0 when theta_k in {0, 1}
      PROVISIONAL outcome (defined when n >= MIN_ITEMS):
        provisional_outcome = PASS if theta_MIN_ITEMS >= level.cognitive_cut_score else FAIL
      FINAL outcome — evaluate k = MIN_ITEMS .. n:
        LCB = theta_k - Z * sem_k; UCB = theta_k + Z * sem_k
        if LCB >= cut_score: final = PASS, stop; items_delivered_count = k
        elif UCB < cut_score: final = FAIL, stop; items_delivered_count = k
        else continue
      If no band exit fires and n >= MIN_ITEMS: final = PASS iff theta_n >= cut_score;
        items_delivered_count = n.
      If n < MIN_ITEMS: no provisional, no band evaluation; final = PASS iff
        theta_n >= cut_score; items_delivered_count = n.
      All comparisons use UNROUNDED doubles; theta_final is stored
      round_half_up to 4 decimal places.
    input_set: "responses on this attempt; level.cognitive_cut_score of the attempt's level"
    constants:
      MIN_ITEMS: 6
      MAX_ITEMS: 12
      Z: 1.645
    precision: "theta_final stored to 4 decimal places, round_half_up; pass/fail comparisons unrounded"
    variants:
      - name: provisional_outcome
        when: "reported once k reaches MIN_ITEMS"
        difference: "point estimate theta >= cut with NO confidence band; on identical response data it can diverge from final_outcome (borderline theta that later items drag below the cut, or vice versa)"
      - name: final_outcome
        when: "confidence-band stopping rule over k = MIN_ITEMS..n"
        difference: "band-qualified decision; the authoritative outcome recorded in status"

  - name: ce_credit_waterfall
    trigger: "RecertApplication submit (over RECORDED entries) and audit-outcome (over VERIFIED entries)"
    algorithm: waterfall_allocation
    formula: |
      Input set: CECreditEntry rows of the application in the eligibility set
      (RECORDED at submit time; VERIFIED after an audit) whose course_date lies
      inside [cycle_window_start, cert_expires_on_at_creation].
      Per component C in {NATIONAL, LOCAL, INDIVIDUAL} with level minimum M_C:
        dist_cap_C  = ceil(M_C * DISTRIBUTED_CAP_PCT)
        credited_C_dist = min(sum of DISTRIBUTED hours in C, dist_cap_C)
        claimed_C   = credited_C_dist + sum of IN_PERSON hours in C
      Spill (evaluation order pinned: NATIONAL first, then LOCAL, then INDIVIDUAL):
        spill_N = max(0, claimed_NATIONAL - level.ce_national_min_hours)
        spill_L = max(0, claimed_LOCAL - level.ce_local_min_hours)
        national_credited_hours    = min(claimed_NATIONAL, level.ce_national_min_hours)
        local_credited_hours       = min(claimed_LOCAL, level.ce_local_min_hours)
        individual_credited_hours  = min(claimed_INDIVIDUAL + spill_N + spill_L,
                                         level.ce_individual_min_hours)
        total_credited_hours = national + local + individual credited values
      NCCP sufficiency (checked in order, first failure wins):
        national_credited_hours >= level.ce_national_min_hours   else ERR_CE_COMPONENT_SHORTFALL
        local_credited_hours    >= level.ce_local_min_hours      else ERR_CE_COMPONENT_SHORTFALL
        individual_credited_hours >= level.ce_individual_min_hours else ERR_CE_COMPONENT_SHORTFALL
        total_credited_hours    >= level.ce_total_hours          else ERR_CE_TOTAL_SHORTFALL
    input_set: "entries of the application in the eligibility set; level CE constants"
    constants:
      DISTRIBUTED_CAP_PCT: 0.5
    precision: "hours in 0.5 increments; comparisons exact"
    variants:
      - name: hourly_model
        when: "RecertApplication.model == HOURLY"
        difference: "components and spill are ignored; credited_total = min(sum of ALL DISTRIBUTED hours, ceil(hourly_model_total_hours * DISTRIBUTED_CAP_PCT)) + sum of ALL IN_PERSON hours; require credited_total >= level.hourly_model_total_hours else ERR_CE_TOTAL_SHORTFALL. Identical entry sets can pass HOURLY while failing NCCP (component shortfall) or vice versa."

  - name: licensure_fee_assessment
    trigger: "POST /registry/license-applications/{id}/decision (outcome=GRANTED)"
    algorithm: aggregation
    formula: |
      fee_lines = [base_license_fee_cents] + [national_verification_surcharge_cents]
                  if path == NREMT, else [base_license_fee_cents] + [state_exam_fee_cents]
                  (all from the pinned fee_lines_snapshot taken at creation)
      assessed_fee_cents = sum(fee_lines)
      registry_share_cents = sum over each line of
                             round_half_up(line * registry_share_bps_snapshot / 10000)
      PINNED ROUNDING ORDER: round EACH LINE first, then sum the rounded shares.
      Summing first and rounding once yields different cents on half-cent lines
      and is NOT the contract.
    input_set: "policy fee snapshot pinned on the LicenseApplication"
    precision: "integer cents, round_half_up per line"

  - name: certification_expiry_extension
    trigger: "certification issue; recertification APPROVED; reentry APPROVED"
    algorithm: constraint_propagation
    formula: |
      ISSUE:    expires_on = add_months(issued_on, 24); lapse_deadline = add_months(expires_on, 48)
      RECERT:   evaluation order pinned to break the window<->expiry circularity:
                1. submittability window [add_months(expires_on, -12), expires_on] is
                   evaluated against cert_expires_on_at_creation captured BEFORE any extension
                2. new expires_on = add_months(cert_expires_on_at_creation, 24)
                   (anniversary-preserving: the approval date NEVER sets the new expiry,
                    so approving early in the window loses no certified time)
                3. lapse_deadline = add_months(new expires_on, 48); renewed_count += 1
      REENTRY:  expires_on = add_months(now, 24) (fresh cycle from the reinstatement
                instant, NOT anniversary-preserving); lapse_deadline recomputed likewise
    input_set: "certification row; logical clock"
    precision: "calendar-month arithmetic per add_calendar_months"

  - name: retake_eligibility
    trigger: "ExamApplication decision (budget + remedial gates); CognitiveExamAttempt scheduling (wait + ATT gates)"
    algorithm: threshold
    formula: |
      Basis = the application's ProgramCompletionRecord.
      attempts_consumed(basis) = count of CognitiveExamAttempts with
        basis_completion_record_id == basis.id and status in {SCORED_PASS, SCORED_FAIL}
        (NO_SHOW and VOIDED are excluded — voiding restores the budget).
      attempts_remaining(basis) = ATTEMPT_HARD_CAP - attempts_consumed(basis)
      At APPROVAL of a new ExamApplication on this basis:
        attempts_consumed < ATTEMPT_HARD_CAP else ERR_ATTEMPT_LIMIT_REACHED
        if attempts_consumed >= REMEDIAL_GATE(3): a RemedialEducationRecord for
          candidate+level with hours >= level.remedial_hours_required and
          completed_date strictly after the 3rd SCORED_FAIL's delivered date must
          exist, else ERR_REMEDIAL_REQUIRED
      At SCHEDULING of a new attempt:
        ATT status == ISSUED and now <= ATT.expires_on else ERR_ATT_NOT_ISSUABLE
        no prior attempt may reference the ATT (one attempt per ATT) else ERR_ATT_NOT_ISSUABLE
        if attempts_consumed >= 1: scheduled_start >= last SCORED_* delivered_at +
          RETAKE_WAIT_DAYS (equality allowed) else ERR_RETAKE_WAIT_ACTIVE
      A new VERIFIED ProgramCompletionRecord starts a fresh basis (consumed resets to 0).
    input_set: "attempts on the basis; remedial records of candidate+level; ATT row"
    constants:
      ATTEMPT_HARD_CAP: 6
      REMEDIAL_GATE: 3
      RETAKE_WAIT_DAYS: 15
    precision: "whole attempts; datetime comparisons at second precision"

  - name: audit_sampling_selector
    trigger: "RecertApplication submit"
    algorithm: selector_policy
    formula: |
      recert_seq = 1 + count of prior RecertApplications for this certification that
                   ever reached SUBMITTED (statuses SUBMITTED, AUDIT_PENDING, APPROVED,
                   DENIED, AUDIT_FAILED; DRAFT and SUPERSEDED excluded)
      audit_selected = true iff ANY predicate fires:
        (a) SEQ_MOD: recert_seq % AUDIT_SEQ_MOD == 0
        (b) PRIOR_AUDIT_FAILURE: the subject candidate has another RecertApplication in
            AUDIT_FAILED with decided_at within PRIOR_FAIL_LOOKBACK_MONTHS before now
        (c) SINGLE_PROVIDER_CONCENTRATION: max per-provider sum of entry hours on this
            application >= SINGLE_PROVIDER_FLAG_HOURS
      Eligibility filter: the submitting application itself; ranking/tie-break: not
      applicable (boolean selection); empty-pool fallback: audit_selected = false.
      Deterministic — no randomness anywhere in selection.
      audit_selected == true -> AUDIT_PENDING; false -> SUBMITTED.
    input_set: "this application's entries; candidate's recert history; certification's application sequence"
    constants:
      AUDIT_SEQ_MOD: 3
      SINGLE_PROVIDER_FLAG_HOURS: 20
      PRIOR_FAIL_LOOKBACK_MONTHS: 60
    precision: "exact"

  - name: reentry_tier_assignment
    trigger: "ReentryApplication creation"
    algorithm: threshold
    formula: |
      Requires certification.status == LAPSED (ERR_CERTIFICATION_NOT_LAPSED).
      lapse boundary comparisons use add_months semantics:
        now <= add_months(expires_on, 12)                     -> TIER_CE_ONLY
        add_months(expires_on, 12) < now <= add_months(expires_on, 24) -> TIER_REFRESHER
        now > add_months(expires_on, 24)                      -> creation rejected
          (ERR_REENTRY_NOT_AVAILABLE — full re-examination pathway required instead)
      TIER_CE_ONLY approval requires ce_makeup_hours_claimed >= level.ce_total_hours.
      TIER_REFRESHER approval requires refresher_hours_claimed >=
        level.refresher_hours_required. (ERR_REENTRY_REQUIREMENTS_UNMET otherwise.)
    input_set: "certification row; logical clock; level constants"
    constants:
      TIER1_MAX_LAPSE_MONTHS: 12
      TIER2_MAX_LAPSE_MONTHS: 24
    precision: "add_months boundary semantics; equality belongs to the LOWER tier"

  - name: education_validity_window
    trigger: "ProgramCompletionRecord verification; ExamApplication approval; certification issue"
    algorithm: temporal_windowing
    formula: |
      A completion record is educationally valid at instant t iff
        completion_date <= t <= add_months(completion_date, 24)   (BOTH ends inclusive)
      AND the program's accreditation status effective at completion_date
      (read from accreditation_history by effective_date) is in
      {ACCREDITED, PROVISIONAL}.
    input_set: "completion record; program accreditation_history; logical clock"
    precision: "day precision on completion_date; second precision on t"

  - name: attempt_slot_overlap
    trigger: "CognitiveExamAttempt scheduling"
    algorithm: interval_merge
    formula: |
      A candidate may hold at most one SCHEDULED attempt covering any instant.
      New window [s2, e2) conflicts with an existing SCHEDULED attempt's window
      [s1, e1) iff s1 < e2 AND s2 < e1 (half-open intersection; touching
      endpoints — e2 == s1 or s2 == e1 — do NOT conflict).
      Only SCHEDULED attempts participate; SCORED_*, NO_SHOW, VOIDED attempts
      leave no occupation. Requires scheduled_end > scheduled_start
      (ERR_INVALID_REQUEST otherwise). Conflict -> ERR_ATTEMPT_SLOT_OVERLAP.
    input_set: "candidate's SCHEDULED attempts"
    precision: "second precision"

  - name: psychomotor_duplicate_window
    trigger: "PsychomotorVerification creation"
    algorithm: interval_merge
    formula: |
      Each VERIFIED psychomotor record for (candidate, level) defines a validity
      window [date(verified_at), add_months(verified_at, 24)) — half-open.
      A new submission is rejected ERR_ACTIVE_VERIFICATION_EXISTS iff its
      exam_date falls INSIDE any such window (point-in-window containment).
      exam_date exactly == add_months(verified_at, 24) is OUTSIDE (allowed).
      SUBMITTED/REJECTED records define no window.
    input_set: "VERIFIED psychomotor records of candidate+level"
    precision: "day precision on exam_date"

  - name: disciplinary_due_process_schedule
    trigger: "issue-notice; decide; FINAL sanction application; clock sweep"
    algorithm: decay_function
    formula: |
      response_deadline = notice_issued_at + 30 days (inclusive: a response at
        exactly the deadline is accepted)
      appeal_deadline   = decided_at + 30 days (inclusive)
      suspension_ends   = finalized_at + 12 months (SUSPENSION_12M sanction)
      Clock sweep (POST /_clock/set_current_utc) advances, in pinned order:
        1. ATT ISSUED with expires_on < now -> EXPIRED
        2. Attempt SCHEDULED with scheduled_end < now -> NO_SHOW (ATT -> CONSUMED)
        3. Certification ACTIVE with expires_on < now -> LAPSED
        4. Certification LAPSED with lapse_deadline < now -> EXPIRED
        5. Certification SUSPENDED with suspension_ends <= now ->
             ACTIVE if expires_on >= now else LAPSED
        6. DisciplinaryCase NOTICE_ISSUED with response_deadline < now -> UNDER_REVIEW
        7. DisciplinaryCase DECIDED with appeal_deadline < now -> FINAL
           (sanction cascades apply — see sanction_cascade)
    input_set: "all time-boxed entities; logical clock"
    precision: "second precision; inclusive deadline semantics as noted"

  - name: sanction_cascade
    trigger: "DisciplinaryCase enters FINAL (sweep past appeal_deadline, or appeal AFFIRMED)"
    algorithm: constraint_propagation
    formula: |
      Applied in pinned order on entry to FINAL:
      1. sanction NONE | WARNING: certifications interim-suspended by this case
         are restored to ACTIVE (or LAPSED if expires_on < now).
      2. SUSPENSION_12M: subject's ACTIVE | SUSPENDED certifications -> SUSPENDED,
         suspension_ends = finalized_at + 12 months.
      3. REVOCATION | PERMANENT_BAR: subject's ACTIVE | SUSPENDED | LAPSED
         certifications -> REVOKED (pre_sanction_status stored); subject's ISSUED
         ATTs -> REVOKED; subject's SUBMITTED ExamApplications -> DENIED;
         UNDER_REVIEW | MORE_INFO_REQUIRED LicenseApplications that cite a
         certification revoked by this event -> DENIED (license denial is
         cert-mediated, never blanket); subject's VALID StateExamRecords ->
         VOIDED. PERMANENT_BAR additionally sets Candidate -> BARRED.
      4. violation FALSIFIED_EDUCATION with sanction >= SUSPENSION_12M: implicated
         completion records VERIFIED -> INVALIDATED; then per record: citing
         SUBMITTED ExamApplications -> DENIED; Certifications based on the record
         (ACTIVE | SUSPENDED | LAPSED) -> REVOKED; LicenseApplications
         UNDER_REVIEW | MORE_INFO_REQUIRED citing those certifications -> DENIED.
      5. violation EXAM_SECURITY with sanction >= SUSPENSION_12M: implicated
         attempts SCORED_PASS | SCORED_FAIL -> VOIDED; Certifications whose
         basis_attempt_id is voided (ACTIVE | SUSPENDED | LAPSED) -> REVOKED;
         LicenseApplications UNDER_REVIEW | MORE_INFO_REQUIRED citing those
         certifications -> DENIED.
      Hop discipline: each numbered step computes its target set AFTER the
      previous step lands; a certification revoked in step 4 propagates to
      license applications in the same FINAL event.
    input_set: "the FINAL case, subject's certifications, ATTs, applications, records"
    precision: "exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty on every endpoint except POST /registry/candidates"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints except POST /registry/candidates"

  - priority: 2
    category: auth
    check: "Caller role must be in the endpoint's declared roles; entity-backed ownership: Candidate calls act only on their own resources (X-User-ID == candidate id); ProgramDirector calls on program-scoped resources require X-User-ID == EducationProgram.director_user_id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request shape: required fields present, types match, enum values valid, stations non-empty, scheduled_end > scheduled_start, exam_date not in the future, hours > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 3.5
    category: existence
    check: "CE entry hours must be a positive multiple of 0.5"
    error_id: ERR_CE_HOURS_INCREMENT
    http_status: 400
    applies_to: "POST /registry/recert-applications/{id}/ce-entries"

  - priority: 4
    category: existence
    check: "Path ids must exist (validated left-to-right); body FK references must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_*_version fields must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /registry/recert-applications; POST /registry/license-applications; POST /registry/disciplinary-cases/{id}/decide"
    note: "Evaluated immediately after existence, BEFORE state preconditions."

  - priority: 6
    category: state
    check: "State-machine preconditions: source state must allow the transition (ERR_INVALID_STATE and the specific state errors ERR_COMPLETION_NOT_PENDING, ERR_APPLICATION_NOT_SUBMITTED, ERR_APPLICATION_NOT_DENIED, ERR_ATT_NOT_ISSUABLE, ERR_ATTEMPT_NOT_SCHEDULED, ERR_RECERT_NOT_DRAFT, ERR_RECERT_NOT_SUBMITTED, ERR_RECERT_NOT_AUDIT_PENDING, ERR_RECERT_NOT_REOPENABLE, ERR_CERTIFICATION_NOT_ACTIVE, ERR_CERTIFICATION_NOT_LAPSED, ERR_LICENSE_NOT_ACTIONABLE, ERR_LICENSE_NOT_AWAITING_RESPONSE, ERR_PSYCHOMOTOR_NOT_SUBMITTED, ERR_CASE_STAGE_MISMATCH, ERR_REENTRY_NOT_SUBMITTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates (evaluated in the order the error ids are listed): candidate not BARRED; no disciplinary hold on new applications; program accreditation at completion_date in {ACCREDITED, PROVISIONAL}; segregation of duties — psychomotor evaluator must differ from the completion record's attesting director, hearing officer must differ from case opener"
    error_id: "ERR_PERMANENTLY_BARRED | ERR_DISCIPLINARY_HOLD | ERR_PROGRAM_NOT_ACCREDITED_AT_COMPLETION | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "POST /registry/exam-applications; POST /registry/exam-applications/{id}/decision; POST /registry/license-applications; POST /registry/recert-applications; POST /registry/reentry-applications; POST /registry/program-completion-records; POST /registry/psychomotor-verifications; POST /registry/disciplinary-cases/{id}/schedule-hearing; POST /registry/certifications/issue"

  - priority: 8
    category: business_referential
    check: "Cross-record consistency: all referenced records must belong to the same candidate and level; HYBRID/NREMT level code must be in policy.accepted_level_codes; state exam record must match the target state and level"
    error_id: "ERR_CROSS_REFERENCE_MISMATCH | ERR_LEVEL_NOT_ACCEPTED_IN_STATE | ERR_STATE_EXAM_NOT_PASSING"
    http_status: 422
    applies_to: "POST /registry/psychomotor-verifications; POST /registry/exam-applications; POST /registry/certifications/issue; POST /registry/license-applications"

  - priority: 9
    category: business_temporal
    check: "Time-window gates: education validity window; ATT delivery window; retake wait; recert submission window; credential freshness at issue; CE entry cycle window; reentry lapse tier; clock monotonicity. Within this tier, checks evaluate in the order the error ids are listed."
    error_id: "ERR_EDUCATION_VALIDITY_EXPIRED | ERR_DELIVERY_WINDOW_NOT_OPEN | ERR_RETAKE_WAIT_ACTIVE | ERR_RECERT_WINDOW_NOT_OPEN | ERR_CREDENTIAL_STALE | ERR_CE_ENTRY_OUTSIDE_CYCLE | ERR_REENTRY_NOT_AVAILABLE | ERR_CLOCK_REGRESSION"
    http_status: 409
    applies_to: "window-gated endpoints"

  - priority: 10
    category: business_constraint
    check: "Uniqueness/occupation: one SCHEDULED attempt window per candidate; one ACTIVE certification per candidate+level; no overlapping VERIFIED psychomotor window; course_code unique per application; state_code unique per policy; level code unique; at most one in-flight (SUBMITTED | AUDIT_PENDING) recertification per certification"
    error_id: "ERR_ATTEMPT_SLOT_OVERLAP | ERR_DUPLICATE_ACTIVE_CERTIFICATION | ERR_ACTIVE_VERIFICATION_EXISTS | ERR_DUPLICATE_COURSE_IN_CYCLE | ERR_DUPLICATE_STATE_POLICY | ERR_DUPLICATE_LEVEL_CODE | ERR_RECERT_IN_PROGRESS_CONFLICT"
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 11
    category: business_fiscal
    check: "Quota and sufficiency gates: attempt budget and remedial gate at approval; CE component/total sufficiency at submit; jurisprudence attestation at license creation"
    error_id: "ERR_ATTEMPT_LIMIT_REACHED | ERR_REMEDIAL_REQUIRED | ERR_CE_COMPONENT_SHORTFALL | ERR_CE_TOTAL_SHORTFALL | ERR_JURISPRUDENCE_REQUIRED"
    http_status: 409
    applies_to: "POST /registry/exam-applications/{id}/decision; POST /registry/recert-applications/{id}/submit; POST /registry/license-applications"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (ops-run checkpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Setting the clock runs the deterministic sweep in the pinned order of disciplinary_due_process_schedule (ATT expiry, NO_SHOW, lapse, expiry, suspension lift, case stage advance, case finalization with sanction cascades). Monotonic: moving backwards is rejected."
    roles: [RegistryAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, att_expired_count: integer, attempts_no_show_count: integer, certifications_lapsed_count: integer, certifications_expired_count: integer, suspensions_lifted_count: integer, cases_advanced_count: integer, cases_finalized_count: integer }
    side_effects: ["clock sweep per disciplinary_due_process_schedule"]

  # --- LevelDefinition (config) ---
  - method: POST
    path: "/registry/level-definitions"
    description: "Define a certification level (EMR/EMT/AEMT/PARAMEDIC) with its scope, cut score, CE component minimums, and policy constants"
    roles: [RegistryAdmin]
    code: 201
    input: [code, display_name, scope_summary, cognitive_cut_score, ce_total_hours, ce_national_min_hours, ce_local_min_hours, ce_individual_min_hours, hourly_model_total_hours, remedial_hours_required, refresher_hours_required, initial_application_fee_cents, recert_application_fee_cents]
    output: LevelDefinition
    side_effects: ["duplicate code -> ERR_DUPLICATE_LEVEL_CODE"]

  - method: GET
    path: "/registry/level-definitions"
    description: "List level definitions"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: "LevelDefinition[]"
    side_effects: []

  # --- StateAdoptionPolicy (config) ---
  - method: POST
    path: "/registry/state-adoption-policies"
    description: "Register a state's adoption posture (NREMT_ACCEPTED | STATE_EXAM | HYBRID) with fee lines"
    roles: [RegistryAdmin]
    code: 201
    input: [state_code, adoption_mode, "accepted_level_codes?", "jurisprudence_exam_required?", base_license_fee_cents, "national_verification_surcharge_cents?", "state_exam_fee_cents?", "registry_share_bps?"]
    output: StateAdoptionPolicy
    side_effects: ["duplicate state_code -> ERR_DUPLICATE_STATE_POLICY"]

  - method: GET
    path: "/registry/state-adoption-policies"
    description: "List state adoption policies"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "StateAdoptionPolicy[]"
    side_effects: []

  # --- Candidates ---
  - method: POST
    path: "/registry/candidates"
    description: "Self-register a candidate (unauthenticated; the only header-exempt endpoint). Returns the Candidate whose id becomes the caller's X-User-ID."
    roles: [Anonymous]
    code: 201
    input: [full_name, email]
    output: Candidate
    side_effects: ["status = REGISTERED"]

  - method: GET
    path: "/registry/candidates/{id}"
    description: "Read a candidate (disciplinary_hold computed live)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  # --- Education programs ---
  - method: POST
    path: "/registry/education-programs"
    description: "Register an accredited education program for a level with its accountable director"
    roles: [RegistryAdmin]
    code: 201
    input: [name, level_id, director_user_id]
    output: EducationProgram
    side_effects: ["accreditation_status = ACCREDITED; accreditation_history seeded with the initial entry at effective_date = created_at"]

  - method: GET
    path: "/registry/education-programs"
    description: "List education programs"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["level_id?", "limit?", "offset?"]
    output: "EducationProgram[]"
    side_effects: []

  - method: GET
    path: "/registry/education-programs/{id}"
    description: "Read an education program including accreditation_history"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: EducationProgram
    side_effects: []

  - method: POST
    path: "/registry/education-programs/{id}/accreditation-events"
    description: "Record an accreditation transition with an effective_date. to_status=REVOKED fires the program-revocation cascade (see EducationProgram state machine)."
    roles: [RegistryAdmin]
    code: 200
    input: [to_status, effective_date, reason]
    output: EducationProgram
    side_effects: ["append accreditation_history", "REVOKED: cascade per state machine side_effects"]

  # --- Program completion records ---
  - method: POST
    path: "/registry/program-completion-records"
    description: "ProgramDirector attests a candidate's completion of their program. Program must be ACCREDITED or PROVISIONAL at completion_date."
    roles: [ProgramDirector]
    code: 201
    input: [candidate_id, program_id, completion_date]
    output: ProgramCompletionRecord
    side_effects: ["status = PENDING_VERIFICATION", "created_by_user_id = X-User-ID", "X-User-ID must equal program.director_user_id (ERR_FORBIDDEN_ROLE)", "accreditation at completion_date checked (ERR_PROGRAM_NOT_ACCREDITED_AT_COMPLETION)"]

  - method: GET
    path: "/registry/program-completion-records"
    description: "List completion records (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "program_id?", "status?", "invalidated_by_case_id?", "limit?", "offset?"]
    output: "ProgramCompletionRecord[]"
    side_effects: []

  - method: GET
    path: "/registry/program-completion-records/{id}"
    description: "Read a completion record (attempts_consumed/attempts_remaining computed live)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: ProgramCompletionRecord
    side_effects: []

  - method: POST
    path: "/registry/program-completion-records/{id}/decision"
    description: "Registry verification decision on a completion record"
    roles: [RegistryAdmin]
    code: 200
    input: [outcome, "reason?"]
    output: ProgramCompletionRecord
    side_effects: ["VERIFIED: verified_at = now"]

  # --- Exam applications ---
  - method: POST
    path: "/registry/exam-applications"
    description: "Candidate applies for the cognitive examination at a level on the basis of a completion record"
    roles: [Candidate]
    code: 201
    input: [level_id, completion_record_id]
    output: ExamApplication
    side_effects: ["status = SUBMITTED", "application_fee_cents snapshot from level", "disciplinary hold / bar checked"]

  - method: GET
    path: "/registry/exam-applications"
    description: "List exam applications (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "level_id?", "completion_record_id?", "status?", "limit?", "offset?"]
    output: "ExamApplication[]"
    side_effects: []

  - method: GET
    path: "/registry/exam-applications/{id}"
    description: "Read an exam application"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: ExamApplication
    side_effects: []

  - method: POST
    path: "/registry/exam-applications/{id}/decision"
    description: "Approve (mints the ATT) or deny an exam application. Approval enforces education validity, accreditation-at-completion, attempt budget and the remedial gate."
    roles: [RegistryAdmin]
    code: 200
    input: [outcome, "reason?"]
    output: ExamApplication
    side_effects: ["APPROVED: mint AuthorizationToTest (ISSUED, expires_on = now + 90 days), set att_id"]

  - method: POST
    path: "/registry/exam-applications/{id}/resubmit"
    description: "Resubmit a DENIED application (deny-resubmit cycle); full approval validation re-runs on the next decision"
    roles: [Candidate]
    code: 200
    input: ["completion_record_id?"]
    output: ExamApplication
    side_effects: ["DENIED -> SUBMITTED; resubmission_count += 1; optional completion_record_id swap"]

  # --- AuthorizationToTest ---
  - method: GET
    path: "/registry/authorizations-to-test"
    description: "List ATTs (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "exam_application_id?", "status?", "limit?", "offset?"]
    output: "AuthorizationToTest[]"
    side_effects: []

  - method: GET
    path: "/registry/authorizations-to-test/{id}"
    description: "Read a single ATT"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: AuthorizationToTest
    side_effects: []

  # --- Cognitive exam attempts ---
  - method: POST
    path: "/registry/cognitive-exam-attempts"
    description: "Schedule a cognitive (CAT) attempt against an ISSUED ATT. Enforces one-attempt-per-ATT, ATT window, retake wait, and the candidate's half-open slot occupation."
    roles: [Candidate]
    code: 201
    input: [att_id, scheduled_start, scheduled_end]
    output: CognitiveExamAttempt
    side_effects: ["status = SCHEDULED", "attempt_number computed"]

  - method: GET
    path: "/registry/cognitive-exam-attempts"
    description: "List attempts (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "att_id?", "level_id?", "basis_completion_record_id?", "status?", "voided_by_case_id?", "limit?", "offset?"]
    output: "CognitiveExamAttempt[]"
    side_effects: []

  - method: GET
    path: "/registry/cognitive-exam-attempts/{id}"
    description: "Read an attempt (provisional/final outcomes, theta_final)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: CognitiveExamAttempt
    side_effects: []

  - method: POST
    path: "/registry/cognitive-exam-attempts/{id}/responses"
    description: "Deliver CAT item responses; runs cat_adaptive_scoring and scores the attempt"
    roles: [ExamProctor]
    code: 200
    input: [responses]
    output: CognitiveExamAttempt
    side_effects: ["status -> SCORED_PASS | SCORED_FAIL", "delivered_at = now", "ATT -> CONSUMED"]

  # --- Remedial education ---
  - method: POST
    path: "/registry/remedial-education-records"
    description: "ProgramDirector attests completed remedial education (gates cognitive attempts 4-6)"
    roles: [ProgramDirector]
    code: 201
    input: [candidate_id, level_id, hours, completed_date, provider_name]
    output: RemedialEducationRecord
    side_effects: ["attested_by_user_id = X-User-ID"]

  - method: GET
    path: "/registry/remedial-education-records"
    description: "List remedial records (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "level_id?", "limit?", "offset?"]
    output: "RemedialEducationRecord[]"
    side_effects: []

  - method: GET
    path: "/registry/remedial-education-records/{id}"
    description: "Read a remedial education record"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: RemedialEducationRecord
    side_effects: []

  # --- Psychomotor verification ---
  - method: POST
    path: "/registry/psychomotor-verifications"
    description: "Submit psychomotor skill verification documentation (polymorphic: ProgramDirector for PROGRAM-administered, StateOfficial for STATE-administered). Segregation: a PROGRAM evaluator must not be the director who attested the candidate's completion record."
    roles: [ProgramDirector, StateOfficial]
    code: 201
    input: [candidate_id, level_id, administered_by, "program_id?", completion_record_id, exam_date, stations, documentation_attached]
    output: PsychomotorVerification
    side_effects: ["status = SUBMITTED", "evaluator_user_id = X-User-ID", "duplicate-window containment check (ERR_ACTIVE_VERIFICATION_EXISTS)"]

  - method: GET
    path: "/registry/psychomotor-verifications"
    description: "List psychomotor verifications (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "level_id?", "program_id?", "completion_record_id?", "status?", "limit?", "offset?"]
    output: "PsychomotorVerification[]"
    side_effects: []

  - method: GET
    path: "/registry/psychomotor-verifications/{id}"
    description: "Read a psychomotor verification"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: PsychomotorVerification
    side_effects: []

  - method: POST
    path: "/registry/psychomotor-verifications/{id}/decision"
    description: "Verify or reject submitted psychomotor documentation"
    roles: [RegistryAdmin]
    code: 200
    input: [outcome, "reason?"]
    output: PsychomotorVerification
    side_effects: ["VERIFIED: verified_at = now (validity window opens)"]

  # --- Certification issuance ---
  - method: POST
    path: "/registry/certifications/issue"
    description: "Issue a national certification from explicitly referenced basis records (approved application, SCORED_PASS attempt within 24 months, VERIFIED psychomotor within 24 months, education within validity)"
    roles: [RegistryAdmin]
    code: 201
    input: [candidate_id, level_id, exam_application_id, attempt_id, psychomotor_id]
    output: Certification
    side_effects: ["status = ACTIVE", "issued_on = now", "expires_on = add_months(now, 24)", "lapse_deadline computed", "no duplicate ACTIVE cert per candidate+level (ERR_DUPLICATE_ACTIVE_CERTIFICATION)"]

  - method: GET
    path: "/registry/certifications"
    description: "List certifications (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "level_id?", "status?", "basis_completion_record_id?", "basis_attempt_id?", "basis_psychomotor_id?", "revoked_by_case_id?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []

  - method: GET
    path: "/registry/certifications/{id}"
    description: "Read a certification"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: Certification
    side_effects: []

  # --- Recertification ---
  - method: POST
    path: "/registry/recert-applications"
    description: "Open a recertification draft against an ACTIVE certification (OCC-guarded; supersedes an existing DRAFT for the same certification)"
    roles: [Candidate]
    code: 201
    input: [certification_id, model, expected_certification_version]
    output: RecertApplication
    side_effects: ["status = DRAFT", "cycle_window_start + cert_expires_on_at_creation pinned", "existing DRAFT for the same certification -> SUPERSEDED", "another SUBMITTED | AUDIT_PENDING application for the same certification -> ERR_RECERT_IN_PROGRESS_CONFLICT", "increments Certification.version by 1"]

  - method: GET
    path: "/registry/recert-applications"
    description: "List recertification applications (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "certification_id?", "status?", "limit?", "offset?"]
    output: "RecertApplication[]"
    side_effects: []

  - method: GET
    path: "/registry/recert-applications/{id}"
    description: "Read a recertification application (credited hours computed live)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: RecertApplication
    side_effects: []

  - method: POST
    path: "/registry/recert-applications/{id}/ce-entries"
    description: "Add a CE credit entry to a DRAFT application (owner only)"
    roles: [Candidate]
    code: 201
    input: [component, hours, delivery_method, course_code, course_date, provider_name]
    output: CECreditEntry
    side_effects: ["status = RECORDED", "parent credited-hour fields recomputed", "course_code uniqueness per application (ERR_DUPLICATE_COURSE_IN_CYCLE)", "course_date inside cycle window (ERR_CE_ENTRY_OUTSIDE_CYCLE)"]

  - method: GET
    path: "/registry/recert-applications/{id}/ce-entries"
    description: "List CE entries of an application"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CECreditEntry[]"
    side_effects: []

  - method: POST
    path: "/registry/recert-applications/{id}/submit"
    description: "Submit the CE portfolio: validates the window, computes the waterfall, runs deterministic audit selection"
    roles: [Candidate]
    code: 200
    input: []
    output: RecertApplication
    side_effects: ["DRAFT -> SUBMITTED | AUDIT_PENDING", "recert_seq and audit_selected computed"]

  - method: POST
    path: "/registry/recert-applications/{id}/decision"
    description: "Approve (extends certification anniversary-style) or deny a non-audited submission"
    roles: [RegistryAdmin]
    code: 200
    input: [outcome, "reason?"]
    output: RecertApplication
    side_effects: ["APPROVED: certification.expires_on = add_months(cert_expires_on_at_creation, 24); renewed_count += 1"]

  - method: POST
    path: "/registry/recert-applications/{id}/audit-outcome"
    description: "Record per-entry audit verdicts; approves if sufficiency still holds, else AUDIT_FAILED"
    roles: [RegistryAdmin]
    code: 200
    input: [entry_verdicts]
    output: RecertApplication
    side_effects: ["entries RECORDED -> VERIFIED | REJECTED", "waterfall recomputed over VERIFIED entries", "AUDIT_PENDING -> APPROVED | AUDIT_FAILED"]

  - method: POST
    path: "/registry/recert-applications/{id}/reopen"
    description: "Reopen a DENIED or AUDIT_FAILED application back to DRAFT (owner only)"
    roles: [Candidate]
    code: 200
    input: []
    output: RecertApplication
    side_effects: ["status -> DRAFT"]

  # --- Reentry ---
  - method: POST
    path: "/registry/reentry-applications"
    description: "Apply for lapsed-certification reentry; tier assigned by lapse duration (reentry_tier_assignment)"
    roles: [Candidate]
    code: 201
    input: [certification_id, "ce_makeup_hours_claimed?", "refresher_hours_claimed?"]
    output: ReentryApplication
    side_effects: ["status = SUBMITTED", "tier computed", "lapse > 24 months -> ERR_REENTRY_NOT_AVAILABLE"]

  - method: GET
    path: "/registry/reentry-applications"
    description: "List reentry applications (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "certification_id?", "status?", "limit?", "offset?"]
    output: "ReentryApplication[]"
    side_effects: []

  - method: GET
    path: "/registry/reentry-applications/{id}"
    description: "Read a reentry application"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: ReentryApplication
    side_effects: []

  - method: POST
    path: "/registry/reentry-applications/{id}/decision"
    description: "Approve (reinstates certification with a fresh 24-month cycle) or deny"
    roles: [RegistryAdmin]
    code: 200
    input: [outcome, "reason?"]
    output: ReentryApplication
    side_effects: ["APPROVED: Certification LAPSED -> ACTIVE; expires_on = add_months(now, 24)"]

  # --- State licensure ---
  - method: POST
    path: "/registry/license-applications"
    description: "Apply for state licensure. Path resolution: NREMT_ACCEPTED requires certification_id (OCC-pinned); STATE_EXAM requires state_exam_record_id; HYBRID validates the NREMT path first when certification_id is present. Policy snapshot pinned at creation."
    roles: [Candidate]
    code: 201
    input: [state_code, level_id, "certification_id?", "state_exam_record_id?", "jurisprudence_completed?", "expected_certification_version?"]
    output: LicenseApplication
    side_effects: ["status = UNDER_REVIEW", "policy snapshot pinned", "path resolved", "increments Certification.version by 1 when the NREMT path is used"]

  - method: GET
    path: "/registry/license-applications"
    description: "List license applications (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "state_code?", "level_id?", "certification_id?", "state_exam_record_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: "LicenseApplication[]"
    side_effects: []

  - method: GET
    path: "/registry/license-applications/{id}"
    description: "Read a license application"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []

  - method: POST
    path: "/registry/license-applications/{id}/decision"
    description: "StateOfficial grants (fees assessed), denies, or requests more information"
    roles: [StateOfficial]
    code: 200
    input: [outcome, "reason?"]
    output: LicenseApplication
    side_effects: ["GRANTED: licensure_fee_assessment computes assessed_fee_cents + registry_share_cents; granted_on = now"]

  - method: POST
    path: "/registry/license-applications/{id}/respond"
    description: "Candidate responds to MORE_INFO_REQUIRED (cycle back to UNDER_REVIEW)"
    roles: [Candidate]
    code: 200
    input: [response_note]
    output: LicenseApplication
    side_effects: ["MORE_INFO_REQUIRED -> UNDER_REVIEW"]

  # --- State exam records ---
  - method: POST
    path: "/registry/state-exam-records"
    description: "StateOfficial registers a state's own examination result (for STATE_EXAM / HYBRID adoption states)"
    roles: [StateOfficial]
    code: 201
    input: [candidate_id, state_code, level_id, exam_date, score, passing_score]
    output: StateExamRecord
    side_effects: ["status = VALID", "passed computed (score >= passing_score)"]

  - method: GET
    path: "/registry/state-exam-records"
    description: "List state exam records (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["candidate_id?", "state_code?", "level_id?", "status?", "voided_by_case_id?", "limit?", "offset?"]
    output: "StateExamRecord[]"
    side_effects: []

  - method: GET
    path: "/registry/state-exam-records/{id}"
    description: "Read a state exam record"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: StateExamRecord
    side_effects: []

  # --- Disciplinary cases (due process) ---
  - method: POST
    path: "/registry/disciplinary-cases"
    description: "Open a disciplinary case (exam security, falsified education, criminal conduct). interim_action applies immediately: SUSPEND_CERTIFICATION suspends the subject's ACTIVE certifications; HOLD_NEW_APPLICATIONS blocks the subject's new applications while the case is non-FINAL."
    roles: [RegistryAdmin, StateOfficial]
    code: 201
    input: [subject_candidate_id, violation_type, description, "interim_action?", "implicated_attempt_ids?", "implicated_completion_record_ids?"]
    output: DisciplinaryCase
    side_effects: ["status = OPENED", "opened_by_user_id = X-User-ID", "interim side effects applied"]

  - method: GET
    path: "/registry/disciplinary-cases"
    description: "List disciplinary cases (filtered)"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: ["subject_candidate_id?", "status?", "implicated_attempt_ids?", "implicated_completion_record_ids?", "limit?", "offset?"]
    output: "DisciplinaryCase[]"
    side_effects: []

  - method: GET
    path: "/registry/disciplinary-cases/{id}"
    description: "Read a disciplinary case"
    roles: [RegistryAdmin, Candidate, ProgramDirector, StateOfficial, HearingOfficer, ExamProctor]
    code: 200
    input: []
    output: DisciplinaryCase
    side_effects: []

  - method: POST
    path: "/registry/disciplinary-cases/{id}/issue-notice"
    description: "Issue the notice of allegations; opens the 30-day response window"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: DisciplinaryCase
    side_effects: ["OPENED -> NOTICE_ISSUED", "response_deadline = now + 30 days"]

  - method: POST
    path: "/registry/disciplinary-cases/{id}/response"
    description: "Subject candidate records a response (closes the response window early)"
    roles: [Candidate]
    code: 200
    input: [response_text]
    output: DisciplinaryCase
    side_effects: ["NOTICE_ISSUED -> UNDER_REVIEW"]

  - method: POST
    path: "/registry/disciplinary-cases/{id}/schedule-hearing"
    description: "HearingOfficer schedules the hearing; the officer must differ from the case opener (segregation of duties)"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: DisciplinaryCase
    side_effects: ["UNDER_REVIEW | REHEARING -> HEARING_SCHEDULED", "hearing_officer_user_id = X-User-ID"]

  - method: POST
    path: "/registry/disciplinary-cases/{id}/decide"
    description: "Record the hearing decision (OCC-guarded). Opens the 30-day appeal window; sanctions stay deferred until FINAL."
    roles: [HearingOfficer]
    code: 200
    input: [sanction_type, findings, expected_case_version]
    output: DisciplinaryCase
    side_effects: ["HEARING_SCHEDULED -> DECIDED", "decided_at = now", "appeal_deadline = now + 30 days", "increments DisciplinaryCase.version by 1"]

  - method: POST
    path: "/registry/disciplinary-cases/{id}/appeal"
    description: "Subject candidate appeals within the appeal window"
    roles: [Candidate]
    code: 200
    input: [appeal_grounds]
    output: DisciplinaryCase
    side_effects: ["DECIDED -> APPEAL_PENDING"]

  - method: POST
    path: "/registry/disciplinary-cases/{id}/appeal-decision"
    description: "AFFIRMED finalizes (sanction cascades apply); OVERTURNED sends the case to REHEARING (cyclic)"
    roles: [RegistryAdmin]
    code: 200
    input: [outcome, rationale]
    output: DisciplinaryCase
    side_effects: ["APPEAL_PENDING -> FINAL (cascades) | REHEARING (decision fields cleared, rehearing_count += 1)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty on an authenticated endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint, or entity-backed ownership check failed (candidate not the owner; ProgramDirector not the program's director; case response/appeal by non-subject)" }
  # --- request shape / existence / OCC ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, empty stations, scheduled_end <= scheduled_start, future exam_date, non-positive hours, responses over MAX_ITEMS, NREMT path without certification_id, STATE_EXAM path without state_exam_record_id, PROGRAM psychomotor without program_id (or STATE with one)" }
  - { id: ERR_CE_HOURS_INCREMENT, http: 400, condition: "CE hours not a positive multiple of 0.5" }
  - { id: ERR_CE_ENTRY_OUTSIDE_CYCLE, http: 422, condition: "CE entry course_date outside [cycle_window_start, cert_expires_on_at_creation]" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body id does not exist (validated left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid-from transition" }
  - { id: ERR_COMPLETION_NOT_PENDING, http: 409, condition: "Completion record not PENDING_VERIFICATION for a verification decision" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "Exam application not SUBMITTED for a decision" }
  - { id: ERR_APPLICATION_NOT_DENIED, http: 409, condition: "Exam application not DENIED for resubmission" }
  - { id: ERR_ATT_NOT_ISSUABLE, http: 409, condition: "ATT not ISSUED, past expires_on, or already referenced by an attempt" }
  - { id: ERR_ATTEMPT_NOT_SCHEDULED, http: 409, condition: "Attempt not SCHEDULED for response delivery" }
  - { id: ERR_DELIVERY_WINDOW_NOT_OPEN, http: 409, condition: "now outside [scheduled_start, scheduled_end] at response delivery" }
  - { id: ERR_RECERT_NOT_DRAFT, http: 409, condition: "Recert application not DRAFT for ce-entry add or submit" }
  - { id: ERR_RECERT_NOT_SUBMITTED, http: 409, condition: "Recert application not SUBMITTED for a decision" }
  - { id: ERR_RECERT_NOT_AUDIT_PENDING, http: 409, condition: "Recert application not AUDIT_PENDING for an audit outcome" }
  - { id: ERR_RECERT_NOT_REOPENABLE, http: 409, condition: "Recert application not DENIED/AUDIT_FAILED for reopen" }
  - { id: ERR_CERTIFICATION_NOT_ACTIVE, http: 409, condition: "Certification not ACTIVE where required (issue dup check, recert create/submit/approve, license NREMT path create/grant)" }
  - { id: ERR_CERTIFICATION_NOT_LAPSED, http: 409, condition: "Certification not LAPSED for reentry create/approve" }
  - { id: ERR_LICENSE_NOT_ACTIONABLE, http: 409, condition: "License application not UNDER_REVIEW for a decision" }
  - { id: ERR_LICENSE_NOT_AWAITING_RESPONSE, http: 409, condition: "License application not MORE_INFO_REQUIRED for a response" }
  - { id: ERR_PSYCHOMOTOR_NOT_SUBMITTED, http: 409, condition: "Psychomotor record not SUBMITTED for a decision" }
  - { id: ERR_PSYCHOMOTOR_REQUIREMENTS_UNMET, http: 422, condition: "Verification requires all stations passed and documentation_attached == true" }
  - { id: ERR_CASE_STAGE_MISMATCH, http: 409, condition: "Disciplinary case not in the stage this due-process action requires" }
  - { id: ERR_REENTRY_NOT_SUBMITTED, http: 409, condition: "Reentry application not SUBMITTED for a decision" }
  # --- business safety ---
  - { id: ERR_DISCIPLINARY_HOLD, http: 403, condition: "Candidate under a non-FINAL HOLD_NEW_APPLICATIONS interim action may not open new exam/recert/reentry/license applications" }
  - { id: ERR_PERMANENTLY_BARRED, http: 403, condition: "Candidate is BARRED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted both sides of a segregated duty (completion attester vs PROGRAM psychomotor evaluator; case opener vs hearing officer)" }
  - { id: ERR_PROGRAM_NOT_ACCREDITED_AT_COMPLETION, http: 422, condition: "Program accreditation at completion_date not in {ACCREDITED, PROVISIONAL}" }
  # --- referential ---
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "Referenced records disagree on candidate or level (completion vs application, psychomotor vs completion, basis records at issue, state exam record vs license target)" }
  - { id: ERR_LEVEL_NOT_ACCEPTED_IN_STATE, http: 422, condition: "Certification level code not in the state policy's accepted_level_codes on the NREMT path" }
  - { id: ERR_STATE_EXAM_NOT_PASSING, http: 422, condition: "State exam record not usable: passed == false, status VOIDED, or exam stale" }
  # --- temporal ---
  - { id: ERR_EDUCATION_VALIDITY_EXPIRED, http: 409, condition: "Completion record outside its 24-month validity window at approval/issue time" }
  - { id: ERR_RETAKE_WAIT_ACTIVE, http: 409, condition: "scheduled_start earlier than last SCORED_* delivered_at + 15 days" }
  - { id: ERR_RECERT_WINDOW_NOT_OPEN, http: 409, condition: "now outside [cycle_window_start, cert_expires_on_at_creation] at submit" }
  - { id: ERR_CREDENTIAL_STALE, http: 409, condition: "Cognitive pass or psychomotor exam older than 24 months at certification issue, or state exam older than 24 months at license creation" }
  - { id: ERR_REENTRY_NOT_AVAILABLE, http: 409, condition: "Lapse exceeds 24 months; reentry pathway closed (full re-examination required)" }
  - { id: ERR_CLOCK_REGRESSION, http: 409, condition: "set_current_utc with to_iso8601 earlier than the current logical time" }
  # --- constraint ---
  - { id: ERR_ATTEMPT_SLOT_OVERLAP, http: 409, condition: "New attempt window intersects the candidate's existing SCHEDULED attempt window (half-open intersection)" }
  - { id: ERR_DUPLICATE_ACTIVE_CERTIFICATION, http: 409, condition: "An ACTIVE certification already exists for candidate+level" }
  - { id: ERR_ACTIVE_VERIFICATION_EXISTS, http: 409, condition: "exam_date falls inside an existing VERIFIED psychomotor validity window for candidate+level" }
  - { id: ERR_DUPLICATE_COURSE_IN_CYCLE, http: 409, condition: "course_code already present on this recert application" }
  - { id: ERR_DUPLICATE_STATE_POLICY, http: 409, condition: "StateAdoptionPolicy for state_code already exists" }
  - { id: ERR_DUPLICATE_LEVEL_CODE, http: 409, condition: "LevelDefinition for code already exists" }
  - { id: ERR_RECERT_IN_PROGRESS_CONFLICT, http: 409, condition: "Another RecertApplication for the same certification is SUBMITTED or AUDIT_PENDING" }
  # --- quota / fiscal ---
  - { id: ERR_ATTEMPT_LIMIT_REACHED, http: 409, condition: "attempts_consumed(basis) == 6 at approval" }
  - { id: ERR_REMEDIAL_REQUIRED, http: 422, condition: "attempts_consumed(basis) >= 3 without a qualifying remedial record" }
  - { id: ERR_CE_COMPONENT_SHORTFALL, http: 422, condition: "NCCP component minimum unmet (checked NATIONAL, LOCAL, INDIVIDUAL in order)" }
  - { id: ERR_CE_TOTAL_SHORTFALL, http: 422, condition: "Total credited hours below the required total" }
  - { id: ERR_JURISPRUDENCE_REQUIRED, http: 422, condition: "Policy requires jurisprudence exam and jurisprudence_completed != true" }
  - { id: ERR_REENTRY_REQUIREMENTS_UNMET, http: 422, condition: "Tier hours claimed below the level minimum at reentry approval" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register as a candidate"
    identity: opaque
    exclusive_operations:
      - "POST /registry/candidates — self-register"

  - name: Candidate
    description: "Certification candidate acting on their own records; X-User-ID equals the Candidate id minted at registration"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /registry/exam-applications — apply for cognitive exam"
      - "POST /registry/exam-applications/{id}/resubmit — resubmit own denied application"
      - "POST /registry/cognitive-exam-attempts — schedule own attempt"
      - "POST /registry/recert-applications — open own recertification draft"
      - "POST /registry/recert-applications/{id}/ce-entries — add CE entries to own draft"
      - "POST /registry/recert-applications/{id}/submit — submit own portfolio"
      - "POST /registry/recert-applications/{id}/reopen — reopen own denied/failed application"
      - "POST /registry/reentry-applications — apply for own reentry"
      - "POST /registry/license-applications — apply for licensure"
      - "POST /registry/license-applications/{id}/respond — respond to info requests on own application"
      - "POST /registry/disciplinary-cases/{id}/response — respond as case subject"
      - "POST /registry/disciplinary-cases/{id}/appeal — appeal as case subject"
    shared_operations:
      - "GET read endpoints (all authenticated roles)"

  - name: ProgramDirector
    description: "Education program director; X-User-ID is an opaque operator id that must equal EducationProgram.director_user_id for program-scoped attestations"
    identity: opaque
    exclusive_operations:
      - "POST /registry/program-completion-records — attest completion for own program"
      - "POST /registry/remedial-education-records — attest remedial education"
    shared_operations:
      - "POST /registry/psychomotor-verifications — shared with StateOfficial (PROGRAM-administered only)"
      - "GET read endpoints"

  - name: StateOfficial
    description: "State EMS office official; administers state-side verification, state examinations, licensure decisions, and may open disciplinary cases"
    identity: opaque
    exclusive_operations:
      - "POST /registry/state-exam-records — register state exam results"
      - "POST /registry/license-applications/{id}/decision — licensure decisions"
    shared_operations:
      - "POST /registry/psychomotor-verifications — shared with ProgramDirector (STATE-administered only)"
      - "POST /registry/disciplinary-cases — shared with RegistryAdmin"
      - "GET read endpoints"

  - name: RegistryAdmin
    description: "National registry operator: configuration, verification decisions, certification issuance, recert/reentry decisions, due-process administration, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — advance the logical clock (sweep)"
      - "POST /registry/level-definitions; POST /registry/state-adoption-policies — configuration"
      - "POST /registry/education-programs; POST /registry/education-programs/{id}/accreditation-events"
      - "POST /registry/program-completion-records/{id}/decision"
      - "POST /registry/exam-applications/{id}/decision"
      - "POST /registry/psychomotor-verifications/{id}/decision"
      - "POST /registry/certifications/issue"
      - "POST /registry/recert-applications/{id}/decision; POST /registry/recert-applications/{id}/audit-outcome"
      - "POST /registry/reentry-applications/{id}/decision"
      - "POST /registry/disciplinary-cases/{id}/issue-notice"
      - "POST /registry/disciplinary-cases/{id}/appeal-decision"
    shared_operations:
      - "POST /registry/disciplinary-cases — shared with StateOfficial"
      - "GET read endpoints"

  - name: ExamProctor
    description: "Test-center delivery harness; submits CAT item responses"
    identity: opaque
    exclusive_operations:
      - "POST /registry/cognitive-exam-attempts/{id}/responses — deliver exam responses"
    shared_operations:
      - "GET read endpoints"

  - name: HearingOfficer
    description: "Independent hearing officer for disciplinary due process; must differ from the case opener (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /registry/disciplinary-cases/{id}/schedule-hearing"
      - "POST /registry/disciplinary-cases/{id}/decide"
    shared_operations:
      - "GET read endpoints"
