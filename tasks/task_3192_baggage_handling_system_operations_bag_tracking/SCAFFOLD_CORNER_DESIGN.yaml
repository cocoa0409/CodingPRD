      - name: baggage_service_agent_cannot_cancel_a_flight
        claim_type: Correct Result
        grounds:
          - roles.BaggageServiceAgent.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - endpoints.POST_/baggage/flights/{id}/cancel
        distinguishing_aspect: "A role that owns the report surface cannot perform a reference-data action owned by PlatformAdmin, so the call is refused with ERR_FORBIDDEN_ROLE while the PlatformAdmin performing the identical call succeeds."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA and airline DL and flight DL1423 exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /baggage/flights/${f1}/cancel"
              payload: {}
              as: BaggageServiceAgent
              captures: { err: $.data.error_id }
            - call: "POST /baggage/flights/${f1}/cancel"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the BaggageServiceAgent call returns 403 with error_id ERR_FORBIDDEN_ROLE"
            - "Flight.${f1}.status is still SCHEDULED after the refusal"
            - "the PlatformAdmin call returns 200 and Flight.${f1}.status == CANCELLED"
            - "a SortationAgent calling the same endpoint is likewise refused with ERR_FORBIDDEN_ROLE"
            - "a sortation agent IS allowed to perform make-up assignment, so the denial is operation-scoped rather than role-wide"
            - "the refusal mutated no entity: Flight.${f1}.version was bumped only by the successful call"

  # ===========================================================================
  - section: RBAC
    instances:

      - name: hold_on_a_bag_holds_the_entire_connection
        claim_type: Role Model
        grounds:
          - roles.TransferAgent
          - roles.Screener
          - state_machines.Bag.HELD_to_ACCEPTED
        distinguishing_aspect: "A HELD custody status gates the Connection's own confirm operation, so the transfer desk cannot progress an itinerary while the screening desk has the bag in custody — an operational mutual dependency between two peer roles."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with lane EDS-2 and make-up area MA-3; airline DL; flight DL1423 departs 15:00 and DL1788 departs 17:30"
            - "transfer bag T1 with a connection of required_mct_minutes 75 and an alarm raised on its screening window; station SEA outage declared"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1788", bank_code: "B2", scheduled_departure_utc: "2026-09-01T17:30:00Z" }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Nakamura, Yui", passenger_ref: "PNR2W8H", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { t1: $.data.id }
            - call: "POST /baggage/bags/${t1}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/connections"
              payload: { bag_id: "${t1}", inbound_flight_id: "${f1}", onward_flight_id: "${f2}", required_mct_minutes: 75 }
              as: TransferAgent
              captures: { cn: $.data.id }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${t1}", lane_id: "${lane}", start_utc: "2026-09-01T07:20:00Z", alarm_code: "EDS_ALARM_A1" }
              as: Screener
              captures: { se: $.data.id }
          trigger:
            - call: "POST /baggage/connections/${cn}/confirm"
              payload: {}
              as: TransferAgent
              captures: { err: $.data.error_id }
            - call: "POST /baggage/screenings/${se}/resolve"
              payload: { outcome: "CLEARED" }
              as: Screener
            - call: "POST /baggage/bags/${t1}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/connections/${cn}/confirm"
              payload: {}
              as: TransferAgent
          assert:
            - "while the bag is HELD the TransferAgent's confirm returns 409 ERR_SCREENING_NOT_CLEARED and Connection.${cn}.status stays PENDING"
            - "the Screener can resolve the alarm but that alone leaves Bag.${t1}.custody_status at HELD"
            - "the AcceptanceAgent's outage re-induction weigh returns Bag.${t1} to ACCEPTED with screening_status IN_LINE"
            - "the TransferAgent must still clear the screening axis again before the confirm is admissible"
            - "once Bag.${t1}.screening_status == CLEARED the confirm returns 200 and Connection.${cn}.status == CONFIRMED"
            - "no role other than TransferAgent may call the confirm endpoint, so the transfer desk is the sole owner of the itinerary"

