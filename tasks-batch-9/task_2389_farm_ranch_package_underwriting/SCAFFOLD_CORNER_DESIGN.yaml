            - "both inspection creations succeed; 13:00 clears 11:00 plus the 90-minute buffer, and 120 + 120 = 240 is within the 480-minute daily capacity"
            - "the LossControlSpecialist and PlatformAdmin reads both return the policy with uw_status RATED — reads are shared by all six roles"
