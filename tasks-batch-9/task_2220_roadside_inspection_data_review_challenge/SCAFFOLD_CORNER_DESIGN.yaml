              captures: { c1_id: $.data.id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070422", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T08:00:00Z", inspection_end: "2026-07-01T09:00:00Z", vehicle_vin: "1FUJA6CK21LK00426", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
