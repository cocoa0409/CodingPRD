  - rule_id: priority_pair_validation_conflict
    instances:
      - name: embargo_temporal_beats_critic_accreditation_referential
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair business_temporal (P7, ERR_EMBARGO_ACTIVE) vs
          business_referential (P8, ERR_CRITIC_NOT_ACCREDITED): a REVOKED critic
          publishing before the embargo lift violates both; the temporal check
          wins because it sits at the higher priority.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA accredited then REVOKED via an accreditation review; R1 OPEN with embargo_until 2026-09-10T00:00:00Z (embargo still active); CA has an INGESTED review on R1 (ingested before revocation)."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - &k_rel_late
              call: "POST /titles/${t1}/releases"
              payload: { cut_label: "THEATRICAL", theatrical_window_start: "2026-09-01T00:00:00Z", theatrical_window_end: "2026-10-01T00:00:00Z", embargo_until: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_ra
            - *k_ar
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "RULE_REVOKE" }
              as: AccreditationBoard
          trigger:
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_EMBARGO_ACTIVE (temporal P7), not ERR_CRITIC_NOT_ACCREDITED (referential P8)"
      - name: closed_release_state_beats_duplicate_review_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair state (P5, ERR_INVALID_STATE) vs
          business_constraint (P10, ERR_DUPLICATE_REVIEW): ingesting a second
          review on a CLOSED release by a critic who already has a live review
          there violates both; the state check wins.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; R1 OPEN then CLOSED; CA already has a PUBLISHED review on R1."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - call: "POST /releases/${r1}/transition"
              payload: { action: "CLOSE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${r1}/reviews"
