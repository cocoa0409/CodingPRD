      - name: occ_approve_rejects_a_program_version_spent_by_a_pool_top_up
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[mortgage-approve-stale-program]", errors.ERR_STALE_PROGRAM_VERSION, "validations[priority=9]", "endpoints.POST /homeownership/mortgage-applications/{id}/approve", calculations.subsidy_pool_ledger]
        distinguishing_aspect: "The approve step commits 1950000 cents against the pool under the program version, so a top-up landing between the officer's read and the approve invalidates it: the second officer is refused with the program rule's 412 id and the pool's committed total stays at zero until the retry on the fresh version. The retry then commits against the ENLARGED pool, showing the refusal cost nothing but a re-read."
