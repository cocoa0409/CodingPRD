  # ===========================================================================
  - section: validations
    instances:
      - name: wood_flour_moisture_limit_breach
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_LOT_LIMIT_EXCEEDED
        distinguishing_aspect: "WOOD_FLOUR moisture above 8.0 blocks release; exactly 8.0 passes."
        test_recipe:
          setup:
            - "Two WOOD_FLOUR lots: A moisture 8.1, B moisture 8.0."
          setup_api_calls:
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 100, received_date: "2026-09-01", moisture_pct: 8.1, contamination_ppm: 100, certificate_ref: "A" }
              as: QualityEngineer
              captures: { lot_a: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 100, received_date: "2026-09-01", moisture_pct: 8.0, contamination_ppm: 100, certificate_ref: "B" }
              as: QualityEngineer
              captures: { lot_b: $.data.id }
          trigger:
            - call: "POST /decking/feedstock-lots/${lot_a}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
              captures: { error_id: $.data.error_id }
            - call: "POST /decking/feedstock-lots/${lot_b}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
          assert:
            - "lot A release returns 422 with error_id == ERR_LOT_LIMIT_EXCEEDED and the lot stays QUARANTINE"
            - "lot B release succeeds and status == RELEASED"

      - name: polymer_lot_requires_melt_flow_index
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_LOT_LIMIT_EXCEEDED
        distinguishing_aspect: "A polymer lot (PCR_FILM) without melt_flow_index cannot be released; WOOD_FLOUR lots never require it."
        test_recipe:
          setup:
            - "One PCR_FILM lot created without melt_flow_index."
          setup_api_calls:
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "PCR_FILM", weight_lbs: 100, received_date: "2026-09-01", moisture_pct: 1.0, contamination_ppm: 100, certificate_ref: "A" }
              as: QualityEngineer
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /decking/feedstock-lots/${lot_id}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_LOT_LIMIT_EXCEEDED"

      - name: formulation_unbalanced_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_FORMULA_UNBALANCED
        distinguishing_aspect: "Weight fractions summing to 9999 bp fail activation with ERR_FORMULA_UNBALANCED."
        test_recipe:
          setup:
            - "DRAFT formulation whose lines sum to 9999 bp."
          setup_api_calls:
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 4999 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
          trigger:
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_FORMULA_UNBALANCED"
            - "Formulation.${form_id}.status remains DRAFT"

      - name: formulation_revision_collision_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_REVISION_COLLISION
        distinguishing_aspect: "Revising an ACTIVE formulation back to a previously used line set is rejected ERR_REVISION_COLLISION."
        test_recipe:
          setup:
            - "ACTIVE formulation at revision 1; revised once to revision 2."
          setup_api_calls:
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/formulations/${form_id}/revisions"
              payload: { lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 4000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 6000 }] }
              as: ProcessEngineer
          trigger:
            - call: "POST /decking/formulations/${form_id}/revisions"
              payload: { lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_REVISION_COLLISION"
            - "Formulation.${form_id}.active_revision == 2"

      - name: duplicate_open_commitment_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=11.5]
          - errors.ERR_DUPLICATE_COMMITMENT
        distinguishing_aspect: "A second OPEN stocking commitment for the same (dealer, territory) pair is rejected even for a different product line; after closing the first, a new one succeeds."
        test_recipe:
          setup:
            - "Dealer with an OPEN commitment in territory VA-N."
          setup_api_calls:
            - call: "POST /decking/dealers"
              payload: { name: "Dealer D", territory_code: "VA-N", credit_limit_cents: 1000000 }
