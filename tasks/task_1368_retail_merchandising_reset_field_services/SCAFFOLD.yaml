scenario: "Retail Merchandising & Reset Field Services (Acosta/SAS Retail Services): project scope & store list assignment, field-rep scheduling & mileage/travel pay, photo verification & completion evidence, store-visit compliance & rework visit, fixture/POG shipment coordination, client billing per store vs hourly, exception reporting (out-of-stock/void), 1099 vs W-2 field workforce"
domain_name: retail-merchandising-reset-field-services
api_prefix: /retail-reset
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Client organization display name"
      - name: billing_model
        type: enum
        source: input
        description: "Default client billing model for projects"
        constraints: "one of {PER_STORE, HOURLY}"
      - name: status
        type: enum
        source: system
        description: "Client lifecycle status"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Negotiated hourly billing rate in cents, required when billing_model=HOURLY; must be >= 0"
      - name: per_store_rate_cents
        type: integer
        source: input
        description: "Negotiated per-store flat billing rate in cents, required when billing_model=PER_STORE; must be >= 0"

  - name: Project
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; owning client"
      - name: title
        type: string
        source: input
        description: "Project title (e.g. Q4 cereal reset)"
      - name: scope_type
        type: enum
        source: input
        description: "Work scope classification"
        constraints: "one of {RESET, NEW_ITEM_CUTOVER, AUDIT, FIXTURE_INSTALL}"
      - name: status
        type: enum
        source: system
        description: "Project lifecycle status"
        default: DRAFT
        constraints: "one of {DRAFT, SCOPED, IN_FIELD, RECONCILING, COMPLETED, CANCELLED}"
      - name: billing_model
        type: enum
        source: input
        description: "Billing model override for this project; if omitted, inherits Client.billing_model at SCOPED transition"
        constraints: "one of {PER_STORE, HOURLY}"
      - name: effective_billing_model
        type: enum
        source: computed
        description: "Resolved billing model: project.billing_model if set else client.billing_model, frozen at DRAFT->SCOPED"
        constraints: "one of {PER_STORE, HOURLY}"
      - name: rework_penalty_score
        type: integer
        source: computed
        description: "Cumulative penalty score from rework visits and exception volume; drives posture"
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "Derived aggregate gating posture from rework_penalty_score thresholds"
        default: NORMAL
        constraints: "one of {NORMAL, WATCH, ESCALATED}"
      - name: completed_store_count
        type: integer
        source: computed
        description: "Count of ProjectStore rows whose latest StoreVisit is VERIFIED"
        default: 0

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_number
        type: string
        source: input
        description: "Retailer-assigned store number; unique per Client via ProjectStore chain"
      - name: name
        type: string
        source: input
        description: "Store display name"
      - name: address
        type: string
        source: input
        description: "Street address"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone for visit window validation"

  - name: ProjectStore
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; assigned store"
      - name: status
        type: enum
        source: system
        description: "Assignment-of-store lifecycle within project"
        default: PENDING
        constraints: "one of {PENDING, ASSIGNED, IN_PROGRESS, COMPLETED, REWORK_REQUIRED, DROPPED}"
      - name: due_date
        type: string
        source: input
        description: "ISO date by which the reset must be completed at this store"
      - name: assigned_rep_id
        type: string
        source: system
        description: "FK -> FieldRep.id; current rep, null until ASSIGNED"

  - name: FieldRep
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Rep legal name"
      - name: employment_type
        type: enum
        source: input
        description: "Worker classification driving pay rules"
        constraints: "one of {W2, C1099}"
      - name: home_base_commute_miles
        type: integer
        source: input
        description: "One-way ordinary commute miles used to offset reimbursable mileage for W2 reps; must be >= 0"
      - name: mileage_rate_cents
        type: integer
        source: input
        description: "Per-mile reimbursement rate in cents; must be >= 0"
      - name: travel_minute_rate_cents
        type: integer
        source: input
        description: "Per-minute travel-time pay rate in cents (W2 only; C1099 reps are never paid travel time); must be >= 0"
      - name: mileage_policy
        type: enum
        source: input
        description: "Which mileage-pay variant applies to this rep"
        constraints: "one of {HOME_BASED, FIRST_STOP}"
      - name: status
        type: enum
        source: system
        description: "Rep availability status"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"

  - name: Assignment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project context"
      - name: project_store_id
        type: string
        source: input
        description: "FK -> ProjectStore.id; the store being scheduled"
      - name: rep_id
        type: string
        source: input
        description: "FK -> FieldRep.id; scheduled rep"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned visit start (ISO8601 UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned visit end (ISO8601 UTC); must be strictly after scheduled_start"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, EN_ROUTE, ON_SITE, SUBMITTED, VERIFIED, REJECTED, CANCELLED}"
      - name: is_rework
        type: boolean
        source: system
        description: "True when created via a ReworkAuthorization; false for initial visits"
        default: "false"

  - name: StoreVisit
    parent: Assignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the executed assignment"
      - name: check_in_at
        type: datetime
        source: system
        description: "Server-stamped check-in time from the logical clock"
      - name: check_out_at
        type: datetime
        source: system
        description: "Server-stamped check-out time from the logical clock; null while ON_SITE"
      - name: on_site_minutes
        type: integer
        source: computed
        description: "Minutes between check_in_at and check_out_at, computed at check-out; 0 until checked out"
      - name: verification_status
        type: enum
        source: system
        description: "Photo-evidence verification outcome"
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, VERIFIED, REJECTED}"
      - name: billable_amount_cents
        type: integer
        source: computed
        description: "Client-billing amount for this visit computed at VERIFIED per Project.effective_billing_model; null until VERIFIED"
      - name: is_rework
        type: boolean
        source: system
        description: "Copied from Assignment.is_rework at creation; rework visits bill at 0 to the client"
        default: "false"

  - name: PhotoEvidence
    parent: StoreVisit
    common_fields: false
    fields:
      - name: store_visit_id
        type: string
        source: input
        description: "FK -> StoreVisit.id; the visit evidenced"
      - name: photo_type
        type: enum
        source: input
        description: "Evidence category"
        constraints: "one of {BEFORE, AFTER, POG_LABEL, FIXTURE, VOID_AREA}"
      - name: image_url
        type: string
        source: input
        description: "Uploaded image reference"
      - name: captured_at
        type: datetime
        source: input
        description: "Client-reported capture timestamp; must be within the visit's check_in_at..check_out_at window"

  - name: ExceptionReport
    parent: StoreVisit
    common_fields: false
    fields:
      - name: store_visit_id
        type: string
        source: input
        description: "FK -> StoreVisit.id; visit during which the exception was observed"
      - name: exception_type
        type: enum
        source: input
        description: "Exception category"
        constraints: "one of {OUT_OF_STOCK, VOID, FIXTURE_MISSING, POG_MISSING, PRICE_MISMATCH}"
      - name: sku_count
        type: integer
        source: input
        description: "Number of SKUs affected; must be >= 1"
      - name: severity
        type: enum
        source: input
        description: "Severity driving rework penalty score"
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: resolution
        type: enum
        source: system
        description: "Resolution state of the exception"
        default: OPEN
        constraints: "one of {OPEN, RESOLVED, WAIVED}"

  - name: FixtureShipment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project needing fixtures/POGs"
      - name: project_store_id
        type: string
        source: input
        description: "FK -> ProjectStore.id; destination store"
      - name: carrier
        type: string
        source: input
        description: "Carrier name"
      - name: tracking_number
        type: string
        source: input
        description: "Carrier tracking number"
      - name: status
        type: enum
        source: system
        description: "Shipment lifecycle"
        default: LABEL_CREATED
        constraints: "one of {LABEL_CREATED, IN_TRANSIT, DELIVERED, DELIVERY_EXCEPTION, LOST}"
      - name: promised_date
        type: string
        source: input
        description: "ISO date the shipment must arrive by; visit check-in is blocked while shipment is undelivered and promised_date <= current date when scope_type=FIXTURE_INSTALL"

  - name: ReworkAuthorization
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project context"
      - name: project_store_id
        type: string
        source: input
        description: "FK -> ProjectStore.id; store needing rework"
      - name: rejected_store_visit_id
        type: string
        source: input
        description: "FK -> StoreVisit.id; the REJECTED visit that justifies rework"
      - name: status
        type: enum
        source: system
        description: "Rework authorization lifecycle"
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, CONSUMED, DENIED, EXPIRED}"
      - name: reason
        type: string
        source: input
        description: "Free-text rework justification"

  - name: MileageLog
    parent: FieldRep
    common_fields: true
    fields:
      - name: rep_id
        type: string
        source: input
        description: "FK -> FieldRep.id; rep claiming mileage"
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; assignment the travel served"
      - name: round_trip_miles
        type: integer
        source: input
        description: "Odometer round-trip miles; must be >= 0"
      - name: home_to_first_stop_miles
        type: integer
        source: input
        description: "Miles from home to first stop (used by FIRST_STOP variant); must be >= 0"
      - name: drive_minutes
        type: integer
        source: input
        description: "Total drive minutes for the day; must be >= 0"
      - name: mileage_pay_cents
        type: integer
        source: computed
        description: "Reimbursable mileage pay, variant depends on rep.mileage_policy"
      - name: travel_time_pay_cents
        type: integer
        source: computed
        description: "Tiered travel-time pay; always 0 for C1099 reps"
      - name: status
        type: enum
        source: system
        description: "Mileage claim lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, PAID}"

  - name: Invoice
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; billed client"
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project being billed"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle"
        default: OPEN
        constraints: "one of {OPEN, FINALIZED, VOID}"
      - name: line_total_cents
        type: integer
        source: computed
        description: "Sum of per-line rounded amounts for VERIFIED non-rework StoreVisits on this project"
        default: 0
      - name: adjustment_cents
        type: integer
        source: input
        description: "Manual signed adjustment applied at finalize; defaults 0"
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: "line_total_cents + adjustment_cents computed at FINALIZED; null while OPEN"

state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /retail-reset/projects/{id}/scope"
        actor: ProjectManager
        preconditions:
          - "project has >= 1 ProjectStore row in status PENDING"
          - "client.status == ACTIVE"
          - "effective_billing_model resolvable: project.billing_model set OR client.billing_model set"
        side_effects:
          - "freezes project.effective_billing_model = project.billing_model if set else client.billing_model"
          - "increments project.version by 1"
      - from: SCOPED
        to: IN_FIELD
        trigger: "POST /retail-reset/assignments (first SCHEDULED assignment on any ProjectStore of this project)"
        actor: system
        preconditions:
          - "project.status == SCOPED"
        side_effects:
          - "project.status flips to IN_FIELD when the project's first Assignment reaches SCHEDULED"
          - "increments project.version by 1"
      - from: IN_FIELD
        to: RECONCILING
        trigger: "system: every ProjectStore of the project reaches a terminal visit outcome (COMPLETED or DROPPED)"
        actor: system
        preconditions:
          - "all ProjectStore rows with project_id == project.id have status IN {COMPLETED, DROPPED}"
          - "at least one ProjectStore has status == COMPLETED"
        side_effects:
          - "project.completed_store_count recomputed"
          - "an OPEN Invoice is auto-created for (client_id, project_id) if none exists"
          - "increments project.version by 1"
      - from: RECONCILING
        to: COMPLETED
        trigger: "POST /retail-reset/invoices/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "project.status == RECONCILING"
          - "invoice.status == OPEN"
          - "no ExceptionReport on any StoreVisit of the project has resolution == OPEN"
        side_effects:
          - "invoice.status -> FINALIZED, grand_total_cents computed"
          - "project.status -> COMPLETED"
          - "increments project.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /retail-reset/projects/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "project.status IN {DRAFT, SCOPED}"
        side_effects:
          - "all ProjectStore rows in {PENDING, ASSIGNED} -> DROPPED"
          - "increments project.version by 1"
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /retail-reset/projects/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "project.status IN {DRAFT, SCOPED}"
        side_effects:
          - "all ProjectStore rows in {PENDING, ASSIGNED} -> DROPPED"
          - "increments project.version by 1"
      - from: IN_FIELD
        to: CANCELLED
        trigger: "POST /retail-reset/projects/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "project.status == IN_FIELD"
          - "no Assignment of the project is in status ON_SITE"
        side_effects:
          - "all ProjectStore rows in {PENDING, ASSIGNED, IN_PROGRESS, REWORK_REQUIRED} -> DROPPED"
          - "all Assignment rows in {SCHEDULED, EN_ROUTE} -> CANCELLED"
          - "each such Assignment cancellation cascades: its ProjectStore.assigned_rep_id cleared"
          - "increments project.version by 1"

  - entity: ProjectStore
    initial_state: PENDING
    terminal_states: [COMPLETED, DROPPED]
    transitions:
      - from: PENDING
        to: ASSIGNED
        trigger: "POST /retail-reset/assignments"
        actor: ProjectManager
        preconditions:
          - "project_store.status == PENDING OR project_store.status == REWORK_REQUIRED (rework path)"
          - "project.status IN {SCOPED, IN_FIELD}"
          - "rep.status == ACTIVE"
          - "no Assignment with project_store_id == this row exists in status IN {SCHEDULED, EN_ROUTE, ON_SITE}"
        side_effects:
          - "project_store.assigned_rep_id = assignment.rep_id"
          - "assignment created with status SCHEDULED"
          - "increments project_store.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /retail-reset/assignments/{id}/check-in"
        actor: FieldRep
        preconditions:
          - "assignment.status == SCHEDULED or EN_ROUTE"
          - "project_store.status == ASSIGNED"
        side_effects:
          - "StoreVisit created with check_in_at = logical clock"
          - "assignment.status -> ON_SITE"
          - "increments project_store.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /retail-reset/store-visits/{id}/verify"
        actor: ProjectManager
        preconditions:
          - "store_visit.verification_status == PENDING_REVIEW"
          - "at least one PhotoEvidence with photo_type == BEFORE and one with photo_type == AFTER exist for the visit"
        side_effects:
          - "store_visit.verification_status -> VERIFIED"
          - "store_visit.billable_amount_cents computed via visit_billing calculation (0 when is_rework)"
          - "project_store.status -> COMPLETED"
          - "project.completed_store_count recomputed"
          - "if all sibling ProjectStore rows now IN {COMPLETED, DROPPED} and >= 1 COMPLETED: project IN_FIELD -> RECONCILING cascade fires"
          - "increments project_store.version by 1"
      - from: IN_PROGRESS
        to: REWORK_REQUIRED
        trigger: "POST /retail-reset/store-visits/{id}/reject"
        actor: ProjectManager
        preconditions:
          - "store_visit.verification_status == PENDING_REVIEW"
        side_effects:
          - "store_visit.verification_status -> REJECTED"
          - "project_store.status -> REWORK_REQUIRED"
          - "project.rework_penalty_score += 10 via rework_penalty calculation; project.posture re-derived from thresholds"
          - "a ReworkAuthorization is auto-created in status REQUESTED for (project_id, project_store_id, rejected_store_visit_id)"
          - "increments project_store.version by 1"
      - from: REWORK_REQUIRED
        to: ASSIGNED
        trigger: "POST /retail-reset/rework-authorizations/{id}/approve followed by POST /retail-reset/assignments with rework_authorization_id"
        actor: ProjectManager
        preconditions:
          - "rework_authorization.status == APPROVED"
        side_effects:
          - "rework_authorization.status -> CONSUMED"
          - "new Assignment created with is_rework = true"
          - "project_store.assigned_rep_id = new assignment.rep_id"
          - "increments project_store.version by 1"
      - from: PENDING
        to: DROPPED
        trigger: "POST /retail-reset/project-stores/{id}/drop"
        actor: ProjectManager
        preconditions:
          - "project_store.status IN {PENDING, ASSIGNED, REWORK_REQUIRED}"
          - "project.status NOT IN {COMPLETED, CANCELLED}"
        side_effects:
          - "any Assignment of this store in {SCHEDULED, EN_ROUTE} -> CANCELLED"
          - "project_store.assigned_rep_id cleared"
          - "increments project_store.version by 1"
      - from: ASSIGNED
        to: DROPPED
        trigger: "POST /retail-reset/project-stores/{id}/drop"
        actor: ProjectManager
        preconditions:
          - "project_store.status IN {PENDING, ASSIGNED, REWORK_REQUIRED}"
          - "no Assignment of this store in status ON_SITE"
        side_effects:
          - "any Assignment of this store in {SCHEDULED, EN_ROUTE} -> CANCELLED"
          - "project_store.assigned_rep_id cleared"
          - "increments project_store.version by 1"
      - from: REWORK_REQUIRED
        to: DROPPED
        trigger: "POST /retail-reset/project-stores/{id}/drop"
        actor: ProjectManager
        preconditions:
          - "project_store.status IN {PENDING, ASSIGNED, REWORK_REQUIRED}"
        side_effects:
          - "open ReworkAuthorization rows for this store in {REQUESTED, APPROVED} -> EXPIRED"
          - "project_store.assigned_rep_id cleared"
          - "increments project_store.version by 1"

  - entity: Assignment
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, REJECTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /retail-reset/assignments/{id}/depart"
        actor: FieldRep
        preconditions:
          - "assignment.status == SCHEDULED"
          - "acting rep == assignment.rep_id"
          - "no FixtureShipment for this store with status IN {LABEL_CREATED, IN_TRANSIT} when project.scope_type == FIXTURE_INSTALL and shipment.promised_date <= current logical date"
        side_effects:
          - "increments assignment.version by 1"
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /retail-reset/assignments/{id}/check-in"
        actor: FieldRep
        preconditions:
          - "assignment.status IN {SCHEDULED, EN_ROUTE}"
          - "acting rep == assignment.rep_id"
          - "no overlapping Assignment for the same rep with status == ON_SITE (rep double-booking block)"
          - "no FixtureShipment for this store with status IN {LABEL_CREATED, IN_TRANSIT, DELIVERY_EXCEPTION} when project.scope_type == FIXTURE_INSTALL"
        side_effects:
          - "StoreVisit created (check_in_at = logical clock, verification_status = PENDING_REVIEW)"
          - "project_store.status ASSIGNED -> IN_PROGRESS"
          - "increments assignment.version by 1"
      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /retail-reset/assignments/{id}/check-in"
        actor: FieldRep
        preconditions:
          - "assignment.status IN {SCHEDULED, EN_ROUTE}"
          - "acting rep == assignment.rep_id"
          - "no overlapping Assignment for the same rep with status == ON_SITE"
          - "no FixtureShipment for this store with status IN {LABEL_CREATED, IN_TRANSIT, DELIVERY_EXCEPTION} when project.scope_type == FIXTURE_INSTALL"
        side_effects:
          - "StoreVisit created (check_in_at = logical clock, verification_status = PENDING_REVIEW)"
          - "project_store.status ASSIGNED -> IN_PROGRESS"
          - "increments assignment.version by 1"
      - from: ON_SITE
        to: SUBMITTED
        trigger: "POST /retail-reset/assignments/{id}/check-out"
        actor: FieldRep
        preconditions:
          - "assignment.status == ON_SITE"
          - "acting rep == assignment.rep_id"
          - "the open StoreVisit for this assignment has >= 1 PhotoEvidence with photo_type == BEFORE and >= 1 with photo_type == AFTER"
        side_effects:
          - "store_visit.check_out_at = logical clock; on_site_minutes computed"
          - "increments assignment.version by 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /retail-reset/store-visits/{id}/verify"
        actor: ProjectManager
        preconditions:
          - "store_visit.verification_status == PENDING_REVIEW"
        side_effects:
          - "store_visit.verification_status -> VERIFIED; billable_amount_cents computed"
          - "project_store.status IN_PROGRESS -> COMPLETED"
          - "project.completed_store_count recomputed"
          - "if all sibling ProjectStore rows IN {COMPLETED, DROPPED} and >= 1 COMPLETED: project IN_FIELD -> RECONCILING cascade fires, auto-creating OPEN Invoice"
          - "increments assignment.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /retail-reset/store-visits/{id}/reject"
        actor: ProjectManager
        preconditions:
          - "store_visit.verification_status == PENDING_REVIEW"
        side_effects:
          - "store_visit.verification_status -> REJECTED"
          - "project_store.status IN_PROGRESS -> REWORK_REQUIRED"
          - "project.rework_penalty_score += 10; posture re-derived"
          - "ReworkAuthorization auto-created in REQUESTED"
          - "increments assignment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /retail-reset/assignments/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "assignment.status IN {SCHEDULED, EN_ROUTE}"
        side_effects:
          - "project_store.status reverts ASSIGNED -> PENDING and assigned_rep_id cleared (when project_store.status was ASSIGNED)"
          - "if the cancelled assignment was the project's last non-terminal Assignment and project.status == IN_FIELD with zero VERIFIED visits: project stays IN_FIELD"
          - "increments assignment.version by 1"
      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /retail-reset/assignments/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "assignment.status IN {SCHEDULED, EN_ROUTE}"
        side_effects:
          - "project_store.status reverts ASSIGNED -> PENDING and assigned_rep_id cleared"
          - "increments assignment.version by 1"

  - entity: MileageLog
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /retail-reset/mileage-logs/{id}/approve"
        actor: PayrollAdmin
        preconditions:
          - "mileage_log.status == SUBMITTED"
          - "mileage_log.rep.status == ACTIVE"
        side_effects:
          - "mileage_pay_cents and travel_time_pay_cents recomputed and frozen"
          - "increments mileage_log.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /retail-reset/mileage-logs/{id}/reject"
        actor: PayrollAdmin
        preconditions:
          - "mileage_log.status == SUBMITTED"
        side_effects:
          - "increments mileage_log.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /retail-reset/mileage-logs/{id}/pay"
        actor: PayrollAdmin
        preconditions:
          - "mileage_log.status == APPROVED"
        side_effects:
          - "increments mileage_log.version by 1"

  - entity: FixtureShipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, LOST]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /retail-reset/fixture-shipments/{id}/scan"
        actor: ProjectManager
        preconditions:
          - "fixture_shipment.status IN {LABEL_CREATED, IN_TRANSIT, DELIVERY_EXCEPTION}"
        side_effects:
          - "increments fixture_shipment.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /retail-reset/fixture-shipments/{id}/scan with scan_result=DELIVERED"
        actor: ProjectManager
        preconditions:
          - "fixture_shipment.status IN {IN_TRANSIT, DELIVERY_EXCEPTION}"
        side_effects:
          - "if scan timestamp date > promised_date: project.rework_penalty_score += 5 (late delivery penalty) and posture re-derived"
          - "increments fixture_shipment.version by 1"
      - from: IN_TRANSIT
        to: DELIVERY_EXCEPTION
        trigger: "POST /retail-reset/fixture-shipments/{id}/scan with scan_result=EXCEPTION"
        actor: ProjectManager
        preconditions:
          - "fixture_shipment.status IN {LABEL_CREATED, IN_TRANSIT}"
        side_effects:
          - "project.rework_penalty_score += 3 and posture re-derived"
          - "increments fixture_shipment.version by 1"
      - from: DELIVERY_EXCEPTION
        to: IN_TRANSIT
        trigger: "POST /retail-reset/fixture-shipments/{id}/scan with scan_result=IN_TRANSIT"
        actor: ProjectManager
        preconditions:
          - "fixture_shipment.status == DELIVERY_EXCEPTION"
        side_effects:
          - "increments fixture_shipment.version by 1"
      - from: DELIVERY_EXCEPTION
        to: DELIVERED
        trigger: "POST /retail-reset/fixture-shipments/{id}/scan with scan_result=DELIVERED"
        actor: ProjectManager
        preconditions:
          - "fixture_shipment.status == DELIVERY_EXCEPTION"
        side_effects:
          - "if scan timestamp date > promised_date: project.rework_penalty_score += 5 and posture re-derived"
          - "increments fixture_shipment.version by 1"
      - from: IN_TRANSIT
        to: LOST
        trigger: "POST /retail-reset/fixture-shipments/{id}/scan with scan_result=LOST"
        actor: ProjectManager
        preconditions:
          - "fixture_shipment.status == IN_TRANSIT"
        side_effects:
          - "project.rework_penalty_score += 8 and posture re-derived"
          - "increments fixture_shipment.version by 1"

  - entity: ReworkAuthorization
    initial_state: REQUESTED
    terminal_states: [CONSUMED, DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /retail-reset/rework-authorizations/{id}/approve"
        actor: Client
        preconditions:
          - "rework_authorization.status == REQUESTED"
          - "acting client's id == project.client_id"
          - "project.posture != ESCALATED (ESCALATED projects require manual PM path; client self-approval blocked)"
        side_effects:
          - "increments rework_authorization.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /retail-reset/rework-authorizations/{id}/deny"
        actor: Client
        preconditions:
          - "rework_authorization.status == REQUESTED"
          - "acting client's id == project.client_id"
        side_effects:
          - "project.rework_penalty_score += 5 (denied rework penalty) and posture re-derived"
          - "increments rework_authorization.version by 1"
      - from: APPROVED
        to: CONSUMED
        trigger: "POST /retail-reset/assignments with rework_authorization_id"
        actor: system
        preconditions:
          - "rework_authorization.status == APPROVED"
        side_effects:
          - "new Assignment created with is_rework = true"
          - "project_store.status REWORK_REQUIRED -> ASSIGNED"
          - "increments rework_authorization.version by 1"
      - from: REQUESTED
        to: EXPIRED
        trigger: "system: logical clock date advances past project_store.due_date while still REQUESTED"
        actor: system
        preconditions:
          - "rework_authorization.status == REQUESTED"
          - "current logical date > project_store.due_date"
        side_effects:
          - "project.rework_penalty_score += 7 and posture re-derived"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: logical clock date advances past project_store.due_date while still APPROVED but unconsumed"
        actor: system
        preconditions:
          - "rework_authorization.status == APPROVED"
          - "current logical date > project_store.due_date"
        side_effects:
          - "project.rework_penalty_score += 7 and posture re-derived"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /retail-reset/invoices/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "invoice.status == OPEN"
          - "project.status == RECONCILING"
          - "no ExceptionReport on any StoreVisit of the project has resolution == OPEN"
        side_effects:
          - "invoice.line_total_cents recomputed via invoice_total calculation"
          - "invoice.grand_total_cents = line_total_cents + adjustment_cents"
          - "project.status RECONCILING -> COMPLETED"
          - "increments invoice.version by 1"
      - from: OPEN
        to: VOID
        trigger: "POST /retail-reset/invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "invoice.status == OPEN"
        side_effects:
          - "increments invoice.version by 1"

concurrency_rules:
  - rule_id: project-scope-stale-version
    parent_entity: Project
    write_endpoint: "POST /retail-reset/projects/{id}/scope"
    occ_field: "expected_project_version"
    description: |
      Scoping a Project whose version has advanced since the caller last
      observed it is rejected: another writer may have added or dropped
      ProjectStore rows, changed the billing override, or otherwise mutated
      the project, so the scoping decision would be based on a stale store
      list. The caller must re-read the project and retry with the current
      version.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: invoice-finalize-stale-version
    parent_entity: Invoice
    write_endpoint: "POST /retail-reset/invoices/{id}/finalize"
    occ_field: "expected_invoice_version"
    description: |
      Finalizing an Invoice whose version has advanced since the caller last
      observed it is rejected: a newly VERIFIED visit may have just been
      folded into line_total_cents, so finalizing from a stale read would
      lock an outdated grand total. The caller must re-read and retry.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

calculations:
  - name: mileage_pay
    trigger: "on MileageLog creation and again on approve (recompute + freeze)"
    algorithm: threshold
    formula: |
      if rep.mileage_policy == HOME_BASED:
          payable_miles = max(0, round_trip_miles - 2 * rep.home_base_commute_miles)
      elif rep.mileage_policy == FIRST_STOP:
          payable_miles = max(0, round_trip_miles - home_to_first_stop_miles)
      mileage_pay_cents = payable_miles * rep.mileage_rate_cents
    input_set: "MileageLog fields + owning FieldRep; only logs whose assignment.status IN {SUBMITTED, VERIFIED}"
    constants:
      COMMUTE_ROUND_TRIP_FACTOR: 2
    precision: "integer cents; no rounding needed"
    variants:
      - name: HOME_BASED
        when: "rep.mileage_policy == HOME_BASED (standard W2 commute-offset policy)"
        difference: "subtracts twice the rep's ordinary one-way commute from round-trip miles before applying the rate"
      - name: FIRST_STOP
        when: "rep.mileage_policy == FIRST_STOP (common C1099 first-stop policy)"
        difference: "subtracts only the home-to-first-stop leg; all subsequent inter-store and return miles are payable"
  - name: travel_time_pay
    trigger: "on MileageLog creation and again on approve (recompute + freeze)"
    algorithm: tiered_pricing
    formula: |
      if rep.employment_type == C1099:
          travel_time_pay_cents = 0
      else:
          m = drive_minutes
          t1 = min(m, 60)
          t2 = min(max(m - 60, 0), 60)
          t3 = max(m - 120, 0)
          travel_time_pay_cents = t1 * rate + round_half_up(t2 * rate * 1.25) + round_half_up(t3 * rate * 1.5)
          where rate = rep.travel_minute_rate_cents
    input_set: "MileageLog.drive_minutes + owning FieldRep.employment_type/travel_minute_rate_cents"
    constants:
      TIER1_CAP_MIN: 60
      TIER2_CAP_MIN: 120
      TIER2_MULTIPLIER: 1.25
      TIER3_MULTIPLIER: 1.5
    precision: "integer cents; each tier rounded half-up to whole cents BEFORE summing (pinned rounding order: per-tier round, then sum)"
    variants: []
  - name: visit_billing
    trigger: "on StoreVisit verification (PENDING_REVIEW -> VERIFIED)"
    algorithm: tiered_pricing
    formula: |
      if store_visit.is_rework:
          billable_amount_cents = 0
      elif project.effective_billing_model == PER_STORE:
          billable_amount_cents = client.per_store_rate_cents
      else:  # HOURLY
          billable_amount_cents = round_half_up(on_site_minutes * client.hourly_rate_cents / 60)
    input_set: "StoreVisit.on_site_minutes + Project.effective_billing_model + Client rate fields; only VERIFIED, non-rework visits produce a nonzero amount"
    constants: {}
    precision: "integer cents, round_half_up at the per-visit level"
    variants:
      - name: PER_STORE
        when: "project.effective_billing_model == PER_STORE"
        difference: "flat per-store fee regardless of on_site_minutes"
      - name: HOURLY
        when: "project.effective_billing_model == HOURLY"
        difference: "prorated by on-site minutes against the negotiated hourly rate; two visits of different durations bill different amounts"
  - name: invoice_total
    trigger: "on invoice finalize; also recomputed on any StoreVisit verification while invoice.status == OPEN"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: each visit line is already rounded to integer
      # cents at verification time (visit_billing); lines are summed as
      # integers. Never re-round the sum.
      line_total_cents = sum(store_visit.billable_amount_cents
                             for store_visit in project visits
                             where verification_status == VERIFIED)
      grand_total_cents = line_total_cents + invoice.adjustment_cents
    input_set: "StoreVisit rows of the invoice's project with verification_status == VERIFIED; REJECTED and PENDING_REVIEW visits are excluded; rework visits contribute 0"
    constants: {}
    precision: "integer cents; line-level rounding pinned at verification, sum is exact integer addition"
    variants: []
  - name: rework_penalty
    trigger: "on StoreVisit reject (+10), ReworkAuthorization deny (+5), ReworkAuthorization expiry (+7), FixtureShipment DELIVERY_EXCEPTION (+3), FixtureShipment late DELIVERED (+5), FixtureShipment LOST (+8)"
    algorithm: threshold
    formula: |
      rework_penalty_score = sum of all penalty increments on the project (monotonic accumulator, never decrements)
      posture = NORMAL  if rework_penalty_score < 20
                WATCH   if 20 <= rework_penalty_score < 40
                ESCALATED if rework_penalty_score >= 40
    input_set: "all penalty-generating events tied to the project; ordering irrelevant (pure sum); boundary comparisons are inclusive on the lower bound (>= 20 is WATCH, >= 40 is ESCALATED)"
    constants:
      REJECT_PENALTY: 10
      DENY_PENALTY: 5
      EXPIRY_PENALTY: 7
      DELIVERY_EXCEPTION_PENALTY: 3
      LATE_DELIVERY_PENALTY: 5
      LOST_PENALTY: 8
      WATCH_THRESHOLD: 20
      ESCALATED_THRESHOLD: 40
    precision: "integer score; threshold comparisons use >="
    variants: []
  - name: photo_window_check
    trigger: "on PhotoEvidence upload"
    algorithm: chronological
    formula: |
      # Uploads are accepted only while the owning assignment is ON_SITE
      # (rep is physically at the store taking pictures). After check-out the
      # visit is frozen and further uploads are rejected with ERR_INVALID_STATE.
      # While ON_SITE, accept iff check_in_at <= captured_at <= current logical
      # clock time (a photo cannot carry a future capture timestamp; capture
      # before check-in is rejected ERR_TEMPORAL_INVALID).
      accept iff assignment.status == ON_SITE
              and check_in_at <= captured_at <= current_logical_clock()
    input_set: "PhotoEvidence.captured_at vs owning StoreVisit.check_in_at and the server's logical clock at upload time"
    constants: {}
    precision: "second-level timestamp comparison, inclusive on both ends"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and body FK reference resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition is defined (per state machine)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_referential
    check: "cross-entity ownership: assignment.project_store belongs to assignment.project; mileage_log.assignment belongs to mileage_log.rep's assignment set; rework_authorization.project_store belongs to rework_authorization.project; photo/exception.store_visit exists"
    error_id: ERR_CROSS_ENTITY_MISMATCH
    http_status: 422
    applies_to: "POST /retail-reset/assignments, POST /retail-reset/mileage-logs, POST /retail-reset/rework-authorizations, POST /retail-reset/store-visits/{id}/photos, POST /retail-reset/store-visits/{id}/exceptions"
  - priority: 6
    category: business_temporal
    check: "assignment scheduled_end strictly after scheduled_start; project_store due_date not before project scope date; photo captured_at within visit window"
    error_id: ERR_TEMPORAL_INVALID
    http_status: 422
    applies_to: "POST /retail-reset/assignments, POST /retail-reset/project-stores, POST /retail-reset/store-visits/{id}/photos"
  - priority: 7
    category: business_constraint
    check: "rep double-booking: no overlapping [scheduled_start, scheduled_end) interval for the same rep among assignments in {SCHEDULED, EN_ROUTE, ON_SITE}; a rep may hold at most one ON_SITE assignment (zero-duration adjacency allowed: end == start is NOT an overlap)"
    error_id: ERR_REP_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /retail-reset/assignments"
  - priority: 8
    category: business_constraint
    check: "store-list uniqueness: (project_id, store_id) unique among ProjectStore rows not in status DROPPED"
    error_id: ERR_DUPLICATE_STORE
    http_status: 409
    applies_to: "POST /retail-reset/project-stores"
  - priority: 9
    category: business_safety
    check: "FIXTURE_INSTALL gating: assignment check-in/depart blocked while an undelivered FixtureShipment exists for the store per state machine preconditions"
    error_id: ERR_FIXTURES_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /retail-reset/assignments/{id}/depart, POST /retail-reset/assignments/{id}/check-in"
  - priority: 10
    category: business_fiscal
    check: "billing model resolution: scoping fails when neither project.billing_model nor client.billing_model is set; hourly project requires client.hourly_rate_cents set; per-store project requires client.per_store_rate_cents set"
    error_id: ERR_BILLING_MODEL_UNRESOLVABLE
    http_status: 422
    applies_to: "POST /retail-reset/projects/{id}/scope"
  - priority: 11
    category: business_fiscal
    check: "invoice finalize blocked while any ExceptionReport on any visit of the project is resolution == OPEN"
    error_id: ERR_OPEN_EXCEPTIONS
    http_status: 409
    applies_to: "POST /retail-reset/invoices/{id}/finalize"
  - priority: 12
    category: business_safety
    check: "workforce classification: C1099 reps may only be assigned to projects whose scope_type != FIXTURE_INSTALL (heavy-fixture work requires W2 employees under client compliance rules)"
    error_id: ERR_CLASSIFICATION_FORBIDDEN
    http_status: 422
    applies_to: "POST /retail-reset/assignments"
  - priority: 13
    category: business_constraint
    check: "required input fields present and typed per endpoint input schema; enums within declared sets; non-negative integer fields >= 0; exception sku_count >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 14
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /retail-reset/projects/{id}/scope"
  - priority: 15
    category: business_constraint
    check: "OCC: expected_invoice_version matches invoice.version at finalize"
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /retail-reset/invoices/{id}/finalize"
  - priority: 16
    category: state
    check: "rework assignment creation requires rework_authorization.status == APPROVED and project_store.status == REWORK_REQUIRED"
    error_id: ERR_REWORK_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /retail-reset/assignments (when rework_authorization_id supplied)"

endpoints:
  - method: POST
    path: "/retail-reset/clients"
    description: "Create a client organization"
    roles: [ProjectManager]
    code: 201
    input: [name, "billing_model?", "hourly_rate_cents?", "per_store_rate_cents?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/retail-reset/clients"
    description: "List clients with pagination"
    roles: [ProjectManager, BillingClerk, PayrollAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/retail-reset/clients/{id}"
    description: "Get a client"
    roles: [ProjectManager, BillingClerk, PayrollAdmin, Client]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/retail-reset/stores"
    description: "Create a store"
    roles: [ProjectManager]
    code: 201
    input: [store_number, name, address, timezone]
    output: Store
    side_effects: []
  - method: GET
    path: "/retail-reset/stores"
    description: "List stores with pagination"
    roles: [ProjectManager, FieldRep]
    code: 200
    input: ["limit?", "offset?"]
    output: Store[]
    side_effects: []
  - method: GET
    path: "/retail-reset/stores/{id}"
    description: "Get a store"
    roles: [ProjectManager, FieldRep, Client]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/retail-reset/reps"
    description: "Create a field rep (W2 or C1099)"
    roles: [PayrollAdmin]
    code: 201
    input: [full_name, employment_type, home_base_commute_miles, mileage_rate_cents, travel_minute_rate_cents, mileage_policy]
    output: FieldRep
    side_effects: []
  - method: GET
    path: "/retail-reset/reps"
    description: "List field reps"
    roles: [ProjectManager, PayrollAdmin]
    code: 200
    input: ["limit?", "offset?", "employment_type?", "status?"]
    output: FieldRep[]
    side_effects: []
  - method: GET
    path: "/retail-reset/reps/{id}"
    description: "Get a field rep"
    roles: [ProjectManager, PayrollAdmin, FieldRep]
    code: 200
    input: []
    output: FieldRep
    side_effects: []
  - method: POST
    path: "/retail-reset/projects"
    description: "Create a project under a client"
    roles: [ProjectManager]
    code: 201
    input: [client_id, title, scope_type, "billing_model?"]
    output: Project
    side_effects: []
  - method: GET
    path: "/retail-reset/projects"
    description: "List projects"
    roles: [ProjectManager, BillingClerk, Client]
    code: 200
    input: ["limit?", "offset?", "client_id?", "status?", "posture?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/retail-reset/projects/{id}"
    description: "Get a project (includes computed posture, rework_penalty_score, completed_store_count)"
    roles: [ProjectManager, BillingClerk, Client, PayrollAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/retail-reset/projects/{id}/scope"
    description: "Scope the project: freeze effective_billing_model; OCC-guarded by expected_project_version"
    roles: [ProjectManager]
    code: 200
    input: [expected_project_version]
    output: Project
    side_effects: ["freezes effective_billing_model", "increments project.version by 1"]
  - method: POST
    path: "/retail-reset/projects/{id}/cancel"
    description: "Cancel a project; cascades to ProjectStore and Assignment rows"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["drops non-terminal project stores", "cancels non-terminal assignments", "increments project.version by 1"]
  - method: POST
    path: "/retail-reset/project-stores"
    description: "Add a store to a project's store list"
    roles: [ProjectManager]
    code: 201
    input: [project_id, store_id, due_date]
    output: ProjectStore
    side_effects: ["increments parent project.version by 1 (store-list mutation is a project mutation for OCC purposes)"]
  - method: GET
    path: "/retail-reset/project-stores"
    description: "List project-store rows; filterable"
    roles: [ProjectManager, Client, FieldRep]
    code: 200
    input: ["limit?", "offset?", "project_id?", "store_id?", "status?", "assigned_rep_id?"]
    output: ProjectStore[]
    side_effects: []
  - method: GET
    path: "/retail-reset/project-stores/{id}"
    description: "Get a project-store row"
    roles: [ProjectManager, Client, FieldRep]
    code: 200
    input: []
    output: ProjectStore
