# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Chimney Sweep & Fireplace Service — breadth probe over §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ================================================================= Entities
  - section: entities
    instances:
      - name: creation_success_customer
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with all required fields returns 201 and a body carrying the server-minted id plus the submitted name/service_address/phone."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Cora Coal", service_address: "20 Hearth Ln", phone: "555-0200", email: "cora@x.com" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          assert:
            - "http_status == 201"
            - "Customer.${cust_id}.name == Cora Coal"
            - "Customer.${cust_id}.version == 1"

      - name: error_missing_required_field_on_create_customer
        claim_type: Required Fields
        grounds: [entities.Customer.fields.service_address, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /customers omitting service_address is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "No Address", phone: "555-0201" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "http_status == 400"

      - name: error_service_job_not_found_on_get
        claim_type: Not Found
        grounds: [entities.ServiceJob, "errors[ERR_SERVICE_JOB_NOT_FOUND]"]
        distinguishing_aspect: "GET /service-jobs/{id} on a non-existent UUID returns ERR_SERVICE_JOB_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /service-jobs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SERVICE_JOB_NOT_FOUND"
            - "http_status == 404"

      - name: default_liner_type_applied_none
        claim_type: Defaults
        grounds: [entities.Chimney.fields.liner_type]
        distinguishing_aspect: "Creating a chimney without liner_type yields liner_type=NONE and damper_type=THROAT (declared defaults)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Deb Damper", service_address: "21 Hearth Ln", phone: "555-0202" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
          assert:
            - "Chimney.${chim_id}.liner_type == NONE"
            - "Chimney.${chim_id}.damper_type == THROAT"
            - "Chimney.${chim_id}.cap_installed == false"

      - name: computed_sweep_provisional_at_job_creation
        claim_type: Computed Fields
        grounds: [entities.ServiceJob.fields.sweep_provisional_cost_cents, calculations.sweep_service_cost]
        distinguishing_aspect: "A ServiceJob with inspection_level=2, expected_creosote_class=2, trip_zone=A gets sweep_provisional_cost_cents = 24000+6000+0+0 = 30000 and committed_cost_cents = 30000 at creation."
        test_recipe:
          setup: ["A customer and chimney exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ed Ember", service_address: "22 Hearth Ln", phone: "555-0203" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
          trigger:
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 2, expected_creosote_class: 2, trip_zone: "A" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          assert:
            - "ServiceJob.${job_id}.sweep_provisional_cost_cents == 30000"
            - "ServiceJob.${job_id}.committed_cost_cents == 30000"

      - name: error_invalid_inspection_level_enum
        claim_type: Type Constraints
        grounds: [entities.ServiceJob.fields.inspection_level, "errors[ERR_INVALID_INSPECTION_LEVEL]"]
        distinguishing_aspect: "Creating a ServiceJob with inspection_level=4 is rejected with ERR_INVALID_INSPECTION_LEVEL (400)."
        test_recipe:
          setup: ["A customer and chimney exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Fi Flint", service_address: "23 Hearth Ln", phone: "555-0204" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
          trigger:
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 4 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_INSPECTION_LEVEL"
            - "http_status == 400"

      - name: system_fields_input_ignored_on_create_customer
        claim_type: System Fields
        grounds: [entities.Customer.fields.name]
        distinguishing_aspect: "Client-supplied id/version/created_at are ignored: the server mints its own id and sets version=1 regardless of the payload."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Gil Grate", service_address: "24 Hearth Ln", phone: "555-0205", id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.id != 11111111-1111-1111-1111-111111111111"
            - "Customer.${cust_id}.version == 1"

      - name: pagination_service_jobs_list
        claim_type: Listing
        grounds: [entities.ServiceJob, endpoints]
        distinguishing_aspect: "GET /service-jobs?limit=1 over two jobs returns a one-element data array with total_count=2 and has_more=true."
        test_recipe:
          setup: ["Two service jobs for the same customer/chimney."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Hy Hob", service_address: "25 Hearth Ln", phone: "555-0206" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 2 }
              as: Dispatcher
          trigger:
            - call: "GET /service-jobs"
              payload: { customer_id: "${cust_id}", limit: 1, offset: 0 }
              as: Dispatcher
          assert:
            - "response.meta pagination total_count == 2"
            - "response has_more == true"
            - "len(response.data) == 1"

  # ============================================================ State machines
  - section: state_machines
    instances:
      - name: invalid_transition_complete_repair_from_proposed
        claim_type: invalid_transition
        grounds: [state_machines.RepairOrder.IN_PROGRESS_to_COMPLETED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "COMPLETE on a RepairOrder still in PROPOSED is rejected with ERR_INVALID_STATE_TRANSITION (409); no final_cost is set."
        test_recipe:
          setup: ["A RepairOrder in PROPOSED on a job."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ike Iron", service_address: "26 Hearth Ln", phone: "555-0207" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, repair_authorization_cents: 50000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 9000 }
              as: Dispatcher
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "COMPLETE", final_cost_cents: 9000, labor_cents: 5000 }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "RepairOrder.${ro_id}.status == PROPOSED"

      - name: terminal_lockdown_cancel_already_cancelled_job
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceJob.CANCELLED, "errors[ERR_JOB_TERMINAL]"]
        distinguishing_aspect: "A second POST /service-jobs/{id}/cancel on an already CANCELLED job returns ERR_JOB_TERMINAL (409)."
        test_recipe:
          setup: ["A CANCELLED ServiceJob."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Jan Joist", service_address: "27 Hearth Ln", phone: "555-0208" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /service-jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_JOB_TERMINAL"
            - "http_status == 409"

      - name: idempotency_double_approve_repair
        claim_type: idempotency
        grounds: [state_machines.RepairOrder.PROPOSED_to_APPROVED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "APPROVE applied twice fails on the second attempt with ERR_INVALID_STATE_TRANSITION because the order is already APPROVED."
        test_recipe:
          setup: ["An APPROVED RepairOrder."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Kit Kiln", service_address: "28 Hearth Ln", phone: "555-0209" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, repair_authorization_cents: 50000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "DAMPER", part_sku: "DMP-TOP", quoted_cost_cents: 7000 }
              as: Dispatcher
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
          trigger:
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "RepairOrder.${ro_id}.status == APPROVED"

      - name: appointment_no_show_releases_route_minutes
        claim_type: side_effect_execution
        grounds: [state_machines.Appointment.SCHEDULED_to_NO_SHOW, entities.RouteDay.fields.booked_minutes, calculations.routeday_booked_minutes]
        distinguishing_aspect: "Marking a SCHEDULED 90-minute appointment NO_SHOW sets status=NO_SHOW, stores no_show_reason, and releases booked_minutes from 90 back to 0."
        test_recipe:
          setup: ["A RouteDay with one SCHEDULED 90-minute appointment (booked_minutes=90)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Lo Log", service_address: "29 Hearth Ln", phone: "555-0210" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ma Mantle", cert_level: "CSIA_BASIC" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 300 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746351000 }
              as: Dispatcher
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/transitions"
              payload: { action: "NO_SHOW", no_show_reason: "Customer not home" }
              as: Dispatcher
          assert:
            - "Appointment.${appt_id}.status == NO_SHOW"
            - "RouteDay.${rd_id}.booked_minutes == 0"

      - name: warranty_voided_on_job_cancel_fanout
        claim_type: side_effect_execution
        grounds: [state_machines.Warranty.VOIDED, state_machines.ServiceJob.CANCELLED]
        distinguishing_aspect: "Cancelling a job that carries an ISSUED warranty drives that warranty to VOIDED via the cancel fan-out (produces the VOIDED enum value)."
        test_recipe:
          setup: ["A DRAFT ServiceJob (posture SAFE) with a COMPLETED repair and an ISSUED warranty."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ned Nook", service_address: "30 Hearth Ln", phone: "555-0211" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ora Oak", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, repair_authorization_cents: 100000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 3, draft_ok: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 12000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "COMPLETE", final_cost_cents: 12000, labor_cents: 8000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /warranties"
              payload: { repair_order_id: "${ro_id}", service_job_id: "${job_id}", coverage_type: "LABOR_ONLY", term_months: 12 }
              as: BillingClerk
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "Warranty.${w_id}.status == VOIDED"
            - "ServiceJob.${job_id}.job_status == CANCELLED"

      - name: posture_condemned_on_inspect_blocked
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceJob.CONDEMNED, entities.ServiceJob.fields.flue_assessment, calculations.safety_posture_derivation]
        distinguishing_aspect: "POST /service-jobs/{id}/inspect with flue_assessment=BLOCKED sets flue_assessment=BLOCKED and drives safety_posture to the terminal CONDEMNED."
        test_recipe:
          setup: ["A fresh ServiceJob with posture PENDING."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Pia Pyre", service_address: "31 Hearth Ln", phone: "555-0212" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Quy Quartz", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 3 }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job_id}/inspect"
              payload: { flue_assessment: "BLOCKED" }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "ServiceJob.${job_id}.flue_assessment == BLOCKED"
            - "ServiceJob.${job_id}.safety_posture == CONDEMNED"

  # =============================================================== Calculations
  - section: calculations
    instances:
      - name: committed_cost_after_repair_reject
        claim_type: correct_result
        grounds: [calculations.committed_cost, state_machines.RepairOrder.PROPOSED_to_REJECTED, entities.ServiceJob.fields.committed_cost_cents]
        distinguishing_aspect: "REJECT (not CANCEL) also drops an order from committed_cost: sweep_provisional 15000 + surviving 8000 leaves committed_cost_cents=23000 after a 12000 order is REJECTED."
        test_recipe:
          setup: ["A ServiceJob (sweep_provisional 15000) with an 8000 and a 12000 RepairOrder, committed=35000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Rex Reed", service_address: "32 Hearth Ln", phone: "555-0213" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, trip_zone: "A", repair_authorization_cents: 100000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "DAMPER", part_sku: "DMP-THR", quoted_cost_cents: 8000 }
              as: Dispatcher
              captures: { ro_keep_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 12000 }
              as: Dispatcher
              captures: { ro_reject_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_reject_id}/transitions"
              payload: { action: "REJECT" }
              as: Dispatcher
          assert:
            - "ServiceJob.${job_id}.committed_cost_cents == 23000"
            - "RepairOrder.${ro_reject_id}.status == REJECTED"

      - name: reminder_recurrence_on_acknowledge
        claim_type: correct_result
        grounds: [calculations.reminder_next_due, state_machines.ReminderSchedule.ACTIVE_to_ACTIVE, entities.ReminderSchedule.fields.acknowledged_count]
        distinguishing_aspect: "Acknowledging a due reminder increments acknowledged_count to 1, keeps status ACTIVE, and advances next_due_date by cadence_months (recurrence self-loop)."
        test_recipe:
          setup: ["Clock 2026-05-01 (default). A reminder cadence 12 (next_due 2027-05-01). Clock advanced to 2027-06-01 so is_due is true."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Sy Slate", service_address: "33 Hearth Ln", phone: "555-0214" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id, chim_v: $.data.version }
            - call: "POST /reminder-schedules"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", cadence_months: 12, expected_chimney_version: "${chim_v}" }
              as: Dispatcher
              captures: { rem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /reminder-schedules/${rem_id}/acknowledge"
              payload: {}
              as: Dispatcher
          assert:
            - "ReminderSchedule.${rem_id}.acknowledged_count == 1"
            - "ReminderSchedule.${rem_id}.status == ACTIVE"

  # =============================================================== Validations
  - section: validations
    instances:
      - name: error_missing_auth_headers_on_create_customer
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_HEADERS]"]
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers is rejected with ERR_MISSING_AUTH_HEADERS (400) before any other check."
        test_recipe:
          setup: ["Empty DB; request sent without auth headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "No Auth", service_address: "34 Hearth Ln", phone: "555-0215" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MISSING_AUTH_HEADERS"
            - "http_status == 400"

