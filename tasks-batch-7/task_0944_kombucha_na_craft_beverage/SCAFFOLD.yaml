# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, empty, or naming a role that is not one of the seven declared in §1.7" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not listed in the endpoint's roles, or a Subscriber is acting on a subscription whose id is not its X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting user is the same person who performed the conflicting earlier step: approving a label they submitted, releasing a lot from a run they created, or signing off a batch whose last flagged reading they recorded" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing or mistyped required field, undeclared enum member, out-of-range pagination, non-positive quantity, clock moving backwards, reading_at outside [batch.pitched_at, clock], duplicate subscriber email or cycle index, cross-entity id mismatch, ingredient quantity above availability, growler volume outside its band, or a payment amount that does not equal subtotal + late_fee" }
  - { id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http: 404, condition: "A referenced Recipe, LabelApproval, ScobyCulture, Vessel, IngredientLot, Batch or BatchIngredientUse does not exist" }
  - { id: ERR_PACKAGING_RESOURCE_NOT_FOUND, http: 404, condition: "A referenced PackagingRun, FinishedLot or Keg does not exist" }
  - { id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND, http: 404, condition: "A referenced Account, Shipment, ShipmentLine, Subscription, SubscriptionAllocation, TaproomFill or RecallNotice does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target entity is not in a state from which the requested transition is declared in §1.2 — including an account that is ONBOARDING or CREDIT_HOLD at shipment confirm, a lot that is not RELEASED when drawn on, and a keg that is not ON_TAP when a fill is opened" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_batch_version or expected_finished_lot_version does not equal the parent entity's current version" }
  - { id: ERR_SCOBY_GENERATION_CAP, http: 422, condition: "A daughter culture would exceed SCOBY_GENERATION_CAP (7), or a culture already at generation 7 is pitched without a reverification inside SCOBY_REVERIFICATION_VALID_DAYS (30)" }
  - { id: ERR_SCOBY_VITALITY_TOO_LOW, http: 422, condition: "The culture's vitality_score is strictly below SCOBY_VITALITY_FLOOR (40) at pitch time" }
  - { id: ERR_VESSEL_UNAVAILABLE, http: 409, condition: "The vessel is not in the state the action requires, or the requested half-open occupancy interval intersects the vessel's retained occupancy interval" }
  - { id: ERR_VESSEL_CIP_EXPIRED, http: 422, condition: "The logical clock is strictly after vessel.cip_completed_at + VESSEL_CIP_VALID_HOURS (72 h)" }
  - { id: ERR_VESSEL_CAPACITY_EXCEEDED, http: 422, condition: "pitched_liters is strictly greater than capacity_liters * (100 - VESSEL_HEADSPACE_PCT) / 100" }
  - { id: ERR_INGREDIENT_EXPIRED, http: 422, condition: "The ingredient lot's expiry_date is not strictly after the logical clock + INGREDIENT_EXPIRY_BUFFER_DAYS (7), or the lot is already in status EXPIRED" }
  - { id: ERR_PH_WINDOW_MISSED, http: 422, condition: "The effective pH ceiling was not reached with a day_index inside the inclusive window 5..14, or F2 ran past F2_MAX_DAYS (7) whole days before being closed" }
  - { id: ERR_LABEL_STALE, http: 409, condition: "The packaging run's label approval is STALE, or its approved_recipe_version_number no longer equals the recipe's recipe_version_number" }
  - { id: ERR_LABEL_CLASS_MISMATCH, http: 422, condition: "A label revision's abv_class, pasteurization statement or required element set does not match what the recipe or the run demands, or the lot's measured abv_class differs from the approved label's abv_class" }
  - { id: ERR_ABV_CLASS_DIVERGENCE, http: 422, condition: "The lot's measured ABV exceeds the maximum projected ABV over the source batches by strictly more than ABV_DIVERGENCE_TOLERANCE_PCT (0.05)" }
  - { id: ERR_BLEND_RULE_VIOLATION, http: 422, condition: "A run already has BLEND_MAX_SOURCE_BATCHES (4) draws, a draw is below BLEND_MIN_DRAW_LITERS (20.0), or a run with zero source draws is started" }
  - { id: ERR_INSUFFICIENT_BATCH_VOLUME, http: 422, condition: "liters_drawn is strictly greater than the batch's remaining_liters" }
  - { id: ERR_LOT_HOLD_PERIOD, http: 422, condition: "Release attempted strictly before packaged_at + LOT_RELEASE_MIN_HOLD_HOURS (48 h)" }
  - { id: ERR_QUARANTINE_CLEARANCE_CAP, http: 422, condition: "The lot's quarantine_clearance_count already equals LOT_QUARANTINE_CLEARANCE_CAP (1); a second clearance is refused and the only remaining exit is a recall" }
  - { id: ERR_INSUFFICIENT_LOT_UNITS, http: 422, condition: "on_hand_units minus reserved_units is strictly less than the units requested by a shipment line or a subscription box" }
  - { id: ERR_SHELF_LIFE_TOO_SHORT, http: 422, condition: "The lot's best_by_date is not strictly after the logical clock + MIN_REMAINING_SHELF_DAYS (14), so it may not back a subscription box" }
  - { id: ERR_KEG_RETAP_BUFFER, http: 422, condition: "A keg is re-tapped at or before last_untapped_at + KEG_RETAP_BUFFER_MINUTES (15 min)" }
  - { id: ERR_INSUFFICIENT_KEG_VOLUME, http: 422, condition: "requested_liters is strictly greater than the keg's remaining_liters" }
  - { id: ERR_GROWLER_INSPECTION_REQUIRED, http: 422, condition: "A CUSTOMER_GROWLER fill is poured while still in fill_status REQUESTED, or its inspection is older than GROWLER_INSPECTION_VALID_HOURS (24 h)" }
  - { id: ERR_AGE_VERIFICATION_REQUIRED, http: 403, condition: "An ALCOHOLIC lot is poured or allocated without a birth date, or to a person below AGE_VERIFICATION_MIN_AGE_YEARS (21) at the logical clock" }
  - { id: ERR_ALCOHOLIC_CHANNEL_RESTRICTED, http: 422, condition: "An ALCOHOLIC lot is shipped to, or a keg of one issued to, an account whose alcoholic_license_on_file is false" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Credit exposure computed by calculations.account_credit_exposure is strictly greater than account.credit_limit" }
  - { id: ERR_SELF_DIST_CEILING_EXCEEDED, http: 422, condition: "ytd_self_dist_liters plus this shipment's total_liters is strictly greater than SELF_DIST_ANNUAL_LITER_CEILING (4000.0) for a SELF_DISTRIBUTION account" }
  - { id: ERR_SUBSCRIPTION_SKIP_CAP, http: 422, condition: "skips_used_this_year already equals SUBSCRIPTION_SKIP_CAP_PER_YEAR (3), or an allocation for the current cycle is still ALLOCATED" }
  - { id: ERR_PAUSE_WINDOW_CONFLICT, http: 409, condition: "The requested closed pause interval intersects an interval already in pause_windows (touching endpoints count), or spans strictly more than SUBSCRIPTION_PAUSE_MAX_DAYS (60) days" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProductionOperator
    description: "Runs the brewhouse: recipes, cultures, vessels, ingredient lots, batches, the QA log, and packaging runs."
    identity: opaque
    exclusive_operations:
      - "POST /batches"
      - "POST /batches/{id}/advance-to-f2"
      - "POST /batches/{id}/complete-f2"
      - "POST /batches/{id}/dump"
      - "POST /batches/{id}/ingredient-uses"
      - "POST /batch-ingredient-uses/{id}/void"
      - "POST /vessels/{id}/cip-start"
      - "POST /vessels/{id}/cip-complete"
      - "POST /packaging-runs"
      - "POST /packaging-runs/{id}/sources"
      - "POST /packaging-runs/{id}/start"
      - "POST /packaging-runs/{id}/complete"
      - "POST /packaging-runs/{id}/abort"
      - "POST /kegs"
      - "POST /kegs/{id}/fill"
    shared_operations:
      - "POST /recipes and POST /recipes/{id}/revise (with PlatformAdmin)"
      - "POST /scoby-cultures and POST /scoby-cultures/{id}/retire (with PlatformAdmin)"
      - "POST /ingredient-lots and POST /vessels (with PlatformAdmin)"
      - "POST /batches/{id}/qa-readings (with QaManager)"
      - "all production and packaging GET endpoints"

  - name: QaManager
    description: "Owns quality dispositions: culture reverification, corrective batch sign-off, and finished-lot release."
    identity: opaque
    exclusive_operations:
      - "POST /scoby-cultures/{id}/reverify"
      - "POST /scoby-cultures/{id}/reverify-result"
      - "POST /batches/{id}/qa-signoff"
      - "POST /finished-lots/{id}/release"
    shared_operations:
      - "POST /batches/{id}/qa-readings (with ProductionOperator)"
      - "POST /finished-lots/{id}/quarantine (with ComplianceOfficer)"
      - "all production and packaging GET endpoints"
    segregation_notes: "A QaManager may not release a lot from a packaging run they created as a ProductionOperator (the check compares X-User-ID, not role), and may not sign off a batch whose last flagged reading carries their own X-User-ID."

  - name: ComplianceOfficer
    description: "Owns labelling and the recall surface: label revisions, ingredient and finished-lot quarantine, and recalls."
    identity: opaque
    exclusive_operations:
      - "POST /label-approvals"
      - "POST /label-approvals/{id}/submit"
      - "POST /label-approvals/{id}/approve"
      - "POST /ingredient-lots/{id}/quarantine"
      - "POST /ingredient-lots/{id}/clear-quarantine"
      - "POST /finished-lots/{id}/clear-quarantine"
      - "POST /finished-lots/{id}/recall"
    shared_operations:
      - "POST /finished-lots/{id}/quarantine (with QaManager)"
      - "all production, packaging and commercial GET endpoints"
    segregation_notes: "The same X-User-ID may not both submit and approve one label revision."

  - name: SalesRep
    description: "Owns the trade side: accounts, shipments, keg deposits, payments, and recall acknowledgements."
    identity: opaque
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/activate"
      - "POST /accounts/{id}/credit-hold"
      - "POST /accounts/{id}/payments"
      - "POST /shipments"
      - "POST /shipments/{id}/lines"
      - "POST /shipments/{id}/confirm"
      - "POST /shipments/{id}/deliver"
      - "POST /shipments/{id}/cancel"
      - "POST /kegs/{id}/issue"
      - "POST /kegs/{id}/return"
      - "POST /recall-notices/{id}/acknowledge"
    shared_operations:
      - "commercial, keg and finished-lot GET endpoints"

  - name: TaproomStaff
    description: "Runs the taproom: tapping kegs, growler inspections, pours and fills."
    identity: opaque
    exclusive_operations:
      - "POST /kegs/{id}/tap"
      - "POST /kegs/{id}/untap"
      - "POST /taproom-fills"
      - "POST /taproom-fills/{id}/inspect"
      - "POST /taproom-fills/{id}/pour"
    shared_operations:
      - "GET /kegs, GET /kegs/{id}, GET /kegs/{id}/fills, GET /finished-lots and GET /finished-lots/{id}"

  - name: Subscriber
    description: "A subscription holder acting on their own subscription only."
    identity: "entity_backed:Subscription"
    exclusive_operations:
      - "POST /subscriptions/{id}/pause"
      - "POST /subscriptions/{id}/resume"
      - "POST /subscriptions/{id}/skip"
      - "POST /subscriptions/{id}/cancel"
    shared_operations:
      - "GET /subscriptions/{id} and GET /subscriptions/{id}/allocations for their own subscription"
    note: "X-User-ID equals the Subscription.id the caller owns; the server compares it to the target subscription's id, or to the target allocation's subscription_id."

  - name: PlatformAdmin
    description: "Operator superset: may perform every business operation, plus subscription creation, allocation and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /subscriptions"
      - "POST /subscription-allocations"
      - "POST /subscription-allocations/{id}/ship"
    shared_operations:
      - "every other POST and GET endpoint in §1.5"
    note: "PlatformAdmin is a hierarchical override for role checks only. It does NOT bypass the three segregation-of-duties rules, which compare X-User-ID values and fire regardless of role."
