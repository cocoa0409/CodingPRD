            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech, captures: { st: $.data.status } }
          assert:
            - "pre-confirm create fails with error_id == ERR_PRESCRIPTION_NOT_VERIFIED"
            - "post-confirm create succeeds and allocate reaches ALLOCATED (gate tracks Prescription.status)"

      - name: claim_pay_requires_policy_active
        grounds:
          - state_machines.InsuranceClaim.APPROVED_to_PAID
          - validations[priority=10]
          - errors[ERR_POLICY_NOT_ACTIVE]
