              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { c10: "$.data.id" }
            - call: POST /construction-projects
              payload: { case_id: "${c10}", scope_code: "INTERIOR_REPAIR", required_trade_hours: { FRAMING: 300, ROOFING: 150, GENERAL_LABOR: 300 }, estimated_material_cents: 900000, critical_trades: ["FRAMING"] }
              as: ConstructionManager
