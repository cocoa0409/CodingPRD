            - { call: "POST /api/residents", payload: { full_name: "R2", email: "bp2-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "bp2-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R4", email: "bp2-r4@x.com", street_segment_id: "${seg}", household_ref: "H4" }, as: CityAdmin, captures: { r4: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R5", email: "bp2-r5@x.com", street_segment_id: "${seg}", household_ref: "H5" }, as: CityAdmin, captures: { r5: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm Ivy Rd", requested_budget_cents: 10000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
