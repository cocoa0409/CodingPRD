              as_user_id: "uwm-001"
            - call: "POST /epli/policies"
              payload: { exposure_assessment_id: "${asm_id}", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2027-08-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "HARASSMENT", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-02T00:00:00.000Z", alleged_damages_cents: 6000000 }
              as: ClaimsAdjuster
