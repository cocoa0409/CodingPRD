              as: Student
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RECIPIENT_INACTIVE"

      - name: scheduled_action_clock_drives_consent_expiry
        claim_type: scheduled_actions
        grounds: [state_machines.ConsentGrant.ACTIVE_to_EXPIRED, "endpoints[POST /registrar/_clock/set_current_utc]"]
        distinguishing_aspect: "Advancing the logical clock past a ConsentGrant's expires_at fires the system transition ACTIVE -> EXPIRED."
        test_recipe:
          setup: ["ConsentGrant cg ACTIVE, expires 2026-08-15"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC006201", full_name: "Sched T", date_of_birth: "2000-01-01", email: "sch@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/consent-grants"
              payload: { student_id: "${sid}", grantee_name: "Emp", scope: "DEGREE_ONLY", expires_at: "2026-08-15T00:00:00Z" }
              as: Student
              as_user_id: "${sid}"
              captures: { gid: $.data.id }
          trigger:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: RegistrarAdmin
