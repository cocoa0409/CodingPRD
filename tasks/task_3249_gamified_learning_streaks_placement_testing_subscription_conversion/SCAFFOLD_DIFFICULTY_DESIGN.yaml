  - rule_id: priority_pair_validation_conflict
    instances:
      - name: locked_node_outranks_unknown_payload_field
        grounds:
          - validations[priority=8]
          - validations[priority=28]
          - state_machines.LessonNode.transitions.LOCKED_to_UNLOCKED
        distinguishing_aspect: |
          The pair is state versus business_constraint, and the state row wins: a practice attempt
          naming a LOCKED node while also carrying an undeclared heal_flag field returns ERR_NODE_LOCKED
          rather than ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Ada holds a two-node unit whose second node is still LOCKED behind its prerequisite"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
          trigger:
            - call: "POST /lesson-nodes/${n12}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T10:00:00Z", response_ms: 9000, correct: true, heal_flag: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { err: $.data.error_id }
          assert:
            - "the practice response error_id == \"ERR_NODE_LOCKED\""
            - "the practice response http status is 409, so the state row at priority 8 wins over the business_constraint row at priority 28"
            - "LessonNode.${n12}.state == \"LOCKED\" and no PracticeAttempt row was recorded"
      - name: missing_learner_outranks_locked_node
        grounds:
          - validations[priority=3]
          - validations[priority=8]
          - errors[ERR_LEARNER_NOT_FOUND]
        distinguishing_aspect: |
          The pair is existence versus state, so the earlier-priority existence row wins: the same
          LOCKED-node practice attempt returns ERR_LEARNER_NOT_FOUND when the acting learner id does
          not resolve, instead of the state error.
        test_recipe:
          setup:
            - "Ada holds a two-node unit whose second node is still LOCKED behind its prerequisite"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
          trigger:
            - call: "POST /lesson-nodes/${n12}/practice"
              payload: { learner_id: "00000000-0000-0000-0000-000000000000", recorded_at: "2026-09-01T10:00:00Z", response_ms: 3000, correct: true }
              as: Learner
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "the practice response error_id == \"ERR_LEARNER_NOT_FOUND\""
            - "the practice response http status is 404, so the existence row at priority 3 wins over the state row at priority 8"
            - "LessonNode.${n12}.state == \"LOCKED\""

  - rule_id: boundary_precision_check
    instances:
      - name: free_heart_allowance_exact_boundary
        grounds:
          - calculations.ComputeHeartAndEnergyLimits
          - validations[priority=21]
          - entities.PracticeAttempt.fields.outcome
        distinguishing_aspect: |
          The heart boundary is inclusive at one: with four failed attempts banked, the fifth attempt
          is accepted because hearts_available equals 1, while the sixth is rejected because the
          computed allowance has reached exactly 0.
        test_recipe:
          setup:
            - "Ada is a FREE learner with a ten-unit energy balance and no attempts yet today"
            - "Ada holds one UNLOCKED lesson node in a unit she is practicing"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T01:00:00Z", response_ms: 9000, correct: false }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T02:00:00Z", response_ms: 9000, correct: false }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T03:00:00Z", response_ms: 9000, correct: false }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T04:00:00Z", response_ms: 9000, correct: false }
              as: Learner
              as_user_id: "${ada}"
          trigger:
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T05:00:00Z", response_ms: 9000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { fifth_outcome: $.data.outcome, fifth_id: $.data.id }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T06:00:00Z", response_ms: 9000, correct: false }
              as: Learner
              as_user_id: "${ada}"
              captures: { sixth_outcome: $.data.outcome }
          assert:
            - "PracticeAttempt.${fifth_id}.outcome == ${fifth_outcome}"
            - "PracticeAttempt.${fifth_id}.outcome == \"ACCEPTED\""
            - "the sixth attempt outcome is \"REJECTED_LIMIT\", so the boundary rejects at exactly zero rather than below zero"
            - "Learner.${ada}.hearts_available == 0"
      - name: family_seat_quota_exact_boundary
        grounds:
          - calculations.ComputeNotificationCadence
          - validations[priority=24]
          - entities.Subscription.fields.seats_used
        distinguishing_aspect: |
          The seat boundary is exclusive at capacity: a single-seat family plan accepts the first seat
          because seats_used 0 is below seats_total 1, and rejects the next with ERR_SEAT_QUOTA_EXCEEDED
          once seats_used equals seats_total.
        test_recipe:
          setup:
            - "Ada owns an ACTIVE PLUS_FAMILY subscription with exactly one seat"
            - "Bea and Cal are FREE learners with no seats"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /learners"
              payload: { display_name: "Bea", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { bea: $.data.id }
            - call: "POST /learners"
              payload: { display_name: "Cal", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { cal: $.data.id }
            - call: "POST /subscriptions"
              payload: { learner_id: "${ada}", plan_code: "PLUS_FAMILY", seats_total: 1, auto_renew: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { sub: $.data.id, sub_v: $.data.version }
            - call: "PUT /subscriptions/${sub}"
              payload: { expected_subscription_version: "${sub_v}", add_seat_learner_id: "${bea}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { sub_v2: $.data.version, seat: $.data.id }
          trigger:
            - call: "PUT /subscriptions/${sub}"
              payload: { expected_subscription_version: "${sub_v2}", add_seat_learner_id: "${cal}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { err: $.data.error_id }
          assert:
            - "the seat response error_id == \"ERR_SEAT_QUOTA_EXCEEDED\""
            - "Subscription.${sub}.seats_used == 1"
            - "Subscription.${sub}.seats_used == Subscription.${sub}.seats_total, so the boundary rejects at equality"
            - "Learner.${cal}.hearts_available == 5"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: placement_calibrate_requires_scored_session
        grounds:
          - state_machines.PlacementTest.transitions.SCORED_to_CALIBRATED
          - validations[priority=12]
          - entities.PlacementTest.fields.status
        distinguishing_aspect: |
          The transition from SCORED to CALIBRATED depends on the PlacementTest's own status, which is
          NOT_ACTIVE at CREATED, so calibrating a freshly opened session is refused with
          ERR_PLACEMENT_NOT_ACTIVE even though the acting learner owns the session and the course anchor exists.
        test_recipe:
          setup:
            - "Ada is a FREE learner with an unused placement probe and a course unit in the tree"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id, ada_v: $.data.version }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /placement-tests"
              payload: { learner_id: "${ada}", course_id: "${unit1}", administered_at: "2026-09-01T02:00:00Z", total_items: 10, expected_learner_version: "${ada_v}" }
