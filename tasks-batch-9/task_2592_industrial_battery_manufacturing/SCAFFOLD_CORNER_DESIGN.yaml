  - section: calculations
    instances:

      - name: warranty_settlement_gate_ladder_decides_four_units_in_pinned_order
        claim_type: Correct Result
        grounds:
          - calculations.warranty_settlement
          - calculations.watering_compliance_ratio
          - endpoints[POST /battery-units/{id}/warranty-adjudication].side_effects
          - state_machines.BatteryUnit.warranty_status
        distinguishing_aspect: "Four units share one lot, one design and one clock and differ only in cycle reports and watering logs: unit A settles PRORATED at exactly 270000 cents (500000 * (1 - 0.4000) * 0.90), unit B DENIED_MAINTENANCE at 0.2500 compliance, unit C DENIED_USAGE at usage_fraction 1.0000 despite the same bad compliance, and unit D DENIED_NO_DEFECT because the no-defect gate outranks the maintenance gate."
        test_recipe:
          setup:
            - "Lot LOT-W (quantity 9, LEAD_ACID CD-LEAD-465: 1500 rated cycles, 60 warranty months, list price 500000) released on 2026-09-01 after a 3-sample plan; four units BU-W-001..004 shipped 2026-09-01; clock advanced to 2027-04-29 (240 days = 8 service months, so watering_events_expected == 8)."
            - "Unit A: 7 WATERING rows with electrolyte_level_ok true, 1 WATERING row with electrolyte_level_ok false (ignored) and one CYCLE_REPORT of 600 cycles -> compliance 0.8750, usage_fraction 0.4000."
            - "Unit B: 2 WATERING rows true, no cycle report -> compliance 0.2500, usage_fraction 0.1333."
            - "Unit C: no watering rows and one CYCLE_REPORT of 1500 cycles -> compliance 0.0000, usage_fraction 1.0000."
            - "Unit D: 2 WATERING rows true, no cycle report -> compliance 0.2500, usage_fraction 0.1333; adjudicated with inspection_finding NO_DEFECT_FOUND."
            - "All four units carry an open claim (warranty_status CLAIM_OPEN) at trigger time."
