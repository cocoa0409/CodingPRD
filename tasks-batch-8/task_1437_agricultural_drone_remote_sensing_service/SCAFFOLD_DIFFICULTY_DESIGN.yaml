            - "Explanation: revoking Auth cascades M (PLANNED) -> CANCELLED, so authorize may fail at the state check; if the cascade is bypassed, the safety check on Auth.status blocks it. Either way, M does not reach AUTHORIZED."

      - name: spray_mission_authorize_depends_on_pilot_applicator_license
