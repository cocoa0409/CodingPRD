          setup:
            - "Facility SB-11 and Vendor DERMA exist; rep Yuki Tanaka holds all four required credentials VERIFIED at the 2026-08-01T00:00:00Z default clock."
            - "IMMUNIZATION_INFLUENZA expires at exactly 2026-09-01T00:00:00Z."
            - "TRAINING_BLOODBORNE_PATHOGENS expires at 2026-09-01T00:00:01Z — one second later."
            - "BACKGROUND_CHECK and COI_GIFT_ATTESTATION expire 2027-07-01T00:00:00Z, far outside the 14-day warning window."
            - "The clock is moved to exactly 2026-09-01T00:00:00Z before the sweep."
