# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Homeschool Umbrella School & Portfolio Review
# 9 rules x 2 instances = 18 instances. Every chain replays from empty DB.
# Canonical fixture values used throughout:
#   year: start 2026-08-01, end 2027-05-31, NOI deadline 2026-09-15,
#         portfolio due 2027-04-30, report due 2027-06-15, mid-year 2027-01-15
#   clock default: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: attendance_provisional_vs_certified_progress
        grounds:
          - calculations.instructional_progress
          - entities.Enrollment.fields.provisional_days_counted
          - entities.Enrollment.fields.provisional_minutes_credited
          - entities.Enrollment.fields.certified_days_counted
          - entities.Enrollment.fields.certified_minutes_credited
        distinguishing_aspect: |
          Two variants of instructional_progress over the SAME AttendanceEntry rows
          diverge by exact integer amounts: provisional counts RECORDED+VERIFIED
          (3 days / 1140 minutes) while certified counts VERIFIED only
          (2 days / 900 minutes); entity domain = Enrollment attendance.
        test_recipe:
          setup:
            - "Academic year OPEN (2026-08-01..2027-05-31); family F with one grade-4 student; enrollment E ACTIVE"
            - "Logical clock at 2026-09-04T00:00:00Z so September dates are not in the future"
            - "Attendance: 2026-09-01 300 min VERIFIED; 2026-09-02 240 min RECORDED (unverified); 2026-09-03 700 min VERIFIED (capped at 600)"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Family Att", district_code: "D-01" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Att", date_of_birth: "2017-03-03" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-01" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: AcademicDirector }
            - { call: "POST /enrollments/${enr}/attendance-entries", payload: { entry_date: "2026-09-01", minutes: 300 }, as: Parent, as_user_id: "${fam}", captures: { a1: $.data.id } }
            - { call: "POST /enrollments/${enr}/attendance-entries", payload: { entry_date: "2026-09-02", minutes: 240 }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /enrollments/${enr}/attendance-entries", payload: { entry_date: "2026-09-03", minutes: 700 }, as: Parent, as_user_id: "${fam}", captures: { a3: $.data.id } }
            - { call: "POST /attendance-entries/${a1}/verify", payload: {}, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /attendance-entries/${a3}/verify", payload: {}, as: Reviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "GET /enrollments/${enr}", payload: {}, as: Registrar, captures: { prov_d: $.data.provisional_days_counted, prov_m: $.data.provisional_minutes_credited, cert_d: $.data.certified_days_counted, cert_m: $.data.certified_minutes_credited } }
          assert:
            - "Enrollment.${enr}.provisional_days_counted == 3"
            - "Enrollment.${enr}.provisional_minutes_credited == 1140   # 300 + 240 + min(700,600)"
            - "Enrollment.${enr}.certified_days_counted == 2"
            - "Enrollment.${enr}.certified_minutes_credited == 900    # 300 + 600; unverified 240-min day excluded"
            - "provisional_minutes_credited != certified_minutes_credited for identical raw rows"

      - name: graduation_official_vs_projected_credit_audit
        grounds:
          - calculations.graduation_credit_audit
          - calculations.gpa_official
          - entities.CourseCredit.fields.status
          - entities.CourseCredit.fields.credit_value
        distinguishing_aspect: |
          Two audit variants over the SAME CourseCredit rows: official counts POSTED
          only (1.0 credits) while projected also counts VERIFIED and COMPLETED
          (2.5 credits); entity domain = Student transcript / credit audit, distinct
          from the attendance domain of the other instance.
        test_recipe:
          setup:
            - "Year OPEN; family F; grade-12 student; enrollment ACTIVE"
            - "Credits: ENG 120h grade A POSTED (1.0); MATH 120h grade B VERIFIED not posted (1.0); SCI 60h grade A COMPLETED not verified (0.5); ELEC PLANNED only (excluded from both)"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Family Cred", district_code: "D-02" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Senior Cred", date_of_birth: "2008-05-05" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 12 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-02" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "ENGLISH", course_title: "English 12", planned_hours: 120 }, as: Parent, as_user_id: "${fam}", captures: { c1: $.data.id } }
            - { call: "POST /course-credits/${c1}/complete", payload: { completed_hours: 120, letter_grade: "A" }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /course-credits/${c1}/verify", payload: { decision: "APPROVE" }, as: Registrar }
            - { call: "POST /course-credits/${c1}/post", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "MATH", course_title: "Algebra II", planned_hours: 120 }, as: Parent, as_user_id: "${fam}", captures: { c2: $.data.id } }
            - { call: "POST /course-credits/${c2}/complete", payload: { completed_hours: 120, letter_grade: "B" }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /course-credits/${c2}/verify", payload: { decision: "APPROVE" }, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "SCIENCE", course_title: "Biology", planned_hours: 60, is_lab: true }, as: Parent, as_user_id: "${fam}", captures: { c3: $.data.id } }
            - { call: "POST /course-credits/${c3}/complete", payload: { completed_hours: 60, letter_grade: "A" }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "ELECTIVE", course_title: "Robotics", planned_hours: 120 }, as: Parent, as_user_id: "${fam}" }
          trigger:
            - { call: "GET /students/${stu}/transcript", payload: {}, as: Registrar, captures: { off: $.data.official_credits_total, proj: $.data.projected_credits_total, gpa: $.data.gpa_official } }
          assert:
            - "transcript official_credits_total == 1.0   (POSTED only)"
            - "transcript projected_credits_total == 2.5   (POSTED 1.0 + VERIFIED 1.0 + COMPLETED 0.5; PLANNED excluded)"
            - "transcript gpa_official == 4.0              (single POSTED A on 1.0 credit)"
            - "official_credits_total != projected_credits_total for identical CourseCredit rows"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: coop_fee_per_line_rounding_vs_sum_rounding
        grounds:
          - calculations.coop_fee_calculation
          - entities.CoopEnrollment.fields.fee_cents
          - entities.CoopEnrollment.fields.discount_pct_applied
          - entities.Family.fields.fee_balance_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-enrollment-line rounding
          (round_half_up each discounted base, then sum). Three siblings at
          base 9999 with discounts 10%/25%/25% produce lines 8999/7499/7499 and a
          family ledger of 23997; the forbidden sum-then-round order would give
          23998. The one-cent delta is the assertion.
        test_recipe:
          setup:
            - "Year OPEN; one family with three students in grades 2/3/4, all enrollments ACTIVE"
            - "One co-op class: capacity 10, fee_base_cents 9999, materials_fee_cents 0, start_date 2026-09-10 (registration at 2026-08-01 qualifies for the 10% early-bird, being <= start-30d=2026-08-11), MON 09:00-11:00, grades 0-12"
            - "Clock stays at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Family Round", district_code: "D-03" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Two", date_of_birth: "2018-01-01" }, as: Parent, as_user_id: "${fam}", captures: { stu2: $.data.id } }
            - { call: "POST /students/${stu2}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 2 }, as: Parent, as_user_id: "${fam}", captures: { enr2: $.data.id } }
            - { call: "POST /enrollments/${enr2}/notices", payload: { district_code: "D-03" }, as: Parent, as_user_id: "${fam}", captures: { noi2: $.data.id } }
            - { call: "POST /notices/${noi2}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi2}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr2}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln2: $.data.id } }
            - { call: "POST /curriculum-plans/${pln2}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln2}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr2}/activate", payload: {}, as: Registrar }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Three", date_of_birth: "2016-06-06" }, as: Parent, as_user_id: "${fam}", captures: { stu3: $.data.id } }
            - { call: "POST /students/${stu3}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 3 }, as: Parent, as_user_id: "${fam}", captures: { enr3: $.data.id } }
            - { call: "POST /enrollments/${enr3}/notices", payload: { district_code: "D-03" }, as: Parent, as_user_id: "${fam}", captures: { noi3: $.data.id } }
            - { call: "POST /notices/${noi3}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi3}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr3}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln3: $.data.id } }
            - { call: "POST /curriculum-plans/${pln3}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln3}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr3}/activate", payload: {}, as: Registrar }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Four", date_of_birth: "2014-04-04" }, as: Parent, as_user_id: "${fam}", captures: { stu4: $.data.id } }
            - { call: "POST /students/${stu4}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr4: $.data.id } }
            - { call: "POST /enrollments/${enr4}/notices", payload: { district_code: "D-03" }, as: Parent, as_user_id: "${fam}", captures: { noi4: $.data.id } }
            - { call: "POST /notices/${noi4}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi4}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr4}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln4: $.data.id } }
            - { call: "POST /curriculum-plans/${pln4}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln4}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr4}/activate", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "Art Studio", subject: "Art", grade_min: 0, grade_max: 12, meeting_day: "MON", meeting_start_minutes: 540, meeting_end_minutes: 660, start_date: "2026-09-10", end_date: "2026-12-15", capacity: 10, fee_base_cents: 9999, materials_fee_cents: 0 }, as: Registrar, captures: { cls: $.data.id } }
            - { call: "POST /coop-classes/${cls}/open", payload: {}, as: Registrar }
          trigger:
            - { call: "GET /coop-classes/${cls}", payload: {}, as: Registrar, captures: { cv1: $.data.version } }
            - { call: "POST /coop-classes/${cls}/enrollments", payload: { enrollment_id: "${enr2}", expected_coop_class_version: "${cv1}" }, as: Parent, as_user_id: "${fam}", captures: { ce1: $.data.id, fee1: $.data.fee_cents, disc1: $.data.discount_pct_applied } }
            - { call: "GET /coop-classes/${cls}", payload: {}, as: Registrar, captures: { cv2: $.data.version } }
            - { call: "POST /coop-classes/${cls}/enrollments", payload: { enrollment_id: "${enr3}", expected_coop_class_version: "${cv2}" }, as: Parent, as_user_id: "${fam}", captures: { ce2: $.data.id, fee2: $.data.fee_cents, disc2: $.data.discount_pct_applied } }
            - { call: "GET /coop-classes/${cls}", payload: {}, as: Registrar, captures: { cv3: $.data.version } }
            - { call: "POST /coop-classes/${cls}/enrollments", payload: { enrollment_id: "${enr4}", expected_coop_class_version: "${cv3}" }, as: Parent, as_user_id: "${fam}", captures: { ce3: $.data.id, fee3: $.data.fee_cents, disc3: $.data.discount_pct_applied } }
            - { call: "GET /families/${fam}/ledger", payload: {}, as: Registrar, captures: { bal: $.data.fee_balance_cents } }
          assert:
            - "CoopEnrollment.${ce1}.fee_cents == 8999    (early-bird 10%: round_half_up(9999*0.90)=8999; no sibling yet)"
            - "CoopEnrollment.${ce1}.discount_pct_applied == 10"
            - "CoopEnrollment.${ce2}.fee_cents == 7499    (10+15=25%: round_half_up(9999*0.75)=7499)"
            - "CoopEnrollment.${ce2}.discount_pct_applied == 25"
            - "CoopEnrollment.${ce3}.fee_cents == 7499"
            - "CoopEnrollment.${ce3}.discount_pct_applied == 25"
            - "Family.${fam}.fee_balance_cents == 23997   (8999+7499+7499 per-line; sum-then-round would give 23998)"

      - name: graduation_bucket_minimum_interaction
        grounds:
          - calculations.graduation_credit_audit
          - validations[priority=10]
          - errors[ERR_GRADUATION_REQUIREMENTS_UNMET]
          - state_machines.GraduationApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: total credits (22.0,
          satisfies >= 22.0) AND four bucket minimums (ENGLISH 4.0 ok, MATH 2.0
          FAILS >= 3.0, SCIENCE 3.0 ok, SOCIAL_STUDIES 3.0 ok, ELECTIVE 10.0).
          Total passes, one bucket fails -> APPROVE rejected. Distinct mode from
          the rounding-order instance.
        test_recipe:
          setup:
            - "Year OPEN; family; grade-12 student; enrollment ACTIVE; testing not required for grade 12 (testing_grades [3,5,8,11])"
            - "POSTED credits: ENGLISH 4.0 (480h A), MATH 2.0 (240h A), SCIENCE 3.0 (360h A), SOCIAL_STUDIES 3.0 (360h A), ELECTIVE 10.0 (1200h A) = total 22.0"
            - "Final-year portfolio ACCEPTED by reviewer rev-1; family fee_balance_cents == 0; standing GOOD_STANDING"
            - "GraduationApplication SUBMITTED"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Family Buck", district_code: "D-04" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Senior Buck", date_of_birth: "2008-02-02" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 12 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-04" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "ENGLISH", course_title: "English 9-12 block", planned_hours: 480 }, as: Parent, as_user_id: "${fam}", captures: { c1: $.data.id } }
            - { call: "POST /course-credits/${c1}/complete", payload: { completed_hours: 480, letter_grade: "A" }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /course-credits/${c1}/verify", payload: { decision: "APPROVE" }, as: Registrar }
            - { call: "POST /course-credits/${c1}/post", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "MATH", course_title: "Algebra+Geometry", planned_hours: 240 }, as: Parent, as_user_id: "${fam}", captures: { c2: $.data.id } }
            - { call: "POST /course-credits/${c2}/complete", payload: { completed_hours: 240, letter_grade: "A" }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /course-credits/${c2}/verify", payload: { decision: "APPROVE" }, as: Registrar }
            - { call: "POST /course-credits/${c2}/post", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "SCIENCE", course_title: "Science block", planned_hours: 360 }, as: Parent, as_user_id: "${fam}", captures: { c3: $.data.id } }
            - { call: "POST /course-credits/${c3}/complete", payload: { completed_hours: 360, letter_grade: "A" }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /course-credits/${c3}/verify", payload: { decision: "APPROVE" }, as: Registrar }
            - { call: "POST /course-credits/${c3}/post", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "SOCIAL_STUDIES", course_title: "Social studies block", planned_hours: 360 }, as: Parent, as_user_id: "${fam}", captures: { c4: $.data.id } }
