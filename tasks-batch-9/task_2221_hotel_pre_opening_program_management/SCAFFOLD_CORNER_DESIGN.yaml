              as: CommercialDirector
              as_user_id: "cd-1"
              captures: { block_1: "$.data.id" }
          assert:
            - "response status is 201"
            - "data.room_nights == 10"
            - "data.revenue_cents == 200000"
            - "data.is_pre_opening == true (arrival 2026-10-05 is before projected_opening_date_committed 2026-10-15)"
            - "data.state == 'ACCEPTED'"
            - "data.contingency_cents == 262500 (base 250000, tier 0.05, admin fee 12500, subtotal 262500, no guarantee penalty)"
            - "GET /pre-opening/programs/${prog_id} returns committed_room_nights == 10 and contingency_liability_cents == 262500"

      - name: admin_fee_tier_boundaries_of_the_contingency_calculation
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: contingency_admin_fee_tier_keyed_on_pre_fee_base
          rationale: "The §1.8 combinatorial_formula instance of the same name already walks the tier boundary from base 499999/500000 upward and proves the guarantee penalty cannot promote a block into a higher band, which is the whole of the tiered_pricing corner."
        grounds:
          - "§1.3 contingency_liability selects tier_pct on base_relocation_cents with breakpoints TIER_1_LIMIT_CENTS 500000 and TIER_2_LIMIT_CENTS 2000000, explicitly not on the subtotal or the final contingency."

      - name: readiness_score_weights_sum_to_one_without_rounding_drift
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: readiness_score_four_term_weighted_with_clamped_slip_term
          rationale: "The §1.8 combinatorial_formula instance of the same name already asserts all four weighted terms together, the 0.0 substitutions for empty denominators and the clamp of schedule_term at 0."
        grounds:
          - "§1.3 readiness_posture declares W_SYSTEMS 0.30, W_STAFFING 0.25, W_PERMITS 0.25 and W_SCHEDULE 0.20 over four independently derived ratios."

      - name: optimistic_and_committed_projections_diverge_on_the_same_network
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: schedule_variant_divergence_after_milestone_rework
          rationale: "The §1.8 dual_variant_calc instance of the same name already drives projected_opening_date_optimistic and projected_opening_date_committed apart from identical stored rows and asserts the day delta."
        grounds:
          - "§1.3 critical_path_schedule declares variants OPTIMISTIC and COMMITTED that differ in effective_duration (blocked_days_accrued ignored vs absorbed) and in the rework_buffer_days inserted after a reworked predecessor."

      - name: adjacent_and_overlapping_delivery_windows_in_the_storage_load
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: storage_load_ignores_touching_delivery_windows
          rationale: "The §1.8 resource_temporal_overlap instance of the same name already asserts that a window ending on the day another begins contributes no shared pallet load, which is exactly the adjacent-interval corner."
        grounds:
          - "§1.3 storage_overlap_load treats each delivery window as a half-open day interval, so adjacency at a shared endpoint is permitted."

      - name: budget_line_running_totals_stay_correct_after_a_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: ose_order_cancel_restores_budget_line_without_authorized_drift
          rationale: "The §1.8 compensating_invariant instance of the same name already asserts the running committed/available totals after the add and after the reversal, with authorized_cents unchanged — the aggregation add-then-reverse corner."
        grounds:
          - "§1.3 cost_at_completion sums committed_cents + spent_cents per BudgetLine, and §1.2 OseOrder COMMITTED -> CANCELLED declares committed_cents -= amount_cents with available_cents += amount_cents and authorized_cents unchanged."

  # ============================================================================
  # SECTION 4 — validations
