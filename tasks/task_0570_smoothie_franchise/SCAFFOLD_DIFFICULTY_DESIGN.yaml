            - "Customer.${cust_id}.lifetime_points_earned == 0"
            - "Order.${order_id}.payment_status == REFUNDED"

      - name: inventory_units_conserved_on_pay_then_cancel
        grounds:
          - calculations.inventory_fifo_consumption
          - state_machines.Order.pay
          - state_machines.Order.cancel
          - entities.InventoryLot.fields.remaining_qty
          - entities.InventoryLot.fields.consumed_qty
        distinguishing_aspect: "Conserved quantity = physical ingredient units: pay draws 150 units (remaining 200->50) then cancel restores them (remaining 50->200, consumed 0) so qty_received == remaining+consumed+spoiled holds with zero drift; a different conserved quantity from loyalty points."
        test_recipe:
          setup:
            - "OPEN store; lot qty 200 unit_cost 2; order requiring 150 units (MEDIUM of base_qty-100 recipe) placed."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
