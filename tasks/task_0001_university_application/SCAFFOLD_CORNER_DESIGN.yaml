              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v_review: $.data.version }
            - call: "POST /applications/${app_id}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v_review}" }
              as: AdmissionsOfficer
              captures: { v_admitted: $.data.version }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${applicant_id}", fafsa_efc_cents: 2000000, family_income_cents: 6000000 }
