      - name: recalculation_recompute_blocked_while_a_dispute_is_under_review
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PointRecalculation.status.transitions.COMMUNICATED_to_COMPUTED
          - state_machines.PointDispute.status.transitions.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The COMMUNICATED -> COMPUTED re-run edge carries a cross-entity
          precondition: no PointDispute on this recalculation may be in SUBMITTED,
          UNDER_REVIEW or INFO_REQUESTED. An UNDER_REVIEW dispute must therefore
          freeze re-computation with 409 ERR_INVALID_STATE while leaving the
          recalculation in COMMUNICATED — distinct from the DRAFT -> COMPUTED
          first run, which has no such guard.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One Donor scored at certified_points 15.00 by a completed first run."
            - "One PointRecalculation for cycle 2026 in status COMMUNICATED."
            - "One PointDispute on that recalculation in status UNDER_REVIEW, reviewed_by_user_id \"analyst-1\"."
          setup_api_calls:
