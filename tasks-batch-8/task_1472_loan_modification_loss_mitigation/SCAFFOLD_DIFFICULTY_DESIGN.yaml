      - name: sale_appeal_window_beats_min_notice
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_SALE_WITHIN_APPEAL_WINDOW]
          - errors[ERR_SALE_MIN_NOTICE]
        distinguishing_aspect: |
          Category pair business_safety x business_temporal (distinct from both
