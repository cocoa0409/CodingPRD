          - endpoints[POST /recommerce/trade-ins]
        distinguishing_aspect: "A freshly created TradeIn is SUBMITTED with authenticity_result PENDING, appeal_count 0 and received_at/accepted_at null, and it has minted no CreditGrant, no CreditLedgerEntry and no ResaleUnit."
        test_recipe:
          setup:
            - "ACTIVE FOOTWEAR grade A GradePolicy, ACTIVE CreditPolicy, one store, one PLUS customer."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
