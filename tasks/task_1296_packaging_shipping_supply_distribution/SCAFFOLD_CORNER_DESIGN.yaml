  # Section: rbac
  # ==================================================================
  - section: rbac
    instances:
      - name: rbac_buyer_cannot_manage_catalog_or_inventory
        claim_type: role_exclusive_denial
        grounds:
          - roles.Buyer
          - roles.CatalogManager
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Buyer is denied on CatalogManager-exclusive POST /products and WarehouseOps-exclusive POST /inventory/{id}/receive with 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["account; one product with inventory at ATL"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "Y-1", name: "Y", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 10 }
              as: WarehouseOps
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "Y-2", name: "Y2", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/inventory/${inv}/receive"
              payload: { qty: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_2: $.data.error_id }
          assert:
            - "Buyer POST /products: error_id == ERR_UNAUTHORIZED (captured ${err_1})"
            - "Buyer POST /inventory/{id}/receive: error_id == ERR_UNAUTHORIZED (captured ${err_2})"

      - name: rbac_warehouseops_cannot_approve_returns_approver_cannot_submit
        claim_type: role_exclusive_denial
        grounds:
          - roles.WarehouseOps
          - roles.CustomerService
          - roles.AccountApprover
        distinguishing_aspect: "WarehouseOps denied on CustomerService-exclusive return approve; AccountApprover denied on Buyer-exclusive order submit (approval_chain roles cannot cross lanes)."
        test_recipe:
          setup: ["shipped order qty 1; return REQUESTED; second DRAFT order with one line"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "Z-1", name: "Z", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /packaging-distribution/orders/${o1}/lines"
              payload: { product_id: "${prod}", qty: 1 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { l1: $.data.id }
            - call: "POST /packaging-distribution/orders/${o1}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${o1}/ship"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/returns"
              payload: { order_id: "${o1}", return_type: "STOCK", reason_code: "DAMAGED", lines: [ { order_line_id: "${l1}", qty: 1 } ] }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ret: $.data.id }
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { o2: $.data.id }
            - call: "POST /packaging-distribution/orders/${o2}/lines"
              payload: { product_id: "${prod}", qty: 1 }
              as: Buyer
              as_user_id: "${acct}"
