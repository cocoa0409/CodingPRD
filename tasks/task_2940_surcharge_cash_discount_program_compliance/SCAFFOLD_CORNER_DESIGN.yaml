          - errors[ERR_SURCHARGE_PROHIBITED_JURISDICTION]
        excluded_because:
          difficulty_instance: "transitive_cascade / law_change_prohibition_cascade_program_terminals_census"
          rationale: "The jurisdiction-level cascade (a law change that prohibits surcharging disables every SURCHARGE program in that state, quarantines their terminals and recomputes each merchant's census while leaving CASH_DISCOUNT programs alone) is exercised there across two merchants; repeating it here would only duplicate the same three-level walk."

