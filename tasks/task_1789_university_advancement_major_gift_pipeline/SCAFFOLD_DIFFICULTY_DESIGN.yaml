              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
          trigger:
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver2: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 100000000, designation_purpose: "Exactly at", expected_prospect_version: "${p_ver2}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop2_id: $.data.id }
            - call: "POST /advancement/proposals/${prop2_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
          assert:
            - "Proposal.${prop1_id}.approval_tier == \"MAJOR\"  # 99999999 < 100000000"
            - "Proposal.${prop1_id}.effective_ask_cents == 99999999"
            - "Proposal.${prop2_id}.approval_tier == \"PRINCIPAL\"  # 100000000 >= TIER_PRINCIPAL_MIN (inclusive)"
            - "Proposal.${prop2_id}.effective_ask_cents == 100000000"
            - "Proposal.${prop2_id}.pinned_capacity_band == \"B\"  # band B receives no downward shift"

      - name: portfolio_capacity_boundary_at_exact_max
        grounds:
          - validations[priority=11]
          - errors[ERR_PORTFOLIO_CAPACITY_EXCEEDED]
          - entities.Fundraiser.fields.current_prospect_count
        distinguishing_aspect: |
          Metric: integer ACTIVE-assignment count at the max_prospect_count
          boundary via POST /advancement/fundraisers/{id}/assignments. With max 2:
          the second assignment (count 1 >= 2 is false) succeeds, the third
          (count 2 >= 2) is rejected. Distinct metric (count) and endpoint from
          the ask-tier and fund-balance instances.
        test_recipe:
          setup:
            - "Fundraiser with max_prospect_count = 2; three plain prospects (IDENTIFIED, no rating needed for assignment)"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 2, max_open_ask_cents: 1000000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
