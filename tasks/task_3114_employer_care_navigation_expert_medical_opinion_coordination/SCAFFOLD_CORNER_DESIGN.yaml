          expires_at: '2027-01-01T00:00:00Z'
        as: Member
        as_user_id: ${m_id}
        captures:
          error_id: $.data.error_id
      assert:
      - status 409, error_id == ERR_MEMBER_INELIGIBLE
  - name: occ_stale_member_version_on_coverage_window_create
    claim_type: Violation → Error
    grounds:
    - concurrency_rules[coverage-window-supersede-stale-member]
    - errors.ERR_STALE_VERSION
    - validations[priority=25]
    distinguishing_aspect: 'OCC: after a first window create bumps Member.version to 2, a second create carrying the stale expected_member_version 1 is rejected 412 — while the fresh version succeeds and
      supersedes the open window.'
    test_recipe:
      setup:
      - Member created (version 1).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: OccCo
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 100000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Oscar C
          date_of_birth: '1977-07-07'
          relationship: SELF
          external_member_ref: OC-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
          m_v1: $.data.version
      trigger:
      - call: POST /care/members/${m_id}/coverage-windows
        payload:
          coverage_tier: EMPLOYEE_ONLY
          effective_start: '2026-01-01'
          expected_member_version: ${m_v1}
        as: PlatformAdmin
        captures:
          cw1: $.data.id
      - call: POST /care/members/${m_id}/coverage-windows
        payload:
          coverage_tier: FAMILY
          effective_start: '2026-07-01'
          expected_member_version: ${m_v1}
        as: PlatformAdmin
        captures:
          error_id: $.data.error_id
      - call: GET /care/members/${m_id}
        payload: {}
        as: PlatformAdmin
        captures:
          m_v2: $.data.version
      - call: POST /care/members/${m_id}/coverage-windows
        payload:
          coverage_tier: FAMILY
          effective_start: '2026-07-01'
          expected_member_version: ${m_v2}
        as: PlatformAdmin
        captures:
          cw2: $.data.id
      assert:
      - 'second create with stale version: 412 ERR_STALE_VERSION'
      - Member.${m_id}.version == 2 after first create (bumped by supersede-capable write)
      - 'create with fresh version succeeds: CoverageWindow.${cw2} OPEN from 2026-07-01'
      - CoverageWindow.${cw1}.status == CLOSED with effective_end == 2026-06-30 (supersede side effect)
  - name: occ_stale_opinion_version_on_submit_recommendation
    claim_type: Violation → Error
    grounds:
    - concurrency_rules[recommendation-supersede-stale-opinion]
    - errors.ERR_STALE_VERSION
    distinguishing_aspect: 'OCC on a second parent entity: two sequential submit-recommendation calls — the first succeeds (recommendation_version 1, case version advanced), the second carrying the pre-first
      version fails 412 even though the case is in a state where submission was legal.'
    test_recipe:
      setup:
