  # =========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: nav_period_open_excludes_second_open_period
        grounds:
          - entities.NavPeriod.fields.status
          - entities.Fund.fields.current_nav_period_id
        distinguishing_aspect: |
          Interval semantic = mutual exclusion on the open slot: a Fund
          may have at most one NavPeriod with status=OPEN; creating a
          second while one is open is rejected. Different from a
          half-open overlap: the slot is singleton, not interval.
        test_recipe:
          setup:
            - "Fund F with NavPeriod P1 OPEN"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-09-30T23:59:59Z" }
              as: FundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE (singleton OPEN slot occupied)"

      - name: side_letter_supersession_requires_active_target
        grounds:
          - entities.SideLetter.fields.supersedes_side_letter_id
          - validations[priority=17]
        distinguishing_aspect: |
          Interval semantic = temporal supersession: only the most
          recent EXECUTED SideLetter for a subscription may be superseded;
          attempting to supersede an already-SUPERSEDED letter is
          rejected with ERR_INVALID_SUPERSESSION. Different geometry
          from singleton slot: a linear chain where only the head is
          supersedeable.
        test_recipe:
          setup:
            - "Subscription S ACCEPTED; SideLetter L1 EXECUTED; L2 executed with supersedes=L1 (so L1 SUPERSEDED)"
            - "Attempt to create L3 with supersedes=L1 (already superseded)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
            - call: "POST /investors"
              payload: { legal_name: "Inv G", investor_type: "INDIVIDUAL", tax_id: "T16", email: "g@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 500000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 500000, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fv: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/accept"
              payload: { expected_fund_version: "${fv}" }
              as: FundAdmin
            - call: "POST /funds/${fund_id}/side-letters"
              payload: { subscription_id: "${sub_id}", terms_document_id: "L1" }
              as: FundAdmin
              captures: { l1_id: $.data.id }
            - call: "GET /funds/${fund_id}/subscriptions/${sub_id}"
              payload: {}
              as: FundAdmin
              captures: { sv1: $.data.version }
            - call: "POST /funds/${fund_id}/side-letters/${l1_id}/execute"
              payload: { expected_subscription_version: "${sv1}" }
              as: FundAdmin
            - call: "POST /funds/${fund_id}/side-letters"
              payload: { subscription_id: "${sub_id}", terms_document_id: "L2", supersedes_side_letter_id: "${l1_id}" }
              as: FundAdmin
              captures: { l2_id: $.data.id }
            - call: "GET /funds/${fund_id}/subscriptions/${sub_id}"
              payload: {}
              as: FundAdmin
              captures: { sv2: $.data.version }
            - call: "POST /funds/${fund_id}/side-letters/${l2_id}/execute"
              payload: { expected_subscription_version: "${sv2}" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/side-letters"
              payload: { subscription_id: "${sub_id}", terms_document_id: "L3", supersedes_side_letter_id: "${l1_id}" }
              as: FundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_SUPERSESSION (L1 already SUPERSEDED; only head of chain is supersedeable)"

  # =========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: redemption_settle_conserves_net_assets_identity
        grounds:
          - state_machines.RedemptionRequest.APPROVED_to_SETTLED
          - entities.Fund.fields.total_net_assets_cents
          - entities.CapitalAccount.fields.current_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Fund.total_net_assets_cents equals sum of
          all CapitalAccount.current_balance_cents. Invariant: after any
          redemption settle, Fund.total_net_assets_cents decreases by
          exactly the same amount as the target CapitalAccount's balance.
        test_recipe:
          setup:
            - "Fund with one CapitalAccount balance 500000; Fund.total_net_assets_cents=500000"
            - "Approved RedemptionRequest for 200000"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.50, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /funds/${fund_id}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
              captures: { period_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv I", investor_type: "INDIVIDUAL", tax_id: "T17", email: "i@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 500000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 500000, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fv: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/accept"
              payload: { expected_fund_version: "${fv}" }
              as: FundAdmin
            - call: "GET /investors/${inv_id}/capital-accounts"
              payload: {}
              as: FundAdmin
              captures: { ca_id: "$.data[0].id" }
            - call: "POST /funds/${fund_id}/redemptions"
              payload: { capital_account_id: "${ca_id}", requested_amount_cents: 200000, requested_effective_period_id: "${period_id}" }
              as: TransferAgent
              captures: { red_id: $.data.id }
            - call: "POST /funds/${fund_id}/redemptions/${red_id}/approve"
              payload: {}
              as: FundAdmin
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fv2: $.data.version }
            - call: "POST /funds/${fund_id}/nav-periods/${period_id}/finalize"
              payload: { gross_return_bps: 0, expected_fund_version: "${fv2}" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/nav-periods/${period_id}/close"
              payload: {}
              as: FundAdmin
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdmin
              captures: { fund_after: $.data.total_net_assets_cents }
            - call: "GET /investors/${inv_id}/capital-accounts/${ca_id}"
              payload: {}
              as: FundAdmin
              captures: { ca_after: $.data.current_balance_cents }
          assert:
            - "Fund.total_net_assets_cents == 500000 - 200000 == 300000"
            - "CapitalAccount.current_balance_cents == 300000"
            - "Identity conserved: Fund.total == sum(CapitalAccount.current_balance)"

      - name: late_fee_cancellation_conserves_commitment_arithmetic
        grounds:
          - calculations.late_funding_fee_accrual
          - entities.Investor.fields.aggregate_unfunded_commitment_cents
        distinguishing_aspect: |
          Conserved quantity = Investor.aggregate_unfunded_commitment_cents
          equals sum over non-terminal Subscriptions of (commitment -
          funded). Invariant: after admin cancels a FUNDING_PARTIAL
          subscription, the cancelled subscription's unfunded amount is
          subtracted from the aggregate; late fee accrues but does NOT
          enter the unfunded commitment calculation.
        test_recipe:
          setup:
            - "Investor with one FUNDING_PARTIAL subscription (commitment 1000, funded 333)"
            - "Aggregate unfunded = 1000 - 333 = 667 before cancel"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100, min_additional_investment_cents: 50, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { class_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Inv K", investor_type: "INDIVIDUAL", tax_id: "T18", email: "k@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 1000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/fundings"
              payload: { amount_cents: 333, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "GET /investors/${inv_id}"
              payload: {}
              as: FundAdmin
              captures: { unfunded_before: $.data.aggregate_unfunded_commitment_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fund_id}/subscriptions/${sub_id}/cancel"
              payload: {}
              as: FundAdmin
            - call: "GET /investors/${inv_id}"
              payload: {}
              as: FundAdmin
              captures: { unfunded_after: $.data.aggregate_unfunded_commitment_cents }
          assert:
            - "aggregate_unfunded_commitment_cents was 667 before cancel"
            - "aggregate_unfunded_commitment_cents == 0 after cancel (cancelled subscription drops out)"
            - "late_fees_accrued_cents recorded on Subscription but NOT added to unfunded commitment"
