            - { call: "POST /band/arrangements/${arr_a}/approve", payload: {}, as: BandDirector, as_user_id: "dir-2" }
            - { call: "POST /band/arrangements/${arr_a}/purchase", payload: {}, as: BoosterTreasurer }
