              as_user_id: "analyst-1"
              captures: { err_dup_case: "$.data.error_id" }
            - call: "POST /deposit-fraud/fraud-cases"
              payload: { primary_account_id: "${acct_dc}", case_type: "KITING" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { case_dc2: "$.data.id", case_dc2_source: "$.data.detection_source" }
          assert:
            - "${err_dup_case} == ERR_DUPLICATE_OPEN_CASE with HTTP 409"
            - "${case_dc2_source} == ANALYST_MANUAL"
            - "GET /deposit-fraud/fraud-cases/${case_dc2} returns case_type == KITING, status == OPENED, kiting_score == null, scan_mode == null and cycle_account_ids equal to the empty array"
            - "GET /deposit-fraud/accounts/${acct_dc}/fraud-cases returns total_count == 2"
            - "GET /deposit-fraud/customers/${cust_dc} returns open_fraud_case_count == 2"

      - name: late_subpoena_response_without_a_justification_is_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=57]
          - errors[ERR_LATE_JUSTIFICATION_REQUIRED]
          - entities.SubpoenaRequest.fields.is_late
        distinguishing_aspect: "With the clock at 2026-08-06T00:00:00Z, past a response_due_at of 2026-08-05T00:00:00Z, a PRODUCE response without late_justification returns 422 ERR_LATE_JUSTIFICATION_REQUIRED; supplying one succeeds and stamps is_late true."
        test_recipe:
          setup:
            - "One Customer with one SubpoenaRequest whose response_due_at is 2026-08-05T00:00:00Z, taken UNDER_LEGAL_REVIEW by counsel-1."
            - "The logical clock is then moved to 2026-08-06T00:00:00Z."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Late Response Depositor", tin_last4: "0032" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_lr: "$.data.id" }
            - call: "POST /deposit-fraud/customers/${cust_lr}/subpoenas"
              payload: { issuing_agency: "District Attorney", docket_number: "26-DA-0512", response_due_at: "2026-08-05T00:00:00Z", preservation_start_at: "2026-08-01T00:00:00Z", preservation_end_at: "2026-09-01T00:00:00Z" }
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { sub_lr: "$.data.id" }
            - call: "POST /deposit-fraud/subpoenas/${sub_lr}/legal-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /deposit-fraud/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/subpoenas/${sub_lr}/respond"
              payload: { disposition: "PRODUCE", production_note: "Statements attached" }
              as: LegalCounsel
              as_user_id: "counsel-2"
              captures: { err_late: "$.data.error_id" }
            - call: "POST /deposit-fraud/subpoenas/${sub_lr}/respond"
              payload: { disposition: "PRODUCE", production_note: "Statements attached", late_justification: "Records vendor outage 2026-08-03 to 2026-08-05" }
              as: LegalCounsel
              as_user_id: "counsel-2"
              captures: { sub_lr_status: "$.data.status", sub_lr_late: "$.data.is_late" }
          assert:
            - "${err_late} == ERR_LATE_JUSTIFICATION_REQUIRED with HTTP 422"
            - "${sub_lr_status} == PRODUCED"
            - "${sub_lr_late} == true"
            - "GET /deposit-fraud/subpoenas/${sub_lr} returns responded_by_user_id == counsel-2 and legal_reviewed_by_user_id == counsel-1"
            - "GET /deposit-fraud/customers/${cust_lr} returns preservation_hold_active == true, because a PRODUCED subpoena keeps the hold until preservation_end_at"

      - name: deciding_a_draft_review_and_drafting_a_referral_too_early_are_rejected
        claim_type: Cascading validation
        grounds:
          - validations[priority=40]
          - errors[ERR_REVIEW_NOT_SUBMITTED]
          - errors[ERR_CASE_NOT_SUBSTANTIATED]
        distinguishing_aspect: "Two independent state gates at priority 40: a decision on a DRAFT review returns 409 ERR_REVIEW_NOT_SUBMITTED, and a BSA referral drafted against an OPENED case returns 409 ERR_CASE_NOT_SUBSTANTIATED."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with one CHECK deposit of 30000 cents and one DRAFT HoldOverrideReview against its hold."
            - "One manually opened MULE FraudCase in status OPENED on the same account."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Early Action Depositor", tin_last4: "0033" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_ea: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_ea}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_ea: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ea}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1024" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_ea: "$.data.id", md_ea: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_ea}/verification-attempts"
              payload: { micro_deposit_cents: "${md_ea}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_ea}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_ea: "$.data.id" }
            - call: "GET /deposit-fraud/deposit-items/${item_ea}/holds"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_ea: "$.data[0].id", hold_ea_v: "$.data[0].version" }
            - call: "POST /deposit-fraud/check-holds/${hold_ea}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "Draft only", expected_check_hold_version: "${hold_ea_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { rev_ea: "$.data.id" }
            - call: "POST /deposit-fraud/fraud-cases"
              payload: { primary_account_id: "${acct_ea}", case_type: "MULE" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { case_ea: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/hold-override-reviews/${rev_ea}/decide"
              payload: { decision: "APPROVE", decision_note: "Premature decision" }
              as: FraudSupervisor
              as_user_id: "sup-1"
              captures: { err_not_submitted: "$.data.error_id" }
            - call: "POST /deposit-fraud/fraud-cases/${case_ea}/bsa-referrals"
              payload: { narrative: "Premature referral.", suspected_activity_code: "STRUCTURING" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_not_substantiated: "$.data.error_id" }
          assert:
            - "${err_not_submitted} == ERR_REVIEW_NOT_SUBMITTED with HTTP 409"
            - "${err_not_substantiated} == ERR_CASE_NOT_SUBSTANTIATED with HTTP 409"
            - "GET /deposit-fraud/hold-override-reviews/${rev_ea} returns status == DRAFT"
            - "GET /deposit-fraud/fraud-cases/${case_ea}/bsa-referrals returns total_count == 0"

      - name: booking_a_charge_off_while_the_account_is_still_active_is_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=42]
          - errors[ERR_ACCOUNT_NOT_CLOSED]
          - state_machines.ChargeOff.APPROVED_to_BOOKED
        distinguishing_aspect: "Booking is gated on the OTHER entity: an APPROVED ChargeOff whose DepositAccount is still ACTIVE returns 409 ERR_ACCOUNT_NOT_CLOSED and leaves both the charge-off in APPROVED and the account's balances untouched."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with zero balances and an APPROVED ChargeOff of gross_loss_cents 60000 with no collateral offset."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Premature Booking Depositor", tin_last4: "0034" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_pb: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_pb}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_pb: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_pb}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1025" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_pb: "$.data.id", md_pb: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_pb}/verification-attempts"
              payload: { micro_deposit_cents: "${md_pb}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "GET /deposit-fraud/accounts/${acct_pb}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { v_pb: "$.data.version" }
            - call: "POST /deposit-fraud/accounts/${acct_pb}/charge-offs"
              payload: { gross_loss_cents: 60000, collateral_offset_cents: 0, expected_account_version: "${v_pb}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { co_pb: "$.data.id", net_pb: "$.data.net_charge_off_cents" }
            - call: "POST /deposit-fraud/charge-offs/${co_pb}/approve"
              payload: {}
              as: FraudSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /deposit-fraud/charge-offs/${co_pb}/book"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { err_not_closed: "$.data.error_id" }
          assert:
            - "${net_pb} == 63000, from base_net 60000 at tier 1 500 bps giving a 3000-cent fee"
            - "${err_not_closed} == ERR_ACCOUNT_NOT_CLOSED with HTTP 409"
            - "GET /deposit-fraud/charge-offs/${co_pb} returns status == APPROVED, booked_at == null and ledger_balance_before_book_cents == null"
            - "GET /deposit-fraud/accounts/${acct_pb} returns lifecycle_status == ACTIVE, ledger_balance_cents == 0 and charged_off_amount_cents == 0"

  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: logical_clock_reads_its_fixed_default_before_any_set_call
        claim_type: Computed read
        grounds:
          - entities.DepositAccount.fields.opened_at
          - entities.DepositItem.fields.deposit_at
        distinguishing_aspect: "With no POST /deposit-fraud/_clock/set_current_utc ever issued, the server's logical clock reads exactly 2026-08-01T00:00:00Z, so a freshly opened account stamps opened_at at that instant instead of real wall-clock time."
        test_recipe:
          setup:
            - "Empty database. No clock-set call is issued at any point in this instance."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Default Clock Depositor", tin_last4: "0035" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_dk: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_dk}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_dk: "$.data.id", opened_dk: "$.data.opened_at" }
            - call: "POST /deposit-fraud/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { clock_dk: "$.data.current_utc" }
          assert:
            - "${opened_dk} == 2026-08-01T00:00:00Z"
            - "${clock_dk} == 2026-08-01T00:00:00Z, the same value the clock already held before the call"
            - "GET /deposit-fraud/accounts/${acct_dk} returns created_at == 2026-08-01T00:00:00.000Z"

      - name: deposit_item_listing_filters_by_settlement_status
        claim_type: Standard CRUD
        grounds:
          - entities.DepositItem.fields.status
          - entities.DepositItem.fields.account_id
        distinguishing_aspect: "GET /deposit-fraud/accounts/{id}/deposit-items with status=PENDING returns only the two unsettled items while status=CLEARED returns exactly the one settled item, and the unfiltered call returns all three."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with three CHECK deposits of 30000 cents; the second is settled CLEARED."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Listing Filter Depositor", tin_last4: "0036" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_lf: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_lf}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_lf: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_lf}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1026" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_lf: "$.data.id", md_lf: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_lf}/verification-attempts"
              payload: { micro_deposit_cents: "${md_lf}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_lf}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_lf1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_lf}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_lf2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_lf}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_lf3: "$.data.id" }
            - call: "POST /deposit-fraud/deposit-items/${item_lf2}/settle"
              payload: { outcome: "CLEARED" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "GET /deposit-fraud/accounts/${acct_lf}/deposit-items"
              payload: { status: "PENDING" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "GET /deposit-fraud/accounts/${acct_lf}/deposit-items"
              payload: { status: "CLEARED" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "GET /deposit-fraud/accounts/${acct_lf}/deposit-items"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
          assert:
            - "The PENDING call returns total_count == 2 containing ${item_lf1} and ${item_lf3}"
            - "The CLEARED call returns total_count == 1 containing exactly ${item_lf2}"
            - "The unfiltered call returns total_count == 3, limit == 10, offset == 0 and has_more == false"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: unrecognised_role_header_returns_unauthenticated_before_any_other_check
        claim_type: Role denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request whose X-User-Role is not one of the six declared roles fails at priority 1 with 401 ERR_UNAUTHENTICATED, ahead of the 403 role check and ahead of the 404 path-existence check, even when the path id does not exist."
        test_recipe:
          setup:
            - "Empty database; the account id below matches no stored row."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Auth Order Depositor", tin_last4: "0037" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_ao: "$.data.id" }
          trigger:
            - call: "GET /deposit-fraud/accounts/cccccccc-cccc-4ccc-8ccc-cccccccccccc"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_unauth: "$.data.error_id" }
          assert:
            - "${err_unauth} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_ACCOUNT_NOT_FOUND and not ERR_FORBIDDEN_ROLE"
            - "The same request with the X-User-Role header omitted entirely also returns ERR_UNAUTHENTICATED with HTTP 401"

      - name: bsa_officer_cannot_open_a_fraud_case_or_take_a_deposit
        claim_type: Role denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.BsaOfficer
        distinguishing_aspect: "BsaOfficer holds exactly one write operation, referral adjudication: POST /deposit-fraud/fraud-cases and POST /deposit-fraud/accounts/{id}/deposit-items both return 403 ERR_FORBIDDEN_ROLE for that role while remaining available to FraudAnalyst and OperationsAdmin."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Role Boundary Depositor", tin_last4: "0038" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_rb: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_rb}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_rb: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_rb}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1027" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_rb: "$.data.id", md_rb: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_rb}/verification-attempts"
              payload: { micro_deposit_cents: "${md_rb}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/fraud-cases"
              payload: { primary_account_id: "${acct_rb}", case_type: "MULE" }
              as: BsaOfficer
              as_user_id: "bsa-1"
              captures: { err_case_role: "$.data.error_id" }
            - call: "POST /deposit-fraud/accounts/${acct_rb}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: BsaOfficer
              as_user_id: "bsa-1"
              captures: { err_deposit_role: "$.data.error_id" }
            - call: "POST /deposit-fraud/fraud-cases"
              payload: { primary_account_id: "${acct_rb}", case_type: "MULE" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { case_rb: "$.data.id" }
          assert:
            - "${err_case_role} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "${err_deposit_role} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "GET /deposit-fraud/fraud-cases/${case_rb} returns status == OPENED, proving the same call succeeds for FraudAnalyst"
            - "GET /deposit-fraud/accounts/${acct_rb}/deposit-items returns total_count == 0"

      - name: account_holder_cannot_read_another_customers_account
        claim_type: Segregation of duties
        grounds:
          - validations[priority=15]
          - errors[ERR_NOT_ACCOUNT_OWNER]
          - roles.AccountHolder
        distinguishing_aspect: "AccountHolder identity is entity_backed:Customer, so X-User-ID must equal DepositAccount.customer_id: reading one's own account returns 200 while reading a sibling customer's account returns 403 ERR_NOT_ACCOUNT_OWNER, not 404."
        test_recipe:
          setup:
            - "Two Customers, each owning one DepositAccount."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Owner One", tin_last4: "0039" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_own1: "$.data.id" }
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Owner Two", tin_last4: "0040" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_own2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_own1}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_own1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_own2}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_own2: "$.data.id" }
          trigger:
            - call: "GET /deposit-fraud/accounts/${acct_own1}"
              payload: {}
              as: AccountHolder
              as_user_id: "${cust_own1}"
              captures: { own_life: "$.data.lifecycle_status" }
            - call: "GET /deposit-fraud/accounts/${acct_own2}"
              payload: {}
              as: AccountHolder
              as_user_id: "${cust_own1}"
              captures: { err_owner: "$.data.error_id" }
          assert:
            - "${own_life} == PENDING_FUNDING and the owner read returns HTTP 200"
            - "${err_owner} == ERR_NOT_ACCOUNT_OWNER with HTTP 403"

      - name: supervisor_cannot_decide_a_review_they_prepared_themselves
        claim_type: Segregation of duties
        grounds:
          - validations[priority=50]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.HoldOverrideReview.fields.prepared_by_user_id
        distinguishing_aspect: "Duty separation bites inside one role: sup-1, who is permitted both to prepare and to decide, is refused with 403 ERR_SEGREGATION_OF_DUTIES on the review they prepared, while sup-2 decides the identical review successfully."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with one CHECK deposit of 30000 cents."
            - "One HoldOverrideReview prepared AND submitted by FraudSupervisor sup-1, now in SUBMITTED."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Duty Separation Depositor", tin_last4: "0041" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_sd: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_sd}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_sd: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_sd}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1028" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_sd: "$.data.id", md_sd: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_sd}/verification-attempts"
              payload: { micro_deposit_cents: "${md_sd}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_sd}/deposit-items"
