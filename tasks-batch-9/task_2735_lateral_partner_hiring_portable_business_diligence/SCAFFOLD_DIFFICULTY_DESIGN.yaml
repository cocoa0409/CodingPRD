  - rule_id: priority_pair_validation_conflict
    instances:

      - name: offer_submit_clearance_safety_outranks_guarantee_budget_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=29]
          - errors[ERR_CLEARANCE_INCOMPLETE]
          - errors[ERR_GUARANTEE_BUDGET_EXCEEDED]
          - calculations.guarantee_budget_ledger
        distinguishing_aspect: |
          Error-category pair = business_safety (priority 10, ERR_CLEARANCE_INCOMPLETE,
          409) versus business_fiscal (priority 29, ERR_GUARANTEE_BUDGET_EXCEEDED, 402).
          ONE request violates both: the candidate still has a PENDING ConflictCheck AND the
          850000.00-over-budget guarantee of 6000000.00 exceeds available 5000000.00. The
          409 must win; only after the check is cleared does the same unchanged submit
          surface the 402, proving the order is a ladder and not a coincidence.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup with guarantee_budget_total_usd 5000000.00, available_guarantee_budget_usd 5000000.00."
            - "One Candidate in DILIGENCE with the SLIM BOOK assessed (CURRENT, VALIDATED) and one PENDING ConflictCheck, so clearance_status == IN_PROGRESS."
            - "One CompensationOffer in DRAFTED with guaranteed_comp_usd 6000000.00 — more than the whole practice-group budget."
