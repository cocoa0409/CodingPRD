            - "the report starting exactly at 2026-10-31T00:00:00Z is refused with http 409 and error_id ERR_OUTCOME_PERIOD_OVERLAP"
            - "the report starting one day later at 2026-11-01T00:00:00Z is accepted with http 201 as report ${rep_2}"
            - "the grant's outcome-report list holds exactly two rows, ${rep_row_1} and ${rep_row_2}, so the abutting request created no row"
            - "the mandatory one-day gap is what separates acceptance from refusal, since both requests use the same grant and measure_code"
  - rule_id: compensating_invariant
    instances:
      - name: enrollment_create_then_withdrawn_exit_conserves_slots_and_open_count
        grounds:
          - calculations.program_capacity_consumption
          - state_machines.Enrollment.PENDING_to_EXITED
          - state_machines.Enrollment.ACTIVE_to_EXITED
          - entities.Client.fields.open_enrollment_count
          - entities.Program.fields.enrolled_slots
        distinguishing_aspect: |
          The conserved quantity is capacity, not money: the create-then-exit(WITHDRAWN) pair
          returns Program.enrolled_slots and Client.open_enrollment_count to their pre-create
          values, so a program at capacity 1 refuses a second client before the exit and admits
          it again afterwards.
        test_recipe:
          setup:
            - "empty DB; logical clock 2026-10-02T00:00:00Z"
            - "Funder FED, Program HOUSING_PGM with capacity_slots 1 and nondiscrimination_attested true, Grant G1 (rank 1, DIRECT_ONLY, total_award_cents 100000, admin_rate_pct 0.10, period 2026-01-01T00:00:00Z to 2027-09-30T00:00:00Z)"
            - "Client One holds an ACTIVE enrollment ENR_1 on the program (Program.enrolled_slots 1, Client.open_enrollment_count 1); its assessment is ROUTED"
            - "Client Two has a ROUTED assessment and one VERIFIED screen SCR_2 for the same program with determination still PENDING"
          setup_api_calls:
            - call: "POST /api/funders"
              payload: { name: "FED", funder_type: "FEDERAL", allow_faith_based_activity: false, requires_time_and_effort_documentation: true, max_admin_rate_pct: 0.25, fiscal_year_start_month: 10 }
              as: ComplianceOfficer
              captures: { fnd: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "HOUSING_PGM", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 1, match_eligible: true }
              as: ComplianceOfficer
              captures: { prg: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G1", total_award_cents: 100000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-01-01T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { full_name: "Client One", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK", confidentiality_tier: "STANDARD" }
              as: IntakeSpecialist
              captures: { cli_1: "$.data.id" }
            - call: "POST /api/clients/${cli_1}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { asm_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/eligibility-screens"
              payload: { program_id: "${prg}", grant_id: "${g1}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { scr_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${asm_1}/route"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/enrollments"
              payload: { client_id: "${cli_1}" }
              as: ProgramManager
              captures: { enr_1: "$.data[0].id" }
            - call: "POST /api/enrollments/${enr_1}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /api/clients"
              payload: { full_name: "Client Two", date_of_birth: "1991-02-02", household_size: 1, immigration_status: "CITIZEN", county_code: "COOK", confidentiality_tier: "STANDARD" }
              as: IntakeSpecialist
              captures: { cli_2: "$.data.id" }
            - call: "POST /api/clients/${cli_2}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { asm_2: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_2}/eligibility-screens"
              payload: { program_id: "${prg}", grant_id: "${g1}", verified_income_cents: 130000, household_size_at_screen: 1 }
              as: IntakeSpecialist
              captures: { scr_2: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_2}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_2}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${asm_2}/route"
              payload: {}
              as: IntakeSpecialist
          trigger:
            - call: "POST /api/eligibility-screens/${scr_2}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "POST /api/enrollments/${enr_1}/exit"
              payload: { exit_reason: "WITHDRAWN" }
              as: ProgramManager
            - call: "POST /api/eligibility-screens/${scr_2}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/clients/${cli_1}"
              payload: {}
              as: IntakeSpecialist
              captures: { cli_1_open: "$.data.open_enrollment_count" }
            - call: "GET /api/enrollments"
              payload: { client_id: "${cli_2}" }
              as: ProgramManager
              captures: { cli_2_enr: "$.data[0].id" }
          assert:
            - "the first Client Two determination is refused with 409 ERR_PROGRAM_CAPACITY_EXCEEDED, proving enrolled_slots was 1 of capacity_slots 1"
            - "after the WITHDRAWN exit the same determination succeeds and the enrollment list for client ${cli_2} returns exactly one row, ${cli_2_enr}"
            - "Client.${cli_1}.open_enrollment_count == 0 (${cli_1_open}), the value it held before the enrollment was created"
            - "the exited enrollment ${enr_1} carries status EXITED and exit_reason WITHDRAWN"
            - "the conserved quantity is the slot count: it returned to 0 after the compensating exit, not to a negative or inflated value"
      - name: delivery_document_then_void_conserves_grant_committed_cents
        grounds:
          - state_machines.ServiceDelivery.DOCUMENTED_to_DRAFT
          - state_machines.ServiceDelivery.DRAFT_to_DOCUMENTED
          - entities.Grant.fields.obligated_cents
          - entities.Grant.fields.expended_cents
          - calculations.braided_cost_allocation
        distinguishing_aspect: |
          The conserved quantity is money: the document-then-void pair restores
          Grant.expended_cents + Grant.obligated_cents to its pre-document value of 0, reverses
          every CostAllocation line to zero and returns the grant from FROZEN to OPEN, leaving no
          cent of drift in the named quantity.
        test_recipe:
          setup:
            - "empty DB; logical clock 2026-10-02T00:00:00Z"
            - "Funder FED, Program HOUSING_PGM (capacity_slots 5, nondiscrimination_attested true), Grant G1 (rank 1, DIRECT_ONLY, total_award_cents 54000, admin_rate_pct 0.10, period 2026-01-01T00:00:00Z to 2027-09-30T00:00:00Z, obligated_cents 0, expended_cents 0, burn_ratio 0.000000, status OPEN)"
            - "Client One with an ACTIVE enrollment on G1 and an ACTIVE HOUSING_RENT_ASSIST authorization (authorized_units 20, unit_rate_cents 4500)"
            - "DEL_1 is a DRAFT delivery of 12 units at 4500 = 54000 cents against G1, not yet documented"
          setup_api_calls:
            - call: "POST /api/funders"
              payload: { name: "FED", funder_type: "FEDERAL", allow_faith_based_activity: false, requires_time_and_effort_documentation: true, max_admin_rate_pct: 0.25, fiscal_year_start_month: 10 }
              as: ComplianceOfficer
              captures: { fnd: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "HOUSING_PGM", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 5, match_eligible: true }
              as: ComplianceOfficer
              captures: { prg: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G1", total_award_cents: 54000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-01-01T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { full_name: "Client One", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK", confidentiality_tier: "STANDARD" }
              as: IntakeSpecialist
              captures: { cli_1: "$.data.id" }
            - call: "POST /api/clients/${cli_1}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { asm_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/eligibility-screens"
              payload: { program_id: "${prg}", grant_id: "${g1}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { scr_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${asm_1}/route"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/enrollments"
              payload: { client_id: "${cli_1}" }
              as: ProgramManager
              captures: { enr_1: "$.data[0].id" }
            - call: "POST /api/enrollments/${enr_1}/activate"
              payload: {}
              as: ProgramManager
              captures: { enr_1_v: "$.data.version" }
            - call: "POST /api/service-authorizations"
              payload: { enrollment_id: "${enr_1}", grant_id: "${g1}", service_code: "HOUSING_RENT_ASSIST", authorized_units: 20, unit_rate_cents: 4500, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z", expected_enrollment_version: "${enr_1_v}" }
              as: ProgramManager
              captures: { aut_1: "$.data.id", aut_1_v: "$.data.version" }
            - call: "POST /api/service-deliveries"
              payload: { service_authorization_id: "${aut_1}", grant_id: "${g1}", client_id: "${cli_1}", service_date: "2026-10-02T00:00:00Z", units_delivered: 12, unit_rate_cents: 4500, expected_service_authorization_version: "${aut_1_v}" }
              as: ProgramManager
              captures: { del_1: "$.data.id" }
          trigger:
            - call: "GET /api/grants/${g1}"
              payload: {}
              as: FinanceOfficer
              captures: { pre_obligated: "$.data.obligated_cents", pre_expended: "$.data.expended_cents" }
            - call: "POST /api/service-deliveries/${del_1}/document"
