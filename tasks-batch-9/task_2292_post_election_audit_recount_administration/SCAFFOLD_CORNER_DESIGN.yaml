          - validations[priority=45]
          - errors[ERR_MARGIN_NOT_RECOUNT_ELIGIBLE]
          - calculations.recount_trigger_evaluation
          - endpoints.POST_/recounts
        distinguishing_aspect: |
          The eligibility ceiling applies only to CANDIDATE_REQUESTED filings and only above
          REQUEST_ELIGIBLE_MARGIN_PCT 10.0000: a 12.0000 margin is refused 409 before any deposit is priced,
          while the 5.0000 contest in the same election accepts the identical request and prices it at
          200000 cents.
        test_recipe:
          setup:
            - "Election ST-01 with contest C1 (6000 ballots, six 1000-ballot batches) and contest CW"
            - "(1000 ballots, SOTO/TRAN, no batches). C1 is canvassed 3150 / 2850 (margin_pct 5.0000)"
            - "and CW is canvassed 560 / 440 (margin 120 of 1000 = 12.0000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "CW", office_name: "Soil Conservation Supervisor", contest_type: "CANDIDATE", candidate_names: ["SOTO", "TRAN"], ballots_cast: 1000 }
              as: ElectionsDirector
              captures: { cw_id: "$.data.id" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
            - call: "POST /contests/${cw_id}/canvass-results"
              payload: { reported_votes: { SOTO: 560, TRAN: 440 } }
              as: ElectionsDirector
              captures: { cw_v: "$.data.version", cw_pct: "$.data.margin_pct" }
          trigger:
            - call: "POST /recounts"
              payload: { contest_id: "${cw_id}", expected_contest_version: "${cw_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "FULL_CONTEST", requested_by_candidate_name: "TRAN" }
              as: CandidateRepresentative
              as_user_id: "u-cand-2"
              captures: { err_margin: "$.data.error_id" }
            - call: "POST /recounts"
              payload: { contest_id: "${c1_id}", expected_contest_version: "${c1_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "FULL_CONTEST", requested_by_candidate_name: "BRENNAN" }
              as: CandidateRepresentative
              as_user_id: "u-cand-1"
              captures: { rc_req: "$.data.required_deposit_cents" }
          assert:
            - "${cw_pct} == 12.0000 and Contest.${cw_id}.automatic_recount_required == false"
            - "${err_margin} == ERR_MARGIN_NOT_RECOUNT_ELIGIBLE with response status 409"
            - "Contest.${cw_id}.open_recount_count == 0 and no Recount row references ${cw_id}"
            - "${rc_req} == 200000 and the second call returns 201"
            - "Contest.${c1_id}.open_recount_count == 1"
      - name: priority_recount_state_precedes_deposit_amount
        claim_type: Priority conflict
        grounds:
          - validations[priority=14]
          - validations[priority=48]
          - errors[ERR_INVALID_RECOUNT_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_invalid_recount_state_precedes_deposit_insufficient
          rationale: "That instance funds an already-funded recount with a wrong amount so both rules are violated and asserts the priority-14 state error, then repairs each violation in turn to show the ordering is not accidental."
      - name: priority_stale_version_precedes_quarantine_state
        claim_type: Priority ordering
        grounds:
          - validations[priority=13]
          - validations[priority=19]
          - errors[ERR_STALE_BALLOT_BATCH_VERSION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_stale_ballot_batch_version_precedes_batch_quarantined
          rationale: "That instance retrieves a quarantined batch with a stale expected_ballot_batch_version and asserts the 412 concurrency error wins over the 409 custody error."
      - name: priority_session_overlap_precedes_duplicate_tally
        claim_type: Priority conflict
        grounds:
          - validations[priority=31]
          - validations[priority=38]
          - errors[ERR_TEAM_SESSION_OVERLAP]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_team_session_overlap_precedes_duplicate_tally
          rationale: "That instance opens a second count on the same drawn batch inside the same team session so both rules fire, and asserts the overlap error at priority 31 rather than the duplicate-tally error at priority 38."
  # ===========================================================================
  - section: endpoints
