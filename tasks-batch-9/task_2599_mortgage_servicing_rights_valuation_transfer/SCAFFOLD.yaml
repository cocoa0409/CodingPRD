# =============================================================================
# SCAFFOLD.yaml — Mortgage Servicing Rights Valuation & Transfer Desk
# Sections §1.0 – §1.7. Difficulty design (§1.8) and corner design (§1.9)
# live in the two sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2599. Mortgage Servicing Rights Valuation & Transfer (mortgage servicing rights transaction desk):
  valuation model with prepayment speed, discount rate, cost-to-service and float assumptions,
  portfolio stratification and bid package preparation with loan-level tapes, agency and investor
  approval prerequisites for transfer of servicing, purchase agreement with holdbacks,
  representations and indemnification periods, servicing transfer notices to borrowers within
  statutory timelines, data mapping and escrow, suspense and loss-mitigation pipeline transfer,
  post-transfer error resolution, complaint spikes and holdback release, hedging of the servicing
  asset against rate moves

domain_name: mortgage-servicing-rights-transfer
api_prefix: "/msr"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # ServicingPortfolio/Loan form a tree, but TapeLine is a true junction
  # (BidPackage x Loan), BorrowerNotice and ErrorResolutionCase each carry two
  # independent FKs (ServicingTransfer x Loan), and HedgePosition /
  # ValuationRun / BidPackage all point at RateCurveSnapshot-derived market
  # state. The reachability graph is many-to-many, not a hierarchy.

  state_machine_shape: parallel
  # Bid is CYCLIC (SUBMITTED -> COUNTERED -> REVISED -> COUNTERED ...),
  # ServicingTransfer carries THREE independent state dimensions
  # (notice_status x data_status x pipeline_status) plus a compound
  # `readiness` derived from all three, PurchaseAgreement is BRANCHING
  # (APPROVED | CONDITIONALLY_APPROVED | TERMINATED with divergent
  # side-effect sets), ErrorResolutionCase is CYCLIC with a bounded loop.

  relationship_patterns:
    - one_to_many        # ServicingPortfolio -> Loan, BidPackage -> Bid
    - many_to_many       # TapeLine junction: BidPackage x Loan
    - cross_aggregate    # BorrowerNotice / ErrorResolutionCase reference both
                         # ServicingTransfer and Loan across aggregate roots
    - polymorphic        # ApprovalRequest.approver_type = AGENCY | INVESTOR
                         # selects which prerequisite predicate applies

  role_model: segregation_of_duties
  # Three explicit SoD rules keyed on X-User-ID: (1) the AgencyApprover who
  # decided one ApprovalRequest cannot decide a second one on the same
  # PurchaseAgreement; (2) the ComplianceOfficer who attested notice
  # compliance cannot authorize the holdback release; (3) the operator who
  # ran the ValuationRun bound to a BidPackage cannot award that package.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Counterparty
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the servicer or investor institution."
        constraints: "1..120 chars, non-blank"
      - name: role_type
        type: enum
        source: input
        description: "Which side of the trade this institution may act on."
        constraints: "one of SELLER, BUYER"
      - name: net_worth_cents
        type: integer
        source: input
        description: "Audited tangible net worth in cents; drives the capital penalty in calculations.counterparty_transfer_risk_score."
        constraints: ">= 0"
      - name: servicer_rating
        type: enum
        source: input
        description: "Agency servicer rating tier."
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: agency_approvals
        type: array
        source: input
        description: "Agency seller/servicer approvals this institution currently holds."
        default: "[]"
        constraints: "subset of {FNMA, FHLMC, GNMA}, no duplicates"
      - name: status
        type: enum
        source: system
        description: "Trading status; SUSPENDED institutions may not bid and may not be awarded."
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: suspended_at
        type: datetime
        source: system
        description: "Logical-clock instant at which POST /msr/counterparties/{id}/suspend was accepted; null while ACTIVE."
      - name: open_transfer_count
        type: integer
        source: computed
        description: "Count of ServicingTransfer rows whose PurchaseAgreement.buyer_id equals this Counterparty.id and whose ServicingTransfer.status == IN_PROGRESS."

  - name: ServicingPortfolio
    parent: Counterparty
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Counterparty.id; the selling servicer, which MUST have role_type == SELLER."
      - name: portfolio_name
        type: string
        source: input
        description: "Desk label for the pool being marketed."
        constraints: "1..120 chars, non-blank"
      - name: agency_type
        type: enum
        source: input
        description: "Agency whose transfer-of-servicing consent governs this pool."
        constraints: "one of FNMA, FHLMC, GNMA"
      - name: status
        type: enum
        source: system
        description: "Portfolio lifecycle state; see state_machines.ServicingPortfolio."
        default: DRAFT
        constraints: "one of DRAFT, TAPE_LOCKED, UNDER_CONTRACT, TRANSFERRED"
      - name: loan_count
        type: integer
        source: computed
        description: "Count of Loan rows with portfolio_id == this id and status == ACTIVE."
        default: 0
      - name: total_upb_cents
        type: integer
        source: computed
        description: "Sum of Loan.upb_cents over Loan rows with portfolio_id == this id and status == ACTIVE."
        default: 0
      - name: weighted_avg_note_rate_pct
        type: number
        source: computed
        description: "UPB-weighted note rate over Loan rows with status == ACTIVE: sum(upb_cents * note_rate_pct) / sum(upb_cents), round_half_up to 4 decimals; 0.0000 when loan_count == 0."
        default: 0.0
      - name: custodial_funds_total_cents
        type: integer
        source: computed
        description: "Cross-entity conserved quantity: sum over Loan rows in this portfolio of (escrow_balance_cents + suspense_balance_cents) PLUS sum over ServicingTransfer rows reachable through PurchaseAgreement.bid_package_id -> BidPackage.portfolio_id == this id of (escrow_transferred_cents + suspense_transferred_cents)."
        default: 0
      - name: valuation_freshness
        type: enum
        source: computed
        description: "NONE when no ValuationRun exists for this portfolio; STALE when calculations.effective_valuation_selection resolves to a run whose status == STALE; CURRENT when it resolves to a run whose status == COMPLETED."
        default: NONE
        constraints: "one of NONE, CURRENT, STALE"
      - name: tape_locked_at
        type: datetime
        source: system
        description: "Logical-clock instant the tape was locked; null while DRAFT."

  - name: Loan
    parent: ServicingPortfolio
    common_fields: true
    fields:
      - name: portfolio_id
        type: string
        source: input
        description: "FK -> ServicingPortfolio.id; owning pool. Supplied by the path segment, not the body."
      - name: loan_number
        type: string
        source: input
        description: "Servicer loan number; unique within the owning portfolio."
        constraints: "1..32 chars, non-blank, unique per portfolio_id"
      - name: upb_cents
        type: integer
        source: input
        description: "Unpaid principal balance in cents."
        constraints: ">= 1"
      - name: note_rate_pct
        type: number
        source: input
        description: "Note rate in percent, e.g. 6.5 for 6.50%."
        constraints: "> 0 and <= 25, at most 4 decimals"
      - name: servicing_fee_bps
        type: integer
        source: input
        description: "Contractual servicing fee strip in basis points of UPB per annum."
        constraints: ">= 1 and <= 100"
      - name: escrow_balance_cents
        type: integer
        source: input
        description: "Borrower escrow (tax and insurance) balance held in the custodial account."
        default: 0
        constraints: ">= 0"
      - name: suspense_balance_cents
        type: integer
        source: input
        description: "Unapplied funds held in suspense for this loan."
        default: 0
        constraints: ">= 0"
      - name: delinquency_bucket
        type: enum
        source: input
        description: "Delinquency stratum; drives the cost-to-service multiplier in calculations.msr_fair_value."
        default: CURRENT
        constraints: "one of CURRENT, DQ_30_59, DQ_60_89, DQ_90_PLUS, FORECLOSURE"
      - name: loss_mit_status
        type: enum
        source: input
        description: "Loss-mitigation posture; drives the additive cost surcharge in calculations.msr_fair_value and the loss-mit pipeline count on transfer."
        default: NONE
        constraints: "one of NONE, TRIAL_MOD, PERMANENT_MOD, FORBEARANCE"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the mortgaged property; a stratum key under BY_STATE."
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: "ACTIVE until the servicing transfer completes, then TRANSFERRED."
        default: ACTIVE
        constraints: "one of ACTIVE, TRANSFERRED"
      - name: escrow_balance_at_mapping_cents
        type: integer
        source: system
        description: "Snapshot of escrow_balance_cents taken when POST /msr/servicing-transfers/{id}/map-escrow swept this loan; the rollback endpoint restores from this field. Null before mapping."
      - name: suspense_balance_at_mapping_cents
        type: integer
        source: system
        description: "Snapshot of suspense_balance_cents taken at escrow mapping; the rollback endpoint restores from this field. Null before mapping."
      - name: transferred_at
        type: datetime
        source: system
        description: "Logical-clock instant this loan flipped to TRANSFERRED; null while ACTIVE."

  - name: AssumptionSet
    parent: null
    common_fields: false
    fields:
      - name: assumption_name
        type: string
        source: input
        description: "Label for the assumption vector, e.g. 'Desk Base Case Aug-2026'."
        constraints: "1..80 chars, non-blank"
      - name: cpr_pct
        type: number
        source: input
        description: "Annual constant prepayment rate in percent; the prepayment speed applied to UPB decay."
        constraints: "> 0 and < 100, at most 4 decimals"
      - name: discount_rate_pct
        type: number
        source: input
        description: "Nominal annual discount rate in percent applied to projected net servicing cash flows before the rate-curve adjustment."
        constraints: "> 0 and <= 40, at most 4 decimals"
      - name: cost_to_service_annual_cents
        type: integer
        source: input
        description: "Base direct cost to service one performing loan for one year, in cents."
        constraints: ">= 0"
      - name: float_earnings_rate_pct
        type: number
        source: input
        description: "Annual earnings rate credited on escrow float before the rate-curve adjustment."
        constraints: ">= 0 and <= 40, at most 4 decimals"
      - name: projection_years
        type: integer
        source: input
        description: "Number of whole projection years in the cash-flow model."
        default: 3
        constraints: ">= 1 and <= 10"

  - name: RateCurveSnapshot
    parent: null
    common_fields: true
    fields:
      - name: as_of_date
        type: string
        source: input
        description: "Market date of the curve, ISO 8601 calendar date (YYYY-MM-DD). MUST be strictly greater than the as_of_date of the currently ACTIVE snapshot."
        constraints: "YYYY-MM-DD"
      - name: base_rate_bps
        type: integer
        source: input
        description: "Benchmark par mortgage rate in basis points; 4000 is the model reference rate (REFERENCE_RATE_BPS)."
        constraints: ">= 100 and <= 8000"
      - name: primary_secondary_spread_bps
        type: integer
        source: input
        description: "Primary/secondary spread in basis points, retained for disclosure only; it does not enter any calculation formula."
        default: 25
        constraints: ">= 0 and <= 200"
      - name: status
        type: enum
        source: system
        description: "Exactly one snapshot is ACTIVE at a time; publishing a new snapshot supersedes the incumbent."
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED"
      - name: superseded_at
        type: datetime
        source: system
        description: "Logical-clock instant this snapshot was superseded; null while ACTIVE."
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HedgeDesk operator that published the snapshot."

  - name: ValuationRun
    parent: ServicingPortfolio
    common_fields: true
    fields:
      - name: portfolio_id
        type: string
        source: input
        description: "FK -> ServicingPortfolio.id; the pool being valued. Supplied by the path segment."
      - name: assumption_set_id
        type: string
        source: input
        description: "FK -> AssumptionSet.id; the immutable assumption vector this run was executed against."
      - name: rate_curve_snapshot_id
        type: string
        source: system
        description: "FK -> RateCurveSnapshot.id; the snapshot that was ACTIVE when the run executed, resolved by calculations.active_rate_curve_selection."
      - name: method
        type: enum
        source: input
        description: "Which variant of calculations.msr_fair_value to execute."
        constraints: "one of DETERMINISTIC_STATIC, OAS_SHOCK_WEIGHTED"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic 1-based counter within the owning portfolio; the deterministic ranking key for calculations.effective_valuation_selection."
      - name: status
        type: enum
        source: system
        description: "COMPLETED on creation (the model runs synchronously); STALE once the bound rate-curve snapshot is superseded; SUPERSEDED is terminal."
        default: COMPLETED
        constraints: "one of COMPLETED, STALE, SUPERSEDED"
      - name: value_cents
        type: integer
        source: computed
        description: "Fair value of the servicing asset in cents, produced by calculations.msr_fair_value under the selected method."
      - name: value_bps_of_upb
        type: number
        source: computed
        description: "round_half_up(value_cents * 10000 / ServicingPortfolio.total_upb_cents, 2); 0.00 when total_upb_cents == 0."
      - name: included_loan_count
        type: integer
        source: computed
        description: "Count of Loan rows that entered the valuation input set (portfolio_id match AND status == ACTIVE)."
      - name: effective_discount_rate_pct
        type: number
        source: computed
        description: "AssumptionSet.discount_rate_pct + (RateCurveSnapshot.base_rate_bps - 4000) / 100, round_half_up to 4 decimals."
      - name: scenario_values
        type: object
        source: computed
        description: "Map {DOWN_50, BASE, UP_50} -> scenario value in cents; populated only when method == OAS_SHOCK_WEIGHTED, otherwise null."
      - name: run_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ValuationAnalyst that executed the run; consumed by the award segregation-of-duties rule."
      - name: staled_at
        type: datetime
        source: system
        description: "Logical-clock instant the run flipped to STALE; null otherwise."

  - name: BidPackage
    parent: ServicingPortfolio
    common_fields: true
    fields:
      - name: portfolio_id
        type: string
        source: input
        description: "FK -> ServicingPortfolio.id; the pool being offered."
      - name: valuation_run_id
        type: string
        source: input
        description: "FK -> ValuationRun.id; the run whose value_cents anchors the reserve price."
      - name: stratification_scheme
        type: enum
        source: input
        description: "How loan-level tape lines are bucketed by calculations.tape_stratification."
        constraints: "one of BY_STATE, BY_NOTE_RATE, BY_DELINQUENCY"
      - name: reserve_price_floor_pct
        type: number
        source: input
        description: "Percent of the anchored valuation the desk will accept, e.g. 95 for 95%."
        constraints: ">= 50 and <= 150, at most 2 decimals"
      - name: marketing_start_at
        type: datetime
        source: input
        description: "Inclusive start of the marketing window on the owning portfolio."
      - name: bid_deadline_at
        type: datetime
        source: input
        description: "Exclusive end of the marketing window; bids are refused at or after this instant."
        constraints: "strictly greater than marketing_start_at"
      - name: status
        type: enum
        source: system
        description: "Package lifecycle; see state_machines.BidPackage."
        default: DRAFT
        constraints: "one of DRAFT, STRATIFIED, PUBLISHED, BIDDING_SUSPENDED, AWARDED, CANCELLED"
      - name: tape_upb_cents
        type: integer
        source: computed
        description: "Sum of TapeLine.upb_snapshot_cents over TapeLine rows of this package with included == true whose Loan.status == ACTIVE."
        default: 0
      - name: tape_loan_count
        type: integer
        source: computed
        description: "Count of TapeLine rows of this package with included == true whose Loan.status == ACTIVE."
        default: 0
      - name: stratum_count
        type: integer
        source: computed
        description: "Number of distinct TapeLine.stratum_label values among included tape lines."
        default: 0
      - name: reserve_price_cents
        type: integer
        source: computed
        description: "Stamped by calculations.reserve_price at publish time; null before publish."
      - name: bid_count
        type: integer
        source: computed
        description: "Count of Bid rows with bid_package_id == this id, in any status."
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publish; null before."
      - name: suspended_reason
        type: enum
        source: system
        description: "Why the package stopped accepting bids; null unless status == BIDDING_SUSPENDED."
        constraints: "one of VALUATION_STALE"

  - name: TapeLine
    parent: BidPackage
    common_fields: true
    fields:
      - name: bid_package_id
        type: string
        source: input
        description: "FK -> BidPackage.id; the package whose loan-level tape this line belongs to."
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan this line scrubs onto the tape."
      - name: stratum_label
        type: string
        source: computed
        description: "Bucket label assigned by calculations.tape_stratification under the package's stratification_scheme."
      - name: included
        type: boolean
        source: input
        description: "Whether this loan is offered on the tape; excluded lines leave tape_upb_cents and the purchase price."
        default: true
      - name: exclusion_reason
        type: enum
        source: input
        description: "Why the line was pulled; MUST be present when included == false and MUST be null when included == true."
        constraints: "one of DOCUMENT_DEFECT, LITIGATION, INVESTOR_RESTRICTION"
      - name: upb_snapshot_cents
        type: integer
        source: system
        description: "Loan.upb_cents copied at stratification time; the pricing basis so later loan drift cannot silently reprice a live package."

  - name: Bid
    parent: BidPackage
    common_fields: true
    fields:
      - name: bid_package_id
        type: string
        source: input
        description: "FK -> BidPackage.id; the package being bid on. Supplied by the path segment."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Counterparty.id; the bidding institution, which MUST have role_type == BUYER."
      - name: price_bps
        type: integer
        source: input
        description: "Offered price in basis points of tape UPB."
        constraints: ">= 1 and <= 1000"
      - name: holdback_pct
        type: number
        source: input
        description: "Percent of the purchase price the buyer withholds pending the representation period."
        constraints: ">= 0 and <= 25, at most 2 decimals"
      - name: round_number
        type: integer
        source: system
        description: "Negotiation round; 1 on submission, incremented by each accepted revise."
        default: 1
      - name: status
        type: enum
        source: system
        description: "Bid lifecycle; see state_machines.Bid (cyclic COUNTERED <-> REVISED)."
        default: SUBMITTED
        constraints: "one of SUBMITTED, COUNTERED, REVISED, ACCEPTED, REJECTED, LAPSED"
      - name: bid_value_cents
        type: integer
        source: computed
        description: "round_half_up(BidPackage.tape_upb_cents * price_bps / 10000, 0) — a single rounding over the WHOLE tape; deliberately distinct from calculations.purchase_price which rounds per stratum."
      - name: counter_price_bps
        type: integer
        source: system
        description: "Price the desk countered at; null until a counter is issued."
      - name: counter_expires_at
        type: datetime
        source: system
        description: "Instant after which the counter may no longer be revised against; null until a counter is issued."

  - name: PurchaseAgreement
    parent: BidPackage
    common_fields: true
    fields:
      - name: bid_package_id
        type: string
        source: input
        description: "FK -> BidPackage.id; the awarded package."
      - name: winning_bid_id
        type: string
        source: input
        description: "FK -> Bid.id; the accepted bid whose price and holdback drive the economics."
      - name: buyer_id
        type: string
        source: system
        description: "FK -> Counterparty.id; copied from the winning Bid.bidder_id."
      - name: purchase_price_cents
        type: integer
        source: computed
        description: "Produced by calculations.purchase_price (per-stratum rounding, then summed in ascending stratum_label order)."
      - name: stratum_price_breakdown
        type: object
        source: computed
        description: "Map stratum_label -> per-stratum price in cents, in ascending stratum_label order; the audit trail for the pinned rounding order."
      - name: holdback_pct
        type: number
        source: system
        description: "Copied from the winning Bid.holdback_pct at award."
      - name: holdback_cents
        type: integer
        source: computed
        description: "Produced by calculations.holdback_sizing; re-sized upward on the CONDITIONALLY_APPROVED branch."
      - name: holdback_retained_cents
        type: integer
        source: system
        description: "Unreleased holdback still on deposit; initialised to holdback_cents."
        default: 0
      - name: holdback_released_cents
        type: integer
        source: system
        description: "Cumulative cash returned to the seller."
        default: 0
      - name: holdback_applied_cents
        type: integer
        source: system
        description: "Cumulative holdback consumed by borrower remediation. Invariant: holdback_cents == holdback_retained_cents + holdback_released_cents + holdback_applied_cents."
        default: 0
      - name: settlement_wire_cents
        type: integer
        source: computed
        description: "purchase_price_cents - holdback_cents, recomputed whenever holdback_cents is re-sized."
      - name: rep_warrant_days
        type: integer
        source: input
        description: "Length of the representation-and-warranty period in days, measured from transfer_date."
        default: 180
        constraints: ">= 30 and <= 730"
      - name: indemnification_days
        type: integer
        source: input
        description: "Length of the indemnification period in days from transfer_date; MUST be >= rep_warrant_days and <= 1825."
        default: 365
        constraints: ">= rep_warrant_days and <= 1825"
      - name: sale_date
        type: string
        source: system
        description: "Economic sale date (YYYY-MM-DD), set at settle; null before."
      - name: transfer_date
        type: string
        source: system
        description: "Servicing transfer effective date (YYYY-MM-DD), set at settle; the statutory anchor for borrower notices."
      - name: holdback_release_eligible_at
        type: string
        source: computed
        description: "transfer_date + rep_warrant_days calendar days (YYYY-MM-DD); null until settle."
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle; see state_machines.PurchaseAgreement (branching)."
        default: DRAFTED
        constraints: "one of DRAFTED, PENDING_APPROVALS, APPROVED, CONDITIONALLY_APPROVED, SETTLED, HOLDBACK_RELEASED, CLOSED, TERMINATED"
      - name: approval_pending_count
        type: integer
        source: computed
        description: "Count of ApprovalRequest rows with purchase_agreement_id == this id and status == PENDING."
        default: 0
      - name: condition_count
        type: integer
        source: computed
        description: "Count of ApprovalRequest rows with purchase_agreement_id == this id and status == CONDITIONALLY_APPROVED."
        default: 0
      - name: condition_waiver_reference
        type: string
        source: input
        description: "External waiver document reference; REQUIRED at settle when status == CONDITIONALLY_APPROVED, otherwise MUST be omitted."
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TransactionManager that awarded the package."
      - name: termination_reason
        type: enum
        source: system
        description: "Why the agreement died; null unless status == TERMINATED."
        constraints: "one of APPROVAL_DENIED"

  - name: ApprovalRequest
    parent: PurchaseAgreement
    common_fields: true
    fields:
      - name: purchase_agreement_id
        type: string
        source: input
        description: "FK -> PurchaseAgreement.id; the agreement whose transfer of servicing needs consent."
      - name: approver_type
        type: enum
        source: input
        description: "AGENCY consent (transfer of servicing approval) or INVESTOR consent."
        constraints: "one of AGENCY, INVESTOR"
      - name: agency_type
        type: enum
        source: input
        description: "Which agency is consenting; REQUIRED when approver_type == AGENCY (and MUST equal the portfolio's agency_type), MUST be omitted when approver_type == INVESTOR."
        constraints: "one of FNMA, FHLMC, GNMA"
      - name: status
        type: enum
        source: system
        description: "PENDING until decided; all three decision states are terminal."
        default: PENDING
        constraints: "one of PENDING, APPROVED, CONDITIONALLY_APPROVED, DENIED"
      - name: condition_text
        type: string
        source: input
        description: "Free-text condition; REQUIRED when the decision is CONDITIONALLY_APPROVED, MUST be omitted otherwise."
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AgencyApprover that decided; the key the segregation-of-duties rule compares across sibling requests."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the decision; null while PENDING."

  - name: ServicingTransfer
    parent: PurchaseAgreement
    common_fields: true
    fields:
      - name: purchase_agreement_id
        type: string
        source: input
        description: "FK -> PurchaseAgreement.id; created as a side effect of settle, one per agreement."
      - name: transfer_date
        type: string
        source: system
        description: "Copied from PurchaseAgreement.transfer_date at creation (YYYY-MM-DD)."
      - name: notice_status
        type: enum
        source: system
        description: "Dimension 1 of 3 (borrower notices). Advances independently of data_status and pipeline_status."
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, NOTICES_IN_PROGRESS, NOTICES_ATTESTED"
      - name: data_status
        type: enum
        source: system
        description: "Dimension 2 of 3 (data mapping and custodial funds). Cycles ESCROW_MAPPED -> MAPPED when the escrow sweep is rolled back."
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, MAPPED, ESCROW_MAPPED, RECONCILED"
      - name: pipeline_status
        type: enum
        source: system
        description: "Dimension 3 of 3 (loss-mitigation and suspense pipeline handoff)."
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, PIPELINE_TRANSFERRED"
      - name: readiness
        type: enum
        source: computed
        description: "READY iff notice_status == NOTICES_ATTESTED AND data_status == RECONCILED AND pipeline_status == PIPELINE_TRANSFERRED; NOT_READY otherwise."
        default: NOT_READY
        constraints: "one of NOT_READY, READY"
      - name: status
        type: enum
        source: system
        description: "Overall transfer state; COMPLETED only from readiness == READY."
        default: IN_PROGRESS
        constraints: "one of IN_PROGRESS, COMPLETED"
      - name: mapping_scheme
        type: enum
        source: input
        description: "Servicing-system mapping template chosen at map-data; null before."
        constraints: "one of MSP_TO_MSP, MSP_TO_LSAMS, CUSTOM"
      - name: escrow_transferred_cents
        type: integer
        source: system
        description: "Custodial escrow swept from loans into the buyer's account by map-escrow; returned to the loans by rollback-escrow-mapping."
        default: 0
      - name: suspense_transferred_cents
        type: integer
        source: system
        description: "Unapplied-funds suspense swept from loans by map-escrow; returned by rollback-escrow-mapping."
        default: 0
      - name: loss_mit_pipeline_count
        type: integer
        source: computed
        description: "Count of Loan rows on the awarded tape (TapeLine.included == true) whose loss_mit_status != NONE."
        default: 0
      - name: transferred_loan_count
        type: integer
        source: computed
        description: "Count of Loan rows on the awarded tape whose status == TRANSFERRED; the denominator of calculations.complaint_concentration_release."
        default: 0
      - name: onboarding_window_start
        type: string
        source: computed
        description: "transfer_date minus 30 calendar days (YYYY-MM-DD); the inclusive lower bound of the buyer's onboarding blackout."
      - name: onboarding_window_end
        type: string
        source: computed
        description: "transfer_date plus 30 calendar days (YYYY-MM-DD); the inclusive upper bound of the buyer's onboarding blackout."
      - name: notice_count
        type: integer
        source: computed
        default: 0
        description: "Count of BorrowerNotice rows on this transfer."
      - name: late_notice_count
        type: integer
        source: computed
        default: 0
        description: "Count of BorrowerNotice rows on this transfer with compliance_status == LATE. Must be 0 to attest."
      - name: notice_attested_at
        type: datetime
        source: system
        description: "Logical-clock instant at which notice compliance was attested; null until then."
      - name: reconciled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the custodial reconciliation passed; null until then."
      - name: notice_attested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that attested notice compliance; the holdback-release segregation-of-duties rule refuses this same id."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null while IN_PROGRESS."

  - name: BorrowerNotice
    parent: ServicingTransfer
    common_fields: false
    fields:
      - name: servicing_transfer_id
        type: string
        source: input
        description: "FK -> ServicingTransfer.id; the transfer this notice discloses. Supplied by the path segment."
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the borrower's loan. MUST sit on the awarded tape with TapeLine.included == true."
      - name: notice_type
        type: enum
        source: input
        description: "TRANSFEROR_15DAY and COMBINED must precede the transfer date by at least 15 days; TRANSFEREE_15DAY must follow it by at most 15 days."
        constraints: "one of TRANSFEROR_15DAY, TRANSFEREE_15DAY, COMBINED"
      - name: effective_date
        type: string
        source: input
        description: "Servicing transfer effective date disclosed to the borrower (YYYY-MM-DD); MUST equal ServicingTransfer.transfer_date."
        constraints: "YYYY-MM-DD"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant the notice was issued; the measurement point for the statutory window."
      - name: lead_days
        type: integer
        source: computed
        description: "Signed calendar-day distance produced by calculations.notice_statutory_window: (transfer_date - date(sent_at)) for TRANSFEROR_15DAY and COMBINED, (date(sent_at) - transfer_date) for TRANSFEREE_15DAY."
      - name: compliance_status
        type: enum
        source: computed
        description: "COMPLIANT when lead_days satisfies the statutory bound for notice_type, LATE otherwise."
        constraints: "one of COMPLIANT, LATE"
      - name: sent_by_role
        type: enum
        source: system
        description: "Which side issued the notice, taken from X-User-Role."
        constraints: "one of SellerServicer, BuyerServicer"

  - name: ErrorResolutionCase
    parent: ServicingTransfer
    common_fields: true
    fields:
      - name: servicing_transfer_id
        type: string
        source: input
        description: "FK -> ServicingTransfer.id; the transfer the borrower's notice of error relates to. Supplied by the path segment."
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan complained about. MUST sit on the awarded tape with TapeLine.included == true."
      - name: category
        type: enum
        source: input
        description: "Nature of the asserted error."
        constraints: "one of ESCROW, SUSPENSE, LOSS_MIT, PAYMENT_MISAPPLIED, OTHER"
      - name: description
        type: string
        source: input
        description: "Borrower's asserted error text."
        constraints: "1..500 chars, non-blank"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle; see state_machines.ErrorResolutionCase (cyclic RESOLVED -> REOPENED -> ACKNOWLEDGED, bounded at 2 reopens)."
        default: OPEN
        constraints: "one of OPEN, ACKNOWLEDGED, RESOLVED, REOPENED, ESCALATED"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the case was logged; the anchor for both statutory deadlines."
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: "opened_at plus 5 calendar days."
      - name: resolution_deadline_at
        type: datetime
        source: computed
        description: "opened_at plus 30 calendar days."
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent acknowledgement; null before the first one."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent resolution; null before the first one."
      - name: ack_breached
        type: boolean
        source: computed
        description: "true once an acknowledgement is recorded with acknowledged_at > ack_deadline_at; sticky (a later on-time acknowledgement does not clear it)."
        default: false
      - name: resolution_breached
        type: boolean
        source: computed
        description: "true once a resolution is recorded with resolved_at > resolution_deadline_at; sticky."
        default: false
      - name: remediation_cents
        type: integer
        source: system
        description: "Cumulative remediation credited to the borrower across resolutions; feeds the holdback-application cap."
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: "Number of accepted reopens; the third attempt escalates instead."
        default: 0
      - name: resolution_note
        type: string
        source: system
        description: "Most recent resolution narrative; null before the first resolution."

  - name: HedgePosition
    parent: ServicingPortfolio
    common_fields: true
    fields:
      - name: portfolio_id
        type: string
        source: input
        description: "FK -> ServicingPortfolio.id; the servicing asset being hedged."
      - name: instrument
        type: enum
        source: input
        description: "Long-duration hedge instrument used against the negative duration of the servicing asset."
        constraints: "one of TBA_LONG, SWAPTION_RECEIVER, TREASURY_FUTURE_LONG"
      - name: notional_cents
        type: integer
        source: input
        description: "Face notional of the hedge in cents."
        constraints: ">= 1"
      - name: hedge_ratio_pct
        type: number
        source: input
        description: "Fraction of the notional actually applied, in percent."
        constraints: ">= 1 and <= 200, at most 2 decimals"
      - name: entry_base_rate_bps
        type: integer
        source: system
        description: "RateCurveSnapshot.base_rate_bps of the snapshot that was ACTIVE at creation."
      - name: mark_to_market_cents
        type: integer
        source: computed
        description: "Produced by calculations.hedge_mark_to_market against the currently ACTIVE snapshot; frozen at close_base_rate_bps once CLOSED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN until closed by the desk or by the portfolio reaching TRANSFERRED."
        default: OPEN
        constraints: "one of OPEN, CLOSED"
      - name: close_base_rate_bps
        type: integer
        source: system
        description: "base_rate_bps of the ACTIVE snapshot at close; null while OPEN."
      - name: realized_pnl_cents
        type: integer
        source: system
        description: "mark_to_market_cents frozen at the moment of close; null while OPEN."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of close; null while OPEN."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ServicingPortfolio
    initial_state: DRAFT
    terminal_states: [TRANSFERRED]
    transitions:
      - from: DRAFT
        to: TAPE_LOCKED
        trigger: "POST /msr/portfolios/{id}/lock-tape"
        actor: SellerServicer
        preconditions:
          - "X-User-ID == ServicingPortfolio.seller_id"
          - "loan_count >= 1"
        side_effects:
          - "tape_locked_at = current logical clock"
          - "loan_count, total_upb_cents, weighted_avg_note_rate_pct, custodial_funds_total_cents recomputed and frozen as the pricing basis"
          - "increments ServicingPortfolio.version by 1"
        note: "Loans may no longer be added once locked (ERR_TAPE_LOCKED)."
      - from: TAPE_LOCKED
        to: UNDER_CONTRACT
        trigger: "POST /msr/bid-packages/{id}/award (cascade link 1)"
        actor: TransactionManager
        preconditions:
          - "the awarded BidPackage.portfolio_id == this portfolio id"
        side_effects:
          - "increments ServicingPortfolio.version by 1"
      - from: UNDER_CONTRACT
        to: TAPE_LOCKED
        trigger: "system: PurchaseAgreement enters TERMINATED (cascade from ApprovalRequest DENIED)"
        actor: system
        preconditions:
          - "the terminated PurchaseAgreement is the only non-TERMINATED agreement on this portfolio"
        side_effects:
          - "increments ServicingPortfolio.version by 1"
        note: "Revert edge: the pool goes back on the shelf and may be re-marketed under a new BidPackage."
      - from: UNDER_CONTRACT
        to: TRANSFERRED
        trigger: "system: ServicingTransfer enters COMPLETED (cascade B link 2)"
        actor: system
        preconditions:
          - "every Loan with portfolio_id == this id has status == TRANSFERRED"
        side_effects:
          - "loan_count and total_upb_cents recompute to 0 (their filter is status == ACTIVE)"
          - "weighted_avg_note_rate_pct recomputes to 0.0000"
          - "cascade B link 3: every HedgePosition with portfolio_id == this id and status == OPEN transitions to CLOSED"
          - "increments ServicingPortfolio.version by 1"
        note: "Conditional cascade: if any Loan is still ACTIVE (e.g. it was excluded from the tape), this transition does NOT fire and the portfolio stays UNDER_CONTRACT."

  - entity: ValuationRun
    initial_state: COMPLETED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPLETED
        to: STALE
        trigger: "system: the bound RateCurveSnapshot enters SUPERSEDED (cascade A link 2)"
        actor: system
        preconditions:
          - "ValuationRun.rate_curve_snapshot_id == the snapshot that just became SUPERSEDED"
        side_effects:
          - "staled_at = current logical clock"
          - "owning ServicingPortfolio.valuation_freshness recomputes to STALE when this run is the one selected by calculations.effective_valuation_selection"
          - "cascade A link 3: every BidPackage with valuation_run_id == this run id and status == PUBLISHED transitions to BIDDING_SUSPENDED"
          - "increments ValuationRun.version by 1"
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "POST /msr/portfolios/{id}/valuation-runs (a newer run is created for the same portfolio)"
        actor: ValuationAnalyst
        preconditions:
          - "the new run's portfolio_id equals this run's portfolio_id"
          - "no BidPackage with status IN {PUBLISHED, BIDDING_SUSPENDED, AWARDED} references this run"
        side_effects:
          - "increments ValuationRun.version by 1"
        note: "Supersede is skipped (this run stays COMPLETED) when a live BidPackage still references it, so a published reserve price never loses its anchor."
      - from: STALE
        to: SUPERSEDED
        trigger: "POST /msr/portfolios/{id}/valuation-runs (a newer run is created for the same portfolio)"
        actor: ValuationAnalyst
        preconditions:
          - "the new run's portfolio_id equals this run's portfolio_id"
          - "no BidPackage with status IN {PUBLISHED, BIDDING_SUSPENDED, AWARDED} references this run"
        side_effects:
          - "increments ValuationRun.version by 1"

  - entity: RateCurveSnapshot
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /msr/rate-curves (cascade A link 1)"
        actor: HedgeDesk
        preconditions:
          - "the new snapshot's as_of_date is strictly greater than this snapshot's as_of_date"
        side_effects:
          - "superseded_at = current logical clock"
          - "cascade A link 2: every ValuationRun with rate_curve_snapshot_id == this id and status == COMPLETED transitions to STALE"
          - "fan-out (not part of the cascade chain): every HedgePosition with status == OPEN has mark_to_market_cents recomputed against the new ACTIVE snapshot"
          - "increments RateCurveSnapshot.version by 1"
        note: "Cascade A continues transitively: SUPERSEDED snapshot -> STALE ValuationRun -> BIDDING_SUSPENDED BidPackage -> LAPSED Bid (depth 4)."

  - entity: BidPackage
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: STRATIFIED
        trigger: "POST /msr/bid-packages/{id}/stratify"
        actor: ValuationAnalyst
        preconditions:
          - "owning ServicingPortfolio.status == TAPE_LOCKED"
          - "bound ValuationRun.portfolio_id == BidPackage.portfolio_id"
        side_effects:
          - "one TapeLine created per Loan of the portfolio with status == ACTIVE, included = true, upb_snapshot_cents copied from Loan.upb_cents"
          - "stratum_label assigned to every TapeLine by calculations.tape_stratification"
          - "tape_upb_cents, tape_loan_count, stratum_count recomputed"
          - "increments BidPackage.version by 1"
      - from: STRATIFIED
        to: PUBLISHED
        trigger: "POST /msr/bid-packages/{id}/publish"
        actor: TransactionManager
        preconditions:
          - "bound ValuationRun.status == COMPLETED (a STALE run is refused with ERR_VALUATION_STALE)"
          - "tape_loan_count >= 1"
          - "no other BidPackage on the same portfolio with status IN {STRATIFIED, PUBLISHED, BIDDING_SUSPENDED} has a marketing window overlapping [marketing_start_at, bid_deadline_at)"
        side_effects:
          - "reserve_price_cents stamped by calculations.reserve_price"
          - "published_at = current logical clock"
          - "increments BidPackage.version by 1"
      - from: PUBLISHED
        to: BIDDING_SUSPENDED
        trigger: "system: the bound ValuationRun enters STALE (cascade A link 3)"
        actor: system
        preconditions:
          - "BidPackage.valuation_run_id == the run that just became STALE"
        side_effects:
          - "suspended_reason = VALUATION_STALE"
          - "cascade A link 4: every Bid with bid_package_id == this id and status IN {SUBMITTED, COUNTERED, REVISED} transitions to LAPSED"
          - "increments BidPackage.version by 1"
      - from: PUBLISHED
        to: AWARDED
        trigger: "POST /msr/bid-packages/{id}/award"
        actor: TransactionManager
        preconditions:
          - "the nominated Bid.bid_package_id == this id and Bid.status IN {SUBMITTED, REVISED}"
          - "the nominated Bid's bidder Counterparty.status == ACTIVE"
          - "X-User-ID != bound ValuationRun.run_by_user_id (segregation of duties)"
        side_effects:
          - "nominated Bid transitions SUBMITTED|REVISED -> ACCEPTED"
          - "every other Bid on this package with status IN {SUBMITTED, COUNTERED, REVISED} transitions to REJECTED"
          - "a PurchaseAgreement is created in DRAFTED with purchase_price_cents, stratum_price_breakdown, holdback_cents and settlement_wire_cents computed"
          - "owning ServicingPortfolio transitions TAPE_LOCKED -> UNDER_CONTRACT"
          - "increments BidPackage.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "system: PurchaseAgreement enters TERMINATED while this package is still the marketing vehicle"
        actor: system
        preconditions:
          - "no PurchaseAgreement on this package has status IN {SETTLED, HOLDBACK_RELEASED, CLOSED}"
        side_effects:
          - "increments BidPackage.version by 1"
      - from: AWARDED
        to: CANCELLED
        trigger: "system: PurchaseAgreement enters TERMINATED (cascade from ApprovalRequest DENIED)"
        actor: system
        preconditions:
          - "the terminated agreement's bid_package_id == this id"
        side_effects:
          - "every Bid on this package with status == ACCEPTED transitions to REJECTED"
          - "increments BidPackage.version by 1"
      - from: BIDDING_SUSPENDED
        to: CANCELLED
        trigger: "system: PurchaseAgreement enters TERMINATED (cascade from ApprovalRequest DENIED)"
        actor: system
        preconditions:
          - "the terminated agreement's bid_package_id == this id"
        side_effects:
          - "increments BidPackage.version by 1"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, LAPSED]
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /msr/bids/{id}/counter"
        actor: TransactionManager
        preconditions:
          - "BidPackage.status == PUBLISHED"
          - "round_number <= 3"
        side_effects:
          - "counter_price_bps and counter_expires_at stamped from the request"
          - "increments Bid.version by 1"
      - from: COUNTERED
        to: REVISED
        trigger: "POST /msr/bids/{id}/revise"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == Bid.bidder_id"
          - "BidPackage.status == PUBLISHED"
          - "current logical clock < counter_expires_at"
          - "round_number < 3 (ERR_MAX_NEGOTIATION_ROUNDS at 3)"
          - "the revised bid_value_cents >= BidPackage.reserve_price_cents"
        side_effects:
          - "price_bps and holdback_pct replaced from the request; bid_value_cents recomputed"
          - "round_number incremented by 1"
          - "counter_price_bps and counter_expires_at cleared to null"
          - "increments Bid.version by 1"
      - from: REVISED
        to: COUNTERED
        trigger: "POST /msr/bids/{id}/counter"
        actor: TransactionManager
        preconditions:
          - "BidPackage.status == PUBLISHED"
          - "round_number <= 3"
        side_effects:
          - "counter_price_bps and counter_expires_at stamped from the request"
          - "increments Bid.version by 1"
        note: "Cycle edge: COUNTERED -> REVISED -> COUNTERED repeats until round_number reaches 3."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /msr/bid-packages/{id}/award (nominated bid)"
        actor: TransactionManager
        preconditions:
          - "this bid is the nominated winning_bid_id"
        side_effects:
          - "increments Bid.version by 1"
      - from: REVISED
        to: ACCEPTED
        trigger: "POST /msr/bid-packages/{id}/award (nominated bid)"
        actor: TransactionManager
        preconditions:
          - "this bid is the nominated winning_bid_id"
        side_effects:
          - "increments Bid.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: another Bid on the same package is awarded, or the PurchaseAgreement is TERMINATED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bid.version by 1"
      - from: COUNTERED
        to: REJECTED
        trigger: "system: another Bid on the same package is awarded"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bid.version by 1"
      - from: REVISED
        to: REJECTED
        trigger: "system: another Bid on the same package is awarded"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bid.version by 1"
      - from: ACCEPTED
        to: REJECTED
        trigger: "system: PurchaseAgreement enters TERMINATED (cascade from ApprovalRequest DENIED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bid.version by 1"
      - from: SUBMITTED
        to: LAPSED
        trigger: "system: BidPackage enters BIDDING_SUSPENDED (cascade A link 4)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bid.version by 1"
      - from: COUNTERED
        to: LAPSED
        trigger: "system: BidPackage enters BIDDING_SUSPENDED (cascade A link 4)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bid.version by 1"
      - from: REVISED
        to: LAPSED
        trigger: "system: BidPackage enters BIDDING_SUSPENDED (cascade A link 4)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bid.version by 1"

  - entity: ApprovalRequest
    initial_state: PENDING
    terminal_states: [APPROVED, CONDITIONALLY_APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /msr/approval-requests/{id}/decide with decision = APPROVED"
        actor: AgencyApprover
        preconditions:
          - "PurchaseAgreement.status == PENDING_APPROVALS"
          - "X-User-ID differs from decided_by_user_id of every already-decided ApprovalRequest on the same PurchaseAgreement"
        side_effects:
          - "decided_by_user_id and decided_at stamped"
          - "PurchaseAgreement.approval_pending_count recomputed"
          - "when approval_pending_count reaches 0 and condition_count == 0, PurchaseAgreement transitions PENDING_APPROVALS -> APPROVED"
          - "increments ApprovalRequest.version by 1"
      - from: PENDING
        to: CONDITIONALLY_APPROVED
        trigger: "POST /msr/approval-requests/{id}/decide with decision = CONDITIONALLY_APPROVED"
        actor: AgencyApprover
        preconditions:
          - "PurchaseAgreement.status == PENDING_APPROVALS"
          - "condition_text present in the request"
          - "X-User-ID differs from decided_by_user_id of every already-decided ApprovalRequest on the same PurchaseAgreement"
        side_effects:
          - "decided_by_user_id, decided_at and condition_text stamped"
          - "PurchaseAgreement.condition_count and approval_pending_count recomputed"
          - "when approval_pending_count reaches 0 and condition_count >= 1, PurchaseAgreement transitions PENDING_APPROVALS -> CONDITIONALLY_APPROVED"
          - "increments ApprovalRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /msr/approval-requests/{id}/decide with decision = DENIED"
        actor: AgencyApprover
        preconditions:
          - "PurchaseAgreement.status == PENDING_APPROVALS"
          - "X-User-ID differs from decided_by_user_id of every already-decided ApprovalRequest on the same PurchaseAgreement"
        side_effects:
          - "decided_by_user_id and decided_at stamped"
          - "PurchaseAgreement transitions PENDING_APPROVALS -> TERMINATED immediately with termination_reason = APPROVAL_DENIED, regardless of any still-PENDING sibling requests"
          - "the awarded BidPackage transitions to CANCELLED and its ACCEPTED Bid transitions to REJECTED"
          - "the owning ServicingPortfolio transitions UNDER_CONTRACT -> TAPE_LOCKED"
          - "increments ApprovalRequest.version by 1"

  - entity: PurchaseAgreement
    initial_state: DRAFTED
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFTED
        to: PENDING_APPROVALS
        trigger: "POST /msr/purchase-agreements/{id}/submit-for-approval"
        actor: TransactionManager
        preconditions:
          - "at least one ApprovalRequest exists on this agreement"
          - "every ApprovalRequest on this agreement has status == PENDING"
        side_effects:
          - "approval_pending_count recomputed to the count of PENDING ApprovalRequests"
          - "increments PurchaseAgreement.version by 1"
      - from: PENDING_APPROVALS
        to: APPROVED
        trigger: "system: the last PENDING ApprovalRequest is decided and no decision was CONDITIONALLY_APPROVED"
        actor: system
        preconditions:
          - "approval_pending_count == 0"
          - "condition_count == 0"
        side_effects:
          - "increments PurchaseAgreement.version by 1"
        note: "Branch 1 of 3 from PENDING_APPROVALS."
      - from: PENDING_APPROVALS
        to: CONDITIONALLY_APPROVED
        trigger: "system: the last PENDING ApprovalRequest is decided and at least one decision was CONDITIONALLY_APPROVED"
        actor: system
        preconditions:
          - "approval_pending_count == 0"
          - "condition_count >= 1"
        side_effects:
          - "holdback_cents is re-sized upward to max(holdback_cents, round_half_up(purchase_price_cents * 15 / 100, 0)) per calculations.holdback_sizing conditional branch"
          - "holdback_retained_cents reset to the new holdback_cents"
          - "settlement_wire_cents recomputed as purchase_price_cents - holdback_cents"
          - "increments PurchaseAgreement.version by 1"
        note: "Branch 2 of 3: divergent side effects versus the APPROVED branch - only this branch re-sizes the holdback."
      - from: PENDING_APPROVALS
        to: TERMINATED
        trigger: "system: any ApprovalRequest is decided DENIED"
        actor: system
        preconditions: []
        side_effects:
          - "termination_reason = APPROVAL_DENIED"
          - "still-PENDING sibling ApprovalRequests are left in PENDING and become undecidable (ERR_AGREEMENT_INVALID_STATE)"
          - "the awarded BidPackage transitions to CANCELLED; its ACCEPTED Bid transitions to REJECTED"
          - "the owning ServicingPortfolio transitions UNDER_CONTRACT -> TAPE_LOCKED"
          - "increments PurchaseAgreement.version by 1"
        note: "Branch 3 of 3: short-circuits the join point - a single DENIED decision terminates without waiting for the other branches."
      - from: APPROVED
        to: SETTLED
        trigger: "POST /msr/purchase-agreements/{id}/settle"
        actor: TransactionManager
        preconditions:
          - "transfer_date >= date(current logical clock) + 15 days (ERR_TRANSFER_DATE_TOO_SOON)"
          - "sale_date <= transfer_date"
          - "no other ServicingTransfer for the same buyer Counterparty with status == IN_PROGRESS has an onboarding window [transfer_date - 30d, transfer_date + 30d] that intersects the window of the transfer being created (ERR_ONBOARDING_CAPACITY_EXCEEDED; the interval is closed, so two windows that merely touch at an endpoint do collide)"
        side_effects:
          - "sale_date, transfer_date, settled_at stamped"
          - "holdback_release_eligible_at = transfer_date advanced by rep_warrant_days days (the reps-and-warranties expiry); the indemnification period expires transfer_date + indemnification_days days"
          - "a ServicingTransfer is created with status IN_PROGRESS, notice_status/data_status/pipeline_status = NOT_STARTED, readiness = NOT_READY"
          - "holdback_retained_cents = holdback_cents; holdback_released_cents = 0; holdback_applied_cents = 0"
          - "increments PurchaseAgreement.version by 1"
      - from: CONDITIONALLY_APPROVED
        to: SETTLED
        trigger: "POST /msr/purchase-agreements/{id}/settle"
        actor: TransactionManager
        preconditions:
          - "condition_waiver_reference is present in the request (ERR_CONDITION_WAIVER_REQUIRED)"
          - "transfer_date >= date(current logical clock) + 15 days"
          - "sale_date <= transfer_date"
          - "no other ServicingTransfer for the same buyer Counterparty with status == IN_PROGRESS has an onboarding window [transfer_date - 30d, transfer_date + 30d] that intersects the window of the transfer being created (ERR_ONBOARDING_CAPACITY_EXCEEDED; the interval is closed, so two windows that merely touch at an endpoint do collide)"
        side_effects:
          - "condition_waiver_reference stored, plus every side effect of the APPROVED -> SETTLED edge"
          - "increments PurchaseAgreement.version by 1"
        note: "Guarded transition: identical target state, extra required input relative to the APPROVED path."
      - from: SETTLED
        to: HOLDBACK_RELEASED
        trigger: "POST /msr/purchase-agreements/{id}/holdback-releases"
        actor: ComplianceOfficer
        preconditions:
          - "the bound ServicingTransfer.status == COMPLETED"
          - "date(current logical clock) >= holdback_release_eligible_at (ERR_HOLDBACK_NOT_ELIGIBLE)"
          - "the complaint concentration tier permits a non-zero release percentage (ERR_COMPLAINT_TIER_BLOCKS_RELEASE)"
          - "holdback_retained_cents > 0 (ERR_HOLDBACK_EXHAUSTED)"
          - "X-User-ID != ServicingTransfer.notice_attested_by_user_id (segregation of duties)"
        side_effects:
          - "holdback_retained_cents, holdback_released_cents and holdback_applied_cents updated per calculations.complaint_concentration_release"
          - "invariant holdback_cents == holdback_retained_cents + holdback_released_cents + holdback_applied_cents preserved"
          - "increments PurchaseAgreement.version by 1"
        note: "Re-entrant: a tier-2 partial release leaves holdback_retained_cents > 0, and a further release call is applied against the residual while the state stays HOLDBACK_RELEASED."
      - from: HOLDBACK_RELEASED
        to: HOLDBACK_RELEASED
        trigger: "POST /msr/purchase-agreements/{id}/holdback-releases (subsequent partial release)"
        actor: ComplianceOfficer
        preconditions:
          - "holdback_retained_cents > 0"
        side_effects:
          - "same field updates as the SETTLED -> HOLDBACK_RELEASED edge, applied to the residual retained balance"
          - "increments PurchaseAgreement.version by 1"
      - from: HOLDBACK_RELEASED
        to: SETTLED
        trigger: "POST /msr/purchase-agreements/{id}/holdback-clawbacks"
        actor: ComplianceOfficer
        preconditions:
          - "amount_cents <= holdback_released_cents (ERR_CLAWBACK_EXCEEDS_RELEASED)"
          - "the clawback returns the full released balance (holdback_released_cents - amount_cents == 0)"
        side_effects:
          - "holdback_released_cents -= amount_cents; holdback_retained_cents += amount_cents"
          - "invariant holdback_cents == holdback_retained_cents + holdback_released_cents + holdback_applied_cents preserved (compensation, no drift)"
          - "increments PurchaseAgreement.version by 1"
        note: "Compensation edge: a full clawback rewinds the agreement to SETTLED so the release decision can be re-taken; a partial clawback leaves it in HOLDBACK_RELEASED."
      - from: SETTLED
        to: CLOSED
        trigger: "POST /msr/purchase-agreements/{id}/holdback-releases (a single tier-1 release that exhausts the retained balance after the indemnification period)"
        actor: ComplianceOfficer
        preconditions:
          - "every precondition of the SETTLED -> HOLDBACK_RELEASED edge"
          - "the release brings holdback_retained_cents to 0"
          - "date(current logical clock) >= transfer_date advanced by indemnification_days days"
        side_effects:
          - "the same holdback field updates as the SETTLED -> HOLDBACK_RELEASED edge"
          - "the agreement is locked: any further holdback-release or holdback-clawback call is refused with ERR_AGREEMENT_INVALID_STATE"
          - "increments PurchaseAgreement.version by 1"
        note: "Branch on the SAME trigger as the SETTLED -> HOLDBACK_RELEASED edge: the target state is decided by whether the release exhausts the balance AND the indemnification period has run. A full release taken before the indemnification expiry lands in HOLDBACK_RELEASED instead, where it can still be clawed back."
      - from: HOLDBACK_RELEASED
        to: CLOSED
        trigger: "POST /msr/purchase-agreements/{id}/holdback-releases (release that exhausts the retained balance)"
        actor: ComplianceOfficer
        preconditions:
          - "the release brings holdback_retained_cents to 0"
          - "date(current logical clock) >= transfer_date advanced by indemnification_days days"
        side_effects:
          - "the agreement is locked: any further holdback-release or holdback-clawback call is refused with ERR_AGREEMENT_INVALID_STATE"
          - "increments PurchaseAgreement.version by 1"

  - entity: ServicingTransfer
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED]
    parallel_dimensions:
      - dimension: notice_status
        states: [NOT_STARTED, NOTICES_IN_PROGRESS, NOTICES_ATTESTED]
      - dimension: data_status
        states: [NOT_STARTED, MAPPED, ESCROW_MAPPED, RECONCILED]
      - dimension: pipeline_status
        states: [NOT_STARTED, PIPELINE_TRANSFERRED]
    compound_derivation: "readiness = READY when notice_status == NOTICES_ATTESTED AND data_status == RECONCILED AND pipeline_status == PIPELINE_TRANSFERRED; otherwise NOT_READY. Re-derived on every dimension change, including backwards (a rollback of the escrow mapping flips readiness back to NOT_READY)."
    transitions:
      - from: "notice_status NOT_STARTED"
        to: "notice_status NOTICES_IN_PROGRESS"
        trigger: "POST /msr/servicing-transfers/{id}/notices (first notice)"
        actor: "SellerServicer or BuyerServicer"
        preconditions:
          - "ServicingTransfer.status == IN_PROGRESS"
          - "notice_type IN {TRANSFEROR_15DAY, COMBINED} requires the caller role SellerServicer with X-User-ID == ServicingPortfolio.seller_id; notice_type TRANSFEREE_15DAY requires the caller role BuyerServicer with X-User-ID == PurchaseAgreement.buyer_id (ERR_NOTICE_SENDER_ROLE_MISMATCH)"
          - "the target Loan has an included TapeLine on the awarded BidPackage (ERR_LOAN_NOT_ON_TAPE)"
          - "the notice effective_date equals PurchaseAgreement.transfer_date (ERR_NOTICE_EFFECTIVE_DATE_MISMATCH)"
        side_effects:
          - "a BorrowerNotice is created with sent_at = current logical clock, sent_by_role = the caller role, and lead_days and compliance_status computed by calculations.notice_statutory_window"
          - "notice_count incremented; late_notice_count incremented when compliance_status == LATE"
          - "readiness re-derived"
          - "increments ServicingTransfer.version by 1"
      - from: "notice_status NOTICES_IN_PROGRESS"
        to: "notice_status NOTICES_IN_PROGRESS"
        trigger: "POST /msr/servicing-transfers/{id}/notices (additional notices)"
        actor: "SellerServicer or BuyerServicer"
        preconditions:
          - "ServicingTransfer.status == IN_PROGRESS"
        side_effects:
          - "notice_count and late_notice_count updated"
          - "increments ServicingTransfer.version by 1"
      - from: "notice_status NOTICES_IN_PROGRESS"
        to: "notice_status NOTICES_ATTESTED"
        trigger: "POST /msr/servicing-transfers/{id}/attest-notices"
        actor: ComplianceOfficer
        preconditions:
          - "every Loan with an included TapeLine on the awarded BidPackage has at least one BorrowerNotice of type TRANSFEROR_15DAY or COMBINED on this transfer (ERR_NOTICE_COMPLIANCE_INCOMPLETE)"
          - "late_notice_count == 0 (ERR_NOTICE_LATE)"
        side_effects:
          - "notice_attested_by_user_id = X-User-ID; notice_attested_at = current logical clock"
          - "readiness re-derived"
          - "increments ServicingTransfer.version by 1"
      - from: "data_status NOT_STARTED"
        to: "data_status MAPPED"
        trigger: "POST /msr/servicing-transfers/{id}/map-data"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == PurchaseAgreement.buyer_id"
          - "ServicingTransfer.status == IN_PROGRESS"
        side_effects:
          - "mapping_scheme stored on the ServicingTransfer"
          - "increments ServicingTransfer.version by 1"
      - from: "data_status MAPPED"
        to: "data_status ESCROW_MAPPED"
        trigger: "POST /msr/servicing-transfers/{id}/map-escrow"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == PurchaseAgreement.buyer_id"
        side_effects:
          - "each included tape Loan has escrow_balance_at_mapping_cents = escrow_balance_cents and suspense_balance_at_mapping_cents = suspense_balance_cents stamped before the move"
          - "escrow_transferred_cents = sum of Loan.escrow_balance_cents over included tape loans; those Loan.escrow_balance_cents are set to 0"
          - "suspense_transferred_cents = sum of Loan.suspense_balance_cents over included tape loans; those Loan.suspense_balance_cents are set to 0"
          - "invariant custodial_funds_total_cents (sum of loan escrow + suspense plus transfer escrow_transferred + suspense_transferred) is unchanged by this move"
          - "readiness re-derived"
          - "increments ServicingTransfer.version by 1"
      - from: "data_status ESCROW_MAPPED"
        to: "data_status MAPPED"
        trigger: "POST /msr/servicing-transfers/{id}/rollback-escrow-mapping"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == PurchaseAgreement.buyer_id"
          - "ServicingTransfer.status == IN_PROGRESS"
        side_effects:
          - "each included tape Loan's escrow_balance_cents and suspense_balance_cents are restored from Loan.escrow_balance_at_mapping_cents and Loan.suspense_balance_at_mapping_cents"
          - "escrow_transferred_cents and suspense_transferred_cents reset to 0"
          - "compensation: custodial_funds_total_cents returns to exactly its pre-mapping value with no drift"
          - "readiness re-derived to NOT_READY"
          - "increments ServicingTransfer.version by 1"
        note: "Cycle edge inside the data_status dimension."
      - from: "data_status ESCROW_MAPPED"
        to: "data_status RECONCILED"
        trigger: "POST /msr/servicing-transfers/{id}/reconcile"
        actor: BuyerServicer
        preconditions:
          - "escrow_transferred_cents + suspense_transferred_cents == the awarded portfolio's custodial_funds_total_cents frozen at tape lock (ERR_ESCROW_NOT_MAPPED when data_status is below ESCROW_MAPPED)"
        side_effects:
          - "reconciled_at = current logical clock"
          - "readiness re-derived"
          - "increments ServicingTransfer.version by 1"
      - from: "pipeline_status NOT_STARTED"
        to: "pipeline_status PIPELINE_TRANSFERRED"
        trigger: "POST /msr/servicing-transfers/{id}/transfer-pipeline"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == PurchaseAgreement.buyer_id"
          - "ServicingTransfer.status == IN_PROGRESS"
        side_effects:
          - "loss_mit_pipeline_count = count of included tape Loans with loss_mit_status != NONE"
          - "readiness re-derived"
          - "increments ServicingTransfer.version by 1"
        note: "This dimension advances independently of notice_status and data_status - it may be driven first, last, or in between with identical results."
      - from: "status IN_PROGRESS"
        to: "status COMPLETED"
        trigger: "POST /msr/servicing-transfers/{id}/complete"
        actor: TransactionManager
        preconditions:
          - "readiness == READY (ERR_TRANSFER_NOT_READY)"
          - "date(current logical clock) >= PurchaseAgreement.transfer_date"
        side_effects:
          - "completed_at = current logical clock; transferred_loan_count = count of included tape Loans"
          - "cascade B link 1: every included tape Loan with status == ACTIVE transitions to TRANSFERRED with transferred_at stamped"
          - "cascade B link 2: the owning ServicingPortfolio transitions UNDER_CONTRACT -> TRANSFERRED once no Loan on it remains ACTIVE"
          - "cascade B link 3: every HedgePosition on that portfolio with status == OPEN transitions to CLOSED with realized_pnl_cents stamped"
          - "increments ServicingTransfer.version by 1"

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [TRANSFERRED]
    transitions:
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system: ServicingTransfer enters COMPLETED (cascade B link 1)"
        actor: system
        preconditions:
          - "the Loan has a TapeLine with included == true on the awarded BidPackage"
        side_effects:
          - "transferred_at = current logical clock"
          - "the Loan leaves the input set of calculations.msr_fair_value and of ServicingPortfolio.loan_count / total_upb_cents / weighted_avg_note_rate_pct, all of which filter on status == ACTIVE"
          - "escrow_balance_cents and suspense_balance_cents are already 0 (moved at map-escrow) and stay 0"
        note: "Conditional cascade: a Loan whose TapeLine has included == false is skipped and stays ACTIVE, which in turn blocks cascade B link 2 (the portfolio cannot reach TRANSFERRED while any Loan is ACTIVE). Tape exclusion is a TapeLine-level fact, never a Loan state - Loan.status has exactly two values."

  - entity: ErrorResolutionCase
    initial_state: OPEN
    terminal_states: [ESCALATED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /msr/error-cases/{id}/acknowledge"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == PurchaseAgreement.buyer_id of the bound transfer"
        side_effects:
          - "acknowledged_at = current logical clock; ack_breached = acknowledged_at > ack_deadline_at"
          - "increments ErrorResolutionCase.version by 1"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /msr/error-cases/{id}/resolve"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == PurchaseAgreement.buyer_id of the bound transfer"
          - "remediation_cents >= 0"
        side_effects:
          - "resolved_at = current logical clock; resolution_breached = resolved_at > resolution_deadline_at"
          - "remediation_cents stored and becomes eligible for the holdback charge in calculations.complaint_concentration_release"
          - "increments ErrorResolutionCase.version by 1"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /msr/error-cases/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "date(current logical clock) - date(resolved_at) <= 60 (ERR_REOPEN_WINDOW_EXPIRED)"
          - "reopen_count < 2 (ERR_MAX_REOPENS_EXCEEDED on the third attempt)"
        side_effects:
          - "reopen_count incremented by 1; acknowledged_at and resolved_at cleared to null; ack_breached and resolution_breached retain the worst observed outcome (once true they stay true)"
          - "increments ErrorResolutionCase.version by 1"
      - from: REOPENED
        to: ACKNOWLEDGED
        trigger: "POST /msr/error-cases/{id}/acknowledge"
        actor: BuyerServicer
        preconditions:
          - "X-User-ID == PurchaseAgreement.buyer_id of the bound transfer"
        side_effects:
          - "acknowledged_at re-stamped; ack_breached set to true when the new acknowledged_at is past the unchanged ack_deadline_at"
          - "increments ErrorResolutionCase.version by 1"
        note: "Cycle edge: ACKNOWLEDGED -> RESOLVED -> REOPENED -> ACKNOWLEDGED repeats, bounded by reopen_count < 2."
      - from: RESOLVED
        to: ESCALATED
        trigger: "POST /msr/error-cases/{id}/reopen when reopen_count == 2"
        actor: ComplianceOfficer
        preconditions:
          - "reopen_count == 2"
          - "date(current logical clock) - date(resolved_at) <= 60"
        side_effects:
          - "the case is still counted in the complaint concentration ratio numerator but can no longer be acknowledged, resolved or reopened"
          - "increments ErrorResolutionCase.version by 1"
        note: "Loop terminator: the third reopen attempt escalates instead of cycling."

  - entity: HedgePosition
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /msr/hedge-positions/{id}/close"
        actor: HedgeDesk
        preconditions:
          - "status == OPEN (ERR_HEDGE_ALREADY_CLOSED)"
        side_effects:
          - "closed_at = current logical clock; close_base_rate_bps = the ACTIVE RateCurveSnapshot.base_rate_bps"
          - "realized_pnl_cents = mark_to_market_cents at close; the position stops contributing to net_hedged_position_cents"
          - "increments HedgePosition.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "system: the owning ServicingPortfolio enters TRANSFERRED (cascade B link 3)"
        actor: system
        preconditions:
          - "HedgePosition.portfolio_id == the portfolio that just became TRANSFERRED"
        side_effects:
          - "closed_at, close_base_rate_bps and realized_pnl_cents stamped exactly as on the manual close edge"
          - "increments HedgePosition.version by 1"
        note: "Conditional cascade: positions already CLOSED are skipped, so a repeated portfolio transition cannot restamp realized_pnl_cents."

  - entity: Counterparty
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /msr/counterparties/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "suspended_at = current logical clock"
          - "the counterparty can no longer be named as a bidder (ERR_BIDDER_NOT_ELIGIBLE) and no PurchaseAgreement naming it as buyer can be settled"
          - "already-submitted Bids are left untouched, so an award naming a suspended bidder is refused at award time rather than retroactively voided"
          - "increments Counterparty.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
concurrency_rules:

  - name: valuation-run-create-stale-portfolio
    parent_entity: ServicingPortfolio
    child_entity: ValuationRun
    write_endpoint: "POST /msr/portfolios/{id}/valuation-runs"
    occ_field: expected_portfolio_version
    error_id: ERR_STALE_PORTFOLIO_VERSION
    http_status: 412
    rationale: "A ValuationRun prices the frozen tape. A later run for the same portfolio legitimately supersedes the earlier one, so a request that carries a version captured before the tape composition or a prior run changed the pricing basis is refused rather than silently valuing a different pool."
    contract:
      - "The caller must supply expected_portfolio_version, obtained from a prior server response (POST lock-tape or GET /msr/portfolios/{id})."
      - "When expected_portfolio_version != ServicingPortfolio.version the request fails with ERR_STALE_PORTFOLIO_VERSION (412) and no ValuationRun row is created."
      - "On success ServicingPortfolio.version increments by 1, which invalidates the value the caller just used."

  - name: bid-create-stale-package
    parent_entity: BidPackage
    child_entity: Bid
    write_endpoint: "POST /msr/bid-packages/{id}/bids"
    occ_field: expected_bid_package_version
    error_id: ERR_STALE_BID_PACKAGE_VERSION
    http_status: 412
    rationale: "A bid is priced against the published tape and reserve. Any change to the package (re-stratification, suspension, an award) moves the basis, so a bid carrying a stale package version is refused instead of being scored against a tape the bidder never saw."
    contract:
      - "The caller must supply expected_bid_package_version, obtained from a prior server response (POST publish or GET /msr/bid-packages/{id})."
      - "When expected_bid_package_version != BidPackage.version the request fails with ERR_STALE_BID_PACKAGE_VERSION (412) and no Bid row is created."
      - "On success BidPackage.version increments by 1."

  - name: holdback-release-stale-agreement
    parent_entity: PurchaseAgreement
    child_entity: HoldbackRelease
    write_endpoint: "POST /msr/purchase-agreements/{id}/holdback-releases"
    occ_field: expected_purchase_agreement_version
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    rationale: "Releases are partial and repeatable, so an identical release payload is indistinguishable from a duplicate submission. The version guard is what makes each release a distinct, intentional decision taken against a known retained balance."
    contract:
      - "The caller must supply expected_purchase_agreement_version, obtained from a prior server response (POST settle, a previous holdback-release, or GET /msr/purchase-agreements/{id})."
      - "When expected_purchase_agreement_version != PurchaseAgreement.version the request fails with ERR_STALE_AGREEMENT_VERSION (412) and no holdback field changes."
      - "On success PurchaseAgreement.version increments by 1, so a replay of the same payload is rejected by the guard."

# =============================================================================
# §1.3 Calculation Table
# =============================================================================
calculations:

  - name: msr_fair_value
    entity: ValuationRun
    algorithm_type: decay_function
    trigger: "POST /msr/portfolios/{id}/valuation-runs"
    input_set: "every Loan with portfolio_id == the target portfolio AND status == ACTIVE; loans that have already TRANSFERRED are excluded"
    constants:
      DQ_COST_MULTIPLIER: "{CURRENT: 1.0, DQ_30_59: 1.5, DQ_60_89: 2.5, DQ_90_PLUS: 4.0, FORECLOSURE: 6.0}"
      LOSS_MIT_SURCHARGE_CENTS: "{NONE: 0, TRIAL_MOD: 2000, PERMANENT_MOD: 1000, FORBEARANCE: 1500}"
      REFERENCE_RATE_BPS: 4000
      OAS_SCENARIOS: "[{label: DOWN_50, cpr_multiplier: 1.50, rate_shift_pct: -0.50, weight: 0.25}, {label: BASE, cpr_multiplier: 1.00, rate_shift_pct: 0.00, weight: 0.50}, {label: UP_50, cpr_multiplier: 0.60, rate_shift_pct: 0.50, weight: 0.25}]"
    precision: "All intermediate arithmetic in exact decimal. Per-loan value rounded to whole cents with ROUND_HALF_UP, then summed. value_bps_of_upb = round_half_up(value_cents * 10000 / total_upb_cents, 2)."
    formula: |
      Rate pass-through from the ACTIVE RateCurveSnapshot bound to the run:
        rate_delta_pct     = (RateCurveSnapshot.base_rate_bps - REFERENCE_RATE_BPS) / 100
        discount_eff_pct   = AssumptionSet.discount_rate_pct    + rate_delta_pct
        float_eff_pct      = AssumptionSet.float_earnings_rate_pct + rate_delta_pct
        cpr                = AssumptionSet.cpr_pct / 100
      Per Loan L, for each projection year y in 1 .. AssumptionSet.projection_years:
        begin_upb = L.upb_cents * (1 - cpr) ** (y - 1)
        end_upb   = L.upb_cents * (1 - cpr) ** y
        avg_upb   = (begin_upb + end_upb) / 2
        fee       = avg_upb * L.servicing_fee_bps / 10000
        float_inc = L.escrow_balance_cents * float_eff_pct / 100
        cost      = AssumptionSet.cost_to_service_annual_cents * DQ_COST_MULTIPLIER[L.delinquency_bucket]
                    + LOSS_MIT_SURCHARGE_CENTS[L.loss_mit_status]
        net       = fee + float_inc - cost
        df        = 1 / (1 + discount_eff_pct / 100) ** y
      loan_value_cents = max(0, round_half_up(sum over y of (net * df), 0))
      value_cents      = sum over loans of loan_value_cents        # round per loan, THEN sum
    variants:
      - name: DETERMINISTIC_STATIC
        selected_when: "ValuationRun.method == DETERMINISTIC_STATIC"
        behaviour: "The formula above is evaluated once, at the AssumptionSet's own cpr_pct and the curve-adjusted discount rate. scenario_values is {}."
      - name: OAS_SHOCK_WEIGHTED
        selected_when: "ValuationRun.method == OAS_SHOCK_WEIGHTED"
        behaviour: |
          The formula above is evaluated once per OAS scenario s, with
            cpr_s              = (AssumptionSet.cpr_pct * s.cpr_multiplier) / 100
            discount_eff_pct_s = discount_eff_pct + s.rate_shift_pct
            float_eff_pct_s    = float_eff_pct    + s.rate_shift_pct
          Each scenario value is itself a round-per-loan-then-sum figure and is stored in
          scenario_values[s.label]. Then
            value_cents = round_half_up(sum over s of (s.weight * scenario_values[s.label]), 0)
          Faster prepayment in the DOWN_50 scenario shortens the fee strip, so the shock-weighted
          value is strictly below the static value for any portfolio with a positive fee strip.
    notes:
      - "effective_discount_rate_pct records discount_eff_pct (the BASE scenario value under OAS_SHOCK_WEIGHTED)."
      - "The rounding order is normative: rounding the portfolio sum instead of each loan changes the result for heterogeneous pools."
      - "A loan whose projected net cash flow is negative for every year floors at 0 and never subsidises the pool."

  - name: active_rate_curve_selection
    entity: RateCurveSnapshot
    algorithm_type: chronological
    trigger: "POST /msr/portfolios/{id}/valuation-runs, POST /msr/hedge-positions, POST /msr/hedge-positions/{id}/close, GET /msr/portfolios/{id}/hedge-effectiveness"
    input_set: "every RateCurveSnapshot with status == ACTIVE"
    constants: {}
    precision: "Not applicable (selection only)."
    formula: |
      eligibility : status == ACTIVE
      ranking     : as_of_date DESC, then created_at DESC as the tie-break
      result      : the single highest-ranked snapshot
      empty set   : the caller fails with ERR_NO_ACTIVE_RATE_CURVE (409)
    notes:
      - "Row id is never used as a tie-break; created_at is the only fallback ordering key."
      - "Because POST /msr/rate-curves supersedes the incumbent, at most one snapshot is ACTIVE at any time and the tie-break is a safety net, not a routine path."

  - name: effective_valuation_selection
    entity: ServicingPortfolio
    algorithm_type: chronological
    trigger: "POST /msr/bid-packages/{id}/publish, GET /msr/portfolios/{id}/hedge-effectiveness"
    input_set: "every ValuationRun with portfolio_id == the target portfolio AND status IN {COMPLETED, STALE}"
    constants: {}
    precision: "Not applicable (selection only)."
    formula: |
      eligibility : portfolio_id matches AND status IN {COMPLETED, STALE}
      ranking     : sequence_no DESC (sequence_no is a strictly increasing per-portfolio counter, so the ranking is total and needs no tie-break)
      result      : the single highest-ranked run
      empty set   : effective_valuation_run_id is null and msr_value_cents reads 0
      ServicingPortfolio.valuation_freshness = NONE when the set is empty,
                                               CURRENT when the selected run has status == COMPLETED,
                                               STALE   when the selected run has status == STALE
    notes:
      - "SUPERSEDED runs are excluded, so a superseded run can never anchor a reserve price or a hedge effectiveness read."

  - name: reserve_price
    entity: BidPackage
    algorithm_type: threshold
    trigger: "POST /msr/bid-packages/{id}/publish"
    input_set: "the ValuationRun bound to the package (BidPackage.valuation_run_id) and the package's own included TapeLine rows"
    constants: {}
    precision: "Single ROUND_HALF_UP to whole cents at the very end; no intermediate rounding."
    formula: |
      reserve_price_cents = round_half_up(
          ValuationRun.value_cents
          * BidPackage.reserve_price_floor_pct / 100
          * BidPackage.tape_upb_cents / ServicingPortfolio.total_upb_cents,
          0)
      where tape_upb_cents = sum of TapeLine.upb_snapshot_cents over rows with included == true,
      and total_upb_cents is the portfolio figure frozen at tape lock.
    notes:
      - "Excluding a TapeLine shrinks tape_upb_cents but leaves total_upb_cents and the ValuationRun untouched, so the reserve scales down pro rata by unpaid balance."
      - "A Bid is compared against this figure with Bid.bid_value_cents (a single rounding over the whole tape), NOT with purchase_price (a per-stratum rounding); the two can differ by a few cents, which is exactly why the reserve test uses the bid figure."

  - name: purchase_price
    entity: PurchaseAgreement
    algorithm_type: aggregation
    trigger: "POST /msr/bid-packages/{id}/award"
    input_set: "every TapeLine on the awarded BidPackage with included == true, grouped by stratum_label"
    constants: {}
    precision: "ROUND_HALF_UP to whole cents PER STRATUM, then summed. The strata are visited in ascending stratum_label order (lexicographic on the label string) so the traversal is deterministic."
    formula: |
      For each distinct stratum_label in ascending order:
        stratum_upb_cents   = sum of TapeLine.upb_snapshot_cents over included rows in that stratum
        stratum_price_cents = round_half_up(stratum_upb_cents * Bid.price_bps / 10000, 0)
        stratum_price_breakdown[stratum_label] = {upb_cents: stratum_upb_cents, price_cents: stratum_price_cents}
      purchase_price_cents = sum over strata of stratum_price_cents
      holdback_pct  is copied from the winning Bid
      Contrast (deliberate divergence):
        Bid.bid_value_cents = round_half_up(BidPackage.tape_upb_cents * Bid.price_bps / 10000, 0)
      i.e. one rounding over the whole tape. purchase_price_cents and bid_value_cents therefore
      differ by up to (stratum_count - 1) cents; the per-stratum figure is the contractual one
      because each stratum is separately priced and separately wired.
    notes:
      - "Rounding order is pinned: round each stratum then sum. Summing then rounding is a different number and is wrong."
      - "Strata come from calculations.tape_stratification, so the stratification_scheme chosen at package creation changes purchase_price_cents even though the tape and the price_bps are identical."

  - name: tape_stratification
    entity: TapeLine
    algorithm_type: topological
    trigger: "POST /msr/bid-packages/{id}/stratify"
    input_set: "every Loan with portfolio_id == BidPackage.portfolio_id AND status == ACTIVE"
    constants:
      NOTE_RATE_BANDS: "LT_600 for note_rate_pct < 6.00; 600_699 for 6.00 <= note_rate_pct < 7.00; 700_PLUS for note_rate_pct >= 7.00"
    precision: "Band comparisons use the stored 4-decimal note_rate_pct with no rounding."
    formula: |
      One TapeLine is created per input Loan with included = true and
      upb_snapshot_cents = Loan.upb_cents. stratum_label is assigned from
      BidPackage.stratification_scheme:
        BY_STATE       -> Loan.state_code
        BY_NOTE_RATE   -> the NOTE_RATE_BANDS label
        BY_DELINQUENCY -> Loan.delinquency_bucket
      Then BidPackage.tape_loan_count = count of included rows,
           BidPackage.tape_upb_cents  = sum of upb_snapshot_cents over included rows,
           BidPackage.stratum_count   = count of distinct stratum_label values over included rows.
    notes:
      - "Re-running stratify on a STRATIFIED package is refused with ERR_PACKAGE_INVALID_STATE; the tape is cut once."
      - "upb_snapshot_cents is a snapshot: a later change to Loan.upb_cents does not move the tape or the purchase price."

  - name: holdback_sizing
    entity: PurchaseAgreement
    algorithm_type: threshold
    trigger: "POST /msr/bid-packages/{id}/award, and again when the agreement enters CONDITIONALLY_APPROVED"
    input_set: "the PurchaseAgreement itself"
    constants:
      CONDITIONAL_HOLDBACK_FLOOR_PCT: 15
    precision: "ROUND_HALF_UP to whole cents."
    formula: |
      At award (base sizing):
        holdback_cents         = round_half_up(purchase_price_cents * holdback_pct / 100, 0)
        holdback_retained_cents = holdback_cents
        holdback_released_cents = 0
        holdback_applied_cents  = 0
        settlement_wire_cents   = purchase_price_cents - holdback_cents
      On entering CONDITIONALLY_APPROVED (re-sizing, upward only):
        holdback_cents         = max(holdback_cents,
                                     round_half_up(purchase_price_cents * CONDITIONAL_HOLDBACK_FLOOR_PCT / 100, 0))
        holdback_retained_cents = holdback_cents
        settlement_wire_cents   = purchase_price_cents - holdback_cents
      Invariant, at every instant after award:
        holdback_cents == holdback_retained_cents + holdback_released_cents + holdback_applied_cents
    notes:
      - "The APPROVED branch never re-sizes, so the two approval branches produce different settlement_wire_cents from identical bids."
      - "The floor is one-directional: a bid that already offered a holdback above 15 percent is left alone."

  - name: complaint_concentration_release
    entity: PurchaseAgreement
    algorithm_type: tiered_pricing
    trigger: "POST /msr/purchase-agreements/{id}/holdback-releases"
    input_set: "every ErrorResolutionCase with servicing_transfer_id == the agreement's ServicingTransfer, in ANY status (OPEN, ACKNOWLEDGED, RESOLVED, REOPENED, ESCALATED); the remediation charge considers only cases with status == RESOLVED"
    constants:
      TIER_1_MAX_RATIO_PCT: 25.00
      TIER_2_MAX_RATIO_PCT: 50.00
      TIER_1_RELEASE_PCT: 100
      TIER_2_RELEASE_PCT: 50
      TIER_3_RELEASE_PCT: 0
      REMEDIATION_CHARGE_CAP_FRACTION: 0.40
    precision: "complaint_ratio_pct is ROUND_HALF_UP to 2 decimals. Cash amounts are ROUND_HALF_UP to whole cents, except the remediation cap which is FLOORED to whole cents so the cap can never round upward past 40 percent."
    formula: |
      Evaluated in exactly this order:
      Step 1 - concentration ratio
        case_count = count of the input_set
        complaint_ratio_pct = 0.00 when ServicingTransfer.transferred_loan_count == 0,
                              else round_half_up(case_count * 100 / ServicingTransfer.transferred_loan_count, 2)
      Step 2 - tier lookup (upper bounds inclusive)
        complaint_ratio_pct <= 25.00                            -> release_pct = 100
        25.00 < complaint_ratio_pct <= 50.00                    -> release_pct = 50
        complaint_ratio_pct > 50.00                             -> release_pct = 0 and the call fails
                                                                   with ERR_COMPLAINT_TIER_BLOCKS_RELEASE (409)
      Step 3 - gross release against the CURRENT retained balance
        gross_cents = round_half_up(holdback_retained_cents * release_pct / 100, 0)
      Step 4 - remediation charge, capped
        remediation_total_cents = sum of remediation_cents over input_set cases with status == RESOLVED
        cap_cents               = floor(gross_cents * 0.40)
        charge_cents            = min(remediation_total_cents, cap_cents)
      Step 5 - net wire to the seller
        net_release_cents = gross_cents - charge_cents
      Field updates:
        holdback_retained_cents -= gross_cents
        holdback_released_cents += net_release_cents
        holdback_applied_cents  += charge_cents
      The step-3 invariant is therefore preserved exactly:
        holdback_cents == holdback_retained_cents + holdback_released_cents + holdback_applied_cents
    notes:
      - "Step order matters: the tier is chosen from the ratio BEFORE the retained balance is touched, and the cap is computed from the gross of THIS release, not from the original holdback."
      - "A tier-2 release deliberately leaves a residual retained balance, so the agreement stays in HOLDBACK_RELEASED and a later call releases against the residual."
      - "The ratio counts every case regardless of status, so resolving a case does not lower the concentration - only the remediation charge is affected by resolution."

  - name: counterparty_transfer_risk_score
    entity: Counterparty
    algorithm_type: weighted_scoring
    trigger: "GET /msr/counterparties/{id}/risk-score, POST /msr/bid-packages/{id}/bids (PRE_AWARD gate)"
    input_set: "the Counterparty itself, plus - for POST_TRANSFER only - every ServicingTransfer whose PurchaseAgreement.buyer_id is this counterparty and whose status == COMPLETED, and the ErrorResolutionCase rows on those transfers"
    constants:
      RATING_PENALTY: "{TIER_1: 0, TIER_2: 10, TIER_3: 25}"
      CAPITAL_TIER_1_CENTS: 1000000000
      CAPITAL_TIER_2_CENTS: 500000000
      CAPITAL_PENALTY: "{>= CAPITAL_TIER_1_CENTS: 0, >= CAPITAL_TIER_2_CENTS: 15, below: 30}"
      MIN_AGENCY_APPROVALS: 2
      APPROVAL_PENALTY_PER_MISSING: 8
      COMPLAINT_PENALTY_PER_RATIO_POINT: 3
      COMPLAINT_PENALTY_CAP: 30
      ACK_BREACH_PENALTY: 5
      RESOLUTION_BREACH_PENALTY: 10
      SLA_PENALTY_CAP: 20
      MIN_BIDDER_SCORE: 40
    precision: "All penalties are integers; the ratio-derived complaint penalty is ROUND_HALF_UP to a whole number before capping. The score is an integer clamped to [0, 100]."
    formula: |
      Common base penalties:
        rating_penalty   = RATING_PENALTY[servicer_rating]
        capital_penalty  = 0 if net_worth_cents >= 1000000000
                           else 15 if net_worth_cents >= 500000000
                           else 30
        approval_penalty = max(0, (2 - count(agency_approvals)) * 8)
        base_score       = clamp(100 - rating_penalty - capital_penalty - approval_penalty, 0, 100)
    variants:
      - name: PRE_AWARD
        selected_when: "GET .../risk-score with variant = PRE_AWARD (the default), and on every bid submission gate"
        behaviour: |
          score = base_score
          complaint_penalty = 0, sla_penalty = 0.
          Only balance-sheet and agency-approval facts are considered; no post-transfer
          performance history is available at bid time.
      - name: POST_TRANSFER
        selected_when: "GET .../risk-score with variant = POST_TRANSFER"
        behaviour: |
          worst_ratio_pct   = the maximum complaint_ratio_pct (per calculations.complaint_concentration_release
                              step 1) over this counterparty's COMPLETED transfers, 0.00 when there are none
          complaint_penalty = min(30, round_half_up(worst_ratio_pct * 3, 0))
          ack_breaches      = count of ErrorResolutionCase rows on those transfers with ack_breached == true
          res_breaches      = count of ErrorResolutionCase rows on those transfers with resolution_breached == true
          sla_penalty       = min(20, ack_breaches * 5 + res_breaches * 10)
          score             = clamp(base_score - complaint_penalty - sla_penalty, 0, 100)
    notes:
      - "Tier bands: score >= 80 -> LOW, >= 60 -> MEDIUM, >= 40 -> ELEVATED, otherwise HIGH."
      - "A bid whose bidder scores below MIN_BIDDER_SCORE (40) under PRE_AWARD is refused with ERR_BIDDER_RISK_TIER_TOO_HIGH (422)."
      - "The two variants are evaluated over different entity sets - PRE_AWARD reads only the counterparty row, POST_TRANSFER also reads transfers and error cases - so the same counterparty scores differently the day after it closes a troubled transfer."

  - name: notice_statutory_window
    entity: BorrowerNotice
    algorithm_type: threshold
    trigger: "POST /msr/servicing-transfers/{id}/notices"
    input_set: "the notice being created, its ServicingTransfer and the transfer's PurchaseAgreement.transfer_date"
    constants:
      STATUTORY_LEAD_DAYS: 15
    precision: "Whole calendar days, computed on the date parts only; the time-of-day component of sent_at is discarded."
    formula: |
      effective_date must equal PurchaseAgreement.transfer_date, else ERR_NOTICE_EFFECTIVE_DATE_MISMATCH (422).
      notice_type IN {TRANSFEROR_15DAY, COMBINED}   # sent by the seller, BEFORE the transfer
        lead_days         = date(effective_date) - date(sent_at)
        compliance_status = COMPLIANT when lead_days >= 15, else LATE
      notice_type == TRANSFEREE_15DAY               # sent by the buyer, AFTER the transfer
        lead_days         = date(sent_at) - date(effective_date)
        compliance_status = COMPLIANT when 0 <= lead_days <= 15, else LATE
    notes:
      - "lead_days is signed for the transferee variant: a notice sent before the effective date yields a negative lead_days and is LATE, because the buyer cannot notice a transfer it has not received."
      - "Exactly 15 days is COMPLIANT on both sides; 14 days is LATE on the transferor side and COMPLIANT on the transferee side. The boundary is inclusive."
      - "ServicingTransfer.late_notice_count must be 0 to attest, so a single LATE notice blocks the whole transfer until it is superseded by a compliant one."

  - name: hedge_mark_to_market
    entity: HedgePosition
    algorithm_type: aggregation
    trigger: "POST /msr/rate-curves (recompute), POST /msr/hedge-positions/{id}/close, GET /msr/portfolios/{id}/hedge-effectiveness"
    input_set: "every HedgePosition with portfolio_id == the target portfolio; only rows with status == OPEN contribute to net_hedged_position_cents"
    constants:
      OAD_FACTOR: "{TBA_LONG: 4.5, SWAPTION_RECEIVER: 6.0, TREASURY_FUTURE_LONG: 5.5}"
    precision: "Exact decimal arithmetic, one ROUND_HALF_UP to whole cents at the end. The sign is preserved (ROUND_HALF_UP on the magnitude, i.e. -0.5 rounds to -1)."
    formula: |
      current_base_rate_bps = base_rate_bps of the snapshot chosen by calculations.active_rate_curve_selection
      mark_to_market_cents  = round_half_up(
          notional_cents
          * hedge_ratio_pct / 100
          * OAD_FACTOR[instrument]
          * (entry_base_rate_bps - current_base_rate_bps) / 10000,
          0)
      net_hedged_position_cents =
          (msr_value_cents of the run chosen by calculations.effective_valuation_selection, 0 when none)
        + sum of mark_to_market_cents over HedgePositions on the portfolio with status == OPEN
      On close: close_base_rate_bps = current_base_rate_bps and realized_pnl_cents = mark_to_market_cents
      at that instant; the row stops contributing to net_hedged_position_cents.
    notes:
      - "The MSR asset has negative effective duration - it gains value as rates rise - so these long-duration instruments are deliberately signed to LOSE value as rates rise. A rate rise therefore shows up as a positive MSR delta and a negative hedge mark."
      - "The mark is a pure function of the current ACTIVE curve, so it is fully reversible: returning the curve to the entry level restores mark_to_market_cents to 0 and net_hedged_position_cents to the unhedged value with no accumulated drift."
      - "CLOSED positions keep their realized_pnl_cents frozen and are never re-marked by a later curve."

# =============================================================================
# §1.4 Validation Table (evaluated in ascending priority; the first violated rule wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    rule: "X-User-ID header present and non-empty on every endpoint except POST /_clock/set_current_utc."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: authz
    rule: "The X-User-Role header is present and names a role declared in §1.7, and that role is listed for the endpoint being called."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: shape
    rule: "Request body parses, every required field is present, every field satisfies its declared type / enum / range / decimal-place constraint, and no unknown field is supplied for a system or computed field."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    rule: "Every id in the URL path resolves to a live row."
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    rule: "Every id in the request body (seller_id, bidder_id, loan_id, winning_bid_id, assumption_set_id, valuation_run_id, portfolio_id) resolves to a live row."
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /msr/portfolios, POST /msr/bid-packages, POST /msr/bid-packages/{id}/bids, POST /msr/bid-packages/{id}/award, POST /msr/servicing-transfers/{id}/notices, POST /msr/servicing-transfers/{id}/error-cases, POST /msr/hedge-positions, POST /msr/portfolios/{id}/valuation-runs"

  - priority: 6
    category: authz
    rule: "For entity_backed roles the acting X-User-ID must be the row the operation belongs to: SellerServicer must equal ServicingPortfolio.seller_id; BuyerServicer must equal Bid.bidder_id or PurchaseAgreement.buyer_id as applicable."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /msr/portfolios/{id}/lock-tape, POST /msr/portfolios/{id}/loans, POST /msr/bids/{id}/revise, POST /msr/servicing-transfers/{id}/map-data, .../map-escrow, .../rollback-escrow-mapping, .../reconcile, .../transfer-pipeline, .../notices, POST /msr/error-cases/{id}/acknowledge, POST /msr/error-cases/{id}/resolve"

  - priority: 7
    category: business_integrity
    rule: "A Counterparty named as a portfolio seller must have role_type == SELLER; a Counterparty named as a bidder or buyer must have role_type == BUYER."
    error_id: ERR_COUNTERPARTY_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /msr/portfolios, POST /msr/bid-packages/{id}/bids"

  - priority: 8
    category: state
    rule: "Loans may be added only while ServicingPortfolio.status == DRAFT."
    error_id: ERR_TAPE_LOCKED
    http_status: 409
    applies_to: "POST /msr/portfolios/{id}/loans"

  - priority: 9
    category: state
    rule: "A BidPackage may be created and stratified only while its ServicingPortfolio.status == TAPE_LOCKED; a valuation run requires the tape locked as well."
    error_id: ERR_TAPE_NOT_LOCKED
    http_status: 409
    applies_to: "POST /msr/bid-packages, POST /msr/bid-packages/{id}/stratify, POST /msr/portfolios/{id}/valuation-runs"

  - priority: 10
    category: state
    rule: "The BidPackage is in the state the action requires: stratify needs DRAFT, publish needs STRATIFIED, award needs PUBLISHED, tape-line edits need STRATIFIED."
    error_id: ERR_PACKAGE_INVALID_STATE
    http_status: 409
    applies_to: "POST /msr/bid-packages/{id}/stratify, .../publish, .../award, PATCH /msr/tape-lines/{id}"

  - priority: 11
    category: state
    rule: "Bids may be submitted only while BidPackage.status == PUBLISHED. A DRAFT, STRATIFIED, BIDDING_SUSPENDED, AWARDED or CANCELLED package accepts none."
    error_id: ERR_PACKAGE_NOT_ACCEPTING_BIDS
    http_status: 409
    applies_to: "POST /msr/bid-packages/{id}/bids"

  - priority: 12
    category: state
    rule: "The Bid is in a state the action allows: counter needs SUBMITTED or REVISED, revise needs COUNTERED, award nomination needs SUBMITTED or REVISED."
    error_id: ERR_BID_INVALID_STATE
    http_status: 409
    applies_to: "POST /msr/bids/{id}/counter, POST /msr/bids/{id}/revise, POST /msr/bid-packages/{id}/award"

  - priority: 13
    category: state
    rule: "The PurchaseAgreement is in the state the action requires: approval requests and submit-for-approval need DRAFTED, decisions need PENDING_APPROVALS, settle needs PENDING_APPROVALS, APPROVED or CONDITIONALLY_APPROVED, holdback-releases need SETTLED or HOLDBACK_RELEASED, holdback-clawbacks need HOLDBACK_RELEASED. A settle attempt on a PENDING_APPROVALS agreement deliberately passes this state check so that the more specific ERR_AGENCY_APPROVAL_PENDING at priority 23 is the reported reason; DRAFTED, SETTLED, HOLDBACK_RELEASED, CLOSED and TERMINATED are refused here."
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /msr/purchase-agreements/{id}/approval-requests, .../submit-for-approval, .../settle, .../holdback-releases, .../holdback-clawbacks, POST /msr/approval-requests/{id}/decide"

  - priority: 14
    category: state
    rule: "The ServicingTransfer is in the state the action requires: every workflow step needs status == IN_PROGRESS; complete needs IN_PROGRESS. Dimension ordering is also enforced here - map-escrow before map-data, and rollback-escrow-mapping while data_status is not ESCROW_MAPPED, are refused with this error - with one deliberate exception: reconcile filed before the custodial sweep passes this rule so that the more specific ERR_ESCROW_NOT_MAPPED at priority 31 is the reported reason."
    error_id: ERR_TRANSFER_INVALID_STATE
    http_status: 409
    applies_to: "POST /msr/servicing-transfers/{id}/map-data, .../map-escrow, .../rollback-escrow-mapping, .../reconcile, .../transfer-pipeline, .../notices, .../attest-notices, .../complete"

  - priority: 15
    category: state
    rule: "The ErrorResolutionCase is in the state the action requires: acknowledge needs OPEN or REOPENED, resolve needs ACKNOWLEDGED, reopen needs RESOLVED or ESCALATED. A reopen aimed at an ESCALATED case deliberately passes this state check so the more specific ERR_MAX_REOPENS_EXCEEDED at priority 42 is the reported reason; acknowledge and resolve on an ESCALATED case are refused here."
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /msr/error-cases/{id}/acknowledge, .../resolve, .../reopen"

  - priority: 16
    category: state
    rule: "An ApprovalRequest may be decided only once; a second decision on the same request is refused."
    error_id: ERR_APPROVAL_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /msr/approval-requests/{id}/decide"

  - priority: 17
    category: state
    rule: "A HedgePosition may be closed only while status == OPEN."
    error_id: ERR_HEDGE_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /msr/hedge-positions/{id}/close"

  - priority: 18
    category: concurrency
    rule: "The supplied expected_<parent>_version equals the current parent version (see §1.2.1)."
    error_id: "ERR_STALE_PORTFOLIO_VERSION / ERR_STALE_BID_PACKAGE_VERSION / ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /msr/portfolios/{id}/valuation-runs, POST /msr/bid-packages/{id}/bids, POST /msr/purchase-agreements/{id}/holdback-releases"

  - priority: 19
    category: authz
    rule: "Segregation of duties. (a) On decide, X-User-ID must differ from decided_by_user_id of every already-decided ApprovalRequest on the same agreement. (b) On holdback-releases, X-User-ID must differ from ServicingTransfer.notice_attested_by_user_id. (c) On award, X-User-ID must differ from the bound ValuationRun.run_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /msr/approval-requests/{id}/decide, POST /msr/purchase-agreements/{id}/holdback-releases, POST /msr/bid-packages/{id}/award"

  - priority: 20
    category: cross_entity_state
    rule: "A BidPackage may be published only when its bound ValuationRun.status == COMPLETED. A STALE or SUPERSEDED run is not a publishable basis."
    error_id: ERR_VALUATION_STALE
    http_status: 409
    applies_to: "POST /msr/bid-packages/{id}/publish"

  - priority: 21
    category: business_safety
    rule: "The named bidder Counterparty must have status == ACTIVE and must hold the agency approval matching ServicingPortfolio.agency_type."
    error_id: ERR_BIDDER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /msr/bid-packages/{id}/bids, POST /msr/bid-packages/{id}/award"

  - priority: 22
    category: business_safety
    rule: "The named bidder's PRE_AWARD counterparty_transfer_risk_score must be >= 40."
    error_id: ERR_BIDDER_RISK_TIER_TOO_HIGH
    http_status: 422
    applies_to: "POST /msr/bid-packages/{id}/bids"

  - priority: 23
    category: business_integrity
    rule: "A PurchaseAgreement may not be settled while any ApprovalRequest on it is still PENDING, i.e. while approval_pending_count > 0. This is the discriminated refusal for the PENDING_APPROVALS state that rule 13 admits, so a partially-decided approval set reports the pending approvals rather than a generic invalid state."
    error_id: ERR_AGENCY_APPROVAL_PENDING
    http_status: 409
    applies_to: "POST /msr/purchase-agreements/{id}/settle"

  - priority: 24
    category: business_integrity
    rule: "Settling a CONDITIONALLY_APPROVED agreement requires a non-empty condition_waiver_reference."
    error_id: ERR_CONDITION_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /msr/purchase-agreements/{id}/settle"

  - priority: 25
    category: business_temporal
    rule: "transfer_date must be at least 15 days after the current logical clock date, and sale_date must not be after transfer_date."
    error_id: ERR_TRANSFER_DATE_TOO_SOON
    http_status: 422
    applies_to: "POST /msr/purchase-agreements/{id}/settle"

  - priority: 26
    category: authz
    rule: "The notice sender role must match the notice_type: TRANSFEROR_15DAY and COMBINED require SellerServicer, TRANSFEREE_15DAY requires BuyerServicer."
    error_id: ERR_NOTICE_SENDER_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /msr/servicing-transfers/{id}/notices"

  - priority: 27
    category: business_integrity
    rule: "BorrowerNotice.effective_date must equal the PurchaseAgreement.transfer_date of the bound transfer."
    error_id: ERR_NOTICE_EFFECTIVE_DATE_MISMATCH
    http_status: 422
    applies_to: "POST /msr/servicing-transfers/{id}/notices"

  - priority: 28
    category: business_integrity
    rule: "The loan named on a notice or an error case must have a TapeLine with included == true on the awarded BidPackage of the transfer's agreement."
    error_id: ERR_LOAN_NOT_ON_TAPE
    http_status: 422
    applies_to: "POST /msr/servicing-transfers/{id}/notices, POST /msr/servicing-transfers/{id}/error-cases"

  - priority: 29
    category: business_integrity
    rule: "Attesting notices requires that every included tape Loan has at least one BorrowerNotice of type TRANSFEROR_15DAY or COMBINED on this transfer."
    error_id: ERR_NOTICE_COMPLIANCE_INCOMPLETE
    http_status: 409
    applies_to: "POST /msr/servicing-transfers/{id}/attest-notices"

  - priority: 30
    category: business_integrity
    rule: "Attesting notices requires ServicingTransfer.late_notice_count == 0."
    error_id: ERR_NOTICE_LATE
    http_status: 409
    applies_to: "POST /msr/servicing-transfers/{id}/attest-notices"

  - priority: 31
    category: business_integrity
    rule: "Reconciling requires data_status == ESCROW_MAPPED, i.e. escrow and suspense must already have been swept."
    error_id: ERR_ESCROW_NOT_MAPPED
    http_status: 409
    applies_to: "POST /msr/servicing-transfers/{id}/reconcile"

  - priority: 32
    category: business_integrity
    rule: "Completing a transfer requires readiness == READY (all three dimensions terminal)."
    error_id: ERR_TRANSFER_NOT_READY
    http_status: 409
    applies_to: "POST /msr/servicing-transfers/{id}/complete"

  - priority: 33
    category: resource_temporal
    rule: "The marketing window [marketing_start_at, bid_deadline_at) of a BidPackage being published must not overlap the window of any other BidPackage on the same ServicingPortfolio whose status is STRATIFIED, PUBLISHED or BIDDING_SUSPENDED. The interval is half-open, so back-to-back windows that touch at an instant do not collide. Capacity is 1."
    error_id: ERR_MARKETING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /msr/bid-packages/{id}/publish"

  - priority: 34
    category: resource_temporal
    rule: "A buyer Counterparty may onboard one transfer at a time: the closed onboarding window [transfer_date - 30 days, transfer_date + 30 days] of the transfer being created must not intersect the window of any existing ServicingTransfer with status == IN_PROGRESS for the same buyer. The interval is closed, so windows that touch at their endpoints DO collide. Capacity is 1."
    error_id: ERR_ONBOARDING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /msr/purchase-agreements/{id}/settle"

  - priority: 35
    category: business_integrity
    rule: "At most one ApprovalRequest per (purchase_agreement_id, approver_type, agency_type) triple."
    error_id: ERR_DUPLICATE_APPROVAL_REQUEST
    http_status: 409
    applies_to: "POST /msr/purchase-agreements/{id}/approval-requests"

  - priority: 36
    category: business_integrity
    rule: "loan_number must be unique within a ServicingPortfolio."
    error_id: ERR_DUPLICATE_LOAN_NUMBER
    http_status: 409
    applies_to: "POST /msr/portfolios/{id}/loans"

  - priority: 37
    category: business_temporal
    rule: "A new RateCurveSnapshot must have as_of_date strictly greater than the as_of_date of the current ACTIVE snapshot."
    error_id: ERR_RATE_CURVE_DATE_NOT_ADVANCING
    http_status: 422
    applies_to: "POST /msr/rate-curves"

  - priority: 38
    category: business_integrity
    rule: "An operation that needs a market rate requires an ACTIVE RateCurveSnapshot to exist."
    error_id: ERR_NO_ACTIVE_RATE_CURVE
    http_status: 409
    applies_to: "POST /msr/portfolios/{id}/valuation-runs, POST /msr/hedge-positions, POST /msr/hedge-positions/{id}/close"

  - priority: 39
    category: business_temporal
    rule: "A bid may be submitted only while the current logical clock is within [marketing_start_at, bid_deadline_at); a revision may be filed only while the current logical clock is before Bid.counter_expires_at."
    error_id: ERR_BID_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /msr/bid-packages/{id}/bids, POST /msr/bids/{id}/revise"

  - priority: 40
    category: business_integrity
    rule: "Bid.round_number may not exceed MAX_NEGOTIATION_ROUNDS = 3; a revision from round 3 is refused."
    error_id: ERR_MAX_NEGOTIATION_ROUNDS
    http_status: 409
    applies_to: "POST /msr/bids/{id}/revise"

  - priority: 41
    category: business_temporal
    rule: "A case may be reopened only within 60 days of its resolved_at."
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /msr/error-cases/{id}/reopen"

  - priority: 42
    category: business_integrity
    rule: "reopen_count may not exceed MAX_REOPENS = 2. A reopen filed while reopen_count == 2 escalates the case instead of cycling; a reopen filed against an already ESCALATED case is refused with this error, which is why rule 15 admits ESCALATED for the reopen action."
    error_id: ERR_MAX_REOPENS_EXCEEDED
    http_status: 409
    applies_to: "POST /msr/error-cases/{id}/reopen"

  - priority: 43
    category: business_temporal
    rule: "A holdback release requires the bound ServicingTransfer.status == COMPLETED and the current logical clock date >= holdback_release_eligible_at."
    error_id: ERR_HOLDBACK_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /msr/purchase-agreements/{id}/holdback-releases"

  - priority: 44
    category: business_fiscal
    rule: "Bid.bid_value_cents must be >= BidPackage.reserve_price_cents on submission and on every revision."
    error_id: ERR_BID_BELOW_RESERVE
    http_status: 422
    applies_to: "POST /msr/bid-packages/{id}/bids, POST /msr/bids/{id}/revise"

  - priority: 45
    category: boundary
    rule: "A BidPackage with tape_loan_count == 0 (every TapeLine excluded) may not be published."
    error_id: ERR_TAPE_EMPTY
    http_status: 422
    applies_to: "POST /msr/bid-packages/{id}/publish"

  - priority: 46
    category: business_fiscal
    rule: "The complaint concentration tier must permit a non-zero release percentage (complaint_ratio_pct <= 50.00)."
    error_id: ERR_COMPLAINT_TIER_BLOCKS_RELEASE
    http_status: 409
    applies_to: "POST /msr/purchase-agreements/{id}/holdback-releases"

  - priority: 47
    category: business_fiscal
    rule: "A release requires holdback_retained_cents > 0."
    error_id: ERR_HOLDBACK_EXHAUSTED
    http_status: 409
    applies_to: "POST /msr/purchase-agreements/{id}/holdback-releases"

  - priority: 48
    category: business_fiscal
    rule: "A clawback amount_cents must be > 0 and <= holdback_released_cents."
    error_id: ERR_CLAWBACK_EXCEEDS_RELEASED
    http_status: 422
    applies_to: "POST /msr/purchase-agreements/{id}/holdback-clawbacks"

validation_priority_notes:
  - "Rules 8-17 (state) all outrank rules 21-48 (business), so an action refused for state reasons never reveals a pricing or eligibility problem. Instance priority_pair_validation_conflict_state_beats_reserve in §1.8 pins the pair (11, 44)."
  - "Rule 21 (business_safety) outranks rule 39 (business_temporal), so an ineligible bidder is told about eligibility even after the deadline has passed. Instance priority_pair_validation_conflict_safety_beats_deadline in §1.8 pins the pair (21, 39)."
  - "The OCC check at 18 runs after all state checks but before every business check, so a stale version on a legitimately-refused action still yields the state error, not the 412."

# =============================================================================
# §1.5 API Endpoint Table
# All business paths sit under api_prefix "/msr". Path parameters are written
# "{id}" uniformly; the owning collection segment disambiguates them.
# =============================================================================
endpoints:

  # --- Counterparties -------------------------------------------------------
  - method: POST
    path: "/msr/counterparties"
    description: "Register a seller or buyer servicer on the transaction desk."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, role_type, net_worth_cents, servicer_rating, "agency_approvals?"]
    output: Counterparty
    side_effects: ["status defaults to ACTIVE", "open_transfer_count initialised to 0"]

  - method: GET
    path: "/msr/counterparties/{id}"
    description: "Read one counterparty."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk, AgencyApprover, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: Counterparty
    side_effects: []

  - method: GET
    path: "/msr/counterparties"
    description: "List counterparties, optionally filtered by role_type and status."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer]
    code: 200
    input: ["role_type?", "status?", "limit?", "offset?"]
    output: Counterparty[]
    side_effects: []

  - method: POST
    path: "/msr/counterparties/{id}/suspend"
    description: "Suspend a counterparty; it can no longer be named as bidder or buyer."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Counterparty
    side_effects: ["status ACTIVE -> SUSPENDED", "suspended_at stamped", "increments version by 1"]

  - method: GET
    path: "/msr/counterparties/{id}/risk-score"
    description: "Computed read: counterparty_transfer_risk_score under the requested variant (defaults to PRE_AWARD)."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer]
    code: 200
    input: ["variant?"]
    output: { variant: string, score: integer, tier: string, rating_penalty: integer, capital_penalty: integer, approval_penalty: integer, complaint_penalty: integer, sla_penalty: integer }
    side_effects: ["none (read-only computation)"]

  # --- Portfolios and loans -------------------------------------------------
  - method: POST
    path: "/msr/portfolios"
    description: "Open a servicing portfolio for sale. The acting SellerServicer must be the named seller."
    roles: [SellerServicer, PlatformAdmin]
    code: 201
    input: [seller_id, portfolio_name, agency_type]
    output: ServicingPortfolio
    side_effects: ["status DRAFT", "loan_count / total_upb_cents / custodial_funds_total_cents initialised to 0", "valuation_freshness NONE"]

  - method: GET
    path: "/msr/portfolios/{id}"
    description: "Read one servicing portfolio with its derived tape aggregates."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: ServicingPortfolio
    side_effects: []

  - method: GET
    path: "/msr/portfolios"
    description: "List servicing portfolios; reverse-reachability for ServicingPortfolio.seller_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk, SellerServicer, BuyerServicer]
    code: 200
    input: ["seller_id?", "status?", "agency_type?", "valuation_freshness?", "limit?", "offset?"]
    output: ServicingPortfolio[]
    side_effects: []

  - method: POST
    path: "/msr/portfolios/{id}/loans"
    description: "Add a loan to the pool while the portfolio is still DRAFT."
    roles: [SellerServicer]
    code: 201
    input: [loan_number, upb_cents, note_rate_pct, servicing_fee_bps, "escrow_balance_cents?", "suspense_balance_cents?", "delinquency_bucket?", "loss_mit_status?", state_code]
    output: Loan
    side_effects: ["ServicingPortfolio.loan_count, total_upb_cents, weighted_avg_note_rate_pct and custodial_funds_total_cents recomputed", "increments ServicingPortfolio.version by 1"]

  - method: GET
    path: "/msr/portfolios/{id}/loans"
    description: "List the loans of a portfolio; reverse-reachability for Loan.portfolio_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["status?", "delinquency_bucket?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/msr/portfolios/{id}/lock-tape"
    description: "Freeze the pool composition as the pricing basis. Returns the portfolio, whose version is the OCC token for valuation runs."
    roles: [SellerServicer]
    code: 200
    input: []
    output: ServicingPortfolio
    side_effects: ["status DRAFT -> TAPE_LOCKED", "tape_locked_at stamped", "aggregates frozen", "increments version by 1"]

  - method: GET
    path: "/msr/loans/{id}"
    description: "Read one loan."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/msr/loans/{id}/tape-lines"
    description: "List every tape line cut for a loan; reverse-reachability for TapeLine.loan_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["included?", "limit?", "offset?"]
    output: TapeLine[]
    side_effects: []

  - method: GET
    path: "/msr/loans/{id}/notices"
    description: "List the borrower notices sent for a loan; reverse-reachability for BorrowerNotice.loan_id."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["notice_type?", "compliance_status?", "limit?", "offset?"]
    output: BorrowerNotice[]
    side_effects: []

  # --- Assumptions and rate curves -----------------------------------------
  - method: POST
    path: "/msr/assumption-sets"
    description: "Create an immutable valuation assumption set (prepayment speed, discount rate, cost to service, float)."
    roles: [ValuationAnalyst]
    code: 201
    input: [assumption_name, cpr_pct, discount_rate_pct, cost_to_service_annual_cents, float_earnings_rate_pct, projection_years]
    output: AssumptionSet
    side_effects: ["none; the row is immutable and carries no version"]

  - method: GET
    path: "/msr/assumption-sets/{id}"
    description: "Read one assumption set."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: []

  - method: POST
    path: "/msr/rate-curves"
    description: "Publish a new rate curve snapshot. Supersedes the incumbent ACTIVE snapshot and starts cascade A."
    roles: [HedgeDesk]
    code: 201
    input: [as_of_date, base_rate_bps, primary_secondary_spread_bps]
    output: RateCurveSnapshot
    side_effects:
      - "the incumbent ACTIVE snapshot transitions to SUPERSEDED"
      - "cascade A: COMPLETED ValuationRuns on that snapshot -> STALE; PUBLISHED BidPackages on those runs -> BIDDING_SUSPENDED; live Bids on those packages -> LAPSED"
      - "every OPEN HedgePosition has mark_to_market_cents recomputed"

  - method: GET
    path: "/msr/rate-curves/{id}"
    description: "Read one rate curve snapshot."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk]
    code: 200
    input: []
    output: RateCurveSnapshot
    side_effects: []

  - method: GET
    path: "/msr/rate-curves"
    description: "List rate curve snapshots newest first."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RateCurveSnapshot[]
    side_effects: []

  # --- Valuation ------------------------------------------------------------
  - method: POST
    path: "/msr/portfolios/{id}/valuation-runs"
    description: "Run an MSR fair-value valuation against the locked tape. OCC-guarded by expected_portfolio_version."
    roles: [ValuationAnalyst]
    code: 201
    input: [assumption_set_id, method, expected_portfolio_version]
    output: ValuationRun
    side_effects:
      - "binds the snapshot chosen by calculations.active_rate_curve_selection"
      - "value_cents, value_bps_of_upb, effective_discount_rate_pct, included_loan_count and (for OAS_SHOCK_WEIGHTED) scenario_values computed by calculations.msr_fair_value"
      - "sequence_no assigned as the next per-portfolio integer; run_by_user_id = X-User-ID"
      - "an earlier COMPLETED or STALE run on the same portfolio transitions to SUPERSEDED unless a live BidPackage references it"
      - "ServicingPortfolio.valuation_freshness recomputed; increments ServicingPortfolio.version by 1"

  - method: GET
    path: "/msr/valuation-runs/{id}"
    description: "Read one valuation run."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk]
    code: 200
    input: []
    output: ValuationRun
    side_effects: []

  - method: GET
    path: "/msr/valuation-runs"
    description: "List valuation runs; reverse-reachability for ValuationRun.portfolio_id, .assumption_set_id and .rate_curve_snapshot_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk]
    code: 200
    input: ["portfolio_id?", "assumption_set_id?", "rate_curve_snapshot_id?", "method?", "status?", "limit?", "offset?"]
    output: ValuationRun[]
    side_effects: []

  # --- Bid packages, tape lines, bids ---------------------------------------
  - method: POST
    path: "/msr/bid-packages"
    description: "Create a bid package (marketing vehicle) bound to a locked tape and a valuation run."
    roles: [ValuationAnalyst, TransactionManager]
    code: 201
    input: [portfolio_id, valuation_run_id, stratification_scheme, reserve_price_floor_pct, marketing_start_at, bid_deadline_at]
    output: BidPackage
    side_effects: ["status DRAFT", "tape aggregates and reserve_price_cents left null until stratify / publish"]

  - method: GET
    path: "/msr/bid-packages/{id}"
    description: "Read one bid package. Its version is the OCC token for bid submission."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: BidPackage
    side_effects: []

  - method: GET
    path: "/msr/bid-packages"
    description: "List bid packages; reverse-reachability for BidPackage.portfolio_id and .valuation_run_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["portfolio_id?", "valuation_run_id?", "status?", "limit?", "offset?"]
    output: BidPackage[]
    side_effects: []

  - method: POST
    path: "/msr/bid-packages/{id}/stratify"
    description: "Cut the loan-level tape and assign strata per the package's stratification_scheme."
    roles: [ValuationAnalyst]
    code: 200
    input: []
    output: BidPackage
    side_effects: ["one TapeLine per ACTIVE loan with included = true and upb_snapshot_cents copied", "stratum_label assigned by calculations.tape_stratification", "tape_upb_cents / tape_loan_count / stratum_count recomputed", "status DRAFT -> STRATIFIED", "increments version by 1"]

  - method: GET
    path: "/msr/bid-packages/{id}/tape-lines"
    description: "List the loan-level tape of a package; reverse-reachability for TapeLine.bid_package_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["included?", "stratum_label?", "limit?", "offset?"]
    output: TapeLine[]
    side_effects: []

  - method: PATCH
    path: "/msr/tape-lines/{id}"
    description: "Include or exclude a single tape line while the package is STRATIFIED."
    roles: [ValuationAnalyst]
    code: 200
    input: [included, "exclusion_reason?"]
    output: TapeLine
    side_effects: ["BidPackage.tape_upb_cents, tape_loan_count and stratum_count recomputed", "increments BidPackage.version by 1"]

  - method: GET
    path: "/msr/tape-lines/{id}"
    description: "Read one tape line."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: TapeLine
    side_effects: []

  - method: POST
    path: "/msr/bid-packages/{id}/publish"
    description: "Publish the bid package to the market and stamp the reserve price. Returns the package, whose version is the OCC token for bids."
    roles: [TransactionManager]
    code: 200
    input: []
    output: BidPackage
    side_effects: ["reserve_price_cents stamped by calculations.reserve_price", "published_at stamped", "status STRATIFIED -> PUBLISHED", "increments version by 1"]

  - method: POST
    path: "/msr/bid-packages/{id}/bids"
    description: "Submit a bid on a published package. OCC-guarded by expected_bid_package_version."
    roles: [BuyerServicer, TransactionManager]
    code: 201
    input: [bidder_id, price_bps, holdback_pct, expected_bid_package_version]
    output: Bid
    side_effects: ["bid_value_cents = round_half_up(BidPackage.tape_upb_cents * price_bps / 10000, 0)", "round_number initialised to 1", "BidPackage.bid_count incremented", "increments BidPackage.version by 1"]

  - method: GET
    path: "/msr/bids/{id}"
    description: "Read one bid."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: "/msr/bids"
    description: "List bids; reverse-reachability for Bid.bid_package_id and Bid.bidder_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["bid_package_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: POST
    path: "/msr/bids/{id}/counter"
    description: "Counter a bid, opening a negotiation round with an expiry."
    roles: [TransactionManager]
    code: 200
    input: [counter_price_bps, counter_expires_at]
    output: Bid
    side_effects: ["status SUBMITTED|REVISED -> COUNTERED", "counter_price_bps and counter_expires_at stamped", "increments version by 1"]

  - method: POST
    path: "/msr/bids/{id}/revise"
    description: "Revise a countered bid. Bounded by MAX_NEGOTIATION_ROUNDS = 3."
    roles: [BuyerServicer]
    code: 200
    input: [price_bps, holdback_pct]
    output: Bid
    side_effects: ["status COUNTERED -> REVISED", "round_number incremented", "bid_value_cents recomputed", "counter fields cleared", "increments version by 1"]

  # --- Award and purchase agreement -----------------------------------------
  - method: POST
    path: "/msr/bid-packages/{id}/award"
    description: "Award the package to a bid and draft the purchase agreement with holdback terms."
    roles: [TransactionManager]
    code: 201
    input: [winning_bid_id, "rep_warrant_days?", "indemnification_days?"]
    output: PurchaseAgreement
    side_effects:
      - "purchase_price_cents and stratum_price_breakdown computed by calculations.purchase_price"
      - "holdback_cents, holdback_retained_cents and settlement_wire_cents computed by calculations.holdback_sizing"
      - "winning Bid -> ACCEPTED; every other live Bid on the package -> REJECTED"
      - "BidPackage PUBLISHED -> AWARDED; ServicingPortfolio TAPE_LOCKED -> UNDER_CONTRACT"
      - "drafted_by_user_id = X-User-ID; refused with ERR_SEGREGATION_OF_DUTIES when it equals the bound ValuationRun.run_by_user_id"

  - method: GET
    path: "/msr/purchase-agreements/{id}"
    description: "Read one purchase agreement. Its version is the OCC token for holdback releases."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, AgencyApprover, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: []

  - method: GET
    path: "/msr/purchase-agreements"
    description: "List purchase agreements; reverse-reachability for .bid_package_id, .winning_bid_id and .buyer_id."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, AgencyApprover, SellerServicer, BuyerServicer]
    code: 200
    input: ["bid_package_id?", "winning_bid_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: PurchaseAgreement[]
    side_effects: []

  - method: POST
    path: "/msr/purchase-agreements/{id}/approval-requests"
    description: "Raise an agency or investor approval prerequisite on the agreement."
    roles: [TransactionManager]
    code: 201
    input: [approver_type, agency_type]
    output: ApprovalRequest
    side_effects: ["status PENDING", "at most one request per (agreement, approver_type, agency_type)"]

  - method: GET
    path: "/msr/purchase-agreements/{id}/approval-requests"
    description: "List the approval prerequisites of an agreement; reverse-reachability for ApprovalRequest.purchase_agreement_id."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, AgencyApprover, SellerServicer, BuyerServicer]
    code: 200
    input: ["status?", "approver_type?", "limit?", "offset?"]
    output: ApprovalRequest[]
    side_effects: []

  - method: GET
    path: "/msr/approval-requests/{id}"
    description: "Read one approval request."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, AgencyApprover]
    code: 200
    input: []
    output: ApprovalRequest
    side_effects: []

  - method: POST
    path: "/msr/purchase-agreements/{id}/submit-for-approval"
    description: "Move the agreement into PENDING_APPROVALS so agency approvers can decide."
    roles: [TransactionManager]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["status DRAFTED -> PENDING_APPROVALS", "approval_pending_count recomputed", "increments version by 1"]

  - method: POST
    path: "/msr/approval-requests/{id}/decide"
    description: "Record an agency or investor decision. Segregation of duties: one user may decide at most one request per agreement."
    roles: [AgencyApprover]
    code: 200
    input: [decision, "condition_text?"]
    output: ApprovalRequest
    side_effects:
      - "decided_by_user_id and decided_at stamped"
      - "agreement joins to APPROVED (no conditions), CONDITIONALLY_APPROVED (at least one condition, holdback re-sized to the 15 percent floor), or TERMINATED immediately on a DENIED decision"
      - "on TERMINATED: BidPackage -> CANCELLED, ACCEPTED Bid -> REJECTED, ServicingPortfolio UNDER_CONTRACT -> TAPE_LOCKED"

  - method: POST
    path: "/msr/purchase-agreements/{id}/settle"
    description: "Settle the trade, wire the net proceeds and open the servicing transfer."
    roles: [TransactionManager]
    code: 200
    input: [sale_date, transfer_date, "condition_waiver_reference?"]
    output: PurchaseAgreement
    side_effects:
      - "sale_date, transfer_date and holdback_release_eligible_at stamped"
      - "a ServicingTransfer is created in IN_PROGRESS with all three dimensions NOT_STARTED and readiness NOT_READY"
      - "the buyer's onboarding window [transfer_date - 30d, transfer_date + 30d] is reserved (capacity 1)"
      - "status APPROVED|CONDITIONALLY_APPROVED -> SETTLED; increments version by 1"

  - method: POST
    path: "/msr/purchase-agreements/{id}/holdback-releases"
    description: "Release holdback against the complaint concentration tier. OCC-guarded by expected_purchase_agreement_version."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_purchase_agreement_version]
    output: PurchaseAgreement
    side_effects:
      - "holdback_retained_cents / holdback_released_cents / holdback_applied_cents updated by calculations.complaint_concentration_release"
      - "status SETTLED -> HOLDBACK_RELEASED, or -> CLOSED when the retained balance reaches 0 after the indemnification period"
      - "increments version by 1"

  - method: POST
    path: "/msr/purchase-agreements/{id}/holdback-clawbacks"
    description: "Claw back a released holdback amount back into the retained balance (compensating move)."
    roles: [ComplianceOfficer]
    code: 200
    input: [amount_cents, reason]
    output: PurchaseAgreement
    side_effects:
      - "holdback_released_cents -= amount_cents; holdback_retained_cents += amount_cents"
      - "status HOLDBACK_RELEASED -> SETTLED when the released balance returns to 0"
      - "increments version by 1"

  # --- Servicing transfer ---------------------------------------------------
  - method: GET
    path: "/msr/servicing-transfers/{id}"
    description: "Read one servicing transfer with its three parallel dimensions and derived readiness."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects: []

  - method: GET
    path: "/msr/servicing-transfers"
    description: "List servicing transfers; reverse-reachability for ServicingTransfer.purchase_agreement_id. This is the only discovery channel for a transfer, which is created by the settle cascade."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["purchase_agreement_id?", "status?", "notice_status?", "data_status?", "pipeline_status?", "readiness?", "limit?", "offset?"]
    output: ServicingTransfer[]
    side_effects: []

  - method: POST
    path: "/msr/servicing-transfers/{id}/map-data"
    description: "Record the loan-level data mapping scheme (data_status dimension, step 1)."
    roles: [BuyerServicer]
    code: 200
    input: [mapping_scheme]
    output: ServicingTransfer
    side_effects: ["data_status NOT_STARTED -> MAPPED", "readiness re-derived", "increments version by 1"]

  - method: POST
    path: "/msr/servicing-transfers/{id}/map-escrow"
    description: "Sweep escrow and suspense custodial balances from the seller's loans to the transfer (data_status dimension, step 2)."
    roles: [BuyerServicer]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects:
      - "each included tape Loan's escrow_balance_at_mapping_cents and suspense_balance_at_mapping_cents stamped, then escrow_balance_cents and suspense_balance_cents zeroed"
      - "escrow_transferred_cents and suspense_transferred_cents set to the swept totals"
      - "custodial_funds_total_cents invariant preserved"
      - "data_status MAPPED -> ESCROW_MAPPED"
      - "increments version by 1"

  - method: POST
    path: "/msr/servicing-transfers/{id}/rollback-escrow-mapping"
    description: "Reverse the custodial sweep without drift (compensating move on the data_status dimension)."
    roles: [BuyerServicer]
    code: 200
    input: [reason]
    output: ServicingTransfer
    side_effects:
      - "loan escrow and suspense balances restored from their *_at_mapping_cents snapshots"
      - "escrow_transferred_cents and suspense_transferred_cents reset to 0"
      - "data_status ESCROW_MAPPED -> MAPPED"
      - "readiness re-derived to NOT_READY"
      - "increments version by 1"

  - method: POST
    path: "/msr/servicing-transfers/{id}/reconcile"
    description: "Reconcile swept custodial funds against the frozen portfolio total (data_status dimension, step 3)."
    roles: [BuyerServicer]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects: ["reconciled_at stamped", "data_status ESCROW_MAPPED -> RECONCILED", "readiness re-derived", "increments version by 1"]

  - method: POST
    path: "/msr/servicing-transfers/{id}/transfer-pipeline"
    description: "Hand over the loss-mitigation pipeline (pipeline_status dimension). Independent of the notice and data dimensions."
    roles: [BuyerServicer]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects: ["loss_mit_pipeline_count computed from included tape loans with loss_mit_status != NONE", "pipeline_status NOT_STARTED -> PIPELINE_TRANSFERRED", "readiness re-derived", "increments version by 1"]

  - method: POST
    path: "/msr/servicing-transfers/{id}/notices"
    description: "Send a statutory servicing-transfer notice to a borrower. Seller sends TRANSFEROR_15DAY / COMBINED, buyer sends TRANSFEREE_15DAY."
    roles: [SellerServicer, BuyerServicer]
    code: 201
    input: [notice_type, loan_id, effective_date]
    output: BorrowerNotice
    side_effects:
      - "sent_at = current logical clock; sent_by_role = the caller role"
      - "lead_days and compliance_status computed by calculations.notice_statutory_window"
      - "ServicingTransfer.notice_count and late_notice_count updated; notice_status NOT_STARTED -> NOTICES_IN_PROGRESS on the first notice"
      - "increments ServicingTransfer.version by 1"

  - method: GET
    path: "/msr/servicing-transfers/{id}/notices"
    description: "List the borrower notices of a transfer; reverse-reachability for BorrowerNotice.servicing_transfer_id."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["notice_type?", "compliance_status?", "loan_id?", "limit?", "offset?"]
    output: BorrowerNotice[]
    side_effects: []

  - method: POST
    path: "/msr/servicing-transfers/{id}/attest-notices"
    description: "Attest that every transferred borrower was noticed within the statutory window (notice_status dimension, terminal)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects: ["notice_attested_by_user_id = X-User-ID; notice_attested_at stamped", "notice_status NOTICES_IN_PROGRESS -> NOTICES_ATTESTED", "readiness re-derived", "increments version by 1"]

  - method: POST
    path: "/msr/servicing-transfers/{id}/complete"
    description: "Complete the transfer of servicing. Requires readiness == READY and starts cascade B."
    roles: [TransactionManager]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects:
      - "completed_at stamped; transferred_loan_count set"
      - "cascade B: included tape Loans ACTIVE -> TRANSFERRED; ServicingPortfolio UNDER_CONTRACT -> TRANSFERRED once no Loan is ACTIVE; OPEN HedgePositions on that portfolio -> CLOSED with realized_pnl_cents stamped"
      - "status IN_PROGRESS -> COMPLETED; increments version by 1"

  # --- Post-transfer error resolution ---------------------------------------
  - method: POST
    path: "/msr/servicing-transfers/{id}/error-cases"
    description: "Open a notice-of-error / complaint case against a transferred loan."
    roles: [ComplianceOfficer]
    code: 201
    input: [loan_id, category, description]
    output: ErrorResolutionCase
    side_effects: ["status OPEN; opened_at = current logical clock", "ack_deadline_at = opened_at + 5 days; resolution_deadline_at = opened_at + 30 days", "the case immediately enters the complaint concentration ratio numerator"]

  - method: GET
    path: "/msr/error-cases/{id}"
    description: "Read one error resolution case."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: []
    output: ErrorResolutionCase
    side_effects: []

  - method: GET
    path: "/msr/error-cases"
    description: "List error resolution cases; reverse-reachability for .servicing_transfer_id and .loan_id."
    roles: [PlatformAdmin, TransactionManager, ComplianceOfficer, SellerServicer, BuyerServicer]
    code: 200
    input: ["servicing_transfer_id?", "loan_id?", "status?", "category?", "limit?", "offset?"]
    output: ErrorResolutionCase[]
    side_effects: []

  - method: POST
    path: "/msr/error-cases/{id}/acknowledge"
    description: "Acknowledge a notice of error within the 5-day window."
    roles: [BuyerServicer]
    code: 200
    input: []
    output: ErrorResolutionCase
    side_effects: ["acknowledged_at stamped; ack_breached = acknowledged_at > ack_deadline_at", "status OPEN|REOPENED -> ACKNOWLEDGED", "increments version by 1"]

  - method: POST
    path: "/msr/error-cases/{id}/resolve"
    description: "Resolve a notice of error within the 30-day window, recording any borrower remediation."
    roles: [BuyerServicer]
    code: 200
    input: [remediation_cents, resolution_note]
    output: ErrorResolutionCase
    side_effects: ["resolved_at stamped; resolution_breached = resolved_at > resolution_deadline_at", "remediation_cents becomes chargeable against the holdback", "status ACKNOWLEDGED -> RESOLVED", "increments version by 1"]

  - method: POST
    path: "/msr/error-cases/{id}/reopen"
    description: "Reopen a resolved case within 60 days. The third attempt escalates instead of cycling."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: ErrorResolutionCase
    side_effects: ["reopen_count incremented; acknowledged_at and resolved_at cleared", "status RESOLVED -> REOPENED, or -> ESCALATED when reopen_count was already 2", "increments version by 1"]

  # --- Hedging --------------------------------------------------------------
  - method: POST
    path: "/msr/hedge-positions"
    description: "Open a hedge against the servicing asset at the current ACTIVE curve."
    roles: [HedgeDesk]
    code: 201
    input: [portfolio_id, instrument, notional_cents, hedge_ratio_pct]
    output: HedgePosition
    side_effects: ["entry_base_rate_bps copied from the snapshot chosen by calculations.active_rate_curve_selection", "mark_to_market_cents initialised to 0", "status OPEN"]

  - method: GET
    path: "/msr/hedge-positions/{id}"
    description: "Read one hedge position with its current mark."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk, SellerServicer]
    code: 200
    input: []
    output: HedgePosition
    side_effects: []

  - method: GET
    path: "/msr/portfolios/{id}/hedge-positions"
    description: "List the hedge positions on a portfolio; reverse-reachability for HedgePosition.portfolio_id."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk, SellerServicer]
    code: 200
    input: ["status?", "instrument?", "limit?", "offset?"]
    output: HedgePosition[]
    side_effects: []

  - method: GET
    path: "/msr/portfolios/{id}/hedge-effectiveness"
    description: "Computed read: the effective MSR valuation, the aggregate OPEN hedge mark and the net hedged position."
    roles: [PlatformAdmin, TransactionManager, ValuationAnalyst, ComplianceOfficer, HedgeDesk, SellerServicer]
    code: 200
    input: []
    output: { effective_valuation_run_id: string, msr_value_cents: integer, open_hedge_mtm_cents: integer, net_hedged_position_cents: integer, current_base_rate_bps: integer }
    side_effects: ["none (read-only computation)"]

  - method: POST
    path: "/msr/hedge-positions/{id}/close"
    description: "Close a hedge position and realise its mark."
    roles: [HedgeDesk]
    code: 200
    input: []
    output: HedgePosition
    side_effects: ["close_base_rate_bps and realized_pnl_cents stamped; closed_at set", "status OPEN -> CLOSED", "the row stops contributing to net_hedged_position_cents", "increments version by 1"]

  # --- Test-driving endpoint (outside the public business surface) -----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to wall-clock time before this endpoint is called. Every deadline, statutory window and expiry in this scaffold is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no entity state changes; subsequent requests evaluate every temporal rule against the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- Authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent or empty on any business endpoint."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not one of the roles declared for the endpoint in §1.5."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own (SellerServicer whose X-User-ID is not the portfolio's seller_id, BuyerServicer whose X-User-ID is not the bid's bidder_id or the agreement's buyer_id)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user already performed the incompatible prior step: deciding a second approval on the same agreement, releasing holdback after attesting the notices, or awarding a package it valued."
  - id: ERR_NOTICE_SENDER_ROLE_MISMATCH
    http: 422
    condition: "TRANSFEROR_15DAY or COMBINED sent by a role other than SellerServicer, or TRANSFEREE_15DAY sent by a role other than BuyerServicer."

  # --- Request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unparseable body, out-of-range numeric, bad enum value, wrong type, too many decimal places, or an attempt to set a system/computed field."

  # --- Not found ------------------------------------------------------------
  - id: ERR_COUNTERPARTY_NOT_FOUND
    http: 404
    condition: "counterparty_id in the path or seller_id / bidder_id / winning bidder in the body does not resolve."
  - id: ERR_PORTFOLIO_NOT_FOUND
    http: 404
    condition: "Portfolio id in the path or portfolio_id in the body does not resolve."
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "Loan id in the path or loan_id in the body does not resolve."
  - id: ERR_ASSUMPTION_SET_NOT_FOUND
    http: 404
    condition: "assumption_set_id does not resolve."
  - id: ERR_RATE_CURVE_NOT_FOUND
    http: 404
    condition: "Rate curve snapshot id in the path does not resolve."
  - id: ERR_VALUATION_RUN_NOT_FOUND
    http: 404
    condition: "Valuation run id in the path or valuation_run_id in the body does not resolve."
  - id: ERR_BID_PACKAGE_NOT_FOUND
    http: 404
    condition: "Bid package id in the path does not resolve."
  - id: ERR_TAPE_LINE_NOT_FOUND
    http: 404
    condition: "Tape line id in the path does not resolve."
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "Bid id in the path or winning_bid_id in the body does not resolve."
  - id: ERR_PURCHASE_AGREEMENT_NOT_FOUND
    http: 404
    condition: "Purchase agreement id in the path does not resolve."
  - id: ERR_APPROVAL_REQUEST_NOT_FOUND
    http: 404
    condition: "Approval request id in the path does not resolve."
  - id: ERR_SERVICING_TRANSFER_NOT_FOUND
    http: 404
    condition: "Servicing transfer id in the path does not resolve."
  - id: ERR_ERROR_CASE_NOT_FOUND
    http: 404
    condition: "Error resolution case id in the path does not resolve."
  - id: ERR_HEDGE_POSITION_NOT_FOUND
    http: 404
    condition: "Hedge position id in the path does not resolve."

  # --- State ----------------------------------------------------------------
  - id: ERR_TAPE_LOCKED
    http: 409
    condition: "A loan is added to a portfolio whose status is no longer DRAFT."
  - id: ERR_TAPE_NOT_LOCKED
    http: 409
    condition: "A valuation run, bid package creation or stratification is attempted while the portfolio is still DRAFT (or already UNDER_CONTRACT / TRANSFERRED)."
  - id: ERR_PACKAGE_INVALID_STATE
    http: 409
    condition: "stratify on a non-DRAFT package, publish on a non-STRATIFIED package, award on a non-PUBLISHED package, or a tape-line edit on a package that is not STRATIFIED."
  - id: ERR_PACKAGE_NOT_ACCEPTING_BIDS
    http: 409
    condition: "A bid is submitted on a package whose status is not PUBLISHED (DRAFT, STRATIFIED, BIDDING_SUSPENDED, AWARDED or CANCELLED)."
  - id: ERR_BID_INVALID_STATE
    http: 409
    condition: "counter on a bid that is not SUBMITTED or REVISED, revise on a bid that is not COUNTERED, or award nomination of a bid that is not SUBMITTED or REVISED (including a LAPSED bid)."
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "An agreement action is attempted from a state the transition table does not allow, including deciding a sibling approval after the agreement was TERMINATED and releasing or clawing back holdback on a CLOSED agreement."
  - id: ERR_TRANSFER_INVALID_STATE
    http: 409
    condition: "A transfer workflow step or a second complete is attempted while the transfer is not IN_PROGRESS, or a dimension step is attempted out of order (for example map-escrow before map-data, or rollback-escrow-mapping when data_status is not ESCROW_MAPPED)."
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "acknowledge on a case that is not OPEN or REOPENED, resolve on a case that is not ACKNOWLEDGED, or reopen on a case that is not RESOLVED (including an ESCALATED case)."
  - id: ERR_APPROVAL_ALREADY_DECIDED
    http: 409
    condition: "A second decision is recorded on an ApprovalRequest that already left PENDING."
  - id: ERR_HEDGE_ALREADY_CLOSED
    http: 409
    condition: "close is called on a hedge position that is already CLOSED, including one closed by the cascade-B portfolio transition."

  # --- Optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PORTFOLIO_VERSION
    http: 412
    condition: "expected_portfolio_version does not equal the current ServicingPortfolio.version on POST /msr/portfolios/{id}/valuation-runs."
  - id: ERR_STALE_BID_PACKAGE_VERSION
    http: 412
    condition: "expected_bid_package_version does not equal the current BidPackage.version on POST /msr/bid-packages/{id}/bids."
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_purchase_agreement_version does not equal the current PurchaseAgreement.version on POST /msr/purchase-agreements/{id}/holdback-releases."

  # --- Business rules --------------------------------------------------------
  - id: ERR_COUNTERPARTY_ROLE_MISMATCH
    http: 422
    condition: "A Counterparty with role_type BUYER is named as a portfolio seller, or one with role_type SELLER is named as a bidder."
  - id: ERR_VALUATION_STALE
    http: 409
    condition: "publish is attempted while the bound ValuationRun.status is STALE or SUPERSEDED."
  - id: ERR_BIDDER_NOT_ELIGIBLE
    http: 422
    condition: "The named bidder is SUSPENDED, or lacks the agency approval matching ServicingPortfolio.agency_type."
  - id: ERR_BIDDER_RISK_TIER_TOO_HIGH
    http: 422
    condition: "The named bidder's PRE_AWARD counterparty_transfer_risk_score is below 40 (tier HIGH)."
  - id: ERR_AGENCY_APPROVAL_PENDING
    http: 409
    condition: "settle is attempted while at least one ApprovalRequest on the agreement is still PENDING."
  - id: ERR_CONDITION_WAIVER_REQUIRED
    http: 422
    condition: "A CONDITIONALLY_APPROVED agreement is settled without condition_waiver_reference."
  - id: ERR_TRANSFER_DATE_TOO_SOON
    http: 422
    condition: "transfer_date is fewer than 15 days after the current logical clock date, or sale_date is after transfer_date."
  - id: ERR_NOTICE_EFFECTIVE_DATE_MISMATCH
    http: 422
    condition: "A borrower notice's effective_date differs from the PurchaseAgreement.transfer_date of the transfer."
  - id: ERR_LOAN_NOT_ON_TAPE
    http: 422
    condition: "A notice or an error case names a loan with no included TapeLine on the transfer's awarded bid package."
  - id: ERR_NOTICE_COMPLIANCE_INCOMPLETE
    http: 409
    condition: "attest-notices is attempted while at least one included tape loan has no TRANSFEROR_15DAY or COMBINED notice."
  - id: ERR_NOTICE_LATE
    http: 409
    condition: "attest-notices is attempted while late_notice_count is greater than 0."
  - id: ERR_ESCROW_NOT_MAPPED
    http: 409
    condition: "reconcile is attempted before the custodial sweep, i.e. data_status is below ESCROW_MAPPED."
  - id: ERR_TRANSFER_NOT_READY
    http: 409
    condition: "complete is attempted while readiness is NOT_READY (any of the three dimensions is not terminal)."
  - id: ERR_MARKETING_WINDOW_OVERLAP
    http: 409
    condition: "The half-open marketing window of the package being published overlaps the window of another live package on the same portfolio."
  - id: ERR_ONBOARDING_CAPACITY_EXCEEDED
    http: 409
    condition: "The closed 30-day onboarding window of the transfer being created intersects the window of another IN_PROGRESS transfer for the same buyer."
  - id: ERR_DUPLICATE_APPROVAL_REQUEST
    http: 409
    condition: "A second ApprovalRequest is raised for the same (agreement, approver_type, agency_type) triple."
  - id: ERR_DUPLICATE_LOAN_NUMBER
    http: 409
    condition: "loan_number already exists within the same portfolio."
  - id: ERR_RATE_CURVE_DATE_NOT_ADVANCING
    http: 422
    condition: "A new rate curve snapshot's as_of_date is not strictly after the incumbent ACTIVE snapshot's as_of_date."
  - id: ERR_NO_ACTIVE_RATE_CURVE
    http: 409
    condition: "An operation that needs a market rate is attempted while no RateCurveSnapshot has status ACTIVE."
  - id: ERR_BID_DEADLINE_PASSED
    http: 422
    condition: "A bid is submitted outside [marketing_start_at, bid_deadline_at), or a revision is filed at or after counter_expires_at."
  - id: ERR_MAX_NEGOTIATION_ROUNDS
    http: 409
    condition: "A revision is filed from round_number 3, exceeding MAX_NEGOTIATION_ROUNDS."
  - id: ERR_REOPEN_WINDOW_EXPIRED
    http: 422
    condition: "reopen is attempted more than 60 days after resolved_at."
  - id: ERR_MAX_REOPENS_EXCEEDED
    http: 409
    condition: "reopen is attempted on a case that already ESCALATED after two reopens."
  - id: ERR_HOLDBACK_NOT_ELIGIBLE
    http: 409
    condition: "A holdback release is attempted before the bound transfer is COMPLETED or before holdback_release_eligible_at."
  - id: ERR_BID_BELOW_RESERVE
    http: 422
    condition: "bid_value_cents is below BidPackage.reserve_price_cents on submission or revision."
  - id: ERR_TAPE_EMPTY
    http: 422
    condition: "publish is attempted on a package whose tape_loan_count is exactly 0 because every tape line was excluded."
  - id: ERR_COMPLAINT_TIER_BLOCKS_RELEASE
    http: 409
    condition: "The complaint concentration ratio exceeds 50.00 percent, placing the release in the 0 percent tier."
  - id: ERR_HOLDBACK_EXHAUSTED
    http: 409
    condition: "A release is attempted while holdback_retained_cents is 0."
  - id: ERR_CLAWBACK_EXCEEDS_RELEASED
    http: 422
    condition: "A clawback amount_cents is not positive, or exceeds holdback_released_cents."

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: ValuationAnalyst
    description: "Owns the valuation model: assumption sets, valuation runs, tape cutting and tape line inclusion decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /msr/assumption-sets"
      - "POST /msr/portfolios/{id}/valuation-runs"
      - "POST /msr/bid-packages/{id}/stratify"
      - "PATCH /msr/tape-lines/{id}"
    shared_operations:
      - "POST /msr/bid-packages (with TransactionManager)"
      - "all valuation, portfolio, package, tape-line, bid and hedge reads"
    notes: "run_by_user_id on a ValuationRun is this role's opaque X-User-ID; it is the value the award SoD check compares against. Canonical fixture id: va-001."

  - name: TransactionManager
    description: "Runs the trade: publishes packages, negotiates, awards, raises approval prerequisites, settles and completes the transfer of servicing."
    identity: "opaque"
    exclusive_operations:
      - "POST /msr/bid-packages/{id}/publish"
      - "POST /msr/bids/{id}/counter"
      - "POST /msr/bid-packages/{id}/award"
      - "POST /msr/purchase-agreements/{id}/approval-requests"
      - "POST /msr/purchase-agreements/{id}/submit-for-approval"
      - "POST /msr/purchase-agreements/{id}/settle"
      - "POST /msr/servicing-transfers/{id}/complete"
    shared_operations:
      - "POST /msr/bid-packages (with ValuationAnalyst)"
      - "POST /msr/bid-packages/{id}/bids (with BuyerServicer, when entering a bid on a bidder's behalf)"
      - "all reads across the desk"
    notes: "Canonical fixture id: tm-001. A TransactionManager whose X-User-ID equals the bound ValuationRun.run_by_user_id cannot award (ERR_SEGREGATION_OF_DUTIES)."

  - name: SellerServicer
    description: "The selling servicer. Builds the pool, locks the tape and sends transferor borrower notices."
    identity: "entity_backed:Counterparty"
    exclusive_operations:
      - "POST /msr/portfolios/{id}/loans"
      - "POST /msr/portfolios/{id}/lock-tape"
    shared_operations:
      - "POST /msr/portfolios (with PlatformAdmin)"
      - "POST /msr/servicing-transfers/{id}/notices (TRANSFEROR_15DAY and COMBINED only; shared with BuyerServicer)"
      - "reads of its own portfolios, loans, packages, bids, agreements, transfers, notices, error cases and hedges"
    notes: "X-User-ID must equal ServicingPortfolio.seller_id for every write, else ERR_NOT_RESOURCE_OWNER. The counterparty must have role_type SELLER."

  - name: BuyerServicer
    description: "The acquiring servicer. Bids, negotiates revisions, executes the data / escrow / pipeline transfer and works post-transfer error cases."
    identity: "entity_backed:Counterparty"
    exclusive_operations:
      - "POST /msr/bids/{id}/revise"
      - "POST /msr/servicing-transfers/{id}/map-data"
      - "POST /msr/servicing-transfers/{id}/map-escrow"
      - "POST /msr/servicing-transfers/{id}/rollback-escrow-mapping"
      - "POST /msr/servicing-transfers/{id}/reconcile"
      - "POST /msr/servicing-transfers/{id}/transfer-pipeline"
      - "POST /msr/error-cases/{id}/acknowledge"
      - "POST /msr/error-cases/{id}/resolve"
    shared_operations:
      - "POST /msr/bid-packages/{id}/bids (with TransactionManager)"
      - "POST /msr/servicing-transfers/{id}/notices (TRANSFEREE_15DAY only; shared with SellerServicer)"
      - "reads of packages, tapes, its own bids, agreements, transfers, notices and error cases"
    notes: "X-User-ID must equal Bid.bidder_id or PurchaseAgreement.buyer_id as applicable, else ERR_NOT_RESOURCE_OWNER. The counterparty must have role_type BUYER."

  - name: AgencyApprover
    description: "Agency or investor approver. Records the transfer-of-servicing approval decision and any conditions."
    identity: "opaque"
    exclusive_operations:
      - "POST /msr/approval-requests/{id}/decide"
    shared_operations:
      - "reads of purchase agreements and approval requests"
    notes: "Canonical fixture ids: ag-001, ag-002. Two decisions on the same agreement must come from two different X-User-IDs."

  - name: ComplianceOfficer
    description: "Owns statutory notice attestation, post-transfer error resolution intake and holdback release decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /msr/servicing-transfers/{id}/attest-notices"
      - "POST /msr/servicing-transfers/{id}/error-cases"
      - "POST /msr/error-cases/{id}/reopen"
      - "POST /msr/purchase-agreements/{id}/holdback-releases"
      - "POST /msr/purchase-agreements/{id}/holdback-clawbacks"
    shared_operations:
      - "reads across counterparties, portfolios, packages, agreements, transfers, notices, error cases and hedges"
    notes: "Canonical fixture ids: co-001 (attests notices), co-002 (releases holdback). The same X-User-ID cannot do both on one transfer (ERR_SEGREGATION_OF_DUTIES)."

  - name: HedgeDesk
    description: "Publishes rate curve snapshots and manages the hedge of the servicing asset."
    identity: "opaque"
    exclusive_operations:
      - "POST /msr/rate-curves"
      - "POST /msr/hedge-positions"
      - "POST /msr/hedge-positions/{id}/close"
    shared_operations:
      - "reads of rate curves, valuation runs, portfolios and hedge effectiveness"
    notes: "Canonical fixture id: hd-001. Publishing a curve is what starts cascade A, so this role can suspend a live auction without touching the auction."

  - name: PlatformAdmin
    description: "Desk operator. Onboards and suspends counterparties and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /msr/counterparties"
      - "POST /msr/counterparties/{id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /msr/portfolios (with SellerServicer)"
      - "every read endpoint"
    notes: "Canonical fixture id: admin-001. PlatformAdmin is NOT a hierarchical override: it cannot value, publish, bid, award, decide, attest or release."

rbac_notes:
  - "role_model is segregation_of_duties, so the matrix is deliberately non-overlapping on writes: no role can perform another role's exclusive_operations, and PlatformAdmin has no override."
  - "Three SoD pairs are enforced at runtime (validations[priority=19]): decide-vs-decide across siblings on one agreement, attest-notices-vs-holdback-release across one transfer, and valuation-run-vs-award across one package."
  - "Opaque roles carry stable fixture ids (va-001, tm-001, ag-001, ag-002, co-001, co-002, hd-001, admin-001) so SoD tests can pin who acted."
