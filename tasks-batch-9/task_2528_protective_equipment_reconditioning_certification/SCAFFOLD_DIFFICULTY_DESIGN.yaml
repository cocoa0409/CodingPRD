          Both rules are violated by the same request: the unit is still TESTED
          (no determination recorded) and the owning account is on BILLING_HOLD.
          The state check at priority 50 must win, so the response is
          ERR_UNIT_STATE_INVALID / 409 — never ERR_ACCOUNT_ON_HOLD / 402. The
          pair is (state, business_fiscal) on POST /certification-labels.
