            - call: "POST /claims/${cl_id}/demands"
              payload: { claimant_name: "Needmore Auto Body", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 6000000, represented_by_counsel: false, demand_received_at: "2026-07-31T10:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { dm_id: $.data.id }
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: ClaimsAdjuster
