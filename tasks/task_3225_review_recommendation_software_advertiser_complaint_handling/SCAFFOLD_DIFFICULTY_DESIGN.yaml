# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Scenario: Review Recommendation Software & Advertiser Complaint Handling
# 9 rules x instances = 20 instances (above-expert density)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: recommendation_score_submission_vs_reevaluation
        grounds:
          - calculations.recommendation_scoring
          - state_machines.Review.PENDING_to_PENDING
          - state_machines.Review.DISPLAYED_to_FILTERED
        distinguishing_aspect: |
          Same review, same author trust (50): at submission (variant
          at_submission, no age decay) the score is 500 and the review is
          FILTERED; after an edit and 10 days of aging the re_evaluation variant
          subtracts edit penalty (50) and age decay (20), yielding 430 — the two
          variants of the SAME scoring rule produce different scores for the same
          review on the same page (Review domain variant pair).
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; page P1 ACTIVE; author U1 trust_score=50 (default), status ACTIVE"
            - "Review R1 by U1 on P1 submitted; at-submission score = 300 + 4*50 = 500 < 700 so recommendation_state == FILTERED"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "u1@x.com", display_name: "U One", home_region: "US-CA" }
              as: PlatformOps
              captures: { u1_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Cafe One", address_line: "1 Main St", city: "Springfield", category: "cafe", website: "https://cafe1.example" }
              as: PlatformOps
              captures: { p1_id: $.data.id }
            - call: "POST /platform/business-pages/${p1_id}/reviews"
              payload: { rating: 4, text: "Decent coffee and a quiet corner to work in." }
              as: Reviewer
              as_user_id: "${u1_id}"
              captures: { r1_id: $.data.id, r1_score_submit: $.data.recommendation_score_x1000 }
            - call: "PATCH /platform/reviews/${r1_id}"
              payload: { rating: 5, text: "Updated: the espresso here is genuinely excellent now." }
              as: Reviewer
              as_user_id: "${u1_id}"
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /platform/reviews/${r1_id}/evaluate"
              payload: {}
              as: PlatformOps
              captures: { r1_score_reeval: $.data.recommendation_score_x1000 }
          assert:
            - "Review.${r1_id}.recommendation_score_x1000 at submission == 500"
            - "Review.${r1_id}.recommendation_score_x1000 after re-evaluation == 430 (500 - 50 edit - 2*10 age)"
            - "Review.${r1_id}.recommendation_state == FILTERED in both variants"
            - "Review.${r1_id}.edited_flag == true"

      - name: attribution_strict_vs_extended_window
        grounds:
          - calculations.attribution_window
          - entities.AttributionReport.fields.variant
        distinguishing_aspect: |
          Same campaign, same call events, same report period: the STRICT variant
          counts only in-period qualified calls (1) while the EXTENDED variant
          adds the qualified call placed 10 days before period_start (2) — a
          dual-variant split on the CallTrackEvent/AttributionReport domain,
          structurally different from the Review-scoring variant pair.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; owner U1 claims page P1; ad account A1 budget 100000 cents"
            - "CALL_TRACKING campaign C1 bid 500, window 2026-08-01..2026-09-30, ACTIVE"
            - "Qualified call Q1 on 2026-08-20 (before report period) duration 60; qualified call Q2 on 2026-09-10 (in period) duration 45"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "own1@x.com", display_name: "Owner One", home_region: "US-CA" }
              as: PlatformOps
              captures: { own1_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Shop One", address_line: "9 Oak Ave", city: "Springfield", category: "retail", website: "https://shop1.example" }
              as: PlatformOps
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /platform/business-pages/${p1_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "I own this shop, utility bill attached." }
              as: BusinessOwner
              as_user_id: "${own1_id}"
              captures: { cl1_id: $.data.id, cl1_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${cl1_id}/verify"
              payload: { verification_code: "${cl1_code}" }
              as: BusinessOwner
              as_user_id: "${own1_id}"
            - call: "POST /platform/page-claims/${cl1_id}/approve"
              payload: { expected_page_version: "${p1_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${p1_id}/ad-account"
              payload: { daily_budget_cents: 100000 }
              as: BusinessOwner
              as_user_id: "${own1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /platform/ad-accounts/${a1_id}/campaigns"
              payload: { kind: "CALL_TRACKING", bid_cents: 500, starts_on: "2026-08-01", ends_on: "2026-09-30", call_tracking_enabled: true }
              as: Advertiser
              as_user_id: "${own1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /platform/ad-campaigns/${c1_id}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${own1_id}"
            - call: "POST /platform/ad-accounts/${a1_id}/call-events"
              payload: { campaign_id: "${c1_id}", caller_number: "+15550100", called_at: "2026-08-20T10:00:00Z", duration_seconds: 60 }
              as: PlatformOps
            - call: "POST /platform/ad-accounts/${a1_id}/call-events"
              payload: { campaign_id: "${c1_id}", caller_number: "+15550101", called_at: "2026-09-10T10:00:00Z", duration_seconds: 45 }
              as: PlatformOps
          trigger:
            - call: "POST /platform/ad-accounts/${a1_id}/attribution-reports"
              payload: { campaign_id: "${c1_id}", period_start: "2026-09-01", period_end: "2026-09-30", variant: "STRICT" }
              as: Advertiser
              as_user_id: "${own1_id}"
              captures: { rep_strict: $.data.qualified_calls, rep_strict_spend: $.data.spend_cents }
            - call: "POST /platform/ad-accounts/${a1_id}/attribution-reports"
              payload: { campaign_id: "${c1_id}", period_start: "2026-09-01", period_end: "2026-09-30", variant: "EXTENDED" }
              as: Advertiser
              as_user_id: "${own1_id}"
              captures: { rep_ext: $.data.qualified_calls, rep_ext_spend: $.data.spend_cents }
          assert:
            - "STRICT report qualified_calls == 1"
            - "EXTENDED report qualified_calls == 2"
            - "STRICT report spend_cents == 500"
            - "EXTENDED report spend_cents == 1000"
            - "AdAccount.${a1_id}.spent_today_cents unchanged by report generation (reports never charge)"

      - name: trust_strike_path_vs_removal_path
        grounds:
          - calculations.trust_score_update
          - state_machines.SolicitationCase.INVESTIGATING_to_CONFIRMED
          - state_machines.Complaint.UNDER_REVIEW_to_RESOLVED_ACTIONED
        distinguishing_aspect: |
          Two valid trust-update variants on the User domain: the strike_path
          (solicitation confirm) subtracts 15 and increments strike_count, while
          the removal_path (complaint REMOVE_REVIEW) subtracts 5 with no strike —
          same author hit by both paths ends at trust 30 and strike_count 1, and
          the order of application is observable in the final values.
        test_recipe:
          setup:
            - "Clock 2026-09-01; author UA trust 50; owner UO claims page P1"
            - "Review RA1 by UA on P1 (rating 2) FILTERED at submission (score 500)"
            - "Complaint CM1 (NEGATIVE_DISPUTE) on RA1 UNDER_REVIEW; SolicitationCase SC1 targeting RA1 INVESTIGATING"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "ua@x.com", display_name: "Author A", home_region: "US-CA" }
              as: PlatformOps
              captures: { ua_id: $.data.id }
            - call: "POST /platform/users"
              payload: { email: "uo@x.com", display_name: "Owner O", home_region: "US-CA" }
              as: PlatformOps
              captures: { uo_id: $.data.id }
            - call: "POST /platform/users"
              payload: { email: "rep@x.com", display_name: "Reporter R", home_region: "US-CA" }
              as: PlatformOps
              captures: { rep_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Diner P", address_line: "3 Elm St", city: "Springfield", category: "diner", website: "https://dinerp.example" }
              as: PlatformOps
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /platform/business-pages/${p1_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Owner evidence bundle for diner." }
              as: BusinessOwner
              as_user_id: "${uo_id}"
              captures: { cl_id: $.data.id, cl_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${cl_id}/verify"
              payload: { verification_code: "${cl_code}" }
              as: BusinessOwner
              as_user_id: "${uo_id}"
            - call: "POST /platform/page-claims/${cl_id}/approve"
              payload: { expected_page_version: "${p1_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${p1_id}/reviews"
              payload: { rating: 2, text: "Cold fries and a forty minute wait for a table." }
              as: Reviewer
              as_user_id: "${ua_id}"
              captures: { ra1_id: $.data.id }
            - call: "POST /platform/business-pages/${p1_id}/complaints"
              payload: { review_id: "${ra1_id}", kind: "NEGATIVE_DISPUTE", body: "This review is unfair and exaggerated." }
              as: BusinessOwner
              as_user_id: "${uo_id}"
              captures: { cm1_id: $.data.id }
            - call: "POST /platform/complaints/${cm1_id}/start-review"
              payload: {}
              as: ContentModerator
            - call: "POST /platform/business-pages/${p1_id}/solicitation-cases"
              payload: { target_review_ids: ["${ra1_id}"], evidence_text: "Screenshot of a paid-review offer for this diner." }
              as: Reporter
              as_user_id: "${rep_id}"
              captures: { sc1_id: $.data.id }
            - call: "POST /platform/solicitation-cases/${sc1_id}/investigate"
              payload: {}
              as: TrustInvestigator
          trigger:
            - call: "POST /platform/solicitation-cases/${sc1_id}/confirm"
              payload: {}
              as: TrustInvestigator
            - call: "POST /platform/users/${ua_id}/trust-adjustments"
              payload: { trust_score: 50 }
              as: PlatformOps
            - call: "POST /platform/business-pages/${p1_id}/reviews"
              payload: { rating: 1, text: "Second visit was even worse than the first one." }
              as: Reviewer
              as_user_id: "${ua_id}"
              captures: { ra2_id: $.data.id }
            - call: "POST /platform/business-pages/${p1_id}/complaints"
              payload: { review_id: "${ra2_id}", kind: "NEGATIVE_DISPUTE", body: "This second review is retaliation, remove it." }
              as: BusinessOwner
              as_user_id: "${uo_id}"
              captures: { cm2_id: $.data.id }
            - call: "POST /platform/complaints/${cm2_id}/start-review"
              payload: {}
              as: ContentModerator
            - call: "POST /platform/complaints/${cm2_id}/resolve"
              payload: { action: "REMOVE_REVIEW" }
              as: ContentModerator
          assert:
            - "After confirm: User.${ua_id}.trust_score == 35 and strike_count == 1 (strike_path -15)"
            - "SolicitationCase.${sc1_id}.status == CONFIRMED and Review.${ra1_id}.recommendation_state == REMOVED and evidence_confirmed == true"
            - "Complaint.${cm1_id}.status auto-unaffected == UNDER_REVIEW (review removal by case does not resolve complaints)"
            - "After removal_path: User.${ua_id}.trust_score == 45 and strike_count == 1 (removal_path -5, no strike)"
            - "Review.${ra2_id}.recommendation_state == REMOVED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: recommendation_score_three_input_interaction
        grounds:
          - calculations.recommendation_scoring
        distinguishing_aspect: |
          Mode (a): the score is a >= 3-input non-linear formula — trust term
          (4*trust), suspension branch (author SUSPENDED zeroes the DISPLAYED
          boundary), edit penalty, and capped age decay (min(age,100)) — a
          suspended high-trust author (trust 80) scores 620-200=420 while the
          same author ACTIVE at trust 80 with 30-day age scores 560, showing the
          branch interaction is non-additive across inputs.
        test_recipe:
          setup:
            - "Clock 2026-09-01; page P1 ACTIVE; author UH trust_score set to 80 via trust-adjustments"
            - "Review RH submitted while UH ACTIVE: score = 300+320 = 620 -> FILTERED (threshold 700 unreachable at trust 80; need trust >= 100)"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "uh@x.com", display_name: "User H", home_region: "US-CA" }
              as: PlatformOps
              captures: { uh_id: $.data.id }
            - call: "POST /platform/users/${uh_id}/trust-adjustments"
              payload: { trust_score: 100 }
              as: PlatformOps
            - call: "POST /platform/business-pages"
              payload: { name: "Bistro B", address_line: "5 Pine St", city: "Springfield", category: "bistro", website: "https://bistrob.example" }
              as: PlatformOps
              captures: { pb_id: $.data.id }
            - call: "POST /platform/business-pages/${pb_id}/reviews"
              payload: { rating: 5, text: "Superb tasting menu, impeccable service throughout." }
              as: Reviewer
              as_user_id: "${uh_id}"
              captures: { rh_id: $.data.id, rh_score_0: $.data.recommendation_score_x1000 }
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /platform/reviews/${rh_id}/evaluate"
              payload: {}
              as: PlatformOps
              captures: { rh_score_1: $.data.recommendation_score_x1000 }
            - call: "POST /platform/users/${uh_id}/suspend"
              payload: {}
              as: PlatformOps
            - call: "POST /platform/reviews/${rh_id}/evaluate"
              payload: {}
              as: PlatformOps
              captures: { rh_score_2: $.data.recommendation_score_x1000 }
          assert:
            - "At submission (trust 100, age 0): Review.${rh_id}.recommendation_score_x1000 == 700 and recommendation_state == DISPLAYED"
            - "After 30 days aging: score == 700 - 2*30 == 640 and recommendation_state == FILTERED"
            - "After author suspension: score == 640 - 200 == 440 and recommendation_state == FILTERED"
            - "BusinessPage.${pb_id}.displayed_review_count == 0 after the final evaluate"

      - name: ad_budget_circular_order_pinned
        grounds:
          - calculations.ad_spend_and_budget
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (c): the budget check is a circular-looking dependency — the cap
          test needs candidate_cost, candidate_cost comes from the campaign, and
          the charge mutates the accumulator the next cap test reads; the
          scaffold pins evaluation order (cost first, cap test second, accumulate
          third) so three 400-cent impressions against a 1000-cent budget succeed,
          succeed, then fail at exactly 1200 > 1000 while a fourth 200-cent
          impression would have fit (800 + 200 == 1000 allowed).
        test_recipe:
          setup:
            - "Clock 2026-09-01; owner UO claims page P1; ad account A1 budget 1000 cents"
            - "SPONSORED_PLACEMENT campaign C1 bid 400, window 2026-09-01..2026-09-30, ACTIVE"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "ao@x.com", display_name: "Ad Owner", home_region: "US-CA" }
              as: PlatformOps
              captures: { ao_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Gadget G", address_line: "7 Tech Blvd", city: "Springfield", category: "electronics", website: "https://gadgetg.example" }
              as: PlatformOps
              captures: { pg_id: $.data.id, pg_v: $.data.version }
            - call: "POST /platform/business-pages/${pg_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Business license for gadget store." }
              as: BusinessOwner
              as_user_id: "${ao_id}"
              captures: { clg_id: $.data.id, clg_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${clg_id}/verify"
              payload: { verification_code: "${clg_code}" }
              as: BusinessOwner
              as_user_id: "${ao_id}"
            - call: "POST /platform/page-claims/${clg_id}/approve"
              payload: { expected_page_version: "${pg_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${pg_id}/ad-account"
              payload: { daily_budget_cents: 1000 }
              as: BusinessOwner
              as_user_id: "${ao_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /platform/ad-accounts/${ag_id}/campaigns"
              payload: { kind: "SPONSORED_PLACEMENT", bid_cents: 400, starts_on: "2026-09-01", ends_on: "2026-09-30", call_tracking_enabled: false }
              as: Advertiser
              as_user_id: "${ao_id}"
              captures: { cg_id: $.data.id }
            - call: "POST /platform/ad-campaigns/${cg_id}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${ao_id}"
          trigger:
            - call: "POST /platform/ad-accounts/${ag_id}/impressions"
              payload: { campaign_id: "${cg_id}", idempotency_key: "imp-001" }
              as: PlatformOps
            - call: "POST /platform/ad-accounts/${ag_id}/impressions"
              payload: { campaign_id: "${cg_id}", idempotency_key: "imp-002" }
              as: PlatformOps
            - call: "POST /platform/ad-accounts/${ag_id}/impressions"
              payload: { campaign_id: "${cg_id}", idempotency_key: "imp-003" }
              as: PlatformOps
              captures: { imp3_err: $.data.error_id }
            - call: "GET /platform/ad-accounts/${ag_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${ao_id}"
              captures: { ag_spent: $.data.spent_today_cents }
          assert:
            - "First two impressions succeed (201); third rejected with ERR_BUDGET_EXCEEDED"
            - "AdAccount.${ag_id}.spent_today_cents == 800 (the failed charge did not accumulate)"
            - "GET /platform/ad-accounts/${ag_id}/impressions returns exactly 2 events"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ad_campaign_pause_resume_cycle
        grounds:
          - state_machines.AdCampaign.ACTIVE_to_PAUSED
          - state_machines.AdCampaign.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          AdCampaign has a true cycle (ACTIVE -> PAUSED -> ACTIVE) on the
          AdCampaign entity: resume from PAUSED re-checks only today <= ends_on
          (not starts_on), so a campaign whose window started in the past can
          resume mid-window — distinguishable from the initial DRAFT -> ACTIVE
          activation which requires starts_on <= today.
        test_recipe:
          setup:
            - "Clock 2026-09-01; owner UO claims page P1; ad account A1 budget 50000; campaign C1 SPONSORED_PLACEMENT bid 100 window 2026-08-15..2026-09-15, ACTIVE"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "co@x.com", display_name: "Camp Owner", home_region: "US-CA" }
              as: PlatformOps
              captures: { co_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Cycle Shop", address_line: "11 Wheel St", city: "Springfield", category: "bikes", website: "https://cycles.example" }
              as: PlatformOps
              captures: { pc_id: $.data.id, pc_v: $.data.version }
            - call: "POST /platform/business-pages/${pc_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Shop lease documents attached." }
              as: BusinessOwner
              as_user_id: "${co_id}"
              captures: { clc_id: $.data.id, clc_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${clc_id}/verify"
              payload: { verification_code: "${clc_code}" }
              as: BusinessOwner
              as_user_id: "${co_id}"
            - call: "POST /platform/page-claims/${clc_id}/approve"
              payload: { expected_page_version: "${pc_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${pc_id}/ad-account"
              payload: { daily_budget_cents: 50000 }
              as: BusinessOwner
              as_user_id: "${co_id}"
              captures: { ac_id: $.data.id }
            - call: "POST /platform/ad-accounts/${ac_id}/campaigns"
              payload: { kind: "SPONSORED_PLACEMENT", bid_cents: 100, starts_on: "2026-08-15", ends_on: "2026-09-15", call_tracking_enabled: false }
              as: Advertiser
              as_user_id: "${co_id}"
              captures: { cc_id: $.data.id }
            - call: "POST /platform/ad-campaigns/${cc_id}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${co_id}"
            - call: "POST /platform/ad-campaigns/${cc_id}/pause"
              payload: {}
              as: Advertiser
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /platform/ad-campaigns/${cc_id}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${co_id}"
              captures: { cc_status: $.data.status }
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformOps
            - call: "GET /platform/ad-campaigns/${cc_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${co_id}"
              captures: { cc_final: $.data.status }
          assert:
            - "Resume succeeds: AdCampaign.${cc_id}.status == ACTIVE after PAUSED (cycle completed; resume skips the starts_on check)"
            - "After clock passes ends_on: AdCampaign.${cc_id}.status == COMPLETED (auto-transition on date rollover)"

      - name: identity_request_branching_fork
        grounds:
          - state_machines.IdentityRequest.UNDER_REVIEW_to_NOTICE_SENT
          - state_machines.IdentityRequest.UNDER_REVIEW_to_RELEASED
        distinguishing_aspect: |
          IdentityRequest forks at UNDER_REVIEW with divergent side-effect sets
          per branch: the LEGAL_SUBPOENA branch goes through NOTICE_SENT and is
          release-blocked for 14 days, while the LAW_ENFORCEMENT branch releases
          directly with no notice fields set — a channel-conditional fork-join on
          a different entity than the AdCampaign cycle.
        test_recipe:
          setup:
            - "Clock 2026-09-01; subject user US exists"
            - "IR1 LEGAL_SUBPOENA with docket ref, UNDER_REVIEW then NOTICE_SENT"
            - "IR2 LAW_ENFORCEMENT with case ref, UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
