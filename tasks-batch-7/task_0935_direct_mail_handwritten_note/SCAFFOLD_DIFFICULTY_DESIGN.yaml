      - name: proof_reject_then_resubmit_revision_loop
        grounds:
          - state_machines.Proof.status.SUBMITTED_to_REJECTED
          - state_machines.Proof.status.REJECTED_to_SUBMITTED
          - entities.Proof.fields.pinned_template_version
        distinguishing_aspect: |
          Entity Proof carries a cycle: SUBMITTED -> REJECTED -> SUBMITTED -> APPROVED, and the
          second submit RE-PINS pinned_template_version to the template version current at that
          moment, so the loop is not a no-op.
        test_recipe:
          setup:
            - "One account, one campaign, one template at version_no 1 and one ADDRESSED job in DRAFT."
            - "A proof in DRAFT for that job."
