            - "rc_status == APPROVED after the order is delivered"
            - "rc_refund == 10000 (equals escrow_funded_cents)"
            - "SalesOrder.${ord14_id}.status == REFUND_PENDING"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: consignment_window_half_open_overlap_semantics
        grounds:
          - validations[priority=8]
          - entities.ConsignmentAgreement.fields.effective_from
        distinguishing_aspect: |
          Half-open interval semantics on resource ConsignmentAgreement(lot): window
          [2026-08-15, 2026-10-01) overlapping ACTIVE [2026-08-01, 2026-09-01) is
          rejected, but [2026-09-01, 2026-10-01) touching the boundary exactly is
          admitted because effective_to is exclusive — adjacency is not overlap.
        test_recipe:
          setup:
            - "CONSIGNMENT lot L15 with ACTIVE agreement A [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Oscar Overstock", contact_email: "oscar@x.com" }
              as: BrokerOps
              captures: { s15_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-O1", capacity_units: 50 }
              as: BrokerOps
              captures: { bin15_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s15_id}", mpn: "PIC16F877", quantity: 8, ask_price_per_unit_cents: 9000, provenance_doc_url: "https://docs.x.com/p15.pdf" }
              as: Seller
              as_user_id: "${s15_id}"
              captures: { o15_id: $.data.id }
            - call: "POST /buy-offers/${o15_id}/accept"
              payload: { agreed_unit_price_cents: 9000, acquisition_mode: "CONSIGNMENT" }
              as: BrokerOps
            - call: "POST /buy-offers/${o15_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o15_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o15_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin15_id}" }
              as: BrokerOps
              captures: { lot15_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { seller_id: "${s15_id}", lot_id: "${lot15_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", broker_fee_bps: 1200 }
              as: BrokerOps
              captures: { agA_id: $.data.id }
          trigger:
            - call: "POST /consignment-agreements"
              payload: { seller_id: "${s15_id}", lot_id: "${lot15_id}", effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", broker_fee_bps: 1200 }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
            - call: "POST /consignment-agreements"
              payload: { seller_id: "${s15_id}", lot_id: "${lot15_id}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", broker_fee_bps: 1200 }
              as: BrokerOps
              captures: { agC_id: $.data.id }
          assert:
            - "err_id == ERR_CONSIGNMENT_WINDOW_OVERLAP (interior overlap rejected)"
            - "agC_id is a created id (adjacent window starting exactly at A.effective_to admitted under half-open semantics)"

      - name: storage_bin_aggregate_capacity_exact_fit
        grounds:
          - calculations.bin_occupancy
          - validations[priority=9]
        distinguishing_aspect: |
          Aggregate-capacity semantics on resource StorageBin (not an interval at all):
          bin capacity 100 admits a second lot of exactly 40 units onto an existing 60
          (sum == capacity is admitted) but rejects 41 — the collision rule is a
          running-sum ceiling, not pairwise interval intersection.
        test_recipe:
          setup:
            - "Bin capacity 100 holds lot P qty 60 (occupied 60); accepted+passed offers Q qty 40 and R qty 1 await conversion"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Papa Parts", contact_email: "papa@x.com" }
              as: BrokerOps
              captures: { s16_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-P1", capacity_units: 100 }
              as: BrokerOps
              captures: { bin16_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s16_id}", mpn: "ULN2003", quantity: 60, ask_price_per_unit_cents: 3000, provenance_doc_url: "https://docs.x.com/p16a.pdf" }
              as: Seller
              as_user_id: "${s16_id}"
              captures: { oP_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s16_id}", mpn: "ULN2003", quantity: 40, ask_price_per_unit_cents: 3000, provenance_doc_url: "https://docs.x.com/p16b.pdf" }
              as: Seller
              as_user_id: "${s16_id}"
              captures: { oQ_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s16_id}", mpn: "ULN2003", quantity: 1, ask_price_per_unit_cents: 3000, provenance_doc_url: "https://docs.x.com/p16c.pdf" }
              as: Seller
              as_user_id: "${s16_id}"
              captures: { oR_id: $.data.id }
            - call: "POST /buy-offers/${oP_id}/accept"
              payload: { agreed_unit_price_cents: 3000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${oP_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${oP_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${oP_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin16_id}" }
              as: BrokerOps
            - call: "POST /buy-offers/${oQ_id}/accept"
              payload: { agreed_unit_price_cents: 3000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${oQ_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${oQ_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${oR_id}/accept"
              payload: { agreed_unit_price_cents: 3000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${oR_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${oR_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
          trigger:
            - call: "POST /buy-offers/${oQ_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin16_id}" }
              as: BrokerOps
              captures: { lotQ_id: $.data.id }
            - call: "POST /buy-offers/${oR_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin16_id}" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "lotQ_id is a created id (60 + 40 == 100 exact fit admitted)"
            - "err_id == ERR_BIN_CAPACITY_EXCEEDED (one unit over the ceiling rejected)"
            - "StorageBin.${bin16_id}.occupied_units == 100 and available_units == 0"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: escrow_balance_conserved_on_funded_cancel
        grounds:
          - state_machines.SalesOrder.ESCROW_FUNDED_to_CANCELLED
          - entities.EscrowEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: escrow ledger balance of the order. Forward action
          (deposit +50000) paired with its compensating action (cancel issuing
          CUSTOMER_REFUND -50000) leaves sum(amount_cents) == 0 exactly; no fees or
          payouts may leak into a cancelled order's ledger.
        test_recipe:
          setup:
            - "CRITICAL customer order qty 4 on ACTIVE listing asking 10000; fully escrowed 50000 (ESCROW_FUNDED)"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Quebec Quartz", contact_email: "quebec@x.com" }
              as: BrokerOps
              captures: { s17_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cancel Carl", contact_email: "carl@x.com", credit_limit_cents: 100000, urgency_tier: "CRITICAL" }
              as: BrokerOps
              captures: { c17_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-Q1", capacity_units: 50 }
              as: BrokerOps
              captures: { bin17_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s17_id}", mpn: "IRF540", quantity: 10, ask_price_per_unit_cents: 8000, provenance_doc_url: "https://docs.x.com/p17.pdf" }
              as: Seller
              as_user_id: "${s17_id}"
              captures: { o17_id: $.data.id }
            - call: "POST /buy-offers/${o17_id}/accept"
              payload: { agreed_unit_price_cents: 8000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o17_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o17_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o17_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin17_id}" }
              as: BrokerOps
              captures: { lot17_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot17_id}", asking_price_per_unit_cents: 10000 }
              as: BrokerOps
              captures: { lst17_id: $.data.id }
            - call: "POST /listings/${lst17_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c17_id}", listing_id: "${lst17_id}", quantity: 4 }
              as: Customer
              as_user_id: "${c17_id}"
              captures: { ord17_id: $.data.id }
            - call: "POST /sales-orders/${ord17_id}/escrow/deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${c17_id}"
          trigger:
            - call: "POST /sales-orders/${ord17_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c17_id}"
            - call: "GET /sales-orders/${ord17_id}/escrow-entries"
              payload: {}
              as: FinanceAdmin
              captures: { e0: "$.data[0].amount_cents", e1: "$.data[1].amount_cents" }
          assert:
            - "SalesOrder.${ord17_id}.status == CANCELLED"
            - "e0 == 50000 (DEPOSIT) and e1 == -50000 (CUSTOMER_REFUND); e0 + e1 == 0"
            - "exactly 2 escrow entries exist for the order (no fee/payout drift)"
            - "Seller.${s17_id}.account_balance_cents == 0"

      - name: lot_quantity_conserved_through_reserve_and_release
        grounds:
          - calculations.lot_posture_derivation
          - entities.Lot.fields.qty_available
        distinguishing_aspect: |
          Conserved quantity: lot unit accounting. Forward action (order create moves 4
          units available -> reserved) paired with its compensating action (cancel
          moves them back) restores qty_available == 10, and the global invariant
          quantity_received == qty_available + qty_reserved + qty_sold + qty_returned
          holds at every probe point — a unit-count invariant, not a money one.
        test_recipe:
          setup:
            - "BROKER_OWNED lot quantity_received 10, all available, ACTIVE listing asking 10000; STANDARD customer credit 100000"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Romeo Resale", contact_email: "romeo@x.com" }
              as: BrokerOps
              captures: { s18_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Reserve Rex", contact_email: "rex@x.com", credit_limit_cents: 100000, urgency_tier: "STANDARD" }
              as: BrokerOps
              captures: { c18_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-R1", capacity_units: 50 }
              as: BrokerOps
              captures: { bin18_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s18_id}", mpn: "TIP120", quantity: 10, ask_price_per_unit_cents: 7000, provenance_doc_url: "https://docs.x.com/p18.pdf" }
              as: Seller
              as_user_id: "${s18_id}"
              captures: { o18_id: $.data.id }
            - call: "POST /buy-offers/${o18_id}/accept"
              payload: { agreed_unit_price_cents: 7000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o18_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o18_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o18_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin18_id}" }
              as: BrokerOps
              captures: { lot18_id: $.data.id, av0: $.data.qty_available }
            - call: "POST /listings"
              payload: { lot_id: "${lot18_id}", asking_price_per_unit_cents: 10000 }
              as: BrokerOps
              captures: { lst18_id: $.data.id }
            - call: "POST /listings/${lst18_id}/activate"
              payload: {}
              as: BrokerOps
          trigger:
            - call: "POST /sales-orders"
              payload: { customer_id: "${c18_id}", listing_id: "${lst18_id}", quantity: 4 }
              as: Customer
              as_user_id: "${c18_id}"
              captures: { ord18_id: $.data.id }
            - call: "GET /lots/${lot18_id}"
              payload: {}
              as: BrokerOps
              captures: { av_mid: $.data.qty_available, rv_mid: $.data.qty_reserved }
            - call: "POST /sales-orders/${ord18_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c18_id}"
            - call: "GET /lots/${lot18_id}"
              payload: {}
              as: BrokerOps
              captures: { av_end: $.data.qty_available, rv_end: $.data.qty_reserved, sd_end: $.data.qty_sold, rt_end: $.data.qty_returned }
          assert:
            - "av0 == 10"
            - "av_mid == 6 and rv_mid == 4 (reserve moved units, sum still 10)"
            - "av_end == 10 and rv_end == 0 and sd_end == 0 and rt_end == 0 (compensation leaves zero drift)"
            - "av_end + rv_end + sd_end + rt_end == 10 == Lot.${lot18_id}.quantity_received"
