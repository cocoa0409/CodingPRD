scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: service_plan_refund_prorated_vs_forfeit
        grounds:
          - calculations.service_plan_refund
          - entities.ServicePlan.fields.refundable
          - state_machines.ServicePlan.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Same ServicePlan domain, two variants diverge: a non-refundable plan cancelled 91 days
          after activation forfeits (refund 0), while an otherwise-identical refundable plan
          cancelled at the same elapsed days prorates to 36033 cents.
        test_recipe:
          setup:
            - "Two installed projects each with an ACTIVE service plan (annual_fee 48000), one refundable=false, one refundable=true, both activated at 2026-04-01, clock advanced to 2026-07-01 (91 elapsed days)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner A", email: "a@x.com" }
              as: OperationsAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_a}", property_address: "1 A St" }
              as: OperationsAdmin
              captures: { proj_a: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_a}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_a: $.data.id, tx_a_v: $.data.version }
            - call: "POST /projects/${proj_a}/zones"
              payload: { transformer_id: "${tx_a}", label: "Front" }
              as: LightingDesigner
              captures: { zone_a: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_a}", model_code: "PATH-80", category: "PATH", wattage_w: 80, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx_a: $.data.id }
            - call: "POST /fixtures/${fx_a}/assign-zone"
              payload: { zone_id: "${zone_a}", expected_transformer_version: "${tx_a_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_a}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_a}" }
              as: LightingDesigner
              captures: { q_a: $.data.id }
            - call: "POST /quotes/${q_a}/lines"
              payload: { model_code: "PATH-80", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q_a}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q_a}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_a}", quote_id: "${q_a}" }
              as: InstallTech
              captures: { job_a: $.data.id }
            - call: "POST /install-jobs/${job_a}/start"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_a}/complete-wiring"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_a}/complete-fixtures"
              payload: {}
              as: InstallTech
            - call: "POST /service-plans"
              payload: { project_id: "${proj_a}", tier: "BASIC", annual_fee_cents: 48000, refundable: false }
              as: OperationsAdmin
              captures: { plan_forfeit: $.data.id }
            - call: "POST /service-plans"
              payload: { project_id: "${proj_a}", tier: "PREMIUM", annual_fee_cents: 48000, refundable: true }
              as: OperationsAdmin
              captures: { plan_prorate: $.data.id }
            - call: "POST /service-plans/${plan_forfeit}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /service-plans/${plan_prorate}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /service-plans/${plan_forfeit}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /service-plans/${plan_prorate}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
          assert:
            - "ServicePlan.${plan_forfeit}.status == CANCELLED"
            - "ServicePlan.${plan_prorate}.status == CANCELLED"
            - "the forfeit cancel credits the customer 0 cents; the prorate cancel credits 36033 cents"

      - name: warranty_credit_full_vs_depreciated
        grounds:
          - calculations.warranty_replacement_credit
          - entities.Fixture.fields.purchase_price_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Operates on the Fixture domain (distinct from service_plan_refund's ServicePlan domain):
          a claim approved at fixture age 0 months grants FULL credit 9000, while the same fixture
          model approved at age 30 months grants DEPRECIATED credit 4500.
        test_recipe:
          setup:
            - "An installed project with two installed fixtures (purchase_price 9000, warranty 60mo), installed at 2026-04-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner W", email: "w@x.com" }
              as: OperationsAdmin
              captures: { cust_w: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_w}", property_address: "9 W St" }
              as: OperationsAdmin
              captures: { proj_w: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_w}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_w: $.data.id, tx_w_v: $.data.version }
            - call: "POST /projects/${proj_w}/zones"
              payload: { transformer_id: "${tx_w}", label: "Beds" }
              as: LightingDesigner
              captures: { zone_w: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_w}", model_code: "SPOT-9W", category: "SPOT", wattage_w: 9, purchase_price_cents: 9000, warranty_months: 60 }
              as: LightingDesigner
              captures: { fx_w1: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_w}", model_code: "SPOT-9W", category: "SPOT", wattage_w: 9, purchase_price_cents: 9000, warranty_months: 60 }
              as: LightingDesigner
              captures: { fx_w2: $.data.id }
            - call: "POST /fixtures/${fx_w1}/assign-zone"
              payload: { zone_id: "${zone_w}", expected_transformer_version: "${tx_w_v}" }
              as: LightingDesigner
              captures: { tx_w_v2: $.data.version }
            - call: "POST /fixtures/${fx_w2}/assign-zone"
              payload: { zone_id: "${zone_w}", expected_transformer_version: "${tx_w_v2}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_w}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_w}" }
              as: LightingDesigner
              captures: { q_w: $.data.id }
            - call: "POST /quotes/${q_w}/lines"
              payload: { model_code: "SPOT-9W", quantity: 2, unit_price_cents: 9000 }
              as: LightingDesigner
            - call: "POST /quotes/${q_w}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q_w}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_w}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_w}", quote_id: "${q_w}" }
              as: InstallTech
              captures: { job_w: $.data.id }
            - call: "POST /install-jobs/${job_w}/start"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_w}/complete-wiring"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_w}/complete-fixtures"
              payload: {}
              as: InstallTech
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /warranty-claims"
              payload: { fixture_id: "${fx_w1}", project_id: "${proj_w}", reason: "LED out" }
              as: Customer
              as_user_id: "${cust_w}"
              captures: { claim_full: $.data.id }
            - call: "POST /warranty-claims/${claim_full}/approve"
              payload: {}
              as: OperationsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-17T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /warranty-claims"
              payload: { fixture_id: "${fx_w2}", project_id: "${proj_w}", reason: "Corrosion" }
              as: Customer
              as_user_id: "${cust_w}"
              captures: { claim_dep: $.data.id }
            - call: "POST /warranty-claims/${claim_dep}/approve"
              payload: {}
              as: OperationsAdmin
          assert:
            - "WarrantyClaim.${claim_full}.credit_variant == FULL"
            - "WarrantyClaim.${claim_full}.credit_cents == 9000"
            - "WarrantyClaim.${claim_dep}.credit_variant == DEPRECIATED"
            - "WarrantyClaim.${claim_dep}.credit_cents == 4500"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_pricing_tiered_rate_selection_mode_a
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.grand_total_cents
          - state_machines.Quote.DRAFT_to_SENT
        distinguishing_aspect: |
          Mode (a): >=3 inputs (subtotal, total fixture qty selecting a tier, demo-fee branch) with
          non-linear tier selection. A 18-unit quote with demo lands in the 5% tier producing
          grand_total 127302; a 9-unit quote with no demo lands in the 0% tier producing 38970.
        test_recipe:
          setup:
            - "A DESIGN_LOCKED project with a draft quote carrying lines totaling 18 units (12 @ 4500 + 6 @ 9000) and night_demo_requested=true."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner Q", email: "q@x.com" }
              as: OperationsAdmin
              captures: { cust_q: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_q}", property_address: "Q St" }
              as: OperationsAdmin
              captures: { proj_q: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_q}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_q: $.data.id, tx_q_v: $.data.version }
            - call: "POST /projects/${proj_q}/zones"
              payload: { transformer_id: "${tx_q}", label: "Path" }
              as: LightingDesigner
              captures: { zone_q: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_q}", model_code: "PATH-3W", category: "PATH", wattage_w: 3, purchase_price_cents: 4500 }
              as: LightingDesigner
              captures: { fx_q: $.data.id }
            - call: "POST /fixtures/${fx_q}/assign-zone"
              payload: { zone_id: "${zone_q}", expected_transformer_version: "${tx_q_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_q}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_q}", night_demo_requested: true, night_demo_at: "2026-04-20T20:00:00Z" }
              as: LightingDesigner
              captures: { q_q: $.data.id }
            - call: "POST /quotes/${q_q}/lines"
              payload: { model_code: "PATH-3W", quantity: 12, unit_price_cents: 4500 }
              as: LightingDesigner
            - call: "POST /quotes/${q_q}/lines"
              payload: { model_code: "SPOT-9W", quantity: 6, unit_price_cents: 9000 }
              as: LightingDesigner
          trigger:
            - call: "POST /quotes/${q_q}/send"
              payload: {}
              as: LightingDesigner
          assert:
            - "Quote.${q_q}.subtotal_cents == 108000"
            - "Quote.${q_q}.discount_cents == 5400"
            - "Quote.${q_q}.tax_cents == 9702"
            - "Quote.${q_q}.grand_total_cents == 127302"

      - name: quote_pricing_rounding_order_mode_b
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.discount_cents
          - entities.Quote.fields.tax_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned (discount floored on the SUMMED subtotal, tax
          round_half_up once on the taxable base, NOT per line). A 10-unit @ 4000 quote yields
          subtotal 40000, floored discount 2000, base 38000, tax 3135 — distinct from any
          per-line rounding interpretation.
        test_recipe:
          setup:
            - "A DESIGN_LOCKED project with a draft quote of one line: 10 units @ 4000, no demo."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner R", email: "r@x.com" }
              as: OperationsAdmin
              captures: { cust_r: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_r}", property_address: "R St" }
              as: OperationsAdmin
              captures: { proj_r: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_r}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_r: $.data.id, tx_r_v: $.data.version }
            - call: "POST /projects/${proj_r}/zones"
              payload: { transformer_id: "${tx_r}", label: "Path" }
              as: LightingDesigner
              captures: { zone_r: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_r}", model_code: "PATH-3W", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx_r: $.data.id }
            - call: "POST /fixtures/${fx_r}/assign-zone"
              payload: { zone_id: "${zone_r}", expected_transformer_version: "${tx_r_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_r}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_r}" }
              as: LightingDesigner
              captures: { q_r: $.data.id }
            - call: "POST /quotes/${q_r}/lines"
              payload: { model_code: "PATH-3W", quantity: 10, unit_price_cents: 4000 }
              as: LightingDesigner
          trigger:
            - call: "POST /quotes/${q_r}/send"
              payload: {}
              as: LightingDesigner
          assert:
            - "Quote.${q_r}.subtotal_cents == 40000"
            - "Quote.${q_r}.discount_cents == 2000"
            - "Quote.${q_r}.tax_cents == 3135"
            - "Quote.${q_r}.grand_total_cents == 41135"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_increments_round
        grounds:
          - state_machines.Quote.SENT_to_DRAFT
          - state_machines.Quote.DRAFT_to_SENT
          - entities.Quote.fields.revision_round
        distinguishing_aspect: |
          Cyclic shape on Quote: DRAFT->SENT->DRAFT->SENT. revision_round goes 0 then 1 after the
          revise loop, proving the back-edge is taken (not a linear pipeline).
        test_recipe:
          setup:
            - "A DESIGN_LOCKED project with a draft quote carrying one line."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner Cy", email: "cy@x.com" }
              as: OperationsAdmin
              captures: { cust_cy: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_cy}", property_address: "Cy St" }
              as: OperationsAdmin
              captures: { proj_cy: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_cy}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_cy: $.data.id, tx_cy_v: $.data.version }
            - call: "POST /projects/${proj_cy}/zones"
              payload: { transformer_id: "${tx_cy}", label: "Path" }
              as: LightingDesigner
              captures: { zone_cy: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_cy}", model_code: "PATH-3W", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx_cy: $.data.id }
            - call: "POST /fixtures/${fx_cy}/assign-zone"
              payload: { zone_id: "${zone_cy}", expected_transformer_version: "${tx_cy_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_cy}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_cy}" }
              as: LightingDesigner
              captures: { q_cy: $.data.id }
            - call: "POST /quotes/${q_cy}/lines"
              payload: { model_code: "PATH-3W", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q_cy}/send"
              payload: {}
              as: LightingDesigner
          trigger:
            - call: "POST /quotes/${q_cy}/revise"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q_cy}/send"
              payload: {}
              as: LightingDesigner
          assert:
            - "Quote.${q_cy}.status == SENT"
            - "Quote.${q_cy}.revision_round == 1"

      - name: install_job_fork_join_energize
        grounds:
          - state_machines.InstallJob.IN_PROGRESS_to_IN_PROGRESS
          - state_machines.InstallJob.IN_PROGRESS_to_ENERGIZED
          - entities.InstallJob.fields.wiring_status
          - entities.InstallJob.fields.fixtures_status
        distinguishing_aspect: |
          Branching fork-join on InstallJob (a different entity than Quote): the wiring branch and
          the fixtures branch advance independently, and only when BOTH reach WIRED+MOUNTED does the
          job auto-join to ENERGIZED — divergent side-effect sets per branch (wiring energizes
          transformers; fixtures branch mounts fixtures).
        test_recipe:
          setup:
            - "An IN_PROGRESS install job on a project with one staged transformer and one planned zoned fixture; wiring completed first."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner Fj", email: "fj@x.com" }
              as: OperationsAdmin
              captures: { cust_fj: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_fj}", property_address: "Fj St" }
              as: OperationsAdmin
              captures: { proj_fj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_fj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_fj: $.data.id, tx_fj_v: $.data.version }
            - call: "POST /projects/${proj_fj}/zones"
              payload: { transformer_id: "${tx_fj}", label: "Path" }
              as: LightingDesigner
              captures: { zone_fj: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_fj}", model_code: "PATH-80", category: "PATH", wattage_w: 80, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx_fj: $.data.id }
            - call: "POST /fixtures/${fx_fj}/assign-zone"
              payload: { zone_id: "${zone_fj}", expected_transformer_version: "${tx_fj_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_fj}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_fj}" }
              as: LightingDesigner
              captures: { q_fj: $.data.id }
            - call: "POST /quotes/${q_fj}/lines"
              payload: { model_code: "PATH-80", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q_fj}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q_fj}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_fj}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_fj}", quote_id: "${q_fj}" }
              as: InstallTech
              captures: { job_fj: $.data.id }
            - call: "POST /install-jobs/${job_fj}/start"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_fj}/complete-wiring"
              payload: {}
              as: InstallTech
          trigger:
            - call: "POST /install-jobs/${job_fj}/complete-fixtures"
              payload: {}
              as: InstallTech
          assert:
            - "InstallJob.${job_fj}.wiring_status == WIRED"
            - "InstallJob.${job_fj}.fixtures_status == MOUNTED"
            - "InstallJob.${job_fj}.status == ENERGIZED"
            - "Transformer.${tx_fj}.status == ENERGIZED"
            - "Fixture.${fx_fj}.status == INSTALLED"
            - "LightingProject.${proj_fj}.commercial_status == INSTALLED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_approve_depth3_cascade
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.Fixture.FAILED_to_INSTALLED
          - calculations.transformer_committed_load
          - entities.Transformer.fields.committed_load_va
        distinguishing_aspect: |
          Depth-3 cascade originating at claim approval: approve -> Fixture FAILED->INSTALLED (link 1)
          -> that fixture re-enters the {PLANNED,INSTALLED} load set so Zone.zone_load_va recomputes
          (link 2) -> Transformer.committed_load_va recomputes (link 3). Each hop is caused by the
          prior hop, not directly by the approve action.
        test_recipe:
          setup:
            - "Installed project, one INSTALLED 80W fixture in a zone on a 300VA transformer (committed 80). A warranty claim has set the fixture FAILED (committed dropped to 0). Clock at 2026-04-15."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner C3", email: "c3@x.com" }
              as: OperationsAdmin
              captures: { cust_c3: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_c3}", property_address: "C3 St" }
              as: OperationsAdmin
              captures: { proj_c3: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_c3}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_c3: $.data.id, tx_c3_v: $.data.version }
            - call: "POST /projects/${proj_c3}/zones"
              payload: { transformer_id: "${tx_c3}", label: "Path" }
              as: LightingDesigner
              captures: { zone_c3: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_c3}", model_code: "SPOT-80", category: "SPOT", wattage_w: 80, purchase_price_cents: 9000, warranty_months: 60 }
              as: LightingDesigner
              captures: { fx_c3: $.data.id }
            - call: "POST /fixtures/${fx_c3}/assign-zone"
              payload: { zone_id: "${zone_c3}", expected_transformer_version: "${tx_c3_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_c3}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_c3}" }
              as: LightingDesigner
              captures: { q_c3: $.data.id }
            - call: "POST /quotes/${q_c3}/lines"
              payload: { model_code: "SPOT-80", quantity: 1, unit_price_cents: 9000 }
              as: LightingDesigner
