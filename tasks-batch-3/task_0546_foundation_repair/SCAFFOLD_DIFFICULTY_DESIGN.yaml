            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 0, anchor_count: 2, avg_pier_depth_ft: 12, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
          trigger:
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer, captures: { err: "$.data.error_id" } }
          assert:
