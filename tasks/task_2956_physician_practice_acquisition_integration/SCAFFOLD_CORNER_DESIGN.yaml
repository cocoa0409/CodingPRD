              payload: { acquisition_id: "${acq_id}", staff_member_name: "Perla Otieno", role_code: "BILLER", legacy_annual_wage_cents: 5282350, legacy_pto_hours: 104, credited_service_months: 84, offer_expires_on: "2026-10-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { offer_live_id: "$.data.id" }
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Imani Rutledge", role_code: "FRONT_DESK", legacy_annual_wage_cents: 3400000, legacy_pto_hours: 0, credited_service_months: 6, offer_expires_on: "2026-10-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { offer_draft_id: "$.data.id" }
            - call: "POST /staff-transition-offers/${offer_live_id}/status"
              payload: { target_status: "EXTENDED" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions/${acq_id}/compliance-clearance"
              payload: { target_clearance: "FLAGGED", clearance_note: "Referral-source review opened" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /acquisitions/${acq_id}/compliance-clearance"
              payload: { target_clearance: "SUSPENDED", clearance_note: "Integration suspended pending the self-disclosure decision" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the trigger response reports Acquisition.${acq_id}.compliance_clearance == SUSPENDED"
            - "StaffTransitionOffer.${offer_draft_id}.status == RESCINDED, rescinded by the cascade"
            - "StaffTransitionOffer.${offer_live_id}.status == EXTENDED, untouched, with retention_bonus_cents 557288"
            - "Acquisition.${acq_id}.retention_pool_committed_cents == 557288 and retention_pool_available_cents == 2442712, unchanged by the cascade because a DRAFT offer reserved nothing"
            - "while SUSPENDED, POST /staff-transition-offers on ${acq_id} is refused with ERR_COMPLIANCE_CLEARANCE_BLOCKED (403), as is POST /valuation-opinions"
            - "GET /acquisitions/${acq_id} and POST /readiness-tasks still succeed while SUSPENDED, because both are exempt from the clearance gate"
            - "moving the clearance SUSPENDED -> FLAGGED restores the blocked writes but leaves ${offer_draft_id} in RESCINDED: the cascade is not reversed"

      - name: payer_denial_cascade_runs_three_levels_deep
        claim_type: Cascading side effects — N-level chain and ordering
        grounds:
          - state_machines.PayerContract.novation_status.NOTICE_SENT_to_DENIED
          - state_machines.CredentialingPackage.status.SUBMITTED_to_WITHDRAWN
          - state_machines.ReadinessTask.status.COMPLETE_to_FAILED
          - calculations.acquisition_readiness_posture
        excluded_because:
          difficulty_instance: payer_denial_withdraws_packages_fails_credentialing_task_and_blocks_posture
          rationale: |
            The deepest declared cascade — payer denial withdrawing every live credentialing
            package, driving the PAYER_CREDENTIALING checklist line from COMPLETE back to
            FAILED, clearing its verified_by_user_id and dropping the acquisition's posture
            to BLOCKED — is already designed end-to-end as a §1.8 instance, including the
            ordering requirement that the packages be withdrawn before the task is failed
            and the fact that the freed committee seats are observable afterwards. A corner
            instance here would only re-run the same chain with different fixture names.

      - name: dual_variant_families_diverge_on_identical_inputs
        claim_type: Dual variant calculation — both variants and the delta on switch
        grounds:
          - calculations.fmv_concluded_value
          - calculations.compensation_benchmark_percentile
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: fmv_income_vs_market_diverges_on_same_ebitda_inputs
          rationale: |
            Both declared dual-variant families are already exhausted in §1.8: the valuation
            family, where INCOME_APPROACH and MARKET_APPROACH conclude 2167511341 against
            1560000000 from one normalized EBITDA, and the benchmarking family, where
            TOTAL_CASH_COMP and COMP_PER_WRVU place the same physician's economics at
            different percentiles and therefore on opposite sides of the safe harbour. Those
            two instances cover both variants, the selection rule and the delta on switch,
            so a corner instance would add fixture noise rather than a new claim.

  # ===========================================================================
  # Section 9 — Consistency Model (§1.0 consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: board_review_side_effects_are_visible_in_the_triggering_response
        claim_type: Immediate — all changes visible in the same request's response
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Acquisition.deal_status.DILIGENCE_to_BOARD_REVIEW
          - calculations.malpractice_tail_premium
          - calculations.deal_net_consideration
        distinguishing_aspect: |
          One transition writes five derived money fields on the parent and a pin on a
          child, and every one of them is already correct in the body of the response that
          performed the transition — no re-read, no second request and no lag between the
          detail read and the list projection.
        test_recipe:
          setup:
            - "One EQUITY CLAIMS_MADE Acquisition with tail_coverage_months 72 in deal_status DILIGENCE."
            - "One ACCEPTED FMV MARKET_APPROACH opinion concluding 1560000000 and one ACCEPTED REASONABLE opinion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Northgate Cardiology Associates", specialty: "CARDIOLOGY", structure: "EQUITY", malpractice_policy_form: "CLAIMS_MADE", annual_malpractice_premium_cents: 9600000, tail_coverage_months: 72, trailing_annual_collections_cents: 900000000, target_close_on: "2026-12-01", required_staff_headcount: 8, retention_pool_total_cents: 6000000, escrow_total_cents: 20000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1962037481", full_name: "Rowan Ilesanmi MD", specialty: "CARDIOLOGY", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 240000000, market_multiple_bps: 65000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { fmv_id: "$.data.id" }
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "ACCEPTED", review_note: "Market approach accepted" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v2: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v2}", opinion_type: "COMMERCIAL_REASONABLENESS", method: "NARRATIVE", cr_conclusion: "REASONABLE", independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { cr_id: "$.data.id" }
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "ACCEPTED", review_note: "Commercially reasonable" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "BOARD_REVIEW" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "the trigger response body itself carries deal_status BOARD_REVIEW, purchase_price_cents 1560000000, tail_premium_cents 25920000, integration_reserve_cents 54600000, gross_consideration_cents 1640520000, synergy_credit_bps 275, synergy_credit_cents 45114300 and net_consideration_cents 1595405700"
            - "GET /acquisitions/${acq_id} issued immediately afterwards reports every one of those fields identically"
            - "GET /valuation-opinions/${fmv_id} issued immediately afterwards reports is_pinned true, so the child write is visible in the very next request"
            - "GET /valuation-opinions with acquisition_id ${acq_id} and is_pinned true reports total_count == 1, so the filter index is current too"
            - "GET /acquisitions with deal_status BOARD_REVIEW includes ${acq_id} with the same net_consideration_cents in the list projection"
            - "no repeated read ever changes any of these values, so nothing in the model is eventually consistent"

      - name: readiness_posture_is_current_in_the_next_request
        claim_type: Immediate — derived field and filter index current on the next read
        grounds:
          - complexity_profile.consistency_model
          - calculations.acquisition_readiness_posture
          - state_machines.ReadinessTask.status.IN_PROGRESS_to_COMPLETE
          - endpoints[GET /acquisitions]
        distinguishing_aspect: |
          readiness_posture is a denormalised aggregate over another collection, which is
          exactly the field a lagging implementation would let drift: it is recomputed
          inside the task transition, so the acquisition detail read, the list projection
          and the readiness_posture filter all agree on the very next request.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE with two blocking ReadinessTasks, one already COMPLETE and one IN_PROGRESS, and one non-blocking task left OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_id}", task_code: "COMPLIANCE_TRAINING", is_blocking: true, due_on: "2026-10-25" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_a_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_id}", task_code: "REVENUE_CYCLE_GO_LIVE", is_blocking: true, due_on: "2026-10-28" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_b_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_id}", task_code: "PATIENT_NOTIFICATION", is_blocking: false, due_on: "2026-10-30" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_c_id: "$.data.id" }
            - call: "POST /readiness-tasks/${task_a_id}/status"
              payload: { target_status: "IN_PROGRESS" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /readiness-tasks/${task_a_id}/status"
              payload: { target_status: "COMPLETE" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /readiness-tasks/${task_b_id}/status"
              payload: { target_status: "IN_PROGRESS" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /readiness-tasks/${task_b_id}/status"
              payload: { target_status: "COMPLETE" }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "the trigger response reports ReadinessTask.${task_b_id}.status COMPLETE with verified_by_user_id im-1"
            - "GET /acquisitions/${acq_id} issued immediately afterwards reports readiness_posture READY"
            - "GET /acquisitions with readiness_posture READY includes ${acq_id} on the very next request, and the same filter for AT_RISK no longer returns it"
            - "the non-blocking ReadinessTask.${task_c_id} is still OPEN and does not hold the posture back"
            - "immediately before the trigger the posture was AT_RISK, with one blocking task COMPLETE and one IN_PROGRESS"
            - "moving ${task_b_id} COMPLETE -> FAILED by a payer-denial cascade drops the posture to BLOCKED in the response of the transition that caused it, with no intervening read required"
