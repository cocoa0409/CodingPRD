# 1.9 Scaffold Corner Design - task_2411_household_staff_placement_agency
#
# Breadth index. Companion to SCAFFOLD_DIFFICULTY_DESIGN.yaml (1.8, the depth index).
# Every instance is grounded in SCAFFOLD.yaml 1.1-1.7 only; each `name:` is quoted
# downstream as `Design: Corner/<section>/<instance.name>` and is stable.
# Instances whose corner is already driven by a 1.8 scenario carry `excluded_because:`
# and no `test_recipe:`.
#
# Conventions mirror SCAFFOLD_DIFFICULTY_DESIGN.yaml: `asserts:` (not `assert:`),
# `as_user:` for the X-User-ID header, `grounds:` as one semicolon-joined string,
# entity-backed roles written `as: Client` / `as: Candidate`, and every
# formula-derived figure pre-computed as a literal.
scaffold_corner_design:
- section: entities
  instances:
  - name: client_creation_returns_a_prospect_with_an_unsigned_agreement
    claim_type: creation
    grounds: entities.Client (household_name, primary_contact_email, region_code, status, confidentiality_agreement_status,
      outstanding_balance_cents, placement_count); endpoints.POST /clients
    distinguishing_aspect: 'Every server-owned field of a brand-new household is pinned in the creation
      response: PROSPECT / UNSIGNED / zeroed counters / version 1, rather than only the echoed input.'
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
      asserts:
      - the trigger returns 201 with household_name == Ashworth Mews, primary_contact_email == ops@ashworth.example
        and region_code == NY
      - status == PROSPECT and confidentiality_agreement_status == UNSIGNED
      - outstanding_balance_cents == 0, placement_count == 0, signatory_name == null, countersigned_at
        == null and non_solicitation_expires_on == null
      - version == 1 and the response carries meta.api_request_id and meta.api_request_timestamp
  - name: client_retrieval_returns_the_stored_household
    claim_type: retrieval
    grounds: entities.Client; endpoints.GET /clients/{id}
    distinguishing_aspect: The read-back returns the same id and the same derived fields the create response
      carried, proving the row was stored rather than echoed.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      trigger:
      - call: GET /clients/${client_id}
        as: PlacementConsultant
      asserts:
      - the trigger returns 200 with id == ${client_id} and household_name == Ashworth Mews
      - region_code == NY, status == PROSPECT, confidentiality_agreement_status == UNSIGNED
      - outstanding_balance_cents == 0, placement_count == 0 and version == 1
  - name: client_listing_returns_the_declared_pagination_envelope
    claim_type: listing
    grounds: entities.Client; endpoints.GET /clients; response_envelope.pagination_fields
    distinguishing_aspect: All four pagination fields are asserted together with a page smaller than the
      result set, so has_more and total_count cannot both be defaulted.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Beckford Row
          primary_contact_email: ops@beckford.example
          region_code: CA
        captures:
          client2_id: $.data.id
      trigger:
      - call: GET /clients?limit=1&offset=0
        as: AgencyPrincipal
      asserts:
      - the trigger returns 200 with exactly 1 row in data
      - limit == 1, offset == 0, total_count == 2 and has_more == true
      - GET /clients?limit=1&offset=1 as AgencyPrincipal returns the other household with has_more ==
        false
  - name: unknown_client_id_returns_client_not_found
    claim_type: not_found
    grounds: errors[ERR_CLIENT_NOT_FOUND]; validations.path_entity_exists
    distinguishing_aspect: A well-formed but unknown uuid returns 404 with the household-specific error
      id, not a generic 404 or an empty 200.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: GET /clients/00000000-0000-0000-0000-000000000000
        as: AgencyPrincipal
      asserts:
      - the trigger returns 404 with error_id == ERR_CLIENT_NOT_FOUND
      - message == "No household exists with that id." and response_type == error
  - name: client_missing_required_region_code_is_rejected
    claim_type: required_fields
    grounds: entities.Client.region_code; validations.required_fields_present; errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting one of the three required Client inputs is a 400 ERR_INVALID_REQUEST,
      not a row created with a null region_code.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Carraway Hall
          primary_contact_email: ops@carraway.example
      asserts:
      - the trigger returns 400 with error_id == ERR_INVALID_REQUEST
      - GET /clients as AgencyPrincipal returns total_count == 0, so no partial household was stored
  - name: requisition_defaults_leave_live_in_required_false_and_the_fee_snapshot_null
    claim_type: defaults
    grounds: entities.RoleRequisition (live_in_required default false, scoping_round, active_trial_count,
      resolved_fee_schedule_id, fee_percent_bps, guarantee_window_days, provisional_fee_cents); endpoints.POST
      /role-requisitions
    distinguishing_aspect: The optional live_in_required defaults to false and all four fee-snapshot fields
      stay null until finalize-scope stamps them.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      trigger:
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: HOUSEKEEPER
          first_year_compensation_cents: 10000000
          schedule_pattern: FIVE_TWO
      asserts:
      - the trigger returns 201 with live_in_required == false and scope_note == null
      - status == DRAFT, scoping_round == 0 and active_trial_count == 0
      - resolved_fee_schedule_id == null, fee_percent_bps == null, guarantee_window_days == null and provisional_fee_cents
        == null
      - version == 1
  - name: candidate_defaults_leave_live_in_willing_false_and_every_score_at_zero
    claim_type: defaults
    grounds: entities.Candidate (live_in_willing default false, vetting_status, availability_status, verified_reference_count,
      reference_coverage_months, longest_contiguous_months, screening_score, placement_ready_score); endpoints.POST
      /candidates
    distinguishing_aspect: Omitting live_in_willing yields false and every derived counter starts at 0
      rather than null.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /candidates
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          full_name: R. Okoye
          contact_email: rokoye@mail.example
          primary_role_type: CHAUFFEUR
          years_experience: 4
      asserts:
      - the trigger returns 201 with live_in_willing == false
      - vetting_status == UNVETTED and availability_status == AVAILABLE
      - verified_reference_count == 0, reference_coverage_months == 0, longest_contiguous_months == 0,
        screening_score == 0 and placement_ready_score == 0
      - cooling_off_until == null and version == 1
  - name: payroll_handoff_defaults_its_ein_status_to_not_applied
    claim_type: defaults
    grounds: entities.PayrollHandoff (ein_status default NOT_APPLIED, status); endpoints.POST /placements/{id}/payroll-handoffs
    distinguishing_aspect: The optional ein_status defaults to NOT_APPLIED, which is exactly the value
      that later blocks attestation.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 2000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
        captures:
          fs_id: $.data.id
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: HOUSEKEEPER
          first_year_compensation_cents: 10000000
          schedule_pattern: FIVE_TWO
        captures:
          req_id: $.data.id
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Live-out housekeeper, five days on two off.
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Fee band resolved.
      - call: POST /candidates
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          full_name: P. Danvers
          contact_email: pdanvers@mail.example
          primary_role_type: HOUSEKEEPER
          years_experience: 10
          live_in_willing: true
        captures:
          cand_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Whitfield Residence
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2022-01
          employment_end_month: 2022-12
          contact_email: whitfield@mail.example
        captures:
          ref1_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Marlow Estate
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2023-01
          employment_end_month: 2023-12
          contact_email: marlow@mail.example
          prior_reference_id: ${ref1_id}
        captures:
          ref2_id: $.data.id
      - call: POST /reference-checks/${ref1_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Confirmed by telephone.
      - call: POST /reference-checks/${ref2_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Confirmed by telephone.
      - call: POST /candidates/${cand_id}/background-verifications
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          provider_reference: BV-2411-01
          scope_items:
          - IDENTITY
          - CRIMINAL
          - DMV
        captures:
          bgv_id: $.data.id
      - call: POST /background-verifications/${bgv_id}/record-result
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          result: CLEARED
          findings_note: No adverse findings.
      - call: POST /role-requisitions/${req_id}/trial-engagements
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          engagement_type: TRIAL_DAY
          start_at: '2026-08-10T09:00:00Z'
          end_at: '2026-08-10T17:00:00Z'
          day_rate_cents: 40000
        captures:
          trial_id: $.data.id
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-10T17:00:00Z'
      - call: POST /trial-engagements/${trial_id}/start
        as: PlacementConsultant
        payload:
          note: Household received the candidate.
      - call: POST /trial-engagements/${trial_id}/record-outcome
        as: PlacementConsultant
        payload:
          outcome: PASSED
          outcome_note: Household verdict recorded.
      - call: GET /role-requisitions/${req_id}
        as: PlacementConsultant
        captures:
          req_v1: $.data.version
      - call: POST /role-requisitions/${req_id}/accommodation-terms
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          live_in: false
          weekly_hours: 40
          days_off_per_week: 2
          private_quarters: false
          imputed_accommodation_cents: 0
          expected_requisition_version: ${req_v1}
          note: Opening position on hours and accommodation.
        captures:
          term_id: $.data.id
      - call: POST /accommodation-terms/${term_id}/respond
        as: Client
        payload:
          response: ACCEPT
          note: Response recorded.
      - call: GET /role-requisitions/${req_id}
        as: PlacementConsultant
        captures:
          req_v2: $.data.version
      - call: POST /placements
        as: PlacementConsultant
        payload:
          requisition_id: ${req_id}
          candidate_id: ${cand_id}
          start_date: '2026-09-01'
          base_salary_cents: 6000000
          guaranteed_bonus_cents: 2000000
          accommodation_imputed_cents: 0
          overtime_allowance_cents: 2000000
          expected_requisition_version: ${req_v2}
        captures:
          plc_id: $.data.id
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-09-01T00:00:00Z'
      - call: POST /placements/${plc_id}/confirm-start
        as: AgencyPrincipal
        payload:
          note: Package confirmed on the start date.
      trigger:
      - call: POST /placements/${plc_id}/payroll-handoffs
        as: ComplianceOfficer
        as_user: u_comp_1
        payload:
          provider_name: Household Payroll Partners
          guidance_packet_version: HP-2026.2
      asserts:
      - the trigger returns 201 with ein_status == NOT_APPLIED and status == PREPARED
      - attested_by_name == null, attested_at == null and version == 1
  - name: placement_computes_its_actual_compensation_and_copies_the_fee_snapshot
