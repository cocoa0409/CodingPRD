          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The priority-10 gate treats an empty X-User-ID as absent: the read is refused 401 ERR_UNAUTHENTICATED even though X-User-Role names a role that is authorised for the endpoint."
        test_recipe:
          setup: ["Cedar Ridge Zoo exists, so the listing would otherwise return one row."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
