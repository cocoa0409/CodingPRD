      - name: full_scope_share_blocked_by_narrower_prospect_consent_scope
        grounds:
          - validations.priority_11
          - entities.Prospect.fields.consent_scope
          - entities.MedicalRecordShare.fields.scope
          - concurrency_rules.share-request-stale-evaluation
        distinguishing_aspect: |
          Consent is GRANTED and unexpired and the evaluation is DISCLOSABLE, so the only
          defect is that the prospect authorised SUMMARY disclosure while the club asked for
          FULL. The scope comparison lives on a different entity from the row being created, so
          ERR_CONSENT_NOT_GRANTED (403) must be raised from the parent Prospect's consent_scope
          and no share row may appear.
        test_recipe:
          setup:
