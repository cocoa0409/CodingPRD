  http: 403
  condition: Role not permitted on this endpoint, or entity-backed kind mismatch (Teacher needs TEACHER kind, BuildingAdmin needs ADMIN kind)
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id (left-to-right) or body-referenced FK id does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, bad type/enum/range/datetime, ends_at <= starts_at, malformed school_year
- id: ERR_INVALID_STATE
  http: 400
  condition: Lifecycle transition not valid from current state (incl. terminal lockdown)
- id: ERR_SECTION_NOT_OPEN
  http: 400
  condition: Registration attempted on a section not in PUBLISHED
- id: ERR_EMPLOYEE_NOT_ACTIVE
  http: 400
  condition: Employee-targeted write while employee is ON_LEAVE or SEPARATED
- id: ERR_BUDGET_NOT_OPEN
  http: 400
  condition: No OPEN budget for (building, fiscal year) when a charge is attempted
- id: ERR_BUDGET_HAS_ENCUMBRANCES
  http: 400
  condition: Budget close attempted with encumbered_cents > 0
- id: ERR_BUDGET_ALREADY_EXISTS
  http: 400
  condition: Budget already exists for (building_id, fiscal_year)
- id: ERR_BUDGET_INSUFFICIENT
  http: 400
  condition: available_cents < required amount on an encumbering operation
- id: ERR_PREREQUISITE_NOT_COMPLETED
  http: 400
  condition: Course has prerequisite_course_id and teacher lacks an AWARDED COURSE_COMPLETION entry for it
- id: ERR_COMPLIANCE_HOLD
  http: 400
  condition: Lane advancement blocked by compliance_standing == NON_COMPLIANT
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Same X-User-ID attempts a step forbidden to the performer of a prior step (workshop approve vs reimburse/deny; assignment create vs waive)
- id: ERR_NOT_RESOURCE_OWNER
  http: 403
  condition: Entity-backed role acts on a resource owned by another (teacher on another's registration/plan/workshop; instructor on another's section)
- id: ERR_BUILDING_SCOPE_VIOLATION
  http: 403
  condition: BuildingAdmin acts on a resource outside their primary building
- id: ERR_PLAN_NOT_APPROVED
  http: 400
  condition: growth_plan_id references a plan not in APPROVED or FULFILLED
- id: ERR_PLAN_YEAR_MISMATCH
  http: 400
  condition: Aligned activity date falls outside the plan's school year (or plan belongs to another teacher)
- id: ERR_AUDIT_ENTRY_MISMATCH
  http: 400
  condition: Transcript entry does not belong to the audit case's employee + fiscal year
- id: ERR_ENTRY_ALREADY_REVERSED
  http: 400
  condition: reverse-entry on a TranscriptEntry already REVERSED
- id: ERR_REGISTRATION_NOT_YET_OPEN
  http: 400
  condition: now < registration_opens_at
- id: ERR_REGISTRATION_WINDOW_CLOSED
  http: 400
  condition: now > registration_closes_at
- id: ERR_PREAPPROVAL_LEAD_TIME
  http: 400
  condition: Workshop submit with starts_at < now + 14 days
- id: ERR_APPROVAL_AFTER_START
  http: 400
  condition: Workshop approval at or after starts_at
- id: ERR_WORKSHOP_NOT_STARTED
  http: 400
  condition: Workshop completion evidence submitted before starts_at
- id: ERR_ADVANCEMENT_WINDOW_CLOSED
  http: 400
  condition: Lane advancement outside logical months {8, 9}
- id: ERR_MEETING_OUTSIDE_SECTION
  http: 400
  condition: Meeting interval not contained in section [starts_at, ends_at]
- id: ERR_DUPLICATE_REGISTRATION
  http: 409
  condition: Teacher already has a REGISTERED or WAITLISTED registration for the section
- id: ERR_SCHEDULE_CONFLICT
  http: 409
  condition: New registration's section window overlaps (half-open) a section the teacher is REGISTERED in; adjacency allowed
- id: ERR_ROOM_CONFLICT
  http: 409
  condition: Meeting violates the 30-minute same-room turnover buffer against any existing meeting
- id: ERR_SURVEY_ALREADY_SUBMITTED
  http: 409
  condition: Second survey for the same registration
- id: ERR_REVISION_LIMIT_EXCEEDED
  http: 400
  condition: Workshop revise attempted with revision_count == 3
- id: ERR_CAPACITY_BELOW_REGISTERED
  http: 400
  condition: PATCH seat_capacity below current seats_registered
- id: ERR_ATTENDANCE_INCOMPLETE
  http: 400
  condition: verify-attendance with at least one section meeting lacking a record for this registration
- id: ERR_ATTENDANCE_NOT_VERIFIED
  http: 400
  condition: complete attempted with attendance_status != VERIFIED
- id: ERR_SURVEY_NOT_SUBMITTED
  http: 400
  condition: complete attempted with attendance VERIFIED but survey_status == PENDING
- id: ERR_LANE_MAX_REACHED
  http: 400
  condition: advance-lane at DOC lane
- id: ERR_ADVANCEMENT_ALREADY_THIS_FY
  http: 400
  condition: advance-lane with last_advancement_fiscal_year == current fiscal year
- id: ERR_LANE_CREDITS_INSUFFICIENT
  http: 400
  condition: advance-lane with lane_credit_balance < 12.0
- id: ERR_STALE_EMPLOYEE_VERSION
  http: 412
  condition: expected_employee_version mismatch on growth-plan create
- id: ERR_STALE_ASSIGNMENT_VERSION
  http: 412
  condition: expected_assignment_version mismatch on extend
roles:
- name: Teacher
  description: District teacher; registers, drops/withdraws, submits surveys, requests workshops, owns growth plans
  identity: entity_backed:Employee
  exclusive_operations:
  - POST /pd/registrations/{id}/survey
  shared_operations:
  - POST /pd/registrations (teacher_id must equal X-User-ID)
  - POST /pd/registrations/{id}/drop, /withdraw (own only)
  - POST /pd/workshop-requests (+/submit, /revise, /complete) (own only)
  - POST /pd/growth-plans (+/submit) (own only)
  - All GET endpoints
- name: BuildingAdmin
  description: Building principal; approves/rejects workshops and growth plans for own building's employees
  identity: entity_backed:Employee
  exclusive_operations:
  - POST /pd/workshop-requests/{id}/approve, /reject (scoped to workshop.building_id)
  - POST /pd/growth-plans/{id}/approve, /return (scoped to plan teacher's building)
  shared_operations:
  - All GET endpoints
- name: Instructor
  description: Section instructor; records meeting attendance and verifies attendance for own sections
  identity: entity_backed:Employee
  exclusive_operations: []
  shared_operations:
  - POST /pd/meetings/{id}/attendance (must be section.instructor_id)
  - POST /pd/registrations/{id}/verify-attendance (must be section.instructor_id)
  - All GET endpoints
- name: PDCoordinator
  description: District PD office operator; catalog, sections, compliance, completions, ops runs, clock
  identity: opaque
  exclusive_operations:
  - POST /pd/_clock/set_current_utc, /pd/ops-runs
  - POST /pd/buildings, /pd/employees, /pd/courses (+/retire), /pd/sections (+/publish, /cancel, /meetings), PATCH /pd/sections/{id}
  - POST /pd/employees/{id}/set-status, /advance-lane
  - POST /pd/registrations/{id}/waive-survey, /complete
  - POST /pd/compliance-assignments (+/waive, /extend)
  - POST /pd/growth-plans/{id}/close
  shared_operations:
  - Registration/workshop/plan create and lifecycle endpoints (acting on behalf)
  - Attendance recording/verification
  - All GET endpoints
- name: BusinessOfficer
  description: District business office; owns budgets and reimbursements (segregated from approvers)
  identity: opaque
  exclusive_operations:
  - POST /pd/budgets (+/open, /close)
  - POST /pd/workshop-requests/{id}/reimburse, /deny-reimbursement
  shared_operations:
  - All GET endpoints
- name: Auditor
  description: Independent auditor; transcript audit cases and reversing entries
  identity: opaque
  exclusive_operations:
  - POST /pd/audit-cases (+/raise-finding, /reverse-entry, /resolve, /close-clean)
  shared_operations:
  - All GET endpoints
