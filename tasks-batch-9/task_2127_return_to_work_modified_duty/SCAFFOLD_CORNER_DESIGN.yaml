  - name: filled_seats_is_recomputed_after_suspend_and_resume
    claim_type: derived_field_reconciliation
    grounds:
    - entities.TransitionalJob.fields.filled_seats
    - state_machines.Placement.SUSPENDED_to_ACTIVE
    distinguishing_aspect: 'filled_seats is derived from the placement status predicate rather than incremented blindly: suspend takes it 1 -> 0 and resume takes it 0 -> 1, matching the count of ADJUSTER_PENDING/ACTIVE/PROGRESSION_HOLD
