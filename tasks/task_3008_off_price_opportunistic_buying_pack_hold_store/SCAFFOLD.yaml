# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or body FK does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, bad type, unknown enum value, or unknown field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target resource not in a valid from-state for the attempted transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "unique code collision (season/vendor/zone/lot/warehouse/store) or second PackawayHold for a lot" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "lot evaluation/acceptance at or after offer_expires_at" }
  - { id: ERR_VENDOR_DISCRETION, http: 403, condition: "CONFIDENTIAL/QUIET vendor lot acted on or read by a non-senior Buyer" }
  - { id: ERR_OTB_FORWARD_EXCEEDED, http: 422, condition: "IMMEDIATE lot landed cost exceeds forward open-to-buy availability" }
  - { id: ERR_OTB_PACKAWAY_EXCEEDED, http: 422, condition: "PACKAWAY lot landed cost exceeds packaway reserve availability" }
  - { id: ERR_TARGET_SEASON_NOT_DRAFT, http: 422, condition: "packaway target season missing, equals buying season, or not DRAFT" }
  - { id: ERR_HOLD_WINDOW_CLOSED, http: 422, condition: "release outside [release_window_start, release_window_end]" }
  - { id: ERR_TARGET_SEASON_NOT_OPEN, http: 422, condition: "packaway release before the target season is OPEN" }
  - { id: ERR_AGING_REVIEW_PREMATURE, http: 422, condition: "aging review while age_bucket == FRESH (< 90 days)" }
  - { id: ERR_SEASON_NOT_OPEN, http: 422, condition: "allocation execute or floor placement while the selling season is not OPEN" }
  - { id: ERR_SEASON_ALREADY_OPEN, http: 422, condition: "opening a season while another season is OPEN" }
  - { id: ERR_OPEN_LOTS_REMAIN, http: 422, condition: "season close with lots still OFFERED or EVALUATED" }
  - { id: ERR_PACKAWAY_HOLDS_ACTIVE, http: 422, condition: "season close with holds still STORED or AGING_REVIEW" }
  - { id: ERR_PLAN_NOT_EXECUTABLE, http: 422, condition: "season close with plans still DRAFT or APPROVED" }
  - { id: ERR_LOT_ALREADY_ALLOCATED, http: 422, condition: "approving a plan when the lot already has an APPROVED/EXECUTED plan" }
  - { id: ERR_CLUSTER_UNCOVERED, http: 422, condition: "cluster_weights key with no eligible store, or an eligible store cluster missing from weights" }
  - { id: ERR_WAREHOUSE_OVER_CAPACITY, http: 422, condition: "pallet capacity exceeded at the warehouse" }
  - { id: ERR_STORE_OVER_CAPACITY, http: 422, condition: "store storage_capacity_units exceeded by placement" }
  - { id: ERR_TICKET_NOT_ISSUED, http: 422, condition: "placement or allocation execute without an ACTIVE ticket for the store's zone" }
  - { id: ERR_TICKET_IN_USE, http: 422, condition: "voiding a ticket referenced by live store stock" }
  - { id: ERR_RECEIPT_LINE_QTY_INVALID, http: 422, condition: "received_qty outside [0, declared_qty] or unrecorded at completion" }
  - { id: ERR_NEGATIVE_ON_HAND, http: 422, condition: "deplete units_sold exceeds units_on_hand" }
  - { id: ERR_SHRINK_EXCEEDS_ON_HAND, http: 422, condition: "shrink case units_lost exceeds the store SKU's units_on_hand" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Buyer
    description: "Off-price buyer; evaluates and commits lots within open-to-buy. Buyer tier is pinned by the X-User-ID convention: ids beginning with the prefix 'senior-' are SENIOR tier, all other ids are JUNIOR tier (junior buyers may not evaluate/accept/pass or read CONFIDENTIAL/QUIET vendor lots)"
    identity: "opaque"
    exclusive_operations: ["POST /lots/{id}/evaluate", "POST /lots/{id}/accept", "POST /lots/{id}/pass"]
    shared_operations: ["POST /lots", "GET lots/vendors/seasons", "POST /lots/{id}/cancel"]

  - name: PlanningLead
    description: "Merchandise planning lead; owns seasons, vendors, liquidation approvals, and the logical clock"
    identity: "opaque"
    exclusive_operations: ["POST /merchandise-seasons", "POST /merchandise-seasons/{id}/open", "POST /merchandise-seasons/{id}/close", "POST /vendors", "POST /_clock/set_current_utc", "POST /liquidation-orders", "POST /liquidation-orders/{id}/approve", "POST /liquidation-orders/{id}/cancel"]
    shared_operations: ["GET across the surface"]

  - name: AllocationManager
    description: "Owns stores and cluster allocation plans"
    identity: "opaque"
    exclusive_operations: ["POST /stores", "POST /allocation-plans", "POST /allocation-plans/{id}/approve", "POST /allocation-plans/{id}/execute", "POST /allocation-plans/{id}/cancel"]
    shared_operations: ["POST /store-skus", "GET stores/plans/skus/seasons"]

  - name: InventoryPlanner
    description: "Owns warehouses and packaway holds (entry, aging review, release, liquidation)"
    identity: "opaque"
    exclusive_operations: ["POST /warehouses", "POST /packaway-holds", "POST /packaway-holds/{id}/aging-review", "POST /packaway-holds/{id}/release", "POST /packaway-holds/{id}/liquidate"]
    shared_operations: ["GET warehouses/holds/receipts"]

  - name: PricingAnalyst
    description: "Owns price zones and ticketing"
    identity: "opaque"
    exclusive_operations: ["POST /price-zones", "POST /tickets", "POST /tickets/{id}/void"]
    shared_operations: ["GET zones/tickets/lines"]

  - name: WarehouseClerk
    description: "Receives goods and completes receipts at warehouses"
    identity: "opaque"
    exclusive_operations: ["POST /receipts", "PATCH /receipts/{id}/lines/{lineId}", "POST /receipts/{id}/complete"]
    shared_operations: ["GET receipts/warehouses/lots"]

  - name: StoreOpsLead
    description: "Runs store floor operations: manual placement, depletion, liquidation execution"
    identity: "opaque"
    exclusive_operations: ["POST /store-skus/{id}/deplete", "POST /liquidation-orders/{id}/execute"]
    shared_operations: ["POST /store-skus", "POST /shrink-cases", "GET stores/skus/tickets"]

  - name: ShrinkAuditor
    description: "Files, confirms, and voids shrink cases"
    identity: "opaque"
    exclusive_operations: ["POST /shrink-cases/{id}/confirm", "POST /shrink-cases/{id}/void"]
    shared_operations: ["POST /shrink-cases", "GET shrink-cases/store-skus"]
