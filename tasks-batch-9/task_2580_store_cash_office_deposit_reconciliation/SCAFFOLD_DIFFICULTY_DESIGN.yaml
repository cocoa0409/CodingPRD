            - "Store S-1008 with theft_escalation_threshold_cents 50000, single_event_variance_threshold_cents 2500"
            - "MANUAL safe SAFE-A with 500000, UNLOCKED at 09:05Z"
            - "Cashier E-100 ran register 1 with an 80000 starting bank, declared a 200000 closing drop, closed with POS cash 200000, and was blind-counted at 20000"
            - "Reconcile produced variance_cents -60000 and an OPEN SESSION_VARIANCE case with total_variance_cents 60000 and suspected_theft true"
            - "An APPROVED change order for the coming week exists and has not yet been received"
            - "Logical clock is 2026-08-03T17:00:00Z"
          setup_api_calls:
