          trigger:
            - call: "POST /driver-pay/disputes/${dsp_rop}/reopen"
              payload: { narrative: "second try", evidence_doc_ref: "doc://rop-2" }
              as: PayrollAdmin
            - call: "POST /driver-pay/disputes/${dsp_rop}/review"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-01"
            - call: "POST /driver-pay/disputes/${dsp_rop}/resolve"
              payload: { outcome: "DENY", resolution_note: "still unsupported" }
