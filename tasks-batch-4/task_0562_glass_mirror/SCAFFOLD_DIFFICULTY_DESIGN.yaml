# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Glass & Mirror Shop — 9 rules x 2 instances = 18 instances
# Clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lead_time_quoted_vs_committed_diverges
        grounds:
          - calculations.lead_time_estimation
          - entities.Quote.fields.quoted_lead_days
          - entities.Job.fields.committed_lead_days
        distinguishing_aspect: |
          Same glass (job_fab_sqft=15) yields quoted_lead_days=6 (queue-blind, on the Quote)
          but committed_lead_days=8 on the Job because a 90 sqft SCHEDULED furnace backlog is
          folded in at accept — the two variants live on the lead-time domain.
        test_recipe:
          setup:
            - "One GOLD account with ample credit."
            - "job0 accepted from a quote whose single TEMPERED 60x72 x3 line = 90 billable sqft."
            - "A furnace and one SCHEDULED batch for job0 (total_sqft=90) left un-completed (backlog=90)."
            - "quote1 has a single TEMPERED 30x72 x1 line = 15 billable sqft, then SENT then accepted."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme Glazing", tier: "GOLD", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q0_id: $.data.id }
            - call: "POST /quotes/${q0_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 60, height_in: 72, quantity: 3 }
              as: Estimator
            - call: "POST /quotes/${q0_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q0_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job0_id: $.data.ordered_job_id }
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: ShopAdmin
              captures: { acct_v1: $.data.version }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job0_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch0_id: $.data.id, batch0_sqft: $.data.total_sqft }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q1_id}/send"
              payload: {}
              as: Estimator
              captures: { q1_quoted_lead: $.data.quoted_lead_days }
          trigger:
            - call: "POST /quotes/${q1_id}/accept"
              payload: { expected_account_version: "${acct_v1}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job1_id: $.data.ordered_job_id }
          assert:
            - "Quote.${q1_id}.quoted_lead_days == 6"
            - "TemperingBatch.${batch0_id}.total_sqft == 90"
            - "Job.${job1_id}.committed_lead_days == 8"
            - "Job.${job1_id}.committed_lead_days != Quote.${q1_id}.quoted_lead_days"

      - name: credit_provisional_hold_vs_final_asbuilt_diverges
        grounds:
          - calculations.credit_exposure
          - entities.Job.fields.credit_hold_cents
          - entities.Job.fields.final_total_cents
        distinguishing_aspect: |
          Provisional Job.credit_hold_cents at accept == quote total 16576 (blind to outcome),
          while final_total_cents after one billable breakage == 10788 (only the surviving
          INSTALLED line 8288 + one 2500 remake surcharge) — dual-variant on the credit domain.
        test_recipe:
          setup:
            - "GOLD account; quote with two identical ANNEALED 20x36 POLISHED shower lines (line_total 9750 each)."
            - "Quote total_cents = 16576 (per-line GOLD discount)."
            - "Accept -> job with credit_hold_cents 16576; both lines fabricated then installed."
            - "Line A breaks (BREAKAGE, billable_to_contractor=true) and the claim is APPROVED."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme Glazing", tier: "GOLD", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
              captures: { liA_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
              captures: { liB_id: $.data.id }
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch_id: $.data.id }
            - call: "POST /tempering-batches/${batch_id}/complete"
              payload: {}
              as: Fabricator
            - call: "POST /install-crews"
              payload: { name: "Crew1", certified_products: ["SHOWER_ENCLOSURE"] }
              as: ShopAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /install-appointments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", window_start: "2026-06-12T09:00:00Z", window_end: "2026-06-12T12:00:00Z" }
              as: Scheduler
              captures: { appt_id: $.data.id }
            - call: "POST /install-appointments/${appt_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { hold_provisional: $.data.credit_hold_cents }
            - call: "POST /claim-reports"
              payload: { job_id: "${job_id}", line_item_id: "${liA_id}", claim_type: "BREAKAGE", cause: "site drop", billable_to_contractor: true }
              as: Scheduler
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claim-reports/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ShopAdmin
          assert:
            - "Job.${job_id}.credit_hold_cents was 16576 immediately after accept (provisional variant)"
            - "Job.${job_id}.final_total_cents == 10788"
            - "Job.${job_id}.final_total_cents != 16576"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_item_pricing_nonlinear_rate_thickness_edge_area
        grounds:
          - calculations.line_item_pricing
          - entities.LineItem.fields.unit_price_cents
          - entities.LineItem.fields.billable_sqft
        distinguishing_aspect: |
          Mode (a): unit_price_cents=33500 = round(15.00 * (RATE[TEMPERED]1400 * THICKNESS_MULT[10]1.25
          + EDGE_RATE[POLISHED]150)) + PRODUCT_FEE[SHOWER]5000 — >=3 inputs, multiplicative
          rate x thickness plus additive edge, times area, plus fee.
        test_recipe:
          setup:
            - "A DRAFT quote on any account."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
              captures: { li_id: $.data.id, sqft: $.data.billable_sqft, unit: $.data.unit_price_cents }
          assert:
            - "LineItem.${li_id}.billable_sqft == 15.0"
            - "LineItem.${li_id}.unit_price_cents == 33500"
            - "LineItem.${li_id}.line_total_cents == 33500"

      - name: quote_total_perline_discount_rounding_order
        grounds:
          - calculations.quote_totals
          - entities.Quote.fields.total_cents
          - entities.Quote.fields.discount_cents
        distinguishing_aspect: |
          Mode (b): with two 9750 lines and GOLD 0.15, round-per-line-then-sum gives
          total_cents=16576 (8288+8288); sum-then-round would give 16575 — the pinned per-line
          order is the observable divergence.
        test_recipe:
          setup:
            - "GOLD account; quote with two identical ANNEALED 20x36 POLISHED shower lines (9750 each)."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "GOLD", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
              captures: { total: $.data.total_cents, subtotal: $.data.subtotal_cents, discount: $.data.discount_cents }
          assert:
            - "Quote.${q_id}.subtotal_cents == 19500"
            - "Quote.${q_id}.total_cents == 16576"
            - "Quote.${q_id}.discount_cents == 2924"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_sent_to_draft
        grounds:
          - state_machines.Quote.SENT_to_DRAFT
          - state_machines.Quote.DRAFT_to_SENT
          - entities.Quote.fields.revision_number
        distinguishing_aspect: |
          Quote cycles SENT -> DRAFT (revise) -> SENT: revision_number increments to 2 and the
          quote is re-editable — a genuine loop, not a one-way pipeline.
        test_recipe:
          setup:
            - "A quote with one line, SENT."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "BRONZE", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/revise"
              payload: {}
              as: Estimator
              captures: { status_after: $.data.status, rev: $.data.revision_number }
          assert:
            - "Quote.${q_id}.status == DRAFT"
            - "Quote.${q_id}.revision_number == 2"
            - "Quote.${q_id}.quoted_lead_days == null after revise"

      - name: job_parallel_fabrication_and_install_axes
        grounds:
          - state_machines.Job.fabrication_status_IN_FABRICATION_to_COMPLETE
          - entities.Job.fields.fabrication_status
          - entities.Job.fields.install_status
        distinguishing_aspect: |
          Job carries two independent axes: after batch completion fabrication_status becomes
          COMPLETE while install_status advances NOT_READY -> READY, and later SCHEDULED — the two
          dimensions evolve on the same row without a single linear order.
        test_recipe:
          setup:
            - "A job accepted (fabrication_status=PENDING, install_status=NOT_READY)."
            - "One batch scheduled then completed for the job."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /tempering-batches/${batch_id}/complete"
              payload: {}
              as: Fabricator
          assert:
            - "Job.${job_id}.fabrication_status == COMPLETE"
            - "Job.${job_id}.install_status == READY"
            - "Job.${job_id}.status == ACTIVE"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_approve_cascade_line_remake_credit
        grounds:
          - state_machines.ClaimReport.FILED_to_APPROVED
          - state_machines.LineItem.INSTALLED_to_BROKEN
          - entities.RemakeOrder.fields.remake_cost_cents
          - entities.ContractorAccount.fields.credit_used_cents
        distinguishing_aspect: |
          Depth-3: ClaimReport APPROVED -> LineItem INSTALLED->BROKEN -> RemakeOrder created
          (12250) -> ContractorAccount.credit_used_cents 16576->19076 (+2500). Each hop is caused
          by the prior hop, not by the approve directly.
        test_recipe:
          setup:
            - "GOLD account; job with two 9750 lines (total 16576); both installed."
            - "One BREAKAGE claim (billable) FILED on the installed line A."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "GOLD", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
              captures: { liA_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch_id: $.data.id }
            - call: "POST /tempering-batches/${batch_id}/complete"
              payload: {}
              as: Fabricator
            - call: "POST /install-crews"
              payload: { name: "Crew1", certified_products: ["SHOWER_ENCLOSURE"] }
              as: ShopAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /install-appointments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", window_start: "2026-06-12T09:00:00Z", window_end: "2026-06-12T12:00:00Z" }
              as: Scheduler
              captures: { appt_id: $.data.id }
            - call: "POST /install-appointments/${appt_id}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /claim-reports"
              payload: { job_id: "${job_id}", line_item_id: "${liA_id}", claim_type: "BREAKAGE", cause: "site drop", billable_to_contractor: true }
              as: Scheduler
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claim-reports/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ShopAdmin
              captures: { remake_id: $.data.remake_order_id }
          assert:
            - "LineItem.${liA_id}.status == BROKEN"
            - "RemakeOrder.${remake_id}.remake_cost_cents == 12250"
            - "Job.${job_id}.fabrication_status == REOPENED"
            - "ContractorAccount.${acct_id}.credit_used_cents == 19076"

      - name: quote_accept_cascade_job_lineitems
        grounds:
          - state_machines.Quote.SENT_to_ORDERED
          - state_machines.LineItem.SPEC_to_FABRICATING
          - entities.Quote.fields.ordered_job_id
        distinguishing_aspect: |
          Depth-2: Quote SENT->ORDERED creates a Job, and Job creation (not the accept itself)
          drives each LineItem SPEC->FABRICATING.
        test_recipe:
          setup:
            - "SILVER account; quote with one line, SENT."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "CUSTOM_MIRROR", glass_type: "ANNEALED", thickness_mm: 6, width_in: 30, height_in: 24, quantity: 1 }
              as: Estimator
              captures: { li_id: $.data.id }
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
          assert:
            - "Quote.${q_id}.status == ORDERED"
            - "Quote.${q_id}.ordered_job_id is non-null (== ${job_id})"
            - "LineItem.${li_id}.status == FABRICATING"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_state_beats_credit_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.Quote.SENT_to_ORDERED
        distinguishing_aspect: |
          Error-category pair state(priority 5) vs business_fiscal(priority 10): re-accepting an
          already-ORDERED quote whose account now has zero headroom returns ERR_INVALID_STATE, not
          ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "GOLD account with credit_limit_cents=16576 (exactly one quote total of headroom)."
            - "quote with two 9750 lines (total 16576), SENT, accepted once (now ORDERED, credit_used=16576, version=2)."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "GOLD", credit_limit_cents: 16576 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: ShopAdmin
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v1}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state priority 5 beats fiscal priority 10)"
            - "HTTP status == 409"

      - name: install_safety_beats_crew_temporal
        grounds:
          - validations[priority=6]
