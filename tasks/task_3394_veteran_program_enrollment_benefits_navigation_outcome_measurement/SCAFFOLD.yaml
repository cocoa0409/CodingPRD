    output: Placement
    side_effects:
      - "CONFIRM_MILESTONE: strict order ACTIVE -> MILESTONE_30 -> MILESTONE_90 -> MILESTONE_180 -> RETAINED; temporal gate start_date + milestone days"
      - "SEPARATE: requisition restore per calculations.requisition_restore"

  - method: POST
    path: "/veteran-services/community-events"
    description: "Create a community engagement event with capacity, accessibility seats and a travel budget"
    roles: [EventCoordinator]
    code: 201
    input: [name, starts_at, ends_at, capacity, accessibility_seat_count, travel_budget_cents]
    output: CommunityEvent
    side_effects: ["counters start at 0; travel_budget_remaining_cents := travel_budget_cents"]

  - method: GET
    path: "/veteran-services/community-events"
    description: "List community events with computed counters"
    roles: [EventCoordinator, IntakeCoordinator, ProgramMember]
    code: 200
    input: ["limit?", "offset?"]
    output: CommunityEvent[]
    side_effects: []

  - method: POST
    path: "/veteran-services/event-registrations"
    description: "Register a member for an event; seating logic decides CONFIRMED vs WAITLISTED; travel award computed on confirmation"
    roles: [EventCoordinator, IntakeCoordinator]
    code: 201
    input: [member_id, community_event_id, "accommodation_needs?", "travel_request_cents?"]
    output: EventRegistration
    side_effects:
      - "calculations.registration_seating; on CONFIRMED: counters and travel budget debited"
      - "member schedule overlap (half-open) rejected with ERR_EVENT_SCHEDULE_CONFLICT"

  - method: GET
    path: "/veteran-services/event-registrations"
    description: "List event registrations with filters (covers both FK reverse lookups)"
    roles: [EventCoordinator, IntakeCoordinator]
    code: 200
    input: ["member_id?", "community_event_id?", "status?", "limit?", "offset?"]
    output: EventRegistration[]
    side_effects: []

  - method: GET
    path: "/veteran-services/event-registrations/{registration_id}"
    description: "Get one event registration"
    roles: [EventCoordinator, IntakeCoordinator]
    code: 200
    input: []
    output: EventRegistration
    side_effects: []

  - method: POST
    path: "/veteran-services/event-registrations/{registration_id}/transition"
    description: "CANCEL (from CONFIRMED or WAITLISTED; a CONFIRMED cancel releases the seat, refunds the award, and runs waitlist promotion) or ATTEND (CONFIRMED -> ATTENDED once the event has started)"
    roles: [EventCoordinator, IntakeCoordinator]
    code: 200
    input: [action]
    output: EventRegistration
    side_effects:
      - "CANCEL from CONFIRMED: counters/budget restored, then calculations.waitlist_promotion"
      - "ATTEND requires clock >= event.starts_at (ERR_EVENT_NOT_STARTED)"

  - method: GET
    path: "/veteran-services/enrollments/{id}/surveys"
    description: "List an enrollment's outcome surveys (system-created waves)"
    roles: [IntakeCoordinator, OutcomeAnalyst]
    code: 200
    input: ["wave?", "limit?", "offset?"]
    output: OutcomeSurvey[]
    side_effects: []

  - method: POST
    path: "/veteran-services/surveys/{survey_id}/submit"
    description: "Submit survey responses while the wave window is open; ProgramMember may only submit their own enrollment's surveys"
    roles: [ProgramMember, IntakeCoordinator]
    code: 200
    input: [q1, q2, q3, q4, q5]
    output: OutcomeSurvey
    side_effects:
      - "survey OPEN -> SUBMITTED; wellbeing_score computed; submitted_at stamped"

  - method: POST
    path: "/veteran-services/donor-reports"
    description: "Generate an immutable donor outcome report for a period under a methodology (ITT or COMPLETER)"
    roles: [OutcomeAnalyst]
    code: 201
    input: [period_start, period_end, methodology, "track_weights?"]
    output: DonorReport
    side_effects: ["calculations.program_effect_reporting; report is immutable once created"]

  - method: GET
    path: "/veteran-services/donor-reports/{report_id}"
    description: "Get a donor report"
    roles: [OutcomeAnalyst]
    code: 200
    input: []
    output: DonorReport
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog (38 codes)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, out-of-enum value, out-of-range number, bad datetime, end-before-start interval, or track_weights not summing to 1.0" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is authenticated but not in the endpoint's role list" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "Entity-backed identity mismatch: ProgramMember acting on another member's resource, or ClinicalPartner transitioning a referral matched to a different site" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The BenefitsOfficer deciding an appeal is the same X-User-ID that issued the claim's standing decision" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member_id path or body reference does not exist" }
  - { id: ERR_ELIGIBILITY_CASE_NOT_FOUND, http: 404, condition: "case_id path reference does not exist" }
  - { id: ERR_PROGRAM_TRACK_NOT_FOUND, http: 404, condition: "program_track_id body reference does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollment_id path reference does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim_id path or body reference does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal_id path reference does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referral_id path reference does not exist" }
  - { id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "employer_partner_id body reference does not exist" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "placement_id path reference does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "community_event_id body reference does not exist" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "registration_id path reference does not exist" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "survey_id path reference does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "report_id path reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure: transition not defined from the current state (incl. terminal lockdown), assessment on a terminal enrollment, survey submission outside OPEN, milestone out of order" }
  - { id: ERR_MEMBER_NOT_VERIFIED, http: 409, condition: "Enrollment, claim, or referral creation attempted while Member.verification_status != VERIFIED" }
  - { id: ERR_ELIGIBILITY_CRITERIA_NOT_MET, http: 409, condition: "VERIFIED decision requested with verified_service_era != POST_911, or a VETERAN with verified_injury_connection != SERVICE_CONNECTED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_version does not match the Member's current version (OCC)" }
  - { id: ERR_EXTERNAL_SERVICE_CONFLICT, http: 409, condition: "An ACTIVE ExternalServiceRecord covers the same service category and coordination_consent is not true" }
  - { id: ERR_CLAIM_NOT_APPEALABLE, http: 409, condition: "Appeal creation while the claim is not in DECIDED (FILED, APPEAL_PENDING, or CLOSED)" }
  - { id: ERR_CLAIM_TYPE_NOT_APPEALABLE, http: 409, condition: "Appeal creation on a HEALTHCARE_ACCESS claim" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal creation later than claim.decided_at + APPEAL_WINDOW_DAYS (window end itself is inclusive)" }
  - { id: ERR_MILESTONE_TOO_EARLY, http: 422, condition: "Milestone confirmation before start_date + the milestone's day count (the exact day is allowed)" }
  - { id: ERR_EVENT_NOT_STARTED, http: 422, condition: "ATTEND while the logical clock is before event.starts_at" }
  - { id: ERR_TREATMENT_WINDOW_CONFLICT, http: 409, condition: "New referral's buffered closed window intersects another non-terminal referral of the same member" }
  - { id: ERR_INTENSITY_TIER_INSUFFICIENT, http: 409, condition: "Referral creation without a MENTAL_HEALTH-track enrollment in {ACTIVE, SUSPENDED} whose intensity_tier == INTENSIVE" }
  - { id: ERR_EVENT_SCHEDULE_CONFLICT, http: 409, condition: "Member already holds a CONFIRMED or WAITLISTED registration for an event whose half-open interval intersects the new event" }
  - { id: ERR_NO_ACTIVE_CAREER_ENROLLMENT, http: 409, condition: "Placement creation without a CAREER-track Enrollment in status ACTIVE" }
  - { id: ERR_TRACK_CAPACITY_REACHED, http: 409, condition: "ProgramTrack.active_enrollment_count == capacity at enrollment creation" }
  - { id: ERR_NO_OPEN_REQUISITIONS, http: 409, condition: "EmployerPartner.open_requisitions == 0 at placement creation" }
  - { id: ERR_DUPLICATE_TRACK_CODE, http: 409, condition: "ProgramTrack creation with a track_code already in use" }
  - { id: ERR_EMPTY_COHORT, http: 422, condition: "DonorReport whose counted cohort is empty in every track" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns configuration and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /veteran-services/_clock/set_current_utc"
      - "POST /veteran-services/program-tracks"
      - "POST /veteran-services/partner-sites"
    shared_operations:
      - "GET /veteran-services/program-tracks"
      - "GET /veteran-services/partner-sites"

  - name: IntakeCoordinator
    description: "Registration and enrollment operations staff"
    identity: opaque
    exclusive_operations:
      - "POST /veteran-services/members"
      - "POST /veteran-services/eligibility-cases and eligibility-cases/{id}/transition"
      - "POST /veteran-services/external-service-records"
      - "POST /veteran-services/enrollments, assessments, enrollment transitions"
      - "POST /veteran-services/referrals"
    shared_operations:
      - "GET reads on members, eligibility cases, external records, enrollments, assessments, claims, referrals, partner sites, events, registrations, surveys"
      - "POST /veteran-services/event-registrations and their transitions (shared with EventCoordinator)"
      - "POST /veteran-services/surveys/{id}/submit (shared with ProgramMember — phone intake)"

  - name: AccreditedRepresentative
    description: "Accredited benefits representative assisting with disability claims and appeals"
    identity: opaque
    exclusive_operations:
      - "POST /veteran-services/claims"
      - "POST /veteran-services/appeals"
    shared_operations:
      - "GET /veteran-services/members/{id}, members/{id}/claims, claims/{id}, claims/{id}/appeals (shared with BenefitsOfficer)"

  - name: BenefitsOfficer
    description: "Adjudicator for claim decisions and appeal decisions; segregation of duties bars an officer from deciding an appeal against their own decision"
    identity: opaque
    exclusive_operations:
      - "POST /veteran-services/claims/{id}/decide"
      - "POST /veteran-services/appeals/{id}/decide"
    shared_operations:
      - "GET /veteran-services/members/{id}, members/{id}/claims, claims/{id}, claims/{id}/appeals"

  - name: ClinicalPartner
    description: "Staff of an intensive outpatient PartnerSite; X-User-ID equals the PartnerSite id"
    identity: "entity_backed:PartnerSite"
    exclusive_operations:
      - "POST /veteran-services/referrals/{id}/transition (ADMIT / DISCHARGE; own site's referrals only)"
    shared_operations:
      - "GET /veteran-services/referrals, referrals/{id}, partner-sites"

  - name: CareerCounselor
    description: "Career counseling staff managing employer partnerships and placements"
    identity: opaque
    exclusive_operations:
      - "POST /veteran-services/employer-partners"
      - "POST /veteran-services/placements and placements/{id}/transition"
    shared_operations:
      - "GET /veteran-services/enrollments, enrollments/{id}, program-tracks, members/{id}"

  - name: EventCoordinator
    description: "Community engagement staff"
    identity: opaque
    exclusive_operations:
      - "POST /veteran-services/community-events"
    shared_operations:
      - "GET /veteran-services/community-events, event-registrations, event-registrations/{id}, members/{id}"
      - "POST /veteran-services/event-registrations and their transitions (shared with IntakeCoordinator)"

  - name: OutcomeAnalyst
    description: "Measurement and donor reporting staff"
    identity: opaque
    exclusive_operations:
      - "POST /veteran-services/donor-reports"
      - "GET /veteran-services/donor-reports/{id}"
    shared_operations:
      - "GET reads on members, enrollments, assessments, surveys, placements, program-tracks"

  - name: ProgramMember
    description: "A registered veteran or family support member acting on their own records; X-User-ID equals the Member id"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET /veteran-services/members/{id} (self only)"
      - "GET /veteran-services/members/{id}/eligibility-cases (self only)"
      - "GET /veteran-services/community-events"
      - "POST /veteran-services/surveys/{id}/submit (own enrollment's surveys only)"
