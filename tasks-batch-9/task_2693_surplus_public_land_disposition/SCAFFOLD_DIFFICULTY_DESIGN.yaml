  - rule_id: compensating_invariant
    instances:
      - name: bid_withdrawal_restores_bidder_liquid_plus_escrow_total
        grounds:
          - state_machines.Bid.SUBMITTED_to_WITHDRAWN
          - state_machines.Bid.HELD_to_RELEASED
          - entities.Bidder.fields.available_funds_cents
          - entities.Bidder.fields.escrow_held_cents
          - entities.Bidder.fields.lifetime_deposits_cents
          - endpoints[POST /bids/{id}/withdraw]
        distinguishing_aspect: |
          The conserved quantity is a SINGLE BIDDER's cash position:
          available_funds_cents + escrow_held_cents must equal
          lifetime_deposits_cents at every observable instant while no deposit
          has been applied. Submitting the bid moves 4987500 from available into
          escrow and withdrawing it moves exactly the same 4987500 back, so the
          sum is 10000000 before, during and after, and lifetime_deposits_cents
          never moves at all (it counts funding credits only, not escrow
          transfers). The compensating action is therefore a pure transfer, not
          a credit - the naive implementation that credits available_funds_cents
          on release without debiting escrow_held_cents inflates the total to
          14987500 and is caught.
        test_recipe:
          setup:
            - "One custodian Agency, one TRANSIT Agency that DECLINES its notice, one Parcel, one CURED TitleCurativeItem at 250000, one ACCEPTED Appraisal at 100000000, so minimum_price_cents is 99750000 and required_deposit_cents is 4987500."
            - "A PUBLISHED COMPETITIVE_SALE offering over [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z)."
            - "One CLEAR Bidder funded exactly 10000000, so lifetime_deposits_cents is 10000000."
            - "The logical clock stays at the default 2026-08-01T00:00:00Z, inside the bidding window, so the withdrawal is permitted."
