# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_3405_industrial_product_stewardship_converter_distributor_network
# 9 rules x 2 instances = 18 instances. Every setup chain replays against
# §1.5 endpoints from empty-DB; all numeric asserts are pre-computed literals.
# Shared setup steps are anchored (&c_...) on first use and referenced (*c_...)
# afterwards; each test_recipe still runs against a fresh empty database.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: rebate_provisional_includes_flagged_vs_final_rebaselines
        grounds:
          - calculations.rebate_accrual_amount
          - entities.RebateAccrual.fields.provisional_amount_cents
          - entities.RebateAccrual.fields.final_amount_cents
          - state_machines.RebateAccrual.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Dual variant on the RebateAccrual entity domain: the provisional variant
          counts every SHIPPED order including FLAGGED ones (70000c), while the
          final variant at program close excludes the FLAGGED order AND re-baselines
          the chronological cumulative quantity, dropping the surviving order into
          the lowest bracket (10000c instead of its provisional 30000c).
        test_recipe:
          setup:
            - "Clock at 2026-10-01. Formulation F-100 ACTIVE with CLEARED clearance in DE (zero components -> required disclosure EXEMPT)."
            - "Distributor with STANDARD agreement (base 10000c, window [2026-10-01, 2027-01-01)) and rebate program tiers [{0,0.01},{100,0.02},{300,0.04}], period [2026-10-01, 2027-01-01)."
            - "O1 qty 250 lot L-X SHIPPED; O2 qty 100 lot L-Y SHIPPED; O1 later FLAGGED by a confirmed counterfeit report before close."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_jur_de
              call: "POST /stewardship/jurisdictions"
              payload: { code: "DE", name: "Germany", declaration_threshold_ppm: 1000, full_disclosure_threshold_ppm: 10000 }
              as: PlatformAdmin
              captures: { jur_de: $.data.id }
            - &c_form100
              call: "POST /stewardship/formulations"
              payload: { product_code: "F-100", name: "Acrylic foam base", base_polymer_family: "acrylic" }
              as: ProductManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - &c_clear_exempt
              call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "EXEMPT" }
              as: ProductManager
              captures: { cl_id: $.data.id }
            - &c_decide_clear
              call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
            - &c_dist1
              call: "POST /stewardship/distributors"
              payload: { name: "DistribOne GmbH", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { dist_id: $.data.id }
            - &c_ag_dist_std
              call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "STANDARD", base_price_cents: 10000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - &c_prog_dist
              call: "POST /stewardship/rebate-programs"
              payload: { formulation_id: "${f_id}", partner_type: "DISTRIBUTOR", distributor_id: "${dist_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", rebate_tiers: [{ threshold_qty: 0, rate_pct: 0.01 }, { threshold_qty: 100, rate_pct: 0.02 }, { threshold_qty: 300, rate_pct: 0.04 }], budget_cap_cents: 100000000 }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { prog_id: $.data.id }
            - &c_prog_activate
              call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "GET /stewardship/rebate-accruals"
              payload: { program_id: "${prog_id}" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { acc_id: "$.data[0].id" }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 250, requested_ship_date: "2026-11-01T00:00:00Z", lot_code: "L-X", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { o1_id: $.data.id }
            - call: "GET /stewardship/price-agreements/${ag_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag_v2: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 100, requested_ship_date: "2026-11-02T00:00:00Z", lot_code: "L-Y", expected_price_agreement_version: "${ag_v2}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /stewardship/orders/${o1_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${o1_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${o2_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${o2_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /stewardship/rebate-accruals/${acc_id}"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
              captures: { acc_prov_at_ship: $.data.provisional_amount_cents }
            - call: "POST /stewardship/counterfeit-reports"
              payload: { formulation_id: "${f_id}", lot_code: "L-X", channel_description: "gray-market reel lot" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /stewardship/counterfeit-reports/${rep_id}/disposition"
              payload: { outcome: "CONFIRMED_COUNTERFEIT" }
              as: QualityAuditor
              as_user_id: "qa-9"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
          assert:
            - "Order.${o1_id}.line_total_cents == 2500000 and Order.${o2_id}.line_total_cents == 1000000"
            - "RebateAccrual.${acc_id}.provisional_amount_cents == 70000 after both ships (O1 40000 = 100x10000x0.01 + 150x10000x0.02; O2 30000 = 50x10000x0.02 + 50x10000x0.04)"
            - "after disposition: Order.${o1_id}.compliance_status == FLAGGED and Order.${o2_id}.compliance_status == CLEAR"
            - "after disposition: RebateAccrual.${acc_id}.excluded_order_count == 1 and provisional_amount_cents still == 70000 (provisional variant counts FLAGGED shipped orders)"
            - "after close: RebateAccrual.${acc_id}.status == FINALIZED and final_amount_cents == 10000 (final variant drops O1 and re-baselines O2 to the [0,100) bracket: 100x10000x0.01)"
            - "RebateAccrual.${acc_id}.final_amount_cents != RebateAccrual.${acc_id}.provisional_amount_cents"

      - name: adhesion_nominal_passes_where_application_derated_fails
        grounds:
          - calculations.adhesion_pass_evaluation
          - entities.ApplicationCase.fields.pass_threshold_applied
          - state_machines.ApplicationCase.LAB_BOOKED_to_CLOSED_PASS
          - state_machines.ApplicationCase.LAB_BOOKED_to_CLOSED_FAIL
        distinguishing_aspect: |
          Dual variant on the ApplicationCase entity domain: identical peel 15.5
          N/25mm on METAL at 43C passes under the NOMINAL variant (threshold 15.0)
          but fails under the APPLICATION_DERATED variant (threshold 15.0 x 1.06 =
          15.9), because only the derated variant scales the threshold by
          floor(|43-23|/10) = 2 steps of 3%.
        test_recipe:
          setup:
            - "Clock at 2026-10-01. Formulation F-100 ACTIVE with CLEARED clearance in DE."
            - "Two METAL application cases C1 and C2, both lab-booked on bench B1 for 2026-10-05."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-1", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { c1_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-2", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { c2_id: $.data.id }
            - call: "POST /stewardship/application-cases/${c1_id}/book-lab"
              payload: { bench_id: "B1", bench_date: "2026-10-05T00:00:00Z", bench_hours: 2.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${c2_id}/book-lab"
              payload: { bench_id: "B1", bench_date: "2026-10-05T00:00:00Z", bench_hours: 2.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
          trigger:
            - call: "POST /stewardship/application-cases/${c1_id}/record-result"
              payload: { peel_strength_n_per_25mm: 15.5, test_temp_c: 43, test_standard: "NOMINAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${c2_id}/record-result"
              payload: { peel_strength_n_per_25mm: 15.5, test_temp_c: 43, test_standard: "APPLICATION_DERATED" }
              as: TechnicalEngineer
              as_user_id: "te-1"
          assert:
            - "ApplicationCase.${c1_id}.status == CLOSED_PASS and pass_threshold_applied == 15.0"
            - "ApplicationCase.${c2_id}.status == CLOSED_FAIL and pass_threshold_applied == 15.9"
            - "ApplicationCase.${c1_id}.failure_count == 0 and ApplicationCase.${c2_id}.failure_count == 1"
            - "identical peel 15.5 diverges solely by test_standard (15.5 >= 15.0 but 15.5 < 15.9)"

  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_average_rate_tier_plus_best_breakpoint
        grounds:
          - calculations.order_unit_price
          - entities.Order.fields.unit_price_cents
          - entities.Order.fields.line_total_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (tier constant, two volume
          breakpoints, quantity) with non-linear breakpoint SELECTION — the single
          best eligible breakpoint discounts the whole quantity (average-rate,
          pinned), so qty 300 prices at 0.18+0.05=0.23 off (unit 15400c) while
          qty 249 misses the 250-breakpoint and prices at 0.18+0.02=0.20 off
          (unit 16000c).
        test_recipe:
          setup:
            - "Clock at 2026-10-01. Formulation ACTIVE with CLEARED DE clearance."
            - "Converter AUTHORIZED with SLITTING authorization covering DE in [2026-10-01, 2027-04-01)."
            - "Agreement: CONVERTER_AUTHORIZED tier, base 20000c, breakpoints [{100,0.02},{250,0.05}], window [2026-10-01, 2027-01-01)."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - &c_conv_applied
              call: "POST /stewardship/converters"
              payload: { name: "ConvertOne GmbH", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_id: $.data.id }
            - &c_conv_audit
              call: "POST /stewardship/converters/${conv_id}/record-audit"
              payload: { audit_score: 80, audit_standard: "ISO9001" }
              as: QualityAuditor
              as_user_id: "qa-1"
            - &c_conv_authorize
              call: "POST /stewardship/converters/${conv_id}/authorize"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_v: $.data.version }
            - &c_authz_slit_de
              call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "SLITTING", territory_code: "DE", valid_from: "2026-10-01T00:00:00Z", valid_to: "2027-04-01T00:00:00Z", expected_converter_version: "${conv_v}" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", converter_id: "${conv_id}", tier: "CONVERTER_AUTHORIZED", base_price_cents: 20000, volume_breakpoints: [{ min_qty: 100, extra_discount_pct: 0.02 }, { min_qty: 250, extra_discount_pct: 0.05 }], effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { agc_id: $.data.id, agc_v: $.data.version }
          trigger:
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${agc_id}", converter_id: "${conv_id}", quantity: 300, requested_ship_date: "2026-11-01T00:00:00Z", intended_capability: "SLITTING", expected_price_agreement_version: "${agc_v}" }
              as: Converter
              as_user_id: "${conv_id}"
              captures: { o_big: $.data.id }
            - call: "GET /stewardship/price-agreements/${agc_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { agc_v2: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${agc_id}", converter_id: "${conv_id}", quantity: 249, requested_ship_date: "2026-11-01T00:00:00Z", intended_capability: "SLITTING", expected_price_agreement_version: "${agc_v2}" }
              as: Converter
              as_user_id: "${conv_id}"
              captures: { o_small: $.data.id }
          assert:
            - "Order.${o_big}.unit_price_cents == 15400 and line_total_cents == 4620000 (20000 x (1-0.23) rounded once at unit)"
            - "Order.${o_small}.unit_price_cents == 16000 and line_total_cents == 3984000 (20000 x (1-0.20); 249 misses the 250 breakpoint)"
            - "Order.${o_big}.fulfillment_status == PENDING and compliance_status == CLEAR"

      - name: rebate_rounding_per_order_per_tier_then_sum
        grounds:
          - calculations.rebate_accrual_amount
          - entities.RebateAccrual.fields.provisional_amount_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned — each order's
          per-tier portion rounds half-up to cents FIRST, then sums. Three orders
          of line_total 33333c at rate 0.01 give 333c each and a 999c accrual;
          the unpinned alternative (sum raw, round once) would give 1000c.
        test_recipe:
          setup:
            - "Clock at 2026-10-01. Formulation ACTIVE with CLEARED DE clearance."
            - "Distributor with STANDARD agreement base 1c; rebate program single tier [{0, 0.01}], period [2026-10-01, 2027-01-01)."
            - "Three orders of quantity 33333 each, all SHIPPED."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - *c_dist1
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "STANDARD", base_price_cents: 1, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag1c_id: $.data.id, ag1c_v: $.data.version }
            - call: "POST /stewardship/rebate-programs"
              payload: { formulation_id: "${f_id}", partner_type: "DISTRIBUTOR", distributor_id: "${dist_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", rebate_tiers: [{ threshold_qty: 0, rate_pct: 0.01 }], budget_cap_cents: 100000000 }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { prog1c_id: $.data.id }
            - call: "POST /stewardship/rebate-programs/${prog1c_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "GET /stewardship/rebate-accruals"
              payload: { program_id: "${prog1c_id}" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { acc1c_id: "$.data[0].id" }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag1c_id}", distributor_id: "${dist_id}", quantity: 33333, requested_ship_date: "2026-11-01T00:00:00Z", expected_price_agreement_version: "${ag1c_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { r1: $.data.id }
            - call: "GET /stewardship/price-agreements/${ag1c_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag1c_v2: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag1c_id}", distributor_id: "${dist_id}", quantity: 33333, requested_ship_date: "2026-11-02T00:00:00Z", expected_price_agreement_version: "${ag1c_v2}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { r2: $.data.id }
            - call: "GET /stewardship/price-agreements/${ag1c_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag1c_v3: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag1c_id}", distributor_id: "${dist_id}", quantity: 33333, requested_ship_date: "2026-11-03T00:00:00Z", expected_price_agreement_version: "${ag1c_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { r3: $.data.id }
            - call: "POST /stewardship/orders/${r1}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${r1}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${r2}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${r2}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${r3}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${r3}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "GET /stewardship/rebate-accruals/${acc1c_id}"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
          assert:
            - "each order line_total_cents == 33333 (unit 1c x 33333)"
            - "RebateAccrual.${acc1c_id}.provisional_amount_cents == 999 (333.33 rounds to 333 per order, summed; NOT round(999.99)=1000)"
            - "RebateAccrual.${acc1c_id}.status == PROVISIONAL"

  - rule_id: non_linear_state_machine
    instances:
      - name: clearance_changes_requested_resubmission_cycle
        grounds:
          - state_machines.JurisdictionClearance
          - state_machines.JurisdictionClearance.CHANGES_REQUESTED_to_SUBMITTED
          - calculations.required_disclosure_level
        distinguishing_aspect: |
          Cyclic machine on JurisdictionClearance: SUBMITTED -> CHANGES_REQUESTED
          -> SUBMITTED (via pair-keyed resubmission upsert) -> CLEARED, with
          submission_count incrementing per loop and the parent Formulation
          bubble-up to ACTIVE firing only at the terminal CLEARED leg.
        test_recipe:
          setup:
            - "Clock at 2026-10-01. Jurisdiction DE (declaration 1000 ppm, full 10000 ppm). RESTRICTED substance registered."
            - "Formulation F-200 with a 5000 ppm RESTRICTED component (required disclosure DECLARATION)."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { sub_r: $.data.id }
            - call: "POST /stewardship/formulations"
              payload: { product_code: "F-200", name: "Solvent adhesive", base_polymer_family: "solvent" }
              as: ProductManager
              captures: { f2_id: $.data.id }
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f2_id}", substance_id: "${sub_r}", concentration_ppm: 5000 }
              as: ProductManager
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f2_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "EXEMPT" }
              as: ProductManager
              captures: { cl2_id: $.data.id }
            - call: "POST /stewardship/clearances/${cl2_id}/decision"
              payload: { decision: "CHANGES_REQUESTED", reviewer_note: "package too thin for a RESTRICTED 5000ppm component" }
              as: RegulatoryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f2_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "FULL_DISCLOSURE" }
              as: ProductManager
              captures: { cl2_after: $.data.id, cl2_subs: $.data.submission_count }
            - call: "POST /stewardship/clearances/${cl2_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-2"
          assert:
            - "first submission returned 201 with JurisdictionClearance.${cl2_id}.required_disclosure_level == DECLARATION (5000 in [1000,10000))"
            - "after CHANGES_REQUESTED: status == CHANGES_REQUESTED and Formulation.${f2_id}.status still DRAFT"
            - "resubmission returns 200 (not 201) on the same row: ${cl2_after} == ${cl2_id}, status back to SUBMITTED, submission_count == 2, disclosure_package_level == FULL_DISCLOSURE"
            - "after CLEARED: status == CLEARED and Formulation.${f2_id}.status == ACTIVE with active_clearance_count == 1"

      - name: order_fulfillment_and_compliance_axes_move_independently
        grounds:
          - state_machines.Order
          - entities.Order.fields.compliance_status
          - errors.ERR_ORDER_COMPLIANCE_BLOCKED
        distinguishing_aspect: |
          Parallel state dimensions on Order: a counterfeit confirmation flips
          compliance CLEAR -> FLAGGED while fulfillment stays ALLOCATED; the
          ALLOCATED -> SHIPPED advance is then blocked (ERR_ORDER_COMPLIANCE_BLOCKED)
          without touching fulfillment, and a later cancel moves fulfillment to
          CANCELLED while compliance remains FLAGGED.
        test_recipe:
          setup:
