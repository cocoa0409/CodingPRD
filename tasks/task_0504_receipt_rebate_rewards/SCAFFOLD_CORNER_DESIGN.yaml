              as: Member
              as_user_id: "${sv2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: ledger_entry_recorded_on_claim_create
        claim_type: derived_field_reconciliation
