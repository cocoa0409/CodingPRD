      CHECK_IN is the one duty transition whose precondition is a DIFFERENT dimension's state, and the scaffold deliberately carves it out of the generic priority-12 rule: a CONFIRMED row sitting at PENDING_BRIEF must be refused with the domain-specific ERR_GUARD_NOT_BRIEFED (the guard never acknowledged the event-specific training and radio channel), and the same call must succeed the moment the brief is recorded.
