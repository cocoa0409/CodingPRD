          assert:
            - "${e_month} == ERR_POSTED_MONTH_NOT_FOUND with HTTP 404"
            - "RentalContract.${c_id}.posted_month_count is still 1 and lifetime_paid_cents is still 5590"
            - "posted_months still holds exactly one element with service_month \"2026-08\", and last_posted_service_month is still \"2026-08\""
            - "The priority-16 existence check on the path month precedes the priority-96 cap-clearing check, so a month absent from the array never reaches the fiscal rule"

      - name: missing_required_fields_rejected_on_create
        claim_type: required_fields
        grounds:
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /home-oxygen/patients]
          - endpoints[POST /home-oxygen/equipment-units]
          - endpoints[POST /home-oxygen/delivery-routes]
        distinguishing_aspect: |
          Fields declared in §1.5 input WITHOUT a trailing "?" are unconditionally required; omitting
          exactly one of them per request isolates the check from every other rule, and the 400 must
          land before any existence or business validation runs.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) so that every supplied foreign key in the rejected calls is itself valid."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/patients"
              payload: { full_name: "Eli Prakash", branch_id: "${br_id}", payer_type: "MEDICAID", mobility_profile: "HOMEBOUND" }
              as: IntakeCoordinator
              captures: { e_mrn: $.data.error_id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0 }
              as: BranchManager
              captures: { e_pm: $.data.error_id }
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { e_drv: $.data.error_id }
            - call: "POST /home-oxygen/branches"
              payload: { state_code: "FL" }
              as: BranchManager
              captures: { e_name: $.data.error_id }
          assert:
            - "${e_mrn} == ERR_INVALID_REQUEST (400) — mrn is declared required on POST /home-oxygen/patients"
            - "${e_pm} == ERR_INVALID_REQUEST (400) — next_pm_due_date is required while max_pulse_setting and pm_interval_days are optional with defaults 0 and 365"
            - "${e_drv} == ERR_INVALID_REQUEST (400) — driver_user_id is required on POST /home-oxygen/delivery-routes"
            - "${e_name} == ERR_INVALID_REQUEST (400) — name is required on POST /home-oxygen/branches"
            - "GET /home-oxygen/patients?branch_id=${br_id} reports total_count 0 and GET /home-oxygen/equipment-units?branch_id=${br_id} reports total_count 0: a rejected create persists nothing"

      - name: omitted_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Branch.fields.competitive_bid_area
          - entities.Branch.fields.refill_capacity_per_day
          - entities.Branch.fields.tank_exchange_buffer_minutes
          - entities.Patient.fields.altitude_feet
          - entities.EquipmentUnit.fields.max_pulse_setting
          - entities.EquipmentUnit.fields.pm_interval_days
        distinguishing_aspect: |
          Every optional input with a declared default is omitted at once, so the response must
          show the §1.1 default rather than null: branch buffer 30 and capacity 4 in particular are
          the values later rules (priorities 74 and 86) read.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Ocala", state_code: "FL" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0230", full_name: "Fern Okoro", branch_id: "${br_id}", payer_type: "COMMERCIAL", mobility_profile: "HOMEBOUND" }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_id: $.data.id }
          assert:
            - "Branch.${br_id}: competitive_bid_area == false, liquid_oxygen_certified == false, refill_capacity_per_day == 4, tank_exchange_buffer_minutes == 30"
            - "Patient.${p_id}: altitude_feet == 0, status == ACTIVE, current_cmn_status == NONE, compliance_hold == false"
            - "EquipmentUnit.${u_id}: max_pulse_setting == 0, pm_interval_days == 365, status == IN_STOCK, quarantine_reason == NONE, replaces_unit_id == null, recall_remediated_at == null"
            - "No default is reported as null and none is reported as the string \"0\" — the declared JSON types are honoured"

      - name: computed_and_system_field_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Patient.fields.oxygen_safety_risk_score
          - entities.Patient.fields.status
          - entities.CertificateOfMedicalNecessity.fields.documentation_score
          - entities.CertificateOfMedicalNecessity.fields.status
          - validations[priority=17]
        distinguishing_aspect: |
          Fields whose source is system or computed are ignored when a client sends them (priority 17
          says so explicitly, so this is NOT a 400): the created row must carry the server's computed
          value, and a client-chosen status must not short-circuit the state machine.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL), one ACTIVE patient and one GROUP_I study; the clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0240", full_name: "Gia Lund", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}", status: "ACTIVE", documentation_score: 12.5, revision_round: 7, signed_by_user_id: "u-phys-1", recert_due_date: "2030-01-01" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
          assert:
            - "HTTP 201: the five undeclared computed/system keys in the body are silently discarded rather than rejected, because priority 17 checks only that the declared required inputs are present"
            - "CertificateOfMedicalNecessity.${cmn_id}.status == DRAFT — the declared initial_state, not the client-supplied ACTIVE"
            - "documentation_score == 100.00, computed from the six components (30 + 20 + 15 + 20 + 10 + 5) rather than accepted from the request"
            - "revision_round == 0, correction_notes == null, void_reason == null, submitted_by_user_id == null, signed_by_user_id == null, audited_by_user_id == null"
            - "physician_signature_date == null, initial_date == null and recert_due_date == null: all three are stamped later, by the sign and approve transitions"
            - "Patient.${p_id}.current_cmn_status == DRAFT — the patient's mirror of the certificate status is server-maintained"

      - name: system_identifiers_and_timestamps_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.Patient
          - response_envelope.success
          - endpoints[POST /home-oxygen/_clock/set_current_utc]
        distinguishing_aspect: |
          id, created_at, updated_at and version come from the server, and created_at/updated_at
          come from the LOGICAL clock: a row created after the clock advances must carry the new
          clock value, which is what makes every temporal rule in §1.4 testable.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) created at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:30:00Z" }
              as: BranchManager
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0250", full_name: "Hana Iqbal", branch_id: "${br_id}", payer_type: "MEDICAID", mobility_profile: "HOMEBOUND", altitude_feet: 0 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
            - call: "PATCH /home-oxygen/patients/${p_id}"
              payload: { full_name: "Hana Iqbal-Reyes" }
              as: IntakeCoordinator
          assert:
            - "The clock response reports current_utc \"2026-08-04T09:30:00Z\", previous_utc \"2026-08-01T00:00:00Z\", expired_cmn_count 0 and suspended_contract_count 0 (no certificate exists yet)"
            - "Patient.${p_id}.created_at == updated_at == 2026-08-04T09:30:00Z and version == 1"
            - "Branch.${br_id}.created_at is still 2026-08-01T00:00:00Z: advancing the clock never restamps existing rows"
            - "After the PATCH: Patient.${p_id}.version == 2, updated_at == 2026-08-04T09:30:00Z, created_at unchanged, and id identical to the create response"

      - name: invalid_enum_values_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=18]
          - errors[ERR_INVALID_ENUM_VALUE]
          - entities.Patient.fields.payer_type
          - entities.EquipmentUnit.fields.equipment_class
          - entities.RouteStop.fields.stop_type
        distinguishing_aspect: |
          Enum membership is checked on request bodies AND on GET list filters, and it is checked at
          priority 18 — before any existence lookup — so a body carrying both an unknown enum and an
          unresolvable foreign key returns the enum error.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL)."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0260", full_name: "Ivo Marek", branch_id: "${br_id}", payer_type: "TRICARE", mobility_profile: "HOMEBOUND" }
              as: IntakeCoordinator
              captures: { e_payer: $.data.error_id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "00000000-0000-0000-0000-0000000000ff", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "HELIOX_TANK", max_continuous_lpm: 5.0, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { e_class: $.data.error_id }
            - call: "GET /home-oxygen/equipment-units?status=BROKEN"
              payload: { status: "BROKEN" }
              as: BranchManager
              captures: { e_filter: $.data.error_id }
          assert:
            - "${e_payer} == ERR_INVALID_ENUM_VALUE (400): payer_type accepts only MEDICARE_COMPETITIVE_BID, MEDICARE_NON_BID, MEDICAID, COMMERCIAL"
            - "${e_class} == ERR_INVALID_ENUM_VALUE (400) and NOT ERR_BRANCH_NOT_FOUND, because priority 18 precedes priority 20 even though the branch id in that same body is unresolvable"
            - "${e_filter} == ERR_INVALID_ENUM_VALUE (400) on a GET list filter, not an empty 200 array"
            - "No row is created by any of the three calls"

      - name: duplicate_mrn_and_duplicate_serial_number_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - errors[ERR_DUPLICATE_MRN]
          - errors[ERR_DUPLICATE_SERIAL_NUMBER]
        distinguishing_aspect: |
          Both natural keys are global rather than branch-scoped: re-using an mrn or a serial_number
          at a DIFFERENT branch is still a conflict, which is what makes patient transfer and fleet
          moves unambiguous.
        test_recipe:
          setup:
            - "Two branches (Tampa Bay and Sarasota, both FL), one patient MRN-0270 at Tampa Bay and one unit SC-1001 at Tampa Bay."
          setup_api_calls:
