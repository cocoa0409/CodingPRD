              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/estimated-payments/generate-schedule"
