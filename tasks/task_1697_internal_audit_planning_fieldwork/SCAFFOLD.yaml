# =============================================================================
# PRD Benchmark Scaffold — Internal Audit Planning & Fieldwork Management
# =============================================================================

scenario: |
  Internal Audit Planning & Fieldwork Management (corporate internal audit): audit universe & risk-based annual plan approval, engagement scoping & resource assignment, workpaper documentation & review sign-off, finding rating criteria & management response negotiation, report issuance & distribution, action-plan tracking with due-date extensions & validation, quality assurance & external assessment, audit committee reporting

domain_name: internal-audit-planning-fieldwork
api_prefix: /audit

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FKs via canonical prefix)
# =============================================================================
entities:
  - name: AuditableEntity
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Auditable unit name (business unit, process, site)" }
      - { name: business_owner, type: string, source: input, description: "Executive accountable for the unit" }
      - { name: regulatory_scrutiny, type: boolean, source: input, default: false, description: "True when the unit is under heightened regulatory scrutiny; selects CONSERVATIVE risk scoring" }
      - { name: last_audit_completed_at, type: datetime, source: input, description: "Date the previous audit closed; null when never audited (treated as infinite recency)", constraints: "optional" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED", constraints: "enum: ACTIVE, RETIRED" }
      - { name: retired_at, type: datetime, source: system, description: "Set on retire; null while ACTIVE", constraints: "nullable" }
      - { name: current_inherent_risk_score, type: integer, source: computed, description: "Inherent risk score of the latest FINALIZED RiskAssessment (max fiscal_year); null when none", constraints: "nullable; 20..100" }
      - { name: current_risk_tier, type: enum, source: computed, description: "Band derived from current_inherent_risk_score; null when no score", constraints: "nullable; enum: LOW, MODERATE, HIGH, CRITICAL" }

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - { name: auditable_entity_id, type: string, source: input, description: "FK -> AuditableEntity.id; unit being assessed" }
      - { name: fiscal_year, type: integer, source: input, description: "Assessment fiscal year" }
      - { name: likelihood, type: integer, source: input, description: "Likelihood 1..5", constraints: "1 <= likelihood <= 5" }
      - { name: impact, type: integer, source: input, description: "Impact 1..5", constraints: "1 <= impact <= 5" }
      - { name: scoring_variant, type: enum, source: computed, description: "WEIGHTED (default) | CONSERVATIVE (when entity.regulatory_scrutiny is true); pinned at creation", constraints: "enum: WEIGHTED, CONSERVATIVE" }
      - { name: inherent_risk_score, type: integer, source: computed, description: "WEIGHTED: 8*likelihood + 12*impact; CONSERVATIVE: 20*max(likelihood, impact)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED", constraints: "enum: DRAFT, FINALIZED" }
      - { name: finalized_at, type: datetime, source: system, description: "Set on finalize; null while DRAFT", constraints: "nullable" }

  - name: RatingCriteriaConfig
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Config label" }
      - { name: critical_min, type: integer, source: input, default: 20, description: "composite >= critical_min => CRITICAL", constraints: "1 <= moderate_min < high_min < critical_min <= 25" }
      - { name: high_min, type: integer, source: input, default: 12, description: "composite >= high_min => HIGH" }
      - { name: moderate_min, type: integer, source: input, default: 6, description: "composite >= moderate_min => MODERATE; else LOW" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED; exactly one ACTIVE at any time", constraints: "enum: DRAFT, ACTIVE, SUPERSEDED" }
      - { name: activated_at, type: datetime, source: system, description: "Set on activation; null otherwise", constraints: "nullable" }

  - name: AuditPlan
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Plan fiscal year" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | RETURNED | APPROVED | CLOSED", constraints: "enum: DRAFT, SUBMITTED, RETURNED, APPROVED, CLOSED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; used for segregation of duties at approve", constraints: "nullable" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the AuditCommittee approver", constraints: "nullable" }
      - { name: submitted_at, type: datetime, source: system, description: "Server timestamp of last submit", constraints: "nullable" }
      - { name: approved_at, type: datetime, source: system, description: "Server timestamp of approval", constraints: "nullable" }
      - { name: engagement_count, type: integer, source: computed, default: 0, description: "Count of Engagements with status != CANCELLED referencing this plan" }
      - { name: high_risk_coverage_pct, type: number, source: computed, default: 100.0, description: "Percent of ACTIVE AuditableEntities with current_inherent_risk_score >= 70 covered by >=1 non-CANCELLED engagement in this plan; 100.0 when the high-risk universe is empty" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: audit_plan_id, type: string, source: input, description: "FK -> AuditPlan.id; owning annual plan" }
      - { name: auditable_entity_id, type: string, source: input, description: "FK -> AuditableEntity.id; unit under audit" }
      - { name: supersedes_engagement_id, type: string, source: input, description: "FK -> Engagement.id; optional follow-up reference to a prior engagement", constraints: "optional; nullable" }
      - { name: title, type: string, source: input, description: "Engagement title" }
      - { name: scope_summary, type: string, source: input, description: "Narrative scope statement" }
      - { name: budget_hours, type: number, source: input, description: "Approved hour budget", constraints: "> 0" }
      - { name: start_date, type: datetime, source: input, description: "Planned fieldwork window start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Planned fieldwork window end (inclusive); must be > start_date" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | SCOPED | FIELDWORK | REPORTING | CLOSED | CANCELLED", constraints: "enum: PLANNED, SCOPED, FIELDWORK, REPORTING, CLOSED, CANCELLED" }
      - { name: reserved_hours, type: number, source: computed, default: 0, description: "Sum of allocated_hours over ACTIVE EngagementAssignments" }
      - { name: actual_hours, type: number, source: computed, default: 0, description: "Sum over SIGNED_OFF Workpapers of ceil(hours_worked*2)/2 (per-item rounding, then sum)" }
      - { name: provisional_hours, type: number, source: computed, default: 0, description: "Same rollup over Workpapers in {SUBMITTED, SIGNED_OFF}" }
      - { name: signed_off_workpaper_count, type: integer, source: computed, default: 0, description: "Count of Workpapers in SIGNED_OFF" }
      - { name: open_finding_count, type: integer, source: computed, default: 0, description: "Count of Findings not in FINAL" }
      - { name: qa_regression_count, type: integer, source: system, default: 0, description: "Increments each time a QA FAIL regresses the engagement REPORTING -> FIELDWORK" }
      - { name: priority_score, type: integer, source: computed, description: "min(100, entity_risk + recency_factor + 15*scrutiny); computed at creation" }
      - { name: utilization_final_pct, type: number, source: computed, description: "round(100 * actual_hours / budget_hours, 2) — final variant (SIGNED_OFF basis)" }
      - { name: utilization_provisional_pct, type: number, source: computed, description: "round(100 * provisional_hours / budget_hours, 2) — provisional variant (SUBMITTED + SIGNED_OFF basis)" }

  - name: Auditor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Auditor name" }
      - { name: grade, type: enum, source: input, description: "STAFF | SENIOR | MANAGER | DIRECTOR", constraints: "enum: STAFF, SENIOR, MANAGER, DIRECTOR" }
      - { name: skills, type: array, source: input, description: "Optional skill tags", constraints: "optional" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "enum: ACTIVE, INACTIVE" }

  - name: EngagementAssignment
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: auditor_id, type: string, source: input, description: "FK -> Auditor.id" }
      - { name: role_in_engagement, type: enum, source: input, description: "LEAD | STAFF | REVIEWER", constraints: "enum: LEAD, STAFF, REVIEWER" }
      - { name: start_date, type: datetime, source: input, description: "Assignment window start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Assignment window end (exclusive); must be > start_date" }
      - { name: allocated_hours, type: number, source: input, description: "Reserved hours", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED", constraints: "enum: ACTIVE, CANCELLED" }

  - name: Workpaper
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: reference, type: string, source: input, description: "Workpaper reference code (e.g., A-1)" }
      - { name: title, type: string, source: input, description: "Workpaper title" }
      - { name: preparer_auditor_id, type: string, source: system, description: "FK -> Auditor.id; captured from X-User-ID at creation" }
      - { name: reviewer_auditor_id, type: string, source: system, description: "FK -> Auditor.id; captured from X-User-ID at sign-off or return", constraints: "nullable" }
      - { name: hours_worked, type: number, source: input, description: "Hours documented", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | SIGNED_OFF | RETURNED", constraints: "enum: DRAFT, SUBMITTED, SIGNED_OFF, RETURNED" }
      - { name: review_note, type: string, source: system, description: "Reviewer note recorded on return", constraints: "nullable" }
      - { name: signed_off_at, type: datetime, source: system, description: "Set at sign-off; cleared on return", constraints: "nullable" }
      - { name: locked, type: boolean, source: system, default: false, description: "True once the engagement's report is ISSUED; locked workpapers reject all mutations" }

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: workpaper_id, type: string, source: input, description: "FK -> Workpaper.id; optional evidence link; must be SIGNED_OFF", constraints: "optional; nullable" }
      - { name: rating_criteria_config_id, type: string, source: system, description: "FK -> RatingCriteriaConfig.id; pinned to the ACTIVE config at creation (version pinning)" }
      - { name: title, type: string, source: input, description: "Finding title" }
      - { name: likelihood, type: integer, source: input, description: "Likelihood 1..5", constraints: "1 <= likelihood <= 5" }
      - { name: impact, type: integer, source: input, description: "Impact 1..5", constraints: "1 <= impact <= 5" }
      - { name: composite_score, type: integer, source: computed, description: "likelihood * impact (1..25)" }
      - { name: severity, type: enum, source: computed, description: "CRITICAL | HIGH | MODERATE | LOW per pinned config bands", constraints: "enum: LOW, MODERATE, HIGH, CRITICAL" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_RESPONSE | UNDER_REVIEW | AGREED | REBUTTED | ESCALATED | FINAL", constraints: "enum: DRAFT, PENDING_RESPONSE, UNDER_REVIEW, AGREED, REBUTTED, ESCALATED, FINAL" }
      - { name: negotiation_rounds, type: integer, source: system, default: 0, description: "Increments on each response rebuttal; rebuttal allowed only while < 3; escalation requires >= 3" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; used for segregation of duties at issue" }
      - { name: open_overdue_action_count, type: integer, source: computed, default: 0, description: "Count of this finding's ActionPlans with status != VALIDATED and days_overdue >= 1 (clock-based)" }
      - { name: finalized_at, type: datetime, source: system, description: "Set when the finding reaches FINAL at report issuance", constraints: "nullable" }

  - name: ManagementResponse
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> Finding.id" }
      - { name: responder_user_id, type: string, source: system, description: "X-User-ID of the ManagementOwner responder" }
      - { name: response_text, type: string, source: input, description: "Management's response narrative" }
      - { name: proposed_due_date, type: datetime, source: input, description: "Management's proposed remediation date" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | ACCEPTED | REBUTTED", constraints: "enum: SUBMITTED, ACCEPTED, REBUTTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the AuditManager who accepted or rebutted", constraints: "nullable" }

  - name: ActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> Finding.id" }
      - { name: description, type: string, source: input, description: "Remediation commitment" }
      - { name: owner_name, type: string, source: input, description: "Responsible management owner" }
      - { name: original_due_date, type: datetime, source: system, description: "Immutable copy of due_date at creation" }
      - { name: due_date, type: datetime, source: input, description: "Current committed due date; mutated only by APPROVED ExtensionRequests" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of APPROVED extensions; cap 2" }
      - { name: cumulative_extended_days, type: integer, source: system, default: 0, description: "Sum of approved day shifts in approval order; cap 180 (inclusive)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_PROGRESS | SUBMITTED_FOR_VALIDATION | VALIDATED", constraints: "enum: OPEN, IN_PROGRESS, SUBMITTED_FOR_VALIDATION, VALIDATED" }
      - { name: validated_by_user_id, type: string, source: system, description: "X-User-ID of the validating AuditManager", constraints: "nullable" }
      - { name: validated_at, type: datetime, source: system, description: "Set on validation", constraints: "nullable" }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: action_plan_id, type: string, source: input, description: "FK -> ActionPlan.id" }
      - { name: requested_due_date, type: datetime, source: input, description: "Proposed new due date; must be > current due_date" }
      - { name: reason, type: string, source: input, description: "Justification" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DENIED", constraints: "enum: PENDING, APPROVED, DENIED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding ChiefAuditExecutive", constraints: "nullable" }
      - { name: approved_days, type: integer, source: computed, description: "(requested_due_date - prior due_date).days at approval; null until APPROVED", constraints: "nullable" }

  - name: AuditReport
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: overall_conclusion, type: enum, source: input, description: "SATISFACTORY | NEEDS_IMPROVEMENT | UNSATISFACTORY", constraints: "optional; enum: SATISFACTORY, NEEDS_IMPROVEMENT, UNSATISFACTORY" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_APPROVAL | APPROVED | ISSUED | DISTRIBUTED", constraints: "enum: DRAFT, PENDING_APPROVAL, APPROVED, ISSUED, DISTRIBUTED" }
      - { name: issued_at, type: datetime, source: system, description: "Set at issuance", constraints: "nullable" }
      - { name: distributed_at, type: datetime, source: system, description: "Set at distribution", constraints: "nullable" }
      - { name: distribution_list, type: array, source: input, description: "Recipient list recorded at distribution", constraints: "nullable" }

  - name: QAReview
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: scope, type: enum, source: input, description: "INTERNAL | EXTERNAL", constraints: "enum: INTERNAL, EXTERNAL" }
      - { name: assessor_auditor_id, type: string, source: system, description: "FK -> Auditor.id; captured from X-User-ID at begin", constraints: "nullable" }
      - { name: doc_quality_score, type: integer, source: input, description: "Documentation quality 1..5 (at complete)", constraints: "1..5" }
      - { name: fieldwork_quality_score, type: integer, source: input, description: "Fieldwork quality 1..5 (at complete)", constraints: "1..5" }
      - { name: reporting_quality_score, type: integer, source: input, description: "Reporting quality 1..5 (at complete)", constraints: "1..5" }
      - { name: independence_score, type: integer, source: input, description: "Independence/objectivity 1..5 (at complete)", constraints: "1..5" }
      - { name: overall_score, type: number, source: computed, description: "round(mean of four dimension scores, 2)" }
      - { name: rating, type: enum, source: computed, description: "FAIL if any dimension <= 2 or overall < 3.0; PASS if every dimension >= 4 and overall >= 4.0; else PASS_WITH_DEFICIENCIES", constraints: "enum: PASS, PASS_WITH_DEFICIENCIES, FAIL" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED", constraints: "enum: SCHEDULED, IN_PROGRESS, COMPLETED" }
      - { name: completed_at, type: datetime, source: system, description: "Set at completion", constraints: "nullable" }

  - name: CommitteePack
    parent: null
    common_fields: true
    fields:
      - { name: audit_plan_id, type: string, source: input, description: "FK -> AuditPlan.id; plan reported on" }
      - { name: meeting_date, type: datetime, source: input, description: "Committee meeting date" }
      - { name: title, type: string, source: input, description: "Pack title" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | PRESENTED", constraints: "enum: DRAFT, FINALIZED, PRESENTED" }
      - { name: snapshot_plan_completion_pct, type: number, source: computed, description: "Pinned at finalize: 100 * CLOSED engagements / non-CANCELLED engagements (0.0 when denominator 0), 2dp round_half_up", constraints: "nullable" }
      - { name: snapshot_overdue_action_count, type: integer, source: computed, description: "Pinned at finalize: ActionPlans of findings of this plan's engagements with status != VALIDATED and days_overdue >= 1 at finalize clock", constraints: "nullable" }
      - { name: snapshot_critical_findings, type: integer, source: computed, description: "Pinned at finalize: findings of this plan's engagements with status IN {AGREED, ESCALATED, FINAL} and severity CRITICAL", constraints: "nullable" }
      - { name: snapshot_high_findings, type: integer, source: computed, description: "Pinned at finalize: same set with severity HIGH", constraints: "nullable" }
      - { name: is_stale_snapshot, type: boolean, source: system, default: false, description: "Set true by QA-fail cascade while pack is DRAFT; FINALIZED packs never change" }
      - { name: finalized_at, type: datetime, source: system, description: "Set at finalize", constraints: "nullable" }
      - { name: presented_at, type: datetime, source: system, description: "Set at presentation", constraints: "nullable" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AuditableEntity
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /audit/auditable-entities/{id}/retire"
        actor: AuditAdmin
        preconditions:
          - "Entity is ACTIVE (ERR_AUDITABLE_ENTITY_INVALID_STATE)"
          - "No Engagement with auditable_entity_id == this entity and status IN {PLANNED, SCOPED, FIELDWORK, REPORTING} (ERR_ENTITY_HAS_OPEN_ENGAGEMENTS)"
        side_effects:
          - "retired_at = logical clock now"
          - "RETIRED entities reject new RiskAssessments and Engagements but remain readable (soft archival)"

  - entity: RiskAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /audit/risk-assessments/{id}/finalize"
        actor: AuditManager
        preconditions:
          - "Assessment is DRAFT (ERR_RISK_ASSESSMENT_INVALID_STATE)"
          - "No other FINALIZED RiskAssessment for the same (auditable_entity_id, fiscal_year) (ERR_RISK_ASSESSMENT_ALREADY_FINALIZED)"
        side_effects:
          - "finalized_at = logical clock now"
          - "AuditableEntity.current_inherent_risk_score = this score and current_risk_tier recomputed when this assessment's fiscal_year is the maximum FINALIZED fiscal_year for the entity (ledger sync)"
          - "increments AuditableEntity.version by 1"

  - entity: RatingCriteriaConfig
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /audit/rating-criteria-configs/{id}/activate"
        actor: AuditAdmin
        preconditions:
          - "Config is DRAFT (ERR_RATING_CONFIG_INVALID_STATE)"
          - "1 <= moderate_min < high_min < critical_min <= 25 (ERR_CONFIG_BANDS_INVALID)"
        side_effects:
          - "The previously ACTIVE RatingCriteriaConfig, if any, transitions ACTIVE -> SUPERSEDED (exactly-one-ACTIVE invariant)"
          - "activated_at = logical clock now"

  - entity: AuditPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /audit/audit-plans/{id}/submit"
        actor: ChiefAuditExecutive
        preconditions:
          - "Plan is DRAFT or RETURNED (ERR_PLAN_INVALID_STATE)"
          - "engagement_count >= 1 (ERR_PLAN_EMPTY — zero-engagement plans cannot be submitted)"
        side_effects:
          - "submitted_by_user_id = X-User-ID; submitted_at = logical clock now"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /audit/audit-plans/{id}/submit"
        actor: ChiefAuditExecutive
        preconditions:
          - "Plan is DRAFT or RETURNED (ERR_PLAN_INVALID_STATE)"
          - "engagement_count >= 1 (ERR_PLAN_EMPTY)"
        side_effects:
          - "submitted_by_user_id = X-User-ID; submitted_at = logical clock now (negotiation cycle with committee)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /audit/audit-plans/{id}/approve"
        actor: AuditCommittee
        preconditions:
          - "Plan is SUBMITTED (ERR_PLAN_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_PLAN_SELF_APPROVAL — segregation of duties)"
        side_effects:
          - "approved_by_user_id = X-User-ID; approved_at = logical clock now"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /audit/audit-plans/{id}/return"
        actor: AuditCommittee
        preconditions:
          - "Plan is SUBMITTED (ERR_PLAN_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: CLOSED
        trigger: "POST /audit/audit-plans/{id}/close"
        actor: ChiefAuditExecutive
        preconditions:
          - "Plan is APPROVED (ERR_PLAN_INVALID_STATE)"
          - "Every Engagement of this plan is in a terminal state {CLOSED, CANCELLED} (ERR_PLAN_HAS_OPEN_ENGAGEMENTS)"
        side_effects: []

  - entity: Engagement
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCOPED
        trigger: "POST /audit/engagements/{id}/scope"
        actor: AuditManager
        preconditions:
          - "Engagement is PLANNED (ERR_ENGAGEMENT_INVALID_STATE)"
        side_effects: []
      - from: SCOPED
        to: FIELDWORK
        trigger: "POST /audit/engagements/{id}/begin-fieldwork"
        actor: AuditManager
        preconditions:
          - "Engagement is SCOPED (ERR_ENGAGEMENT_INVALID_STATE)"
          - "AuditPlan.status == APPROVED (ERR_PLAN_NOT_APPROVED — cross-entity gate)"
          - "At least one ACTIVE EngagementAssignment with role_in_engagement == LEAD (ERR_NO_LEAD_ASSIGNED)"
        side_effects: []
      - from: FIELDWORK
        to: REPORTING
        trigger: "POST /audit/engagements/{id}/begin-reporting"
        actor: AuditManager
        preconditions:
          - "Engagement is FIELDWORK (ERR_ENGAGEMENT_INVALID_STATE)"
          - "signed_off_workpaper_count >= 1 (ERR_NO_SIGNED_WORKPAPERS — empty-set boundary)"
          - "Every Workpaper of the engagement is SIGNED_OFF; any DRAFT, SUBMITTED, or RETURNED workpaper blocks reporting (ERR_WORKPAPERS_PENDING_REVIEW)"
        side_effects: []
      - from: REPORTING
        to: FIELDWORK
        trigger: "system (automatic when a QAReview of this engagement completes with rating == FAIL)"
        actor: system
        preconditions:
          - "Engagement is REPORTING and the completing QAReview.rating == FAIL"
        side_effects:
          - "qa_regression_count += 1"
          - "Cascade L2: every Workpaper of this engagement in SIGNED_OFF transitions to RETURNED (review_note set to QA_REOPEN, signed_off_at cleared); signed_off_workpaper_count and actual_hours recomputed (conditional cascade — DRAFT/RETURNED workpapers untouched)"
          - "Cascade L3: the L2 workpaper reopening causes any AuditReport of this engagement in PENDING_APPROVAL to auto-return to DRAFT (issuance gate requires all workpapers SIGNED_OFF)"
          - "Cascade L4: every CommitteePack with audit_plan_id == this engagement's plan and status == DRAFT gets is_stale_snapshot = true"
      - from: REPORTING
        to: CLOSED
        trigger: "POST /audit/engagements/{id}/close"
        actor: AuditManager
        preconditions:
          - "Engagement is REPORTING (ERR_ENGAGEMENT_INVALID_STATE)"
          - "An AuditReport of this engagement exists with status IN {ISSUED, DISTRIBUTED} (ERR_REPORT_NOT_ISSUED — cross-entity gate)"
          - "No QAReview of this engagement in {SCHEDULED, IN_PROGRESS} (ERR_QA_REVIEW_OPEN)"
        side_effects:
          - "AuditableEntity.last_audit_completed_at = logical clock now (bubble up; entity.updated_at and version refreshed)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /audit/engagements/{id}/cancel"
        actor: AuditManager
        preconditions:
          - "Engagement is PLANNED or SCOPED (ERR_ENGAGEMENT_INVALID_STATE)"
        side_effects:
          - "Cascade down: every ACTIVE EngagementAssignment of this engagement -> CANCELLED; reserved_hours recomputed"
          - "AuditPlan.engagement_count and high_risk_coverage_pct recomputed (ledger sync)"
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /audit/engagements/{id}/cancel"
        actor: AuditManager
        preconditions:
          - "Engagement is PLANNED or SCOPED (ERR_ENGAGEMENT_INVALID_STATE)"
        side_effects:
          - "Cascade down: every ACTIVE EngagementAssignment of this engagement -> CANCELLED; reserved_hours recomputed"
          - "AuditPlan.engagement_count and high_risk_coverage_pct recomputed (ledger sync)"

  - entity: Auditor
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /audit/auditors/{id}/deactivate"
        actor: AuditAdmin
        preconditions:
          - "Auditor is ACTIVE (ERR_AUDITOR_INACTIVE when already INACTIVE)"
        side_effects:
          - "Existing assignments are untouched; new assignments to an INACTIVE auditor are rejected at creation"

  - entity: EngagementAssignment
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /audit/engagement-assignments/{id}/cancel"
        actor: AuditManager
        preconditions:
          - "Assignment is ACTIVE (ERR_ASSIGNMENT_INVALID_STATE)"
          - "Engagement.status IN {PLANNED, SCOPED, FIELDWORK} (ERR_ENGAGEMENT_INVALID_STATE)"
        side_effects:
          - "Engagement.reserved_hours -= allocated_hours (compensating action for the creation-time reservation; invariant: reserved_hours == sum of ACTIVE allocated_hours)"

  - entity: Workpaper
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /audit/workpapers/{id}/submit"
        actor: FieldAuditor
        preconditions:
          - "Workpaper is DRAFT (ERR_WORKPAPER_INVALID_STATE)"
          - "Workpaper.locked == false (ERR_WORKPAPER_LOCKED)"
          - "Engagement.status == FIELDWORK (ERR_ENGAGEMENT_INVALID_STATE — cross-entity gate)"
          - "X-User-ID == preparer_auditor_id (ERR_NOT_WORKPAPER_PREPARER — ownership)"
        side_effects:
          - "Engagement.provisional_hours recomputed (ledger sync)"
      - from: SUBMITTED
        to: SIGNED_OFF
        trigger: "POST /audit/workpapers/{id}/sign-off"
        actor: AuditManager
        preconditions:
          - "Workpaper is SUBMITTED (ERR_WORKPAPER_INVALID_STATE)"
          - "Workpaper.locked == false (ERR_WORKPAPER_LOCKED)"
          - "Engagement.status == FIELDWORK (ERR_ENGAGEMENT_INVALID_STATE — cross-entity gate)"
          - "X-User-ID != preparer_auditor_id (ERR_WORKPAPER_SELF_REVIEW — segregation of duties)"
          - "actual_hours + ceil(hours_worked*2)/2 <= budget_hours * 1.10 (ERR_BUDGET_HOURS_EXCEEDED — fiscal check at sign-off, evaluated after SoD)"
        side_effects:
          - "reviewer_auditor_id = X-User-ID; signed_off_at = logical clock now"
          - "Engagement.signed_off_workpaper_count += 1; actual_hours and provisional_hours recomputed"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /audit/workpapers/{id}/return"
        actor: AuditManager
        preconditions:
          - "Workpaper is SUBMITTED or SIGNED_OFF (ERR_WORKPAPER_INVALID_STATE)"
          - "Workpaper.locked == false (ERR_WORKPAPER_LOCKED)"
          - "Engagement.status == FIELDWORK (ERR_ENGAGEMENT_INVALID_STATE — cross-entity gate)"
          - "X-User-ID != preparer_auditor_id (ERR_WORKPAPER_SELF_REVIEW)"
        side_effects:
          - "reviewer_auditor_id = X-User-ID; review_note = request note"
          - "Engagement.provisional_hours recomputed"
      - from: SIGNED_OFF
        to: RETURNED
        trigger: "POST /audit/workpapers/{id}/return"
        actor: AuditManager
        preconditions:
          - "Workpaper is SUBMITTED or SIGNED_OFF (ERR_WORKPAPER_INVALID_STATE)"
          - "Workpaper.locked == false (ERR_WORKPAPER_LOCKED)"
          - "Engagement.status == FIELDWORK (ERR_ENGAGEMENT_INVALID_STATE — cross-entity gate)"
          - "X-User-ID != preparer_auditor_id (ERR_WORKPAPER_SELF_REVIEW)"
        side_effects:
          - "reviewer_auditor_id = X-User-ID; review_note = request note; signed_off_at = null"
          - "Engagement.signed_off_workpaper_count -= 1; actual_hours and provisional_hours recomputed (compensating action; invariant: signed_off_workpaper_count == count of SIGNED_OFF workpapers)"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /audit/workpapers/{id}/revise"
        actor: FieldAuditor
        preconditions:
          - "Workpaper is RETURNED (ERR_WORKPAPER_INVALID_STATE)"
          - "Workpaper.locked == false (ERR_WORKPAPER_LOCKED)"
          - "Engagement.status == FIELDWORK (ERR_ENGAGEMENT_INVALID_STATE — cross-entity gate)"
          - "X-User-ID == preparer_auditor_id (ERR_NOT_WORKPAPER_PREPARER)"
        side_effects:
          - "review_note cleared (revision loop DRAFT -> SUBMITTED -> RETURNED -> DRAFT)"

  - entity: Finding
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: PENDING_RESPONSE
        trigger: "POST /audit/findings/{id}/issue"
        actor: AuditManager
        preconditions:
          - "Finding is DRAFT (ERR_FINDING_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_FINDING_SELF_ISSUE — segregation of duties; checked before referential gates)"
          - "If workpaper_id is set, that Workpaper is SIGNED_OFF (ERR_WORKPAPER_NOT_SIGNED — referential gate)"
        side_effects: []
      - from: PENDING_RESPONSE
        to: UNDER_REVIEW
        trigger: "system (automatic when a ManagementResponse is created for this finding)"
        actor: system
        preconditions:
          - "Finding is PENDING_RESPONSE or REBUTTED"
        side_effects: []
      - from: REBUTTED
        to: UNDER_REVIEW
        trigger: "system (automatic when a ManagementResponse is created for this finding)"
        actor: system
        preconditions:
          - "Finding is PENDING_RESPONSE or REBUTTED"
        side_effects:
          - "Negotiation cycle: REBUTTED -> UNDER_REVIEW via a fresh management response"
      - from: UNDER_REVIEW
        to: AGREED
        trigger: "system (automatic when the reviewed ManagementResponse is ACCEPTED)"
        actor: system
        preconditions:
          - "Finding is UNDER_REVIEW"
        side_effects: []
      - from: UNDER_REVIEW
        to: REBUTTED
        trigger: "system (automatic when the reviewed ManagementResponse is REBUTTED)"
        actor: system
        preconditions:
          - "Finding is UNDER_REVIEW"
          - "negotiation_rounds < 3 at rebuttal time (ERR_NEGOTIATION_ROUNDS_EXHAUSTED enforced at the rebut endpoint)"
        side_effects:
          - "negotiation_rounds += 1"
      - from: REBUTTED
        to: ESCALATED
        trigger: "POST /audit/findings/{id}/escalate"
        actor: ChiefAuditExecutive
        preconditions:
          - "Finding is REBUTTED (ERR_FINDING_INVALID_STATE)"
          - "negotiation_rounds >= 3 (ERR_NEGOTIATION_ROUNDS_NOT_EXHAUSTED — boundary: exactly 3 allows escalation)"
        side_effects: []
      - from: AGREED
        to: FINAL
        trigger: "system (automatic when the engagement's AuditReport is ISSUED)"
        actor: system
        preconditions:
          - "Finding is AGREED or ESCALATED"
        side_effects:
          - "finalized_at = logical clock now; Engagement.open_finding_count recomputed"
      - from: ESCALATED
        to: FINAL
        trigger: "system (automatic when the engagement's AuditReport is ISSUED)"
        actor: system
        preconditions:
          - "Finding is AGREED or ESCALATED"
        side_effects:
          - "finalized_at = logical clock now; Engagement.open_finding_count recomputed"

  - entity: ManagementResponse
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REBUTTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /audit/management-responses/{id}/accept"
        actor: AuditManager
        preconditions:
          - "Response is SUBMITTED (ERR_RESPONSE_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "Parent Finding (finding_id) transitions UNDER_REVIEW -> AGREED (bubble up)"
      - from: SUBMITTED
        to: REBUTTED
        trigger: "POST /audit/management-responses/{id}/rebut"
        actor: AuditManager
        preconditions:
          - "Response is SUBMITTED (ERR_RESPONSE_INVALID_STATE)"
          - "Parent Finding.negotiation_rounds < 3 (ERR_NEGOTIATION_ROUNDS_EXHAUSTED)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "Parent Finding transitions UNDER_REVIEW -> REBUTTED and negotiation_rounds += 1 (bubble up)"

  - entity: ActionPlan
    initial_state: OPEN
    terminal_states: [VALIDATED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /audit/action-plans/{id}/start"
        actor: ManagementOwner
        preconditions:
          - "ActionPlan is OPEN (ERR_ACTION_PLAN_INVALID_STATE)"
          - "Finding.status == AGREED (ERR_FINDING_NOT_AGREED — cross-entity gate)"
        side_effects: []
      - from: IN_PROGRESS
        to: SUBMITTED_FOR_VALIDATION
        trigger: "POST /audit/action-plans/{id}/submit-validation"
        actor: ManagementOwner
        preconditions:
          - "ActionPlan is IN_PROGRESS (ERR_ACTION_PLAN_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED_FOR_VALIDATION
        to: VALIDATED
        trigger: "POST /audit/action-plans/{id}/validate"
        actor: AuditManager
        preconditions:
          - "ActionPlan is SUBMITTED_FOR_VALIDATION (ERR_ACTION_PLAN_INVALID_STATE)"
        side_effects:
          - "validated_by_user_id = X-User-ID; validated_at = logical clock now"
          - "Finding.open_overdue_action_count recomputed (ledger sync)"
      - from: SUBMITTED_FOR_VALIDATION
        to: IN_PROGRESS
        trigger: "POST /audit/action-plans/{id}/reject-validation"
        actor: AuditManager
        preconditions:
          - "ActionPlan is SUBMITTED_FOR_VALIDATION (ERR_ACTION_PLAN_INVALID_STATE)"
        side_effects:
          - "Validation-failure loop: plan returns to IN_PROGRESS for rework"

  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /audit/extension-requests/{id}/approve"
        actor: ChiefAuditExecutive
        preconditions:
          - "Request is PENDING (ERR_EXTENSION_INVALID_STATE)"
          - "Re-validated at decision time: requested_due_date > ActionPlan.due_date (ERR_EXTENSION_NOT_MONOTONIC)"
          - "Re-validated: ActionPlan.extension_count < 2 (ERR_EXTENSION_COUNT_EXCEEDED)"
          - "Re-validated: ActionPlan.cumulative_extended_days + (requested_due_date - due_date).days <= 180 (ERR_EXTENSION_CUMULATIVE_CAP_EXCEEDED)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "Cascade L1: ActionPlan.due_date = requested_due_date; extension_count += 1; approved_days = (requested_due_date - prior due_date).days; cumulative_extended_days += approved_days"
          - "Cascade L2: the L1 due_date mutation triggers Finding.open_overdue_action_count recomputation for the parent finding (an overdue plan may cease to be overdue)"
      - from: PENDING
        to: DENIED
        trigger: "POST /audit/extension-requests/{id}/deny"
        actor: ChiefAuditExecutive
        preconditions:
          - "Request is PENDING (ERR_EXTENSION_INVALID_STATE)"
        side_effects:
          - "decided_by_user_id = X-User-ID"

  - entity: AuditReport
    initial_state: DRAFT
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /audit/audit-reports/{id}/submit"
        actor: AuditManager
        preconditions:
          - "Report is DRAFT (ERR_REPORT_INVALID_STATE)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /audit/audit-reports/{id}/approve"
        actor: ChiefAuditExecutive
        preconditions:
          - "Report is PENDING_APPROVAL (ERR_REPORT_INVALID_STATE)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /audit/audit-reports/{id}/return"
        actor: ChiefAuditExecutive
        preconditions:
          - "Report is PENDING_APPROVAL (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "Revision loop: CAE returns the draft for rework"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /audit/audit-reports/{id}/issue"
        actor: ChiefAuditExecutive
        preconditions:
          - "Report is APPROVED (ERR_REPORT_INVALID_STATE)"
          - "Engagement.status == REPORTING (ERR_ENGAGEMENT_INVALID_STATE — cross-entity gate)"
          - "No other AuditReport of this engagement in {ISSUED, DISTRIBUTED} (ERR_REPORT_ALREADY_ISSUED)"
          - "Every Finding of the engagement is in {AGREED, ESCALATED, FINAL} (ERR_FINDINGS_NOT_RESOLVED)"
        side_effects:
          - "issued_at = logical clock now"
          - "Cascade: every Finding of the engagement in {AGREED, ESCALATED} -> FINAL with finalized_at set (cross-entity)"
          - "Cascade: every Workpaper of the engagement gets locked = true (tamper-evident freeze)"
      - from: ISSUED
        to: DISTRIBUTED
        trigger: "POST /audit/audit-reports/{id}/distribute"
        actor: ChiefAuditExecutive
        preconditions:
          - "Report is ISSUED (ERR_REPORT_INVALID_STATE)"
          - "distribution_list is non-empty (ERR_DISTRIBUTION_LIST_EMPTY — empty-set boundary)"
        side_effects:
          - "distributed_at = logical clock now; distribution_list recorded"

  - entity: QAReview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /audit/qa-reviews/{id}/begin"
        actor: QualityAssessor
        preconditions:
          - "Review is SCHEDULED (ERR_QA_REVIEW_INVALID_STATE)"
          - "X-User-ID (an Auditor id) does NOT hold an ACTIVE EngagementAssignment on this engagement (ERR_QA_ASSESSOR_ASSIGNED — segregation of duties)"
        side_effects:
          - "assessor_auditor_id = X-User-ID"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /audit/qa-reviews/{id}/complete"
        actor: QualityAssessor
        preconditions:
          - "Review is IN_PROGRESS (ERR_QA_REVIEW_INVALID_STATE)"
          - "X-User-ID == assessor_auditor_id (ERR_NOT_QA_ASSESSOR — ownership)"
          - "Each dimension score in 1..5 (ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "overall_score and rating computed (qa_rating_determination); completed_at = logical clock now"
          - "If rating == FAIL and Engagement.status == REPORTING: Engagement regresses REPORTING -> FIELDWORK (cascade A link 1; see Engagement transitions for links L2-L4)"

  - entity: CommitteePack
    initial_state: DRAFT
    terminal_states: [PRESENTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /audit/committee-packs/{id}/finalize"
        actor: ChiefAuditExecutive
        preconditions:
          - "Pack is DRAFT (ERR_PACK_INVALID_STATE)"
        side_effects:
          - "Snapshot aggregates computed and pinned (committee_pack_snapshot): snapshot_plan_completion_pct, snapshot_overdue_action_count, snapshot_critical_findings, snapshot_high_findings; finalized_at = logical clock now"
      - from: FINALIZED
        to: PRESENTED
        trigger: "POST /audit/committee-packs/{id}/present"
        actor: AuditCommittee
        preconditions:
          - "Pack is FINALIZED (ERR_PACK_INVALID_STATE)"
        side_effects:
          - "presented_at = logical clock now"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: risk-assessment-create-stale-entity
    parent_entity: AuditableEntity
    write_endpoint: "POST /audit/risk-assessments"
    occ_field: expected_auditable_entity_version
    description: |
      Creating a RiskAssessment against an AuditableEntity whose version has
      advanced since the client last observed it is rejected: the client may be
      superseding a finalized assessment it never saw. The check is a stale-version
      comparison on AuditableEntity.version, evaluated deterministically.
    error_id: ERR_STALE_ENTITY_VERSION
    http_status: 412
  - rule_id: engagement-create-stale-plan
    parent_entity: AuditPlan
    write_endpoint: "POST /audit/engagements"
    occ_field: expected_audit_plan_version
    description: |
      Creating an Engagement against an AuditPlan whose version has advanced since
      the client last observed it is rejected: engagement creation mutates plan
      aggregates (engagement_count, high_risk_coverage_pct), so a stale view would
      silently fork the plan roster. The check is a stale-version comparison on
      AuditPlan.version, evaluated deterministically.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: inherent_risk_score
    trigger: "On RiskAssessment creation; value pinned at creation and carried through FINALIZED"
    algorithm: weighted_scoring
    formula: |
      L = likelihood (integer 1..5); I = impact (integer 1..5)
      variant selection: CONSERVATIVE iff AuditableEntity.regulatory_scrutiny == true at creation, else WEIGHTED
      WEIGHTED:      score = 8*L + 12*I            # range 20..100
      CONSERVATIVE:  score = 20 * max(L, I)        # range 20..100
      tier(score): score >= 85 -> CRITICAL; 70..84 -> HIGH; 40..69 -> MODERATE; else LOW (>= boundaries)
    input_set: "The RiskAssessment being created and its parent AuditableEntity.regulatory_scrutiny"
    constants:
      WEIGHTED_LIKELIHOOD_COEF: 8
      WEIGHTED_IMPACT_COEF: 12
      CONSERVATIVE_AXIS_MULTIPLIER: 20
      TIER_HIGH_MIN: 70
      TIER_CRITICAL_MIN: 85
      TIER_MODERATE_MIN: 40
    precision: "integer arithmetic, no rounding"
    variants:
      - name: WEIGHTED
        when: "AuditableEntity.regulatory_scrutiny == false"
        difference: "Balanced blend 8L + 12I (e.g., L=3,I=4 -> 72)"
      - name: CONSERVATIVE
        when: "AuditableEntity.regulatory_scrutiny == true"
        difference: "Worst-axis dominance 20*max(L,I) (e.g., L=3,I=4 -> 80, not 72)"

  - name: engagement_priority_score
    trigger: "On Engagement creation; stored on Engagement.priority_score"
    algorithm: forward_looking
    formula: |
      R  = AuditableEntity.current_inherent_risk_score; 0 when null
      M  = full calendar months between entity.last_audit_completed_at and logical clock date;
           (y2-y1)*12 + (m2-m1) - (1 if day2 < day1 else 0); M = 999 when never audited
      recency_factor: M >= 36 -> 30; 24 <= M <= 35 -> 20; 12 <= M <= 23 -> 10; M < 12 -> 0 (boundaries >=)
      S  = 1 if entity.regulatory_scrutiny else 0
      priority_score = min(100, R + recency_factor + 15*S)
    input_set: "The Engagement's AuditableEntity (risk score, last audit date, scrutiny flag) and the logical clock"
    constants:
      RECENCY_TIER1_MONTHS: 36
      RECENCY_TIER1_POINTS: 30
      RECENCY_TIER2_MONTHS: 24
      RECENCY_TIER2_POINTS: 20
      RECENCY_TIER3_MONTHS: 12
      RECENCY_TIER3_POINTS: 10
      SCRUTINY_BONUS: 15
      SCORE_CAP: 100
    precision: "integer arithmetic, no rounding"

  - name: plan_high_risk_coverage_pct
    trigger: "Recomputed on Engagement creation and on Engagement cancellation (ledger sync to AuditPlan.high_risk_coverage_pct)"
    algorithm: aggregation
    formula: |
      universe  = AuditableEntity with status == ACTIVE AND current_inherent_risk_score >= 70
      covered   = universe members having >= 1 Engagement with audit_plan_id == this plan AND status != CANCELLED
      if |universe| == 0 -> 100.0
      else pct = round(100.0 * |covered| / |universe|, 2)
    input_set: "AuditableEntity status/score filters as above; Engagements of this plan with status != CANCELLED"
    constants:
      HIGH_RISK_SCORE_MIN: 70
    precision: "2 decimal places, round_half_up"

  - name: engagement_hours_rollup
    trigger: "On Workpaper submit, sign-off, and return (from SIGNED_OFF); maintains Engagement.actual_hours and provisional_hours"
    algorithm: aggregation
    formula: |
      per-item rounding FIRST:  item_hours(wp) = ceil(wp.hours_worked * 2) / 2
      actual_hours      = sum of item_hours over Workpapers with status == SIGNED_OFF
      provisional_hours = sum of item_hours over Workpapers with status IN {SUBMITTED, SIGNED_OFF}
      PINNED ORDER: round each item up to the nearest 0.5, THEN sum.
      The alternative (sum raw hours then round) is explicitly NOT used and yields different values
      (e.g., items 1.1, 1.1, 1.1 -> pinned 4.5 vs sum-then-round 3.5).
    input_set: "Workpapers of the engagement filtered by status as above"
    constants:
      ROUNDING_GRANULARITY: 0.5
    precision: "half-hour granularity via ceil(x*2)/2; results exact to 0.5"

  - name: budget_utilization
    trigger: "Derived from engagement_hours_rollup outputs; read on Engagement fetch"
    algorithm: aggregation
    formula: |
      final_utilization_pct       = round(100.0 * actual_hours / budget_hours, 2)
      provisional_utilization_pct = round(100.0 * provisional_hours / budget_hours, 2)
    input_set: "Engagement.actual_hours, provisional_hours, budget_hours"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Engagement in FIELDWORK or REPORTING (review pipeline in flight)"
        difference: "Counts SUBMITTED workpapers too: provisional_hours/budget (e.g., 10 signed + 20 submitted of 100 -> 30.0)"
      - name: final
        when: "Engagement ISSUED/CLOSED reporting basis"
        difference: "Counts only SIGNED_OFF: actual_hours/budget (same data -> 10.0, not 30.0)"

  - name: finding_severity_rating
    trigger: "On Finding creation; rating_criteria_config_id pinned to the ACTIVE config; severity NOT re-rated when config is later SUPERSEDED (version pinning)"
    algorithm: threshold
    formula: |
      composite = likelihood * impact   # 1..25
      severity: composite >= config.critical_min -> CRITICAL
                composite >= config.high_min     -> HIGH
                composite >= config.moderate_min -> MODERATE
                else LOW                        (all boundaries >=)
    input_set: "Finding likelihood/impact and the pinned RatingCriteriaConfig band thresholds"
    constants:
      DEFAULT_CRITICAL_MIN: 20
      DEFAULT_HIGH_MIN: 12
      DEFAULT_MODERATE_MIN: 6
    precision: "integer arithmetic, no rounding"

  - name: action_plan_overdue_days
    trigger: "Evaluated against the logical clock on read of Finding.open_overdue_action_count and on committee_pack_snapshot"
    algorithm: threshold
    formula: |
      days_overdue = max(0, (clock_date - due_date).days)   # whole-day granularity
      due today (days_overdue == 0) is NOT overdue; overdue requires days_overdue >= 1
      aging_bucket: 0 -> CURRENT; 1..30 -> AGING_1_30; 31..90 -> AGING_31_90; >= 91 -> AGING_91_PLUS (boundaries >=)
      Finding.open_overdue_action_count = count of its ActionPlans with status != VALIDATED and days_overdue >= 1
    input_set: "ActionPlans of the finding; logical clock date"
    constants:
      AGING_TIER1_MAX: 30
      AGING_TIER2_MAX: 90
    precision: "integer days, no rounding"

  - name: extension_cumulative_days
    trigger: "On ExtensionRequest creation (validation) and approval (mutation), processing approved requests chronologically by approved time (tie-break: created_at ASC)"
    algorithm: chronological
    formula: |
      on approve: approved_days = (requested_due_date - ActionPlan.due_date).days   # must be >= 1
      new_cumulative = ActionPlan.cumulative_extended_days + approved_days
      constraints: ActionPlan.extension_count < 2 (cap 2 approvals);
                   new_cumulative <= 180 (INCLUSIVE: exactly 180 is allowed, 181 rejected);
                   requested_due_date > ActionPlan.due_date (strictly monotonic)
    input_set: "The ActionPlan and its ExtensionRequests (PENDING uniqueness enforced separately)"
    constants:
      MAX_EXTENSIONS_PER_PLAN: 2
      MAX_CUMULATIVE_EXTENSION_DAYS: 180
    precision: "integer days, no rounding"

  - name: committee_pack_snapshot
    trigger: "On CommitteePack finalize; values pinned on the pack and never recomputed afterwards"
    algorithm: aggregation
    formula: |
      plan_engagements   = Engagements with audit_plan_id == pack.audit_plan_id and status != CANCELLED
      completion_pct     = |plan_engagements| == 0 ? 0.0 : round(100.0 * |status == CLOSED| / |plan_engagements|, 2)
      plan_findings      = Findings whose engagement is in plan_engagements OR in any CANCELLED engagement of the plan
                           (input set: engagements with audit_plan_id == plan regardless of cancellation)
      overdue_count      = ActionPlans of plan_findings with status != VALIDATED and days_overdue >= 1 at finalize clock
      critical_count     = plan_findings with status IN {AGREED, ESCALATED, FINAL} and severity == CRITICAL
      high_count         = plan_findings with status IN {AGREED, ESCALATED, FINAL} and severity == HIGH
    input_set: "Engagements/Findings/ActionPlans reachable via audit_plan_id as above; finalize-time logical clock"
    constants: {}
    precision: "percentages 2 decimal places round_half_up; counts are integers"

  - name: qa_rating_determination
    trigger: "On QAReview completion"
    algorithm: threshold
    formula: |
      overall_score = round((doc + fieldwork + reporting + independence) / 4, 2)
      rating: FAIL if any dimension <= 2 OR overall_score < 3.0
              PASS if every dimension >= 4 AND overall_score >= 4.0
              else PASS_WITH_DEFICIENCIES                    (boundaries: 3.0 passes the FAIL gate; 4.0 required for PASS)
    input_set: "The four dimension scores (each 1..5) submitted at completion"
    constants:
      FAIL_DIMENSION_MAX: 2
      FAIL_OVERALL_EXCLUSIVE_MAX: 3.0
      PASS_DIMENSION_MIN: 4
      PASS_OVERALL_MIN: 4.0
    precision: "overall_score 2 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's allowed roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role-grade consistency for entity-backed roles: AuditManager requires Auditor grade IN {MANAGER, DIRECTOR}; FieldAuditor requires grade IN {STAFF, SENIOR, MANAGER}; QualityAssessor requires grade IN {MANAGER, DIRECTOR}; in all cases Auditor.status == ACTIVE", error_id: ERR_ROLE_GRADE_MISMATCH, http_status: 403, applies_to: "all endpoints acted on by AuditManager, FieldAuditor, or QualityAssessor" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right; then body FK fields in declared input order", error_id: ERR_AUDITABLE_ENTITY_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing an AuditableEntity (path or auditable_entity_id)" }
  - { priority: 4, category: existence, check: "Referenced RiskAssessment exists", error_id: ERR_RISK_ASSESSMENT_NOT_FOUND, http_status: 404, applies_to: "risk-assessment endpoints" }
  - { priority: 4, category: existence, check: "Referenced RatingCriteriaConfig exists", error_id: ERR_RATING_CONFIG_NOT_FOUND, http_status: 404, applies_to: "rating-criteria-config endpoints" }
  - { priority: 4, category: existence, check: "Referenced AuditPlan exists (path id or audit_plan_id body field)", error_id: ERR_AUDIT_PLAN_NOT_FOUND, http_status: 404, applies_to: "plan endpoints; POST /audit/engagements; POST /audit/committee-packs" }
  - { priority: 4, category: existence, check: "Referenced Engagement exists (path id or engagement_id body field)", error_id: ERR_ENGAGEMENT_NOT_FOUND, http_status: 404, applies_to: "engagement endpoints; creates of assignments, workpapers, findings, reports, QA reviews" }
  - { priority: 4, category: existence, check: "Referenced Auditor exists", error_id: ERR_AUDITOR_NOT_FOUND, http_status: 404, applies_to: "auditor endpoints; POST /audit/engagement-assignments" }
  - { priority: 4, category: existence, check: "Referenced EngagementAssignment exists", error_id: ERR_ASSIGNMENT_NOT_FOUND, http_status: 404, applies_to: "engagement-assignment endpoints" }
  - { priority: 4, category: existence, check: "Referenced Workpaper exists (path id or workpaper_id body field)", error_id: ERR_WORKPAPER_NOT_FOUND, http_status: 404, applies_to: "workpaper endpoints; POST /audit/findings" }
  - { priority: 4, category: existence, check: "Referenced Finding exists (path id or finding_id body field)", error_id: ERR_FINDING_NOT_FOUND, http_status: 404, applies_to: "finding endpoints; creates of management-responses and action-plans" }
  - { priority: 4, category: existence, check: "Referenced ManagementResponse exists", error_id: ERR_MANAGEMENT_RESPONSE_NOT_FOUND, http_status: 404, applies_to: "management-response endpoints" }
  - { priority: 4, category: existence, check: "Referenced ActionPlan exists (path id or action_plan_id body field)", error_id: ERR_ACTION_PLAN_NOT_FOUND, http_status: 404, applies_to: "action-plan endpoints; POST /audit/extension-requests" }
  - { priority: 4, category: existence, check: "Referenced ExtensionRequest exists", error_id: ERR_EXTENSION_REQUEST_NOT_FOUND, http_status: 404, applies_to: "extension-request endpoints" }
  - { priority: 4, category: existence, check: "Referenced AuditReport exists", error_id: ERR_AUDIT_REPORT_NOT_FOUND, http_status: 404, applies_to: "audit-report endpoints" }
  - { priority: 4, category: existence, check: "Referenced QAReview exists", error_id: ERR_QA_REVIEW_NOT_FOUND, http_status: 404, applies_to: "qa-review endpoints" }
  - { priority: 4, category: existence, check: "Referenced CommitteePack exists", error_id: ERR_COMMITTEE_PACK_NOT_FOUND, http_status: 404, applies_to: "committee-pack endpoints" }
  - { priority: 4, category: existence, check: "Optional supersedes_engagement_id, when provided, references an existing Engagement", error_id: ERR_ENGAGEMENT_NOT_FOUND, http_status: 404, applies_to: "POST /audit/engagements" }
  - { priority: 5, category: business_constraint, check: "Required fields present, types valid, enum values in range, no unknown/read-only fields supplied; integer scores likelihood/impact/QA dimensions within declared ranges", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all create/action endpoints" }
  - { priority: 5, category: business_constraint, check: "Numeric score fields within 1..5 where declared (risk likelihood/impact, finding likelihood/impact, QA dimension scores)", error_id: ERR_SCORE_OUT_OF_RANGE, http_status: 422, applies_to: "POST /audit/risk-assessments; POST /audit/findings; POST /audit/qa-reviews/{id}/complete" }
  - { priority: 6, category: business_constraint, check: "OCC: expected_auditable_entity_version == current AuditableEntity.version", error_id: ERR_STALE_ENTITY_VERSION, http_status: 412, applies_to: "POST /audit/risk-assessments" }
  - { priority: 6, category: business_constraint, check: "OCC: expected_audit_plan_version == current AuditPlan.version", error_id: ERR_STALE_PLAN_VERSION, http_status: 412, applies_to: "POST /audit/engagements" }
  - { priority: 7, category: state, check: "Target resource in a legal from-state for the requested transition (per §1.2 preconditions)", error_id: ERR_PLAN_INVALID_STATE, http_status: 409, applies_to: "audit-plan action endpoints" }
  - { priority: 7, category: state, check: "Engagement in the required from-state for the requested transition", error_id: ERR_ENGAGEMENT_INVALID_STATE, http_status: 409, applies_to: "engagement action endpoints; workpaper mutation endpoints; assignment cancel; creates of assignments/workpapers/findings/reports/QA reviews" }
  - { priority: 7, category: state, check: "RiskAssessment is DRAFT", error_id: ERR_RISK_ASSESSMENT_INVALID_STATE, http_status: 409, applies_to: "POST /audit/risk-assessments/{id}/finalize" }
  - { priority: 7, category: state, check: "RatingCriteriaConfig is DRAFT", error_id: ERR_RATING_CONFIG_INVALID_STATE, http_status: 409, applies_to: "POST /audit/rating-criteria-configs/{id}/activate" }
  - { priority: 7, category: state, check: "AuditableEntity is ACTIVE for retire", error_id: ERR_AUDITABLE_ENTITY_INVALID_STATE, http_status: 409, applies_to: "POST /audit/auditable-entities/{id}/retire" }
  - { priority: 7, category: state, check: "Auditor is ACTIVE for deactivate", error_id: ERR_AUDITOR_INACTIVE, http_status: 409, applies_to: "POST /audit/auditors/{id}/deactivate" }
  - { priority: 7, category: state, check: "EngagementAssignment is ACTIVE for cancel", error_id: ERR_ASSIGNMENT_INVALID_STATE, http_status: 409, applies_to: "POST /audit/engagement-assignments/{id}/cancel" }
  - { priority: 7, category: state, check: "Workpaper in required from-state", error_id: ERR_WORKPAPER_INVALID_STATE, http_status: 409, applies_to: "workpaper submit/sign-off/return/revise" }
  - { priority: 7, category: state, check: "Workpaper not locked by an issued report", error_id: ERR_WORKPAPER_LOCKED, http_status: 409, applies_to: "workpaper submit/sign-off/return/revise" }
  - { priority: 7, category: state, check: "Finding in required from-state for issue/escalate", error_id: ERR_FINDING_INVALID_STATE, http_status: 409, applies_to: "POST /audit/findings/{id}/issue; POST /audit/findings/{id}/escalate" }
  - { priority: 7, category: state, check: "Finding awaiting a management response (PENDING_RESPONSE or REBUTTED) for response creation", error_id: ERR_FINDING_NOT_AWAITING_RESPONSE, http_status: 409, applies_to: "POST /audit/management-responses" }
  - { priority: 7, category: state, check: "ManagementResponse is SUBMITTED", error_id: ERR_RESPONSE_INVALID_STATE, http_status: 409, applies_to: "management-response accept/rebut" }
  - { priority: 7, category: state, check: "ActionPlan in required from-state", error_id: ERR_ACTION_PLAN_INVALID_STATE, http_status: 409, applies_to: "action-plan start/submit-validation/validate/reject-validation; POST /audit/extension-requests" }
  - { priority: 7, category: state, check: "ExtensionRequest is PENDING", error_id: ERR_EXTENSION_INVALID_STATE, http_status: 409, applies_to: "extension-request approve/deny" }
  - { priority: 7, category: state, check: "AuditReport in required from-state", error_id: ERR_REPORT_INVALID_STATE, http_status: 409, applies_to: "audit-report submit/approve/return/issue/distribute" }
  - { priority: 7, category: state, check: "QAReview in required from-state", error_id: ERR_QA_REVIEW_INVALID_STATE, http_status: 409, applies_to: "qa-review begin/complete" }
  - { priority: 7, category: state, check: "CommitteePack in required from-state", error_id: ERR_PACK_INVALID_STATE, http_status: 409, applies_to: "committee-pack finalize/present" }
  - { priority: 8, category: business_safety, check: "Plan approver X-User-ID != submitted_by_user_id (segregation of duties)", error_id: ERR_PLAN_SELF_APPROVAL, http_status: 403, applies_to: "POST /audit/audit-plans/{id}/approve" }
  - { priority: 8, category: business_safety, check: "Workpaper reviewer X-User-ID != preparer_auditor_id (segregation of duties)", error_id: ERR_WORKPAPER_SELF_REVIEW, http_status: 403, applies_to: "workpaper sign-off/return" }
  - { priority: 8, category: business_safety, check: "Workpaper submit/revise actor X-User-ID == preparer_auditor_id (ownership)", error_id: ERR_NOT_WORKPAPER_PREPARER, http_status: 403, applies_to: "workpaper submit/revise" }
  - { priority: 8, category: business_safety, check: "Finding issuer X-User-ID != created_by_user_id (segregation of duties)", error_id: ERR_FINDING_SELF_ISSUE, http_status: 403, applies_to: "POST /audit/findings/{id}/issue" }
  - { priority: 8, category: business_safety, check: "QA assessor X-User-ID holds no ACTIVE EngagementAssignment on the reviewed engagement (independence)", error_id: ERR_QA_ASSESSOR_ASSIGNED, http_status: 403, applies_to: "POST /audit/qa-reviews/{id}/begin" }
  - { priority: 8, category: business_safety, check: "QA completion actor X-User-ID == assessor_auditor_id (ownership)", error_id: ERR_NOT_QA_ASSESSOR, http_status: 403, applies_to: "POST /audit/qa-reviews/{id}/complete" }
  - { priority: 9, category: business_constraint, check: "Plan has >= 1 non-CANCELLED engagement at submit", error_id: ERR_PLAN_EMPTY, http_status: 422, applies_to: "POST /audit/audit-plans/{id}/submit" }
  - { priority: 9, category: business_constraint, check: "All plan engagements terminal at plan close", error_id: ERR_PLAN_HAS_OPEN_ENGAGEMENTS, http_status: 409, applies_to: "POST /audit/audit-plans/{id}/close" }
  - { priority: 9, category: business_constraint, check: "No DRAFT RiskAssessment already exists for (auditable_entity_id, fiscal_year)", error_id: ERR_RISK_ASSESSMENT_DRAFT_EXISTS, http_status: 409, applies_to: "POST /audit/risk-assessments" }
  - { priority: 9, category: business_constraint, check: "No FINALIZED RiskAssessment exists for (auditable_entity_id, fiscal_year) at create and finalize", error_id: ERR_RISK_ASSESSMENT_ALREADY_FINALIZED, http_status: 409, applies_to: "POST /audit/risk-assessments; POST /audit/risk-assessments/{id}/finalize" }
  - { priority: 9, category: business_constraint, check: "Config bands strictly increasing 1 <= moderate_min < high_min < critical_min <= 25", error_id: ERR_CONFIG_BANDS_INVALID, http_status: 422, applies_to: "POST /audit/rating-criteria-configs; POST /audit/rating-criteria-configs/{id}/activate" }
  - { priority: 9, category: business_constraint, check: "No ACTIVE assignment of the same auditor to the same engagement", error_id: ERR_DUPLICATE_ASSIGNMENT, http_status: 409, applies_to: "POST /audit/engagement-assignments" }
  - { priority: 9, category: business_constraint, check: "Half-open window overlap: no other ACTIVE assignment of the auditor with start < new.end AND new.start < end (adjacent windows allowed)", error_id: ERR_ASSIGNMENT_OVERLAP, http_status: 409, applies_to: "POST /audit/engagement-assignments" }
  - { priority: 9, category: business_constraint, check: "Cooling period on AuditableEntity: rejected if any non-CANCELLED engagement of the same entity violates (other.end_date + 90 days <= new.start_date) OR (new.end_date + 90 days <= other.start_date); i.e., a 90-day buffer gap is required between windows (adjacency inside the buffer rejected)", error_id: ERR_ENGAGEMENT_COOLING_PERIOD, http_status: 409, applies_to: "POST /audit/engagements" }
  - { priority: 9, category: business_constraint, check: "No QAReview of the engagement in {SCHEDULED, IN_PROGRESS}", error_id: ERR_QA_REVIEW_ALREADY_OPEN, http_status: 409, applies_to: "POST /audit/qa-reviews" }
  - { priority: 9, category: business_constraint, check: "No PENDING ExtensionRequest already exists for the action plan", error_id: ERR_EXTENSION_ALREADY_PENDING, http_status: 409, applies_to: "POST /audit/extension-requests" }
  - { priority: 9, category: business_constraint, check: "ActionPlan.extension_count < 2", error_id: ERR_EXTENSION_COUNT_EXCEEDED, http_status: 422, applies_to: "POST /audit/extension-requests; POST /audit/extension-requests/{id}/approve" }
  - { priority: 9, category: business_constraint, check: "cumulative_extended_days + requested shift <= 180 (inclusive boundary)", error_id: ERR_EXTENSION_CUMULATIVE_CAP_EXCEEDED, http_status: 422, applies_to: "POST /audit/extension-requests; POST /audit/extension-requests/{id}/approve" }
  - { priority: 9, category: business_constraint, check: "No open engagements of the entity at retire", error_id: ERR_ENTITY_HAS_OPEN_ENGAGEMENTS, http_status: 409, applies_to: "POST /audit/auditable-entities/{id}/retire" }
  - { priority: 9, category: business_constraint, check: "No other report of the engagement already ISSUED/DISTRIBUTED; also blocks new findings once the engagement report is issued", error_id: ERR_REPORT_ALREADY_ISSUED, http_status: 409, applies_to: "POST /audit/audit-reports/{id}/issue; POST /audit/findings" }
  - { priority: 9, category: business_constraint, check: "All plan engagements terminal is enforced at close; a plan in SUBMITTED freezes roster changes (engagement create allowed only when plan status IN {DRAFT, RETURNED, APPROVED})", error_id: ERR_PLAN_INVALID_STATE, http_status: 409, applies_to: "POST /audit/engagements" }
  - { priority: 10, category: business_temporal, check: "end_date > start_date", error_id: ERR_ENGAGEMENT_WINDOW_INVALID, http_status: 422, applies_to: "POST /audit/engagements" }
  - { priority: 10, category: business_temporal, check: "Assignment end_date > start_date", error_id: ERR_ASSIGNMENT_WINDOW_INVALID, http_status: 422, applies_to: "POST /audit/engagement-assignments" }
  - { priority: 10, category: business_temporal, check: "requested_due_date > current ActionPlan.due_date (strictly monotonic shifts)", error_id: ERR_EXTENSION_NOT_MONOTONIC, http_status: 422, applies_to: "POST /audit/extension-requests; POST /audit/extension-requests/{id}/approve" }
  - { priority: 10, category: business_temporal, check: "ActionPlan due_date strictly after the logical clock's current instant", error_id: ERR_DUE_DATE_NOT_FUTURE, http_status: 422, applies_to: "POST /audit/action-plans" }
  - { priority: 11, category: business_referential, check: "AuditableEntity is ACTIVE when referenced by new risk assessments/engagements", error_id: ERR_AUDITABLE_ENTITY_RETIRED, http_status: 409, applies_to: "POST /audit/risk-assessments; POST /audit/engagements" }
  - { priority: 11, category: business_referential, check: "An ACTIVE RatingCriteriaConfig exists at finding creation (pinned)", error_id: ERR_NO_ACTIVE_RATING_CONFIG, http_status: 422, applies_to: "POST /audit/findings" }
  - { priority: 11, category: business_referential, check: "Linked workpaper (when provided) belongs to the same engagement and is SIGNED_OFF at finding create and at issue", error_id: ERR_WORKPAPER_NOT_SIGNED, http_status: 422, applies_to: "POST /audit/findings; POST /audit/findings/{id}/issue" }
  - { priority: 11, category: business_referential, check: "Workpaper preparer holds an ACTIVE EngagementAssignment on the engagement", error_id: ERR_PREPARER_NOT_ASSIGNED, http_status: 422, applies_to: "POST /audit/workpapers" }
  - { priority: 11, category: business_referential, check: ">= 1 ACTIVE LEAD assignment at begin-fieldwork", error_id: ERR_NO_LEAD_ASSIGNED, http_status: 422, applies_to: "POST /audit/engagements/{id}/begin-fieldwork" }
  - { priority: 11, category: business_referential, check: "AuditPlan.status == APPROVED at begin-fieldwork and at committee-pack creation (plan IN {APPROVED, CLOSED})", error_id: ERR_PLAN_NOT_APPROVED, http_status: 409, applies_to: "POST /audit/engagements/{id}/begin-fieldwork; POST /audit/committee-packs" }
  - { priority: 11, category: business_referential, check: ">= 1 SIGNED_OFF workpaper at begin-reporting", error_id: ERR_NO_SIGNED_WORKPAPERS, http_status: 422, applies_to: "POST /audit/engagements/{id}/begin-reporting" }
  - { priority: 11, category: business_referential, check: "All workpapers SIGNED_OFF at begin-reporting (none DRAFT, SUBMITTED, or RETURNED)", error_id: ERR_WORKPAPERS_PENDING_REVIEW, http_status: 422, applies_to: "POST /audit/engagements/{id}/begin-reporting" }
  - { priority: 11, category: business_referential, check: "An ISSUED or DISTRIBUTED report exists at engagement close", error_id: ERR_REPORT_NOT_ISSUED, http_status: 422, applies_to: "POST /audit/engagements/{id}/close" }
  - { priority: 11, category: business_referential, check: "No QAReview in {SCHEDULED, IN_PROGRESS} at engagement close", error_id: ERR_QA_REVIEW_OPEN, http_status: 422, applies_to: "POST /audit/engagements/{id}/close" }
  - { priority: 11, category: business_referential, check: "All engagement findings in {AGREED, ESCALATED, FINAL} at report issue", error_id: ERR_FINDINGS_NOT_RESOLVED, http_status: 422, applies_to: "POST /audit/audit-reports/{id}/issue" }
  - { priority: 11, category: business_referential, check: "Finding.status IN {UNDER_REVIEW, AGREED} at action-plan creation", error_id: ERR_FINDING_INVALID_STATE, http_status: 409, applies_to: "POST /audit/action-plans" }
  - { priority: 11, category: business_referential, check: "Finding.status == AGREED at action-plan start", error_id: ERR_FINDING_NOT_AGREED, http_status: 422, applies_to: "POST /audit/action-plans/{id}/start" }
  - { priority: 11, category: business_referential, check: "Rebuttal allowed only while Finding.negotiation_rounds < 3", error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http_status: 422, applies_to: "POST /audit/management-responses/{id}/rebut" }
  - { priority: 11, category: business_referential, check: "Escalation requires negotiation_rounds >= 3", error_id: ERR_NEGOTIATION_ROUNDS_NOT_EXHAUSTED, http_status: 422, applies_to: "POST /audit/findings/{id}/escalate" }
  - { priority: 11, category: business_referential, check: "distribution_list non-empty at distribute", error_id: ERR_DISTRIBUTION_LIST_EMPTY, http_status: 422, applies_to: "POST /audit/audit-reports/{id}/distribute" }
  - { priority: 12, category: business_fiscal, check: "At sign-off: actual_hours + ceil(hours_worked*2)/2 <= budget_hours * 1.10 (fiscal check evaluated last, after SoD)", error_id: ERR_BUDGET_HOURS_EXCEEDED, http_status: 422, applies_to: "POST /audit/workpapers/{id}/sign-off" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- AuditableEntity ---
  - { method: POST, path: "/audit/auditable-entities", description: "Create an audit-universe entry", roles: [AuditAdmin], code: 201, input: [name, business_owner, "regulatory_scrutiny?", "last_audit_completed_at?"], output: AuditableEntity, side_effects: ["status=ACTIVE, version=1"] }
  - { method: GET, path: "/audit/auditable-entities/{id}", description: "Get an auditable entity", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: AuditableEntity, side_effects: [] }
  - { method: POST, path: "/audit/auditable-entities/{id}/retire", description: "Retire (soft-archive) an entity; blocked while engagements open", roles: [AuditAdmin], code: 200, input: [], output: AuditableEntity, side_effects: ["status -> RETIRED, retired_at = clock"] }

  # --- RiskAssessment ---
  - { method: POST, path: "/audit/risk-assessments", description: "Create a risk assessment (OCC on entity version); score computed per variant", roles: [AuditManager], code: 201, input: [auditable_entity_id, fiscal_year, likelihood, impact, expected_auditable_entity_version], output: RiskAssessment, side_effects: ["scoring_variant + inherent_risk_score computed (inherent_risk_score calc)", "increments AuditableEntity.version by 1"] }
  - { method: GET, path: "/audit/risk-assessments", description: "List risk assessments", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["auditable_entity_id?", "fiscal_year?", "status?", "limit?", "offset?"], output: "RiskAssessment[]", side_effects: [] }
  - { method: GET, path: "/audit/risk-assessments/{id}", description: "Get a risk assessment", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: RiskAssessment, side_effects: [] }
  - { method: POST, path: "/audit/risk-assessments/{id}/finalize", description: "Finalize a risk assessment; syncs entity risk fields", roles: [AuditManager], code: 200, input: [], output: RiskAssessment, side_effects: ["status -> FINALIZED, finalized_at set", "AuditableEntity.current_inherent_risk_score/current_risk_tier updated when max fiscal_year; increments AuditableEntity.version by 1"] }

  # --- RatingCriteriaConfig ---
  - { method: POST, path: "/audit/rating-criteria-configs", description: "Create a rating-band config", roles: [AuditAdmin], code: 201, input: [name, "critical_min?", "high_min?", "moderate_min?"], output: RatingCriteriaConfig, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/audit/rating-criteria-configs/{id}", description: "Get a rating config", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: RatingCriteriaConfig, side_effects: [] }
  - { method: POST, path: "/audit/rating-criteria-configs/{id}/activate", description: "Activate config; supersedes the previously ACTIVE one", roles: [AuditAdmin], code: 200, input: [], output: RatingCriteriaConfig, side_effects: ["status -> ACTIVE, activated_at set", "prior ACTIVE config -> SUPERSEDED"] }

  # --- AuditPlan ---
  - { method: POST, path: "/audit/audit-plans", description: "Create an annual audit plan", roles: [ChiefAuditExecutive], code: 201, input: [fiscal_year, title], output: AuditPlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/audit/audit-plans/{id}", description: "Get an audit plan", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: AuditPlan, side_effects: [] }
  - { method: POST, path: "/audit/audit-plans/{id}/submit", description: "Submit plan for committee approval (DRAFT or RETURNED)", roles: [ChiefAuditExecutive], code: 200, input: [], output: AuditPlan, side_effects: ["status -> SUBMITTED, submitted_by_user_id/submitted_at set"] }
  - { method: POST, path: "/audit/audit-plans/{id}/approve", description: "Committee approves plan (SoD: approver != submitter)", roles: [AuditCommittee], code: 200, input: [], output: AuditPlan, side_effects: ["status -> APPROVED, approved_by_user_id/approved_at set"] }
  - { method: POST, path: "/audit/audit-plans/{id}/return", description: "Committee returns plan for rework (cycle)", roles: [AuditCommittee], code: 200, input: [], output: AuditPlan, side_effects: ["status -> RETURNED"] }
  - { method: POST, path: "/audit/audit-plans/{id}/close", description: "Close plan at year end (all engagements terminal)", roles: [ChiefAuditExecutive], code: 200, input: [], output: AuditPlan, side_effects: ["status -> CLOSED"] }

  # --- Engagement ---
  - { method: POST, path: "/audit/engagements", description: "Create an engagement under a plan (OCC on plan version; cooling-period and window checks)", roles: [AuditManager], code: 201, input: [audit_plan_id, auditable_entity_id, title, scope_summary, budget_hours, start_date, end_date, "supersedes_engagement_id?", expected_audit_plan_version], output: Engagement, side_effects: ["status=PLANNED, priority_score computed (engagement_priority_score calc)", "increments AuditPlan.version by 1", "AuditPlan.engagement_count and high_risk_coverage_pct recomputed (plan_high_risk_coverage_pct calc)"] }
  - { method: GET, path: "/audit/engagements", description: "List engagements", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["audit_plan_id?", "auditable_entity_id?", "supersedes_engagement_id?", "status?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: GET, path: "/audit/engagements/{id}", description: "Get an engagement", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/audit/engagements/{id}/scope", description: "Mark engagement scoped", roles: [AuditManager], code: 200, input: [], output: Engagement, side_effects: ["status -> SCOPED"] }
  - { method: POST, path: "/audit/engagements/{id}/begin-fieldwork", description: "Open fieldwork (requires approved plan + LEAD assignment)", roles: [AuditManager], code: 200, input: [], output: Engagement, side_effects: ["status -> FIELDWORK"] }
  - { method: POST, path: "/audit/engagements/{id}/begin-reporting", description: "Open reporting (requires signed workpaper, none pending review)", roles: [AuditManager], code: 200, input: [], output: Engagement, side_effects: ["status -> REPORTING"] }
  - { method: POST, path: "/audit/engagements/{id}/close", description: "Close engagement (report issued, QA settled, findings FINAL)", roles: [AuditManager], code: 200, input: [], output: Engagement, side_effects: ["status -> CLOSED", "AuditableEntity.last_audit_completed_at = clock (bubble up)"] }
  - { method: POST, path: "/audit/engagements/{id}/cancel", description: "Cancel a planned/scoped engagement; cascades to assignments", roles: [AuditManager], code: 200, input: [], output: Engagement, side_effects: ["status -> CANCELLED", "ACTIVE assignments -> CANCELLED; reserved_hours recomputed", "plan aggregates recomputed"] }

  # --- Auditor ---
  - { method: POST, path: "/audit/auditors", description: "Add an auditor to the roster", roles: [AuditAdmin], code: 201, input: [full_name, grade, "skills?"], output: Auditor, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/audit/auditors/{id}", description: "Get an auditor", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: Auditor, side_effects: [] }
  - { method: POST, path: "/audit/auditors/{id}/deactivate", description: "Deactivate an auditor", roles: [AuditAdmin], code: 200, input: [], output: Auditor, side_effects: ["status -> INACTIVE"] }

  # --- EngagementAssignment ---
  - { method: POST, path: "/audit/engagement-assignments", description: "Assign an auditor to an engagement (overlap + duplicate checks)", roles: [AuditManager], code: 201, input: [engagement_id, auditor_id, role_in_engagement, start_date, end_date, allocated_hours], output: EngagementAssignment, side_effects: ["status=ACTIVE", "Engagement.reserved_hours += allocated_hours"] }
  - { method: GET, path: "/audit/engagement-assignments", description: "List assignments", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["engagement_id?", "auditor_id?", "status?", "limit?", "offset?"], output: "EngagementAssignment[]", side_effects: [] }
  - { method: GET, path: "/audit/engagement-assignments/{id}", description: "Get an assignment", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: EngagementAssignment, side_effects: [] }
  - { method: POST, path: "/audit/engagement-assignments/{id}/cancel", description: "Cancel an assignment; releases reserved hours", roles: [AuditManager], code: 200, input: [], output: EngagementAssignment, side_effects: ["status -> CANCELLED", "Engagement.reserved_hours -= allocated_hours"] }

  # --- Workpaper ---
  - { method: POST, path: "/audit/workpapers", description: "Create a workpaper during fieldwork (preparer = caller)", roles: [FieldAuditor], code: 201, input: [engagement_id, reference, title, hours_worked], output: Workpaper, side_effects: ["status=DRAFT, preparer_auditor_id = X-User-ID", "Engagement.provisional_hours recomputed (DRAFT excluded until submit)"] }
  - { method: GET, path: "/audit/workpapers", description: "List workpapers", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["engagement_id?", "preparer_auditor_id?", "reviewer_auditor_id?", "status?", "limit?", "offset?"], output: "Workpaper[]", side_effects: [] }
  - { method: GET, path: "/audit/workpapers/{id}", description: "Get a workpaper", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: Workpaper, side_effects: [] }
  - { method: POST, path: "/audit/workpapers/{id}/submit", description: "Preparer submits workpaper for review", roles: [FieldAuditor], code: 200, input: [], output: Workpaper, side_effects: ["status -> SUBMITTED", "provisional_hours recomputed"] }
  - { method: POST, path: "/audit/workpapers/{id}/sign-off", description: "Reviewer signs off (SoD: reviewer != preparer; fiscal budget gate)", roles: [AuditManager], code: 200, input: [], output: Workpaper, side_effects: ["status -> SIGNED_OFF, reviewer_auditor_id/signed_off_at set", "signed_off_workpaper_count += 1; actual_hours/provisional_hours recomputed (engagement_hours_rollup calc)"] }
  - { method: POST, path: "/audit/workpapers/{id}/return", description: "Reviewer returns workpaper (from SUBMITTED or SIGNED_OFF)", roles: [AuditManager], code: 200, input: [note], output: Workpaper, side_effects: ["status -> RETURNED, review_note set, signed_off_at cleared", "if was SIGNED_OFF: signed_off_workpaper_count -= 1; rollups recomputed"] }
  - { method: POST, path: "/audit/workpapers/{id}/revise", description: "Preparer reopens a returned workpaper", roles: [FieldAuditor], code: 200, input: [], output: Workpaper, side_effects: ["status -> DRAFT, review_note cleared"] }

  # --- Finding ---
  - { method: POST, path: "/audit/findings", description: "Raise a finding (severity pinned via ACTIVE config)", roles: [FieldAuditor], code: 201, input: [engagement_id, title, likelihood, impact, "workpaper_id?"], output: Finding, side_effects: ["status=DRAFT, created_by_user_id = X-User-ID", "rating_criteria_config_id pinned to ACTIVE config; composite_score/severity computed (finding_severity_rating calc)", "Engagement.open_finding_count recomputed"] }
  - { method: GET, path: "/audit/findings", description: "List findings", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["engagement_id?", "workpaper_id?", "rating_criteria_config_id?", "status?", "severity?", "limit?", "offset?"], output: "Finding[]", side_effects: [] }
  - { method: GET, path: "/audit/findings/{id}", description: "Get a finding", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: Finding, side_effects: [] }
  - { method: POST, path: "/audit/findings/{id}/issue", description: "Issue finding to management (SoD: issuer != creator)", roles: [AuditManager], code: 200, input: [], output: Finding, side_effects: ["status -> PENDING_RESPONSE"] }
  - { method: POST, path: "/audit/findings/{id}/escalate", description: "Escalate a deadlocked finding (rounds >= 3)", roles: [ChiefAuditExecutive], code: 200, input: [], output: Finding, side_effects: ["status -> ESCALATED"] }

  # --- ManagementResponse ---
  - { method: POST, path: "/audit/management-responses", description: "Management responds to a finding (moves finding to UNDER_REVIEW)", roles: [ManagementOwner], code: 201, input: [finding_id, response_text, proposed_due_date], output: ManagementResponse, side_effects: ["status=SUBMITTED, responder_user_id = X-User-ID", "Finding PENDING_RESPONSE/REBUTTED -> UNDER_REVIEW"] }
  - { method: GET, path: "/audit/management-responses", description: "List management responses", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["finding_id?", "status?", "limit?", "offset?"], output: "ManagementResponse[]", side_effects: [] }
  - { method: GET, path: "/audit/management-responses/{id}", description: "Get a management response", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: ManagementResponse, side_effects: [] }
  - { method: POST, path: "/audit/management-responses/{id}/accept", description: "Audit accepts the response (finding AGREED)", roles: [AuditManager], code: 200, input: [], output: ManagementResponse, side_effects: ["status -> ACCEPTED, reviewed_by_user_id set", "Finding UNDER_REVIEW -> AGREED"] }
  - { method: POST, path: "/audit/management-responses/{id}/rebut", description: "Audit rebuts the response (negotiation round++)", roles: [AuditManager], code: 200, input: [rebuttal_note], output: ManagementResponse, side_effects: ["status -> REBUTTED, reviewed_by_user_id set", "Finding UNDER_REVIEW -> REBUTTED; negotiation_rounds += 1"] }

  # --- ActionPlan ---
  - { method: POST, path: "/audit/action-plans", description: "Create a remediation action plan for a finding under review or agreed", roles: [ManagementOwner], code: 201, input: [finding_id, description, owner_name, due_date], output: ActionPlan, side_effects: ["status=OPEN, original_due_date = due_date", "Finding.open_overdue_action_count recomputed"] }
  - { method: GET, path: "/audit/action-plans", description: "List action plans", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["finding_id?", "status?", "limit?", "offset?"], output: "ActionPlan[]", side_effects: [] }
  - { method: GET, path: "/audit/action-plans/{id}", description: "Get an action plan", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: ActionPlan, side_effects: [] }
  - { method: POST, path: "/audit/action-plans/{id}/start", description: "Start remediation (requires finding AGREED)", roles: [ManagementOwner], code: 200, input: [], output: ActionPlan, side_effects: ["status -> IN_PROGRESS"] }
  - { method: POST, path: "/audit/action-plans/{id}/submit-validation", description: "Submit completed plan for audit validation", roles: [ManagementOwner], code: 200, input: [], output: ActionPlan, side_effects: ["status -> SUBMITTED_FOR_VALIDATION"] }
  - { method: POST, path: "/audit/action-plans/{id}/validate", description: "Audit validates closure evidence", roles: [AuditManager], code: 200, input: [], output: ActionPlan, side_effects: ["status -> VALIDATED, validated_by/at set", "Finding.open_overdue_action_count recomputed"] }
  - { method: POST, path: "/audit/action-plans/{id}/reject-validation", description: "Audit rejects closure evidence (rework loop)", roles: [AuditManager], code: 200, input: [rejection_note], output: ActionPlan, side_effects: ["status -> IN_PROGRESS"] }

  # --- ExtensionRequest ---
  - { method: POST, path: "/audit/extension-requests", description: "Request a due-date extension (caps: 2 approvals, 180 cumulative days)", roles: [ManagementOwner], code: 201, input: [action_plan_id, requested_due_date, reason], output: ExtensionRequest, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/audit/extension-requests", description: "List extension requests", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["action_plan_id?", "status?", "limit?", "offset?"], output: "ExtensionRequest[]", side_effects: [] }
  - { method: GET, path: "/audit/extension-requests/{id}", description: "Get an extension request", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: ExtensionRequest, side_effects: [] }
  - { method: POST, path: "/audit/extension-requests/{id}/approve", description: "Approve extension (cascades to action plan due date and finding overdue count)", roles: [ChiefAuditExecutive], code: 200, input: [], output: ExtensionRequest, side_effects: ["status -> APPROVED, approved_days computed", "ActionPlan.due_date/extension_count/cumulative_extended_days mutated", "Finding.open_overdue_action_count recomputed"] }
  - { method: POST, path: "/audit/extension-requests/{id}/deny", description: "Deny extension", roles: [ChiefAuditExecutive], code: 200, input: [], output: ExtensionRequest, side_effects: ["status -> DENIED, decided_by_user_id set"] }

  # --- AuditReport ---
  - { method: POST, path: "/audit/audit-reports", description: "Draft an audit report for an engagement in REPORTING", roles: [AuditManager], code: 201, input: [engagement_id, title, "overall_conclusion?"], output: AuditReport, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/audit/audit-reports", description: "List audit reports", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["engagement_id?", "status?", "limit?", "offset?"], output: "AuditReport[]", side_effects: [] }
  - { method: GET, path: "/audit/audit-reports/{id}", description: "Get an audit report", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: AuditReport, side_effects: [] }
  - { method: POST, path: "/audit/audit-reports/{id}/submit", description: "Submit draft report for CAE approval", roles: [AuditManager], code: 200, input: [], output: AuditReport, side_effects: ["status -> PENDING_APPROVAL"] }
  - { method: POST, path: "/audit/audit-reports/{id}/approve", description: "CAE approves report", roles: [ChiefAuditExecutive], code: 200, input: [], output: AuditReport, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/audit/audit-reports/{id}/return", description: "CAE returns report to draft (revision loop)", roles: [ChiefAuditExecutive], code: 200, input: [], output: AuditReport, side_effects: ["status -> DRAFT"] }
  - { method: POST, path: "/audit/audit-reports/{id}/issue", description: "Issue report (findings -> FINAL, workpapers locked)", roles: [ChiefAuditExecutive], code: 200, input: [], output: AuditReport, side_effects: ["status -> ISSUED, issued_at set", "Findings {AGREED, ESCALATED} -> FINAL", "Workpapers locked = true"] }
  - { method: POST, path: "/audit/audit-reports/{id}/distribute", description: "Distribute issued report", roles: [ChiefAuditExecutive], code: 200, input: [distribution_list], output: AuditReport, side_effects: ["status -> DISTRIBUTED, distributed_at/distribution_list set"] }

  # --- QAReview ---
  - { method: POST, path: "/audit/qa-reviews", description: "Schedule a QA/external assessment for an engagement in REPORTING or CLOSED", roles: [ChiefAuditExecutive], code: 201, input: [engagement_id, scope], output: QAReview, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/audit/qa-reviews", description: "List QA reviews", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["engagement_id?", "assessor_auditor_id?", "status?", "limit?", "offset?"], output: "QAReview[]", side_effects: [] }
  - { method: GET, path: "/audit/qa-reviews/{id}", description: "Get a QA review", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: QAReview, side_effects: [] }
  - { method: POST, path: "/audit/qa-reviews/{id}/begin", description: "Assessor begins review (independence: no assignment on engagement)", roles: [QualityAssessor], code: 200, input: [], output: QAReview, side_effects: ["status -> IN_PROGRESS, assessor_auditor_id = X-User-ID"] }
  - { method: POST, path: "/audit/qa-reviews/{id}/complete", description: "Assessor completes review with dimension scores; FAIL regresses engagement", roles: [QualityAssessor], code: 200, input: [doc_quality_score, fieldwork_quality_score, reporting_quality_score, independence_score], output: QAReview, side_effects: ["status -> COMPLETED, overall_score/rating computed (qa_rating_determination calc), completed_at set", "on FAIL + engagement REPORTING: regression cascade (engagement -> FIELDWORK, SIGNED_OFF workpapers -> RETURNED, PENDING_APPROVAL report -> DRAFT, DRAFT committee packs -> is_stale_snapshot=true)"] }

  # --- CommitteePack ---
  - { method: POST, path: "/audit/committee-packs", description: "Create a committee reporting pack for an approved/closed plan", roles: [ChiefAuditExecutive], code: 201, input: [audit_plan_id, meeting_date, title], output: CommitteePack, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/audit/committee-packs", description: "List committee packs", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: ["audit_plan_id?", "status?", "limit?", "offset?"], output: "CommitteePack[]", side_effects: [] }
  - { method: GET, path: "/audit/committee-packs/{id}", description: "Get a committee pack", roles: [AuditAdmin, ChiefAuditExecutive, AuditCommittee, AuditManager, FieldAuditor, QualityAssessor, ManagementOwner], code: 200, input: [], output: CommitteePack, side_effects: [] }
  - { method: POST, path: "/audit/committee-packs/{id}/finalize", description: "Finalize pack; pins snapshot aggregates (version pinning)", roles: [ChiefAuditExecutive], code: 200, input: [], output: CommitteePack, side_effects: ["status -> FINALIZED, snapshot fields computed and pinned (committee_pack_snapshot calc), finalized_at set"] }
  - { method: POST, path: "/audit/committee-packs/{id}/present", description: "Committee marks pack presented", roles: [AuditCommittee], code: 200, input: [], output: CommitteePack, side_effects: ["status -> PRESENTED, presented_at set"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the logical clock reads that default and never falls back to wall-clock time.", roles: [AuditAdmin], code: 200, input: [to_iso8601], output: { current_utc: "string" }, side_effects: ["logical clock advanced; overdue/aging derivations use this clock"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's allowed roles" }
  - { id: ERR_ROLE_GRADE_MISMATCH, http: 403, condition: "Entity-backed role's Auditor record fails the grade/status mapping (AuditManager: MANAGER/DIRECTOR; FieldAuditor: STAFF/SENIOR/MANAGER; QualityAssessor: MANAGER/DIRECTOR; all require status ACTIVE)" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown/read-only field, or invalid enum value" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "A 1..5 score field (risk/finding likelihood/impact, QA dimension) is out of range" }
  # --- OCC ---
  - { id: ERR_STALE_ENTITY_VERSION, http: 412, condition: "expected_auditable_entity_version != current AuditableEntity.version on POST /audit/risk-assessments" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_audit_plan_version != current AuditPlan.version on POST /audit/engagements" }
  # --- not found ---
  - { id: ERR_AUDITABLE_ENTITY_NOT_FOUND, http: 404, condition: "AuditableEntity id (path or auditable_entity_id) does not exist" }
  - { id: ERR_RISK_ASSESSMENT_NOT_FOUND, http: 404, condition: "RiskAssessment id does not exist" }
  - { id: ERR_RATING_CONFIG_NOT_FOUND, http: 404, condition: "RatingCriteriaConfig id does not exist" }
  - { id: ERR_AUDIT_PLAN_NOT_FOUND, http: 404, condition: "AuditPlan id (path or audit_plan_id) does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "Engagement id (path, engagement_id, or supersedes_engagement_id) does not exist" }
  - { id: ERR_AUDITOR_NOT_FOUND, http: 404, condition: "Auditor id (path or auditor_id) does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "EngagementAssignment id does not exist" }
  - { id: ERR_WORKPAPER_NOT_FOUND, http: 404, condition: "Workpaper id (path or workpaper_id) does not exist" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "Finding id (path or finding_id) does not exist" }
  - { id: ERR_MANAGEMENT_RESPONSE_NOT_FOUND, http: 404, condition: "ManagementResponse id does not exist" }
  - { id: ERR_ACTION_PLAN_NOT_FOUND, http: 404, condition: "ActionPlan id (path or action_plan_id) does not exist" }
  - { id: ERR_EXTENSION_REQUEST_NOT_FOUND, http: 404, condition: "ExtensionRequest id does not exist" }
  - { id: ERR_AUDIT_REPORT_NOT_FOUND, http: 404, condition: "AuditReport id does not exist" }
  - { id: ERR_QA_REVIEW_NOT_FOUND, http: 404, condition: "QAReview id does not exist" }
  - { id: ERR_COMMITTEE_PACK_NOT_FOUND, http: 404, condition: "CommitteePack id does not exist" }
  # --- state ---
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "AuditPlan not in the required from-state (incl. engagement creation while plan is SUBMITTED or CLOSED)" }
  - { id: ERR_ENGAGEMENT_INVALID_STATE, http: 409, condition: "Engagement not in the required from-state (incl. workpaper/assignment ops outside FIELDWORK, report create outside REPORTING)" }
  - { id: ERR_RISK_ASSESSMENT_INVALID_STATE, http: 409, condition: "RiskAssessment not DRAFT for finalize" }
  - { id: ERR_RATING_CONFIG_INVALID_STATE, http: 409, condition: "RatingCriteriaConfig not DRAFT for activate" }
  - { id: ERR_AUDITABLE_ENTITY_INVALID_STATE, http: 409, condition: "AuditableEntity not ACTIVE for retire" }
  - { id: ERR_AUDITOR_INACTIVE, http: 409, condition: "Auditor INACTIVE (deactivate of inactive auditor, or assignment to one)" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "EngagementAssignment not ACTIVE for cancel" }
  - { id: ERR_WORKPAPER_INVALID_STATE, http: 409, condition: "Workpaper not in the required from-state" }
  - { id: ERR_WORKPAPER_LOCKED, http: 409, condition: "Workpaper locked by an issued report; all mutations rejected" }
  - { id: ERR_FINDING_INVALID_STATE, http: 409, condition: "Finding not in the required from-state for issue/escalate" }
  - { id: ERR_FINDING_NOT_AWAITING_RESPONSE, http: 409, condition: "Finding not in {PENDING_RESPONSE, REBUTTED} for response creation" }
  - { id: ERR_RESPONSE_INVALID_STATE, http: 409, condition: "ManagementResponse not SUBMITTED for accept/rebut" }
  - { id: ERR_ACTION_PLAN_INVALID_STATE, http: 409, condition: "ActionPlan not in the required from-state (also gates extension creation to OPEN/IN_PROGRESS)" }
  - { id: ERR_EXTENSION_INVALID_STATE, http: 409, condition: "ExtensionRequest not PENDING for approve/deny" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "AuditReport not in the required from-state" }
  - { id: ERR_QA_REVIEW_INVALID_STATE, http: 409, condition: "QAReview not in the required from-state" }
  - { id: ERR_PACK_INVALID_STATE, http: 409, condition: "CommitteePack not in the required from-state" }
  # --- segregation of duties / ownership ---
  - { id: ERR_PLAN_SELF_APPROVAL, http: 403, condition: "Plan approver X-User-ID equals submitted_by_user_id" }
  - { id: ERR_WORKPAPER_SELF_REVIEW, http: 403, condition: "Workpaper sign-off/return by the preparer (X-User-ID == preparer_auditor_id)" }
  - { id: ERR_NOT_WORKPAPER_PREPARER, http: 403, condition: "Workpaper submit/revise by someone other than the preparer" }
  - { id: ERR_FINDING_SELF_ISSUE, http: 403, condition: "Finding issued by its creator (X-User-ID == created_by_user_id)" }
  - { id: ERR_QA_ASSESSOR_ASSIGNED, http: 403, condition: "QA assessor holds an ACTIVE EngagementAssignment on the reviewed engagement" }
  - { id: ERR_NOT_QA_ASSESSOR, http: 403, condition: "QA completion by someone other than the assigned assessor" }
  # --- business constraint ---
  - { id: ERR_PLAN_EMPTY, http: 422, condition: "Plan submit with engagement_count == 0" }
  - { id: ERR_PLAN_HAS_OPEN_ENGAGEMENTS, http: 409, condition: "Plan close while any engagement is not in {CLOSED, CANCELLED}" }
  - { id: ERR_RISK_ASSESSMENT_DRAFT_EXISTS, http: 409, condition: "A DRAFT RiskAssessment already exists for (auditable_entity_id, fiscal_year)" }
  - { id: ERR_RISK_ASSESSMENT_ALREADY_FINALIZED, http: 409, condition: "A FINALIZED RiskAssessment already exists for (auditable_entity_id, fiscal_year)" }
  - { id: ERR_CONFIG_BANDS_INVALID, http: 422, condition: "Rating bands not strictly increasing within 1..25" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "Auditor already has an ACTIVE assignment on this engagement" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Half-open window [start,end) collides with another ACTIVE assignment of the auditor; touching windows allowed" }
  - { id: ERR_ENGAGEMENT_COOLING_PERIOD, http: 409, condition: "New engagement window violates the 90-day buffer-gap rule versus an existing non-CANCELLED engagement of the same AuditableEntity" }
  - { id: ERR_QA_REVIEW_ALREADY_OPEN, http: 409, condition: "A QAReview for the engagement is already SCHEDULED or IN_PROGRESS" }
  - { id: ERR_EXTENSION_ALREADY_PENDING, http: 409, condition: "A PENDING ExtensionRequest already exists for the action plan" }
  - { id: ERR_EXTENSION_COUNT_EXCEEDED, http: 422, condition: "ActionPlan.extension_count already 2 (cap reached)" }
  - { id: ERR_EXTENSION_CUMULATIVE_CAP_EXCEEDED, http: 422, condition: "Requested shift would push cumulative_extended_days past 180 (180 itself allowed)" }
  - { id: ERR_ENTITY_HAS_OPEN_ENGAGEMENTS, http: 409, condition: "Retire blocked by engagements in {PLANNED, SCOPED, FIELDWORK, REPORTING}" }
  - { id: ERR_REPORT_ALREADY_ISSUED, http: 409, condition: "Another report of the engagement is already ISSUED or DISTRIBUTED; also raised when a finding is created after the engagement report issuance freeze" }
  # --- business temporal ---
  - { id: ERR_ENGAGEMENT_WINDOW_INVALID, http: 422, condition: "Engagement end_date <= start_date" }
  - { id: ERR_ASSIGNMENT_WINDOW_INVALID, http: 422, condition: "Assignment end_date <= start_date" }
  - { id: ERR_EXTENSION_NOT_MONOTONIC, http: 422, condition: "requested_due_date <= current ActionPlan.due_date" }
  - { id: ERR_DUE_DATE_NOT_FUTURE, http: 422, condition: "ActionPlan due_date not strictly after the logical clock" }
  # --- business referential ---
  - { id: ERR_AUDITABLE_ENTITY_RETIRED, http: 409, condition: "New risk assessment or engagement references a RETIRED AuditableEntity" }
  - { id: ERR_NO_ACTIVE_RATING_CONFIG, http: 422, condition: "No ACTIVE RatingCriteriaConfig exists at finding creation" }
  - { id: ERR_WORKPAPER_NOT_SIGNED, http: 422, condition: "Linked workpaper missing, belongs to another engagement, or not SIGNED_OFF (at finding create/issue)" }
  - { id: ERR_PREPARER_NOT_ASSIGNED, http: 422, condition: "Workpaper creator holds no ACTIVE EngagementAssignment on the engagement" }
  - { id: ERR_NO_LEAD_ASSIGNED, http: 422, condition: "begin-fieldwork without an ACTIVE LEAD assignment" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "begin-fieldwork requires APPROVED plan; committee-pack creation requires plan in {APPROVED, CLOSED}" }
  - { id: ERR_NO_SIGNED_WORKPAPERS, http: 422, condition: "begin-reporting with signed_off_workpaper_count == 0" }
  - { id: ERR_WORKPAPERS_PENDING_REVIEW, http: 422, condition: "begin-reporting while any workpaper is DRAFT, SUBMITTED, or RETURNED (all must be SIGNED_OFF)" }

  - { id: ERR_REPORT_NOT_ISSUED, http: 422, condition: "Engagement close without an ISSUED/DISTRIBUTED report" }
  - { id: ERR_QA_REVIEW_OPEN, http: 422, condition: "Engagement close with a QAReview in {SCHEDULED, IN_PROGRESS}" }
  - { id: ERR_FINDINGS_NOT_RESOLVED, http: 422, condition: "Report issue with findings outside {AGREED, ESCALATED, FINAL}" }
  - { id: ERR_FINDING_NOT_AGREED, http: 422, condition: "Action-plan start while finding is not AGREED" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http: 422, condition: "Rebuttal attempted when negotiation_rounds == 3; or response creation when rounds exhausted (escalation is the only path)" }
  - { id: ERR_NEGOTIATION_ROUNDS_NOT_EXHAUSTED, http: 422, condition: "Escalation attempted while negotiation_rounds < 3" }
  - { id: ERR_DISTRIBUTION_LIST_EMPTY, http: 422, condition: "distribute with an empty distribution_list" }
  # --- business fiscal ---
  - { id: ERR_BUDGET_HOURS_EXCEEDED, http: 422, condition: "Sign-off would push actual_hours beyond budget_hours * 1.10" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AuditAdmin
    description: "Internal-audit operations administrator: maintains the audit universe, rating criteria, auditor roster, and the test-driving logical clock"
    identity: opaque
    exclusive_operations: ["auditable-entity create/retire", "rating-criteria-config create/activate", "auditor create/deactivate", "logical clock control"]
    shared_operations: [read]
  - name: ChiefAuditExecutive
    description: "Head of internal audit: drafts/submits/closes the annual plan, decides extensions, escalates findings, approves/issues/distributes reports, schedules QA, prepares committee packs"
    identity: opaque
    exclusive_operations: ["audit-plan create/submit/close", "extension-request approve/deny", "finding escalate", "audit-report approve/return/issue/distribute", "qa-review schedule", "committee-pack create/finalize"]
    shared_operations: [read]
  - name: AuditCommittee
    description: "Board audit committee: approves or returns annual plans, marks packs presented"
    identity: opaque
    exclusive_operations: ["audit-plan approve/return", "committee-pack present"]
    shared_operations: [read]
  - name: AuditManager
    description: "Audit manager/director: risk assessments, engagement scoping and staffing, workpaper review sign-off, finding issuance, response adjudication, action-plan validation, report drafting"
    identity: "entity_backed:Auditor"
    exclusive_operations: ["risk-assessment create/finalize", "engagement create/scope/begin-fieldwork/begin-reporting/close/cancel", "engagement-assignment create/cancel", "workpaper sign-off/return", "finding issue", "management-response accept/rebut", "action-plan validate/reject-validation", "audit-report create/submit"]
    shared_operations: [read, "may also act as FieldAuditor when grade is MANAGER (grade overlap enables segregation-of-duties testing)"]
  - name: FieldAuditor
    description: "Fieldwork auditor: prepares workpapers and drafts findings"
    identity: "entity_backed:Auditor"
    exclusive_operations: ["workpaper create/submit/revise", "finding create"]
    shared_operations: [read]
  - name: QualityAssessor
    description: "QA / external assessment reviewer, independent of the engagement team"
    identity: "entity_backed:Auditor"
    exclusive_operations: ["qa-review begin/complete"]
    shared_operations: [read]
  - name: ManagementOwner
    description: "Auditee management: responds to findings, owns action plans, requests due-date extensions"
    identity: opaque
    exclusive_operations: ["management-response create", "action-plan create/start/submit-validation", "extension-request create"]
    shared_operations: [read]
