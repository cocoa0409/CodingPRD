  # ===================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: mv_window_halfopen_adjacency
        grounds:
          - validations[priority=6]
          - entities.MarketVariant.fields.effective_start
          - entities.MarketVariant.fields.effective_end
          - errors[ERR_MARKET_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = (product, target market) effective window; interval semantics =
          HALF-OPEN [start, end) with adjacency allowed: a variant starting exactly at
          another's end (2027-03-01) is accepted, while one overlapping by one month is
          rejected. Differs from audit_facility_buffer_boundary (closed intervals + buffer).
        test_recipe:
          setup:
            - "Client, product Cookie, LOCKED recipe, DATABASE panel, US_FDA RACC, labels LV1 and LV2 both IN_REVIEW, LV3 DRAFT"
            - "MV1 on LV1 -> CA_CFIA [2026-09-01, 2027-03-01); MV2 on LV2 -> CA_CFIA [2027-03-01, open)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
