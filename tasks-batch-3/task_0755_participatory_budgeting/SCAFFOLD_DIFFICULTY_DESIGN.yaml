# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is driven from empty-DB
# by the setup_api_calls chain. Numeric asserts are pre-computed literals.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: cost_estimate_provisional_vs_final_diverge
        grounds:
          - calculations.proposal_cost_estimate
          - entities.Proposal.fields.provisional_estimate_cents
          - entities.Proposal.fields.estimated_cost_cents
        distinguishing_aspect: |
          On the SAME two cost line items, the provisional variant (as-entered
          contingency, no overhead) yields 43598 while the final variant
          (contingency floored to 0.10 plus a single 5% overhead) yields 46723 —
          a dual-variant on the Proposal cost domain, distinct from vote_tally's
          Ballot domain.
        test_recipe:
          setup:
            - "A DEVELOPING proposal with two cost line items (10000x3 @7%, 4999x2 @15%); provisional_estimate_cents already 43598."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BudgetAdmin
            - call: "POST /budget-cycles"
              payload: { name: "PB27", fiscal_year: 2027, total_budget_cents: 500000, voting_method: "ALLOCATION", per_project_cap_cents: 400000, per_voter_allocation_cap_cents: 100000, min_voter_age: 16, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Parks", category_budget_cap_cents: 500000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Rowan", date_of_birth: "1990-01-01", residency_document_ref: "doc-1", residency_address: "1 Main St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /residents/${rid}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /residents/${rid}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "Playground", summary: "New play area" }
              as: Resident
              as_user_id: "${rid}"
              captures: { pid: $.data.id }
            - call: "POST /proposals/${pid}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${pid}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${pid}/cost-line-items"
              payload: { label: "Structure", unit_cost_cents: 10000, quantity: 3, contingency_pct: 0.07 }
              as: Reviewer
            - call: "POST /proposals/${pid}/cost-line-items"
              payload: { label: "Surfacing", unit_cost_cents: 4999, quantity: 2, contingency_pct: 0.15 }
              as: Reviewer
          trigger:
            - call: "POST /proposals/${pid}/finalize-cost"
              payload: {}
              as: Reviewer
          assert:
            - "Proposal.${pid}.provisional_estimate_cents == 43598"
            - "Proposal.${pid}.estimated_cost_cents == 46723"
            - "Proposal.${pid}.status == COSTED"

      - name: vote_tally_ranked_vs_allocation_winner_flips
        grounds:
          - calculations.vote_tally
          - entities.Proposal.fields.vote_score
          - entities.Ballot.fields.method
        distinguishing_aspect: |
          Identical two-voter preferences yield winner A under RANKED
          (A=20 > B=18 Borda points) but winner B under ALLOCATION
          (B=9000 > A=1000 cents) — a dual-variant on the Ballot/vote domain,
          structurally distinct from the Proposal cost domain.
        test_recipe:
          setup:
            - "A RANKED cycle with proposals A_r,B_r ON_BALLOT and two verified residents whose ranked ballots are CAST (A_r ranked 1st by both)."
            - "An ALLOCATION cycle with proposals A_l,B_l ON_BALLOT and the same two residents; r1 allocates 1000 to A_l, r2 allocates 9000 to B_l."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BudgetAdmin
            - call: "POST /residents"
              payload: { full_name: "R1", date_of_birth: "1990-01-01", residency_document_ref: "d1", residency_address: "1 St" }
              as: Anonymous
              captures: { r1: $.data.id }
            - call: "POST /residents/${r1}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /residents/${r1}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /residents"
              payload: { full_name: "R2", date_of_birth: "1991-01-01", residency_document_ref: "d2", residency_address: "2 St" }
              as: Anonymous
              captures: { r2: $.data.id }
            - call: "POST /residents/${r2}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${r2}"
            - call: "POST /residents/${r2}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            # ----- RANKED cycle -----
            - call: "POST /budget-cycles"
              payload: { name: "PB-R", fiscal_year: 2027, total_budget_cents: 1000000, voting_method: "RANKED", per_project_cap_cents: 1000000, per_voter_allocation_cap_cents: 0, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cr: $.data.id }
            - call: "POST /budget-cycles/${cr}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 1000000 }
              as: BudgetAdmin
              captures: { catr: $.data.id }
            - call: "POST /budget-cycles/${cr}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cr}/proposals"
              payload: { category_id: "${catr}", title: "A_r", summary: "a" }
              as: Resident
              as_user_id: "${r1}"
              captures: { ar: $.data.id }
            - call: "POST /budget-cycles/${cr}/proposals"
              payload: { category_id: "${catr}", title: "B_r", summary: "b" }
              as: Resident
              as_user_id: "${r1}"
              captures: { br: $.data.id }
            - call: "POST /proposals/${ar}/submit"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /proposals/${br}/submit"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /budget-cycles/${cr}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${ar}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${br}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${ar}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 1000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${br}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 1000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${ar}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /proposals/${br}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /budget-cycles/${cr}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cr}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
              captures: { b_r1: $.data.id }
            - call: "POST /ballots/${b_r1}/entries"
              payload: { proposal_id: "${ar}", rank: 1 }
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /ballots/${b_r1}/entries"
              payload: { proposal_id: "${br}", rank: 2 }
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /ballots/${b_r1}/cast"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /budget-cycles/${cr}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${r2}"
              captures: { b_r2: $.data.id }
            - call: "POST /ballots/${b_r2}/entries"
              payload: { proposal_id: "${ar}", rank: 1 }
              as: Resident
              as_user_id: "${r2}"
            - call: "POST /ballots/${b_r2}/entries"
              payload: { proposal_id: "${br}", rank: 2 }
              as: Resident
              as_user_id: "${r2}"
            - call: "POST /ballots/${b_r2}/cast"
              payload: {}
              as: Resident
              as_user_id: "${r2}"
            # ----- ALLOCATION cycle -----
            - call: "POST /budget-cycles"
              payload: { name: "PB-L", fiscal_year: 2027, total_budget_cents: 1000000, voting_method: "ALLOCATION", per_project_cap_cents: 1000000, per_voter_allocation_cap_cents: 1000000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cl: $.data.id }
            - call: "POST /budget-cycles/${cl}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 1000000 }
              as: BudgetAdmin
              captures: { catl: $.data.id }
            - call: "POST /budget-cycles/${cl}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cl}/proposals"
              payload: { category_id: "${catl}", title: "A_l", summary: "a" }
              as: Resident
              as_user_id: "${r1}"
              captures: { al: $.data.id }
            - call: "POST /budget-cycles/${cl}/proposals"
              payload: { category_id: "${catl}", title: "B_l", summary: "b" }
              as: Resident
              as_user_id: "${r1}"
              captures: { bl: $.data.id }
            - call: "POST /proposals/${al}/submit"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /proposals/${bl}/submit"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /budget-cycles/${cl}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${al}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${bl}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${al}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 1000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${bl}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 1000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${al}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /proposals/${bl}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /budget-cycles/${cl}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
          trigger:
            - call: "POST /budget-cycles/${cl}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
              captures: { b_l1: $.data.id }
            - call: "POST /ballots/${b_l1}/entries"
              payload: { proposal_id: "${al}", allocated_cents: 1000 }
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /ballots/${b_l1}/cast"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /budget-cycles/${cl}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${r2}"
              captures: { b_l2: $.data.id }
            - call: "POST /ballots/${b_l2}/entries"
              payload: { proposal_id: "${bl}", allocated_cents: 9000 }
              as: Resident
              as_user_id: "${r2}"
            - call: "POST /ballots/${b_l2}/cast"
              payload: {}
              as: Resident
              as_user_id: "${r2}"
          assert:
            - "Proposal.${ar}.vote_score == 20"
            - "Proposal.${br}.vote_score == 18"
            - "Proposal.${al}.vote_score == 1000"
            - "Proposal.${bl}.vote_score == 9000"

  - rule_id: combinatorial_formula
    instances:
      - name: cost_rounding_order_round_per_line_then_sum
        grounds:
          - calculations.proposal_cost_estimate
          - entities.CostLineItem.fields.line_provisional_cents
          - entities.Proposal.fields.provisional_estimate_cents
        distinguishing_aspect: |
          Mode (b): two identical lines (333 x1 @10%) each round to 366, summing
          to 732; summing the raw 366.3+366.3=732.6 and rounding once would give
          733. The scaffold pins round-per-line-then-sum, so the result is 732.
        test_recipe:
          setup:
            - "A DEVELOPING proposal with two line items of unit_cost_cents=333, quantity=1, contingency_pct=0.10."
          setup_api_calls:
            - call: "POST /budget-cycles"
              payload: { name: "PBc", fiscal_year: 2027, total_budget_cents: 500000, voting_method: "ALLOCATION", per_project_cap_cents: 400000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 500000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Rowan", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { pid: $.data.id }
            - call: "POST /proposals/${pid}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${pid}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${pid}/cost-line-items"
              payload: { label: "l1", unit_cost_cents: 333, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
              captures: { li1: $.data.id }
          trigger:
            - call: "POST /proposals/${pid}/cost-line-items"
              payload: { label: "l2", unit_cost_cents: 333, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
              captures: { li2: $.data.id }
          assert:
            - "CostLineItem.${li1}.line_provisional_cents == 366"
            - "CostLineItem.${li2}.line_provisional_cents == 366"
            - "Proposal.${pid}.provisional_estimate_cents == 732"

      - name: funding_selection_waterfall_min_caps
        grounds:
          - calculations.funding_selection
          - state_machines.Proposal.ON_BALLOT_to_SELECTED
          - state_machines.Proposal.ON_BALLOT_to_NOT_SELECTED
          - entities.Proposal.fields.awarded_cents
        distinguishing_aspect: |
          Mode (a): award = min(per_project_cap, remaining_total, remaining_cat)
          with a >per_project_cap skip branch. P1(57750) funds, P2(46200) is
          skipped (would exceed the 34650 remaining), P3(34650) then funds
          exactly filling the pool — a waterfall skip-over with an inclusive
          boundary, on three interacting inputs.
        test_recipe:
          setup:
            - "ALLOCATION cycle in SELECTION with three ON_BALLOT proposals P1,P2,P3 (final costs 57750,46200,34650) and vote_scores 3000,2000,1000; total_budget 92400, per_project_cap 60000, category cap 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BudgetAdmin
            - call: "POST /budget-cycles"
              payload: { name: "PBw", fiscal_year: 2027, total_budget_cents: 92400, voting_method: "ALLOCATION", per_project_cap_cents: 60000, per_voter_allocation_cap_cents: 1000000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 100000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "V", date_of_birth: "1990-01-01", residency_document_ref: "d", residency_address: "1 St" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /residents/${rid}/verification-requests"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /residents/${rid}/verification-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SUBMISSION" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P1", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { p1: $.data.id }
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P2", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { p2: $.data.id }
            - call: "POST /budget-cycles/${cyc}/proposals"
              payload: { category_id: "${cat}", title: "P3", summary: "s" }
              as: Resident
              as_user_id: "${rid}"
              captures: { p3: $.data.id }
            - call: "POST /proposals/${p1}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /proposals/${p2}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /proposals/${p3}/submit"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "DEVELOPMENT" }
              as: BudgetAdmin
            - call: "POST /proposals/${p1}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${p2}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${p3}/review-decisions"
              payload: { decision: "APPROVE" }
              as: Reviewer
            - call: "POST /proposals/${p1}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 50000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${p2}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 40000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${p3}/cost-line-items"
              payload: { label: "x", unit_cost_cents: 30000, quantity: 1, contingency_pct: 0.10 }
              as: Reviewer
            - call: "POST /proposals/${p1}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /proposals/${p2}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /proposals/${p3}/finalize-cost"
              payload: {}
              as: Reviewer
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/ballots"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
              captures: { bid: $.data.id }
            - call: "POST /ballots/${bid}/entries"
              payload: { proposal_id: "${p1}", allocated_cents: 3000 }
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /ballots/${bid}/entries"
              payload: { proposal_id: "${p2}", allocated_cents: 2000 }
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /ballots/${bid}/entries"
              payload: { proposal_id: "${p3}", allocated_cents: 1000 }
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /ballots/${bid}/cast"
              payload: {}
              as: Resident
              as_user_id: "${rid}"
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SELECTION" }
              as: BudgetAdmin
            - call: "GET /budget-cycles/${cyc}"
              payload: {}
              as: BudgetAdmin
              captures: { ver: $.data.version }
          trigger:
            - call: "POST /budget-cycles/${cyc}/selection-runs"
              payload: { expected_budgetcycle_version: "${ver}" }
              as: BudgetAdmin
              captures: { run: $.data.id }
          assert:
            - "Proposal.${p1}.status == SELECTED"
            - "Proposal.${p1}.awarded_cents == 57750"
            - "Proposal.${p2}.status == NOT_SELECTED"
            - "Proposal.${p2}.awarded_cents == 0"
            - "Proposal.${p3}.status == SELECTED"
            - "Proposal.${p3}.awarded_cents == 34650"
            - "SelectionRun.${run}.selected_count == 2"
            - "SelectionRun.${run}.total_awarded_cents == 92400"
            - "BudgetCycle.${cyc}.uncommitted_cents == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: ballot_cast_withdraw_recast_cycle
        grounds:
          - state_machines.Ballot.CAST_to_WITHDRAWN
          - state_machines.Ballot.WITHDRAWN_to_CAST
          - entities.Ballot.fields.status
        distinguishing_aspect: |
          Ballot is a cyclic machine: DRAFT->CAST->WITHDRAWN->CAST. After a
          withdraw then re-cast the ballot is CAST again and the proposal's
          vote_score is restored to 4000 (net of the loop), unlike a linear
          machine.
        test_recipe:
          setup:
