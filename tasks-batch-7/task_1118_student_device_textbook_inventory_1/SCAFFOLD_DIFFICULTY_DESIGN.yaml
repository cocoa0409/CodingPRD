              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 12, in_service_date: "2025-05-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
