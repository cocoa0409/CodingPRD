          setup: ["An ACTIVE MUNICIPAL_ADVISOR org."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "MA-3006", name: "Advisor Cap", org_type: "MUNICIPAL_ADVISOR" }
              as: PortalOperator
              captures: { org_ma: $.data.id }
          trigger:
            - call: "POST /msrb/solicitation-records"
              payload: { advisor_org_id: "${org_ma}", municipal_entity_name: "City of Example", compensation_type: "CONTINGENT", compensation_cents: 2500001, disclosure_provided: true }
              as: DealerRep
              as_user_id: "${org_ma}"
              captures: { err: $.data.error_id }
            - call: "POST /msrb/solicitation-records"
              payload: { advisor_org_id: "${org_ma}", municipal_entity_name: "City of Example", compensation_type: "CONTINGENT", compensation_cents: 2500000, disclosure_provided: true }
              as: DealerRep
              as_user_id: "${org_ma}"
              captures: { ok_id: $.data.id }
          assert:
            - "${err} == ERR_FEE_CAP_EXCEEDED"
            - "SolicitationRecord.${ok_id} was created (201)"
      - name: solicitation_without_disclosure_returns_disclosure_required
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_DISCLOSURE_REQUIRED]
        distinguishing_aspect: "Fiduciary safety gate: disclosure_provided false rejects the solicitation with ERR_DISCLOSURE_REQUIRED (business_safety beats temporal/referential/fiscal checks)."
        test_recipe:
          setup: ["An ACTIVE MUNICIPAL_ADVISOR org."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "MA-3007", name: "Advisor Disclosure", org_type: "MUNICIPAL_ADVISOR" }
              as: PortalOperator
              captures: { org_ma: $.data.id }
          trigger:
            - call: "POST /msrb/solicitation-records"
              payload: { advisor_org_id: "${org_ma}", municipal_entity_name: "City of Example", compensation_type: "FIXED", compensation_cents: 50000, disclosure_provided: false }
              as: DealerRep
              as_user_id: "${org_ma}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DISCLOSURE_REQUIRED"
      - name: comment_period_days_bounds_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_COMMENT_PERIOD_TOO_SHORT]
        distinguishing_aspect: "The comment window length is bounded at both ends: 20 days and 91 days both fail ERR_COMMENT_PERIOD_TOO_SHORT; 21 days succeeds (inclusive lower bound)."
        test_recipe:
          setup: ["A DRAFT proposal."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-305", title: "Bounds rule", body: "b", category: "QUALIFICATION" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 20 }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { err20: $.data.error_id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 91 }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { err91: $.data.error_id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { st: $.data.status }
          assert:
            - "${err20} == ERR_COMMENT_PERIOD_TOO_SHORT"
            - "${err91} == ERR_COMMENT_PERIOD_TOO_SHORT"
            - "${st} == OPEN_FOR_COMMENT"
      - name: comment_window_half_open_end_boundary
        claim_type: boundary
        grounds:
          - validations[priority=13]
          - errors[ERR_COMMENT_WINDOW_CLOSED]
          - entities.RuleProposal.fields.comment_window_end
        distinguishing_aspect: "The comment window is half-open [start, end): a comment one second before end is accepted, a comment at exactly the end instant fails ERR_COMMENT_WINDOW_CLOSED while the proposal is still OPEN_FOR_COMMENT."
        test_recipe:
          setup: ["Proposal opened for 21 days at the default clock (window ends 2026-09-22T00:00:00Z)."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-306", title: "Half-open rule", body: "h", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T23:59:59Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/comment-letters"
              payload: { author_name: "In Time", body: "ok", sentiment: "SUPPORT" }
              as: PublicReader
              captures: { ok_letter: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_id}/comment-letters"
              payload: { author_name: "Too Late", body: "nope", sentiment: "OPPOSE" }
              as: PublicReader
              captures: { err: $.data.error_id }
          assert:
            - "CommentLetter.${ok_letter} exists with status RECEIVED (201 created at end minus one second)"
            - "${err} == ERR_COMMENT_WINDOW_CLOSED"
      - name: submit_before_window_end_returns_period_still_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_COMMENT_PERIOD_STILL_OPEN]
        distinguishing_aspect: "submit-for-approval before comment_window_end fails ERR_COMMENT_PERIOD_STILL_OPEN (422) even though the proposal is OPEN_FOR_COMMENT."
        test_recipe:
          setup: ["Proposal opened for 21 days at the default clock; clock untouched."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-307", title: "Early submit", body: "e", category: "ADVISOR_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMMENT_PERIOD_STILL_OPEN"
      - name: suspended_issuer_cannot_file_disclosure
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_ORG_SUSPENDED]
        distinguishing_aspect: "A SUSPENDED issuer organization cannot file disclosures: ERR_ORG_SUSPENDED (409) on create."
        test_recipe:
          setup: ["An ISSUER org that has been suspended."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-3008", name: "Issuer Suspended", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_i: $.data.id }
            - call: "POST /msrb/organizations/${org_i}/suspend"
              payload: { reason: "failure to file" }
              as: ComplianceOfficer
              as_user_id: co-1
          trigger:
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "VOLUNTARY", document_uri: "doc://late", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORG_SUSPENDED"
      - name: subscription_activation_requires_active_licensee_org
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - state_machines.DataSubscription.PENDING_to_ACTIVE
        distinguishing_aspect: "Activation is gated on the licensee organization's current status: suspending the licensee after creation makes the PENDING -> ACTIVE transition fail ERR_ORG_SUSPENDED."
        test_recipe:
          setup: ["An ACTIVE ISSUER org with a PENDING subscription, then suspended."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-3009", name: "Issuer Licensee", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_i: $.data.id }
            - call: "POST /msrb/data-subscriptions"
              payload: { product_code: "DISCLOSURE_ARCHIVE", licensee_org_id: "${org_i}", subscriber_principal: "sub-i-1", license_scope: "INTERNAL", seats: 1 }
              as: LicensingOfficer
              captures: { sub: $.data.id }
            - call: "POST /msrb/organizations/${org_i}/suspend"
              payload: { reason: "regulatory" }
              as: ComplianceOfficer
              as_user_id: co-1
          trigger:
            - call: "POST /msrb/data-subscriptions/${sub}/transition"
              payload: { to_state: "ACTIVE" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORG_SUSPENDED"
      - name: feed_without_subscription_returns_product_not_licensed
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_PRODUCT_NOT_LICENSED]
        distinguishing_aspect: "Licensed feed access requires a matching ACTIVE subscription: a principal with no subscription on TRADE_REALTIME gets 403 ERR_PRODUCT_NOT_LICENSED."
        test_recipe:
          setup: ["An org exists but holds no subscription."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-3010", name: "Dealer Nolicense", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
          trigger:
            - call: "GET /msrb/data-feeds/TRADE_REALTIME"
              payload: {}
              as: MarketDataSubscriber
              as_user_id: sub-stranger
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PRODUCT_NOT_LICENSED"
  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response wraps data in the fixed envelope: success carries meta.api_request_id, meta.api_request_timestamp, response_type 'object'|'array', and data; an error carries response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-4001", name: "Dealer Envelope", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org: $.data.id }
            - call: "GET /msrb/organizations/99999999-8888-7777-6666-555555555555"
              payload: {}
              as: PortalOperator
              captures: { err: $.data.error_id }
          assert:
            - "success response has keys meta.api_request_id, meta.api_request_timestamp, response_type == 'object', data"
            - "error response has response_type == 'error' and data.error_id == ERR_ORG_NOT_FOUND plus data.message"
      - name: proposal_list_pagination_limit_offset_has_more
        claim_type: standard_crud
        grounds:
          - response_envelope
          - endpoints[GET /msrb/rule-proposals]
        distinguishing_aspect: "Pagination contract: limit 2 over 3 proposals returns 2 items with total_count 3 and has_more true; offset 2 returns the final item with has_more false."
        test_recipe:
          setup: ["Three DRAFT proposals."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-401", title: "P1", body: "1", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-402", title: "P2", body: "2", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-403", title: "P3", body: "3", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
          trigger:
            - call: "GET /msrb/rule-proposals"
              payload: { limit: 2, offset: 0 }
              as: RulemakingOfficer
            - call: "GET /msrb/rule-proposals"
              payload: { limit: 2, offset: 2 }
              as: RulemakingOfficer
          assert:
            - "page 1: response data length == 2, total_count == 3, has_more == true"
            - "page 2: response data length == 1, total_count == 3, has_more == false"
      - name: public_reader_sees_only_published_disclosures
        claim_type: conditional_action
        grounds:
          - endpoints[GET /msrb/disclosure-submissions]
          - endpoints[GET /msrb/disclosure-submissions/{id}]
          - validations[priority=2]
        distinguishing_aspect: "Free public access is scope-filtered: PublicReader lists only PUBLISHED submissions (1 of 2) and a direct GET on a RECEIVED submission reports 404 ERR_SUBMISSION_NOT_FOUND, while PortalOperator sees both."
        test_recipe:
          setup: ["An ISSUER org with two submissions; exactly one published."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-4002", name: "Issuer Public", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_i: $.data.id }
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "OFFICIAL_STATEMENT", document_uri: "doc://os1", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { d_pub: $.data.id }
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "VOLUNTARY", document_uri: "doc://vol1", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { d_pend: $.data.id }
            - call: "POST /msrb/disclosure-submissions/${d_pub}/review-outcome"
              payload: { outcome: "PUBLISH" }
              as: PortalOperator
          trigger:
            - call: "GET /msrb/disclosure-submissions"
              payload: {}
              as: PublicReader
              captures: { first_status: "$.data[0].status" }
            - call: "GET /msrb/disclosure-submissions/${d_pend}"
              payload: {}
              as: PublicReader
              captures: { err: $.data.error_id }
            - call: "GET /msrb/disclosure-submissions"
              payload: {}
              as: PortalOperator
          assert:
            - "PublicReader list: data length == 1 and ${first_status} == PUBLISHED"
            - "${err} == ERR_SUBMISSION_NOT_FOUND"
            - "PortalOperator list: data length == 2"
      - name: public_reader_sees_only_disseminated_trades
        claim_type: conditional_action
        grounds:
          - endpoints[GET /msrb/trade-reports]
          - endpoints[GET /msrb/trade-reports/{id}]
          - validations[priority=2]
        distinguishing_aspect: "Cancelled trades vanish from the public tape: PublicReader lists 0 trades and gets 404 ERR_TRADE_NOT_FOUND on the cancelled trade's id, while PortalOperator still sees the CANCELLED record."
        test_recipe:
          setup: ["A BROKER_DEALER org with one trade that was disseminated then cancelled."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-4003", name: "Dealer Tape", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_BUY", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T11:55:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { t: $.data.id }
            - call: "POST /msrb/trade-reports/${t}/cancel"
              payload: {}
              as: DealerRep
              as_user_id: "${org_d}"
          trigger:
            - call: "GET /msrb/trade-reports"
              payload: {}
              as: PublicReader
            - call: "GET /msrb/trade-reports/${t}"
              payload: {}
              as: PublicReader
              captures: { err: $.data.error_id }
            - call: "GET /msrb/trade-reports/${t}"
              payload: {}
              as: PortalOperator
              captures: { st: $.data.status }
          assert:
            - "PublicReader list: data length == 0 and total_count == 0"
            - "${err} == ERR_TRADE_NOT_FOUND"
            - "${st} == CANCELLED"
      - name: issuer_rep_scoped_to_own_org_submissions
        claim_type: conditional_action
        grounds:
          - endpoints[GET /msrb/disclosure-submissions]
          - validations[priority=2]
        distinguishing_aspect: "Entity-backed scoping: IssuerRep of org A lists only org A's submissions and reading org B's submission id reports 404 ERR_SUBMISSION_NOT_FOUND (scope-first, not 403)."
        test_recipe:
          setup: ["ISSUER orgs A and B, each with one submission."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-4004A", name: "Issuer A", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_a: $.data.id }
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-4004B", name: "Issuer B", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_b: $.data.id }
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_a}", submission_type: "VOLUNTARY", document_uri: "doc://a1", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_a}"
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_b}", submission_type: "VOLUNTARY", document_uri: "doc://b1", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_b}"
              captures: { d_b: $.data.id }
          trigger:
            - call: "GET /msrb/disclosure-submissions"
              payload: {}
              as: IssuerRep
              as_user_id: "${org_a}"
              captures: { first_issuer: "$.data[0].issuer_org_id" }
            - call: "GET /msrb/disclosure-submissions/${d_b}"
              payload: {}
              as: IssuerRep
              as_user_id: "${org_a}"
              captures: { err: $.data.error_id }
          assert:
            - "IssuerRep A list: data length == 1 and ${first_issuer} == ${org_a}"
            - "${err} == ERR_SUBMISSION_NOT_FOUND"
      - name: dealer_rep_cannot_report_trade_for_other_org
        claim_type: conditional_action
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Entity-backed ownership: a DealerRep whose X-User-ID is org A posting a trade with dealer_org_id org B is rejected 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Two ACTIVE BROKER_DEALER orgs A and B; clock 2026-09-01T12:00:00Z."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-4005A", name: "Dealer A", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_a: $.data.id }
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-4005B", name: "Dealer B", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_b}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T11:55:00Z" }
              as: DealerRep
              as_user_id: "${org_a}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
      - name: licensed_feed_returns_product_dataset
        claim_type: computed_read
        grounds:
          - endpoints[GET /msrb/data-feeds/{product_code}]
          - validations[priority=24]
        distinguishing_aspect: "The licensed feed resolves the caller's ACTIVE subscription and reports the product dataset size: with 2 DISSEMINATED trades, a TRADE_REALTIME feed returns record_count 2 and the caller's own subscription_id."
        test_recipe:
          setup: ["A BROKER_DEALER org with an ACTIVE TRADE_REALTIME subscription (principal sub-ok) and 2 disseminated trades."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-4006", name: "Dealer Feed", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/data-subscriptions"
              payload: { product_code: "TRADE_REALTIME", licensee_org_id: "${org_d}", subscriber_principal: "sub-ok", license_scope: "INTERNAL", seats: 3 }
              as: LicensingOfficer
              captures: { sub: $.data.id }
            - call: "POST /msrb/data-subscriptions/${sub}/transition"
              payload: { to_state: "ACTIVE" }
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_BUY", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T11:55:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_SELL", par_amount: 200000, price: 100.5, executed_at: "2026-09-01T11:56:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
          trigger:
            - call: "GET /msrb/data-feeds/TRADE_REALTIME"
              payload: {}
              as: MarketDataSubscriber
              as_user_id: sub-ok
              captures: { pc: $.data.product_code, sid: $.data.subscription_id, rc: $.data.record_count }
          assert:
            - "${pc} == TRADE_REALTIME"
            - "${sid} == ${sub}"
            - "${rc} == 2"
