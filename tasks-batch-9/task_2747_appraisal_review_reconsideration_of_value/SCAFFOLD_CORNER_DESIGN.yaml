              payload: { intake_note: "Both items admissible." }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
          trigger:
            - call: "POST /appraisal-desk/rov-requests/${rov1_id}/appraiser-response"
              payload: { outcome: "VALUE_REVISED", response_note: "Adopting both sales in full.", revised_value_cents: 49000000 }
              as: Appraiser
              as_user_id: "${apr_a_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /appraisal-desk/rov-requests/${rov1_id}/appraiser-response"
              payload: { outcome: "VALUE_REVISED", response_note: "Adopting both sales with a market adjustment.", revised_value_cents: 48000000 }
              as: Appraiser
              as_user_id: "${apr_a_id}"
          assert:
            - "49000000 is round_half_up(10000 * 9000000 / 40000000) == 2250 bps from the current value: HTTP 422 with error_id ERR_REVISION_EXCEEDS_CAP"
            - "after the refusal ROVRequest.${rov1_id}.status is still AWAITING_APPRAISER with outcome null, and Appraisal.${ap1_id}.current_value_cents is still 40000000"
            - "no ValueRevision row exists after the refusal and Appraiser.${apr_a_id}.revision_rate_bps is still 0"
            - "48000000 is exactly 2000 bps == ROV_REVISION_CAP_BPS: HTTP 200, status RESPONDED, outcome VALUE_REVISED"
            - "Appraisal.${ap1_id}.current_value_cents == 48000000 and review_status == VALUE_REVISED"
            - "one non-compensating ValueRevision with source_type ROV now exists, so Appraiser.${apr_a_id}.revision_rate_bps == 10000, performance_score_bps == 4000 and panel_status == SUSPENDED"

      - name: error_escalation_not_pending_on_a_second_assignment
