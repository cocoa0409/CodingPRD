scenario: |
  Equipment maintenance work order system: equipment ledger with equipment-category
  classification, location and responsible person, technical specification, warranty
  period, and equipment-lifecycle status; maintenance plan with periodic plan
  (time-based/usage-based) and trigger-based plan (alarm-driven/threshold-triggered),
  task-template library, plan generation rules, plan adjustment, and plan-execution
  tracking; work order dispatch and routing with work-order priority classification,
  technician skill matching, workload balancing, work-order acceptance and
  reassignment, status flow (pending/in-progress/paused/completed/closed), and SLA
  monitoring; spare parts requisition with parts inventory check, reservation and
  issuance, replacement-parts return, parts-cost attribution to work order, and
  inventory replenishment trigger; repair records with fault description, root-cause
  analysis, repair actions, parts replaced, working hours, before-and-after photo
  or measurement records, and acceptance confirmation; MTTR and MTBF statistics
  with mean-time-to-repair calculation by equipment/category/period, mean-time-
  between-failures calculation, fault-recurrence analysis, equipment-availability
  rate, and reliability trend analysis; event-driven synchronization with equipment
  monitoring, inventory, and IM systems; audit logging for work order status and
  parts issuance.

domain_name: equipment-maintenance
api_prefix: /sites

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - selector_policy
    - rate_threshold_triggers
    - dual_variant_calculation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: clock_now, type: datetime, source: system, description: "Site logical clock used for all SLA, MTTR, MTBF math; advanced via /clock/advance test endpoint", default: "2026-01-01T00:00:00.000Z" }
      - { name: sweep_run_index, type: integer, source: system, description: "Plan-generation/SLA-sweep tick counter, starts at 0, incremented by /sweep/run", default: 0 }

  - name: Equipment
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "Owning site id" }
      - { name: asset_tag, type: string, source: input, description: "Unique-per-site asset tag" }
      - { name: category, type: enum, source: input, description: "PUMP | COMPRESSOR | HVAC | CONVEYOR | BOILER" }
      - { name: location, type: string, source: input, description: "Physical location label" }
      - { name: responsible_user_id, type: string, source: input, description: "Opaque user id of accountable owner" }
      - { name: technical_spec, type: object, source: input, description: "Free-form spec object (model, capacity, voltage, etc.)" }
      - { name: criticality, type: enum, source: input, description: "LOW | MEDIUM | HIGH (drives priority weighting)" }
      - { name: warranty_start, type: datetime, source: input, description: "Warranty coverage start" }
      - { name: warranty_end, type: datetime, source: input, description: "Warranty coverage end" }
      - { name: lifecycle_status, type: enum, source: system, description: "INSTALLED | COMMISSIONED | IN_SERVICE | UNDER_MAINTENANCE | DECOMMISSIONED", default: "INSTALLED" }
      - { name: usage_counter, type: integer, source: input, description: "Cumulative usage units (hours, cycles); monotonic-non-decreasing", default: 0 }
      - { name: last_failure_at, type: datetime, source: computed, description: "Site clock at most-recent failure-triggered work-order open; null if none" }
      - { name: last_repair_completed_at, type: datetime, source: computed, description: "Site clock at most-recent COMPLETED work order on this equipment; null if none" }
      - { name: open_work_order_id, type: string, source: computed, description: "Work order currently blocking the equipment (status in {PENDING, IN_PROGRESS, PAUSED}); null if none" }

  - name: TaskTemplate
    parent: Site
    common_fields: false
    fields:
      - { name: site_id, type: string, source: system, description: "Owning site id" }
      - { name: code, type: string, source: input, description: "Unique-per-site template code" }
      - { name: title, type: string, source: input, description: "Human title" }
      - { name: equipment_category, type: enum, source: input, description: "Targets one Equipment.category (PUMP|COMPRESSOR|HVAC|CONVEYOR|BOILER)" }
      - { name: required_skill, type: enum, source: input, description: "MECHANICAL | ELECTRICAL | HYDRAULIC | HVAC_CERT | CONTROLS" }
      - { name: estimated_minutes, type: integer, source: input, description: "Planning estimate in minutes (>0)" }
      - { name: default_priority, type: enum, source: input, description: "P1 | P2 | P3 | P4 (P1 highest)" }

  - name: MaintenancePlan
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "Owning site id" }
      - { name: equipment_id, type: string, source: input, description: "Target equipment" }
      - { name: template_id, type: string, source: input, description: "Source TaskTemplate" }
      - { name: kind, type: enum, source: input, description: "PERIODIC_TIME | PERIODIC_USAGE | TRIGGER_ALARM | TRIGGER_THRESHOLD" }
      - { name: interval_days, type: integer, source: input, description: "Required when kind=PERIODIC_TIME (>0)", default: null }
      - { name: interval_usage, type: integer, source: input, description: "Required when kind=PERIODIC_USAGE (>0); usage units between work orders", default: null }
      - { name: alarm_code, type: string, source: input, description: "Required when kind=TRIGGER_ALARM; matches AlarmEvent.alarm_code", default: null }
      - { name: threshold_metric, type: string, source: input, description: "Required when kind=TRIGGER_THRESHOLD; e.g. VIBRATION, TEMP", default: null }
      - { name: threshold_op, type: enum, source: input, description: "Required when kind=TRIGGER_THRESHOLD: GTE | GT | LTE | LT", default: null }
      - { name: threshold_value, type: number, source: input, description: "Required when kind=TRIGGER_THRESHOLD", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | RETIRED", default: "DRAFT" }
      - { name: last_generated_at, type: datetime, source: computed, description: "Site clock at most-recent generated WorkOrder for this plan; null if never" }
      - { name: last_generated_usage, type: integer, source: computed, description: "Equipment.usage_counter snapshot taken when last WorkOrder was generated; null if never" }
      - { name: next_due_at, type: datetime, source: computed, description: "For PERIODIC_TIME: last_generated_at + interval_days*86400s, or activation time + interval_days*86400s if last_generated_at is null. Null for non-time plans." }

  - name: SparePart
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "Owning site id" }
      - { name: sku, type: string, source: input, description: "Unique-per-site SKU" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost per unit in integer cents (>=0)" }
      - { name: stock_on_hand, type: integer, source: system, description: "Physical stock count (>=0)", default: 0 }
      - { name: stock_reserved, type: integer, source: computed, description: "Sum of qty across requisitions in status RESERVED for this part; 0 <= stock_reserved <= stock_on_hand" }
      - { name: reorder_point, type: integer, source: input, description: "When stock_on_hand - stock_reserved <= reorder_point, replenishment is triggered (>=0)" }
      - { name: replenish_pending, type: boolean, source: computed, description: "True iff (stock_on_hand - stock_reserved) <= reorder_point AND no open replenishment yet", default: false }

  - name: Technician
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "Owning site id" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: skills, type: array, source: input, description: "Subset of {MECHANICAL, ELECTRICAL, HYDRAULIC, HVAC_CERT, CONTROLS}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OFF_DUTY", default: "ACTIVE" }
      - { name: open_load, type: integer, source: computed, description: "Count of WorkOrders with assigned_technician_id == this id and status in {PENDING, IN_PROGRESS, PAUSED}" }

  - name: WorkOrder
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "Owning site id" }
      - { name: equipment_id, type: string, source: input, description: "Target equipment" }
      - { name: template_id, type: string, source: input, description: "Source TaskTemplate" }
      - { name: plan_id, type: string, source: input, required: false, description: "Source plan; null for ad-hoc work orders" }
      - { name: source, type: enum, source: system, description: "PLAN_PERIODIC | PLAN_TRIGGER | ALARM | AD_HOC" }
      - { name: priority, type: enum, source: computed, description: "P1 | P2 | P3 | P4 (computed by priority_score formula)" }
      - { name: priority_score, type: integer, source: computed, description: "Numeric priority score; pinned to integer via the priority_score formula" }
      - { name: required_skill, type: enum, source: system, description: "Copied from TaskTemplate.required_skill at creation" }
      - { name: estimated_minutes, type: integer, source: system, description: "Copied from TaskTemplate.estimated_minutes at creation" }
      - { name: assigned_technician_id, type: string, source: system, description: "Technician currently responsible; null when PENDING and not yet routed" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | PAUSED | COMPLETED | CLOSED | CANCELLED", default: "PENDING" }
      - { name: opened_at, type: datetime, source: system, description: "Site clock when WorkOrder was created" }
      - { name: started_at, type: datetime, source: system, description: "Site clock at first PENDING→IN_PROGRESS transition; null if never started" }
      - { name: completed_at, type: datetime, source: system, description: "Site clock at IN_PROGRESS→COMPLETED transition; null if not completed" }
      - { name: closed_at, type: datetime, source: system, description: "Site clock at COMPLETED→CLOSED (acceptance) transition; null if not closed" }
      - { name: sla_due_at, type: datetime, source: computed, description: "opened_at + sla_minutes_for_priority(priority) * 60s; pinned at creation, recomputed if priority changes" }
      - { name: sla_breached, type: boolean, source: computed, description: "True iff Site.clock_now > sla_due_at AND status NOT IN {COMPLETED, CLOSED, CANCELLED}", default: false }
      - { name: pause_reason, type: enum, source: system, required: false, description: "WAIT_PARTS | WAIT_VENDOR | WAIT_INFO; null when not PAUSED" }
      - { name: total_active_minutes, type: integer, source: computed, description: "Cumulative minutes spent in IN_PROGRESS state across the WorkOrder's life (excludes PAUSED time)" }
      - { name: parts_cost_cents, type: integer, source: computed, description: "Computed by parts_cost formula at COMPLETED transition; null before completion" }
      - { name: reassign_count, type: integer, source: system, description: "Number of times assigned_technician_id has been replaced after a non-null assignment; starts at 0", default: 0 }

  - name: Requisition
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "Owning WorkOrder id" }
      - { name: part_id, type: string, source: input, description: "SparePart id" }
      - { name: qty, type: integer, source: input, description: "Requested quantity (>0)" }
      - { name: status, type: enum, source: system, description: "RESERVED | ISSUED | RETURNED | CANCELLED", default: "RESERVED" }
      - { name: unit_cost_cents_at_issue, type: integer, source: system, description: "SparePart.unit_cost_cents snapshot taken at ISSUED transition; null before issue" }
      - { name: returned_qty, type: integer, source: system, description: "Quantity returned via RETURN transition (0 <= returned_qty <= qty)", default: 0 }

  - name: RepairRecord
    parent: WorkOrder
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: system, description: "Owning WorkOrder id (1:1 with COMPLETED WorkOrder)" }
      - { name: fault_description, type: string, source: input, description: "Reported symptom" }
      - { name: root_cause, type: string, source: input, description: "Root-cause analysis text" }
      - { name: repair_actions, type: string, source: input, description: "Actions taken" }
      - { name: working_minutes, type: integer, source: input, description: "Technician-reported labor minutes (>0)" }
      - { name: before_evidence_url, type: string, source: input, description: "Photo/measurement before repair (URL or measurement string)" }
      - { name: after_evidence_url, type: string, source: input, description: "Photo/measurement after repair" }
      - { name: parts_replaced, type: array, source: system, description: "Snapshot at completion: list of {requisition_id, part_id, qty_used, unit_cost_cents} for each ISSUED requisition with qty_used = qty - returned_qty" }
      - { name: acceptance_user_id, type: string, source: system, description: "responsible_user_id who accepted; populated only after WorkOrder closes" }
      - { name: acceptance_at, type: datetime, source: system, description: "Site clock at acceptance; null until WorkOrder closes" }

  - name: AlarmEvent
    parent: Equipment
    common_fields: false
    fields:
      - { name: equipment_id, type: string, source: system, description: "Owning equipment id" }
      - { name: alarm_code, type: string, source: input, description: "Alarm code emitted by external monitoring system" }
      - { name: severity, type: enum, source: input, description: "INFO | WARN | CRITICAL" }
      - { name: emitted_at, type: datetime, source: system, description: "Site clock at emission time" }
      - { name: generated_work_order_id, type: string, source: system, description: "WorkOrder generated by this alarm via plan_generation; null if no matching ACTIVE plan" }

  - name: AuditEntry
    parent: Site
    common_fields: false
    fields:
      - { name: site_id, type: string, source: system, description: "Owning site id" }
      - { name: actor_role, type: string, source: system, description: "Role from X-User-Role header at time of action" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID at time of action" }
      - { name: action, type: enum, source: system, description: "WORK_ORDER_STATE_CHANGE | PARTS_ISSUED | PARTS_RETURNED | TECHNICIAN_ASSIGNED" }
      - { name: target_id, type: string, source: system, description: "Id of the WorkOrder or Requisition affected" }
      - { name: from_value, type: string, source: system, description: "Prior status or assignee; '' for create" }
      - { name: to_value, type: string, source: system, description: "New status or assignee" }
      - { name: occurred_at, type: datetime, source: system, description: "Site clock at action" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Equipment
    field: lifecycle_status
    initial_state: INSTALLED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /sites/:site_id/equipment/:equipment_id/commission"
        actor: SiteManager
        preconditions:
          - "Equipment has at least one ACTIVE MaintenancePlan attached (any kind) — else ERR_NO_ACTIVE_PLAN"
        side_effects:
          - "Equipment.lifecycle_status = COMMISSIONED"

      - from: COMMISSIONED
        to: IN_SERVICE
        trigger: "POST /sites/:site_id/equipment/:equipment_id/place-in-service"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "Equipment.lifecycle_status = IN_SERVICE"
          - "PERIODIC_TIME plans now eligible for sweep generation; their next_due_at is computed against this transition's site clock if last_generated_at is null"

      - from: IN_SERVICE
        to: UNDER_MAINTENANCE
        trigger: "system (WorkOrder transitions PENDING → IN_PROGRESS for this Equipment)"
        actor: system
        preconditions:
          - "Equipment.open_work_order_id == the work order entering IN_PROGRESS"
        side_effects:
          - "Equipment.lifecycle_status = UNDER_MAINTENANCE"
          - "No additional WorkOrder may be opened on this equipment while UNDER_MAINTENANCE (cross-entity gate; see ERR_EQUIPMENT_BUSY)"

      - from: UNDER_MAINTENANCE
        to: IN_SERVICE
        trigger: "system (the open WorkOrder transitions IN_PROGRESS|PAUSED → COMPLETED, CLOSED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Equipment.lifecycle_status = IN_SERVICE"
          - "Equipment.open_work_order_id = null"
          - "On COMPLETED: Equipment.last_repair_completed_at = Site.clock_now"

      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /sites/:site_id/equipment/:equipment_id/decommission"
        actor: SiteManager
        preconditions:
          - "Equipment.open_work_order_id is null (else ERR_EQUIPMENT_BUSY)"
        side_effects:
          - "Equipment.lifecycle_status = DECOMMISSIONED"
          - "All ACTIVE MaintenancePlans for this equipment → RETIRED (cascade)"
          - "All PENDING WorkOrders for this equipment → CANCELLED with cancel_reason='EQUIPMENT_DECOMMISSIONED'"

  - entity: MaintenancePlan
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sites/:site_id/plans/:plan_id/activate"
        actor: PlanOwner
        preconditions:
          - "Equipment.lifecycle_status IN {COMMISSIONED, IN_SERVICE} (else ERR_EQUIPMENT_LIFECYCLE)"
          - "All required-by-kind fields present (interval_days/interval_usage/alarm_code/(threshold_metric,threshold_op,threshold_value))"
        side_effects:
          - "next_due_at initialized: PERIODIC_TIME → Site.clock_now + interval_days*86400s; non-time → null"
          - "last_generated_usage initialized to Equipment.usage_counter for PERIODIC_USAGE; null otherwise"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /sites/:site_id/plans/:plan_id/pause"
        actor: PlanOwner
        preconditions: []
        side_effects:
          - "Plan no longer eligible for /sweep/run generation; existing WorkOrders unaffected"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /sites/:site_id/plans/:plan_id/resume"
        actor: PlanOwner
        preconditions: []
        side_effects:
          - "next_due_at re-evaluated for PERIODIC_TIME: max(last_generated_at + interval_days*86400s, Site.clock_now); for PERIODIC_USAGE/triggers no schedule change"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /sites/:site_id/plans/:plan_id/retire OR system (Equipment decommission cascade)"
        actor: "PlanOwner | system"
        preconditions: []
        side_effects:
          - "Plan no longer generates WorkOrders"

      - from: PAUSED
        to: RETIRED
        trigger: "POST /sites/:site_id/plans/:plan_id/retire OR system (Equipment decommission cascade)"
        actor: "PlanOwner | system"
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    field: status
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /sites/:site_id/work-orders/:wo_id/start"
        actor: Technician
        preconditions:
          - "X-User-ID equals WorkOrder.assigned_technician_id (acceptance is implicit on start)"
          - "Equipment.lifecycle_status IN {IN_SERVICE, COMMISSIONED} — cross-entity gate (else ERR_EQUIPMENT_LIFECYCLE)"
          - "Technician.status == ACTIVE"
        side_effects:
          - "WorkOrder.started_at = Site.clock_now if started_at is null"
          - "Equipment.lifecycle_status: IN_SERVICE → UNDER_MAINTENANCE; Equipment.open_work_order_id = WorkOrder.id"
          - "AuditEntry appended (action=WORK_ORDER_STATE_CHANGE)"

      - from: IN_PROGRESS
        to: PAUSED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/pause"
        actor: Technician
        preconditions:
          - "X-User-ID equals WorkOrder.assigned_technician_id"
          - "pause_reason in {WAIT_PARTS, WAIT_VENDOR, WAIT_INFO}"
        side_effects:
          - "WorkOrder.total_active_minutes += floor((Site.clock_now - last IN_PROGRESS entry) / 60s)"
          - "WorkOrder.pause_reason = pause_reason"
          - "AuditEntry appended"

      - from: PAUSED
        to: IN_PROGRESS
        trigger: "POST /sites/:site_id/work-orders/:wo_id/resume"
        actor: Technician
        preconditions:
          - "X-User-ID equals WorkOrder.assigned_technician_id"
          - "If pause_reason==WAIT_PARTS, at least one Requisition for this WorkOrder is in status ISSUED"
        side_effects:
          - "Resume timer (next pause/complete will count from Site.clock_now)"
          - "WorkOrder.pause_reason = null"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/complete"
        actor: Technician
        preconditions:
          - "X-User-ID equals WorkOrder.assigned_technician_id"
          - "Body includes a complete RepairRecord payload"
          - "Every Requisition for this WorkOrder is in status IN {ISSUED, RETURNED, CANCELLED} (no still-RESERVED parts)"
        side_effects:
          - "WorkOrder.total_active_minutes += floor((Site.clock_now - last IN_PROGRESS entry) / 60s)"
          - "RepairRecord created (parts_replaced snapshot built from ISSUED requisitions: qty_used = qty - returned_qty)"
          - "WorkOrder.parts_cost_cents computed via parts_cost formula"
          - "WorkOrder.completed_at = Site.clock_now"
          - "Equipment.lifecycle_status: UNDER_MAINTENANCE → IN_SERVICE; Equipment.open_work_order_id = null; Equipment.last_repair_completed_at = Site.clock_now"
          - "Source MaintenancePlan.last_generated_at and last_generated_usage left untouched (set at generation, not completion)"
          - "AuditEntry appended"

      - from: COMPLETED
        to: CLOSED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/accept"
        actor: SiteManager
        preconditions:
          - "X-User-ID equals Equipment.responsible_user_id (only the equipment's responsible owner accepts)"
          - "RepairRecord exists with non-empty before_evidence_url and after_evidence_url"
        side_effects:
          - "RepairRecord.acceptance_user_id = X-User-ID; RepairRecord.acceptance_at = Site.clock_now"
          - "WorkOrder.closed_at = Site.clock_now"
          - "AuditEntry appended"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/cancel OR system (Equipment decommission cascade)"
        actor: "Dispatcher | system"
        preconditions:
          - "WorkOrder has no Requisition in status ISSUED (RESERVED is OK; will be released)"
        side_effects:
          - "All RESERVED Requisitions on this WorkOrder → CANCELLED (SparePart.stock_reserved decreases)"
          - "Replenishment re-evaluation runs for each affected SparePart"
          - "AuditEntry appended"

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/cancel"
        actor: Dispatcher
        preconditions:
          - "Pause has lasted at least one /sweep/run tick (sweep_run_index has advanced ≥1 since pause) — else ERR_PAUSE_TOO_FRESH"
          - "WorkOrder has no Requisition in status ISSUED (must be RETURNED/CANCELLED first)"
        side_effects:
          - "All RESERVED Requisitions → CANCELLED"
          - "Equipment.lifecycle_status: UNDER_MAINTENANCE → IN_SERVICE; Equipment.open_work_order_id = null"
          - "AuditEntry appended"

      - from: PENDING
        to: PENDING
        trigger: "POST /sites/:site_id/work-orders/:wo_id/reassign"
        actor: Dispatcher
        preconditions:
          - "Body specifies new_technician_id"
          - "New Technician.status == ACTIVE and skills include WorkOrder.required_skill"
        side_effects:
          - "WorkOrder.assigned_technician_id = new_technician_id"
          - "WorkOrder.reassign_count += 1 (only if previous assigned_technician_id was non-null)"
          - "AuditEntry appended (action=TECHNICIAN_ASSIGNED)"

      - from: PENDING
        to: PENDING
        trigger: "system (created by /sweep/run plan_generation OR by /alarms emit OR by POST /work-orders)"
        actor: system
        preconditions:
          - "Equipment.lifecycle_status IN {COMMISSIONED, IN_SERVICE}"
          - "Equipment.open_work_order_id is null (selector_for_equipment guarantees one open WO per equipment)"
        side_effects:
          - "WorkOrder created with priority computed via priority_score formula"
          - "Routing runs technician_selector to assign assigned_technician_id"
          - "Equipment.open_work_order_id = WorkOrder.id"
          - "sla_due_at computed"

  - entity: Requisition
    field: status
    initial_state: RESERVED
    terminal_states: [CANCELLED]
    transitions:
      - from: RESERVED
        to: ISSUED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/issue"
        actor: Storekeeper
        preconditions:
          - "WorkOrder.status IN {PENDING, IN_PROGRESS, PAUSED}"
          - "SparePart.stock_on_hand >= qty"
        side_effects:
          - "Requisition.unit_cost_cents_at_issue = SparePart.unit_cost_cents at this instant"
          - "SparePart.stock_on_hand -= qty"
          - "SparePart.stock_reserved -= qty (release the reservation since stock is now physically issued)"
          - "Replenishment re-evaluation: if (stock_on_hand - stock_reserved) <= reorder_point AND replenish_pending was false, set replenish_pending=true and (test fixture) emit a /events/replenish notification"
          - "AuditEntry appended (action=PARTS_ISSUED)"

      - from: ISSUED
        to: RETURNED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/return"
        actor: Storekeeper
        preconditions:
          - "Body returned_qty satisfies 0 < returned_qty <= qty"
          - "WorkOrder.status IN {IN_PROGRESS, PAUSED} OR (WorkOrder.status == COMPLETED AND not yet CLOSED)"
        side_effects:
          - "Requisition.returned_qty += returned_qty"
          - "SparePart.stock_on_hand += returned_qty"
          - "Replenishment re-evaluation: if (stock_on_hand - stock_reserved) > reorder_point, set replenish_pending=false"
          - "AuditEntry appended (action=PARTS_RETURNED)"
          - "If WorkOrder is already COMPLETED, RepairRecord.parts_replaced and WorkOrder.parts_cost_cents are NOT recomputed — the snapshot at completion is final"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/cancel OR system (WorkOrder cancel cascade)"
        actor: "Storekeeper | system"
        preconditions: []
        side_effects:
          - "SparePart.stock_reserved -= qty"
          - "Replenishment re-evaluation"
          - "AuditEntry appended"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two simultaneous work-order creations for the same equipment (e.g., a periodic-plan sweep and an alarm-driven generation race)"
    guarantee: "At most one WorkOrder may have status IN {PENDING, IN_PROGRESS, PAUSED} per equipment_id; the loser is rejected"
    error_id: ERR_EQUIPMENT_BUSY
    http_status: 409
    serialization: "First-writer-wins on Equipment.open_work_order_id; runner-up rejected"

  - scenario: "Two technicians try to start the same PENDING work order"
    guarantee: "Exactly one start succeeds; loser sees a state conflict because the order is already IN_PROGRESS"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on WorkOrder.status"

  - scenario: "Two storekeepers issue the same Requisition concurrently"
    guarantee: "Exactly one issue succeeds; loser sees a state conflict because Requisition is already ISSUED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Requisition.status"

  - scenario: "Two issues against different requisitions on the same SparePart race past the last available unit"
    guarantee: "At most one issue succeeds for the unit; loser is rejected because stock_on_hand would go negative"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    serialization: "Optimistic stock decrement, lost decrement is rejected"

  - scenario: "Reassign and start race on the same PENDING work order"
    guarantee: "Exactly one operation succeeds; the other is rejected. If start wins, reassign sees status==IN_PROGRESS and is rejected; if reassign wins and the started-by user no longer matches the new assignee, start is rejected on identity check."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on WorkOrder.status / assigned_technician_id"

  - scenario: "Reassign and start race on the same PENDING work order, where reassign wins and the formerly-assigned technician then tries to start"
    guarantee: "Reassign wins; subsequent start by the displaced technician is rejected because X-User-ID no longer matches assigned_technician_id"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    serialization: "First-writer-wins on assigned_technician_id"

  - scenario: "PATCH version-based update race on Equipment, MaintenancePlan, Technician, or SparePart"
    guarantee: "Stale version is rejected; the writer that arrives second with the older version sees a version conflict"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "version field strictly increments by 1 per mutation"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: priority_score
    trigger: "WorkOrder creation; recomputed on POST /work-orders/:id/reassign-priority and on Equipment.criticality change"
    algorithm: weighted_scoring
    formula: |
      criticality_weight = { LOW: 1, MEDIUM: 2, HIGH: 4 }[Equipment.criticality]
      template_priority_weight = { P1: 8, P2: 4, P3: 2, P4: 1 }[TaskTemplate.default_priority]
      source_bonus = { ALARM: 4, PLAN_TRIGGER: 2, PLAN_PERIODIC: 1, AD_HOC: 1 }[WorkOrder.source]
      priority_score = criticality_weight * template_priority_weight + source_bonus
      priority bucket from priority_score:
        priority_score >= 30 → P1
        20 <= priority_score < 30 → P2
        8  <= priority_score < 20 → P3
        priority_score < 8       → P4
    input_set: "Equipment, TaskTemplate, WorkOrder.source"
    constants:
      P1_FLOOR: 30
      P2_FLOOR: 20
      P3_FLOOR: 8
    precision: "integer arithmetic only; bucket boundaries use >= for the lower bound (exact integer comparison)"

  - name: sla_minutes_for_priority
    trigger: "WorkOrder creation, priority change"
    algorithm: threshold
    formula: |
      sla_minutes = { P1: 240, P2: 480, P3: 1440, P4: 4320 }[priority]
      sla_due_at  = WorkOrder.opened_at + sla_minutes * 60 seconds
    input_set: "WorkOrder.priority, WorkOrder.opened_at"
    constants:
      P1_MIN: 240
      P2_MIN: 480
      P3_MIN: 1440
      P4_MIN: 4320
    precision: "Datetime arithmetic in seconds, no rounding (sla_minutes is integer)"

  - name: technician_selector
    trigger: "WorkOrder creation; reassign with new_technician_id absent (auto-route)"
    algorithm: selector_policy
    formula: |
      candidate_set = { T : T.status == ACTIVE
                        AND WorkOrder.required_skill IN T.skills
                        AND T.site_id == WorkOrder.site_id }
      rank_key(T) = (T.open_load ASC, T.created_at ASC)  # least loaded, then oldest
      tie_break: T.id ASC (lexicographic)
      empty_pool: WorkOrder.assigned_technician_id = null AND status remains PENDING (the order is created but waits; it is NOT rejected)
    input_set: "Technician (status=ACTIVE), WorkOrder.required_skill"
    constants: {}
    precision: "Integer comparison on open_load; lexicographic tie-break on id"

  - name: parts_cost
    trigger: "WorkOrder transition IN_PROGRESS → COMPLETED"
    algorithm: aggregation
    formula: |
      For each Requisition R linked to this WorkOrder where R.status == ISSUED:
        qty_used_R = R.qty - R.returned_qty   (RETURNED rows are aggregated into this same R; CANCELLED rows excluded)
        line_cost_cents_R = qty_used_R * R.unit_cost_cents_at_issue
        # Per-line discount applied BEFORE summation:
        if qty_used_R >= 10: line_cost_cents_R = floor(line_cost_cents_R * 0.90)
      parts_cost_cents = sum(line_cost_cents_R) for all such R
    input_set: "Requisition rows where status == ISSUED at the moment of WorkOrder.completion; ordered by Requisition.created_at ASC for deterministic floor accumulation"
    constants:
      BULK_QTY_THRESHOLD: 10
      BULK_DISCOUNT: 0.90
    precision: "Integer cents; floor() applies per-line-item BEFORE summation; this rounding order is the pinned variant"
    variants:
      - name: per_line_then_sum_PINNED
        when: "always — this is the canonical order"
        difference: "Discount and floor are applied to each line, then lines are summed. The alternative (sum then discount) yields different cents on mixed-bulk requisitions and is REJECTED."
      - name: sum_then_discount_REJECTED
        when: "never used by the implementation; reserved as the explicit dual-variant counter-example for tests"
        difference: "Would compute sum(qty_used*unit_cost) first, then apply 10% to lines whose individual qty_used>=10 retroactively — disallowed."

  - name: mttr
    trigger: "GET /sites/:site_id/analytics/mttr"
    algorithm: forward_looking
    formula: |
      Inputs: scope ∈ {EQUIPMENT, CATEGORY, SITE}, scope_id, window_start (inclusive), window_end (exclusive)
      Eligible WorkOrders W: W.completed_at IS NOT NULL
                              AND window_start <= W.completed_at < window_end
                              AND W.source IN {ALARM, PLAN_TRIGGER, AD_HOC}  -- failure-driven only
                              AND scope filter (equipment_id, equipment.category, or site)
      Two valid algorithms:
        VARIANT A (active_minutes_mean): mttr_minutes = mean(W.total_active_minutes) over Eligible
        VARIANT B (wallclock_mean):     mttr_minutes = mean( (W.completed_at - W.started_at) / 60s ) over Eligible (includes paused time)
      Default endpoint behavior is VARIANT A unless query parameter mode=wallclock is supplied.
      Return null if Eligible is empty.
    input_set: "WorkOrder rows with completed_at NOT NULL in the window, source filter as above"
    constants: {}
    precision: "Round half_up to 2 decimals"
    variants:
      - name: active_minutes_mean
        when: "default; analytics.mode parameter omitted or 'active'"
        difference: "Excludes time spent in PAUSED status (uses total_active_minutes)"
      - name: wallclock_mean
        when: "analytics.mode='wallclock'"
        difference: "Includes time spent PAUSED — different result for any WO that was paused"

  - name: mtbf
    trigger: "GET /sites/:site_id/analytics/mtbf"
    algorithm: chronological
    formula: |
      Per Equipment E in scope:
        ordered_completions = WorkOrders W on E with W.source IN {ALARM, PLAN_TRIGGER, AD_HOC}
                              AND W.completed_at NOT NULL
                              AND window_start <= W.completed_at < window_end,
                              sorted by W.completed_at ASC; tie-break: W.id ASC.
        gaps = []
        for i in [1 .. len(ordered_completions)-1]:
          gap_seconds = (ordered_completions[i].started_at - ordered_completions[i-1].completed_at)
          if gap_seconds > 0: gaps.append(gap_seconds)
        # NOTE: requires at least 2 completions in window; uses started_at of (i)
        # to define the next failure event, ignoring time before window_start.
      mtbf_hours_for_E = mean(gaps) / 3600 if gaps else null
      For SCOPE=CATEGORY or SCOPE=SITE, return weighted_mean across equipment by len(gaps_E),
        skipping equipment whose gaps list is empty; if all skipped, return null.
    input_set: "WorkOrder.completed_at, WorkOrder.started_at on equipment in scope"
    constants:
      SECONDS_PER_HOUR: 3600
    precision: "Round half_up to 2 decimals"

  - name: fault_recurrence
    trigger: "GET /sites/:site_id/analytics/fault-recurrence"
    algorithm: aggregation
    formula: |
      For Equipment E and look-back window of look_back_days (default 30):
        completions = WorkOrders on E with source IN {ALARM, PLAN_TRIGGER, AD_HOC}
                       AND completed_at in [Site.clock_now - look_back_days*86400s, Site.clock_now)
        recurrences = number of i>=1 where completions[i].started_at - completions[i-1].completed_at <= 7 days
      recurrence_rate = recurrences / max(len(completions)-1, 1)  -- 0 when only 0 or 1 completion
    input_set: "WorkOrders within Site.clock_now - look_back_days window"
    constants:
      DEFAULT_LOOK_BACK_DAYS: 30
      RECURRENCE_GAP_DAYS: 7
    precision: "Round half_up to 4 decimals"

  - name: equipment_availability
    trigger: "GET /sites/:site_id/analytics/availability"
    algorithm: forward_looking
    formula: |
      For Equipment E and window [window_start, window_end):
        downtime_seconds = sum over WorkOrders W on E where W.started_at < window_end AND
                          (W.completed_at IS NULL OR W.completed_at > window_start) of
                          ( min(W.completed_at OR Site.clock_now, window_end)
                            - max(W.started_at, window_start) )
                          for W with source IN {ALARM, PLAN_TRIGGER, AD_HOC}
        window_seconds = window_end - window_start
        availability = (window_seconds - downtime_seconds) / window_seconds
      VARIANT FORWARD: open work-orders count toward downtime up to Site.clock_now (provisional)
      VARIANT FINAL: open work-orders are EXCLUDED from downtime (only completed contribute)
    input_set: "WorkOrder rows that overlap the analytics window"
    constants: {}
    precision: "Round half_up to 4 decimals"
    variants:
      - name: forward_provisional
        when: "analytics.mode='provisional' (default)"
        difference: "Open work orders contribute downtime up to Site.clock_now"
      - name: final_only_completed
        when: "analytics.mode='final'"
        difference: "Open work orders contribute zero downtime (only COMPLETED count)"

  - name: plan_generation
    trigger: "POST /sites/:site_id/sweep/run; also POST /sites/:site_id/equipment/:equipment_id/alarms"
    algorithm: chronological
    formula: |
      Step 1 — periodic-time plans:
        for plan P in (Plan.status==ACTIVE AND kind=PERIODIC_TIME), ordered by P.next_due_at ASC, P.id ASC:
          if Site.clock_now >= P.next_due_at AND Equipment(P.equipment_id).open_work_order_id IS NULL
             AND Equipment.lifecycle_status IN {COMMISSIONED, IN_SERVICE}:
            create WorkOrder (source=PLAN_PERIODIC); set P.last_generated_at=Site.clock_now;
            P.next_due_at = Site.clock_now + interval_days*86400s
      Step 2 — periodic-usage plans:
        for plan P in (status==ACTIVE AND kind=PERIODIC_USAGE), ordered by P.id ASC:
          baseline = P.last_generated_usage if not null else 0
          if (Equipment.usage_counter - baseline) >= P.interval_usage AND open_work_order_id IS NULL ...:
            create WorkOrder (source=PLAN_PERIODIC); P.last_generated_usage = Equipment.usage_counter;
            P.last_generated_at = Site.clock_now
      Step 3 — trigger-alarm plans (only for /alarms endpoint, NOT for /sweep/run):
        on AlarmEvent A: for plan P in (status==ACTIVE AND kind=TRIGGER_ALARM AND alarm_code==A.alarm_code AND equipment_id==A.equipment_id):
          if open_work_order_id IS NULL: create WorkOrder (source=ALARM); A.generated_work_order_id = WorkOrder.id
      Step 4 — trigger-threshold plans (also on /alarms, threshold sub-mode):
        on AlarmEvent A with alarm_code matching threshold metric channel:
          for plan P in (status==ACTIVE AND kind=TRIGGER_THRESHOLD AND threshold_metric==A.alarm_code AND equipment_id==A.equipment_id):
          eval predicate: A.severity-derived metric_value (passed in body as metric_value) vs threshold_op/threshold_value
          if predicate true AND open_work_order_id IS NULL: create WorkOrder (source=ALARM)
      Note — only ONE WorkOrder may be created per equipment per /sweep/run tick;
        if multiple plans match, the first plan in the ordering above wins and the rest are deferred to the next tick.
    input_set: "ACTIVE MaintenancePlans, current Site.clock_now, Equipment.usage_counter, AlarmEvents emitted in this request"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "Datetime in seconds; integer arithmetic on usage_counter"

  - name: replenish_evaluator
    trigger: "Requisition transitions {RESERVED→ISSUED, ISSUED→RETURNED, RESERVED→CANCELLED}"
    algorithm: threshold
    formula: |
      available = SparePart.stock_on_hand - SparePart.stock_reserved
      if available <= SparePart.reorder_point AND SparePart.replenish_pending == false:
        SparePart.replenish_pending = true
        emit /events/replenish notification (test fixture only — does NOT change DB beyond this flag)
      if available > SparePart.reorder_point:
        SparePart.replenish_pending = false  # auto-cleared if available rises above the point
    input_set: "SparePart.stock_on_hand, stock_reserved, reorder_point"
    constants: {}
    precision: "Integer comparison; boundary uses <= for the trigger"

# =============================================================================
# §1.4 Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource ids in the URL path exist within the named site (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Cross-aggregate references in the body resolve to the same site_id (e.g., MaintenancePlan.equipment_id and template_id must both belong to the URL site)"
    error_id: ERR_CROSS_SITE_REFERENCE
    http_status: 422
    applies_to: "POST /plans, POST /work-orders, POST /requisitions"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for this operation per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "Equipment.lifecycle_status permits the operation (cross-entity precondition); e.g., starting a WorkOrder requires Equipment IN_SERVICE or COMMISSIONED"
    error_id: ERR_EQUIPMENT_LIFECYCLE
    http_status: 409
    applies_to: "POST /plans/:id/activate, POST /work-orders, POST /work-orders/:id/start"

  - priority: 7
    category: business_safety
    check: "Equipment must not already have an open WorkOrder when a new one is being created (open = status IN {PENDING, IN_PROGRESS, PAUSED})"
    error_id: ERR_EQUIPMENT_BUSY
    http_status: 409
    applies_to: "POST /work-orders, POST /sweep/run, POST /alarms"

  - priority: 8
    category: business_safety
    check: "Acceptance requires a RepairRecord with non-empty before_evidence_url AND after_evidence_url"
    error_id: ERR_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /work-orders/:id/accept"

  - priority: 9
    category: business_referential
    check: "Technician.skills must include WorkOrder.required_skill on assignment/reassignment"
    error_id: ERR_SKILL_MISMATCH
    http_status: 422
    applies_to: "POST /work-orders/:id/reassign, technician_selector during creation"

  - priority: 10
    category: business_referential
    check: "Acceptance must be performed by the equipment's responsible_user_id"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "POST /work-orders/:id/accept"

  - priority: 11
    category: business_referential
    check: "WorkOrder transitions other than reassign and create require X-User-ID == assigned_technician_id"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "POST /work-orders/:id/start, /pause, /resume, /complete"

  - priority: 12
    category: business_temporal
    check: "Cannot cancel a PAUSED WorkOrder until at least one /sweep/run has elapsed since pause"
    error_id: ERR_PAUSE_TOO_FRESH
    http_status: 409
    applies_to: "POST /work-orders/:id/cancel"

  - priority: 13
    category: business_constraint
    check: "Completion requires no still-RESERVED Requisitions on this WorkOrder"
    error_id: ERR_REQUISITIONS_PENDING
    http_status: 409
    applies_to: "POST /work-orders/:id/complete"

  - priority: 14
    category: business_constraint
    check: "Resume requires at least one ISSUED Requisition when pause_reason==WAIT_PARTS"
    error_id: ERR_PARTS_NOT_ISSUED
    http_status: 409
    applies_to: "POST /work-orders/:id/resume"

  - priority: 15
    category: business_constraint
    check: "Maintenance plan body must include the kind-required fields (interval_days for PERIODIC_TIME, interval_usage for PERIODIC_USAGE, alarm_code for TRIGGER_ALARM, all three of threshold_metric/op/value for TRIGGER_THRESHOLD)"
    error_id: ERR_PLAN_KIND_FIELDS
    http_status: 422
    applies_to: "POST /plans, PATCH /plans/:id"

  - priority: 16
    category: business_fiscal
    check: "Issue requires SparePart.stock_on_hand >= Requisition.qty (strict)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /requisitions/:id/issue"

  - priority: 17
    category: business_fiscal
    check: "Reservation requires available stock (stock_on_hand - stock_reserved) >= qty"
    error_id: ERR_INSUFFICIENT_AVAILABLE
    http_status: 409
    applies_to: "POST /work-orders/:id/requisitions"

  - priority: 18
    category: business_constraint
    check: "Return body returned_qty must satisfy 0 < returned_qty <= Requisition.qty - Requisition.returned_qty"
    error_id: ERR_RETURN_QTY_INVALID
    http_status: 422
    applies_to: "POST /requisitions/:id/return"

  - priority: 19
    category: business_temporal
    check: "Equipment.warranty_end > warranty_start; alarm.emitted_at not provided by client (system-set)"
    error_id: ERR_TEMPORAL_INVALID
    http_status: 422
    applies_to: "POST /equipment, PATCH /equipment, POST /alarms"

  - priority: 20
    category: business_constraint
    check: "OCC version match on PATCH endpoints (Equipment, MaintenancePlan, SparePart, Technician)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /equipment/:id, PATCH /plans/:id, PATCH /spare-parts/:id, PATCH /technicians/:id"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Site & test-driving control ---
  - method: POST
    path: "/sites"
    description: "Create a Site"
    roles: [SiteManager]
    code: 201
    input: [name]
    output: Site
    side_effects: ["clock_now=2026-01-01T00:00:00.000Z, sweep_run_index=0"]

  - method: GET
    path: "/sites/:site_id"
    description: "Get a Site"
    roles: [Any]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/sites/:site_id/clock/advance"
    description: "Test-driving endpoint: advance Site.clock_now by N seconds (no automatic sweep)"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: [seconds]
    output: Site
    side_effects: ["Site.clock_now += seconds (seconds > 0)"]

  - method: POST
    path: "/sites/:site_id/sweep/run"
    description: "Test-driving endpoint: increment sweep_run_index and run plan_generation Steps 1 & 2; recompute sla_breached on all open WorkOrders"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: []
    output: Site
    side_effects:
      - "sweep_run_index += 1"
      - "PERIODIC_TIME and PERIODIC_USAGE plans evaluated; new WorkOrders created where eligible"
      - "Open WorkOrders' sla_breached recomputed"

  # --- Equipment ---
  - method: POST
    path: "/sites/:site_id/equipment"
    description: "Create equipment"
    roles: [SiteManager]
    code: 201
    input: [asset_tag, category, location, responsible_user_id, technical_spec, criticality, warranty_start, warranty_end, "usage_counter?"]
    output: Equipment
    side_effects: ["lifecycle_status=INSTALLED"]

  - method: GET
    path: "/sites/:site_id/equipment/:equipment_id"
    description: "Get equipment"
    roles: [Any]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: PATCH
    path: "/sites/:site_id/equipment/:equipment_id"
    description: "Update equipment fields (criticality, location, responsible_user_id, technical_spec, usage_counter); requires version"
    roles: [SiteManager]
    code: 200
    input: ["version", "criticality?", "location?", "responsible_user_id?", "technical_spec?", "usage_counter?"]
    output: Equipment
    side_effects:
      - "If criticality changes, recompute priority_score and priority on all open WorkOrders for this equipment; recompute sla_due_at if priority bucket changes"

  - method: POST
    path: "/sites/:site_id/equipment/:equipment_id/commission"
    description: "Transition equipment INSTALLED → COMMISSIONED"
    roles: [SiteManager]
    code: 200
    input: []
    output: Equipment
    side_effects: ["lifecycle_status=COMMISSIONED"]

  - method: POST
    path: "/sites/:site_id/equipment/:equipment_id/place-in-service"
    description: "Transition COMMISSIONED → IN_SERVICE"
    roles: [SiteManager]
    code: 200
    input: []
    output: Equipment
    side_effects: ["lifecycle_status=IN_SERVICE"]

  - method: POST
    path: "/sites/:site_id/equipment/:equipment_id/decommission"
    description: "Transition IN_SERVICE → DECOMMISSIONED with cascading plan retirement and PENDING work-order cancellation"
    roles: [SiteManager]
    code: 200
    input: []
    output: Equipment
    side_effects:
      - "All ACTIVE plans on this equipment → RETIRED"
      - "All PENDING WorkOrders → CANCELLED (cancel_reason=EQUIPMENT_DECOMMISSIONED); RESERVED requisitions on those WOs → CANCELLED; replenish_evaluator runs for each affected SparePart"

  - method: POST
    path: "/sites/:site_id/equipment/:equipment_id/alarms"
    description: "Test-driving endpoint: emit an AlarmEvent (mirrors the equipment-monitoring system); runs plan_generation Steps 3 & 4"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: [alarm_code, severity, "metric_value?"]
    output: AlarmEvent
    side_effects:
      - "AlarmEvent created with emitted_at=Site.clock_now"
      - "TRIGGER_ALARM plans for matching alarm_code may create a WorkOrder (source=ALARM)"
      - "TRIGGER_THRESHOLD plans where threshold_metric==alarm_code AND predicate(metric_value, threshold_op, threshold_value) holds may create a WorkOrder"

  # --- TaskTemplate ---
  - method: POST
    path: "/sites/:site_id/templates"
    description: "Create a task template"
    roles: [PlanOwner]
    code: 201
    input: [code, title, equipment_category, required_skill, estimated_minutes, default_priority]
    output: TaskTemplate
    side_effects: []

  - method: GET
    path: "/sites/:site_id/templates/:template_id"
    description: "Get a task template"
    roles: [Any]
    code: 200
    input: []
    output: TaskTemplate
    side_effects: []

  # --- MaintenancePlan ---
  - method: POST
    path: "/sites/:site_id/plans"
    description: "Create a maintenance plan in DRAFT"
    roles: [PlanOwner]
    code: 201
    input: [equipment_id, template_id, kind, "interval_days?", "interval_usage?", "alarm_code?", "threshold_metric?", "threshold_op?", "threshold_value?"]
    output: MaintenancePlan
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/sites/:site_id/plans/:plan_id"
    description: "Get a maintenance plan"
    roles: [Any]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: []

  - method: PATCH
    path: "/sites/:site_id/plans/:plan_id"
    description: "Adjust plan body (interval, threshold etc.); requires version. Cannot change kind."
    roles: [PlanOwner]
    code: 200
    input: ["version", "interval_days?", "interval_usage?", "alarm_code?", "threshold_metric?", "threshold_op?", "threshold_value?"]
    output: MaintenancePlan
    side_effects:
      - "For PERIODIC_TIME, recompute next_due_at = (last_generated_at OR plan.created_at) + new interval_days*86400s"

  - method: POST
    path: "/sites/:site_id/plans/:plan_id/activate"
    description: "Transition DRAFT → ACTIVE"
    roles: [PlanOwner]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: ["next_due_at initialized for PERIODIC_TIME; baseline initialized for PERIODIC_USAGE"]

  - method: POST
    path: "/sites/:site_id/plans/:plan_id/pause"
    description: "Transition ACTIVE → PAUSED"
    roles: [PlanOwner]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: []

  - method: POST
    path: "/sites/:site_id/plans/:plan_id/resume"
    description: "Transition PAUSED → ACTIVE"
    roles: [PlanOwner]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: ["next_due_at re-evaluated for PERIODIC_TIME"]

  - method: POST
    path: "/sites/:site_id/plans/:plan_id/retire"
    description: "Transition ACTIVE|PAUSED → RETIRED"
    roles: [PlanOwner]
    code: 200
    input: []
    output: MaintenancePlan
    side_effects: []

  # --- SparePart ---
  - method: POST
    path: "/sites/:site_id/spare-parts"
    description: "Create a spare-part SKU"
    roles: [Storekeeper]
    code: 201
    input: [sku, name, unit_cost_cents, "stock_on_hand?", reorder_point]
    output: SparePart
    side_effects: ["replenish_evaluator runs at creation"]

  - method: GET
    path: "/sites/:site_id/spare-parts/:part_id"
    description: "Get a spare part"
    roles: [Any]
    code: 200
    input: []
    output: SparePart
    side_effects: []

  - method: PATCH
    path: "/sites/:site_id/spare-parts/:part_id"
    description: "Adjust unit_cost_cents, reorder_point, or restock (delta to stock_on_hand); requires version"
    roles: [Storekeeper]
    code: 200
    input: ["version", "unit_cost_cents?", "reorder_point?", "stock_delta?"]
    output: SparePart
    side_effects:
      - "stock_delta>0 increases stock_on_hand (replenishment delivery)"
      - "replenish_evaluator runs after the delta is applied"

  # --- Technician ---
  - method: POST
    path: "/sites/:site_id/technicians"
    description: "Create a technician"
    roles: [SiteManager]
    code: 201
    input: [name, skills]
    output: Technician
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/sites/:site_id/technicians/:tech_id"
    description: "Get a technician"
    roles: [Any]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: PATCH
    path: "/sites/:site_id/technicians/:tech_id"
    description: "Update skills or status; requires version"
    roles: [SiteManager]
    code: 200
    input: ["version", "skills?", "status?"]
    output: Technician
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/sites/:site_id/work-orders"
    description: "Create an ad-hoc WorkOrder; runs technician_selector"
    roles: [Dispatcher, SiteManager]
    code: 201
    input: [equipment_id, template_id, "explicit_priority?", "preferred_technician_id?"]
    output: WorkOrder
    side_effects:
      - "source=AD_HOC; priority computed via priority_score formula"
      - "If preferred_technician_id provided and matches selector eligibility, assigned_technician_id is set to it; else technician_selector runs"
      - "Equipment.open_work_order_id = WorkOrder.id"
      - "sla_due_at computed from priority"

  - method: GET
    path: "/sites/:site_id/work-orders/:wo_id"
    description: "Get a WorkOrder"
    roles: [Any]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/sites/:site_id/work-orders"
    description: "List WorkOrders with filtering & pagination"
    roles: [Any]
    code: 200
    input: ["status?", "equipment_id?", "assigned_technician_id?", "priority?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/reassign"
    description: "Reassign a PENDING WorkOrder to a new technician"
    roles: [Dispatcher]
    code: 200
    input: [new_technician_id]
    output: WorkOrder
    side_effects:
      - "assigned_technician_id replaced; reassign_count += 1 if previous assignee was non-null"
      - "AuditEntry appended (action=TECHNICIAN_ASSIGNED)"

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/start"
    description: "Technician starts the WorkOrder"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status PENDING→IN_PROGRESS; Equipment IN_SERVICE→UNDER_MAINTENANCE; started_at=clock_now"]

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/pause"
    description: "Pause an IN_PROGRESS WorkOrder"
    roles: [Technician]
    code: 200
    input: [pause_reason]
    output: WorkOrder
    side_effects: ["status IN_PROGRESS→PAUSED; total_active_minutes increment"]

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/resume"
    description: "Resume a PAUSED WorkOrder"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status PAUSED→IN_PROGRESS; pause_reason cleared"]

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/complete"
    description: "Complete the WorkOrder; submits the RepairRecord and snapshots parts_replaced"
    roles: [Technician]
    code: 200
    input: [fault_description, root_cause, repair_actions, working_minutes, before_evidence_url, after_evidence_url]
    output: WorkOrder
    side_effects:
      - "RepairRecord created"
      - "WorkOrder.parts_cost_cents computed via parts_cost"
      - "Equipment.last_repair_completed_at = clock_now; lifecycle_status UNDER_MAINTENANCE → IN_SERVICE"
      - "AuditEntry appended"

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/accept"
    description: "Equipment owner accepts the completed work; transitions to CLOSED"
    roles: [SiteManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["RepairRecord.acceptance_user_id and acceptance_at populated; closed_at=clock_now"]

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/cancel"
    description: "Cancel a PENDING or PAUSED WorkOrder"
    roles: [Dispatcher]
    code: 200
    input: ["cancel_reason?"]
    output: WorkOrder
    side_effects:
      - "PENDING: RESERVED requisitions → CANCELLED; replenish_evaluator runs"
      - "PAUSED: requires no ISSUED requisitions and at least one /sweep/run since pause; Equipment lifecycle restored"

  # --- Requisition ---
  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/requisitions"
    description: "Reserve parts against a WorkOrder (status=RESERVED)"
    roles: [Technician, Storekeeper]
    code: 201
    input: [part_id, qty]
    output: Requisition
    side_effects:
      - "stock_reserved += qty"
      - "replenish_evaluator runs"

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/requisitions/:req_id/issue"
    description: "Issue a RESERVED requisition; takes from stock_on_hand"
    roles: [Storekeeper]
    code: 200
    input: []
    output: Requisition
    side_effects:
      - "stock_on_hand -= qty; stock_reserved -= qty"
      - "unit_cost_cents_at_issue snapshot taken"
      - "replenish_evaluator runs"
      - "AuditEntry (PARTS_ISSUED) appended"

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/requisitions/:req_id/return"
    description: "Return some/all of an ISSUED requisition"
    roles: [Storekeeper]
    code: 200
    input: [returned_qty]
    output: Requisition
    side_effects:
      - "stock_on_hand += returned_qty"
      - "Requisition.returned_qty += returned_qty"
      - "replenish_evaluator runs"
      - "AuditEntry (PARTS_RETURNED) appended"

  - method: POST
    path: "/sites/:site_id/work-orders/:wo_id/requisitions/:req_id/cancel"
    description: "Cancel a RESERVED requisition"
    roles: [Technician, Storekeeper]
    code: 200
    input: []
    output: Requisition
    side_effects:
      - "stock_reserved -= qty"
      - "replenish_evaluator runs"

  # --- Repair record ---
  - method: GET
    path: "/sites/:site_id/work-orders/:wo_id/repair-record"
    description: "Get the RepairRecord (after WorkOrder completes)"
    roles: [Any]
    code: 200
    input: []
    output: RepairRecord
    side_effects: []

  # --- Audit & analytics ---
  - method: GET
    path: "/sites/:site_id/audit"
    description: "List audit entries (filterable by action and target_id) with pagination"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: ["action?", "target_id?", "limit?", "offset?"]
    output: "AuditEntry[]"
    side_effects: []

  - method: GET
    path: "/sites/:site_id/analytics/mttr"
    description: "MTTR by scope (EQUIPMENT, CATEGORY, SITE) over a window"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: [scope, "scope_id?", window_start, window_end, "mode?"]
    output: "{ mttr_minutes: number | null, sample_size: integer }"
    side_effects: []

  - method: GET
    path: "/sites/:site_id/analytics/mtbf"
    description: "MTBF by scope over a window"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: [scope, "scope_id?", window_start, window_end]
    output: "{ mtbf_hours: number | null, gap_count: integer }"
    side_effects: []

  - method: GET
    path: "/sites/:site_id/analytics/fault-recurrence"
    description: "Fault-recurrence rate per equipment over the look-back window"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: ["look_back_days?"]
    output: "{ items: [{equipment_id, recurrence_rate, completion_count}] }"
    side_effects: []

  - method: GET
    path: "/sites/:site_id/analytics/availability"
    description: "Equipment availability over a window"
    roles: [SiteManager, Dispatcher]
    code: 200
    input: [equipment_id, window_start, window_end, "mode?"]
    output: "{ availability: number, downtime_seconds: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed JSON or missing required body field"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "Action requires X-User-ID equal to a specific entity-owned id (e.g., assigned_technician_id, responsible_user_id)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource not present within the URL site"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH version does not match current entity version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in the correct state for this operation"
  - id: ERR_EQUIPMENT_LIFECYCLE
    http: 409
    condition: "Equipment.lifecycle_status forbids the requested operation (e.g., DECOMMISSIONED equipment cannot host new work)"
  - id: ERR_EQUIPMENT_BUSY
    http: 409
    condition: "Equipment already has an open WorkOrder (PENDING|IN_PROGRESS|PAUSED)"
  - id: ERR_NO_ACTIVE_PLAN
    http: 409
    condition: "Equipment commissioning attempted without any ACTIVE MaintenancePlan attached"
  - id: ERR_PAUSE_TOO_FRESH
    http: 409
    condition: "PAUSED → CANCELLED requires at least one /sweep/run since pause"
  - id: ERR_REQUISITIONS_PENDING
    http: 409
    condition: "WorkOrder cannot complete while it has Requisitions in status RESERVED"
  - id: ERR_PARTS_NOT_ISSUED
    http: 409
    condition: "Resume from WAIT_PARTS requires at least one ISSUED Requisition on this WorkOrder"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "stock_on_hand < requested issue quantity"
  - id: ERR_INSUFFICIENT_AVAILABLE
    http: 409
    condition: "(stock_on_hand - stock_reserved) < requested reservation quantity"
  - id: ERR_PLAN_KIND_FIELDS
    http: 422
    condition: "MaintenancePlan body missing kind-required fields"
  - id: ERR_CROSS_SITE_REFERENCE
    http: 422
    condition: "Body references an entity owned by a different site"
  - id: ERR_EVIDENCE_MISSING
    http: 422
    condition: "Acceptance attempted without before/after evidence URLs in RepairRecord"
  - id: ERR_SKILL_MISMATCH
    http: 422
    condition: "Technician.skills does not include WorkOrder.required_skill"
  - id: ERR_RETURN_QTY_INVALID
    http: 422
    condition: "Return quantity is non-positive or exceeds remaining issued quantity"
  - id: ERR_TEMPORAL_INVALID
    http: 422
    condition: "Datetime invariants violated (warranty_end <= warranty_start; client supplied a system-set time)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SiteManager
    description: "Owns site, equipment, technicians; accepts completed work for equipment they are responsible_user_id for"
    identity: "opaque"
    exclusive_operations:
      - "POST /sites — create site"
      - "POST /sites/:id/equipment — create equipment"
      - "PATCH /sites/:id/equipment/:eq_id — update equipment"
      - "POST .../commission, /place-in-service, /decommission — equipment lifecycle"
      - "POST /sites/:id/technicians, PATCH /sites/:id/technicians/:tid"
      - "POST /sites/:id/work-orders/:wo/accept — accept completed work"
    shared_operations:
      - "POST /sites/:id/clock/advance, /sweep/run (with Dispatcher)"
      - "POST /sites/:id/equipment/:eq_id/alarms (with Dispatcher)"
      - "POST /sites/:id/work-orders (ad-hoc create) (with Dispatcher)"
      - "GET analytics, audit (with Dispatcher)"

  - name: PlanOwner
    description: "Manages task templates and maintenance plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /sites/:id/templates"
      - "POST /sites/:id/plans, PATCH /sites/:id/plans/:pid"
      - "POST .../plans/:pid/activate, /pause, /resume, /retire"

  - name: Dispatcher
    description: "Routes work orders, reassigns technicians, cancels stale orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /sites/:id/work-orders/:wo/reassign"
      - "POST /sites/:id/work-orders/:wo/cancel"
    shared_operations:
      - "POST /sites/:id/work-orders (with SiteManager)"
      - "POST /sites/:id/clock/advance, /sweep/run, /alarms (with SiteManager)"
      - "GET analytics, audit (with SiteManager)"

  - name: Technician
    description: "Field worker; X-User-ID is the Technician.id of an entity-backed user. Can only act on WorkOrders assigned to them."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /sites/:id/work-orders/:wo/start, /pause, /resume, /complete (only when X-User-ID == assigned_technician_id)"
    shared_operations:
      - "POST /sites/:id/work-orders/:wo/requisitions (with Storekeeper)"
      - "POST /sites/:id/work-orders/:wo/requisitions/:rid/cancel (with Storekeeper)"

  - name: Storekeeper
    description: "Manages spare-part inventory and requisition lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /sites/:id/spare-parts, PATCH /sites/:id/spare-parts/:pid"
      - "POST /sites/:id/work-orders/:wo/requisitions/:rid/issue"
      - "POST /sites/:id/work-orders/:wo/requisitions/:rid/return"
    shared_operations:
      - "POST /sites/:id/work-orders/:wo/requisitions (with Technician)"
      - "POST /sites/:id/work-orders/:wo/requisitions/:rid/cancel (with Technician)"

  - name: Any
    description: "Any authenticated role can read public information"
    identity: "opaque"
    shared_operations:
      - "GET /sites/:id, GET /sites/:id/equipment/:eq_id"
      - "GET /sites/:id/templates/:tid, /plans/:pid, /spare-parts/:pid, /technicians/:tid"
      - "GET /sites/:id/work-orders, /work-orders/:wo, /work-orders/:wo/repair-record"
