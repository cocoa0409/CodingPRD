              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Records retention overhaul", summary: "Overhaul agency records retention.", requested_sections_count: 3, target_code_chapter: "Title 44", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_a: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Notary commission reform", summary: "Reform notary commissioning.", requested_sections_count: 3, target_code_chapter: "Title 45", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_b: $.data.id }
            - call: "POST /drafting-requests/${dr_a}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-02T00:00:00Z", engagement_end_utc: "2026-09-10T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr_b}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-03T00:00:00Z", engagement_end_utc: "2026-09-11T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr_a}/complete-research"
              payload: { affected_sections_count: 3 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr_b}/complete-research"
              payload: { affected_sections_count: 3 }
              as: Drafter
