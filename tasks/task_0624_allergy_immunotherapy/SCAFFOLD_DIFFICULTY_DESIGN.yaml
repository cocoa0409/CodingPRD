              as: Pharmacist
              captures: { green_vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "SILVER", lot_number: "SIL-600", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
