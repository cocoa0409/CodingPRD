  # ===========================================================================
  # RULE 5 — Priority pairs among simultaneously violated validations
  # Three different category pairs, each on a single endpoint where both
  # conditions genuinely hold, each with the falsifier half that shows the
  # loser surfacing once the winner is repaired.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspended_operator_auth_beats_asset_state_on_qc_waiver
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors[ERR_OPERATOR_SUSPENDED]
          - errors[ERR_ASSET_INVALID_STATE]
          - entities.Operator.fields.status
        distinguishing_aspect: |
          Category pair auth(403) x state(409): the waiver request is made by a
          SUSPENDED PROGRAM_DIRECTOR against an asset that is in QC_PASSED rather
          than QC_FAILED, so priority 6 and priority 16 both hold; the response
          must be 403 ERR_OPERATOR_SUSPENDED, and reinstating the operator to
          ACTIVE must then make the very same request return 409
          ERR_ASSET_INVALID_STATE — proving the auth tier is evaluated strictly
          before any entity-state test.
        test_recipe:
          setup:
            - "Operators: QC (role_class QC, ACTIVE) and Pat Director (role_class PROGRAM_DIRECTOR, override_authority FULL, certification_expires_utc 2027-01-01T00:00:00Z)."
            - "Asset A (expected_duration_seconds 600, required_resolution_class SD_480I, captions_required false) delivered clean and graded by an INGEST QCReport with no defects, measured 600 s and loudness -24.0, so technical_score == 100, verdict PASS and Asset.status == QC_PASSED."
            - "Pat Director has then been set to status SUSPENDED by StationAdmin, while certification_expires_utc stays in the future so priority 7 cannot fire."
            - "The logical clock stands at 2026-08-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Quinn QC", role_class: "QC", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { qc_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Pat Director", role_class: "PROGRAM_DIRECTOR", override_authority: "FULL", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { pd_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /assets"
              payload: { house_number: "HN-A", title: "Feature A", source: "FILE_DELIVERY", expected_duration_seconds: 600, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { asset_a_id: "$.data.id" }
            - call: "POST /assets/${asset_a_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 600, video_codec: "H264", delivered_resolution_class: "SD_480I", frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: "STEREO_2_0", caption_present: false }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_a_v: "$.data.version" }
            - call: "POST /assets/${asset_a_id}/qc-reports"
              payload: { expected_asset_version: "${asset_a_v}", inspected_by_operator_id: "${qc_id}", basis: "INGEST", defect_codes: [], measured_duration_seconds: 600 }
              as: QCTechnician
              as_user_id: "${qc_id}"
            - call: "POST /operators/${pd_id}/status"
              payload: { status: "SUSPENDED" }
              as: StationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /assets/${asset_a_id}/qc-waivers"
              payload: { waived_by_operator_id: "${pd_id}", waiver_justification: "Program director accepts the delivered master for air." }
              as: ProgramDirector
              as_user_id: "${pd_id}"
          assert:
            - "HTTP 403 with error_id == ERR_OPERATOR_SUSPENDED"
            - "The response error_id is NOT ERR_ASSET_INVALID_STATE"
            - "Asset.${asset_a_id}.status == QC_PASSED"
            - "Asset.${asset_a_id}.waived_by_operator_id == null and Asset.${asset_a_id}.waiver_justification == null"
            - "After POST /operators/${pd_id}/status with { status: ACTIVE } as StationAdmin, replaying the identical trigger returns HTTP 409 with error_id == ERR_ASSET_INVALID_STATE"
            - "Asset.${asset_a_id}.status is still QC_PASSED after the replay"

