        distinguishing_aspect: "A third entity_backed ownership edge: close compares X-User-ID with CounselingReferral.counselor_id, so counselor B is refused with ERR_NOT_RESOURCE_OWNER (403) while counselor A's identical call succeeds and returns A's capacity."
