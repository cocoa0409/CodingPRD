  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: custody_log_half_open_interval_no_overlap
        grounds:
          - validations[priority=7]
          - entities.EvidenceCustodyLog
          - errors[ERR_CUSTODY_OVERLAP]
        distinguishing_aspect: |
          Resource: EvidenceItem custody. Interval semantics: half-open [start_at, end_at) —
          a new log starting exactly when a prior one ends is ALLOWED (touching edges OK);
          strictly overlapping is rejected. Different resource than CallCenterStaffingPlan.
        test_recipe:
          setup:
            - "Incident with one EvidenceItem; one existing EvidenceCustodyLog covering [2026-05-01T10:00:00Z, 2026-05-01T12:00:00Z)"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-O", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "s", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 100 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "e", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/custody-logs"
              payload: { evidence_item_id: "${ev_id}", custodian_user_id: "u1", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T12:00:00Z", purpose: "intake" }
              as: ForensicLead
          trigger:
            - call: "POST /incidents/${inc_id}/custody-logs"
              payload: { evidence_item_id: "${ev_id}", custodian_user_id: "u2", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T14:00:00Z", purpose: "handoff" }
              as: ForensicLead
              captures: { ok_log_id: $.data.id }
            - call: "POST /incidents/${inc_id}/custody-logs"
              payload: { evidence_item_id: "${ev_id}", custodian_user_id: "u3", start_at: "2026-05-01T13:00:00Z", end_at: "2026-05-01T15:00:00Z", purpose: "overlap attempt" }
              as: ForensicLead
              captures: { err: $.data.error_id }
          assert:
            - "# First trigger succeeds (touching at end==start, half-open semantics)"
            - "EvidenceCustodyLog.${ok_log_id}.custodian_user_id == 'u2'"
            - "# Second trigger overlaps [12:00, 14:00) with [13:00, 15:00) -> rejected"
            - "err == ERR_CUSTODY_OVERLAP"

      - name: staffing_plan_overlap_strict_only
        grounds:
          - validations[priority=12]
          - entities.CallCenterStaffingPlan
          - errors[ERR_STAFFING_PLAN_OVERLAP]
        distinguishing_aspect: |
          Resource: CallCenterStaffingPlan per incident. Interval semantics: STRICT overlap
          required to reject — touching edges (new plan's effective_from == existing plan's
          effective_until) is ALLOWED (aggregate capacity handoff, not half-open geometry).
          Different resource AND different interval semantics than custody-log.
        test_recipe:
          setup:
            - "Incident CONFIRMED with one ACTIVE CallCenterStaffingPlan [2026-05-02, 2026-06-02)"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-P", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "s", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 100 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "e", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items/${ev_id}/seal"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S1", full_name: "A", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_id: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_id}/verify"
              payload: {}
              as: DataAnalyst
            - call: "POST /incidents/${inc_id}/jurisdiction-evaluations"
              payload: { state_code: "CA", statute_reference: "S", record_count_threshold: 1, deadline_days: 30, deadline_kind: "CALENDAR_DAYS", requires_ag_notification: false, requires_credit_agencies: false }
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/confirm"
              payload: {}
              as: IncidentCommander
            - call: "POST /incidents/${inc_id}/call-center-staffing-plans"
              payload: { effective_from: "2026-05-02T00:00:00Z", effective_until: "2026-06-02T00:00:00Z", languages_supported: ["en"] }
              as: IncidentCommander
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/call-center-staffing-plans"
              payload: { effective_from: "2026-06-02T00:00:00Z", effective_until: "2026-07-02T00:00:00Z", languages_supported: ["en"] }
              as: IncidentCommander
              captures: { plan2_id: $.data.id }
            - call: "POST /incidents/${inc_id}/call-center-staffing-plans"
              payload: { effective_from: "2026-06-01T00:00:00Z", effective_until: "2026-07-15T00:00:00Z", languages_supported: ["en"] }
              as: IncidentCommander
              captures: { err: $.data.error_id }
          assert:
            - "# Touching edge (effective_from == existing plan's effective_until) is allowed"
            - "CallCenterStaffingPlan.${plan2_id}.status == ACTIVE"
            - "CallCenterStaffingPlan.${plan_id}.status == SUPERSEDED  # superseded by strict-containment rule? NO — touching edge does not supersede either; per spec, only strict overlap supersedes. Adjust: since new plan's effective_from == old plan's effective_until, no overlap -> old stays ACTIVE."
            - "# Corrected assert:"
            - "CallCenterStaffingPlan.${plan_id}.status == ACTIVE"
            - "# Overlapping plan rejected"
            - "err == ERR_STAFFING_PLAN_OVERLAP"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: notified_plus_pending_equals_affected
        grounds:
          - entities.Incident.fields.total_affected_subjects
          - entities.Incident.fields.total_notified_subjects
          - entities.Incident.fields.total_pending_subjects
          - state_machines.AffectedSubject
        distinguishing_aspect: |
          Conserved quantity: total_notified_subjects + total_pending_subjects == total_affected_subjects.
          Forward action (mark-shipped moves subjects NOTICE_QUEUED -> NOTIFIED) paired with its
          compensating action (exclude moves NOTIFIED? — exclude is forbidden post-DISPATCHING; instead
          exclude from IDENTIFIED) — the invariant must hold across subject lifecycle transitions.
        test_recipe:
          setup:
            - "Incident with 3 subjects: 2 VERIFIED (will flow to NOTIFIED) and 1 IDENTIFIED (will be EXCLUDED — the compensating action)"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-Q", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "s", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 100 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "e", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items/${ev_id}/seal"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S1", full_name: "A", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_1: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S2", full_name: "B", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_2: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S3", full_name: "C", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_3: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_1}/verify"
              payload: {}
              as: DataAnalyst
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_2}/verify"
              payload: {}
              as: DataAnalyst
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_3}/exclude"
              payload: {}
              as: DataAnalyst
          trigger:
            - call: "GET /incidents/${inc_id}"
              as: IncidentCommander
          assert:
            - "Incident.${inc_id}.total_affected_subjects == 2   # EXCLUDED does not count"
            - "Incident.${inc_id}.total_pending_subjects == 2    # both VERIFIED"
            - "Incident.${inc_id}.total_notified_subjects == 0"
            - "Incident.${inc_id}.total_notified_subjects + Incident.${inc_id}.total_pending_subjects == Incident.${inc_id}.total_affected_subjects"

      - name: credit_monitoring_enrolled_plus_declined_plus_pending_equals_offered
        grounds:
          - entities.Incident.fields.credit_monitoring_offered
          - entities.Incident.fields.credit_monitoring_enrolled
          - entities.Incident.fields.credit_monitoring_declined
          - state_machines.CreditMonitoringOffer
        distinguishing_aspect: |
          Different conserved quantity: enrolled + declined + pending == offered.
          Forward action (offer ISSUED -> REDEEMED increments enrolled) and compensating
          action (offer ISSUED -> CANCELLED returns subject to NOT_OFFERED, decrementing offered)
          must keep the identity balanced.
        test_recipe:
          setup:
