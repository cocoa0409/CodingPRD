# =============================================================================
# PRD Benchmark Seed Tables — task_3030
# In-House Jewelry Credit & Lifetime Service Plan Administration (Signet Jewelers)
# =============================================================================

scenario: |
  In-House Jewelry Credit & Lifetime Service Plan Administration (Signet Jewelers): private-label credit application at the counter with instant decisioning and down-payment rules, promotional financing plans with deferred interest and payoff-by-date accounting, lifetime diamond and service plan registration requiring periodic inspection to remain valid, inspection reminder scheduling with store visit logging and plan lapse handling, repair intake with vendor shop routing, loss liability and turnaround commitments, appraisal issuance and insurance replacement coordination, trade-up program crediting the original purchase price toward a higher-value item, custom design orders with CAD approval and non-refundable deposits

domain_name: house-jewelry-credit-lifetime-service-plan-administration
api_prefix: /

# =============================================================================
# Table 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  difficulty_band: expert_push_beyond
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 14
  state_machine_count: 14
  calculation_count: 13
  validation_layers: 9
  endpoint_count: 56
  error_code_count: 34
  role_count: 6

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  # --- Store is declared first so the lint FK-reachability check can resolve
  #     the `POST /stores` creation chain for every other entity. ---
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Human store number, unique across the chain" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of the store" }
      - { name: credit_enabled, type: boolean, source: input, description: "Whether the counter credit program is offered at this store", default: true }
      - { name: store_status, type: enum, source: system, description: "Store operating status", default: OPEN, constraints: "OPEN | ACTIVE | SUSPENDED" }
      - { name: credit_capacity_cents, type: integer, source: input, description: "Ceiling on the balance-sheet cost the store may carry in open repairs and outstanding customer credit" }
      - { name: store_hold_days, type: integer, source: input, description: "Days a completed repair is held before it is abandoned", default: 30 }
      - { name: available_credit_capacity_cents, type: integer, source: computed, description: "credit_capacity_cents - store_absorbed_total - outstanding_customer_credit, floored at 0; the drain quantity", default: 0 }
      - { name: store_absorbed_total_cents, type: integer, source: computed, description: "Sum of store_absorbed_cents over this store's Repairs whose repair_status IN {INTAKE, ROUTED, IN_REPAIR, QC_REVIEW, COMPLETED}", default: 0 }
      - { name: open_repair_liability_cents, type: integer, source: computed, description: "Sum of loss_liability_cents over Repairs at this store whose repair_status IN {INTAKE, ROUTED, IN_REPAIR, QC_REVIEW}; recomputed at the end of every repair state transition", default: 0 }
      - { name: open_inspection_count, type: integer, source: computed, description: "Count of ServicePlanRegistrations at this store with coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED}; recomputed on every registration transition", default: 0 }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Unique contact email; duplicate email is rejected", constraints: "unique" }
      - { name: phone, type: string, source: input, description: "Contact phone number", default: null }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of residence; drives CreditLimitRegistryState lookup" }
      - { name: account_status, type: enum, source: system, description: "Credit account lifecycle", default: NO_FILE, constraints: "NO_FILE | OPEN | SUSPENDED | CLOSED" }
      - { name: credit_tier, type: enum, source: computed, description: "Credit tier derived from the latest decisioned CreditApplication", default: NO_FILE, constraints: "NO_FILE | TIER_1 | TIER_2 | TIER_3" }
      - { name: standalone_credit_limit_cents, type: number, source: computed, description: "Current standalone credit ceiling, recomputed on every ledger write", default: 0 }
      - { name: revolving_utilization_bps, type: integer, source: computed, description: "latest_balance / standalone_credit_limit expressed in basis points, 0 when the limit is 0", default: 0 }
      - { name: lifetime_purchase_cents, type: number, source: computed, description: "Sum of base_price_cents over the Customer's Purchases whose purchase_status IN {COMPLETED, TRADE_UP_APPLIED}", default: 0 }
      - { name: outstanding_balance_cents, type: number, source: computed, description: "Sum of adjustment_cents over the Customer's PayoffLedgerEntries plus sum of installment_amount_cents for the current open quarter of each PromotionalPlan not yet PAID", default: 0 }
      - { name: lost_inspection_streak, type: integer, source: computed, description: "Count of consecutive missed inspections across the Customer's ServicePlanRegistrations, recomputed whenever any registration enters LAPSED", default: 0 }

  - name: CreditLimitRegistryState
    parent: null
    common_fields: true
    fields:
      - { name: registry_key, type: string, source: input, description: "Registry lookup key", constraints: "unique; equals state_code for registry_type STATE, all_states_key for REGISTRY_TYPE_GLOBAL" }
      - { name: credit_tier, type: enum, source: input, description: "Tier this row prices", constraints: "TIER_1 | TIER_2 | TIER_3 (APPROVE_FULL rows use TIER_3; DECLINE rows carry the tier that would have applied)" }
      - { name: base_limit_cents, type: integer, source: input, description: "Standalone credit ceiling in cents for (registry_key, credit_tier)" }
      - { name: min_down_payment_pct, type: number, source: input, description: "Required down-payment percentage for this (registry_key, credit_tier)" }
      - { name: min_ticket_cents, type: integer, source: input, description: "Lowest requested_limit_cents for which this row may be selected by credit_limit_registry_pricing", default: 0 }
      - { name: all_states_key, type: string, source: input, description: "Sentinel registry_key used for global default rows", default: "*" }
      - { name: registry_type, type: enum, source: input, description: "Whether the row is state-scoped or the global default", constraints: "STATE | GLOBAL" }

  - name: CreditApplication
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the applicant" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store where the counter application is taken" }
      - { name: requested_limit_cents, type: integer, source: input, description: "Credit line requested at the counter" }
      - { name: declared_annual_income_cents, type: integer, source: input, description: "Income the applicant declared", default: null }
      - { name: requested_purchase_amount_cents, type: integer, source: input, description: "Amount of the pending sale the line would fund; drives the down-payment check" }
      - { name: down_payment_cents, type: integer, source: input, description: "Cash down payment tendered with the application", default: 0 }
      - { name: minimum_down_payment_cents, type: integer, source: system, description: "Floor supply guard: intake refuses any application whose down_payment_cents is below this value", default: 0 }
      - { name: policy_tier, type: enum, source: computed, description: "Tier priced from requested_limit_cents and declared_annual_income_cents", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: decision_status, type: enum, source: system, description: "Instant decision state", default: PENDING, constraints: "PENDING | APPROVED | COUNTERED | DECLINED | EXPIRED" }
      - { name: decision_tier, type: enum, source: computed, description: "Tier granted by the decisioner; equals policy_tier for APPROVE_FULL, TIER_1 for APPROVE_COUNTERED", default: null, constraints: "TIER_1 | TIER_2 | TIER_3 | null" }
      - { name: approved_limit_cents, type: integer, source: computed, description: "Granted credit ceiling in cents", default: 0 }
      - { name: min_down_payment_required_cents, type: integer, source: computed, description: "ceil(min_down_payment_pct x requested_purchase_amount_cents) at the decisioned tier", default: 0 }
      - { name: down_payment_shortfall_cents, type: integer, source: computed, description: "max(0, min_down_payment_required_cents - down_payment_cents)", default: 0 }
      - { name: expires_at, type: datetime, source: system, description: "Creation instant + DECISION_VALIDITY_HOURS; a PENDING application past this instant is EXPIRED" }
      - { name: decision_rule_id, type: string, source: computed, description: "Identifier of the CreditLimitRegistryState row used for the decision", default: null }

  - name: PromotionalPlan
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the cardholder" }
      - { name: purchase_id, type: string, source: input, description: "FK -> Purchase.id; the purchase being financed" }
      - { name: plan_code, type: enum, source: input, description: "Financing promo chosen at the counter", constraints: "PROMO_12_6M | PROMO_18_6M | PROMO_24_12M" }
      - { name: promotional_apr_pct, type: number, source: computed, description: "APR applied to accrued deferred interest", default: 0 }
      - { name: deferred_months, type: integer, source: computed, description: "Interest-free months granted by the promo code", default: 0 }
      - { name: simplicity_months, type: integer, source: computed, description: "Promo validity window in months after which deferred interest capitalizes", default: 0 }
      - { name: deferral_basis_points, type: integer, source: computed, description: "Merchant deferral fee rate in basis points; 1200 -> 12%", default: 0 }
      - { name: installment_amount_cents, type: integer, source: computed, description: "Even quarterly installment amount the customer is billed; does not reduce the plan principal", default: 0 }
      - { name: principal_cents, type: integer, source: computed, description: "Purchased amount financed, inclusive of any financed protection bundle", default: 0 }
      - { name: installment_quarter_cents, type: integer, source: computed, description: "the installment amount billed each of the four quarters; equal for every quarter", default: 0 }
      - { name: deferred_interest_accrued_cents, type: integer, source: computed, description: "Deferred-interest accrual from the ACCRUING variant of promo_interest_accrual", default: 0 }
      - { name: final_settlement_amount_cents, type: integer, source: computed, description: "principal + deferred_interest_accrued while ACCRUING; principal once CAPITALIZED", default: 0 }
      - { name: merchant_deferral_fee_cents, type: integer, source: computed, description: "Merchant fee = round(principal_cents x deferral_basis_points / 10000)", default: 0 }
      - { name: plan_status, type: enum, source: system, description: "Promotional plan lifecycle", default: ACCRUING, constraints: "ACCRUING | PAID | CAPITALIZED | DEFAULTED | VOIDED" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Cumulative payments applied to this plan (installments and any lumpsum payoff)", default: 0 }
      - { name: simplicity_expires_at, type: datetime, source: system, description: "created_at + simplicity_months; capitalized if the plan is not PAID at or before this instant" }
      - { name: paid_at, type: datetime, source: system, description: "Instant the plan reached PAID via the payoff-by-date evaluation", default: null }

  - name: PayoffLedgerEntry
    parent: PromotionalPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> PromotionalPlan.id" }
      - { name: entry_kind, type: enum, source: system, description: "How the entry arose", constraints: "INSTALLMENT | LUMPSUM_PAYOFF | CAPITALIZATION | TRADE_UP_CREDIT" }
      - { name: adjustment_cents, type: integer, source: computed, description: "Signed ledger delta; INSTALLMENT negative, CAPITALIZATION positive" }
      - { name: amount_cents, type: integer, source: computed, description: "Absolute magnitude of this entry's effect on the plan's outstanding balance; always non-negative" }
      - { name: reference_bucket, type: enum, source: input, description: "Bucket the payment was directed at; only DIRECTED_PAYOFF_REFERENCE rows bind the ledger to a promise", default: null, constraints: "PROMOTIONAL | CUSTOM_DESIGN | RETAIL | null" }
      - { name: direction, type: enum, source: computed, description: "Sign convention of the entry's effect on the conserved quantity", constraints: "INCREASE | DECREASE" }
      - { name: entry_sequence, type: integer, source: system, description: "Monotonic per-plan sequence number of this entry; used only as the ordering tie-break, never as a business decision input", default: 1 }
      - { name: projected_total_cents, type: number, source: computed, description: "payoff_ledger_projection evaluated on the plan's full entry history" }
      - { name: recorded_at, type: datetime, source: system, description: "Instant the entry was written" }

  - name: Diamond
    parent: null
    common_fields: true
    fields:
      - { name: stone_code, type: string, source: input, description: "Chain-internal unique stone identifier", constraints: "unique" }
      - { name: stone_kind, type: enum, source: input, description: "Whether the stone is a natural diamond or a lab-grown stone", constraints: "NATURAL | LAB_GROWN" }
      - { name: carat, type: number, source: input, description: "Stone weight in carats" }
      - { name: origin_registry, type: string, source: input, description: "Kimberley-process or lab registry the stone is filed with", default: null }
      - { name: owner_customer_id, type: string, source: computed, description: "FK -> Customer.id; current owner of record, set when the owning Purchase completes", default: null }
      - { name: custody_status, type: enum, source: system, description: "Current physical control of the stone", default: IN_CASE, constraints: "IN_CASE | IN_VAULT | AT_VENDOR | WITHDRAWN" }

  - name: ProtectionBundle
    parent: null
    common_fields: true
    fields:
      - { name: bundle_code, type: string, source: input, description: "Unique bundle identifier", constraints: "unique" }
      - { name: display_name, type: string, source: input, description: "Bundled protection offering presented at the counter" }
      - { name: bundle_status, type: enum, source: system, description: "Whether the bundle may still be attached to new customer plans", default: CURRENT, constraints: "CURRENT | RETIRED" }
      - { name: lifetime_plan_fee_cents, type: integer, source: input, description: "Financed amount of the lifetime service plan component" }
      - { name: stone_limit_labor_cents, type: integer, source: input, description: "Ceiling on repair labor the lifetime diamond component will fund per loss" }
      - { name: stone_limit_parts_cents, type: integer, source: input, description: "Ceiling on repair parts the lifetime diamond component will fund per loss" }
      - { name: inspection_interval_days, type: integer, source: input, description: "Days between required inspections established by this bundle", default: 180 }
      - { name: inspection_cure_days, type: integer, source: input, description: "Grace window after each required inspection instant before the plan lapses", default: 30 }

  - name: VendorShop
    parent: null
    common_fields: true
    fields:
      - { name: shop_code, type: string, source: input, description: "Unique vendor shop identifier; equals the value stored in Repair.vendor_shop_code", constraints: "unique" }
      - { name: shop_name, type: string, source: input, description: "Vendor shop display name" }
      - { name: vendor_status, type: enum, source: system, description: "Whether the shop may receive new routings", default: ACTIVE, constraints: "ACTIVE | RETIRED" }
      - { name: base_turnaround_days, type: integer, source: input, description: "Calendar days the shop promises for a standard routing; seeded from the alliance agreement" }
      - { name: rush_surcharge_cents, type: integer, source: input, description: "Surcharge the shop charges for a rush routing", default: 0 }
      - { name: open_repair_count, type: integer, source: computed, description: "Count of Repairs at this shop with repair_status IN {ROUTED, IN_REPAIR, QC_REVIEW}", default: 0 }

  - name: ServicePlanRegulation
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State the rule applies to", constraints: "unique" }
      - { name: max_plan_term_months, type: integer, source: input, description: "Longest contractual term the state permits for a registered lifetime plan" }
      - { name: inspection_required_months, type: integer, source: input, description: "State-mandated interval between required inspections, in months; 0 = no state mandate" }
      - { name: max_inspection_gap_days, type: integer, source: input, description: "Hardest gap the state allows between consecutive logged inspections", default: 0 }
      - { name: lapse_cure_days, type: integer, source: input, description: "Cure window the state grants before a missed inspection lapses the plan" }
      - { name: replacement_plus_pct, type: number, source: input, description: "Share of the chain's replacement invoice a store may absorb before the 25% cap applies (0.75 or 1.0)" }

  - name: ServicePlanRegistration
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; plan holder" }
      - { name: purchase_id, type: string, source: input, description: "FK -> Purchase.id; the covered purchase" }
      - { name: diamond_id, type: string, source: input, description: "FK -> Diamond.id; the registered stone" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store of record for inspections and visits" }
      - { name: bundle_id, type: string, source: input, description: "FK -> ProtectionBundle.id; terms governing this registration" }
      - { name: registered_at, type: datetime, source: system, description: "Instant the registration became ACTIVE, used as the base for inspection scheduling" }
      - { name: coverage_status, type: enum, source: system, description: "Registration lifecycle", default: PENDING_INSPECTION, constraints: "PENDING_INSPECTION | REMINDER_ISSUED | ACTIVE | GRACE_PERIOD | LAPSED | RENEWED | TERMINATED | VOID" }
      - { name: inspection_due_at, type: datetime, source: computed, description: "Next required inspection instant; registered_at + inspection_interval_days on first schedule, then last logged visit + interval" }
      - { name: cure_expires_at, type: datetime, source: computed, description: "inspection_due_at + lapse cure days (state rule value when one is registered, else bundle value)" }
      - { name: last_inspection_at, type: datetime, source: computed, description: "Visit instant of the most recent InspectionVisit in result CLAIMED; null until first claim", default: null }
      - { name: next_inspection_at, type: datetime, source: computed, description: "last_inspection_at + inspection_interval_days; the inspected reminder window opens 14 days before this instant", default: null }
      - { name: missed_inspection_count, type: integer, source: computed, description: "Number of times this registration slipped past cure_expires_at without a claimed inspection", default: 0 }
      - { name: plan_term_months, type: integer, source: computed, description: "Contracted term; must not exceed the state's max_plan_term_months" }
      - { name: renewal_count, type: integer, source: computed, description: "Number of times the registration has been renewed from LAPSED", default: 0 }
      - { name: replacement_claims_used, type: integer, source: computed, description: "Number of insurance-replacement advices issued against this registration", default: 0 }
      - { name: is_valid, type: boolean, source: computed, description: "True only when coverage_status == ACTIVE; gates liability split on every new Repair" }

  - name: InspectionVisit
    parent: ServicePlanRegistration
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> ServicePlanRegistration.id; the plan being inspected" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store where the visit was logged" }
      - { name: visit_at, type: datetime, source: input, description: "Instant the visit was logged at the counter; dt = visit_at - registration.registered_at in whole days" }
      - { name: result, type: enum, source: input, description: "Inspection outcome", constraints: "SCHEDULED | CLAIMED | NO_SHOW" }
      - { name: scheduled_for_at, type: datetime, source: input, description: "Instant the reminder promised the customer would attend", default: null }
      - { name: inspection_status, type: enum, source: system, description: "Visit record status", default: SCHEDULED, constraints: "SCHEDULED | CLAIMED | NO_SHOW" }
      - { name: claimed_at, type: datetime, source: system, description: "Instant the visit was claimed at the counter", default: null }

  - name: Repair
    parent: Store
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer who brought the item in" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; intake store and store of record" }
      - { name: diamond_id, type: string, source: input, description: "FK -> Diamond.id; the stone under repair" }
      - { name: registration_id, type: string, source: input, description: "FK -> ServicePlanRegistration.id; governing lifetime plan at intake (the version pinned at INTAKE)" }
      - { name: vendor_shop_code, type: string, source: computed, description: "Routing = vendor_is_rush ? CONRUSH : ROUTE_TABLE[failure_class] over {STONE_LOSS: MALCA, SETTING: JEWELCRAFT, PRONG: JEWELCRAFT, RESIZE: MASTERMELT, OTHER: MASTERMELT}; null until routed", default: null }
      - { name: failure_class, type: enum, source: input, description: "Why the stone failed", constraints: "STONE_LOSS | SETTING | PRONG | RESIZE | OTHER" }
      - { name: vendor_is_rush, type: boolean, source: input, description: "Whether the customer paid for rush routing", default: false }
      - { name: declared_parts_cents, type: integer, source: input, description: "Shop parts cost for the repair" }
      - { name: declared_labor_cents, type: integer, source: input, description: "Shop labor cost for the repair" }
      - { name: accepted_at, type: datetime, source: system, description: "Intake instant; all turnaround deadlines are measured from this instant" }
      - { name: promised_delivery_at, type: datetime, source: system, description: "accepted_at + vendor_turnaround_days; the customer-facing commitment" }
      - { name: loss_liability_cents, type: integer, source: computed, description: "repair_loss_liability output, computed at INTAKE against the pinned coverage and never recomputed", default: 0 }
      - { name: insurance_parts_cents, type: integer, source: computed, description: "Parts portion the diamond component absorbed", default: 0 }
      - { name: customer_parts_cents, type: integer, source: computed, description: "Parts portion billed to the customer", default: 0 }
      - { name: customer_labor_cents, type: integer, source: computed, description: "Labor portion billed to the customer", default: 0 }
      - { name: reserve_cents, type: number, source: computed, description: "Warranty reserve funding the store must put up", default: 0 }
      - { name: store_absorbed_cents, type: integer, source: computed, description: "Balance-sheet cost the store carries; decrements the store's credit capacity", default: 0 }
      - { name: repair_status, type: enum, source: system, description: "Repair lifecycle", default: INTAKE, constraints: "INTAKE | ROUTED | IN_REPAIR | QC_REVIEW | COMPLETED | UNREPAIRABLE | VERIFIED_LOSS | ABANDONED" }
      - { name: pickup_deadline_at, type: datetime, source: system, description: "delivered_at + store_hold_days; after this instant the repair is ABANDONED and the store takes constructive custody", default: null }
      - { name: stored_appraisal_id, type: string, source: computed, description: "FK -> Appraisal.id issued for this repair; null while no appraisal has been issued", default: null }

  - name: RepairHold
    parent: Repair
    common_fields: false
    fields:
      - { name: repair_id, type: string, source: input, description: "FK -> Repair.id; the hold this deadline mutation applies to" }
      - { name: extended_promised_delivery_at, type: datetime, source: input, description: "Replacement promised_delivery_at requested by the extension" }
      - { name: extension_days, type: integer, source: computed, description: "extended_promised_delivery_at - promised_delivery_at in whole days" }
      - { name: deadline_adjusted, type: boolean, source: computed, description: "Whether the extension was honoured; false when the request breached the 1.5x-turnaround ceiling" }
      - { name: imposed_breach_adjustment_cents, type: number, source: computed, description: "Store credit the customer is owed when the original turnaround commitment was allowed to stand and then missed" }
      - { name: recorded_at, type: datetime, source: system, description: "Instant the hold request was evaluated" }

  - name: Appraisal
    parent: Repair
    common_fields: true
    fields:
      - { name: repair_id, type: string, source: input, description: "FK -> Repair.id; appraisals are issued out of the repair file" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; party the appraisal names" }
      - { name: appraised_value_cents, type: integer, source: computed, description: "replacement_appraised_value output", default: 0 }
      - { name: traceability_document_url, type: string, source: computed, description: "Set to the stone's origin_registry document when origin_registry is non-null, else null", default: null }
      - { name: appraisal_kind, type: enum, source: input, description: "Why the appraisal was issued", constraints: "INSURANCE | REPLACEMENT" }
      - { name: insurance_schedule_ref, type: string, source: input, description: "Insurer schedule reference supplied at issuance", default: null }
      - { name: appraisal_status, type: enum, source: system, description: "Appraisal lifecycle", default: ISSUED, constraints: "ISSUED | CIRCULATED | SUPERSEDED" }
      - { name: circulated_at, type: datetime, source: system, description: "Instant the appraisal was issued" }

  - name: Purchase
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; buyer" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; selling store" }
      - { name: diamond_id, type: string, source: input, description: "FK -> Diamond.id; the center stone when the purchase carries one", default: null }
      - { name: bundle_id, type: string, source: input, description: "FK -> ProtectionBundle.id; protection bundle sold with the purchase", default: null }
      - { name: base_price_cents, type: integer, source: input, description: "Full ticketed price of the new item before any trade-up credit" }
      - { name: origin_purchase_id, type: string, source: input, description: "FK -> Purchase.id; the earlier purchase this trade-up is applied against", default: null }
      - { name: trade_up_credit_cents, type: number, source: computed, description: "trade_up_credit_basis variant-selected output", default: 0 }
      - { name: trade_up_floor_cents, type: number, source: computed, description: "Declared trade-up floor: 2 x origin.base_price_cents", default: 0 }
      - { name: net_amount_cents, type: number, source: computed, description: "balance_due_after_trade_up output; the amount actually due at the counter", default: 0 }
      - { name: protection_fee_cents, type: number, source: computed, description: "Lifetime plan fee if a bundle was attached, else 0", default: 0 }
      - { name: purchase_status, type: enum, source: system, description: "Purchase lifecycle", default: PENDING, constraints: "PENDING | FINANCED | COMPLETED | TRADE_UP_APPLIED" }
      - { name: completed_at, type: datetime, source: system, description: "Instant the purchase reached COMPLETED", default: null }

  - name: CustomDesignOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; commissioning customer" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store of record" }
      - { name: estimate_amount_cents, type: integer, source: input, description: "Quoted build estimate; drives the CAD revision fee and the change-order variance" }
      - { name: deposit_cents, type: integer, source: system, description: "round(estimate_amount_cents x deposit_pct) stamped at submission; never recomputed", constraints: "0.30 <= deposit_pct <= 0.50" }
      - { name: deposit_pct, type: number, source: input, description: "Share of the estimate taken as the non-refundable deposit", default: 0.30 }
      - { name: revision_count, type: integer, source: computed, description: "Number of CAD revision requests accepted so far", default: 0 }
      - { name: free_revisions_used, type: integer, source: computed, description: "Number of the first two revisions consumed by the customer", default: 0 }
      - { name: revision_fee_cents, type: number, source: computed, description: "Accumulated CAD revision fee charges", default: 0 }
      - { name: design_status, type: enum, source: system, description: "Commission timeline state", default: DEPOSIT_PAID, constraints: "DEPOSIT_PAID | CAD_REVISION | CAD_APPROVED | IN_PRODUCTION | COMPLETED | CANCELLED" }
      - { name: approved_at, type: datetime, source: system, description: "Instant of CAD approval; pins the CUSTOM_DESIGN bucket ordering key", default: null }
      - { name: cancellation_fee_cents, type: number, source: computed, description: "Cancellation fee: 0 before :IN_PRODUCTION, otherwise non_refundable_deposit_forfeit result", default: 0 }
      - { name: non_refundable_deposit_cents, type: number, source: computed, description: "Portion of deposit_cents that is non-refundable; equals deposit_cents while design_status NOT IN {COMPLETED}", default: 0 }
      - { name: refundable_deposit_cents, type: number, source: computed, description: "deposit_cents - non_refundable_deposit_cents", default: 0 }

  - name: BillingStatement
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; cardholder being billed" }
      - { name: statement_period, type: string, source: input, description: "Statement period label, e.g. 2026-09; unique per customer", constraints: "unique per (customer_id, statement_period)" }
      - { name: bucket_totals_cents, type: object, source: computed, description: "Ordered allocation of payments across {PROMOTIONAL, CUSTOM_DESIGN, RETAIL}, computed by payment_allocation_waterfall", default: {} }
      - { name: min_payment_due_cents, type: integer, source: computed, description: "max(5000, sum over allocated buckets of round(allocated x min_base_pct))", default: 0 }
      - { name: statement_balance_cents, type: integer, source: computed, description: "rounded_statement_balance output from the dual-variant statement_balance rollup", default: 0 }
      - { name: statement_status, type: enum, source: system, description: "Statement lifecycle", default: OPEN, constraints: "OPEN | CLOSED" }
# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: CreditApplication
    initial_state: PENDING
    terminal_states: [DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /credit-applications/{id}/decision (decision=APPROVE_FULL)"
        actor: CreditAnalyst
        preconditions:
          - "credit_application.decision_status == PENDING"
          - "now <= credit_application.expires_at"
          - "a CreditLimitRegistryState row exists with registry_key == customer.state_code and credit_tier == credit_application.policy_tier and min_ticket_cents <= credit_application.requested_limit_cents; rows with registry_key == registry_state.all_states_key are the fallback candidate set when no STATE row matches"
          - "the store's store_status == ACTIVE"
        side_effects:
          - "credit_application.decision_tier = credit_application.policy_tier"
          - "credit_application.approved_limit_cents = selected_row.base_limit_cents"
          - "credit_application.min_down_payment_required_cents = ceil(selected_row.min_down_payment_pct x credit_application.requested_purchase_amount_cents)"
          - "credit_application.down_payment_shortfall_cents = max(0, min_down_payment_required_cents - down_payment_cents)"
          - "credit_application.decision_rule_id = selected_row.id"
          - "customer.credit_tier = credit_application.decision_tier"
          - "customer.account_status = OPEN when it was NO_FILE"
          - "customer.standalone_credit_limit_cents = credit_application.approved_limit_cents"
          - "recompute customer.revolving_utilization_bps (credit_utilization_band)"
          - "credit_application.version += 1; credit_application.updated_at refreshed"
      - from: PENDING
        to: COUNTERED
        trigger: "POST /credit-applications/{id}/decision (decision=APPROVE_COUNTERED)"
        actor: CreditAnalyst
        preconditions:
          - "credit_application.decision_status == PENDING"
          - "now <= credit_application.expires_at"
          - "a CreditLimitRegistryState row exists with registry_key == customer.state_code and credit_tier == TIER_1 and min_ticket_cents <= credit_application.requested_limit_cents"
        side_effects:
          - "credit_application.decision_tier = TIER_1"
          - "credit_application.approved_limit_cents = TIER_1 row.base_limit_cents"
          - "credit_application.min_down_payment_required_cents = ceil(TIER_1 row.min_down_payment_pct x requested_purchase_amount_cents)"
          - "credit_application.down_payment_shortfall_cents recomputed at the TIER_1 percentage"
          - "customer fields are NOT mutated until the customer accepts — the counteroffer binds only the application row"
          - "credit_application.version += 1"
      - from: COUNTERED
        to: APPROVED
        trigger: "POST /credit-applications/{id}/accept"
        actor: Customer
        preconditions:
          - "credit_application.decision_status == COUNTERED"
          - "now <= credit_application.expires_at"
          - "the acting customer owns credit_application.customer_id"
        side_effects:
          - "credit_application.decision_status = APPROVED"
          - "customer.credit_tier = TIER_1"
          - "customer.account_status = OPEN when it was NO_FILE"
          - "customer.standalone_credit_limit_cents = credit_application.approved_limit_cents"
          - "recompute customer.revolving_utilization_bps"
          - "credit_application.version += 1"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /credit-applications/{id}/decline-counter"
        actor: Customer
        preconditions:
          - "credit_application.decision_status == COUNTERED"
          - "the acting customer owns credit_application.customer_id"
        side_effects:
          - "credit_application.decision_status = DECLINED; application is terminal"
          - "no customer field changes; customer.account_status stays NO_FILE"
      - from: PENDING
        to: DECLINED
        trigger: "POST /credit-applications/{id}/decision (decision=DECLINE)"
        actor: CreditAnalyst
        preconditions:
          - "credit_application.decision_status == PENDING"
        side_effects:
          - "credit_application.decision_status = DECLINED; application is terminal"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /credit-applications/expire-due (batch sweep)"
        actor: CreditAnalyst
        preconditions:
          - "credit_application.decision_status == PENDING"
          - "now > credit_application.expires_at"
        side_effects:
          - "credit_application.decision_status = EXPIRED; application is terminal"
      - from: COUNTERED
        to: EXPIRED
        trigger: "POST /credit-applications/expire-due (batch sweep)"
        actor: CreditAnalyst
        preconditions:
          - "credit_application.decision_status == COUNTERED"
          - "now > credit_application.expires_at"
        side_effects:
          - "credit_application.decision_status = EXPIRED; application is terminal"

  # ---------------------------------------------------------------------------
  - entity: PromotionalPlan
    initial_state: ACCRUING
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ACCRUING
        to: PAID
        trigger: "POST /promotional-plans/{id}/payoff"
        actor: CustomerService
        preconditions:
          - "promotional_plan.plan_status == ACCRUING"
          - "now <= promotional_plan.simplicity_expires_at"
          - "amount_cents >= promotional_plan.principal_cents + promotional_plan.deferred_interest_accrued_cents"
          - "payload expected_plan_version == promotional_plan.version"
        side_effects:
          - "append PayoffLedgerEntry(entry_kind=LUMPSUM_PAYOFF, direction=DECREASE, amount_cents, adjustment_cents = -amount_cents, reference_bucket=PROMOTIONAL)"
          - "promotional_plan.total_paid_cents += amount_cents"
          - "promotional_plan.plan_status = PAID; paid_at = now"
          - "promotional_plan.deferred_interest_accrued_cents = 0; final_settlement_amount_cents = 0"
          - "promotional_plan.merchant_deferral_fee_cents = 0 (deferral fee is refunded on payoff-by-date)"
          - "promotional_plan.version += 1; the ledger entry's entry_sequence = prior max entry_sequence + 1"
          - "recompute customer.outstanding_balance_cents; recompute credit_utilization_band(customer)"
          - "recompute credit_tier_from_plan_mix_and_inspection_streak(customer)"
      - from: ACCRUING
        to: CAPITALIZED
        trigger: "POST /plans/capitalize-due (batch sweep)"
        actor: CreditAnalyst
        preconditions:
          - "promotional_plan.plan_status == ACCRUING"
          - "now > promotional_plan.simplicity_expires_at"
        side_effects:
          - "append PayoffLedgerEntry(entry_kind=CAPITALIZATION, direction=INCREASE, amount_cents = deferred_interest_accrued_cents, adjustment_cents = +amount_cents)"
          - "promotional_plan.principal_cents += deferred_interest_accrued_cents"
          - "promotional_plan.deferred_interest_accrued_cents = 0"
          - "promotional_plan.final_settlement_amount_cents = principal_cents"
          - "promotional_plan.plan_status = CAPITALIZED"
          - "promotional_plan.merchant_deferral_fee_cents = 0 (capitalization cancels the merchant deferral credit)"
          - "promotional_plan.version += 1"
          - "recompute customer.outstanding_balance_cents; recompute credit_utilization_band(customer)"
      - from: CAPITALIZED
        to: PAID
        trigger: "POST /promotional-plans/{id}/payoff"
        actor: CustomerService
        preconditions:
          - "promotional_plan.plan_status == CAPITALIZED"
          - "amount_cents >= promotional_plan.principal_cents"
          - "payload expected_plan_version == promotional_plan.version"
        side_effects:
          - "append PayoffLedgerEntry(entry_kind=LUMPSUM_PAYOFF, direction=DECREASE, amount_cents = principal_cents, adjustment_cents = -principal_cents)"
          - "promotional_plan.total_paid_cents += amount_cents; plan_status = PAID; paid_at = now"
          - "promotional_plan.final_settlement_amount_cents = 0"
          - "promotional_plan.version += 1"
          - "recompute customer.outstanding_balance_cents; recompute credit_tier_from_plan_mix_and_inspection_streak(customer)"
      - from: ACCRUING
        to: DEFAULTED
        trigger: "POST /plans/default-due (batch sweep)"
        actor: CreditAnalyst
        preconditions:
          - "promotional_plan.plan_status IN {ACCRUING, CAPITALIZED}"
          - "now > promotional_plan.simplicity_expires_at + 90 days"
          - "promotional_plan.total_paid_cents < promotional_plan.principal_cents"
        side_effects:
          - "hop 1: promotional_plan.plan_status = DEFAULTED"
          - "hop 2: customer.account_status = SUSPENDED; customer.credit_tier = NO_FILE; customer.standalone_credit_limit_cents = 0; customer.revolving_utilization_bps = 10000"
          - "hop 3: every CreditApplication of this customer with decision_status == PENDING (or COUNTERED) is set to DECLINED"
          - "hop 4: every ServicePlanRegistration of this customer with coverage_status == PENDING_INSPECTION is set to LAPSED with missed_inspection_count += 1"
          - "hop 5: recompute customer.lost_inspection_streak (counts registrations that have entered LAPSED)"
          - "hop 6: re-run credit_tier_from_plan_mix_and_inspection_streak — the streak downgrade is applied AFTER the streak increments, so evaluation order is pinned: status mutations, then streak, then tier"
      - from: CAPITALIZED
        to: DEFAULTED
        trigger: "POST /plans/default-due (batch sweep)"
        actor: CreditAnalyst
        preconditions:
          - "promotional_plan.plan_status == CAPITALIZED"
          - "now > promotional_plan.simplicity_expires_at + 90 days"
          - "promotional_plan.total_paid_cents < promotional_plan.principal_cents"
        side_effects:
          - "same six-hop chain as the ACCRUING -> DEFAULTED transition"
      - from: DEFAULTED
        to: ACCRUING
        trigger: "POST /promotional-plans/{id}/reinstate"
        actor: CreditAnalyst
        preconditions:
          - "promotional_plan.plan_status == DEFAULTED"
          - "payload expected_plan_version == promotional_plan.version"
          - "customer.account_status == SUSPENDED"
        side_effects:
          - "promotional_plan.plan_status = ACCRUING (revert; the cycle DEFAULTED -> ACCRUING -> DEFAULTED is permitted)"
          - "promotional_plan.simplicity_expires_at = now + simplicity_months (the deferral clock restarts)"
          - "customer.account_status = OPEN; customer.credit_tier recomputed"
          - "customer.standalone_credit_limit_cents = the base_limit_cents of the CreditLimitRegistryState row whose decision_rule_id matches the customer's most recent APPROVED CreditApplication"
          - "promotional_plan.version += 1"
      - from: ACCRUING
        to: VOIDED
        trigger: "POST /promotional-plans/{id}/cancel"
        actor: CustomerService
        preconditions:
          - "promotional_plan.plan_status == ACCRUING"
          - "promotional_plan.total_paid_cents == 0"
          - "no PayoffLedgerEntry exists for this plan"
        side_effects:
          - "promotional_plan.plan_status = VOIDED (terminal)"
          - "promotional_plan.merchant_deferral_fee_cents = 0"
          - "promotional_plan.deferred_interest_accrued_cents = 0"
          - "purchase.purchase_status reverts from FINANCED to PENDING"
          - "recompute customer.outstanding_balance_cents; recompute credit_tier_from_plan_mix_and_inspection_streak(customer)"

  # ---------------------------------------------------------------------------
  - entity: ServicePlanRegistration
    initial_state: PENDING_INSPECTION
    terminal_states: [TERMINATED, VOID]
    transitions:
      - from: PENDING_INSPECTION
        to: REMINDER_ISSUED
        trigger: "POST /inspection-reminders/run (batch sweep)"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status == PENDING_INSPECTION"
          - "service_plan_registration.inspection_due_at - 14 days <= now"
          - "bundle.bundle_status == CURRENT"
        side_effects:
          - "service_plan_registration.coverage_status = REMINDER_ISSUED"
          - "synthesize InspectionVisit(registration_id, store_id, result=SCHEDULED, inspection_status=SCHEDULED, scheduled_for_at = inspection_due_at)"
          - "service_plan_registration.version += 1"
      - from: ACTIVE
        to: REMINDER_ISSUED
        trigger: "POST /inspection-reminders/run (batch sweep)"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status == ACTIVE"
          - "service_plan_registration.next_inspection_at - 14 days <= now"
        side_effects:
          - "service_plan_registration.coverage_status = REMINDER_ISSUED"
          - "synthesize InspectionVisit(result=SCHEDULED, scheduled_for_at = next_inspection_at)"
          - "store.open_inspection_count += 1"
      - from: GRACE_PERIOD
        to: REMINDER_ISSUED
        trigger: "POST /inspection-reminders/run (batch sweep)"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status == GRACE_PERIOD"
          - "service_plan_registration.next_inspection_at - 14 days <= now"
        side_effects:
          - "service_plan_registration.coverage_status = REMINDER_ISSUED (the cycle ACTIVE -> REMINDER_ISSUED -> ACTIVE / GRACE_PERIOD is permitted)"
          - "synthesize InspectionVisit(result=SCHEDULED, scheduled_for_at = next_inspection_at)"
      - from: REMINDER_ISSUED
        to: ACTIVE
        trigger: "POST /service-plan-registrations/{id}/exams"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED, GRACE_PERIOD}"
          - "visit_at <= service_plan_registration.inspection_due_at"
        side_effects:
          - "service_plan_registration.last_inspection_at = visit_at"
          - "service_plan_registration.next_inspection_at = visit_at + bundle.inspection_interval_days"
          - "service_plan_registration.inspection_due_at = next_inspection_at"
          - "service_plan_registration.cure_expires_at = next_inspection_at + lapse cure days (state row value when present, else bundle value)"
          - "service_plan_registration.coverage_status = ACTIVE; is_valid = true"
          - "the claimed InspectionVisit.inspection_status = CLAIMED; claimed_at = now; result = CLAIMED"
          - "every other InspectionVisit of this registration with inspection_status == SCHEDULED becomes NO_SHOW"
          - "store.open_inspection_count -= 1"
          - "customer.lost_inspection_streak = 0 (a claimed inspection resets the consecutive-miss counter)"
          - "service_plan_registration.version += 1"
      - from: REMINDER_ISSUED
        to: GRACE_PERIOD
        trigger: "POST /service-plan-registrations/{id}/exams"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status == REMINDER_ISSUED"
          - "service_plan_registration.inspection_due_at < visit_at"
          - "visit_at <= service_plan_registration.cure_expires_at"
        side_effects:
          - "service_plan_registration.last_inspection_at = visit_at"
          - "service_plan_registration.next_inspection_at = visit_at + bundle.inspection_interval_days"
          - "service_plan_registration.inspection_due_at = next_inspection_at"
          - "service_plan_registration.cure_expires_at = next_inspection_at + cure days"
          - "service_plan_registration.coverage_status = GRACE_PERIOD; is_valid = true"
          - "the claimed InspectionVisit.inspection_status = CLAIMED"
          - "customer.lost_inspection_streak unchanged (a cured gap is not a miss)"
      - from: REMINDER_ISSUED
        to: LAPSED
        trigger: "POST /service-plan-registrations/lapse-due (batch sweep)"
        actor: CreditAnalyst
        preconditions:
          - "service_plan_registration.coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED}"
          - "now > service_plan_registration.cure_expires_at"
        side_effects:
          - "service_plan_registration.coverage_status = LAPSED; is_valid = false"
          - "service_plan_registration.missed_inspection_count += 1"
          - "every InspectionVisit of this registration with inspection_status == SCHEDULED becomes NO_SHOW"
          - "store.open_inspection_count -= 1"
          - "customer.lost_inspection_streak += 1"
          - "re-run credit_tier_from_plan_mix_and_inspection_streak(customer) AFTER the streak increment"
          - "all Repairs of this registration still in repair_status IN {INTAKE, ROUTED, IN_REPAIR} keep their pinned loss_liability_cents (a lapse never recomputes an already-declared liability)"
      - from: LAPSED
        to: RENEWED
        trigger: "POST /service-plan-registrations/{id}/renew"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status == LAPSED"
          - "customer.account_status IN {OPEN, NO_FILE}"
          - "service_plan_registration.renewal_count < 2 when customer.credit_tier == TIER_1"
        side_effects:
          - "service_plan_registration.renewal_count += 1"
          - "service_plan_registration.coverage_status = RENEWED"
          - "service_plan_registration.registered_at = now (the inspection clock restarts at renewal)"
          - "service_plan_registration.inspection_due_at = now + bundle.inspection_interval_days"
          - "service_plan_registration.cure_expires_at = inspection_due_at + cure days"
          - "customer.lost_inspection_streak = 0"
          - "service_plan_registration.version += 1"
      - from: RENEWED
        to: PENDING_INSPECTION
        trigger: "POST /inspection-reminders/run (batch sweep)"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status == RENEWED"
        side_effects:
          - "service_plan_registration.coverage_status = PENDING_INSPECTION; is_valid = false"
          - "synthesize the next InspectionVisit(result=SCHEDULED, scheduled_for_at = inspection_due_at)"
      - from: PENDING_INSPECTION
        to: TERMINATED
        trigger: "POST /service-plan-registrations/{id}/terminate"
        actor: StoreManager
        preconditions:
          - "service_plan_registration.coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED, ACTIVE, GRACE_PERIOD}"
          - "no Repair referencing this registration has repair_status IN {INTAKE, ROUTED, IN_REPAIR, QC_REVIEW}"
        side_effects:
          - "service_plan_registration.coverage_status = TERMINATED; is_valid = false"
          - "every InspectionVisit of this registration with inspection_status == SCHEDULED becomes NO_SHOW"
          - "store.open_inspection_count -= 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /purchases/{id}/complete (trade-up of the covered purchase)"
        actor: SalesAssociate
        preconditions:
          - "the purchased item carries origin_purchase_id equal to this registration's purchase_id"
        side_effects:
          - "service_plan_registration.coverage_status = TERMINATED"
          - "exactly one new ServicePlanRegistration is created for the new Purchase at state PENDING_INSPECTION"
          - "store.open_inspection_count recomputed (the swap conserves the open inspection population)"
      - from: PENDING_INSPECTION
        to: VOID
        trigger: "POST /service-plan-registrations/{id}/void"
        actor: ChainAdmin
        preconditions:
          - "no ServicePlanRegulation row exists with state_code == store.state_code"
        side_effects:
          - "service_plan_registration.coverage_status = VOID (terminal); is_valid = false"
          - "store.open_inspection_count -= 1"

  # ---------------------------------------------------------------------------
  - entity: InspectionVisit
    initial_state: SCHEDULED
    terminal_states: [CLAIMED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CLAIMED
        trigger: "POST /inspection-visits/{id}/claim"
        actor: StoreManager
        preconditions:
          - "inspection_visit.inspection_status == SCHEDULED"
          - "the registration is in coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED, GRACE_PERIOD}"
        side_effects:
          - "inspection_visit.inspection_status = CLAIMED; claimed_at = now"
          - "registration.coverage_status moves to ACTIVE when visit_at <= inspection_due_at, else GRACE_PERIOD (delegates to the two exams transitions above)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /inspection-visits/{id}/no-show"
        actor: StoreManager
        preconditions:
          - "inspection_visit.inspection_status == SCHEDULED"
          - "now > inspection_visit.scheduled_for_at"
        side_effects:
          - "inspection_visit.inspection_status = NO_SHOW (terminal)"
          - "registration.coverage_status unchanged — the lapse decision belongs to POST /service-plan-registrations/lapse-due"

  # ---------------------------------------------------------------------------
  - entity: Repair
    initial_state: INTAKE
    terminal_states: [COMPLETED, UNREPAIRABLE, VERIFIED_LOSS, ABANDONED]
    transitions:
      - from: INTAKE
        to: ROUTED
        trigger: "POST /repairs/{id}/route"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == INTAKE"
          - "the VendorShop named by vendor_routing_rule exists with vendor_status == ACTIVE"
        side_effects:
          - "repair.vendor_shop_code = vendor_routing_rule(repair)"
          - "repair.promised_delivery_at = repair.accepted_at + vendor_turnaround_days(vendor_shop_code)"
          - "repair.repair_status = ROUTED"
          - "diamond.custody_status = AT_VENDOR"
          - "store.open_repair_liability_cents recomputed"
          - "repair.version += 1"
      - from: ROUTED
        to: IN_REPAIR
        trigger: "POST /repairs/{id}/arrive-vendor"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == ROUTED"
          - "diamond.custody_status == AT_VENDOR"
        side_effects:
          - "repair.repair_status = IN_REPAIR; repair.version += 1"
      - from: IN_REPAIR
        to: QC_REVIEW
        trigger: "POST /repairs/{id}/submit-qc"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == IN_REPAIR"
          - "diamond.custody_status == AT_VENDOR"
        side_effects:
          - "repair.repair_status = QC_REVIEW"
          - "diamond.custody_status = IN_VAULT"
          - "repair.version += 1"
      - from: QC_REVIEW
        to: COMPLETED
        trigger: "POST /repairs/{id}/verify"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == QC_REVIEW"
          - "store.available_credit_capacity_cents >= repair.loss_liability_cents (store credit capacity is checked before the liability is booked)"
        side_effects:
          - "hop 1: repair.repair_status = COMPLETED; repair.pickup_deadline_at = now + store_hold_days; diamond.custody_status = IN_CASE"
          - "hop 2: issue Appraisal(repair_id, customer_id, appraisal_kind=REPLACEMENT, appraised_value_cents = replacement_appraised_value(repair), traceability_document_url from diamond.origin_registry)"
          - "hop 3: create Purchase(customer_id, store_id, base_price_cents = appraisal.appraised_value_cents, purchase_status = PENDING, trade_up_credit_cents = min(repair.loss_liability_cents, appraised_value_cents))"
          - "hop 4: the ServicePlanRegistration covering the damaged diamond becomes TERMINATED"
          - "hop 5: store.open_inspection_count -= 1; store.open_repair_liability_cents recomputed"
          - "repair.stored_appraisal_id = issued appraisal id"
          - "repair.version += 1"
      - from: QC_REVIEW
        to: UNREPAIRABLE
        trigger: "POST /repairs/{id}/declare-unrepairable"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == QC_REVIEW"
          - "repair.failure_class == STONE_LOSS"
        side_effects:
          - "repair.repair_status = UNREPAIRABLE; diamond.custody_status = WITHDRAWN"
          - "issue Appraisal(repair_id, customer_id, appraisal_kind=REPLACEMENT)"
          - "store.open_repair_liability_cents recomputed"
          - "repair.version += 1"
      - from: QC_REVIEW
        to: VERIFIED_LOSS
        trigger: "POST /repairs/{id}/declare-loss"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == QC_REVIEW"
          - "diamond.custody_status IN {AT_VENDOR, IN_VAULT}"
          - "repair.loss_liability_cents was declared at INTAKE and is NOT recomputed here"
        side_effects:
          - "repair.repair_status = VERIFIED_LOSS; diamond.custody_status = WITHDRAWN"
          - "issue Appraisal(repair_id, customer_id, appraisal_kind=REPLACEMENT)"
          - "store.open_repair_liability_cents recomputed"
      - from: ROUTED
        to: UNREPAIRABLE
        trigger: "POST /repairs/{id}/declare-unrepairable"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == ROUTED"
          - "repair.failure_class == STONE_LOSS"
        side_effects:
          - "repair.repair_status = UNREPAIRABLE; diamond.custody_status = WITHDRAWN"
      - from: IN_REPAIR
        to: UNREPAIRABLE
        trigger: "POST /repairs/{id}/declare-unrepairable"
        actor: StoreManager
        preconditions:
          - "repair.repair_status == IN_REPAIR"
          - "repair.failure_class == STONE_LOSS"
        side_effects:
          - "repair.repair_status = UNREPAIRABLE; diamond.custody_status = WITHDRAWN"
      - from: COMPLETED
        to: ABANDONED
        trigger: "POST /repairs/abandon-overdue (batch sweep)"
        actor: CustomerService
        preconditions:
          - "repair.repair_status == COMPLETED"
          - "now > repair.pickup_deadline_at"
        side_effects:
          - "repair.repair_status = ABANDONED"
          - "diamond.custody_status = IN_VAULT (constructive custody returns to the store)"
          - "store.open_repair_liability_cents recomputed"

  # ---------------------------------------------------------------------------
  - entity: RepairHold
    initial_state: EVALUATING
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: EVALUATING
        to: APPLIED
        trigger: "POST /repairs/{id}/holds"
        actor: StoreManager
        preconditions:
          - "repair.repair_status IN {ROUTED, IN_REPAIR}"
          - "extended_promised_delivery_at <= repair.accepted_at + 1.5 x vendor_turnaround_days"
        side_effects:
          - "repair_hold.deadline_adjusted = true"
          - "repair_hold.extension_days = extended_promised_delivery_at - repair.promised_delivery_at in whole days"
          - "repair.promised_delivery_at = extended_promised_delivery_at"
          - "repair.version += 1"
      - from: EVALUATING
        to: REJECTED
        trigger: "POST /repairs/{id}/holds"
        actor: StoreManager
        preconditions:
          - "repair.repair_status IN {ROUTED, IN_REPAIR}"
          - "extended_promised_delivery_at > repair.accepted_at + 1.5 x vendor_turnaround_days"
        side_effects:
          - "repair_hold.deadline_adjusted = false"
          - "repair_hold.imposed_breach_adjustment_cents = round(repair.loss_liability_cents x BREACH_COMPENSATION_PCT) recorded as a store credit owed to the customer"
          - "repair.promised_delivery_at unchanged"

  # ---------------------------------------------------------------------------
  - entity: CustomDesignOrder
    initial_state: DEPOSIT_PAID
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DEPOSIT_PAID
        to: CAD_REVISION
        trigger: "POST /custom-design-orders/{id}/revisions"
        actor: Customer
        preconditions:
          - "custom_design_order.design_status IN {DEPOSIT_PAID, CAD_REVISION}"
          - "custom_design_order.revision_count < 5"
        side_effects:
          - "custom_design_order.revision_count += 1"
          - "when revision_count <= 2: free_revisions_used += 1 and revision_fee_cents unchanged"
          - "when revision_count > 2: revision_fee_cents += CAD_REVISION_FEE_CENTS (2500)"
          - "custom_design_order.design_status = CAD_REVISION"
          - "custom_design_order.version += 1"
      - from: CAD_REVISION
        to: CAD_APPROVED
        trigger: "POST /custom-design-orders/{id}/cad-approval"
        actor: Customer
        preconditions:
          - "custom_design_order.design_status == CAD_REVISION"
        side_effects:
          - "custom_design_order.design_status = CAD_APPROVED; approved_at = now"
          - "custom_design_order.non_refundable_deposit_cents = custom_design_order.deposit_cents"
          - "custom_design_order.version += 1"
      - from: CAD_APPROVED
        to: IN_PRODUCTION
        trigger: "POST /custom-design-orders/{id}/start-production"
        actor: StoreManager
        preconditions:
          - "custom_design_order.design_status == CAD_APPROVED"
        side_effects:
          - "custom_design_order.design_status = IN_PRODUCTION"
          - "custom_design_order.non_refundable_deposit_cents = deposit_cents; refundable_deposit_cents = 0"
          - "customer.account_status must be OPEN or the transition is rejected"
          - "custom_design_order.version += 1"
      - from: CAD_APPROVED
        to: DEPOSIT_PAID
        trigger: "POST /custom-design-orders/{id}/recall"
        actor: StoreManager
        preconditions:
          - "custom_design_order.design_status == IN_PRODUCTION"
          - "the revised shop quote deviates more than 10 percent from estimate_amount_cents"
        side_effects:
          - "custom_design_order.design_status reverts to CAD_APPROVED then, when the customer declines the variance, to DEPOSIT_PAID (the cycle CAD_APPROVED -> IN_PRODUCTION -> CAD_APPROVED -> DEPOSIT_PAID is permitted)"
          - "custom_design_order.non_refundable_deposit_cents = 0; refundable_deposit_cents = deposit_cents"
          - "custom_design_order.version += 1"
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /custom-design-orders/{id}/complete"
        actor: StoreManager
        preconditions:
          - "custom_design_order.design_status == IN_PRODUCTION"
          - "the customer holds an APPROVED CreditApplication whose approved_limit_cents >= estimate_amount_cents + revision_fee_cents"
        side_effects:
          - "custom_design_order.design_status = COMPLETED"
          - "custom_design_order.non_refundable_deposit_cents = deposit_cents; refundable_deposit_cents = 0"
          - "create Purchase(customer_id, store_id, base_price_cents = estimate_amount_cents + revision_fee_cents, purchase_status = PENDING, trade_up_credit_cents = 0)"
          - "custom_design_order.version += 1"
      - from: DEPOSIT_PAID
        to: CANCELLED
        trigger: "POST /custom-design-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "custom_design_order.design_status NOT IN {IN_PRODUCTION, COMPLETED}"
        side_effects:
          - "custom_design_order.design_status = CANCELLED (terminal)"
          - "custom_design_order.cancellation_fee_cents = 0"
          - "custom_design_order.non_refundable_deposit_cents = 0; refundable_deposit_cents = deposit_cents"
          - "append PayoffLedgerEntry(plan_id = the plan financing this order when one exists, entry_kind=TRADE_UP_CREDIT, direction=DECREASE, amount_cents = refundable_deposit_cents)"
      - from: CAD_REVISION
        to: CANCELLED
        trigger: "POST /custom-design-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "custom_design_order.design_status NOT IN {IN_PRODUCTION, COMPLETED}"
        side_effects:
          - "custom_design_order.design_status = CANCELLED"
          - "custom_design_order.non_refundable_deposit_cents = 0; refundable_deposit_cents = deposit_cents"
      - from: CAD_APPROVED
        to: CANCELLED
        trigger: "POST /custom-design-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "custom_design_order.design_status NOT IN {IN_PRODUCTION, COMPLETED}"
        side_effects:
          - "custom_design_order.design_status = CANCELLED"
          - "custom_design_order.non_refundable_deposit_cents = 0; refundable_deposit_cents = deposit_cents"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /custom-design-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "custom_design_order.design_status == IN_PRODUCTION"
        side_effects:
          - "custom_design_order.design_status = CANCELLED"
          - "custom_design_order.cancellation_fee_cents = non_refundable_deposit_forfeit(custom_design_order)"
          - "custom_design_order.non_refundable_deposit_cents = deposit_cents; refundable_deposit_cents = 0"

  # ---------------------------------------------------------------------------
  - entity: Purchase
    initial_state: PENDING
    terminal_states: [COMPLETED, TRADE_UP_APPLIED]
    transitions:
      - from: PENDING
        to: FINANCED
        trigger: "POST /promotional-plans"
        actor: SalesAssociate
        preconditions:
          - "purchase.purchase_status == PENDING"
          - "purchase.customer_id equals plan.customer_id"
        side_effects:
          - "purchase.purchase_status = FINANCED"
          - "purchase.version += 1"
      - from: FINANCED
        to: COMPLETED
        trigger: "POST /purchases/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "purchase.purchase_status IN {PENDING, FINANCED}"
          - "customer.account_status == OPEN"
          - "the customer holds an APPROVED CreditApplication whose approved_limit_cents >= purchase.net_amount_cents"
          - "customer.outstanding_balance_cents + purchase.net_amount_cents <= customer.standalone_credit_limit_cents"
          - "when purchase.origin_purchase_id is set: purchase.base_price_cents >= 2 x origin.base_price_cents"
        side_effects:
          - "hop 1: purchase.purchase_status = COMPLETED; completed_at = now"
          - "hop 2: customer.outstanding_balance_cents += purchase.net_amount_cents; customer.lifetime_purchase_cents += purchase.base_price_cents"
          - "hop 3: every Diamond attached to this purchase (diamond_id) gets owner_customer_id = customer_id and custody_status = IN_CASE"
          - "hop 4: when origin_purchase_id is set, the origin Purchase.purchase_status = TRADE_UP_APPLIED and its PromotionalPlan (when one exists) becomes PAID with a PayoffLedgerEntry(entry_kind=TRADE_UP_CREDIT, direction=DECREASE, amount_cents = trade_up_credit_cents)"
          - "hop 5: when the origin purchase has a live ServicePlanRegistration, that registration becomes TERMINATED and exactly one fresh ServicePlanRegistration for the new diamond starts at PENDING_INSPECTION; when the origin purchase carries no registration, no registration is created"
          - "hop 6: recompute customer.outstanding_balance_cents and credit_tier_from_plan_mix_and_inspection_streak(customer); recompute store.open_inspection_count"
          - "purchase.version += 1"

  # ---------------------------------------------------------------------------
  - entity: Diamond
    initial_state: IN_CASE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: IN_CASE
        to: AT_VENDOR
        trigger: "POST /repairs/{id}/route"
        actor: StoreManager
        preconditions: ["the repair referencing this diamond entered ROUTED"]
        side_effects: ["diamond.custody_status = AT_VENDOR"]
      - from: AT_VENDOR
        to: IN_VAULT
        trigger: "POST /repairs/{id}/submit-qc"
        actor: StoreManager
        preconditions: ["the repair referencing this diamond entered QC_REVIEW"]
        side_effects: ["diamond.custody_status = IN_VAULT"]
      - from: IN_VAULT
        to: IN_CASE
        trigger: "POST /repairs/{id}/verify"
        actor: StoreManager
        preconditions: ["the repair referencing this diamond entered COMPLETED"]
        side_effects: ["diamond.custody_status = IN_CASE"]
      - from: AT_VENDOR
        to: WITHDRAWN
        trigger: "POST /repairs/{id}/declare-unrepairable"
        actor: StoreManager
        preconditions: ["the repair referencing this diamond entered UNREPAIRABLE"]
        side_effects: ["diamond.custody_status = WITHDRAWN"]
      - from: IN_CASE
        to: IN_VAULT
        trigger: "POST /purchases/{id}/complete (trade-up surrender)"
        actor: SalesAssociate
        preconditions: ["the acted purchase carries origin_purchase_id equal to the purchase that transferred this diamond"]
        side_effects: ["diamond.custody_status = IN_VAULT (the surrendered stone returns to chain stock)"]
      - from: IN_CASE
        to: WITHDRAWN
        trigger: "POST /repairs/{id}/declare-loss"
        actor: StoreManager
        preconditions: ["the repair referencing this diamond entered VERIFIED_LOSS"]
        side_effects: ["diamond.custody_status = WITHDRAWN"]

  # ---------------------------------------------------------------------------
  - entity: Appraisal
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: CIRCULATED
        trigger: "POST /appraisals/{id}/advise-insurer"
        actor: CustomerService
        preconditions:
          - "appraisal.appraisal_kind == REPLACEMENT"
          - "the registration covering this diamond has replacement_claims_used < 1"
        side_effects:
          - "appraisal.appraisal_status = CIRCULATED"
          - "registration.replacement_claims_used += 1"
          - "store.open_inspection_count unchanged"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /appraisals (a newer appraisal is issued for the same repair_id)"
        actor: StoreManager
        preconditions:
          - "another Appraisal with appraisal_kind == REPLACEMENT exists for the same repair_id"
        side_effects:
          - "the older appraisal.appraisal_status = SUPERSEDED; repair.stored_appraisal_id points at the newest appraisal"

  # ---------------------------------------------------------------------------
  - entity: Customer
    initial_state: NO_FILE
    terminal_states: [CLOSED]
    transitions:
      - from: NO_FILE
        to: OPEN
        trigger: "POST /credit-applications/{id}/decision (APPROVE_FULL) or POST /credit-applications/{id}/accept"
        actor: CreditAnalyst
        preconditions: ["the customer has at least one CreditApplication reaching APPROVED"]
        side_effects: ["customer.account_status = OPEN"]
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /plans/default-due (batch sweep)"
        actor: CreditAnalyst
        preconditions: ["at least one PromotionalPlan of this customer entered DEFAULTED"]
        side_effects: ["customer.account_status = SUSPENDED; credit_tier = NO_FILE; standalone_credit_limit_cents = 0"]
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /customers/{id}/reinstate"
        actor: CreditAnalyst
        preconditions:
          - "customer.account_status == SUSPENDED"
          - "no PromotionalPlan of this customer is in plan_status == DEFAULTED"
        side_effects:
          - "customer.account_status = OPEN"
          - "customer.standalone_credit_limit_cents = the base_limit_cents of the CreditLimitRegistryState row referenced by the customer's most recent APPROVED CreditApplication"
          - "recompute credit_tier_from_plan_mix_and_inspection_streak(customer)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /customers/{id}/close"
        actor: CustomerService
        preconditions:
          - "customer.outstanding_balance_cents == 0"
          - "no Repair of this customer has repair_status IN {INTAKE, ROUTED, IN_REPAIR, QC_REVIEW, COMPLETED}"
          - "no ServicePlanRegistration of this customer has coverage_status IN {PENDING_INSPECTION, REMINDER_ISSUED, GRACE_PERIOD, RENEWED}"
        side_effects:
          - "customer.account_status = CLOSED (terminal)"
          - "every ServicePlanRegistration of this customer with coverage_status == ACTIVE becomes TERMINATED"
          - "every CreditApplication of this customer with decision_status == PENDING becomes DECLINED"
          - "store.open_inspection_count recomputed for each affected store"

  # ---------------------------------------------------------------------------
  - entity: Store
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ACTIVE
        trigger: "POST /stores/{id}/activate"
        actor: ChainAdmin
        preconditions: ["the store has at least one CreditLimitRegistryState fallback row available on its state_code or the global row"]
        side_effects: ["store.store_status = ACTIVE; store.version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /stores/{id}/suspend"
        actor: ChainAdmin
        preconditions: ["store.open_repair_liability_cents > store.available_credit_capacity_cents"]
        side_effects:
          - "store.store_status = SUSPENDED"
          - "every CreditApplication of this store with decision_status == PENDING becomes DECLINED"
          - "no new Repair may be accepted at this store (intake is rejected with ERR_STORE_CREDIT_CAPACITY_EXCEEDED)"
          - "store.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /stores/{id}/reinstate"
        actor: ChainAdmin
        preconditions: ["store.open_repair_liability_cents <= store.available_credit_capacity_cents"]
        side_effects: ["store.store_status = ACTIVE; store.version += 1"]

  # ---------------------------------------------------------------------------
  - entity: BillingStatement
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /billing-statements/{id}/close"
        actor: CustomerService
        preconditions:
          - "billing_statement.statement_status == OPEN"
          - "billing_statement.statement_balance_cents >= 0"
        side_effects:
          - "billing_statement.statement_status = CLOSED (terminal)"
          - "billing_statement.version += 1"

# =============================================================================
# Table 2.1: Concurrency Rules
#
# Filter applied per SKILL.md §1.2.1: every entry below is a CREATE-with-
# supersede / competing-key-write pattern where a strictly SECOND request would
# legitimately succeed under the natural product semantics, so no state
# precondition already covers it. All are resolved by OCC on the parent's
# `version`; no wall-clock windows, locks, or first-writer framing.
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-competing-promo
    parent_entity: Purchase
    write_endpoint: "POST /promotional-plans"
    occ_field: "expected_purchase_version"
    description: |
      Creating a PromotionalPlan against a Purchase whose version has advanced
      since the client last observed it is rejected. Two financing codes are
      each legitimate for the same purchase, so a second sequential create is
      not covered by any state precondition; only the client holding the
      current Purchase.version may write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: visit-create-competing-slot
    parent_entity: ServicePlanRegistration
    write_endpoint: "POST /inspection-visits"
    occ_field: "expected_registration_version"
    description: |
      Logging an InspectionVisit against a ServicePlanRegistration whose
      version has advanced since the client last observed it is rejected. A
      second sequential visit log for a different instant is legitimate under
      the product semantics, so the check is resolved on the registration's
      version rather than on the visit state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ledger-append-stale-plan
    parent_entity: PromotionalPlan
    write_endpoint: "POST /promotional-plans/{id}/payoff"
    occ_field: "expected_plan_version"
    description: |
      Applying a payoff against a PromotionalPlan whose version has advanced
      since the client last observed it is rejected. A second sequential payoff
      request is rejected by the plan's ACCRUING precondition only after the
      first succeeds, so the stale case is the one where the client never saw
      the intervening capitalization sweep.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
#
# Every literal appearing in a formula's worked example below was executed as
# Python against this formula and its `constants:` before being written here.
# =============================================================================
calculations:
  - name: credit_limit_registry_pricing
    trigger: "POST /credit-applications/{id}/decision"
    algorithm: threshold
    formula: |
      policy_tier = TIER_3 if requested_limit_cents >= 1000000 \
                   else TIER_2 if requested_limit_cents >= 500000 \
                   else TIER_1 if requested_limit_cents >= 200000 \
                   else TIER_1            # below the registry floor; TERM_1 row still applies
      if declared_annual_income_cents is not null and declared_annual_income_cents < 2500000:
          policy_tier = TIER_1
      candidates = [row for row in CreditLimitRegistryState
                    if row.credit_tier == policy_tier
                    and row.min_ticket_cents <= requested_limit_cents]
      state_rows = [row for row in candidates if row.registry_key == customer.state_code]
      selected   = max(state_rows, key=lambda r: (r.min_ticket_cents, r.created_at)) if state_rows \
                   else max([row for row in candidates if row.registry_key == row.all_states_key],
                            key=lambda r: (r.min_ticket_cents, r.created_at))
      approved_limit_cents = min(selected.base_limit_cents, requested_limit_cents)
      min_down_payment_required_cents = ceil(selected.min_down_payment_pct * requested_purchase_amount_cents)
      down_payment_shortfall_cents = max(0, min_down_payment_required_cents - down_payment_cents)
    input_set: "The most recent CreditLimitRegistryState row for (registry_key, credit_tier, min_ticket_cents) with registry_key == customer.state_code, falling back to the row whose registry_key == all_states_key"
    constants:
      TIER_3_REQUEST_THRESHOLD_CENTS: 1000000
      TIER_2_REQUEST_THRESHOLD_CENTS: 500000
      TIER_1_REQUEST_THRESHOLD_CENTS: 200000
      INCOME_DOWNGRADE_THRESHOLD_CENTS: 2500000
      ALL_STATES_KEY: "*"
    precision: "cents, integer, round_half_up (ceil for the down-payment floor)"
    worked_example: |
      TX row (min_ticket_cents=200000, base_limit_cents=300000, min_down_payment_pct=0.10)
      requested_limit_cents=300000, requested_purchase_amount_cents=300000, down_payment_cents=30000
      -> approved_limit_cents=300000, min_down_payment_required_cents=30000,
         down_payment_shortfall_cents=0
      Same inputs with requested_purchase_amount_cents=300001
      -> min_down_payment_required_cents=30001, down_payment_shortfall_cents=1
      Same inputs with requested_purchase_amount_cents=300050
      -> min_down_payment_required_cents=30005, down_payment_shortfall_cents=5
    variants:
      - name: STATE_ROW_WINS
        when: "a row exists whose registry_key == customer.state_code for the priced tier"
        difference: "State row's base_limit_cents and min_down_payment_pct bind, even when the global row is more generous"
      - name: GLOBAL_FALLBACK_ROW
        when: "no state row exists for the priced tier"
        difference: "the all_states_key row binds and the response carries decision_rule_id of the global row"

  - name: promo_interest_accrual
    trigger: "POST /plans/capitalize-due and every read of PromotionalPlan.final_settlement_amount_cents"
    algorithm: forward_looking
    formula: |
      if plan.plan_status == CAPITALIZED:
          return 0                     # interest already absorbed into principal_cents
      dt = (now - plan.created_at).days
      return round(plan.principal_cents * plan.promotional_apr_pct / 100 * dt / 365)
    input_set: "PromotionalPlan rows with plan_status == ACCRUING only; PAID, CAPITALIZED, DEFAULTED and VOIDED rows contribute 0"
    constants:
      DAYS_PER_YEAR: 365
      APR_PROMO_12_6M: 26.99
      APR_PROMO_18_6M: 27.99
      APR_PROMO_24_12M: 28.99
    precision: "cents, integer, round_half_up"
    worked_example: |
      principal_cents=450000, APR 26.99, dt=196 -> round(450000*26.99/100*196/365) = 65220
      principal_cents=450000, APR 26.99, dt=120 -> 39930
      principal_cents=450000, APR 26.99, dt=200 -> 66551
    variants:
      - name: PROVISIONAL_ACCRUING
        when: "plan_status == ACCRUING"
        difference: "the plan's contractual balance includes the running deferral accrual"
      - name: VESTED_ZERO
        when: "plan_status == PAID"
        difference: "accrual collapses to 0 and the customer therefore owes principal only"

  - name: promo_plan_tiering
    trigger: "POST /promotional-plans"
    algorithm: tiered_pricing
    formula: |
      deferred_months/simplicity_months/deferral_basis_points =
         (6, 12, 1200)   when plan_code == PROMO_12_6M
         (6, 18, 1500)   when plan_code == PROMO_18_6M
         (12, 24, 1600)  when plan_code == PROMO_24_12M
      principal_cents = purchase.net_amount_cents + (purchase.protection_fee_cents if purchase.bundle_id is not null else 0)
      installment_quarter_cents = round(principal_cents / (simplicity_months / 3))
      installment_amount_cents  = installment_quarter_cents
      merchant_deferral_fee_cents = round(principal_cents * deferral_basis_points / 10000)
    input_set: "The single Purchase named by payload.purchase_id; its net_amount_cents and protection_fee_cents are read at creation and never re-read"
    constants:
      MONTHS_PER_QUARTER: 3
      DEFERRAL_BPS_PROMO_12_6M: 1200
      DEFERRAL_BPS_PROMO_18_6M: 1500
      DEFERRAL_BPS_PROMO_24_12M: 1600
    precision: "cents, integer, round_half_up"
    worked_example: |
      plan_code=PROMO_12_6M, net_amount_cents=450000, no bundle
      -> principal_cents=450000, installment_quarter_cents=round(450000/4)=112500,
         merchant_deferral_fee_cents=round(450000*1200/10000)=54000
      plan_code=PROMO_24_12M with the same amount (simplicity_months=24 -> 8 quarters)
      -> installment_quarter_cents=round(450000/8)=56250,
         merchant_deferral_fee_cents=round(450000*1600/10000)=72000
    variants:
      - name: MARGINAL_DEFERRAL_BPS
        when: "the plan straddles the 18-month boundary — months 13..18 price at 1500 bps"
        difference: "fee is built tier-by-tier rather than at the headline rate of the chosen code"
      - name: HEADLINE_DEFERRAL_BPS
        when: "the plan lies wholly inside a single code tier"
        difference: "fee uses the code's single headline bps; for PROMO_12_6M the two variants coincide"

  - name: payoff_ledger_projection
    trigger: "every append to PayoffLedgerEntry and every read of projected_total_cents"
    algorithm: chronological
    formula: |
      entries = sorted(plan.ledger_entries, key=lambda e: (e.recorded_at, e.entry_sequence))

      # base (artifact-independent) variant
      base_total = plan.principal_cents
                    + promo_interest_accrual(plan, now)
                    + sum(e.amount_cents for e in entries if e.direction == INCREASE)
                    - sum(e.amount_cents for e in entries if e.direction == DECREASE)

      # reference-bucket variant
      binding = [e for e in entries if e.reference_bucket == PROMOTIONAL]
      non_binding = [e for e in entries if e.reference_bucket != PROMOTIONAL]
      if not binding:
          variant_total = base_total
      else:
          invariant = binding[0].amount_cents            # the amount the customer promised to pay
          drift     = sum(e.amount_cents for e in binding if e.direction == DECREASE) - invariant
          variant_total = invariant + drift
    input_set: "all PayoffLedgerEntry rows for the plan, ordered by recorded_at ascending with entry_sequence ascending as tie-break"
    constants:
      PROMOTIONAL_BUCKET: "PROMOTIONAL"
    precision: "cents, integer; exact — no rounding inside the accumulator"
    worked_example: |
      principal_cents=450000, APR 26.99, dt=196, no ledger entries yet
      -> base_total = 450000 + 65220 = 515220, variant_total = 515220
      After a LUMPSUM_PAYOFF of 50000 referenced PROMOTIONAL is appended
      -> base_total = 465220, variant_total = 465220 + 0 = 465220 (the two variants agree)
      After a second LUMPSUM_PAYOFF of 50000 referenced RETAIL (a directed payment the
      counter misapplied to the retail bucket) is appended
      -> base_total = 415220, variant_total = 465220 (the RETAIL entry never binds PROMOTIONAL)
    variants:
      - name: ARTIFACT_INDEPENDENT_BALANCE
        when: "all ledger entries of the plan are considered, whatever bucket they reference"
        difference: "every decrease reduces the balance, so a misdirected payment lowers the payoff figure"
      - name: PROMOTIONAL_REFERENCE_BALANCE
        when: "the plan's first entry is a DIRECTED_PAYOFF_REFERENCE with reference_bucket == PROMOTIONAL"
        difference: "only entries referencing PROMOTIONAL move the figure; a payment booked to CUSTOM_DESIGN or RETAIL leaves the promotional payoff figure untouched"

  - name: repair_loss_liability
    trigger: "POST /repairs (intake) — the result is pinned and never recomputed"
    algorithm: aggregation
    formula: |
      # variant A: NET_RESERVE
      reserve = round(declared_parts_cents * WARRANTY_RESERVE_PCT)
      covered = declared_parts_cents - reserve
      insurance_labor = min(declared_labor_cents, max(0, stone_limit_labor_cents - covered))
      liability_A = max(0, covered + declared_labor_cents - stone_limit_labor_cents)
                    + reserve + declared_loss_liability_cents
      # variant B: GROSS_RESERVE  (reserve is taken on parts+labor, and above the limit)
      reserve_B = round((declared_parts_cents + declared_labor_cents) * WARRANTY_RESERVE_PCT)
      liability_B = max(0, declared_parts_cents + declared_labor_cents - stone_limit_labor_cents)
                    + reserve_B + declared_loss_liability_cents
      split (variant A, evaluated before any reserve term):
      insurance_parts_cents = min(covered, stone_limit_parts_cents)
      customer_parts_cents  = declared_parts_cents - insurance_parts_cents
      customer_labor_cents  = max(0, declared_labor_cents - insurance_labor)
      store_absorbed_cents  = liability_A
      is_valid_plan = (registration.coverage_status == ACTIVE)
      if not is_valid_plan:
          customer_parts_cents += insurance_parts_cents
          insurance_parts_cents  = 0
    input_set: "exactly one Repair intake; the ServicePlanRegistration pinned on the Repair row; the ProtectionBundle it names"
    constants:
      WARRANTY_RESERVE_PCT: 0.07
      LOSS_LIABILITY_DEFAULT_CENTS: 0
    precision: "cents, integer, round_half_up"
    worked_example: |
      declared_parts_cents=40000, declared_labor_cents=15000,
      stone_limit_labor_cents=25000, stone_limit_parts_cents=60000,
      declared_loss_liability_cents=5000, plan ACTIVE
      -> variant A: reserve=round(40000*0.07)=2800, covered=37200,
         insurance_labor=min(15000, max(0,25000-37200))=0,
         liability_A = max(0, 37200+15000-25000) + 2800 + 5000 = 35000
      -> variant B: reserve_B=round(55000*0.07)=3850,
         liability_B = max(0, 55000-25000) + 3850 + 5000 = 38850
      -> split: insurance_parts_cents=37200, customer_parts_cents=2800,
         customer_labor_cents=15000, store_absorbed_cents=35000
    variants:
      - name: NET_RESERVE
        when: "the chain's default intake posture — reserve is taken on parts before the limit is applied"
        difference: "store_absorbed_cents = 35000 on the worked example"
      - name: GROSS_RESERVE
        when: "the covered plan was retired mid-term, so above-limit value is reserved too"
        difference: "store_absorbed_cents = 38850 on the worked example, a 3850 cent divergence for identical inputs"

  - name: vendor_routing_and_turnaround
    trigger: "POST /repairs/{id}/route"
    algorithm: constraint_propagation
    formula: |
      vendor_shop_code     = "CONRUSH" if vendor_is_rush else ROUTE_TABLE[failure_class]
      ROUTE_TABLE = {STONE_LOSS: "MALCA", SETTING: "JEWELCRAFT", PRONG: "JEWELCRAFT",
                     RESIZE: "MASTERMELT", OTHER: "MASTERMELT"}
      vendor_turnaround_days = VendorShop[shop_code].base_turnaround_days
      promised_delivery_at = accepted_at + vendor_turnaround_days          # variant QUOTED
      # variant ADJUSTED (evaluated only when a RepairHold is APPLIED)
      pending_extension_days = sum(h.extension_days for h in plan.holds if h.deadline_adjusted)
      promised_delivery_at   = accepted_at + vendor_turnaround_days + pending_extension_days
      ceiling_days = 1.5 * vendor_turnaround_days
    input_set: "the single Repair named by the path; its failure_class, vendor_is_rush, and any APPLIED RepairHold rows"
    constants:
      ROUTE_TABLE: {STONE_LOSS: MALCA, SETTING: JEWELCRAFT, PRONG: JEWELCRAFT, RESIZE: MASTERMELT, OTHER: MASTERMELT}
      RUSH_SHOP_CODE: CONRUSH
      CEILING_MULTIPLIER: 1.5
    precision: "whole calendar days; datetime arithmetic is inclusive of the accepted instant"
    worked_example: |
      failure_class=SETTING, vendor_is_rush=false
      -> vendor_shop_code=JEWELCRAFT, base_turnaround_days=7,
         promised_delivery_at = accepted_at + 7 days, ceiling_days = 10.5
      An APPLIED hold with extended_promised_delivery_at = accepted_at + 10 days
      -> extension_days=3, promised_delivery_at = accepted_at + 10 days (within the ceiling)
      A hold requesting accepted_at + 11 days
      -> rejected: 11 > 10.5; imposed_breach_adjustment_cents = round(liability * BREACH_PCT)
    variants:
      - name: QUOTED_TURNAROUND
        when: "no APPLIED RepairHold exists for the repair"
        difference: "the customer-facing commitment is the shop's base turnaround only"
      - name: ADJUSTED_TURNAROUND
        when: "at least one RepairHold was APPLIED"
        difference: "the commitment is base turnaround plus every applied extension, still bounded by 1.5x base"

  - name: turnaround_breach_compensation
    trigger: "POST /repairs/{id}/verify when now > promised_delivery_at, and POST /repairs/{id}/holds when the extension is REJECTED"
    algorithm: threshold
    formula: |
      overdue_days = (delivered_at or now) - promised_delivery_at        # whole days, floored at 0
      if overdue_days < 1:
          compensation_cents = 0
      elif overdue_days <= 5:
          compensation_cents = round(loss_liability_cents * PARTIAL_BREACH_PCT)
      elif overdue_days <= 15:
          compensation_cents = round(loss_liability_cents * MAJOR_BREACH_PCT)
      else:
          compensation_cents = round(loss_liability_cents * FULL_BREACH_PCT)
      compensation_cents = min(compensation_cents, store.available_credit_capacity_cents)
    input_set: "one Repair, its pinned loss_liability_cents, and the store's capacity at the instant of evaluation"
    constants:
      PARTIAL_BREACH_PCT: 0.05
      MAJOR_BREACH_PCT: 0.15
      FULL_BREACH_PCT: 0.25
      BREACH_COMPENSATION_PCT: 0.05
    precision: "cents, integer, round_half_up"
    worked_example: |
      loss_liability_cents=35000, overdated by 5 days -> round(35000*0.05) = 1750
      same repair, overdue by 6 days   -> round(35000*0.15) = 5250
      same repair, overdue by 16 days  -> round(35000*0.25) = 8750
      same repair, overdue by 0 days (delivered exactly at promised_delivery_at) -> 0
    variants:
      - name: UNBOUND_COMPENSATION
        when: "the store still carries spare credit capacity"
        difference: "the computed percentage is paid in full"
      - name: CAPACITY_BOUND_COMPENSATION
        when: "available_credit_capacity_cents is below the computed percentage"
        difference: "compensation is clipped to the remaining capacity, so the store's conserved capacity total drains to exactly 0"

  - name: trade_up_credit_basis
    trigger: "POST /purchases/{id}/complete when origin_purchase_id is set, and POST /purchases/{id}/trade-up-preview"
    algorithm: aggregation
    formula: |
      credited_base = origin.base_price_cents + round(origin.trade_up_credit_cents * TRADE_UP_BONUS_PCT)
      # variant A: SINGLE_ROUND  (pinned as authoritative)
      credit_A = round(credited_base * TRADE_UP_CREDIT_PCT)
      # variant B: PER_COMPONENT_ROUND
      credit_B = round(origin.base_price_cents * TRADE_UP_CREDIT_PCT)
                  + round(round(origin.trade_up_credit_cents * TRADE_UP_BONUS_PCT) * TRADE_UP_CREDIT_PCT)
      trade_up_floor_cents = 2 * origin.base_price_cents
    input_set: "the origin Purchase named by origin_purchase_id; its base_price_cents and any trade_up_credit_cents it already carries"
    constants:
      TRADE_UP_CREDIT_PCT: 0.85
      TRADE_UP_BONUS_PCT: 0.10
    precision: "cents, integer, round_half_up — the rounding ORDER is pinned by the chosen variant"
    worked_example: |
      origin.base_price_cents=450018, origin.trade_up_credit_cents=10050
      -> variant A: bonus = round(10050 * 0.10) = 1005
                    credited_base = 450018 + 1005 = 451023
                    credit_A = round(451023 * 0.85) = round(383369.55) = 383370
      -> variant B: round(450018 * 0.85) = round(382515.30) = 382515
                    round(1005 * 0.85)   = round(854.25)    = 854
                    credit_B = 383369
      -> the two orders differ by exactly 1 cent on identical inputs; the scaffold
         pins SINGLE_ROUND (383370) as the authoritative trade_up_credit_cents
      origin.base_price_cents=450018, origin.trade_up_credit_cents=0
      -> variant A: credited_base=450018, credit_A=round(382515.30)=382515
      -> variant B: 382515 + 0 = 382515 (the variants coincide when no bonus exists)
    variants:
      - name: SINGLE_ROUND
        when: "the counter quotes the trade-up credit before the item is ticketed (the pinned default)"
        difference: "one rounding over the combined credited base; authoritative value 383370 on the worked example"
      - name: PER_COMPONENT_ROUND
        when: "the trade-up credit is posted to the ledger as two component credits"
        difference: "each component is rounded independently before summing, giving 383369 on the worked example — a 1 cent divergence from SINGLE_ROUND"

  - name: balance_due_after_trade_up
    trigger: "POST /purchases/{id}/complete"
    algorithm: threshold
    formula: |
      trade_up_credit_cents = trade_up_credit_basis(purchase) when origin_purchase_id is set else 0
      cap = (2 * origin.base_price_cents) if origin_purchase_id is set else null
      if cap is not null:
          trade_up_credit_cents = min(trade_up_credit_cents, cap)
      elif origin_purchase_id is null and purchase.trade_up_credit_cents > 0:
          trade_up_credit_cents = 0
      net_amount_cents = max(0, base_price_cents - trade_up_credit_cents)
      protection_fee_cents = bundle.lifetime_plan_fee_cents if bundle_id is not null else 0
      balance_due_cents = net_amount_cents + protection_fee_cents
    input_set: "the Purchase named by the path, the origin Purchase it names, and the ProtectionBundle it attaches"
    constants:
      TRADE_UP_CREDIT_CAP_MULTIPLIER: 2
    precision: "cents, integer, exact subtraction after the cap is applied"
    worked_example: |
      base_price_cents=900100, origin.base_price_cents=450018
      -> cap = 2*450018 = 900036; the ticket 900100 clears the cap and the floor
      -> SINGLE_ROUND credit = 383370 (below the cap)
      -> net_amount_cents = 900100 - 383370 = 516730
      -> no bundle -> protection_fee_cents = 0 -> balance_due_cents = 516730
      base_price_cents=900100, same origin, bundle.lifetime_plan_fee_cents=19900
      -> net_amount_cents = 516730, protection_fee_cents = 19900, balance_due_cents = 536630
      base_price_cents=900100 with NO origin_purchase_id
      -> trade_up_credit_cents = 0, net_amount_cents = 900100, balance_due_cents = 900100
      base_price_cents=900035, origin.base_price_cents=450018
      -> the ticket misses the floor 900036 by 1 cent, so completion is refused with
         ERR_TRADE_UP_FLOOR_NOT_MET while the trade-up credit still computes to 383370
    variants:
      - name: WITH_ORIGIN
        when: "origin_purchase_id is set"
        difference: "the origin's ticket is credited at 85% and capped at twice the origin ticket"
      - name: NO_ORIGIN
        when: "origin_purchase_id is null"
        difference: "no credit is applied even when a trade_up_credit_cents value was supplied on create — the field is recomputed, not accepted"

  - name: custom_design_deposit_and_forfeit
    trigger: "POST /custom-design-orders (deposit stamping) and POST /custom-design-orders/{id}/cancel"
    algorithm: threshold
    formula: |
      deposit_cents = round(estimate_amount_cents * deposit_pct)          # stamped at submit, immutable
      if design_status == COMPLETED:
          non_refundable_deposit_cents = deposit_cents
      elif design_status in {DEPOSIT_PAID, CAD_REVISION, CAD_APPROVED}:
          non_refundable_deposit_cents = 0
      elif design_status in {IN_PRODUCTION, CANCELLED}:
          non_refundable_deposit_cents = deposit_cents
      refundable_deposit_cents = deposit_cents - non_refundable_deposit_cents
      cancellation_fee_cents = (costs_incurred_cents if revision_count >= 3 else deposit_cents) \
                               if design_status == CANCELLED else 0
      costs_incurred_cents = deposit_cents + revision_fee_cents - material_recovery_cents
      if cancellation_fee_cents > deposit_cents:
          customer_balance_due_cents = cancellation_fee_cents - deposit_cents
      else:
          customer_refund_cents = deposit_cents - cancellation_fee_cents
    input_set: "one CustomDesignOrder; deposit_cents is read from the row, never recomputed from the current estimate"
    constants:
      DEPOSIT_PCT_MIN: 0.30
      DEPOSIT_PCT_MAX: 0.50
      CAD_REVISION_FEE_CENTS: 2500
      FREE_REVISION_LIMIT: 2
    precision: "cents, integer, round_half_up"
    worked_example: |
      estimate_amount_cents=250000, deposit_pct=0.40 -> deposit_cents=100000
      Cancel from CAD_REVISION with revision_count=1
      -> non_refundable_deposit_cents=0, refundable_deposit_cents=100000, cancellation_fee_cents=0
      Cancel from IN_PRODUCTION with revision_count=3, material_recovery_cents=20000
      -> costs_incurred_cents = deposit_cents 100000 + revision_fee_cents 7500 - 20000 = 82500
      -> cancellation_fee_cents = 82500 (< deposit_cents 100000)
      -> customer_refund_cents = 100000 - 82500 = 17500
    variants:
      - name: DEPOSIT_BOUNDED_FORFEIT
        when: "costs_incurred_cents <= deposit_cents"
        difference: "the forfeit is capped at the deposit and the customer receives the difference"
      - name: COST_BEARING_FORFEIT
        when: "costs_incurred_cents > deposit_cents"
        difference: "the customer is billed the excess as a balance due rather than refunded"

  - name: inspection_reminder_scheduling
    trigger: "POST /inspection-reminders/run and POST /service-plan-registrations/{id}/exams"
    algorithm: decay_function
    formula: |
      dt_days = (now - registration.registered_at).days           # whole days, floored
      interval = bundle.inspection_interval_days
      window_opens_at   = registration.registered_at + (interval * cycle_index) - REMINDER_LEAD_DAYS
      window_closes_at  = registration.registered_at + (interval * cycle_index) + bundle.inspection_cure_days
      if dt_days < interval - REMINDER_LEAD_DAYS:
          rem = 0
      elif dt_days < interval:
          rem = 1
      elif dt_days <= interval + bundle.inspection_cure_days:
          rem = 1
      else:
          rem = 0
    input_set: "one ServicePlanRegistration; cycle_index is 1 for the first inspection cycle and increments on each CLAIMED visit"
    constants:
      REMINDER_LEAD_DAYS: 14
      FIRST_CYCLE_INDEX: 1
    precision: "whole days; integer cardinality for rem, never fractional"
    worked_example: |
      registered_at=2026-03-05, interval=180, cure=30
      -> dt_days=143: 143 < 166 so rem = 0 (no reminder is spawned)
      -> dt_days=166: 166 >= 166 and 166 < 180 so rem = 1
      -> dt_days=180: 180 >= 180 and 180 <= 210 so rem = 1
      -> dt_days=210: 210 <= 210 so rem = 1 (the window closes inclusively)
      -> dt_days=211: 211 > 210 so rem = 0 (the registration is LAPSED, not reminded)
    variants:
      - name: EARLY_CYCLE
        when: "the first cycle has not yet opened its reminder window"
        difference: "exactly 0 InspectionVisit rows are spawned"
      - name: OPEN_WINDOW
        when: "the reminder window has opened but the cure deadline has not passed"
        difference: "exactly 1 InspectionVisit row is spawned and coverage_status becomes REMINDER_ISSUED"

  - name: credit_tier_from_plan_mix_and_inspection_streak
    trigger: "every PromotionalPlan status change, every ServicePlanRegistration lapse, and POST /customers/{id}/reinstate"
    algorithm: weighted_scoring
    formula: |
      active_plans = count(PromotionalPlan of customer with plan_status == ACCRUING)
      defaulted_plans = count(PromotionalPlan of customer with plan_status == DEFAULTED)
      util_bps = round(customer.outstanding_balance_cents * 10000 / max(1, customer.standalone_credit_limit_cents))
      util_band = 2 if util_bps >= 8000 \
                  else 1 if util_bps >= 5000 \
                  else 0 if util_bps > 0 else 0
      streak_component = min(3, customer.lost_inspection_streak)
      raw = 2 * util_band + active_plans + streak_component
      # streak is applied LAST: the increment caused by a lapse must be visible here
      if defaulted_plans > 0:
          tier = NO_FILE
      elif raw >= 3:
          tier = TIER_1
      elif raw == 2:
          tier = TIER_2
      else:
          tier = TIER_3
    input_set: "the customer's ACCRUING and DEFAULTED plans, the outstanding balance and limit at the instant of evaluation, and the streak AFTER any increment caused by the triggering event"
    constants:
      UTIL_VIOLATION_BPS: 8000
      UTIL_WATCH_BPS: 5000
      STREAK_COMPONENT_CAP: 3
    precision: "basis points integer; tier is an enum, no rounding"
    worked_example: |
      outstanding_balance_cents=300000, standalone_credit_limit_cents=300000
      -> util_bps=10000, util_band=2
      active_plans=1, lost_inspection_streak=0
      -> raw = 2*2 + 1 + 0 = 5 >= 3 -> TIER_1
      same but lost_inspection_streak jumps to 1 before evaluation
      -> raw = 2*2 + 1 + 1 = 6 -> TIER_1
      balance 150000 / limit 300000, 0 active plans, streak 0
      -> util_bps=5000, util_band=1, raw=2 -> TIER_2
      same with streak 1
      -> raw=3 -> TIER_1
    variants:
      - name: STREAK_APPLIED_AFTER_INCREMENT
        when: "evaluation runs as the final hop of a lapse cascade"
        difference: "the streak increment from the lapse in the same cascade is included"
      - name: STREAK_APPLIED_BEFORE_INCREMENT
        when: "evaluation runs as a hop of a payoff or plan-status cascade"
        difference: "the pre-event streak is used, so the same customer can be TIER_2 here and TIER_1 in the lapse cascade"

  - name: statement_balance_rollup
    trigger: "POST /billing-statements (statement generation)"
    algorithm: aggregation
    formula: |
      # variant A: SUM_THEN_TIER  (finalized tier is selected on the aggregate)
      subtotal_cents = sum(round(line.amount_cents * line.billable_pct) for line in lines)
      tier_fee_pct = 0.03 if subtotal_cents >= 500000 else 0.02 if subtotal_cents >= 200000 else 0.01
      statement_balance_A = round(subtotal_cents * (1 + tier_fee_pct))
      # variant B: PER_LINE_TIER  (each line is priced at the tier its own amount implies)
      per_line = []
      for line in lines:
          amt = round(line.amount_cents * line.billable_pct)
          pct = 0.03 if amt >= 500000 else 0.02 if amt >= 200000 else 0.01
          per_line.append(round(amt * (1 + pct)))
      statement_balance_B = sum(per_line)
    input_set: "all line items on the statement whose line_status == BILLABLE; PAID and DISPUTED lines are excluded before either variant runs"
    constants:
      TIER_FEE_PCT_HIGH: 0.03
      TIER_FEE_PCT_MID: 0.02
      TIER_FEE_PCT_LOW: 0.01
      TIER_BOUNDARY_HIGH_CENTS: 500000
      TIER_BOUNDARY_MID_CENTS: 200000
    precision: "cents, integer, round_half_up — the rounding ORDER is the variant"
    worked_example: |
      two BILLABLE lines of 250000 and 260000 at billable_pct=1.0
      -> variant A: subtotal=510000; tier 0.03; statement_balance=round(510000*1.03)=525300
      -> variant B: line1=round(250000*1.02)=255000; line2=round(260000*1.03)=267800;
         statement_balance=522800
      Delta = 2500 cents for identical inputs.
    variants:
      - name: SUM_THEN_TIER
        when: "the statement is rendered for the customer portal"
        difference: "the aggregate selects the tier once; crossing 500000 lifts every line to 3%"
      - name: PER_LINE_TIER
        when: "the statement is rendered for the finance roll-up"
        difference: "each line keeps its own tier, so a sub-500000 line never pays the high tier"

  - name: replacement_appraised_value
    trigger: "POST /appraisals (issuance from a repair file)"
    algorithm: aggregation
    formula: |
      base = repair.customer_parts_cents + repair.customer_labor_cents
      if repair.repair_status == UNREPAIRABLE:
          appraised_value_cents = round(base * APPRAISAL_MULTIPLIER_UNREPAIRABLE)
      else:
          appraised_value_cents = round(base * APPRAISAL_MULTIPLIER_DEFAULT)
      if diamond.stone_kind == LAB_GROWN:
          appraised_value_cents = round(appraised_value_cents * LAB_GROWN_FACTOR)
    input_set: "the Repair named by repair_id, its pinned customer_parts_cents and customer_labor_cents, and the diamond's stone_kind"
    constants:
      APPRAISAL_MULTIPLIER_UNREPAIRABLE: 1.04
      APPRAISAL_MULTIPLIER_DEFAULT: 1.00
      LAB_GROWN_FACTOR: 0.65
      INSURANCE_REPLACEMENT_PCT: 0.75
      INSURANCE_REPLACEMENT_CAP_PCT: 0.25
    precision: "cents, integer, round_half_up"
    worked_example: |
      customer_parts_cents=2800, customer_labor_cents=15000 -> base=17800
      UNREPAIRABLE natural stone -> round(17800*1.04)=18512
      default multiplier, same inputs -> 17800
      UNREPAIRABLE lab-grown -> round(18512*0.65)=12033
      Insurance coordination for TX (replacement_plus_pct=1.0),
      replacement invoice 850000, registration.replacement_claims_used=0
      -> store pays 850000, insurer reimburses 212500, store absorbs 637500
      ... with replacement_claims_used=1
      -> store pays round(850000*0.25)=212500, insurer reimburses 212500, store absorbs 0
    variants:
      - name: UNREPAIRABLE_MULTIPLIER
        when: "the shop declared the piece unrepairable"
        difference: "the 1.04 uplift applies before the lab-grown factor"
      - name: DEFAULT_MULTIPLIER
        when: "the piece was repaired or the loss was verified on a repairable piece"
        difference: "no uplift; identical inputs appraise 712 cents lower"
      - name: ORIGIN_TRACEABILITY
        when: "diamond.origin_registry is non-null"
        difference: "traceability_document_url is populated and the appraised value is unchanged"

  - name: payment_allocation_waterfall
    trigger: "POST /billing-statements"
    algorithm: waterfall_allocation
    formula: |
      buckets = [PROMOTIONAL, STANDARD_RETAIL, NEW_ACCOUNT]        # priority order, first fills first
      capacity = {PROMOTIONAL: customer.promotional_balance_cents,
                  STANDARD_RETAIL: customer.retail_balance_cents,
                  NEW_ACCOUNT: customer.new_account_balance_cents}
      allocated = {}
      remaining = payment_cents
      for b in buckets:
          take = min(remaining, capacity[b])
          allocated[b] = take
          remaining   -= take
          if remaining == 0: break
      if remaining > 0:
          raise StatementOverpayment(remaining)
      min_payment_due_cents = max(MIN_FLOOR_CENTS,
                                  sum(round(allocated[b] * min_base_pct) for b in allocated))
    input_set: "the payment amount and the three bucket balances at the instant of allocation"
    constants:
      MIN_FLOOR_CENTS: 5000
      MIN_BASE_PCT_LOW: 0.01
      MIN_BASE_PCT_HIGH: 0.02
      HIGH_BALANCE_THRESHOLD_CENTS: 200000
    precision: "cents, integer, round_half_up; the last bucket absorbs the remainder"
    worked_example: |
      payment_cents=90000, balances PROMOTIONAL=140000, STANDARD_RETAIL=60000, NEW_ACCOUNT=90000
      -> allocated = {PROMOTIONAL: 90000}, remaining = 0
      payment_cents=200000, same balances
      -> allocated = {PROMOTIONAL: 140000, STANDARD_RETAIL: 60000}, remaining = 0
      payment_cents=250000, same balances
      -> allocated = {PROMOTIONAL: 140000, STANDARD_RETAIL: 60000, NEW_ACCOUNT: 50000}, remaining = 0
      payment_cents=300000, same balances (total capacity 290000)
      -> StatementOverpayment raised for the residual 10000
    variants:
      - name: FIRST_BUCKET_ABSORBS
        when: "the payment is smaller than the promotional bucket balance"
        difference: "the whole payment lands in PROMOTIONAL and the other buckets are untouched"
      - name: CASCADING_OVERFLOW
        when: "the payment exceeds the promotional bucket"
        difference: "the residual cascades to STANDARD_RETAIL then NEW_ACCOUNT, and any amount past total capacity is rejected"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
#
# Priority is global: when one request violates rules at two priorities, the
# LOWEST priority number wins and its error_id is the one returned. §1.8's
# priority_pair_validation_conflict instances pin the pairs that matter.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7; a role performing another role's exclusive_operation is rejected"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "the path resource exists; for flat entities the FK fields named in input are checked in the order the endpoint's input list declares them, left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-scoped and FK-bearing endpoints"
  - priority: 4
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "the OCC field expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /promotional-plans", "POST /inspection-visits", "POST /promotional-plans/{id}/payoff", "POST /promotional-plans/{id}/reinstate"]
  - priority: 6
    category: business_compliance
    check: "origination requires the governing ServicePlanRegulation row to exist for store.state_code before any state or business rule is evaluated"
    error_id: ERR_REGULATION_TERMS_VIOLATION
    http_status: 422
    applies_to: ["POST /purchases/{id}/complete", "POST /service-plan-registrations", "POST /credit-applications/{id}/decision"]
  - priority: 7
    category: business_compliance
    check: "a regulated lifetime plan's plan_term_months must not exceed ServicePlanRegulation.max_plan_term_months, and when inspection_required_months > 0 the registration must be scheduled for inspection"
    error_id: ERR_REGULATION_TERMS_VIOLATION
    http_status: 422
    applies_to: ["POST /purchases/{id}/complete", "POST /service-plan-registrations"]
  - priority: 8
    category: business_safety
    check: "credit is frozen while any PromotionalPlan of the customer is DEFAULTED — the hazard check outranks every data-validity and fiscal check on the same request"
    error_id: ERR_CREDIT_FROZEN
    http_status: 422
    applies_to: ["POST /purchases/{id}/complete", "POST /promotional-plans", "POST /custom-design-orders", "POST /custom-design-orders/{id}/start-production"]
  - priority: 9
    category: business_constraint
    check: "the customer account carrying the obligation must be OPEN"
    error_id: ERR_ACCOUNT_NOT_OPEN
    http_status: 422
    applies_to: ["POST /purchases/{id}/complete", "POST /custom-design-orders", "POST /service-plan-registrations/{id}/renew"]
  - priority: 10
    category: business_constraint
    check: "ring metal must be a certified production metal; one-of-a-kind or untested alloys are refused before any coupling underwriting runs"
    error_id: ERR_RING_METAL_NOT_CERTIFIED
    http_status: 422
    applies_to: ["POST /custom-design-orders", "POST /custom-design-orders/{id}/start-production"]
  - priority: 11
    category: business_constraint
    check: "a natural centre stone over 1.00 carat requires the origin_registry document on file before any order or registration may be created"
    error_id: ERR_ORIGIN_DOCUMENT_MISSING
    http_status: 422
    applies_to: ["POST /custom-design-orders", "POST /purchases/{id}/complete", "POST /service-plan-registrations", "POST /repairs"]
  - priority: 12
    category: business_constraint
    check: "the acting customer must own the resource named in the path (X-User-ID equals the resource's customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /credit-applications/{id}/accept", "POST /credit-applications/{id}/decline-counter", "POST /custom-design-orders/{id}/revisions", "POST /custom-design-orders/{id}/cad-approval", "POST /custom-design-orders/{id}/cancel"]
  - priority: 13
    category: business_temporal
    check: "the request's effective instant must fall inside the declared validity window of the resource it acts on (credit decision validity, promo simplicity window, inspection cure window, store hold window)"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /credit-applications/{id}/decision", "POST /promotional-plans/{id}/payoff", "POST /service-plan-registrations/{id}/exams"]
  - priority: 14
    category: business_temporal
    check: "the requested repair extension must not push promised_delivery_at past accepted_at + 1.5 x vendor_turnaround_days"
    error_id: ERR_HOLD_PROMISE_CEILING
    http_status: 422
    applies_to: ["POST /repairs/{id}/holds"]
  - priority: 15
    category: business_temporal
    check: "an InspectionVisit may not be logged with a visit_at earlier than the registration's current inspection_due_at (retroactive back-dating beyond one cycle)"
    error_id: ERR_EXTENSION_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /service-plan-registrations/{id}/exams", "POST /inspection-visits"]
  - priority: 16
    category: business_referential
    check: "the Repair's pinned ServicePlanRegistration must still cover the diamond under repair — a registration whose coverage_status is TERMINATED or VOID cannot be named"
    error_id: ERR_PLAN_TERMS_UNSATISFIED
    http_status: 422
    applies_to: ["POST /repairs", "POST /repairs/{id}/route"]
  - priority: 17
    category: business_referential
    check: "the lifetime plan terms require the plan to be non-lapsed at intake; a LAPSED registration routes the repair to full-price billing"
    error_id: ERR_PLAN_TERMS_UNSATISFIED
    http_status: 422
    applies_to: ["POST /repairs"]
  - priority: 18
    category: business_referential
    check: "no other non-terminal PromotionalPlan may already reference the same purchase_id"
    error_id: ERR_PLAN_ALREADY_EXISTS
    http_status: 409
    applies_to: ["POST /promotional-plans"]
  - priority: 19
    category: business_constraint
    check: "a CreditLimitRegistryState row must resolve for the priced tier and requested amount"
    error_id: ERR_REGISTRY_ROW_MISSING
    http_status: 422
    applies_to: ["POST /credit-applications/{id}/decision"]
  - priority: 20
    category: business_fiscal
    check: "the requested credit amount must not exceed the standalone credit limit implied by the customer's credit_tier"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /credit-applications/{id}/decision", "POST /purchases/{id}/complete", "POST /custom-design-orders/{id}/complete"]
  - priority: 21
    category: business_fiscal
    check: "the store's available credit capacity must cover the obligation being booked"
    error_id: ERR_STORE_CREDIT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /repairs", "POST /purchases/{id}/complete"]
  - priority: 22
    category: business_fiscal
    check: "declared down payment must be at least the formula-derived minimum down payment for the decisioned tier"
    error_id: ERR_DOWN_PAYMENT_REQUIRED
    http_status: 422
    applies_to: ["POST /credit-applications"]
  - priority: 23
    category: business_fiscal
    check: "the payoff amount must be at least the plan's final settlement amount (principal plus deferred interest while ACCRUING)"
    error_id: ERR_INSUFFICIENT_PAYOFF
    http_status: 422
    applies_to: ["POST /promotional-plans/{id}/payoff"]
  - priority: 24
    category: business_fiscal
    check: "the trade-up ticket must reach the declared floor of twice the origin purchase price"
    error_id: ERR_TRADE_UP_FLOOR_NOT_MET
    http_status: 422
    applies_to: ["POST /purchases/{id}/complete"]
  - priority: 25
    category: business_fiscal
    check: "the statement payment must not exceed the sum of the three bucket balances"
    error_id: ERR_STATEMENT_OVERPAYMENT
    http_status: 422
    applies_to: ["POST /billing-statements"]
  - priority: 26
    category: business_referential
    check: "a trade-up credit may only be stamped on the purchase that is the leader of its trade-up console — a purchase already naming an origin_purchase_id, or already TRADE_UP_APPLIED, is a dependent and cannot itself be credited"
    error_id: ERR_TRADE_UP_GUARDIAN_REFERENCE
    http_status: 409
    applies_to: ["POST /purchases/{id}/trade-up-credit"]
  - priority: 27
    category: business_constraint
    check: "stone_code, bundle_code and shop_code are unique across their collections"
    error_id: ERR_DUPLICATE_STONE_CODE
    http_status: 409
    applies_to: ["POST /diamonds", "POST /protection-bundles", "POST /vendor-shops"]
  - priority: 28
    category: state
    check: "the registration acted on must not already be in a terminal coverage_status (TERMINATED or VOID)"
    error_id: ERR_REGISTRATION_TERMINATED
    http_status: 409
    applies_to: ["POST /service-plan-registrations/{id}/exams", "POST /service-plan-registrations/{id}/renew", "POST /service-plan-registrations/{id}/terminate"]
  - priority: 29
    category: business_constraint
    check: "a custom commission's deposit_pct must be at least 0.30 so the stamped deposit covers the shop's release requirement"
    error_id: ERR_INSUFFICIENT_DEPOSIT
    http_status: 422
    applies_to: ["POST /custom-design-orders"]
  - priority: 30
    category: business_constraint
    check: "at most five CAD revisions may be requested on one commission"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /custom-design-orders/{id}/revisions"]
  - priority: 31
    category: business_referential
    check: "a rush routing requires the CONRUSH shop to hold a signed alliance agreement"
    error_id: ERR_VENDOR_AGREEMENT_REQUIRED
    http_status: 422
    applies_to: ["POST /repairs/{id}/route"]
  - priority: 32
    category: business_referential
    check: "an insurance replacement advice requires an issued replacement appraisal on the repair file"
    error_id: ERR_APPRAISAL_REQUIRED
    http_status: 422
    applies_to: ["POST /appraisals/{id}/advise-insurer"]
  - priority: 33
    category: business_safety
    check: "a customer may not be closed while a non-terminal repair, a live registration, or a nonzero outstanding balance remains"
    error_id: ERR_CUSTOMER_ACTIVE_OBLIGATIONS
    http_status: 409
    applies_to: ["POST /customers/{id}/close"]

# =============================================================================
# Response Envelope (FIXED — emitted verbatim per SKILL.md §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
#
# `input:` lists required fields bare and optional fields with a trailing `?`.
# Read endpoints carrying an FK filter use the §1.5 filtered-list form; repair-
# scoped children additionally use the sub-resource form.
# =============================================================================
endpoints:
  # --- Clock (test-driving endpoint, §1.5 priority-ladder rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads the fixed startup default 2026-09-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ChainAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []

  # --- Stores ---
  - method: POST
    path: "/stores"
    description: "Open a store. store_status starts OPEN; activate it before it may sell credit."
    roles: [ChainAdmin]
    code: 201
    input: [store_code, name, state_code, credit_capacity_cents, "credit_enabled?", "store_hold_days?"]
    output: Store
    side_effects: []
  - method: GET
    path: "/stores"
    description: "List stores"
    roles: [ChainAdmin, StoreManager, CreditAnalyst, SalesAssociate, CustomerService]
    code: 200
    input: ["store_status?", "state_code?", "limit?", "offset?"]
    output: Store[]
    side_effects: []
  - method: GET
    path: "/stores/{id}"
    description: "Get a store"
    roles: [ChainAdmin, StoreManager, CreditAnalyst, SalesAssociate, CustomerService]
    code: 200
    input: [""]
    output: Store
    side_effects: []
  - method: POST
    path: "/stores/{id}/activate"
    description: "Move a store from OPEN to ACTIVE"
    roles: [ChainAdmin]
    code: 200
    input: [""]
    output: Store
    side_effects: ["store.store_status = ACTIVE"]
  - method: POST
    path: "/stores/{id}/suspend"
    description: "Suspend a store whose open repair liability has outrun its credit capacity"
    roles: [ChainAdmin]
    code: 200
    input: [""]
    output: Store
    side_effects: ["store.store_status = SUSPENDED", "every CreditApplication of this store with decision_status == PENDING becomes DECLINED"]
  - method: POST
    path: "/stores/{id}/reinstate"
    description: "Reinstate a suspended store once its liability is back inside capacity"
    roles: [ChainAdmin]
    code: 200
    input: [""]
    output: Store
    side_effects: ["store.store_status = ACTIVE"]

  - method: GET
    path: "/vendor-shops/{id}/repairs"
    description: "List the repairs routed to a bench shop"
    roles: [ChainAdmin, StoreManager, CustomerService]
    code: 200
    input: []
    output: Repair[]
    side_effects: []
  - method: GET
    path: "/repairs/{id}/payoff-ledger-entries"
    description: "List the ledger entries written from a repair file"
    roles: [ChainAdmin, CreditAnalyst, StoreManager, CustomerService]
    code: 200
    input: []
    output: PayoffLedgerEntry[]
    side_effects: []

  # --- Credit limit registry ---
  - method: POST
    path: "/credit-limit-registry-state"
    description: "Register a risk-registry pricing row for one (registry_key, credit_tier)"
    roles: [ChainAdmin]
    code: 201
    input: [registry_key, credit_tier, base_limit_cents, min_down_payment_pct, registry_type, "min_ticket_cents?", "all_states_key?"]
    output: CreditLimitRegistryState
    side_effects: []
  - method: GET
    path: "/credit-limit-registry-state"
    description: "List risk-registry pricing rows"
    roles: [ChainAdmin, CreditAnalyst, StoreManager]
    code: 200
    input: ["registry_key?", "credit_tier?", "registry_type?", "limit?", "offset?"]
    output: CreditLimitRegistryState[]
    side_effects: []

  # --- Service plan regulations ---
  - method: POST
    path: "/service-plan-regulations"
    description: "Register a state's lifetime-plan terms. Absence of the row for a store's state voids registrations rather than defaulting them."
    roles: [ChainAdmin]
    code: 201
    input: [state_code, max_plan_term_months, inspection_required_months, lapse_cure_days, replacement_plus_pct, "max_inspection_gap_days?"]
    output: ServicePlanRegulation
    side_effects: []
  - method: GET
    path: "/service-plan-regulations"
    description: "List state lifetime-plan terms"
    roles: [ChainAdmin, StoreManager, CreditAnalyst, CustomerService]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: ServicePlanRegulation[]
    side_effects: []

  # --- Vendor shops ---
  - method: POST
    path: "/vendor-shops"
    description: "Register a bench shop. shop_code equals the value stored in Repair.vendor_shop_code."
    roles: [ChainAdmin]
    code: 201
    input: [shop_code, shop_name, base_turnaround_days, "rush_surcharge_cents?"]
    output: VendorShop
    side_effects: []
  - method: GET
    path: "/vendor-shops"
    description: "List bench shops"
    roles: [ChainAdmin, StoreManager, CustomerService]
    code: 200
    input: ["vendor_status?", "limit?", "offset?"]
    output: VendorShop[]
    side_effects: []

  # --- Protection bundles ---
  - method: POST
    path: "/protection-bundles"
    description: "Register a bundled lifetime protection offering"
    roles: [ChainAdmin]
    code: 201
    input: [bundle_code, display_name, lifetime_plan_fee_cents, stone_limit_labor_cents, stone_limit_parts_cents, "inspection_interval_days?", "inspection_cure_days?"]
    output: ProtectionBundle
    side_effects: []
  - method: GET
    path: "/protection-bundles"
    description: "List protection bundles"
    roles: [ChainAdmin, StoreManager, SalesAssociate, CustomerService]
    code: 200
    input: ["bundle_status?", "limit?", "offset?"]
    output: ProtectionBundle[]
    side_effects: []
  - method: POST
    path: "/protection-bundles/{id}/retire"
    description: "Retire a bundle so it can no longer be attached to new registrations"
    roles: [ChainAdmin]
    code: 200
    input: [""]
    output: ProtectionBundle
    side_effects: ["protection_bundle.bundle_status = RETIRED"]

  # --- Customers ---
  - method: POST
    path: "/customers"
    description: "Create a customer record. account_status starts NO_FILE and credit_tier starts NO_FILE."
    roles: [SalesAssociate, CustomerService, ChainAdmin]
    code: 201
    input: [full_name, email, state_code, "phone?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [ChainAdmin, StoreManager, CreditAnalyst, SalesAssociate, CustomerService]
    code: 200
    input: ["state_code?", "account_status?", "credit_tier?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [ChainAdmin, StoreManager, CreditAnalyst, SalesAssociate, CustomerService]
    code: 200
    input: [""]
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/reinstate"
    description: "Lift a suspended credit account once no plan of the customer is DEFAULTED"
    roles: [CreditAnalyst]
    code: 200
    input: [""]
    output: Customer
    side_effects: ["customer.account_status = OPEN", "customer.standalone_credit_limit_cents restored from the registry row of the most recent APPROVED application", "recompute credit_tier_from_plan_mix_and_inspection_streak"]
  - method: POST
    path: "/customers/{id}/close"
    description: "Close a customer account that carries no balance and no live service obligations"
    roles: [CustomerService]
    code: 200
    input: [""]
    output: Customer
    side_effects: ["customer.account_status = CLOSED", "every ACTIVE ServicePlanRegistration of this customer becomes TERMINATED", "every PENDING CreditApplication of this customer becomes DECLINED"]

  # --- Credit applications ---
  - method: POST
    path: "/credit-applications"
    description: "Take a counter credit application. The instant decision runs against the risk-registry row and stamps the down-payment minimum."
    roles: [SalesAssociate, CustomerService]
    code: 201
    input: [customer_id, store_id, requested_limit_cents, requested_purchase_amount_cents, "down_payment_cents?", "declared_annual_income_cents?"]
    output: CreditApplication
    side_effects: ["credit_application.policy_tier = credit_limit_registry_pricing tier", "decision_status = PENDING", "expires_at = now + DECISION_VALIDITY_HOURS"]
  - method: GET
    path: "/credit-applications"
    description: "List credit applications"
    roles: [ChainAdmin, CreditAnalyst, StoreManager, SalesAssociate, CustomerService]
    code: 200
    input: ["customer_id?", "store_id?", "decision_status?", "limit?", "offset?"]
    output: CreditApplication[]
    side_effects: []
  - method: GET
    path: "/credit-applications/{id}"
    description: "Get a credit application"
    roles: [ChainAdmin, CreditAnalyst, StoreManager, SalesAssociate, CustomerService]
    code: 200
    input: [""]
    output: CreditApplication
    side_effects: []
  - method: POST
    path: "/credit-applications/{id}/decision"
    description: "Record the instant decision for a pending application"
    roles: [CreditAnalyst]
    code: 200
    input: [decision]
    output: CreditApplication
    side_effects: ["credit_limit_registry_pricing recomputed and stamped", "customer credit tier and limit updated on APPROVE_FULL", "down-payment shortfall recomputed", "credit_application.version += 1"]
  - method: POST
    path: "/credit-applications/{id}/accept"
    description: "Customer accepts a countered offer, promoting the application to APPROVED"
    roles: [Customer]
    code: 200
    input: [""]
    output: CreditApplication
    side_effects: ["credit_application.decision_status = APPROVED", "customer.account_status = OPEN", "customer.standalone_credit_limit_cents = approved_limit_cents"]
  - method: POST
    path: "/credit-applications/{id}/decline-counter"
    description: "Customer declines a countered offer, closing the application"
    roles: [Customer]
    code: 200
    input: [""]
    output: CreditApplication
    side_effects: ["credit_application.decision_status = DECLINED"]
  - method: POST
    path: "/credit-applications/expire-due"
    description: "Batch sweep: expire every PENDING or COUNTERED application past its validity instant"
    roles: [CreditAnalyst]
    code: 200
    input: [""]
    output: { expired_count: integer, expired_application_ids: string }
    side_effects: ["every due CreditApplication.decision_status = EXPIRED"]

  # --- Promotional plans ---
  - method: POST
