  # =======================================================================
  # SECTION 4 - Validations
  # =======================================================================
  - section: validations
    instances:
      - name: auth_then_role_then_payload_ladder_rejects_missing_auth_and_invalid_role_before_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=7]
        distinguishing_aspect: "One endpoint and one deliberately malformed payload are fired four times with different identities, so the only thing that changes the error is the position in the ladder: 401 missing, 401 unknown, 403 not permitted, then finally 400."
        test_recipe:
          setup:
            - "Empty database; no rows are needed because every call is rejected before it reaches the handler"
            - "The malformed payload omits the required market_radius_miles field on POST /plants"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: MISSING_HEADERS
              captures: { e1: "$.data.error_id" }
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: KilnForeman
              as_user_id: "who-001"
              captures: { e2: "$.data.error_id" }
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { e3: "$.data.error_id" }
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { e4: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "Call 1 sends neither X-User-Role nor X-User-ID: ${e1} == ERR_MISSING_AUTH_HEADERS with HTTP 401, even though the payload is also invalid"
            - "Call 2 sends X-User-Role: KilnForeman, which is not one of the eight declared roles: ${e2} == ERR_UNKNOWN_ROLE with HTTP 401"
            - "Call 3 sends a declared but unauthorised role: ${e3} == ERR_ROLE_NOT_PERMITTED with HTTP 403 - still not the payload error"
            - "Call 4 sends the authorised role: ${e4} == ERR_INVALID_REQUEST with HTTP 400, now that nothing higher in the ladder fires"
            - "All four responses carry response_type error with a non-empty ${msg} and the standard meta block"
            - "No Plant row exists afterwards: GET /plants returns total_count == 0"

      - name: clay_reserve_check_covers_every_pit_before_any_pit_is_mutated
        claim_type: cascading_validation
        grounds:
          - validations[priority=44]
          - calculations.clay_tonnage_commitment
        distinguishing_aspect: "The first pit has ample reserve and the second does not; because the reserve test is a pre-pass over ALL contributing pits, the sufficient pit must be left completely untouched rather than committed and then rolled back inconsistently."
        test_recipe:
          setup:
            - "Pit A (CLAY) with proven_reserve_tons 5000.00 and pit B (SHALE) with only 10.00 tons"
            - "Formulation F1 QUALIFIED at 50/50, clay_tons_per_thousand_units 3.20"
