- section: cross_cutting_complexity_layers
  instances:
  - name: stale_expected_package_version_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[release-create-stale-package]
    - validations[priority=55]
    - errors[ERR_STALE_PACKAGE_VERSION]
    - endpoints[POST /fabrication-releases]
    distinguishing_aspect: 'A release cannot be guarded by state alone - a second release for the same zone is legitimate
      - so the writer must prove a current view of the package: an expected_package_version one behind the stored value
      returns ERR_STALE_PACKAGE_VERSION (412) with nothing written, and the freshly read value succeeds.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; qualified UNITIZED package with an APPROVED submittal, a received glass order
        and zone z1
      setup_api_calls:
