      - name: audit_visit_scheduling_is_conditional_on_the_window_being_free
        claim_type: Conditional action
        grounds:
          - endpoints[POST /product-safety/audit-visits]
          - validations[19]
          - errors.ERR_AUDIT_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: audit_visit_half_open_window_plus_travel_buffer_conflicts_at_same_retailer
          rationale: |
            The only genuinely conditional scheduling action in §1.5 is the audit
            window, and both of its interesting sides are already owned by §1.8: that
            resource_temporal_overlap instance pins the half-open plus 24h-buffer
            rejection across two recalls at one retailer, and
            audit_window_starting_exactly_at_the_24h_buffer_edge_is_accepted pins the
            acceptance at the exact edge. The remaining conditional gates on the same
            endpoint (notification state, stop-sale posture) are covered by the
            Validations instances above.

