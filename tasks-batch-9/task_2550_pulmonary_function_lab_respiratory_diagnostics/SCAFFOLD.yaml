scenario: |
  Generate task harder than expert level!

  2550. Pulmonary Function Lab & Respiratory Diagnostics (hospital pulmonary function laboratory): test ordering with indication validation and pre-test medication hold instructions, equipment calibration, biologic control testing and daily quality checks, test acceptability and repeatability criteria with technologist coaching notes, reference equation selection and interpretation templating, bronchodilator response and challenge testing safety protocols with rescue medication readiness, infection control between patients including filter and disinfection cycles, interpreting physician assignment and report turnaround, disability and occupational testing chain-of-custody requirements

domain_name: pulmonary-function-lab
api_prefix: "/pft-lab"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Density, not volume. The lab's regulatory surface (ATS/ERS acceptability, daily biologic
    control QC, chain-of-custody for disability testing, rescue-medication readiness) is
    modelled as one tightly-coupled graph: a single failing biologic control event on a device
    unwinds sessions, orders and challenge runs four hops away, while the same numeric inputs
    yield different QC verdicts and different bronchodilator verdicts depending on which
    equally-valid algorithm the scaffold pins for that context.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Device
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: device_code
        type: string
        source: input
        description: "Lab asset tag for the diagnostic device; unique across Device"
        constraints: "non-empty, unique; ERR_DUPLICATE_IDENTIFIER on collision"
      - name: modality
        type: enum
        source: input
        description: "Which pulmonary measurement the device performs"
        constraints: "one of SPIROMETRY, DLCO, PLETHYSMOGRAPHY"
      - name: status
        type: enum
        source: system
        description: "Service posture gating every TestSession created against this device"
        default: NEW
        constraints: "one of NEW, AVAILABLE, SOILED, QUARANTINED"
      - name: last_calibration_at
        type: datetime
        source: system
        description: "performed_at of the most recent DeviceQualityEvent with event_type VOLUME_CALIBRATION and outcome PASS on this device; null until one exists"
      - name: last_calibration_error_pct
        type: number
        source: system
        description: "error_pct of the most recent VOLUME_CALIBRATION event on this device (PASS or FAIL); null until one exists"
      - name: last_biologic_control_date
        type: string
        source: system
        description: "UTC calendar date (YYYY-MM-DD) of the most recent DeviceQualityEvent with event_type BIOLOGIC_CONTROL and outcome in {PASS, WARN} on this device; null until one exists"
      - name: consecutive_biologic_failures
        type: integer
        source: system
        description: "Count of BIOLOGIC_CONTROL events with outcome FAIL since the last one with outcome PASS on this device"
        default: 0
      - name: last_session_end_at
        type: datetime
        source: system
        description: "scheduled_end_at of the most recent TestSession on this device that left session_status SCHEDULED or IN_PROGRESS (i.e. reached ACCEPTED, REJECTED, REPORTED or ABORTED); null until one exists"
      - name: current_filter_serial
        type: string
        source: system
        description: "filter_serial of the most recent DeviceQualityEvent with event_type FILTER_REPLACEMENT on this device; null until one exists"
      - name: sessions_since_filter_change
        type: integer
        source: system
        description: "Count of TestSessions that reached ACCEPTED, REJECTED or REPORTED on this device since the most recent FILTER_REPLACEMENT event"
        default: 0
      - name: quarantined_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status last became QUARANTINED; null while status is not QUARANTINED"
      - name: quarantine_reason
        type: string
        source: system
        description: "One of CALIBRATION_FAILED or BIOLOGIC_CONTROL_FAILED; null while status is not QUARANTINED"
      - name: quarantine_trigger_staff_id
        type: string
        source: system
        description: "FK -> Staff.id; the performed_by_staff_id of the DeviceQualityEvent whose FAIL outcome quarantined the device; null while status is not QUARANTINED"

  - name: DeviceQualityEvent
    parent: Device
    common_fields: false
    entity_kind: event
    fields:
      - name: device_id
        type: string
        source: system
        description: "FK -> Device.id; taken from the {device_id} path segment"
      - name: event_type
        type: enum
        source: input
        description: "Which quality procedure this append-only row records"
        constraints: "one of VOLUME_CALIBRATION, LEAK_CHECK, BIOLOGIC_CONTROL, FILTER_REPLACEMENT, HIGH_LEVEL_DISINFECT"
      - name: performed_by_staff_id
        type: string
        source: system
        description: "FK -> Staff.id; taken from the acting Technologist's X-User-ID header"
      - name: subject_staff_id
        type: string
        source: input
        description: "FK -> Staff.id; the biologic control subject whose established baseline this measurement is compared against. Required when event_type is BIOLOGIC_CONTROL, forbidden otherwise"
      - name: measured_volume_l
        type: number
        source: input
        description: "Uncorrected volume read back from the 3.000 L calibration syringe, litres. Required when event_type is VOLUME_CALIBRATION"
      - name: ambient_temp_c
        type: integer
        source: input
        description: "Ambient temperature at the device in whole degrees Celsius. Required when event_type is VOLUME_CALIBRATION or LEAK_CHECK"
        constraints: "integer in [20, 27]; ERR_AMBIENT_OUT_OF_RANGE otherwise"
      - name: barometric_pressure_kpa
        type: number
        source: input
        description: "Station barometric pressure in kPa. Required when event_type is VOLUME_CALIBRATION or LEAK_CHECK"
        constraints: "number in [80.00, 110.00]"
      - name: measured_fev1_l
        type: number
        source: input
        description: "Biologic control subject's measured FEV1 in litres. Required when event_type is BIOLOGIC_CONTROL"
      - name: measured_fvc_l
        type: number
        source: input
        description: "Biologic control subject's measured FVC in litres. Required when event_type is BIOLOGIC_CONTROL"
      - name: filter_serial
        type: string
        source: input
        description: "Serial of the bacterial/viral filter fitted. Required when event_type is FILTER_REPLACEMENT"
        constraints: "must differ from Device.current_filter_serial; ERR_FILTER_SERIAL_REUSED otherwise"
      - name: dwell_minutes
        type: integer
        source: input
        description: "Wet contact time of the high-level disinfectant in whole minutes. Required when event_type is HIGH_LEVEL_DISINFECT"
      - name: btps_factor
        type: number
        source: computed
        description: "BTPS correction factor per calculations.calibration_btps_error, 4 decimal places; null unless event_type is VOLUME_CALIBRATION"
      - name: corrected_volume_l
        type: number
        source: computed
        description: "measured_volume_l * btps_factor rounded to 3 decimal places; null unless event_type is VOLUME_CALIBRATION"
      - name: error_pct
        type: number
        source: computed
        description: "Signed calibration error percent per calculations.calibration_btps_error, 2 decimal places; null unless event_type is VOLUME_CALIBRATION"
      - name: deviation_pct
        type: number
        source: computed
        description: "Absolute biologic control deviation percent per calculations.biologic_control_deviation, 2 decimal places; null unless event_type is BIOLOGIC_CONTROL"
      - name: deviation_variant
        type: enum
        source: computed
        description: "Which variant of calculations.biologic_control_deviation produced deviation_pct"
        constraints: "one of ABSOLUTE_BASELINE, ROLLING_MEAN; null unless event_type is BIOLOGIC_CONTROL"
      - name: rolling_mean_fev1_l
        type: number
        source: computed
        description: "Mean of the 3 most recent qualifying prior BIOLOGIC_CONTROL measured_fev1_l values used by the ROLLING_MEAN variant, 3 decimal places; null when deviation_variant is ABSOLUTE_BASELINE"
      - name: outcome
        type: enum
        source: computed
        description: "Verdict of this quality procedure"
        constraints: "one of PASS, WARN, FAIL, COMPLETE, INCOMPLETE"
      - name: failure_reason
        type: string
        source: computed
        description: "One of CAL_TOLERANCE_EXCEEDED, BCS_DEVIATION_EXCEEDED, DWELL_TIME_SHORT; null when outcome is PASS, WARN or COMPLETE"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which this event row was appended"
      - name: note
        type: string
        source: input
        description: "Free-text technologist remark; optional for every event_type"

  - name: Staff
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: employee_code
        type: string
        source: input
        description: "Payroll identifier; unique across Staff"
        constraints: "non-empty, unique; ERR_DUPLICATE_IDENTIFIER on collision"
      - name: full_name
        type: string
        source: input
        description: "Display name printed on reports and chain-of-custody records"
      - name: role_type
        type: enum
        source: input
        description: "Which X-User-Role header this Staff row may authenticate as"
        constraints: "one of TECHNOLOGIST, ORDERING_PHYSICIAN, INTERPRETING_PHYSICIAN"
      - name: credential
        type: enum
        source: input
        description: "Highest pulmonary credential held"
        constraints: "one of CPFT, RPFT, MD"
      - name: competency_expires_on
        type: string
        source: input
        description: "UTC calendar date (YYYY-MM-DD) on which annual competency lapses; the last valid day is this date inclusive"
      - name: credentialed_modalities
        type: array
        source: input
        description: "Device modalities this Staff row may operate or interpret; subset of {SPIROMETRY, DLCO, PLETHYSMOGRAPHY}"
        constraints: "non-empty array of distinct modality enum values"
      - name: status
        type: enum
        source: input
        description: "Duty posture; only ON_DUTY Staff enter the interpreter candidate pool"
        default: ON_DUTY
        constraints: "one of ON_DUTY, OFF_DUTY"
      - name: max_concurrent_reports
        type: integer
        source: input
        description: "Interpreter capacity used by both the candidate filter and the SLA load tier"
        default: 1
        constraints: "integer >= 1"
      - name: is_biologic_control
        type: boolean
        source: input
        description: "True when this Staff row serves as a biologic control subject for daily QC"
        default: false
      - name: baseline_fev1_l
        type: number
        source: input
        description: "Established biologic control baseline FEV1 in litres; required when is_biologic_control is true"
      - name: baseline_fvc_l
        type: number
        source: input
        description: "Established biologic control baseline FVC in litres; required when is_biologic_control is true"
      - name: baseline_established_on
        type: string
        source: input
        description: "UTC calendar date (YYYY-MM-DD) the baseline was established; required when is_biologic_control is true. Drives the ABSOLUTE_BASELINE vs ROLLING_MEAN variant choice"
      - name: open_report_count
        type: integer
        source: computed
        description: "Count of InterpretationReport rows with interpreter_staff_id equal to this Staff id and status in {ASSIGNED, AMENDED}; recomputed on every report assignment, sign, amend and supersede"
        default: 0

  - name: Patient
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number; unique across Patient"
        constraints: "non-empty, unique; ERR_DUPLICATE_IDENTIFIER on collision"
      - name: full_name
        type: string
        source: input
        description: "Patient display name"
      - name: birth_date
        type: string
        source: input
        description: "UTC calendar date (YYYY-MM-DD) of birth; drives age_years and therefore reference equation eligibility"
      - name: sex
        type: enum
        source: input
        description: "Biological sex used by reference equation sex_scope matching"
        constraints: "one of MALE, FEMALE"
      - name: height_cm
        type: number
        source: input
        description: "Standing height in centimetres, the dominant regressor of every predicted value"
        constraints: "number in [90.0, 220.0]"
      - name: weight_kg
        type: number
        source: input
        description: "Body weight in kilograms; recorded for the report header only"
        constraints: "number in [10.0, 300.0]"
      - name: smoking_status
        type: enum
        source: input
        description: "Smoking history printed in the interpretation template"
        constraints: "one of NEVER, FORMER, CURRENT"
      - name: age_years
        type: integer
        source: computed
        description: "Completed whole years from birth_date to the current logical clock date, per calculations.reference_equation_selection_and_predicted_values"
      - name: completed_order_count
        type: integer
        source: system
        description: "Count of TestOrder rows for this patient whose status is COMPLETED"
        default: 0

  - name: ReferenceEquationSet
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: equation_code
        type: string
        source: input
        description: "Published equation identifier, e.g. GLI_2012_CAUCASIAN or NHANES_III"
        constraints: "non-empty; creating a second ACTIVE set with the same equation_code supersedes the prior one"
      - name: modality_scope
        type: array
        source: input
        description: "Device modalities this set may be selected for; subset of {SPIROMETRY, DLCO, PLETHYSMOGRAPHY}"
        constraints: "non-empty array of distinct modality enum values"
      - name: sex_scope
        type: enum
        source: input
        description: "Patient sex this set applies to"
        constraints: "one of MALE, FEMALE, ANY"
      - name: applicable_age_min
        type: integer
        source: input
        description: "Youngest Patient.age_years this set covers, inclusive"
      - name: applicable_age_max
        type: integer
        source: input
        description: "Oldest Patient.age_years this set covers, inclusive"
      - name: lln_percentile
        type: number
        source: input
        description: "Published lower-limit-of-normal percentile, e.g. 5.0; the secondary ranking key of the selector"
      - name: ratio_lln
        type: number
        source: input
        description: "Lower limit of normal for the FEV1/FVC ratio, e.g. 0.700; drives the interpretation pattern decision table"
      - name: a_fev1
        type: number
        source: input
        description: "Intercept (litres) of the predicted FEV1 regression"
      - name: b_fev1
        type: number
        source: input
        description: "Height coefficient (litres per cm) of the predicted FEV1 regression"
      - name: c_fev1
        type: number
        source: input
        description: "Age coefficient (litres per decade, subtracted) of the predicted FEV1 regression"
      - name: a_fvc
        type: number
        source: input
        description: "Intercept (litres) of the predicted FVC regression"
      - name: b_fvc
        type: number
        source: input
        description: "Height coefficient (litres per cm) of the predicted FVC regression"
      - name: c_fvc
        type: number
        source: input
        description: "Age coefficient (litres per decade, subtracted) of the predicted FVC regression"
      - name: rsd_frac
        type: number
        source: input
        description: "Residual standard deviation expressed as a fraction of the predicted value, e.g. 0.130"
      - name: bd_criterion
        type: enum
        source: input
        description: "Which bronchodilator-response variant sessions bound to this set must use"
        constraints: "one of PCT_BASELINE_2005, PCT_PREDICTED_2021"
      - name: status
        type: enum
        source: system
        description: "Publication posture; only ACTIVE sets enter the selector candidate pool"
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED"

  - name: RescueMedicationLot
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: lot_number
        type: string
        source: input
        description: "Manufacturer lot number; unique across RescueMedicationLot"
        constraints: "non-empty, unique; ERR_DUPLICATE_IDENTIFIER on collision"
      - name: drug
        type: enum
        source: input
        description: "Rescue bronchodilator presentation held in this lot"
        constraints: "one of ALBUTEROL_MDI, ALBUTEROL_NEB"
      - name: doses_at_receipt
        type: integer
        source: input
        description: "Immutable dose count at receipt; the conserved total of the rescue-dose ledger invariant"
        constraints: "integer >= 0"
      - name: doses_remaining
        type: integer
        source: system
        description: "Doses physically left in the lot; initialised to doses_at_receipt and decremented only when rescue is actually administered"
      - name: doses_reserved
        type: integer
        source: system
        description: "Doses held against ChallengeRun rows whose status is ARMED or IN_PROGRESS; equals RESCUE_RESERVE_DOSES times that count"
        default: 0
      - name: expires_on
        type: string
        source: input
        description: "UTC calendar date (YYYY-MM-DD) of lot expiry; the last usable day is this date inclusive"
      - name: status
        type: enum
        source: system
        description: "Stock posture consulted by the rescue-readiness gate"
        default: STOCKED
        constraints: "one of STOCKED, EXPIRED, DEPLETED"

  - name: TestOrder
    parent: Patient
    common_fields: true
    entity_kind: resource
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the subject of the ordered testing"
      - name: ordering_staff_id
        type: string
        source: system
        description: "FK -> Staff.id; taken from the acting OrderingPhysician's X-User-ID header"
      - name: indication_code
        type: enum
        source: input
        description: "Clinical reason for testing, validated against APPROVED_INDICATION_MODALITIES at submit"
        constraints: "one of DYSPNEA_EVALUATION, ASTHMA_DIAGNOSIS, COPD_STAGING, PREOP_ASSESSMENT, DISABILITY_ASSESSMENT, OCCUPATIONAL_SURVEILLANCE_ANNUAL, RESTRICTIVE_DISEASE_EVALUATION"
      - name: requested_modalities
        type: array
        source: input
        description: "Modalities to be performed; subset of {SPIROMETRY, DLCO, PLETHYSMOGRAPHY}"
        constraints: "non-empty array of distinct modality enum values"
      - name: test_context
        type: enum
        source: input
        description: "Administrative context that decides chain-of-custody applicability and the report SLA base"
        constraints: "one of ROUTINE_CLINICAL, DISABILITY_EVALUATION, OCCUPATIONAL_SURVEILLANCE"
      - name: bronchodilator_requested
        type: boolean
        source: input
        description: "True when post-bronchodilator spirometry is ordered"
        default: false
      - name: challenge_type
        type: enum
        source: input
        description: "Bronchoprovocation agent ordered, if any"
        default: NONE
        constraints: "one of NONE, METHACHOLINE, MANNITOL"
      - name: current_medication_classes
        type: array
        source: input
        description: "Respiratory medication classes the patient is taking; each one requires a MedicationHold before testing"
        default: []
        constraints: "array of distinct values from {SABA, SAMA, LABA, LAMA, ICS_LABA, ANTIHISTAMINE, CAFFEINE}"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, INDICATION_REJECTED, MED_HOLD_ISSUED, READY, IN_TESTING, COMPLETED, CANCELLED"
      - name: rejection_reason
        type: string
        source: system
        description: "One of MODALITY_NOT_APPROVED_FOR_INDICATION or CHALLENGE_INDICATION_MISMATCH; set when status becomes INDICATION_REJECTED, cleared to null on revision"
      - name: hold_release_at
        type: datetime
        source: computed
        description: "Earliest instant at which testing may begin, per calculations.medication_hold_release; null while no MedicationHold with status in {PENDING, ATTESTED} exists"
      - name: abort_count
        type: integer
        source: system
        description: "Count of TestSession rows for this order that reached ABORTED"
        default: 0
      - name: cancellation_reason
        type: string
        source: input
        description: "Operator-supplied reason recorded when status becomes CANCELLED; null otherwise"

  - name: MedicationHold
    parent: TestOrder
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> TestOrder.id; taken from the {order_id} path segment"
      - name: medication_class
        type: enum
        source: input
        description: "Respiratory medication class this hold instruction covers"
        constraints: "one of SABA, SAMA, LABA, LAMA, ICS_LABA, ANTIHISTAMINE, CAFFEINE"
      - name: required_hold_hours
        type: integer
        source: computed
        description: "Withholding window in whole hours read from HOLD_HOURS_BY_CLASS for medication_class"
      - name: instructed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the hold instruction was issued"
      - name: release_at
        type: datetime
        source: computed
        description: "instructed_at plus required_hold_hours hours"
      - name: attestation_result
        type: enum
        source: input
        description: "What the patient reported at check-in"
        constraints: "one of WITHHELD, TAKEN; supplied only on the attest endpoint"
      - name: attested_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the attestation was recorded; null while status is PENDING or SUPERSEDED-without-attestation"
      - name: status
        type: enum
        source: system
        description: "Hold lifecycle state"
        default: PENDING
        constraints: "one of PENDING, ATTESTED, VIOLATED, SUPERSEDED"

  - name: TestSession
    parent: TestOrder
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> TestOrder.id; the order being executed"
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; the device occupied by this session"
      - name: technologist_staff_id
        type: string
        source: system
        description: "FK -> Staff.id; taken from the acting Technologist's X-User-ID header"
      - name: reference_equation_id
        type: string
        source: computed
        description: "FK -> ReferenceEquationSet.id; pinned at creation by the selector in calculations.reference_equation_selection_and_predicted_values and never re-selected afterwards"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Start of the device occupancy interval"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "End of the device occupancy interval; must be strictly after scheduled_start_at"
      - name: session_status
        type: enum
        source: system
        description: "Execution dimension of this session's parallel state machine"
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_PROGRESS, ACCEPTED, REJECTED, REPORTED, ABORTED"
      - name: custody_status
        type: enum
        source: system
        description: "Chain-of-custody dimension of this session's parallel state machine; evolves independently of session_status"
        constraints: "one of NOT_APPLICABLE, CUSTODY_OPEN, CUSTODY_ID_VERIFIED, CUSTODY_SEALED, CUSTODY_BROKEN; initialised to NOT_APPLICABLE when TestOrder.test_context is ROUTINE_CLINICAL and to CUSTODY_OPEN otherwise"
      - name: reference_equation_code
        type: string
        source: computed
        description: "equation_code snapshot of the selected ReferenceEquationSet taken at session creation; survives later supersession of that set"
      - name: predicted_fev1_l
        type: number
        source: computed
        description: "Predicted FEV1 in litres, 3 decimal places, pinned at session creation from the selected equation and the patient's height_cm and age_years"
      - name: predicted_fvc_l
        type: number
        source: computed
        description: "Predicted FVC in litres, 3 decimal places, pinned at session creation"
      - name: lln_fev1_l
        type: number
        source: computed
        description: "Lower limit of normal for FEV1 in litres, 3 decimal places, pinned at session creation"
      - name: ratio_lln
        type: number
        source: computed
        description: "ratio_lln snapshot of the selected ReferenceEquationSet taken at session creation; the pattern decision table compares fev1_fvc_ratio against this value, so a later SUPERSEDED equation cannot re-interpret an old session"
      - name: best_fev1_l
        type: number
        source: computed
        description: "Largest fev1_l among this session's PRE_BD maneuvers whose acceptability is ACCEPTABLE or USABLE_FEV1_ONLY; null until one exists"
      - name: best_fvc_l
        type: number
        source: computed
        description: "Largest fvc_l among this session's PRE_BD maneuvers whose acceptability is ACCEPTABLE; USABLE_FEV1_ONLY maneuvers are excluded. Null until one exists"
      - name: best_fev1_post_l
        type: number
        source: computed
        description: "Largest fev1_l among this session's POST_BD maneuvers whose acceptability is ACCEPTABLE or USABLE_FEV1_ONLY; null until one exists"
      - name: acceptable_maneuver_count
        type: integer
        source: computed
        description: "Count of this session's PRE_BD maneuvers whose acceptability is ACCEPTABLE"
        default: 0
      - name: repeatability_delta_ml
        type: integer
        source: computed
        description: "Whole millilitres between the largest and second-largest eligible PRE_BD fev1_l; null while fewer than two eligible maneuvers exist"
      - name: fvc_repeatability_delta_ml
        type: integer
        source: computed
        description: "Whole millilitres between the largest and second-largest ACCEPTABLE PRE_BD fvc_l; null while fewer than two ACCEPTABLE maneuvers exist"
      - name: quality_grade
        type: enum
        source: computed
        description: "ATS/ERS quality grade recomputed after every maneuver, per calculations.maneuver_acceptability_and_session_quality"
        default: F
        constraints: "one of A, B, C, D, F"
      - name: fev1_pct_predicted
        type: number
        source: computed
        description: "best_fev1_l divided by predicted_fev1_l as a percent, 1 decimal place; null while best_fev1_l is null"
      - name: fvc_pct_predicted
        type: number
        source: computed
        description: "best_fvc_l divided by predicted_fvc_l as a percent, 1 decimal place; null while best_fvc_l is null"
      - name: fev1_fvc_ratio
        type: number
        source: computed
        description: "best_fev1_l divided by best_fvc_l, 3 decimal places; null while either is null"
      - name: bd_response_pct
        type: number
        source: computed
        description: "Bronchodilator response percent, 1 decimal place, per the variant named by the selected equation's bd_criterion; null unless the order requested bronchodilator and a POST_BD best exists"
      - name: bd_response_ml
        type: integer
        source: computed
        description: "Whole millilitres of FEV1 gain from best_fev1_l to best_fev1_post_l; null under the same condition as bd_response_pct"
      - name: bd_response_variant
        type: enum
        source: computed
        description: "Which bronchodilator variant produced bd_response_pct"
        constraints: "one of PCT_BASELINE_2005, PCT_PREDICTED_2021; null when bd_response_pct is null"
      - name: bd_response_positive
        type: boolean
        source: computed
        description: "Variant-specific positivity verdict; null when bd_response_pct is null"
      - name: rejection_round
        type: integer
        source: system
        description: "Count of times finalize-quality has left this session REJECTED"
        default: 0
      - name: abort_reason
        type: string
        source: system
        description: "One of DEVICE_QUARANTINED, ORDER_CANCELLED or CHALLENGE_SAFETY_ABORT; null while session_status is not ABORTED"
      - name: turnaround_minutes
        type: integer
        source: computed
        description: "Whole minutes from the InterpretationReport's assigned_at to its signed_at, copied onto the session when session_status becomes REPORTED; null before that"
      - name: technologist_comment
        type: string
        source: input
        description: "Free-text technologist remark supplied on POST finalize-quality; null until the session is finalized"

  - name: Maneuver
    parent: TestSession
    common_fields: false
    entity_kind: event
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> TestSession.id; taken from the {session_id} path segment"
      - name: maneuver_index
        type: integer
        source: system
        description: "1-based append order of this maneuver within its session, assigned by the server"
      - name: phase
        type: enum
        source: input
        description: "Which limb of the test this effort belongs to"
        constraints: "one of PRE_BD, POST_BD, CHALLENGE_BASELINE, POST_CHALLENGE"
      - name: fvc_l
        type: number
        source: input
        description: "Forced vital capacity of this effort, litres"
        constraints: "number in (0, 10.000]"
      - name: fev1_l
        type: number
        source: input
        description: "Forced expiratory volume in 1 second of this effort, litres"
        constraints: "number in (0, 10.000], must be <= fvc_l"
      - name: pef_l_s
        type: number
        source: input
        description: "Peak expiratory flow of this effort, litres per second"
      - name: back_extrapolated_volume_ml
        type: integer
        source: input
        description: "Back-extrapolated volume in whole millilitres, the start-of-test acceptability criterion"
      - name: expiratory_time_s
        type: number
        source: input
        description: "Forced expiratory time in seconds, the end-of-forced-expiration acceptability criterion"
      - name: plateau_reached
        type: boolean
        source: input
        description: "True when a volume plateau of at least 1 second was observed"
      - name: cough_in_first_second
        type: boolean
        source: input
        description: "True when cough contaminated the first second of the effort"
      - name: glottic_closure
        type: boolean
        source: input
        description: "True when glottic closure or an early termination artifact was observed"
      - name: acceptability
        type: enum
        source: computed
        description: "Per-maneuver verdict from calculations.maneuver_acceptability_and_session_quality"
        constraints: "one of ACCEPTABLE, USABLE_FEV1_ONLY, UNACCEPTABLE"
      - name: bev_limit_ml
        type: integer
        source: computed
        description: "Back-extrapolated volume allowance for this effort, the greater of BEV_ABS_ML and 5 percent of fvc_l in millilitres"
      - name: rejection_reasons
        type: array
        source: computed
        description: "Subset of {BEV_EXCEEDED, EARLY_TERMINATION, COUGH_ARTIFACT, GLOTTIC_CLOSURE} explaining a non-ACCEPTABLE verdict; empty array when acceptability is ACCEPTABLE"
      - name: coaching_note
        type: string
        source: input
        description: "Technologist coaching remark; required whenever the computed acceptability is UNACCEPTABLE"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which this maneuver row was appended"

  - name: ChallengeRun
    parent: TestSession
    common_fields: true
    entity_kind: resource
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> TestSession.id; taken from the {session_id} path segment"
      - name: rescue_lot_id
        type: string
        source: input
        description: "FK -> RescueMedicationLot.id; the lot whose doses are reserved for this run"
      - name: agent
        type: enum
        source: input
        description: "Bronchoprovocation agent used; must equal the order's challenge_type"
        constraints: "one of METHACHOLINE, MANNITOL"
      - name: baseline_fev1_l
        type: number
        source: computed
        description: "Snapshot of TestSession.best_fev1_l taken when the run is armed; every drop_pct is measured against this value"
      - name: status
        type: enum
        source: system
        description: "Challenge run lifecycle state"
        default: ARMED
        constraints: "one of ARMED, IN_PROGRESS, STOPPED_PC20, COMPLETED_NEGATIVE, ABORTED_SAFETY"
      - name: current_step_index
        type: integer
        source: system
        description: "Count of dose steps recorded on this run"
        default: 0
      - name: cumulative_dose_units
        type: number
        source: computed
        description: "Sum of dose_units over every recorded step, 3 decimal places"
        default: 0
      - name: last_step_dose_units
        type: number
        source: system
        description: "cumulative_dose_units as it stood before the most recent step, the D1 anchor of the PC20 interpolation; 0 until the first step"
        default: 0
      - name: last_step_drop_pct
        type: number
        source: system
        description: "drop_pct of the step before the most recent one, the R1 anchor of the PC20 interpolation; 0 until the second step"
        default: 0
      - name: max_fev1_drop_pct
        type: number
        source: computed
        description: "Largest drop_pct observed across recorded steps, 2 decimal places"
        default: 0
      - name: pc20_dose_units
        type: number
        source: computed
        description: "Provocative cumulative dose producing a 20 percent FEV1 fall, linearly interpolated between the last two steps, 3 decimal places; null unless status is STOPPED_PC20"
      - name: rescue_doses_administered
        type: integer
        source: computed
        description: "Rescue doses actually given on this run; 0 while no agent dose has been recorded and RESCUE_ADMIN_DOSES once the run terminates after at least one step"
        default: 0
      - name: stop_reason
        type: string
        source: system
        description: "One of PC20_REACHED, MAX_CUMULATIVE_DOSE_REACHED, TECHNOLOGIST_ABORT or SESSION_ABORTED; null while status is ARMED or IN_PROGRESS"
      - name: abort_reason
        type: string
        source: input
        description: "Free-text safety reason supplied on the abort endpoint; null otherwise"

  - name: InterpretationReport
    parent: TestSession
    common_fields: true
    entity_kind: resource
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> TestSession.id; taken from the {session_id} path segment"
      - name: interpreter_staff_id
        type: string
        source: computed
        description: "FK -> Staff.id; chosen at assignment by the selector in calculations.interpreter_assignment_selection"
      - name: assigned_at
        type: datetime
        source: system
        description: "Logical-clock instant of assignment; the origin of the turnaround clock"
      - name: queue_load_pct
        type: number
        source: computed
        description: "Interpreter queue load percent at assignment, counting this report, 2 decimal places"
      - name: load_tier
        type: enum
        source: computed
        description: "SLA load tier derived from queue_load_pct"
        constraints: "one of NORMAL, ELEVATED, SURGE"
      - name: sla_minutes
        type: integer
        source: computed
        description: "Whole minutes of turnaround allowance, per calculations.interpretation_sla_and_turnaround"
      - name: due_at
        type: datetime
        source: computed
        description: "assigned_at plus sla_minutes minutes"
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the interpreting physician signed; refreshed on each amend-then-sign cycle"
      - name: turnaround_minutes
        type: integer
        source: computed
        description: "Whole minutes from assigned_at to signed_at; null before the first signature"
      - name: sla_breached
        type: boolean
        source: computed
        description: "True when signed_at is strictly after due_at; null before the first signature"
      - name: pattern
        type: enum
        source: computed
        description: "Interpretation pattern from calculations.interpretation_pattern_and_severity, computed at signing"
        constraints: "one of NORMAL, OBSTRUCTION, RESTRICTION, MIXED"
      - name: severity
        type: enum
        source: computed
        description: "Severity grade from calculations.interpretation_pattern_and_severity, computed at signing"
        constraints: "one of NONE, MILD, MODERATE, MODERATELY_SEVERE, SEVERE, VERY_SEVERE"
      - name: reference_equation_code
        type: string
        source: computed
        description: "Copied from the session's pinned reference_equation_code at assignment so the signed report cites the equation actually used"
      - name: template_version
        type: string
        source: computed
        description: "Report template identifier, always the REPORT_TEMPLATE_VERSION constant"
      - name: clinical_comment
        type: string
        source: input
        description: "Free-text interpretation narrative supplied at signing"
      - name: amendment_count
        type: integer
        source: system
        description: "Count of completed amend transitions on this report"
        default: 0
      - name: amendment_reason
        type: string
        source: input
        description: "Reason supplied on the most recent amend transition; null before the first amendment"
      - name: superseded_by_report_id
        type: string
        source: system
        description: "FK -> InterpretationReport.id; set on the losing report when a later assignment supersedes it, null otherwise"
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state"
        default: ASSIGNED
        constraints: "one of ASSIGNED, SIGNED, AMENDED, REASSIGNED"

  - name: CustodyEvent
    parent: TestSession
    common_fields: false
    entity_kind: event
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> TestSession.id; taken from the {session_id} path segment"
      - name: event_type
        type: enum
        source: input
        description: "Chain-of-custody act recorded by this append-only row"
        constraints: "one of ID_VERIFIED, SEAL_APPLIED, SEAL_BROKEN, WITNESS_SIGNED"
      - name: actor_user_id
        type: string
        source: system
        description: "Raw X-User-ID header of the actor; a Staff id for Technologist actors and an opaque operator id for ComplianceAuditor actors, so it is deliberately not declared as a foreign key"
      - name: actor_role
        type: enum
        source: system
        description: "X-User-Role header of the actor"
        constraints: "one of Technologist, ComplianceAuditor"
      - name: seal_serial
        type: string
        source: input
        description: "Tamper-evident seal serial; required when event_type is SEAL_APPLIED or SEAL_BROKEN, forbidden otherwise"
      - name: id_document_type
        type: enum
        source: input
        description: "Identity document inspected; required when event_type is ID_VERIFIED, forbidden otherwise"
        constraints: "one of PHOTO_ID, PASSPORT, EMPLOYEE_BADGE"
      - name: note
        type: string
        source: input
        description: "Optional free-text remark for every event_type"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which this custody row was appended"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Device
    initial_state: NEW
    terminal_states: []
    shape: cyclic
    transitions:
      - from: NEW
        to: AVAILABLE
        trigger: "POST /pft-lab/devices/{device_id}/quality-events with event_type VOLUME_CALIBRATION whose computed outcome is PASS"
        actor: Technologist
        preconditions:
          - "Device.status == NEW"
          - "acting Staff.credentialed_modalities contains Device.modality and Staff.competency_expires_on >= current logical clock date"
          - "ambient_temp_c is an integer in [20, 27]"
        side_effects:
          - "Device.last_calibration_at := DeviceQualityEvent.performed_at"
          - "Device.last_calibration_error_pct := DeviceQualityEvent.error_pct"
          - "Device.status := AVAILABLE"
          - "increments Device.version by 1"
      - from: NEW
        to: QUARANTINED
        trigger: "POST /pft-lab/devices/{device_id}/quality-events with event_type VOLUME_CALIBRATION whose computed outcome is FAIL"
        actor: Technologist
        preconditions:
          - "Device.status == NEW"
        side_effects:
          - "Device.last_calibration_error_pct := DeviceQualityEvent.error_pct (last_calibration_at is NOT advanced, because only a PASS refreshes calibration currency)"
          - "Device.status := QUARANTINED, Device.quarantined_at := performed_at, Device.quarantine_reason := CALIBRATION_FAILED, Device.quarantine_trigger_staff_id := performed_by_staff_id"
          - "increments Device.version by 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /pft-lab/devices/{device_id}/quality-events with event_type VOLUME_CALIBRATION whose computed outcome is FAIL"
        actor: Technologist
        preconditions:
          - "Device.status == AVAILABLE"
        side_effects:
          - "Device.status := QUARANTINED, quarantined_at := performed_at, quarantine_reason := CALIBRATION_FAILED, quarantine_trigger_staff_id := performed_by_staff_id"
          - "CASCADE HOP 1 consequence: because Device.status became QUARANTINED, every TestSession on this device with session_status in {SCHEDULED, IN_PROGRESS} is transitioned to ABORTED with abort_reason DEVICE_QUARANTINED, processed in ascending TestSession.created_at order"
          - "increments Device.version by 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /pft-lab/devices/{device_id}/quality-events with event_type BIOLOGIC_CONTROL whose computed outcome is FAIL"
        actor: Technologist
        preconditions:
          - "Device.status == AVAILABLE"
        side_effects:
          - "Device.consecutive_biologic_failures := Device.consecutive_biologic_failures + 1"
          - "Device.status := QUARANTINED, quarantined_at := performed_at, quarantine_reason := BIOLOGIC_CONTROL_FAILED, quarantine_trigger_staff_id := performed_by_staff_id"
          - "CASCADE HOP 1 consequence: because Device.status became QUARANTINED, every TestSession on this device with session_status in {SCHEDULED, IN_PROGRESS} is transitioned to ABORTED with abort_reason DEVICE_QUARANTINED, processed in ascending TestSession.created_at order (this drives cascade hops 2, 3 and 4 declared on TestSession)"
          - "increments Device.version by 1"
        note: "Device.last_biologic_control_date is NOT advanced by a FAIL, so the daily-QC gate stays unsatisfied."
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /pft-lab/devices/{device_id}/return-to-service"
        actor: LabManager
        preconditions:
          - "Device.status == QUARANTINED"
          - "at least one DeviceQualityEvent on this device with event_type VOLUME_CALIBRATION, outcome PASS and performed_at > Device.quarantined_at exists"
          - "at least one DeviceQualityEvent on this device with event_type BIOLOGIC_CONTROL, outcome PASS (WARN does not qualify) and performed_at > Device.quarantined_at exists"
          - "Device.consecutive_biologic_failures == 0"
          - "every one of those two clearing events has performed_by_staff_id != Device.quarantine_trigger_staff_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Device.status := AVAILABLE"
          - "Device.quarantined_at := null, quarantine_reason := null, quarantine_trigger_staff_id := null"
          - "increments Device.version by 1"
      - from: AVAILABLE
        to: SOILED
        trigger: "system, when a TestSession on this device leaves session_status IN_PROGRESS for ACCEPTED or ABORTED, or leaves IN_PROGRESS for REJECTED with the post-increment TestSession.rejection_round == MAX_REJECTION_ROUNDS"
        actor: system
        preconditions:
          - "Device.status == AVAILABLE"
        side_effects:
          - "Device.status := SOILED"
          - "Device.last_session_end_at := TestSession.scheduled_end_at"
          - "Device.sessions_since_filter_change := Device.sessions_since_filter_change + 1"
          - "increments Device.version by 1"
        note: "A REJECTED session whose post-increment rejection_round is below MAX_REJECTION_ROUNDS leaves Device.status AVAILABLE, because the same patient is still at the device for another coaching round."
      - from: SOILED
        to: AVAILABLE
        trigger: "POST /pft-lab/devices/{device_id}/quality-events with event_type FILTER_REPLACEMENT or HIGH_LEVEL_DISINFECT, whichever event completes the pair"
        actor: Technologist
        preconditions:
          - "Device.status == SOILED"
          - "after appending this event, at least one FILTER_REPLACEMENT event with outcome COMPLETE and at least one HIGH_LEVEL_DISINFECT event with outcome COMPLETE exist on this device with performed_at > Device.last_session_end_at"
        side_effects:
          - "when event_type is FILTER_REPLACEMENT: Device.current_filter_serial := filter_serial and Device.sessions_since_filter_change := 0"
          - "Device.status := AVAILABLE"
          - "increments Device.version by 1"
        note: "A HIGH_LEVEL_DISINFECT event whose dwell_minutes < MIN_DWELL_MINUTES computes outcome INCOMPLETE and therefore does not complete the pair; the device stays SOILED."

  - entity: TestOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pft-lab/test-orders/{order_id}/submit"
        actor: OrderingPhysician
        preconditions:
          - "TestOrder.status == DRAFT"
          - "acting Staff.id == TestOrder.ordering_staff_id"
          - "the test_context/indication_code pairing passes, else ERR_INDICATION_CONTEXT_MISMATCH"
          - "every requested modality is in APPROVED_INDICATION_MODALITIES[indication_code] and (challenge_type == NONE or indication_code == ASTHMA_DIAGNOSIS)"
          - "TestOrder.current_medication_classes is non-empty"
        side_effects:
          - "TestOrder.status := SUBMITTED, rejection_reason := null"
          - "increments TestOrder.version by 1"
      - from: DRAFT
        to: READY
        trigger: "POST /pft-lab/test-orders/{order_id}/submit"
        actor: OrderingPhysician
        preconditions:
          - "TestOrder.status == DRAFT"
          - "the indication checks above all pass"
          - "TestOrder.current_medication_classes == []"
        side_effects:
          - "TestOrder.status := READY, rejection_reason := null, hold_release_at stays null"
          - "increments TestOrder.version by 1"
      - from: DRAFT
        to: INDICATION_REJECTED
        trigger: "POST /pft-lab/test-orders/{order_id}/submit"
        actor: OrderingPhysician
        preconditions:
          - "TestOrder.status == DRAFT"
          - "the test_context/indication_code pairing passes (that check is a hard 422 and preempts this branch)"
          - "at least one requested modality is absent from APPROVED_INDICATION_MODALITIES[indication_code], or challenge_type != NONE while indication_code != ASTHMA_DIAGNOSIS"
        side_effects:
          - "TestOrder.status := INDICATION_REJECTED"
          - "TestOrder.rejection_reason := MODALITY_NOT_APPROVED_FOR_INDICATION when a modality is unapproved, otherwise CHALLENGE_INDICATION_MISMATCH"
          - "increments TestOrder.version by 1"
        note: "Returns HTTP 200 with the order body: an unapproved indication is a lab workflow state, not a client error."
      - from: INDICATION_REJECTED
        to: DRAFT
        trigger: "PATCH /pft-lab/test-orders/{order_id}"
        actor: OrderingPhysician
        preconditions:
          - "TestOrder.status == INDICATION_REJECTED"
          - "acting Staff.id == TestOrder.ordering_staff_id"
        side_effects:
          - "the supplied subset of indication_code, requested_modalities, bronchodilator_requested and challenge_type is applied"
          - "TestOrder.status := DRAFT, TestOrder.rejection_reason := null"
          - "increments TestOrder.version by 1"
        note: "Closes the revision cycle DRAFT -> INDICATION_REJECTED -> DRAFT -> SUBMITTED."
      - from: SUBMITTED
        to: MED_HOLD_ISSUED
        trigger: "POST /pft-lab/test-orders/{order_id}/medication-holds"
        actor: Technologist
        preconditions:
          - "TestOrder.status == SUBMITTED"
          - "expected_order_version equals TestOrder.version, else ERR_STALE_ORDER_VERSION"
          - "medication_class is a member of TestOrder.current_medication_classes"
        side_effects:
          - "a MedicationHold row is created in status PENDING with required_hold_hours and release_at"
          - "any prior MedicationHold on this order with the same medication_class and status in {PENDING, VIOLATED} is transitioned to SUPERSEDED"
          - "TestOrder.hold_release_at is recomputed per calculations.medication_hold_release"
          - "TestOrder.status := MED_HOLD_ISSUED"
          - "increments TestOrder.version by 1"
      - from: MED_HOLD_ISSUED
        to: MED_HOLD_ISSUED
        trigger: "POST /pft-lab/test-orders/{order_id}/medication-holds for a second or later medication class, or POST /pft-lab/medication-holds/{hold_id}/attest that still leaves another non-SUPERSEDED hold PENDING"
        actor: Technologist
        preconditions:
          - "TestOrder.status == MED_HOLD_ISSUED"
          - "for the holds endpoint: expected_order_version equals TestOrder.version"
          - "for the attest endpoint: at least one other non-SUPERSEDED MedicationHold on the order is still PENDING after this attestation"
        side_effects:
          - "for a new hold: the row is created, same-class predecessors are SUPERSEDED, hold_release_at is recomputed"
          - "for attestation_result TAKEN: MedicationHold.status := VIOLATED and hold_release_at is recomputed over the remaining {PENDING, ATTESTED} holds"
          - "increments TestOrder.version by 1"
      - from: MED_HOLD_ISSUED
        to: READY
        trigger: "POST /pft-lab/medication-holds/{hold_id}/attest, with either attestation_result, after which no non-SUPERSEDED hold on the order is still PENDING"
        actor: Technologist
        preconditions:
          - "TestOrder.status == MED_HOLD_ISSUED"
          - "MedicationHold.status == PENDING"
          - "after this attestation, every MedicationHold on the order with status not in {SUPERSEDED} has status ATTESTED or VIOLATED, i.e. none is still PENDING"
        side_effects:
          - "MedicationHold.status := ATTESTED for attestation_result WITHHELD, or VIOLATED for TAKEN"
          - "TestOrder.hold_release_at is recomputed per calculations.medication_hold_release"
          - "TestOrder.status := READY"
          - "increments TestOrder.version by 1"
        note: "Reaching READY does not mean the patient complied: a VIOLATED hold leaves the order READY but blocks POST /pft-lab/test-sessions with ERR_MED_HOLD_VIOLATED (validations priority 39) until a replacement hold for that class supersedes it and is itself attested WITHHELD."
      - from: READY
        to: MED_HOLD_ISSUED
        trigger: "POST /pft-lab/test-orders/{order_id}/medication-holds re-issuing a hold on an order that already reached READY"
        actor: Technologist
        preconditions:
          - "TestOrder.status == READY"
          - "expected_order_version equals TestOrder.version, else ERR_STALE_ORDER_VERSION"
          - "medication_class is a member of TestOrder.current_medication_classes"
        side_effects:
          - "the MedicationHold row is created with status PENDING; any PENDING or VIOLATED predecessor for the same class is SUPERSEDED"
          - "TestOrder.hold_release_at is recomputed per calculations.medication_hold_release"
          - "TestOrder.status := MED_HOLD_ISSUED, so the order leaves the schedulable set until the replacement hold is attested"
          - "increments TestOrder.version by 1"
        note: "This is the remediation loop for a VIOLATED hold: the order goes back to MED_HOLD_ISSUED, and attesting the replacement WITHHELD returns it to READY with the violation superseded."
      - from: READY
        to: IN_TESTING
        trigger: "POST /pft-lab/test-sessions"
        actor: Technologist
        preconditions:
          - "TestOrder.status == READY"
          - "every session-creation gate in validations priorities 20 through 34 passes"
        side_effects:
          - "a TestSession row is created in session_status SCHEDULED"
          - "TestOrder.status := IN_TESTING"
          - "increments TestOrder.version by 1"
      - from: IN_TESTING
        to: READY
        trigger: "system, when a TestSession for this order transitions to ABORTED"
        actor: system
        preconditions:
          - "TestOrder.status == IN_TESTING"
        side_effects:
          - "TestOrder.abort_count := TestOrder.abort_count + 1"
          - "TestOrder.status := READY, so the order can be rescheduled onto another device"
          - "increments TestOrder.version by 1"
        note: "CASCADE HOP 3 of the biologic-control cascade: caused by the session's ABORTED transition, not by the quality event."
      - from: IN_TESTING
        to: COMPLETED
        trigger: "system, when a TestSession for this order transitions to REPORTED"
        actor: system
        preconditions:
          - "TestOrder.status == IN_TESTING"
        side_effects:
          - "TestOrder.status := COMPLETED"
          - "CASCADE HOP 4 consequence: because TestOrder.status became COMPLETED, Patient.completed_order_count := Patient.completed_order_count + 1"
          - "increments TestOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pft-lab/test-orders/{order_id}/cancel"
        actor: OrderingPhysician
        preconditions:
          - "TestOrder.status in {DRAFT, SUBMITTED, INDICATION_REJECTED, MED_HOLD_ISSUED, READY, IN_TESTING}"
        side_effects:
          - "TestOrder.status := CANCELLED, cancellation_reason := supplied value"
          - "every MedicationHold on this order with status PENDING is transitioned to SUPERSEDED"
          - "CASCADE consequence: every TestSession for this order with session_status in {SCHEDULED, IN_PROGRESS} is transitioned to ABORTED with abort_reason ORDER_CANCELLED, in ascending TestSession.created_at order"
          - "increments TestOrder.version by 1"
        note: "Declared once for the whole non-terminal set {DRAFT, SUBMITTED, INDICATION_REJECTED, MED_HOLD_ISSUED, READY, IN_TESTING}; from COMPLETED or CANCELLED the call is rejected with ERR_ORDER_STATE_INVALID."

  - entity: TestSession
    initial_state: SCHEDULED
    terminal_states: [REPORTED, ABORTED]
    shape: parallel
    parallel_dimensions:
      - name: session_status
        states: [SCHEDULED, IN_PROGRESS, ACCEPTED, REJECTED, REPORTED, ABORTED]
        note: "Execution dimension, driven by maneuvers, finalize-quality and report signing."
      - name: custody_status
        states: [NOT_APPLICABLE, CUSTODY_OPEN, CUSTODY_ID_VERIFIED, CUSTODY_SEALED, CUSTODY_BROKEN]
        note: "Chain-of-custody dimension, driven exclusively by POST custody-events. It advances and stalls independently of session_status; the two dimensions only meet at report signing, which requires custody_status == CUSTODY_SEALED for non-ROUTINE_CLINICAL orders."
    transitions:
      - from: "session_status SCHEDULED"
        to: "session_status IN_PROGRESS"
        trigger: "POST /pft-lab/test-sessions/{session_id}/maneuvers (first maneuver on the session)"
        actor: Technologist
        preconditions:
          - "TestSession.session_status == SCHEDULED"
          - "acting Staff.id == TestSession.technologist_staff_id"
          - "Device.status == AVAILABLE for TestSession.device_id"
          - "when the computed acceptability is UNACCEPTABLE, coaching_note is present and non-empty, else ERR_COACHING_NOTE_REQUIRED"
        side_effects:
          - "a Maneuver row is appended with maneuver_index = prior count + 1, acceptability, bev_limit_ml and rejection_reasons computed"
          - "TestSession.best_fev1_l, best_fvc_l, best_fev1_post_l, acceptable_maneuver_count, repeatability_delta_ml, fvc_repeatability_delta_ml and quality_grade are recomputed per calculations.maneuver_acceptability_and_session_quality"
          - "TestSession.fev1_pct_predicted, fvc_pct_predicted and fev1_fvc_ratio are recomputed against the pinned predicted values"
          - "TestSession.session_status := IN_PROGRESS"
          - "increments TestSession.version by 1"
      - from: "session_status IN_PROGRESS"
        to: "session_status IN_PROGRESS"
        trigger: "POST /pft-lab/test-sessions/{session_id}/maneuvers (second and later maneuvers)"
        actor: Technologist
        preconditions:
          - "TestSession.session_status == IN_PROGRESS"
        side_effects:
          - "same recomputation set as the first maneuver"
          - "increments TestSession.version by 1"
      - from: "session_status IN_PROGRESS"
        to: "session_status ACCEPTED"
        trigger: "POST /pft-lab/test-sessions/{session_id}/finalize-quality"
        actor: Technologist
        preconditions:
          - "TestSession.session_status == IN_PROGRESS"
          - "TestSession.quality_grade in {A, B, C}"
          - "no ChallengeRun on this session has status ARMED or IN_PROGRESS"
        side_effects:
          - "when TestOrder.bronchodilator_requested is true and best_fev1_post_l is not null: TestSession.bd_response_pct, bd_response_ml, bd_response_variant and bd_response_positive are computed per calculations.bronchodilator_response"
          - "CASCADE consequence: because the session left IN_PROGRESS for ACCEPTED, Device.status := SOILED, Device.last_session_end_at := scheduled_end_at, Device.sessions_since_filter_change += 1"
          - "TestSession.session_status := ACCEPTED"
          - "increments TestSession.version by 1"
      - from: "session_status IN_PROGRESS"
        to: "session_status REJECTED"
        trigger: "POST /pft-lab/test-sessions/{session_id}/finalize-quality"
        actor: Technologist
        preconditions:
          - "TestSession.session_status == IN_PROGRESS"
          - "TestSession.quality_grade in {D, F}"
        side_effects:
          - "TestSession.rejection_round := TestSession.rejection_round + 1"
          - "TestSession.session_status := REJECTED"
          - "CONDITIONAL CASCADE: only when the post-increment rejection_round == MAX_REJECTION_ROUNDS, Device.status := SOILED, Device.last_session_end_at := scheduled_end_at and Device.sessions_since_filter_change += 1; below that threshold the device stays AVAILABLE for the next coaching round"
          - "increments TestSession.version by 1"
      - from: "session_status REJECTED"
        to: "session_status IN_PROGRESS"
        trigger: "POST /pft-lab/test-sessions/{session_id}/maneuvers"
        actor: Technologist
        preconditions:
          - "TestSession.session_status == REJECTED"
          - "TestSession.rejection_round < MAX_REJECTION_ROUNDS, else ERR_MAX_REJECTION_ROUNDS_EXCEEDED"
          - "Device.status == AVAILABLE"
        side_effects:
          - "same recomputation set as any maneuver append"
          - "TestSession.session_status := IN_PROGRESS"
          - "increments TestSession.version by 1"
        note: "Closes the coaching cycle IN_PROGRESS -> REJECTED -> IN_PROGRESS, bounded by MAX_REJECTION_ROUNDS."
      - from: "session_status SCHEDULED or IN_PROGRESS"
        to: "session_status ABORTED"
        trigger: "system, when Device.status becomes QUARANTINED, when TestOrder.status becomes CANCELLED, or when a ChallengeRun on this session reaches ABORTED_SAFETY"
        actor: system
        preconditions:
          - "TestSession.session_status in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "TestSession.session_status := ABORTED; abort_reason := DEVICE_QUARANTINED, ORDER_CANCELLED or CHALLENGE_SAFETY_ABORT to match the cause"
          - "CASCADE HOP 2->3 consequence: because this session became ABORTED, its TestOrder transitions IN_TESTING -> READY and TestOrder.abort_count += 1 (skipped when the order is already CANCELLED)"
          - "CASCADE HOP 2->4 consequence: because this session became ABORTED, every ChallengeRun on it with status in {ARMED, IN_PROGRESS} is transitioned to ABORTED_SAFETY with stop_reason SESSION_ABORTED, which in turn releases or spends the reserved rescue doses on RescueMedicationLot"
          - "CASCADE consequence: because this session left IN_PROGRESS for ABORTED, Device.status := SOILED unless the device is currently QUARANTINED, in which case the device keeps status QUARANTINED and only last_session_end_at and sessions_since_filter_change are updated"
          - "every InterpretationReport on this session with status ASSIGNED is transitioned to REASSIGNED, decrementing that interpreter's Staff.open_report_count"
          - "increments TestSession.version by 1"
      - from: "session_status ACCEPTED"
        to: "session_status REPORTED"
        trigger: "system, when the InterpretationReport assigned to this session is signed"
        actor: system
        preconditions:
          - "TestSession.session_status == ACCEPTED"
        side_effects:
          - "TestSession.turnaround_minutes := InterpretationReport.turnaround_minutes"
          - "TestSession.session_status := REPORTED"
          - "CASCADE HOP 3 consequence: because this session became REPORTED, its TestOrder transitions IN_TESTING -> COMPLETED"
          - "increments TestSession.version by 1"
      - from: "custody_status CUSTODY_OPEN"
        to: "custody_status CUSTODY_ID_VERIFIED"
        trigger: "POST /pft-lab/test-sessions/{session_id}/custody-events with event_type ID_VERIFIED"
        actor: Technologist
        preconditions:
          - "TestSession.custody_status == CUSTODY_OPEN, else ERR_CUSTODY_SEQUENCE_INVALID"
          - "TestSession.custody_status != NOT_APPLICABLE, else ERR_CUSTODY_NOT_APPLICABLE"
          - "id_document_type is present"
        side_effects:
          - "a CustodyEvent row is appended"
          - "TestSession.custody_status := CUSTODY_ID_VERIFIED with session_status untouched"
          - "increments TestSession.version by 1"
      - from: "custody_status CUSTODY_ID_VERIFIED"
        to: "custody_status CUSTODY_SEALED"
        trigger: "POST /pft-lab/test-sessions/{session_id}/custody-events with event_type SEAL_APPLIED"
        actor: Technologist
        preconditions:
          - "TestSession.custody_status == CUSTODY_ID_VERIFIED, else ERR_CUSTODY_SEQUENCE_INVALID"
          - "seal_serial is present"
        side_effects:
          - "a CustodyEvent row is appended"
          - "TestSession.custody_status := CUSTODY_SEALED with session_status untouched"
          - "increments TestSession.version by 1"
      - from: "custody_status CUSTODY_SEALED"
        to: "custody_status CUSTODY_BROKEN"
        trigger: "POST /pft-lab/test-sessions/{session_id}/custody-events with event_type SEAL_BROKEN"
        actor: Technologist
        preconditions:
          - "TestSession.custody_status == CUSTODY_SEALED, else ERR_CUSTODY_SEQUENCE_INVALID"
          - "seal_serial is present"
        side_effects:
          - "a CustodyEvent row is appended"
          - "TestSession.custody_status := CUSTODY_BROKEN, which permanently blocks report signing for non-ROUTINE_CLINICAL orders via ERR_CUSTODY_NOT_SEALED"
          - "increments TestSession.version by 1"
      - from: "custody_status CUSTODY_OPEN, CUSTODY_ID_VERIFIED, CUSTODY_SEALED or CUSTODY_BROKEN"
        to: "custody_status unchanged"
        trigger: "POST /pft-lab/test-sessions/{session_id}/custody-events with event_type WITNESS_SIGNED"
        actor: ComplianceAuditor
        preconditions:
          - "TestSession.custody_status != NOT_APPLICABLE, else ERR_CUSTODY_NOT_APPLICABLE"
          - "the acting role is ComplianceAuditor; a Technologist submitting WITNESS_SIGNED is rejected with ERR_ROLE_NOT_PERMITTED"
        side_effects:
          - "a CustodyEvent row is appended with actor_role ComplianceAuditor; custody_status and session_status are both untouched"
          - "increments TestSession.version by 1"
        note: "A witness attestation is a prerequisite for signing a DISABILITY_EVALUATION report but does not itself move the custody dimension."

  - entity: MedicationHold
    initial_state: PENDING
    terminal_states: [ATTESTED, SUPERSEDED]
    shape: branching
    transitions:
      - from: PENDING
        to: ATTESTED
        trigger: "POST /pft-lab/medication-holds/{hold_id}/attest with attestation_result WITHHELD"
        actor: Technologist
        preconditions:
          - "MedicationHold.status == PENDING, else ERR_HOLD_STATE_INVALID"
          - "TestOrder.status == MED_HOLD_ISSUED"
        side_effects:
          - "MedicationHold.status := ATTESTED"
          - "TestOrder.hold_release_at is recomputed; when no non-SUPERSEDED hold is still PENDING the order transitions MED_HOLD_ISSUED -> READY"
          - "increments MedicationHold.version by 1"
      - from: PENDING
        to: VIOLATED
        trigger: "POST /pft-lab/medication-holds/{hold_id}/attest with attestation_result TAKEN"
        actor: Technologist
        preconditions:
          - "MedicationHold.status == PENDING, else ERR_HOLD_STATE_INVALID"
        side_effects:
          - "MedicationHold.status := VIOLATED"
          - "TestOrder.hold_release_at is recomputed over the remaining {PENDING, ATTESTED} holds, so a violated class drops out of the maximum; the order still advances MED_HOLD_ISSUED -> READY once no hold is PENDING, but session creation stays blocked with ERR_MED_HOLD_VIOLATED until a replacement hold supersedes this one"
          - "increments MedicationHold.version by 1"
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /pft-lab/test-orders/{order_id}/medication-holds for the same medication_class, or POST /pft-lab/test-orders/{order_id}/cancel"
        actor: Technologist
        preconditions:
          - "MedicationHold.status == PENDING"
        side_effects:
          - "MedicationHold.status := SUPERSEDED and the row leaves the hold_release_at input set"
          - "increments MedicationHold.version by 1"
      - from: VIOLATED
        to: SUPERSEDED
        trigger: "POST /pft-lab/test-orders/{order_id}/medication-holds for the same medication_class"
        actor: Technologist
        preconditions:
          - "MedicationHold.status == VIOLATED"
        side_effects:
          - "MedicationHold.status := SUPERSEDED; the freshly created replacement hold restarts the withholding window from the new instructed_at"
          - "increments MedicationHold.version by 1"

  - entity: ChallengeRun
    initial_state: ARMED
    terminal_states: [STOPPED_PC20, COMPLETED_NEGATIVE, ABORTED_SAFETY]
    shape: branching
    transitions:
      - from: ARMED
        to: IN_PROGRESS
        trigger: "POST /pft-lab/challenge-runs/{run_id}/steps (first step)"
        actor: Technologist
        preconditions:
          - "ChallengeRun.status == ARMED, else ERR_RUN_STATE_INVALID"
          - "TestSession.session_status == IN_PROGRESS"
          - "cumulative_dose_units + dose_units <= MAX_CUMULATIVE_DOSE_UNITS, else ERR_MAX_DOSE_EXCEEDED"
          - "the computed drop_pct is below PC20_THRESHOLD_PCT and the post-step cumulative dose is below MAX_CUMULATIVE_DOSE_UNITS"
        side_effects:
          - "current_step_index += 1, last_step_dose_units := prior cumulative_dose_units, last_step_drop_pct := prior step's drop_pct, cumulative_dose_units += dose_units, max_fev1_drop_pct := max(prior, drop_pct)"
          - "ChallengeRun.status := IN_PROGRESS"
          - "increments ChallengeRun.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /pft-lab/challenge-runs/{run_id}/steps (subsequent sub-threshold step)"
        actor: Technologist
        preconditions:
          - "ChallengeRun.status == IN_PROGRESS"
          - "cumulative_dose_units + dose_units <= MAX_CUMULATIVE_DOSE_UNITS"
          - "drop_pct < PC20_THRESHOLD_PCT and post-step cumulative dose < MAX_CUMULATIVE_DOSE_UNITS"
        side_effects:
          - "same accumulator updates as the first step"
          - "increments ChallengeRun.version by 1"
      - from: IN_PROGRESS
        to: STOPPED_PC20
        trigger: "POST /pft-lab/challenge-runs/{run_id}/steps whose computed drop_pct >= PC20_THRESHOLD_PCT"
        actor: Technologist
        preconditions:
          - "ChallengeRun.status == IN_PROGRESS"
        side_effects:
          - "accumulators are updated, then pc20_dose_units is interpolated per calculations.challenge_pc20_and_rescue_ledger"
          - "ChallengeRun.status := STOPPED_PC20, stop_reason := PC20_REACHED"
          - "rescue_doses_administered := RESCUE_ADMIN_DOSES; RescueMedicationLot.doses_remaining -= RESCUE_ADMIN_DOSES and doses_reserved -= RESCUE_RESERVE_DOSES; the lot transitions STOCKED -> DEPLETED when doses_remaining reaches 0"
          - "increments ChallengeRun.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED_NEGATIVE
        trigger: "POST /pft-lab/challenge-runs/{run_id}/steps whose drop_pct < PC20_THRESHOLD_PCT and whose post-step cumulative_dose_units == MAX_CUMULATIVE_DOSE_UNITS"
        actor: Technologist
        preconditions:
          - "ChallengeRun.status == IN_PROGRESS"
        side_effects:
          - "accumulators are updated; pc20_dose_units stays null"
          - "ChallengeRun.status := COMPLETED_NEGATIVE, stop_reason := MAX_CUMULATIVE_DOSE_REACHED"
          - "rescue_doses_administered := RESCUE_ADMIN_DOSES; the same lot debit and reserve release as the STOPPED_PC20 branch"
          - "increments ChallengeRun.version by 1"
      - from: ARMED
        to: ABORTED_SAFETY
        trigger: "POST /pft-lab/challenge-runs/{run_id}/abort before any step is recorded"
        actor: Technologist
        preconditions:
          - "ChallengeRun.status == ARMED"
        side_effects:
          - "ChallengeRun.status := ABORTED_SAFETY, stop_reason := TECHNOLOGIST_ABORT, rescue_doses_administered stays 0 because no provocation agent was given"
          - "RescueMedicationLot.doses_reserved -= RESCUE_RESERVE_DOSES with doses_remaining untouched, restoring the rescue-dose ledger invariant exactly"
          - "TestSession.session_status is left untouched, because no agent reached the patient"
          - "increments ChallengeRun.version by 1"
      - from: IN_PROGRESS
        to: ABORTED_SAFETY
        trigger: "POST /pft-lab/challenge-runs/{run_id}/abort after at least one step"
        actor: Technologist
        preconditions:
          - "ChallengeRun.status == IN_PROGRESS"
        side_effects:
          - "ChallengeRun.status := ABORTED_SAFETY, stop_reason := TECHNOLOGIST_ABORT"
          - "rescue_doses_administered := RESCUE_ADMIN_DOSES; RescueMedicationLot.doses_remaining -= RESCUE_ADMIN_DOSES and doses_reserved -= RESCUE_RESERVE_DOSES"
          - "CASCADE consequence: because a dosed run reached ABORTED_SAFETY, TestSession.session_status := ABORTED with abort_reason CHALLENGE_SAFETY_ABORT, which in turn drives the order back IN_TESTING -> READY"
          - "increments ChallengeRun.version by 1"

  - entity: InterpretationReport
    initial_state: ASSIGNED
    terminal_states: [REASSIGNED]
    shape: cyclic
    transitions:
      - from: ASSIGNED
        to: SIGNED
        trigger: "POST /pft-lab/interpretation-reports/{report_id}/sign"
        actor: InterpretingPhysician
        preconditions:
          - "InterpretationReport.status == ASSIGNED, else ERR_REPORT_STATE_INVALID"
          - "acting Staff.id == InterpretationReport.interpreter_staff_id, else ERR_ROLE_NOT_PERMITTED"
          - "acting Staff.id != TestSession.technologist_staff_id, else ERR_SEGREGATION_OF_DUTIES"
          - "when TestOrder.test_context != ROUTINE_CLINICAL: TestSession.custody_status == CUSTODY_SEALED, else ERR_CUSTODY_NOT_SEALED"
          - "when TestOrder.test_context == DISABILITY_EVALUATION: at least one CustodyEvent with event_type WITNESS_SIGNED exists on the session, else ERR_WITNESS_ATTESTATION_MISSING"
        side_effects:
          - "signed_at := current logical clock, turnaround_minutes and sla_breached computed, pattern and severity computed per calculations.interpretation_pattern_and_severity"
          - "InterpretationReport.status := SIGNED"
          - "CASCADE HOP 1 consequence: because the report left ASSIGNED, Staff.open_report_count for the interpreter is recomputed and drops by one"
          - "CASCADE HOP 2 consequence: because the report became SIGNED, TestSession.session_status := REPORTED and TestSession.turnaround_minutes is copied over"
          - "increments InterpretationReport.version by 1"
      - from: SIGNED
        to: AMENDED
        trigger: "POST /pft-lab/interpretation-reports/{report_id}/amend"
        actor: InterpretingPhysician
        preconditions:
          - "InterpretationReport.status == SIGNED, else ERR_REPORT_STATE_INVALID"
          - "acting Staff.id == InterpretationReport.interpreter_staff_id"
        side_effects:
          - "amendment_count += 1, amendment_reason := supplied value, sla_breached and turnaround_minutes keep their signed values until the next signature"
          - "InterpretationReport.status := AMENDED"
          - "Staff.open_report_count for the interpreter is recomputed and rises by one, because AMENDED is an open status"
          - "TestSession.session_status stays REPORTED"
          - "increments InterpretationReport.version by 1"
      - from: AMENDED
        to: SIGNED
        trigger: "POST /pft-lab/interpretation-reports/{report_id}/sign"
        actor: InterpretingPhysician
        preconditions:
          - "InterpretationReport.status == AMENDED"
          - "acting Staff.id == InterpretationReport.interpreter_staff_id"
        side_effects:
          - "signed_at is refreshed to the current logical clock and turnaround_minutes, sla_breached, pattern and severity are recomputed"
          - "InterpretationReport.status := SIGNED"
          - "Staff.open_report_count drops by one again"
          - "increments InterpretationReport.version by 1"
        note: "Closes the amendment cycle SIGNED -> AMENDED -> SIGNED, which may repeat without bound."
      - from: ASSIGNED
        to: REASSIGNED
        trigger: "POST /pft-lab/test-sessions/{session_id}/interpretation-reports creating a superseding assignment, or the session transitioning to ABORTED"
        actor: LabManager
        preconditions:
          - "InterpretationReport.status == ASSIGNED"
          - "for the superseding assignment: expected_session_version equals TestSession.version, else ERR_STALE_SESSION_VERSION"
        side_effects:
          - "InterpretationReport.status := REASSIGNED and superseded_by_report_id := the new report's id (null when the cause is session abort)"
          - "Staff.open_report_count for the losing interpreter drops by one while the winning interpreter's rises by one, leaving the lab-wide open-report total unchanged"
          - "increments InterpretationReport.version by 1"

  - entity: RescueMedicationLot
    initial_state: STOCKED
    terminal_states: [EXPIRED, DEPLETED]
    shape: branching
    transitions:
      - from: STOCKED
        to: EXPIRED
        trigger: "POST /pft-lab/_clock/set_current_utc advancing the logical date past expires_on"
        actor: LabManager
        preconditions:
          - "RescueMedicationLot.status == STOCKED"
          - "the new logical date is strictly after RescueMedicationLot.expires_on"
        side_effects:
          - "RescueMedicationLot.status := EXPIRED with doses_remaining and doses_reserved untouched, so the ledger invariants still reconcile on an expired lot"
          - "increments RescueMedicationLot.version by 1"
        note: "The only producer of EXPIRED. An expired lot fails the readiness gate with ERR_RESCUE_NOT_READY before its dose count is ever consulted."
      - from: STOCKED
        to: DEPLETED
        trigger: "system, when a ChallengeRun terminal transition debits the last remaining doses"
        actor: system
        preconditions:
          - "RescueMedicationLot.status == STOCKED"
          - "doses_remaining reaches exactly 0 after the debit"
        side_effects:
          - "RescueMedicationLot.status := DEPLETED"
          - "increments RescueMedicationLot.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: report-assign-stale-session
    parent_entity: TestSession
    write_endpoint: "POST /pft-lab/test-sessions/{session_id}/interpretation-reports"
    occ_field: "expected_session_version"
    description: |
      Assigning an InterpretationReport against a TestSession whose version has
      advanced since the client last observed it is rejected. A fresh assignment
      is legitimately allowed to supersede a still-ASSIGNED report (the prior
      report becomes REASSIGNED), so the second writer's request would otherwise
      succeed on its own product semantics; the stale-version check is what makes
      the outcome deterministic.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
  - rule_id: hold-create-stale-order
    parent_entity: TestOrder
    write_endpoint: "POST /pft-lab/test-orders/{order_id}/medication-holds"
    occ_field: "expected_order_version"
    description: |
      Issuing a MedicationHold against a TestOrder whose version has advanced
      since the client last observed it is rejected. A new hold for a class that
      already has a PENDING or VIOLATED hold legitimately supersedes it, so the
      write is not blocked by any state precondition; the stale-version check
      resolves which view of the order the instruction was written against.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: calibration_btps_error
    trigger: "POST /pft-lab/devices/{device_id}/quality-events with event_type VOLUME_CALIBRATION"
    algorithm: threshold
    formula: |
      # STEP 1 - saturated water vapour pressure lookup, keyed by the integer part
      # of ambient_temp_c. ambient_temp_c outside [20, 27] is rejected upstream by
      # ERR_AMBIENT_OUT_OF_RANGE, so the table below is total over the legal domain.
      PH2O_KPA = { 20: 2.34, 21: 2.49, 22: 2.64, 23: 2.81,
                   24: 2.98, 25: 3.17, 26: 3.36, 27: 3.57 }
      t = ambient_temp_c          # declared as a whole number in [20, 27]
      ph2o = PH2O_KPA[t]

      # STEP 2 - BTPS conversion factor, ambient conditions -> body temperature and
      # pressure, saturated. 310.15 K is 37 C; 273.15 + t converts ambient to kelvin.
      btps_factor = ( (310.15 / (273.15 + t))
                      * ((barometric_pressure_kpa - ph2o)
                         / (barometric_pressure_kpa - 6.27)) )
      btps_factor = round(btps_factor, 4)          # 4 dp, round_half_up

      # STEP 3 - corrected volume. THE ROUNDING ORDER BELOW IS NORMATIVE.
      corrected_volume_l = round(measured_volume_l * btps_factor, 3)   # 3 dp FIRST

      # STEP 4 - percentage error against the certified syringe, computed FROM THE
      # ALREADY-ROUNDED corrected_volume_l, never from the unrounded product.
      error_pct = round( abs(corrected_volume_l - SYRINGE_VOLUME_L)
                         / SYRINGE_VOLUME_L * 100, 2 )                 # 2 dp SECOND

      # STEP 5 - verdict. Strictly greater-than fails; error_pct exactly equal to
      # CAL_TOLERANCE_PCT passes.
      outcome = FAIL if error_pct > CAL_TOLERANCE_PCT else PASS

      # STEP 6 - event bookkeeping and device consequence
      if outcome == PASS:
          event.failure_reason               := null
          Device.last_calibration_at         := event.performed_at
          Device.last_calibration_error_pct  := error_pct
          Device.status                      := AVAILABLE, but ONLY when the prior
              status was NEW. A QUARANTINED device is cleared exclusively by
              POST return-to-service and a SOILED device exclusively by the
              FILTER_REPLACEMENT + HIGH_LEVEL_DISINFECT pair, so neither is
              promoted by a passing calibration.
      else:
          event.failure_reason               := CAL_TOLERANCE_EXCEEDED
          Device.last_calibration_error_pct  := error_pct   # last_calibration_at NOT advanced
          Device.status                      := QUARANTINED
          Device.quarantined_at              := event.performed_at
          Device.quarantine_reason           := CALIBRATION_FAILED
          Device.quarantine_trigger_staff_id := event.performed_by_staff_id
    input_set: "A single DeviceQualityEvent of event_type VOLUME_CALIBRATION. No prior events participate."
    constants:
      SYRINGE_VOLUME_L: 3.000
      CAL_TOLERANCE_PCT: 3.00
      AMBIENT_TEMP_MIN_C: 20
      AMBIENT_TEMP_MAX_C: 27
      BARO_MIN_KPA: 80.00
      BARO_MAX_KPA: 110.00
      BODY_TEMP_K: 310.15
      KELVIN_OFFSET: 273.15
      PH2O_BODY_KPA: 6.27
    precision: "btps_factor 4 decimal places round_half_up; corrected_volume_l 3 decimal places round_half_up; error_pct 2 decimal places round_half_up. Chained rounding is intentional: corrected_volume_l MUST be rounded to 3 dp BEFORE error_pct is derived from it."
    worked_examples:
      - "measured_volume_l 2.764, ambient_temp_c 23, barometric_pressure_kpa 101.30 -> btps_factor 1.0854, corrected_volume_l 3.000, error_pct 0.00, outcome PASS"
      - "measured_volume_l 2.847, ambient_temp_c 23, barometric_pressure_kpa 101.30 -> btps_factor 1.0854, corrected_volume_l 3.090, error_pct 3.00, outcome PASS (exactly at tolerance)"
      - "measured_volume_l 2.848, ambient_temp_c 23, barometric_pressure_kpa 101.30 -> btps_factor 1.0854, corrected_volume_l 3.091, error_pct 3.03, outcome FAIL. Deriving error_pct from the unrounded product 3.09131... yields 3.04, so a wrong rounding order is observable here."

  - name: biologic_control_deviation
    trigger: "POST /pft-lab/devices/{device_id}/quality-events with event_type BIOLOGIC_CONTROL"
    algorithm: aggregation
    formula: |
      subject = Staff[event.subject_staff_id]      # must be is_biologic_control == true

      # VARIANT SELECTION - decided by how stale the subject's stored baseline is,
      # measured against the current logical clock, never against wall-clock time.
      baseline_age_days = date_diff_days(current_utc.date(), subject.baseline_established_on)
      if baseline_age_days > BASELINE_VALIDITY_DAYS:
          variant = ROLLING_MEAN
      else:
          variant = ABSOLUTE_BASELINE

      if variant == ABSOLUTE_BASELINE:
          comparator_fev1_l = subject.baseline_fev1_l
      else:
          # rolling window: the ROLLING_WINDOW_SIZE most recent prior BIOLOGIC_CONTROL
          # events for THIS (device_id, subject_staff_id) pair whose outcome is PASS or
          # WARN. FAIL events are excluded from the window. Ordering is
          # performed_at DESC, then created_at DESC as the precise fallback.
          window = prior BIOLOGIC_CONTROL events
                     where device_id == event.device_id
                       and subject_staff_id == event.subject_staff_id
                       and outcome in {PASS, WARN}
                   order by performed_at DESC, created_at DESC
                   limit ROLLING_WINDOW_SIZE
          if count(window) < ROLLING_WINDOW_SIZE:
              variant = ABSOLUTE_BASELINE          # documented fallback
              comparator_fev1_l = subject.baseline_fev1_l
          else:
              comparator_fev1_l = round(mean(w.measured_fev1_l for w in window), 3)

      deviation_pct = round( abs(event.measured_fev1_l - comparator_fev1_l)
                             / comparator_fev1_l * 100, 2 )

      if   deviation_pct <= BCS_PASS_PCT: outcome = PASS
      elif deviation_pct <= BCS_WARN_PCT: outcome = WARN
      else:                               outcome = FAIL

      # event bookkeeping
      event.deviation_pct       := deviation_pct
      event.deviation_variant   := variant
      event.rolling_mean_fev1_l := comparator_fev1_l when variant == ROLLING_MEAN,
                                   else null

      # CASCADE HOP 1: a FAIL quarantines the device
      if outcome == FAIL:
          event.failure_reason                 := BCS_DEVIATION_EXCEEDED
          Device.consecutive_biologic_failures += 1
          Device.status                        := QUARANTINED
          Device.quarantined_at                := event.performed_at
          Device.quarantine_reason             := BIOLOGIC_CONTROL_FAILED
          Device.quarantine_trigger_staff_id   := event.performed_by_staff_id
      else:
          Device.last_biologic_control_date    := date part of event.performed_at
          Device.consecutive_biologic_failures := 0 on PASS, unchanged on WARN
    input_set: "The new BIOLOGIC_CONTROL event plus, for the ROLLING_MEAN variant only, the 3 most recent prior PASS/WARN BIOLOGIC_CONTROL events for the same (device_id, subject_staff_id) pair. FAIL events never enter the window."
    constants:
      BASELINE_VALIDITY_DAYS: 180
      ROLLING_WINDOW_SIZE: 3
      BCS_PASS_PCT: 5.00
      BCS_WARN_PCT: 10.00
    precision: "comparator_fev1_l 3 decimal places round_half_up; deviation_pct 2 decimal places round_half_up"
    variants:
      - name: ABSOLUTE_BASELINE
        when: "baseline_age_days <= BASELINE_VALIDITY_DAYS, or fewer than ROLLING_WINDOW_SIZE eligible prior events exist"
        difference: "Compares measured_fev1_l against the subject's stored baseline_fev1_l, a value fixed at enrolment."
      - name: ROLLING_MEAN
        when: "baseline_age_days > BASELINE_VALIDITY_DAYS and at least ROLLING_WINDOW_SIZE eligible prior events exist"
        difference: "Compares measured_fev1_l against the 3-point rolling mean of the subject's own recent measurements on this device, so the comparator drifts with the subject's physiology instead of staying pinned."
    worked_examples:
      - "ABSOLUTE_BASELINE, baseline_fev1_l 4.000, measured_fev1_l 3.850 -> deviation_pct 3.75, outcome PASS"
      - "ROLLING_MEAN over measured values 3.600, 3.640 and 3.620 -> comparator 3.620; measured_fev1_l 3.850 -> deviation_pct 6.35, outcome WARN. Identical input, divergent verdict."
      - "ABSOLUTE_BASELINE, baseline_fev1_l 4.000, measured_fev1_l 3.800 -> deviation_pct 5.00, outcome PASS (exactly at BCS_PASS_PCT)"
      - "ABSOLUTE_BASELINE, baseline_fev1_l 4.000, measured_fev1_l 3.600 -> deviation_pct 10.00, outcome WARN (exactly at BCS_WARN_PCT)"
      - "ABSOLUTE_BASELINE, baseline_fev1_l 4.000, measured_fev1_l 3.599 -> deviation_pct 10.03, outcome FAIL, device QUARANTINED"

  - name: reference_equation_selection_and_predicted_values
    trigger: "POST /pft-lab/test-sessions (the equation is pinned onto the session at creation and never re-selected)"
    algorithm: weighted_scoring
    formula: |
      age_years = completed whole years between patient.birth_date and
                  current_utc.date(): (current.year - birth.year), minus 1 when
                  (current.month, current.day) < (birth.month, birth.day)

      # SELECTOR - eligibility filter
      pool = ReferenceEquationSet where status == ACTIVE
               and device.modality in modality_scope
               and applicable_age_min <= age_years <= applicable_age_max
               and (sex_scope == patient.sex or sex_scope == ANY)
      if pool is empty: raise ERR_NO_REFERENCE_EQUATION

      # SELECTOR - ranking. Narrower age bands win, because a tightly scoped
      # equation is the better-fitting reference. lln_percentile ASC breaks ties
      # toward the more conservative lower limit. created_at ASC is the precise
      # final fallback; entity ids are never consulted.
      chosen = pool ordered by (applicable_age_max - applicable_age_min) ASC,
                               lln_percentile ASC,
                               created_at ASC
               first

      # PREDICTED VALUES - linear in height and age, in litres
      predicted_fev1_l = round(chosen.a_fev1
                               + chosen.b_fev1 * patient.height_cm
                               - chosen.c_fev1 * age_years / 10, 3)
      predicted_fvc_l  = round(chosen.a_fvc
                               + chosen.b_fvc * patient.height_cm
                               - chosen.c_fvc * age_years / 10, 3)

      # LOWER LIMIT OF NORMAL - predicted minus Z * residual standard deviation,
      # where the RSD is expressed as a fraction of the predicted value.
      rsd_fev1 = round(predicted_fev1_l * chosen.rsd_frac, 3)
      lln_fev1_l = round(predicted_fev1_l - Z_LLN * rsd_fev1, 3)

      TestSession.reference_equation_id := chosen.id
      TestSession.predicted_fev1_l      := predicted_fev1_l
      TestSession.predicted_fvc_l       := predicted_fvc_l
      TestSession.lln_fev1_l            := lln_fev1_l
      TestSession.ratio_lln             := chosen.ratio_lln
    input_set: "All ReferenceEquationSet rows with status ACTIVE. SUPERSEDED sets never enter the pool, even when already pinned to an older session."
    constants:
      Z_LLN: 1.645
    precision: "predicted_fev1_l, predicted_fvc_l, rsd_fev1 and lln_fev1_l each 3 decimal places round_half_up. rsd_fev1 is rounded to 3 dp BEFORE lln_fev1_l is derived from it."
    worked_examples:
      - "height_cm 175, age_years 45, a_fev1 2.300, b_fev1 0.020, c_fev1 0.400, rsd_frac 0.130 -> 2.300 + 3.500 - 1.800 = predicted_fev1_l 4.000, rsd_fev1 0.520, lln_fev1_l 3.145 (4.000 - 1.645 * 0.520 = 3.1446, rounded half-up at 3 dp)"
      - "height_cm 175, age_years 45, a_fvc 1.350, b_fvc 0.030, c_fvc 0.400 -> 1.350 + 5.250 - 1.800 = predicted_fvc_l 4.800"
      - "selector tie-break: two ACTIVE SPIROMETRY sets both covering age 45, one with applicable_age_min 18 / applicable_age_max 80 (band 62) and one with 40 / 60 (band 20) -> the 40-60 set is chosen because the narrower band sorts first"

  - name: maneuver_acceptability_and_session_quality
    trigger: "POST /pft-lab/test-sessions/{session_id}/maneuvers (every append), and re-read by POST /pft-lab/test-sessions/{session_id}/finalize-quality"
    algorithm: threshold
    formula: |
      # ---- PER-MANEUVER ACCEPTABILITY (ATS/ERS start-of-test, end-of-test and
      # ---- artifact criteria) --------------------------------------------------
      # Back-extrapolated volume limit is the larger of an absolute floor and a
      # percentage of the maneuver's own FVC, expressed in millilitres.
      bev_limit_ml = max(BEV_ABS_ML, round(fvc_l * BEV_FRAC * 1000, 0))
      start_ok     = back_extrapolated_volume_ml <= bev_limit_ml
      end_ok       = (expiratory_time_s >= EOFE_MIN_SEC) or plateau_reached
      artifact_free = (not cough_in_first_second) and (not glottic_closure)

      if start_ok and end_ok and artifact_free:
          acceptability = ACCEPTABLE
      elif start_ok and artifact_free and (not end_ok):
          acceptability = USABLE_FEV1_ONLY   # FEV1 survives a short blow, FVC does not
      else:
          acceptability = UNACCEPTABLE
      rejection_reasons = ordered subset of
          [BEV_EXCEEDED, EARLY_TERMINATION, COUGH_ARTIFACT, GLOTTIC_CLOSURE]
          listing exactly the failed criteria in that fixed order

      # ---- SESSION-LEVEL ROLL-UP ---------------------------------------------
      # Only maneuvers of the phase that produced them contribute to that phase's
      # best value, and only ACCEPTABLE maneuvers count toward the grade.
      pre  = maneuvers where phase == PRE_BD
      post = maneuvers where phase == POST_BD

      acceptable_maneuver_count = count(m in pre where m.acceptability == ACCEPTABLE)

      # best/second-best FEV1 over ACCEPTABLE and USABLE_FEV1_ONLY pre maneuvers;
      # best FVC over ACCEPTABLE pre maneuvers only, because a USABLE_FEV1_ONLY
      # blow has an untrustworthy FVC. Ties are broken by performed_at ASC then
      # created_at ASC - never by id.
      fev1_pool = [m in pre where m.acceptability in {ACCEPTABLE, USABLE_FEV1_ONLY}]
      fvc_pool  = [m in pre where m.acceptability == ACCEPTABLE]
      best_fev1_l = max fev1_l over fev1_pool, ties by performed_at ASC, created_at ASC
      best_fvc_l  = max fvc_l  over fvc_pool,  ties by performed_at ASC, created_at ASC
      best_fev1_post_l = max fev1_l over [m in post where m.acceptability in
                         {ACCEPTABLE, USABLE_FEV1_ONLY}] (null when post is empty)

      repeatability_delta_ml     = round(abs(best_fev1_l - second_best_fev1_l) * 1000, 0)
      fvc_repeatability_delta_ml = round(abs(best_fvc_l  - second_best_fvc_l)  * 1000, 0)
      # both deltas are null when the corresponding pool holds fewer than 2 maneuvers

      # ---- QUALITY GRADE (evaluated top to bottom; first match wins) ----------
      if acceptable_maneuver_count >= 3
         and repeatability_delta_ml <= REPEAT_TIGHT_ML
         and fvc_repeatability_delta_ml <= REPEAT_TIGHT_ML:      quality_grade = A
      elif acceptable_maneuver_count >= 3
         and repeatability_delta_ml <= REPEAT_LOOSE_ML:          quality_grade = B
      elif acceptable_maneuver_count == 2
         and repeatability_delta_ml <= REPEAT_TIGHT_ML:          quality_grade = C
      elif acceptable_maneuver_count >= 1:                       quality_grade = D
      else:                                                      quality_grade = F

      # ---- PERCENT-PREDICTED AND RATIO ---------------------------------------
      fev1_pct_predicted = round(best_fev1_l / TestSession.predicted_fev1_l * 100, 1)
      fvc_pct_predicted  = round(best_fvc_l  / TestSession.predicted_fvc_l  * 100, 1)
      fev1_fvc_ratio     = round(best_fev1_l / best_fvc_l, 3)
    input_set: "All Maneuver rows on the session with phase PRE_BD or POST_BD, partitioned by phase. UNACCEPTABLE maneuvers are stored and counted in maneuver_index but excluded from every best-value pool and from acceptable_maneuver_count. Maneuvers with phase CHALLENGE_BASELINE or POST_CHALLENGE are recorded for the challenge record and never enter any pool, count, delta or grade."
    constants:
      BEV_ABS_ML: 100
      BEV_FRAC: 0.05
      EOFE_MIN_SEC: 15.0
      REPEAT_TIGHT_ML: 150
      REPEAT_LOOSE_ML: 200
      MIN_ACCEPTABLE_FOR_GRADE_A: 3
    precision: "bev_limit_ml and both repeatability deltas are integers, round_half_up at 0 decimal places; fev1_pct_predicted and fvc_pct_predicted 1 decimal place round_half_up; fev1_fvc_ratio 3 decimal places round_half_up"
    worked_examples:
      - "fvc_l 3.200 -> bev_limit_ml 160; fvc_l 3.150 -> 158; fvc_l 3.180 -> 159; fvc_l 3.190 -> 160 (159.5 rounds half-up); fvc_l 1.900 -> 100 (the absolute floor wins)"
      - "best_fev1_l 2.400, second_best_fev1_l 2.250 -> repeatability_delta_ml 150, so grade A is still reachable (exactly at REPEAT_TIGHT_ML)"
      - "best_fev1_l 2.400, second_best_fev1_l 2.249 -> repeatability_delta_ml 151, which drops the session to grade B"
      - "best_fev1_l 2.400, predicted_fev1_l 4.000 -> fev1_pct_predicted 60.0; best_fvc_l 3.200, predicted_fvc_l 4.800 -> fvc_pct_predicted 66.7; fev1_fvc_ratio 0.750"

  - name: bronchodilator_response
    trigger: "POST /pft-lab/test-sessions/{session_id}/finalize-quality, when TestOrder.bronchodilator_requested is true and at least one POST_BD maneuver exists"
    algorithm: threshold
    formula: |
      variant = TestSession's pinned ReferenceEquationSet.bd_criterion
      bd_response_ml = round((best_fev1_post_l - best_fev1_l) * 1000, 0)

      if variant == PCT_BASELINE_2005:
          # denominator is the patient's own pre-bronchodilator value
          bd_response_pct = round((best_fev1_post_l - best_fev1_l)
                                  / best_fev1_l * 100, 1)
          bd_response_positive = (bd_response_pct >= BD_PCT_BASELINE_MIN)
                                 and (bd_response_ml >= BD_ML_MIN)
      else:  # PCT_PREDICTED_2021
          # denominator is the predicted value, so a small absolute change in a
          # patient with a large predicted FEV1 no longer clears the bar
          bd_response_pct = round((best_fev1_post_l - best_fev1_l)
                                  / TestSession.predicted_fev1_l * 100, 1)
          bd_response_positive = (bd_response_pct >= BD_PCT_PREDICTED_MIN)
    input_set: "TestSession.best_fev1_l (pre) and best_fev1_post_l (post) as recomputed by maneuver_acceptability_and_session_quality, plus the session's pinned equation."
    constants:
      BD_PCT_BASELINE_MIN: 12.0
      BD_ML_MIN: 200
      BD_PCT_PREDICTED_MIN: 10.0
    precision: "bd_response_pct 1 decimal place round_half_up; bd_response_ml integer, round_half_up at 0 decimal places"
    variants:
      - name: PCT_BASELINE_2005
        when: "the session's pinned ReferenceEquationSet has bd_criterion PCT_BASELINE_2005"
        difference: "Percentage is taken over the pre-bronchodilator FEV1 and BOTH a percentage floor of 12.0 and an absolute floor of 200 mL must be cleared."
      - name: PCT_PREDICTED_2021
        when: "the session's pinned ReferenceEquationSet has bd_criterion PCT_PREDICTED_2021"
        difference: "Percentage is taken over predicted FEV1 and only the single percentage floor of 10.0 applies; the 200 mL absolute floor is not consulted at all."
    worked_examples:
      - "best_fev1_l 2.400, best_fev1_post_l 2.720, predicted_fev1_l 4.000. PCT_BASELINE_2005 -> bd_response_pct 13.3, bd_response_ml 320, bd_response_positive true. PCT_PREDICTED_2021 on the identical numbers -> bd_response_pct 8.0, bd_response_ml 320, bd_response_positive false."

  - name: interpretation_pattern_and_severity
    trigger: "POST /pft-lab/interpretation-reports/{report_id}/sign"
    algorithm: threshold
    formula: |
      ratio      = TestSession.fev1_fvc_ratio
      ratio_lln  = TestSession.ratio_lln
      fvc_pct    = TestSession.fvc_pct_predicted
      fev1_pct   = TestSession.fev1_pct_predicted

      # ---- PATTERN DECISION TABLE (ratio vs its LLN crossed with FVC percent) --
      #   ratio <  ratio_lln  and fvc_pct <  FVC_NORMAL_PCT  -> MIXED
      #   ratio <  ratio_lln  and fvc_pct >= FVC_NORMAL_PCT  -> OBSTRUCTION
      #   ratio >= ratio_lln  and fvc_pct <  FVC_NORMAL_PCT  -> RESTRICTION
      #   ratio >= ratio_lln  and fvc_pct >= FVC_NORMAL_PCT  -> NORMAL
      # Both comparisons use >= on the normal side, so a ratio exactly equal to
      # ratio_lln and an fvc_pct of exactly 80.0 are BOTH normal.

      # ---- SEVERITY, graded on fev1_pct_predicted -----------------------------
      if pattern == NORMAL:            severity = NONE
      elif fev1_pct >= 70.0:           severity = MILD
      elif fev1_pct >= 60.0:           severity = MODERATE
      elif fev1_pct >= 50.0:           severity = MODERATELY_SEVERE
      elif fev1_pct >= 35.0:           severity = SEVERE
      else:                            severity = VERY_SEVERE

      InterpretationReport.pattern          := pattern
      InterpretationReport.severity         := severity
      InterpretationReport.template_version := REPORT_TEMPLATE_VERSION
    input_set: "The single TestSession the report is attached to; no other session participates."
    constants:
      FVC_NORMAL_PCT: 80.0
      SEV_MILD_PCT: 70.0
      SEV_MODERATE_PCT: 60.0
      SEV_MOD_SEVERE_PCT: 50.0
      SEV_SEVERE_PCT: 35.0
      REPORT_TEMPLATE_VERSION: "PFT-2026.1"
    precision: "no rounding of its own; consumes the session's already-rounded fev1_fvc_ratio (3 dp), fvc_pct_predicted (1 dp) and fev1_pct_predicted (1 dp)"
    worked_examples:
      - "fev1_fvc_ratio 0.750, ratio_lln 0.700, fvc_pct_predicted 66.7, fev1_pct_predicted 60.0 -> pattern RESTRICTION, severity MODERATE"
      - "fev1_fvc_ratio 0.700, ratio_lln 0.700, fvc_pct_predicted 80.0 -> pattern NORMAL, severity NONE (both comparisons sit exactly on their boundary)"

  - name: interpreter_assignment_selection
    trigger: "POST /pft-lab/test-sessions/{session_id}/interpretation-reports"
    algorithm: weighted_scoring
    formula: |
      device = Device[session.device_id]

      # SELECTOR - eligibility filter. The last clause is the segregation-of-duties
      # guard: the technologist who coached the maneuvers may never interpret them,
      # even when that person also holds an interpreting credential.
      pool = Staff where role_type == INTERPRETING_PHYSICIAN
               and status == ON_DUTY
               and device.modality in credentialed_modalities
               and open_report_count < max_concurrent_reports
               and id != session.technologist_staff_id
      if pool is empty: raise ERR_NO_ELIGIBLE_INTERPRETER

      # SELECTOR - ranking: least-loaded first, created_at ASC as the precise
      # fallback. Entity ids never participate.
      chosen = pool ordered by open_report_count ASC, created_at ASC first

      InterpretationReport.interpreter_staff_id := chosen.id
      chosen.open_report_count := chosen.open_report_count + 1
    input_set: "All Staff rows with role_type INTERPRETING_PHYSICIAN. OFF_DUTY staff are excluded, as is any interpreter already at max_concurrent_reports; a full roster therefore surfaces as ERR_NO_ELIGIBLE_INTERPRETER rather than a capacity-specific error."
    constants: {}
    precision: "integer counts only; no rounding"
    worked_examples:
      - "Two ON_DUTY interpreters credentialed for SPIROMETRY with open_report_count 0 and 1 -> the one with 0 is chosen. Both at 0 -> the one with the earlier created_at is chosen."

  - name: interpretation_sla_and_turnaround
    trigger: "POST /pft-lab/test-sessions/{session_id}/interpretation-reports computes due_at; POST /pft-lab/interpretation-reports/{report_id}/sign computes turnaround_minutes and sla_breached"
    algorithm: constraint_propagation
    formula: |
      # THE ORDER OF THE FIVE STEPS BELOW IS NORMATIVE. The queue load that sets
      # this report's own deadline is measured AFTER the report exists, so the new
      # report counts itself. Measuring before insertion is the classic error and
      # is observable in the worked examples.

      # STEP 1 - insert the report with status ASSIGNED and assigned_at := current_utc
      # STEP 2 - count the lab-wide open workload INCLUDING the row just inserted
      open_reports = count(InterpretationReport where status in {ASSIGNED, AMENDED})
      # STEP 3 - express it against the roster's declared capacity
      capacity = sum(s.max_concurrent_reports for s in Staff
                     where role_type == INTERPRETING_PHYSICIAN and status == ON_DUTY)
      queue_load_pct = round(open_reports / capacity * 100, 2)
      # STEP 4 - tier the load; boundaries are inclusive on the lower tier
      if   queue_load_pct <= LOAD_NORMAL_PCT:   load_tier = NORMAL;   mult = 1.00
      elif queue_load_pct <= LOAD_ELEVATED_PCT: load_tier = ELEVATED; mult = 1.50
      else:                                    load_tier = SURGE;    mult = 2.00
      # STEP 5 - deadline
      sla_minutes = int(BASE_SLA_MINUTES[TestOrder.test_context] * mult)
      due_at      = assigned_at + sla_minutes minutes

      # ---- AT SIGNING ---------------------------------------------------------
      turnaround_minutes = floor((signed_at - assigned_at) in whole minutes)
      sla_breached       = (signed_at > due_at)
      # An amendment does NOT reopen the deadline: re-signing an AMENDED report
      # recomputes turnaround_minutes against the ORIGINAL assigned_at and
      # re-evaluates sla_breached against the ORIGINAL due_at.
    input_set: "Every InterpretationReport in the lab with status ASSIGNED or AMENDED, including the row created by this very request. SIGNED and REASSIGNED reports are excluded. Capacity sums only ON_DUTY interpreting physicians."
    constants:
      BASE_SLA_MINUTES_ROUTINE_CLINICAL: 1440
      BASE_SLA_MINUTES_OCCUPATIONAL_SURVEILLANCE: 2880
      BASE_SLA_MINUTES_DISABILITY_EVALUATION: 4320
      LOAD_NORMAL_PCT: 50.00
      LOAD_ELEVATED_PCT: 80.00
      MULT_NORMAL: 1.00
      MULT_ELEVATED: 1.50
      MULT_SURGE: 2.00
    precision: "queue_load_pct 2 decimal places round_half_up; sla_minutes an integer product of an integer base and an exact 2 dp multiplier; turnaround_minutes floor to whole minutes"
    worked_examples:
      - "One ON_DUTY interpreter with max_concurrent_reports 1, no other open reports, test_context ROUTINE_CLINICAL. Counting the new report gives open_reports 1, capacity 1, queue_load_pct 100.00, load_tier SURGE, sla_minutes 2880. Counting before the insert would give 0.00, NORMAL and 1440 - the deliberate trap."
      - "One ON_DUTY interpreter with max_concurrent_reports 2, no other open reports, test_context DISABILITY_EVALUATION. open_reports 1, capacity 2, queue_load_pct 50.00 which is exactly LOAD_NORMAL_PCT, load_tier NORMAL, sla_minutes 4320."

  - name: medication_hold_release
    trigger: "POST /pft-lab/test-orders/{order_id}/medication-holds and POST /pft-lab/medication-holds/{hold_id}/attest both recompute TestOrder.hold_release_at; POST /pft-lab/test-sessions reads it"
    algorithm: chronological
    formula: |
      HOLD_HOURS_BY_CLASS = { SABA: 6, SAMA: 8, LABA: 24, LAMA: 36,
                              ICS_LABA: 24, ANTIHISTAMINE: 72, CAFFEINE: 8 }

      participating = MedicationHold on this order where status in {PENDING, ATTESTED}
      # SUPERSEDED holds drop out entirely; a VIOLATED hold also drops out of this
      # maximum but independently blocks session creation via ERR_MED_HOLD_VIOLATED.

      if participating is empty:
          TestOrder.hold_release_at := null
      else:
          TestOrder.hold_release_at := max over participating of
              ( h.instructed_at + HOLD_HOURS_BY_CLASS[h.medication_class] hours )
      # Each hold also stores its own release_at using the same expression, so
      # a replacement hold restarts only its own class window while the others keep
      # the instructed_at they were originally issued with.

      # Session creation gate, evaluated against the logical clock:
      #   current_utc >= TestOrder.hold_release_at, else ERR_MED_HOLD_NOT_ELAPSED.
      # The comparison is inclusive, so a session starting at exactly
      # hold_release_at is allowed.
    input_set: "MedicationHold rows on the order with status PENDING or ATTESTED. The maximum is taken over per-class windows, so the single longest-acting class governs the whole order."
    constants:
      HOLD_HOURS_SABA: 6
      HOLD_HOURS_SAMA: 8
      HOLD_HOURS_LABA: 24
      HOLD_HOURS_LAMA: 36
      HOLD_HOURS_ICS_LABA: 24
      HOLD_HOURS_ANTIHISTAMINE: 72
      HOLD_HOURS_CAFFEINE: 8
    precision: "whole hours added to a UTC instant; the result is an exact ISO-8601 timestamp with no rounding"
    worked_examples:
      - "A SABA hold instructed at 2026-08-01T08:00:00Z and a LAMA hold instructed at 2026-08-01T06:00:00Z give release candidates 2026-08-01T14:00:00Z and 2026-08-02T18:00:00Z, so hold_release_at is 2026-08-02T18:00:00Z."
      - "Superseding the LAMA hold with a fresh LAMA hold instructed at 2026-08-02T00:00:00Z moves hold_release_at to 2026-08-03T12:00:00Z; the SABA hold's own window is untouched."

  - name: challenge_pc20_and_rescue_ledger
    trigger: "POST /pft-lab/challenge-runs (reservation), POST /pft-lab/challenge-runs/{run_id}/steps (dose accumulation and PC20 interpolation), POST /pft-lab/challenge-runs/{run_id}/abort (release or spend)"
    algorithm: chronological
    formula: |
      # ---- RESERVATION at run creation ---------------------------------------
      # readiness gate, checked BEFORE the reservation:
      #   lot.status == STOCKED and lot.expires_on >= current_utc.date()
      #     else ERR_RESCUE_NOT_READY
      #   lot.doses_remaining - lot.doses_reserved >= RESCUE_RESERVE_DOSES
      #     else ERR_RESCUE_DOSES_INSUFFICIENT
      lot.doses_reserved := lot.doses_reserved + RESCUE_RESERVE_DOSES
      run.baseline_fev1_l := TestSession.best_fev1_l   # pinned, never re-read

      # ---- EACH STEP ----------------------------------------------------------
      if run.cumulative_dose_units + dose_units > MAX_CUMULATIVE_DOSE_UNITS:
          raise ERR_MAX_DOSE_EXCEEDED       # strictly greater; landing exactly on
                                            # MAX_CUMULATIVE_DOSE_UNITS is allowed
      prev_cum  = run.cumulative_dose_units
      prev_drop = run.max_fev1_drop_pct     # 0.00 before the first step
      new_cum   = prev_cum + dose_units
      drop_pct  = round((run.baseline_fev1_l - post_step_fev1_l)
                        / run.baseline_fev1_l * 100, 2)

      if drop_pct >= PC20_THRESHOLD_PCT:
          # linear interpolation between the last sub-threshold cumulative dose and
          # this one, in dose units. prev_cum is 0 and prev_drop is 0.00 when the
          # threshold is crossed on the very first step.
          pc20_dose_units = round(prev_cum + (new_cum - prev_cum)
                                  * (PC20_THRESHOLD_PCT - prev_drop)
                                  / (drop_pct - prev_drop), 3)
          status = STOPPED_PC20
      elif new_cum == MAX_CUMULATIVE_DOSE_UNITS:
          pc20_dose_units = null
          status = COMPLETED_NEGATIVE
      else:
          status = IN_PROGRESS

      # ---- RESCUE LEDGER on any terminal outcome ------------------------------
      # A run that reached at least one step always consumes the full rescue
      # allotment, because the provocation agent reached the patient.
      if status in {STOPPED_PC20, COMPLETED_NEGATIVE}
         or (status == ABORTED_SAFETY and run.current_step_index >= 1):
          run.rescue_doses_administered := RESCUE_ADMIN_DOSES
          lot.doses_remaining := lot.doses_remaining - RESCUE_ADMIN_DOSES
          lot.doses_reserved  := lot.doses_reserved  - RESCUE_RESERVE_DOSES
      if status == ABORTED_SAFETY and run.current_step_index == 0:
          # COMPENSATION: nothing was given, so the reservation is released whole
          run.rescue_doses_administered := 0
          lot.doses_reserved := lot.doses_reserved - RESCUE_RESERVE_DOSES
      if lot.doses_remaining == 0: lot.status := DEPLETED

      # ---- LEDGER INVARIANTS (must hold after every one of the above) ---------
      # I1: lot.doses_remaining + SUM(run.rescue_doses_administered over all runs
      #     on this lot) == lot.doses_at_receipt
      # I2: lot.doses_reserved == RESCUE_RESERVE_DOSES
      #     * count(runs on this lot with status in {ARMED, IN_PROGRESS})
    input_set: "The single ChallengeRun being stepped, its pinned baseline_fev1_l, and its RescueMedicationLot together with every other ChallengeRun drawing on that lot (for the reserved-dose invariant)."
    constants:
      PC20_THRESHOLD_PCT: 20.00
      MAX_CUMULATIVE_DOSE_UNITS: 400
      CHALLENGE_MIN_FEV1_PCT: 60.0
      RESCUE_RESERVE_DOSES: 4
      RESCUE_ADMIN_DOSES: 4
    precision: "drop_pct 2 decimal places round_half_up; pc20_dose_units 3 decimal places round_half_up; dose units and dose counts are integers"
    worked_examples:
      - "baseline_fev1_l 2.400. Step 1 dose_units 25, post_step_fev1_l 2.300 -> drop_pct 4.17, status IN_PROGRESS, cumulative 25. Step 2 dose_units 25, post_step_fev1_l 1.860 -> drop_pct 22.50, cumulative 50, pc20_dose_units 46.590, status STOPPED_PC20."
      - "cumulative_dose_units 375 and dose_units 25 with drop_pct 4.17 -> cumulative 400 which equals MAX_CUMULATIVE_DOSE_UNITS, so status COMPLETED_NEGATIVE. cumulative_dose_units 375 with dose_units 26 -> ERR_MAX_DOSE_EXCEEDED."
      - "doses_at_receipt 10. After arming: doses_reserved 4, doses_remaining 10. Abort before any step: doses_reserved 0, doses_remaining 10, invariant I1 holds as 10 + 0 == 10. Abort after one step: doses_reserved 0, doses_remaining 6, I1 holds as 6 + 4 == 10."

# =============================================================================
# 1.4 Validation Rules (evaluated strictly in ascending priority order; the
#     first violated rule determines the response, later rules are not evaluated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for the three entity_backed roles, X-User-ID resolves to an existing Staff row whose role_type matches the acting role (Technologist -> TECHNOLOGIST, OrderingPhysician -> ORDERING_PHYSICIAN, InterpretingPhysician -> INTERPRETING_PHYSICIAN). A Staff id that exists but carries a different role_type is rejected here, before any existence check on the path"
    error_id: ERR_STAFF_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include Technologist, OrderingPhysician or InterpretingPhysician"
  - priority: 4
    category: existence
    check: "the {device_id} path segment resolves to a Device"
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /pft-lab/devices/{device_id}, POST /pft-lab/devices/{device_id}/quality-events, POST /pft-lab/devices/{device_id}/return-to-service"
  - priority: 5
    category: existence
    check: "the {staff_id} path segment resolves to a Staff row"
    error_id: ERR_STAFF_NOT_FOUND
    http_status: 404
    applies_to: "GET /pft-lab/staff/{staff_id}"
  - priority: 6
    category: existence
    check: "the {patient_id} path segment resolves to a Patient"
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /pft-lab/patients/{patient_id}"
  - priority: 7
    category: existence
    check: "the {order_id} path segment resolves to a TestOrder"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /pft-lab/test-orders/{order_id} routes and their sub-resources"
  - priority: 8
    category: existence
    check: "the {hold_id} path segment resolves to a MedicationHold"
    error_id: ERR_HOLD_NOT_FOUND
    http_status: 404
    applies_to: "POST /pft-lab/medication-holds/{hold_id}/attest"
  - priority: 9
    category: existence
    check: "the {session_id} path segment resolves to a TestSession"
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "all /pft-lab/test-sessions/{session_id} routes and their sub-resources"
  - priority: 10
    category: existence
    check: "the {run_id} path segment resolves to a ChallengeRun"
    error_id: ERR_RUN_NOT_FOUND
    http_status: 404
    applies_to: "all /pft-lab/challenge-runs/{run_id} routes"
  - priority: 11
    category: existence
    check: "the {report_id} path segment resolves to an InterpretationReport"
    error_id: ERR_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "all /pft-lab/interpretation-reports/{report_id} routes"
  - priority: 12
    category: existence
    check: "the {event_id} path segment resolves to a DeviceQualityEvent"
    error_id: ERR_QUALITY_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /pft-lab/device-quality-events/{event_id}"
  - priority: 13
    category: existence
    check: "the {lot_id} path segment resolves to a RescueMedicationLot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /pft-lab/rescue-lots/{lot_id}"
  - priority: 14
    category: existence
    check: "body foreign keys resolve, validated left to right in the order the fields are declared in the endpoint's input list: patient_id, order_id, device_id, rescue_lot_id, subject_staff_id"
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_STAFF_NOT_FOUND"
    http_status: 404
    applies_to: "POST /pft-lab/test-orders, POST /pft-lab/test-sessions, POST /pft-lab/test-sessions/{session_id}/challenge-runs, POST /pft-lab/devices/{device_id}/quality-events"
  - priority: 15
    category: business_constraint
    check: "the request body parses, every required field is present and non-null, enum fields carry declared values, numeric fields are in range (height_cm 90.0 to 220.0, weight_kg 10.0 to 300.0, fvc_l/fev1_l/measured_volume_l > 0, dose_units > 0, expiratory_time_s > 0, scheduled_end_at strictly after scheduled_start_at, applicable_age_min <= applicable_age_max), and array fields are non-empty with distinct members"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 16
    category: business_constraint
    check: "the conditional field set required by DeviceQualityEvent.event_type is complete and exclusive: VOLUME_CALIBRATION needs measured_volume_l, ambient_temp_c and barometric_pressure_kpa; LEAK_CHECK needs ambient_temp_c and barometric_pressure_kpa; BIOLOGIC_CONTROL needs subject_staff_id, measured_fev1_l and measured_fvc_l; FILTER_REPLACEMENT needs filter_serial; HIGH_LEVEL_DISINFECT needs dwell_minutes. Any field belonging to a different event_type must be absent"
    error_id: ERR_MISSING_EVENT_FIELDS
    http_status: 422
    applies_to: "POST /pft-lab/devices/{device_id}/quality-events"
  - priority: 17
    category: business_constraint
    check: "the conditional field set required by CustodyEvent.event_type is complete: ID_VERIFIED needs id_document_type; SEAL_APPLIED and SEAL_BROKEN need seal_serial; WITNESS_SIGNED needs neither"
    error_id: ERR_MISSING_EVENT_FIELDS
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions/{session_id}/custody-events"
  - priority: 18
    category: business_constraint
    check: "ambient_temp_c is a whole number within [AMBIENT_TEMP_MIN_C, AMBIENT_TEMP_MAX_C] = [20, 27] and barometric_pressure_kpa is within [BARO_MIN_KPA, BARO_MAX_KPA] = [80.00, 110.00], so the BTPS water-vapour table is total over the accepted domain"
    error_id: ERR_AMBIENT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /pft-lab/devices/{device_id}/quality-events with event_type VOLUME_CALIBRATION or LEAK_CHECK"
  - priority: 19
    category: business_constraint
    check: "natural keys are unique: Device.device_code, Staff.employee_code, Patient.mrn and RescueMedicationLot.lot_number"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /pft-lab/devices, POST /pft-lab/staff, POST /pft-lab/patients, POST /pft-lab/rescue-lots"
  - priority: 20
    category: business_constraint
    check: "filter_serial on a FILTER_REPLACEMENT event differs from Device.current_filter_serial; refitting the filter that is already on the device is not a filter change"
    error_id: ERR_FILTER_SERIAL_REUSED
    http_status: 409
    applies_to: "POST /pft-lab/devices/{device_id}/quality-events with event_type FILTER_REPLACEMENT"
  - priority: 21
    category: state
    check: "expected_order_version equals TestOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /pft-lab/test-orders/{order_id}/medication-holds"
  - priority: 22
    category: state
    check: "expected_session_version equals TestSession.version"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /pft-lab/test-sessions/{session_id}/interpretation-reports"
  - priority: 23
    category: state
    check: "TestOrder.status permits the requested operation: submit needs DRAFT or INDICATION_REJECTED, PATCH needs DRAFT or INDICATION_REJECTED, cancel needs a non-terminal status, hold issuance needs SUBMITTED, MED_HOLD_ISSUED or READY (a READY order still accepts a replacement hold, which is the only way to clear a VIOLATED one), session creation needs READY"
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /pft-lab/test-orders/{order_id}/submit, PATCH /pft-lab/test-orders/{order_id}, POST /pft-lab/test-orders/{order_id}/cancel, POST /pft-lab/test-orders/{order_id}/medication-holds, POST /pft-lab/test-sessions"
  - priority: 24
    category: state
    check: "MedicationHold.status is PENDING"
    error_id: ERR_HOLD_STATE_INVALID
    http_status: 409
    applies_to: "POST /pft-lab/medication-holds/{hold_id}/attest"
  - priority: 25
    category: state
    check: "TestSession.session_status permits the requested operation: maneuver append needs SCHEDULED, IN_PROGRESS or REJECTED, finalize-quality needs IN_PROGRESS, challenge-run creation needs IN_PROGRESS, report assignment needs ACCEPTED, custody events need a non-terminal session_status"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    applies_to: "all /pft-lab/test-sessions/{session_id} sub-resource POSTs"
  - priority: 26
    category: state
    check: "ChallengeRun.status permits the requested operation: steps need ARMED or IN_PROGRESS, abort needs ARMED or IN_PROGRESS"
    error_id: ERR_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /pft-lab/challenge-runs/{run_id}/steps, POST /pft-lab/challenge-runs/{run_id}/abort"
  - priority: 27
    category: state
    check: "InterpretationReport.status permits the requested operation: sign needs ASSIGNED or AMENDED, amend needs SIGNED"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pft-lab/interpretation-reports/{report_id}/sign, POST /pft-lab/interpretation-reports/{report_id}/amend"
  - priority: 28
    category: state
    check: "Device.status permits the requested operation: session creation and maneuver append need AVAILABLE, return-to-service needs QUARANTINED"
    error_id: ERR_DEVICE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /pft-lab/test-sessions, POST /pft-lab/test-sessions/{session_id}/maneuvers, POST /pft-lab/devices/{device_id}/return-to-service"
  - priority: 29
    category: state
    check: "TestSession.rejection_round is strictly below MAX_REJECTION_ROUNDS (2) before a new coaching round is opened"
    error_id: ERR_MAX_REJECTION_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /pft-lab/test-sessions/{session_id}/maneuvers when session_status is REJECTED"
  - priority: 30
    category: business_safety
    check: "the indication_code is compatible with the order's test_context: test_context DISABILITY_EVALUATION admits only indication_code DISABILITY_ASSESSMENT, test_context OCCUPATIONAL_SURVEILLANCE admits only OCCUPATIONAL_SURVEILLANCE_ANNUAL, and test_context ROUTINE_CLINICAL admits only DYSPNEA_EVALUATION, ASTHMA_DIAGNOSIS, COPD_STAGING, PREOP_ASSESSMENT or RESTRICTIVE_DISEASE_EVALUATION. This is a hard 422 and preempts the softer modality-approval check that would otherwise park the order in INDICATION_REJECTED with HTTP 200"
    error_id: ERR_INDICATION_CONTEXT_MISMATCH
    http_status: 422
    applies_to: "POST /pft-lab/test-orders/{order_id}/submit"
  - priority: 31
    category: business_safety
    check: "bronchoprovocation is not contraindicated by the patient's current airflow: TestSession.fev1_pct_predicted is at least CHALLENGE_MIN_FEV1_PCT (60.0). A session whose best pre-bronchodilator FEV1 sits below 60.0 percent of predicted may never be provoked, whatever the order asked for"
    error_id: ERR_CHALLENGE_CONTRAINDICATED
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions/{session_id}/challenge-runs"
  - priority: 32
    category: business_safety
    check: "the Device.modality is a member of TestOrder.requested_modalities"
    error_id: ERR_DEVICE_MODALITY_MISMATCH
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 33
    category: business_safety
    check: "the acting Technologist's credential covers the device modality (credentialed_modalities contains Device.modality) and competency_expires_on is on or after the current logical date"
    error_id: ERR_TECH_NOT_QUALIFIED
    http_status: 403
    applies_to: "POST /pft-lab/test-sessions, POST /pft-lab/test-sessions/{session_id}/maneuvers"
  - priority: 34
    category: business_safety
    check: "the device has a VOLUME_CALIBRATION event with outcome PASS whose performed_at is on or after the start of the current logical UTC day"
    error_id: ERR_CALIBRATION_STALE
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 35
    category: business_safety
    check: "Device.last_biologic_control_date equals the current logical UTC date, i.e. a BIOLOGIC_CONTROL event with outcome PASS or WARN has been recorded today, and Device.consecutive_biologic_failures == 0"
    error_id: ERR_BIOLOGIC_CONTROL_MISSING
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 36
    category: business_safety
    check: "the device carries at least one FILTER_REPLACEMENT event with outcome COMPLETE and at least one HIGH_LEVEL_DISINFECT event with outcome COMPLETE whose performed_at is strictly after Device.last_session_end_at, or, when last_session_end_at is null, at any time since registration; the between-patient filter change and the full disinfectant dwell must both have happened since the previous patient"
    error_id: ERR_INFECTION_CONTROL_INCOMPLETE
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions, POST /pft-lab/devices/{device_id}/return-to-service"
  - priority: 37
    category: business_safety
    check: "conditional on modality: a device whose modality is DLCO or PLETHYSMOGRAPHY additionally needs a LEAK_CHECK event with outcome COMPLETE whose performed_at is on or after the start of the current logical UTC day. A SPIROMETRY device has no leak-check requirement at all, so the very same session request is legal on one device and rejected on another"
    error_id: ERR_LEAK_CHECK_MISSING
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 38
    category: business_safety
    check: "the acting Staff.id differs from the supplied subject_staff_id; a technologist may not serve as their own biologic control subject, and the subject must have is_biologic_control true with a non-null baseline_fev1_l"
    error_id: ERR_SELF_BIOLOGIC_CONTROL
    http_status: 422
    applies_to: "POST /pft-lab/devices/{device_id}/quality-events with event_type BIOLOGIC_CONTROL"
  - priority: 39
    category: business_safety
    check: "every non-SUPERSEDED MedicationHold on the order has status ATTESTED; a VIOLATED hold blocks the session outright"
    error_id: ERR_MED_HOLD_VIOLATED
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 40
    category: business_temporal
    check: "the current logical clock is on or after TestOrder.hold_release_at (inclusive)"
    error_id: ERR_MED_HOLD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 41
    category: business_safety
    check: "a maneuver whose computed acceptability is UNACCEPTABLE carries a non-empty coaching_note, so every rejected blow leaves a technologist coaching record"
    error_id: ERR_COACHING_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions/{session_id}/maneuvers"
  - priority: 42
    category: business_safety
    check: "the actor is independent of the work being cleared. On sign, the acting Staff.id differs from TestSession.technologist_staff_id of the session under interpretation, so the technologist who coached the maneuvers can never sign their interpretation. On return-to-service, both clearing quality events (the post-quarantine PASS VOLUME_CALIBRATION and the post-quarantine PASS BIOLOGIC_CONTROL) have performed_by_staff_id different from Device.quarantine_trigger_staff_id, so the technologist whose event quarantined the device may not also be the one who proves it healthy again"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pft-lab/interpretation-reports/{report_id}/sign, POST /pft-lab/devices/{device_id}/return-to-service"
  - priority: 43
    category: business_referential
    check: "the session's TestOrder has challenge_type other than NONE and the supplied agent equals that challenge_type"
    error_id: ERR_CHALLENGE_NOT_REQUESTED
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions/{session_id}/challenge-runs"
  - priority: 44
    category: business_safety
    check: "the nominated RescueMedicationLot has status STOCKED and expires_on on or after the current logical date"
    error_id: ERR_RESCUE_NOT_READY
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions/{session_id}/challenge-runs"
  - priority: 45
    category: business_constraint
    check: "cumulative_dose_units + dose_units does not exceed MAX_CUMULATIVE_DOSE_UNITS; landing exactly on the maximum is permitted"
    error_id: ERR_MAX_DOSE_EXCEEDED
    http_status: 422
    applies_to: "POST /pft-lab/challenge-runs/{run_id}/steps"
  - priority: 46
    category: business_referential
    check: "custody operations are only valid on a session whose custody_status is not NOT_APPLICABLE, i.e. whose order test_context is OCCUPATIONAL_SURVEILLANCE or DISABILITY_EVALUATION"
    error_id: ERR_CUSTODY_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions/{session_id}/custody-events"
  - priority: 47
    category: business_referential
    check: "the custody event_type is the legal successor of the current custody_status: ID_VERIFIED from CUSTODY_OPEN, SEAL_APPLIED from CUSTODY_ID_VERIFIED, SEAL_BROKEN from CUSTODY_SEALED; WITNESS_SIGNED is legal from any applicable custody_status"
    error_id: ERR_CUSTODY_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /pft-lab/test-sessions/{session_id}/custody-events"
  - priority: 48
    category: business_referential
    check: "for a session whose order test_context is not ROUTINE_CLINICAL, TestSession.custody_status is exactly CUSTODY_SEALED at signing time"
    error_id: ERR_CUSTODY_NOT_SEALED
    http_status: 422
    applies_to: "POST /pft-lab/interpretation-reports/{report_id}/sign"
  - priority: 49
    category: business_referential
    check: "for a session whose order test_context is DISABILITY_EVALUATION, at least one CustodyEvent with event_type WITNESS_SIGNED exists on that session"
    error_id: ERR_WITNESS_ATTESTATION_MISSING
    http_status: 422
    applies_to: "POST /pft-lab/interpretation-reports/{report_id}/sign"
  - priority: 50
    category: business_temporal
    check: "the requested [scheduled_start_at, scheduled_end_at) interval, extended by DEVICE_TURNAROUND_MINUTES (20 whole minutes) at its end, does not overlap the identically extended interval of any other SCHEDULED or IN_PROGRESS session on the same device; intervals that merely touch are accepted"
    error_id: ERR_DEVICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 51
    category: business_temporal
    check: "the acting technologist has fewer than TECH_MAX_CONCURRENT_SESSIONS (2) SCHEDULED or IN_PROGRESS sessions whose closed interval [scheduled_start_at, scheduled_end_at] intersects the requested closed interval; touching endpoints DO count as an intersection for staff"
    error_id: ERR_TECHNOLOGIST_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 52
    category: business_referential
    check: "at least one Staff row satisfies the interpreter eligibility filter"
    error_id: ERR_NO_ELIGIBLE_INTERPRETER
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions/{session_id}/interpretation-reports"
  - priority: 53
    category: business_referential
    check: "at least one ACTIVE ReferenceEquationSet satisfies the modality, age and sex eligibility filter"
    error_id: ERR_NO_REFERENCE_EQUATION
    http_status: 422
    applies_to: "POST /pft-lab/test-sessions"
  - priority: 54
    category: business_fiscal
    check: "the nominated lot has at least RESCUE_RESERVE_DOSES unreserved doses left, i.e. doses_remaining - doses_reserved >= RESCUE_RESERVE_DOSES. Checked last, after every safety gate, so a lot that is both expired and short-stocked reports the safety failure"
    error_id: ERR_RESCUE_DOSES_INSUFFICIENT
    http_status: 409
    applies_to: "POST /pft-lab/test-sessions/{session_id}/challenge-runs"

# =============================================================================
# 1.5 API Endpoints (42 endpoints, all under the /pft-lab prefix)
# =============================================================================
endpoints:
  # --- Devices and device quality events ------------------------------------
  - method: POST
    path: "/pft-lab/devices"
    description: "Register a pulmonary function testing device. It starts in status NEW and cannot host a session until it has passed calibration, biologic control and infection control for the current logical day."
    roles: [LabManager]
    code: 201
    input: [device_code, modality]
    output: Device
    side_effects: ["Device created with status NEW, sessions_since_filter_change 0 and version 1"]
  - method: GET
    path: "/pft-lab/devices/{device_id}"
    description: "Fetch one device, including its calibration, biologic control and soiling bookkeeping."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: "/pft-lab/devices"
    description: "List devices. quarantine_trigger_staff_id filters to the devices a given staff member's failing biologic control quarantined."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: ["status?", "modality?", "quarantine_trigger_staff_id?", "limit?", "offset?"]
    output: Device[]
    side_effects: []
  - method: POST
    path: "/pft-lab/devices/{device_id}/quality-events"
    description: "Record one append-only quality event against a device. event_type selects which conditional field set is required and which computation runs: VOLUME_CALIBRATION runs the BTPS syringe check, LEAK_CHECK records ambient conditions for closed-circuit modalities, BIOLOGIC_CONTROL runs the deviation check against the control subject, FILTER_REPLACEMENT and HIGH_LEVEL_DISINFECT are the two halves of the between-patient infection-control cycle."
    roles: [Technologist]
    code: 201
    input: [event_type, "measured_volume_l?", "ambient_temp_c?", "barometric_pressure_kpa?", "subject_staff_id?", "measured_fev1_l?", "measured_fvc_l?", "filter_serial?", "dwell_minutes?", "note?"]
    output: DeviceQualityEvent
    side_effects:
      - "VOLUME_CALIBRATION: runs calculations.calibration_btps_error, storing btps_factor, corrected_volume_l, error_pct, outcome and failure_reason; a PASS refreshes Device.last_calibration_at and promotes a NEW device to AVAILABLE, a FAIL sets Device.status QUARANTINED with quarantine_reason CALIBRATION_FAILED"
      - "LEAK_CHECK: outcome is always COMPLETE and failure_reason null; nothing on Device changes except that the event now satisfies the same-day leak-check gate for DLCO and PLETHYSMOGRAPHY devices"
      - "BIOLOGIC_CONTROL: runs calculations.biologic_control_deviation, storing deviation_pct, deviation_variant, rolling_mean_fev1_l and outcome; PASS or WARN advances Device.last_biologic_control_date, FAIL sets Device.status QUARANTINED with quarantine_reason BIOLOGIC_CONTROL_FAILED and increments consecutive_biologic_failures, which cascades every SCHEDULED or IN_PROGRESS session on that device to ABORTED"
      - "FILTER_REPLACEMENT: outcome is always COMPLETE; Device.current_filter_serial := filter_serial and Device.sessions_since_filter_change := 0"
      - "HIGH_LEVEL_DISINFECT: outcome is COMPLETE when dwell_minutes >= MIN_DWELL_MINUTES (20), else INCOMPLETE with failure_reason DWELL_TIME_SHORT"
      - "a SOILED device returns to AVAILABLE only once both a COMPLETE FILTER_REPLACEMENT and a COMPLETE HIGH_LEVEL_DISINFECT exist with performed_at after Device.last_session_end_at"
      - "increments Device.version by 1"
  - method: GET
    path: "/pft-lab/device-quality-events/{event_id}"
    description: "Fetch one quality event with its computed verdict fields."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: DeviceQualityEvent
    side_effects: []
  - method: GET
    path: "/pft-lab/device-quality-events"
    description: "List quality events. This is the only discovery channel for the events created by a quality submission and the audit trail a compliance reviewer walks."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: ["device_id?", "subject_staff_id?", "performed_by_staff_id?", "event_type?", "outcome?", "limit?", "offset?"]
    output: DeviceQualityEvent[]
    side_effects: []
  - method: POST
    path: "/pft-lab/devices/{device_id}/return-to-service"
    description: "Clear a QUARANTINED device back to AVAILABLE. The device must already carry a PASS VOLUME_CALIBRATION and a PASS BIOLOGIC_CONTROL recorded after it was quarantined, both performed by someone other than the technologist whose failing event quarantined it, plus a complete infection-control cycle."
    roles: [LabManager]
    code: 200
    input: [clearance_note]
    output: Device
    side_effects:
      - "Device.status := AVAILABLE"
      - "Device.quarantined_at := null, quarantine_reason := null, quarantine_trigger_staff_id := null"
      - "increments Device.version by 1"

  # --- Staff, patients, configuration --------------------------------------
  - method: POST
    path: "/pft-lab/staff"
    description: "Register a lab staff member. role_type decides which entity_backed role this row can authenticate as; is_biologic_control marks a staff member who serves as the lab's daily biologic control subject."
    roles: [LabManager]
    code: 201
    input: [employee_code, full_name, role_type, credential, competency_expires_on, credentialed_modalities, "status?", "max_concurrent_reports?", "is_biologic_control?", "baseline_fev1_l?", "baseline_fvc_l?", "baseline_established_on?"]
    output: Staff
    side_effects: ["Staff created with open_report_count 0, status defaulting to ON_DUTY and max_concurrent_reports defaulting to 1"]
  - method: GET
    path: "/pft-lab/staff/{staff_id}"
    description: "Fetch one staff member, including the live open_report_count that the interpreter selector ranks on."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: Staff
    side_effects: []
  - method: POST
    path: "/pft-lab/patients"
    description: "Register a patient. height_cm and birth_date feed the predicted-value regressions, so they are pinned into every session created for this patient."
    roles: [LabManager, OrderingPhysician]
    code: 201
    input: [mrn, full_name, birth_date, sex, height_cm, weight_kg, smoking_status]
    output: Patient
    side_effects: ["Patient created with completed_order_count 0"]
  - method: GET
    path: "/pft-lab/patients/{patient_id}"
    description: "Fetch one patient with the derived age_years and completed_order_count."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: POST
    path: "/pft-lab/reference-equations"
    description: "Publish a reference equation set. Creating a second ACTIVE set with the same equation_code supersedes the earlier one. bd_criterion on the set selected for a session decides which bronchodilator-response variant that session uses."
    roles: [LabManager]
    code: 201
    input: [equation_code, modality_scope, sex_scope, applicable_age_min, applicable_age_max, lln_percentile, ratio_lln, a_fev1, b_fev1, c_fev1, a_fvc, b_fvc, c_fvc, rsd_frac, bd_criterion]
    output: ReferenceEquationSet
    side_effects:
      - "ReferenceEquationSet created with status ACTIVE"
      - "any prior ACTIVE set with the same equation_code moves to status SUPERSEDED and leaves the selector pool"
  - method: POST
    path: "/pft-lab/rescue-lots"
    description: "Receive a lot of rescue bronchodilator. Challenge testing cannot be armed without an unexpired lot holding enough unreserved doses."
    roles: [LabManager]
    code: 201
    input: [lot_number, drug, doses_at_receipt, expires_on]
    output: RescueMedicationLot
    side_effects: ["RescueMedicationLot created with status STOCKED, doses_remaining = doses_at_receipt and doses_reserved 0"]
  - method: GET
    path: "/pft-lab/rescue-lots/{lot_id}"
    description: "Fetch one rescue lot with its live doses_remaining and doses_reserved, the two sides of the rescue-dose ledger invariant."
    roles: [LabManager, Technologist, ComplianceAuditor]
    code: 200
    input: []
    output: RescueMedicationLot
    side_effects: []

  # --- Test orders and medication holds -------------------------------------
  - method: POST
    path: "/pft-lab/test-orders"
    description: "Draft a test order. Indication validation is deferred to submit, so a draft may legitimately hold an indication_code that its test_context will later reject."
    roles: [OrderingPhysician]
    code: 201
    input: [patient_id, indication_code, requested_modalities, test_context, "bronchodilator_requested?", "challenge_type?", "current_medication_classes?"]
    output: TestOrder
    side_effects: ["TestOrder created with status DRAFT, abort_count 0, hold_release_at null and version 1"]
  - method: GET
    path: "/pft-lab/test-orders/{order_id}"
    description: "Fetch one test order with its live status and version, the value an OCC-guarded hold issuance must echo."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: TestOrder
    side_effects: []
  - method: GET
    path: "/pft-lab/test-orders"
    description: "List test orders, filterable by patient and by the ordering physician who raised them."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: ["patient_id?", "ordering_staff_id?", "status?", "limit?", "offset?"]
    output: TestOrder[]
    side_effects: []
  - method: POST
    path: "/pft-lab/test-orders/{order_id}/submit"
    description: |
      Submit a draft for indication validation. Two distinct gates run, in this order.
      First a hard context gate: an indication_code that does not belong to the order's
      test_context is a 422 ERR_INDICATION_CONTEXT_MISMATCH and nothing is persisted.
      Second a soft modality-approval gate against the fixed table
      APPROVED_INDICATION_MODALITIES = { DYSPNEA_EVALUATION: [SPIROMETRY, DLCO],
      ASTHMA_DIAGNOSIS: [SPIROMETRY], COPD_STAGING: [SPIROMETRY, DLCO, PLETHYSMOGRAPHY],
      PREOP_ASSESSMENT: [SPIROMETRY, DLCO], DISABILITY_ASSESSMENT: [SPIROMETRY, DLCO,
      PLETHYSMOGRAPHY], OCCUPATIONAL_SURVEILLANCE_ANNUAL: [SPIROMETRY],
      RESTRICTIVE_DISEASE_EVALUATION: [SPIROMETRY, PLETHYSMOGRAPHY, DLCO] }, plus the rule
      that a non-NONE challenge_type is only approved for ASTHMA_DIAGNOSIS. Failing the
      soft gate is a lab workflow outcome, not a client error: the response is 200 and the
      order is parked in INDICATION_REJECTED awaiting revision.
    roles: [OrderingPhysician]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "all gates pass and current_medication_classes is non-empty: TestOrder.status := SUBMITTED and rejection_reason := null"
      - "all gates pass and current_medication_classes is empty: TestOrder.status := READY directly, because there is nothing to withhold"
      - "the modality-approval or challenge-indication gate fails: TestOrder.status := INDICATION_REJECTED with rejection_reason MODALITY_NOT_APPROVED_FOR_INDICATION or CHALLENGE_INDICATION_MISMATCH, returned as HTTP 200"
      - "increments TestOrder.version by 1"
  - method: PATCH
    path: "/pft-lab/test-orders/{order_id}"
    description: "Revise a DRAFT or INDICATION_REJECTED order. Revising a rejected order returns it to DRAFT, closing the revision cycle."
    roles: [OrderingPhysician]
    code: 200
    input: ["indication_code?", "requested_modalities?", "bronchodilator_requested?", "challenge_type?"]
    output: TestOrder
    side_effects:
      - "supplied fields are replaced; omitted fields are untouched"
      - "TestOrder.status := DRAFT when it was INDICATION_REJECTED"
      - "increments TestOrder.version by 1"
  - method: POST
    path: "/pft-lab/test-orders/{order_id}/cancel"
    description: "Cancel a non-terminal order. Cancellation supersedes every outstanding medication hold and aborts every live session on the order."
    roles: [OrderingPhysician, LabManager]
    code: 200
    input: [cancellation_reason]
    output: TestOrder
    side_effects:
      - "TestOrder.status := CANCELLED"
      - "every MedicationHold on the order with status PENDING moves to SUPERSEDED and hold_release_at becomes null"
      - "every TestSession on the order with session_status SCHEDULED or IN_PROGRESS moves to ABORTED with abort_reason ORDER_CANCELLED, which in turn aborts their live challenge runs and releases or spends the reserved rescue doses"
      - "increments TestOrder.version by 1"
  - method: POST
    path: "/pft-lab/test-orders/{order_id}/medication-holds"
    description: "Issue a pre-test medication hold instruction for one medication class. OCC-guarded on the parent order's version. A new hold for a class that already carries a PENDING or VIOLATED hold supersedes it and restarts that class's withholding window."
    roles: [Technologist]
    code: 201
    input: [medication_class, expected_order_version]
    output: MedicationHold
    side_effects:
      - "MedicationHold created with status PENDING, required_hold_hours := HOLD_HOURS_BY_CLASS[medication_class], instructed_at := current logical clock and release_at := instructed_at + required_hold_hours hours"
      - "any prior PENDING or VIOLATED hold for the same medication_class on this order moves to SUPERSEDED"
      - "TestOrder.hold_release_at is recomputed per calculations.medication_hold_release and TestOrder.status moves SUBMITTED -> MED_HOLD_ISSUED on the first hold"
      - "increments TestOrder.version by 1"
  - method: GET
    path: "/pft-lab/test-orders/{order_id}/medication-holds"
    description: "List the medication holds issued against an order, including superseded ones, which is the only discovery channel for holds created or superseded by cascade."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MedicationHold[]
    side_effects: []
  - method: GET
    path: "/pft-lab/medication-holds/{hold_id}"
    description: "Fetch one medication hold with its computed release instant and attestation verdict."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: MedicationHold
    side_effects: []
  - method: GET
    path: "/pft-lab/medication-holds"
    description: "List medication holds across orders. order_id narrows to one order and status finds every VIOLATED hold still blocking testing lab-wide."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: ["order_id?", "medication_class?", "status?", "limit?", "offset?"]
    output: MedicationHold[]
    side_effects: []
  - method: POST
    path: "/pft-lab/medication-holds/{hold_id}/attest"
    description: "Record the patient's attestation for one hold. WITHHELD attests compliance; TAKEN marks the hold VIOLATED and permanently blocks session creation until a replacement hold supersedes it."
    roles: [Technologist]
    code: 200
    input: [attestation_result]
    output: MedicationHold
    side_effects:
      - "MedicationHold.status := ATTESTED for WITHHELD or VIOLATED for TAKEN, and attested_at := current logical clock"
      - "TestOrder.hold_release_at is recomputed; when no non-SUPERSEDED hold on the order is still PENDING, TestOrder.status := READY"
      - "increments MedicationHold.version by 1"

  # --- Test sessions, maneuvers, custody ------------------------------------
  - method: POST
    path: "/pft-lab/test-sessions"
    description: "Schedule a session on a READY order and an AVAILABLE device. This is where the reference equation is selected and the predicted values, LLN and ratio LLN are pinned onto the session; it is also where device occupancy and technologist workload conflicts are detected."
    roles: [Technologist]
    code: 201
    input: [order_id, device_id, scheduled_start_at, scheduled_end_at]
    output: TestSession
    side_effects:
      - "runs calculations.reference_equation_selection_and_predicted_values, pinning reference_equation_id, reference_equation_code, predicted_fev1_l, predicted_fvc_l, lln_fev1_l and ratio_lln"
      - "TestSession created with session_status SCHEDULED, rejection_round 0, technologist_staff_id := the acting staff id, and custody_status NOT_APPLICABLE for a ROUTINE_CLINICAL order or CUSTODY_OPEN otherwise"
      - "TestOrder.status := IN_TESTING"
      - "increments TestOrder.version by 1"
  - method: GET
    path: "/pft-lab/test-sessions/{session_id}"
    description: "Fetch one session with both state dimensions, the pinned predicted values, the live best values and the current quality grade and version."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: TestSession
    side_effects: []
  - method: GET
    path: "/pft-lab/test-sessions"
    description: "List sessions. reference_equation_id finds every session pinned to a given equation set and technologist_staff_id finds a technologist's workload."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: ["order_id?", "device_id?", "technologist_staff_id?", "reference_equation_id?", "session_status?", "custody_status?", "limit?", "offset?"]
    output: TestSession[]
    side_effects: []
  - method: POST
    path: "/pft-lab/test-sessions/{session_id}/maneuvers"
    description: "Record one forced expiratory maneuver. Acceptability is computed from the ATS/ERS start-of-test, end-of-test and artifact criteria; an unacceptable blow demands a coaching note. Every append recomputes the session's best values, repeatability deltas and quality grade."
    roles: [Technologist]
    code: 201
    input: [phase, fvc_l, fev1_l, pef_l_s, back_extrapolated_volume_ml, expiratory_time_s, plateau_reached, cough_in_first_second, glottic_closure, "coaching_note?"]
    output: Maneuver
    side_effects:
      - "Maneuver created with maneuver_index, bev_limit_ml, acceptability and rejection_reasons computed per calculations.maneuver_acceptability_and_session_quality"
      - "TestSession best values, acceptable_maneuver_count, both repeatability deltas, quality_grade, fev1_pct_predicted, fvc_pct_predicted and fev1_fvc_ratio are recomputed"
      - "TestSession.session_status := IN_PROGRESS from SCHEDULED or REJECTED"
      - "increments TestSession.version by 1"
  - method: GET
    path: "/pft-lab/test-sessions/{session_id}/maneuvers"
    description: "List the maneuvers of a session with their computed acceptability verdicts and coaching notes."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: ["phase?", "acceptability?", "limit?", "offset?"]
    output: Maneuver[]
    side_effects: []
  - method: GET
    path: "/pft-lab/maneuvers/{maneuver_id}"
    description: "Fetch one maneuver with its computed bev_limit_ml, acceptability and rejection_reasons."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: Maneuver
    side_effects: []
  - method: GET
    path: "/pft-lab/maneuvers"
    description: "List maneuvers across sessions. session_id narrows to one session and acceptability finds every rejected blow a coaching review needs."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: ["session_id?", "phase?", "acceptability?", "limit?", "offset?"]
    output: Maneuver[]
    side_effects: []
  - method: POST
    path: "/pft-lab/test-sessions/{session_id}/finalize-quality"
    description: "Close the maneuver-collection phase. A grade of A, B or C accepts the session and soils the device; a grade of D or F rejects it and opens another coaching round, up to MAX_REJECTION_ROUNDS."
    roles: [Technologist]
    code: 200
    input: ["technologist_comment?"]
    output: TestSession
    side_effects:
      - "runs calculations.bronchodilator_response when the order requested a bronchodilator and a post-bronchodilator maneuver exists"
      - "TestSession.session_status := ACCEPTED for grade A, B or C, else REJECTED with rejection_round incremented"
      - "Device.status := SOILED, last_session_end_at and sessions_since_filter_change updated on ACCEPTED, and on REJECTED only when the post-increment rejection_round reaches MAX_REJECTION_ROUNDS"
      - "increments TestSession.version by 1"
  - method: POST
    path: "/pft-lab/test-sessions/{session_id}/custody-events"
    description: "Append a chain-of-custody event. ID_VERIFIED, SEAL_APPLIED and SEAL_BROKEN advance the custody dimension in strict order and are technologist actions; WITNESS_SIGNED is a compliance auditor attestation that leaves the custody dimension untouched."
    roles: [Technologist, ComplianceAuditor]
    code: 201
    input: [event_type, "seal_serial?", "id_document_type?", "note?"]
    output: CustodyEvent
    side_effects:
      - "CustodyEvent created with actor_user_id and actor_role taken from the request headers and performed_at from the logical clock"
      - "TestSession.custody_status advances to the event's target state, with session_status untouched; WITNESS_SIGNED leaves custody_status unchanged"
      - "increments TestSession.version by 1"
  - method: GET
    path: "/pft-lab/test-sessions/{session_id}/custody-events"
    description: "List the custody chain of a session in append order, the evidence a disability report's witness requirement is checked against."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []
  - method: GET
    path: "/pft-lab/custody-events/{event_id}"
    description: "Fetch one custody event with its actor identity and performed_at instant."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: CustodyEvent
    side_effects: []
  - method: GET
    path: "/pft-lab/custody-events"
    description: "List custody events across sessions. session_id walks one chain and event_type finds every WITNESS_SIGNED attestation a disability audit samples."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: ["session_id?", "event_type?", "actor_user_id?", "limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  # --- Challenge testing -----------------------------------------------------
  - method: POST
    path: "/pft-lab/test-sessions/{session_id}/challenge-runs"
    description: "Arm a bronchoprovocation run on an in-progress session. Rescue medication readiness is checked before dose reservation: an expired or non-STOCKED lot is a safety failure, and only after that gate passes is the lot's unreserved dose count consulted."
    roles: [Technologist]
    code: 201
    input: [agent, rescue_lot_id]
    output: ChallengeRun
    side_effects:
      - "ChallengeRun created with status ARMED, baseline_fev1_l pinned from TestSession.best_fev1_l, cumulative_dose_units 0, current_step_index 0, max_fev1_drop_pct 0.00 and rescue_doses_administered 0"
      - "RescueMedicationLot.doses_reserved += RESCUE_RESERVE_DOSES with doses_remaining untouched"
  - method: GET
    path: "/pft-lab/challenge-runs/{run_id}"
    description: "Fetch one challenge run with its dose accumulators, interpolated PC20 and rescue-dose consumption."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: ChallengeRun
    side_effects: []
  - method: GET
    path: "/pft-lab/challenge-runs"
    description: "List challenge runs. rescue_lot_id gathers every run drawing on one lot, which is how the rescue-dose ledger invariant is reconciled from outside."
    roles: [LabManager, Technologist, InterpretingPhysician, ComplianceAuditor]
    code: 200
    input: ["session_id?", "rescue_lot_id?", "status?", "limit?", "offset?"]
    output: ChallengeRun[]
    side_effects: []
  - method: POST
    path: "/pft-lab/challenge-runs/{run_id}/steps"
    description: "Record one provocation step: the dose given and the FEV1 measured after it. The run stops itself when the drop reaches PC20_THRESHOLD_PCT, and completes negative when the cumulative dose lands exactly on MAX_CUMULATIVE_DOSE_UNITS."
    roles: [Technologist]
    code: 200
    input: [dose_units, post_step_fev1_l]
    output: ChallengeRun
    side_effects:
      - "runs calculations.challenge_pc20_and_rescue_ledger, updating current_step_index, cumulative_dose_units, last_step_dose_units, last_step_drop_pct and max_fev1_drop_pct"
      - "on a threshold crossing: status := STOPPED_PC20, stop_reason := PC20_REACHED and pc20_dose_units interpolated between the previous and current cumulative doses"
      - "on landing exactly on MAX_CUMULATIVE_DOSE_UNITS below threshold: status := COMPLETED_NEGATIVE, stop_reason := MAX_CUMULATIVE_DOSE_REACHED"
      - "on either terminal branch: rescue_doses_administered := RESCUE_ADMIN_DOSES, RescueMedicationLot.doses_remaining -= RESCUE_ADMIN_DOSES, doses_reserved -= RESCUE_RESERVE_DOSES, and the lot moves STOCKED -> DEPLETED at zero"
      - "increments ChallengeRun.version by 1"
  - method: POST
    path: "/pft-lab/challenge-runs/{run_id}/abort"
    description: "Abort a run for safety. Aborting before any dose has been given releases the whole rescue reservation untouched; aborting after a dose spends it and aborts the parent session."
    roles: [Technologist]
    code: 200
    input: [abort_reason]
    output: ChallengeRun
    side_effects:
      - "ChallengeRun.status := ABORTED_SAFETY, stop_reason := TECHNOLOGIST_ABORT"
      - "current_step_index == 0: rescue_doses_administered stays 0, RescueMedicationLot.doses_reserved -= RESCUE_RESERVE_DOSES, doses_remaining untouched, session untouched"
      - "current_step_index >= 1: rescue_doses_administered := RESCUE_ADMIN_DOSES, doses_remaining -= RESCUE_ADMIN_DOSES, doses_reserved -= RESCUE_RESERVE_DOSES, and TestSession.session_status := ABORTED with abort_reason CHALLENGE_SAFETY_ABORT, which drives the order IN_TESTING -> READY"
      - "increments ChallengeRun.version by 1"

  # --- Interpretation and reporting -----------------------------------------
  - method: POST
    path: "/pft-lab/test-sessions/{session_id}/interpretation-reports"
    description: "Assign an accepted session to an interpreting physician. OCC-guarded on the session's version. The least-loaded eligible interpreter wins, the session's own technologist is never eligible, and the SLA deadline is computed from the queue load measured after this report exists."
    roles: [LabManager]
    code: 201
    input: [expected_session_version]
    output: InterpretationReport
    side_effects:
      - "runs calculations.interpreter_assignment_selection to pick interpreter_staff_id and increment that Staff.open_report_count"
      - "runs calculations.interpretation_sla_and_turnaround to store queue_load_pct, load_tier, sla_minutes, assigned_at and due_at"
      - "InterpretationReport created with status ASSIGNED, amendment_count 0, reference_equation_code copied from the session and template_version null until signing"
      - "any prior InterpretationReport on this session with status ASSIGNED moves to REASSIGNED with superseded_by_report_id set to the new report, decrementing the losing interpreter's open_report_count"
      - "increments TestSession.version by 1"
  - method: GET
    path: "/pft-lab/interpretation-reports/{report_id}"
    description: "Fetch one report with its SLA bookkeeping, interpretation pattern and severity."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: []
    output: InterpretationReport
    side_effects: []
  - method: GET
    path: "/pft-lab/interpretation-reports"
    description: "List reports. superseded_by_report_id walks the supersession chain backwards from a winning assignment to the reassigned ones it displaced."
    roles: [LabManager, Technologist, InterpretingPhysician, OrderingPhysician, ComplianceAuditor]
    code: 200
    input: ["session_id?", "interpreter_staff_id?", "superseded_by_report_id?", "status?", "limit?", "offset?"]
    output: InterpretationReport[]
    side_effects: []
  - method: POST
    path: "/pft-lab/interpretation-reports/{report_id}/sign"
    description: "Sign an assigned or amended report. Signing computes the interpretation pattern and severity from the session's ratio, its LLN and the percent-predicted values, and enforces the chain-of-custody and segregation-of-duties gates that occupational and disability testing demand."
    roles: [InterpretingPhysician]
    code: 200
    input: [clinical_comment]
    output: InterpretationReport
    side_effects:
      - "runs calculations.interpretation_pattern_and_severity, storing pattern, severity and template_version"
      - "signed_at := current logical clock, turnaround_minutes and sla_breached computed against the original assigned_at and due_at"
      - "InterpretationReport.status := SIGNED and the interpreter's Staff.open_report_count drops by one"
      - "TestSession.session_status := REPORTED and TestSession.turnaround_minutes copied over, which drives TestOrder IN_TESTING -> COMPLETED and Patient.completed_order_count += 1"
      - "increments InterpretationReport.version by 1"
  - method: POST
    path: "/pft-lab/interpretation-reports/{report_id}/amend"
    description: "Reopen a signed report for amendment. The report re-enters the interpreter's open workload but the original SLA deadline is not reset, so a slow amendment cannot repair a breached turnaround."
    roles: [InterpretingPhysician]
    code: 200
    input: [amendment_reason]
    output: InterpretationReport
    side_effects:
      - "InterpretationReport.status := AMENDED, amendment_count += 1, amendment_reason recorded"
      - "the interpreter's Staff.open_report_count rises by one"
      - "TestSession.session_status stays REPORTED and TestOrder.status stays COMPLETED"
      - "increments InterpretationReport.version by 1"

  # --- Test-driving surface --------------------------------------------------
  - method: POST
    path: "/pft-lab/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every timestamp, deadline, expiry and staleness rule in this API reads instead of wall-clock time. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Advancing the clock is what makes medication-hold elapse windows, competency expiry, lot expiry, baseline staleness, daily calibration validity and report SLA breaches deterministically testable."
    roles: [LabManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock is set to the supplied instant"
      - "every RescueMedicationLot with status STOCKED whose expires_on is strictly before the new logical date transitions to EXPIRED; this is the only producer of the EXPIRED status and it never touches doses_remaining or doses_reserved"
      - "no other entity is mutated and no other state machine advances"

# =============================================================================
# 1.6 Error Code Catalog (52 codes; every one is triggerable through §1.5)
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles, or an InterpretingPhysician acts on a report assigned to a different interpreter, or a Technologist submits a WITNESS_SIGNED custody event"
  - id: ERR_STAFF_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-ID does not resolve to a Staff row, or resolves to one whose role_type does not match the acting entity_backed role"
  # --- existence ---
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "the referenced device_id does not exist"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "the referenced staff_id or subject_staff_id does not exist"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "the referenced patient_id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "the referenced order_id does not exist"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "the referenced hold_id does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "the referenced session_id does not exist"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "the referenced run_id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "the referenced report_id does not exist"
  - id: ERR_QUALITY_EVENT_NOT_FOUND
    http: 404
    condition: "the referenced quality event_id does not exist"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "the referenced rescue lot_id does not exist"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, undeclared enum value, out-of-range number, empty or duplicate-bearing array, or scheduled_end_at not strictly after scheduled_start_at"
  - id: ERR_MISSING_EVENT_FIELDS
    http: 422
    condition: "a polymorphic event body omits a field its event_type requires, or carries a field belonging to a different event_type"
  - id: ERR_AMBIENT_OUT_OF_RANGE
    http: 422
    condition: "ambient_temp_c outside the whole-number range [20, 27] or barometric_pressure_kpa outside [80.00, 110.00] on a VOLUME_CALIBRATION or LEAK_CHECK event"
  # --- uniqueness ---
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "device_code, employee_code, mrn or lot_number collides with an existing row"
  - id: ERR_FILTER_SERIAL_REUSED
    http: 409
    condition: "a FILTER_REPLACEMENT event supplies the filter_serial already recorded as Device.current_filter_serial"
  # --- optimistic concurrency ---
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the parent TestOrder's current version"
  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: "expected_session_version does not equal the parent TestSession's current version"
  # --- state preconditions ---
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "the TestOrder's status does not admit the requested operation, e.g. submitting a READY order or cancelling a COMPLETED one"
  - id: ERR_HOLD_STATE_INVALID
    http: 409
    condition: "attesting a MedicationHold that is not PENDING"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "the TestSession's session_status does not admit the requested operation, e.g. appending a maneuver to an ACCEPTED session or assigning a report to an IN_PROGRESS one"
  - id: ERR_RUN_STATE_INVALID
    http: 409
    condition: "stepping or aborting a ChallengeRun that has already reached a terminal status"
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "signing a SIGNED or REASSIGNED report, or amending a report that is not SIGNED"
  - id: ERR_DEVICE_NOT_AVAILABLE
    http: 409
    condition: "the device's status is not AVAILABLE when a session or maneuver needs it, or not QUARANTINED when return-to-service is called"
  - id: ERR_MAX_REJECTION_ROUNDS_EXCEEDED
    http: 409
    condition: "a maneuver is appended to a REJECTED session whose rejection_round has already reached MAX_REJECTION_ROUNDS"
  # --- safety and compliance ---
  - id: ERR_INDICATION_CONTEXT_MISMATCH
    http: 422
    condition: "the submitted indication_code does not belong to the order's test_context"
  - id: ERR_CHALLENGE_CONTRAINDICATED
    http: 422
    condition: "bronchoprovocation is armed on a session whose fev1_pct_predicted is below CHALLENGE_MIN_FEV1_PCT"
  - id: ERR_CHALLENGE_NOT_REQUESTED
    http: 422
    condition: "a challenge run is armed on an order whose challenge_type is NONE, or the supplied agent differs from the ordered challenge_type"
  - id: ERR_DEVICE_MODALITY_MISMATCH
    http: 422
    condition: "the chosen device's modality is not among the order's requested_modalities"
  - id: ERR_TECH_NOT_QUALIFIED
    http: 403
    condition: "the acting technologist's credentialed_modalities omit the device modality, or their competency_expires_on has passed"
  - id: ERR_CALIBRATION_STALE
    http: 422
    condition: "the device has no VOLUME_CALIBRATION event with outcome PASS dated on or after the start of the current logical day"
  - id: ERR_BIOLOGIC_CONTROL_MISSING
    http: 422
    condition: "Device.last_biologic_control_date is not the current logical date, or Device.consecutive_biologic_failures is above 0"
  - id: ERR_INFECTION_CONTROL_INCOMPLETE
    http: 422
    condition: "the device lacks a COMPLETE FILTER_REPLACEMENT or a COMPLETE HIGH_LEVEL_DISINFECT event performed after its last session end"
  - id: ERR_LEAK_CHECK_MISSING
    http: 422
    condition: "a session is scheduled on a DLCO or PLETHYSMOGRAPHY device that has no COMPLETE LEAK_CHECK event dated on or after the start of the current logical day"
  - id: ERR_SELF_BIOLOGIC_CONTROL
    http: 422
    condition: "the acting technologist nominates themselves as the biologic control subject, or the nominated subject is not enrolled as a control with a stored baseline"
  - id: ERR_MED_HOLD_VIOLATED
    http: 422
    condition: "a session is scheduled while a non-SUPERSEDED MedicationHold on the order is VIOLATED or still PENDING"
  - id: ERR_MED_HOLD_NOT_ELAPSED
    http: 422
    condition: "the logical clock has not yet reached TestOrder.hold_release_at"
  - id: ERR_COACHING_NOTE_REQUIRED
    http: 422
    condition: "a maneuver computed as UNACCEPTABLE arrives without a non-empty coaching_note"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the interpreting physician signing a report is the same Staff row as the session's technologist, or a device is returned to service on clearing events performed by the technologist whose failing event quarantined it"
  - id: ERR_RESCUE_NOT_READY
    http: 422
    condition: "the nominated rescue lot is not STOCKED or has expired as of the current logical date"
  - id: ERR_MAX_DOSE_EXCEEDED
    http: 422
    condition: "a provocation step would push cumulative_dose_units strictly above MAX_CUMULATIVE_DOSE_UNITS"
  # --- chain of custody ---
  - id: ERR_CUSTODY_NOT_APPLICABLE
    http: 422
    condition: "a custody event is appended to a session whose custody_status is NOT_APPLICABLE"
  - id: ERR_CUSTODY_SEQUENCE_INVALID
    http: 409
    condition: "the custody event_type is not the legal successor of the session's current custody_status"
  - id: ERR_CUSTODY_NOT_SEALED
    http: 422
    condition: "a report is signed for a non-ROUTINE_CLINICAL order whose session custody_status is not exactly CUSTODY_SEALED"
  - id: ERR_WITNESS_ATTESTATION_MISSING
    http: 422
    condition: "a report is signed for a DISABILITY_EVALUATION order whose session carries no WITNESS_SIGNED custody event"
  # --- resource conflicts and selectors ---
  - id: ERR_DEVICE_WINDOW_CONFLICT
    http: 409
    condition: "the requested session window, extended by the device turnaround buffer, overlaps another live session on the same device"
  - id: ERR_TECHNOLOGIST_WINDOW_CONFLICT
    http: 409
    condition: "the acting technologist already has TECH_MAX_CONCURRENT_SESSIONS live sessions whose closed windows intersect the requested one"
  - id: ERR_NO_REFERENCE_EQUATION
    http: 422
    condition: "no ACTIVE reference equation set covers the patient's age and sex for the device modality"
  - id: ERR_NO_ELIGIBLE_INTERPRETER
    http: 422
    condition: "no ON_DUTY interpreting physician is credentialed, under capacity and distinct from the session's technologist"
  # --- fiscal / stock (checked last) ---
  - id: ERR_RESCUE_DOSES_INSUFFICIENT
    http: 409
    condition: "the nominated lot's unreserved dose count is below RESCUE_RESERVE_DOSES"

# =============================================================================
# 1.7 RBAC Matrix (segregation_of_duties)
# =============================================================================
roles:
  - name: LabManager
    description: "Laboratory manager. Owns the configuration surface (devices, staff, reference equations, rescue stock), clears quarantined devices back to service, assigns accepted sessions to interpreting physicians and drives the logical clock. Deliberately opaque so that the very first POST /pft-lab/staff is authenticable on an empty database."
    identity: opaque
    exclusive_operations:
      - "POST /pft-lab/devices"
      - "POST /pft-lab/devices/{device_id}/return-to-service"
      - "POST /pft-lab/staff"
      - "POST /pft-lab/reference-equations"
      - "POST /pft-lab/rescue-lots"
      - "POST /pft-lab/test-sessions/{session_id}/interpretation-reports"
      - "POST /pft-lab/_clock/set_current_utc"
    shared_operations:
      - "POST /pft-lab/patients (with OrderingPhysician)"
      - "POST /pft-lab/test-orders/{order_id}/cancel (with OrderingPhysician)"
      - "every GET endpoint"
  - name: Technologist
    description: "Pulmonary function technologist. Runs the daily quality program, issues and attests medication holds, schedules and conducts sessions, coaches maneuvers, arms and steps challenge testing, and maintains the chain of custody up to the seal. May never interpret a session they conducted."
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /pft-lab/devices/{device_id}/quality-events"
      - "POST /pft-lab/test-orders/{order_id}/medication-holds"
      - "POST /pft-lab/medication-holds/{hold_id}/attest"
      - "POST /pft-lab/test-sessions"
      - "POST /pft-lab/test-sessions/{session_id}/maneuvers"
      - "POST /pft-lab/test-sessions/{session_id}/finalize-quality"
      - "POST /pft-lab/test-sessions/{session_id}/challenge-runs"
      - "POST /pft-lab/challenge-runs/{run_id}/steps"
      - "POST /pft-lab/challenge-runs/{run_id}/abort"
    shared_operations:
      - "POST /pft-lab/test-sessions/{session_id}/custody-events for ID_VERIFIED, SEAL_APPLIED and SEAL_BROKEN (with ComplianceAuditor, who owns WITNESS_SIGNED instead)"
      - "every GET endpoint"
  - name: OrderingPhysician
    description: "Referring clinician. Drafts, revises, submits and cancels test orders and may register the patients they refer. Has no access to the testing floor or the interpretation queue."
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /pft-lab/test-orders"
      - "POST /pft-lab/test-orders/{order_id}/submit"
      - "PATCH /pft-lab/test-orders/{order_id}"
    shared_operations:
      - "POST /pft-lab/patients (with LabManager)"
      - "POST /pft-lab/test-orders/{order_id}/cancel (with LabManager)"
      - "every GET endpoint"
  - name: InterpretingPhysician
    description: "Interpreting physician. Signs and amends the reports assigned to them and nothing else. Cannot assign work to themselves, because assignment is the LabManager's exclusive operation and the selector, not the physician, chooses the interpreter."
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /pft-lab/interpretation-reports/{report_id}/sign"
      - "POST /pft-lab/interpretation-reports/{report_id}/amend"
    shared_operations:
      - "every GET endpoint"
  - name: ComplianceAuditor
    description: "Independent compliance witness. Read-only across the whole API with exactly one write: the WITNESS_SIGNED custody attestation that a disability report cannot be signed without. Opaque because the witness is an external auditor, not a lab employee."
    identity: opaque
    exclusive_operations:
      - "POST /pft-lab/test-sessions/{session_id}/custody-events with event_type WITNESS_SIGNED"
    shared_operations:
      - "every GET endpoint"
