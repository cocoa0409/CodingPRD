  # ===================================================================
  # Section: cross_cutting_layers
  # ===================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_order_create_stale_patient_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-create-stale-patient-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on PatientProfile.version: after a first order create bumps the patient version 1 -> 2, a second create for a DIFFERENT drug carrying the stale expected_patient_version 1 is rejected ERR_STALE_VERSION (412) even though the business state still permits ordering."
        test_recipe:
          setup: ["Patient (version 1); two drugs A and B; first create for A succeeds"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr OCC", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat OCC", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugOCCA", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_a: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugOCCB", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_b: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_a}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_b}", route: "PO", ordered_dose_mg: 50.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_b}", route: "PO", ordered_dose_mg: 50.0, frequency_per_day: 1, expected_patient_version: "${pat_v} + 1" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o2: $.data.id }
          assert:
            - "first create advanced patient version to ${pat_v} + 1"
            - "create with stale expected version ${pat_v}: error_id == ERR_STALE_VERSION (412)"
            - "retry with the fresh version ${pat_v} + 1 succeeds (201): order for drug B created PENDING"
      - name: occ_pocket_restock_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[pocket-restock-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ADCPocket.version: after a dispense mutates the pocket (version 2 -> 3), a restock carrying the pre-dispense version 2 is rejected ERR_STALE_VERSION (412) even though restock on an ACTIVE pocket is otherwise always legitimate."
        test_recipe:
          setup: ["Pocket restocked to 10 (version 2); verified PO order; a dispense bumps the pocket to version 3"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr OC2", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech OC2", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Nurse OC2", staff_role: "NURSE" }
              as: PharmacyAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat OC2", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugOC2", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-OC2", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_id}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id, pk_v: $.data.version }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 10, expected_pocket_version: "${pk_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { pk_v2: $.data.version }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/dispense"
              payload: { order_id: "${ord_id}", units: 1 }
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 5, expected_pocket_version: "${pk_v2}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 5, expected_pocket_version: "${pk_v2} + 1" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { ok_onhand: $.data.on_hand_units }
          assert:
            - "restock with stale expected version ${pk_v2} (pre-dispense): error_id == ERR_STALE_VERSION (412); on_hand stays 9"
            - "restock with current version ${pk_v2} + 1 succeeds: on_hand_units == 14"
      - name: protocol_revoke_compensates_cascade
        claim_type: compensation
        grounds: ["state_machines.SubstitutionProtocol.ACTIVE_to_REVOKED", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "Compensation: revoking an ACTIVE protocol unflags only orders still substitution_pending with substituted_by_protocol_id NULL and unblocks pockets; an order already substituted keeps its substitute drug and is untouched."
        test_recipe:
          setup: ["Two flagged orders; order O1 already substituted; order O2 still pending; one blocked pocket; then revoke"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr RV", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat RV1", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p1: $.data.id, p1v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat RV2", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugRVS", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, in_shortage: true }
              as: PharmacyAdmin
              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugRVU", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p1}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${p1v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p2}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${p2v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o2: $.data.id }
            - call: "POST /pharmacy/medication-orders/${o1}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/medication-orders/${o2}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-RV", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_short}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id }
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, max_dose_mg: 200.0, expires_at: "2026-09-01T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto_id: $.data.id }
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/activate"
              payload: {}
              as: PharmacyAdmin
            - call: "POST /pharmacy/medication-orders/${o1}/substitute"
              payload: { protocol_id: "${proto_id}" }
              as: Pharmacist
          trigger:
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/revoke"
              payload: {}
              as: PharmacyAdmin
            - call: "GET /pharmacy/medication-orders/${o1}"
              payload: {}
              as: Pharmacist
              captures: { o1_drug: $.data.drug_product_id }
            - call: "GET /pharmacy/medication-orders/${o2}"
              payload: {}
              as: Pharmacist
              captures: { o2_flag: $.data.substitution_pending }
            - call: "GET /pharmacy/adc-pockets/${pk_id}"
              payload: {}
              as: Pharmacist
              captures: { pk_blocked: $.data.pick_blocked }
          assert:
            - "protocol status == REVOKED"
            - "O1 (already substituted) keeps drug_product_id == ${drug_sub} and ordered_dose_mg == 40.0 (compensation must NOT roll back completed substitutions)"
            - "O2.substitution_pending == false (unflagged)"
            - "pocket pick_blocked == false (unblocked)"
      - name: hood_overlap_ignores_cancelled_sessions
        claim_type: conditional_validation
        grounds: ["validations[priority=18]", "state_machines.HoodSession.SCHEDULED_|_IN_USE_to_CANCELLED"]
        distinguishing_aspect: "Conditional validation: the hood overlap check considers only sessions with status IN {SCHEDULED, IN_USE}; a CANCELLED session occupying [08:00, 10:00) does not block a new session over the same window."
        test_recipe:
          setup: ["Hood; session S1 [08:00,10:00) created then cancelled"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech CX", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-CX", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T10:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { s1: $.data.id }
            - call: "POST /pharmacy/hood-sessions/${s1}/cancel"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T08:30:00Z", end_at: "2026-08-01T09:30:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { s2: $.data.id }
          assert:
            - "new session over the cancelled window is created (201): CANCELLED sessions do not participate in the overlap set"
            - "GET /pharmacy/hood-sessions?hood_id=${hood_id} returns 2 rows (CANCELLED and SCHEDULED)"

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_same_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the restock response itself carries the post-mutation on_hand_units and incremented version; a subsequent GET agrees."
        test_recipe:
          setup: ["Empty pocket (version 1, on_hand 0)"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech IC", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugIC", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-IC", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_id}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id, pk_v: $.data.version }
          trigger:
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 7, expected_pocket_version: "${pk_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { resp_onhand: $.data.on_hand_units, resp_v: $.data.version }
            - call: "GET /pharmacy/adc-pockets/${pk_id}"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { get_onhand: $.data.on_hand_units, get_v: $.data.version }
          assert:
            - "restock response: on_hand_units == 7 and version == 2 in the SAME response"
            - "subsequent GET agrees: on_hand_units == 7, version == 2"

  # ===================================================================
  # Stubs — corners already exercised as failure/assert paths of §1.8 instances
  # ===================================================================
  - section: state_machines
    instances:
      - name: corner_stub_batch_rework_cycle_covered
        claim_type: valid_transition
        grounds: ["state_machines.CompoundingBatch.REJECTED_to_DRAFT"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_rework_cycle
          rationale: "The full rework cycle including the FAILED termination at rework_count == 2 is asserted by the named §1.8 instance."
      - name: corner_stub_preparation_cancellation_covered
        claim_type: side_effect_execution
        grounds: ["state_machines.CompoundedPreparation.PLANNED_|_COMPOUNDED_to_CANCELLED"]
        excluded_because:
          difficulty_instance: transitive_cascade / order_discontinue_cascade
          rationale: "Preparation cancellation plus batch and hood-session downstream effects are asserted end-to-end by the named §1.8 instance."
  - section: calculations
    instances:
      - name: corner_stub_renal_variants_covered
        claim_type: variant_divergence
        grounds: ["calculations.renal_dose_adjustment"]
        excluded_because:
          difficulty_instance: dual_variant_calc / renal_dosing_ibw_vs_abw_divergence
          rationale: "Both variants and their numeric delta asserted by the named §1.8 instance."
      - name: corner_stub_bud_variants_covered
        claim_type: variant_divergence
        grounds: ["calculations.beyond_use_dating"]
        excluded_because:
          difficulty_instance: dual_variant_calc / bud_default_table_vs_stability_extended
          rationale: "Default-table vs stability-extended BUD divergence asserted by the named §1.8 instance."
      - name: corner_stub_rounding_order_covered
        claim_type: correct_result
        grounds: ["calculations.dose_rounding"]
        excluded_because:
          difficulty_instance: combinatorial_formula / dose_rounding_per_component_then_sum
          rationale: "Per-component-then-sum pinning asserted with literals by the named §1.8 instance."
      - name: corner_stub_risk_score_covered
        claim_type: correct_result
        grounds: ["calculations.diversion_risk_score"]
        excluded_because:
          difficulty_instance: combinatorial_formula / diversion_risk_score_tiered_interaction
          rationale: "Tier thresholds, C_II multiplier, and OPEN_CASE auto-creation asserted by the named §1.8 instance."
  - section: validations
    instances:
      - name: corner_stub_priority_state_vs_safety_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / verify_state_beats_allergy_safety
          rationale: "Dual-failure priority asserted by the named §1.8 instance."
      - name: corner_stub_priority_safety_vs_referential_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=10]", "validations[priority=33]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / substitute_safety_beats_protocol_referential
          rationale: "Dual-failure priority asserted by the named §1.8 instance."
      - name: corner_stub_bud_expired_dispense_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=26]", "errors[ERR_BUD_EXPIRED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pocket_dispense_requires_order_verified_and_preparation_qa
          rationale: "The dispense-path gates (order verified, preparation QA) are asserted there; BUD inclusive-expiry is asserted by corner preparation_auto_expiry_on_clock_sweep, and ERR_BUD_EXPIRED on dispense follows the same clock >= bud_expiry predicate."
      - name: corner_stub_hood_overlap_and_coverage_cap_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "validations[priority=19]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hood_session_half_open_adjacency
          rationale: "Both overlap semantics (half-open adjacency, aggregate capacity cap) asserted by the two named §1.8 resource_temporal_overlap instances."
  - section: errors
    instances:
      - name: corner_stub_invalid_quantity_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_QUANTITY]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / restock_zero_quantity_rejected
          rationale: "Zero-quantity restock rejection asserted by the named §1.8 instance."
      - name: corner_stub_hood_session_not_active_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOOD_SESSION_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / batch_start_requires_hood_session_in_use
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: corner_stub_preparation_not_qa_passed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREPARATION_NOT_QA_PASSED]", "errors[ERR_ORDER_NOT_VERIFIED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pocket_dispense_requires_order_verified_and_preparation_qa
          rationale: "Both dispense-gate errors asserted by the named §1.8 instance."
      - name: corner_stub_waste_tolerance_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_WASTE_TOLERANCE_EXCEEDED]"]
        excluded_because:
          difficulty_instance: compensating_invariant / batch_mass_conservation_across_rework
          rationale: "Overage 77.0% vs 60% tolerance computed in the named §1.8 instance; the release-block error path is additionally asserted by corner waste_tolerance_release_gate."
  - section: cross_cutting_layers
    instances:
      - name: corner_stub_cascades_covered
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: transitive_cascade / order_discontinue_cascade
          rationale: "Depth-3 and depth-2 cascades asserted by the two named §1.8 transitive_cascade instances."
