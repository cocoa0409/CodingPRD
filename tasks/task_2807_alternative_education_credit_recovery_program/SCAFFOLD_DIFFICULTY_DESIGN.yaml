              payload: { center_id: "${ctr_id}", label: "LAB-1", station_type: "COMPUTER" }
              as: DistrictAdmin
              captures: { st_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-9601", full_name: "Tess Alvi", cohort_year: 2027, grade_level: 11 }
