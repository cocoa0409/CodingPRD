              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
          trigger:
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 5, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { b1_id: $.data.id }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 5, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { err: $.data.error_id }
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v2: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 5, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v2}" }
              as: HarvestSupervisor
              captures: { b2_id: $.data.id }
          assert:
            - "first create with expected_field_version == 1 succeeds (${b1_id})"
            - "second create with the SAME stale version -> 412 ${err} == ERR_STALE_FIELD_VERSION"
            - "after re-read (version 2) retry succeeds (${b2_id})"
            - "Field.${f_id}.version == 3 after two successful creates"

      - name: version_increments_on_each_mutation
        claim_type: derived_field
        grounds: [entities.Field, "endpoints.PATCH /fields/{id}/quality", "endpoints.POST /harvest-batches"]
        distinguishing_aspect: "Field.version starts at 1 and increments exactly once per mutation: quality PATCH -> 2, harvest-batch create (cascade bump) -> 3; reads never increment."
        test_recipe:
          setup: ["field created (v1)"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v1: $.data.version }
          trigger:
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { v_read: $.data.version }
            - call: "PATCH /fields/${f_id}/quality"
              payload: { soil_moisture_pct: 47 }
              as: FarmManager
              captures: { v_patch: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 5, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${v_patch}" }
              as: HarvestSupervisor
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { v_final: $.data.version }
          assert:
            - "create -> 1 (${f_v1}); read leaves it at 1 (${v_read})"
            - "PATCH quality -> 2 (${v_patch})"
            - "batch create bumps -> 3 (${v_final})"

      - name: archived_field_hidden_then_filterable
        claim_type: soft_delete
        grounds: [state_machines.Field, "endpoints.GET /fields"]
        distinguishing_aspect: "Archiving a batch-free field (ACTIVE -> ARCHIVED) removes it from the default GET /fields listing; it reappears under ?status=ARCHIVED; harvest-batch creation against it fails ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["field F1 with no batches"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "Old 5", variety_id: "${v_id}", field_sqft: 20000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
          trigger:
            - call: "POST /fields/${f_id}/archive"
              payload: {}
              as: FarmManager
              captures: { f_status: $.data.status }
            - call: "GET /fields"
              payload: {}
              as: FarmManager
            - call: "GET /fields?status=ARCHIVED"
              payload: {}
              as: FarmManager
              captures: { arch0: "$.data[0].id" }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "archive -> ${f_status} == ARCHIVED"
            - "default listing returns 0 rows; ARCHIVED filter returns exactly 1 row and it is ${f_id} (${arch0})"
            - "batch create on ARCHIVED field -> 409 ${err} == ERR_ALREADY_TERMINAL (terminal p6 fires before the OCC check at p8 even with the correct version)"

      - name: derived_field_reconciliation_after_checks
        claim_type: derived_field_reconciliation
        grounds: [calculations.order_balance_reconciliation, entities.Order.fields.amount_due]
        excluded_because:
          difficulty_instance: order_money_conservation_across_checks_and_payments
          rationale: "That §1.8 instance recomputes chargeable_amount / amount_due / credit_balance / payment_status across four mutation steps and asserts each."

  # ===========================================================================
  - section: consistency
    instances:
      - name: mutation_responses_reflect_final_state_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the confirm RESPONSE body itself carries status CONFIRMED plus the computed delivery_window_end (no follow-up GET needed); the follow-up GET agrees."
        test_recipe:
          setup: ["READY field + PENDING batch; PLACED order (mini chain)"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 3, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: FarmManager
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 1
                z2_pallets: 1
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/confirm"
              payload: { delivery_window_start: "2026-08-03T08:00:00Z" }
              as: SalesRep
              captures: { r_status: $.data.status, r_we: $.data.delivery_window_end, r_alloc: $.data.allocated_sqft }
            - call: "GET /orders/${o_id}"
              payload: {}
              as: SalesRep
              captures: { g_status: $.data.status, g_we: $.data.delivery_window_end }
          assert:
            - "confirm response: status CONFIRMED, delivery_window_end 2026-08-03T10:00:00Z, allocated_sqft 300 (${r_status}, ${r_we}, ${r_alloc})"
            - "GET agrees: ${g_status} == CONFIRMED, ${g_we} == ${r_we}"
