            - "After release by a different officer: hold_status == CLEAR, lifecycle_status still == ACTIVE"
            - "After freeze at 2026-08-02T00:00:00Z: storage_type == FROZEN and expires_at == 2026-09-01T00:00:00Z (frozen clock reset: 30 days), lifecycle_status == ACTIVE"
            - "received_weight_kg == 50.00 and available_weight_kg == 50.00 throughout"

      - name: import_document_resubmission_cycle
        grounds:
          - state_machines.ImportDocument.REJECTED_to_SUBMITTED
          - entities.ImportDocument.fields.resubmit_count
        distinguishing_aspect: |
          Cyclic machine on ImportDocument: DRAFT -> SUBMITTED -> REJECTED -> SUBMITTED
          -> CLEARED with resubmit_count incrementing on the loop edge and
          segregation-of-duties enforced on the clear edge. Different entity from
          DockTicket and InventoryLot.
        test_recipe:
          setup:
            - "Species SHRIMP (is_import true); ticket DRAFT; one import document DRAFT"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "SHRIMP", common_name: "White Shrimp", labeling_name: "Shrimp", substitution_group: "CRUSTACEAN", fresh_shelf_life_hours: 48, frozen_shelf_life_days: 60, is_import: true }, as: OperationsManager, captures: { sp_id: $.data.id } }
