  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_calendar_rejects_overlap_but_allows_abutment
        grounds:
          - validations[priority=15]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
          - entities.InspectorProfile.fields.scheduled_inspection_count
          - entities.Inspection.fields.scheduled_end
        distinguishing_aspect: |
          Resource InspectorProfile under half-open interval semantics measured
          in hours: a 2026-08-10T12:00Z start inside the running 09:00-13:00
          assignment is rejected, while a start at exactly 13:00Z — the prior
          interval's end — is accepted, so touching endpoints do not count as
          overlap.
