            - "HTTP 200 with data.status == CLOSED and data.lost_time_days == 4"
            - "after the trigger SortCenter.${center_id}.ops_posture == OPEN, open_serious_injury_count == 0 and last_posture_change_at == 2026-08-04T09:00:00Z"
            - "SortCenter.${center_id}.version incremented on the injury create and again on the close"

      - name: patch_automation_below_threshold_restricts_then_restores
        claim_type: compound
        grounds:
          - endpoints.PATCH_/sortation/sort-centers/{id}
          - calculations.ops_posture_derivation
          - state_machines.SortCenter.RESTRICTED_to_OPEN
        distinguishing_aspect: "The compound posture is re-derived from the parent's own automation field, not only from children: patching automation_utilization_pct to 44 (below AUTOMATION_RESTRICT_PCT 45) restricts the center with no jam and no injury, and patching back to 45 restores OPEN."
        test_recipe:
          setup:
            - "Center SC1 created with automation_utilization_pct 70, posture OPEN, no jams, no injuries"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id, center_v1: $.data.version }
          trigger:
            - call: "PATCH /sortation/sort-centers/${center_id}"
              payload: { automation_utilization_pct: 44 }
              as: FacilityAdmin
            - call: "PATCH /sortation/sort-centers/${center_id}"
              payload: { automation_utilization_pct: 45 }
              as: FacilityAdmin
          assert:
            - "after the first patch data.ops_posture == RESTRICTED with automation_utilization_pct == 44 and version == ${center_v1} + 1"
            - "after the second patch data.ops_posture == OPEN with automation_utilization_pct == 45 (the threshold itself is not restrictive) and version == ${center_v1} + 2"
            - "open_jam_count == 0 and open_serious_injury_count == 0 throughout, so the posture came from the automation term alone"
            - "last_posture_change_at == 2026-08-03T06:00:00Z after both patches"

