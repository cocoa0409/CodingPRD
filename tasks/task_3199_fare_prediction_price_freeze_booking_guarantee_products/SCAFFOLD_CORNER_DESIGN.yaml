            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id }
            - call: "GET /fare/itineraries/${i1_id}"
              payload: {}
              as: Traveler
              as_user_id: "tv-mara"
              captures: { i1_v2: $.data.version }
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 300, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 300, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "the second creation is refused with 412 and ERR_STALE_VERSION"
            - "Itinerary.${i1_id}.version advanced on the first creation, so the reused ${i1_version} is stale while ${i1_v2} is current"
            - "the same payload replayed with ${i1_v2} succeeds, so the refusal is about the version and not the payload"
            - "the freeze count for ${i1_id} is exactly 2 after both creations"

      - name: corner_watch_cannot_be_armed_on_an_unpublished_curve
