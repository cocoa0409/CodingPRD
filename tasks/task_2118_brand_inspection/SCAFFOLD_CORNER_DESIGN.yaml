              captures: { ok_status: "$.data.status", ok_applied: "$.data.applied_cents" }
          assert:
            - "the first trigger call responds HTTP 422 and ${err_id} == ERR_REMITTANCE_AMOUNT_INVALID"
            - "FeeRemittance.${rem_over}.status == SUBMITTED and FeeRemittance.${rem_over}.applied_cents == 0"
            - "${ok_status} == RECONCILED and ${ok_applied} == 2500"
            - "InspectionOrder.${ord_1}.fee_status == REMITTED and InspectionOrder.${ord_1}.remittance_id == ${rem_exact}"

      - name: corner_estray_handling_fee_zero_when_care_exceeds_gross
        claim_type: Correct Result
        grounds: [calculations.estray_proceeds_distribution, entities.EstrayCase.fields.handling_fee_cents]
        distinguishing_aspect: "When net_available_cents is not positive the waterfall short-circuits: care 102300 against gross 90000 leaves handling_fee_cents 0 and claimant_residual_cents 0 rather than a negative bucket."
        test_recipe:
          setup: ["Clock at 2026-08-05T00:00:00Z; a 12-head EstrayCase is IMPOUNDED at district T-DEFC, its auction scheduled at 2026-08-25T00:00:00Z with estimated_gross_cents 180000."]
