  - rule_id: boundary_precision_check
    instances:
      - name: holiday_density_exactly_at_max_passes
        grounds:
          - calculations.lot_holiday_density
          - entities.LiningInspection.fields.holidays_per_tank
          - entities.LiningInspection.fields.result
          - endpoints[POST /mfg/lining-inspections]
        distinguishing_aspect: >
          Metric: holidays_per_tank against MAX_HOLIDAY_DENSITY 0.50, on POST /mfg/lining-inspections. The
          threshold is INCLUSIVE, so the sample of 100 tanks is walked at 49, 50 and 51 holidays -> 0.4900 PASS,
          0.5000 PASS and 0.5100 FAIL. A strict `< 0.50` comparison flips only the middle row, and 4-dp
          rounding is pinned at the same time because a 2-dp implementation cannot represent the third value's
          distance from the boundary.
        test_recipe:
          setup:
            - "Tank lot TL-001 is LINED with planned_quantity 120 and wip_quantity 120, so a 100-tank sample is valid."
            - "The lot has no inspection records yet, so every call below creates a CURRENT HOLIDAY record and supersedes the previous one."
            - "MAX_HOLIDAY_DENSITY is 0.50 and the comparison is `holidays_per_tank > MAX` for a FAIL verdict."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
