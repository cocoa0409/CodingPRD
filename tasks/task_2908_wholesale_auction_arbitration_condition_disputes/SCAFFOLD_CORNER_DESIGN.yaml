            - "response.data.transport_buyer_share_cents == 107200, response.data.transport_seller_share_cents == 0 and response.data.transport_auction_share_cents == 0"
            - "response.data.outcome == \"CLAIM_DENIED\", response.data.allowance_variant == \"NONE\" and response.data.allowance_cents == 0"
            - "GET /arbitration/cases/${case_id}/ledger-entries returns 3 TRANSPORT_ALLOCATION rows — (BUYER, -107200), (SELLER, 0), (AUCTION, +107200) — whose amount_signed_cents sum to 0"
            - "GET /arbitration/cases/${case_id} returns status == \"DENIED\""

      - name: mileage_diminution_base_replaces_the_repair_estimate_and_is_clipped_by_the_cap
        claim_type: correct_result
        grounds:
          - calculations.repair_allowance_amount.formula
          - calculations.repair_allowance_amount.constants.MILEAGE_DIMINUTION_CENTS_PER_MILE
          - entities.ArbitrationCase.fields.verified_true_mileage
        distinguishing_aspect: "For defect_class MILEAGE_DISCREPANCY base_cents comes from (104000 - 84000) * 45 == 900000 and ignores the 285000 repair estimate entirely; 900000 is then clipped to the 4000 bps cap of 580000, and the arbitrator's smaller request of 500000 wins the final min()."
        test_recipe:
          setup: ["A MILEAGE_DISCREPANCY case in ARBITRATOR_REVIEW on a 1450000-cent GREEN-light sale announced at 84000 miles, with a verified third-party odometer reading of 104000 and an unrelated 285000 repair estimate on file. The policy caps allowances at 4000 bps and sets no mileage limit."]
