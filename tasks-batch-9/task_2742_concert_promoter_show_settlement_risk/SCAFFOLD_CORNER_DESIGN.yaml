          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Agg Market limit 1000000, Venue Agg Hall gross_capacity 1000 / facility 0 / tax 0, four Artists so priority 24 never interferes, four shows with disjoint half-open load windows a week apart."
