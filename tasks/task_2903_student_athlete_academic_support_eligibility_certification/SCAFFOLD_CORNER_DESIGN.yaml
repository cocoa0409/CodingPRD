            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
