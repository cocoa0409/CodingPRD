            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ServiceManager }
          trigger:
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_QUOTE_EXPIRED (business_temporal priority 7 beats business_fiscal priority 10)"
            - "Quote.${q}.status == EXPIRED"
            - "RepairOrder.${ro}.status == QUOTE_IN_PROGRESS (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: test_verdict_tolerance_boundary_inclusive
        grounds:
          - calculations.test_verdict
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Boundary on deviation_pct metric via POST /repair-orders/{id}/test-runs:
          deviation exactly 5.00 PASSES (comparison is <= TOLERANCE_PCT on the
          rounded value) while 5.01 FAILS — different metric and endpoint than
          the credit-limit cents boundary instance.
        test_recipe:
          setup:
            - "Customer, two PUMP assets (API_610_PER_POINT), window capacity 1000"
