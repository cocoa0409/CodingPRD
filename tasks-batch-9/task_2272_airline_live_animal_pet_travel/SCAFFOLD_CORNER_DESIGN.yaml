          - errors.ERR_ROUTING_MISMATCH
        distinguishing_aspect: "The routing_type on the segment must equal the routing_type of the OWNING reservation, not merely be a declared enum member: a CARGO segment requested under a CHECKED reservation is refused with 422 ERR_ROUTING_MISMATCH even though the leg has cargo capacity free."
