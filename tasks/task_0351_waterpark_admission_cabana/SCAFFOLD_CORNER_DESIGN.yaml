      - name: occ_assign_window_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assign-window-stale-window]", "endpoints.POST_/admissions/{id}/assign-window"]
        distinguishing_aspect: "Assign-window with the CURRENT expected_entry_window_version succeeds and bumps EntryWindow.version by 1."
        test_recipe:
          setup: ["a FULFILLED admission ISSUED, an OPEN window at version 1"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Occ Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Goc", email: "goc@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /entry-windows/${window_id}"
              payload: {}
              as: ParkManager
              captures: { window_v_after: $.data.version }
          assert:
            - "Admission.${adm_id}.status == CONFIRMED and EntryWindow.${window_id}.version == 2 (was 1)"

      - name: assign_window_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assign-window-stale-window]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Assign-window carrying a version one less than the current EntryWindow.version returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["a window whose version advanced to 2 after a first assignment; a second ISSUED admission still holding the old version"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Occ2 Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000, group_threshold: 99 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Goc2", email: "goc2@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm1_id: "$.data[0].id", adm2_id: "$.data[1].id" }
            - call: "POST /admissions/${adm1_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm1_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /entry-windows/${window_id}"
              payload: {}
              as: ParkManager
              captures: { window_v_now: $.data.version }
            - call: "POST /admissions/${adm2_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /admissions/${adm2_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v_now} - 1" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: rainout_cascade_partial_to_cabana_and_admission
        claim_type: cascading_side_effects
        grounds: [state_machines.EntryWindow.OPEN_to_RAINED_OUT, state_machines.CabanaRental.CONFIRMED_to_RAINED_OUT]
        distinguishing_aspect: "A single rain-out flips BOTH a CONFIRMED admission and a CONFIRMED cabana rental on the window to RAINED_OUT, issuing two rain-checks."
        test_recipe:
          setup: ["a window with one CONFIRMED admission and one CONFIRMED cabana rental; park RAINED_OUT"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Cas Park", total_gate_capacity: 100, rain_check_value_cents: 4000 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T20:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /parks/${park_id}/cabanas"
              payload: { label: "C-8", tier: "STANDARD", daily_rate_cents: 9000 }
              as: ParkManager
              captures: { cabana_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Gca", email: "gca@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /cabana-rentals"
              payload: { cabana_id: "${cabana_id}", order_id: "${order_id}", entry_window_id: "${window_id}", starts_at: "2026-07-01T10:00:00Z", ends_at: "2026-07-01T14:00:00Z", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { rental_id: $.data.id }
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /entry-windows/${window_id}"
              payload: {}
              as: ParkManager
              captures: { window_v2: $.data.version }
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v2}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /parks/${park_id}/weather"
              payload: { weather_status: "RAINED_OUT" }
              as: ParkManager
          trigger:
            - call: "POST /entry-windows/${window_id}/rain-out"
              payload: {}
              as: ParkManager
            - call: "GET /cabana-rentals/${rental_id}"
              payload: {}
              as: ParkManager
              captures: { rst: $.data.status }
            - call: "GET /admissions/${adm_id}"
              payload: {}
              as: ParkManager
              captures: { ast: $.data.status }
            - call: "GET /rain-checks"
              payload: { park_id: "${park_id}" }
              as: ParkManager
          assert:
            - "CabanaRental.${rental_id}.status == RAINED_OUT and Admission.${adm_id}.status == RAINED_OUT"
            - "GET /rain-checks?park_id=${park_id} total_count == 2"

      - name: derived_open_window_count_after_close
        claim_type: derived_field_reconciliation
        grounds: [entities.Park.fields.open_window_count, state_machines.EntryWindow.OPEN_to_CLOSED]
        distinguishing_aspect: "Park.open_window_count is 2 with two OPEN windows; closing one reconciles it to 1."
        test_recipe:
          setup: ["a park with two OPEN windows"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Drv Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T13:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { w1_id: $.data.id }
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T13:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /entry-windows/${w1_id}/close"
              payload: { force: true }
              as: ParkManager
            - call: "GET /parks/${park_id}"
              payload: {}
              as: ParkManager
              captures: { owc: $.data.open_window_count }
          assert:
            - "Park.${park_id}.open_window_count == 1 after closing one of two OPEN windows"

