              as_user_id: "admin-1"
              captures: { e2: "$.data.id" }
            - call: "POST /electors/${e1}/credential"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /electors/${e2}/credential"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /candidates"
              payload: { full_name: "Player One", category: "PLAYER", retirement_year: 2018, career_seasons: 15, career_metric_value: 3000, is_deceased: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cand1: "$.data.id" }
            - call: "POST /candidates"
              payload: { full_name: "Player Two", category: "PLAYER", retirement_year: 2017, career_seasons: 14, career_metric_value: 2800, is_deceased: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cand2: "$.data.id" }
            - call: "POST /induction-cycles"
              payload: { cycle_year: 2026, sport_code: "BASEBALL", max_inductees: 5, travel_budget_cents: 1000000, escort_pool_size: 2 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
