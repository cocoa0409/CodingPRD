              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-16T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu2: $.data.id }
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu1}", chef_id: "${chef}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T11:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sess1: $.data.id }
          trigger:
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu2}", chef_id: "${chef}", scheduled_start: "2026-03-03T11:59:00Z", scheduled_end: "2026-03-03T12:59:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_CHEF_SCHEDULE_CONFLICT (59 < 60 min buffer)"

      - name: kitchen_touching_allowed_no_buffer
        grounds:
          - validations[priority=14]
          - entities.CookSession.fields.weekly_menu_id
        distinguishing_aspect: |
          Client-kitchen resource, adjacency interval semantics (different resource and
          different geometry than the chef buffer): two sessions of DIFFERENT chefs at
          the same client's kitchen that merely touch (gap == 0) are ACCEPTED; only
          true overlap triggers ERR_CLIENT_KITCHEN_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "One client (shared kitchen), two chefs, two menus (one per chef); kitchen hours 0-24."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Rae", email: "rae@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook A", email: "cook16a@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chefA: $.data.id }
            - call: "POST /chefs"
              payload: { full_name: "Cook B", email: "cook16b@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chefB: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chefA}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chefA}"
              captures: { menuA: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chefB}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chefB}"
              captures: { menuB: $.data.id }
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menuA}", chef_id: "${chefA}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T11:00:00Z" }
              as: Chef
              as_user_id: "${chefA}"
              captures: { sessA: $.data.id }
          trigger:
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menuB}", chef_id: "${chefB}", scheduled_start: "2026-03-03T11:00:00Z", scheduled_end: "2026-03-03T13:00:00Z" }
              as: Chef
              as_user_id: "${chefB}"
              captures: { sessB: $.data.id }
          assert:
            - "HTTP 201"
            - "CookSession.${sessB}.status == SCHEDULED (touching at 11:00 is allowed at the shared kitchen; no buffer required)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_credit_skip_then_resume_conserved
        grounds:
          - state_machines.WeeklyMenu.APPROVED_to_SKIPPED
          - state_machines.WeeklyMenu.SKIPPED_to_APPROVED
          - calculations.wallet_credit_cents
          - entities.Client.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity Client.wallet_credit_cents: skip adds weekly_base_fee_cents
          (5000), resume subtracts the same 5000, leaving wallet_credit_cents back at 0.
        test_recipe:
          setup:
            - "An APPROVED menu of a client with base fee 5000, wallet_credit 0, clock before week_start."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Sid", email: "sid@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook17@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Bowl", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "rice", quantity: 1, unit: "batch", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /weekly-menus/${menu}/skip"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /weekly-menus/${menu}/resume"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          assert:
            - "After skip (in setup): Client.${cid}.wallet_credit_cents == 5000"
            - "After resume: Client.${cid}.wallet_credit_cents == 0 (unchanged from pre-skip)"
            - "WeeklyMenu.${menu}.status == APPROVED"

      - name: grocery_cost_substitute_then_reverse_conserved
        grounds:
          - state_machines.WeeklyMenu.DRAFT_to_PROPOSED
          - calculations.grocery_cost_cents
          - entities.WeeklyMenu.fields.grocery_cost_cents
          - entities.MenuMeal.fields.ingredients
        distinguishing_aspect: |
          Conserved quantity WeeklyMenu.grocery_cost_cents (a different quantity than the
          wallet): substituting beef(5000)->lamb(8000) then lamb(8000)->beef(5000) returns
          grocery_cost_cents to the original 5000.
        test_recipe:
          setup:
            - "A DRAFT menu with one meal whose only ingredient 'beef' costs 5000 (menu grocery 5000)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Tom", email: "tom@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook18@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Roast", meal_slot: "DINNER", servings: 2, ingredients: [{ name: "beef", quantity: 1, unit: "kg", unit_cost_cents: 5000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
              captures: { meal: $.data.id }
            - call: "POST /menu-meals/${meal}/substitute"
              payload: { target_ingredient_name: "beef", replacement_name: "lamb", replacement_quantity: 1, replacement_unit: "kg", replacement_unit_cost_cents: 8000, replacement_allergen_tags: [] }
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "POST /menu-meals/${meal}/substitute"
              payload: { target_ingredient_name: "lamb", replacement_name: "beef", replacement_quantity: 1, replacement_unit: "kg", replacement_unit_cost_cents: 5000, replacement_allergen_tags: [] }
              as: Chef
              as_user_id: "${chef}"
          assert:
            - "After first substitute (in setup): WeeklyMenu.${menu}.grocery_cost_cents == 8000"
            - "After reverse substitute: WeeklyMenu.${menu}.grocery_cost_cents == 5000 (== original)"
