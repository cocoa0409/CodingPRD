# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (task 0967)
# Breadth coverage of §1.1–§1.7 claims NOT covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ================================================================ Entities
  - section: entities
    instances:
      - name: create_member_returns_201_with_defaults
        claim_type: creation
        grounds: [entities.Member]
        distinguishing_aspect: "POST /dme/members with all required fields returns 201 with server defaults: balances 0, no schedules."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dme/members"
              payload: { full_name: "New Mem", email: "new@x.com", date_of_birth: "1990-01-01", shipping_address: "1 Main St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.out_of_pocket_balance_cents == 0"
            - "Member.${m_id}.oop_accumulated_cents == 0"
            - "Member.${m_id}.active_schedule_count == 0"
            - "Member.${m_id}.next_resupply_date == null"
            - "Member.${m_id}.version == 1"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /dme/members/00000000-0000-0000-0000-000000000000"
              as: CareCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_FOUND and http status == 404"

      - name: member_list_pagination_limit_offset
        claim_type: listing
        grounds: [entities.Member, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["two members exist"]
          setup_api_calls:
            - call: "POST /dme/members"
              payload: { full_name: "Pg A", email: "pga@x.com", date_of_birth: "1990-01-01", shipping_address: "1 A St" }
              as: CareCoordinator
            - call: "POST /dme/members"
              payload: { full_name: "Pg B", email: "pgb@x.com", date_of_birth: "1991-02-02", shipping_address: "2 B St" }
              as: CareCoordinator
          trigger:
            - call: "GET /dme/members"
              payload: { limit: 1, offset: 0 }
              as: CareCoordinator
          assert:
            - "response_type == array, data length == 1"
            - "total_count == 2 and has_more == true"
            - "GET /dme/members with limit 1 offset 1 returns the second member and has_more == false"

      - name: member_id_injection_input_ignored
        claim_type: system_fields
        grounds: [entities.Member]
        distinguishing_aspect: "Client-supplied id/version in the create payload are ignored; the server mints both."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dme/members"
              payload: { full_name: "Inj Mem", email: "inj@x.com", date_of_birth: "1990-01-01", shipping_address: "3 C St", id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: CareCoordinator
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.id != 11111111-1111-1111-1111-111111111111"
            - "Member.${m_id}.version == 1"

      - name: catalog_item_defaults_applied
        claim_type: defaults
        grounds: [entities.CatalogItem]
        distinguishing_aspect: "Omitting optional catalog fields applies declared defaults (STANDARD tier, 0 fees, false resupply coverage)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "Membrane", sku: "PART-MEMB", unit_price_cents: 300 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
          assert:
            - "CatalogItem.${ci_id}.insurance_tier == STANDARD"
            - "CatalogItem.${ci_id}.upgrade_fee_cents == 0"
            - "CatalogItem.${ci_id}.covered_under_resupply == false"
            - "CatalogItem.${ci_id}.max_qty_per_frequency == 0"
            - "CatalogItem.${ci_id}.warranty_months == 0"

      - name: order_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.PumpOrder.fields.provisional_patient_cents, calculations.order_line_pricing]
        distinguishing_aspect: "Injected computed values are ignored; creation computes merchandise/order totals from the primary line."
        test_recipe:
          setup: ["member, ACTIVE policy, prescription, and a STANDARD 30000 pump exist"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Cf Mem", email: "cf@x.com", date_of_birth: "1990-01-01", shipping_address: "4 D St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "4 D St", provisional_patient_cents: 999999 }
              as: CareCoordinator
              captures: { o_id: $.data.id }
          assert:
            - "PumpOrder.${o_id}.provisional_patient_cents == 0 (injected value ignored; estimate only computed at qualify)"
            - "PumpOrder.${o_id}.merchandise_subtotal_cents == 30000"
            - "PumpOrder.${o_id}.order_total_cents == 30000"
            - "PumpOrder.${o_id}.fulfillment_status == PENDING_QUALIFICATION and billing_status == UNBILLED"

      - name: order_with_unknown_policy_not_found
        claim_type: parent_relationships
        grounds: [entities.PumpOrder.fields.policy_id, "errors[ERR_POLICY_NOT_FOUND]"]
        distinguishing_aspect: "Body FK references must resolve; an unknown policy_id returns ERR_POLICY_NOT_FOUND (404)."
        test_recipe:
          setup: ["member, prescription, and pump exist; policy id is unknown"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Fk Mem", email: "fk@x.com", date_of_birth: "1990-01-01", shipping_address: "5 E St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "00000000-0000-0000-0000-000000000000", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "5 E St" }
              as: CareCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_POLICY_NOT_FOUND and http status == 404"

  # ========================================================== State machines
  - section: state_machines
    instances:
      - name: prescription_initial_state_pending
        claim_type: initial_state
        grounds: [state_machines.Prescription]
        distinguishing_aspect: "A new prescription starts in PENDING_VERIFICATION with null verification/consumption fields."
        test_recipe:
          setup: ["member exists"]
          setup_api_calls:
            - call: "POST /dme/members"
              payload: { full_name: "Rx Mem", email: "rxm@x.com", date_of_birth: "1990-01-01", shipping_address: "6 F St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "SINGLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
          assert:
            - "Prescription.${rx_id}.status == PENDING_VERIFICATION"
            - "Prescription.${rx_id}.verified_by_user_id == null and consumed_by_order_id == null"

      - name: resubmit_from_verified_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Prescription]
        distinguishing_aspect: "resubmit is only valid from REJECTED; from VERIFIED it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["prescription VERIFIED"]
          setup_api_calls:
            - call: "POST /dme/members"
              payload: { full_name: "Rs Mem", email: "rs@x.com", date_of_birth: "1990-01-01", shipping_address: "7 G St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "SINGLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
          trigger:
            - call: "POST /dme/prescriptions/${rx_id}/resubmit"
              as: InsuranceSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Prescription.${rx_id}.status == VERIFIED"

      - name: verify_expired_prescription_lazy_expiry
        claim_type: precondition_enforcement
        grounds: [state_machines.Prescription, "validations[priority=8]"]
        distinguishing_aspect: "Verifying after expiration_date lazily transitions the prescription to EXPIRED and returns ERR_PRESCRIPTION_EXPIRED."
        test_recipe:
          setup: ["prescription PENDING_VERIFICATION with expiration_date 2026-05-10; clock advanced to 2026-05-11"]
          setup_api_calls:
            - call: "POST /dme/members"
              payload: { full_name: "Exp Mem", email: "exp@x.com", date_of_birth: "1990-01-01", shipping_address: "8 H St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "SINGLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-05-10" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_PRESCRIPTION_EXPIRED"
            - "Prescription.${rx_id}.status == EXPIRED"

      - name: cancel_from_shipped_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PumpOrder]
        distinguishing_aspect: "Cancel is valid only from PENDING_QUALIFICATION or QUALIFIED; a SHIPPED order rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["order QUALIFIED (no prior auth required) and shipment created -> order SHIPPED"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Cs Mem", email: "cs@x.com", date_of_birth: "1990-01-01", shipping_address: "9 I St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "9 I St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-C1" }
              as: WarehouseOperator
          trigger:
            - call: "POST /dme/pump-orders/${o_id}/cancel"
              as: CareCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "PumpOrder.${o_id}.fulfillment_status == SHIPPED"

      - name: add_line_to_cancelled_order_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PumpOrder]
        distinguishing_aspect: "CANCELLED is terminal for mutations: adding a garment line to a cancelled order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["order created then cancelled from PENDING_QUALIFICATION; garment item exists"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "COMPRESSION_GARMENT", name: "GarmentA", sku: "GAR-A", unit_price_cents: 6000 }
              as: PlatformAdmin
              captures: { gar_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Tl Mem", email: "tl@x.com", date_of_birth: "1990-01-01", shipping_address: "10 J St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", garment_allowance_per_period: 2 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "10 J St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/cancel"
              as: CareCoordinator
          trigger:
            - call: "POST /dme/pump-orders/${o_id}/lines"
              payload: { catalog_item_id: "${gar_id}", quantity: 1 }
              as: CareCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: shipment_skip_transition_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Shipment]
        distinguishing_aspect: "Advance must follow the machine: LABEL_CREATED -> DELIVERED directly is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["order QUALIFIED; shipment LABEL_CREATED"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Sk Mem", email: "sk@x.com", date_of_birth: "1990-01-01", shipping_address: "11 K St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "11 K St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-K1" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Shipment.${sh_id}.status == LABEL_CREATED"
            - "PumpOrder.${o_id}.fulfillment_status == QUALIFIED (no delivery cascade fired)"

      - name: delivered_shipment_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Shipment]
        distinguishing_aspect: "DELIVERED is terminal: any further advance is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["order delivered via full shipment advance chain"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Dt Mem", email: "dt@x.com", date_of_birth: "1990-01-01", shipping_address: "12 L St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "12 L St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-L1" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
          trigger:
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "LOST" }
              as: WarehouseOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Shipment.${sh_id}.status == DELIVERED"

      - name: duplicate_claim_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Claim, "errors[ERR_DUPLICATE_CLAIM]"]
        distinguishing_aspect: "At most one Claim per source order: a second POST /dme/claims fails with ERR_DUPLICATE_CLAIM (409)."
        test_recipe:
          setup: ["delivered pump order with one claim already SUBMITTED"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Dc Mem", email: "dc@x.com", date_of_birth: "1990-01-01", shipping_address: "13 M St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
