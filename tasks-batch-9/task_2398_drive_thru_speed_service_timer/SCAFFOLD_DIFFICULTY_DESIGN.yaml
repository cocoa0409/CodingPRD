          assert:
            - "${rep_state_initial} == DRAFT, ${rep_band} == GREEN, ${rep_pts} == 6 — the report's metrics are complete, only its state blocks coaching"
            - "First attempt: HTTP 409 and ${err} == ERR_REPORT_NOT_PUBLISHED"
            - "After the first attempt GET /drive-thru/coaching-interventions?throughput_report_id=${rep_id} returns total_count 0"
            - "ThroughputReport.${rep_id}.report_state == PUBLISHED after the publish call"
            - "Second attempt with the identical payload: HTTP 201, ${ci_gap} == 0 (greet_seconds 20 minus greet_target_pinned 25, floored at 0), ${ci_score} == 3.00, ${ci_tier} == TIER_A_OBSERVE"
            - "CoachingIntervention.${ci_id}.ci_state == DRAFT, revision_count == 0, issued_by_user_id is null, restaurant_id == ${r_id}"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: daypart_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations.priority_21_ERR_DAYPART_WINDOW_OVERLAP
          - entities.DaypartProfile.fields.start_minute
          - entities.DaypartProfile.fields.end_minute
          - state_machines.DaypartProfile.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Interval semantics under test are HALF-OPEN minute-of-day windows [start_minute,
          end_minute) and the contended resource is the Restaurant's daypart calendar: a profile
          starting on the exact minute a sibling ends activates cleanly, while a profile that
          straddles that boundary by ten minutes is rejected.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant."
            - "A LUNCH DaypartProfile [660, 840) is created and ACTIVATED."
            - "An AFTERNOON DaypartProfile [840, 1020) — starting on the exact minute LUNCH ends — is created in DRAFT."
            - "A DINNER DaypartProfile [830, 1000) — straddling minute 840 — is created in DRAFT."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_2", cars_per_hour_floor: 6, cars_per_hour_ceiling: 12, target_relief_pct: 0.03, min_oot_count: 1, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_3", cars_per_hour_floor: 12, cars_per_hour_ceiling: 18, target_relief_pct: 0.07, min_oot_count: 2, merge_award_bias: "ACCURACY_FIRST" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_4", cars_per_hour_floor: 18, target_relief_pct: 0.12, min_oot_count: 3, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Norcross Calendar Store", store_number: "S-2398-S", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_lunch: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_lunch}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "AFTERNOON", start_minute: 840, end_minute: 1020, greet_target_seconds: 22, order_target_seconds: 80, pull_forward_target_seconds: 35, window_target_seconds: 65 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_aft: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "DINNER", start_minute: 830, end_minute: 1000, greet_target_seconds: 24, order_target_seconds: 90, pull_forward_target_seconds: 38, window_target_seconds: 70 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_din: $.data.id }
          trigger:
            - call: "POST /drive-thru/daypart-profiles/${dp_aft}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { aft_state: $.data.profile_state }
            - call: "POST /drive-thru/daypart-profiles/${dp_din}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacency is legal: activating AFTERNOON returned HTTP 200 and ${aft_state} == ACTIVE — minute 840 belongs to AFTERNOON only, because LUNCH's window excludes its own end_minute"
            - "Overlap is illegal: activating DINNER returned HTTP 409 and ${err} == ERR_DAYPART_WINDOW_OVERLAP"
            - "DaypartProfile.${dp_din}.profile_state == DRAFT (the rejected activation left it untouched)"
            - "DaypartProfile.${dp_lunch}.profile_state == ACTIVE and DaypartProfile.${dp_aft}.profile_state == ACTIVE"
            - "GET /drive-thru/daypart-profiles?restaurant_id=${r_id}&profile_state=ACTIVE returns total_count 2"
            - "DaypartProfile.${dp_aft}.total_target_seconds == 202 (22 + 80 + 35 + 65)"

      - name: deployment_closed_interval_buffer_rejects_adjacency
        grounds:
          - validations.priority_22_ERR_DEPLOYMENT_BUFFER_VIOLATION
          - entities.OrderTakerDeployment.fields.planned_start_at
          - entities.OrderTakerDeployment.fields.planned_end_at
          - entities.OrderTakerDeployment.fields.planned_minutes
          - entities.StaffMember.fields.max_consecutive_deployment_minutes
        distinguishing_aspect: |
          Opposite interval semantics from the daypart calendar: CLOSED wall-clock intervals plus a
          600-second changeover buffer, and the contended resource is a single StaffMember rather
          than the store's calendar. Here touching intervals are REJECTED (the buffer is the point),
          and the request that succeeds is the one separated by exactly 600 seconds.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant with labor_minutes_budget 300; one OOT-certified StaffMember with max_consecutive_deployment_minutes 90; one ACTIVE LUNCH DaypartProfile."
            - "One PLANNED OrderTakerDeployment at OOT_LANE_A covering the closed interval 11:00:00Z..11:30:00Z (planned_minutes 30)."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_2", cars_per_hour_floor: 6, cars_per_hour_ceiling: 12, target_relief_pct: 0.03, min_oot_count: 1, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_3", cars_per_hour_floor: 12, cars_per_hour_ceiling: 18, target_relief_pct: 0.07, min_oot_count: 2, merge_award_bias: "ACCURACY_FIRST" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_4", cars_per_hour_floor: 18, target_relief_pct: 0.12, min_oot_count: 3, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Tucker Staffing Store", store_number: "S-2398-T", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Kit Bello", oot_certified: true, window_certified: true, max_consecutive_deployment_minutes: 90 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${s1_id}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_A", planned_start_at: "2026-08-01T11:00:00Z", planned_end_at: "2026-08-01T11:30:00Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { d1_id: $.data.id, d1_minutes: $.data.planned_minutes }
          trigger:
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${s1_id}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_A", planned_start_at: "2026-08-01T11:30:00Z", planned_end_at: "2026-08-01T12:00:00Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${s1_id}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_A", planned_start_at: "2026-08-01T11:40:00Z", planned_end_at: "2026-08-01T12:10:00Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { d3_id: $.data.id, d3_minutes: $.data.planned_minutes, d3_state: $.data.deployment_state }
          assert:
            - "${d1_minutes} == 30 (1800 seconds / 60, ceiling applied)"
            - "Touching intervals rejected: HTTP 409 and ${err} == ERR_DEPLOYMENT_BUFFER_VIOLATION — a start 0 seconds after the previous end is inside the 600-second changeover buffer"
            - "Exactly 600 seconds of separation accepted: HTTP 201, ${d3_state} == PLANNED, ${d3_minutes} == 30 (11:40:00Z is 600 seconds after 11:30:00Z, so the buffer is satisfied, not violated)"
            - "GET /drive-thru/order-taker-deployments?staff_member_id=${s1_id} returns total_count 2 — only ${d1_id} and ${d3_id} exist"
            - "Restaurant.${r_id}.labor_minutes_committed == 0 and Restaurant.${r_id}.labor_minutes_available == 300 (both deployments are still PLANNED)"
            - "StaffMember.${s1_id}.staff_state == AVAILABLE and StaffMember.${s1_id}.deployed_minutes_today == 0"

      - name: override_aggregate_cap_on_intersecting_windows
        grounds:
          - validations.priority_23_ERR_OVERRIDE_AGGREGATE_CAP
          - entities.ForecastOverride.fields.effective_start_at
          - entities.ForecastOverride.fields.effective_end_at
          - entities.ForecastOverride.fields.projected_cars_delta_pct
          - state_machines.ForecastOverride.APPROVED_to_APPLIED
        distinguishing_aspect: |
          A third interval semantics — CLOSED effective windows tested for INTERSECTION rather than
          containment or buffered separation — over a third resource, the Restaurant's forecast
          headroom, where the constraint is on the SUM of the intersecting overrides' magnitudes
          (cap 0.50) rather than on any single interval.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant. Clock 11:00:00Z."
            - "Override O1 (LOCAL_EVENT, delta 0.30) over 11:00:00Z..13:00:00Z is approved and APPLIED, so 0.30 of the 0.50 cap is spent."
            - "Overrides O2 (WEATHER, delta 0.25) and O3 (SYSTEM_OUTAGE, delta 0.20), both over 12:00:00Z..14:00:00Z, are created and APPROVED but not applied. Both intersect O1 on 12:00:00Z..13:00:00Z."
            - "Each create re-reads Restaurant.version immediately beforehand, because every override create increments it."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_2", cars_per_hour_floor: 6, cars_per_hour_ceiling: 12, target_relief_pct: 0.03, min_oot_count: 1, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_3", cars_per_hour_floor: 12, cars_per_hour_ceiling: 18, target_relief_pct: 0.07, min_oot_count: 2, merge_award_bias: "ACCURACY_FIRST" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_4", cars_per_hour_floor: 18, target_relief_pct: 0.12, min_oot_count: 3, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Stone Mountain Event Store", store_number: "S-2398-U", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rv1: $.data.version }
            - call: "POST /drive-thru/forecast-overrides"
              payload: { restaurant_id: "${r_id}", source: "LOCAL_EVENT", effective_start_at: "2026-08-01T11:00:00Z", effective_end_at: "2026-08-01T13:00:00Z", projected_cars_delta_pct: 0.30, expected_restaurant_version: "${rv1}" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /drive-thru/forecast-overrides/${o1_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /drive-thru/forecast-overrides/${o1_id}/apply"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rv2: $.data.version }
            - call: "POST /drive-thru/forecast-overrides"
              payload: { restaurant_id: "${r_id}", source: "WEATHER", effective_start_at: "2026-08-01T12:00:00Z", effective_end_at: "2026-08-01T14:00:00Z", projected_cars_delta_pct: 0.25, expected_restaurant_version: "${rv2}" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /drive-thru/forecast-overrides/${o2_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rv3: $.data.version }
            - call: "POST /drive-thru/forecast-overrides"
              payload: { restaurant_id: "${r_id}", source: "SYSTEM_OUTAGE", effective_start_at: "2026-08-01T12:00:00Z", effective_end_at: "2026-08-01T14:00:00Z", projected_cars_delta_pct: 0.20, expected_restaurant_version: "${rv3}" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { o3_id: $.data.id }
            - call: "POST /drive-thru/forecast-overrides/${o3_id}/approve"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /drive-thru/forecast-overrides/${o2_id}/apply"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
            - call: "POST /drive-thru/forecast-overrides/${o3_id}/apply"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { o3_state: $.data.fo_state }
          assert:
            - "ForecastOverride.${o1_id}.fo_state == APPLIED (0.30 of the 0.50 cap in force over 11:00:00Z..13:00:00Z)"
            - "Over the cap: HTTP 422 and ${err} == ERR_OVERRIDE_AGGREGATE_CAP — 0.30 + 0.25 == 0.55 exceeds 0.50 across the intersection 12:00:00Z..13:00:00Z"
            - "ForecastOverride.${o2_id}.fo_state == APPROVED (the rejected apply left it in place)"
            - "Exactly at the cap: HTTP 200 and ${o3_state} == APPLIED — 0.30 + 0.20 == 0.50 is not above 0.50, so the boundary is inclusive"
            - "GET /drive-thru/forecast-overrides?restaurant_id=${r_id}&fo_state=APPLIED returns total_count 2"
            - "Restaurant.${r_id}.cars_per_hour_observed == 0.0 and Restaurant.${r_id}.volume_tier == TIER_1 (no car has closed, so the applied deltas scale a zero base) and Restaurant.${r_id}.service_posture == OPEN"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: labor_minutes_conserved_on_activate_then_abort
        grounds:
          - calculations.labor_minutes_ledger
          - state_machines.OrderTakerDeployment.ACTIVE_to_ABORTED
          - entities.Restaurant.fields.labor_minutes_committed
          - entities.Restaurant.fields.labor_minutes_available
          - entities.StaffMember.fields.deployed_minutes_today
        distinguishing_aspect: |
          Conserved quantity is the store's LABOR MINUTE ledger: labor_minutes_budget must always
          equal labor_minutes_committed + labor_minutes_available, and an abort must return the full
          planned_minutes with labor_minutes_charged left at 0 — no partial charge, no drift.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant with labor_minutes_budget 120; one OOT-certified StaffMember with max_consecutive_deployment_minutes 90; one ACTIVE LUNCH DaypartProfile."
            - "One OrderTakerDeployment at OOT_LANE_A for 11:00:00Z..11:30:00Z (planned_minutes 30), ACTIVATED at 11:00:00Z: labor_minutes_committed 30, labor_minutes_available 90, StaffMember.staff_state DEPLOYED."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
