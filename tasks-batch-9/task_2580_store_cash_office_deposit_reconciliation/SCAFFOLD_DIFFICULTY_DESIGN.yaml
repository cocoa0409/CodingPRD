scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: till_over_short_verified_drops_variant_flips_coaching_threshold
        grounds:
          - calculations.till_over_short
          - calculations.till_over_short.variants.verified_drops
          - calculations.till_over_short.variants.declared_drops
          - entities.TillSession.fields.variance_basis
          - entities.TillSession.fields.dropped_verified_cents
          - state_machines.TillSession.COUNTED_to_RECONCILED
          - endpoints["POST /cash-ops/deposits"]
        distinguishing_aspect: |
          The variant selector is the presence of dropped_verified_cents on the TillSession, and the
          two variants are separated by the drop-bag re-count delta of exactly 1000 cents: with the
          declared basis this session reports variance_cents == -2000 (below the store's 2500
          single-event threshold, no coaching), while with the verified basis the identical counted
          cash reports variance_cents == -3000 and fires coaching plus a SESSION_VARIANCE case.
        test_recipe:
          setup:
            - "Store S-1001 with single_event_variance_threshold_cents 2500, safe_time_delay_minutes 5 and dual_control_required true"
            - "MANUAL safe SAFE-A opened with 500000 and physically UNLOCKED at 16:55Z"
            - "Cashier E-100 ran register 1 on the 2026-08-03 journal with a 20000 starting bank"
            - "The cashier declared a 147500 closing drop; the cash office later re-counted those bags at 146500 while preparing an armored deposit, so dropped_verified_cents is 146500 and dropped_declared_cents is 147500"
            - "The till was blind-counted at 18000 and sits in status COUNTED"
            - "Logical clock is 2026-08-03T17:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1001", name: "Store 1001", region_code: "WEST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true, single_event_variance_threshold_cents: 2500, rolling_variance_threshold_cents: 10000 }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:50:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "End of shift drop and deposit prep" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:55:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /cash-ops/till-sessions/${session_id}/drops"
              payload: { txn_type: "CLOSING_DROP", declared_amount_cents: 147500, memo: "Closing drop register 1" }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T17:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_id}/close"
              payload: { pos_cash_sales_cents: 150000, pos_card_sales_cents: 80000, pos_paid_out_cents: 2500 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /cash-ops/till-sessions/${session_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 9 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "GET /cash-ops/safes/${safe_id}"
              payload: {}
              as: CashOfficeClerk
              captures: { safe_v: $.data.version }
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 70 }, { denomination_cents: 1000, quantity: 6 }, { denomination_cents: 100, quantity: 5 }], expected_safe_version: "${safe_v}", verify_till_session_ids: ["${session_id}"] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { deposit_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/till-sessions/${session_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          assert:
            - "TillSession.${session_id}.dropped_declared_cents == 147500"
            - "TillSession.${session_id}.dropped_verified_cents == 146500"
            - "TillSession.${session_id}.variance_basis == VERIFIED_DROPS"
            - "TillSession.${session_id}.expected_cash_cents == 21000"
            - "TillSession.${session_id}.variance_cents == -3000"
            - "TillSession.${session_id}.status == RECONCILED"
            - "Cashier.${cashier_id}.coaching_state == COACHING_DUE"
            - "Cashier.${cashier_id}.coaching_due_at == 2026-08-06T17:00:00Z"
            - "Cashier.${cashier_id}.rolling_absolute_variance_cents == 3000"
            - "Cashier.${cashier_id}.rolling_net_variance_cents == -3000"
            - "Cashier.${cashier_id}.till_eligibility == ELIGIBLE"
            - "GET /cash-ops/variance-cases?sales_journal_id=${journal_id} returns exactly 1 case with case_type == SESSION_VARIANCE and total_variance_cents == 3000"
            - "Had the declared basis been used (deposit preparation skipped), expected_cash_cents would be 20000, variance_cents would be -2000, and Cashier.${cashier_id}.coaching_state would still be NONE"

      - name: provisional_credit_smart_validator_versus_carrier_receipt_divergence
        grounds:
          - calculations.provisional_credit
          - calculations.provisional_credit.variants.smart_safe_insertion
          - calculations.provisional_credit.variants.carrier_receipt
          - entities.Deposit.fields.credit_basis
          - entities.Safe.fields.provisional_credit_balance_cents
          - endpoints["POST /cash-ops/safes/{id}/smart-deposits"]
          - endpoints["POST /cash-ops/deposits/{id}/pickup"]
        distinguishing_aspect: |
          The variant selector is Deposit.credit_basis, and the divergence is driven by two
          independent exclusions rather than by a rate: the smart-safe validator drops every line
          below 500 cents AND subtracts suspect_note_cents, so the identical physical bag of
          100 x 2000 + 400 x 100 + 80 x 25 with 4000 suspect notes earns 196000 through the smart
          safe and 242000 on the carrier receipt — a 46000 divergence on the same cash.
          Distinct from the till_over_short pair, whose divergence is a 1000-cent re-count delta on
          a TillSession selected by the presence of a verified re-count, rather than a
          denomination/suspect-note filter on a Deposit selected by a stored credit_basis enum.
        test_recipe:
          setup:
            - "Store S-1002 with dual_control_required true, safe_time_delay_minutes 5, provisional_credit_cap_cents 500000"
            - "SMART safe SAFE-S commissioned with 0 opening balance"
            - "MANUAL safe SAFE-M commissioned with 500000 opening balance and UNLOCKED"
            - "Sales journal for 2026-08-03"
            - "One SMART_SAFE deposit already inserted with the reference bag and 4000 suspect notes"
            - "One MANUAL_ARMORED deposit prepared from the identical bag, sealed under dual control and scheduled for a 14:00Z-14:30Z pickup"
            - "Logical clock advanced to 2026-08-03T14:05:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1002", name: "Store 1002", region_code: "WEST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true, provisional_credit_cap_cents: 500000 }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-S", safe_type: "SMART", opening_balance_cents: 0 }
              as: TreasuryAnalyst
              captures: { smart_safe_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-M", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { manual_safe_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/safes/${smart_safe_id}/smart-deposits"
              payload: { sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 100 }, { denomination_cents: 100, quantity: 400 }, { denomination_cents: 25, quantity: 80 }], suspect_note_cents: 4000 }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { smart_deposit_id: $.data.id }
            - call: "POST /cash-ops/safes/${manual_safe_id}/open-requests"
              payload: { reason: "Prepare armored deposit" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${manual_safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "GET /cash-ops/safes/${manual_safe_id}"
              payload: {}
              as: CashOfficeClerk
              captures: { manual_safe_v: $.data.version }
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${manual_safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 100 }, { denomination_cents: 100, quantity: 400 }, { denomination_cents: 25, quantity: 80 }], expected_safe_version: "${manual_safe_v}", suspect_note_cents: 4000 }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { manual_deposit_id: $.data.id }
            - call: "POST /cash-ops/deposits/${manual_deposit_id}/seal"
              payload: { seal_number: "SEAL-M-001" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /cash-ops/deposits/${manual_deposit_id}/schedule-pickup"
              payload: { pickup_window_start: "2026-08-03T14:00:00Z", pickup_window_end: "2026-08-03T14:30:00Z", carrier_reference: "CR-M-001" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T14:05:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /cash-ops/deposits/${manual_deposit_id}/pickup"
              payload: { picked_up_at: "2026-08-03T14:05:00Z", carrier_signature: "SIG-CARRIER-7" }
              as: ArmoredCarrier
              as_user_id: "U-CARRIER-7"
          assert:
            - "Deposit.${smart_deposit_id}.declared_total_cents == 242000"
            - "Deposit.${smart_deposit_id}.credit_basis == SMART_PROVISIONAL"
            - "Deposit.${smart_deposit_id}.provisional_credit_cents == 196000"
            - "Deposit.${manual_deposit_id}.declared_total_cents == 242000"
            - "Deposit.${manual_deposit_id}.credit_basis == CARRIER_PROVISIONAL"
            - "Deposit.${manual_deposit_id}.provisional_credit_cents == 242000"
            - "Deposit.${manual_deposit_id}.status == IN_TRANSIT"
            - "Deposit.${manual_deposit_id}.provisional_credit_cents - Deposit.${smart_deposit_id}.provisional_credit_cents == 46000"
            - "Safe.${smart_safe_id}.provisional_credit_balance_cents == 196000"
            - "Safe.${manual_safe_id}.provisional_credit_balance_cents == 242000"
            - "Safe.${smart_safe_id}.suspect_note_cents == 4000"

  - rule_id: combinatorial_formula
    instances:
      - name: change_order_strap_rounding_per_line_before_summation
        grounds:
          - calculations.change_order_denomination_plan
          - entities.ChangeOrder.fields.planned_lines
          - entities.ChangeOrder.fields.total_planned_cents
          - entities.ChangeOrder.fields.applied_seasonal_profile
          - entities.Store.fields.seasonal_profile
          - endpoints["POST /cash-ops/change-orders"]
        distinguishing_aspect: |
          Mode (b) nested rounding: the ceil-to-whole-strap step is applied inside the per-denomination
          loop and only then summed, so total_planned_cents is 1106000; applying the same ceil once to
          the summed exact targets yields 1007200, a 98800 difference that no reordering of the
          multiplications can produce.
        test_recipe:
          setup:
            - "Store S-1003 registered with seasonal_profile BASELINE"
            - "No change orders exist yet"
            - "Logical clock is 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1003", name: "Store 1003", region_code: "EAST", seasonal_profile: "BASELINE" }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/change-orders"
              payload: { store_id: "${store_id}", target_week_start: "2026-08-10", days_covered: 7, baseline_daily_cash_demand_cents: 80000, growth_pct: 0, seasonal_profile_override: "HOLIDAY" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { change_order_id: $.data.id }
          assert:
            - "ChangeOrder.${change_order_id}.applied_seasonal_profile == HOLIDAY"
            - "ChangeOrder.${change_order_id}.forecast_demand_cents == 1008000"
            - "ChangeOrder.${change_order_id}.status == DRAFT"
            - "ChangeOrder.${change_order_id}.planned_lines has exactly 5 entries ordered 2000, 1000, 500, 100, 25"
            - "planned_lines[0] == { denomination_cents: 2000, strap_count: 11, units: 275, planned_cents: 550000 }"
            - "planned_lines[1] == { denomination_cents: 1000, strap_count: 9, units: 225, planned_cents: 225000 }"
            - "planned_lines[2] == { denomination_cents: 500, strap_count: 7, units: 350, planned_cents: 175000 }"
            - "planned_lines[3] == { denomination_cents: 100, strap_count: 21, units: 1050, planned_cents: 105000 }"
            - "planned_lines[4] == { denomination_cents: 25, strap_count: 51, units: 2040, planned_cents: 51000 }"
            - "ChangeOrder.${change_order_id}.total_planned_cents == 1106000"
            - "ChangeOrder.${change_order_id}.total_planned_cents != 1007200"

      - name: carrier_fee_tier_keyed_on_declared_total_not_expected_credit
        grounds:
          - calculations.bank_credit_reconciliation
          - entities.Deposit.fields.carrier_fee_cents
          - entities.Deposit.fields.expected_credit_cents
          - entities.Deposit.fields.declared_total_cents
          - endpoints["POST /cash-ops/deposits"]
        distinguishing_aspect: |
          Mode (c) evaluation-order dependence: the ceil() thousand-dollar count must be taken on
          declared_total_cents 200500 (3 thousands, fee 1305, expected_credit 199195); taking it on
          the fee-reduced expected_credit instead gives 2 thousands, fee 1270 and expected_credit
          199230, so the two orders differ by 35 cents of fee and 35 cents of credit on identical
          inputs. Distinct from the change-order instance, which is a rounding-placement (mode b)
          question with no reordering of dependent steps.
        test_recipe:
          setup:
            - "Store S-1004 with dual_control_required true and safe_time_delay_minutes 5"
            - "MANUAL safe SAFE-A opened with 500000 and UNLOCKED at 09:05Z"
            - "Sales journal for 2026-08-03 exists"
            - "No deposits exist yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1004", name: "Store 1004", region_code: "EAST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Prepare armored deposit" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "GET /cash-ops/safes/${safe_id}"
              payload: {}
              as: CashOfficeClerk
              captures: { safe_v: $.data.version }
          trigger:
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 100 }, { denomination_cents: 100, quantity: 5 }], expected_safe_version: "${safe_v}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { deposit_id: $.data.id }
          assert:
            - "Deposit.${deposit_id}.declared_total_cents == 200500"
            - "Deposit.${deposit_id}.carrier_fee_cents == 1305"
            - "Deposit.${deposit_id}.expected_credit_cents == 199195"
            - "Deposit.${deposit_id}.carrier_fee_cents != 1270"
            - "Deposit.${deposit_id}.expected_credit_cents != 199230"
            - "Deposit.${deposit_id}.status == PREPARING"
            - "Safe.${safe_id}.balance_cents == 299500"
            - "Safe.${safe_id}.open_state == UNLOCKED"

  - rule_id: non_linear_state_machine
    instances:
      - name: till_session_recount_cycle_returns_to_pending_count
        grounds:
          - state_machines.TillSession.COUNTED_to_PENDING_COUNT
          - state_machines.TillSession.PENDING_COUNT_to_COUNTED
          - entities.TillSession.fields.recount_count
          - entities.TillSession.fields.counted_cash_cents
          - validations[priority=40]
          - endpoints["POST /cash-ops/till-sessions/{id}/recount"]
        distinguishing_aspect: |
          The TillSession re-enters PENDING_COUNT from COUNTED, so the same trigger (blind-count)
          is legal twice on one entity while reconcile is illegal in the interleaved state: the
          non-linearity is a counter-bearing loop whose second pass discards the first count
          (counted_cash_cents 18000 becomes null and then 20000, recount_count 0 -> 1).
        test_recipe:
          setup:
            - "Store S-1005, MANUAL safe SAFE-A with 500000, UNLOCKED at 09:05Z"
            - "Cashier E-100 on register 1 of the 2026-08-03 journal with a 20000 starting bank"
            - "A declared closing drop of 147500 recorded, POS totals posted at close (cash 150000, paid out 2500)"
            - "First blind count of 18000 recorded, session in status COUNTED, recount_count 0"
            - "No deposit has been prepared, so dropped_verified_cents is null"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1005", name: "Store 1005", region_code: "WEST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true, single_event_variance_threshold_cents: 2500 }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              captures: { session_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Closing drop" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /cash-ops/till-sessions/${session_id}/drops"
              payload: { txn_type: "CLOSING_DROP", declared_amount_cents: 147500 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T17:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_id}/close"
              payload: { pos_cash_sales_cents: 150000, pos_card_sales_cents: 80000, pos_paid_out_cents: 2500 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /cash-ops/till-sessions/${session_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 9 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          trigger:
            - call: "POST /cash-ops/till-sessions/${session_id}/recount"
              payload: { recount_reason: "Strap suspected miscounted" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "POST /cash-ops/till-sessions/${session_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "POST /cash-ops/till-sessions/${session_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 10 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-4"
            - call: "POST /cash-ops/till-sessions/${session_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          assert:
            - "after the recount call: TillSession.${session_id}.status == PENDING_COUNT, recount_count == 1, counted_cash_cents == null, counted_by_user_id == null"
            - "the reconcile attempted while status == PENDING_COUNT returns 409 with error_id == ERR_TILL_SESSION_INVALID_STATE and leaves recount_count == 1"
            - "after the second blind-count: TillSession.${session_id}.status == COUNTED, counted_cash_cents == 20000, recount_count == 1, counted_by_user_id == U-CLERK-4"
            - "after the final reconcile: TillSession.${session_id}.status == RECONCILED, variance_basis == DECLARED_DROPS, expected_cash_cents == 20000, variance_cents == 0"
            - "Cashier.${cashier_id}.coaching_state == NONE"
            - "Cashier.${cashier_id}.rolling_absolute_variance_cents == 0"
            - "GET /cash-ops/variance-cases?sales_journal_id=${journal_id} returns 0 cases"

      - name: safe_open_state_reverts_to_locked_on_window_expiry_then_cycles_again
        grounds:
          - state_machines.Safe.LOCKED_to_OPEN_REQUESTED
          - state_machines.Safe.OPEN_REQUESTED_to_LOCKED
          - state_machines.Safe.OPEN_REQUESTED_to_UNLOCKED
          - state_machines.Safe.UNLOCKED_to_LOCKED
          - validations[priority=56]
          - entities.Safe.fields.open_requested_at
          - endpoints["POST /cash-ops/safes/{id}/open"]
        distinguishing_aspect: |
          The Safe visits LOCKED three times by three different causes within one test: initial
          commissioning, a time-window expiry that reverts OPEN_REQUESTED -> LOCKED while returning
          ERR_SAFE_OPEN_REQUEST_EXPIRED, and a deposit seal that drives UNLOCKED -> LOCKED. Unlike
          the TillSession loop the re-entry is not counter-bounded and is caused by clock advance
          on a failed call rather than by an operator action.
        test_recipe:
          setup:
            - "Store S-1006 with safe_time_delay_minutes 5, safe_open_window_minutes 10, dual_control_required true"
            - "MANUAL safe SAFE-A commissioned with 500000, open_state LOCKED"
            - "Sales journal for 2026-08-03 exists"
            - "An open request was armed by U-CLERK-1 at 18:00:00Z and the clock has advanced to 18:15:00Z, exactly the exclusive end of the 5+10 minute window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T18:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1006", name: "Store 1006", region_code: "WEST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "First attempt" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T18:15:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Second attempt after lapse" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T18:20:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "GET /cash-ops/safes/${safe_id}"
              payload: {}
              as: CashOfficeClerk
              captures: { safe_v: $.data.version }
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 2 }, { denomination_cents: 1000, quantity: 1 }], expected_safe_version: "${safe_v}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { deposit_id: $.data.id }
            - call: "POST /cash-ops/deposits/${deposit_id}/seal"
              payload: { seal_number: "SEAL-A-001" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
          assert:
            - "the first open call returns 409 with error_id == ERR_SAFE_OPEN_REQUEST_EXPIRED"
            - "immediately after that failure Safe.${safe_id}.open_state == LOCKED and open_requested_at == null and open_requested_by_user_id == null"
            - "after the second open-requests call Safe.${safe_id}.open_state == OPEN_REQUESTED and open_requested_at == 2026-08-03T18:15:00Z"
            - "after the second open call Safe.${safe_id}.open_state == UNLOCKED and unlocked_at == 2026-08-03T18:20:00Z"
            - "after the seal Safe.${safe_id}.open_state == LOCKED and open_requested_at == null"
            - "Deposit.${deposit_id}.status == SEALED and Deposit.${deposit_id}.declared_total_cents == 5000"
            - "Safe.${safe_id}.balance_cents == 495000"

  - rule_id: transitive_cascade
    instances:
      - name: reconcile_cascade_session_to_cashier_to_case_to_journal
        grounds:
          - state_machines.TillSession.COUNTED_to_RECONCILED
          - calculations.till_over_short
          - calculations.cashier_rolling_variance
          - calculations.variance_case_opening
          - entities.Cashier.fields.till_eligibility
          - entities.VarianceCase.fields.case_type
          - entities.SalesJournal.fields.register_cash_tieout_cents
          - endpoints["POST /cash-ops/till-sessions/{id}/reconcile"]
        distinguishing_aspect: |
          Four causally chained links from a single reconcile: (1) the session's variance_cents is
          computed as -7000; (2) BECAUSE of that figure the cashier's rolling absolute variance
          reaches exactly 10000 and till_eligibility flips to RESTRICTED; (3) BECAUSE the rolling
          threshold was crossed a ROLLING_PATTERN VarianceCase is opened; (4) BECAUSE that case
          exists the journal's open_case_count reaches 3 and its status is derived OUT_OF_BALANCE.
          Removing link 2 removes links 3 and 4.
        test_recipe:
          setup:
            - "Store S-1007 with single_event_variance_threshold_cents 2500, rolling_variance_threshold_cents 10000, rolling_window_days 30"
            - "MANUAL safe SAFE-A with 500000, UNLOCKED at 09:05Z and left unlocked all day"
            - "Cashier E-100 with one already-RECONCILED session A (register 1, 09:00-13:00) whose variance_cents is -3000, so rolling_absolute_variance_cents is 3000 and coaching_state is COACHING_DUE at 13:00Z"
            - "Session B (register 2, 13:00-17:00, starting bank 20000) closed with POS cash 150000 and paid out 0, a declared closing drop of 150000, blind-counted at 13000, status COUNTED"
            - "Logical clock is 2026-08-03T17:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1007", name: "Store 1007", region_code: "WEST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true, single_event_variance_threshold_cents: 2500, rolling_variance_threshold_cents: 10000, rolling_window_days: 30, theft_escalation_threshold_cents: 50000 }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
