            - "CoverageUnit.${cu_id}.status == SETTLED"
            - "Policy.${policy_id}.premium_reserve_cents == 2992   (7992 - 5000)"
            - "Policy.${policy_id}.version == ${p_v_pre} + 1"
            - "Grower.${grower_id}.prior_claims_count == ${g_claims_pre} + 1"

      - name: debar_grower_cascades_to_policies_then_claims
        grounds:
          - state_machines.Grower.ACTIVE_to_DEBARRED
        distinguishing_aspect: |
          Different trigger than the other instance. Depth-2 cascade: Grower
          debar → Policy cancellations (multiple) → Claim withdrawals on each
          cancelled policy. Trigger is POST .../growers/{id}/debar, NOT a
          determination.
