        claim_type: immediate
        grounds: ["calculations.school_evaluation_budget", "entities.EvaluationCycle.fields.evidence_artifact_count"]
        excluded_because:
          difficulty_instance: compensating_invariant / submit_then_void_restores_school_budget_exactly
          rationale: "That instance reads the school ledger between the forward and the compensating action and asserts the committed and remaining cents at each step, which is exactly the immediate-consistency claim."
