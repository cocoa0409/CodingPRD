scenario: |
  Assessment Item Bank & Test Development (state assessment vendor): item
  authoring & content-standard alignment, bias/sensitivity review & content
  review committee, field testing & item statistics (difficulty/discrimination),
  form assembly to blueprint & equating, item exposure control & retirement,
  secure item storage & access rights, translation/accessibility variant,
  technical documentation & validity evidence

domain_name: assessment-item-bank
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AssessmentProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code (e.g. 'MATH-G8-2026')" }
      - { name: subject, type: enum, source: input, description: "MATH | ELA | SCIENCE | SOCIAL_STUDIES" }
      - { name: grade_level, type: integer, source: input, description: "Grade 3..12" }
      - { name: admin_year, type: integer, source: input, description: "Administration year (e.g. 2026)" }
      - { name: current_period_utc, type: datetime, source: system, description: "Logical program clock; initialized to 2026-08-01T00:00:00Z at creation; advanced via /clock/advance" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | ARCHIVED" }

  - name: ContentStandard
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: standard_code, type: string, source: input, description: "E.g. 'CCSS.MATH.8.EE.B.5'" }
      - { name: strand, type: string, source: input, description: "Top-level strand (e.g. 'Expressions & Equations')" }
      - { name: description, type: string, source: input, description: "Standard text" }
      - { name: depth_of_knowledge, type: integer, source: input, description: "DOK level 1..4" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DEPRECATED" }

  - name: Item
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: item_code, type: string, source: input, description: "Vendor-wide unique item identifier" }
      - { name: primary_standard_id, type: string, source: input, description: "FK -> ContentStandard.id; primary alignment" }
      - { name: secondary_standard_ids, type: array, source: input, description: "Additional ContentStandard.id alignments (0..3)" }
      - { name: item_type, type: enum, source: input, description: "MC | MS | EBSR | TE | CR" }
      - { name: stimulus_html, type: string, source: input, description: "Item stem / prompt HTML" }
      - { name: options_json, type: object, source: input, description: "Choices, correct keys, distractor rationales" }
      - { name: max_score_points, type: integer, source: input, description: "Maximum score, 1..6" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of creating ItemWriter" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle: DRAFT | SUBMITTED | CONTENT_REVIEW | BIAS_REVIEW | FIELD_TEST_ELIGIBLE | FIELD_TESTING | STATS_REVIEW | OPERATIONAL | RETIRED | REJECTED" }
      - { name: security_posture, type: enum, source: system, default: UNSECURED, description: "Parallel dimension: UNSECURED | SECURED | EXPOSED | COMPROMISED" }
      - { name: content_review_outcome, type: enum, source: system, default: PENDING, description: "PENDING | PASSED | FAILED | REVISE" }
      - { name: bias_review_outcome, type: enum, source: system, default: PENDING, description: "PENDING | PASSED | FAILED | REVISE" }
      - { name: revision_cycle_count, type: integer, source: system, default: 0, description: "How many times item bounced back from review to DRAFT" }
      - { name: field_test_attempt_count, type: integer, source: system, default: 0, description: "How many distinct FieldTestWindows this item has been administered in" }
      - { name: operational_exposure_count, type: integer, source: system, default: 0, description: "Cumulative count of operational FormItemSlots that reference this item across non-archived TestForms" }
      - { name: exposure_cap, type: integer, source: input, default: 3, description: "Per-item maximum allowed operational_exposure_count; default 3" }
      - { name: retired_at, type: datetime, source: system, description: "Timestamp of retirement; null if not retired" }
      - { name: retirement_reason, type: enum, source: system, description: "STATISTICAL_FAIL | BIAS_CONFIRMED | OVER_EXPOSED | CONTENT_DEPRECATED | MANUAL" }
      - { name: p_value_provisional, type: number, source: computed, description: "Provisional difficulty (mean score / max_score_points) over in-window non-excluded ItemResponses" }
      - { name: p_value_final, type: number, source: computed, description: "Final difficulty over non-excluded ItemResponses whose response_timestamp falls in [window.start, window.end] (closed) AND attempt_duration_seconds >= MIN_DURATION" }
      - { name: point_biserial_provisional, type: number, source: computed, description: "Provisional discrimination (point-biserial of item score vs total window score) over non-excluded responses" }
      - { name: point_biserial_final, type: number, source: computed, description: "Final discrimination with the same filter as p_value_final" }

  - name: ReviewCommittee
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: committee_kind, type: enum, source: input, description: "CONTENT | BIAS_SENSITIVITY" }
      - { name: name, type: string, source: input, description: "Committee display name" }
      - { name: quorum_size, type: integer, source: input, description: "Minimum ACCEPT/REJECT verdicts required to close a session agenda item, 2..7" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISSOLVED" }

  - name: ReviewSession
    parent: ReviewCommittee
    common_fields: true
    fields:
      - { name: committee_id, type: string, source: system, description: "FK -> ReviewCommittee.id" }
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id (denormalized for query)" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned start time" }
      - { name: started_at, type: datetime, source: system, description: "Set on OPEN transition" }
      - { name: closed_at, type: datetime, source: system, description: "Set on CLOSED transition" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OPEN | CLOSED | CANCELLED" }
      - { name: agenda_item_ids, type: array, source: input, description: "Ordered list of Item.id placed on agenda; max 25" }

  - name: ReviewVerdict
    parent: ReviewSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> ReviewSession.id" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id (must be on session agenda)" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of acting ContentReviewer or BiasSensitivityReviewer" }
      - { name: verdict, type: enum, source: input, description: "ACCEPT | REJECT | REVISE" }
      - { name: rationale, type: string, source: input, description: "Required when verdict != ACCEPT; min 20 chars" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on POST" }
      - { name: soft_deleted, type: boolean, source: system, default: false, description: "True if parent session was CANCELLED after this verdict was cast" }

  - name: FieldTestWindow
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: window_label, type: string, source: input, description: "Label (e.g. 'SPRING-2026-FT1')" }
      - { name: start_utc, type: datetime, source: input, description: "Inclusive start" }
      - { name: end_utc, type: datetime, source: input, description: "Inclusive end (must be > start_utc)" }
      - { name: target_sample_size, type: integer, source: input, description: "Minimum responses required per item before stats finalize, 50..10000" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OPEN | CLOSED" }

  - name: ItemResponse
    parent: FieldTestWindow
    common_fields: false
    fields:
      - { name: window_id, type: string, source: system, description: "FK -> FieldTestWindow.id" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id" }
      - { name: student_anon_id, type: string, source: input, description: "Pseudonymous student id" }
      - { name: response_timestamp, type: datetime, source: input, description: "Client-supplied response time" }
      - { name: attempt_duration_seconds, type: integer, source: input, description: "Time on item; must be >= 0" }
      - { name: raw_score, type: integer, source: input, description: "0..item.max_score_points" }
      - { name: excluded, type: boolean, source: system, default: false, description: "True if invalidated by Psychometrician" }

  - name: ItemStatistic
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id" }
      - { name: window_id, type: string, source: system, description: "FK -> FieldTestWindow.id" }
      - { name: n_responses, type: integer, source: computed, description: "Count of non-excluded ItemResponses in this window for this item" }
      - { name: p_value, type: number, source: computed, description: "Difficulty: mean(raw_score) / item.max_score_points over non-excluded responses, rounded 4 decimals half-up" }
      - { name: point_biserial, type: number, source: computed, description: "Discrimination: Pearson r of (raw_score, total_score_excluding_item) over non-excluded responses, rounded 4 decimals half-up" }
      - { name: stats_kind, type: enum, source: system, description: "PROVISIONAL | FINAL" }
      - { name: finalized_at, type: datetime, source: system, description: "Set when stats_kind becomes FINAL; null otherwise" }
      - { name: pass_flag, type: enum, source: computed, description: "PASS | FAIL_BORDERLINE | FAIL_SEVERE; derived from p_value and point_biserial at finalization" }

  - name: TestBlueprint
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: blueprint_code, type: string, source: input, description: "Blueprint identifier" }
      - { name: sections, type: array, source: input, description: "Array of {strand, item_count, dok_min, dok_max}; 1..8 sections" }
      - { name: total_items_required, type: integer, source: computed, description: "Sum of sections[*].item_count" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | LOCKED | SUPERSEDED" }

  - name: TestForm
    parent: TestBlueprint
    common_fields: true
    fields:
      - { name: blueprint_id, type: string, source: system, description: "FK -> TestBlueprint.id" }
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id (denormalized)" }
      - { name: form_code, type: string, source: input, description: "Unique within blueprint" }
      - { name: intended_admin_date, type: datetime, source: input, description: "Planned administration date" }
      - { name: status, type: enum, source: system, default: ASSEMBLING, description: "ASSEMBLING | ASSEMBLED | EQUATED | PUBLISHED | ARCHIVED" }
      - { name: assembled_at, type: datetime, source: system, description: "Set on ASSEMBLED transition" }
      - { name: published_at, type: datetime, source: system, description: "Set on PUBLISHED transition" }

  - name: FormItemSlot
    parent: TestForm
    common_fields: true
    fields:
      - { name: form_id, type: string, source: system, description: "FK -> TestForm.id" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id" }
      - { name: section_index, type: integer, source: input, description: "0-based index into blueprint.sections" }
      - { name: position_in_section, type: integer, source: input, description: "1-based order within section" }
      - { name: is_anchor, type: boolean, source: input, default: false, description: "True if this slot participates in equating anchor set" }
      - { name: points_possible, type: integer, source: system, description: "Copied from item.max_score_points at slot creation" }

  - name: EquatingLink
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: source_form_id, type: string, source: input, description: "FK -> TestForm.id (earlier form)" }
      - { name: target_form_id, type: string, source: input, description: "FK -> TestForm.id (later form)" }
      - { name: anchor_item_ids, type: array, source: input, description: "List of Item.id forming the anchor set; must be slots on BOTH forms with is_anchor=true" }
      - { name: scaling_slope, type: number, source: computed, description: "A coefficient in y = A*x + B; mean/sigma method over anchor item p_value_final" }
      - { name: scaling_intercept, type: number, source: computed, description: "B coefficient in y = A*x + B" }
      - { name: equated_at, type: datetime, source: system, description: "Set on creation" }

  - name: ItemVariant
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id (the source item)" }
      - { name: variant_kind, type: enum, source: input, description: "TRANSLATION | ACCOMMODATION" }
      - { name: language_code, type: string, source: input, description: "Required iff variant_kind=TRANSLATION; e.g. 'es', 'vi'; null otherwise" }
      - { name: accommodation_code, type: enum, source: input, description: "Required iff variant_kind=ACCOMMODATION: LARGE_PRINT | SCREEN_READER | BRAILLE | READ_ALOUD | EXTENDED_TIME" }
      - { name: stimulus_html, type: string, source: input, description: "Variant stimulus" }
      - { name: options_json, type: object, source: input, description: "Variant options" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVED | REJECTED" }

  - name: AccessGrant
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: grantee_user_id, type: string, source: input, description: "User being granted access" }
      - { name: grant_scope, type: enum, source: input, description: "ITEM_READ | ITEM_WRITE | STATS_READ | FORM_ASSEMBLE | GRANT_ADMIN" }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start" }
      - { name: valid_until, type: datetime, source: input, description: "Inclusive end; must be > valid_from" }
      - { name: revoked_at, type: datetime, source: system, description: "Set on revocation; null while active" }

  - name: ValidityDossier
    parent: AssessmentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AssessmentProgram.id" }
      - { name: form_id, type: string, source: input, description: "FK -> TestForm.id (the form this dossier documents)" }
      - { name: dossier_kind, type: enum, source: input, description: "TECHNICAL_MANUAL | VALIDITY_EVIDENCE | RELIABILITY_REPORT" }
      - { name: content_md, type: string, source: input, description: "Markdown body; min 200 chars" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, description: "Set on PUBLISHED transition" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Item
    initial_state: DRAFT
    terminal_states: [RETIRED, REJECTED]
    note: "Item has TWO parallel state dimensions: `status` (lifecycle) and `security_posture`. Transitions on one dimension do not change the other unless listed in side_effects."
    transitions:
      # --- Lifecycle transitions ---
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/items/{itemId}/submit"
        actor: ItemWriter
        preconditions:
          - "Item.status == DRAFT (ERR_ITEM_NOT_IN_DRAFT)"
          - "Item.author_user_id == X-User-ID (ERR_NOT_ITEM_AUTHOR)"
          - "primary_standard_id references an ACTIVE ContentStandard in same program (ERR_STANDARD_NOT_ACTIVE)"
        side_effects:
          - "content_review_outcome := PENDING; bias_review_outcome := PENDING"
          - "Increments Item.version by 1"

      - from: SUBMITTED
        to: CONTENT_REVIEW
        trigger: "system (automatic on SUBMITTED entry)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Auto-promotion on submit"

      - from: CONTENT_REVIEW
        to: BIAS_REVIEW
        trigger: "system (automatic when a CONTENT ReviewSession closes with quorum ACCEPT verdicts on this item)"
        actor: system
        preconditions:
          - "Closing ReviewSession.committee.committee_kind == CONTENT"
          - "Count of ACCEPT ReviewVerdicts on this item in this session >= committee.quorum_size"
        side_effects:
          - "content_review_outcome := PASSED"

      - from: CONTENT_REVIEW
        to: DRAFT
        trigger: "system (when content session closes with quorum REVISE, OR plurality REJECT but not quorum REJECT)"
        actor: system
        preconditions:
          - "Closing ReviewSession.committee.committee_kind == CONTENT"
          - "REVISE verdicts >= quorum_size OR (REJECT verdicts >= quorum_size but REJECT < (ACCEPT + REVISE))"
        side_effects:
          - "content_review_outcome := REVISE"
          - "revision_cycle_count += 1"
          - "If revision_cycle_count > 3 then transition to REJECTED instead (see ERR_ITEM_REVISION_EXHAUSTED note)"

      - from: CONTENT_REVIEW
        to: REJECTED
        trigger: "system (when content session closes with quorum REJECT AND REJECT >= ACCEPT + REVISE)"
        actor: system
        preconditions:
          - "Closing ReviewSession.committee.committee_kind == CONTENT"
          - "REJECT verdicts >= quorum_size AND REJECT >= ACCEPT + REVISE"
        side_effects:
          - "content_review_outcome := FAILED"
          - "retirement_reason := CONTENT_DEPRECATED"
          - "Cascade: all non-terminal ItemVariants of this item -> REJECTED"

      - from: BIAS_REVIEW
        to: FIELD_TEST_ELIGIBLE
        trigger: "system (automatic when a BIAS_SENSITIVITY ReviewSession closes with quorum ACCEPT on this item)"
        actor: system
        preconditions:
          - "Closing ReviewSession.committee.committee_kind == BIAS_SENSITIVITY"
          - "ACCEPT verdicts >= quorum_size"
        side_effects:
          - "bias_review_outcome := PASSED"
          - "security_posture := SECURED (item enters secure bank)"

      - from: BIAS_REVIEW
        to: DRAFT
        trigger: "system (bias session closes with quorum REVISE)"
        actor: system
        preconditions: []
        side_effects:
          - "bias_review_outcome := REVISE"
          - "revision_cycle_count += 1"

      - from: BIAS_REVIEW
        to: REJECTED
        trigger: "system (bias session closes with quorum REJECT)"
        actor: system
        preconditions: []
        side_effects:
          - "bias_review_outcome := FAILED"
          - "retirement_reason := BIAS_CONFIRMED"
          - "Cascade: all non-terminal ItemVariants -> REJECTED"

      - from: FIELD_TEST_ELIGIBLE
        to: FIELD_TESTING
        trigger: "system (first ItemResponse ingested against this item in an OPEN FieldTestWindow)"
        actor: system
        preconditions:
          - "Parent FieldTestWindow.status == OPEN"
        side_effects:
          - "field_test_attempt_count += 1"

      - from: FIELD_TESTING
        to: STATS_REVIEW
        trigger: "system (the FieldTestWindow in which this item has responses transitions OPEN -> CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Compute ItemStatistic PROVISIONAL row for (item, window) and write p_value_provisional + point_biserial_provisional onto Item"
          - "If window.target_sample_size met (n_responses >= target_sample_size) then also compute FINAL row and write p_value_final + point_biserial_final"

      - from: STATS_REVIEW
        to: OPERATIONAL
        trigger: "POST /api/items/{itemId}/approve-operational"
        actor: Psychometrician
        preconditions:
          - "Item.status == STATS_REVIEW (ERR_ITEM_NOT_IN_STATS_REVIEW)"
          - "ItemStatistic.pass_flag for the most recent (by window.end_utc) FINAL row == PASS (ERR_ITEM_STATS_NOT_PASSING)"
          - "Item has at least one FINAL ItemStatistic row (ERR_NO_FINAL_STATS)"
        side_effects:
          - "Item remains SECURED"

      - from: STATS_REVIEW
        to: RETIRED
        trigger: "POST /api/items/{itemId}/retire"
        actor: Psychometrician
        preconditions:
          - "Item.status == STATS_REVIEW"
          - "Most recent FINAL ItemStatistic.pass_flag in {FAIL_BORDERLINE, FAIL_SEVERE}"
        side_effects:
          - "retirement_reason := STATISTICAL_FAIL"
          - "retired_at := program.current_period_utc"
          - "security_posture := UNSECURED"

      - from: OPERATIONAL
        to: RETIRED
        trigger: "POST /api/items/{itemId}/retire"
        actor: SecurityOfficer
        preconditions:
          - "Item.status == OPERATIONAL (ERR_ITEM_NOT_OPERATIONAL)"
          - "No FormItemSlot references this item on a TestForm with status in {ASSEMBLED, EQUATED, PUBLISHED} (ERR_ITEM_ON_ACTIVE_FORM)"
        side_effects:
          - "retired_at := program.current_period_utc"
          - "retirement_reason := MANUAL unless operational_exposure_count >= exposure_cap, in which case OVER_EXPOSED"
          - "security_posture := UNSECURED"
          - "Cascade: all non-terminal ItemVariants -> REJECTED"

      - from: OPERATIONAL
        to: RETIRED
        trigger: "system (automatic when operational_exposure_count reaches exposure_cap due to FormItemSlot creation)"
        actor: system
        preconditions:
          - "operational_exposure_count >= exposure_cap"
        side_effects:
          - "retirement_reason := OVER_EXPOSED"
          - "retired_at := program.current_period_utc"
          - "security_posture := UNSECURED"
          - "Cascade: all non-terminal ItemVariants -> REJECTED"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /api/items/{itemId}/discard"
        actor: ItemWriter
        preconditions:
          - "Item.status == DRAFT"
          - "Item.author_user_id == X-User-ID"
        side_effects:
          - "retirement_reason := MANUAL"

      # --- Security posture transitions (parallel dimension) ---
      - from: UNSECURED
        to: SECURED
        trigger: "system (automatic on FIELD_TEST_ELIGIBLE entry)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Covered by lifecycle transition"

      - from: SECURED
        to: EXPOSED
        trigger: "system (automatic when first FormItemSlot referencing this item is created on a form that reaches ASSEMBLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXPOSED
        to: COMPROMISED
        trigger: "POST /api/items/{itemId}/mark-compromised"
        actor: SecurityOfficer
        preconditions:
          - "Item.security_posture == EXPOSED (ERR_ITEM_NOT_EXPOSED)"
          - "Item.status == OPERATIONAL"
        side_effects:
          - "Cascade: all FormItemSlots on non-archived TestForms referencing this item are deleted"
          - "Cascade: affected TestForms transition ASSEMBLED|EQUATED -> ASSEMBLING (forced rework)"
          - "Item operational_exposure_count := 0"

      - from: COMPROMISED
        to: UNSECURED
        trigger: "system (automatic when Item transitions OPERATIONAL -> RETIRED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReviewSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /api/review-sessions/{sid}/open"
        actor: ProgramDirector
        preconditions:
          - "Session.status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
          - "program.current_period_utc >= scheduled_at (ERR_SESSION_NOT_YET)"
          - "agenda_item_ids non-empty (ERR_EMPTY_AGENDA)"
        side_effects:
          - "started_at := program.current_period_utc"

      - from: OPEN
        to: CLOSED
        trigger: "POST /api/review-sessions/{sid}/close"
        actor: ProgramDirector
        preconditions:
          - "Session.status == OPEN (ERR_SESSION_NOT_OPEN)"
          - "For every item on agenda: at least one ReviewVerdict exists (ERR_INCOMPLETE_AGENDA)"
          - "For every item on agenda: quorum rule satisfied (ACCEPT >= quorum OR REJECT >= quorum OR REVISE >= quorum) — else ERR_NO_QUORUM_REACHED"
        side_effects:
          - "closed_at := program.current_period_utc"
          - "For each agenda item: tally verdicts, apply quorum rule (see Item lifecycle transitions)"
          - "For each agenda item: fire corresponding Item transition (CONTENT_REVIEW -> BIAS_REVIEW / DRAFT / REJECTED, or BIAS_REVIEW -> FIELD_TEST_ELIGIBLE / DRAFT / REJECTED)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/review-sessions/{sid}/cancel"
        actor: ProgramDirector
        preconditions:
          - "Session.status == SCHEDULED (ERR_SESSION_NOT_CANCELLABLE)"
        side_effects: []

      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/review-sessions/{sid}/cancel"
        actor: ProgramDirector
        preconditions:
          - "Session.status == OPEN"
        side_effects:
          - "All ReviewVerdicts in this session are soft-deleted (excluded from quorum tally on subsequent sessions)"

  - entity: FieldTestWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /api/field-test-windows/{wid}/open"
        actor: ProgramDirector
        preconditions:
          - "Window.status == SCHEDULED (ERR_WINDOW_NOT_SCHEDULED)"
          - "program.current_period_utc >= start_utc AND <= end_utc (ERR_WINDOW_NOT_IN_RANGE)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /api/field-test-windows/{wid}/close"
        actor: ProgramDirector
        preconditions:
          - "Window.status == OPEN (ERR_WINDOW_NOT_OPEN)"
          - "program.current_period_utc >= end_utc (ERR_WINDOW_STILL_RUNNING)"
        side_effects:
          - "For every Item with at least one ItemResponse in this window: item transitions FIELD_TESTING -> STATS_REVIEW"
          - "For every (item, window) pair with responses: compute ItemStatistic row (PROVISIONAL, and FINAL if n_responses >= window.target_sample_size)"

  - entity: TestForm
    initial_state: ASSEMBLING
    terminal_states: [ARCHIVED]
    transitions:
      - from: ASSEMBLING
        to: ASSEMBLED
        trigger: "POST /api/test-forms/{fid}/assemble"
        actor: TestAssembler
        preconditions:
          - "Form.status == ASSEMBLING (ERR_FORM_NOT_ASSEMBLING)"
          - "Blueprint.status == LOCKED (ERR_BLUEPRINT_NOT_LOCKED)"
          - "For each section i: count(FormItemSlots with section_index == i) == blueprint.sections[i].item_count (ERR_BLUEPRINT_MISMATCH)"
          - "Every slot's item.status == OPERATIONAL (ERR_SLOT_ITEM_NOT_OPERATIONAL)"
          - "Every slot's item.security_posture in {SECURED, EXPOSED} (ERR_SLOT_ITEM_INSECURE)"
          - "No two slots on the same form share the same item (ERR_DUPLICATE_ITEM_ON_FORM)"
          - "For each section i: sum(item.depth_of_knowledge of slot items) between sections[i].dok_min and sections[i].dok_max inclusive (ERR_DOK_OUT_OF_RANGE)"
        side_effects:
          - "assembled_at := program.current_period_utc"
          - "For each slot item: operational_exposure_count += 1"
          - "For each slot item with security_posture == SECURED: security_posture := EXPOSED"
          - "For each slot item where operational_exposure_count now >= exposure_cap: Item -> RETIRED (retirement_reason=OVER_EXPOSED), and this transition must ROLL BACK the entire assemble (ERR_WOULD_OVER_EXPOSE)"
          - "Increments TestForm.version by 1"

      - from: ASSEMBLED
        to: EQUATED
        trigger: "system (automatic when an EquatingLink referencing this form as target_form_id is created)"
        actor: system
        preconditions:
          - "Form.status == ASSEMBLED"
        side_effects: []

      - from: EQUATED
        to: PUBLISHED
        trigger: "POST /api/test-forms/{fid}/publish"
        actor: ProgramDirector
        preconditions:
          - "Form.status == EQUATED (ERR_FORM_NOT_EQUATED)"
          - "At least one ValidityDossier with form_id == this form and status == PUBLISHED exists (ERR_NO_PUBLISHED_DOSSIER)"
        side_effects:
          - "published_at := program.current_period_utc"

      - from: ASSEMBLED
        to: ASSEMBLING
        trigger: "system (forced rework when a slot item becomes COMPROMISED)"
        actor: system
        preconditions: []
        side_effects:
          - "All FormItemSlots referencing the compromised item are deleted"
          - "Decrement operational_exposure_count for every item still slotted on this form (compensation)"

      - from: EQUATED
        to: ASSEMBLING
        trigger: "system (forced rework when a slot item becomes COMPROMISED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as ASSEMBLED -> ASSEMBLING"
          - "All EquatingLinks with target_form_id == this form are deleted (cascade)"

      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /api/test-forms/{fid}/archive"
        actor: ProgramDirector
        preconditions:
          - "Form.status == PUBLISHED (ERR_FORM_NOT_PUBLISHED)"
          - "program.current_period_utc > intended_admin_date + 90 days (ERR_ARCHIVE_TOO_EARLY)"
        side_effects:
          - "Form is now queryable only with include_archived=true"

  - entity: TestBlueprint
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /api/test-blueprints/{bid}/lock"
        actor: ProgramDirector
        preconditions:
          - "Blueprint.status == DRAFT (ERR_BLUEPRINT_NOT_DRAFT)"
          - "sections non-empty (ERR_EMPTY_BLUEPRINT)"
          - "For each section: item_count >= 1 (ERR_INVALID_SECTION_SIZE)"
        side_effects: []

      - from: LOCKED
        to: SUPERSEDED
        trigger: "POST /api/test-blueprints/{bid}/supersede"
        actor: ProgramDirector
        preconditions:
          - "Blueprint.status == LOCKED (ERR_BLUEPRINT_NOT_LOCKED)"
          - "All TestForms under this blueprint are in terminal or ARCHIVED status (ERR_FORMS_STILL_ACTIVE)"
        side_effects: []

  - entity: ItemVariant
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/item-variants/{vid}/approve"
        actor: ContentReviewer
        preconditions:
          - "Variant.status == DRAFT (ERR_VARIANT_NOT_DRAFT)"
          - "Source Item.status in {OPERATIONAL, FIELD_TESTING, STATS_REVIEW} (ERR_VARIANT_SOURCE_NOT_READY)"
        side_effects: []

      - from: DRAFT
        to: REJECTED
        trigger: "POST /api/item-variants/{vid}/reject"
        actor: ContentReviewer
        preconditions:
          - "Variant.status == DRAFT"
        side_effects: []

      - from: DRAFT
        to: REJECTED
        trigger: "system (cascade when source Item becomes REJECTED or RETIRED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ValidityDossier
    initial_state: DRAFT
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/validity-dossiers/{vid}/publish"
        actor: Psychometrician
        preconditions:
          - "Dossier.status == DRAFT (ERR_DOSSIER_NOT_DRAFT)"
          - "Dossier.form_id references a TestForm with status in {ASSEMBLED, EQUATED, PUBLISHED} (ERR_DOSSIER_FORM_NOT_FINAL)"
        side_effects:
          - "published_at := program.current_period_utc"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /api/validity-dossiers/{vid}/supersede"
        actor: Psychometrician
        preconditions:
          - "Dossier.status == PUBLISHED (ERR_DOSSIER_NOT_PUBLISHED)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: form-assemble-stale-form
    parent_entity: TestForm
    write_endpoint: "POST /api/test-forms/{fid}/assemble"
    occ_field: "expected_form_version"
    description: |
      Assembling a TestForm whose version has advanced since the client last
      observed it is rejected with 412. This captures the case where another
      writer has just added or removed a FormItemSlot (each of which bumps
      the parent form's version), and the current assemble request is
      therefore acting on stale slot state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: item-submit-stale-item
    parent_entity: Item
    write_endpoint: "POST /api/items/{itemId}/submit"
    occ_field: "expected_item_version"
    description: |
      Submitting an Item whose version has advanced since the client last
      observed it is rejected with 412. A parallel content edit (PUT) or
      security-posture change bumps item.version, and the submitter's view
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: item_p_value_provisional
    trigger: "FieldTestWindow OPEN -> CLOSED, for every (item, window) with at least one response"
    algorithm: aggregation
    formula: |
      Let R = { r in ItemResponse | r.window_id == W.id AND r.item_id == I.id AND r.excluded == false }
      If |R| == 0: skip (no ItemStatistic row written for this pair)
      p_value_provisional = (sum over r in R of r.raw_score) / (|R| * I.max_score_points)
      Round to 4 decimal places, ROUND_HALF_UP.
      Write to ItemStatistic row with stats_kind=PROVISIONAL AND to Item.p_value_provisional.
    input_set: "ItemResponse where window_id=W, item_id=I, excluded=false; NO duration filter, NO timestamp filter"
    constants:
      DECIMALS: 4
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Always computed on window close"
        difference: "Uses ALL non-excluded responses regardless of timestamp or duration"

  - name: item_p_value_final
    trigger: "FieldTestWindow OPEN -> CLOSED, only if count of non-excluded responses >= window.target_sample_size"
    algorithm: aggregation
    formula: |
      Let R_final = { r in ItemResponse | r.window_id == W.id AND r.item_id == I.id
                      AND r.excluded == false
                      AND r.response_timestamp >= W.start_utc AND r.response_timestamp <= W.end_utc  # CLOSED interval
                      AND r.attempt_duration_seconds >= MIN_DURATION_SECONDS }
      p_value_final = (sum over r in R_final of r.raw_score) / (|R_final| * I.max_score_points)
      Round to 4 decimal places, ROUND_HALF_UP.
      Write to ItemStatistic row with stats_kind=FINAL AND to Item.p_value_final.
      Set ItemStatistic.finalized_at = program.current_period_utc.
    input_set: "ItemResponse with the additional FINAL filter (closed [start, end] interval AND attempt_duration_seconds >= 30)"
    constants:
      DECIMALS: 4
      MIN_DURATION_SECONDS: 30
    precision: "4 decimal places, round_half_up"
    variants:
      - name: final
        when: "Only when provisional n_responses >= window.target_sample_size"
        difference: "Adds CLOSED-interval timestamp filter AND minimum-duration filter; can produce a different p_value than provisional for the same response set"

  - name: item_point_biserial
    trigger: "Computed alongside p_value (both provisional and final variants)"
    algorithm: weighted_scoring
    formula: |
      For each non-excluded response r (using same filter as the corresponding p_value variant):
        x_r = r.raw_score / I.max_score_points   # normalized item score
        y_r = (sum of normalized scores of all OTHER items student_anon_id responded to in window W) / (count of those other items)
      point_biserial = Pearson_correlation(x, y) over the response set
      If |R| < 2 OR all x_r are equal OR all y_r are equal: point_biserial = 0.0000
      Round to 4 decimals ROUND_HALF_UP.
    input_set: "Same response set as the corresponding p_value variant; y_r excludes the item under computation"
    constants:
      DECIMALS: 4
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "All non-excluded responses in window"
        difference: "Less selective input set"
      - name: final
        when: "Meets sample size AND passes closed-interval/duration filter"
        difference: "More selective input set"

  - name: item_pass_flag
    trigger: "ItemStatistic FINAL row is written"
    algorithm: threshold
    formula: |
      if point_biserial < PB_SEVERE: pass_flag = FAIL_SEVERE
      elif point_biserial < PB_MIN OR p_value < P_LOW OR p_value > P_HIGH: pass_flag = FAIL_BORDERLINE
      else: pass_flag = PASS
    constants:
      PB_SEVERE: 0.10
      PB_MIN: 0.20
      P_LOW: 0.30
      P_HIGH: 0.85
    precision: "n/a (enum)"
    note: "Boundary semantics: 'less than' is STRICT (<). p_value == 0.30 exactly counts as in-range (passes the P_LOW check); point_biserial == 0.20 exactly counts as passing the PB_MIN check."

  - name: equating_scaling_coefficients
    trigger: "EquatingLink creation"
    algorithm: weighted_scoring
    formula: |
      Let A_src = { i in anchor_item_ids | p_value_final(i) computed under source form's window }
      Let A_tgt = { i in anchor_item_ids | p_value_final(i) computed under target form's window }
      mean_src = mean over A_src of p_value_final
      mean_tgt = mean over A_tgt of p_value_final
      sd_src = population_standard_deviation over A_src of p_value_final
      sd_tgt = population_standard_deviation over A_tgt of p_value_final
      If |A_src| < 2 OR sd_src == 0 OR sd_tgt == 0: reject with ERR_ANCHOR_SET_TOO_HOMOGENEOUS
      scaling_slope = sd_tgt / sd_src     (mean/sigma equating)
      scaling_intercept = mean_tgt - scaling_slope * mean_src
      Round both to 6 decimal places, ROUND_HALF_UP.
    input_set: "anchor_item_ids list; for each item the most recent FINAL ItemStatistic whose window.end_utc <= program.current_period_utc"
    constants:
      DECIMALS: 6
    precision: "6 decimal places, round_half_up"
    variants:
      - name: mean_sigma
        when: "Declared default"
        difference: "Uses population SD ratio"
      - name: mean_mean
        when: "Alternative industry method (NOT what this scaffold pins)"
        difference: "Would use mean_tgt / mean_src; produces different slope when variances differ. This variant exists for the dual_variant_calc test rule but is NOT implemented — only mean_sigma is the contract."

  - name: session_quorum_tally
    trigger: "ReviewSession OPEN -> CLOSED"
    algorithm: threshold
    formula: |
      For each item on agenda:
        counts = { ACCEPT: n_a, REJECT: n_r, REVISE: n_v }  # over non-soft-deleted ReviewVerdicts in this session
        total_verdicts = n_a + n_r + n_v
        if n_a >= committee.quorum_size: outcome = ACCEPT
        elif n_r >= committee.quorum_size AND n_r >= (n_a + n_v): outcome = REJECT
        elif n_v >= committee.quorum_size: outcome = REVISE
        elif n_r >= committee.quorum_size AND n_r < (n_a + n_v): outcome = REVISE  # contested REJECT de-escalates
        else: outcome = NO_QUORUM  # session close REJECTED with ERR_NO_QUORUM_REACHED
      Note evaluation ORDER: ACCEPT is checked first, then REJECT-or-REVISE branch.
    input_set: "ReviewVerdict rows for session, excluded soft-deleted"
    constants: {}
    precision: "n/a"

  - name: blueprint_section_dok_range
    trigger: "TestForm ASSEMBLING -> ASSEMBLED"
    algorithm: aggregation
    formula: |
      For each section i:
        dok_sum_i = sum over slots in section of item.depth_of_knowledge (looked up via item.primary_standard_id -> ContentStandard.depth_of_knowledge)
        Require blueprint.sections[i].dok_min <= dok_sum_i <= blueprint.sections[i].dok_max (INCLUSIVE on both ends).
      dok_min == dok_sum_i passes; dok_max == dok_sum_i passes; one outside fails.
    input_set: "FormItemSlots of this form, joined via Item.primary_standard_id to ContentStandard"
    constants: {}
    precision: "n/a"

  - name: operational_exposure_count
    trigger: "FormItemSlot create, TestForm forced rework (ASSEMBLED|EQUATED -> ASSEMBLING), Item marked COMPROMISED"
    algorithm: aggregation
    formula: |
      operational_exposure_count(I) = count of FormItemSlot s where s.item_id == I.id
                                      AND s.form.status IN {ASSEMBLED, EQUATED, PUBLISHED}
      Recomputed incrementally on each triggering event; never decremented below 0.
    input_set: "FormItemSlot joined to TestForm (status filter)"
    constants: {}
    precision: "integer"
    note: "INVARIANT: every FormItemSlot creation that succeeds on a form that later reaches ASSEMBLED adds 1; every forced-rework cascade subtracts the count of deleted slots. Forward + compensating action leave the metric consistent."

  - name: form_publish_eligibility_dossier
    trigger: "TestForm EQUATED -> PUBLISHED precondition"
    algorithm: aggregation
    formula: |
      exists d in ValidityDossier where d.form_id == F.id AND d.status == PUBLISHED
      If multiple dossiers exist with status SUPERSEDED, they do NOT count.
      A DRAFT dossier does NOT count.
    input_set: "ValidityDossier filtered by form_id and status"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and parseable"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role in X-User-Role must be one of the endpoint's declared roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path parameters (program, committee, session, item, etc.) must resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3.5
    category: state
    check: "Optimistic-concurrency: when expected_<parent>_version is supplied on a concurrency_rules write_endpoint, it MUST equal parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "form assemble, item submit"

  - priority: 4
    category: state
    check: "Target resource must be in the expected status for this action (entity-specific preconditions per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: business_safety
    check: "AccessGrant: grantee must hold an un-revoked ITEM_WRITE grant covering program.current_period_utc to mutate an Item; ITEM_READ for GET on a SECURED item; STATS_READ for ItemStatistic GET; FORM_ASSEMBLE for slot create; GRANT_ADMIN to issue new grants"
    error_id: ERR_NO_ACTIVE_GRANT
    http_status: 403
    applies_to: "item mutations, item GET (when item SECURED), statistic GET, slot create, grant create"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: same X-User-ID may not submit a ReviewVerdict for the same item in BOTH a CONTENT-kind and BIAS_SENSITIVITY-kind session within the same revision cycle"
    error_id: ERR_SOD_REVIEWER_CONFLICT
    http_status: 403
    applies_to: "POST /api/review-sessions/{sid}/verdicts"

  - priority: 7
    category: business_safety
    check: "Bias/sensitivity gate: Item cannot transition BIAS_REVIEW -> FIELD_TEST_ELIGIBLE unless bias_review_outcome == PASSED AND security_posture transition has fired"
    error_id: ERR_BIAS_GATE_NOT_PASSED
    http_status: 403
    applies_to: "field-test-window open on items still in BIAS_REVIEW (via ingest check)"

  - priority: 8
    category: business_constraint
    check: "Uniqueness: item_code unique within program; form_code unique within blueprint; blueprint_code unique within program; standard_code unique within program"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 9
    category: business_temporal
    check: "FieldTestWindow time bounds: start_utc < end_utc; window OPEN requires start_utc <= current_period_utc <= end_utc; close requires current_period_utc >= end_utc"
    error_id: ERR_WINDOW_TIME_INVALID
    http_status: 422
    applies_to: "window create, window open, window close"

  - priority: 10
    category: business_temporal
    check: "ReviewSession scheduled_at must be <= current_period_utc on OPEN; agenda_item_ids non-empty; max 25 items per agenda"
    error_id: ERR_SESSION_NOT_READY
    http_status: 422
    applies_to: "session create, session open"

  - priority: 11
    category: business_referential
    check: "ItemResponse item_id must reference an Item with status == FIELD_TEST_ELIGIBLE or FIELD_TESTING, AND item must not already have a FINAL ItemStatistic in a DIFFERENT (earlier-closed) window for the same program cycle"
    error_id: ERR_ITEM_NOT_FIELD_TESTABLE
    http_status: 409
    applies_to: "POST /api/field-test-windows/{wid}/responses"

  - priority: 12
    category: business_referential
    check: "FormItemSlot item_id must reference OPERATIONAL item with security_posture in {SECURED, EXPOSED}; same item cannot appear twice on same form"
    error_id: ERR_SLOT_ITEM_INVALID
    http_status: 409
    applies_to: "POST /api/test-forms/{fid}/slots"

  - priority: 13
    category: business_constraint
    check: "Anchor-set validity for EquatingLink: every anchor_item_id MUST be a FormItemSlot on BOTH source and target form with is_anchor=true; anchor count in [3..10]"
    error_id: ERR_ANCHOR_SET_INVALID
    http_status: 422
    applies_to: "POST /api/equating-links"

  - priority: 14
    category: business_fiscal
    check: "Item operational_exposure_count + 1 <= exposure_cap when adding a slot to a form about to assemble; would-exceed rejects the whole assemble"
    error_id: ERR_WOULD_OVER_EXPOSE
    http_status: 422
    applies_to: "form assemble"

  - priority: 15
    category: business_constraint
    check: "Variant rules: TRANSLATION requires language_code (2-letter ISO) and accommodation_code == null; ACCOMMODATION requires accommodation_code and language_code == null"
    error_id: ERR_VARIANT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /api/items/{itemId}/variants"

  - priority: 16
    category: business_constraint
    check: "ReviewVerdict rationale required (>= 20 chars) when verdict in {REJECT, REVISE}; optional for ACCEPT"
    error_id: ERR_RATIONALE_REQUIRED
    http_status: 400
    applies_to: "POST /api/review-sessions/{sid}/verdicts"

  - priority: 17
    category: business_temporal
    check: "AccessGrant valid_from < valid_until; new grant's [valid_from, valid_until] must not fully overlap an existing active grant for same (grantee, scope)"
    error_id: ERR_GRANT_OVERLAP
    http_status: 409
    applies_to: "POST /api/access-grants"

  - priority: 18
    category: business_constraint
    check: "ValidityDossier content_md >= 200 chars; dossier_kind valid enum; form_id references existing form"
    error_id: ERR_DOSSIER_INVALID
    http_status: 422
    applies_to: "POST /api/validity-dossiers"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Assessment Programs ---
  - method: POST
    path: "/api/assessment-programs"
    description: "Create an AssessmentProgram. Initializes current_period_utc to 2026-08-01T00:00:00Z (the fixed logical clock default)."
    roles: [ProgramDirector]
    code: 201
    input: [program_code, subject, grade_level, admin_year]
    output: AssessmentProgram
    side_effects: ["current_period_utc := 2026-08-01T00:00:00Z", "status := ACTIVE"]

  - method: GET
    path: "/api/assessment-programs"
    description: "List AssessmentPrograms (paginated)"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "AssessmentProgram[]"
    side_effects: []

  - method: GET
    path: "/api/assessment-programs/{pid}"
    description: "Get one AssessmentProgram"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: []
    output: AssessmentProgram
    side_effects: []

  - method: POST
    path: "/api/assessment-programs/{pid}/clock/advance"
    description: "Advance the program logical clock by N seconds"
    roles: [ProgramDirector]
    code: 200
    input: [by_seconds]
    output: AssessmentProgram
    side_effects: ["current_period_utc += by_seconds seconds"]

  # --- Content Standards ---
  - method: POST
    path: "/api/content-standards"
    description: "Create a ContentStandard under a program"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, standard_code, strand, description, depth_of_knowledge]
    output: ContentStandard
    side_effects: []

  - method: GET
    path: "/api/content-standards"
    description: "List ContentStandards; optional program_id filter"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: ["limit?", "offset?", "program_id?", "strand?"]
    output: "ContentStandard[]"
    side_effects: []

  - method: GET
    path: "/api/content-standards/{csid}"
    description: "Get one ContentStandard"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: []
    output: ContentStandard
    side_effects: []

  # --- Items ---
  - method: POST
    path: "/api/items"
    description: "Create an Item (status=DRAFT, security_posture=UNSECURED)"
    roles: [ItemWriter]
    code: 201
    input: [program_id, item_code, primary_standard_id, "secondary_standard_ids?", item_type, stimulus_html, options_json, max_score_points, "exposure_cap?"]
    output: Item
    side_effects: ["author_user_id := X-User-ID", "status := DRAFT", "security_posture := UNSECURED"]

  - method: GET
    path: "/api/items"
    description: "List Items; if item is SECURED and caller lacks ITEM_READ grant, item is excluded"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: ["limit?", "offset?", "program_id?", "primary_standard_id?", "status?", "security_posture?", "include_archived?"]
    output: "Item[]"
    side_effects: []

  - method: GET
    path: "/api/items/{itemId}"
    description: "Get one Item; SECURED items require ITEM_READ grant"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: PUT
    path: "/api/items/{itemId}"
    description: "Update Item content; only allowed in DRAFT. Increments item.version."
    roles: [ItemWriter]
    code: 200
    input: ["stimulus_html?", "options_json?", "max_score_points?", "primary_standard_id?", "secondary_standard_ids?"]
    output: Item
    side_effects: ["version += 1", "updated_at := now"]

  - method: POST
    path: "/api/items/{itemId}/submit"
    description: "Submit Item for review (DRAFT -> SUBMITTED -> CONTENT_REVIEW). OCC on item.version."
    roles: [ItemWriter]
    code: 200
    input: [expected_item_version]
    output: Item
    side_effects: ["status := CONTENT_REVIEW", "version += 1"]

  - method: POST
    path: "/api/items/{itemId}/discard"
    description: "Discard a DRAFT Item (DRAFT -> REJECTED)"
    roles: [ItemWriter]
    code: 200
    input: []
    output: Item
    side_effects: ["status := REJECTED", "retirement_reason := MANUAL"]

  - method: POST
    path: "/api/items/{itemId}/approve-operational"
    description: "Psychometrician approves STATS_REVIEW -> OPERATIONAL after FINAL stats pass"
    roles: [Psychometrician]
    code: 200
    input: []
    output: Item
    side_effects: ["status := OPERATIONAL"]

  - method: POST
    path: "/api/items/{itemId}/retire"
    description: "Retire an Item (STATS_REVIEW -> RETIRED by Psychometrician on stats-fail; OPERATIONAL -> RETIRED by SecurityOfficer for manual)"
    roles: [Psychometrician, SecurityOfficer]
    code: 200
    input: []
    output: Item
    side_effects: ["status := RETIRED", "retired_at := current_period_utc", "security_posture := UNSECURED"]

  - method: POST
    path: "/api/items/{itemId}/mark-compromised"
    description: "Mark an EXPOSED OPERATIONAL item as COMPROMISED; cascades to delete slots and force rework"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: Item
    side_effects:
      - "security_posture := COMPROMISED"
      - "All FormItemSlots referencing this item on non-archived forms are deleted"
      - "Affected TestForms revert ASSEMBLED|EQUATED -> ASSEMBLING"
      - "Item.operational_exposure_count := 0"

  # --- Item Variants ---
  - method: POST
    path: "/api/item-variants"
    description: "Create an ItemVariant (TRANSLATION or ACCOMMODATION)"
    roles: [TranslationSpecialist, ItemWriter]
    code: 201
    input: [item_id, variant_kind, "language_code?", "accommodation_code?", stimulus_html, options_json]
    output: ItemVariant
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/api/item-variants"
    description: "List ItemVariants; optional item_id filter"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: ["limit?", "offset?", "item_id?"]
    output: "ItemVariant[]"
    side_effects: []

  - method: GET
    path: "/api/item-variants/{vid}"
    description: "Get one ItemVariant"
    roles: [ProgramDirector, ItemWriter, ContentReviewer, BiasSensitivityReviewer, Psychometrician, TestAssembler, SecurityOfficer, TranslationSpecialist]
    code: 200
    input: []
    output: ItemVariant
    side_effects: []

  - method: POST
    path: "/api/item-variants/{vid}/approve"
    description: "Approve a DRAFT ItemVariant"
    roles: [ContentReviewer]
    code: 200
    input: []
    output: ItemVariant
    side_effects: ["status := APPROVED"]

  - method: POST
    path: "/api/item-variants/{vid}/reject"
    description: "Reject a DRAFT ItemVariant"
    roles: [ContentReviewer]
    code: 200
    input: []
    output: ItemVariant
    side_effects: ["status := REJECTED"]

  # --- Review Committees ---
  - method: POST
    path: "/api/review-committees"
    description: "Create a ReviewCommittee (CONTENT or BIAS_SENSITIVITY)"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, committee_kind, name, quorum_size]
    output: ReviewCommittee
    side_effects: []

  - method: GET
    path: "/api/review-committees"
    description: "List committees; optional program_id filter"
    roles: [ProgramDirector, ContentReviewer, BiasSensitivityReviewer]
    code: 200
    input: ["limit?", "offset?", "program_id?"]
    output: "ReviewCommittee[]"
    side_effects: []

  - method: GET
    path: "/api/review-committees/{cid}"
    description: "Get one committee"
    roles: [ProgramDirector, ContentReviewer, BiasSensitivityReviewer]
    code: 200
    input: []
    output: ReviewCommittee
    side_effects: []

  # --- Review Sessions ---
  - method: POST
    path: "/api/review-sessions"
    description: "Create a ReviewSession under a committee"
    roles: [ProgramDirector]
    code: 201
    input: [committee_id, scheduled_at, agenda_item_ids]
    output: ReviewSession
    side_effects: ["status := SCHEDULED", "program_id denormalized from committee"]

  - method: GET
    path: "/api/review-sessions"
    description: "List sessions; optional committee_id and program_id filters"
    roles: [ProgramDirector, ContentReviewer, BiasSensitivityReviewer]
    code: 200
    input: ["limit?", "offset?", "committee_id?", "program_id?"]
    output: "ReviewSession[]"
    side_effects: []

  - method: GET
    path: "/api/review-sessions/{sid}"
    description: "Get one session"
    roles: [ProgramDirector, ContentReviewer, BiasSensitivityReviewer]
    code: 200
    input: []
    output: ReviewSession
    side_effects: []

  - method: POST
    path: "/api/review-sessions/{sid}/open"
    description: "Open a SCHEDULED session"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ReviewSession
    side_effects: ["status := OPEN", "started_at := current_period_utc"]

  - method: POST
    path: "/api/review-sessions/{sid}/close"
    description: "Close an OPEN session; tallies verdicts and fires Item transitions"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ReviewSession
    side_effects: ["status := CLOSED", "closed_at := current_period_utc", "fires Item transitions per quorum tally"]

  - method: POST
    path: "/api/review-sessions/{sid}/cancel"
    description: "Cancel a session; soft-deletes its ReviewVerdicts"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ReviewSession
    side_effects: ["status := CANCELLED", "verdicts soft-deleted"]

  # --- Review Verdicts ---
  - method: POST
    path: "/api/review-sessions/{sid}/verdicts"
    description: "Submit a ReviewVerdict on an agenda item of session {sid}"
    roles: [ContentReviewer, BiasSensitivityReviewer]
    code: 201
    input: [item_id, verdict, "rationale?"]
    output: ReviewVerdict
    side_effects: ["reviewer_user_id := X-User-ID", "submitted_at := current_period_utc"]

  - method: GET
    path: "/api/review-verdicts"
    description: "List ReviewVerdicts; optional session_id, item_id filters"
    roles: [ProgramDirector, ContentReviewer, BiasSensitivityReviewer]
    code: 200
    input: ["limit?", "offset?", "session_id?", "item_id?"]
    output: "ReviewVerdict[]"
    side_effects: []

  - method: GET
    path: "/api/review-verdicts/{vid}"
    description: "Get one ReviewVerdict"
    roles: [ProgramDirector, ContentReviewer, BiasSensitivityReviewer]
    code: 200
    input: []
    output: ReviewVerdict
    side_effects: []

  # --- Field Test Windows ---
  - method: POST
    path: "/api/field-test-windows"
    description: "Create a FieldTestWindow"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, window_label, start_utc, end_utc, target_sample_size]
    output: FieldTestWindow
    side_effects: ["status := SCHEDULED"]

  - method: GET
    path: "/api/field-test-windows"
    description: "List windows; optional program_id filter"
    roles: [ProgramDirector, Psychometrician, TestAssembler]
    code: 200
    input: ["limit?", "offset?", "program_id?"]
    output: "FieldTestWindow[]"
    side_effects: []

  - method: GET
    path: "/api/field-test-windows/{wid}"
    description: "Get one window"
    roles: [ProgramDirector, Psychometrician, TestAssembler]
    code: 200
    input: []
    output: FieldTestWindow
    side_effects: []

  - method: POST
    path: "/api/field-test-windows/{wid}/open"
    description: "Open a SCHEDULED window"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: FieldTestWindow
    side_effects: ["status := OPEN"]

  - method: POST
    path: "/api/field-test-windows/{wid}/close"
    description: "Close an OPEN window; computes ItemStatistic rows and drives Items FIELD_TESTING -> STATS_REVIEW"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: FieldTestWindow
    side_effects: ["status := CLOSED", "ItemStatistic rows created", "Items transition to STATS_REVIEW"]

  # --- Item Responses ---
  - method: POST
    path: "/api/field-test-windows/{wid}/responses"
    description: "Ingest an ItemResponse into an OPEN window"
    roles: [Psychometrician]
    code: 201
    input: [item_id, student_anon_id, response_timestamp, attempt_duration_seconds, raw_score]
    output: ItemResponse
    side_effects: ["If first response for this item: item FIELD_TEST_ELIGIBLE -> FIELD_TESTING, field_test_attempt_count += 1"]

  - method: GET
    path: "/api/item-responses"
    description: "List ItemResponses; optional window_id, item_id, excluded filters"
    roles: [ProgramDirector, Psychometrician]
    code: 200
    input: ["limit?", "offset?", "window_id?", "item_id?", "excluded?"]
    output: "ItemResponse[]"
    side_effects: []

  - method: GET
    path: "/api/item-responses/{rid}"
    description: "Get one response"
    roles: [ProgramDirector, Psychometrician]
    code: 200
    input: []
    output: ItemResponse
    side_effects: []

  - method: POST
    path: "/api/item-responses/{rid}/exclude"
    description: "Mark a response excluded (removes from stats)"
    roles: [Psychometrician]
    code: 200
    input: []
    output: ItemResponse
    side_effects: ["excluded := true"]

  # --- Item Statistics ---
  - method: GET
    path: "/api/item-statistics"
    description: "List ItemStatistic rows; optional item_id, window_id, stats_kind filters"
    roles: [ProgramDirector, Psychometrician]
    code: 200
    input: ["limit?", "offset?", "item_id?", "window_id?", "stats_kind?"]
    output: "ItemStatistic[]"
    side_effects: []

  - method: GET
    path: "/api/item-statistics/{sid}"
    description: "Get one ItemStatistic"
    roles: [ProgramDirector, Psychometrician]
    code: 200
    input: []
    output: ItemStatistic
    side_effects: []

  # --- Test Blueprints ---
  - method: POST
    path: "/api/test-blueprints"
    description: "Create a TestBlueprint (status=DRAFT)"
    roles: [TestAssembler]
    code: 201
    input: [program_id, blueprint_code, sections]
    output: TestBlueprint
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/api/test-blueprints"
    description: "List blueprints; optional program_id filter"
    roles: [ProgramDirector, TestAssembler, Psychometrician]
    code: 200
    input: ["limit?", "offset?", "program_id?"]
    output: "TestBlueprint[]"
    side_effects: []

  - method: GET
    path: "/api/test-blueprints/{bid}"
    description: "Get one blueprint"
    roles: [ProgramDirector, TestAssembler, Psychometrician]
    code: 200
    input: []
    output: TestBlueprint
    side_effects: []

  - method: POST
    path: "/api/test-blueprints/{bid}/lock"
    description: "Lock a DRAFT blueprint (DRAFT -> LOCKED)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: TestBlueprint
    side_effects: ["status := LOCKED"]

  - method: POST
    path: "/api/test-blueprints/{bid}/supersede"
    description: "Supersede a LOCKED blueprint once all its forms are archived"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: TestBlueprint
    side_effects: ["status := SUPERSEDED"]

  # --- Test Forms ---
  - method: POST
    path: "/api/test-forms"
    description: "Create a TestForm under a LOCKED blueprint"
    roles: [TestAssembler]
    code: 201
    input: [blueprint_id, form_code, intended_admin_date]
    output: TestForm
    side_effects: ["status := ASSEMBLING", "program_id denormalized from blueprint"]

  - method: GET
    path: "/api/test-forms"
    description: "List forms; optional blueprint_id, program_id, status filters"
    roles: [ProgramDirector, TestAssembler, Psychometrician]
    code: 200
    input: ["limit?", "offset?", "blueprint_id?", "program_id?", "status?", "include_archived?"]
    output: "TestForm[]"
    side_effects: []

  - method: GET
    path: "/api/test-forms/{fid}"
    description: "Get one form"
    roles: [ProgramDirector, TestAssembler, Psychometrician]
    code: 200
    input: []
    output: TestForm
    side_effects: []

  - method: POST
    path: "/api/test-forms/{fid}/assemble"
    description: "Validate blueprint satisfaction and transition ASSEMBLING -> ASSEMBLED. OCC on form.version."
    roles: [TestAssembler]
    code: 200
    input: [expected_form_version]
    output: TestForm
    side_effects:
      - "status := ASSEMBLED"
      - "assembled_at := current_period_utc"
      - "For each slot item: operational_exposure_count += 1"
      - "For each slot item with security_posture == SECURED: security_posture := EXPOSED"
      - "If any slot item would exceed exposure_cap: roll back entire assemble (ERR_WOULD_OVER_EXPOSE)"
      - "version += 1"

  - method: POST
    path: "/api/test-forms/{fid}/publish"
    description: "Publish an EQUATED form (requires at least one PUBLISHED ValidityDossier)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: TestForm
    side_effects: ["status := PUBLISHED", "published_at := current_period_utc"]

  - method: POST
    path: "/api/test-forms/{fid}/archive"
    description: "Archive a PUBLISHED form (must be >90 days past intended_admin_date)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: TestForm
    side_effects: ["status := ARCHIVED"]

  # --- Form Item Slots ---
  - method: POST
    path: "/api/test-forms/{fid}/slots"
    description: "Add a FormItemSlot to an ASSEMBLING form. Increments form.version."
    roles: [TestAssembler]
    code: 201
    input: [item_id, section_index, position_in_section, "is_anchor?"]
    output: FormItemSlot
    side_effects: ["points_possible := item.max_score_points", "form.version += 1"]

  - method: GET
    path: "/api/form-item-slots"
    description: "List FormItemSlots; optional form_id, item_id filters"
    roles: [ProgramDirector, TestAssembler, Psychometrician]
    code: 200
    input: ["limit?", "offset?", "form_id?", "item_id?", "section_index?"]
    output: "FormItemSlot[]"
    side_effects: []

  - method: GET
    path: "/api/form-item-slots/{sid}"
    description: "Get one FormItemSlot"
    roles: [ProgramDirector, TestAssembler, Psychometrician]
    code: 200
    input: []
    output: FormItemSlot
    side_effects: []

  - method: DELETE
    path: "/api/form-item-slots/{sid}"
    description: "Remove a slot from an ASSEMBLING form. Increments form.version."
    roles: [TestAssembler]
    code: 204
    input: []
    output: null
    side_effects: ["form.version += 1"]

  # --- Equating Links ---
  - method: POST
    path: "/api/equating-links"
    description: "Create an EquatingLink between two ASSEMBLED forms; computes scaling coefficients"
    roles: [Psychometrician]
    code: 201
    input: [program_id, source_form_id, target_form_id, anchor_item_ids]
    output: EquatingLink
    side_effects:
      - "scaling_slope, scaling_intercept computed via mean/sigma over anchor p_value_final"
      - "target_form transitions ASSEMBLED -> EQUATED"

  - method: GET
    path: "/api/equating-links"
    description: "List equating links; optional program_id, source_form_id, target_form_id filters"
    roles: [ProgramDirector, Psychometrician]
    code: 200
    input: ["limit?", "offset?", "program_id?", "source_form_id?", "target_form_id?"]
    output: "EquatingLink[]"
    side_effects: []

  - method: GET
    path: "/api/equating-links/{eid}"
    description: "Get one equating link"
    roles: [ProgramDirector, Psychometrician]
    code: 200
    input: []
    output: EquatingLink
    side_effects: []

  # --- Access Grants ---
  - method: POST
    path: "/api/access-grants"
    description: "Issue an AccessGrant. Caller must hold an active GRANT_ADMIN grant."
    roles: [SecurityOfficer]
    code: 201
    input: [program_id, grantee_user_id, grant_scope, valid_from, valid_until]
    output: AccessGrant
    side_effects: []

  - method: GET
    path: "/api/access-grants"
    description: "List grants; optional program_id, grantee_user_id, grant_scope filters"
    roles: [ProgramDirector, SecurityOfficer]
    code: 200
    input: ["limit?", "offset?", "program_id?", "grantee_user_id?", "grant_scope?"]
    output: "AccessGrant[]"
    side_effects: []

  - method: GET
    path: "/api/access-grants/{gid}"
    description: "Get one AccessGrant"
    roles: [ProgramDirector, SecurityOfficer]
    code: 200
    input: []
    output: AccessGrant
    side_effects: []

  - method: POST
    path: "/api/access-grants/{gid}/revoke"
    description: "Revoke an active AccessGrant"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["revoked_at := current_period_utc"]

  # --- Validity Dossiers ---
  - method: POST
    path: "/api/validity-dossiers"
    description: "Create a ValidityDossier for a form"
    roles: [Psychometrician]
    code: 201
    input: [program_id, form_id, dossier_kind, content_md]
    output: ValidityDossier
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/api/validity-dossiers"
    description: "List dossiers; optional program_id, form_id, status filters"
    roles: [ProgramDirector, Psychometrician, TestAssembler]
    code: 200
    input: ["limit?", "offset?", "program_id?", "form_id?", "status?"]
    output: "ValidityDossier[]"
    side_effects: []

  - method: GET
    path: "/api/validity-dossiers/{vid}"
    description: "Get one dossier"
    roles: [ProgramDirector, Psychometrician, TestAssembler]
    code: 200
    input: []
    output: ValidityDossier
    side_effects: []

  - method: POST
    path: "/api/validity-dossiers/{vid}/publish"
    description: "Publish a DRAFT dossier"
    roles: [Psychometrician]
    code: 200
    input: []
    output: ValidityDossier
    side_effects: ["status := PUBLISHED", "published_at := current_period_utc"]

  - method: POST
    path: "/api/validity-dossiers/{vid}/supersede"
    description: "Supersede a PUBLISHED dossier"
    roles: [Psychometrician]
    code: 200
    input: []
    output: ValidityDossier
    side_effects: ["status := SUPERSEDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }

  # --- Not Found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path resource does not exist" }

  # --- Validation / Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type mismatch, or enum value invalid" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "item_code / form_code / blueprint_code / standard_code collision within scope" }
  - { id: ERR_RATIONALE_REQUIRED, http: 400, condition: "Verdict is REJECT or REVISE but rationale is missing or < 20 chars" }
  - { id: ERR_VARIANT_KIND_MISMATCH, http: 422, condition: "TRANSLATION without language_code, or ACCOMMODATION without accommodation_code, or both fields set" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (used when more specific error not available)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_ITEM_NOT_IN_DRAFT, http: 409, condition: "Item must be in DRAFT for this action" }
  - { id: ERR_NOT_ITEM_AUTHOR, http: 403, condition: "Only the Item's author_user_id may submit/discard/update it" }
  - { id: ERR_ITEM_NOT_IN_STATS_REVIEW, http: 409, condition: "Item must be in STATS_REVIEW" }
  - { id: ERR_ITEM_NOT_OPERATIONAL, http: 409, condition: "Item must be OPERATIONAL" }
  - { id: ERR_ITEM_NOT_EXPOSED, http: 409, condition: "Item security_posture must be EXPOSED to mark compromised" }
  - { id: ERR_ITEM_NOT_FIELD_TESTABLE, http: 409, condition: "Item not in FIELD_TEST_ELIGIBLE/FIELD_TESTING, or has FINAL stats in an earlier window" }
  - { id: ERR_ITEM_ON_ACTIVE_FORM, http: 409, condition: "Item is referenced by a FormItemSlot on a non-archived form" }
  - { id: ERR_SLOT_ITEM_INVALID, http: 409, condition: "Slot item is not OPERATIONAL or has wrong security_posture" }
  - { id: ERR_SLOT_ITEM_NOT_OPERATIONAL, http: 409, condition: "Slot item no longer OPERATIONAL at assemble time" }
  - { id: ERR_SLOT_ITEM_INSECURE, http: 409, condition: "Slot item security_posture not in {SECURED, EXPOSED}" }
  - { id: ERR_DUPLICATE_ITEM_ON_FORM, http: 409, condition: "Same item_id already present on this form" }

  # --- Session / Committee ---
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "Session must be SCHEDULED to open" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Session must be OPEN to close" }
  - { id: ERR_SESSION_NOT_CANCELLABLE, http: 409, condition: "Session already terminal" }
  - { id: ERR_SESSION_NOT_READY, http: 422, condition: "scheduled_at in future, or empty agenda, or agenda > 25 items" }
  - { id: ERR_EMPTY_AGENDA, http: 422, condition: "agenda_item_ids must be non-empty to open session" }
  - { id: ERR_INCOMPLETE_AGENDA, http: 409, condition: "Every agenda item must have at least one verdict before close" }
  - { id: ERR_NO_QUORUM_REACHED, http: 409, condition: "Session close aborted: at least one agenda item lacks quorum" }
  - { id: ERR_SOD_REVIEWER_CONFLICT, http: 403, condition: "Same reviewer cannot submit verdicts on same item in both CONTENT and BIAS_SENSITIVITY sessions in one revision cycle" }

  # --- Windows ---
  - { id: ERR_WINDOW_NOT_SCHEDULED, http: 409, condition: "Window must be SCHEDULED to open" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Window must be OPEN to close" }
  - { id: ERR_WINDOW_TIME_INVALID, http: 422, condition: "start_utc >= end_utc, or current_period_utc outside window on open/close" }
  - { id: ERR_WINDOW_STILL_RUNNING, http: 409, condition: "Cannot close: current_period_utc < end_utc" }

  # --- Standards / Blueprints / Forms ---
  - { id: ERR_STANDARD_NOT_ACTIVE, http: 409, condition: "primary_standard_id references DEPRECATED standard or different program" }
  - { id: ERR_BLUEPRINT_NOT_DRAFT, http: 409, condition: "Blueprint must be DRAFT" }
  - { id: ERR_BLUEPRINT_NOT_LOCKED, http: 409, condition: "Blueprint must be LOCKED" }
  - { id: ERR_EMPTY_BLUEPRINT, http: 422, condition: "Blueprint must have >= 1 section to lock" }
  - { id: ERR_INVALID_SECTION_SIZE, http: 422, condition: "Each section item_count must be >= 1" }
  - { id: ERR_FORMS_STILL_ACTIVE, http: 409, condition: "Cannot supersede: forms under blueprint still in non-terminal state" }
  - { id: ERR_FORM_NOT_ASSEMBLING, http: 409, condition: "Form must be ASSEMBLING" }
  - { id: ERR_FORM_NOT_EQUATED, http: 409, condition: "Form must be EQUATED to publish" }
  - { id: ERR_FORM_NOT_PUBLISHED, http: 409, condition: "Form must be PUBLISHED to archive" }
  - { id: ERR_BLUEPRINT_MISMATCH, http: 422, condition: "Slot counts per section do not equal blueprint.sections[i].item_count" }
  - { id: ERR_DOK_OUT_OF_RANGE, http: 422, condition: "Section DOK sum outside [dok_min, dok_max]" }
  - { id: ERR_WOULD_OVER_EXPOSE, http: 422, condition: "Assemble would push at least one slot item's operational_exposure_count past its exposure_cap" }
  - { id: ERR_ARCHIVE_TOO_EARLY, http: 409, condition: "Cannot archive: current_period_utc <= intended_admin_date + 90 days" }

  # --- Equating ---
  - { id: ERR_ANCHOR_SET_INVALID, http: 422, condition: "anchor_item_ids must all be is_anchor=true slots on BOTH forms; size in [3..10]" }
  - { id: ERR_ANCHOR_SET_TOO_HOMOGENEOUS, http: 422, condition: "Anchor set p_value_final has zero variance or size < 2" }
  - { id: ERR_NO_FINAL_STATS, http: 409, condition: "Item lacks a FINAL ItemStatistic row" }
  - { id: ERR_ITEM_STATS_NOT_PASSING, http: 409, condition: "Item's most recent FINAL ItemStatistic.pass_flag != PASS" }

  # --- Access / Security ---
  - { id: ERR_NO_ACTIVE_GRANT, http: 403, condition: "Caller lacks an un-revoked AccessGrant covering current_period_utc for the required scope" }
  - { id: ERR_GRANT_OVERLAP, http: 409, condition: "New grant's [valid_from, valid_until] fully overlaps existing active grant for same (grantee, scope)" }

  # --- Dossier ---
  - { id: ERR_DOSSIER_INVALID, http: 422, condition: "content_md < 200 chars or form_id invalid" }
  - { id: ERR_DOSSIER_NOT_DRAFT, http: 409, condition: "Dossier must be DRAFT to publish" }
  - { id: ERR_DOSSIER_NOT_PUBLISHED, http: 409, condition: "Dossier must be PUBLISHED to supersede" }
  - { id: ERR_DOSSIER_FORM_NOT_FINAL, http: 409, condition: "Dossier's form must be ASSEMBLED, EQUATED, or PUBLISHED" }
  - { id: ERR_NO_PUBLISHED_DOSSIER, http: 409, condition: "No PUBLISHED ValidityDossier exists for this form" }

  # --- Variant ---
  - { id: ERR_VARIANT_NOT_DRAFT, http: 409, condition: "Variant must be DRAFT" }
  - { id: ERR_VARIANT_SOURCE_NOT_READY, http: 409, condition: "Variant source Item not in {OPERATIONAL, FIELD_TESTING, STATS_REVIEW}" }
  - { id: ERR_BIAS_GATE_NOT_PASSED, http: 403, condition: "Item cannot proceed past BIAS_REVIEW without bias_review_outcome == PASSED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Program administrator; manages clock, committees, sessions, windows, blueprints, form lifecycle, dossier publication gating"
    identity: opaque
    exclusive_operations:
      - "POST /api/assessment-programs — create program"
      - "POST /api/assessment-programs/{pid}/clock/advance — advance program clock"
      - "POST /api/content-standards — create standard"
      - "POST /api/review-committees — create committee"
      - "POST /api/review-sessions — create session"
      - "POST /api/review-sessions/{sid}/open — open session"
      - "POST /api/review-sessions/{sid}/close — close session (fires item transitions)"
      - "POST /api/review-sessions/{sid}/cancel — cancel session"
      - "POST /api/field-test-windows — create window"
      - "POST /api/field-test-windows/{wid}/open — open window"
      - "POST /api/field-test-windows/{wid}/close — close window (computes stats)"
      - "POST /api/test-blueprints/{bid}/lock — lock blueprint"
      - "POST /api/test-blueprints/{bid}/supersede — supersede blueprint"
      - "POST /api/test-forms/{fid}/publish — publish form"
      - "POST /api/test-forms/{fid}/archive — archive form"
    shared_operations:
      - "GET endpoints (with all roles)"

  - name: ItemWriter
    description: "Item author; creates and edits Items and ItemVariants"
    identity: opaque
    exclusive_operations:
      - "POST /api/items — create item"
      - "PUT /api/items/{itemId} — update item in DRAFT"
      - "POST /api/items/{itemId}/submit — submit item"
      - "POST /api/items/{itemId}/discard — discard item"
    shared_operations:
      - "POST /api/item-variants — create variant (shared with TranslationSpecialist)"
      - "GET endpoints"

  - name: ContentReviewer
    description: "Content committee reviewer; casts verdicts in CONTENT sessions; approves variants"
    identity: opaque
    exclusive_operations:
      - "POST /api/item-variants/{vid}/approve — approve variant"
      - "POST /api/item-variants/{vid}/reject — reject variant"
    shared_operations:
      - "POST /api/review-sessions/{sid}/verdicts — submit verdict (shared with BiasSensitivityReviewer, segregated by committee_kind)"
      - "GET endpoints"

  - name: BiasSensitivityReviewer
    description: "Bias/sensitivity committee reviewer; casts verdicts in BIAS_SENSITIVITY sessions. Segregation-of-duties: same user cannot be ContentReviewer on the same item in the same revision cycle."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/review-sessions/{sid}/verdicts — submit verdict"
      - "GET endpoints"

  - name: Psychometrician
    description: "Psychometric statistician; ingests responses, excludes responses, computes stats, approves operational, retires for stats-fail, creates equating links, publishes dossiers"
    identity: opaque
    exclusive_operations:
      - "POST /api/field-test-windows/{wid}/responses — ingest response"
      - "POST /api/item-responses/{rid}/exclude — exclude response"
      - "POST /api/items/{itemId}/approve-operational — approve to OPERATIONAL"
      - "POST /api/equating-links — create equating link"
      - "POST /api/validity-dossiers — create dossier"
      - "POST /api/validity-dossiers/{vid}/publish — publish dossier"
      - "POST /api/validity-dossiers/{vid}/supersede — supersede dossier"
    shared_operations:
      - "POST /api/items/{itemId}/retire — retire on stats-fail (shared with SecurityOfficer)"
      - "GET endpoints"

  - name: TestAssembler
    description: "Forms assembler; creates blueprints, forms, slots; drives assemble"
    identity: opaque
    exclusive_operations:
      - "POST /api/test-blueprints — create blueprint"
      - "POST /api/test-forms — create form"
      - "POST /api/test-forms/{fid}/slots — add slot"
      - "DELETE /api/form-item-slots/{sid} — remove slot"
      - "POST /api/test-forms/{fid}/assemble — assemble form (OCC)"
    shared_operations:
      - "GET endpoints"

  - name: SecurityOfficer
    description: "Item bank security officer; issues/revokes access grants, marks items compromised, retires exposed items"
    identity: opaque
    exclusive_operations:
      - "POST /api/access-grants — issue grant"
      - "POST /api/access-grants/{gid}/revoke — revoke grant"
      - "POST /api/items/{itemId}/mark-compromised — mark compromised"
    shared_operations:
      - "POST /api/items/{itemId}/retire — retire exposed/manual (shared with Psychometrician)"
      - "GET endpoints"

  - name: TranslationSpecialist
    description: "Translation and accommodation specialist; creates ItemVariants"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/item-variants — create variant (shared with ItemWriter)"
      - "GET endpoints"
