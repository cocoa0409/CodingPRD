        as: ProgramAdmin
        captures:
          ag_id: $.data.id
          ag_v0: $.data.version
      - call: POST /servicing/agreements/${ag_id}/open-negotiation
        payload: {}
        as: ProgramAdmin
        captures:
          ag_v_neg: $.data.version
      - call: POST /servicing/agreements/${ag_id}/execute
        payload:
          expected_agreement_version: ${ag_v_neg}
        as: ProgramAdmin
      - call: POST /servicing/credit-programs
        payload:
          partner_id: ${p_id}
          agreement_id: ${ag_id}
          cycle_day: 8
        as: ProgramAdmin
        captures:
          g_id: $.data.id
          g_v0: $.data.version
      - call: POST /servicing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /servicing/applications
        payload:
          program_id: ${g_id}
          source_channel: DIGITAL
          requested_credit_limit_cents: 200000
        as: Applicant
        captures:
          app_id: $.data.id
      - call: POST /servicing/applications/${app_id}/decide
        payload: {}
        as: Underwriter
      - call: GET /servicing/accounts?program_id=${g_id}
        payload: {}
        as: ProgramAdmin
        captures:
          acct_id: $.data[0].id
      - call: POST /servicing/accounts/${acct_id}/post-payment
        payload:
          payment_amount_cents: 100
        as: Cardholder
        as_user_id: ${acct_id}
      - call: POST /servicing/credit-programs/${g_id}/open-renewal
        payload:
          expected_program_version: ${g_v0}
          to_status: WINDING_DOWN
        as: ProgramAdmin
        captures:
          g_v1: $.data.version
      - call: POST /servicing/transfer-agreements
        payload:
          program_id: ${g_id}
          buyer_role: RETAILER
        as: ProgramAdmin
