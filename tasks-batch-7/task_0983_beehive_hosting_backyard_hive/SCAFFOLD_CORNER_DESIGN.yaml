          setup: ["host ACTIVE with waiver; site CLEAR; agreement ACTIVE"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "RBAC Host", email: "rbac@x.com" }, as: Anonymous, captures: { h: $.data.id } }
