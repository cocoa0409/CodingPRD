  - rule_id: cross_entity_state_dependency
    instances:
      - name: receipt_sampling_gated_by_environmental_permit_state_two_hops_away
        grounds:
          - state_machines.EnvironmentalPermit.ACTIVE_to_SUSPENDED
          - state_machines.FuelFarm.OPEN_to_FROZEN
          - state_machines.FuelReceipt.RECORDED_to_SAMPLED
          - validations.priority_20
          - validations.priority_21
        dependency_chain: "EnvironmentalPermit.status -> FuelFarm.posture -> FuelReceipt.RECORDED_to_SAMPLED"
        distinguishing_aspect: |
          The blocked operation lives on FuelReceipt but nothing about the receipt changes: the only mutation is
          on a third entity (EnvironmentalPermit) whose SUSPENDED state recomputes FuelFarm.posture to FROZEN,
          which in turn is the precondition the receipt transition consults. The request that succeeded moments
          earlier now returns 409 ERR_FARM_FROZEN, and reinstating the permit makes the identical request
          succeed again without touching the receipt.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO with ACTIVE permit, truck TRK1 IN_SERVICE, tank T1 RELEASED with opening_volume_liters 1000000.0"
            - "two RECORDED TRUCK receipts R1 (MT-8001) and R2 (MT-8002) on tank T1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
