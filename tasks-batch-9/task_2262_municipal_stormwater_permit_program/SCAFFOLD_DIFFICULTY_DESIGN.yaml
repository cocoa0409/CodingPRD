              payload: { inspection_type: "POST_CONSTRUCTION_MAINTENANCE", period_start: "2026-07-20", period_end: "2026-07-25", post_construction_facility_id: "${fac_f_id}", rainfall_trigger: true }
              as: ConstructionInspector
              as_user_id: "insp-02"
              captures: { i2_id: $.data.id }
            - call: "POST /stormwater/inspections/${i2_id}/findings"
              payload: { severity: "CRITICAL", description: "Outlet structure blocked" }
              as: ConstructionInspector
              as_user_id: "insp-02"
            - call: "POST /stormwater/inspections/${i2_id}/findings"
              payload: { severity: "CRITICAL", description: "Embankment eroded" }
              as: ConstructionInspector
              as_user_id: "insp-02"
            - call: "POST /stormwater/inspections/${i2_id}/findings"
              payload: { severity: "CRITICAL", description: "Forebay full of sediment" }
              as: ConstructionInspector
              as_user_id: "insp-02"
          trigger:
            - call: "POST /stormwater/inspections/${i1_id}/finalize"
              payload: {}
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/inspections/${i2_id}/finalize"
              payload: {}
              as: ConstructionInspector
              as_user_id: "insp-02"
          assert:
            - "Inspection.${i1_id}.deficiency_score == 70: base 8*3 + 34 = 58, 58 * 1.20 = 69.6, round_half_up gives 70; truncation or ROUND_HALF_EVEN-to-integer style flooring would give 69"
            - "Inspection.${i1_id}.escalation_triggered == true because 70 >= 70, and no LARGE_SITE_ADDER applies at 1.00 acres"
            - "Inspection.${i2_id}.deficiency_score == 100: base 34*3 = 102 saturates at min(100, 102), and rainfall_trigger true is ignored by the maintenance branch"
            - "Inspection.${i2_id}.escalation_triggered == true and no OVERDUE_ADDER or NO_AGREEMENT_ADDER is added because agreement_status is RECORDED and inspection_overdue is false"
            - "both deficiency_score values are integers with no decimal component in the response"
            - "ConstructionSite.${site_f_id}.field_status == STOP_WORK and open_deficiency_score == 70; PostConstructionFacility.${fac_f_id}.credit_eligible == true is unaffected by the score"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: report_certification_blocked_by_permit_term_posture
        grounds:
          - state_machines.AnnualReport.COMPILED_to_CERTIFIED
          - validations[priority=86]
          - calculations.permit_term_compliance_posture
          - entities.PermitTerm.fields.compliance_posture
          - errors.ERR_POSTURE_NON_COMPLIANT
        distinguishing_aspect: |
          Entity pair (AnnualReport, PermitTerm): the report's own state is a perfectly legal
          COMPILED, and every field on it is complete, yet the transition depends entirely on a
          field of the parent term. Two BEHIND measures make the posture NON_COMPLIANT and the
          certification is refused; repairing one measure both lifts the posture and, as a side
          effect, knocks the report back to DRAFT so it must be recompiled first.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures"
            - "PUBLIC_EDUCATION reported 3 of 12 -> 25.00 BEHIND and MONITORING reported 1 of 4 -> 25.00 BEHIND"
            - "PermitTerm.behind_measure_count 2 -> compliance_posture NON_COMPLIANT"
            - "an AnnualReport for 2026-01-01..2026-12-31 compiled by mgr-01"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
              captures: { pe_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
              captures: { mon_id: $.data.id }
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures/${pe_id}/report-progress"
              payload: { measurable_goal_actual: 3 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
            - call: "POST /stormwater/control-measures/${mon_id}/report-progress"
              payload: { measurable_goal_actual: 1 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
            - call: "POST /stormwater/annual-reports"
              payload: { permit_term_id: "${term_id}", reporting_period_start: "2026-01-01", reporting_period_end: "2026-12-31" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { report_id: $.data.id }
            - call: "GET /stormwater/permit-terms/${term_id}"
              payload: {}
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { term_v: $.data.version }
            - call: "POST /stormwater/annual-reports/${report_id}/compile"
              payload: { expected_permit_term_version: "${term_v}" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /stormwater/annual-reports/${report_id}/certify"
              payload: { certification_statement: "I certify under penalty of law that this report is true, accurate and complete." }
              as: StormwaterProgramManager
              as_user_id: "mgr-02"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_POSTURE_NON_COMPLIANT: the report is COMPILED and mgr-02 is not the compiler, so nothing about the report itself is wrong"
            - "AnnualReport.${report_id}.status == COMPILED, certified_at == null, certified_by_user_id == null"
            - "PermitTerm.${term_id}.behind_measure_count == 2 and compliance_posture == NON_COMPLIANT"
            - "ControlMeasure.${pe_id}.attainment_pct == 25.00 and ControlMeasure.${mon_id}.attainment_pct == 25.00, both goal_status BEHIND"
            - "raising PUBLIC_EDUCATION to 12 of 12 makes behind_measure_count 1 and compliance_posture AT_RISK, but the same cascade reverts AnnualReport.${report_id} to DRAFT with invalidated_reason POSTURE_CHANGED"
            - "certify therefore fails again, now with ERR_REPORT_NOT_COMPILED (409), until the report is recompiled with the fresh PermitTerm version"

      - name: credit_approval_blocked_by_facility_agreement_state
        grounds:
          - validations[priority=85]
          - entities.PostConstructionFacility.fields.credit_eligible
          - entities.PostConstructionFacility.fields.agreement_status
          - calculations.credit_adjusted_net_fee
          - errors.ERR_FACILITY_NOT_CREDIT_ELIGIBLE
        distinguishing_aspect: |
          Entity pair (FeeCreditApplication, PostConstructionFacility) — a different pair on a
          different spine from the report/term case. The application is SUBMITTED with a legal
          requested_credit_pct well under the 0.5000 ceiling; it is the substantiating facility's
          agreement_status PENDING that makes credit_eligible false and blocks the approval.
          Recording the agreement flips the dependency and the identical call then succeeds.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures"
            - "site SITE-G with plan_status APPROVED and a PRIVATE facility whose agreement_status is PENDING"
            - "COMMERCIAL account P-9020 with impervious_area_sqft 9020 -> gross_billable_cents 29264"
            - "a SUBMITTED credit application for 0.2245 citing that facility"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
