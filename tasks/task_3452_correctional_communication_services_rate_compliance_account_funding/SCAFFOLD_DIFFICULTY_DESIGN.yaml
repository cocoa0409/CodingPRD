  - rule_id: compensating_invariant
    instances:
      - name: message_charge_then_reject_refund_conserves_account_balance
        grounds:
          - invariants.message_charge_refund_balance
          - calculations.message_charge
          - state_machines.TabletMessage.PENDING_REVIEW_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity: account balance in cents (vs booth-minutes in the sibling).
          The forward action (message create, charge 15) paired with its compensating
          action (review REJECT, refund 15) leaves Account.balance_cents exactly at its
          pre-pair value, while an APPROVE control proves the charge is real when no
          compensation fires.
