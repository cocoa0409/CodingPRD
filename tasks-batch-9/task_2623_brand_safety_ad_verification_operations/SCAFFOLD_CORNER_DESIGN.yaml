            - "The DOMAIN BLOCK entry ${block_entry} also matched (specificity_rank 3) but lost to the PAGE_URL ALLOW entry at rank 4 - BLOCK-before-ALLOW only breaks ties at EQUAL rank, so the decision is not BLOCK / LIST_EXCLUSION"
            - "The read is side-effect free: PreBidSegment.${seg1_id}.version and Page.${page_id}.version are unchanged after trigger 1, and a repeat of trigger 1 returns a byte-identical envelope"
            - "Trigger 2 (segment S2 never synced, sync_status PENDING): HTTP 409 and ${err_unsynced} == ERR_SEGMENT_NOT_SYNCED - Gate 0 precedes the DOMAIN BLOCK that would otherwise have produced a decision"

      - name: certify_is_allowed_only_from_scored
        claim_type: conditional_action
        excluded_because:
          difficulty_instance: coverage_rate_exactly_at_floor_certifies_one_impression_less_quarantines
          rationale: |
            The conditional-action corner on certify - the action is admissible
            only from scoring_status SCORED, and the destination state it picks
            (CERTIFIED vs QUARANTINED) is conditional on the pinned
            methodology's coverage floor and IVT ceiling - is fully constructed
            by the §1.8 instance, which certifies a batch sitting exactly on the
            0.7 floor and quarantines its twin one measurable impression lower.
            The from-state guard itself is separately pinned in this file by
            certify_before_scoring_returns_invalid_batch_state.

  # From Table 6 (Errors)
  - section: errors
    instances:
      - name: every_aggregate_answers_its_own_typed_not_found
        claim_type: violation_to_error
        grounds:
          - validations.priority_4
          - errors[ERR_PUBLISHER_NOT_FOUND]
          - errors[ERR_METHODOLOGY_VERSION_NOT_FOUND]
          - errors[ERR_PAGE_NOT_FOUND]
          - errors[ERR_PAGE_CLASSIFICATION_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - errors[ERR_IVT_FINDING_NOT_FOUND]
          - errors[ERR_REFUND_CLAIM_NOT_FOUND]
        distinguishing_aspect: |
          Priority 4 resolves the {id} path parameter against the EXPECTED TYPE,
          so each aggregate has its own error_id; one shared generic not-found id, or a
          404 that leaks the wrong entity name, is a distinguishable failure.
          All seven probes use the same syntactically valid UUID shape, so the
          only thing that can select the error is the route.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; the store is empty apart from the clock, so no id can accidentally resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /publishers/aaaaaaaa-0000-0000-0000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /methodology-versions/aaaaaaaa-0000-0000-0000-000000000002"
              payload: {}
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /pages/aaaaaaaa-0000-0000-0000-000000000003"
              payload: {}
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /page-classifications/aaaaaaaa-0000-0000-0000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /appeals/aaaaaaaa-0000-0000-0000-000000000005"
              payload: {}
              as: PlatformAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /ivt-findings/aaaaaaaa-0000-0000-0000-000000000006"
              payload: {}
              as: PlatformAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /refund-claims/aaaaaaaa-0000-0000-0000-000000000007"
              payload: {}
              as: PlatformAdmin
              captures: { e7: $.data.error_id }
          assert:
            - "All seven triggers return HTTP 404"
            - "${e1} == ERR_PUBLISHER_NOT_FOUND"
            - "${e2} == ERR_METHODOLOGY_VERSION_NOT_FOUND"
            - "${e3} == ERR_PAGE_NOT_FOUND"
            - "${e4} == ERR_PAGE_CLASSIFICATION_NOT_FOUND"
            - "${e5} == ERR_APPEAL_NOT_FOUND"
            - "${e6} == ERR_IVT_FINDING_NOT_FOUND"
            - "${e7} == ERR_REFUND_CLAIM_NOT_FOUND"
            - "Each response body carries error_id plus a human-readable message and no data payload, per the declared envelope"

      - name: each_uniqueness_scope_answers_its_own_duplicate_error
        claim_type: violation_to_error
        grounds:
          - validations.priority_25
          - errors[ERR_DUPLICATE_PUBLISHER_DOMAIN]
          - errors[ERR_DUPLICATE_VERSION_CODE]
          - errors[ERR_DUPLICATE_LIST_NAME]
          - errors[ERR_DUPLICATE_LIST_ENTRY]
          - errors[ERR_DUPLICATE_PAGE_URL]
        distinguishing_aspect: |
          Five different uniqueness scopes, five different error_ids, and each
          scope is deliberately narrow: the version_code duplicate is filed in a
          NON-OVERLAPPING abutting window so ERR_METHODOLOGY_WINDOW_OVERLAP
          cannot mask it, the list-name duplicate reuses the same
          (advertiser, list_type) pair, and the list-entry duplicate repeats the
          same (entry_type, entry_value) inside the same list. An implementation
          with one generic conflict error, or one that scopes list names
          globally instead of per (advertiser_id, list_type), fails here.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; publisher Beacon on beacon.example.com; VIEWABILITY version VIEW-2026.1 over [2026-01-01, 2027-01-01); advertiser with an INCLUSION list named 'Beacon Allowlist' holding one PUBLISHER entry; page https://beacon.example.com/news."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Beacon Allowlist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /inventory-lists/${inc_id}/entries"
              payload: { entry_type: "PUBLISHER", entry_value: "${pub_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/news" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id }
          trigger:
            - call: "POST /publishers"
              payload: { name: "Beacon Digital Group", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.10 }
              as: PlatformAdmin
              captures: { e_dom: $.data.error_id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { e_code: $.data.error_id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Beacon Allowlist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_name: $.data.error_id }
            - call: "POST /inventory-lists/${inc_id}/entries"
              payload: { entry_type: "PUBLISHER", entry_value: "${pub_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_entry: $.data.error_id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/news" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { e_url: $.data.error_id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Beacon Allowlist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { ok_list: $.data.id }
          assert:
            - "Trigger 1: HTTP 409 and ${e_dom} == ERR_DUPLICATE_PUBLISHER_DOMAIN (the differing name does not matter)"
            - "Trigger 2: HTTP 409 and ${e_code} == ERR_DUPLICATE_VERSION_CODE - the window [2027-01-01, 2028-01-01) merely abuts the existing one, so ERR_METHODOLOGY_WINDOW_OVERLAP is NOT the answer"
            - "Trigger 3: HTTP 409 and ${e_name} == ERR_DUPLICATE_LIST_NAME"
            - "Trigger 4: HTTP 409 and ${e_entry} == ERR_DUPLICATE_LIST_ENTRY; InventoryList.${inc_id}.entry_count is still 1"
            - "Trigger 5: HTTP 409 and ${e_url} == ERR_DUPLICATE_PAGE_URL; GET /pages filtered by publisher_id == ${pub_id} returns total_count == 1 and the single id ${page_id}"
            - "Trigger 6: HTTP 201 - the same name under a DIFFERENT list_type is legal, because uniqueness is scoped to (advertiser_id, list_type); InventoryList.${ok_list}.status == DRAFT"

      - name: repeating_a_completed_transition_answers_the_entity_specific_state_error
        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - errors[ERR_INVALID_PUBLISHER_STATE]
          - errors[ERR_INVALID_METHODOLOGY_STATE]
          - errors[ERR_INVALID_SEGMENT_STATE]
          - errors[ERR_INVALID_CLASSIFICATION_STATE]
          - errors[ERR_INVALID_FINDING_STATE]
          - errors[ERR_INVALID_PAGE_STATE]
        distinguishing_aspect: |
          Six aggregates, six state-error ids, all raised from the SAME shape of
          mistake (a trigger that the current state does not declare) so nothing
          but the entity can select the id. The page case is the subtle one: the
          appeal is refused with ERR_INVALID_PAGE_STATE - a PAGE error on an
