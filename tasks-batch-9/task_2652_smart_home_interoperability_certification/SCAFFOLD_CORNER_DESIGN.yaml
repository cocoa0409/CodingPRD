        distinguishing_aspect: >
          From identical stored data the AVAILABLE and COMMITTED variants differ by exactly the one
          escrowed submission's fee (150000): 850000 versus 1000000. A DRAFT sibling submission of the
          same member escrows nothing, so it moves neither variant, and the stated invariant
          purchased == balance + consumed + escrowed holds only for the AVAILABLE variant.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY 20)."
            - "Member M1 in good standing with 1000000 cents purchased; submission A (fee 150000) SUBMITTED, submission B left in DRAFT."
