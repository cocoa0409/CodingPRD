              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "18 Alder Court", state_code: "OR", owned_segments: ["WATER_METER_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { unowned_premises: $.data.id, unowned_premises_v1: $.data.version }
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "22 Birch Lane", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { water_premises: $.data.id, water_premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /enrollments"
              payload: { premises_id: "${unowned_premises}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${unowned_premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { seg_type: $.response_type, seg_error: $.data.error_id, seg_message: $.data.message, seg_ts: $.meta.api_request_timestamp }
            - call: "POST /enrollments"
              payload: { premises_id: "${water_premises}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: 7, prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { stale_error: $.data.error_id, stale_message: $.data.message }
            - call: "POST /enrollments"
              payload: { premises_id: "00000000-0000-4000-8000-000000000000", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: 1, prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { nf_error: $.data.error_id, nf_type: $.response_type }
            - call: "GET /enrollments"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_total: $.data.total_count, enrollment_has_more: $.data.has_more }
            - call: "GET /premises/${water_premises}"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { water_v_after: $.data.version }
            - call: "GET /premises/${unowned_premises}"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { unowned_v_after: $.data.version, unowned_reason_after: $.data.suppression_reason }
            - call: "GET /partners/${partner_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { count_after_refusals: $.data.enrolled_premises_count, partner_v_after: $.data.version }
            - call: "GET /ledger-entries"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
              captures: { ledger_total: $.data.total_count }
            - call: "POST /enrollments"
              payload: { premises_id: "${water_premises}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${water_v_after}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { ok_enrollment: $.data.id, ok_coverage: $.data.coverage_status, ok_term_start: $.data.term_start }
            - call: "GET /enrollments"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_total_after: $.data.total_count, enrollment_first_after: "$.data.items[0].id" }
          assert:
            - "${seg_type} == error and ${seg_error} == ERR_SEGMENT_NOT_OWNED with HTTP 422, and ${seg_message} is a non-empty human-readable string  # on a failure response_type is the literal error and data is exactly {error_id, message}"
            - "${seg_ts} == 2026-08-05T00:00:00.000Z  # the meta block is present and clock-pinned on failures too"
            - "${stale_error} == ERR_STALE_PREMISES_VERSION with HTTP 409 and ${stale_message} is a non-empty string"
            - "${nf_error} == ERR_PREMISES_NOT_FOUND with HTTP 404 and ${nf_type} == error"
            - "${enrollment_total} == 0 and ${enrollment_has_more} == false  # three refusals, zero rows"
            - "${water_v_after} == 1 and ${unowned_v_after} == 1  # a refused write never bumps the version it validated against"
            - "${unowned_reason_after} == NONE  # the rejected enrollment left no trace on the premises it named"
            - "${count_after_refusals} == 0 and ${partner_v_after} == 2  # the partner still carries only its activation bump"
            - "${ledger_total} == 0  # no orphan ledger row was written before the validation ladder refused"
            - "${ok_coverage} == PENDING_WAITING_PERIOD and ${ok_term_start} == 2026-08-05  # the same call succeeds once the fresh version is used, proving the earlier refusals were the only difference"
            - "${enrollment_total_after} == 1 and ${enrollment_first_after} == ${ok_enrollment}"

      - name: consistency_batch_output_and_the_rows_it_names_never_disagree
        claim_type: immediate
        grounds:
          - endpoints[POST /operations/nightly-run]
          - state_machines.Enrollment
          - endpoints[GET /enrollments]
          - endpoints[GET /claims]
        distinguishing_aspect: "The nightly batch is a synchronous request under the immediate model: every id it reports in activated_enrollment_ids and closed_claim_ids already reflects the new status on the very next read, the ids it omits are unchanged, and the enrollment list filtered by the new status returns exactly the reported set — the batch's own report and the stored rows are one transaction, never eventually reconciled."
        test_recipe:
          setup:
            - "Two enrollments created on 2026-08-05 whose coverage becomes effective 2026-09-04, plus a third premises left un-enrolled; the batch is then run at 2026-09-10T08:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
