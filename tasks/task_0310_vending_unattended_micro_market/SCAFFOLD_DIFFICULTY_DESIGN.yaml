# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >=2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_provisional_vs_final_fifo_cogs_on_sale
        grounds:
          - calculations.provisional_cogs
          - calculations.fifo_lot_consumption
          - entities.Sale.fields.provisional_cogs_cents
          - entities.Sale.fields.lot_consumption_json
        distinguishing_aspect: |
          The two valid COGS algorithms operate on the Sale/InventoryLot domain: provisional
          uses slot weighted-average lot cost (60c) while FIFO-final draws the oldest lot only
          (40c), so the same qty-5 sale yields provisional_cogs_cents=300 but the realized
          FIFO cost is 200 — different numbers from identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-06-01. One host, one ACTIVE non-perishable product (unit_cost 40c), one machine, one slot (cap 30, par 30, price 150c)."
            - "Reconcile-1 fills 12 units (lot snapshots cost 40c). Product cost is then raised to 90c. Reconcile-2 fills 8 more units of the SAME slot (lot snapshots cost 90c). Slot now holds 12@40 (older) + 8@90, weighted avg = 60c."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Lobby A", contact_email: "a@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "CHIP40", name: "Chips", category: "SNACK", unit_cost_cents: 40, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-1", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "A1", capacity: 30, par_level: 30, price_cents: 150 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Dee Driver", employee_code: "EMP1" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-01T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 12 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit1_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit1_id}/reconcile"
              payload: { expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
            - call: "GET /operations/machines/${mach_id}"
              payload: {}
              as: FieldOps
              captures: { mach_v_after1: $.data.version }
            - call: "PATCH /operations/products/${prod_id}/cost"
              payload: { unit_cost_cents: 90 }
              as: FieldOps
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 600, window_end_min: 660 }
              as: FieldOps
              captures: { stop2_id: $.data.id }
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop2_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 12, refill_units: 8 } ], expected_machine_version: "${mach_v_after1}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit2_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit2_id}/reconcile"
              payload: { expected_machine_version: "${mach_v_after1}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${slot_id}", quantity: 5, payment_method: "CASHLESS" }
              as: FieldOps
              captures: { sale_id: $.data.id }
          assert:
            - "Sale.${sale_id}.provisional_cogs_cents == 300"
            - "Sale.${sale_id}.lot_consumption_json draws all 5 units from the 40c lot (the oldest), so realized FIFO cost == 200"
            - "Sale.${sale_id}.gross_cents == 750"

      - name: dvc_gross_vs_net_commission_on_statement
        grounds:
          - calculations.gross_commission
          - calculations.net_commission
          - entities.CommissionStatement.fields.gross_commission_cents
          - entities.CommissionStatement.fields.net_commission_cents
          - entities.HostSite.fields.monthly_guarantee_cents
        distinguishing_aspect: |
          The dual variant here is on the CommissionStatement/HostSite domain (distinct from the
          Sale-domain COGS dual variant): gross_commission_cents=105 (10% of 1050 gross) versus
          net_commission_cents=80000 because the host's monthly_guarantee_cents floor (80000)
          overrides the much smaller computed commission.
        test_recipe:
          setup:
            - "Host FLAT 0.10 with monthly_guarantee_cents 80000; one machine, one slot price 150c stocked with 30 units."
            - "Two SETTLED cashless sales: qty 4 (gross 600) and qty 3 (gross 450), total gross_sales 1050; no reconciled-visit shrink in the period."
            - "An OPEN statement covering the sales period."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Lobby B", contact_email: "b@x.com", commission_model: "FLAT", flat_commission_pct: 0.10, monthly_guarantee_cents: 80000 }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "SODA1", name: "Soda", category: "BEVERAGE", unit_cost_cents: 30, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-2", machine_type: "BEVERAGE_VENDOR" }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "B1", capacity: 40, par_level: 40, price_cents: 150 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Ray Route", employee_code: "EMP2" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-10T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 30 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit_id}/reconcile"
              payload: { expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
            - call: "POST /operations/routes/${route_id}/close"
              payload: {}
              as: FieldOps
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${slot_id}", quantity: 4, payment_method: "CASHLESS" }
              as: FieldOps
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${slot_id}", quantity: 3, payment_method: "CASHLESS" }
              as: FieldOps
            - call: "POST /operations/commission-statements"
              payload: { host_site_id: "${host_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FinanceClerk
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /operations/commission-statements/${stmt_id}/finalize"
              payload: {}
              as: FinanceClerk
              captures: { net: $.data.net_commission_cents, gross_comm: $.data.gross_commission_cents }
          assert:
            - "CommissionStatement.${stmt_id}.gross_sales_cents == 1050"
            - "CommissionStatement.${stmt_id}.gross_commission_cents == 105"
            - "CommissionStatement.${stmt_id}.net_commission_cents == 80000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_tiered_commission_marginal_bands_with_category_exclusion
        grounds:
          - calculations.gross_commission
          - entities.HostSite.fields.commission_model
          - entities.Product.fields.category
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — marginal-rate tier selection (0.08/0.12/0.15
          across 500000/1500000 caps) combined with the FRESH_FOOD category exclusion from the
          tiered base. tiered_base 800000 (after excluding fresh) yields gross_commission_cents
          = 500000*0.08 + 300000*0.12 = 76000.
        test_recipe:
          setup:
            - "Host TIERED; two slots — one SNACK (price 1000c) one FRESH_FOOD (price 1000c)."
            - "SETTLED sales summing to 800000c of SNACK gross and 200000c of FRESH_FOOD gross within the period; FRESH_FOOD excluded so tiered_base=800000."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Tier Host", contact_email: "t@x.com", commission_model: "TIERED" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "SNK", name: "Snack", category: "SNACK", unit_cost_cents: 100, shelf_life_days: 0 }
              as: FieldOps
              captures: { snk_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "FRSH", name: "Sandwich", category: "FRESH_FOOD", unit_cost_cents: 200, shelf_life_days: 3 }
              as: FieldOps
              captures: { frsh_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-3", machine_type: "MICRO_MARKET_KIOSK" }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${snk_id}", slot_code: "S1", capacity: 1000, par_level: 1000, price_cents: 1000 }
              as: FieldOps
              captures: { snk_slot: $.data.id }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${frsh_id}", slot_code: "S2", capacity: 1000, par_level: 1000, price_cents: 1000 }
              as: FieldOps
              captures: { frsh_slot: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Stocker", employee_code: "EMP3" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-10T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop_id}", counted_lines: [ { slot_id: "${snk_slot}", physical_count: 0, refill_units: 1000 }, { slot_id: "${frsh_slot}", physical_count: 0, refill_units: 1000 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit_id}/reconcile"
              payload: { expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${snk_slot}", quantity: 800, payment_method: "CASHLESS" }
              as: FieldOps
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${frsh_slot}", quantity: 200, payment_method: "CASHLESS" }
              as: FieldOps
            - call: "POST /operations/commission-statements"
              payload: { host_site_id: "${host_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FinanceClerk
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /operations/commission-statements/${stmt_id}/finalize"
              payload: {}
              as: FinanceClerk
          assert:
            - "CommissionStatement.${stmt_id}.gross_commission_cents == 76000"
            - "CommissionStatement.${stmt_id}.gross_sales_cents == 1000000"

      - name: cf_shrink_chargeback_round_per_visit_then_sum
        grounds:
          - calculations.shrink_chargeback
          - calculations.gross_commission
          - entities.CommissionStatement.fields.shrink_chargeback_cents
          - entities.RestockVisit.fields.shrink_value_cents
        distinguishing_aspect: |
          Mode (b): rounding order. shrink_chargeback rounds EACH visit's 50% share to cents then
          sums (rhu(101*.5)=51 + rhu(103*.5)=52 = 103), which differs from the forbidden
          sum-then-round (rhu(204*.5)=102). The scaffold pins round-per-visit-then-sum, contrasting
          gross_commission's pinned sum-then-round.
        test_recipe:
          setup:
            - "Host FLAT 0.10, no guarantee; one machine one slot price 1c capacity 200 par 200."
            - "Two reconciled visits each produce shrink_value: visit-1 shrink_value=101, visit-2 shrink_value=103 (slot price 1c, shrink units 101 and 103 respectively across separate restock cycles)."
            - "An OPEN statement covering both reconcile times; gross_commission separately confirms sum-then-round."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Shrink Host", contact_email: "s@x.com", commission_model: "FLAT", flat_commission_pct: 0.10 }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "PENNY", name: "Penny Item", category: "SNACK", unit_cost_cents: 1, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-4", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "P1", capacity: 200, par_level: 200, price_cents: 1 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Pat", employee_code: "EMP4" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-05T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop1_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop1_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 101 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit1_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit1_id}/reconcile"
              payload: { expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
            - call: "GET /operations/machines/${mach_id}"
              payload: {}
              as: FieldOps
              captures: { mach_v1: $.data.version }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 600, window_end_min: 660 }
              as: FieldOps
              captures: { stop2_id: $.data.id }
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop2_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 103 } ], expected_machine_version: "${mach_v1}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit2_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit2_id}/reconcile"
              payload: { expected_machine_version: "${mach_v1}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
            - call: "POST /operations/commission-statements"
              payload: { host_site_id: "${host_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FinanceClerk
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /operations/commission-statements/${stmt_id}/finalize"
              payload: {}
              as: FinanceClerk
          assert:
            - "RestockVisit.${visit1_id}.shrink_value_cents == 101"
            - "RestockVisit.${visit2_id}.shrink_value_cents == 103"
            - "CommissionStatement.${stmt_id}.shrink_chargeback_cents == 103"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_machine_parallel_status_dimensions
        grounds:
          - state_machines.Machine.stock_status=STOCKED_to_stock_status=LOW_STOCK
          - state_machines.Machine.cash_status=CASH_OK_to_cash_status=CASH_FULL_WARN
          - entities.Machine.fields.stock_status
          - entities.Machine.fields.cash_status
        distinguishing_aspect: |
          Machine carries parallel state dimensions: a CASH sale that crosses the cash threshold
          flips cash_status to CASH_FULL_WARN while stock_status independently moves to LOW_STOCK,
          proving the two axes evolve on the same row without coupling.
        test_recipe:
          setup:
            - "Machine cash_capacity 50000, cash_alert_threshold_pct 0.80 (threshold 40000), par_fill_threshold_pct 0.25; one slot capacity 8 par 8 price 20000 stocked with 4 units."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Posture Host", contact_email: "p@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "BIGITEM", name: "Big", category: "BEVERAGE", unit_cost_cents: 5000, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-5", machine_type: "BEVERAGE_VENDOR", cash_capacity_cents: 50000, cash_alert_threshold_pct: 0.80, par_fill_threshold_pct: 0.25 }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "C1", capacity: 8, par_level: 8, price_cents: 20000 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Vic", employee_code: "EMP5" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-02T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 4 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit_id}/reconcile"
              payload: { expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${slot_id}", quantity: 2, payment_method: "CASH" }
              as: FieldOps
          assert:
            - "Machine.${mach_id}.cash_on_hand_cents == 40000 (cash axis: 2 * 20000)"
            - "Machine.${mach_id}.cash_status == CASH_FULL_WARN (cash axis at >= threshold 40000)"
            - "Machine.${mach_id}.stock_status == LOW_STOCK (stock axis independently: on_hand 2 of capacity 8 -> ratio 0.25 <= 0.25, still > 0)"

      - name: nlsm_service_ticket_resolved_reopen_cycle
        grounds:
          - state_machines.ServiceTicket.RESOLVED_to_REOPENED
          - state_machines.ServiceTicket.REOPENED_to_IN_PROGRESS
          - state_machines.ServiceTicket.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: |
          On a different entity (ServiceTicket), the machine exhibits a true cycle:
          OPEN->IN_PROGRESS->RESOLVED->REOPENED->IN_PROGRESS->RESOLVED, returning to a previously
          visited state, which a linear pipeline cannot express.
        test_recipe:
          setup:
            - "One machine with a non-blocking JAM ticket that has already been started and resolved once."
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Tk Host", contact_email: "tk@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
