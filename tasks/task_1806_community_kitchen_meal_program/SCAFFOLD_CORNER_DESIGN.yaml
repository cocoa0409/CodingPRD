        claim_type: conditional_action
        grounds:
          - calculations.service_capacity_check
          - endpoints["POST /kitchen/meal-services"]
        distinguishing_aspect: "TO_GO service capacity must be <= togo_capacity_per_window * floor(window_minutes/30): window 60 min with per-window 20 -> max 40; capacity 41 is rejected, 40 accepted."
        test_recipe:
          setup: ["Site S (togo_capacity_per_window 20); menu day D DRAFT."]
          setup_api_calls:
