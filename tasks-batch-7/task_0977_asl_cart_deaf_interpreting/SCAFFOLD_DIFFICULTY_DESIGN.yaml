  - rule_id: transitive_cascade
    instances:
      - name: no_show_strike_suspension_cancels_future_assignments
        grounds:
          - state_machines.Assignment.CONFIRMED_to_NO_SHOW
          - state_machines.Interpreter.ACTIVE_to_SUSPENDED
          - calculations.strike_rolling_window_count
        distinguishing_aspect: |
          Depth-4 chain from mark-no-show: Assignment -> NO_SHOW creates a StrikeRecord,
          the strike recompute (count 2 -> 3) suspends the Interpreter, the suspension
          cancels the interpreter's unrelated CONFIRMED assignment A4 (SYSTEM), and A4's
          cancellation re-matches request R4 to MATCHING — each link caused by the previous.
        test_recipe:
          setup:
            - "Interpreter i1 carries 2 ACTIVE manual strikes (occurred 2026-03-01, inside the rolling 365-day window)"
            - "Assignment A3 CONFIRMED for 2026-06-12T14:00:00Z-15:00:00Z; assignment A4 CONFIRMED for 2026-06-20T14:00:00Z-15:00:00Z (no buffer overlap)"
