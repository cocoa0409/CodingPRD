              call: "POST /products"
              payload: { sku: "SKU-CLR-1", name: "Legacy Turntable", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}", lifecycle_status: "CLEARANCE", clearance_discount_pct: 0.20 }
              as: BrandChannelManager
              captures: { prodclr: $.data.id }
            - &EXCCLR
              call: "POST /pricing-exceptions"
              payload: { product_id: "${prodclr}", exception_type: "CLEARANCE", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 9000, dealer_input_source: "BRAND_MARKETING_PLAN" }
