# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2947_audio_post_production_sound_design
#
# Test-targeting index for the nine §0.5 Difficulty Rules. Every instance grounds
# only in elements declared in SCAFFOLD.yaml §1.1–§1.7; deleting this file would
# not change a single declared behaviour.
#
# Fixture conventions used by every chain below:
#   * opaque operator ids: admin-1 (FacilityAdmin), sup-1 (PostSupervisor),
#     editor-1 (SoundEditor), qc-1 (QcOperator), client-user-1 (ClientReviewer);
#     Mixer is entity_backed, so as_user_id is always the captured Mixer id.
#   * every instant is ISO-8601 UTC at whole-second precision with a trailing Z.
#   * the logical clock starts at 2026-08-01T00:00:00Z and is moved explicitly.
#   * every expected_*_version value is captured from a GET immediately before the
#     guarded write, never a literal.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: stage_booking_provisional_vs_final_cost_divergence
        grounds:
          - calculations.stage_booking_cost
          - entities.MixStageBooking.fields.provisional_cost_cents
          - entities.MixStageBooking.fields.final_cost_cents
          - entities.MixStageBooking.fields.overtime_hours
          - state_machines.MixStageBooking.IN_PROGRESS_to_COMPLETED
          - calculations.stage_hours_ledger
        distinguishing_aspect: |
          The PROVISIONAL variant prices the REQUESTED window with no overtime concept, while the
          FINAL variant prices the ACTUAL window after a 0.25h ceiling and charges the excess over
          reserved_hours at 1.5x; the same booking therefore yields provisional_cost_cents 360000
          and final_cost_cents 405000, a +45000 delta that also moves 3.25h from
          stage_hours_reserved into stage_hours_consumed.
        test_recipe:
          setup:
            - "Stage STAGE_A at 120000 cents/hour with a 45-minute changeover."
            - "Mixer certified for THEATRICAL and STREAMING, max_daily_hours 10.00."
            - "STANDARD-turnaround project with stage_hours_authorized 40.00, picture LOCKED."
            - "One FINAL_MIX booking requested for 2026-09-14T10:00:00Z -> 13:00:00Z (3.00 hours)."
            - "The mixer actually occupies the stage from 10:00:00Z to 13:10:00Z (3h10m)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_A", display_name: "Stage A", hourly_rate_cents: 120000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { stage_a_id: $.data.id }
            - call: "POST /mixers"
              payload: { full_name: "Ada Mixer", certified_platforms: ["THEATRICAL", "STREAMING"], max_daily_hours: 10.00 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { mixer_one_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Feature Alpha", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "STANDARD", stage_hours_authorized: 40.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_pre_booking: $.data.version }
          trigger:
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_pre_booking}", project_id: "${proj_id}", mix_stage_id: "${stage_a_id}", mixer_id: "${mixer_one_id}", booking_type: "FINAL_MIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T13:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { booking_id: $.data.id, prov_cost: $.data.provisional_cost_cents }
            - call: "POST /mix-bookings/${booking_id}/confirm"
              payload: {}
              as: Mixer
              as_user_id: "${mixer_one_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-bookings/${booking_id}/start"
              payload: {}
              as: Mixer
              as_user_id: "${mixer_one_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T13:10:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-bookings/${booking_id}/complete"
              payload: {}
              as: Mixer
              as_user_id: "${mixer_one_id}"
              captures: { final_cost: $.data.final_cost_cents }
          assert:
            - "MixStageBooking.${booking_id}.reserved_hours == 3.00"
            - "MixStageBooking.${booking_id}.provisional_cost_cents == 360000"
            - "MixStageBooking.${booking_id}.billable_hours_final == 3.25"
            - "MixStageBooking.${booking_id}.overtime_hours == 0.25"
            - "MixStageBooking.${booking_id}.final_cost_cents == 405000"
            - "MixStageBooking.${booking_id}.final_cost_cents - MixStageBooking.${booking_id}.provisional_cost_cents == 45000"
            - "MixStageBooking.${booking_id}.status == COMPLETED"
            - "Project.${proj_id}.stage_hours_reserved == 0.00"
            - "Project.${proj_id}.stage_hours_consumed == 3.25"
            - "Project.${proj_id}.stage_hours_available == 36.75"
            - "Project.${proj_id}.stage_cost_subtotal_cents == 405000"
            - "Project.${proj_id}.billing_total_cents == 405000"
            - "Project.${proj_id}.pipeline_stage == QC"

      - name: license_risk_intake_snapshot_vs_delivery_audit_divergence
        grounds:
          - calculations.license_risk_score
          - calculations.asset_usage_clearance
          - entities.Project.fields.license_risk_score_intake
          - entities.Project.fields.license_risk_score_audit
          - entities.AssetUsage.fields.unlicensed_reason
          - validations[priority=26]
        distinguishing_aspect: |
          Over the identical two asset usages the INTAKE_SNAPSHOT variant counts CLEARED usages
          only and reads 20.00, while the DELIVERY_AUDIT variant adds the ROYALTY_FREE weight for
          the unlicensed row, the 30-point unlicensed penalty and the 10-point near-expiry weight
          and reads 65.00 — above RISK_BLOCK_THRESHOLD 50.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "RIGHTS_MANAGED WORLDWIDE asset, fee 25000 cents, expiring 2026-09-11T00:00:00Z (10 days out)."
            - "ROYALTY_FREE DOMESTIC-only asset, flat fee 17890 cents, no expiry."
            - "A DRAFT stem package on a locked project."
            - "The RM asset is used for 100 seconds declared WORLDWIDE (clears, 4 billable units)."
            - "The RF asset is used for 60 seconds declared WORLDWIDE (out of territory scope, unlicensed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /library-assets"
              payload: { asset_code: "RM-0001", kind: "MUSIC_LIBRARY", license_type: "RIGHTS_MANAGED", territory_scope: "WORLDWIDE", fee_cents: 25000, expires_at_utc: "2026-09-11T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { rm_asset_id: $.data.id }
            - call: "POST /library-assets"
              payload: { asset_code: "RF-0001", kind: "SFX", license_type: "ROYALTY_FREE", territory_scope: "DOMESTIC", fee_cents: 17890 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { rf_asset_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Feature Beta", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "STANDARD", stage_hours_authorized: 40.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R1", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /asset-usages"
              payload: { library_asset_id: "${rm_asset_id}", stem_package_id: "${sp_id}", usage_seconds: 100, territory_declared: "WORLDWIDE" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { usage_rm_id: $.data.id, usage_rm_fee: $.data.accrued_fee_cents }
            - call: "POST /asset-usages"
              payload: { library_asset_id: "${rf_asset_id}", stem_package_id: "${sp_id}", usage_seconds: 60, territory_declared: "WORLDWIDE" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { usage_rf_id: $.data.id }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { intake_score: $.data.license_risk_score_intake, audit_score: $.data.license_risk_score_audit }
          assert:
            - "AssetUsage.${usage_rm_id}.clearance_status == CLEARED"
            - "AssetUsage.${usage_rm_id}.accrued_fee_cents == 100000"
            - "AssetUsage.${usage_rf_id}.clearance_status == UNLICENSED"
            - "AssetUsage.${usage_rf_id}.unlicensed_reason == TERRITORY_OUT_OF_SCOPE"
            - "AssetUsage.${usage_rf_id}.accrued_fee_cents == 0"
            - "Project.${proj_id}.license_risk_score_intake == 20.00"
            - "Project.${proj_id}.license_risk_score_audit == 65.00"
            - "Project.${proj_id}.license_fee_accrued_cents == 100000"
            - "Project.${proj_id}.unlicensed_usage_count == 1"
            - "Project.${proj_id}.posture == RESTRICTED"
            - "Project.${proj_id}.billing_total_cents == 100000"

  - rule_id: combinatorial_formula
    instances:

      - name: stem_conform_per_cue_rounding_before_summation
        grounds:
          - calculations.stem_conform_totals
          - entities.StemPackage.fields.total_stem_minutes
          - entities.StemPackage.fields.conform_fee_cents
          - state_machines.StemPackage.DRAFT_to_CONFORMED
          - concurrency_rules[cue-create-stale-stem-package]
        distinguishing_aspect: |
          Three 95-second cues must round to 1.58 minutes EACH before summation, giving
          total_stem_minutes 4.74 and conform_fee_cents 7110; the forbidden sum-then-divide order
          gives 4.75 minutes and 7125 cents, so the 15-cent gap falsifies the wrong order.
        test_recipe:
          setup:
            - "Locked project with one DRAFT stem package."
            - "Three ACTIVE music cues of exactly 95 seconds each (cue numbers 1M1, 1M2, 1M3)."
            - "Each cue create is guarded by the stem package's freshly-read version."
          setup_api_calls:
            - call: "POST /projects"
              payload: { title: "Feature Gamma", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "STANDARD", stage_hours_authorized: 40.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R1", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_id: $.data.id, sp_v0: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v0}", cue_number: "1M1", duration_seconds: 95, source: "COMPOSER_ORIGINAL", composer_delivery_ref: "COMP-1M1" }
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "GET /stem-packages/${sp_id}"
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_v1: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v1}", cue_number: "1M2", duration_seconds: 95, source: "COMPOSER_ORIGINAL", composer_delivery_ref: "COMP-1M2" }
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "GET /stem-packages/${sp_id}"
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_v2: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v2}", cue_number: "1M3", duration_seconds: 95, source: "COMPOSER_ORIGINAL", composer_delivery_ref: "COMP-1M3" }
              as: SoundEditor
              as_user_id: "editor-1"
          trigger:
            - call: "POST /stem-packages/${sp_id}/conform"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { conformed_minutes: $.data.total_stem_minutes, conform_fee: $.data.conform_fee_cents }
          assert:
            - "StemPackage.${sp_id}.status == CONFORMED"
            - "StemPackage.${sp_id}.cue_count == 3"
            - "StemPackage.${sp_id}.total_stem_minutes == 4.74"
            - "StemPackage.${sp_id}.total_stem_minutes != 4.75"
            - "StemPackage.${sp_id}.conform_fee_cents == 7110"
            - "StemPackage.${sp_id}.conform_fee_cents != 7125"
            - "StemPackage.${sp_id}.conform_round == 1"
            - "Project.${proj_id}.conformed_stem_count == 1"
            - "Project.${proj_id}.pipeline_stage == PREMIX"
            - "Project.${proj_id}.billing_total_cents == 7110"

      - name: project_billing_discount_tier_before_rush_surcharge
        grounds:
          - calculations.project_billing_total
          - calculations.stage_booking_cost
          - calculations.adr_session_cost
          - calculations.stem_conform_totals
          - calculations.asset_usage_clearance
          - entities.Project.fields.billing_total_cents
        distinguishing_aspect: |
          The discount tier is keyed on the PRE-surcharge subtotal 900000 (rate 0.05) and the RUSH
          surcharge is then applied to the post-discount base, yielding billing_total_cents
          1026000; keying the tier on the post-surcharge total 1080000 (rate 0.08) yields 993600,
          so the two orders are separated by 32400 cents.
        test_recipe:
          setup:
            - "RUSH-turnaround project, stage_hours_authorized 40.00, picture LOCKED."
            - "Stage at 150000 cents/hour; a RESERVED 3.00-hour PREMIX booking -> provisional 720000 (450000 x 1.60)."
            - "UNION talent, min call 60 minutes; one CONFIRMED 45-minute ADR session -> 54000."
            - "One CONFORMED stem package with two 120-second cues -> conform_fee_cents 6000."
            - "One CLEARED RIGHTS_MANAGED usage, fee 30000, 100 seconds -> 4 units -> 120000."
            - "pre_discount_total_cents = 720000 + 54000 + 6000 + 120000 = 900000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_B", display_name: "Stage B", hourly_rate_cents: 150000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { stage_b_id: $.data.id }
            - call: "POST /mixers"
              payload: { full_name: "Bo Mixer", certified_platforms: ["THEATRICAL", "STREAMING"], max_daily_hours: 10.00 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { mixer_one_id: $.data.id }
            - call: "POST /voice-talents"
              payload: { full_name: "Vera Voice", union_status: "UNION", daily_cap_minutes: 240, min_call_minutes: 60 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { talent_id: $.data.id }
            - call: "POST /library-assets"
              payload: { asset_code: "RM-0002", kind: "MUSIC_LIBRARY", license_type: "RIGHTS_MANAGED", territory_scope: "WORLDWIDE", fee_cents: 30000 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { rm_asset_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Feature Delta", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "RUSH", stage_hours_authorized: 40.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R1", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_id: $.data.id, sp_v0: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v0}", cue_number: "1M1", duration_seconds: 120, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "GET /stem-packages/${sp_id}"
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_v1: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v1}", cue_number: "1M2", duration_seconds: 120, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "POST /stem-packages/${sp_id}/conform"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "POST /asset-usages"
              payload: { library_asset_id: "${rm_asset_id}", stem_package_id: "${sp_id}", usage_seconds: 100, territory_declared: "WORLDWIDE" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { usage_id: $.data.id }
            - call: "POST /adr-sessions"
              payload: { project_id: "${proj_id}", voice_talent_id: "${talent_id}", window_start_utc: "2026-09-14T09:00:00Z", window_end_utc: "2026-09-14T09:45:00Z", lines_scheduled: 12 }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { adr_id: $.data.id }
            - call: "POST /adr-sessions/${adr_id}/confirm"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_pre_booking: $.data.version }
          trigger:
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_pre_booking}", project_id: "${proj_id}", mix_stage_id: "${stage_b_id}", mixer_id: "${mixer_one_id}", booking_type: "PREMIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T13:00:00Z" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { booking_id: $.data.id }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { pre_total: $.data.pre_discount_total_cents, billed: $.data.billing_total_cents }
          assert:
            - "MixStageBooking.${booking_id}.provisional_cost_cents == 720000"
            - "AdrSession.${adr_id}.billable_minutes == 60.00"
            - "AdrSession.${adr_id}.session_cost_cents == 54000"
            - "StemPackage.${sp_id}.conform_fee_cents == 6000"
            - "AssetUsage.${usage_id}.accrued_fee_cents == 120000"
            - "GET /projects/${proj_id}/ledger .stage_cost_subtotal_cents == 720000"
            - "GET /projects/${proj_id}/ledger .adr_cost_cents == 54000"
            - "GET /projects/${proj_id}/ledger .conform_fee_total_cents == 6000"
            - "GET /projects/${proj_id}/ledger .license_fee_accrued_cents == 120000"
            - "GET /projects/${proj_id}/ledger .pre_discount_total_cents == 900000"
            - "GET /projects/${proj_id}/ledger .volume_discount_cents == 45000"
            - "GET /projects/${proj_id}/ledger .discounted_base_cents == 855000"
            - "GET /projects/${proj_id}/ledger .rush_surcharge_cents == 171000"
            - "GET /projects/${proj_id}/ledger .billing_total_cents == 1026000"
            - "Project.${proj_id}.billing_total_cents == 1026000"
            - "Project.${proj_id}.billing_total_cents != 993600"

  - rule_id: non_linear_state_machine
    instances:

      - name: qc_reject_remediate_resubmit_pass_cycle_with_append_only_reports
        grounds:
          - state_machines.Deliverable.QC_SUBMITTED_to_QC_REJECTED
          - state_machines.Deliverable.QC_REJECTED_to_REMEDIATION
          - state_machines.Deliverable.QC_SUBMITTED_to_QC_PASSED
          - entities.Deliverable.fields.remediation_round
          - entities.QcReport
          - calculations.loudness_qc_verdict
          - validations[priority=23]
        distinguishing_aspect: |
          The deliverable leaves QC_SUBMITTED to QC_REJECTED, cycles back through REMEDIATION into
          a SECOND QC_SUBMITTED and only then reaches QC_PASSED; the cycle bumps remediation_round
          0 -> 1, clears qc_rejection_codes on re-entry and leaves exactly two append-only
          QcReports (round 0 REJECTED, round 1 PASSED) whose measurements differ.
        test_recipe:
          setup:
            - "THEATRICAL spec: target_lufs -24.00, tolerance_lu 0.50, true_peak_max_dbtp -2.00, 5_1, max_remediation_rounds 2."
            - "Locked project with one CONFORMED stem package and one COMPLETED FINAL_MIX booking."
            - "Deliverable prepared by sup-1; QC submitted by qc-1 and evaluated by qc-2 (segregation of duties)."
            - "Round 0 measurement -25.00 LUFS -> deviation 1.00 LU > tolerance -> rejected."
            - "Round 1 measurement -24.20 LUFS -> deviation 0.20 LU <= tolerance -> passed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /platform-specs"
              payload: { platform: "THEATRICAL", spec_label: "Theatrical Print Master", target_lufs: -24.00, tolerance_lu: 0.50, true_peak_max_dbtp: -2.00, channel_layout: "5_1", requires_me_stems: false, max_remediation_rounds: 2 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { spec_id: $.data.id }
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_C", display_name: "Stage C", hourly_rate_cents: 120000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
