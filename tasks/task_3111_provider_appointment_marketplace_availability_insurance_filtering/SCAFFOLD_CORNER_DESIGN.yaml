# =============================================================================
# §1.9 Scaffold Corner Design — Provider Appointment Marketplace
# Breadth coverage of §1.1-§1.7 claims not already probed by §1.8.
# Logical clock default: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: practice_create_applies_defaults
        claim_type: defaults
        grounds:
          - entities.Practice.fields.billing_mode
          - entities.Practice.fields.new_patient_lead_time_hours
          - entities.Practice.fields.status
        distinguishing_aspect: "Omitting optional fields yields billing_mode PER_BOOKING, leads 24/4, subscription_fee_cents 30000, status DRAFT, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id, bm: $.data.billing_mode, st: $.data.status, v: $.data.version, npl: $.data.new_patient_lead_time_hours, epl: $.data.existing_patient_lead_time_hours, sub: $.data.subscription_fee_cents }
          trigger:
            - call: "GET /marketplace/practices/${p_id}"
              payload: {}
              as: Any
          assert:
            - "bm == PER_BOOKING and st == DRAFT and v == 1"
            - "npl == 24 and epl == 4 and sub == 30000"

      - name: practice_create_missing_required_name_returns_400
        claim_type: required_fields
        grounds:
          - entities.Practice.fields.name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Missing required name on create is a schema error (priority 3) returning ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /marketplace/practices"
              payload: { timezone: "America/New_York" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: practice_create_invalid_enum_billing_mode_rejected
        claim_type: type_constraints
        grounds:
          - entities.Practice.fields.billing_mode
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "billing_mode outside {PER_BOOKING, SUBSCRIPTION} is rejected as ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York", billing_mode: "GOLD" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: practice_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_PRACTICE_NOT_FOUND]
        distinguishing_aspect: "GET on a nonexistent practice id returns ERR_PRACTICE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /marketplace/practices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRACTICE_NOT_FOUND with http 404"

      - name: provider_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Provider
        distinguishing_aspect: "Client-supplied id/version on create are ignored; the server mints its own id and version 1 with status PENDING."
        test_recipe:
          setup: ["practice exists (DRAFT)"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /marketplace/providers"
              payload: { id: "11111111-1111-1111-1111-111111111111", version: 99, practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id, v: $.data.version, st: $.data.status }
          assert:
            - "prov_id != 11111111-1111-1111-1111-111111111111 (server-minted)"
            - "v == 1 and st == PENDING"

      - name: provider_bookable_in_directory_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Provider.fields.bookable_in_directory
        distinguishing_aspect: "bookable_in_directory is derived (provider ACTIVE and practice ACTIVE); a client-supplied value on create is ignored and the derived value tracks state changes."
        test_recipe:
          setup: ["ACTIVE practice with one provider"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM", bookable_in_directory: true }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id, bk0: $.data.bookable_in_directory }
          trigger:
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { bk1: $.data.bookable_in_directory }
            - call: "POST /marketplace/practices/${p_id}/suspend"
              payload: {}
              as: OpsAdmin
            - call: "GET /marketplace/providers/${prov_id}"
              payload: {}
              as: Any
              captures: { bk2: $.data.bookable_in_directory }
          assert:
            - "bk0 == false (input ignored; provider PENDING)"
            - "bk1 == true after activation"
            - "bk2 == false after the practice is suspended (derived reconciliation on practice transition)"

      - name: slot_create_with_wrong_path_provider_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Slot.fields.provider_id
          - errors[ERR_PROVIDER_NOT_FOUND]
        distinguishing_aspect: "Slot creation under a nonexistent provider id returns ERR_PROVIDER_NOT_FOUND before any slot logic runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /marketplace/providers/00000000-0000-0000-0000-000000000000/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROVIDER_NOT_FOUND with http 404"

      - name: providers_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more with default limit 10; a filtered query narrows total_count deterministically."
        test_recipe:
          setup: ["ACTIVE practice with two ACTIVE providers of different specialties"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { provA: $.data.id }
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr B", specialty: "CARD" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { provB: $.data.id }
            - call: "POST /marketplace/providers/${provA}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${provB}/activate"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "GET /marketplace/providers?specialty=DERM&limit=10&offset=0"
              payload: {}
              as: Any
              captures: { first_id: "$.data[0].id" }
          assert:
            - "Response meta carries pagination fields limit, offset, total_count, has_more"
            - "total_count == 1 and has_more == false for specialty=DERM"
            - "Unfiltered GET /marketplace/providers returns total_count 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: provider_initial_state_pending
        claim_type: initial_state
        grounds:
          - state_machines.Provider
        distinguishing_aspect: "A freshly created provider starts PENDING and cannot publish slots until activated."
        test_recipe:
          setup: ["ACTIVE practice with one PENDING provider"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id, st: $.data.status }
          trigger:
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "st == PENDING at creation"
            - "err == ERR_PROVIDER_NOT_BOOKABLE when a PENDING provider tries to publish a slot"

      - name: practice_activate_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Practice
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating an already-ACTIVE practice is an invalid transition returning ERR_INVALID_STATE."
        test_recipe:
          setup: ["practice created and activated"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: practice_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Practice.ACTIVE_to_SUSPENDED
          - state_machines.Practice.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "The Practice suspension cycle ACTIVE -> SUSPENDED -> ACTIVE is traversable in both directions."
        test_recipe:
          setup: ["ACTIVE practice"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /marketplace/practices/${p_id}/suspend"
              payload: {}
              as: OpsAdmin
              captures: { st1: $.data.status }
            - call: "POST /marketplace/practices/${p_id}/reinstate"
              payload: {}
              as: OpsAdmin
              captures: { st2: $.data.status }
          assert:
            - "st1 == SUSPENDED and st2 == ACTIVE"

      - name: provider_delist_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Provider
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DELISTED is terminal: reinstate on a DELISTED provider returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE practice, provider activated then delisted"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/delist"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /marketplace/providers/${prov_id}/reinstate"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: provider_activate_blocked_when_practice_suspended
        claim_type: guarded_transition
        grounds:
          - state_machines.Provider.PENDING_to_ACTIVE
          - errors[ERR_PRACTICE_NOT_ACTIVE]
        distinguishing_aspect: "Cross-entity guard: provider activation requires the owning practice ACTIVE; a SUSPENDED practice blocks it with ERR_PRACTICE_NOT_ACTIVE."
        test_recipe:
          setup: ["practice created, activated, provider created, then practice suspended"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/suspend"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRACTICE_NOT_ACTIVE and provider remains PENDING"

      - name: attestation_verify_reject_terminal
        claim_type: valid_transition
        grounds:
          - state_machines.Attestation.ATTESTED_to_REJECTED
        distinguishing_aspect: "verify with decision REJECT moves ATTESTED -> REJECTED (terminal); a later VERIFY attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE practice+provider, ACTIVE plan, one ATTESTED attestation"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/insurance-plans"
              payload: { carrier: "Aetna", plan_name: "A1", plan_code: "A1" }
              as: OpsAdmin
              captures: { plan1: $.data.id }
            - call: "POST /marketplace/attestations"
              payload: { provider_id: "${prov_id}", plan_id: "${plan1}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att1: $.data.id }
          trigger:
            - call: "POST /marketplace/attestations/${att1}/verify"
              payload: { decision: "REJECT" }
              as: OpsAdmin
              captures: { st: $.data.status }
            - call: "POST /marketplace/attestations/${att1}/verify"
              payload: { decision: "VERIFY" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "st == REJECTED"
            - "err == ERR_INVALID_STATE (REJECTED is terminal)"

      - name: attestation_verify_blocked_when_plan_retired
        claim_type: guarded_transition
        grounds:
          - state_machines.Attestation.ATTESTED_to_VERIFIED
          - errors[ERR_PLAN_NOT_ACTIVE]
        distinguishing_aspect: "Verification requires the plan ACTIVE; a RETIRED plan blocks it with ERR_PLAN_NOT_ACTIVE."
        test_recipe:
          setup: ["ACTIVE practice+provider, plan created then retired, attestation ATTESTED on that plan"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/insurance-plans"
              payload: { carrier: "Aetna", plan_name: "A1", plan_code: "A1" }
              as: OpsAdmin
              captures: { plan1: $.data.id }
            - call: "POST /marketplace/attestations"
              payload: { provider_id: "${prov_id}", plan_id: "${plan1}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att1: $.data.id }
            - call: "POST /marketplace/insurance-plans/${plan1}/retire"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /marketplace/attestations/${att1}/verify"
              payload: { decision: "VERIFY" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PLAN_NOT_ACTIVE and attestation remains ATTESTED"

      - name: complaint_respond_from_under_review_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Complaint
          - errors[ERR_COMPLAINT_NOT_OPEN]
        distinguishing_aspect: "respond requires OPEN; responding twice returns ERR_COMPLAINT_NOT_OPEN."
        test_recipe:
          setup: ["booking exists; complaint filed and responded once (UNDER_REVIEW)"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: Anonymous
              captures: { pat_id: $.data.id }
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b1: $.data.id }
            - call: "POST /marketplace/complaints"
              payload: { booking_id: "${b1}", complaint_type: "DIRECTORY_INACCURACY" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { c1: $.data.id }
            - call: "POST /marketplace/complaints/${c1}/respond"
              payload: { response: "looking into it" }
              as: PracticeStaff
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /marketplace/complaints/${c1}/respond"
              payload: { response: "again" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMPLAINT_NOT_OPEN"

      - name: no_show_too_early_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking.CONFIRMED_to_NO_SHOW
          - errors[ERR_NO_SHOW_TOO_EARLY]
        distinguishing_aspect: "mark-no-show before the slot start is rejected with ERR_NO_SHOW_TOO_EARLY and the booking stays CONFIRMED."
        test_recipe:
          setup: ["CONFIRMED booking on a slot starting 2026-09-03T10:00; clock still at default 2026-09-01"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: Anonymous
              captures: { pat_id: $.data.id }
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /marketplace/bookings/${b1}/mark-no-show"
              payload: {}
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_SHOW_TOO_EARLY and Booking.${b1}.status remains CONFIRMED"

      - name: audit_close_with_unresolved_findings_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AuditCase.FINDINGS_OPEN_to_CLOSED
          - errors[ERR_UNRESOLVED_FINDINGS]
        distinguishing_aspect: "Closing an audit case with unresolved findings fails with ERR_UNRESOLVED_FINDINGS; after resolve-finding the close succeeds."
        test_recipe:
          setup: ["provider with one stale OPEN slot; audit case created and run (FINDINGS_OPEN with 1 unresolved finding)"]
          setup_api_calls:
