              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec1_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec1_id}"
              as: PlatformAdmin
              captures: { rec1_v: $.data.version }
            - call: "POST /recipients/${rec1_id}/consents"
              payload: { consumer_ref: "cons_ae", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec1_v}" }
              as: Consumer
              as_user_id: cons_ae
              captures: { consent_id: $.data.id }
            - call: "POST /consents/${consent_id}/deletion_requests"
              payload: {}
              as: Consumer
