            - "no further action on application ${app_id} succeeds: POST /marketplace/applications/${app_id}/review returns ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:

      - name: match_score_rule_covered
        claim_type: Correct Result
        grounds:
          - calculations.match_score_rule
        excluded_because:
          difficulty_instance: combinatorial_formula / match_score_multi_input_nonlinear
          rationale: "Score arithmetic, cap saturation and ranking are asserted with literal values in the named §1.8 instance."

      - name: placement_fee_rule_variants_covered
        claim_type: Variant Divergence
        grounds:
          - calculations.placement_fee_rule
        excluded_because:
          difficulty_instance: dual_variant_calc / placement_fee_provisional_vs_guarantee_refund
          rationale: "PROVISIONAL vs GUARANTEE_REFUND amounts and invoice transitions are asserted in the named §1.8 instance."

      - name: subscription_tier_flat_fee_invariant_to_rate
        claim_type: Variant Selection
        grounds:
          - calculations.placement_fee_rule
          - entities.Employer.fields.fee_model
        distinguishing_aspect: "The SUBSCRIPTION variant is selected by fee_model, not by rate: a BASIC employer pays a flat 2500000-cent invoice whether the accepted offer is 8500 or 9000 cents/hr — the variant gate, not the bps math, decides the amount."
        test_recipe:
          setup:
            - "SUBSCRIPTION/BASIC employer (guarantee 90 days); full pipeline to an ISSUED offer at 9000 cents/hr, start 2026-09-15."
          setup_api_calls:
            - *k_clock
            - call: "POST /marketplace/employers"
              payload: { legal_name: "Sub Hospital", facility_state: "CA", fee_model: "SUBSCRIPTION", subscription_tier: "BASIC", sla_response_hours: 48, guarantee_days: 90, placement_fee_bps: 1500 }
              as: PlatformAdmin
              captures: { emp_sub: $.data.id }
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp_sub}", specialty: "ICU", unit_name: "ICU-1", required_certs: [], facility_state: "CA", distance_from_facility_miles: 20, shift: "DAY", offered_hourly_rate_cents: 8800, openings_total: 1 }
              as: Employer
              as_user_id: "${emp_sub}"
              captures: { req_sub: $.data.id, req_sub_v: $.data.version }
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req_sub}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 9000, proposed_shift: "DAY", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp_sub}"
              captures: { app_sub: $.data.id }
            - call: "POST /marketplace/applications/${app_sub}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
            - call: "POST /marketplace/applications/${app_sub}/interviews"
              payload: { starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T11:00:00Z" }
              as: Employer
              as_user_id: "${emp_sub}"
              captures: { iv_sub: $.data.id }
            - *k_clock_iv
            - call: "POST /marketplace/interviews/${iv_sub}/complete"
              payload: {}
              as: Employer
              as_user_id: "${emp_sub}"
            - call: "POST /marketplace/screenings"
              payload: { application_id: "${app_sub}" }
              as: Employer
              as_user_id: "${emp_sub}"
              captures: { scr_sub: $.data.id }
            - call: "POST /marketplace/screenings/${scr_sub}/verify-credentials"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/screenings/${scr_sub}/clear-background"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/onboarding-documents"
              payload: { application_id: "${app_sub}", doc_type: "SIGNED_CONTRACT" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { doc_sub: $.data.id }
            - call: "POST /marketplace/onboarding-documents/${doc_sub}/approve"
              payload: {}
              as: Employer
              as_user_id: "${emp_sub}"
            - call: "POST /marketplace/applications/${app_sub}/offers"
              payload: { offered_hourly_rate_cents: 9000, start_date: "2026-09-15", expected_requisition_version: "${req_sub_v}" }
              as: Employer
              as_user_id: "${emp_sub}"
              captures: { offer_sub: $.data.id }
          trigger:
            - call: "POST /marketplace/offers/${offer_sub}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { placement_sub: $.data.id }
            - call: "GET /marketplace/invoices"
              payload: { placement_id: "${placement_sub}" }
              as: Employer
              as_user_id: "${emp_sub}"
              captures: { inv_sub: "$.data[0].id" }
          assert:
            - "Invoice.${inv_sub}.invoice_kind == PLACEMENT_FEE and amount_due_cents == 2500000 (BASIC flat tier)"
            - "Placement.${placement_sub}.annualized_salary_cents == 18720000 (9000*2080) yet the fee is NOT bps-derived — variant selected by fee_model SUBSCRIPTION"

      - name: response_deadline_rule_covered
        claim_type: Constants Applied
        grounds:
          - calculations.response_deadline_rule
        excluded_because:
          difficulty_instance: boundary_precision_check / response_deadline_exact_equality_expires
          rationale: "The 72h constant and the >= boundary are exercised at T-1ms and T in the named §1.8 instance; the 48h single extension is covered by application_counter_cycle_with_single_deadline_extension."

      - name: interview_overlap_rule_covered
        claim_type: Input Set Filtering
        grounds:
          - calculations.interview_overlap_rule
        excluded_because:
          difficulty_instance: resource_temporal_overlap / nurse_interview_buffered_half_open_overlap
          rationale: "Buffered half-open overlap is exercised at the exact buffer boundary in the named §1.8 instance."

      - name: sla_report_counts_breach_at_strict_greater_than_threshold
        claim_type: Correct Result
        grounds:
          - calculations.employer_sla_breach_rule
          - endpoints.GET_/marketplace/requisitions/{id}/sla-report
          - errors.ERR_TERMS_MISMATCH
        distinguishing_aspect: "First employer action 50h after application creation breaches sla_response_hours 48 (strict >), and the counter-supplied 9000-cent rate makes the subsequent offer issuance fail ERR_TERMS_MISMATCH, leaving rapid_offer_target_met false — the report reflects exactly one evaluated application with breach_count 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer sla_response_hours 48. Application created 2026-09-01T00:00:00Z, reviewed; clock advanced to 2026-09-03T02:00:00Z (50h); employer counters to 9000 cents (first action at t+50h, one revision); interview scheduled and completed; screening COMPLETE; SIGNED_CONTRACT APPROVED; offer issuance attempted at 8500."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/applications/${app_id}/counter"
              payload: { proposed_hourly_rate_cents: 9000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/applications/${app_id}/interviews"
              payload: { starts_at: "2026-09-03T10:00:00Z", ends_at: "2026-09-03T11:00:00Z" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { iv_sla: $.data.id }
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/interviews/${iv_sla}/complete"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/screenings"
              payload: { application_id: "${app_id}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { scr_sla: $.data.id }
            - call: "POST /marketplace/screenings/${scr_sla}/verify-credentials"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/screenings/${scr_sla}/clear-background"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/onboarding-documents"
              payload: { application_id: "${app_id}", doc_type: "SIGNED_CONTRACT" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { doc_sla: $.data.id }
            - call: "POST /marketplace/onboarding-documents/${doc_sla}/approve"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /marketplace/requisitions/${req_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { req_v_sla: $.data.version }
          trigger:
            - call: "POST /marketplace/applications/${app_id}/offers"
              payload: { offered_hourly_rate_cents: 8500, start_date: "2026-09-20", expected_requisition_version: "${req_v_sla}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_sla: $.data.error_id }
            - call: "GET /marketplace/requisitions/${req_id}/sla-report"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "err_sla == ERR_TERMS_MISMATCH (offer rate 8500 != current application rate 9000 after the counter)"
            - "sla-report: evaluated_count == 1 and breach_count == 1 (50h > 48h sla)"
            - "sla-report: rapid_offer_target_met == false (no offer was ever issued)"
            - "the counter's first action at t+50h is the measured employer_first_action_hours — had it been at exactly t+48h the breach would NOT count (strict >)"

      - name: shift_window_overlap_rule_covered_via_match_scoring
        claim_type: Constants Applied
        grounds:
          - calculations.shift_window_overlap_rule
        excluded_because:
          difficulty_instance: combinatorial_formula / match_score_multi_input_nonlinear
          rationale: "The DAY/NIGHT partial-credit semantics the rule pins are observable only through match_score_rule's shift term, exercised in the named §1.8 instance; no endpoint consumes the shift windows directly."

      - name: openings_conservation_rule_covered
        claim_type: Input Set Filtering
        grounds:
          - calculations.openings_conservation_rule
        excluded_because:
          difficulty_instance: compensating_invariant / openings_conserved_through_fill_and_guarantee_termination
          rationale: "The invariant (openings_filled == count of non-terminated placements) is asserted after both forward and compensating actions in the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: unauthenticated_request_missing_role_header
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role/existence check — priority 1 fires first."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /marketplace/nurses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { err_auth: $.data.error_id }
          assert:
            - "err_auth == ERR_UNAUTHENTICATED"
            - "the response status is 401 (not 404 — auth precedes existence)"

      - name: role_not_permitted_for_endpoint
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "A Candidate calling the employer-only requisition creation endpoint is rejected 403 ERR_FORBIDDEN even with a well-formed body."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one nurse exists."
          setup_api_calls:
            - *k_clock
            - *k_nurse
          trigger:
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "00000000-0000-4000-8000-000000000000", specialty: "ICU", unit_name: "X", required_certs: [], facility_state: "CA", distance_from_facility_miles: 10, shift: "DAY", offered_hourly_rate_cents: 8000, openings_total: 1 }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { err_role: $.data.error_id }
          assert:
            - "err_role == ERR_FORBIDDEN"
            - "the response status is 403 (role check precedes the existence check on employer_id)"

      - name: candidate_cannot_act_on_another_nurses_application
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Ownership scoping: Candidate with X-User-ID of nurse B attempting to review nurse A's application is rejected ERR_FORBIDDEN — the role is right, the owner is wrong."
        test_recipe:
          setup:
            - "Two ACTIVE nurses A and B; an application names nurse A."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - call: "POST /marketplace/nurses"
              payload: { full_name: "B Other", email: "bother@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 4, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-bother"
              captures: { nurse_b_id: $.data.id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_b_id}", license_number: "RN-CA-700", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_b_id}"
              captures: { lic_b: $.data.id }
            - call: "POST /marketplace/nurses/${nurse_b_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_b_id}"
            - call: "POST /marketplace/license-verifications/${lic_b}/verify"
              payload: {}
              as: PlatformAdmin
            - *k_req
            - *k_app
          trigger:
            - call: "POST /marketplace/applications/${app_id}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_b_id}"
              captures: { err_own: $.data.error_id }
          assert:
            - "err_own == ERR_FORBIDDEN"
            - "Application.${app_id}.status remains SUBMITTED"

      - name: state_priority_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_closed_requisition_accept
          rationale: "Priority-4 state beating priority-10 fiscal is the named §1.8 instance's core assertion."

      - name: temporal_priority_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_beats_referential_on_late_interview
          rationale: "Priority-5 temporal beating priority-7 referential is the named §1.8 instance's core assertion."

      - name: application_on_confidential_employer_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors.ERR_CANDIDATE_CONFIDENTIAL
        distinguishing_aspect: "An employer listed in the nurse's confidentiality_exclusions gets ERR_CANDIDATE_CONFIDENTIAL (403) when creating an application for that nurse — distinct from the 404 read-cloak: creation is a hard error."
        test_recipe:
          setup:
            - "Employer E2's legal_name equals the nurse's current_employer_name (auto-excluded at activation); E2 has an OPEN requisition."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - call: "POST /marketplace/employers"
              payload: { legal_name: "Shady Pines", facility_state: "CA", fee_model: "SUBSCRIPTION", subscription_tier: "PRO", sla_response_hours: 48, guarantee_days: 90, placement_fee_bps: 1500 }
              as: PlatformAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Shy Three", email: "shy3@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 5, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "Shady Pines" }
              as: Candidate
              as_user_id: "seed-shy3"
              captures: { shy3_id: $.data.id, shy3_v: $.data.version }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${shy3_id}", license_number: "RN-CA-802", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${shy3_id}"
              captures: { lic_shy3: $.data.id }
            - call: "POST /marketplace/nurses/${shy3_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${shy3_id}"
            - call: "POST /marketplace/license-verifications/${lic_shy3}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp2_id}", specialty: "ICU", unit_name: "ICU-South", required_certs: [], facility_state: "CA", distance_from_facility_miles: 20, shift: "DAY", offered_hourly_rate_cents: 8000, openings_total: 1 }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { req2_id: $.data.id }
          trigger:
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req2_id}", nurse_id: "${shy3_id}", proposed_hourly_rate_cents: 8500, proposed_shift: "DAY", expected_nurse_version: "${shy3_v}" }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { err_conf: $.data.error_id }
          assert:
            - "err_conf == ERR_CANDIDATE_CONFIDENTIAL with http 403"
            - "no Application row exists naming nurse ${shy3_id} (GET /marketplace/nurses/${shy3_id}/applications returns 0 rows)"

      - name: application_requires_active_license_verified_nurse
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors.ERR_CREDENTIALS_INCOMPLETE
        distinguishing_aspect: "Applying to a nurse still in PENDING_VERIFICATION (license_verified false) is rejected ERR_CREDENTIALS_INCOMPLETE — the referential credential gate fires regardless of how attractive the terms are."
        test_recipe:
          setup:
            - "Nurse in PENDING_VERIFICATION (license PENDING); OPEN requisition."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_req
          trigger:
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 9000, proposed_shift: "DAY", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_cred: $.data.error_id }
          assert:
            - "err_cred == ERR_CREDENTIALS_INCOMPLETE"
            - "GET /marketplace/nurses/${nurse_id}/applications returns 0 rows"

      - name: terms_mismatch_shift_and_rate_floor
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_TERMS_MISMATCH
        distinguishing_aspect: "Two independent terms violations on application creation: proposed_shift NIGHT against a DAY requisition fails, and proposed rate 7999 (one cent below the requisition's 8000 floor) fails — both ERR_TERMS_MISMATCH."
        test_recipe:
          setup:
            - "ACTIVE nurse; OPEN DAY requisition with offered rate 8000."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
          trigger:
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8500, proposed_shift: "NIGHT", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_shift: $.data.error_id }
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 7999, proposed_shift: "DAY", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_rate: $.data.error_id }
          assert:
            - "err_shift == ERR_TERMS_MISMATCH and err_rate == ERR_TERMS_MISMATCH"
            - "exactly 0 applications exist after both attempts"

