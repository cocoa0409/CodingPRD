            - call: "POST /case-assignments/${asg_lead_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "POST /declarations"
              payload: { matter_id: "${m_id}", preparer_assignment_id: "${asg_lead_id}", language_code: "en", word_count: 800 }
              as: ProgramDirector
              captures: { dec_id: "$.data.id" }
            - call: "POST /declarations/${dec_id}/transition"
              payload: { action: "SUBMIT_FOR_REVIEW", word_count: 800 }
              as: CaseRepresentative
              as_user_id: "${arep_id}"
            - call: "POST /calendar-events"
              payload: { matter_id: "${m_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-08T14:00:00.000Z", ends_at_utc: "2026-09-08T15:00:00.000Z", location_code: "USCISPHX", assigned_representative_id: "${atty_a_id}" }
              as: ProgramDirector
              captures: { ce_near_id: "$.data.id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${m_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-11-20T14:00:00.000Z", ends_at_utc: "2026-11-20T15:00:00.000Z", location_code: "USCISPHX", assigned_representative_id: "${atty_a_id}" }
              as: ProgramDirector
              captures: { ce_far_id: "$.data.id" }
          trigger:
            - call: "POST /organization-recognitions/${rec_id}/transition"
              payload: { action: "LAPSE" }
              as: ProgramDirector
          assert:
            - "Before the trigger: CaseMatter ${m_id}.representation_status == 'SUPERVISED_STAFFED', CaseAssignment ${asg_lead_id}.supervision_source == 'AUTO_SELECTED' and supervision_link_id == ${asg_sup_id}, Representative ${arep_id}.active_case_load == 1, Representative ${atty_a_id}.supervisee_count == 1."
            - "step 1 returns HTTP 200 (exactly one request produces every hop below)."
            - "hop 0: OrganizationRecognition ${rec_id}.status == 'LAPSED', lapsed_at_utc == '2026-09-01T00:00:00.000Z', conditional_reason_code == null, suspended_accreditation_count == 1."
            - "hop 1: Accreditation ${acc_id}.status == 'SUSPENDED_BY_RECOGNITION' and decision_reason_code == 'RECOGNITION_LAPSE'."
            - "hop 2: Representative ${arep_id}.authorization_status == 'AUTHORIZATION_SUSPENDED'; CaseAssignment ${asg_lead_id}.status == 'SUSPENDED' with release_reason_code == 'RECOGNITION_LAPSE'; Representative ${arep_id}.active_case_load == 0 and Representative ${atty_a_id}.supervisee_count == 0."
            - "hop 3: CaseMatter ${m_id}.representation_status == 'COVERAGE_GAP' and coverage_gap_flag == true, while filing_status is untouched at 'PRE_FILING'."
            - "hop 4: Declaration ${dec_id}.status == 'REVISION_REQUESTED', revision_round == 1, revision_reason_code == 'SUPERVISION_REQUIRED'."
            - "hop 4: CalendarEvent ${ce_near_id}.coverage_gap_flag == true (2026-09-08 is 7 days out) and CalendarEvent ${ce_far_id}.coverage_gap_flag == false (2026-11-20 is 80 days out)."
            - "Negative reach: CaseAssignment ${asg_sup_id}.status == 'ACTIVE' and Representative ${atty_a_id}.authorization_status == 'AUTHORIZED_ATTORNEY' - the STAFF_ATTORNEY on the same matter is not swept up, because hop 2 keys on the re-derived authorization_status, not on the matter."

      - name: accepted_intake_withdrawal_depth4_releases_slot_and_promotes_waitlist_head
        grounds:
          - state_machines.IntakeScreening.ACCEPTED_to_WITHDRAWN
          - state_machines.IntakeScreening.WAITLISTED_to_ACCEPTED
          - state_machines.CaseAssignment.ACTIVE_to_RELEASED
          - calculations.cycle_capacity_posture
          - calculations.capacity_slot_waterfall
          - calculations.invariant_capacity_slot_conservation
          - entities.ProgramCapacityCycle.fields.waitlisted_count
        distinguishing_aspect: |
          Withdrawing ONE accepted intake on a cycle sitting at 4/4 (utilization 1.0000,
          FROZEN) must run hop 1 matter -> WITHDRAWN_FROM/CLOSED_NO_FILING/outcome WITHDRAWN,
          hop 2 its ACTIVE LEAD -> RELEASED with CLIENT_WITHDREW (active_case_load 1 -> 0),
          hop 3 general_slots_consumed 4 -> 3 with utilization 0.7500 and posture OPEN, and
          hop 4 - caused by hop 3, not by the request - promotion of the waitlist head, which
          re-consumes the freed slot and puts the cycle straight back to 4/4 FROZEN while the
          second waitlisted row is re-ranked from 2 to 1; an implementation that stops at
          hop 3 leaves available_slot_count == 1 with waitlisted_count == 2, and one that
          promotes both rows overflows the pool.
