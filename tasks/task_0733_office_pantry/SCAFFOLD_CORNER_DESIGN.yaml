      - name: version_increments_on_every_mutation
        claim_type: occ_version_bump
        grounds:
          - entities.Client.fields.version
        distinguishing_aspect: "Client.version starts at 1 on POST /clients and increments by exactly 1 per PATCH /clients/{id}/headcount."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "V", headcount: 5 }
