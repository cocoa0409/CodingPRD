# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index) — task_0428
# Enumerates testable claims from §1.1-§1.7 NOT already covered by §1.8.
# excluded_because: stubs point at the §1.8 instance that already covers a corner.
# Same seven-point per-instance contract as §1.8; same §1.5 reachability gates.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_order_returns_201_with_computed_escrow_zero
        claim_type: Creation
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "POST /title/orders with all required fields returns 201; escrow_balance_cents/escrow_deposit_total_cents/escrow_disbursed_total_cents all 0, gap_open false, status OPENED, version 1."
        test_recipe:
          setup: ["An agency exists."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C1", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.status == OPENED"
            - "Order.${o_id}.escrow_balance_cents == 0"
            - "Order.${o_id}.gap_open == false"
            - "Order.${o_id}.version == 1"

      - name: get_order_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "GET /title/orders/{orderId} returns the stored order with matching id and parcel_id."
        test_recipe:
          setup: ["An agency and an order exist."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C2", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /title/orders/${o_id}"
              as: Underwriter
              captures: { got_id: $.data.id }
          assert:
            - "Order.${o_id} GET returns id == ${o_id} and parcel_id == APN-C2"

      - name: list_orders_paginated_envelope
        claim_type: Listing
        grounds: [entities.Order, endpoints, response_envelope]
        distinguishing_aspect: "GET /title/orders returns an array envelope with pagination fields limit/offset/total_count/has_more and response_type array."
        test_recipe:
          setup: ["An agency with one order exists."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C3", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /title/orders"
              payload: { agency_id: "${ag_id}", limit: 10, offset: 0 }
              as: Underwriter
          assert:
            - "response_type == array; meta.total_count >= 1; has_more present"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Order, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /title/orders/{orderId} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No order with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /title/orders/00000000-0000-4000-8000-000000000000"
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, http 404"

      - name: create_order_missing_transaction_type_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Order.fields.transaction_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /title/orders omitting required transaction_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An agency exists."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C4", county: "King", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 422"

      - name: create_exception_default_curative_required_false
        claim_type: Defaults
        grounds: [entities.Exception.fields.curative_required]
        distinguishing_aspect: "POST exception omitting curative_required defaults it to false (exception is then WAIVE-able)."
        test_recipe:
          setup: ["An order with a DRAFT commitment exists."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C5", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /title/commitments/${c_id}/exceptions"
              payload: { exception_type: "STANDARD", description: "Pre-printed survey exception" }
              as: TitleOfficer
              captures: { ex_id: $.data.id }
          assert:
            - "Exception.${ex_id}.curative_required == false"
            - "Exception.${ex_id}.status == RAISED"

      - name: policy_gross_premium_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Policy.fields.gross_premium_cents, calculations.owner_premium]
        distinguishing_aspect: "gross_premium_cents is computed at ISSUE from coverage; any client-supplied value is ignored (issue endpoint takes no premium input). Owner coverage 100000_00 -> 50000."
        test_recipe:
          setup: ["An ISSUED commitment insured 100000_00 with a PENDING OWNER policy coverage 100000_00."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C6", county: "King", transaction_type: "PURCHASE", sales_price_cents: 10000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 10000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 10000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { prem: $.data.gross_premium_cents }
          assert:
            - "Policy.${p_id}.gross_premium_cents == 50000"

      - name: plant_record_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TitlePlantRecord]
        distinguishing_aspect: "TitlePlantRecord has common_fields:false: it carries id+created_at only, no version, and has no update/transition endpoint."
        test_recipe:
          setup: ["A plant record exists."]
          setup_api_calls:
            - call: "POST /title/plant-records"
              payload: { parcel_id: "APN-C7", county: "King", instrument_type: "DEED", recorded_date: "2020-01-01T00:00:00Z", sequence_no: 1, grantor: "A", grantee: "B" }
              as: TitleOfficer
              captures: { pr_id: $.data.id }
          trigger:
            - call: "GET /title/plant-records/${pr_id}"
              as: TitleOfficer
              captures: { got: $.data.id }
          assert:
            - "TitlePlantRecord.${pr_id} GET returns id and created_at but no version field"

      - name: lender_premium_standalone_computed
        claim_type: Computed Fields
        grounds: [entities.Policy.fields.policy_type, calculations.lender_premium]
        distinguishing_aspect: "A standalone LENDER policy (co_issued_with_owner=false) coverage 200000_00 computes gross_premium_cents 90000 from the same tiered base (no reissue, no co-issue flat)."
        test_recipe:
          setup: ["An ISSUED commitment insured 200000_00 with a PENDING LENDER policy coverage 200000_00, co_issued_with_owner=false."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C8", county: "King", transaction_type: "REFINANCE", sales_price_cents: 0, loan_amount_cents: 20000000 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 20000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "LENDER", coverage_amount_cents: 20000000, co_issued_with_owner: false }
              as: Underwriter
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { prem: $.data.gross_premium_cents }
          assert:
            - "Policy.${p_id}.gross_premium_cents == 90000"

      - name: lender_premium_co-issue_flat_rate
        claim_type: Computed Fields
        grounds: [entities.Policy.fields.co_issued_with_owner, calculations.lender_premium]
        distinguishing_aspect: "A LENDER policy with co_issued_with_owner=true is charged the flat CO_ISSUE_FLAT_CENTS (2500) regardless of coverage (200000_00 would otherwise be 90000)."
        test_recipe:
          setup: ["An order with an ISSUED OWNER policy and an ISSUED commitment insured 200000_00; a PENDING LENDER policy coverage 200000_00 co_issued_with_owner=true."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C9", county: "King", transaction_type: "PURCHASE", sales_price_cents: 20000000, loan_amount_cents: 20000000 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 20000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 20000000 }
              as: Underwriter
              captures: { po_id: $.data.id }
            - call: "POST /title/policies/${po_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "LENDER", coverage_amount_cents: 20000000, co_issued_with_owner: true }
              as: Underwriter
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${pl_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { prem: $.data.gross_premium_cents }
          assert:
            - "Policy.${pl_id}.gross_premium_cents == 2500"

      - name: claim_reserve_capped_at_coverage
        claim_type: Computed Fields
        grounds: [entities.Claim.fields.reserve_cents, calculations.claim_reserve]
        distinguishing_aspect: "reserve_cents is capped at policy coverage: estimated_loss 200000 * 1.15 = 230000 but coverage is 110000_00... here coverage 100000_00; loaded 230000 < coverage 10000000 so reserve 230000 (no cap). Verifies the loading factor path."
        test_recipe:
          setup: ["An ISSUED OWNER policy coverage 100000_00 with a claim estimated_loss 200000 at FNOL."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C10", county: "King", transaction_type: "PURCHASE", sales_price_cents: 10000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 10000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 10000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/policies/${p_id}/claims"
              payload: { claim_type: "FORGERY", estimated_loss_cents: 200000 }
              as: Underwriter
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "INVESTIGATING" }
              as: Underwriter
              captures: { reserve: $.data.reserve_cents }
          assert:
            - "Claim.${cl_id}.reserve_cents == 230000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_titlesearch_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TitleSearch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED TitleSearch is terminal; CANCELLING it (no COMPLETED->CANCELLED transition) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED title search."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C11", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
            - call: "POST /title/orders/${o_id}/title-searches"
              payload: { searched_parcel_id: "APN-C11", effective_date: "2026-01-05T00:00:00Z" }
              as: TitleOfficer
              captures: { s_id: $.data.id }
            - call: "POST /title/title-searches/${s_id}/transitions"
              payload: { to_status: "IN_EXAM" }
              as: TitleOfficer
            - call: "POST /title/title-searches/${s_id}/transitions"
              payload: { to_status: "COMPLETED", chain_verified: true, gap_from_date: "2026-01-05T00:00:00Z", gap_to_date: "2026-01-20T00:00:00Z" }
              as: TitleOfficer
          trigger:
            - call: "POST /title/title-searches/${s_id}/transitions"
              payload: { to_status: "CANCELLED" }
              as: TitleOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "TitleSearch.${s_id}.status == COMPLETED"

      - name: void_policy_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Policy, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A VOID policy is terminal; re-issuing it (VOID->ISSUED, not a declared transition) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ISSUED OWNER policy then VOIDed."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C12", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "VOID" }
              as: Underwriter
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Policy.${p_id}.status == VOID"

      - name: exception_curative_pending_revert_to_raised
        claim_type: Valid Transition
        grounds: [state_machines.Exception.CURATIVE_PENDING_to_RAISED]
        distinguishing_aspect: "An exception moved RAISED->CURATIVE_PENDING can revert CURATIVE_PENDING->RAISED (curative failed); status returns to RAISED."
        test_recipe:
          setup: ["A commitment with one exception moved to CURATIVE_PENDING."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C13", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/exceptions"
              payload: { exception_type: "SPECIAL", description: "Lis pendens", curative_required: true }
              as: TitleOfficer
              captures: { ex_id: $.data.id }
            - call: "POST /title/exceptions/${ex_id}/transitions"
              payload: { to_status: "CURATIVE_PENDING" }
              as: TitleOfficer
          trigger:
            - call: "POST /title/exceptions/${ex_id}/transitions"
              payload: { to_status: "RAISED" }
              as: TitleOfficer
              captures: { st: $.data.status }
          assert:
            - "Exception.${ex_id}.status == RAISED"

      - name: exception_clear_without_resolved_curative_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Exception.CURATIVE_PENDING_to_CLEARED, "errors[ERR_NO_RESOLVED_CURATIVE]"]
        distinguishing_aspect: "Exception CURATIVE_PENDING->CLEARED with no RESOLVED CurativeAction on that exception returns ERR_NO_RESOLVED_CURATIVE."
        test_recipe:
          setup: ["A commitment with one exception in CURATIVE_PENDING and no curative action."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C14", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/exceptions"
