      - name: official_identities_must_be_registered_active_and_level_matched
        claim_type: identity_binding
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_OFFICIAL_NOT_REGISTERED
