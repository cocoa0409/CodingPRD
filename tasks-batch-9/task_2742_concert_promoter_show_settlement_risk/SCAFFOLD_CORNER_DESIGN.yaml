      - name: terminal_states_reject_every_further_trigger
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Offer.terminal_states"
          - "state_machines.Show.terminal_states"
          - "state_machines.TicketHold.terminal_states"
          - "state_machines.CancellationEvent.terminal_states"
          - "validations[priority=18]"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: |
          Four different machines are driven to four different terminal states — Offer WITHDRAWN and
          ACCEPTED, Show CANCELLED, TicketHold RELEASED, CancellationEvent CLAIM_DENIED — and then hit
          with eleven further triggers. Every one is ERR_ALREADY_TERMINAL 409 rather than
          ERR_INVALID_STATE, which is what makes priority 18 reachable at all: priority 17 is scoped to
          non-terminal states precisely so these two never compete on the same call.
