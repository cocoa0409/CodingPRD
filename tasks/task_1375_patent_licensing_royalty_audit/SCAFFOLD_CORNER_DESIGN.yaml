              captures: { ag_pool: $.data.undistributed_pool_cents }
          assert:
            - "captured err == ERR_RUN_INVALID_STATE"
            - "captured ag_pool == 0 (no double debit)"
      - name: sublicense_decision_on_terminal_state
        claim_type: violation_to_error
        grounds: ["state_machines.SublicenseGrant", "errors[ERR_SUBLICENSE_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: a later APPROVED decision on the same grant yields ERR_SUBLICENSE_INVALID_STATE."
