# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3452_correctional_communication_services_rate_compliance_account_funding
# Breadth probe over §1.1–§1.7. Claims already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: facility_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Facility
          - entities.Facility.fields.video_turnover_minutes
          - entities.Facility.fields.daily_session_limit_per_inmate
          - endpoints.POST_/comm-services/facilities
        distinguishing_aspect: "A facility created without video_turnover_minutes or daily_session_limit_per_inmate stores the entity defaults 10 and 2, starts ONBOARDING at version 1, and the response carries server-minted id / created_at / updated_at — a client-supplied status or version is not even in the input schema."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /comm-services/facilities"
              payload: { name: "Defaults Facility", state_code: "ST", video_booth_count: 3, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Facility.${fac_id}.video_turnover_minutes == 10 and daily_session_limit_per_inmate == 2 (defaults applied)"
            - "Facility.${fac_id}.status == ONBOARDING and version == 1"
            - "the response data carries non-null id, created_at and updated_at"

      - name: account_create_collect_without_credit_limit_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Account.fields.collect_credit_limit_cents
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "collect_credit_limit_cents is optional in the schema but conditionally mandatory: funding_model COLLECT without it is a 400 ERR_INVALID_REQUEST, while the same body with funding_model PREPAID succeeds and stores null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One facility with an inmate (created directly; facility status does not gate account creation)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities"
              payload: { name: "Collect Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-9001", full_name: "Inmate Collect" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
          trigger:
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "COLLECT", owner_name: "Fam Collect", owner_contact: "fc2@x.com" }
              as: FacilityStaff
              captures: { err: $.data.error_id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "COLLECT", owner_name: "Fam Collect", owner_contact: "fc2@x.com", collect_credit_limit_cents: 20000 }
              as: FacilityStaff
              captures: { acct_id: $.data.id }
          assert:
            - "the first request returns 400 and err == ERR_INVALID_REQUEST"
            - "the second request returns 201; Account.${acct_id}.collect_credit_limit_cents == 20000, status == ACTIVE, escheat_status == NONE, balance_cents == 0"
            - "GET /comm-services/accounts?inmate_id=${inm_id} returns exactly 1 row"

      - name: regulatory_cap_get_unknown_id_returns_cap_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/comm-services/regulatory-caps/{id}
          - errors.ERR_REGULATORY_CAP_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated id produces the entity-specific 404 ERR_REGULATORY_CAP_NOT_FOUND — not a generic error and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /comm-services/regulatory-caps/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_REGULATORY_CAP_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: recipient_create_attorney_auto_enters_privilege_requested
        claim_type: Defaults
        grounds:
          - entities.RecipientNumber.fields.privilege_status
          - entities.RecipientNumber.fields.verification_code
        distinguishing_aspect: "relationship_type drives the initial privilege_status: ATTORNEY creation enters PRIVILEGE_REQUESTED without any extra call, FAMILY enters NONE; both creations return a server-generated verification_code and verification_status VERIFICATION_SENT."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A facility, an inmate, and a PREPAID account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities"
              payload: { name: "Priv Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-9002", full_name: "Inmate Priv" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam Priv", owner_contact: "fp3@x.com" }
              as: FacilityStaff
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${acct_id}", e164_number: "+15551110000", label: "Atty Rivera", relationship_type: "ATTORNEY" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { atty_id: $.data.id, atty_priv: $.data.privilege_status, atty_code: $.data.verification_code }
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${acct_id}", e164_number: "+15551110001", label: "Mom", relationship_type: "FAMILY" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { fam_id: $.data.id, fam_priv: $.data.privilege_status }
          assert:
            - "attorney number: atty_priv == PRIVILEGE_REQUESTED and atty_code is a non-empty string"
            - "family number: fam_priv == NONE"
            - "both have verification_status == VERIFICATION_SENT and block_status == NOT_BLOCKED and consent_to_recording == false"

      - name: funding_transaction_rows_are_immutable_and_versionless
        claim_type: Immutability
        grounds:
          - entities.FundingTransaction
        distinguishing_aspect: "FundingTransaction declares common_fields: false, so ledger rows carry id and created_at but no version and no updated_at, and §1.5 declares no PUT/PATCH/DELETE endpoint for them — the ledger is append-only."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A facility with ACTIVE contract/schedule (deposit fee 25), an inmate, a PREPAID account with one deposit of 100 (fee 25 -> balance 75)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/facilities"
              payload: { name: "Ledger Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-9003", full_name: "Inmate Ledger" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam Ledger", owner_contact: "fl2@x.com" }
              as: FacilityStaff
              captures: { acct_id: $.data.id }
            - call: "POST /comm-services/accounts/${acct_id}/deposits"
              payload: { amount_cents: 100 }
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /comm-services/accounts/${acct_id}/ledger"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the ledger returns exactly 2 rows: DEPOSIT +100 then DEPOSIT_FEE -25, in created_at ascending order"
            - "neither row carries a version or updated_at field; both carry id and created_at"
            - "Account.${acct_id}.balance_cents == 75, consistent with the ledger sum"

      - name: accounts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/comm-services/accounts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three accounts on one facility, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One facility, one inmate, three PREPAID accounts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities"
              payload: { name: "Paging Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-9004", full_name: "Inmate Paging" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam A", owner_contact: "a@x.com" }
              as: FacilityStaff
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam B", owner_contact: "b@x.com" }
              as: FacilityStaff
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "DEBIT", owner_name: "Inmate Paging", owner_contact: "c@x.com" }
              as: FacilityStaff
          trigger:
            - call: "GET /comm-services/accounts"
              payload: { facility_id: "${fac_id}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "page 1: exactly 2 rows, total_count == 3, has_more == true"
            - "GET /comm-services/accounts?facility_id=${fac_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /comm-services/accounts?facility_id=${fac_id}&funding_model=DEBIT returns exactly 1 row"
            - "GET /comm-services/accounts?facility_id=${fac_id} with no limit returns 3 rows (default limit 10, offset 0)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_double_activate_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FacilityContract.DRAFT_to_ACTIVE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The only declared from-state for activate is DRAFT; a second activate on the ACTIVE contract is rejected with 409 ERR_INVALID_STATE and bumps nothing (version unchanged, no schedule supersession)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cap ST; facility; contract activated once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/facilities"
              payload: { name: "Idem Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { c_v_after: $.data.version }
          trigger:
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the second activate returns 409 and err == ERR_INVALID_STATE"
            - "GET /comm-services/contracts/${c_id} still shows status ACTIVE and version == c_v_after (no silent mutation)"

      - name: released_inmate_is_terminal_and_blocks_new_activity
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Inmate.IN_CUSTODY_to_RELEASED
          - errors.ERR_INVALID_STATE
          - errors.ERR_INMATE_NOT_IN_CUSTODY
        distinguishing_aspect: "RELEASED is terminal: a second release is 409 ERR_INVALID_STATE, and downstream creators gate on the inmate's state — a video session request for the released inmate is 409 ERR_INMATE_NOT_IN_CUSTODY."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base ACTIVE facility/contract/schedule; inmate I; PREPAID account funded 1025."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/facilities"
              payload: { name: "Terminal Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-9005", full_name: "Inmate Terminal" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam T", owner_contact: "ft@x.com" }
              as: FacilityStaff
              captures: { acct_id: $.data.id }
            - call: "POST /comm-services/inmates/${inm_id}/release"
              payload: {}
              as: FacilityStaff
          trigger:
            - call: "POST /comm-services/inmates/${inm_id}/release"
              payload: {}
              as: FacilityStaff
              captures: { err1: $.data.error_id }
            - call: "POST /comm-services/video-sessions"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", account_id: "${acct_id}", visitor_name: "VT", scheduled_start: "2026-09-20T10:00:00Z", scheduled_end: "2026-09-20T10:30:00Z" }
              as: FacilityStaff
              captures: { err2: $.data.error_id }
          assert:
            - "second release: 409 err1 == ERR_INVALID_STATE"
            - "video create for the released inmate: 409 err2 == ERR_INMATE_NOT_IN_CUSTODY"
            - "Inmate.${inm_id}.status stays RELEASED"

      - name: contract_terminate_supersedes_active_schedule_but_calls_keep_pins
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FacilityContract.ACTIVE_to_TERMINATED
          - state_machines.RateSchedule.ACTIVE_to_SUPERSEDED
          - entities.CallRecord.fields.rate_schedule_id
        distinguishing_aspect: "Terminating the contract flips its ACTIVE schedule to SUPERSEDED, yet a CallRecord created before termination still reports the pinned rate_schedule_id and applied rates — version-pinning survives supersession."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base ACTIVE facility/contract/schedule; inmate; PREPAID account funded 1025 with verified recipient; one CONNECTED call (pinned to the ACTIVE schedule)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/facilities"
              payload: { name: "Pin Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-9006", full_name: "Inmate Pin" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam Pin", owner_contact: "fp4@x.com" }
              as: FacilityStaff
              captures: { acct_id: $.data.id }
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${acct_id}", e164_number: "+15551110002", label: "Mom", relationship_type: "FAMILY" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { recip_id: $.data.id, recip_code: $.data.verification_code }
            - call: "POST /comm-services/recipient-numbers/${recip_id}/verify"
              payload: { verification_code: "${recip_code}", consent_to_recording: true }
              as: RecipientParty
              as_user_id: "${recip_id}"
            - call: "POST /comm-services/accounts/${acct_id}/deposits"
              payload: { amount_cents: 1025 }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /comm-services/calls"
              payload: { account_id: "${acct_id}", inmate_id: "${inm_id}", recipient_number_id: "${recip_id}", call_type: "LOCAL" }
              as: FacilityStaff
              captures: { call_id: $.data.id, pinned_sched: $.data.rate_schedule_id, pinned_rate: $.data.applied_per_minute_cents }
          trigger:
            - call: "POST /comm-services/contracts/${c_id}/terminate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "RateSchedule.${s_id}.status == SUPERSEDED after termination"
            - "pinned_sched == ${s_id} and CallRecord.${call_id} still reports rate_schedule_id == ${s_id} and applied_per_minute_cents == 18"
