        grounds:
          - validations.priority_37_incident_coalesce_window
          - calculations.support_response_commitments
          - state_machines.SupportCase.RESPONDING_to_RESOLVED
          - errors.ERR_INCIDENT_COALESCE_WINDOW
        distinguishing_aspect: |
          A trailing exclusion window measured from resolved_at, not from started_at, and scoped to
          the (product, severity) pair: a new S2 incident 20 minutes after the previous S2 was
