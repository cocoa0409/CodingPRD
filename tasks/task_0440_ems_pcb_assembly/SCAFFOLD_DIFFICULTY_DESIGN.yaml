              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /boms"
              payload: { product_code: "BRD-8", revision: "B", supersedes_bom_id: "${bom_a_id}" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_b_id: $.data.id }
            - call: "POST /boms/${bom_b_id}/lines"
