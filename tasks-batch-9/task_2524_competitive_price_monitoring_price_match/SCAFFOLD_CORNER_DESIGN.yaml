              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-B", name: "Bravo Mart", collection_method: "STORE_AUDIT", tier: "SECONDARY" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-C", name: "Cavo Mart", collection_method: "ONLINE", tier: "SECONDARY" }
              as: PlatformAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /pricing/matches/${l1_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c2_id}", match_method: "ATTRIBUTE", identifier_score: 70, attribute_score: 70, image_score: 70 }
              as: PricingAnalyst
              captures: { l2_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c3_id}", match_method: "ATTRIBUTE", identifier_score: 40, attribute_score: 40, image_score: 40 }
              as: PricingAnalyst
              captures: { l3_id: $.data.id }
          trigger:
            - call: "GET /pricing/matches?product_id=${p_id}&min_confidence_bp=7000"
              payload: {}
              as: PricingAnalyst
              captures: { rows_7000: $.data }
            - call: "GET /pricing/matches?product_id=${p_id}&min_confidence_bp=7001"
              payload: {}
              as: PricingAnalyst
              captures: { rows_7001: $.data }
            - call: "GET /pricing/matches?product_id=${p_id}&status=PROPOSED&min_confidence_bp=7000"
              payload: {}
