scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reinvestment_price_market_close_vs_five_day_average
        grounds:
          - calculations.reinvestment_allocation
          - entities.Plan.fields.pricing_basis
          - entities.DividendEvent.fields.reinvestment_price_cents
        distinguishing_aspect: |
          Same dividend inputs (100.0000 shares, 50 cents/share, 5% discount) produce different
          reinvestment prices and share counts purely from plan.pricing_basis: MARKET_CLOSE selects
          closing_price_cents (2000 -> 1900) while FIVE_DAY_AVERAGE selects avg5_price_cents
          (2100 -> 1995) — a pricing variant on the DividendEvent domain, distinct from the
          TaxLot-domain basis variant of disposition_basis_fifo_vs_average_cost.
        test_recipe:
          setup:
            - "Two plans identical except pricing_basis (MARKET_CLOSE vs FIVE_DAY_AVERAGE), both ACTIVE"
            - "Each plan has one ACTIVE enrollment holding exactly 100.0000 shares (deposit @ 1500 cents)"
            - "Each plan has a PRICED dividend: 50 cents/share, record 2026-09-10, payable 2026-09-20, closing 2000, avg5 2100"
            - "Logical clock at 2026-09-20T10:00:00Z (on/after payable_date)"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Acme Corp", ticker: "ACME", name: "ACME DRIP MC", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_a: $.data.id } }
            - { call: "POST /drip/plans/${plan_a}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat A", email: "pa@x.com" }, as: PlanAdmin, captures: { p_a: $.data.id } }
            - { call: "POST /drip/plans/${plan_a}/enrollments", payload: { participant_id: "${p_a}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_a}", captures: { e_a: $.data.id } }
            - { call: "POST /drip/enrollments/${e_a}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_a}/deposits", payload: { quantity: 100.0, cost_per_share_cents: 1500 }, as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_a}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-09-10T00:00:00Z", payable_date: "2026-09-20T00:00:00Z" }, as: PlanAdmin, captures: { d_a: $.data.id } }
            - { call: "POST /drip/dividend-events/${d_a}/price", payload: { closing_price_cents: 2000, avg5_price_cents: 2100 }, as: PlanAdmin }
            - { call: "POST /drip/plans", payload: { issuer_name: "Beta Corp", ticker: "BETA", name: "BETA DRIP AVG", discount_pct: 0.05, pricing_basis: "FIVE_DAY_AVERAGE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_b: $.data.id } }
            - { call: "POST /drip/plans/${plan_b}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat B", email: "pb@x.com" }, as: PlanAdmin, captures: { p_b: $.data.id } }
            - { call: "POST /drip/plans/${plan_b}/enrollments", payload: { participant_id: "${p_b}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_b}", captures: { e_b: $.data.id } }
            - { call: "POST /drip/enrollments/${e_b}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_b}/deposits", payload: { quantity: 100.0, cost_per_share_cents: 1500 }, as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_b}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-09-10T00:00:00Z", payable_date: "2026-09-20T00:00:00Z" }, as: PlanAdmin, captures: { d_b: $.data.id } }
            - { call: "POST /drip/dividend-events/${d_b}/price", payload: { closing_price_cents: 2000, avg5_price_cents: 2100 }, as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T10:00:00Z" }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/dividend-events/${d_a}/execute", as: PlanAdmin }
            - { call: "POST /drip/dividend-events/${d_b}/execute", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_a}/ledger-entries", payload: { entry_type: "REINVEST" }, as: PlanAdmin, captures: { reinvest_a_qty: "$.data[0].quantity" } }
            - { call: "GET /drip/enrollments/${e_b}/ledger-entries", payload: { entry_type: "REINVEST" }, as: PlanAdmin, captures: { reinvest_b_qty: "$.data[0].quantity" } }
          assert:
            - "DividendEvent.${d_a}.reinvestment_price_cents == 1900"
            - "DividendEvent.${d_b}.reinvestment_price_cents == 1995"
            - "REINVEST entry quantity on ${e_a} == 2.6316"
            - "REINVEST entry quantity on ${e_b} == 2.5063"
            - "Enrollment.${e_a}.share_balance == 102.6316 and Enrollment.${e_b}.share_balance == 102.5063"
            - "The two REINVEST TaxLots each carry total_basis_cents == 5000 (actual cash reinvested)"

      - name: disposition_basis_fifo_vs_average_cost
        grounds:
          - calculations.disposition_basis_relief
          - entities.Plan.fields.basis_method
          - entities.TaxLot.fields.remaining_quantity
        distinguishing_aspect: |
          Identical lots (10 @ 1000 then 10 @ 2000) and an identical 4-share gift at fmv 2500 yield
          different reported gains purely from plan.basis_method: FIFO relieves the oldest lot
          (basis 4000, gain 6000) while AVERAGE_COST relieves at weighted average 1500
          (basis 6000, gain 4000) — a TaxLot/cost-basis domain variant, distinct from the
          DividendEvent pricing variant of reinvestment_price_market_close_vs_five_day_average.
        test_recipe:
          setup:
            - "Two plans identical except basis_method (FIFO vs AVERAGE_COST), both ACTIVE"
            - "Each plan has one ACTIVE enrollment with lots 10.0000 @ 1000 and 10.0000 @ 2000 (total basis 30000)"
            - "Each enrollment has an EXECUTED 4.0000-share GIFT at fmv_per_share_cents 2500"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Fifo Corp", ticker: "FIFO", name: "FIFO DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_f: $.data.id } }
            - { call: "POST /drip/plans/${plan_f}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat F", email: "pf@x.com" }, as: PlanAdmin, captures: { p_f: $.data.id } }
            - { call: "POST /drip/plans/${plan_f}/enrollments", payload: { participant_id: "${p_f}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_f}", captures: { e_f: $.data.id } }
            - { call: "POST /drip/enrollments/${e_f}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_f}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_f}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 2000 }, as: PlanAdmin }
            - { call: "POST /drip/plans", payload: { issuer_name: "Avg Corp", ticker: "AVG", name: "AVG DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "AVERAGE_COST", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_a: $.data.id } }
            - { call: "POST /drip/plans/${plan_a}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat G", email: "pg@x.com" }, as: PlanAdmin, captures: { p_a: $.data.id } }
            - { call: "POST /drip/plans/${plan_a}/enrollments", payload: { participant_id: "${p_a}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_a}", captures: { e_a: $.data.id } }
            - { call: "POST /drip/enrollments/${e_a}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_a}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_a}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 2000 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_f}/transfers", payload: { transfer_type: "GIFT", quantity: 4.0, recipient_name: "Niece F", recipient_address: "1 Way" }, as: Participant, as_user_id: "${p_f}", captures: { t_f: $.data.id } }
            - { call: "POST /drip/transfer-instructions/${t_f}/execute", payload: { fmv_per_share_cents: 2500 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_a}/transfers", payload: { transfer_type: "GIFT", quantity: 4.0, recipient_name: "Niece A", recipient_address: "1 Way" }, as: Participant, as_user_id: "${p_a}", captures: { t_a: $.data.id } }
            - { call: "POST /drip/transfer-instructions/${t_a}/execute", payload: { fmv_per_share_cents: 2500 }, as: PlanAdmin }
          trigger:
            - { call: "GET /drip/enrollments/${e_f}/tax-report", payload: { year: 2026 }, as: PlanAdmin, captures: { rep_f_gain: $.data.gain_cents } }
            - { call: "GET /drip/enrollments/${e_a}/tax-report", payload: { year: 2026 }, as: PlanAdmin, captures: { rep_a_gain: $.data.gain_cents } }
          assert:
            - "FIFO report: proceeds_cents == 10000, basis_cents == 4000, gain_cents == 6000"
            - "AVERAGE_COST report: proceeds_cents == 10000, basis_cents == 6000, gain_cents == 4000"
            - "rep_f_gain != rep_a_gain for identical lots, quantity, and fmv"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reinvestment_nested_rounding_order_pinned
        grounds:
          - calculations.reinvestment_allocation
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins "round price to integer cents BEFORE dividing
          into shares". With closing 1999 and 5% discount the pinned order yields price 1899 and
          shares 2.6330; dividing against the unrounded 1899.05 would yield 2.6329 — the orders
          genuinely differ in the 4th decimal.
        test_recipe:
          setup:
            - "ACTIVE MARKET_CLOSE plan (discount 0.05), one ACTIVE enrollment holding 100.0000 shares (@ 1500)"
            - "PRICED dividend 50 cents/share with closing_price_cents 1999, avg5 2100; clock 2026-09-20T10:00:00Z"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Round Corp", ticker: "RND", name: "RND DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_r: $.data.id } }
            - { call: "POST /drip/plans/${plan_r}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat R", email: "pr@x.com" }, as: PlanAdmin, captures: { p_r: $.data.id } }
            - { call: "POST /drip/plans/${plan_r}/enrollments", payload: { participant_id: "${p_r}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_r}", captures: { e_r: $.data.id } }
            - { call: "POST /drip/enrollments/${e_r}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_r}/deposits", payload: { quantity: 100.0, cost_per_share_cents: 1500 }, as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_r}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-09-10T00:00:00Z", payable_date: "2026-09-20T00:00:00Z" }, as: PlanAdmin, captures: { d_r: $.data.id } }
            - { call: "POST /drip/dividend-events/${d_r}/price", payload: { closing_price_cents: 1999, avg5_price_cents: 2100 }, as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T10:00:00Z" }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/dividend-events/${d_r}/execute", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_r}/ledger-entries", payload: { entry_type: "REINVEST" }, as: PlanAdmin, captures: { reinvest_r_qty: "$.data[0].quantity" } }
          assert:
            - "DividendEvent.${d_r}.reinvestment_price_cents == 1899"
            - "REINVEST entry quantity == 2.6330 (NOT 2.6329, which the unrounded-price order would give)"
            - "Enrollment.${e_r}.share_balance == 102.6330"

      - name: ocp_fee_max_min_with_conditional_inputs
        grounds:
          - calculations.ocp_fee_assessment
        distinguishing_aspect: |
          Mode (a) multi-input non-linear formula: fee = max(floor, amount * pct) with a conditional
          waiver branch — 12000 cents hits the proportional arm (600), 9000 cents is caught by the
          500-cent floor, and a fee_waiver_eligible participant on an identical 12000-cent order is
          charged 0; settled_shares then differ (4.5600 vs 3.4000 vs 4.8000) because the fee is
          netted before the share division.
        test_recipe:
          setup:
            - "ACTIVE plan (ocp_fee_pct 0.05, ocp_fee_min_cents 500, price 2500 window)"
            - "Two ACTIVE enrollments: normal participant and fee_waiver_eligible participant"
            - "Window [2026-09-01, 2026-09-15) OPEN with three SUBMITTED orders: 12000 (normal), 9000 (normal), 12000 (waived)"
            - "Window CLOSED at clock 2026-09-16"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Fee Corp", ticker: "FEE", name: "FEE DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_f: $.data.id } }
            - { call: "POST /drip/plans/${plan_f}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat N", email: "pn@x.com" }, as: PlanAdmin, captures: { p_n: $.data.id } }
            - { call: "POST /drip/plans/${plan_f}/enrollments", payload: { participant_id: "${p_n}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_n}", captures: { e_n: $.data.id } }
            - { call: "POST /drip/enrollments/${e_n}/activate", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat W", email: "pw@x.com", fee_waiver_eligible: true }, as: PlanAdmin, captures: { p_w: $.data.id } }
            - { call: "POST /drip/plans/${plan_f}/enrollments", payload: { participant_id: "${p_w}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_w}", captures: { e_w: $.data.id } }
            - { call: "POST /drip/enrollments/${e_w}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_f}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_f: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_f}/open", as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_f}/purchase-orders", payload: { enrollment_id: "${e_n}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_n}", captures: { o_1: $.data.id } }
            - { call: "POST /drip/purchase-windows/${w_f}/purchase-orders", payload: { enrollment_id: "${e_n}", amount_cents: 9000 }, as: Participant, as_user_id: "${p_n}", captures: { o_2: $.data.id } }
            - { call: "POST /drip/purchase-windows/${w_f}/purchase-orders", payload: { enrollment_id: "${e_w}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_w}", captures: { o_3: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_f}/close", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/purchase-windows/${w_f}/settle", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_n}/fees", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_w}/fees", as: PlanAdmin }
          assert:
            - "PurchaseOrder.${o_1}.status == SETTLED and settled_shares == 4.5600"
            - "PurchaseOrder.${o_2}.status == SETTLED and settled_shares == 3.4000"
            - "PurchaseOrder.${o_3}.status == SETTLED and settled_shares == 4.8000"
            - "OCP FeeAssessments on ${e_n}: computed_cents 600 and 500 (floor binds on the 9000 order), charged == computed, waived == false"
            - "OCP FeeAssessment on ${e_w}: computed_cents == 600, charged_cents == 0, waived == true, waived_reason == AUTO_ELIGIBLE"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_suspend_resume_cycle
        grounds:
          - state_machines.Plan.ACTIVE_to_SUSPENDED
          - state_machines.Plan.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Plan has a true cycle ACTIVE -> SUSPENDED -> ACTIVE traversable repeatedly; two full
          loops are exercised here and the status is asserted after every hop — non-linear shape
          on the Plan entity, distinct from the Enrollment cycle.
        test_recipe:
          setup: ["Plan created (DRAFT) and published to ACTIVE"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Cyc Corp", ticker: "CYC", name: "CYC DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_c: $.data.id } }
            - { call: "POST /drip/plans/${plan_c}/publish", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/plans/${plan_c}/suspend", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_c}/resume", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_c}/suspend", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_c}/resume", as: PlanAdmin }
            - { call: "GET /drip/plans/${plan_c}", as: PlanAdmin }
          assert:
            - "Statuses observed in order: ACTIVE (after publish), SUSPENDED, ACTIVE, SUSPENDED, ACTIVE"
            - "Plan.version == 5 after five mutating transitions"

      - name: enrollment_suspension_cycle_via_plan
        grounds:
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Enrollment cycles ACTIVE -> SUSPENDED -> ACTIVE as a driven cascade of the Plan cycle —
          a non-linear machine on a DIFFERENT entity (Enrollment) than plan_suspend_resume_cycle,
          with the loop driven by cross-entity side effects rather than direct enrollment endpoints.
        test_recipe:
          setup: ["ACTIVE plan with one ACTIVE enrollment"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Loop Corp", ticker: "LOOP", name: "LOOP DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_l: $.data.id } }
            - { call: "POST /drip/plans/${plan_l}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat L", email: "pl@x.com" }, as: PlanAdmin, captures: { p_l: $.data.id } }
            - { call: "POST /drip/plans/${plan_l}/enrollments", payload: { participant_id: "${p_l}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_l}", captures: { e_l: $.data.id } }
            - { call: "POST /drip/enrollments/${e_l}/activate", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/plans/${plan_l}/suspend", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_l}", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_l}/resume", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_l}", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_l}/suspend", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_l}", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_l}/resume", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_l}", as: PlanAdmin }
          assert:
            - "Enrollment statuses observed in order: SUSPENDED, ACTIVE, SUSPENDED, ACTIVE"
            - "Cyclic loop completed twice with no manual enrollment-level transition call"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depths 3 and >=2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plan_suspend_cascades_enrollment_order_window
        grounds:
          - state_machines.Plan.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
          - state_machines.PurchaseOrder.SUBMITTED_to_REJECTED
          - entities.PurchaseWindow.fields.submitted_total_cents
        distinguishing_aspect: |
          Depth-3 chain from the suspend trigger: Plan suspension mutates Enrollment (link 1),
          the enrollment suspension mutates its SUBMITTED PurchaseOrders to REJECTED (link 2),
          and each rejection decrements the window's submitted_total_cents derived field (link 3) —
          each link caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "ACTIVE plan with one ACTIVE enrollment"
            - "OPEN window [2026-09-01, 2026-09-15) price 2500 holding one SUBMITTED order of 12000; window.submitted_total_cents == 12000"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Susp Corp", ticker: "SUS", name: "SUS DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_s: $.data.id } }
            - { call: "POST /drip/plans/${plan_s}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat S", email: "ps@x.com" }, as: PlanAdmin, captures: { p_s: $.data.id } }
            - { call: "POST /drip/plans/${plan_s}/enrollments", payload: { participant_id: "${p_s}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_s}", captures: { e_s: $.data.id } }
            - { call: "POST /drip/enrollments/${e_s}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_s}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_s: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_s}/open", as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_s}/purchase-orders", payload: { enrollment_id: "${e_s}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_s}", captures: { o_s: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_s}/suspend", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_s}", as: PlanAdmin }
            - { call: "GET /drip/purchase-orders/${o_s}", as: PlanAdmin }
            - { call: "GET /drip/purchase-windows/${w_s}", as: PlanAdmin }
          assert:
            - "Plan.${plan_s}.status == SUSPENDED"
            - "Enrollment.${e_s}.status == SUSPENDED"
            - "PurchaseOrder.${o_s}.status == REJECTED"
            - "PurchaseWindow.${w_s}.submitted_total_cents == 0 (was 12000 before the cascade)"

      - name: enrollment_terminate_cascades_sale_lots_fee
        grounds:
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - calculations.termination_settlement
          - entities.ShareLedgerEntry.fields.entry_type
          - entities.FeeAssessment.fields.fee_type
        distinguishing_aspect: |
          Depth-2 chain from the terminate trigger (a different trigger than plan suspension):
          termination creates the FRACTIONAL_SALE ledger entry (link 1), and the sale entry's own
          creation relieves every TaxLot to remaining_quantity 0 and emits the SALE FeeAssessment
          (link 2) — the lot relief and fee are consequences of the sale entry, not direct calls.
        test_recipe:
          setup:
            - "ACTIVE plan (sale_fee_cents 250, FIFO) with one ACTIVE enrollment holding exactly 10.5000 shares (@ 1000, basis 10500)"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Term Corp", ticker: "TRM", name: "TRM DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_t: $.data.id } }
            - { call: "POST /drip/plans/${plan_t}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat T", email: "pt@x.com" }, as: PlanAdmin, captures: { p_t: $.data.id } }
            - { call: "POST /drip/plans/${plan_t}/enrollments", payload: { participant_id: "${p_t}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_t}", captures: { e_t: $.data.id } }
            - { call: "POST /drip/enrollments/${e_t}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_t}/deposits", payload: { quantity: 10.5, cost_per_share_cents: 1000 }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/enrollments/${e_t}/terminate", payload: { sale_price_cents: 2000 }, as: Participant, as_user_id: "${p_t}" }
            - { call: "GET /drip/enrollments/${e_t}/ledger-entries", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_t}/fees", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_t}/tax-lots", as: PlanAdmin }
          assert:
            - "Enrollment.${e_t}.status == TERMINATED and share_balance == 0.0000"
            - "Ledger contains FRACTIONAL_SALE entry: quantity == -0.5000, price_cents == 2000, cash_cents == 750 (gross 1000 minus fee 250)"
            - "Ledger contains WHOLE_SHARE_WITHDRAWAL entry: quantity == -10.0000"
            - "Fees contain SALE FeeAssessment with computed_cents == 250 and charged_cents == 250"
            - "Every TaxLot of ${e_t} has remaining_quantity == 0.0000"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_submit_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_WINDOW_NOT_OPEN]
          - errors[ERR_PURCHASE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          state (priority 5) vs business_fiscal (priority 8): the order is submitted to a CLOSED
          window AND its 1000 cents would push the cumulative total to 25500 > 25000 — the dual
          failure must surface ERR_WINDOW_NOT_OPEN, proving state checks run before fiscal checks.
        test_recipe:
          setup:
            - "ACTIVE plan (ocp_max_cents 25000), ACTIVE enrollment, window with 24500 cents of SUBMITTED orders (12000 + 12500)"
            - "Clock advanced to 2026-09-16 and window CLOSED"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Prio Corp", ticker: "PRI", name: "PRI DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_p: $.data.id } }
            - { call: "POST /drip/plans/${plan_p}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat P", email: "pp@x.com" }, as: PlanAdmin, captures: { p_p: $.data.id } }
            - { call: "POST /drip/plans/${plan_p}/enrollments", payload: { participant_id: "${p_p}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_p}", captures: { e_p: $.data.id } }
            - { call: "POST /drip/enrollments/${e_p}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_p}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_p: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_p}/open", as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_p}/purchase-orders", payload: { enrollment_id: "${e_p}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_p}" }
            - { call: "POST /drip/purchase-windows/${w_p}/purchase-orders", payload: { enrollment_id: "${e_p}", amount_cents: 12500 }, as: Participant, as_user_id: "${p_p}" }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_p}/close", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/purchase-windows/${w_p}/purchase-orders", payload: { enrollment_id: "${e_p}", amount_cents: 1000 }, as: Participant, as_user_id: "${p_p}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_NOT_OPEN (http 409), NOT ERR_PURCHASE_LIMIT_EXCEEDED"

      - name: window_create_temporal_beats_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_WINDOW_SCHEDULE_INVALID]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          business_temporal (priority 6) vs business_constraint (priority 7): the new window both
          opens in the past (temporal violation) AND overlaps an existing window (constraint
          violation) — the dual failure must surface ERR_WINDOW_SCHEDULE_INVALID, a different
          error-category pair than order_submit_state_beats_fiscal.
        test_recipe:
          setup:
            - "ACTIVE plan with existing non-SETTLED window [2026-09-01, 2026-09-15)"
            - "Logical clock at the startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Time Corp", ticker: "TIM", name: "TIM DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_m: $.data.id } }
            - { call: "POST /drip/plans/${plan_m}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_m}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_m: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_m}/purchase-windows", payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-09-10T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_SCHEDULE_INVALID (http 422), NOT ERR_WINDOW_OVERLAP"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: window_cumulative_limit_equal_allowed_exceed_rejected
        grounds:
          - calculations.window_purchase_limit
          - errors[ERR_PURCHASE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Cumulative-cents threshold on POST purchase-orders: a running total landing exactly ON
          ocp_max_cents (12000 + 13000 == 25000) is accepted (<=, not <), while the next 1000-cent
          order pushing the total to 26000 is rejected — metric: integer cents vs the share-quantity
          metric of termination_zero_fractional_skips_sale.
        test_recipe:
          setup:
            - "ACTIVE plan (ocp_max_cents 25000, ocp_min_cents 1000), ACTIVE enrollment, OPEN window [2026-09-01, 2026-09-15) at clock 2026-09-02"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Bnd Corp", ticker: "BND", name: "BND DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_b: $.data.id } }
            - { call: "POST /drip/plans/${plan_b}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat B", email: "pb2@x.com" }, as: PlanAdmin, captures: { p_b: $.data.id } }
            - { call: "POST /drip/plans/${plan_b}/enrollments", payload: { participant_id: "${p_b}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_b}", captures: { e_b: $.data.id } }
            - { call: "POST /drip/enrollments/${e_b}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_b}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_b: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_b}/open", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/purchase-windows/${w_b}/purchase-orders", payload: { enrollment_id: "${e_b}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_b}", captures: { o_1: $.data.id } }
            - { call: "POST /drip/purchase-windows/${w_b}/purchase-orders", payload: { enrollment_id: "${e_b}", amount_cents: 13000 }, as: Participant, as_user_id: "${p_b}", captures: { o_2: $.data.id } }
            - { call: "POST /drip/purchase-windows/${w_b}/purchase-orders", payload: { enrollment_id: "${e_b}", amount_cents: 1000 }, as: Participant, as_user_id: "${p_b}", captures: { err_id: $.data.error_id } }
          assert:
            - "PurchaseOrder.${o_1}.status == SUBMITTED and PurchaseOrder.${o_2}.status == SUBMITTED (cumulative exactly 25000 == ocp_max_cents is allowed)"
            - "Third order (total would be 26000) rejected with error_id == ERR_PURCHASE_LIMIT_EXCEEDED (http 422)"

      - name: termination_zero_fractional_skips_sale
        grounds:
          - calculations.termination_settlement
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Zero-quantity share boundary on POST terminate: a balance with fractional part exactly
          0.0000 produces NO FRACTIONAL_SALE entry and NO sale fee, while the whole-share withdrawal
          still fires — a share-quantity boundary on a different endpoint (terminate) than the
          cents-threshold boundary of window_cumulative_limit_equal_allowed_exceed_rejected.
        test_recipe:
          setup: ["ACTIVE plan (sale_fee_cents 250) with one ACTIVE enrollment holding exactly 10.0000 shares (@ 1000)"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Zero Corp", ticker: "ZRO", name: "ZRO DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_z: $.data.id } }
            - { call: "POST /drip/plans/${plan_z}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Z", email: "pz@x.com" }, as: PlanAdmin, captures: { p_z: $.data.id } }
            - { call: "POST /drip/plans/${plan_z}/enrollments", payload: { participant_id: "${p_z}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_z}", captures: { e_z: $.data.id } }
            - { call: "POST /drip/enrollments/${e_z}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_z}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/enrollments/${e_z}/terminate", payload: { sale_price_cents: 2000 }, as: Participant, as_user_id: "${p_z}" }
            - { call: "GET /drip/enrollments/${e_z}/ledger-entries", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_z}/fees", payload: { fee_type: "SALE" }, as: PlanAdmin }
          assert:
            - "Ledger contains WHOLE_SHARE_WITHDRAWAL entry with quantity == -10.0000"
            - "Ledger contains NO FRACTIONAL_SALE entry"
            - "SALE-filtered fee list is empty (no sale fee assessed at the 0.0000 boundary)"
            - "Enrollment.${e_z}.status == TERMINATED and share_balance == 0.0000"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_activation_requires_plan_active
        grounds:
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - errors[ERR_PLAN_NOT_ACTIVE]
        distinguishing_aspect: |
          Enrollment -> Plan pair: the PENDING->ACTIVE transition is guarded by the linked Plan's
          state; activating while the plan is SUSPENDED fails with ERR_PLAN_NOT_ACTIVE and the
          enrollment stays PENDING.
        test_recipe:
          setup: ["Plan published to ACTIVE, then one enrollment created (PENDING), then plan suspended"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Guard Corp", ticker: "GRD", name: "GRD DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_g: $.data.id } }
            - { call: "POST /drip/plans/${plan_g}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat G", email: "pg2@x.com" }, as: PlanAdmin, captures: { p_g: $.data.id } }
            - { call: "POST /drip/plans/${plan_g}/enrollments", payload: { participant_id: "${p_g}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_g}", captures: { e_g: $.data.id } }
            - { call: "POST /drip/plans/${plan_g}/suspend", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/enrollments/${e_g}/activate", as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_PLAN_NOT_ACTIVE (http 409)"
            - "Enrollment.${e_g}.status remains PENDING"

      - name: order_submission_requires_window_open
        grounds:
          - state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED
          - validations[priority=5]
          - errors[ERR_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          PurchaseOrder -> PurchaseWindow pair (different pair than Enrollment -> Plan): order
          creation is guarded by the window's state; submitting while the window is still
          SCHEDULED fails with ERR_WINDOW_NOT_OPEN even though plan and enrollment are ACTIVE.
        test_recipe:
          setup: ["ACTIVE plan, ACTIVE enrollment with shares, window created but never opened (status SCHEDULED; clock still 2026-08-01 default)"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Gate Corp", ticker: "GTE", name: "GTE DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_k: $.data.id } }
            - { call: "POST /drip/plans/${plan_k}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat K", email: "pk@x.com" }, as: PlanAdmin, captures: { p_k: $.data.id } }
            - { call: "POST /drip/plans/${plan_k}/enrollments", payload: { participant_id: "${p_k}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_k}", captures: { e_k: $.data.id } }
            - { call: "POST /drip/enrollments/${e_k}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_k}/deposits", payload: { quantity: 5.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_k}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_k: $.data.id } }
          trigger:
            - { call: "POST /drip/purchase-windows/${w_k}/purchase-orders", payload: { enrollment_id: "${e_k}", amount_cents: 5000 }, as: Participant, as_user_id: "${p_k}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_NOT_OPEN (http 409)"
            - "PurchaseWindow.${w_k}.submitted_total_cents == 0"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: window_window_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [opens_at, closes_at) semantics on the PurchaseWindow resource: a second window
          opening exactly when the first closes (adjacent, zero gap) is ACCEPTED, while a one-day
          back-shift into the first window is rejected — pure adjacency-is-not-overlap geometry.
        test_recipe:
          setup: ["ACTIVE plan holding window A [2026-09-01T00:00, 2026-09-15T00:00); clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Ovl Corp", ticker: "OVL", name: "OVL DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_o: $.data.id } }
            - { call: "POST /drip/plans/${plan_o}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_o}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_a: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_o}/purchase-windows", payload: { opens_at: "2026-09-15T00:00:00Z", closes_at: "2026-09-30T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_b: $.data.id } }
            - { call: "POST /drip/plans/${plan_o}/purchase-windows", payload: { opens_at: "2026-09-14T00:00:00Z", closes_at: "2026-09-20T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "Adjacent window B created successfully (201): PurchaseWindow.${w_b}.status == SCHEDULED"
            - "Overlapping window C rejected with error_id == ERR_WINDOW_OVERLAP (http 422)"

      - name: window_dividend_blackout_closed_buffer
        grounds:
          - validations[priority=6]
          - errors[ERR_WINDOW_DIVIDEND_BLACKOUT]
        distinguishing_aspect: |
          Closed-interval-with-buffer semantics against a DIFFERENT resource (the DividendEvent
          blackout [record_date - 2 days, payable_date] inclusive of both bounds): a window ending
          one minute before the blackout is accepted, but a window starting exactly at the blackout
          boundary instant is REJECTED — touching counts as intersection, unlike the half-open
          window-window rule where touching is allowed.
        test_recipe:
          setup:
            - "ACTIVE plan with a DECLARED dividend: record_date 2026-10-10, payable_date 2026-10-20 (blackout = [2026-10-08T00:00:00Z, 2026-10-20T23:59:59Z])"
            - "Clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Blk Corp", ticker: "BLK", name: "BLK DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_x: $.data.id } }
            - { call: "POST /drip/plans/${plan_x}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_x}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-10-10T00:00:00Z", payable_date: "2026-10-20T00:00:00Z" }, as: PlanAdmin, captures: { d_x: $.data.id } }
            - { call: "POST /drip/plans/${plan_x}/purchase-windows", payload: { opens_at: "2026-09-20T00:00:00Z", closes_at: "2026-10-07T23:59:59Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_d: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_x}/purchase-windows", payload: { opens_at: "2026-10-08T00:00:00Z", closes_at: "2026-10-08T12:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "Window D (clear of blackout) created successfully: PurchaseWindow.${w_d}.status == SCHEDULED"
            - "Window E touching the blackout boundary rejected with error_id == ERR_WINDOW_DIVIDEND_BLACKOUT (http 422)"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_conserves_plan_share_supply
        grounds:
          - state_machines.TransferInstruction.SUBMITTED_to_EXECUTED
          - entities.Enrollment.fields.share_balance
        distinguishing_aspect: |
          Conserved quantity = plan-level SHARE COUNT: an executed TRANSFER debits the source and
          credits the recipient by the same quantity, so the sum of share_balance across the plan's
          enrollments is identical before and after (25.0000 == 25.0000); a reciprocal transfer
          would restore the exact original balances.
        test_recipe:
          setup:
            - "ACTIVE plan (transfer_fee_cents 300, FIFO) with two ACTIVE enrollments: e1 holding 20.0000 (@ 1000), e2 holding 5.0000 (@ 1000); plan share supply 25.0000"
            - "SUBMITTED TRANSFER of 7.5000 from e1 to e2"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Xfer Corp", ticker: "XFR", name: "XFR DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_v: $.data.id } }
            - { call: "POST /drip/plans/${plan_v}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat 1", email: "p1@x.com" }, as: PlanAdmin, captures: { p_1: $.data.id } }
            - { call: "POST /drip/plans/${plan_v}/enrollments", payload: { participant_id: "${p_1}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_1}", captures: { e_1: $.data.id } }
            - { call: "POST /drip/enrollments/${e_1}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_1}/deposits", payload: { quantity: 20.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat 2", email: "p2@x.com" }, as: PlanAdmin, captures: { p_2: $.data.id } }
            - { call: "POST /drip/plans/${plan_v}/enrollments", payload: { participant_id: "${p_2}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_2}", captures: { e_2: $.data.id } }
            - { call: "POST /drip/enrollments/${e_2}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_2}/deposits", payload: { quantity: 5.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_1}/transfers", payload: { transfer_type: "TRANSFER", quantity: 7.5, recipient_enrollment_id: "${e_2}" }, as: Participant, as_user_id: "${p_1}", captures: { t_1: $.data.id } }
          trigger:
            - { call: "POST /drip/transfer-instructions/${t_1}/execute", payload: { fmv_per_share_cents: 2500 }, as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_1}", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_2}", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_1}/fees", payload: { fee_type: "TRANSFER" }, as: PlanAdmin }
          assert:
            - "Enrollment.${e_1}.share_balance == 12.5000 and Enrollment.${e_2}.share_balance == 12.5000"
            - "Plan share supply invariant: 20.0000 + 5.0000 == 12.5000 + 12.5000 == 25.0000 (unchanged by execute)"
            - "TRANSFER FeeAssessment on ${e_1}: computed_cents == 300"
            - "Recipient ${e_2} holds a TRANSFER_IN TaxLot with quantity 7.5000 and carryover cost_per_share_cents == 1000"

      - name: disposition_conserves_cost_basis
        grounds:
          - calculations.disposition_basis_relief
          - entities.Enrollment.fields.total_cost_basis_cents
        distinguishing_aspect: |
          Conserved quantity = COST-BASIS CENTS (a different quantity type than share count):
          gifting 4.0000 of 20.0000 shares (lots 10 @ 1000, 10 @ 2000, FIFO) moves exactly 4000
          cents from remaining basis to realized basis — total_cost_basis_cents 30000 -> 26000 and
          the tax report's basis_cents == 4000, so remaining + realized == 30000 with zero drift.
        test_recipe:
          setup:
            - "ACTIVE FIFO plan with one ACTIVE enrollment holding lots 10.0000 @ 1000 and 10.0000 @ 2000 (total_cost_basis_cents == 30000)"
            - "SUBMITTED GIFT of 4.0000 shares to an external recipient"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Base Corp", ticker: "BAS", name: "BAS DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_q: $.data.id } }
            - { call: "POST /drip/plans/${plan_q}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Q", email: "pq@x.com" }, as: PlanAdmin, captures: { p_q: $.data.id } }
            - { call: "POST /drip/plans/${plan_q}/enrollments", payload: { participant_id: "${p_q}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_q}", captures: { e_q: $.data.id } }
            - { call: "POST /drip/enrollments/${e_q}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_q}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_q}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 2000 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_q}/transfers", payload: { transfer_type: "GIFT", quantity: 4.0, recipient_name: "Niece Q", recipient_address: "2 Way" }, as: Participant, as_user_id: "${p_q}", captures: { t_q: $.data.id } }
          trigger:
            - { call: "POST /drip/transfer-instructions/${t_q}/execute", payload: { fmv_per_share_cents: 2500 }, as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_q}", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_q}/tax-report", payload: { year: 2026 }, as: PlanAdmin }
          assert:
            - "Enrollment.${e_q}.total_cost_basis_cents == 26000 (was 30000 before execute)"
            - "Tax report: proceeds_cents == 10000, basis_cents == 4000, gain_cents == 6000"
            - "Conservation identity: 26000 (remaining) + 4000 (realized) == 30000 (pre-disposition total)"
            - "Enrollment.${e_q}.share_balance == 16.0000"
