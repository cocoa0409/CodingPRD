              as: NetworkAdmin
              captures: { rs1: $.data.id }
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid WrongCat", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "BURN", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 and err == ERR_CONDITION_OUT_OF_SCOPE"
            - "GET /charity-care/applications returns 0 rows"

