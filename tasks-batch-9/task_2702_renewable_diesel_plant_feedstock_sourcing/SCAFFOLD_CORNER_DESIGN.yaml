  - section: rbac
    instances:
      - name: plant_operator_cannot_post_feedstock_allocations
        claim_type: Role denied another role's exclusive operation
        grounds:
          - roles[PlantOperator].cannot
          - roles[FeedstockTrader].can
          - validations[priority=2]
        distinguishing_aspect: "Charge composition belongs to the trading desk: the plant operator is refused on POST /processing-runs/{id}/allocations with 403 before any existence check on the fabricated run and lot ids (priority 2 precedes priority 3)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /processing-runs/11111111-1111-1111-1111-111111111111/allocations"
              payload: { lot_id: "22222222-2222-2222-2222-222222222222", mass_mt: 100.000, expected_run_version: "${rv_absent}" }
              as: PlantOperator
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_ROLE_NOT_PERMITTED"
            - "response.error_id is not ERR_PROCESSING_RUN_NOT_FOUND (role check precedes the path existence check)"

      - name: quality_analyst_cannot_create_feedstock_lots
        claim_type: Role denied another role's exclusive operation
        grounds:
          - roles[QualityAnalyst].cannot
          - roles[FeedstockTrader].can
          - endpoints["POST /feedstock-lots"]
        distinguishing_aspect: "The lab adjudicates lots but never books them: POST /feedstock-lots as QualityAnalyst is 403 even though the same role owns every other write on the FeedstockLot row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "33333333-3333-3333-3333-333333333333", feedstock_type: "UCO", mass_mt: 100.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: QualityAnalyst
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_ROLE_NOT_PERMITTED"
            - "No FeedstockLot row is created"

      - name: independent_verifier_cannot_create_credit_blocks
        claim_type: Role denied another role's exclusive operation
        grounds:
          - roles[IndependentVerifier].cannot
          - roles[ComplianceOfficer].can
          - endpoints["POST /credit-blocks"]
        distinguishing_aspect: "The verifier judges credit blocks but never mints them: POST /credit-blocks as IndependentVerifier is 403, while POST /credit-blocks/{id}/verification-decisions is that role's exclusive operation."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /credit-blocks"
              payload: { batch_id: "44444444-4444-4444-4444-444444444444", pathway_id: "55555555-5555-5555-5555-555555555555" }
              as: IndependentVerifier
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_ROLE_NOT_PERMITTED"

      - name: compliance_officer_cannot_record_certification_decisions
        claim_type: Role denied another role's exclusive operation
        grounds:
          - roles[ComplianceOfficer].cannot
          - roles[IndependentVerifier].can
          - endpoints["POST /product-batches/{id}/certification-decisions"]
        distinguishing_aspect: "Certification is split across roles on the same batch: the officer may request certification but the CERTIFY/REJECT decision is the verifier's exclusive operation, so the officer gets 403."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /product-batches/66666666-6666-6666-6666-666666666666/certification-decisions"
              payload: { decision: "CERTIFY" }
              as: ComplianceOfficer
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_ROLE_NOT_PERMITTED"

      - name: quality_analyst_cannot_list_processing_runs
        claim_type: Role denied a read outside its remit
        grounds:
          - endpoints["GET /processing-runs"]
          - roles[QualityAnalyst].cannot
          - validations[priority=2]
        distinguishing_aspect: "GET /processing-runs is shared by three roles but not by the lab: QualityAnalyst is refused with 403 even though the endpoint is a pure read with no side effects."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /processing-runs"
              payload: { limit: 10, offset: 0 }
              as: QualityAnalyst
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_ROLE_NOT_PERMITTED"

      - name: missing_x_user_id_header_returns_unauthenticated
        claim_type: Authentication precedes authorization
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints["GET /processing-runs"]
        distinguishing_aspect: "Both headers are mandatory: a request carrying only X-User-Role is 401 ERR_UNAUTHENTICATED, and an X-User-Role outside the six declared roles is also 401 rather than 403, proving priority 1 runs before priority 2."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /processing-runs"
              payload: {}
              as: PlantOperator
          assert:
            - "The request is sent with header X-User-Role: PlantOperator and no X-User-ID header"
            - "response.status == 401"
            - "response.error_id == ERR_UNAUTHENTICATED"
            - "The same GET with X-User-Role: Auditor (not one of the six declared roles) and a well-formed X-User-ID also returns 401 ERR_UNAUTHENTICATED, not 403"
            - "The same GET with both headers present and role PlantOperator returns 200"

      - name: supplier_cannot_read_another_suppliers_documents
        claim_type: Entity-backed identity scoping
        grounds:
          - roles[Supplier].identity
          - validations[priority=5]
          - errors[ERR_SUPPLIER_SCOPE_VIOLATION]
        distinguishing_aspect: "The Supplier role is entity_backed: X-User-ID must equal the {id} in the path, so supplier A reading supplier B's document list is 403 ERR_SUPPLIER_SCOPE_VIOLATION while the identical call against its own id returns its one document."
