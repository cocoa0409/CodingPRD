    output: DelayEvent
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/construction-projects/{pid}/delay-events"
    description: "List delay events"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "causation?"]
    output: "DelayEvent[]"
    side_effects: []

  - method: GET
    path: "/construction-projects/{pid}/delay-events/{did}"
    description: "Get a delay event"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: []
    output: DelayEvent
    side_effects: []

  - method: POST
    path: "/construction-projects/{pid}/delay-events/{did}/notice"
    description: "Submit written notice for a delay event"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: DelayEvent
    side_effects: ["status → NOTICED", "notice_submitted_at := now", "compute notice_within_window"]

  - method: POST
    path: "/construction-projects/{pid}/delay-events/{did}/tia/submit"
    description: "Submit time impact analysis"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: DelayEvent
    side_effects: ["status → TIA_SUBMITTED", "Run time_impact_analysis (both variants)", "Run concurrent_delay_apportionment"]

  - method: POST
    path: "/construction-projects/{pid}/delay-events/{did}/tia/accept"
    description: "Accept TIA"
    roles: [ClaimsConsultant]
    code: 200
    input: []
    output: DelayEvent
    side_effects: ["status → TIA_ACCEPTED"]

  - method: POST
    path: "/construction-projects/{pid}/delay-events/{did}/tia/reject"
    description: "Reject TIA"
    roles: [ClaimsConsultant]
    code: 200
    input: []
    output: DelayEvent
    side_effects: ["status → TIA_REJECTED"]

  - method: POST
    path: "/construction-projects/{pid}/delay-events/{did}/resubmit"
    description: "Resubmit rejected TIA back to NOTICED"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: DelayEvent
    side_effects: ["status TIA_REJECTED → NOTICED", "Clear TIA and apportionment fields"]

  # --- TimeExtensionRequest ---
  - method: POST
    path: "/construction-projects/{pid}/eot-requests"
