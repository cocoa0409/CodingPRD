            - "SourcingOrder.${so1}.match_class == EXACT"
            - "SourcingOrder.${so1}.status == APPROVED"
            - "GET /reroof/sourcing-orders?project_id=${p1} returns exactly 1 row with total_count == 1, so the refused call persisted nothing"

      - name: corner_stale_expected_project_version_on_a_warranty_notice_refile_is_412_then_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.warranty-notice-refile-stale-project
          - errors.ERR_STALE_PROJECT_VERSION
          - endpoints["POST /reroof/projects/{id}/warranty-notice"]
        distinguishing_aspect: "The second concurrency rule guards a different endpoint with the same occ_field, and it must be enforced before the notice is written: the stale attempt leaves warranty_notice_status at PENDING with a null reference and filed_at, and only the re-read attempt flips it to FILED - which is what a leased system needs before any panel may go back on the roof."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A LEASE project exists in INTAKE, so its warranty_notice_status starts at PENDING."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Nguyen Household", party_type: "SOLAR_OWNER", contact_email: "owner@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 6, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /reroof/projects/${p1}"
              as: ProjectCoordinator
              captures: { pv1: $.data.version, status_before: $.data.warranty_notice_status }
            - call: "POST /reroof/_ledger/perturb"
              payload: { project_id: "${p1}", released_delta_cents: 0 }
              as: ProjectCoordinator
              captures: { pv2: $.data.version }
            - call: "POST /reroof/projects/${p1}/warranty-notice"
              payload: { manufacturer: "Meridian Solar", notice_reference: "MSN-2026-0418", expected_project_version: "${pv1}" }
              as: ProjectCoordinator
              captures: { e_stale: $.data.error_id }
            - call: "GET /reroof/projects/${p1}"
              as: ProjectCoordinator
              captures: { status_mid: $.data.warranty_notice_status }
            - call: "POST /reroof/projects/${p1}/warranty-notice"
              payload: { manufacturer: "Meridian Solar", notice_reference: "MSN-2026-0418", expected_project_version: "${pv2}" }
              as: ProjectCoordinator
              captures: { status_after: $.data.warranty_notice_status }
          assert:
            - "${status_before} == PENDING"
            - "trigger call 3 returns HTTP 412 and ${e_stale} == ERR_STALE_PROJECT_VERSION"
            - "${status_mid} == PENDING"
            - "trigger call 5 returns HTTP 200 and ${status_after} == FILED"
            - "${pv2} == ${pv1} + 1"
            - "ReroofProject.${p1}.warranty_notice_reference == MSN-2026-0418"
            - "ReroofProject.${p1}.warranty_notice_filed_at == 2026-08-01T00:00:00Z"
            - "ReroofProject.${p1}.version == ${pv2} + 1"
            - "ReroofProject.${p1}.phase == INTAKE"

      - name: corner_rescoping_a_finding_zeroes_its_cost_and_the_project_rollup_recomputes_both_ways
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.DeckFinding.transitions["UPGRADE_SCOPED -> OPEN"]
          - calculations.deck_upgrade_cost
          - entities.ReroofProject.fields.scoped_upgrade_cost_cents
        distinguishing_aspect: "scoped_upgrade_cost_cents is a rollup with no stored delta, so it must fall as well as rise: after scoping 106720 and 50000 it reads 156720; the RESCOPE zeroes the first finding's own cost, clears scoped_by_party_id and drops the rollup to exactly 50000; re-scoping the same finding recomputes 106720 from scratch and restores 156720. The 50000 on the small finding is the floor, not the raw 9500, which is what makes a naive subtract-what-you-added implementation diverge."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project with a 2,000,000-cent budget has two OPEN findings: F1 is MEDIUM MOISTURE_INTRUSION, 80 sqft, 4 attachments (80 * 950 + 4 * 4200 = 92800, * 1.15 = 106720); F2 is LOW FASTENER_PULLOUT, 10 sqft, 0 attachments (raw 9500, lifted to the 50000 floor)."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/projects/${p1}/deck-findings"
              payload: { finding_type: "MOISTURE_INTRUSION", severity: "MEDIUM", affected_area_sqft: 80.0, attachment_count_affected: 4 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f1: $.data.id }
            - call: "POST /reroof/projects/${p1}/deck-findings"
              payload: { finding_type: "FASTENER_PULLOUT", severity: "LOW", affected_area_sqft: 10.0, attachment_count_affected: 0 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f2: $.data.id }
          trigger:
            - call: "POST /reroof/deck-findings/${f1}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/deck-findings/${f2}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "GET /reroof/projects/${p1}"
              as: ProjectCoordinator
              captures: { rollup_both: $.data.scoped_upgrade_cost_cents }
            - call: "POST /reroof/deck-findings/${f1}/upgrade"
              payload: { action: "RESCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "GET /reroof/projects/${p1}"
              as: ProjectCoordinator
              captures: { rollup_after_rescope: $.data.scoped_upgrade_cost_cents }
            - call: "POST /reroof/deck-findings/${f1}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f1_cost_again: $.data.upgrade_cost_cents }
            - call: "GET /reroof/projects/${p1}"
              as: ProjectCoordinator
              captures: { rollup_restored: $.data.scoped_upgrade_cost_cents }
          assert:
            - "every trigger call returns HTTP 200"
            - "${rollup_both} == 156720"
            - "${rollup_after_rescope} == 50000"
            - "${f1_cost_again} == 106720"
            - "${rollup_restored} == 156720"
            - "DeckFinding.${f2}.upgrade_cost_cents == 50000"
            - "DeckFinding.${f2}.status == UPGRADE_SCOPED"
            - "DeckFinding.${f1}.status == UPGRADE_SCOPED"
            - "DeckFinding.${f1}.scoped_by_party_id == ${roofer_id}"
            - "DeckFinding.${f1}.scoped_at == 2026-08-01T00:00:00Z"
            - "ReroofProject.${p1}.posture == OPEN"
            - "ReroofProject.${p1}.open_critical_finding_count == 0"

      - name: corner_multi_level_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.DeckFinding.transitions["OPEN -> UPGRADE_SCOPED"]
        excluded_because:
          difficulty_instance: critical_structural_scoping_reopens_permit_invalidates_inspection_and_downgrades_posture
          rationale: "That difficulty instance already walks the deepest chain the scaffold has - finding to permit to inspection to project posture - in one request and asserts every level, including the levels that must NOT move; a second end-to-end cascade test would restate it."

      - name: corner_both_credit_variants_produce_their_own_result_and_the_switch_delta_is_correct
        claim_type: dual_variant_calculation
        grounds:
          - calculations.downtime_production_loss_credit
        excluded_because:
          difficulty_instance: downtime_credit_provisional_forward_looking_vs_final_chronological_reconciliation
          rationale: "The difficulty instance runs one project through both variants and reconciles the settlement delta across the four ledger buckets, which is exactly this layer's claim; the corner file adds only the input-set and ownership-factor angles, which live in the calculations section."

  - section: consistency_model
    instances:
      - name: corner_every_cascaded_change_is_visible_immediately_without_a_second_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.HardwareUnit.transitions["REMOVED -> STORED"]
        distinguishing_aspect: "One storage call fires a four-level cascade - unit, bin occupancy, project counters and the project's own phase - and the consistency model forbids any of it from lagging: the response body already carries the derived storage_label, and reads issued immediately afterwards, with no retry or delay, must show occupied_slots 1, stored_unit_count 1 and phase DECK_WORK."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project is authorized and de-energized with exactly one REMOVED panel and an empty bin, so storing that panel is the call that also completes the DEENERGIZED to DECK_WORK bubble."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/projects/${p1}/array-circuits"
              payload: { circuit_label: "A1", module_count: 1, dc_kw: 0.41 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reroof/projects/${p1}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0001", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u1: $.data.id }
            - call: "POST /reroof/projects/${p1}/storage-bins"
              payload: { bin_label: "BIN-1", capacity_slots: 4 }
              as: ProjectCoordinator
              captures: { bin1: $.data.id }
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "DE_ENERGIZE", interlock_verified: true }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/removal"
              as: SolarContractor
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /reroof/hardware-units/${u1}/storage"
              payload: { storage_bin_id: "${bin1}" }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { label_in_write_response: $.data.storage_label, status_in_write_response: $.data.handling_status }
            - call: "GET /reroof/storage-bins/${bin1}"
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { occupied_now: $.data.occupied_slots }
            - call: "GET /reroof/projects/${p1}"
              as: ProjectCoordinator
              captures: { phase_now: $.data.phase, stored_now: $.data.stored_unit_count }
          assert:
            - "trigger call 1 returns HTTP 200"
            - "${status_in_write_response} == STORED"
            - "${label_in_write_response} == BIN-1-1"
            - "${occupied_now} == 1"
            - "${stored_now} == 1"
            - "${phase_now} == DECK_WORK"
            - "HardwareUnit.${u1}.stored_at == 2026-08-01T00:00:00Z"
            - "HardwareUnit.${u1}.storage_position == 1"
            - "HardwareUnit.${u1}.storage_bin_id == ${bin1}"
            - "ReroofProject.${p1}.registered_unit_count == 1"
            - "ReroofProject.${p1}.scrapped_unit_count == 0"
