# =============================================================================
# PRD Benchmark Scaffold — Emergency Alert Compliance & Test Participation
# §1.0 Response Envelope, §1.1 Entities, §1.2 State Machines,
# §1.2.1 Concurrency Rules, §1.3 Calculations, §1.4 Validations,
# §1.5 Endpoints, §1.6 Errors, §1.7 RBAC
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2444. Emergency Alert Compliance & Test Participation (broadcast station engineering and compliance): alert receiving equipment monitoring assignments with required sources per state plan, automatic alert forwarding rules by event code and location with mandatory versus optional relays, weekly and monthly test transmission and receipt logging with retention requirements, national test participation with pre-test equipment readiness and post-test filing of results, accessibility requirements including visual crawl and audio quality with caption interaction, equipment failure notification and repair timelines with logging of outages, wireless alert coordination and duplicate alert avoidance, station log review, public file obligations and inspection response

domain_name: "eas-compliance"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  state_machine_shape_notes: |
    AlertEvent carries two independent state dimensions (relay_state x
    accessibility_state). EquipmentOutage is cyclic
    (RESTORED -> VERIFICATION_FAILED -> REPAIR_IN_PROGRESS -> RESTORED).
    TestEvent is branching with revert (READY -> READINESS_PENDING).
    FilingRecord is branching (SUBMITTED -> ACCEPTED | REVERSED).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  relationship_pattern_notes: |
    one_to_many: Station -> EASDevice / MonitoringAssignment / TestEvent.
    many_to_many: MonitoringAssignment associates a Station with an EASDevice
    and a monitored source slot; TestLogEntry associates a TestEvent with an
    EASDevice.
    self_referential: AlertEvent.suppression_reference_alert_id -> AlertEvent.id.
    cross_aggregate: RelayRule and Station both hang off StatePlan, and
    AlertEvent references a RelayRule from the plan aggregate.
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "Expert (upper edge — 12 entities, 62 endpoints, 9 calculations, 10 state machines)"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StatePlan
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        required: true
        description: "Two-letter state code the plan governs."
        constraints: "exactly 2 uppercase letters"
      - name: plan_version_label
        type: string
        source: input
        required: true
        description: "Human-readable plan revision label, e.g. '2026-R2'."
      - name: required_source_types
        type: array
        source: input
        required: true
        description: "Monitoring source types every station under this plan must cover."
        constraints: "non-empty array of distinct enum values from {PEP, NWS, LP1, LP2, SATELLITE, IPAWS}"
      - name: mandatory_relay_event_codes
        type: array
        source: input
        required: true
        description: "Event codes whose relay is mandatory statewide regardless of RelayRule.relay_class."
        constraints: "array of 1-6 character uppercase event codes; may be empty"
      - name: required_source_count
        type: integer
        source: computed
        required: false
        description: "Cardinality of required_source_types; recomputed on create."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Plan lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED}"
      - name: activated_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant the plan was activated; null while DRAFT."
        default: null
      - name: superseded_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant a newer plan for the same state_code superseded this one."
        default: null

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: state_plan_id
        type: string
        source: input
        required: true
        description: "FK -> StatePlan.id; the state plan whose source requirements and relay rules bind this station."
      - name: call_sign
        type: string
        source: input
        required: true
        description: "Broadcast call sign; unique across stations."
        constraints: "3-8 uppercase alphanumeric characters, unique"
      - name: service_type
        type: enum
        source: input
        required: true
        description: "Broadcast service class of the station."
        constraints: "one of {TV, FM, AM, CABLE}"
      - name: engineer_user_ids
        type: array
        source: input
        required: true
        description: "Opaque operator ids authorized to act as StationEngineer for this station."
        constraints: "non-empty array of distinct strings"
      - name: certification_officer_user_id
        type: string
        source: input
        required: true
        description: "Opaque operator id authorized to act as CertifyingOfficer for this station; may also appear in engineer_user_ids, which is what makes ERR_SEGREGATION_OF_DUTIES reachable."
      - name: compliance_posture
        type: enum
        source: computed
        required: false
        description: "Derived gating posture; PROVISIONING until the first recompute event fires."
        default: "PROVISIONING"
        constraints: "one of {PROVISIONING, COMPLIANT, WATCH, SUSPENDED_FILINGS}"
      - name: compliance_score
        type: number
        source: computed
        required: false
        description: "Output of calculations.station_compliance_score; null while compliance_posture == PROVISIONING."
        default: null
      - name: compliance_variant_applied
        type: enum
        source: computed
        required: false
        description: "Which station_compliance_score variant produced compliance_score."
        default: null
        constraints: "one of {PROVISIONAL, CERTIFIED} or null"
      - name: accessible_source_count
        type: integer
        source: computed
        required: false
        description: "Count of distinct source_type values among this station's MonitoringAssignment rows with status == ACTIVE whose source_type is in the plan's required_source_types."
        default: 0
      - name: silent_assignment_count
        type: integer
        source: computed
        required: false
        description: "Count of this station's MonitoringAssignment rows with status == SILENT."
        default: 0
      - name: penalty_points_total
        type: number
        source: computed
        required: false
        description: "Sum of FilingRecord.penalty_points over this station's filings with status IN {SUBMITTED, ACCEPTED}."
        default: 0
      - name: plan_revalidation_required
        type: boolean
        source: computed
        required: false
        description: "Set true when the station's StatePlan becomes SUPERSEDED; cleared only by re-pointing the station at an ACTIVE plan."
        default: false
      - name: public_file_document_count
        type: integer
        source: computed
        required: false
        description: "Count of public-file documents uploaded through POST /stations/{id}/public-file-documents."
        default: 0
      - name: last_log_review_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant of the most recent POST /stations/{id}/run-log-review."
        default: null

  - name: RelayRule
    parent: null
    common_fields: true
    fields:
      - name: state_plan_id
        type: string
        source: input
        required: true
        description: "FK -> StatePlan.id; the plan this forwarding rule belongs to."
      - name: event_code
        type: string
        source: input
        required: true
        description: "Alert event code this rule forwards, e.g. 'TOR', 'RWT', 'NPT'."
        constraints: "1-6 uppercase alphanumeric characters"
      - name: fips_codes
        type: array
        source: input
        required: true
        description: "Location scope as FIPS codes; an empty array means statewide scope."
        constraints: "array of 5-digit FIPS strings; may be empty"
      - name: relay_class
        type: enum
        source: input
        required: true
        description: "Whether a matched alert must be relayed or may be relayed."
        constraints: "one of {MANDATORY, OPTIONAL}"
      - name: priority
        type: integer
        source: input
        required: true
        description: "Operator-assigned ranking key; lower value ranks earlier."
        constraints: "integer 1..100"
      - name: forward_delay_seconds
        type: integer
        source: input
        required: false
        description: "Configured forwarding delay applied when this rule is selected."
        default: 0
        constraints: "integer 0..600"
      - name: specificity
        type: integer
        source: computed
        required: false
        description: "2 when fips_codes is non-empty (county-scoped), 1 when fips_codes is empty (statewide)."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Rule lifecycle state; only ACTIVE rules enter the selector candidate pool."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, RETIRED}"

  - name: EASDevice
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; the station this alert receiving/encoding unit is installed at."
      - name: model_code
        type: string
        source: input
        required: true
        description: "Equipment model identifier."
      - name: device_role
        type: enum
        source: input
        required: true
        description: "Functional role of the unit."
        constraints: "one of {DECODER, ENCODER, MONITOR}"
      - name: firmware_version
        type: string
        source: input
        required: true
        description: "Installed firmware version string."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Device lifecycle state."
        default: "REGISTERED"
        constraints: "one of {REGISTERED, READY, FAILED, DECOMMISSIONED}"
      - name: readiness_check_passed
        type: boolean
        source: computed
        required: false
        description: "True once a readiness check with self_test_passed and firmware_current both true has succeeded."
        default: false
      - name: last_readiness_check_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant of the most recent readiness check attempt."
        default: null

  - name: MonitoringAssignment
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; the station that owes this monitoring obligation."
      - name: device_id
        type: string
        source: input
        required: true
        description: "FK -> EASDevice.id; the device tuned to this source."
      - name: source_type
        type: enum
        source: input
        required: true
        description: "Which monitoring source class this assignment covers."
        constraints: "one of {PEP, NWS, LP1, LP2, SATELLITE, IPAWS}"
      - name: source_call_sign
        type: string
        source: input
        required: true
        description: "Call sign of the monitored source; TestLogEntry.source_call_sign matches on this value."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Assignment lifecycle state."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SILENT, SUSPENDED, DECOMMISSIONED}"
      - name: counts_toward_required_sources
        type: boolean
        source: computed
        required: false
        description: "True when status == ACTIVE and source_type is in the station's plan required_source_types."
        default: false
      - name: last_receipt_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant of the most recent receipt recorded against this assignment."
        default: null
      - name: silence_flagged_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant the log review flagged this assignment SILENT."
        default: null
      - name: superseded_assignment_id
        type: string
        source: computed
        required: false
        description: "FK -> MonitoringAssignment.id; the prior ACTIVE assignment for the same station and source_type that this row superseded on create, or null."
        default: null

  - name: EquipmentOutage
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        required: true
        description: "FK -> EASDevice.id; the failed unit."
      - name: detected_at
        type: datetime
        source: input
        required: true
        description: "Operator-reported instant the failure was detected; both downtime clocks start here."
      - name: failure_summary
        type: string
        source: input
        required: true
        description: "Short description of the failure."
      - name: notified_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant the outage notification was filed with the system."
      - name: repair_started_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant of the most recent start-repair transition."
        default: null
      - name: restored_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant of the most recent restore transition."
        default: null
      - name: status
        type: enum
        source: computed
        required: false
        description: "Outage lifecycle state; cyclic through VERIFICATION_FAILED."
        default: "OPEN"
        constraints: "one of {OPEN, REPAIR_IN_PROGRESS, RESTORED, VERIFICATION_FAILED, CLOSED}"
      - name: repair_cycle_count
        type: integer
        source: computed
        required: false
        description: "Number of times the outage re-entered REPAIR_IN_PROGRESS from VERIFICATION_FAILED."
        default: 0
      - name: continuous_downtime_hours
        type: number
        source: computed
        required: false
        description: "CONTINUOUS_CLOCK variant of calculations.outage_downtime_hours."
        default: null
      - name: obligation_downtime_hours
        type: number
        source: computed
        required: false
        description: "OBLIGATION_CLOCK variant of calculations.outage_downtime_hours."
        default: null
      - name: continuous_clock_breached
        type: boolean
        source: computed
        required: false
        description: "True when continuous_downtime_hours > CONTINUOUS_BREACH_HOURS."
        default: false
      - name: obligation_breached
        type: boolean
        source: computed
        required: false
        description: "True when obligation_downtime_hours > REPAIR_DEADLINE_HOURS."
        default: false

  - name: AlertEvent
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; the station that received the alert."
      - name: event_code
        type: string
        source: input
        required: true
        description: "Received event code."
        constraints: "1-6 uppercase alphanumeric characters"
      - name: originator_sequence
        type: string
        source: input
        required: true
        description: "Originator sequence identifier used as the duplicate-detection key."
      - name: fips_codes
        type: array
        source: input
        required: true
        description: "FIPS codes carried in the alert's location field."
        constraints: "non-empty array of 5-digit FIPS strings"
      - name: received_at
        type: datetime
        source: input
        required: true
        description: "Operator-reported receipt instant; both suppression windows are measured against this value."
      - name: relay_state
        type: enum
        source: computed
        required: false
        description: "Forwarding dimension of the parallel state machine."
        default: "RECEIVED"
        constraints: "one of {RECEIVED, RELAY_PENDING, RELAYED, UNMATCHED_OPTIONAL, SUPPRESSED_DUPLICATE}"
      - name: accessibility_state
        type: enum
        source: computed
        required: false
        description: "Accessibility dimension of the parallel state machine; evolves independently of relay_state."
        default: "ACCESSIBILITY_UNVERIFIED"
        constraints: "one of {ACCESSIBILITY_UNVERIFIED, ACCESSIBILITY_PASSED, ACCESSIBILITY_FAILED}"
      - name: matched_relay_rule_id
        type: string
        source: computed
        required: false
        description: "FK -> RelayRule.id; the rule the selector chose, or null when the candidate pool was empty or the alert was suppressed."
        default: null
      - name: relay_class_applied
        type: enum
        source: computed
        required: false
        description: "Effective relay class after the plan's mandatory_relay_event_codes override."
        default: "NONE"
        constraints: "one of {MANDATORY, OPTIONAL, NONE}"
      - name: forward_delay_seconds_applied
        type: integer
        source: computed
        required: false
        description: "forward_delay_seconds copied from the selected RelayRule; 0 when no rule matched."
        default: 0
      - name: suppression_reference_alert_id
        type: string
        source: computed
        required: false
        description: "FK -> AlertEvent.id; the earlier same-station same-sequence alert that suppressed this one, or null when suppression came from a WirelessAlertNotice or did not occur."
        default: null
      - name: suppression_source
        type: enum
        source: computed
        required: false
        description: "Which suppression phase fired."
        default: "NONE"
        constraints: "one of {NONE, STATION_REPEAT, WIRELESS_NOTICE}"
      - name: visual_crawl_seconds
        type: integer
        source: input
        required: false
        description: "Measured on-screen crawl duration, supplied by POST /alert-events/{id}/verify-accessibility."
        default: null
        constraints: "integer 0..600"
      - name: audio_loudness_lufs
        type: number
        source: input
        required: false
        description: "Measured audio loudness in LUFS, supplied by POST /alert-events/{id}/verify-accessibility."
        default: null
        constraints: "number -60.0..0.0"
      - name: caption_interaction
        type: enum
        source: input
        required: false
        description: "Observed interaction between the alert crawl and closed captions, supplied by POST /alert-events/{id}/verify-accessibility."
        default: null
        constraints: "one of {NONE, CAPTION_SUPPRESSED, CRAWL_OVERLAP}"
      - name: accessibility_deficiency_points
        type: number
        source: computed
        required: false
        description: "Output of calculations.accessibility_pass_evaluation."
        default: null

  - name: WirelessAlertNotice
    parent: null
    common_fields: false
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; the station whose market the wireless alert covered."
      - name: originator_sequence
        type: string
        source: input
        required: true
        description: "Originator sequence identifier shared with the broadcast alert."
      - name: event_code
        type: string
        source: input
        required: true
        description: "Event code carried by the wireless alert."
        constraints: "1-6 uppercase alphanumeric characters"
      - name: wea_sent_at
        type: datetime
        source: input
        required: true
        description: "Instant the wireless alert was sent; anchors the closed buffered suppression window."
      - name: fips_codes
        type: array
        source: input
        required: true
        description: "FIPS codes the wireless alert targeted; suppression requires a non-empty intersection with the broadcast alert's fips_codes."
        constraints: "non-empty array of 5-digit FIPS strings"

  - name: TestEvent
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; the station participating in the test."
      - name: test_type
        type: enum
        source: input
        required: true
        description: "Which required test this event represents."
        constraints: "one of {WEEKLY, MONTHLY, NATIONAL}"
      - name: window_start_at
        type: datetime
        source: input
        required: true
        description: "Inclusive start of the transmission/receipt window."
      - name: window_end_at
        type: datetime
        source: input
        required: true
        description: "Exclusive end of the transmission/receipt window for overlap arithmetic; inclusive upper bound for logging admission."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Test lifecycle state; branching with revert from READY back to READINESS_PENDING."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, READINESS_PENDING, READY, LOGGED, FILED, FAILED_UNFILED}"
      - name: readiness_score
        type: number
        source: computed
        required: false
        description: "Output of calculations.test_event_readiness_score; cleared to null when the station posture cascade reverts the event."
        default: null
      - name: readiness_evaluated_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant of the most recent readiness evaluation."
        default: null
      - name: filing_deadline_at
        type: datetime
        source: computed
        required: false
        description: "window_end_at + FILING_DUE_DAYS days; computed at create."
      - name: logged_entry_count
        type: integer
        source: computed
        required: false
        description: "Count of TestLogEntry rows for this event."
        default: 0
      - name: retention_until_max
        type: datetime
        source: computed
        required: false
        description: "Maximum TestLogEntry.retention_until across this event's log entries."
        default: null

  - name: TestLogEntry
    parent: null
    common_fields: false
    fields:
      - name: test_event_id
        type: string
        source: input
        required: true
        description: "FK -> TestEvent.id; the test this log line belongs to."
      - name: device_id
        type: string
        source: input
        required: true
        description: "FK -> EASDevice.id; the unit that transmitted or received."
      - name: entry_kind
        type: enum
        source: input
        required: true
        description: "Whether the line records an outbound transmission or an inbound receipt."
        constraints: "one of {TRANSMISSION, RECEIPT}"
      - name: source_call_sign
        type: string
        source: input
        required: false
        description: "For RECEIPT lines, the monitored source's call sign; required for RECEIPT, forbidden for TRANSMISSION."
        default: null
      - name: logged_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant the line was appended."
      - name: logged_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the engineer who appended the line; ERR_SEGREGATION_OF_DUTIES compares the filer against this value."
      - name: retention_days_applied
        type: integer
        source: computed
        required: false
        description: "Retention term selected by calculations.retention_until."
      - name: retention_until
        type: datetime
        source: computed
        required: false
        description: "logged_at + retention_days_applied days."

  - name: FilingRecord
    parent: null
    common_fields: true
    fields:
      - name: test_event_id
        type: string
        source: input
        required: true
        description: "FK -> TestEvent.id; the test whose results this filing reports."
      - name: attestation_note
        type: string
        source: input
        required: true
        description: "Certifying officer's attestation text."
      - name: filed_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant the filing was submitted."
      - name: filed_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the certifying officer who submitted the filing."
      - name: late_days
        type: integer
        source: computed
        required: false
        description: "Whole days late relative to TestEvent.filing_deadline_at, 0 when on time."
      - name: entry_subtotal_points
        type: number
        source: computed
        required: false
        description: "Round-per-entry-then-sum subtotal from calculations.filing_penalty_points."
      - name: lateness_points
        type: number
        source: computed
        required: false
        description: "late_days * LATE_DAY_POINTS."
      - name: unconfirmed_relay_points
        type: number
        source: computed
        required: false
        description: "unconfirmed_mandatory_relay_count * UNCONFIRMED_RELAY_POINTS."
      - name: penalty_points
        type: number
        source: computed
        required: false
        description: "Capped total from calculations.filing_penalty_points."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Filing lifecycle state."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, ACCEPTED, REVERSED}"
      - name: reversal_reason
        type: string
        source: computed
        required: false
        description: "Reason recorded when the filing moved to REVERSED."
        default: null
      - name: superseded_filing_id
        type: string
        source: computed
        required: false
        description: "FK -> FilingRecord.id; the prior filing for the same TestEvent that this amendment superseded, or null."
        default: null

  - name: InspectionRequest
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; the station under inspection."
      - name: requested_document_kinds
        type: array
        source: input
        required: true
        description: "Public-file document kinds the inspector demands."
        constraints: "non-empty array of distinct values from {STATION_LOG, TEST_LOGS, PLAN_COPY, OUTAGE_LOG, ACCESSIBILITY_ATTESTATION}"
      - name: provided_document_kinds
        type: array
        source: input
        required: false
        description: "Document kinds the station attached, supplied by POST /inspection-requests/{id}/draft-response."
        default: []
      - name: requested_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant the request was opened."
      - name: response_due_at
        type: datetime
        source: computed
        required: false
        description: "requested_at + INSPECTION_RESPONSE_DAYS days."
      - name: responded_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock instant the response was submitted."
        default: null
      - name: completeness_score
        type: number
        source: computed
        required: false
        description: "Output of calculations.inspection_completeness_score; cleared to null when a plan supersede cascade reverts the response."
        default: null
      - name: status
        type: enum
        source: computed
        required: false
        description: "Inspection lifecycle state."
        default: "OPEN"
        constraints: "one of {OPEN, RESPONSE_DRAFTED, RESPONDED, CLOSED_SATISFIED, CLOSED_DEFICIENT}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StatePlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /state-plans/{id}/activate"
        actor: ComplianceAdmin
        preconditions:
          - "status == DRAFT"
          - "required_source_types is non-empty"
        side_effects:
          - "activated_at = logical clock now"
          - "PLAN-SUPERSEDE CASCADE hop 1: every other StatePlan with the same state_code and status == ACTIVE transitions ACTIVE -> SUPERSEDED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: hop 1 of the plan-supersede cascade fired by POST /state-plans/{id}/activate on a newer plan with the same state_code"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the newly activated plan's state_code equals this plan's state_code"
        side_effects:
          - "superseded_at = logical clock now"
          - "PLAN-SUPERSEDE CASCADE hop 2 (caused by this row becoming SUPERSEDED, not by the activate call): every Station with state_plan_id == this plan sets plan_revalidation_required = true and re-runs calculations.station_compliance_score, which moves compliance_posture per the score bands"
          - "hop 2's flag flip is what triggers hop 3 — see state_machines.InspectionRequest.RESPONDED_to_RESPONSE_DRAFTED"

  - entity: Station
    state_field: compliance_posture
    initial_state: PROVISIONING
    terminal_states: []
    recompute_events: &station_recompute_events
      - "POST /stations/{id}/run-log-review"
      - "POST /monitoring-assignments"
      - "POST /monitoring-assignments/{id}/decommission"
      - "POST /monitoring-assignments/{id}/reinstate"
      - "POST /monitoring-assignments/{id}/record-receipt"
      - "POST /equipment-outages (via hop 2 of the outage cascade)"
      - "POST /equipment-outages/{id}/close"
      - "POST /filing-records"
      - "POST /filing-records/{id}/accept"
      - "POST /filing-records/{id}/reverse"
      - "system: hop 2 of the plan-supersede cascade"
    transitions:
      - from: PROVISIONING
        to: COMPLIANT
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["calculations.station_compliance_score result >= COMPLIANT_MIN_SCORE (90.00)"]
        side_effects: ["compliance_score and compliance_variant_applied written", "last_log_review_at set only when the recompute event was run-log-review"]
      - from: PROVISIONING
        to: WATCH
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["WATCH_MIN_SCORE (75.00) <= score < COMPLIANT_MIN_SCORE (90.00)"]
        side_effects: ["compliance_score and compliance_variant_applied written"]
      - from: PROVISIONING
        to: SUSPENDED_FILINGS
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["score < WATCH_MIN_SCORE (75.00)"]
        side_effects:
          - "compliance_score and compliance_variant_applied written"
          - "OUTAGE CASCADE hop 4 (caused by this posture change): every TestEvent for this station with status == READY reverts READY -> READINESS_PENDING and readiness_score is cleared to null"
      - from: COMPLIANT
        to: WATCH
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["WATCH_MIN_SCORE (75.00) <= score < COMPLIANT_MIN_SCORE (90.00)"]
        side_effects: ["compliance_score and compliance_variant_applied written"]
      - from: COMPLIANT
        to: SUSPENDED_FILINGS
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["score < WATCH_MIN_SCORE (75.00)"]
        side_effects:
          - "compliance_score and compliance_variant_applied written"
          - "OUTAGE CASCADE hop 4 (caused by this posture change): every TestEvent for this station with status == READY reverts READY -> READINESS_PENDING and readiness_score is cleared to null"
      - from: WATCH
        to: COMPLIANT
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["score >= COMPLIANT_MIN_SCORE (90.00)"]
        side_effects: ["compliance_score and compliance_variant_applied written"]
      - from: WATCH
        to: SUSPENDED_FILINGS
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["score < WATCH_MIN_SCORE (75.00)"]
        side_effects:
          - "compliance_score and compliance_variant_applied written"
          - "OUTAGE CASCADE hop 4 (caused by this posture change): every TestEvent for this station with status == READY reverts READY -> READINESS_PENDING and readiness_score is cleared to null"
      - from: SUSPENDED_FILINGS
        to: WATCH
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["WATCH_MIN_SCORE (75.00) <= score < COMPLIANT_MIN_SCORE (90.00)"]
        side_effects: ["compliance_score and compliance_variant_applied written"]
      - from: SUSPENDED_FILINGS
        to: COMPLIANT
        trigger: "any recompute event listed in recompute_events"
        actor: system
        preconditions: ["score >= COMPLIANT_MIN_SCORE (90.00)"]
        side_effects: ["compliance_score and compliance_variant_applied written"]

  - entity: EASDevice
    state_field: status
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: READY
        trigger: "POST /eas-devices/{id}/readiness-check"
        actor: StationEngineer
        preconditions: ["status == REGISTERED", "self_test_passed == true", "firmware_current == true"]
        side_effects: ["readiness_check_passed = true", "last_readiness_check_at = logical clock now"]
      - from: REGISTERED
        to: REGISTERED
        trigger: "POST /eas-devices/{id}/readiness-check with self_test_passed == false or firmware_current == false"
        actor: StationEngineer
        preconditions: ["status == REGISTERED"]
        side_effects: ["readiness_check_passed = false", "last_readiness_check_at = logical clock now", "status unchanged"]
      - from: READY
        to: READY
        trigger: "POST /eas-devices/{id}/readiness-check re-run with both flags true"
        actor: StationEngineer
        preconditions: ["status == READY"]
        side_effects: ["last_readiness_check_at = logical clock now"]
      - from: READY
        to: FAILED
        trigger: "POST /equipment-outages"
        actor: StationEngineer
        preconditions: ["status IN {REGISTERED, READY}"]
        side_effects:
          - "OUTAGE CASCADE hop 1 (direct effect of the outage create)"
          - "OUTAGE CASCADE hop 2 (caused by this device becoming FAILED): every MonitoringAssignment with device_id == this device and status IN {ACTIVE, SILENT} transitions to SUSPENDED"
      - from: REGISTERED
        to: FAILED
        trigger: "POST /equipment-outages"
        actor: StationEngineer
        preconditions: ["status IN {REGISTERED, READY}"]
        side_effects:
          - "OUTAGE CASCADE hop 1 (direct effect of the outage create)"
          - "OUTAGE CASCADE hop 2 (caused by this device becoming FAILED): every MonitoringAssignment with device_id == this device and status IN {ACTIVE, SILENT} transitions to SUSPENDED"
      - from: FAILED
        to: READY
        trigger: "POST /equipment-outages/{id}/close"
        actor: ComplianceAdmin
        preconditions: ["the closing outage's status == RESTORED", "no other EquipmentOutage on this device has status IN {OPEN, REPAIR_IN_PROGRESS, VERIFICATION_FAILED}"]
        side_effects: ["every MonitoringAssignment on this device with status == SUSPENDED transitions to SILENT (a fresh receipt is required before it counts again)", "station recompute event fires"]
      - from: READY
        to: DECOMMISSIONED
        trigger: "POST /eas-devices/{id}/decommission"
        actor: ComplianceAdmin
        preconditions: ["status != DECOMMISSIONED", "no MonitoringAssignment on this device has status IN {ACTIVE, SILENT, SUSPENDED}"]
        side_effects: ["device leaves every readiness denominator (calculations.test_event_readiness_score counts only status IN {REGISTERED, READY, FAILED})"]
      - from: REGISTERED
        to: DECOMMISSIONED
        trigger: "POST /eas-devices/{id}/decommission"
        actor: ComplianceAdmin
        preconditions: ["status != DECOMMISSIONED", "no MonitoringAssignment on this device has status IN {ACTIVE, SILENT, SUSPENDED}"]
        side_effects: ["device leaves every readiness denominator"]
      - from: FAILED
        to: DECOMMISSIONED
        trigger: "POST /eas-devices/{id}/decommission"
        actor: ComplianceAdmin
        preconditions: ["status != DECOMMISSIONED", "no MonitoringAssignment on this device has status IN {ACTIVE, SILENT, SUSPENDED}"]
        side_effects: ["device leaves every readiness denominator"]

  - entity: MonitoringAssignment
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SILENT
        trigger: "POST /stations/{id}/run-log-review phase 1 silence sweep"
        actor: system
        preconditions: ["status == ACTIVE", "coalesce(last_receipt_at, created_at) < now - SILENCE_MAX_DAYS (8) days"]
        side_effects: ["silence_flagged_at = now", "Station.silent_assignment_count recomputed", "Station.accessible_source_count recomputed (SILENT rows do not count)"]
      - from: SILENT
        to: ACTIVE
        trigger: "POST /monitoring-assignments/{id}/record-receipt, or POST /test-log-entries with entry_kind == RECEIPT whose source_call_sign equals this row's source_call_sign"
        actor: StationEngineer
        preconditions: ["status == SILENT"]
        side_effects: ["last_receipt_at = logical clock now", "silence_flagged_at = null", "Station recompute event fires"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /monitoring-assignments/{id}/record-receipt, or POST /test-log-entries with entry_kind == RECEIPT whose source_call_sign matches"
        actor: StationEngineer
        preconditions: ["status == ACTIVE"]
        side_effects: ["last_receipt_at = logical clock now"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: OUTAGE CASCADE hop 2, caused by this row's EASDevice becoming FAILED"
        actor: system
        preconditions: ["status IN {ACTIVE, SILENT}", "the referenced EASDevice just transitioned to FAILED"]
        side_effects:
          - "OUTAGE CASCADE hop 3 (caused by this row leaving ACTIVE): Station.accessible_source_count is recomputed and calculations.station_compliance_score re-runs, moving compliance_posture per the score bands"
      - from: SILENT
        to: SUSPENDED
        trigger: "system: OUTAGE CASCADE hop 2, caused by this row's EASDevice becoming FAILED"
        actor: system
        preconditions: ["status IN {ACTIVE, SILENT}"]
        side_effects: ["OUTAGE CASCADE hop 3: Station recompute"]
      - from: SUSPENDED
        to: SILENT
        trigger: "POST /equipment-outages/{id}/close returning the device to READY"
        actor: ComplianceAdmin
        preconditions: ["status == SUSPENDED", "the referenced EASDevice just transitioned FAILED -> READY"]
        side_effects: ["silence_flagged_at = now", "Station recompute event fires"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /monitoring-assignments/{id}/decommission"
        actor: StationEngineer
        preconditions: ["status IN {ACTIVE, SILENT, SUSPENDED}"]
        side_effects: ["Station.accessible_source_count recomputed", "Station recompute event fires"]
      - from: SILENT
        to: DECOMMISSIONED
        trigger: "POST /monitoring-assignments/{id}/decommission"
        actor: StationEngineer
        preconditions: ["status IN {ACTIVE, SILENT, SUSPENDED}"]
        side_effects: ["Station.accessible_source_count recomputed", "Station recompute event fires"]
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /monitoring-assignments/{id}/decommission"
        actor: StationEngineer
        preconditions: ["status IN {ACTIVE, SILENT, SUSPENDED}"]
        side_effects: ["Station.accessible_source_count recomputed", "Station recompute event fires"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "system: supersede — POST /monitoring-assignments created a newer row for the same station_id and source_type"
        actor: system
        preconditions: ["status == ACTIVE", "the new row has the same station_id and source_type"]
        side_effects: ["the new row's superseded_assignment_id is set to this row's id", "Station.accessible_source_count recomputed once, after the supersede"]
        note: "This is the CREATE-with-supersede race that concurrency_rules.assignment-create-stale-station guards with OCC on Station.version."
      - from: DECOMMISSIONED
        to: ACTIVE
        trigger: "POST /monitoring-assignments/{id}/reinstate"
        actor: StationEngineer
        preconditions: ["status == DECOMMISSIONED", "no other MonitoringAssignment for the same station_id has status == ACTIVE with the same source_type", "the referenced EASDevice status == READY"]
        side_effects: ["Station.accessible_source_count recomputed", "Station recompute event fires"]

  - entity: EquipmentOutage
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REPAIR_IN_PROGRESS
        trigger: "POST /equipment-outages/{id}/start-repair"
        actor: StationEngineer
        preconditions: ["status IN {OPEN, VERIFICATION_FAILED}"]
        side_effects: ["repair_started_at = logical clock now"]
      - from: VERIFICATION_FAILED
        to: REPAIR_IN_PROGRESS
        trigger: "POST /equipment-outages/{id}/start-repair"
        actor: StationEngineer
        preconditions: ["status IN {OPEN, VERIFICATION_FAILED}"]
        side_effects: ["repair_started_at = logical clock now", "repair_cycle_count += 1"]
        note: "Closes the cycle RESTORED -> VERIFICATION_FAILED -> REPAIR_IN_PROGRESS -> RESTORED; detected_at is never reset, so both downtime clocks keep accruing across cycles."
      - from: REPAIR_IN_PROGRESS
        to: RESTORED
        trigger: "POST /equipment-outages/{id}/restore"
        actor: StationEngineer
        preconditions: ["status == REPAIR_IN_PROGRESS"]
        side_effects:
          - "restored_at = logical clock now"
          - "calculations.outage_downtime_hours runs both variants: continuous_downtime_hours and obligation_downtime_hours are written"
          - "continuous_clock_breached and obligation_breached recomputed"
      - from: RESTORED
        to: VERIFICATION_FAILED
        trigger: "POST /equipment-outages/{id}/fail-verification"
        actor: ComplianceAdmin
        preconditions: ["status == RESTORED"]
        side_effects: ["restored_at cleared to null", "continuous_downtime_hours and obligation_downtime_hours cleared to null", "the device remains FAILED"]
      - from: RESTORED
        to: CLOSED
        trigger: "POST /equipment-outages/{id}/close"
        actor: ComplianceAdmin
        preconditions: ["status == RESTORED"]
        side_effects:
          - "the referenced EASDevice transitions FAILED -> READY"
          - "every MonitoringAssignment on that device with status == SUSPENDED transitions to SILENT"
          - "Station recompute event fires"

  - entity: AlertEvent
    state_field: relay_state
    initial_state: RECEIVED
    terminal_states: [RELAYED, UNMATCHED_OPTIONAL, SUPPRESSED_DUPLICATE]
    note: "RECEIVED is resolved inside the same POST /alert-events request (consistency_model: immediate), so it is never observable in a response body."
    transitions:
      - from: RECEIVED
        to: SUPPRESSED_DUPLICATE
        trigger: "POST /alert-events"
        actor: StationEngineer
        preconditions: ["calculations.duplicate_suppression_window returns a suppression (phase A STATION_REPEAT or phase B WIRELESS_NOTICE)"]
        side_effects: ["suppression_source set to STATION_REPEAT or WIRELESS_NOTICE", "suppression_reference_alert_id set for STATION_REPEAT, left null for WIRELESS_NOTICE", "matched_relay_rule_id stays null and relay_class_applied stays NONE — the relay selector does not run"]
      - from: RECEIVED
        to: UNMATCHED_OPTIONAL
        trigger: "POST /alert-events"
        actor: StationEngineer
        preconditions: ["no suppression fired", "calculations.relay_rule_selection candidate pool is empty"]
        side_effects: ["matched_relay_rule_id = null", "relay_class_applied = NONE", "forward_delay_seconds_applied = 0"]
      - from: RECEIVED
        to: RELAY_PENDING
        trigger: "POST /alert-events"
        actor: StationEngineer
        preconditions: ["no suppression fired", "calculations.relay_rule_selection selected a rule"]
        side_effects: ["matched_relay_rule_id, relay_class_applied and forward_delay_seconds_applied written from the selected rule"]
      - from: RELAY_PENDING
        to: RELAYED
        trigger: "POST /alert-events/{id}/confirm-relay"
        actor: StationEngineer
        preconditions: ["relay_state == RELAY_PENDING"]
        side_effects: ["the alert leaves the unconfirmed_mandatory_relay_count input set of calculations.filing_penalty_points"]

  - entity: AlertEvent
    state_field: accessibility_state
    initial_state: ACCESSIBILITY_UNVERIFIED
    terminal_states: [ACCESSIBILITY_PASSED, ACCESSIBILITY_FAILED]
    note: "Second, independent dimension on the same row: relay_state and accessibility_state advance without constraining each other."
    transitions:
      - from: ACCESSIBILITY_UNVERIFIED
        to: ACCESSIBILITY_PASSED
        trigger: "POST /alert-events/{id}/verify-accessibility"
        actor: StationEngineer
        preconditions: ["accessibility_state == ACCESSIBILITY_UNVERIFIED", "calculations.accessibility_pass_evaluation deficiency_points <= ACCESSIBILITY_PASS_MAX_POINTS (1.00)"]
        side_effects: ["visual_crawl_seconds, audio_loudness_lufs, caption_interaction and accessibility_deficiency_points written", "relay_state is NOT touched"]
      - from: ACCESSIBILITY_UNVERIFIED
        to: ACCESSIBILITY_FAILED
        trigger: "POST /alert-events/{id}/verify-accessibility"
        actor: StationEngineer
        preconditions: ["accessibility_state == ACCESSIBILITY_UNVERIFIED", "deficiency_points > ACCESSIBILITY_PASS_MAX_POINTS (1.00)"]
        side_effects: ["measurement fields and accessibility_deficiency_points written", "relay_state is NOT touched"]

  - entity: TestEvent
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [FILED, FAILED_UNFILED]
    transitions:
      - from: SCHEDULED
        to: READY
        trigger: "POST /test-events/{id}/evaluate-readiness"
        actor: StationEngineer
        preconditions: ["status IN {SCHEDULED, READINESS_PENDING}", "now >= window_start_at - PREFLIGHT_HOURS (24) hours", "now <= window_end_at", "calculations.test_event_readiness_score >= READINESS_PASS_MIN (80.00)"]
        side_effects: ["readiness_score and readiness_evaluated_at written"]
      - from: SCHEDULED
        to: READINESS_PENDING
        trigger: "POST /test-events/{id}/evaluate-readiness"
        actor: StationEngineer
        preconditions: ["status IN {SCHEDULED, READINESS_PENDING}", "readiness window open", "readiness_score < READINESS_PASS_MIN (80.00)"]
        side_effects: ["readiness_score and readiness_evaluated_at written"]
      - from: READINESS_PENDING
        to: READY
        trigger: "POST /test-events/{id}/evaluate-readiness re-run"
        actor: StationEngineer
        preconditions: ["status == READINESS_PENDING", "readiness window open", "readiness_score >= READINESS_PASS_MIN (80.00)"]
        side_effects: ["readiness_score and readiness_evaluated_at overwritten"]
      - from: READY
        to: READINESS_PENDING
        trigger: "system: OUTAGE CASCADE hop 4, caused by the station's compliance_posture transitioning to SUSPENDED_FILINGS"
        actor: system
        preconditions: ["status == READY", "the owning Station just entered SUSPENDED_FILINGS"]
        side_effects: ["readiness_score cleared to null", "readiness_evaluated_at cleared to null"]
      - from: READY
        to: LOGGED
        trigger: "POST /test-events/{id}/close-logging"
        actor: StationEngineer
        preconditions: ["status == READY", "logged_entry_count >= 1"]
        side_effects: ["retention_until_max refreshed from the event's TestLogEntry rows"]
      - from: LOGGED
        to: FILED
        trigger: "POST /filing-records"
        actor: CertifyingOfficer
        preconditions: ["status IN {LOGGED, FILED}", "expected_test_event_version matches version", "now <= filing_deadline_at + FILING_GRACE_DAYS (10) days"]
        side_effects: ["version incremented by 1", "Station.penalty_points_total recomputed", "Station recompute event fires"]
      - from: FILED
        to: FILED
        trigger: "POST /filing-records (amendment that supersedes the prior filing)"
        actor: CertifyingOfficer
        preconditions: ["status == FILED", "expected_test_event_version matches the current version"]
        side_effects: ["the prior FilingRecord with status IN {SUBMITTED, ACCEPTED} transitions to REVERSED with reversal_reason = 'SUPERSEDED_BY_AMENDMENT'", "version incremented by 1", "Station.penalty_points_total recomputed"]
      - from: READY
        to: FAILED_UNFILED
        trigger: "POST /stations/{id}/run-log-review phase 2"
        actor: system
        preconditions: ["status IN {READY, LOGGED}", "now > filing_deadline_at"]
        side_effects: ["the event enters the unfiled_test_count input set of the CERTIFIED variant of calculations.station_compliance_score"]
      - from: LOGGED
        to: FAILED_UNFILED
        trigger: "POST /stations/{id}/run-log-review phase 2"
        actor: system
        preconditions: ["status IN {READY, LOGGED}", "now > filing_deadline_at"]
        side_effects: ["the event enters the unfiled_test_count input set of the CERTIFIED variant of calculations.station_compliance_score"]

  - entity: FilingRecord
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REVERSED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /filing-records/{id}/accept"
        actor: ComplianceAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["the station becomes eligible for the CERTIFIED variant of calculations.station_compliance_score", "Station recompute event fires"]
      - from: SUBMITTED
        to: REVERSED
        trigger: "POST /filing-records/{id}/reverse, or the amendment supersede side effect of POST /filing-records"
        actor: ComplianceAdmin
        preconditions: ["status IN {SUBMITTED, ACCEPTED}"]
        side_effects:
          - "reversal_reason written"
          - "COMPENSATION: this row leaves the Station.penalty_points_total input set, so penalty_points_total returns to its exact pre-filing value"
          - "Station recompute event fires"
      - from: ACCEPTED
        to: REVERSED
        trigger: "POST /filing-records/{id}/reverse"
        actor: ComplianceAdmin
        preconditions: ["status IN {SUBMITTED, ACCEPTED}"]
        side_effects:
          - "reversal_reason written"
          - "COMPENSATION: penalty_points_total returns to its exact pre-filing value; the station also loses CERTIFIED eligibility if no other ACCEPTED filing remains in the 365-day window"
          - "Station recompute event fires"

  - entity: InspectionRequest
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED_SATISFIED, CLOSED_DEFICIENT]
    transitions:
      - from: OPEN
        to: RESPONSE_DRAFTED
        trigger: "POST /inspection-requests/{id}/draft-response"
        actor: StationEngineer
        preconditions: ["status IN {OPEN, RESPONSE_DRAFTED}"]
        side_effects: ["provided_document_kinds overwritten with the supplied array"]
      - from: RESPONSE_DRAFTED
        to: RESPONSE_DRAFTED
        trigger: "POST /inspection-requests/{id}/draft-response re-run"
        actor: StationEngineer
        preconditions: ["status IN {OPEN, RESPONSE_DRAFTED}"]
        side_effects: ["provided_document_kinds overwritten"]
      - from: RESPONSE_DRAFTED
        to: RESPONDED
        trigger: "POST /inspection-requests/{id}/submit-response"
        actor: CertifyingOfficer
        preconditions: ["status == RESPONSE_DRAFTED", "provided_document_kinds is non-empty"]
        side_effects: ["responded_at = now", "calculations.inspection_completeness_score runs and writes completeness_score"]
      - from: RESPONDED
        to: RESPONSE_DRAFTED
        trigger: "system: PLAN-SUPERSEDE CASCADE hop 3, caused by the station's plan_revalidation_required flipping to true in hop 2"
        actor: system
        preconditions: ["status == RESPONDED", "the owning Station's plan_revalidation_required just flipped false -> true"]
        side_effects: ["completeness_score cleared to null", "responded_at cleared to null", "provided_document_kinds retained so the station can re-attest against the new plan"]
      - from: RESPONDED
        to: CLOSED_SATISFIED
        trigger: "POST /inspection-requests/{id}/close"
        actor: FieldInspector
        preconditions: ["status == RESPONDED", "completeness_score >= INSPECTION_SATISFIED_MIN (100.00)"]
        side_effects: ["request becomes terminal"]
      - from: RESPONDED
        to: CLOSED_DEFICIENT
        trigger: "POST /inspection-requests/{id}/close"
        actor: FieldInspector
        preconditions: ["status == RESPONDED", "completeness_score < INSPECTION_SATISFIED_MIN (100.00)"]
        side_effects: ["request becomes terminal"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-station
    parent_entity: Station
    write_endpoint: "POST /monitoring-assignments"
    occ_field: "expected_station_version"
    description: |
      Creating a MonitoringAssignment against a Station whose version has
      advanced since the client last read it is rejected. A create for a
      source_type the station already covers legitimately supersedes the prior
      ACTIVE assignment (see state_machines.MonitoringAssignment supersede
      transition), so a writer holding a stale view of the station would
      silently retire an assignment it never observed. The stale
      expected_station_version makes that rejection deterministic.
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412

  - rule_id: filing-create-stale-test-event
    parent_entity: TestEvent
    write_endpoint: "POST /filing-records"
    occ_field: "expected_test_event_version"
    description: |
      Creating a FilingRecord against a TestEvent whose version has advanced
      since the client last read it is rejected. A second filing on a FILED
      event is a legitimate amendment that reverses the prior filing
      (state_machines.TestEvent.FILED_to_FILED), so an officer working from a
      stale view of the event would reverse a filing whose penalty points it
      never saw. The stale expected_test_event_version rejects that write with
      412 instead.
    error_id: ERR_STALE_TEST_EVENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: relay_rule_selection
    description: "Selector that picks at most one RelayRule for a newly received alert."
    trigger: "POST /alert-events, after duplicate_suppression_window returns NONE"
    algorithm: selector_policy
    inputs: [AlertEvent.event_code, AlertEvent.fips_codes, Station.state_plan_id, RelayRule.status, RelayRule.fips_codes, RelayRule.specificity, RelayRule.priority, RelayRule.created_at, StatePlan.mandatory_relay_event_codes]
    input_set: |
      Candidate pool = RelayRule rows where
        state_plan_id == station.state_plan_id
        AND status == ACTIVE
        AND event_code == alert.event_code
        AND (fips_codes == [] OR intersection(fips_codes, alert.fips_codes) is non-empty)
    formula: |
      # (a) eligibility filter — see input_set
      # (b) ranking expression, applied in this exact order:
      #       specificity DESC   (2 = county-scoped beats 1 = statewide)
      #       priority ASC       (lower integer ranks earlier)
      # (c) tie-break when specificity and priority both tie:
      #       created_at ASC     (never id)
      # (d) empty-pool fallback:
      #       relay_state = UNMATCHED_OPTIONAL, matched_relay_rule_id = null,
      #       relay_class_applied = NONE, forward_delay_seconds_applied = 0
      selected = first row of sort(pool, key=(-specificity, priority, created_at))
      matched_relay_rule_id            = selected.id
      forward_delay_seconds_applied    = selected.forward_delay_seconds
      relay_class_applied = MANDATORY if (selected.relay_class == MANDATORY
                                          OR alert.event_code IN plan.mandatory_relay_event_codes)
                            else OPTIONAL
      relay_state = RELAY_PENDING
    constants: {}
    precision: "integers only; no rounding"

  - name: duplicate_suppression_window
    description: "Two-phase duplicate-alert avoidance; the two phases use deliberately different interval semantics."
    trigger: "POST /alert-events, before relay_rule_selection"
    algorithm: interval_merge
    inputs: [AlertEvent.received_at, AlertEvent.originator_sequence, AlertEvent.event_code, AlertEvent.fips_codes, AlertEvent.station_id, WirelessAlertNotice.wea_sent_at, WirelessAlertNotice.fips_codes]
    input_set: |
      Phase A pool = AlertEvent rows with the same station_id, the same
        originator_sequence and the same event_code, any relay_state.
      Phase B pool = WirelessAlertNotice rows with the same station_id, the
        same originator_sequence and the same event_code.
    formula: |
      t = new.received_at

      # PHASE A — station repeat. HALF-OPEN interval, no buffer, no FIPS test.
      #   window_A = [t - STATION_DEDUP_SECONDS, t)      # lower bound inclusive, upper bound exclusive
      candidates_A = phase A pool rows whose received_at is in window_A
      if candidates_A is non-empty:
          reference = max(candidates_A by received_at); tie-break created_at ASC
          relay_state                   = SUPPRESSED_DUPLICATE
          suppression_source            = STATION_REPEAT
          suppression_reference_alert_id = reference.id
          STOP (the relay selector does not run)

      # PHASE B — wireless coordination. CLOSED interval, symmetric buffer,
      #           and a non-empty FIPS intersection is additionally required.
      #   window_B = [w.wea_sent_at - WEA_BUFFER_SECONDS,
      #               w.wea_sent_at + WEA_MATCH_SECONDS + WEA_BUFFER_SECONDS]   # both bounds inclusive
      for w in phase B pool:
          if t is in window_B AND intersection(w.fips_codes, new.fips_codes) is non-empty:
              relay_state                    = SUPPRESSED_DUPLICATE
              suppression_source             = WIRELESS_NOTICE
              suppression_reference_alert_id = null
              STOP
      # otherwise
      suppression_source = NONE
    constants:
      STATION_DEDUP_SECONDS: 900
      WEA_MATCH_SECONDS: 1800
      WEA_BUFFER_SECONDS: 120
    precision: "whole-second timestamp comparison"

  - name: accessibility_pass_evaluation
    description: "Combinatorial mode (a): three inputs with a non-linear coupling term, nested min/max, and a hard cap."
    trigger: "POST /alert-events/{id}/verify-accessibility"
    algorithm: weighted_scoring
    inputs: [AlertEvent.visual_crawl_seconds, AlertEvent.audio_loudness_lufs, AlertEvent.caption_interaction]
    input_set: "the single AlertEvent named in the path; accessibility_state must be ACCESSIBILITY_UNVERIFIED"
    formula: |
      crawl_shortfall_seconds = max(0, CRAWL_MIN_SECONDS - visual_crawl_seconds)
      loudness_excess_lu      = max(0.0, abs(audio_loudness_lufs - TARGET_LUFS) - LOUDNESS_TOLERANCE_LU)
      caption_penalty_points  = { NONE: 0.00, CAPTION_SUPPRESSED: 1.50, CRAWL_OVERLAP: 2.00 }[caption_interaction]

      # non-linear interaction: audio deviation is amplified by crawl shortfall,
      # and the amplified term is itself capped before it enters the total.
      coupled_points = min(CRAWL_COUPLING_CAP,
                           crawl_shortfall_seconds * loudness_excess_lu * COUPLING_RATE)
      base_points    = crawl_shortfall_seconds * CRAWL_POINT_RATE
                     + loudness_excess_lu      * LOUDNESS_POINT_RATE

      # single rounding, applied once, AFTER the outer min()
      accessibility_deficiency_points = round(min(DEFICIENCY_CAP,
                                                 base_points + coupled_points + caption_penalty_points), 2)
      accessibility_state = ACCESSIBILITY_PASSED
                            if accessibility_deficiency_points <= ACCESSIBILITY_PASS_MAX_POINTS
                            else ACCESSIBILITY_FAILED
    constants:
      CRAWL_MIN_SECONDS: 60
      TARGET_LUFS: -24.0
      LOUDNESS_TOLERANCE_LU: 2.0
      CRAWL_POINT_RATE: 0.05
      LOUDNESS_POINT_RATE: 0.10
      COUPLING_RATE: 0.01
      CRAWL_COUPLING_CAP: 3.00
      DEFICIENCY_CAP: 8.00
      ACCESSIBILITY_PASS_MAX_POINTS: 1.00
    precision: "2 decimal places, round_half_up, rounded exactly once at the end"

  - name: filing_penalty_points
    description: "Combinatorial mode (b): nested rounding whose ORDER is pinned — round per log entry, then sum. Summing raw per-entry values and rounding once produces different cents."
    trigger: "POST /filing-records"
    algorithm: aggregation
    inputs: [TestEvent.filing_deadline_at, TestLogEntry.entry_kind, AlertEvent.relay_state, AlertEvent.relay_class_applied]
    input_set: |
      Per-entry pool = every TestLogEntry with test_event_id == this filing's
        test_event_id (all entries, no status filter — TestLogEntry is
        append-only and has no status), ordered created_at ASC.
      Unconfirmed relay pool = AlertEvent rows with station_id == the test
        event's station_id, relay_class_applied == MANDATORY,
        relay_state == RELAY_PENDING, and received_at inside the CLOSED
        interval [filed_at - RELAY_LOOKBACK_DAYS days, filed_at].
    formula: |
      filed_at  = logical clock now
      late_days = 0 if filed_at <= test_event.filing_deadline_at
                  else ceil((filed_at - test_event.filing_deadline_at) / 86400 seconds)

      kind_weight(e) = 1.0 if e.entry_kind == RECEIPT else 1.8      # TRANSMISSION

      # PINNED ROUNDING ORDER — round each entry to 2dp FIRST, then sum.
      # (The rejected alternative, round(sum of raw per-entry values, 2),
      #  yields a different total; the pinned order is normative.)
      per_entry_points(e)   = round(late_days * PER_ENTRY_LATE_RATE * kind_weight(e), 2)
      entry_subtotal_points = sum over e in per-entry pool of per_entry_points(e)

      lateness_points          = round(late_days * LATE_DAY_POINTS, 2)
      unconfirmed_relay_points = round(count(unconfirmed relay pool) * UNCONFIRMED_RELAY_POINTS, 2)

      penalty_points = round(min(PENALTY_CAP,
                                 entry_subtotal_points + lateness_points + unconfirmed_relay_points), 2)

      # ledger sync on the station
      Station.penalty_points_total = round(sum of penalty_points over FilingRecord rows
                                           of this station with status IN {SUBMITTED, ACCEPTED}, 2)
    constants:
      PER_ENTRY_LATE_RATE: 0.065
      LATE_DAY_POINTS: 0.75
      UNCONFIRMED_RELAY_POINTS: 0.50
      RELAY_LOOKBACK_DAYS: 30
      PENALTY_CAP: 25.00
      STATION_POINT_CEILING: 5.00
      FILING_DUE_DAYS: 5
      FILING_GRACE_DAYS: 10
    precision: "2 decimal places, round_half_up; per-entry rounding happens before summation"

  - name: outage_downtime_hours
    description: "Dual-variant calculation #1, on the EquipmentOutage domain: the same detected_at/restored_at pair yields two different downtime figures and two independent breach flags."
    trigger: "POST /equipment-outages/{id}/restore"
    algorithm: interval_merge
    inputs: [EquipmentOutage.detected_at, EquipmentOutage.restored_at]
    input_set: "the single EquipmentOutage named in the path; status must be REPAIR_IN_PROGRESS"
    formula: |
      restored_at = logical clock now
      # variant CONTINUOUS_CLOCK
      continuous_downtime_hours = round((restored_at - detected_at) / 3600 seconds, 2)
      continuous_clock_breached = continuous_downtime_hours > CONTINUOUS_BREACH_HOURS

      # variant OBLIGATION_CLOCK — only the daily obligation window counts
      obligation_seconds = 0
      for each UTC calendar day D from date(detected_at) through date(restored_at):
          win_start = D at OBLIGATION_WINDOW_START_HOUR:00:00Z
          win_end   = D at OBLIGATION_WINDOW_END_HOUR:00:00Z      # half-open [win_start, win_end)
          overlap   = max(0, min(restored_at, win_end) - max(detected_at, win_start))
          obligation_seconds += overlap
      obligation_downtime_hours = round(obligation_seconds / 3600, 2)
      obligation_breached       = obligation_downtime_hours > REPAIR_DEADLINE_HOURS
    constants:
      CONTINUOUS_BREACH_HOURS: 60
      REPAIR_DEADLINE_HOURS: 48
      OBLIGATION_WINDOW_START_HOUR: 8
      OBLIGATION_WINDOW_END_HOUR: 20
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CONTINUOUS_CLOCK
        when: "always computed; written to continuous_downtime_hours and drives continuous_clock_breached"
        difference: "counts every wall-clock second between detected_at and restored_at"
      - name: OBLIGATION_CLOCK
        when: "always computed; written to obligation_downtime_hours and drives obligation_breached (the field station_compliance_score consumes)"
        difference: "counts only the overlap with each day's half-open [08:00Z, 20:00Z) obligation window, so overnight downtime is free"

  - name: station_compliance_score
    description: "Dual-variant calculation #2, on the Station domain: identical station data scores differently depending on whether the station has an ACCEPTED filing in the trailing window."
    trigger: "every Station recompute event listed in state_machines.Station.recompute_events"
    algorithm: weighted_scoring
    inputs: [Station.accessible_source_count, Station.silent_assignment_count, Station.plan_revalidation_required, Station.penalty_points_total, StatePlan.required_source_count, EquipmentOutage.obligation_breached, TestEvent.status, FilingRecord.status]
    input_set: |
      accessible_source_count = count of DISTINCT source_type among
        MonitoringAssignment rows with this station_id, status == ACTIVE, and
        source_type IN plan.required_source_types.
      silent_assignment_count = count of MonitoringAssignment rows with this
        station_id and status == SILENT.
      outage_breach_count = count of EquipmentOutage rows whose device_id
        belongs to this station, with obligation_breached == true and
        status IN {OPEN, REPAIR_IN_PROGRESS, RESTORED, VERIFICATION_FAILED}.
      unfiled_test_count = count of TestEvent rows with this station_id and
        status == FAILED_UNFILED (CERTIFIED variant only).
      certified_eligible = at least one FilingRecord for a TestEvent of this
        station has status == ACCEPTED with filed_at inside the CLOSED interval
        [now - CERTIFICATION_WINDOW_DAYS days, now].
    formula: |
      # POST /stations/{id}/run-log-review executes these four phases in this
      # PINNED order; phase 1's output feeds d2 and phase 2's output feeds d5,
      # so a different order yields a different score.
      #   phase 1: silence sweep  — ACTIVE assignments whose
      #            coalesce(last_receipt_at, created_at) < now - SILENCE_MAX_DAYS days -> SILENT
      #   phase 2: unfiled sweep  — TestEvent rows in {READY, LOGGED} with
      #            now > filing_deadline_at -> FAILED_UNFILED
      #   phase 3: refresh accessible_source_count, silent_assignment_count,
      #            penalty_points_total
      #   phase 4: pick the variant, compute the score, set compliance_posture,
      #            set last_log_review_at = now
      # Recompute events other than run-log-review execute phases 3 and 4 only.

      missing_source_count = max(0, plan.required_source_count - accessible_source_count)

      d1 = missing_source_count  * MISSING_SOURCE_DEDUCTION
      d2 = silent_assignment_count * SILENT_ASSIGNMENT_DEDUCTION
      d3 = REVALIDATION_DEDUCTION if plan_revalidation_required else 0
      d4 = outage_breach_count   * OUTAGE_BREACH_DEDUCTION
      d5 = unfiled_test_count    * UNFILED_TEST_DEDUCTION      # CERTIFIED only
      d6 = penalty_points_total                                 # CERTIFIED only

      if certified_eligible:
          compliance_variant_applied = CERTIFIED
          compliance_score = round(max(0.00, BASE_SCORE - d1 - d2 - d3 - d4 - d5 - d6), 2)
      else:
          compliance_variant_applied = PROVISIONAL
          compliance_score = round(max(0.00, BASE_SCORE - d1 - d2 - d3 - d4), 2)

      compliance_posture = COMPLIANT        if compliance_score >= COMPLIANT_MIN_SCORE
                           else WATCH       if compliance_score >= WATCH_MIN_SCORE
                           else SUSPENDED_FILINGS
    constants:
      BASE_SCORE: 100.00
      MISSING_SOURCE_DEDUCTION: 25.00
      SILENT_ASSIGNMENT_DEDUCTION: 10.00
      REVALIDATION_DEDUCTION: 15.00
      OUTAGE_BREACH_DEDUCTION: 10.00
      UNFILED_TEST_DEDUCTION: 20.00
      SILENCE_MAX_DAYS: 8
      CERTIFICATION_WINDOW_DAYS: 365
      COMPLIANT_MIN_SCORE: 90.00
      WATCH_MIN_SCORE: 75.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "no FilingRecord for this station has status == ACCEPTED with filed_at within CERTIFICATION_WINDOW_DAYS of now"
        difference: "deductions d5 (unfiled tests) and d6 (accumulated penalty points) are NOT applied"
      - name: CERTIFIED
        when: "at least one ACCEPTED FilingRecord within CERTIFICATION_WINDOW_DAYS"
        difference: "adds d5 and d6, so a station that scores 100.00 provisionally can drop two posture bands the moment its first filing is accepted"

  - name: test_event_readiness_score
    description: "Pre-test equipment readiness gate; threshold is inclusive at exactly 80.00."
    trigger: "POST /test-events/{id}/evaluate-readiness"
    algorithm: weighted_scoring
    inputs: [EASDevice.status, Station.accessible_source_count, StatePlan.required_source_count, AlertEvent.received_at]
    input_set: |
      ready_device_count      = EASDevice rows with this station_id and status == READY.
      countable_device_count  = EASDevice rows with this station_id and status IN {REGISTERED, READY, FAILED}
                                (DECOMMISSIONED devices leave the denominator).
      recent_alert_count      = AlertEvent rows with this station_id whose received_at is inside the
                                CLOSED interval [now - RECENT_ALERT_WINDOW_DAYS days, now], any relay_state.
    formula: |
      ready_device_ratio    = ready_device_count / max(1, countable_device_count)
      source_coverage_ratio = min(1, Station.accessible_source_count / max(1, plan.required_source_count))
      recent_alert_ratio    = min(1, recent_alert_count / RECENT_ALERT_TARGET)

      # single rounding of the weighted sum, at the end
      readiness_score = round(READY_DEVICE_WEIGHT   * ready_device_ratio
                            + SOURCE_COVERAGE_WEIGHT * source_coverage_ratio
                            + RECENT_ALERT_WEIGHT    * recent_alert_ratio, 2)

      status = READY if readiness_score >= READINESS_PASS_MIN else READINESS_PENDING   # inclusive at the boundary
    constants:
      READY_DEVICE_WEIGHT: 40
      SOURCE_COVERAGE_WEIGHT: 40
      RECENT_ALERT_WEIGHT: 20
      RECENT_ALERT_TARGET: 3
      RECENT_ALERT_WINDOW_DAYS: 30
      READINESS_PASS_MIN: 80.00
      PREFLIGHT_HOURS: 24
    precision: "2 decimal places, round_half_up, rounded once after the weighted sum"

  - name: retention_until
    description: "Retention term for each append-only test log line, with a conditional extension keyed on the station's posture at logging time."
    trigger: "POST /test-log-entries"
    algorithm: threshold
    inputs: [TestEvent.test_type, Station.compliance_posture]
    input_set: "the single TestLogEntry being appended; test_type read from its TestEvent, posture from that event's Station"
    formula: |
      base_days = NATIONAL_RETENTION_DAYS if test_event.test_type == NATIONAL
                  else STANDARD_RETENTION_DAYS          # WEEKLY and MONTHLY
      retention_days_applied = base_days + (SUSPENDED_EXTENSION_DAYS
                                            if station.compliance_posture == SUSPENDED_FILINGS else 0)
      logged_at       = logical clock now
      retention_until = logged_at + retention_days_applied calendar days (UTC)
      # TestEvent.retention_until_max = max(retention_until) over the event's entries
    constants:
      STANDARD_RETENTION_DAYS: 730
      NATIONAL_RETENTION_DAYS: 1095
      SUSPENDED_EXTENSION_DAYS: 365
    precision: "whole calendar days added to a millisecond-precision UTC timestamp"

  - name: inspection_completeness_score
    description: "Public-file inspection response completeness, with a flat deduction when the response misses response_due_at."
    trigger: "POST /inspection-requests/{id}/submit-response"
    algorithm: threshold
    inputs: [InspectionRequest.requested_document_kinds, InspectionRequest.provided_document_kinds, InspectionRequest.response_due_at]
    input_set: "the single InspectionRequest named in the path; status must be RESPONSE_DRAFTED"
    formula: |
      responded_at = logical clock now
      matched      = count of DISTINCT kinds in
                     intersection(provided_document_kinds, requested_document_kinds)
      raw          = round(100 * matched / max(1, count(requested_document_kinds)), 2)
      completeness_score = raw if responded_at <= response_due_at
                           else round(max(0.00, raw - LATE_RESPONSE_DEDUCTION), 2)
      # response_due_at was set at create to requested_at + INSPECTION_RESPONSE_DAYS days
      # close: CLOSED_SATISFIED if completeness_score >= INSPECTION_SATISFIED_MIN else CLOSED_DEFICIENT
    constants:
      INSPECTION_RESPONSE_DAYS: 7
      LATE_RESPONSE_DEDUCTION: 20.00
      INSPECTION_SATISFIED_MIN: 100.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the four declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: request_schema
    check: "every required body field is present, every enum value is a declared member, numeric ranges and array shapes hold, window_start_at < window_end_at, source_call_sign present for RECEIPT entries and absent for TRANSMISSION entries"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "every id in the path and then every id in the body resolves to a stored row, validated left-to-right"
    error_id: "ERR_STATE_PLAN_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_RELAY_RULE_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_OUTAGE_NOT_FOUND | ERR_ALERT_EVENT_NOT_FOUND | ERR_WEA_NOTICE_NOT_FOUND | ERR_TEST_EVENT_NOT_FOUND | ERR_LOG_ENTRY_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_INSPECTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id or a body FK"

  - priority: 5
    category: ownership
    check: "StationEngineer's X-User-ID is in the target station's engineer_user_ids; CertifyingOfficer's X-User-ID equals the target station's certification_officer_user_id"
    error_id: "ERR_ENGINEER_NOT_ASSIGNED | ERR_NOT_CERTIFYING_OFFICER"
    http_status: 403
    applies_to: "every StationEngineer and CertifyingOfficer write endpoint"

  - priority: 6
    category: concurrency
    check: "expected_station_version equals Station.version; expected_test_event_version equals TestEvent.version"
    error_id: "ERR_STALE_STATION_VERSION | ERR_STALE_TEST_EVENT_VERSION"
    http_status: 412
    applies_to: "POST /monitoring-assignments, POST /filing-records"

  - priority: 7
    category: state
    check: "the target row is in a state the requested transition declares as a valid `from:` in §1.2"
    error_id: "ERR_PLAN_NOT_DRAFT | ERR_RELAY_RULE_NOT_ACTIVE | ERR_DEVICE_NOT_READY | ERR_DEVICE_DECOMMISSIONED | ERR_ASSIGNMENT_NOT_ACTIVE | ERR_ASSIGNMENT_NOT_DECOMMISSIONED | ERR_OUTAGE_NOT_REPAIRABLE | ERR_OUTAGE_NOT_IN_REPAIR | ERR_OUTAGE_NOT_RESTORED | ERR_ALERT_NOT_RELAY_PENDING | ERR_ACCESSIBILITY_ALREADY_VERIFIED | ERR_TEST_NOT_READY | ERR_TEST_NOT_LOGGED | ERR_TEST_ALREADY_FAILED_UNFILED | ERR_TEST_NO_ENTRIES | ERR_FILING_NOT_REVERSIBLE | ERR_FILING_NOT_SUBMITTED | ERR_INSPECTION_NOT_DRAFTABLE | ERR_INSPECTION_NOT_DRAFTED | ERR_INSPECTION_NOT_RESPONDED"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 8
    category: business_safety
    check: "the owning Station's compliance_posture is not SUSPENDED_FILINGS"
    error_id: "ERR_FILINGS_SUSPENDED | ERR_POSTURE_NOT_TEST_ELIGIBLE"
    http_status: 422
    applies_to: "POST /filing-records (ERR_FILINGS_SUSPENDED), POST /test-events (ERR_POSTURE_NOT_TEST_ELIGIBLE)"

  - priority: 9
    category: business_referential
    check: "cross-row referential coherence: every source_type in the plan's required_source_types has at least one RECEIPT log line for the test event; a RECEIPT's source_call_sign matches a MonitoringAssignment of the station; a referenced device belongs to the referenced station"
    error_id: "ERR_RECEIPT_COVERAGE_INCOMPLETE | ERR_LOG_ENTRY_SOURCE_UNKNOWN | ERR_DEVICE_STATION_MISMATCH"
    http_status: 422
    applies_to: "POST /filing-records, POST /test-log-entries, POST /monitoring-assignments"

  - priority: 10
    category: business_temporal
    check: "clock-relative windows: test windows are in the future and do not overlap, readiness/logging/response windows are open, the filing grace period has not expired, reported instants are not in the future"
    error_id: "ERR_TEST_WINDOW_IN_PAST | ERR_TEST_WINDOW_OVERLAP | ERR_READINESS_WINDOW_NOT_OPEN | ERR_LOGGING_WINDOW_CLOSED | ERR_FILING_DEADLINE_PASSED | ERR_OUTAGE_DETECTED_IN_FUTURE | ERR_ALERT_RECEIVED_IN_FUTURE | ERR_INSPECTION_RESPONSE_WINDOW_CLOSED"
    http_status: "409 for ERR_TEST_WINDOW_OVERLAP, 422 for the rest"
    applies_to: "POST /test-events, POST /test-events/{id}/evaluate-readiness, POST /test-log-entries, POST /filing-records, POST /equipment-outages, POST /alert-events, POST /inspection-requests/{id}/submit-response"

  - priority: 11
    category: business_constraint
    check: "uniqueness and separation-of-duty constraints: call_sign is unique, a plan cannot hold two ACTIVE RelayRules with the same event_code and priority, a source_type cannot be reinstated while another ACTIVE assignment covers it, a device with live assignments cannot be decommissioned, and the filer must not have appended any log line for the test event"
    error_id: "ERR_DUPLICATE_CALL_SIGN | ERR_DUPLICATE_RELAY_PRIORITY | ERR_SOURCE_TYPE_ALREADY_COVERED | ERR_DEVICE_HAS_LIVE_ASSIGNMENTS | ERR_SEGREGATION_OF_DUTIES"
    http_status: "409 for the uniqueness errors, 422 for ERR_SEGREGATION_OF_DUTIES"
    applies_to: "POST /stations, POST /relay-rules, POST /monitoring-assignments/{id}/reinstate, POST /eas-devices/{id}/decommission, POST /filing-records"

  - priority: 12
    category: business_fiscal
    check: "Station.penalty_points_total + this filing's computed penalty_points must not exceed STATION_POINT_CEILING (5.00)"
    error_id: ERR_PENALTY_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /filing-records"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "" — every collection is top-level)
# =============================================================================
endpoints:

  # --- test-driving endpoint: logical clock -----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every computed timestamp in this scaffold (notified_at, restored_at, logged_at, filed_at, requested_at, responded_at, activated_at, superseded_at, last_receipt_at, silence_flagged_at, last_log_review_at, last_readiness_check_at) is read from this clock."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock moves; no entity is mutated and no recompute event fires"]

  # --- StatePlan --------------------------------------------------------------
  - method: POST
    path: "/state-plans"
    description: "Creates a DRAFT state plan."
    roles: [ComplianceAdmin]
    code: 201
    input: [state_code, plan_version_label, required_source_types, mandatory_relay_event_codes]
    output: StatePlan
    side_effects: ["required_source_count = len(required_source_types)", "status = DRAFT"]

  - method: GET
    path: "/state-plans/{id}"
    description: "Reads one state plan."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: StatePlan
    side_effects: []

  - method: GET
    path: "/state-plans"
    description: "Lists state plans."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [state_code?, status?, limit?, offset?]
    output: StatePlan[]
    side_effects: []

  - method: POST
    path: "/state-plans/{id}/activate"
    description: "Activates a DRAFT plan and supersedes the prior ACTIVE plan for the same state_code."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: StatePlan
    side_effects: ["activated_at set", "PLAN-SUPERSEDE CASCADE hop 1 -> hop 2 -> hop 3 (see state_machines.StatePlan.ACTIVE_to_SUPERSEDED)"]

  # --- Station ----------------------------------------------------------------
  - method: POST
    path: "/stations"
    description: "Registers a station under a state plan."
    roles: [ComplianceAdmin]
    code: 201
    input: [state_plan_id, call_sign, service_type, engineer_user_ids, certification_officer_user_id]
    output: Station
    side_effects: ["compliance_posture = PROVISIONING", "compliance_score = null", "version = 1"]

  - method: GET
    path: "/stations/{id}"
    description: "Reads one station, including its current version for OCC use."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/stations"
    description: "Lists stations, filterable by plan and posture."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [state_plan_id?, compliance_posture?, call_sign?, limit?, offset?]
    output: Station[]
    side_effects: []

  - method: GET
    path: "/stations/{id}/compliance-summary"
    description: "Computed read that exposes every input the station_compliance_score formula consumed for the current compliance_score."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: "{ station_id: string, compliance_posture: string, compliance_score: number, compliance_variant_applied: string, required_source_count: integer, accessible_source_count: integer, missing_source_count: integer, silent_assignment_count: integer, outage_breach_count: integer, unfiled_test_count: integer, penalty_points_total: number, plan_revalidation_required: boolean, public_file_document_count: integer, last_log_review_at: string }"
    side_effects: []

  - method: POST
    path: "/stations/{id}/run-log-review"
    description: "Runs the four-phase station log review: silence sweep, unfiled sweep, derived-field refresh, then score and posture."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Station
    side_effects: ["MonitoringAssignment ACTIVE -> SILENT sweep (phase 1)", "TestEvent {READY, LOGGED} -> FAILED_UNFILED sweep (phase 2)", "accessible_source_count / silent_assignment_count / penalty_points_total refreshed (phase 3)", "calculations.station_compliance_score + compliance_posture + last_log_review_at (phase 4)"]

  - method: POST
    path: "/stations/{id}/public-file-documents"
    description: "Records a public-file document upload against the station."
    roles: [StationEngineer]
    code: 201
    input: [document_kind, reference_label]
    output: Station
    side_effects: ["public_file_document_count += 1"]

  # --- RelayRule --------------------------------------------------------------
  - method: POST
    path: "/relay-rules"
    description: "Creates an ACTIVE alert-forwarding rule on a plan."
    roles: [ComplianceAdmin]
    code: 201
    input: [state_plan_id, event_code, fips_codes, relay_class, priority, forward_delay_seconds?]
    output: RelayRule
    side_effects: ["specificity = 2 when fips_codes is non-empty else 1", "status = ACTIVE"]

  - method: GET
    path: "/relay-rules/{id}"
    description: "Reads one relay rule."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: RelayRule
    side_effects: []

  - method: GET
    path: "/relay-rules"
    description: "Lists relay rules; the state_plan_id filter is the reverse-reachability channel for RelayRule.state_plan_id."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [state_plan_id?, event_code?, relay_class?, status?, limit?, offset?]
    output: RelayRule[]
    side_effects: []

  - method: POST
    path: "/relay-rules/{id}/retire"
    description: "Retires a relay rule so it leaves the selector candidate pool."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: RelayRule
    side_effects: ["status = RETIRED"]

  # --- EASDevice --------------------------------------------------------------
  - method: POST
    path: "/eas-devices"
    description: "Registers an alert receiving/encoding unit at a station."
    roles: [StationEngineer]
    code: 201
    input: [station_id, model_code, device_role, firmware_version]
    output: EASDevice
    side_effects: ["status = REGISTERED", "readiness_check_passed = false"]

  - method: GET
    path: "/eas-devices/{id}"
    description: "Reads one device."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: EASDevice
    side_effects: []

  - method: GET
    path: "/eas-devices"
    description: "Lists devices; the station_id filter is the reverse-reachability channel for EASDevice.station_id."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [station_id?, status?, device_role?, limit?, offset?]
    output: EASDevice[]
    side_effects: []

  - method: POST
    path: "/eas-devices/{id}/readiness-check"
    description: "Runs a pre-test readiness check; both flags true moves REGISTERED -> READY."
    roles: [StationEngineer]
    code: 200
    input: [self_test_passed, firmware_current]
    output: EASDevice
    side_effects: ["last_readiness_check_at = now", "readiness_check_passed and status per state_machines.EASDevice"]

  - method: POST
    path: "/eas-devices/{id}/decommission"
    description: "Retires a device permanently; rejected while any assignment on it is ACTIVE, SILENT or SUSPENDED."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: EASDevice
    side_effects: ["status = DECOMMISSIONED", "device leaves the readiness denominator"]

  # --- MonitoringAssignment ---------------------------------------------------
  - method: POST
    path: "/monitoring-assignments"
    description: "Assigns a device to monitor a source for a station. OCC-guarded: expected_station_version must equal the station's current version. A create for a source_type the station already covers supersedes the prior ACTIVE assignment."
    roles: [StationEngineer]
    code: 201
    input: [station_id, device_id, source_type, source_call_sign, expected_station_version]
    output: MonitoringAssignment
    side_effects: ["increments Station.version by 1", "prior ACTIVE assignment for the same station_id and source_type -> DECOMMISSIONED and superseded_assignment_id set", "Station.accessible_source_count recomputed", "Station recompute event: calculations.station_compliance_score + compliance_posture"]

  - method: GET
    path: "/monitoring-assignments/{id}"
    description: "Reads one monitoring assignment."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: MonitoringAssignment
    side_effects: []

  - method: GET
    path: "/monitoring-assignments"
    description: "Lists monitoring assignments; the station_id and device_id filters are the reverse-reachability channels for both FKs."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [station_id?, device_id?, source_type?, status?, superseded_assignment_id?, limit?, offset?]
    output: MonitoringAssignment[]
    side_effects: []

  - method: POST
    path: "/monitoring-assignments/{id}/record-receipt"
    description: "Records a monitored-source receipt, clearing a SILENT flag."
    roles: [StationEngineer]
    code: 200
    input: []
    output: MonitoringAssignment
    side_effects: ["last_receipt_at = now", "SILENT -> ACTIVE and silence_flagged_at = null", "Station recompute event"]

  - method: POST
    path: "/monitoring-assignments/{id}/decommission"
    description: "Decommissions a monitoring assignment."
    roles: [StationEngineer]
    code: 200
    input: []
    output: MonitoringAssignment
    side_effects: ["status = DECOMMISSIONED", "Station.accessible_source_count recomputed", "Station recompute event"]

  - method: POST
    path: "/monitoring-assignments/{id}/reinstate"
    description: "Reinstates a DECOMMISSIONED assignment; rejected when another ACTIVE assignment already covers the same source_type."
    roles: [StationEngineer]
    code: 200
    input: []
    output: MonitoringAssignment
    side_effects: ["status = ACTIVE", "Station.accessible_source_count recomputed", "Station recompute event"]

  # --- EquipmentOutage --------------------------------------------------------
  - method: POST
    path: "/equipment-outages"
    description: "Files an equipment failure notification; starts the depth-4 outage cascade."
    roles: [StationEngineer]
    code: 201
    input: [device_id, detected_at, failure_summary]
    output: EquipmentOutage
    side_effects: ["notified_at = now", "status = OPEN", "hop 1: EASDevice -> FAILED", "hop 2: that device's ACTIVE/SILENT MonitoringAssignments -> SUSPENDED", "hop 3: Station.accessible_source_count + station_compliance_score + compliance_posture", "hop 4: the station's READY TestEvents revert to READINESS_PENDING with readiness_score cleared"]

  - method: GET
    path: "/equipment-outages/{id}"
    description: "Reads one outage, including both downtime variants."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: EquipmentOutage
    side_effects: []

  - method: GET
    path: "/equipment-outages"
    description: "Lists outages; the device_id filter is the reverse-reachability channel for EquipmentOutage.device_id."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [device_id?, status?, obligation_breached?, limit?, offset?]
    output: EquipmentOutage[]
    side_effects: []

  - method: POST
    path: "/equipment-outages/{id}/start-repair"
    description: "Starts (or restarts, after a failed verification) the repair."
    roles: [StationEngineer]
    code: 200
    input: []
    output: EquipmentOutage
    side_effects: ["repair_started_at = now", "repair_cycle_count += 1 only when entering from VERIFICATION_FAILED"]

  - method: POST
    path: "/equipment-outages/{id}/restore"
    description: "Reports service restored; runs both variants of calculations.outage_downtime_hours."
    roles: [StationEngineer]
    code: 200
    input: []
    output: EquipmentOutage
    side_effects: ["restored_at = now", "continuous_downtime_hours + obligation_downtime_hours + both breach flags written"]

  - method: POST
    path: "/equipment-outages/{id}/fail-verification"
    description: "Rejects a reported restoration and sends the outage back around the repair cycle."
    roles: [ComplianceAdmin]
    code: 200
    input: [verification_note?]
    output: EquipmentOutage
    side_effects: ["status = VERIFICATION_FAILED", "restored_at and both downtime figures cleared to null", "device stays FAILED"]

  - method: POST
    path: "/equipment-outages/{id}/close"
    description: "Closes a verified restoration and returns the device to service."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: EquipmentOutage
    side_effects: ["status = CLOSED", "EASDevice FAILED -> READY", "that device's SUSPENDED assignments -> SILENT", "Station recompute event"]

  # --- AlertEvent -------------------------------------------------------------
  - method: POST
    path: "/alert-events"
    description: "Logs a received alert; runs duplicate_suppression_window then relay_rule_selection inside the same request."
    roles: [StationEngineer]
    code: 201
    input: [station_id, event_code, originator_sequence, fips_codes, received_at]
    output: AlertEvent
    side_effects: ["calculations.duplicate_suppression_window", "calculations.relay_rule_selection (skipped when suppressed)", "relay_state / suppression_source / suppression_reference_alert_id / matched_relay_rule_id / relay_class_applied / forward_delay_seconds_applied written", "accessibility_state = ACCESSIBILITY_UNVERIFIED"]

  - method: GET
    path: "/alert-events/{id}"
    description: "Reads one alert event with both state dimensions."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: AlertEvent
    side_effects: []

  - method: GET
    path: "/alert-events"
    description: "Lists alert events; the station_id, matched_relay_rule_id and suppression_reference_alert_id filters are the reverse-reachability channels for all three FKs (the last one is self-referential)."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [station_id?, matched_relay_rule_id?, suppression_reference_alert_id?, relay_state?, accessibility_state?, event_code?, originator_sequence?, limit?, offset?]
    output: AlertEvent[]
    side_effects: []

  - method: POST
    path: "/alert-events/{id}/confirm-relay"
    description: "Confirms the alert was forwarded; only touches the relay dimension."
    roles: [StationEngineer]
    code: 200
    input: []
    output: AlertEvent
    side_effects: ["relay_state = RELAYED", "accessibility_state untouched", "the alert leaves filing_penalty_points' unconfirmed relay pool"]

  - method: POST
    path: "/alert-events/{id}/verify-accessibility"
    description: "Records the visual crawl, audio loudness and caption interaction measurements and runs calculations.accessibility_pass_evaluation; only touches the accessibility dimension."
    roles: [StationEngineer]
    code: 200
    input: [visual_crawl_seconds, audio_loudness_lufs, caption_interaction]
    output: AlertEvent
    side_effects: ["measurement fields + accessibility_deficiency_points written", "accessibility_state = ACCESSIBILITY_PASSED or ACCESSIBILITY_FAILED", "relay_state untouched"]

  # --- WirelessAlertNotice ----------------------------------------------------
  - method: POST
    path: "/wireless-alert-notices"
    description: "Records a wireless emergency alert notice used for duplicate-alert avoidance (immutable, no version field)."
    roles: [ComplianceAdmin]
    code: 201
    input: [station_id, originator_sequence, event_code, wea_sent_at, fips_codes]
    output: WirelessAlertNotice
    side_effects: ["the notice enters phase B of calculations.duplicate_suppression_window for later alerts"]

  - method: GET
    path: "/wireless-alert-notices/{id}"
    description: "Reads one wireless alert notice."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: WirelessAlertNotice
    side_effects: []

  - method: GET
    path: "/wireless-alert-notices"
    description: "Lists wireless alert notices; the station_id filter is the reverse-reachability channel for WirelessAlertNotice.station_id."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [station_id?, originator_sequence?, event_code?, limit?, offset?]
    output: WirelessAlertNotice[]
    side_effects: []

  # --- TestEvent --------------------------------------------------------------
  - method: POST
    path: "/test-events"
    description: "Schedules a weekly, monthly or national test window for a station."
    roles: [ComplianceAdmin]
    code: 201
    input: [station_id, test_type, window_start_at, window_end_at]
    output: TestEvent
    side_effects: ["status = SCHEDULED", "filing_deadline_at = window_end_at + FILING_DUE_DAYS (5) days", "half-open overlap check against the station's other non-FAILED_UNFILED test windows"]

  - method: GET
    path: "/test-events/{id}"
    description: "Reads one test event, including its version for OCC use."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: TestEvent
    side_effects: []

  - method: GET
    path: "/test-events"
    description: "Lists test events; the station_id filter is the reverse-reachability channel for TestEvent.station_id."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [station_id?, test_type?, status?, limit?, offset?]
    output: TestEvent[]
    side_effects: []

  - method: POST
    path: "/test-events/{id}/evaluate-readiness"
    description: "Runs calculations.test_event_readiness_score and moves the event to READY (score >= 80.00) or READINESS_PENDING."
    roles: [StationEngineer]
    code: 200
    input: []
    output: TestEvent
    side_effects: ["readiness_score + readiness_evaluated_at written", "status per state_machines.TestEvent"]

  - method: POST
    path: "/test-events/{id}/close-logging"
    description: "Closes the logging phase; requires at least one log entry."
    roles: [StationEngineer]
    code: 200
    input: []
    output: TestEvent
    side_effects: ["status = LOGGED", "retention_until_max refreshed"]

  # --- TestLogEntry -----------------------------------------------------------
  - method: POST
    path: "/test-log-entries"
    description: "Appends an immutable transmission or receipt line to a READY test event and computes its retention term."
    roles: [StationEngineer]
    code: 201
    input: [test_event_id, device_id, entry_kind, source_call_sign?]
    output: TestLogEntry
    side_effects: ["logged_at = now", "logged_by_user_id = X-User-ID", "calculations.retention_until -> retention_days_applied + retention_until", "TestEvent.logged_entry_count += 1", "for RECEIPT lines: the matching MonitoringAssignment's last_receipt_at = now and SILENT -> ACTIVE"]

  - method: GET
    path: "/test-log-entries/{id}"
    description: "Reads one log line."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: TestLogEntry
    side_effects: []

  - method: GET
    path: "/test-log-entries"
    description: "Lists log lines; the test_event_id and device_id filters are the reverse-reachability channels for both FKs."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [test_event_id?, device_id?, entry_kind?, source_call_sign?, limit?, offset?]
    output: TestLogEntry[]
    side_effects: []

  # --- FilingRecord -----------------------------------------------------------
  - method: POST
    path: "/filing-records"
    description: "Files post-test results. OCC-guarded: expected_test_event_version must equal the test event's current version. A second filing on a FILED event is an amendment that reverses the prior filing."
    roles: [CertifyingOfficer]
    code: 201
    input: [test_event_id, expected_test_event_version, attestation_note]
    output: FilingRecord
    side_effects: ["increments TestEvent.version by 1", "filed_at + filed_by_user_id written", "calculations.filing_penalty_points -> late_days, entry_subtotal_points, lateness_points, unconfirmed_relay_points, penalty_points", "TestEvent -> FILED", "prior SUBMITTED/ACCEPTED filing for the same event -> REVERSED with reversal_reason 'SUPERSEDED_BY_AMENDMENT' and superseded_filing_id set", "Station.penalty_points_total recomputed", "Station recompute event"]

  - method: GET
    path: "/filing-records/{id}"
    description: "Reads one filing record."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: FilingRecord
    side_effects: []

  - method: GET
    path: "/filing-records"
    description: "Lists filing records; the test_event_id filter is the reverse-reachability channel for FilingRecord.test_event_id, and superseded_filing_id covers the self-reference."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [test_event_id?, status?, superseded_filing_id?, limit?, offset?]
    output: FilingRecord[]
    side_effects: []

  - method: POST
    path: "/filing-records/{id}/accept"
    description: "Accepts a submitted filing, making the station eligible for the CERTIFIED score variant."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: FilingRecord
    side_effects: ["status = ACCEPTED", "Station recompute event (variant may flip PROVISIONAL -> CERTIFIED)"]

  - method: POST
    path: "/filing-records/{id}/reverse"
    description: "Reverses a filing; the compensating action that must return Station.penalty_points_total to its exact pre-filing value."
    roles: [ComplianceAdmin]
    code: 200
    input: [reversal_reason]
    output: FilingRecord
    side_effects: ["status = REVERSED", "Station.penalty_points_total recomputed without this row", "Station recompute event"]

  # --- InspectionRequest ------------------------------------------------------
  - method: POST
    path: "/inspection-requests"
    description: "Opens a public-file inspection request against a station."
    roles: [FieldInspector]
    code: 201
    input: [station_id, requested_document_kinds]
    output: InspectionRequest
    side_effects: ["requested_at = now", "response_due_at = requested_at + INSPECTION_RESPONSE_DAYS (7) days", "status = OPEN"]

  - method: GET
    path: "/inspection-requests/{id}"
    description: "Reads one inspection request."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: []
    output: InspectionRequest
    side_effects: []

  - method: GET
    path: "/inspection-requests"
    description: "Lists inspection requests; the station_id filter is the reverse-reachability channel for InspectionRequest.station_id."
    roles: [ComplianceAdmin, StationEngineer, CertifyingOfficer, FieldInspector]
    code: 200
    input: [station_id?, status?, limit?, offset?]
    output: InspectionRequest[]
    side_effects: []

  - method: POST
    path: "/inspection-requests/{id}/draft-response"
    description: "Attaches the document kinds the station will produce."
    roles: [StationEngineer]
    code: 200
    input: [provided_document_kinds]
    output: InspectionRequest
    side_effects: ["provided_document_kinds overwritten", "status = RESPONSE_DRAFTED"]

  - method: POST
    path: "/inspection-requests/{id}/submit-response"
    description: "Submits the drafted response and runs calculations.inspection_completeness_score."
    roles: [CertifyingOfficer]
    code: 200
    input: []
    output: InspectionRequest
    side_effects: ["responded_at = now", "completeness_score written", "status = RESPONDED"]

  - method: POST
    path: "/inspection-requests/{id}/close"
    description: "Closes the request as satisfied (completeness_score >= 100.00) or deficient."
    roles: [FieldInspector]
    code: 200
    input: []
    output: InspectionRequest
    side_effects: ["status = CLOSED_SATISFIED or CLOSED_DEFICIENT"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the four declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, undeclared enum value, out-of-range number, malformed array, window_start_at >= window_end_at, or source_call_sign present on a TRANSMISSION line / absent on a RECEIPT line"

  - id: ERR_STATE_PLAN_NOT_FOUND
    http: 404
    condition: "state plan id in path or body does not resolve"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "station id in path or body does not resolve"
  - id: ERR_RELAY_RULE_NOT_FOUND
    http: 404
    condition: "relay rule id in path does not resolve"
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "EAS device id in path or body does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "monitoring assignment id in path does not resolve"
  - id: ERR_OUTAGE_NOT_FOUND
    http: 404
    condition: "equipment outage id in path does not resolve"
  - id: ERR_ALERT_EVENT_NOT_FOUND
    http: 404
    condition: "alert event id in path does not resolve"
  - id: ERR_WEA_NOTICE_NOT_FOUND
    http: 404
    condition: "wireless alert notice id in path does not resolve"
  - id: ERR_TEST_EVENT_NOT_FOUND
    http: 404
    condition: "test event id in path or body does not resolve"
  - id: ERR_LOG_ENTRY_NOT_FOUND
    http: 404
    condition: "test log entry id in path does not resolve"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "filing record id in path does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection request id in path does not resolve"

  - id: ERR_ENGINEER_NOT_ASSIGNED
    http: 403
    condition: "acting StationEngineer's X-User-ID is not in the target station's engineer_user_ids"
  - id: ERR_NOT_CERTIFYING_OFFICER
    http: 403
    condition: "acting CertifyingOfficer's X-User-ID does not equal the target station's certification_officer_user_id"

  - id: ERR_STALE_STATION_VERSION
    http: 412
    condition: "expected_station_version does not equal the station's current version on POST /monitoring-assignments"
  - id: ERR_STALE_TEST_EVENT_VERSION
    http: 412
    condition: "expected_test_event_version does not equal the test event's current version on POST /filing-records"

  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "activate called on a plan whose status is not DRAFT"
  - id: ERR_RELAY_RULE_NOT_ACTIVE
    http: 409
    condition: "retire called on a relay rule whose status is already RETIRED"
  - id: ERR_DEVICE_NOT_READY
    http: 409
    condition: "POST /monitoring-assignments or reinstate references a device whose status is not READY"
  - id: ERR_DEVICE_DECOMMISSIONED
    http: 409
    condition: "readiness-check, outage create or decommission targets a DECOMMISSIONED device"
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "record-receipt or decommission targets an assignment already in DECOMMISSIONED"
  - id: ERR_ASSIGNMENT_NOT_DECOMMISSIONED
    http: 409
    condition: "reinstate targets an assignment whose status is not DECOMMISSIONED"
  - id: ERR_OUTAGE_NOT_REPAIRABLE
    http: 409
    condition: "start-repair called on an outage whose status is not OPEN or VERIFICATION_FAILED"
  - id: ERR_OUTAGE_NOT_IN_REPAIR
    http: 409
    condition: "restore called on an outage whose status is not REPAIR_IN_PROGRESS"
  - id: ERR_OUTAGE_NOT_RESTORED
    http: 409
    condition: "fail-verification or close called on an outage whose status is not RESTORED"
  - id: ERR_ALERT_NOT_RELAY_PENDING
    http: 409
    condition: "confirm-relay called on an alert whose relay_state is not RELAY_PENDING"
  - id: ERR_ACCESSIBILITY_ALREADY_VERIFIED
    http: 409
    condition: "verify-accessibility called on an alert whose accessibility_state is not ACCESSIBILITY_UNVERIFIED"
  - id: ERR_TEST_NOT_READY
    http: 409
    condition: "close-logging or POST /test-log-entries targets a test event whose status is not READY"
  - id: ERR_TEST_NOT_LOGGED
    http: 409
    condition: "POST /filing-records targets a test event whose status is not LOGGED or FILED"
  - id: ERR_TEST_ALREADY_FAILED_UNFILED
    http: 409
    condition: "POST /filing-records targets a test event whose status is FAILED_UNFILED"
  - id: ERR_TEST_NO_ENTRIES
    http: 409
    condition: "close-logging called on a test event with logged_entry_count == 0"
  - id: ERR_FILING_NOT_REVERSIBLE
    http: 409
    condition: "reverse called on a filing whose status is already REVERSED"
  - id: ERR_FILING_NOT_SUBMITTED
    http: 409
    condition: "accept called on a filing whose status is not SUBMITTED"
  - id: ERR_INSPECTION_NOT_DRAFTABLE
    http: 409
    condition: "draft-response called on an inspection whose status is not OPEN or RESPONSE_DRAFTED"
  - id: ERR_INSPECTION_NOT_DRAFTED
    http: 409
    condition: "submit-response called on an inspection whose status is not RESPONSE_DRAFTED"
  - id: ERR_INSPECTION_NOT_RESPONDED
    http: 409
    condition: "close called on an inspection whose status is not RESPONDED"

  - id: ERR_FILINGS_SUSPENDED
    http: 422
    condition: "POST /filing-records while the owning station's compliance_posture is SUSPENDED_FILINGS"
  - id: ERR_POSTURE_NOT_TEST_ELIGIBLE
    http: 422
    condition: "POST /test-events while the station's compliance_posture is SUSPENDED_FILINGS"

  - id: ERR_RECEIPT_COVERAGE_INCOMPLETE
    http: 422
    condition: "POST /filing-records where some source_type in the plan's required_source_types has no RECEIPT log line for the test event"
  - id: ERR_LOG_ENTRY_SOURCE_UNKNOWN
    http: 422
    condition: "POST /test-log-entries with entry_kind RECEIPT whose source_call_sign matches no MonitoringAssignment of the test event's station"
  - id: ERR_DEVICE_STATION_MISMATCH
    http: 422
    condition: "the referenced device's station_id differs from the referenced station's or test event's station_id"

  - id: ERR_TEST_WINDOW_IN_PAST
    http: 422
    condition: "POST /test-events with window_start_at earlier than the logical clock now"
  - id: ERR_TEST_WINDOW_OVERLAP
    http: 409
    condition: "POST /test-events whose half-open [window_start_at, window_end_at) intersects another non-FAILED_UNFILED test window of the same station"
  - id: ERR_READINESS_WINDOW_NOT_OPEN
    http: 422
    condition: "evaluate-readiness before window_start_at - 24 hours or after window_end_at"
  - id: ERR_LOGGING_WINDOW_CLOSED
    http: 422
    condition: "POST /test-log-entries when now is outside the closed interval [window_start_at, window_end_at]"
  - id: ERR_FILING_DEADLINE_PASSED
    http: 422
    condition: "POST /filing-records when now > filing_deadline_at + FILING_GRACE_DAYS (10) days"
  - id: ERR_OUTAGE_DETECTED_IN_FUTURE
    http: 422
    condition: "POST /equipment-outages with detected_at later than the logical clock now"
  - id: ERR_ALERT_RECEIVED_IN_FUTURE
    http: 422
    condition: "POST /alert-events with received_at later than the logical clock now"
  - id: ERR_INSPECTION_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "submit-response when now > response_due_at + INSPECTION_RESPONSE_DAYS (7) days"

  - id: ERR_DUPLICATE_CALL_SIGN
    http: 409
    condition: "POST /stations with a call_sign that already exists"
  - id: ERR_DUPLICATE_RELAY_PRIORITY
    http: 409
    condition: "POST /relay-rules where the plan already has an ACTIVE rule with the same event_code and priority"
  - id: ERR_SOURCE_TYPE_ALREADY_COVERED
    http: 409
    condition: "reinstate while another ACTIVE assignment of the same station already covers that source_type"
  - id: ERR_DEVICE_HAS_LIVE_ASSIGNMENTS
    http: 409
    condition: "decommission a device that still has an assignment with status IN {ACTIVE, SILENT, SUSPENDED}"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "POST /filing-records where the acting X-User-ID equals logged_by_user_id on any TestLogEntry of that test event"

  - id: ERR_PENALTY_CEILING_EXCEEDED
    http: 422
    condition: "POST /filing-records where Station.penalty_points_total + this filing's penalty_points would exceed STATION_POINT_CEILING (5.00)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "State-level compliance operator: owns plans, relay rules, the logical clock, station log review, filing acceptance/reversal, outage verification and device decommissioning."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /state-plans"
      - "POST /state-plans/{id}/activate"
      - "POST /stations"
      - "POST /stations/{id}/run-log-review"
      - "POST /relay-rules"
      - "POST /relay-rules/{id}/retire"
      - "POST /eas-devices/{id}/decommission"
      - "POST /equipment-outages/{id}/fail-verification"
      - "POST /equipment-outages/{id}/close"
      - "POST /wireless-alert-notices"
      - "POST /test-events"
      - "POST /filing-records/{id}/accept"
      - "POST /filing-records/{id}/reverse"
    shared_operations: ["every GET endpoint"]

  - name: StationEngineer
    description: "Station-side engineer: registers and readiness-checks devices, maintains monitoring assignments, files outages and repairs, logs alerts and test lines, drafts inspection responses, uploads public-file documents. X-User-ID must appear in the target station's engineer_user_ids."
    identity: "opaque"
    exclusive_operations:
      - "POST /eas-devices"
      - "POST /eas-devices/{id}/readiness-check"
      - "POST /monitoring-assignments"
      - "POST /monitoring-assignments/{id}/record-receipt"
      - "POST /monitoring-assignments/{id}/decommission"
      - "POST /monitoring-assignments/{id}/reinstate"
      - "POST /equipment-outages"
      - "POST /equipment-outages/{id}/start-repair"
      - "POST /equipment-outages/{id}/restore"
      - "POST /alert-events"
      - "POST /alert-events/{id}/confirm-relay"
      - "POST /alert-events/{id}/verify-accessibility"
      - "POST /test-events/{id}/evaluate-readiness"
      - "POST /test-events/{id}/close-logging"
      - "POST /test-log-entries"
      - "POST /inspection-requests/{id}/draft-response"
      - "POST /stations/{id}/public-file-documents"
    shared_operations: ["every GET endpoint"]

  - name: CertifyingOfficer
    description: "Station's certifying official: the only role that may file post-test results or submit an inspection response. X-User-ID must equal the target station's certification_officer_user_id, and segregation of duties forbids filing a test whose log lines this same user appended."
    identity: "opaque"
    exclusive_operations:
      - "POST /filing-records"
      - "POST /inspection-requests/{id}/submit-response"
    shared_operations: ["every GET endpoint"]

  - name: FieldInspector
    description: "External inspector: opens public-file inspection requests and closes them as satisfied or deficient. Holds no write power over station operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection-requests"
      - "POST /inspection-requests/{id}/close"
    shared_operations: ["every GET endpoint"]
