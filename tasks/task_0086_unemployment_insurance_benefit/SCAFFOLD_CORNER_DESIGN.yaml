scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_employer_returns_201_with_seeded_reserve
        claim_type: Creation
        grounds:
          - entities.Employer
          - endpoints
        distinguishing_aspect: "POST /ui/employers with all required fields returns 201; reserve_account_balance_cents equals reserve_opening_balance_cents and charge_protest_count == 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ui/employers"
              payload: { legal_name: "Fresh Co", state_account_number: "FR-1", experience_rate: 0.04, reserve_opening_balance_cents: 5000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "response status == 201"
            - "Employer.${emp_id}.reserve_account_balance_cents == 5000000"
            - "Employer.${emp_id}.charge_protest_count == 0"
            - "Employer.${emp_id}.version == 1"

      - name: get_claim_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Claim
          - endpoints
        distinguishing_aspect: "GET /ui/claims/{id} returns the stored claim with claimant_id and filed_date matching the create payload."
        test_recipe:
          setup: ["A claimant and a DRAFT claim."]
          setup_api_calls:
            - call: "POST /ui/claimants"
              payload: { full_name: "Get Test", ssn_last4: "2020", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
          assert:
            - "response status == 200"
            - "Claim.${claim_id}.status == DRAFT"
            - "Claim.${claim_id}.filed_date == 2026-04-05"

      - name: list_employers_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Employer
          - endpoints
        distinguishing_aspect: "GET /ui/employers returns response_type array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two employers registered."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "L1", state_account_number: "L1-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "L2", state_account_number: "L2-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
          trigger:
            - call: "GET /ui/employers"
              payload: { limit: 1, offset: 0 }
              as: ProgramAdmin
          assert:
            - "response status == 200"
            - "response_type == array"
            - "response meta total_count == 2"
            - "response meta has_more == true"

      - name: get_employer_not_found
        claim_type: Not Found
        grounds:
          - entities.Employer
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /ui/employers/{id} with a random nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /ui/employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_claimant_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Claimant
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /ui/claimants omitting full_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ui/claimants"
              payload: { ssn_last4: "3030", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: claimant_able_available_default_true
        claim_type: Defaults
        grounds:
          - entities.Claimant.fields.is_able_and_available
        distinguishing_aspect: "POST /ui/claimants omitting is_able_and_available applies the default true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ui/claimants"
              payload: { full_name: "Def Ault", ssn_last4: "4040", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
          assert:
            - "response status == 201"
            - "Claimant.${clmt_id}.is_able_and_available == true"

      - name: claim_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Claim
        distinguishing_aspect: "POST /ui/claims generates id (UUID, no prefix), created_at, updated_at, version==1; client-supplied status is ignored and set to DRAFT."
        test_recipe:
          setup: ["A claimant."]
          setup_api_calls:
            - call: "POST /ui/claimants"
              payload: { full_name: "Sys Field", ssn_last4: "5050", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
          trigger:
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "response status == 201"
            - "Claim.${claim_id}.status == DRAFT"
            - "Claim.${claim_id}.version == 1"

      - name: wage_record_bad_quarter_format_rejected
        claim_type: Type Constraints
        grounds:
          - entities.WageRecord.fields.calendar_quarter
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /ui/wage-records with calendar_quarter '2025-Q9' (invalid quarter) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An employer and a claimant."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Tc Co", state_account_number: "TC-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Tc Test", ssn_last4: "6060", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
          trigger:
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q9", gross_wages_cents: 10000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: wage_record_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.WageRecord
        distinguishing_aspect: "WageRecord uses common_fields:false; its create response carries id and created_at but no version field (only is_disputed is mutable via PATCH)."
        test_recipe:
          setup: ["An employer and a claimant."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Im Co", state_account_number: "IM-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Im Test", ssn_last4: "7070", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
          trigger:
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 10000 }
              as: ProgramAdmin
              captures: { wr_id: $.data.id }
          assert:
            - "response status == 201"
            - "WageRecord.${wr_id} response has no version field"
            - "WageRecord.${wr_id}.is_disputed == false"

      - name: wage_record_bad_employer_reference
        claim_type: Parent Relationships
        grounds:
          - entities.WageRecord.fields.employer_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /ui/wage-records with a nonexistent employer_id returns ERR_NOT_FOUND (404) at the existence pass."
        test_recipe:
          setup: ["A claimant only (no employer)."]
          setup_api_calls:
            - call: "POST /ui/claimants"
              payload: { full_name: "Pr Test", ssn_last4: "8080", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
          trigger:
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "00000000-0000-4000-8000-000000000001", calendar_quarter: "2025-Q1", gross_wages_cents: 10000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: employer_charge_computed_field_correct
        claim_type: Computed Fields
        grounds:
          - excluded_via_difficulty
        excluded_because:
          difficulty_instance: "dual_variant_calc / employer_charge_single_vs_multi_allocation_diverge"
          rationale: "EmployerCharge.charge_amount_cents correctness (6389/5111 split) is asserted by the named §1.8 instance."

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: claim_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.Claim
          - entities.Claim.fields.status
        distinguishing_aspect: "A newly created Claim starts in DRAFT (initial_state)."
        test_recipe:
          setup: ["A claimant."]
          setup_api_calls:
            - call: "POST /ui/claimants"
              payload: { full_name: "Init St", ssn_last4: "9090", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
          trigger:
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.status == DRAFT"

      - name: submit_claim_from_draft_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.Claim.DRAFT_to_MONETARY_PENDING
        distinguishing_aspect: "POST /ui/claims/{id}/submit moves DRAFT -> MONETARY_PENDING and bumps version to 2."
        test_recipe:
          setup: ["A claimant with one non-disputed wage record; a DRAFT claim."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Sub Co", state_account_number: "SB-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Sub Mit", ssn_last4: "0101", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 780000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
          assert:
            - "Claim.${claim_id}.status == MONETARY_PENDING"
            - "Claim.${claim_id}.version == 2"

      - name: submit_claim_without_wages_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Claim.DRAFT_to_MONETARY_PENDING
          - errors[ERR_NO_QUALIFYING_WAGES]
        distinguishing_aspect: "Submitting a DRAFT claim whose claimant has no non-disputed WageRecord returns ERR_NO_QUALIFYING_WAGES (422)."
        test_recipe:
          setup: ["A claimant with NO wage records; a DRAFT claim."]
          setup_api_calls:
            - call: "POST /ui/claimants"
              payload: { full_name: "No Wage", ssn_last4: "1102", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_NO_QUALIFYING_WAGES"

      - name: submit_already_submitted_claim_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Claim.DRAFT_to_MONETARY_PENDING
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting a claim already in MONETARY_PENDING returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A claim submitted to MONETARY_PENDING."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Idem Co", state_account_number: "ID-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Idem Test", ssn_last4: "1203", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 780000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
          trigger:
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: appeal_dismiss_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Appeal.SUBMITTED_to_DISMISSED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Assigning a referee to an Appeal already DISMISSED (terminal) returns ERR_INVALID_STATE (409); no transition out of a terminal state."
        test_recipe:
          setup: ["A MONETARY DENIED determination; an untimely Appeal dismissed."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Term Co", state_account_number: "TM-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Term Test", ssn_last4: "1304", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 5000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-01-04" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
              as_user_id: "adj-term"
              captures: { det_id: $.data.id }
            - call: "POST /ui/appeals"
              payload: { determination_id: "${det_id}", filed_by: "CLAIMANT", filed_date: "2026-06-01" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /ui/appeals/${appeal_id}/dismiss"
              payload: {}
              as: AppealsClerk
          trigger:
            - call: "POST /ui/appeals/${appeal_id}/assign"
              payload: { assigned_referee_id: "ref-term" }
              as: AppealsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: weekly_certification_initial_axes
        claim_type: Initial State
        grounds:
          - state_machines.WeeklyCertification
          - entities.WeeklyCertification.fields.adjudication_status
          - entities.WeeklyCertification.fields.payment_status
        distinguishing_aspect: "A new WeeklyCertification starts adjudication_status PENDING and payment_status UNPAID (both axes at their initial states)."
        test_recipe:
          setup: ["Claim S MONETARILY_ELIGIBLE."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Wc Co", state_account_number: "WCI-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Wc Init", ssn_last4: "1405", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 780000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
          trigger:
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
          assert:
            - "WeeklyCertification.${wc_id}.adjudication_status == PENDING"
            - "WeeklyCertification.${wc_id}.payment_status == UNPAID"
            - "WeeklyCertification.${wc_id}.work_search_required == true"

      - name: extension_apply_restores_balance_cyclic
        claim_type: cyclic
        grounds:
          - state_machines.Claim.EXHAUSTED_to_MONETARILY_ELIGIBLE
          - calculations.extension_eligibility
          - calculations.maximum_benefit_amount
          - entities.Claim.fields.extension_weeks_granted
        distinguishing_aspect: "An EXHAUSTED Claim X (WBA 5000) with a matching active extension granting 13 weeks moves EXHAUSTED -> MONETARILY_ELIGIBLE; MBA grows by 13*5000=65000 (65000 -> 130000) and remaining_balance becomes 65000."
        test_recipe:
          setup: ["Claim X (WBA 5000, MBA 65000) driven to EXHAUSTED via the balance hook then a final pay; an active extension program covering filed_date 2026-04-05 granting 13 extra weeks."]
          setup_api_calls:
            - call: "POST /ui/extension-programs"
              payload: { program_code: "PEUC-CYC", extra_weeks: 13, trigger_start_date: "2026-01-01", trigger_end_date: "2026-12-31", waives_work_search: true, is_active: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "Ext Co", state_account_number: "EXT-1", experience_rate: 0.03, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Ext Test", ssn_last4: "1506", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 130000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /_ledger/set_claim_balance"
              payload: { claim_id: "${claim_id}", remaining_balance_cents: 5000 }
              as: ProgramAdmin
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", reported_earnings_cents: 0, work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /ui/weekly-certifications/${wc_id}/adjudicate"
              payload: { decision: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications/${wc_id}/pay"
              payload: {}
              as: BenefitPaymentOfficer
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: Adjudicator
              captures: { claim_v: $.data.version }
          trigger:
            - call: "POST /ui/claims/${claim_id}/apply-extension"
              payload: { program_id: "${prog_id}", expected_claim_version: "${claim_v}" }
              as: Adjudicator
          assert:
            - "Claim.${claim_id}.status == MONETARILY_ELIGIBLE"
            - "Claim.${claim_id}.extension_weeks_granted == 13"
            - "Claim.${claim_id}.maximum_benefit_amount_cents == 130000"
            - "Claim.${claim_id}.remaining_balance_cents == 65000"

      - name: monetary_ineligible_terminal_for_pay_path
        claim_type: compound
        grounds:
          - state_machines.Claim.MONETARY_PENDING_to_MONETARILY_INELIGIBLE
          - entities.Determination.fields.outcome
        distinguishing_aspect: "A claim that fails BOTH STANDARD and ALTERNATE monetary tests moves MONETARY_PENDING -> MONETARILY_INELIGIBLE; its MONETARY Determination outcome is DENIED, WBA and MBA remain 0, base_period_method == NONE."
        test_recipe:
          setup: ["Claimant with a single tiny wage record (5000) failing both base-period qualification tests; claim submitted."]
          setup_api_calls:
            - call: "POST /ui/employers"
