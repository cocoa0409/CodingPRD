      - name: evidence_weights_applied_once_and_rescored_on_every_patch
        claim_type: constants_applied
        grounds:
          - calculations.evidence_weighted_score
          - entities.ClinicalEvidenceReview.fields.conversion_recommendation
          - endpoints[PATCH /gpo/clinical-evidence-reviews/{review_id}/scores]
        distinguishing_aspect: "The declared constants W_EFFICACY 0.40, W_SAFETY 0.35, W_RESILIENCE 0.25 are applied to the three unrounded products and rounded exactly once, and every PATCH re-scores from scratch: 6.50/7.00/6.00 gives 6.55 DO_NOT_CONVERT, 8.00/7.00/6.00 gives 7.15 CONVERT, and 7.00/7.00/7.02 gives 7.0050 which ROUND_HALF_UP takes to 7.01 — binary floating point would report 7.00 and flip nothing."
        test_recipe:
          setup: ["DRAFT contract C-WGT; one review UNDER_REVIEW submitted by CR-1 with scores 6.50 / 7.00 / 6.00."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-WGT", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/clinical-evidence-reviews"
              payload: { contract_id: "${c1}", clinical_efficacy_score: 6.50, safety_score: 7.00, supply_resilience_score: 6.00, summary: "initial dossier" }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { r1: $.data.id, w0: $.data.weighted_score, c0: $.data.conversion_recommendation }
          trigger:
            - call: "PATCH /gpo/clinical-evidence-reviews/${r1}/scores"
              payload: { clinical_efficacy_score: 8.00, safety_score: 7.00, supply_resilience_score: 6.00 }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { w1: $.data.weighted_score, cr1: $.data.conversion_recommendation }
            - call: "PATCH /gpo/clinical-evidence-reviews/${r1}/scores"
              payload: { clinical_efficacy_score: 7.00, safety_score: 7.00, supply_resilience_score: 7.02 }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { w2: $.data.weighted_score, cr2: $.data.conversion_recommendation }
          assert:
            - "${w0} == 6.55 (2.60 + 2.45 + 1.50) with ${c0} == DO_NOT_CONVERT"
            - "${w1} == 7.15 (3.20 + 2.45 + 1.50) with ${cr1} == CONVERT — the recommendation is re-derived, not sticky"
            - "${w2} == 7.01 (2.80 + 2.45 + 1.755 == 7.0050, ROUND_HALF_UP) with ${cr2} == CONVERT"
            - "${w2} != 7.00 — the products are summed unrounded and rounded once at the end"
