        distinguishing_aspect: "Clock-driven transition: at clock 00:14:59 the quote is usable; after set_current_utc to 00:15:00 (== valid_until) GET reports EXPIRED and order create fails 409 ERR_QUOTE_EXPIRED — the boundary is inclusive at valid_until."
