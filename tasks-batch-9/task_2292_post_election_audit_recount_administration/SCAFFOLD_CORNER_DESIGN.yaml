      - name: election_patch_updates_only_the_supplied_fields_and_rebases_the_timeline
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/elections/{id}
          - calculations.certification_timeline_projection
          - entities.Election.fields.contest_window_ends_at
