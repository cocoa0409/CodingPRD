# =============================================================================
# Table 6: Error Code Catalog (60 codes, every one triggerable)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-Role header missing"
    applies_to: [all]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "X-Role is not among the endpoint's authorized roles"
    applies_to: [all]

  - id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    condition: "project_id in the path does not resolve"
    applies_to: ["/innovation-projects/{project_id} and all its sub-resources"]
  - id: ERR_STAGE_GATE_NOT_FOUND
    http_status: 404
    condition: "gate_id does not resolve, in the path or in a request body"
    applies_to: ["GET /stage-gates/{gate_id}", "POST /innovation-projects/{id}/gate-reviews", "POST /innovation-projects/{id}/deliverables"]
  - id: ERR_GATE_REVIEW_NOT_FOUND
    http_status: 404
    condition: "gate_review_id does not resolve"
    applies_to: ["all /gate-reviews/{gate_review_id} endpoints"]
  - id: ERR_DELIVERABLE_NOT_FOUND
    http_status: 404
    condition: "deliverable_id does not resolve"
    applies_to: ["all /deliverables/{deliverable_id} endpoints"]
  - id: ERR_PREREQUISITE_NOT_FOUND
    http_status: 404
    condition: "prerequisite_deliverable_id in the body does not resolve"
    applies_to: ["POST /deliverables/{id}/set-prerequisite", "POST /innovation-projects/{id}/deliverables"]
  - id: ERR_BUSINESS_CASE_NOT_FOUND
    http_status: 404
    condition: "business_case_id does not resolve"
    applies_to: ["GET /business-cases/{business_case_id}", "POST /business-cases/{id}/forecast-lines"]
  - id: ERR_FORMULATION_NOT_FOUND
    http_status: 404
    condition: "formulation_id does not resolve, in the path or in a request body"
    applies_to: ["GET /formulations/{formulation_id}", "POST /formulations/{id}/pilot-runs", "POST /formulations/{id}/shelf-life-studies", "POST /innovation-projects/{id}/label-approvals"]
  - id: ERR_PILOT_LINE_NOT_FOUND
    http_status: 404
    condition: "pilot_line_id does not resolve"
    applies_to: ["GET /pilot-lines/{pilot_line_id}", "POST /formulations/{id}/pilot-runs"]
  - id: ERR_PILOT_RUN_NOT_FOUND
    http_status: 404
    condition: "pilot_run_id does not resolve"
    applies_to: ["all /pilot-runs/{pilot_run_id} endpoints"]
  - id: ERR_SHELF_LIFE_STUDY_NOT_FOUND
    http_status: 404
    condition: "shelf_life_study_id does not resolve"
    applies_to: ["GET /shelf-life-studies/{shelf_life_study_id}", "POST /shelf-life-studies/{id}/timepoints"]
  - id: ERR_LABEL_APPROVAL_NOT_FOUND
    http_status: 404
    condition: "label_approval_id does not resolve"
    applies_to: ["all /label-approvals/{label_approval_id} endpoints"]
  - id: ERR_RETAILER_NOT_FOUND
    http_status: 404
    condition: "retailer_id does not resolve, in the path or in a request body"
    applies_to: ["GET /retailers/{retailer_id}", "POST /retailers/{id}/shelf-reset-windows", "POST /innovation-projects/{id}/sell-in-presentations"]
  - id: ERR_RESET_WINDOW_NOT_FOUND
    http_status: 404
    condition: "shelf_reset_window_id does not resolve, in the path or in a request body"
    applies_to: ["GET /shelf-reset-windows/{shelf_reset_window_id}", "POST /innovation-projects/{id}/sell-in-presentations", "POST /innovation-projects/{id}/launch-lock"]
  - id: ERR_PRESENTATION_NOT_FOUND
    http_status: 404
    condition: "presentation_id does not resolve"
    applies_to: ["all /sell-in-presentations/{presentation_id} endpoints"]

  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required field, unparseable body, illegal enum value, out-of-range number or malformed datetime"
    applies_to: ["all write endpoints"]

  - id: ERR_PROJECT_VERSION_CONFLICT
    http_status: 412
    condition: "expected_project_version does not equal the stored InnovationProject.version"
    applies_to: ["POST /innovation-projects/{id}/business-cases", "POST /innovation-projects/{id}/formulations"]
  - id: ERR_FORMULATION_VERSION_CONFLICT
    http_status: 412
    condition: "expected_formulation_version does not equal the stored Formulation.version"
    applies_to: ["POST /formulations/{id}/shelf-life-studies"]

  - id: ERR_PROJECT_INVALID_STATE
    http_status: 409
    condition: "the project's dev_status or commercial_status does not admit the operation. Admitted sets: screen requires dev_status IDEA; business-cases, formulations, deliverables and gate-reviews require dev_status IN (IDEA, SCREENED, PILOT_QUALIFIED, LAUNCH_READY); sell-in-presentations require dev_status IN (PILOT_QUALIFIED, LAUNCH_READY, LAUNCHED, IN_MARKET_FIX); launch-lock requires dev_status LAUNCH_READY with commercial_status IN (AUTHORIZED, LOCK_SLIPPED); launch requires dev_status LAUNCH_READY with commercial_status LAUNCH_LOCKED; post-launch-periods require dev_status IN (LAUNCHED, IN_MARKET_FIX)"
    applies_to: ["screen, business-cases, formulations, gate-reviews, sell-in-presentations, launch-lock, launch, post-launch-periods"]
  - id: ERR_GATE_REVIEW_INVALID_STATE
    http_status: 409
    condition: "the review is not in the state the operation requires"
    applies_to: ["open, votes, close, clear-conditions, expire-conditions"]
  - id: ERR_DELIVERABLE_INVALID_STATE
    http_status: 409
    condition: "the checklist item is not in the state the operation requires"
    applies_to: ["submit, decide, waive"]
  - id: ERR_BUSINESS_CASE_INVALID_STATE
    http_status: 409
    condition: "the case is LOCKED or SUPERSEDED and can take no further forecast lines"
    applies_to: ["POST /business-cases/{id}/forecast-lines"]
  - id: ERR_FORMULATION_INVALID_STATE
    http_status: 409
    condition: "the formulation is SUPERSEDED, or is not SHELF_LIFE_CLEARED when a label submit requires it"
    applies_to: ["POST /formulations/{id}/pilot-runs", "POST /formulations/{id}/shelf-life-studies", "POST /label-approvals/{id}/submit"]
  - id: ERR_PILOT_RUN_INVALID_STATE
    http_status: 409
    condition: "the run is not in the state the operation requires"
    applies_to: ["start, complete, cancel"]
  - id: ERR_STUDY_INVALID_STATE
    http_status: 409
    condition: "the study is already closed"
    applies_to: ["POST /shelf-life-studies/{id}/timepoints"]
  - id: ERR_LABEL_INVALID_STATE
    http_status: 409
    condition: "the label is not in the state the operation requires"
    applies_to: ["submit, decide"]
  - id: ERR_PRESENTATION_INVALID_STATE
    http_status: 409
    condition: "the presentation is not in the state the operation requires"
    applies_to: ["present, record-outcome, withdraw"]

  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    condition: "the acting X-User-ID equals the deliverable's submitted_by_user_id"
    applies_to: ["POST /deliverables/{id}/decide"]
  - id: ERR_OWNER_CANNOT_VOTE
    http_status: 403
    condition: "the acting X-User-ID equals the project's owner_user_id"
    applies_to: ["POST /gate-reviews/{id}/votes"]
  - id: ERR_CHAIR_CANNOT_VOTE_AND_CLOSE
    http_status: 403
    condition: "the acting X-User-ID already cast a GateVote on this review"
    applies_to: ["POST /gate-reviews/{id}/close"]

  - id: ERR_GATE_SEQUENCE_VIOLATION
    http_status: 409
    condition: "gate.gate_number does not equal project.next_gate_number"
    applies_to: ["POST /gate-reviews/{id}/open"]
  - id: ERR_GATE_REVIEW_ALREADY_IN_SESSION
    http_status: 409
    condition: "another review of the same project is IN_SESSION"
    applies_to: ["POST /gate-reviews/{id}/open"]
  - id: ERR_GATE_CONDITIONS_OPEN
    http_status: 409
    condition: "project.open_gate_conditions is true"
    applies_to: ["POST /gate-reviews/{id}/open"]
  - id: ERR_QUORUM_NOT_MET
    http_status: 409
    condition: "vote_count is below gate.quorum_size"
    applies_to: ["POST /gate-reviews/{id}/close"]
  - id: ERR_DUPLICATE_FUNCTION_VOTE
    http_status: 409
    condition: "a ballot for the same function already exists on the review"
    applies_to: ["POST /gate-reviews/{id}/votes"]
  - id: ERR_PREREQUISITE_NOT_SATISFIED
    http_status: 409
    condition: "the prerequisite checklist item is not APPROVED or WAIVED"
    applies_to: ["POST /deliverables/{id}/submit"]
  - id: ERR_DELIVERABLE_CYCLE
    http_status: 409
    condition: "the prerequisite edge would close a cycle, including a self-edge"
    applies_to: ["POST /deliverables/{id}/set-prerequisite", "POST /innovation-projects/{id}/deliverables"]
  - id: ERR_REGULATORY_WAIVER_FORBIDDEN
    http_status: 409
    condition: "a waive is attempted on a REGULATORY_CLEARANCE item"
    applies_to: ["POST /deliverables/{id}/waive"]
  - id: ERR_DUPLICATE_DELIVERABLE_TYPE
    http_status: 409
    condition: "a live checklist item already exists for the same (project_id, gate_id, deliverable_type)"
    applies_to: ["POST /innovation-projects/{id}/deliverables"]
  - id: ERR_DUPLICATE_CHANNEL_LINE
    http_status: 409
    condition: "the case already has a forecast line for that channel"
    applies_to: ["POST /business-cases/{id}/forecast-lines"]
  - id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    condition: "duplicate (category, gate_number), duplicate pilot line_code or duplicate retailer name"
    applies_to: ["POST /stage-gates", "POST /pilot-lines", "POST /retailers"]
  - id: ERR_PILOT_LINE_CONFLICT
    http_status: 409
    condition: "the buffer-extended half-open interval overlaps a SCHEDULED or RUNNING run on the same line"
    applies_to: ["POST /formulations/{id}/pilot-runs"]
  - id: ERR_RESET_WINDOW_CAPACITY_FULL
    http_status: 409
    condition: "booked_slot_count has reached max_presentations"
    applies_to: ["POST /innovation-projects/{id}/sell-in-presentations"]

  - id: ERR_WINDOW_RETAILER_MISMATCH
    http_status: 409
    condition: "the reset window does not belong to the named retailer"
    applies_to: ["POST /innovation-projects/{id}/sell-in-presentations"]
  - id: ERR_WINDOW_CATEGORY_MISMATCH
    http_status: 409
    condition: "the reset window category differs from the project category"
    applies_to: ["POST /innovation-projects/{id}/sell-in-presentations", "POST /innovation-projects/{id}/launch-lock"]
  - id: ERR_CHANNEL_NOT_FORECAST
    http_status: 409
    condition: "the retailer's channel has no forecast line on the project's authoritative business case"
    applies_to: ["POST /innovation-projects/{id}/sell-in-presentations"]
  - id: ERR_FORMULATION_PROJECT_MISMATCH
    http_status: 409
    condition: "the named formulation belongs to a different project"
    applies_to: ["POST /innovation-projects/{id}/label-approvals"]
  - id: ERR_LABEL_NOT_APPROVED
    http_status: 409
    condition: "no APPROVED or CONDITIONAL label exists on the newest non-SUPERSEDED formulation"
    applies_to: ["POST /innovation-projects/{id}/launch-lock"]
  - id: ERR_NO_LOCKED_BUSINESS_CASE
    http_status: 409
    condition: "the project's authoritative business case is not LOCKED, either because none was ever locked or because a newer case was raised after the lock"
    applies_to: ["POST /innovation-projects/{id}/post-launch-periods"]
  - id: ERR_PERIOD_SEQUENCE_VIOLATION
    http_status: 409
    condition: "period_index is not the existing period count plus one"
    applies_to: ["POST /innovation-projects/{id}/post-launch-periods"]

  - id: ERR_PRESENTATION_LEAD_TIME_VIOLATION
    http_status: 409
    condition: "scheduled_at is closer to window_start than presentation_lead_days whole days"
    applies_to: ["POST /innovation-projects/{id}/sell-in-presentations"]
  - id: ERR_LAUNCH_DATE_OUTSIDE_WINDOW
    http_status: 409
    condition: "launch_date falls outside the closed reset-window interval"
    applies_to: ["POST /innovation-projects/{id}/launch-lock"]
  - id: ERR_LOCK_LEAD_TIME_VIOLATION
    http_status: 409
    condition: "launch_date is fewer than LOCK_LEAD_DAYS whole days after current_utc"
    applies_to: ["POST /innovation-projects/{id}/launch-lock"]
  - id: ERR_LAUNCH_DATE_NOT_REACHED
    http_status: 409
    condition: "current_utc has not reached the locked launch_date"
    applies_to: ["POST /innovation-projects/{id}/launch"]
  - id: ERR_PRESENTATION_NOT_DUE
    http_status: 409
    condition: "current_utc has not reached scheduled_at"
    applies_to: ["POST /sell-in-presentations/{id}/present"]
  - id: ERR_PILOT_RUN_NOT_DUE
    http_status: 409
    condition: "current_utc has not reached window_start"
    applies_to: ["POST /pilot-runs/{id}/start"]
  - id: ERR_TIMEPOINT_OUT_OF_ORDER
    http_status: 409
    condition: "day_index is not strictly greater than every recorded day_index"
    applies_to: ["POST /shelf-life-studies/{id}/timepoints"]
  - id: ERR_CONDITIONS_DUE_PASSED
    http_status: 409
    condition: "current_utc is past conditions_due_at"
    applies_to: ["POST /gate-reviews/{id}/clear-conditions"]
  - id: ERR_CONDITIONS_NOT_DUE
    http_status: 409
    condition: "current_utc has not passed conditions_due_at"
    applies_to: ["POST /gate-reviews/{id}/expire-conditions"]

  - id: ERR_DELIVERABLE_CHECKLIST_INCOMPLETE
    http_status: 422
    condition: "deliverable_completeness_pct is below 100.00 on a passing close or a condition clearing"
    applies_to: ["POST /gate-reviews/{id}/close", "POST /gate-reviews/{id}/clear-conditions"]
  - id: ERR_GATE_READINESS_BELOW_FLOOR
    http_status: 422
    condition: "readiness_index is below gate.readiness_floor_index on a passing close"
    applies_to: ["POST /gate-reviews/{id}/close"]
  - id: ERR_ACCEPTED_SKU_EXCEEDS_PROPOSED
    http_status: 422
    condition: "accepted_sku_count exceeds proposed_sku_count"
    applies_to: ["POST /sell-in-presentations/{id}/record-outcome"]
  - id: ERR_LAUNCH_READINESS_INCOMPLETE
    http_status: 422
    condition: "launch_readiness_pct is below 100.00"
    applies_to: ["POST /innovation-projects/{id}/launch-lock"]
  - id: ERR_UNSUPPORTED_CLAIMS_REQUIRED
    http_status: 422
    condition: "a CONDITIONAL label decision carries an empty or absent unsupported_claims array"
    applies_to: ["POST /label-approvals/{id}/decide"]
  - id: ERR_DEV_BUDGET_EXCEEDED
    http_status: 422
    condition: "the post-write committed development budget would exceed development_budget_cap_usd"
    applies_to: ["POST /formulations/{id}/pilot-runs", "POST /formulations/{id}/shelf-life-studies"]
  - id: ERR_BUSINESS_CASE_HURDLE_NOT_MET
    http_status: 422
    condition: "the authoritative business case misses the NPV, payback or gross-margin hurdle on a passing close"
    applies_to: ["POST /gate-reviews/{id}/close"]

# =============================================================================
# Table 7: RBAC Permission Matrix — segregation of duties over opaque actors
# =============================================================================
roles:
  - name: PortfolioAdmin
    description: "Portfolio governance. Owns configuration roots, the logical clock, condition expiry and post-launch reporting."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /stage-gates"
      - "POST /retailers"
      - "POST /retailers/{id}/shelf-reset-windows"
      - "POST /pilot-lines"
      - "POST /gate-reviews/{id}/expire-conditions"
      - "POST /innovation-projects/{id}/post-launch-periods"
    shared_operations: ["every GET endpoint"]

  - name: InnovationLead
    description: "Owns the project record, consumer testing, business cases, checklist submissions and label drafting. Becomes the project's owner_user_id and is therefore barred from voting on its gates."
    identity: opaque
    exclusive_operations:
      - "POST /innovation-projects"
      - "POST /innovation-projects/{id}/concept-tests"
      - "POST /innovation-projects/{id}/business-cases"
      - "POST /business-cases/{id}/forecast-lines"
      - "POST /innovation-projects/{id}/label-approvals"
      - "POST /label-approvals/{id}/submit"
    shared_operations:
      - "POST /innovation-projects/{id}/deliverables"
      - "POST /deliverables/{id}/submit"
      - "POST /deliverables/{id}/set-prerequisite"
      - "every GET endpoint"

  - name: GateChair
    description: "Holds go/no-go authority: screening, scheduling, opening and closing gate reviews, waivers and the launch date lock. May not close a review in which the same user voted."
    identity: opaque
    exclusive_operations:
      - "POST /innovation-projects/{id}/screen"
      - "POST /innovation-projects/{id}/gate-reviews"
      - "POST /gate-reviews/{id}/open"
      - "POST /gate-reviews/{id}/close"
      - "POST /gate-reviews/{id}/clear-conditions"
      - "POST /deliverables/{id}/waive"
      - "POST /innovation-projects/{id}/launch-lock"
      - "POST /innovation-projects/{id}/launch"
    shared_operations:
      - "POST /innovation-projects/{id}/deliverables"
      - "POST /deliverables/{id}/set-prerequisite"
      - "every GET endpoint"

  - name: FunctionalReviewer
    description: "Cross-functional seat. Decides submitted checklist items and casts gate ballots. May not approve an item the same user submitted."
    identity: opaque
    exclusive_operations:
      - "POST /deliverables/{id}/decide"
    shared_operations:
      - "POST /gate-reviews/{id}/votes"
      - "POST /deliverables/{id}/submit"
      - "every GET endpoint"

  - name: RegulatoryApprover
    description: "Regulatory, claims and label authority. Decides label approvals and may also occupy the REGULATORY gate seat."
    identity: opaque
    exclusive_operations:
      - "POST /label-approvals/{id}/decide"
    shared_operations:
      - "POST /gate-reviews/{id}/votes"
      - "every GET endpoint"

  - name: RnDLead
    description: "Owns formulation, packaging and process development, pilot plant scale-up and stability testing."
    identity: opaque
    exclusive_operations:
      - "POST /innovation-projects/{id}/formulations"
      - "POST /formulations/{id}/pilot-runs"
      - "POST /pilot-runs/{id}/start"
      - "POST /pilot-runs/{id}/complete"
      - "POST /pilot-runs/{id}/cancel"
      - "POST /formulations/{id}/shelf-life-studies"
      - "POST /shelf-life-studies/{id}/timepoints"
    shared_operations:
      - "POST /deliverables/{id}/submit"
      - "every GET endpoint"

  - name: SalesAccountManager
    description: "Owns customer sell-in: trade presentation booking, presentation, outcome recording and withdrawal."
    identity: opaque
    exclusive_operations:
      - "POST /innovation-projects/{id}/sell-in-presentations"
      - "POST /sell-in-presentations/{id}/present"
      - "POST /sell-in-presentations/{id}/record-outcome"
      - "POST /sell-in-presentations/{id}/withdraw"
    shared_operations:
      - "POST /deliverables/{id}/submit"
      - "every GET endpoint"
