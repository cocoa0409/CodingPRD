# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Translation & Localization Services — Expert
#
# 9 Difficulty Rules × 2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7.
# OCC version inputs are always captured (never literal); job/project versions
# are bumped by cascades, so each instance re-reads the parent version right
# before an OCC-guarded write.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_quote_estimate_vs_final_invoice_diverge_on_project
        grounds:
          - calculations.quote_estimate
          - calculations.final_invoice
          - entities.Project.fields.quoted_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Same project, two algorithms on the INVOICE/PROJECT domain: quote_estimate over
          quoted bands (no revision surcharge) yields Project.quoted_total_cents=39613, while
          final_invoice over actual bands + 1 chargeable revision round yields Invoice.total_cents=44313.
        test_recipe:
          setup:
            - "Client ACTIVE; RateCard base_rate=15, linguist_rate=9, en-US→de-DE."
            - "Project EXPRESS + CERTIFIED, one job quoted {NO_MATCH 1200, FUZZY 600, REPS 400, CONTEXT 300}."
            - "Job delivered with actual {NO_MATCH 1300, FUZZY 600, REPS 400, CONTEXT 300} after 2 revision rounds (1 chargeable)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc_id: $.data.id }
            - call: "POST /linguists"
              payload: { full_name: "Trans One", native_locale: "de-DE", qualified_pairs: [ { source_locale: "en-US", target_locale: "de-DE" } ] }
              as: ProjectManager
              captures: { tl_id: $.data.id }
            - call: "POST /linguists"
              payload: { full_name: "Rev One", native_locale: "de-DE", qualified_pairs: [ { source_locale: "en-US", target_locale: "de-DE" } ], can_review: true }
              as: ProjectManager
              captures: { rl_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", rate_card_id: "${rc_id}", name: "P1", rush_tier: "EXPRESS", certification_mode: "CERTIFIED" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/jobs"
              payload: { filename: "a.docx", quoted_no_match_words: 1200, quoted_fuzzy_words: 600, quoted_reps_words: 400, quoted_context_words: 300 }
              as: ProjectManager
              captures: { job_id: $.data.id }
            - call: "POST /projects/${proj_id}/quote"
              payload: {}
              as: ProjectManager
              captures: { quoted_total: $.data.quoted_total_cents }
            - call: "POST /projects/${proj_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ProjectManager
              captures: { jv1: $.data.version }
            - call: "POST /assignments"
              payload: { job_id: "${job_id}", linguist_id: "${tl_id}", role: "TRANSLATOR", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-02T00:00:00.000Z", expected_job_version: "${jv1}" }
              as: ProjectManager
              captures: { ta_id: $.data.id }
            - call: "POST /assignments/${ta_id}/accept"
              payload: {}
              as: Translator
              as_user_id: "${tl_id}"
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ProjectManager
              captures: { jv2: $.data.version }
            - call: "POST /assignments"
              payload: { job_id: "${job_id}", linguist_id: "${rl_id}", role: "REVIEWER", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-02T00:00:00.000Z", expected_job_version: "${jv2}" }
              as: ProjectManager
              captures: { ra_id: $.data.id }
            - call: "POST /assignments/${ra_id}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rl_id}"
            - call: "POST /jobs/${job_id}/submit-translation"
              payload: {}
              as: Translator
              as_user_id: "${tl_id}"
            - call: "POST /jobs/${job_id}/qa-reports"
              payload: { reviewer_assignment_id: "${ra_id}", critical_count: 5, major_count: 0, minor_count: 0, scored_word_count: 2600 }
              as: Reviewer
              as_user_id: "${rl_id}"
            - call: "POST /jobs/${job_id}/submit-translation"
              payload: {}
              as: Translator
              as_user_id: "${tl_id}"
            - call: "POST /jobs/${job_id}/qa-reports"
              payload: { reviewer_assignment_id: "${ra_id}", critical_count: 5, major_count: 0, minor_count: 0, scored_word_count: 2600 }
              as: Reviewer
              as_user_id: "${rl_id}"
            - call: "POST /jobs/${job_id}/submit-translation"
              payload: {}
              as: Translator
              as_user_id: "${tl_id}"
            - call: "POST /jobs/${job_id}/qa-reports"
              payload: { reviewer_assignment_id: "${ra_id}", critical_count: 0, major_count: 0, minor_count: 1, scored_word_count: 2600 }
              as: Reviewer
              as_user_id: "${rl_id}"
            - call: "POST /jobs/${job_id}/deliver"
              payload: { actual_no_match_words: 1300, actual_fuzzy_words: 600, actual_reps_words: 400, actual_context_words: 300 }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/invoices"
              payload: {}
              as: AccountsReceivable
              captures: { inv_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: AccountsReceivable
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: { expected_project_version: "${pv1}" }
              as: AccountsReceivable
              captures: { total: $.data.total_cents }
          assert:
            - "Project.${proj_id}.quoted_total_cents == 39613"
            - "ProjectJob.${job_id}.revision_rounds == 2"
            - "Invoice.${inv_id}.total_cents == 44313"
            - "Invoice.${inv_id}.total_cents != Project.${proj_id}.quoted_total_cents"

      - name: dvc_linguist_provisional_vs_final_payout_on_linguist
        grounds:
