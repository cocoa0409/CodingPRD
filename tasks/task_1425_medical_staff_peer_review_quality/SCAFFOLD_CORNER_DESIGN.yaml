      - name: waived_slot_frees_capacity
        claim_type: satisfaction_pass
        grounds: ["validations[priority=8]", "state_machines.ReviewAssignment.PENDING_to_WAIVED"]
        distinguishing_aspect: "A WAIVED row does not count toward the 3-assignment cap: after one of three PENDING reviewers is deactivated, a replacement assignment succeeds."
        test_recipe:
