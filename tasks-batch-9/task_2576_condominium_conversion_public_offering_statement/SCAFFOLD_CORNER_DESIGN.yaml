      - name: create_response_detail_read_and_list_projection_agree_within_one_sequence
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - response_envelope.pagination_fields
          - endpoints[POST /conversion-projects/{id}/engineering-reports]
          - endpoints[GET /conversion-projects/{id}/engineering-reports]
          - endpoints[GET /engineering-reports/{id}]
        distinguishing_aspect: "Read-your-writes across three projections of the same row with no settle
          step: the create's 201 body, the detail GET issued immediately afterwards and the sibling list
          must agree field for field, and the list's total_count must jump 1 -> 2 -> 3 on the calls that
          directly follow each create rather than on a later refresh. The status filter is evaluated
          against the just-written value in the same sequence too, so filtering status=SUBMITTED right
          after the submit returns exactly the submitted report while status=DRAFT returns the other two -
          an eventually-consistent list projection would still show three DRAFT rows."
        test_recipe:
          setup:
            - "One empty ConversionProject with no engineering reports."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
