              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t18@x.com", full_name: "T Eighteen", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { net_after_pay: $.data.net_premium_collected_cents }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "POST /policies/${pol_id}/free-look-cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { net_after_refund: $.data.net_premium_collected_cents }
          assert:
            - "Policy.${pol_id}.premium_cents == 20000"
            - "net_premium_collected_cents after record-payment == 20000"
            - "Policy.${pol_id}.net_premium_collected_cents == 0 after the free-look refund completes"
            - "net_premium_collected_cents == premium_cents - sum(COMPLETED Refund.amount_cents) holds (0 == 20000 - 20000)"
