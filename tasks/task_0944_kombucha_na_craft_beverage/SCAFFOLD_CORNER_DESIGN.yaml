        distinguishing_aspect: "subscriber_email is unique across subscriptions whose status is ACTIVE or PAUSED, so the second create on the same address is refused with ERR_VALIDATION while the first subscription stays ACTIVE."
        test_recipe:
          setup: ["One ACTIVE subscription on kai@example.com."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
