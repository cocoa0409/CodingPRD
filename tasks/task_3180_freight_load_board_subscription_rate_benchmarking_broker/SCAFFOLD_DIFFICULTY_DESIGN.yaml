# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 3180 Freight Load Board
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: lane_benchmark_spot_only_vs_blended_diverge
        grounds:
          - calculations.lane_rate_benchmark
          - calculations.fuel_surcharge_pct
        distinguishing_aspect: |
          Same lane sample set: SPOT_ONLY excludes CONTRACT rows (p50=115200 on 5 samples)
          while BLENDED discounts CONTRACT rows to 95% and includes them (p50=124800 on 7
          samples) — identical raw data, two variants, different percentile sets.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Carrier C with FULL-analytics plan subscription (no contribution requirement)."
            - "5 SPOT transactions on DAL->HOU DRY_VAN, rates 100000/110000/120000/130000/140000, fuel 400."
            - "2 CONTRACT transactions same lane, rates 200000 and 210000, fuel 400."
          setup_api_calls:
            - &clock_aug1
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &plan_full
              call: "POST /subscription-plans"
              payload: { code: "ENTERPRISE", monthly_posting_allowance: 50, overage_tier1_limit: 10, overage_hard_cap: 20, search_daily_limit: 100, analytics_depth: "FULL", requires_data_contribution: false }
              as: PlatformAdmin
              captures: { plan_full_id: $.data.id }
            - &carrier_c
              call: "POST /carrier-orgs"
              payload: { legal_name: "Roadrunner Carriers", dot_number: "DOT-100" }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - &sub_carrier
              call: "POST /subscriptions"
              payload: { plan_id: "${plan_full_id}", carrier_org_id: "${carrier_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 100000, fuel_price_cents: 400, transaction_date: "2026-07-20T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 110000, fuel_price_cents: 400, transaction_date: "2026-07-21T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 120000, fuel_price_cents: 400, transaction_date: "2026-07-22T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 130000, fuel_price_cents: 400, transaction_date: "2026-07-23T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 140000, fuel_price_cents: 400, transaction_date: "2026-07-24T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "CONTRACT", rate_cents: 200000, fuel_price_cents: 400, transaction_date: "2026-07-25T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "CONTRACT", rate_cents: 210000, fuel_price_cents: 400, transaction_date: "2026-07-26T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
          trigger:
            - call: "GET /lane-rate-benchmarks"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", variant: "SPOT_ONLY" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
              captures: { spot_p50: $.data.p50_linehaul_cents, spot_n: $.data.sample_count }
            - call: "GET /lane-rate-benchmarks"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", variant: "BLENDED" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
              captures: { blend_p50: $.data.p50_linehaul_cents, blend_n: $.data.sample_count }
          assert:
            - "SPOT_ONLY: sample_count == 5, p25_linehaul_cents == 105600, p50_linehaul_cents == 115200, p75_linehaul_cents == 124800, fuel_adjusted_p50_cents == 119808"
            - "BLENDED: sample_count == 7, p25_linehaul_cents == 105600, p50_linehaul_cents == 124800, p75_linehaul_cents == 182400, fuel_adjusted_p50_cents == 129792"
            - "spot_p50 != blend_p50 for identical raw transaction data"

      - name: broker_credit_score_simple_vs_amount_weighted_diverge
        grounds:
          - calculations.broker_credit_score
        distinguishing_aspect: |
          On the BrokerOrg domain (distinct from lane benchmarks): with 5 included events
          dtp [30,30,30,30,60] and amounts [100000 x4, 10000], the selected AMOUNT_WEIGHTED
          variant yields score 84, whereas SIMPLE would yield 79 on the same data — and with
          only 3 events the selector flips to SIMPLE (score 73 for dtp [30,40,50]).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Broker B and carrier C exist and are ACTIVE."
            - "5 credit events on B: four with days_to_pay=30, invoice 100000; one with days_to_pay=60, invoice 10000."
          setup_api_calls:
            - *clock_aug1
            - &broker_b
              call: "POST /broker-orgs"
              payload: { legal_name: "Blue Ribbon Brokerage", mc_number: "MC-100" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - &carrier_c2_unused
              call: "POST /carrier-orgs"
              payload: { legal_name: "Prairie Linehaul", dot_number: "DOT-200" }
              as: PlatformAdmin
              captures: { carrier2_id: $.data.id }
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 100000, days_to_pay: 30 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 100000, days_to_pay: 30 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 100000, days_to_pay: 30 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 100000, days_to_pay: 30 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 10000, days_to_pay: 60 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
          trigger:
            - call: "GET /broker-orgs/${broker_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BrokerOrg.${broker_id}.credit_event_count == 5"
            - "BrokerOrg.${broker_id}.days_to_pay_weighted == 30.7317 (12600000/410000, round_half_up 4dp)"
            - "BrokerOrg.${broker_id}.days_to_pay_simple == 36.0"
            - "BrokerOrg.${broker_id}.credit_score == 84 (AMOUNT_WEIGHTED selected at count>=5)"
            - "BrokerOrg.${broker_id}.credit_badge == GOLD"
            - "credit_score != 79 (the value SIMPLE would have produced on the same events)"

  - rule_id: combinatorial_formula
    instances:
      - name: subscription_price_tiered_overage_and_analytics_addon
        grounds:
          - calculations.subscription_period_price_cents
          - calculations.posting_quota_check
        distinguishing_aspect: |
          Mode (a) combinatorial: price = f(plan base, posts_used vs allowance with two
          overage tiers, analytics addon) — 3+ inputs with non-linear tier interaction.
          PRO plan (base 24900, allowance 3, tier1_limit 2, LANE_LEVEL addon 2000) with
          posts_used==7 yields 24900 + 2*150 + 2*300 + 2000 = 27800.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. PRO plan (allowance 3, tier1_limit 2, hard cap 10, LANE_LEVEL)."
            - "Broker B with VERIFIED authority, ACTIVE subscription on that plan, and 7 OPEN load posts."
          setup_api_calls:
            - *clock_aug1
            - &plan_pro
              call: "POST /subscription-plans"
              payload: { code: "PRO", monthly_posting_allowance: 3, overage_tier1_limit: 2, overage_hard_cap: 10, search_daily_limit: 50, analytics_depth: "LANE_LEVEL", requires_data_contribution: false }
              as: PlatformAdmin
              captures: { plan_pro_id: $.data.id }
            - &broker_p
              call: "POST /broker-orgs"
              payload: { legal_name: "Heartland Freight Brokers", mc_number: "MC-300" }
              as: PlatformAdmin
              captures: { broker_p_id: $.data.id }
            - &sub_pro
              call: "POST /subscriptions"
              payload: { plan_id: "${plan_pro_id}", broker_org_id: "${broker_p_id}" }
              as: PlatformAdmin
              captures: { sub_pro_id: $.data.id }
            - &av_broker_p
              call: "POST /authority-verifications"
              payload: { broker_org_id: "${broker_p_id}", authority_reference: "MC-300-AUTH", insurance_windows: [{ effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }] }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
              captures: { av_p_id: $.data.id }
            - &av_broker_p_verify
              call: "POST /authority-verifications/${av_p_id}/verify"
              payload: {}
              as: ComplianceAnalyst
            - &lp1
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
            - &lp2
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
            - &lp3
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
            - &lp4
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
            - &lp5
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
            - &lp6
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
            - &lp7
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
          trigger:
            - call: "GET /subscriptions/${sub_pro_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Subscription.${sub_pro_id}.posts_used == 7"
            - "Subscription.${sub_pro_id}.period_price_cents == 27800 (24900 base + 2*150 tier1 + 2*300 tier2 + 2000 LANE_LEVEL addon)"

      - name: benchmark_rounding_order_per_transaction_then_percentile_then_readjust
        grounds:
          - calculations.lane_rate_benchmark
          - calculations.fuel_surcharge_pct
        distinguishing_aspect: |
          Mode (b) nested rounding: surcharge is rounded per transaction BEFORE the
          percentile, then the fuel re-adjustment is rounded AFTER the percentile. A lane
          with rates [101010, 102020, 103030, 104040, 105050] at fuel 337 (fsc 0.01) pins
          linehauls [100000, 101000, 102000, 103000, 104000]; reordering the rounding
          (percentile on raw rates then one rounding) would yield 103030 + 1030 = 104060.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Carrier C with FULL plan subscription (no contribution requirement)."
            - "5 SPOT transactions on ATL->MIA REEFER: rates 101010/102020/103030/104040/105050, fuel_price_cents=337 (fsc_pct = floor(37/25)*0.01 = 0.01)."
          setup_api_calls:
            - *clock_aug1
            - *plan_full
            - *carrier_c
            - *sub_carrier
            - call: "POST /rate-transactions"
              payload: { origin: "ATL", destination: "MIA", equipment_type: "REEFER", rate_kind: "SPOT", rate_cents: 101010, fuel_price_cents: 337, transaction_date: "2026-07-20T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "ATL", destination: "MIA", equipment_type: "REEFER", rate_kind: "SPOT", rate_cents: 102020, fuel_price_cents: 337, transaction_date: "2026-07-21T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "ATL", destination: "MIA", equipment_type: "REEFER", rate_kind: "SPOT", rate_cents: 103030, fuel_price_cents: 337, transaction_date: "2026-07-22T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "ATL", destination: "MIA", equipment_type: "REEFER", rate_kind: "SPOT", rate_cents: 104040, fuel_price_cents: 337, transaction_date: "2026-07-23T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "ATL", destination: "MIA", equipment_type: "REEFER", rate_kind: "SPOT", rate_cents: 105050, fuel_price_cents: 337, transaction_date: "2026-07-24T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
          trigger:
            - call: "GET /lane-rate-benchmarks"
              payload: { origin: "ATL", destination: "MIA", equipment_type: "REEFER", variant: "SPOT_ONLY" }
              as: CarrierAdmin
              as_user_id: "${carrier_id}"
          assert:
            - "sample_count == 5"
            - "p50_linehaul_cents == 102000 (103030 - round_half_up(1030.3) = 103030 - 1030)"
            - "p25_linehaul_cents == 101000 and p75_linehaul_cents == 103000"
            - "fuel_adjusted_p50_cents == 103020 (102000 + round_half_up(1020.0))"
            - "fuel_adjusted_p50_cents != 104060 (percentile-first single-rounding on raw rates: 103030 + round(1030.30))"

  - rule_id: non_linear_state_machine
    instances:
      - name: credit_dispute_rebuttal_cycle_returns_to_under_review
        grounds:
          - state_machines.CreditDispute
          - validations[priority=8]
        distinguishing_aspect: |
          Cyclic machine on CreditDispute: FILED -> UNDER_REVIEW -> REBUTTED -> UNDER_REVIEW
          -> REBUTTED is legal twice; a third rebut fails with ERR_REBUTTAL_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Broker B, carrier C, one PUBLISHED credit event, one FILED dispute on it."
          setup_api_calls:
            - *clock_aug1
            - *broker_b
            - *carrier_c2_unused
            - &cre1
              call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 50000, days_to_pay: 45 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
              captures: { cre1_id: $.data.id }
            - &disp1
              call: "POST /credit-report-events/${cre1_id}/disputes"
              payload: { reason: "Invoice was paid on time per ACH trace" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { disp1_id: $.data.id }
            - &disp1_review1
              call: "POST /credit-disputes/${disp1_id}/start-review"
              payload: {}
              as: ComplianceAnalyst
          trigger:
            - call: "POST /credit-disputes/${disp1_id}/rebut"
              payload: { rebuttal_note: "First rebuttal with bank letter" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /credit-disputes/${disp1_id}/start-review"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /credit-disputes/${disp1_id}/rebut"
              payload: { rebuttal_note: "Second rebuttal with signed POD" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /credit-disputes/${disp1_id}/start-review"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /credit-disputes/${disp1_id}/rebut"
              payload: { rebuttal_note: "Third rebuttal attempt" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "After first rebut: CreditDispute.${disp1_id}.status == REBUTTED and rebuttal_count == 1"
            - "After second cycle: status == REBUTTED and rebuttal_count == 2"
            - "Third rebut returns 409 and err == ERR_REBUTTAL_LIMIT_EXCEEDED"
            - "CreditDispute.${disp1_id}.status remains UNDER_REVIEW after the failed third rebut"

      - name: load_post_parallel_lifecycle_and_visibility_dimensions
        grounds:
          - state_machines.LoadPost
          - state_machines.BrokerOrg
        distinguishing_aspect: |
          Parallel dimensions on LoadPost: broker suspension flips visibility to DELISTED
          while lifecycle stays BOOKED; reinstatement restores visibility to LISTED without
          touching lifecycle — two independent state axes on one entity, unlike the cyclic
          CreditDispute machine.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Broker B with VERIFIED authority + ACTIVE subscription; carrier C with VERIFIED authority + ACTIVE subscription; one load OPEN, one truck AVAILABLE, one booking BOOKED."
          setup_api_calls:
            - *clock_aug1
            - *plan_pro
            - *broker_p
            - &sub_pro2
              call: "POST /subscriptions"
              payload: { plan_id: "${plan_pro_id}", broker_org_id: "${broker_p_id}" }
              as: PlatformAdmin
            - *av_broker_p
            - *av_broker_p_verify
            - &carrier_p
              call: "POST /carrier-orgs"
              payload: { legal_name: "Summit Trucking", dot_number: "DOT-400" }
              as: PlatformAdmin
              captures: { carrier_p_id: $.data.id }
            - &plan_ent2
              call: "POST /subscription-plans"
              payload: { code: "BASIC", monthly_posting_allowance: 10, overage_tier1_limit: 5, overage_hard_cap: 5, search_daily_limit: 20, analytics_depth: "NONE", requires_data_contribution: false }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.id }
            - &sub_carrier_p
              call: "POST /subscriptions"
              payload: { plan_id: "${plan_basic_id}", carrier_org_id: "${carrier_p_id}" }
              as: PlatformAdmin
            - &av_carrier_p
              call: "POST /authority-verifications"
              payload: { carrier_org_id: "${carrier_p_id}", authority_reference: "DOT-400-AUTH", insurance_windows: [{ effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }] }
              as: CarrierAdmin
              as_user_id: "${carrier_p_id}"
              captures: { av_cp_id: $.data.id }
            - &av_carrier_p_verify
              call: "POST /authority-verifications/${av_cp_id}/verify"
              payload: {}
              as: ComplianceAnalyst
            - &lpx
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
              captures: { load_id: $.data.id }
            - &tpx
              call: "POST /truck-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", available_from: "2026-08-02T00:00:00Z", available_until: "2026-08-05T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_p_id}"
              captures: { truck_id: $.data.id }
            - &bkx
              call: "POST /bookings"
              payload: { load_post_id: "${load_id}", truck_post_id: "${truck_id}", agreed_rate_cents: 148000 }
              as: CarrierAdmin
              as_user_id: "${carrier_p_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /broker-orgs/${broker_p_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /broker-orgs/${broker_p_id}/reinstate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "After suspend: LoadPost.${load_id}.status == BOOKED (lifecycle unchanged) and visibility == DELISTED"
            - "After reinstate: LoadPost.${load_id}.status == BOOKED and visibility == LISTED"
            - "Booking.${booking_id}.status == BOOKED throughout (booked bookings are not cancelled by a manual suspend... only by fraud-confirm cascade)"

  - rule_id: transitive_cascade
    instances:
      - name: fraud_confirm_cascades_alert_org_load_booking_truck_and_transactions
        grounds:
          - state_machines.FraudAlert
          - state_machines.BrokerOrg
          - state_machines.LoadPost
          - state_machines.Booking
          - state_machines.TruckPost
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /fraud-alerts/{id}/confirm: alert CONFIRMED ->
          BrokerOrg SUSPENDED -> open LoadPost WITHDRAWN and booked LoadPost DELISTED ->
          Booking on the booked load CANCELLED -> its TruckPost back to AVAILABLE — plus
          broker-reported RateTransactions EXCLUDED. Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Broker B (VERIFIED, subscribed), carrier C (VERIFIED, subscribed)."
            - "B has one OPEN load L1 and one BOOKED load L2 via booking BK on truck T of C."
            - "B has contributed one ACCEPTED rate transaction RT."
            - "A FraudAlert (DOUBLE_BROKERING) targeting B is OPEN."
          setup_api_calls:
            - *clock_aug1
            - *plan_pro
            - *broker_p
            - *sub_pro2
            - *av_broker_p
            - *av_broker_p_verify
            - *carrier_p
