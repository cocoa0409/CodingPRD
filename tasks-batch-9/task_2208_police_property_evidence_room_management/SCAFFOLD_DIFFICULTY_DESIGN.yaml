  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: evidence_item_parallel_custody_and_disposition_dimensions_advance_independently
        grounds:
          - "state_machines.EvidenceItem.STORED_to_CHECKED_OUT"
          - "state_machines.EvidenceItem.CHECKED_OUT_to_STORED"
          - "state_machines.EvidenceItem.RETAINED_to_COURT_HOLD"
          - "entities.EvidenceItem.fields.custody_state"
          - "entities.EvidenceItem.fields.disposition_state"
          - "state_machines.Case.ADJUDICATED_to_APPEAL_PENDING"
        distinguishing_aspect: |
          PARALLEL dimensions on the EvidenceItem entity: the custody dimension advances
          STORED -> CHECKED_OUT -> STORED while the disposition dimension independently advances
          RETAINED -> COURT_HOLD, and neither transition perturbs the other's value, so the observable
          combined state passes through (CHECKED_OUT, COURT_HOLD) which no single-dimension machine can
          represent.
        test_recipe:
          setup:
            - "One GENERAL item stored in G-01, case 26-00001 charged and adjudicated at 2026-09-15."
            - "A LAB_ANALYSIS transfer to L-200 is requested for 2026-09-16 to 2026-09-20."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Latent print card set", category: "GENERAL", packaging_type: "SEALED_ENVELOPE", appraised_value_cents: 1000, seized_at: "2026-07-31T10:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case1_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-09-16T00:00:00Z", due_back_at: "2026-09-20T00:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { transfer_id: $.data.id }
          trigger:
            - call: "POST /custody-transfers/${transfer_id}/release"
              payload: { released_signature: "T.NG-2026-09-16" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case1_id}/appeal"
              payload: {}
              as: CourtClerk
            - call: "GET /evidence-items/${item_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { mid_custody: $.data.custody_state, mid_disposition: $.data.disposition_state }
            - call: "POST /custody-transfers/${transfer_id}/return"
              payload: { receipt_signature: "L.RUIZ-2026-09-16" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          assert:
            - "After release: EvidenceItem.${item_id}.custody_state == 'CHECKED_OUT' and disposition_state == 'RETAINED' and retention_release_at == '2027-04-16T00:00:00.000Z'"
            - "After the appeal: ${mid_custody} == 'CHECKED_OUT' (custody dimension untouched by the disposition transition)"
            - "After the appeal: ${mid_disposition} == 'COURT_HOLD', retention_release_at == null, retention_basis == 'COURT_HOLD'"
            - "After the return: EvidenceItem.${item_id}.custody_state == 'STORED' and disposition_state == 'COURT_HOLD' (disposition dimension untouched by the custody transition)"
            - "EvidenceItem.${item_id}.current_holder_id == null and CustodyTransfer.${transfer_id}.status == 'RETURNED'"
            - "StorageLocation.${loc_g_id}.occupied_slots == 1 at every observable point (a CHECKED_OUT item keeps its slot)"

      - name: case_adjudicated_appeal_pending_cycle_recomputes_retention_twice
        grounds:
          - "state_machines.Case.ADJUDICATED_to_APPEAL_PENDING"
          - "state_machines.Case.APPEAL_PENDING_to_ADJUDICATED"
          - "calculations.retention_release_at"
          - "entities.Case.fields.adjudicated_at"
          - "entities.RetentionDetermination.fields.anchor_at"
        distinguishing_aspect: |
          CYCLIC on the Case entity: the ADJUDICATED -> APPEAL_PENDING -> ADJUDICATED loop re-anchors
          the FINAL retention variant on each pass, so the same item's retention_release_at moves
          2027-04-16 -> null -> 2027-07-02; a linear machine that treats adjudication as one-shot
          leaves the first value in place.
        test_recipe:
          setup:
            - "One GENERAL item stored in G-01 under case 26-00001 (statute TH-3, 365/30)."
            - "Case charged, then adjudicated with the clock at 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Ledger notebook", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 2000, seized_at: "2026-07-31T11:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case1_id}/adjudicate"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /cases/${case1_id}/appeal"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case1_id}/resolve-appeal"
              payload: {}
              as: CourtClerk
              captures: { case_status: $.data.status, adjudicated2: $.data.adjudicated_at }
          assert:
            - "After the first adjudication: EvidenceItem.${item_id}.retention_release_at == '2027-04-16T00:00:00.000Z'"
            - "After the appeal: Case.${case1_id}.status == 'APPEAL_PENDING', appeal_opened_at == '2026-09-15T00:00:00.000Z', EvidenceItem.${item_id}.retention_release_at == null"
            - "After resolve-appeal: ${case_status} == 'ADJUDICATED' and ${adjudicated2} == '2026-12-01T00:00:00.000Z' and appeal_opened_at == null"
            - "After resolve-appeal: EvidenceItem.${item_id}.retention_release_at == '2027-07-02T00:00:00.000Z' and retention_basis == 'FINAL'"
            - "GET /retention-determinations?evidence_item_id=${item_id} returns total_count == 4 (PRELIMINARY, FINAL, COURT_HOLD, FINAL) with exactly one row having superseded == false"
            - "The last RetentionDetermination has anchor_at == '2026-12-01T00:00:00.000Z' and statute_days_applied == 213"
            - "EvidenceItem.${item_id}.disposition_state == 'RETAINED' after the loop closes"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: audit_reconcile_missing_cascades_to_transfer_denial
        grounds:
          - "state_machines.AuditSession.IN_PROGRESS_to_RECONCILED"
          - "state_machines.EvidenceItem.STORED_to_MISSING"
          - "calculations.location_occupied_slots"
          - "calculations.room_posture"
          - "state_machines.PropertyRoom.OPEN_to_LOCKED_DOWN"
          - "state_machines.CustodyTransfer.REQUESTED_to_DENIED"
        distinguishing_aspect: |
          A DEPTH-4 chain in which each link is caused by the previous one: reconcile raises a MISSING
          Discrepancy (1), which drives the CURRENCY item STORED -> MISSING and releases its vault slot
          (2), which raises missing_high_risk_count to 1 and flips the room posture to LOCKED_DOWN (3),
          which denies the unrelated REQUESTED transfer on a different item in a different location (4).
        test_recipe:
          setup:
            - "A CURRENCY item (high-risk category) stored in V-01 and a GENERAL item stored in G-01, both under case 26-00001."
            - "A REQUESTED investigative-review transfer exists on the GENERAL item (created before the audit seal, while the posture is still OPEN)."
            - "An audit session on V-01 is started and no item is scanned."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
