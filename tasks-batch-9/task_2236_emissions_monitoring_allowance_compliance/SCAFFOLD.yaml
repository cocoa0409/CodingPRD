# =============================================================================
# PRD Benchmark Scaffold — task_2236
# Emissions Monitoring & Allowance Compliance
# Difficulty band: Expert+ (deliberately pushed past the §0.4 Expert ceiling)
# =============================================================================

scenario: |
  2236. Emissions Monitoring & Allowance Compliance (fossil fuel electric generating station): continuous emission monitoring system operation with daily calibration, quality assurance testing and data availability requirements, missing data substitution procedures and their impact on reported emissions, quarterly emissions reporting with electronic data submission and certification, allowance holdings management across programs with true-up at compliance deadlines and purchase or transfer decisions, source-specific permit limits with rolling averages and excess emission reporting, fuel sampling, analysis and heat input determination methods, relative accuracy test audits with passing criteria and retest procedures, compliance planning around unit dispatch and control equipment availability

domain_name: "emissions-monitoring-allowance-compliance"
api_prefix: "/emissions"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - bulk_operations

  entity_topology: hybrid
  # Facility -> Unit -> {MonitoringSystem, QuarterlyReport, PermitLimit, FuelSample,
  # ControlOutageWindow} is a tree; OperatingHour is cross-aggregate (unit_id +
  # quarterly_report_id + fuel_sample_id); RataTest is self-referential
  # (retest_of_rata_test_id); AllowanceTransaction is polymorphic across two
  # AllowanceAccount references (allowance_account_id + counterparty_account_id).

  state_machine_shape: parallel
  # MonitoringSystem carries two independent state dimensions (qa_status x
  # cal_status); RataTest is cyclic (FAILED -> retest SCHEDULED); QuarterlyReport
  # is cyclic-branching (CERTIFIED -> {ACCEPTED, REJECTED}, REJECTED -> DRAFT);
  # ExcessEmissionEvent is branching-with-revert (UNDER_REVIEW -> REPORTED).

  relationship_patterns:
    - one_to_many
    - self_referential      # RataTest.retest_of_rata_test_id -> RataTest.id
    - polymorphic           # AllowanceTransaction debits/credits either account side
    - cross_aggregate       # OperatingHour spans Unit + QuarterlyReport + FuelSample

  role_model: segregation_of_duties
  # Preparer submits, DesignatedRepresentative certifies (never the same
  # X-User-ID); AllowanceTrader proposes, DesignatedRepresentative records/settles.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Plant name.
      - name: orispl_code
        type: string
        source: input
        description: EIA/EPA plant code; unique across all Facility rows.
        constraints: "unique; 1-8 characters"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the plant site.
        constraints: "exactly 2 uppercase letters"
      - name: operator_org
        type: string
        source: input
        description: Legal operating company name.
      - name: programs
        type: array
        source: input
        description: Allowance programs this facility is subject to.
        constraints: "non-empty; members IN {ARP_SO2, CSAPR_NOX_ANNUAL, CSAPR_NOX_OZONE, CSAPR_SO2_G1}"
      - name: true_up_deadline_utc
        type: datetime
        source: input
        description: Allowance transfer deadline; true-up is rejected before this instant.
      - name: max_concurrent_control_outages
        type: integer
        source: input
        default: 2
        description: Aggregate cap on ControlOutageWindow rows in status IN {PLANNED, ACTIVE} whose interval intersects a candidate interval across all Units of this Facility.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: OPERATING
        description: Facility lifecycle.
        constraints: "IN {OPERATING, RETIRED}"
      - name: compliance_posture
        type: enum
        source: computed
        default: COMPLIANT
        description: "Derived from this facility's AllowanceAccount rows and its Units' OperatingHour data; see calculations.facility_compliance_posture."
        constraints: "IN {COMPLIANT, WATCH, DEFICIT}"

  - name: Unit
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; owning plant, supplied by the nested create path."
      - name: unit_identifier
        type: string
        source: input
        description: Boiler/unit designation.
        constraints: "unique within facility_id"
      - name: primary_fuel
        type: enum
        source: input
        description: Primary fuel burned.
        constraints: "IN {COAL, NATURAL_GAS, OIL}"
      - name: nameplate_capacity_mw
        type: number
        source: input
        description: Nameplate generating capacity in MW.
        constraints: "> 0"
      - name: max_rated_heat_input_mmbtu_hr
        type: number
        source: input
        description: Maximum rated hourly heat input, mmBtu/hr.
        constraints: "> 0"
      - name: control_device
        type: enum
        source: input
        description: Installed post-combustion control device.
        constraints: "IN {SCR, SNCR, FGD, NONE}"
      - name: control_status
        type: enum
        source: system
        default: AVAILABLE
        description: Control equipment availability, moved by PATCH dispatch and by ControlOutageWindow transitions.
        constraints: "IN {AVAILABLE, DEGRADED, OUT_OF_SERVICE}"
      - name: dispatch_state
        type: enum
        source: system
        default: OFFLINE
        description: Current dispatch position of the unit.
        constraints: "IN {ONLINE, OFFLINE, RESERVE_SHUTDOWN}"
      - name: dispatch_restricted
        type: boolean
        source: computed
        default: false
        description: True while the owning Facility.compliance_posture == DEFICIT; blocks dispatch_state transitions to ONLINE.
      - name: data_availability_pct
        type: number
        source: computed
        default: 100.0
        description: "Most recently computed monitor data availability for this unit; see calculations.monitor_data_availability_pct."
        constraints: "0.0 - 100.0, one decimal"
      - name: certified_so2_lbs_ytd
        type: number
        source: computed
        default: 0.0
        description: Conserved emissions ledger; equals the sum of total_so2_lbs over this unit's QuarterlyReport rows whose status IN {CERTIFIED, ACCEPTED}.
        constraints: ">= 0.0, one decimal"

  - name: MonitoringSystem
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; monitored unit, supplied by the nested create path."
      - name: parameter
        type: enum
        source: input
        description: Monitored parameter.
        constraints: "IN {SO2, NOX_RATE, CO2, FLOW}; unique per (unit_id, parameter) among rows with qa_status != RETIRED"
      - name: system_type
        type: enum
        source: input
        description: Monitoring approach.
        constraints: "IN {CEM, FLOW_MONITOR, EXCEPTED_APPENDIX_D}"
      - name: span_value
        type: number
        source: input
        description: Instrument span; also the maximum potential concentration used by substitution tier T4.
        constraints: "> 0"
      - name: calibration_error_spec_pct
        type: number
        source: input
        default: 2.5
        description: Daily calibration error specification, percent of span.
        constraints: "> 0"
      - name: qa_status
        type: enum
        source: system
        default: RECERTIFICATION_PENDING
        description: "Quality-assurance dimension of this system's parallel state machine (independent of cal_status)."
        constraints: "IN {RECERTIFICATION_PENDING, CERTIFIED, CONDITIONALLY_VALID, OUT_OF_CONTROL, RETIRED}"
      - name: cal_status
        type: enum
        source: system
        default: CAL_EXPIRED
        description: "Daily-calibration dimension of this system's parallel state machine (independent of qa_status)."
        constraints: "IN {CAL_CURRENT, CAL_EXPIRED, CAL_FAILED}"
      - name: consecutive_failed_calibrations
        type: integer
        source: computed
        default: 0
        description: Count of consecutive DailyCalibration rows with result != PASSED, ordered by calibration_utc ASC; reset to 0 by a PASSED calibration.
        constraints: ">= 0"
      - name: out_of_control_since_utc
        type: datetime
        source: computed
        description: calibration_utc of the DailyCalibration that drove qa_status to OUT_OF_CONTROL; null otherwise.
      - name: last_calibration_utc
        type: datetime
        source: computed
        description: calibration_utc of the most recent DailyCalibration for this system; null when none exists.
      - name: bias_adjustment_factor
        type: number
        source: computed
        default: 1.0
        description: "Most recent passing RataTest.bias_adjustment_factor for this system; see calculations.relative_accuracy_and_bias."
        constraints: ">= 1.0, four decimals"

  - name: DailyCalibration
    parent: MonitoringSystem
    common_fields: false
    fields:
      - name: monitoring_system_id
        type: string
        source: input
        description: "FK -> MonitoringSystem.id; calibrated system, supplied by the nested create path."
      - name: calibration_utc
        type: datetime
        source: input
        description: Instant the calibration was performed.
        constraints: "unique per (monitoring_system_id, calibration_utc)"
      - name: zero_reference_value
        type: number
        source: input
        description: Zero-level reference gas value injected.
      - name: zero_measured_value
        type: number
        source: input
        description: Zero-level analyzer response.
      - name: span_reference_value
        type: number
        source: input
        description: Upscale reference gas value injected.
      - name: span_measured_value
        type: number
        source: input
        description: Upscale analyzer response.
      - name: zero_error_pct_of_span
        type: number
        source: computed
        description: "See calculations.daily_calibration_error."
        constraints: ">= 0.0, two decimals"
      - name: span_error_pct_of_span
        type: number
        source: computed
        description: "See calculations.daily_calibration_error."
        constraints: ">= 0.0, two decimals"
      - name: result
        type: enum
        source: computed
        description: Outcome classification of this calibration.
        constraints: "IN {PASSED, FAILED, OUT_OF_CONTROL_TRIGGERED}"
      - name: monitoring_system_version_after
        type: integer
        source: computed
        description: MonitoringSystem.version observed after this calibration and all of its cascaded side effects were applied; the value a subsequent OCC call must send.
        constraints: ">= 2"

  - name: RataTest
    parent: MonitoringSystem
    common_fields: true
    fields:
      - name: monitoring_system_id
        type: string
        source: input
        description: "FK -> MonitoringSystem.id; audited system, supplied by the nested create path."
      - name: retest_of_rata_test_id
        type: string
        source: input
        description: "FK -> RataTest.id; self-referential retest pointer, set only when this row was created as the retest of a FAILED RataTest; null for first attempts."
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the scheduled audit window.
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the scheduled audit window.
        constraints: "> window_start_utc"
      - name: applicable_standard_value
        type: number
        source: input
        description: Emission standard used by the APPLICABLE_STANDARD relative-accuracy basis; null when only REFERENCE_MEAN is available.
        constraints: "> 0 when present"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: RATA lifecycle; FAILED is non-terminal because a retest re-enters SCHEDULED on a new row.
        constraints: "IN {SCHEDULED, RUNS_RECORDED, PASSED, FAILED, VOIDED}"
      - name: runs
        type: array
        source: input
        description: "Paired test runs, each { reference_value: number, cems_value: number }; recorded once by the runs endpoint."
        constraints: "length >= 9 and <= 12 when recorded"
      - name: run_count
        type: integer
        source: computed
        default: 0
        description: Number of recorded runs; selects the Student t value.
        constraints: "0, or 9-12"
      - name: reference_mean
        type: number
        source: computed
        description: Arithmetic mean of runs[].reference_value; null before runs are recorded.
        constraints: "six decimals"
      - name: cems_mean
        type: number
        source: computed
        description: Arithmetic mean of runs[].cems_value; null before runs are recorded.
        constraints: "six decimals"
      - name: mean_difference
        type: number
        source: computed
        description: Mean of (cems_value - reference_value) over runs; null before runs are recorded.
        constraints: "six decimals"
      - name: confidence_coefficient
        type: number
        source: computed
        description: "t(run_count) * sample_stdev(differences) / sqrt(run_count); null before runs are recorded."
        constraints: "six decimals"
      - name: ra_basis
        type: enum
        source: computed
        default: REFERENCE_MEAN
        description: Denominator basis actually used by the evaluate endpoint.
        constraints: "IN {REFERENCE_MEAN, APPLICABLE_STANDARD}"
      - name: relative_accuracy_pct
        type: number
        source: computed
        description: "See calculations.relative_accuracy_and_bias; null before evaluation."
        constraints: ">= 0.0, one decimal"
      - name: bias_test_failed
        type: boolean
        source: computed
        default: false
        description: True when abs(mean_difference) > abs(confidence_coefficient).
      - name: bias_adjustment_factor
        type: number
        source: computed
        default: 1.0
        description: "1 + abs(mean_difference)/cems_mean when bias_test_failed, else 1.0."
        constraints: ">= 1.0, four decimals"
      - name: attempt_number
        type: integer
        source: computed
        default: 1
        description: 1 for a first attempt; predecessor.attempt_number + 1 when retest_of_rata_test_id is set.
        constraints: ">= 1"

  - name: OperatingHour
    parent: Unit
    common_fields: false
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; reporting unit, supplied by the nested create path."
      - name: quarterly_report_id
        type: string
        source: system
        description: "FK -> QuarterlyReport.id; the DRAFT report whose (year, quarter) contains hour_begin_utc; resolved by the server, never supplied by the client."
      - name: fuel_sample_id
        type: string
        source: input
        description: "FK -> FuelSample.id; analysed sample supplying gcv_btu_per_lb and sulfur_content_pct; required when heat_input_method == APPENDIX_D_FUEL, null otherwise."
      - name: hour_begin_utc
        type: datetime
        source: input
        description: Start of the clock hour this record covers.
        constraints: "minutes/seconds/millis all zero; unique per (unit_id, hour_begin_utc)"
      - name: op_time_fraction
        type: number
        source: input
        description: Fraction of the hour the unit combusted fuel.
        constraints: ">= 0.0 and <= 1.0, two decimals"
      - name: gross_load_mw
        type: number
        source: input
        description: Average gross load during the operating portion of the hour.
        constraints: ">= 0"
      - name: heat_input_method
        type: enum
        source: input
        description: Heat-input determination method selected for this hour.
        constraints: "IN {CEMS_FLOW_CO2, APPENDIX_D_FUEL}"
      - name: flow_scfh
        type: number
        source: input
        description: Stack volumetric flow, standard cubic feet per hour; required for CEMS_FLOW_CO2 and for any SO2/CO2 mass from CEMS.
        constraints: ">= 0 when present"
      - name: co2_conc_pct
        type: number
        source: input
        description: Stack CO2 concentration, percent by volume; required for CEMS_FLOW_CO2.
        constraints: "> 0 and <= 20 when present"
      - name: so2_conc_ppm
        type: number
        source: input
        description: Stack SO2 concentration, ppm; absence marks the SO2 parameter UNAVAILABLE for this hour.
        constraints: ">= 0 when present"
      - name: nox_rate_lb_mmbtu
        type: number
        source: input
        description: NOx emission rate, lb/mmBtu.
        constraints: ">= 0 when present"
      - name: fuel_flow_lbs
        type: number
        source: input
        description: Mass of fuel burned in the hour, lb; required for APPENDIX_D_FUEL.
        constraints: ">= 0 when present"
      - name: heat_input_mmbtu
        type: number
        source: computed
        description: "See calculations.hourly_heat_input_and_mass; null when inputs are missing."
        constraints: "three decimals"
      - name: so2_mass_lbs
        type: number
        source: computed
        description: "See calculations.hourly_heat_input_and_mass; null while data_quality == UNAVAILABLE."
        constraints: "one decimal"
      - name: nox_mass_lbs
        type: number
        source: computed
        description: "nox_rate_lb_mmbtu * heat_input_mmbtu, one decimal; null while nox_rate_lb_mmbtu is absent."
        constraints: "one decimal"
      - name: co2_mass_tons
        type: number
        source: computed
        description: "(co2_conc_pct/100) * flow_scfh * op_time_fraction * K_CO2_LB_PER_SCF / 2000, three decimals."
        constraints: "three decimals"
      - name: data_quality
        type: enum
        source: computed
        description: MEASURED when the SO2 parameter was reported by a certified monitor; UNAVAILABLE when so2_conc_ppm is absent or the monitor was OUT_OF_CONTROL at this hour; SUBSTITUTED after the substitution endpoint filled it.
        constraints: "IN {MEASURED, SUBSTITUTED, UNAVAILABLE}"
      - name: substitution_method
        type: enum
        source: computed
        default: NONE
        description: "Substitution tier applied to this hour; see calculations.missing_data_substitution."
        constraints: "IN {NONE, T1_90TH_PERCENTILE, T2_95TH_PERCENTILE, T3_LOOKBACK_MAXIMUM, T4_MAX_POTENTIAL_CONCENTRATION}"
      - name: substituted_so2_conc_ppm
        type: number
        source: computed
        description: SO2 concentration written by the substitution procedure; null while substitution_method == NONE.
        constraints: ">= 0"
      - name: monitor_data_availability_pct_at_substitution
        type: number
        source: computed
        description: The monitor_data_availability_pct value that selected substitution_method for this hour; null while substitution_method == NONE.
        constraints: "0.0 - 100.0, one decimal"
      - name: quarterly_report_version_after
        type: integer
        source: computed
        description: QuarterlyReport.version observed after this hour and all of its cascaded side effects were applied; the value a subsequent OCC call must send.
        constraints: ">= 2"

  - name: FuelSample
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; sampled unit, supplied by the nested create path."
      - name: sample_utc
        type: datetime
        source: input
        description: Instant the sample was drawn.
      - name: fuel_type
        type: enum
        source: input
        description: Fuel sampled.
        constraints: "IN {COAL, NATURAL_GAS, OIL}"
      - name: lot_identifier
        type: string
        source: input
        description: Shipment/lot the sample represents.
        constraints: "unique per (unit_id, lot_identifier)"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Analysis lifecycle; INVALIDATED rows are re-openable to PENDING by a re-analysis.
        constraints: "IN {PENDING, ANALYZED, INVALIDATED}"
      - name: gcv_btu_per_lb
        type: number
        source: computed
        description: Gross calorific value from the lab analysis; null until status == ANALYZED.
        constraints: "> 0"
      - name: sulfur_content_pct
        type: number
        source: computed
        description: Sulfur content, weight percent; null until status == ANALYZED.
        constraints: ">= 0"
      - name: analysis_method
        type: enum
        source: computed
        description: Lab method recorded by the analysis endpoint; null until status == ANALYZED.
        constraints: "IN {ASTM_D5865, ASTM_D4239, GC_D1945}"
      - name: analyzed_utc
        type: datetime
        source: computed
        description: Logical-clock instant the analysis was recorded; null until status == ANALYZED.
      - name: invalidation_reason
        type: string
        source: computed
        description: Reason recorded when status moved to INVALIDATED; null otherwise.

  - name: QuarterlyReport
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; reported unit, supplied by the nested create path."
      - name: year
        type: integer
        source: input
        description: Calendar year of the reporting period.
        constraints: ">= 2000; unique per (unit_id, year, quarter)"
      - name: quarter
        type: integer
        source: input
        description: Calendar quarter of the reporting period.
        constraints: "IN {1, 2, 3, 4}"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Report lifecycle; REJECTED cycles back to DRAFT via reopen.
        constraints: "IN {DRAFT, VALIDATED, SUBMITTED, CERTIFIED, ACCEPTED, REJECTED}"
      - name: submission_format
        type: enum
        source: computed
        description: Electronic data submission format recorded at submit; null before.
        constraints: "IN {XML_ECMPS, JSON_ECMPS}"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the EmissionsReportPreparer that submitted; the certification endpoint rejects a DesignatedRepresentative whose X-User-ID equals this value.
      - name: submitted_utc
        type: datetime
        source: computed
        description: Logical-clock instant of submission; null before.
      - name: operating_hour_count
        type: integer
        source: computed
        default: 0
        description: Count of this report's OperatingHour rows with op_time_fraction > 0.
      - name: measured_hour_count
        type: integer
        source: computed
        default: 0
        description: Count of this report's OperatingHour rows with op_time_fraction > 0 AND data_quality == MEASURED.
      - name: substituted_hour_count
        type: integer
        source: computed
        default: 0
        description: Count of this report's OperatingHour rows with data_quality == SUBSTITUTED.
      - name: monitor_data_availability_pct
        type: number
        source: computed
        default: 100.0
        description: "See calculations.monitor_data_availability_pct evaluated over this report's whole period."
        constraints: "0.0 - 100.0, one decimal"
      - name: total_heat_input_mmbtu
        type: number
        source: computed
        default: 0.0
        description: "See calculations.quarterly_report_totals."
        constraints: "three decimals"
      - name: total_so2_lbs
        type: number
        source: computed
        default: 0.0
        description: "See calculations.quarterly_report_totals; round-per-hour-then-sum."
        constraints: "one decimal"
      - name: total_so2_tons
        type: number
        source: computed
        default: 0.0
        description: "round_half_up(total_so2_lbs / 2000, 3)."
        constraints: "three decimals"
      - name: total_nox_lbs
        type: number
        source: computed
        default: 0.0
        description: "See calculations.quarterly_report_totals; round-per-hour-then-sum."
        constraints: "one decimal"
      - name: total_co2_tons
        type: number
        source: computed
        default: 0.0
        description: "See calculations.quarterly_report_totals; round-per-hour-then-sum."
        constraints: "three decimals"
      - name: resubmission_count
        type: integer
        source: computed
        default: 0
        description: Number of times this report has re-entered DRAFT from REJECTED.
      - name: rejection_reason
        type: string
        source: computed
        description: Reason recorded by the RegulatoryReviewer on REJECT; null otherwise.

  - name: ComplianceCertification
    parent: QuarterlyReport
    common_fields: true
    fields:
      - name: quarterly_report_id
        type: string
        source: input
        description: "FK -> QuarterlyReport.id; certified report, supplied by the nested create path."
      - name: certifier_user_id
        type: string
        source: system
        description: X-User-ID of the DesignatedRepresentative that signed this certification.
      - name: statement_text
        type: string
        source: input
        description: Certification statement text.
        constraints: "length >= 10"
      - name: status
        type: enum
        source: system
        default: SIGNED
        description: Certification lifecycle.
        constraints: "IN {SIGNED, REVOKED}"
      - name: signed_utc
        type: datetime
        source: computed
        description: Logical-clock instant the certification was signed.
      - name: revoked_utc
        type: datetime
        source: computed
        description: Logical-clock instant of revocation; null while SIGNED.
      - name: revocation_reason
        type: string
        source: computed
        description: Reason recorded at revocation; null while SIGNED.
      - name: certified_so2_lbs_snapshot
        type: number
        source: computed
        description: QuarterlyReport.total_so2_lbs at signing; revocation debits exactly this amount from Unit.certified_so2_lbs_ytd so the ledger cannot drift.
        constraints: "one decimal"

  - name: PermitLimit
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; limited unit, supplied by the nested create path."
      - name: pollutant
        type: enum
        source: input
        description: Regulated pollutant.
        constraints: "IN {SO2, NOX_RATE, CO2}"
      - name: limit_value
        type: number
        source: input
        description: Permit limit value; an exceedance requires the rolling value to be strictly greater than this.
        constraints: "> 0, four decimals"
      - name: limit_units
        type: enum
        source: input
        description: Units of limit_value.
        constraints: "IN {LB_PER_MMBTU, LB_PER_HR, TONS_PER_YEAR}"
      - name: averaging_basis
        type: enum
        source: input
        description: Rolling-average geometry applied by the evaluate endpoint.
        constraints: "IN {ROLLING_3_HOUR, ROLLING_30_DAY, ANNUAL}"
      - name: effective_from_utc
        type: datetime
        source: input
        description: Hours before this instant are excluded from every rolling window.
      - name: current_rolling_value
        type: number
        source: computed
        description: "See calculations.rolling_average_limit_check; null when evaluation_status IN {NOT_EVALUATED, INSUFFICIENT_DATA}."
        constraints: "four decimals"
      - name: window_sample_count
        type: integer
        source: computed
        default: 0
        description: Number of window members (hours for ROLLING_3_HOUR, distinct operating UTC dates for ROLLING_30_DAY) found at the last evaluation.
      - name: window_evaluated_utc
        type: datetime
        source: computed
        description: as_of_utc of the last evaluation; null before the first.
      - name: evaluation_status
        type: enum
        source: computed
        default: NOT_EVALUATED
        description: Outcome of the last evaluation.
        constraints: "IN {NOT_EVALUATED, IN_COMPLIANCE, EXCEEDED, INSUFFICIENT_DATA}"

  - name: ExcessEmissionEvent
    parent: PermitLimit
    common_fields: true
    fields:
      - name: permit_limit_id
        type: string
        source: system
        description: "FK -> PermitLimit.id; the exceeded limit; set by the server when an evaluation produces evaluation_status == EXCEEDED."
      - name: unit_id
        type: string
        source: system
        description: "FK -> Unit.id; denormalised from the exceeded PermitLimit for cross-aggregate filtering."
      - name: detected_utc
        type: datetime
        source: system
        description: as_of_utc of the evaluation that detected the exceedance.
      - name: observed_value
        type: number
        source: system
        description: PermitLimit.current_rolling_value at detection.
        constraints: "four decimals"
      - name: limit_value_snapshot
        type: number
        source: system
        description: PermitLimit.limit_value at detection.
        constraints: "four decimals"
      - name: exceedance_magnitude
        type: number
        source: computed
        description: "round_half_up(observed_value - limit_value_snapshot, 4)."
        constraints: "> 0, four decimals"
      - name: penalty_allowance_debit_tons
        type: integer
        source: computed
        description: "See calculations.excess_event_penalty_debit; added to allowance obligation once the event reaches ENFORCEABLE."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: DETECTED
        description: Excess-emission lifecycle; UNDER_REVIEW can be returned to REPORTED.
        constraints: "IN {DETECTED, REPORTED, UNDER_REVIEW, EXCUSED, ENFORCEABLE, WITHDRAWN}"
      - name: narrative
        type: string
        source: computed
        description: Operator narrative recorded at report; null before.
      - name: corrective_action
        type: string
        source: computed
        description: Corrective action recorded at report; null before.
      - name: disposition_reason
        type: string
        source: computed
        description: Reason recorded by the reviewer at disposition; null before.
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: Number of times this event was returned from UNDER_REVIEW to REPORTED.

  - name: AllowanceAccount
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; account holder, supplied by the nested create path."
      - name: program
        type: enum
        source: input
        description: Allowance program this account holds.
        constraints: "IN {ARP_SO2, CSAPR_NOX_ANNUAL, CSAPR_NOX_OZONE, CSAPR_SO2_G1}; unique per (facility_id, program, compliance_year); must be a member of Facility.programs"
      - name: compliance_year
        type: integer
        source: input
        description: Compliance year this account trues up.
        constraints: ">= 2000"
      - name: holdings_current_vintage_tons
        type: number
        source: input
        description: Allowances held with vintage == compliance_year.
        constraints: ">= 0, three decimals"
      - name: holdings_prior_vintage_tons
        type: number
        source: input
        description: Banked allowances with vintage < compliance_year.
        constraints: ">= 0, three decimals"
      - name: holdings_next_vintage_tons
        type: number
        source: input
        description: Allowances held with vintage == compliance_year + 1; the only bucket a penalty deduction may debit, and it may go negative to represent encumbrance.
        constraints: ">= 0 at creation, three decimals"
      - name: obligation_tons
        type: integer
        source: computed
        default: 0
        description: "See calculations.allowance_true_up_waterfall; whole tons."
      - name: surrendered_tons
        type: number
        source: computed
        default: 0.0
        description: Sum of quantity_tons over this account's AllowanceTransaction rows with transaction_type == SURRENDER AND status == SETTLED.
        constraints: "three decimals"
      - name: penalty_deducted_tons
        type: number
        source: computed
        default: 0.0
        description: Sum of quantity_tons over this account's AllowanceTransaction rows with transaction_type == PENALTY_DEDUCTION AND status == SETTLED.
        constraints: "three decimals"
      - name: shortfall_tons
        type: number
        source: computed
        default: 0.0
        description: "Residual obligation after the waterfall; see calculations.allowance_true_up_waterfall."
        constraints: ">= 0, three decimals"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Account lifecycle; TRUE_UP_LOCKED blocks client-initiated SURRENDER/TRANSFER_OUT proposals.
        constraints: "IN {OPEN, TRUE_UP_LOCKED, CLOSED}"
      - name: true_up_utc
        type: datetime
        source: computed
        description: Logical-clock instant the true-up ran; null before.

  - name: AllowanceTransaction
    parent: AllowanceAccount
    common_fields: true
    fields:
      - name: allowance_account_id
        type: string
        source: input
        description: "FK -> AllowanceAccount.id; the account whose holdings this transaction moves."
      - name: counterparty_account_id
        type: string
        source: input
        description: "FK -> AllowanceAccount.id; receiving account for TRANSFER_OUT and sending account for TRANSFER_IN; null for PURCHASE, SURRENDER and PENALTY_DEDUCTION."
      - name: transaction_type
        type: enum
        source: input
        description: Nature of the allowance movement.
        constraints: "IN {PURCHASE, TRANSFER_IN, TRANSFER_OUT, SURRENDER, PENALTY_DEDUCTION}"
      - name: quantity_tons
        type: number
        source: input
        description: Allowance quantity moved.
        constraints: "> 0, three decimals"
      - name: vintage_year
        type: integer
        source: input
        description: Vintage of the allowances moved; determines the holdings bucket.
        constraints: "IN {compliance_year - 1, compliance_year, compliance_year + 1} of the target account"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: Transaction lifecycle; SETTLED and RECORDED are both reversible.
        constraints: "IN {PROPOSED, RECORDED, SETTLED, REVERSED}"
      - name: origin
        type: enum
        source: system
        default: MANUAL
        description: MANUAL for client-proposed rows; TRUE_UP_SURRENDER / TRUE_UP_PENALTY for rows synthesised by the true-up cascade.
        constraints: "IN {MANUAL, TRUE_UP_SURRENDER, TRUE_UP_PENALTY}"
      - name: debited_current_tons
        type: number
        source: computed
        default: 0.0
        description: Exact tons taken from holdings_current_vintage_tons at settle; a reversal credits back exactly this amount.
        constraints: "three decimals"
      - name: debited_prior_tons
        type: number
        source: computed
        default: 0.0
        description: Exact tons taken from holdings_prior_vintage_tons at settle; a reversal credits back exactly this amount.
        constraints: "three decimals"
      - name: debited_next_tons
        type: number
        source: computed
        default: 0.0
        description: Exact tons taken from holdings_next_vintage_tons at settle; a reversal credits back exactly this amount.
        constraints: "three decimals"
      - name: allowance_account_version_after
        type: integer
        source: computed
        description: AllowanceAccount.version observed after this transaction and all of its cascaded side effects were applied; the value a subsequent OCC call must send.
        constraints: ">= 2"
      - name: reversal_reason
        type: string
        source: computed
        description: Reason recorded at reversal; null otherwise.

  - name: ControlOutageWindow
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit whose control device is out, supplied by the nested create path."
      - name: start_utc
        type: datetime
        source: input
        description: Inclusive start of the outage interval.
      - name: end_utc
        type: datetime
        source: input
        description: Inclusive end of the outage interval.
        constraints: "> start_utc"
      - name: outage_type
        type: enum
        source: input
        description: Reason for the control-equipment outage.
        constraints: "IN {PLANNED_MAINTENANCE, FORCED, RATA_TEST_BYPASS}"
      - name: control_device
        type: enum
        source: input
        description: Device taken out of service.
        constraints: "IN {SCR, SNCR, FGD}; must equal Unit.control_device"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Outage lifecycle.
        constraints: "IN {PLANNED, ACTIVE, CLOSED, CANCELLED}"
      - name: activated_utc
        type: datetime
        source: computed
        description: Logical-clock instant of activation; null before.
      - name: closed_utc
        type: datetime
        source: computed
        description: Logical-clock instant of closure; null before.
      - name: cancellation_reason
        type: string
        source: computed
        description: Reason recorded at cancellation; null otherwise.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Parallel dimensions on one row: qa_status evolves independently of cal_status
  - entity: MonitoringSystem
    parallel_dimensions: [qa_status, cal_status]
    initial_state: RECERTIFICATION_PENDING
    initial_states: { qa_status: RECERTIFICATION_PENDING, cal_status: CAL_EXPIRED }
    terminal_states: [RETIRED]
    note: |
      Two independent axes on the same row. qa_status is moved by the QA-status
      endpoint and by RataTest outcomes; cal_status is moved by DailyCalibration
      results and by clock-driven staleness. A system may sit in
      (qa_status=CERTIFIED, cal_status=CAL_FAILED) or in
      (qa_status=OUT_OF_CONTROL, cal_status=CAL_CURRENT); neither axis constrains
      the other's reachable set, but hour classification reads BOTH.
    transitions:
      - from: RECERTIFICATION_PENDING
        to: CERTIFIED
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/qa-status with action=CERTIFY"
        actor: QAAnalyst
        preconditions:
          - "qa_status == RECERTIFICATION_PENDING"
          - "cal_status != CAL_FAILED (else ERR_CALIBRATION_NOT_CURRENT)"
          - "no RataTest for this monitoring_system_id has status == FAILED (else ERR_MONITOR_NOT_CERTIFIED)"
        side_effects:
          - "set qa_status = CERTIFIED; out_of_control_since_utc = null"
          - "if at least one RataTest for this system has status == PASSED, copy bias_adjustment_factor from the PASSED RataTest with the greatest window_end_utc (tie-break created_at ASC) into MonitoringSystem.bias_adjustment_factor; otherwise leave it at 1.0"
          - "increments MonitoringSystem.version by 1"
      - from: RECERTIFICATION_PENDING
        to: CONDITIONALLY_VALID
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/qa-status with action=CONDITIONALLY_VALIDATE"
        actor: QAAnalyst
        preconditions: ["qa_status == RECERTIFICATION_PENDING"]
        side_effects:
          - "set qa_status = CONDITIONALLY_VALID"
          - "increments MonitoringSystem.version by 1"
      - from: CONDITIONALLY_VALID
        to: CERTIFIED
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/qa-status with action=CERTIFY"
        actor: QAAnalyst
        preconditions:
          - "qa_status == CONDITIONALLY_VALID"
          - "cal_status != CAL_FAILED (else ERR_CALIBRATION_NOT_CURRENT)"
          - "no RataTest for this monitoring_system_id has status == FAILED (else ERR_MONITOR_NOT_CERTIFIED)"
        side_effects:
          - "set qa_status = CERTIFIED"
          - "increments MonitoringSystem.version by 1"
      - from: OUT_OF_CONTROL
        to: CERTIFIED
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/qa-status with action=CERTIFY"
        actor: QAAnalyst
        preconditions:
          - "qa_status == OUT_OF_CONTROL"
          - "cal_status == CAL_CURRENT (else ERR_CALIBRATION_NOT_CURRENT)"
          - "no RataTest for this monitoring_system_id has status == FAILED (else ERR_MONITOR_NOT_CERTIFIED)"
        side_effects:
          - "set qa_status = CERTIFIED; out_of_control_since_utc = null; consecutive_failed_calibrations = 0"
          - "increments MonitoringSystem.version by 1"
        note: "Restoring a system does NOT reclassify already-flipped OperatingHour rows; those stay SUBSTITUTED/UNAVAILABLE until the substitution endpoint runs."
      - from: CERTIFIED
        to: OUT_OF_CONTROL
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/daily-calibrations whose result == OUT_OF_CONTROL_TRIGGERED (system-driven cascade, link 1 of 4)"
        actor: system
        preconditions:
          - "qa_status IN {CERTIFIED, CONDITIONALLY_VALID}"
          - "the new DailyCalibration.result == OUT_OF_CONTROL_TRIGGERED"
        side_effects:
          - "LINK 1: set qa_status = OUT_OF_CONTROL, cal_status = CAL_FAILED, out_of_control_since_utc = the new DailyCalibration.calibration_utc; increments MonitoringSystem.version by 1"
          - "LINK 2 (caused by qa_status becoming OUT_OF_CONTROL, not by the calibration itself): every OperatingHour of this system's unit_id with hour_begin_utc >= out_of_control_since_utc truncated to the hour AND data_quality == MEASURED is set to data_quality = UNAVAILABLE with so2_mass_lbs = null; Unit.data_availability_pct is recomputed per calculations.monitor_data_availability_pct"
          - "LINK 3 (caused by the hour flips of LINK 2): for each distinct quarterly_report_id among the flipped hours, recompute the report's operating_hour_count / measured_hour_count / substituted_hour_count / monitor_data_availability_pct / total_* fields per calculations.quarterly_report_totals; a report whose status == VALIDATED reverts to DRAFT and increments its version by 1"
          - "LINK 4 (caused by the report recompute of LINK 3): every PermitLimit of the same unit_id with evaluation_status != NOT_EVALUATED is re-evaluated at its stored window_evaluated_utc per calculations.rolling_average_limit_check; a limit that becomes EXCEEDED creates a new ExcessEmissionEvent in DETECTED, and a limit that leaves EXCEEDED moves each of its ExcessEmissionEvent rows in status == DETECTED to WITHDRAWN"
      - from: CONDITIONALLY_VALID
        to: OUT_OF_CONTROL
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/daily-calibrations whose result == OUT_OF_CONTROL_TRIGGERED, or the second consecutive non-PASSED calibration"
        actor: system
        preconditions: ["qa_status == CONDITIONALLY_VALID"]
        side_effects:
          - "identical LINK 1-4 chain as the CERTIFIED -> OUT_OF_CONTROL transition"
      - from: CERTIFIED
        to: OUT_OF_CONTROL
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/qa-status with action=DECLARE_OUT_OF_CONTROL"
        actor: QAAnalyst
        preconditions: ["qa_status IN {CERTIFIED, CONDITIONALLY_VALID}"]
        side_effects:
          - "set qa_status = OUT_OF_CONTROL, out_of_control_since_utc = effective_utc; increments MonitoringSystem.version by 1"
          - "runs the same LINK 2 -> LINK 3 -> LINK 4 chain described on the calibration-driven transition, anchored at effective_utc"
      - from: CERTIFIED
        to: RETIRED
        dimension: qa_status
        trigger: "POST /emissions/monitoring-systems/{id}/qa-status with action=RETIRE"
        actor: QAAnalyst
        preconditions: ["qa_status != RETIRED"]
        side_effects:
          - "set qa_status = RETIRED; increments MonitoringSystem.version by 1"
          - "release the (unit_id, parameter) uniqueness slot so a replacement system can be created"
        note: "RECERTIFICATION_PENDING, CONDITIONALLY_VALID and OUT_OF_CONTROL also reach RETIRED by the same action."
      - from: CAL_EXPIRED
        to: CAL_CURRENT
        dimension: cal_status
        trigger: "POST /emissions/monitoring-systems/{id}/daily-calibrations whose result == PASSED"
        actor: FacilityOperator
        preconditions: ["qa_status != RETIRED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "set cal_status = CAL_CURRENT, last_calibration_utc = calibration_utc, consecutive_failed_calibrations = 0"
          - "increments MonitoringSystem.version by 1"
      - from: CAL_CURRENT
        to: CAL_FAILED
        dimension: cal_status
        trigger: "POST /emissions/monitoring-systems/{id}/daily-calibrations whose result IN {FAILED, OUT_OF_CONTROL_TRIGGERED}"
        actor: FacilityOperator
        preconditions: ["qa_status != RETIRED"]
        side_effects:
          - "set cal_status = CAL_FAILED, last_calibration_utc = calibration_utc, consecutive_failed_calibrations += 1"
          - "when consecutive_failed_calibrations reaches 2 the result is upgraded to OUT_OF_CONTROL_TRIGGERED and the qa_status cascade fires"
          - "increments MonitoringSystem.version by 1"
      - from: CAL_FAILED
        to: CAL_CURRENT
        dimension: cal_status
        trigger: "POST /emissions/monitoring-systems/{id}/daily-calibrations whose result == PASSED"
        actor: FacilityOperator
        preconditions: ["qa_status != RETIRED"]
        side_effects:
          - "set cal_status = CAL_CURRENT, consecutive_failed_calibrations = 0, last_calibration_utc = calibration_utc"
          - "increments MonitoringSystem.version by 1"
        note: "qa_status is untouched — a CERTIFIED system that failed one calibration is back to CAL_CURRENT without a QA action; an OUT_OF_CONTROL system stays OUT_OF_CONTROL."
      - from: CAL_CURRENT
        to: CAL_EXPIRED
        dimension: cal_status
        trigger: "POST /emissions/_clock/set_current_utc (system sweep)"
        actor: system
        preconditions:
          - "cal_status == CAL_CURRENT"
          - "last_calibration_utc < to_iso8601 - CALIBRATION_VALIDITY_HOURS"
        side_effects:
          - "set cal_status = CAL_EXPIRED; increments MonitoringSystem.version by 1"
          - "OperatingHour rows already persisted are NOT reclassified; only hours created after this sweep are classified UNAVAILABLE"

  # --- Genuine cycle on one row: SCHEDULED -> RUNS_RECORDED -> FAILED -> SCHEDULED
  - entity: RataTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: RUNS_RECORDED
        trigger: "POST /emissions/rata-tests/{id}/runs"
        actor: QAAnalyst
        preconditions:
          - "status == SCHEDULED"
          - "MonitoringSystem.qa_status != RETIRED"
          - "Unit.dispatch_state == ONLINE for the monitoring system's unit_id (else ERR_UNIT_NOT_ONLINE)"
          - "9 <= length(runs) <= 12 (else ERR_INSUFFICIENT_RATA_RUNS)"
        side_effects:
          - "store runs; set run_count, reference_mean, cems_mean, mean_difference, confidence_coefficient per calculations.relative_accuracy_and_bias step 1"
          - "increments RataTest.version by 1"
      - from: RUNS_RECORDED
        to: PASSED
        trigger: "POST /emissions/rata-tests/{id}/evaluate"
        actor: QAAnalyst
        preconditions:
          - "status == RUNS_RECORDED"
          - "when ra_basis == APPLICABLE_STANDARD: applicable_standard_value is not null AND reference_mean <= LOW_EMITTER_REFERENCE_MEAN[parameter] (else ERR_RA_BASIS_NOT_PERMITTED)"
          - "relative_accuracy_pct <= RA_PASS_THRESHOLD_PCT[parameter]"
        side_effects:
          - "set ra_basis, relative_accuracy_pct, bias_test_failed, bias_adjustment_factor; status = PASSED"
          - "if MonitoringSystem.qa_status == CERTIFIED, copy bias_adjustment_factor into MonitoringSystem.bias_adjustment_factor and increments MonitoringSystem.version by 1"
          - "increments RataTest.version by 1"
      - from: RUNS_RECORDED
        to: FAILED
        trigger: "POST /emissions/rata-tests/{id}/evaluate"
        actor: QAAnalyst
        preconditions:
          - "status == RUNS_RECORDED"
          - "relative_accuracy_pct > RA_PASS_THRESHOLD_PCT[parameter]"
        side_effects:
          - "set ra_basis, relative_accuracy_pct, bias_test_failed, bias_adjustment_factor; status = FAILED"
          - "if MonitoringSystem.qa_status == CERTIFIED, set it to CONDITIONALLY_VALID and increments MonitoringSystem.version by 1"
          - "increments RataTest.version by 1"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /emissions/rata-tests/{id}/reschedule"
        actor: QAAnalyst
        preconditions:
          - "status == FAILED"
          - "the new [window_start_utc, window_end_utc) does not overlap any other RataTest of the same monitoring_system_id with status IN {SCHEDULED, RUNS_RECORDED} (else ERR_RATA_WINDOW_OVERLAP)"
          - "window_start_utc >= the current logical clock (else ERR_RATA_WINDOW_IN_PAST)"
        side_effects:
          - "clear runs, run_count = 0, reference_mean / cems_mean / mean_difference / confidence_coefficient / relative_accuracy_pct = null, bias_test_failed = false, bias_adjustment_factor = 1.0"
          - "set window_start_utc / window_end_utc to the new pair, ra_basis = REFERENCE_MEAN, attempt_number += 1, status = SCHEDULED"
          - "increments RataTest.version by 1"
        note: "This is the retest loop: the same row re-enters SCHEDULED, so SCHEDULED -> RUNS_RECORDED -> FAILED -> SCHEDULED is a true cycle."
      - from: FAILED
        to: VOIDED
        trigger: "POST /emissions/units/{unit_id}/../monitoring-systems/{id}/rata-tests with retest_of_rata_test_id pointing at this row (system-driven)"
        actor: system
        preconditions: ["status == FAILED", "no other RataTest already references this row via retest_of_rata_test_id"]
        side_effects:
          - "set status = VOIDED; increments RataTest.version by 1"
          - "the newly created replacement RataTest starts in SCHEDULED with attempt_number = this row's attempt_number + 1"

  # --- Cyclic-branching with a system-driven revert
  - entity: QuarterlyReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /emissions/quarterly-reports/{id}/validate"
        actor: EmissionsReportPreparer
        preconditions:
          - "status == DRAFT"
          - "no MonitoringSystem of this report's unit_id has qa_status == OUT_OF_CONTROL (else ERR_MONITOR_OUT_OF_CONTROL)"
          - "every MonitoringSystem of this report's unit_id has qa_status IN {CERTIFIED, CONDITIONALLY_VALID} (else ERR_MONITOR_NOT_CERTIFIED)"
          - "no OperatingHour of this report references a FuelSample with status == INVALIDATED (else ERR_FUEL_ANALYSIS_INVALIDATED)"
          - "monitor_data_availability_pct >= DATA_AVAILABILITY_FLOOR_PCT (else ERR_DATA_AVAILABILITY_BELOW_FLOOR)"
        side_effects:
          - "recompute all total_* / *_count / monitor_data_availability_pct fields per calculations.quarterly_report_totals"
          - "set status = VALIDATED; increments QuarterlyReport.version by 1"
      - from: VALIDATED
        to: DRAFT
        trigger: "LINK 3 of the OUT_OF_CONTROL cascade, or POST /emissions/units/{unit_id}/operating-hours adding an hour to a VALIDATED report"
        actor: system
        preconditions: ["status == VALIDATED"]
        side_effects:
          - "recompute all total_* / *_count fields; set status = DRAFT; increments QuarterlyReport.version by 1"
      - from: VALIDATED
        to: SUBMITTED
        trigger: "POST /emissions/quarterly-reports/{id}/submit"
        actor: EmissionsReportPreparer
        preconditions: ["status == VALIDATED"]
        side_effects:
          - "set submission_format, submitted_by_user_id = X-User-ID, submitted_utc = logical clock, status = SUBMITTED"
          - "increments QuarterlyReport.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /emissions/quarterly-reports/{id}/certifications"
        actor: DesignatedRepresentative
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_quarterly_report_version == QuarterlyReport.version (else ERR_STALE_REPORT_VERSION)"
        side_effects:
          - "create ComplianceCertification in SIGNED with certified_so2_lbs_snapshot = total_so2_lbs, certifier_user_id = X-User-ID, signed_utc = logical clock"
          - "credit Unit.certified_so2_lbs_ytd += total_so2_lbs (one decimal) and increments Unit.version by 1"
          - "set status = CERTIFIED; increments QuarterlyReport.version by 1"
      - from: CERTIFIED
        to: SUBMITTED
        trigger: "POST /emissions/certifications/{id}/revoke"
        actor: DesignatedRepresentative
        preconditions: ["status == CERTIFIED", "the ComplianceCertification.status == SIGNED"]
        side_effects:
          - "set ComplianceCertification.status = REVOKED, revoked_utc, revocation_reason"
          - "debit Unit.certified_so2_lbs_ytd -= ComplianceCertification.certified_so2_lbs_snapshot (exactly the amount credited at signing, so the ledger returns to its pre-certification value) and increments Unit.version by 1"
          - "set status = SUBMITTED; increments QuarterlyReport.version by 1"
      - from: CERTIFIED
        to: ACCEPTED
        trigger: "POST /emissions/quarterly-reports/{id}/disposition with decision=ACCEPT"
        actor: RegulatoryReviewer
        preconditions: ["status == CERTIFIED"]
        side_effects:
          - "set status = ACCEPTED; increments QuarterlyReport.version by 1"
          - "the report's total_so2_tons / total_nox_lbs / total_co2_tons now enter calculations.allowance_true_up_waterfall for the matching compliance_year"
      - from: CERTIFIED
        to: REJECTED
        trigger: "POST /emissions/quarterly-reports/{id}/disposition with decision=REJECT"
        actor: RegulatoryReviewer
        preconditions: ["status == CERTIFIED", "reason is present"]
        side_effects:
          - "set status = REJECTED, rejection_reason = reason"
          - "set the report's SIGNED ComplianceCertification to REVOKED and debit Unit.certified_so2_lbs_ytd by its certified_so2_lbs_snapshot; increments Unit.version by 1"
          - "increments QuarterlyReport.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /emissions/quarterly-reports/{id}/reopen"
        actor: EmissionsReportPreparer
        preconditions: ["status == REJECTED"]
        side_effects:
          - "set status = DRAFT, resubmission_count += 1, submission_format = null, submitted_by_user_id = null, submitted_utc = null, rejection_reason = null"
          - "increments QuarterlyReport.version by 1"

  - entity: ComplianceCertification
    initial_state: SIGNED
    terminal_states: [REVOKED]
    transitions:
      - from: SIGNED
        to: REVOKED
        trigger: "POST /emissions/certifications/{id}/revoke, or the REJECT disposition on the parent report"
        actor: DesignatedRepresentative
        preconditions: ["status == SIGNED"]
        side_effects:
          - "set revoked_utc = logical clock, revocation_reason"
          - "reverts the parent QuarterlyReport CERTIFIED -> SUBMITTED (revoke path) or leaves it REJECTED (disposition path)"
          - "debits Unit.certified_so2_lbs_ytd by exactly certified_so2_lbs_snapshot"
          - "increments ComplianceCertification.version by 1"

  # --- Branching with revert
  - entity: ExcessEmissionEvent
    initial_state: DETECTED
    terminal_states: [EXCUSED, ENFORCEABLE, WITHDRAWN]
    transitions:
      - from: DETECTED
        to: REPORTED
        trigger: "POST /emissions/excess-emission-events/{id}/report"
        actor: EmissionsReportPreparer
        preconditions: ["status == DETECTED"]
        side_effects:
          - "set narrative, corrective_action, status = REPORTED; increments version by 1"
      - from: DETECTED
        to: WITHDRAWN
        trigger: "POST /emissions/permit-limits/{id}/evaluate (or LINK 4 of the OUT_OF_CONTROL cascade) whose new evaluation_status != EXCEEDED"
        actor: system
        preconditions: ["status == DETECTED", "the parent PermitLimit's fresh evaluation_status IN {IN_COMPLIANCE, INSUFFICIENT_DATA}"]
        side_effects:
          - "set status = WITHDRAWN; increments version by 1"
          - "the event's penalty_allowance_debit_tons no longer enters any allowance obligation"
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /emissions/excess-emission-events/{id}/review"
        actor: RegulatoryReviewer
        preconditions: ["status == REPORTED"]
        side_effects: ["set status = UNDER_REVIEW; increments version by 1"]
      - from: UNDER_REVIEW
        to: REPORTED
        trigger: "POST /emissions/excess-emission-events/{id}/disposition with decision=RETURN"
        actor: RegulatoryReviewer
        preconditions: ["status == UNDER_REVIEW", "reason is present"]
        side_effects:
          - "set disposition_reason = reason, return_count += 1, status = REPORTED; increments version by 1"
        note: "Revert edge — the same row can be reviewed again, so REPORTED -> UNDER_REVIEW -> REPORTED loops."
      - from: UNDER_REVIEW
        to: EXCUSED
        trigger: "POST /emissions/excess-emission-events/{id}/disposition with decision=EXCUSE"
        actor: RegulatoryReviewer
        preconditions: ["status == UNDER_REVIEW", "reason is present"]
        side_effects: ["set disposition_reason, status = EXCUSED; increments version by 1"]
      - from: UNDER_REVIEW
        to: ENFORCEABLE
        trigger: "POST /emissions/excess-emission-events/{id}/disposition with decision=ENFORCE"
        actor: RegulatoryReviewer
        preconditions: ["status == UNDER_REVIEW"]
        side_effects:
          - "set status = ENFORCEABLE; increments version by 1"
          - "penalty_allowance_debit_tons now enters calculations.allowance_true_up_waterfall for every AllowanceAccount of this unit's facility whose program pollutant matches the parent PermitLimit.pollutant and whose compliance_year == year(detected_utc)"

  - entity: AllowanceAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRUE_UP_LOCKED
        trigger: "POST /emissions/allowance-accounts/{id}/true-up when the waterfall leaves shortfall_tons > 0 (LINK 1 of 4)"
        actor: RegulatoryReviewer
        preconditions:
          - "status == OPEN"
          - "the current logical clock >= Facility.true_up_deadline_utc (else ERR_TRUE_UP_BEFORE_DEADLINE)"
          - "every QuarterlyReport of every Unit of this facility for compliance_year has status == ACCEPTED (else ERR_REPORTS_NOT_ALL_ACCEPTED)"
        side_effects:
          - "LINK 1: run calculations.allowance_true_up_waterfall — set obligation_tons, debit holdings_current_vintage_tons then holdings_prior_vintage_tons, set shortfall_tons, true_up_utc; create an AllowanceTransaction (origin=TRUE_UP_SURRENDER, transaction_type=SURRENDER, status=SETTLED) whose debited_current_tons / debited_prior_tons record the exact amounts taken; set status = TRUE_UP_LOCKED; increments AllowanceAccount.version by 1"
          - "LINK 2 (caused by shortfall_tons > 0, not by the true-up call itself): create a second AllowanceTransaction (origin=TRUE_UP_PENALTY, transaction_type=PENALTY_DEDUCTION, status=SETTLED) for round_half_up(shortfall_tons * PENALTY_RATIO, 3) tons debited from holdings_next_vintage_tons (which may go negative), refresh penalty_deducted_tons, and increments AllowanceAccount.version by 1"
          - "LINK 3 (caused by this account now carrying shortfall_tons > 0): recompute Facility.compliance_posture per calculations.facility_compliance_posture, which becomes DEFICIT; increments Facility.version by 1"
          - "LINK 4 (caused by Facility.compliance_posture becoming DEFICIT): every Unit of this facility gets dispatch_restricted = true, and every Unit whose dispatch_state == ONLINE moves to RESERVE_SHUTDOWN; increments each affected Unit.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /emissions/allowance-accounts/{id}/true-up when the waterfall leaves shortfall_tons == 0.0"
        actor: RegulatoryReviewer
        preconditions:
          - "status == OPEN"
          - "the current logical clock >= Facility.true_up_deadline_utc"
          - "every QuarterlyReport of every Unit of this facility for compliance_year has status == ACCEPTED"
        side_effects:
          - "run calculations.allowance_true_up_waterfall; create the SETTLED TRUE_UP_SURRENDER AllowanceTransaction; set shortfall_tons = 0.0, true_up_utc, status = CLOSED; increments AllowanceAccount.version by 1"
          - "no penalty transaction is created and Facility.compliance_posture is recomputed (it does not become DEFICIT from this account)"
      - from: TRUE_UP_LOCKED
        to: OPEN
        trigger: "POST /emissions/allowance-transactions/{id}/transition with action=REVERSE applied to this account's SETTLED TRUE_UP_SURRENDER row (system-driven, LINK 2 of the compensation cascade)"
        actor: system
        preconditions:
          - "status == TRUE_UP_LOCKED"
          - "the reversed AllowanceTransaction belongs to this account and has origin == TRUE_UP_SURRENDER (a reversal of any other row of a TRUE_UP_LOCKED account leaves the account TRUE_UP_LOCKED)"
        side_effects:
          - "the true-up is VOIDED, not merely re-derived: set obligation_tons = 0, surrendered_tons = 0.0, penalty_deducted_tons = 0.0, shortfall_tons = 0.0, true_up_utc = null, status = OPEN; increments AllowanceAccount.version by 1"
          - "every SETTLED AllowanceTransaction of this account with origin == TRUE_UP_PENALTY is set to REVERSED and its debited_next_tons credited back to holdings_next_vintage_tons"

  - entity: AllowanceTransaction
    initial_state: PROPOSED
    terminal_states: [REVERSED]
    transitions:
      - from: PROPOSED
        to: RECORDED
        trigger: "POST /emissions/allowance-transactions/{id}/transition with action=RECORD"
        actor: DesignatedRepresentative
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID != the AllowanceTrader X-User-ID that proposed this row is NOT required; only the role separation applies"
        side_effects: ["set status = RECORDED; increments AllowanceTransaction.version by 1"]
      - from: RECORDED
        to: SETTLED
        trigger: "POST /emissions/allowance-transactions/{id}/transition with action=SETTLE"
        actor: DesignatedRepresentative
        preconditions:
          - "status == RECORDED"
          - "AllowanceAccount.status != CLOSED (else ERR_ACCOUNT_TRUE_UP_LOCKED)"
          - "for SURRENDER / TRANSFER_OUT: quantity_tons <= holdings_current_vintage_tons + holdings_prior_vintage_tons (else ERR_INSUFFICIENT_ALLOWANCES)"
        side_effects:
          - "move holdings per calculations.allowance_transaction_settlement and record debited_current_tons / debited_prior_tons / debited_next_tons"
          - "refresh AllowanceAccount.surrendered_tons / penalty_deducted_tons / shortfall_tons; increments AllowanceAccount.version by 1"
          - "for TRANSFER_OUT, credit counterparty_account_id's holdings bucket for vintage_year and increments that account's version by 1"
          - "recompute Facility.compliance_posture; increments Facility.version by 1 when it changes"
          - "set status = SETTLED; increments AllowanceTransaction.version by 1"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /emissions/allowance-transactions/{id}/transition with action=REVERSE (LINK 1 of the compensation cascade)"
        actor: DesignatedRepresentative
        preconditions: ["status == SETTLED", "reason is present"]
        side_effects:
          - "LINK 1: credit back exactly debited_current_tons / debited_prior_tons / debited_next_tons to the same three buckets; set reversal_reason, status = REVERSED; increments AllowanceTransaction.version by 1 and AllowanceAccount.version by 1"
          - "LINK 2 (caused by the holdings credit-back): when the reversed row has origin == TRUE_UP_SURRENDER the account transitions TRUE_UP_LOCKED -> OPEN and its SETTLED TRUE_UP_PENALTY rows are reversed with their debited_next_tons credited back; otherwise only surrendered_tons / penalty_deducted_tons / shortfall_tons are refreshed per calculations.allowance_transaction_settlement"
          - "LINK 3 (caused by the account leaving shortfall): recompute Facility.compliance_posture, which leaves DEFICIT; increments Facility.version by 1"
          - "LINK 4 (caused by the posture leaving DEFICIT): every Unit of the facility gets dispatch_restricted = false; increments each Unit.version by 1"
      - from: RECORDED
        to: REVERSED
        trigger: "POST /emissions/allowance-transactions/{id}/transition with action=REVERSE"
        actor: DesignatedRepresentative
        preconditions: ["status == RECORDED", "reason is present"]
        side_effects:
          - "set reversal_reason, status = REVERSED; no holdings move because nothing was debited; increments AllowanceTransaction.version by 1"

  - entity: ControlOutageWindow
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /emissions/control-outages/{id}/transition with action=ACTIVATE"
        actor: FacilityOperator
        preconditions:
          - "status == PLANNED"
          - "Unit.dispatch_state IN {OFFLINE, RESERVE_SHUTDOWN} (else ERR_UNIT_NOT_ONLINE is NOT used; ERR_INVALID_STATE_TRANSITION is returned)"
        side_effects:
          - "set status = ACTIVE, activated_utc = logical clock; increments version by 1"
          - "set Unit.control_status = OUT_OF_SERVICE; increments Unit.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /emissions/control-outages/{id}/transition with action=CLOSE"
        actor: FacilityOperator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "set status = CLOSED, closed_utc = logical clock; increments version by 1"
          - "set Unit.control_status = AVAILABLE when no other ControlOutageWindow of the same unit_id is ACTIVE, else leave it OUT_OF_SERVICE; increments Unit.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /emissions/control-outages/{id}/transition with action=CANCEL"
        actor: FacilityOperator
        preconditions: ["status == PLANNED", "reason is present"]
        side_effects:
          - "set status = CANCELLED, cancellation_reason = reason; increments version by 1"
          - "releases the interval so a later window may occupy it"

  - entity: FuelSample
    initial_state: PENDING
    terminal_states: []
    note: "No terminal state — an INVALIDATED sample can be re-analysed, so ANALYZED <-> INVALIDATED is a cycle."
    transitions:
      - from: PENDING
        to: ANALYZED
        trigger: "POST /emissions/fuel-samples/{id}/analysis with outcome=ANALYZED"
        actor: QAAnalyst
        preconditions:
          - "status IN {PENDING, INVALIDATED}"
          - "gcv_btu_per_lb, sulfur_content_pct and analysis_method are all present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "set gcv_btu_per_lb, sulfur_content_pct, analysis_method, analyzed_utc = logical clock, invalidation_reason = null, status = ANALYZED"
          - "increments FuelSample.version by 1"
      - from: ANALYZED
        to: INVALIDATED
        trigger: "POST /emissions/fuel-samples/{id}/analysis with outcome=INVALIDATE"
        actor: QAAnalyst
        preconditions: ["status IN {PENDING, ANALYZED}", "invalidation_reason is present"]
        side_effects:
          - "set status = INVALIDATED, invalidation_reason; increments FuelSample.version by 1"
          - "any QuarterlyReport of the same unit_id in status == VALIDATED whose hours reference this sample is NOT auto-reverted; the referential check fires the next time validate runs"
      - from: INVALIDATED
        to: ANALYZED
        trigger: "POST /emissions/fuel-samples/{id}/analysis with outcome=ANALYZED"
        actor: QAAnalyst
        preconditions: ["status == INVALIDATED", "gcv_btu_per_lb, sulfur_content_pct and analysis_method are all present"]
        side_effects:
          - "set the analysis fields, clear invalidation_reason, status = ANALYZED; increments FuelSample.version by 1"
        note: "Re-analysis cycle; OperatingHour rows that referenced the sample keep their stored heat_input_mmbtu (no retroactive recompute)."

  - entity: Unit
    initial_state: OFFLINE
    terminal_states: []
    note: "Dispatch dimension; cyclic among the three positions. control_status is moved only by ControlOutageWindow transitions and by the dispatch PATCH."
    transitions:
      - from: OFFLINE
        to: ONLINE
        trigger: "PATCH /emissions/units/{id}/dispatch with dispatch_state=ONLINE"
        actor: FacilityOperator
        preconditions:
          - "dispatch_restricted == false (else ERR_INVALID_STATE_TRANSITION)"
          - "no ControlOutageWindow of this unit is ACTIVE with outage_type == PLANNED_MAINTENANCE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["set dispatch_state = ONLINE; increments Unit.version by 1"]
      - from: ONLINE
        to: RESERVE_SHUTDOWN
        trigger: "PATCH /emissions/units/{id}/dispatch with dispatch_state=RESERVE_SHUTDOWN, or LINK 4 of the true-up cascade"
        actor: FacilityOperator
        preconditions: ["dispatch_state == ONLINE"]
        side_effects: ["set dispatch_state = RESERVE_SHUTDOWN; increments Unit.version by 1"]
      - from: RESERVE_SHUTDOWN
        to: ONLINE
        trigger: "PATCH /emissions/units/{id}/dispatch with dispatch_state=ONLINE"
        actor: FacilityOperator
        preconditions: ["dispatch_restricted == false"]
        side_effects: ["set dispatch_state = ONLINE; increments Unit.version by 1"]
      - from: ONLINE
        to: OFFLINE
        trigger: "PATCH /emissions/units/{id}/dispatch with dispatch_state=OFFLINE"
        actor: FacilityOperator
        preconditions: ["dispatch_state IN {ONLINE, RESERVE_SHUTDOWN}"]
        side_effects: ["set dispatch_state = OFFLINE; increments Unit.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: allowance-transaction-create-stale-account
    parent_entity: AllowanceAccount
    write_endpoint: "POST /emissions/allowance-transactions"
    occ_field: "expected_allowance_account_version"
    description: |
      Proposing an AllowanceTransaction against an AllowanceAccount whose
      version has advanced since the client last read it is rejected. A second
      proposal is legitimate product behaviour on its own (an account may carry
      many proposals), so nothing in the state machine rejects it; the stale
      version is the only signal that the proposer's view of holdings,
      obligation_tons and shortfall_tons predates another writer's settled
      movement.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: operating-hour-append-stale-report
    parent_entity: QuarterlyReport
    write_endpoint: "POST /emissions/units/{unit_id}/operating-hours"
    occ_field: "expected_quarterly_report_version"
    description: |
      Appending an OperatingHour to a QuarterlyReport whose version has advanced
      since the client last read it is rejected. Appending another hour is
      legitimate on its own, so no state precondition rejects it; the stale
      version captures the case where the report's totals, substituted_hour_count
      or status were already changed by another writer (including by the
      OUT_OF_CONTROL cascade's LINK 3 recompute) and the appending client's
      totals view is therefore stale.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

  - rule_id: daily-calibration-append-stale-system
    parent_entity: MonitoringSystem
    write_endpoint: "POST /emissions/monitoring-systems/{id}/daily-calibrations"
    occ_field: "expected_monitoring_system_version"
    description: |
      Appending a DailyCalibration to a MonitoringSystem whose version has
      advanced since the client last read it is rejected. Recording a further
      calibration is always legitimate, so no state precondition rejects it; the
      stale version captures the case where a prior calibration already moved
      cal_status / consecutive_failed_calibrations (or drove the OUT_OF_CONTROL
      cascade) and the submitting client's view of the QA state predates it.
    error_id: ERR_STALE_MONITORING_SYSTEM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# All literal expected values below were produced by executing the formula as
# written; no value is estimated.
# =============================================================================
calculations:

  - name: daily_calibration_error
    description: |
      Percent-of-span error for the zero and the upstream (span) level of a daily
      calibration, and the PASSED / FAILED / OUT_OF_CONTROL_TRIGGERED verdict.
    trigger: "POST /emissions/monitoring-systems/{id}/daily-calibrations"
    inputs:
      - "MonitoringSystem.span_value"
      - "MonitoringSystem.calibration_error_spec_pct"
      - "MonitoringSystem.consecutive_failed_calibrations (pre-call value)"
      - "zero_reference_value, zero_measured_value, span_reference_value, span_measured_value"
    algorithm: threshold
    formula: |
      zero_error_pct_of_span = round_half_up(
          abs(zero_measured_value - zero_reference_value) / span_value * 100, 2)
      span_error_pct_of_span = round_half_up(
          abs(span_measured_value - span_reference_value) / span_value * 100, 2)
      worst = max(zero_error_pct_of_span, span_error_pct_of_span)

      # Verdict ladder, evaluated top to bottom; first match wins.
      if worst > calibration_error_spec_pct * OUT_OF_CONTROL_MULTIPLIER:
          result = OUT_OF_CONTROL_TRIGGERED            # single grossly failed check
      elif worst > calibration_error_spec_pct:
          if consecutive_failed_calibrations + 1 >= CONSECUTIVE_FAILURE_LIMIT:
              result = OUT_OF_CONTROL_TRIGGERED        # second consecutive failure
          else:
              result = FAILED
      else:
          result = PASSED                              # NOTE: `<=` spec passes
    constants:
      OUT_OF_CONTROL_MULTIPLIER: 2.0
      CONSECUTIVE_FAILURE_LIMIT: 2
    precision: "error percentages to 2 decimal places, round_half_up"
    worked_example: |
      Fixture monitoring system: span_value = 400.0, calibration_error_spec_pct = 2.5,
      span_reference_value = 360.0 on every call.
        span_measured_value = 368.0 -> span_error_pct_of_span = 2.00  -> PASSED
        span_measured_value = 370.0 -> span_error_pct_of_span = 2.50  -> PASSED  (boundary: `>` not `>=`)
        span_measured_value = 374.0 -> span_error_pct_of_span = 3.50  -> FAILED  (1st consecutive)
        span_measured_value = 375.0 -> span_error_pct_of_span = 3.75  -> OUT_OF_CONTROL_TRIGGERED (2nd consecutive)
        span_measured_value = 380.0 -> span_error_pct_of_span = 5.00  -> FAILED  (== 2 x spec, boundary: `>` not `>=`)
        span_measured_value = 385.0 -> span_error_pct_of_span = 6.25  -> OUT_OF_CONTROL_TRIGGERED on the FIRST failure
    notes:
      - "5.00 is exactly 2 x spec and must NOT trip the immediate out-of-control branch; 6.25 must."
      - "consecutive_failed_calibrations resets to 0 on any PASSED result."

  - name: hourly_heat_input_and_mass
    description: |
      Hourly heat input and pollutant mass for one OperatingHour. Two mutually
      exclusive determination methods produce materially different numbers from
      the same operating hour.
    trigger: "POST /emissions/units/{unit_id}/operating-hours, POST .../operating-hours/bulk"
    inputs:
      - "heat_input_method"
      - "CEMS variant: flow_scfh, co2_conc_pct, so2_conc_ppm, nox_rate_lb_mmbtu, op_time_fraction"
      - "APPENDIX_D variant: fuel_flow_lbs, FuelSample.gcv_btu_per_lb, FuelSample.sulfur_content_pct, nox_rate_lb_mmbtu, op_time_fraction"
      - "MonitoringSystem.bias_adjustment_factor for the unit's SO2 system"
    algorithm: aggregation
    formula: |
      # ---- variant CEMS_FLOW_CO2 -------------------------------------------
      heat_input_mmbtu = round_half_up(
          flow_scfh * (co2_conc_pct / 100) / FC_FACTOR * op_time_fraction, 3)
      so2_mass_lbs = round_half_up(
          K_SO2_LB_PER_SCF_PPM * so2_conc_ppm * flow_scfh * op_time_fraction
          * bias_adjustment_factor, 1)
      nox_mass_lbs = round_half_up(nox_rate_lb_mmbtu * heat_input_mmbtu, 1)
      co2_mass_tons = round_half_up(
          K_CO2_LB_PER_SCF * (co2_conc_pct / 100) * flow_scfh * op_time_fraction
          / LBS_PER_TON, 3)

      # ---- variant APPENDIX_D_FUEL ----------------------------------------
      heat_input_mmbtu = round_half_up(
          fuel_flow_lbs * FuelSample.gcv_btu_per_lb / 1_000_000 * op_time_fraction, 3)
      so2_mass_lbs = round_half_up(
          fuel_flow_lbs * SULFUR_TO_SO2_MASS_RATIO
          * (FuelSample.sulfur_content_pct / 100) * op_time_fraction, 1)
      nox_mass_lbs = round_half_up(nox_rate_lb_mmbtu * heat_input_mmbtu, 1)
      co2_mass_tons = round_half_up(
          heat_input_mmbtu * CO2_LB_PER_MMBTU / LBS_PER_TON, 3)
    constants:
      FC_FACTOR: 1800.0            # dscf CO2 per mmBtu
      K_SO2_LB_PER_SCF_PPM: 0.000000166
      K_CO2_LB_PER_SCF: 0.1194
      CO2_LB_PER_MMBTU: 205.3
      SULFUR_TO_SO2_MASS_RATIO: 2.0
      LBS_PER_TON: 2000.0
    precision: "heat_input_mmbtu 3 dp; so2_mass_lbs / nox_mass_lbs 1 dp; co2_mass_tons 3 dp; all round_half_up"
    variants:
      - name: CEMS_FLOW_CO2
        when: "heat_input_method == CEMS_FLOW_CO2 (a CEM/FLOW_MONITOR pair exists for the unit)"
        difference: |
          Heat input is derived from measured stack flow and CO2 concentration via
          the F-factor; SO2 mass is a concentration x flow product and is scaled by
          the monitoring system's bias_adjustment_factor; CO2 tons come straight
          from measured flow. fuel_flow_lbs and fuel_sample_id must be absent.
      - name: APPENDIX_D_FUEL
        when: "heat_input_method == APPENDIX_D_FUEL (an EXCEPTED_APPENDIX_D system exists for the unit)"
        difference: |
          Heat input is fuel flow x gross calorific value from the referenced
          ANALYZED FuelSample; SO2 mass is a stoichiometric sulfur conversion (no
          bias adjustment ever applies); CO2 tons are a fixed emission factor on
          heat input. flow_scfh, co2_conc_pct and so2_conc_ppm must be absent.
    worked_example: |
      One and the same operating hour, priced both ways
      (op_time_fraction = 1.0, nox_rate_lb_mmbtu = 0.180, bias_adjustment_factor = 1.0):

      CEMS_FLOW_CO2  (flow_scfh = 8000000, co2_conc_pct = 12.5, so2_conc_ppm = 220)
        heat_input_mmbtu = 8000000 * 0.125 / 1800 * 1.0             = 555.556
        so2_mass_lbs     = 0.000000166 * 220 * 8000000 * 1.0 * 1.0  = 292.2
        nox_mass_lbs     = 0.180 * 555.556                          = 100.0
        co2_mass_tons    = 0.1194 * 0.125 * 8000000 / 2000          = 59.700

      APPENDIX_D_FUEL (fuel_flow_lbs = 45000, gcv_btu_per_lb = 12500, sulfur_content_pct = 0.85)
        heat_input_mmbtu = 45000 * 12500 / 1000000 * 1.0            = 562.500
        so2_mass_lbs     = 45000 * 2.0 * 0.0085 * 1.0               = 765.0
        nox_mass_lbs     = 0.180 * 562.500                          = 101.3   (101.25 rounds half up)
        co2_mass_tons    = 562.500 * 205.3 / 2000                   = 57.741

      Divergence: heat input differs by 6.944 mmBtu, SO2 mass by 472.8 lbs, NOx by
      1.3 lbs and CO2 by 1.959 tons for the identical hour.

  - name: missing_data_substitution
    description: |
      Fills an UNAVAILABLE hour's SO2 concentration with a substitute value. The
      tier is selected from the unit's monitor data availability at the moment of
      substitution, and the substitute value is drawn from a fixed-size lookback
      of the unit's most recent MEASURED hours.
    trigger: "POST /emissions/units/{unit_id}/missing-data/substitutions"
    inputs:
      - "the target OperatingHour rows (data_quality == UNAVAILABLE), processed in hour_begin_utc ASC order"
      - "monitor_data_availability_pct_at_substitution from calculations.monitor_data_availability_pct"
      - "the LOOKBACK_HOURS most recent OperatingHour rows of the same unit with data_quality == MEASURED and hour_begin_utc < the target hour, ordered hour_begin_utc DESC (tie-break created_at ASC)"
      - "Unit.max_rated_heat_input_mmbtu_hr for the tier-4 fallback"
    algorithm: tiered_pricing
    formula: |
      lookback = the LOOKBACK_HOURS most recent MEASURED so2_conc_ppm values of the
                 unit strictly before the target hour, then sorted ASCENDING
      n        = len(lookback)

      # nearest-rank percentile, 1-indexed:  P_q = lookback[ceil(q * n) - 1]
      if n == 0:
          substitution_method = T4_MAX_POTENTIAL_CONCENTRATION
          value = MAX_POTENTIAL_CONCENTRATION_PPM
      elif mda >= TIER1_MIN_AVAILABILITY_PCT:
          substitution_method = T1_90TH_PERCENTILE
          value = lookback[ceil(0.90 * n) - 1]
      elif mda >= TIER2_MIN_AVAILABILITY_PCT:
          substitution_method = T2_95TH_PERCENTILE
          value = lookback[ceil(0.95 * n) - 1]
      elif mda >= TIER3_MIN_AVAILABILITY_PCT:
          substitution_method = T3_LOOKBACK_MAXIMUM
          value = max(lookback)
      else:
          substitution_method = T4_MAX_POTENTIAL_CONCENTRATION
          value = MAX_POTENTIAL_CONCENTRATION_PPM

      substituted_so2_conc_ppm = value
      data_quality             = SUBSTITUTED
      so2_mass_lbs = round_half_up(
          K_SO2_LB_PER_SCF_PPM * value * flow_scfh * op_time_fraction, 1)
      # NOTE: bias_adjustment_factor is NEVER applied to a substituted hour.
    constants:
      LOOKBACK_HOURS: 20
      TIER1_MIN_AVAILABILITY_PCT: 95.0
      TIER2_MIN_AVAILABILITY_PCT: 90.0
      TIER3_MIN_AVAILABILITY_PCT: 80.0
      MAX_POTENTIAL_CONCENTRATION_PPM: 400
    precision: "substituted_so2_conc_ppm is an integer taken verbatim from the lookback; so2_mass_lbs 1 dp round_half_up"
    evaluation_order: |
      The tier depends on availability and availability depends on which hours are
      substituted, so the order is pinned:
        1. availability is computed EXCLUDING the target hour and every hour with
           hour_begin_utc >= the target hour;
        2. the target hours are processed one at a time in hour_begin_utc ASC order,
           and each hour's own substitution_method is frozen before the next hour's
           availability is recomputed;
        3. a SUBSTITUTED hour never enters a later hour's lookback set (only
           MEASURED hours do), but it DOES enter the availability denominator.
    worked_example: |
      Fixture lookback (20 MEASURED so2_conc_ppm values, ascending):
        100 110 120 130 140 150 160 170 180 190 200 210 220 230 240 250 260 270 280 290
        ceil(0.90 * 20) - 1 = index 17 -> 270
        ceil(0.95 * 20) - 1 = index 18 -> 280
        max                              -> 290
      Substituted hour has flow_scfh = 8000000, op_time_fraction = 1.0:
        mda = 100.0 (18/18) -> T1_90TH_PERCENTILE          -> 270 ppm -> so2_mass_lbs = 358.6
        mda =  94.7 (18/19) -> T2_95TH_PERCENTILE          -> 280 ppm -> so2_mass_lbs = 371.8
        mda =  90.0 (18/20) -> T2_95TH_PERCENTILE          -> 280 ppm -> so2_mass_lbs = 371.8
        mda =  85.0 (17/20) -> T3_LOOKBACK_MAXIMUM         -> 290 ppm -> so2_mass_lbs = 385.1
        mda =  75.0 (15/20) -> T4_MAX_POTENTIAL_CONCENTRATION -> 400 ppm -> so2_mass_lbs = 531.2
    notes:
      - "mda == 90.0 exactly stays in tier 2 (the comparison is `>=`); a `>` implementation drops to T3 and returns 290 ppm / 385.1 lbs."
      - "LOOKBACK_HOURS = 20 is chosen so the 90th percentile (270), the 95th percentile (280) and the maximum (290) are three distinct values; at n = 18 or n = 19 the 95th percentile and the maximum coincide and tiers 2 and 3 become indistinguishable."

  - name: monitor_data_availability_pct
    description: |
      Percent of a unit's reportable hours in one calendar quarter that carry
      directly measured data. Drives both the substitution tier and the
      report-level validation floor.
    trigger: |
      Recomputed on every OperatingHour create, on every substitution, on LINK 2
      of the OUT_OF_CONTROL cascade, and on POST /emissions/quarterly-reports/{id}/validate
    inputs:
      - "OperatingHour rows of the unit whose (year, quarter) of hour_begin_utc matches the scope"
      - "each row's data_quality"
    algorithm: aggregation
    formula: |
      scope        = OperatingHour rows of the unit in the same (year, quarter)
      denominator  = count(scope where op_time_fraction > 0)
      numerator    = count(scope where op_time_fraction > 0 and data_quality == MEASURED)
      if denominator == 0:
          monitor_data_availability_pct = 100.0
      else:
          monitor_data_availability_pct = round_half_up(numerator / denominator * 100, 1)
    constants:
      DATA_AVAILABILITY_FLOOR_PCT: 80.0
    precision: "1 decimal place, round_half_up"
    scoping_rules:
      - "Hours with op_time_fraction == 0.0 are excluded from BOTH numerator and denominator."
      - "SUBSTITUTED and UNAVAILABLE hours are both in the denominator and neither is in the numerator."
      - "When called from missing_data_substitution the scope additionally excludes every hour with hour_begin_utc >= the hour being substituted, which is what breaks the tier/availability circularity."
      - "The lookback set of missing_data_substitution is count-based and may cross quarter boundaries; the availability denominator never does."
    worked_example: |
      18 MEASURED + 0 other -> 18/18  -> 100.0
      18 MEASURED + 1 UNAVAILABLE -> 18/19 -> 94.7
      18 MEASURED + 2 UNAVAILABLE -> 18/20 -> 90.0
      17 MEASURED + 3 UNAVAILABLE -> 17/20 -> 85.0
      15 MEASURED + 5 UNAVAILABLE -> 15/20 -> 75.0  (below DATA_AVAILABILITY_FLOOR_PCT)

  - name: quarterly_report_totals
    description: |
      Rolls the unit's OperatingHour rows for one (year, quarter) into the
      report-level counts and emission totals that are electronically submitted.
    trigger: |
      POST /emissions/quarterly-reports/{id}/validate; also on every OperatingHour
      create/bulk-create and on LINK 3 of the OUT_OF_CONTROL cascade
    inputs: ["all OperatingHour rows whose quarterly_report_id == this report"]
    algorithm: aggregation
    formula: |
      hours = OperatingHour rows of this report, ordered hour_begin_utc ASC
              (tie-break created_at ASC)

      operating_hour_count   = count(hours where op_time_fraction > 0)
      measured_hour_count    = count(hours where data_quality == MEASURED)
      substituted_hour_count = count(hours where data_quality == SUBSTITUTED)

      # MANDATORY ORDER: each hour's already-rounded stored value is summed;
      # the raw unrounded products are NOT re-summed.
      total_heat_input_mmbtu = round_half_up(sum(h.heat_input_mmbtu for h in hours), 3)
      total_so2_lbs          = round_half_up(sum(h.so2_mass_lbs   or 0 for h in hours), 1)
      total_nox_lbs          = round_half_up(sum(h.nox_mass_lbs   or 0 for h in hours), 1)
      total_co2_tons         = round_half_up(sum(h.co2_mass_tons  or 0 for h in hours), 3)
      total_so2_tons         = round_half_up(total_so2_lbs / LBS_PER_TON, 3)

      monitor_data_availability_pct = calculations.monitor_data_availability_pct
                                       scoped to (unit_id, year, quarter)
    constants:
      LBS_PER_TON: 2000.0
    precision: "heat input 3 dp; lbs 1 dp; tons 3 dp; all round_half_up; totals are sums of stored rounded per-hour values"
    worked_example: |
      Three-hour fixture on one unit, all data_quality = MEASURED, op_time_fraction = 1.0:
        H1 CEMS_FLOW_CO2   flow 8000000, co2 12.5, so2 220 ppm, nox 0.180
             -> 555.556 mmBtu / 292.2 lb SO2 / 100.0 lb NOx / 59.700 t CO2
        H2 APPENDIX_D_FUEL fuel 45000 lb, gcv 12500, S 0.85 %, nox 0.180
             -> 562.500 mmBtu / 765.0 lb SO2 / 101.3 lb NOx / 57.741 t CO2
        H3 CEMS_FLOW_CO2   flow 1000000, co2 12.5, so2  80 ppm, nox 0.180
             ->  69.444 mmBtu /  13.3 lb SO2 /  12.5 lb NOx /  7.463 t CO2

        total_heat_input_mmbtu = 555.556 + 562.500 + 69.444 = 1187.500
        total_so2_lbs          = 292.2 + 765.0 + 13.3       = 1070.5
        total_nox_lbs          = 100.0 + 101.3 + 12.5       =  213.8
        total_co2_tons         = 59.700 + 57.741 + 7.463    =  124.904
        total_so2_tons         = 1070.5 / 2000              =    0.535
        operating_hour_count = 3, measured_hour_count = 3, substituted_hour_count = 0
        monitor_data_availability_pct = 100.0
    notes:
      - "Aggregation order is load-bearing: summing the RAW products first (292.16 + 765.0 + 13.28 = 1070.44) and rounding once yields total_so2_lbs = 1070.4, which is 0.1 lb below the required 1070.5. Rounding per hour then summing is the only accepted order."
      - "total_so2_tons is derived from the already-rounded total_so2_lbs, not from a re-sum of per-hour tons."

  - name: rolling_average_limit_check
    description: |
      Evaluates a source-specific permit limit against a rolling window of the
      unit's operating hours and decides IN_COMPLIANCE / EXCEEDED /
      INSUFFICIENT_DATA.
    trigger: "POST /emissions/permit-limits/{id}/evaluate; LINK 4 of the OUT_OF_CONTROL cascade"
    inputs:
      - "PermitLimit.pollutant, limit_value, limit_units, averaging_basis, effective_from_utc"
      - "OperatingHour rows of the unit ending at the evaluation anchor"
    algorithm: chronological
    formula: |
      span_hours = { ROLLING_3_HOUR: 3, ROLLING_30_DAY: 720, ANNUAL: 8760 }[averaging_basis]

      window = OperatingHour rows of the unit with
                 hour_begin_utc <  anchor_utc
             and hour_begin_utc >= anchor_utc - span_hours
             and hour_begin_utc >= effective_from_utc
             and op_time_fraction > 0
             and data_quality IN {MEASURED, SUBSTITUTED}      # UNAVAILABLE excluded
      window_sample_count = len(window)

      if window_sample_count < MIN_WINDOW_SAMPLES[averaging_basis]:
          evaluation_status  = INSUFFICIENT_DATA
          current_rolling_value = null
      else:
          if limit_units == LB_PER_MMBTU:      # rate limit
              current_rolling_value = round_half_up(
                  sum(mass(h) for h in window) / sum(h.heat_input_mmbtu for h in window), 4)
          elif limit_units == LB_PER_HR:       # hourly-average mass limit
              current_rolling_value = round_half_up(
                  sum(mass(h) for h in window) / window_sample_count, 1)
          else:                                # TONS_PER_YEAR, cumulative
              current_rolling_value = round_half_up(
                  sum(mass(h) for h in window) / LBS_PER_TON, 3)

          evaluation_status = EXCEEDED if current_rolling_value > limit_value
                              else IN_COMPLIANCE
      window_evaluated_utc = anchor_utc

      # mass(h) selects so2_mass_lbs / nox_mass_lbs / co2_mass_tons * LBS_PER_TON
      # according to PermitLimit.pollutant.
    constants:
      MIN_WINDOW_SAMPLES: { ROLLING_3_HOUR: 3, ROLLING_30_DAY: 24, ANNUAL: 24 }
      LBS_PER_TON: 2000.0
    precision: "LB_PER_MMBTU rates 4 dp; LB_PER_HR 1 dp; TONS_PER_YEAR 3 dp; all round_half_up"
    worked_example: |
      Against the three-hour fixture of quarterly_report_totals
      (total_nox_lbs = 213.8, total_heat_input_mmbtu = 1187.500),
      a NOX_RATE / LB_PER_MMBTU / ROLLING_3_HOUR limit evaluates to
        current_rolling_value = round_half_up(213.8 / 1187.500, 4) = 0.1800
        limit_value = 0.1800  -> IN_COMPLIANCE   (strict `>`, so equality passes)
        limit_value = 0.1801  -> IN_COMPLIANCE
        limit_value = 0.1799  -> EXCEEDED, exceedance_magnitude = 0.0001
        limit_value = 0.1500  -> EXCEEDED, exceedance_magnitude = 0.0300
      With only two of the three hours inside the window,
        window_sample_count = 2 < 3 -> INSUFFICIENT_DATA, current_rolling_value = null

  - name: excess_event_penalty_debit
    description: |
      Size of the allowance debit attached to an excess emission event once a
      reviewer marks it ENFORCEABLE.
    trigger: "creation of an ExcessEmissionEvent (value stored at DETECTED time)"
    inputs: ["observed_value", "limit_value_snapshot"]
    algorithm: threshold
    formula: |
      exceedance_magnitude = round_half_up(observed_value - limit_value_snapshot, 4)
      exceedance_pct       = round_half_up(
          exceedance_magnitude / limit_value_snapshot * 100, 4)
      penalty_allowance_debit_tons = max(
          MIN_PENALTY_DEBIT_TONS, ceil(exceedance_pct))
    constants:
      MIN_PENALTY_DEBIT_TONS: 1
    precision: "magnitude and percent to 4 dp round_half_up; the debit is an integer produced by ceil (never round)"
    worked_example: |
      observed_value = 0.1800 throughout:
        limit_value_snapshot = 0.1500 -> magnitude 0.0300, pct 20.0000 -> debit 20  (exact integer, ceil is identity)
        limit_value_snapshot = 0.1499 -> magnitude 0.0301, pct 20.0801 -> debit 21  (ceil rounds up 0.0801)
        limit_value_snapshot = 0.1799 -> magnitude 0.0001, pct  0.0556 -> debit  1  (MIN_PENALTY_DEBIT_TONS floor)
        limit_value_snapshot = 0.0900 -> magnitude 0.0900, pct 100.0000 -> debit 100
    notes:
      - "pct 20.0000 -> 20 and pct 20.0801 -> 21 pin ceil against round_half_up, which would give 20 for both."

  - name: relative_accuracy_and_bias
    description: |
      Relative accuracy test audit outcome: relative accuracy percent, the bias
      test, and the resulting bias adjustment factor. Two permitted denominators
      make the same run set pass under one basis and fail under the other.
    trigger: "POST /emissions/rata-tests/{id}/runs (step 1) and POST /emissions/rata-tests/{id}/evaluate (step 2)"
    inputs:
      - "runs[]: an array of {reference_value, cems_value} objects, 9 to 12 entries"
      - "RataTest.ra_basis, RataTest.applicable_standard_value"
      - "MonitoringSystem.parameter"
    algorithm: aggregation
    formula: |
      # ---- step 1, at runs recording ---------------------------------------
      n              = len(runs)
      d[i]           = round_half_up(runs[i].reference_value - runs[i].cems_value, 4)
      reference_mean = round_half_up(sum(r.reference_value for r in runs) / n, 4)
      cems_mean      = round_half_up(sum(r.cems_value      for r in runs) / n, 4)
      mean_difference       = round_half_up(sum(d) / n, 4)
      sd                    = round_half_up(sample_stdev(d), 6)     # n-1 denominator
      confidence_coefficient = round_half_up(T_VALUE[n] * sd / sqrt(n), 4)

      # ---- step 2, at evaluation -------------------------------------------
      denominator = reference_mean                if ra_basis == REFERENCE_MEAN
                    else applicable_standard_value  # ra_basis == APPLICABLE_STANDARD
      relative_accuracy_pct = round_half_up(
          (abs(mean_difference) + abs(confidence_coefficient)) / denominator * 100, 1)

      status = PASSED if relative_accuracy_pct <= RA_PASS_THRESHOLD_PCT[parameter]
               else FAILED

      bias_test_failed = abs(mean_difference) > abs(confidence_coefficient)
      bias_adjustment_factor = round_half_up(1 + mean_difference / cems_mean, 4)
                               if bias_test_failed else 1.0
    constants:
      T_VALUE: { 9: 1.860, 10: 1.833, 11: 1.812, 12: 1.796 }
      RA_PASS_THRESHOLD_PCT: { SO2: 10.0, NOX_RATE: 10.0, CO2: 10.0, FLOW: 10.0 }
      LOW_EMITTER_REFERENCE_MEAN: { SO2: 0.300, NOX_RATE: 0.300, CO2: 5.000, FLOW: 0.300 }
      MIN_RATA_RUNS: 9
      MAX_RATA_RUNS: 12
    precision: "means / mean_difference / confidence_coefficient / bias_adjustment_factor 4 dp; sample stdev 6 dp; relative_accuracy_pct 1 dp; all round_half_up"
    variants:
      - name: REFERENCE_MEAN
        when: "ra_basis == REFERENCE_MEAN (always permitted; the default)"
        difference: "The denominator is the reference method mean of the same run set."
      - name: APPLICABLE_STANDARD
        when: "ra_basis == APPLICABLE_STANDARD, permitted only when applicable_standard_value is present AND reference_mean <= LOW_EMITTER_REFERENCE_MEAN[parameter]"
        difference: |
          The denominator is the source's applicable emission standard instead of
          the measured reference mean. Because the standard is larger than the
          reference mean for a low emitter, this basis always yields a SMALLER
          relative accuracy percent and can convert a FAILED audit into a PASSED
          one on identical runs.
    worked_example: |
      Every run set below has 9 runs, T_VALUE[9] = 1.860,
      reference_value list = [0.262, 0.266, 0.268, 0.270, 0.270, 0.272, 0.274, 0.274, 0.274]
      (reference_mean = 0.2700, applicable_standard_value = 0.500, NOX_RATE).

      SET A (boundary pass) cems_value = [0.248, 0.240, 0.234, 0.252, 0.256, 0.252, 0.240, 0.260, 0.251]
        cems_mean = 0.2481, mean_difference = 0.0219, sample stdev = 0.008038,
        confidence_coefficient = 0.0050
        ra_basis = REFERENCE_MEAN      -> relative_accuracy_pct = 10.0 -> PASSED  (`<=` boundary)
        ra_basis = APPLICABLE_STANDARD -> relative_accuracy_pct =  5.4 -> PASSED
        bias_test_failed = true (0.0219 > 0.0050), bias_adjustment_factor = 1.0883

      SET B (variant divergence) cems_value = [0.246, 0.236, 0.244, 0.258, 0.238, 0.248, 0.254, 0.246, 0.240]
        cems_mean = 0.2456, mean_difference = 0.0244, sample stdev = 0.007401,
        confidence_coefficient = 0.0046
        ra_basis = REFERENCE_MEAN      -> relative_accuracy_pct = 10.7 -> FAILED
        ra_basis = APPLICABLE_STANDARD -> relative_accuracy_pct =  5.8 -> PASSED
        bias_test_failed = true, bias_adjustment_factor = 1.0993

      SET C (bias test passes) cems_value = [0.292, 0.242, 0.256, 0.246, 0.282, 0.242, 0.286, 0.274, 0.250]
        cems_mean = 0.2633, mean_difference = 0.0067, sample stdev = 0.021095,
        confidence_coefficient = 0.0131
        ra_basis = REFERENCE_MEAN -> relative_accuracy_pct = 7.3 -> PASSED
        bias_test_failed = false (0.0067 <= 0.0131), bias_adjustment_factor = 1.0

  - name: allowance_transaction_settlement
    description: |
      Moves allowance tonnage between vintage buckets when a transaction settles,
      and records the exact per-bucket amounts so a later reversal restores the
      account without drift.
    trigger: "POST /emissions/allowance-transactions/{id}/transition with action=SETTLE"
    inputs:
      - "AllowanceTransaction.transaction_type, quantity_tons, vintage_year"
      - "AllowanceAccount.compliance_year and the three holdings buckets"
    algorithm: waterfall_allocation
    formula: |
      bucket(vintage_year) = holdings_prior_vintage_tons   if vintage_year <  compliance_year
                             holdings_current_vintage_tons if vintage_year == compliance_year
                             holdings_next_vintage_tons    if vintage_year >  compliance_year

      if transaction_type IN {PURCHASE, TRANSFER_IN}:
          bucket(vintage_year) += quantity_tons
          debited_current_tons = debited_prior_tons = debited_next_tons = 0.0

      elif transaction_type IN {SURRENDER, TRANSFER_OUT}:
          # oldest vintage first, then current; the next-year bucket is never
          # touched by a client-initiated debit
          remaining            = quantity_tons
          debited_prior_tons   = min(remaining, holdings_prior_vintage_tons)
          remaining           -= debited_prior_tons
          debited_current_tons = min(remaining, holdings_current_vintage_tons)
          remaining           -= debited_current_tons
          if remaining > 0: reject with ERR_INSUFFICIENT_ALLOWANCES
          debited_next_tons    = 0.0
          holdings_prior_vintage_tons   -= debited_prior_tons
          holdings_current_vintage_tons -= debited_current_tons
          if transaction_type == TRANSFER_OUT:
              counterparty.bucket(vintage_year) += quantity_tons

      elif transaction_type == PENALTY_DEDUCTION:
          debited_next_tons          = quantity_tons
          holdings_next_vintage_tons -= quantity_tons   # MAY GO NEGATIVE
          debited_current_tons = debited_prior_tons = 0.0

      surrendered_tons      = sum(quantity_tons of this account's SETTLED SURRENDER rows)
      penalty_deducted_tons = sum(quantity_tons of this account's SETTLED PENALTY_DEDUCTION rows)
      shortfall_tons        = max(0.0, round_half_up(
          obligation_tons - surrendered_tons, 3))
    precision: "all tonnage to 3 decimal places, round_half_up"
    conserved_invariant: |
      For every AllowanceAccount, at every observable moment:
        holdings_current_vintage_tons + holdings_prior_vintage_tons
          + holdings_next_vintage_tons
          + sum(quantity_tons of SETTLED SURRENDER rows)
          + sum(quantity_tons of SETTLED PENALTY_DEDUCTION rows)
          - sum(quantity_tons of SETTLED PURCHASE and TRANSFER_IN rows)
          + sum(quantity_tons of SETTLED TRANSFER_OUT rows)
        == the account's opening endowment
      Settling and then reversing any transaction restores every bucket to its
      pre-settlement value exactly, because the reversal credits back the stored
      debited_current_tons / debited_prior_tons / debited_next_tons rather than
      re-deriving the split from the current holdings.

  - name: allowance_true_up_waterfall
    description: |
      End-of-compliance-period true-up: converts accepted quarterly emissions
      into an integral allowance obligation, drains holdings oldest-vintage-first,
      and converts any residual into a punitive deduction against the next
      vintage year.
    trigger: "POST /emissions/allowance-accounts/{id}/true-up"
    inputs:
      - "every QuarterlyReport with status == ACCEPTED for a Unit of this facility whose year == compliance_year"
      - "every ExcessEmissionEvent with status == ENFORCEABLE on those units whose year(detected_utc) == compliance_year"
      - "the account's three holdings buckets"
    algorithm: waterfall_allocation
    formula: |
      emitted_tons = round_half_up(
          sum(r.total_so2_tons for r in accepted_reports), 3)
      event_debit_tons = sum(e.penalty_allowance_debit_tons
                             for e in enforceable_events)
      obligation_tons = ceil(emitted_tons) + event_debit_tons     # integral tons

      # bucket 1: prior vintage (banked allowances are spent first)
      take_prior   = min(obligation_tons, holdings_prior_vintage_tons)
      remaining    = obligation_tons - take_prior
      # bucket 2: current vintage
      take_current = min(remaining, holdings_current_vintage_tons)
      remaining   -= take_current

      surrendered_tons = round_half_up(take_prior + take_current, 3)
      shortfall_tons   = round_half_up(remaining, 3)

      holdings_prior_vintage_tons   -= take_prior
      holdings_current_vintage_tons -= take_current
      # SETTLED SURRENDER transaction records take_prior / take_current verbatim

      if shortfall_tons > 0:
          penalty_deducted_tons       = round_half_up(shortfall_tons * PENALTY_RATIO, 3)
          holdings_next_vintage_tons -= penalty_deducted_tons     # MAY GO NEGATIVE
          status = TRUE_UP_LOCKED
      else:
          penalty_deducted_tons = 0.0
          status = CLOSED
    constants:
      PENALTY_RATIO: 2.0
    precision: "obligation_tons is an integer (ceil of emitted tons, plus integral event debits); tonnage 3 dp round_half_up"
    worked_example: |
      Twelve identical MEASURED CEMS hours on one unit
      (flow_scfh = 20000000, co2_conc_pct = 12.5, so2_conc_ppm = 1500,
       nox_rate_lb_mmbtu = 0.150, op_time_fraction = 1.0, bias_adjustment_factor = 1.0):
        per hour  -> 1388.889 mmBtu / 4980.0 lb SO2 / 208.3 lb NOx / 149.250 t CO2
        report    -> total_heat_input_mmbtu 16666.668, total_so2_lbs 59760.0,
                     total_nox_lbs 2499.6, total_co2_tons 1791.000,
                     total_so2_tons 29.880
      Account opening endowment: prior 7, current 18, next 15 (total 40), no
      ENFORCEABLE events:
        obligation_tons = ceil(29.880) + 0        = 30
        take_prior      = min(30, 7)              =  7   -> prior   7 -> 0
        take_current    = min(23, 18)             = 18   -> current 18 -> 0
        surrendered_tons                          = 25.000
        shortfall_tons  = 30 - 25                 =  5.000  -> status TRUE_UP_LOCKED
        penalty_deducted_tons = 5.000 * 2.0       = 10.000 -> next 15 -> 5
      Conserved check: 0 + 0 + 5 + 25 + 10 = 40, equal to the opening endowment.
      With the same emissions but opening buckets prior 12 / current 20 / next 15,
      obligation 30 is fully covered (12 + 18), shortfall_tons = 0.000, no penalty
      transaction is created and the account goes straight to CLOSED.
    notes:
      - "ceil(29.880) = 30 pins ceil against round_half_up, which would also give 30; use total_so2_tons = 29.100 to separate them (ceil 30 vs round 29)."
      - "The next-vintage bucket is the ONLY bucket allowed to go negative, and only via PENALTY_DEDUCTION; it is what keeps the conserved-quantity invariant closed instead of minting allowances."

  - name: facility_compliance_posture
    description: |
      Facility-level rollup of allowance adequacy, derived from every allowance
      account plus the emissions already submitted but not yet trued up.
    trigger: |
      Recomputed on allowance transaction settlement/reversal, on true-up, on
      quarterly report submit / certify / disposition, and on excess emission
      event ENFORCE
    inputs:
      - "every AllowanceAccount of the facility"
      - "every QuarterlyReport of the facility's units with status IN {SUBMITTED, CERTIFIED, ACCEPTED}"
    algorithm: forward_looking
    formula: |
      if any account has shortfall_tons > 0:
          compliance_posture = DEFICIT
      else:
          for each account:
              projected = ceil(round_half_up(sum(
                  r.total_so2_tons for r in reports_of_this_facility
                  if r.status IN {SUBMITTED, CERTIFIED, ACCEPTED}
                  and r.year == account.compliance_year), 3))
              covered   = account.holdings_current_vintage_tons
                        + account.holdings_prior_vintage_tons
              if covered < projected:
                  compliance_posture = WATCH   # first matching account wins
                  break
          else:
              compliance_posture = COMPLIANT
    precision: "projected obligation is an integer (ceil); comparison is strict `<`"
    worked_example: |
      Using the twelve-hour report above (total_so2_tons 29.880, projected 30):
        holdings prior 12 + current 20 = 32 >= 30 -> COMPLIANT
        holdings prior  7 + current 18 = 25 <  30 -> WATCH
        holdings prior 15 + current 15 = 30 == 30 -> COMPLIANT (strict `<`, so equality is covered)
        any account with shortfall_tons = 5.000    -> DEFICIT, regardless of holdings
    notes:
      - "A DRAFT, VALIDATED or REJECTED report contributes nothing to `projected`; a report that is rejected after certification therefore lowers `projected` and can move the posture from WATCH back to COMPLIANT."
      - "covered == projected must stay COMPLIANT; a `<=` implementation reports WATCH."

# =============================================================================
# 1.4 Validation Rules Table — strictly priority-ordered.
# The implementation MUST evaluate rules in ascending `priority` and return the
# FIRST violated rule's error. Bands: auth 1-99, existence/shape 90-199,
# state 200-299, business_safety 300-399, business_fiscal 400-499.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID request header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Every endpoint including GETs requires an identity header; absent or blank is rejected before anything else is read."

  - priority: 2
    category: auth
    check: "X-User-Role request header is present and equals one of the six declared role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "An unrecognised role string is an authentication failure (401), not an authorization failure (403)."

  - priority: 3
    category: auth
    check: "X-User-Role is listed in the endpoint's `roles`"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Runs before ANY existence lookup, so an unauthorized caller cannot probe which ids exist."

  - priority: 10
    category: auth
    check: "when X-User-Role == FacilityOperator, the facility reached through the request path or body has operator_org == X-User-ID"
    error_id: ERR_FACILITY_SCOPE_VIOLATION
    http_status: 403
    applies_to:
      - "POST /emissions/facilities/{facility_id}/units"
      - "POST /emissions/units/{unit_id}/monitoring-systems"
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/daily-calibrations"
      - "POST /emissions/units/{unit_id}/operating-hours"
      - "POST /emissions/units/{unit_id}/operating-hours/bulk"
      - "POST /emissions/units/{unit_id}/missing-data/substitutions"
      - "POST /emissions/units/{unit_id}/fuel-samples"
      - "POST /emissions/units/{unit_id}/control-outages"
      - "POST /emissions/control-outages/{control_outage_id}/transition"
      - "PATCH /emissions/units/{unit_id}/dispatch"
    description: "FacilityOperator is the only entity_backed role; it may only touch units under the facility whose operator_org matches its own id. RegulatoryReviewer and the other opaque roles are unscoped."

  - priority: 40
    category: auth
    check: "the certifying X-User-ID differs from QuarterlyReport.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: ["POST /emissions/quarterly-reports/{quarterly_report_id}/certifications"]
    description: "Electronic certification must be signed by a designated representative other than the preparer who submitted the file. Evaluated before the OCC version check so a self-certification attempt fails on duties even when the client also holds a stale version."

  - priority: 90
    category: existence
    check: "request body / query shape is valid: no unknown enum values, no wrong JSON types, every required field present. This rule is deliberately BLIND to determination-method field families: a syntactically well-formed operating hour that mixes CEMS and Appendix D measurement fields passes priority 90 and is rejected later by ERR_METHOD_FIELD_MISMATCH at priority 335"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: |
      PINNED ORDER: shape validation precedes every 404. A POST that carries an
      unknown enum value AND references a non-existent parent id returns
      ERR_INVALID_REQUEST (400), not the 404.

  - priority: 95
    category: existence
    check: "limit is an integer in [1, 100] and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
    description: "Defaults limit=10 / offset=0 apply when absent; explicit out-of-range values are rejected."

  - priority: 100
    category: existence
    check: "every id in the request PATH resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
    description: "Path ids are resolved outermost-first: a nested path such as POST /emissions/facilities/{facility_id}/units returns ERR_FACILITY_NOT_FOUND before considering the body."

  - priority: 110
    category: existence
    check: "every foreign key supplied in the request BODY resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to:
      - "POST /emissions/allowance-transactions (allowance_account_id, counterparty_account_id)"
      - "POST /emissions/units/{unit_id}/operating-hours (fuel_sample_id)"
      - "POST /emissions/units/{unit_id}/operating-hours/bulk (fuel_sample_id)"
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/rata-tests (retest_of_rata_test_id)"
    description: "Body FKs are checked after path ids, in the field order declared in the endpoint's `input`."

  - priority: 120
    category: existence
    check: "the referenced child belongs to the parent named in the path"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to:
      - "POST /emissions/units/{unit_id}/operating-hours (fuel_sample_id must belong to unit_id)"
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/rata-tests (retest_of_rata_test_id must belong to monitoring_system_id)"
      - "POST /emissions/certifications/{certification_id}/revoke"
    description: "A cross-parent reference is reported as NOT_FOUND rather than as a scope violation, so the caller learns nothing about other parents' data."

  - priority: 200
    category: state
    check: "expected_<parent>_version in the body equals the parent's current version"
    error_id: "ERR_STALE_MONITORING_SYSTEM_VERSION | ERR_STALE_REPORT_VERSION | ERR_STALE_ACCOUNT_VERSION"
    http_status: 412
    applies_to:
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/daily-calibrations"
      - "POST /emissions/units/{unit_id}/operating-hours"
      - "POST /emissions/units/{unit_id}/operating-hours/bulk"
      - "POST /emissions/allowance-transactions"
      - "POST /emissions/quarterly-reports/{quarterly_report_id}/certifications"
    description: |
      PINNED ORDER: the OCC check is the FIRST rule of the state band, so it
      precedes every other state, safety and fiscal rule. A stale
      expected_allowance_account_version on an over-drawing SURRENDER returns 412,
      never ERR_INSUFFICIENT_ALLOWANCES. It is nonetheless preceded by
      ERR_SEGREGATION_OF_DUTIES on the certification endpoint.

  - priority: 210
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action / transition endpoints"
    description: "Also covers terminal-state lockdown, repeat invocation of a one-shot action, setting a dispatch_restricted unit ONLINE, activating an outage on an ONLINE unit, and rescheduling a RataTest that is not FAILED."

  - priority: 215
    category: state
    check: "no other QuarterlyReport exists for the same (unit_id, year, quarter)"
    error_id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    applies_to: ["POST /emissions/units/{unit_id}/quarterly-reports"]
    description: "One electronic report per unit per calendar quarter; a REJECTED report is reopened, never re-created."

  - priority: 218
    category: state
    check: "no other MonitoringSystem exists for the same (unit_id, parameter) with qa_status != RETIRED"
    error_id: ERR_DUPLICATE_MONITORING_SYSTEM
    http_status: 409
    applies_to: ["POST /emissions/units/{unit_id}/monitoring-systems"]
    description: "Retiring the incumbent releases the slot; a RETIRED row does not block the replacement."

  - priority: 220
    category: state
    check: "orispl_code is not already used by another Facility"
    error_id: ERR_DUPLICATE_ORISPL_CODE
    http_status: 409
    applies_to: ["POST /emissions/facilities"]
    description: "The ORIS plant code is the global identifier of the generating station."

  - priority: 225
    category: state
    check: "no other OperatingHour exists for the same (unit_id, hour_begin_utc)"
    error_id: ERR_DUPLICATE_OPERATING_HOUR
    http_status: 409
    applies_to:
      - "POST /emissions/units/{unit_id}/operating-hours"
      - "POST /emissions/units/{unit_id}/operating-hours/bulk"
    description: "hour_begin_utc must be exactly on the hour; the pair is unique per unit across all quarters."

  - priority: 230
    category: state
    check: "the AllowanceAccount is not TRUE_UP_LOCKED or CLOSED"
    error_id: ERR_ACCOUNT_TRUE_UP_LOCKED
    http_status: 409
    applies_to:
      - "POST /emissions/allowance-transactions"
      - "POST /emissions/allowance-transactions/{allowance_transaction_id}/transition (action=SETTLE)"
    description: |
      Precedes ERR_INSUFFICIENT_ALLOWANCES: a locked account rejects an
      over-drawing SURRENDER with the lock error, not with the fiscal error.
      REVERSE is exempt, because reversing is exactly how a locked account is
      released.

  - priority: 235
    category: state
    check: "Unit.dispatch_state == ONLINE for the RATA test's unit"
    error_id: ERR_UNIT_NOT_ONLINE
    http_status: 409
    applies_to: ["POST /emissions/rata-tests/{rata_test_id}/runs"]
    description: "A relative accuracy test audit can only be run against a generating unit that is actually dispatching."

  - priority: 240
    category: state
    check: "no MonitoringSystem of the report's unit has qa_status == OUT_OF_CONTROL"
    error_id: ERR_MONITOR_OUT_OF_CONTROL
    http_status: 409
    applies_to: ["POST /emissions/quarterly-reports/{quarterly_report_id}/validate"]
    description: "Precedes the weaker ERR_MONITOR_NOT_CERTIFIED, so an out-of-control system reports the specific condition."

  - priority: 245
    category: state
    check: "every MonitoringSystem of the report's unit has qa_status IN {CERTIFIED, CONDITIONALLY_VALID}"
    error_id: ERR_MONITOR_NOT_CERTIFIED
    http_status: 409
    applies_to:
      - "POST /emissions/quarterly-reports/{quarterly_report_id}/validate"
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/qa-status (action=CERTIFY with a FAILED RataTest outstanding)"
    description: "RECERTIFICATION_PENDING and RETIRED systems both block validation."

  - priority: 250
    category: state
    check: "MonitoringSystem.cal_status != CAL_FAILED (and == CAL_CURRENT when restoring from OUT_OF_CONTROL)"
    error_id: ERR_CALIBRATION_NOT_CURRENT
    http_status: 409
    applies_to: ["POST /emissions/monitoring-systems/{monitoring_system_id}/qa-status (action=CERTIFY)"]
    description: "The daily calibration dimension gates the QA dimension only in this direction; the reverse is never true."

  - priority: 255
    category: state
    check: "the referenced FuelSample has status == ANALYZED"
    error_id: ERR_FUEL_SAMPLE_NOT_ANALYZED
    http_status: 409
    applies_to:
      - "POST /emissions/units/{unit_id}/operating-hours (heat_input_method == APPENDIX_D_FUEL)"
      - "POST /emissions/units/{unit_id}/operating-hours/bulk"
    description: "Heat input by fuel sampling needs gcv_btu_per_lb and sulfur_content_pct, which only exist once the sample is analysed."

  - priority: 260
    category: state
    check: "no OperatingHour of the report references a FuelSample with status == INVALIDATED"
    error_id: ERR_FUEL_ANALYSIS_INVALIDATED
    http_status: 409
    applies_to: ["POST /emissions/quarterly-reports/{quarterly_report_id}/validate"]
    description: "Invalidating a sample after the hours were posted does not retroactively touch the hours; the report simply refuses to validate until the sample is re-analysed."

  - priority: 265
    category: state
    check: "the current logical clock is at or after Facility.true_up_deadline_utc"
    error_id: ERR_TRUE_UP_BEFORE_DEADLINE
    http_status: 409
    applies_to: ["POST /emissions/allowance-accounts/{allowance_account_id}/true-up"]
    description: "Precedes the accepted-reports check, so an early true-up on an incomplete year reports the deadline error."

  - priority: 270
    category: state
    check: "every QuarterlyReport of every Unit of the facility for compliance_year has status == ACCEPTED"
    error_id: ERR_REPORTS_NOT_ALL_ACCEPTED
    http_status: 409
    applies_to: ["POST /emissions/allowance-accounts/{allowance_account_id}/true-up"]
    description: "A facility with a single DRAFT or REJECTED report for the year cannot be trued up."

  - priority: 275
    category: state
    check: "ra_basis == APPLICABLE_STANDARD requires applicable_standard_value present AND reference_mean <= LOW_EMITTER_REFERENCE_MEAN[parameter]"
    error_id: ERR_RA_BASIS_NOT_PERMITTED
    http_status: 409
    applies_to: ["POST /emissions/rata-tests/{rata_test_id}/evaluate"]
    description: "Only a low-emitting source may substitute the applicable standard for the reference mean in the relative accuracy denominator."

  - priority: 280
    category: state
    check: "the RataTest named by retest_of_rata_test_id has status == FAILED and is not already referenced by another RataTest"
    error_id: ERR_RETEST_ALREADY_EXISTS
    http_status: 409
    applies_to: ["POST /emissions/monitoring-systems/{monitoring_system_id}/rata-tests"]
    description: "At most one replacement audit per failed audit; a second attempt to chain off the same failure is rejected."

  - priority: 300
    category: business_safety
    check: "9 <= length(runs) <= 12 and every run carries a positive reference_value and cems_value"
    error_id: ERR_INSUFFICIENT_RATA_RUNS
    http_status: 422
    applies_to: ["POST /emissions/rata-tests/{rata_test_id}/runs"]
    description: "8 runs is rejected; 9 is accepted; 12 is accepted; 13 is rejected. The t-value table is only defined for 9..12."

  - priority: 305
    category: business_safety
    check: "window_start_utc < window_end_utc and start_utc < end_utc"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to:
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/rata-tests"
      - "POST /emissions/rata-tests/{rata_test_id}/reschedule"
      - "POST /emissions/units/{unit_id}/control-outages"
      - "POST /emissions/units/{unit_id}/missing-data/substitutions"
    description: "Zero-length and inverted intervals are rejected; intervals are half-open [start, end)."

  - priority: 310
    category: business_safety
    check: "the RATA window does not overlap another RataTest of the same monitoring_system_id with status IN {SCHEDULED, RUNS_RECORDED}"
    error_id: ERR_RATA_WINDOW_OVERLAP
    http_status: 409
    applies_to:
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/rata-tests"
      - "POST /emissions/rata-tests/{rata_test_id}/reschedule"
    description: "Half-open comparison: an abutting window whose start_utc equals the incumbent's end_utc is ACCEPTED; one second earlier is rejected. PASSED, FAILED and VOIDED audits never block."

  - priority: 315
    category: business_safety
    check: "window_start_utc >= the current logical clock"
    error_id: ERR_RATA_WINDOW_IN_PAST
    http_status: 422
    applies_to:
      - "POST /emissions/monitoring-systems/{monitoring_system_id}/rata-tests"
      - "POST /emissions/rata-tests/{rata_test_id}/reschedule"
    description: "Equality with the clock is accepted; strictly earlier is rejected. Evaluated AFTER the overlap check, so a window that is both in the past and overlapping reports the overlap."

  - priority: 320
    category: business_safety
    check: "the outage interval does not overlap another ControlOutageWindow of the same (unit_id, control_device) with status IN {PLANNED, ACTIVE}"
    error_id: ERR_CONTROL_OUTAGE_OVERLAP
    http_status: 409
    applies_to: ["POST /emissions/units/{unit_id}/control-outages"]
    description: "Scoped per control device: an FGD outage and an SCR outage on the same unit may overlap freely. CANCELLED and CLOSED windows never block."

  - priority: 325
    category: business_safety
    check: "the count of ACTIVE ControlOutageWindow rows across all units of the facility would not exceed Facility.max_concurrent_control_outages"
    error_id: ERR_CONCURRENT_OUTAGE_LIMIT
    http_status: 409
    applies_to: ["POST /emissions/control-outages/{control_outage_id}/transition (action=ACTIVATE)"]
    description: |
      Facility-wide aggregate ceiling on control equipment unavailability, checked
      at activation rather than at planning, so planning three windows is allowed
      and activating the third is not. Evaluated AFTER the per-device overlap rule.

  - priority: 330
    category: business_safety
    check: "hour_begin_utc is exactly on the hour AND falls inside the (year, quarter) of the report resolved for the unit"
    error_id: ERR_HOUR_OUTSIDE_REPORT_PERIOD
    http_status: 422
    applies_to:
      - "POST /emissions/units/{unit_id}/operating-hours"
      - "POST /emissions/units/{unit_id}/operating-hours/bulk"
    description: |
      The hour's own timestamp selects the report; if no DRAFT/VALIDATED report
      exists for that (unit, year, quarter) the hour is rejected. The hour is NOT
      required to be at or before the logical clock.

  - priority: 335
    category: business_safety
    check: "the supplied measurement fields match heat_input_method exactly"
    error_id: ERR_METHOD_FIELD_MISMATCH
    http_status: 422
    applies_to:
      - "POST /emissions/units/{unit_id}/operating-hours"
      - "POST /emissions/units/{unit_id}/operating-hours/bulk"
    description: |
      CEMS_FLOW_CO2 requires flow_scfh, co2_conc_pct, so2_conc_ppm and forbids
      fuel_flow_lbs / fuel_sample_id. APPENDIX_D_FUEL requires fuel_flow_lbs and
      fuel_sample_id and forbids flow_scfh / co2_conc_pct / so2_conc_ppm. It also
      requires the unit to own a MonitoringSystem of the matching system_type.

  - priority: 340
    category: business_safety
    check: "numeric inputs are inside their declared ranges"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all POST / PATCH endpoints with numeric input"
    description: |
      op_time_fraction in [0.0, 1.0]; co2_conc_pct in (0.0, 20.0];
      so2_conc_ppm in [0, 2000]; nox_rate_lb_mmbtu in [0.0, 2.0];
      flow_scfh > 0; gross_load_mw >= 0; sulfur_content_pct in [0.0, 10.0];
      gcv_btu_per_lb in [1000, 20000]; span_value > 0;
      calibration_error_spec_pct in (0.0, 20.0]; limit_value > 0;
      max_concurrent_control_outages in [0, 10]; quarter in [1, 4].

  - priority: 345
    category: business_safety
    check: "monitor_data_availability_pct for the report's (unit, year, quarter) is >= DATA_AVAILABILITY_FLOOR_PCT"
    error_id: ERR_DATA_AVAILABILITY_BELOW_FLOOR
    http_status: 422
    applies_to: ["POST /emissions/quarterly-reports/{quarterly_report_id}/validate"]
    description: "80.0 exactly passes; 79.9 fails. Evaluated after the monitor-status checks, so an out-of-control monitor reports ERR_MONITOR_OUT_OF_CONTROL even though availability has already collapsed."

  - priority: 350
    category: business_safety
    check: "at least one OperatingHour with data_quality == UNAVAILABLE exists in the requested [from_hour_utc, to_hour_utc) range"
    error_id: ERR_NO_SUBSTITUTABLE_HOURS
    http_status: 422
    applies_to: ["POST /emissions/units/{unit_id}/missing-data/substitutions"]
    description: "Re-running the substitution over an already-substituted range is rejected rather than silently re-substituting, which would otherwise let the tier drift as availability changes."

  - priority: 355
    category: business_safety
    check: "1 <= length(hours) <= BULK_MAX_HOURS"
    error_id: ERR_BULK_SIZE_INVALID
    http_status: 422
    applies_to: ["POST /emissions/units/{unit_id}/operating-hours/bulk"]
    description: "BULK_MAX_HOURS = 200. The bulk endpoint is all-or-nothing: any per-item violation rejects the whole array and persists nothing."

  - priority: 400
    category: business_fiscal
    check: "quantity_tons > 0"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: ["POST /emissions/allowance-transactions"]
    description: "Zero and negative tonnage are rejected at proposal time; direction is carried by transaction_type, never by the sign."

  - priority: 405
    category: business_fiscal
    check: "transaction_type != PENALTY_DEDUCTION"
    error_id: ERR_PENALTY_TRANSACTION_NOT_CLIENT_CREATABLE
    http_status: 422
    applies_to: ["POST /emissions/allowance-transactions"]
    description: "Penalty deductions are created only by the true-up cascade, because only the cascade may drive holdings_next_vintage_tons negative."

  - priority: 410
    category: business_fiscal
    check: "TRANSFER_OUT and TRANSFER_IN carry a counterparty_account_id that differs from allowance_account_id and shares the same program"
    error_id: ERR_INVALID_COUNTERPARTY
    http_status: 422
    applies_to: ["POST /emissions/allowance-transactions"]
    description: "Also rejects a counterparty_account_id supplied on PURCHASE, SURRENDER or PENALTY_DEDUCTION. Allowances never cross program boundaries."

  - priority: 415
    category: business_fiscal
    check: "vintage_year is in [compliance_year - 1, compliance_year + 1]"
    error_id: ERR_VINTAGE_YEAR_INVALID
    http_status: 422
    applies_to: ["POST /emissions/allowance-transactions"]
    description: "Both endpoints of the range are accepted; compliance_year - 2 and compliance_year + 2 are rejected. This is what makes the three holdings buckets exhaustive."

  - priority: 420
    category: business_fiscal
    check: "no other AllowanceAccount exists for the same (facility_id, program, compliance_year)"
    error_id: ERR_DUPLICATE_ALLOWANCE_ACCOUNT
    http_status: 409
    applies_to: ["POST /emissions/facilities/{facility_id}/allowance-accounts"]
    description: "One account per program per compliance year; the true-up is defined per account."

  - priority: 425
    category: business_fiscal
    check: "no other PermitLimit exists for the same (unit_id, pollutant, averaging_basis, effective_from_utc)"
    error_id: ERR_DUPLICATE_PERMIT_LIMIT
    http_status: 409
    applies_to: ["POST /emissions/units/{unit_id}/permit-limits"]
    description: "A unit may carry several limits on the same pollutant provided the averaging basis or the effective date differs."

  - priority: 430
    category: business_fiscal
    check: "for SURRENDER and TRANSFER_OUT, quantity_tons <= holdings_prior_vintage_tons + holdings_current_vintage_tons"
    error_id: ERR_INSUFFICIENT_ALLOWANCES
    http_status: 422
    applies_to: ["POST /emissions/allowance-transactions/{allowance_transaction_id}/transition (action=SETTLE)"]
    description: |
      Checked at SETTLE, not at proposal, because holdings may move between the
      two. Equality is accepted (the account is drained to exactly zero). Loses to
      ERR_ACCOUNT_TRUE_UP_LOCKED (priority 230) and to the OCC check (priority 200).

  - priority: 440
    category: business_fiscal
    check: "a reason / narrative / revocation_reason string is present where the transition requires one"
    error_id: ERR_REASON_REQUIRED
    http_status: 422
    applies_to:
      - "POST /emissions/quarterly-reports/{quarterly_report_id}/disposition (decision=REJECT)"
      - "POST /emissions/excess-emission-events/{excess_emission_event_id}/disposition (decision IN {EXCUSE, RETURN})"
      - "POST /emissions/certifications/{certification_id}/revoke"
      - "POST /emissions/allowance-transactions/{allowance_transaction_id}/transition (action=REVERSE)"
      - "POST /emissions/control-outages/{control_outage_id}/transition (action=CANCEL)"
      - "POST /emissions/fuel-samples/{fuel_sample_id}/analysis (outcome=INVALIDATE)"
    description: "Evaluated last, so a reason-less REJECT on a report that is not CERTIFIED reports ERR_INVALID_STATE_TRANSITION (priority 210) instead."

# =============================================================================
# 1.5 API Endpoint Table
# Every path placeholder is spelled `{id}`. All list endpoints accept
# `limit?` / `offset?` and return the paginated envelope described above.
# =============================================================================
endpoints:

  # ---- test clock -----------------------------------------------------------
  - method: POST
    path: /emissions/_clock/set_current_utc
    description: |
      Sets the logical current UTC instant used by every timestamp default and
      every temporal comparison. Default value before any call:
      2026-08-01T00:00:00Z.
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_monitoring_system_ids: string[] }"
    success_status: 200
    side_effects:
      - "every MonitoringSystem with cal_status == CAL_CURRENT whose last_calibration_utc < to_iso8601 - 26 hours moves to CAL_EXPIRED and increments its version"

  # ---- Facility -------------------------------------------------------------
  - method: POST
    path: /emissions/facilities
    description: "Registers a fossil fuel electric generating station."
    roles: [RegulatoryReviewer]
    input: [name, orispl_code, state_code, operator_org, programs, true_up_deadline_utc, "max_concurrent_control_outages?"]
    output: Facility
    success_status: 201
    side_effects: ["compliance_posture initialises to COMPLIANT"]

  - method: GET
    path: /emissions/facilities
    description: "Lists facilities."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["state_code?", "status?", "compliance_posture?", "operator_org?", "limit?", "offset?"]
    output: Facility[]
    success_status: 200

  - method: GET
    path: /emissions/facilities/{id}
    description: "Reads one facility including its derived compliance_posture."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: Facility
    success_status: 200

  - method: PATCH
    path: /emissions/facilities/{id}
    description: "Updates the true-up deadline, the concurrent outage ceiling or the operating status."
    roles: [RegulatoryReviewer]
    input: ["true_up_deadline_utc?", "max_concurrent_control_outages?", "status?"]
    output: Facility
    success_status: 200
    side_effects: ["increments Facility.version by 1"]

  # ---- Unit -----------------------------------------------------------------
  - method: POST
    path: /emissions/facilities/{id}/units
    description: "Adds a generating unit to a facility."
    roles: [RegulatoryReviewer, FacilityOperator]
    input: [unit_identifier, primary_fuel, nameplate_capacity_mw, max_rated_heat_input_mmbtu_hr, "control_device?"]
    output: Unit
    success_status: 201
    side_effects: ["dispatch_state initialises to OFFLINE, control_status to AVAILABLE, data_availability_pct to 100.0, certified_so2_lbs_ytd to 0.0"]

  - method: GET
    path: /emissions/units
    description: "Lists generating units, filterable by facility."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["facility_id?", "dispatch_state?", "control_status?", "dispatch_restricted?", "primary_fuel?", "limit?", "offset?"]
    output: Unit[]
    success_status: 200

  - method: GET
    path: /emissions/units/{id}
    description: "Reads one generating unit."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: Unit
    success_status: 200

  - method: PATCH
    path: /emissions/units/{id}/dispatch
    description: "Moves the unit between ONLINE, OFFLINE and RESERVE_SHUTDOWN."
    roles: [FacilityOperator]
    input: [dispatch_state]
    output: Unit
    success_status: 200
    side_effects: ["increments Unit.version by 1"]

  # ---- MonitoringSystem -----------------------------------------------------
  - method: POST
    path: /emissions/units/{id}/monitoring-systems
    description: "Installs a continuous emission monitoring system or an excepted Appendix D system on a unit."
    roles: [QAAnalyst, FacilityOperator]
    input: [parameter, system_type, span_value, "calibration_error_spec_pct?"]
    output: MonitoringSystem
    success_status: 201
    side_effects: ["qa_status initialises to RECERTIFICATION_PENDING, cal_status to CAL_EXPIRED, bias_adjustment_factor to 1.0, consecutive_failed_calibrations to 0"]

  - method: GET
    path: /emissions/monitoring-systems
    description: "Lists monitoring systems."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["unit_id?", "parameter?", "system_type?", "qa_status?", "cal_status?", "limit?", "offset?"]
    output: MonitoringSystem[]
    success_status: 200

  - method: GET
    path: /emissions/monitoring-systems/{id}
    description: "Reads one monitoring system, including both status dimensions."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: MonitoringSystem
    success_status: 200

  - method: POST
    path: /emissions/monitoring-systems/{id}/qa-status
    description: "Drives the qa_status dimension: CERTIFY, CONDITIONALLY_VALIDATE, DECLARE_OUT_OF_CONTROL or RETIRE."
    roles: [QAAnalyst]
    input: [action, "effective_utc?", "reason?"]
    output: MonitoringSystem
    success_status: 200
    side_effects:
      - "on CERTIFY, adopts the bias_adjustment_factor of the latest PASSED RataTest"
      - "on DECLARE_OUT_OF_CONTROL, runs the four-link availability cascade"

  # ---- DailyCalibration ----------------------------------------------------
  - method: POST
    path: /emissions/monitoring-systems/{id}/daily-calibrations
    description: "Records a daily zero and upstream calibration error check."
    roles: [FacilityOperator, QAAnalyst]
    input: [expected_monitoring_system_version, calibration_utc, zero_reference_value, zero_measured_value, span_reference_value, span_measured_value]
    output: DailyCalibration
    success_status: 201
    side_effects:
      - "computes zero_error_pct_of_span / span_error_pct_of_span / result per calculations.daily_calibration_error"
      - "moves MonitoringSystem.cal_status and, on OUT_OF_CONTROL_TRIGGERED, qa_status plus the four-link cascade"
      - "stores monitoring_system_version_after so the caller can chain a further OCC-guarded write"

  - method: GET
    path: /emissions/monitoring-systems/{id}/daily-calibrations
    description: "Lists the calibration history of one monitoring system, newest first."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["result?", "limit?", "offset?"]
    output: DailyCalibration[]
    success_status: 200

  - method: GET
    path: /emissions/daily-calibrations
    description: "Lists daily calibrations across systems."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["monitoring_system_id?", "result?", "limit?", "offset?"]
    output: DailyCalibration[]
    success_status: 200

  - method: GET
    path: /emissions/daily-calibrations/{id}
    description: "Reads one calibration record. Immutable: no update endpoint and no version field."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: DailyCalibration
    success_status: 200

  # ---- RataTest ------------------------------------------------------------
  - method: POST
    path: /emissions/monitoring-systems/{id}/rata-tests
    description: "Schedules a relative accuracy test audit, optionally as the replacement for a failed audit."
    roles: [QAAnalyst]
    input: [window_start_utc, window_end_utc, "applicable_standard_value?", "retest_of_rata_test_id?"]
    output: RataTest
    success_status: 201
    side_effects:
      - "attempt_number is 1, or the predecessor's attempt_number + 1 when retest_of_rata_test_id is supplied"
      - "a supplied predecessor in status FAILED moves to VOIDED"

  - method: GET
    path: /emissions/rata-tests
    description: "Lists relative accuracy test audits."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["monitoring_system_id?", "retest_of_rata_test_id?", "status?", "ra_basis?", "limit?", "offset?"]
    output: RataTest[]
    success_status: 200

  - method: GET
    path: /emissions/rata-tests/{id}
    description: "Reads one audit including its runs and derived statistics."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: RataTest
    success_status: 200

  - method: POST
    path: /emissions/rata-tests/{id}/runs
    description: "Records the 9 to 12 paired reference-method / CEMS runs of the audit."
    roles: [QAAnalyst]
    input: [runs]
    output: RataTest
    success_status: 200
    side_effects: ["computes run_count, reference_mean, cems_mean, mean_difference and confidence_coefficient; status SCHEDULED -> RUNS_RECORDED"]

  - method: POST
    path: /emissions/rata-tests/{id}/evaluate
    description: "Applies the pass/fail criteria and the bias test on the chosen denominator."
    roles: [QAAnalyst]
    input: [ra_basis]
    output: RataTest
    success_status: 200
    side_effects:
      - "computes relative_accuracy_pct, bias_test_failed and bias_adjustment_factor"
      - "PASSED propagates the bias adjustment factor onto a CERTIFIED monitoring system; FAILED demotes it to CONDITIONALLY_VALID"

  - method: POST
    path: /emissions/rata-tests/{id}/reschedule
    description: "Retest procedure: returns a FAILED audit to SCHEDULED with a fresh window and a higher attempt_number."
    roles: [QAAnalyst]
    input: [window_start_utc, window_end_utc]
    output: RataTest
    success_status: 200
    side_effects: ["clears runs and all derived statistics; attempt_number += 1"]

  # ---- FuelSample ----------------------------------------------------------
  - method: POST
    path: /emissions/units/{id}/fuel-samples
    description: "Records a fuel sample drawn for heat input and sulfur determination."
    roles: [FacilityOperator]
    input: [sample_utc, fuel_type, lot_identifier]
    output: FuelSample
    success_status: 201
    side_effects: ["status initialises to PENDING with no analysis values"]

  - method: GET
    path: /emissions/fuel-samples
    description: "Lists fuel samples."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["unit_id?", "status?", "fuel_type?", "lot_identifier?", "limit?", "offset?"]
    output: FuelSample[]
    success_status: 200

  - method: GET
    path: /emissions/fuel-samples/{id}
    description: "Reads one fuel sample."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: FuelSample
    success_status: 200

  - method: POST
    path: /emissions/fuel-samples/{id}/analysis
    description: "Records or invalidates the laboratory analysis of a fuel sample."
    roles: [QAAnalyst]
    input: [outcome, "gcv_btu_per_lb?", "sulfur_content_pct?", "analysis_method?", "invalidation_reason?"]
    output: FuelSample
    success_status: 200
    side_effects: ["ANALYZED populates gcv_btu_per_lb / sulfur_content_pct / analysis_method / analyzed_utc; INVALIDATE clears none of them but blocks report validation"]

  # ---- QuarterlyReport -----------------------------------------------------
  - method: POST
    path: /emissions/units/{id}/quarterly-reports
    description: "Opens the electronic quarterly emissions report for one unit and calendar quarter."
    roles: [EmissionsReportPreparer]
    input: [year, quarter]
    output: QuarterlyReport
    success_status: 201
    side_effects: ["status DRAFT, every count 0, every total 0, monitor_data_availability_pct 100.0, resubmission_count 0"]

  - method: GET
    path: /emissions/quarterly-reports
    description: "Lists quarterly reports."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["unit_id?", "year?", "quarter?", "status?", "limit?", "offset?"]
    output: QuarterlyReport[]
    success_status: 200

  - method: GET
    path: /emissions/quarterly-reports/{id}
    description: "Reads one quarterly report with all rolled-up totals."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: QuarterlyReport
    success_status: 200

  - method: POST
    path: /emissions/quarterly-reports/{id}/validate
    description: "Runs the pre-submission edit checks and freezes the rolled-up totals."
    roles: [EmissionsReportPreparer]
    input: []
    output: QuarterlyReport
    success_status: 200
    side_effects: ["recomputes every count and total per calculations.quarterly_report_totals; status DRAFT -> VALIDATED"]

  - method: POST
    path: /emissions/quarterly-reports/{id}/submit
    description: "Submits the validated report as an electronic data file."
    roles: [EmissionsReportPreparer]
    input: [submission_format]
    output: QuarterlyReport
    success_status: 200
    side_effects: ["records submitted_by_user_id from X-User-ID and submitted_utc from the logical clock; status VALIDATED -> SUBMITTED"]

  - method: POST
    path: /emissions/quarterly-reports/{id}/certifications
    description: "Signs the certification statement for a submitted report."
    roles: [DesignatedRepresentative]
    input: [expected_quarterly_report_version, statement_text]
    output: ComplianceCertification
    success_status: 201
    side_effects:
      - "snapshots total_so2_lbs into certified_so2_lbs_snapshot and credits Unit.certified_so2_lbs_ytd"
      - "status SUBMITTED -> CERTIFIED on the parent report"

  - method: GET
    path: /emissions/quarterly-reports/{id}/certifications
    description: "Lists the certification statements ever signed for one report, newest first."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["status?", "limit?", "offset?"]
    output: ComplianceCertification[]
    success_status: 200

  - method: GET
    path: /emissions/certifications
    description: "Lists certification statements across reports."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["quarterly_report_id?", "status?", "certifier_user_id?", "limit?", "offset?"]
    output: ComplianceCertification[]
    success_status: 200

  - method: GET
    path: /emissions/certifications/{id}
    description: "Reads one certification statement."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: ComplianceCertification
    success_status: 200

  - method: POST
    path: /emissions/certifications/{id}/revoke
    description: "Revokes a signed certification and returns the report to SUBMITTED."
    roles: [DesignatedRepresentative]
    input: [revocation_reason]
    output: ComplianceCertification
    success_status: 200
    side_effects: ["debits Unit.certified_so2_lbs_ytd by certified_so2_lbs_snapshot exactly; parent report CERTIFIED -> SUBMITTED"]

  - method: POST
    path: /emissions/quarterly-reports/{id}/disposition
    description: "Regulator decision on a certified report: ACCEPT or REJECT."
    roles: [RegulatoryReviewer]
    input: [decision, "reason?"]
    output: QuarterlyReport
    success_status: 200
    side_effects: ["REJECT also revokes the signed certification and debits Unit.certified_so2_lbs_ytd"]

  - method: POST
    path: /emissions/quarterly-reports/{id}/reopen
    description: "Returns a rejected report to DRAFT for resubmission."
    roles: [EmissionsReportPreparer]
    input: []
    output: QuarterlyReport
    success_status: 200
    side_effects: ["resubmission_count += 1; clears submission_format, submitted_by_user_id, submitted_utc and rejection_reason"]

  # ---- OperatingHour ------------------------------------------------------
  - method: POST
    path: /emissions/units/{id}/operating-hours
    description: "Appends one hour of operating and emissions data to the report that owns its hour."
    roles: [FacilityOperator, EmissionsReportPreparer]
    input: [expected_quarterly_report_version, hour_begin_utc, op_time_fraction, heat_input_method, "gross_load_mw?", "flow_scfh?", "co2_conc_pct?", "so2_conc_ppm?", "nox_rate_lb_mmbtu?", "fuel_flow_lbs?", "fuel_sample_id?"]
    output: OperatingHour
    success_status: 201
    side_effects:
      - "computes heat_input_mmbtu / so2_mass_lbs / nox_mass_lbs / co2_mass_tons per calculations.hourly_heat_input_and_mass"
      - "classifies data_quality UNAVAILABLE when the governing monitoring system is OUT_OF_CONTROL / RETIRED or its cal_status is CAL_EXPIRED / CAL_FAILED, otherwise MEASURED"
      - "recomputes the owning report's counts and totals, reverting a VALIDATED report to DRAFT"
      - "recomputes Unit.data_availability_pct; stores quarterly_report_version_after"

  - method: POST
    path: /emissions/units/{id}/operating-hours/bulk
    description: "Appends up to 200 operating hours in one all-or-nothing request."
    roles: [FacilityOperator, EmissionsReportPreparer]
    input: [expected_quarterly_report_version, hours]
    output: OperatingHour[]
    success_status: 201
    side_effects:
      - "hours are applied in hour_begin_utc ASC order regardless of array order"
      - "any per-item violation rejects the entire array and persists nothing; the report's version does not move"
      - "one single report recompute runs after all hours are applied, so the report's version advances by exactly 1"

  - method: GET
    path: /emissions/operating-hours
    description: "Lists operating hours."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["unit_id?", "quarterly_report_id?", "fuel_sample_id?", "data_quality?", "substitution_method?", "heat_input_method?", "from_hour_utc?", "to_hour_utc?", "limit?", "offset?"]
    output: OperatingHour[]
    success_status: 200

  - method: GET
    path: /emissions/operating-hours/{id}
    description: "Reads one operating hour. Immutable: no update endpoint and no version field."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: OperatingHour
    success_status: 200

  - method: POST
    path: /emissions/units/{id}/missing-data/substitutions
    description: "Applies the missing data substitution procedure to every UNAVAILABLE hour in a half-open range."
    roles: [EmissionsReportPreparer, FacilityOperator]
    input: [from_hour_utc, to_hour_utc]
    output: OperatingHour[]
    success_status: 200
    side_effects:
      - "each hour receives substitution_method, substituted_so2_conc_ppm, monitor_data_availability_pct_at_substitution and a recomputed so2_mass_lbs; data_quality becomes SUBSTITUTED"
      - "hours are processed in hour_begin_utc ASC order and each hour's tier is frozen before the next hour is considered"
      - "recomputes the owning reports' counts and totals and Unit.data_availability_pct"

  # ---- PermitLimit --------------------------------------------------------
  - method: POST
    path: /emissions/units/{id}/permit-limits
    description: "Adds a source-specific permit limit with a rolling averaging basis."
    roles: [RegulatoryReviewer]
    input: [pollutant, limit_value, limit_units, averaging_basis, effective_from_utc]
    output: PermitLimit
    success_status: 201
    side_effects: ["evaluation_status initialises to NOT_EVALUATED with a null current_rolling_value"]

  - method: GET
    path: /emissions/permit-limits
    description: "Lists permit limits."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["unit_id?", "pollutant?", "averaging_basis?", "evaluation_status?", "limit?", "offset?"]
    output: PermitLimit[]
    success_status: 200

  - method: GET
    path: /emissions/permit-limits/{id}
    description: "Reads one permit limit with its latest rolling evaluation."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: PermitLimit
    success_status: 200

  - method: POST
    path: /emissions/permit-limits/{id}/evaluate
    description: "Evaluates the rolling average ending at an anchor instant and raises or withdraws excess emission events."
    roles: [RegulatoryReviewer, EmissionsReportPreparer]
    input: [anchor_utc]
    output: PermitLimit
    success_status: 200
    side_effects:
      - "sets current_rolling_value, window_sample_count, window_evaluated_utc and evaluation_status per calculations.rolling_average_limit_check"
      - "an EXCEEDED result creates an ExcessEmissionEvent in DETECTED with observed_value, limit_value_snapshot, exceedance_magnitude and penalty_allowance_debit_tons"
      - "a non-EXCEEDED result moves every DETECTED event of this limit to WITHDRAWN"

  # ---- ExcessEmissionEvent ------------------------------------------------
  - method: GET
    path: /emissions/excess-emission-events
    description: "Lists excess emission events. Events are only ever created by a limit evaluation, never by a client POST."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["permit_limit_id?", "unit_id?", "status?", "limit?", "offset?"]
    output: ExcessEmissionEvent[]
    success_status: 200

  - method: GET
    path: /emissions/excess-emission-events/{id}
    description: "Reads one excess emission event."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: ExcessEmissionEvent
    success_status: 200

  - method: POST
    path: /emissions/excess-emission-events/{id}/report
    description: "Files the excess emission report narrative and corrective action."
    roles: [EmissionsReportPreparer]
    input: [narrative, corrective_action]
    output: ExcessEmissionEvent
    success_status: 200
    side_effects: ["status DETECTED -> REPORTED"]

  - method: POST
    path: /emissions/excess-emission-events/{id}/review
    description: "Opens regulator review of a reported excess emission event."
    roles: [RegulatoryReviewer]
    input: []
    output: ExcessEmissionEvent
    success_status: 200
    side_effects: ["status REPORTED -> UNDER_REVIEW"]

  - method: POST
    path: /emissions/excess-emission-events/{id}/disposition
    description: "Regulator decision: EXCUSE, ENFORCE or RETURN for more information."
    roles: [RegulatoryReviewer]
    input: [decision, "reason?"]
    output: ExcessEmissionEvent
    success_status: 200
    side_effects:
      - "ENFORCE makes penalty_allowance_debit_tons part of the facility's allowance obligation"
      - "RETURN increments return_count and sends the event back to REPORTED"

  # ---- AllowanceAccount ---------------------------------------------------
  - method: POST
    path: /emissions/facilities/{id}/allowance-accounts
    description: "Opens an allowance holdings account for one program and compliance year."
    roles: [RegulatoryReviewer]
    input: [program, compliance_year, holdings_current_vintage_tons, holdings_prior_vintage_tons, holdings_next_vintage_tons]
    output: AllowanceAccount
    success_status: 201
    side_effects: ["status OPEN; obligation_tons, surrendered_tons, penalty_deducted_tons and shortfall_tons all 0"]

  - method: GET
    path: /emissions/allowance-accounts
    description: "Lists allowance accounts."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["facility_id?", "program?", "compliance_year?", "status?", "limit?", "offset?"]
    output: AllowanceAccount[]
    success_status: 200

  - method: GET
    path: /emissions/allowance-accounts/{id}
    description: "Reads one allowance account with all three vintage buckets."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: AllowanceAccount
    success_status: 200

  - method: POST
    path: /emissions/allowance-accounts/{id}/true-up
    description: "Runs the compliance-deadline true-up: converts accepted emissions into an obligation and drains holdings."
    roles: [RegulatoryReviewer]
    input: []
    output: AllowanceAccount
    success_status: 200
    side_effects:
      - "runs calculations.allowance_true_up_waterfall and creates the SETTLED TRUE_UP_SURRENDER transaction"
      - "a residual shortfall creates the SETTLED TRUE_UP_PENALTY transaction and locks the account, then flips the facility posture to DEFICIT and restricts every unit's dispatch"
      - "a zero shortfall closes the account and leaves dispatch untouched"

  # ---- AllowanceTransaction ----------------------------------------------
  - method: POST
    path: /emissions/allowance-transactions
    description: "Proposes an allowance purchase, transfer or surrender."
    roles: [AllowanceTrader]
    input: [expected_allowance_account_version, allowance_account_id, transaction_type, quantity_tons, vintage_year, "counterparty_account_id?"]
    output: AllowanceTransaction
    success_status: 201
    side_effects:
      - "status PROPOSED, origin MANUAL, no holdings move yet"
      - "stores allowance_account_version_after"

  - method: GET
    path: /emissions/allowance-transactions
    description: "Lists allowance transactions."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["allowance_account_id?", "counterparty_account_id?", "transaction_type?", "status?", "origin?", "vintage_year?", "limit?", "offset?"]
    output: AllowanceTransaction[]
    success_status: 200

  - method: GET
    path: /emissions/allowance-transactions/{id}
    description: "Reads one allowance transaction including the exact per-bucket debits it applied."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: AllowanceTransaction
    success_status: 200

  - method: POST
    path: /emissions/allowance-transactions/{id}/transition
    description: "RECORD, SETTLE or REVERSE an allowance transaction."
    roles: [DesignatedRepresentative]
    input: [action, "reason?"]
    output: AllowanceTransaction
    success_status: 200
    side_effects:
      - "SETTLE moves holdings per calculations.allowance_transaction_settlement and records debited_current_tons / debited_prior_tons / debited_next_tons"
      - "REVERSE of a SETTLED row credits back exactly those three amounts and runs the four-link release cascade"

  # ---- ControlOutageWindow -----------------------------------------------
  - method: POST
    path: /emissions/units/{id}/control-outages
    description: "Plans a control equipment outage window for compliance planning around unit dispatch."
    roles: [FacilityOperator]
    input: [start_utc, end_utc, outage_type, control_device]
    output: ControlOutageWindow
    success_status: 201
    side_effects: ["status PLANNED; Unit.control_status is untouched until activation"]

  - method: GET
    path: /emissions/control-outages
    description: "Lists control equipment outage windows."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: ["unit_id?", "status?", "outage_type?", "control_device?", "limit?", "offset?"]
    output: ControlOutageWindow[]
    success_status: 200

  - method: GET
    path: /emissions/control-outages/{id}
    description: "Reads one control equipment outage window."
    roles: [RegulatoryReviewer, FacilityOperator, QAAnalyst, EmissionsReportPreparer, DesignatedRepresentative, AllowanceTrader]
    input: []
    output: ControlOutageWindow
    success_status: 200

  - method: POST
    path: /emissions/control-outages/{id}/transition
    description: "ACTIVATE, CLOSE or CANCEL a control equipment outage window."
    roles: [FacilityOperator]
    input: [action, "reason?"]
    output: ControlOutageWindow
    success_status: 200
    side_effects:
      - "ACTIVATE sets Unit.control_status = OUT_OF_SERVICE and is subject to the facility-wide concurrent outage ceiling"
      - "CLOSE returns Unit.control_status to AVAILABLE only when no other window of the unit is still ACTIVE"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID missing or blank, or X-User-Role missing / not one of the six declared roles"
    applies_to: [all]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "X-User-Role is valid but not listed in the endpoint's roles"
    applies_to: [all]
  - id: ERR_FACILITY_SCOPE_VIOLATION
    http_status: 403
    condition: "a FacilityOperator addresses a unit whose facility.operator_org != X-User-ID"
    applies_to: ["all FacilityOperator-scoped writes"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "the certifying X-User-ID equals QuarterlyReport.submitted_by_user_id"
    applies_to: ["POST /emissions/quarterly-reports/{id}/certifications"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required field, unknown enum value, wrong JSON type, or a field forbidden for the chosen heat_input_method / action"
    applies_to: [all]
  - id: ERR_INVALID_PAGINATION
    http_status: 400
    condition: "limit outside [1, 100] or offset < 0"
    applies_to: ["all list endpoints"]
  - id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    condition: "facility id in the path does not exist"
    applies_to: ["GET/PATCH /emissions/facilities/{id}", "POST /emissions/facilities/{id}/units", "POST /emissions/facilities/{id}/allowance-accounts"]
  - id: ERR_UNIT_NOT_FOUND
    http_status: 404
    condition: "unit id in the path does not exist"
    applies_to: ["GET /emissions/units/{id}", "PATCH /emissions/units/{id}/dispatch", "all POST /emissions/units/{id}/... sub-resources"]
  - id: ERR_MONITORING_SYSTEM_NOT_FOUND
    http_status: 404
    condition: "monitoring system id in the path does not exist"
    applies_to: ["GET /emissions/monitoring-systems/{id}", "POST /emissions/monitoring-systems/{id}/qa-status", "POST /emissions/monitoring-systems/{id}/daily-calibrations", "POST /emissions/monitoring-systems/{id}/rata-tests"]
  - id: ERR_DAILY_CALIBRATION_NOT_FOUND
    http_status: 404
    condition: "daily calibration id in the path does not exist"
    applies_to: ["GET /emissions/daily-calibrations/{id}"]
  - id: ERR_RATA_TEST_NOT_FOUND
    http_status: 404
    condition: "rata test id in the path does not exist, or retest_of_rata_test_id in the body does not exist or belongs to another monitoring system"
    applies_to: ["GET /emissions/rata-tests/{id}", "POST /emissions/rata-tests/{id}/runs", "POST /emissions/rata-tests/{id}/evaluate", "POST /emissions/rata-tests/{id}/reschedule", "POST /emissions/monitoring-systems/{id}/rata-tests"]
  - id: ERR_OPERATING_HOUR_NOT_FOUND
    http_status: 404
    condition: "operating hour id in the path does not exist"
    applies_to: ["GET /emissions/operating-hours/{id}"]
  - id: ERR_FUEL_SAMPLE_NOT_FOUND
    http_status: 404
    condition: "fuel sample id in the path does not exist, or fuel_sample_id in the body does not exist or belongs to another unit"
    applies_to: ["GET /emissions/fuel-samples/{id}", "POST /emissions/fuel-samples/{id}/analysis", "POST /emissions/units/{id}/operating-hours", "POST /emissions/units/{id}/operating-hours/bulk"]
  - id: ERR_QUARTERLY_REPORT_NOT_FOUND
    http_status: 404
    condition: "quarterly report id in the path does not exist"
    applies_to: ["GET /emissions/quarterly-reports/{id}", "all POST /emissions/quarterly-reports/{id}/... actions"]
  - id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    condition: "certification id in the path does not exist"
    applies_to: ["GET /emissions/certifications/{id}", "POST /emissions/certifications/{id}/revoke"]
  - id: ERR_PERMIT_LIMIT_NOT_FOUND
    http_status: 404
    condition: "permit limit id in the path does not exist"
    applies_to: ["GET /emissions/permit-limits/{id}", "POST /emissions/permit-limits/{id}/evaluate"]
  - id: ERR_EXCESS_EVENT_NOT_FOUND
    http_status: 404
    condition: "excess emission event id in the path does not exist"
    applies_to: ["GET /emissions/excess-emission-events/{id}", "POST /emissions/excess-emission-events/{id}/report", "POST /emissions/excess-emission-events/{id}/review", "POST /emissions/excess-emission-events/{id}/disposition"]
  - id: ERR_ALLOWANCE_ACCOUNT_NOT_FOUND
    http_status: 404
    condition: "allowance account id in the path does not exist, or allowance_account_id / counterparty_account_id in the body does not exist"
    applies_to: ["GET /emissions/allowance-accounts/{id}", "POST /emissions/allowance-accounts/{id}/true-up", "POST /emissions/allowance-transactions"]
  - id: ERR_ALLOWANCE_TRANSACTION_NOT_FOUND
    http_status: 404
    condition: "allowance transaction id in the path does not exist"
    applies_to: ["GET /emissions/allowance-transactions/{id}", "POST /emissions/allowance-transactions/{id}/transition"]
  - id: ERR_CONTROL_OUTAGE_NOT_FOUND
    http_status: 404
    condition: "control outage window id in the path does not exist"
    applies_to: ["GET /emissions/control-outages/{id}", "POST /emissions/control-outages/{id}/transition"]
  - id: ERR_STALE_MONITORING_SYSTEM_VERSION
    http_status: 412
    condition: "expected_monitoring_system_version != MonitoringSystem.version"
    applies_to: ["POST /emissions/monitoring-systems/{id}/daily-calibrations"]
  - id: ERR_STALE_REPORT_VERSION
    http_status: 412
    condition: "expected_quarterly_report_version != QuarterlyReport.version"
    applies_to: ["POST /emissions/units/{id}/operating-hours", "POST /emissions/units/{id}/operating-hours/bulk", "POST /emissions/quarterly-reports/{id}/certifications"]
  - id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    condition: "expected_allowance_account_version != AllowanceAccount.version"
    applies_to: ["POST /emissions/allowance-transactions"]
  - id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    condition: "the requested transition is not declared from the entity's current state, including terminal-state lockdown, repeat one-shot actions, dispatching a restricted unit, and activating an outage on an ONLINE unit"
    applies_to: ["all action / transition endpoints"]
  - id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    condition: "a QuarterlyReport already exists for (unit_id, year, quarter)"
    applies_to: ["POST /emissions/units/{id}/quarterly-reports"]
  - id: ERR_DUPLICATE_MONITORING_SYSTEM
    http_status: 409
    condition: "a non-RETIRED MonitoringSystem already exists for (unit_id, parameter)"
    applies_to: ["POST /emissions/units/{id}/monitoring-systems"]
  - id: ERR_DUPLICATE_ORISPL_CODE
    http_status: 409
    condition: "orispl_code is already registered to another Facility"
    applies_to: ["POST /emissions/facilities"]
  - id: ERR_DUPLICATE_OPERATING_HOUR
    http_status: 409
    condition: "an OperatingHour already exists for (unit_id, hour_begin_utc)"
    applies_to: ["POST /emissions/units/{id}/operating-hours", "POST /emissions/units/{id}/operating-hours/bulk"]
  - id: ERR_DUPLICATE_ALLOWANCE_ACCOUNT
    http_status: 409
    condition: "an AllowanceAccount already exists for (facility_id, program, compliance_year)"
    applies_to: ["POST /emissions/facilities/{id}/allowance-accounts"]
  - id: ERR_DUPLICATE_PERMIT_LIMIT
    http_status: 409
    condition: "a PermitLimit already exists for (unit_id, pollutant, averaging_basis, effective_from_utc)"
    applies_to: ["POST /emissions/units/{id}/permit-limits"]
  - id: ERR_ACCOUNT_TRUE_UP_LOCKED
    http_status: 409
    condition: "the AllowanceAccount is TRUE_UP_LOCKED or CLOSED and the request is a proposal or a SETTLE"
    applies_to: ["POST /emissions/allowance-transactions", "POST /emissions/allowance-transactions/{id}/transition"]
  - id: ERR_UNIT_NOT_ONLINE
    http_status: 409
    condition: "the RATA test's unit has dispatch_state != ONLINE when runs are recorded"
    applies_to: ["POST /emissions/rata-tests/{id}/runs"]
  - id: ERR_MONITOR_OUT_OF_CONTROL
    http_status: 409
    condition: "a MonitoringSystem of the report's unit has qa_status == OUT_OF_CONTROL"
    applies_to: ["POST /emissions/quarterly-reports/{id}/validate"]
  - id: ERR_MONITOR_NOT_CERTIFIED
    http_status: 409
    condition: "a MonitoringSystem of the report's unit is RECERTIFICATION_PENDING or RETIRED, or a CERTIFY is attempted while a FAILED RataTest is outstanding"
    applies_to: ["POST /emissions/quarterly-reports/{id}/validate", "POST /emissions/monitoring-systems/{id}/qa-status"]
  - id: ERR_CALIBRATION_NOT_CURRENT
    http_status: 409
    condition: "CERTIFY is attempted while cal_status == CAL_FAILED, or while restoring from OUT_OF_CONTROL with cal_status != CAL_CURRENT"
    applies_to: ["POST /emissions/monitoring-systems/{id}/qa-status"]
  - id: ERR_FUEL_SAMPLE_NOT_ANALYZED
    http_status: 409
    condition: "an APPENDIX_D_FUEL hour references a FuelSample whose status != ANALYZED"
    applies_to: ["POST /emissions/units/{id}/operating-hours", "POST /emissions/units/{id}/operating-hours/bulk"]
  - id: ERR_FUEL_ANALYSIS_INVALIDATED
    http_status: 409
    condition: "an OperatingHour of the report references a FuelSample whose status == INVALIDATED"
    applies_to: ["POST /emissions/quarterly-reports/{id}/validate"]
  - id: ERR_TRUE_UP_BEFORE_DEADLINE
    http_status: 409
    condition: "the logical clock is before Facility.true_up_deadline_utc"
    applies_to: ["POST /emissions/allowance-accounts/{id}/true-up"]
  - id: ERR_REPORTS_NOT_ALL_ACCEPTED
    http_status: 409
    condition: "at least one QuarterlyReport of the facility for compliance_year is not ACCEPTED"
    applies_to: ["POST /emissions/allowance-accounts/{id}/true-up"]
  - id: ERR_RA_BASIS_NOT_PERMITTED
    http_status: 409
    condition: "ra_basis == APPLICABLE_STANDARD without applicable_standard_value, or with reference_mean above LOW_EMITTER_REFERENCE_MEAN[parameter]"
    applies_to: ["POST /emissions/rata-tests/{id}/evaluate"]
  - id: ERR_RETEST_ALREADY_EXISTS
    http_status: 409
    condition: "retest_of_rata_test_id names a test that is not FAILED, or one already referenced by another RataTest"
    applies_to: ["POST /emissions/monitoring-systems/{id}/rata-tests"]
  - id: ERR_RATA_WINDOW_OVERLAP
    http_status: 409
    condition: "the [window_start_utc, window_end_utc) interval overlaps another SCHEDULED or RUNS_RECORDED audit of the same monitoring system"
    applies_to: ["POST /emissions/monitoring-systems/{id}/rata-tests", "POST /emissions/rata-tests/{id}/reschedule"]
  - id: ERR_RATA_WINDOW_IN_PAST
    http_status: 422
    condition: "window_start_utc is strictly before the logical clock"
    applies_to: ["POST /emissions/monitoring-systems/{id}/rata-tests", "POST /emissions/rata-tests/{id}/reschedule"]
  - id: ERR_INSUFFICIENT_RATA_RUNS
    http_status: 422
    condition: "the runs array has fewer than 9 or more than 12 entries, or a run carries a non-positive value"
    applies_to: ["POST /emissions/rata-tests/{id}/runs"]
  - id: ERR_CONTROL_OUTAGE_OVERLAP
    http_status: 409
    condition: "the [start_utc, end_utc) interval overlaps another PLANNED or ACTIVE window of the same (unit_id, control_device)"
    applies_to: ["POST /emissions/units/{id}/control-outages"]
  - id: ERR_CONCURRENT_OUTAGE_LIMIT
    http_status: 409
    condition: "activating the window would push the facility's ACTIVE window count above max_concurrent_control_outages"
    applies_to: ["POST /emissions/control-outages/{id}/transition"]
  - id: ERR_HOUR_OUTSIDE_REPORT_PERIOD
    http_status: 422
    condition: "hour_begin_utc is not exactly on the hour, or no DRAFT / VALIDATED report exists for its (unit, year, quarter)"
    applies_to: ["POST /emissions/units/{id}/operating-hours", "POST /emissions/units/{id}/operating-hours/bulk"]
  - id: ERR_METHOD_FIELD_MISMATCH
    http_status: 422
    condition: "the supplied measurement fields do not match heat_input_method, or the unit owns no MonitoringSystem of the matching system_type"
    applies_to: ["POST /emissions/units/{id}/operating-hours", "POST /emissions/units/{id}/operating-hours/bulk"]
  - id: ERR_DATA_AVAILABILITY_BELOW_FLOOR
    http_status: 422
    condition: "monitor_data_availability_pct < 80.0 at validation"
    applies_to: ["POST /emissions/quarterly-reports/{id}/validate"]
  - id: ERR_INVALID_INTERVAL
    http_status: 422
    condition: "start >= end on a RATA window, a control outage window or a substitution range"
    applies_to: ["POST /emissions/monitoring-systems/{id}/rata-tests", "POST /emissions/rata-tests/{id}/reschedule", "POST /emissions/units/{id}/control-outages", "POST /emissions/units/{id}/missing-data/substitutions"]
  - id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    condition: "a numeric input is outside the range declared in validations priority 340"
    applies_to: ["all POST / PATCH endpoints with numeric input"]
  - id: ERR_NO_SUBSTITUTABLE_HOURS
    http_status: 422
    condition: "no OperatingHour with data_quality == UNAVAILABLE exists in the requested range"
    applies_to: ["POST /emissions/units/{id}/missing-data/substitutions"]
  - id: ERR_BULK_SIZE_INVALID
    http_status: 422
    condition: "the hours array is empty or longer than 200"
    applies_to: ["POST /emissions/units/{id}/operating-hours/bulk"]
  - id: ERR_INSUFFICIENT_ALLOWANCES
    http_status: 422
    condition: "a SURRENDER or TRANSFER_OUT settlement exceeds holdings_prior_vintage_tons + holdings_current_vintage_tons"
    applies_to: ["POST /emissions/allowance-transactions/{id}/transition"]
  - id: ERR_INVALID_QUANTITY
    http_status: 422
    condition: "quantity_tons <= 0"
    applies_to: ["POST /emissions/allowance-transactions"]
  - id: ERR_INVALID_COUNTERPARTY
    http_status: 422
    condition: "a transfer omits counterparty_account_id, names the source account itself, names an account in another program, or a non-transfer supplies one"
    applies_to: ["POST /emissions/allowance-transactions"]
  - id: ERR_VINTAGE_YEAR_INVALID
    http_status: 422
    condition: "vintage_year outside [compliance_year - 1, compliance_year + 1]"
    applies_to: ["POST /emissions/allowance-transactions"]
  - id: ERR_PENALTY_TRANSACTION_NOT_CLIENT_CREATABLE
    http_status: 422
    condition: "a client proposes transaction_type == PENALTY_DEDUCTION"
    applies_to: ["POST /emissions/allowance-transactions"]
  - id: ERR_REASON_REQUIRED
    http_status: 422
    condition: "a transition that requires a free-text reason is invoked without one"
    applies_to: ["POST /emissions/quarterly-reports/{id}/disposition", "POST /emissions/excess-emission-events/{id}/disposition", "POST /emissions/certifications/{id}/revoke", "POST /emissions/allowance-transactions/{id}/transition", "POST /emissions/control-outages/{id}/transition", "POST /emissions/fuel-samples/{id}/analysis"]

# =============================================================================
# 1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: RegulatoryReviewer
    description: "Permitting and enforcement authority. Registers facilities, units and permit limits, opens allowance accounts, dispositions reports and excess emission events, and runs the compliance-deadline true-up."
    identity: opaque
    exclusive_operations:
      - "POST /emissions/facilities"
      - "PATCH /emissions/facilities/{id}"
      - "POST /emissions/units/{id}/permit-limits"
      - "POST /emissions/facilities/{id}/allowance-accounts"
      - "POST /emissions/allowance-accounts/{id}/true-up"
      - "POST /emissions/quarterly-reports/{id}/disposition"
      - "POST /emissions/excess-emission-events/{id}/review"
      - "POST /emissions/excess-emission-events/{id}/disposition"
    shared_operations:
      - "POST /emissions/facilities/{id}/units (with FacilityOperator)"
      - "POST /emissions/permit-limits/{id}/evaluate (with EmissionsReportPreparer)"
      - "every GET endpoint"
      - "POST /emissions/_clock/set_current_utc"

  - name: FacilityOperator
    description: "Plant operations staff for one facility. Records daily calibrations, operating hours, fuel samples, dispatch changes and control equipment outages. Scoped to the facility whose operator_org equals the caller's X-User-ID."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "PATCH /emissions/units/{id}/dispatch"
      - "POST /emissions/units/{id}/fuel-samples"
      - "POST /emissions/units/{id}/control-outages"
      - "POST /emissions/control-outages/{id}/transition"
    shared_operations:
      - "POST /emissions/facilities/{id}/units (with RegulatoryReviewer)"
      - "POST /emissions/units/{id}/monitoring-systems (with QAAnalyst)"
      - "POST /emissions/monitoring-systems/{id}/daily-calibrations (with QAAnalyst)"
      - "POST /emissions/units/{id}/operating-hours and .../bulk (with EmissionsReportPreparer)"
      - "POST /emissions/units/{id}/missing-data/substitutions (with EmissionsReportPreparer)"
      - "every GET endpoint"
      - "POST /emissions/_clock/set_current_utc"

  - name: QAAnalyst
    description: "Quality assurance specialist. Owns monitor certification status, relative accuracy test audits and their retests, and fuel sample laboratory analysis."
    identity: opaque
    exclusive_operations:
      - "POST /emissions/monitoring-systems/{id}/qa-status"
      - "POST /emissions/monitoring-systems/{id}/rata-tests"
      - "POST /emissions/rata-tests/{id}/runs"
      - "POST /emissions/rata-tests/{id}/evaluate"
      - "POST /emissions/rata-tests/{id}/reschedule"
      - "POST /emissions/fuel-samples/{id}/analysis"
    shared_operations:
      - "POST /emissions/units/{id}/monitoring-systems (with FacilityOperator)"
      - "POST /emissions/monitoring-systems/{id}/daily-calibrations (with FacilityOperator)"
      - "every GET endpoint"
      - "POST /emissions/_clock/set_current_utc"

  - name: EmissionsReportPreparer
    description: "Prepares, validates and electronically submits the quarterly emissions report, applies missing data substitution, and files excess emission reports. Cannot certify what it submitted."
    identity: opaque
    exclusive_operations:
      - "POST /emissions/units/{id}/quarterly-reports"
      - "POST /emissions/quarterly-reports/{id}/validate"
      - "POST /emissions/quarterly-reports/{id}/submit"
      - "POST /emissions/quarterly-reports/{id}/reopen"
      - "POST /emissions/excess-emission-events/{id}/report"
    shared_operations:
      - "POST /emissions/units/{id}/operating-hours and .../bulk (with FacilityOperator)"
      - "POST /emissions/units/{id}/missing-data/substitutions (with FacilityOperator)"
      - "POST /emissions/permit-limits/{id}/evaluate (with RegulatoryReviewer)"
      - "every GET endpoint"
      - "POST /emissions/_clock/set_current_utc"

  - name: DesignatedRepresentative
    description: "Legally accountable signatory for the source. Signs and revokes compliance certifications and records, settles or reverses allowance transactions. Never proposes a transaction and never submits a report."
    identity: opaque
    exclusive_operations:
      - "POST /emissions/quarterly-reports/{id}/certifications"
      - "POST /emissions/certifications/{id}/revoke"
      - "POST /emissions/allowance-transactions/{id}/transition"
    shared_operations:
      - "every GET endpoint"
      - "POST /emissions/_clock/set_current_utc"

  - name: AllowanceTrader
    description: "Market-facing role that proposes allowance purchases, transfers and voluntary surrenders. Has no authority to record or settle what it proposed, and no authority anywhere else in the system."
    identity: opaque
    exclusive_operations:
      - "POST /emissions/allowance-transactions"
    shared_operations:
      - "every GET endpoint"
      - "POST /emissions/_clock/set_current_utc"
