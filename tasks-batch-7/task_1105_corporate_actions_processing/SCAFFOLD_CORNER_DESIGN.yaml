              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}", captures: { el1: $.data.id } }
          trigger:
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "STOCK", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "First election ${el1} created at event version 2 -> 3"
            - "Second submit with stale expected_event_version == 2 fails: error_id == ERR_STALE_EVENT_VERSION (412); Election.${el1} remains SUBMITTED (not superseded)"

      - name: pending_entitlement_count_tracks_lifecycle
        claim_type: derived_field_reconciliation
        grounds: [entities.Account.fields.pending_entitlement_count, calculations.account_derived_balances]
        distinguishing_aspect: "The denormalized counter reconciles on every source mutation: 0 at account creation, 1 after confirm, still 1 after capture (in-place FIRM), 0 after booking settles."
        test_recipe:
          setup: ["ACME; account A1 (100 sh); SPLIT 2:1 event progressing confirm -> capture -> book"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPG00004", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id, c0: $.data.pending_entitlement_count } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 100, acquisition_date: "2026-04-01", cost_basis_total_cents: 500000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { c1: $.data.pending_entitlement_count } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { c2: $.data.pending_entitlement_count } }
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { c3: $.data.pending_entitlement_count } }
          assert:
            - "pending_entitlement_count: ${c0} == 0 at creation -> ${c1} == 1 after confirm -> ${c2} == 1 after capture -> ${c3} == 0 after book"

      - name: unset_clock_defaults_to_fixed_start
        claim_type: scheduled_actions
        grounds: ["validations[priority=10]", "errors[ERR_ELECTION_DEADLINE_PASSED]"]
        distinguishing_aspect: "With NO clock-set call the logical clock reads exactly 2026-05-01T00:00:00Z: a deadline of 2026-04-30T16:00:00Z is already past, so submission fails — proving the deterministic default rather than wall-clock drift."
        test_recipe:
          setup: ["ACME + NEWCO; account A1 (10 sh); MERGER with deadline 2026-04-30T16:00:00Z CONFIRMED; clock NEVER set"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPG00005", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/securities", payload: { ticker: "NWC", cusip: "CUSPG00006", name: "Newco Inc" }, as: DeskAdministrator, captures: { newco_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 10, acquisition_date: "2026-04-01", cost_basis_total_cents: 50000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-04-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-04-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "MERGER", election_required: true, election_deadline: "2026-04-30T16:00:00Z", terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" }, record_date: "2026-04-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
          trigger:
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ELECTION_DEADLINE_PASSED (422) with no clock-set call: default logical time 2026-05-01T00:00:00Z is already past the 2026-04-30T16:00:00Z deadline"

      - name: frozen_account_entitlement_missed_no_mutation
        claim_type: cascading_side_effects
        grounds: [state_machines.Entitlement.FIRM_to_MISSED, state_machines.CorporateActionEvent.CONFIRMED_to_BOOKED]
        distinguishing_aspect: "Conditional cascade: booking skips a FROZEN account — entitlement FIRM -> MISSED, its lot quantity (5) and cash (0) are untouched, and booking totals exclude it entirely."
        test_recipe:
          setup: ["ACME; account A1 (5 sh) FROZEN before booking; SPLIT 2:1 CONFIRMED + captured; book"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPG00007", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 5, acquisition_date: "2026-04-01", cost_basis_total_cents: 25000 }, as: DeskAdministrator, captures: { l1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "PUT /api/accounts/${a1}", payload: { status: "FROZEN" }, as: OperationsManager }
          trigger:
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager, captures: { bk_sh: $.data.total_whole_shares_credited, bk_cash: $.data.total_cash_credited_cents } }
            - { call: "GET /api/entitlements?event_id=${ev_id}&account_id=${a1}", payload: {}, as: OperationsManager, captures: { ent_st: "$.data[0].status"} }
            - { call: "GET /api/position-lots/${l1}", payload: {}, as: OperationsManager, captures: { l1_qty: $.data.quantity } }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { a1_cash: $.data.cash_balance_cents } }
          assert:
            - "Entitlement status == MISSED (conditional on Account.status != ACTIVE)"
            - "PositionLot.${l1}.quantity == 5 (untouched); Account.${a1}.cash_balance_cents == 0"
            - "Booking totals exclude the missed account: total_whole_shares_credited == 0 AND total_cash_credited_cents == 0"

