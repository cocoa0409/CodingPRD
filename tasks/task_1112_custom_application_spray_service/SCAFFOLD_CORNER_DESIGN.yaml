        excluded_because:
          difficulty_instance: combinatorial_formula / mix_envelope_nested_min_max
          rationale: "Envelope violations asserted there; ERR_REI_ACTIVE asserted in cross_entity_state_dependency / start_blocked_by_field_rei."

