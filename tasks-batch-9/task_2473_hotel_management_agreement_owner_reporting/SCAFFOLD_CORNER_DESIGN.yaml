            - call: "POST /hotel-management/agreements/${au_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${au_v2}" }
              as: HotelManagerOps
