            - "the second reopen would assess base_fee_cents 27500 == 25000 + 2500 * (2 - 1), and 25000 + 27500 == 52500 exceeds SURCHARGE_CAP_CENTS 50000"
            - "response code is 402 with data.error_id == ERR_SURCHARGE_CAP_EXCEEDED"
            - "QuarterlySubmission.${sub}.status is still ACCEPTED with amendment_index == 1 and amendment_surcharge_cents == 25000, and Facility.${fac}.outstanding_surcharge_cents is still 25000"

