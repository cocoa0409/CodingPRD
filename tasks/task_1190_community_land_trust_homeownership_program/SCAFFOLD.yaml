    input: [tax_year, reported_annual_income_cents, verified_annual_income_cents, household_size_at_cert]
    output: IncomeCertification
    side_effects: ["status=SUBMITTED; submitted_by=acting X-User-ID; ami_pct_at_cert computed"]

  - method: GET
    path: "/programs/{id}/households/{householdId}/income-certifications"
    description: "List income certifications for a household"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Household]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IncomeCertification[]"
    side_effects: []

  - method: GET
    path: "/programs/{id}/households/{householdId}/income-certifications/{certId}"
    description: "Get an income certification"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Household]
    code: 200
    input: []
    output: IncomeCertification
    side_effects: []

  - method: POST
    path: "/programs/{id}/households/{householdId}/income-certifications/{certId}/start-review"
    description: "Move cert to UNDER_REVIEW"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncomeCertification
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/programs/{id}/households/{householdId}/income-certifications/{certId}/approve"
    description: "Approve cert (requires segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncomeCertification
    side_effects: ["status → APPROVED; decided_at=now; reviewed_by set; Household.ami_pct recomputed; Household.eligibility_status re-evaluated; if Household.active_lease_id set, GroundLease.monthly_fee_cents recomputed; PENDING LeaseFee rows re-amounted"]

  - method: POST
    path: "/programs/{id}/households/{householdId}/income-certifications/{certId}/reject"
    description: "Reject cert"
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_reason]
    output: IncomeCertification
    side_effects: ["status → REJECTED; if Household has no other APPROVED cert: eligibility_status → INELIGIBLE"]

  # --- EducationCourse ---
  - method: POST
    path: "/programs/{id}/education-courses"
    description: "Create education course"
    roles: [ProgramAdmin]
    code: 201
    input: [code, title, credit_hours, "is_required?", "validity_months?"]
    output: EducationCourse
    side_effects: ["status=OFFERED"]

  - method: GET
    path: "/programs/{id}/education-courses"
    description: "List courses"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Inspector, Household]
    code: 200
    input: ["is_required?", "status?", "limit?", "offset?"]
    output: "EducationCourse[]"
    side_effects: []

  - method: GET
    path: "/programs/{id}/education-courses/{courseId}"
    description: "Get course"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Inspector, Household]
