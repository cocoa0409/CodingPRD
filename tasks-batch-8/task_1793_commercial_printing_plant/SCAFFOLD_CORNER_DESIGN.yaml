          assert: ["error_id == ERR_FORBIDDEN_ROLE"]

      - name: rbac_customer_list_scoping
        claim_type: role_scoping
        grounds: [roles, endpoints]
        distinguishing_aspect: "GET /estimates as Customer B returns only B's own estimates (server-side scoping), never A's — list scoping complements single-resource ownership rejection."
        test_recipe:
          setup: ["Customers A and B each have one estimate"]
          setup_api_calls:
