scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_domain_points_on_rating_cycle
        grounds:
          - calculations.domain_points_award
          - calculations.rating_tier_determination
          - calculations.credential_compliance_pct
          - entities.RatingCycle.fields.domain_points
          - entities.RatingCycle.fields.weighted_total
          - entities.RatingCycle.fields.awarded_tier
          - entities.SelfAssessment.fields.claimed_points
          - entities.SelfAssessment.fields.verified_points
          - state_machines.RatingCycle.OBSERVATION_FINALIZED_to_AWARDED
        distinguishing_aspect: |
          This dual-variant instance operates on the rating-scoring entity domain
          (SelfAssessment claimed_points vs verified_points feeding RatingCycle.domain_points):
          the PROVISIONAL run over identical stored rows yields weighted_total 86.00 and
          awarded_tier 5 while the FINAL run yields weighted_total 77.50 and awarded_tier 4,
          because PROVISIONAL keeps the claimed 36 points for the observation-linked domain
          while FINAL derives 32 points from observation_composite 5.50.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-10T00:00:00Z before any rating action."
            - "Five StandardDomain rows: LEARNING_ENVIRONMENT (block 1, max 40, min 20, weight 0.30, observation_linked, min_composite_for_block 4.50), STAFF_QUALIFICATIONS (block 1, max 30, min 15, weight 0.25), FAMILY_PARTNERSHIP (block 2, max 20, min 12, weight 0.20), ADMINISTRATION (block 2, max 20, min 10, weight 0.15), CHILD_ASSESSMENT (block 3, max 10, min 6, weight 0.10); weights sum exactly 1.00."
            - "One ENROLLED provider, active_staff_fte 10.0, region_code RURAL."
            - "Three VERIFIED StaffCredential rows with expires_on 2027-06-30 contributing qualifying_fte 1.0 + 4.2 + 4.0 = 9.2, so credential_compliance_pct == 92.00 and CREDENTIAL_FRACTION == 0.80 giving a STAFF_QUALIFICATIONS cap of 24 points."
            - "One INITIAL RatingCycle whose SelfAssessment is VERIFIED with claimed_points {36, 28, 18, 16, 9} and verified_points {30, 26, 15, 14, 8}."
            - "One ObservationVisit in RELIABILITY_CHECK: lead observer holds six current 5.5 subscale scores, secondary observer holds six current 5.5 subscale scores; cycle.observation_composite is still null because the visit is not finalized."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "LEARNING_ENVIRONMENT", block_level: 1, max_points: 40, block_min_points: 20, weight: 0.30, observation_linked: true, min_composite_for_block: 4.50 }
              as: StateAdministrator
              captures: { dom_le_id: $.data.id }
            - call: "POST /standard-domains"
              payload: { domain_code: "STAFF_QUALIFICATIONS", block_level: 1, max_points: 30, block_min_points: 15, weight: 0.25, observation_linked: false }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "FAMILY_PARTNERSHIP", block_level: 2, max_points: 20, block_min_points: 12, weight: 0.20, observation_linked: false }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "ADMINISTRATION", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "CHILD_ASSESSMENT", block_level: 3, max_points: 10, block_min_points: 6, weight: 0.10, observation_linked: false }
              as: StateAdministrator
            - call: "POST /providers"
              payload: { legal_name: "Maple Grove Early Learning", license_number: "LIC-2207-A", county_code: "MRN", region_code: "RURAL", licensed_capacity: 80, active_staff_fte: 10.0, weekly_onsite_cap_hours: 20 }
              as: StateAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/enrollment-decisions"
              payload: { decision: "APPROVE" }
              as: StateAdministrator
              captures: { prov_v1: $.data.version }
            - call: "POST /providers/${prov_id}/staff-credentials"
              payload: { staff_registry_id: "REG-DIR-1", role_type: "DIRECTOR", credential_level: 4, fte: 1.0, employment_status: "ACTIVE" }
              as: StateAdministrator
              captures: { cred_dir_id: $.data.id }
            - call: "POST /staff-credentials/${cred_dir_id}/registry-link"
              payload: { registry_status: "VERIFIED", verified_on: "2026-07-01", expires_on: "2027-06-30", credential_level: 4 }
              as: StateAdministrator
            - call: "POST /providers/${prov_id}/staff-credentials"
              payload: { staff_registry_id: "REG-LEAD-1", role_type: "LEAD_TEACHER", credential_level: 3, fte: 4.2, employment_status: "ACTIVE" }
              as: StateAdministrator
              captures: { cred_lead_id: $.data.id }
            - call: "POST /staff-credentials/${cred_lead_id}/registry-link"
              payload: { registry_status: "VERIFIED", verified_on: "2026-07-01", expires_on: "2027-06-30", credential_level: 3 }
              as: StateAdministrator
            - call: "POST /providers/${prov_id}/staff-credentials"
              payload: { staff_registry_id: "REG-ASST-1", role_type: "ASSISTANT", credential_level: 1, fte: 4.0, employment_status: "ACTIVE" }
              as: StateAdministrator
              captures: { cred_asst_id: $.data.id }
            - call: "POST /staff-credentials/${cred_asst_id}/registry-link"
              payload: { registry_status: "VERIFIED", verified_on: "2026-07-01", expires_on: "2027-06-30", credential_level: 1 }
              as: StateAdministrator
              captures: { prov_v_after_creds: $.data.version }
            - call: "GET /providers/${prov_id}"
              payload: {}
              as: StateAdministrator
              captures: { prov_v_now: $.data.version }
            - call: "POST /providers/${prov_id}/rating-cycles"
              payload: { cycle_type: "INITIAL", expected_provider_version: "${prov_v_now}" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /rating-cycles/${cyc_id}/self-assessments"
              payload:
                claimed_points: { LEARNING_ENVIRONMENT: 36, STAFF_QUALIFICATIONS: 28, FAMILY_PARTNERSHIP: 18, ADMINISTRATION: 16, CHILD_ASSESSMENT: 9 }
                documentation:
                  - { domain_code: "LEARNING_ENVIRONMENT", evidence_type: "LESSON_PLAN", reference_label: "LE-01", page_count: 12 }
                  - { domain_code: "STAFF_QUALIFICATIONS", evidence_type: "ROSTER", reference_label: "SQ-01", page_count: 4 }
                  - { domain_code: "FAMILY_PARTNERSHIP", evidence_type: "FAMILY_SURVEY", reference_label: "FP-01", page_count: 6 }
                  - { domain_code: "ADMINISTRATION", evidence_type: "POLICY", reference_label: "AD-01", page_count: 9 }
                  - { domain_code: "CHILD_ASSESSMENT", evidence_type: "TRAINING_LOG", reference_label: "CA-01", page_count: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /self-assessments/${sa_id}/verification-decisions"
              payload:
                decision: "APPROVE"
                verified_points: { LEARNING_ENVIRONMENT: 30, STAFF_QUALIFICATIONS: 26, FAMILY_PARTNERSHIP: 15, ADMINISTRATION: 14, CHILD_ASSESSMENT: 8 }
                note: "all five domains documented"
              as: StateAdministrator
            - call: "POST /observers"
              payload: { full_name: "Lead Observer One", tool_code: "ECERS_R" }
              as: StateAdministrator
              captures: { obs_lead_id: $.data.id }
            - call: "POST /observers/${obs_lead_id}/reliability-certifications"
              payload: { decision: "CERTIFY", anchor_agreement_pct: 92.00, certified_until: "2027-06-30" }
              as: StateAdministrator
            - call: "POST /observers"
              payload: { full_name: "Secondary Observer One", tool_code: "ECERS_R" }
              as: StateAdministrator
              captures: { obs_sec_id: $.data.id }
            - call: "POST /observers/${obs_sec_id}/reliability-certifications"
              payload: { decision: "CERTIFY", anchor_agreement_pct: 90.00, certified_until: "2027-06-30" }
              as: StateAdministrator
            - call: "POST /rating-cycles/${cyc_id}/observation-visits"
              payload: { lead_observer_id: "${obs_lead_id}", secondary_observer_id: "${obs_sec_id}", window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T13:00:00Z" }
              as: StateAdministrator
              captures: { visit_id: $.data.id }
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "SPACE_FURNISHINGS", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_lead_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "PERSONAL_CARE", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_lead_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "LANGUAGE_REASONING", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_lead_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "ACTIVITIES", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_lead_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "INTERACTION", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_lead_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "PROGRAM_STRUCTURE", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_lead_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "SPACE_FURNISHINGS", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_sec_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "PERSONAL_CARE", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_sec_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "LANGUAGE_REASONING", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_sec_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "ACTIVITIES", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_sec_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "INTERACTION", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_sec_id}"
            - call: "POST /observation-visits/${visit_id}/scores"
              payload: { subscale_code: "PROGRAM_STRUCTURE", raw_score: 5.5 }
              as: Observer
              as_user_id: "${obs_sec_id}"
          trigger:
            - call: "GET /rating-cycles/${cyc_id}/score-preview"
              payload: { variant: "PROVISIONAL" }
              as: StateAdministrator
              captures: { prov_weighted: $.data.weighted_total, prov_tier: $.data.awarded_tier }
            - call: "POST /observation-visits/${visit_id}/finalize"
              payload: {}
              as: StateAdministrator
            - call: "POST /rating-cycles/${cyc_id}/award"
              payload: { score_variant: "FINAL" }
              as: StateAdministrator
              captures: { final_weighted: $.data.weighted_total, final_tier: $.data.awarded_tier }
          assert:
            - "${prov_weighted} == 86.00"
            - "${prov_tier} == 5"
            - "Provider.${prov_id}.credential_compliance_pct == 92.00"
            - "RatingCycle.${cyc_id}.observation_composite == 5.50"
            - "${final_weighted} == 77.50"
            - "${final_tier} == 4"
            - "RatingCycle.${cyc_id}.points_tier == 4"
            - "RatingCycle.${cyc_id}.domain_points.LEARNING_ENVIRONMENT == 32"
            - "RatingCycle.${cyc_id}.domain_points.STAFF_QUALIFICATIONS == 24"
            - "RatingCycle.${cyc_id}.domain_points.FAMILY_PARTNERSHIP == 15"
            - "RatingCycle.${cyc_id}.domain_points.ADMINISTRATION == 14"
            - "RatingCycle.${cyc_id}.domain_points.CHILD_ASSESSMENT == 8"
            - "RatingCycle.${cyc_id}.highest_block_cleared == 3"
            - "RatingCycle.${cyc_id}.score_variant == FINAL"
            - "RatingCycle.${cyc_id}.validity_months == 36"
            - "RatingCycle.${cyc_id}.effective_date == 2026-09-01T00:00:00.000Z"
            - "RatingCycle.${cyc_id}.expires_on == 2029-08-31T23:59:59.999Z"
            - "RatingCycle.${cyc_id}.rerating_window_opens_on == 2029-06-02T00:00:00.000Z"
            - "${prov_weighted} != ${final_weighted}"
      - name: interim_vs_reconciled_subsidy_multiplier_on_subsidy_claim
        grounds:
          - calculations.subsidy_reimbursement
          - calculations.validity_period
          - entities.SubsidyClaim.fields.tier_multiplier_applied
          - entities.SubsidyClaim.fields.reimbursement_cents
          - entities.SubsidyClaim.fields.variant_applied
          - entities.Provider.fields.region_code
          - state_machines.RatingCycle.UNDER_APPEAL_to_AWARDED
          - state_machines.SubsidyClaim.PAID_to_RECONCILE_REQUIRED
        distinguishing_aspect: |
          This dual-variant instance operates on the subsidy-payment entity domain
          (SubsidyClaim money on a FRONTIER provider), not on rating scoring: the same
          child_days {22, 41, 53} yield reimbursement_cents 561270 under the INTERIM
          variant at tier multiplier 1.1500 and 732090 under the mandatory RECONCILED
          re-pay at tier multiplier 1.5000, a 170820-cent divergence produced purely by
          the variant selection.
        test_recipe:
          setup:
            - "Same five StandardDomain rows as instance provisional_vs_final_domain_points_on_rating_cycle."
            - "Clock at 2026-08-10T00:00:00Z for the award; provider region_code FRONTIER (REGION_FACTOR 1.15), active_staff_fte 10.0."
            - "Three VERIFIED StaffCredential rows contributing qualifying_fte 1.0 + 3.5 + 4.0 = 8.5, so credential_compliance_pct == 85.00, which clears MIN_COMPLIANCE_BY_TIER[3] == 80.00 but not MIN_COMPLIANCE_BY_TIER[4] == 90.00."
            - "SelfAssessment VERIFIED with verified_points {LEARNING_ENVIRONMENT 24, STAFF_QUALIFICATIONS 22, FAMILY_PARTNERSHIP 13, ADMINISTRATION 11, CHILD_ASSESSMENT 7}."
            - "Single-observer ObservationVisit finalized with six current lead scores of 4.5, so observation_composite == 4.50 which exactly meets min_composite_for_block 4.50 and reliability_pct is null."
            - "Cycle awarded FINAL at weighted_total 64.58, points_tier 3, awarded_tier 3, effective_date 2026-09-01, validity_months 24, expires_on 2028-08-31; promoted to ACTIVE by an expiry run on 2026-09-01 so Provider.current_tier == 3."
            - "One SubsidyClaim for service_month 2026-09 with child_days {INFANT 22, TODDLER 41, PRESCHOOL 53}, approved under variant INTERIM and PAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "LEARNING_ENVIRONMENT", block_level: 1, max_points: 40, block_min_points: 20, weight: 0.30, observation_linked: true, min_composite_for_block: 4.50 }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "STAFF_QUALIFICATIONS", block_level: 1, max_points: 30, block_min_points: 15, weight: 0.25, observation_linked: false }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "FAMILY_PARTNERSHIP", block_level: 2, max_points: 20, block_min_points: 12, weight: 0.20, observation_linked: false }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "ADMINISTRATION", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }
              as: StateAdministrator
            - call: "POST /standard-domains"
              payload: { domain_code: "CHILD_ASSESSMENT", block_level: 3, max_points: 10, block_min_points: 6, weight: 0.10, observation_linked: false }
              as: StateAdministrator
            - call: "POST /providers"
              payload: { legal_name: "Frontier Butte Child Care", license_number: "LIC-2207-B", county_code: "HRN", region_code: "FRONTIER", licensed_capacity: 60, active_staff_fte: 10.0, weekly_onsite_cap_hours: 16 }
              as: StateAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /providers/${p2_id}/enrollment-decisions"
              payload: { decision: "APPROVE" }
              as: StateAdministrator
            - call: "POST /providers/${p2_id}/staff-credentials"
              payload: { staff_registry_id: "REG-B-DIR", role_type: "DIRECTOR", credential_level: 4, fte: 1.0, employment_status: "ACTIVE" }
              as: StateAdministrator
              captures: { c2_dir: $.data.id }
            - call: "POST /staff-credentials/${c2_dir}/registry-link"
              payload: { registry_status: "VERIFIED", verified_on: "2026-07-01", expires_on: "2027-12-31", credential_level: 4 }
              as: StateAdministrator
            - call: "POST /providers/${p2_id}/staff-credentials"
              payload: { staff_registry_id: "REG-B-LEAD", role_type: "LEAD_TEACHER", credential_level: 3, fte: 3.5, employment_status: "ACTIVE" }
              as: StateAdministrator
              captures: { c2_lead: $.data.id }
            - call: "POST /staff-credentials/${c2_lead}/registry-link"
              payload: { registry_status: "VERIFIED", verified_on: "2026-07-01", expires_on: "2027-12-31", credential_level: 3 }
              as: StateAdministrator
            - call: "POST /providers/${p2_id}/staff-credentials"
              payload: { staff_registry_id: "REG-B-ASST", role_type: "ASSISTANT", credential_level: 1, fte: 4.0, employment_status: "ACTIVE" }
              as: StateAdministrator
              captures: { c2_asst: $.data.id }
            - call: "POST /staff-credentials/${c2_asst}/registry-link"
              payload: { registry_status: "VERIFIED", verified_on: "2026-07-01", expires_on: "2027-12-31", credential_level: 1 }
              as: StateAdministrator
            - call: "GET /providers/${p2_id}"
              payload: {}
              as: StateAdministrator
              captures: { p2_v: $.data.version }
            - call: "POST /providers/${p2_id}/rating-cycles"
              payload: { cycle_type: "INITIAL", expected_provider_version: "${p2_v}" }
              as: Provider
              as_user_id: "${p2_id}"
              captures: { c2_cyc: $.data.id }
            - call: "POST /rating-cycles/${c2_cyc}/self-assessments"
              payload:
                claimed_points: { LEARNING_ENVIRONMENT: 26, STAFF_QUALIFICATIONS: 24, FAMILY_PARTNERSHIP: 15, ADMINISTRATION: 13, CHILD_ASSESSMENT: 8 }
                documentation:
                  - { domain_code: "LEARNING_ENVIRONMENT", evidence_type: "LESSON_PLAN", reference_label: "B-LE", page_count: 10 }
                  - { domain_code: "STAFF_QUALIFICATIONS", evidence_type: "ROSTER", reference_label: "B-SQ", page_count: 3 }
                  - { domain_code: "FAMILY_PARTNERSHIP", evidence_type: "FAMILY_SURVEY", reference_label: "B-FP", page_count: 5 }
                  - { domain_code: "ADMINISTRATION", evidence_type: "POLICY", reference_label: "B-AD", page_count: 8 }
                  - { domain_code: "CHILD_ASSESSMENT", evidence_type: "TRAINING_LOG", reference_label: "B-CA", page_count: 2 }
              as: Provider
              as_user_id: "${p2_id}"
              captures: { c2_sa: $.data.id }
            - call: "POST /self-assessments/${c2_sa}/verification-decisions"
              payload:
                decision: "APPROVE"
                verified_points: { LEARNING_ENVIRONMENT: 24, STAFF_QUALIFICATIONS: 22, FAMILY_PARTNERSHIP: 13, ADMINISTRATION: 11, CHILD_ASSESSMENT: 7 }
              as: StateAdministrator
            - call: "POST /observers"
              payload: { full_name: "Frontier Lead Observer", tool_code: "ECERS_R" }
              as: StateAdministrator
              captures: { o2_lead: $.data.id }
            - call: "POST /observers/${o2_lead}/reliability-certifications"
              payload: { decision: "CERTIFY", anchor_agreement_pct: 88.00, certified_until: "2027-12-31" }
              as: StateAdministrator
            - call: "POST /rating-cycles/${c2_cyc}/observation-visits"
              payload: { lead_observer_id: "${o2_lead}", window_start: "2026-08-11T09:00:00Z", window_end: "2026-08-11T12:00:00Z" }
              as: StateAdministrator
              captures: { v2_id: $.data.id }
            - call: "POST /observation-visits/${v2_id}/scores"
              payload: { subscale_code: "SPACE_FURNISHINGS", raw_score: 4.5 }
              as: Observer
              as_user_id: "${o2_lead}"
            - call: "POST /observation-visits/${v2_id}/scores"
              payload: { subscale_code: "PERSONAL_CARE", raw_score: 4.5 }
              as: Observer
              as_user_id: "${o2_lead}"
            - call: "POST /observation-visits/${v2_id}/scores"
              payload: { subscale_code: "LANGUAGE_REASONING", raw_score: 4.5 }
              as: Observer
              as_user_id: "${o2_lead}"
            - call: "POST /observation-visits/${v2_id}/scores"
              payload: { subscale_code: "ACTIVITIES", raw_score: 4.5 }
              as: Observer
              as_user_id: "${o2_lead}"
            - call: "POST /observation-visits/${v2_id}/scores"
              payload: { subscale_code: "INTERACTION", raw_score: 4.5 }
              as: Observer
              as_user_id: "${o2_lead}"
            - call: "POST /observation-visits/${v2_id}/scores"
              payload: { subscale_code: "PROGRAM_STRUCTURE", raw_score: 4.5 }
              as: Observer
              as_user_id: "${o2_lead}"
            - call: "POST /observation-visits/${v2_id}/finalize"
              payload: {}
              as: StateAdministrator
            - call: "POST /rating-cycles/${c2_cyc}/award"
              payload: { score_variant: "FINAL" }
              as: StateAdministrator
              as_user_id: "sa-award-1"
              captures: { c2_tier: $.data.awarded_tier, c2_eff: $.data.effective_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StateAdministrator
            - call: "POST /qris/expiry-runs"
              payload: {}
              as: StateAdministrator
            - call: "POST /providers/${p2_id}/subsidy-claims"
              payload: { service_month: "2026-09", child_days: { INFANT: 22, TODDLER: 41, PRESCHOOL: 53 } }
              as: Provider
              as_user_id: "${p2_id}"
              captures: { cl2_id: $.data.id }
            - call: "POST /subsidy-claims/${cl2_id}/adjudicate"
              payload: { decision: "APPROVE", variant: "INTERIM" }
              as: StateAdministrator
              captures: { cl2_interim_cents: $.data.reimbursement_cents, cl2_interim_mult: $.data.tier_multiplier_applied }
            - call: "POST /subsidy-claims/${cl2_id}/pay"
              payload: {}
              as: StateAdministrator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: StateAdministrator
            - call: "POST /rating-cycles/${c2_cyc}/appeals"
              payload: { grounds: "SCORING_ERROR", narrative: "learning environment subscales mis-entered" }
              as: Provider
              as_user_id: "${p2_id}"
              captures: { ap2_id: $.data.id }
            - call: "POST /appeals/${ap2_id}/review-actions"
              payload: { action: "START" }
              as: AppealReviewer
