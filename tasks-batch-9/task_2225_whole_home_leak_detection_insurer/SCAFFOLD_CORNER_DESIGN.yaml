scaffold_corner_design:
  - section: entities
    instances:
      - name: create_homeowner_returns_active_account_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Homeowner.fields.account_state
          - entities.Homeowner.fields.owned_property_count
          - endpoints.POST_/homeowners
        distinguishing_aspect: "POST /homeowners with the three required fields returns HTTP 201 and a Homeowner whose system fields are server-assigned: account_state == ACTIVE, deactivated_at == null, owned_property_count == 0, version == 1."
        test_recipe:
          setup:
            - "The database is empty; the logical clock is set to 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries response_type == object with meta.api_request_id present"
            - "$.data.id is a non-empty string, $.data.full_name == Ada Reyes, $.data.email == ada@example.com, $.data.phone_e164 == +14155550101"
            - "Homeowner.${h1}.account_state == ACTIVE, deactivated_at == null, owned_property_count == 0, version == 1"
            - "$.data.created_at == 2026-08-01T06:05:00Z and $.data.updated_at == 2026-08-01T06:05:00Z (both stamped from the logical clock, not wall time)"

      - name: create_homeowner_omitting_notification_channel_applies_sms_default
        claim_type: Defaults
        grounds:
          - entities.Homeowner.fields.notification_channel
          - endpoints.POST_/homeowners
        distinguishing_aspect: "notification_channel is an optional input with default SMS: omitting it yields notification_channel == SMS, while supplying EMAIL yields EMAIL, proving the default is applied and not hard-coded."
        test_recipe:
          setup:
            - "The database is empty; the logical clock is set to 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /homeowners"
              payload: { full_name: "Ben Ortiz", email: "ben@example.com", phone_e164: "+14155550202", notification_channel: "EMAIL" }
              as: ProgramAdmin
              captures: { h2: $.data.id }
          assert:
            - "Homeowner.${h1}.notification_channel == SMS (the declared default, applied when the field is omitted)"
            - "Homeowner.${h2}.notification_channel == EMAIL (the supplied value wins over the default)"

      - name: create_property_omitting_irrigation_present_defaults_false
        claim_type: Defaults
        grounds:
          - entities.Property.fields.irrigation_present
          - entities.Property.fields.property_state
          - endpoints.POST_/properties
        distinguishing_aspect: "irrigation_present defaults to false, so a property created without it is created with irrigation_present == false and property_state == ACTIVE, archived_at == null."
        test_recipe:
          setup:
            - "Homeowner ${h1} exists and is ACTIVE; the logical clock is 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "9 Birch Rd", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1975 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p2: $.data.id }
          assert:
            - "Property.${p2}.irrigation_present == false, property_state == ACTIVE, archived_at == null, version == 1"
            - "Homeowner.${h1}.owned_property_count == 1 after the create (the computed count re-derives immediately)"

      - name: get_device_returns_stored_entity_with_defaults
        claim_type: Retrieval
        grounds:
          - entities.Device.fields.lifecycle_state
          - entities.Device.fields.firmware_version
          - endpoints.GET_/devices/{device_id}
        distinguishing_aspect: "GET /devices/{id} echoes exactly what POST /devices stored: serial FLO-000001, model_code FLO_SMART_3_4, firmware_version 1.0.0 from the declared default, lifecycle_state REGISTERED, valve_state OPEN, monitor_mode NORMAL, close_count 0, reopen_count 0."
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1}; Device ${d1} was registered by InstallerTech tech-01 with no firmware_version supplied; the clock is 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
          trigger:
            - call: "GET /devices/${d1}"
              payload: {}
              as: InstallerTech
              as_user_id: "tech-01"
          assert:
            - "HTTP 200 with $.data.id == ${d1}, $.data.property_id == ${p1}, $.data.serial_number == FLO-000001, $.data.model_code == FLO_SMART_3_4"
            - "$.data.firmware_version == 1.0.0 (declared default), $.data.lifecycle_state == REGISTERED, $.data.valve_state == OPEN, $.data.monitor_mode == NORMAL"
            - "$.data.close_count == 0, $.data.reopen_count == 0, $.data.install_verified_at == null, $.data.installed_static_pressure_psi == null, $.data.baseline_ready == false, $.data.version == 1"

      - name: list_property_devices_returns_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/properties/{property_id}/devices
          - entities.Device.fields.lifecycle_state
        distinguishing_aspect: "GET /properties/{id}/devices with limit 1 returns exactly one row with total_count == 2 and has_more == true; offset 1 returns the second row with has_more == false, and lifecycle_state=REGISTERED filters to only the unverified device."
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} carrying two devices: ${d1} (install-verified, LEARNING) and ${d2} (REGISTERED)."
            - "The logical clock is 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000002", model_code: "FLO_SMART_1_0" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d2: $.data.id }
          trigger:
            - call: "GET /properties/${p1}/devices"
              payload: { limit: 1, offset: 0 }
              as: Homeowner
              as_user_id: "${h1}"
          assert:
            - "HTTP 200, response_type == array, $.data holds exactly 1 element, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "GET /properties/${p1}/devices with limit 1 and offset 1 returns 1 element, total_count == 2 and has_more == false"
            - "GET /properties/${p1}/devices with lifecycle_state REGISTERED returns total_count == 1 and $.data[0].id == ${d2}"
            - "GET /properties/${p1}/devices with no params returns total_count == 2 with the default limit 10 and offset 0 echoed"

      - name: get_device_unknown_id_returns_device_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_DEVICE_NOT_FOUND]
          - endpoints.GET_/devices/{device_id}
        distinguishing_aspect: "A syntactically valid but unknown device id returns HTTP 404 with error_id ERR_DEVICE_NOT_FOUND, not 200 with a null body and not 400."
        test_recipe:
          setup:
            - "Homeowner ${h1} and Property ${p1} exist; no Device row has been created; the clock is 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /devices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and ${err_nf} == ERR_DEVICE_NOT_FOUND"
            - "$.data.message is a non-empty string and no $.data.id field is present"

      - name: create_property_missing_state_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/properties
        distinguishing_aspect: "state_code is a required input with no default; omitting it returns HTTP 400 ERR_INVALID_REQUEST and persists no Property row (owned_property_count stays 0)."
        test_recipe:
          setup:
            - "Homeowner ${h1} exists and is ACTIVE; no Property row exists; the clock is 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "9 Birch Rd", city: "Somerville", postal_code: "02143", year_built: 1975 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_req} == ERR_INVALID_REQUEST"
            - "Homeowner.${h1}.owned_property_count == 0 and GET /homeowners/${h1}/properties returns total_count == 0 — the rejected write persisted nothing"

      - name: create_irrigation_window_with_inverted_bounds_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - entities.IrrigationWindow.fields.start_at
          - entities.IrrigationWindow.fields.end_at
          - endpoints.POST_/properties/{property_id}/irrigation-windows
        distinguishing_aspect: "Priority-4 body validation rejects an interval whose bounds are equal or inverted: start_at == end_at and start_at > end_at both return HTTP 400 ERR_INVALID_REQUEST before any priority-31 overlap check runs."
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property was install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "No IrrigationWindow row exists on Property ${p1} yet, so no overlap check can mask the body validation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:20:00Z", static_pressure_psi: 62.0, flow_gpm: 6.0, duration_minutes: 4, total_gallons: 24.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:40:00Z", static_pressure_psi: 58.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
          trigger:
            - call: "POST /properties/${p1}/irrigation-windows"
              payload: { label: "Zero-length zone", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T09:00:00Z", expected_max_flow_gpm: 9.0 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { err_zero: $.data.error_id }
            - call: "POST /properties/${p1}/irrigation-windows"
              payload: { label: "Inverted zone", start_at: "2026-08-05T11:00:00Z", end_at: "2026-08-05T09:00:00Z", expected_max_flow_gpm: 9.0 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { err_inv: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_zero} == ERR_INVALID_REQUEST for the equal-bounds body"
            - "HTTP 400 with ${err_inv} == ERR_INVALID_REQUEST for the inverted-bounds body"
            - "GET /properties/${p1}/irrigation-windows returns total_count == 0 — neither rejected body created a row"

      - name: create_emergency_contact_verification_state_is_system_assigned
        claim_type: System Fields
        grounds:
          - entities.EmergencyContact.fields.verification_state
          - entities.EmergencyContact.fields.status
          - entities.EmergencyContact.fields.last_notified_at
          - endpoints.POST_/homeowners/{homeowner_id}/emergency-contacts
        distinguishing_aspect: "verification_state is system-sourced with default PENDING and is set to VERIFIED only by the verify_immediately input flag; status is always ACTIVE at create and last_notified_at is always null, whatever the client sends."
        test_recipe:
          setup:
            - "Homeowner ${h1} exists and is ACTIVE; no EmergencyContact row exists; the clock is 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /homeowners/${h1}/emergency-contacts"
              payload: { full_name: "Cal Reyes", phone_e164: "+14155550303", priority_rank: 1, verify_immediately: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { ec1: $.data.id }
            - call: "POST /homeowners/${h1}/emergency-contacts"
              payload: { full_name: "Dee Nunez", phone_e164: "+14155550404", priority_rank: 2 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { ec2: $.data.id }
          assert:
            - "EmergencyContact.${ec1}.verification_state == VERIFIED, status == ACTIVE, last_notified_at == null, priority_rank == 1"
            - "EmergencyContact.${ec2}.verification_state == PENDING (the declared default when verify_immediately is omitted), status == ACTIVE, last_notified_at == null"
            - "GET /homeowners/${h1}/emergency-contacts with status ACTIVE returns total_count == 2"

      - name: telemetry_reading_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.TelemetryReading.fields.classification_at_ingest
          - entities.TelemetryReading.fields.baseline_eligible
          - endpoints.POST_/devices/{device_id}/telemetry
          - endpoints.GET_/devices/{device_id}/telemetry
        distinguishing_aspect: "TelemetryReading is declared common_fields false: rows carry no version and no updated_at, §1.5 exposes no update or delete endpoint for them, and a later ingest never rewrites an earlier row's classification_at_ingest."
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property was install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "The three learning readings are the only TelemetryReading rows and all three carry classification_at_ingest NONE with baseline_eligible true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:20:00Z", static_pressure_psi: 62.0, flow_gpm: 6.0, duration_minutes: 4, total_gallons: 24.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:40:00Z", static_pressure_psi: 58.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
          trigger:
            - call: "GET /devices/${d1}/telemetry"
              payload: { limit: 10, offset: 0 }
              as: DeviceGateway
              as_user_id: "gw-01"
          assert:
            - "HTTP 200 with total_count == 3 and every element exposing device_id, reading_at, classification_at_ingest, baseline_eligible, coverage_minutes and created_at"
            - "No element exposes a version field and none exposes updated_at — the entity is declared common_fields false"
            - "$.data[0].coverage_minutes == 120 (COVERAGE_MINUTES_PER_READING) and $.data[0].baseline_eligible == true"
            - "§1.5 declares no PATCH, PUT or DELETE route under /devices/{id}/telemetry, so a stored reading can never be amended"

      - name: create_device_with_unknown_property_id_returns_property_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - endpoints.POST_/devices
        distinguishing_aspect: "Device requires a resolvable parent Property: a body-level property_id that matches no row returns HTTP 404 ERR_PROPERTY_NOT_FOUND at priority 5, distinct from the priority-3 path-id existence check."
        test_recipe:
          setup:
            - "Homeowner ${h1} exists; no Property row has been created; the clock is 2026-08-01T06:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { property_id: "00000000-0000-4000-8000-0000000000ff", serial_number: "FLO-000009", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { err_pnf: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_pnf} == ERR_PROPERTY_NOT_FOUND"
            - "No Device row was created: a subsequent POST /devices with serial_number FLO-000009 against a real property succeeds rather than returning ERR_DEVICE_SERIAL_TAKEN"

      - name: claim_referencing_event_from_another_property_returns_no_qualifying_event
        claim_type: flat
        grounds:
          - validations[priority=37]
          - errors[ERR_NO_QUALIFYING_EVENT]
          - entities.ReimbursementClaim.fields.anomaly_event_id
          - endpoints.POST_/claims
