      - name: posting_depends_on_premises_cup_state
        grounds:
          - validations[priority=42]
          - state_machines.TransferApplication.UNDER_REVIEW_to_POSTED
          - endpoints[POST /premises/{premises_id}/zoning-verification]
          - calculations.premises_suitability_evaluation
        distinguishing_aspect: |
          Entity pair TransferApplication <- Premises: the UNDER_REVIEW -> POSTED transition is refused
          while the premises' conditional_use_permit_status is REQUIRED_NOT_FILED and becomes legal the
          moment a zoning verification moves that other row to GRANTED, with no change to the application.
        test_recipe:
          setup:
            - "Full happy path to an EXECUTED agreement, except that the premises is never zoning-verified, so it stays (CONDITIONAL, CUP_OUTSTANDING) with conditional_use_permit_status REQUIRED_NOT_FILED."
            - "Landlord consent is GRANTED and the buyer is pre-qualified in PRE_CHECK mode (score 100), so nothing but the CUP is outstanding."
            - "A SUBMITTED TransferApplication exists on the agreement; clock at its 2026-08-01T00:00:00Z default."
