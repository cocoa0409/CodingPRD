# =============================================================================
# Task 1109 — Dairy Processing Plant & Milk Intake (Grade A fluid milk plant)
# =============================================================================

scenario: |
  1109. Dairy Processing Plant & Milk Intake (Grade A fluid milk plant): raw milk
  receipt testing (antibiotic/somatic cell) & rejection, component (fat/protein)
  pricing & producer payment, pasteurizer run & CIP validation, product scheduling
  across milk/cream/byproduct, shelf-life coding & distribution routing, Grade A
  permit & inspection, milk marketing order pooling calculation, over-order
  premium & hauling deduction.

domain_name: dairy-plant-milk-intake
api_prefix: /dairy

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: producer_code, type: string, source: input, description: "FMMO-issued unique producer code" }
      - { name: farm_name, type: string, source: input, description: "Display name of the dairy farm" }
      - { name: base_hauling_rate_cents_per_cwt, type: integer, source: input, description: "Base hauling charge in cents per hundredweight, deducted from producer settlement" }
      - { name: quality_flag, type: enum, source: system, default: "STANDARD", description: "STANDARD | PREMIUM | PROBATION — derived from rolling rejection rate; PROBATION at ≥2 rejections in trailing 30 days" }
      - { name: rolling_rejection_count_30d, type: integer, source: computed, default: 0, description: "Count of REJECTED TankerReceipts for this producer in trailing 30 calendar days, recomputed on every tanker transition to REJECTED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: Hauler
    parent: null
    common_fields: true
    fields:
      - { name: hauler_code, type: string, source: input, description: "Licensed bulk-milk hauler code" }
      - { name: company_name, type: string, source: input, description: "Hauling company name" }
      - { name: license_expires_at, type: datetime, source: input, description: "PMO hauler license expiry; receipts cannot be scheduled past this date" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: TankerReceipt
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; the shipping farm" }
      - { name: hauler_id, type: string, source: input, description: "FK -> Hauler.id; the delivering hauler" }
      - { name: arrived_at, type: datetime, source: input, description: "Timestamp the tanker arrived at the plant bay" }
      - { name: gross_weight_lbs, type: number, source: input, description: "Scale gross weight in pounds (tanker full)" }
      - { name: tare_weight_lbs, type: number, source: input, description: "Scale tare weight in pounds (tanker empty); must be < gross_weight_lbs" }
      - { name: net_weight_lbs, type: number, source: computed, description: "Read-only = gross_weight_lbs - tare_weight_lbs; the billable hundredweight base" }
      - { name: temperature_f, type: number, source: input, description: "Temperature of milk at receipt in degrees Fahrenheit" }
      - { name: antibiotic_result, type: enum, source: system, default: "PENDING", description: "PENDING | NEGATIVE | POSITIVE — set by LabTest completion" }
      - { name: scc_cells_per_ml, type: integer, source: system, description: "Somatic cell count result, populated by LabTest completion" }
      - { name: rejection_reason, type: enum, source: system, description: "Null unless rejected; ANTIBIOTIC_POSITIVE | SCC_EXCEEDED | TEMPERATURE_EXCEEDED | HAULER_LICENSE_EXPIRED" }
      - { name: disposition, type: enum, source: system, default: "QUARANTINE", description: "QUARANTINE | RELEASED_FOR_PROCESSING | REJECTED | DIVERTED" }
      - { name: expected_producer_version, type: integer, source: input, description: "OCC guard on Producer.version for the accept/reject decision; prevents stale lab decisions from racing disposition updates" }

  - name: LabTest
    parent: TankerReceipt
    common_fields: true
    fields:
      - { name: tanker_receipt_id, type: string, source: input, description: "FK -> TankerReceipt.id; the receipt under test" }
      - { name: test_type, type: enum, source: input, description: "ANTIBIOTIC | SCC | TEMPERATURE_RECHECK" }
      - { name: result_value, type: number, source: input, description: "Numeric result: SCC in cells/ml; antibiotic in ppb (0 = negative); temperature in degrees F" }
      - { name: result_disposition, type: enum, source: system, description: "PASS | FAIL — derived from test_type-specific threshold at completion" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp when result was recorded" }
      - { name: lab_technician_id, type: string, source: input, description: "Opaque user id of the LabTechnician who recorded the result" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → COMPLETED; terminal" }

  - name: ComponentAssay
    parent: TankerReceipt
    common_fields: true
    fields:
      - { name: tanker_receipt_id, type: string, source: input, description: "FK -> TankerReceipt.id" }
      - { name: butterfat_pct, type: number, source: input, description: "Butterfat percentage to 2 decimals" }
      - { name: protein_pct, type: number, source: input, description: "True protein percentage to 2 decimals" }
      - { name: other_solids_pct, type: number, source: input, description: "Other-solids percentage to 2 decimals" }
      - { name: butterfat_lbs, type: number, source: computed, description: "Read-only = net_weight_lbs × butterfat_pct / 100, rounded per §1.3 component_pounds_calc" }
      - { name: protein_lbs, type: number, source: computed, description: "Read-only = net_weight_lbs × protein_pct / 100" }
      - { name: other_solids_lbs, type: number, source: computed, description: "Read-only = net_weight_lbs × other_solids_pct / 100" }

  - name: ProducerSettlement
    parent: Producer
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id" }
      - { name: period_start_date, type: datetime, source: input, description: "First day of the monthly settlement period (UTC)" }
      - { name: period_end_date, type: datetime, source: input, description: "Last day of the monthly settlement period (UTC)" }
      - { name: gross_pool_credit_cents, type: integer, source: computed, description: "Read-only = producer's share of the MarketingOrderPool, provisional at DRAFT, final at FINALIZED" }
      - { name: over_order_premium_cents, type: integer, source: computed, description: "Read-only = negotiated over-order premium for the period, tiered by quality_flag" }
      - { name: hauling_deduction_cents, type: integer, source: computed, description: "Read-only = sum over delivered hundredweight × base_hauling_rate + per-stop surcharge, tiered" }
      - { name: net_payment_cents, type: integer, source: computed, description: "Read-only = gross_pool_credit_cents + over_order_premium_cents - hauling_deduction_cents" }
      - { name: pricing_variant, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | FINAL — toggled when the pool advances from DRAFT to FINALIZED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → APPROVED → PAID | CANCELLED" }

  - name: PasteurizerRun
    parent: null
    common_fields: true
    fields:
      - { name: pasteurizer_id, type: string, source: input, description: "Physical pasteurizer identifier (HTST-1, HTST-2)" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Scheduled start of the pasteurization run" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Scheduled end; must be strictly greater than scheduled_start_at" }
      - { name: actual_start_at, type: datetime, source: system, description: "Populated when the run transitions to RUNNING" }
      - { name: actual_end_at, type: datetime, source: system, description: "Populated when the run transitions to COMPLETE or ABORTED" }
      - { name: flow_rate_gph, type: integer, source: input, description: "Flow rate in gallons per hour" }
      - { name: min_hold_temp_f, type: number, source: input, description: "PMO minimum holding temperature, must be ≥ 161 for HTST" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED → RUNNING → COMPLETE | ABORTED; SCHEDULED → CANCELLED" }

  - name: CipCycle
    parent: PasteurizerRun
    common_fields: true
    fields:
      - { name: pasteurizer_run_id, type: string, source: input, description: "FK -> PasteurizerRun.id; the run this CIP follows" }
      - { name: started_at, type: datetime, source: input, description: "Actual CIP start" }
      - { name: completed_at, type: datetime, source: system, description: "Actual CIP completion, populated at VALIDATION" }
      - { name: caustic_conductivity_ms, type: number, source: input, description: "Final rinse caustic conductivity in mS/cm, must be ≥ 80.0 to validate" }
      - { name: rinse_ph, type: number, source: input, description: "Final rinse pH, must be in [6.5, 8.0] to validate" }
      - { name: validation_outcome, type: enum, source: system, description: "PASS | FAIL — derived at completion from thresholds" }
      - { name: status, type: enum, source: system, default: "IN_PROGRESS", description: "IN_PROGRESS → VALIDATED | FAILED" }

  - name: ProductBatch
    parent: PasteurizerRun
    common_fields: true
    fields:
      - { name: pasteurizer_run_id, type: string, source: input, description: "FK -> PasteurizerRun.id" }
      - { name: product_code, type: enum, source: input, description: "WHOLE_MILK | TWO_PERCENT | SKIM | HEAVY_CREAM | BUTTER | CONDENSED_SKIM" }
      - { name: quantity_gallons, type: integer, source: input, description: "Planned production in gallons" }
      - { name: shelf_life_days, type: integer, source: input, description: "Coded shelf life; must respect product-specific cap (fluid milk ≤ 21, cream ≤ 30, butter ≤ 180, condensed ≤ 270)" }
      - { name: code_date, type: datetime, source: computed, description: "Read-only = pasteurizer_run.actual_end_at + shelf_life_days calendar days; drives distribution routing" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED → IN_PRODUCTION → CODED | SCRAPPED" }

  - name: DistributionRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Internal route code" }
      - { name: destination_zip, type: string, source: input, description: "US destination ZIP" }
      - { name: transit_days, type: integer, source: input, description: "Calendar days from dock to destination" }
      - { name: min_days_of_code_required, type: integer, source: input, description: "Customer-mandated minimum days of code remaining at delivery" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: GradeAPermit
    parent: null
    common_fields: true
    fields:
      - { name: permit_number, type: string, source: input, description: "State-issued Grade A permit number" }
      - { name: issued_at, type: datetime, source: input, description: "Issue date" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry; plant cannot run pasteurizer past this date" }
      - { name: inspection_score, type: integer, source: system, description: "Most recent state inspection score 0-100, populated by record-inspection" }
      - { name: violation_count_12mo, type: integer, source: computed, default: 0, description: "Rolling count of inspection violations in trailing 12 months; ≥3 triggers suspension review" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE → UNDER_REVIEW → SUSPENDED | REINSTATED | REVOKED; UNDER_REVIEW is reachable only from ACTIVE" }

  - name: MarketingOrderPool
    parent: null
    common_fields: true
    fields:
      - { name: pool_month, type: string, source: input, description: "Pool month in YYYY-MM format" }
      - { name: announced_class_i_price_cents, type: integer, source: input, description: "FMMO announced Class I mover price, cents per cwt" }
      - { name: butterfat_price_cents_per_lb, type: integer, source: input, description: "Component price for butterfat" }
      - { name: protein_price_cents_per_lb, type: integer, source: input, description: "Component price for protein" }
      - { name: other_solids_price_cents_per_lb, type: integer, source: input, description: "Component price for other solids" }
      - { name: producer_price_differential_cents, type: integer, source: computed, description: "Read-only PPD = pool blend price minus component value, per §1.3 pool_blend_price_calc" }
      - { name: total_pooled_lbs, type: number, source: computed, description: "Read-only sum of net_weight_lbs over all RELEASED_FOR_PROCESSING receipts in the pool month" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → ANNOUNCED → FINALIZED; ANNOUNCED only after class prices published; FINALIZED locks component values" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TankerReceipt
    initial_state: QUARANTINE
    terminal_states: [REJECTED]
    transitions:
      - from: QUARANTINE
        to: RELEASED_FOR_PROCESSING
        trigger: POST /dairy/tanker-receipts/{id}/release
        actor: QualityAssuranceManager
        preconditions:
          - "All required LabTests (ANTIBIOTIC, SCC) for this receipt are COMPLETED (ERR_LAB_TESTS_PENDING)"
          - "antibiotic_result == NEGATIVE (ERR_ANTIBIOTIC_POSITIVE)"
          - "scc_cells_per_ml < 750000 (ERR_SCC_EXCEEDED)"
          - "temperature_f <= 45 (ERR_TEMPERATURE_EXCEEDED)"
          - "Linked Hauler.status == ACTIVE and license_expires_at > arrived_at (ERR_HAULER_LICENSE_EXPIRED)"
          - "Linked Producer.status == ACTIVE (ERR_PRODUCER_SUSPENDED)"
          - "Plant's most recent GradeAPermit.status == ACTIVE (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "Producer.rolling_rejection_count_30d recomputed (no change on this transition)"
          - "Each ComponentAssay for the receipt becomes eligible for settlement pooling"
          - "MarketingOrderPool.total_pooled_lbs for the receipt's calendar month is incremented by net_weight_lbs"

      - from: QUARANTINE
        to: REJECTED
        trigger: POST /dairy/tanker-receipts/{id}/reject
        actor: QualityAssuranceManager
        preconditions:
          - "At least one rejection criterion met (antibiotic POSITIVE, SCC ≥ 750000, temperature > 45, or hauler license expired) (ERR_NO_REJECTION_CRITERION)"
        side_effects:
          - "rejection_reason is set to the highest-priority matching criterion (ANTIBIOTIC_POSITIVE > SCC_EXCEEDED > TEMPERATURE_EXCEEDED > HAULER_LICENSE_EXPIRED)"
          - "Producer.rolling_rejection_count_30d incremented by 1"
          - "If Producer.rolling_rejection_count_30d >= 2, Producer.quality_flag transitions to PROBATION"
          - "If Producer.rolling_rejection_count_30d >= 4, Producer.status transitions to SUSPENDED"
          - "ComponentAssay records for this receipt become ineligible for pooling"

      - from: RELEASED_FOR_PROCESSING
        to: DIVERTED
        trigger: POST /dairy/tanker-receipts/{id}/divert
        actor: QualityAssuranceManager
        preconditions:
          - "No ProductBatch for the pool month has yet been CODED that consumed this receipt (ERR_BATCH_ALREADY_CODED)"
        side_effects:
          - "MarketingOrderPool.total_pooled_lbs decremented by net_weight_lbs"
          - "ProducerSettlement drafts for the pool month are recomputed to reflect reduced pool"

  - entity: LabTest
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: POST /dairy/tanker-receipts/{id}/lab-tests/{testId}/complete
        actor: LabTechnician
        preconditions:
          - "Parent TankerReceipt.disposition == QUARANTINE (ERR_RECEIPT_NOT_IN_QUARANTINE)"
          - "lab_technician_id != X-User-ID of the QualityAssuranceManager who created the parent TankerReceipt (segregation of duties) (ERR_SOD_VIOLATION)"
        side_effects:
          - "completed_at set to current logical clock"
          - "result_disposition derived: ANTIBIOTIC PASS iff result_value == 0; SCC PASS iff result_value < 750000; TEMPERATURE_RECHECK PASS iff result_value <= 45"
          - "On parent TankerReceipt: antibiotic_result updated when test_type == ANTIBIOTIC; scc_cells_per_ml when test_type == SCC; temperature_f overwritten when test_type == TEMPERATURE_RECHECK"
          - "If result_disposition == FAIL, parent TankerReceipt remains in QUARANTINE awaiting QA decision"

  - entity: ProducerSettlement
    initial_state: DRAFT
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: POST /dairy/producers/{producerId}/settlements/{id}/approve
        actor: PlantController
        preconditions:
          - "MarketingOrderPool.status == FINALIZED for the settlement's pool month (ERR_POOL_NOT_FINALIZED)"
          - "pricing_variant == FINAL (set when pool finalized)"
        side_effects:
          - "gross_pool_credit_cents, over_order_premium_cents, hauling_deduction_cents, net_payment_cents recomputed under FINAL variant"

      - from: APPROVED
        to: PAID
        trigger: POST /dairy/producers/{producerId}/settlements/{id}/mark-paid
        actor: PlantController
        preconditions:
          - "net_payment_cents >= 0 (ERR_NEGATIVE_SETTLEMENT)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST /dairy/producers/{producerId}/settlements/{id}/cancel
        actor: PlantController
        preconditions: []
        side_effects: []

  - entity: MarketingOrderPool
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: POST /dairy/marketing-order-pools/{id}/announce
        actor: PlantController
        preconditions:
          - "All component prices > 0 (ERR_PRICES_INCOMPLETE)"
          - "Current logical clock >= 23rd of the following month at 00:00 UTC (FMMO announcement date) (ERR_ANNOUNCEMENT_TOO_EARLY)"
        side_effects:
          - "producer_price_differential_cents computed per §1.3 pool_blend_price_calc"

      - from: ANNOUNCED
        to: FINALIZED
        trigger: POST /dairy/marketing-order-pools/{id}/finalize
        actor: PlantController
        preconditions:
          - "All ProducerSettlements for this pool month are in DRAFT with pricing_variant == PROVISIONAL (ERR_SETTLEMENTS_ALREADY_APPROVED)"
        side_effects:
          - "For each ProducerSettlement of the pool month: pricing_variant transitions PROVISIONAL → FINAL; gross_pool_credit_cents recomputed under FINAL variant"

  - entity: PasteurizerRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, ABORTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: POST /dairy/pasteurizer-runs/{id}/start
        actor: PasteurizerOperator
        preconditions:
          - "Most recent GradeAPermit.status == ACTIVE and expires_at > scheduled_end_at (ERR_PERMIT_NOT_ACTIVE)"
          - "Most recent completed CipCycle for the same pasteurizer_id has validation_outcome == PASS and completed_at within trailing 24 hours (ERR_CIP_STALE)"
          - "No other PasteurizerRun for the same pasteurizer_id in RUNNING state with overlapping [scheduled_start_at, scheduled_end_at) (ERR_PASTEURIZER_OVERLAP)"
        side_effects:
          - "actual_start_at set to current logical clock"

      - from: RUNNING
        to: COMPLETE
        trigger: POST /dairy/pasteurizer-runs/{id}/complete
        actor: PasteurizerOperator
        preconditions:
          - "All ProductBatches for this run are in CODED or SCRAPPED state (ERR_BATCHES_UNFINISHED)"
        side_effects:
          - "actual_end_at set to current logical clock"
          - "For each CODED ProductBatch: code_date recomputed = actual_end_at + shelf_life_days days"

      - from: RUNNING
        to: ABORTED
        trigger: POST /dairy/pasteurizer-runs/{id}/abort
        actor: PasteurizerOperator
        preconditions: []
        side_effects:
          - "actual_end_at set to current logical clock"
          - "All non-terminal ProductBatches for this run transition to SCRAPPED"
          - "All ComponentAssay records linked to receipts consumed by this run become ineligible for pooling"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /dairy/pasteurizer-runs/{id}/cancel
        actor: PasteurizerOperator
        preconditions:
          - "No ProductBatch in IN_PRODUCTION state for this run (ERR_BATCH_IN_PRODUCTION)"
        side_effects:
          - "All SCHEDULED ProductBatches for this run transition to SCRAPPED"

  - entity: CipCycle
    initial_state: IN_PROGRESS
    terminal_states: [VALIDATED, FAILED]
    transitions:
      - from: IN_PROGRESS
        to: VALIDATED
        trigger: POST /dairy/pasteurizer-runs/{runId}/cip-cycles/{id}/validate
        actor: QualityAssuranceManager
        preconditions:
          - "caustic_conductivity_ms >= 80.0 (ERR_CIP_CAUSTIC_LOW)"
          - "rinse_ph in [6.5, 8.0] (ERR_CIP_PH_OUT_OF_RANGE)"
          - "lab_technician_id of the CipCycle creator != X-User-ID of this validator (segregation of duties) (ERR_SOD_VIOLATION)"
        side_effects:
          - "validation_outcome = PASS"
          - "completed_at set to current logical clock"

      - from: IN_PROGRESS
        to: FAILED
        trigger: POST /dairy/pasteurizer-runs/{runId}/cip-cycles/{id}/fail
        actor: QualityAssuranceManager
        preconditions: []
        side_effects:
          - "validation_outcome = FAIL"
          - "completed_at set to current logical clock"
          - "Parent PasteurizerRun cannot transition to RUNNING until a subsequent VALIDATED CipCycle exists"

  - entity: ProductBatch
    initial_state: SCHEDULED
    terminal_states: [CODED, SCRAPPED]
    transitions:
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: POST /dairy/pasteurizer-runs/{runId}/batches/{id}/begin
        actor: PasteurizerOperator
        preconditions:
          - "Parent PasteurizerRun.status == RUNNING (ERR_RUN_NOT_RUNNING)"
        side_effects: []

      - from: IN_PRODUCTION
        to: CODED
        trigger: POST /dairy/pasteurizer-runs/{runId}/batches/{id}/code
        actor: PasteurizerOperator
        preconditions:
          - "shelf_life_days respects product-specific cap (ERR_SHELF_LIFE_EXCEEDED)"
          - "For each DistributionRoute the batch will ship on: code_date - current logical clock >= transit_days + min_days_of_code_required (ERR_INSUFFICIENT_CODE_LIFE)"
        side_effects:
          - "code_date computed = pasteurizer_run.actual_end_at (or current clock if still RUNNING) + shelf_life_days"

      - from: IN_PRODUCTION
        to: SCRAPPED
        trigger: POST /dairy/pasteurizer-runs/{runId}/batches/{id}/scrap
        actor: PasteurizerOperator
        preconditions: []
        side_effects: []

  - entity: GradeAPermit
    initial_state: ACTIVE
    terminal_states: [SUSPENDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: POST /dairy/grade-a-permits/{id}/record-inspection
        actor: StateInspector
        preconditions:
          - "inspection_score < 90 OR violation delta pushes violation_count_12mo >= 3 (ERR_INSPECTION_PASSED)"
        side_effects:
          - "violation_count_12mo incremented by violations found"
          - "inspection_score updated"

      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: POST /dairy/grade-a-permits/{id}/suspend
        actor: StateInspector
        preconditions:
          - "violation_count_12mo >= 3 (ERR_INSUFFICIENT_VIOLATIONS)"
        side_effects:
          - "All PasteurizerRuns in SCHEDULED state transition to CANCELLED"
          - "ProducerSettlement approvals blocked until REINSTATED"

      - from: UNDER_REVIEW
        to: REINSTATED
        trigger: POST /dairy/grade-a-permits/{id}/reinstate
        actor: StateInspector
        preconditions:
          - "violation_count_12mo < 3 after corrective action (ERR_VIOLATIONS_OUTSTANDING)"
        side_effects: []

      - from: UNDER_REVIEW
        to: REVOKED
        trigger: POST /dairy/grade-a-permits/{id}/revoke
        actor: StateInspector
        preconditions:
          - "violation_count_12mo >= 5 (ERR_VIOLATIONS_BELOW_REVOCATION)"
        side_effects:
          - "All future TankerReceipts blocked; in-QUARANTINE receipts diverted"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: tanker-disposition-stale-producer
    parent_entity: Producer
    write_endpoint: "POST /dairy/tanker-receipts/{id}/release"
    occ_field: "expected_producer_version"
    description: |
      Releasing a TankerReceipt against a Producer whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has just transitioned the Producer (e.g., a rejection
      cascaded Producer.quality_flag to PROBATION or status to SUSPENDED) and
      the current writer's view of producer state is therefore stale.
    error_id: ERR_STALE_PRODUCER_VERSION
    http_status: 412

  - rule_id: pool-finalize-stale-pool
    parent_entity: MarketingOrderPool
    write_endpoint: "POST /dairy/marketing-order-pools/{id}/finalize"
    occ_field: "expected_pool_version"
    description: |
      Finalizing a MarketingOrderPool whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just announced the pool (which legitimately bumps version) and
      the current writer's view of the pool is stale.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: component_pounds_calc
    trigger: "on ComponentAssay creation and on update of any component percentage"
    algorithm: aggregation
    formula: |
      butterfat_lbs   = round_half_up(net_weight_lbs * butterfat_pct   / 100, 2)
      protein_lbs     = round_half_up(net_weight_lbs * protein_pct     / 100, 2)
      other_solids_lbs= round_half_up(net_weight_lbs * other_solids_pct/ 100, 2)
      # rounding is applied PER COMPONENT, then summed downstream — never the
      # reverse. This order is load-bearing for the pooling calculation.
    input_set: "ComponentAssay records whose parent TankerReceipt.disposition == RELEASED_FOR_PROCESSING at the time of pooling"
    constants:
      DECIMALS: 2
    precision: "2 decimal places, round_half_up, per-component then summed"

  - name: producer_provisional_settlement_calc
    trigger: "on ProducerSettlement DRAFT creation, and again on any TankerReceipt for the period transitioning to RELEASED_FOR_PROCESSING or DIVERTED"
    algorithm: tiered_pricing
    formula: |
      # Provisional variant — uses announced prices only, ignores PPD (not yet announced)
      component_value_cents =
          sum over receipts in period with disposition == RELEASED_FOR_PROCESSING of (
            butterfat_lbs * butterfat_price_cents_per_lb
          + protein_lbs   * protein_price_cents_per_lb
          + other_solids_lbs * other_solids_price_cents_per_lb )
      over_order_premium_cents =
          total_cwt * OVER_ORDER_TIER_CENTS[Producer.quality_flag]
          where OVER_ORDER_TIER_CENTS = { STANDARD: 150, PREMIUM: 250, PROBATION: 0 }
      hauling_deduction_cents =
          if total_cwt <= TIER1_CWT then total_cwt * base_hauling_rate_cents_per_cwt
          else TIER1_CWT * base_hauling_rate_cents_per_cwt
             + (total_cwt - TIER1_CWT) * (base_hauling_rate_cents_per_cwt * TIER2_DISCOUNT_PCT / 100)
      net_payment_cents = component_value_cents + over_order_premium_cents - hauling_deduction_cents
    input_set: "TankerReceipts for this Producer with period overlap, disposition == RELEASED_FOR_PROCESSING"
    constants:
      TIER1_CWT: 1000
      TIER2_DISCOUNT_PCT: 80
      OVER_ORDER_TIER_CENTS: { STANDARD: 150, PREMIUM: 250, PROBATION: 0 }
    precision: "0 decimal places (integer cents), round_half_up at the end"
    variants:
      - name: PROVISIONAL
        when: "Pool in DRAFT or ANNOUNCED — PPD not yet finalized"
        difference: "Uses announced component prices only; no PPD adjustment"
      - name: FINAL
        when: "Pool in FINALIZED — PPD announced"
        difference: "Adds producer_price_differential_cents × pooled_cwt to gross_pool_credit_cents; recomputes hauling with FINAL flag which flips TIER2_DISCOUNT_PCT from 80 to 75"

  - name: pool_blend_price_calc
    trigger: "on MarketingOrderPool DRAFT → ANNOUNCED transition"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking dependency: PPD depends on utilization, utilization depends on PPD tier.
      # PINNED EVALUATION ORDER:
      #   step 1: compute utilization_pct from raw class volumes (no PPD)
      #   step 2: pick blend price from utilization tier table
      #   step 3: compute component_value_cents for the whole pool
      #   step 4: PPD = blend_price - component_value_cents/total_pooled_lbs
      utilization_pct = class_i_lbs / total_pooled_lbs * 100
      blend_price_cents_per_cwt =
          if utilization_pct >= 60 then CLASS_TIER_HIGH
          elif utilization_pct >= 40 then CLASS_TIER_MID
          else CLASS_TIER_LOW
      producer_price_differential_cents = blend_price_cents_per_cwt
          - floor(component_value_cents * 100 / total_pooled_lbs)
    input_set: "All TankerReceipts in the pool month with disposition == RELEASED_FOR_PROCESSING"
    constants:
      CLASS_TIER_HIGH: 2400
      CLASS_TIER_MID: 2100
      CLASS_TIER_LOW: 1800
    precision: "0 decimal places (integer cents per cwt), floor division for PPD"

  - name: shelf_life_coding_calc
    trigger: "on ProductBatch IN_PRODUCTION → CODED transition"
    algorithm: threshold
    formula: |
      code_date = run.actual_end_at + shelf_life_days calendar days
      days_of_code_at_delivery = (code_date - route_departure_date).days - route.transit_days
      eligible iff days_of_code_at_delivery >= route.min_days_of_code_required
    input_set: "ProductBatch × DistributionRoute pairs under consideration"
    constants:
      MAX_SHELF_LIFE: { WHOLE_MILK: 21, TWO_PERCENT: 21, SKIM: 21, HEAVY_CREAM: 30, BUTTER: 180, CONDENSED_SKIM: 270 }
    precision: "whole days; comparison uses >="

  - name: producer_quality_flag_calc
    trigger: "on every TankerReceipt transition into REJECTED"
    algorithm: threshold
    formula: |
      rolling_rejection_count_30d = count of REJECTED receipts for this producer
        where rejected_at >= (current_logical_clock - 30 days)
      if rolling_rejection_count_30d >= 4 then Producer.status = SUSPENDED
      elif rolling_rejection_count_30d >= 2 then Producer.quality_flag = PROBATION
      elif rolling_rejection_count_30d >= 1 then Producer.quality_flag = STANDARD
      else Producer.quality_flag = PREMIUM
    input_set: "REJECTED TankerReceipts for the producer in the trailing 30-day window [clock-30d, clock], inclusive of both endpoints"
    constants:
      PROBATION_THRESHOLD: 2
      SUSPEND_THRESHOLD: 4
      PREMIUM_THRESHOLD: 0
    precision: "integer count; thresholds use >="

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_MISSING_AUTH, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                  check: "Role permitted for this endpoint per §1.7", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,             check: "Path-template ids resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4,  category: state,                 check: "Target resource in correct state for this operation per §1.2", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 5,  category: business_safety,       check: "TankerReceipt release: antibiotic_result == NEGATIVE", error_id: ERR_ANTIBIOTIC_POSITIVE, http_status: 422, applies_to: "POST /dairy/tanker-receipts/{id}/release" }
  - { priority: 6,  category: business_safety,       check: "TankerReceipt release: scc_cells_per_ml < 750000", error_id: ERR_SCC_EXCEEDED, http_status: 422, applies_to: "POST /dairy/tanker-receipts/{id}/release" }
  - { priority: 7,  category: business_safety,       check: "TankerReceipt release: temperature_f <= 45", error_id: ERR_TEMPERATURE_EXCEEDED, http_status: 422, applies_to: "POST /dairy/tanker-receipts/{id}/release" }
  - { priority: 8,  category: business_safety,       check: "TankerReceipt release: hauler license valid at arrived_at", error_id: ERR_HAULER_LICENSE_EXPIRED, http_status: 422, applies_to: "POST /dairy/tanker-receipts/{id}/release" }
  - { priority: 9,  category: business_safety,       check: "TankerReceipt release: producer status ACTIVE", error_id: ERR_PRODUCER_SUSPENDED, http_status: 422, applies_to: "POST /dairy/tanker-receipts/{id}/release" }
  - { priority: 10, category: business_safety,       check: "TankerReceipt release AND PasteurizerRun.start: plant Grade A permit status == ACTIVE and not expired", error_id: ERR_PERMIT_NOT_ACTIVE, http_status: 422, applies_to: "POST /dairy/tanker-receipts/{id}/release, POST /dairy/pasteurizer-runs/{id}/start" }
  - { priority: 11, category: business_constraint,   check: "PasteurizerRun.start: no overlapping RUNNING run on same pasteurizer_id in [scheduled_start_at, scheduled_end_at)", error_id: ERR_PASTEURIZER_OVERLAP, http_status: 409, applies_to: "POST /dairy/pasteurizer-runs/{id}/start" }
  - { priority: 12, category: business_constraint,   check: "PasteurizerRun.start: most recent VALIDATED CipCycle completed within trailing 24 hours", error_id: ERR_CIP_STALE, http_status: 422, applies_to: "POST /dairy/pasteurizer-runs/{id}/start" }
  - { priority: 13, category: business_constraint,   check: "ProductBatch.code: shelf_life_days <= MAX_SHELF_LIFE[product_code]", error_id: ERR_SHELF_LIFE_EXCEEDED, http_status: 422, applies_to: "POST /dairy/pasteurizer-runs/{runId}/batches/{id}/code" }
  - { priority: 14, category: business_constraint,   check: "ProductBatch.code: days_of_code_at_delivery >= min_days_of_code_required for every route", error_id: ERR_INSUFFICIENT_CODE_LIFE, http_status: 422, applies_to: "POST /dairy/pasteurizer-runs/{runId}/batches/{id}/code" }
  - { priority: 15, category: business_constraint,   check: "CipCycle.validate: caustic_conductivity_ms >= 80.0 AND rinse_ph in [6.5, 8.0]", error_id: ERR_CIP_VALIDATION_FAILED, http_status: 422, applies_to: "POST /dairy/pasteurizer-runs/{runId}/cip-cycles/{id}/validate" }
  - { priority: 16, category: business_referential,  check: "Segregation of duties: lab_technician completing LabTest != QA manager who created parent TankerReceipt; QA validating CipCycle != operator who created it", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /dairy/tanker-receipts/{id}/lab-tests/{testId}/complete, POST /dairy/pasteurizer-runs/{runId}/cip-cycles/{id}/validate" }
  - { priority: 17, category: business_temporal,     check: "MarketingOrderPool.announce: current logical clock >= 23rd of following month at 00:00 UTC", error_id: ERR_ANNOUNCEMENT_TOO_EARLY, http_status: 422, applies_to: "POST /dairy/marketing-order-pools/{id}/announce" }
  - { priority: 18, category: business_fiscal,       check: "ProducerSettlement.approve: pool FINALIZED; ProducerSettlement.mark-paid: net_payment_cents >= 0", error_id: ERR_POOL_NOT_FINALIZED, http_status: 422, applies_to: "POST /dairy/producers/{producerId}/settlements/{id}/approve" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Test-driving clock endpoint (mandatory per §1.5 default-clock rule)
  - method: POST
    path: /dairy/_clock/set_current_utc
    description: "Advance the server's logical clock. Startup default is 2026-05-01T00:00:00Z; never falls back to wall-clock."
    roles: [PlantController]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced to to_iso8601"]

  # Producer CRUD
  - method: POST
    path: /dairy/producers
    description: "Register a producer"
    roles: [PlantController]
    code: 201
    input: [producer_code, farm_name, base_hauling_rate_cents_per_cwt]
    output: Producer
    side_effects: ["increments Producer.version to 1 on creation"]

  - method: GET
    path: /dairy/producers
    description: "List producers (paginated)"
    roles: [PlantController, QualityAssuranceManager, StateInspector]
    code: 200
    input: ["limit?", "offset?", "quality_flag?", "status?"]
    output: Producer[]
    side_effects: []

  - method: GET
    path: /dairy/producers/{id}
    description: "Fetch a producer"
    roles: [PlantController, QualityAssuranceManager, StateInspector]
    code: 200
    input: []
    output: Producer
    side_effects: []

  # Hauler CRUD
  - method: POST
    path: /dairy/haulers
    description: "Register a hauler"
    roles: [PlantController]
    code: 201
    input: [hauler_code, company_name, license_expires_at]
    output: Hauler
    side_effects: []

  - method: GET
    path: /dairy/haulers/{id}
    description: "Fetch a hauler"
    roles: [PlantController, QualityAssuranceManager]
    code: 200
    input: []
    output: Hauler
    side_effects: []

  # Tanker receipts
  - method: POST
    path: /dairy/tanker-receipts
    description: "Record an inbound tanker receipt in QUARANTINE"
    roles: [QualityAssuranceManager]
    code: 201
    input: [producer_id, hauler_id, arrived_at, gross_weight_lbs, tare_weight_lbs, temperature_f]
    output: TankerReceipt
    side_effects: ["net_weight_lbs computed"]

  - method: GET
    path: /dairy/tanker-receipts
    description: "List tanker receipts (paginated)"
    roles: [QualityAssuranceManager, PlantController, StateInspector]
    code: 200
    input: ["limit?", "offset?", "producer_id?", "hauler_id?", "disposition?"]
    output: TankerReceipt[]
    side_effects: []

  - method: GET
    path: /dairy/tanker-receipts/{id}
    description: "Fetch a receipt"
    roles: [QualityAssuranceManager, PlantController, StateInspector, LabTechnician]
    code: 200
    input: []
    output: TankerReceipt
    side_effects: []

  - method: POST
    path: /dairy/tanker-receipts/{id}/release
    description: "Release a receipt from quarantine into processing"
    roles: [QualityAssuranceManager]
    code: 200
    input: [expected_producer_version]
    output: TankerReceipt
    side_effects:
      - "disposition QUARANTINE → RELEASED_FOR_PROCESSING"
      - "increments Producer.version by 1"
      - "increments TankerReceipt.version by 1"
      - "MarketingOrderPool.total_pooled_lbs incremented"

  - method: POST
    path: /dairy/tanker-receipts/{id}/reject
    description: "Reject a receipt with a reason"
    roles: [QualityAssuranceManager]
    code: 200
    input: []
    output: TankerReceipt
    side_effects:
      - "disposition QUARANTINE → REJECTED"
      - "Producer.rolling_rejection_count_30d incremented"
      - "Producer.quality_flag/status recomputed per producer_quality_flag_calc"

  - method: POST
    path: /dairy/tanker-receipts/{id}/divert
    description: "Divert a previously released receipt"
    roles: [QualityAssuranceManager]
    code: 200
    input: []
    output: TankerReceipt
    side_effects:
      - "disposition RELEASED_FOR_PROCESSING → DIVERTED"
      - "MarketingOrderPool.total_pooled_lbs decremented"

  # Lab tests (nested under receipt)
  - method: POST
    path: /dairy/tanker-receipts/{id}/lab-tests
    description: "Record a new lab test (DRAFT) against a receipt"
    roles: [LabTechnician]
    code: 201
    input: [test_type, result_value, lab_technician_id]
    output: LabTest
    side_effects: []

  - method: GET
    path: /dairy/tanker-receipts/{id}/lab-tests
    description: "List lab tests for a receipt"
    roles: [QualityAssuranceManager, LabTechnician, PlantController, StateInspector]
    code: 200
    input: []
    output: LabTest[]
    side_effects: []

  - method: POST
    path: /dairy/tanker-receipts/{id}/lab-tests/{testId}/complete
    description: "Complete a lab test, deriving pass/fail"
    roles: [LabTechnician]
    code: 200
    input: []
    output: LabTest
    side_effects:
      - "result_disposition computed"
      - "completed_at stamped"
      - "parent TankerReceipt.antibiotic_result / scc_cells_per_ml / temperature_f updated per test_type"

  # Component assays
  - method: POST
    path: /dairy/tanker-receipts/{id}/component-assays
    description: "Record a component assay against a released receipt"
    roles: [LabTechnician]
    code: 201
    input: [butterfat_pct, protein_pct, other_solids_pct]
    output: ComponentAssay
    side_effects: ["butterfat_lbs, protein_lbs, other_solids_lbs computed"]

  - method: GET
    path: /dairy/tanker-receipts/{id}/component-assays
    description: "List assays for a receipt"
    roles: [LabTechnician, PlantController, QualityAssuranceManager]
    code: 200
    input: []
    output: ComponentAssay[]
    side_effects: []

  # Settlements
  - method: POST
    path: /dairy/producers/{producerId}/settlements
    description: "Create a draft monthly settlement (PROVISIONAL variant)"
    roles: [PlantController]
    code: 201
    input: [period_start_date, period_end_date]
    output: ProducerSettlement
    side_effects: ["gross_pool_credit_cents, over_order_premium_cents, hauling_deduction_cents, net_payment_cents computed under PROVISIONAL variant"]

  - method: GET
    path: /dairy/producers/{id}/settlements
    description: "List settlements for a producer"
    roles: [PlantController, StateInspector]
    code: 200
    input: ["producer_id?"]
    output: ProducerSettlement[]
    side_effects: []

  - method: GET
    path: /dairy/producers/{producerId}/settlements/{id}
    description: "Fetch a settlement"
    roles: [PlantController, StateInspector]
    code: 200
    input: []
    output: ProducerSettlement
    side_effects: []

  - method: POST
    path: /dairy/producers/{producerId}/settlements/{id}/approve
    description: "Approve a settlement (requires pool FINALIZED)"
    roles: [PlantController]
    code: 200
    input: []
    output: ProducerSettlement
    side_effects: ["status DRAFT → APPROVED; recomputed under FINAL variant"]

  - method: POST
    path: /dairy/producers/{producerId}/settlements/{id}/mark-paid
    description: "Mark an approved settlement paid"
    roles: [PlantController]
    code: 200
    input: []
    output: ProducerSettlement
    side_effects: ["status APPROVED → PAID"]

  - method: POST
    path: /dairy/producers/{producerId}/settlements/{id}/cancel
    description: "Cancel a draft settlement"
    roles: [PlantController]
    code: 200
    input: []
    output: ProducerSettlement
    side_effects: ["status DRAFT → CANCELLED"]

  # Pasteurizer runs
  - method: POST
    path: /dairy/pasteurizer-runs
    description: "Schedule a pasteurizer run"
    roles: [PasteurizerOperator]
    code: 201
    input: [pasteurizer_id, scheduled_start_at, scheduled_end_at, flow_rate_gph, min_hold_temp_f]
    output: PasteurizerRun
    side_effects: []

  - method: GET
    path: /dairy/pasteurizer-runs
    description: "List runs"
    roles: [PasteurizerOperator, PlantController, QualityAssuranceManager]
    code: 200
    input: ["limit?", "offset?", "pasteurizer_id?", "status?"]
    output: PasteurizerRun[]
    side_effects: []

  - method: GET
    path: /dairy/pasteurizer-runs/{id}
    description: "Fetch a run"
    roles: [PasteurizerOperator, PlantController, QualityAssuranceManager]
    code: 200
    input: []
    output: PasteurizerRun
    side_effects: []

  - method: POST
    path: /dairy/pasteurizer-runs/{id}/start
    description: "Start a run"
    roles: [PasteurizerOperator]
    code: 200
    input: []
    output: PasteurizerRun
    side_effects: ["status SCHEDULED → RUNNING; actual_start_at stamped"]

  - method: POST
    path: /dairy/pasteurizer-runs/{id}/complete
    description: "Complete a run"
    roles: [PasteurizerOperator]
    code: 200
    input: []
    output: PasteurizerRun
    side_effects: ["status RUNNING → COMPLETE; actual_end_at stamped; code_date recomputed for CODED batches"]

  - method: POST
    path: /dairy/pasteurizer-runs/{id}/abort
    description: "Abort a run (cascades SCRAPPED to batches)"
    roles: [PasteurizerOperator]
    code: 200
    input: []
    output: PasteurizerRun
    side_effects: ["status RUNNING → ABORTED; batches SCRAPPED; assays ineligible"]

  - method: POST
    path: /dairy/pasteurizer-runs/{id}/cancel
    description: "Cancel a scheduled run"
    roles: [PasteurizerOperator]
    code: 200
    input: []
    output: PasteurizerRun
