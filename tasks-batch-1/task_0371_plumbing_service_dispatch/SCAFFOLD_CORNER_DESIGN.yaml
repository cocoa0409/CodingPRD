  - section: consistency_model
    instances:

      - name: immediate_consistency_committed_credit_visible_in_same_flow
        claim_type: immediate
        grounds: [entities.Customer.fields.committed_credit_cents, state_machines.Estimate.PRESENTED_to_APPROVED]
        distinguishing_aspect: "After approving an estimate, an immediately following GET /customers/{id} shows the updated committed_credit_cents in the same request flow (immediate consistency, no lag)."
        test_recipe:
          setup: ["A PRESENTED estimate worth 20000 on Customer's ON_SITE job."]
          setup_api_calls:
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "IM-1", category: "DRAIN", base_price_cents: 20000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust IM", service_address: "27 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech IM", skill_level: 2 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "DRAIN" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /plumbing/customers/${cust_id}"
              payload: {}
              as: OfficeManager
              captures: { committed: $.data.committed_credit_cents }
          assert:
            - "Customer.${cust_id}.committed_credit_cents == 20000"
