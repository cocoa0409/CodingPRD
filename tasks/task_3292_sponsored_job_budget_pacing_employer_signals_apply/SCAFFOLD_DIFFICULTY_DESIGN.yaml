  # ===========================================================================
  # Rule 6 — boundary_precision_check (>= 2 instances, different metrics+endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: posting_freshness_day_boundaries_at_30_and_60
        grounds:
          - calculations.posting_freshness
          - entities.JobPosting.fields.current_freshness
          - entities.JobPosting.fields.state
          - endpoints.GET_/api/job-postings/{id}
        distinguishing_aspect: "The age-in-days metric flips on inclusive boundaries: at exactly 29 days a posting is FRESH, at exactly 30 days it is STALE, and at exactly 60 days it is EXPIRED — a naive `>` comparison on either threshold would leave 30-day and 60-day postings in the wrong bucket."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE employer; one posting ingested so its newest version has ingested_at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "BoundaryCo", domain: "bnd.example", ats_provider: "WORKDAY" }
              as: PlatformAdmin
              captures: { emp_bd: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_bd}", title: "Boundary Engineer", location: "Boise, ID", description_text: "Boundary posting.", apply_mode: "HOSTED", external_posting_id: "BND-1" }
              as: Employer
              as_user_id: "${emp_bd}"
              captures: { post_bd: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/job-postings/${post_bd}"
              payload: {}
              as: PlatformAdmin
              captures: { fresh_29: $.data.current_freshness }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/job-postings/${post_bd}"
              payload: {}
              as: PlatformAdmin
              captures: { fresh_30: $.data.current_freshness }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/job-postings/${post_bd}"
              payload: {}
              as: PlatformAdmin
              captures: { fresh_60: $.data.current_freshness }
          assert:
            - "at 29 days, ${fresh_29} == \"FRESH\""
            - "at exactly 30 days, ${fresh_30} == \"STALE\" (the boundary is inclusive)"
            - "at exactly 60 days, ${fresh_60} == \"EXPIRED\" (the boundary is inclusive)"
            - "GET /api/job-postings/${post_bd} reports state EXPIRED at the 60-day instant"

      - name: pacing_warmup_fraction_boundary_at_five_percent
        grounds:
          - calculations.campaign_pacing_multiplier
          - entities.SponsoredJob.fields.scheduled_pacing_multiplier
          - endpoints.GET_/api/sponsored-jobs/{id}
        distinguishing_aspect: "The elapsed-fraction metric flips on an inclusive 0.05 boundary: at 01:11:54Z (fraction 0.04993) the warm-up rule pins the multiplier to 1.0, while at 01:12Z (fraction exactly 0.05) the multiplier is 1.05 — one second of clock moves the value off the warm-up floor."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE CPC campaign with daily_budget_cents 100000 and total_budget_cents 1000000; one ACTIVE posting and one sponsored job; no spend."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "WarpCo", domain: "warp.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_wp: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_wp}", title: "Warmup Engineer", location: "Austin, TX", description_text: "Warm up the pacer.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_wp}"
              captures: { post_wp: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_wp}", name: "WP", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_wp}"
              captures: { camp_wp: $.data.id }
            - call: "POST /api/campaigns/${camp_wp}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_wp}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_wp}", job_posting_id: "${post_wp}", cpc_bid_cents: 200, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_wp}"
              captures: { sj_wp: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:11:54Z" }
              as: PlatformAdmin
            - call: "GET /api/sponsored-jobs/${sj_wp}"
              payload: {}
              as: Employer
              as_user_id: "${emp_wp}"
              captures: { sched_below: $.data.scheduled_pacing_multiplier }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:12:00Z" }
              as: PlatformAdmin
            - call: "GET /api/sponsored-jobs/${sj_wp}"
              payload: {}
              as: Employer
              as_user_id: "${emp_wp}"
              captures: { sched_at: $.data.scheduled_pacing_multiplier }
          assert:
            - "at 01:11:54Z the elapsed fraction is 4314/86400 = 0.04993 < 0.05, so ${sched_below} == 1.0"
            - "at 01:12:00Z the elapsed fraction is exactly 4320/86400 = 0.05, so ${sched_at} == 1.05"
            - "the two multipliers differ by 0.05 despite identical zero-spend data"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2 instances, different pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: sponsored_job_resume_requires_posting_active
        grounds:
          - state_machines.SponsoredJob.PAUSED_to_ELIGIBLE
          - state_machines.JobPosting.ACTIVE_to_EXPIRED
          - calculations.posting_freshness
          - errors[ERR_POSTING_NOT_ACTIVE]
        distinguishing_aspect: "The (SponsoredJob, JobPosting) pair: resuming a PAUSED sponsored job is gated on its posting being ACTIVE, so after the posting freshness decays to EXPIRED the resume is rejected with ERR_POSTING_NOT_ACTIVE even though the campaign is still ACTIVE."
