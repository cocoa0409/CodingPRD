            - call: "POST /cost-recovery-claims/${claim_id}/file"
              payload: { claimed_cents: 900000000 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /cost-recovery-claims/${claim_id}/resolve"
              payload: { action: "SETTLE", recovered_cents: 750000000, resolution_note: "Consent decree entered" }
              as: FinanceOfficer
          assert:
            - "HTTP status is 200"
            - "CostRecoveryClaim.${claim_id}.status == SETTLED"
            - "CostRecoveryClaim.${claim_id}.claim_basis_cents == 420000000"
            - "CostRecoveryClaim.${claim_id}.alloc_investigation_cents == 20000000"
            - "CostRecoveryClaim.${claim_id}.alloc_capital_cents == 680000000"
            - "CostRecoveryClaim.${claim_id}.alloc_om_reserve_cents == 7750000"
            - "CostRecoveryClaim.${claim_id}.alloc_rate_stabilization_cents == 42250000"
            - "The four buckets sum to exactly 750000000"
            - "CapitalProject.${proj_id}.recovered_cents == 680000000"
            - "CapitalProject.${proj_id}.local_share_cents == 0"
            - "CapitalProject.${proj_id}.borrowed_cents == 0"
            - "CapitalProject.${proj_id}.annual_debt_service_cents == 0"
            - "CapitalProject.${proj_id}.base_annual_requirement_cents == 31000000"
            - "CapitalProject.${proj_id}.provisional_rate_impact_pct == 3.02"
            - "CapitalProject.${proj_id}.surcharge_bp == 0"
            - "CapitalProject.${proj_id}.final_annual_requirement_cents == 31000000"
            - "CapitalProject.${proj_id}.rate_impact_pct == 3.02"
            - "CapitalProject.${proj_id}.uniform_monthly_increase_cents == 144"
            - "CapitalProject.${proj_id}.monthly_bill_increase_cents == 144"

      - name: compliance_and_planning_lraa_diverge_on_the_same_four_quarters
        claim_type: variant_divergence
        grounds:
          - calculations.locational_running_annual_average.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / lraa_compliance_and_planning_variants_diverge_on_two_censored_quarters
          rationale: "Both variants, their delta and the fact that only the compliance variant reaches the MCL comparison are asserted there."

      - name: hazard_index_rounds_only_the_final_sum
        claim_type: weighted_scoring_accumulation
        grounds:
          - calculations.hazard_index.combination_mode
        excluded_because:
          difficulty_instance: combinatorial_formula / hazard_index_sums_three_unrounded_ratios_before_one_final_rounding
          rationale: "The mode-(a) discriminator 1.01 versus 1.02 is the whole point of that instance."

      - name: technology_score_rounds_every_weighted_term
        claim_type: weighted_scoring_accumulation
        grounds:
          - calculations.technology_score.combination_mode
        excluded_because:
          difficulty_instance: combinatorial_formula / technology_score_rounds_each_weighted_term_before_summing_them
          rationale: "The mode-(b) discriminator 80.14 versus 80.13 and the five rounding points are asserted there."

      - name: the_rate_ladder_keeps_the_provisional_surcharge_tier
        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.rate_impact_analysis.combination_mode
        excluded_because:
          difficulty_instance: combinatorial_formula / rate_impact_ladder_keeps_the_provisional_surcharge_tier_after_a_capital_cost_patch
          rationale: "The pinned seven-step order, the 150 bp tier surviving a 15.12 final impact and both bill variants are asserted there."

      - name: bill_impact_variants_disagree_on_one_project
        claim_type: variant_divergence
        grounds:
          - calculations.rate_impact_analysis.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / bill_impact_uniform_and_volumetric_variants_diverge_on_one_capital_project
          rationale: "The 341 versus 340 divergence caused by the intermediate whole-cent rate is asserted there."

      - name: holding_time_is_inclusive_at_the_method_limit
        claim_type: precision
        grounds:
          - calculations.sample_integrity_evaluation
        excluded_because:
          difficulty_instance: boundary_precision_check / holding_time_of_exactly_336_hours_is_accepted_and_337_hours_is_refused
          rationale: "The inclusive 336 h boundary and its 337 h neighbour are asserted there as a pair."

  # ===========================================================================
  # Guide section 4 — Validations
  #
  # One instance per §1.4 rule that §1.8 does not already fire, plus the
  # pattern rows (priority ordering / priority conflict / cross-entity /
  # temporal / aggregate / conditional / cascading). Every recipe below was
  # replayed against the whole ladder so that the asserted error_id really is
  # the FIRST rule the request violates.
  # ===========================================================================
  - section: validations
    instances:

      - name: a_page_limit_above_the_declared_maximum_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_PAGINATION_OUT_OF_RANGE]
          - pagination_defaults
        distinguishing_aspect: "limit=101 is one past the declared maximum of 100, so the list endpoint must refuse with 422 rather than silently clamp to 100 or return the whole collection."
        test_recipe:
          setup:
            - "One EntryPoint exists so the list would otherwise return a non-empty page."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
          trigger:
            - call: "GET /entry-points?limit=101"
              payload: {}
              as: UtilityAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error envelope error_id == ERR_PAGINATION_OUT_OF_RANGE"
            - "The response carries no data.items array — the request never reached the query"
            - "A follow-up GET /entry-points?limit=100 returns HTTP 200 with total_count == 1 and has_more == false"

      - name: a_contaminant_outside_the_sample_panel_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=70]
          - errors[ERR_CONTAMINANT_NOT_IN_PANEL]
          - entities.Sample.fields.panel_contaminant_ids
        distinguishing_aspect: "PFOS exists as a Contaminant row, so priority 8 resolves the foreign key; the refusal is purely about membership in Sample.panel_contaminant_ids, which held only PFOA."
        test_recipe:
          setup:
            - "Two contaminants PFOA and PFOS are registered; the laboratory is certified for METHOD_533 with a lowest achievable DL of 1.00 ng/L."
            - "A sample is collected for a PFOA-only panel, shipped and received, so its status is RECEIVED and the panel does not include PFOS."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /contaminants"
              payload: { code: "PFOS", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfos_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A1" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfos_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error envelope error_id == ERR_CONTAMINANT_NOT_IN_PANEL"
            - "No LabResult row exists: GET /lab-results?sample_id=${s_id} returns total_count == 0"
            - "Sample.${s_id}.status is still RECEIVED"
            - "Sample.${s_id}.panel_contaminant_ids has exactly 1 entry"

      - name: an_uncertified_analytical_method_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=71]
          - errors[ERR_METHOD_NOT_CERTIFIED]
          - entities.Laboratory.fields.certified_methods
        distinguishing_aspect: "METHOD_1633 is a declared member of the method enum, so this is not a shape failure at priority 6; the laboratory simply does not hold that certification, and priority 71 outranks the holding-time check at 80 which METHOD_1633 would have satisfied."
        test_recipe:
          setup:
            - "The laboratory is certified for METHOD_533 only."
            - "A PFOA sample is collected, shipped to that laboratory and received."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A1" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_1633", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error envelope error_id == ERR_METHOD_NOT_CERTIFIED"
            - "Laboratory.${lab_id}.certified_methods == [\"METHOD_533\"]"
            - "GET /lab-results?laboratory_id=${lab_id} returns total_count == 0"

      - name: a_detection_limit_above_the_required_mrl_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=72]
          - errors[ERR_DETECTION_LIMIT_TOO_HIGH]
          - entities.Contaminant.fields.required_mrl_ng_per_l
        distinguishing_aspect: "3.00 exceeds Contaminant.required_mrl_ng_per_l of 2.00 while comfortably clearing the laboratory's own floor of 1.00, so only the regulatory-MRL rule at 72 can fire — the capability rule at 73 is satisfied."
        test_recipe:
          setup:
            - "PFOA carries required_mrl_ng_per_l 2.00; the laboratory can reach 1.00."
            - "A PFOA sample is collected, shipped and received."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A1" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 3.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error envelope error_id == ERR_DETECTION_LIMIT_TOO_HIGH"
            - "GET /lab-results?sample_id=${s_id} returns total_count == 0"
            - "Sample.${s_id}.status is still RECEIVED"

      - name: a_detection_limit_below_the_laboratory_capability_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=73]
          - errors[ERR_DETECTION_LIMIT_BELOW_CAPABILITY]
          - entities.Laboratory.fields.lowest_achievable_dl_ng_per_l
        distinguishing_aspect: "0.50 is BELOW the laboratory's declared floor of 1.00 while still satisfying the regulatory MRL of 2.00 — the mirror image of priority 72, proving the two rules bound the detection limit from opposite sides rather than being one range check."
        test_recipe:
          setup:
            - "PFOA carries required_mrl_ng_per_l 2.00; the laboratory's lowest achievable DL is 1.00."
            - "A PFOA sample is collected, shipped and received."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
