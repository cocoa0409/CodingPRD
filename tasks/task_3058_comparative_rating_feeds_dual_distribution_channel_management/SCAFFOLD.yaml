    path: "/contingent-bonus-pools/{id}/settle"
    description: "Settle an OPEN pool; creates BonusPayouts per gated eligibility and retains the rounding remainder"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: ContingentBonusPool
    side_effects: ["OPEN -> SETTLED; BonusPayouts created; undistributed_cents computed; increments version by 1"]

  - method: GET
    path: "/contingent-bonus-pools/{id}/bonus-payouts"
    description: "List payouts of a pool (reverse reach for BonusPayout.pool_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "BonusPayout[]"
    side_effects: []

  - method: GET
    path: "/agents/{id}/bonus-payouts"
    description: "List payouts of an agent (reverse reach for BonusPayout.agent_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "BonusPayout[]"
    side_effects: []

  - method: GET
    path: "/bonus-payouts/{id}"
    description: "Get a BonusPayout"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, System]
    code: 200
    input: []
    output: BonusPayout
    side_effects: []

  # --- PortfolioReview ---
  - method: POST
    path: "/agents/{id}/portfolio-reviews"
    description: "Open a portfolio review; computes trailing loss ratio at open"
    roles: [UnderwritingReviewer]
    code: 201
    input: [reason]
    output: PortfolioReview
    side_effects: ["status=OPEN; opened_by_user_id = X-User-ID; trailing_loss_ratio and earned_premium_trailing_cents computed; ERR_REVIEW_ALREADY_OPEN if an OPEN review exists for the agent"]

  - method: GET
    path: "/agents/{id}/portfolio-reviews"
    description: "List an agent's reviews (reverse reach for PortfolioReview.agent_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PortfolioReview[]"
    side_effects: []

  - method: GET
    path: "/portfolio-reviews/{id}"
    description: "Get a PortfolioReview"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, System]
    code: 200
    input: []
    output: PortfolioReview
    side_effects: []

  - method: POST
    path: "/portfolio-reviews/{id}/issue-findings"
    description: "Issue findings on an OPEN review"
    roles: [UnderwritingReviewer]
    code: 200
    input: [findings]
    output: PortfolioReview
    side_effects: ["OPEN -> FINDINGS_ISSUED; increments version by 1"]

  - method: POST
    path: "/portfolio-reviews/{id}/take-action"
    description: "Take action on a FINDINGS_ISSUED review; segregation of duties: actioner != opener; TERMINATE runs the full agent-termination cascade"
    roles: [UnderwritingReviewer]
    code: 200
    input: [action]
    output: PortfolioReview
    side_effects: ["FINDINGS_ISSUED -> ACTION_TAKEN; Agent suspended/terminated per action; increments version by 1"]

  # --- BundlePlacement ---
  - method: POST
    path: "/policies/{id}/bundle-placements"
    description: "Create a bundled home placement with an unaffiliated carrier on a bundle-eligible policy"
    roles: [Agent, CarrierAdmin]
    code: 201
    input: [unaffiliated_carrier_name, home_premium_cents, total_commission_cents]
    output: BundlePlacement
    side_effects:
      - "status=QUOTED; agent_id = policy.agent_id (ERR_AGENT_MISMATCH if policy has no agent)"
      - "policy's product must be bundle_eligible (ERR_BUNDLE_NOT_ELIGIBLE); policy must be IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"

  - method: GET
    path: "/policies/{id}/bundle-placements"
    description: "List bundle placements of a policy (reverse reach for BundlePlacement.policy_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BundlePlacement[]"
    side_effects: []

  - method: GET
    path: "/bundle-placements"
    description: "List bundle placements with filters (reverse reach for BundlePlacement.agent_id / transferred_to_agent_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, System]
    code: 200
    input: ["agent_id?", "transferred_to_agent_id?", "status?", "limit?", "offset?"]
    output: "BundlePlacement[]"
    side_effects: []

  - method: GET
    path: "/bundle-placements/{id}"
    description: "Get a BundlePlacement"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: BundlePlacement
    side_effects: []

  - method: POST
    path: "/bundle-placements/{id}/place"
    description: "Mark a QUOTED placement as placed with the unaffiliated carrier"
    roles: [Agent]
    code: 200
    input: []
    output: BundlePlacement
    side_effects: ["QUOTED -> PLACED; increments version by 1"]

  - method: POST
    path: "/bundle-placements/{id}/transfer-aor"
    description: "Transfer agency-of-record to another appointed agent; unearned commission waterfall"
    roles: [CarrierAdmin]
    code: 200
    input: [new_agent_id]
    output: BundlePlacement
    side_effects: ["PLACED -> AOR_TRANSFERRED; earned/transferred commission computed; agent_id updated; increments version by 1"]

  - method: POST
    path: "/bundle-placements/{id}/decline"
    description: "Decline a QUOTED placement (agent or carrier) or a PLACED one (carrier only)"
    roles: [Agent, CarrierAdmin]
    code: 200
    input: ["reason?"]
    output: BundlePlacement
    side_effects: ["-> DECLINED; increments version by 1"]

  # --- Leakage analytics (computed read) ---
  - method: GET
    path: "/leakage-reports/quote-to-bind"
    description: "Quote-to-bind leakage by channel over a half-open window, on a COUNT or PREMIUM_WEIGHTED basis"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, System]
    code: 200
    input: [period_start, period_end, basis, "channel?"]
    output: "{ basis: string, period_start: string, period_end: string, channels: array }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty, or role not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role valid but not listed in the endpoint's roles" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller is not the owner of the target resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, unparseable datetime, invalid period (end <= start), score out of range" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not defined from the resource's current state (incl. second submit, bind of DRAFT/WITHDRAWN/BOUND quote, actions on terminal resources)" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Bind attempted with logical clock now >= quote.expires_at" }
  - { id: ERR_RATE_STALE, http: 409, condition: "Bind attempted on a quote whose pinned feed publication was superseded or recalled" }
  - { id: ERR_PRODUCT_NOT_ACTIVE, http: 409, condition: "Quote submit or feed publish against a product not in ACTIVE" }
  - { id: ERR_FEED_NOT_PUBLISHED, http: 409, condition: "AGENT-channel submit/agent-quote with no PUBLISHED publication covering now for the product" }
  - { id: ERR_POLICY_NOT_IN_FORCE, http: 409, condition: "Telematics activation/scoring, bundle placement, or claw-back against a CANCELLED policy" }
  - { id: ERR_AGENT_NOT_APPOINTED_IN_STATE, http: 409, condition: "Agent lacks an ACTIVE appointment for the product's (state_code, line_of_business), or appoint/reinstate without any ACTIVE appointment" }
  - { id: ERR_AGENT_TERMINATED, http: 409, condition: "Agent-channel quote/bind/referral naming a TERMINATED (or non-APPOINTED) agent" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Portfolio-review take-action attempted by the same X-User-ID that opened the review" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "Opening a second OPEN PortfolioReview for the same agent" }
  - { id: ERR_APPOINTMENT_WINDOW_OVERLAP, http: 409, condition: "New appointment's half-open window intersects an existing ACTIVE appointment for the same (agent, state, line); adjacency (end == start) is allowed" }
  - { id: ERR_FEED_WINDOW_OVERLAP, http: 409, condition: "New feed publication strictly overlaps an existing DRAFT/PUBLISHED window for the same (rater, product)" }
  - { id: ERR_FEED_WINDOW_GAP_VIOLATION, http: 409, condition: "New feed publication is non-overlapping but leaves < 24h gap to a sibling window (touching intervals included); exactly 24h is allowed" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "New statement window overlaps a FINALIZED/PAID/CLAWED_BACK statement of the same agent" }
  - { id: ERR_CHANNEL_NOT_AVAILABLE, http: 409, condition: "Quote channel not included in product.channel_availability" }
  - { id: ERR_PRODUCT_NOT_PUBLISHABLE, http: 409, condition: "Feed publication created for a product not in ACTIVE (checked at publication-create)" }
  - { id: ERR_AGENT_MISMATCH, http: 409, condition: "AGENT-channel quote created without agent_id, or bundle placement on a policy with no agent" }
  - { id: ERR_BUNDLE_NOT_ELIGIBLE, http: 409, condition: "Bundle placement attempted on a policy whose product is not bundle_eligible" }
  - { id: ERR_AGENT_HAS_ACTIVE_PLACEMENTS, http: 409, condition: "Agent termination (direct or via review) while PLACED BundlePlacements exist for the agent" }
  - { id: ERR_AOR_NOT_ALLOWED, http: 409, condition: "transfer-aor on a non-PLACED placement, or new_agent_id equal to the current agent or not APPOINTED" }
  - { id: ERR_TELEMATICS_ALREADY_ENROLLED, http: 409, condition: "Second enrollment for the same policy (policy already has an enrollment in any status)" }
  - { id: ERR_PREMIUM_CAP_EXCEEDED, http: 409, condition: "DIRECT-channel computed premium exceeds product.direct_channel_max_premium_cents at submit" }
  - { id: ERR_NOTHING_TO_PAY, http: 409, condition: "Pay attempted on a FINALIZED statement with net_payable_cents == 0" }
  - { id: ERR_NEGATIVE_COMMISSION, http: 409, condition: "Claw-back would drive statement net_payable_cents below zero" }
  - { id: ERR_DUPLICATE_RATER_CODE, http: 409, condition: "rater_code already registered" }
  - { id: ERR_DUPLICATE_CONSUMER_EMAIL, http: 409, condition: "email already registered" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not equal the parent's current version on an OCC-guarded create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may only register as a consumer"
    identity: opaque
    exclusive_operations:
      - "POST /consumers — register consumer"
    shared_operations: []

  - name: CarrierAdmin
    description: "Carrier superuser: agents, schedules, statements, pools, claims, AOR transfers, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /agents"
      - "POST /agents/{id}/commission-schedules"
      - "POST /agents/{id}/commission-statements"
      - "POST /commission-statements/{id}/finalize | /pay | /claw-back"
      - "POST /contingent-bonus-pools, POST /contingent-bonus-pools/{id}/settle"
      - "POST /policies/{id}/claims, POST /claims/{id}/close"
      - "POST /bundle-placements/{id}/transfer-aor"
    shared_operations:
      - "POST /policies/{id}/cancel (with Consumer/Agent)"
      - "POST /policies/{id}/bundle-placements (with Agent)"
      - "POST /bundle-placements/{id}/decline (with Agent)"
      - "all GET endpoints (with other roles)"

  - name: RatingManager
    description: "Owns products, raters, and rate feed publications"
    identity: opaque
    exclusive_operations:
      - "POST /products, POST /products/{id}/activate | /withdraw"
      - "POST /raters"
      - "POST /raters/{id}/rate-feed-publications"
      - "POST /rate-feed-publications/{id}/publish | /recall"
    shared_operations:
      - "all GET endpoints (with other roles)"
      - "GET /leakage-reports/quote-to-bind (with CarrierAdmin, UnderwritingReviewer, System)"

  - name: UnderwritingReviewer
    description: "Appointments, agent lifecycle, portfolio reviews; segregation of duties enforced on review action vs open"
    identity: opaque
    exclusive_operations:
      - "POST /agents/{id}/appoint | /suspend | /reinstate | /terminate"
      - "POST /agents/{id}/appointments, POST /appointments/{id}/terminate"
      - "POST /agents/{id}/portfolio-reviews, POST /portfolio-reviews/{id}/issue-findings | /take-action"
    shared_operations:
      - "all GET endpoints (with other roles)"

  - name: Agent
    description: "Independent agent; X-User-ID equals the Agent entity id"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /quotes/{id}/agent-quote"
      - "POST /bundle-placements/{id}/place"
    shared_operations:
      - "POST /quotes (AGENT channel, self as agent_id; with Consumer)"
      - "POST /quotes/{id}/submit | /re-rate | /bind | /withdraw (with Consumer; ownership-scoped)"
      - "POST /policies/{id}/cancel (with Consumer, CarrierAdmin; ownership-scoped)"
      - "POST /policies/{id}/bundle-placements (with CarrierAdmin)"
      - "POST /telematics-enrollments/{id}/activate-device | /opt-out (with Consumer)"
      - "GET endpoints (with other roles)"

  - name: Consumer
    description: "Direct-channel consumer; X-User-ID equals the Consumer entity id"
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /quotes/{id}/refer-to-agent"
    shared_operations:
      - "POST /quotes (DIRECT channel, self as consumer_id; with Agent)"
      - "POST /quotes/{id}/submit | /re-rate | /bind | /withdraw (with Agent; ownership-scoped)"
      - "POST /policies/{id}/cancel (with Agent, CarrierAdmin; ownership-scoped)"
      - "POST /telematics-enrollments/{id}/activate-device | /opt-out (with Agent)"
      - "GET endpoints (with other roles)"

  - name: ComparativeRater
    description: "Comparative rater integration identity; X-User-ID equals the ComparativeRater entity id; read-only consumer of its own feed publications"
    identity: "entity_backed:ComparativeRater"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (with other roles)"

  - name: System
    description: "Automation identity for telematics scoring and computed reads"
    identity: opaque
    exclusive_operations:
      - "POST /telematics-enrollments/{id}/score"
    shared_operations:
      - "all GET endpoints (with other roles)"
      - "GET /leakage-reports/quote-to-bind (with CarrierAdmin, RatingManager, UnderwritingReviewer)"
