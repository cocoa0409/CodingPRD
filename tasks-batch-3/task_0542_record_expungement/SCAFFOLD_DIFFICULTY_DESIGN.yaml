            - "Petition.${pet}.status == OBJECTION_REVIEW (hop 2, caused by hop 1)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: file_state_beats_fee_unpaid
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A DRAFT petition (state violation, priority 6) with an unpaid fee (business_fiscal
          violation, priority 11) returns ERR_INVALID_STATE, not ERR_FILING_FEE_UNPAID — state
          category outranks fiscal.
        test_recipe:
          setup:
            - "Petition still in DRAFT (never advanced to SCREENED) with one eligible record; no fee paid."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Ann Bly", date_of_birth: "1990-09-09T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
          trigger:
