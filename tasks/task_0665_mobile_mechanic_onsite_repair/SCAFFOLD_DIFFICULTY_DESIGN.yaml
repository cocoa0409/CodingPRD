  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: onsite_dispatch_half_open_overlap_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_VISIT_OVERLAP]
          - state_machines.ServiceRequest.APPROVED_to_DISPATCHED
        distinguishing_aspect: "Half-open [start,end) interval semantics on Mechanic: a second ON_SITE dispatch overlapping an existing non-terminal ON_SITE visit for the same mechanic is rejected; abutting at the exact boundary (09:00-11:00 then 11:00-12:00) is allowed — no buffer."
