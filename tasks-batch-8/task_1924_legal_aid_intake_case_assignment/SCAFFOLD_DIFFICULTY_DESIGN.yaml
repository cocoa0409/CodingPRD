          setup:
            - "Panel member covering EVICTION_DEFENSE/FAMILY_DV/BENEFITS_APPEAL in CountyA (max 5); three ADVICE_ONLY cases (clients A/B/C) each with an OFFERED referral to this member; referral R1 already ACCEPTED with window [2026-09-01, 2026-10-01)"
