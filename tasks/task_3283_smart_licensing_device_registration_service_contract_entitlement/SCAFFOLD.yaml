  - { method: POST, path: "/api/license-pools", description: "Create a license pool (perpetual or subscription) in a virtual account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [virtual_account_id, sku, license_model, "feature_tier?", purchased_quantity, "subscription_expires_at?"], output: LicensePool, side_effects: ["compliance_state initialized COMPLIANT"] }
  - { method: GET, path: "/api/license-pools/{id}", description: "Get one pool including computed consumption and compliance", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: LicensePool, side_effects: [] }
  - { method: POST, path: "/api/license-pools/{id}/purchase-adjustment", description: "Adjust purchased_quantity (delta, positive or negative) with OCC", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [delta, expected_pool_version], output: LicensePool, side_effects: ["recomputes consumed/compliance via pool_consumed_quantity", "recomputes SmartAccount.compliance_posture", "increments LicensePool.version by 1"] }
  - { method: POST, path: "/api/license-pools/{id}/tier-upgrade", description: "Upgrade feature_tier; subscription pools get proration credit per tier_upgrade_proration", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [new_tier], output: LicensePool, side_effects: ["applies tier_upgrade_proration", "recomputes compliance", "increments LicensePool.version by 1"] }
  - { method: GET, path: "/api/license-pools/{id}/compliance-events", description: "List compliance events of a pool", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "ComplianceEvent[]", side_effects: [] }
