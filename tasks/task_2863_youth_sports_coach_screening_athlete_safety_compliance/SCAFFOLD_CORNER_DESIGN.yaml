      - name: critical_finding_freeze_threshold_at_one_and_its_reset
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.club_compliance_posture.constants.CRITICAL_FREEZE_THRESHOLD
          - calculations.club_compliance_posture.formula
          - state_machines.AuditFinding.OPEN_to_WAIVED
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          CRITICAL_FREEZE_THRESHOLD is 1, so the very first CRITICAL finding is the boundary: at
          zero critical findings and two open ones the posture is OPEN, the first CRITICAL flips
          it straight to FROZEN, and because FROZEN is matched before RESTRICTED the posture is
          FROZEN even though open_finding_count has simultaneously reached
          RESTRICT_FINDING_THRESHOLD 3. Waiving that one finding resets both counters and the
          posture returns to OPEN, proving the threshold is recomputed rather than latched.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with member m_rt and no coach assignments, so restricted_member_count stays 0"
            - "audit audit_rt over H1 2026 with score_variant SELF_ATTESTED sampling m_rt"
            - "two MINOR findings are written, then one CRITICAL finding, then the audit is finalized"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
