# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Retail Shopper Data Science & Supplier Insights Subscription
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: incrementality_provisional_vs_final_lift
        grounds:
          - calculations.incrementality_lift
          - state_machines.IncrementalityStudy.RUNNING_to_ANALYSIS
        distinguishing_aspect: |
          Dual variants on the IncrementalityStudy domain: identical matched
          pairs yield provisional_lift_pct 20.0 (raw) and final_lift_pct 15.0
          (bias-corrected with COVARIATE_WEIGHT 0.5); distinct entity domain
          from the forecast variant instance.
        test_recipe:
          setup:
            - "Panel holds treated households T1, T2 (exposed to ACME, campaign 24000, baseline 22000) and controls C1, C2, C3 (unexposed, campaign 20000, baseline 20000) in category SNACKS"
            - "Study for ACME/SNACKS with window 2026-09-01..2026-09-10 has been started (matched_pairs computed) and the logical clock advanced to window_end"
          setup_api_calls:
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "T1", category_codes: ["SNACKS"], recency_days: 5, frequency_12m: 10, monetary_12m_cents: 24000, exposed_brands: ["ACME"], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 22000, campaign_spend_cents: 24000 }] }
                  - { household_ref: "T2", category_codes: ["SNACKS"], recency_days: 5, frequency_12m: 10, monetary_12m_cents: 24000, exposed_brands: ["ACME"], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 22000, campaign_spend_cents: 24000 }] }
                  - { household_ref: "C1", category_codes: ["SNACKS"], recency_days: 6, frequency_12m: 10, monetary_12m_cents: 23000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
                  - { household_ref: "C2", category_codes: ["SNACKS"], recency_days: 4, frequency_12m: 12, monetary_12m_cents: 23000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
                  - { household_ref: "C3", category_codes: ["SNACKS"], recency_days: 6, frequency_12m: 8, monetary_12m_cents: 25000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/incrementality-studies"
              payload: { brand_code: "ACME", category_code: "SNACKS", window_start: "2026-09-01", window_end: "2026-09-10" }
              as: InsightsScientist
              captures: { study_id: $.data.id }
            - call: "POST /shopper-insights/incrementality-studies/${study_id}/start"
              as: InsightsScientist
            - call: "POST /shopper-insights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: RetailerAdmin
          trigger:
            - call: "GET /shopper-insights/incrementality-studies/${study_id}"
              as: InsightsScientist
          assert:
            - "IncrementalityStudy.${study_id}.status == ANALYSIS"
            - "IncrementalityStudy.${study_id}.test_avg_spend_cents == 24000"
            - "IncrementalityStudy.${study_id}.control_avg_spend_cents == 20000"
            - "IncrementalityStudy.${study_id}.provisional_lift_pct == 20.0"
            - "IncrementalityStudy.${study_id}.final_lift_pct == 15.0"

      - name: forecast_simple_vs_similarity_weighted
        grounds:
          - calculations.new_item_forecast
        distinguishing_aspect: |
          Dual variants on the NewItemForecast domain: identical analog list
          yields forecast_simple_avg_units 106.67 (unweighted mean) and
          forecast_weighted_units 110.0 (similarity-weighted); variant
          SIMPLE_AVERAGE selects 106.67. Distinct entity domain from the
          incrementality instance.
        test_recipe:
          setup:
            - "Account with an ACTIVE TIER_PORTFOLIO contract (modeled_derivation_allowed true) exists"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Acme Foods", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_PORTFOLIO", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
          trigger:
            - call: "POST /shopper-insights/new-item-forecasts"
              payload:
                contract_id: "${contract}"
                product_ref: "NEW-1"
                analogs:
                  - { analog_ref: "A1", similarity_score: 0.9, observed_week4_units: 100 }
                  - { analog_ref: "A2", similarity_score: 0.6, observed_week4_units: 140 }
                  - { analog_ref: "A3", similarity_score: 0.3, observed_week4_units: 80 }
                variant: "SIMPLE_AVERAGE"
              as: InsightsScientist
              captures: { fc: $.data.id }
          assert:
            - "NewItemForecast.${fc}.forecast_simple_avg_units == 106.67"
            - "NewItemForecast.${fc}.forecast_weighted_units == 110.0"
            - "NewItemForecast.${fc}.forecast_selected_units == 106.67"
            - "NewItemForecast.${fc}.status == PUBLISHED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: query_cost_nonlinear_three_input
        grounds:
          - calculations.clean_room_query_cost
          - calculations.query_budget_ledger
        distinguishing_aspect: |
          Mode (a): >=3 inputs (estimated_rows, join breadth, contract tier)
          with non-linear interaction (ceil on row_units, max on join factor,
          tier multiplier, min/max caps). 5200 rows, 3 joins, TIER_BRAND
          yields cost 12 and budget remaining 188.
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_BRAND contract; APPROVED clean-room grant with query_budget_total 200"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Beta Brands", region: "SE" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_BRAND", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", query_budget_total: 200 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "steward-1"
          trigger:
            - call: "POST /shopper-insights/clean-room-grants/${grant}/queries"
              payload: { dataset_joins: ["SALES", "PROMOS", "DEMOGRAPHICS"], estimated_rows: 5200 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { q: $.data.id, q_cost: $.data.query_cost, q_status: $.data.status }
            - call: "GET /shopper-insights/clean-room-grants/${grant}"
              as: DataSteward
              as_user_id: "steward-1"
              captures: { g_rem: $.data.query_budget_remaining, g_used: $.data.query_budget_consumed }
          assert:
            - "CleanRoomQuery.${q}.query_cost == 12"
            - "CleanRoomQuery.${q}.status == EXECUTED"
            - "CleanRoomQuery.${q}.result_rows == 5200"
            - "CleanRoomGrant.${grant}.query_budget_consumed == 12"
            - "CleanRoomGrant.${grant}.query_budget_remaining == 188"

      - name: activation_fee_per_line_then_sum_rounding
        grounds:
          - calculations.activation_reach_and_fee
          - concurrency_rules[segment-activation-stale-version]
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round_half_up per
          channel line THEN sum is mandated. Segment size 37 on channels
          [COUPON, RETAIL_MEDIA] yields 73 + 59 = 132; the forbidden
          sum-then-round order would yield 131.
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_PORTFOLIO contract (activation_budget_cents 100000) and scope SNACKS"
            - "37 SNACKS panel households ingested; segment matching all 37 is APPROVED (size 37, version captured post-approve)"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Gamma Goods", region: "NE" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_PORTFOLIO", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "h01", category_codes: ["SNACKS"] }
                  - { household_ref: "h02", category_codes: ["SNACKS"] }
                  - { household_ref: "h03", category_codes: ["SNACKS"] }
                  - { household_ref: "h04", category_codes: ["SNACKS"] }
                  - { household_ref: "h05", category_codes: ["SNACKS"] }
                  - { household_ref: "h06", category_codes: ["SNACKS"] }
                  - { household_ref: "h07", category_codes: ["SNACKS"] }
                  - { household_ref: "h08", category_codes: ["SNACKS"] }
                  - { household_ref: "h09", category_codes: ["SNACKS"] }
                  - { household_ref: "h10", category_codes: ["SNACKS"] }
                  - { household_ref: "h11", category_codes: ["SNACKS"] }
                  - { household_ref: "h12", category_codes: ["SNACKS"] }
                  - { household_ref: "h13", category_codes: ["SNACKS"] }
                  - { household_ref: "h14", category_codes: ["SNACKS"] }
                  - { household_ref: "h15", category_codes: ["SNACKS"] }
                  - { household_ref: "h16", category_codes: ["SNACKS"] }
                  - { household_ref: "h17", category_codes: ["SNACKS"] }
                  - { household_ref: "h18", category_codes: ["SNACKS"] }
                  - { household_ref: "h19", category_codes: ["SNACKS"] }
                  - { household_ref: "h20", category_codes: ["SNACKS"] }
                  - { household_ref: "h21", category_codes: ["SNACKS"] }
                  - { household_ref: "h22", category_codes: ["SNACKS"] }
                  - { household_ref: "h23", category_codes: ["SNACKS"] }
                  - { household_ref: "h24", category_codes: ["SNACKS"] }
                  - { household_ref: "h25", category_codes: ["SNACKS"] }
                  - { household_ref: "h26", category_codes: ["SNACKS"] }
                  - { household_ref: "h27", category_codes: ["SNACKS"] }
                  - { household_ref: "h28", category_codes: ["SNACKS"] }
                  - { household_ref: "h29", category_codes: ["SNACKS"] }
                  - { household_ref: "h30", category_codes: ["SNACKS"] }
                  - { household_ref: "h31", category_codes: ["SNACKS"] }
                  - { household_ref: "h32", category_codes: ["SNACKS"] }
                  - { household_ref: "h33", category_codes: ["SNACKS"] }
                  - { household_ref: "h34", category_codes: ["SNACKS"] }
                  - { household_ref: "h35", category_codes: ["SNACKS"] }
                  - { household_ref: "h36", category_codes: ["SNACKS"] }
                  - { household_ref: "h37", category_codes: ["SNACKS"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/audience-segments"
              payload: { contract_id: "${contract}", segment_name: "All Snackers", category_code: "SNACKS" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { seg: $.data.id }
            - call: "POST /shopper-insights/audience-segments/${seg}/submit"
              as: SupplierAnalyst
              as_user_id: "${acct}"
            - call: "POST /shopper-insights/audience-segments/${seg}/approve"
              as: DataSteward
              as_user_id: "steward-2"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /shopper-insights/audience-segments/${seg}/activations"
              payload: { expected_segment_version: "${sv}", channels: ["COUPON", "RETAIL_MEDIA"] }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { act: $.data.id }
          assert:
            - "SegmentActivation.${act}.channel_lines[0].households_reached == 29"
            - "SegmentActivation.${act}.channel_lines[0].line_fee_cents == 73"
            - "SegmentActivation.${act}.channel_lines[1].households_reached == 18"
            - "SegmentActivation.${act}.channel_lines[1].line_fee_cents == 59"
            - "SegmentActivation.${act}.total_fee_cents == 132"
            - "SubscriptionContract.${contract}.activation_budget_spent_cents == 132"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: segment_rejection_revert_cycle
        grounds:
          - state_machines.AudienceSegment.DRAFT_to_PENDING_APPROVAL
          - state_machines.AudienceSegment.PENDING_APPROVAL_to_REJECTED
          - state_machines.AudienceSegment.REJECTED_to_PENDING_APPROVAL
          - state_machines.AudienceSegment.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          AudienceSegment is branching-with-revert: DRAFT -> PENDING_APPROVAL
          -> REJECTED -> PENDING_APPROVAL -> APPROVED traverses the revert
          edge; a linear pipeline could not revisit PENDING_APPROVAL.
        test_recipe:
          setup:
            - "Account with ACTIVE contract and scope SNACKS; 25 SNACKS households; segment size 25"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Delta Dairy", region: "SW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "s01", category_codes: ["SNACKS"] }
                  - { household_ref: "s02", category_codes: ["SNACKS"] }
                  - { household_ref: "s03", category_codes: ["SNACKS"] }
                  - { household_ref: "s04", category_codes: ["SNACKS"] }
                  - { household_ref: "s05", category_codes: ["SNACKS"] }
                  - { household_ref: "s06", category_codes: ["SNACKS"] }
                  - { household_ref: "s07", category_codes: ["SNACKS"] }
                  - { household_ref: "s08", category_codes: ["SNACKS"] }
                  - { household_ref: "s09", category_codes: ["SNACKS"] }
                  - { household_ref: "s10", category_codes: ["SNACKS"] }
                  - { household_ref: "s11", category_codes: ["SNACKS"] }
                  - { household_ref: "s12", category_codes: ["SNACKS"] }
                  - { household_ref: "s13", category_codes: ["SNACKS"] }
                  - { household_ref: "s14", category_codes: ["SNACKS"] }
                  - { household_ref: "s15", category_codes: ["SNACKS"] }
                  - { household_ref: "s16", category_codes: ["SNACKS"] }
                  - { household_ref: "s17", category_codes: ["SNACKS"] }
                  - { household_ref: "s18", category_codes: ["SNACKS"] }
                  - { household_ref: "s19", category_codes: ["SNACKS"] }
                  - { household_ref: "s20", category_codes: ["SNACKS"] }
                  - { household_ref: "s21", category_codes: ["SNACKS"] }
                  - { household_ref: "s22", category_codes: ["SNACKS"] }
                  - { household_ref: "s23", category_codes: ["SNACKS"] }
                  - { household_ref: "s24", category_codes: ["SNACKS"] }
                  - { household_ref: "s25", category_codes: ["SNACKS"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/audience-segments"
              payload: { contract_id: "${contract}", segment_name: "Snackers", category_code: "SNACKS" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /shopper-insights/audience-segments/${seg}/submit"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { st1: $.data.status }
            - call: "POST /shopper-insights/audience-segments/${seg}/reject"
              as: DataSteward
              as_user_id: "steward-3"
              captures: { st2: $.data.status }
            - call: "POST /shopper-insights/audience-segments/${seg}/submit"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { st3: $.data.status }
            - call: "POST /shopper-insights/audience-segments/${seg}/approve"
              as: DataSteward
              as_user_id: "steward-3"
              captures: { st4: $.data.status }
          assert:
            - "first submit -> status PENDING_APPROVAL"
            - "reject -> status REJECTED"
            - "second submit (from REJECTED) -> status PENDING_APPROVAL"
            - "approve -> status APPROVED"
            - "AudienceSegment.${seg}.size == 25"

      - name: study_revision_cycle_rematches_controls
        grounds:
          - state_machines.IncrementalityStudy.IN_REVIEW_to_RUNNING
          - state_machines.IncrementalityStudy.RUNNING_to_ANALYSIS
          - state_machines.IncrementalityStudy.IN_REVIEW_to_PUBLISHED
        distinguishing_aspect: |
          IncrementalityStudy is cyclic: IN_REVIEW -> RUNNING (revise) loops
          back to an earlier state and re-executes matched_control_selection,
          then proceeds RUNNING -> ANALYSIS -> IN_REVIEW -> PUBLISHED; a second
          publish after PUBLISHED is rejected (terminal lockdown).
        test_recipe:
          setup:
            - "Panel fixture T1/T2 treated and C1/C2/C3 controls in SNACKS; study window 2026-09-01..2026-09-10"
          setup_api_calls:
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "T1", category_codes: ["SNACKS"], recency_days: 5, frequency_12m: 10, monetary_12m_cents: 24000, exposed_brands: ["ACME"], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 22000, campaign_spend_cents: 24000 }] }
                  - { household_ref: "T2", category_codes: ["SNACKS"], recency_days: 5, frequency_12m: 10, monetary_12m_cents: 24000, exposed_brands: ["ACME"], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 22000, campaign_spend_cents: 24000 }] }
                  - { household_ref: "C1", category_codes: ["SNACKS"], recency_days: 6, frequency_12m: 10, monetary_12m_cents: 23000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
                  - { household_ref: "C2", category_codes: ["SNACKS"], recency_days: 4, frequency_12m: 12, monetary_12m_cents: 23000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
                  - { household_ref: "C3", category_codes: ["SNACKS"], recency_days: 6, frequency_12m: 8, monetary_12m_cents: 25000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/incrementality-studies"
              payload: { brand_code: "ACME", category_code: "SNACKS", window_start: "2026-09-01", window_end: "2026-09-10" }
              as: InsightsScientist
              captures: { study_id: $.data.id }
            - call: "POST /shopper-insights/incrementality-studies/${study_id}/start"
              as: InsightsScientist
            - call: "POST /shopper-insights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: RetailerAdmin
            - call: "GET /shopper-insights/incrementality-studies/${study_id}"
              as: InsightsScientist
            - call: "POST /shopper-insights/incrementality-studies/${study_id}/submit-review"
              as: InsightsScientist
          trigger:
            - call: "POST /shopper-insights/incrementality-studies/${study_id}/revise"
              as: InsightsScientist
              captures: { st_rev: $.data.status }
            - call: "GET /shopper-insights/incrementality-studies/${study_id}"
              as: InsightsScientist
              captures: { st_an: $.data.status }
            - call: "POST /shopper-insights/incrementality-studies/${study_id}/submit-review"
              as: InsightsScientist
            - call: "POST /shopper-insights/incrementality-studies/${study_id}/publish"
              as: InsightsScientist
              captures: { st_pub: $.data.status }
            - call: "POST /shopper-insights/incrementality-studies/${study_id}/publish"
              as: InsightsScientist
              captures: { err_id: $.data.error_id }
          assert:
            - "revise -> status RUNNING (cycle back)"
            - "GET after revise -> status ANALYSIS (clock already past window_end; auto-transition re-fires)"
            - "publish -> status PUBLISHED"
            - "second publish -> ERR_STUDY_INVALID_TRANSITION"
            - "matched_pairs after revise == [ {test: T1, control: C1}, {test: T2, control: C2} ] (deterministic re-match)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: contract_suspend_three_level_cascade
        grounds:
          - state_machines.SubscriptionContract.ACTIVE_to_SUSPENDED
          - state_machines.InsightReport.REQUESTED_to_CANCELLED
          - state_machines.ReviewDeliverable.PLANNED_to_BLOCKED
          - calculations.planned_open_count_sync
        distinguishing_aspect: |
          Depth-3 chain triggered by contract suspend: suspend cancels open
          InsightReports (B); each cancelled report itself blocks its PLANNED
          ReviewDeliverable (C); each blocked deliverable itself decrements
          its cycle's planned_open_count (D).
        test_recipe:
          setup:
            - "Account with ACTIVE contract (allowance 10) and scope SNACKS; 20 SNACKS households; a REQUESTED CATEGORY report (1 credit reserved); a cycle window 2026-09-20..2026-09-25 with one PLANNED deliverable backed by that report (planned_open_count 1)"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Epsilon Eggs", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_PORTFOLIO", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/insight-reports"
