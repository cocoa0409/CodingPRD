            - "Rule FIN_CREDIT (REGULATED, weight 4.00, auto 0.90, manual 0.20, default_queue STANDARD), one verified advertiser, reviewer R1 who disapproves and reviewer R2 who adjudicates."
            - "Creative B is disapproved for 4.00 points, appealed, and the appeal is DENIED, leaving notice B in APPEAL_UPHELD and appeal B in DENIED."
            - "Creative C is disapproved for 4.00 points and its notice is left ISSUED with appeal_deadline_at 2026-08-04T00:00:00Z and no appeal."
