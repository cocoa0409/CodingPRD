# =============================================================================
# PRD Benchmark Seed Tables — Municipal Stormwater Permit Program (MS4)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2262. Municipal Stormwater Permit Program (municipal separate storm sewer system operator): permit minimum control measures across public education, illicit discharge detection, construction and post-construction runoff control, illicit discharge investigation with outfall screening, source tracing and enforcement, construction site inspection with erosion and sediment control review and stop-work authority, post-construction control inventory with maintenance agreements and inspection of privately owned facilities, municipal operations pollution prevention across fleet, salt storage and street sweeping, monitoring and assessment obligations with total maximum daily load requirements where applicable, annual report preparation with measurable goals and enforcement statistics, funding through stormwater utility fees and credit programs

domain_name: municipal-stormwater-permit
api_prefix: /stormwater

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection is addressed
  # at its own top-level path under /stormwater (no id-chained nesting). The only
  # nested paths are reverse-reachability sub-resource reads and action verbs.

  state_machine_shape: parallel
  # ConstructionSite carries two independent dimensions (plan_status x
  # field_status) on the same row; IllicitDischargeCase and FeeCreditApplication
  # are cyclic; ControlMeasure.goal_status is a second, recomputed dimension
  # alongside ControlMeasure.status.

  relationship_patterns:
    - one_to_many          # PermitTerm -> ControlMeasure / Outfall / ConstructionSite / StormwaterAccount / AnnualReport
    - polymorphic          # Inspection and EnforcementAction each point at one of several subject types
    - cross_aggregate      # ControlMeasure.swept_lane_miles_ytd aggregates Outfall.sweeping_runs; PermitTerm.projected_annual_revenue_cents aggregates StormwaterAccount

  role_model: segregation_of_duties
  # Six operational roles own disjoint verbs; the AnnualReport certifier MUST be
  # a different X-User-ID than the compiler, and an EnforcementAction may not be
  # issued by the same X-User-ID that finalized its source Inspection.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 66 endpoints / 73 error codes / 10 calculations (2 dual-variant)
  # / 13 state machines / 30 ordered validations / 3 OCC rules. Density target:
  # every mutation feeds a derived ledger, a posture recomputation or a cascade.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PermitTerm
    parent: null
    common_fields: true
    fields:
      - name: permit_number
        type: string
        source: input
        description: "MS4 permit identifier; unique across all PermitTerm rows"
        constraints: "1..64 chars; unique"
      - name: term_start_date
        type: string
        source: input
        description: "First day of the permit term (ISO 8601 date, YYYY-MM-DD)"
      - name: term_end_date
        type: string
        source: input
        description: "Last day of the permit term (ISO 8601 date); MUST be > term_start_date"
      - name: status
        type: enum
        source: system
        description: "Permit term lifecycle state"
        default: DRAFT
        constraints: "DRAFT | ACTIVE | EXPIRED"
      - name: tmdl_applicable
        type: boolean
        source: input
        description: "True when a total maximum daily load waste load allocation applies to this term"
        default: false
      - name: tmdl_pollutant
        type: enum
        source: input
        description: "Pollutant governed by the waste load allocation; required when tmdl_applicable is true"
        default: null
        constraints: "TOTAL_PHOSPHORUS | TOTAL_NITROGEN | SEDIMENT | BACTERIA | null"
      - name: tmdl_wla_lb_per_year
        type: number
        source: input
        description: "Annual waste load allocation ceiling in pounds; required when tmdl_applicable is true"
        default: null
        constraints: ">= 0; 2 decimal places"
      - name: eru_sqft
        type: integer
        source: input
        description: "Equivalent residential unit denominator in square feet of impervious area"
        default: 3000
        constraints: ">= 100"
      - name: funding_target_cents
        type: integer
        source: input
        description: "Annual program funding target in cents; drives funding_adequacy_status"
        default: 0
        constraints: ">= 0"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived program posture from ControlMeasure.goal_status census (calculations.permit_term_compliance_posture)"
        default: COMPLIANT
        constraints: "COMPLIANT | AT_RISK | NON_COMPLIANT"
      - name: behind_measure_count
        type: integer
        source: computed
        description: "Count of ControlMeasure rows for this term with status ACTIVE and goal_status BEHIND"
        default: 0
      - name: exceeding_outfall_count
        type: integer
        source: computed
        description: "Count of Outfall rows for this term with status ACTIVE and tmdl_status EXCEEDING"
        default: 0
      - name: total_assessed_penalty_cents
        type: integer
        source: computed
        description: "Penalty ledger: sum of EnforcementAction.penalty_cents for actions on subjects in this term whose status is in {ISSUED, ESCALATED, CLOSED}"
        default: 0
      - name: projected_annual_revenue_cents
        type: integer
        source: computed
        description: "Sum of StormwaterAccount.current_net_fee_cents across accounts of this term"
        default: 0
      - name: funding_adequacy_status
        type: enum
        source: computed
        description: "ADEQUATE when projected_annual_revenue_cents >= funding_target_cents, else UNDERFUNDED"
        default: ADEQUATE
        constraints: "ADEQUATE | UNDERFUNDED"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT->ACTIVE transition"
        default: null
      - name: expired_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ACTIVE->EXPIRED transition"
        default: null
      - name: last_compiled_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent successful AnnualReport compile against this term"
        default: null

  - name: ControlMeasure
    parent: null
    common_fields: true
    fields:
      - name: permit_term_id
        type: string
        source: input
        description: "FK -> PermitTerm.id; the term whose minimum control measure this row represents"
      - name: measure_code
        type: enum
        source: input
        description: "Minimum control measure identity; unique per permit_term_id"
        constraints: "PUBLIC_EDUCATION | ILLICIT_DISCHARGE | CONSTRUCTION_RUNOFF | POST_CONSTRUCTION | MUNICIPAL_OPERATIONS | MONITORING"
      - name: measurable_goal_target
        type: number
        source: input
        description: "Numeric measurable-goal target for the permit year (events, inspections, lane miles, etc.)"
        constraints: ">= 0; 2 decimal places"
      - name: measurable_goal_actual
        type: number
        source: computed
        description: "Latest reported actual; set by report-progress, or aggregated from Outfall.sweeping_runs when measure_code is MUNICIPAL_OPERATIONS"
        default: 0.00
      - name: weight
        type: integer
        source: input
        description: "Weight of this measure inside AnnualReport.compliance_index"
        default: 1
        constraints: "1..5"
      - name: status
        type: enum
        source: system
        description: "Measure lifecycle state; only ACTIVE measures enter posture and index calculations"
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"
      - name: goal_status
        type: enum
        source: computed
        description: "Second, independently recomputed dimension derived by calculations.control_measure_goal_attainment"
        default: PENDING
        constraints: "PENDING | MET | ON_TRACK | BEHIND"
      - name: attainment_pct
        type: number
        source: computed
        description: "100 * measurable_goal_actual / measurable_goal_target, 2 decimal places; 0.00 when target is 0"
        default: 0.00
      - name: open_case_count
        type: integer
        source: computed
        description: "ILLICIT_DISCHARGE measure only: count of IllicitDischargeCase rows for the term whose status is in {OPEN, TRACING, SOURCE_IDENTIFIED, ENFORCEMENT}"
        default: 0
      - name: enforcement_count
        type: integer
        source: computed
        description: "CONSTRUCTION_RUNOFF measure only: count of EnforcementAction rows with construction_site_id set and status in {ISSUED, ESCALATED, CLOSED}"
        default: 0
      - name: salt_storage_covered
        type: boolean
        source: input
        description: "MUNICIPAL_OPERATIONS measure only: salt storage pile is covered"
        default: false
      - name: fleet_wash_recycle
        type: boolean
        source: input
        description: "MUNICIPAL_OPERATIONS measure only: fleet wash water is recycled rather than discharged"
        default: false
      - name: swept_lane_miles_ytd
        type: number
        source: computed
        description: "MUNICIPAL_OPERATIONS measure only: sum of lane_miles_swept across sweeping_runs of every ACTIVE Outfall in the term"
        default: 0.00
      - name: last_progress_reported_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent report-progress call"
        default: null

  - name: Outfall
    parent: null
    common_fields: true
    fields:
      - name: permit_term_id
        type: string
        source: input
        description: "FK -> PermitTerm.id; term under which this outfall is permitted"
      - name: outfall_code
        type: string
        source: input
        description: "Field identifier of the outfall; unique per permit_term_id"
        constraints: "1..32 chars"
      - name: receiving_water
        type: string
        source: input
        description: "Name of the receiving water body"
      - name: drainage_area_acres
        type: number
        source: input
        description: "Contributing drainage area in acres"
        constraints: "> 0"
      - name: priority_tier
        type: enum
        source: input
        description: "Screening priority assigned during outfall inventory"
        constraints: "HIGH | MEDIUM | LOW"
      - name: baseline_concentration_mg_per_l
        type: number
        source: input
        description: "Baseline pollutant concentration used to value projected samples in the PROVISIONAL load variant"
        constraints: ">= 0"
      - name: design_runoff_kl
        type: number
        source: input
        description: "Design storm runoff volume in kilolitres used to value projected samples in the PROVISIONAL load variant"
        constraints: ">= 0"
      - name: sweeping_capacity_lane_miles_per_month
        type: number
        source: input
        description: "Aggregate street-sweeping capacity serving this outfall, in lane miles per calendar month"
        default: 0.00
        constraints: ">= 0"
      - name: sweeping_runs
        type: array
        source: system
        description: "Append-only list of objects { run_start_date, run_end_date, lane_miles_swept } recorded by POST /stormwater/outfalls/{id}/sweeping-runs"
        default: []
      - name: swept_lane_miles_ytd
        type: number
        source: computed
        description: "Sum of lane_miles_swept over sweeping_runs, 2 decimal places"
        default: 0.00
      - name: screening_status
        type: enum
        source: computed
        description: "Dry-weather screening dimension; SUSPECT while any non-terminal IllicitDischargeCase exists for this outfall"
        default: NOT_SCREENED
        constraints: "NOT_SCREENED | CLEAR | SUSPECT"
      - name: last_screened_at
        type: datetime
        source: computed
        description: "observed_at of the most recent DRY_WEATHER_SCREENING observation, ordered by observed_at DESC then created_at ASC"
        default: null
      - name: screening_count
        type: integer
        source: computed
        description: "Count of DRY_WEATHER_SCREENING observations recorded against this outfall"
        default: 0
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of IllicitDischargeCase rows for this outfall whose status is in {OPEN, TRACING, SOURCE_IDENTIFIED, ENFORCEMENT}"
        default: 0
      - name: tmdl_status
        type: enum
        source: computed
        description: "Independent assessment dimension set by the FINAL variant of calculations.outfall_annual_pollutant_load"
        default: NOT_ASSESSED
        constraints: "NOT_ASSESSED | ATTAINING | EXCEEDING"
      - name: last_assessed_gross_load_lb
        type: number
        source: computed
        description: "Gross annual load in pounds from the most recent FINAL load assessment"
        default: 0.00
      - name: last_assessed_credit_lb
        type: number
        source: computed
        description: "Street-sweeping load reduction credit in pounds from the most recent FINAL load assessment"
        default: 0.00
      - name: last_assessed_net_load_lb
        type: number
        source: computed
        description: "Net annual load in pounds from the most recent FINAL load assessment"
        default: 0.00
      - name: last_assessed_year
        type: integer
        source: computed
        description: "Reporting year of the most recent FINAL load assessment"
        default: null
      - name: status
        type: enum
        source: system
        description: "Inventory state; only ACTIVE outfalls enter screening-coverage denominators"
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: OutfallObservation
    parent: null
    common_fields: true
    fields:
      - name: outfall_id
        type: string
        source: input
        description: "FK -> Outfall.id; outfall this observation was taken at"
      - name: observation_type
        type: enum
        source: input
        description: "Discriminator selecting the required field set and the downstream pipeline"
        constraints: "DRY_WEATHER_SCREENING | WET_WEATHER_SAMPLE"
      - name: observed_at
        type: datetime
        source: input
        description: "Field observation instant (ISO 8601 UTC)"
      - name: dry_weather_flow_present
        type: boolean
        source: input
        description: "DRY_WEATHER_SCREENING only: flow observed at the outfall during dry weather"
        default: null
      - name: indicator_bacteria_mpn
        type: number
        source: input
        description: "DRY_WEATHER_SCREENING only: bacteria indicator in most probable number per 100 mL"
        default: null
        constraints: ">= 0"
      - name: indicator_surfactant_mg_per_l
        type: number
        source: input
        description: "DRY_WEATHER_SCREENING only: surfactant indicator in mg/L"
        default: null
        constraints: ">= 0"
      - name: indicator_ammonia_mg_per_l
        type: number
        source: input
        description: "DRY_WEATHER_SCREENING only: ammonia indicator in mg/L"
        default: null
        constraints: ">= 0"
      - name: pollutant_concentration_mg_per_l
        type: number
        source: input
        description: "WET_WEATHER_SAMPLE only: measured pollutant concentration in mg/L"
        default: null
        constraints: ">= 0"
      - name: runoff_volume_kl
        type: number
        source: input
        description: "WET_WEATHER_SAMPLE only: runoff volume represented by the sample, in kilolitres"
        default: null
        constraints: ">= 0"
      - name: field_notes
        type: string
        source: input
        description: "Free-text field notes"
        default: null
      - name: screening_result
        type: enum
        source: computed
        description: "DRY_WEATHER_SCREENING only: CLEAR or SUSPECT per calculations.dry_weather_screening_result; null for samples"
        default: null
        constraints: "CLEAR | SUSPECT | null"
      - name: sample_load_lb
        type: number
        source: computed
        description: "WET_WEATHER_SAMPLE only: per-sample load in pounds, 4 decimal places; null for screenings"
        default: null
      - name: validation_status
        type: enum
        source: system
        description: "WET_WEATHER_SAMPLE lifecycle; screenings are created NOT_APPLICABLE"
        default: PENDING
        constraints: "NOT_APPLICABLE | PENDING | VALIDATED | REJECTED"
      - name: validated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the validate decision"
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID that recorded the observation"

  - name: IllicitDischargeCase
    parent: null
    common_fields: true
    fields:
      - name: outfall_id
        type: string
        source: input
        description: "FK -> Outfall.id; outfall where the suspect discharge was detected"
      - name: origin_observation_id
        type: string
        source: input
        description: "FK -> OutfallObservation.id; the SUSPECT screening that opened this case"
      - name: status
        type: enum
        source: system
        description: "Cyclic investigation state"
        default: OPEN
        constraints: "OPEN | TRACING | SOURCE_IDENTIFIED | ENFORCEMENT | RESOLVED"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the cascade opened the case"
      - name: trace_method
        type: enum
        source: system
        description: "Most recent tracing technique supplied to start-tracing"
        default: null
        constraints: "DYE_TEST | SMOKE_TEST | CCTV | UPSTREAM_SAMPLING | null"
      - name: tracing_attempt_count
        type: integer
        source: computed
        description: "Number of times the case has entered TRACING"
        default: 0
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times the case cycled back to TRACING from SOURCE_IDENTIFIED or ENFORCEMENT"
        default: 0
      - name: source_description
        type: string
        source: system
        description: "Identified source narrative; cleared to null on reopen-tracing"
        default: null
      - name: responsible_party
        type: string
        source: system
        description: "Party held responsible for the discharge; cleared to null on reopen-tracing"
        default: null
      - name: enforcement_action_count
        type: integer
        source: computed
        description: "Count of EnforcementAction rows referencing this case with status in {ISSUED, ESCALATED, CLOSED}"
        default: 0
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the RESOLVED transition"
        default: null
      - name: resolution_note
        type: string
        source: system
        description: "Closure narrative supplied to resolve"
        default: null

  - name: ConstructionSite
    parent: null
    common_fields: true
    fields:
      - name: permit_term_id
        type: string
        source: input
        description: "FK -> PermitTerm.id; term providing construction-runoff coverage for this site"
      - name: site_name
        type: string
        source: input
        description: "Project name"
      - name: operator_name
        type: string
        source: input
        description: "Construction operator legally responsible for the site"
      - name: disturbed_acres
        type: number
        source: input
        description: "Land disturbance in acres; coverage requires >= 1.00"
        constraints: ">= 1.00; 2 decimal places"
      - name: esc_plan_reference
        type: string
        source: system
        description: "Erosion and sediment control plan reference from the latest submit-esc-plan call"
        default: null
      - name: plan_status
        type: enum
        source: system
        description: "First state dimension: erosion and sediment control plan review, cyclic through RETURNED"
        default: SUBMITTED
        constraints: "SUBMITTED | ESC_REVIEW | RETURNED | APPROVED"
      - name: field_status
        type: enum
        source: system
        description: "Second, independent state dimension: field condition of the site"
        default: PRE_CONSTRUCTION
        constraints: "PRE_CONSTRUCTION | ACTIVE_DISTURBANCE | STOP_WORK | CLOSED"
      - name: plan_review_round
        type: integer
        source: computed
        description: "Number of completed esc-review decisions on this site"
        default: 0
      - name: post_construction_control_required
        type: boolean
        source: computed
        description: "True when disturbed_acres >= 2.00; gates close on a recorded maintenance agreement"
        default: false
      - name: stop_work_reason
        type: string
        source: system
        description: "Reason recorded on the most recent STOP_WORK entry; cleared on release"
        default: null
      - name: stop_work_count
        type: integer
        source: computed
        description: "Number of times the site has entered STOP_WORK"
        default: 0
      - name: open_deficiency_score
        type: integer
        source: computed
        description: "deficiency_score of the FINALIZED CONSTRUCTION_ESC Inspection that triggered the current stop-work; 0 when not stopped"
        default: 0
      - name: open_enforcement_count
        type: integer
        source: computed
        description: "Count of EnforcementAction rows referencing this site with status in {ISSUED, ESCALATED}"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the CLOSED transition"
        default: null

  - name: PostConstructionFacility
    parent: null
    common_fields: true
    fields:
      - name: construction_site_id
        type: string
        source: input
        description: "FK -> ConstructionSite.id; site whose permanent control this facility is"
      - name: facility_type
        type: enum
        source: input
        description: "Structural control type"
        constraints: "BIORETENTION | WET_POND | INFILTRATION_TRENCH | UNDERGROUND_DETENTION"
      - name: ownership
        type: enum
        source: input
        description: "Owner class; PRIVATE facilities require a recorded maintenance agreement"
        constraints: "MUNICIPAL | PRIVATE"
      - name: design_capacity_cf
        type: number
        source: input
        description: "Design storage capacity in cubic feet"
        constraints: "> 0"
      - name: service_area_acres
        type: number
        source: input
        description: "Area treated by this facility, in acres"
        constraints: "> 0"
      - name: agreement_status
        type: enum
        source: computed
        description: "NOT_REQUIRED for MUNICIPAL ownership; PENDING at creation for PRIVATE; RECORDED after record-agreement"
        default: PENDING
        constraints: "NOT_REQUIRED | PENDING | RECORDED"
      - name: agreement_reference
        type: string
        source: system
        description: "Recorded maintenance agreement instrument reference"
        default: null
      - name: agreement_recorded_at
        type: datetime
        source: system
        description: "Instant supplied as recorded_at on record-agreement"
        default: null
      - name: inspection_interval_months
        type: integer
        source: system
        description: "Maintenance inspection interval agreed in the maintenance agreement"
        default: null
        constraints: "1..60"
      - name: last_inspection_finalized_at
        type: datetime
        source: computed
        description: "finalized_at of the most recent FINALIZED POST_CONSTRUCTION_MAINTENANCE Inspection, ordered by finalized_at DESC then created_at ASC"
        default: null
      - name: months_since_last_inspection
        type: integer
        source: computed
        description: "Whole months from last_inspection_finalized_at (or agreement_recorded_at when never inspected) to the logical clock, floor"
        default: 0
      - name: inspection_overdue
        type: boolean
        source: computed
        description: "True when agreement_status is RECORDED and months_since_last_inspection > inspection_interval_months"
        default: false
      - name: credit_eligible
        type: boolean
        source: computed
        description: "True when ownership is PRIVATE, agreement_status is RECORDED and inspection_overdue is false"
        default: false

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: inspection_type
        type: enum
        source: input
        description: "Discriminator selecting the subject foreign key, the scoring branch and the escalation target"
        constraints: "CONSTRUCTION_ESC | POST_CONSTRUCTION_MAINTENANCE"
      - name: construction_site_id
        type: string
        source: input
        description: "FK -> ConstructionSite.id; required when inspection_type is CONSTRUCTION_ESC, MUST be null otherwise"
        default: null
      - name: post_construction_facility_id
        type: string
        source: input
        description: "FK -> PostConstructionFacility.id; required when inspection_type is POST_CONSTRUCTION_MAINTENANCE, MUST be null otherwise"
        default: null
      - name: period_start
        type: string
        source: input
        description: "First day of the coverage period this inspection accounts for (ISO 8601 date)"
      - name: period_end
        type: string
        source: input
        description: "Last day of the coverage period, inclusive; MUST be >= period_start"
      - name: rainfall_trigger
        type: boolean
        source: input
        description: "CONSTRUCTION_ESC only: inspection was triggered by a qualifying rainfall event; ignored by the maintenance scoring branch"
        default: false
      - name: findings
        type: array
        source: system
        description: "Append-only list of objects { severity, description } added by POST /stormwater/inspections/{id}/findings"
        default: []
      - name: minor_finding_count
        type: integer
        source: computed
        description: "Count of findings with severity MINOR"
        default: 0
      - name: major_finding_count
        type: integer
        source: computed
        description: "Count of findings with severity MAJOR"
        default: 0
      - name: critical_finding_count
        type: integer
        source: computed
        description: "Count of findings with severity CRITICAL"
        default: 0
      - name: deficiency_score
        type: integer
        source: computed
        description: "Integer 0..100 from calculations.inspection_deficiency_score, frozen at finalize"
        default: 0
      - name: escalation_triggered
        type: boolean
        source: computed
        description: "True when deficiency_score >= 70 at finalize"
        default: false
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state"
        default: DRAFT
        constraints: "DRAFT | FINALIZED"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the FINALIZED transition"
        default: null
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID that finalized this inspection; blocked from issuing the resulting EnforcementAction"
        default: null

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - name: action_type
        type: enum
        source: input
        description: "Rung of the enforcement ladder; escalate advances it one step"
        constraints: "NOTICE_OF_VIOLATION | ADMINISTRATIVE_ORDER | CIVIL_PENALTY"
      - name: illicit_discharge_case_id
        type: string
        source: input
        description: "FK -> IllicitDischargeCase.id; set when the subject is an illicit discharge case"
        default: null
      - name: construction_site_id
        type: string
        source: input
        description: "FK -> ConstructionSite.id; set when the subject is a construction site"
        default: null
      - name: post_construction_facility_id
        type: string
        source: input
        description: "FK -> PostConstructionFacility.id; set when the subject is a privately owned permanent control"
        default: null
      - name: source_inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the FINALIZED inspection that documents the violation"
        default: null
      - name: subject_kind
        type: enum
        source: computed
        description: "Derived discriminator naming which subject foreign key is set"
        constraints: "ILLICIT_DISCHARGE_CASE | CONSTRUCTION_SITE | POST_CONSTRUCTION_FACILITY"
      - name: violation_days
        type: integer
        source: input
        description: "Documented days of continuing violation"
        default: 0
        constraints: ">= 0"
      - name: billable_violation_days
        type: integer
        source: computed
        description: "min(violation_days, 30)"
        default: 0
      - name: prior_assessed_total_cents
        type: integer
        source: computed
        description: "Sum of penalty_cents over other EnforcementAction rows on the same subject with status in {ISSUED, ESCALATED, CLOSED}, frozen before this row's own penalty is written"
        default: 0
      - name: escalation_multiplier
        type: number
        source: computed
        description: "Tier multiplier selected from prior_assessed_total_cents (1.00 / 1.50 / 2.25)"
        default: 1.00
      - name: penalty_cents
        type: integer
        source: computed
        description: "Assessed penalty from calculations.enforcement_penalty_assessment"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Enforcement lifecycle state; ESCALATED is a self-loop up the ladder"
        default: ISSUED
        constraints: "ISSUED | ESCALATED | CLOSED | RESCINDED"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the action was issued"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID that issued the action; system for cascade-generated actions"
      - name: last_escalated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent escalate call; drives the cooling-off check"
        default: null
      - name: escalation_count
        type: integer
        source: computed
        description: "Number of completed escalate calls"
        default: 0
      - name: auto_generated
        type: boolean
        source: system
        description: "True when the action was created by the inspection-finalize cascade rather than by an operator"
        default: false
      - name: compliance_note
        type: string
        source: system
        description: "Narrative supplied to close"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the CLOSED transition"
        default: null
      - name: rescinded_reason
        type: string
        source: system
        description: "Reason supplied to rescind"
        default: null
      - name: rescinded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the RESCINDED transition"
        default: null

  - name: StormwaterAccount
    parent: null
    common_fields: true
    fields:
      - name: permit_term_id
        type: string
        source: input
        description: "FK -> PermitTerm.id; term whose utility fee schedule bills this parcel"
      - name: parcel_id
        type: string
        source: input
        description: "Assessor parcel identifier; unique per permit_term_id"
      - name: owner_name
        type: string
        source: input
        description: "Billed property owner"
      - name: parcel_class
        type: enum
        source: input
        description: "Rate class selecting the surcharge percentage"
        constraints: "RESIDENTIAL_SINGLE | RESIDENTIAL_MULTI | COMMERCIAL | INSTITUTIONAL"
      - name: impervious_area_sqft
        type: integer
        source: input
        description: "Measured impervious area in square feet"
        constraints: ">= 0"
      - name: eru_units
        type: number
        source: computed
        description: "impervious_area_sqft / PermitTerm.eru_sqft rounded to 2 decimal places, round_half_up"
        default: 0.00
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "Sum of the three per-tier components, each rounded to whole cents before summing"
        default: 0
      - name: class_surcharge_cents
        type: integer
        source: computed
        description: "round_half_up(gross_fee_cents * class surcharge pct), computed after gross_fee_cents is rounded"
        default: 0
      - name: gross_billable_cents
        type: integer
        source: computed
        description: "gross_fee_cents + class_surcharge_cents"
        default: 0
      - name: total_credit_pct
        type: number
        source: computed
        description: "min(0.50, sum of FeeCreditApplication.approved_credit_pct for this account with status APPROVED), 4 decimal places"
        default: 0.0000
      - name: current_net_fee_cents
        type: integer
        source: computed
        description: "gross_billable_cents - round_half_up(gross_billable_cents * total_credit_pct); the FINAL-variant net fee"
        default: 0
      - name: last_billed_run_type
        type: enum
        source: system
        description: "Variant of the most recent billing run that billed this account"
        default: null
        constraints: "INTERIM | FINAL | null"
      - name: last_billed_net_cents
        type: integer
        source: computed
        description: "Net amount billed by the most recent billing run for this account"
        default: null
      - name: last_billed_credit_pct
        type: number
        source: computed
        description: "Credit percentage actually applied by the most recent billing run, 4 decimal places"
        default: null
      - name: last_billed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent billing run that billed this account"
        default: null

  - name: FeeCreditApplication
    parent: null
    common_fields: true
    fields:
      - name: stormwater_account_id
        type: string
        source: input
        description: "FK -> StormwaterAccount.id; account the credit would reduce"
      - name: post_construction_facility_id
        type: string
        source: input
        description: "FK -> PostConstructionFacility.id; privately owned control substantiating the credit"
        default: null
      - name: requested_credit_pct
        type: number
        source: input
        description: "Requested fee reduction as a fraction of gross_billable_cents"
        constraints: "> 0.0000 and <= 0.5000; 4 decimal places"
      - name: approved_credit_pct
        type: number
        source: system
        description: "Approved fraction; defaults to requested_credit_pct when review omits it"
        default: null
      - name: bmp_description
        type: string
        source: input
        description: "Narrative of the on-site best management practice"
      - name: status
        type: enum
        source: system
        description: "Cyclic review state; RETURNED rows re-enter SUBMITTED via resubmit"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | RETURNED | DENIED | REVOKED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the initial submission"
      - name: applicant_user_id
        type: string
        source: system
        description: "X-User-ID of the submitting actor"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the most recent review decision"
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the APPROVED transition; drives PROVISIONAL proration"
        default: null
      - name: return_reason
        type: string
        source: system
        description: "Reason recorded with a RETURNED decision"
        default: null
      - name: resubmission_count
        type: integer
        source: computed
        description: "Number of resubmit calls on this application"
        default: 0
      - name: revoked_reason
        type: string
        source: system
        description: "Reason recorded with a revoke call"
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the REVOKED transition"
        default: null

  - name: AnnualReport
    parent: null
    common_fields: true
    fields:
      - name: permit_term_id
        type: string
        source: input
        description: "FK -> PermitTerm.id; term this annual report covers"
      - name: reporting_period_start
        type: string
        source: input
        description: "First day of the reporting period (ISO 8601 date); MUST fall inside the permit term"
      - name: reporting_period_end
        type: string
        source: input
        description: "Last day of the reporting period, inclusive; MUST be >= reporting_period_start and inside the permit term"
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state; cascades revert COMPILED and CERTIFIED rows to DRAFT"
        default: DRAFT
        constraints: "DRAFT | COMPILED | CERTIFIED | SUBMITTED"
      - name: screenings_completed
        type: integer
        source: computed
        description: "Count of DRY_WEATHER_SCREENING observations with observed_at inside the closed reporting window"
        default: 0
      - name: outfall_screening_coverage_pct
        type: number
        source: computed
        description: "100 * distinct screened ACTIVE outfalls / count of ACTIVE outfalls in the term, 2 decimal places; 0.00 when the denominator is 0"
        default: 0.00
      - name: cases_opened
        type: integer
        source: computed
        description: "Count of IllicitDischargeCase rows with opened_at inside the reporting window"
        default: 0
      - name: cases_resolved
        type: integer
        source: computed
        description: "Count of IllicitDischargeCase rows with status RESOLVED and resolved_at inside the reporting window"
        default: 0
      - name: construction_inspections_finalized
        type: integer
        source: computed
        description: "Count of CONSTRUCTION_ESC Inspection rows with status FINALIZED and finalized_at inside the reporting window"
        default: 0
      - name: facility_inspections_finalized
        type: integer
        source: computed
        description: "Count of POST_CONSTRUCTION_MAINTENANCE Inspection rows with status FINALIZED and finalized_at inside the reporting window"
        default: 0
      - name: enforcement_actions_issued
        type: integer
        source: computed
        description: "Count of EnforcementAction rows with issued_at inside the reporting window and status in {ISSUED, ESCALATED, CLOSED}"
        default: 0
      - name: total_penalty_assessed_cents
        type: integer
        source: computed
        description: "Sum of penalty_cents over the same EnforcementAction set as enforcement_actions_issued"
        default: 0
      - name: swept_lane_miles
        type: number
        source: computed
        description: "Sum of lane_miles_swept over sweeping_runs whose run_start_date falls inside the reporting window, 2 decimal places"
        default: 0.00
      - name: net_annual_load_lb
        type: number
        source: computed
        description: "Sum of Outfall.last_assessed_net_load_lb over ACTIVE outfalls whose last_assessed_year equals the reporting year, 2 decimal places"
        default: 0.00
      - name: measurable_goals_met_count
        type: integer
        source: computed
        description: "Count of ACTIVE ControlMeasure rows with goal_status MET at compile time"
        default: 0
      - name: compliance_index
        type: number
        source: computed
        description: "Weighted mean of min(100, attainment_pct) over ACTIVE ControlMeasure rows, rounded once at the end to 2 decimal places"
        default: 0.00
      - name: compiled_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent compile"
        default: null
      - name: compiled_by_user_id
        type: string
        source: system
        description: "X-User-ID that compiled the report; barred from certifying it"
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID that certified the report"
        default: null
      - name: certification_statement
        type: string
        source: system
        description: "Certifying official's statement text"
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the CERTIFIED transition"
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SUBMITTED transition"
        default: null
      - name: invalidation_count
        type: integer
        source: computed
        description: "Number of times a cascade reverted this report to DRAFT"
        default: 0
      - name: invalidated_reason
        type: string
        source: system
        description: "Reason code of the most recent cascade invalidation (POSTURE_CHANGED | PENALTY_LEDGER_CHANGED)"
        default: null

# =============================================================================
# §1.2 State Machine Table
# 13 machines. ConstructionSite carries two independent dimensions
# (plan_status x field_status); ControlMeasure carries status plus the
# recomputed goal_status dimension; Outfall carries status plus the recomputed
# screening_status dimension.
# =============================================================================
state_machines:

  - entity: PermitTerm
    field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /stormwater/permit-terms/{id}/activate"
        actor: StormwaterProgramManager
        preconditions:
          - "all six measure_code values exist as ControlMeasure rows for this term with status ACTIVE"
          - "when tmdl_applicable is true, at least one Outfall with status ACTIVE exists for this term"
        side_effects:
          - "sets activated_at to the logical clock"
          - "recomputes compliance_posture, behind_measure_count and exceeding_outfall_count"
          - "increments version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /stormwater/permit-terms/{id}/expire"
        actor: StormwaterProgramManager
        preconditions:
          - "the logical clock is on or after term_end_date"
          - "no AnnualReport for this term has status DRAFT, COMPILED or CERTIFIED"
        side_effects:
          - "sets expired_at to the logical clock"
          - "transitions every ControlMeasure of this term with status ACTIVE to RETIRED"
          - "transitions every Outfall of this term with status ACTIVE to RETIRED"
          - "increments version by 1"

  - entity: ControlMeasure
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /stormwater/control-measures/{id}/retire"
        actor: StormwaterProgramManager
        preconditions:
          - "the owning PermitTerm.status is not ACTIVE, because an ACTIVE term MUST carry all six minimum control measures"
        side_effects:
          - "excludes the row from behind_measure_count, measurable_goals_met_count and compliance_index"
          - "recomputes PermitTerm.behind_measure_count and PermitTerm.compliance_posture"
          - "increments version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /stormwater/permit-terms/{id}/expire (cascade)"
        actor: StormwaterProgramManager
        preconditions:
          - "the owning PermitTerm transitions ACTIVE -> EXPIRED"
        side_effects:
          - "sets status to RETIRED without touching goal_status"
          - "increments version by 1"

  - entity: ControlMeasure
    field: goal_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: "MET | ON_TRACK | BEHIND"
        trigger: "POST /stormwater/control-measures/{id}/report-progress"
        actor: "StormwaterProgramManager | MunicipalOperationsSupervisor"
        preconditions:
          - "status is ACTIVE"
        side_effects:
          - "runs calculations.control_measure_goal_attainment; writes attainment_pct and goal_status"
          - "sets last_progress_reported_at to the logical clock"
          - "recomputes PermitTerm.behind_measure_count and PermitTerm.compliance_posture"
      - from: "MET | ON_TRACK"
        to: BEHIND
        trigger: "POST /stormwater/inspections/{id}/finalize (cascade, CONSTRUCTION_RUNOFF measure)"
        actor: ConstructionInspector
        preconditions:
          - "the cascade raised enforcement_count to 2 or more"
        side_effects:
          - "the enforcement gate override forces BEHIND irrespective of attainment_pct"
          - "recomputes PermitTerm posture, which may invalidate the AnnualReport"
      - from: "MET | ON_TRACK"
        to: BEHIND
        trigger: "POST /stormwater/outfalls/{id}/observations (cascade, ILLICIT_DISCHARGE measure)"
        actor: IDDEInvestigator
        preconditions:
          - "the cascade raised open_case_count above 3"
        side_effects:
          - "the open-case gate override forces BEHIND irrespective of attainment_pct"
          - "recomputes PermitTerm posture, which may invalidate the AnnualReport"
      - from: BEHIND
        to: "MET | ON_TRACK"
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/resolve (cascade) or POST /stormwater/enforcement-actions/{id}/rescind (cascade)"
        actor: "IDDEInvestigator | EnforcementOfficer"
        preconditions:
          - "every gate override for this measure_code has cleared"
        side_effects:
          - "goal_status reverts to the attainment_pct band"
          - "recomputes PermitTerm.behind_measure_count and PermitTerm.compliance_posture"

  - entity: Outfall
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /stormwater/outfalls/{id}/retire"
        actor: StormwaterProgramManager
        preconditions:
          - "open_case_count is 0"
        side_effects:
          - "excludes the row from AnnualReport screening-coverage denominators and net_annual_load_lb"
          - "recomputes PermitTerm.exceeding_outfall_count and PermitTerm.compliance_posture"
          - "increments version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /stormwater/permit-terms/{id}/expire (cascade)"
        actor: StormwaterProgramManager
        preconditions:
          - "the owning PermitTerm transitions ACTIVE -> EXPIRED"
        side_effects:
          - "sets status to RETIRED"
          - "increments version by 1"

  - entity: Outfall
    field: screening_status
    initial_state: NOT_SCREENED
    terminal_states: []
    transitions:
      - from: NOT_SCREENED
        to: CLEAR
        trigger: "POST /stormwater/outfalls/{id}/observations with observation_type DRY_WEATHER_SCREENING"
        actor: "IDDEInvestigator | MunicipalOperationsSupervisor"
        preconditions:
          - "calculations.dry_weather_screening_result returns CLEAR"
        side_effects:
          - "sets last_screened_at to observed_at and increments screening_count"
      - from: "NOT_SCREENED | CLEAR"
        to: SUSPECT
        trigger: "POST /stormwater/outfalls/{id}/observations with observation_type DRY_WEATHER_SCREENING"
        actor: "IDDEInvestigator | MunicipalOperationsSupervisor"
        preconditions:
          - "calculations.dry_weather_screening_result returns SUSPECT"
        side_effects:
          - "creates an IllicitDischargeCase with status OPEN, outfall_id set and origin_observation_id set to the new observation"
          - "increments open_case_count on the Outfall"
          - "recomputes ControlMeasure.open_case_count and goal_status for the ILLICIT_DISCHARGE measure of the term"
          - "sets last_screened_at to observed_at and increments screening_count"
      - from: SUSPECT
        to: CLEAR
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/resolve (cascade)"
        actor: IDDEInvestigator
        preconditions:
          - "resolving the case leaves open_case_count at 0"
        side_effects:
          - "recomputes ControlMeasure.open_case_count and goal_status for the ILLICIT_DISCHARGE measure"

  - entity: OutfallObservation
    field: validation_status
    initial_state: PENDING
    terminal_states: [NOT_APPLICABLE, VALIDATED, REJECTED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /stormwater/observations/{id}/validate with decision VALIDATE"
        actor: "MunicipalOperationsSupervisor | StormwaterProgramManager"
        preconditions:
          - "observation_type is WET_WEATHER_SAMPLE"
          - "recorded_by_user_id differs from the acting X-User-ID"
        side_effects:
          - "sets validated_at to the logical clock"
          - "admits sample_load_lb into both variants of calculations.outfall_annual_pollutant_load"
      - from: PENDING
        to: REJECTED
        trigger: "POST /stormwater/observations/{id}/validate with decision REJECT"
        actor: "MunicipalOperationsSupervisor | StormwaterProgramManager"
        preconditions:
          - "observation_type is WET_WEATHER_SAMPLE"
          - "recorded_by_user_id differs from the acting X-User-ID"
        side_effects:
          - "sets validated_at to the logical clock"
          - "excludes sample_load_lb from load assessments and raises the PROVISIONAL projected sample count"

  - entity: IllicitDischargeCase
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: TRACING
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/start-tracing"
        actor: IDDEInvestigator
        preconditions:
          - "the owning PermitTerm.status is ACTIVE"
        side_effects:
          - "records trace_method and increments tracing_attempt_count"
      - from: TRACING
        to: SOURCE_IDENTIFIED
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/identify-source"
        actor: IDDEInvestigator
        preconditions: []
        side_effects:
          - "records source_description and responsible_party"
      - from: SOURCE_IDENTIFIED
        to: ENFORCEMENT
        trigger: "POST /stormwater/enforcement-actions (illicit_discharge_case_id set)"
        actor: EnforcementOfficer
        preconditions:
          - "responsible_party is not null"
        side_effects:
          - "increments enforcement_action_count"
          - "adds the new penalty_cents to PermitTerm.total_assessed_penalty_cents"
      - from: SOURCE_IDENTIFIED
        to: TRACING
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing"
        actor: IDDEInvestigator
        preconditions:
          - "reopen_count is less than 3"
        side_effects:
          - "clears source_description and responsible_party to null"
          - "increments reopen_count and tracing_attempt_count"
      - from: ENFORCEMENT
        to: TRACING
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing"
        actor: IDDEInvestigator
        preconditions:
          - "reopen_count is less than 3"
          - "no EnforcementAction on this case has status ISSUED or ESCALATED"
        side_effects:
          - "clears source_description and responsible_party to null"
          - "increments reopen_count and tracing_attempt_count"
      - from: ENFORCEMENT
        to: RESOLVED
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/resolve"
        actor: IDDEInvestigator
        preconditions:
          - "every EnforcementAction on this case has status CLOSED or RESCINDED"
        side_effects:
          - "sets resolved_at and resolution_note"
          - "decrements Outfall.open_case_count and may revert screening_status to CLEAR"
          - "recomputes ControlMeasure.open_case_count and goal_status for the ILLICIT_DISCHARGE measure"
          - "recomputes PermitTerm.compliance_posture"
      - from: SOURCE_IDENTIFIED
        to: RESOLVED
        trigger: "POST /stormwater/illicit-discharge-cases/{id}/resolve"
        actor: IDDEInvestigator
        preconditions:
          - "no EnforcementAction on this case has status ISSUED or ESCALATED"
        side_effects:
          - "sets resolved_at and resolution_note"
          - "decrements Outfall.open_case_count and may revert screening_status to CLEAR"
          - "recomputes ControlMeasure.open_case_count and goal_status for the ILLICIT_DISCHARGE measure"

  - entity: ConstructionSite
    field: plan_status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: "SUBMITTED | RETURNED"
        to: ESC_REVIEW
        trigger: "POST /stormwater/construction-sites/{id}/submit-esc-plan"
        actor: ConstructionInspector
        preconditions:
          - "field_status is not CLOSED"
        side_effects:
          - "records esc_plan_reference"
      - from: ESC_REVIEW
        to: APPROVED
        trigger: "POST /stormwater/construction-sites/{id}/esc-review with decision APPROVE"
        actor: ConstructionInspector
        preconditions:
          - "the owning PermitTerm.status is ACTIVE"
        side_effects:
          - "increments plan_review_round"
          - "when field_status is PRE_CONSTRUCTION, advances field_status to ACTIVE_DISTURBANCE"
      - from: ESC_REVIEW
        to: RETURNED
        trigger: "POST /stormwater/construction-sites/{id}/esc-review with decision RETURN"
        actor: ConstructionInspector
        preconditions: []
        side_effects:
          - "increments plan_review_round"
          - "leaves field_status untouched"

  - entity: ConstructionSite
    field: field_status
    initial_state: PRE_CONSTRUCTION
    terminal_states: [CLOSED]
    transitions:
      - from: PRE_CONSTRUCTION
        to: ACTIVE_DISTURBANCE
        trigger: "POST /stormwater/construction-sites/{id}/esc-review with decision APPROVE (cascade)"
        actor: ConstructionInspector
        preconditions:
          - "plan_status becomes APPROVED"
        side_effects:
          - "the site becomes eligible for CONSTRUCTION_ESC inspections"
      - from: ACTIVE_DISTURBANCE
        to: STOP_WORK
        trigger: "POST /stormwater/inspections/{id}/finalize (cascade)"
        actor: ConstructionInspector
        preconditions:
          - "the finalized CONSTRUCTION_ESC inspection has deficiency_score of 70 or more"
        side_effects:
          - "sets stop_work_reason to AUTOMATIC_ESC_DEFICIENCY and open_deficiency_score to the inspection deficiency_score"
          - "increments stop_work_count"
          - "creates an EnforcementAction with action_type NOTICE_OF_VIOLATION, auto_generated true, source_inspection_id set"
          - "adds the new penalty_cents to PermitTerm.total_assessed_penalty_cents"
          - "recomputes ControlMeasure.enforcement_count and goal_status for the CONSTRUCTION_RUNOFF measure"
          - "recomputes PermitTerm.compliance_posture and may invalidate the AnnualReport"
      - from: ACTIVE_DISTURBANCE
        to: STOP_WORK
        trigger: "POST /stormwater/construction-sites/{id}/stop-work"
        actor: EnforcementOfficer
        preconditions:
          - "the owning PermitTerm.status is ACTIVE"
        side_effects:
          - "records stop_work_reason and increments stop_work_count"
      - from: STOP_WORK
        to: ACTIVE_DISTURBANCE
        trigger: "POST /stormwater/construction-sites/{id}/release-stop-work"
        actor: EnforcementOfficer
        preconditions:
          - "open_enforcement_count is 0"
          - "plan_status is APPROVED"
        side_effects:
          - "clears stop_work_reason to null and open_deficiency_score to 0"
      - from: ACTIVE_DISTURBANCE
        to: CLOSED
        trigger: "POST /stormwater/construction-sites/{id}/close"
        actor: ConstructionInspector
        preconditions:
          - "open_enforcement_count is 0"
          - "when post_construction_control_required is true, at least one PostConstructionFacility exists whose agreement_status is RECORDED or NOT_REQUIRED"
        side_effects:
          - "sets closed_at to the logical clock"
          - "blocks any further CONSTRUCTION_ESC inspection on the site"

  - entity: Inspection
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /stormwater/inspections/{id}/finalize"
        actor: ConstructionInspector
        preconditions:
          - "findings contains at least one entry"
          - "for CONSTRUCTION_ESC, the subject site field_status is ACTIVE_DISTURBANCE or STOP_WORK"
          - "for POST_CONSTRUCTION_MAINTENANCE, the subject facility agreement_status is RECORDED or NOT_REQUIRED"
        side_effects:
          - "freezes deficiency_score via calculations.inspection_deficiency_score and sets escalation_triggered"
          - "sets finalized_at and finalized_by_user_id"
          - "when escalation_triggered is true on a CONSTRUCTION_ESC inspection, drives the site into STOP_WORK and generates a NOTICE_OF_VIOLATION"
          - "updates PostConstructionFacility.last_inspection_finalized_at, months_since_last_inspection, inspection_overdue and credit_eligible for maintenance inspections"
          - "recomputes AnnualReport statistics eligibility for the covering report"

  - entity: EnforcementAction
    field: status
    initial_state: ISSUED
    terminal_states: [CLOSED, RESCINDED]
    transitions:
      - from: ISSUED
        to: ESCALATED
        trigger: "POST /stormwater/enforcement-actions/{id}/escalate"
        actor: EnforcementOfficer
        preconditions:
          - "action_type is not CIVIL_PENALTY"
          - "the logical clock is at least 14 days after issued_at"
        side_effects:
          - "advances action_type one rung up the ladder"
          - "recomputes prior_assessed_total_cents, escalation_multiplier and penalty_cents"
          - "adjusts PermitTerm.total_assessed_penalty_cents by the penalty delta"
          - "increments escalation_count and sets last_escalated_at"
      - from: ESCALATED
        to: ESCALATED
        trigger: "POST /stormwater/enforcement-actions/{id}/escalate"
        actor: EnforcementOfficer
        preconditions:
          - "action_type is not CIVIL_PENALTY"
          - "the logical clock is at least 14 days after last_escalated_at"
        side_effects:
          - "advances action_type one rung up the ladder"
          - "recomputes penalty_cents and adjusts PermitTerm.total_assessed_penalty_cents by the delta"
          - "increments escalation_count and sets last_escalated_at"
      - from: "ISSUED | ESCALATED"
        to: CLOSED
        trigger: "POST /stormwater/enforcement-actions/{id}/close"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "sets closed_at and compliance_note; penalty_cents stays in the ledger"
          - "decrements ConstructionSite.open_enforcement_count when the subject is a site"
      - from: "ISSUED | ESCALATED"
        to: RESCINDED
        trigger: "POST /stormwater/enforcement-actions/{id}/rescind"
        actor: EnforcementOfficer
        preconditions:
          - "escalation_count is 0"
        side_effects:
          - "sets rescinded_at and rescinded_reason"
          - "subtracts penalty_cents from PermitTerm.total_assessed_penalty_cents and sets penalty_cents to 0"
          - "decrements ConstructionSite.open_enforcement_count and ControlMeasure.enforcement_count"
          - "recomputes ControlMeasure.goal_status and PermitTerm.compliance_posture"

  - entity: FeeCreditApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /stormwater/fee-credit-applications/{id}/review with decision APPROVE"
        actor: UtilityBillingClerk
        preconditions:
          - "the substantiating PostConstructionFacility, when set, has credit_eligible true"
          - "the account's APPROVED credit total plus approved_credit_pct does not exceed 0.5000"
        side_effects:
          - "sets approved_at and approved_credit_pct"
          - "raises StormwaterAccount.total_credit_pct and lowers current_net_fee_cents"
          - "lowers PermitTerm.projected_annual_revenue_cents and may flip funding_adequacy_status to UNDERFUNDED"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /stormwater/fee-credit-applications/{id}/review with decision RETURN"
        actor: UtilityBillingClerk
        preconditions: []
        side_effects:
          - "records return_reason; the requested percentage leaves the INTERIM forward-looking credit pool"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /stormwater/fee-credit-applications/{id}/review with decision DENY"
        actor: UtilityBillingClerk
        preconditions: []
        side_effects:
          - "records return_reason as the denial rationale; no credit is ever applied"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /stormwater/fee-credit-applications/{id}/resubmit"
        actor: PropertyOwner
        preconditions:
          - "resubmission_count is less than 2"
          - "the acting X-User-ID equals applicant_user_id"
        side_effects:
          - "overwrites requested_credit_pct and bmp_description, clears return_reason"
          - "increments resubmission_count; the requested percentage re-enters the INTERIM credit pool"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /stormwater/fee-credit-applications/{id}/revoke"
        actor: UtilityBillingClerk
        preconditions: []
        side_effects:
          - "sets revoked_at and revoked_reason"
          - "removes approved_credit_pct from StormwaterAccount.total_credit_pct and restores current_net_fee_cents"
          - "raises PermitTerm.projected_annual_revenue_cents and may restore funding_adequacy_status to ADEQUATE"

  - entity: AnnualReport
    field: status
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: COMPILED
        trigger: "POST /stormwater/annual-reports/{id}/compile"
        actor: StormwaterProgramManager
        preconditions:
          - "the owning PermitTerm.status is ACTIVE"
          - "expected_permit_term_version matches PermitTerm.version"
          - "no OutfallObservation of the term with observation_type WET_WEATHER_SAMPLE and validation_status PENDING has observed_at inside the reporting window"
        side_effects:
          - "runs calculations.annual_report_statistics and writes every statistic field"
          - "sets compiled_at and compiled_by_user_id"
          - "sets PermitTerm.last_compiled_at and increments PermitTerm.version by 1"
      - from: COMPILED
        to: CERTIFIED
        trigger: "POST /stormwater/annual-reports/{id}/certify"
        actor: StormwaterProgramManager
        preconditions:
          - "the acting X-User-ID differs from compiled_by_user_id"
          - "PermitTerm.compliance_posture is not NON_COMPLIANT"
        side_effects:
          - "sets certified_at, certified_by_user_id and certification_statement"
      - from: CERTIFIED
        to: SUBMITTED
        trigger: "POST /stormwater/annual-reports/{id}/submit"
        actor: StormwaterProgramManager
        preconditions:
          - "the logical clock is on or before reporting_period_end plus 90 days"
        side_effects:
          - "sets submitted_at; the report becomes immutable to every cascade"
      - from: "COMPILED | CERTIFIED"
        to: DRAFT
        trigger: "cascade from POST /stormwater/inspections/{id}/finalize, POST /stormwater/outfalls/{id}/observations, POST /stormwater/enforcement-actions/{id}/rescind or POST /stormwater/control-measures/{id}/report-progress"
        actor: "ConstructionInspector | IDDEInvestigator | EnforcementOfficer | StormwaterProgramManager"
        preconditions:
          - "the cascade changed PermitTerm.compliance_posture or PermitTerm.total_assessed_penalty_cents"
          - "the triggering event timestamp falls inside the closed reporting window"
        side_effects:
          - "resets status to DRAFT, clears compiled_at, compiled_by_user_id, certified_at, certified_by_user_id, certification_statement"
          - "increments invalidation_count and sets invalidated_reason to POSTURE_CHANGED or PENALTY_LEDGER_CHANGED"

# =============================================================================
# §1.2.1 Concurrency Rules — optimistic concurrency control only
# =============================================================================
concurrency_rules:
  - id: OCC_ACCOUNT_IMPERVIOUS
    parent_entity: StormwaterAccount
    occ_field: expected_stormwater_account_version
    write_endpoint: "POST /stormwater/accounts/{id}/impervious-updates"
    guarantee: "The caller MUST submit expected_stormwater_account_version equal to the current StormwaterAccount.version; a stale value is rejected and no field changes."
    error_id: ERR_ACCOUNT_VERSION_CONFLICT
    http_status: 412
    rationale: "Impervious remeasurement rewrites eru_units, gross_billable_cents and the whole fee chain, so an update computed against a superseded impervious area MUST NOT land."

  - id: OCC_ACCOUNT_CREDIT
    parent_entity: StormwaterAccount
    occ_field: expected_stormwater_account_version
    write_endpoint: "POST /stormwater/fee-credit-applications"
    guarantee: "Creating a FeeCreditApplication requires expected_stormwater_account_version equal to the current StormwaterAccount.version; a stale value is rejected and no application row is created."
    error_id: ERR_ACCOUNT_VERSION_CONFLICT
    http_status: 412
    rationale: "The 0.5000 credit ceiling is evaluated against the account's current credit pool, so an application prepared against an outdated account snapshot MUST be refused."

  - id: OCC_REPORT_COMPILE
    parent_entity: PermitTerm
    occ_field: expected_permit_term_version
    write_endpoint: "POST /stormwater/annual-reports/{id}/compile"
    guarantee: "Compiling requires expected_permit_term_version equal to the current PermitTerm.version; a stale value is rejected and the report stays in DRAFT."
    error_id: ERR_PERMIT_TERM_VERSION_CONFLICT
    http_status: 412
    rationale: "Compiled statistics freeze the term's posture and penalty ledger; a compile prepared before a cascade moved either MUST be refused rather than publishing stale measurable goals."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: stormwater_utility_fee
    description: "Tiered equivalent-residential-unit fee with a parcel-class surcharge. Each tier component is rounded to whole cents BEFORE the components are summed, and the surcharge is computed from the already-rounded gross_fee_cents."
    trigger: "POST /stormwater/accounts, POST /stormwater/accounts/{id}/impervious-updates, POST /stormwater/permit-terms/{id}/billing-runs"
    inputs: [StormwaterAccount.impervious_area_sqft, StormwaterAccount.parcel_class, PermitTerm.eru_sqft]
    algorithm: tiered_pricing
    formula: |
      eru_units = round_half_up(impervious_area_sqft / PermitTerm.eru_sqft, 2)
      t1_eru = min(eru_units, TIER1_UPPER_ERU)
      t2_eru = min(max(eru_units - TIER1_UPPER_ERU, 0), TIER2_UPPER_ERU - TIER1_UPPER_ERU)
      t3_eru = max(eru_units - TIER2_UPPER_ERU, 0)
      c1 = round_half_up(t1_eru * RATE_TIER1_CENTS_PER_ERU, 0)
      c2 = round_half_up(t2_eru * RATE_TIER2_CENTS_PER_ERU, 0)
      c3 = round_half_up(t3_eru * RATE_TIER3_CENTS_PER_ERU, 0)
      gross_fee_cents = c1 + c2 + c3                                  # rounding happens per component
      class_surcharge_cents = round_half_up(gross_fee_cents * SURCHARGE_PCT[parcel_class], 0)
      gross_billable_cents = gross_fee_cents + class_surcharge_cents
    constants:
      TIER1_UPPER_ERU: 1.00
      TIER2_UPPER_ERU: 4.00
      RATE_TIER1_CENTS_PER_ERU: 9633
      RATE_TIER2_CENTS_PER_ERU: 8207
      RATE_TIER3_CENTS_PER_ERU: 6541
      SURCHARGE_PCT:
        RESIDENTIAL_SINGLE: 0.00
        RESIDENTIAL_MULTI: 0.05
        COMMERCIAL: 0.12
        INSTITUTIONAL: 0.08
    precision: "eru_units 2 decimal places round_half_up; every money value whole cents round_half_up"
    notes:
      - "Summing unrounded tier components and rounding once at the end is WRONG and produces a one-cent divergence on straddling parcels."

  - name: credit_adjusted_net_fee
    description: "Applies the fee-credit pool to gross_billable_cents. Dual variant: the INTERIM variant is forward looking and counts applications still under review at their requested percentage, while the FINAL variant counts only APPROVED applications at their approved percentage."
    trigger: "POST /stormwater/permit-terms/{id}/billing-runs; StormwaterAccount.current_net_fee_cents recompute on any credit status change"
    inputs: [StormwaterAccount.gross_billable_cents, FeeCreditApplication.status, FeeCreditApplication.requested_credit_pct, FeeCreditApplication.approved_credit_pct]
    algorithm: forward_looking
    formula: |
      raw_pct = sum over the account's FeeCreditApplication rows of contribution(row)
      applied_pct = min(MAX_CREDIT_PCT, round_half_up(raw_pct, 4))
      credit_cents = round_half_up(gross_billable_cents * applied_pct, 0)
      net_fee_cents = gross_billable_cents - credit_cents
    constants:
      MAX_CREDIT_PCT: 0.5000
    precision: "percentages 4 decimal places round_half_up; money whole cents round_half_up"
    variants:
      - name: FINAL
        when: "billing-runs called with run_type FINAL; also the variant behind StormwaterAccount.total_credit_pct and current_net_fee_cents"
        difference: "contribution(row) = approved_credit_pct when status is APPROVED, otherwise 0. SUBMITTED, RETURNED, DENIED and REVOKED rows contribute nothing."
      - name: INTERIM
        when: "billing-runs called with run_type INTERIM"
        difference: "contribution(row) = approved_credit_pct when status is APPROVED, requested_credit_pct when status is SUBMITTED, otherwise 0. Pending requests are provisionally honoured so the interim bill never over-charges an owner whose application is still under review."

  - name: dry_weather_screening_result
    description: "Classifies a dry-weather outfall screening as CLEAR or SUSPECT from the indicator panel."
    trigger: "POST /stormwater/outfalls/{id}/observations with observation_type DRY_WEATHER_SCREENING"
    inputs: [OutfallObservation.dry_weather_flow_present, OutfallObservation.indicator_bacteria_mpn, OutfallObservation.indicator_surfactant_mg_per_l, OutfallObservation.indicator_ammonia_mg_per_l]
    algorithm: threshold
    formula: |
      if dry_weather_flow_present is false: return CLEAR          # no flow, no discharge
      exceed_count = (indicator_bacteria_mpn > BACTERIA_LIMIT_MPN) + (indicator_surfactant_mg_per_l > SURFACTANT_LIMIT_MG_PER_L) + (indicator_ammonia_mg_per_l > AMMONIA_LIMIT_MG_PER_L)
      if exceed_count >= SUSPECT_INDICATOR_COUNT: return SUSPECT
      if indicator_surfactant_mg_per_l > SURFACTANT_HARD_TRIGGER_MG_PER_L: return SUSPECT
      return CLEAR
    constants:
      BACTERIA_LIMIT_MPN: 1000
      SURFACTANT_LIMIT_MG_PER_L: 0.25
      AMMONIA_LIMIT_MG_PER_L: 0.50
      SUSPECT_INDICATOR_COUNT: 2
      SURFACTANT_HARD_TRIGGER_MG_PER_L: 1.00
    precision: "comparisons are strict greater-than on the stored values; a value exactly at a limit does not count as an exceedance"
    notes:
      - "A null indicator is treated as not exceeding."
      - "The hard trigger makes a single overwhelming surfactant reading SUSPECT even when the other two indicators are clean."

  - name: inspection_deficiency_score
    description: "Weighted severity score, 0..100, frozen at finalize. The CONSTRUCTION_ESC branch applies a rainfall-event multiplier and a large-site adder; the POST_CONSTRUCTION_MAINTENANCE branch ignores rainfall and instead adds overdue and missing-agreement penalties."
    trigger: "POST /stormwater/inspections/{id}/finalize"
    inputs: [Inspection.inspection_type, Inspection.minor_finding_count, Inspection.major_finding_count, Inspection.critical_finding_count, Inspection.rainfall_trigger, ConstructionSite.disturbed_acres, PostConstructionFacility.inspection_overdue, PostConstructionFacility.ownership, PostConstructionFacility.agreement_status]
    algorithm: weighted_scoring
    formula: |
      base = WEIGHT_MINOR * minor_finding_count + WEIGHT_MAJOR * major_finding_count + WEIGHT_CRITICAL * critical_finding_count
      if inspection_type == CONSTRUCTION_ESC:
        if rainfall_trigger: base = round_half_up(base * RAINFALL_MULTIPLIER, 0)
        if ConstructionSite.disturbed_acres > LARGE_SITE_ACRES: base = base + LARGE_SITE_ADDER
      else:                                              # POST_CONSTRUCTION_MAINTENANCE
        if PostConstructionFacility.inspection_overdue: base = base + OVERDUE_ADDER
        if PostConstructionFacility.ownership == PRIVATE and PostConstructionFacility.agreement_status != RECORDED: base = base + NO_AGREEMENT_ADDER
      deficiency_score = min(100, base)
      escalation_triggered = deficiency_score >= ESCALATION_THRESHOLD
    constants:
      WEIGHT_MINOR: 8
      WEIGHT_MAJOR: 22
      WEIGHT_CRITICAL: 34
      RAINFALL_MULTIPLIER: 1.20
      LARGE_SITE_ACRES: 5.00
      LARGE_SITE_ADDER: 12
      OVERDUE_ADDER: 15
      NO_AGREEMENT_ADDER: 25
      ESCALATION_THRESHOLD: 70
    precision: "integer score; the rainfall multiplier is rounded to a whole number round_half_up before the adder"
    notes:
      - "Multiplier before adder: applying the adder first inflates the score."
      - "rainfall_trigger is a stored input on maintenance inspections but MUST NOT affect their score."

  - name: enforcement_penalty_assessment
    description: "Assessed penalty for one enforcement action: a ladder base amount plus a capped per-day component, multiplied by an escalation tier read from the penalties already assessed against the SAME SUBJECT by OTHER actions."
    trigger: "POST /stormwater/enforcement-actions, POST /stormwater/enforcement-actions/{id}/escalate, and the inspection-finalize cascade"
    inputs: [EnforcementAction.action_type, EnforcementAction.violation_days, "penalty_cents of the other EnforcementAction rows on the same subject"]
    algorithm: threshold
    formula: |
      billable_violation_days = min(violation_days, MAX_BILLABLE_DAYS)
      prior_assessed_total_cents = sum of penalty_cents over EnforcementAction rows on the SAME subject,
                                   EXCLUDING this row, whose status is in {ISSUED, ESCALATED, CLOSED}
      escalation_multiplier = 1.00 if prior_assessed_total_cents == 0
                              1.50 if 0 < prior_assessed_total_cents < REPEAT_TIER_CENTS
                              2.25 if prior_assessed_total_cents >= REPEAT_TIER_CENTS
      penalty_cents = round_half_up((BASE_CENTS[action_type] + PER_DAY_CENTS * billable_violation_days) * escalation_multiplier, 0)
    constants:
      BASE_CENTS:
        NOTICE_OF_VIOLATION: 25000
        ADMINISTRATIVE_ORDER: 50000
        CIVIL_PENALTY: 100000
      PER_DAY_CENTS: 2000
      MAX_BILLABLE_DAYS: 30
      REPEAT_TIER_CENTS: 100000
    precision: "whole cents, round_half_up"
    notes:
      - "Excluding this row is the point: on escalate the action's own previous penalty MUST NOT feed its new multiplier, otherwise every escalation compounds against itself."
      - "RESCINDED rows leave the prior total, so a rescission lowers the multiplier of subsequently issued actions on the same subject."

  - name: outfall_annual_pollutant_load
    description: "Annual pollutant load at one outfall in pounds. Dual variant: the FINAL variant sums only the VALIDATED wet-weather samples actually taken, while the PROVISIONAL variant additionally values the samples still owed for the year at the outfall's baseline concentration and design runoff volume."
    trigger: "POST /stormwater/outfalls/{id}/load-assessments; the FINAL variant additionally writes Outfall.tmdl_status and the last_assessed_* fields"
    inputs: [OutfallObservation.pollutant_concentration_mg_per_l, OutfallObservation.runoff_volume_kl, OutfallObservation.validation_status, Outfall.baseline_concentration_mg_per_l, Outfall.design_runoff_kl, PermitTerm.tmdl_applicable, PermitTerm.tmdl_wla_lb_per_year]
    algorithm: chronological
    formula: |
      sample_load_lb(o) = round_half_up(o.pollutant_concentration_mg_per_l * o.runoff_volume_kl * MG_PER_L_KL_TO_LB, 4)
      validated = WET_WEATHER_SAMPLE observations of this outfall with validation_status VALIDATED whose
                  observed_at falls inside the reporting year, ordered by observed_at ASC then created_at ASC
      taken_total = sum of sample_load_lb(o) over validated
      projected_unit_lb = round_half_up(baseline_concentration_mg_per_l * design_runoff_kl * MG_PER_L_KL_TO_LB, 4)
      projected_count = max(0, REQUIRED_SAMPLES_PER_YEAR - count(validated))      # PROVISIONAL only
      gross_load_lb = round_half_up(taken_total [+ projected_count * projected_unit_lb], 2)
      sweeping_credit_lb = calculations.sweeping_load_reduction_credit(gross_load_lb, outfall, reporting_year)
      net_load_lb = round_half_up(gross_load_lb - sweeping_credit_lb, 2)
      tmdl_status = NOT_ASSESSED when PermitTerm.tmdl_applicable is false
                    EXCEEDING when net_load_lb > PermitTerm.tmdl_wla_lb_per_year
                    ATTAINING otherwise
    constants:
      MG_PER_L_KL_TO_LB: 0.00220462
      REQUIRED_SAMPLES_PER_YEAR: 4
    precision: "per-sample loads 4 decimal places round_half_up; gross, credit and net loads 2 decimal places round_half_up"
    variants:
      - name: FINAL
        when: "load-assessments called with variant FINAL"
        difference: "projected_count is treated as 0, so only VALIDATED samples count. Writes Outfall.tmdl_status, last_assessed_gross_load_lb, last_assessed_credit_lb, last_assessed_net_load_lb and last_assessed_year, and recomputes PermitTerm.exceeding_outfall_count and compliance_posture."
      - name: PROVISIONAL
        when: "load-assessments called with variant PROVISIONAL"
        difference: "The samples still owed for the year are valued at projected_unit_lb each and added to the gross load. Nothing is persisted on the Outfall; tmdl_status is returned for information only."
    notes:
      - "A REJECTED sample raises projected_count in the PROVISIONAL variant and simply disappears from the FINAL variant."
      - "The comparison against the waste load allocation is strict greater-than, so a net load exactly equal to the allocation is ATTAINING."

  - name: sweeping_load_reduction_credit
    description: "Street-sweeping load reduction credit in pounds, earned from lane miles swept in the reporting year and capped at a fraction of the gross load."
    trigger: "invoked by calculations.outfall_annual_pollutant_load for both variants"
    inputs: [Outfall.sweeping_runs, "reporting_year", "gross_load_lb"]
    algorithm: aggregation
    formula: |
      lane_miles = sum of run.lane_miles_swept over sweeping_runs whose run_start_date year equals reporting_year
      earned_lb = round_half_up(lane_miles * LB_PER_LANE_MILE, 2)
      cap_lb = round_half_up(gross_load_lb * CREDIT_CAP_PCT, 2)
      sweeping_credit_lb = min(earned_lb, cap_lb)
    constants:
      LB_PER_LANE_MILE: 0.85
      CREDIT_CAP_PCT: 0.25
    precision: "2 decimal places, round_half_up"
    notes:
      - "The cap is evaluated against the variant's own gross_load_lb, so the same lane miles can be fully credited in the PROVISIONAL variant and capped in the FINAL one."

  - name: control_measure_goal_attainment
    description: "Recomputes ControlMeasure.attainment_pct and the goal_status dimension. Measure-specific compliance gates override the attainment band."
    trigger: "POST /stormwater/control-measures/{id}/report-progress, POST /stormwater/outfalls/{id}/sweeping-runs, and every cascade touching open_case_count or enforcement_count"
    inputs: [ControlMeasure.measure_code, ControlMeasure.measurable_goal_target, ControlMeasure.measurable_goal_actual, ControlMeasure.open_case_count, ControlMeasure.enforcement_count, ControlMeasure.salt_storage_covered, ControlMeasure.fleet_wash_recycle, ControlMeasure.last_progress_reported_at]
    algorithm: threshold
    formula: |
      attainment_pct = 0.00 if measurable_goal_target == 0
                       else round_half_up(100 * measurable_goal_actual / measurable_goal_target, 2)
      # gates, evaluated in this order and short-circuiting
      if measure_code == ILLICIT_DISCHARGE and open_case_count > MAX_OPEN_CASES: return BEHIND
      if measure_code == CONSTRUCTION_RUNOFF and enforcement_count >= MAX_SITE_ENFORCEMENTS: return BEHIND
      if measure_code == MUNICIPAL_OPERATIONS and (salt_storage_covered is false or fleet_wash_recycle is false): return BEHIND
      if last_progress_reported_at is null and measurable_goal_actual == 0: return PENDING
      if attainment_pct >= MET_PCT: return MET
      if attainment_pct >= ON_TRACK_PCT: return ON_TRACK
      return BEHIND
    constants:
      MAX_OPEN_CASES: 3
      MAX_SITE_ENFORCEMENTS: 2
      MET_PCT: 100.00
      ON_TRACK_PCT: 75.00
    precision: "attainment_pct 2 decimal places, round_half_up; band comparisons are greater-or-equal on the rounded percentage"
    notes:
      - "For MUNICIPAL_OPERATIONS the actual is not reported by hand: measurable_goal_actual mirrors swept_lane_miles_ytd, the sum of lane_miles_swept over every ACTIVE outfall of the term."
      - "A gate override wins even at 125% attainment; that is the whole point of the gate."

  - name: permit_term_compliance_posture
    description: "Program posture derived from the census of measures behind their goals and of outfalls exceeding their waste load allocation."
    trigger: "any change to ControlMeasure.goal_status, ControlMeasure.status, Outfall.tmdl_status or Outfall.status inside the term"
    inputs: [ControlMeasure.goal_status, ControlMeasure.status, Outfall.tmdl_status, Outfall.status]
    algorithm: aggregation
    formula: |
      behind_measure_count = count of ControlMeasure rows of the term with status ACTIVE and goal_status BEHIND
      exceeding_outfall_count = count of Outfall rows of the term with status ACTIVE and tmdl_status EXCEEDING
      if behind_measure_count >= NON_COMPLIANT_BEHIND_COUNT or (behind_measure_count >= 1 and exceeding_outfall_count >= 1):
        compliance_posture = NON_COMPLIANT
      elif behind_measure_count == 1 or exceeding_outfall_count >= 1:
        compliance_posture = AT_RISK
      else:
        compliance_posture = COMPLIANT
    constants:
      NON_COMPLIANT_BEHIND_COUNT: 2
    precision: "integer counts"
    notes:
      - "NON_COMPLIANT blocks AnnualReport certification, which is how the posture reaches the end of the cascade chain."

  - name: annual_report_statistics
    description: "Compiles the measurable-goal and enforcement statistics of a reporting period, including the weighted compliance index."
    trigger: "POST /stormwater/annual-reports/{id}/compile"
    inputs: [OutfallObservation.observed_at, IllicitDischargeCase.opened_at, IllicitDischargeCase.resolved_at, Inspection.finalized_at, EnforcementAction.issued_at, EnforcementAction.penalty_cents, Outfall.sweeping_runs, Outfall.last_assessed_net_load_lb, ControlMeasure.attainment_pct, ControlMeasure.weight, ControlMeasure.goal_status]
    algorithm: aggregation
    formula: |
      window = [reporting_period_start 00:00:00Z, reporting_period_end 23:59:59Z]        # closed on both ends
      screenings_completed = count of DRY_WEATHER_SCREENING observations of the term with observed_at in window
      outfall_screening_coverage_pct = 0.00 if no ACTIVE outfall in the term
                                       else round_half_up(100 * distinct ACTIVE outfalls with a screening in window / count of ACTIVE outfalls, 2)
      cases_opened / cases_resolved / construction_inspections_finalized / facility_inspections_finalized
        / enforcement_actions_issued = counts over the window as described in §1.1
      total_penalty_assessed_cents = sum of penalty_cents over the enforcement_actions_issued set
      swept_lane_miles = round_half_up(sum of lane_miles_swept over runs whose run_start_date is in window, 2)
      net_annual_load_lb = round_half_up(sum of last_assessed_net_load_lb over ACTIVE outfalls whose last_assessed_year equals the year of reporting_period_end, 2)
      measurable_goals_met_count = count of ACTIVE ControlMeasure rows with goal_status MET
      weighted_sum = sum over ACTIVE ControlMeasure rows of weight * min(100.00, attainment_pct)
      weight_total = sum over ACTIVE ControlMeasure rows of weight
      compliance_index = 0.00 if weight_total == 0 else round_half_up(weighted_sum / weight_total, 2)
    constants:
      INDEX_CEILING_PCT: 100.00
    precision: "counts are integers; percentages and loads 2 decimal places round_half_up; compliance_index is rounded ONCE at the end, never per measure"
    notes:
      - "Over-attainment is capped at 100.00 per measure before weighting, so a runaway measure cannot mask a measure that is behind."
      - "Rounding each measure's contribution before the weighted division drifts from the specified value."

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending priority; the FIRST
# violated rule determines the response and nothing is persisted.
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-ID header is present and names a known actor"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: all
    description: "Every endpoint, including the /_clock test-driving endpoint, requires an identified actor."

  - priority: 20
    category: auth
    check: "the actor's role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role authorisation precedes every existence, state and business check, so an unauthorised caller cannot probe which resources exist or what state they are in."

  - priority: 30
    category: request_shape
    check: "required body fields present; types, enum members, numeric ranges and ISO 8601 formats valid; pagination limit within 1..100 and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
    description: "Structural validation of the request itself, including disturbed_acres >= 1.00, requested_credit_pct in (0.0000, 0.5000] and weight in 1..5."

  - priority: 40
    category: existence
    check: "every id in the path resolves to a stored row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Path existence resolves before any referenced-body existence check."

  - priority: 50
    category: business_referential
    check: "every foreign key supplied in the body resolves to a stored row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /stormwater/control-measures", "POST /stormwater/outfalls", "POST /stormwater/construction-sites", "POST /stormwater/post-construction-facilities", "POST /stormwater/inspections", "POST /stormwater/enforcement-actions", "POST /stormwater/accounts", "POST /stormwater/fee-credit-applications", "POST /stormwater/annual-reports"]
    description: "Referential integrity of body foreign keys. Deliberately ABOVE every fiscal rule: an application naming a non-existent facility is 404, never a credit-ceiling 422."

  - priority: 60
    category: concurrency
    check: "expected_<parent>_version equals the parent's current version"
    error_id: "ERR_ACCOUNT_VERSION_CONFLICT | ERR_PERMIT_TERM_VERSION_CONFLICT"
    http_status: 412
    applies_to: ["POST /stormwater/accounts/{id}/impervious-updates", "POST /stormwater/fee-credit-applications", "POST /stormwater/annual-reports/{id}/compile"]
    description: "Optimistic concurrency control fires after existence and referential resolution but before any state or business rule, so a stale writer learns it is stale rather than being told its business intent is wrong."

  - priority: 65
    category: state
    check: "uniqueness of scoped natural keys: PermitTerm.permit_number globally, ControlMeasure.measure_code per term, Outfall.outfall_code per term, StormwaterAccount.parcel_id per term"
    error_id: "ERR_DUPLICATE_PERMIT_NUMBER | ERR_DUPLICATE_MEASURE_CODE | ERR_DUPLICATE_OUTFALL_CODE | ERR_DUPLICATE_PARCEL_ID"
    http_status: 409
    applies_to: ["POST /stormwater/permit-terms", "POST /stormwater/control-measures", "POST /stormwater/outfalls", "POST /stormwater/accounts"]
    description: "Scoped uniqueness."

  - priority: 70
    category: state
    check: "the target entity is in a state from which the requested transition exists"
    error_id: "ERR_PERMIT_TERM_NOT_ACTIVE | ERR_MEASURE_RETIRED | ERR_OUTFALL_RETIRED | ERR_CASE_INVALID_STATE | ERR_SITE_NOT_ACTIVE_DISTURBANCE | ERR_SITE_NOT_STOPPED | ERR_SITE_CLOSED | ERR_INSPECTION_NOT_DRAFT | ERR_OBSERVATION_NOT_PENDING | ERR_ENFORCEMENT_NOT_OPEN | ERR_CREDIT_APPLICATION_NOT_SUBMITTED | ERR_CREDIT_APPLICATION_NOT_RETURNED | ERR_CREDIT_APPLICATION_NOT_APPROVED | ERR_REPORT_NOT_DRAFT | ERR_REPORT_NOT_COMPILED | ERR_REPORT_NOT_CERTIFIED | ERR_AGREEMENT_ALREADY_RECORDED"
    http_status: 409
    applies_to: "all transition endpoints"
    description: "State-machine legality of the transition itself."

  - priority: 72
    category: state
    check: "the owning PermitTerm.status is ACTIVE for operational writes"
    error_id: ERR_PERMIT_TERM_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /stormwater/outfalls/{id}/observations", "POST /stormwater/outfalls/{id}/sweeping-runs", "POST /stormwater/illicit-discharge-cases/{id}/start-tracing", "POST /stormwater/construction-sites/{id}/esc-review", "POST /stormwater/construction-sites/{id}/stop-work", "POST /stormwater/inspections", "POST /stormwater/enforcement-actions", "POST /stormwater/permit-terms/{id}/billing-runs", "POST /stormwater/annual-reports/{id}/compile"]
    description: "Field, enforcement and billing work happens only under an ACTIVE permit term."

  - priority: 74
    category: state
    check: "activation requires all six measure_code values as ACTIVE ControlMeasure rows, and at least one ACTIVE Outfall when tmdl_applicable is true"
    error_id: ERR_MEASURE_SET_INCOMPLETE
    http_status: 422
    applies_to: ["POST /stormwater/permit-terms/{id}/activate"]
    description: "An MS4 permit cannot go ACTIVE without its full minimum control measure set."

  - priority: 75
    category: business_safety
    check: "the subject foreign key set matches inspection_type exactly: CONSTRUCTION_ESC requires construction_site_id and forbids post_construction_facility_id, and the reverse for POST_CONSTRUCTION_MAINTENANCE"
    error_id: ERR_INSPECTION_SUBJECT_MISMATCH
    http_status: 422
    applies_to: ["POST /stormwater/inspections"]
    description: "Polymorphic subject coherence."

  - priority: 75
    category: business_safety
    check: "a CONSTRUCTION_ESC inspection may be created only when the site plan_status is APPROVED"
    error_id: ERR_ESC_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: ["POST /stormwater/inspections"]
    description: "Erosion and sediment control review must be complete before the site is inspected against its plan. ABOVE the temporal overlap rule, so a returned plan reports the plan problem even when the requested period also overlaps."

  - priority: 75
    category: business_safety
    check: "exactly one of illicit_discharge_case_id, construction_site_id, post_construction_facility_id is supplied, and a supplied source_inspection_id has status FINALIZED and belongs to that subject"
    error_id: "ERR_ENFORCEMENT_SUBJECT_INVALID | ERR_SOURCE_INSPECTION_NOT_FINALIZED"
    http_status: 422
    applies_to: ["POST /stormwater/enforcement-actions"]
    description: "Enforcement always names one subject and, when documented by an inspection, a finalized one."

  - priority: 75
    category: business_safety
    check: "an observation's field set matches observation_type: DRY_WEATHER_SCREENING requires dry_weather_flow_present and forbids pollutant_concentration_mg_per_l and runoff_volume_kl; WET_WEATHER_SAMPLE requires both of those and forbids the three indicator fields"
    error_id: ERR_OBSERVATION_TYPE_FIELDS_INVALID
    http_status: 422
    applies_to: ["POST /stormwater/outfalls/{id}/observations"]
    description: "Type-conditional required field sets on the merged observation entity."

  - priority: 76
    category: business_safety
    check: "the acting X-User-ID differs from the row's originating user"
    error_id: "ERR_SELF_VALIDATION_FORBIDDEN | ERR_INSPECTOR_CANNOT_ENFORCE | ERR_SAME_USER_CERTIFICATION"
    http_status: 409
    applies_to: ["POST /stormwater/observations/{id}/validate", "POST /stormwater/enforcement-actions", "POST /stormwater/annual-reports/{id}/certify"]
    description: "Segregation of duties: a sample cannot be validated by the person who recorded it, an enforcement action cannot be issued by the inspector who finalized its source inspection, and a report cannot be certified by the person who compiled it."

  - priority: 77
    category: business_safety
    check: "release-stop-work requires open_enforcement_count 0 and plan_status APPROVED; close requires open_enforcement_count 0; resolving a case requires no ISSUED or ESCALATED action; expiring a term requires no report in DRAFT, COMPILED or CERTIFIED; retiring an outfall requires open_case_count 0"
    error_id: "ERR_SITE_HAS_OPEN_ENFORCEMENT | ERR_ESC_PLAN_NOT_APPROVED | ERR_CASE_HAS_OPEN_ENFORCEMENT | ERR_OPEN_REPORTS_EXIST | ERR_OUTFALL_HAS_OPEN_CASES"
    http_status: 409
    applies_to: ["POST /stormwater/construction-sites/{id}/release-stop-work", "POST /stormwater/construction-sites/{id}/close", "POST /stormwater/illicit-discharge-cases/{id}/resolve", "POST /stormwater/permit-terms/{id}/expire", "POST /stormwater/outfalls/{id}/retire"]
    description: "Cross-entity dependency guards: an aggregate may not reach a quiet state while its dependents are still live."

  - priority: 78
    category: business_safety
    check: "a site whose post_construction_control_required is true may close only when it has at least one PostConstructionFacility with agreement_status RECORDED or NOT_REQUIRED"
    error_id: ERR_CLOSE_REQUIRES_MAINTENANCE_AGREEMENT
    http_status: 422
    applies_to: ["POST /stormwater/construction-sites/{id}/close"]
    description: "Permanent controls on sites of two acres or more require a recorded maintenance agreement before the construction file is closed."

  - priority: 78
    category: business_safety
    check: "finalizing requires at least one finding, and a POST_CONSTRUCTION_MAINTENANCE inspection requires the facility agreement_status to be RECORDED or NOT_REQUIRED"
    error_id: "ERR_INSPECTION_NO_FINDINGS | ERR_AGREEMENT_NOT_RECORDED"
    http_status: 422
    applies_to: ["POST /stormwater/inspections/{id}/finalize"]
    description: "A finalized inspection with an empty findings list would freeze a meaningless score of 0."

  - priority: 79
    category: business_safety
    check: "reopen-tracing requires reopen_count below 3; resubmit requires resubmission_count below 2; rescind requires escalation_count 0; escalate requires action_type below CIVIL_PENALTY"
    error_id: "ERR_REOPEN_LIMIT_REACHED | ERR_RESUBMISSION_LIMIT_REACHED | ERR_RESCIND_AFTER_ESCALATION | ERR_LADDER_EXHAUSTED"
    http_status: 422
    applies_to: ["POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing", "POST /stormwater/fee-credit-applications/{id}/resubmit", "POST /stormwater/enforcement-actions/{id}/rescind", "POST /stormwater/enforcement-actions/{id}/escalate"]
    description: "Cycle-count ceilings on the cyclic machines and terminal-rung guard on the enforcement ladder."

  - priority: 79
    category: auth
    check: "resubmit is performed by the applicant_user_id of the application"
    error_id: ERR_NOT_APPLICANT
    http_status: 403
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/resubmit"]
    description: "Ownership check inside an allowed role: PropertyOwner is an entity-backed identity and may only resubmit its own application."

  - priority: 80
    category: business_temporal
    check: "two DRY_WEATHER_SCREENING observations on the same outfall must be at least 14 days apart, measured symmetrically in both directions from observed_at"
    error_id: ERR_SCREENING_INTERVAL_VIOLATION
    http_status: 409
    applies_to: ["POST /stormwater/outfalls/{id}/observations"]
    description: "Open interval semantics: exactly 14 days apart is accepted, 13 days 23 hours in either direction is refused. Back-dating into the buffer of a later screening is refused too."

  - priority: 80
    category: business_temporal
    check: "an inspection's [period_start, period_end] closed coverage interval must not overlap another inspection of the same inspection_type on the same subject; touching endpoints count as an overlap"
    error_id: ERR_INSPECTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: ["POST /stormwater/inspections"]
    description: "Closed-closed interval semantics: period_start equal to another inspection's period_end is a conflict."

  - priority: 80
    category: business_temporal
    check: "escalate requires the logical clock to be at least 14 days after last_escalated_at, or after issued_at when never escalated"
    error_id: ERR_ESCALATION_COOLING_OFF
    http_status: 409
    applies_to: ["POST /stormwater/enforcement-actions/{id}/escalate"]
    description: "Cooling-off period. ABOVE the fiscal no-decrease rule, so an early escalation that also lowers violation_days reports the cooling-off violation."

  - priority: 80
    category: business_temporal
    check: "expire requires the logical clock on or after term_end_date; submit requires the logical clock on or before reporting_period_end plus 90 days; a report window must lie inside [term_start_date, term_end_date]"
    error_id: "ERR_TERM_END_NOT_REACHED | ERR_REPORT_SUBMISSION_WINDOW_CLOSED | ERR_REPORT_WINDOW_OUTSIDE_TERM"
    http_status: 409
    applies_to: ["POST /stormwater/permit-terms/{id}/expire", "POST /stormwater/annual-reports/{id}/submit", "POST /stormwater/annual-reports"]
    description: "Term and reporting-window temporal containment; ERR_REPORT_WINDOW_OUTSIDE_TERM is returned with 422."

  - priority: 82
    category: business_temporal
    check: "a sweeping run's [run_start_date, run_end_date) half-open interval must not overlap another run on the same outfall; a run starting on the day a previous run ends is accepted"
    error_id: ERR_SWEEPING_RUN_OVERLAP
    http_status: 409
    applies_to: ["POST /stormwater/outfalls/{id}/sweeping-runs"]
    description: "Half-open interval semantics, deliberately different from the inspection coverage interval and from the screening buffer."

  - priority: 84
    category: state
    check: "compile requires no WET_WEATHER_SAMPLE observation with validation_status PENDING inside the reporting window"
    error_id: ERR_PENDING_SAMPLES_IN_WINDOW
    http_status: 422
    applies_to: ["POST /stormwater/annual-reports/{id}/compile"]
    description: "Monitoring data must be adjudicated before the statistics freeze."

  - priority: 85
    category: business_fiscal
    check: "approving a credit must not push the account's APPROVED credit total above 0.5000, and the substantiating facility, when named, must have credit_eligible true"
    error_id: "ERR_CREDIT_CEILING_EXCEEDED | ERR_FACILITY_NOT_CREDIT_ELIGIBLE"
    http_status: 422
    applies_to: ["POST /stormwater/fee-credit-applications/{id}/review"]
    description: "Aggregate fiscal ceiling on the credit pool. BELOW the referential rule at priority 50."

  - priority: 85
    category: business_fiscal
    check: "escalate must not lower the assessed penalty: a supplied violation_days must be greater than or equal to the stored violation_days"
    error_id: ERR_PENALTY_DECREASE_FORBIDDEN
    http_status: 422
    applies_to: ["POST /stormwater/enforcement-actions/{id}/escalate"]
    description: "Escalation is monotonic in money. BELOW the cooling-off rule at priority 80."

  - priority: 86
    category: business_fiscal
    check: "certification requires PermitTerm.compliance_posture other than NON_COMPLIANT"
    error_id: ERR_POSTURE_NON_COMPLIANT
    http_status: 422
    applies_to: ["POST /stormwater/annual-reports/{id}/certify"]
    description: "The end of every cascade chain: a program that is NON_COMPLIANT cannot have its annual report certified."

  - priority: 90
    category: business_aggregate
    check: "the lane miles recorded for a calendar month on one outfall must not exceed sweeping_capacity_lane_miles_per_month; a run is attributed to the month of run_start_date"
    error_id: ERR_SWEEPING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /stormwater/outfalls/{id}/sweeping-runs"]
    description: "Aggregate capacity: each individual run is plausible, but the monthly total is not."

# =============================================================================
# §1.5 API Endpoint Table — 66 endpoints. Path parameters are written {id}
# uniformly; the nested reads below are the FK reverse-reachability channel.
# =============================================================================
endpoints:

  # --- PermitTerm ---------------------------------------------------------
  - method: POST
    path: /stormwater/permit-terms
    description: "Create a permit term in DRAFT."
    roles: [StormwaterProgramManager]
    success_code: 201
    input: [permit_number, term_start_date, term_end_date, "tmdl_applicable?", "tmdl_pollutant?", "tmdl_wla_lb_per_year?", "eru_sqft?", "funding_target_cents?"]
    output: PermitTerm
    side_effects:
      - "status DRAFT, compliance_posture COMPLIANT, behind_measure_count 0, exceeding_outfall_count 0, total_assessed_penalty_cents 0, projected_annual_revenue_cents 0, funding_adequacy_status ADEQUATE"

  - method: GET
    path: /stormwater/permit-terms
    description: "List permit terms."
    roles: [StormwaterProgramManager, IDDEInvestigator, ConstructionInspector, EnforcementOfficer, MunicipalOperationsSupervisor, UtilityBillingClerk]
    success_code: 200
    input: ["status?", "compliance_posture?", "limit?", "offset?"]
    output: PermitTerm[]
    side_effects: []

  - method: GET
    path: /stormwater/permit-terms/{id}
    description: "Read one permit term with its derived posture, penalty ledger and revenue projection."
    roles: [StormwaterProgramManager, IDDEInvestigator, ConstructionInspector, EnforcementOfficer, MunicipalOperationsSupervisor, UtilityBillingClerk]
    success_code: 200
    input: []
    output: PermitTerm
    side_effects: []

  - method: POST
    path: /stormwater/permit-terms/{id}/activate
    description: "Move a DRAFT term to ACTIVE once the full minimum control measure set exists."
    roles: [StormwaterProgramManager]
    success_code: 200
    input: []
    output: PermitTerm
    side_effects:
      - "status ACTIVE; sets activated_at; recomputes compliance_posture; increments version by 1"

  - method: POST
    path: /stormwater/permit-terms/{id}/expire
    description: "Move an ACTIVE term to EXPIRED after term_end_date."
    roles: [StormwaterProgramManager]
    success_code: 200
    input: []
    output: PermitTerm
    side_effects:
      - "status EXPIRED; sets expired_at; retires every ACTIVE ControlMeasure and Outfall of the term; increments version by 1"

  - method: GET
    path: /stormwater/permit-terms/{id}/control-measures
    description: "Minimum control measures of a permit term."
    roles: [StormwaterProgramManager, IDDEInvestigator, ConstructionInspector, EnforcementOfficer, MunicipalOperationsSupervisor, UtilityBillingClerk]
    success_code: 200
    input: ["measure_code?", "status?", "goal_status?", "limit?", "offset?"]
    output: ControlMeasure[]
    side_effects: []

  - method: GET
    path: /stormwater/permit-terms/{id}/outfalls
    description: "Outfall inventory of a permit term."
    roles: [StormwaterProgramManager, IDDEInvestigator, MunicipalOperationsSupervisor, ConstructionInspector, EnforcementOfficer, UtilityBillingClerk]
    success_code: 200
    input: ["screening_status?", "tmdl_status?", "status?", "priority_tier?", "limit?", "offset?"]
    output: Outfall[]
    side_effects: []

  - method: GET
    path: /stormwater/permit-terms/{id}/construction-sites
    description: "Construction sites covered by a permit term."
    roles: [StormwaterProgramManager, ConstructionInspector, EnforcementOfficer, IDDEInvestigator, MunicipalOperationsSupervisor, UtilityBillingClerk]
    success_code: 200
    input: ["plan_status?", "field_status?", "limit?", "offset?"]
    output: ConstructionSite[]
    side_effects: []

  - method: GET
    path: /stormwater/permit-terms/{id}/accounts
    description: "Stormwater utility accounts billed under a permit term."
    roles: [StormwaterProgramManager, UtilityBillingClerk]
    success_code: 200
    input: ["parcel_class?", "limit?", "offset?"]
    output: StormwaterAccount[]
    side_effects: []

  - method: GET
    path: /stormwater/permit-terms/{id}/annual-reports
    description: "Annual reports of a permit term."
    roles: [StormwaterProgramManager, IDDEInvestigator, ConstructionInspector, EnforcementOfficer, MunicipalOperationsSupervisor, UtilityBillingClerk]
    success_code: 200
    input: ["status?", "limit?", "offset?"]
    output: AnnualReport[]
    side_effects: []

  - method: POST
    path: /stormwater/permit-terms/{id}/billing-runs
    description: "Run the utility fee billing for every account of the term, in the INTERIM (forward-looking credit pool) or FINAL (approved credits only) variant."
    roles: [UtilityBillingClerk]
    success_code: 200
    input: [run_type, period_start, period_end]
    output: "{ run_type: string, period_start: string, period_end: string, billed_account_count: integer, total_gross_billable_cents: integer, total_credit_cents: integer, total_net_billed_cents: integer }"
    side_effects:
      - "recomputes calculations.stormwater_utility_fee for every account of the term"
      - "writes last_billed_run_type, last_billed_credit_pct, last_billed_net_cents and last_billed_at on every billed account"
      - "recomputes PermitTerm.projected_annual_revenue_cents from the FINAL net fees and refreshes funding_adequacy_status"

  # --- ControlMeasure -----------------------------------------------------
  - method: POST
    path: /stormwater/control-measures
    description: "Register one minimum control measure under a permit term."
    roles: [StormwaterProgramManager]
    success_code: 201
    input: [permit_term_id, measure_code, measurable_goal_target, "weight?", "salt_storage_covered?", "fleet_wash_recycle?"]
    output: ControlMeasure
    side_effects:
      - "status ACTIVE, goal_status PENDING, attainment_pct 0.00, all derived counters 0"

  - method: GET
    path: /stormwater/control-measures/{id}
    description: "Read one control measure with its attainment and gate counters."
    roles: [StormwaterProgramManager, IDDEInvestigator, ConstructionInspector, EnforcementOfficer, MunicipalOperationsSupervisor, UtilityBillingClerk]
    success_code: 200
    input: []
