            - "the window 2026-09-22 .. 2026-10-06 is ADMITTED (201): 2026-09-22 is exactly existing.slot_end_date + 7 days, the first admissible start"
            - "SupplierSlotLine.${line_id}.reserved_slot_count == 3 and available_slot_count == 1 — only the three admitted reservations ${r1_id}, ${r2_id} and ${r3_id} occupy slots"
            - "SupplierSlotLine.${line_id}.version incremented only on the three admitted writes, so the two ${v1}-based rejections did not consume the version"
            - "all three reservations have status == RESERVED and none carries a unit_order_id"

      - name: bay_aggregate_capacity_over_closed_touching_windows
        grounds:
          - calculations.bay_concurrent_load
          - validations[priority=40]
          - errors.ERR_BAY_CAPACITY_EXCEEDED
          - state_machines.InspectionTrip.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Bay admission is an AGGREGATE sum over CLOSED intervals, so pairwise
          overlap alone is legal (6 + 4 == 10 is admitted), a trip touching an
          existing scheduled_end at the same second collides, one second past it
          does not, and cancelling a trip returns its committee_size to the pool.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE, one RELEASED specification, one PUMPER UnitOrder at build_status SPEC_LOCKED"
            - "one PlantBay with max_concurrent_visitors 10"
