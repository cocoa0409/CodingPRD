# =============================================================================
# Task 1924: Legal Aid Intake & Case Assignment — §1.9 Corner Design (breadth index)
# Enumerates every testable claim of §1.1–§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: client_create_returns_201_with_system_fields
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "POST /clients with all required fields returns 201; server stamps id, created_at, updated_at, version == 1 and defaults status to ACTIVE."
        test_recipe:
          setup: ["Intake worker exists"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
          trigger:
            - { call: "POST /clients", payload: { full_name: "Cli New", residence_county: "CountyA", household_size: 2, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { c_id: "$.data.id", c_ver: "$.data.version", c_status: "$.data.status" } }
          assert:
            - "HTTP 201; Client.${c_id}.version == 1"
            - "status defaults to ACTIVE; vulnerability_factors defaults to []"
            - "id, created_at, updated_at present and server-minted"

      - name: staff_create_omitting_max_units_applies_default_40
        claim_type: defaults
        grounds: [entities.StaffMember.fields.max_units]
        distinguishing_aspect: "Omitting max_units on staff create applies the declared default 40."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /staff-members", payload: { full_name: "Att Default", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { s_id: "$.data.id", s_max: "$.data.max_units", s_status: "$.data.status" } }
          assert:
            - "StaffMember.${s_id}.max_units == 40 (default applied)"
            - "status defaults to ACTIVE; weighted_open_units == 0; open_case_count == 0"

      - name: get_client_by_unknown_id_returns_not_found
        claim_type: not_found
        grounds: [entities.Client, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /clients/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_client_with_unknown_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A payload carrying an undeclared field is rejected with 400 ERR_INVALID_REQUEST (shape validation, priority 5)."
        test_recipe:
          setup: ["Intake worker exists"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
          trigger:
            - { call: "POST /clients", payload: { full_name: "Cli Bad", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 100, annual_countable_income_cents: 100, receives_means_tested_benefits: false, priority_score: 99 }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST (unknown field priority_score rejected, never silently stored)"

      - name: survey_response_has_no_version_field
        claim_type: immutability
        grounds: [entities.SatisfactionSurvey]
        distinguishing_aspect: "SatisfactionSurvey declares common_fields: false — the create response exposes id + created_at only, no version/updated_at; the entity has no update or delete endpoint."
        test_recipe:
          setup: ["A CLOSED advice case exists"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Surv", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "CONSUMER_DEBT", opposing_party_name: "Collector", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id" } }
            - { call: "POST /cases/${case_id}/close", payload: { outcome_code: "ADVICE_GIVEN", closure_reason: "advice complete" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /cases/${case_id}/satisfaction-surveys", payload: { score: 5, would_recommend: true, comments: "great" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { sv_id: "$.data.id" } }
          assert:
            - "HTTP 201; response data contains id and created_at"
            - "response data has NO version and NO updated_at key (common_fields: false)"

      - name: staff_supervision_self_reference_filter
        claim_type: parent_relationships
        grounds: [entities.StaffMember.fields.supervising_attorney_id]
        distinguishing_aspect: "The self-referential FK resolves: a paralegal created with supervising_attorney_id is found via GET /staff-members?supervising_attorney_id=<attorney>."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /staff-members", payload: { full_name: "Att Sup", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"] }, as: ProgramDirector, captures: { att_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Para One", staff_type: "PARALEGAL", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"], supervising_attorney_id: "${att_id}" }, as: ProgramDirector, captures: { para_id: "$.data.id" } }
            - { call: "GET /staff-members?supervising_attorney_id=${att_id}", payload: {}, as: ProgramDirector }
          assert:
            - "Paralegal.${para_id}.supervising_attorney_id == ${att_id}"
            - "Filtered list contains exactly the paralegal (self-referential reverse reachability)"

      - name: cases_filtered_by_attorney_and_status
        claim_type: listing
        grounds: [endpoints, entities.Case.fields.assigned_attorney_id]
        distinguishing_aspect: "Combined filters intersect: GET /cases?assigned_attorney_id=A&status=OPEN returns only attorney A's OPEN cases, not A's ON_HOLD case and not B's OPEN case."
        test_recipe:
          setup: ["Attorney A with one OPEN and one ON_HOLD advice case; attorney B with one OPEN advice case"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Att A", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"], max_units: 40 }, as: ProgramDirector, captures: { att_a: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Att B", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"], max_units: 40 }, as: ProgramDirector, captures: { att_b: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli F1", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { cl1: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${cl1}", case_type: "CONSUMER_DEBT", opposing_party_name: "X1", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { ap1: "$.data.id" } }
            - { call: "POST /intake-applications/${ap1}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap1}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap1}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap1}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { ca1: "$.data.id", ca1_v: "$.data.version" } }
            - { call: "POST /cases/${ca1}/assign", payload: { attorney_id: "${att_a}", expected_case_version: "${ca1_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /clients", payload: { full_name: "Cli F2", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { cl2: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${cl2}", case_type: "CONSUMER_DEBT", opposing_party_name: "X2", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { ap2: "$.data.id" } }
            - { call: "POST /intake-applications/${ap2}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap2}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap2}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap2}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { ca2: "$.data.id", ca2_v: "$.data.version" } }
            - { call: "POST /cases/${ca2}/assign", payload: { attorney_id: "${att_a}", expected_case_version: "${ca2_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /cases/${ca2}/place-hold", payload: {}, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /clients", payload: { full_name: "Cli F3", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { cl3: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${cl3}", case_type: "CONSUMER_DEBT", opposing_party_name: "X3", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { ap3: "$.data.id" } }
            - { call: "POST /intake-applications/${ap3}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap3}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap3}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${ap3}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { ca3: "$.data.id", ca3_v: "$.data.version" } }
            - { call: "POST /cases/${ca3}/assign", payload: { attorney_id: "${att_b}", expected_case_version: "${ca3_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
          trigger:
            - { call: "GET /cases?assigned_attorney_id=${att_a}&status=OPEN", payload: {}, as: SupervisingAttorney, as_user_id: "${sup_id}" }
          assert:
            - "Result contains exactly Case ${ca1} (attorney A, OPEN): total_count == 1"
            - "A's ON_HOLD case ${ca2} and B's OPEN case ${ca3} are both excluded"
      - name: reverse_reachability_subresource_and_filter
        claim_type: listing
        grounds: [endpoints, entities.ConflictCheck.fields.application_id, entities.SatisfactionSurvey.fields.case_id, entities.WaitlistEntry.fields.application_id]
        distinguishing_aspect: "FK reverse channels all answer: conflict checks via sub-resource list; case surveys via sub-resource (empty before closure); waitlist entries via filtered list (empty before enqueue)."
        test_recipe:
          setup: ["Application with one conflict check; a case with no survey; an application never waitlisted"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli RR", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "CONSUMER_DEBT", opposing_party_name: "Collector", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { cc_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id" } }
          trigger:
            - { call: "GET /intake-applications/${app_id}/conflict-checks", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "GET /cases/${case_id}/satisfaction-surveys", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "GET /waitlist-entries?application_id=${app_id}", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          assert:
            - "conflict-checks sub-resource returns exactly [${cc_id}]"
            - "satisfaction-surveys sub-resource returns an empty array with total_count 0 (case not closed)"
            - "waitlist filtered list returns total_count 0 (application never enqueued)"
  - section: state_machines
    instances:
      - name: application_created_in_initial_state_submitted
        claim_type: initial_state
        grounds: [state_machines.IntakeApplication]
        distinguishing_aspect: "A newly created IntakeApplication starts in SUBMITTED with computed screening fields still null."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Init", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
          trigger:
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id", st: "$.data.status" } }
          assert:
            - "status == SUBMITTED; version == 1"
            - "priority_score, gross_poverty_percentage, eligibility_determination, venue are null until screen"

      - name: decide_before_screen_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IntakeApplication.SCREENED_to_ELIGIBLE, "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "decide-eligibility from SUBMITTED (no screen yet) is not a from-state for any decide transition: 409 ERR_INVALID_APPLICATION_STATE, no side effects."
        test_recipe:
          setup: ["Client + application SUBMITTED"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Early", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_APPLICATION_STATE"
            - "Application remains SUBMITTED"

      - name: withdraw_from_ineligible_adds_no_extra_unmet_record
        claim_type: side_effect_execution
        grounds: [state_machines.IntakeApplication.INELIGIBLE_to_WITHDRAWN, entities.UnmetNeedRecord]
        distinguishing_aspect: "The INELIGIBLE -> WITHDRAWN transition deliberately creates NO additional UnmetNeedRecord (the OVER_INCOME record already exists); all other withdraw paths create CLIENT_WITHDRAWN."
        test_recipe:
          setup: ["Client over income; application decided INELIGIBLE (one OVER_INCOME UnmetNeedRecord exists)"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Rich", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 2000000, annual_countable_income_cents: 1900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "INELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          trigger:
            - { call: "POST /intake-applications/${app_id}/withdraw", payload: { withdrawal_reason: "client left" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { st: "$.data.status" } }
            - { call: "GET /unmet-need-records?application_id=${app_id}", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          assert:
            - "status == WITHDRAWN"
            - "Unmet-need list for the application contains exactly 1 record, with reason_code == OVER_INCOME (no CLIENT_WITHDRAWN duplicate)"

      - name: rescreen_from_eligible_returns_submitted
        claim_type: valid_transition
        grounds: [state_machines.IntakeApplication.ELIGIBLE_to_SUBMITTED, "concurrency_rules[application-rescreen-stale-version]"]
        distinguishing_aspect: "Cyclic rescreen ELIGIBLE -> SUBMITTED succeeds with the current expected_application_version and bumps version by 1."
        test_recipe:
          setup: ["Application decided ELIGIBLE (version after decide)"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Re", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
