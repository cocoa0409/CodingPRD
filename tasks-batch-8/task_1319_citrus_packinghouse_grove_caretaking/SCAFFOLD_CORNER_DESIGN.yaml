      - name: fruit_fly_protocol_block_market_specific
        claim_type: violation_to_error
        grounds: ["errors[ERR_FRUIT_FLY_PROTOCOL_BLOCK]", "validations[priority=7]", state_machines.ExportLot.BUILDING_to_INSPECTION_READY]
