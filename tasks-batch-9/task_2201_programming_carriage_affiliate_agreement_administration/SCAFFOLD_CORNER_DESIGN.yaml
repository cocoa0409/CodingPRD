          assert:
            - "all thirteen calls return status code 404 with response_type == \"error\""
            - "the distributor read returns data.error_id == \"ERR_DISTRIBUTOR_NOT_FOUND\" and the agreement read returns \"ERR_AGREEMENT_NOT_FOUND\""
            - "the subscriber-report read returns \"ERR_REPORT_NOT_FOUND\", the engagement read \"ERR_ENGAGEMENT_NOT_FOUND\" and the finding read \"ERR_FINDING_NOT_FOUND\""
            - "the content-title read returns \"ERR_TITLE_NOT_FOUND\", the rights-window read \"ERR_WINDOW_NOT_FOUND\" and the blackout read \"ERR_BLACKOUT_NOT_FOUND\""
            - "the commitment read returns \"ERR_COMMITMENT_NOT_FOUND\", the invoice read \"ERR_INVOICE_NOT_FOUND\", the mfn-clause read \"ERR_MFN_CLAUSE_NOT_FOUND\", the analysis read \"ERR_ANALYSIS_NOT_FOUND\" and the rate-card read \"ERR_RATE_CARD_ENTRY_NOT_FOUND\""
            - "all thirteen error_id values are pairwise distinct"

      - name: missing_or_unknown_role_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: >-
          Priority 1 separates "who are you" from "may you": a request with no
          X-User-Role, a request with no X-User-ID, and a request whose X-User-Role is
          the undeclared value ProgrammingIntern all return 401 ERR_UNAUTHENTICATED —
          never 403 ERR_FORBIDDEN_ROLE, which is reserved for the six declared roles
          acting outside their grants.
        test_recipe:
          setup:
            - "One Distributor exists so the target resource is real and only the headers are at fault."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
          trigger:
            - call: "GET /carriage/distributors/${dm_id}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "u-admin-1"
          assert:
            - "the trigger itself, sent with both headers present and a declared role, returns 200 with data.id == ${dm_id} — the control case"
            - "the same GET sent with the X-User-Role header omitted entirely returns 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the same GET sent with the X-User-ID header omitted entirely returns 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the same GET sent with X-User-Role: ProgrammingIntern returns 401 with data.error_id == \"ERR_UNAUTHENTICATED\", not 403 ERR_FORBIDDEN_ROLE"
            - "in all three failing cases response body response_type == \"error\" and meta.api_request_id is present"

      - name: liaison_cannot_reach_another_operators_records
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_DISTRIBUTOR_SCOPE_VIOLATION]
          - rbac.DistributorLiaison
        distinguishing_aspect: >-
          A DistributorLiaison is scoped by its own X-User-ID: reading its own
          agreement is 200, reading the OTHER operator's agreement with the same
          endpoint is 403 ERR_DISTRIBUTOR_SCOPE_VIOLATION, and filing a report against
          the other operator's agreement is the same error — the scope check at
          priority 4 runs before any state or version check.
        test_recipe:
          setup:
            - "Two distributors, each with one executed agreement."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
