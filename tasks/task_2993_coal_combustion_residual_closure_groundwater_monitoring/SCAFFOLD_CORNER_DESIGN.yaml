        grounds:
          - validations.priority_23_ERR_INVALID_AGREEMENT_STATE
          - validations.priority_56_ERR_COMMITTED_TONS_EXCEEDED
        excluded_because:
          difficulty_instance: agreement_state_outranks_committed_tons_ceiling_on_shipment
          rationale: "That instance violates both rules in one request and asserts the lower-numbered priority wins, then satisfies the state rule alone to show the second error surfacing."

      - name: validity_depends_on_another_entitys_state
        claim_type: cross_entity
        grounds:
          - validations.priority_14_ERR_LICENSE_NOT_ACTIVE
        excluded_because:
          difficulty_instance: stability_certification_gated_by_the_signing_professionals_license_state
          rationale: "That instance sends the identical payload twice against the identical unit and flips only the acting professional's license_status between the two calls."

      - name: a_write_that_is_valid_now_creates_a_future_schedule_conflict
        claim_type: temporal
        grounds:
          - validations.priority_40_ERR_SAMPLE_INTERVAL_TOO_SHORT
        excluded_because:
          difficulty_instance: sampling_interval_window_is_half_open_at_exactly_ninety_days
          rationale: "That instance walks the interval boundary at +89 and +90 days from the last VALIDATED event and shows the anchor moves only on validation."

      - name: individually_valid_commitments_collectively_exceed_the_inventory
        claim_type: aggregate
        grounds:
          - validations.priority_55_ERR_REUSE_COMMITMENT_OVERLAP
          - calculations.reuse_commitment_exposure
        excluded_because:
          difficulty_instance: adjacent_commitment_windows_touching_at_one_endpoint_exceed_the_ash_inventory
          rationale: "That instance qualifies two agreements that are each well inside the ash inventory and shows the second refused only because the summed exposure over the shared endpoint exceeds it."

  - section: endpoints
    instances:
      - name: program_patch_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/ccr/monitoring-programs/{id}
          - entities.MonitoringProgram.fields.statistical_method
          - entities.MonitoringProgram.fields.comparison_basis
          - entities.MonitoringProgram.fields.background_window_start_on
        distinguishing_aspect: |
          Every input on the PATCH is optional, so a request that carries only statistical_method must leave
          comparison_basis and both window bounds exactly as the previous PATCH set them, while still
          incrementing version. An implementation that treats the PATCH as a full replacement nulls the two
          window bounds and silently breaks network certification readiness.
        test_recipe:
          setup:
            - "One clean unit, whose creation minted a DETECTION-phase MonitoringProgram at version 1"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0139", unit_name: "Ash Pond 139", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
          trigger:
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTERWELL", background_window_start_on: "2025-01-01", background_window_end_on: "2025-12-31" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { statistical_method: "NONPARAMETRIC_PREDICTION_INTERVAL" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "GET /ccr/monitoring-programs/${prog_id}"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { prog_version: $.data.version }
          assert:
            - "before the triggers MonitoringProgram.${prog_id}.version == 1 with statistical_method == PARAMETRIC_PREDICTION_INTERVAL and both window bounds null"
            - "after trigger call 1 comparison_basis == INTERWELL, background_window_start_on == 2025-01-01, background_window_end_on == 2025-12-31 and version == 2"
            - "after trigger call 2 statistical_method == NONPARAMETRIC_PREDICTION_INTERVAL and version == 3"
            - "after trigger call 2 comparison_basis is still INTERWELL and both window bounds are still 2025-01-01 and 2025-12-31"
            - "the GET returns prog_version == 3 and phase == DETECTION with network_certified == false"
            - "MonitoringProgram.${prog_id}.unit_id == ${unit_id} and the row is the same id the unit reported as monitoring_program_id"

      - name: evaluation_compliance_well_must_be_a_downgradient_well_of_the_same_unit
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/ccr/statistical-evaluations
