  # =========================================================================
  # RULE 2 — combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: entry_fee_per_line_rounding_before_summation
        grounds:
          - calculations.entry_fee_assessment
          - entities.Entry.fields.entry_fee_cents
          - validations[priority=46]
          - errors[ERR_FEE_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Mode (b) order-of-operations: round_half_up is applied to each discounted fee LINE before
          multiplication and summation (3713 + 2 x 1238 + 2000 = 8189); rounding the discounted
          total once instead yields 8188, and the 8188 payment is rejected with
          ERR_FEE_AMOUNT_MISMATCH — a one-cent discriminator between the two evaluation orders.
        test_recipe:
          setup:
            - "Exhibition OPEN_FOR_ENTRIES with entry_fee_base_cents 4500, works_included_in_base 2, entry_fee_additional_cents 1500, member_discount_pct 0.175, max_works_per_entry 5."
            - "MEMBER artist from CA holding a DRAFT entry with four artworks, exactly one of which has longest_edge_cm 150 (> OVERSIZE_LONG_EDGE_CM 120)."
            - "Every artwork carries one PRIMARY image meeting the image standard."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
