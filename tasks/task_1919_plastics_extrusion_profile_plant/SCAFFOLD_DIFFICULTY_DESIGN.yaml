            - { call: "POST /blend-batches/${batch1}/qc", payload: { action: "RELEASE" }, as: QualityInspector }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die_a}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo1: $.data.id }
            - { call: "POST /work-orders/${wo1}/confirm", payload: {}, as: SalesEngineer }
