# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Recorder of Deeds / County Land Recording — Expert tier
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_package_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.DocumentPackage
          - endpoints
        distinguishing_aspect: "POST /packages with all required fields returns 201 and a SUBMITTED package echoing doc_type/declared_page_count."
        test_recipe:
          setup:
            - "Office and ACTIVE submitter exist."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "MORTGAGE", declared_page_count: 4, declared_consideration_cents: 0, first_page_top_margin_inches: 3.5, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "DocumentPackage.${pkg_id}.status == SUBMITTED"
            - "DocumentPackage.${pkg_id}.doc_type == MORTGAGE"
            - "DocumentPackage.${pkg_id}.resubmission_count == 0"
            - "DocumentPackage.${pkg_id}.version == 1"

      - name: get_package_not_found
        claim_type: Not Found
        grounds:
          - entities.DocumentPackage
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /packages/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (any authenticated reader)."]
          setup_api_calls:
            - call: "POST /submitters"
              payload: { name: "Reader", submitter_type: "SELF" }
              as: Clerk
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /packages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_package_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.DocumentPackage
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /packages omitting doc_type (required input) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Office and ACTIVE submitter exist."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", declared_page_count: 1, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: package_declared_consideration_defaults_zero
        claim_type: Defaults
        grounds:
          - entities.DocumentPackage.fields.declared_consideration_cents
        distinguishing_aspect: "Omitting declared_consideration_cents on POST /packages applies the default 0."
        test_recipe:
          setup: ["Office and ACTIVE submitter exist."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "OTHER", declared_page_count: 1, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id, dc: $.data.declared_consideration_cents }
          assert:
            - "DocumentPackage.${pkg_id}.declared_consideration_cents == 0"

      - name: system_fields_minted_on_office_create
        claim_type: System Fields
        grounds:
          - entities.RecordingOffice.fields.next_instrument_number
          - entities.RecordingOffice.fields.current_book
        distinguishing_aspect: "Office create mints next_instrument_number=instrument_seq_start, current_book=1, documents_in_current_book=0 regardless of any client input for those computed fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3, instrument_seq_start: 1000000 }
              as: Clerk
              captures: { off_id: $.data.id, nin: $.data.next_instrument_number, cb: $.data.current_book }
          assert:
            - "RecordingOffice.${off_id}.next_instrument_number == 1000000"
            - "RecordingOffice.${off_id}.current_book == 1"
            - "RecordingOffice.${off_id}.documents_in_current_book == 0"
            - "RecordingOffice.${off_id}.current_page == 1"

      - name: list_packages_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.DocumentPackage
          - endpoints
        distinguishing_aspect: "GET /packages returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Office + submitter with one package."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
          trigger:
            - call: "GET /packages"
              payload: { submitter_id: "${sub_id}", limit: 10, offset: 0 }
              as: Clerk
          assert:
            - "response_type == array"
            - "meta.total_count == 1"
            - "meta.has_more == false"

      - name: enum_invalid_doc_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.DocumentPackage.fields.doc_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /packages with doc_type='BOGUS' (not in enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Office + ACTIVE submitter."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "BOGUS", declared_page_count: 1, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: copy_search_field_combination_invalid
        claim_type: Type Constraints
        grounds:
          - entities.CopySearchRequest.fields.recorded_document_id
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /copy-search-requests with request_type=NAME_SEARCH but a recorded_document_id present violates the field-combination rule → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A submitter exists."]
          setup_api_calls:
            - call: "POST /submitters"
              payload: { name: "Requestor", submitter_type: "SELF" }
              as: Clerk
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /copy-search-requests"
              payload: { submitter_id: "${sub_id}", request_type: "NAME_SEARCH", recorded_document_id: "00000000-0000-4000-8000-000000000000" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: fk_party_entry_wrong_package_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.PartyEntry.fields.package_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /packages/{nonexistent}/party-entries returns ERR_NOT_FOUND (404) because the parent package does not exist."
        test_recipe:
          setup: ["A submitter exists."]
          setup_api_calls:
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /packages/00000000-0000-4000-8000-000000000000/party-entries"
              payload: { party_role: "GRANTOR", party_name: "X" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: begin_examination_from_recorded_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DocumentPackage
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "begin-examination on a RECORDED (terminal) package returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A DEED package fully recorded today (terminal RECORDED)."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 100000 }
              as: Clerk
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${pkg_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_v2: $.data.version }
            - call: "POST /packages/${pkg_id}/payments"
              payload: { amount_cents: 3500, method: "ESCROW", expected_package_version: "${pkg_v2}" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/record"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
          trigger:
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "DocumentPackage.${pkg_id}.status == RECORDED"

      - name: terminal_withdrawn_package_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DocumentPackage
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A WITHDRAWN package rejects begin-examination with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["A SUBMITTED package withdrawn by its owner."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/withdraw"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: plat_reject_branch
        claim_type: Valid Transition
        grounds:
          - state_machines.PlatSurvey.SUBMITTED_to_REJECTED
        distinguishing_aspect: "A SUBMITTED plat can branch to REJECTED via /plats/{id}/reject."
        test_recipe:
          setup: ["A SUBMITTED plat."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Surveyor", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /plats"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", subdivision_name: "OAK", block_number: 2, start_lot: 1, end_lot: 5 }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { plat_id: $.data.id }
          trigger:
            - call: "POST /plats/${plat_id}/reject"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { st: $.data.status }
          assert:
            - "PlatSurvey.${plat_id}.status == REJECTED"

      - name: ucc_lapsed_blocks_continuation
        claim_type: guarded transitions
        grounds:
          - state_machines.LienUccFiling.ACTIVE_to_LAPSED
          - errors[ERR_FILING_ALREADY_LAPSED]
        distinguishing_aspect: "After the clock advances past lapse_date, the filing reads LAPSED and a continuation is rejected with ERR_FILING_ALREADY_LAPSED."
        test_recipe:
          setup:
            - "UCC1 filing effective 2026-01-01 (lapse 2031-01-01); clock advanced to 2031-06-01 (past lapse)."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Lender", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "UCC1", parcel_id: "P-9", debtor_name: "D", effective_date: "2026-01-01T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-06-01T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /ucc-filings/${fil_id}/continue"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FILING_ALREADY_LAPSED"
            - "HTTP status == 409"

      - name: ucc_continuation_too_early
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LienUccFiling.ACTIVE_to_ACTIVE
          - errors[ERR_CONTINUATION_TOO_EARLY]
        distinguishing_aspect: "A continuation filed before the window opens (clock 2030-06-01, window opens 2030-07-05) returns ERR_CONTINUATION_TOO_EARLY."
        test_recipe:
          setup:
            - "UCC1 effective 2026-01-01 (lapse 2031-01-01); continuation window opens 2030-07-05; clock at 2030-06-01."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Lender", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "UCC1", parcel_id: "P-10", debtor_name: "D", effective_date: "2026-01-01T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2030-06-01T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /ucc-filings/${fil_id}/continue"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTINUATION_TOO_EARLY"
            - "HTTP status == 409"

      - name: correction_window_closed_next_day
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RecordedDocument.RECORDED_to_CORRECTED_VOID
          - errors[ERR_CORRECTION_WINDOW_CLOSED]
        distinguishing_aspect: "A void-correction attempted after the recording day (clock advanced one day) returns ERR_CORRECTION_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "A DEED package recorded on default day 2026-01-01; clock then advanced to 2026-01-02."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 100000 }
              as: Clerk
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${pkg_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_v2: $.data.version }
            - call: "POST /packages/${pkg_id}/payments"
              payload: { amount_cents: 3500, method: "ESCROW", expected_package_version: "${pkg_v2}" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/record"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
              captures: { rd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /recorded-documents/${rd_id}/void-correction"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CORRECTION_WINDOW_CLOSED"
            - "HTTP status == 409"
            - "RecordedDocument.${rd_id}.status == RECORDED"

      - name: reject_cascade_already_covered
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DocumentPackage.IN_EXAMINATION_to_REJECTED
        excluded_because:
          difficulty_instance: transitive_cascade / reject_voids_assessment_then_releases_hold
          rationale: "The reject→RejectionNotice→FeeAssessment VOIDED→escrow-hold-release cascade is fully asserted by the named §1.8 instance."

      - name: record_cascade_already_covered
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DocumentPackage.PAID_to_RECORDED
        excluded_because:
          difficulty_instance: transitive_cascade / record_mints_instrument_then_rolls_book
          rationale: "The record→instrument-mint→counter→book-roll cascade is fully asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: copy_search_fee_certified_copy
        claim_type: Correct Result
        grounds:
          - calculations.copy_search_fee
          - entities.CopySearchRequest.fields.fee_cents
        distinguishing_aspect: "A CERTIFIED_COPY request computes fee_cents == 1500."
        test_recipe:
          setup:
            - "A submitter and a RECORDED document to copy."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 100000 }
              as: Clerk
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
