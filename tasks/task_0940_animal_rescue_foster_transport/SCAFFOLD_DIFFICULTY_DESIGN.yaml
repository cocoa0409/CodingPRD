              as: PlatformAdmin
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /rescue/foster-homes/${home_id}"
              payload: {}
              as: PlatformAdmin
              captures: { home_v1: $.data.version }
          trigger:
