  - rule_id: transitive_cascade
    instances:
      - name: wind_down_chains_partnership_to_program_to_leads_and_courses_to_counselor_inactive
        grounds:
          - state_machines.Partnership.EXECUTED_to_WIND_DOWN
          - state_machines.Program.LAUNCHED_to_TEACH_OUT
          - state_machines.Lead.NEW|CONTACTED|APPLIED_to_DISQUALIFIED
          - state_machines.Course.FACULTY_REVIEW_to_DESIGN_SUSPENDED
          - state_machines.EnrollmentCounselor.performance:NOT_RATED|MEETS_STANDARD|WATCH|PROBATION_to_performance:INACTIVE_PENDING_REVIEW
        distinguishing_aspect: |
          Depth-4 chain triggered by the Partnership WIND_DOWN contract action: the
          Partnership status change causes the Program to enter TEACH_OUT, the Program's
          own TEACH_OUT entry causes its open Lead to be DISQUALIFIED and its
          FACULTY_REVIEW Course to become DESIGN_SUSPENDED, and that Lead
          disqualification causes the counselor's open_pipeline_count to reach 0 which in
          turn drives performance_status to INACTIVE_PENDING_REVIEW. Each hop is caused by
          the previous hop's mutation, not directly by the WIND_DOWN request.
        test_recipe:
          setup:
            - "EXECUTED Partnership; LAUNCHED Program 'MBA Online'."
            - "Course MBA-501 APPROVED (required_for_launch true) and Course MBA-502 left in FACULTY_REVIEW (required_for_launch false)."
            - "One counselor with incentive_eligibility ELIGIBLE, performance_status NOT_RATED, and exactly one Lead P-1001 in status CONTACTED so open_pipeline_count == 1."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - &c_course2_create
              call: "POST /programs/${pg_id}/courses"
              payload:
                course_code: "MBA-502"
                title: "Operations Strategy"
                credits: 3
                content_owner: "UNIVERSITY"
                design_cost_cents: 900000
                required_for_launch: false
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { c2_id: $.data.id }
            - *c_course_start
            - *c_course_submit
            - *c_course_approve
            - &c_course2_start
              call: "POST /courses/${c2_id}/design-actions"
              payload: { action: "START_DESIGN" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_course2_submit
              call: "POST /courses/${c2_id}/design-actions"
              payload: { action: "SUBMIT_FOR_FACULTY_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - *c_scope_marketing
            - *c_pg_submit
            - *c_pg_approve
            - *c_pg_launch
            - *c_co_create
            - *c_co_plan
            - *c_co_review_approve
            - *c_lead_create
            - *c_lead_contact
          trigger:
            - call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "WIND_DOWN", wind_down_reason: "Partner exit agreed", wind_down_effective_date: "2026-08-15" }
              as: UniversityProvost
              as_user_id: "provost-1"
          assert:
            - "Partnership.${ps_id}.status == WIND_DOWN"
            - "Partnership.${ps_id}.wind_down_effective_date == '2026-08-15'"
            - "Program.${pg_id}.status == TEACH_OUT"
            - "Lead.${ld_id}.status == DISQUALIFIED"
            - "Lead.${ld_id}.disqualification_reason == PROGRAM_TEACH_OUT"
            - "Course.${c2_id}.design_status == DESIGN_SUSPENDED"
            - "Course.${c1_id}.design_status == APPROVED"
            - "EnrollmentCounselor.${co_id}.open_pipeline_count == 0"
            - "EnrollmentCounselor.${co_id}.performance_status == INACTIVE_PENDING_REVIEW"
            - "EnrollmentCounselor.${co_id}.incentive_eligibility == ELIGIBLE"

      - name: withdrawal_chains_refund_to_clawback_accrual_to_incentive_suspension
        grounds:
          - state_machines.Enrollment.ENROLLED|ACTIVE_to_WITHDRAWN
          - calculations.withdrawal_refund_and_clawback
          - state_machines.EnrollmentCounselor.incentive:ELIGIBLE_to_incentive:SUSPENDED
          - entities.EnrollmentCounselor.fields.clawback_pending_cents
          - entities.TuitionPayment.fields.generated_by
        distinguishing_aspect: |
          Depth-3 chain triggered by the Enrollment WITHDRAW academic action — a different
          triggering transition from the WIND_DOWN cascade: the withdrawal creates a
          WITHDRAWAL_REFUND TuitionPayment of 281250 cents, that refund entry's 0.50 band
          causes the counselor to accrue clawback_pending_cents 50000, and that accrual
          reaching the 50000 trigger causes incentive_eligibility ELIGIBLE -> SUSPENDED.
        test_recipe:
          setup:
            - "EXECUTED Partnership, LAUNCHED Program, counselor with an APPROVED qualitative plan (variable_component_cents 100000) and incentive_eligibility ELIGIBLE, clawback_pending_cents 0."
            - "One ACTIVE Enrollment S-2001, 9 credits, tuition_charged_cents 562500, term 2026-09-01..2026-12-15, fully paid 562500 cents on 2026-09-05."
