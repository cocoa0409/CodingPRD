              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 0, teardown_minutes: 0, expected_program_version: "${p1_v}" }
              as: ProgramCoordinator
