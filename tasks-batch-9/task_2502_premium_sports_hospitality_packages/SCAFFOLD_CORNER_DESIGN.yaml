          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-10-05T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "GET /release-tranches/${tr_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { tr_st1: "$.data.tranche_state", tr_lapsed1: "$.data.lapsed_at" } }
            - { call: "GET /payment-installments/${pi1}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { pi_st1: "$.data.installment_state" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { cl_st1: "$.data.client_status", cl_oc1: "$.data.overdue_installment_count" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { d_st1: "$.data.deal_status", d_sf1: "$.data.shortfall_units" } }
            - { call: "GET /bookings/${bk_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_pay1: "$.data.payment_status" } }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { lapsed_n: "$.data.lapsed_tranche_count", overdue_n: "$.data.overdue_installment_count", sf_n: "$.data.shortfall_deal_count", chg_n: "$.data.client_status_change_count" } }
            - { call: "GET /release-tranches/${tr_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { tr_st2: "$.data.tranche_state", tr_lapsed2: "$.data.lapsed_at" } }
            - { call: "GET /payment-installments/${pi1}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { pi_st2: "$.data.installment_state" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { cl_st2: "$.data.client_status", cl_oc2: "$.data.overdue_installment_count" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { d_st2: "$.data.deal_status", d_sf2: "$.data.shortfall_units", d_ml2: "$.data.minimum_liability_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-12-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { cl_st3: "$.data.client_status", cl_oc3: "$.data.overdue_installment_count" } }
            - { call: "GET /release-tranches/${tr_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { tr_lapsed3: "$.data.lapsed_at" } }
          assert: >-
            The obligations are registered up front: ${tr_st0} == "PENDING" with
            ${tr_at0} == "2026-09-01T00:00:00.000Z"; ${bk_net} == 587520 and the
            first line is ${pi1_amt} == 176256 due ${pi1_due} ==
            "2026-08-04T00:00:00.000Z" in state ${pi1_st0} == "SCHEDULED".
            Thirty-four days past the promise and sixty-two days past the due
            date, with only the clock moved, EVERY row is unchanged:
            ${tr_st1} == "PENDING" and ${tr_lapsed1} == null,
            ${pi_st1} == "SCHEDULED", ${cl_st1} == "ACTIVE" with
            ${cl_oc1} == 0, ${d_st1} == "COMMITTED" with ${d_sf1} == 0, and
            ${bk_pay1} == "UNPAID" (not some "LATE" status invented on read).
            One sweep applies everything at once: ${lapsed_n} == 1,
            ${overdue_n} == 1, ${sf_n} == 1, ${chg_n} == 1, after which
            ${tr_st2} == "LAPSED" with ${tr_lapsed2} ==
            "2026-10-05T00:00:00.000Z" (the run's clock, not the promised date),
            ${pi_st2} == "OVERDUE", ${cl_st2} == "ON_HOLD" with
            ${cl_oc2} == 1, and ${d_st2} == "SHORTFALL_DECLARED" with
            ${d_sf2} == 20 and ${d_ml2} == 96000.
            Advancing the clock another two months without a run adds nothing:
            ${cl_st3} == "ON_HOLD", ${cl_oc3} == 1 (not 2, even though the
            second installment's due date has now passed) and
            ${tr_lapsed3} == "2026-10-05T00:00:00.000Z".

      - name: cascading_side_effects_layer_is_covered_by_the_difficulty_suite
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: postpone_event_depth4_cascade_to_host_counter_and_client_overdue
          rationale: >-
            The §0.5 cascade_depth instances already walk the deepest chain the
            scaffold has end-to-end — Event -> Booking -> AllocationBlock and
            PaymentInstallment -> HostAssignment -> OnSiteHost.active_assignment_count
            and Client.credit exposure — and the companion instance
            block_preemption_depth3_cascade_reverts_a_sold_allocation tests the
            ordering sensitivity of a second, independent chain. Repeating a
            shallower version here would add no discriminating power.

      - name: dual_variant_calculation_layer_is_covered_by_the_difficulty_suite
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: margin_report_provisional_vs_final_same_event
          rationale: >-
            Both declared dual-variant calculations are already differentiated on
            one fixture by the §0.5 variant instances: this one drives
            PROVISIONAL against FINAL on the same event and checks the delta
            attributable to the switch, and
            cancellation_fee_tier_schedule_vs_cost_recovery_same_booking_shape
            does the same for the settlement variants, including the selector that
            chooses between them.

  # ===========================================================================
  # §1.9 — consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_final_in_the_response_that_caused_it
        claim_type: immediate
        grounds: >-
          complexity_profile.consistency_model == immediate; §1.0 response
          envelope (single-object mutations return the whole entity);
          endpoints "POST /bookings" side effects (writes the full money
          breakdown and the schedule) and
          "POST /release-tranches/{id}/confirm" side effects (recomputes
          RightsDeal.released_units, deal_status, unallocated_units and the
          Event's fulfillment_risk_score in the same request).
        distinguishing_aspect: >-
          The test looks for lag in the two places it would hide: (1) the mutation's
          OWN response — the booking body must already carry the final money
          breakdown rather than zeros to be filled in later, and the confirm body
          must already carry confirmed_units; and (2) the FIRST read after the
          mutation, taken with no intervening call at all, across three different
          aggregates the write touched indirectly (the parent deal, the sibling
          block via the waterfall, the grandparent event's risk score, and the
          client's exposure). No sweep, no retry and no second read is permitted to
          be what makes the numbers right, and repeating the reads must produce the
          same values — an implementation that converges on the second read fails
          the equality between the two.
        test_recipe:
          setup: >-
            Canonical event with a COMMITTED 40-unit deal (guaranteed_minimum 20,
            unit_cost 8000), one CORPORATE allocation block of target 40 and one
            PENDING 40-unit tranche, plus a published BRONZE package and an
            ACTIVE CORPORATE client with a 50000000 credit limit.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
          trigger:
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv0: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${dv0}" }, as: RightsManager, as_user_id: u_rights, captures: { t_st: "$.data.tranche_state", t_conf: "$.data.confirmed_units", t_at: "$.data.confirmed_at" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { d_st: "$.data.deal_status", d_rel: "$.data.released_units", d_un: "$.data.unallocated_units", d_ml: "$.data.minimum_liability_cents" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { b_alloc: "$.data.allocated_units", b_st: "$.data.block_state" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { e_score: "$.data.fulfillment_risk_score", e_post: "$.data.risk_posture" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_id: "$.data.id", bk_gross: "$.data.gross_price_cents", bk_pct: "$.data.volume_discount_pct", bk_ds: "$.data.discounted_subtotal_cents", bk_comm: "$.data.partner_commission_cents", bk_sur: "$.data.guarantee_surcharge_cents", bk_net: "$.data.net_price_cents", bk_pay: "$.data.payment_status", bk_ful: "$.data.fulfillment_status" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { c_out: "$.data.outstanding_cents", c_st: "$.data.client_status" } }
            - { call: "GET /payment-installments", payload: { booking_id: "${bk_id}", limit: 10, offset: 0 }, as: FinanceController, as_user_id: u_fin, captures: { p1_amt: "$.data[0].amount_cents", p1_st: "$.data[0].installment_state" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { c_out2: "$.data.outstanding_cents" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { d_rel2: "$.data.released_units", d_un2: "$.data.unallocated_units" } }
          assert: >-
            The confirmation's own response is already complete:
            ${t_st} == "CONFIRMED", ${t_conf} == 40 and
            ${t_at} == "2026-08-01T00:00:00.000Z" — no field is left null for a
            later pass.
            The very first read of every aggregate it touched is already correct,
            with no intervening call: the parent deal reads ${d_st} ==
            "FULLY_RELEASED", ${d_rel} == 40, ${d_un} == 0 and ${d_ml} == 320000;
            the sibling block, which the waterfall filled in the same request,
            reads ${b_alloc} == 40 and ${b_st} == "EXHAUSTED"; the grandparent
            event's derived risk, recomputed in the same request, reads
            ${e_score} == 0 with ${e_post} == "NORMAL" (the release gap closed
            immediately, it did not decay to zero over subsequent reads).
            The booking's own 201 body carries the finished money breakdown, not
            placeholders: ${bk_gross} == 600000, ${bk_pct} == 0.0400,
            ${bk_ds} == 576000, ${bk_comm} == 17280, ${bk_sur} == 0 (the deal is
            fully released, so there is no exposure), ${bk_net} == 558720,
            ${bk_pay} == "UNPAID" and ${bk_ful} == "RESERVED".
            Its downstream writes are visible on first read too:
            ${c_out} == 558720 with ${c_st} == "ACTIVE", and the schedule already
            exists with ${p1_amt} == 167616 in state ${p1_st} == "SCHEDULED".
            Re-reading changes nothing — ${c_out2} == ${c_out},
            ${d_rel2} == ${d_rel} and ${d_un2} == ${d_un} — so the first read was
            not a stale snapshot that later converged.
