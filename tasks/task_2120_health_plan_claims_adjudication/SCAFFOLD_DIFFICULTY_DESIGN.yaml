# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2120 — Health Plan Claims Adjudication Engine
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contract_pricing_vs_fee_schedule_pricing_diverge_on_identical_line
        grounds:
          - calculations.line_allowed_amount
          - entities.Claim.fields.pricing_variant
          - entities.ClaimLine.fields.allowed_amount_cents
          - state_machines.ProviderContract.status.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          This dual variant lives in the ClaimLine / ProviderContract pricing domain: the identical
          service line priced 30200 cents under the CONTRACT_PRICED variant and 40000 cents under the
          FEE_SCHEDULE_PRICED variant, decided solely by whether an ACTIVE ProviderContract covers the
          service date.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan PPO-PRICE with deductible 0, oop_max 1000000 and coinsurance 0 so the allowed amount is the only moving part."
            - "Provider Alpha Imaging is IN_NETWORK; fee schedule rate for 73721 is 40000 cents per unit effective 2026-01-01."
            - "One ACTIVE ProviderContract for (Alpha Imaging, PPO-PRICE) with pricing_method PCT_OF_FEE_SCHEDULE and contract_pct 0.755 covering 2026-01-01..2026-12-31."
            - "Member M-PRICE-1 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "Claim CLM-PV-1 carries one 73721 line, 1 unit, billed 60000, service date 2026-02-10."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "PPO-PRICE", name: "Pricing Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000001", name: "Alpha Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-PRICE-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-12-31", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.755 }
              as: NetworkManager
              captures: { ctr_id: $.data.id }
            - call: "POST /adjudication/contracts/${ctr_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PV-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c1_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/contracts/${ctr_id}/terminate"
              payload: { term_date: "2026-02-01" }
              as: NetworkManager
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PV-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 61000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c2_id: $.data.id }
            - call: "POST /adjudication/claims/${c2_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "Claim.${c1_id}.pricing_variant == CONTRACT_PRICED"
            - "Claim.${c1_id}.total_allowed_cents == 30200"
            - "Claim.${c2_id}.pricing_variant == FEE_SCHEDULE_PRICED"
            - "Claim.${c2_id}.total_allowed_cents == 40000"
            - "Claim.${c2_id}.duplicate_of_claim_id == null (billed differs by 1000 cents, above the 500-cent duplicate tolerance)"

      - name: cob_come_out_whole_vs_non_duplication_diverge_on_identical_claim
        grounds:
          - calculations.cob_secondary_plan_payment
          - entities.BenefitPlan.fields.cob_method
          - entities.Claim.fields.cob_role
          - entities.MemberCoverage.fields.cob_order
        distinguishing_aspect: |
          This dual variant lives in the Claim / BenefitPlan coordination-of-benefits domain — a
          different entity domain from the ClaimLine pricing variant: identical allowed amount 40000
          and other-payer payment 24000 yield plan-paid 16000 / member 0 under COME_OUT_WHOLE and
          plan-paid 4000 / member 12000 under NON_DUPLICATION.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "Two BenefitPlans identical except cob_method: COB-CW uses COME_OUT_WHOLE, COB-ND uses NON_DUPLICATION; both have deductible 0, oop_max 1000000 and coinsurance 0.30."
            - "Both plans publish fee schedule rate 73721 = 40000 cents effective 2026-01-01."
            - "One IN_NETWORK provider Beta Imaging serves both members."
            - "Member M-CW is enrolled in COB-CW and member M-ND in COB-ND; each has one open-ended SECONDARY coverage segment from 2026-01-01, so both claims compute cob_role SECONDARY."
            - "Each member has one claim with a single 73721 line, 1 unit, billed 60000, service date 2026-02-10, and other_payer_paid_cents 24000 reported at intake."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "COB-CW", name: "COB Come Out Whole", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0.30, cob_method: "COME_OUT_WHOLE" }
              as: PlanAdmin
              captures: { plan_cw: $.data.id }
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "COB-ND", name: "COB Non Duplication", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0.30, cob_method: "NON_DUPLICATION" }
              as: PlanAdmin
              captures: { plan_nd: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000002", name: "Beta Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_cw}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/benefit-plans/${plan_nd}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-CW", plan_id: "${plan_cw}" }
              as: PlanAdmin
              captures: { mem_cw: $.data.id }
            - call: "POST /adjudication/members/${mem_cw}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "SECONDARY", other_payer_name: "Other Health" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-ND", plan_id: "${plan_nd}" }
              as: PlanAdmin
              captures: { mem_nd: $.data.id }
            - call: "POST /adjudication/members/${mem_nd}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "SECONDARY", other_payer_name: "Other Health" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-COB-CW", member_id: "${mem_cw}", provider_id: "${prov_id}", other_payer_paid_cents: 24000, lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_cw: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-COB-ND", member_id: "${mem_nd}", provider_id: "${prov_id}", other_payer_paid_cents: 24000, lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_nd: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_cw}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims/${c_nd}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "Claim.${c_cw}.cob_role == SECONDARY and Claim.${c_nd}.cob_role == SECONDARY"
            - "Claim.${c_cw}.total_allowed_cents == 40000 and Claim.${c_nd}.total_allowed_cents == 40000"
            - "Claim.${c_cw}.total_plan_paid_cents == 16000"
            - "Claim.${c_cw}.total_member_liability_cents == 0"
            - "Claim.${c_nd}.total_plan_paid_cents == 4000"
            - "Claim.${c_nd}.total_member_liability_cents == 12000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_before_summation_pinned_on_contract_pricing
        grounds:
          - calculations.line_allowed_amount
          - entities.Claim.fields.total_allowed_cents
          - entities.ProviderContract.fields.contract_pct
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents: three identical lines priced
          3333 x 0.755 sum to 7548 under the pinned round-per-line-then-sum order and to 7549 under
          the forbidden sum-then-round order, a one-cent divergence the scaffold resolves explicitly.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan ROUND-1 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Gamma Lab with an ACTIVE PCT_OF_FEE_SCHEDULE contract at contract_pct 0.755 covering 2026-01-01..2026-12-31."
            - "Fee schedule rate for 82947 is 3333 cents per unit effective 2026-01-01."
            - "Member M-ROUND-1 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "Claim CLM-ROUND-1 carries three 82947 lines (line_number 1, 2, 3), 1 unit each, billed 5000 each, service date 2026-02-10, so the billed cap never binds."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "ROUND-1", name: "Rounding Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000003", name: "Gamma Lab", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "82947", allowed_amount_cents: 3333, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-12-31", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.755 }
              as: NetworkManager
              captures: { ctr_id: $.data.id }
            - call: "POST /adjudication/contracts/${ctr_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-ROUND-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-ROUND-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "82947", units: 1, billed_amount_cents: 5000, service_date: "2026-02-10" }, { line_number: 2, procedure_code: "82947", units: 1, billed_amount_cents: 5000, service_date: "2026-02-10" }, { line_number: 3, procedure_code: "82947", units: 1, billed_amount_cents: 5000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "Claim.${c_id}.total_allowed_cents == 7548"
            - "Claim.${c_id}.total_allowed_cents != 7549"
            - "GET /adjudication/claim-lines?claim_id=${c_id} returns three lines each with allowed_amount_cents == 2516"
            - "Claim.${c_id}.pricing_variant == CONTRACT_PRICED"

      - name: oop_cap_uses_pass_start_accumulator_snapshot_not_midclaim_reread
        grounds:
          - calculations.oop_cap_reconciliation
          - calculations.line_member_cost_share
          - entities.BenefitAccumulator.fields.oop_applied_cents
          - entities.ClaimLine.fields.member_liability_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the member's
          liability is capped by out-of-pocket room that the same claim consumes, and the pinned order
          (snapshot, cap the claim total, relieve lines line_number DESC, write the accumulator only at
          finalize) yields line liabilities 4000 / 0, whereas re-reading the accumulator between lines
          would yield 10000 / 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan OOP-CAP with deductible 0, oop_max 10000 and coinsurance 0.50."
            - "IN_NETWORK provider Delta Clinic, no contract, so pricing is FEE_SCHEDULE_PRICED."
            - "Fee schedule rate for 73721 is 20000 cents per unit effective 2026-01-01."
            - "Member M-OOP-1 has one open-ended PRIMARY coverage segment from 2026-01-01 and a BenefitAccumulator for plan_year 2026 seeded to oop_applied_cents 6000 by a manual adjustment."
            - "Claim CLM-OOP-1 carries two 73721 lines (line_number 1 and 2), 1 unit each, billed 30000 each, service date 2026-02-10, so each line's allowed amount is 20000."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "OOP-CAP", name: "Out Of Pocket Cap Plan", deductible_individual_cents: 0, oop_max_individual_cents: 10000, coinsurance_member_pct: 0.50 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000004", name: "Delta Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 20000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-OOP-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "GET /adjudication/members/${mem_id}/accumulators"
              payload: {}
              as: PlanAdmin
              captures: { acc_id: "$.data[0].id", acc_v: "$.data[0].version" }
            - call: "POST /adjudication/accumulators/${acc_id}/adjustments"
              payload: { expected_accumulator_version: "${acc_v}", deductible_delta_cents: 0, oop_delta_cents: 6000 }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-OOP-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 30000, service_date: "2026-02-10" }, { line_number: 2, procedure_code: "73721", units: 1, billed_amount_cents: 30000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "Claim.${c_id}.total_allowed_cents == 40000"
            - "Claim.${c_id}.total_member_liability_cents == 4000"
            - "Claim.${c_id}.total_plan_paid_cents == 36000"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 1 has member_liability_cents == 4000 and plan_paid_cents == 16000"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 2 has member_liability_cents == 0 and plan_paid_cents == 20000"
            - "BenefitAccumulator.${acc_id}.oop_applied_cents == 6000 (unchanged: adjudication never writes the accumulator)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_pended_self_loop_then_adjudicated_back_to_received_on_cob_post
        grounds:
          - state_machines.Claim.status.PENDED_to_PENDED
          - state_machines.Claim.status.PENDED_to_ADJUDICATED
          - state_machines.Claim.status.ADJUDICATED_to_RECEIVED
          - state_machines.Claim.payment_status.NOT_REMITTED_to_REMITTED
          - entities.Claim.fields.adjudication_pass
        distinguishing_aspect: |
          Non-linearity on the Claim entity: status carries a PENDED -> PENDED self-loop and an
          ADJUDICATED -> RECEIVED backward edge, while payment_status is a second, independent state
          dimension on the same row that stays NOT_REMITTED throughout all four status moves.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan CYCLE-1 with deductible 0, oop_max 1000000, coinsurance 0 and the default COME_OUT_WHOLE cob_method."
            - "IN_NETWORK provider Epsilon Imaging, no contract; fee schedule rate 73721 = 40000 cents effective 2026-01-01."
            - "One AUTH_REQUIRED EditRule on 73721 with severity PEND and precedence_rank 30."
            - "Member M-CYCLE-1 has one open-ended SECONDARY coverage segment from 2026-01-01, so cob_role is SECONDARY."
            - "Claim CLM-CYCLE-1 reports other_payer_paid_cents 0 at intake (so the COB pend does not fire) and carries one 73721 line, 2 units, billed 60000, service date 2026-02-10."
            - "No Authorization exists yet, so the first two adjudication passes must pend."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "CYCLE-1", name: "Cycle Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000005", name: "Epsilon Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-CYCLE-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "SECONDARY", other_payer_name: "Other Health" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-CYCLE-1", member_id: "${mem_id}", provider_id: "${prov_id}", other_payer_paid_cents: 0, lines: [{ line_number: 1, procedure_code: "73721", units: 2, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "u-examiner-1"
              captures: { st1: $.data.status, pass1: $.data.adjudication_pass, reason1: $.data.pend_reason_code }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "u-examiner-1"
              captures: { st2: $.data.status, pass2: $.data.adjudication_pass }
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 4, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "u-examiner-1"
              captures: { st3: $.data.status, pass3: $.data.adjudication_pass, paid3: $.data.total_plan_paid_cents, ver3: $.data.version }
            - call: "POST /adjudication/claims/${c_id}/other-payer-payment"
              payload: { other_payer_paid_cents: 15000, expected_claim_version: "${ver3}" }
              as: ClaimsIntake
          assert:
            - "${st1} == PENDED and ${pass1} == 1 and ${reason1} == PEND_AUTH_MISSING"
            - "${st2} == PENDED and ${pass2} == 2 (the PENDED -> PENDED self-loop ran, not an error)"
            - "${st3} == ADJUDICATED and ${pass3} == 3 and ${paid3} == 60000"
            - "Claim.${c_id}.status == RECEIVED after the COB posting"
            - "Claim.${c_id}.total_allowed_cents == 0 and Claim.${c_id}.pricing_variant == UNPRICED"
            - "Claim.${c_id}.adjudication_pass == 3 (the COB posting does not run a pass)"
            - "Claim.${c_id}.payment_status == NOT_REMITTED across every status move"
            - "Authorization.${auth_id}.units_consumed == 0 and Authorization.${auth_id}.status == ACTIVE"

      - name: authorization_returns_from_exhausted_to_partially_consumed_after_void
        grounds:
          - state_machines.Authorization.status.EXHAUSTED_to_PARTIALLY_CONSUMED
          - state_machines.Authorization.status.PARTIALLY_CONSUMED_to_EXHAUSTED
          - state_machines.ClaimLine.line_status.PAID_to_REVERSED
          - entities.Authorization.fields.units_consumed
        distinguishing_aspect: |
          Non-linearity on the Authorization entity — a different entity from the Claim cycle: the
          backward edge EXHAUSTED -> PARTIALLY_CONSUMED fires when a voided claim releases 2 of the 4
          consumed units, so an exhausted authorization becomes usable again.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan AUTH-CYC with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Zeta Imaging, no contract; fee schedule rate 73721 = 40000 cents effective 2026-01-01."
            - "One AUTH_REQUIRED EditRule on 73721 with severity PEND and precedence_rank 30."
            - "Member M-AUTHCYC has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "One Authorization for (member, provider, 73721) with authorized_units 4 covering 2026-01-01..2026-12-31."
            - "Claim CLM-AC-1 (2 units, service 2026-02-10) is ADJUDICATED, holding 2 units; Claim CLM-AC-2 (2 units, service 2026-02-11) is FINALIZED, holding the other 2, so the authorization is EXHAUSTED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "AUTH-CYC", name: "Authorization Cycle Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000006", name: "Zeta Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-B", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-AUTHCYC", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 4, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-AC-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 2, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c1_id: $.data.id }
            - call: "POST /adjudication/claims/${c1_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-AC-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 2, billed_amount_cents: 61000, service_date: "2026-02-11" }] }
              as: ClaimsIntake
              captures: { c2_id: $.data.id }
            - call: "POST /adjudication/claims/${c2_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /adjudication/authorizations/${auth_id}"
              payload: {}
              as: UtilizationReviewer
              captures: { auth_status_before: $.data.status, auth_units_before: $.data.units_consumed }
            - call: "POST /adjudication/claims/${c2_id}/finalize"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /adjudication/claims/${c2_id}/void"
              payload: { void_reason_code: "VOID_PROVIDER_CORRECTION" }
              as: ClaimsExaminer
          assert:
            - "${auth_status_before} == EXHAUSTED and ${auth_units_before} == 4"
            - "Authorization.${auth_id}.status == PARTIALLY_CONSUMED after the void"
            - "Authorization.${auth_id}.units_consumed == 2"
            - "Claim.${c2_id}.status == VOIDED and Claim.${c2_id}.payment_status == REVERSED"
            - "GET /adjudication/claim-lines?claim_id=${c2_id} returns one line with line_status == REVERSED"
            - "GET /adjudication/claim-lines?claim_id=${c1_id} returns one line still line_status == PRICED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: void_cascade_reverses_remittance_accumulator_lines_and_auth_units
        grounds:
          - state_machines.Claim.status.FINALIZED_to_VOIDED
          - state_machines.Claim.payment_status.REMITTED_to_REVERSED
          - state_machines.RemittanceAdvice.status.ISSUED_to_VOIDED
          - state_machines.ClaimLine.line_status.PAID_to_REVERSED
          - state_machines.Authorization.status.EXHAUSTED_to_ACTIVE
          - entities.BenefitAccumulator.fields.oop_applied_cents
        distinguishing_aspect: |
          Depth-6 cascade triggered by POST /adjudication/claims/{id}/void, where each hop is caused by
          the previous one: status -> payment_status -> remittance + accumulator -> line -> authorization
          units -> authorization status.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan VOID-CASC with deductible 50000, oop_max 300000 and coinsurance 0.20."
            - "IN_NETWORK provider Eta Imaging, no contract; fee schedule rate 73721 = 40000 cents per unit effective 2026-01-01."
            - "One AUTH_REQUIRED EditRule on 73721 with severity PEND and precedence_rank 30."
            - "Member M-VOID-1 has one open-ended PRIMARY coverage segment from 2026-01-01 and a plan_year 2026 accumulator at zero."
            - "One Authorization for (member, provider, 73721) with authorized_units 2 covering 2026-01-01..2026-12-31."
            - "Claim CLM-VOID-1 carries one 73721 line, 2 units, billed 60000, service date 2026-02-10; after adjudicate its allowed is 60000, deductible 50000, coinsurance 2000, member 52000, plan 8000; after finalize the claim is FINALIZED / REMITTED, the accumulator holds 50000 / 52000 and the authorization is EXHAUSTED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VOID-CASC", name: "Void Cascade Plan", deductible_individual_cents: 50000, oop_max_individual_cents: 300000, coinsurance_member_pct: 0.20 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000007", name: "Eta Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-C", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VOID-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 2, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-VOID-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 2, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims/${c_id}/finalize"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /adjudication/members/${mem_id}/accumulators"
              payload: {}
              as: PlanAdmin
              captures: { acc_id: "$.data[0].id", acc_ded_before: "$.data[0].deductible_applied_cents", acc_oop_before: "$.data[0].oop_applied_cents" }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/void"
              payload: { void_reason_code: "VOID_BILLING_ERROR" }
              as: ClaimsExaminer
          assert:
            - "${acc_ded_before} == 50000 and ${acc_oop_before} == 52000"
            - "HOP 1: Claim.${c_id}.status == VOIDED"
            - "HOP 2: Claim.${c_id}.payment_status == REVERSED"
            - "HOP 3: GET /adjudication/claims/${c_id}/remittances returns one row with status == VOIDED"
            - "HOP 3: BenefitAccumulator.${acc_id}.deductible_applied_cents == 0, oop_applied_cents == 0, remitted_claim_count == 0"
            - "HOP 4: GET /adjudication/claim-lines?claim_id=${c_id} returns one line with line_status == REVERSED"
            - "HOP 5: Authorization.${auth_id}.units_consumed == 0"
            - "HOP 6: Authorization.${auth_id}.status == ACTIVE"

      - name: coverage_termination_repends_claim_lines_and_releases_auth_units
        grounds:
          - state_machines.MemberCoverage.status.ACTIVE_to_TERMINATED
          - state_machines.ClaimLine.line_status.PRICED_to_PENDED
          - state_machines.Authorization.status.EXHAUSTED_to_ACTIVE
          - entities.Member.fields.status
          - entities.Claim.fields.pend_reason_code
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /adjudication/coverages/{id}/terminate — a different
          triggering transition from the void cascade: coverage -> claim re-pend -> line re-pend ->
          authorization unit release and status re-derivation.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "BenefitPlan ELIG-CASC with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Theta Imaging; fee schedule rate 73721 = 40000 cents per unit effective 2026-01-01."
            - "One AUTH_REQUIRED EditRule on 73721 with severity PEND and precedence_rank 30."
            - "Member M-ELIG-1 has exactly one open-ended PRIMARY coverage segment from 2026-01-01."
            - "One Authorization for (member, provider, 73721) with authorized_units 4 covering 2026-01-01..2026-12-31."
            - "Claim CLM-ELIG-1 carries one 73721 line, 4 units, billed 200000, service date 2026-04-10; after adjudicate it is ADJUDICATED with allowed 160000 and the authorization is EXHAUSTED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "ELIG-CASC", name: "Eligibility Cascade Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000008", name: "Theta Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-D", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-ELIG-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 4, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-ELIG-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 4, billed_amount_cents: 200000, service_date: "2026-04-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { st_before: $.data.status, allowed_before: $.data.total_allowed_cents }
          trigger:
            - call: "POST /adjudication/coverages/${cov_id}/terminate"
              payload: { term_date: "2026-04-01" }
              as: PlanAdmin
          assert:
            - "${st_before} == ADJUDICATED and ${allowed_before} == 160000"
            - "HOP 1: MemberCoverage.${cov_id}.status == TERMINATED and term_date == 2026-04-01"
            - "HOP 2: Claim.${c_id}.status == PENDED and Claim.${c_id}.pend_reason_code == PEND_ELIG_REVIEW"
            - "HOP 2: Claim.${c_id}.total_allowed_cents == 0"
            - "HOP 3: GET /adjudication/claim-lines?claim_id=${c_id} returns one line with line_status == PENDED, allowed_amount_cents == 0 and authorization_id == null"
            - "HOP 4: Authorization.${auth_id}.units_consumed == 0 and status == ACTIVE"
            - "Member.${mem_id}.status == TERMINATED (no coverage interval contains the 2026-05-01 clock date)"
            - "GET /adjudication/claims/${c_id}/events contains an entry with event_type == ELIG_REPEND"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: override_state_error_outranks_segregation_of_duties_error
        grounds:
          - validations[priority=30]
          - validations[priority=40]
          - errors[ERR_CLAIM_NOT_PENDED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Error-category pair `state` (priority 30) versus `business_safety` (priority 40): a single
          override request violates both, and the lower-priority-number state check wins, so the
          response is ERR_CLAIM_NOT_PENDED (409) and never ERR_SEGREGATION_OF_DUTIES (403).
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan PRIO-1 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Iota Clinic; fee schedule rate 73721 = 40000 cents effective 2026-01-01."
            - "Member M-PRIO-1 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "Claim CLM-PRIO-1 was adjudicated by X-User-ID u-shared-1 acting as ClaimsExaminer and is therefore ADJUDICATED, not PENDED, with last_adjudicated_by_user_id == u-shared-1."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "PRIO-1", name: "Priority Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000009", name: "Iota Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-PRIO-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PRIO-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "u-shared-1"
              captures: { st_before: $.data.status }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/override"
              payload: { decision: "APPROVE" }
              as: MedicalDirector
              as_user_id: "u-shared-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${st_before} == ADJUDICATED"
            - "${err_id} == ERR_CLAIM_NOT_PENDED"
            - "HTTP status is 409, not 403"
            - "Claim.${c_id}.status == ADJUDICATED (unchanged)"

      - name: intake_timely_filing_error_outranks_other_payer_exceeds_billed_error
        grounds:
          - validations[priority=54]
          - validations[priority=70]
          - errors[ERR_TIMELY_FILING_EXCEEDED]
          - errors[ERR_OTHER_PAYER_EXCEEDS_BILLED]
        distinguishing_aspect: |
          Error-category pair `business_temporal` (priority 54) versus `business_fiscal` (priority 70)
          — a different pair from the state/business_safety conflict: one intake request is both past
          the 90-day filing window and reports an other-payer payment above the billed total, and the
          temporal error wins with ERR_TIMELY_FILING_EXCEEDED (422).
        test_recipe:
          setup:
            - "Logical clock explicitly set to 2026-08-01T00:00:00Z, the same value as the server default."
            - "BenefitPlan PRIO-2 with timely_filing_days 90, deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Kappa Clinic; fee schedule rate 73721 = 40000 cents effective 2026-01-01."
            - "Member M-PRIO-2 has one open-ended PRIMARY coverage segment from 2026-01-01, so the member-has-coverage check at priority 60 passes."
            - "The submitted claim has statement_to_date defaulting to its only service date 2026-02-10, which is 172 whole days before the clock, and reports other_payer_paid_cents 999999 against a billed total of 60000."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "PRIO-2", name: "Priority Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0, timely_filing_days: 90 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000010", name: "Kappa Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-PRIO-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PRIO-2", member_id: "${mem_id}", provider_id: "${prov_id}", other_payer_paid_cents: 999999, lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_TIMELY_FILING_EXCEEDED"
            - "HTTP status is 422 and the error is not ERR_OTHER_PAYER_EXCEEDS_BILLED"
            - "GET /adjudication/claims?member_id=${mem_id} returns total_count == 0 (no claim row was persisted)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: duplicate_billed_tolerance_is_inclusive_at_exactly_500_cents
