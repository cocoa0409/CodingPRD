  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: approve_claim_over_cap_without_exception_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=11]', 'errors[ERR_CAP_EXCEEDED]']
        distinguishing_aspect: "Approving a 250000-cent claim against a 200000 misc cap with no approved exception fails with ERR_CAP_EXCEEDED and leaves the claim SUBMITTED."
        test_recipe:
          setup: ["MANAGER/DOMESTIC/RENTER policy (misc_cap_cents 200000); case IN_PROGRESS; claim of 250000 SUBMITTED"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Cap Cass", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_id}", category: MISC, payment_method: REIMBURSEMENT, lines: [{ description: "Furniture", amount_cents: 250000 }] }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /expense-claims/${claim_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: FinanceSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CAP_EXCEEDED"
            - "ExpenseClaim.${claim_id}.status == SUBMITTED (unchanged)"
            - "RelocationCase.${case_id}.total_committed_cents == 0"

      - name: approved_exception_relaxes_cap
        claim_type: conditional_validation
        grounds: ['validations[priority=11]', state_machines.ExceptionRequest.PENDING_to_APPROVED, 'concurrency_rules[exception-approve-stale-case]']
        distinguishing_aspect: "The cap check is conditional on exception state: the same 250000-cent claim that failed against the 200000 policy cap approves once a +100000 MISC exception is APPROVED (effective cap 300000)."
        test_recipe:
          setup: ["MANAGER/DOMESTIC/RENTER policy (misc_cap_cents 200000); case IN_PROGRESS; claim of 250000 SUBMITTED; one over-cap approve attempt already failed"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Ex Elena", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_id}", category: MISC, payment_method: REIMBURSEMENT, lines: [{ description: "Furniture", amount_cents: 250000 }] }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /exception-requests"
              payload: { case_id: "${case_id}", component: MISC, requested_cap_increase_cents: 100000, justification: "high-cost destination" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { ex_id: $.data.id }
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v1: $.data.version }
            - call: "POST /exception-requests/${ex_id}/approve"
              payload: { expected_case_version: "${case_v1}", decision_note: "approved" }
              as: ProgramManager
          trigger:
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v2: $.data.version }
            - call: "POST /expense-claims/${claim_id}/approve"
              payload: { expected_case_version: "${case_v2}" }
              as: FinanceSpecialist
          assert:
            - "ExceptionRequest.${ex_id}.status == APPROVED"
            - "ExpenseClaim.${claim_id}.status == APPROVED (effective misc cap 200000 + 100000 = 300000 >= 250000)"
            - "RelocationCase.${case_id}.total_committed_cents == 250000"

