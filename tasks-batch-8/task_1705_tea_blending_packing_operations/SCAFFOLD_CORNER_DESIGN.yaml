            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 20.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "bm-1", captures: { err: $.data.error_id } }
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st: $.data.status } }
          assert:
            - "release by blender user: ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "release by a different QA user then succeeds: ${st} == RELEASED"

  # ------------------------------------------------------------ endpoints ----
  - section: endpoints
    instances:
      - name: allocation_reverse_get_computed_read
        claim_type: computed_read
        grounds:
          - "entities.BatchLotAllocation.fields.line_cost_cents"
          - "entities.BatchLotAllocation.fields.batch_id"
        distinguishing_aspect: "The FK reverse-reachability GET returns the allocation with its server-computed line_cost_cents == 9000 (10.0 kg x 900 cents, per-line rounding)."
        test_recipe:
          setup: ["supplier; BLACK lot 60.0 kg @900 RELEASED; recipe ACTIVE; batch target 20.0 RECIPE_LOCKED with one 10.0 kg allocation"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Rev Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 60.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "RRev", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "BLACK", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 10.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "GET /tea-ops/batches/${b}/allocations", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { lc: "$.data[0].line_cost_cents", al: "$.data[0].id" } }
            - { call: "GET /tea-ops/leaf-lots/${lot}/allocations", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
          assert:
            - "GET /tea-ops/batches/${b}/allocations: total_count == 1 and ${lc} == 9000"
            - "GET /tea-ops/leaf-lots/${lot}/allocations returns the same allocation ${al} (both FK reverse channels agree)"

      - name: success_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "A successful create returns the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type == object, data carrying the entity."
        test_recipe:
          setup: ["supplier exists"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Env Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "OOLONG", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == object and data.id == ${lot}"
            - "HTTP status 201"

  # ---------------------------------------------------- complexity_layers ----
  - section: complexity_layers
    instances:
      - name: occ_recipe_put_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[recipe-update-stale-recipe]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential PUTs based on the same observed recipe version: the first succeeds (version 1 -> 2), the second carries the now-stale version and is rejected 412."
        test_recipe:
          setup: ["DRAFT recipe created at version 1"]
          setup_api_calls:
            - { call: "POST /tea-ops/recipes", payload: { name: "ROcc", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id, rv: $.data.version } }
            - { call: "PUT /tea-ops/recipes/${r}", payload: { expected_recipe_version: "${rv}", name: "ROcc-2" }, as: BlendMaster, as_user_id: "bm-1", captures: { rv2: $.data.version } }
          trigger:
            - { call: "PUT /tea-ops/recipes/${r}", payload: { expected_recipe_version: "${rv}", name: "ROcc-3" }, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "first PUT advanced the version: ${rv2} == 2"
            - "second PUT with the stale version fails: ${err} == ERR_STALE_VERSION (HTTP 412)"
            - "GET /tea-ops/recipes/${r} still shows name ROcc-2 and version 2"

      - name: occ_allocation_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[allocation-create-stale-batch]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A second allocation carrying the pre-first-allocation batch version is rejected 412 even though lot, quantity, and recipe fit are all valid — OCC precedes business checks."
        test_recipe:
          setup: ["supplier; BLACK lots 60.0 and 40.0 kg RELEASED; recipe ACTIVE; batch target 20.0 RECIPE_LOCKED; one 10.0 kg allocation made with the lock-time version"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Occ Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 60.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l1: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l1}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-02", weight_kg: 40.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l2: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l2}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "ROA", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "BLACK", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${l1}", allocated_kg: 10.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${l2}", allocated_kg: 5.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_STALE_VERSION (batch version advanced when the first allocation landed)"
            - "only the first allocation exists: GET /tea-ops/batches/${b}/allocations total_count == 1"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Supplier.ACTIVE_to_SUSPENDED"
          - "state_machines.CertificateGrant.ACTIVE_to_SUSPENDED"
        excluded_because:
          difficulty_instance: supplier_suspend_depth3_cascade
          rationale: "The 3-link and 2-link cascades are asserted end-to-end in §1.8 instances supplier_suspend_depth3_cascade and certificate_suspend_depth2_cascade."

      - name: rate_threshold_covered
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.residue_verdict_threshold"
        excluded_because:
          difficulty_instance: residue_limit_inclusive_boundary
          rationale: "The inclusive 0.50 ppm threshold flip is asserted in the named §1.8 instance; the 1.00 soft/hard bound is asserted in corner residue_soft_boundary_1_00."

  # ----------------------------------------------------- consistency_model ----
  - section: consistency_model
    instances:
      - name: version_increments_and_immediate_visibility
        claim_type: immediate_consistency
        grounds:
          - "entities.LeafLot"
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: the grading mutation is fully visible in the very next read — version 1 -> 2 and composite_grade B — with no reconciliation lag."
        test_recipe:
          setup: ["supplier; REGISTERED lot at version 1"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Cons Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "GET /tea-ops/leaf-lots/${lot}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { v2: $.data.version, cg: $.data.composite_grade, st: $.data.status } }
          assert:
            - "${v1} == 1 and ${v2} == 2 (every mutation increments version by exactly one)"
            - "${cg} == B and ${st} == GRADED are visible immediately in the follow-up read"

  # --------------------------------------------- validations (error coverage) ----
  - section: validations
    instances:
      - name: batch_create_with_draft_recipe_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RECIPE_NOT_ACTIVE]"
          - "state_machines.BlendRecipe"
        distinguishing_aspect: "Every consumer of a recipe requires it ACTIVE: batch creation against a DRAFT recipe and contract activation against the same DRAFT recipe both fail with ERR_RECIPE_NOT_ACTIVE."
        test_recipe:
          setup: ["recipe created and left in DRAFT"]
          setup_api_calls:
            - { call: "POST /tea-ops/recipes", payload: { name: "RDraft", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id, rst: $.data.status } }
          trigger:
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 10.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { err1: $.data.error_id } }
            - { call: "POST /tea-ops/contracts", payload: { customer_name: "Draft Foods", recipe_id: "${r}", minimum_units_per_run: 100, contracted_total_units: 1000, base_unit_price_cents: 150 }, as: AccountManager, as_user_id: "am-1", captures: { c1: $.data.id } }
            - { call: "POST /tea-ops/contracts/${c1}/activate", payload: {}, as: AccountManager, as_user_id: "am-1", captures: { err2: $.data.error_id } }
          assert:
            - "recipe is ${rst} == DRAFT"
            - "batch create: ${err1} == ERR_RECIPE_NOT_ACTIVE"
            - "contract activate: ${err2} == ERR_RECIPE_NOT_ACTIVE"

      - name: flavoring_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FLAVORING_MISMATCH]"
          - "state_machines.BlendBatch.BLENDED_to_FLAVORED"
        distinguishing_aspect: "Applying a DIFFERENT ACTIVE flavoring than the recipe's pinned flavoring_id fails with ERR_FLAVORING_MISMATCH even at the correct dose — recipe identity is locked, not just quantity."
        test_recipe:
          setup: ["supplier; GREEN lot 30.0 RELEASED; flavorings f1 (on the recipe) and f2 (a different ACTIVE flavoring); CONVENTIONAL TEA_BAG recipe [{GREEN,C,95.0}] + 5% f1 ACTIVE; batch target 20.0 in BLENDED"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "MM Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-01", weight_kg: 30.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/flavorings", payload: { name: "Cardamom", allergen_tags: [], natural_certified: true, cost_per_kg_cents: 2200 }, as: BlendMaster, as_user_id: "bm-1", captures: { f1: $.data.id } }
            - { call: "POST /tea-ops/flavorings", payload: { name: "Ginger", allergen_tags: [], natural_certified: true, cost_per_kg_cents: 1800 }, as: BlendMaster, as_user_id: "bm-1", captures: { f2: $.data.id } }
            - { call: "POST /tea-ops/recipes", payload: { name: "RMM", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 95.0 }], flavoring_id: "${f1}", flavoring_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 19.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/apply-flavoring", payload: { flavoring_id: "${f2}", applied_kg: 1.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FLAVORING_MISMATCH (f2 != recipe's f1, dose is correct and irrelevant)"
            - "batch remains BLENDED"
