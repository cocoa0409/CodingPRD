            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err_draft: $.data.error_id }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { reh_id: $.data.id, reh_status: $.data.status }
          assert:
            - "While sequence DRAFT: err_draft == ERR_SEQUENCE_INVALID_STATE, http 409"
            - "After lock-design: reh_status == SCHEDULED (creation now allowed) — Rehearsal gating follows StuntSequence state"

      - name: xdep_execution_requires_permit_window
        grounds:
          - state_machines.StuntExecution
          - entities.Permit.fields.status
          - validations[priority=12]
        distinguishing_aspect: |
