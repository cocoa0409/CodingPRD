          - state_machines.Player.ELIGIBLE_to_BANNED
          - state_machines.Registration.LOCKED_to_FORFEITED
          - state_machines.Match.SCHEDULED_to_FORFEIT
          - calculations.strike_threshold
        distinguishing_aspect: |
          Depth-5 transitive cascade from a single trigger (case RESOLVE VIOLATION):
          case resolution appends a strike -> strike breach bans the Player -> the
          ban invalidates the RosterSlot -> the slot loss forfeits the Registration
          (starters 0 < roster_size 1) -> the forfeiture converts the Match to FORFEIT
          with walkover winner propagation. Each link is caused by the previous one.
