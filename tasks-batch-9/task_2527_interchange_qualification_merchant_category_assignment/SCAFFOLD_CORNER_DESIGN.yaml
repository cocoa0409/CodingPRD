          - validations[priority=4]
          - errors[ERR_RATE_VERSION_NOT_FOUND]
        distinguishing_aspect: "The window is a three-way link across Acquirer, RateProgramVersion and ProcessingPlatform; when only the rate_program_version_id fails to resolve the response is 404 ERR_RATE_VERSION_NOT_FOUND and no window row is created, so a partial link is never persisted."
