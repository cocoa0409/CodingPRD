scaffold_corner_design:

  # =================================================================
  # From Table 1 (Entities)
  # =================================================================
  - section: entities
    instances:
      - name: provider_creation_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.Provider.fields.ccn
          - entities.Provider.fields.cbsa_code
          - entities.Provider.fields.approved_interim_period_count
          - endpoints[POST /providers]
        distinguishing_aspect: "POST /providers with every input field supplied returns 201 and echoes ccn 450123, cbsa_code 19100, teaching_status TEACHING, fte_cap 2.00, current_interim_rate_cents 900000 plus the computed approved_interim_period_count 0."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Provider.${provider_id}.ccn == \"450123\""
            - "Provider.${provider_id}.name == \"Mercy General Hospital\""
            - "Provider.${provider_id}.cbsa_code == \"19100\""
            - "Provider.${provider_id}.teaching_status == TEACHING"
            - "Provider.${provider_id}.fte_cap == 2.00"
            - "Provider.${provider_id}.current_interim_rate_cents == 900000"
            - "Provider.${provider_id}.approved_interim_period_count == 0"
            - "response data contains non-null id, created_at, updated_at and version"

      - name: cost_report_retrieval_returns_stored_and_derived_fields
        claim_type: Retrieval
        grounds:
          - entities.CostReport.fields.status
          - entities.CostReport.fields.wage_data_status
          - entities.CostReport.fields.allocation_status
          - entities.CostReport.fields.filing_deadline
          - endpoints[GET /cost-reports/{id}]
        distinguishing_aspect: "GET /cost-reports/{id} on a freshly opened report returns status DRAFT, wage_data_status NOT_STARTED, allocation_status NOT_RUN, filing_deadline 2026-11-30 and total_direct_cost_cents 0 — every field the POST stamped."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport for FY 2025-07-01..2026-06-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
          assert:
            - "CostReport.${report_id}.provider_id == ${provider_id}"
            - "CostReport.${report_id}.status == DRAFT"
            - "CostReport.${report_id}.wage_data_status == NOT_STARTED"
            - "CostReport.${report_id}.allocation_status == NOT_RUN"
            - "CostReport.${report_id}.filing_deadline == \"2026-11-30\""
            - "CostReport.${report_id}.total_direct_cost_cents == 0"
            - "CostReport.${report_id}.unmapped_tb_total_cents == 0"
            - "CostReport.${report_id}.allowable_cost_per_discharge_cents == 0"
            - "CostReport.${report_id}.filed_at == null"
            - "CostReport.${report_id}.amendment_count == 0"

      - name: cost_report_listing_is_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /cost-reports]
          - entities.CostReport.fields.provider_id
        distinguishing_aspect: "With two CostReports under one Provider, GET /cost-reports?provider_id=...&limit=1&offset=0 returns exactly 1 element with total_count 2 and has_more true."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with two DRAFT CostReports: FY 2024-07-01..2025-06-30 and FY 2025-07-01..2026-06-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2024-07-01", fiscal_year_end: "2025-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_prior_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "GET /cost-reports"
              payload: { provider_id: "${provider_id}", limit: 1, offset: 0 }
              as: ReimbursementManager
          assert:
            - "response_type == \"array\" and data holds exactly 1 CostReport"
            - "total_count == 2"
            - "has_more == true"
            - "limit == 1 and offset == 0"
            - "a second call with limit 1 and offset 1 returns has_more == false and total_count == 2"

      - name: get_cost_center_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /cost-centers/{id}]
          - errors[ERR_COST_CENTER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /cost-centers/{id} with a syntactically valid but unknown UUID returns ERR_COST_CENTER_NOT_FOUND with HTTP 404, not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z; no CostCenter exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /cost-centers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response_type == \"error\""
            - "${err_id} == \"ERR_COST_CENTER_NOT_FOUND\""

      - name: cost_center_without_code_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.CostCenter.fields.code
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "POST /cost-reports/{id}/cost-centers omitting the required `code` returns ERR_INVALID_REQUEST (400) and creates no CostCenter."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport for FY 2025-07-01..2026-06-30 and zero cost centers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "GET /cost-reports/${report_id}/cost-centers returns total_count == 0"

      - name: resident_irp_status_defaults_to_within_irp
        claim_type: Defaults
        grounds:
          - entities.Resident.fields.irp_status
          - entities.Resident.fields.assigned_fte_days
          - endpoints[POST /providers/{id}/residents]
        distinguishing_aspect: "POST /providers/{id}/residents omitting irp_status stores WITHIN_IRP (the declared default), and assigned_fte_days starts at 0.0000."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with teaching_status TEACHING and no residents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
          trigger:
            - call: "POST /providers/${provider_id}/residents"
              payload: { full_name: "Dana Ito", program: "Internal Medicine" }
              as: ReimbursementAnalyst
              captures: { resident_id: $.data.id }
          assert:
            - "Resident.${resident_id}.irp_status == WITHIN_IRP"
            - "Resident.${resident_id}.assigned_fte_days == 0.0000"
            - "Resident.${resident_id}.provider_id == ${provider_id}"

      - name: cost_center_direct_cost_cents_is_computed_from_mapped_ledger_lines
        claim_type: Computed Fields
        grounds:
          - entities.CostCenter.fields.direct_cost_cents
          - entities.CostCenter.fields.post_adjustment_cost_cents
          - calculations.trial_balance_mapping_rollup
        distinguishing_aspect: "CostCenter.direct_cost_cents is never an input: after two mapped ledger lines of 100000000 and 200000000 land on cost center 03000 its direct_cost_cents is exactly 300000000 and post_adjustment_cost_cents is 300000000."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport for FY 2025-07-01..2026-06-30"
            - "one ROUTINE cost center 03000 with no ledger lines yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
              captures: { tb_1: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6250", description: "Nursing supplies", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
              captures: { tb_2: $.data.id }
          assert:
            - "CostCenter.${cc_routine}.direct_cost_cents == 300000000"
            - "CostCenter.${cc_routine}.reclassified_amount_cents == 0"
            - "CostCenter.${cc_routine}.adjustment_amount_cents == 0"
            - "CostCenter.${cc_routine}.post_reclass_direct_cost_cents == 300000000"
            - "CostCenter.${cc_routine}.post_adjustment_cost_cents == 300000000"
            - "CostReport.${report_id}.total_direct_cost_cents == 300000000"
            - "CostReport.${report_id}.unmapped_tb_total_cents == 0"

      - name: provider_system_fields_are_server_generated_with_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Provider.common_fields
          - endpoints[POST /providers]
        distinguishing_aspect: "A POST /providers body that also carries id, created_at, updated_at and version has those four values discarded: the stored id differs from the supplied literal and version is server-managed."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000, id: "11111111-1111-1111-1111-111111111111", created_at: "1999-01-01T00:00:00Z", updated_at: "1999-01-01T00:00:00Z", version: 99 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
          assert:
            - "${provider_id} != \"11111111-1111-1111-1111-111111111111\""
            - "Provider.${provider_id}.created_at != \"1999-01-01T00:00:00Z\""
            - "Provider.${provider_id}.updated_at != \"1999-01-01T00:00:00Z\""
            - "Provider.${provider_id}.version != 99"
            - "Provider.${provider_id}.ccn == \"450123\""

      - name: cost_center_center_type_outside_enum_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CostCenter.fields.center_type
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "center_type \"OVERHEAD\" is outside the declared set {GENERAL_SERVICE, ANCILLARY, ROUTINE, NONREIMBURSABLE} and is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport for FY 2025-07-01..2026-06-30 and zero cost centers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "OVERHEAD", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "GET /cost-reports/${report_id}/cost-centers returns total_count == 0"

      - name: cost_center_under_unknown_cost_report_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CostCenter.parent
          - errors[ERR_COST_REPORT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Creating a CostCenter under an unknown cost_report_id fails with ERR_COST_REPORT_NOT_FOUND (404) — the parent-existence check at priority 4 fires before any payload business rule."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 registered; no CostReport with id 00000000-0000-0000-0000-0000000000aa exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/00000000-0000-0000-0000-0000000000aa/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err_id} == \"ERR_COST_REPORT_NOT_FOUND\""

      - name: rotation_assignment_to_a_foreign_providers_cost_center_is_rejected
        claim_type: Cross-cutting associations validated across the hierarchy
        grounds:
          - entities.RotationAssignment.fields.cost_center_id
          - errors[ERR_COST_CENTER_FOREIGN_TO_PROVIDER]
          - validations[priority=11]
        distinguishing_aspect: "The hybrid topology's cross-aggregate edge RotationAssignment.cost_center_id is validated against the resident's Provider: a cost center owned by Provider 450999 is rejected with ERR_COST_CENTER_FOREIGN_TO_PROVIDER (422) even though the cost center exists."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport FY 2025-07-01..2026-06-30 and a resident Dana Ito"
            - "a second Provider 450999 with its own DRAFT CostReport FY 2025-07-01..2026-06-30 and ROUTINE cost center 03000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /providers/${provider_id}/residents"
              payload: { full_name: "Dana Ito", program: "Internal Medicine", irp_status: "WITHIN_IRP" }
              as: ReimbursementAnalyst
              captures: { resident_id: $.data.id }
            - call: "POST /providers"
              payload: { ccn: "450999", name: "Lakeside Community Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 1.00, current_interim_rate_cents: 700000 }
              as: SystemAdmin
              captures: { provider_b_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_b_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 10000000, total_charges_cents: 200000000, medicare_discharges: 300 }
              as: SystemAdmin
              captures: { report_b_id: $.data.id }
            - call: "POST /cost-reports/${report_b_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_foreign: $.data.id }
          trigger:
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_foreign}", start_date: "2025-07-01", end_date: "2026-01-01", fte_fraction: 0.6000 }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_COST_CENTER_FOREIGN_TO_PROVIDER\""
            - "Resident.${resident_id}.assigned_fte_days == 0.0000"
            - "CostReport.${report_b_id}.unweighted_fte_days_total == 0.0000"

  # =================================================================
  # From Table 2 (State Machines)
  # =================================================================
  - section: state_machines
    instances:
      - name: wage_index_submission_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.WageIndexSubmission.DRAFT_to_SUBMITTED
          - entities.WageIndexSubmission.fields.status
          - entities.WageIndexSubmission.fields.revision_number
          - endpoints[POST /cost-reports/{id}/wage-index-submissions]
        distinguishing_aspect: "A newly created WageIndexSubmission is DRAFT with revision_number 0, occ_mix_category_count 0 and occ_mix_adjusted_ahw_cents null; creation is NOT a trigger of average_hourly_wage, so unadjusted_ahw_cents is still the default 0 and CostReport.wage_data_status stays NOT_STARTED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport for FY 2025-07-01..2026-06-30 and no WageIndexSubmission"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
