      - name: waiver_committee_recommendation_branches_to_two_side_effect_sets
        grounds:
          - state_machines.WaiverRequest.SUBMITTED_to_BOARD_PENDING
          - state_machines.WaiverRequest.SUBMITTED_to_DENIED
          - state_machines.AgendaItem.PROPOSED_to_WITHDRAWN
          - entities.WaiverRequest.fields.denial_stage
        distinguishing_aspect: |
          One endpoint, two branches with strictly different side-effect sets: RECOMMEND_GRANT moves
          the request to the intermediate BOARD_PENDING and leaves every listed agenda item
          untouched, while RECOMMEND_DENY moves it to the terminal DENIED with denial_stage
          COMMITTEE and withdraws every PROPOSED or POSTED agenda item that referenced it. The
          branching lives on WaiverRequest, a third entity distinct from PolicyVersion and Meeting.
