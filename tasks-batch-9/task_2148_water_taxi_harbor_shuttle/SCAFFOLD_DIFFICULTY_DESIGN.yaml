  # ===========================================================================
  # Rule 6 - boundary-precision checks on different metrics / endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: under_keel_clearance_of_exactly_030_departs_while_029_is_rejected
        grounds:
          - validations[priority=18]
          - calculations.trip_effective_capacity
          - errors[ERR_UNDER_KEEL_CLEARANCE]
          - entities.Vessel.fields.draft_m
          - entities.ServiceDay.fields.low_water_m
        distinguishing_aspect: |
          Numeric-threshold boundary on the depart endpoint: round_half_up(low_water_m - draft_m, 2)
          of exactly 0.30 passes because the rule is `>=`, and 0.29 on an otherwise identical trip
          is rejected. The sibling instance sits on a completely different metric - an empty
          candidate collection - and a different endpoint.
        test_recipe:
          setup:
            - "Vessel 'Harrier' 40 seats, draft 1.25 m, OFFSHORE, requiring MASTER_25T, with a passing ANNUAL inspection carrying 0 deficiencies."
            - "ServiceDay 2026-09-15 with low_water_m 1.55, giving clearance exactly 0.30 m and posture RESTRICTED."
            - "ServiceDay 2026-09-16 with low_water_m 1.54, giving clearance 0.29 m and posture RESTRICTED."
            - "One boarded trip on each day, both with empty manifests; the clock reads 2026-09-15T09:00:00Z."
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
