# =============================================================================
# Scaffold: Public Access Television Studio Operations (community media center)
# =============================================================================

scenario: |
  2769. Public Access Television Studio Operations (community media center):
  producer certification through training courses with equipment competency
  requirements, program submission with content policy, indemnification
  agreements and copyright clearance attestations, playback scheduling on
  assigned channels with first-come and series-priority rules, studio and
  equipment reservation with checkout, deposit and damage policies, live
  program support with crew volunteers and technical staffing, content
  standards limited to legally unprotected categories with editorial
  neutrality obligations, franchise fee and capital funding administration
  with municipal reporting, viewership and community impact measurement,
  archive retention and on-demand distribution

domain_name: public-access-tv-ops
api_prefix: ""

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection is a
  # top-level path (/producers, /programs, /playback-slots, /reservations, ...).
  # No entity is nested inside another entity's URL space except for the four
  # reverse-lookup sub-resources (attestations, damage-assessments).

  state_machine_shape: cyclic
  # Program.review_status loops UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED,
  # Producer loops ACTIVE -> SUSPENDED -> ACTIVE, Series loops ACTIVE -> LAPSED
  # -> ACTIVE, FundingPeriod loops SUBMITTED -> RETURNED_FOR_REVISION -> DRAFT.
  # Reservation adds a branching fork-join (CHECKED_OUT -> {SETTLED |
  # DAMAGE_REVIEW} -> SETTLED) and Program carries two independent state
  # dimensions on one row (review_status x clearance_status).

  relationship_patterns:
    - one_to_many          # Channel -> PlaybackSlot, Producer -> Reservation
    - many_to_many         # CourseEnrollment (Producer x TrainingCourse),
                           # CrewAssignment (Producer x PlaybackSlot)
    - self_referential     # Series.predecessor_series_id -> Series.id,
                           # PlaybackSlot.preempted_by_slot_id -> PlaybackSlot.id
    - cross_aggregate      # Reservation.linked_slot_id -> PlaybackSlot.id

  role_model: segregation_of_duties
  # The reviewer who claims a program must be the one who decides it; the
  # officer who waives a damage assessment must not be the operator who filed
  # it; the administrator who accepts a municipal report must not be the
  # finance officer who submitted it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Actual scope emitted below: 14 entities / 70 endpoints / 56 error codes /
  # 11 calculations (2 with declared divergent variants, 2 more with pinned
  # per-line rounding) / 12 state machines across 11 entities (Program carries
  # two independent dimensions; 4 machines are cyclic, Reservation is a
  # branching fork-join) / 42 ordered validation rules in 12 priority bands /
  # 2 optimistic-concurrency rules / 7 roles.

# -----------------------------------------------------------------------------
# Table 0: Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# Table 1: Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Certified community producer's legal name" }
      - { name: email, type: string, source: input, description: "Contact e-mail; unique across Producer", constraints: "unique" }
      - { name: residency_verified, type: boolean, source: system, default: false, description: "True once a residency document has been recorded by CenterAdmin" }
      - { name: status, type: enum, source: system, default: APPLICANT, description: "Membership lifecycle", constraints: "APPLICANT | ACTIVE | SUSPENDED | REVOKED" }
      - { name: certification_level, type: enum, source: computed, default: NONE, description: "Derived from passed course tiers and suspension_points (see calculations.producer_certification_level)", constraints: "NONE | BASIC | ADVANCED | LIVE" }
      - { name: competency_codes, type: array, source: computed, default: [], description: "Union of grants_competency_codes over this producer's PASSED CourseEnrollment rows, de-duplicated, ordered by the granting enrollment's graded_at ASC" }
      - { name: suspension_points, type: integer, source: computed, default: 0, description: "Running penalty total from FINALIZED DamageAssessment rows minus credits granted at reinstatement" }
      - { name: indemnification_expires_at, type: datetime, source: system, description: "Set to clock_now + INDEMNIFICATION_TERM_DAYS when this producer signs an INDEMNIFICATION attestation; null until then" }
      - { name: deposit_held_cents, type: integer, source: computed, default: 0, description: "Sum of Reservation.deposit_hold_cents over this producer's reservations whose status IN {CONFIRMED, CHECKED_OUT, DAMAGE_REVIEW}" }
      - { name: deposit_forfeited_total_cents, type: integer, source: computed, default: 0, description: "Lifetime sum of Reservation.deposit_forfeited_cents over this producer's SETTLED reservations" }
      - { name: volunteer_hours_tenths, type: integer, source: computed, default: 0, description: "Sum of CrewAssignment.credited_hours_tenths over this producer's COMPLETED crew assignments (tenths of an hour, integer)" }
      - { name: confirmed_crew_commitments, type: integer, source: computed, default: 0, description: "Count of CrewAssignment rows with volunteer_producer_id = this producer and status = CONFIRMED" }
      - { name: reinstated_count, type: integer, source: system, default: 0, description: "Number of times SUSPENDED -> ACTIVE has been applied" }
      - { name: revocation_reason, type: string, source: system, description: "Reason recorded when status becomes REVOKED; null otherwise" }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Catalog code; unique across TrainingCourse", constraints: "unique" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: tier, type: enum, source: input, description: "Curriculum tier; gates enrollment prerequisites and certification level", constraints: "BASIC | ADVANCED | LIVE" }
      - { name: grants_competency_codes, type: array, source: input, description: "Equipment competency codes granted on PASSED", constraints: "non-empty; members of {STUDIO_FLOOR, EDIT_SUITE, ENG_CAMERA, AUDIO_BOARD, LIVE_SWITCHER}" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum enrolled_count", constraints: ">= 1" }
      - { name: session_start_at, type: datetime, source: input, description: "Session start (enrollment closes at this instant)" }
      - { name: session_end_at, type: datetime, source: input, description: "Session end (grading opens at this instant)", constraints: "> session_start_at" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of CourseEnrollment rows for this course whose status IN {ENROLLED, ATTENDED, PASSED, FAILED} (WITHDRAWN releases the seat)" }
      - { name: passed_count, type: integer, source: computed, default: 0, description: "Count of CourseEnrollment rows for this course whose status = PASSED" }

  - name: CourseEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; the enrolling producer" }
      - { name: course_id, type: string, source: input, description: "FK -> TrainingCourse.id; the course enrolled in" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "Enrollment lifecycle", constraints: "ENROLLED | ATTENDED | PASSED | FAILED | WITHDRAWN" }
      - { name: practical_score, type: integer, source: input, description: "Equipment competency practical score recorded at grading; null until graded", constraints: "0 <= practical_score <= 100" }
      - { name: attended_at, type: datetime, source: system, description: "Set when attendance is recorded as attended" }
      - { name: graded_at, type: datetime, source: system, description: "Set when the practical score is recorded" }

  - name: Series
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; the series owner" }
      - { name: title, type: string, source: input, description: "Series title" }
      - { name: cadence, type: enum, source: input, description: "Recurrence expected of the series", constraints: "WEEKLY | BIWEEKLY | MONTHLY" }
      - { name: first_air_date, type: datetime, source: input, description: "Historic anchor date claimed for this series' own run" }
      - { name: predecessor_series_id, type: string, source: input, description: "FK -> Series.id; the earlier series this one continues; null for an original series" }
      - { name: sequence_number, type: integer, source: system, description: "Monotone center-wide counter assigned at creation (1, 2, 3, ...); the deterministic tie-break for equal seniority" }
      - { name: seniority_at, type: datetime, source: computed, description: "Earliest first_air_date along the predecessor chain (see calculations.series_seniority_at); null while status = PROPOSED" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "Series lifecycle", constraints: "PROPOSED | ACTIVE | LAPSED | RETIRED" }
      - { name: hold_plan_slots_granted, type: integer, source: computed, default: 0, description: "slots_granted of the latest hold plan accepted for this series" }
      - { name: remaining_hold_slots, type: integer, source: computed, default: 0, description: "hold_plan_slots_granted minus SERIES_HOLD slots currently held; restored when such a slot is cancelled or withdrawn" }
      - { name: missed_windows, type: integer, source: computed, default: 0, description: "Count of SERIES_HOLD slots cancelled for this series since the last activation; reaching SERIES_LAPSE_MISSED_WINDOWS lapses the series" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; the submitting producer" }
      - { name: series_id, type: string, source: input, description: "FK -> Series.id; the series this episode belongs to; null for a one-off program" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: episode_number, type: integer, source: input, description: "Episode ordinal within the series; null for a one-off program", constraints: ">= 1" }
      - { name: runtime_seconds, type: integer, source: input, description: "Playable duration in seconds", constraints: ">= 60" }
      - { name: is_live, type: boolean, source: input, default: false, description: "True when the program airs live and needs crew staffing" }
      - { name: required_crew_roles, type: array, source: input, default: [], description: "Distinct crew roles the live program needs", constraints: "members of {DIRECTOR, CAMERA, AUDIO, SWITCHER, FLOOR_MANAGER}; must be empty when is_live = false" }
      - { name: review_status, type: enum, source: system, default: DRAFT, description: "Editorial review dimension (independent of clearance_status)", constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | CHANGES_REQUESTED | REJECTED | WITHDRAWN" }
      - { name: clearance_status, type: enum, source: computed, default: INCOMPLETE, description: "Attestation dimension (independent of review_status); CLEARED once the latest attestation per required kind carries CURRENT_STATEMENT_VERSION", constraints: "INCOMPLETE | CLEARED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the ContentReviewer who claimed the review; reset to null on every CHANGES_REQUESTED -> SUBMITTED transition" }
      - { name: finding_category, type: enum, source: system, description: "Unprotected-category finding recorded with the latest CHANGES_REQUESTED or REJECTED decision; null otherwise", constraints: "member of UNPROTECTED_FINDING_CATEGORIES" }
      - { name: finding_notes, type: string, source: system, description: "Free-text finding recorded with the latest review decision" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Incremented on every UNDER_REVIEW -> CHANGES_REQUESTED transition; gates resubmission at MAX_REVISION_ROUNDS" }
      - { name: attestation_sequence_high, type: integer, source: system, default: 0, description: "Highest Attestation.sequence_number minted for this program" }
      - { name: withdrawn_reason, type: string, source: system, description: "Reason recorded when review_status becomes WITHDRAWN" }

  - name: Attestation
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program this attestation covers" }
      - { name: signed_by_producer_id, type: string, source: input, description: "FK -> Producer.id; must equal Program.producer_id" }
      - { name: attestation_kind, type: enum, source: input, description: "Which obligation is being attested", constraints: "INDEMNIFICATION | COPYRIGHT_CLEARANCE | CONTENT_POLICY" }
      - { name: statement_version, type: string, source: input, description: "Version of the signed statement text; only CURRENT_STATEMENT_VERSION clears the obligation" }
      - { name: third_party_material, type: boolean, source: input, description: "True when the program embeds third-party material" }
      - { name: license_reference, type: string, source: input, description: "Licence or public-domain citation; required when third_party_material = true" }
      - { name: sequence_number, type: integer, source: system, description: "Monotone per-program counter (1, 2, 3, ...); tie-break when two attestations of one kind share created_at" }
      - { name: effective_from, type: datetime, source: system, description: "Logical clock instant at which the attestation was recorded" }
      - { name: effective_until, type: datetime, source: system, description: "effective_from + INDEMNIFICATION_TERM_DAYS for kind = INDEMNIFICATION; null for the other two kinds" }

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: call_sign, type: string, source: input, description: "Channel call sign; unique across Channel", constraints: "unique" }
      - { name: tier, type: enum, source: input, description: "PEG designation of the channel", constraints: "PUBLIC | EDUCATIONAL | GOVERNMENT" }
      - { name: daily_window_start_minute, type: integer, source: input, description: "Inclusive start of the daily broadcast window, minutes after 00:00 UTC", constraints: "0 <= value <= 1439" }
      - { name: daily_window_end_minute, type: integer, source: input, description: "Exclusive end of the daily broadcast window, minutes after 00:00 UTC", constraints: "> daily_window_start_minute; <= 1440" }
      - { name: inter_program_buffer_seconds, type: integer, source: input, default: 0, description: "Interstitial seconds appended to every slot on this channel and counted inside PlaybackSlot.occupied_seconds", constraints: ">= 0" }
      - { name: preemption_enabled, type: boolean, source: input, default: true, description: "When false, a series-priority challenger can never displace an incumbent slot on this channel" }
      - { name: scheduled_seconds, type: integer, source: computed, default: 0, description: "Sum of PlaybackSlot.occupied_seconds over this channel's slots whose status = SCHEDULED" }
      - { name: aired_seconds, type: integer, source: computed, default: 0, description: "Sum of PlaybackSlot.occupied_seconds over this channel's slots whose status = AIRED" }
      - { name: slot_sequence_high, type: integer, source: system, default: 0, description: "Highest PlaybackSlot.sequence_number minted on this channel" }

  - name: PlaybackSlot
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the channel carrying the slot" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program to be played back" }
      - { name: series_id, type: string, source: input, description: "FK -> Series.id; supplied only when the slot is claimed against a series hold plan; null for a first-come booking" }
      - { name: booking_type, type: enum, source: system, description: "SERIES_HOLD when a hold slot was consumed at creation, else FIRST_COME", constraints: "FIRST_COME | SERIES_HOLD" }
      - { name: start_at, type: datetime, source: input, description: "Playback start instant (UTC)" }
      - { name: occupied_seconds, type: integer, source: computed, description: "Program.runtime_seconds + Channel.inter_program_buffer_seconds, frozen at creation" }
      - { name: end_at, type: datetime, source: computed, description: "start_at + occupied_seconds; the slot occupies the half-open interval [start_at, end_at)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Slot lifecycle", constraints: "SCHEDULED | AIRED | CANCELLED | PREEMPTED | WITHDRAWN" }
      - { name: required_crew_roles, type: array, source: computed, description: "Copy of Program.required_crew_roles frozen at slot creation" }
      - { name: staffing_status, type: enum, source: computed, default: NOT_REQUIRED, description: "Derived from CrewAssignment coverage (see calculations.crew_staffing_readiness)", constraints: "NOT_REQUIRED | UNDERSTAFFED | READY" }
      - { name: preempted_by_slot_id, type: string, source: system, description: "FK -> PlaybackSlot.id; the series-priority challenger that displaced this slot; null unless status = PREEMPTED" }
      - { name: measured_households, type: integer, source: input, description: "Metered households recorded at air time; null until AIRED", constraints: ">= 0" }
      - { name: aired_at, type: datetime, source: system, description: "Logical clock instant at which the slot was aired" }
      - { name: sequence_number, type: integer, source: system, description: "Monotone per-channel counter assigned at creation (1, 2, 3, ...)" }
      - { name: cancellation_reason, type: string, source: system, description: "Reason recorded on CANCELLED or WITHDRAWN" }

  - name: StudioResource
    parent: null
    common_fields: true
    fields:
      - { name: resource_code, type: string, source: input, description: "Asset tag; unique across StudioResource", constraints: "unique" }
      - { name: resource_class, type: enum, source: input, description: "Kind of bookable facility or kit", constraints: "STUDIO_A | FIELD_CAMERA_KIT | AUDIO_KIT | EDIT_SUITE" }
      - { name: required_competency_code, type: string, source: input, description: "Competency code a producer must hold to check the resource out", constraints: "member of {STUDIO_FLOOR, EDIT_SUITE, ENG_CAMERA, AUDIO_BOARD, LIVE_SWITCHER}" }
      - { name: capacity_slots, type: integer, source: input, default: 1, description: "How many overlapping reservations this resource can host before it is fully booked", constraints: ">= 1" }
      - { name: turnaround_minutes, type: integer, source: input, default: 0, description: "Mandatory clearance gap appended to both sides of every reservation interval on this resource", constraints: ">= 0" }
      - { name: base_deposit_cents, type: integer, source: input, description: "Deposit basis used by every deposit and fee line for this resource", constraints: ">= 0" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Upper bound on both the deposit hold and any assessed repair", constraints: ">= base_deposit_cents" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Resource availability lifecycle", constraints: "AVAILABLE | MAINTENANCE | RETIRED" }
      - { name: open_reservation_count, type: integer, source: computed, default: 0, description: "Count of this resource's reservations whose status IN {CONFIRMED, CHECKED_OUT, DAMAGE_REVIEW}" }
      - { name: status_reason, type: string, source: system, description: "Reason recorded on the latest status change" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; the reserving producer" }
      - { name: resource_id, type: string, source: input, description: "FK -> StudioResource.id; the reserved resource" }
      - { name: linked_slot_id, type: string, source: input, description: "FK -> PlaybackSlot.id; the live slot this booking supports; null for an ordinary booking" }
      - { name: start_at, type: datetime, source: input, description: "Reservation start instant (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Reservation end instant (UTC)", constraints: "> start_at" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Reservation lifecycle", constraints: "REQUESTED | CONFIRMED | CHECKED_OUT | DAMAGE_REVIEW | SETTLED | CANCELLED" }
      - { name: risk_bp, type: integer, source: computed, default: 0, description: "min(RISK_BP_CAP, producer.suspension_points * RISK_BP_PER_SUSPENSION_POINT) frozen at confirmation" }
      - { name: deposit_hold_cents, type: integer, source: computed, default: 0, description: "Provisional deposit computed at confirmation (see calculations.reservation_deposit_hold)" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late-return fee computed at return (see calculations.reservation_final_settlement)" }
      - { name: assessed_repair_cents, type: integer, source: computed, default: 0, description: "Repair charge carried over from the reservation's DamageAssessment; 0 when clean or waived" }
      - { name: deposit_forfeited_cents, type: integer, source: computed, default: 0, description: "Portion of deposit_hold_cents retained by the center at settlement" }
      - { name: deposit_refunded_cents, type: integer, source: computed, default: 0, description: "deposit_hold_cents - deposit_forfeited_cents, released at settlement or cancellation" }
      - { name: uncovered_liability_cents, type: integer, source: computed, default: 0, description: "max(0, late_fee_cents + assessed_repair_cents - deposit_hold_cents); the gap between the provisional hold and the final assessed liability" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical clock instant of checkout" }
      - { name: returned_at, type: datetime, source: system, description: "Logical clock instant of return" }
      - { name: condition_notes, type: string, source: input, description: "Condition remarks captured at checkout" }
      - { name: cancellation_reason, type: string, source: system, description: "Reason recorded on CANCELLED" }

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation the damage was observed on" }
      - { name: severity, type: enum, source: input, description: "Damage severity band driving suspension points", constraints: "MINOR | MAJOR | TOTAL_LOSS" }
      - { name: repair_estimate_cents, type: integer, source: input, description: "Operator's raw repair estimate", constraints: ">= 0" }
      - { name: assessed_repair_cents, type: integer, source: computed, default: 0, description: "min(repair_estimate_cents, resource.replacement_value_cents); 0 while FILED and 0 forever when WAIVED" }
      - { name: suspension_points_assessed, type: integer, source: computed, default: 0, description: "Points applied to the producer at finalization (see calculations.damage_penalty_assessment); 0 while FILED and 0 when WAIVED" }
      - { name: status, type: enum, source: system, default: FILED, description: "Assessment lifecycle", constraints: "FILED | FINALIZED | WAIVED" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the FacilitiesManager whose return call created this assessment" }
      - { name: waived_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceOfficer who waived the assessment; must differ from filed_by_user_id" }
      - { name: waiver_reason, type: string, source: system, description: "Reason recorded on WAIVED" }
      - { name: damage_notes, type: string, source: input, description: "Operator's description of the damage" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> PlaybackSlot.id; the live slot being staffed" }
      - { name: volunteer_producer_id, type: string, source: input, description: "FK -> Producer.id; the volunteer filling the role" }
      - { name: crew_role, type: enum, source: input, description: "Technical role filled", constraints: "DIRECTOR | CAMERA | AUDIO | SWITCHER | FLOOR_MANAGER" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "Assignment lifecycle", constraints: "OFFERED | CONFIRMED | COMPLETED | RELEASED" }
      - { name: credited_hours_tenths, type: integer, source: computed, default: 0, description: "ceil(slot.occupied_seconds / 360) tenths of an hour, credited when the slot airs" }
      - { name: release_reason, type: string, source: system, description: "Reason recorded on RELEASED, including cascaded releases" }

  - name: FundingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Municipal fiscal year", constraints: ">= 2000" }
      - { name: quarter, type: integer, source: input, description: "Fiscal quarter", constraints: "1 <= quarter <= 4; (fiscal_year, quarter) unique" }
      - { name: basis, type: enum, source: input, description: "Which allocation algorithm the municipal report uses", constraints: "ACCRUAL | CASH" }
      - { name: gross_franchise_fee_cents, type: integer, source: input, description: "Gross franchise fee billed to the cable operator for the period", constraints: ">= 0" }
      - { name: service_period_earned_cents, type: integer, source: input, description: "Fee earned within the service period; the allocable base under ACCRUAL", constraints: ">= 0" }
      - { name: remittance_received_cents, type: integer, source: input, description: "Fee cash actually remitted within the period; the allocable base under CASH", constraints: ">= 0" }
      - { name: capital_grant_cents, type: integer, source: input, default: 0, description: "PEG capital grant added on top of the capital allocation", constraints: ">= 0" }
      - { name: allocable_base_cents, type: integer, source: computed, default: 0, description: "service_period_earned_cents under ACCRUAL, remittance_received_cents under CASH" }
      - { name: admin_reserve_cents, type: integer, source: computed, default: 0, description: "Administrative reserve withheld from allocable_base_cents at the tier rate" }
      - { name: capital_allocation_cents, type: integer, source: computed, default: 0, description: "Capital share of the net-of-reserve base plus capital_grant_cents" }
      - { name: operating_allocation_cents, type: integer, source: computed, default: 0, description: "Residual operating share of the net-of-reserve base" }
      - { name: total_program_funds_cents, type: integer, source: computed, default: 0, description: "admin_reserve_cents + capital_allocation_cents + operating_allocation_cents; equals allocable_base_cents + capital_grant_cents by construction" }
      - { name: report_status, type: enum, source: system, default: DRAFT, description: "Municipal report lifecycle", constraints: "DRAFT | SUBMITTED | ACCEPTED | RETURNED_FOR_REVISION" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Incremented on every accepted restatement of the period's figures" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceOfficer who submitted the report" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the CenterAdmin who accepted or returned the report; must differ from submitted_by_user_id" }
      - { name: decision_reason, type: string, source: system, description: "Reason recorded with a RETURN decision" }

  - name: ArchiveAsset
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the archived program" }
      - { name: source_slot_id, type: string, source: input, description: "FK -> PlaybackSlot.id; the airing this asset was captured from" }
      - { name: retention_class, type: enum, source: input, description: "Retention band chosen at publication; null while PENDING", constraints: "STANDARD_24M | EXTENDED_60M | PERMANENT" }
      - { name: retain_until, type: datetime, source: computed, description: "source slot aired_at + RETENTION_MONTHS[retention_class] calendar months; null for PERMANENT and while PENDING" }
      - { name: on_demand_status, type: enum, source: system, default: PENDING, description: "On-demand distribution lifecycle", constraints: "PENDING | PUBLISHED | WITHDRAWN | PURGED" }
      - { name: on_demand_views, type: integer, source: computed, default: 0, description: "Running total of recorded on-demand views" }
      - { name: measured_households, type: integer, source: computed, description: "Copy of source slot measured_households frozen at asset creation" }
      - { name: volunteer_hours_tenths, type: integer, source: computed, default: 0, description: "Sum of CrewAssignment.credited_hours_tenths over COMPLETED assignments on source_slot_id, frozen at asset creation" }
      - { name: community_impact_index, type: number, source: computed, default: 0, description: "Weighted community impact score, 2 decimal places (see calculations.community_impact_index)" }
      - { name: impact_variant, type: enum, source: system, default: PROVISIONAL, description: "Which variant produced community_impact_index", constraints: "PROVISIONAL | FINAL" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock instant of publication" }
      - { name: purged_at, type: datetime, source: system, description: "Logical clock instant of purge" }

# -----------------------------------------------------------------------------
# Table 2: State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: Producer
    dimension: status
    initial_state: APPLICANT
    terminal_states: [REVOKED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /producers/{producerId}/residency-verification"
        actor: CenterAdmin
        preconditions:
          - "producer.status == APPLICANT"
          - "producer.residency_verified == false"
        side_effects:
          - "sets residency_verified = true"
          - "recomputes certification_level via calculations.producer_certification_level (stays NONE until a BASIC course is passed)"
          - "increments Producer.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, during POST /damage-assessments/{assessmentId}/finalize when the new suspension_points total crosses the threshold"
        actor: system
        preconditions:
          - "producer.status == ACTIVE"
          - "producer.suspension_points >= SUSPENSION_THRESHOLD_POINTS after the finalized assessment's points are added"
        side_effects:
          - "CASCADE LINK 2: sets certification_level = NONE (calculations.producer_certification_level returns NONE for a suspended producer)"
          - "CASCADE LINK 3a: every Reservation with producer_id = this producer and status IN {REQUESTED, CONFIRMED} transitions to CANCELLED with cancellation_reason = 'PRODUCER_SUSPENDED'; each CONFIRMED one releases its hold (deposit_refunded_cents = deposit_hold_cents, deposit_forfeited_cents = 0) and decrements resource.open_reservation_count by 1"
          - "CASCADE LINK 3b: every CrewAssignment with volunteer_producer_id = this producer and status IN {OFFERED, CONFIRMED} whose slot.status = SCHEDULED transitions to RELEASED with release_reason = 'VOLUNTEER_SUSPENDED'"
          - "CASCADE LINK 4: each slot touched by link 3b recomputes staffing_status, and this producer's confirmed_crew_commitments and deposit_held_cents are recomputed"
          - "increments Producer.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /producers/{producerId}/reinstate"
        actor: CenterAdmin
        preconditions:
          - "producer.status == SUSPENDED"
          - "0 < suspension_points_credited <= producer.suspension_points"
          - "producer.suspension_points - suspension_points_credited < SUSPENSION_THRESHOLD_POINTS"
        side_effects:
          - "suspension_points -= suspension_points_credited"
          - "reinstated_count += 1"
          - "recomputes certification_level from the surviving PASSED enrollments (restores BASIC/ADVANCED/LIVE)"
          - "increments Producer.version by 1"
        note: "Reinstatement never revives cascade-cancelled reservations or released crew assignments."

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /producers/{producerId}/revoke"
        actor: CenterAdmin
        preconditions:
          - "producer.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "sets certification_level = NONE and revocation_reason"
          - "every Reservation with producer_id = this producer and status IN {REQUESTED, CONFIRMED} transitions to CANCELLED (holds released, resource.open_reservation_count decremented)"
          - "every CrewAssignment with volunteer_producer_id = this producer and status IN {OFFERED, CONFIRMED} transitions to RELEASED, then each affected slot recomputes staffing_status"
          - "every Series with producer_id = this producer and status IN {PROPOSED, ACTIVE, LAPSED} transitions to RETIRED, then every Series whose predecessor_series_id points at a retired series recomputes seniority_at"
          - "every Program with producer_id = this producer and review_status NOT IN {REJECTED, WITHDRAWN} has clearance_status recomputed to INCOMPLETE"
          - "increments Producer.version by 1"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /producers/{producerId}/revoke"
        actor: CenterAdmin
        preconditions:
          - "producer.status == SUSPENDED"
        side_effects:
          - "same side-effect set as ACTIVE -> REVOKED"
          - "increments Producer.version by 1"

  - entity: CourseEnrollment
    dimension: status
    initial_state: ENROLLED
    terminal_states: [PASSED, FAILED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /course-enrollments/{enrollmentId}/attendance with attended = true"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == ENROLLED"
          - "clock_now >= course.session_end_at"
        side_effects:
          - "sets attended_at = clock_now"
          - "increments CourseEnrollment.version by 1"

      - from: ENROLLED
        to: FAILED
        trigger: "POST /course-enrollments/{enrollmentId}/attendance with attended = false"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == ENROLLED"
          - "clock_now >= course.session_end_at"
        side_effects:
          - "no competency is granted; course.enrolled_count is unchanged (a FAILED seat stays consumed)"
          - "increments CourseEnrollment.version by 1"

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /course-enrollments/{enrollmentId}/withdraw"
        actor: Producer
        preconditions:
          - "enrollment.status == ENROLLED"
          - "clock_now < course.session_start_at"
        side_effects:
          - "course.enrolled_count -= 1 (the seat is released)"
          - "increments CourseEnrollment.version by 1"

      - from: ATTENDED
        to: PASSED
        trigger: "POST /course-enrollments/{enrollmentId}/grade with practical_score >= PASS_SCORE_MIN"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == ATTENDED"
          - "0 <= practical_score <= 100"
        side_effects:
          - "sets practical_score and graded_at = clock_now"
          - "course.passed_count += 1"
          - "producer.competency_codes gains course.grants_competency_codes"
          - "recomputes producer.certification_level via calculations.producer_certification_level"
          - "increments CourseEnrollment.version by 1 and Producer.version by 1"

      - from: ATTENDED
        to: FAILED
        trigger: "POST /course-enrollments/{enrollmentId}/grade with practical_score < PASS_SCORE_MIN"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == ATTENDED"
          - "0 <= practical_score <= 100"
        side_effects:
          - "sets practical_score and graded_at = clock_now; no competency granted; certification_level unchanged"
          - "increments CourseEnrollment.version by 1"

  - entity: Series
    dimension: status
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /series/{seriesId}/activate"
        actor: SchedulingCoordinator
        preconditions:
          - "series.status IN {PROPOSED, LAPSED}"
          - "producer.status == ACTIVE"
          - "producer.certification_level != NONE"
        side_effects:
          - "computes seniority_at via calculations.series_seniority_at"
          - "increments Series.version by 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "system, during POST /playback-slots/{slotId}/cancel when the cancelled slot's booking_type == SERIES_HOLD and the resulting missed_windows reaches the lapse limit"
        actor: system
        preconditions:
          - "series.status == ACTIVE"
          - "series.missed_windows >= SERIES_LAPSE_MISSED_WINDOWS after the increment"
        side_effects:
          - "sets remaining_hold_slots = 0 (the hold plan is void while lapsed) while hold_plan_slots_granted is retained"
          - "increments Series.version by 1"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /series/{seriesId}/activate"
        actor: SchedulingCoordinator
        preconditions:
          - "series.status == LAPSED"
          - "producer.status == ACTIVE"
          - "producer.certification_level != NONE"
        side_effects:
          - "sets missed_windows = 0 and remaining_hold_slots = hold_plan_slots_granted"
          - "recomputes seniority_at via calculations.series_seniority_at"
          - "increments Series.version by 1"

      - from: ACTIVE
        to: RETIRED
        trigger: "system, during POST /producers/{producerId}/revoke"
        actor: system
        preconditions:
          - "series.status IN {PROPOSED, ACTIVE, LAPSED}"
        side_effects:
          - "sets remaining_hold_slots = 0"
          - "every Series whose predecessor_series_id == this series recomputes seniority_at, which now stops at its own first_air_date because a RETIRED predecessor does not transfer seniority"
          - "increments Series.version by 1"

      - from: LAPSED
        to: RETIRED
        trigger: "system, during POST /producers/{producerId}/revoke"
        actor: system
        preconditions:
          - "series.status == LAPSED"
        side_effects:
          - "same side-effect set as ACTIVE -> RETIRED"
          - "increments Series.version by 1"

  - entity: Program
    dimension: review_status
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /programs/{programId}/submit"
        actor: Producer
        preconditions:
          - "program.review_status IN {DRAFT, CHANGES_REQUESTED}"
          - "program.clearance_status == CLEARED"
          - "producer.status == ACTIVE"
          - "producer.indemnification_expires_at is not null AND producer.indemnification_expires_at > clock_now"
          - "program.series_id is null OR series.status == ACTIVE"
          - "program.revision_round <= MAX_REVISION_ROUNDS"
        side_effects:
          - "sets reviewed_by_user_id = null"
          - "increments Program.version by 1"

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /programs/{programId}/submit (revision loop)"
        actor: Producer
        preconditions:
          - "program.review_status == CHANGES_REQUESTED"
          - "program.clearance_status == CLEARED"
          - "producer.status == ACTIVE"
          - "producer.indemnification_expires_at > clock_now"
          - "program.revision_round <= MAX_REVISION_ROUNDS"
        side_effects:
          - "sets reviewed_by_user_id = null so any ContentReviewer may claim the next round"
          - "increments Program.version by 1"
        note: "This is the cycle edge: UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW."

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /programs/{programId}/review-claim"
        actor: ContentReviewer
        preconditions:
          - "program.review_status == SUBMITTED"
        side_effects:
          - "sets reviewed_by_user_id = acting X-User-ID"
          - "increments Program.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /programs/{programId}/review-decision with decision = APPROVE"
        actor: ContentReviewer
        preconditions:
          - "program.review_status == UNDER_REVIEW"
          - "acting X-User-ID == program.reviewed_by_user_id"
          - "finding_category is absent (an approval may not carry a finding)"
        side_effects:
          - "clears finding_category and finding_notes"
          - "increments Program.version by 1"

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /programs/{programId}/review-decision with decision = REQUEST_CHANGES"
        actor: ContentReviewer
        preconditions:
          - "program.review_status == UNDER_REVIEW"
          - "acting X-User-ID == program.reviewed_by_user_id"
          - "finding_category IN UNPROTECTED_FINDING_CATEGORIES"
        side_effects:
          - "revision_round += 1"
          - "records finding_category and finding_notes"
          - "increments Program.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /programs/{programId}/review-decision with decision = REJECT"
        actor: ContentReviewer
        preconditions:
          - "program.review_status == UNDER_REVIEW"
          - "acting X-User-ID == program.reviewed_by_user_id"
          - "finding_category IN UNPROTECTED_FINDING_CATEGORIES"
        side_effects:
          - "records finding_category and finding_notes"
          - "every PlaybackSlot with program_id = this program and status = SCHEDULED transitions to WITHDRAWN with the same side-effect set as the withdraw cascade"
          - "increments Program.version by 1"

      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /programs/{programId}/withdraw"
        actor: Producer
        preconditions:
          - "program.review_status NOT IN {REJECTED, WITHDRAWN}"
        side_effects:
          - "CASCADE LINK 1: sets review_status = WITHDRAWN and withdrawn_reason"
          - "CASCADE LINK 2: every PlaybackSlot with program_id = this program and status = SCHEDULED transitions to WITHDRAWN; each such withdrawal decrements channel.scheduled_seconds by that slot's occupied_seconds and, when booking_type == SERIES_HOLD, increments series.remaining_hold_slots by 1 WITHOUT incrementing series.missed_windows"
          - "CASCADE LINK 3: every CrewAssignment on a slot withdrawn by link 2 whose status IN {OFFERED, CONFIRMED} transitions to RELEASED with release_reason = 'PROGRAM_WITHDRAWN', and that slot's staffing_status is recomputed"
          - "CASCADE LINK 4: every volunteer touched by link 3 has confirmed_crew_commitments recomputed"
          - "every ArchiveAsset with program_id = this program and on_demand_status = PUBLISHED transitions to WITHDRAWN"
          - "increments Program.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /programs/{programId}/withdraw"
        actor: Producer
        preconditions:
          - "program.review_status IN {DRAFT, SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED}"
        side_effects:
          - "sets review_status = WITHDRAWN and withdrawn_reason; no slots exist to cascade to from these states"
          - "increments Program.version by 1"

  - entity: Program
    dimension: clearance_status
    initial_state: INCOMPLETE
    terminal_states: []
    transitions:
      - from: INCOMPLETE
        to: CLEARED
        trigger: "POST /programs/{programId}/attestations — the call that completes the required kind set"
        actor: Producer
        preconditions:
          - "for each kind in {INDEMNIFICATION, COPYRIGHT_CLEARANCE, CONTENT_POLICY}, the latest attestation of that kind (greatest created_at, tie-break greatest sequence_number) has statement_version == CURRENT_STATEMENT_VERSION"
        side_effects:
          - "clearance_status = CLEARED; review_status is untouched (the two dimensions evolve independently)"
          - "for kind = INDEMNIFICATION, producer.indemnification_expires_at = clock_now + INDEMNIFICATION_TERM_DAYS"
          - "increments Program.version by 1"

      - from: CLEARED
        to: INCOMPLETE
        trigger: "POST /programs/{programId}/attestations superseding a kind with a non-current statement_version, OR system during POST /producers/{producerId}/revoke"
        actor: Producer | system
        preconditions:
          - "the latest attestation of at least one required kind no longer carries CURRENT_STATEMENT_VERSION, OR the owning producer has become REVOKED"
        side_effects:
          - "clearance_status = INCOMPLETE; a subsequent submit is refused with ERR_ATTESTATION_INCOMPLETE while review_status keeps its own value"
          - "increments Program.version by 1"

  - entity: PlaybackSlot
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [AIRED, CANCELLED, PREEMPTED, WITHDRAWN]
    transitions:
      - from: (none)
        to: SCHEDULED
        trigger: "POST /playback-slots"
        actor: SchedulingCoordinator
        preconditions:
          - "program.review_status == APPROVED"
          - "program.clearance_status == CLEARED"
          - "the slot fits inside the channel's daily window (calculations.playback_window_fit)"
          - "conflict resolution in calculations.playback_conflict_resolution either finds no overlap or authorises preemption"
          - "series_id, when supplied, names an ACTIVE series owned by program.producer_id with remaining_hold_slots >= 1"
        side_effects:
          - "freezes occupied_seconds, end_at, required_crew_roles (copied from the program) and sequence_number = channel.slot_sequence_high + 1"
          - "sets booking_type = SERIES_HOLD and decrements series.remaining_hold_slots by 1 when series_id was supplied, else FIRST_COME"
          - "channel.scheduled_seconds += occupied_seconds; channel.slot_sequence_high += 1"
          - "staffing_status = NOT_REQUIRED when required_crew_roles is empty, else UNDERSTAFFED"
          - "every authorised preemption target transitions SCHEDULED -> PREEMPTED"
          - "increments Channel.version by 1"

      - from: SCHEDULED
        to: PREEMPTED
        trigger: "system, during POST /playback-slots when a series-priority challenger displaces this first-come slot"
        actor: system
        preconditions:
          - "incumbent.status == SCHEDULED"
          - "incumbent.booking_type == FIRST_COME"
          - "channel.preemption_enabled == true"
          - "challenger series seniority is strictly earlier than the incumbent's priority key"
        side_effects:
          - "sets preempted_by_slot_id = challenger slot id"
          - "channel.scheduled_seconds -= occupied_seconds"
          - "every CrewAssignment on this slot with status IN {OFFERED, CONFIRMED} transitions to RELEASED with release_reason = 'SLOT_PREEMPTED', then staffing_status is recomputed and each volunteer's confirmed_crew_commitments is recomputed"
          - "increments PlaybackSlot.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /playback-slots/{slotId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "slot.status == SCHEDULED"
        side_effects:
          - "channel.scheduled_seconds -= occupied_seconds; records cancellation_reason"
          - "when booking_type == SERIES_HOLD: series.remaining_hold_slots += 1 AND series.missed_windows += 1, and the series lapses when missed_windows reaches SERIES_LAPSE_MISSED_WINDOWS"
          - "every CrewAssignment on this slot with status IN {OFFERED, CONFIRMED} transitions to RELEASED with release_reason = 'SLOT_CANCELLED'; staffing_status and each volunteer's confirmed_crew_commitments are recomputed"
          - "every Reservation with linked_slot_id = this slot and status IN {REQUESTED, CONFIRMED} keeps its own status (studio time is not auto-released)"
          - "increments PlaybackSlot.version by 1"

      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "system, during POST /programs/{programId}/withdraw or a REJECT decision on the program"
        actor: system
        preconditions:
          - "slot.status == SCHEDULED"
        side_effects:
          - "channel.scheduled_seconds -= occupied_seconds"
          - "when booking_type == SERIES_HOLD: series.remaining_hold_slots += 1 and missed_windows is NOT incremented (the series is not penalised for an editorial withdrawal) — this is the observable divergence from the CANCELLED branch"
          - "every CrewAssignment on this slot with status IN {OFFERED, CONFIRMED} transitions to RELEASED with release_reason = 'PROGRAM_WITHDRAWN'; staffing_status and each volunteer's confirmed_crew_commitments are recomputed"
          - "increments PlaybackSlot.version by 1"

      - from: SCHEDULED
        to: AIRED
        trigger: "POST /playback-slots/{slotId}/air"
        actor: SchedulingCoordinator
        preconditions:
          - "slot.status == SCHEDULED"
          - "clock_now >= slot.start_at"
          - "program.review_status == APPROVED"
          - "slot.staffing_status IN {READY, NOT_REQUIRED}"
        side_effects:
          - "sets aired_at = clock_now and measured_households from the request"
          - "channel.scheduled_seconds -= occupied_seconds; channel.aired_seconds += occupied_seconds"
          - "every CrewAssignment on this slot with status = CONFIRMED transitions to COMPLETED with credited_hours_tenths = ceil(occupied_seconds / 360); each volunteer's volunteer_hours_tenths += that credit and confirmed_crew_commitments is recomputed"
          - "creates one ArchiveAsset (on_demand_status = PENDING, impact_variant = PROVISIONAL) whose community_impact_index is the PROVISIONAL variant of calculations.community_impact_index"
          - "increments PlaybackSlot.version by 1"

  - entity: StudioResource
    dimension: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /studio-resources/{resourceId}/status with status = MAINTENANCE"
        actor: FacilitiesManager
        preconditions:
          - "resource.status == AVAILABLE"
        side_effects:
          - "records status_reason; existing reservations keep their status but no REQUESTED reservation on this resource can be confirmed while in MAINTENANCE"
          - "increments StudioResource.version by 1"

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /studio-resources/{resourceId}/status with status = AVAILABLE"
        actor: FacilitiesManager
        preconditions:
          - "resource.status == MAINTENANCE"
        side_effects:
          - "records status_reason"
          - "increments StudioResource.version by 1"

      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /studio-resources/{resourceId}/status with status = RETIRED"
        actor: FacilitiesManager
        preconditions:
          - "resource.status IN {AVAILABLE, MAINTENANCE}"
          - "resource.open_reservation_count == 0"
        side_effects:
          - "records status_reason; the resource can never leave RETIRED"
          - "increments StudioResource.version by 1"

      - from: MAINTENANCE
        to: RETIRED
        trigger: "POST /studio-resources/{resourceId}/status with status = RETIRED"
        actor: FacilitiesManager
        preconditions:
          - "resource.status == MAINTENANCE"
          - "resource.open_reservation_count == 0"
        side_effects:
          - "records status_reason"
          - "increments StudioResource.version by 1"

  - entity: Reservation
    dimension: status
    initial_state: REQUESTED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /reservations/{reservationId}/confirm"
        actor: FacilitiesManager
        preconditions:
          - "reservation.status == REQUESTED"
          - "resource.status == AVAILABLE"
          - "producer.status == ACTIVE"
          - "resource.required_competency_code IN producer.competency_codes"
          - "producer.deposit_held_cents + this reservation's computed hold <= DEPOSIT_HOLD_CAP_CENTS"
        side_effects:
          - "freezes risk_bp and deposit_hold_cents via calculations.reservation_deposit_hold"
          - "producer.deposit_held_cents += deposit_hold_cents"
          - "resource.open_reservation_count += 1"
          - "increments Reservation.version by 1"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /reservations/{reservationId}/cancel"
        actor: Producer | FacilitiesManager
        preconditions:
          - "reservation.status == REQUESTED"
        side_effects:
          - "records cancellation_reason; no deposit was held so no ledger movement occurs"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{reservationId}/cancel"
        actor: Producer | FacilitiesManager
        preconditions:
          - "reservation.status == CONFIRMED"
        side_effects:
          - "COMPENSATING ACTION: deposit_refunded_cents = deposit_hold_cents, deposit_forfeited_cents = 0, uncovered_liability_cents = 0; deposit_hold_cents itself is retained for audit"
          - "producer.deposit_held_cents -= deposit_hold_cents (restoring the invariant sum over {CONFIRMED, CHECKED_OUT, DAMAGE_REVIEW})"
          - "resource.open_reservation_count -= 1"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CHECKED_OUT
        trigger: "POST /reservations/{reservationId}/checkout"
        actor: FacilitiesManager
        preconditions:
          - "reservation.status == CONFIRMED"
          - "producer.status == ACTIVE"
          - "clock_now >= reservation.start_at - CHECKOUT_LEAD_SECONDS"
          - "clock_now < reservation.end_at"
        side_effects:
          - "sets checked_out_at = clock_now and condition_notes"
          - "increments Reservation.version by 1"

      - from: CHECKED_OUT
        to: SETTLED
        trigger: "POST /reservations/{reservationId}/return with damage_observed = false"
        actor: FacilitiesManager
        preconditions:
          - "reservation.status == CHECKED_OUT"
        side_effects:
          - "BRANCH A (clean): sets returned_at, computes late_fee_cents / deposit_forfeited_cents / deposit_refunded_cents / uncovered_liability_cents via calculations.reservation_final_settlement with assessed_repair_cents = 0"
          - "producer.deposit_held_cents -= deposit_hold_cents; producer.deposit_forfeited_total_cents += deposit_forfeited_cents"
          - "resource.open_reservation_count -= 1"
          - "no DamageAssessment is created and no suspension point is applied"
          - "increments Reservation.version by 1"

      - from: CHECKED_OUT
        to: DAMAGE_REVIEW
        trigger: "POST /reservations/{reservationId}/return with damage_observed = true"
        actor: FacilitiesManager
        preconditions:
          - "reservation.status == CHECKED_OUT"
          - "severity and repair_estimate_cents are both present"
        side_effects:
          - "BRANCH B (damaged): sets returned_at and computes late_fee_cents only; the deposit stays held and producer.deposit_held_cents is unchanged"
          - "creates one DamageAssessment (status = FILED, filed_by_user_id = acting X-User-ID, assessed_repair_cents = 0, suspension_points_assessed = 0) — discoverable only through GET /damage-assessments filtered by reservation_id"
          - "resource.open_reservation_count is unchanged (DAMAGE_REVIEW still counts as open)"
          - "increments Reservation.version by 1"

      - from: DAMAGE_REVIEW
        to: SETTLED
        trigger: "system, during POST /damage-assessments/{assessmentId}/finalize or POST /damage-assessments/{assessmentId}/waive"
        actor: system
        preconditions:
          - "reservation.status == DAMAGE_REVIEW"
          - "the assessment leaves FILED"
        side_effects:
          - "JOIN POINT: assessed_repair_cents = assessment.assessed_repair_cents (0 when waived); recomputes deposit_forfeited_cents / deposit_refunded_cents / uncovered_liability_cents via calculations.reservation_final_settlement"
          - "producer.deposit_held_cents -= deposit_hold_cents; producer.deposit_forfeited_total_cents += deposit_forfeited_cents"
          - "resource.open_reservation_count -= 1"
          - "increments Reservation.version by 1"

  - entity: DamageAssessment
    dimension: status
    initial_state: FILED
    terminal_states: [FINALIZED, WAIVED]
    transitions:
      - from: FILED
        to: FINALIZED
        trigger: "POST /damage-assessments/{assessmentId}/finalize"
        actor: FacilitiesManager
        preconditions:
          - "assessment.status == FILED"
          - "reservation.status == DAMAGE_REVIEW"
        side_effects:
          - "CASCADE LINK 1: computes assessed_repair_cents and suspension_points_assessed via calculations.damage_penalty_assessment"
          - "CASCADE LINK 1b: the reservation transitions DAMAGE_REVIEW -> SETTLED, applying the final settlement"
          - "CASCADE LINK 2: producer.suspension_points += suspension_points_assessed"
          - "CASCADE LINK 3+: when the new total reaches SUSPENSION_THRESHOLD_POINTS the producer transitions ACTIVE -> SUSPENDED, whose own side effects cancel that producer's other open reservations and release their crew assignments, which in turn recompute each affected slot's staffing_status and the producer's confirmed_crew_commitments"
          - "increments DamageAssessment.version by 1"

      - from: FILED
        to: WAIVED
        trigger: "POST /damage-assessments/{assessmentId}/waive"
        actor: FinanceOfficer
        preconditions:
          - "assessment.status == FILED"
          - "reservation.status == DAMAGE_REVIEW"
          - "acting X-User-ID != assessment.filed_by_user_id"
        side_effects:
          - "COMPENSATION: assessed_repair_cents stays 0 and suspension_points_assessed stays 0; sets waived_by_user_id and waiver_reason"
          - "the reservation transitions DAMAGE_REVIEW -> SETTLED with assessed_repair_cents = 0, so only the late fee can be forfeited"
          - "producer.suspension_points is unchanged and the producer never leaves ACTIVE on this path"
          - "increments DamageAssessment.version by 1"

  - entity: CrewAssignment
    dimension: status
    initial_state: OFFERED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /crew-assignments/{assignmentId}/confirm"
        actor: Producer
        preconditions:
          - "assignment.status == OFFERED"
          - "slot.status == SCHEDULED"
          - "volunteer.status == ACTIVE"
          - "no other CrewAssignment for this volunteer with status = CONFIRMED sits on a slot whose [start_at, end_at) overlaps this slot's interval"
        side_effects:
          - "slot.staffing_status recomputed via calculations.crew_staffing_readiness"
          - "volunteer.confirmed_crew_commitments += 1"
          - "increments CrewAssignment.version by 1"

      - from: OFFERED
        to: RELEASED
        trigger: "POST /crew-assignments/{assignmentId}/release, or system during slot cancel/withdraw/preempt or producer suspend/revoke"
        actor: Producer | SchedulingCoordinator | system
        preconditions:
          - "assignment.status == OFFERED"
        side_effects:
          - "records release_reason; slot.staffing_status recomputed"
          - "increments CrewAssignment.version by 1"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /crew-assignments/{assignmentId}/release, or system during slot cancel/withdraw/preempt or producer suspend/revoke"
        actor: Producer | SchedulingCoordinator | system
        preconditions:
          - "assignment.status == CONFIRMED"
          - "slot.status != AIRED"
        side_effects:
          - "records release_reason; slot.staffing_status recomputed (READY may fall back to UNDERSTAFFED)"
          - "volunteer.confirmed_crew_commitments -= 1"
          - "increments CrewAssignment.version by 1"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system, during POST /playback-slots/{slotId}/air"
        actor: system
        preconditions:
          - "assignment.status == CONFIRMED"
          - "slot transitions SCHEDULED -> AIRED"
        side_effects:
          - "credited_hours_tenths = ceil(slot.occupied_seconds / 360)"
          - "volunteer.volunteer_hours_tenths += credited_hours_tenths; volunteer.confirmed_crew_commitments -= 1"
          - "increments CrewAssignment.version by 1"

  - entity: FundingPeriod
    dimension: report_status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /funding-periods/{periodId}/report-submit"
        actor: FinanceOfficer
        preconditions:
          - "period.report_status == DRAFT"
          - "period.allocable_base_cents > 0"
        side_effects:
          - "recomputes allocable_base_cents / admin_reserve_cents / capital_allocation_cents / operating_allocation_cents / total_program_funds_cents via calculations.franchise_fee_allocation in the pinned order"
          - "sets submitted_by_user_id = acting X-User-ID"
          - "increments FundingPeriod.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /funding-periods/{periodId}/report-decision with decision = ACCEPT"
        actor: CenterAdmin
        preconditions:
          - "period.report_status == SUBMITTED"
          - "acting X-User-ID != period.submitted_by_user_id"
        side_effects:
          - "sets decided_by_user_id; the period's figures are frozen (no further revision is accepted)"
          - "increments FundingPeriod.version by 1"

      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /funding-periods/{periodId}/report-decision with decision = RETURN"
        actor: CenterAdmin
        preconditions:
          - "period.report_status == SUBMITTED"
          - "acting X-User-ID != period.submitted_by_user_id"
          - "reason is present"
        side_effects:
          - "sets decided_by_user_id and decision_reason"
          - "increments FundingPeriod.version by 1"

      - from: RETURNED_FOR_REVISION
        to: DRAFT
        trigger: "POST /funding-periods/{periodId}/revise"
        actor: FinanceOfficer
        preconditions:
          - "period.report_status IN {DRAFT, RETURNED_FOR_REVISION}"
          - "expected_funding_period_version == period.version"
        side_effects:
          - "restates any supplied figures, resets submitted_by_user_id to null, revision_round += 1"
          - "recomputes the allocation fields under the (possibly changed) basis"
          - "increments FundingPeriod.version by 1"
        note: "This is the cycle edge: DRAFT -> SUBMITTED -> RETURNED_FOR_REVISION -> DRAFT."

      - from: DRAFT
        to: DRAFT
        trigger: "POST /funding-periods/{periodId}/revise (restatement before first submission)"
        actor: FinanceOfficer
        preconditions:
          - "period.report_status == DRAFT"
          - "expected_funding_period_version == period.version"
        side_effects:
          - "restates any supplied figures, revision_round += 1, recomputes the allocation fields"
          - "increments FundingPeriod.version by 1"

  - entity: ArchiveAsset
    dimension: on_demand_status
    initial_state: PENDING
    terminal_states: [PURGED]
    transitions:
      - from: PENDING
        to: PUBLISHED
        trigger: "POST /archive-assets/{assetId}/publish"
        actor: CenterAdmin
        preconditions:
          - "asset.on_demand_status == PENDING"
          - "program.review_status == APPROVED"
          - "source slot status == AIRED"
        side_effects:
          - "sets retention_class, published_at = clock_now and retain_until via calculations.archive_retention_deadline"
          - "recomputes community_impact_index with the FINAL variant and sets impact_variant = FINAL"
          - "increments ArchiveAsset.version by 1"

      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system, during POST /programs/{programId}/withdraw"
        actor: system
        preconditions:
          - "asset.on_demand_status == PUBLISHED"
        side_effects:
          - "the asset stops accepting view records; retain_until and community_impact_index are frozen at their last values"
          - "increments ArchiveAsset.version by 1"

      - from: PUBLISHED
        to: PURGED
        trigger: "POST /archive-assets/{assetId}/purge"
        actor: CenterAdmin
        preconditions:
          - "asset.on_demand_status IN {PUBLISHED, WITHDRAWN}"
          - "asset.retention_class != PERMANENT"
          - "clock_now >= asset.retain_until"
        side_effects:
          - "sets purged_at = clock_now; on_demand_views and community_impact_index are frozen"
          - "increments ArchiveAsset.version by 1"

      - from: WITHDRAWN
        to: PURGED
        trigger: "POST /archive-assets/{assetId}/purge"
        actor: CenterAdmin
        preconditions:
          - "asset.on_demand_status == WITHDRAWN"
          - "asset.retention_class != PERMANENT"
          - "clock_now >= asset.retain_until"
        side_effects:
          - "sets purged_at = clock_now"
          - "increments ArchiveAsset.version by 1"

# -----------------------------------------------------------------------------
# Table 2.1: Concurrency Rules (OCC on the parent's version — no other mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: hold-plan-supersede-stale-series
    parent_entity: Series
    write_endpoint: "POST /series/{seriesId}/hold-plans"
    occ_field: "expected_series_version"
    description: |
      A hold plan replaces whatever plan the series previously carried, so a
      second plan submitted against the same series is legitimate business
      behaviour rather than an error. The scheduling coordinator must therefore
      prove the plan was authored against the series state they last observed:
      a request whose expected_series_version is behind Series.version is
      rejected, because the series has since been activated, lapsed,
      re-planned, or had hold slots consumed by scheduling.
    error_id: ERR_STALE_SERIES_VERSION
    http_status: 412

  - rule_id: period-revision-stale-funding-period
    parent_entity: FundingPeriod
    write_endpoint: "POST /funding-periods/{periodId}/revise"
    occ_field: "expected_funding_period_version"
    description: |
      Restating a funding period's franchise-fee figures supersedes the prior
      restatement, and restating twice is legal municipal practice, so the
      second request cannot be refused on state grounds alone. It is refused
      when expected_funding_period_version is behind FundingPeriod.version,
      i.e. when the officer's figures were derived from a view of the period
      that a prior restatement or a report decision has already advanced.
    error_id: ERR_STALE_FUNDING_PERIOD_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# Table 3: Calculation Table
# -----------------------------------------------------------------------------
calculations:

  - id: producer_certification_level
    name: "Producer certification level derivation"
    algorithm_type: threshold
    trigger: "recomputed on enrollment PASS, on producer suspend, on producer reinstate, and on producer revoke"
    description: |
      A producer's certification_level is derived only from the tiers of the
      training courses whose enrollments reached PASSED, and it is gated by the
      producer's own status: a SUSPENDED or REVOKED producer is NONE regardless
      of course history, while reinstatement re-derives the level from the
      surviving PASSED enrollments (nothing is lost permanently).
    inputs:
      - "producer.status"
      - "the set of CourseEnrollment rows for this producer with status == PASSED"
      - "TrainingCourse.tier of each such enrollment's course"
    formula: |
      if producer.status IN {SUSPENDED, REVOKED, APPLICANT}: certification_level = NONE
      else:
        passed_tiers = { course.tier for each PASSED enrollment of this producer }
        if {BASIC, ADVANCED, LIVE} subset-of passed_tiers: certification_level = LIVE
        elif {BASIC, ADVANCED} subset-of passed_tiers:      certification_level = ADVANCED
        elif {BASIC} subset-of passed_tiers:                certification_level = BASIC
        else:                                               certification_level = NONE
      competency_codes = union of course.grants_competency_codes over PASSED enrollments
    input_set_filter: "enrollments with status == PASSED only; ENROLLED, ATTENDED, FAILED and WITHDRAWN enrollments contribute nothing"
    constants:
      PASS_SCORE_MIN: 80
    precision: "n/a (enumerated result)"
    worked_example: |
      Producer has PASSED TV-101 (BASIC) and PASSED TV-201 (ADVANCED), plus an
      ATTENDED-but-ungraded TV-301 (LIVE) enrollment.
      passed_tiers = {BASIC, ADVANCED} -> certification_level = ADVANCED.
      After TV-301 is graded 91 -> passed_tiers = {BASIC, ADVANCED, LIVE} -> LIVE.
      After a MAJOR damage finalize pushes suspension_points to 3 -> NONE.
      After reinstate crediting 2 points -> back to LIVE (nothing was erased).

  - id: series_seniority_at
    name: "Series seniority timestamp (predecessor chain traversal)"
    algorithm_type: topological
    trigger: "computed on POST /series/{seriesId}/activate; recomputed on every successor when a predecessor is RETIRED"
    description: |
      Series priority is by seniority, and a continuing series inherits the
      first_air_date of the series it succeeds. Seniority therefore walks the
      predecessor_series_id chain backwards and takes the earliest first_air_date
      reachable, but the walk STOPS as soon as it meets a RETIRED predecessor:
      a retired lineage does not lend its seniority forward. The walk also stops
      after visiting a node twice (cycle guard) and treats the current node's own
      first_air_date as the floor.
    inputs:
      - "series.first_air_date"
      - "series.predecessor_series_id (FK -> Series.id, nullable)"
      - "the status and first_air_date of each ancestor"
    formula: |
      seniority = series.first_air_date
      visited = { series.id }
      cursor  = series.predecessor_series_id
      while cursor is not null:
        pred = Series[cursor]
        if pred.id IN visited: break            # cycle guard
        if pred.status == RETIRED: break         # retired lineage stops inheritance
        visited.add(pred.id)
        seniority = min(seniority, pred.first_air_date)
        cursor = pred.predecessor_series_id
      seniority_at = seniority
    input_set_filter: "ancestors with status != RETIRED only; the traversal halts at the first RETIRED ancestor and ignores everything beyond it"
    constants: {}
    precision: "ISO-8601 UTC timestamp, second precision, no rounding"
    worked_example: |
      S1.first_air_date = 2024-03-01T00:00:00Z (ACTIVE),
      S2.first_air_date = 2025-06-01T00:00:00Z, predecessor = S1,
      S3.first_air_date = 2026-09-01T00:00:00Z, predecessor = S2.
      Activating S3 walks S3 -> S2 -> S1 and yields seniority_at = 2024-03-01T00:00:00Z.
      If S1 is RETIRED first, the walk stops AT S1 (S1 is not counted) and
      S3.seniority_at = min(2026-09-01, 2025-06-01) = 2025-06-01T00:00:00Z.

  - id: playback_window_fit
    name: "Playback slot footprint and channel-window fit"
    algorithm_type: interval_merge
    trigger: "POST /playback-slots"
    description: |
      A slot occupies its program's runtime plus the channel's mandatory
      inter-program buffer, and the whole footprint must sit inside the
      channel's daily broadcast window measured in minutes from UTC midnight.
      The footprint interval is half-open [start_at, end_at): a slot that begins
      exactly when another ends does not overlap it.
    inputs:
      - "program.runtime_seconds"
      - "channel.inter_program_buffer_seconds"
      - "channel.daily_window_start_minute, channel.daily_window_end_minute"
      - "requested start_at"
    formula: |
      occupied_seconds = program.runtime_seconds + channel.inter_program_buffer_seconds
      end_at           = start_at + occupied_seconds
      start_minute     = (hour(start_at) * 60) + minute(start_at)
      end_offset_sec   = ((start_minute * 60) + second(start_at)) + occupied_seconds
      fits = start_minute >= channel.daily_window_start_minute
             AND end_offset_sec <= channel.daily_window_end_minute * 60
      if not fits: ERR_SLOT_OUTSIDE_CHANNEL_WINDOW
    input_set_filter: "the requested slot only; existing slots are handled by playback_conflict_resolution"
    constants: {}
    precision: "integer seconds; no rounding anywhere"
    worked_example: |
      runtime_seconds = 1800, inter_program_buffer_seconds = 120 -> occupied_seconds = 1920.
      Channel window 1080..1380 (18:00..23:00 UTC).
      start_at = 2026-08-10T18:00:00Z -> start_minute 1080, end_offset 66720 s = 1852 min... :
        end_offset_sec = 1080*60 + 0 + 1920 = 66720 <= 1380*60 = 82800 -> fits, end_at = 18:32:00Z.
      start_at = 2026-08-10T22:45:00Z -> end_offset_sec = 1365*60 + 1920 = 83820 > 82800
        -> ERR_SLOT_OUTSIDE_CHANNEL_WINDOW (the buffer is what pushes it over).

  - id: playback_conflict_resolution
    name: "First-come vs series-priority conflict resolution"
    algorithm_type: chronological
    trigger: "POST /playback-slots, after playback_window_fit succeeds"
    description: |
      Airtime is granted first-come, except that an ACTIVE series holding an
      unconsumed hold slot may displace first-come bookings that were made with
      less seniority. Preemption is all-or-nothing: every overlapping incumbent
      must be displaceable, otherwise the request is refused and nothing is
      preempted. Ordering never depends on record ids; the priority key is a
      timestamp with an explicit monotone tie-break.
    inputs:
      - "the candidate footprint [start_at, end_at) from playback_window_fit"
      - "existing PlaybackSlot rows on the same channel with status == SCHEDULED"
      - "channel.preemption_enabled"
      - "the challenger's series (status, seniority_at, remaining_hold_slots, sequence_number)"
    formula: |
      overlaps = [ s in channel slots where s.status == SCHEDULED
                   AND s.start_at < candidate.end_at
                   AND candidate.start_at < s.end_at ]          # half-open
      if overlaps is empty: accept as FIRST_COME (or SERIES_HOLD when series_id given)
      if series_id is null:                       -> ERR_SLOT_WINDOW_CONFLICT
      if channel.preemption_enabled == false:     -> ERR_SLOT_WINDOW_CONFLICT
      if series.status != ACTIVE:                 -> ERR_SERIES_NOT_ACTIVE
      if series.remaining_hold_slots < 1:         -> ERR_SERIES_HOLD_EXHAUSTED
      for each incumbent in overlaps:
        if incumbent.booking_type != FIRST_COME:  -> ERR_SLOT_WINDOW_CONFLICT
        incumbent_key = incumbent.series.seniority_at if incumbent.series_id is not null
                        else incumbent.created_at
        if NOT (series.seniority_at < incumbent_key):
          if series.seniority_at == incumbent_key
             AND incumbent.series_id is not null
             AND series.sequence_number < incumbent.series.sequence_number:
            continue                              # documented tie-break
          -> ERR_SLOT_WINDOW_CONFLICT             # strictly-earlier requirement not met
      accept, and transition every incumbent in overlaps SCHEDULED -> PREEMPTED
    input_set_filter: "SCHEDULED slots on the same channel_id only; AIRED, CANCELLED, PREEMPTED and WITHDRAWN slots never block a booking"
    constants: {}
    precision: "second-precision timestamp comparison; ties broken by Series.sequence_number ASC (never by id)"
    worked_example: |
      Incumbent F is FIRST_COME on channel C, created_at 2026-08-02T00:00:00Z,
      footprint 18:00:00Z-18:32:00Z on 2026-08-10. C.preemption_enabled = true.
      Challenger series S has seniority_at 2024-03-01T00:00:00Z and
      remaining_hold_slots 2 -> 2024-03-01 < 2026-08-02, so the booking is
      accepted as SERIES_HOLD, F becomes PREEMPTED with preempted_by_slot_id set,
      and S.remaining_hold_slots becomes 1.
      If S.seniority_at were 2026-09-01T00:00:00Z the comparison fails and the
      request is refused with ERR_SLOT_WINDOW_CONFLICT while F stays SCHEDULED.

  - id: reservation_deposit_hold
    name: "Reservation deposit hold (per-line rounding, pinned order)"
    algorithm_type: tiered_pricing
    trigger: "POST /reservations/{reservationId}/confirm"
    description: |
      The deposit hold is built from three independently rounded surcharge
      lines evaluated in a pinned order and only then summed; the per-line
      rounding is normative and produces a different total from rounding a
      combined rate once. The result is finally clamped to the resource's
      replacement value.
    inputs:
      - "resource.base_deposit_cents"
      - "resource.replacement_value_cents"
      - "producer.suspension_points"
      - "reservation.start_at, reservation.end_at"
      - "reservation.linked_slot_id and, when set, slot.is_live via the program"
    formula: |
      STEP 1  risk_bp       = min(RISK_BP_CAP, producer.suspension_points * RISK_BP_PER_SUSPENSION_POINT)
      STEP 2  started_hours = ceil((end_at - start_at) / 3600)
              duration_bp   = HOURLY_DEPOSIT_RATE_BP * max(0, started_hours - 1)
      STEP 3  live_bp       = LIVE_LINK_SURCHARGE_BP if the linked slot's program.is_live else 0
      STEP 4  line_risk     = ROUND_HALF_UP(base_deposit_cents * (10000 + risk_bp) / 10000)
      STEP 5  line_duration = ROUND_HALF_UP(base_deposit_cents * duration_bp / 10000)
      STEP 6  line_live     = ROUND_HALF_UP(base_deposit_cents * live_bp / 10000)
      STEP 7  raw_hold      = line_risk + line_duration + line_live
      STEP 8  deposit_hold_cents = min(raw_hold, resource.replacement_value_cents)
      (Summing the basis points first and rounding once is NOT the rule.)
    input_set_filter: "only the producer's currently unresolved suspension_points feed risk_bp; points already credited back by a reinstatement do not"
    constants:
      RISK_BP_PER_SUSPENSION_POINT: 1500
      RISK_BP_CAP: 4500
      HOURLY_DEPOSIT_RATE_BP: 500
      LIVE_LINK_SURCHARGE_BP: 2000
    precision: "integer cents, ROUND_HALF_UP applied once per line (steps 4-6), never to the sum"
    worked_example: |
      base_deposit_cents = 12345, replacement_value_cents = 900000,
      suspension_points = 1, window 3 h, linked slot's program.is_live = true.
      risk_bp = 1500; started_hours = 3 -> duration_bp = 1000; live_bp = 2000.
      line_risk     = ROUND_HALF_UP(12345 * 11500 / 10000) = ROUND_HALF_UP(14196.75) = 14197
      line_duration = ROUND_HALF_UP(12345 * 1000 / 10000)  = ROUND_HALF_UP(1234.5)   = 1235
      line_live     = ROUND_HALF_UP(12345 * 2000 / 10000)  = 2469
      deposit_hold_cents = 14197 + 1235 + 2469 = 17901
      (rounding the combined 14500 bp once would give 17900 - one cent apart).
      Clean comparison run: 0 points, 2 h, no live link ->
      12345 + ROUND_HALF_UP(617.25) + 0 = 12345 + 617 = 12962.

  - id: reservation_final_settlement
    name: "Reservation settlement (late fee, forfeiture, refund, uncovered liability)"
    algorithm_type: waterfall_allocation
    trigger: "POST /reservations/{reservationId}/return (clean branch) and the DAMAGE_REVIEW -> SETTLED join"
    description: |
      At settlement the held deposit is drained in a fixed waterfall: the late
      fee is charged first, the assessed repair second, and only what survives
      is refunded. Anything the deposit cannot absorb becomes uncovered
      liability, so hold = forfeited + refunded and forfeited + uncovered =
      late_fee + assessed_repair always hold.
    inputs:
      - "reservation.deposit_hold_cents"
      - "reservation.end_at, reservation.returned_at"
      - "resource.base_deposit_cents"
      - "assessment.assessed_repair_cents (0 on the clean branch and on the waived branch)"
    formula: |
      STEP 1  late_seconds     = max(0, returned_at - end_at)
              started_late_hrs = ceil(late_seconds / 3600)
      STEP 2  per_hour_fee     = ROUND_HALF_UP(resource.base_deposit_cents * LATE_FEE_BP_PER_HOUR / 10000)
              late_fee_cents   = per_hour_fee * started_late_hrs
      STEP 3  charges          = late_fee_cents + assessed_repair_cents
      STEP 4  deposit_forfeited_cents = min(deposit_hold_cents, charges)
      STEP 5  deposit_refunded_cents  = deposit_hold_cents - deposit_forfeited_cents
      STEP 6  uncovered_liability_cents = max(0, charges - deposit_hold_cents)
    input_set_filter: "only the returned_at of this reservation matters; an on-time return (returned_at <= end_at) yields started_late_hrs = 0 and late_fee_cents = 0"
    constants:
      LATE_FEE_BP_PER_HOUR: 750
    precision: "integer cents; the per-hour fee is rounded once (step 2) and then multiplied, never rounded after multiplication"
    worked_example: |
      base_deposit_cents = 12345, deposit_hold_cents = 12962, returned 1 h 5 min late,
      no damage: started_late_hrs = ceil(3900/3600) = 2,
      per_hour_fee = ROUND_HALF_UP(12345 * 750 / 10000) = ROUND_HALF_UP(925.875) = 926,
      late_fee_cents = 1852, charges = 1852,
      forfeited = 1852, refunded = 12962 - 1852 = 11110, uncovered = 0.
      Same reservation with assessed_repair_cents = 120000:
      charges = 121852, forfeited = 12962, refunded = 0, uncovered = 108890.

  - id: damage_penalty_assessment
    name: "Damage assessment repair amount and suspension points"
    algorithm_type: threshold
    trigger: "POST /damage-assessments/{assessmentId}/finalize"
    description: |
      Finalizing an assessment converts the filed repair estimate into an
      assessed amount capped at the equipment's replacement value, and converts
      severity into suspension points with one extra point when the assessed
      repair reaches the escalation threshold. Reaching the cumulative
      suspension threshold is what suspends the producer.
    inputs:
      - "assessment.severity"
      - "assessment.repair_estimate_cents"
      - "resource.replacement_value_cents"
      - "producer.suspension_points before the finalize"
    formula: |
      assessed_repair_cents      = min(repair_estimate_cents, resource.replacement_value_cents)
      base_points                = SUSPENSION_POINTS_BY_SEVERITY[severity]
      escalation                 = 1 if assessed_repair_cents >= REPAIR_ESCALATION_CENTS else 0
      suspension_points_assessed = base_points + escalation
      new_total                  = producer.suspension_points + suspension_points_assessed
      suspend = (producer.status == ACTIVE) AND (new_total >= SUSPENSION_THRESHOLD_POINTS)
    input_set_filter: "only assessments that reach FINALIZED contribute points; a WAIVED assessment contributes 0 repair and 0 points"
    constants:
      SUSPENSION_POINTS_BY_SEVERITY: {MINOR: 1, MAJOR: 2, TOTAL_LOSS: 3}
      REPAIR_ESCALATION_CENTS: 50000
      SUSPENSION_THRESHOLD_POINTS: 3
    precision: "integer cents and integer points; no rounding"
    worked_example: |
      severity = MINOR, repair_estimate_cents = 49999, replacement_value_cents = 900000
      -> assessed_repair_cents = 49999, escalation = 0, points = 1. Producer at 1 point: no suspension.
      severity = MINOR, repair_estimate_cents = 50000 -> escalation = 1, points = 2.
      A producer already holding 1 point crosses to 3 -> SUSPENDED.
      severity = TOTAL_LOSS, repair_estimate_cents = 1200000 -> assessed capped at 900000,
      escalation = 1, points = 4.

  - id: crew_staffing_readiness
    name: "Live crew staffing readiness"
    algorithm_type: constraint_propagation
    trigger: "recomputed on crew confirm, crew release, and every cascade that releases a crew assignment"
    description: |
      A slot is READY only when every role its program requires is covered by a
      CONFIRMED assignment. An empty requirement set is NOT_REQUIRED and can
      never be UNDERSTAFFED, and losing one confirmed volunteer propagates the
      slot straight back from READY to UNDERSTAFFED.
    inputs:
      - "slot.required_crew_roles (frozen from the program at slot creation)"
      - "the CrewAssignment rows on this slot with status IN {CONFIRMED, COMPLETED}"
    formula: |
      if slot.required_crew_roles is empty: staffing_status = NOT_REQUIRED
      else:
        covered = { a.crew_role for a in slot assignments where a.status IN {CONFIRMED, COMPLETED} }
        staffing_status = READY if required_crew_roles subset-of covered else UNDERSTAFFED
    input_set_filter: "OFFERED and RELEASED assignments never count toward coverage; duplicate roles do not add coverage"
    constants:
      LIVE_ROLES_REQUIRING_LIVE_CERT: [DIRECTOR, SWITCHER]
    precision: "n/a (enumerated result)"
    worked_example: |
      required_crew_roles = [DIRECTOR, CAMERA, AUDIO].
      Confirming DIRECTOR and CAMERA -> UNDERSTAFFED. Confirming AUDIO -> READY.
      Releasing the AUDIO volunteer -> UNDERSTAFFED again, and POST /air is
      refused with ERR_SLOT_UNDERSTAFFED.
      A program with required_crew_roles = [] gives NOT_REQUIRED and airs freely.

  - id: franchise_fee_allocation
    name: "Franchise fee and capital funding allocation (dual variant, branch matrix)"
    algorithm_type: waterfall_allocation
    variants: [ACCRUAL, CASH]
    trigger: "POST /funding-periods/{periodId}/report-submit and POST /funding-periods/{periodId}/revise"
    description: |
      Municipal reporting recognises franchise revenue under one of two bases,
      and the recognised amount then chooses an administrative reserve rate from
      a two-row tier table. The four basis x tier combinations are a genuine
      branch matrix: the same raw figures produce four different allocations.
      Whatever the branch, admin + capital + operating always equals
      allocable_base + capital_grant.
    inputs:
      - "period.basis (ACCRUAL | CASH)"
      - "period.service_period_earned_cents"
      - "period.remittance_received_cents"
      - "period.capital_grant_cents"
    formula: |
      STEP 1  allocable_base_cents = service_period_earned_cents  if basis == ACCRUAL
                                    remittance_received_cents     if basis == CASH
      STEP 2  admin_bp = ADMIN_RESERVE_BP_HIGH if allocable_base_cents >= HIGH_TIER_THRESHOLD_CENTS
                         else ADMIN_RESERVE_BP_BASE
      STEP 3  admin_reserve_cents = ROUND_HALF_UP(allocable_base_cents * admin_bp / 10000)
      STEP 4  distributable       = allocable_base_cents - admin_reserve_cents
              capital_share       = ROUND_HALF_UP(distributable * CAPITAL_RATE_BP / 10000)
              capital_allocation_cents   = capital_share + capital_grant_cents
              operating_allocation_cents = distributable - capital_share
      STEP 5  total_program_funds_cents  = allocable_base_cents + capital_grant_cents
      INVARIANT admin_reserve_cents + capital_allocation_cents + operating_allocation_cents
                == total_program_funds_cents
    input_set_filter: "the unused basis field is retained but excluded from the allocation; only the basis-selected figure enters step 1"
    constants:
      ADMIN_RESERVE_BP_BASE: 800
      ADMIN_RESERVE_BP_HIGH: 500
      HIGH_TIER_THRESHOLD_CENTS: 5000000
      CAPITAL_RATE_BP: 3500
    precision: "integer cents, ROUND_HALF_UP at steps 3 and 4; operating is the residual so no cent is created or lost"
    worked_example: |
      service_period_earned_cents = 5000000, remittance_received_cents = 4800000,
      capital_grant_cents = 100000.
      ACCRUAL branch: allocable_base 5000000 >= 5000000 -> admin_bp 500 ->
        admin 250000; distributable 4750000; capital_share 1662500 ->
        capital 1762500; operating 3087500; total 5100000.
        (250000 + 1762500 + 3087500 = 5100000.)
      CASH branch: allocable_base 4800000 < 5000000 -> admin_bp 800 ->
        admin 384000; distributable 4416000; capital_share 1545600 ->
        capital 1645600; operating 2870400; total 4900000.
        (384000 + 1645600 + 2870400 = 4900000.)

  - id: community_impact_index
    name: "Community impact index (dual variant, weighted scoring)"
    algorithm_type: weighted_scoring
    variants: [PROVISIONAL, FINAL]
    trigger: "PROVISIONAL at POST /playback-slots/{slotId}/air; FINAL at POST /archive-assets/{assetId}/publish and POST /archive-assets/{assetId}/record-views"
    description: |
      The index blends broadcast reach, on-demand demand and volunteer
      engagement, each normalised to its own cap and clipped at 1. The
      PROVISIONAL variant is computed the moment a program airs, when neither
      on-demand views nor credited volunteer hours exist yet, so it scores those
      two components as zero; the FINAL variant recomputes with the real values
      and therefore rises for the same broadcast.
    inputs:
      - "asset.measured_households (copied from the slot at air time)"
      - "asset.on_demand_views"
      - "the sum of credited_hours_tenths over the source slot's COMPLETED crew assignments"
    formula: |
      reach_component     = min(1, measured_households / HOUSEHOLD_NORM)
      demand_component    = min(1, on_demand_views / VIEW_NORM)               # 0 in PROVISIONAL
      volunteer_component = min(1, volunteer_hours_tenths / VOLUNTEER_TENTHS_NORM)  # 0 in PROVISIONAL
      index = ROUND_HALF_UP( 100 * ( WEIGHT_REACH     * reach_component
                                   + WEIGHT_DEMAND    * demand_component
                                   + WEIGHT_VOLUNTEER * volunteer_component ), 2 )
      PROVISIONAL: on_demand_views and volunteer_hours_tenths are forced to 0
      FINAL:       all three components use their stored values
    input_set_filter: "only COMPLETED crew assignments on the source slot contribute volunteer tenths; RELEASED ones contribute nothing"
    constants:
      WEIGHT_REACH: 0.5
      WEIGHT_DEMAND: 0.3
      WEIGHT_VOLUNTEER: 0.2
      HOUSEHOLD_NORM: 1000
      VIEW_NORM: 500
      VOLUNTEER_TENTHS_NORM: 100
    precision: "decimal with 2 fraction digits, ROUND_HALF_UP, emitted as a JSON number"
    worked_example: |
      A slot airs with measured_households = 640, occupied_seconds = 1920 and one
      CONFIRMED crew assignment, which completes with
      credited_hours_tenths = ceil(1920 / 360) = 6.
      PROVISIONAL at air: 100 * (0.5 * 0.64 + 0.3 * 0 + 0.2 * 0) = 32.00.
      FINAL at publish (views still 0, volunteer tenths 6):
        100 * (0.5 * 0.64 + 0.3 * 0 + 0.2 * 0.06) = 32.00 + 1.20 = 33.20.
      FINAL after recording 250 on-demand views:
        100 * (0.5 * 0.64 + 0.3 * 0.5 + 0.2 * 0.06) = 32.00 + 15.00 + 1.20 = 48.20.
      The PROVISIONAL -> FINAL delta on the same broadcast is +1.20 at publish.

  - id: archive_retention_deadline
    name: "Archive retention deadline and purge eligibility"
    algorithm_type: forward_looking
    trigger: "POST /archive-assets/{assetId}/publish; evaluated again at POST /archive-assets/{assetId}/purge"
    description: |
      Retention is counted in whole calendar months from the publication
      instant, not in fixed-length days, and PERMANENT assets have no deadline
      and can never be purged. Purge eligibility is inclusive at the boundary:
      the asset becomes purgeable at the retain_until instant itself.
    inputs:
      - "asset.retention_class"
      - "asset.published_at (= clock_now at publish)"
      - "clock_now at purge time"
    formula: |
      months = RETENTION_MONTHS[retention_class]        # null for PERMANENT
      if months is null: retain_until = null
      else:
        retain_until = published_at plus `months` calendar months, keeping the
        same day-of-month and time-of-day; when the target month is shorter the
        day clamps to that month's last day
      purgeable = retention_class != PERMANENT AND retain_until is not null
                  AND clock_now >= retain_until
      if not purgeable: ERR_RETENTION_NOT_ELAPSED (or ERR_PERMANENT_RETENTION for PERMANENT)
    input_set_filter: "only PUBLISHED and WITHDRAWN assets are purge candidates; a PENDING asset has no retain_until at all"
    constants:
      RETENTION_MONTHS: {STANDARD_24M: 24, EXTENDED_60M: 60, PERMANENT: null}
    precision: "ISO-8601 UTC timestamp, second precision; calendar-month arithmetic with end-of-month clamping"
    worked_example: |
      published_at = 2026-08-06T00:00:00Z, retention_class = STANDARD_24M
      -> retain_until = 2028-08-06T00:00:00Z.
      At clock 2028-08-05T23:59:59Z purge -> ERR_RETENTION_NOT_ELAPSED;
      at clock exactly 2028-08-06T00:00:00Z purge -> 200 and PURGED.
      EXTENDED_60M from the same publish -> 2031-08-06T00:00:00Z.
      PERMANENT -> retain_until = null and purge always ERR_PERMANENT_RETENTION.

# -----------------------------------------------------------------------------
# Table 4: Validation Table (evaluated strictly in ascending priority order;
# the first violated rule is the only error reported)
# -----------------------------------------------------------------------------
validation_order_bands:
  - "1        auth"
  - "2        authz"
  - "3        schema"
  - "4-5      existence (path segments first, then body foreign keys)"
  - "6        ownership"
  - "7        sod"
  - "8        occ"
  - "9-14     state"
  - "15-22    business_safety"
  - "23-33    business_temporal"
  - "34-39    business_referential"
  - "40-42    business_fiscal"

validations:

  - priority: 1
    category: auth
    rule_id: v_auth_header_present
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: "X-Role header absent or empty, or the operation requires an X-User-ID that is absent or empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    note: "Checked before anything else, so an unauthenticated call to a non-existent id still returns 401."

  - priority: 2
    category: authz
    rule_id: v_role_permitted_for_endpoint
    applies_to: "every endpoint"
    condition: "the X-Role value is not one of the endpoint's declared roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    note: "Beats schema validation: a wrong role sending a malformed body still gets 403."

  - priority: 3
    category: schema
    rule_id: v_request_schema
    applies_to: "every endpoint with a request body or query parameters"
    condition: |
      a required input field is missing or null; a field has the wrong JSON type;
      an enum field carries a value outside its declared set; an integer field is
      negative where non-negative is required; end_at <= start_at on a reservation;
      session_end_at <= session_start_at on a course;
      daily_window_end_minute <= daily_window_start_minute on a channel;
      practical_score outside 0..100; measured_households negative;
      quarter outside 1..4; page < 1 or page_size outside 1..100
    error_id: ERR_INVALID_REQUEST
    http_status: 400

  - priority: 4
    category: existence
    rule_id: v_path_resource_exists
    applies_to: "every endpoint with a path parameter"
    condition: "the id in the path names no row of that entity"
    error_id: "the entity's own ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    note: "Path ids are resolved left to right; the leftmost missing segment decides the error."

  - priority: 5
    category: existence
    rule_id: v_body_foreign_keys_exist
    applies_to: "POST /course-enrollments, POST /series, POST /programs, POST /playback-slots, POST /reservations, POST /crew-assignments"
    condition: "a foreign key supplied in the request body names no row of the referenced entity"
    error_id: "the referenced entity's own ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    note: "Body foreign keys are resolved in the order the fields are listed in the endpoint's input."

  - priority: 6
    category: ownership
    rule_id: v_producer_acts_on_own_records
    applies_to: "POST /course-enrollments, POST /course-enrollments/{enrollmentId}/withdraw, POST /programs, POST /programs/{programId}/attestations, POST /programs/{programId}/submit, POST /programs/{programId}/withdraw, POST /reservations, POST /reservations/{reservationId}/cancel, POST /crew-assignments/{assignmentId}/confirm, POST /crew-assignments/{assignmentId}/release"
    condition: "X-Role is Producer and the acting X-User-ID is not the producer_id (or volunteer_producer_id) that owns the target record"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    note: "Staff roles are exempt from this rule; it only constrains the entity-backed Producer role."

  - priority: 7
    category: sod
    rule_id: v_segregation_of_duties
    applies_to: "POST /damage-assessments/{assessmentId}/waive, POST /funding-periods/{periodId}/report-decision"
    condition: |
      the acting X-User-ID equals the user who created the record under review:
      assessment.filed_by_user_id for a waiver, or period.submitted_by_user_id
      for a report decision
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  - priority: 8
    category: occ
    rule_id: v_expected_parent_version_current
    applies_to: "POST /series/{seriesId}/hold-plans, POST /funding-periods/{periodId}/revise"
    condition: "the supplied expected_<parent>_version differs from the parent's stored version"
    error_id: "ERR_STALE_SERIES_VERSION or ERR_STALE_FUNDING_PERIOD_VERSION"
    http_status: 412
    note: "Evaluated before state so a caller holding an outdated view is told to re-read rather than being told the state is wrong."

  - priority: 9
    category: state
    rule_id: v_transition_permitted_from_current_state
    applies_to: "every action endpoint that drives a state machine"
    condition: "the target entity's current state has no transition for this trigger (including any attempt from a terminal state, and any second application of a one-shot trigger)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409

  - priority: 10
    category: state
    rule_id: v_owning_producer_active
    applies_to: "POST /course-enrollments, POST /series/{seriesId}/activate, POST /programs/{programId}/submit, POST /reservations/{reservationId}/confirm, POST /reservations/{reservationId}/checkout, POST /crew-assignments/{assignmentId}/confirm"
    condition: "the owning (or volunteering) producer's status is not ACTIVE"
    error_id: ERR_PRODUCER_NOT_ACTIVE
    http_status: 409

  - priority: 11
    category: state
    rule_id: v_program_approved_for_scheduling
    applies_to: "POST /playback-slots"
    condition: "program.review_status != APPROVED"
    error_id: ERR_PROGRAM_NOT_APPROVED
    http_status: 409
    note: "PRIORITY PAIR B, higher half: this state check runs before any temporal/airtime conflict check on the same request."

  - priority: 12
    category: state
    rule_id: v_program_clearance_complete
    applies_to: "POST /programs/{programId}/submit, POST /playback-slots"
    condition: "program.clearance_status != CLEARED (a required attestation kind is missing or carries a superseded statement_version)"
    error_id: ERR_ATTESTATION_INCOMPLETE
    http_status: 409

  - priority: 13
    category: state
    rule_id: v_series_active_for_hold_booking
    applies_to: "POST /playback-slots (when series_id is supplied), POST /series/{seriesId}/hold-plans"
    condition: "series.status != ACTIVE"
    error_id: ERR_SERIES_NOT_ACTIVE
    http_status: 409

  - priority: 14
    category: state
    rule_id: v_resource_available_for_confirmation
    applies_to: "POST /reservations/{reservationId}/confirm"
    condition: "resource.status != AVAILABLE (it is in MAINTENANCE or RETIRED)"
    error_id: ERR_RESOURCE_NOT_AVAILABLE
    http_status: 409
    note: "PRIORITY PAIR A, higher half: outranks the fiscal deposit-cap rule at priority 40 on the same endpoint."

  - priority: 15
    category: business_safety
    rule_id: v_required_competency_held
    applies_to: "POST /reservations/{reservationId}/confirm"
    condition: "resource.required_competency_code is not present in producer.competency_codes"
    error_id: ERR_COMPETENCY_NOT_HELD
    http_status: 422

  - priority: 16
    category: business_safety
    rule_id: v_live_certification_sufficient
    applies_to: "POST /programs (when is_live is true), POST /crew-assignments/{assignmentId}/confirm"
    condition: |
      a live program is created by a producer whose certification_level != LIVE, or a
      crew role in LIVE_ROLES_REQUIRING_LIVE_CERT is confirmed on a slot whose program
      is_live == true by a volunteer whose certification_level != LIVE
    error_id: ERR_CERTIFICATION_INSUFFICIENT
    http_status: 422
    note: "PRIORITY PAIR B, higher half on crew confirm: outranks the temporal crew-overlap rule at priority 33."

  - priority: 17
    category: business_safety
    rule_id: v_course_tier_prerequisite_met
    applies_to: "POST /course-enrollments"
    condition: |
      the course tier is ADVANCED and the producer holds no PASSED BASIC enrollment,
      or the course tier is LIVE and the producer holds no PASSED ADVANCED enrollment
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422

  - priority: 18
    category: business_safety
    rule_id: v_course_seats_available
    applies_to: "POST /course-enrollments"
    condition: "course.enrolled_count >= course.seat_capacity (WITHDRAWN enrollments are excluded from enrolled_count, FAILED ones are not)"
    error_id: ERR_COURSE_FULL
    http_status: 409

  - priority: 19
    category: business_safety
    rule_id: v_slot_staffed_before_air
    applies_to: "POST /playback-slots/{slotId}/air"
    condition: "slot.staffing_status == UNDERSTAFFED"
    error_id: ERR_SLOT_UNDERSTAFFED
    http_status: 409

  - priority: 20
    category: business_safety
    rule_id: v_resource_has_no_open_reservations
    applies_to: "POST /studio-resources/{resourceId}/status (when status = RETIRED)"
    condition: "resource.open_reservation_count > 0"
    error_id: ERR_RESOURCE_HAS_OPEN_RESERVATIONS
    http_status: 409

  - priority: 21
    category: business_safety
    rule_id: v_finding_category_legally_unprotected
    applies_to: "POST /programs/{programId}/review-decision"
    condition: |
      a REQUEST_CHANGES or REJECT decision omits finding_category or names a category
      outside UNPROTECTED_FINDING_CATEGORIES, or an APPROVE decision supplies a
      finding_category at all (editorial neutrality: a reviewer may only cite a
      legally unprotected category, and may not annotate an approval)
    error_id: ERR_FINDING_CATEGORY_NOT_PERMITTED
    http_status: 422

  - priority: 22
    category: business_safety
    rule_id: v_revision_rounds_remaining
    applies_to: "POST /programs/{programId}/submit"
    condition: "program.revision_round > MAX_REVISION_ROUNDS"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    note: "Bounds the CHANGES_REQUESTED -> SUBMITTED cycle: after the third refusal round the program can only be withdrawn."

  - priority: 23
    category: business_temporal
    rule_id: v_course_session_ended_before_attendance
    applies_to: "POST /course-enrollments/{enrollmentId}/attendance"
    condition: "clock_now < course.session_end_at"
    error_id: ERR_COURSE_SESSION_NOT_ENDED
    http_status: 409

  - priority: 24
    category: business_temporal
    rule_id: v_withdrawal_before_session_start
    applies_to: "POST /course-enrollments/{enrollmentId}/withdraw"
    condition: "clock_now >= course.session_start_at"
    error_id: ERR_WITHDRAWAL_WINDOW_CLOSED
    http_status: 409

  - priority: 25
    category: business_temporal
    rule_id: v_indemnification_in_force
    applies_to: "POST /programs/{programId}/submit"
    condition: "producer.indemnification_expires_at is null or <= clock_now"
    error_id: ERR_INDEMNIFICATION_EXPIRED
    http_status: 422

  - priority: 26
    category: business_temporal
    rule_id: v_slot_inside_channel_window
    applies_to: "POST /playback-slots"
    condition: "the footprint computed by calculations.playback_window_fit does not fit inside the channel's daily window"
    error_id: ERR_SLOT_OUTSIDE_CHANNEL_WINDOW
    http_status: 422

  - priority: 27
    category: business_temporal
    rule_id: v_slot_airtime_free_or_preemptible
    applies_to: "POST /playback-slots"
    condition: "the footprint overlaps a SCHEDULED slot on the same channel and calculations.playback_conflict_resolution does not authorise preemption of every overlapping incumbent"
    error_id: ERR_SLOT_WINDOW_CONFLICT
    http_status: 409
    note: "PRIORITY PAIR B, lower half against priority 11 on POST /playback-slots."

  - priority: 28
    category: business_temporal
    rule_id: v_series_hold_slots_remaining
    applies_to: "POST /playback-slots (when series_id is supplied)"
    condition: "series.remaining_hold_slots < 1"
    error_id: ERR_SERIES_HOLD_EXHAUSTED
    http_status: 409

  - priority: 29
    category: business_temporal
    rule_id: v_resource_capacity_not_exceeded
    applies_to: "POST /reservations/{reservationId}/confirm"
    condition: |
      the number of other reservations on the same resource with status IN
      {CONFIRMED, CHECKED_OUT, DAMAGE_REVIEW} whose [start_at, end_at) overlaps
      this reservation's interval is already >= resource.capacity_slots, or the
      requested start_at falls within resource.turnaround_minutes after the end_at
      of such a reservation
    error_id: ERR_RESOURCE_OVERBOOKED
    http_status: 409
    note: "Half-open intervals: a reservation starting exactly at another's end_at does not overlap, but it may still be blocked by the turnaround buffer."

  - priority: 30
    category: business_temporal
    rule_id: v_checkout_window_open
    applies_to: "POST /reservations/{reservationId}/checkout"
    condition: "clock_now < reservation.start_at - CHECKOUT_LEAD_SECONDS or clock_now >= reservation.end_at"
    error_id: ERR_CHECKOUT_WINDOW_NOT_OPEN
    http_status: 409

  - priority: 31
    category: business_temporal
    rule_id: v_airtime_reached
    applies_to: "POST /playback-slots/{slotId}/air"
    condition: "clock_now < slot.start_at"
    error_id: ERR_AIRTIME_NOT_REACHED
    http_status: 409

  - priority: 32
    category: business_temporal
    rule_id: v_retention_elapsed
    applies_to: "POST /archive-assets/{assetId}/purge"
    condition: "retention_class == PERMANENT (ERR_PERMANENT_RETENTION) or clock_now < asset.retain_until (ERR_RETENTION_NOT_ELAPSED)"
    error_id: "ERR_PERMANENT_RETENTION or ERR_RETENTION_NOT_ELAPSED"
    http_status: 409

  - priority: 33
    category: business_temporal
    rule_id: v_volunteer_not_double_booked
    applies_to: "POST /crew-assignments/{assignmentId}/confirm"
    condition: "the volunteer already holds a CONFIRMED assignment on another slot whose [start_at, end_at) overlaps this slot's interval"
    error_id: ERR_CREW_TIME_CONFLICT
    http_status: 409
    note: "PRIORITY PAIR B, lower half against priority 16 on POST /crew-assignments/{assignmentId}/confirm."

  - priority: 34
    category: business_referential
    rule_id: v_series_owned_by_program_producer
    applies_to: "POST /programs, POST /playback-slots"
    condition: "the supplied series belongs to a different producer than the program"
    error_id: ERR_SERIES_NOT_OWNED_BY_PRODUCER
    http_status: 422

  - priority: 35
    category: business_referential
    rule_id: v_channel_tier_eligible
    applies_to: "POST /playback-slots"
    condition: "the channel tier is EDUCATIONAL or GOVERNMENT while the program's producer holds certification_level BASIC (only ADVANCED or LIVE producers may occupy those tiers)"
    error_id: ERR_CHANNEL_TIER_NOT_ELIGIBLE
    http_status: 422

  - priority: 36
    category: business_referential
    rule_id: v_linked_slot_belongs_to_reserving_producer
    applies_to: "POST /reservations"
    condition: "linked_slot_id is supplied and that slot's program belongs to a different producer than producer_id"
    error_id: ERR_SLOT_PRODUCER_MISMATCH
    http_status: 422

  - priority: 37
    category: business_referential
    rule_id: v_no_duplicate_active_enrollment
    applies_to: "POST /course-enrollments"
    condition: "the producer already holds an enrollment on this course with status IN {ENROLLED, ATTENDED, PASSED}"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409

  - priority: 38
    category: business_referential
    rule_id: v_natural_key_unique
    applies_to: "POST /training-courses, POST /channels, POST /studio-resources, POST /funding-periods"
    condition: "course_code, call_sign, resource_code, or the (fiscal_year, quarter) pair already exists"
    error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409

  - priority: 39
    category: business_referential
    rule_id: v_attestation_statement_version_known
    applies_to: "POST /programs/{programId}/attestations"
    condition: "third_party_material is true and license_reference is absent or empty for a COPYRIGHT_CLEARANCE attestation"
    error_id: ERR_LICENSE_REFERENCE_REQUIRED
    http_status: 422

  - priority: 40
    category: business_fiscal
    rule_id: v_producer_deposit_cap
    applies_to: "POST /reservations/{reservationId}/confirm"
    condition: "producer.deposit_held_cents + the newly computed deposit_hold_cents > DEPOSIT_HOLD_CAP_CENTS"
    error_id: ERR_DEPOSIT_LIMIT_EXCEEDED
    http_status: 402
    note: "PRIORITY PAIR A, lower half against priority 14 on POST /reservations/{reservationId}/confirm."

  - priority: 41
    category: business_fiscal
    rule_id: v_allocable_base_positive
    applies_to: "POST /funding-periods/{periodId}/report-submit"
    condition: "the basis-selected allocable base is 0 or negative"
    error_id: ERR_ALLOCABLE_BASE_NOT_POSITIVE
    http_status: 402

  - priority: 42
    category: business_fiscal
    rule_id: v_capital_grant_within_base
    applies_to: "POST /funding-periods, POST /funding-periods/{periodId}/revise"
    condition: "capital_grant_cents exceeds the basis-selected allocable base"
    error_id: ERR_CAPITAL_GRANT_EXCEEDS_BASE
    http_status: 402

priority_conflict_pairs:
  - pair_id: pair_a_state_over_fiscal
    endpoint: "POST /reservations/{reservationId}/confirm"
    higher: {priority: 14, category: state, error_id: ERR_RESOURCE_NOT_AVAILABLE}
    lower: {priority: 40, category: business_fiscal, error_id: ERR_DEPOSIT_LIMIT_EXCEEDED}
    construction: "put the resource into MAINTENANCE and simultaneously arrange producer.deposit_held_cents so the new hold would breach DEPOSIT_HOLD_CAP_CENTS; expect ERR_RESOURCE_NOT_AVAILABLE (409)"

  - pair_id: pair_b_safety_over_temporal
    endpoint: "POST /crew-assignments/{assignmentId}/confirm"
    higher: {priority: 16, category: business_safety, error_id: ERR_CERTIFICATION_INSUFFICIENT}
    lower: {priority: 33, category: business_temporal, error_id: ERR_CREW_TIME_CONFLICT}
    construction: "offer a DIRECTOR role on a live slot to a BASIC-certified volunteer who already holds a CONFIRMED assignment on an overlapping slot; expect ERR_CERTIFICATION_INSUFFICIENT (422)"

# -----------------------------------------------------------------------------
# Table 5: Endpoint Table  (api_prefix is "", so every path is rooted at /)
# -----------------------------------------------------------------------------
endpoints:

  # --- logical clock -----------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the server's logical current UTC instant. Default before any call is 2026-08-01T00:00:00Z."
    roles: [CenterAdmin, TrainingCoordinator, ContentReviewer, SchedulingCoordinator, FacilitiesManager, FinanceOfficer, Producer]
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "every later temporal comparison (session windows, checkout lead, airtime, retention) reads this instant"

  # --- producers ---------------------------------------------------------------
  - method: POST
    path: /producers
    purpose: "Register a community producer applicant."
    roles: [CenterAdmin]
    input: [legal_name, email]
    output: Producer
    side_effects:
      - "creates the producer in status APPLICANT with certification_level NONE and every derived counter at 0"

  - method: GET
    path: /producers/{producerId}
    purpose: "Read one producer, including derived certification, deposit and volunteer figures."
    roles: [CenterAdmin, TrainingCoordinator, ContentReviewer, SchedulingCoordinator, FacilitiesManager, FinanceOfficer, Producer]
    input: []
    output: Producer
    side_effects: []

  - method: GET
    path: /producers
    purpose: "List producers with optional status and certification filters."
    roles: [CenterAdmin, TrainingCoordinator, SchedulingCoordinator, FacilitiesManager]
    input: ["status?", "certification_level?", "limit?", "offset?"]
    output: Producer[]
    side_effects: []

  - method: POST
    path: /producers/{producerId}/residency-verification
    purpose: "Record the residency document that admits an applicant to membership."
    roles: [CenterAdmin]
    input: [document_reference]
    output: Producer
    side_effects:
      - "APPLICANT -> ACTIVE; sets residency_verified = true; recomputes certification_level"

  - method: POST
    path: /producers/{producerId}/reinstate
    purpose: "Credit suspension points back and return a suspended producer to active membership."
    roles: [CenterAdmin]
    input: [suspension_points_credited, reason]
    output: Producer
    side_effects:
      - "SUSPENDED -> ACTIVE; suspension_points decremented; reinstated_count incremented; certification_level re-derived from surviving PASSED enrollments"

  - method: POST
    path: /producers/{producerId}/revoke
    purpose: "Revoke membership and unwind every open commitment of the producer."
    roles: [CenterAdmin]
    input: [revocation_reason]
    output: Producer
    side_effects:
      - "status -> REVOKED; certification_level -> NONE"
      - "open reservations CANCELLED with holds released; crew assignments RELEASED; affected slots re-derive staffing_status"
      - "the producer's non-retired series -> RETIRED, then successor series recompute seniority_at"
      - "the producer's live programs re-derive clearance_status = INCOMPLETE"

  # --- training courses --------------------------------------------------------
  - method: POST
    path: /training-courses
    purpose: "Publish a training course offering with a seat capacity and a session window."
    roles: [TrainingCoordinator]
    input: [course_code, title, tier, grants_competency_codes, seat_capacity, session_start_at, session_end_at]
    output: TrainingCourse
    side_effects:
      - "creates the course with enrolled_count = 0 and passed_count = 0"

  - method: GET
    path: /training-courses/{courseId}
    purpose: "Read one training course with its live seat counters."
    roles: [CenterAdmin, TrainingCoordinator, Producer]
    input: []
    output: TrainingCourse
    side_effects: []

  - method: GET
    path: /training-courses
    purpose: "List training courses."
    roles: [CenterAdmin, TrainingCoordinator, Producer]
    input: ["tier?", "limit?", "offset?"]
    output: TrainingCourse[]
    side_effects: []

  # --- course enrollments ------------------------------------------------------
  - method: POST
    path: /course-enrollments
    purpose: "Enroll a producer in a course, consuming a seat."
    roles: [Producer, TrainingCoordinator]
    input: [producer_id, course_id]
    output: CourseEnrollment
    side_effects:
      - "creates the enrollment in status ENROLLED and increments course.enrolled_count by 1"

  - method: GET
    path: /course-enrollments/{enrollmentId}
    purpose: "Read one enrollment."
    roles: [CenterAdmin, TrainingCoordinator, Producer]
    input: []
    output: CourseEnrollment
    side_effects: []

  - method: GET
    path: /course-enrollments
    purpose: "List enrollments, filterable by producer, course or status."
    roles: [CenterAdmin, TrainingCoordinator, Producer]
    input: ["producer_id?", "course_id?", "status?", "limit?", "offset?"]
    output: CourseEnrollment[]
    side_effects: []

  - method: POST
    path: /course-enrollments/{enrollmentId}/attendance
    purpose: "Record whether the enrollee attended, once the session has ended."
    roles: [TrainingCoordinator]
    input: [attended]
    output: CourseEnrollment
    side_effects:
      - "ENROLLED -> ATTENDED (attended true, sets attended_at) or ENROLLED -> FAILED (attended false)"

  - method: POST
    path: /course-enrollments/{enrollmentId}/grade
    purpose: "Grade the equipment competency practical."
    roles: [TrainingCoordinator]
    input: [practical_score]
    output: CourseEnrollment
    side_effects:
      - "ATTENDED -> PASSED at or above PASS_SCORE_MIN, else ATTENDED -> FAILED; sets graded_at"
      - "on PASSED: course.passed_count incremented, producer.competency_codes extended, producer.certification_level recomputed"

  - method: POST
    path: /course-enrollments/{enrollmentId}/withdraw
    purpose: "Withdraw from a course before its session starts and release the seat."
    roles: [Producer, TrainingCoordinator]
    input: []
    output: CourseEnrollment
    side_effects:
      - "ENROLLED -> WITHDRAWN and course.enrolled_count decremented by 1"

  # --- series ------------------------------------------------------------------
  - method: POST
    path: /series
    purpose: "Propose a program series, optionally continuing an earlier series."
    roles: [Producer, SchedulingCoordinator]
    input: [producer_id, title, cadence, first_air_date, "predecessor_series_id?"]
    output: Series
    side_effects:
      - "creates the series in status PROPOSED with sequence_number = current max + 1, seniority_at null, hold counters 0"

  - method: GET
    path: /series/{seriesId}
    purpose: "Read one series with its seniority and hold counters (source of expected_series_version)."
    roles: [CenterAdmin, SchedulingCoordinator, ContentReviewer, Producer]
    input: []
    output: Series
    side_effects: []

  - method: GET
    path: /series
    purpose: "List series, filterable by owning producer, predecessor or status."
    roles: [CenterAdmin, SchedulingCoordinator, ContentReviewer, Producer]
    input: ["producer_id?", "predecessor_series_id?", "status?", "limit?", "offset?"]
    output: Series[]
    side_effects: []

  - method: POST
    path: /series/{seriesId}/activate
    purpose: "Activate (or re-activate) a series and compute its inherited seniority."
    roles: [SchedulingCoordinator]
    input: []
    output: Series
    side_effects:
      - "PROPOSED|LAPSED -> ACTIVE; computes seniority_at by predecessor traversal"
      - "from LAPSED it also resets missed_windows to 0 and restores remaining_hold_slots to hold_plan_slots_granted"

  - method: POST
    path: /series/{seriesId}/hold-plans
    purpose: "Replace the series hold plan (its stock of priority booking slots) under optimistic concurrency."
    roles: [SchedulingCoordinator]
    input: [expected_series_version, hold_plan_slots_granted]
    output: Series
    side_effects:
      - "sets hold_plan_slots_granted and remaining_hold_slots to the granted figure"
      - "increments Series.version by 1"
      - "refused with ERR_STALE_SERIES_VERSION (412) when expected_series_version is not the stored version"

  # --- programs ----------------------------------------------------------------
  - method: POST
    path: /programs
    purpose: "Create a program submission in DRAFT."
    roles: [Producer]
    input: [producer_id, title, runtime_seconds, is_live, required_crew_roles, "series_id?", "episode_number?"]
    output: Program
    side_effects:
      - "creates the program with review_status DRAFT, clearance_status INCOMPLETE, revision_round 0, attestation_sequence_high 0"

  - method: GET
    path: /programs/{programId}
    purpose: "Read one program with both of its state dimensions."
    roles: [CenterAdmin, ContentReviewer, SchedulingCoordinator, Producer]
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: /programs
    purpose: "List programs, filterable by producer, series, review status or clearance status."
    roles: [CenterAdmin, ContentReviewer, SchedulingCoordinator, Producer]
    input: ["producer_id?", "series_id?", "review_status?", "clearance_status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: /programs/{programId}/attestations
    purpose: "Append an indemnification, copyright-clearance or content-policy attestation."
    roles: [Producer]
    input: [attestation_kind, statement_version, third_party_material, "license_reference?"]
    output: Attestation
    side_effects:
      - "appends an immutable Attestation with sequence_number = program.attestation_sequence_high + 1 and effective_from = clock_now"
      - "closes the previous attestation of the same kind by stamping its effective_until"
      - "re-derives program.clearance_status from the latest attestation of each required kind"
      - "for kind INDEMNIFICATION, sets producer.indemnification_expires_at = clock_now + INDEMNIFICATION_TERM_DAYS"

  - method: POST
    path: /programs/{programId}/submit
    purpose: "Submit (or resubmit) a cleared program for content review."
    roles: [Producer]
    input: []
    output: Program
    side_effects:
      - "DRAFT|CHANGES_REQUESTED -> SUBMITTED and clears reviewed_by_user_id"

  - method: POST
    path: /programs/{programId}/review-claim
    purpose: "Claim a submitted program for review (records the reviewing user)."
    roles: [ContentReviewer]
    input: []
    output: Program
    side_effects:
      - "SUBMITTED -> UNDER_REVIEW and sets reviewed_by_user_id to the acting X-User-ID"

  - method: POST
    path: /programs/{programId}/review-decision
    purpose: "Decide a claimed program, citing only a legally unprotected finding category when refusing."
    roles: [ContentReviewer]
    input: [decision, "finding_category?", "finding_notes?"]
    output: Program
    side_effects:
      - "UNDER_REVIEW -> APPROVED | CHANGES_REQUESTED | REJECTED"
      - "REQUEST_CHANGES increments revision_round and records the finding"
      - "REJECT withdraws every SCHEDULED slot of the program"

  - method: POST
    path: /programs/{programId}/withdraw
    purpose: "Withdraw a program and unwind its scheduling, crew and on-demand footprint."
    roles: [Producer, CenterAdmin]
    input: [withdrawn_reason]
    output: Program
    side_effects:
      - "review_status -> WITHDRAWN"
      - "SCHEDULED slots -> WITHDRAWN with channel.scheduled_seconds debited and hold slots restored WITHOUT a missed_windows penalty"
      - "crew assignments on those slots -> RELEASED, staffing_status and volunteer counters recomputed"
      - "PUBLISHED archive assets -> WITHDRAWN"

  - method: GET
    path: /attestations/{attestationId}
    purpose: "Read one attestation (append-only, no version field)."
    roles: [CenterAdmin, ContentReviewer, Producer]
    input: []
    output: Attestation
    side_effects: []

  - method: GET
    path: /attestations
    purpose: "List attestations, filterable by program, signer or kind."
    roles: [CenterAdmin, ContentReviewer, Producer]
    input: ["program_id?", "signed_by_producer_id?", "attestation_kind?", "limit?", "offset?"]
    output: Attestation[]
    side_effects: []

  # --- channels ----------------------------------------------------------------
  - method: POST
    path: /channels
    purpose: "Define an assigned cable channel with its daily broadcast window and buffer."
    roles: [CenterAdmin]
    input: [call_sign, tier, daily_window_start_minute, daily_window_end_minute, inter_program_buffer_seconds, "preemption_enabled?"]
    output: Channel
    side_effects:
      - "creates the channel with scheduled_seconds 0, aired_seconds 0, slot_sequence_high 0; preemption_enabled defaults to true"

  - method: GET
    path: /channels/{channelId}
    purpose: "Read one channel with its airtime ledger."
    roles: [CenterAdmin, SchedulingCoordinator, Producer]
    input: []
    output: Channel
    side_effects: []

  - method: GET
    path: /channels
    purpose: "List channels."
    roles: [CenterAdmin, SchedulingCoordinator, Producer]
    input: ["tier?", "limit?", "offset?"]
    output: Channel[]
    side_effects: []

  # --- playback slots ----------------------------------------------------------
  - method: POST
    path: /playback-slots
    purpose: "Book airtime for an approved program, first-come or on a series hold with preemption."
    roles: [SchedulingCoordinator]
    input: [channel_id, program_id, start_at, "series_id?"]
    output: PlaybackSlot
    side_effects:
      - "freezes occupied_seconds, end_at, required_crew_roles and sequence_number"
      - "booking_type SERIES_HOLD consumes one series hold slot; otherwise FIRST_COME"
      - "channel.scheduled_seconds and channel.slot_sequence_high advance"
      - "authorised overlapping FIRST_COME incumbents become PREEMPTED and their crew assignments are RELEASED"

  - method: GET
    path: /playback-slots/{slotId}
    purpose: "Read one playback slot with its frozen footprint and staffing state."
    roles: [CenterAdmin, SchedulingCoordinator, ContentReviewer, Producer]
    input: []
    output: PlaybackSlot
    side_effects: []

  - method: GET
    path: /playback-slots
    purpose: "List playback slots, filterable by channel, program, series, preemptor or status."
    roles: [CenterAdmin, SchedulingCoordinator, ContentReviewer, Producer]
    input: ["channel_id?", "program_id?", "series_id?", "preempted_by_slot_id?", "status?", "limit?", "offset?"]
    output: PlaybackSlot[]
    side_effects: []

  - method: POST
    path: /playback-slots/{slotId}/air
    purpose: "Mark a slot as aired and record its measured household reach."
    roles: [SchedulingCoordinator]
    input: [measured_households]
    output: PlaybackSlot
    side_effects:
      - "SCHEDULED -> AIRED; channel airtime moves from scheduled_seconds to aired_seconds"
      - "CONFIRMED crew assignments -> COMPLETED with credited_hours_tenths, crediting volunteer_hours_tenths"
      - "creates a PENDING ArchiveAsset carrying the PROVISIONAL community_impact_index"

  - method: POST
    path: /playback-slots/{slotId}/cancel
    purpose: "Cancel a scheduled slot; a series hold cancellation counts as a missed window."
    roles: [SchedulingCoordinator]
    input: [cancellation_reason]
    output: PlaybackSlot
    side_effects:
      - "SCHEDULED -> CANCELLED; channel.scheduled_seconds debited"
      - "SERIES_HOLD cancellation restores the hold slot AND increments series.missed_windows, lapsing the series at the limit"
      - "crew assignments -> RELEASED and staffing/volunteer counters recomputed"

  # --- crew assignments --------------------------------------------------------
  - method: POST
    path: /crew-assignments
    purpose: "Offer a volunteer crew role on a scheduled slot."
    roles: [SchedulingCoordinator]
    input: [slot_id, volunteer_producer_id, crew_role]
    output: CrewAssignment
    side_effects:
      - "creates the assignment in status OFFERED; staffing_status is unchanged because OFFERED does not cover a role"

  - method: GET
    path: /crew-assignments/{assignmentId}
    purpose: "Read one crew assignment."
    roles: [CenterAdmin, SchedulingCoordinator, Producer]
    input: []
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: /crew-assignments
    purpose: "List crew assignments, filterable by slot, volunteer or status."
    roles: [CenterAdmin, SchedulingCoordinator, Producer]
    input: ["slot_id?", "volunteer_producer_id?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: /crew-assignments/{assignmentId}/confirm
    purpose: "Accept a crew offer, subject to live certification and no overlapping commitment."
    roles: [Producer, SchedulingCoordinator]
    input: []
    output: CrewAssignment
    side_effects:
      - "OFFERED -> CONFIRMED; slot.staffing_status re-derived (may reach READY); volunteer.confirmed_crew_commitments incremented"

  - method: POST
    path: /crew-assignments/{assignmentId}/release
    purpose: "Release a crew offer or confirmation."
    roles: [Producer, SchedulingCoordinator]
    input: [release_reason]
    output: CrewAssignment
    side_effects:
      - "OFFERED|CONFIRMED -> RELEASED; slot.staffing_status re-derived (READY may fall back to UNDERSTAFFED); volunteer.confirmed_crew_commitments decremented when it was CONFIRMED"

  # --- studio resources --------------------------------------------------------
  - method: POST
    path: /studio-resources
    purpose: "Register a studio or item of equipment with its deposit and competency policy."
    roles: [FacilitiesManager]
    input: [resource_code, resource_class, required_competency_code, capacity_slots, turnaround_minutes, base_deposit_cents, replacement_value_cents]
    output: StudioResource
    side_effects:
      - "creates the resource in status AVAILABLE with open_reservation_count 0"

  - method: GET
    path: /studio-resources/{resourceId}
    purpose: "Read one resource with its open reservation count."
    roles: [CenterAdmin, FacilitiesManager, SchedulingCoordinator, Producer]
    input: []
    output: StudioResource
    side_effects: []

  - method: GET
    path: /studio-resources
    purpose: "List studio resources."
    roles: [CenterAdmin, FacilitiesManager, SchedulingCoordinator, Producer]
    input: ["resource_class?", "status?", "limit?", "offset?"]
    output: StudioResource[]
    side_effects: []

  - method: POST
    path: /studio-resources/{resourceId}/status
    purpose: "Move a resource between AVAILABLE, MAINTENANCE and RETIRED."
    roles: [FacilitiesManager]
    input: [status, status_reason]
    output: StudioResource
    side_effects:
      - "AVAILABLE <-> MAINTENANCE freely; RETIRED only when open_reservation_count is 0 and RETIRED is terminal"

  # --- reservations ------------------------------------------------------------
  - method: POST
    path: /reservations
    purpose: "Request studio or equipment time, optionally tied to a booked playback slot."
    roles: [Producer, FacilitiesManager]
    input: [producer_id, resource_id, start_at, end_at, "linked_slot_id?"]
    output: Reservation
    side_effects:
      - "creates the reservation in status REQUESTED with every money field 0; no deposit is held yet"

  - method: GET
    path: /reservations/{reservationId}
    purpose: "Read one reservation with its full deposit settlement breakdown."
    roles: [CenterAdmin, FacilitiesManager, FinanceOfficer, Producer]
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: /reservations
    purpose: "List reservations, filterable by producer, resource, linked slot or status."
    roles: [CenterAdmin, FacilitiesManager, FinanceOfficer, Producer]
    input: ["producer_id?", "resource_id?", "linked_slot_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: /reservations/{reservationId}/confirm
    purpose: "Confirm a reservation, freezing its risk-weighted deposit hold."
    roles: [FacilitiesManager]
    input: []
    output: Reservation
    side_effects:
      - "REQUESTED -> CONFIRMED; freezes risk_bp and deposit_hold_cents (per-line rounding)"
      - "producer.deposit_held_cents and resource.open_reservation_count increase"

  - method: POST
    path: /reservations/{reservationId}/cancel
    purpose: "Cancel a requested or confirmed reservation and release any hold."
    roles: [Producer, FacilitiesManager]
    input: [cancellation_reason]
    output: Reservation
    side_effects:
      - "REQUESTED|CONFIRMED -> CANCELLED; a confirmed hold is fully refunded and the producer's held total and the resource's open count are restored"

  - method: POST
    path: /reservations/{reservationId}/checkout
    purpose: "Hand equipment over inside the checkout lead window."
    roles: [FacilitiesManager]
    input: ["condition_notes?"]
    output: Reservation
    side_effects:
      - "CONFIRMED -> CHECKED_OUT and stamps checked_out_at"

  - method: POST
    path: /reservations/{reservationId}/return
    purpose: "Take equipment back, settling clean or opening a damage review."
    roles: [FacilitiesManager]
    input: [damage_observed, "severity?", "repair_estimate_cents?", "damage_notes?", "condition_notes?"]
    output: Reservation
    side_effects:
      - "clean branch: CHECKED_OUT -> SETTLED with the late-fee waterfall applied and the deposit released"
      - "damage branch: CHECKED_OUT -> DAMAGE_REVIEW, the late fee computed, the deposit kept on hold, and a FILED DamageAssessment created"

  # --- damage assessments ------------------------------------------------------
  - method: GET
    path: /damage-assessments/{assessmentId}
    purpose: "Read one damage assessment."
    roles: [CenterAdmin, FacilitiesManager, FinanceOfficer, Producer]
    input: []
    output: DamageAssessment
    side_effects: []

  - method: GET
    path: /damage-assessments
    purpose: "List damage assessments, filterable by reservation, status or severity."
    roles: [CenterAdmin, FacilitiesManager, FinanceOfficer, Producer]
    input: ["reservation_id?", "status?", "severity?", "limit?", "offset?"]
    output: DamageAssessment[]
    side_effects: []

  - method: POST
    path: /damage-assessments/{assessmentId}/finalize
    purpose: "Finalize a damage assessment, charging the deposit and assessing suspension points."
    roles: [FacilitiesManager]
    input: []
    output: DamageAssessment
    side_effects:
      - "FILED -> FINALIZED with assessed_repair_cents capped at the replacement value and suspension_points_assessed derived"
      - "the reservation settles out of DAMAGE_REVIEW and the producer's suspension_points rise"
      - "crossing SUSPENSION_THRESHOLD_POINTS suspends the producer, cancelling their other open reservations and releasing their crew assignments"

  - method: POST
    path: /damage-assessments/{assessmentId}/waive
    purpose: "Waive a filed damage assessment (never by the user who filed it)."
    roles: [FinanceOfficer]
    input: [waiver_reason]
    output: DamageAssessment
    side_effects:
      - "FILED -> WAIVED with assessed_repair_cents and suspension_points_assessed left at 0"
      - "the reservation settles out of DAMAGE_REVIEW charging only the late fee; the producer is never suspended on this path"

  # --- funding periods ---------------------------------------------------------
  - method: POST
    path: /funding-periods
    purpose: "Open a franchise-fee reporting period."
    roles: [FinanceOfficer]
    input: [fiscal_year, quarter, basis, gross_franchise_fee_cents, service_period_earned_cents, remittance_received_cents, capital_grant_cents]
    output: FundingPeriod
    side_effects:
      - "creates the period in report_status DRAFT with revision_round 0 and every allocation field 0"

  - method: GET
    path: /funding-periods/{periodId}
    purpose: "Read one funding period (source of expected_funding_period_version)."
    roles: [CenterAdmin, FinanceOfficer]
    input: []
    output: FundingPeriod
    side_effects: []

  - method: GET
    path: /funding-periods
    purpose: "List funding periods."
    roles: [CenterAdmin, FinanceOfficer]
    input: ["fiscal_year?", "report_status?", "limit?", "offset?"]
    output: FundingPeriod[]
    side_effects: []

  - method: POST
    path: /funding-periods/{periodId}/revise
    purpose: "Restate a funding period's figures under optimistic concurrency."
    roles: [FinanceOfficer]
    input: [expected_funding_period_version, "basis?", "service_period_earned_cents?", "remittance_received_cents?", "capital_grant_cents?"]
    output: FundingPeriod
    side_effects:
      - "DRAFT|RETURNED_FOR_REVISION -> DRAFT; revision_round incremented and submitted_by_user_id cleared"
      - "re-runs the allocation under the effective basis"
      - "increments FundingPeriod.version by 1"
      - "refused with ERR_STALE_FUNDING_PERIOD_VERSION (412) when expected_funding_period_version is not the stored version"

  - method: POST
    path: /funding-periods/{periodId}/report-submit
    purpose: "Submit the municipal franchise-fee report for the period."
    roles: [FinanceOfficer]
    input: []
    output: FundingPeriod
    side_effects:
      - "DRAFT -> SUBMITTED; computes allocable_base_cents, admin_reserve_cents, capital_allocation_cents, operating_allocation_cents and total_program_funds_cents; records submitted_by_user_id"

  - method: POST
    path: /funding-periods/{periodId}/report-decision
    purpose: "Accept or return a submitted report (never by its submitter)."
    roles: [CenterAdmin]
    input: [decision, "reason?"]
    output: FundingPeriod
    side_effects:
      - "SUBMITTED -> ACCEPTED (terminal, figures frozen) or SUBMITTED -> RETURNED_FOR_REVISION with a reason"

  # --- archive assets ----------------------------------------------------------
  - method: GET
    path: /archive-assets/{assetId}
    purpose: "Read one archive asset with its impact index and retention deadline."
    roles: [CenterAdmin, SchedulingCoordinator, ContentReviewer, Producer]
    input: []
    output: ArchiveAsset
    side_effects: []

  - method: GET
    path: /archive-assets
    purpose: "List archive assets, filterable by program, source slot, on-demand status or retention class."
    roles: [CenterAdmin, SchedulingCoordinator, ContentReviewer, Producer]
    input: ["program_id?", "source_slot_id?", "on_demand_status?", "retention_class?", "limit?", "offset?"]
    output: ArchiveAsset[]
    side_effects: []

  - method: POST
    path: /archive-assets/{assetId}/publish
    purpose: "Publish an aired program on demand under a retention class."
    roles: [CenterAdmin]
    input: [retention_class]
    output: ArchiveAsset
    side_effects:
      - "PENDING -> PUBLISHED; stamps published_at and retain_until by calendar-month arithmetic"
      - "recomputes community_impact_index with the FINAL variant and sets impact_variant = FINAL"

  - method: POST
    path: /archive-assets/{assetId}/record-views
    purpose: "Record cumulative on-demand views and re-score community impact."
    roles: [CenterAdmin]
    input: [on_demand_views]
    output: ArchiveAsset
    side_effects:
      - "sets on_demand_views and recomputes the FINAL community_impact_index; refused once the asset is WITHDRAWN or PURGED"

  - method: POST
    path: /archive-assets/{assetId}/purge
    purpose: "Purge an asset whose retention window has elapsed."
    roles: [CenterAdmin]
    input: []
    output: ArchiveAsset
    side_effects:
      - "PUBLISHED|WITHDRAWN -> PURGED once clock_now reaches retain_until; PERMANENT assets can never be purged"

# -----------------------------------------------------------------------------
# Global constants (referenced by §1.2, §1.3 and §1.4)
# -----------------------------------------------------------------------------
constants:
  PASS_SCORE_MIN: 80
  SUSPENSION_THRESHOLD_POINTS: 3
  SUSPENSION_POINTS_BY_SEVERITY: {MINOR: 1, MAJOR: 2, TOTAL_LOSS: 3}
  REPAIR_ESCALATION_CENTS: 50000
  MAX_REVISION_ROUNDS: 2
  CURRENT_STATEMENT_VERSION: "2026.1"
  REQUIRED_ATTESTATION_KINDS: [INDEMNIFICATION, COPYRIGHT_CLEARANCE, CONTENT_POLICY]
  INDEMNIFICATION_TERM_DAYS: 365
  RISK_BP_PER_SUSPENSION_POINT: 1500
  RISK_BP_CAP: 4500
  HOURLY_DEPOSIT_RATE_BP: 500
  LIVE_LINK_SURCHARGE_BP: 2000
  LATE_FEE_BP_PER_HOUR: 750
  CHECKOUT_LEAD_SECONDS: 3600
  DEPOSIT_HOLD_CAP_CENTS: 500000
  ADMIN_RESERVE_BP_BASE: 800
  ADMIN_RESERVE_BP_HIGH: 500
  HIGH_TIER_THRESHOLD_CENTS: 5000000
  CAPITAL_RATE_BP: 3500
  WEIGHT_REACH: 0.5
  WEIGHT_DEMAND: 0.3
  WEIGHT_VOLUNTEER: 0.2
  HOUSEHOLD_NORM: 1000
  VIEW_NORM: 500
  VOLUNTEER_TENTHS_NORM: 100
  RETENTION_MONTHS: {STANDARD_24M: 24, EXTENDED_60M: 60, PERMANENT: null}
  SERIES_LAPSE_MISSED_WINDOWS: 2
  SECONDS_PER_TENTH_HOUR: 360
  LIVE_ROLES_REQUIRING_LIVE_CERT: [DIRECTOR, SWITCHER]
  UNPROTECTED_FINDING_CATEGORIES:
    - OBSCENITY
    - DEFAMATION
    - TRUE_THREAT
    - INCITEMENT_TO_IMMINENT_LAWLESS_ACTION
    - CHILD_EXPLOITATION
    - COMMERCIAL_ADVERTISING
    - COPYRIGHT_INFRINGEMENT
    - TECHNICAL_STANDARDS_FAILURE
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

# -----------------------------------------------------------------------------
# Table 6: Error Catalog
# -----------------------------------------------------------------------------
errors:
  # --- envelope / cross-cutting -----------------------------------------------
  - {error_id: ERR_UNAUTHENTICATED,            http_status: 401, category: auth,        trigger: "X-Role (or a required X-User-ID) header missing or empty"}
  - {error_id: ERR_FORBIDDEN_ROLE,             http_status: 403, category: authz,       trigger: "the X-Role value is not listed for the endpoint in §1.5"}
  - {error_id: ERR_INVALID_REQUEST,            http_status: 400, category: schema,      trigger: "missing required field, wrong type, unknown enum value, non-positive interval, out-of-range score or pagination parameter"}
  - {error_id: ERR_NOT_RESOURCE_OWNER,         http_status: 403, category: ownership,   trigger: "a Producer acts on a record owned by a different producer"}
  - {error_id: ERR_SEGREGATION_OF_DUTIES,      http_status: 403, category: sod,         trigger: "waiving an assessment one filed, or deciding a report one submitted"}
  - {error_id: ERR_INVALID_STATE_TRANSITION,   http_status: 409, category: state,       trigger: "the trigger has no transition from the entity's current state, including any attempt from a terminal state or a repeated one-shot action"}

  # --- existence ---------------------------------------------------------------
  - {error_id: ERR_PRODUCER_NOT_FOUND,         http_status: 404, category: existence,   trigger: "producer_id in a path or body names no Producer"}
  - {error_id: ERR_TRAINING_COURSE_NOT_FOUND,  http_status: 404, category: existence,   trigger: "course_id names no TrainingCourse"}
  - {error_id: ERR_COURSE_ENROLLMENT_NOT_FOUND, http_status: 404, category: existence,  trigger: "enrollmentId names no CourseEnrollment"}
  - {error_id: ERR_SERIES_NOT_FOUND,           http_status: 404, category: existence,   trigger: "seriesId, series_id or predecessor_series_id names no Series"}
  - {error_id: ERR_PROGRAM_NOT_FOUND,          http_status: 404, category: existence,   trigger: "programId or program_id names no Program"}
  - {error_id: ERR_ATTESTATION_NOT_FOUND,      http_status: 404, category: existence,   trigger: "attestationId names no Attestation"}
  - {error_id: ERR_CHANNEL_NOT_FOUND,          http_status: 404, category: existence,   trigger: "channelId or channel_id names no Channel"}
  - {error_id: ERR_PLAYBACK_SLOT_NOT_FOUND,    http_status: 404, category: existence,   trigger: "slotId, slot_id or linked_slot_id names no PlaybackSlot"}
  - {error_id: ERR_STUDIO_RESOURCE_NOT_FOUND,  http_status: 404, category: existence,   trigger: "resourceId or resource_id names no StudioResource"}
  - {error_id: ERR_RESERVATION_NOT_FOUND,      http_status: 404, category: existence,   trigger: "reservationId names no Reservation"}
  - {error_id: ERR_DAMAGE_ASSESSMENT_NOT_FOUND, http_status: 404, category: existence,  trigger: "assessmentId names no DamageAssessment"}
  - {error_id: ERR_CREW_ASSIGNMENT_NOT_FOUND,  http_status: 404, category: existence,   trigger: "assignmentId names no CrewAssignment"}
  - {error_id: ERR_FUNDING_PERIOD_NOT_FOUND,   http_status: 404, category: existence,   trigger: "periodId names no FundingPeriod"}
  - {error_id: ERR_ARCHIVE_ASSET_NOT_FOUND,    http_status: 404, category: existence,   trigger: "assetId names no ArchiveAsset"}

  # --- optimistic concurrency --------------------------------------------------
  - {error_id: ERR_STALE_SERIES_VERSION,         http_status: 412, category: occ, trigger: "expected_series_version on POST /series/{seriesId}/hold-plans is not the stored Series.version"}
  - {error_id: ERR_STALE_FUNDING_PERIOD_VERSION, http_status: 412, category: occ, trigger: "expected_funding_period_version on POST /funding-periods/{periodId}/revise is not the stored FundingPeriod.version"}

  # --- state guards ------------------------------------------------------------
  - {error_id: ERR_PRODUCER_NOT_ACTIVE,        http_status: 409, category: state, trigger: "the owning or volunteering producer is APPLICANT, SUSPENDED or REVOKED"}
  - {error_id: ERR_PROGRAM_NOT_APPROVED,       http_status: 409, category: state, trigger: "booking airtime for a program whose review_status is not APPROVED"}
  - {error_id: ERR_ATTESTATION_INCOMPLETE,     http_status: 409, category: state, trigger: "program.clearance_status is INCOMPLETE at submit or at slot creation"}
  - {error_id: ERR_SERIES_NOT_ACTIVE,          http_status: 409, category: state, trigger: "a hold booking or hold plan names a series that is PROPOSED, LAPSED or RETIRED"}
  - {error_id: ERR_RESOURCE_NOT_AVAILABLE,     http_status: 409, category: state, trigger: "confirming a reservation on a MAINTENANCE or RETIRED resource"}

  # --- business safety ---------------------------------------------------------
  - {error_id: ERR_COMPETENCY_NOT_HELD,        http_status: 422, category: business_safety, trigger: "the producer lacks the resource's required_competency_code"}
  - {error_id: ERR_CERTIFICATION_INSUFFICIENT, http_status: 422, category: business_safety, trigger: "creating a live program, or confirming a DIRECTOR/SWITCHER role on a live slot, without LIVE certification"}
  - {error_id: ERR_PREREQUISITE_NOT_MET,       http_status: 422, category: business_safety, trigger: "enrolling in ADVANCED without a passed BASIC, or in LIVE without a passed ADVANCED"}
  - {error_id: ERR_COURSE_FULL,                http_status: 409, category: business_safety, trigger: "enrolled_count has reached seat_capacity"}
  - {error_id: ERR_SLOT_UNDERSTAFFED,          http_status: 409, category: business_safety, trigger: "airing a slot whose staffing_status is UNDERSTAFFED"}
  - {error_id: ERR_RESOURCE_HAS_OPEN_RESERVATIONS, http_status: 409, category: business_safety, trigger: "retiring a resource whose open_reservation_count is above 0"}
  - {error_id: ERR_FINDING_CATEGORY_NOT_PERMITTED, http_status: 422, category: business_safety, trigger: "a refusal cites no category or a category outside UNPROTECTED_FINDING_CATEGORIES, or an approval carries a finding_category"}
  - {error_id: ERR_REVISION_LIMIT_EXCEEDED,    http_status: 422, category: business_safety, trigger: "resubmitting after MAX_REVISION_ROUNDS change requests"}

  # --- business temporal -------------------------------------------------------
  - {error_id: ERR_COURSE_SESSION_NOT_ENDED,   http_status: 409, category: business_temporal, trigger: "recording attendance before session_end_at"}
  - {error_id: ERR_WITHDRAWAL_WINDOW_CLOSED,   http_status: 409, category: business_temporal, trigger: "withdrawing at or after session_start_at"}
  - {error_id: ERR_INDEMNIFICATION_EXPIRED,    http_status: 422, category: business_temporal, trigger: "submitting when indemnification_expires_at is null or in the past"}
  - {error_id: ERR_SLOT_OUTSIDE_CHANNEL_WINDOW, http_status: 422, category: business_temporal, trigger: "the runtime-plus-buffer footprint does not fit inside the channel's daily window"}
  - {error_id: ERR_SLOT_WINDOW_CONFLICT,       http_status: 409, category: business_temporal, trigger: "the footprint overlaps a SCHEDULED slot that cannot be preempted"}
  - {error_id: ERR_SERIES_HOLD_EXHAUSTED,      http_status: 409, category: business_temporal, trigger: "a series hold booking with remaining_hold_slots below 1"}
  - {error_id: ERR_RESOURCE_OVERBOOKED,        http_status: 409, category: business_temporal, trigger: "capacity_slots already covered for the interval, or the turnaround buffer has not elapsed"}
  - {error_id: ERR_CHECKOUT_WINDOW_NOT_OPEN,   http_status: 409, category: business_temporal, trigger: "checkout more than CHECKOUT_LEAD_SECONDS early, or at/after end_at"}
  - {error_id: ERR_AIRTIME_NOT_REACHED,        http_status: 409, category: business_temporal, trigger: "airing a slot before its start_at"}
  - {error_id: ERR_RETENTION_NOT_ELAPSED,      http_status: 409, category: business_temporal, trigger: "purging before retain_until"}
  - {error_id: ERR_PERMANENT_RETENTION,        http_status: 409, category: business_temporal, trigger: "purging an asset whose retention_class is PERMANENT"}
  - {error_id: ERR_CREW_TIME_CONFLICT,         http_status: 409, category: business_temporal, trigger: "the volunteer already holds a CONFIRMED assignment on an overlapping slot"}

  # --- business referential ----------------------------------------------------
  - {error_id: ERR_SERIES_NOT_OWNED_BY_PRODUCER, http_status: 422, category: business_referential, trigger: "the named series belongs to another producer"}
  - {error_id: ERR_CHANNEL_TIER_NOT_ELIGIBLE,  http_status: 422, category: business_referential, trigger: "a BASIC-certified producer books an EDUCATIONAL or GOVERNMENT channel"}
  - {error_id: ERR_SLOT_PRODUCER_MISMATCH,     http_status: 422, category: business_referential, trigger: "linked_slot_id points at a slot whose program belongs to another producer"}
  - {error_id: ERR_DUPLICATE_ENROLLMENT,       http_status: 409, category: business_referential, trigger: "the producer already holds an ENROLLED, ATTENDED or PASSED enrollment on this course"}
  - {error_id: ERR_DUPLICATE_NATURAL_KEY,      http_status: 409, category: business_referential, trigger: "course_code, call_sign, resource_code or (fiscal_year, quarter) already exists"}
  - {error_id: ERR_LICENSE_REFERENCE_REQUIRED, http_status: 422, category: business_referential, trigger: "a COPYRIGHT_CLEARANCE attestation declares third_party_material without a license_reference"}

  # --- business fiscal ---------------------------------------------------------
  - {error_id: ERR_DEPOSIT_LIMIT_EXCEEDED,     http_status: 402, category: business_fiscal, trigger: "the new hold would push deposit_held_cents above DEPOSIT_HOLD_CAP_CENTS"}
  - {error_id: ERR_ALLOCABLE_BASE_NOT_POSITIVE, http_status: 402, category: business_fiscal, trigger: "the basis-selected allocable base is 0 or negative at report submission"}
  - {error_id: ERR_CAPITAL_GRANT_EXCEEDS_BASE, http_status: 402, category: business_fiscal, trigger: "capital_grant_cents exceeds the basis-selected allocable base"}

# -----------------------------------------------------------------------------
# Table 7: RBAC Table  (role_model: segregation_of_duties)
# -----------------------------------------------------------------------------
roles:

  - role: Producer
    identity: entity_backed:Producer
    description: |
      A certified (or applicant) community producer. X-User-ID carries the
      Producer.id, and every write is confined to that producer's own records:
      their enrollments, series, programs, attestations, reservations and their
      own volunteer crew assignments.
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{programId}/attestations"
      - "POST /programs/{programId}/submit"
    shared_operations:
      - "POST /course-enrollments (shared with TrainingCoordinator)"
      - "POST /course-enrollments/{enrollmentId}/withdraw (shared with TrainingCoordinator)"
      - "POST /series (shared with SchedulingCoordinator)"
      - "POST /programs/{programId}/withdraw (shared with CenterAdmin)"
      - "POST /reservations (shared with FacilitiesManager)"
      - "POST /reservations/{reservationId}/cancel (shared with FacilitiesManager)"
      - "POST /crew-assignments/{assignmentId}/confirm (shared with SchedulingCoordinator)"
      - "POST /crew-assignments/{assignmentId}/release (shared with SchedulingCoordinator)"
      - "all GET reads on their own domain"
    cannot:
      - "any /producers write, any /training-courses write, any /channels write, any /studio-resources write, any /funding-periods write"
      - "grading, review claims and review decisions"
      - "booking, airing or cancelling playback slots"
      - "confirming, checking out or returning reservations"
      - "finalizing or waiving damage assessments"
      - "publishing, view-recording or purging archive assets"

  - role: TrainingCoordinator
    identity: opaque
    description: "Runs the certification curriculum: publishes courses, records attendance and grades practicals."
    exclusive_operations:
      - "POST /training-courses"
      - "POST /course-enrollments/{enrollmentId}/attendance"
      - "POST /course-enrollments/{enrollmentId}/grade"
    shared_operations:
      - "POST /course-enrollments (shared with Producer)"
      - "POST /course-enrollments/{enrollmentId}/withdraw (shared with Producer)"
    cannot:
      - "any program review, scheduling, facilities, finance or archive operation"
      - "verifying residency, reinstating or revoking a producer"

  - role: ContentReviewer
    identity: opaque
    description: |
      Reviews submitted programs against content standards limited to legally
      unprotected categories. The reviewer who claims a program is the only one
      who may decide it, and a refusal must cite an unprotected category.
    exclusive_operations:
      - "POST /programs/{programId}/review-claim"
      - "POST /programs/{programId}/review-decision"
    shared_operations:
      - "GET reads on programs, attestations, series, slots and archive assets"
    cannot:
      - "creating, submitting or withdrawing a program"
      - "booking or airing playback slots"
      - "any training, facilities, finance or archive write"

  - role: SchedulingCoordinator
    identity: opaque
    description: "Owns channel airtime, series activation and hold plans, and volunteer crew staffing."
    exclusive_operations:
      - "POST /series/{seriesId}/activate"
      - "POST /series/{seriesId}/hold-plans"
      - "POST /playback-slots"
      - "POST /playback-slots/{slotId}/air"
      - "POST /playback-slots/{slotId}/cancel"
      - "POST /crew-assignments"
    shared_operations:
      - "POST /series (shared with Producer)"
      - "POST /crew-assignments/{assignmentId}/confirm (shared with Producer)"
      - "POST /crew-assignments/{assignmentId}/release (shared with Producer)"
    cannot:
      - "creating channels or approving programs"
      - "any training, facilities, finance or archive write"

  - role: FacilitiesManager
    identity: opaque
    description: "Runs the equipment room: resource lifecycle, reservation confirmation, checkout, return and damage finalization."
    exclusive_operations:
      - "POST /studio-resources"
      - "POST /studio-resources/{resourceId}/status"
      - "POST /reservations/{reservationId}/confirm"
      - "POST /reservations/{reservationId}/checkout"
      - "POST /reservations/{reservationId}/return"
      - "POST /damage-assessments/{assessmentId}/finalize"
    shared_operations:
      - "POST /reservations (shared with Producer)"
      - "POST /reservations/{reservationId}/cancel (shared with Producer)"
    cannot:
      - "waiving a damage assessment (that is the FinanceOfficer's duty, and never the filer's)"
      - "any training, review, scheduling, finance or archive write"

  - role: FinanceOfficer
    identity: opaque
    description: |
      Administers franchise fees and capital funding, and holds the waiver
      authority that the equipment room deliberately does not have.
    exclusive_operations:
      - "POST /funding-periods"
      - "POST /funding-periods/{periodId}/revise"
      - "POST /funding-periods/{periodId}/report-submit"
      - "POST /damage-assessments/{assessmentId}/waive"
    shared_operations:
      - "GET reads on funding periods, reservations and damage assessments"
    cannot:
      - "deciding a report they submitted (segregation of duties), and deciding any report at all"
      - "any training, review, scheduling, facilities or archive write"

  - role: CenterAdmin
    identity: opaque
    description: |
      The community media center's administrator: membership admission and
      revocation, channel definition, municipal report decisions and the
      on-demand archive.
    exclusive_operations:
      - "POST /producers"
      - "POST /producers/{producerId}/residency-verification"
      - "POST /producers/{producerId}/reinstate"
      - "POST /producers/{producerId}/revoke"
      - "POST /channels"
      - "POST /funding-periods/{periodId}/report-decision"
      - "POST /archive-assets/{assetId}/publish"
      - "POST /archive-assets/{assetId}/record-views"
      - "POST /archive-assets/{assetId}/purge"
    shared_operations:
      - "POST /programs/{programId}/withdraw (shared with Producer)"
      - "all GET reads"
    cannot:
      - "accepting or returning a report they submitted (they cannot submit one at all)"
      - "publishing a course, grading a practical, claiming or deciding a program review"
      - "booking or airing slots, confirming reservations, finalizing or waiving damage assessments"
