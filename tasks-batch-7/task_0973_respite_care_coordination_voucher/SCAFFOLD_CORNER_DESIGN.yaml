            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-07T20:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 10 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
          trigger:
