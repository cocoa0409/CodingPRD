# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Volunteer Application, Country Placement & Medical Clearance
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; setup chains drive
# empty-DB -> fixture state using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: readjustment_penalized_vs_standard_divergence
        grounds:
          - calculations.readjustment_allowance
          - entities.CompletionRecord.fields.allowance_paid_cents
          - entities.CompletionRecord.fields.gross_accrued_cents
        distinguishing_aspect: |
          Fiscal/benefits domain (CompletionRecord): for identical months_served the PENALIZED
          early-termination variant pays 6*round_half_up(47500*2/3)=190002 cents while the
          STANDARD variant pays 6*47500=285000 cents — the two variants of the same calculation
          diverge on the same inputs; the matching-domain dual variant lives in
          skill_match_strict_vs_preference_weighted_divergence (different entity domain).
        test_recipe:
          setup:
            - "Applicant Ana fully cleared and sworn in at 2027-01-01T00:00:00Z (service start), opening O1 with 2 seats, cohort PST starting 2027-01-01"
            - "VolunteerService ACTIVE with service_start_date 2027-01-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "Secondary English Teacher", required_skills: ["TEACHING_ENGLISH"], seats_total: 2, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { opening_id: $.data.id, opening_v: $.data.version }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${applicant_id}", sector_preferences: ["EDUCATION"], country_preference_ids: ["${prog_pe}"] }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /volunteer-portal/applications/${app_id}/interviews"
              payload: { interviewer_id: "officer-1", scheduled_start: "2026-09-05T14:00:00Z", scheduled_end: "2026-09-05T15:00:00Z" }
              as: PlacementOfficer
              captures: { interview_id: $.data.id }
            - call: "POST /volunteer-portal/interviews/${interview_id}/complete"
              payload: { motivation_score: 4.0, adaptability_score: 3.0, skill_competency_score: 3.0, cross_cultural_score: 3.0 }
              as: PlacementOfficer
            - call: "POST /volunteer-portal/invitations"
              payload: { application_id: "${app_id}", assignment_opening_id: "${opening_id}", expected_assignment_opening_version: "${opening_v}" }
              as: PlacementOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /volunteer-portal/invitations/${inv_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /volunteer-portal/medical-clearances"
              payload: { application_id: "${app_id}", conditions: [], dental_status: "CLEAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { med_id: $.data.id }
            - call: "POST /volunteer-portal/medical-clearances/${med_id}/determine"
              payload: { determination: "CLEARED" }
              as: MedicalOfficer
            - call: "GET /volunteer-portal/applications/${app_id}/legal-clearances"
              as: LegalReviewer
              captures: { legal_id: "$.data[0].id" }
            - call: "POST /volunteer-portal/legal-clearances/${legal_id}/adjudicate-background"
              payload: { outcome: "CLEAR" }
              as: LegalReviewer
              as_user_id: "legal-1"
            - call: "POST /volunteer-portal/legal-clearances/${legal_id}/determine-suitability"
              payload: { outcome: "FAVORABLE" }
              as: LegalReviewer
              as_user_id: "legal-2"
            - call: "POST /volunteer-portal/training-cohorts"
              payload: { country_program_id: "${prog_pe}", name: "PST-2027-A", start_date: "2027-01-01T00:00:00Z", end_date: "2027-03-31T00:00:00Z", capacity: 5 }
              as: SystemAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /volunteer-portal/training-enrollments"
              payload: { application_id: "${app_id}", training_cohort_id: "${cohort_id}" }
              as: PlacementOfficer
              captures: { enroll_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/training-enrollments/${enroll_id}/assess"
              payload: { language_score: 3.0, technical_score: 3.0, cultural_score: 3.0 }
              as: TrainingDirector
            - call: "POST /volunteer-portal/training-enrollments/${enroll_id}/swear-in"
              payload: {}
              as: TrainingDirector
            - call: "GET /volunteer-portal/volunteer-services?application_id=${app_id}"
              as: CountryDirector
              captures: { svc_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-30T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/volunteer-services/${svc_id}/early-terminate"
              payload: { reason: "FAMILY" }
              as: CountryDirector
            - call: "GET /volunteer-portal/volunteer-services/${svc_id}/completion-record"
              as: CountryDirector
          assert:
            - "VolunteerService.${svc_id}.status == EARLY_TERMINATED and actual_end_date == 2027-06-30T00:00:00Z"
            - "CompletionRecord.completion_type == EARLY and et_reason == FAMILY"
            - "CompletionRecord.months_served == 6 (180 days: floor((180+15)/30))"
            - "CompletionRecord.gross_accrued_cents == 285000 (6 * 47500, the STANDARD variant value)"
            - "CompletionRecord.allowance_paid_cents == 190002 (PENALIZED: 6 * 31667) — strictly less than gross"
            - "CompletionRecord.allowance_forfeited_cents == 94998 (285000 - 190002)"
            - "CompletionRecord.nce_eligible == false and nce_duration_months == 0 (6 < 12 and reason FAMILY)"

      - name: skill_match_strict_vs_preference_weighted_divergence
        grounds:
          - calculations.skill_match_score
        distinguishing_aspect: |
          Matching/selector domain (Application x AssignmentOpening): for identical inputs the
          strict variant yields 1.0 while the preference_weighted variant yields 0.98 — the two
          variants of the same calculation diverge; the fiscal-domain dual variant lives in
          readjustment_penalized_vs_standard_divergence (different entity domain).
        test_recipe:
          setup:
            - "Programs EC (rank 1 preference) and PE (rank 2 preference); one OPEN opening in PE (sector EDUCATION, requires TEACHING_ENGLISH)"
            - "Applicant Ana holds TEACHING_ENGLISH; her SUBMITTED application prefers sectors [EDUCATION] and countries [EC, PE] (PE at rank index 1)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "EC", name: "Ecuador", medical_support_tier: 2, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_ec: $.data.id }
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "Secondary English Teacher", required_skills: ["TEACHING_ENGLISH"], seats_total: 2, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { opening_id: $.data.id }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${applicant_id}", sector_preferences: ["EDUCATION"], country_preference_ids: ["${prog_ec}", "${prog_pe}"] }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "GET /volunteer-portal/applications/${app_id}/matches"
              as: PlacementOfficer
          assert:
            - "HTTP 200; data.matches has exactly 1 element (EC has no openings, so only the PE opening is eligible)"
            - "matches[0].assignment_opening_id == ${opening_id}"
            - "matches[0].strict_score == 1.0 (1 of 1 required skills met)"
            - "matches[0].weighted_score == 0.98 (0.7*1.0 + 0.2*1.0 + 0.1*0.75; PE sits at rank index 1 giving country_bonus 0.75)"
            - "matches[0].strict_score != matches[0].weighted_score — the two variants diverge on identical inputs"

  - rule_id: combinatorial_formula
    instances:
      - name: interview_overall_weighted_sum_with_dimension_cap
        grounds:
          - calculations.interview_overall_score
          - entities.Interview.fields.recommendation
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: four weighted dimension scores plus
          a conditional branch (any dimension < 2.0 caps the outcome at NOT_RECOMMENDED) and tiered
          thresholds; scores 5/5/5/1.5 give weighted sum 4.30 yet recommendation NOT_RECOMMENDED,
          proving the cap branch overrides the tier the sum alone would reach (STRONGLY_RECOMMEND).
        test_recipe:
          setup:
            - "Applicant Ana; application UNDER_REVIEW with one SCHEDULED interview"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${applicant_id}", sector_preferences: ["EDUCATION"] }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /volunteer-portal/applications/${app_id}/interviews"
              payload: { interviewer_id: "officer-1", scheduled_start: "2026-09-05T14:00:00Z", scheduled_end: "2026-09-05T15:00:00Z" }
              as: PlacementOfficer
              captures: { interview_id: $.data.id }
          trigger:
            - call: "POST /volunteer-portal/interviews/${interview_id}/complete"
              payload: { motivation_score: 5.0, adaptability_score: 5.0, skill_competency_score: 5.0, cross_cultural_score: 1.5 }
              as: PlacementOfficer
          assert:
            - "Interview.${interview_id}.overall_score == 4.3 (round_half_up(0.30*5 + 0.25*5 + 0.25*5 + 0.20*1.5, 2) = 4.30)"
            - "Interview.${interview_id}.recommendation == NOT_RECOMMENDED (minimum dimension 1.5 < 2.0 cap overrides the 4.30 sum, which alone would be STRONGLY_RECOMMEND)"
            - "Interview.${interview_id}.status == COMPLETED"
            - "Application.${app_id}.status == EVALUATED"

      - name: readjustment_per_month_rounding_before_summation
        grounds:
          - calculations.readjustment_allowance
          - entities.CompletionRecord.fields.allowance_paid_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: the scaffold pins
          round-per-month-then-multiply (3 * round_half_up(47500*2/3) = 3*31667 = 95001),
          which differs by exactly 1 cent from sum-then-round (round_half_up(142500*2/3) = 95000);
          the assertion on 95001 falsifies the opposite rounding order.
        test_recipe:
          setup:
            - "Applicant Ana sworn in at 2027-01-01T00:00:00Z (same pipeline as readjustment_penalized_vs_standard_divergence: PE program tier 3, opening with 2 seats, cleared medically and legally, enrolled, assessed 3.0/3.0/3.0, sworn in)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "Secondary English Teacher", required_skills: ["TEACHING_ENGLISH"], seats_total: 2, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { opening_id: $.data.id, opening_v: $.data.version }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${applicant_id}", sector_preferences: ["EDUCATION"], country_preference_ids: ["${prog_pe}"] }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /volunteer-portal/applications/${app_id}/interviews"
              payload: { interviewer_id: "officer-1", scheduled_start: "2026-09-05T14:00:00Z", scheduled_end: "2026-09-05T15:00:00Z" }
              as: PlacementOfficer
              captures: { interview_id: $.data.id }
            - call: "POST /volunteer-portal/interviews/${interview_id}/complete"
              payload: { motivation_score: 4.0, adaptability_score: 3.0, skill_competency_score: 3.0, cross_cultural_score: 3.0 }
              as: PlacementOfficer
            - call: "POST /volunteer-portal/invitations"
              payload: { application_id: "${app_id}", assignment_opening_id: "${opening_id}", expected_assignment_opening_version: "${opening_v}" }
              as: PlacementOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /volunteer-portal/invitations/${inv_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /volunteer-portal/medical-clearances"
              payload: { application_id: "${app_id}", conditions: [], dental_status: "CLEAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { med_id: $.data.id }
            - call: "POST /volunteer-portal/medical-clearances/${med_id}/determine"
              payload: { determination: "CLEARED" }
              as: MedicalOfficer
            - call: "GET /volunteer-portal/applications/${app_id}/legal-clearances"
              as: LegalReviewer
              captures: { legal_id: "$.data[0].id" }
            - call: "POST /volunteer-portal/legal-clearances/${legal_id}/adjudicate-background"
              payload: { outcome: "CLEAR" }
              as: LegalReviewer
              as_user_id: "legal-1"
            - call: "POST /volunteer-portal/legal-clearances/${legal_id}/determine-suitability"
              payload: { outcome: "FAVORABLE" }
              as: LegalReviewer
              as_user_id: "legal-2"
            - call: "POST /volunteer-portal/training-cohorts"
              payload: { country_program_id: "${prog_pe}", name: "PST-2027-A", start_date: "2027-01-01T00:00:00Z", end_date: "2027-03-31T00:00:00Z", capacity: 5 }
              as: SystemAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /volunteer-portal/training-enrollments"
              payload: { application_id: "${app_id}", training_cohort_id: "${cohort_id}" }
              as: PlacementOfficer
              captures: { enroll_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/training-enrollments/${enroll_id}/assess"
              payload: { language_score: 3.0, technical_score: 3.0, cultural_score: 3.0 }
              as: TrainingDirector
            - call: "POST /volunteer-portal/training-enrollments/${enroll_id}/swear-in"
              payload: {}
              as: TrainingDirector
            - call: "GET /volunteer-portal/volunteer-services?application_id=${app_id}"
              as: CountryDirector
              captures: { svc_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/volunteer-services/${svc_id}/early-terminate"
              payload: { reason: "FAMILY" }
              as: CountryDirector
            - call: "GET /volunteer-portal/volunteer-services/${svc_id}/completion-record"
              as: CountryDirector
          assert:
            - "CompletionRecord.months_served == 3 (90 days: floor((90+15)/30))"
            - "CompletionRecord.gross_accrued_cents == 142500 (3 * 47500)"
            - "CompletionRecord.allowance_paid_cents == 95001 (3 * 31667 — per-month rounding THEN multiply; sum-then-round would give 95000)"
            - "CompletionRecord.allowance_forfeited_cents == 47499 (142500 - 95001)"

      - name: medical_review_evaluates_pinned_tier_not_live_tier
        grounds:
          - calculations.medical_accommodation_gap
          - entities.Invitation.fields.pinned_country_medical_tier
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the clearance
          outcome depends on a country tier, but the tier is resolved from the invitation's
          issuance-time snapshot FIRST and the live program tier is never re-consulted; dropping
          the program's live tier from 3 to 1 before review still allows CLEARED for a tier-3
          condition, falsifying any implementation that re-derives the tier at review time.
        test_recipe:
          setup:
            - "PE program created with medical_support_tier 3; applicant Ana invited and ACCEPTED (invitation pinned tier 3); medical clearance SUBMITTED with one condition requiring support tier 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "Secondary English Teacher", required_skills: ["TEACHING_ENGLISH"], seats_total: 2, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { opening_id: $.data.id, opening_v: $.data.version }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${applicant_id}", sector_preferences: ["EDUCATION"], country_preference_ids: ["${prog_pe}"] }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /volunteer-portal/applications/${app_id}/interviews"
              payload: { interviewer_id: "officer-1", scheduled_start: "2026-09-05T14:00:00Z", scheduled_end: "2026-09-05T15:00:00Z" }
              as: PlacementOfficer
              captures: { interview_id: $.data.id }
            - call: "POST /volunteer-portal/interviews/${interview_id}/complete"
              payload: { motivation_score: 4.0, adaptability_score: 3.0, skill_competency_score: 3.0, cross_cultural_score: 3.0 }
              as: PlacementOfficer
            - call: "POST /volunteer-portal/invitations"
              payload: { application_id: "${app_id}", assignment_opening_id: "${opening_id}", expected_assignment_opening_version: "${opening_v}" }
              as: PlacementOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /volunteer-portal/invitations/${inv_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /volunteer-portal/medical-clearances"
              payload: { application_id: "${app_id}", conditions: [{ condition_code: "CARDIAC_STABLE", severity: 2, required_support_tier: 3 }], dental_status: "CLEAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { med_id: $.data.id }
            - call: "PATCH /volunteer-portal/country-programs/${prog_pe}"
              payload: { medical_support_tier: 1 }
              as: SystemAdmin
          trigger:
            - call: "POST /volunteer-portal/medical-clearances/${med_id}/determine"
              payload: { determination: "CLEARED" }
              as: MedicalOfficer
