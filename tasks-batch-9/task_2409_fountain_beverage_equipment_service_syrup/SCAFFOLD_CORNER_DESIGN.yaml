      - name: telemetry_gallon_breach_cascade_to_posture_and_allocations
        claim_type: cascade_down
        grounds:
          - state_machines.MaintenanceTask.SCHEDULED_to_OVERDUE_gallon
          - calculations.outlet_service_posture
        excluded_because:
          difficulty_instance: telemetry_gallon_breach_cascades_to_frozen_posture_and_released_allocation
          rationale: "§1.8 already drives the four-hop chain telemetry -> GALLON breach -> overdue counter -> posture -> stop skip and allocation release end to end; a §1.9 breadth copy would replay the identical trigger."

      - name: agreement_terminates_when_its_last_unit_is_returned
        claim_type: bubble_up
        grounds:
          - state_machines.PlacementAgreement.RECALL_PENDING_to_TERMINATED
        excluded_because:
          difficulty_instance: confirm_return_cascades_to_terminated_agreement_suspended_outlet_and_skipped_stop
          rationale: "§1.8 asserts the bubble-up of the last RETURNED unit into PlacementAgreement TERMINATED and onward into the Outlet SUSPENDED cascade; §1.9 keeps only the task/service-call sweep of the same transition."

      - name: service_hold_release_guarded_by_overdue_sanitation_task
        claim_type: guarded_transition
        grounds:
          - state_machines.DispenserUnit.status.SERVICE_HOLD_to_IN_SERVICE
          - errors[ERR_SANITATION_OVERDUE]
        excluded_because:
          difficulty_instance: service_hold_release_blocked_by_overdue_sanitation_task
          rationale: "§1.8 already covers the cross-entity guard (OVERDUE SANITATION task blocks SERVICE_HOLD -> IN_SERVICE) together with the ERR_SANITATION_OVERDUE mapping; the positive counterpart is covered here by service_hold_place_then_release_returns_unit_to_in_service."

      - name: stop_serve_guarded_by_out_of_spec_calibration
        claim_type: guarded_transition
        grounds:
          - state_machines.RouteStop.ARRIVED_to_SERVED
          - errors[ERR_CALIBRATION_OUT_OF_SPEC]
        excluded_because:
          difficulty_instance: stop_serve_blocked_by_out_of_spec_calibration_dimension
          rationale: "§1.8 drives the OUT_OF_SPEC calibration dimension of a sibling unit into a serve refusal; §1.9 instead exercises the FROZEN-posture guard on the same transition."

      - name: route_cancel_releases_allocations_back_to_the_national_pool
        claim_type: compensation
        grounds:
          - state_machines.ReplenishmentRoute.DISPATCHED_to_CANCELLED
          - calculations.supply_pool_ledger
        excluded_because:
          difficulty_instance: national_pool_conserved_across_allocation_and_route_cancel
          rationale: "§1.8 already reconciles reserved_pool_units and committed_units across an allocate-then-cancel cycle including the ACCESS_DENIED stop skip; the §1.9 release coverage comes from the operator-skip corner instead."

  # ===========================================================================
  # CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:

      - name: forecast_trailing_actual_correct_result_and_requested_units_ceiling
        claim_type: correct_result
        grounds:
          - calculations.outlet_supply_forecast
          - endpoints[POST /fountain-network/supply-positions/{id}/forecast]
        distinguishing_aspect: "7000 ounces over 7 days is 1000 oz/day, so the 14-day horizon needs 14000 oz; at ounces_per_unit 3000 that is 4.6667 units, minus 2 on hand gives forecast_units 2.67 (round_half_up) and requested_units 3 (ceil), with coverage 6.0 days landing in the LOW band."
        test_recipe:
          setup:
            - "One IN_SERVICE unit at a MEDIUM outlet; SKU with ounces_per_unit 3000; one 7000-ounce 7-day reading at 2026-07-28; position on_hand_units 2."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST", throughput_tier: "MEDIUM" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 3000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { si: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du}", supply_item_id: "${si}", dispensed_ounces: 7000, reading_at: "2026-07-28T00:00:00Z", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${si}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { sp: $.data.id }
          trigger:
            - call: "POST /fountain-network/supply-positions/${sp}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
          assert:
            - "HTTP status == 200"
            - "OutletSupplyPosition.${sp}.forecast_units == 2.67"
            - "OutletSupplyPosition.${sp}.requested_units == 3"
            - "OutletSupplyPosition.${sp}.alert_level == LOW"
            - "OutletSupplyPosition.${sp}.promo_suppressed == false"
            - "OutletSupplyPosition.${sp}.forecast_variant == TRAILING_ACTUAL"

      - name: forecast_window_includes_lower_bound_and_excludes_the_clock_instant
        claim_type: input_set_filtering
        grounds:
          - calculations.outlet_supply_forecast
          - entities.TelemetryReading.fields.reading_at
        distinguishing_aspect: "Readings at exactly clock - 7 days (2026-07-25T00:00:00Z) count while a reading at exactly the clock (2026-08-01T00:00:00Z) does not, so window_ounces is 7000 and forecast_units is 11.00; an inclusive upper bound would yield 21.00."
        test_recipe:
          setup:
            - "SKU with ounces_per_unit 1000; three readings of 3500, 3500 and 5000 ounces at 2026-07-25T00:00:00Z, 2026-07-28T00:00:00Z and 2026-08-01T00:00:00Z; position on_hand_units 3."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
