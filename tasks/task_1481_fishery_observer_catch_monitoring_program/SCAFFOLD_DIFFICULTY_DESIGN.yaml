  # (priority 11, ERR_PAYMENT_EXCEEDS_OUTSTANDING).
  # Instance 2: business_referential (priority 9, ERR_VESSEL_NOT_HUMAN_MODE) vs
  # business_fiscal (priority 11, ERR_SEA_DAY_ALLOCATION_EXCEEDED).
