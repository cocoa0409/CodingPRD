              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { o1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-200", full_name: "Officer Quill", duty_role: "AUDITOR" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { o2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R2", email: "r2@example.test", home_x_m: 0, home_y_m: 20, alert_radius_m: 0 }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R3", email: "r3@example.test", home_x_m: 0, home_y_m: 30, alert_radius_m: 0 }
              as: Anonymous
              captures: { r3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "D1", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r2_id}", label: "D2", grid_x_m: 0, grid_y_m: 20, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r3_id}", label: "D3", grid_x_m: 0, grid_y_m: 30, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r3_id}"
