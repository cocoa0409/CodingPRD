      - name: logical_clock_default_and_set_drive_time_rules
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - validations[priority=9]
        distinguishing_aspect: "The logical clock starts at the fixed default 2026-09-01T00:00:00Z (verified by creating a shift starting 2026-08-31 failing ERR_SHIFT_IN_PAST before any set call) and set_current_utc moves it deterministically."
        test_recipe:
