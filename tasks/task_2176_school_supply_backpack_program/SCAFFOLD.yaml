# =============================================================================
# PRD Benchmark Scaffold — School Supply Drive & Backpack Program
# Difficulty target: beyond Expert (§0.4) — dense cross-entity coupling,
# ordering-sensitive rounding, dual-variant ledgers, cyclic + parallel state
# dimensions, precedence-sensitive validation ladder, OCC-guarded capacity.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2176. School Supply Drive & Backpack Program (community backpack program): needs list by grade & school partnership, donation collection sites & corporate drive coordination, sorting/assembly volunteer events, distribution event registration & eligibility, unfilled item purchasing with cash donations, year-round vs back-to-school cadence, teacher-request supplemental program, impact tracking by student served

domain_name: school-supply-backpack-program
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit foreign keys in
  # the request body. Nested URL paths are used ONLY for reverse-reachability
  # reads (GET /parents/{id}/children) and for transition sub-paths, never to
  # express ownership of a create.

  state_machine_shape: cyclic
  # Cyclic on StudentRegistration (CONFIRMED <-> WAITLISTED) and DriveCycle
  # (SORTING -> COLLECTING reopen; DISTRIBUTION -> COLLECTING only when
  # cadence == YEAR_ROUND), branching fork-join on DonationBatch
  # (INSPECTED -> {ACCEPTED, QUARANTINED}, QUARANTINED -> REMEDIATED ->
  # ACCEPTED with divergent side-effect sets), and parallel independent state
  # dimensions on CollectionSite (operational_status x pledge_status).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic   # CashDonation.restriction_type selects which optional FK is populated

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Partner school display name."
        constraints: "1..120 chars, non-blank"
      - name: district_code
        type: string
        source: input
        description: "District identifier used for reporting groupings."
        constraints: "1..16 chars"
      - name: title_i_pct
        type: number
        source: input
        description: "Share of the student body qualifying under Title I; feeds the equity weight of the impact index."
        constraints: "0.00 <= title_i_pct <= 1.00, 2 decimal places"
      - name: enrollment_count
        type: integer
        source: input
        description: "Total enrolled students at the school."
        constraints: ">= 1"
      - name: max_concurrent_seats
        type: integer
        source: input
        description: "Aggregate distribution seats the school can host at any single instant; the aggregate-capacity ceiling used by the DistributionEvent overlap rule."
        constraints: ">= 1"
      - name: partnership_status
        type: enum
        source: system
        description: "Partnership lifecycle state."
        default: PROSPECT
        constraints: "PROSPECT | MOU_PENDING | ACTIVE | SUSPENDED | ARCHIVED"
      - name: target_student_count
        type: integer
        source: computed
        description: "Sum of student_target_count over this school's GradeKitSpec rows with status == PUBLISHED. Recomputed whenever a spec is published or retired."
        default: 0
      - name: students_served_interim_count
        type: integer
        source: computed
        description: "Count of StudentRegistration rows on this school's DistributionEvents whose eligibility_status IN {CONFIRMED, FULFILLED}."
        default: 0
      - name: students_served_audited_count
        type: integer
        source: computed
        description: "Count of StudentRegistration rows on this school's DistributionEvents whose eligibility_status == FULFILLED."
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: "Count of StudentRegistration rows on this school's DistributionEvents whose eligibility_status == NO_SHOW."
        default: 0
      - name: kits_delivered_count
        type: integer
        source: computed
        description: "Count of StudentRegistration rows that reached FULFILLED; one kit per fulfilled registration."
        default: 0
      - name: impact_index_interim
        type: number
        source: computed
        description: "INTERIM variant of calculation school_impact_index, 2 decimal places."
        default: 0.00
      - name: impact_index_audited
        type: number
        source: computed
        description: "AUDITED variant of calculation school_impact_index, 2 decimal places."
        default: 0.00

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Catalog SKU; unique across SupplyItem rows."
        constraints: "1..32 chars, unique"
      - name: name
        type: string
        source: input
        description: "Human-readable item name."
      - name: category
        type: enum
        source: input
        description: "Item category; HYGIENE items carry the sealed-packaging safety rule, BACKPACK items are the program's anchor item."
        constraints: "WRITING | PAPER | BINDER | HYGIENE | BACKPACK"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Replacement cost of one unit, in cents; drives kit costing and purchase-order subtotals."
        constraints: ">= 1"
      - name: bulk_pack_size
        type: integer
        source: input
        description: "Units per wholesale pack; purchase orders may only be placed in whole packs."
        constraints: ">= 1"
      - name: hygiene_sealed_required
        type: boolean
        source: input
        description: "When true, a donated batch of this item may only be accepted if it is factory sealed and in NEW condition."
        default: false
      - name: catalog_active
        type: boolean
        source: input
        description: "Whether the item may be referenced by new kit spec lines, donations and purchase orders."
        default: true

  - name: GradeKitSpec
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the school whose grade-band needs list this is."
      - name: grade_band
        type: enum
        source: input
        description: "Grade band this needs list applies to."
        constraints: "K_2 | G3_5 | G6_8 | G9_12"
      - name: student_target_count
        type: integer
        source: input
        description: "Number of students the school intends to serve in this grade band this program year."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Needs-list lifecycle state; only a PUBLISHED spec may back a distribution event."
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | RETIRED"
      - name: kit_unit_cost_cents
        type: integer
        source: computed
        description: "Cost of one complete kit for this grade band; output of calculation kit_unit_cost."
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: "Number of KitSpecLine rows attached to this spec."
        default: 0

  - name: KitSpecLine
    parent: null
    common_fields: true
    fields:
      - name: grade_kit_spec_id
        type: string
        source: input
        description: "FK -> GradeKitSpec.id; the needs list this line belongs to."
      - name: supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; the item required by this line."
      - name: qty_per_student
        type: integer
        source: input
        description: "Units of the item required per student served."
        constraints: ">= 1"
      - name: substitutable
        type: boolean
        source: input
        description: "Whether an equivalent item may be swapped in during assembly; recorded for operations, never relaxes the inventory coverage rule."
        default: false

  - name: DriveCycle
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Campaign name, e.g. 'Back-to-School 2026'."
      - name: cadence
        type: enum
        source: input
        description: "BACK_TO_SCHOOL is a one-pass seasonal campaign; YEAR_ROUND may reopen collection from the distribution phase and uses a shorter registration lead time."
        constraints: "BACK_TO_SCHOOL | YEAR_ROUND"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the cycle opens; every distribution and volunteer window must sit inside the cycle window."
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the cycle closes."
      - name: status
        type: enum
        source: system
        description: "Cycle phase; gates donation intake, purchasing and distribution."
        default: DRAFT
        constraints: "DRAFT | COLLECTING | SORTING | DISTRIBUTION | RECONCILED | CLOSED"
      - name: cash_received_cents
        type: integer
        source: computed
        description: "Sum of CashDonation.amount_cents for this cycle over all cash donations regardless of restriction."
        default: 0
      - name: cash_allocated_cents
        type: integer
        source: computed
        description: "Sum of CashDonation.allocated_cents for this cycle; equals the total funded by purchase orders in status IN {SUBMITTED, APPROVED, RECEIVED}."
        default: 0
      - name: cash_available_cents
        type: integer
        source: computed
        description: "cash_received_cents - cash_allocated_cents; the conserved cash quantity of invariant cash_conservation."
        default: 0
      - name: unrestricted_gross_cents
        type: integer
        source: computed
        description: "Sum of CashDonation.amount_cents for this cycle where restriction_type == UNRESTRICTED; the base of the teacher-request supplemental cap."
        default: 0
      - name: supplemental_cap_cents
        type: integer
        source: computed
        description: "floor(unrestricted_gross_cents * SUPPLEMENTAL_CAP_PCT); output of calculation teacher_supplemental_budget."
        default: 0
      - name: total_items_on_hand
        type: integer
        source: computed
        description: "Sum of InventoryPosition.on_hand_qty over every position of this cycle."
        default: 0

  - name: CollectionSite
    parent: null
    common_fields: true
    fields:
      - name: drive_cycle_id
        type: string
        source: input
        description: "FK -> DriveCycle.id; the cycle this site collects for."
      - name: name
        type: string
        source: input
        description: "Site display name."
      - name: site_type
        type: enum
        source: input
        description: "CORPORATE sites are corporate-drive partners and carry a pledge; other types never leave pledge_status NONE."
        constraints: "RETAIL | CORPORATE | SCHOOL | LIBRARY"
      - name: bin_capacity
        type: integer
        source: input
        description: "Number of collection/assembly bins on site; converted to kit stations by BINS_TO_KITS in the volunteer throughput calculation."
        constraints: ">= 1"
      - name: operational_status
        type: enum
        source: system
        description: "First of two independent state dimensions: whether the site may receive donations and host volunteer events."
        default: PENDING
        constraints: "PENDING | ACTIVE | PAUSED | CLOSED"
      - name: pledge_status
        type: enum
        source: system
        description: "Second, independent state dimension: the corporate drive pledge lifecycle. Non-CORPORATE sites stay at NONE forever."
        default: NONE
        constraints: "NONE | PLEDGED | PLEDGE_ACTIVE | FULFILLED | LAPSED"
      - name: pledged_item_count
        type: integer
        source: input
        description: "Units the corporate partner committed to collect; 0 for non-corporate sites."
        default: 0
        constraints: ">= 0"
      - name: accepted_item_count
        type: integer
        source: computed
        description: "Sum of DonationBatch.qty_accepted over this site's batches in status ACCEPTED."
        default: 0

  - name: DonationBatch
    parent: null
    common_fields: true
    fields:
      - name: collection_site_id
        type: string
        source: input
        description: "FK -> CollectionSite.id; where the batch was dropped off."
      - name: supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; a batch holds exactly one SKU."
      - name: qty_declared
        type: integer
        source: input
        description: "Units the donor declared at intake."
        constraints: ">= 1"
      - name: condition
        type: enum
        source: input
        description: "Physical condition recorded at intake."
        constraints: "NEW | GENTLY_USED | DAMAGED"
      - name: sealed
        type: boolean
        source: input
        description: "Whether the units are factory sealed; required for items with hygiene_sealed_required == true."
        default: false
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle state."
        default: RECEIVED
        constraints: "RECEIVED | INSPECTED | ACCEPTED | QUARANTINED | REMEDIATED | DISCARDED"
      - name: qty_accepted
        type: integer
        source: computed
        description: "Units credited to inventory when the batch reaches ACCEPTED; equals qty_declared minus qty_rejected."
        default: 0
      - name: qty_rejected
        type: integer
        source: system
        description: "Units written off at acceptance; supplied on the ACCEPTED transition and credited to InventoryPosition.damaged_qty."
        default: 0
      - name: hold_reason
        type: string
        source: system
        description: "Free-text reason recorded when the batch is quarantined; null otherwise."
        default: null

  - name: InventoryPosition
    parent: null
    common_fields: true
    fields:
      - name: drive_cycle_id
        type: string
        source: input
        description: "FK -> DriveCycle.id; positions are scoped per cycle."
      - name: supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; one position per (cycle, item) pair."
      - name: on_hand_qty
        type: integer
        source: computed
        description: "Units physically available and unreserved."
        default: 0
      - name: reserved_qty
        type: integer
        source: computed
        description: "Units reserved against CONFIRMED student registrations."
        default: 0
      - name: distributed_qty
        type: integer
        source: computed
        description: "Units handed to families on FULFILLED registrations."
        default: 0
      - name: damaged_qty
        type: integer
        source: computed
        description: "Units written off at batch acceptance or by a negative cycle-count adjustment."
        default: 0
      - name: accepted_donated_qty
        type: integer
        source: computed
        description: "Cumulative qty_declared over this item's ACCEPTED batches — every unit that entered the building, accepted or written off."
        default: 0
      - name: purchased_received_qty
        type: integer
        source: computed
        description: "Cumulative units credited by PurchaseOrder receipt."
        default: 0
      - name: adjustment_qty
        type: integer
        source: computed
        description: "Cumulative signed delta applied by warehouse cycle-count adjustments; the third source term of invariant item_conservation."
        default: 0
      - name: in_transit_qty
        type: integer
        source: computed
        description: "Sum of PurchaseOrder.ordered_qty for this (cycle, item) in status IN {SUBMITTED, APPROVED} plus DonationBatch.qty_declared for this item at this cycle's sites in status IN {RECEIVED, INSPECTED, REMEDIATED}. Counted only by the PROVISIONAL fill variant."
        default: 0

  - name: CashDonation
    parent: null
    common_fields: true
    fields:
      - name: drive_cycle_id
        type: string
        source: input
        description: "FK -> DriveCycle.id; the cycle the gift funds."
      - name: donor_name
        type: string
        source: input
        description: "Donor of record."
      - name: amount_cents
        type: integer
        source: input
        description: "Gift amount in cents."
        constraints: ">= 1"
      - name: restriction_type
        type: enum
        source: input
        description: "UNRESTRICTED funds anything; ITEM_RESTRICTED funds only purchase orders for restricted_supply_item_id; SCHOOL_RESTRICTED is reserved for a named school and can never fund a cycle-level purchase order."
        constraints: "UNRESTRICTED | ITEM_RESTRICTED | SCHOOL_RESTRICTED"
      - name: restricted_supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; required when restriction_type == ITEM_RESTRICTED, must be null otherwise."
        default: null
      - name: restricted_school_id
        type: string
        source: input
        description: "FK -> School.id; required when restriction_type == SCHOOL_RESTRICTED, must be null otherwise."
        default: null
      - name: allocated_cents
        type: integer
        source: computed
        description: "Cents drawn from this gift by purchase orders in status IN {SUBMITTED, APPROVED, RECEIVED}."
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "amount_cents - allocated_cents."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Derived from allocation: RECEIVED when allocated_cents == 0, PARTIALLY_ALLOCATED when 0 < allocated_cents < amount_cents, FULLY_ALLOCATED when allocated_cents == amount_cents."
        default: RECEIVED
        constraints: "RECEIVED | PARTIALLY_ALLOCATED | FULLY_ALLOCATED"

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: drive_cycle_id
        type: string
        source: input
        description: "FK -> DriveCycle.id; the cycle whose cash funds this order."
      - name: supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; one SKU per order."
      - name: requested_unit_gap
        type: integer
        source: input
        description: "Units of unfilled need the order is meant to close, before pack rounding."
        constraints: ">= 1"
      - name: ordered_qty
        type: integer
        source: computed
        description: "ceil(requested_unit_gap / bulk_pack_size) * bulk_pack_size; output of calculation purchase_order_costing."
        default: 0
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: "ordered_qty * SupplyItem.unit_cost_cents."
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Program administration fee: the per-pack fee is rounded to whole cents first and then summed over packs; the rate tier is keyed on line_subtotal_cents, never on total_cost_cents."
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: "line_subtotal_cents + admin_fee_cents; the amount the cash waterfall must fully cover."
        default: 0
      - name: funding_allocations
        type: array
        source: computed
        description: "Ordered list of { cash_donation_id, amount_cents } produced by the funding waterfall at SUBMITTED; replayed in reverse on cancellation to restore every gift exactly."
        default: []
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | RECEIVED | CANCELLED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who moved the order to SUBMITTED; the segregation-of-duties comparand at approval."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approving ProgramDirector."
        default: null

  - name: VolunteerEvent
    parent: null
    common_fields: true
    fields:
      - name: collection_site_id
        type: string
        source: input
        description: "FK -> CollectionSite.id; the site whose floor and bins the event occupies."
      - name: event_type
        type: enum
        source: input
        description: "SORTING triages donated stock; ASSEMBLY builds finished kits and therefore has a non-zero kit throughput rate."
        constraints: "SORTING | ASSEMBLY"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the occupation interval; intervals are half-open [window_start, window_end) and additionally guarded by SITE_TURNOVER_BUFFER_MINUTES on both sides."
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the occupation interval, exclusive."
      - name: volunteer_count
        type: integer
        source: input
        description: "Total volunteers expected, minors included."
        constraints: ">= 1"
      - name: minor_volunteer_count
        type: integer
        source: input
        description: "Volunteers under 18 among volunteer_count."
        default: 0
        constraints: "0 <= minor_volunteer_count <= volunteer_count"
      - name: adult_supervisor_count
        type: integer
        source: input
        description: "Adults designated as supervisors; subject to the MINORS_PER_SUPERVISOR safety ratio."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Event lifecycle state."
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: planned_kit_capacity
        type: integer
        source: computed
        description: "Output of calculation volunteer_assembly_throughput, pinned at creation."
        default: 0
      - name: assembled_kit_count
        type: integer
        source: system
        description: "Kits actually assembled, supplied on the COMPLETED transition; may not exceed planned_kit_capacity."
        default: 0

  - name: DistributionEvent
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the host school."
      - name: drive_cycle_id
        type: string
        source: input
        description: "FK -> DriveCycle.id; the cycle whose inventory the event draws on."
      - name: grade_band
        type: enum
        source: input
        description: "Grade band served; selects the school's PUBLISHED GradeKitSpec."
        constraints: "K_2 | G3_5 | G6_8 | G9_12"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start; DistributionEvent intervals are CLOSED [window_start, window_end], so two events that merely touch endpoints still overlap."
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end, inclusive."
      - name: seat_capacity
        type: integer
        source: input
        description: "Maximum number of CONFIRMED registrations."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Event lifecycle state."
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | LOCKED | CLOSED | CANCELLED"
      - name: provisional_fill_pct
        type: number
        source: computed
        description: "PROVISIONAL variant of calculation distribution_fill_projection, 2 decimal places; recomputed on publish and on every inventory movement while PUBLISHED."
        default: 0.00
      - name: final_fill_pct
        type: number
        source: computed
        description: "FINAL variant of calculation distribution_fill_projection, 2 decimal places; frozen at the LOCKED transition."
        default: 0.00
      - name: confirmed_count
        type: integer
        source: computed
        description: "Count of this event's registrations with eligibility_status == CONFIRMED."
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: "Count of this event's registrations with eligibility_status == WAITLISTED."
        default: 0
      - name: served_student_count
        type: integer
        source: computed
        description: "Count of this event's registrations with eligibility_status == FULFILLED."
        default: 0

  - name: StudentRegistration
    parent: null
    common_fields: true
    fields:
      - name: distribution_event_id
        type: string
        source: input
        description: "FK -> DistributionEvent.id; the event the student registered for."
      - name: student_reference
        type: string
        source: input
        description: "School-issued student reference; unique among non-WITHDRAWN registrations of the same event."
        constraints: "1..40 chars"
      - name: grade_band
        type: enum
        source: input
        description: "Student's grade band; must equal the event's grade_band."
        constraints: "K_2 | G3_5 | G6_8 | G9_12"
      - name: guardian_name
        type: string
        source: input
        description: "Registering guardian of record."
      - name: free_lunch_eligible
        type: boolean
        source: input
        description: "Free/reduced lunch status; either this or income_verified must hold for eligibility."
        default: false
      - name: income_verified
        type: boolean
        source: input
        description: "Household income documentation received."
        default: false
      - name: eligibility_status
        type: enum
        source: system
        description: "Registration lifecycle state."
        default: PENDING
        constraints: "PENDING | VERIFIED | CONFIRMED | WAITLISTED | FULFILLED | NO_SHOW | REJECTED | WITHDRAWN"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant the registration reached VERIFIED; primary sort key of the waitlist promotion order."
        default: null
      - name: reserved_unit_count
        type: integer
        source: computed
        description: "Total units currently reserved for this registration across all kit spec lines; zero unless eligibility_status == CONFIRMED."
        default: 0

  - name: TeacherRequest
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the requesting teacher's school."
      - name: drive_cycle_id
        type: string
        source: input
        description: "FK -> DriveCycle.id; the cycle whose supplemental budget the request draws on."
      - name: supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; the requested item."
      - name: teacher_name
        type: string
        source: input
        description: "Requesting teacher."
      - name: qty_requested
        type: integer
        source: input
        description: "Units requested."
        constraints: ">= 1"
      - name: justification
        type: string
        source: input
        description: "Classroom justification text."
      - name: request_cost_cents
        type: integer
        source: computed
        description: "qty_requested * SupplyItem.unit_cost_cents; charged against the cycle supplemental cap at approval."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Supplemental request lifecycle state."
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED | FULFILLED"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of approval; null until APPROVED."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- School: cyclic ACTIVE <-> SUSPENDED, terminal ARCHIVED -----------------
  - entity: School
    initial_state: PROSPECT
    terminal_states: [ARCHIVED]
    transitions:
      - from: PROSPECT
        to: MOU_PENDING
        trigger: "PATCH /schools/{id}/partnership-status with target_status=MOU_PENDING"
        actor: ProgramDirector
        preconditions: ["School.partnership_status == PROSPECT"]
        side_effects: ["School.updated_at refreshed", "School.version incremented by 1"]
      - from: MOU_PENDING
        to: ACTIVE
        trigger: "PATCH /schools/{id}/partnership-status with target_status=ACTIVE"
        actor: ProgramDirector
        preconditions:
          - "School.partnership_status == MOU_PENDING"
          - "School.max_concurrent_seats >= 1"
        side_effects: ["School.version incremented by 1"]
        note: "Only an ACTIVE school may publish a GradeKitSpec or a DistributionEvent."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /schools/{id}/partnership-status with target_status=SUSPENDED"
        actor: ProgramDirector
        preconditions: ["School.partnership_status == ACTIVE"]
        side_effects:
          - "CASCADE HOP 1: every DistributionEvent of this school with status IN {DRAFT, PUBLISHED} moves to CANCELLED (events in LOCKED, CLOSED or CANCELLED are untouched)."
          - "CASCADE HOP 2: caused by hop 1 — every StudentRegistration of each just-CANCELLED event with eligibility_status IN {PENDING, VERIFIED, CONFIRMED, WAITLISTED} moves to WITHDRAWN."
          - "CASCADE HOP 3: caused by hop 2 — for each registration that was CONFIRMED at hop 2, its reserved units are released: for every KitSpecLine of the event's PUBLISHED GradeKitSpec, InventoryPosition.reserved_qty -= qty_per_student and InventoryPosition.on_hand_qty += qty_per_student; the registration's reserved_unit_count becomes 0."
          - "CASCADE HOP 4: caused by hop 3 — DriveCycle.total_items_on_hand is recomputed for every cycle whose position changed."
          - "School.students_served_interim_count, students_served_audited_count, impact_index_interim and impact_index_audited are recomputed."
          - "School.version incremented by 1; every mutated DistributionEvent, StudentRegistration and InventoryPosition has its own version incremented by 1."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /schools/{id}/partnership-status with target_status=ACTIVE"
        actor: ProgramDirector
        preconditions: ["School.partnership_status == SUSPENDED"]
        side_effects:
          - "School.version incremented by 1"
        note: "Reactivation is NOT a compensation: events cancelled by the suspension cascade stay CANCELLED and withdrawn registrations stay WITHDRAWN."
      - from: ACTIVE
        to: ARCHIVED
        trigger: "PATCH /schools/{id}/partnership-status with target_status=ARCHIVED"
        actor: ProgramDirector
        preconditions:
          - "School.partnership_status IN {ACTIVE, SUSPENDED}"
          - "No DistributionEvent of this school has status IN {PUBLISHED, LOCKED}"
        side_effects:
          - "Every GradeKitSpec of this school with status == PUBLISHED moves to RETIRED; School.target_student_count recomputed to 0."
          - "School.version incremented by 1"
      - from: SUSPENDED
        to: ARCHIVED
        trigger: "PATCH /schools/{id}/partnership-status with target_status=ARCHIVED"
        actor: ProgramDirector
        preconditions:
          - "School.partnership_status IN {ACTIVE, SUSPENDED}"
          - "No DistributionEvent of this school has status IN {PUBLISHED, LOCKED}"
        side_effects:
          - "Every GradeKitSpec of this school with status == PUBLISHED moves to RETIRED; School.target_student_count recomputed to 0."
          - "School.version incremented by 1"

  # --- GradeKitSpec: linear with retire ---------------------------------------
  - entity: GradeKitSpec
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "PATCH /grade-kit-specs/{id}/status with target_status=PUBLISHED"
        actor: SchoolLiaison
        preconditions:
          - "GradeKitSpec.status == DRAFT"
          - "GradeKitSpec.line_count >= 1"
          - "School.partnership_status == ACTIVE for GradeKitSpec.school_id"
          - "No other GradeKitSpec with the same school_id and grade_band has status == PUBLISHED"
          - "Every KitSpecLine of the spec references a SupplyItem with catalog_active == true"
        side_effects:
          - "GradeKitSpec.kit_unit_cost_cents recomputed by calculation kit_unit_cost"
          - "School.target_student_count recomputed as the sum of student_target_count over the school's PUBLISHED specs"
          - "School.version incremented by 1; GradeKitSpec.version incremented by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "PATCH /grade-kit-specs/{id}/status with target_status=RETIRED"
        actor: SchoolLiaison
        preconditions:
          - "GradeKitSpec.status == PUBLISHED"
          - "No DistributionEvent for this school and grade_band has status IN {PUBLISHED, LOCKED}"
        side_effects:
          - "School.target_student_count recomputed over the remaining PUBLISHED specs"
          - "School.version incremented by 1; GradeKitSpec.version incremented by 1"

  # --- DriveCycle: cyclic, cadence-gated reopen -------------------------------
  - entity: DriveCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: COLLECTING
        trigger: "PATCH /drive-cycles/{id}/status with target_status=COLLECTING"
        actor: ProgramDirector
        preconditions: ["DriveCycle.status == DRAFT", "DriveCycle.window_start < DriveCycle.window_end"]
        side_effects: ["DriveCycle.version incremented by 1"]
      - from: COLLECTING
        to: SORTING
        trigger: "PATCH /drive-cycles/{id}/status with target_status=SORTING"
        actor: ProgramDirector
        preconditions: ["DriveCycle.status == COLLECTING"]
        side_effects:
          - "No DonationBatch may be created for this cycle's sites while status == SORTING"
          - "DriveCycle.version incremented by 1"
      - from: SORTING
        to: COLLECTING
        trigger: "PATCH /drive-cycles/{id}/status with target_status=COLLECTING"
        actor: ProgramDirector
        preconditions: ["DriveCycle.status == SORTING"]
        side_effects: ["DriveCycle.version incremented by 1"]
        note: "Reopen loop, available to both cadences."
      - from: SORTING
        to: DISTRIBUTION
        trigger: "PATCH /drive-cycles/{id}/status with target_status=DISTRIBUTION"
        actor: ProgramDirector
        preconditions:
          - "DriveCycle.status == SORTING"
          - "No DonationBatch of this cycle's sites is in status IN {RECEIVED, INSPECTED, REMEDIATED}"
        side_effects:
          - "Every InventoryPosition of the cycle is recomputed; DriveCycle.total_items_on_hand refreshed"
          - "DriveCycle.version incremented by 1"
      - from: DISTRIBUTION
        to: COLLECTING
        trigger: "PATCH /drive-cycles/{id}/status with target_status=COLLECTING"
        actor: ProgramDirector
        preconditions:
          - "DriveCycle.status == DISTRIBUTION"
          - "DriveCycle.cadence == YEAR_ROUND"
        side_effects: ["DriveCycle.version incremented by 1"]
        note: "Cadence-gated cycle: a BACK_TO_SCHOOL cycle may never return to COLLECTING from DISTRIBUTION and is rejected with ERR_CADENCE_FORBIDS_REOPEN."
      - from: DISTRIBUTION
        to: RECONCILED
        trigger: "PATCH /drive-cycles/{id}/status with target_status=RECONCILED"
        actor: ProgramDirector
        preconditions:
          - "DriveCycle.status == DISTRIBUTION"
          - "No DistributionEvent of this cycle has status IN {PUBLISHED, LOCKED}"
        side_effects:
          - "Every PurchaseOrder of this cycle in status == DRAFT moves to CANCELLED"
          - "impact_index_audited is recomputed for every School that hosted a CLOSED event of this cycle"
          - "DriveCycle.version incremented by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "PATCH /drive-cycles/{id}/status with target_status=CLOSED"
        actor: ProgramDirector
        preconditions:
          - "DriveCycle.status == RECONCILED"
          - "DriveCycle.cash_allocated_cents + DriveCycle.cash_available_cents == DriveCycle.cash_received_cents"
        side_effects: ["DriveCycle.version incremented by 1"]

  # --- CollectionSite dimension A: operational_status --------------------------
  - entity: CollectionSite
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "PATCH /collection-sites/{id}/operational-status with target_status=ACTIVE"
        actor: ProgramDirector
        preconditions:
          - "CollectionSite.operational_status == PENDING"
          - "DriveCycle.status IN {COLLECTING, SORTING} for CollectionSite.drive_cycle_id"
          - "If CollectionSite.site_type == CORPORATE then CollectionSite.pledge_status IN {PLEDGED, PLEDGE_ACTIVE}"
        side_effects: ["CollectionSite.version incremented by 1"]
        note: "Cross-dimension guard: the operational dimension reads the pledge dimension, but the two dimensions advance independently."
      - from: ACTIVE
        to: PAUSED
        trigger: "PATCH /collection-sites/{id}/operational-status with target_status=PAUSED"
        actor: ProgramDirector
        preconditions: ["CollectionSite.operational_status == ACTIVE"]
        side_effects:
          - "Every VolunteerEvent of this site with status == SCHEDULED moves to CANCELLED"
          - "CollectionSite.version incremented by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "PATCH /collection-sites/{id}/operational-status with target_status=ACTIVE"
        actor: ProgramDirector
        preconditions: ["CollectionSite.operational_status == PAUSED"]
        side_effects: ["CollectionSite.version incremented by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /collection-sites/{id}/operational-status with target_status=CLOSED"
        actor: ProgramDirector
        preconditions:
          - "CollectionSite.operational_status IN {ACTIVE, PAUSED}"
          - "No DonationBatch of this site is in status IN {RECEIVED, INSPECTED, REMEDIATED}"
        side_effects:
          - "If CollectionSite.site_type == CORPORATE and pledge_status == PLEDGE_ACTIVE and accepted_item_count < pledged_item_count then pledge_status moves to LAPSED"
          - "CollectionSite.version incremented by 1"
      - from: PAUSED
        to: CLOSED
        trigger: "PATCH /collection-sites/{id}/operational-status with target_status=CLOSED"
        actor: ProgramDirector
        preconditions:
          - "CollectionSite.operational_status IN {ACTIVE, PAUSED}"
          - "No DonationBatch of this site is in status IN {RECEIVED, INSPECTED, REMEDIATED}"
        side_effects:
          - "If CollectionSite.site_type == CORPORATE and pledge_status == PLEDGE_ACTIVE and accepted_item_count < pledged_item_count then pledge_status moves to LAPSED"
          - "CollectionSite.version incremented by 1"

  # --- CollectionSite dimension B: pledge_status (independent axis) ------------
  - entity: CollectionSite
    initial_state: NONE
    terminal_states: [FULFILLED, LAPSED]
    transitions:
      - from: NONE
        to: PLEDGED
        trigger: "PATCH /collection-sites/{id}/pledge-status with target_status=PLEDGED"
        actor: SiteCoordinator
        preconditions:
          - "CollectionSite.pledge_status == NONE"
          - "CollectionSite.site_type == CORPORATE"
          - "CollectionSite.pledged_item_count >= 1"
        side_effects: ["CollectionSite.version incremented by 1"]
        note: "Pledge advances regardless of operational_status; a PENDING site may already be PLEDGED."
      - from: PLEDGED
        to: PLEDGE_ACTIVE
        trigger: "PATCH /collection-sites/{id}/pledge-status with target_status=PLEDGE_ACTIVE"
        actor: SiteCoordinator
        preconditions:
          - "CollectionSite.pledge_status == PLEDGED"
          - "CollectionSite.operational_status == ACTIVE"
        side_effects: ["CollectionSite.version incremented by 1"]
      - from: PLEDGE_ACTIVE
        to: FULFILLED
        trigger: "PATCH /collection-sites/{id}/pledge-status with target_status=FULFILLED"
        actor: SiteCoordinator
        preconditions:
          - "CollectionSite.pledge_status == PLEDGE_ACTIVE"
          - "CollectionSite.accepted_item_count >= CollectionSite.pledged_item_count"
        side_effects: ["CollectionSite.version incremented by 1"]
      - from: PLEDGE_ACTIVE
        to: LAPSED
        trigger: "PATCH /collection-sites/{id}/pledge-status with target_status=LAPSED"
        actor: SiteCoordinator
        preconditions: ["CollectionSite.pledge_status == PLEDGE_ACTIVE"]
        side_effects: ["CollectionSite.version incremented by 1"]
      - from: PLEDGED
        to: LAPSED
        trigger: "PATCH /collection-sites/{id}/pledge-status with target_status=LAPSED"
        actor: SiteCoordinator
        preconditions: ["CollectionSite.pledge_status == PLEDGED"]
        side_effects: ["CollectionSite.version incremented by 1"]

  # --- DonationBatch: branching fork-join with divergent side effects ----------
  - entity: DonationBatch
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, DISCARDED]
    transitions:
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /donation-batches/{id}/transitions with target_status=INSPECTED"
        actor: SiteCoordinator
        preconditions:
          - "DonationBatch.status == RECEIVED"
          - "CollectionSite.operational_status == ACTIVE for DonationBatch.collection_site_id"
        side_effects:
          - "InventoryPosition.in_transit_qty for (cycle, item) is recomputed"
          - "DonationBatch.version incremented by 1"
      - from: INSPECTED
        to: ACCEPTED
        trigger: "POST /donation-batches/{id}/transitions with target_status=ACCEPTED and qty_rejected"
        actor: WarehouseLead
        preconditions:
          - "DonationBatch.status IN {INSPECTED, REMEDIATED}"
          - "DriveCycle.status IN {COLLECTING, SORTING} for the batch's site"
          - "0 <= qty_rejected <= DonationBatch.qty_declared"
          - "If SupplyItem.hygiene_sealed_required == true then DonationBatch.sealed == true AND DonationBatch.condition == NEW"
        side_effects:
          - "CASCADE HOP 1: DonationBatch.qty_accepted = qty_declared - qty_rejected; status becomes ACCEPTED."
          - "CASCADE HOP 2: caused by hop 1 — the (cycle, item) InventoryPosition is created if absent, then on_hand_qty += qty_accepted, accepted_donated_qty += qty_declared, damaged_qty += qty_rejected, in_transit_qty recomputed (so item_conservation still balances: the rejected units are counted once as received and once as damaged)."
          - "CASCADE HOP 3: caused by hop 2 — DriveCycle.total_items_on_hand recomputed; CollectionSite.accepted_item_count += qty_accepted."
          - "CASCADE HOP 4: caused by hop 3 — every DistributionEvent of that cycle with status == PUBLISHED whose grade band's PUBLISHED GradeKitSpec has a KitSpecLine for this item has provisional_fill_pct recomputed."
          - "CASCADE HOP 5: caused by hop 4 — on each such event, WAITLISTED registrations are promoted to CONFIRMED in order of verified_at ASC, tie-break created_at ASC, while confirmed_count < seat_capacity AND every KitSpecLine of the spec has on_hand_qty >= qty_per_student; each promotion reserves its units (on_hand_qty -= qty_per_student, reserved_qty += qty_per_student) and refreshes the event's confirmed_count / waitlist_count and the school's students_served_interim_count and impact_index_interim."
          - "Versions incremented by 1 on DonationBatch, InventoryPosition, DriveCycle, CollectionSite, and on every DistributionEvent, StudentRegistration and School mutated by hops 4-5."
      - from: REMEDIATED
        to: ACCEPTED
        trigger: "POST /donation-batches/{id}/transitions with target_status=ACCEPTED and qty_rejected"
        actor: WarehouseLead
        preconditions:
          - "DonationBatch.status IN {INSPECTED, REMEDIATED}"
          - "DriveCycle.status IN {COLLECTING, SORTING} for the batch's site"
          - "0 <= qty_rejected <= DonationBatch.qty_declared"
          - "If SupplyItem.hygiene_sealed_required == true then DonationBatch.sealed == true AND DonationBatch.condition == NEW"
        side_effects:
          - "Identical five-hop cascade as the INSPECTED -> ACCEPTED transition."
      - from: INSPECTED
        to: QUARANTINED
        trigger: "POST /donation-batches/{id}/transitions with target_status=QUARANTINED and hold_reason"
        actor: WarehouseLead
        preconditions: ["DonationBatch.status == INSPECTED"]
        side_effects:
          - "DonationBatch.hold_reason set from the request; NOTHING is credited to inventory."
          - "InventoryPosition.in_transit_qty for (cycle, item) is recomputed downward because QUARANTINED batches leave the in-transit set."
          - "Every PUBLISHED DistributionEvent of the cycle touching this item has provisional_fill_pct recomputed."
          - "DonationBatch.version incremented by 1"
        note: "Divergent branch: the ACCEPTED branch credits inventory and can promote waitlisted students; the QUARANTINED branch only removes in-transit expectation."
      - from: QUARANTINED
        to: REMEDIATED
        trigger: "POST /donation-batches/{id}/transitions with target_status=REMEDIATED"
        actor: WarehouseLead
        preconditions:
          - "DonationBatch.status == QUARANTINED"
          - "If SupplyItem.hygiene_sealed_required == true then DonationBatch.sealed == true AND DonationBatch.condition == NEW"
        side_effects:
          - "InventoryPosition.in_transit_qty recomputed upward; hold_reason cleared to null."
          - "DonationBatch.version incremented by 1"
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /donation-batches/{id}/transitions with target_status=DISCARDED"
        actor: WarehouseLead
        preconditions: ["DonationBatch.status == QUARANTINED"]
        side_effects:
          - "InventoryPosition.damaged_qty += DonationBatch.qty_declared and adjustment_qty += DonationBatch.qty_declared so item_conservation still balances."
          - "DonationBatch.version incremented by 1"

  # --- PurchaseOrder: forward path plus compensating cancel -------------------
  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /purchase-orders/{id}/transitions with target_status=SUBMITTED and expected_drive_cycle_version"
        actor: WarehouseLead | ProgramDirector
        preconditions:
          - "PurchaseOrder.status == DRAFT"
          - "DriveCycle.status IN {COLLECTING, SORTING, DISTRIBUTION}"
          - "expected_drive_cycle_version == DriveCycle.version"
          - "The funding waterfall of calculation purchase_funding_waterfall covers total_cost_cents in full"
        side_effects:
          - "PurchaseOrder.funding_allocations written as the ordered list produced by the waterfall; each referenced CashDonation.allocated_cents increased and its status recomputed."
          - "DriveCycle.cash_allocated_cents and cash_available_cents recomputed; DriveCycle.version incremented by 1."
          - "InventoryPosition.in_transit_qty for (cycle, item) increased by ordered_qty; every PUBLISHED DistributionEvent touching the item has provisional_fill_pct recomputed."
          - "PurchaseOrder.submitted_by_user_id set to the caller's X-User-ID; PurchaseOrder.version incremented by 1."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /purchase-orders/{id}/transitions with target_status=APPROVED and expected_drive_cycle_version"
        actor: ProgramDirector
        preconditions:
          - "PurchaseOrder.status == SUBMITTED"
          - "X-User-ID != PurchaseOrder.submitted_by_user_id"
          - "expected_drive_cycle_version == DriveCycle.version"
        side_effects:
          - "PurchaseOrder.approved_by_user_id set; PurchaseOrder.version incremented by 1; DriveCycle.version incremented by 1."
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /purchase-orders/{id}/transitions with target_status=RECEIVED and expected_drive_cycle_version"
        actor: WarehouseLead
        preconditions:
          - "PurchaseOrder.status == APPROVED"
          - "expected_drive_cycle_version == DriveCycle.version"
        side_effects:
          - "InventoryPosition.on_hand_qty += ordered_qty, purchased_received_qty += ordered_qty, in_transit_qty -= ordered_qty."
          - "DriveCycle.total_items_on_hand recomputed; DriveCycle.version incremented by 1."
          - "Every PUBLISHED DistributionEvent of the cycle touching the item has provisional_fill_pct recomputed and its waitlist promoted exactly as in the DonationBatch ACCEPTED cascade hop 5."
          - "PurchaseOrder.version incremented by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/transitions with target_status=CANCELLED and expected_drive_cycle_version"
        actor: ProgramDirector
        preconditions:
          - "PurchaseOrder.status IN {DRAFT, SUBMITTED, APPROVED}"
          - "expected_drive_cycle_version == DriveCycle.version"
        side_effects:
          - "COMPENSATION: PurchaseOrder.funding_allocations is replayed in reverse order; each entry's CashDonation.allocated_cents is decreased by exactly that entry's amount_cents and its status recomputed; funding_allocations is then emptied."
          - "InventoryPosition.in_transit_qty -= ordered_qty; PUBLISHED events touching the item have provisional_fill_pct recomputed."
          - "DriveCycle.cash_allocated_cents and cash_available_cents recomputed; DriveCycle.version incremented by 1; PurchaseOrder.version incremented by 1."
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/transitions with target_status=CANCELLED and expected_drive_cycle_version"
        actor: ProgramDirector
        preconditions:
          - "PurchaseOrder.status IN {DRAFT, SUBMITTED, APPROVED}"
          - "expected_drive_cycle_version == DriveCycle.version"
        side_effects:
          - "Identical compensation to the SUBMITTED -> CANCELLED transition."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/transitions with target_status=CANCELLED and expected_drive_cycle_version"
        actor: ProgramDirector
        preconditions:
          - "PurchaseOrder.status IN {DRAFT, SUBMITTED, APPROVED}"
          - "expected_drive_cycle_version == DriveCycle.version"
        side_effects:
          - "funding_allocations is empty, so no cash is restored; DriveCycle.version and PurchaseOrder.version each incremented by 1."

  # --- VolunteerEvent ---------------------------------------------------------
  - entity: VolunteerEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /volunteer-events/{id}/transitions with target_status=IN_PROGRESS"
        actor: SiteCoordinator
        preconditions:
          - "VolunteerEvent.status == SCHEDULED"
          - "CollectionSite.operational_status == ACTIVE"
        side_effects: ["VolunteerEvent.version incremented by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /volunteer-events/{id}/transitions with target_status=COMPLETED and assembled_kit_count"
        actor: SiteCoordinator
        preconditions:
          - "VolunteerEvent.status == IN_PROGRESS"
          - "0 <= assembled_kit_count <= VolunteerEvent.planned_kit_capacity"
        side_effects:
          - "VolunteerEvent.assembled_kit_count recorded; VolunteerEvent.version incremented by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /volunteer-events/{id}/transitions with target_status=CANCELLED"
        actor: SiteCoordinator
        preconditions: ["VolunteerEvent.status IN {SCHEDULED, IN_PROGRESS}"]
        side_effects:
          - "The event's interval stops blocking the site, so a later event may occupy the window."
          - "VolunteerEvent.version incremented by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /volunteer-events/{id}/transitions with target_status=CANCELLED"
        actor: SiteCoordinator
        preconditions: ["VolunteerEvent.status IN {SCHEDULED, IN_PROGRESS}"]
        side_effects:
          - "The event's interval stops blocking the site; VolunteerEvent.version incremented by 1"

  # --- DistributionEvent ------------------------------------------------------
  - entity: DistributionEvent
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /distribution-events/{id}/transitions with target_status=PUBLISHED"
        actor: SchoolLiaison
        preconditions:
          - "DistributionEvent.status == DRAFT"
          - "School.partnership_status == ACTIVE"
          - "A GradeKitSpec with status == PUBLISHED exists for (school_id, grade_band)"
          - "DriveCycle.status IN {COLLECTING, SORTING, DISTRIBUTION}"
          - "The closed interval [window_start, window_end] does not push the school over max_concurrent_seats"
        side_effects:
          - "provisional_fill_pct computed by the PROVISIONAL variant of distribution_fill_projection"
          - "DistributionEvent.version incremented by 1"
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /distribution-events/{id}/transitions with target_status=LOCKED"
        actor: SchoolLiaison
        preconditions:
          - "DistributionEvent.status == PUBLISHED"
          - "DriveCycle.status == DISTRIBUTION"
        side_effects:
          - "final_fill_pct computed by the FINAL variant of distribution_fill_projection and frozen"
          - "No further StudentRegistration may be created for the event"
          - "School.impact_index_interim recomputed; DistributionEvent.version incremented by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /distribution-events/{id}/transitions with target_status=CLOSED"
        actor: SchoolLiaison
        preconditions: ["DistributionEvent.status == LOCKED"]
        side_effects:
          - "CASCADE HOP 1: every registration of the event still in eligibility_status == CONFIRMED moves to NO_SHOW, processed in order verified_at ASC, tie-break created_at ASC."
          - "CASCADE HOP 2: caused by hop 1 — each such registration releases its reservation: for every KitSpecLine, InventoryPosition.reserved_qty -= qty_per_student and on_hand_qty += qty_per_student; reserved_unit_count becomes 0."
          - "CASCADE HOP 3: caused by hop 2 — DriveCycle.total_items_on_hand recomputed and School.no_show_count, students_served_interim_count, students_served_audited_count, impact_index_interim and impact_index_audited recomputed by the AUDITED variant."
          - "Every registration still in eligibility_status IN {PENDING, VERIFIED, WAITLISTED} moves to WITHDRAWN (no reservation to release)."
          - "DistributionEvent.served_student_count refreshed; versions incremented by 1 on the event, every mutated registration, InventoryPosition, DriveCycle and School."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /distribution-events/{id}/transitions with target_status=CANCELLED"
        actor: SchoolLiaison
        preconditions: ["DistributionEvent.status IN {DRAFT, PUBLISHED}"]
        side_effects:
          - "Every registration in eligibility_status IN {PENDING, VERIFIED, CONFIRMED, WAITLISTED} moves to WITHDRAWN; CONFIRMED ones release their reservations exactly as in the CLOSED cascade hop 2."
          - "DistributionEvent.version incremented by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /distribution-events/{id}/transitions with target_status=CANCELLED"
        actor: SchoolLiaison
        preconditions: ["DistributionEvent.status IN {DRAFT, PUBLISHED}"]
        side_effects:
          - "Identical withdrawal-and-release cascade to the DRAFT -> CANCELLED transition."

  # --- StudentRegistration: cyclic CONFIRMED <-> WAITLISTED -------------------
  - entity: StudentRegistration
    initial_state: PENDING
    terminal_states: [FULFILLED, NO_SHOW, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /student-registrations/{id}/transitions with target_status=VERIFIED and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status == PENDING"
          - "DistributionEvent.status == PUBLISHED"
          - "StudentRegistration.free_lunch_eligible == true OR StudentRegistration.income_verified == true"
          - "expected_distribution_event_version == DistributionEvent.version"
        side_effects:
          - "verified_at stamped with the current logical clock"
          - "DistributionEvent.version incremented by 1; StudentRegistration.version incremented by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /student-registrations/{id}/transitions with target_status=REJECTED and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status == PENDING"
          - "expected_distribution_event_version == DistributionEvent.version"
        side_effects: ["DistributionEvent.version incremented by 1; StudentRegistration.version incremented by 1"]
      - from: VERIFIED
        to: CONFIRMED
        trigger: "POST /student-registrations/{id}/transitions with target_status=CONFIRMED and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status IN {VERIFIED, WAITLISTED}"
          - "DistributionEvent.status == PUBLISHED"
          - "DistributionEvent.confirmed_count < DistributionEvent.seat_capacity"
          - "For every KitSpecLine of the event's PUBLISHED GradeKitSpec, InventoryPosition.on_hand_qty >= qty_per_student"
          - "expected_distribution_event_version == DistributionEvent.version"
        side_effects:
          - "FORWARD LEG of item_conservation: for every KitSpecLine, InventoryPosition.on_hand_qty -= qty_per_student and reserved_qty += qty_per_student."
          - "reserved_unit_count = sum of qty_per_student over the spec's lines"
          - "DistributionEvent.confirmed_count and waitlist_count refreshed; School.students_served_interim_count and impact_index_interim recomputed"
          - "DistributionEvent.version incremented by 1; StudentRegistration, InventoryPosition and School versions incremented by 1"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "POST /student-registrations/{id}/transitions with target_status=CONFIRMED and expected_distribution_event_version, or the promotion sweep of an inventory-crediting cascade"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status IN {VERIFIED, WAITLISTED}"
          - "DistributionEvent.status == PUBLISHED"
          - "DistributionEvent.confirmed_count < DistributionEvent.seat_capacity"
          - "For every KitSpecLine of the event's PUBLISHED GradeKitSpec, InventoryPosition.on_hand_qty >= qty_per_student"
          - "expected_distribution_event_version == DistributionEvent.version when triggered by the API"
        side_effects:
          - "Identical reservation side effects to the VERIFIED -> CONFIRMED transition."
      - from: VERIFIED
        to: WAITLISTED
        trigger: "POST /student-registrations/{id}/transitions with target_status=WAITLISTED and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status IN {VERIFIED, CONFIRMED}"
          - "DistributionEvent.status == PUBLISHED"
          - "expected_distribution_event_version == DistributionEvent.version"
        side_effects:
          - "DistributionEvent.waitlist_count refreshed; versions incremented by 1"
      - from: CONFIRMED
        to: WAITLISTED
        trigger: "POST /student-registrations/{id}/transitions with target_status=WAITLISTED and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status IN {VERIFIED, CONFIRMED}"
          - "DistributionEvent.status == PUBLISHED"
          - "expected_distribution_event_version == DistributionEvent.version"
        side_effects:
          - "COMPENSATING LEG of item_conservation: for every KitSpecLine, InventoryPosition.reserved_qty -= qty_per_student and on_hand_qty += qty_per_student; reserved_unit_count becomes 0."
          - "DistributionEvent.confirmed_count and waitlist_count refreshed; School.students_served_interim_count and impact_index_interim recomputed"
          - "DriveCycle.total_items_on_hand recomputed; versions incremented by 1 on the registration, event, position, cycle and school"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /student-registrations/{id}/transitions with target_status=FULFILLED and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status == CONFIRMED"
          - "DistributionEvent.status IN {PUBLISHED, LOCKED}"
          - "expected_distribution_event_version == DistributionEvent.version"
        side_effects:
          - "For every KitSpecLine, InventoryPosition.reserved_qty -= qty_per_student and distributed_qty += qty_per_student; reserved_unit_count becomes 0."
          - "DistributionEvent.served_student_count and confirmed_count refreshed; School.students_served_audited_count, kits_delivered_count, impact_index_interim and impact_index_audited recomputed"
          - "versions incremented by 1 on the registration, event, position and school"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /student-registrations/{id}/transitions with target_status=NO_SHOW and expected_distribution_event_version, or the CLOSED cascade of the event"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status == CONFIRMED"
          - "DistributionEvent.status IN {PUBLISHED, LOCKED}"
          - "expected_distribution_event_version == DistributionEvent.version when triggered by the API"
        side_effects:
          - "Reservation released back to on_hand exactly as in the CONFIRMED -> WAITLISTED compensation."
          - "School.no_show_count and impact_index_audited recomputed; versions incremented by 1"
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /student-registrations/{id}/transitions with target_status=WITHDRAWN and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status IN {PENDING, VERIFIED, CONFIRMED, WAITLISTED}"
          - "expected_distribution_event_version == DistributionEvent.version when triggered by the API"
        side_effects:
          - "If the registration was CONFIRMED its reservation is released; DistributionEvent counters and School aggregates refreshed; versions incremented by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /student-registrations/{id}/transitions with target_status=WITHDRAWN and expected_distribution_event_version"
        actor: SchoolLiaison
        preconditions:
          - "StudentRegistration.eligibility_status IN {PENDING, VERIFIED, CONFIRMED, WAITLISTED}"
          - "expected_distribution_event_version == DistributionEvent.version when triggered by the API"
        side_effects:
          - "Reservation released back to on_hand; counters and aggregates refreshed; versions incremented by 1"

  # --- TeacherRequest ---------------------------------------------------------
  - entity: TeacherRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, FULFILLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /teacher-requests/{id}/transitions with target_status=APPROVED"
        actor: ProgramDirector
        preconditions:
          - "TeacherRequest.status == SUBMITTED"
          - "School.partnership_status == ACTIVE"
          - "DriveCycle.status IN {COLLECTING, SORTING, DISTRIBUTION}"
          - "approved_spend_cents + request_cost_cents <= DriveCycle.supplemental_cap_cents"
          - "When the cycle has at least SCHOOL_SUBCAP_MIN_PARTNERS schools with partnership_status == ACTIVE, the school's approved spend must also stay within floor(supplemental_cap_cents * SCHOOL_SHARE_CAP_PCT)"
        side_effects:
          - "approved_at stamped with the current logical clock; TeacherRequest.version incremented by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /teacher-requests/{id}/transitions with target_status=DENIED"
        actor: ProgramDirector
        preconditions: ["TeacherRequest.status == SUBMITTED"]
        side_effects: ["TeacherRequest.version incremented by 1"]
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /teacher-requests/{id}/transitions with target_status=FULFILLED"
        actor: WarehouseLead
        preconditions:
          - "TeacherRequest.status == APPROVED"
          - "InventoryPosition.on_hand_qty >= qty_requested for (drive_cycle_id, supply_item_id)"
        side_effects:
          - "InventoryPosition.on_hand_qty -= qty_requested and distributed_qty += qty_requested"
          - "DriveCycle.total_items_on_hand recomputed; versions incremented by 1 on the request, position and cycle"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: registration-transition-stale-event
    parent_entity: DistributionEvent
    write_endpoint: "POST /student-registrations/{id}/transitions"
    occ_field: "expected_distribution_event_version"
    description: |
      A registration transition carrying a DistributionEvent version older than
      the event's current version is rejected. Seat capacity, waitlist order and
      the provisional fill projection all live on the event, so a client whose
      view of the event is stale may be asking for a seat that a previously
      committed transition already took, or asking against a fill projection
      that an inventory cascade has since moved.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

  - rule_id: purchase-order-transition-stale-cycle
    parent_entity: DriveCycle
    write_endpoint: "POST /purchase-orders/{id}/transitions"
    occ_field: "expected_drive_cycle_version"
    description: |
      A purchase-order transition carrying a DriveCycle version older than the
      cycle's current version is rejected. The cash waterfall draws from the
      cycle's donation pool, so a stale view of the cycle means the caller is
      allocating against balances another committed order has already drawn
      down.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: kit_unit_cost
    trigger: "On KitSpecLine create/delete and on the GradeKitSpec DRAFT -> PUBLISHED transition; writes GradeKitSpec.kit_unit_cost_cents and GradeKitSpec.line_count."
    algorithm: aggregation
    formula: |
      kit_unit_cost_cents = SUM over every KitSpecLine L of this GradeKitSpec
                            ( L.qty_per_student * SupplyItem[L.supply_item_id].unit_cost_cents )
      line_count          = COUNT of those KitSpecLine rows
      # All lines of the spec participate; KitSpecLine has no status field, so
      # there is no state filter. A spec with zero lines yields 0.
    input_set: "Every KitSpecLine whose grade_kit_spec_id equals this spec's id, ordered by created_at ASC (order is irrelevant: integer addition only)."
    constants: {}
    precision: "Integer cents; no rounding occurs because every term is an integer product."

  - name: distribution_fill_projection
    trigger: "PROVISIONAL runs on the DistributionEvent DRAFT -> PUBLISHED transition and again on every inventory movement that touches an item of the event's kit spec while the event is PUBLISHED; FINAL runs once, on the PUBLISHED -> LOCKED transition."
    algorithm: threshold
    formula: |
      SPEC   = the GradeKitSpec with status == PUBLISHED for (event.school_id, event.grade_band)
      LINES  = every KitSpecLine of SPEC
      N      = headcount of the variant's registration set (see variants)
      For each line L in LINES:
        AVAIL(L) = available_units(L.supply_item_id) per the variant
        COVER(L) = floor( AVAIL(L) / L.qty_per_student )
      coverable_students = MIN over L in LINES of COVER(L)      # a kit needs every line
      served_projection  = MIN(coverable_students, N)
      IF N == 0: fill_pct = 0.00                                # empty-set boundary, never a division
      ELSE:      fill_pct = round_half_up( 100 * served_projection / N, 2 )
    input_set: |
      LINES comes only from the PUBLISHED spec; RETIRED and DRAFT specs are excluded.
      Registration sets are pinned per variant below. InventoryPosition rows are
      selected by (event.drive_cycle_id, line.supply_item_id); a missing position
      counts as all-zero.
    constants: {}
    precision: "2 decimal places, round_half_up, on the percentage value (not on the ratio)."
    variants:
      - name: PROVISIONAL
        when: "Written to DistributionEvent.provisional_fill_pct at PUBLISH and on every subsequent inventory movement while the event is PUBLISHED."
        difference: |
          AVAIL(L) = InventoryPosition.on_hand_qty + InventoryPosition.in_transit_qty
                     (in_transit_qty covers PurchaseOrders in {SUBMITTED, APPROVED} and
                      DonationBatches in {RECEIVED, INSPECTED, REMEDIATED}).
          N = COUNT of the event's registrations with eligibility_status IN
              {PENDING, VERIFIED, CONFIRMED, WAITLISTED}.
      - name: FINAL
        when: "Written to DistributionEvent.final_fill_pct at the PUBLISHED -> LOCKED transition and never recomputed afterwards."
        difference: |
          AVAIL(L) = InventoryPosition.on_hand_qty only; in-transit expectation is
          discarded entirely.
          N = COUNT of the event's registrations with eligibility_status IN
              {VERIFIED, CONFIRMED}; PENDING and WAITLISTED registrations drop out.

  - name: school_impact_index
    trigger: "Recomputed on every StudentRegistration transition into or out of {CONFIRMED, FULFILLED, NO_SHOW}, on the DistributionEvent PUBLISHED -> LOCKED and LOCKED -> CLOSED transitions, on the School ACTIVE -> SUSPENDED cascade, and on the DriveCycle DISTRIBUTION -> RECONCILED transition; writes School.impact_index_interim and School.impact_index_audited."
    algorithm: weighted_scoring
    formula: |
      TARGET       = School.target_student_count
      served_ratio = MIN(1.0, served_count / MAX(1, TARGET))
      fill_quality = 0.0 when the variant's event set is empty, otherwise
                     ( SUM over events E in the variant's set of (E.<variant fill field> / 100) )
                     / COUNT(events in the set)
      equity_weight = School.title_i_pct
      base = IMPACT_W_SERVED * served_ratio
           + IMPACT_W_FILL   * fill_quality
           + IMPACT_W_EQUITY * equity_weight
      index = round_half_up( 100 * base * penalty_multiplier, 2 )
      # Rounding order is pinned: fill_quality consumes the ALREADY-ROUNDED
      # stored percentage field divided by 100 (never a freshly recomputed
      # unrounded ratio); base and the penalty multiply at full precision; the
      # single round_half_up happens once, last, on the 0..100 index value.
    input_set: "Only DistributionEvents whose school_id is this school; the status filter and the fill field differ per variant. Registrations are counted across all of the school's events."
    constants:
      IMPACT_W_SERVED: 0.55
      IMPACT_W_FILL: 0.30
      IMPACT_W_EQUITY: 0.15
      NO_SHOW_PENALTY: 0.5
    precision: "2 decimal places, round_half_up, applied once at the end."
    variants:
      - name: INTERIM
        when: "Written to School.impact_index_interim; the operations dashboard number, available while events are still running."
        difference: |
          served_count = School.students_served_interim_count (registrations in
          {CONFIRMED, FULFILLED}).
          Event set = the school's events with status IN {PUBLISHED, LOCKED, CLOSED};
          fill field = provisional_fill_pct.
          penalty_multiplier = 1.0 (no no-show penalty).
      - name: AUDITED
        when: "Written to School.impact_index_audited; the funder-facing number."
        difference: |
          served_count = School.students_served_audited_count (registrations in
          {FULFILLED} only).
          Event set = the school's events with status == CLOSED; fill field =
          final_fill_pct.
          penalty_multiplier = 1 - NO_SHOW_PENALTY * no_show_rate, where
          no_show_rate = no_show_count / MAX(1, no_show_count + students_served_audited_count).

  - name: volunteer_assembly_throughput
    trigger: "Runs once on POST /volunteer-events, writing VolunteerEvent.planned_kit_capacity; never recomputed afterwards."
    algorithm: threshold
    formula: |
      duration_hours = (window_end - window_start) in hours, exact rational value
      base_rate      = KITS_PER_VOLUNTEER_HOUR_ASSEMBLY when event_type == ASSEMBLY
                       else KITS_PER_VOLUNTEER_HOUR_SORTING
      fatigue_factor = 1.0 when duration_hours <= FATIGUE_FREE_HOURS
                       else MAX( FATIGUE_FLOOR,
                                 1.0 - FATIGUE_STEP * ceil(duration_hours - FATIGUE_FREE_HOURS) )
      volunteer_cap  = floor( volunteer_count * base_rate * duration_hours * fatigue_factor )
      station_cap    = CollectionSite.bin_capacity * BINS_TO_KITS
      open_kit_demand = SUM over DistributionEvent E of the site's drive_cycle_id
                        with E.status IN {DRAFT, PUBLISHED}
                        of ( E.seat_capacity - E.served_student_count )
      planned_kit_capacity = MIN( volunteer_cap, station_cap, open_kit_demand )
      # Three interacting inputs with two nested minima and a conditional branch
      # on event_type; a SORTING event always yields 0 because base_rate is 0.
    input_set: "volunteer_count and the window come from the request; bin_capacity from the site; open_kit_demand from DistributionEvents of the same drive cycle in status DRAFT or PUBLISHED only (LOCKED, CLOSED and CANCELLED events are excluded)."
    constants:
      KITS_PER_VOLUNTEER_HOUR_ASSEMBLY: 6
      KITS_PER_VOLUNTEER_HOUR_SORTING: 0
      FATIGUE_FREE_HOURS: 4
      FATIGUE_STEP: 0.05
      FATIGUE_FLOOR: 0.70
      BINS_TO_KITS: 12
    precision: "Integer kits; floor is applied to volunteer_cap before the minima, never after."

  - name: purchase_order_costing
    trigger: "Runs on POST /purchase-orders, writing ordered_qty, line_subtotal_cents, admin_fee_cents and total_cost_cents; the values are frozen for the life of the order."
    algorithm: tiered_pricing
    formula: |
      packs               = ceil( requested_unit_gap / SupplyItem.bulk_pack_size )
      ordered_qty         = packs * SupplyItem.bulk_pack_size
      line_subtotal_cents = ordered_qty * SupplyItem.unit_cost_cents
      # PINNED EVALUATION ORDER — the fee tier is selected from the SUBTOTAL,
      # never from total_cost_cents. Reading the tier off the total is the
      # circular reading and is wrong: total depends on the fee, which depends
      # on the tier.
      admin_rate = ADMIN_RATE_LOW  when line_subtotal_cents <= ADMIN_TIER_1_CENTS
                   ADMIN_RATE_MID  when ADMIN_TIER_1_CENTS < line_subtotal_cents <= ADMIN_TIER_2_CENTS
                   ADMIN_RATE_HIGH when line_subtotal_cents > ADMIN_TIER_2_CENTS
      pack_cost_cents  = SupplyItem.bulk_pack_size * SupplyItem.unit_cost_cents
      pack_fee_cents   = round_half_up( pack_cost_cents * admin_rate )   # rounded HERE, PER PACK
      admin_fee_cents  = packs * pack_fee_cents                          # ...THEN summed over packs
      total_cost_cents = line_subtotal_cents + admin_fee_cents
      # ROUNDING ORDER IS PINNED: round the per-pack fee to whole cents first
      # and sum the rounded per-pack fees. Rounding the whole-line fee once
      # (round_half_up(line_subtotal_cents * admin_rate)) is a different and
      # rejected reading: for bulk_pack_size 3 at 175 cents with 7 packs it
      # yields 331 instead of 329.
    input_set: "requested_unit_gap from the request; bulk_pack_size and unit_cost_cents from the referenced SupplyItem at creation time."
    constants:
      ADMIN_TIER_1_CENTS: 50000
      ADMIN_TIER_2_CENTS: 200000
      ADMIN_RATE_LOW: 0.09
      ADMIN_RATE_MID: 0.07
      ADMIN_RATE_HIGH: 0.05
    precision: "Whole cents, round_half_up, applied to admin_fee_cents only."

  - name: purchase_funding_waterfall
    trigger: "Runs on the PurchaseOrder DRAFT -> SUBMITTED transition; writes PurchaseOrder.funding_allocations and every touched CashDonation.allocated_cents, and is replayed in reverse on any transition to CANCELLED."
    algorithm: waterfall_allocation
    formula: |
      remaining = PurchaseOrder.total_cost_cents
      BUCKET 1 = CashDonation rows of this drive_cycle_id with
                 restriction_type == ITEM_RESTRICTED
                 AND restricted_supply_item_id == PurchaseOrder.supply_item_id
                 AND available_cents > 0, ordered by created_at ASC
      BUCKET 2 = CashDonation rows of this drive_cycle_id with
                 restriction_type == UNRESTRICTED AND available_cents > 0,
                 ordered by created_at ASC
      # SCHOOL_RESTRICTED gifts are never eligible: a purchase order is a
      # cycle-level object with no beneficiary school.
      FOR bucket IN [BUCKET 1, BUCKET 2]:
        FOR donation IN bucket:                       # created_at ASC, oldest gift drains first
          IF remaining == 0: STOP
          take = MIN(remaining, donation.available_cents)
          append { cash_donation_id: donation.id, amount_cents: take } to funding_allocations
          donation.allocated_cents += take ; remaining -= take
      IF remaining > 0 AFTER both buckets: the transition is rejected with
         ERR_INSUFFICIENT_FUNDS and NOTHING is written.
    input_set: "Only CashDonation rows of the same drive_cycle_id with available_cents > 0. Ordering is bucket first (item-restricted before unrestricted), then created_at ASC within a bucket; created_at is the only tie-break and entity ids are never consulted."
    constants: {}
    precision: "Whole cents; every take is an exact integer minimum, so no rounding occurs."

  - name: teacher_supplemental_budget
    trigger: "supplemental_cap_cents is recomputed on every CashDonation create for the cycle; the cap comparison runs on the TeacherRequest SUBMITTED -> APPROVED transition."
    algorithm: threshold
    formula: |
      supplemental_cap_cents = floor( DriveCycle.unrestricted_gross_cents * SUPPLEMENTAL_CAP_PCT )
      request_cost_cents     = TeacherRequest.qty_requested * SupplyItem.unit_cost_cents
      approved_spend_cents   = SUM of request_cost_cents over this cycle's TeacherRequest rows
                               with status IN {APPROVED, FULFILLED}
      # BOUNDARY IS INCLUSIVE: equality is allowed, only a strict overshoot fails.
      cycle_ok = ( approved_spend_cents + request_cost_cents <= supplemental_cap_cents )
      active_partner_count = COUNT of School rows with partnership_status == ACTIVE
                             that have at least one PUBLISHED GradeKitSpec
      IF active_partner_count >= SCHOOL_SUBCAP_MIN_PARTNERS:
        school_cap_cents   = floor( supplemental_cap_cents * SCHOOL_SHARE_CAP_PCT )
        school_spend_cents = SUM of request_cost_cents over this cycle's TeacherRequest rows
                             with the same school_id and status IN {APPROVED, FULFILLED}
        school_ok = ( school_spend_cents + request_cost_cents <= school_cap_cents )
      ELSE:
        school_ok = true            # conditional rule: the per-school sub-cap is dormant
    input_set: "unrestricted_gross_cents counts CashDonation.amount_cents (gross, never net of allocation) for restriction_type == UNRESTRICTED. approved_spend counts only APPROVED and FULFILLED requests; SUBMITTED and DENIED requests never consume budget."
    constants:
      SUPPLEMENTAL_CAP_PCT: 0.15
      SCHOOL_SHARE_CAP_PCT: 0.40
      SCHOOL_SUBCAP_MIN_PARTNERS: 3
    precision: "Whole cents; floor (not round) on both caps."

  - name: item_conservation
    trigger: "Asserted after every mutation of any InventoryPosition — batch acceptance/discard, purchase receipt, cycle-count adjustment, and every registration reserve/release/fulfil leg."
    algorithm: aggregation
    formula: |
      FOR each InventoryPosition P:
        on_hand_qty + reserved_qty + distributed_qty + damaged_qty
          == accepted_donated_qty + purchased_received_qty + adjustment_qty
      # Conserved quantity: PHYSICAL UNITS of one SKU inside one drive cycle.
      # The CONFIRMED reservation leg and its WAITLISTED / NO_SHOW / WITHDRAWN
      # release leg move units between on_hand_qty and reserved_qty and must
      # leave both sides of the identity untouched.
    input_set: "One identity per InventoryPosition row; positions of other cycles are independent."
    constants: {}
    precision: "Exact integers; no tolerance."

  - name: cash_conservation
    trigger: "Asserted after every CashDonation create and after every PurchaseOrder transition that allocates or restores funds."
    algorithm: aggregation
    formula: |
      FOR each DriveCycle C:
        cash_received_cents  == SUM over C's CashDonation of amount_cents
        cash_allocated_cents == SUM over C's CashDonation of allocated_cents
                             == SUM over C's PurchaseOrder with status IN
                                {SUBMITTED, APPROVED, RECEIVED} of total_cost_cents
        cash_available_cents == cash_received_cents - cash_allocated_cents
      # Conserved quantity: CENTS of donated cash inside one drive cycle.
      # Submitting an order and cancelling it must return every gift to the
      # exact allocated_cents it held before, gift by gift.
    input_set: "Every CashDonation of the cycle regardless of restriction_type; PurchaseOrders in DRAFT and CANCELLED contribute nothing."
    constants: {}
    precision: "Exact integer cents; no tolerance."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing rule decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body shape: every required field present, enum values inside their declared set, integers within their declared ranges, ISO 8601 datetimes parseable, window_start < window_end, pagination limit within 1..100 and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every {id} in the path resolves, validated left to right."
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_SUPPLY_ITEM_NOT_FOUND | ERR_KIT_SPEC_NOT_FOUND | ERR_DRIVE_CYCLE_NOT_FOUND | ERR_COLLECTION_SITE_NOT_FOUND | ERR_DONATION_BATCH_NOT_FOUND | ERR_INVENTORY_POSITION_NOT_FOUND | ERR_CASH_DONATION_NOT_FOUND | ERR_PURCHASE_ORDER_NOT_FOUND | ERR_VOLUNTEER_EVENT_NOT_FOUND | ERR_DISTRIBUTION_EVENT_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_TEACHER_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "every path carrying an {id}"

  - priority: 5
    category: existence
    check: "Every foreign key in the request body resolves, validated in the field order declared by the endpoint's input list."
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_SUPPLY_ITEM_NOT_FOUND | ERR_KIT_SPEC_NOT_FOUND | ERR_DRIVE_CYCLE_NOT_FOUND | ERR_COLLECTION_SITE_NOT_FOUND | ERR_DISTRIBUTION_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "every POST carrying a foreign key"

  - priority: 6
    category: auth
    check: "Scope ownership for entity-backed roles: a SchoolLiaison's X-User-ID must equal the School.id the resource belongs to."
    error_id: ERR_SCHOOL_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /grade-kit-specs, PATCH /grade-kit-specs/{id}/status, POST /kit-spec-lines, POST /distribution-events, POST /distribution-events/{id}/transitions, POST /student-registrations, POST /student-registrations/{id}/transitions, POST /teacher-requests"

  - priority: 7
    category: auth
    check: "Scope ownership for entity-backed roles: a SiteCoordinator's X-User-ID must equal the CollectionSite.id the resource belongs to."
    error_id: ERR_SITE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "PATCH /collection-sites/{id}/pledge-status, POST /donation-batches, POST /donation-batches/{id}/transitions, POST /volunteer-events, POST /volunteer-events/{id}/transitions"

  - priority: 8
    category: auth
    check: "Segregation of duties: the X-User-ID approving a PurchaseOrder differs from PurchaseOrder.submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /purchase-orders/{id}/transitions with target_status=APPROVED"

  - priority: 9
    category: state
    check: |
      The requested transition is declared in §1.2 from the entity's current state (including
      target_status being a legal member of that entity's enum). On a registration transition the
      two state checks are ordered: the registration's own from-state is checked first and fails
      with ERR_INVALID_REGISTRATION_STATE; only if that passes is the governing DistributionEvent's
      status precondition checked, failing with ERR_INVALID_EVENT_STATE.
      SCOPE LIMIT (resolves every overlap with the business rules below): a §1.2 precondition that a
      §1.4 rule of priority >= 11 also states — hygiene sealing, volunteer supervision, school
      partnership, published-spec existence, catalog activity, cycle phase on the endpoints listed at
      priority 16, cadence reopen, window containment, registration lead time, site overlap, school
      throughput, uniqueness, grade band, eligibility, seat capacity, assembly ceiling, pledge
      completion, inventory coverage, cash restriction, funding coverage and the two supplemental
      caps — is NOT reported here; it is deferred to that rule's own priority and error id. Priority 9
      covers the entity's own from-state legality plus the guards no later rule names, namely the
      DriveCycle-phase guard on collection-site activation and the CORPORATE pledge guard
      (ERR_INVALID_SITE_STATE), the open-batch and live-event guards on the DriveCycle transitions and
      the cash-balance identity guard on CLOSED (ERR_INVALID_CYCLE_STATE), the line_count >= 1 and
      band-in-use guards on GradeKitSpec (ERR_INVALID_SPEC_STATE), and the live-event guard on School
      archival (ERR_INVALID_SCHOOL_STATE).
    error_id: "ERR_INVALID_SCHOOL_STATE | ERR_INVALID_SPEC_STATE | ERR_INVALID_CYCLE_STATE | ERR_INVALID_SITE_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_ORDER_STATE | ERR_INVALID_EVENT_STATE | ERR_INVALID_REGISTRATION_STATE | ERR_INVALID_TEACHER_REQUEST_STATE"
    http_status: 409
    applies_to: "every transition endpoint"

  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_distribution_event_version equals DistributionEvent.version / expected_drive_cycle_version equals DriveCycle.version."
    error_id: "ERR_STALE_EVENT_VERSION | ERR_STALE_CYCLE_VERSION"
    http_status: 412
    applies_to: "POST /student-registrations/{id}/transitions, POST /purchase-orders/{id}/transitions"

  - priority: 11
    category: business_safety
    check: "Hygiene safety: a SupplyItem with hygiene_sealed_required == true may only reach batch status ACCEPTED or REMEDIATED when the batch has sealed == true and condition == NEW."
    error_id: ERR_UNSAFE_ITEM_CONDITION
    http_status: 422
    applies_to: "POST /donation-batches/{id}/transitions"

  - priority: 12
    category: business_safety
    check: "Volunteer supervision ratio: adult_supervisor_count >= ceil(minor_volunteer_count / MINORS_PER_SUPERVISOR), with MINORS_PER_SUPERVISOR = 8."
    error_id: ERR_SUPERVISION_RATIO_UNMET
    http_status: 422
    applies_to: "POST /volunteer-events"

  - priority: 13
    category: business_referential
    check: "The governing School has partnership_status == ACTIVE."
    error_id: ERR_SCHOOL_PARTNERSHIP_INACTIVE
    http_status: 409
    applies_to: "PATCH /grade-kit-specs/{id}/status, POST /distribution-events, POST /distribution-events/{id}/transitions with target_status=PUBLISHED, POST /teacher-requests/{id}/transitions with target_status=APPROVED"

  - priority: 14
    category: business_referential
    check: "A GradeKitSpec with status == PUBLISHED exists for (school_id, grade_band) and carries at least one KitSpecLine."
    error_id: ERR_KIT_SPEC_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /distribution-events/{id}/transitions with target_status=PUBLISHED"

  - priority: 15
    category: business_referential
    check: "Referenced SupplyItem has catalog_active == true."
    error_id: ERR_ITEM_INACTIVE
    http_status: 422
    applies_to: "POST /kit-spec-lines, POST /donation-batches, POST /purchase-orders, POST /teacher-requests"

  - priority: 16
    category: business_referential
    check: "The governing DriveCycle is in a phase that permits the operation: donation intake needs COLLECTING; batch acceptance needs COLLECTING or SORTING; purchase submission needs COLLECTING, SORTING or DISTRIBUTION; event locking needs DISTRIBUTION."
    error_id: ERR_CYCLE_PHASE_INVALID
    http_status: 409
    applies_to: "POST /donation-batches, POST /donation-batches/{id}/transitions, POST /purchase-orders/{id}/transitions, POST /distribution-events/{id}/transitions, POST /teacher-requests/{id}/transitions"

  - priority: 17
    category: business_referential
    check: "Cadence gate: a DriveCycle may move DISTRIBUTION -> COLLECTING only when cadence == YEAR_ROUND."
    error_id: ERR_CADENCE_FORBIDS_REOPEN
    http_status: 409
    applies_to: "PATCH /drive-cycles/{id}/status"

  - priority: 18
    category: business_temporal
    check: "The event window sits inside the drive cycle window: cycle.window_start <= window_start and window_end <= cycle.window_end."
    error_id: ERR_WINDOW_OUTSIDE_CYCLE
    http_status: 422
    applies_to: "POST /distribution-events, POST /volunteer-events"

  - priority: 19
    category: business_temporal
    check: "Registration lead time measured against the logical clock: window_start - now >= 48 hours when cadence == BACK_TO_SCHOOL, >= 2 hours when cadence == YEAR_ROUND."
    error_id: ERR_REGISTRATION_LEAD_TIME
    http_status: 422
    applies_to: "POST /student-registrations"

  - priority: 20
    category: business_temporal
    check: "Site occupation conflict: VolunteerEvent intervals on one CollectionSite are half-open [window_start, window_end) and additionally padded by SITE_TURNOVER_BUFFER_MINUTES = 45 on both sides, so a new event collides when new.window_start < existing.window_end + 45min AND existing.window_start < new.window_end + 45min, counting existing events with status IN {SCHEDULED, IN_PROGRESS} only."
    error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /volunteer-events"

  - priority: 21
    category: business_constraint
    check: "School aggregate throughput: DistributionEvent intervals on one School are CLOSED [window_start, window_end] (touching endpoints DO overlap) and multiple overlaps are permitted; the request is rejected only when, at some instant inside the new interval, the sum of seat_capacity over the new event plus all overlapping events with status IN {DRAFT, PUBLISHED, LOCKED} exceeds School.max_concurrent_seats."
    error_id: ERR_SCHOOL_THROUGHPUT_EXCEEDED
    http_status: 409
    applies_to: "POST /distribution-events"

  - priority: 22
    category: business_constraint
    check: "Uniqueness: at most one GradeKitSpec with status == PUBLISHED per (school_id, grade_band); SupplyItem.sku unique; at most one StudentRegistration per (distribution_event_id, student_reference) among registrations whose eligibility_status != WITHDRAWN."
    error_id: "ERR_DUPLICATE_KIT_SPEC | ERR_DUPLICATE_SKU | ERR_DUPLICATE_STUDENT_REGISTRATION"
    http_status: 409
    applies_to: "PATCH /grade-kit-specs/{id}/status, POST /supply-items, POST /student-registrations"

  - priority: 23
    category: business_constraint
    check: "StudentRegistration.grade_band equals the DistributionEvent.grade_band."
    error_id: ERR_GRADE_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /student-registrations"

  - priority: 24
    category: business_constraint
    check: "Eligibility: free_lunch_eligible == true OR income_verified == true when moving a registration to VERIFIED."
    error_id: ERR_ELIGIBILITY_NOT_MET
    http_status: 422
    applies_to: "POST /student-registrations/{id}/transitions with target_status=VERIFIED"

  - priority: 25
    category: business_constraint
    check: "Seat capacity: DistributionEvent.confirmed_count < seat_capacity before a registration moves to CONFIRMED."
    error_id: ERR_EVENT_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /student-registrations/{id}/transitions with target_status=CONFIRMED"

  - priority: 26
    category: business_constraint
    check: "Assembly output ceiling: assembled_kit_count <= VolunteerEvent.planned_kit_capacity."
    error_id: ERR_ASSEMBLY_OVER_CAPACITY
    http_status: 422
    applies_to: "POST /volunteer-events/{id}/transitions with target_status=COMPLETED"

  - priority: 27
    category: business_constraint
    check: "Pledge completion: CollectionSite.accepted_item_count >= pledged_item_count before pledge_status may reach FULFILLED."
    error_id: ERR_PLEDGE_SHORTFALL
    http_status: 409
    applies_to: "PATCH /collection-sites/{id}/pledge-status with target_status=FULFILLED"

  - priority: 28
    category: business_constraint
    check: "Inventory availability: every KitSpecLine of the event's PUBLISHED spec has InventoryPosition.on_hand_qty >= qty_per_student before a registration is CONFIRMED; a TeacherRequest fulfilment needs on_hand_qty >= qty_requested; a cycle-count adjustment may never drive on_hand_qty below 0."
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /student-registrations/{id}/transitions, POST /teacher-requests/{id}/transitions, POST /inventory-positions/adjustments"

  - priority: 29
    category: business_fiscal
    check: "Restriction consistency: restricted_supply_item_id is required and restricted_school_id must be null when restriction_type == ITEM_RESTRICTED; restricted_school_id is required and restricted_supply_item_id must be null when restriction_type == SCHOOL_RESTRICTED; both must be null when restriction_type == UNRESTRICTED."
    error_id: ERR_CASH_RESTRICTION_VIOLATION
    http_status: 422
    applies_to: "POST /cash-donations"

  - priority: 30
    category: business_fiscal
    check: "Funding coverage: the purchase_funding_waterfall covers total_cost_cents in full from eligible gifts of the same cycle."
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 409
    applies_to: "POST /purchase-orders/{id}/transitions with target_status=SUBMITTED"

  - priority: 31
    category: business_fiscal
    check: "Cycle supplemental cap: approved_spend_cents + request_cost_cents <= DriveCycle.supplemental_cap_cents (equality passes)."
    error_id: ERR_SUPPLEMENTAL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /teacher-requests/{id}/transitions with target_status=APPROVED"

  - priority: 32
    category: business_fiscal
    check: "Per-school sub-cap, active only when at least 3 schools are ACTIVE with a PUBLISHED spec: school_spend_cents + request_cost_cents <= floor(supplemental_cap_cents * 0.40)."
    error_id: ERR_SCHOOL_SUBCAP_EXCEEDED
    http_status: 409
    applies_to: "POST /teacher-requests/{id}/transitions with target_status=APPROVED"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- School --------------------------------------------------------------
  - method: POST
    path: "/schools"
    description: "Register a partner school in PROSPECT."
    roles: [ProgramDirector]
    code: 201
    input: [name, district_code, title_i_pct, enrollment_count, max_concurrent_seats]
    output: School
    side_effects: ["School created with partnership_status=PROSPECT, version=1, all computed aggregates at 0"]

  - method: PATCH
    path: "/schools/{id}/partnership-status"
    description: "Advance the partnership dimension: PROSPECT -> MOU_PENDING -> ACTIVE <-> SUSPENDED, or ARCHIVED."
    roles: [ProgramDirector]
    code: 200
    input: [target_status]
    output: School
    side_effects: ["Runs the §1.2 School transition, including the four-hop suspension cascade", "increments School.version by 1"]

  - method: GET
    path: "/schools/{id}"
    description: "Read one school with its live impact aggregates."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{id}/grade-kit-specs"
    description: "List the needs lists of one school (reverse reachability for GradeKitSpec.school_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GradeKitSpec[]
    side_effects: []

  - method: GET
    path: "/schools/{id}/impact-summary"
    description: "Computed read: both impact-index variants side by side with the counts that produced them."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: { impact_index_interim: number, impact_index_audited: number, students_served_interim_count: integer, students_served_audited_count: integer, no_show_count: integer, target_student_count: integer, closed_event_count: integer }
    side_effects: []

  # ---- SupplyItem -----------------------------------------------------------
  - method: POST
    path: "/supply-items"
    description: "Add a catalog item."
    roles: [ProgramDirector]
    code: 201
    input: [sku, name, category, unit_cost_cents, bulk_pack_size, "hygiene_sealed_required?", "catalog_active?"]
    output: SupplyItem
    side_effects: ["SupplyItem created; sku uniqueness enforced"]

  - method: GET
    path: "/supply-items/{id}"
    description: "Read one catalog item."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: SupplyItem
    side_effects: []

  # ---- GradeKitSpec / KitSpecLine ------------------------------------------
  - method: POST
    path: "/grade-kit-specs"
    description: "Open a DRAFT needs list for one school and grade band."
    roles: [SchoolLiaison]
    code: 201
    input: [school_id, grade_band, student_target_count]
    output: GradeKitSpec
    side_effects: ["GradeKitSpec created in DRAFT with kit_unit_cost_cents=0 and line_count=0"]

  - method: GET
    path: "/grade-kit-specs/{id}"
    description: "Read one needs list with its computed kit cost."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: GradeKitSpec
    side_effects: []

  - method: PATCH
    path: "/grade-kit-specs/{id}/status"
    description: "Publish or retire a needs list."
    roles: [SchoolLiaison]
    code: 200
    input: [target_status]
    output: GradeKitSpec
    side_effects: ["Recomputes kit_unit_cost_cents and School.target_student_count", "increments GradeKitSpec.version and School.version by 1"]

  - method: POST
    path: "/kit-spec-lines"
    description: "Add an item line to a DRAFT needs list."
    roles: [SchoolLiaison]
    code: 201
    input: [grade_kit_spec_id, supply_item_id, qty_per_student, "substitutable?"]
    output: KitSpecLine
    side_effects: ["Recomputes GradeKitSpec.line_count and kit_unit_cost_cents", "increments GradeKitSpec.version by 1"]

  - method: GET
    path: "/kit-spec-lines/{id}"
    description: "Read one needs-list line."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: KitSpecLine
    side_effects: []

  - method: GET
    path: "/kit-spec-lines"
    description: "Filtered list of needs-list lines (reverse reachability for grade_kit_spec_id and supply_item_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["grade_kit_spec_id?", "supply_item_id?", "limit?", "offset?"]
    output: KitSpecLine[]
    side_effects: []

  # ---- DriveCycle -----------------------------------------------------------
  - method: POST
    path: "/drive-cycles"
    description: "Open a drive cycle in DRAFT."
    roles: [ProgramDirector]
    code: 201
    input: [name, cadence, window_start, window_end]
    output: DriveCycle
    side_effects: ["DriveCycle created with all cash aggregates at 0 and version=1"]

  - method: GET
    path: "/drive-cycles/{id}"
    description: "Read one drive cycle with its cash and inventory aggregates."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: DriveCycle
    side_effects: []

  - method: PATCH
    path: "/drive-cycles/{id}/status"
    description: "Advance or reopen the cycle phase; DISTRIBUTION -> COLLECTING is allowed only for YEAR_ROUND cadence."
    roles: [ProgramDirector]
    code: 200
    input: [target_status]
    output: DriveCycle
    side_effects: ["Runs the §1.2 DriveCycle transition and its recomputations", "increments DriveCycle.version by 1"]

  - method: GET
    path: "/drive-cycles/{id}/collection-sites"
    description: "List the collection sites of one cycle (reverse reachability for CollectionSite.drive_cycle_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["site_type?", "limit?", "offset?"]
    output: CollectionSite[]
    side_effects: []

  # ---- CollectionSite -------------------------------------------------------
  - method: POST
    path: "/collection-sites"
    description: "Open a donation collection site; CORPORATE sites carry the corporate-drive pledge."
    roles: [ProgramDirector]
    code: 201
    input: [drive_cycle_id, name, site_type, bin_capacity, "pledged_item_count?"]
    output: CollectionSite
    side_effects: ["CollectionSite created with operational_status=PENDING and pledge_status=NONE"]

  - method: GET
    path: "/collection-sites/{id}"
    description: "Read one site with both of its independent status dimensions."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: CollectionSite
    side_effects: []

  - method: PATCH
    path: "/collection-sites/{id}/operational-status"
    description: "Move the operational dimension: PENDING -> ACTIVE <-> PAUSED -> CLOSED."
    roles: [ProgramDirector]
    code: 200
    input: [target_status]
    output: CollectionSite
    side_effects: ["Cancels SCHEDULED volunteer events on PAUSE; may lapse an unmet pledge on CLOSE", "increments CollectionSite.version by 1"]

  - method: PATCH
    path: "/collection-sites/{id}/pledge-status"
    description: "Move the corporate pledge dimension: NONE -> PLEDGED -> PLEDGE_ACTIVE -> FULFILLED | LAPSED."
    roles: [SiteCoordinator]
    code: 200
    input: [target_status]
    output: CollectionSite
    side_effects: ["increments CollectionSite.version by 1"]

  - method: GET
    path: "/collection-sites/{id}/volunteer-events"
    description: "List the sorting/assembly events of one site (reverse reachability for VolunteerEvent.collection_site_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VolunteerEvent[]
    side_effects: []

  # ---- DonationBatch --------------------------------------------------------
  - method: POST
    path: "/donation-batches"
    description: "Record an in-kind donation of one SKU at a site."
    roles: [SiteCoordinator]
    code: 201
    input: [collection_site_id, supply_item_id, qty_declared, condition, "sealed?"]
    output: DonationBatch
    side_effects: ["DonationBatch created in RECEIVED", "InventoryPosition.in_transit_qty for (cycle, item) recomputed", "PUBLISHED events touching the item have provisional_fill_pct recomputed"]

  - method: GET
    path: "/donation-batches/{id}"
    description: "Read one donation batch."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: DonationBatch
    side_effects: []

  - method: GET
    path: "/donation-batches"
    description: "Filtered list of batches (reverse reachability for collection_site_id and supply_item_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["collection_site_id?", "supply_item_id?", "status?", "limit?", "offset?"]
    output: DonationBatch[]
    side_effects: []

  - method: POST
    path: "/donation-batches/{id}/transitions"
    description: "Inspect, accept, quarantine, remediate or discard a batch."
    roles: [SiteCoordinator, WarehouseLead]
    code: 200
    input: [target_status, "qty_rejected?", "hold_reason?"]
    output: DonationBatch
    side_effects: ["Runs the §1.2 DonationBatch transition; the ACCEPTED branch runs the five-hop inventory-and-waitlist cascade", "increments DonationBatch.version by 1"]

  # ---- InventoryPosition ----------------------------------------------------
  - method: POST
    path: "/inventory-positions/adjustments"
    description: "Warehouse cycle-count adjustment: apply a signed delta to on_hand_qty (and optionally damaged_qty) for one (cycle, item), creating the position when absent."
    roles: [WarehouseLead]
    code: 200
    input: [drive_cycle_id, supply_item_id, delta_on_hand_qty, "delta_damaged_qty?", reason]
    output: InventoryPosition
    side_effects: ["on_hand_qty += delta_on_hand_qty, damaged_qty += delta_damaged_qty, adjustment_qty += (delta_on_hand_qty + delta_damaged_qty) so item_conservation holds", "DriveCycle.total_items_on_hand recomputed", "every PUBLISHED DistributionEvent touching the item has provisional_fill_pct recomputed and its waitlist promoted exactly as in the DonationBatch ACCEPTED cascade hop 5", "increments InventoryPosition.version and DriveCycle.version by 1"]

  - method: GET
    path: "/inventory-positions/{id}"
    description: "Read one inventory position."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: InventoryPosition
    side_effects: []

  - method: GET
    path: "/inventory-positions"
    description: "Filtered list of positions (reverse reachability for drive_cycle_id and supply_item_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["drive_cycle_id?", "supply_item_id?", "limit?", "offset?"]
    output: InventoryPosition[]
    side_effects: []

  # ---- CashDonation ---------------------------------------------------------
  - method: POST
    path: "/cash-donations"
    description: "Record a cash gift, optionally restricted to an item or a school."
    roles: [DonorRelations]
    code: 201
    input: [drive_cycle_id, donor_name, amount_cents, restriction_type, "restricted_supply_item_id?", "restricted_school_id?"]
    output: CashDonation
    side_effects: ["DriveCycle.cash_received_cents, cash_available_cents, unrestricted_gross_cents and supplemental_cap_cents recomputed", "increments DriveCycle.version by 1"]

  - method: GET
    path: "/cash-donations/{id}"
    description: "Read one cash gift with its allocation state."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: CashDonation
    side_effects: []

  - method: GET
    path: "/cash-donations"
    description: "Filtered list of cash gifts (reverse reachability for drive_cycle_id, restricted_school_id and restricted_supply_item_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["drive_cycle_id?", "restricted_school_id?", "restricted_supply_item_id?", "restriction_type?", "limit?", "offset?"]
    output: CashDonation[]
    side_effects: []

  # ---- PurchaseOrder --------------------------------------------------------
  - method: POST
    path: "/purchase-orders"
    description: "Draft a purchase order that closes an unfilled item gap; costing is frozen at creation."
    roles: [WarehouseLead]
    code: 201
    input: [drive_cycle_id, supply_item_id, requested_unit_gap]
    output: PurchaseOrder
    side_effects: ["Runs calculation purchase_order_costing, writing ordered_qty, line_subtotal_cents, admin_fee_cents and total_cost_cents", "PurchaseOrder created in DRAFT"]

  - method: GET
    path: "/purchase-orders/{id}"
    description: "Read one purchase order including its funding_allocations ledger."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/purchase-orders"
    description: "Filtered list of purchase orders (reverse reachability for drive_cycle_id and supply_item_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["drive_cycle_id?", "supply_item_id?", "status?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []

  - method: POST
    path: "/purchase-orders/{id}/transitions"
    description: "Submit, approve, receive or cancel a purchase order under optimistic concurrency on the drive cycle."
    roles: [WarehouseLead, ProgramDirector]
    code: 200
    input: [target_status, expected_drive_cycle_version]
    output: PurchaseOrder
    side_effects: ["SUBMITTED runs purchase_funding_waterfall; CANCELLED replays funding_allocations in reverse; RECEIVED credits inventory and promotes waitlists", "increments PurchaseOrder.version and DriveCycle.version by 1"]

  # ---- VolunteerEvent -------------------------------------------------------
  - method: POST
    path: "/volunteer-events"
    description: "Schedule a sorting or assembly session at a site; pins planned_kit_capacity at creation."
    roles: [SiteCoordinator]
    code: 201
    input: [collection_site_id, event_type, window_start, window_end, volunteer_count, "minor_volunteer_count?", "adult_supervisor_count?"]
    output: VolunteerEvent
    side_effects: ["Runs calculation volunteer_assembly_throughput writing planned_kit_capacity", "VolunteerEvent created in SCHEDULED"]

  - method: POST
    path: "/volunteer-events/{id}/transitions"
    description: "Start, complete or cancel a volunteer session."
    roles: [SiteCoordinator]
    code: 200
    input: [target_status, "assembled_kit_count?"]
    output: VolunteerEvent
    side_effects: ["Records assembled_kit_count on COMPLETED", "increments VolunteerEvent.version by 1"]

  # ---- DistributionEvent ----------------------------------------------------
  - method: POST
    path: "/distribution-events"
    description: "Create a backpack distribution event for one school and grade band."
    roles: [SchoolLiaison]
    code: 201
    input: [school_id, drive_cycle_id, grade_band, window_start, window_end, seat_capacity]
    output: DistributionEvent
    side_effects: ["DistributionEvent created in DRAFT with both fill percentages at 0.00"]

  - method: GET
    path: "/distribution-events/{id}"
    description: "Read one distribution event with both fill projections and its counters."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: DistributionEvent
    side_effects: []

  - method: GET
    path: "/distribution-events"
    description: "Filtered list of distribution events (reverse reachability for school_id and drive_cycle_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["school_id?", "drive_cycle_id?", "status?", "limit?", "offset?"]
    output: DistributionEvent[]
    side_effects: []

  - method: POST
    path: "/distribution-events/{id}/transitions"
    description: "Publish, lock, close or cancel a distribution event."
    roles: [SchoolLiaison, ProgramDirector]
    code: 200
    input: [target_status]
    output: DistributionEvent
    side_effects: ["PUBLISHED computes provisional_fill_pct; LOCKED freezes final_fill_pct; CLOSED runs the three-hop no-show/release cascade", "increments DistributionEvent.version by 1"]

  - method: GET
    path: "/distribution-events/{id}/student-registrations"
    description: "List registrations of one event (reverse reachability for StudentRegistration.distribution_event_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["eligibility_status?", "limit?", "offset?"]
    output: StudentRegistration[]
    side_effects: []

  # ---- StudentRegistration --------------------------------------------------
  - method: POST
    path: "/student-registrations"
    description: "Register a student for a published distribution event."
    roles: [SchoolLiaison]
    code: 201
    input: [distribution_event_id, student_reference, grade_band, guardian_name, "free_lunch_eligible?", "income_verified?"]
    output: StudentRegistration
    side_effects: ["StudentRegistration created in PENDING", "DistributionEvent.provisional_fill_pct recomputed because the PROVISIONAL headcount grew", "increments DistributionEvent.version by 1"]

  - method: GET
    path: "/student-registrations/{id}"
    description: "Read one registration."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: StudentRegistration
    side_effects: []

  - method: POST
    path: "/student-registrations/{id}/transitions"
    description: "Move a registration through verification, confirmation, waitlisting, fulfilment or withdrawal under optimistic concurrency on the distribution event."
    roles: [SchoolLiaison, ProgramDirector]
    code: 200
    input: [target_status, expected_distribution_event_version]
    output: StudentRegistration
    side_effects: ["Runs the §1.2 StudentRegistration transition with its reservation or release leg", "increments StudentRegistration.version and DistributionEvent.version by 1"]

  # ---- TeacherRequest -------------------------------------------------------
  - method: POST
    path: "/teacher-requests"
    description: "Submit a supplemental classroom supply request."
    roles: [SchoolLiaison]
    code: 201
    input: [school_id, drive_cycle_id, supply_item_id, teacher_name, qty_requested, justification]
    output: TeacherRequest
    side_effects: ["request_cost_cents computed as qty_requested * unit_cost_cents", "TeacherRequest created in SUBMITTED"]

  - method: GET
    path: "/teacher-requests/{id}"
    description: "Read one supplemental request."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: []
    output: TeacherRequest
    side_effects: []

  - method: GET
    path: "/teacher-requests"
    description: "Filtered list of supplemental requests (reverse reachability for school_id, drive_cycle_id and supply_item_id)."
    roles: [ProgramDirector, SchoolLiaison, SiteCoordinator, WarehouseLead, DonorRelations]
    code: 200
    input: ["school_id?", "drive_cycle_id?", "supply_item_id?", "status?", "limit?", "offset?"]
    output: TeacherRequest[]
    side_effects: []

  - method: POST
    path: "/teacher-requests/{id}/transitions"
    description: "Approve, deny or fulfil a supplemental request."
    roles: [ProgramDirector, WarehouseLead]
    code: 200
    input: [target_status]
    output: TeacherRequest
    side_effects: ["APPROVED runs the supplemental cap checks and stamps approved_at; FULFILLED moves units from on_hand_qty to distributed_qty", "increments TeacherRequest.version by 1"]

  # ---- Test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["All lead-time, verified_at and approved_at stamps read from this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed for the endpoint in §1.5."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown enum member, out-of-range integer, unparseable datetime, window_start >= window_end, or pagination outside limit 1..100 / offset >= 0."
  - id: ERR_SCHOOL_SCOPE_VIOLATION
    http: 403
    condition: "A SchoolLiaison acts on a resource whose governing School.id differs from the caller's X-User-ID."
  - id: ERR_SITE_SCOPE_VIOLATION
    http: 403
    condition: "A SiteCoordinator acts on a resource whose governing CollectionSite.id differs from the caller's X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ProgramDirector approving a purchase order is the same X-User-ID that submitted it."
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "school_id in the path or body does not resolve."
  - id: ERR_SUPPLY_ITEM_NOT_FOUND
    http: 404
    condition: "supply_item_id, restricted_supply_item_id in the path or body does not resolve."
  - id: ERR_KIT_SPEC_NOT_FOUND
    http: 404
    condition: "A GradeKitSpec or KitSpecLine id in the path or body does not resolve."
  - id: ERR_DRIVE_CYCLE_NOT_FOUND
    http: 404
    condition: "drive_cycle_id in the path or body does not resolve."
  - id: ERR_COLLECTION_SITE_NOT_FOUND
    http: 404
    condition: "collection_site_id in the path or body does not resolve."
  - id: ERR_DONATION_BATCH_NOT_FOUND
    http: 404
    condition: "A DonationBatch id in the path does not resolve."
  - id: ERR_INVENTORY_POSITION_NOT_FOUND
    http: 404
    condition: "An InventoryPosition id in the path does not resolve."
  - id: ERR_CASH_DONATION_NOT_FOUND
    http: 404
    condition: "A CashDonation id in the path does not resolve."
  - id: ERR_PURCHASE_ORDER_NOT_FOUND
    http: 404
    condition: "A PurchaseOrder id in the path does not resolve."
  - id: ERR_VOLUNTEER_EVENT_NOT_FOUND
    http: 404
    condition: "A VolunteerEvent id in the path does not resolve."
  - id: ERR_DISTRIBUTION_EVENT_NOT_FOUND
    http: 404
    condition: "A DistributionEvent id in the path or body does not resolve."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "A StudentRegistration id in the path does not resolve."
  - id: ERR_TEACHER_REQUEST_NOT_FOUND
    http: 404
    condition: "A TeacherRequest id in the path does not resolve."
  - id: ERR_INVALID_SCHOOL_STATE
    http: 409
    condition: "The requested School partnership transition is not declared from the school's current partnership_status, or an ARCHIVE is attempted while a PUBLISHED or LOCKED distribution event exists."
  - id: ERR_INVALID_SPEC_STATE
    http: 409
    condition: "The requested GradeKitSpec transition is not declared from its current status, or a publish is attempted with line_count == 0, or a retire is attempted while a PUBLISHED/LOCKED event uses the band."
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "The requested DriveCycle transition is not declared from its current status, or its guard (open batches, live events, cash balance identity) fails."
  - id: ERR_INVALID_SITE_STATE
    http: 409
    condition: "The requested CollectionSite operational or pledge transition is not declared from that dimension's current value, or the CORPORATE pledge guard on activation fails, or a non-CORPORATE site attempts to leave pledge_status NONE."
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "The requested DonationBatch transition is not declared from its current status."
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "The requested PurchaseOrder transition is not declared from its current status."
  - id: ERR_INVALID_EVENT_STATE
    http: 409
    condition: "The requested DistributionEvent or VolunteerEvent transition is not declared from its current status, or a registration is created for an event that is not PUBLISHED."
  - id: ERR_INVALID_REGISTRATION_STATE
    http: 409
    condition: "The requested StudentRegistration transition is not declared from its current eligibility_status."
  - id: ERR_INVALID_TEACHER_REQUEST_STATE
    http: 409
    condition: "The requested TeacherRequest transition is not declared from its current status."
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_distribution_event_version does not equal the DistributionEvent's current version."
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_drive_cycle_version does not equal the DriveCycle's current version."
  - id: ERR_UNSAFE_ITEM_CONDITION
    http: 422
    condition: "A batch of an item with hygiene_sealed_required == true is accepted or remediated while sealed == false or condition != NEW."
  - id: ERR_SUPERVISION_RATIO_UNMET
    http: 422
    condition: "adult_supervisor_count < ceil(minor_volunteer_count / 8) on volunteer event creation."
  - id: ERR_SCHOOL_PARTNERSHIP_INACTIVE
    http: 409
    condition: "The governing School.partnership_status is not ACTIVE."
  - id: ERR_KIT_SPEC_NOT_PUBLISHED
    http: 409
    condition: "No PUBLISHED GradeKitSpec exists for the event's (school_id, grade_band) at publish time."
  - id: ERR_ITEM_INACTIVE
    http: 422
    condition: "The referenced SupplyItem has catalog_active == false."
  - id: ERR_CYCLE_PHASE_INVALID
    http: 409
    condition: "The governing DriveCycle is not in a phase that permits the operation."
  - id: ERR_CADENCE_FORBIDS_REOPEN
    http: 409
    condition: "A DISTRIBUTION -> COLLECTING reopen is attempted on a cycle whose cadence is BACK_TO_SCHOOL."
  - id: ERR_WINDOW_OUTSIDE_CYCLE
    http: 422
    condition: "An event window falls outside the drive cycle window."
  - id: ERR_REGISTRATION_LEAD_TIME
    http: 422
    condition: "A registration is created less than the cadence's lead time (48h BACK_TO_SCHOOL, 2h YEAR_ROUND) before the event's window_start."
  - id: ERR_SITE_WINDOW_CONFLICT
    http: 409
    condition: "A volunteer event collides with another SCHEDULED or IN_PROGRESS event at the same site under the 45-minute buffered half-open interval rule."
  - id: ERR_SCHOOL_THROUGHPUT_EXCEEDED
    http: 409
    condition: "Overlapping distribution events at one school would exceed School.max_concurrent_seats in aggregate seat capacity."
  - id: ERR_DUPLICATE_KIT_SPEC
    http: 409
    condition: "A second GradeKitSpec is published for a (school_id, grade_band) that already has a PUBLISHED spec."
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "A SupplyItem is created with an sku that already exists."
  - id: ERR_DUPLICATE_STUDENT_REGISTRATION
    http: 409
    condition: "A second registration is created for the same (distribution_event_id, student_reference) while the earlier one is not WITHDRAWN."
  - id: ERR_GRADE_BAND_MISMATCH
    http: 422
    condition: "StudentRegistration.grade_band differs from the event's grade_band."
  - id: ERR_ELIGIBILITY_NOT_MET
    http: 422
    condition: "A registration with neither free_lunch_eligible nor income_verified is moved to VERIFIED."
  - id: ERR_EVENT_CAPACITY_FULL
    http: 409
    condition: "A registration is confirmed while confirmed_count already equals seat_capacity."
  - id: ERR_ASSEMBLY_OVER_CAPACITY
    http: 422
    condition: "assembled_kit_count exceeds the event's planned_kit_capacity."
  - id: ERR_PLEDGE_SHORTFALL
    http: 409
    condition: "A corporate pledge is marked FULFILLED while accepted_item_count < pledged_item_count."
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "A kit reservation, a teacher-request fulfilment or a negative cycle-count adjustment would drive an InventoryPosition below zero on-hand."
  - id: ERR_CASH_RESTRICTION_VIOLATION
    http: 422
    condition: "The restriction_type of a cash gift does not agree with which restricted_* foreign key is populated."
  - id: ERR_INSUFFICIENT_FUNDS
    http: 409
    condition: "The funding waterfall cannot cover the order's total_cost_cents from eligible gifts."
  - id: ERR_SUPPLEMENTAL_CAP_EXCEEDED
    http: 409
    condition: "Approving a teacher request would push the cycle's approved supplemental spend strictly above supplemental_cap_cents."
  - id: ERR_SCHOOL_SUBCAP_EXCEEDED
    http: 409
    condition: "Approving a teacher request would push one school's approved supplemental spend strictly above 40% of the cycle cap while the sub-cap is active (3 or more ACTIVE partner schools with a PUBLISHED spec)."

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Runs the program: partners with schools, opens cycles and sites, approves purchase orders and supplemental requests, and holds the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /schools"
      - "PATCH /schools/{id}/partnership-status"
      - "POST /supply-items"
      - "POST /drive-cycles"
      - "PATCH /drive-cycles/{id}/status"
      - "POST /collection-sites"
      - "PATCH /collection-sites/{id}/operational-status"
      - "POST /_clock/set_current_utc"
      - "Approve a PurchaseOrder (POST /purchase-orders/{id}/transitions with target_status=APPROVED), never as the same X-User-ID that submitted it"
    shared_operations:
      - "POST /purchase-orders/{id}/transitions (SUBMITTED and CANCELLED shared with WarehouseLead; APPROVED is exclusive and is barred for the submitter)"
      - "POST /distribution-events/{id}/transitions"
      - "POST /student-registrations/{id}/transitions"
      - "POST /teacher-requests/{id}/transitions"
      - "All GET endpoints"

  - name: SchoolLiaison
    description: "Acts for one partner school: maintains its needs lists, runs its distribution events, registers students and files teacher requests."
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /grade-kit-specs"
      - "PATCH /grade-kit-specs/{id}/status"
      - "POST /kit-spec-lines"
      - "POST /distribution-events"
      - "POST /student-registrations"
      - "POST /teacher-requests"
    shared_operations:
      - "POST /distribution-events/{id}/transitions"
      - "POST /student-registrations/{id}/transitions"
      - "All GET endpoints"

  - name: SiteCoordinator
    description: "Acts for one collection site: takes in donations, runs the corporate pledge dimension and schedules sorting/assembly sessions."
    identity: "entity_backed:CollectionSite"
    exclusive_operations:
      - "PATCH /collection-sites/{id}/pledge-status"
      - "POST /donation-batches"
      - "POST /volunteer-events"
      - "POST /volunteer-events/{id}/transitions"
    shared_operations:
      - "POST /donation-batches/{id}/transitions (the INSPECTED step; acceptance is the WarehouseLead's)"
      - "All GET endpoints"

  - name: WarehouseLead
    description: "Owns physical stock: accepts or quarantines inspected batches, adjusts inventory, drafts and submits purchase orders and hands out fulfilled teacher requests."
    identity: opaque
    exclusive_operations:
      - "POST /inventory-positions/adjustments"
      - "POST /purchase-orders"
      - "Receive a PurchaseOrder (POST /purchase-orders/{id}/transitions with target_status=RECEIVED)"
      - "Accept, quarantine, remediate or discard a DonationBatch"
    shared_operations:
      - "POST /donation-batches/{id}/transitions"
      - "Submit a PurchaseOrder (target_status=SUBMITTED), shared with ProgramDirector; whoever submits is recorded in submitted_by_user_id and is then barred from approving"
      - "POST /teacher-requests/{id}/transitions (the FULFILLED step)"
      - "All GET endpoints"

  - name: DonorRelations
    description: "Books cash gifts and their restrictions."
    identity: opaque
    exclusive_operations:
      - "POST /cash-donations"
    shared_operations:
      - "All GET endpoints"
