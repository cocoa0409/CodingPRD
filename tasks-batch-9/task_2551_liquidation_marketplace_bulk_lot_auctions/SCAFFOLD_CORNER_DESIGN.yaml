          - calculations.dock_door_assignment
          - entities.SaleOrder.fields.pickup_deadline_at
          - state_machines.SaleOrder.AWAITING_APPOINTMENT_to_APPOINTMENT_SCHEDULED
        distinguishing_aspect: >
          The deadline test is "window_end_at <= pickup_deadline_at": a window ending at
          2026-08-22T00:00:01Z is rejected with ERR_PICKUP_DEADLINE_PASSED while the otherwise
          identical window ending exactly at 2026-08-22T00:00:00Z is accepted, lands on door 1
          and moves the order to APPOINTMENT_SCHEDULED.
        test_recipe:
          setup:
            - "A 400-unit lot sold at auction for 2700000 on 2026-08-12T00:00:00Z, so pickup_deadline_at is 2026-08-22T00:00:00Z."
