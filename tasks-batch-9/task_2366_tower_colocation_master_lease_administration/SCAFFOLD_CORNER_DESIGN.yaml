  - section: errors
    instances:
      - name: body_foreign_key_not_found_codes_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_6
          - errors.ERR_LANDLORD_NOT_FOUND
          - errors.ERR_TENANT_NOT_FOUND
          - errors.ERR_MLA_NOT_FOUND
          - errors.ERR_GROUND_LEASE_NOT_FOUND
          - errors.ERR_APPLICATION_NOT_FOUND
          - errors.ERR_ANALYSIS_NOT_FOUND
        distinguishing_aspect: |
          Body foreign keys are checked in the order §1.5 lists them, each with its own code: a
          ground lease naming an unknown landlord returns ERR_LANDLORD_NOT_FOUND, but when BOTH
          tower_id and landlord_id are unknown the answer is ERR_TOWER_NOT_FOUND because tower_id is
          listed first.
        test_recipe:
          setup:
            - "One tower, one landlord, one tenant and one ACTIVE master lease exist as the valid halves of each request."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Foreign Key Fell", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
