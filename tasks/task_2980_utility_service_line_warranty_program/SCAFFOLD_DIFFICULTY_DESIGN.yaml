            - "GET /ledger-entries?enrollment_id=${enrollment_id}&entry_type=BENEFIT_CHARGE returns total_count == 3 with amount_cents values [527000, 472999, 1] in created_at ASC order summing to exactly 1000000"
            - "Claim.${claim3_id}.status == PAID  # the claim that reached the cap is itself paid in full; only LATER claims are refused"

  # ===========================================================================
  # 7. cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_requires_sourcing_campaign_in_mailed_state
        grounds:
          - validations.campaign-must-be-mailed
          - errors.ERR_CAMPAIGN_NOT_MAILED
          - state_machines.MarketingCampaign.APPROVED_to_MAILED
          - state_machines.MarketingCampaign.DRAFT_to_PARTNER_REVIEW
          - state_machines.MarketingCampaign.PARTNER_REVIEW_to_APPROVED
          - calculations.mail_drop_suppression_allocation
          - endpoints.POST /enrollments
          - endpoints.POST /campaigns/{campaignId}/mail-drop
          - entities.Enrollment.fields.source_campaign_id
        distinguishing_aspect: |
          The gate is on a THIRD entity that is neither the created entity nor its parent: creating an
          Enrollment under a Premises is blocked by the state of the MarketingCampaign it claims as its
          source. APPROVED is not enough - the campaign must have physically MAILED - so an implementation
          that accepts "approved or better" passes the happy path and still fails here. The retry after the
          mail drop also has to re-read the Premises version, because the drop itself bumped it.
        test_recipe:
          setup:
