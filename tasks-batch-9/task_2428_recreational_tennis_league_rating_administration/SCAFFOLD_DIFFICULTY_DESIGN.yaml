      - name: recalc_propose_epoch_scope_vs_publish_epoch_change_count
        grounds:
          - calculations.year_end_rating_recalculation
          - entities.Section.fields.recalculated_player_count
          - entities.Section.fields.published_level_change_count
          - entities.Section.fields.rating_period_status
          - entities.Player.fields.proposed_recalc_level
        distinguishing_aspect: |
          The Section rating-epoch domain persists both variants side by side after the two
          phases run: the propose variant counts every in-scope player (recalculated_player_count
          == 12, including the seven whose proposed_recalc_level equals their current level)
          while the publish variant counts only actual crossings (published_level_change_count
          == 5), so an implementation that reuses one counter for both cannot produce 12 and 5.
        test_recipe:
          setup:
            - "Same section, facility, league and two six-player rosters as the first instance of this rule, but only the REGULAR match M1 (2026-08-15) exists and is VERIFIED; no PLAYOFF match."
            - "Because every player owns exactly one counted line, in_season_provisional and year_end_final coincide, which isolates the propose/publish difference from the weighting difference."
            - "Counted line ratings: h1,h2 = 4.000; h3,h4 = 3.882; h5,h6 = 3.650; a1,a2 = 3.750; a3,a4 = 3.868; a5,a6 = 4.100."
            - "Deltas against rating_level: h1/h2 0.000; h3/h4 -0.118; h5/h6 -0.350; a1 -0.250; a2 +0.250; a3 -0.132; a4 +0.368; a5 +0.100; a6 +0.600."
