  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: entry_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair (state, business_fiscal): entering a RUNNING tournament with an
          unfunded club violates both ERR_TOURNAMENT_INVALID_STATE (p8) and
          ERR_INSUFFICIENT_FUNDS (p13); state priority wins.
        test_recipe:
          setup:
            - "Season ACTIVE; club A balance 0 (unfunded); player with WAIVED membership and rating inside the section band; tournament RUNNING (open -> close -> proctor confirmed -> start)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${season_id}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 1035, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { sec_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/close-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "TOURNAMENT", tournament_id: "${t_id}" }, as: FederationAdmin, captures: { asg: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/tournaments/${t_id}/start", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TOURNAMENT_INVALID_STATE (state p8 outranks fiscal p13 even though club balance 0 < fee 1035) — got ${err}"
            - "HTTP status == 409, not 402"

      - name: entry_referential_beats_constraint
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (business_referential, business_constraint): a player whose membership
          is INVOICED AND whose rating is out of band violates ERR_MEMBERSHIP_REQUIRED
          (p10) and ERR_RATING_OUT_OF_BAND (p11); referential wins. Different
          category pair from entry_state_beats_fiscal.
        test_recipe:
          setup:
            - "Season ACTIVE; club A funded 5000; player rating 500/25 with membership INVOICED (unpaid); tournament REGISTRATION_OPEN with section [1000,1200]"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, club_v: $.data.version } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 5000, memo: "funding", expected_club_version: "${club_v}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9, initial_rating: 500, initial_rated_games: 25 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${season_id}" }, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${season_id}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 1035, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "U1200", min_rating: 1000, max_rating: 1200, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { sec_id: $.data.id } }
          trigger:
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEMBERSHIP_REQUIRED (referential p10 outranks constraint p11 even though rating 500 is outside [1000,1200]) — got ${err}"

      - name: meet_integrity_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair (business_integrity, business_temporal): scheduling a meet whose away
          club is SUSPENDED on a date the host already occupies violates
          ERR_CLUB_SUSPENDED (p9) and ERR_MEET_DATE_CONFLICT (p12); integrity wins.
          Third distinct category pair.
        test_recipe:
          setup:
            - "Season ACTIVE; clubs A, B, C; club B SUSPENDED; meet A(host) vs C already SCHEDULED on 2026-09-05; second meet A(host) vs B on 2026-09-05 in DRAFT"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Gamma", school_name: "G HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_c: $.data.id } }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_c}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet1: $.data.id } }
            - { call: "POST /api/meets/${meet1}/schedule", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs/${club_b}/suspend", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet2: $.data.id } }
          trigger:
            - { call: "POST /api/meets/${meet2}/schedule", payload: {}, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLUB_SUSPENDED (integrity p9 outranks temporal p12 even though host club A also occupies 2026-09-05) — got ${err}"
            - "HTTP status == 403, not 409"
  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: section_rating_band_inclusive_max
        grounds:
          - validations[priority=11]
          - entities.TournamentSection.fields.max_rating
        distinguishing_aspect: |
          Metric = rating points, endpoint = POST /api/sections/{id}/entries: the band
          is INCLUSIVE, so rating == max_rating (1200) is accepted while 1201 is
          rejected with ERR_RATING_OUT_OF_BAND.
        test_recipe:
          setup:
            - "Season ACTIVE; club A funded 5000; two established players (1200/25 and 1201/25) with WAIVED memberships; tournament REGISTRATION_OPEN with section [1000,1200] allow_provisional false"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, club_v: $.data.version } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 5000, memo: "funding", expected_club_version: "${club_v}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "Edge", grade_level: 9, initial_rating: 1200, initial_rated_games: 25 }, as: FederationAdmin, captures: { p_in: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "Over", grade_level: 9, initial_rating: 1201, initial_rated_games: 25 }, as: FederationAdmin, captures: { p_out: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p_in}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p_out}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${season_id}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 1035, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "U1200", min_rating: 1000, max_rating: 1200, allow_provisional: false, max_entries: 10 }, as: FederationAdmin, captures: { sec_id: $.data.id } }
          trigger:
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p_in}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { e_fee: $.data.fee_cents } }
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p_out}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "rating == max_rating (1200): entry created, fee_cents == 1035 (no early-bird configured) — got ${e_fee}"
            - "rating == max_rating + 1 (1201): ERR_RATING_OUT_OF_BAND (409) — got ${err}"

      - name: provisional_threshold_game_count
        grounds:
          - calculations.rating_update
          - entities.Player.fields.is_provisional
        distinguishing_aspect: |
          Metric = rated game count, endpoint = GET /api/players/{id}: at
          rated_games_played == threshold - 1 (3 with T=4) is_provisional is true;
          at exactly threshold (4) it flips to false.
        test_recipe:
          setup:
            - "Season threshold 4 ACTIVE; club A with players P3 (initial_rated_games 3) and P4 (initial_rated_games 4)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P3", grade_level: 9, initial_rating: 1000, initial_rated_games: 3 }, as: FederationAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P4", grade_level: 9, initial_rating: 1000, initial_rated_games: 4 }, as: FederationAdmin, captures: { p4: $.data.id } }
          trigger:
            - { call: "GET /api/players/${p3}", as: FederationAdmin, captures: { p3_prov: $.data.is_provisional } }
            - { call: "GET /api/players/${p4}", as: FederationAdmin, captures: { p4_prov: $.data.is_provisional } }
          assert:
            - "Player.${p3} (3 games, T=4): is_provisional == true — got ${p3_prov}"
            - "Player.${p4} (4 games, T=4): is_provisional == false (>= threshold, not >) — got ${p4_prov}"

      - name: exact_balance_charge_succeeds
        grounds:
          - validations[priority=13]
          - calculations.club_account_balance
        distinguishing_aspect: |
          Metric = cents, endpoint = POST /api/memberships/{id}/pay: a charge leaving
          the balance at exactly 0 succeeds (>= 0), while one cent short (2499 vs
          2500 fee) fails with ERR_INSUFFICIENT_FUNDS.
        test_recipe:
          setup:
            - "Season ACTIVE, regular_due 2500 (default clock before deadline); club A funded exactly 2500 with one INVOICED membership; club B funded 2499 with one INVOICED membership"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id, cbv: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 2500, memo: "fund A", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/clubs/${club_b}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 2499, memo: "fund B", expected_club_version: "${cbv}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "PA", grade_level: 9 }, as: FederationAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "PB", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pa}", season_id: "${season_id}" }, as: FederationAdmin, captures: { ma: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${season_id}" }, as: FederationAdmin, captures: { mb: $.data.id } }
          trigger:
            - { call: "POST /api/memberships/${ma}/pay", payload: {}, as: Treasurer, as_user_id: "treasurer-1", captures: { ma_status: $.data.status } }
            - { call: "GET /api/clubs/${club_a}", as: FederationAdmin, captures: { bal_a: $.data.account_balance_cents } }
            - { call: "POST /api/memberships/${mb}/pay", payload: {}, as: Treasurer, as_user_id: "treasurer-1", captures: { err: $.data.error_id } }
          assert:
            - "Membership.${ma} pay succeeds, status PAID (${ma_status}); Club A balance == 0 exactly (${bal_a})"
            - "Membership.${mb} pay rejected ERR_INSUFFICIENT_FUNDS (402) with 2499 < 2500 — got ${err}"
            - "Membership.${mb}.status remains INVOICED"

      - name: section_capacity_last_seat
        grounds:
          - validations[priority=11]
          - entities.TournamentSection.fields.current_entries
        distinguishing_aspect: |
          Metric = occupancy count, endpoint = POST /api/sections/{id}/entries (same
          endpoint family as the rating band but a different metric): with
          max_entries == 2 the second entry succeeds (current_entries 1 < 2) and the
          third fails with ERR_SECTION_FULL (2 == 2 rejects).
        test_recipe:
          setup:
            - "Season ACTIVE; fee-0 tournament REGISTRATION_OPEN with section max_entries 2; three players with WAIVED memberships"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P2", grade_level: 9 }, as: FederationAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P3", grade_level: 9 }, as: FederationAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p2}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p3}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m3: $.data.id } }
            - { call: "POST /api/memberships/${m3}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${season_id}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 0, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 2 }, as: FederationAdmin, captures: { sec_id: $.data.id } }
          trigger:
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p2}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { e2_id: $.data.id } }
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p3}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "Entry 2 created at current_entries == 1 (< max 2): id ${e2_id}"
            - "Entry 3 rejected ERR_SECTION_FULL (409) at current_entries == 2 == max_entries — got ${err}"
            - "TournamentSection.${sec_id}.current_entries == 2"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pairing_report_requires_meet_in_progress
        grounds:
          - state_machines.Pairing.SCHEDULED_to_REPORTED
          - state_machines.Meet
        distinguishing_aspect: |
          Pair Pairing->Meet: reporting a result on a pairing whose meet is only
          PAIRINGS_PUBLISHED (not IN_PROGRESS) fails with ERR_MEET_INVALID_STATE even
          though the pairing itself is in a valid from-state.
        test_recipe:
          setup:
            - "Season ACTIVE; clubs A,B with players+waived memberships; meet with one pairing created and PAIRINGS_PUBLISHED but not started"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W", grade_level: 9 }, as: FederationAdmin, captures: { pw: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pw}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pw}", black_player_id: "${pb}", expected_meet_version: "${mv}" }, as: FederationAdmin, captures: { pair_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/publish-pairings", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/pairings/${pair_id}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEET_INVALID_STATE (meet PAIRINGS_PUBLISHED, not IN_PROGRESS) — got ${err}"
            - "Pairing.${pair_id}.status remains SCHEDULED"

      - name: entry_requires_tournament_registration_open
        grounds:
          - state_machines.TournamentEntry
          - state_machines.Tournament
        distinguishing_aspect: |
          Pair TournamentEntry->Tournament (different pair from Pairing->Meet):
          creating an entry while the tournament is DRAFT fails with
          ERR_TOURNAMENT_INVALID_STATE regardless of player eligibility.
        test_recipe:
          setup:
            - "Season ACTIVE; club A; player with WAIVED membership; tournament in DRAFT with an OPEN section"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${season_id}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 0, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { sec_id: $.data.id } }
          trigger:
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TOURNAMENT_INVALID_STATE (tournament DRAFT) — got ${err}"
