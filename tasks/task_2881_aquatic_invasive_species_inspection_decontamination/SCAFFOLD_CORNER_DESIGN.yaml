            - "InspectionStation.${st_id}.status == CLOSED and version == ${st_v_closed} (no bump on a rejected call)"
            - "control: target_status SUSPENDED also returns 409 ERR_INVALID_STATION_STATE"
            - "control: target_status CLOSED again also returns 409 ERR_INVALID_STATION_STATE - the terminal state is not idempotently re-enterable"

      - name: invalid_transition_disposition_before_screening_rejected
        claim_type: invalid_transitions
        grounds:
