            - "after the first SUBMIT, CompletionCertification.${cert_id}.packet_status == ASSEMBLING"
            - "after the first SUBMIT, CompletionCertification.${cert_id}.submitted_at == null"
            - "Cohort.${cohort_id}.status == CLOSED after the close call"
            - "the second SUBMIT returns 422 with error_id ERR_LICENSE_RECOMMENDATION_MISSING"
            - "the second SUBMIT error_id is NOT ERR_COHORT_STATE_INVALID"
            - "CompletionCertification.${cert_id}.packet_status == ASSEMBLING"
            - "NoviceTeacher.${novice_id}.license_advancement_status == NOT_ELIGIBLE"

  - rule_id: resource_temporal_overlap
    instances:

      - name: mentor_observation_buffered_closed_interval
        grounds:
          - validations[priority=24]
          - entities.ObservationCycle.fields.window_start
          - entities.ObservationCycle.fields.window_end
          - state_machines.ObservationCycle.PRE_CONFERENCE_to_OBSERVED
        distinguishing_aspect: |
          RESOURCE = the Mentor's own calendar, with CLOSED-INTERVAL semantics expanded by
          an OBSERVATION_BUFFER_MINUTES 30 travel buffer: a gap of exactly 30 minutes still
          collides (409) and only a 31 minute gap is accepted, so touching or merely
          adjacent windows are forbidden.
        test_recipe:
          setup:
            - "Open Site, CERTIFIED MATH Mentor, MATH NoviceTeacher, ACTIVE MentorMatch."
            - "The clock stays at its startup value 2026-08-01T00:00:00Z."
            - "ObservationCycle cycle_index 1 occupies the closed window 2026-08-05T09:00:00Z-2026-08-05T10:00:00Z and stays in PRE_CONFERENCE, so it is inside the conflict-bearing phase set."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /observation-cycles"
              payload: { match_id: "${match_id}", cycle_index: 1, window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T10:00:00Z" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { rc1_id: $.data.id }
          trigger:
            - call: "POST /observation-cycles"
              payload: { match_id: "${match_id}", cycle_index: 2, window_start: "2026-08-05T10:25:00Z", window_end: "2026-08-05T11:25:00Z" }
              as: Mentor
              as_user_id: "${mentor_id}"
            - call: "POST /observation-cycles"
              payload: { match_id: "${match_id}", cycle_index: 3, window_start: "2026-08-05T10:30:00Z", window_end: "2026-08-05T11:30:00Z" }
              as: Mentor
              as_user_id: "${mentor_id}"
            - call: "POST /observation-cycles"
              payload: { match_id: "${match_id}", cycle_index: 4, window_start: "2026-08-05T10:31:00Z", window_end: "2026-08-05T11:31:00Z" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { rc4_id: $.data.id }
          assert:
            - "cycle_index 2 (gap 25 minutes) returns 409 with error_id ERR_OBSERVATION_WINDOW_CONFLICT"
            - "cycle_index 3 (gap exactly 30 minutes) returns 409 with error_id ERR_OBSERVATION_WINDOW_CONFLICT"
            - "cycle_index 4 (gap 31 minutes) returns 201"
            - "ObservationCycle.${rc4_id}.phase == PRE_CONFERENCE"
            - "GET /observation-cycles?match_id=${match_id} returns total_count == 2"

      - name: cohort_seminar_half_open_adjacency_allowed
        grounds:
          - validations[priority=25]
          - validations[priority=26]
          - entities.SeminarSession.fields.scheduled_start
          - entities.SeminarSession.fields.scheduled_minutes
        distinguishing_aspect: |
          A DIFFERENT RESOURCE (the Cohort's seminar calendar, not a Mentor's) under
          DIFFERENT INTERVAL SEMANTICS (HALF-OPEN with no buffer): exactly adjacent
          sessions 14:00-16:00 and 16:00-18:00 are both accepted, a one minute
          intersection is refused with ERR_SEMINAR_SESSION_OVERLAP, and a fully disjoint
          session on another day is still refused - by the aggregate 240 minute ISO-week
          cap rather than by overlap.
        test_recipe:
          setup:
            - "One open Site and one Cohort in region NORTH."
            - "Session 1: session_index 1, 2026-08-03T14:00Z-16:00Z (Monday of ISO week 2026-W32), scheduled_minutes 120."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 1, topic: "Classroom routines seminar", scheduled_start: "2026-08-03T14:00:00Z", scheduled_end: "2026-08-03T16:00:00Z" }
              as: ProgramAdmin
              captures: { ts1_id: $.data.id }
          trigger:
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 2, topic: "Formative assessment seminar", scheduled_start: "2026-08-03T16:00:00Z", scheduled_end: "2026-08-03T18:00:00Z" }
              as: ProgramAdmin
              captures: { ts2_id: $.data.id }
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 3, topic: "Family engagement seminar", scheduled_start: "2026-08-03T17:59:00Z", scheduled_end: "2026-08-03T19:59:00Z" }
              as: ProgramAdmin
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 4, topic: "Reflective practice clinic", scheduled_start: "2026-08-04T14:00:00Z", scheduled_end: "2026-08-04T14:30:00Z" }
              as: ProgramAdmin
          assert:
            - "session_index 2, starting exactly when session 1 ends, returns 201"
            - "SeminarSession.${ts2_id}.scheduled_minutes == 120"
            - "session_index 3, intersecting session 2 by one minute, returns 409 with error_id ERR_SEMINAR_SESSION_OVERLAP"
            - "session_index 4, disjoint from every existing session but pushing ISO week 2026-W32 to 270 minutes, returns 422 with error_id ERR_COHORT_WEEKLY_SEMINAR_CAP_EXCEEDED"
            - "session_index 4 error_id is NOT ERR_SEMINAR_SESSION_OVERLAP"
            - "GET /seminar-sessions?cohort_id=${cohort_id} returns total_count == 2"

  - rule_id: compensating_invariant
    instances:

      - name: void_restores_verified_minute_ledger
        grounds:
          - state_machines.ContactLog.VERIFIED_to_VOIDED
          - entities.MentorMatch.fields.verified_minutes_total
          - entities.Mentor.fields.verified_minutes_lifetime
          - entities.NoviceTeacher.fields.verified_contact_minutes
          - calculations.contact_log_credited_minutes
        distinguishing_aspect: |
          CONSERVED QUANTITY = credited CONTACT MINUTES: after the void, every one of the
          three minute ledgers (MentorMatch.verified_minutes_total,
          Mentor.verified_minutes_lifetime, NoviceTeacher.verified_contact_minutes) equals
          the sum of credited_minutes over the remaining VERIFIED logs exactly, with no
          drift and no residue left on the voided row.
        test_recipe:
          setup:
            - "Open Site, CERTIFIED MATH Mentor, MATH NoviceTeacher, ACTIVE MentorMatch with subject_match_tier EXACT."
            - "Clock advanced to 2026-08-07T12:00:00Z."
            - "Log 1 dated 2026-08-05, ONE_ON_ONE, 120 minutes, VERIFIED -> credited 120, stipend round_half_up(120/60 * 4200) = 8400."
            - "Log 2 dated 2026-08-06, MODEL_LESSON, 80 minutes, VERIFIED -> weighted floor(80 * 1.25) = 100 credited minutes, stipend round_half_up(100/60 * 4200) = 7000."
            - "Ledgers before the trigger: 220 credited minutes and 15400 cents on the match."
            - "No StipendDisbursement is APPROVED or PAID, so the void precondition holds."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
