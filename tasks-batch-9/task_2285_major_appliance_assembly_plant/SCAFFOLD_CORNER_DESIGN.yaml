      - name: cut_in_precondition_priority_is_line_stopped_then_index_then_replacement
        claim_type: priority_ordering
        grounds:
          - validations[priority 17] ERR_LINE_NOT_STOPPED
          - validations[priority 18] ERR_CUT_IN_INDEX_TOO_LOW
          - validations[priority 19] ERR_REPLACEMENT_PART_REQUIRED
        distinguishing_aspect: "One cut-in call can violate three rules at once; the §1.4 order decides which surfaces. EC-A (index 1, no replacement) on a RUNNING line answers ERR_LINE_NOT_STOPPED, the same call after the stop answers ERR_CUT_IN_INDEX_TOO_LOW, and EC-B (index 5, no replacement) answers ERR_REPLACEMENT_PART_REQUIRED — as does supplying the affected part as its own replacement."
