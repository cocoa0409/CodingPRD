            - "run create: HTTP 201, data.packet_count == 2, data.mean_coverage_pct == 73.50, data.adoption_factor == 0.7350"
            - "data.verified_acres == 1000.00 — min(enrolled_acres 1000.00, 1000.00 + 1000.00) caps the double-counted acres"
            - "data.gross_removals_t == 257.250, data.uncertainty_deduction_t == 30.870 (baseline 7.00 + MODEL adder 5.00), data.net_removals_t == 226.380"
            - "data.sampling_uncertainty_pct == null — the sampling curve belongs to MEASUREMENT only"
            - "no assert value matches the three-packet arithmetic (mean 82.33), so the PENDING packet is provably excluded"

      - name: material_discrepancy_threshold_gates_only_positive_opinions
        claim_type: correct_result
        grounds:
          - calculations.verification_discrepancy
          - validations[priority=21]
          - errors[ERR_MATERIAL_DISCREPANCY_EXCEEDED]
          - state_machines.Verification.transitions.QUALIFIED_to_PENDING
        distinguishing_aspect: "Against a frozen net_removals_t of 283.360 a restatement of 300.000 is 5.87% and blocks a POSITIVE opinion, the SAME 41.16% restatement of 400.000 sails through as QUALIFIED (the gate is opinion-conditional), and 297.528 is exactly 5.00% and passes because equality is inclusive."
        test_recipe:
          setup:
            - "the ACTIVE-enrollment chain with a single 2026 EQUIPMENT_TELEMETRY packet at coverage 92.00 PASSED, a MODEL run with net_removals_t 283.360 SUBMITTED, and one PENDING Verification at sample_pct 10.00"
            - "one ACCREDITED verification body accredited for COVER_CROP with max_concurrent_visits 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: true, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Discrepancy Farms", operator_type: "LLC", tax_id: "TX-2003-C", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "Disc 1", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "LOAM" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-D1" }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2022, practice_code: "COVER_CROP", adopted: true, evidence_source: "REMOTE_SENSING", acres: 500.00, observed_emissions_per_acre: 0.1200 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2023, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1500 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2024, practice_code: "COVER_CROP", adopted: false, evidence_source: "EQUIPMENT_TELEMETRY", acres: 0.00, observed_emissions_per_acre: 0.1600 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2025, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1700 }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
