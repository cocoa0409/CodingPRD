      - name: match_activation_requires_certified_mentor
        grounds:
          - state_machines.MentorMatch.PROPOSED_to_ACTIVE
          - state_machines.Mentor.CERTIFIED_to_SUSPENDED
          - state_machines.Mentor.SUSPENDED_to_CERTIFIED
          - validations[priority=23]
        distinguishing_aspect: |
          ENTITY PAIR MentorMatch -> Mentor: the MentorMatch PROPOSED->ACTIVE transition is
          gated on Mentor.certification_status == CERTIFIED, so the identical request is
          refused with ERR_MENTOR_NOT_CERTIFIED (422) while the mentor is SUSPENDED and
          succeeds unchanged once the mentor is REINSTATEd.
        test_recipe:
          setup:
            - "Open Site, Mentor CERTIFIED after 18 training hours, MATH NoviceTeacher, and a MentorMatch left in PROPOSED (never activated)."
            - "The mentor is then SUSPENDED; because the match is only PROPOSED, no cascade touches it."
            - "The clock stays at its startup value 2026-08-01T00:00:00Z, which is before certification_expires_on 2027-08-01, so REINSTATE is permitted."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "SUSPEND", reason: "Fingerprint clearance expired pending renewal" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
          trigger:
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "REINSTATE" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
          assert:
            - "the first ACTIVATE returns 422 with error_id ERR_MENTOR_NOT_CERTIFIED"
            - "after the first ACTIVATE, MentorMatch.${match_id}.match_status == PROPOSED"
            - "after the first ACTIVATE, MentorMatch.${match_id}.pinned_stipend_rate_cents_per_hour == null"
            - "after the first ACTIVATE, Mentor.${mentor_id}.active_caseload_count == 0"
            - "after the REINSTATE, Mentor.${mentor_id}.certification_status == CERTIFIED"
            - "the second ACTIVATE returns 200 and MentorMatch.${match_id}.match_status == ACTIVE"
            - "MentorMatch.${match_id}.pinned_stipend_rate_cents_per_hour == 4200"
            - "Mentor.${mentor_id}.active_caseload_count == 1"
            - "Site.${site_id}.active_match_count == 1"
            - "NoviceTeacher.${novice_id}.program_status == ACTIVE"

      - name: packet_submission_requires_closed_cohort
        grounds:
          - state_machines.CompletionCertification.ASSEMBLING_to_SUBMITTED_TO_STATE
          - state_machines.Cohort.FORMING_to_CLOSED
          - validations[priority=20]
          - validations[priority=33]
          - concurrency_rules[packet-create-stale-novice]
        distinguishing_aspect: |
          A DIFFERENT ENTITY PAIR, CompletionCertification -> Cohort: the packet's
          ASSEMBLING->SUBMITTED_TO_STATE transition is gated on Cohort.status == CLOSED, so
          the submission is refused with ERR_COHORT_STATE_INVALID (422) while the cohort is
          FORMING, and after the cohort closes the SAME request advances past that gate and
          is stopped by the next rung of the ladder, ERR_LICENSE_RECOMMENDATION_MISSING
          (422, priority 33) - proving the cohort gate itself cleared.
