  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_date_uniqueness_non_voided_overlap
        grounds:
          - validations[priority=14]
          - entities.DailySettlement.fields.business_date
        distinguishing_aspect: |
          Interval semantics = whole-day point occupancy on DailySettlement: a
          second settlement for the SAME business_date collides with an existing
          non-VOIDED settlement (ERR_SETTLEMENT_DATE_TAKEN), but a VOIDED one frees
          the date — exact-equality day collision, no adjacency or buffer.
        test_recipe:
          setup:
            - "One OPEN settlement for 2026-06-06."
          setup_api_calls:
            - call: "POST /settlements"
              payload: { business_date: "2026-06-06" }
              as: SettlementManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /settlements"
              payload: { business_date: "2026-06-06" }
              as: SettlementManager
              captures: { err: $.data.error_id }
          assert:
            - "second POST /settlements -> 409 ERR_SETTLEMENT_DATE_TAKEN"

      - name: item_return_window_half_open_interval_on_floor_age
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - entities.Item.fields.floor_date
          - entities.ConsignorAgreement.fields.return_window_days
        distinguishing_aspect: |
          Interval semantics = half-open aging window on a single Item's floor_date
          (distinct resource and arithmetic from settlement day-equality): at age
          exactly return_window_days the item is INSIDE the dispose window
          (>= boundary inclusive) so pull is rejected ERR_RETURN_WINDOW_ELAPSED and
          dispose is allowed; at age window-1 the reverse holds.
