            - { call: "GET /policy-documents/${d1}", payload: {}, as: PolicyAuthor, captures: { d1v2: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 rev", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v2}" }, as: PolicyAuthor, captures: { v2: "$.data.id" } }
          trigger:
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA rider on v1" }, as: PolicyAuthor, captures: { a_ca1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ny}", body_text: "NY rider on v1" }, as: PolicyAuthor, captures: { a_ny1: "$.data.id" } }
