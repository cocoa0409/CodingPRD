  # =========================================================================
  # Rule 4 — transitive_cascade (two depth-3 chains, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: evidence_conversion_depth3_cascade
        grounds:
          - state_machines.ReferralCase.IN_CUSTODY_to_CONVERTED_TO_EVIDENCE
          - state_machines.Item.IN_LE_CUSTODY_to_EVIDENCE
        distinguishing_aspect: |
          Depth-3 chain from POST /referrals/{id}/convert-to-evidence:
          ReferralCase -> CONVERTED_TO_EVIDENCE (hop 1) causes Item -> EVIDENCE
          (hop 2) which causes the STAYED Claim -> REJECTED with
          decision_reason ITEM_EVIDENCE (hop 3). Each hop is caused by the
          previous hop, not directly by the trigger.
        test_recipe:
          setup:
            - "TRANSIT program, LOW policy, location, one item LISTED"
            - "claim UNDER_REVIEW on the item (stayed by the referral)"
            - "item in IN_LE_CUSTODY via referral + confirm-pickup"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${c1}", proof_serial: true, proof_photo: false, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v}" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
            - call: "POST /items/${it}/refer-to-law-enforcement"
              payload: { agency_name: "CPD", case_number: "C-200" }
              as: PoliceLiaison
              as_user_id: "liaison-1"
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/confirm-pickup"
              as: PoliceLiaison
              as_user_id: "liaison-1"
          trigger:
            - call: "POST /referrals/${ref}/convert-to-evidence"
              as: PoliceLiaison
              as_user_id: "liaison-1"
          assert:
            - "ReferralCase.${ref}.status == CONVERTED_TO_EVIDENCE (hop 1)"
            - "Item.${it}.status == EVIDENCE (hop 2, caused by hop 1)"
            - "Claim.${cl}.status == REJECTED and Claim.${cl}.decision_reason == \"ITEM_EVIDENCE\" (hop 3, caused by hop 2 — the claim was STAYED, not UNDER_REVIEW, when the conversion happened)"
      - name: claim_approval_competing_rejection_cascade
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.Item.STORED_to_RELEASE_PENDING
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (POST /claims/{id}/approve):
          winning Claim -> APPROVED (hop 1) causes Item -> RELEASE_PENDING
          (hop 2) which causes the competing Claim -> REJECTED with
          decision_reason ITEM_AWARDED (hop 3).
        test_recipe:
          setup:
            - "TRANSIT program, MID policy, location, one MID item STORED"
            - "claim A (score 70) UNDER_REVIEW; competing claim B (serial only) SUBMITTED on the same item"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "MID", retention_days: 30, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 50000, description: "mid phone", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Owner A", email: "a@x.com" }
              as: PublicUser
              captures: { ca: $.data.id }
            - call: "POST /claimants"
              payload: { full_name: "Owner B", email: "b@x.com" }
              as: PublicUser
              captures: { cb: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${ca}", proof_serial: true, proof_photo: true, proof_receipt: true, proof_description_detail: "DETAILED", expected_item_version: "${it_v}" }
              as: Claimant
              as_user_id: "${ca}"
              captures: { cl_a: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${cb}", proof_serial: true, proof_photo: false, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v} + 1" }
              as: Claimant
              as_user_id: "${cb}"
              captures: { cl_b: $.data.id }
            - call: "POST /claims/${cl_a}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
          trigger:
            - call: "POST /claims/${cl_a}/approve"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
          assert:
            - "Claim.${cl_a}.status == APPROVED (hop 1)"
            - "Item.${it}.status == RELEASE_PENDING (hop 2, caused by hop 1)"
            - "Claim.${cl_b}.status == REJECTED and Claim.${cl_b}.decision_reason == \"ITEM_AWARDED\" (hop 3, caused by hop 2)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_over_safety_on_disposed_release
        grounds:
          - "validations[priority=6]"
          - "validations[priority=12]"
        distinguishing_aspect: |
          Category pair state vs business_safety: the release request violates
          BOTH (item is DISPOSED -> state failure) AND (release officer id ==
          intake officer id -> segregation failure). Priority 6 beats 12, so
          the observable error is ERR_INVALID_STATE, not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "TRANSIT program with LOW policy (10 days, DESTRUCTION), location, one LOW item taken through sweep to DISPOSAL_PENDING and disposed (terminal DISPOSED)"
            - "item was registered by officer-intake-1"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "DESTRUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /items/${it}/dispose"
              payload: { method: "DESTRUCTION" }
              as: PropertyCustodian
              as_user_id: "custodian-1"
          trigger:
            - call: "POST /items/${it}/release"
              payload: { handover_method: "IN_PERSON", id_document_ref: "DL-123" }
              as: ReleaseOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\" (state priority 6 beats business_safety priority 12 even though segregation is also violated: officer-intake-1 did the intake)"
            - "Item.${it}.status == DISPOSED (unchanged)"
            - "GET /release-records?item_id=${it} returns an empty list (no ReleaseRecord created)"
      - name: referential_over_fiscal_on_lot_add
        grounds:
          - "validations[priority=24]"
          - "validations[priority=25]"
        distinguishing_aspect: |
          Category pair business_referential vs business_fiscal: adding the
          item violates BOTH cross-program consistency (item program FACILITY
          != event program TRANSIT) AND the venue insurance cap (floor 501 >
          cap 1). Priority 24 beats 25, so the observable error is
          ERR_CROSS_PROGRAM_REFERENCE, not ERR_INSURANCE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "TRANSIT program with venue (insurance_cap_cents 1), event, and DRAFT lot"
            - "FACILITY program with LOW policy + location; FACILITY item (5005 cents) swept to AUCTION_ELIGIBLE"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id }
            - call: "POST /programs"
              payload: { name: "Facility L&F", program_type: "FACILITY", contact_email: "f@city.gov" }
              as: ProgramAdmin
              captures: { pf: $.data.id, pf_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pf}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pf_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pf}", name: "Cage F", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_f: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pf}", storage_location_id: "${loc_f}", category: "ELECTRONICS", declared_value_cents: 5005, description: "charger", found_at: "2026-08-01T09:00:00Z", found_location: "City Hall" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Tiny Hall", address: "2 Depot St", insurance_cap_cents: 1 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Aug Sale", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev: $.data.id }
            - call: "POST /auction-lots"
              payload: { event_id: "${ev}", title: "Lot X" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /auction-lots/${lot}/items"
              payload: { item_id: "${it}", expected_lot_version: "${lot_v}" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_CROSS_PROGRAM_REFERENCE\" (business_referential priority 24 beats business_fiscal priority 25 even though the floor price 501 also exceeds the insurance cap of 1)"
            - "Item.${it}.status == AUCTION_ELIGIBLE (unchanged)"
            - "GET /auction-lots/${lot}.data.minimum_bid_cents == 0 (no LotItem created)"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics + endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: value_tier_boundary_inclusive
        grounds:
          - calculations.item_value_tier
        distinguishing_aspect: |
          Monetary metric boundary on POST /items: declared_value_cents of
          exactly 100000 lands in HIGH (>= 100000), while 99999 lands in MID.
          The resolved retention_policy_id must follow the tier.
        test_recipe:
          setup:
            - "TRANSIT program with MID (30d) and HIGH (90d) ELECTRONICS policies and a secure location"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "MID", retention_days: 30, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
              captures: { pol_mid: $.data.id }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "HIGH", retention_days: 90, disposal_method: "AUCTION", expected_program_version: "${pt_v} + 1" }
              as: ProgramAdmin
              captures: { pol_high: $.data.id }
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 100000, description: "at boundary", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { i_hi: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 99999, description: "one cent below", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { i_mid: $.data.id }
          assert:
            - "Item.${i_hi}.value_tier == \"HIGH\" (100000 >= 100000, inclusive)"
            - "Item.${i_hi}.retention_policy_id == ${pol_high}"
            - "Item.${i_mid}.value_tier == \"MID\" (99999 < 100000)"
            - "Item.${i_mid}.retention_policy_id == ${pol_mid}"
      - name: retention_deadline_exact_equality_sweep
        grounds:
          - calculations.retention_deadline
          - state_machines.Item.STORED_to_AUCTION_ELIGIBLE
        distinguishing_aspect: |
          Timestamp metric boundary on POST /_sweeps/retention: an item whose
          deadline equals the current clock exactly (>= comparison) IS swept,
          while an item expiring one second later is NOT — a different metric
          (time vs cents) reached through a different endpoint than the
          value-tier boundary.
        test_recipe:
          setup:
            - "TRANSIT program with LOW policy (retention_days 10), location"
            - "item1 found 2026-08-01T09:00:00Z (deadline 2026-08-11T09:00:00Z); item2 found 2026-08-01T09:00:01Z (deadline 2026-08-11T09:00:01Z)"
            - "logical clock pinned at exactly 2026-08-11T09:00:00Z"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item 1", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { i1: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item 2", found_at: "2026-08-01T09:00:01Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { i2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
              captures: { swept_count: $.data.transitioned_count }
          assert:
            - "swept_count == 1"
            - "Item.${i1}.status == AUCTION_ELIGIBLE (current_utc >= retention_deadline, equality included)"
            - "Item.${i2}.status == STORED (deadline one second in the future)"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_create_blocked_by_item_referral
        grounds:
          - "validations[priority=7]"
          - state_machines.Item.STORED_to_REFERRED_TO_LE
        distinguishing_aspect: |
          Pair (Claim, Item): claim creation is gated on the Item's state;
          once the item is REFERRED_TO_LE the claim is rejected with
          ERR_ITEM_NOT_CLAIMABLE even though the OCC version is fresh.
        test_recipe:
          setup:
            - "TRANSIT program, LOW policy, location, one item (version 1 at intake)"
            - "item referred to law enforcement (version advances to 2)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /items/${it}/refer-to-law-enforcement"
              payload: { agency_name: "CPD", case_number: "C-300" }
              as: PoliceLiaison
              as_user_id: "liaison-1"
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${c1}", proof_serial: true, proof_photo: false, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v} + 1" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_ITEM_NOT_CLAIMABLE\" (item REFERRED_TO_LE is outside {STORED, LISTED})"
            - "the fresh OCC version (${it_v} + 1 == 2) passes priority 5, proving the rejection comes from the cross-entity Item state gate at priority 7"
      - name: item_move_blocked_by_inactive_location
        grounds:
          - "validations[priority=14]"
          - state_machines.Item
        distinguishing_aspect: |
          Pair (Item, StorageLocation) — a different pair than (Claim, Item):
          the Item move transition is gated on the destination
          StorageLocation's active flag; a deactivated location rejects with
          ERR_LOCATION_INACTIVE.
        test_recipe:
          setup:
            - "TRANSIT program, LOW policy, locations A (holding the item) and B (empty, then deactivated)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage A", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage B", capacity_slots: 5, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_a}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /storage-locations/${loc_b}/deactivate"
              as: ProgramAdmin
          trigger:
            - call: "POST /items/${it}/move"
              payload: { storage_location_id: "${loc_b}" }
              as: PropertyCustodian
              as_user_id: "custodian-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_LOCATION_INACTIVE\""
            - "Item.${it}.storage_location_id == ${loc_a} (unchanged)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_half_open_interval_adjacency
        grounds:
          - "validations[priority=22]"
        distinguishing_aspect: |
          Half-open interval semantics on the Venue resource: windows
          [10:00, 12:00) and [12:00, 14:00) touch but do not overlap, so both
          book; [11:59:59, 13:00) overlaps the first by one second and is
          rejected with ERR_VENUE_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "TRANSIT program with one venue"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id }
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "E1", starts_at: "2026-09-01T10:00:00Z", ends_at: "2026-09-01T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { e1: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "E2", starts_at: "2026-09-01T12:00:00Z", ends_at: "2026-09-01T14:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { e2: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "E3", starts_at: "2026-09-01T11:59:59Z", ends_at: "2026-09-01T13:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "AuctionEvent.${e1} and AuctionEvent.${e2} are both created (adjacency at exactly 12:00:00Z is allowed — half-open semantics)"
            - "err == \"ERR_VENUE_DOUBLE_BOOKED\" (one-second overlap rejected)"
      - name: storage_aggregate_capacity_semantics
        grounds:
          - "validations[priority=16]"
          - calculations.storage_occupancy
        distinguishing_aspect: |
          Aggregate-capacity semantics on the StorageLocation resource (not
          interval adjacency): occupation is a point-in-time count over a
          state-filtered item set. A third intake at occupied == capacity is
          rejected; after one item leaves the occupying set (IN_LE_CUSTODY
          frees its slot), the same intake succeeds.
        test_recipe:
          setup:
            - "TRANSIT program, LOW policy, location with capacity_slots == 2"
            - "two items stored (occupied_slots == 2)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 2, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item A", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { ia: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item B", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
          trigger:
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item C", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
            - call: "POST /items/${ia}/refer-to-law-enforcement"
              payload: { agency_name: "CPD", case_number: "C-400" }
              as: PoliceLiaison
              as_user_id: "liaison-1"
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/confirm-pickup"
              as: PoliceLiaison
              as_user_id: "liaison-1"
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item C", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { ic: $.data.id }
          assert:
            - "err == \"ERR_STORAGE_CAPACITY_EXCEEDED\" (occupied 2 == capacity 2 rejects the third intake)"
            - "after confirm-pickup, GET /storage-locations/${loc}.data.occupied_slots == 1 (IN_LE_CUSTODY frees the slot)"
            - "second item-C intake succeeds (201) and GET /storage-locations/${loc}.data.occupied_slots == 2"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: move_round_trip_conserves_total_occupancy
        grounds:
          - calculations.storage_occupancy
        distinguishing_aspect: |
          Conserved quantity: total occupied slot count across the two
          locations. A move A->B followed by its compensating move B->A leaves
          occupied_slots(A) + occupied_slots(B) == 1 at every step and returns
          each location to its exact original count (1 and 0).
        test_recipe:
          setup:
            - "TRANSIT program, LOW policy, locations A and B (capacity 10 each)"
            - "one item in A (occupied A=1, B=0)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage A", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage B", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_a}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
          trigger:
            - call: "POST /items/${it}/move"
              payload: { storage_location_id: "${loc_b}" }
              as: PropertyCustodian
              as_user_id: "custodian-1"
            - call: "GET /storage-locations/${loc_a}"
              as: PropertyCustodian
              captures: { occ_a_mid: $.data.occupied_slots }
            - call: "GET /storage-locations/${loc_b}"
              as: PropertyCustodian
              captures: { occ_b_mid: $.data.occupied_slots }
            - call: "POST /items/${it}/move"
              payload: { storage_location_id: "${loc_a}" }
              as: PropertyCustodian
              as_user_id: "custodian-1"
            - call: "GET /storage-locations/${loc_a}"
              as: PropertyCustodian
              captures: { occ_a_end: $.data.occupied_slots }
            - call: "GET /storage-locations/${loc_b}"
              as: PropertyCustodian
              captures: { occ_b_end: $.data.occupied_slots }
          assert:
            - "occ_a_mid == 0 and occ_b_mid == 1 (after forward move)"
            - "occ_a_end == 1 and occ_b_end == 0 (compensating move restores exact originals)"
            - "occupied_slots(A) + occupied_slots(B) == 1 at every observed step (conserved quantity)"
      - name: lot_add_remove_conserves_auction_pool
        grounds:
          - calculations.lot_minimum_bid
          - state_machines.Item.AUCTION_ELIGIBLE_to_LOTTED
        distinguishing_aspect: |
          Conserved quantity: auction-pool cardinality count(AUCTION_ELIGIBLE)
          + count(LOTTED) for the item (== 1), and the lot's minimum_bid_cents.
          Add then compensating remove leaves the pool cardinality unchanged,
          the item back in AUCTION_ELIGIBLE, and minimum_bid_cents back at 0.
        test_recipe:
          setup:
            - "TRANSIT program, LOW policy, location, venue, event, DRAFT lot"
            - "one LOW item (5005 cents) swept to AUCTION_ELIGIBLE"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5005, description: "charger", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Aug Sale", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev: $.data.id }
            - call: "POST /auction-lots"
              payload: { event_id: "${ev}", title: "Lot X" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /auction-lots/${lot}/items"
              payload: { item_id: "${it}", expected_lot_version: "${lot_v}" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
            - call: "GET /auction-lots/${lot}"
              as: AuctionCoordinator
              captures: { min_after_add: $.data.minimum_bid_cents }
            - call: "DELETE /auction-lots/${lot}/items/${it}"
              as: AuctionCoordinator
              as_user_id: "coord-1"
            - call: "GET /auction-lots/${lot}"
              as: AuctionCoordinator
              captures: { min_after_remove: $.data.minimum_bid_cents }
          assert:
            - "min_after_add == 501 (single LOW 5005-cent item floor)"
            - "min_after_remove == 0 (compensating remove restores the exact original aggregate)"
            - "Item.${it}.status == AUCTION_ELIGIBLE after removal (pool cardinality count(AUCTION_ELIGIBLE)+count(LOTTED) == 1 before and after)"
            - "Item.${it}.unsold_count == 0 (manual removal is not an unsold cycle)"
