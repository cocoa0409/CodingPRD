  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_state_lock_precedes_liability_cap_on_double_adjudication
        category_pair: "state (priority 17) vs business_fiscal (priority 69)"
        grounds:
          - validations[priority=17]
          - validations[priority=69]
          - calculations.claim_settlement
          - entities.WarrantyProgram.fields.accrued_liability_cents
          - entities.WarrantyProgram.fields.liability_cap_cents
        distinguishing_aspect: |
          The second adjudication of an already-approved claim violates BOTH the state gate and the
          fiscal cap (370592 already booked against a 400000 cap, another 370592 requested), and the
          server must answer with the priority-17 ERR_CLAIM_NOT_ADJUDICABLE, not the priority-69
          ERR_LIABILITY_CAP_EXCEEDED - which the companion call on a second claim proves is genuinely
          armed rather than merely unreachable.
        test_recipe:
          setup:
            - "Program with liability_cap_cents set to 400000; everything else on the reference price book."
            - "Two vehicles, each in service 2020-03-10 with five fresh snapshots giving retention 70.00 % and two faulted modules, so each claim's MODULE_REPLACEMENT settles at remedy_cost_cents 363092 / oem_total_cents 370592 under FULL_COVERAGE."
            - "Claim A is adjudicated once, taking accrued_liability_cents from 0 to 370592 - inside the 400000 cap."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020", liability_cap_cents: 400000 }
