# =============================================================================
# Task 1578: Pump & Valve Repair / Rebuild Center — §1.9 Scaffold Corner Design
# Breadth coverage of every §1.1–§1.7 claim not already covered by §1.8.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_defaults_and_required_fields
        claim_type: creation
        grounds: [entities.Customer, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting pool_program applies default false; omitting required account_number returns ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Alta Gas", account_number: "AG-100", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id, cust_pool: $.data.pool_program } }
          trigger:
            - { call: "POST /customers", payload: { name: "Broken Account", credit_limit_cents: 100, warranty_terms_days: 30 }, as: ServiceManager, captures: { err: $.data.error_id } }
          assert:
            - "Customer.${cust}.pool_program == false (default applied)"
            - "Customer.${cust}.pool_available_count == 0"
            - "missing account_number -> error_id == ERR_VALIDATION (400)"

      - name: asset_conditional_nameplate_fields
        claim_type: type_constraints
        grounds: [entities.Asset.fields.set_pressure_psig, entities.Asset.fields.rated_flow_gpm, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "set_pressure_psig is required iff equipment_class == SAFETY_RELIEF_VALVE and forbidden on PUMP; rated_flow_gpm required iff PUMP."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Borealis", account_number: "BO-110", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "SRV-X", equipment_class: "SAFETY_RELIEF_VALVE", manufacturer: "Consolidated", model: "1900" }, as: IntakeCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-X", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", set_pressure_psig: 100 }, as: IntakeCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-Y", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { a: $.data.id } }
          assert:
            - "SRV without set_pressure_psig -> err1 == ERR_VALIDATION"
            - "PUMP with set_pressure_psig -> err2 == ERR_VALIDATION"
            - "PUMP with rated_flow_gpm -> 201; Asset.${a}.test_standard == SHOP_WEIGHTED_AVG (default)"

      - name: repair_order_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.RepairOrder.fields.status, entities.RepairOrder.fields.repair_round]
        distinguishing_aspect: "Client-supplied status / repair_round / warranty_case in the create payload are ignored; server-computed values are returned."
        test_recipe:
          setup: ["customer and asset exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Cimarron", account_number: "CI-120", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1201", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
          trigger:
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10, status: "CLOSED", repair_round: 99, warranty_case: true }, as: IntakeCoordinator, captures: { ro_status: $.data.status, ro_round: $.data.repair_round, ro_warranty: $.data.warranty_case, ro_v: $.data.version } }
          assert:
            - "response status == RECEIVED (client-sent CLOSED ignored)"
            - "response repair_round == 0 and warranty_case == false"
            - "response version == 1"

      - name: get_repair_order_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /repair-orders/123e4567-e89b-42d3-a456-426614174000", payload: {}, as: ServiceManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: asset_creation_with_unknown_customer_not_found
        claim_type: parent_relationships
        grounds: [entities.Asset.fields.customer_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "FK integrity: creating an Asset against a non-existent customer_id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /assets", payload: { customer_id: "123e4567-e89b-42d3-a456-426614174000", serial_number: "V-X", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and no Asset row persisted"

      - name: repair_order_invalid_enum_returns_validation
        claim_type: type_constraints
        grounds: [entities.RepairOrder.fields.failure_mode, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "failure_mode outside the declared enum is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["customer and asset exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Dakota Plains", account_number: "DP-130", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1301", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
          trigger:
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "BROKEN", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: repair_order_list_pagination_interaction
        claim_type: listing
        grounds: [response_envelope, entities.RepairOrder]
        distinguishing_aspect: "limit/offset window over 3 repair orders: page 1 returns 2 items with has_more true and total_count 3; page 2 returns 1 item with has_more false."
        test_recipe:
          setup: ["customer + 3 assets; 3 repair orders created"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Estrella", account_number: "ES-140", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1401", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1402", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1403", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a3: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a1}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a2}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a3}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /repair-orders?customer_id=${cust}&limit=2&offset=0", payload: {}, as: ServiceManager }
            - { call: "GET /repair-orders?customer_id=${cust}&limit=2&offset=2", payload: {}, as: ServiceManager }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: system_fields_stamped_at_creation
        claim_type: system_fields
        grounds: [entities.Customer, response_envelope]
        distinguishing_aspect: "Server stamps id (type-prefix-free UUID), created_at from the logical clock default 2026-08-01T00:00:00Z, and version 1 at creation."
        test_recipe:
          setup: ["empty DB; logical clock never set"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { name: "Fern Ridge", account_number: "FR-150", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { c_id: $.data.id, c_created: $.data.created_at, c_v: $.data.version } }
          assert:
            - "Customer.${c_id}.created_at == 2026-08-01T00:00:00Z (logical clock default)"
            - "Customer.${c_id}.version == 1"
            - "id is a type-prefix-free UUID"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: repair_order_initial_state
        claim_type: initial_state
        grounds: [state_machines.RepairOrder]
        distinguishing_aspect: "A newly created repair order starts in RECEIVED with repair_outcome NONE."
        test_recipe:
          setup: ["customer and asset exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Gila Bend", account_number: "GB-160", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1601", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
          trigger:
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id, ro_status: $.data.status, ro_outcome: $.data.repair_outcome } }
          assert:
            - "RepairOrder.${ro}.status == RECEIVED"
            - "RepairOrder.${ro}.repair_outcome == NONE and repair_round == 0"

      - name: start_repair_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RepairOrder.AUTHORIZED_to_IN_REPAIR, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start-repair from RECEIVED (teardown never started) is rejected; distinct from-state than the QUOTE_IN_PROGRESS case in §1.8."
        test_recipe:
          setup: ["customer, asset, RO in RECEIVED"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Hondo", account_number: "HO-170", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1701", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
          trigger:
            - { call: "POST /repair-orders/${ro}/start-repair", payload: {}, as: Technician, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; RepairOrder.${ro}.status == RECEIVED"

      - name: cancel_closed_repair_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RepairOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: cancel on a CLOSED repair order is rejected and nothing changes."
        test_recipe:
          setup: ["PUMP RO driven RECEIVED -> CLOSED"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Imperial Valley", account_number: "IV-180", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-1801", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAL_LEAK", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "ok", recommended_action: "REPAIR", estimated_labor_hours: 1, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 1, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders/${ro}/start-repair", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro}/submit-for-test", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 100, measured_value: 100, reference_value: 100 } ] }, as: Technician }
            - { call: "POST /repair-orders/${ro}/close", payload: {}, as: IntakeCoordinator }
          trigger:
            - { call: "POST /repair-orders/${ro}/cancel", payload: {}, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; RepairOrder.${ro}.status == CLOSED"

      - name: approve_declined_quote_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Quote, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal for Quote: a later approve attempt is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["RO in QUOTE_IN_PROGRESS with quote ISSUED, then DECLINED by customer (RO cascades to CANCELLED)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Jemez", account_number: "JE-190", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-1901", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "bad", recommended_action: "RETURN_UNREPAIRED", estimated_labor_hours: 1, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 1, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q}/decline", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; Quote.${q}.status == DECLINED; RepairOrder.${ro}.status == CANCELLED"

      - name: approve_expired_quote_terminal_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.Quote.ISSUED_to_EXPIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once lazy expiry has moved a quote to EXPIRED (via a read), approve is a state error ERR_INVALID_STATE — not ERR_QUOTE_EXPIRED, which only fires on actions against a still-ISSUED quote."
        test_recipe:
          setup: ["quote ISSUED at default clock; clock advanced past expiry; GET applies lazy expiry"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Kankakee", account_number: "KA-200", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-2001", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "ok", recommended_action: "REPAIR", estimated_labor_hours: 1, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 1, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ServiceManager }
            - { call: "GET /quotes/${q}", payload: {}, as: ServiceManager, captures: { q_status: $.data.status } }
          trigger:
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "GET transitioned Quote.${q} to EXPIRED (lazy expiry on read)"
            - "approve -> error_id == ERR_INVALID_STATE"

      - name: inspection_finalize_bubbles_ro_to_quote_in_progress
        claim_type: side_effect_execution
        grounds: [state_machines.InspectionReport.DRAFT_to_FINALIZED, state_machines.RepairOrder.IN_INSPECTION_to_QUOTE_IN_PROGRESS]
        distinguishing_aspect: "Finalizing the report bubbles up: RO leaves IN_INSPECTION for QUOTE_IN_PROGRESS and its version increments."
        test_recipe:
          setup: ["RO in IN_INSPECTION with DRAFT report"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Laredo Gas", account_number: "LG-210", credit_limit_cents: 99999999, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-2101", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id, ro_v0: $.data.version } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "ok", recommended_action: "REPAIR", estimated_labor_hours: 1, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector, captures: { rep_status: $.data.report_status } }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_status: $.data.status, ro_v1: $.data.version } }
          assert:
            - "InspectionReport.${rep}.report_status == FINALIZED"
            - "RepairOrder.${ro}.status == QUOTE_IN_PROGRESS and version == ${ro_v0} + 2"

      - name: duplicate_inspection_report_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPORT_ALREADY_EXISTS]", "validations[priority=9]"]
        distinguishing_aspect: "A repair order supports exactly one inspection report; the second create returns ERR_REPORT_ALREADY_EXISTS."
        test_recipe:
          setup: ["RO in IN_INSPECTION with an existing DRAFT report"]
          setup_api_calls:
