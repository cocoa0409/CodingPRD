      - name: every_order_trigger_outside_the_transition_list_is_refused
        claim_type: invalid_transitions
        grounds:
          - "state_machines.SupportOrder"
          - "endpoints[POST /child-support/orders/{order_id}/guideline-calculation]"
          - "endpoints[POST /child-support/orders/{order_id}/deviation-request]"
          - "endpoints[POST /child-support/orders/{order_id}/deviation-findings]"
          - "endpoints[POST /child-support/orders/{order_id}/entry]"
          - "endpoints[POST /child-support/orders/{order_id}/withholding-orders]"
          - "endpoints[POST /child-support/orders/{order_id}/vacatur]"
          - "validations[priority 10]"
          - "errors[ERR_INVALID_ORDER_STATUS]"
