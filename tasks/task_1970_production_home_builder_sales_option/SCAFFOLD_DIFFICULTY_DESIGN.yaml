        distinguishing_aspect: |
          Numeric threshold on incentive cents via POST /homebuilder/incentive-requests:
          amount_cents exactly at AUTO_APPROVE_LIMIT_CENTS (300000) auto-approves
          (<= semantics); one cent above (300001) falls to manual SUBMITTED.
        test_recipe:
          setup:
            - "Signed agreement (default fixtures; community budget 1000000; provisional 45241000 so both amounts pass the 6% cap)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
