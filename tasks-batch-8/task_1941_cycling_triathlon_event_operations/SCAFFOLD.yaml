# =============================================================================
# Task 1941: Cycling & Triathlon Event Operations (USA Triathlon sanctioned)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1941. Cycling & Triathlon Event Operations (USA Triathlon sanctioned event):
  course permitting & road closure coordination, transition area layout & bike
  check-in/out security, wave/start-order assignment & drafting rules, aid
  station supply & volunteer staffing, medical & sag-wagon coverage, water
  conditions/weather cancellation protocol for swim leg, timing across multiple
  disciplines & transitions, results, penalties & appeal

domain_name: cycling-triathlon-event-operations
api_prefix: ""

complexity_profile:
  primary_archetype: posture-driven gating      # Event posture gates every forward-progress operation
  secondary_archetype: event sourcing           # Result derived by replaying an ordered TimingRecord stream
  complexity_layers:
    - optimistic_concurrency                    # OCC on Result.version (corrections) and Penalty.version (amendments)
    - cascading_side_effects                    # swim-cancel cascade; withdraw -> wave -> waitlist promotion cascade
    - dual_variant_calculation                  # provisional vs official totals; provisional vs final refund
    - rate_threshold_triggers                   # water-temp cancel bounds; volunteer/water readiness thresholds; drafting tiers
    - ops-run checkpoint                        # run_ops: confirm-window expiry, refund payout, penalty auto-confirm, waitlist sweep
    - scheduled_actions                         # logical clock drives confirm deadline, appeal window, refund tiers
  entity_topology: hybrid                       # Event-rooted tree plus flat reads and cross-cutting FKs (athlete_id, wave_id)
  state_machine_shape: parallel                 # Event posture x swim_status; plus cyclic (CoursePermit), branching (Registration)
  relationship_patterns:
    - one_to_many                               # Event->Waves/AidStations/...; Registration->TimingRecords/Penalties/BikeChecks
    - cross_aggregate                           # Registration.wave_id -> Wave; Appeal.decided_by vs Penalty.assessed_by
  role_model: segregation_of_duties             # appeal decider must differ from penalty assessor
  consistency_model: immediate                  # all side effects atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: start_date, type: datetime, source: input, description: "Scheduled race start instant (first wave)" }
      - { name: has_swim, type: boolean, source: input, description: "True for triathlon; false for bike/run-only event" }
      - { name: water_pool_units, type: integer, source: input, description: "Total event water supply units available for aid-station allocation" }
      - { name: water_pool_remaining, type: integer, source: computed, description: "= water_pool_units - sum(AidStation.allocated_water_units) over all aid stations of this event" }
      - { name: appeal_window_minutes, type: integer, source: input, default: 60, description: "Minutes after penalty assessment during which an appeal may be filed" }
      - { name: posture, type: enum, source: system, description: "DRAFT | PERMITTED | PUBLISHED | LIVE | FINALIZED | CANCELLED" }
      - { name: swim_status, type: enum, source: system, description: "PENDING_DECISION | SWIM_ON | SWIM_CANCELLED | NO_SWIM — parallel dimension, independent of posture" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone checkpoint counter incremented by run_ops" }

  - name: RoadSegment
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Segment label (e.g. 'Main St mile 2-8')" }
      - { name: length_km, type: number, source: input, description: "Segment length in kilometers" }
      - { name: closure_start, type: datetime, source: input, description: "Planned road-closure window start" }
      - { name: closure_end, type: datetime, source: input, description: "Planned road-closure window end (must be > closure_start)" }

  - name: CoursePermit
    parent: RoadSegment
    common_fields: true
    fields:
      - { name: road_segment_id, type: string, source: system, description: "FK -> RoadSegment.id; segment this permit authorizes" }
      - { name: authority_name, type: string, source: input, description: "Issuing authority (city/county/state police)" }
      - { name: requested_start, type: datetime, source: input, description: "Requested closure window start" }
      - { name: requested_end, type: datetime, source: input, description: "Requested closure window end (must be > requested_start)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on REJECTED; null otherwise", default: null }

  - name: Wave
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: label, type: string, source: input, description: "Wave label (e.g. 'M18-39 AG')" }
      - { name: division, type: enum, source: input, description: "AGE_GROUP | ELITE" }
      - { name: scheduled_start_time, type: datetime, source: input, description: "Scheduled wave start" }
      - { name: actual_start_time, type: datetime, source: system, default: null, description: "Stamped from the logical clock at event start; basis for all split computations" }
      - { name: capacity, type: integer, source: input, description: "Maximum assigned athletes" }
      - { name: assigned_count, type: integer, source: computed, default: 0, description: "= count(Registrations with wave_id == this wave AND status IN {CONFIRMED, RACKED, RACING, FINISHED, DSQ})" }
      - { name: draft_legal, type: boolean, source: input, description: "True if drafting permitted (typical ELITE); DRAFTING penalties invalid when true" }
      - { name: age_band_min, type: integer, source: input, description: "Minimum athlete age (inclusive), age = year(event.start_date) - year(athlete.birth_date)" }
      - { name: age_band_max, type: integer, source: input, description: "Maximum athlete age (inclusive)" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CLOSED — FULL is auto-derived at capacity, reopens on free slot" }

  - name: Athlete
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; event scope this athlete record belongs to" }
      - { name: full_name, type: string, source: input, description: "Athlete full name" }
      - { name: birth_date, type: string, source: input, description: "ISO date YYYY-MM-DD; age at event = year(start_date) - year(birth_date)" }
      - { name: license_number, type: string, source: input, description: "USA Triathlon membership/license number" }
      - { name: license_status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Registration
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; registered athlete" }
      - { name: wave_id, type: string, source: system, default: null, description: "FK -> Wave.id; assigned wave (set by confirm selector or waitlist promotion)" }
      - { name: division, type: enum, source: input, description: "AGE_GROUP | ELITE" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Entry fee paid, in cents" }
      - { name: age_at_event, type: integer, source: computed, default: null, description: "= year(event.start_date) - year(athlete.birth_date), stamped on confirm" }
      - { name: status, type: enum, source: system, description: "ENTERED | PAID | CONFIRMED | WAITLISTED | RACKED | RACING | FINISHED | DNF | DSQ | WITHDRAWN | EXPIRED" }
      - { name: refund_destination, type: string, source: input, default: null, description: "Payout destination captured at withdraw; required when refund_estimate_cents > 0" }
      - { name: refund_estimate_cents, type: integer, source: computed, default: null, description: "Provisional refund computed at withdraw time from days-until-event tier of the withdraw date" }
      - { name: refund_final_cents, type: integer, source: system, default: null, description: "Final refund settled at run_ops payout using the processing date tier; null until settled" }
      - { name: withdrawn_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of withdrawal" }

  - name: BikeCheck
    parent: Registration
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; bike owner registration" }
      - { name: bib_code, type: string, source: input, description: "Presented bib/security code; check-out must match the open check-in's code" }
      - { name: status, type: enum, source: system, description: "CHECKED_IN | CHECKED_OUT" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock timestamp of check-in" }
      - { name: checked_out_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of check-out" }

  - name: AidStation
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Station label (e.g. 'AS-1 Bike km 10')" }
      - { name: location_km, type: number, source: input, description: "Course position in kilometers; allocation waterfall order key" }
      - { name: required_volunteers, type: integer, source: input, description: "Minimum CONFIRMED volunteer count for readiness" }
      - { name: required_water_units, type: integer, source: input, description: "Minimum allocated water units for readiness" }
      - { name: allocated_water_units, type: integer, source: system, default: 0, description: "Water units allocated from the event pool by allocate-water" }
      - { name: confirmed_volunteer_count, type: integer, source: computed, default: 0, description: "= count(VolunteerAssignments of this station with status == CONFIRMED)" }
      - { name: readiness_status, type: enum, source: computed, description: "UNDERSTAFFED | WATER_SHORT | READY — UNDERSTAFFED if confirmed_volunteer_count < required_volunteers; else WATER_SHORT if allocated_water_units < required_water_units; else READY" }

  - name: VolunteerAssignment
    parent: AidStation
    common_fields: true
    fields:
      - { name: aid_station_id, type: string, source: system, description: "FK -> AidStation.id; staffed station" }
      - { name: volunteer_id, type: string, source: input, description: "Opaque volunteer identifier (not entity-backed); shift conflicts are per volunteer_id" }
      - { name: shift_start, type: datetime, source: input, description: "Shift start" }
      - { name: shift_end, type: datetime, source: input, description: "Shift end (must be > shift_start)" }
      - { name: status, type: enum, source: system, description: "OFFERED | CONFIRMED | NO_SHOW | DECLINED" }

  - name: TimingRecord
    parent: Registration
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; athlete's registration" }
      - { name: discipline, type: enum, source: input, description: "SWIM | T1 | BIKE | T2 | FINISH — chip read marking completion of that leg (FINISH = run completion)" }
      - { name: recorded_at, type: datetime, source: input, description: "Chip timestamp of the read" }
      - { name: status, type: enum, source: system, description: "RECORDED | VALIDATED | INVALIDATED" }

  - name: Result
    parent: Registration
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; 1:1 with registration (created when registration reaches RACKED)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | OFFICIAL" }
      - { name: swim_seconds, type: integer, source: computed, default: null, description: "Replayed split; 0 when event.swim_status == SWIM_CANCELLED" }
      - { name: t1_seconds, type: integer, source: computed, default: null, description: "Replayed split; 0 when swim cancelled" }
      - { name: bike_seconds, type: integer, source: computed, default: null, description: "Replayed split; measured from actual_start_time when swim cancelled" }
      - { name: t2_seconds, type: integer, source: computed, default: null, description: "Replayed split" }
      - { name: run_seconds, type: integer, source: computed, default: null, description: "Replayed split" }
      - { name: penalty_seconds_total, type: integer, source: computed, default: 0, description: "= sum(seconds of Penalties for this registration with status == CONFIRMED)" }
      - { name: provisional_total_seconds, type: integer, source: computed, default: null, description: "= swim+t1+bike+t2+run (excludes all penalties); null until FINISH record validated" }
      - { name: official_total_seconds, type: integer, source: computed, default: null, description: "= provisional_total_seconds + penalty_seconds_total; set while status == OFFICIAL" }
      - { name: effective_total_seconds, type: integer, source: computed, default: null, description: "= official_total_seconds if OFFICIAL else provisional_total_seconds" }
      - { name: division_rank, type: integer, source: computed, default: null, description: "Rank of effective_total_seconds ASC within division over non-DSQ results with non-null effective totals; ties by finish_timestamp ASC then registration.created_at ASC; null for DSQ/unfinished" }
      - { name: finish_timestamp, type: datetime, source: system, default: null, description: "recorded_at of the VALIDATED FINISH record" }

  - name: Penalty
    parent: Registration
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; penalized registration" }
      - { name: kind, type: enum, source: input, description: "DRAFTING | COURSE_VIOLATION | EQUIPMENT" }
      - { name: notes, type: string, source: input, default: null, description: "Referee notes" }
      - { name: seconds, type: integer, source: computed, description: "DRAFTING: 120 if 0 prior DRAFTING penalties (ASSESSED or CONFIRMED) on this registration, 300 if 1, 0 with DSQ flag if >=2; COURSE_VIOLATION: 300; EQUIPMENT: 60" }
      - { name: triggers_dsq, type: boolean, source: computed, default: false, description: "True when a DRAFTING penalty is created with >=2 prior DRAFTING penalties on this registration" }
      - { name: status, type: enum, source: system, description: "ASSESSED | CONFIRMED | OVERTURNED" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the assessing Referee (opaque operator id, not an entity FK)" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock timestamp of assessment" }
      - { name: appeal_window_expires_at, type: datetime, source: computed, description: "= assessed_at + event.appeal_window_minutes" }

  - name: Appeal
    parent: Penalty
    common_fields: true
    fields:
      - { name: penalty_id, type: string, source: system, description: "FK -> Penalty.id; appealed penalty" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds text" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | DECIDED" }
      - { name: decision, type: enum, source: system, default: null, description: "UPHELD | OVERTURNED | REDUCED; set on decide" }
      - { name: reduced_seconds, type: integer, source: system, default: null, description: "Substituted penalty seconds when decision == REDUCED" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the deciding Referee; must differ from penalty.assessed_by_user_id" }

  - name: SafetyAssessment
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: water_temp_celsius, type: number, source: input, description: "Measured water temperature; swim proceeds iff 12.0 <= temp <= 31.0 and no lightning" }
      - { name: lightning_within_10km, type: boolean, source: input, description: "True forces swim cancellation regardless of temperature" }
      - { name: outcome, type: enum, source: computed, description: "SWIM_OK | SWIM_CANCEL — SWIM_CANCEL iff water_temp_celsius < 12.0 OR > 31.0 OR lightning_within_10km" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUPERSEDED — a new assessment supersedes the previous RECORDED one" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    field: posture
    initial_state: DRAFT
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PERMITTED
        trigger: "POST /events/{id}/advance"
        actor: RaceDirector
        preconditions:
          - "At least one RoadSegment exists (ERR_SEGMENT_NOT_COVERED)"
          - "Every RoadSegment has at least one APPROVED CoursePermit whose window covers the segment closure (permit.requested_start <= segment.closure_start AND permit.requested_end >= segment.closure_end) (ERR_SEGMENT_NOT_COVERED)"
        side_effects: []
      - from: PERMITTED
        to: PUBLISHED
        trigger: "POST /events/{id}/advance"
        actor: RaceDirector
        preconditions:
          - "At least one Wave exists with status == OPEN (ERR_NO_OPEN_WAVE)"
          - "Every AidStation has readiness_status == READY (ERR_AID_STATION_NOT_READY)"
        side_effects: []
      - from: PUBLISHED
        to: LIVE
        trigger: "POST /events/{id}/start"
        actor: RaceDirector
        preconditions:
          - "If has_swim: swim_status IN {SWIM_ON, SWIM_CANCELLED} (ERR_SWIM_DECISION_PENDING)"
        side_effects:
          - "Each Wave.actual_start_time stamped from the logical clock"
          - "All Registrations in RACKED -> RACING"
      - from: LIVE
        to: FINALIZED
        trigger: "POST /events/{id}/finalize"
        actor: RaceDirector
        preconditions:
          - "No Penalty with status == ASSESSED (ERR_PENALTIES_UNRESOLVED)"
          - "No Appeal with status IN {FILED, UNDER_REVIEW} (ERR_APPEALS_OUTSTANDING)"
        side_effects:
          - "All Results -> OFFICIAL; official_total_seconds = provisional_total_seconds + penalty_seconds_total"
          - "division_rank recomputed over effective_total_seconds"
      - from: PERMITTED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: RaceDirector
        preconditions: []
        side_effects:
          - "All Registrations in {ENTERED, PAID, CONFIRMED, WAITLISTED, RACKED} -> WITHDRAWN with refund_estimate_cents = refund_final_cents = entry_fee_cents (100%, no processing fee)"
          - "Freed wave slots recompute Wave.assigned_count and Wave.status"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: RaceDirector
        preconditions: []
        side_effects: ["Same cascade as PERMITTED -> CANCELLED"]
      - from: LIVE
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: RaceDirector
        preconditions: []
        side_effects:
          - "Same cascade as PERMITTED -> CANCELLED, plus RACING -> DNF (no refund recompute for DNF)"
    note: "Posture is one dimension; swim_status (below) is a parallel, independent dimension on the same entity."

  - entity: Event
    field: swim_status
    initial_state: PENDING_DECISION
    terminal_states: []
    transitions:
      - from: PENDING_DECISION
        to: SWIM_ON
        trigger: "POST /events/{id}/safety-assessments with outcome == SWIM_OK"
        actor: system
        preconditions: ["has_swim == true"]
        side_effects:
          - "Previous RECORDED SafetyAssessment -> SUPERSEDED"
      - from: PENDING_DECISION
        to: SWIM_CANCELLED
        trigger: "POST /events/{id}/safety-assessments with outcome == SWIM_CANCEL"
        actor: system
        preconditions: ["has_swim == true"]
        side_effects:
          - "Previous RECORDED SafetyAssessment -> SUPERSEDED"
          - "Every existing Result of this event is recomputed under the duathlon variant (swim_seconds = 0, t1_seconds = 0, bike split measured from wave.actual_start_time)"
          - "division_rank recomputed after totals change"
      - from: SWIM_ON
        to: SWIM_CANCELLED
        trigger: "POST /events/{id}/safety-assessments with outcome == SWIM_CANCEL"
        actor: system
        preconditions: ["has_swim == true"]
        side_effects: ["Same recompute cascade as PENDING_DECISION -> SWIM_CANCELLED"]
      - from: SWIM_CANCELLED
        to: SWIM_ON
        trigger: "POST /events/{id}/safety-assessments with outcome == SWIM_OK"
        actor: system
        preconditions: ["has_swim == true", "posture != LIVE (ERR_INVALID_STATE — swim cannot be reinstated once racing)"]
        side_effects: ["Results recomputed under the standard triathlon variant"]
    note: "NO_SWIM is set at creation when has_swim == false and has no transitions."

  - entity: CoursePermit
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: PermitCoordinator
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit (resubmission cycle)"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["rejection_reason cleared to null"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permits/{id}/approve"
        actor: PermitCoordinator
        preconditions:
          - "No other APPROVED permit on the same road_segment_id within a 30-minute buffer: conflict iff this.requested_start < other.requested_end + 30min AND other.requested_start < this.requested_end + 30min (ERR_PERMIT_WINDOW_CONFLICT)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /permits/{id}/reject"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["rejection_reason set from request body"]
    note: "Cyclic: REJECTED -> SUBMITTED -> APPROVED/REJECTED loops without bound."

  - entity: Wave
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (automatic when assigned_count reaches capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (automatic when assigned_count drops below capacity)"
        actor: system
        preconditions: []
        side_effects:
          - "Waitlist promotion sweep for this wave (oldest eligible WAITLISTED registration promoted)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /waves/{id}/close"
        actor: RaceDirector
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: OPEN
        trigger: "POST /waves/{id}/reopen"
        actor: RaceDirector
        preconditions: ["assigned_count < capacity (ERR_INVALID_STATE)"]
        side_effects: ["Waitlist promotion sweep for this wave"]
    note: "Cyclic OPEN<->FULL is system-derived; OPEN<->CLOSED is manual."

  - entity: Athlete
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /athletes/{id}"
        actor: RaceDirector
        preconditions: []
        side_effects:
          - "All Registrations of this athlete in {ENTERED, PAID, CONFIRMED, WAITLISTED, RACKED} -> WITHDRAWN (tiered refund_estimate computed per withdrawal rule)"
          - "Each freed wave slot recomputes Wave.assigned_count / Wave.status and triggers waitlist promotion"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /athletes/{id}"
        actor: RaceDirector
        preconditions: []
        side_effects: []
        note: "Reinstatement does NOT undo prior withdrawal cascades."

  - entity: Registration
    initial_state: ENTERED
    terminal_states: [WITHDRAWN, EXPIRED, DSQ]
    transitions:
      - from: ENTERED
        to: PAID
        trigger: "POST /registrations/{id}/pay"
        actor: "Athlete (self) | RaceDirector"
        preconditions: ["athlete.license_status == ACTIVE (ERR_ATHLETE_SUSPENDED)"]
        side_effects: []
      - from: PAID
        to: CONFIRMED
        trigger: "POST /registrations/{id}/confirm (wave selector finds an eligible wave)"
        actor: RaceDirector
        preconditions:
          - "Event posture == PUBLISHED (ERR_EVENT_POSTURE)"
          - "Logical clock < event.start_date - 24h (ERR_CONFIRM_WINDOW_CLOSED)"
          - "athlete.license_status == ACTIVE (ERR_ATHLETE_SUSPENDED)"
          - "Selector: eligible wave has status == OPEN, assigned_count < capacity, division == registration.division, age_band_min <= age_at_event <= age_band_max; rank by scheduled_start_time ASC, tie-break wave.created_at ASC"
        side_effects:
          - "wave_id set to selected wave; age_at_event stamped"
          - "Wave.assigned_count += 1; if assigned_count == capacity, Wave -> FULL"
      - from: PAID
        to: WAITLISTED
        trigger: "POST /registrations/{id}/confirm (no eligible wave)"
        actor: RaceDirector
        preconditions: ["Same posture/window/license preconditions as PAID -> CONFIRMED"]
        side_effects: []
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (waitlist promotion on freed slot or run_ops sweep)"
        actor: system
        preconditions: ["Target wave eligible per the confirm selector"]
        side_effects:
          - "wave_id set; age_at_event stamped"
          - "Wave.assigned_count += 1; if assigned_count == capacity, Wave -> FULL"
      - from: CONFIRMED
        to: RACKED
        trigger: "POST /registrations/{id}/check-in-bike"
        actor: "Athlete (self) | RaceDirector"
        preconditions:
          - "Event posture == PUBLISHED (ERR_EVENT_POSTURE)"
          - "Logical clock < event.start_date (ERR_CHECKIN_WINDOW_CLOSED)"
          - "No other BikeCheck for this registration with status == CHECKED_IN (ERR_DUPLICATE_BIKE_CHECKIN)"
        side_effects:
          - "BikeCheck created with status CHECKED_IN, checked_in_at = clock"
          - "Result created (status PROVISIONAL, all splits null, penalty_seconds_total = 0)"
      - from: RACKED
        to: RACING
        trigger: "system (POST /events/{id}/start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RACING
        to: FINISHED
        trigger: "system (a FINISH TimingRecord becomes VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "Result.finish_timestamp = FINISH record's recorded_at; splits replayed; provisional_total_seconds computed"
      - from: RACING
        to: DNF
        trigger: "POST /registrations/{id}/mark-dnf"
        actor: "Referee | RaceDirector"
        preconditions: []
        side_effects: ["Result stays PROVISIONAL with null totals; division_rank null"]
      - from: RACING
        to: DSQ
        trigger: "system (a DRAFTING penalty with triggers_dsq == true becomes CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: ["Result.division_rank set to null; excluded from ranking"]
      - from: FINISHED
        to: DSQ
        trigger: "system (a DRAFTING penalty with triggers_dsq == true becomes CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: ["Result.division_rank set to null; excluded from ranking"]
      - from: ENTERED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw or system (athlete suspension / event cancellation)"
        actor: "Athlete (self) | RaceDirector | system"
        preconditions:
          - "No Appeal in {FILED, UNDER_REVIEW} on any Penalty of this registration (ERR_APPEAL_PENDING)"
          - "If computed refund_estimate_cents > 0: refund_destination must be provided (ERR_REFUND_DESTINATION_REQUIRED)"
        side_effects:
          - "refund_estimate_cents computed at withdraw-date tier; refund_final_cents stays null"
          - "withdrawn_at = clock"
      - from: PAID
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw or system"
        actor: "Athlete (self) | RaceDirector | system"
        preconditions: ["Same as ENTERED -> WITHDRAWN"]
        side_effects: ["Same as ENTERED -> WITHDRAWN"]
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw or system"
        actor: "Athlete (self) | RaceDirector | system"
        preconditions: ["Same as ENTERED -> WITHDRAWN"]
        side_effects:
          - "Refund fields as ENTERED -> WITHDRAWN"
          - "Wave.assigned_count -= 1; if Wave was FULL -> OPEN"
          - "Freed slot immediately promotes oldest eligible WAITLISTED registration (created_at ASC) into this wave"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw or system"
        actor: "Athlete (self) | RaceDirector | system"
        preconditions: ["Same as ENTERED -> WITHDRAWN"]
        side_effects: ["Removed from waitlist"]
      - from: RACKED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw or system"
        actor: "Athlete (self) | RaceDirector | system"
        preconditions: ["Same as ENTERED -> WITHDRAWN"]
        side_effects: ["Wave.assigned_count -= 1 and promotion sweep, as CONFIRMED -> WITHDRAWN"]
      - from: PAID
        to: EXPIRED
        trigger: "system (run_ops: logical clock > event.start_date - 24h while still PAID)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BikeCheck
    initial_state: CHECKED_IN
    terminal_states: [CHECKED_OUT]
    transitions:
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /registrations/{id}/check-out-bike"
        actor: "Athlete (self) | RaceDirector"
        preconditions:
          - "Registration status IN {FINISHED, DNF} (ERR_INVALID_STATE)"
          - "Presented bib_code equals this CHECKED_IN record's bib_code (ERR_BIB_MISMATCH)"
        side_effects: ["checked_out_at = clock"]

  - entity: VolunteerAssignment
    initial_state: OFFERED
    terminal_states: [NO_SHOW, DECLINED]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /volunteer-assignments/{id}/confirm"
        actor: VolunteerCoordinator
        preconditions:
          - "No half-open overlap with another CONFIRMED assignment for the same volunteer_id: conflict iff this.shift_start < other.shift_end AND other.shift_start < this.shift_end; touching windows (this.shift_start == other.shift_end) are allowed (ERR_SHIFT_OVERLAP)"
        side_effects:
          - "AidStation.confirmed_volunteer_count recomputed; readiness_status re-derived"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /volunteer-assignments/{id}/decline"
        actor: VolunteerCoordinator
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /volunteer-assignments/{id}/no-show"
        actor: VolunteerCoordinator
        preconditions: []
        side_effects:
          - "AidStation.confirmed_volunteer_count -= 1; readiness_status re-derived"

  - entity: TimingRecord
    initial_state: RECORDED
    terminal_states: [INVALIDATED]
    transitions:
      - from: RECORDED
        to: VALIDATED
        trigger: "POST /timing-records/{id}/validate"
        actor: Timer
        preconditions: ["Registration status IN {RACING, FINISHED} (ERR_INVALID_STATE)"]
        side_effects:
          - "Result splits replayed over VALIDATED records ordered by recorded_at ASC"
          - "If discipline == FINISH: registration RACING -> FINISHED, provisional_total_seconds computed, division_rank recomputed"
      - from: RECORDED
        to: INVALIDATED
        trigger: "POST /timing-records/{id}/invalidate"
        actor: Timer
        preconditions: []
        side_effects: ["Result splits replayed without this record"]
      - from: VALIDATED
        to: INVALIDATED
        trigger: "POST /timing-records/{id}/invalidate"
        actor: Timer
        preconditions: []
        side_effects:
          - "Result splits replayed without this record"
          - "If a FINISH record is invalidated while registration is FINISHED: registration reverts FINISHED -> RACING and provisional totals return to null"

  - entity: Result
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: OFFICIAL
        trigger: "system (POST /events/{id}/finalize)"
        actor: system
        preconditions: []
        side_effects:
          - "official_total_seconds = provisional_total_seconds + penalty_seconds_total"
          - "division_rank recomputed"
      - from: OFFICIAL
        to: OFFICIAL
        trigger: "POST /results/{id}/corrections (OCC-guarded amendment; state unchanged, version + 1)"
        actor: Timer
        preconditions: ["expected_result_version == Result.version (ERR_STALE_RESULT_VERSION, 412)"]
        side_effects:
          - "Named split replaced by corrected_seconds; provisional and official totals recomputed"
          - "division_rank recomputed"
          - "increments Result.version by 1"
    note: "Corrections on PROVISIONAL results happen implicitly via TimingRecord validate/invalidate replay; explicit corrections endpoint is for OFFICIAL amendment."

  - entity: Penalty
    initial_state: ASSESSED
    terminal_states: [CONFIRMED, OVERTURNED]
    transitions:
      - from: ASSESSED
        to: CONFIRMED
        trigger: "system (run_ops: appeal_window_expires_at <= clock AND no Appeal in {FILED, UNDER_REVIEW}) or system (appeal decided UPHELD/REDUCED)"
        actor: system
        preconditions: []
        side_effects:
          - "Result.penalty_seconds_total recomputed (sums CONFIRMED penalties)"
          - "If triggers_dsq: registration -> DSQ and division_rank null"
          - "official_total_seconds recomputed when Result is OFFICIAL"
      - from: ASSESSED
        to: OVERTURNED
        trigger: "system (appeal decided OVERTURNED)"
        actor: system
        preconditions: []
        side_effects: ["Result.penalty_seconds_total recomputed"]
      - from: ASSESSED
        to: ASSESSED
        trigger: "POST /penalties/{id}/amend (OCC-guarded amendment; state unchanged, version + 1)"
        actor: Referee
        preconditions: ["expected_penalty_version == Penalty.version (ERR_STALE_PENALTY_VERSION, 412)"]
        side_effects:
          - "kind/notes replaced; seconds and triggers_dsq recomputed from current prior-penalty counts"
          - "increments Penalty.version by 1"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [DECIDED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/begin-review"
        actor: Referee
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: DECIDED
        trigger: "POST /appeals/{id}/decide"
        actor: Referee
        preconditions:
          - "Penalty.status == ASSESSED (ERR_PENALTY_NOT_ASSESSED)"
          - "deciding referee X-User-ID != penalty.assessed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "decision == REDUCED requires reduced_seconds present and 0 <= reduced_seconds < penalty.seconds (ERR_VALIDATION)"
        side_effects:
          - "decision and decided_by_user_id stamped"
          - "UPHELD: penalty -> CONFIRMED with original seconds"
          - "REDUCED: penalty -> CONFIRMED with seconds = reduced_seconds"
          - "OVERTURNED: penalty -> OVERTURNED"
          - "Result.penalty_seconds_total and totals recomputed; DSQ cascade if applicable"

  - entity: SafetyAssessment
    initial_state: RECORDED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "system (a newer SafetyAssessment is created for the same event)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: result-correction-stale-result
    parent_entity: Result
    write_endpoint: "POST /results/{id}/corrections"
    occ_field: "expected_result_version"
    description: |
      Amending an OFFICIAL Result whose version has advanced since the client
      last observed it is rejected. A correction legitimately supersedes prior
      corrected values, so a later request carrying an older observed version
      would otherwise silently overwrite a newer correction; the stale version
      marks the client's view as out of date.
    error_id: ERR_STALE_RESULT_VERSION
    http_status: 412
  - rule_id: penalty-amend-stale-penalty
    parent_entity: Penalty
    write_endpoint: "POST /penalties/{id}/amend"
    occ_field: "expected_penalty_version"
    description: |
      Amending an ASSESSED Penalty whose version has advanced since the client
      last observed it is rejected. Amendments legitimately supersede prior
      amendments (kind/notes/seconds recompute), so only the version check
      distinguishes a current view from a stale one.
    error_id: ERR_STALE_PENALTY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: result_split_replay
    trigger: "TimingRecord validate/invalidate, swim cancellation cascade, result correction"
    algorithm: projection
    formula: |
      Replays VALIDATED TimingRecords of the registration ordered by recorded_at ASC.
      start = wave.actual_start_time.
      Standard variant (swim_status != SWIM_CANCELLED):
        swim_seconds = t(SWIM) - start
        t1_seconds   = t(T1) - t(SWIM)
        bike_seconds = t(BIKE) - t(T1)
        t2_seconds   = t(T2) - t(BIKE)
        run_seconds  = t(FINISH) - t(T2)
      Duathlon variant (swim_status == SWIM_CANCELLED):
        swim_seconds = 0; t1_seconds = 0
        bike_seconds = t(BIKE) - start
        t2_seconds   = t(T2) - t(BIKE)
        run_seconds  = t(FINISH) - t(T2)
      Any missing leg's split is null until its VALIDATED record exists.
      provisional_total_seconds = sum of the five splits once FINISH is validated; null before.
    input_set: "TimingRecords of the registration with status == VALIDATED only; RECORDED and INVALIDATED are excluded"
    precision: "integer seconds"
    variants:
      - name: standard
        when: "event.swim_status != SWIM_CANCELLED"
        difference: "swim and t1 splits measured from chip records"
      - name: duathlon
        when: "event.swim_status == SWIM_CANCELLED"
        difference: "swim_seconds = 0, t1_seconds = 0, bike split measured from actual_start_time"

  - name: result_total_time
    trigger: "split replay, penalty confirmation/overturn/reduction, finalize"
    algorithm: aggregation
    formula: |
      provisional_total_seconds = swim + t1 + bike + t2 + run   (penalties excluded)
      official_total_seconds    = provisional_total_seconds + penalty_seconds_total
      effective_total_seconds   = official_total_seconds if status == OFFICIAL else provisional_total_seconds
    input_set: "Result splits; Penalties of the registration with status == CONFIRMED only"
    precision: "integer seconds"
    variants:
      - name: provisional
        when: "Result.status == PROVISIONAL (during and after racing until finalize)"
        difference: "excludes all penalties, even CONFIRMED ones"
      - name: official
        when: "Result.status == OFFICIAL (after event finalize)"
        difference: "includes penalty_seconds_total — for identical split data the two variants differ whenever a confirmed penalty exists"

  - name: penalty_seconds_total
    trigger: "penalty confirm, overturn, reduction, result finalize"
    algorithm: aggregation
    formula: |
      penalty_seconds_total = sum(p.seconds for p in Penalties of registration where p.status == CONFIRMED)
    input_set: "Penalties with status == CONFIRMED only; ASSESSED and OVERTURNED excluded"
    precision: "integer seconds"

  - name: drafting_penalty_seconds
    trigger: "Penalty creation or amend with kind == DRAFTING"
    algorithm: threshold
    formula: |
      prior = count(Penalties of this registration with kind == DRAFTING
                      and status IN {ASSESSED, CONFIRMED}, excluding the penalty being amended)
      if wave.draft_legal == true: reject with ERR_DRAFT_LEGAL_WAVE
      if prior == 0: seconds = 120, triggers_dsq = false
      if prior == 1: seconds = 300, triggers_dsq = false
      if prior >= 2: seconds = 0, triggers_dsq = true
    constants:
      FIRST_OFFENSE_SECONDS: 120
      SECOND_OFFENSE_SECONDS: 300
      DSQ_PRIOR_COUNT: 2
    precision: "integer seconds"
    note: "Combinatorial mode (a): three inputs (prior count, kind, wave.draft_legal) with conditional branches and a state-changing third tier."

  - name: fixed_penalty_seconds
    trigger: "Penalty creation or amend with kind != DRAFTING"
    algorithm: threshold
    formula: |
      COURSE_VIOLATION: seconds = 300, triggers_dsq = false
      EQUIPMENT: seconds = 60, triggers_dsq = false
    constants:
      COURSE_VIOLATION_SECONDS: 300
      EQUIPMENT_SECONDS: 60
    precision: "integer seconds"

  - name: refund_estimate
    trigger: "registration withdraw (any non-terminal pre-racing state), athlete suspension cascade"
    algorithm: tiered_pricing
    formula: |
      days_until_event = floor((event.start_date - withdrawn_at) / 86400 seconds)
      tier_pct = 0.75 if days_until_event >= 60
                 0.50 if 30 <= days_until_event <= 59
                 0.00 if days_until_event < 30
      base_cents  = floor(entry_fee_cents * tier_pct)
      fee_cents   = ceil(base_cents * 0.10)
      refund_estimate_cents = base_cents - fee_cents
      Rounding order is pinned: round the base first, then compute the fee on the
      rounded base, then subtract. Never sum-then-round.
      Event-cancellation withdrawals bypass tiers: refund = entry_fee_cents, fee = 0.
    constants:
      TIER1_DAYS: 60
      TIER1_PCT: 0.75
      TIER2_DAYS: 30
      TIER2_PCT: 0.50
      PROCESSING_FEE_PCT: 0.10
    precision: "integer cents; floor for base, ceil for fee"
    variants:
      - name: provisional_estimate
        when: "computed at withdraw time using the withdraw date"
        difference: "stored on refund_estimate_cents immediately"
      - name: final_settlement
        when: "computed at run_ops payout using the run_ops processing date"
        difference: "stored on refund_final_cents; crosses a tier boundary when processing lands in a lower tier than the withdraw date, so the two variants differ"

  - name: wave_assignment_selector
    trigger: "POST /registrations/{id}/confirm, waitlist promotion"
    algorithm: weighted_scoring
    formula: |
      age_at_event = year(event.start_date) - year(athlete.birth_date)
      eligible = Waves of event where status == OPEN
                 AND assigned_count < capacity
                 AND division == registration.division
                 AND age_band_min <= age_at_event <= age_band_max
      rank: scheduled_start_time ASC; tie-break created_at ASC
      if eligible empty: registration -> WAITLISTED (no wave_id)
      else: assign first-ranked wave
    input_set: "Waves of the event; registration division; athlete birth_date"
    precision: "n/a"
    note: "Selector determinism: explicit eligibility predicate, ranking key, tie-break on created_at (never id), empty-pool fallback = WAITLISTED."

  - name: division_rank
    trigger: "provisional_total_seconds computed, official totals computed, penalty changes, DSQ, corrections"
    algorithm: aggregation
    formula: |
      candidates = Results of the event joined to Registrations of the same division
                   where registration.status != DSQ AND effective_total_seconds IS NOT NULL
      rank = position by effective_total_seconds ASC;
             tie 1: finish_timestamp ASC;
             tie 2: registration.created_at ASC
      DSQ and unfinished results carry division_rank = null.
    input_set: "Results of the event per division, excluding DSQ registrations and null totals"
    precision: "integer rank, 1-based"

  - name: water_allocation
    trigger: "POST /events/{id}/allocate-water"
    algorithm: waterfall_allocation
    formula: |
      remaining = event.water_pool_units - sum(current allocated_water_units)
      for each AidStation ordered by location_km ASC (tie-break created_at ASC):
        grant = min(station.required_water_units - station.allocated_water_units, remaining)
        grant = max(grant, 0)
        station.allocated_water_units += grant
        remaining -= grant
      event.water_pool_remaining = remaining
      readiness_status re-derived per station after allocation.
    input_set: "All AidStations of the event, regardless of readiness"
    precision: "integer units"

  - name: permit_window_conflict
    trigger: "POST /permits/{id}/approve"
    algorithm: interval_merge
    formula: |
      BUFFER_MINUTES = 30
      for each other APPROVED permit P on the same road_segment_id:
        conflict iff this.requested_start < P.requested_end + BUFFER_MINUTES
                 AND P.requested_start < this.requested_end + BUFFER_MINUTES
      Touching at exactly BUFFER_MINUTES separation is allowed (strict inequality).
    constants:
      BUFFER_MINUTES: 30
    precision: "minute precision on datetime comparison"

  - name: volunteer_shift_conflict
    trigger: "POST /volunteer-assignments/{id}/confirm"
    algorithm: interval_merge
    formula: |
      for each other CONFIRMED assignment A with the same volunteer_id:
        conflict iff this.shift_start < A.shift_end AND A.shift_start < this.shift_end
      Purely touching windows (this.shift_start == A.shift_end) are allowed — no buffer.
    precision: "minute precision on datetime comparison"
    note: "Deliberately different interval semantics from permit_window_conflict: half-open, zero buffer."

  - name: aid_station_readiness
    trigger: "volunteer confirm/decline/no-show, allocate-water, deallocate-water, station creation"
    algorithm: threshold
    formula: |
      if confirmed_volunteer_count < required_volunteers: readiness_status = UNDERSTAFFED
      else if allocated_water_units < required_water_units: readiness_status = WATER_SHORT
      else: readiness_status = READY
      Boundaries are inclusive on the satisfied side: count == required is READY-eligible.
    input_set: "VolunteerAssignments with status == CONFIRMED; allocated_water_units"
    precision: "integer counts"

  - name: swim_cancel_decision
    trigger: "POST /events/{id}/safety-assessments"
    algorithm: threshold
    formula: |
      outcome = SWIM_CANCEL iff water_temp_celsius < 12.0
                             OR water_temp_celsius > 31.0
                             OR lightning_within_10km == true
      else SWIM_OK
      Boundaries inclusive on the proceed side: exactly 12.0 and exactly 31.0 proceed.
    constants:
      MIN_SWIM_TEMP_C: 12.0
      MAX_SWIM_TEMP_C: 31.0
    precision: "one decimal place on temperature"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Athlete-role callers may only act on their own registrations/appeals: X-User-ID must equal the registration's athlete_id (segregation-of-duties check on appeal decide also compares X-User-ID, fired here only as identity mismatch; the duty-separation rule is priority 6)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /registrations/{id}/pay, /withdraw, /check-in-bike, /check-out-bike, POST /penalties/{id}/appeals when called as Athlete"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (event, then child, then grandchild)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "Request body field formats, enum membership, required fields, datetime ordering (end > start)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH with bodies"
  - priority: 6
    category: business_safety
    check: "Integrity-of-competition guards: (a) withdraw blocked while any of the registration's penalties has an Appeal in {FILED, UNDER_REVIEW}; (b) appeal decide blocked when decider == penalty assessor"
    error_id: "ERR_APPEAL_PENDING | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "POST /registrations/{id}/withdraw; POST /appeals/{id}/decide"
  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the requested transition (covers BikeCheck, Permit, Wave, Appeal, Penalty, TimingRecord, Registration transition guards not listed separately)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: state
    check: "Appeal decide requires the penalty to still be ASSESSED"
    error_id: ERR_PENALTY_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /appeals/{id}/decide"
  - priority: 9
    category: business_safety
    check: "Event posture gates: advance/start/finalize preconditions (segment coverage, open wave, aid readiness, swim decision, unresolved penalties/appeals); confirm and bike check-in require PUBLISHED"
    error_id: "ERR_SEGMENT_NOT_COVERED | ERR_NO_OPEN_WAVE | ERR_AID_STATION_NOT_READY | ERR_SWIM_DECISION_PENDING | ERR_PENALTIES_UNRESOLVED | ERR_APPEALS_OUTSTANDING | ERR_EVENT_POSTURE"
    http_status: 409
    applies_to: "POST /events/{id}/advance|start|finalize; POST /registrations/{id}/confirm|check-in-bike"
  - priority: 10
    category: business_temporal
    check: "Window rules on the logical clock: confirm before start_date-24h; bike check-in before start_date; appeal filed at or before appeal_window_expires_at"
    error_id: "ERR_CONFIRM_WINDOW_CLOSED | ERR_CHECKIN_WINDOW_CLOSED | ERR_APPEAL_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "POST /registrations/{id}/confirm|check-in-bike; POST /penalties/{id}/appeals"
  - priority: 11
    category: business_referential
    check: "Athlete license must be ACTIVE for pay/confirm and for registration creation"
    error_id: ERR_ATHLETE_SUSPENDED
    http_status: 409
    applies_to: "POST /events/{id}/registrations; POST /registrations/{id}/pay|confirm"
  - priority: 12
    category: business_referential
    check: "Bike check-out bib_code must equal the open CHECKED_IN record's bib_code"
    error_id: ERR_BIB_MISMATCH
    http_status: 409
    applies_to: "POST /registrations/{id}/check-out-bike"
  - priority: 13
    category: business_constraint
    check: "No second CHECKED_IN BikeCheck for the same registration"
    error_id: ERR_DUPLICATE_BIKE_CHECKIN
    http_status: 409
    applies_to: "POST /registrations/{id}/check-in-bike"
  - priority: 14
    category: business_constraint
    check: "Permit approval free of 30-minute-buffer window conflicts on the same segment"
    error_id: ERR_PERMIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /permits/{id}/approve"
  - priority: 15
    category: business_constraint
    check: "Volunteer shift half-open overlap per volunteer_id"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /volunteer-assignments/{id}/confirm"
  - priority: 16
    category: business_constraint
    check: "DRAFTING penalty only on non-draft-legal waves (wave of the penalized registration)"
    error_id: ERR_DRAFT_LEGAL_WAVE
    http_status: 400
    applies_to: "POST /registrations/{id}/penalties"
  - priority: 17
    category: business_fiscal
    check: "Withdraw with refund_estimate_cents > 0 requires refund_destination"
    error_id: ERR_REFUND_DESTINATION_REQUIRED
    http_status: 400
    applies_to: "POST /registrations/{id}/withdraw"
  - priority: 18
    category: business_fiscal
    check: "deallocate-water requires allocated_water_units > 0 on the station"
    error_id: ERR_WATER_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /aid-stations/{id}/deallocate-water"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [RaceDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Event ---
  - method: POST
    path: "/events"
    description: "Create an event"
    roles: [RaceDirector]
    code: 201
    input: [name, start_date, has_swim, water_pool_units, "appeal_window_minutes?"]
    output: Event
    side_effects: ["posture=DRAFT; swim_status=PENDING_DECISION if has_swim else NO_SWIM; water_pool_remaining=water_pool_units; ops_run_index=0"]

  - method: GET
    path: "/events/{id}"
    description: "Get an event"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: POST
    path: "/events/{id}/advance"
    description: "Advance posture DRAFT->PERMITTED->PUBLISHED with gate preconditions"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["posture transition per Event state machine; increments Event.version by 1"]

  - method: POST
    path: "/events/{id}/start"
    description: "Start the race (PUBLISHED->LIVE); stamps wave actual_start_time from the logical clock"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["Wave.actual_start_time stamped; RACKED registrations -> RACING; increments Event.version by 1"]

  - method: POST
    path: "/events/{id}/finalize"
    description: "Finalize results (LIVE->FINALIZED)"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["Results -> OFFICIAL with official totals; division_rank recomputed; increments Event.version by 1"]

  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel the event (PERMITTED/PUBLISHED/LIVE -> CANCELLED)"
    roles: [RaceDirector]
    code: 200
    input: [reason]
    output: Event
    side_effects: ["Non-terminal registrations -> WITHDRAWN at 100% refund; RACING -> DNF; wave counts recomputed; increments Event.version by 1"]

  - method: POST
    path: "/events/{id}/run-ops"
    description: "Ops checkpoint: ops_run_index+=1; PAID registrations past the confirm deadline -> EXPIRED; unsettled withdrawals get refund_final_cents at the processing-date tier; ASSESSED penalties past their appeal window with no open appeal -> CONFIRMED; waitlist promotion sweep"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["Registration EXPIRED transitions", "refund_final_cents settled", "penalty auto-confirm + Result recompute", "waitlist promotions; increments Event.version by 1"]

  # --- RoadSegment / CoursePermit ---
  - method: POST
    path: "/events/{id}/road-segments"
    description: "Add a road segment with its closure window"
    roles: [PermitCoordinator]
    code: 201
    input: [name, length_km, closure_start, closure_end]
    output: RoadSegment
    side_effects: []

  - method: GET
    path: "/events/{id}/road-segments"
    description: "List road segments of an event"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: RoadSegment[]
    side_effects: []

  - method: GET
    path: "/road-segments/{id}"
    description: "Get a road segment"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: RoadSegment
    side_effects: []

  - method: POST
    path: "/road-segments/{id}/permits"
    description: "Create a course permit request against a segment"
    roles: [PermitCoordinator]
    code: 201
    input: [authority_name, requested_start, requested_end]
    output: CoursePermit
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/road-segments/{id}/permits"
    description: "List permits of a segment"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: CoursePermit[]
    side_effects: []

  - method: GET
    path: "/permits/{id}"
    description: "Get a permit"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: CoursePermit
    side_effects: []

  - method: POST
    path: "/permits/{id}/submit"
    description: "Submit (or resubmit from REJECTED) a permit"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: CoursePermit
    side_effects: ["status -> SUBMITTED; rejection_reason cleared"]

  - method: POST
    path: "/permits/{id}/approve"
    description: "Approve a permit with 30-minute-buffer conflict check"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: CoursePermit
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/permits/{id}/reject"
    description: "Reject a permit"
    roles: [PermitCoordinator]
    code: 200
    input: [reason]
    output: CoursePermit
    side_effects: ["status -> REJECTED; rejection_reason set"]

  # --- Wave ---
  - method: POST
    path: "/events/{id}/waves"
    description: "Create a start wave"
    roles: [RaceDirector]
    code: 201
    input: [label, division, scheduled_start_time, capacity, draft_legal, age_band_min, age_band_max]
    output: Wave
    side_effects: ["status=OPEN; assigned_count=0"]

  - method: GET
    path: "/events/{id}/waves"
    description: "List waves of an event"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Wave[]
    side_effects: []

  - method: GET
    path: "/waves/{id}"
    description: "Get a wave"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Wave
    side_effects: []

  - method: POST
    path: "/waves/{id}/close"
    description: "Manually close a wave (OPEN->CLOSED)"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Wave
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/waves/{id}/reopen"
    description: "Reopen a closed wave (CLOSED->OPEN, requires assigned_count < capacity)"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Wave
    side_effects: ["status -> OPEN; waitlist promotion sweep for this wave"]

  - method: GET
    path: "/waves/{id}/registrations"
    description: "List registrations assigned to a wave"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Registration[]
    side_effects: []

  # --- Athlete ---
  - method: POST
    path: "/events/{id}/athletes"
    description: "Create an athlete record in the event scope"
    roles: [RaceDirector]
    code: 201
    input: [full_name, birth_date, license_number]
    output: Athlete
    side_effects: ["license_status=ACTIVE"]

  - method: GET
    path: "/events/{id}/athletes"
    description: "List athletes of an event"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Athlete[]
    side_effects: []

  - method: GET
    path: "/athletes/{id}"
    description: "Get an athlete"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Athlete
    side_effects: []

  - method: PATCH
    path: "/athletes/{id}"
    description: "Update athlete license status (ACTIVE<->SUSPENDED) with withdrawal cascade"
    roles: [RaceDirector]
    code: 200
    input: [license_status]
    output: Athlete
    side_effects: ["SUSPENDED: non-terminal registrations -> WITHDRAWN with tiered refund estimates; wave slots freed with promotion sweep"]

  - method: GET
    path: "/athletes/{id}/registrations"
    description: "List registrations of an athlete"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Registration[]
    side_effects: []

  # --- Registration ---
  - method: POST
    path: "/events/{id}/registrations"
    description: "Register an athlete (Athlete role must register self: athlete_id == X-User-ID)"
    roles: [RaceDirector, Athlete]
    code: 201
    input: [athlete_id, division, entry_fee_cents]
    output: Registration
    side_effects: ["status=ENTERED"]

  - method: GET
    path: "/events/{id}/registrations"
    description: "List registrations of an event with optional filters"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: ["athlete_id?", "wave_id?", "status?"]
    output: Registration[]
    side_effects: []

  - method: GET
    path: "/registrations/{id}"
    description: "Get a registration"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: POST
    path: "/registrations/{id}/pay"
    description: "Mark entry fee paid (ENTERED->PAID)"
    roles: [RaceDirector, Athlete]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> PAID"]

  - method: POST
    path: "/registrations/{id}/confirm"
    description: "Run the wave selector; PAID->CONFIRMED with wave assignment, or PAID->WAITLISTED when no eligible wave"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Registration
    side_effects: ["wave assignment per wave_assignment_selector; Wave.assigned_count += 1 and possible Wave -> FULL; age_at_event stamped"]

  - method: POST
    path: "/registrations/{id}/withdraw"
    description: "Withdraw a registration with tiered provisional refund and promotion cascade"
    roles: [RaceDirector, Athlete]
    code: 200
    input: ["refund_destination?"]
    output: Registration
    side_effects: ["status -> WITHDRAWN; refund_estimate_cents computed; wave slot freed (CONFIRMED/RACKED) with immediate waitlist promotion"]

  - method: POST
    path: "/registrations/{id}/mark-dnf"
    description: "Mark a racing registration DNF"
    roles: [RaceDirector, Referee]
    code: 200
    input: []
    output: Registration
    side_effects: ["RACING -> DNF; result totals stay null"]

  - method: POST
    path: "/registrations/{id}/check-in-bike"
    description: "Transition-area bike check-in (CONFIRMED->RACKED); creates BikeCheck and the athlete's Result"
    roles: [RaceDirector, Athlete]
    code: 201
    input: [bib_code]
    output: BikeCheck
    side_effects: ["BikeCheck CHECKED_IN created; Registration -> RACKED; Result PROVISIONAL created"]

  - method: POST
    path: "/registrations/{id}/check-out-bike"
    description: "Bike check-out with bib match (CHECKED_IN->CHECKED_OUT); registration must be FINISHED or DNF"
    roles: [RaceDirector, Athlete]
    code: 200
    input: [bib_code]
    output: BikeCheck
    side_effects: ["BikeCheck -> CHECKED_OUT; checked_out_at stamped"]

  - method: GET
    path: "/registrations/{id}/bike-checks"
    description: "List bike checks of a registration"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: BikeCheck[]
    side_effects: []

  # --- AidStation / VolunteerAssignment ---
  - method: POST
    path: "/events/{id}/aid-stations"
    description: "Create an aid station"
    roles: [RaceDirector]
    code: 201
    input: [name, location_km, required_volunteers, required_water_units]
    output: AidStation
    side_effects: ["allocated_water_units=0; confirmed_volunteer_count=0; readiness_status=UNDERSTAFFED"]

  - method: GET
    path: "/events/{id}/aid-stations"
    description: "List aid stations of an event"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: AidStation[]
    side_effects: []

  - method: GET
    path: "/aid-stations/{id}"
    description: "Get an aid station"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: AidStation
    side_effects: []

  - method: POST
    path: "/events/{id}/allocate-water"
    description: "Run the water-allocation waterfall across all aid stations ordered by location_km ASC"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["allocated_water_units topped up per station; water_pool_remaining recomputed; readiness re-derived; increments Event.version by 1"]

  - method: POST
    path: "/aid-stations/{id}/deallocate-water"
    description: "Return this station's allocated water to the event pool"
    roles: [RaceDirector]
    code: 200
    input: []
    output: AidStation
    side_effects: ["allocated_water_units -> 0; Event.water_pool_remaining += prior allocation; readiness re-derived"]

  - method: POST
    path: "/aid-stations/{id}/assignments"
    description: "Offer a volunteer shift at this station"
    roles: [VolunteerCoordinator]
    code: 201
    input: [volunteer_id, shift_start, shift_end]
    output: VolunteerAssignment
    side_effects: ["status=OFFERED"]

  - method: GET
    path: "/aid-stations/{id}/assignments"
    description: "List volunteer assignments of a station"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: VolunteerAssignment[]
    side_effects: []

  - method: GET
    path: "/volunteer-assignments/{id}"
    description: "Get a volunteer assignment"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: []

  - method: POST
    path: "/volunteer-assignments/{id}/confirm"
    description: "Confirm an offered shift with half-open overlap check per volunteer"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: ["OFFERED -> CONFIRMED; station confirmed_volunteer_count and readiness recomputed"]

  - method: POST
    path: "/volunteer-assignments/{id}/decline"
    description: "Decline an offered shift"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: ["OFFERED -> DECLINED"]

  - method: POST
    path: "/volunteer-assignments/{id}/no-show"
    description: "Mark a confirmed volunteer as no-show"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: ["CONFIRMED -> NO_SHOW; station confirmed_volunteer_count -= 1 and readiness recomputed"]

  # --- SafetyAssessment ---
  - method: POST
    path: "/events/{id}/safety-assessments"
    description: "Record a water/weather safety assessment; may flip Event.swim_status and trigger the duathlon recompute cascade"
    roles: [RaceDirector, Referee]
    code: 201
    input: [water_temp_celsius, lightning_within_10km]
    output: SafetyAssessment
    side_effects: ["outcome computed; prior RECORDED assessment -> SUPERSEDED; Event.swim_status updated; swim-cancel cascade recomputes Results and ranks"]

  - method: GET
    path: "/events/{id}/safety-assessments"
    description: "List safety assessments of an event"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: SafetyAssessment[]
    side_effects: []

  - method: GET
    path: "/safety-assessments/{id}"
    description: "Get a safety assessment"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: SafetyAssessment
    side_effects: []

  # --- TimingRecord / Result ---
  - method: POST
    path: "/registrations/{id}/timing-records"
    description: "Record a chip read for a discipline"
    roles: [Timer]
    code: 201
    input: [discipline, recorded_at]
    output: TimingRecord
    side_effects: ["status=RECORDED"]

  - method: GET
    path: "/registrations/{id}/timing-records"
    description: "List timing records of a registration"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: ["discipline?"]
    output: TimingRecord[]
    side_effects: []

  - method: GET
    path: "/timing-records/{id}"
    description: "Get a timing record"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: TimingRecord
    side_effects: []

  - method: POST
    path: "/timing-records/{id}/validate"
    description: "Validate a chip read (RECORDED->VALIDATED); FINISH validation completes the race"
    roles: [Timer]
    code: 200
    input: []
    output: TimingRecord
    side_effects: ["Result replay; FINISH: Registration RACING->FINISHED, provisional totals, rank recompute"]

  - method: POST
    path: "/timing-records/{id}/invalidate"
    description: "Invalidate a chip read; a FINISH invalidate reverts FINISHED->RACING"
    roles: [Timer]
    code: 200
    input: []
    output: TimingRecord
    side_effects: ["-> INVALIDATED; Result replay without this record; possible FINISHED->RACING revert"]

  - method: GET
    path: "/events/{id}/results"
    description: "List results of an event with optional filters"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: ["registration_id?", "division?"]
    output: Result[]
    side_effects: []

  - method: GET
    path: "/registrations/{id}/results"
    description: "Get the (single) result of a registration as a 0- or 1-element array"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Result[]
    side_effects: []

  - method: GET
    path: "/results/{id}"
    description: "Get a result"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Result
    side_effects: []

  - method: POST
    path: "/results/{id}/corrections"
    description: "OCC-guarded correction of one split of an OFFICIAL result; split names SWIM|T1|BIKE|T2|RUN"
    roles: [Timer]
    code: 200
    input: [expected_result_version, discipline, corrected_seconds]
    output: Result
    side_effects: ["split replaced; totals and division_rank recomputed; increments Result.version by 1"]

  # --- Penalty / Appeal ---
  - method: POST
    path: "/registrations/{id}/penalties"
    description: "Assess a penalty (seconds computed per kind/tier)"
    roles: [Referee]
    code: 201
    input: [kind, "notes?"]
    output: Penalty
    side_effects: ["status=ASSESSED; seconds/triggers_dsq computed; assessed_by_user_id and assessed_at stamped; appeal_window_expires_at computed"]

  - method: GET
    path: "/registrations/{id}/penalties"
    description: "List penalties of a registration"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Penalty[]
    side_effects: []

  - method: GET
    path: "/penalties/{id}"
    description: "Get a penalty"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Penalty
    side_effects: []

  - method: POST
    path: "/penalties/{id}/amend"
    description: "OCC-guarded amendment of an ASSESSED penalty (kind/notes; seconds recomputed)"
    roles: [Referee]
    code: 200
    input: [expected_penalty_version, "kind?", "notes?"]
    output: Penalty
    side_effects: ["seconds and triggers_dsq recomputed; increments Penalty.version by 1"]

  - method: POST
    path: "/penalties/{id}/appeals"
    description: "File an appeal against an ASSESSED penalty within its appeal window"
    roles: [Athlete, RaceDirector]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: ["Appeal FILED; blocks penalty auto-confirm while open"]

  - method: GET
    path: "/penalties/{id}/appeals"
    description: "List appeals of a penalty"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [RaceDirector, PermitCoordinator, Referee, Timer, VolunteerCoordinator, Athlete]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{id}/begin-review"
    description: "Move an appeal FILED->UNDER_REVIEW"
    roles: [Referee]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Decide an appeal (UPHELD|OVERTURNED|REDUCED); decider must differ from assessor"
    roles: [Referee]
    code: 200
    input: [decision, "reduced_seconds?"]
    output: Appeal
    side_effects: ["Appeal DECIDED; penalty -> CONFIRMED (original or reduced seconds) or OVERTURNED; Result totals and rank recomputed; DSQ cascade if applicable"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or Athlete-role caller acting on another athlete's registration/appeal" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, bad datetime ordering, invalid reduced_seconds" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_EVENT_POSTURE, http: 409, condition: "Event posture does not allow this operation (e.g. confirm or bike check-in outside PUBLISHED)" }
  - { id: ERR_SEGMENT_NOT_COVERED, http: 409, condition: "Advance DRAFT->PERMITTED blocked: no segments, or a segment lacks an APPROVED permit covering its closure window" }
  - { id: ERR_NO_OPEN_WAVE, http: 409, condition: "Advance PERMITTED->PUBLISHED blocked: no wave with status == OPEN" }
  - { id: ERR_AID_STATION_NOT_READY, http: 409, condition: "Advance PERMITTED->PUBLISHED blocked: an aid station is not READY" }
  - { id: ERR_SWIM_DECISION_PENDING, http: 409, condition: "Start blocked: has_swim event still has swim_status == PENDING_DECISION" }
  - { id: ERR_PENALTIES_UNRESOLVED, http: 409, condition: "Finalize blocked: a Penalty is still ASSESSED" }
  - { id: ERR_APPEALS_OUTSTANDING, http: 409, condition: "Finalize blocked: an Appeal is FILED or UNDER_REVIEW" }
  - { id: ERR_PERMIT_WINDOW_CONFLICT, http: 409, condition: "Approval would put two APPROVED permits on one segment within the 30-minute buffer" }
  - { id: ERR_CONFIRM_WINDOW_CLOSED, http: 409, condition: "Confirm attempted at or after event.start_date - 24h on the logical clock" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "Bike check-in attempted at or after event.start_date" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 409, condition: "Appeal filed after penalty.appeal_window_expires_at" }
  - { id: ERR_ATHLETE_SUSPENDED, http: 409, condition: "Athlete license SUSPENDED blocks registration creation, pay, confirm" }
  - { id: ERR_APPEAL_PENDING, http: 409, condition: "Withdraw blocked while any penalty of the registration has an open appeal" }
  - { id: ERR_REFUND_DESTINATION_REQUIRED, http: 400, condition: "Withdraw with refund_estimate_cents > 0 but no refund_destination supplied" }
  - { id: ERR_BIB_MISMATCH, http: 409, condition: "Check-out bib_code does not equal the open CHECKED_IN record's bib_code" }
  - { id: ERR_DUPLICATE_BIKE_CHECKIN, http: 409, condition: "A CHECKED_IN BikeCheck already exists for this registration" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Confirmed shift would half-open-overlap another CONFIRMED shift for the same volunteer_id" }
  - { id: ERR_WATER_NOT_ALLOCATED, http: 409, condition: "deallocate-water on a station with allocated_water_units == 0" }
  - { id: ERR_DRAFT_LEGAL_WAVE, http: 400, condition: "DRAFTING penalty assessed for a registration whose wave is draft-legal" }
  - { id: ERR_PENALTY_NOT_ASSESSED, http: 409, condition: "Appeal decide while the penalty is no longer ASSESSED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeal decider's X-User-ID equals the penalty's assessed_by_user_id" }
  - { id: ERR_STALE_RESULT_VERSION, http: 412, condition: "expected_result_version does not match the Result's current version" }
  - { id: ERR_STALE_PENALTY_VERSION, http: 412, condition: "expected_penalty_version does not match the Penalty's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RaceDirector
    description: "Event owner/operator: event lifecycle, waves, athletes, registrations, aid stations, water, clock, run-ops"
    identity: opaque
    exclusive_operations:
      - "POST /events, /events/{id}/advance|start|finalize|cancel|run-ops, /events/{id}/allocate-water"
      - "POST /events/{id}/waves, /waves/{id}/close|reopen"
      - "POST /events/{id}/athletes, PATCH /athletes/{id}"
      - "POST /registrations/{id}/confirm, /registrations/{id}/mark-dnf"
      - "POST /events/{id}/aid-stations, /aid-stations/{id}/deallocate-water"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /events/{id}/registrations, /registrations/{id}/pay|withdraw|check-in-bike|check-out-bike (with Athlete)"
      - "POST /events/{id}/safety-assessments (with Referee)"
      - "POST /penalties/{id}/appeals (with Athlete)"
      - "all GET endpoints (with all roles)"

  - name: PermitCoordinator
    description: "Course permitting and road-closure coordination with public authorities"
    identity: opaque
    exclusive_operations:
      - "POST /events/{id}/road-segments"
      - "POST /road-segments/{id}/permits, /permits/{id}/submit|approve|reject"
    shared_operations:
      - "all GET endpoints (with all roles)"

  - name: Referee
    description: "Head official: penalty assessment/amendment, appeal review and decision, safety co-authority, DNF marking"
    identity: opaque
    exclusive_operations:
      - "POST /registrations/{id}/penalties, /penalties/{id}/amend"
      - "POST /appeals/{id}/begin-review, /appeals/{id}/decide (decider must differ from the penalty's assessor)"
    shared_operations:
      - "POST /events/{id}/safety-assessments (with RaceDirector)"
      - "POST /registrations/{id}/mark-dnf (with RaceDirector)"
      - "all GET endpoints (with all roles)"

  - name: Timer
    description: "Timing staff: chip reads, validation, official-result corrections"
    identity: opaque
    exclusive_operations:
      - "POST /registrations/{id}/timing-records, /timing-records/{id}/validate|invalidate"
      - "POST /results/{id}/corrections"
    shared_operations:
      - "all GET endpoints (with all roles)"

  - name: VolunteerCoordinator
    description: "Aid-station volunteer staffing"
    identity: opaque
    exclusive_operations:
      - "POST /aid-stations/{id}/assignments"
      - "POST /volunteer-assignments/{id}/confirm|decline|no-show"
    shared_operations:
      - "all GET endpoints (with all roles)"

  - name: Athlete
    description: "Registered participant acting on their own records (X-User-ID must equal Athlete.id)"
    identity: "entity_backed:Athlete"
    exclusive_operations: []
    shared_operations:
      - "POST /events/{id}/registrations (self only: athlete_id == X-User-ID)"
      - "POST /registrations/{id}/pay|withdraw|check-in-bike|check-out-bike (own registrations only)"
      - "POST /penalties/{id}/appeals (own penalties only, via the penalized registration's athlete_id)"
      - "all GET endpoints (with all roles)"
