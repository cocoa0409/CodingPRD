      - name: state_parallel_availability_and_condition_dimensions
        claim_type: parallel_dimensions
        grounds:
          - "complexity_profile.state_machine_shape"
          - "state_machines.RentalUnit.transitions"
        excluded_because:
          difficulty_instance: non_linear_state_machine / rental_unit_availability_and_condition_dimensions_advance_independently
          rationale: >-
            The two independent RentalUnit dimensions and their combined state are the whole subject of the
            named §1.8 instance, which pins every (availability_state, condition_state) pair the single return
            leg produces.
      - name: state_cyclic_dispute_loop_terminates_at_the_round_cap
        claim_type: cyclic_loop
        grounds:
          - "complexity_profile.state_machine_shape"
          - "state_machines.DamageClaim.transitions.DISPUTED_to_ASSESSED"
        excluded_because:
          difficulty_instance: non_linear_state_machine / damage_claim_dispute_cycle_downgrades_twice_then_locks
          rationale: >-
            The ASSESSED -> DISPUTED -> ASSESSED cycle, its per-lap severity downgrade and its
            MAX_DISPUTE_ROUNDS termination condition are asserted lap by lap in the named §1.8 instance.
      - name: state_conditional_cascade_repair_retry_self_loop
        claim_type: conditional_cascade
        grounds:
          - "state_machines.ReverseLogisticsJob.transitions.PROCESSING_to_PROCESSING"
          - "state_machines.ReverseLogisticsJob.transitions.PROCESSING_to_CONDEMNED_HOLD"
        excluded_because:
          difficulty_instance: non_linear_state_machine / repair_retry_loop_condemns_job_at_attempt_cap
          rationale: >-
            The self-loop that only fires while repair_attempts + 1 < REPAIR_ATTEMPT_CAP, and the condemnation
            branch taken at the cap, are both asserted in the named §1.8 instance.
      - name: state_cross_entity_receipt_chain_end_to_end
        claim_type: cross_entity
        grounds:
          - "state_machines.Shipment.transitions.IN_TRANSIT_to_RECEIVED"
          - "state_machines.Reservation.transitions.RETURN_INITIATED_to_RETURNED"
          - "state_machines.RentalUnit.transitions.INBOUND_to_PROCESSING"
        excluded_because:
          difficulty_instance: transitive_cascade / inbound_receipt_cascades_shipment_to_job_creation
          rationale: >-
            The four-hop receipt chain from Shipment through Reservation and RentalUnit to the created
            ReverseLogisticsJob is asserted hop by hop in the named §1.8 instance.
      - name: state_cascade_down_delinquency_releases_units
        claim_type: cascade_down
        grounds:
          - "state_machines.Member.transitions.ACTIVE_to_DELINQUENT"
          - "state_machines.Reservation.transitions.MATCHED_to_RELEASED"
          - "state_machines.RentalUnit.transitions.RESERVED_to_IN_STOCK"
        excluded_because:
          difficulty_instance: transitive_cascade / damage_charge_cascades_delinquency_to_unit_release
          rationale: >-
            The named §1.8 instance drives the charge -> ledger -> DELINQUENT -> reservation release -> unit
            release -> style depth chain and asserts every hop, including that only non-terminal reservations
            are touched.
      - name: state_compensation_overturned_dispute_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - "state_machines.DamageClaim.transitions.DISPUTED_to_DISMISSED"
          - "state_machines.Member.transitions.DELINQUENT_to_ACTIVE"
          - "calculations.member_fee_balance_invariant"
        excluded_because:
          difficulty_instance: compensating_invariant / member_fee_balance_and_waiver_coverage_restored_by_overturned_dispute
          rationale: >-
            The named §1.8 instance asserts that the reversal entry returns outstanding_fee_cents and
            waiver_coverage_used_cents to their exact pre-charge values with no drift.
      - name: state_ledger_sync_unit_positions_after_release
        claim_type: ledger_sync
        grounds:
          - "calculations.unit_position_conservation_invariant"
          - "entities.Style.fields.floor_ready_unit_count"
        excluded_because:
          difficulty_instance: compensating_invariant / unit_position_count_conserved_across_allocate_then_release
          rationale: >-
            The named §1.8 instance reconciles Style.floor_ready_unit_count and the per-(style, size) position
            count before and after an allocate-then-release pair.
      - name: state_guarded_restock_requires_claim_out_of_open_states
        claim_type: guarded_transitions
        grounds:
          - "state_machines.ReverseLogisticsJob.transitions.PHOTOGRAPHED_to_RESTOCKED"
          - "validations.priority 22"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / restock_blocked_until_damage_claim_leaves_open_states
          rationale: >-
            The named §1.8 instance drives the same PHOTOGRAPHED -> RESTOCKED edge against a DamageClaim in
            OPEN, ASSESSED and then CHARGED, asserting the guard flips exactly once.
  - section: calculations
    instances:
      - name: calc_swap_turn_attributes_half_the_base_per_turn_revenue
        claim_type: correct_result
        grounds:
          - "calculations.turn_revenue_attribution"
          - "entities.Reservation.fields.is_swap"
          - "entities.Reservation.fields.revenue_attributed_cents"
          - "state_machines.Reservation.transitions.MATCHED_to_SUPERSEDED"
          - "state_machines.Reservation.transitions.RETURNED_to_CLOSED"
        distinguishing_aspect: >-
          base_per_turn_cents is round_half_up(10000 / 3) == 3333 and a swap turn is round_half_up(3333 / 2) ==
          1667, so the halving rounds UP and cannot be 1666. The superseded original must attribute nothing at
          all: only the reservation that actually closed earns revenue, so r1 stays at revenue_attributed_cents 0
          in state SUPERSEDED while r2 carries 1667.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z by the PlatformAdmin clock endpoint"
            - "membership plan SIG4: item_slots 3, monthly_fee_cents 10000, monthly_swaps_allowed 2, shipping_cadence_days 7, waiver_monthly_fee_cents 1800, waiver_coverage_cents 10000"
