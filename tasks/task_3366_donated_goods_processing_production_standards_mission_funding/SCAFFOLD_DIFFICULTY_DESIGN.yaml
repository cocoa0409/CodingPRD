  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: item_price_blocked_when_org_suspended
        grounds:
          - state_machines.DonatedItem.SORTED_to_ON_FLOOR
          - validations[priority=7]
          - errors.ERR_ORG_SUSPENDED
        distinguishing_aspect: |
          Pair DonatedItem -> MemberOrg: a perfectly SORTED item cannot be priced
          while its ORG is SUSPENDED — the child's valid transition is gated by the
          parent's license posture, independent of the item's own state.
        test_recipe:
          setup:
            - "Clock default. Org with standard and one SORTED grade-A item; org then suspended."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Gate", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site X", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DX", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 5 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
            - call: "POST /donated-goods/member-orgs/${org_id}/suspend"
              payload: {}
              as: BrandRegulator
          trigger:
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "pricing is rejected with ERR_ORG_SUSPENDED (${err}) even though the item is in a valid SORTED state"
            - "DonatedItem.${it} remains SORTED with price_cents null"

      - name: milestone_attest_blocked_during_review
        grounds:
          - state_machines.ContractMilestone.PENDING_to_ATTESTED
          - state_machines.WorkforceContract.ACTIVE_to_UNDER_REVIEW
          - state_machines.WorkforceContract.UNDER_REVIEW_to_ACTIVE
        distinguishing_aspect: |
          Pair ContractMilestone -> WorkforceContract (a different entity pair from
          instance 1): attestation of a PENDING milestone is frozen while the
          CONTRACT is UNDER_REVIEW, and resumes once the review closes — the
          milestone's own state never changed.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Org with one contract (agency DOL, window 2026-03-01..2026-12-31, headcount 50) holding a single milestone (target 2026-12-01, min_headcount 40, payout 50000), created by ContractManager cm-1."
