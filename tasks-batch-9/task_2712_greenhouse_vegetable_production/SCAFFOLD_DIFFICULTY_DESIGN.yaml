  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: drainage_reading_cascade_locks_irrigation_then_flags_nutrient_stress
        grounds:
          - state_machines.FertigationBatch.DELIVERED_to_DELIVERED
          - state_machines.Zone.irrigation_posture.NORMAL_to_WATCH
          - state_machines.Zone.irrigation_posture.WATCH_to_LOCKED
          - calculations.drainage_alarm_evaluation
          - calculations.zone_posture_derivation
          - entities.CropCycle.fields.nutrient_stress_flag
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /fertigation-batches/{id}/drainage-readings: hop 1 latches
          batch.drain_alarm and raises zone.drain_alarm_count to 3; hop 2 is caused by that counter and
          not by the reading, moving zone.irrigation_posture from WATCH to LOCKED; hop 3 is caused by the
          LOCKED posture and sets CropCycle.nutrient_stress_flag true. The captured mid-chain values prove
          hop 2 had only reached WATCH and hop 3 had not fired before the third reading.
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z, one zone, one crop cycle in TRANSPLANTED."
            - "Three fertigation batches, all already DELIVERED at 12000 L, filed before any posture lock could block delivery."
            - "Two breaching drainage readings already filed (one per batch) at drain_ec_ms 6.20 > DRAIN_EC_ALARM_MS 5.5, so zone.drain_alarm_count is 2 and irrigation_posture is WATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /fertigation-batches"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", batch_date: "2026-08-06", planned_volume_liters: 12000, requested_recirculated_liters: 3000, reservoir_ec_ms: 1.2, target_ec_ms: 3.0, target_ph: 5.8, n_ppm: 180, k_ppm: 320, ca_ppm: 200, drain_target_pct: 30 }
              as: IrrigationTech
              captures: { b1: $.data.id }
            - call: "POST /fertigation-batches"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", batch_date: "2026-08-06", planned_volume_liters: 12000, requested_recirculated_liters: 3000, reservoir_ec_ms: 1.2, target_ec_ms: 3.0, target_ph: 5.8, n_ppm: 180, k_ppm: 320, ca_ppm: 200, drain_target_pct: 30 }
              as: IrrigationTech
              captures: { b2: $.data.id }
            - call: "POST /fertigation-batches"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", batch_date: "2026-08-06", planned_volume_liters: 12000, requested_recirculated_liters: 3000, reservoir_ec_ms: 1.2, target_ec_ms: 3.0, target_ph: 5.8, n_ppm: 180, k_ppm: 320, ca_ppm: 200, drain_target_pct: 30 }
              as: IrrigationTech
              captures: { b3: $.data.id }
            - call: "POST /fertigation-batches/${b1}/transitions"
              payload: { to_status: "DELIVERED", delivered_volume_liters: 12000 }
              as: IrrigationTech
            - call: "POST /fertigation-batches/${b2}/transitions"
              payload: { to_status: "DELIVERED", delivered_volume_liters: 12000 }
              as: IrrigationTech
            - call: "POST /fertigation-batches/${b3}/transitions"
              payload: { to_status: "DELIVERED", delivered_volume_liters: 12000 }
              as: IrrigationTech
            - call: "POST /fertigation-batches/${b1}/drainage-readings"
              payload: { drain_volume_liters: 3600.0, drain_ec_ms: 6.2, reading_at: "2026-08-06T12:00:00Z" }
              as: IrrigationTech
            - call: "POST /fertigation-batches/${b2}/drainage-readings"
              payload: { drain_volume_liters: 3600.0, drain_ec_ms: 6.2, reading_at: "2026-08-06T13:00:00Z" }
              as: IrrigationTech
            - call: "GET /zones/${zone_a}"
              as: GrowerManager
              captures: { alarm_count_after_two: $.data.drain_alarm_count, posture_after_two: $.data.irrigation_posture }
            - call: "GET /crop-cycles/${cyc_a}"
              as: GrowerManager
              captures: { stress_after_two: $.data.nutrient_stress_flag }
          trigger:
            - call: "POST /fertigation-batches/${b3}/drainage-readings"
              payload: { drain_volume_liters: 3600.0, drain_ec_ms: 6.2, reading_at: "2026-08-06T14:00:00Z" }
              as: IrrigationTech
          assert:
            - "${alarm_count_after_two} == 2"
            - "${posture_after_two} == WATCH"
            - "${stress_after_two} == false"
            - "FertigationBatch.${b3}.drain_alarm == true"
            - "FertigationBatch.${b3}.drain_reading_count == 1"
            - "FertigationBatch.${b3}.cumulative_drain_volume_liters == 3600.00"
            - "FertigationBatch.${b3}.last_drain_ec_ms == 6.20"
            - "FertigationBatch.${b3}.drain_fraction_pct == 30.00"
            - "Zone.${zone_a}.drain_alarm_count == 3"
            - "Zone.${zone_a}.irrigation_posture == LOCKED"
            - "CropCycle.${cyc_a}.nutrient_stress_flag == true"

