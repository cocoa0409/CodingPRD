      - name: duplicate_store_code_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=47]
          - errors[ERR_DUPLICATE_IDENTIFIER]
          - entities.Store.fields.store_code
        distinguishing_aspect: "store_code is globally unique: a second store reusing NG-001 under a different name is 409 ERR_DUPLICATE_IDENTIFIER and no second row appears, while a different code on the same name succeeds - so the constraint is on the code alone."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One store with store_code NG-001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { storea_id: $.data.id }
          trigger:
            - call: "POST /stores"
              payload: { name: "Northgate Market Annex", store_code: "NG-001", state_code: "OR", region: "WEST" }
              as: ComplianceManager
              captures: { err_id: $.data.error_id }
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-002", state_code: "OR", region: "WEST" }
              as: PlatformAdmin
              captures: { storeb_id: $.data.id }
          assert:
            - "the colliding create is HTTP 409 with error_id == ERR_DUPLICATE_IDENTIFIER"
            - "the NG-002 create is HTTP 201 even though the name repeats"
            - "GET /stores returns total_count 2 (NG-001 and NG-002 only)"

      - name: report_period_sharing_a_single_day_is_an_overlap
        claim_type: temporal_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: "The stored range is inclusive at both ends, so a new period starting on the incumbent's last day (2026-06-30) shares exactly one day and is 409 ERR_REPORT_PERIOD_OVERLAP, while a period starting the very next day is accepted - the boundary is where the rule flips, and a still-DRAFT incumbent already blocks."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, no systems, one DRAFT ANNUAL_LEAK_RATE report for 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
