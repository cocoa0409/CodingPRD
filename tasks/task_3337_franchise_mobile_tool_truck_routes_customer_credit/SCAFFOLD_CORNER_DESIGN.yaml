            - { call: "PATCH /retail/sales-orders/${o_over_id}", payload: { lines: [{ product_id: "${p1_id}", quantity: 2, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_fixed_gross: "$.data.gross_total_cents" } }
