            - "err == ERR_WINDOW_INVALID (http 422)"

      - name: facings_below_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_RANGE_INVALID]"]
        distinguishing_aspect: "facings 0 violates the >= 1 range."
