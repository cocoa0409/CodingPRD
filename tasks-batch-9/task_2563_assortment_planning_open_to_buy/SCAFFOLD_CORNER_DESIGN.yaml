              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Atlas Apparel", code: "ATLS", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 100, cancel_cutoff_days: 14 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_id: $.data.id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 4000 }, { size_label: "L", size_sort_order: 2, pct_bps: 6000 } ] }
              as: MerchandisePlanner
