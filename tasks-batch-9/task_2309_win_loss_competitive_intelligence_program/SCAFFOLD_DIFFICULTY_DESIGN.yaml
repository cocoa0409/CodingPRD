              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "GET /deals/${d1_id}"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { d1_v: $.data.version }
            - call: "POST /loss-attributions"
              payload: { deal_id: "${d1_id}", primary_reason_id: "${lr_price_id}", weight_primary: 1.00, expected_deal_version: "${d1_v}" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { att1_id: $.data.id }
            - call: "POST /loss-attributions/${att1_id}/ratify"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "${a2_id}"
            - call: "GET /deals/${d2_id}"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { d2_v: $.data.version }
            - call: "POST /loss-attributions"
              payload: { deal_id: "${d2_id}", primary_reason_id: "${lr_gap_id}", weight_primary: 1.00, expected_deal_version: "${d2_v}" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { att2_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}/loss-trends"
              payload: { window_start: "2026-04-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", basis: "RATIFIED_ONLY" }
              as: ProgramAdmin
