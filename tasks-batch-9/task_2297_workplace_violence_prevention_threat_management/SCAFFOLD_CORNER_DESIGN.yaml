      - name: overlapping_restrictions_reach_the_work_area_aggregate_ceiling
        claim_type: aggregate_validation
        grounds:
          - validations[priority=47]
          - errors[ERR_AREA_RESTRICTION_CAPACITY]
          - entities.WorkArea.fields.occupancy_cap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / work_area_restriction_aggregate_cap_with_unbuffered_half_open_overlap
          rationale: "The 1.8 instance already drives the aggregate count of overlapping ACCESS_RESTRICTION rows to the max(1, floor(occupancy_cap * 0.25)) ceiling and contrasts the rejected overlapping request with the accepted adjacent one."
      - name: escort_intervals_are_compared_with_a_thirty_minute_buffer
        claim_type: temporal_validation
        grounds:
          - validations[priority=46]
          - errors[ERR_ESCORT_DOUBLE_BOOKED]
          - entities.CaseAction.fields.escort_employee_id
        excluded_because:
          difficulty_instance: resource_temporal_overlap / escort_double_booking_blocked_by_thirty_minute_symmetric_buffer
          rationale: "The 1.8 instance already pins the symmetric ESCORT_BUFFER_MINUTES 30 comparison, including the touching-endpoints case that conflicts only because of the buffer, and the accepted request just outside it."
      - name: anti_retaliation_hold_outranks_the_window_rule
        claim_type: priority_conflict
        grounds:
          - validations[priority=20]
          - validations[priority=45]
          - errors[ERR_ANTI_RETALIATION_HOLD]
          - errors[ERR_MEASURE_OUTSIDE_PROTECTION_WINDOW]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / anti_retaliation_hold_outranks_protection_window_rule
          rationale: "The 1.8 instance already builds a request that violates both priority 20 and priority 45 and shows ERR_ANTI_RETALIATION_HOLD winning, then releases the hold to expose the lower-priority window error."
  - section: endpoints
    instances:
      - name: training_module_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /training-modules]
          - endpoints[GET /training-modules/{module_id}]
          - endpoints[GET /training-modules]
          - entities.TrainingModule
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The plain CRUD triple on the one entity with no state machine: create echoes every stored
          field, the single read returns byte-identical values, the collection read reports total_count 2
          with has_more paging, and the boolean filter required_for_escort narrows to exactly the module
          that gates escort duty.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One TrainingModule WVP-ADMIN already exists (job_function_scope [\"ADMIN\"], scenario_set_version 2026.1, refresh_interval_days 365, passing_score 80, required_for_escort false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /training-modules"
              payload: { code: "WVP-ADMIN", job_function_scope: ["ADMIN"], scenario_set_version: "2026.1", refresh_interval_days: 365, passing_score: 80, required_for_escort: false }
              as: ProgramAdmin
              captures: { mod_adm_id: $.data.id }
          trigger:
            - call: "POST /training-modules"
              payload: { code: "WVP-CASH", job_function_scope: ["CASH_HANDLING", "SECURITY"], scenario_set_version: "2026.2", refresh_interval_days: 180, passing_score: 75, required_for_escort: true }
              as: ProgramAdmin
              captures: { mod_cash_id: $.data.id }
            - call: "GET /training-modules/${mod_cash_id}"
              payload: {}
              as: ProgramAdmin
              captures: { echo_id: $.data.id }
            - call: "GET /training-modules"
              payload: { limit: 1, offset: 1 }
              as: ComplianceAuditor
            - call: "GET /training-modules"
              payload: { required_for_escort: true }
              as: ProgramAdmin
          assert:
            - "The create call returns HTTP 201 with code == \"WVP-CASH\", job_function_scope == [\"CASH_HANDLING\", \"SECURITY\"], scenario_set_version == \"2026.2\", refresh_interval_days == 180, passing_score == 75 and required_for_escort == true"
            - "The single read returns HTTP 200 with $.data.id == ${mod_cash_id} and every field equal to the create response"
            - "The paginated list returns HTTP 200 with exactly 1 element, total_count == 2, limit == 1, offset == 1 and has_more == false"
            - "The filtered list returns total_count == 1 and its only element has id == ${mod_cash_id}"
            - "No PreventionPlan exists, so publishing a module changes no compliance metric"
      - name: clock_endpoint_moves_time_without_moving_any_row
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[POST /_ops/daily-run]
          - entities.TrainingAssignment.fields.status
          - state_machines.TrainingAssignment.ASSIGNED_to_EXPIRED
          - complexity_profile.complexity_layers.scheduled_actions
        distinguishing_aspect: |
          The clock endpoint is the only source of "now" and it is pure: advancing it past an
          assignment's due_at leaves that assignment ASSIGNED, and only the separate ops run - reading the
          clock the endpoint set - performs the ASSIGNED -> EXPIRED sweep.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default, never wall-clock time)."
            - "Worksite \"North Plant\" with one WorkArea; three SECURITY-job_function employees back the SafetyOfficer, SiteManager and HRPartner roles."
            - "One ADMIN-job_function Employee \"Wendy Cole\" holds one ASSIGNED TrainingAssignment for WVP-ADMIN with due_at 2026-08-20T00:00:00Z and attempt_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Wendy Cole", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { w1_id: $.data.id, w1_id_v: $.data.version }
            - call: "POST /training-modules"
              payload: { code: "WVP-ADMIN", job_function_scope: ["ADMIN"], scenario_set_version: "2026.1", refresh_interval_days: 365, passing_score: 80, required_for_escort: false }
              as: ProgramAdmin
              captures: { mod_adm_id: $.data.id }
            - call: "POST /training-assignments"
              payload: { employee_id: "${w1_id}", module_id: "${mod_adm_id}", due_at: "2026-08-20T00:00:00Z", expected_employee_version: "${w1_id_v}" }
              as: HRPartner
