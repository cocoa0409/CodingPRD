      - name: a_site_with_no_racks_still_reports_the_base_service_fee
        claim_type: Computed read
        grounds:
          - endpoints[GET /warewashing/sites/{site_id}/sustainability-report]
          - calculations.sustainability_savings
        distinguishing_aspect: |
          The degenerate window exposes the fee structure with no arithmetic to hide behind: zero racks
          and zero deliveries give gross_savings 0, chemical_spend 0 and yet gross_program_cost 25000
          because BASE_SERVICE_FEE_CENTS is unconditional, service_fee_rate 0.08 from the lowest tier,
          service_fee 0 because the rate multiplies chemical spend only, credit 0 (not negative, and not
          the 5% of a zero saving rounded up), net 25000 and goal_attainment_pct 0.00. An implementation
          that charges the fee on the program cost, or that skips the base fee when nothing happened,
          diverges here.
        test_recipe:
          setup:
            - "One site under an ACTIVE agreement with no placements, no deliveries and no telemetry."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "GET /warewashing/sites/${site_id}/sustainability-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z", basis: "RATED" }
              as: CustomerContact
              as_user_id: "${cust_id}"
              captures: { racks: $.data.rack_count, gross_sav: $.data.gross_savings_cents, spend: $.data.chemical_spend_cents, gross_cost: $.data.gross_program_cost_cents, rate: $.data.service_fee_rate, fee: $.data.service_fee_cents, credit: $.data.sustainability_credit_cents, net: $.data.net_program_cost_cents, goal: $.data.goal_attainment_pct }
            - call: "GET /warewashing/sites/${site_id}/sustainability-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z", basis: "NAMEPLATE" }
              as: CustomerContact
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${racks} == 0, ${gross_sav} == 0 and ${spend} == 0"
            - "${gross_cost} == 25000 (BASE_SERVICE_FEE_CENTS alone) with ${rate} == 0.08"
            - "${fee} == 0 - the rate applies to chemical spend, not to the program cost"
            - "${credit} == 0 and ${net} == 25000 with ${goal} == 0.00"
            - "${err} == ERR_INVALID_REQUEST (400) - NAMEPLATE is the variance basis, not a sustainability basis"

      - name: a_draft_review_does_not_freeze_the_deliveries_it_covers
        claim_type: Conditional action
        grounds:
          - endpoints[POST /warewashing/chemical-deliveries/{delivery_id}/void]
          - validations.delivery_period_not_closed
        distinguishing_aspect: |
          The void is conditional on the covering review's status, and DRAFT is explicitly not closing:
          the delivery inside a DRAFT review's window voids to VOIDED and bumps Site.version, whereas the
          same call under a PUBLISHED review is ERR_DELIVERY_IN_CLOSED_PERIOD. Voiding twice is then an
          invalid transition, because VOIDED is terminal.
        test_recipe:
          setup:
