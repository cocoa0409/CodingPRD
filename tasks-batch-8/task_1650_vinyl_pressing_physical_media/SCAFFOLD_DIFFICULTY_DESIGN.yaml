scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: quote_vs_final_invoice_divergence
    grounds:
    - calculations.press_quote_price
    - calculations.final_invoice_total
    - calculations.overrun_billing_units
    distinguishing_aspect: 'Same order data priced twice: the forward-looking quote prices

      quantity_ordered=1000 (quote_total_cents 448420) while the final

      invoice prices billed_units=970 after actual rejects (net_cents

      439455) — provisional and final variants on the PressOrder cost

      domain yield different totals.

      '
    test_recipe:
      setup:
      - STANDARD customer (discount 0), LP 180g release, order qty 1000 all BLACK, quoted+confirmed, tooling done, TP approved, scheduled on L1
        2026-08-10 0-8, pressed 1000 with 30 rejects, ACCEPTed, invoiced
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: D1 Label
          contact_email: d1@x.com
          credit_limit_cents: 100000000
          discount_tier: STANDARD
          overrun_policy: ACCEPT_AND_BILL_10
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: D1-001
          title: T1
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /press-lines
        payload:
          line_code: L1
          tonnage_class: STANDARD
          hours_per_day: 16
          daily_unit_capacity: 5000
        as: ProductionPlanner
        captures:
          line: $.data.id
      - call: POST /plating-baths
        payload:
          bath_code: B1
          rinse_gap_minutes: 2
        as: ProductionPlanner
        captures:
          bath: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          quote_total: $.data.quote_total_cents
          ord_v2: $.data.version
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${cust}
      - call: POST /press-orders/${ord}/start-tooling
        payload: {}
        as: ProductionPlanner
      - call: GET /press-orders/${ord}/tooling-jobs
        as: Any
        captures:
          tool: $.data[0].id
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_CUT
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: CUT_DONE
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_PLATING
          plating_bath_id: ${bath}
          plating_start: 2
          plating_end: 6
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: PLATING_DONE
        as: PressOperator
      - call: POST /press-orders/${ord}/test-pressings
        payload:
          quantity: 5
        as: PressOperator
        captures:
          tp: $.data.id
      - call: POST /test-pressings/${tp}/ship
        payload: {}
        as: ProductionPlanner
      - call: POST /test-pressings/${tp}/review
        payload:
          decision: APPROVE
        as: Customer
        as_user_id: ${cust}
      - call: GET /press-orders/${ord}
        as: Any
        captures:
          ord_vq: $.data.version
      - call: POST /press-orders/${ord}/schedule-commits
        payload:
          expected_press_order_version: ${ord_vq}
          slots:
          - press_line_id: ${line}
            date: '2026-08-10'
            start_hour: 0
            end_hour: 8
            planned_units: 1000
        as: ProductionPlanner
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T00:00:00Z'
        as: PlatformAdmin
      - call: POST /press-orders/${ord}/production-events
        payload:
          event: START_PRESSING
        as: PressOperator
      - call: POST /press-orders/${ord}/production-events
        payload:
          event: COMPLETE_PRESSING
        as: PressOperator
      - call: POST /press-orders/${ord}/qc-reports
        payload:
          units_pressed: 1000
          units_rejected: 30
        as: QaInspector
        as_user_id: qa-1
        captures:
          qc: $.data.id
      - call: POST /qc-reports/${qc}/decision
        payload:
          decision: ACCEPT
          fault: NONE
        as: ProductionManager
        as_user_id: pm-1
      trigger:
      - call: POST /press-orders/${ord}/invoices
        payload: {}
        as: BillingClerk
        captures:
          inv_net: $.data.net_cents
          inv_gross: $.data.gross_cents
      assert:
      - PressOrder.${ord}.quote_total_cents == 448420
      - Invoice net_cents == 439455 (pressing 280205 + surcharge 24250 + tooling 95000 + setup 40000 on billed 970)
      - Invoice gross_cents == 439455 and 439455 != 448420 (quote and final diverge for identical order data)
  - name: backlog_optimistic_vs_conservative
    grounds:
    - calculations.backlog_projection
    - entities.PressLine.fields.daily_unit_capacity
    distinguishing_aspect: 'Identical slot book (one 8h slot on a 16h line) yields

      optimistic_backlog_days 0.50 vs conservative_backlog_days 0.63

      (25% repress inflation); after a REPRESS decision the conservative

      variant additionally absorbs the repress queue (0.88) while the

      optimistic variant stays 0.50 — capacity-domain dual variant,

      distinct from the PressOrder cost domain.

      '
    test_recipe:
      setup:
      - order scheduled on line L1 with one 8h slot on 2026-08-10; later the run is rejected (HOLD) and a PLANT-fault REPRESS returns the order
        to QUEUED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: D2 Label
          contact_email: d2@x.com
          credit_limit_cents: 100000000
          discount_tier: STANDARD
          overrun_policy: ACCEPT_AND_BILL_10
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: D2-001
          title: T2
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /press-lines
        payload:
          line_code: L1
          tonnage_class: STANDARD
          hours_per_day: 16
          daily_unit_capacity: 5000
        as: ProductionPlanner
        captures:
          line: $.data.id
      - call: POST /plating-baths
        payload:
          bath_code: B1
          rinse_gap_minutes: 2
        as: ProductionPlanner
        captures:
          bath: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${cust}
      - call: POST /press-orders/${ord}/start-tooling
        payload: {}
        as: ProductionPlanner
      - call: GET /press-orders/${ord}/tooling-jobs
        as: Any
        captures:
          tool: $.data[0].id
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_CUT
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: CUT_DONE
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_PLATING
          plating_bath_id: ${bath}
          plating_start: 2
          plating_end: 6
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: PLATING_DONE
        as: PressOperator
      - call: POST /press-orders/${ord}/test-pressings
        payload:
          quantity: 5
        as: PressOperator
        captures:
          tp: $.data.id
      - call: POST /test-pressings/${tp}/ship
        payload: {}
        as: ProductionPlanner
      - call: POST /test-pressings/${tp}/review
        payload:
          decision: APPROVE
        as: Customer
        as_user_id: ${cust}
      - call: GET /press-orders/${ord}
        as: Any
        captures:
          ord_vq: $.data.version
      - call: POST /press-orders/${ord}/schedule-commits
        payload:
          expected_press_order_version: ${ord_vq}
          slots:
          - press_line_id: ${line}
            date: '2026-08-10'
            start_hour: 0
            end_hour: 8
            planned_units: 1000
        as: ProductionPlanner
      - call: GET /press-lines/${line}/backlog
        as: Any
        captures:
          opt1: $.data.optimistic_backlog_days
          cons1: $.data.conservative_backlog_days
          booked1: $.data.booked_hours
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T00:00:00Z'
        as: PlatformAdmin
      - call: POST /press-orders/${ord}/production-events
        payload:
          event: START_PRESSING
        as: PressOperator
      - call: POST /press-orders/${ord}/production-events
        payload:
          event: COMPLETE_PRESSING
        as: PressOperator
      - call: POST /press-orders/${ord}/qc-reports
        payload:
          units_pressed: 1000
          units_rejected: 100
        as: QaInspector
        as_user_id: qa-1
        captures:
          qc: $.data.id
      - call: POST /qc-reports/${qc}/decision
        payload:
          decision: REPRESS
          fault: PLANT
        as: ProductionManager
        as_user_id: pm-1
      trigger:
      - call: GET /press-lines/${line}/backlog
        as: Any
        captures:
          opt2: $.data.optimistic_backlog_days
          cons2: $.data.conservative_backlog_days
      assert:
      - 'before repress: booked_hours == 8, optimistic_backlog_days == 0.50, conservative_backlog_days == 0.63 (round_half_up(8*1.25/16, 2))'
      - 'after repress: optimistic_backlog_days == 0.50 (unchanged) while conservative_backlog_days == 0.88 (round_half_up((8*1.25 + ceil(1000/312))/16,
        2) = 14/16)'
      - opt2 == opt1 and cons2 != cons1 — only the conservative variant reacts to the repress queue
  - name: storage_accrual_vs_statement_divergence
    grounds:
    - calculations.storage_fee
    - entities.InventoryLot.fields.storage_daily_accrual_cents
    - entities.InventoryLot.fields.storage_monthly_statement_cents
    distinguishing_aspect: 'Same pallet-day data (10 LP pallets held over a 30-day window) prices

      as 16500 cents under the daily-accrual variant vs 15000 cents under

      the monthly-statement variant — warehousing-domain dual variant,

      distinct from cost (PressOrder) and capacity (PressLine) domains.

      '
    test_recipe:
      setup:
      - InventoryLot zone A holds 1000 LP units (10 pallets) received 2026-08-01; clock advanced to 2026-08-31 so the trailing 30-day window [08-02..08-31]
        sees 10 pallets every day
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: D3 Label
          contact_email: d3@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: D3-001
          title: T3
          format: LP
          weight_gram: 140
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /inventory-lots
        payload:
          release_id: ${rel}
          zone: A
        as: WarehouseManager
        captures:
          lot: $.data.id
      - call: POST /inventory-lots/${lot}/stock-events
        payload:
          event: RECEIVE
          quantity: 1000
          event_date: '2026-08-01'
        as: WarehouseManager
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-31T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /inventory-lots/${lot}
        as: Any
        captures:
          daily: $.data.storage_daily_accrual_cents
          monthly: $.data.storage_monthly_statement_cents
      assert:
      - InventoryLot.${lot}.storage_daily_accrual_cents == 16500 (30 days x 10 pallets x 55)
      - InventoryLot.${lot}.storage_monthly_statement_cents == 15000 (max(10.00 x 1500, 5000))
      - daily != monthly for identical pallet-day data
- rule_id: combinatorial_formula
  instances:
  - name: quote_tier_floor_and_status_branch
    grounds:
    - calculations.press_quote_price
    distinguishing_aspect: 'Mode (a) >=3 inputs with non-linear interaction: marginal tier

      selection across a quantity boundary, the nested max() minimum

      surcharge floor engaging on SOLID_COLOR 100 (3500 -> 5000), and the

      discount branch keyed on Customer tier/status.

      '
    test_recipe:
      setup:
      - SILVER customer; order1 qty 1000 = SOLID_COLOR 100 + BLACK 900, 180g, 2 sides; order2 qty 5200 = SPLATTER 200 + BLACK 5000, 140g (straddles
        all four marginal tiers)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: CF Label
          contact_email: cf@x.com
          credit_limit_cents: 100000000
          discount_tier: SILVER
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: CF-001
          title: TA
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel1: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: CF-002
          title: TB
          format: LP
          weight_gram: 140
          release_date: '2027-02-01'
        as: CustomerServiceRep
        captures:
          rel2: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel1}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: SOLID_COLOR
            quantity: 100
          - color_config: BLACK
            quantity: 900
        as: CustomerServiceRep
        captures:
          ord1: $.data.id
          ord1_v: $.data.version
      - call: POST /press-orders/${ord1}/quotes
        payload:
          expected_press_order_version: ${ord1_v}
        as: CustomerServiceRep
        captures:
          q1_surch: $.data.quote_surcharge_cents
          q1_setup: $.data.quote_setup_cents
          q1_sub: $.data.quote_subtotal_cents
          q1_disc: $.data.quote_discount_cents
          q1_total: $.data.quote_total_cents
      - call: POST /press-orders
        payload:
          release_id: ${rel2}
          quantity_ordered: 5200
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: SPLATTER
            quantity: 200
          - color_config: BLACK
            quantity: 5000
        as: CustomerServiceRep
        captures:
          ord2: $.data.id
          ord2_v: $.data.version
      trigger:
      - call: POST /press-orders/${ord2}/quotes
        payload:
          expected_press_order_version: ${ord2_v}
        as: CustomerServiceRep
        captures:
          q2_press: $.data.quote_pressing_cents
          q2_tool: $.data.quote_tooling_cents
          q2_total: $.data.quote_total_cents
      assert:
      - order1 quote_surcharge_cents == 30000 (SOLID_COLOR floor max(100*35, 5000)=5000 + 1000*25 weight)
      - order1 quote_setup_cents == 55000 (40000 + 15000 x 1 non-BLACK variant)
      - order1 quote_subtotal_cents == 468420; quote_discount_cents == 14053 (round_half_up(468420 x 0.03)); quote_total_cents == 454367
      - order2 quote_pressing_cents == 1290390 (299x320 + 700x275 + 4000x240 + 201x210 marginal straddle)
      - order2 quote_tooling_cents == 395000 (2x17500 + ceil(5200/1000)x2x30000) and quote_total_cents == 1698848 (round_half_up(1751390 x 0.03)
        = 52542 discount)
