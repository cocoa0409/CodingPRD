scaffold_corner_design:
- section: entities
  instances:
  - name: enrollment_creation_returns_initial_state
    claim_type: creation
    grounds:
    - entities.Enrollment
    - state_machines.Enrollment
    distinguishing_aspect: POST /hub/enrollments with all required fields returns 201 with status INTAKE, version 1, training_sessions_completed 0, fills_delivered_count 0, therapy_start_date null.
    test_recipe:
      setup:
      - one program exists
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgE1
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      trigger:
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-001
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
          st: $.data.status
          ver: $.data.version
          tsc: $.data.training_sessions_completed
          fdc: $.data.fills_delivered_count
          tsd: $.data.therapy_start_date
      assert:
      - HTTP 201; ${st} == INTAKE (initial state); ${ver} == 1
      - ${tsc} == 0 and ${fdc} == 0 and ${tsd} == null
      - ${enr_id} is a server-minted UUID without any type prefix
  - name: enrollment_retrieval_matches_created_data
    claim_type: retrieval
    grounds:
    - entities.Enrollment
    - endpoints
    distinguishing_aspect: GET /hub/enrollments/{id} returns exactly the stored patient_ref, diagnosis_code, program linkage and case_manager_id from X-User-ID.
    test_recipe:
      setup:
      - one enrollment created by case manager cm-7
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgE2
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-002
          diagnosis_code: C50
        as: CaseManager
        as_user_id: cm-7
        captures:
          enr_id: $.data.id
      trigger:
      - call: GET /hub/enrollments/${enr_id}
        as: PayerReviewer
        captures:
          pr: $.data.patient_ref
          dc: $.data.diagnosis_code
          dp: $.data.program_id
          cm: $.data.case_manager_id
      assert:
      - ${pr} == PAT-002 and ${dc} == C50 and ${dp} == ${prog_id}
      - ${cm} == cm-7 (audit field stamped from X-User-ID); any role may read
  - name: enrollment_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_ENROLLMENT_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but nonexistent UUID returns 404 ERR_ENROLLMENT_NOT_FOUND, not a 500 or empty 200.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /hub/enrollments/00000000-0000-0000-0000-000000000000
        as: CaseManager
        captures:
          err: $.data.error_id
      assert:
      - HTTP 404 and ${err} == ERR_ENROLLMENT_NOT_FOUND
  - name: enrollment_list_pagination_and_filter
    claim_type: listing
    grounds:
    - endpoints
    - response_envelope
    distinguishing_aspect: GET /hub/enrollments honors limit/offset with envelope pagination fields, and program_id filters to exactly the matching enrollments.
    test_recipe:
      setup:
      - two programs; two enrollments on program 1 and one on program 2
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgL1
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_1: $.data.id
      - call: POST /hub/drug-programs
        payload:
          name: ProgL2
          manufacturer_name: Mfr
          diagnosis_code: E11
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_2: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_1}
          patient_ref: PAT-L1
          diagnosis_code: C50
        as: CaseManager
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_1}
          patient_ref: PAT-L2
          diagnosis_code: C50
        as: CaseManager
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_2}
          patient_ref: PAT-L3
          diagnosis_code: E11
        as: CaseManager
      trigger:
      - call: GET /hub/enrollments?program_id=${prog_1}&limit=1&offset=0
        as: CaseManager
        captures:
          total: $.data[0].id
      - call: GET /hub/enrollments?program_id=${prog_1}
        as: CaseManager
      assert:
      - 'page with limit=1: total_count == 2 and has_more == true and exactly 1 item returned'
      - 'unfiltered-by-page list with program_id filter: total_count == 2 (the E11 enrollment is excluded)'
      - envelope carries limit/offset/total_count/has_more with defaults limit=10, offset=0 when omitted
  - name: enrollment_create_missing_required_program_id
    claim_type: required_fields
    grounds:
    - entities.Enrollment.fields.program_id
    - errors[ERR_VALIDATION]
    distinguishing_aspect: Omitting required program_id returns 400 ERR_VALIDATION and creates nothing.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /hub/enrollments
        payload:
          patient_ref: PAT-X
          diagnosis_code: C50
        as: CaseManager
        captures:
          err: $.data.error_id
      assert:
      - HTTP 400 and ${err} == ERR_VALIDATION
  - name: enrollment_create_extra_system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Enrollment
    distinguishing_aspect: 'Client-supplied id / version / created_at in the create body are ignored (or rejected 400); the server-minted values govern: version == 1 and id is server-generated, never the
      client value.'
    test_recipe:
      setup:
      - one program
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgE3
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      trigger:
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-003
          diagnosis_code: C50
        as: CaseManager
        captures:
          ver: $.data.version
          eid: $.data.id
      assert:
      - ${ver} == 1 regardless of any client version hint; ${eid} is a fresh UUID (server-minted)
  - name: bi_record_immutable_without_version
    claim_type: immutability
    grounds:
    - entities.BenefitsInvestigation
    distinguishing_aspect: 'BenefitsInvestigation declares common_fields: false — its response carries id and created_at but NO version/updated_at, and the scaffold exposes no update endpoint for it.'
    test_recipe:
      setup:
      - enrollment in INTAKE
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgBI
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-BI
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
      trigger:
      - call: POST /hub/enrollments/${enr_id}/benefits-investigation
        payload:
          payer_name: Acme
          member_id: M-BI
          requires_prior_auth: true
          plan_has_accumulator: true
          patient_cost_share_cents: 20000
          oop_max_cents: 500000
        as: CaseManager
      - call: GET /hub/enrollments/${enr_id}/benefits-investigation
        as: CaseManager
      assert:
      - create returns 201; the record JSON has no version and no updated_at keys
      - sub-resource GET returns an array of length 1 with the same immutable fields
  - name: foundation_pool_creation_initializes_computed_balance
    claim_type: computed_fields
    grounds:
    - entities.FoundationPool.fields.remaining_balance_cents
    distinguishing_aspect: 'remaining_balance_cents is computed (source: computed): the create response sets it to total_funding_cents and any client-supplied value for it is not honored.'
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /hub/foundation-pools
        payload:
          name: FundC
          diagnosis_code: C50
          total_funding_cents: 5000000
          grant_amount_cents: 200000
          coverage_pct: 80
          start_date: '2026-01-01'
          end_date: '2026-12-31'
        as: HubAdmin
        captures:
          bal: $.data.remaining_balance_cents
      assert:
      - ${bal} == 5000000 (computed initializer, not client input)
  - name: enrollment_computed_fields_null_before_therapy
    claim_type: computed_fields
    grounds:
    - entities.Enrollment.fields.pdc_confirmed_pct
    - entities.Enrollment.fields.remaining_oop_cents
    distinguishing_aspect: Before therapy starts the PDC fields are null (not 0.0), and remaining_oop_cents is null until the BI posts oop_max_cents, then equals it exactly.
    test_recipe:
      setup:
      - enrollment created; BI posted with oop_max 500000 (no PA) -> APPROVED, no shipments
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgE4
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-004
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
          rem0: $.data.remaining_oop_cents
      - call: POST /hub/enrollments/${enr_id}/benefits-investigation
        payload:
          payer_name: Acme
          member_id: M-4
          requires_prior_auth: false
          plan_has_accumulator: false
          patient_cost_share_cents: 20000
          oop_max_cents: 500000
        as: CaseManager
      trigger:
      - call: GET /hub/enrollments/${enr_id}
        as: CaseManager
        captures:
          pdc_c: $.data.pdc_confirmed_pct
          pdc_p: $.data.pdc_provisional_pct
          rem1: $.data.remaining_oop_cents
          st: $.data.status
      assert:
      - at creation ${rem0} == null; after BI ${rem1} == 500000
      - ${pdc_c} == null and ${pdc_p} == null (no therapy start yet) and ${st} == APPROVED
- section: state_machines
  instances:
  - name: pa_appeal_from_submitted_returns_invalid_transition
    claim_type: invalid_transition
    grounds:
    - state_machines.PriorAuthorization
    - errors[ERR_INVALID_TRANSITION]
    distinguishing_aspect: Appeal is declared only from DENIED; from SUBMITTED it must fail with ERR_INVALID_TRANSITION and appeal_round stays 0.
    test_recipe:
      setup:
      - enrollment PA_PENDING with a SUBMITTED PA
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgS1
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-S1
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
      - call: POST /hub/enrollments/${enr_id}/benefits-investigation
        payload:
          payer_name: Acme
          member_id: M-S1
          requires_prior_auth: true
          plan_has_accumulator: false
          patient_cost_share_cents: 20000
          oop_max_cents: 500000
        as: CaseManager
      - call: POST /hub/enrollments/${enr_id}/prior-authorization
        payload:
          clinical_notes: n
          payer_reference: PA-1
        as: CaseManager
        captures:
          pa_id: $.data.id
      trigger:
      - call: POST /hub/prior-authorizations/${pa_id}/appeal
        payload: {}
        as: CaseManager
        captures:
          err: $.data.error_id
      assert:
      - HTTP 409 and ${err} == ERR_INVALID_TRANSITION
      - GET prior-authorizations shows status SUBMITTED and appeal_round == 0 (no mutation)
  - name: shipment_ship_from_requested_returns_invalid_transition
    claim_type: invalid_transition
    grounds:
    - state_machines.Shipment
    - errors[ERR_INVALID_TRANSITION]
    distinguishing_aspect: Ship is declared only from SCHEDULED; a shipment created during PA_PENDING sits in REQUESTED and ship must fail with ERR_INVALID_TRANSITION.
    test_recipe:
      setup:
      - enrollment PA_PENDING (no training gate); shipment created -> REQUESTED
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgS2
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-S2
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
      - call: POST /hub/enrollments/${enr_id}/benefits-investigation
        payload:
          payer_name: Acme
          member_id: M-S2
          requires_prior_auth: true
          plan_has_accumulator: false
          patient_cost_share_cents: 20000
          oop_max_cents: 500000
        as: CaseManager
      - call: POST /hub/enrollments/${enr_id}/prior-authorization
        payload:
          clinical_notes: n
          payer_reference: PA-1
        as: CaseManager
      - call: POST /hub/enrollments/${enr_id}/shipments
        payload:
          requested_delivery_date: '2026-08-05'
          transit_hours: 24
          days_supply: 30
        as: CaseManager
        captures:
          ship_id: $.data.id
          st0: $.data.status
      trigger:
      - call: POST /hub/shipments/${ship_id}/ship
        payload: {}
        as: PharmacyPartner
        captures:
          err: $.data.error_id
      assert:
      - ${st0} == REQUESTED (conditional initial state while enrollment is PA_PENDING)
      - HTTP 409 and ${err} == ERR_INVALID_TRANSITION; no split fields are set on the shipment
  - name: outcome_report_submit_valid_transition
    claim_type: valid_transition
    grounds:
    - state_machines.OutcomeReport
    distinguishing_aspect: DRAFT -> SUBMITTED succeeds exactly once; the response and re-read agree on SUBMITTED.
    test_recipe:
      setup:
      - enrollment ACTIVE (one delivered fill); DRAFT report created with current enrollment version
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgS3
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-S3
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
      - call: POST /hub/enrollments/${enr_id}/benefits-investigation
        payload:
          payer_name: Acme
          member_id: M-S3
          requires_prior_auth: false
          plan_has_accumulator: false
          patient_cost_share_cents: 20000
          oop_max_cents: 500000
        as: CaseManager
      - call: POST /hub/enrollments/${enr_id}/shipments
        payload:
          requested_delivery_date: '2026-08-01'
          transit_hours: 24
          days_supply: 30
        as: CaseManager
        captures:
          ship_1: $.data.id
      - call: POST /hub/shipments/${ship_1}/ship
        payload: {}
        as: PharmacyPartner
      - call: POST /hub/shipments/${ship_1}/deliver
        payload:
          delivered_date: '2026-08-01'
        as: PharmacyPartner
      - call: GET /hub/enrollments/${enr_id}
        as: CaseManager
        captures:
          enr_v: $.data.version
      - call: POST /hub/enrollments/${enr_id}/outcome-reports
        payload:
          period_start: '2026-08-01'
          period_end: '2026-09-01'
          expected_enrollment_version: ${enr_v}
        as: CaseManager
        captures:
          rep_id: $.data.id
          st0: $.data.status
      trigger:
      - call: POST /hub/outcome-reports/${rep_id}/submit
        payload: {}
        as: CaseManager
        captures:
          st1: $.data.status
      assert:
      - ${st0} == DRAFT (initial state) and ${st1} == SUBMITTED
      - GET outcome-reports lists the report as SUBMITTED
  - name: adverse_event_acknowledge_twice_returns_already_terminal
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.AdverseEvent
    - errors[ERR_ALREADY_TERMINAL]
    distinguishing_aspect: 'ACKNOWLEDGED is terminal: a second acknowledge returns ERR_ALREADY_TERMINAL and the record is unchanged.'
    test_recipe:
      setup:
      - enrollment INTAKE; one AE reported at the default clock (awareness 2026-07-31T12:00:00Z is 12h before 2026-08-01T00:00:00Z)
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgS4
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-S4
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
      - call: POST /hub/enrollments/${enr_id}/adverse-events
        payload:
          awareness_at: '2026-07-31T12:00:00Z'
          seriousness: NON_SERIOUS
          description: mild rash
        as: NurseEducator
        as_user_id: nurse-9
        captures:
          ae_id: $.data.id
      trigger:
      - call: POST /hub/adverse-events/${ae_id}/acknowledge
        payload: {}
        as: ManufacturerMonitor
        captures:
          st1: $.data.status
      - call: POST /hub/adverse-events/${ae_id}/acknowledge
        payload: {}
        as: ManufacturerMonitor
        captures:
          err: $.data.error_id
      assert:
      - 'first ack: ${st1} == ACKNOWLEDGED'
      - 'second ack: HTTP 409 and ${err} == ERR_ALREADY_TERMINAL (terminal lockdown)'
  - name: enrollment_discontinue_cascades_to_children
    claim_type: side_effect_execution
    grounds:
    - state_machines.Enrollment.ACTIVE_to_DISCONTINUED
    - state_machines.Shipment
    - state_machines.CopayAssistance
    distinguishing_aspect: 'Cascade-down: discontinuing an ACTIVE enrollment cancels its SCHEDULED refill and RELEASES its card assistance with returned_cents == cap - disbursed (85000).'
    test_recipe:
      setup:
      - enrollment ACTIVE; card ACTIVE with 15000 disbursed of 100000; one SCHEDULED refill pending
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgS5
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
          copay_card_per_fill_cap_cents: 15000
          copay_card_annual_cap_cents: 100000
          default_days_supply: 30
        as: HubAdmin
        captures:
          prog_id: $.data.id
      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-S5
          diagnosis_code: C50
        as: CaseManager
        captures:
          enr_id: $.data.id
      - call: POST /hub/enrollments/${enr_id}/benefits-investigation
        payload:
          payer_name: Acme
          member_id: M-S5
          requires_prior_auth: false
          plan_has_accumulator: false
          patient_cost_share_cents: 20000
          oop_max_cents: 500000
        as: CaseManager
      - call: GET /hub/enrollments/${enr_id}
        as: CaseManager
        captures:
          enr_v: $.data.version
      - call: POST /hub/enrollments/${enr_id}/copay-assistance/match
        payload:
          assistance_type: COPAY_CARD
          expected_enrollment_version: ${enr_v}
        as: FinancialCounselor
        captures:
          asst_id: $.data.id
      - call: POST /hub/enrollments/${enr_id}/shipments
        payload:
          requested_delivery_date: '2026-08-01'
          transit_hours: 24
          days_supply: 30
        as: CaseManager
        captures:
          ship_1: $.data.id
      - call: POST /hub/shipments/${ship_1}/ship
        payload: {}
        as: PharmacyPartner
      - call: POST /hub/shipments/${ship_1}/deliver
        payload:
          delivered_date: '2026-08-01'
        as: PharmacyPartner
      - call: POST /hub/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-21T00:00:00Z'
        as: HubAdmin
      - call: POST /hub/enrollments/${enr_id}/shipments
        payload:
          requested_delivery_date: '2026-08-22'
          transit_hours: 24
          days_supply: 30
        as: CaseManager
        captures:
          ship_2: $.data.id
      trigger:
      - call: POST /hub/enrollments/${enr_id}/discontinue
        payload:
          reason: therapy stopped
        as: CaseManager
        captures:
          enr_st: $.data.status
