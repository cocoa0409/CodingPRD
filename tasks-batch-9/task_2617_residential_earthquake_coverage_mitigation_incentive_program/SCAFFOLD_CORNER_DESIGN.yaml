          assert:
            - "${pj_status} == \"AWAITING_INSPECTION\" - the project is schedulable, so nothing but the window can fail"
            - "${empty_err} == \"ERR_INVALID_WINDOW\" with HTTP 422 - window_end == window_start is an empty interval and is caught before the duration rule"
            - "${short_err} == \"ERR_INSPECTION_DURATION_INVALID\" (20 minutes < INSPECTION_MIN_MINUTES 30)"
            - "${long_err} == \"ERR_INSPECTION_DURATION_INVALID\" (300 minutes > INSPECTION_MAX_MINUTES 240)"
            - "${past_err} == \"ERR_INSPECTION_IN_PAST\" - the 120-minute window is legal but starts before the 2026-08-01 clock"
            - "${ok_id} is created with ${ok_result} == \"PENDING\" and ${ok_ct} == \"${ct_id}\" - the 120-minute future window passes every rule"

      - name: duplicate_open_grant_per_dwelling_is_rejected_until_the_first_is_withdrawn
        claim_type: violation_to_error
        grounds:
          - validations.ERR_DUPLICATE_OPEN_GRANT
          - state_machines.RetrofitGrant.transitions.withdraw
        distinguishing_aspect: "The uniqueness rule counts only the five non-terminal grant statuses, so a second grant on the same dwelling is refused while the first is SUBMITTED and becomes legal the moment the first reaches the terminal WITHDRAWN state."
        test_recipe:
          setup:
            - "One policyholder, one dwelling, one OPEN cycle"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Sami Okonjo", email: "sami@example.com", county_code: "06077" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "84 Unique Lane", county_hazard_tier: "TIER_2", soil_class: "SOFT", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1968, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "2026 Uniqueness", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-12-31T00:00:00Z", total_pool_cents: 1000000 }
              as: ProgramAdmin
              captures: { gc_id: $.data.id }
            - call: "POST /eqp/retrofit-grants"
              payload: { dwelling_id: "${dw_id}", grant_cycle_id: "${gc_id}", income_tier: "TIER_LOW", project_cost_estimate_cents: 200000, requested_scope: "CRIPPLE_WALL_BRACING" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { gr_1: $.data.id, gr_1_status: $.data.status }
          trigger:
            - call: "POST /eqp/retrofit-grants"
              payload: { dwelling_id: "${dw_id}", grant_cycle_id: "${gc_id}", income_tier: "TIER_MID", project_cost_estimate_cents: 100000, requested_scope: "ANCHOR_BOLT_ONLY" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { dup_err: $.data.error_id }
            - call: "POST /eqp/retrofit-grants/${gr_1}/withdraw"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { w_status: $.data.status }
            - call: "GET /eqp/grant-cycles/${gc_id}"
              payload: {}
              as: ProgramAdmin
              captures: { gc_res: $.data.reserved_cents, gc_unc: $.data.uncommitted_cents }
            - call: "POST /eqp/retrofit-grants"
              payload: { dwelling_id: "${dw_id}", grant_cycle_id: "${gc_id}", income_tier: "TIER_MID", project_cost_estimate_cents: 100000, requested_scope: "ANCHOR_BOLT_ONLY" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { gr_2: $.data.id, gr_2_status: $.data.status }
          assert:
            - "${gr_1_status} == \"SUBMITTED\" and ${dup_err} == \"ERR_DUPLICATE_OPEN_GRANT\" with HTTP 409"
            - "${w_status} == \"WITHDRAWN\" and the withdrawal from SUBMITTED moves no money: ${gc_res} == 0 and ${gc_unc} == 1000000"
            - "${gr_2} is created with ${gr_2_status} == \"SUBMITTED\" - the terminal first grant no longer blocks the dwelling"

      - name: sublimits_above_the_dwelling_limit_are_rejected
        claim_type: violation_to_error
        grounds:
