  - rule_id: non_linear_state_machine
    instances:
      - name: rating_cycle_awarded_under_appeal_awarded_cycle
        grounds:
          - state_machines.RatingCycle.OBSERVATION_FINALIZED_to_AWARDED
          - state_machines.RatingCycle.AWARDED_to_ACTIVE
          - state_machines.RatingCycle.ACTIVE_to_UNDER_APPEAL
          - state_machines.RatingCycle.UNDER_APPEAL_to_AWARDED
          - state_machines.Appeal.UNDER_REVIEW_to_SUSTAINED
          - calculations.validity_period
          - calculations.rating_tier_determination
          - entities.RatingCycle.fields.appeal_adjusted
        distinguishing_aspect: |
          RatingCycle is a cyclic machine, not a pipeline: the same row re-enters AWARDED
          a second time via ACTIVE -> UNDER_APPEAL -> AWARDED, and the second visit to
          AWARDED is observably different from the first because appeal_adjusted flips to
          true and calculations.validity_period reuses the ORIGINAL effective_date
          2026-09-01T00:00:00.000Z instead of recomputing it from the appeal decision date
          2026-09-08.
