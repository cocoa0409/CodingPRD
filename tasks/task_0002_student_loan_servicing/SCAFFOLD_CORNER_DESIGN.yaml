      - name: error_sod_violation_triggered
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_SOD_VIOLATION]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_safety_vs_state_pslf_approval_sod_vs_stale_version
          rationale: "Triggered as the priority-winner in the named §1.8 instance."

