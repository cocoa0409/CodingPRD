        distinguishing_aspect: "Publish from SUBSTANTIATED with fresh VERIFIED evidence succeeds: status PUBLISHED, version 3, published_at stamped from the logical clock; the pinned CERTIFIED report (95.00) remains the claim's report_id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. DOMESTIC factory (rate 50, overhead 600, 3 lines, capacity 1000)."
            - "Model M95 (DUAL_SOURCE): DOMESTIC_REQUIRED upper @1000 domestic lot + IMPORT_ALLOWED midsole @100 imported lot; standard minutes 2/2/2."
            - "STOCK run of 100 (week 2026-W36, allocation total 300 -> domestic pool 100) completed at actual minutes 2/2/2 -> CERTIFIED report: total 2000, domestic value 1900, us_content_pct 95.00."
            - "Claim MADE_IN_USA on M95, substantiated (claim-attached origin cert + labor record VERIFIED, valid 2026-08-01..2027-08-31)."
