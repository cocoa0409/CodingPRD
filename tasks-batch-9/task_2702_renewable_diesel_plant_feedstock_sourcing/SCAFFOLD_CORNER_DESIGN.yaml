              as: FeedstockTrader
              captures: { lot_a_id: $.data.id, lot_a_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_a_id}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_a_v0}" }
              as: QualityAnalyst
            - call: "POST /feedstock-lots/${lot_a_id}/acceptances"
              payload: {}
              as: QualityAnalyst
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "TALLOW", mass_mt: 200.000, attested_ci_gco2e_per_mj: 24.90, purchase_price_usd_per_mt: 880.00, received_at: "2026-08-01T00:00:00Z" }
