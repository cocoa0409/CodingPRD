            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 0.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_litho: $.data.id, cap0: $.data.available_capacity_hours, hsp0: $.data.hours_since_pm }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_litho}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
