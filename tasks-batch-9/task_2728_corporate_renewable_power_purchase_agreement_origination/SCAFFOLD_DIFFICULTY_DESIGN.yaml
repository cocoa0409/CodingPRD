              as: SettlementAnalyst
            - call: "POST /ppa/deals/${deal_m_id}/settlement-periods"
              payload: { period_start: "2027-07-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { sp_m_id: $.data.id, sp_m_v0: $.data.version }
            - call: "POST /ppa/settlement-periods/${sp_m_id}/intervals"
              payload: { hour_start: "2027-07-01T00:00:00Z", metered_mwh: 30.50, node_price_usd_per_mwh: 47.25, hub_price_usd_per_mwh: 50.00, curtailment_flag: "NONE", expected_settlement_period_version: "${sp_m_v0}" }
              as: SettlementAnalyst
            - call: "GET /ppa/settlement-periods/${sp_m_id}"
              as: SettlementAnalyst
              captures: { sp_m_v1: $.data.version }
            - call: "POST /ppa/settlement-periods/${sp_m_id}/intervals"
