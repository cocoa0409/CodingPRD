            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
