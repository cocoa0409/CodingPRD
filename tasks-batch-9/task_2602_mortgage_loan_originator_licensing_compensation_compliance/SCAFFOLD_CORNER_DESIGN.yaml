              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /advertisements"
              payload: { originator_id: "${orig_id}", medium: "RADIO", content_text: "Avery Lane, NMLS 2200001, California licence CA-DFPI-70001. Rates and terms are subject to credit approval and may change without notice; ask your licensed originator for the current written estimate and disclosure packet before you apply for any residential mortgage loan product in California today", target_state_codes: ["CA"], disclosed_nmls_ids: ["2200001"], disclosed_license_numbers: ["CA-DFPI-70001"] }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { ad_a: $.data.id }
            - call: "POST /advertisements"
              payload: { originator_id: "${orig_id}", medium: "RADIO", content_text: "Avery Lane, NMLS 2200001, California licence CA-DFPI-70001. Rates and terms are subject to credit approval and may change without notice; ask your licensed originator for the current written estimate and disclosure packet before you apply for any residential mortgage loan product in California today.", target_state_codes: ["CA"], disclosed_nmls_ids: ["2200001"], disclosed_license_numbers: ["CA-DFPI-70001"] }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { ad_b: $.data.id }
          trigger:
            - call: "POST /advertisements/${ad_a}/submissions"
              payload: {}
