      - name: voter_record_date_cutoff
        claim_type: cross_entity_validation
        grounds: [entities.AnnualMeeting.fields.record_date, "errors[ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE]"]
        distinguishing_aspect: "A member approved after the record_date is ACTIVE but not eligible to vote: the electorate is frozen by membership_effective_date <= record_date."
        test_recipe:
          setup: ["meeting record 2026-07-05; member approved 2026-07-10 (after record); window open at cast time 2026-07-15"]
          setup_api_calls:
