  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_depends_on_diet_order_review_state
        entity_pair: "SeatingReservation depends on DietOrder"
        grounds:
          - validations[priority=16]
          - errors[id=ERR_DIET_ORDER_NOT_VERIFIED]
          - endpoints[POST /seating-reservations]
          - state_machines.DietOrder.PENDING_REVIEW_to_ACTIVE
        distinguishing_aspect: |
          A write on SeatingReservation is gated by the review state of a DietOrder row that the
          request never names: the identical reservation payload is refused while the resident's only
          diet order sits at clinical_status PENDING_REVIEW / review_status AWAITING_DIETITIAN and
          accepted, unchanged, once the dietitian approves it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community, one MAIN_DINING venue with seat_capacity 8."
            - "One ACTIVE resident whose single DietOrder was just intaken by clinical staff and is therefore PENDING_REVIEW / AWAITING_DIETITIAN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Pinecrest", care_levels_offered: ["ASSISTED_LIVING"] }
