              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /invoices/${inv_id}/refund"
              payload: {}
