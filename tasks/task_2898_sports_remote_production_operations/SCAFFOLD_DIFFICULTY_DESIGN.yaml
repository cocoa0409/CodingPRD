  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: venue_survey_backward_revision_edge_reopened_by_child_creation
        grounds:
          - state_machines.VenueSurvey
          - entities.VenueSurvey.fields.revision
          - entities.VenueSurvey.fields.submitted_by_user_id
          - endpoints[POST /broadcast-ops/venue-surveys/{id}/camera-positions].side_effects
          - validations[priority=32]
        distinguishing_aspect: |
          VenueSurvey is not a forward ladder: the CHANGES_REQUESTED -> DRAFT backward edge is fired
          by creating a *child* camera position rather than by any lifecycle verb, and the very same
          POST is a pure aggregate update when the survey is already DRAFT. Crossing the edge bumps
          revision to 2 and clears submitted_by_user_id, so the segregation-of-duties pairing is
          re-armed for the second review.
        test_recipe:
          setup:
            - "TIER_3 production, venue power 400 A."
            - "A DRAFT survey (revision 1) with two positions: 150 ft and 250 ft, 20 A each."
            - "Submitted by td-001, then REQUEST_CHANGES recorded by lo-001."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id, rev_at_create: $.data.revision }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "LOW_FIRST", position_type: "HANDHELD", cable_run_feet: 250, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
