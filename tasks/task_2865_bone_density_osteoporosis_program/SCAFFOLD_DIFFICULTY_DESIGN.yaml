      - name: amendment_reverses_every_finalize_side_effect_on_the_patient_ledger
        grounds:
          - state_machines.DiagnosticReport.FINALIZED_to_AMENDED
          - state_machines.ScanSession.SUBMITTED_to_ARCHIVED
          - entities.Patient.fields.lifetime_screening_scan_count
          - entities.Patient.fields.next_eligible_scan_date
          - entities.DiagnosticReport.fields.amends_report_id
          - endpoints["POST /bone-density/diagnostic-reports/{id}/amend"]
        distinguishing_aspect: |
          Finalization writes five separate pieces of patient-level state — the lifetime scan counter,
          last_finalized_report_id, baseline_report_id, current_screening_interval_months and
          next_eligible_scan_date — plus it archives the session. Amending must reverse all six against
          a patient whose only finalized report was this one: the counter goes back to 0 (never to -1
          and never staying at 1), the three FK/interval fields go back to null because no finalized
          report remains, and the session returns ARCHIVED -> SUBMITTED so the successor DRAFT can be
          worked on. The original must remain AMENDED as an immutable audit row while the response body
          is the new DRAFT successor carrying amends_report_id, so the payer-frequency gate that
          consumes next_eligible_scan_date is fully released.
        test_recipe:
          setup:
            - "A FEMORAL_NECK 0.5500 baseline session with positioning ACCEPTED, reported and FINALIZED on 2026-03-10, giving recommended_interval_months 24 and next_eligible_scan_date 2028-03-10."
            - "The patient's counters are observed after finalization and again after the amendment."
