      - name: cut_score_adoption_by_a_panel_member_is_refused_and_an_independent_psychometrician_adopts
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=19]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_/forms/{id}/adopt-cut-score
          - calculations.angoff_cut_score
          - entities.ExamForm.computed_fields.panel_status
        distinguishing_aspect: |
          The adopter must be outside form.panelist_user_ids, and the check is made on the
          acting X-User-ID: psy-1, who is both a Psychometrician and the only panellist, is
          refused 409 ERR_SEGREGATION_OF_DUTIES, while psy-2 with the same role and the same OCC
          token adopts successfully. Because the refused call does not bump the form, the token
          captured before it is still current for the accepted call.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (form_length 1, min_panelists 1, panel_trim_count 0, cut_score_sem_multiplier 0.5) with one OPERATIONAL item."
            - "One ExamForm ${form_id} in status ASSEMBLED whose panelist_user_ids == [psy-1], carrying one rating of 0.60 submitted by psy-1, so panel_status == RATINGS_COMPLETE and the observed version is ${form_v}."
            - "The trimmed mean is 0.600000 with sem 0.0, so the adopted raw_cut_score clamps to 0 (raw 1 against ceil_cut floor(0.90 * 1) == 0)."
          setup_api_calls:
            - call: "POST /programs"
