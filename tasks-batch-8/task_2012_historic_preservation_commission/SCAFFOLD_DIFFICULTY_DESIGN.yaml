              payload: { commenced_at: "2026-08-20T00:00:00Z" }
              as: PreservationStaff
              captures: { cert_status: $.data.status }
          assert:
            - "Certificate.${cert_id}.status == COMPLETED"
            - "Property.${p1_id}.listing_status == DEMOLISHED (link 1: certificate -> property)"
            - "HistoricDistrict.${d_id}.contributing_count == 0 (was 1) and total_inventory_count == 1 (was 2) (link 2: property -> district census)"
            - "HistoricDistrict.${d_id}.preservation_posture == AT_RISK (0*2 < 1)"
