            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 300000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
