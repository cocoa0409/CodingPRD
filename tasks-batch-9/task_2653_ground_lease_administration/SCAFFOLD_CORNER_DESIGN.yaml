          assert:
            - "trigger[0] returns 200 and the lease's percentage_rent_rate_bps is 700 - amending terms is LessorAdmin work"
            - "trigger[1] and trigger[2] both return 201: the shared insurance operation works for the lessor desk AND for the tenant"
            - "after trigger[2] the lease reports insurance_status ACTIVE, property_all_risk_limit_cents 90000000, builders_risk_limit_cents 4000000, lessor_additional_insured true and insurance_expires_at 2028-08-01T00:00:00Z - the tenant's later endorsement supersedes the lessor's"
            - "trigger[3] returns 201 and the lease's arrears_balance_cents is 2500000 - only the LeaseAccountant can post a charge"
            - "trigger[4] returns 201 with status SUBMITTED and trigger[5] returns 200 with status APPROVED, decided_by_user_id am-1"
            - "after trigger[5] the lease reports gfa_allocated_sqft 10000 and gfa_unallocated_sqft 190000"

      - name: a_ground_tenant_cannot_touch_another_lessees_lease
        claim_type: peer_roles
        grounds:
          - roles.GroundTenant.identity
          - errors.ERR_UNAUTHORIZED
          - validations.priority_2_authorization
        distinguishing_aspect: |
          GroundTenant identity is entity_backed: X-User-ID is the Lessee.id currently named on the lease,
          so the role check is per-row rather than per-role. Two tenants, two leases: tenant B carries a
          perfectly valid GroundTenant credential and is refused on tenant A's lease for every one of the
          four tenant-exclusive write paths, while the SAME calls succeed on its own lease. The final
          probe is the assignment interaction - after an ASSIGNMENT transfer rewrites Lease.lessee_id, the
          old tenant loses access and the new one gains it, so an implementation that caches the tenant at
          lease creation fails.
        test_recipe:
          setup:
            - "Two lessees A and B, each with its own lease, plus a consented ASSIGNMENT from A to B on lease A."
