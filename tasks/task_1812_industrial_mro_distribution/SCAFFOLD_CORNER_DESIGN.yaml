        claim_type: correct_result
        grounds: [calculations.available_qty, calculations.allocation_waterfall]
        distinguishing_aspect: "The reserve/release identity and the drop-ship bucket fallback are asserted with literal balances by the difficulty instances."
        excluded_because:
          difficulty_instance: stock_reserve_release_conservation
          rationale: "Identity available == on_hand - reserved asserted at two checkpoints there; drop-ship fallback asserted in drop_ship_provisional_vs_final_margin."

      - name: rebate_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.rebate_accrual_and_trueup]
        distinguishing_aspect: "Average-rate vs marginal-band divergence on identical spend."
        excluded_because:
          difficulty_instance: rebate_provisional_average_vs_final_marginal
          rationale: "Both variants asserted with literal values (300,000 vs 200,000) there."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-ID / X-User-Role headers fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["Empty database; the test sends no X-User-ID/X-User-Role headers"]
          setup_api_calls: []
          trigger:
            - call: "POST /mro/customers"
              payload: { account_number: "NA-1", display_name: "NoAuth Co", credit_limit_cents: 1000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (headers stripped by the test harness)"

      - name: existence_checked_left_to_right
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "POST /mro/customers/{bad-id}/rebate-agreements reports ERR_CUSTOMER_NOT_FOUND for the path's leftmost missing resource, even when the body is well-formed."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mro/customers/11111111-2222-3333-4444-555555555555/rebate-agreements"
              payload: { period_start: "2026-01-01", period_end: "2026-03-31", tiers: [{ threshold_cents: 0, rebate_bps: 100 }] }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CUSTOMER_NOT_FOUND"

      - name: return_window_expired_for_special_order
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_RETURN_WINDOW_EXPIRED]", calculations.return_credit]
        distinguishing_aspect: "A SPECIAL_ORDER line fulfilled on 2026-08-01 is returnable for 30 days; a return created on 2026-09-15 (45 days later) fails with ERR_RETURN_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Customer, SPECIAL_ORDER item stocked 1; WILL_CALL order fulfilled on the default clock 2026-08-01; clock then moved to 2026-09-15"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RW-1", display_name: "Window Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "RW-1", description: "Special valve", item_class: "SPECIAL_ORDER", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-RW", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { ln: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/returns"
              payload: { order_id: "${ord_id}", lines: [{ order_line_id: "${ln}", qty: 1, condition: "RESALEABLE" }] }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RETURN_WINDOW_EXPIRED (2026-09-15 > fulfilled 2026-08-01 + 30 days)"

      - name: return_qty_exceeding_remaining_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_RETURN_LINE_INVALID]"]
        distinguishing_aspect: "Cumulative returned quantity across non-rejected returns may not exceed the line's qty: a second return of 1 against a line of 2 with a REQUESTED return of 2 fails with ERR_RETURN_LINE_INVALID."
        test_recipe:
          setup: ["Customer, STOCKED item stocked 2; WILL_CALL order qty 2 fulfilled; return R1 of qty 2 in REQUESTED"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RQ-1", display_name: "Qty Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
