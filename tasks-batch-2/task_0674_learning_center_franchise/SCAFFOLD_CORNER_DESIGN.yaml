# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Learning-Center Franchise & Skill Assessment — Expert
# Breadth probe: enumerates testable claims of §1.1–§1.7 not covered by §1.8.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_center_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - entities.Center
          - endpoints
        distinguishing_aspect: "POST /centers with name+territory_code returns 201; status=PROVISIONING, active_enrollment_count=0, defaults instructor_ratio_cap=6/enrollment_fee_cents=5000/monthly_tuition_cents=15000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
          trigger:
            - call: "POST /centers"
              payload: { name: "Solo Center", territory_code: "TER-Z9" }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
          assert:
            - "response code == 201"
            - "Center.${c_id}.status == PROVISIONING"
            - "Center.${c_id}.instructor_ratio_cap == 6"
            - "Center.${c_id}.enrollment_fee_cents == 5000"
            - "Center.${c_id}.monthly_tuition_cents == 15000"
            - "Center.${c_id}.active_enrollment_count == 0"

      - name: get_center_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Center
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /centers/{non-existent UUID} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /centers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FranchiseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_center_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Center
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /centers omitting required territory_code returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /centers"
              payload: { name: "No Territory" }
              as: FranchiseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: enrollment_computed_fields_system_minted_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Enrollment.fields.status
          - entities.Enrollment.fields.monthly_rate_cents
        distinguishing_aspect: "POST /enrollments mints id/created_at/version and forces status=PLACEMENT_PENDING, monthly_rate_cents=0 regardless of input."
        test_recipe:
          setup: ["Center OPERATING with one subject+level; family+student."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CE1", territory_code: "TER-E1", monthly_tuition_cents: 15000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fe1@x.com", contact_name: "FE1" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_id}", subject_id: "${subj_id}", diagnostic_raw_score: 40 }
              as: CenterDirector
              captures: { en_id: $.data.id }
          assert:
            - "response code == 201"
            - "Enrollment.${en_id}.status == PLACEMENT_PENDING"
            - "Enrollment.${en_id}.monthly_rate_cents == 0"
            - "Enrollment.${en_id}.version == 1"

      - name: list_centers_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Center
          - response_envelope
        distinguishing_aspect: "GET /centers returns array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["Two centers created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CL1", territory_code: "TER-L1" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CL2", territory_code: "TER-L2" }
              as: FranchiseAdmin
          trigger:
            - call: "GET /centers"
              payload: { limit: 1, offset: 0 }
              as: FranchiseAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"
            - "len(data) == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: center_activate_without_active_agreement_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Center.PROVISIONING_to_OPERATING
          - "errors[ERR_AGREEMENT_NOT_ACTIVE]"
        distinguishing_aspect: "Activating a center whose FranchiseAgreement is still PENDING returns ERR_AGREEMENT_NOT_ACTIVE; status stays PROVISIONING."
        test_recipe:
          setup: ["Center PROVISIONING with a PENDING (not activated) agreement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CA0", territory_code: "TER-A0" }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AGREEMENT_NOT_ACTIVE"
            - "Center.${c_id}.status == PROVISIONING"

      - name: center_suspend_cascade_cancels_sessions_and_attendance
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Center.OPERATING_to_SUSPENDED
          - state_machines.Session.SCHEDULED_to_CANCELLED
          - state_machines.AttendanceRecord.BOOKED_to_CANCELLED
        distinguishing_aspect: "Suspending an OPERATING center cancels its SCHEDULED/OPEN sessions and, in turn, those sessions' BOOKED/PRESENT AttendanceRecords (depth-2 cascade verified end-to-end)."
        test_recipe:
          setup: ["Center OPERATING; one OPEN session with one BOOKED attendance record."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CSU", territory_code: "TER-SU", instructor_ratio_cap: 6 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fsu@x.com", contact_name: "FSU" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_id: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_id}", subject_id: "${subj_id}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_id: $.data.id }
            - call: "POST /enrollments/${en_id}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /sessions"
              payload: { center_id: "${c_id}", instructor_user_id: "instr-1", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z", seat_cap: 6 }
              as: CenterDirector
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/open"
              payload: {}
              as: CenterDirector
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: CenterDirector
              captures: { sess_v0: $.data.version }
            - call: "POST /attendance-records"
              payload: { session_id: "${sess_id}", enrollment_id: "${en_id}", expected_session_version: "${sess_v0}" }
              as: CenterDirector
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/suspend"
              payload: {}
              as: FranchiseAdmin
          assert:
            - "Center.${c_id}.status == SUSPENDED"
            - "Session.${sess_id}.status == CANCELLED"
            - "AttendanceRecord.${ar_id}.status == CANCELLED"
            - "Session.${sess_id}.booked_seat_count == 0"

      - name: invoice_pay_from_draft_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Paying a DRAFT (un-issued) invoice is not a declared transition from DRAFT -> ERR_INVALID_STATE; status stays DRAFT."
        test_recipe:
          setup: ["Center OPERATING; family with one ACTIVE solo enrollment; a DRAFT invoice (not issued)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CIP", territory_code: "TER-IP", monthly_tuition_cents: 15000, enrollment_fee_cents: 5000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fip@x.com", contact_name: "FIP" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_id: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_id}", subject_id: "${subj_id}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_id: $.data.id }
            - call: "POST /enrollments/${en_id}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "GET /families/${fam_id}"
              payload: {}
              as: CenterDirector
              captures: { fam_v: $.data.version }
            - call: "POST /invoices"
              payload: { family_id: "${fam_id}", center_id: "${c_id}", period_month: "2026-05", expected_family_version: "${fam_v}" }
              as: CenterDirector
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: { amount_cents: 20000 }
              as: CenterDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Invoice.${inv_id}.status == DRAFT"

      - name: worksheet_reassign_from_assigned_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Worksheet.RETRY_to_ASSIGNED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Reassign requires RETRY; reassigning a freshly ASSIGNED worksheet -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Center OPERATING; ACTIVE enrollment with an ASSIGNED worksheet (never graded)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CRA", territory_code: "TER-RA2", monthly_tuition_cents: 15000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fra@x.com", contact_name: "FRA" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_id: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_id}", subject_id: "${subj_id}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_id: $.data.id }
            - call: "POST /enrollments/${en_id}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /worksheets"
              payload: { enrollment_id: "${en_id}", level_id: "${lv1}", set_number: 1 }
              as: Instructor
              captures: { ws_id: $.data.id }
          trigger:
            - call: "POST /worksheets/${ws_id}/reassign"
              payload: {}
              as: Instructor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Worksheet.${ws_id}.status == ASSIGNED"

      - name: agreement_terminate_blocked_when_center_operating
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FranchiseAgreement.ACTIVE_to_TERMINATED
          - "errors[ERR_CENTER_OPERATING]"
        distinguishing_aspect: "Terminating an ACTIVE agreement whose center is OPERATING -> ERR_CENTER_OPERATING; agreement stays ACTIVE."
        test_recipe:
          setup: ["Center OPERATING with ACTIVE agreement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CTE", territory_code: "TER-TE" }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise-agreements/${ag_id}/terminate"
              payload: {}
              as: FranchiseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CENTER_OPERATING"
            - "FranchiseAgreement.${ag_id}.status == ACTIVE"

      - name: session_close_before_start_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Session.OPEN_to_CLOSED
          - "errors[ERR_SESSION_NOT_STARTED]"
        distinguishing_aspect: "Closing an OPEN session before clock reaches start_at -> ERR_SESSION_NOT_STARTED; status stays OPEN."
        test_recipe:
          setup: ["Center OPERATING; OPEN session start 09:00; clock at 08:00 (before start)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CSN", territory_code: "TER-SN", instructor_ratio_cap: 6 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /sessions"
              payload: { center_id: "${c_id}", instructor_user_id: "instr-1", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z", seat_cap: 6 }
              as: CenterDirector
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/open"
              payload: {}
              as: CenterDirector
          trigger:
            - call: "POST /sessions/${sess_id}/close"
              payload: {}
              as: CenterDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_STARTED"
            - "Session.${sess_id}.status == OPEN"

      - name: checkin_when_session_not_open_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.AttendanceRecord.BOOKED_to_PRESENT
          - "errors[ERR_SESSION_NOT_OPEN]"
        distinguishing_aspect: "Cross-entity guard AttendanceRecord->Session: check-in on a BOOKED record whose Session is still SCHEDULED -> ERR_SESSION_NOT_OPEN."
        test_recipe:
          setup: ["Center OPERATING; a SCHEDULED (not yet OPEN) session; an ACTIVE enrollment. A BOOKED attendance record exists (booking allowed on SCHEDULED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CCI", territory_code: "TER-CI", instructor_ratio_cap: 6 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fci@x.com", contact_name: "FCI" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_id: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_id}", subject_id: "${subj_id}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_id: $.data.id }
            - call: "POST /enrollments/${en_id}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /sessions"
              payload: { center_id: "${c_id}", instructor_user_id: "instr-1", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z", seat_cap: 6 }
              as: CenterDirector
              captures: { sess_id: $.data.id }
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: CenterDirector
              captures: { sess_v0: $.data.version }
            - call: "POST /attendance-records"
              payload: { session_id: "${sess_id}", enrollment_id: "${en_id}", expected_session_version: "${sess_v0}" }
              as: CenterDirector
