    side_effects: ["status = OPEN; evidence_count = 0; total_evidence_bytes = 0"]

  - method: GET
    path: "/agencies/cases"
    description: "List cases (filterable; agency_id filter required in practice)"
    roles: [AgencyAdmin, Supervisor, RecordsOfficer, Officer]
    code: 200
    input: ["agency_id?", "status?", "lead_officer_id?", "limit?", "offset?"]
    output: "CaseEntity[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/cases/{caseId}"
