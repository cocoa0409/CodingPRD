# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 18 instances. Every setup_api_calls chain drives
# empty-DB -> the described state using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_voluntary_vs_administrative_diverge
        grounds:
          - calculations.permit_refund_amount
          - state_machines.Permit.ACTIVE_to_REFUNDED
          - entities.Permit.fields.refund_amount_cents
        distinguishing_aspect: "Same permit inputs (fee_paid 10000, 242/334 unused days): VOLUNTARY refund withholds REFUND_ADMIN_FEE_CENTS (=> 5246) while ADMINISTRATIVE does not (=> 7246); this dual variant lives on the Permit domain."
        test_recipe:
          setup:
            - "Zone (capacity 2, cap 2, annual_fee 12000); household with VERIFIED proof and two ACTIVE vehicles; two ACTIVE permits issued 2026-05-01; clock advanced to 2026-08-01."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "Elm RPZ", zone_code: "RPZ-DV1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "1 Elm", resident_name: "Rae", contact_email: "rae@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "DV1-A", make: "Honda", model: "Civic" }, as: Resident, as_user_id: "${hh_id}", captures: { veh_a: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "DV1-B", make: "Toyota", model: "Corolla" }, as: Resident, as_user_id: "${hh_id}", captures: { veh_b: $.data.id } }
            - { call: "POST /households/${hh_id}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hh_id}", captures: { proof_id: $.data.id } }
            - { call: "POST /proof-submissions/${proof_id}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${veh_a}" }, as: Resident, as_user_id: "${hh_id}", captures: { app_a: $.data.id } }
            - { call: "POST /permit-applications/${app_a}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${app_a}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { permit_a: $.data.id } }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${veh_b}" }, as: Resident, as_user_id: "${hh_id}", captures: { app_b: $.data.id } }
            - { call: "POST /permit-applications/${app_b}/review", payload: {}, as: ParkingClerk }
            - { call: "GET /zones/${zone_id}", payload: {}, as: PermitSupervisor, captures: { zone_v2: $.data.version } }
            - { call: "POST /permit-applications/${app_b}/approve", payload: { expected_zone_version: "${zone_v2}" }, as: PermitSupervisor, captures: { permit_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PermitSupervisor }
          trigger:
            - { call: "POST /permits/${permit_a}/refund", payload: { refund_type: "VOLUNTARY" }, as: PermitSupervisor, captures: { ref_a: $.data.refund_amount_cents } }
            - { call: "POST /permits/${permit_b}/refund", payload: { refund_type: "ADMINISTRATIVE" }, as: PermitSupervisor, captures: { ref_b: $.data.refund_amount_cents } }
          assert:
            - "Permit.${permit_a}.refund_amount_cents == 5246"
            - "Permit.${permit_a}.refund_type == VOLUNTARY"
            - "Permit.${permit_b}.refund_amount_cents == 7246"
            - "Permit.${permit_b}.refund_type == ADMINISTRATIVE"
            - "Permit.${permit_b}.refund_amount_cents - Permit.${permit_a}.refund_amount_cents == 2000"

      - name: citation_fine_standard_vs_repeat_offender
        grounds:
          - calculations.citation_fine
          - entities.Citation.fields.fine_variant
          - state_machines.Citation.DISPUTED_to_UPHELD
        distinguishing_aspect: "Same NO_PERMIT violation: a plate with 0 prior UPHELD gets STANDARD 7500; a plate with 2 prior UPHELD gets REPEAT_OFFENDER 15000; this dual variant lives on the Citation domain (distinct from the Permit refund variant)."
        test_recipe:
          setup:
            - "Zone and a household exist. Plate 'RPT7' accumulates 2 UPHELD citations; a control plate 'CLEAN7' has none."
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "Fine Zone", zone_code: "RPZ-DV2", permit_capacity: 5, max_permits_per_household: 3, guest_pass_daily_limit: 3, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "7 Oak", resident_name: "Sam", contact_email: "sam@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "RPT7", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c1: $.data.id } }
            - { call: "POST /citations/${c1}/dispute", payload: {}, as: Resident, as_user_id: "${hh_id}" }
            - { call: "POST /citations/${c1}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "RPT7", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c2: $.data.id } }
            - { call: "POST /citations/${c2}/dispute", payload: {}, as: Resident, as_user_id: "${hh_id}" }
            - { call: "POST /citations/${c2}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
          trigger:
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "RPT7", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c3: $.data.id, c3_fine: $.data.fine_amount_cents } }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "CLEAN7", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { cc: $.data.id } }
          assert:
            - "Citation.${c3}.prior_upheld_count == 2"
            - "Citation.${c3}.fine_variant == REPEAT_OFFENDER"
            - "Citation.${c3}.fine_amount_cents == 15000"
            - "Citation.${cc}.fine_variant == STANDARD"
            - "Citation.${cc}.fine_amount_cents == 7500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: issuance_fee_round_per_month_then_sum
        grounds:
          - calculations.permit_issuance_fee
          - entities.Permit.fields.fee_paid_cents
          - state_machines.PermitApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Mode (b) rounding order: annual_fee 12500 not divisible by 12; round monthly rate first (1042) then x10 months = 10420, NOT round(12500*10/12)=10417; the scaffold pins per-month-then-sum."
        test_recipe:
          setup:
            - "Zone with annual_fee 12500; household VERIFIED; one ACTIVE vehicle; application reviewed; clock at 2026-05-01 so remaining_months=10."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "Round Zone", zone_code: "RPZ-CF1", permit_capacity: 3, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12500, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "3 Fir", resident_name: "Uma", contact_email: "uma@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "CF1-A", make: "Ford", model: "Focus" }, as: Resident, as_user_id: "${hh_id}", captures: { veh_a: $.data.id } }
            - { call: "POST /households/${hh_id}/proof-submissions", payload: { document_type: "UTILITY_BILL" }, as: Resident, as_user_id: "${hh_id}", captures: { proof_id: $.data.id } }
            - { call: "POST /proof-submissions/${proof_id}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${veh_a}" }, as: Resident, as_user_id: "${hh_id}", captures: { app_a: $.data.id } }
            - { call: "POST /permit-applications/${app_a}/review", payload: {}, as: ParkingClerk }
          trigger:
            - { call: "POST /permit-applications/${app_a}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { permit_a: $.data.id, fee: $.data.fee_paid_cents } }
          assert:
            - "Permit.${permit_a}.fee_paid_cents == 10420"
            - "Permit.${permit_a}.fee_paid_cents != 10417"

      - name: repeat_fine_escalation_min_max_clamp
        grounds:
          - calculations.citation_fine
          - entities.Citation.fields.fine_amount_cents
        distinguishing_aspect: "Mode (a) non-linear >=3-input formula with nested min/max: with 3 prior UPHELD, raw = 7500 * 2^(3-2+1) = 30000, clamped by min(raw, MAX_FINE_CENTS=25000) then max(MIN_FINE_CENTS,...) => 25000; distinct mode from the per-month-then-sum instance."
        test_recipe:
          setup:
            - "Zone and household exist. Plate 'RPT9' accumulates 3 UPHELD citations."
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "Clamp Zone", zone_code: "RPZ-CF2", permit_capacity: 5, max_permits_per_household: 3, guest_pass_daily_limit: 3, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "9 Ash", resident_name: "Vic", contact_email: "vic@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "RPT9", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c1: $.data.id } }
            - { call: "POST /citations/${c1}/dispute", payload: {}, as: Resident, as_user_id: "${hh_id}" }
            - { call: "POST /citations/${c1}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "RPT9", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c2: $.data.id } }
            - { call: "POST /citations/${c2}/dispute", payload: {}, as: Resident, as_user_id: "${hh_id}" }
            - { call: "POST /citations/${c2}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "RPT9", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c3: $.data.id } }
            - { call: "POST /citations/${c3}/dispute", payload: {}, as: Resident, as_user_id: "${hh_id}" }
            - { call: "POST /citations/${c3}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
          trigger:
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "RPT9", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c4: $.data.id, c4_fine: $.data.fine_amount_cents } }
          assert:
            - "Citation.${c4}.prior_upheld_count == 3"
            - "Citation.${c4}.fine_variant == REPEAT_OFFENDER"
            - "Citation.${c4}.fine_amount_cents == 25000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_renewal_cycle_returns_to_active
        grounds:
          - state_machines.Permit.ACTIVE_to_RENEWAL_PENDING
          - state_machines.Permit.RENEWAL_PENDING_to_ACTIVE
          - entities.Permit.fields.expires_at
        distinguishing_aspect: "Permit exhibits a cycle ACTIVE->RENEWAL_PENDING->ACTIVE; after renew-approve the permit is ACTIVE again with expires_at advanced to the next fiscal year end 2028-03-31."
        test_recipe:
          setup:
            - "One ACTIVE permit issued 2026-05-01 (expires 2027-03-31); clock advanced to 2027-02-15 (inside 60-day renewal window)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "Cycle Zone", zone_code: "RPZ-NL1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "5 Pine", resident_name: "Wes", contact_email: "wes@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "NL1-A", make: "Kia", model: "Rio" }, as: Resident, as_user_id: "${hh_id}", captures: { veh_a: $.data.id } }
            - { call: "POST /households/${hh_id}/proof-submissions", payload: { document_type: "DEED" }, as: Resident, as_user_id: "${hh_id}", captures: { proof_id: $.data.id } }
            - { call: "POST /proof-submissions/${proof_id}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${veh_a}" }, as: Resident, as_user_id: "${hh_id}", captures: { app_a: $.data.id } }
            - { call: "POST /permit-applications/${app_a}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${app_a}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { permit_a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /permits/${permit_a}/renew", payload: {}, as: Resident, as_user_id: "${hh_id}" }
            - { call: "GET /permits/${permit_a}", payload: {}, as: PermitSupervisor, captures: { permit_v: $.data.version } }
          trigger:
            - { call: "POST /permits/${permit_a}/renew-approve", payload: { expected_permit_version: "${permit_v}" }, as: PermitSupervisor, captures: { new_status: $.data.status } }
          assert:
            - "Permit.${permit_a}.status == ACTIVE"
            - "Permit.${permit_a}.expires_at == 2028-03-31T23:59:59.000Z"
            - "Permit.${permit_a}.fee_paid_cents == 22000"

      - name: citation_dispute_branch_to_dismissed
        grounds:
          - state_machines.Citation.ISSUED_to_DISPUTED
          - state_machines.Citation.DISPUTED_to_DISMISSED
          - state_machines.Citation.DISPUTED_to_UPHELD
        distinguishing_aspect: "Citation is a branching machine: DISPUTED forks to either UPHELD or DISMISSED with divergent side-effects (UPHELD may cascade, DISMISSED owes no fine); this instance drives the DISMISSED branch, a different entity than the Permit cycle."
        test_recipe:
          setup:
            - "One ISSUED citation on plate 'BR1' exists; it is disputed."
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "Branch Zone", zone_code: "RPZ-NL2", permit_capacity: 3, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "2 Birch", resident_name: "Xia", contact_email: "xia@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", license_plate: "BR1", violation_type: "ZONE_VIOLATION" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { c1: $.data.id } }
            - { call: "POST /citations/${c1}/dispute", payload: {}, as: Resident, as_user_id: "${hh_id}" }
          trigger:
            - { call: "POST /citations/${c1}/adjudicate", payload: { outcome: "DISMISSED" }, as: EnforcementOfficer, as_user_id: "officer-2", captures: { st: $.data.status } }
          assert:
            - "Citation.${c1}.status == DISMISSED"
            - "Citation.${c1}.adjudicator_id == officer-2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: uphold_revokes_permit_promotes_waitlist
        grounds:
          - state_machines.Citation.DISPUTED_to_UPHELD
          - state_machines.Permit.ACTIVE_to_REVOKED
          - state_machines.PermitApplication.WAITLISTED_to_APPROVED
        distinguishing_aspect: "Depth-3 cascade from citation adjudication: UPHELD (3rd on permit) -> Permit REVOKED -> oldest WAITING WaitlistEntry PROMOTED -> its application APPROVED and a new Permit issued; each link caused by the previous."
        test_recipe:
          setup:
            - "Capacity-1 zone. Household H1 holds one ACTIVE permit P1 (plate 'CAS1') that already has 2 UPHELD citations. Household H2 has a WAITLISTED application W (WaitlistEntry WAITING, position 1)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "Cascade Zone", zone_code: "RPZ-TC1", permit_capacity: 1, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "1 Cas", resident_name: "H1", contact_email: "h1@x.com" }, as: Anonymous, captures: { h1: $.data.id } }
            - { call: "POST /households/${h1}/vehicles", payload: { license_plate: "CAS1", make: "VW", model: "Golf" }, as: Resident, as_user_id: "${h1}", captures: { v1: $.data.id } }
            - { call: "POST /households/${h1}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${h1}", captures: { pf1: $.data.id } }
            - { call: "POST /proof-submissions/${pf1}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${h1}", vehicle_id: "${v1}" }, as: Resident, as_user_id: "${h1}", captures: { a1: $.data.id } }
            - { call: "POST /permit-applications/${a1}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${a1}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { p1: $.data.id } }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", permit_id: "${p1}", license_plate: "CAS1", violation_type: "EXPIRED_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { ct1: $.data.id } }
            - { call: "POST /citations/${ct1}/dispute", payload: {}, as: Resident, as_user_id: "${h1}" }
            - { call: "POST /citations/${ct1}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", permit_id: "${p1}", license_plate: "CAS1", violation_type: "EXPIRED_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { ct2: $.data.id } }
            - { call: "POST /citations/${ct2}/dispute", payload: {}, as: Resident, as_user_id: "${h1}" }
            - { call: "POST /citations/${ct2}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "2 Cas", resident_name: "H2", contact_email: "h2@x.com" }, as: Anonymous, captures: { h2: $.data.id } }
            - { call: "POST /households/${h2}/vehicles", payload: { license_plate: "CAS2", make: "BMW", model: "M3" }, as: Resident, as_user_id: "${h2}", captures: { v2: $.data.id } }
            - { call: "POST /households/${h2}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${h2}", captures: { pf2: $.data.id } }
            - { call: "POST /proof-submissions/${pf2}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${h2}", vehicle_id: "${v2}" }, as: Resident, as_user_id: "${h2}", captures: { a2: $.data.id } }
            - { call: "POST /permit-applications/${a2}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${a2}/waitlist", payload: {}, as: ParkingClerk, captures: { w2: $.data.id } }
          trigger:
            - { call: "POST /citations", payload: { zone_id: "${zone_id}", permit_id: "${p1}", license_plate: "CAS1", violation_type: "EXPIRED_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { ct3: $.data.id } }
            - { call: "POST /citations/${ct3}/dispute", payload: {}, as: Resident, as_user_id: "${h1}" }
            - { call: "POST /citations/${ct3}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-2" }
          assert:
            - "Permit.${p1}.status == REVOKED"
            - "WaitlistEntry.${w2}.status == PROMOTED"
            - "PermitApplication.${a2}.status == APPROVED"
            - "PermitApplication.${a2}.permit_id is not null"
            - "Zone.${zone_id}.active_permit_count == 1"

      - name: zone_suspend_cascades_permits_then_passes
        grounds:
          - state_machines.Zone.ACTIVE_to_SUSPENDED
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - state_machines.VisitorPass.ACTIVE_to_CANCELLED
        distinguishing_aspect: "Depth-3 cascade from a different trigger (zone suspend): Zone SUSPENDED -> the zone's ACTIVE permit SUSPENDED -> that permit's ACTIVE visitor pass CANCELLED; distinct propagation from the citation cascade."
        test_recipe:
          setup:
            - "Zone with one ACTIVE permit P1 and one ACTIVE TEMPORARY visitor pass VP under P1."
          setup_api_calls:
