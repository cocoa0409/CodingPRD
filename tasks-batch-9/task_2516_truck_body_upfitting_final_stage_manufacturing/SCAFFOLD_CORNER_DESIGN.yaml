      - name: duplicate_and_wrong_state_error_battery_is_rejected
        claim_type: Error Triggerability
        grounds:
          - errors
          - validations.priority_35_to_38_uniqueness_rules
          - validations.priority_43_to_47_state_preconditions
          - validations.priority_64_ERR_SLOT_DATE_RANGE_INVALID
          - validations.priority_74_ERR_PTO_NOT_PROVISIONED
          - validations.priority_77_ERR_CHASSIS_WARRANTY_VOIDING_INTERFACE
          - validations.priority_79_ERR_CONFIG_NOT_PUBLISHED
          - validations.priority_80_ERR_BAY_BODY_TYPE_UNSUPPORTED
          - validations.priority_82_ERR_BODY_ALREADY_INSTALLED
        distinguishing_aspect: |
          Thirteen catalogued codes have no natural home in any other design instance — they are the
          plumbing rules: uniqueness, publish gates, wrong-state repeats, an inverted date range, a
          bay that cannot take the body, a chassis with no PTO provision, and an interface that voids
          the chassis warranty without a customer waiver. One shared fixture reaches all of them, and
          each call must produce ITS OWN code rather than a generic 409, which is the failure mode
          this battery is built to catch. The calls are ordered so that the RELEASED-state rejections
          all happen before the slot is started and the order moves on.
