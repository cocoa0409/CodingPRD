              payload: { pair_id: "${pair_v9bc_id}", survivor_record_id: "${rec_v9c_id}", subsumed_record_id: "${rec_v9b_id}", rationale: "Attempting to re-merge a subsumed record." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
          assert:
