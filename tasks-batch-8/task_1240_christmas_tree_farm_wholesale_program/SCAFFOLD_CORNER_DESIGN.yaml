            - { call: "POST /api/surveys/${sa}/post", payload: { expected_crop_lot_version: "${lotv1}" }, as: FarmManager, captures: { sa_st: $.data.status } }
            - { call: "POST /api/surveys", payload: { crop_lot_id: "${lot}", surveyed_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 285, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { sb: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}", payload: {}, as: FarmManager, captures: { lotv2: $.data.version } }
          trigger:
            - { call: "POST /api/surveys/${sb}/post", payload: { expected_crop_lot_version: "${lotv2}" }, as: FarmManager }
          assert:
            - "first post succeeded with ${sa_st} == POSTED and lot version moved 1 -> 2 (${lotv2} == 2)"
            - "after second post: GET /api/crop-lots/${lot}/surveys shows [0].status == SUPERSEDED (survey A) and [1].status == POSTED (survey B)"
            - "StandBucket H_6_7.baseline_count == 285 and last_shrink_delta == -5 (285 - 290)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: invoice_tier_boundary_quantity_100
        claim_type: threshold_boundary
        grounds: ["calculations.order_invoice"]
        distinguishing_aspect: "Tier edges are >= inclusive: quantity 100 earns 3% (50000 - 1500 = 48500) while quantity 99 earns 0% (49500) — one tree crosses the boundary."
        test_recipe:
          setup: ["season in BOOKING; buyer with ample credit"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 100, unit_price_cents: 500 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { o100: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 99, unit_price_cents: 500 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { o99: $.data.id } }
          trigger:
            - { call: "POST /api/wholesale-orders/${o100}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { t100: $.data.invoice_total_cents, d100: $.data.discount_pct_applied } }
            - { call: "POST /api/wholesale-orders/${o99}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { t99: $.data.invoice_total_cents, d99: $.data.discount_pct_applied } }
          assert:
            - "qty 100: ${d100} == 0.03 and ${t100} == 48500 (50000 - round_half_up(1500.0))"
            - "qty 99: ${d99} == 0 and ${t99} == 49500 (no discount below the tier)"

