      - name: calibration_bay_capacity_counts_only_strictly_overlapping_windows
        grounds:
          - validations.priority_68
          - entities.CalibrationBay.fields.concurrent_capacity
          - entities.CalibrationBay.fields.scheduled_window_count
          - state_machines.ProcedureRecord.REQUIRED_to_SCHEDULED
          - errors.ERR_CALIBRATION_BAY_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          A different resource with different interval semantics: CalibrationBay has
          concurrent_capacity 2, no buffer at all, and half-open [start, end) overlap. Two windows that
          overlap each other are both legal; a third that straddles both is refused; the same third
          window moved to touch the first window's end instant is accepted, because touching is not
          overlapping. The refusal is aggregate, not pairwise.
        test_recipe:
          setup:
            - "One STATIC calibration bay with concurrent_capacity 2 and scheduled_window_count 0."
            - "One repair order carrying three ADAS ProcedureRecord rows, each requires_calibration true with calibration_type STATIC, so all three start at REQUIRED."
            - "Record 1 is scheduled 09:00-11:00 and record 2 is scheduled 10:00-12:00; both succeed and scheduled_window_count is 2."
