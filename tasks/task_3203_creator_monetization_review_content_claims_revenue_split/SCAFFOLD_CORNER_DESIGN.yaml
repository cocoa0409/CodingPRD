  - section: calculations
    instances:

      - name: super_chat_split_applies_the_seventy_percent_rate
        claim_type: Correct Result
        grounds:
          - calculations.royalty_share_split
          - endpoints.POST_/api/revenue-routings
        distinguishing_aspect: "A SUPER_CHAT routing of 1000 gross yields creator_share_cents 700 and partner_share_cents 300, the 0.70 super-chat rate rather than the 0.55 AD rate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel approved with a reviewed item."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
