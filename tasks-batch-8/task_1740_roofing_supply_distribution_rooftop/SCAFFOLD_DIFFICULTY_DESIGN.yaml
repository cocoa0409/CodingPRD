              payload: { product_id: "${prod_l1}", roof_squares: 5.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_l1b: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_l1b}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_l1b}/convert"
              payload: { branch_id: "${br_l1}" }
              as: Contractor
              as_user_id: "${ca_l1}"
              captures: { ord_l1b: $.data.id }
