            - "Renter QUALIFIED via cert C2 (expires 2027-06-30); B1 CONFIRMED 2026-09-20 -> 2026-09-25 (quoted 325000) with APPROVED itinerary; B2 HELD 2026-10-01 -> 2026-10-04"
