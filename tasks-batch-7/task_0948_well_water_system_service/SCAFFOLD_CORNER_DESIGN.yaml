      - name: corner_validation_technician_tier_set_membership_journeyman_boundary
        claim_type: Cross-entity validation
        grounds: ["validations[priority=21]", "calculations.technician_tier_scope_gate", "errors[ERR_TECHNICIAN_TIER_INSUFFICIENT]"]
        distinguishing_aspect: |
          SCOPE_MIN_TIER is set membership, not an ordering: the SAME JOURNEYMAN
          technician schedules a TREATMENT_INSTALL work order successfully (JOURNEYMAN
          is in that scope's list) and is refused 403 ERR_TECHNICIAN_TIER_INSUFFICIENT
          on a PUMP_REPLACEMENT work order whose list is [MASTER] only. Both work
          orders sit on the EMERGENCY pipeline, on different wells, on different
          calendar days, so neither the permit prerequisite, the per-well daily cap nor
          the technician buffer can explain the difference.
        test_recipe:
          setup:
            - "One account, one property, two wells and one JOURNEYMAN technician."
            - "Two PRE_AUTHORIZED emergency tickets, one per well, each DIAGNOSED, founding a DRAFT work order of scope TREATMENT_INSTALL and PUMP_REPLACEMENT respectively."
