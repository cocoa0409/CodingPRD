      - name: final_exam_failure_cascades_dismissal_pending_void_attendance_session_under_min
        grounds:
          - state_machines[Examination].transitions[REMEDIATION_ASSIGNED -> FAILED_FINAL]
          - state_machines[Recruit.academy_status].transitions[REMEDIATION -> DISMISSAL_PENDING]
          - state_machines[AttendanceRecord].transitions[PROVISIONAL -> VOIDED]
          - state_machines[CourseSession].transitions[SCHEDULED -> UNDER_MIN_ENROLLMENT]
          - entities.CourseSession.fields.enrolled_count
          - endpoints[POST /examinations/{examinationId}/grade]
        distinguishing_aspect: |
          A single failing raw_score walks four levels because the attempt counter has run out:
          L1 Examination -> FAILED_FINAL, L2 the examinee's academy_status -> DISMISSAL_PENDING,
          L3 every PROVISIONAL AttendanceRecord of that recruit -> VOIDED, L4 each affected
          CourseSession re-derives enrolled_count and, where it now falls below min_enrollment,
          SCHEDULED -> UNDER_MIN_ENROLLMENT. The very same call with attempt_number 1 goes to FAILED
          and cascades nothing, so the depth of the chain is decided by
          attempt_number >= 1 + max_remediation_attempts. The chain also has hard stops: the
          CREDITED row of the delivered session is untouched, pipeline_stage stays ACADEMY (dismissal
          is a separate AcademyDirector decision), and the class stays IN_SESSION because
          UNDER_MIN_ENROLLMENT sessions still count toward projected_topic_hours.
