scaffold_corner_design:

  # =========================================================================
  # Entities — creation, retrieval, required fields, computed/system fields
  # =========================================================================
  - section: entities
    instances:
      - name: create_species_returns_201_with_all_fields
        claim_type: Creation
        grounds: ["entities.Species", "endpoints"]
        distinguishing_aspect: "POST /species with all required fields returns 201 and a Species with server-minted id, version==1, and echoed inputs."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /species"
              payload: { common_name: "Rainbow Trout", code: "TROUT", target_market_weight_g: 1200, base_daily_growth_g: 3.0, default_processing_yield_pct: 0.60, min_water_temp_c: 5, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
          assert:
            - "HTTP 201; data.code == TROUT; data.version == 1; data.id is a UUID; data.created_at present."

      - name: get_cohort_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Cohort", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cohorts/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /cohorts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND."

      - name: list_tanks_paginated_envelope
        claim_type: Listing
        grounds: ["entities.Tank", "response_envelope"]
        distinguishing_aspect: "GET /tanks returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two tanks created."]
          setup_api_calls:
            - call: "POST /tanks"
              payload: { name: "TA", kind: "TANK", volume_liters: 1000, max_biomass_kg: 100 }
              as: FarmManager
            - call: "POST /tanks"
              payload: { name: "TB", kind: "POND", volume_liters: 2000, max_biomass_kg: 200 }
              as: FarmManager
          trigger:
            - call: "GET /tanks"
              payload: { limit: 1, offset: 0 }
              as: FarmManager
          assert:
            - "response_type == array; meta.total_count == 2; data has_more == true at limit 1."

      - name: create_cohort_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: ["entities.Cohort.fields.fish_count", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cohorts missing fish_count returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Species + Tank exist."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST (fish_count missing)."

      - name: sales_order_discount_tier_defaults_to_none
        claim_type: Defaults
        grounds: ["entities.SalesOrder.fields.discount_tier"]
        distinguishing_aspect: "Omitting discount_tier on POST /sales-orders applies default NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sales-orders"
              payload: { customer_name: "Acme" }
              as: SalesAgent
              captures: { so: $.data.id }
          assert:
            - "data.discount_tier == NONE; data.status == DRAFT; data.order_total == 0."

      - name: cohort_id_is_system_generated_input_ignored
        claim_type: System Fields
        grounds: ["entities.Cohort"]
        distinguishing_aspect: "Server mints Cohort.id, created_at, version; any client-supplied id is ignored — the field is not in §1.5 input so it is rejected as unknown (ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["Species + Tank exist."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { cid: $.data.id }
          assert:
            - "data.id is a server-minted UUID; data.version == 1; data.created_at present."

      - name: create_cohort_invalid_species_fk_returns_404
        claim_type: Parent Relationships
        grounds: ["entities.Cohort.fields.species_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /cohorts with a non-existent species_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Tank exists; species_id points to nothing."]
          setup_api_calls:
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "00000000-0000-0000-0000-000000000000", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND (species_id FK)."

      - name: stocking_event_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.StockingEvent"]
        distinguishing_aspect: "StockingEvent has common_fields: false — its read carries id and created_at only, no version field and no update endpoint."
        test_recipe:
          setup: ["Tank, Cohort, one stocking event."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /stocking-events"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", fish_count: 100, stocked_at: "2026-01-01T00:00:00Z", expected_harvest_at: "2026-06-01T00:00:00Z" }
              as: FarmTechnician
              captures: { se: $.data.id }
          trigger:
            - call: "GET /stocking-events/${se}"
              payload: {}
              as: FarmTechnician
          assert:
            - "data.id and data.created_at present; no version field on the StockingEvent."

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency, initial
  # =========================================================================
  - section: state_machines
    instances:
      - name: cohort_initial_states_on_create
        claim_type: Initial State
        grounds: ["state_machines.Cohort", "entities.Cohort.fields.lifecycle_status", "entities.Cohort.fields.health_status"]
        distinguishing_aspect: "A freshly stocked Cohort starts lifecycle_status==STOCKED, health_status==HEALTHY, operational_status==ACTIVE."
        test_recipe:
          setup: ["Species + Tank exist."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
          assert:
            - "lifecycle_status == STOCKED; health_status == HEALTHY; operational_status == ACTIVE."

      - name: harvest_complete_from_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.HarvestOrder.IN_PROGRESS_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /harvest-orders/{id}/complete on a SCHEDULED (not IN_PROGRESS) order returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["HarvestOrder HO1 SCHEDULED (not started) on a healthy cohort."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 500, scheduled_at: "2026-01-05T00:00:00Z" }
              as: HarvestOperator
              captures: { ho1: $.data.id }
            - call: "POST /harvest-orders/${ho1}/schedule"
              payload: {}
              as: HarvestOperator
          trigger:
            - call: "POST /harvest-orders/${ho1}/complete"
              payload: { harvested_fish_count: 500, harvested_live_weight_kg: 100.0 }
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE."

      - name: cohort_harvested_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Cohort", "entities.Cohort.fields.lifecycle_status"]
        distinguishing_aspect: "A fully harvested Cohort (lifecycle_status HARVESTED, fish_count 0) cannot be fed: feeding returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cohort C1 fully harvested to lifecycle_status HARVESTED, fish_count 0."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 100, scheduled_at: "2026-01-05T00:00:00Z" }
              as: HarvestOperator
              captures: { ho1: $.data.id }
            - call: "POST /harvest-orders/${ho1}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho1}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho1}/complete"
              payload: { harvested_fish_count: 100, harvested_live_weight_kg: 30.0 }
              as: HarvestOperator
          trigger:
            - call: "POST /cohorts/${c1}/feed-logs"
              payload: { fed_at: "2026-01-06T00:00:00Z", amount_kg: 5, feed_type: "grower" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE (cohort HARVESTED is terminal for lifecycle ops)."

      - name: grading_commit_twice_idempotency_second_fails
        claim_type: Idempotency
        grounds: ["state_machines.GradingEvent.PLANNED_to_COMMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second commit on an already-COMMITTED grading event returns ERR_INVALID_STATE (no second set of child cohorts)."
        test_recipe:
          setup: ["GradingEvent G1 already COMMITTED."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T2", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t2: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /grading-events"
              payload: { source_cohort_id: "${c1}", planned_splits: [ { label: "all", fish_count: 100, target_tank_id: "${t2}", avg_weight_g: 55 } ] }
              as: FarmTechnician
              captures: { g1: $.data.id }
            - call: "POST /grading-events/${g1}/plan"
              payload: {}
              as: FarmTechnician
            - call: "POST /grading-events/${g1}/commit"
              payload: { expected_source_cohort_version: "${c1_v}" }
              as: FarmTechnician
          trigger:
            - call: "POST /grading-events/${g1}/commit"
              payload: { expected_source_cohort_version: "${c1_v}" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE (G1 already COMMITTED)."

      - name: grading_revise_cycle_planned_to_draft
        claim_type: Valid Transition
        grounds: ["state_machines.GradingEvent.PLANNED_to_DRAFT"]
        distinguishing_aspect: "POST /grading-events/{id}/revise moves a PLANNED event back to DRAFT (cyclic revision loop)."
        test_recipe:
          setup: ["GradingEvent G1 PLANNED."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T2", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t2: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /grading-events"
              payload: { source_cohort_id: "${c1}", planned_splits: [ { label: "all", fish_count: 100, target_tank_id: "${t2}", avg_weight_g: 55 } ] }
              as: FarmTechnician
              captures: { g1: $.data.id }
            - call: "POST /grading-events/${g1}/plan"
              payload: {}
              as: FarmTechnician
          trigger:
            - call: "POST /grading-events/${g1}/revise"
              payload: { planned_splits: [ { label: "a", fish_count: 60, target_tank_id: "${t2}", avg_weight_g: 60 }, { label: "b", fish_count: 40, target_tank_id: "${t1}", avg_weight_g: 40 } ] }
              as: FarmTechnician
          assert:
            - "data.status == DRAFT after revise; planned_splits replaced with two entries."

      - name: processing_reject_no_product_lot_created
        claim_type: Side Effect Execution
        grounds: ["state_machines.ProcessingBatch.PROCESSING_to_REJECTED"]
        distinguishing_aspect: "Rejecting a PROCESSING batch sets status REJECTED and creates no ProductLot (filtered list by processing_batch_id is empty)."
        test_recipe:
          setup: ["ProcessingBatch PB in PROCESSING state."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 10, scheduled_at: "2026-01-01T00:00:00Z" }
              as: HarvestOperator
              captures: { ho: $.data.id }
            - call: "POST /harvest-orders/${ho}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/complete"
              payload: { harvested_fish_count: 10, harvested_live_weight_kg: 20.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${ho}" }
              as: HarvestOperator
              captures: { pb: $.data.id }
            - call: "POST /processing-batches/${pb}/start"
              payload: {}
              as: HarvestOperator
          trigger:
            - call: "POST /processing-batches/${pb}/reject"
              payload: {}
              as: HarvestOperator
            - call: "GET /product-lots"
              payload: { processing_batch_id: "${pb}" }
              as: HarvestOperator
          assert:
            - "ProcessingBatch.status == REJECTED; GET /product-lots?processing_batch_id returns total_count 0."

      - name: tank_recovery_restores_cohort_operational_status
        claim_type: Bubble up
        grounds: ["state_machines.Tank.FROZEN_to_OPEN", "entities.Cohort.fields.operational_status"]
        distinguishing_aspect: "When a FROZEN tank recovers to OPEN via a NORMAL reading, residing SUSPENDED cohorts return to operational_status ACTIVE."
        test_recipe:
          setup: ["Tank T1 FROZEN with residing SUSPENDED Cohort C1."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-02T00:00:00Z", dissolved_oxygen_mg_l: 3.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
          trigger:
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-03T00:00:00Z", dissolved_oxygen_mg_l: 8.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
            - call: "GET /cohorts/${c1}"
              payload: {}
              as: FarmTechnician
          assert:
            - "Tank.posture == OPEN; Cohort.operational_status == ACTIVE after recovery."

      - name: treatment_complete_before_due_returns_error
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Cohort.UNDER_TREATMENT_to_WITHDRAWAL", "errors[ERR_TREATMENT_NOT_DUE]"]
        distinguishing_aspect: "POST /health-treatments/{id}/complete while current clock < treatment_end_at returns ERR_TREATMENT_NOT_DUE."
        test_recipe:
          setup: ["Treatment ACTIVE started 2026-01-01 duration 5 (end 2026-01-06); clock at 2026-01-03."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /health-treatments"
