  - rule_id: boundary_precision_check
    instances:
      - name: corral_occupancy_exact_adjacency_is_free_and_the_equality_sum_passes
        grounds:
          - calculations.wave_corral_occupancy_load
          - validations[priority=21].ERR_CORRAL_WINDOW_CONFLICT
          - entities.Course.fields.corral_throughput_capacity
        distinguishing_aspect: |
          Two boundaries are probed on one aggregate half-open interval rule. First the capacity
          equality boundary: a candidate whose capacity brings the summed occupancy to exactly
          corral_throughput_capacity (112 + 88 == 200) must be accepted, while 112 + 100 == 212
          must be refused. Second the interval boundary: a candidate starting exactly
          CORRAL_OCCUPANCY_MINUTES after a peer's start does NOT overlap that peer, so the
          peer's 112 is excluded from the sum even though a naive closed-interval test would
          include it and push the total to 300.
        test_recipe:
          setup:
            - "One venue and one DRAFT course with corral_throughput_capacity 200 and the three canonical obstacles, so design_capacity_pph is 450 and the priority-30 wave gate is floor(450 * 15 / 60) == 112."
            - "No LandUsePermit exists on the venue, so the priority-19 quiet-hours rule is skipped and only the corral rule can bind."
            - "Heat A1 already occupies [08:00:00, 08:06:00) with capacity 112."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Pond Crossing", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 2, footprint_sqm: 1500, water_contact: true, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/divisions"
              payload: { name: "Elite Competitive", division_type: "COMPETITIVE", bypass_policy: "DQ_ON_BYPASS", scoring_mode: "CHIP_TIME", min_age: 18, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_comp_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_comp_id}", wave_code: "A1", scheduled_start_utc: "2026-09-12T08:00:00Z", capacity: 112 }
              as: RaceDirector
              captures: { wave_a1_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_comp_id}", wave_code: "A9", scheduled_start_utc: "2026-09-12T08:04:00Z", capacity: 100 }
              as: RaceDirector
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_comp_id}", wave_code: "A2", scheduled_start_utc: "2026-09-12T08:05:00Z", capacity: 88 }
              as: RaceDirector
              captures: { wave_a2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_comp_id}", wave_code: "A3", scheduled_start_utc: "2026-09-12T08:06:00Z", capacity: 100 }
              as: RaceDirector
              captures: { wave_a3_id: $.data.id }
          assert:
            - "Course.${course_id}.design_capacity_pph == 450"
            - "The first trigger call returns 409 with error_id ERR_CORRAL_WINDOW_CONFLICT (112 + 100 == 212 > 200)"
            - "The second trigger call returns 201 (112 + 88 == 200, equality passes)"
            - "The third trigger call returns 201: A1 is excluded by exact adjacency, so the sum is 88 + 100 == 188, not 300"
            - "Wave.${wave_a2_id}.capacity == 88 and Wave.${wave_a3_id}.capacity == 100"
            - "Wave.${wave_a1_id}.release_status == SCHEDULED and its capacity is still 112"

      - name: staff_travel_buffer_accepts_an_exact_fifteen_minute_gap_and_rejects_one_second_less
        grounds:
          - calculations.staff_shift_conflict_window
          - validations[priority=20].ERR_STAFF_SHIFT_CONFLICT
          - entities.StaffAssignment.fields.shift_start_utc
        distinguishing_aspect: |
          The other interval rule has the opposite geometry: pairwise, closed, buffer-inflated,
          capacity-blind, and evaluated across every course rather than within one. The probe
          sits on the buffer edge at second resolution: a shift starting at 11:14:59 after a
          peer ending at 11:00:00 is refused because 11:14:59 < 11:15:00, while the very next
          second, 11:15:00, is accepted because the comparison is strict. The peer lives on a
          different course, so an implementation that scopes the conflict search to the request's
          own course accepts all three calls.
        test_recipe:
          setup:
            - "One venue carrying two courses: C1 (the peer course) and C2 (the candidate course)."
            - "STAFF-9 holds one CONFIRMED MEDIC shift on C1 from 2026-09-12T06:00:00Z to 2026-09-12T11:00:00Z; MEDIC shifts carry no obstacle_id, so the priority-16 division-shape rule is satisfied."
            - "STAFF_TRAVEL_BUFFER_MINUTES is 15, so the earliest acceptable next start for STAFF-9 is exactly 2026-09-12T11:15:00Z."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_c1_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Sprint", total_distance_m: 5000, corral_release_rate_per_min: 10.00, corral_throughput_capacity: 150 }
              as: CourseDesigner
              captures: { course_c2_id: $.data.id }
            - call: "POST /ocr/courses/${course_c1_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-9", staff_role: "MEDIC", certification_level: "PARAMEDIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T11:00:00Z" }
              as: SafetyOfficer
              captures: { sa_peer_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_c2_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-9", staff_role: "MEDIC", certification_level: "PARAMEDIC", shift_start_utc: "2026-09-12T11:10:00Z", shift_end_utc: "2026-09-12T15:00:00Z" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_c2_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-9", staff_role: "MEDIC", certification_level: "PARAMEDIC", shift_start_utc: "2026-09-12T11:14:59Z", shift_end_utc: "2026-09-12T15:00:00Z" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_c2_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-9", staff_role: "MEDIC", certification_level: "PARAMEDIC", shift_start_utc: "2026-09-12T11:15:00Z", shift_end_utc: "2026-09-12T15:00:00Z" }
              as: SafetyOfficer
              captures: { sa_accepted_id: $.data.id }
          assert:
            - "The first trigger call returns 409 with error_id ERR_STAFF_SHIFT_CONFLICT"
            - "The second trigger call returns 409 with error_id ERR_STAFF_SHIFT_CONFLICT (11:14:59 is one second inside the buffer)"
            - "The third trigger call returns 201 and StaffAssignment.${sa_accepted_id}.status == CONFIRMED"
            - "StaffAssignment.${sa_accepted_id}.shift_start_utc == 2026-09-12T11:15:00Z and its course_id == ${course_c2_id}"
            - "StaffAssignment.${sa_peer_id}.status == CONFIRMED and Course.${course_c1_id}.medic_headcount == 1"
            - "Course.${course_c2_id}.medic_headcount == 1 after the third call"

  - rule_id: cross_entity_state_dependency
