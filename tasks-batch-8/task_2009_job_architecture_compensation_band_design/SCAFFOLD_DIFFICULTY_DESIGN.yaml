          trigger:
            - { call: "POST /comp/exception-requests", payload: { employee_id: "${emp1}", pay_band_id: "${band2}", type: "ABOVE_MAX_HIRE", requested_salary_cents: 15500000, justification: "hire above max" }, as: DepartmentManager, as_user_id: "${dept}", captures: { xr1: $.data.id } }
            - { call: "POST /comp/exception-requests/${xr1}/hrbp-pass", payload: {}, as: HRBP, as_user_id: "hrbp-1" }
