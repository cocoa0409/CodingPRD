              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl7}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl7}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
