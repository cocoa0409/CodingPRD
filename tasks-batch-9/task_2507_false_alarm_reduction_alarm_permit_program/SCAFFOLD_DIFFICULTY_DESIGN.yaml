          - "validations[priority=36]"
          - entities.FalseAlarmIncident.fields.determined_at
        distinguishing_aspect: >-
          At one and the same clock (2026-01-26) a second appeal against an incident determined on
          2026-01-05 must fail with 409 ERR_APPEAL_WINDOW_CLOSED (day 21 of a 20-day window, and a
          FILED appeal also exists), while a second appeal against an incident determined on
