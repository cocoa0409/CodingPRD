        grounds:
          - entities.WorkArea.fields.worksite_id
          - entities.HazardAssessment.fields.work_area_id
          - entities.PreventionPlan.fields.worksite_id
          - validations[priority=32]
          - errors[ERR_WORK_AREA_WORKSITE_MISMATCH]
          - endpoints[POST /hazard-assessments]
        distinguishing_aspect: |
          The topology is flat - every entity declares parent null and every relationship is an
          explicit FK - so nothing structural stops a HazardAssessment pointing at a WorkArea of one
          worksite and a PreventionPlan of another; the consistency has to be enforced by the
          priority-32 cross-aggregate rule, which returns 409 even though both FKs resolve.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
