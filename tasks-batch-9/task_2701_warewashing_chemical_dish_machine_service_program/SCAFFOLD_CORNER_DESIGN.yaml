        claim_type: Priority Ordering
        grounds:
          - validations.site_posture_critical_blocks_publish
          - validations.telemetry_sufficient_for_publish
        excluded_because:
          difficulty_instance: publish_safety_posture_error_outranks_insufficient_telemetry
          rationale: |
            The §1.8 instance builds a site that violates both the priority-40 posture rule and the
            priority-55 telemetry-sufficiency rule at once, asserts ERR_SITE_POSTURE_CRITICAL, then closes
            the ticket to prove the second error surfaces only once the first is cleared. A corner-level
            repeat would add no new boundary.

      - name: individually_free_technicians_can_still_be_collectively_unavailable
        claim_type: Aggregate validation
        grounds:
          - calculations.dispatch_technician_selection
          - errors[ERR_NO_ELIGIBLE_TECHNICIAN]
        excluded_because:
          difficulty_instance: technician_workload_cap_boundary_empties_the_dispatch_pool
          rationale: |
            The §1.8 instance walks the workload cap to its exact boundary - every candidate at
            open_ticket_count 2 dispatches, every candidate at 3 empties the pool with
            ERR_NO_ELIGIBLE_TECHNICIAN and zero mutation - which is precisely the aggregate claim, tested
            at both sides of the threshold rather than at one arbitrary point.

      - name: a_visit_window_can_be_free_and_still_conflict
        claim_type: Temporal validation
        grounds:
          - validations.technician_schedule_no_overlap
          - errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]
        excluded_because:
          difficulty_instance: technician_visit_windows_reject_inside_the_thirty_minute_travel_buffer
          rationale: |
            The §1.8 instance already probes the 30-minute travel buffer at 29 and 30 minutes on both
            sides of an existing visit and confirms that only SCHEDULED, IN_PROGRESS, SUBMITTED and
            VERIFIED visits block, so the temporal claim is covered at its exact boundary.

      - name: adjacent_review_periods_share_a_boundary_without_colliding
        claim_type: Temporal validation
        grounds:
          - validations.review_period_no_overlap
          - errors[ERR_REVIEW_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: review_windows_are_half_open_with_no_buffer_at_the_shared_boundary
          rationale: |
            The §1.8 instance contrasts the review window (half-open, no buffer, DRAFTs never blocking,
            re-checked at publish) against the buffered visit window in the same scenario, which is a
            strictly stronger test of the shared-boundary behaviour than an isolated corner case.

  - section: endpoints
    instances:
      - name: patching_a_technician_changes_the_roster_but_not_the_computed_counters
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /warewashing/technicians/{technician_id}]
          - entities.Technician.fields.open_ticket_count
          - calculations.dispatch_technician_selection
          - errors[ERR_NO_ELIGIBLE_TECHNICIAN]
        distinguishing_aspect: |
          The only update endpoint in the API is partial and narrow: two successive PATCHes move status
          and certification_level and take version to 3, computed counters supplied in the body are
          ignored, and the roster change bites immediately - the OFF_DUTY technician leaves the dispatch
          candidate set, so dispatching the only queued ticket returns ERR_NO_ELIGIBLE_TECHNICIAN (409)
          with the ticket still QUEUED.
        test_recipe:
          setup:
            - "One INSTALLED placement in NW with exactly one NW technician and one QUEUED ticket."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Rico Vance", region_code: "NW", certification_level: "L1" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id, t_v1: $.data.version, t_status_1: $.data.status }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/service-tickets"
              payload: { placement_id: "${pl_id}", reported_symptom: "RACK_QUALITY" }
              as: CustomerContact
              as_user_id: "${cust_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "PATCH /warewashing/technicians/${tech_id}"
              payload: { certification_level: "SANITATION_CERTIFIED" }
              as: PlatformAdmin
              captures: { cert_2: $.data.certification_level, t_v2: $.data.version, load_2: $.data.open_ticket_count }
            - call: "PATCH /warewashing/technicians/${tech_id}"
              payload: { status: "OFF_DUTY" }
              as: PlatformAdmin
              captures: { st_3: $.data.status, cert_3: $.data.certification_level, t_v3: $.data.version }
            - call: "POST /warewashing/service-tickets/${ticket_id}/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /warewashing/service-tickets/${ticket_id}"
              payload: {}
              as: AccountManager
              captures: { tk_status: $.data.status, tk_assigned: $.data.assigned_technician_id }
          assert:
            - "${t_status_1} == AVAILABLE from the declared default and ${t_v1} == 1"
            - "${cert_2} == SANITATION_CERTIFIED with ${t_v2} == 2 and ${load_2} == 0 - the PATCH is partial, status untouched"
            - "${st_3} == OFF_DUTY, ${cert_3} == SANITATION_CERTIFIED (preserved by the second partial write) and ${t_v3} == 3"
            - "${err} == ERR_NO_ELIGIBLE_TECHNICIAN with HTTP 409 - the roster change is effective immediately"
            - "${tk_status} == QUEUED and ${tk_assigned} == null - a failed dispatch mutates nothing"

      - name: the_retrieval_pair_takes_an_explicit_due_date_and_strips_the_dispensers
