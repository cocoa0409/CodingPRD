  - rule_id: transitive_cascade
    instances:
      - name: document_acceptance_cascade_rebands_guest_risk_tier
        grounds:
          - state_machines.IdentityDocument.PENDING_to_ACCEPTED
          - calculations.guest_verification_state
          - calculations.guest_risk_score
          - entities.Guest.fields.accepted_doc_count
          - entities.Guest.fields.verification_state
          - entities.Guest.fields.risk_tier
