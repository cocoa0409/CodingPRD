      - name: retire_unknown_revenue_product_returns_product_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_PRODUCT_NOT_FOUND]"
          - "endpoints[POST /monetization/revenue-products/{product_id}/retire]"
        distinguishing_aspect: "Path existence (priority 10) is checked on action endpoints too, so retiring an unknown product_id is 404 ERR_PRODUCT_NOT_FOUND rather than a state error."
        test_recipe:
          setup: ["One real ACTIVE product exists."]
          setup_api_calls:
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Fan Tips", creator_share_bps: 8000, platform_fee_bps: 2000 }
              as: PlatformAdmin
              captures: { prod: "$.data.id" }
          trigger:
            - call: "POST /monetization/revenue-products/00000000-0000-4000-8000-00000000000a/retire"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_PRODUCT_NOT_FOUND'"
            - "RevenueProduct.${prod}.status == 'ACTIVE'"

      - name: create_creator_missing_country_code_is_missing_required_field
        claim_type: required_fields
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_MISSING_REQUIRED_FIELD]"
          - "endpoints[POST /monetization/creators]"
        distinguishing_aspect: "country_code has no default, so omitting it is ERR_MISSING_REQUIRED_FIELD (422) rather than a null-valued creator."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /monetization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /monetization/creators"
              payload: { display_name: "No Country", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
