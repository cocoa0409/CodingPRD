# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Handles case intake, scheduling assessments and consultations"
    identity: opaque
    exclusive_operations:
      - "POST /cases — Create case"
      - "POST .../assessments — Create assessment"
      - "POST .../assessments/{id}/cancel — Cancel assessment"
      - "POST .../ot-consultations — Schedule OT consultation"
      - "POST .../ot-consultations/{id}/cancel — Cancel OT consultation"
      - "POST .../reassessment-schedules — Create reassessment schedule"
      - "POST .../reassessment-schedules/{id}/schedule — Schedule reassessment"

  - name: Assessor
    description: "OT or CAPS professional performing assessments"
    identity: opaque
    exclusive_operations:
      - "POST .../assessments/{id}/start — Start assessment"
      - "POST .../assessments/{id}/complete — Complete assessment"
      - "POST .../ot-consultations/{id}/complete — Complete OT consultation"

  - name: ProjectManager
    description: "Manages quotes, jobs, and case lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST .../quotes — Create quote"
      - "POST .../quotes/{id}/line-items — Add quote line items"
      - "POST .../quotes/{id}/submit — Submit quote"
      - "POST .../installation-jobs — Create installation job"
      - "POST .../installation-jobs/{id}/order-materials — Order materials"
      - "POST .../installation-jobs/{id}/cancel — Cancel job"
      - "POST .../warranty-claims/{id}/assign — Assign warranty claim"
      - "POST .../warranty-claims/{id}/deny — Deny warranty claim"
      - "POST .../reassessment-schedules/{id}/waive — Waive reassessment"
      - "POST .../cases/{id}/cancel — Cancel case"
      - "POST .../cases/{id}/close — Close case"

  - name: FundingCoordinator
    description: "Manages funding sources, allocations, and quote approvals"
    identity: opaque
    exclusive_operations:
      - "POST .../funding-sources — Create funding source"
      - "POST .../funding-sources/{id}/approve — Approve funding"
      - "POST .../funding-sources/{id}/deny — Deny funding"
      - "POST .../funding-sources/{id}/withdraw — Withdraw funding"
      - "POST .../funding-sources/{id}/allocations — Create allocation"
      - "POST .../funding-sources/{id}/allocations/{id}/reverse — Reverse allocation"
      - "POST .../quotes/{id}/start-review — Start quote review"
      - "POST .../quotes/{id}/approve — Approve quote"
      - "POST .../quotes/{id}/reject — Reject quote"

  - name: CrewLead
    description: "Leads installation crews"
    identity: opaque
    exclusive_operations:
      - "POST .../installation-jobs/{id}/start — Start installation"
      - "POST .../installation-jobs/{id}/punch-list — Enter punch list"
      - "POST .../installation-jobs/{id}/complete — Complete installation"
      - "POST .../rental-ramps/{id}/install — Install rental ramp"
      - "POST .../warranty-claims/{id}/start — Start warranty work"
      - "POST .../warranty-claims/{id}/resolve — Resolve warranty claim"

  - name: LogisticsCoordinator
    description: "Manages rental inventory and logistics"
    identity: opaque
    exclusive_operations:
      - "POST /inventory-units — Create inventory unit"
      - "POST /inventory-units/{id}/maintenance — Send to maintenance"
      - "POST /inventory-units/{id}/return-to-service — Return from maintenance"
      - "POST /inventory-units/{id}/retire — Retire unit"
      - "POST .../rental-ramps — Create rental reservation"
      - "POST .../rental-ramps/{id}/deliver — Deliver rental"
      - "POST .../rental-ramps/{id}/schedule-pickup — Schedule pickup"
      - "POST .../rental-ramps/{id}/confirm-pickup — Confirm pickup"
      - "POST .../rental-ramps/{id}/cancel — Cancel rental"

  - name: Inspector
    description: "Performs inspections"
    identity: opaque
    exclusive_operations:
      - "POST .../inspections — Schedule inspection"
      - "POST .../inspections/{id}/pass — Pass inspection"
      - "POST .../inspections/{id}/fail — Fail inspection"

  - name: BillingCoordinator
    description: "Manages invoicing and payments"
    identity: opaque
    exclusive_operations:
      - "POST .../invoices — Create invoice"
      - "POST .../invoices/{id}/line-items — Add invoice line items"
      - "POST .../invoices/{id}/send — Send invoice"
      - "POST .../invoices/{id}/record-payment — Record payment"
      - "POST .../invoices/{id}/void — Void invoice"

  - name: Client
    description: "The client receiving services"
    identity: opaque
    exclusive_operations:
      - "POST .../invoices/{id}/dispute — Dispute invoice"
      - "POST .../warranty-claims — Create warranty claim"

  - name: SystemAdmin
    description: "System administrator for test operations"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — Set system clock"

  - name: Any
    description: "Shared read access"
    identity: opaque
    shared_operations:
      - "GET /cases — List cases"
      - "GET /cases/{id} — Get case"
      - "GET .../assessments — List assessments"
      - "GET .../assessments/{id} — Get assessment"
      - "GET .../quotes — List quotes"
      - "GET .../quotes/{id} — Get quote"
      - "GET .../funding-sources — List funding sources"
      - "GET .../funding-sources/{id} — Get funding source"
      - "GET .../funding-sources/{id}/allocations — List allocations"
      - "GET .../installation-jobs — List jobs"
      - "GET .../installation-jobs/{id} — Get job"
      - "GET .../rental-ramps — List rentals"
      - "GET .../rental-ramps/{id} — Get rental"
      - "GET /inventory-units — List inventory"
      - "GET /inventory-units/{id} — Get unit"
      - "GET .../inspections — List inspections"
      - "GET .../inspections/{id} — Get inspection"
      - "GET .../invoices — List invoices"
      - "GET .../invoices/{id} — Get invoice"
      - "GET .../warranty-claims — List claims"
      - "GET .../warranty-claims/{id} — Get claim"
      - "GET .../ot-consultations — List consultations"
      - "GET .../ot-consultations/{id} — Get consultation"
      - "GET .../reassessment-schedules — List schedules"
      - "GET .../reassessment-schedules/{id} — Get schedule"
