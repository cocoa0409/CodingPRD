  - section: consistency_model
    instances:
      - name: immediate_visibility_on_create
        claim_type: immediate_visibility
        grounds:
          - complexity_profile
        distinguishing_aspect: "Immediate consistency: the POST /api/kilns response already carries id/created_at/version == 1, and a following GET returns the same stored representation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id, kv: $.data.version } }
            - { call: "GET /api/kilns/${k_id}", payload: {}, as: FarmManager, captures: { kn: $.data.name, kv2: $.data.version } }
          assert:
            - "captured kv == 1 and captured kn == 'K1' and kv2 == 1"
