      - name: zone_clearance_and_ratio_precision_half_up
        claim_type: Precision
        grounds:
          - calculations.zone_deficiency_assessment.precision
          - entities.ZoneEvaluation.fields.required_clearance_ft
          - entities.ZoneEvaluation.fields.deficit_ratio
        distinguishing_aspect: |
          Two different rounding scales are applied in one row and both are ROUND_HALF_UP:
          required_clearance_ft is 5 * 1.25 == 6.25 rounded to 1 decimal, which is 6.3 (truncation or
          banker's rounding would give 6.2), and deficit_ratio is 1.4 / 6.3 == 0.222222... rounded to
          4 decimals, which is 0.2222 (not 0.2223 and not 0.22).
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, MODERATE parcel with slope_pct 20 — exactly on the SLOPE_FACTOR_BREAKS.LOW_MAX_EXCL edge, so slope_factor is 1.25, not 1.00; inspection NOTICED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-3301", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "GRASS", slope_pct: 20, lot_area_sqft: 43560, hazard_zone: "MODERATE", access_constraint: "NONE" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_score0: "$.data.risk_score" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 4.9 }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { req: "$.data.required_clearance_ft", dft: "$.data.deficit_ft", ratio: "$.data.deficit_ratio", sev: "$.data.deficiency_severity", pts: "$.data.points" }
          assert:
            - "${p1_score0} == 35.25 at intake (slope 20 sits in the 1.00 hazard-multiplier MODERATE band)"
            - "${req} == 6.3: ZONE_BASE_FT.ZONE_0_EMBER 5 * slope_factor 1.25 == 6.25, rounded half-up to 1 decimal"
            - "${dft} == 1.4 (6.3 - 4.9) and ${ratio} == 0.2222 (1.4 / 6.3 == 0.222222..., half-up at 4 decimals)"
            - "${sev} == \"MINOR\": 0.2222 <= SEVERITY_MINOR_MAX_RATIO 0.2500"
            - "${pts} == 33.33: round_half_up(0.2222 * 100 * ZONE_WEIGHT.ZONE_0_EMBER 1.5, 2) == round_half_up(33.33, 2), with no ladder-fuel penalty"
            - "Adding compliant ZONE_1 (40.0) and ZONE_2 (130.0) evaluations and completing with result FAIL gives measured_veg_points == 33.33 and rescores the parcel to risk_score 33.25 with risk_class LOW"

      - name: district_metrics_exclude_pending_and_exempt_parcels
        claim_type: Input Set Filtering
        grounds:
          - calculations.program_compliance_metrics.input_set
          - endpoints."GET /fire-district/inspection-cycles/{cycle_id}/metrics"
          - endpoints."PATCH /fire-district/parcels/{parcel_id}"
        distinguishing_aspect: |
          PENDING_INSPECTION and EXEMPT parcels are removed from BOTH the numerator and the denominator
          of every rate, and from the survival outcome set as well: with one COMPLIANT parcel, one
          never-inspected parcel and one exempt parcel, eligible_parcel_count is 1 and
          compliance_rate_pct is 100.00 — a denominator of 3 would give 33.33 — while
          survived_noncompliant_pct stays null because the only non-compliant survivors were filtered out.
        test_recipe:
          setup:
            - "Active cycle; parcel A passes inspection (COMPLIANT); parcel B is never inspected (PENDING_INSPECTION); parcel C is patched to exemption_flag true (EXEMPT). All three then get survival outcomes."
          setup_api_calls:
