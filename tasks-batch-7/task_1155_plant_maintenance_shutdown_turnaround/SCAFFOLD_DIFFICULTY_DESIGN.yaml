          trigger:
            - { call: "POST /shifts/${sc_id}/assignments", payload: { worker_id: "${wk_id}", planned_hours: 8 }, as: Planner, captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_BADGE_NOT_CLEARED (409): the safety check (priority 9) fires before the temporal rest-gap check (priority 10), so ERR_REST_PERIOD_VIOLATION MUST NOT surface"
