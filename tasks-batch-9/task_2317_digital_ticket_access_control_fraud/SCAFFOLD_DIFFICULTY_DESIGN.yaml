          The lockout interval is the CLOSED interval
          [last_exited_at, last_exited_at + RE_ENTRY_LOCKOUT_SECONDS] with
          RE_ENTRY_LOCKOUT_SECONDS 120. After an exit at 2026-09-12T18:10:30Z, an IN scan
