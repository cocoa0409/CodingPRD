  - rule_id: transitive_cascade
    instances:

      - name: drought_reading_destock_cascade_reading_to_pasture_to_contract_to_lot
        grounds:
          - calculations.drought_trigger
          - calculations.pasture_grazing_posture
          - state_machines.GrazingContract.lifecycle_status.ACTIVE_to_EARLY_REMOVAL_PENDING
          - state_machines.CattleLot.ON_FEED_to_REMOVAL_SCHEDULED
          - state_machines.CattleLot.SCHEDULED_to_RECEIVING_HELD
          - entities.Pasture.fields.drought_destock_flag
        distinguishing_aspect: |
          DEPTH-3 CHAIN triggered by POST /grazing/pastures/{id}/drought-readings: the
          reading mutates Pasture.drought_destock_flag; THAT mutation drives the pasture's
          posture to DESTOCK_ORDERED which moves contract K1 ACTIVE -> EARLY_REMOVAL_PENDING;
          THAT contract move drives lot L1 ON_FEED -> REMOVAL_SCHEDULED with a
          scheduled_removal_date of 2026-09-30. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Contract K1 is ACTIVE on pasture North Bench; lot L1 is ON_FEED with 150 head received on 2026-08-10; a second lot L1b is still SCHEDULED."
            - "One drought reading dated 2026-09-01 at index 3 already exists, so the run stands at one and no destock has been ordered."
