# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 3240 — Subscription Catalog Licensing & Day-One Release Economics
#
# Breadth probe over §1.1–§1.7. Corners already exercised by a §1.8 instance
# appear as `excluded_because:` stubs with no test_recipe. Anchors (&a_*) are
# plain YAML aliases and expand inline, so every instance's call list is
# self-contained once loaded.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: region_create_returns_the_stored_configuration_with_zeroed_capacity
        claim_type: Creation
        grounds:
          - entities.Region
          - endpoints.POST_/catalog/regions
        distinguishing_aspect: "A region created with only region_code, currency_code, price_multiplier, availability_ceiling_titles and catalog_tier_floor comes back with an id and created_at, no version field (common_fields false), and capacity figures at 0 / WITHIN_CAPACITY because nothing is published yet."
        test_recipe:
          setup:
            - "Logical clock at the server default 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - &a_clock
              call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.20, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
              captures: { region_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id is present"
            - "Region.NA.region_code == \"NA\" and currency_code == \"USD\" and price_multiplier == 1.20"
            - "Region.NA.availability_ceiling_titles == 4000 and catalog_tier_floor == ESSENTIAL"
            - "Region.NA.capacity_required_slots == 0, capacity_usable_slots == 12000.00, capacity_deficit_slots == -12000.00 and capacity_status == WITHIN_CAPACITY"
            - "the response carries no version field, because Region is declared with common_fields: false"

      - name: publisher_get_returns_the_rollup_figures_and_rejects_an_unknown_id
        claim_type: Not Found
        grounds:
          - entities.Publisher.fields.lifetime_licensing_cost_cents
          - endpoints.GET_/catalog/publishers/{publisher_id}
          - errors.ERR_PUBLISHER_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "The seeded publisher reads back with deal_count 0 and lifetime_licensing_cost_cents 0.00, while a syntactically valid but unallocated id on the same path segment yields the entity-specific 404 ERR_PUBLISHER_NOT_FOUND rather than a generic 400."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z; one Publisher seeded."
          setup_api_calls:
            - *a_clock
            - &a_pub
              call: "POST /catalog/publishers"
              payload: { name: "Nova Interactive", home_region_code: "NA" }
              as: CatalogAdmin
              captures: { pub_id: $.data.id }
          trigger:
            - call: "GET /catalog/publishers/${pub_id}"
              payload: {}
              as: CatalogAdmin
              captures: { pub_status: $.data.status, pub_deals: $.data.deal_count, pub_cost: $.data.lifetime_licensing_cost_cents }
            - call: "GET /catalog/publishers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: CatalogAdmin
              captures: { err_unknown_pub: $.data.error_id }
          assert:
            - "pub_status == ACTIVE and pub_deals == 0 and pub_cost == 0.00"
            - "the second call returns 404 with err_unknown_pub == ERR_PUBLISHER_NOT_FOUND"
            - "err_unknown_pub != ERR_INVALID_REQUEST, so a well-formed unknown id is not a request-format failure"

      - name: titles_list_paginates_and_filters_by_publisher
        claim_type: Listing
        grounds:
          - endpoints.GET_/catalog/titles
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three titles across two publishers, limit=2 returns 2 rows with total_count 3 and has_more true, offset=2 returns the remaining row with has_more false, and a publisher filter narrows total_count to the filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z; two publishers with three titles between them."
          setup_api_calls:
            - *a_clock
            - *a_pub
            - &a_pub2
              call: "POST /catalog/publishers"
              payload: { name: "Halcyon Works", home_region_code: "NA" }
              as: CatalogAdmin
              captures: { pub2_id: $.data.id }
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Crimson Drift", platform_set: ["CONSOLE", "PC"], day_one_eligible: true, list_price_cents: 7000, unit_sales_30d: 25000 }
              as: CatalogAdmin
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Second Wind", platform_set: ["PC"], day_one_eligible: false, list_price_cents: 4000, unit_sales_30d: 9000 }
              as: CatalogAdmin
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub2_id}", name: "Static Vale", platform_set: ["PC", "CLOUD"], day_one_eligible: false, list_price_cents: 4000, unit_sales_30d: 8000 }
              as: CatalogAdmin
          trigger:
            - call: "GET /catalog/titles"
              payload: { limit: 2, offset: 0 }
              as: CatalogAnalyst
            - call: "GET /catalog/titles"
              payload: { limit: 2, offset: 2 }
              as: CatalogAnalyst
            - call: "GET /catalog/titles"
              payload: { publisher_id: "${pub2_id}", limit: 10, offset: 0 }
              as: CatalogAnalyst
            - call: "GET /catalog/titles"
              payload: {}
              as: CatalogAnalyst
          assert:
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "the second page returns exactly 1 row with has_more == false"
            - "the publisher-filtered list returns exactly 1 row (Static Vale) with total_count == 1"
            - "the unfiltered list defaults to limit 10 and offset 0 and returns 3 rows"
            - "all three titles report status == DRAFT"

      - name: title_create_missing_publisher_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Title.fields.publisher_id
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "publisher_id is a declared required input on POST /catalog/titles, so omitting it fails at priority 3 with 400 ERR_INVALID_REQUEST before any existence check can run, and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z; one Publisher seeded."
          setup_api_calls:
            - *a_clock
            - *a_pub
          trigger:
            - call: "POST /catalog/titles"
              payload: { name: "Orphan Title", platform_set: ["PC"], day_one_eligible: false, list_price_cents: 4000 }
              as: CatalogAdmin
              captures: { err_missing_pub: "$.data.error_id" }
          assert:
            - "the response status is 400 with err_missing_pub == ERR_INVALID_REQUEST"
            - "GET /catalog/titles returns 0 rows, so the rejected create persisted nothing"
            - "err_missing_pub != ERR_TITLE_NOT_FOUND, confirming this is a body-format failure rather than a lookup miss"

      - name: title_create_defaults_day_one_eligible_and_unit_sales
        claim_type: Defaults
        grounds:
          - entities.Title.fields.day_one_eligible
          - entities.Title.fields.unit_sales_30d
          - entities.Title.fields.weighted_engagement_score
        distinguishing_aspect: "Omitting both optional fields lands day_one_eligible at false and unit_sales_30d at 0, while a later day-one projection for this title is refused with ERR_DAY_ONE_NOT_ELIGIBLE — the default is observable through the refusal, not just through the read."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z; one Publisher seeded."
          setup_api_calls:
            - *a_clock
            - *a_pub
          trigger:
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Quiet Harbor", platform_set: ["PC"], list_price_cents: 2000 }
              as: CatalogAdmin
              captures: { title_q_id: $.data.id, title_q_eligible: $.data.day_one_eligible, title_q_units: $.data.unit_sales_30d, title_q_engagement: $.data.weighted_engagement_score }
          assert:
            - "title_q_eligible == false and title_q_units == 0"
            - "title_q_engagement == 0.00 with no catalog entries yet"
            - "GET /catalog/titles/${title_q_id} reports status == DRAFT"
            - "a POST /catalog/availability-projections for this title with release_class DAY_ONE is refused with ERR_DAY_ONE_NOT_ELIGIBLE once a LIVE deal exists, because the default is false"

      - name: title_weighted_engagement_score_is_recomputed_on_publish_and_retire
        claim_type: Computed Fields
        grounds:
          - calculations.weighted_engagement_score
          - entities.Title.fields.weighted_engagement_score
          - endpoints.POST_/catalog/catalog-entries/{entry_id}/retire
        distinguishing_aspect: "weighted_engagement_score is source: computed and tracks the union of ADDED entries: 0.00 before any publish, 90.00 after a 6000-popularity PREMIUM entry, and back to 0.00 once every entry of the title is delisted."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM and ESSENTIAL tiers, publisher, day-one-eligible title, HYBRID deal LIVE, one planned CATALOG_ADD entry."
          setup_api_calls:
            - *a_clock
            - &a_region
              call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.20, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - &a_tier_prem
              call: "POST /catalog/tiers"
              payload: { tier_code: "PREMIUM", monthly_price_cents: 1799, console_access: true, pc_access: true, cloud_access: true, online_play_bundle: true, member_discount_pct: 0.075, discount_retention_days: 30, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - call: "POST /catalog/tiers"
              payload: { tier_code: "ESSENTIAL", monthly_price_cents: 999, console_access: true, pc_access: false, cloud_access: false, online_play_bundle: false, member_discount_pct: 0.0, discount_retention_days: 0, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - *a_pub
            - &a_title
              call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Crimson Drift", platform_set: ["CONSOLE", "PC"], day_one_eligible: true, list_price_cents: 7000, unit_sales_30d: 25000 }
              as: CatalogAdmin
              captures: { title_id: $.data.id, title_v: $.data.version }
            - &a_deal
              call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub_id}", title_id: "${title_id}", compensation_model: "HYBRID", guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 251, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /catalog/licensing-deals/${deal_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
            - &a_entry_add
              call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
            - call: "GET /catalog/titles/${title_id}"
              payload: {}
              as: CatalogAnalyst
              captures: { title_score_before: $.data.weighted_engagement_score }
            - call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "GET /catalog/titles/${title_id}"
              payload: {}
              as: CatalogAnalyst
              captures: { title_score_published: $.data.weighted_engagement_score, title_status_published: $.data.status }
            - call: "POST /catalog/catalog-entries/${entry_id}/retire"
              payload: {}
              as: CatalogAdmin
            - call: "GET /catalog/titles/${title_id}"
              payload: {}
              as: CatalogAnalyst
              captures: { title_score_retired: $.data.weighted_engagement_score, title_status_retired: $.data.status }
          assert:
            - "title_score_before == 0.00"
            - "title_score_published == 90.00 (6000 / 100 * 1.50, the PREMIUM tier weight) and title_status_published == RELEASED"
            - "title_score_retired == 0.00 and title_status_retired == RETIRED"
            - "a client-supplied weighted_engagement_score in the create payload is ignored: the value is recomputed, never stored from input"

      - name: catalog_entry_create_extra_field_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.CatalogEntry.fields.actual_add_date
          - entities.CatalogEntry.fields.status
          - endpoints.POST_/catalog/catalog-entries
        distinguishing_aspect: "Sending actual_add_date and status on creation is ignored: the row still starts PLANNED with a null actual_add_date and version 1, because both fields are source: system and absent from the endpoint's input list."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z; NA region, PREMIUM tier, publisher, title, HYBRID deal LIVE."
          setup_api_calls:
            - *a_clock
            - *a_region
            - *a_tier_prem
            - call: "POST /catalog/tiers"
              payload: { tier_code: "ESSENTIAL", monthly_price_cents: 999, console_access: true, pc_access: false, cloud_access: false, online_play_bundle: false, member_discount_pct: 0.0, discount_retention_days: 0, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - *a_pub
            - *a_title
            - *a_deal
            - call: "POST /catalog/licensing-deals/${deal_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, actual_add_date: "2026-06-02T00:00:00Z", status: "ADDED", version: 7 }
              as: CatalogAdmin
              captures: { entry_id: $.data.id, entry_status: $.data.status, entry_add_date: $.data.actual_add_date, entry_version: $.data.version }
          assert:
            - "GET /catalog/catalog-entries/${entry_id_written} reports status == PLANNED and actual_add_date is null — a planned entry has never been added"
            - "the same read reports version == 1"
            - "GET /catalog/catalog-entries?status=PLANNED returns exactly 1 row and ?status=ADDED returns 0 rows"
            - "removal_notice_days == 90 is computed from the dates rather than accepted from input"

      - name: subscription_create_annual_carries_zero_unpaid_months
        claim_type: Type Constraints
        grounds:
          - entities.Subscription.fields.billing_period
          - entities.Subscription.fields.unpaid_months
          - entities.Subscription.fields.prepay_amount_cents
        distinguishing_aspect: "billing_period is a closed enum whose ANNUAL member initializes unpaid_months to 0 and accepts a prepay_amount_cents, while an out-of-enum value such as LIFETIME is rejected at priority 3 with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z; NA region and PREMIUM tier; one paid-for Subscriber."
          setup_api_calls:
            - *a_clock
            - *a_region
            - *a_tier_prem
            - call: "POST /catalog/subscribers"
              payload: { email: "ana@example.com", display_name: "Ana", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_id: $.data.id }
          trigger:
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "ANNUAL", prepay_amount_cents: 18000 }
              as: CatalogAdmin
              captures: { sub_annual_id: $.data.id, sub_unpaid_annual: $.data.unpaid_months, sub_bill_annual: $.data.monthly_bill_cents }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "LIFETIME", prepay_amount_cents: 18000 }
              as: CatalogAdmin
              captures: { err_enum: $.data.error_id }
          assert:
            - "sub_unpaid_annual == 0 for an ANNUAL subscription"
            - "sub_bill_annual == 2158.80 (1799 * 1.20, no blend at a multiplier of 1.20)"
            - "the second create returns 400 with err_enum == ERR_INVALID_REQUEST"
            - "GET /catalog/subscriptions?subscriber_id=${subr_id} returns exactly 1 row"

      - name: purchase_entry_must_belong_to_the_purchased_title
        claim_type: Parent Relationships
        grounds:
          - entities.Purchase.fields.entry_id
          - validations[priority=7]
          - errors.ERR_ENTRY_TITLE_MISMATCH
        distinguishing_aspect: "In the flat topology the entry foreign key arrives in the request body, and a real entry belonging to another title is refused with 409 ERR_ENTRY_TITLE_MISMATCH rather than being silently accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z; NA region, PREMIUM tier; one publisher with two titles; a HYBRID deal LIVE per title; one published entry for the first title only."
          setup_api_calls:
            - *a_clock
            - *a_region
            - *a_tier_prem
            - call: "POST /catalog/tiers"
              payload: { tier_code: "ESSENTIAL", monthly_price_cents: 999, console_access: true, pc_access: false, cloud_access: false, online_play_bundle: false, member_discount_pct: 0.0, discount_retention_days: 0, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - *a_pub
            - *a_title
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Second Wind", platform_set: ["PC"], day_one_eligible: false, list_price_cents: 4000, unit_sales_30d: 9000 }
              as: CatalogAdmin
              captures: { title_b_id: $.data.id, title_b_v: $.data.version }
            - *a_deal
            - call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub_id}", title_id: "${title_b_id}", compensation_model: "HYBRID", guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 251, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_b_id: $.data.id }
            - call: "POST /catalog/licensing-deals/${deal_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
            - call: "POST /catalog/licensing-deals/${deal_b_id}/sign"
              payload: { expected_title_version: "${title_b_v}" }
              as: CatalogAdmin
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
            - *a_entry_add
            - call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/subscribers"
              payload: { email: "bo@example.com", display_name: "Bo", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_bo_id: $.data.id }
          trigger:
            - call: "POST /catalog/purchases"
              payload: { subscriber_id: "${subr_bo_id}", title_id: "${title_b_id}", entry_id: "${entry_id}", region_code: "NA", quantity: 1 }
              as: Subscriber
              as_user_id: "${subr_bo_id}"
              captures: { err_mismatch: $.data.error_id }
          assert:
            - "the response status is 409 with err_mismatch == ERR_ENTRY_TITLE_MISMATCH"
            - "err_mismatch != ERR_ENTRY_NOT_FOUND, because the entry exists and only its ownership is wrong"
            - "GET /catalog/purchases?subscriber_id=${subr_bo_id} returns 0 rows"
            - "GET /catalog/subscribers returns 2 rows, so the subscriber itself was never the problem"
            - "GET /catalog/entitlements returns a finite page with total_count reflecting the unfiltered set, so the listing envelope itself is intact"

  - section: state_machines
    instances:

      - name: entry_publish_repeat_is_refused_and_entitlement_rows_do_not_multiply
        claim_type: Idempotency
        grounds:
          - state_machines.Entitlement.ACTIVE_to_ACTIVE
          - entities.Entitlement.fields.access_channels
        distinguishing_aspect: "Re-resolving an already ACTIVE entitlement while its entry is unchanged is a declared self-transition: it recomputes access_channels in place and creates no second row for the same (subscription, title, region) triple."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z; NA region, PREMIUM tier, publisher, day-one-eligible title, HYBRID deal LIVE, one published entry, one Subscriber with a paid PREMIUM subscription."
          setup_api_calls:
            - *a_clock
            - *a_region
            - *a_tier_prem
            - call: "POST /catalog/tiers"
              payload: { tier_code: "ESSENTIAL", monthly_price_cents: 999, console_access: true, pc_access: false, cloud_access: false, online_play_bundle: false, member_discount_pct: 0.0, discount_retention_days: 0, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - *a_pub
            - *a_title
            - *a_deal
            - call: "POST /catalog/licensing-deals/${deal_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog/subscribers"
              payload: { email: "mira@example.com", display_name: "Mira", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
            - *a_entry_add
            - call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${subscription_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { ent_id: "$.data[0].id", ent_channels_first: "$.data[0].access_channels" }
          trigger:
            - call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
              captures: { err_republish: $.data.error_id }
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${subscription_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { ent_id_after: "$.data[0].id", ent_channels_after: "$.data[0].access_channels" }

          assert:
            - "the repeat publish returns 409 with err_republish == ERR_ENTRY_NOT_PUBLISHABLE, because the entry is already ADDED"
            - "GET /catalog/entitlements?subscription_id=${subscription_id} still returns exactly 1 row, so the refused publish minted no duplicate entitlement"
            - "ent_id_after == ${ent_id} and ent_channels_after == ent_channels_first"
            - "ent_channels_first == [\"CONSOLE\", \"PC\", \"CLOUD\"], derived from the PREMIUM tier flags"
            - "GET /catalog/catalog-entries/${entry_id} still reports status == ADDED with a single actual_add_date, so the refused publish rewrote nothing"

      - name: canceled_subscription_is_locked_down_against_pay_and_engagement
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - errors.ERR_SUBSCRIPTION_TERMINAL
          - validations[priority=5]
        distinguishing_aspect: "From the terminal CANCELLED state no transition is accepted: both the pay action and the engagement-event append are refused with 409 ERR_SUBSCRIPTION_TERMINAL, and the entitlement stays REVOKED."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z; NA region, PREMIUM tier, one Subscriber with a paid MONTHLY PREMIUM subscription, then cancelled."
          setup_api_calls:
            - *a_clock
            - *a_region
            - *a_tier_prem
            - call: "POST /catalog/subscribers"
              payload: { email: "cora@example.com", display_name: "Cora", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
            - call: "POST /catalog/subscriptions/${subscription_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
          trigger:
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
              captures: { err_pay_terminal: $.data.error_id }
            - call: "POST /catalog/subscriptions/${subscription_id}/engagement-events"
              payload: { title_id: "${title_id}", session_hours: 2.0, channel: "PC", engagement_multiplier: 1.0 }
              as: Subscriber
              as_user_id: "${subr_id}"
              captures: { err_event_terminal: $.data.error_id }
          assert:
            - "both calls return 409, with err_pay_terminal == ERR_SUBSCRIPTION_TERMINAL and err_event_terminal == ERR_SUBSCRIPTION_TERMINAL"
            - "GET /catalog/subscriptions/${subscription_id} still reports lifecycle_status == CANCELLED and cancellation_reason == USER_INITIATED"
            - "GET /catalog/engagement-events?subscription_id=${subscription_id} returns 0 rows"
            - "no Subscription row was deleted: GET /catalog/subscriptions?subscriber_id=${subr_id} returns 1 row"

      - name: catalog_maintenance_advances_scheduled_active_completed_with_the_clock
        claim_type: Valid Transition
        grounds:
          - state_machines.CatalogMaintenance
          - entities.Region.fields.capacity_usable_slots
        distinguishing_aspect: "The maintenance machine is driven purely by the logical clock: SCHEDULED before the window, ACTIVE inside it (where the region's usable slots drop by the reduction), and COMPLETED after the exclusive end, when capacity is restored."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region at ceiling 4000 created with one maintenance window from 2026-07-01T00:00:00Z to 2026-07-05T00:00:00Z and a 0.25 reduction."
          setup_api_calls:
            - *a_clock
            - call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.20, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL", maintenance_windows: [{ maintenance_start: "2026-07-01T00:00:00Z", maintenance_end: "2026-07-05T00:00:00Z", capacity_reduction_pct: 0.25 }] }
              as: CatalogAdmin

            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "GET /catalog/catalog-maintenances"
              payload: { region_code: "NA", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { maint_state_before: "$.data[0].status", maint_id: "$.data[0].id" }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-07-02T00:00:00Z" }
              as: CatalogAdmin
            - call: "GET /catalog/catalog-maintenances"
              payload: { region_code: "NA", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { maint_state_during: "$.data[0].status" }
            - call: "GET /catalog/regions/NA"
              payload: {}
              as: CatalogAdmin
              captures: { usable_during: $.data.capacity_usable_slots }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: CatalogAdmin
            - call: "GET /catalog/catalog-maintenances"
              payload: { region_code: "NA", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { maint_state_after: "$.data[0].status" }
            - call: "GET /catalog/regions/NA"
              payload: {}
              as: CatalogAdmin
              captures: { usable_after: $.data.capacity_usable_slots }
          assert:
            - "maint_state_before == SCHEDULED and maint_state_during == ACTIVE"
            - "usable_during == 90000.00 — the 120000.00 base reduced by 25%"
            - "maint_state_after == COMPLETED, because the window's end is exclusive and the clock now equals it"
            - "usable_after == 120000.00, restored"

      - name: announce_removal_twice_is_refused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CatalogEntry.ADDED_to_REMOVING
          - errors.ERR_REMOVAL_ALREADY_ANNOUNCED
        distinguishing_aspect: "From REMOVING, a second announce-removal is not a declared transition and is refused with 409 ERR_REMOVAL_ALREADY_ANNOUNCED, leaving subscriber_impact_count unchanged."
        test_recipe:
          setup:
