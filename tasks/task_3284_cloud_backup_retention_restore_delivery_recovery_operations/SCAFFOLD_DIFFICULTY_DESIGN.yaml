  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: deletion_execute_conflicts_policy_ceiling_before_set_state
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_POLICY_FLOOR_SATISFIED
          - state_machines.BackupGroup.ACTIVE_to_ACTIVE
        distinguishing_aspect: "business_safety (priority 5) outranks business_referential (priority 6): a group suspend request that violates the retention floor and also targets an already-suspended group returns ERR_POLICY_FLOOR_SATISFIED from the higher-priority safety layer, not ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account whose single group already has a retention override that meets the account window, plus a SECOND group that is below it. Agent blocked."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - *acct_p
            - *grp_p
            - *pol_p
            - call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_p_id}", name: "Personal Phones", tier: "STANDARD", retention_days_override: 20 }
              as: SystemOperator
              captures: { grp_low_id: $.data.id }
            - call: "POST /backup-provider/backup-groups/${grp_low_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: true, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - call: "POST /backup-provider/backup-groups/${grp_low_id}/suspend"
              payload: {}
              as: RetentionOfficer
          trigger:
            - call: "POST /backup-provider/backup-groups/${grp_p_id}/suspend"
              payload: {}
              as: RetentionOfficer
              captures: { conflict_error: $.data.error_id }
          assert:
            - "the suspend of ${grp_p_id} returns 422 and ${conflict_error} == ERR_POLICY_FLOOR_SATISFIED"
            - "${conflict_error} != ERR_INVALID_STATE and != ERR_POLICY_REQUIRED"
            - "BackupGroup.${grp_p_id}.group_retention_days == 45 and Account.${acct_p_id}.retention_days == 45 (the group already meets the account window)"

      - name: restore_validate_conflicts_mfa_before_capacity
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_MFA_REQUIRED
          - state_machines.RestoreRequest.REQUESTED_to_VALIDATING
        distinguishing_aspect: "business_safety (priority 5) outranks business_fiscal (priority 7): a drive-shipment restore whose policy demands MFA and whose shipment also exceeds drive capacity returns ERR_MFA_REQUIRED from the safety layer, never ERR_DRIVE_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with a set holding a 400 GB file and a group policy requiring MFA for restore. No agent throttle pending."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - *acct_p
            - *grp_p
            - *pol_p
            - *agt_p
            - call: "POST /backup-provider/agents/${agt_p_id}/activate"
              payload: {}
              as: BackupOperator
            - *set_p
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/big.iso", version_number: 1, operation: "CREATE", size_bytes: 429496729600, content_hash: "sha256-big-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_p_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { acct_p_v_n: $.data.version }
          trigger:
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_p_id}", subject_agent_id: "${agt_p_id}", restore_point_in_utc: "2026-09-02T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 400.0, restore_transaction_count: 0, expected_account_version: "${acct_p_v_n}" }
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { rr_mfa_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_mfa_id}/validate"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { mfa_error: $.data.error_id }
          assert:
            - "the validate call returns 422 and ${mfa_error} == ERR_MFA_REQUIRED"
            - "${mfa_error} != ERR_DRIVE_CAPACITY_EXCEEDED"
            - "RestoreRequest.${rr_mfa_id}.state == REQUESTED (the failed validation does not advance the state)"

