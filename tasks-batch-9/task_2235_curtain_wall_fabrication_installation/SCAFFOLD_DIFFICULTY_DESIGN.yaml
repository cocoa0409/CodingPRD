  - name: breakage_stock_draw_boundaries_at_exact_availability_and_lot_content
    grounds:
    - calculations.glass_lite_ledger
    - validations[priority=102]
    - validations[priority=103]
    - concurrency_rules[breakage-draw-stale-glass-order]
    distinguishing_aspect: 'Two independent ceilings meet at the same number: breakage_stock_lites is floor(2400 * 0.03)
      == 72 and lot 1 contains exactly 72 lites, so a 72-lite draw sits on both boundaries and must be accepted, 73 must
      be rejected as exhausted, a 30-lite draw against a 20-lite lot must be rejected as oversized, and a 1-lite draw after
      availability reaches 0 must be rejected again.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; package qualified with an APPROVED submittal
      - 'glass order of 2400 ordered lites received in full: breakage_stock_lites floor(72.0) == 72, available_stock_lites
        72'
      - release 1 issues 36 panels for zone 1 -> lot 1 lite_count 72; release 2 issues 10 panels for zone 2 -> lot 2 lite_count
        20
      - every draw reads GlassOrder.version immediately beforehand so the OCC guard never fires
      setup_api_calls:
      - *id027
      - *id028
      - *id029
      - *id030
      - *id031
      - *id032
      - *id033
      - *id034
