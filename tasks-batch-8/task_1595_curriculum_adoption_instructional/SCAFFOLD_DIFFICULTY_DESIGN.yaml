              as: ProcurementOfficer
              captures: { enc_mid: "$.data[0].encumbered_total", avail_mid: "$.data[0].available_balance", exp_mid: "$.data[0].expended_total" }
            - call: "POST /purchase-orders/${po_id}/cancel"
              as: ProcurementOfficer
            - call: "GET /adoption-cycles/${cy_id}/budget-ledger"
              as: ProcurementOfficer
              captures: { enc_post: "$.data[0].encumbered_total", avail_post: "$.data[0].available_balance", exp_post: "$.data[0].expended_total" }
          assert:
            - "PO total_amount == 20050.00 (16000.00 print + round(4500.00 * 0.90) = 4050.00 digital)"
            - "after issue: encumbered_total == 20050.00, available_balance == 29950.00, expended_total == 0.00; invariant 50000.00 == 29950.00 + 20050.00 + 0.00"
            - "after cancel: encumbered_total == 0.00, available_balance == 50000.00 == the pre-issue value, expended_total == 0.00; PurchaseOrder.${po_id}.payment_status == RELEASED"

      - name: inventory_units_conservation
        grounds:
          - calculations.inventory_availability
          - state_machines.DistributionOrder.transitions
        distinguishing_aspect: |
          Conserved quantity is physical units: total_received_units == on_hand_units +
          in_transit_units + delivered_units across ship/receive, and the forward approve (+4
          allocated) paired with its compensating cancel leaves available_units exactly unchanged.
          Distinct conserved quantity from budget_issue_cancel_conservation (dollars).
        test_recipe:
          setup:
            - "Cycle DISTRIBUTING; InventoryLot for the adopted material at on_hand 10, allocated 0 (PO fully received, nothing allocated)"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
