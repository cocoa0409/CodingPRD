          err6: $.data.error_id
      assert:
      - err1 == ERR_FORBIDDEN_ROLE (UnitNurseManager cannot review cases)
      - err2 == ERR_FORBIDDEN_ROLE (Director cannot open cases)
      - err3 == ERR_FORBIDDEN_ROLE (IP cannot record denominators)
      - err4 == ERR_FORBIDDEN_ROLE (IP cannot accept summaries)
      - err5 == ERR_FORBIDDEN_ROLE (UnitNurseManager cannot report exposures; note the bogus employee id would 404 but role check at priority 2 fires first)
      - err6 == ERR_FORBIDDEN_ROLE (only PlatformAdmin drives the clock)
  - name: segregation_of_duty_on_summary_accept_and_cap_verify
    claim_type: segregation_of_duties
    grounds:
    - validations[priority=6.5]
    - errors[ERR_SEGREGATION_OF_DUTY]
    distinguishing_aspect: The same human (X-User-ID) may not submit AND accept a summary, nor create AND verify a CAP — even though the two operations use different roles; different-user pairs succeed.
    test_recipe:
      setup:
      - summary SUBMITTED by ip-user-1; CAP VERIFICATION_PENDING created by ip-user-1
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-SOD
          unit_type: ICU
          nhsn_location_code: ISOD
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      - call: POST /api/monthly-summaries/${sum_id}/submit
        payload: {}
        as: InfectionPreventionist
        as_user_id: ip-user-1
      - call: POST /api/corrective-action-plans
        payload:
          unit_id: ${unit_id}
          source_type: SIR_HIGH
          source_ref_id: ${sum_id}
          description: sustained high SIR review
          due_date: '2026-08-25T00:00:00Z'
        as: InfectionPreventionist
        as_user_id: ip-user-1
        captures:
          cap_id: $.data.id
      - call: POST /api/corrective-action-plans/${cap_id}/activate
        payload: {}
        as: InfectionPreventionist
        as_user_id: ip-user-1
      - call: POST /api/corrective-action-plans/${cap_id}/submit-for-verification
        payload:
          evidence_notes: line-rounding audit evidence
        as: InfectionPreventionist
        as_user_id: ip-user-1
      trigger:
      - call: POST /api/monthly-summaries/${sum_id}/accept
        payload: {}
        as: InfectionControlDirector
        as_user_id: ip-user-1
        captures:
          err1: $.data.error_id
      - call: POST /api/corrective-action-plans/${cap_id}/verify
        payload: {}
        as: InfectionControlDirector
        as_user_id: ip-user-1
        captures:
          err2: $.data.error_id
      - call: POST /api/monthly-summaries/${sum_id}/accept
        payload: {}
        as: InfectionControlDirector
        as_user_id: dir-user-2
        captures:
          ok1: $.data.status
      - call: POST /api/corrective-action-plans/${cap_id}/verify
        payload: {}
        as: InfectionControlDirector
        as_user_id: dir-user-2
        captures:
          ok2: $.data.status
      assert:
      - 'same-user accept: err1 == ERR_SEGREGATION_OF_DUTY (403)'
      - 'same-user verify: err2 == ERR_SEGREGATION_OF_DUTY (403)'
      - 'different-user accept: ok1 == ACCEPTED'
      - 'different-user verify: ok2 == VERIFIED'
- section: cross_cutting_layers
  instances:
  - name: occ_stale_version_device_day_count_and_facility
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[device-day-count-correction-stale]
    - concurrency_rules[facility-baseline-update-stale]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'Both OCC rules: a write carrying a version the client read before an intervening accepted write is rejected 412; the correct current version succeeds; each accepted write increments
      version by exactly 1.'
    test_recipe:
      setup:
      - facility (v1) + unit + device-day row (v1)
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
          fac_v1: $.data.version
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-OCC
          unit_type: ICU
          nhsn_location_code: IOCC
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-01T00:00:00Z'
          central_line_days: 20
          urinary_catheter_days: 10
          ventilator_days: 5
          patient_days: 40
        as: UnitNurseManager
        captures:
          dd_id: $.data.id
          dd_v1: $.data.version
      trigger:
      - call: PUT /api/device-day-counts/${dd_id}
        payload:
          central_line_days: 22
          urinary_catheter_days: 10
          ventilator_days: 5
          patient_days: 40
          expected_device_day_count_version: ${dd_v1}
        as: UnitNurseManager
        captures:
          dd_v2: $.data.version
      - call: PUT /api/device-day-counts/${dd_id}
        payload:
          central_line_days: 23
          urinary_catheter_days: 10
          ventilator_days: 5
          patient_days: 40
          expected_device_day_count_version: ${dd_v1}
        as: UnitNurseManager
        captures:
          err1: $.data.error_id
      - call: PUT /api/facilities/${fac_id}
        payload:
          sir_high_threshold: 1.5
          expected_facility_version: ${fac_v1}
        as: PlatformAdmin
        captures:
          fac_v2: $.data.version
      - call: PUT /api/facilities/${fac_id}
        payload:
          sir_high_threshold: 2.0
          expected_facility_version: ${fac_v1}
        as: PlatformAdmin
        captures:
          err2: $.data.error_id
      - call: PUT /api/facilities/${fac_id}
        payload:
          sir_high_threshold: 2.0
          expected_facility_version: ${fac_v2}
        as: PlatformAdmin
        captures:
          fac_v3: $.data.version
      assert:
      - 'first count PUT: dd_v2 == ${dd_v1} + 1'
      - 'stale count PUT (replaying ${dd_v1}): err1 == ERR_STALE_VERSION, HTTP 412; row unchanged (central_line_days still 22)'
      - 'first facility PUT: fac_v2 == ${fac_v1} + 1'
      - 'stale facility PUT: err2 == ERR_STALE_VERSION, HTTP 412'
      - 'current-version facility PUT succeeds: fac_v3 == ${fac_v2} + 1 and sir_high_threshold == 2.0'
  - name: derived_field_reconciliation_on_summary_recompute
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.predicted_infections_and_sir
    - entities.MonthlySummary.fields.central_line_days
    excluded_because:
      difficulty_instance: device_day_correction_pair_conserves_denominator_total
      rationale: Summary recompute after create/update of denominator rows is asserted there (20 -> 25 -> 20 with literal reads after each write).
