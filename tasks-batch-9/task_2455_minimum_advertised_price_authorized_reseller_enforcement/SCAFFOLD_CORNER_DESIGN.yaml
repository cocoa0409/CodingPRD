              payload: { reseller_id: "${res}", violation_id: "${vio3}", delivery_channel: "EMAIL", rung: "TERMINATION", suspension_starts_at: "2026-09-23T00:00:00Z", suspension_ends_at: "2026-09-30T00:00:00Z", expected_reseller_version: "${rv3}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_SUSPENSION_COOLING_OFF'"
            - "Reseller.${res}.last_suspension_ended_at == '2026-09-10T00:00:00Z'"
            - "Reseller.${res}.authorization_status == AUTHORIZED"

      - name: cure_submitted_after_the_deadline_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "cure_window_days 10 from a 2026-08-20 issuance sets cure_deadline_at 2026-08-30, so a submission at clock 2026-08-31 is ERR_CURE_WINDOW_EXPIRED and the violation stays NOTICED for the sweep to escalate."
        test_recipe:
          setup: ["Violation V1 NOTICED at clock 2026-08-20 with cure_deadline_at 2026-08-30; clock advanced to 2026-08-31."]
          setup_api_calls:
