          assert:
            - "Both calls return HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "ShootDay.${day1}.call_sheet_status is still DRAFT and status is still PLANNED"
            - "ComplianceCert.${permit}.status is still SUBMITTED with decided_at null"
            - "Both roles can still read: GET /shoot-days/${day1} succeeds for either of them"

      - name: crew_member_cannot_read_another_members_bookings_returns_4xx
        claim_type: peer_roles
        grounds:
          - roles.CrewMember
          - validations[priority=3]
          - errors[ERR_CREW_SCOPE_FORBIDDEN]
        distinguishing_aspect: "The one entity-backed role is scoped to its own rows: a crew member filtering the booking list by a colleague's crew_member_id, or omitting the filter entirely, gets 403 ERR_CREW_SCOPE_FORBIDDEN, while the same list filtered to its own id succeeds."
        test_recipe:
          setup:
            - "A SCOPED project with one PLANNED shoot day and two HELD bookings, one for crew member A and one for crew member B"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Ilbert Cheese", campaign_title: "Own Rows", creative_brief_summary: "Brand film exercising crew-scoped reads.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Own Rows 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "PRODUCTION_CREW", description: "Core unit", quantity: 1, unit_rate_cents: 2000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /locations"
              payload: { name: "Ilbert Creamery", address: "11 Curd Lane, Waterloo", stage_count: 1, daily_fee_cents: 90000, insurance_minimum_cents: 50000000, permit_authority: "Waterloo Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day1: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Anke Rios", department: "CAMERA", hourly_rate_cents: 5000, min_turnaround_hours: 10 }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { crew_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Bo Halvorsen", department: "SOUND", hourly_rate_cents: 5000, min_turnaround_hours: 10 }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { crew_b: $.data.id }
            - call: "POST /crew-bookings"
              payload: { shoot_day_id: "${day1}", crew_member_id: "${crew_a}", department_role: "Operator", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { bk_a: $.data.id }
            - call: "POST /crew-bookings"
              payload: { shoot_day_id: "${day1}", crew_member_id: "${crew_b}", department_role: "Mixer", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { bk_b: $.data.id }
          trigger:
            - call: "GET /crew-bookings"
              payload: { crew_member_id: "${crew_b}", limit: 10, offset: 0 }
