    side_effects: ["increments Matter.version by 1"]
  - method: POST
    path: "/legal-ops/matters/{id}/close"
    description: "ACTIVE/REOPENED -> CLOSED (OCC on Matter.version)"
    roles: [LegalOpsAnalyst]
    code: 200
    input: [expected_matter_version]
