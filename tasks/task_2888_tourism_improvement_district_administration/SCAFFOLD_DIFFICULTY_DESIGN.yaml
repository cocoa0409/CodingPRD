# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2888 — Tourism Improvement District Administration
#
# 22 instances across the nine §0.5 Difficulty Rules (minimum 2 each).
# Every literal in an `assert:` line was computed by executing the relevant
# §1.3 formula against its `constants:` in Python; none are estimates.
#
# Canonical fixture used by most chains (anchored below and aliased thereafter):
#   District "Harbor Bay Tourism Improvement District"
#     assessment_method PCT_OF_ROOM_REVENUE, included_zones [ZONE_CORE, ZONE_PERIMETER]
#     formation 0.6000 / renewal 0.6500 / renewal headcount 0.7500, term_years 1
#     formed_on 2026-08-01 -> expiration_date 2027-08-01, renewal window opens 2027-02-02
#   Roll (prior-year room revenue sums to exactly 100,000,000 cents):
#     b1 Harbor Grand Hotel     ZONE_CORE      FULL_SERVICE       200 rooms  60,000,000
#     b2 Bayside Inn            ZONE_CORE      LIMITED_SERVICE    120 rooms  20,000,000
#     b3 Lighthouse Boutique    ZONE_PERIMETER BOUTIQUE            60 rooms  15,000,000
#     b4 Cove Cottages          ZONE_PERIMETER SHORT_TERM_RENTAL   40 rooms   5,000,000
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: assessment_provisional_and_final_diverge_after_mid_period_reclassification
        grounds:
          - calculations.assessment_amount
          - entities.AssessmentStatement.fields.provisional_assessment_cents
          - entities.AssessmentStatement.fields.final_assessment_cents
          - entities.AssessmentStatement.fields.classification_at_period_start
          - state_machines.AssessmentStatement.FILED_to_AUDITED
        distinguishing_aspect: |
          The PROVISIONAL variant reads the lodging business's classification live at filing time
          while the FINAL variant reads classification_at_period_start off the statement snapshot, so
          a reclassification recorded between statement generation and filing makes the two variants
          return 742050 and 824500 from byte-identical reported figures.
        test_recipe:
          setup:
            - "district ACTIVE with the canonical four-property roll"
            - "assessment period FY2027-Q1 open, statements generated so b1's statement snapshots ZONE_CORE + FULL_SERVICE + PCT_OF_ROOM_REVENUE"
            - "b1 reclassified FULL_SERVICE -> BOUTIQUE after generation but before filing"
            - "logical clock at 2026-08-01T00:00:00Z, well inside the filing window"
          setup_api_calls:
            - &k_clock_form
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_district
              call: "POST /districts"
              payload: { name: "Harbor Bay Tourism Improvement District", assessment_method: "PCT_OF_ROOM_REVENUE", included_zones: ["ZONE_CORE", "ZONE_PERIMETER"], formation_threshold_pct: 0.6000, renewal_threshold_pct: 0.6500, renewal_headcount_threshold_pct: 0.7500, term_years: 1, current_fiscal_year: 2027 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { d_id: "$.data.id" }
            - &k_b1
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Harbor Grand Hotel", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 200, prior_year_gross_room_revenue_cents: 60000000, operator_contact_email: "ops@harborgrand.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b1_id: "$.data.id" }
            - &k_b2
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Bayside Inn", boundary_zone: "ZONE_CORE", classification: "LIMITED_SERVICE", room_count: 120, prior_year_gross_room_revenue_cents: 20000000, operator_contact_email: "ops@baysideinn.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b2_id: "$.data.id" }
            - &k_b3
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Lighthouse Boutique", boundary_zone: "ZONE_PERIMETER", classification: "BOUTIQUE", room_count: 60, prior_year_gross_room_revenue_cents: 15000000, operator_contact_email: "ops@lighthouse.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b3_id: "$.data.id" }
            - &k_b4
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Cove Cottages", boundary_zone: "ZONE_PERIMETER", classification: "SHORT_TERM_RENTAL", room_count: 40, prior_year_gross_room_revenue_cents: 5000000, operator_contact_email: "ops@covecottages.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b4_id: "$.data.id" }
            - &k_formation_drive
              call: "POST /petition-drives"
              payload: { district_id: "${d_id}", drive_type: "FORMATION", closes_at: "2026-09-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pd_id: "$.data.id" }
            - &k_sign_b1
              call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { sig_b1_id: "$.data.id" }
            - &k_tally_formation
              call: "POST /petition-drives/${pd_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_certify_formation
              call: "POST /petition-drives/${pd_id}/certification"
              payload: { certified_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_activate
              call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "ACTIVE", effective_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_period_q1
              call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-Q1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_date: "2026-11-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { ap_id: "$.data.id" }
            - &k_generate_q1
              call: "POST /assessment-periods/${ap_id}/statement-generation"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { gen_count: "$.data.generated_count" }
            - &k_find_st_b1
              call: "GET /assessment-periods/${ap_id}/statements"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st1_id: "$.data[0].id" }
            - call: "POST /lodging-businesses/${b1_id}/revisions"
              payload: { classification: "BOUTIQUE" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /assessment-statements/${st1_id}/filings"
              payload: { reported_room_nights: 2000, reported_gross_room_revenue_cents: 41225000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { st1_v_after_filing: "$.data.version" }
            - &k_clock_period_end
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-16T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_close_q1
              call: "POST /assessment-periods/${ap_id}/closure"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audited_room_nights: 2000, audited_gross_room_revenue_cents: 41225000, audit_note: "figures agree with the operator's ledger" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
          assert:
            - "AssessmentStatement.${st1_id}.zone_at_period_start == ZONE_CORE"
            - "AssessmentStatement.${st1_id}.classification_at_period_start == FULL_SERVICE"
            - "LodgingBusiness.${b1_id}.classification == BOUTIQUE"
            - "AssessmentStatement.${st1_id}.provisional_assessment_cents == 742050"
            - "AssessmentStatement.${st1_id}.final_assessment_cents == 824500"
            - "AssessmentStatement.${st1_id}.final_assessment_cents - AssessmentStatement.${st1_id}.provisional_assessment_cents == 82450"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents == 824500"
            - "AssessmentStatement.${st1_id}.total_due_cents == 824500"
            - "AssessmentStatement.${st1_id}.filing_status == AUDITED"

      - name: petition_revenue_weighted_passes_while_headcount_variant_fails_renewal
        grounds:
          - calculations.petition_support
          - entities.PetitionDrive.fields.weighted_support_pct
          - entities.PetitionDrive.fields.headcount_support_pct
          - entities.PetitionDrive.fields.short_reason
          - state_machines.PetitionDrive.OPEN_to_SHORT_OF_THRESHOLD
        distinguishing_aspect: |
          On one identical signature set the REVENUE_WEIGHTED variant returns 0.6500 and clears the
          0.6500 renewal threshold, while the HEADCOUNT variant returns 0.5000 and misses the 0.7500
          headcount threshold, so the renewal drive fails on the second variant alone and short_reason
          is HEADCOUNT_BELOW_MINIMUM rather than WEIGHTED_BELOW_THRESHOLD.
        test_recipe:
          setup:
            - "district ACTIVE with term_years 1, so expiration_date is 2027-08-01 and the renewal window opens 2027-02-02"
            - "canonical four-property roll, prior-year revenue 60,000,000 / 20,000,000 / 15,000,000 / 5,000,000"
            - "logical clock at 2027-03-01T00:00:00Z, inside the renewal window"
            - "RENEWAL drive open with two signatures: b1 (60,000,000) and b4 (5,000,000) — 65,000,000 of 100,000,000, 2 of 4 businesses"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - &k_clock_renewal
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_renewal_drive
              call: "POST /petition-drives"
              payload: { district_id: "${d_id}", drive_type: "RENEWAL", closes_at: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { rd_id: "$.data.id" }
            - call: "POST /petition-drives/${rd_id}/signatures"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives/${rd_id}/signatures"
              payload: { lodging_business_id: "${b4_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /petition-drives/${rd_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "PetitionDrive.${rd_id}.assessable_basis_snapshot_cents == 100000000"
            - "PetitionDrive.${rd_id}.assessable_count_snapshot == 4"
            - "PetitionDrive.${rd_id}.signed_basis_cents == 65000000"
            - "PetitionDrive.${rd_id}.valid_signature_count == 2"
            - "PetitionDrive.${rd_id}.required_weighted_pct == 0.6500"
            - "PetitionDrive.${rd_id}.required_headcount_pct == 0.7500"
            - "PetitionDrive.${rd_id}.weighted_support_pct == 0.6500"
            - "PetitionDrive.${rd_id}.headcount_support_pct == 0.5000"
            - "PetitionDrive.${rd_id}.status == SHORT_OF_THRESHOLD"
            - "PetitionDrive.${rd_id}.short_reason == HEADCOUNT_BELOW_MINIMUM"
            - "District.${d_id}.status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:

      - name: assessment_zone_class_floor_and_cap_nest_in_pinned_order
        grounds:
          - calculations.assessment_amount
          - entities.District.fields.assessment_method
          - entities.LodgingBusiness.fields.boundary_zone
          - entities.LodgingBusiness.fields.classification
          - entities.AssessmentStatement.fields.provisional_assessment_cents
        distinguishing_aspect: |
          One formula composes four interacting factors — a zone rate, a classification multiplier, a
          per-night floor and a period cap — and the floor is applied before the cap, so a statement
          whose floor of 2,700,000 sits above the 2,500,000 cap still lands on 2,500,000 rather than
          escaping the cap; four statements in the same period exercise revenue-binding, floor-binding,
          cap-binding and floor-above-cap simultaneously.
        test_recipe:
          setup:
            - "district ACTIVE with assessment_method PCT_OF_ROOM_REVENUE and the canonical four-property roll"
            - "assessment period FY2027-Q1 open with statements generated for all four properties"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - &k_find_st_b2
              call: "GET /assessment-periods/${ap_id}/statements"
              payload: { lodging_business_id: "${b2_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st2_id: "$.data[0].id" }
            - &k_find_st_b3
              call: "GET /assessment-periods/${ap_id}/statements"
              payload: { lodging_business_id: "${b3_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st3_id: "$.data[0].id" }
            - &k_find_st_b4
              call: "GET /assessment-periods/${ap_id}/statements"
              payload: { lodging_business_id: "${b4_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st4_id: "$.data[0].id" }
          trigger:
            - call: "POST /assessment-statements/${st3_id}/filings"
              payload: { reported_room_nights: 900, reported_gross_room_revenue_cents: 30000000 }
              as: LodgingOperator
              as_user_id: "${b3_id}"
            - call: "POST /assessment-statements/${st4_id}/filings"
              payload: { reported_room_nights: 3000, reported_gross_room_revenue_cents: 1000000 }
              as: LodgingOperator
              as_user_id: "${b4_id}"
            - call: "POST /assessment-statements/${st2_id}/filings"
              payload: { reported_room_nights: 600, reported_gross_room_revenue_cents: 200000000 }
              as: LodgingOperator
              as_user_id: "${b2_id}"
            - call: "POST /assessment-statements/${st1_id}/filings"
              payload: { reported_room_nights: 18000, reported_gross_room_revenue_cents: 1000000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
          assert:
            - "AssessmentStatement.${st3_id}.provisional_assessment_cents == 337500"
            - "AssessmentStatement.${st4_id}.provisional_assessment_cents == 450000"
            - "AssessmentStatement.${st2_id}.provisional_assessment_cents == 2500000"
            - "AssessmentStatement.${st1_id}.provisional_assessment_cents == 2500000"
            - "AssessmentStatement.${st4_id}.provisional_assessment_cents == 450000 because the 3000-night floor of 450000 beats the 14375 revenue component"
            - "AssessmentStatement.${st1_id}.provisional_assessment_cents == 2500000 and NOT 2700000, proving the cap is applied after the floor"
            - "AssessmentPeriod.${ap_id}.statement_count == 4"

      - name: program_performance_efficiency_tier_fixed_on_gross_cost_before_dmo_share
        grounds:
          - calculations.program_performance
          - entities.MarketingProgram.fields.efficiency_tier
          - entities.MarketingProgram.fields.dmo_cost_share_cents
          - entities.MarketingProgram.fields.performance_index
          - state_machines.MarketingProgram.RUNNING_to_CLOSED
        distinguishing_aspect: |
          The efficiency tier, the DMO cost share and the published index form a circular-looking
          dependency that the pinned two-pass order breaks: tier comes from gross cost per room night
          of 3100 (TIER_MARGINAL, share 0.10), giving index 0.8961 and BELOW_BENCHMARK, whereas
          re-tiering on the net figure of 2790 would select TIER_STANDARD, share 0.25 and publish
          MEETS_BENCHMARK instead.
        test_recipe:
          setup:
            - "district ACTIVE with an EXECUTED DMO agreement and a lodging tax match pool of 400,000"
            - "b1 and b2 statements filed at 824,500 and 340,000 so the fiscal-2027 forecast is 1,164,500 against a 1,000,000 budget (funding_ratio 1.1645)"
            - "annual work plan for fiscal year 2027 approved: SALES_AND_MARKETING 650,000, ADMINISTRATION 150,000, CONTINGENCY_RESERVE 100,000, DESTINATION_EVENTS 100,000"
            - "marketing program committed at 62,000 with booking window [2026-09-01, 2026-12-01), launched and running"
            - "three verified room-night claims of 7, 7 and 6 nights on disjoint stays, 20 verified nights in total"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_find_st_b2
            - &k_file_st1_824500
              call: "POST /assessment-statements/${st1_id}/filings"
              payload: { reported_room_nights: 2000, reported_gross_room_revenue_cents: 41225000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { st1_v: "$.data.version" }
            - &k_file_st2_340000
              call: "POST /assessment-statements/${st2_id}/filings"
              payload: { reported_room_nights: 600, reported_gross_room_revenue_cents: 20000000 }
              as: LodgingOperator
              as_user_id: "${b2_id}"
            - &k_plan_fy2027
              call: "POST /annual-work-plans"
              payload: { district_id: "${d_id}", fiscal_year: 2027, expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 650000, narrative: "paid search, trade shows and group sales" }, { category: "ADMINISTRATION", amount_cents: 150000, narrative: "district staff and audit fees" }, { category: "CONTINGENCY_RESERVE", amount_cents: 100000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 100000, narrative: "harbour festival sponsorship" }] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp_id: "$.data.id" }
            - &k_sponsor_plan
              call: "POST /annual-work-plans/${wp_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored for board review" }
              as: BoardMember
              as_user_id: "board-member-01"
            - &k_approve_plan
              call: "POST /annual-work-plans/${wp_id}/board-actions"
              payload: { action: "APPROVE", note: "adopted at the August board meeting" }
              as: BoardMember
              as_user_id: "board-member-02"
              captures: { wp_v_approved: "$.data.version" }
            - &k_dmo_executed
              call: "POST /districts/${d_id}/dmo-coordination"
              payload: { dmo_name: "Visit Harbor Bay", dmo_agreement_status: "EXECUTED", dmo_contract_cents: 200000, lodging_tax_match_pool_cents: 400000, public_lodging_tax_offset_cents: 0 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_program_62000
              call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "Autumn Group Sales Push", channel: "GROUP_SALES", committed_cents: 62000, lodging_tax_matched_cents: 0, booking_window_start: "2026-09-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
              captures: { mp_id: "$.data.id" }
            - &k_clock_launch
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &k_launch_program
              call: "POST /marketing-programs/${mp_id}/launch"
              payload: { launch_note: "campaign live" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - &k_clock_claims
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-25T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b1_id}", stay_start: "2026-09-01T00:00:00Z", stay_end: "2026-09-08T00:00:00Z", room_nights: 7, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { cl1_id: "$.data.id" }
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b2_id}", stay_start: "2026-09-08T00:00:00Z", stay_end: "2026-09-15T00:00:00Z", room_nights: 7, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
              captures: { cl2_id: "$.data.id" }
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b3_id}", stay_start: "2026-09-15T00:00:00Z", stay_end: "2026-09-21T00:00:00Z", room_nights: 6, attribution_method: "DIRECT_PICKUP" }
              as: LodgingOperator
              as_user_id: "${b3_id}"
              captures: { cl3_id: "$.data.id" }
            - call: "POST /room-night-claims/${cl1_id}/verification"
              payload: { decision: "ALLOW", verified_room_nights: 7 }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /room-night-claims/${cl2_id}/verification"
              payload: { decision: "ALLOW", verified_room_nights: 7 }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /room-night-claims/${cl3_id}/verification"
              payload: { decision: "ALLOW", verified_room_nights: 6 }
              as: DmoLiaison
              as_user_id: "dmo-01"
          trigger:
            - call: "POST /marketing-programs/${mp_id}/closure"
              payload: { closure_note: "campaign concluded" }
              as: DmoLiaison
              as_user_id: "dmo-01"
          assert:
            - "MarketingProgram.${mp_id}.verified_room_nights == 20"
            - "MarketingProgram.${mp_id}.gross_cost_per_room_night_cents == 3100"
            - "MarketingProgram.${mp_id}.efficiency_tier == TIER_MARGINAL"
            - "MarketingProgram.${mp_id}.dmo_cost_share_cents == 6200"
            - "MarketingProgram.${mp_id}.net_district_cost_cents == 55800"
            - "MarketingProgram.${mp_id}.net_cost_per_room_night_cents == 2790"
            - "MarketingProgram.${mp_id}.performance_index == 0.8961"
            - "MarketingProgram.${mp_id}.performance_flag == BELOW_BENCHMARK"
            - "MarketingProgram.${mp_id}.status == CLOSED"
