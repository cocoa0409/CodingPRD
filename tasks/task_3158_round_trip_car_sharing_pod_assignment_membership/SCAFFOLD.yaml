    side_effects: []
  - method: GET
    path: "/car-share/reservations/{id}/access-events"
    description: "Reverse-reachability list: every access event for this reservation."
    roles: [Member, PodOperator]
    code: 200
    input: []
    output: AccessEvent[]
    side_effects: []
  - method: GET
    path: "/car-share/vehicles/{id}/access-events"
    description: "Reverse-reachability list: every access event for this vehicle."
    roles: [Member, PodOperator]
    code: 200
    input: []
    output: AccessEvent[]
    side_effects: []
  - method: GET
    path: "/car-share/access-events/{id}"
