  - rule_id: transitive_cascade
    instances:
      - name: unplanned_readmission_five_hop_cascade
        grounds:
          - state_machines.CareEpisode.SERVICE_PERIOD_CLOSED_to_CLOSED_READMITTED
          - state_machines.TcmClaim.SUBMITTED_to_VOIDED
          - state_machines.CareEpisode.OPEN_to_FROZEN
          - state_machines.HandoffRequest.PROPOSED_to_SUPERSEDED
          - state_machines.RedFlag.RAISED_to_CLOSED_ADMINISTRATIVE
          - state_machines.Barrier.OPEN_to_CLOSED_ADMINISTRATIVE
          - calculations.readmission_window_and_effect
        distinguishing_aspect: |
          A depth-5 chain from a single trigger where every hop is caused by the
          previous hop, not by the original call - recording the
          ReadmissionEvent (A) drives CareEpisode to CLOSED_READMITTED (B),
          that status change voids the SUBMITTED TcmClaim (C), the claim
          reaching a terminal status satisfies the freeze predicate and flips
          record_posture to FROZEN (D), and the freeze supersedes the PROPOSED
          handoff and administratively closes the open barrier and red flag (E).
        test_recipe:
          setup:
            - "A HIGH-tier episode discharged 2026-05-01 with successful timely contact, COMPLETED reconciliation and a visit completed and attested 2026-05-05."
            - "Service period closed at 2026-05-31T01:00:00Z; a claim prepared by bill-prep-1 and SUBMITTED by bill-sub-1."
            - "One OPEN TRANSPORTATION barrier, one RAISED TIER_3 red flag and one PROPOSED handoff to a second navigator all exist on the episode; record_posture is still OPEN because the claim is non-terminal."
