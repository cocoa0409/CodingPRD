            - "WashOrder.${ox_id}.status remains SCHEDULED; Route.${r3_id}.assigned_vehicle_count == 0"

  - rule_id: boundary_precision_check
    instances:
      - name: freeze_threshold_exactly_32_degrees
        grounds:
          - calculations.weather_policy_evaluation
          - "endpoints: POST /fleet-wash/weather/evaluations"
        distinguishing_aspect: |
          Metric temperature on the weather endpoint: forecast_low_f == 32 freezes
          (<=), while 33 on a second date leaves that date's published route untouched.
        test_recipe:
          setup:
            - "RETAIL customer; site; 1 SEDAN; order A CONFIRMED window 2026-08-20; route RA PUBLISHED 2026-08-20 with A's stop"
            - "Order B CONFIRMED window 2026-08-21; route RB PUBLISHED 2026-08-21 with B's stop (second van, second tech)"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail F", email: "rf@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
