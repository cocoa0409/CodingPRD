  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: allocate_on_partially_allocated_order_gated_by_customer_credit_status
        grounds:
          - validations[priority=26]
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
          - entities.Customer.fields.credit_status
          - state_machines.SalesOrder.PENDING_ALLOCATION_to_PARTIALLY_ALLOCATED
          - endpoints["POST /customers/{customerId}/credit-adjustments"]
        distinguishing_aspect: |
          Entity pair SALESORDER -> CUSTOMER: the order's own state
          (PARTIALLY_ALLOCATED) admits allocation, and the transition is blocked
          purely by the state of a different entity, Customer.credit_status ==
          CREDIT_HOLD, yielding ERR_CUSTOMER_CREDIT_HOLD (402).
        test_recipe:
          setup:
            - "One branch, one customer with a 100000-cent limit, product P1, index CI1, and a single short 200 ft P1 reel."
            - "A single CUT line of 300 ft is quoted, issued, converted and allocated; only 200 ft is available so the order lands in PARTIALLY_ALLOCATED."
            - "A credit adjustment of +150000 cents to the open balance drives available_credit_cents to -50000 and the customer to CREDIT_HOLD. The order is PARTIALLY_ALLOCATED, so it keeps its reservations and is NOT moved to HELD."
