          One review call produces a three-link chain in which each link exists
          ONLY because of the previous one: the NONCOMPLIANCE finding moves the
          Project compliance axis RESTRICTED -> NONCOMPLIANT (link 1); that
          project transition - not the report - moves CreditAllocation ISSUED ->
          RECAPTURE_PENDING and stamps recapture_amount_cents 559,647 (link 2);
