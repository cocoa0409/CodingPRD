        grounds:
          - state_machines.RateCard.REJECTED_to_DRAFT
          - state_machines.RateCard.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          RateCard entity exhibits a cycle DRAFT → SUBMITTED → REJECTED → DRAFT;
          after the revert the card is again submittable, demonstrating the loop
          is functional rather than a dead-end.
        test_recipe:
          setup:
            - "Firm with one QUALIFIED timekeeper; a DRAFT 2026 card submitted then rejected"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "Loop Dept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
