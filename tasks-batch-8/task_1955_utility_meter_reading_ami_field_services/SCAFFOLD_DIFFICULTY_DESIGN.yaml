            - { call: "POST /meters", payload: { serial_number: "SN-X-1", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { m1: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-X-2", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { m2: $.data.id } }
            - { call: "POST /meters/${m1}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-02T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-03T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-04T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-17T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-18T00:00:00Z" }, as: MeterOpsAdmin, captures: { snap5: $.data.id } }
