            - "GET /providers/${prov_w} returns data.booked_minutes_on_focus_date == 30"

      - name: sm_patient_deactivated_state_rejects_new_screening
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Patient.transitions.REGISTERED_to_DEACTIVATED, "endpoints.DELETE /patients/{id}", errors.ERR_INVALID_STATE]
        distinguishing_aspect: "DEACTIVATED is a sink with no outbound edges, so a screening create must fail with ERR_INVALID_STATE -- not ERR_ALREADY_TERMINAL, whose catalogued trigger list covers reimbursement claims, trials, warranty claims, campaigns and rollouts but not patients."
