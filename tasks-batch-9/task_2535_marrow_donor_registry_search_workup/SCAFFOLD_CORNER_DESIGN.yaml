            - call: "POST /registry/typing-requests/${ct_d5}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d5_ct_status: "$.data.status", d5_ct_responded: "$.data.responded_at", d5_ct_grade: "$.data.reported_match_grade" }
