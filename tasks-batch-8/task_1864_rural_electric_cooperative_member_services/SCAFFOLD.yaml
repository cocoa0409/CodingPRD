# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or entity-backed Member acting on a resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required input field missing or malformed" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_cooperative_version does not match current Cooperative.version" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Same X-User-ID attempted both the propose and approve steps of a segregation-of-duties workflow" }
  - { id: ERR_ALLOCATION_POOL_MISMATCH, http: 409, condition: "Allocation total_allocated_cents does not equal Cooperative.capital_credits_pool_cents at approval" }
  - { id: ERR_RETIREMENT_METHOD_NOT_ALLOWED, http: 409, condition: "Retirement method not in Cooperative.retirement_methods_allowed" }
  - { id: ERR_RETIREMENT_BUDGET_EXCEEDED, http: 409, condition: "total_retire_cents exceeds sum of member capital_credit_balance_cents" }
  - { id: ERR_PAYOUT_STALE, http: 409, condition: "Attempt to cash a payout at or after its claim_deadline" }
  - { id: ERR_MEMBER_PROVISIONAL_INVOICE, http: 409, condition: "Member suspend blocked: an invoice is still PROVISIONAL" }
  - { id: ERR_MEMBER_PAST_DUE, http: 409, condition: "Member reinstate blocked: FINALIZED invoices unpaid" }
  - { id: ERR_MEMBER_UNPAID_FINAL, http: 409, condition: "Member terminate blocked: FINALIZED invoice unpaid" }
  - { id: ERR_RATE_OVERLAP, http: 409, condition: "A PUBLISHED schedule for the same rate_class has an overlapping effectiveness window" }
  - { id: ERR_READING_MISSING, http: 409, condition: "Invoice finalize blocked: no MeterReading at or after billing_period_end" }
  - { id: ERR_WRITE_OFF_TOO_EARLY, http: 409, condition: "Write-off blocked: billing_period_end not yet 180 days in the past" }
  - { id: ERR_LMD_RATE_CLASS_MISMATCH, http: 409, condition: "IRRIGATION_INTERRUPTIBLE device on a non-IRRIGATION service location" }
  - { id: ERR_ROW_NOT_RECORDED, http: 409, condition: "Right-of-way agreement not in RECORDED (or CONDEMNATION for scheduling) status" }
  - { id: ERR_SERVICE_NOT_CONSTRUCTED, http: 409, condition: "Service location energize blocked: no ServiceOrder in CONSTRUCTED status" }
  - { id: ERR_ATC_ZERO_NOT_INVOICABLE, http: 409, condition: "Cannot invoice aid-to-construction of zero; use mark-paid directly" }
  - { id: ERR_PARENT_OUTAGE_TERMINAL, http: 409, condition: "mark-duplicate references a parent outage already in a terminal state" }
  - { id: ERR_ELECTION_WINDOW, http: 409, condition: "Logical clock outside the required election window" }
  - { id: ERR_ELECTION_NO_CANDIDATE, http: 409, condition: "close-nominations blocked: a contested seat has no declared candidate" }
  - { id: ERR_ELECTION_NO_QUORUM, http: 409, condition: "certify blocked: quorum not met" }
  - { id: ERR_BALLOT_ALREADY_CAST, http: 409, condition: "A ballot for this (election_id, member_id, district) already exists" }
  - { id: ERR_BALLOT_DISTRICT_MISMATCH, http: 409, condition: "Non-proxy ballot cast for a district other than the member's district_id" }
  - { id: ERR_BALLOT_MEMBER_INACTIVE, http: 409, condition: "Ballot cast by a member not in ACTIVE status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Bootstrap/operator role for co-op config and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /coop/cooperatives"
      - "POST /coop/_clock/set_current_utc"
    shared_operations:
      - "GET /coop/cooperatives/{id}"

  - name: MemberServicesRep
    description: "Co-op front-office staff: membership, capital credits, service orders, ATC invoicing"
    identity: opaque
    exclusive_operations:
      - "POST /coop/members and member lifecycle transitions"
      - "POST /coop/service-locations"
      - "POST /coop/capital-credit-allocations + post/void"
      - "POST /coop/capital-credit-retirements + execute/abort"
      - "POST /coop/capital-credit-payouts cash / mark-unclaimed"
      - "POST /coop/service-orders + invoice-atc / mark-paid"
      - "POST /coop/cooperatives/{id}/post-margin"
    shared_operations:
      - "GET endpoints for members, locations, invoices, elections, outages, devices, service orders, ROW"

  - name: BoardDirector
    description: "Elected board member approving allocations and retirements"
    identity: opaque
    exclusive_operations:
      - "POST /coop/capital-credit-allocations/{id}/approve"
      - "POST /coop/capital-credit-retirements/{id}/board-approve"
    shared_operations:
      - "GET capital-credit and member resources"

  - name: BoardSecretary
    description: "Corporate secretary administering elections and the annual meeting"
    identity: opaque
    exclusive_operations:
      - "POST /coop/board-elections and all election transitions"
      - "GET /coop/ballots"
    shared_operations:
      - "GET /coop/cooperatives/{id}"

  - name: RateAnalyst
    description: "Rate design staff owning rate schedules"
    identity: opaque
    exclusive_operations:
      - "POST /coop/rate-schedules + publish/supersede"
    shared_operations: []

  - name: BillingClerk
    description: "Billing staff: meter readings, invoices, payments, write-offs"
    identity: opaque
    exclusive_operations:
      - "POST /coop/meter-readings"
      - "POST /coop/invoices + finalize/pay/write-off/void"
    shared_operations:
      - "GET member/location/invoice resources"

  - name: FieldOpsCoordinator
    description: "Field operations: energize/disconnect, service order construction, devices, ROW recording, outage restore"
    identity: opaque
    exclusive_operations:
      - "POST /coop/service-locations energize/disconnect/remove"
      - "POST /coop/service-orders estimate/schedule/construct/cancel"
      - "POST /coop/right-of-way-agreements record/release"
      - "POST /coop/load-management-devices activate/suspend/reactivate"
      - "POST /coop/outage-reports/{id}/restore"
    shared_operations:
      - "GET location/service-order/outage/ROW/device resources"
      - "POST /coop/meter-readings"

  - name: Dispatcher
    description: "Outage dispatcher: acknowledge, dispatch, duplicate-fold, cancel"
    identity: opaque
    exclusive_operations:
      - "POST /coop/outage-reports acknowledge/dispatch/mark-duplicate/cancel"
    shared_operations:
      - "POST /coop/outage-reports"
      - "GET outage and location resources"

  - name: LegalCounsel
    description: "Legal: easement condemnation"
    identity: opaque
    exclusive_operations:
      - "POST /coop/right-of-way-agreements/{id}/condemn"
    shared_operations:
      - "GET ROW resources"

  - name: Member
    description: "A cooperative member acting on their own account (X-User-ID == Member.id)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /coop/right-of-way-agreements/{id}/consent and contest on own location"
      - "POST /coop/load-management-devices/{id}/unenroll on own device"
      - "POST /coop/ballots"
    shared_operations:
      - "GET own member record, own locations, invoices, payouts, outages"
      - "POST /coop/outage-reports and load-management-devices for own location"
