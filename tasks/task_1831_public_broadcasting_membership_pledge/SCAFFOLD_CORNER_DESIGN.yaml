              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 6000 }
