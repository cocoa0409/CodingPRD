  - section: consistency_model
    instances:
      - name: finalize_assessment_gap_visible_immediately
        claim_type: immediate_consistency
        grounds: [state_machines.Assessment.DRAFT_to_FINALIZED, endpoints]
        distinguishing_aspect: "Immediate consistency: the auto-created gap from a failing finalize is visible in the very next GET (no async reconciliation), and superseded plans/BIAs reflect their new state in the same response chain."
        test_recipe:
          setup:
            - "Contacts C1 (owner), C2 (manager); process P ACTIVE with APPROVED BIA rto 8/rpo 2; vendor V ACTIVE (owner C1); DRAFT assessment assessed_rto 12 (misses 8)"
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Victor Owner", email: "vown@x.com", role_title: "Vendor Owner" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/contacts"
              payload: { full_name: "Manny Manager", email: "mmgr@x.com", role_title: "Vendor Manager" }
              as: ResilienceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "ImmProc", business_unit: "Ops", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
