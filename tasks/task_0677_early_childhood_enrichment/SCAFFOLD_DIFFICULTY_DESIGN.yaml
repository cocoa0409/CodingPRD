              as: FrontDeskStaff
              captures: { enrA_id: $.data.id }
            - call: "POST /enrichment/sessions/${sessA_id}/cancel"
              payload: {}
              as: FrontDeskStaff
            - call: "GET /enrichment/sessions/${sessB_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { sessB_v_live: $.data.version }
          trigger:
            - call: "POST /enrichment/enrollments/${enrA_id}/redeem-makeup"
