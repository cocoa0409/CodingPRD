  # =========================================================================
  # Rule 4 — transitive cascades of at least three levels
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: capture_cascade_terminal_line_shipment_notice
        grounds:
          - endpoints[POST /ltl/capture-events].side_effects
          - state_machines.Shipment.DECLARED_to_RECLASS_PENDING
          - entities.Terminal.fields.captures_since_calibration
          - entities.CorrectionNotice.fields.origin
          - calculations.capture_variance_gate
        distinguishing_aspect: |
          One capture call cascades four levels: CaptureEvent -> ShipmentLine (measured cube,
          density, found class) -> Shipment (measured weight, variance 18.18, reweigh flag,
          class_status, open_notice_count) -> CorrectionNotice (AUTOMATED_CAPTURE, type BOTH,
          final_delta_cents 30030), plus a sideways hop to Terminal
          (captures_since_calibration 1, last_capture_at). Order matters: the notice delta is
          computed only after the line rewrite, and a notice priced before the rewrite would be 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z; terminal TRM1 created with calibration_interval_captures = 3."
            - "Customer ACME on an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
