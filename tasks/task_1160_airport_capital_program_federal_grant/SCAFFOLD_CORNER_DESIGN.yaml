        distinguishing_aspect: "OCC on Grant.version: amendment A created at observed version succeeds and bumps the grant; a second create carrying the pre-bump version fails 412 ERR_STALE_VERSION; retrying with the fresh version succeeds and SUPERSEDES amendment A."
        test_recipe:
          setup: ["ACTIVE grant (version 1 after creation)"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
