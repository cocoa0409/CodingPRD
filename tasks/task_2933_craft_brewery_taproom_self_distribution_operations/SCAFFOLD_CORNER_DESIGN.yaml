      - name: permit_approval_is_refused_while_an_information_request_is_outstanding
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/event-permits/{permitId}/decision
          - state_machines.EventPermit.INFO_REQUESTED_to_SUBMITTED
          - errors.ERR_PERMIT_TRANSITION_INVALID
        distinguishing_aspect: "APPROVED is only reachable from SUBMITTED. While the permit sits in INFO_REQUESTED the regulator's approval is refused with 409 ERR_PERMIT_TRANSITION_INVALID; a re-submission lifts it back to SUBMITTED - incrementing submission_count to 2 - and only then does the same approval land."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; an OR StateLicense exists."
