              as: FirmAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 12000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "FIELDWORK", expected_hours: 40.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR", required_industry_specialization: "MANUFACTURING", requires_cpa_licensed: true }
