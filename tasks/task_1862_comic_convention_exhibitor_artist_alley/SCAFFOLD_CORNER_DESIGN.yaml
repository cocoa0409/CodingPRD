# §1.9 Scaffold Corner Design — breadth coverage of claims not already probed by §1.8.
scaffold_corner_design:
  # ============================================================
  - section: entities
    instances:
      - name: convention_creation_applies_defaults_and_cascades
        claim_type: defaults
        grounds: [entities.Convention.fields.deposit_window_days, entities.Convention.fields.phase]
        distinguishing_aspect: "Omitting deposit_window_days yields 14; phase starts SETUP; ops_run_count 0; quotas and dock doors are cascade-created and immediately listable."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id, ph: $.data.phase, dw: $.data.deposit_window_days, ops: $.data.ops_run_count, ver: $.data.version } }
          trigger:
            - { call: "GET /category-quotas?convention_id=${conv}", payload: {}, as: ShowDirector, captures: { q0: "$.data[0].accepted_count" } }
            - { call: "GET /dock-doors?convention_id=${conv}", payload: {}, as: ShowDirector, captures: { d0: "$.data[0].door_code" } }
          assert:
            - "phase == SETUP, deposit_window_days == 14 (default), ops_run_count == 0, version == 1"
            - "two CategoryQuota children exist with accepted_count == 0; two DockDoor children exist (first door_code D1)"

      - name: space_unit_creation_and_retrieval
        claim_type: creation
        grounds: [entities.SpaceUnit, endpoints."POST /space-units"]
        distinguishing_aspect: "POST with all required fields returns 201 with server-minted id, status AVAILABLE, version 1; GET returns the stored row."
        test_recipe:
          setup: ["Convention C1 exists"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id, st: $.data.status } }
          trigger:
            - { call: "GET /space-units/${sp1}", payload: {}, as: ShowDirector, captures: { got_code: $.data.space_code, got_ver: $.data.version } }
          assert:
            - "create response: status == AVAILABLE, id present; GET round-trips space_code A-101 with version == 1"

      - name: application_create_permit_default_both_convention_modes
        claim_type: defaults
        grounds: [entities.Application.fields.permit_status]
        distinguishing_aspect: "permit_status initializes PENDING when the convention requires permits and NOT_REQUIRED when it does not — the default depends on a cross-entity flag."
        test_recipe:
          setup: ["C1 (tax_permit_required true) and C2 (false, no quotas/doors) exist; one DEALER exhibitor"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv1: $.data.id } }
            - { call: "POST /conventions", payload: { name: "NoTax Expo", starts_at: "2026-11-05T09:00:00Z", ends_at: "2026-11-07T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-09-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: false, sales_tax_rate_bp: 0, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv2: $.data.id } }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
          trigger:
            - { call: "POST /applications", payload: { convention_id: "${conv1}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { p1: $.data.permit_status, s1: $.data.status } }
            - { call: "POST /applications", payload: { convention_id: "${conv2}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { p2: $.data.permit_status } }
          assert:
            - "app in permit-required convention: status == DRAFT and permit_status == PENDING"
            - "app in no-permit convention: permit_status == NOT_REQUIRED"

      - name: exhibitor_registration_initializes_system_fields
        claim_type: system_fields
        grounds: [entities.Exhibitor.fields.standing, calculations.renewal_priority_score]
        distinguishing_aspect: "Registration sets standing GOOD / strike_points 0 and computes renewal_priority_score 29 = 10*2 + 3*3 - 8*0 from the optional inputs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER", prior_years_completed: 2, prior_on_time_payments: 3 }, as: Anonymous, captures: { ex: $.data.id, st: $.data.standing, pts: $.data.strike_points, rps: $.data.renewal_priority_score } }
          trigger:
            - { call: "GET /exhibitors/${ex}", payload: {}, as: ShowDirector }
          assert:
            - "standing == GOOD, strike_points == 0, renewal_priority_score == 29"

      - name: get_unknown_application_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed but nonexistent UUID on a single-resource GET yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ShowDirector, captures: { err: $.data.error_id } }
          assert:
            - "http 404 and error_id == ERR_NOT_FOUND"

      - name: application_missing_required_field_rejected
        claim_type: required_fields
        grounds: [endpoints."POST /applications", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required convention_id from application creation yields 400 ERR_INVALID_REQUEST before any business check."
        test_recipe:
          setup: ["one exhibitor exists"]
          setup_api_calls:
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
          trigger:
            - { call: "POST /applications", payload: { category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { err: $.data.error_id } }
          assert:
            - "http 400 and error_id == ERR_INVALID_REQUEST"

      - name: space_unit_invalid_kind_enum_rejected
        claim_type: type_constraints
        grounds: [entities.SpaceUnit.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An undeclared enum member for kind is a 400 ERR_INVALID_REQUEST, not a 422 business failure."
        test_recipe:
          setup: ["Convention C1 exists"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id } }
          trigger:
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "X-1", block: "X", unit_number: 1, hall: "MAIN", kind: "MEGA_BOOTH", base_price_cents: 100000 }, as: ShowDirector, captures: { err: $.data.error_id } }
          assert:
            - "http 400 and error_id == ERR_INVALID_REQUEST"

      - name: space_unit_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.SpaceUnit.fields.status]
        distinguishing_aspect: "Client-supplied id/status/created_at values are ignored: the server mints id, forces status AVAILABLE, stamps created_at."
        test_recipe:
          setup: ["Convention C1 exists"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id } }
          trigger:
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000, id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", status: "RESERVED" }, as: ShowDirector, captures: { got_id: $.data.id, got_st: $.data.status } }
          assert:
            - "response id != the client-supplied UUID and status == AVAILABLE (system fields win over input)"

      - name: space_unit_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Default pagination (limit 10, offset 0) wraps list responses with total_count and has_more."
        test_recipe:
          setup: ["Convention C1 with two space units"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-102", block: "A", unit_number: 102, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
          trigger:
            - { call: "GET /space-units?convention_id=${conv}", payload: {}, as: Exhibitor, as_user_id: "00000000-0000-0000-0000-000000000000" }
          assert:
            - "response_type == array with total_count == 2, has_more == false, and default limit 10 applied"

      - name: jury_score_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.JuryScore]
        distinguishing_aspect: "common_fields:false — the created JuryScore carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Convention C1 in JURY_REVIEW with a SUBMITTED application"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
          trigger:
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1", captures: { js: $.data.id, wt: $.data.weighted_total } }
          assert:
            - "response contains id, created_at, juror_user_id == juror-1, weighted_total == 77.00"
            - "response contains NO version field (immutable entity)"

  # ============================================================
  - section: state_machines
    instances:
      - name: submit_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "SUBMITTED is not a from-state for submit; the second submit is rejected and no recompute happens."
        test_recipe:
          setup: ["Convention C1 in APPLICATIONS_OPEN (clock 2026-08-13); application SUBMITTED"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
          trigger:
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (http 409); status remains SUBMITTED"

      - name: withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application]
        distinguishing_aspect: "WITHDRAWN is terminal: withdraw-after-withdraw and submit-after-withdraw both fail."
        test_recipe:
          setup: ["Convention C1 in APPLICATIONS_OPEN; application SUBMITTED then WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /applications/${app}/withdraw", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
          trigger:
            - { call: "POST /applications/${app}/withdraw", payload: {}, as: Exhibitor, as_user_id: "${ex}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (http 409); terminal state permits no further transitions"

      - name: decide_rejected_path_with_low_scores
        claim_type: valid_transition
        grounds: [state_machines.Application.UNDER_REVIEW_to_JURIED_REJECTED]
        distinguishing_aspect: "REJECTED is always permitted once quorum holds, even with composite 40.00 (< 50); decided_at is stamped."
        test_recipe:
          setup: ["Convention C1 in JURY_REVIEW; application with three all-40 scores (composite 40.00)"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 40, craft: 40, category_fit: 40, professionalism: 40 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 40, craft: 40, category_fit: 40, professionalism: 40 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 40, craft: 40, category_fit: 40, professionalism: 40 }, as: JuryMember, as_user_id: "juror-3" }
          trigger:
            - { call: "POST /applications/${app}/decide", payload: { decision: "REJECTED" }, as: ShowDirector, captures: { st: $.data.status, comp: $.data.jury_composite_score } }
          assert:
            - "status == JURIED_REJECTED with jury_composite_score == 40.00; quota counters unchanged (accepted_count 0, waitlisted_count 0)"

      - name: first_jury_score_moves_application_under_review
        claim_type: side_effect_execution
        grounds: [state_machines.Application.SUBMITTED_to_UNDER_REVIEW]
        distinguishing_aspect: "The SUBMITTED -> UNDER_REVIEW transition is system-automatic on first score, not a client action."
        test_recipe:
          setup: ["Convention C1 in JURY_REVIEW; application SUBMITTED"]
          setup_api_calls:
