      - name: revenue_projection_precision_depends_on_the_pinned_per_year_rounding_order
        claim_type: Precision
        grounds:
          - calculations.multi_year_revenue_projection.precision
        distinguishing_aspect: "The per-year round_half_up before summation differs from a single round of the exact rational sum by one cent on the canonical base 3333333, which is the only way to observe the pinned order."
        excluded_because:
          difficulty_instance: revenue_projection_rounds_each_fiscal_year_before_summing
          rationale: "That §1.8 instance pins projected_revenue_total_cents at 13997529 and names 13997530 as the sum-then-round wrong answer, plus the derived HIGH and LOW curves, so a separate precision probe would restate it."

      - name: two_methodologies_over_identical_cost_lines_produce_different_certified_totals
        claim_type: Variant Divergence
        grounds:
          - calculations.fiscal_note_cost_total.variants
        distinguishing_aspect: "The divergence is structural (FTE filter plus indirect overhead), not a scale factor, so the same two lines must land 16107120 cents apart."
        excluded_because:
          difficulty_instance: fiscal_note_incremental_cost_vs_full_absorption_diverge_on_identical_lines
          rationale: "That §1.8 instance routes the identical FY2027/FY2028 line pair to two agencies under the two methodologies and asserts 26568000 versus 42675120 with the 16107120 delta, which is exactly this claim."

      - name: complexity_score_delta_when_the_variant_switches_from_intake_to_post_research
        claim_type: Reconciliation
        grounds:
          - calculations.drafting_complexity_score.variants
          - entities.DraftingRequest.fields.actual_complexity_score
        distinguishing_aspect: "complete-research is the moment the governing variant switches, and the stored intake estimate must survive unchanged beside the new actual score so the delta is observable on one row."
        excluded_because:
          difficulty_instance: drafting_complexity_intake_estimate_vs_post_research_actual_diverge
          rationale: "That §1.8 instance holds intake_complexity_estimate at its frozen value while actual_complexity_score is recomputed at complete-research and again at clarify, asserting both numbers and their difference on the same row."

      - name: overhead_inflated_direct_subtotal_can_pull_the_contingency_into_a_higher_tier
        claim_type: Constants Applied
        grounds:
          - calculations.fiscal_note_cost_total.constants.INDIRECT_OVERHEAD_PCT
          - calculations.fiscal_note_cost_total.constants.CONTINGENCY_TIER_1_CENTS
        distinguishing_aspect: "The apparent circularity (the tier depends on a subtotal that the overhead itself inflates) is resolved by the pinned order, and the only way to see it is a line set whose incremental subtotal sits at the tier-1 boundary while its fully absorbed subtotal clears it."
        excluded_because:
          difficulty_instance: contingency_tier_selected_after_indirect_overhead_folds_into_direct_subtotal
          rationale: "That §1.8 instance uses the tier-straddling line set (incremental direct exactly 10000000 at 0.05 versus fully absorbed direct 11480000 at 0.08) and asserts both certified totals, which subsumes the constants claim."

      - name: drafter_occupancy_counts_endpoint_touching_intervals_as_overlapping
        claim_type: interval_merge
        grounds:
          - calculations.drafter_engagement_occupancy
        distinguishing_aspect: "Closed-interval semantics plus an aggregate capacity of two means the third touching engagement is the first refusal, and drafting requests and amendments share one pool."
        excluded_because:
          difficulty_instance: drafter_occupancy_is_closed_at_both_ends_with_aggregate_capacity_two
          rationale: "That §1.8 instance builds two overlapping engagements, proves a third touching only at an endpoint is refused with ERR_DRAFTER_ENGAGEMENT_CAPACITY_EXCEEDED, and mixes a request with an amendment in the same pool."

      - name: hearing_window_adjacency_is_refused_by_the_changeover_buffer
        claim_type: interval_merge
        grounds:
          - calculations.committee_hearing_window_occupancy
          - calculations.committee_hearing_window_occupancy.constants.CHANGEOVER_BUFFER_MINUTES
        distinguishing_aspect: "Half-open windows would admit a back-to-back hearing, but the 30-minute buffer applied to the existing window's end refuses it while the buffer boundary itself remains exclusive."
        excluded_because:
          difficulty_instance: committee_hearing_windows_are_half_open_but_a_thirty_minute_changeover_buffer_refuses_adjacency
          rationale: "That §1.8 instance tests a candidate starting exactly at the existing end (refused), at the buffer boundary (accepted) and ending exactly at the existing start (accepted), covering every edge of this calculation."

      - name: priority_slot_ledger_is_an_exact_count_not_a_drifting_counter
        claim_type: aggregation
        grounds:
          - calculations.member_priority_slot_ledger
        distinguishing_aspect: "priority_slots_used is defined as a count over the member's non-withdrawn, non-lapsed priority rows, so a claim-then-release round trip must return the exact prior integer."
        excluded_because:
          difficulty_instance: withdrawing_a_priority_drafting_request_returns_the_member_slot_ledger_to_its_prior_count
          rationale: "That §1.8 instance drives the ledger to its cap, proves the refusal at the cap, withdraws one row and shows the slot is released and immediately reusable, which covers the aggregation claim end to end."

