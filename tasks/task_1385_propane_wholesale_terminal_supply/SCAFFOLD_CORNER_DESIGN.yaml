# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Propane Wholesale & Terminal Supply — breadth probe across §1.1–§1.7
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: terminal_create_applies_defaults_and_clock_default
        claim_type: defaults
        grounds: [entities.Terminal, "endpoints: POST /terminals"]
        distinguishing_aspect: "Fresh terminal: on_hand_gal 0, allocation_posture NORMAL, ops_epoch 0, version 1; and with no clock call the default logical time 2026-08-01T00:00:00Z yields season_posture SUMMER_BUILD and effective floor == reserve_floor_gal."
        test_recipe:
          setup: ["empty DB; clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /terminals"
              payload: { name: "T-E1", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id, v: $.data.version }
            - { call: "GET /terminals/${term}/inventory-summary", as: SupplyPlanner, captures: { atp: $.data.available_to_promise_gal, season: $.data.season_posture, post: $.data.allocation_posture } }
          assert:
            - "Terminal.${term}.version == 1 and allocation_posture == NORMAL"
            - "inventory-summary: season_posture == SUMMER_BUILD (default clock 2026-08-01), effective_reserve_floor_gal == 50000, available_to_promise_gal == -50000 (reported as computed: 0 on_hand - 50000 floor - 0 reserved; negative allowed pre-inventory)"
      - name: terminal_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Terminal, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input rack_bay_count is rejected with ERR_INVALID_REQUEST (400); no Terminal row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /terminals"
              payload: { name: "T-E2", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000 }
              as: SupplyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
      - name: dealer_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Dealer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent dealer UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /dealers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"
      - name: delivery_order_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints: GET /delivery-orders"]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 3 orders, limit 2 -> page1 has_more true, page2 (offset 2) has_more false and 1 row."
        test_recipe:
          setup:
            - "base fixture (terminal 400000 gal, Z1, dealer limit 100000000, FIXED contract ACTIVE); three 5000-gal orders created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-E4", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer E4", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
            - { call: "POST /delivery-orders", payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }, as: DealerUser, as_user_id: "${dl}" }
            - { call: "POST /delivery-orders", payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }, as: DealerUser, as_user_id: "${dl}" }
            - { call: "POST /delivery-orders", payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }, as: DealerUser, as_user_id: "${dl}" }
          trigger:
            - { call: "GET /delivery-orders", payload: { terminal_id: "${term}", limit: 2, offset: 0 }, as: CreditManager }
            - { call: "GET /delivery-orders", payload: { terminal_id: "${term}", limit: 2, offset: 2 }, as: CreditManager }
          assert:
            - "page1: response_type == array, total_count == 3, has_more == true, 2 rows"
            - "page2: has_more == false, 1 row"
      - name: index_publication_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.PriceIndexPublication]
        distinguishing_aspect: "PriceIndexPublication is common_fields:false: response exposes id and created_at but no version/updated_at, and the catalog declares no update endpoint for it."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /price-index-publications"
              payload: { index_name: "CONWAY", effective_date: "2026-08-01", price_mc_per_gal: 91000 }
              as: PricingDesk
              captures: { pub: $.data.id }
          assert:
            - "response contains id and created_at and no version field"
            - "GET /price-index-publications/${pub} returns identical stored fields (append-only)"
      - name: zone_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.FreightZone, "errors[ERR_DUPLICATE_ZONE_CODE]"]
        distinguishing_aspect: "zone_code uniqueness is per terminal: second zone with the same code on the same terminal fails; same code on a different terminal succeeds."
        test_recipe:
          setup: ["two terminals T-ZA, T-ZB; zone Z1 on T-ZA"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "T-ZA", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { ta: $.data.id }
            - call: "POST /terminals"
              payload: { name: "T-ZB", region_code: "MW", storage_capacity_gal: 500000, reserve_floor_gal: 20000, winter_reserve_floor_gal: 60000, rack_bay_count: 1 }
              as: SupplyAdmin
              captures: { tb: $.data.id }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${ta}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
          trigger:
            - call: "POST /freight-zones"
              payload: { terminal_id: "${ta}", zone_code: "Z1", one_way_drive_minutes: 90, freight_mc_per_gal: 7000, min_freight_cents: 100000 }
              as: SupplyAdmin
              captures: { err: $.data.error_id }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${tb}", zone_code: "Z1", one_way_drive_minutes: 90, freight_mc_per_gal: 7000, min_freight_cents: 100000 }
              as: SupplyAdmin
              captures: { z1b: $.data.id }
          assert:
            - "duplicate on T-ZA: error_id == ERR_DUPLICATE_ZONE_CODE (409)"
            - "same code on T-ZB: created successfully (201, id captured)"
      - name: fk_reverse_list_orders_by_dealer
        claim_type: parent_relationships
        grounds: [entities.DeliveryOrder.fields.dealer_id, "endpoints: GET /delivery-orders"]
        distinguishing_aspect: "Filtered-list FK reverse reachability: GET /delivery-orders?dealer_id returns exactly that dealer's orders and none of another dealer's."
        test_recipe:
          setup:
            - "base fixture; dealers DA and DB each with an ACTIVE FIXED contract; DA has 2 orders, DB has 1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-E7", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer EA", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { da: $.data.id, da_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${da}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dca: $.data.id }
            - { call: "POST /dealer-contracts/${dca}/activate", payload: { expected_dealer_version: "${da_v}" }, as: CreditManager }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer EB", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { db: $.data.id, db_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${db}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dcb: $.data.id }
            - { call: "POST /dealer-contracts/${dcb}/activate", payload: { expected_dealer_version: "${db_v}" }, as: CreditManager }
            - { call: "POST /delivery-orders", payload: { dealer_contract_id: "${dca}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }, as: DealerUser, as_user_id: "${da}" }
            - { call: "POST /delivery-orders", payload: { dealer_contract_id: "${dca}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }, as: DealerUser, as_user_id: "${da}" }
            - { call: "POST /delivery-orders", payload: { dealer_contract_id: "${dcb}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 7000 }, as: DealerUser, as_user_id: "${db}" }
          trigger:
            - { call: "GET /delivery-orders", payload: { dealer_id: "${da}" }, as: CreditManager }
          assert:
            - "total_count == 2 and every row's dealer_id == ${da}"
            - "no row for Dealer EB's 7000-gal order appears"
      - name: truck_transition_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.TransportTruck.fields.status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "to_state outside the declared enum is a request error (400 ERR_INVALID_REQUEST), distinct from a legal-enum-but-illegal-jump state error (409)."
        test_recipe:
          setup: ["terminal with one truck U-01"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "T-E8", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /trucks"
              payload: { terminal_id: "${term}", unit_number: "U-01", capacity_gal: 11000, weekly_hours_limit_minutes: 3600 }
              as: SupplyAdmin
              captures: { tk1: $.data.id }
          trigger:
            - call: "POST /trucks/${tk1}/transition"
              payload: { to_state: "FLYING" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_allocated_in_normal_posture
        claim_type: initial_state
        grounds: [state_machines.DeliveryOrder]
        distinguishing_aspect: "Under NORMAL terminal posture a created order fast-paths to ALLOCATED with allocated_gal == requested_gal and a stamped provisional."
        test_recipe:
          setup: ["base fixture; FIXED contract ACTIVE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-M1", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer M1", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
          trigger:
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { fs: $.data.fulfillment_status, ag: $.data.allocated_gal, inv: $.data.invoice_status }
          assert:
            - "fulfillment_status == ALLOCATED, allocated_gal == 5000, invoice_status == NOT_READY"
      - name: order_initial_state_requested_when_curtailed
        claim_type: initial_state
        grounds: [state_machines.DeliveryOrder, state_machines.Terminal]
        distinguishing_aspect: "Under CURTAILED posture the same create lands in REQUESTED with allocated_gal null and provisional null (no ATP check at creation)."
        test_recipe:
          setup: ["base fixture; cold snap ACTIVE on the terminal; dealer with FIXED contract ACTIVE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-M2", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer M2", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
            - call: "POST /cold-snap-events"
              payload: { terminal_id: "${term}", severity: "WATCH", start_date: "2026-08-01", end_date: "2026-08-20" }
              as: SupplyPlanner
              captures: { cs: $.data.id }
            - { call: "POST /cold-snap-events/${cs}/activate", payload: {}, as: SupplyPlanner }
          trigger:
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { fs: $.data.fulfillment_status, ag: $.data.allocated_gal }
          assert:
            - "fulfillment_status == REQUESTED and allocated_gal is null"
      - name: order_invalid_transition_deliver_from_allocated
        claim_type: invalid_transition
        grounds: [state_machines.DeliveryOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /deliver is legal only from LOADED; on an ALLOCATED order it fails with ERR_INVALID_STATE and no side effects fire (invoice stays NOT_READY)."
        test_recipe:
          setup: ["base fixture; FIXED contract; one 5000-gal order ALLOCATED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-M3", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer M3", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${ord}/deliver"
