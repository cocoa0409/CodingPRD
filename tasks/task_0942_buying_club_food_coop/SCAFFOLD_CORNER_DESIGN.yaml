      assert:
      - CreditGrant.${g_old}.status == EXPIRED
      - CreditGrant.${g_old}.remaining_cents == 5000
      - CreditGrant.${g_new}.status == ACTIVE
      - CreditGrant.${g_new}.remaining_cents == 2000
