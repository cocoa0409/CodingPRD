      - name: the_revocation_that_closes_the_brokerage_also_closes_its_trust_account
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors.ERR_TRUST_ACCOUNT_CLOSED
          - state_machines.Brokerage.SUSPENDED_to_CLOSED
          - state_machines.TrustAccount.OPEN_to_CLOSED
        distinguishing_aspect: |
          The only route to a CLOSED trust account is three cascade levels away from any trust
          endpoint: a REVOCATION order against the designated broker drives the brokerage
          ACTIVE -> SUSPENDED and, because the revoked broker was its only ACTIVE affiliate, straight
          on to CLOSED in the same request, which closes every zero-shortage account. Both trust
          endpoints then refuse - the ledger append and the audit scheduling - and the terminal
          brokerage cannot be re-activated.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker as its designated broker, self-supervising and its only affiliate"
            - "escrow account TA holds one cleared DEPOSIT of 100000 and no obligations, so shortage_cents == 0"
            - "a MISREPRESENTATION complaint against Dana Broker (alleged_loss_cents 300000) is at PROBABLE_CAUSE with investigator counsel-05"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id, ta_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 100000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-01", expected_trust_account_version: "${ta_v0}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Pat Buyer", respondent_licensee_id: "${br_id}", allegation_type: "MISREPRESENTATION", alleged_loss_cents: 300000 }
              as: LicensingAnalyst
              captures: { cmp_id: $.data.id }
            - call: "POST /commission/complaints/${cmp_id}/disposition"
              payload: { disposition: "INVESTIGATE", investigator_user_id: "counsel-05" }
              as: CommissionCounsel
              as_user_id: "counsel-05"
            - call: "POST /commission/complaints/${cmp_id}/disposition"
              payload: { disposition: "PROBABLE_CAUSE" }
              as: CommissionCounsel
              as_user_id: "counsel-05"
          trigger:
            - call: "POST /commission/complaints/${cmp_id}/consent-agreements"
              payload: { proposed_sanction_type: "REVOCATION", proposed_fine_cents: 0, proposed_suspension_days: 0 }
              as: CommissionCounsel
              as_user_id: "counsel-01"
              captures: { con_id: $.data.id }
            - call: "POST /commission/consent-agreements/${con_id}/respondent-response"
              payload: { action: "ACCEPT" }
              as: Respondent
              as_user_id: "${br_id}"
            - call: "POST /commission/consent-agreements/${con_id}/commission-action"
              payload: { action: "EXECUTE" }
              as: CommissionCounsel
              as_user_id: "counsel-02"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v1: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 5000, effective_date: "2026-08-02", cleared_date: "2026-08-02", transaction_reference: "DEP-02", expected_trust_account_version: "${ta_v1}" }
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /commission/trust-accounts/${ta_id}/audits"
              payload: { auditor_user_id: "auditor-12", basis: "BOOK", as_of_date: "2026-08-31", fieldwork_start_at: "2026-08-02T00:00:00Z", fieldwork_end_at: "2026-08-02T16:00:00Z" }
              as: TrustAuditor
              as_user_id: "auditor-12"
              captures: { e2: $.data.error_id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "attempt to revive a closed brokerage" }
              as: LicensingAnalyst
              captures: { e3: $.data.error_id }
          assert:
            - "the EXECUTE returns 200 with ConsentAgreement.${con_id}.status == EXECUTED and exactly one SanctionOrder with source == CONSENT, status == ISSUED, sanction_type == REVOCATION and effective_at == 2026-08-01T00:00:00Z"
            - "Licensee.${br_id}.license_status == REVOKED and discipline_status == SANCTIONED, so Brokerage.${bkg_id}.affiliated_licensee_count falls to 0"
            - "the same request walked the brokerage ACTIVE -> SUSPENDED -> CLOSED: Brokerage.${bkg_id}.status == CLOSED with supervision_posture == FROZEN"
            - "the closure cascaded into the account: TrustAccount.${ta_id}.status == CLOSED with book_available_cents == 100000 and shortage_cents == 0 (a shortage would have kept it open)"
            - "the ledger append returns 409 ERR_TRUST_ACCOUNT_CLOSED and GET /commission/trust-accounts/${ta_id}/ledger-entries still returns exactly 1 row"
            - "scheduling an audit of the same account returns 409 ERR_TRUST_ACCOUNT_CLOSED - priority 10 covers both trust endpoints, not just the ledger"
            - "re-activating the brokerage returns 409 ERR_INVALID_STATE: CLOSED is terminal and the activation endpoint only accepts PENDING or SUSPENDED"
      - name: a_fine_payment_may_not_exceed_the_outstanding_balance_and_the_last_cent_satisfies_it
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors.ERR_PAYMENT_EXCEEDS_BALANCE
          - state_machines.SanctionOrder.ISSUED_to_SATISFIED
          - endpoints["POST /commission/sanction-orders/{id}/fine-payments"].side_effects
        distinguishing_aspect: |
          The ceiling is the REMAINING balance, not the ordered fine: 500001 is refused on an untouched
          500000 order and 200001 is refused after 300000 has been paid, which an implementation
          comparing against fine_cents alone gets wrong. Every accepted cent also lands in the recovery
          fund (100% credit), and the payment that closes the balance flips the order to SATISFIED -
          after which the endpoint's own from-state check takes over.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising and Sam Reed ACTIVE"
            - "a MISREPRESENTATION complaint against Sam Reed reached PROBABLE_CAUSE (investigator counsel-05) and was settled by a FINE consent of 500000 cents offered by counsel-01 and executed by counsel-02, so a SanctionOrder is ISSUED with fine_cents 500000 and fine_paid_cents 0"
            - "the recovery fund is empty: balance_cents == 0 and fine_credits_cents == 0"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
