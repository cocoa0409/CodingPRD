            - "st == PAUSED (75 + 15 == 90 exactly; <= 90 admits)"

      - name: pause_ninety_one_days_rejected
        claim_type: correct_result
        grounds: ["calculations.pause_accounting", "validations[priority=21]", "errors[ERR_PAUSE_DURATION_EXCEEDED]"]
        distinguishing_aspect: "Same history, one day more: a 16-day PAUSE request takes the budget to 91 and is rejected with ERR_PAUSE_DURATION_EXCEEDED while the count check (1 < 2) still passes."
