            - "PatternAsset.${p1_id}.status == QUALIFIED and PatternAsset.${p1_id}.wear_index == 0 and PatternAsset.${p1_id}.pours_since_refurb == 0 and PatternAsset.${p1_id}.refurb_cycles == 1"
