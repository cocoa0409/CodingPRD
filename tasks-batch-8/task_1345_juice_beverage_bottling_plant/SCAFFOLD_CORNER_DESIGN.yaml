            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-BE2", capacity_liters: 5000 }, as: PlantManager, captures: { t2: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${t1}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { ba: $.data.id } }
            - { call: "POST /v1/batches/${ba}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${ba}/record-blend", payload: { measured_brix: 12.3 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${t2}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { bb: $.data.id } }
            - { call: "POST /v1/batches/${bb}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${bb}/record-blend", payload: { measured_brix: 12.31 }, as: BlendOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /v1/batches/${ba}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { ba_status: $.data.status } }
            - { call: "POST /v1/batches/${bb}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { err_bb: $.data.error_id } }
            - { call: "POST /v1/batches/${bb}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1", captures: { bb_status: $.data.status } }
          assert:
            - "ba_status == QA_PASSED (12.3 == 12.0 + 0.3, inclusive upper edge)"
            - "err_bb == ERR_BRIX_OUT_OF_TOLERANCE, HTTP 409 (12.31 outside the band); batch stays AWAITING_QA"
            - "bb_status == QA_FAILED (FAIL verdict carries no brix precondition)"

      - name: fefo_created_at_tiebreak_and_per_lot_pallet_ceil
