        grounds: ["validations[priority=26]", "validations[priority=27]", "validations[priority=28]", "validations[priority=29]", "errors[ERR_SUPPLIER_NOT_QUALIFIED]", "errors[ERR_INGREDIENT_DISCONTINUED]", "errors[ERR_FORMULA_ARCHIVED]", "errors[ERR_CUSTOMER_SUSPENDED]"]
        distinguishing_aspect: "Four referential creation gates each fire their own error: PROVISIONAL supplier lot receipt, DISCONTINUED ingredient in a submitted revision, new revision on an ARCHIVED formula, formula create for a SUSPENDED customer."
        test_recipe:
          setup: ["supplier S-PROV (PROVISIONAL); ingredient DISC (status DISCONTINUED); ACTIVE customer C1 with formulas FD (ACTIVE, holds revision RD containing DISC) and FA (created with status ARCHIVED); customer C2 created with status SUSPENDED"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S-PROV", qualification_status: "PROVISIONAL" }, as: PlantAdmin, captures: { supp: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "DISC", category: "BINDER", allergen_tags: [], status: "DISCONTINUED" }, as: PlantAdmin, captures: { disc: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C2", contact_email: "c2@x.com", status: "SUSPENDED" }, as: PlantAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${c1}", name: "FD", bar_weight_g: 60 }, as: FormulationScientist, captures: { fd: "$.data.id" } }
            - { call: "POST /mfg/formulas/${fd}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${disc}", qty_kg_per_batch: 20, is_protein_contributor: false }], batch_size_kg: 100, target_protein_g_per_serving: 0, claim_tags: [] }, as: FormulationScientist, captures: { rd: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${c1}", name: "FA", bar_weight_g: 60, status: "ARCHIVED" }, as: FormulationScientist, captures: { fa: "$.data.id" } }
