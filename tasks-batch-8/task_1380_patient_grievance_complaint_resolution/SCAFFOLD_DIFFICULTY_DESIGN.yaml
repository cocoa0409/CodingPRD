            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/patient-cases/${c1}/escalations", payload: { escalation_type: "CARE_CONCERN", review_track: "COMPLIANCE" }, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { e1: $.data.id } }
            - { call: "POST /api/escalations/${e1}/triage", payload: { review_track: "COMPLIANCE" }, as: QualityRiskOfficer, as_user_id: "${q1}" }
            - { call: "POST /api/escalations/${e1}/complete-review", payload: { review_branch: "COMPLIANCE" }, as: QualityRiskOfficer, as_user_id: "${q1}" }
          trigger:
            - { call: "POST /api/escalations/${e1}/adjudicate", payload: { outcome: "SUBSTANTIATED", outcome_note: "Care concern confirmed" }, as: QualityRiskOfficer, as_user_id: "${q2}", captures: { est: $.data.status, eat: $.data.adjudicated_at } }
            - { call: "GET /api/patient-cases/${c1}", as: QualityRiskOfficer, as_user_id: "${q2}", captures: { cosign: $.data.requires_qro_cosign } }
            - { call: "GET /api/patient-cases/${c1}/timeline", as: QualityRiskOfficer, as_user_id: "${q2}", captures: { due: $.data.response_due_calendar_at, clk: $.data.regulatory_clock_status } }
            - { call: "GET /api/reportable-events?case_id=${c1}", as: QualityRiskOfficer, as_user_id: "${q2}", captures: { ev_st: "$.data[0].status", ev_tr: "$.data[0].trigger_reason", ev_dl: "$.data[0].filing_deadline_at", ev_esc: "$.data[0].escalation_id" } }
          assert:
            - "est == 'ADJUDICATED_SUBSTANTIATED' and eat == '2026-09-10T12:00:00Z' (link 1)"
