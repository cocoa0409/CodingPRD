              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /scouting/scouts/${s1}/weight"
