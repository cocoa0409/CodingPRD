  - method: POST
    path: "/compliance-reviews/{id}/suspend"
    description: "Suspend the mailbox under an open review. Head of the depth-6 compliance_suspension_cascade."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReview
    side_effects:
      - "ComplianceReview.status OPEN -> SUSPENDED"
      - "Box.service_status ACTIVE -> SUSPENDED and compliance_status UNDER_REVIEW -> NON_COMPLIANT"
      - "every PENDING DispositionRequest on the box's pieces -> CANCELLED with resolution_reason GATE_SUSPENSION"
      - "each affected MailItem returns PENDING_DISPOSITION -> HELD and its storage axis is re-evaluated, possibly firing FREE_WINDOW -> ACCRUING and appending STORAGE_DAY usage"
      - "every AUTHORIZED Recipient -> SUSPENDED, after which release_eligibility re-derives to BLOCKED and those pieces move HELD -> AWAITING_CLEARANCE"
      - "the seven hops run in the fixed order pinned on state_machines.ComplianceReview.OPEN_to_SUSPENDED"
      - "increments Box.version by 1"
  - method: POST
    path: "/compliance-reviews/{id}/resolve"
    description: "Close a review as CLEARED or ESCALATED_CLOSURE; the resolver must differ from the opener."
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution]
    output: ComplianceReview
    side_effects:
      - "ComplianceReview.status -> RESOLVED"
      - "on CLEARED, Box.service_status SUSPENDED -> ACTIVE, compliance_status -> COMPLIANT, SUSPENDED recipients return to AUTHORIZED"
      - "on ESCALATED_CLOSURE, Box.service_status SUSPENDED -> CLOSING and a CancellationRequest is created"
      - "increments Box.version by 1"

  - method: GET
    path: "/boxes/{id}/billing-cycles"
    description: "List a mailbox's billing cycles."
    roles: [PlatformAdmin, CmraOperator, BoxHolder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingCycle[]
    side_effects: []
  - method: GET
    path: "/billing-cycles/{id}"
    description: "Read one billing cycle with its quota counters and money breakdown."
    roles: [PlatformAdmin, CmraOperator, BoxHolder]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []
  - method: GET
    path: "/billing-cycles/{id}/usage-entries"
    description: "List the usage ledger of one cycle."
    roles: [PlatformAdmin, CmraOperator, BoxHolder]
    code: 200
    input: ["unit_type?", "tranche?", "limit?", "offset?"]
    output: UsageLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/boxes/{id}/billing-cycles/close"
    description: "Close the mailbox's OPEN billing cycle and open the next one."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects:
      - "runs box_monthly_charge and writes total_charge_cents"
      - "applies downgrade_recipient_truevup when Box.pending_plan_tier_id is set"
      - "every METERED MailItem -> BILLED"
      - "creates the next BillingCycle with all four quota counters reset to 0"
      - "increments BillingCycle.version by 1"

  - method: POST
    path: "/boxes/{id}/cancellation"
    description: "Give notice of cancellation."
    roles: [BoxHolder]
    code: 201
    input: [forwarding_address]
    output: CancellationRequest
    side_effects:
      - "runs cancellation_dates"
      - "Box.service_status ACTIVE -> CLOSING"
      - "snapshots prepaid_at_request_cents and deposit_held_cents"
      - "increments Box.version by 1"
  - method: GET
    path: "/boxes/{id}/cancellation"
    description: "List the cancellation requests of a mailbox."
    roles: [PlatformAdmin, CmraOperator, ComplianceOfficer, BoxHolder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CancellationRequest[]
    side_effects: []
  - method: POST
    path: "/boxes/{id}/cancellation/withdraw"
    description: "Withdraw a pending cancellation and return the mailbox to service."
    roles: [BoxHolder]
    code: 200
    input: []
    output: CancellationRequest
    side_effects:
      - "CancellationRequest.status -> WITHDRAWN"
      - "Box.service_status CLOSING -> ACTIVE"
      - "increments Box.version by 1"
  - method: POST
    path: "/boxes/{id}/cancellation/finalize"
    description: "Close the mailbox, destroy remaining non-SOP pieces and settle the refund waterfall."
    roles: [CmraOperator]
    code: 200
    input: []
    output: CancellationRequest
    side_effects:
      - "runs sop_retention_deadline and refund_waterfall"
      - "remaining non-SOP pieces -> SHREDDED / DESTROYED"
      - "CancellationRequest.status FINAL_FORWARD -> FINALIZED"
      - "Box.service_status CLOSING -> CLOSED"
      - "increments Box.version by 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles. Test recipes denote this case with the pseudo-role Anonymous, which is deliberately absent from the §1.7 matrix and means no valid role header was sent"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, the acting BoxHolder or Recipient does not own the target resource, or a segregation-of-duties rule is violated (resolver equals opener, acceptor equals notary)"
  - id: ERR_VALIDATION
    http: 400
    condition: "a required body field is missing, of the wrong type, or outside its declared range (requested_pages outside 1..200, amount_cents < 1, jurisdiction_code not two uppercase letters, plan change to the same rank)"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "an enum-valued field listed in validations priority 10 carries a value outside its declared member set"
  - id: ERR_PLAN_TIER_NOT_FOUND
    http: 404
    condition: "plan_tier_id or new_plan_tier_id does not resolve to a PlanTier"
  - id: ERR_CARRIER_RULE_NOT_FOUND
    http: 404
    condition: "carrier_rule_id does not resolve to a CarrierRule"
  - id: ERR_BOX_NOT_FOUND
    http: 404
    condition: "the box id in the path or in box_id does not resolve to a Box"
  - id: ERR_RECIPIENT_NOT_FOUND
    http: 404
    condition: "a recipient id in the path or body does not resolve to a Recipient"
  - id: ERR_FORM_1583_NOT_FOUND
    http: 404
    condition: "the form id in the path does not resolve to a Form1583"
  - id: ERR_ID_DOCUMENT_NOT_FOUND
    http: 404
    condition: "the document id in the path does not resolve to an IdDocument"
  - id: ERR_MAIL_ITEM_NOT_FOUND
    http: 404
    condition: "a mail item id in the path or body does not resolve to a MailItem"
  - id: ERR_SCAN_JOB_NOT_FOUND
    http: 404
    condition: "the scan job id in the path does not resolve to a ScanJob"
  - id: ERR_DISPOSITION_NOT_FOUND
    http: 404
    condition: "the disposition id in the path does not resolve to a DispositionRequest"
  - id: ERR_FORWARD_SHIPMENT_NOT_FOUND
    http: 404
    condition: "the shipment id in the path does not resolve to a ForwardShipment"
  - id: ERR_DEPOSIT_BATCH_NOT_FOUND
    http: 404
    condition: "the batch id in the path does not resolve to a DepositBatch"
  - id: ERR_CHECK_DEPOSIT_NOT_FOUND
    http: 404
    condition: "the check id in the path does not resolve to a CheckDeposit"
  - id: ERR_COMPLIANCE_REVIEW_NOT_FOUND
    http: 404
    condition: "the review id in the path does not resolve to a ComplianceReview"
  - id: ERR_BILLING_CYCLE_NOT_FOUND
    http: 404
    condition: "the cycle id in the path does not resolve to a BillingCycle"
  - id: ERR_BOX_SUSPENDED
    http: 409
    condition: "GLOBAL GATE A: the target Box has service_status SUSPENDED and the operation is in gate_precedence.box_suspension_gate.gated_operations without falling under the SOP carve-out"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "GLOBAL GATE B (box PENDING_SETUP or CLOSED) or the target resource is not in a state from which the requested §1.2 transition is declared; also raised when a required sub-resource such as a CancellationRequest or an OPEN BillingCycle does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_mail_item_version, expected_box_version or expected_deposit_batch_version does not equal the parent's current version"
  - id: ERR_RECIPIENT_NOT_ON_ROSTER
    http: 409
    condition: "the recipient supplied to match is on another box, has roster_status REMOVED, or its normalized legal_name and dba_aliases do not include the piece's normalized addressee_name"
  - id: ERR_FORM_1583_INCOMPLETE
    http: 409
    condition: "GLOBAL GATE C1: the matched Recipient holds no Form1583 with status ACCEPTED"
  - id: ERR_ID_DOCUMENT_SET_INCOMPLETE
    http: 409
    condition: "GLOBAL GATE C2: the matched Recipient holds an ACCEPTED Form1583 but governing(PHOTO) or governing(ADDRESS) is null"
  - id: ERR_ID_DOCUMENT_EXPIRED
    http: 409
    condition: "GLOBAL GATE C3: governing(PHOTO) and governing(ADDRESS) both exist but at least one has status EXPIRED"
  - id: ERR_RA_SERVICE_REQUIRED
    http: 403
    condition: "an SOP piece is accepted, scanned or notified on a box with no RegisteredAgentService whose active is true"
  - id: ERR_SCAN_CONSENT_REQUIRED
    http: 403
    condition: "an INTERIOR or OCR scan is requested on a piece whose interior_scan_consent is false"
  - id: ERR_SIGNATURE_AUTHORIZATION_MISSING
    http: 403
    condition: "a signature_required piece is accepted while its matched Recipient has signature_authorization_on_file false"
  - id: ERR_CARRIER_NOT_ACCEPTED
    http: 422
    condition: "a signature_required piece arrives from a carrier whose CarrierRule.accepts_signature_required is false"
  - id: ERR_PACKAGE_OVERSIZE
    http: 422
    condition: "length_in + 2*(width_in + height_in) is strictly greater than CarrierRule.max_length_plus_girth_in, or actual_weight_lb is strictly greater than CarrierRule.max_actual_weight_lb"
  - id: ERR_GUARANTOR_REQUIRED
    http: 422
    condition: "a MINOR recipient is created without a guarantor_recipient_id pointing at a non-MINOR recipient of the same box, or a non-MINOR recipient supplies one"
  - id: ERR_ROSTER_CAP_EXCEEDED
    http: 409
    condition: "the roster already occupies min(PlanTier.included_recipients + Box.extra_recipient_slots, USPS_ROSTER_CAP) slots"
  - id: ERR_DISPOSITION_CONFLICT
    http: 409
    condition: "an incoming DispositionRequest has a precedence_rank equal to or higher than an already PENDING request on the same piece"
  - id: ERR_SCAN_RETRY_EXHAUSTED
    http: 409
    condition: "retry is called on a ScanJob whose status is ABANDONED"
  - id: ERR_BATCH_CUTOFF_PASSED
    http: 409
    condition: "a check is added at or after BATCH_CUTOFF_HOUR_UTC on the logical clock"
  - id: ERR_PAYEE_MISMATCH
    http: 422
    condition: "rematch is called on a held check and payee_match still resolves no Recipient"
  - id: ERR_DEPOSIT_CAP_EXCEEDED
    http: 422
    condition: "amount_cents exceeds CHECK_MAX_AMOUNT_CENTS, the batch total would exceed BATCH_MAX_TOTAL_CENTS, or the batch already holds BATCH_MAX_CHECKS checks"
  - id: ERR_ITEM_NOT_CONSOLIDATABLE
    http: 422
    condition: "every mail_item_id supplied to a forward shipment fails consolidation_eligibility"
  - id: ERR_CANCELLATION_ALREADY_PENDING
    http: 409
    condition: "a CancellationRequest with status REQUESTED or FINAL_FORWARD already exists on the box"
  - id: ERR_RA_RETENTION_ACTIVE
    http: 409
    condition: "an SOP piece is shredded, or a cancellation is finalized, while the piece is still inside its RegisteredAgentService statutory retention period"
  - id: ERR_RETENTION_FLOOR_NOT_REACHED
    http: 409
    condition: "finalize is called while the logical clock date is STRICTLY LESS THAN CancellationRequest.destruction_eligible_on; the bound is inclusive, so finalizing ON destruction_eligible_on is allowed"
  - id: ERR_QUOTA_EXHAUSTED
    http: 402
    condition: "a consumption event would write an OVERAGE tranche on a PlanTier whose allows_overage is false"

roles:
  - name: PlatformAdmin
    description: "Platform operator: configures plan tiers and carrier rules, runs billing cycle closes, manages the registered-agent add-on and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /plan-tiers"
      - "POST /carrier-rules"
      - "POST /boxes/{id}/registered-agent"
      - "POST /boxes/{id}/registered-agent/deactivate"
      - "POST /boxes/{id}/billing-cycles/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /plan-tiers"
      - "GET /carrier-rules"
      - "GET /boxes"
      - "GET /boxes/{id}"
      - "GET /boxes/{id}/summary"
      - "GET on every list and read endpoint"
  - name: CmraOperator
    description: "Counter staff at the CMRA facility: opens mailboxes, manages the roster and identification documents, logs and matches inbound mail, runs scans, executes dispositions, handles checks and finalizes cancellations."
    identity: opaque
    exclusive_operations:
      - "POST /boxes"
      - "POST /boxes/{id}/activate"
      - "POST /boxes/{id}/recipients"
      - "PATCH /recipients/{id}"
      - "POST /recipients/{id}/remove"
      - "POST /recipients/{id}/form-1583"
      - "POST /recipients/{id}/id-documents"
      - "POST /id-documents/{id}/verify"
      - "POST /boxes/{id}/mail-items"
      - "POST /mail-items/{id}/match"
      - "POST /mail-items/{id}/refuse"
      - "POST /mail-items/{id}/package-acceptance"
      - "POST /mail-items/{id}/notify"
      - "POST /scan-jobs/{id}/start"
      - "POST /scan-jobs/{id}/complete"
      - "POST /scan-jobs/{id}/fail"
      - "POST /scan-jobs/{id}/retry"
      - "POST /dispositions/{id}/execute"
      - "POST /forward-shipments/{id}/ship"
      - "POST /boxes/{id}/deposit-batches"
      - "POST /deposit-batches/{id}/checks"
      - "POST /check-deposits/{id}/rematch"
      - "POST /check-deposits/{id}/return"
      - "POST /deposit-batches/{id}/close"
      - "POST /boxes/{id}/cancellation/finalize"
    shared_operations:
      - "GET /boxes/{id}"
      - "GET /boxes/{id}/summary"
      - "GET /mail-items"
      - "GET on every list and read endpoint"
  - name: ComplianceOfficer
    description: "USPS compliance reviewer: accepts or rejects Form 1583 applications and opens, suspends and resolves compliance reviews. Cannot resolve a review it opened, and cannot accept a form it notarized."
    identity: opaque
    exclusive_operations:
      - "POST /form-1583/{id}/accept"
      - "POST /form-1583/{id}/reject"
      - "POST /boxes/{id}/compliance-reviews"
      - "POST /compliance-reviews/{id}/suspend"
      - "POST /compliance-reviews/{id}/resolve"
    shared_operations:
      - "GET /boxes/{id}"
      - "GET /boxes/{id}/recipients"
      - "GET /recipients/{id}"
      - "GET /boxes/{id}/compliance-reviews"
  - name: Notary
    description: "Commissioned notary who witnesses the Form 1583 signature. Holds no other authority."
    identity: opaque
    exclusive_operations:
      - "POST /form-1583/{id}/notarize"
    shared_operations:
      - "GET /form-1583/{id}"
      - "GET /plan-tiers"
  - name: BoxHolder
    description: "The mailbox account holder. X-User-ID is the Box.id it may act on."
    identity: "entity_backed:Box"
    exclusive_operations:
      - "POST /boxes/{id}/plan-change"
      - "POST /mail-items/{id}/scan-jobs"
      - "POST /mail-items/{id}/dispositions"
      - "POST /dispositions/{id}/cancel"
      - "POST /boxes/{id}/forward-shipments"
      - "POST /forward-shipments/{id}/cancel"
      - "POST /boxes/{id}/cancellation"
      - "POST /boxes/{id}/cancellation/withdraw"
    shared_operations:
      - "GET /boxes/{id}"
      - "GET /boxes/{id}/summary"
      - "GET /boxes/{id}/mail-items"
      - "GET /mail-items/{id}"
      - "GET /boxes/{id}/billing-cycles"
  - name: Recipient
    description: "A roster member acting for itself. X-User-ID is the Recipient.id; it may read only pieces whose matched_recipient_id equals its own id."
    identity: "entity_backed:Recipient"
    exclusive_operations: []
    shared_operations:
      - "GET /recipients/{id}"
      - "GET /mail-items/{id}"
      - "GET /mail-items/{id}/scan-jobs"
      - "GET /mail-items/{id}/dispositions"
