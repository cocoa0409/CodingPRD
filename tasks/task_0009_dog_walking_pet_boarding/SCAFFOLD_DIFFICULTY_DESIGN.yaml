            - "Sitter.${s6_id}.status == SUSPENDED  # link 2b — caused by link 2a crossing claim_count==2"
            - "Booking.${b6_next_id}.status == CANCELLED  # link 3 — caused by Sitter SUSPENDED"
            - "Booking.${b6_next_id}.cancellation_reason == 'AUTO_SITTER_SUSPENDED'"
            - "Owner.${o6_id}.wallet_credit_cents - ${o6_wallet_pre} == 3500  # link 4 — caused by Booking auto-cancel (BRONZE quote=3500)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: existence_vs_state_pair_meet_and_greet_create
        grounds:
          - validations[priority=3]
          - validations[priority=8]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_SITTER_NOT_CLEARED]
        distinguishing_aspect: |
          Error-category pair: (existence) vs (business_safety). A request to
          POST /api/v1/meet-and-greets with sitter_id pointing to a
          NON-EXISTENT Sitter AND lacking any CLEARED background check.
          Existence (priority 4 — FK_NOT_FOUND) wins over business_safety
          (priority 7 — SITTER_NOT_CLEARED).
        test_recipe:
          setup:
            - "Owner o7 exists; Pet p7 owned by o7."
            - "No Sitter with id 00000000-0000-0000-0000-000000000000 exists."
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "o7@example.com", full_name: "O Seven", phone: "+12025550801" }
              as: Anonymous
              captures: { o7_id: $.data.id }
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${o7_id}", name: "Charlie", species: "DOG", weight_kg: 7 }
              as: Owner
              as_user_id: "${o7_id}"
              captures: { p7_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${o7_id}", sitter_id: "00000000-0000-0000-0000-000000000000", pet_id: "${p7_id}", scheduled_at: "2026-06-08T09:00:00Z" }
              as: Owner
              as_user_id: "${o7_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_FK_NOT_FOUND  # existence wins over business_safety priority"

      - name: business_safety_vs_business_fiscal_pair_booking_create
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_MEET_AND_GREET_REQUIRED]
          - errors[ERR_WALLET_INSUFFICIENT]
        distinguishing_aspect: |
          Different error-category pair from above: (business_safety) vs
          (business_fiscal). Owner o8 creates a Booking with NO prior
          MeetAndGreet (business_safety violation) AND
          wallet_credit_applied_cents=99999 exceeding wallet balance 0
          (business_fiscal violation). business_safety (priority 8) wins
          over business_fiscal (priority 15) → ERR_MEET_AND_GREET_REQUIRED.
        test_recipe:
          setup:
            - "Owner o8 wallet_credit_cents==0; Sitter s8 ACTIVE CLEARED; Pet p8 owned by o8."
            - "NO MeetAndGreet has ever been COMPLETED_APPROVED for (o8,s8,p8)."
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "o8@example.com", full_name: "O Eight", phone: "+12025550901" }
              as: Anonymous
              captures: { o8_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "s8@example.com", full_name: "S Eight", phone: "+12025550902" }
              as: Anonymous
              captures: { s8_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${s8_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bg8_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bg8_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${o8_id}", name: "Daisy", species: "DOG", weight_kg: 11 }
              as: Owner
              as_user_id: "${o8_id}"
              captures: { p8_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: PlatformAdmin
          trigger:
