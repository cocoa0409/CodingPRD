      - name: version_increments_on_every_write_and_never_on_read
        claim_type: optimistic_concurrency
        grounds: [entities.Custodian, entities.CollateralAsset, "endpoints.POST_/collateral-assets/{id}/prices", "endpoints.GET_/custodians/{id}"]
        distinguishing_aspect: "version starts at 1 on create and advances by exactly 1 per accepted write on that row — including no-op-looking writes like re-posting the SAME market_price_bps — while any number of GETs leaves it untouched; the immutable MarkToMarketRun has no version at all."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one PENDING_APPROVAL custodian; one APPROVED depository with one US_TREASURY asset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 10000 }
              as: StateRegulator
              captures: { cust_id: $.data.id, cust_v1: $.data.version }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /collateral-assets"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", cusip: "CU-1", asset_type: "US_TREASURY", par_value_cents: 10000000, market_price_bps: 9900 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { asset_id: $.data.id, asset_v1: $.data.version }
          trigger:
            - call: "GET /custodians/${cust_id}"
              payload: {}
              as: StateRegulator
              captures: { cust_v_read: $.data.version }
            - call: "POST /custodians/${cust_id}/approve"
              payload: {}
              as: StateRegulator
              captures: { cust_v2: $.data.version }
            - call: "POST /collateral-assets/${asset_id}/prices"
              payload: { market_price_bps: 9900 }
              as: SystemOperator
              captures: { asset_v2: $.data.version }
            - call: "POST /collateral-assets/${asset_id}/prices"
              payload: { market_price_bps: 9800 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { asset_v3: $.data.version }
            - call: "GET /collateral-assets/${asset_id}"
              payload: {}
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
              captures: { asset_v_read: $.data.version }
          assert:
            - "${cust_v1} == 1 and ${asset_v1} == 1 — every entity with common_fields starts at version 1, created_at == updated_at == 2026-08-01T00:00:00Z"
            - "${cust_v_read} == 1: a GET does not bump version and does not touch updated_at"
            - "${cust_v2} == 2 after approve, with approval_status 'APPROVED' and approved_at 2026-08-01T00:00:00Z"
            - "${asset_v2} == 2 even though the posted market_price_bps 9900 is IDENTICAL to the stored value — an accepted write always advances the version and re-stamps priced_at"
            - "${asset_v3} == 3 with market_price_bps 9800, market_value_cents == 9800000 == round_half_up(10000000*9800/10000) and collateral_value_cents == 9604000 == round_half_up(9800000*(10000-200)/10000)"
            - "${asset_v_read} == 3: the read after two writes reports the last written version, and the second GET again leaves it at 3"
            - "Two different roles wrote prices (SystemOperator then BankCollateralOfficer) and the counter is per-ROW, not per-caller"

