            - { call: "POST /irops/flights/${w1}/crew-assignments", payload: { crew_member_ref: "CM9", crew_role: "CAPTAIN", duty_start_utc: "2026-08-10T06:00:00Z", duty_end_utc: "2026-08-10T14:00:00Z" }, as: CrewScheduler, captures: { a1: "$.data.id" } }
            - { call: "POST /irops/flights/${w1}/crew-assignments", payload: { crew_member_ref: "CM11", crew_role: "FIRST_OFFICER", duty_start_utc: "2026-08-10T06:00:00Z", duty_end_utc: "2026-08-10T14:00:00Z" }, as: CrewScheduler }
            - { call: "POST /irops/flights/${w2}/crew-assignments", payload: { crew_member_ref: "CM10", crew_role: "CAPTAIN", duty_start_utc: "2026-08-10T06:00:00Z", duty_end_utc: "2026-08-10T14:00:00Z" }, as: CrewScheduler, captures: { a2: "$.data.id" } }
            - { call: "POST /irops/flights/${w2}/crew-assignments", payload: { crew_member_ref: "CM12", crew_role: "FIRST_OFFICER", duty_start_utc: "2026-08-10T06:00:00Z", duty_end_utc: "2026-08-10T14:00:00Z" }, as: CrewScheduler }
            - { call: "GET /irops/flights/${w1}", as: OpsController, captures: { w1v: "$.data.version" } }
            - { call: "GET /irops/flights/${w2}", as: OpsController, captures: { w2v: "$.data.version" } }
          trigger:
            - { call: "POST /irops/flights/${w1}/delay", payload: { new_sched_dep_utc: "2026-08-10T12:00:00Z", new_sched_arr_utc: "2026-08-10T13:30:00Z", disruption_event_id: "${ev}", expected_flight_version: "${w1v}" }, as: OpsController }
            - { call: "POST /irops/flights/${w2}/delay", payload: { new_sched_dep_utc: "2026-08-10T12:00:00Z", new_sched_arr_utc: "2026-08-10T13:31:00Z", disruption_event_id: "${ev}", expected_flight_version: "${w2v}" }, as: OpsController }
            - { call: "GET /irops/crew-assignments/${a1}", as: CrewScheduler, captures: { l1: "$.data.legality_status" } }
            - { call: "GET /irops/crew-assignments/${a2}", as: CrewScheduler, captures: { l2: "$.data.legality_status" } }
            - { call: "GET /irops/flights/${w1}", as: OpsController, captures: { c1: "$.data.crew_coverage_status" } }
            - { call: "GET /irops/flights/${w2}", as: OpsController, captures: { c2: "$.data.crew_coverage_status" } }
          assert:
            - "W1 CAPTAIN assignment stays LEGAL (13:30 + 30min == 14:00 <= duty_end 14:00, inclusive boundary); W1 crew_coverage_status == CREW_OK"
            - "W2 CAPTAIN assignment becomes FLAGGED_ILLEGAL (13:31 + 30min = 14:01 > 14:00); W2 crew_coverage_status == CREW_SHORT"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: delay_missing_required_fields_returns_400_before_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]"]
        distinguishing_aspect: "Request-shape validation (priority 4) precedes existence (priority 6): a delay call missing all required body fields against a non-existent flight id returns 400 ERR_INVALID_REQUEST, not 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /irops/flights/00000000-0000-4000-8000-000000000000/delay", payload: {}, as: OpsController, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400 with error_id == ERR_INVALID_REQUEST (shape beats existence)"

      - name: seats_exact_fit_boundary
        claim_type: aggregate_validation
        grounds: ["validations[priority=21]", entities.CabinInventory.fields.seats_available]
        distinguishing_aspect: "Quota check is >= : seats_available == party_size succeeds; one seat short fails ERR_SEATS_INSUFFICIENT."
        test_recipe:
          setup: ["flight F with ECONOMY capacity 2"]
          setup_api_calls:
            - { call: "POST /irops/passengers", payload: { full_name: "Ivy I", contact_email: "ivy@x.com" }, as: ReaccommodationAgent, captures: { p1: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "Jax J", contact_email: "jax@x.com" }, as: ReaccommodationAgent, captures: { p2: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC50", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 2 }] }, as: OpsController, captures: { f: "$.data.id" } }
          trigger:
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p1}", fare_cents: 12000, cabin: "ECONOMY", party_size: 2, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p2}", fare_cents: 6000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "party_size == seats_available (2 == 2) succeeds: 201"
            - "next party_size 1 exceeds remaining 0 -> 422 ERR_SEATS_INSUFFICIENT"

      - name: connection_window_minimum_at_booking
        claim_type: temporal_validation
        grounds: ["validations[priority=26]", calculations.recovery_option_selection]
        distinguishing_aspect: "MIN_CONNECT_MINUTES = 45 inclusive: a 44-minute connection is rejected, exactly 45 minutes books fine."
        test_recipe:
          setup: ["flights S1 (arr 10:00), S2 (dep 10:44), S3 (dep 10:45)"]
          setup_api_calls:
            - { call: "POST /irops/passengers", payload: { full_name: "Kai K", contact_email: "kai@x.com" }, as: ReaccommodationAgent, captures: { p1: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "Liv L", contact_email: "liv@x.com" }, as: ReaccommodationAgent, captures: { p2: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC51", origin: "AAA", destination: "BBB", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 500, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { s1: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC52", origin: "BBB", destination: "CCC", sched_dep_utc: "2026-08-10T10:44:00Z", sched_arr_utc: "2026-08-10T11:44:00Z", distance_km: 500, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { s2: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC53", origin: "BBB", destination: "CCC", sched_dep_utc: "2026-08-10T10:45:00Z", sched_arr_utc: "2026-08-10T11:45:00Z", distance_km: 500, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { s3: "$.data.id" } }
          trigger:
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p1}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${s1}", seq_no: 1 }, { flight_id: "${s2}", seq_no: 2 }] }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p2}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${s1}", seq_no: 1 }, { flight_id: "${s3}", seq_no: 2 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
          assert:
            - "44-minute connection -> 422 ERR_CONNECTION_WINDOW_VIOLATION"
            - "45-minute connection -> 201 (inclusive minimum)"

      - name: election_window_inclusive_deadline
        claim_type: temporal_validation
        grounds: ["validations[priority=27]", entities.Booking.fields.election_deadline]
        distinguishing_aspect: "election_deadline is inclusive: an election at exactly eligible_at + 72h succeeds; one second later fails ERR_ELECTION_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Event E (MECHANICAL) ASSESSING; flight F cancelled at 2026-08-10T00:00:00Z carrying bookings B1, B2 (both ELIGIBLE_PENDING, deadline 2026-08-13T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Mia M", contact_email: "mia@x.com" }, as: ReaccommodationAgent, captures: { p1: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "Noa N", contact_email: "noa@x.com" }, as: ReaccommodationAgent, captures: { p2: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC54", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C14", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p1}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${p2}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { b2: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
          trigger:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/bookings/${b1}/refund-elections", payload: { election: "REFUND" }, as: ReaccommodationAgent, captures: { el1: "$.data.id" } }
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:01Z" }, as: OpsAdmin }
            - { call: "POST /irops/bookings/${b2}/refund-elections", payload: { election: "REFUND" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "at exactly deadline: 201 election created for B1"
            - "one second past deadline: 422 ERR_ELECTION_WINDOW_CLOSED for B2"

      - name: booking_voucher_cap_boundary
        claim_type: aggregate_validation
        grounds: ["validations[priority=29]", calculations.voucher_entitlement]
        distinguishing_aspect: "Per-booking voucher face cap 40000 is inclusive: cumulative face exactly 40000 passes; one more voucher (any type) fails ERR_VOUCHER_CAP_EXCEEDED."
        test_recipe:
          setup:
            - "Event E (MECHANICAL, cap 500000) RECOVERY; flight cancelled at 06:00; booking committed to recovery dep 2026-08-12T06:00Z (window 48h -> nights 2 capped... window 48h: nights = min(3, ceil(48/24)=2) = 2 -> 30000; plus two TRANSPORT 5000 each reach exactly 40000)"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Ola O", contact_email: "ola@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC55", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC56", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-12T06:00:00Z", sched_arr_utc: "2026-08-12T07:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C15", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 500000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent }
          trigger:
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "HOTEL", check_in_date: "2026-08-10" }, as: ReaccommodationAgent, captures: { v1: "$.data.id", f1: "$.data.face_value_cents" } }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HOTEL face == 30000 (2 nights); two TRANSPORT vouchers (5000 each) bring cumulative face to exactly 40000 — both succeed (inclusive cap)"
            - "the fourth voucher -> 422 ERR_VOUCHER_CAP_EXCEEDED (40000 + 5000 > 40000)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /irops/passengers"]
        distinguishing_aspect: "Envelope and pagination contract: meta.api_request_id present, response_type 'array', limit/offset/has_more/total_count behave with defaults limit=10."
        test_recipe:
          setup: ["three passengers created"]
          setup_api_calls:
            - { call: "POST /irops/passengers", payload: { full_name: "P One", contact_email: "p1@x.com" }, as: ReaccommodationAgent }
            - { call: "POST /irops/passengers", payload: { full_name: "P Two", contact_email: "p2@x.com" }, as: ReaccommodationAgent }
            - { call: "POST /irops/passengers", payload: { full_name: "P Three", contact_email: "p3@x.com" }, as: ReaccommodationAgent }
          trigger:
            - { call: "GET /irops/passengers?limit=2", as: DutyManager }
            - { call: "GET /irops/passengers?limit=2&offset=2", as: DutyManager }
          assert:
            - "page 1: response_type == 'array', data length 2, total_count == 3, has_more == true, meta.api_request_id present"
            - "page 2: data length 1, has_more == false, total_count == 3"
            - "default limit is 10: GET without params returns all 3 with has_more == false"

      - name: list_filter_combination
        claim_type: listing
        grounds: ["endpoints.GET /irops/bookings"]
        distinguishing_aspect: "Filters compose: passenger_id + booking_status together narrow the list to exactly the matching rows."
        test_recipe:
          setup: ["passenger PX with one DISRUPTED booking; passenger PY with one ACTIVE booking"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "PX", contact_email: "px@x.com" }, as: ReaccommodationAgent, captures: { px: "$.data.id" } }
            - { call: "POST /irops/passengers", payload: { full_name: "PY", contact_email: "py@x.com" }, as: ReaccommodationAgent, captures: { py: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC57", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f1: "$.data.id", f1v: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC58", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-11T09:00:00Z", sched_arr_utc: "2026-08-11T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f2: "$.data.id" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C16", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${px}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f1}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bx: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${py}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f2}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { by: "$.data.id" } }
            - { call: "POST /irops/flights/${f1}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${f1v}" }, as: OpsController }
          trigger:
            - { call: "GET /irops/bookings?passenger_id=${px}&booking_status=DISRUPTED", as: ReaccommodationAgent }
            - { call: "GET /irops/bookings?passenger_id=${py}&booking_status=DISRUPTED", as: ReaccommodationAgent }
          assert:
            - "first query returns exactly [${bx}] with total_count == 1"
            - "second query returns empty data with total_count == 0 (PY's booking is ACTIVE, not DISRUPTED)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: crew_release_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_CREW_STATE]", state_machines.CrewAssignment]
        distinguishing_aspect: "Releasing a RELEASED assignment -> 409 ERR_INVALID_CREW_STATE."
        test_recipe:
          setup: ["flight with one assignment, already released"]
          setup_api_calls:
            - { call: "POST /irops/flights", payload: { flight_number: "OC59", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T08:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/crew-assignments", payload: { crew_member_ref: "CM20", crew_role: "CAPTAIN", duty_start_utc: "2026-08-10T06:00:00Z", duty_end_utc: "2026-08-10T14:00:00Z" }, as: CrewScheduler, captures: { a: "$.data.id" } }
            - { call: "POST /irops/crew-assignments/${a}/release", payload: {}, as: CrewScheduler }
          trigger:
            - { call: "POST /irops/crew-assignments/${a}/release", payload: {}, as: CrewScheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "second release -> 409 ERR_INVALID_CREW_STATE"

      - name: interline_commit_blocked_when_suspended
        claim_type: violation_to_error
        grounds: ["errors[ERR_INTERLINE_AGREEMENT_INACTIVE]", "validations[priority=23]"]
        distinguishing_aspect: "Agreement ACTIVE at option generation but SUSPENDED before commit -> 422 ERR_INTERLINE_AGREEMENT_INACTIVE; option remains PROPOSED."
        test_recipe:
          setup:
            - "Event RECOVERY; booking disrupted; partner flight ZZ2 the only candidate; agreement ACTIVE at generation, then suspended"
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Raj R", contact_email: "raj@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC60", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 3200, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "ZZ2", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T16:00:00Z", distance_km: 3200, operating_carrier: "ZZ", cabins: [{ cabin: "ECONOMY", capacity: 10 }] }, as: OpsController }
