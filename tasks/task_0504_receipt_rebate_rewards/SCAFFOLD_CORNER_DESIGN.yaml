            - "response.data.error_id == ERR_CLAIM_ALREADY_TERMINAL"

  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_approve_receipt
        claim_type: peer_roles
        grounds: [roles, endpoints]
        distinguishing_aspect: "A Member calling POST /receipt-scans/{id}/approve (ReviewAgent exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A receipt scan IN_REVIEW."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "rb@x.com" }
              as: PlatformAdmin
              captures: { rb_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${rb_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 8000, purchased_at: "2026-01-01T06:00:00Z" }
              as: Member
              as_user_id: "${rb_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
          trigger:
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "x" }
              as: Member
              as_user_id: "${rb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: review_agent_cannot_create_offer
        claim_type: peer_roles
        grounds: [roles, endpoints]
        distinguishing_aspect: "A ReviewAgent calling POST /offers (PlatformAdmin exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A merchant exists."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200 }
