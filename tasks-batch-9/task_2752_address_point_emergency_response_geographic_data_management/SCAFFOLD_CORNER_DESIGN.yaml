          trigger:
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "status_code == 409"
            - "${err_id} == \"ERR_REPORT_INVALID_STATE\""
            - "QcValidationReport.${rep_id}.status == \"REJECTED\" and certified_at == null and certified_by_user_id == null"
            - "QcValidationReport.${rep_id}.defect_count == 4 and blocking_defect_count == 1 and warning_defect_count == 2 and info_defect_count == 1"
            - "QcValidationReport.${rep_id}.quality_score == 93.40   # 45.00 + 0.30*78 = 23.40 + 25.00"
            - "QcValidationReport.${rep_id}.advisory_quality_score == 96.25   # BLOCKING only: 45.00 + 26.25 + 25.00"
            - "QcValidationReport.${rep_id}.quality_tier == \"B\" and is_provisioning_eligible == false"
            - "RoadCenterline.${road_id}.status == \"DRAFT\" and qc_dirty == true"

      - name: waive_an_already_waived_defect_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors.ERR_DEFECT_INVALID_STATE
          - state_machines.QcDefect.OPEN_to_WAIVED
          - calculations.provisioning_eligibility_score
        distinguishing_aspect: "WAIVED is terminal, so the second waive is 409 ERR_DEFECT_INVALID_STATE; the first waive must already have moved the strict score UP (93.40 -> 97.15, tier B -> A) while leaving the advisory score at 96.25 and charging the A-rate 1.00 penalty (eligibility 96.15)."
        test_recipe:
          setup:
            - "The same DRAFT \"N. Maple St\" road and 4-defect ROAD-scoped GENERATED report as certify_a_rejected_report_rejected."
            - "The ROAD_UNVALIDATED defect id is read off the filtered defect listing."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N. Maple St", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
            - call: "GET /gis/qc-validation-reports/${rep_id}/defects"
              payload: { defect_code: "ROAD_UNVALIDATED" }
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { def_id: "$.data[0].id" }
          trigger:
            - call: "POST /gis/qc-defects/${def_id}/waive"
              payload: { waiver_reason: "Validation deferred to the next map cycle" }
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/qc-defects/${def_id}/waive"
              payload: { waiver_reason: "Duplicate waiver attempt" }
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first waive returns status_code 200 and QcDefect.${def_id}.status == \"WAIVED\""
            - "QcDefect.${def_id}.severity == \"BLOCKING\" and defect_category == \"ROAD\""
            - "QcDefect.${def_id}.waiver_reason == \"Validation deferred to the next map cycle\" and waived_by_user_id == \"qc-1\""
            - "the second waive returns status_code 409 with ${err_id} == \"ERR_DEFECT_INVALID_STATE\""
            - "QcDefect.${def_id}.waiver_reason is still \"Validation deferred to the next map cycle\"   # not overwritten"
            - "QcValidationReport.${rep_id}.open_blocking_defect_count == 0 and waived_blocking_count == 1"
            - "QcValidationReport.${rep_id}.quality_score == 97.15   # OPEN deduction 9.5 -> 0.30*90.5 = 27.15"
            - "QcValidationReport.${rep_id}.advisory_quality_score == 96.25   # waived BLOCKING still counted"
            - "QcValidationReport.${rep_id}.quality_tier == \"A\""
            - "QcValidationReport.${rep_id}.provisioning_eligibility_score == 96.15   # 97.15 - 1 * 1.00 at the A rate"
            - "QcValidationReport.${rep_id}.is_provisioning_eligible == true"
            - "QcValidationReport.${rep_id}.defect_count == 4   # the waiver removes it from the base, not from the report"

