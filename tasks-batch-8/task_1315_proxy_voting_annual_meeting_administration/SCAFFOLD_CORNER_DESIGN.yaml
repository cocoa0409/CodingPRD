  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails closed with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /proxy/meetings"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED; HTTP 401"

      - name: record_date_not_before_meeting_returns_record_date_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_RECORD_DATE_INVALID]"]
        distinguishing_aspect: "record_date (2026-09-16) on/after the meeting datetime (2026-09-15T16:00:00Z) violates temporal ordering at creation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Bad Date Co", ticker: "BAD", meeting_type: "ANNUAL", record_date: "2026-09-16", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RECORD_DATE_INVALID; HTTP 422"

      - name: convene_before_meeting_datetime_returns_not_yet_started
        claim_type: temporal_validation
        grounds: ["validations[priority=6]", "errors[ERR_MEETING_NOT_YET_STARTED]", "endpoints[POST /proxy/_clock/set_current_utc]"]
        distinguishing_aspect: "With the logical clock at its 2026-08-01 default (before the 2026-09-15 meeting), convene fails with ERR_MEETING_NOT_YET_STARTED — deterministic without wall-clock waits."
        test_recipe:
          setup: ["meeting in VOTING_OPEN; logical clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Early Co", ticker: "ERL", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEETING_NOT_YET_STARTED; HTTP 422"
            - "meeting status remains VOTING_OPEN"

      - name: duplicate_account_number_within_meeting_returns_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_ACCOUNT_NUMBER]"]
        distinguishing_aspect: "account_number is unique per meeting; reusing A-1001 in the same meeting fails with ERR_DUPLICATE_ACCOUNT_NUMBER."
        test_recipe:
          setup: ["DRAFT meeting with account A-1001"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Dup Acct Co", ticker: "DAC", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
