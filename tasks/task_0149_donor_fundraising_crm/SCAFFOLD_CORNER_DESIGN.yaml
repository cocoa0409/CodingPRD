        test_recipe:
          setup: ["OPEN campaign; donor D1 with a pledge; donor D2; gift cites D2 but D1's pledge"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Pm", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
