          assert:
            - "Gap 10 minutes (11:10 < 11:00 + 15): error_id == ERR_SCHEDULING_CONFLICT (captured err_gap10)"
            - "Gap exactly 15 minutes (11:15 < 11:15 is false): booking succeeds, TroubleshootingSession.${s2_id}.status == SCHEDULED"
            - "Rejected attempt did not consume entitlement: package remaining_calls == 1 after the two triggers (3 - 2 successful bookings)"

      - name: package_closed_interval_overlap
        grounds:
          - calculations.package_window_overlap
          - errors[ERR_PACKAGE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = the ClientCase's package coverage timeline; semantics = CLOSED
          date intervals with both endpoints inclusive and no buffer — a different
          geometric treatment from the sibling's strict-< buffered calendar rule.
          A new package starting 2026-08-14 conflicts with an ACTIVE package whose
