scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_proration_straight_line_vs_declining_balance
        grounds:
          - calculations.refund_proration
          - state_machines.Claim.RMA_ISSUED_to_ADJUDICATED
          - entities.CoverageTier.fields.depreciation_method
        distinguishing_aspect: |
          Two registrations with IDENTICAL purchase facts (base 50000c, elapsed 12 months, L=48)
          yield 37500c under STRAIGHT_LINE but 34692c under DECLINING_BALANCE — divergent refund
          payout driven solely by the active tier's depreciation_method on the Claim/Registration domain.
        test_recipe:
          setup:
            - "Clock at 2024-01-15. Product ELECTRONICS msrp 60000, base_warranty 12, lifespan 48."
            - "Two GOLD-style tiers on the product: GOLD_SL (STRAIGHT_LINE) and GOLD_DB (DECLINING_BALANCE), each extension 24, price 12000, cap 40000, refund_eligible true."
            - "Two registrations of the same product (distinct serials), purchase_price 50000, each owned by owner O1, each carrying a validated proof and one extension (SL on reg1, DB on reg2), both ACTIVE."
            - "A MANUFACTURING claim on each, reported 2025-01-15 (elapsed 12 months), each RMA_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE", refund_eligible: true }
              as: WarrantyAdmin
              captures: { base_tier_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "GOLD", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE", refund_eligible: true }
              as: WarrantyAdmin
              captures: { gold_sl_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "PLATINUM", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "DECLINING_BALANCE", refund_eligible: true }
              as: WarrantyAdmin
              captures: { gold_db_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-SL", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_sl_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-DB", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_db_id: $.data.id }
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_sl_id}", coverage_tier_id: "${gold_sl_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_db_id}", coverage_tier_id: "${gold_db_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
            - call: "POST /proofs"
              payload: { registration_id: "${reg_sl_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_sl_id: $.data.id }
            - call: "POST /proofs/${proof_sl_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /proofs"
              payload: { registration_id: "${reg_db_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_db_id: $.data.id }
            - call: "POST /proofs/${proof_db_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /claims"
              payload: { registration_id: "${reg_sl_id}", defect_category: "MANUFACTURING", reported_date: "2025-01-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { claim_sl_id: $.data.id }
            - call: "POST /claims"
              payload: { registration_id: "${reg_db_id}", defect_category: "MANUFACTURING", reported_date: "2025-01-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { claim_db_id: $.data.id }
            - call: "POST /claims/${claim_sl_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
            - call: "POST /claims/${claim_db_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
          trigger:
            - call: "POST /claims/${claim_sl_id}/adjudicate"
              payload: { decision: "APPROVE", resolution_type: "REFUND" }
              as: WarrantyAdmin
              captures: { sl_assessed: $.data.assessed_value_cents }
            - call: "POST /claims/${claim_db_id}/adjudicate"
              payload: { decision: "APPROVE", resolution_type: "REFUND" }
              as: WarrantyAdmin
              captures: { db_assessed: $.data.assessed_value_cents }
          assert:
            - "Claim.${claim_sl_id}.assessed_value_cents == 37500"
            - "Claim.${claim_db_id}.assessed_value_cents == 34692"
            - "Claim.${claim_sl_id}.assessed_value_cents != Claim.${claim_db_id}.assessed_value_cents"

      - name: extended_warranty_premium_refund_pro_rata_vs_short_rate
        grounds:
          - calculations.extended_warranty_premium_refund
          - state_machines.ExtendedWarranty.ACTIVE_to_CANCELLED
          - entities.CoverageTier.fields.premium_refund_method
        distinguishing_aspect: |
          Cancelling an identical extension (price 12000, term 24, elapsed 6) refunds 9000c under
          PRO_RATA but 8100c under SHORT_RATE — a second dual-variant on the ExtendedWarranty domain,
          structurally distinct from the Claim-refund proration.
        test_recipe:
          setup:
            - "Clock 2024-01-15. Product ELECTRONICS as above; BASE tier cap 20000."
            - "Two tiers each extension 24, price 12000, cap 40000: GOLD_PR (premium_refund_method PRO_RATA), GOLD_SR (SHORT_RATE)."
            - "Owner O1 holds two ACTIVE registrations (validated), each with one of the two extensions purchased at 2024-01-15."
            - "Clock advanced to 2024-07-15 (6 whole months elapsed since effective_date)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-2", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "GOLD", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE", refund_eligible: true }
              as: WarrantyAdmin
              captures: { gold_pr_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "PLATINUM", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { gold_sr_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1b@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-PR", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_pr_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-SR", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_sr_id: $.data.id }
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_pr_id}", coverage_tier_id: "${gold_pr_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { ew_pr_id: $.data.id }
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_sr_id}", coverage_tier_id: "${gold_sr_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { ew_sr_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_pr_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_pr_id: $.data.id }
            - call: "POST /proofs/${proof_pr_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /proofs"
              payload: { registration_id: "${reg_sr_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_sr_id: $.data.id }
            - call: "POST /proofs/${proof_sr_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-07-15T00:00:00Z" }
              as: WarrantyAdmin
          trigger:
            - call: "POST /extended-warranties/${ew_pr_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${o1_id}"
              captures: { pr_refund: $.data.premium_refund_cents }
            - call: "POST /extended-warranties/${ew_sr_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${o1_id}"
              captures: { sr_refund: $.data.premium_refund_cents }
          assert:
            - "ExtendedWarranty.${ew_pr_id}.premium_refund_cents == 9000"
            - "ExtendedWarranty.${ew_sr_id}.premium_refund_cents == 8100"
            - "ExtendedWarranty.${ew_pr_id}.premium_refund_cents != ExtendedWarranty.${ew_sr_id}.premium_refund_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: transfer_fee_tiered_rate_with_category_surcharge_and_floor
        grounds:
          - calculations.warranty_transfer_fee
          - state_machines.Registration.ACTIVE_to_TRANSFER_PENDING
          - entities.Product.fields.category
        distinguishing_aspect: |
          Mode (a): fee combines >=3 inputs (elapsed_months tier-selection, category surcharge,
          remaining_coverage cap) non-linearly — APPLIANCE at elapsed 20 months gives 2500 rate +
          1000 surcharge = 3500c, distinct from a single-input formula.
        test_recipe:
          setup:
            - "Clock 2024-01-15. APPLIANCE product, msrp 60000, base_warranty 12, lifespan 48."
            - "BASE tier cap 40000 (so remaining coverage does not bind the fee)."
            - "Owner O1 holds an ACTIVE validated registration; Owner O2 exists as transfer recipient."
            - "Clock advanced to 2025-09-15 -> 20 months elapsed since purchase (year1_3 tier rate 2500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "APP-1", category: "APPLIANCE", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1c@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner Two", email: "o2c@x.com" }
              as: WarrantyAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-APP", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "GET /registrations/${reg_id}"
              payload: {}
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_v: $.data.version }
          trigger:
            - call: "POST /registrations/${reg_id}/transfer"
              payload: { to_owner_user_id: "${o2_id}", expected_registration_version: "${reg_v}" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { transfer_fee: $.data.transfer_fee_cents }
          assert:
            - "WarrantyTransfer.transfer_fee_cents == 3500"
            - "Registration.${reg_id}.remaining_coverage_cents == 36500"
            - "Registration.${reg_id}.status == TRANSFER_PENDING"

      - name: adjudication_assessed_capped_by_pre_debit_remaining_coverage
        grounds:
          - calculations.refund_proration
          - calculations.remaining_coverage_reconciliation
          - state_machines.Claim.RMA_ISSUED_to_ADJUDICATED
        distinguishing_aspect: |
          Mode (c): assessed = min(round(raw), remaining_coverage) and remaining_coverage is itself
          reconciled from the DEBIT this assessment creates — the scaffold pins evaluation against the
          PRE-debit remaining (cap 30000 binds the 37500 raw to 30000), then debits, leaving remaining 0.
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS msrp 60000 base 12 lifespan 48."
            - "GOLD STRAIGHT_LINE tier extension 24, price 12000, cap 30000 (so straight-line raw 37500 is capped to 30000)."
            - "Owner O1 ACTIVE validated registration purchase_price 50000 with the GOLD extension; remaining_coverage 30000."
            - "MANUFACTURING claim reported 2025-01-15 (elapsed 12), RMA_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-3", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 10000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "GOLD", extension_months: 24, price_cents: 12000, coverage_cap_cents: 30000, depreciation_method: "STRAIGHT_LINE", refund_eligible: true }
              as: WarrantyAdmin
              captures: { gold_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1d@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-CAP", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_id}", coverage_tier_id: "${gold_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "MANUFACTURING", reported_date: "2025-01-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE", resolution_type: "REFUND" }
              as: WarrantyAdmin
              captures: { assessed: $.data.assessed_value_cents }
          assert:
            - "Claim.${claim_id}.assessed_value_cents == 30000"
            - "Registration.${reg_id}.remaining_coverage_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_branching_adjudicate_approve_vs_deny_divergent_side_effects
        grounds:
          - state_machines.Claim.RMA_ISSUED_to_ADJUDICATED
          - state_machines.Claim.RMA_ISSUED_to_DENIED
          - entities.Claim.fields.resolution_type
        distinguishing_aspect: |
          Claim is a fork at RMA_ISSUED: APPROVE -> ADJUDICATED writes resolution_type + a DEBIT ledger
          entry; DENY -> DENIED leaves resolution_type null and writes NO ledger entry — divergent
          side-effect sets per branch on the Claim entity.
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS product; GOLD STRAIGHT_LINE tier cap 40000 refund_eligible true."
            - "Two ACTIVE validated registrations of O1, each with the GOLD extension."
            - "On reg_a a MANUFACTURING claim, on reg_b a MANUFACTURING claim; both reported 2025-01-15, both RMA_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-4", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
