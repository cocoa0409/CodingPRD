          assert:
            - "${pod_status_0} == PROPOSED, ${pod_escalated_by} == acq-01 and ${pod_price} == 9000 — the escalating identity is stored even though the role used was IllBorrowingStaff"
            - "IllRequest.${req_id}.status == ESCALATED_POD immediately after the escalation"
            - "${e_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — and not ERR_UNAUTHORIZED, since AcquisitionsLibrarian is the correct role for this endpoint"
            - "GET /ill/pod-orders/${pod_id} immediately after the refusal still reports status PROPOSED with decided_by_user_id null and decided_at null, and GET /ill/bib-items/${bib_id} still reports local_holding_status NONE"
