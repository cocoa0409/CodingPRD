      - name: statement_sweep_with_reversal_reduces_gross_and_withholding
        claim_type: aggregation
        grounds:
          - calculations.statement_settlement.formula
          - calculations.statement_settlement.constants
          - endpoints["POST /music-library/royalty-statements"].side_effects
          - endpoints["POST /music-library/royalty-statements/{statement_id}/pay"].side_effects
        distinguishing_aspect: |
          A three-line sweep whose middle line is negative: gross 50000 (40000 + 25000 - 15000) with
          line_count 3 proves the negative entry is counted as a line yet subtracted from gross, and
          the withholding of 15000 must be rounded once on the post-recoupment base. The statement is
          then finalized and paid by a different user, moving lifetime_paid_cents while accrued falls to 0.
        test_recipe:
          setup:
            - "One composer with the default tax_withholding_pct 0.30 and no advance."
            - "Three manual ADJUSTMENT ledger entries at clock 2026-08-01: +40000, +25000 and -15000."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: 40000, memo: "library bonus" }
              as: RoyaltyAccountant
              captures: { le1: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: 25000, memo: "catalogue placement" }
              as: RoyaltyAccountant
              captures: { le2: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: -15000, memo: "duplicate payment clawback" }
              as: RoyaltyAccountant
              captures: { le3: $.data.id }
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c1_v: $.data.version }
          trigger:
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c1_v}" }
              as: RoyaltyAccountant
              captures: { st1: $.data.id }
            - call: "POST /music-library/royalty-statements/${st1}/finalize"
              payload: {}
              as: RoyaltyAccountant
              as_user_id: "acct-alpha"
            - call: "POST /music-library/royalty-statements/${st1}/pay"
              payload: { payment_reference: "WIRE-2026-08-0001" }
              as: RoyaltyAccountant
              as_user_id: "acct-beta"
            - call: "GET /music-library/royalty-ledger-entries/${le3}"
              payload: {}
              as: RoyaltyAccountant
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
          assert:
            - "${c1_v} == 4 (each manual ledger append increments Composer.version from 1)"
            - "RoyaltyStatement.${st1}.gross_cents == 50000, line_count == 3, recouped_cents == 0, withholding_cents == 15000, net_payable_cents == 35000 and payout_status == \"PAYABLE\""
            - "After call 2: status == \"FINALIZED\" and finalized_by_user_id == \"acct-alpha\""
            - "After call 3: status == \"PAID\", paid_by_user_id == \"acct-beta\", payment_reference == \"WIRE-2026-08-0001\" and paid_at == \"2026-08-01T00:00:00.000Z\""
            - "Call 4 → RoyaltyLedgerEntry.${le3}.statement_id == ${st1} and amount_cents == -15000 (the negative line was swept, not skipped)"
            - "Call 5 → Composer.${c1}.accrued_unpaid_cents == 0, lifetime_paid_cents == 35000 and latest_statement_period_end == \"2026-08-31T00:00:00Z\""

