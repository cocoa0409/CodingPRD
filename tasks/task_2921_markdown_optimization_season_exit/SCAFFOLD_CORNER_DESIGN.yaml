          assert:
            - "The eight single-resource reads return HTTP 404 with data.error_id equal to ERR_ZONE_NOT_FOUND, ERR_STORE_NOT_FOUND, ERR_STEP_NOT_FOUND, ERR_EXECUTION_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND and ERR_DISPOSITION_NOT_FOUND respectively"
            - "The nested list read returns HTTP 404 with data.error_id == 'ERR_PLAN_NOT_FOUND' - the unknown parent is reported, not an empty child list"
            - "Every failure carries the error envelope with response_type == 'error' and a non-empty data.message"
