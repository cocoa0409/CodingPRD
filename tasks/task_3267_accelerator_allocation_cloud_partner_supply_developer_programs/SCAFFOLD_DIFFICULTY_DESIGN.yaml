        as: PartnerProgramManager
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          fence_mid1: $.data.reserved_evaluation_units
          sku_v_r2: $.data.version
      - call: POST /accelerators/evaluation-loans/${loan_r1}/start
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/evaluation-loans/${loan_r1}/return
        payload: {}
        as: PartnerProgramManager
      - call: GET /accelerators/allocations/${sku_id}
