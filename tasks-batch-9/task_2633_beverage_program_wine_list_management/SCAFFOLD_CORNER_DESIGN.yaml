      - name: oversized_and_duplicate_claims_on_one_offer_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 55].ERR_REQUEST_EXCEEDS_OFFER
          - validations[priority 21].ERR_DUPLICATE_CLAIM
        distinguishing_aspect: >-
          requested_bottles is bounded by offered_bottles (not by the remaining unallocated pool, which
          is still untouched before allocation), and one venue gets exactly one claim per offer in ANY
          state — so the same venue's second attempt is refused even after its first claim exists and
          even when the second request would fit.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Distributor with an offer of 10 bottles, deadline 2026-09-30T00:00:00Z."
            - "Two venues HRB and GDN."
