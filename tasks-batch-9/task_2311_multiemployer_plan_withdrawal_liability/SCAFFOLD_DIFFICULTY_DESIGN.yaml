  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: contribution_record_plan_year_intervals_are_closed_and_adjacency_is_allowed
        grounds:
          - validations[priority=11]
          - errors[ERR_CONTRIBUTION_PERIOD_OVERLAP]
          - entities.ContributionRecord.fields.plan_year_start
          - entities.ContributionRecord.fields.plan_year_end
        distinguishing_aspect: |
          Interval semantics: CLOSED integer plan-year intervals on the Employer resource where
          adjacency is explicitly permitted — [2021,2023] followed by [2024,2025] both succeed
          because they touch without sharing a year, while [2023,2024] is rejected with
          ERR_CONTRIBUTION_PERIOD_OVERLAP because it shares 2023 and 2024.
