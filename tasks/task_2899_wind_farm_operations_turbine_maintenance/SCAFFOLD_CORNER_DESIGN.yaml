              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t_id}/blade-damages"
              payload: { inspection_method: "DRONE", blade_position: "C", inspected_at: "2026-08-01T02:00:00Z", damage_category: 3, damage_type: "DELAMINATION", chord_position_pct: 45.0, damage_length_mm: 900, exposed_area_cm2: 600.0 }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
              captures: { bd_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/blade-damages/${bd_id}/prioritize"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "rel-1"
              captures: { err_sod: $.data.error_id }
            - call: "POST /wind-ops/blade-damages/${bd_id}/prioritize"
              payload: {}
              as: ReliabilityEngineer
