  # =====================================================================
  # consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: pour_cascade_and_derived_fields_are_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.pattern_wear_index
          - state_machines.PumpModel.transitions.ORDERABLE_to_PATTERN_CONSTRAINED
        distinguishing_aspect: |
          Consistency is immediate with no read-your-writes lag: the single POST that books the heat must
          already report the full piece ledger in its own 201 body, and an immediate read of the pattern
          and the model must show WORN and PATTERN_CONSTRAINED - no second call, retry or delay may be
          needed for the two-level cascade to appear.
        test_recipe:
          setup:
            - "PatternAsset PAT-THIN has wear_threshold 1 and PumpModel HSC-14 is ORDERABLE with it as its only pattern."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-THIN", wear_threshold: 1 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "GET /pattern-assets/${p1_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /pump-models/${m1_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the pour returns 201 and its own body already carries qty_poured 4, qty_accepted 4, qty_scrapped 0 and status POURED"
            - "the immediate pattern read returns status WORN with pours_since_refurb 1 and wear_index 1"
            - "the immediate model read returns status PATTERN_CONSTRAINED"
            - "no retry, sleep or second write is needed between the pour and either read"
      - name: selection_computed_fields_are_present_in_the_create_response_not_only_on_reread
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.impeller_trim_and_head_prediction
          - endpoints["POST /selections"]
        distinguishing_aspect: |
          Every derived hydraulic field must be materialised inside the create response itself, and an
          immediate GET must return byte-identical values, so the ten computed columns are never left null
          for a later batch job to fill in.
