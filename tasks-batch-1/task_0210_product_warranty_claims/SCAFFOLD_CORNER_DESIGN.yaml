  # ===========================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Registration.fields.version
          - state_machines.ProofOfPurchase.SUBMITTED_to_VALIDATED
        distinguishing_aspect: |
          Registration.version starts at 1 on create and increments by 1 on each mutation: after proof
          validation (which bumps the parent), GET reports version 3 (create=1, REGISTERED->ACTIVE bubble + proof_status set count as the validate mutation -> at least 2 increments observed as >= 2).
        test_recipe:
          setup:
            - "Owner O1 fresh registration (version 1); proof submitted then validated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "PRD-X1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "X Owner1", email: "x1@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-X1", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id, v0: $.data.version }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
          trigger:
            - call: "GET /registrations/${reg_id}"
              payload: {}
              as: Owner
              as_user_id: "${o_id}"
              captures: { v1: $.data.version }
          assert:
            - "Registration.${reg_id}.version on create == 1"
            - "Registration.${reg_id}.version after proof validation > 1"
            - "Registration.${reg_id}.status == ACTIVE"

      - name: occ_correct_version_transfer_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transfer-stale-registration]
          - state_machines.Registration.ACTIVE_to_TRANSFER_PENDING
        distinguishing_aspect: |
          Supplying the current expected_registration_version (freshly read) to POST /registrations/{id}/transfer
          succeeds (201) and the version then advances — the OCC happy path complementing the 412 stale case.
        test_recipe:
          setup:
            - "Owner O1 ACTIVE validated registration; Owner O2 recipient; client reads current version immediately before transfer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "PRD-X2", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "X Owner2a", email: "x2a@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "X Owner2b", email: "x2b@x.com" }
              as: WarrantyAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-X2", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "GET /registrations/${reg_id}"
