      - name: error_talkgroup_locked_blocks_patch_creation
        claim_type: error_triggerable
        grounds:
          - validations[priority=16]
          - endpoints[POST /radio-system/interop-patches]
          - errors.ERR_TALKGROUP_LOCKED
        distinguishing_aspect: "A patch whose target talkgroup is LOCKED (lock_reason MANUAL) is refused with HTTP 409 ERR_TALKGROUP_LOCKED before any window or encryption rule is consulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Agency TLK (LAW, PATCH_AUTHORITY, 180) owns two CLEAR talkgroups on Site TLK-1; the second one has been LOCKED manually."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
