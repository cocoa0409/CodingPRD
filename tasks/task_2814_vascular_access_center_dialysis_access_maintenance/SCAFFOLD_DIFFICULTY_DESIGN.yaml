            - "Procedure.${proc_id}.coding_status == BILLED, allowed_amount_cents == 180050, billed_amount_cents == 180050, denied_amount_cents == 0, net_receivable_cents == 180050"
            - "the two dimensions moved independently: a terminal clinical_status did not block UNCODED -> CODED -> ATTESTED -> BILLED"
