# §1.9 Scaffold Corner Design (breadth probe over §1.1–§1.7 claims not covered by §1.8)
# Sections + claim_types are drawn verbatim from references/claim-extraction-guide.md.
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_physician_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Physician, endpoints]
        distinguishing_aspect: "POST /physicians with all required fields -> 201; response carries server-minted id, status ACTIVE, active_license_count 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id, st: $.data.status, alc: $.data.active_license_count, ver: $.data.version }
          assert:
            - "response status == 201"
            - "data.status == ACTIVE and data.active_license_count == 0 and data.version == 1"

      - name: create_physician_missing_npi_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Physician.fields.npi, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required npi field -> ERR_INVALID_REQUEST (422); no physician created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", home_state_code: "CA" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_physician_bad_npi_length_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Physician.fields.npi, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "npi must be exactly 10 numeric digits; a 9-digit npi -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "123456789", home_state_code: "CA" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_visit_bad_modality_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Visit.fields.modality, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "modality outside {VIDEO, AUDIO_ONLY} (e.g. PHONE) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Physician + cash patient exist."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "PHONE", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_visit_negative_list_fee_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Visit.fields.list_fee_cents, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "list_fee_cents must be > 0; a value of 0 -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Physician + cash patient exist."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 0 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: visit_default_platform_fee_zero_when_omitted
        claim_type: Defaults
        grounds: [entities.Visit.fields.platform_fee_cents]
        distinguishing_aspect: "Omitting platform_fee_cents applies the default 0; a self-pay approve then bills only the discounted clinical fee."
        test_recipe:
          setup: ["Clock 2026-04-01. Physician licensed CA. Cash patient. Visit list_fee 10000, platform_fee omitted, cleared."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id, pf: $.data.platform_fee_cents }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_id}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { cost: $.data.patient_cost_cents }
          assert:
            - "Visit.${v_id}.platform_fee_cents == 0"
            - "Visit.${v_id}.patient_cost_cents == 8000 (round_half_up(10000*0.80) + round_half_up(0*0.80))"

      - name: physician_computed_active_license_count_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Physician.fields.active_license_count]
        distinguishing_aspect: "active_license_count is server-computed; after issuing two ACTIVE licenses it reads 2 regardless of any client-supplied value at registration."
        test_recipe:
          setup: ["Physician registered, then two ACTIVE licenses issued (CA, plus compact NV)."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", imlc_eligible: true, home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "NV", issuance_type: "COMPACT_EXPEDITED", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
          trigger:
            - call: "GET /physicians/${phys_id}"
              payload: {}
              as: LicensingBoard
              captures: { alc: $.data.active_license_count }
          assert:
            - "Physician.${phys_id}.active_license_count == 2"

      - name: get_physician_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /physicians/{id} with a random UUID that was never created -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /physicians/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LicensingBoard
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: duplicate_npi_returns_duplicate_resource
        claim_type: Type Constraints
        grounds: [entities.Physician.fields.npi, "validations[priority=5]", "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "Registering a second physician with an already-used npi -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["One physician with npi 1234567890 exists."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr One", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
          trigger:
            - call: "POST /physicians"
              payload: { full_name: "Dr Two", npi: "1234567890", home_state_code: "TX" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: duplicate_patient_email_returns_duplicate_resource
        claim_type: Type Constraints
        grounds: [entities.Patient.fields.email, "validations[priority=5]", "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "Registering a second patient with an already-used email -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["One patient with email a@x.com exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat A", email: "a@x.com", residence_state_code: "CA" }
              as: Anonymous
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Pat A2", email: "a@x.com", residence_state_code: "TX" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: list_physicians_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /physicians returns a paginated array envelope with total_count and has_more; two physicians, limit 1 -> total_count 2, has_more true, one item."
        test_recipe:
          setup: ["Two physicians registered."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr One", npi: "1111111111", home_state_code: "CA" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Two", npi: "2222222222", home_state_code: "TX" }
              as: Anonymous
          trigger:
            - call: "GET /physicians?limit=1&offset=0"
              payload: {}
              as: LicensingBoard
          assert:
            - "response_type == array; total_count == 2; has_more == true; data length == 1"

      - name: clock_state_set_and_read
        claim_type: System Fields
        grounds: [entities.ClockState.fields.current_utc, endpoints]
        distinguishing_aspect: "POST /_clock/set stores current_utc; GET /_clock reads back the same instant."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-05-15T08:30:00.000Z" }
              as: Anonymous
          trigger:
            - call: "GET /_clock"
              payload: {}
              as: Anonymous
              captures: { now: $.data.current_utc }
          assert:
            - "data.current_utc == 2026-05-15T08:30:00.000Z"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: suspend_already_suspended_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.StateLicense.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending a StateLicense already in SUSPENDED -> ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Physician with a CA license already SUSPENDED."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /state-licenses/${lic_ca}/suspend"
              payload: { suspension_reason: "first" }
              as: LicensingBoard
          trigger:
            - call: "POST /state-licenses/${lic_ca}/suspend"
              payload: { suspension_reason: "second" }
              as: LicensingBoard
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: reinstate_revoked_license_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.StateLicense.ACTIVE_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal; reinstating a REVOKED StateLicense -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Physician with a CA license REVOKED."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /state-licenses/${lic_ca}/revoke"
              payload: {}
              as: LicensingBoard
          trigger:
            - call: "POST /state-licenses/${lic_ca}/reinstate"
              payload: {}
              as: LicensingBoard
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: approve_visit_before_compliance_cleared_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit.COMPLIANCE_CLEARED_to_APPROVED_SELF_PAY, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a Visit still in REQUESTED (run-compliance not yet executed) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-04-01. Physician licensed CA. Cash patient. Visit REQUESTED (not cleared)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: override_without_prior_block_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Visit.REQUESTED_to_COMPLIANCE_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "override-compliance requires the most recent ComplianceCheck to be BLOCKED; on a fresh REQUESTED visit with no prior check it -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-04-01. Physician licensed CA. Cash patient. Visit REQUESTED, no compliance check run yet."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/override-compliance"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: cancel_cleared_visit_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Visit.COMPLIANCE_CLEARED_to_CANCELLED]
        distinguishing_aspect: "Patient cancels a COMPLIANCE_CLEARED visit -> CANCELLED (terminal); subsequent approve would be invalid."
        test_recipe:
          setup: ["Clock 2026-04-01. Physician licensed CA. Cash patient. Visit cleared."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_id}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${pat_b}"
              captures: { st: $.data.status }
          assert:
            - "Visit.${v_id}.status == CANCELLED"

      - name: compact_expedited_in_home_state_returns_compact_ineligible
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=6]", "errors[ERR_COMPACT_INELIGIBLE]", entities.StateLicense.fields.issuance_type]
        distinguishing_aspect: "COMPACT_EXPEDITED license requested for the physician's own home_state_code (CA) -> ERR_COMPACT_INELIGIBLE (422)."
        test_recipe:
          setup: ["imlc_eligible physician with home_state_code CA."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", imlc_eligible: true, home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
          trigger:
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "COMPACT_EXPEDITED", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_COMPACT_INELIGIBLE"

      - name: compact_expedited_for_non_imlc_physician_returns_compact_ineligible
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=6]", "errors[ERR_COMPACT_INELIGIBLE]", entities.Physician.fields.imlc_eligible]
        distinguishing_aspect: "COMPACT_EXPEDITED license for a physician whose imlc_eligible is false (default) -> ERR_COMPACT_INELIGIBLE (422), even in a non-home state."
        test_recipe:
          setup: ["Physician with imlc_eligible omitted (defaults false), home_state_code CA."]
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
          trigger:
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "TX", issuance_type: "COMPACT_EXPEDITED", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_COMPACT_INELIGIBLE"

      - name: license_not_active_blocks_run_compliance
        claim_type: Precondition Enforcement
        grounds: [calculations.license_selection, state_machines.StateLicense.ACTIVE_to_SUSPENDED, entities.ComplianceCheck.fields.reason_code]
        distinguishing_aspect: "When the only matching CA license is SUSPENDED, run-compliance is BLOCKED with reason_code LICENSE_NOT_ACTIVE and ERR_NO_LICENSE_IN_STATE — distinct from the empty-pool NO_LICENSE_IN_STATE reason (which is the §1.8 boundary instance)."
        test_recipe:
          setup: ["Clock 2026-04-01. Physician with a CA license that is SUSPENDED. Cash patient. CA visit REQUESTED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
