  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: income_verification_accept_requires_loan_application_non_terminal
        grounds:
          - state_machines.IncomeVerification.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Entity pair = IncomeVerification ↔ LoanApplication. IncomeVerification
          can only transition PENDING → ACCEPTED if the parent LoanApplication's
          status IN {PREQUALIFIED, UNDER_REVIEW}. If the LoanApplication is
          DRAFT (not yet prequalified) the accept call fails with
          ERR_INVALID_STATE — the child transition is gated by the parent's
          state, NOT by the child's own state.
        test_recipe:
          setup:
            - "Empty DB. Applicant + LoanApplication in DRAFT (never prequalified)."
            - "One IncomeVerification on the application in PENDING."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "P", email: "p@test.com", ssn_last4: "9006", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "P7", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /income-verifications"
              payload: { application_id: "${app_id}", document_type: "W2", verified_annual_income_cents: 7800000 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { iv_id: $.data.id }
          trigger:
            - call: "POST /income-verifications/${iv_id}/accept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "IncomeVerification.${iv_id}.status == PENDING"
            - "LoanApplication.${app_id}.status == DRAFT"

      - name: clear_to_close_requires_acknowledged_closing_disclosure_with_redisclose_false
