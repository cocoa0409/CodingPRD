  # =====================================================================
  # Rule 4: Transitive cascades of depth >= 3 and >= 2 from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: order_cancel_from_deposit_pending_depth_three_cascade
        grounds:
          - state_machines.Order.DEPOSIT_PENDING_to_CANCELLED
          - state_machines.Proof.SUBMITTED_to_CANCELLED
          - entities.PaperStock.fields.reserved_units
          - entities.Customer.fields.credit_balance_cents
          - entities.AddressingJob.fields.status
          - calculations.cash_conservation_invariant
        distinguishing_aspect: |
          Trigger = POST /orders/{id}/cancel from DEPOSIT_PENDING. Depth-3 chain:
            (link 1) Order.DEPOSIT_PENDING → CANCELLED  ⇒  (caused by link 1) Proof.SUBMITTED → CANCELLED  ⇒
            (caused by link 2's status change on the Order aggregate; the AddressingJob mirror on the same aggregate)
            AddressingJob.SCHEDULED → CANCELLED. Additionally the deposit refund (link 4) moves money from
            Order.deposit_paid_cents to Customer.credit_balance_cents, and PaperStock.reserved_units decrement.
        test_recipe:
          setup:
            - "Order O7 in DEPOSIT_PENDING with deposit fully paid (41250 cents); Proof PR7 in SUBMITTED; one AddressingJob AJ7 SCHEDULED; PaperStock P7.reserved_units == 150."
          setup_api_calls:
