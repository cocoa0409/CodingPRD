          - calculations.pool_attribution
          - state_machines.AccountingPeriod.USAGE_SEALED_to_DISTRIBUTED
        distinguishing_aspect: |
          consistency_model is immediate, so there is no denormalisation lag anywhere: the calculate
          response ALREADY carries the attribution totals, the finalize response ALREADY carries the
          elected residual payee, and the very next reads — with no retry, no delay and no
          re-trigger — show the usage line attributed, the batch reconciled and the period
          distributed. A test that only passes on a second read is a failure.
