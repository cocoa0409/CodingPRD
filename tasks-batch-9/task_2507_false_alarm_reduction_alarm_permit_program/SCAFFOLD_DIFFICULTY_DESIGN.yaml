            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys_cb2}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{site_contact_id: "${bc_1}", attempted_at: "2026-05-06T02:01:00Z", outcome: "NO_ANSWER"}, {site_contact_id: "${bc_2}", attempted_at: "2026-05-06T02:04:00Z", outcome: "VOICEMAIL"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-05-06T02:00:00Z", idempotency_key: "cb-2507-two-contacts"}, as: AlarmCompanyOperator, as_user_id: "${company_cb}", captures: {dr_two: $.data.id}}
