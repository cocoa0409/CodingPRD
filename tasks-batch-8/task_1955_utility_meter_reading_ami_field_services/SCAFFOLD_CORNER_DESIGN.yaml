            - "CampaignEnrollment.${enr}.enrollment_status == WITHDRAWN"
            - "WorkOrder.${enr_wo}.work_order_status == CANCELLED"

      - name: ops_snapshot_finalize_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.OpsSnapshot.terminal_states]
        distinguishing_aspect: "Second finalize on a FINALIZED snapshot fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["snapshot created at 2026-08-02"]
          setup_api_calls:
