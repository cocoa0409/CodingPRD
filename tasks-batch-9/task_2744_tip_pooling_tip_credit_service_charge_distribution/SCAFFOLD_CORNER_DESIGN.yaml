          The 8% reporting threshold is probed at threshold-1000, exactly at threshold and at
          threshold-1 on identical sales, using reopen as the reset so the same period is measured
          three times: 7000 reported against a 8000 threshold yields a 1000 shortfall, exactly 8000
          yields 0 because the comparison is strictly-less-than, and 7999 yields exactly one cent.
          Throughout, allocated_tips_cents is proven inert — it never enters total_gross_cents and
          never enlarges tips_available_cents, so the tip credit stays 4096 in all three rounds.
        test_recipe:
          setup:
