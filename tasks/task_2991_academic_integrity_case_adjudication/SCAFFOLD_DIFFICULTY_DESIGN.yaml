  # =========================================================================
  # RULE 7 - cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: report_submit_depends_on_the_faculty_members_derived_training_status
        grounds:
          - state_machines.IntegrityReport.DRAFT_to_SUBMITTED
          - calculations.department_training_completion_pct
          - entities.FacultyMember.fields.training_status
          - validations[priority=24]
          - errors.ERR_REPORTER_TRAINING_LAPSED
        distinguishing_aspect: |
          The gate on IntegrityReport.submit lives on a DIFFERENT entity (FacultyMember) and that entity's
          gating field is not stored - training_status is derived from the newest TrainingCompletion against
          the logical clock. Nothing about the report changes between the two attempts and nobody edits the
          faculty member: advancing the clock by one day is enough to flip the reporter from CURRENT (730
          days since completion, inclusive boundary) to LAPSED (731 days), which converts a legal submit
          into ERR_REPORTER_TRAINING_LAPSED. Recording a fresh completion then re-opens the same call. An
          implementation that materialises training_status at faculty-member creation, or that only
          re-derives it when a completion is posted, passes phase 1 and fails phase 2.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one ENGL reporter whose only training completion is 2024-08-01T00:00:00Z - exactly 730 days before the clock, so training_status is CURRENT"
            - "two DRAFT PLAGIARISM reports, each already carrying one SIMILARITY_REPORT EvidenceItem (45.00 / 4 pages)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2024-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_1_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Lee Learner", email: "lee@u.edu", program_code: "BA-ENG", class_year: 2 }
              as: IntegrityOfficer
              captures: { student_2_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_1_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_1_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_1_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_2_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-21T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_2_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_2_id}", kind: "SIMILARITY_REPORT", sha256: "3333333333333333333333333333333333333333333333333333333333333333", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
          trigger:
            - call: "POST /integrity/reports/${report_1_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { phase1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/reports/${report_2_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { lapsed_error: $.data.error_id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-08-02T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/reports/${report_2_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { phase3_status: $.data.status }
          assert:
            - "phase 1 at 730 days: HTTP 200, IntegrityReport.${report_1_id}.status == SUBMITTED, submitted_at == 2026-08-01T00:00:00Z, evidence_strength_score == 60.00"
            - "phase 1: FacultyMember.${reporter_id}.training_status == CURRENT and reports_submitted_count == 1"
            - "phase 2 at 731 days: HTTP 409 with data.error_id == ERR_REPORTER_TRAINING_LAPSED"
            - "phase 2: FacultyMember.${reporter_id}.training_status == LAPSED even though no write touched the FacultyMember row - only the clock moved"
            - "phase 2: IntegrityReport.${report_2_id}.status is still DRAFT, its submitted_at is still null, its evidence_strength_score is still 0.00, and reports_submitted_count is still 1"
            - "phase 2: IntegrityReport.${report_1_id}.status is still SUBMITTED - a lapse does not retroactively invalidate an already-submitted report"
            - "phase 3 after a fresh completion: HTTP 200, IntegrityReport.${report_2_id}.status == SUBMITTED with submitted_at == 2026-08-02T00:00:00Z"
            - "phase 3: FacultyMember.${reporter_id}.training_status == CURRENT and reports_submitted_count == 2"
            - "phase 3: Department.${dept_engl_id}.training_completion_pct == 20.00 throughout phases 1 and 3 (1 current member out of faculty_headcount 5) and 0.00 in phase 2"

      - name: convene_is_blocked_while_any_advisor_engagement_sits_in_requested
        grounds:
          - state_machines.Case.HEARING_SCHEDULED_to_HEARING_IN_PROGRESS
          - state_machines.AdvisorEngagement.APPROVED_to_REQUESTED
          - state_machines.Case.HEARING_IN_PROGRESS_to_FORMAL_REFERRED
          - validations[priority=48]
          - errors.ERR_ADVISOR_REQUEST_PENDING
          - entities.AdvisorEngagement.fields.reconfirmation_required
        distinguishing_aspect: |
          A HearingSession may only be convened when NO AdvisorEngagement of its case is REQUESTED, so the
          session's own state machine is gated by a sibling entity that the convening chair does not own and
          cannot change. The dependency is re-armed by a third entity: adjourning the hearing creates a
          REHEARING_NOTICE, which drives every APPROVED engagement BACK to REQUESTED with
          reconfirmation_required true, so the identical convene call that succeeded in phase 2 fails again
          in phase 4. An implementation that treats advisor review as a one-time setup step, or that checks
          only for DENIED engagements, passes phases 1-3 and fails phase 4.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z, advanced to 2026-08-20T10:00:00Z and then to 2026-09-05T10:00:00Z"
            - "a FORMAL case on ENGL-201 with an acknowledged ALLEGATION_NOTICE, so ERR_RESPONSE_WINDOW_OPEN can never preempt the advisor check"
            - "the student has requested a FACULTY_ADVISOR, which sits in status REQUESTED and has never been reviewed"
            - "a first session is scheduled in ROOM-A for 2026-08-20T10:00:00Z-11:30:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Cora Chair", email: "cora@u.edu" }
              as: IntegrityOfficer
              captures: { chair_id: $.data.id }
            - call: "POST /integrity/faculty-members/${chair_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-02-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pat Panel One", email: "pan1@u.edu" }
              as: IntegrityOfficer
              captures: { pan1_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pia Panel Two", email: "pan2@u.edu" }
              as: IntegrityOfficer
              captures: { pan2_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pim Panel Three", email: "pan3@u.edu" }
              as: IntegrityOfficer
              captures: { pan3_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/hearing-rooms"
              payload: { code: "ROOM-A", seat_capacity: 12, buffer_minutes: 30, sessions_per_day_cap: 2 }
              as: IntegrityOfficer
              captures: { room_a_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_id}" }
              as: IntegrityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /integrity/cases/${case_id}/pathway"
              payload: { pathway: "FORMAL" }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notifications"
              payload: { kind: "ALLEGATION_NOTICE", response_window_days: 5 }
              as: IntegrityOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /integrity/notifications/${notice_id}/acknowledge"
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /integrity/advisor-engagements"
              payload: { case_id: "${case_id}", advisor_full_name: "Ada Advisor", advisor_kind: "FACULTY_ADVISOR" }
              as: Student
              as_user_id: "${student_id}"
              captures: { engagement_id: $.data.id }
            - call: "POST /integrity/hearing-sessions"
              payload: { case_id: "${case_id}", room_id: "${room_a_id}", chair_id: "${chair_id}", panelist_ids: ["${pan1_id}", "${pan2_id}", "${pan3_id}"], start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T11:30:00Z" }
              as: IntegrityOfficer
              captures: { session1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T10:00:00Z" }
              as: IntegrityOfficer
          trigger:
            - call: "POST /integrity/hearing-sessions/${session1_id}/convene"
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { blocked_error: $.data.error_id }
            - call: "POST /integrity/advisor-engagements/${engagement_id}/review"
              payload: { decision: "APPROVE" }
              as: IntegrityOfficer
              captures: { engagement_status: $.data.status }
            - call: "POST /integrity/hearing-sessions/${session1_id}/convene"
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { session1_status: $.data.status }
            - call: "POST /integrity/hearing-sessions/${session1_id}/adjourn"
              payload: { adjourn_reason: "The advisor could not attend and the student asked for a new date." }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/hearing-sessions"
              payload: { case_id: "${case_id}", room_id: "${room_a_id}", chair_id: "${chair_id}", panelist_ids: ["${pan1_id}", "${pan2_id}", "${pan3_id}"], start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-05T11:30:00Z" }
              as: IntegrityOfficer
              captures: { session2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T10:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/hearing-sessions/${session2_id}/convene"
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { rearmed_error: $.data.error_id }
          assert:
            - "phase 1: HTTP 409 with data.error_id == ERR_ADVISOR_REQUEST_PENDING; HearingSession.${session1_id}.status is still SCHEDULED and Case.${case_id}.adjudication_status is still HEARING_SCHEDULED"
            - "phase 2: AdvisorEngagement.${engagement_id}.status == APPROVED, reconfirmation_required == false, speaking_rights == false (FACULTY_ADVISOR is not an ATTORNEY)"
            - "phase 3: the identical convene call now returns HTTP 200; HearingSession.${session1_id}.status == CONVENED and Case.${case_id}.adjudication_status == HEARING_IN_PROGRESS"
            - "phase 4 after adjourn: HearingSession.${session1_id}.status == ADJOURNED, Case.${case_id}.adjudication_status == FORMAL_REFERRED, and the case has a Notification with kind REHEARING_NOTICE sent at 2026-08-20T10:00:00Z"
            - "phase 4: AdvisorEngagement.${engagement_id}.status == REQUESTED again with reconfirmation_required == true and speaking_rights == false"
            - "phase 4: HearingRoom.${room_a_id}.booked_minutes_total == 150 after the adjournment - an adjourned session keeps its room charge because the room was actually occupied"
            - "phase 4: scheduling session 2 succeeds (2026-09-05T10:00:00Z is at least 10 days after the REHEARING_NOTICE), Case.${case_id}.hearing_round == 2 and HearingRoom.${room_a_id}.booked_minutes_total == 300"
            - "phase 4: convening session 2 returns HTTP 409 with data.error_id == ERR_ADVISOR_REQUEST_PENDING; HearingSession.${session2_id}.status is still SCHEDULED"
            - "no PanelVote row exists for either session at any point"

  # =========================================================================
  # RULE 8 - resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: instructor_calendar_half_open_intervals_allow_back_to_back_meetings
        grounds:
          - validations[priority=40]
          - errors.ERR_INSTRUCTOR_CALENDAR_CONFLICT
          - endpoints[POST /integrity/case-meetings]
          - entities.CaseMeeting.fields.start_at
          - state_machines.CaseMeeting.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          The instructor calendar uses a HALF-OPEN interval [start_at, end_at), so a meeting that begins at
          the exact instant another ends does NOT conflict, while overlapping by a single minute does. The
          same 09:59-10:59 request is therefore rejected against a live calendar and accepted once the
          colliding meetings are CANCELLED, and it is accepted immediately for a DIFFERENT instructor
          because the resource is scoped per instructor_id, not per case. Contrast the room rule in the
          sibling instance, which is a CLOSED buffered interval where touching endpoints DO conflict - the
          same implementation cannot satisfy both with one shared overlap helper.
