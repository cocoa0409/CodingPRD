scenario: |
  Patent Application Filing: application types (Utility/Design/Provisional), USPTO fees (Small/Micro Entity), Office Action response, Continuation/CIP, maintenance fees, PCT international phase.

domain_name: uspto-patent-prosecution
api_prefix: ""   # endpoints declared as absolute paths (e.g. /applications, /applicants)

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Response envelope (FIXED — EMITTED VERBATIM PER §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the applicant (individual or assignee organization)."
        constraints: "Required, 2-200 chars."
      - name: entity_size
        type: enum
        source: input
        description: "Self-declared USPTO entity size determining fee multipliers."
        constraints: "One of: LARGE, SMALL, MICRO. Defaults to LARGE."
        default: LARGE
      - name: micro_qualifying_year
        type: integer
        source: input
        description: "Calendar year used to evaluate MICRO income test. Required only when entity_size=MICRO; ignored otherwise."
        constraints: "Optional. 2000 <= year <= 2100."
      - name: gross_income_prior_year_cents
        type: integer
        source: input
        description: "Applicant's prior calendar-year gross income (in USD cents). Required only when entity_size=MICRO; used by VAL-FEE-MICRO-INCOME validation."
        constraints: "Optional. Non-negative."
      - name: prior_applications_filed
        type: integer
        source: input
        description: "Count of prior non-provisional applications the applicant (or any inventor) has been named on. Used by MICRO eligibility (>4 disqualifies)."
        constraints: "Required. Non-negative."
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; identifies the owner who can act on the application."
      - name: application_type
        type: enum
        source: input
        description: "Patent type controlling fee schedule, term length, and continuation eligibility."
        constraints: "One of: UTILITY, DESIGN, PROVISIONAL, PCT_NATIONAL. Immutable after creation."
      - name: title
        type: string
        source: input
        description: "Title of the invention."
        constraints: "Required, 3-500 chars."
      - name: claim_count
        type: integer
        source: input
        description: "Total number of claims at filing; combined with independent_claim_count drives excess-claim fees."
        constraints: "Required. 1 <= claim_count <= 500."
      - name: independent_claim_count
        type: integer
        source: input
        description: "Number of independent claims at filing; drives excess-independent-claim fees (>3 charged)."
        constraints: "Required. 1 <= independent_claim_count <= claim_count."
      - name: filing_date
        type: datetime
        source: system
        description: "Server-stamped UTC instant the application was accepted (CREATE_APPLICATION). Equal to created_at; surfaced separately because business deadlines key off this field, not created_at."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status (see §1.2 Application state machine)."
        constraints: "One of: FILED, AWAITING_EXAMINATION, OFFICE_ACTION_OUTSTANDING, RESPONSE_FILED, ALLOWED, ISSUED, ABANDONED, EXPIRED, CONVERTED. Initial: FILED."
      - name: parent_application_id
        type: string
        source: input
        description: "FK -> Application.id; self-reference to the parent application when this is a CONTINUATION or CIP. Null for primary filings. Immutable."
      - name: continuation_type
        type: enum
        source: input
        description: "Continuation kind when parent_application_id is set."
        constraints: "Optional. One of: CONTINUATION, CIP. Required iff parent_application_id != null; otherwise must be null."
      - name: priority_date
        type: datetime
        source: computed
        description: "Effective priority date: equals parent_application.filing_date when continuation_type=CONTINUATION (full benefit), equals THIS filing_date when continuation_type=CIP (new-matter rule), and equals filing_date otherwise."
      - name: total_fees_paid_cents
        type: integer
        source: computed
        description: "Sum of all FeePayment.amount_cents where payment_status=POSTED for this application. Recomputed on every POST_PAYMENT side effect."
        default: 0
      - name: issued_patent_number
        type: string
        source: system
        description: "Server-minted patent number assigned when the application transitions to ISSUED. Null until ISSUED."
      - name: issue_date
        type: datetime
        source: system
        description: "UTC instant the application transitioned to ISSUED. Null until ISSUED."
      - name: term_expiration_date
        type: datetime
        source: computed
        description: "For UTILITY: priority_date + 20 years. For DESIGN: issue_date + 15 years. For PROVISIONAL: filing_date + 12 months (auto-ABANDONED unless converted). For PCT_NATIONAL: priority_date + 20 years. Null until determinable."

  - name: OfficeAction
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this OA was issued against."
      - name: action_type
        type: enum
        source: input
        description: "Examiner action category."
        constraints: "One of: NON_FINAL, FINAL, NOTICE_OF_ALLOWANCE. Immutable."
      - name: issue_date
        type: datetime
        source: system
        description: "UTC instant the OA was issued by USPTO (CREATE_OA call)."
      - name: shortened_due_date
        type: datetime
        source: computed
        description: "issue_date + 3 months (shortened statutory period). Response without extension is timely only on or before this datetime."
      - name: maximum_due_date
        type: datetime
        source: computed
        description: "issue_date + 6 months (absolute statutory maximum). Response after this is barred and triggers ABANDONMENT cascade."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the OA."
        constraints: "One of: OUTSTANDING, RESPONDED, EXPIRED, WITHDRAWN. Initial: OUTSTANDING."

  - name: OfficeActionResponse
    parent: null
    common_fields: true
    fields:
      - name: office_action_id
        type: string
        source: input
        description: "FK -> OfficeAction.id; the OA being responded to."
      - name: response_filed_at
        type: datetime
        source: system
        description: "UTC instant the response was filed."
      - name: extension_months_requested
        type: integer
        source: input
        description: "Number of one-month extensions purchased at filing (0-3). Each extension carries an extension fee per §1.3 EXTENSION_FEE."
        constraints: "Required. 0 <= extension_months_requested <= 3."
        default: 0
      - name: claim_amendment_count
        type: integer
        source: input
        description: "Total claims after amendment; used by §1.3 RESPONSE_FEE for excess-claim recalculation."
        constraints: "Required. 1 <= claim_amendment_count <= 500."
      - name: extension_fee_cents
        type: integer
        source: computed
        description: "Fee charged for extension_months_requested per §1.3 EXTENSION_FEE schedule, after entity-size discount."
      - name: response_status
        type: enum
        source: computed
        description: "ACCEPTED iff filed on or before shortened_due_date + (extension_months_requested * 1 month) AND that datetime <= maximum_due_date; REJECTED_LATE otherwise."
        constraints: "One of: ACCEPTED, REJECTED_LATE."

  - name: MaintenanceFee
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the issued UTILITY patent this fee belongs to. Only generated for UTILITY applications upon ISSUED transition."
      - name: window_number
        type: integer
        source: system
        description: "Maintenance window index: 1 (3.5 years), 2 (7.5 years), 3 (11.5 years)."
        constraints: "One of: 1, 2, 3."
      - name: window_open_date
        type: datetime
        source: computed
        description: "Issue_date + (3.5 / 7.5 / 11.5) years; window opens here. Earliest a fee can be paid without late surcharge."
      - name: window_due_date
        type: datetime
        source: computed
        description: "Issue_date + (4 / 8 / 12) years; on-time deadline. Payment between open and due = base fee; payment between due and grace = base + surcharge; payment after grace = patent EXPIRED."
      - name: window_grace_date
        type: datetime
        source: computed
        description: "window_due_date + 6 months; absolute grace cutoff. Beyond this, patent transitions EXPIRED via cascade."
      - name: base_fee_cents
        type: integer
        source: computed
        description: "MAINTENANCE_FEE constant for window_number after entity-size discount, computed at the time the fee record is generated (issuance)."
      - name: fee_status
        type: enum
        source: computed
        description: "Lifecycle of the maintenance window."
        constraints: "One of: PENDING, PAID, LAPSED. Initial: PENDING."
      - name: paid_at
        type: datetime
        source: system
        description: "UTC instant fee_status transitioned to PAID. Null while PENDING/LAPSED."

  - name: FeePayment
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this payment is credited to."
      - name: payment_category
        type: enum
        source: input
        description: "Why the fee is being paid."
        constraints: "One of: FILING, EXCESS_CLAIMS, EXTENSION, ISSUE, MAINTENANCE_W1, MAINTENANCE_W2, MAINTENANCE_W3, PCT_NATIONAL_PHASE."
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in USD cents (after entity-size discount applied by the client). Must equal the server's expected fee for (payment_category, application) per §1.3 calculations or VAL-FEE-AMOUNT-EXACT rejects."
        constraints: "Required. amount_cents > 0."
      - name: maintenance_fee_id
        type: string
        source: input
        description: "FK -> MaintenanceFee.id; required iff payment_category is MAINTENANCE_W1/W2/W3, must be null otherwise."
      - name: payment_status
        type: enum
        source: computed
        description: "POSTED on successful creation (idempotent ledger insert)."
        constraints: "One of: POSTED. Append-only."

  - name: PCTPhaseEntry
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; must reference an Application whose application_type=PCT_NATIONAL."
      - name: pct_international_filing_date
        type: datetime
        source: input
        description: "The original PCT international filing date (priority anchor for the 30-month deadline)."
        constraints: "Required. Must be strictly before this PCTPhaseEntry's created_at."
      - name: national_phase_due_date
        type: datetime
        source: computed
        description: "pct_international_filing_date + 30 months. National phase entry filing must be created on or before this datetime."
      - name: phase_status
        type: enum
        source: computed
        description: "ENTERED on successful creation when created_at <= national_phase_due_date; otherwise VAL-PCT-LATE rejects creation."
        constraints: "One of: ENTERED."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Application
    initial_state: FILED
    terminal_states: [ABANDONED, EXPIRED, CONVERTED]
    transitions:

      - from: FILED
        to: AWAITING_EXAMINATION
        trigger: "POST /applications/{id}/docket"
        actor: USPTOExaminer
        preconditions:
          - "application_type IN {UTILITY, DESIGN, PCT_NATIONAL}"
          - "total_fees_paid_cents >= FILING fee for (application_type, applicant.entity_size) per §1.3 FILING_FEE"
        side_effects:
          - "status set to AWAITING_EXAMINATION; Application.version++."

      - from: AWAITING_EXAMINATION
        to: OFFICE_ACTION_OUTSTANDING
        trigger: "POST /office-actions"
        actor: USPTOExaminer
        preconditions:
          - "Application.status == AWAITING_EXAMINATION"
          - "action_type IN {NON_FINAL, FINAL, NOTICE_OF_ALLOWANCE}"
        side_effects:
          - "OfficeAction created in OUTSTANDING; OfficeAction.shortened_due_date = issue_date + 3 months; OfficeAction.maximum_due_date = issue_date + 6 months."
          - "Application.status set to OFFICE_ACTION_OUTSTANDING; Application.version++."

      - from: OFFICE_ACTION_OUTSTANDING
        to: RESPONSE_FILED
        trigger: "POST /office-action-responses"
        actor: Applicant
        preconditions:
          - "OfficeAction.status == OUTSTANDING"
          - "response_filed_at <= OfficeAction.shortened_due_date + (extension_months_requested * 1 month)"
          - "response_filed_at <= OfficeAction.maximum_due_date"
          - "Payment with payment_category=EXTENSION and amount_cents == EXTENSION_FEE(extension_months_requested, applicant.entity_size) per §1.3 is POSTED in the same transaction iff extension_months_requested > 0"
          - "OfficeAction.action_type != NOTICE_OF_ALLOWANCE (NOAs are responded via issue-fee payment, not OA-response)"
        side_effects:
          - "OfficeActionResponse created with response_status=ACCEPTED."
          - "OfficeAction.status set to RESPONDED; OfficeAction.version++."
          - "Application.status set to RESPONSE_FILED; Application.version++."

      - from: RESPONSE_FILED
        to: OFFICE_ACTION_OUTSTANDING
        trigger: "POST /office-actions"
        actor: USPTOExaminer
        preconditions:
          - "Application.status == RESPONSE_FILED"
          - "action_type IN {NON_FINAL, FINAL, NOTICE_OF_ALLOWANCE}"
        side_effects:
          - "New OfficeAction created in OUTSTANDING; Application revisits OFFICE_ACTION_OUTSTANDING (cycle). Application.version++."
        note: "Cyclic transition — examiner can issue successive OAs until allowance or abandonment."

      - from: OFFICE_ACTION_OUTSTANDING
        to: ALLOWED
        trigger: "POST /office-actions (action_type=NOTICE_OF_ALLOWANCE) — alternate happy path when examiner allows directly"
        actor: USPTOExaminer
        preconditions:
          - "Application.status == OFFICE_ACTION_OUTSTANDING"
          - "action_type == NOTICE_OF_ALLOWANCE"
        side_effects:
          - "Prior OUTSTANDING OfficeAction(s) (excluding the NOTICE_OF_ALLOWANCE itself) set to WITHDRAWN; their versions bump by 1 each."
          - "Application.status set to ALLOWED; Application.version++."

      - from: AWAITING_EXAMINATION
        to: ALLOWED
        trigger: "POST /office-actions (action_type=NOTICE_OF_ALLOWANCE) — issued before any rejection"
        actor: USPTOExaminer
        preconditions:
          - "Application.status == AWAITING_EXAMINATION"
          - "action_type == NOTICE_OF_ALLOWANCE"
        side_effects:
          - "Application.status set to ALLOWED; Application.version++."

      - from: ALLOWED
        to: ISSUED
        trigger: "POST /applications/{id}/pay-issue-fee"
        actor: Applicant
        preconditions:
          - "Application.status == ALLOWED"
          - "FeePayment with payment_category=ISSUE and amount_cents == ISSUE_FEE(application_type, applicant.entity_size) per §1.3 is POSTED in the same transaction"
          - "expected_application_version matches Application.version (OCC)"
        side_effects:
          - "Application.issued_patent_number set (server-minted string of form 'US{seq}'); Application.issue_date stamped to UTC now."
          - "Application.term_expiration_date computed per application_type."
          - "If application_type == UTILITY: three MaintenanceFee rows created in PENDING with window_number 1/2/3 — see §1.3 MAINTENANCE_FEE."
          - "Application.status set to ISSUED; Application.version++."

      - from: OFFICE_ACTION_OUTSTANDING
        to: ABANDONED
        trigger: "system event: OfficeAction.maximum_due_date elapsed without ACCEPTED response (driven by POST /_clock/set_current_utc + POST /_jobs/sweep-deadlines)"
        actor: system
        preconditions:
          - "Application.status == OFFICE_ACTION_OUTSTANDING"
          - "current_utc > OfficeAction.maximum_due_date for at least one OUTSTANDING OfficeAction"
        side_effects:
          - "All OUTSTANDING OfficeActions on this application set to EXPIRED; each OfficeAction.version++."
          - "Application.status set to ABANDONED; Application.version++."
          - "If application has CONTINUATION children in non-terminal state, they remain unaffected (continuations are independent)."

      - from: FILED
        to: CONVERTED
        trigger: "POST /applications/{id}/convert-provisional-to-utility"
        actor: Applicant
        preconditions:
          - "Application.application_type == PROVISIONAL"
          - "current_utc <= filing_date + 12 months"
          - "Application.status == FILED"
          - "expected_application_version matches Application.version (OCC)"
        side_effects:
          - "A new Application is CREATED with application_type=UTILITY, parent_application_id=this_application.id, continuation_type=null (conversion is a distinct relationship from continuation), priority_date inherited from THIS application's filing_date."
          - "This application's status set to CONVERTED (terminal); Application.version++."

      - from: FILED
        to: EXPIRED
        trigger: "system event: PROVISIONAL filing_date + 12 months elapsed without conversion (POST /_jobs/sweep-deadlines)"
        actor: system
        preconditions:
          - "Application.application_type == PROVISIONAL"
          - "Application.status == FILED"
          - "current_utc > filing_date + 12 months"
        side_effects:
          - "Application.status set to EXPIRED; Application.version++."

      - from: ISSUED
        to: EXPIRED
        trigger: "system event: MaintenanceFee window_grace_date passed with fee_status=PENDING (POST /_jobs/sweep-deadlines)"
        actor: system
        preconditions:
          - "Application.status == ISSUED"
          - "MaintenanceFee.fee_status == PENDING for THIS application"
          - "current_utc > MaintenanceFee.window_grace_date"
        side_effects:
          - "Triggering MaintenanceFee.fee_status set to LAPSED; MaintenanceFee.version++."
          - "Application.status set to EXPIRED; Application.version++."

  - entity: OfficeAction
    initial_state: OUTSTANDING
    terminal_states: [RESPONDED, EXPIRED, WITHDRAWN]
    transitions:

      - from: OUTSTANDING
        to: RESPONDED
        trigger: "POST /office-action-responses (see Application.OFFICE_ACTION_OUTSTANDING_to_RESPONSE_FILED)"
        actor: Applicant
        preconditions:
          - "OfficeAction.status == OUTSTANDING"
          - "response timeliness predicates (see Application transition)"
        side_effects:
          - "OfficeAction.status set to RESPONDED; OfficeAction.version++."

      - from: OUTSTANDING
        to: WITHDRAWN
        trigger: "side effect of Application OFFICE_ACTION_OUTSTANDING_to_ALLOWED transition"
        actor: system
        preconditions:
          - "Application.status transitioned to ALLOWED via a Notice of Allowance superseding this OA"
        side_effects:
          - "OfficeAction.status set to WITHDRAWN; OfficeAction.version++."

      - from: OUTSTANDING
        to: EXPIRED
        trigger: "system event: maximum_due_date elapsed (see Application.OFFICE_ACTION_OUTSTANDING_to_ABANDONED cascade)"
        actor: system
        preconditions:
          - "current_utc > OfficeAction.maximum_due_date"
          - "OfficeAction.status == OUTSTANDING"
        side_effects:
          - "OfficeAction.status set to EXPIRED; OfficeAction.version++."

  - entity: MaintenanceFee
    initial_state: PENDING
    terminal_states: [PAID, LAPSED]
    transitions:

      - from: PENDING
        to: PAID
        trigger: "POST /fee-payments (payment_category=MAINTENANCE_W*)"
        actor: Applicant
        preconditions:
          - "MaintenanceFee.fee_status == PENDING"
          - "window_open_date <= current_utc"
          - "current_utc <= window_grace_date"
          - "Application.status == ISSUED"
          - "Amount-equal-expected check (VAL-FEE-AMOUNT-EXACT) where expected = base_fee + (surcharge iff current_utc > window_due_date) per §1.3 MAINTENANCE_FEE_LATE_SURCHARGE"
        side_effects:
          - "MaintenanceFee.fee_status set to PAID; MaintenanceFee.paid_at = current_utc; MaintenanceFee.version++."
          - "Application.total_fees_paid_cents recomputed; Application.version++."

      - from: PENDING
        to: LAPSED
        trigger: "system event: window_grace_date passed (POST /_jobs/sweep-deadlines)"
        actor: system
        preconditions:
          - "MaintenanceFee.fee_status == PENDING"
          - "current_utc > window_grace_date"
        side_effects:
          - "MaintenanceFee.fee_status set to LAPSED; MaintenanceFee.version++."
          - "Cascade: parent Application transitions ISSUED -> EXPIRED (see Application state machine)."

# =============================================================================
# §1.2.1 Concurrency Rules — true races (OCC-resolved)
# =============================================================================
concurrency_rules:

  - rule_id: issue-fee-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/pay-issue-fee"
    occ_field: "expected_application_version"
    description: |
      Paying the issue fee against an Application whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has already paid (legitimately advancing the parent's
      version to ISSUED) and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: convert-provisional-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/convert-provisional-to-utility"
    occ_field: "expected_application_version"
    description: |
      Converting a PROVISIONAL application whose version has advanced since
      the client last observed it is rejected; another writer may have already
      converted (legitimately consuming the conversion right per §1.4
      VAL-CONV-ONE-TIME) and the current view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: FILING_FEE
    trigger: "POST /fee-payments with payment_category=FILING"
    algorithm: tiered_pricing
    formula: |
      base = FILING_BASE_CENTS[application_type]
      multiplier =
        1.00 if applicant.entity_size == LARGE
        0.50 if applicant.entity_size == SMALL
        0.20 if applicant.entity_size == MICRO
      expected_filing_fee_cents = round_half_up(base * multiplier, 0)
    input_set: "applicant (looked up via application.applicant_id), application.application_type"
    constants:
      FILING_BASE_CENTS:
        UTILITY: 32000        # $320.00
        DESIGN: 22000         # $220.00
        PROVISIONAL: 30000    # $300.00
        PCT_NATIONAL: 32000   # $320.00 (national phase entry filing)
    precision: "Integer cents, round_half_up applied to product before cast."

  - name: EXCESS_CLAIMS_FEE
    trigger: "POST /fee-payments with payment_category=EXCESS_CLAIMS at filing time"
    algorithm: threshold
    formula: |
      excess_total = max(0, claim_count - 20)
      excess_indep = max(0, independent_claim_count - 3)
      expected_excess_fee_cents =
        round_half_up(
          (excess_total * EXCESS_CLAIM_BASE_CENTS) * ENTITY_MULTIPLIER +
          (excess_indep * EXCESS_INDEP_BASE_CENTS) * ENTITY_MULTIPLIER,
          0
        )
      # Discount-then-sum-then-round order is pinned: apply multiplier to each
      # term BEFORE adding, then round the SUM once.
    input_set: "application.claim_count, application.independent_claim_count, applicant.entity_size"
    constants:
      EXCESS_CLAIM_BASE_CENTS: 10000    # $100/claim over 20
      EXCESS_INDEP_BASE_CENTS: 48000    # $480/indep over 3
      ENTITY_MULTIPLIER:
        LARGE: 1.00
        SMALL: 0.50
        MICRO: 0.20
    precision: "Sum first (cents-precise floats), then round_half_up to integer cents."

  - name: ISSUE_FEE
    trigger: "POST /applications/{id}/pay-issue-fee"
    algorithm: tiered_pricing
    formula: |
      base = ISSUE_BASE_CENTS[application_type]   # PROVISIONAL not eligible
      multiplier = ENTITY_MULTIPLIER[entity_size]
      expected_issue_fee_cents = round_half_up(base * multiplier, 0)
    input_set: "application.application_type, applicant.entity_size"
    constants:
      ISSUE_BASE_CENTS:
        UTILITY: 120000     # $1200
        DESIGN: 74000       # $740
        PCT_NATIONAL: 120000
      ENTITY_MULTIPLIER:
        LARGE: 1.00
        SMALL: 0.50
        MICRO: 0.20

  - name: EXTENSION_FEE
    trigger: "POST /office-action-responses (computed at response filing)"
    algorithm: tiered_pricing
    formula: |
      if extension_months_requested == 0:
        expected_extension_fee_cents = 0
      else:
        base = EXTENSION_BASE_CENTS[extension_months_requested]
        multiplier = ENTITY_MULTIPLIER[entity_size]
        expected_extension_fee_cents = round_half_up(base * multiplier, 0)
    input_set: "office_action_response.extension_months_requested, applicant.entity_size"
    constants:
      EXTENSION_BASE_CENTS:
        1: 22000      # $220 for 1-month extension
        2: 64000      # $640 cumulative for 2-month
        3: 148000     # $1480 cumulative for 3-month
      ENTITY_MULTIPLIER:
        LARGE: 1.00
        SMALL: 0.50
        MICRO: 0.20
    precision: "Integer cents."

  - name: MAINTENANCE_FEE
    trigger: "system: at Application ISSUED transition (generates three records); at POST /fee-payments (payment_category=MAINTENANCE_W*) (validates amount)"
    algorithm: tiered_pricing
    formula: |
      base = MAINTENANCE_BASE_CENTS[window_number]
      multiplier = ENTITY_MULTIPLIER[entity_size]
      base_fee_cents = round_half_up(base * multiplier, 0)
      # When paid in [window_due_date, window_grace_date], add late surcharge:
      late_surcharge_cents =
        round_half_up(LATE_SURCHARGE_BASE_CENTS * multiplier, 0)
        if current_utc > window_due_date
        else 0
      expected_payment_amount_cents = base_fee_cents + late_surcharge_cents
    input_set: "maintenance_fee.window_number, applicant.entity_size, current_utc"
    constants:
      MAINTENANCE_BASE_CENTS:
        1: 200000     # $2000 at 3.5 years
        2: 376000     # $3760 at 7.5 years
        3: 772000     # $7720 at 11.5 years
      LATE_SURCHARGE_BASE_CENTS: 16000   # $160 surcharge
      ENTITY_MULTIPLIER:
        LARGE: 1.00
        SMALL: 0.50
        MICRO: 0.20
    precision: "Integer cents; surcharge rounded separately from base then summed."

  - name: PRIORITY_DATE
    trigger: "system: at CREATE_APPLICATION (sets priority_date); at MICRO eligibility test (read-only)"
    algorithm: chronological
    formula: |
      if parent_application_id is null:
        priority_date = this.filing_date
      elif continuation_type == CONTINUATION:
        priority_date = parent.filing_date   # full priority benefit
      elif continuation_type == CIP:
        priority_date = this.filing_date     # CIP carries new matter; for benchmark, all CIP claims use this filing_date
      else:
        priority_date = this.filing_date
    input_set: "application.parent_application_id, application.continuation_type, parent.filing_date, this.filing_date"
    variants:
      - name: CONTINUATION_VARIANT
        when: "continuation_type == CONTINUATION"
        difference: "Inherits parent.filing_date as priority_date (preserves earlier priority for prior-art purposes; affects term_expiration_date for UTILITY = priority_date + 20y)."
      - name: CIP_VARIANT
        when: "continuation_type == CIP"
        difference: "Uses this.filing_date as priority_date (new matter is treated as filed today; term_expiration_date = this.filing_date + 20y, NOT parent.filing_date + 20y). Same inputs (parent_id + dates) thus produce a different priority_date than CONTINUATION."

  - name: TERM_EXPIRATION
    trigger: "system: at Application ISSUED transition (sets term_expiration_date)"
    algorithm: threshold
    formula: |
      if application_type == UTILITY or application_type == PCT_NATIONAL:
        term_expiration_date = priority_date + 20 years
      elif application_type == DESIGN:
        term_expiration_date = issue_date + 15 years
      elif application_type == PROVISIONAL:
        term_expiration_date = filing_date + 12 months   # never ISSUED but used at expiry
    input_set: "application.application_type, application.priority_date, application.issue_date, application.filing_date"
    constants:
      UTILITY_TERM_YEARS: 20
      DESIGN_TERM_YEARS: 15
      PROVISIONAL_TERM_MONTHS: 12

  - name: MICRO_ELIGIBILITY
    trigger: "POST /applicants and POST /fee-payments with applicant.entity_size=MICRO (validation gate)"
    algorithm: threshold
    formula: |
      eligible = (
        applicant.gross_income_prior_year_cents is not null AND
        applicant.gross_income_prior_year_cents <= MICRO_INCOME_CEILING_CENTS AND
        applicant.prior_applications_filed <= MICRO_PRIOR_APPS_CEILING AND
        applicant.micro_qualifying_year is not null
      )
    input_set: "applicant.gross_income_prior_year_cents, applicant.prior_applications_filed, applicant.micro_qualifying_year"
    constants:
      MICRO_INCOME_CEILING_CENTS: 24600000   # $246,000 (illustrative cap)
      MICRO_PRIOR_APPS_CEILING: 4

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and equals one of the declared roles in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-ID header present (and equals an existing Applicant.id when role=Applicant)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted to call this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-templated parent resources exist (Application, OfficeAction, Applicant, MaintenanceFee), validated left-to-right."
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {id} in path"

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys exist (applicant_id, application_id, office_action_id, parent_application_id, maintenance_fee_id)."
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints with FK fields"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is permitted (per §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition-triggering POST endpoints"

  - priority: 7
    category: state
    check: "Terminal-state lockdown: no transition out of ABANDONED, EXPIRED, CONVERTED, ISSUED (except ISSUED→EXPIRED via maintenance lapse), RESPONDED, EXPIRED OA, WITHDRAWN, LAPSED."
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "all transition-triggering POST endpoints"

  - priority: 8
    category: business_referential
    check: "VAL-CONT-PARENT-PARENT_NULL — When parent_application_id is null, continuation_type MUST also be null; when parent_application_id is set, continuation_type MUST be CONTINUATION or CIP."
    error_id: ERR_CONTINUATION_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /applications"

  - priority: 9
    category: business_referential
    check: "VAL-CONT-PARENT-NOT-TERMINAL — When parent_application_id is set, the parent application MUST NOT be in {ABANDONED, EXPIRED, CONVERTED}; CIP/CONTINUATION can only be filed off a still-living parent. Parent in ISSUED is allowed (continuation off issued patent is permitted)."
    error_id: ERR_CONTINUATION_PARENT_TERMINAL
    http_status: 409
    applies_to: "POST /applications"

  - priority: 10
    category: business_safety
    check: "VAL-FEE-MICRO-INCOME — When applicant.entity_size=MICRO, MICRO_ELIGIBILITY per §1.3 must hold; reject CREATE_APPLICANT (or any subsequent CREATE_APPLICATION using this applicant) otherwise."
    error_id: ERR_MICRO_INELIGIBLE
    http_status: 422
    applies_to: "POST /applicants, POST /applications, POST /fee-payments"

  - priority: 11
    category: business_temporal
    check: "VAL-PCT-LATE — Creating a PCTPhaseEntry whose created_at > pct_international_filing_date + 30 months is rejected."
    error_id: ERR_PCT_NATIONAL_PHASE_LATE
    http_status: 422
    applies_to: "POST /pct-phase-entries"

  - priority: 12
    category: business_temporal
    check: "VAL-CONV-DEADLINE — Conversion of PROVISIONAL is only allowed within 12 months of filing_date."
    error_id: ERR_PROVISIONAL_CONVERSION_LATE
    http_status: 422
    applies_to: "POST /applications/{id}/convert-provisional-to-utility"

  - priority: 13
    category: business_constraint
    check: "VAL-CONV-ONE-TIME — A PROVISIONAL may be converted at most once (status flips to CONVERTED)."
    error_id: ERR_PROVISIONAL_ALREADY_CONVERTED
    http_status: 409
    applies_to: "POST /applications/{id}/convert-provisional-to-utility"

  - priority: 14
    category: business_temporal
    check: "VAL-MAINT-WINDOW — MaintenanceFee payment must satisfy window_open_date <= current_utc <= window_grace_date."
    error_id: ERR_MAINTENANCE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /fee-payments (MAINTENANCE_W*)"

  - priority: 15
    category: business_fiscal
    check: "VAL-FEE-AMOUNT-EXACT — FeePayment.amount_cents MUST equal the server-computed expected amount per §1.3 calculation for the given payment_category (FILING_FEE, EXCESS_CLAIMS_FEE, ISSUE_FEE, EXTENSION_FEE, MAINTENANCE_FEE). Not greater, not less."
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /fee-payments, POST /applications/{id}/pay-issue-fee"

  - priority: 16
    category: business_fiscal
    check: "VAL-CLAIMS-RANGE — independent_claim_count <= claim_count; both within [1, 500]."
    error_id: ERR_CLAIM_COUNTS_INVALID
    http_status: 422
    applies_to: "POST /applications, POST /office-action-responses (where claim_amendment_count substitutes for claim_count)"

  - priority: 17
    category: business_constraint
    check: "VAL-MAINT-WINDOW-ORDER — A later MaintenanceFee window (window_number=N) may only be PAID after the earlier window (window_number<N) for the SAME application is in {PAID}; an attempt to pay W2 while W1 PENDING is rejected."
    error_id: ERR_MAINTENANCE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /fee-payments (MAINTENANCE_W*)"

  - priority: 18
    category: business_constraint
    check: "VAL-EXTENSION-MONTHS — extension_months_requested is in {0,1,2,3}; values outside reject before §1.3 EXTENSION_FEE runs."
    error_id: ERR_EXTENSION_MONTHS_INVALID
    http_status: 422
    applies_to: "POST /office-action-responses"

  - priority: 19
    category: state
    check: "VAL-OCC-VERSION — When endpoint requires expected_<parent>_version, value MUST equal current Application.version (per §1.2.1)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/pay-issue-fee, POST /applications/{id}/convert-provisional-to-utility"

  - priority: 20
    category: business_constraint
    check: "VAL-OA-SINGLE-OUTSTANDING — At most one OfficeAction with status=OUTSTANDING may exist per Application at any time. Issuing a new non-NOTICE_OF_ALLOWANCE OA while another is OUTSTANDING is rejected; only NOTICE_OF_ALLOWANCE is permitted (which withdraws all others as a side effect)."
    error_id: ERR_OFFICE_ACTION_ALREADY_OUTSTANDING
    http_status: 409
    applies_to: "POST /office-actions"

  - priority: 21
    category: business_constraint
    check: "VAL-PCT-SINGLE-ENTRY — At most one PCTPhaseEntry may exist per Application (singleton)."
    error_id: ERR_PCT_PHASE_ENTRY_DUPLICATE
    http_status: 409
    applies_to: "POST /pct-phase-entries"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Applicants
  - method: POST
    path: "/applicants"
    description: "Create an applicant; entity_size + MICRO fields validated against MICRO_ELIGIBILITY."
    roles: [Applicant, USPTOAdmin]
    code: 201
    input: ["legal_name", "entity_size?", "micro_qualifying_year?", "gross_income_prior_year_cents?", "prior_applications_filed?"]
    output: Applicant
    side_effects:
      - "Applicant row created with version=1; entity_size defaults to LARGE when omitted; prior_applications_filed defaults to 0 when omitted."

  - method: GET
    path: "/applicants/{id}"
    description: "Read a single applicant."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants"
    description: "List applicants, paginated."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: ["limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  # --- Applications
  - method: POST
    path: "/applications"
    description: "Create a patent application. Sets filing_date=now, status=FILED, priority_date per §1.3 PRIORITY_DATE."
    roles: [Applicant]
    code: 201
    input: ["applicant_id", "application_type", "title", "claim_count", "independent_claim_count", "parent_application_id?", "continuation_type?"]
    output: Application
    side_effects:
      - "Application row created (version=1, status=FILED, filing_date=now, priority_date per §1.3)."

  - method: GET
    path: "/applications/{id}"
    description: "Read a single application."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications, supports filter by applicant_id and by parent_application_id (for continuation lookup)."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: ["applicant_id?", "parent_application_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/docket"
    description: "Examiner dockets an application for examination after filing fees are confirmed POSTED."
    roles: [USPTOExaminer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application.status FILED -> AWAITING_EXAMINATION; Application.version++."

  - method: POST
    path: "/applications/{id}/pay-issue-fee"
    description: "Applicant pays the issue fee; transitions ALLOWED -> ISSUED, stamps issued_patent_number, generates 3 MaintenanceFee rows for UTILITY. OCC-guarded."
    roles: [Applicant]
    code: 200
    input: [amount_cents, expected_application_version]
    output: Application
    side_effects:
      - "FeePayment created (payment_category=ISSUE, payment_status=POSTED)."
      - "Application.status ALLOWED -> ISSUED; Application.issued_patent_number minted; Application.issue_date stamped; Application.term_expiration_date computed; Application.version++."
      - "For UTILITY: three MaintenanceFee rows in PENDING with window_number 1/2/3, base_fee_cents per §1.3."
      - "Application.total_fees_paid_cents recomputed."

  - method: POST
    path: "/applications/{id}/convert-provisional-to-utility"
    description: "Convert a PROVISIONAL application within 12 months to a child UTILITY application. OCC-guarded."
    roles: [Applicant]
    code: 201
    input: [title, claim_count, independent_claim_count, expected_application_version]
    output: Application
    side_effects:
      - "New Application created with application_type=UTILITY, parent_application_id=<this>, continuation_type=null, status=FILED, version=1."
      - "Source Application.status FILED -> CONVERTED; Application.version++."

  # --- Office Actions
  - method: POST
    path: "/office-actions"
    description: "Examiner issues an OA against an application; sets shortened_due_date and maximum_due_date."
    roles: [USPTOExaminer]
    code: 201
    input: [application_id, action_type]
    output: OfficeAction
    side_effects:
      - "OfficeAction created (status=OUTSTANDING, issue_date=now, shortened_due_date=now+3mo, maximum_due_date=now+6mo, version=1)."
      - "Application.status -> OFFICE_ACTION_OUTSTANDING (from AWAITING_EXAMINATION or RESPONSE_FILED), OR Application.status -> ALLOWED (when action_type=NOTICE_OF_ALLOWANCE); Application.version++."
      - "When NOTICE_OF_ALLOWANCE issued while OFFICE_ACTION_OUTSTANDING: all other OUTSTANDING OAs set to WITHDRAWN; each OA.version++."

  - method: GET
    path: "/office-actions/{id}"
    description: "Read a single OA."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: []
    output: OfficeAction
    side_effects: []

  - method: GET
    path: "/office-actions"
    description: "List OAs, optionally filtered by application_id."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: OfficeAction[]
    side_effects: []

  - method: POST
    path: "/office-action-responses"
    description: "Applicant files a response (optionally with extension fee). Computes extension_fee_cents and response_status."
    roles: [Applicant]
    code: 201
    input: [office_action_id, extension_months_requested, claim_amendment_count]
    output: OfficeActionResponse
    side_effects:
      - "OfficeActionResponse created (response_status=ACCEPTED, response_filed_at=now, extension_fee_cents per §1.3)."
      - "OfficeAction.status OUTSTANDING -> RESPONDED; OfficeAction.version++."
      - "Application.status OFFICE_ACTION_OUTSTANDING -> RESPONSE_FILED; Application.version++."
      - "Application.claim_count is NOT mutated (claim_amendment_count is local to the response)."

  - method: GET
    path: "/office-action-responses/{id}"
    description: "Read a single OA response."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: []
    output: OfficeActionResponse
    side_effects: []

  - method: GET
    path: "/office-action-responses"
    description: "List responses, optionally filtered by office_action_id."
    roles: [Applicant, USPTOAdmin, USPTOExaminer]
    code: 200
    input: ["office_action_id?", "limit?", "offset?"]
    output: OfficeActionResponse[]
    side_effects: []

  # --- Maintenance Fees
  - method: GET
    path: "/maintenance-fees/{id}"
    description: "Read a single MaintenanceFee."
    roles: [Applicant, USPTOAdmin]
    code: 200
    input: []
    output: MaintenanceFee
    side_effects: []

  - method: GET
    path: "/maintenance-fees"
    description: "List MaintenanceFees, optionally filtered by application_id."
    roles: [Applicant, USPTOAdmin]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: MaintenanceFee[]
    side_effects: []

  # --- Fee Payments (ledger)
  - method: POST
    path: "/fee-payments"
    description: "Post a fee payment. Server validates amount_cents matches expected per §1.3 for (payment_category, application, entity_size, current_utc)."
    roles: [Applicant]
    code: 201
    input: ["application_id", "payment_category", "amount_cents", "maintenance_fee_id?"]
    output: FeePayment
    side_effects:
      - "FeePayment created (payment_status=POSTED, created_at=now)."
      - "Application.total_fees_paid_cents recomputed; Application.version++."
      - "When payment_category=MAINTENANCE_W*: referenced MaintenanceFee.fee_status PENDING -> PAID; MaintenanceFee.paid_at=now; MaintenanceFee.version++."

  - method: GET
    path: "/fee-payments/{id}"
    description: "Read a single FeePayment."
    roles: [Applicant, USPTOAdmin]
    code: 200
    input: []
    output: FeePayment
    side_effects: []

  - method: GET
    path: "/fee-payments"
    description: "List fee payments, optionally filtered by application_id or maintenance_fee_id."
    roles: [Applicant, USPTOAdmin]
    code: 200
    input: ["application_id?", "maintenance_fee_id?", "limit?", "offset?"]
    output: FeePayment[]
    side_effects: []

  # --- PCT National Phase
  - method: POST
    path: "/pct-phase-entries"
    description: "Record national phase entry for a PCT_NATIONAL application. Must be within 30 months of pct_international_filing_date."
    roles: [Applicant]
    code: 201
    input: [application_id, pct_international_filing_date]
    output: PCTPhaseEntry
    side_effects:
      - "PCTPhaseEntry created (phase_status=ENTERED, national_phase_due_date=pct_international_filing_date+30mo)."

  - method: GET
    path: "/pct-phase-entries/{id}"
    description: "Read a single PCT phase entry."
    roles: [Applicant, USPTOAdmin]
    code: 200
    input: []
    output: PCTPhaseEntry
    side_effects: []

  - method: GET
    path: "/pct-phase-entries"
    description: "List PCT phase entries, optionally filtered by application_id."
    roles: [Applicant, USPTOAdmin]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: PCTPhaseEntry[]
    side_effects: []

  # --- Test-driving endpoints (under /_<name>)
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: pin the server's current UTC clock. Required for deadline tests."
    roles: [USPTOAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Server's current_utc set to to_iso8601 for subsequent state evaluations."

  - method: POST
    path: "/_jobs/sweep-deadlines"
    description: "Test-driving: synchronously runs the deadline sweeper that drives system transitions (OfficeAction expiry → Application ABANDONED; PROVISIONAL 12-month expiry; MaintenanceFee grace lapse → Application EXPIRED)."
    roles: [USPTOAdmin]
    code: 200
    input: []
    output: "{ applications_abandoned: integer, applications_expired: integer, provisionals_expired: integer, maintenance_fees_lapsed: integer, office_actions_expired: integer }"
    side_effects:
      - "All cascades for elapsed deadlines fire (see §1.2 system transitions). Counters in response reflect this sweep only."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID header."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke this endpoint per §1.7."

  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Path-templated or body-referenced resource (Application, Applicant, OfficeAction, MaintenanceFee, OfficeActionResponse, PCTPhaseEntry) does not exist."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which this transition is permitted per §1.2."

  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "Attempt to transition out of a terminal state (ABANDONED, EXPIRED, CONVERTED, RESPONDED, WITHDRAWN, LAPSED, ISSUED via non-maintenance path)."

  - id: ERR_CONTINUATION_TYPE_MISMATCH
    http: 422
    condition: "parent_application_id and continuation_type are not both null nor both set; or continuation_type not in {CONTINUATION, CIP}."

  - id: ERR_CONTINUATION_PARENT_TERMINAL
    http: 409
    condition: "parent_application_id references an Application in {ABANDONED, EXPIRED, CONVERTED}."

  - id: ERR_MICRO_INELIGIBLE
    http: 422
    condition: "applicant.entity_size=MICRO but MICRO_ELIGIBILITY predicate fails (income > ceiling, prior_apps > 4, or missing micro_qualifying_year)."

  - id: ERR_PCT_NATIONAL_PHASE_LATE
    http: 422
    condition: "PCTPhaseEntry creation more than 30 months after pct_international_filing_date."

  - id: ERR_PROVISIONAL_CONVERSION_LATE
    http: 422
    condition: "Conversion attempted more than 12 months after PROVISIONAL filing_date."

  - id: ERR_PROVISIONAL_ALREADY_CONVERTED
    http: 409
    condition: "PROVISIONAL application already in CONVERTED state — single-shot rule."

  - id: ERR_MAINTENANCE_WINDOW_CLOSED
    http: 409
    condition: "MaintenanceFee payment outside [window_open_date, window_grace_date]."

  - id: ERR_FEE_AMOUNT_MISMATCH
    http: 422
    condition: "FeePayment.amount_cents != server-expected per §1.3 calculation."

  - id: ERR_CLAIM_COUNTS_INVALID
    http: 422
    condition: "claim_count or independent_claim_count out of range, or independent_claim_count > claim_count."

  - id: ERR_MAINTENANCE_OUT_OF_ORDER
    http: 409
    condition: "Maintenance window N payment attempted while earlier window (N-1) on same application is PENDING."

  - id: ERR_EXTENSION_MONTHS_INVALID
    http: 422
    condition: "extension_months_requested not in {0,1,2,3}."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not match current parent.version (see §1.2.1)."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body (missing required field, wrong type, unknown field)."

  - id: ERR_OFFICE_ACTION_ALREADY_OUTSTANDING
    http: 409
    condition: "Attempt to issue a non-NOTICE_OF_ALLOWANCE OA against an Application that already has an OUTSTANDING OfficeAction."

  - id: ERR_PCT_PHASE_ENTRY_DUPLICATE
    http: 409
    condition: "A PCTPhaseEntry already exists for the referenced Application."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Files patent applications, pays fees, responds to office actions, requests PCT national phase entry, and converts provisionals. Acts ONLY on Applications whose applicant_id equals X-User-ID."
    identity: "entity_backed:Applicant"
    exclusive_operations:
