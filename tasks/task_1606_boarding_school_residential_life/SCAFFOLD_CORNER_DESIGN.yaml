      - name: day_pass_does_not_consume_weekend_allowance
        claim_type: input_set_filtering
        grounds: ["calculations.weekend_leaves_used"]
        distinguishing_aspect: "Only WEEKEND_OVERNIGHT enters the used counter: a fully APPROVED DAY_PASS leaves weekend_leaves_used at 0 while the leave itself reaches APPROVED."
