      - name: transmission_group_demand_exact_equality_admits
        grounds:
          - calculations.transmission_overlap_capacity
          - calculations.utility_capacity_ledger
          - validations[priority=34]
        distinguishing_aspect: |
          Group demand of exactly 400.0 MW against a 400 MW utility is ADMITTED (the rule is <=)
          and drives available_capacity_mw to exactly 0.0, while the very next request of 101 MW
          over an overlapping window is refused — the boundary is proven from both sides on the
          same utility in MW units.
