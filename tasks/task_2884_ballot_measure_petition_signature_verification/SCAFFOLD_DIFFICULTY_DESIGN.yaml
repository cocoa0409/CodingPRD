  - rule_id: combinatorial_formula
    instances:

      - name: per_batch_rounding_before_summation_on_cost_ledger
        grounds:
          - calculations.batch_verification_cost
          - entities.SignatureBatch.fields.verification_cost_cents
          - entities.Petition.fields.verification_cost_accrued_cents
          - entities.VerificationRound.fields.accrued_cost_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the result: the millicent rate is converted
          to cents with round_half_up once per batch and only then summed, so two batches of two
          examined lines accrue 10 + 10 == 20 cents, whereas rounding the four-line total in one step
          gives round_half_up(4 * 4750 / 1000) == 19 cents.
