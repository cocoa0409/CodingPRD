        distinguishing_aspect: "Half-open [starts_at, ends_at) interval semantics on Session: a member already enrolled in session A [16:00,18:00) is rejected enrolling in session B [17:00,19:00) (overlap) with ERR_MEMBER_SCHEDULE_CONFLICT, but an adjacent session C [18:00,20:00) is ALLOWED (end==start, end-exclusive) — adjacency permitted."
        test_recipe:
          setup:
            - "Center capacity ample; one member on the program; three OPEN sessions A [16,18), B [17,19), C [18,20) on the same day. Member enrolled in A. Enrolling in B must fail (overlap); enrolling in C must succeed (adjacent)."
