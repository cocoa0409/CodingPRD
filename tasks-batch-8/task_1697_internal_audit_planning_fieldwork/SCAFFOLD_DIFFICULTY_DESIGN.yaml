            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 60 }, as: AuditManager, as_user_id: "${mgr1}" }
