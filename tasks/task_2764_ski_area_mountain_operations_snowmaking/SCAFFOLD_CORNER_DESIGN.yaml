      - name: the_active_day_plan_selector_excludes_draft_and_day_closed_plans
        claim_type: correct_result
        grounds:
          - calculations.active_day_plan_selector
          - errors[ERR_DAY_PLAN_NOT_PUBLISHED]
          - validations[priority=16]
          - state_machines.DayPlan.PUBLISHED_PARTIAL_to_DAY_CLOSED
        distinguishing_aspect: |
          Ranking is operating_date DESC over published postures only. A DRAFT plan for the NEXT
          operating day is created first, so a selector that ranked before filtering would pick it and
          read a wet bulb of 32.0 - which would reject the session start. Instead the 08-01 plan must
          stay active and the resume must succeed. After that plan is closed, both remaining candidates
          are excluded (one DAY_CLOSED, one DRAFT) and the very same resume call must fail with
          ERR_DAY_PLAN_NOT_PUBLISHED, proving the empty-candidate branch.
