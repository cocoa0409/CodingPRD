# =============================================================================
# Scaffold: Carpet Tile Take-Back Program & Product Carbon Accounting
# Difficulty target: beyond Expert — dense coupling across 12 entities,
# dual-variant carbon/credit calculations, 3 transitive cascades, 3 OCC rules.
# =============================================================================

scenario: |
  Carpet Tile Take-Back Program & Product Carbon Accounting (Interface): modular carpet tile design enabling selective replacement rather than full floor removal with dye lot and pattern matching, take-back program collecting used tiles from customers with logistics, sorting and recycling pathways, recycled content sourcing including reclaimed fishing nets and post-consumer material with supply reliability, product carbon footprint computation with third-party verification and declaration publication, carbon-negative product claims requiring lifecycle boundary definitions and offset treatment disclosure, specification selling to architects and designers with sustainability documentation packages, installation contractor network with adhesive-free systems, manufacturing energy and emissions reduction targets tied to product claims

domain_name: carpet-tile-takeback-carbon
api_prefix: /carpetloop

complexity_profile:
  primary_archetype: compliance_audit        # claims, third-party verification, disclosure, segregation of duties
  secondary_archetype: quota_allocation      # batch m2, feedstock kg, budget cents reserved/committed/released
  complexity_layers:
    - dual_variant_calculation               # PCF operational-vs-lifecycle; take-back credit standard-vs-circular
    - cascading_side_effects                 # publish -> supersede -> retire -> revoke; reading -> breach -> revert
    - optimistic_concurrency                 # create-with-supersede on reports, packages, replacement orders
    - derived_field_reconciliation           # available_m2, allocated_kg, spent_cents, coverage recomputed per mutation
  entity_topology: flat                      # peer entities with FK references; InstalledZone is a Site x TileBatch junction
  state_machine_shape: cyclic                # claim reject/resubmit loop, order rematch loop, lot depletion restore
  relationship_patterns:
    - one_to_many                            # collection -> batches; site -> zones; claim -> offsets
    - many_to_many                           # InstalledZone joins CustomerSite x TileBatch; FeedstockLot mix joins lots x batches
    - cross_aggregate                        # claims -> reports/targets; packages -> reports/claims
  role_model: segregation_of_duties          # report submitter cannot verify; claim creator cannot approve
  consistency_model: immediate               # all mutations visible in the same response

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# common_fields: true => id, created_at, updated_at, version (starts 1,
# +1 on every mutation of the entity's own stored fields, cascades included)
# =============================================================================
entities:
  - name: ProductCollection
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Collection display name" }
      - { name: pattern_code, type: string, source: input, description: "Pattern family code shared by all dye lots of this collection" }
      - { name: backing_type, type: enum, source: input, description: "STANDARD | ADHESIVE_FREE_CAPABLE — backing system of the tile" }
      - { name: lifecycle_boundary, type: enum, source: input, description: "CRADLE_TO_GATE | CRADLE_TO_GRAVE — documentary default boundary for the reporting program; reports and claims each bind their own boundary explicitly" }
      - { name: claim_intent, type: enum, source: input, default: NONE, description: "NONE | CARBON_NEUTRAL | CARBON_NEGATIVE — selects the take-back credit variant for returns declared under this collection" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUNSET — SUNSET blocks new batches and new PCF reports" }

  - name: TileBatch
    parent: ProductCollection
    common_fields: true
    fields:
      - { name: collection_id, type: string, source: system, description: "FK -> ProductCollection.id; taken from the creation path" }
      - { name: dye_lot_code, type: string, source: input, description: "Dye lot identifier; unique within the collection (ERR_DYE_LOT_CONFLICT)" }
      - { name: production_date, type: datetime, source: input, description: "Production date; report input_set membership uses [period_start, period_end) half-open comparison" }
      - { name: produced_m2, type: number, source: input, description: "Square meters produced; > 0" }
      - { name: mfg_intensity_kgco2e_per_m2, type: number, source: input, description: "Manufacturing energy emissions intensity of this production run; > 0" }
      - { name: delta_e, type: number, source: input, description: "Measured color distance of this lot vs the collection standard; >= 0" }
      - { name: feedstock_mix, type: array, source: system, description: "Bill of materials: entries {lot_id, quantity_kg}; mutated only while QUARANTINE via allocate/deallocate" }
      - { name: allocated_mass_kg, type: number, source: computed, description: "Sum of feedstock_mix quantities; must equal produced_m2 x TILE_MASS_KG_PER_M2 (2dp) before release" }
      - { name: available_m2, type: number, source: computed, description: "produced_m2 minus zone layings and matched-order reservations; restored by order cancel" }
      - { name: recycled_content_pct, type: number, source: computed, description: "Per calculation batch_recycled_content; 2dp half-up" }
      - { name: embodied_carbon_kg_per_m2, type: number, source: computed, description: "Per calculation batch_embodied_carbon; stored at 3dp and consumed at that precision by pcf_footprint" }
      - { name: status, type: enum, source: system, default: QUARANTINE, description: "QUARANTINE | RELEASED | EXHAUSTED — EXHAUSTED auto at available_m2 == 0, reverts to RELEASED when availability returns" }

  - name: FeedstockLot
    parent: null
    common_fields: true
    fields:
      - { name: supplier_name, type: string, source: input, description: "Supplier identity; reliability stats group on this exact string" }
      - { name: source_type, type: enum, source: input, description: "RECLAIMED_FISHING_NET | POST_CONSUMER_TILE | POST_INDUSTRIAL_SCRAP | VIRGIN" }
      - { name: quantity_kg, type: number, source: input, description: "Total received kilograms; > 0; system-set when created by the sort cascade" }
      - { name: carbon_factor_kgco2e_per_kg, type: number, source: input, description: "Emissions factor of this feedstock; >= 0" }
      - { name: origin_takeback_id, type: string, source: system, description: "Informational id of the TakeBackRequest whose depolymerized mass created this lot; null for directly posted lots", default: null }
      - { name: supplier_reliability_pct, type: number, source: computed, description: "At creation: 100 x passed kg / decided kg over prior lots of same supplier_name in QC_PASSED|QC_FAILED; 100.00 when no prior decided lots; 2dp half-up" }
      - { name: available_kg, type: number, source: computed, description: "quantity_kg - allocated_kg" }
      - { name: allocated_kg, type: number, source: computed, default: 0, description: "Kilograms currently allocated into batch mixes" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | QC_PASSED | QC_FAILED | DEPLETED — DEPLETED auto at available_kg == 0 with allocated_kg > 0, reverts to QC_PASSED on deallocate" }

  - name: CustomerSite
    parent: null
    common_fields: true
    fields:
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating Specifier; ownership anchor for specifier-side operations" }
      - { name: contractor_name, type: string, source: input, description: "Installation contractor identity; Installer X-User-ID must equal this for installer-side operations" }
      - { name: address, type: string, source: input, description: "Site address" }
      - { name: install_window_start, type: datetime, source: input, description: "Install window start; closed interval" }
      - { name: install_window_end, type: datetime, source: input, description: "Install window end; closed interval, must be >= start" }
      - { name: installation_system, type: enum, source: input, description: "ADHESIVE_FREE | CONVENTIONAL" }
      - { name: adhesive_free_certified, type: boolean, source: input, description: "Contractor certification snapshot for adhesive-free systems" }
      - { name: cert_expires_on, type: datetime, source: input, description: "Contractor certification expiry; compared against install_window_start at install time" }
      - { name: annual_replacement_budget_cents, type: integer, source: input, description: "Yearly budget for selective replacement; >= 0" }
      - { name: spent_replacement_cents, type: integer, source: computed, default: 0, description: "Sum of quoted_cost_cents over COMPLETED replacement orders of this site" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | INSTALLED | IN_SERVICE | DECOMMISSIONED" }

  - name: InstalledZone
    parent: CustomerSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> CustomerSite.id; taken from the creation path" }
      - { name: batch_id, type: string, source: input, description: "FK -> TileBatch.id; the dye lot this zone was laid from" }
      - { name: zone_code, type: string, source: input, description: "Zone identifier; unique among this site's zones with status IN_SERVICE (ERR_ZONE_CODE_CONFLICT)" }
      - { name: area_m2, type: number, source: input, description: "Zone area; > 0; debited from batch availability at creation" }
      - { name: status, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | REPLACED | RECLAIMED — terminal states set only by system transitions" }

  - name: ReplacementOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> CustomerSite.id" }
      - { name: zone_id, type: string, source: input, description: "FK -> InstalledZone.id; the zone to be selectively replaced" }
      - { name: reason, type: enum, source: input, description: "WEAR | DAMAGE | DESIGN_CHANGE" }
      - { name: new_zone_code, type: string, source: input, description: "Zone code for the replacement laying created at completion" }
      - { name: matched_batch_id, type: string, source: system, default: null, description: "FK -> TileBatch.id; set by the match action from calculation dye_lot_match" }
      - { name: quoted_cost_cents, type: integer, source: computed, default: null, description: "Set at match per calculation replacement_quote; integer cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | MATCHED | MATCH_FAILED | COMPLETED | CANCELLED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating Specifier" }

  - name: TakeBackRequest
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> CustomerSite.id" }
      - { name: collection_id, type: string, source: input, description: "FK -> ProductCollection.id; declared collection of the returned tiles (declaration only; drives credit variant and recovery share)" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C — drives the credit rate" }
      - { name: declared_area_m2, type: number, source: input, description: "Declared return area; > 0" }
      - { name: pickup_window_start, type: datetime, source: system, default: null, description: "Set at schedule" }
      - { name: pickup_window_end, type: datetime, source: system, default: null, description: "Set at schedule" }
      - { name: collected_kg, type: number, source: system, default: null, description: "Set at collect; > 0" }
      - { name: reuse_kg, type: number, source: system, default: null, description: "Sorted mass to reuse pathway; set at sort" }
      - { name: depolymerize_kg, type: number, source: system, default: null, description: "Sorted mass to depolymerization; creates a FeedstockLot when > 0" }
      - { name: downcycle_kg, type: number, source: system, default: null, description: "Sorted mass to downcycling" }
      - { name: landfill_kg, type: number, source: system, default: null, description: "Sorted mass to landfill" }
      - { name: credit_variant, type: enum, source: computed, default: null, description: "STANDARD | CIRCULAR — recorded at sort; selected by collection claim_intent" }
      - { name: credit_cents, type: integer, source: computed, default: null, description: "Customer credit computed at sort per calculation takeback_credit" }
      - { name: credited_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of the sort transition; recovery-share windows use this" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SCHEDULED | COLLECTED | CREDITED | CANCELLED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating Specifier" }

  - name: PCFReport
    parent: null
    common_fields: true
    fields:
      - { name: collection_id, type: string, source: input, description: "FK -> ProductCollection.id" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start; half-open [start, end)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end; must be > start" }
      - { name: boundary, type: enum, source: input, description: "CRADLE_TO_GATE | CRADLE_TO_GRAVE — boundary this report declares" }
      - { name: operational_kgco2e_per_m2, type: number, source: computed, default: null, description: "OPERATIONAL variant value; computed at submit, 3dp" }
      - { name: lifecycle_kgco2e_per_m2, type: number, source: computed, default: null, description: "LIFECYCLE variant value; computed at submit, 3dp" }
      - { name: submitted_by, type: string, source: system, default: null, description: "X-User-ID at submit; segregation-of-duties anchor" }
      - { name: verifier_org, type: string, source: system, default: null, description: "Third-party verifier organization; set at verification ASSIGN" }
      - { name: verified_by, type: string, source: system, default: null, description: "X-User-ID of the Verifier who cleared the report" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | IN_VERIFICATION | VERIFIED | REJECTED | PUBLISHED | SUPERSEDED" }

  - name: CarbonClaim
    parent: null
    common_fields: true
    fields:
      - { name: collection_id, type: string, source: input, description: "FK -> ProductCollection.id" }
      - { name: report_id, type: string, source: input, description: "FK -> PCFReport.id; the footprint declaration this claim rests on" }
      - { name: manufacturing_target_id, type: string, source: input, default: null, description: "FK -> ManufacturingTarget.id; required iff claim_type == CARBON_NEGATIVE" }
      - { name: claim_type, type: enum, source: input, description: "CARBON_NEUTRAL | CARBON_NEGATIVE" }
      - { name: claimed_volume_m2, type: number, source: input, description: "Production volume the claim covers; > 0" }
      - { name: boundary, type: enum, source: input, description: "CRADLE_TO_GATE | CRADLE_TO_GRAVE — must equal the referenced report's boundary; CARBON_NEGATIVE claims must use CRADLE_TO_GRAVE" }
      - { name: required_offset_kgco2e, type: number, source: computed, default: null, description: "Computed at submit per calculation claim_offset_requirement" }
      - { name: retired_kgco2e, type: number, source: computed, default: 0, description: "Sum of quantity_kgco2e over this claim's OffsetRetirement records" }
      - { name: offset_coverage, type: enum, source: computed, default: NONE, description: "NONE | PARTIAL | FULL — derived from retired vs required" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating SustainabilityManager; segregation-of-duties anchor" }
      - { name: reviewed_by, type: string, source: system, default: null, description: "X-User-ID of the ClaimsApprover who reviewed" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_REVIEW | APPROVED | REJECTED | PUBLISHED | RETIRED" }

  - name: OffsetRetirement
    parent: CarbonClaim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> CarbonClaim.id; taken from the creation path" }
      - { name: registry, type: enum, source: input, description: "VERRA | GOLD_STANDARD | ACR" }
      - { name: vintage_year, type: integer, source: input, description: "Offset vintage; >= 2020" }
      - { name: quantity_kgco2e, type: number, source: input, description: "Retired quantity; > 0; offsets retire immediately at creation" }
      - { name: retired_at, type: datetime, source: system, description: "Logical clock timestamp of retirement (creation)" }

  - name: ManufacturingTarget
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Reduction program name" }
      - { name: baseline_intensity_kgco2e_per_m2, type: number, source: input, description: "Baseline manufacturing intensity; > 0" }
      - { name: target_reduction_pct, type: number, source: input, description: "Target reduction fraction; 0 < pct < 1" }
      - { name: current_intensity_kgco2e_per_m2, type: number, source: computed, description: "Baseline until the first reading; then the latest reading by period_end (tie-break: recorded order, latest last)" }
      - { name: posture, type: enum, source: computed, description: "ON_TRACK | AT_RISK | BREACHED — per calculation target_posture; initial AT_RISK" }
      - { name: readings_log, type: array, source: system, description: "Append-only readings: {period_end, intensity_kgco2e_per_m2, recorded_at}" }

  - name: SpecPackage
    parent: null
    common_fields: true
    fields:
      - { name: architect_firm, type: string, source: input, description: "Architect/designer firm identity the package is issued to" }
      - { name: collection_id, type: string, source: input, description: "FK -> ProductCollection.id" }
      - { name: report_id, type: string, source: input, description: "FK -> PCFReport.id; must be PUBLISHED at issuance" }
      - { name: claim_id, type: string, source: input, default: null, description: "FK -> CarbonClaim.id; optional, must be PUBLISHED at issuance when provided" }
      - { name: package_version, type: integer, source: computed, description: "Per-(architect_firm, collection_id) issuance sequence starting at 1" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | SUPERSEDED | REVOKED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating Specifier" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProductCollection
    initial_state: ACTIVE
    terminal_states: [SUNSET]
    transitions:
      - from: ACTIVE
        to: SUNSET
        trigger: "POST /carpetloop/collections/{collection_id}/sunset"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments ProductCollection.version by 1"
        note: "SUNSET blocks new TileBatch creation and new PCFReport creation (ERR_COLLECTION_SUNSET); existing published reports/claims/packages are unaffected."

  - entity: TileBatch
    initial_state: QUARANTINE
    terminal_states: []
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /carpetloop/batches/{batch_id}/release"
        actor: PlatformAdmin
        preconditions:
          - "collection.status == ACTIVE (ERR_COLLECTION_SUNSET)"
          - "allocated_mass_kg == produced_m2 x TILE_MASS_KG_PER_M2 compared at 2 decimal places (ERR_MIX_MASS_MISMATCH)"
        side_effects:
          - "recompute recycled_content_pct (calculation batch_recycled_content)"
          - "recompute embodied_carbon_kg_per_m2 (calculation batch_embodied_carbon)"
      - from: RELEASED
        to: EXHAUSTED
        trigger: "system: automatic when available_m2 reaches 0 (zone creation, order match reservation, or order completion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: RELEASED
        trigger: "system: automatic when availability is restored above 0 (order cancel from MATCHED, or site decommission cancelling a MATCHED order)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FeedstockLot
    initial_state: RECEIVED
    terminal_states: [QC_FAILED]
    transitions:
      - from: RECEIVED
        to: QC_PASSED
        trigger: "POST /carpetloop/feedstock-lots/{lot_id}/qc with outcome=PASS"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: QC_FAILED
        trigger: "POST /carpetloop/feedstock-lots/{lot_id}/qc with outcome=FAIL"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: QC_PASSED
        to: DEPLETED
        trigger: "system: automatic when allocated_kg == quantity_kg (available_kg == 0) via allocate"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: QC_PASSED
        trigger: "system: automatic when deallocate restores available_kg > 0"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerSite
    initial_state: PLANNED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PLANNED
        to: INSTALLED
        trigger: "POST /carpetloop/sites/{site_id}/install"
        actor: Installer
        preconditions:
          - "X-User-ID == site.contractor_name (ERR_FORBIDDEN)"
          - "installation_system == ADHESIVE_FREE requires adhesive_free_certified == true (ERR_ADHESIVE_FREE_CERT_REQUIRED)"
          - "adhesive_free_certified == true requires cert_expires_on > install_window_start (ERR_CONTRACTOR_CERT_EXPIRED)"
          - "no other site with the same contractor_name and status IN {INSTALLED, IN_SERVICE} whose closed install window conflicts after adding CONTRACTOR_BUFFER_SECONDS at both ends (ERR_CONTRACTOR_WINDOW_CONFLICT)"
        side_effects:
          - "increments CustomerSite.version by 1"
      - from: INSTALLED
        to: IN_SERVICE
        trigger: "system: automatic on creation of the site's first zone"
        actor: system
        preconditions: []
        side_effects:
          - "increments CustomerSite.version by 1"
      - from: PLANNED
        to: DECOMMISSIONED
        trigger: "POST /carpetloop/sites/{site_id}/decommission"
        actor: Installer
        preconditions:
          - "X-User-ID == site.contractor_name (ERR_FORBIDDEN)"
          - "no TakeBackRequest of this site in REQUESTED, SCHEDULED, or COLLECTED (ERR_TAKEBACK_IN_FLIGHT)"
        side_effects:
          - "increments CustomerSite.version by 1"
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /carpetloop/sites/{site_id}/decommission"
        actor: Installer
        preconditions:
          - "X-User-ID == site.contractor_name (ERR_FORBIDDEN)"
          - "no TakeBackRequest of this site in REQUESTED, SCHEDULED, or COLLECTED (ERR_TAKEBACK_IN_FLIGHT)"
        side_effects:
          - "all zones with status IN_SERVICE -> RECLAIMED (link 1)"
          - "all ReplacementOrders of this site in DRAFT or MATCH_FAILED -> CANCELLED (link 2)"
          - "all ReplacementOrders of this site in MATCHED -> CANCELLED and their reserved area is released: matched batch available_m2 += zone.area_m2, and a batch at EXHAUSTED reverts to RELEASED when availability returns (link 3, transitive via the order's cancel side effect)"
          - "increments CustomerSite.version by 1"

  - entity: InstalledZone
    initial_state: IN_SERVICE
    terminal_states: [REPLACED, RECLAIMED]
    transitions:
      - from: IN_SERVICE
        to: REPLACED
        trigger: "system: on completion of a ReplacementOrder targeting this zone"
        actor: system
        preconditions: []
        side_effects:
          - "a new InstalledZone is created with zone_code = order.new_zone_code, batch_id = order.matched_batch_id, area_m2 = replaced zone's area_m2, status IN_SERVICE"
      - from: IN_SERVICE
        to: RECLAIMED
        trigger: "system: on decommission of the parent site"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReplacementOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: MATCHED
        trigger: "POST /carpetloop/replacement-orders/{order_id}/match"
        actor: Installer
        preconditions:
          - "X-User-ID == order site's contractor_name (ERR_FORBIDDEN)"
          - "zone.status == IN_SERVICE (ERR_ZONE_NOT_IN_SERVICE)"
          - "calculation dye_lot_match yields a candidate batch"
        side_effects:
          - "matched_batch_id set; quoted_cost_cents computed (calculation replacement_quote)"
          - "matched batch available_m2 -= zone.area_m2 (reservation); batch -> EXHAUSTED if available_m2 reaches 0"
      - from: DRAFT
        to: MATCH_FAILED
        trigger: "POST /carpetloop/replacement-orders/{order_id}/match"
        actor: Installer
        preconditions:
          - "X-User-ID == order site's contractor_name (ERR_FORBIDDEN)"
          - "zone.status == IN_SERVICE (ERR_ZONE_NOT_IN_SERVICE)"
          - "calculation dye_lot_match yields no candidate"
        side_effects: []
      - from: MATCH_FAILED
        to: MATCHED
        trigger: "POST /carpetloop/replacement-orders/{order_id}/match (re-match after new batches are released)"
        actor: Installer
        preconditions:
          - "X-User-ID == order site's contractor_name (ERR_FORBIDDEN)"
          - "zone.status == IN_SERVICE (ERR_ZONE_NOT_IN_SERVICE)"
          - "calculation dye_lot_match yields a candidate batch"
        side_effects:
          - "same reservation side effects as DRAFT -> MATCHED"
      - from: MATCH_FAILED
        to: MATCH_FAILED
        trigger: "POST /carpetloop/replacement-orders/{order_id}/match with still-empty candidate set"
        actor: Installer
        preconditions:
          - "X-User-ID == order site's contractor_name (ERR_FORBIDDEN)"
          - "zone.status == IN_SERVICE (ERR_ZONE_NOT_IN_SERVICE)"
        side_effects: []
      - from: MATCHED
        to: COMPLETED
        trigger: "POST /carpetloop/replacement-orders/{order_id}/complete"
        actor: Installer
        preconditions:
          - "X-User-ID == order site's contractor_name (ERR_FORBIDDEN)"
          - "zone.status == IN_SERVICE (ERR_ZONE_NOT_IN_SERVICE — evaluated before any fiscal check)"
          - "site.spent_replacement_cents + quoted_cost_cents <= site.annual_replacement_budget_cents (ERR_REPLACEMENT_BUDGET_EXCEEDED)"
          - "new_zone_code unique among the site's zones with status IN_SERVICE (ERR_ZONE_CODE_CONFLICT)"
        side_effects:
          - "target zone -> REPLACED; replacement zone created per the zone transition's side effect"
          - "site.spent_replacement_cents += quoted_cost_cents"
          - "the matched reservation becomes permanent (no availability change); batch -> EXHAUSTED if available_m2 == 0"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /carpetloop/replacement-orders/{order_id}/cancel, or system supersede by a newer order for the same zone, or system cascade from site decommission"
        actor: Specifier
        preconditions:
          - "for the endpoint: X-User-ID == order.created_by (ERR_FORBIDDEN)"
        side_effects: []
      - from: MATCHED
        to: CANCELLED
        trigger: "POST /carpetloop/replacement-orders/{order_id}/cancel, or system supersede by a newer order for the same zone, or system cascade from site decommission"
        actor: Specifier
        preconditions:
          - "for the endpoint: X-User-ID == order.created_by (ERR_FORBIDDEN)"
        side_effects:
          - "reservation released: matched batch available_m2 += zone.area_m2; batch EXHAUSTED -> RELEASED when availability returns"

  - entity: TakeBackRequest
    initial_state: REQUESTED
    terminal_states: [CREDITED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /carpetloop/take-back-requests/{takeback_id}/schedule"
        actor: Installer
        preconditions:
          - "X-User-ID == takeback site's contractor_name (ERR_FORBIDDEN)"
          - "pickup_window_start < pickup_window_end and pickup_window_start > current logical clock (ERR_PICKUP_WINDOW_INVALID)"
        side_effects:
          - "sets pickup_window_start / pickup_window_end"
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /carpetloop/take-back-requests/{takeback_id}/collect"
        actor: Installer
        preconditions:
          - "X-User-ID == takeback site's contractor_name (ERR_FORBIDDEN)"
          - "current logical clock >= pickup_window_start (ERR_COLLECT_WINDOW_NOT_OPEN)"
          - "collected_kg > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "sets collected_kg"
      - from: COLLECTED
        to: CREDITED
        trigger: "POST /carpetloop/take-back-requests/{takeback_id}/sort"
        actor: SustainabilityManager
        preconditions:
          - "reuse_kg, depolymerize_kg, downcycle_kg, landfill_kg each >= 0 and their sum == collected_kg at 2 decimal places (ERR_SORT_MASS_IMBALANCE)"
        side_effects:
          - "computes credit_variant and credit_cents (calculation takeback_credit); sets credited_at to the logical clock"
          - "cascade C link 2: when depolymerize_kg > 0, creates a FeedstockLot with source_type POST_CONSUMER_TILE, quantity_kg = depolymerize_kg, carbon_factor_kgco2e_per_kg = TAKEBACK_LOT_CARBON_FACTOR, supplier_name = TAKEBACK_SUPPLIER_NAME, status RECEIVED, origin_takeback_id = this takeback's id"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /carpetloop/take-back-requests/{takeback_id}/cancel"
        actor: Specifier
        preconditions:
          - "X-User-ID == takeback.created_by (ERR_FORBIDDEN)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /carpetloop/take-back-requests/{takeback_id}/cancel"
        actor: Specifier
        preconditions:
          - "X-User-ID == takeback.created_by (ERR_FORBIDDEN)"
        side_effects:
          - "pickup window fields cleared to null"

  - entity: PCFReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /carpetloop/pcf-reports/{report_id}/submit"
        actor: SustainabilityManager
        preconditions:
          - "collection.status == ACTIVE (ERR_COLLECTION_SUNSET)"
          - "calculation pcf_footprint input_set is non-empty (ERR_EMPTY_REPORT_INPUT)"
        side_effects:
          - "computes and stores operational_kgco2e_per_m2 and lifecycle_kgco2e_per_m2 (calculation pcf_footprint, both variants)"
          - "sets submitted_by = X-User-ID"
      - from: SUBMITTED
        to: IN_VERIFICATION
        trigger: "POST /carpetloop/pcf-reports/{report_id}/verification with action=ASSIGN"
        actor: SustainabilityManager
        preconditions:
          - "verifier_org present (ERR_INVALID_REQUEST)"
        side_effects:
          - "sets verifier_org"
      - from: IN_VERIFICATION
        to: VERIFIED
        trigger: "POST /carpetloop/pcf-reports/{report_id}/verification with action=CLEAR"
        actor: Verifier
        preconditions:
          - "X-User-ID != submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets verified_by = X-User-ID"
      - from: IN_VERIFICATION
        to: REJECTED
        trigger: "POST /carpetloop/pcf-reports/{report_id}/verification with action=FAIL"
        actor: Verifier
        preconditions:
          - "X-User-ID != submitted_by (ERR_SEGREGATION_OF_DUTIES)"
          - "findings_count >= 1 (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /carpetloop/pcf-reports/{report_id}/revise"
        actor: SustainabilityManager
        preconditions: []
        side_effects:
          - "clears submitted_by, verifier_org, verified_by, and both computed variant values to null"
      - from: VERIFIED
        to: PUBLISHED
        trigger: "POST /carpetloop/pcf-reports/{report_id}/publish"
        actor: SustainabilityManager
        preconditions: []
        side_effects:
          - "cascade A link 1: every other PUBLISHED report of the same collection whose half-open period overlaps this report's period -> SUPERSEDED"
          - "cascade A link 2: every CarbonClaim with status PUBLISHED whose report_id references a report superseded in link 1 -> RETIRED"
          - "cascade A link 3: every SpecPackage with status ISSUED whose claim_id references a claim retired in link 2 -> REVOKED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: cascade A link 1 of a newer publish"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CarbonClaim
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /carpetloop/carbon-claims/{claim_id}/submit"
        actor: SustainabilityManager
        preconditions:
          - "referenced report status == PUBLISHED (ERR_REPORT_NOT_PUBLISHED)"
          - "when claim_type == CARBON_NEGATIVE: referenced manufacturing target posture != BREACHED (ERR_TARGET_BREACHED)"
        side_effects:
          - "computes required_offset_kgco2e (calculation claim_offset_requirement) and refreshes offset_coverage"
      - from: REJECTED
        to: IN_REVIEW
        trigger: "POST /carpetloop/carbon-claims/{claim_id}/submit (resubmission)"
        actor: SustainabilityManager
        preconditions:
          - "referenced report status == PUBLISHED (ERR_REPORT_NOT_PUBLISHED)"
          - "when claim_type == CARBON_NEGATIVE: referenced manufacturing target posture != BREACHED (ERR_TARGET_BREACHED)"
        side_effects:
          - "recomputes required_offset_kgco2e; clears reviewed_by"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /carpetloop/carbon-claims/{claim_id}/review with decision=APPROVE"
        actor: ClaimsApprover
        preconditions:
          - "X-User-ID != claim.created_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets reviewed_by = X-User-ID"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /carpetloop/carbon-claims/{claim_id}/review with decision=REJECT"
        actor: ClaimsApprover
        preconditions:
          - "X-User-ID != claim.created_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets reviewed_by = X-User-ID"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /carpetloop/carbon-claims/{claim_id}/publish"
        actor: SustainabilityManager
        preconditions:
          - "referenced report status == PUBLISHED (ERR_REPORT_NOT_PUBLISHED)"
          - "offset_coverage == FULL (ERR_OFFSET_COVERAGE_INSUFFICIENT)"
        side_effects: []
      - from: PUBLISHED
        to: RETIRED
        trigger: "system: cascade A link 2 (referenced report superseded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: DRAFT
        trigger: "system: cascade B link 2 (referenced manufacturing target posture became BREACHED via a new reading)"
        actor: system
        preconditions: []
        side_effects:
          - "clears reviewed_by; required_offset_kgco2e retained for audit"

  - entity: SpecPackage
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a new SpecPackage created for the same (architect_firm, collection_id) supersedes this one"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "system: cascade A link 3 (referenced claim retired)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; sequential-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-collection
    parent_entity: ProductCollection
    write_endpoint: "POST /carpetloop/pcf-reports"
    occ_field: expected_collection_version
    description: |
      Creating a PCFReport legitimately supersedes the collection's existing
      DRAFT reports for overlapping periods and advances the collection's
      version. A create carrying an expected_collection_version the client
      captured before another writer's create advanced it is rejected as
      stale, because the client's view of which draft is current no longer
      holds.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: package-create-stale-collection
    parent_entity: ProductCollection
    write_endpoint: "POST /carpetloop/spec-packages"
    occ_field: expected_collection_version
    description: |
      Creating a SpecPackage legitimately supersedes the previously ISSUED
      package for the same (architect_firm, collection_id) pair and advances
      the collection's version. A create carrying an expected_collection_version
      the client captured before another writer advanced it is rejected as
      stale, because the client may be superseding a package it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-create-stale-site
    parent_entity: CustomerSite
    write_endpoint: "POST /carpetloop/replacement-orders"
    occ_field: expected_site_version
    description: |
      Creating a ReplacementOrder for a zone that already has a non-terminal
      order (DRAFT, MATCHED, or MATCH_FAILED) legitimately supersedes that
      order — it is CANCELLED and any reservation released — and advances the
      site's version. A create carrying an expected_site_version the client
      captured before another writer advanced it is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: batch_recycled_content
    trigger: "on feedstock allocate/deallocate against the batch, and re-validated at release"
    algorithm: aggregation
    formula: |
      recycled_kg = sum(entry.quantity_kg for entry in batch.feedstock_mix
                        where lot(entry.lot_id).source_type != VIRGIN)
      total_kg    = sum(entry.quantity_kg for entry in batch.feedstock_mix)
      recycled_content_pct = round(100 * recycled_kg / total_kg, 2) half-up
      Undefined (null) while total_kg == 0.
    input_set: "all feedstock_mix entries of the batch, regardless of lot status (lots can only be allocated while QC_PASSED and never leave the mix except via deallocate)"
    constants:
      TILE_MASS_KG_PER_M2: 4.0
    precision: "2 decimal places, round_half_up"

  - name: batch_embodied_carbon
    trigger: "on feedstock allocate/deallocate against the batch, and at release"
    algorithm: aggregation
    formula: |
      feedstock_component = round( sum(entry.quantity_kg * lot(entry.lot_id).carbon_factor_kgco2e_per_kg
                                       for entry in batch.feedstock_mix)
                                   / batch.produced_m2, 4 ) half-up        # PINNED: round to 4dp first
      embodied_carbon_kg_per_m2 = round( feedstock_component + batch.mfg_intensity_kgco2e_per_m2, 3 ) half-up
    input_set: "all feedstock_mix entries of the batch"
    constants:
      TILE_MASS_KG_PER_M2: 4.0
    precision: "feedstock component at 4dp, stored embodied value at 3dp, round_half_up; downstream consumers (pcf_footprint) MUST use the stored 3dp value, never recompute from the mix"

  - name: pcf_footprint
    trigger: "on POST /carpetloop/pcf-reports/{report_id}/submit; both variants computed from identical inputs"
    algorithm: aggregation
    formula: |
      input_set   = batches B of report.collection_id with
                    B.production_date in [period_start, period_end)   # half-open
                    and B.status in {RELEASED, EXHAUSTED}
      operational = round( sum(B.embodied_carbon_kg_per_m2 * B.produced_m2 for B in input_set)
                           / sum(B.produced_m2 for B in input_set), 3 ) half-up
      # PINNED rounding order: use each batch's stored 3dp embodied value in the
      # weighted sum; recomputing per-batch values at full precision before
      # weighting is the rejected variant and yields different last-digit results.
      credited_takebacks = takebacks T with T.collection_id == report.collection_id,
                           T.status == CREDITED, T.credited_at in [period_start, period_end)
      recovered_m2  = sum( round(T.collected_kg / TILE_MASS_KG_PER_M2, 2) for T in credited_takebacks )
      recovery_share = min(1, recovered_m2 / sum(B.produced_m2 for B in input_set))
      eol_credit    = round( EOL_MAX_CREDIT_KGCO2E_PER_M2 * recovery_share, 4 ) half-up
      lifecycle     = round( operational + TRANSPORT_KGCO2E_PER_M2 - eol_credit, 3 ) half-up
    input_set: "collection's batches filtered by production_date half-open window and status in {RELEASED, EXHAUSTED}; CREDITED takebacks of the collection in the same half-open window"
    constants:
      TILE_MASS_KG_PER_M2: 4.0
      TRANSPORT_KGCO2E_PER_M2: 0.35
      EOL_MAX_CREDIT_KGCO2E_PER_M2: 2.10
    precision: "variant values at 3dp, round_half_up; eol_credit at 4dp before subtraction"
    variants:
      - name: OPERATIONAL
        when: "boundary CRADLE_TO_GATE accounting; always stored on operational_kgco2e_per_m2"
        difference: "weighted mean of batch embodied carbon only; no transport, no end-of-life credit"
      - name: LIFECYCLE
        when: "boundary CRADLE_TO_GRAVE accounting; always stored on lifecycle_kgco2e_per_m2"
        difference: "operational plus transport constant minus recovery-scaled end-of-life credit; identical inputs, different result"

  - name: takeback_credit
    trigger: "on POST /carpetloop/take-back-requests/{takeback_id}/sort"
    algorithm: tiered_pricing
    formula: |
      recovered_m2 = round( collected_kg / TILE_MASS_KG_PER_M2, 2 ) half-up   # PINNED: round m2 first
      base_cents   = recovered_m2 * GRADE_RATE_CENTS_PER_M2[condition_grade]
      STANDARD:  credit_cents = round( base_cents, 0 ) half-up
      CIRCULAR:  bonus_raw = reuse_kg*PATHWAY_BONUS.REUSE + depolymerize_kg*PATHWAY_BONUS.DEPOLYMERIZE
                             + downcycle_kg*PATHWAY_BONUS.DOWNCYCLE + landfill_kg*PATHWAY_BONUS.LANDFILL
                 bonus = min( round(BONUS_CAP_FRACTION * base_cents, 2), bonus_raw )
                 credit_cents = round( base_cents + bonus, 0 ) half-up
      variant selection: collection(claim_intent) == NONE -> STANDARD; CARBON_NEUTRAL or CARBON_NEGATIVE -> CIRCULAR
      # Rejected rounding order (multiply-then-divide): round(collected_kg * rate / 4, 0)
      # yields different cents; the pinned order rounds recovered_m2 to 2dp first.
    input_set: "the single takeback being sorted; variant selected by the declared collection's claim_intent"
    constants:
      TILE_MASS_KG_PER_M2: 4.0
      GRADE_RATE_CENTS_PER_M2: { A: 250, B: 150, C: 40 }
      PATHWAY_BONUS_CENTS_PER_KG: { REUSE: 30, DEPOLYMERIZE: 18, DOWNCYCLE: 6, LANDFILL: 0 }
      BONUS_CAP_FRACTION: 0.40
    precision: "recovered_m2 at 2dp half-up; bonus cap at 2dp; final credit integer cents half-up"
    variants:
      - name: STANDARD
        when: "declared collection claim_intent == NONE"
        difference: "area-based credit only; pathway split irrelevant"
      - name: CIRCULAR
        when: "declared collection claim_intent is CARBON_NEUTRAL or CARBON_NEGATIVE"
        difference: "adds pathway-mix bonus capped at 40% of base; identical inputs, different result"

  - name: replacement_quote
    trigger: "on successful ReplacementOrder match (transition into MATCHED)"
    algorithm: tiered_pricing
    formula: |
      factor = 1.00 if matched_batch.dye_lot_code == zone.batch.dye_lot_code else OTHER_LOT_FACTOR
      quoted_cost_cents = round( zone.area_m2 * BASE_PRICE_CENTS_PER_M2 * factor, 0 ) half-up
    input_set: "the matched order, its zone, and the matched batch"
    constants:
      BASE_PRICE_CENTS_PER_M2: 1200
      OTHER_LOT_FACTOR: 1.15
    precision: "integer cents, round_half_up"

  - name: dye_lot_match
    trigger: "on POST /carpetloop/replacement-orders/{order_id}/match"
    algorithm: constraint_propagation
    formula: |
      eligibility filter (candidate set):
        batches B with B.collection_id == zone.batch.collection_id,
        B.status == RELEASED, B.available_m2 >= zone.area_m2
      ranking expression (applied in order):
        1. exact_lot DESC: B.dye_lot_code == zone.batch.dye_lot_code (true ranks above false)
        2. pair_delta_e ASC: abs(B.delta_e - zone.batch.delta_e)
        3. created_at ASC (earliest batch first)                     # never id
      tie-break: step 3 resolves any full tie
      empty-pool fallback: order transitions to MATCH_FAILED, matched_batch_id stays null
    input_set: "all TileBatches sharing the collection of the zone's current batch"
    constants: {}
    precision: "selector only; no numeric output"

  - name: claim_offset_requirement
    trigger: "on CarbonClaim submit (DRAFT -> IN_REVIEW and REJECTED -> IN_REVIEW)"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking pair pinned by evaluation order: required depends on the
      # report's variant value; coverage depends on required; the publish gate
      # depends on coverage; retiring offsets changes coverage but never required.
      step 1: report_value = report.lifecycle_kgco2e_per_m2 if claim.boundary == CRADLE_TO_GRAVE
                             else report.operational_kgco2e_per_m2
              # the claim's boundary equals the report's boundary (validated at create),
              # so exactly one stored variant value is selected
      step 2: gross_kgco2e = report_value * claim.claimed_volume_m2
      step 3: required_offset_kgco2e = max(0, gross_kgco2e) + CARBON_NEGATIVE_BUFFER_KGCO2E
                                       if claim.claim_type == CARBON_NEGATIVE
                                       else max(0, gross_kgco2e)
      step 4: retired_kgco2e = sum(O.quantity_kgco2e for O in claim's OffsetRetirements)
      step 5: offset_coverage = NONE if retired == 0
                                else FULL if retired >= required else PARTIAL
    input_set: "the claim, its referenced report (stored variant values), and the claim's offset retirements"
    constants:
      CARBON_NEGATIVE_BUFFER_KGCO2E: 500.0
    precision: "kg values carried at 3dp; comparisons exact decimal"

  - name: target_posture
    trigger: "on ManufacturingTarget creation and on every POST /carpetloop/manufacturing-targets/{target_id}/readings"
    algorithm: threshold
    formula: |
      target_intensity = baseline_intensity_kgco2e_per_m2 * (1 - target_reduction_pct)
      current = baseline before any reading; afterwards the intensity of the reading
                with the greatest period_end (tie-break: the reading recorded later wins)
      posture = ON_TRACK if current <= target_intensity        # boundary inclusive
                else AT_RISK if current <= baseline_intensity_kgco2e_per_m2
                else BREACHED
    input_set: "the target's readings_log"
    constants: {}
    precision: "exact decimal comparison on stored values"

  - name: supplier_reliability
    trigger: "on FeedstockLot creation"
    algorithm: chronological
    formula: |
      decided = prior FeedstockLots L with L.supplier_name == new_lot.supplier_name
                and L.status in {QC_PASSED, QC_FAILED}
                ("prior": every decided lot created before this creation, in created_at ASC order)
      supplier_reliability_pct = 100.00 when decided is empty
                                 else round(100 * sum(L.quantity_kg for L in decided if L.status == QC_PASSED)
                                            / sum(L.quantity_kg for L in decided), 2) half-up
    input_set: "all decided lots of the same supplier_name existing before this creation"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: site_replacement_spend
    trigger: "on ReplacementOrder completion and read during the completion budget check"
    algorithm: aggregation
    formula: |
      spent_replacement_cents = sum(O.quoted_cost_cents for O in site's ReplacementOrders
                                    where O.status == COMPLETED)
    input_set: "the site's COMPLETED replacement orders"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; for POST /carpetloop/pcf-reports/{id}/verification, action=ASSIGN requires SustainabilityManager and action=CLEAR|FAIL requires Verifier"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: Specifier operations require X-User-ID == resource.created_by (site-scoped creates, order cancel, takeback create/cancel); Installer operations require X-User-ID == site.contractor_name (install, decommission, zone create, order match/complete, takeback schedule/collect)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /carpetloop/sites, /carpetloop/replacement-orders, /carpetloop/take-back-requests, /carpetloop/spec-packages and their scoped action endpoints"
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right: collection, batch, lot, site, zone, order, takeback, report, claim, target, package"
    error_id: ERR_COLLECTION_NOT_FOUND
    http_status: 404
    applies_to: "all — per-resource variants ERR_BATCH_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_TAKEBACK_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_TARGET_NOT_FOUND, ERR_PACKAGE_NOT_FOUND"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Specific state guards: batch create / report create require collection ACTIVE; zone create requires batch RELEASED and site INSTALLED|IN_SERVICE; take-back create requires site INSTALLED|IN_SERVICE; order create/complete/match require zone IN_SERVICE; order complete requires order MATCHED; site decommission requires no in-flight takebacks"
    error_id: ERR_COLLECTION_SUNSET
    http_status: 409
    applies_to: "per-guard variants: ERR_BATCH_NOT_RELEASED, ERR_SITE_NOT_INSTALLED, ERR_ZONE_NOT_IN_SERVICE, ERR_ORDER_NOT_MATCHED, ERR_TAKEBACK_IN_FLIGHT (all 409)"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version on create-with-supersede endpoints equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /carpetloop/pcf-reports, POST /carpetloop/spec-packages, POST /carpetloop/replacement-orders"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: report verification CLEAR/FAIL requires X-User-ID != report.submitted_by; claim review requires X-User-ID != claim.created_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /carpetloop/pcf-reports/{id}/verification, POST /carpetloop/carbon-claims/{id}/review"
  - priority: 9
    category: business_referential
    check: "Referenced entities in required states: claim submit/publish require report PUBLISHED; package create requires report PUBLISHED and claim (if given) PUBLISHED; claim boundary equals report boundary at create; CARBON_NEGATIVE claim additionally requires boundary == CRADLE_TO_GRAVE at create and manufacturing_target_id, with target posture != BREACHED at submit; ADHESIVE_FREE install requires adhesive_free_certified == true; allocate requires lot QC_PASSED; order create requires zone.site_id == order.site_id"
    error_id: ERR_REPORT_NOT_PUBLISHED
    http_status: 422
    applies_to: "per-guard variants: ERR_CLAIM_NOT_PUBLISHED, ERR_BOUNDARY_MISMATCH, ERR_NEGATIVE_REQUIRES_CRADLE_TO_GRAVE, ERR_TARGET_REQUIRED_FOR_NEGATIVE, ERR_TARGET_BREACHED, ERR_ADHESIVE_FREE_CERT_REQUIRED, ERR_LOT_NOT_QC_PASSED, ERR_ZONE_SITE_MISMATCH (all 422)"
  - priority: 10
    category: business_temporal
    check: "Temporal guards: certified contractor's cert_expires_on > install_window_start; schedule requires pickup_window_start < pickup_window_end and start after the logical clock; collect requires clock >= pickup_window_start; report create rejects period overlap with a same-collection report in SUBMITTED|IN_VERIFICATION|VERIFIED (the in-verification pipeline; half-open periods, touching endpoints do not overlap); overlapping DRAFTs are superseded at create and overlapping PUBLISHED reports are superseded at publish, so neither blocks creation"
    error_id: ERR_CONTRACTOR_CERT_EXPIRED
    http_status: 422
    applies_to: "per-guard variants: ERR_PICKUP_WINDOW_INVALID, ERR_COLLECT_WINDOW_NOT_OPEN (422); ERR_REPORT_PERIOD_OVERLAP (409)"
  - priority: 11
    category: business_constraint
    check: "Constraint guards: dye_lot_code unique per collection; zone_code unique per site among IN_SERVICE zones (checked at zone create and again at order complete for new_zone_code); release requires allocated_mass_kg == produced_m2 x TILE_MASS_KG_PER_M2 at 2dp; sort pathway masses each >= 0 and sum == collected_kg at 2dp; install window conflicts per the contractor buffer rule; report submit requires non-empty input set; request shape/enums/ranges valid (vintage_year >= 2020, 0 < target_reduction_pct < 1, positive quantities)"
    error_id: ERR_DYE_LOT_CONFLICT
    http_status: 409
    applies_to: "per-guard variants: ERR_ZONE_CODE_CONFLICT, ERR_CONTRACTOR_WINDOW_CONFLICT (409); ERR_MIX_MASS_MISMATCH, ERR_SORT_MASS_IMBALANCE, ERR_EMPTY_REPORT_INPUT (422); ERR_INVALID_REQUEST (400)"
  - priority: 12
    category: business_fiscal
    check: "Capacity/fiscal guards evaluated last: allocate requires quantity_kg <= lot.available_kg; zone create requires area_m2 <= batch.available_m2; order complete requires spent_replacement_cents + quoted_cost_cents <= annual_replacement_budget_cents"
    error_id: ERR_REPLACEMENT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "per-guard variants: ERR_INSUFFICIENT_LOT_KG, ERR_AREA_EXCEEDS_BATCH (422)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- ProductCollection ---
  - { method: POST, path: "/carpetloop/collections", description: "Create a product collection", roles: [PlatformAdmin], code: 201, input: [name, pattern_code, backing_type, lifecycle_boundary, "claim_intent?"], output: ProductCollection, side_effects: ["status=ACTIVE, version=1"] }
  - { method: GET, path: "/carpetloop/collections/{collection_id}", description: "Get a collection", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: ProductCollection, side_effects: [] }
  - { method: POST, path: "/carpetloop/collections/{collection_id}/sunset", description: "Sunset a collection (blocks new batches and reports)", roles: [PlatformAdmin], code: 200, input: [], output: ProductCollection, side_effects: ["status=SUNSET", "increments ProductCollection.version by 1"] }

  # --- TileBatch ---
  - { method: POST, path: "/carpetloop/collections/{collection_id}/batches", description: "Create a dye-lot batch in QUARANTINE", roles: [PlatformAdmin], code: 201, input: [dye_lot_code, production_date, produced_m2, mfg_intensity_kgco2e_per_m2, delta_e], output: TileBatch, side_effects: ["status=QUARANTINE", "available_m2=produced_m2", "feedstock_mix=[]"] }
  - { method: GET, path: "/carpetloop/batches/{batch_id}", description: "Get a batch", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: TileBatch, side_effects: [] }
  - { method: GET, path: "/carpetloop/batches", description: "List batches with filters", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["collection_id?", "status?", "limit?", "offset?"], output: "TileBatch[]", side_effects: [] }
  - { method: POST, path: "/carpetloop/batches/{batch_id}/release", description: "Release a batch from quarantine after mass balance check", roles: [PlatformAdmin], code: 200, input: [], output: TileBatch, side_effects: ["QUARANTINE->RELEASED", "recomputes recycled_content_pct and embodied_carbon_kg_per_m2"] }

  # --- FeedstockLot ---
  - { method: POST, path: "/carpetloop/feedstock-lots", description: "Register a feedstock lot (RECEIVED)", roles: [PlatformAdmin], code: 201, input: [supplier_name, source_type, quantity_kg, carbon_factor_kgco2e_per_kg], output: FeedstockLot, side_effects: ["computes supplier_reliability_pct", "status=RECEIVED"] }
  - { method: GET, path: "/carpetloop/feedstock-lots/{lot_id}", description: "Get a feedstock lot", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: FeedstockLot, side_effects: [] }
  - { method: GET, path: "/carpetloop/feedstock-lots", description: "List feedstock lots with filters (traceability channel for cascade-created lots)", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["supplier_name?", "source_type?", "status?", "origin_takeback_id?", "limit?", "offset?"], output: "FeedstockLot[]", side_effects: [] }
  - { method: POST, path: "/carpetloop/feedstock-lots/{lot_id}/qc", description: "QC decision on a lot", roles: [PlatformAdmin], code: 200, input: [outcome], output: FeedstockLot, side_effects: ["RECEIVED->QC_PASSED (outcome=PASS) or ->QC_FAILED (outcome=FAIL)"] }
  - { method: POST, path: "/carpetloop/feedstock-lots/{lot_id}/allocate", description: "Allocate kilograms of a QC_PASSED lot into a QUARANTINE batch's mix", roles: [SustainabilityManager], code: 200, input: [batch_id, quantity_kg], output: FeedstockLot, side_effects: ["lot.available_kg -= quantity_kg, lot.allocated_kg += quantity_kg", "lot -> DEPLETED when available_kg == 0", "batch feedstock_mix entry added/merged", "recomputes batch recycled_content_pct and embodied_carbon_kg_per_m2"] }
  - { method: POST, path: "/carpetloop/feedstock-lots/{lot_id}/deallocate", description: "Release kilograms of this lot from a QUARANTINE batch's mix (compensating action of allocate)", roles: [SustainabilityManager], code: 200, input: [batch_id, quantity_kg], output: FeedstockLot, side_effects: ["lot.available_kg += quantity_kg, lot.allocated_kg -= quantity_kg", "lot DEPLETED -> QC_PASSED when availability returns", "batch feedstock_mix entry reduced/removed", "recomputes batch recycled_content_pct and embodied_carbon_kg_per_m2"] }

  # --- CustomerSite ---
  - { method: POST, path: "/carpetloop/sites", description: "Register a customer installation site (PLANNED)", roles: [Specifier], code: 201, input: [contractor_name, address, install_window_start, install_window_end, installation_system, adhesive_free_certified, cert_expires_on, annual_replacement_budget_cents], output: CustomerSite, side_effects: ["status=PLANNED", "created_by=X-User-ID", "spent_replacement_cents=0"] }
  - { method: GET, path: "/carpetloop/sites/{site_id}", description: "Get a site", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: CustomerSite, side_effects: [] }
  - { method: POST, path: "/carpetloop/sites/{site_id}/install", description: "Mark the site installed (cert + contractor window buffer checks)", roles: [Installer], code: 200, input: [], output: CustomerSite, side_effects: ["PLANNED->INSTALLED", "increments CustomerSite.version by 1"] }
  - { method: POST, path: "/carpetloop/sites/{site_id}/decommission", description: "Decommission the site; reclaims zones and cancels non-terminal orders with reservation release", roles: [Installer], code: 200, input: [], output: CustomerSite, side_effects: ["->DECOMMISSIONED", "zones IN_SERVICE -> RECLAIMED", "orders DRAFT|MATCHED|MATCH_FAILED -> CANCELLED with reservation release per order side effects", "increments CustomerSite.version by 1"] }
  - { method: POST, path: "/carpetloop/sites/{site_id}/zones", description: "Lay a zone from a released batch", roles: [Installer], code: 201, input: [batch_id, zone_code, area_m2], output: InstalledZone, side_effects: ["batch.available_m2 -= area_m2; batch -> EXHAUSTED at 0", "first zone bubbles site INSTALLED -> IN_SERVICE (increments site version)"] }

  # --- InstalledZone ---
  - { method: GET, path: "/carpetloop/zones/{zone_id}", description: "Get a zone", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: InstalledZone, side_effects: [] }
  - { method: GET, path: "/carpetloop/zones", description: "List zones with filters", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["site_id?", "batch_id?", "status?", "limit?", "offset?"], output: "InstalledZone[]", side_effects: [] }

  # --- ReplacementOrder ---
  - { method: POST, path: "/carpetloop/replacement-orders", description: "Open a selective replacement order; supersedes a non-terminal order on the same zone (OCC on site)", roles: [Specifier], code: 201, input: [site_id, zone_id, reason, new_zone_code, expected_site_version], output: ReplacementOrder, side_effects: ["existing DRAFT|MATCHED|MATCH_FAILED order of the zone -> CANCELLED (reservation released per cancel side effects)", "status=DRAFT", "created_by=X-User-ID", "increments CustomerSite.version by 1"] }
  - { method: GET, path: "/carpetloop/replacement-orders/{order_id}", description: "Get a replacement order", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: ReplacementOrder, side_effects: [] }
  - { method: GET, path: "/carpetloop/replacement-orders", description: "List replacement orders with filters", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["site_id?", "zone_id?", "matched_batch_id?", "status?", "limit?", "offset?"], output: "ReplacementOrder[]", side_effects: [] }
  - { method: POST, path: "/carpetloop/replacement-orders/{order_id}/match", description: "Run dye-lot matching (calculation dye_lot_match)", roles: [Installer], code: 200, input: [], output: ReplacementOrder, side_effects: ["MATCHED: matched_batch_id + quoted_cost_cents set, batch availability reserved", "or MATCH_FAILED with no side effects"] }
  - { method: POST, path: "/carpetloop/replacement-orders/{order_id}/complete", description: "Complete a matched replacement", roles: [Installer], code: 200, input: [], output: ReplacementOrder, side_effects: ["zone -> REPLACED; replacement zone created (new_zone_code, matched batch, IN_SERVICE)", "site.spent_replacement_cents += quoted_cost_cents", "batch -> EXHAUSTED at available_m2 == 0"] }
  - { method: POST, path: "/carpetloop/replacement-orders/{order_id}/cancel", description: "Cancel a draft or matched order; releases any reservation", roles: [Specifier], code: 200, input: [], output: ReplacementOrder, side_effects: ["->CANCELLED", "from MATCHED: batch availability released; EXHAUSTED -> RELEASED when restored"] }

  # --- TakeBackRequest ---
  - { method: POST, path: "/carpetloop/take-back-requests", description: "Open a take-back request for a site's declared collection tiles", roles: [Specifier], code: 201, input: [site_id, collection_id, condition_grade, declared_area_m2], output: TakeBackRequest, side_effects: ["status=REQUESTED", "created_by=X-User-ID"] }
  - { method: GET, path: "/carpetloop/take-back-requests/{takeback_id}", description: "Get a take-back request", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: TakeBackRequest, side_effects: [] }
  - { method: GET, path: "/carpetloop/take-back-requests", description: "List take-back requests with filters", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["site_id?", "collection_id?", "status?", "limit?", "offset?"], output: "TakeBackRequest[]", side_effects: [] }
  - { method: POST, path: "/carpetloop/take-back-requests/{takeback_id}/schedule", description: "Schedule pickup into a future window", roles: [Installer], code: 200, input: [pickup_window_start, pickup_window_end], output: TakeBackRequest, side_effects: ["REQUESTED->SCHEDULED", "sets pickup window fields"] }
  - { method: POST, path: "/carpetloop/take-back-requests/{takeback_id}/collect", description: "Confirm collection with weighed mass", roles: [Installer], code: 200, input: [collected_kg], output: TakeBackRequest, side_effects: ["SCHEDULED->COLLECTED", "sets collected_kg"] }
  - { method: POST, path: "/carpetloop/take-back-requests/{takeback_id}/cancel", description: "Cancel a requested or scheduled take-back", roles: [Specifier], code: 200, input: [], output: TakeBackRequest, side_effects: ["->CANCELLED", "clears pickup window fields"] }
  - { method: POST, path: "/carpetloop/take-back-requests/{takeback_id}/sort", description: "Record sorting pathway masses; computes credit; may create a feedstock lot", roles: [SustainabilityManager], code: 200, input: [reuse_kg, depolymerize_kg, downcycle_kg, landfill_kg], output: TakeBackRequest, side_effects: ["COLLECTED->CREDITED", "computes credit_variant and credit_cents (calculation takeback_credit)", "sets credited_at to the logical clock", "cascade C: depolymerize_kg > 0 creates a FeedstockLot (POST_CONSUMER_TILE, factor TAKEBACK_LOT_CARBON_FACTOR, supplier TAKEBACK_SUPPLIER_NAME, RECEIVED, origin_takeback_id set)"] }

  # --- PCFReport ---
  - { method: POST, path: "/carpetloop/pcf-reports", description: "Open a product carbon footprint report (OCC on collection); supersedes overlapping DRAFTs", roles: [SustainabilityManager], code: 201, input: [collection_id, period_start, period_end, boundary, expected_collection_version], output: PCFReport, side_effects: ["same-collection DRAFT reports with overlapping half-open period -> SUPERSEDED", "status=DRAFT", "increments ProductCollection.version by 1"] }
  - { method: GET, path: "/carpetloop/pcf-reports/{report_id}", description: "Get a report", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: PCFReport, side_effects: [] }
  - { method: GET, path: "/carpetloop/pcf-reports", description: "List reports with filters", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["collection_id?", "status?", "limit?", "offset?"], output: "PCFReport[]", side_effects: [] }
  - { method: POST, path: "/carpetloop/pcf-reports/{report_id}/submit", description: "Submit for verification; computes both footprint variants", roles: [SustainabilityManager], code: 200, input: [], output: PCFReport, side_effects: ["DRAFT->SUBMITTED", "computes operational_kgco2e_per_m2 and lifecycle_kgco2e_per_m2", "sets submitted_by"] }
  - { method: POST, path: "/carpetloop/pcf-reports/{report_id}/revise", description: "Return a rejected report to DRAFT for correction", roles: [SustainabilityManager], code: 200, input: [], output: PCFReport, side_effects: ["REJECTED->DRAFT", "clears submitted_by, verifier_org, verified_by and both variant values"] }
  - { method: POST, path: "/carpetloop/pcf-reports/{report_id}/verification", description: "Verification actions: ASSIGN (manager, sets verifier_org), CLEAR (verifier, SoD vs submitted_by), FAIL (verifier, findings_count >= 1)", roles: [SustainabilityManager, Verifier], code: 200, input: [action, "verifier_org?", "findings_count?"], output: PCFReport, side_effects: ["ASSIGN: SUBMITTED->IN_VERIFICATION", "CLEAR: IN_VERIFICATION->VERIFIED, sets verified_by", "FAIL: IN_VERIFICATION->REJECTED"] }
  - { method: POST, path: "/carpetloop/pcf-reports/{report_id}/publish", description: "Publish a verified report; cascades supersede -> retire -> revoke", roles: [SustainabilityManager], code: 200, input: [], output: PCFReport, side_effects: ["VERIFIED->PUBLISHED", "cascade A: overlapping PUBLISHED reports -> SUPERSEDED; their PUBLISHED claims -> RETIRED; ISSUED packages referencing those claims -> REVOKED"] }

  # --- CarbonClaim ---
  - { method: POST, path: "/carpetloop/carbon-claims", description: "Draft a carbon claim bound to a report and boundary", roles: [SustainabilityManager], code: 201, input: [collection_id, report_id, claim_type, claimed_volume_m2, boundary, "manufacturing_target_id?"], output: CarbonClaim, side_effects: ["status=DRAFT", "created_by=X-User-ID", "offset_coverage=NONE, retired_kgco2e=0"] }
  - { method: GET, path: "/carpetloop/carbon-claims/{claim_id}", description: "Get a claim", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: CarbonClaim, side_effects: [] }
  - { method: GET, path: "/carpetloop/carbon-claims", description: "List claims with filters", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["collection_id?", "report_id?", "manufacturing_target_id?", "status?", "limit?", "offset?"], output: "CarbonClaim[]", side_effects: [] }
  - { method: POST, path: "/carpetloop/carbon-claims/{claim_id}/submit", description: "Submit (or resubmit) a claim for review; computes offset requirement", roles: [SustainabilityManager], code: 200, input: [], output: CarbonClaim, side_effects: ["DRAFT|REJECTED->IN_REVIEW", "computes required_offset_kgco2e (calculation claim_offset_requirement)", "refreshes offset_coverage"] }
  - { method: POST, path: "/carpetloop/carbon-claims/{claim_id}/review", description: "Approve or reject a claim (segregated from creator)", roles: [ClaimsApprover], code: 200, input: [decision], output: CarbonClaim, side_effects: ["IN_REVIEW->APPROVED (decision=APPROVE) or ->REJECTED (decision=REJECT)", "sets reviewed_by"] }
  - { method: POST, path: "/carpetloop/carbon-claims/{claim_id}/publish", description: "Publish an approved claim; requires FULL offset coverage and a still-published report", roles: [SustainabilityManager], code: 200, input: [], output: CarbonClaim, side_effects: ["APPROVED->PUBLISHED"] }

  # --- OffsetRetirement ---
  - { method: POST, path: "/carpetloop/carbon-claims/{id}/offsets", description: "Retire offsets against a claim (immediate retirement; claim must be IN_REVIEW or APPROVED)", roles: [SustainabilityManager], code: 201, input: [registry, vintage_year, quantity_kgco2e], output: OffsetRetirement, side_effects: ["claim.retired_kgco2e += quantity_kgco2e", "claim.offset_coverage recomputed"] }
  - { method: GET, path: "/carpetloop/carbon-claims/{id}/offsets", description: "List a claim's offset retirements", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["limit?", "offset?"], output: "OffsetRetirement[]", side_effects: [] }

  # --- ManufacturingTarget ---
  - { method: POST, path: "/carpetloop/manufacturing-targets", description: "Create a manufacturing emissions reduction target", roles: [PlatformAdmin], code: 201, input: [program_name, baseline_intensity_kgco2e_per_m2, target_reduction_pct], output: ManufacturingTarget, side_effects: ["current_intensity=baseline", "posture=AT_RISK", "readings_log=[]"] }
  - { method: GET, path: "/carpetloop/manufacturing-targets/{target_id}", description: "Get a target", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: ManufacturingTarget, side_effects: [] }
  - { method: POST, path: "/carpetloop/manufacturing-targets/{target_id}/readings", description: "Record a period intensity reading; recomputes posture; cascade B reverts IN_REVIEW claims on breach", roles: [SustainabilityManager], code: 200, input: [period_end, intensity_kgco2e_per_m2], output: ManufacturingTarget, side_effects: ["appends readings_log", "recomputes current_intensity and posture (calculation target_posture)", "cascade B: on entering BREACHED, claims with this manufacturing_target_id in IN_REVIEW -> DRAFT"] }

  # --- SpecPackage ---
  - { method: POST, path: "/carpetloop/spec-packages", description: "Issue a sustainability documentation package to an architect firm (OCC on collection); supersedes the prior ISSUED package for the same firm+collection", roles: [Specifier], code: 201, input: [architect_firm, collection_id, report_id, "claim_id?", expected_collection_version], output: SpecPackage, side_effects: ["prior ISSUED package for same (architect_firm, collection_id) -> SUPERSEDED", "package_version = next per-pair sequence", "status=ISSUED", "created_by=X-User-ID", "increments ProductCollection.version by 1"] }
  - { method: GET, path: "/carpetloop/spec-packages/{package_id}", description: "Get a package", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: [], output: SpecPackage, side_effects: [] }
  - { method: GET, path: "/carpetloop/spec-packages", description: "List packages with filters", roles: [PlatformAdmin, SustainabilityManager, Verifier, ClaimsApprover, Specifier, Installer], code: 200, input: ["architect_firm?", "collection_id?", "report_id?", "claim_id?", "status?", "limit?", "offset?"], output: "SpecPackage[]", side_effects: [] }

  # --- Logical clock (test-driving endpoint, outside the api_prefix) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [current_utc], output: "{ current_utc: string }", side_effects: ["sets the logical clock used by all temporal validations and credited_at/retired_at stamps"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, action-level role mismatch on verification, or ownership mismatch (created_by / contractor_name)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Verifier X-User-ID equals report.submitted_by, or claim reviewer equals claim.created_by" }
  - { id: ERR_COLLECTION_NOT_FOUND, http: 404, condition: "Referenced collection id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "Referenced batch id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Referenced feedstock lot id does not exist" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "Referenced site id does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "Referenced zone id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Referenced replacement order id does not exist" }
  - { id: ERR_TAKEBACK_NOT_FOUND, http: 404, condition: "Referenced take-back request id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Referenced report id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced claim id does not exist" }
  - { id: ERR_TARGET_NOT_FOUND, http: 404, condition: "Referenced manufacturing target id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "Referenced spec package id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum member, or out-of-range scalar (vintage_year < 2020, non-positive quantities, target_reduction_pct outside (0,1))" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists" }
  - { id: ERR_COLLECTION_SUNSET, http: 409, condition: "Batch creation, report creation, or report submission against a SUNSET collection" }
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Zone creation against a batch not in RELEASED" }
  - { id: ERR_SITE_NOT_INSTALLED, http: 409, condition: "Zone creation or take-back creation against a site in PLANNED or DECOMMISSIONED" }
  - { id: ERR_ZONE_NOT_IN_SERVICE, http: 409, condition: "Order create/match/complete against a zone not IN_SERVICE" }
  - { id: ERR_ORDER_NOT_MATCHED, http: 409, condition: "Completion attempted on an order not in MATCHED" }
  - { id: ERR_TAKEBACK_IN_FLIGHT, http: 409, condition: "Site decommission while a take-back is REQUESTED, SCHEDULED, or COLLECTED" }
  - { id: ERR_DYE_LOT_CONFLICT, http: 409, condition: "dye_lot_code already exists within the collection" }
  - { id: ERR_ZONE_CODE_CONFLICT, http: 409, condition: "zone_code (or new_zone_code at completion) duplicates a zone code IN_SERVICE at the site" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report creation whose half-open period overlaps a same-collection report in SUBMITTED, IN_VERIFICATION, or VERIFIED" }
  - { id: ERR_CONTRACTOR_WINDOW_CONFLICT, http: 409, condition: "Install window conflicts with another INSTALLED|IN_SERVICE site of the same contractor after adding the 1-day buffer at both ends" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on a create-with-supersede endpoint" }
  - { id: ERR_MIX_MASS_MISMATCH, http: 422, condition: "Batch release with allocated_mass_kg != produced_m2 x TILE_MASS_KG_PER_M2 at 2dp" }
  - { id: ERR_SORT_MASS_IMBALANCE, http: 422, condition: "Sort pathway masses negative or their sum != collected_kg at 2dp" }
  - { id: ERR_EMPTY_REPORT_INPUT, http: 422, condition: "Report submission whose input set (batches in period, RELEASED|EXHAUSTED) is empty" }
  - { id: ERR_PICKUP_WINDOW_INVALID, http: 422, condition: "Schedule with start >= end, or start not after the current logical clock" }
  - { id: ERR_COLLECT_WINDOW_NOT_OPEN, http: 422, condition: "Collect before pickup_window_start per the logical clock" }
  - { id: ERR_CONTRACTOR_CERT_EXPIRED, http: 422, condition: "Certified contractor whose cert_expires_on <= install_window_start at install time" }
  - { id: ERR_ADHESIVE_FREE_CERT_REQUIRED, http: 422, condition: "ADHESIVE_FREE installation_system with adhesive_free_certified == false" }
  - { id: ERR_LOT_NOT_QC_PASSED, http: 422, condition: "Allocate from a lot not in QC_PASSED" }
  - { id: ERR_REPORT_NOT_PUBLISHED, http: 422, condition: "Claim submit/publish or package issuance referencing a report not in PUBLISHED" }
  - { id: ERR_CLAIM_NOT_PUBLISHED, http: 422, condition: "Package issuance referencing a claim not in PUBLISHED" }
  - { id: ERR_BOUNDARY_MISMATCH, http: 422, condition: "Claim boundary differs from the referenced report's boundary" }
  - { id: ERR_NEGATIVE_REQUIRES_CRADLE_TO_GRAVE, http: 422, condition: "CARBON_NEGATIVE claim created with boundary != CRADLE_TO_GRAVE" }
  - { id: ERR_TARGET_REQUIRED_FOR_NEGATIVE, http: 422, condition: "CARBON_NEGATIVE claim created without manufacturing_target_id" }
  - { id: ERR_TARGET_BREACHED, http: 422, condition: "CARBON_NEGATIVE claim submission while the referenced target's posture is BREACHED" }
  - { id: ERR_OFFSET_COVERAGE_INSUFFICIENT, http: 422, condition: "Claim publication with offset_coverage != FULL" }
  - { id: ERR_INSUFFICIENT_LOT_KG, http: 422, condition: "Allocate quantity exceeding lot.available_kg" }
  - { id: ERR_AREA_EXCEEDS_BATCH, http: 422, condition: "Zone area exceeding batch.available_m2" }
  - { id: ERR_REPLACEMENT_BUDGET_EXCEEDED, http: 422, condition: "Completion where spent_replacement_cents + quoted_cost_cents exceeds annual_replacement_budget_cents" }
  - { id: ERR_ZONE_SITE_MISMATCH, http: 422, condition: "Replacement order whose zone_id belongs to a different site than site_id" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Program operator: product config, dye lots, feedstock intake and QC, emissions targets, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /carpetloop/collections, /carpetloop/collections/{id}/sunset"
      - "POST /carpetloop/collections/{id}/batches, /carpetloop/batches/{id}/release"
      - "POST /carpetloop/feedstock-lots, /carpetloop/feedstock-lots/{id}/qc"
      - "POST /carpetloop/manufacturing-targets"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: SustainabilityManager
    description: "Owns carbon data: feedstock allocation, sorting decisions, PCF reports, claims, offsets, target readings"
    identity: opaque
    exclusive_operations:
      - "POST /carpetloop/feedstock-lots/{id}/allocate, /deallocate"
      - "POST /carpetloop/take-back-requests/{id}/sort"
      - "POST /carpetloop/pcf-reports and submit/revise/publish; verification action=ASSIGN"
      - "POST /carpetloop/carbon-claims and submit/publish; /carpetloop/carbon-claims/{id}/offsets"
      - "POST /carpetloop/manufacturing-targets/{id}/readings"
    shared_operations: ["All GET endpoints"]
  - name: Verifier
    description: "Third-party verifier: clears or fails reports under verification; barred from touching reports submitted by the same X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /carpetloop/pcf-reports/{id}/verification with action=CLEAR or FAIL"
    shared_operations: ["All GET endpoints"]
  - name: ClaimsApprover
    description: "Independent claim reviewer; barred from reviewing claims created by the same X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /carpetloop/carbon-claims/{id}/review"
    shared_operations: ["All GET endpoints"]
  - name: Specifier
    description: "Architect/designer firm user: registers sites, requests replacements and take-backs, issues documentation packages; ownership via created_by"
    identity: opaque
    exclusive_operations:
      - "POST /carpetloop/sites"
      - "POST /carpetloop/replacement-orders, /carpetloop/replacement-orders/{id}/cancel"
      - "POST /carpetloop/take-back-requests, /carpetloop/take-back-requests/{id}/cancel"
      - "POST /carpetloop/spec-packages"
    shared_operations: ["All GET endpoints"]
  - name: Installer
    description: "Certified installation contractor: installs/decommissions sites, lays zones, runs matches and completions, schedules and collects take-backs; ownership via site.contractor_name"
    identity: opaque
    exclusive_operations:
      - "POST /carpetloop/sites/{id}/install, /decommission, /zones"
      - "POST /carpetloop/replacement-orders/{id}/match, /complete"
      - "POST /carpetloop/take-back-requests/{id}/schedule, /collect"
    shared_operations: ["All GET endpoints"]
