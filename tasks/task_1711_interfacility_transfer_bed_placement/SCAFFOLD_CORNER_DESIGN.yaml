# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# Interfacility Transfer & Bed Placement
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: facility_create_computed_defaults_and_input_ignored
        claim_type: computed_fields
        grounds: [entities.Facility.fields.diversion_status, entities.Facility.fields.occupancy_pct]
        distinguishing_aspect: "A freshly created facility reports computed diversion_status OPEN, bed counts 0, and occupancy_pct == 100.0 (zero-operational-bed edge); a client-supplied diversion_status value is ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Solo Clinic", facility_code: "SOLO", trauma_level: "CRITICAL_ACCESS", capabilities: ["TRAUMA"], diversion_status: "HARD_DIVERSION" }
              as: TransferCoordinator
              captures: { fac_id: $.data.id, fac_div: $.data.diversion_status, fac_occ: $.data.occupancy_pct, fac_opbeds: $.data.operational_bed_count }
          assert:
            - "Facility.diversion_status == OPEN (client-supplied HARD_DIVERSION ignored — computed field)"
            - "operational_bed_count == 0 and unavailable_bed_count == 0"
            - "occupancy_pct == 100.0 (pinned zero-denominator rule)"
            - "id is a prefix-free UUID and version == 1"

      - name: bed_create_default_status_available
        claim_type: defaults
        grounds: [entities.Bed.fields.status, entities.Bed.fields.isolation_capable]
        distinguishing_aspect: "Omitting isolation_capable defaults it to false; a new bed starts AVAILABLE and appears in the facility's bed list."
        test_recipe:
          setup: ["facility RCV exists"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { bed_id: $.data.id, bed_status: $.data.status, bed_iso: $.data.isolation_capable }
            - call: "GET /facilities/${fac_r}/beds"
              as: Any
              captures: { listed: "$.data[0].id" }
          assert:
            - "Bed.status == AVAILABLE on creation (system default)"
            - "Bed.isolation_capable == false (input default applied)"
            - "GET /facilities/${fac_r}/beds returns exactly the created bed (FK reverse-reachability)"
            - "Facility.operational_bed_count == 1 and occupancy_pct == 0.0 after bed creation"

      - name: physician_create_default_on_call
        claim_type: defaults
        grounds: [entities.Physician.fields.is_on_call]
        distinguishing_aspect: "Omitting is_on_call defaults it to true."
        test_recipe:
          setup: ["facility exists"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
          trigger:
            - call: "POST /physicians"
              payload: { full_name: "Dr Default", facility_id: "${fac_s}", specialty: "GENERAL" }
              as: TransferCoordinator
              captures: { phys_oncall: $.data.is_on_call }
          assert:
            - "Physician.is_on_call == true when omitted"

      - name: case_create_initial_state_and_defaults
        claim_type: initial_state
        grounds: [state_machines.TransferCase, entities.TransferCase.fields.status]
        distinguishing_aspect: "A new TransferCase starts INTAKE with negotiation_round 0, refusal_count 0, emtala_obligation UNDETERMINED, active_bed_hold_id null."
        test_recipe:
          setup: ["sending facility and physician exist"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
          trigger:
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-INIT-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "STABLE", required_unit_type: "MED_SURG", required_capability: "TRAUMA" }
              as: TransferCoordinator
              captures: { case_status: $.data.status, case_round: $.data.negotiation_round, case_obl: $.data.emtala_obligation }
          assert:
            - "status == INTAKE, negotiation_round == 0, refusal_count == 0"
            - "emtala_obligation == UNDETERMINED and emtala_determined_at == null"
            - "requires_isolation defaulted to false; active_bed_hold_id == null; version == 1"

      - name: case_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=2.5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required patient_ref is rejected at request-schema priority with ERR_INVALID_REQUEST (400) before any existence checks."
        test_recipe:
          setup: ["sending facility and physician exist"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
          trigger:
            - call: "POST /transfer-cases"
              payload: { sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "STABLE", required_unit_type: "MED_SURG", required_capability: "TRAUMA" }
              as: TransferCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400; no TransferCase row is persisted"

      - name: bed_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=2.5]", entities.Bed.fields.unit_type]
        distinguishing_aspect: "unit_type outside the declared enum is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["facility exists"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "X-01", unit_type: "PARKING_LOT" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: case_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random UUID yields ERR_CASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /transfer-cases/00000000-0000-4000-8000-000000000000"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CASE_NOT_FOUND with http 404"

      - name: resource_get_not_found_across_entities
        claim_type: not_found
        grounds: ["errors[ERR_HOLD_NOT_FOUND]", "errors[ERR_COMMUNICATION_NOT_FOUND]", "errors[ERR_REFUSAL_RECORD_NOT_FOUND]", "errors[ERR_REVIEW_NOT_FOUND]", "errors[ERR_DISPATCH_NOT_FOUND]", "errors[ERR_NOTIFICATION_NOT_FOUND]", "errors[ERR_PACKET_NOT_FOUND]", "errors[ERR_DIVERSION_NOT_FOUND]", "errors[ERR_BED_NOT_FOUND]", "errors[ERR_FACILITY_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET (and sub-resource parent) resolves its own domain 404 code, path ids validated left-to-right."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /bed-holds/00000000-0000-4000-8000-000000000001"
              as: Any
              captures: { e1: $.data.error_id }
            - call: "GET /communications/00000000-0000-4000-8000-000000000002"
              as: Any
              captures: { e2: $.data.error_id }
            - call: "GET /refusal-records/00000000-0000-4000-8000-000000000003"
              as: Any
              captures: { e3: $.data.error_id }
            - call: "GET /quality-reviews/00000000-0000-4000-8000-000000000004"
              as: Any
              captures: { e4: $.data.error_id }
            - call: "GET /transport-dispatches/00000000-0000-4000-8000-000000000005"
              as: Any
              captures: { e5: $.data.error_id }
            - call: "GET /insurance-notifications/00000000-0000-4000-8000-000000000006"
              as: Any
              captures: { e6: $.data.error_id }
            - call: "GET /clinical-packets/00000000-0000-4000-8000-000000000007"
              as: Any
              captures: { e7: $.data.error_id }
            - call: "POST /diversion-events/00000000-0000-4000-8000-000000000008/lift"
              payload: {}
              as: BedManager
              as_user_id: "00000000-0000-4000-8000-000000000099"
              captures: { e8: $.data.error_id }
            - call: "PUT /beds/00000000-0000-4000-8000-000000000009"
              payload: { status: "OCCUPIED" }
              as: BedManager
              as_user_id: "00000000-0000-4000-8000-000000000099"
              captures: { e9: $.data.error_id }
            - call: "GET /facilities/00000000-0000-4000-8000-000000000010/beds"
              as: Any
              captures: { e10: $.data.error_id }
          assert:
            - "e1 == ERR_HOLD_NOT_FOUND, e2 == ERR_COMMUNICATION_NOT_FOUND, e3 == ERR_REFUSAL_RECORD_NOT_FOUND, e4 == ERR_REVIEW_NOT_FOUND"
            - "e5 == ERR_DISPATCH_NOT_FOUND, e6 == ERR_NOTIFICATION_NOT_FOUND, e7 == ERR_PACKET_NOT_FOUND"
            - "e8 == ERR_DIVERSION_NOT_FOUND, e9 == ERR_BED_NOT_FOUND, e10 == ERR_FACILITY_NOT_FOUND — all http 404"

      - name: case_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints.GET /transfer-cases]
        distinguishing_aspect: "List responses carry the pinned pagination fields with correct total_count/has_more math under limit+offset."
        test_recipe:
          setup: ["one facility, one physician, three transfer cases"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PG-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "STABLE", required_unit_type: "MED_SURG", required_capability: "TRAUMA" }
              as: TransferCoordinator
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PG-2", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "STABLE", required_unit_type: "MED_SURG", required_capability: "TRAUMA" }
              as: TransferCoordinator
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PG-3", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "URGENT", required_unit_type: "ICU", required_capability: "TRAUMA" }
              as: TransferCoordinator
          trigger:
            - call: "GET /transfer-cases?limit=2&offset=0"
              as: Any
            - call: "GET /transfer-cases?limit=2&offset=2"
              as: Any
            - call: "GET /transfer-cases?status=INTAKE&sending_physician_id=${phys_s}"
              as: Any
          assert:
            - "page 1: data length == 2, meta.total_count == 3, meta.has_more == true (defaults limit 10/offset 0 honored when omitted)"
            - "page 2: data length == 1, meta.has_more == false"
            - "filtered query returns 3 rows for status INTAKE (all cases still INTAKE)"
            - "success envelope shape: meta.api_request_id and meta.api_request_timestamp present, response_type == array"

      - name: refusal_record_immutable_no_version
        claim_type: immutability
        grounds: [entities.RefusalRecord]
        distinguishing_aspect: "RefusalRecord is an append-only event (common_fields false): GET responses expose id and created_at but no version or updated_at, and no mutation endpoint exists."
        test_recipe:
          setup: ["an EMTALA_NOT_APPLIES case refused once"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-IMM-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "STABLE", required_unit_type: "MED_SURG", required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: false, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/refuse"
              payload: { refusal_category: "CAPABILITY_UNAVAILABLE", narrative: "Requested neuro-interventional capability is not available at this facility." }
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
          trigger:
            - call: "GET /refusal-records?transfer_case_id=${case_id}"
              as: Any
              captures: { rr_id: "$.data[0].id" }
            - call: "GET /refusal-records/${rr_id}"
              as: Any
          assert:
            - "RefusalRecord response contains id and created_at but NO version and NO updated_at fields (common_fields: false)"
            - "no PUT/PATCH/DELETE endpoint exists for /refusal-records in the API surface"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: case_depart_before_dispatch_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TransferCase.TRANSPORT_ARRANGED_to_EN_ROUTE]
        distinguishing_aspect: "depart is only legal from TRANSPORT_ARRANGED; from ACCEPTED it fails ERR_INVALID_STATE with no dispatch mutation."
        test_recipe:
          setup: ["EMTALA_APPLIES CRITICAL ICU case ACCEPTED at RCV (one AVAILABLE ICU bed)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-DEP-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "CRITICAL", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
          trigger:
            - call: "POST /transfer-cases/${case_id}/depart"
              payload: {}
              as: TransferCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; TransferCase.${case_id}.status remains ACCEPTED; zero TransportDispatch rows exist for the case"

      - name: terminal_case_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TransferCase]
        distinguishing_aspect: "From terminal CANCELLED no further transition is accepted: request-acceptance, dispatch, cancel again all fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["case cancelled from EMTALA_DETERMINED"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-TERM-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "URGENT", required_unit_type: "TELEMETRY", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/cancel"
              payload: { cancel_reason: "Transfer no longer clinically indicated." }
              as: TransferCoordinator
          trigger:
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
              captures: { err_a: $.data.error_id }
            - call: "POST /transfer-cases/${case_id}/cancel"
              payload: { cancel_reason: "Second cancel attempt." }
              as: TransferCoordinator
              captures: { err_b: $.data.error_id }
          assert:
            - "both attempts -> ERR_INVALID_STATE with http 409 (terminal lockdown)"
            - "TransferCase.${case_id}.status remains CANCELLED"

      - name: certify_twice_and_certify_without_screening_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EmtalaScreening.DRAFT_to_CERTIFIED, "errors[ERR_SCREENING_NOT_FOUND]"]
        distinguishing_aspect: "certify is legal only from DRAFT/AMENDED with an existing screening: a second certify fails ERR_INVALID_STATE; certify with no screening row fails ERR_SCREENING_NOT_FOUND (existence beats state)."
        test_recipe:
          setup: ["case1 with certified screening; case2 with no screening at all"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-CERT-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "EMERGENT", required_unit_type: "ICU", requires_isolation: false, required_capability: "TRAUMA" }
              as: TransferCoordinator
              captures: { case1: $.data.id }
            - call: "POST /transfer-cases/${case1}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case1}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-CERT-2", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "STABLE", required_unit_type: "MED_SURG", requires_isolation: false, required_capability: "TRAUMA" }
              as: TransferCoordinator
              captures: { case2: $.data.id }
          trigger:
            - call: "POST /transfer-cases/${case1}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { err_a: $.data.error_id }
            - call: "POST /transfer-cases/${case2}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { err_b: $.data.error_id }
          assert:
            - "case1 re-certify -> ERR_INVALID_STATE (screening already CERTIFIED)"
            - "case2 certify without screening -> ERR_SCREENING_NOT_FOUND (404, existence priority 3 beats state priority 4)"

      - name: screening_amend_after_case_advances_locked
        claim_type: precondition_enforcement
        grounds: [state_machines.EmtalaScreening.CERTIFIED_to_AMENDED, "errors[ERR_SCREENING_LOCKED]"]
        distinguishing_aspect: "Once the case advances past EMTALA_DETERMINED (request-acceptance sent), amend fails ERR_SCREENING_LOCKED — the cyclic loop is only open while the case sits at EMTALA_DETERMINED."
