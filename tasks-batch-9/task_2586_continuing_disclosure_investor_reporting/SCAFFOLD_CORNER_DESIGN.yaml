              captures: { fte_final: "$.data.status", fte_ref: "$.data.remediation_filing_id", fte_at: "$.data.remediated_at" }
          assert:
            - "${due_a} == \"2026-01-26\"; ${fb_status} == CONFIRMED; ${swept_delinquent} == 1 and ${swept_failures} == 1"
            - "${fte_status} == OPEN with ${fte_days} == 187 and ${fte_sev} == MAJOR"
            - "${e_wrong_undertaking} == ERR_REMEDIATION_FILING_INVALID (409) — the filing IS confirmed, but it belongs to undertaking B"
            - "${cycle_a_status} == READY_TO_FILE and ${fa_status} == DRAFT"
            - "${e_not_confirmed} == ERR_REMEDIATION_FILING_INVALID (409) — the filing IS on the right cycle, but a DRAFT is not evidence of anything"
            - "${fa_status_final} == CONFIRMED; ${fte_count} == 2 — confirmation minted a second, ANNUAL_REPORT_LATE failure alongside the swept one"
            - "${fte_status_mid} == REMEDIATION_PENDING — the confirmation cascade moved the original failure out of OPEN by itself"
            - "${fte_final} == REMEDIATED with ${fte_ref} == \"${fa}\" and ${fte_at} == 2026-08-01T00:00:00Z (the logical clock, untouched throughout)"

      - name: pagination_bounds_are_rejected_at_both_ends
        claim_type: violation_to_error
        grounds:
          - validations.priority_36
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          The bounds are asymmetric — limit is 1..100 inclusive while offset is only bounded below
          at 0 — so the four probes straddle three different edges: limit 0 (below), limit 101
          (above), offset -1 (below), and the legal extremes limit 1 and limit 100. The successful
          calls must also show has_more flipping with the offset while total_count stays fixed at
          the unpaginated size.
        test_recipe:
          setup:
            - "Two OUTSTANDING BondIssues, so a limit of 1 leaves a remainder."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_a: "$.data.id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026B", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_b: "$.data.id" }
          trigger:
            - call: "GET /disclosure/bond-issues?limit=0"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_limit_low: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues?limit=101"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_limit_high: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues?offset=-1"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_offset: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues?limit=1&offset=0"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { p1_first: "$.data[0].id", p1_total: "$.total_count", p1_more: "$.has_more", p1_limit: "$.limit", p1_offset: "$.offset" }
            - call: "GET /disclosure/bond-issues?limit=1&offset=1"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { p2_first: "$.data[0].id", p2_total: "$.total_count", p2_more: "$.has_more" }
            - call: "GET /disclosure/bond-issues?limit=100"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { p3_total: "$.total_count", p3_more: "$.has_more", p3_limit: "$.limit" }
            - call: "GET /disclosure/bond-issues"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { p4_limit: "$.limit", p4_offset: "$.offset", p4_total: "$.total_count" }
          assert:
            - "${e_limit_low} == ERR_INVALID_PAGINATION (422) — limit 0 is below the 1..100 range"
            - "${e_limit_high} == ERR_INVALID_PAGINATION (422) — limit 101 is above it"
            - "${e_offset} == ERR_INVALID_PAGINATION (422) — a negative offset is refused, though there is no upper bound on offset"
            - "${p1_limit} == 1, ${p1_offset} == 0, ${p1_total} == 2, ${p1_more} == true and ${p1_first} == \"${issue_a}\" (created_at ASC)"
            - "${p2_total} == 2, ${p2_more} == false and ${p2_first} == \"${issue_b}\" — total_count is the unpaginated size and does not shrink with the window"
            - "${p3_limit} == 100 and ${p3_total} == 2 with ${p3_more} == false — 100 is the inclusive upper bound and is accepted"
            - "${p4_limit} == 10 and ${p4_offset} == 0 with ${p4_total} == 2 — the declared defaults apply when both params are omitted"

  - section: endpoints
    instances:

      - name: content_item_read_list_and_partial_update_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/disclosure/cycle-content-items/{id}
          - endpoints.GET_/disclosure/cycle-content-items
          - endpoints.PATCH_/disclosure/cycle-content-items/{id}
          - calculations.content_preparation_completeness_score
        distinguishing_aspect: >-
          CycleContentItem is the only PATCHable entity in the domain and it is never POSTed
          directly — it appears by cascade — so its CRUD surface is read, list and PARTIAL update.
          Each PATCH must merge rather than replace: supplying only audit_opinion_type must leave
          the previously stored data_as_of_date intact, and each PATCH must bump version by exactly
          one. The completeness score reads 0.00 after the first PATCH and 30.00 after the second,
          proving the audit-opinion multiplier is a real factor and not decoration.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking carrying AUDITED_FINANCIALS 6000 (requires_audit_opinion true) and OPERATING_DATA_TABLE 4000, and one FY2026 cycle whose two items are both NOT_STARTED."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 6000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_fin: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 4000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_ops: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
          trigger:
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { list_total: "$.total_count", list_more: "$.has_more" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req_fin}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_fin: "$.data[0].id", fin_status0: "$.data[0].status", fin_snap: "$.data[0].weight_bp_snapshot", fin_ver0: "$.data[0].version" }
            - call: "GET /disclosure/cycle-content-items/${item_fin}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { single_id: "$.data.id", single_cycle: "$.data.cycle_id", single_req: "$.data.content_requirement_id", single_ready: "$.data.readiness_factor" }
            - call: "PATCH /disclosure/cycle-content-items/${item_fin}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "CAFR-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { p1_status: "$.data.status", p1_asof: "$.data.data_as_of_date", p1_opinion: "$.data.audit_opinion_type", p1_ver: "$.data.version", p1_ready: "$.data.readiness_factor" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score_mid: "$.data.completeness_score_pct" }
            - call: "PATCH /disclosure/cycle-content-items/${item_fin}"
              payload: { audit_opinion_type: "UNMODIFIED" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { p2_asof: "$.data.data_as_of_date", p2_ref: "$.data.source_document_ref", p2_opinion: "$.data.audit_opinion_type", p2_ver: "$.data.version" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&status=DRAFT"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { draft_total: "$.total_count" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score_after: "$.data.completeness_score_pct" }
          assert:
            - "${list_total} == 2 and ${list_more} == false — the cascade created exactly one item per requirement"
            - "${fin_status0} == NOT_STARTED, ${fin_snap} == 6000, ${fin_ver0} == 1, ${single_id} == \"${item_fin}\", ${single_cycle} == \"${cycle_id}\", ${single_req} == \"${req_fin}\", ${single_ready} == 0.0 — the single read and the list row agree field for field"
            - "${p1_status} == DRAFT, ${p1_asof} == \"2026-06-30\", ${p1_opinion} == null, ${p1_ver} == 2, ${p1_ready} == 0.5 — the first PATCH promotes NOT_STARTED to DRAFT"
            - "${score_mid} == 0.00 — a DRAFT audited-financials item with NO opinion recorded is worth nothing: readiness 0.5 times multiplier 0.0"
            - "${p2_asof} == \"2026-06-30\" and ${p2_ref} == \"CAFR-FY2026.pdf\" — the second PATCH did not blank the fields it omitted"
            - "${p2_opinion} == UNMODIFIED and ${p2_ver} == 3 — one increment per PATCH, no skipped versions"
            - "${draft_total} == 1 — the status filter sees only the patched item"
            - "${score_after} == 30.00 — 6000/10000 * 0.5 * 1.0 = 0.3000, and the NOT_STARTED item contributes 0.0000"
            - "no DELETE verb exists anywhere in §1.5: records are retired by status (WITHDRAWN, VOID, TERMINATED, CLOSED_NOT_REQUIRED), never removed"

      - name: suspend_and_reinstate_gate_every_preparation_endpoint
        claim_type: action_endpoint
        grounds:
          - state_machines[Undertaking].ACTIVE->SUSPENDED
          - state_machines[Undertaking].SUSPENDED->ACTIVE
          - validations.priority_10
          - validations.priority_8
        distinguishing_aspect: >-
          The suspend/reinstate pair is a pure action endpoint whose only visible product is a
          status plus a stamped reason, but it gates a whole family of other endpoints: while
          SUSPENDED, both PATCHing an item and opening a new cycle return
          ERR_UNDERTAKING_NOT_ACTIVE, and reinstatement must clear suspended_reason back to null
          rather than leaving the stale text behind. Repeating either action from its own target
          state is refused by priority 8, so neither is idempotent.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking, a single 10000-bp OPERATING_DATA_TABLE requirement and one FY2026 cycle."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_reason0: "$.data.suspended_reason" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
          trigger:
            - call: "POST /disclosure/undertakings/${und_id}/suspend"
              payload: { suspended_reason: "Audit not complete; preparation paused by the finance director." }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { s_status: "$.data.status", s_reason: "$.data.suspended_reason", s_posture: "$.data.compliance_posture" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.xlsx" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_patch: "$.data.error_id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2027", period_start_date: "2026-07-01", period_end_date: "2027-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_cycle: "$.data.error_id" }
            - call: "POST /disclosure/undertakings/${und_id}/suspend"
              payload: { suspended_reason: "Still paused." }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_resuspend: "$.data.error_id" }
            - call: "POST /disclosure/undertakings/${und_id}/reinstate"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { r_status: "$.data.status", r_reason: "$.data.suspended_reason" }
            - call: "POST /disclosure/undertakings/${und_id}/reinstate"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_rereinstate: "$.data.error_id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.xlsx" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { p_status: "$.data.status" }
          assert:
            - "${und_reason0} == null on creation"
            - "${s_status} == SUSPENDED with ${s_reason} echoing the supplied text, and ${s_posture} == COMPLIANT — suspension is a lifecycle dimension and must not touch the compliance posture"
            - "${e_patch} == ERR_UNDERTAKING_NOT_ACTIVE (409) — priority 10 reaches down to the grandchild item through its cycle"
            - "${e_cycle} == ERR_UNDERTAKING_NOT_ACTIVE (409) — the FY2027 period is otherwise perfectly legal"
            - "${e_resuspend} == ERR_INVALID_STATE_TRANSITION (409) — suspend is not idempotent"
            - "${r_status} == ACTIVE and ${r_reason} == null — reinstatement CLEARS the reason rather than leaving stale text"
            - "${e_rereinstate} == ERR_INVALID_STATE_TRANSITION (409)"
            - "${p_status} == DRAFT — the identical PATCH that was refused during suspension now succeeds"

      - name: derived_undertaking_fields_agree_across_write_single_read_and_list
        claim_type: computed_read
        grounds:
          - calculations.undertaking_open_obligation_count
          - calculations.undertaking_delinquency_counters
          - endpoints.GET_/disclosure/undertakings/{id}
          - endpoints.GET_/disclosure/undertakings
        distinguishing_aspect: >-
          Three read paths must produce byte-identical derived values for the same undertaking: the
          body of the write that changed them, the single-resource GET, and the row inside the list
