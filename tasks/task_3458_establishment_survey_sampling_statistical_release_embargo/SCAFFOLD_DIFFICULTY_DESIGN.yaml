            - "release.revision_notice_required == false (no estimate change has occurred)"

  # ---------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances; depth 3 and depth 2; different triggers)
  # ---------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: embargo_breach_cascade_depth3
        grounds:
          - state_machines.EmbargoGrant.ISSUED_to_BREACHED
          - state_machines.MediaOutlet.ACCREDITED_to_SUSPENDED
          - state_machines.EmbargoGrant.ACCESSED_to_REVOKED
          - entities.ReleaseEvent.fields.active_embargo_grant_count
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: reporting a breach on the
          October grant (link 1: grant -> BREACHED) suspends the outlet
          (link 2: ACCREDITED -> SUSPENDED), which revokes the outlet's OTHER
          grant on the already-published September release (link 3: ACCESSED
          -> REVOKED), which recomputes that release's
          active_embargo_grant_count 1 -> 0 (link 4 target). Each mutation is
          caused by the previous link, not by the original breach call.
        test_recipe:
          setup:
            - "Program CES (budget 3); frame frozen; E1,E2,E3 enrolled/accepted"
            - "September cycle fully reported (9,11,8), CERTIFIED; release R1 published 2026-10-01T13:30:00Z; outlet O1 ACCREDITED holds grant G1 on R1 and has read the bulletin (G1 ACCESSED)"
            - "October cycle fully reported (10,12,9), CERTIFIED; release R2 EMBARGO_OPEN at 2026-10-26T13:00:00Z; O1 holds grant G2 (ISSUED) on R2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
