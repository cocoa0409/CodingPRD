          rationale: "Priority-conflict assertion is the subject of the named §1.8 instance."

      - name: priority_safety_beats_temporal_stub
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: safety_beats_temporal_on_drill_start
          rationale: "Priority-conflict assertion is the subject of the named §1.8 instance."

      - name: drill_overlap_and_report_overlap_stubs
        claim_type: violation_to_error
