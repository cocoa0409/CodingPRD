              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_e_id: $.data.id }
            - call: "POST /income-sources/${inc_e_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_div_id}/income-sources"
              payload: { source_type: "UNEARNED_CHILD_SUPPORT", gross_monthly_cents: 20000, month_1_cents: 20000, month_2_cents: 20000, month_3_cents: 20000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_cs_id: $.data.id }
            - call: "POST /income-sources/${inc_cs_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_div_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_div_id}/diversion-grants"
              payload: {}
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { div_id: $.data.id }
            - call: "POST /diversion-grants/${div_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-10", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_oct_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-11", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
