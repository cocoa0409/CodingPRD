              as: Client
              as_user_id: "client-1"
          assert:
            - "first accept returns HTTP 422 with error_id ERR_PERMIT_REQUIRED"
            - "Permit.${permit}.status == APPROVED after decide"
            - "second accept succeeds: Estimate.${est}.status == ACCEPTED, WorkOrder.${wo}.status == SCHEDULED"

      - name: booking_finalize_requires_work_order_scheduled
        grounds:
          - state_machines.Booking.RESERVED_to_FINALIZED
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair Booking → WorkOrder (different pair than Estimate→Permit): a Booking may
          finalize only while its WorkOrder.status == SCHEDULED. After the work order is CANCELLED
          (which also RELEASES the booking), finalize is rejected ERR_BOOKING_NOT_RESERVED /
          ERR_WORK_ORDER_NOT_SCHEDULED.
        test_recipe:
          setup:
            - "SCHEDULED HOURLY work order with one RESERVED crew booking; then the work order is cancelled (booking → RELEASED)."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /crews"
              payload: { service_area_id: "${area_id}", name: "Crew A", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "18 Sched St", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Maple", dbh_inches: 20 }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v_sched: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-07-14T09:00:00Z", end_at: "2026-07-14T17:00:00Z", expected_work_order_version: "${v_sched}" }
              as: Dispatcher
              captures: { bk: $.data.id }
            - call: "POST /work-orders/${wo}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /bookings/${bk}/finalize"
              payload: { actual_hours: 6 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "WorkOrder.${wo}.status == CANCELLED"
            - "Booking.${bk}.status == RELEASED"
            - "finalize returns HTTP 409 (ERR_BOOKING_NOT_RESERVED) — booking no longer RESERVED because the work order is not SCHEDULED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=12]
          - entities.Booking.fields.start_at
          - entities.Booking.fields.end_at
        distinguishing_aspect: |
          Crew interval semantics: half-open [start, end) — a booking ending exactly when another
          begins (end==start) does NOT overlap and is accepted, but a 1-minute interior overlap is
          rejected ERR_CREW_DOUBLE_BOOKED. No mobilization buffer on crews.
        test_recipe:
          setup:
            - "Crew A holds a RESERVED booking 09:00–12:00 on 2026-07-15 for a SCHEDULED work order."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /crews"
              payload: { service_area_id: "${area_id}", name: "Crew A", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "19 Adj St", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Maple", dbh_inches: 20 }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v1: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-07-15T09:00:00Z", end_at: "2026-07-15T12:00:00Z", expected_work_order_version: "${v1}" }
              as: Dispatcher
              captures: { bk1: $.data.id }
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-07-15T12:00:00Z", end_at: "2026-07-15T14:00:00Z", expected_work_order_version: "${v2}" }
              as: Dispatcher
              captures: { bk_adj: $.data.id }
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v3: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-07-15T11:59:00Z", end_at: "2026-07-15T12:30:00Z", expected_work_order_version: "${v3}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "adjacent booking 12:00–14:00 succeeds (201) — Booking.${bk_adj}.status == RESERVED"
            - "interior-overlap booking 11:59–12:30 returns HTTP 409 ERR_CREW_DOUBLE_BOOKED"

      - name: equipment_mobilization_buffer_rejects_adjacency
        grounds:
          - validations[priority=13]
          - entities.Equipment.fields.mobilization_buffer_minutes
          - errors[ERR_EQUIPMENT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Equipment interval semantics differ from crew: a CRANE unit carries
          mobilization_buffer_minutes=30, so a back-to-back (end==start) booking that WOULD be legal
          for a crew is REJECTED for the crane (the buffer expands the occupied window on both sides).
          Different resource entity and different interval arithmetic than the crew rule.
        test_recipe:
          setup:
            - "A CRANE unit with mobilization_buffer_minutes=30 holds a RESERVED booking 09:00–12:00 on 2026-07-16 for a SCHEDULED work order."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
