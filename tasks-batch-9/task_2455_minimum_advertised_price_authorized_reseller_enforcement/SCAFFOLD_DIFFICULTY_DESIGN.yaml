  - rule_id: resource_temporal_overlap
    instances:

      - name: exception_windows_half_open_adjacency_allowed_one_second_overlap_rejected
        grounds:
          - validations[priority=11]
          - calculations.effective_map_floor
          - calculations.exception_override_floor
          - calculations.product_open_exception_count
          - entities.PricingException.fields.starts_at
          - entities.PricingException.fields.ends_at
          - entities.PricingException.fields.channel_scope
        distinguishing_aspect: |
          Resource = a Product's exception calendar, geometry = half-open
          [starts_at, ends_at) with a channel-scope dimension: a window starting exactly
          where the incumbent ends is accepted, a window starting one second earlier is
          rejected, a window inside the incumbent but scoped to a non-intersecting
          channel is accepted, and an otherwise identical window scoped ALL is rejected.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-O published effective_from 2026-08-01T00:00:00Z."
            - "Product SKU-EXC-1 msrp_cents 15000, standard_map_floor_cents 10000."
            - "Clock at 2026-08-10T00:00:00Z, so every window below is prospective (retroactive false)."
            - "Incumbent exception E1: PROMOTIONAL_EVENT, channel_scope MARKETPLACE, window [2026-09-01T00:00:00Z, 2026-09-10T00:00:00Z), requested_override_floor_cents 8000, APPROVED (override_floor_cents snapshotted at 8000, which is < 10000 and >= floor(10000 * 0.50) == 5000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-O" }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-EXC-1", name: "Aurora Tablet", msrp_cents: 15000, standard_map_floor_cents: 10000, governing_policy_id: "${pol_id}" }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod_id}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", channel_scope: "MARKETPLACE", requested_override_floor_cents: 8000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              captures: { e1_id: $.data.id, e1_retro: $.data.retroactive }
            - call: "POST /pricing-exceptions/${e1_id}/decision"
              payload: { decision: "APPROVE", decision_reason: "Labor Day event approved per brand marketing plan." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { e1_floor: $.data.override_floor_cents, e1_status: $.data.status }
          trigger:
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod_id}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-09-10T00:00:00Z", ends_at: "2026-09-20T00:00:00Z", channel_scope: "MARKETPLACE", requested_override_floor_cents: 8000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              captures: { e2_id: $.data.id, e2_status: $.data.status }
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod_id}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-09-09T23:59:59Z", ends_at: "2026-09-15T00:00:00Z", channel_scope: "MARKETPLACE", requested_override_floor_cents: 8000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              captures: { err_one_second: $.data.error_id }
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod_id}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-06T00:00:00Z", channel_scope: "OWN_WEBSITE", requested_override_floor_cents: 9000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              captures: { e4_id: $.data.id, e4_status: $.data.status }
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod_id}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-06T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 9000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              captures: { err_all_scope: $.data.error_id }
          assert:
            - "${e1_retro} == false, ${e1_status} == APPROVED and ${e1_floor} == 8000"
            - "${e2_status} == REQUESTED — starting exactly at the incumbent's exclusive ends_at 2026-09-10T00:00:00Z is NOT an overlap under half-open semantics (HTTP 201)"
            - "${err_one_second} == ERR_EXCEPTION_WINDOW_OVERLAP — starts_at 2026-09-09T23:59:59Z is one second inside [2026-09-01, 2026-09-10)"
            - "${e4_status} == REQUESTED — a window fully inside the incumbent is accepted when channel_scope OWN_WEBSITE does not intersect MARKETPLACE"
            - "${err_all_scope} == ERR_EXCEPTION_WINDOW_OVERLAP — the identical window scoped ALL intersects every channel, including the incumbent's"
            - "GET /pricing-exceptions with product_id=${prod_id} returns total_count == 3 (E1 APPROVED, E2 and E4 REQUESTED; neither rejected request persisted a row)"
            - "Product.${prod_id}.open_exception_count == 1 (APPROVED only)"
            - "GET /products/${prod_id}/effective-floor with channel=MARKETPLACE and as_of=2026-09-05T00:00:00Z returns effective_map_floor_cents == 8000, floor_source == EXCEPTION and applied_exception_id == ${e1_id}"
            - "GET /products/${prod_id}/effective-floor with channel=MARKETPLACE and as_of=2026-09-10T00:00:00Z returns effective_map_floor_cents == 10000 and floor_source == STANDARD (E2 is only REQUESTED, so the exclusive endpoint is uncovered)"

      - name: suspension_windows_closed_interval_plus_cooling_off_buffer
        grounds:
          - validations[priority=11]
          - state_machines.Reseller.AUTHORIZED_to_SUSPENDED
          - state_machines.Reseller.SUSPENDED_to_AUTHORIZED
          - state_machines.Violation.NOTICED_to_ESCALATED
          - calculations.ladder_rung_selection
          - entities.PricingPolicy.fields.suspension_cooling_off_days
          - entities.Reseller.fields.last_suspension_ended_at
        distinguishing_aspect: |
          Resource = one Reseller's supply-suspension calendar, and the geometry is
          deliberately different from the exception calendar: intersection is CLOSED
          (a window starting exactly where the served one ended collides) and it is
          followed by an additive 14-day cooling-off buffer measured from
          last_suspension_ended_at, so 2026-09-01 is refused while 2026-09-08 — the
          buffer boundary itself — is accepted.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-P published with suspension_points_threshold 6, termination_points_threshold 12, cure_window_days 10, suspension_cooling_off_days 14."
            - "Product SKU-MAP-6 standard_map_floor_cents 10000; Reseller AUTHORIZED / OPEN on RETAILER_SITE (multiplier 1.0)."
            - "Clock 2026-08-10T00:00:00Z: violation 1 (listed 9900 -> 1 point) noticed at WARNING; violation 2 (listed 8000 -> round_half_up(4 * 1.0 * 1.25) == 5 points, cumulative 6) noticed at SUSPENSION with window [2026-08-15T00:00:00Z, 2026-08-25T00:00:00Z); violation 3 (listed 9000) evaluated and left DETECTED."
            - "Clock advanced to 2026-08-25T00:00:00Z and a sweep run: violations 1 and 2 lapse to ESCALATED (cure_deadline_at 2026-08-20), the reseller is reinstated to AUTHORIZED / OPEN with last_suspension_ended_at 2026-08-25T00:00:00Z, and notice 2 becomes SATISFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-P", cure_window_days: 10, suspension_points_threshold: 6, termination_points_threshold: 12, suspension_cooling_off_days: 14 }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-MAP-6", name: "Aurora Console", msrp_cents: 15000, standard_map_floor_cents: 10000, governing_policy_id: "${pol_id}" }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /resellers"
              payload: { legal_name: "Juliet Retail LLC", contact_email: "notices@julietretail.example", primary_channel: "RETAILER_SITE" }
              as: BrandChannelManager
              captures: { rs_id: $.data.id }
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${rs_id}", policy_id: "${pol_id}", permitted_channels: ["RETAILER_SITE"], quality_obligations: ["WARRANTY_HONORED"], term_ends_at: "2027-08-01T00:00:00Z", price_terms_included: false }
              as: BrandChannelManager
              captures: { ag_id: $.data.id }
            - call: "POST /reseller-agreements/${ag_id}/send"
              payload: {}
              as: BrandChannelManager
            - call: "POST /reseller-agreements/${ag_id}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true }
              as: Reseller
              as_user_id: "${rs_id}"
            - call: "POST /reseller-agreements/${ag_id}/activate"
              payload: {}
              as: BrandChannelManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "RETAILER_SITE", seller_display_name: "Juliet Retail", listing_url: "https://juliet.example/console-1", listed_price_cents: 9900, observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${rs_id}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs1_id: $.data.id }
            - call: "POST /price-observations/${obs1_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { v1_id: $.data.violation_id }
            - call: "GET /resellers/${rs_id}"
              payload: {}
              as: BrandChannelManager
              captures: { rs_v1: $.data.version }
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v1_id}", delivery_channel: "EMAIL", expected_reseller_version: "${rs_v1}" }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
              captures: { n1_id: $.data.id, n1_rung: $.data.rung }
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "RETAILER_SITE", seller_display_name: "Juliet Retail", listing_url: "https://juliet.example/console-2", listed_price_cents: 8000, observed_at: "2026-08-06T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${rs_id}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs2_id: $.data.id }
            - call: "POST /price-observations/${obs2_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { v2_id: $.data.violation_id }
            - call: "GET /resellers/${rs_id}"
              payload: {}
              as: BrandChannelManager
              captures: { rs_v2: $.data.version }
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v2_id}", delivery_channel: "CERTIFIED_MAIL", suspension_starts_at: "2026-08-15T00:00:00Z", suspension_ends_at: "2026-08-25T00:00:00Z", expected_reseller_version: "${rs_v2}" }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
              captures: { n2_id: $.data.id, n2_rung: $.data.rung, n2_cum: $.data.cumulative_points_at_issue }
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "RETAILER_SITE", seller_display_name: "Juliet Retail", listing_url: "https://juliet.example/console-3", listed_price_cents: 9000, observed_at: "2026-08-07T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${rs_id}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs3_id: $.data.id }
            - call: "POST /price-observations/${obs3_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { v3_id: $.data.violation_id, v3_prov: $.data.provisional_points }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enforcement-sweeps"
              payload: {}
              as: PlatformAdmin
              captures: { swept_escalated: $.data.escalated_violations, swept_reinstated: $.data.reinstated_resellers }
            - call: "GET /resellers/${rs_id}"
              payload: {}
              as: BrandChannelManager
              captures: { rs_v3: $.data.version, last_ended: $.data.last_suspension_ended_at, auth_after_sweep: $.data.authorization_status }
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v3_id}", delivery_channel: "CERTIFIED_MAIL", suspension_starts_at: "2026-08-25T00:00:00Z", suspension_ends_at: "2026-09-04T00:00:00Z", expected_reseller_version: "${rs_v3}" }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
              captures: { err_touching: $.data.error_id }
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v3_id}", delivery_channel: "CERTIFIED_MAIL", suspension_starts_at: "2026-09-01T00:00:00Z", suspension_ends_at: "2026-09-11T00:00:00Z", expected_reseller_version: "${rs_v3}" }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v3_id}", delivery_channel: "CERTIFIED_MAIL", suspension_starts_at: "2026-09-08T00:00:00Z", suspension_ends_at: "2026-09-18T00:00:00Z", expected_reseller_version: "${rs_v3}" }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
              captures: { n3_id: $.data.id, n3_rung: $.data.rung, n3_points: $.data.assessed_points, n3_cum: $.data.cumulative_points_at_issue }
          assert:
            - "${n1_rung} == WARNING, ${n2_rung} == SUSPENSION and ${n2_cum} == 6"
            - "${swept_escalated} == 2, ${swept_reinstated} == 1, ${auth_after_sweep} == AUTHORIZED and ${last_ended} == 2026-08-25T00:00:00Z"
            - "Violation.${v1_id}.status == ESCALATED and Violation.${v2_id}.status == ESCALATED, both with resolution_reason == CURE_WINDOW_LAPSED and assessed_points retained (1 and 5)"
            - "EnforcementNotice.${n2_id}.status == SATISFIED and Reseller.${rs_id}.suspension_ends_at was cleared to null by the sweep"
            - "${err_touching} == ERR_SUSPENSION_COOLING_OFF — a window starting exactly at the served window's 2026-08-25T00:00:00Z end intersects it under CLOSED-interval semantics (unlike the half-open exception calendar, where touching is legal)"
            - "${err_buffer} == ERR_SUSPENSION_COOLING_OFF — 2026-09-01T00:00:00Z clears the served window but falls inside last_suspension_ended_at + 14 days == 2026-09-08T00:00:00Z"
            - "the third call succeeds: suspension_starts_at 2026-09-08T00:00:00Z is exactly the buffer boundary and 'at or after' is inclusive"
            - "${v3_prov} == 3 and ${n3_points} == 3 (base 2 at deviation_pct 0.1000, RETAILER_SITE 1.0, prior_noticed 2 -> repeat 1.50) and ${n3_cum} == 9"
            - "${n3_rung} == SUSPENSION (points_rung SUSPENSION at 6 <= 9 < 12; max_next_rung is TERMINATION, so the points rung binds)"
            - "Reseller.${rs_id}.violation_points_total == 9, authorization_status == SUSPENDED, hold_reason == SUSPENSION, suspension_ends_at == 2026-09-18T00:00:00Z"
            - "Reseller.${rs_id}.version == ${rs_v3} + 1 (only the accepted third notice mutated the reseller; the two refusals did not)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: notice_rescission_restores_reseller_points_ledger
        grounds:
          - calculations.reseller_points_ledger
          - state_machines.EnforcementNotice.ISSUED_to_RESCINDED
          - state_machines.Reseller.SUSPENDED_to_AUTHORIZED
          - entities.Reseller.fields.violation_points_total
          - entities.Violation.fields.assessed_points
          - calculations.ladder_rung_selection
        distinguishing_aspect: |
          Conserved quantity 1 — the reseller compliance-points ledger. After a partial
          reversal (the SUSPENSION notice is rescinded while the earlier WARNING notice
          stands) violation_points_total must fall from 14 back to exactly the
          pre-suspension 6 and re-equal the recomputed sum over LEDGER_STATUSES
          violations with non-null assessed_points, while the suspension's collateral
          state (authorization_status, suspension_ends_at) is unwound too.
