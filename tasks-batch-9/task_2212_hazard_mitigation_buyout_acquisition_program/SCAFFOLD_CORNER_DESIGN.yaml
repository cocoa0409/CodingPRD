            - "trigger call 2 (return from DRAFT) returns 409 with data.error_id == ERR_INVALID_PROJECT_STATE"
            - "trigger call 4 (program-income entry while DRAFT) returns 409 with data.error_id == ERR_INVALID_PROJECT_STATE"
            - "trigger calls 5, 6, 7 and 8 return 201, 201, 200 and 200 respectively and MitigationProject.${proj}.status == SUBMITTED"
            - "trigger call 9 (second submit) returns 409 with data.error_id == ERR_INVALID_PROJECT_STATE"
            - "trigger call 10 (closeout INITIATE from SUBMITTED) returns 409 with data.error_id == ERR_INVALID_PROJECT_STATE"
            - "trigger call 11 returns 200 and MitigationProject.${proj}.status == APPROVED with validated_bcr == 2.667"
