            - call: "POST /cabling/mac-tickets"
              payload: { project_id: "${proj}", link_id: "${link}", telecom_room_id: "${room}", ticket_type: "CHANGE", requested_window_start: "2026-08-14T11:00:00Z", requested_window_end: "2026-08-14T11:20:00Z", labor_hours_estimate: 1.0, expedite_requested: false }
              as: Client
              captures: { w3: $.data.id }
