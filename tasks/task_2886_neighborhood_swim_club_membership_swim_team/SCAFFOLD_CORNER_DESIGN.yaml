              captures: { m_v3: $.data.version }
          assert:
            - "before the write-off: ${m_total} == 31050, ${m_access_0} == ACTIVE, ${r_status_0} == CONFIRMED, ${p_total} == 16200 with ${p_refunded_0} == 0, ${p_status_0} == CONFIRMED, ${sh_status} == CONFIRMED, ${m_dues_1} == DELINQUENT with ${m_balance_1} == 31050 and ${h_party_owed_0} == 16200 with ${h_credit_0} == 0"
            - "the write-off is HTTP 200 and returns the Membership with ${m_dues_2} == WRITTEN_OFF and ${m_balance_2} == 0"
            - "${m_paid_2} == 0 and ${m_total_2} == 31050: writing off zeroes the balance without inventing a payment or rewriting the invoice"
            - "${m_access_2} == SUSPENDED in the SAME response: one request moved both dimensions, which no other endpoint does"
            - "${r_status_1} == REVOKED: the cascade follows the access dimension, not the dues dimension"
            - "${p_status_1} == CANCELLED_BY_SUSPENSION with ${p_refunded_1} == 8100 == round_half_up(16200 * 0.5) - never the full 16200, because the cause is the household's own account"
            - "${h_party_owed_1} == 8100 == 16200 - 8100 and ${h_credit_1} == 8100: the credit stays on the household because the auto-apply rule is skipped on this edge, and the balance was already zeroed"
            - "${s_res_1} == ${s_res_0} == 100000 and ${s_unalloc_1} == ${s_unalloc_0} == 100000: an uncollectible membership never claws back a booked reserve contribution"
            - "${sh_status_1} == CONFIRMED: the guard shift belongs to the club, not to the household, so no cascade reaches it"
            - "${err_terminal} == ERR_ALREADY_TERMINAL with HTTP 409 on the second write-off, not ERR_INVALID_TRANSITION, because WRITTEN_OFF is a declared terminal state of the dues dimension"
            - "${m_v3} == ${m_v2} == ${m_v1} + 1: the write-off bumped the version exactly once and the refused retry did not bump it again"

      - name: conditional_action_the_cancellation_refund_turns_on_the_lead_time
        claim_type: conditional_action
        grounds:
          - state_machines[PartyReservation].CONFIRMED_to_CANCELLED_BY_HOST
          - endpoints[POST /swim-club/party-reservations/{id}/transitions]
          - entities.Household.fields.account_credit_cents
        distinguishing_aspect: |
          The same to_status on the same endpoint produces two different money outcomes depending only
          on how far ahead of start_iso the request arrives, and the boundary is tested at EXACTLY
          CANCEL_FULL_REFUND_DAYS (7) days, where the comparison is inclusive so the full refund wins.
          The downstream auto-apply rule is itself conditional and is shown both ways: a credit smaller
          than the balance is parked, while a credit at or above the balance settles the membership in
          the same request and leaves the remainder as credit. Two households are used because a
          household holding party charges cannot open a second reservation under priority 80.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0 and party_privileges true; one OPEN 2027 season."
            - "Household A with an invoiced membership (balance 31050) and a CONFIRMED PAVILION party for 2027-07-15T14:00Z-18:00Z, total 16200."
            - "Household B with an invoiced membership that has already paid 25000 of its 31050, leaving 6050, and a CONFIRMED PAVILION party for 2027-07-22T14:00Z-18:00Z, total 16200."
            - "One lifeguard with both certifications and two CONFIRMED PRIMARY shifts, one per party day, a week apart so the rest buffer is satisfied."
