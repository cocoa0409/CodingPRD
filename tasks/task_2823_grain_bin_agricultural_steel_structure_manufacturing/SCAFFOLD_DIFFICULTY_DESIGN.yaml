  - rule_id: boundary_precision_check
    instances:

      - name: wind_speed_115_mph_adds_high_wind_stiffener_bonus_while_114_does_not
        grounds:
          - calculations.structural_stiffener_requirement
          - entities.BinDesign.fields.required_stiffener_count
          - entities.BinDesign.fields.roof_ring_required
          - entities.BinDesign.fields.utilization_ratio
        distinguishing_aspect: |
          Metric: design_wind_speed_mph against HIGH_WIND_THRESHOLD_MPH 115, reached through
          POST /bin-designs. The comparison is inclusive (>=), so 114 mph is below the threshold and
          115 mph is at it. Two designs identical in every other input therefore differ by the
          HIGH_WIND_STIFFENER_BONUS of 2: 12 stiffeners at utilization 0.9955 versus 14 at 0.8533,
          with roof_ring_required flipping false -> true. The bonus is also proof of evaluation
          order: it is added AFTER max(STIFFENER_MIN_COUNT, ceil(...)) and BEFORE the
          min(STIFFENER_MAX_COUNT) clamp, and the wind demand itself (9.357 vs 9.522 kPa) never
          governs - the grain demand of 28.518 kPa does - so the extra stiffeners come purely from
          the threshold flag, not from a larger governing demand.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST with min_design_wind_speed_mph 95, so both 114 and 115 clear priority 10."
            - "GrainProfile CORN, CoatingSpec G115 (max ambient moisture 18.0), engineer PE-1001, Dealer Alpha."
            - "No order, no analysis: the claim is entirely about the computed fields written by POST /bin-designs."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
          trigger:
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 114, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d114_id: $.data.id, n114: $.data.required_stiffener_count, ring114: $.data.roof_ring_required }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 115, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d115_id: $.data.id, n115: $.data.required_stiffener_count, ring115: $.data.roof_ring_required }
          assert:
            - "BinDesign.${d114_id}.wind_demand_kpa == 9.357 and BinDesign.${d115_id}.wind_demand_kpa == 9.522"
            - "both designs share governing_load_case GRAIN_LATERAL and governing_demand_kpa 28.518 and circumference_m 37.699"
            - "BinDesign.${d114_id}.required_stiffener_count == 12 and BinDesign.${d114_id}.roof_ring_required == false"
            - "BinDesign.${d115_id}.required_stiffener_count == 14 and BinDesign.${d115_id}.roof_ring_required == true"
            - "BinDesign.${d114_id}.utilization_ratio == 0.9955 and BinDesign.${d115_id}.utilization_ratio == 0.8533"
            - "both designs have verdict-equivalent utilization <= 1.0, sheet_gauge_mm == 1.6, capacity_m3 == 1216.25 and sidewall_sheet_count == 420 - only the stiffener bonus and the roof ring differ"
            - "an exclusive (>) reading of the threshold would emit 12 stiffeners and roof_ring_required false at 115 mph, falsified by 14 and true"
            - "a bonus applied before the max(STIFFENER_MIN_COUNT, ...) step would still give 14 here, but a bonus applied after the min(STIFFENER_MAX_COUNT) clamp would too - the discriminating case is that 14 is not clamped, so the count is 14 exactly and never 12 or 24"

      - name: high_cube_load_dispatches_at_exactly_75_00_pct_utilization_and_rejects_at_74_99
        grounds:
          - validations[priority=30]
          - calculations.freight_load_allocation
          - entities.FreightLoad.fields.cube_utilization_pct
          - errors.ERR_LOAD_BELOW_MIN_CUBE_UTILIZATION
        distinguishing_aspect: |
          A different metric - cube_utilization_pct against MIN_CUBE_UTILIZATION_PCT 75.0 - reached
          through a different endpoint, POST /freight-loads/{id}/dispatch. The two loads sit on
          adjacent two-decimal values: 71.244 m3 of 95.0 is 74.99368 pct which stores as 74.99 and is
          rejected, while 71.250 m3 is exactly 75.00000 pct and dispatches, so the difference between
          a rejected and a dispatched trailer is 0.006 m3 of kit cube. The floor is inclusive (>=),
