              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 5, fulfillment_month: "2026-09", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "PATCH /mills/${mill_id}/customer-accounts/${acct_id}"
              payload: { credit_status: "WATCH" }
              as: AccountManager
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: AccountManager
              captures: { confirm_status: $.data.status }
            - call: "PATCH /mills/${mill_id}/customer-accounts/${acct_id}"
              payload: { credit_status: "BLOCKED" }
              as: AccountManager
          assert:
            - "at WATCH the confirm succeeds: confirm_status == CONFIRMED (only BLOCKED gates)"
            - "after the account moves to BLOCKED, a second order's confirm on the same account fails with ERR_ACCOUNT_BLOCKED (the dependency is on the ACCOUNT state, not the order)"

      - name: charge_apply_gated_by_mill_posture
        grounds:
          - state_machines.Heat.PLANNED_to_CHARGED
          - entities.Mill.fields.posture
          - validations[priority=7]
        distinguishing_aspect: |
          Heat × Mill (posture): a heat's charge/tap transitions depend on the
          mill's derived posture. Pair: Heat × Mill — distinct from Order ×
          CustomerAccount above.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill, contract+lot, grade, heat H1 PLANNED."
            - "EnergyEvent EV1 ACTIVE → posture INTERRUPTED. H1 has no waiver."
            - "Heat H2 PLANNED with a HEAT-scoped waiver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 50, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-NO-WAIVER", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_nw: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-WAIVERED", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T14:00:00Z" }
              as: MillOperator
              captures: { heat_w: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events"
              payload: { grid_operator: "PJM", called_at: "2026-09-10T12:00:00Z", released_at: "2026-09-10T14:00:00Z" }
              as: EnergyDispatcher
              captures: { event_id: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events/${event_id}/activate"
              payload: {}
              as: EnergyDispatcher
            - call: "POST /mills/${mill_id}/power-waivers"
              payload: { scope: "HEAT", scope_id: "${heat_w}", reason: "grid-critical automotive order" }
              as: EnergyDispatcher
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_nw}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
              captures: { nw_err: $.data.error_id }
            - call: "POST /mills/${mill_id}/heats/${heat_w}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
              captures: { w_line: $.data.id }
          assert:
            - "unwaivered heat: nw_err == ERR_MILL_INTERRUPTED and Heat.${heat_nw}.status remains PLANNED"
            - "waivered heat: the charge succeeds (w_line captured) and Heat.${heat_w}.status == CHARGED despite posture INTERRUPTED"
            - "GET /mills/${mill_id} still reports posture == INTERRUPTED (the waiver does not change mill posture — it exempts one heat)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: campaign_window_half_open_overlap
        grounds:
          - calculations.campaign_window_conflict
          - validations[priority=14]
          - errors.ERR_CAMPAIGN_OVERLAP
        distinguishing_aspect: |
          Campaign interval semantics: half-open [start, end) vs [start, end)
          — touching endpoints (one ends exactly when the next begins) are
          allowed. Resource: mill × product_family rolling window.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill; contract+lot; grade GA; heats H1 (tap 2026-09-15T09:00Z) and H2 (tap 2026-09-15T11:00Z) CAST."
            - "Campaign C1 [2026-09-15T08:00Z, 2026-09-15T10:00Z) REBAR with line H1, COMMITTED."
            - "Campaign C2 [2026-09-15T10:00Z, 2026-09-15T12:00Z) REBAR with line H2 — touches C1 at exactly 10:00."
            - "Campaign C3 [2026-09-15T09:30Z, 2026-09-15T11:00Z) REBAR — genuinely overlaps C1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
