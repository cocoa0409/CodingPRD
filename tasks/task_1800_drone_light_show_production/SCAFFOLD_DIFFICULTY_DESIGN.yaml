            - "COLD_DERATED (0C): charge 99 -> 84.15 -> ${err99} == ERR_CHARGE_BELOW_MINIMUM"

      - name: refund_lead_time_336h_exact_boundary
        grounds:
          - calculations.cancellation_refund
          - entities.ShowEvent.fields.cancellation_tier
        distinguishing_aspect: |
          Time-threshold boundary on the cancel endpoint (different metric than
          wind/charge): lead exactly 336h selects T1_FULL ('>=' inclusive), one
          second less selects T2_DEPOSIT_HALF — refund 526250 vs 468563.
        test_recipe:
          setup:
            - "Site A; Show S1 window 2026-08-10T19:00Z, Show S2 window 2026-08-11T19:00Z; both 10 drones (contract 551250), both PAID_IN_FULL"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
