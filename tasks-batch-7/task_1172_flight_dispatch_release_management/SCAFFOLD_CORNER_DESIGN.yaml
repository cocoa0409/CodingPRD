  - section: errors
    instances:
      - name: err_release_not_pending_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RELEASE_NOT_PENDING]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sign_conflict_state_beats_safety
          rationale: "Asserted as the winning error of the state-vs-safety priority conflict."

      - name: err_plan_not_locked_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_NOT_LOCKED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / manifest_conflict_referential_beats_fiscal
          rationale: "Asserted as the winning error of the referential-vs-fiscal priority conflict; also the negative leg of release_submit_gated_on_plan_locked."

      - name: err_payload_exceeds_limit_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAYLOAD_EXCEEDS_LIMIT]"]
