      - name: utilization_exactly_at_restrict_threshold_restricts_block
        claim_type: threshold
        grounds:
          - calculations.block_utilization_posture
          - calculations.block_utilization_posture.constants.BLOCK_RESTRICT_UTILIZATION
          - state_machines.RoomBlock (OPEN -> RESTRICTED)
        distinguishing_aspect: |
          The comparison is inclusive at BLOCK_RESTRICT_UTILIZATION. Nine of ten rooms is exactly
          0.9000, so the block must flip to RESTRICTED; the earlier four-room confirm left it at
          0.4000 and OPEN, which shows the flip is caused by crossing the threshold rather than by
          any confirm at all. A strict > comparison would have left the block OPEN at 0.9000.
