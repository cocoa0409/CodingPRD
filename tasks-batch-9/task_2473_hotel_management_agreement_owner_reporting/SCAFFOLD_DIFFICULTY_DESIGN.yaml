            - "OperatingBudget.${bud26}.budgeted_operating_expenses_cents == 339900000"
            - "OperatingBudget.${bud26}.budgeted_capital_ffe_cents == 15450000"
            - "OperatingBudget.${bud26}.budgeted_capital_brand_cents == 8240000"
            - "OperatingBudget.${bud26}.budgeted_base_fee_cents == 16737500"
            - "OperatingBudget.${bud26}.budgeted_centralized_cents == 7725000"
