              as_user_id: "ed-1"
              captures: { expg: "$.data.id" }
            - call: "POST /mmm/experiments/${expg}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
          trigger:
            - call: "POST /mmm/experiments/${expa}/assign-cells"
              payload: { treatment_cell_ids: ["${gc1}"], control_cell_ids: ["${gc2}"] }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${expg}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${expg}/assign-cells"
              payload: { treatment_cell_ids: ["${gc1}"], control_cell_ids: ["${gc2}"] }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${expa}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "Call 1 returns 422 with data.error_id == ERR_DESIGN_TYPE_MISMATCH, and GET /mmm/geo-cells/${gc1} still shows assignment_state == UNASSIGNED."
            - "Call 2 returns 422 with data.error_id == ERR_CELLS_NOT_ASSIGNED, NOT ERR_EXPERIMENT_NOT_STARTED, because the clock is already past 2026-09-07."
            - "Call 3 returns 200 with data.status == CELLS_ASSIGNED, data.treatment_population == 100000 and data.control_population == 100000 - the identical body that failed on call 1 succeeds on the GEO_HOLDOUT row."
            - "Call 4 returns 200 with data.status == RUNNING - the AUDIENCE_SPLIT row that could not assign cells may start directly."
            - "After call 3, GET /mmm/markets/${mkt} shows held_out_population == 200000 and held_out_population_pct == 2.00."
            - "GET /mmm/experiments/${expa} shows treatment_population == 245000 (copied from the plan at lock time) while GET /mmm/experiments/${expg} shows 100000 (summed from real cells), which is the same conditional branch seen from the population side."
      - name: cascading_validation_baseline_negative_on_fit
        claim_type: cascading_validation
        grounds:
          - "validations priority 64 (business_constraint) - the resulting baseline_sales_units is >= 0, else ERR_MODEL_BASELINE_NEGATIVE (422)"
          - "calculations.channel_contribution_decomposition formula - baseline_sales_units = round(modeled_sales_units - SUM over channels of contribution_units, 4); if negative, the fit is rejected"
          - "state_machines ModelRun fit precondition - computed baseline_sales_units >= 0, else ERR_MODEL_BASELINE_NEGATIVE and NO row is written"
        distinguishing_aspect: |
          The baseline check cannot run until the whole decomposition has been computed, so it is the last
          gate and it must roll the entire fit back: a channel with response_ceiling_units 20000 absorbs
          60888.8889 units against modeled_sales_units 23000, and the run must come back untouched at
          fit_status PENDING with ZERO ChannelContribution rows persisted.
          
        test_recipe:
          setup:
            - "Market US_CORE and one MediaChannel C_TV with response_ceiling_units 20000 (per period), adstock_decay_rate 0.50, adstock_max_lag_periods 2 and saturation_half_point_cents 200000."
            - "Window W1 WEEKLY [2026-08-03, 2026-08-31) with the four F1 sales rows (23000 units total) and C_TV spend [400000, 600000, 300000, 500000], sealed at clock 2026-08-31."
            - "The EFFECT_PERIOD adstock series is [400000, 800000, 700000, 800000] and the Hill terms at C 20000 are 13333.333333, 16000.0, 15555.555556 and 16000.0, summing to 60888.8889 - far above the 23000 units the window actually sold, so the baseline would be -37888.8889."
            - "The run version is read and captured before the fit so the rollback can be asserted against a server-observed value."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "C_TV", channel_type: "VIDEO", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 20000, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chtv: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-03T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-10T00:00:00Z", units_sold: 6000, revenue_cents: 30600000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-17T00:00:00Z", units_sold: 5500, revenue_cents: 27500000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-24T00:00:00Z", units_sold: 6500, revenue_cents: 32500000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "GET /mmm/data-windows/${w1}"
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v0: "$.data.version" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chtv}", period_start_date: "2026-08-03T00:00:00Z", spend_cents: 400000, impressions: 4000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v0}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v1: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chtv}", period_start_date: "2026-08-10T00:00:00Z", spend_cents: 600000, impressions: 6000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v1}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v2: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chtv}", period_start_date: "2026-08-17T00:00:00Z", spend_cents: 300000, impressions: 3000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v2}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v3: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chtv}", period_start_date: "2026-08-24T00:00:00Z", spend_cents: 500000, impressions: 5000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v3}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v4: "$.data.data_window_version_after" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/data-windows/${w1}/seal"
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/model-runs"
              payload: { market_id: "${mkt}", data_window_id: "${w1}", included_channel_ids: ["${chtv}"], control_variables: ["PRICE_INDEX", "MACRO_INDEX"], seasonality_mode: "WEEK_OF_YEAR", carryover_attribution_mode: "EFFECT_PERIOD", holdout_periods: 1 }
              as: Modeler
              as_user_id: "md-1"
              captures: { run1: "$.data.id" }
            - call: "GET /mmm/model-runs/${run1}"
              as: Modeler
              as_user_id: "md-1"
              captures: { rv0: "$.data.version" }
          trigger:
            - call: "POST /mmm/model-runs/${run1}/fit"
              as: Modeler
              as_user_id: "md-1"
          assert:
            - "HTTP 422 with data.error_id == ERR_MODEL_BASELINE_NEGATIVE."
            - "The answer is NOT ERR_NO_SPEND_OBSERVATIONS (four live rows exist) and NOT ERR_LAG_WINDOW_INCOMPLETE (expected_period_count 4 > lag 2): the two earlier referential and constraint gates both passed, which is why the baseline gate is reachable at all."
            - "GET /mmm/model-runs/${run1} shows fit_status == PENDING, baseline_sales_units == null, modeled_sales_units == null, unit_price_cents == null and version == ${rv0} - the aggregates computed on the way to the failure were rolled back with the rest."
            - "GET /mmm/channel-contributions?model_run_id=${run1} returns total_count == 0: no partial contribution row survived."
            - "GET /mmm/data-windows/${w1} still shows status == SEALED - the failed fit did not touch the window."
      - name: clock_rewind_rejected
        claim_type: temporal_validation
        grounds:
          - "validations priority 68 (business_temporal) - the requested clock value is not earlier than the current logical clock, else ERR_CLOCK_REWIND (422)"
          - "global_constants.DEFAULT_CLOCK_UTC 2026-08-01T00:00:00Z"
          - "endpoints POST /_clock/set_current_utc input [current_utc], roles all five mutating roles"
        distinguishing_aspect: |
          The logical clock is monotone non-decreasing: after advancing to 2026-09-01 a request for
          2026-08-15 returns 422 ERR_CLOCK_REWIND and leaves the clock at 2026-09-01, while re-setting the
          SAME value 2026-09-01 succeeds because the rule forbids only strictly earlier values.
          
        test_recipe:
          setup:
            - "Empty database. The clock starts at DEFAULT_CLOCK_UTC 2026-08-01T00:00:00Z and is advanced once to 2026-09-01T00:00:00Z."
            - "A WEEKLY window W1 [2026-08-03, 2026-08-31) is created so the clock's effect is observable through a seal attempt: after the successful advance the window is elapsed and sealable, and a rewind would have made it un-sealable."
            - "The window carries the four F1 sales rows so that the only remaining seal precondition is the temporal one."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-03T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-10T00:00:00Z", units_sold: 6000, revenue_cents: 30600000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-17T00:00:00Z", units_sold: 5500, revenue_cents: 27500000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-24T00:00:00Z", units_sold: 6500, revenue_cents: 32500000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/data-windows/${w1}/seal"
              as: DataEngineer
              as_user_id: "de-1"
          assert:
            - "Call 1 returns 422 with data.error_id == ERR_CLOCK_REWIND."
            - "Call 2 returns 200 - re-setting the identical current value is allowed because the comparison is not earlier than, not strictly greater than."
            - "Call 3 returns 200 with data.status == SEALED, which proves the clock was never rewound to 2026-08-15 (a window whose end is 2026-08-31 could not have been sealed at that clock)."
            - "GET /mmm/data-windows/${w1} shows sales_period_count == 4 and lag_completeness_pct == 100.00, so ERR_DATA_WINDOW_INCOMPLETE was never in play."
      - name: satisfaction_to_pass_at_the_exact_boundary
        claim_type: satisfaction_to_pass
        grounds:
          - "validations priority 60 (business_constraint) - compared as EXACT INTEGERS, never via the 2-decimal held_out_population_pct"
          - "global_constants.MAX_HOLDOUT_POPULATION_PCT 20"
        excluded_because:
          difficulty_instance: holdout_share_exact_integer_ceiling_on_assign_cells
          rationale: >-
            That instance is the satisfaction-to-pass claim at its sharpest: the assignment that lands EXACTLY on 20 percent succeeds with 200 while a single extra person in the cell fails, so the passing side of the rule is already pinned to the cent.
      - name: priority_ordering_state_before_fiscal
        claim_type: priority_ordering
        grounds:
          - "validations priority 45 (state) ERR_MODEL_RUN_NOT_PUBLISHED versus priority 72 (business_fiscal) ERR_BUDGET_CEILING_EXCEEDED on POST /mmm/budget-scenarios"
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_budget_scenario_create
          rationale: >-
            That instance violates both rules in one request and asserts the priority-45 answer, then repairs the state violation alone so the priority-72 error surfaces from the identical body - the two-sided proof the priority_ordering row asks for.
      - name: priority_conflict_safety_before_constraint_on_lock_design
        claim_type: priority_conflict
        grounds:
          - "validations priority 52 (business_safety) ERR_EXPERIMENT_UNDERPOWERED versus priority 60 (business_constraint) ERR_HOLDOUT_SHARE_EXCEEDED on POST /mmm/experiments/{id}/lock-design"
        excluded_because:
          difficulty_instance: safety_beats_constraint_on_experiment_lock_design
          rationale: >-
            That instance is the second declared conflict pair, with a design that is simultaneously underpowered and over the holdout ceiling, plus the falsifiable contrast where only the ceiling is breached.
      - name: cross_entity_validation_reads_market_posture
        claim_type: cross_entity_validation
        grounds:
          - "validations priority 50 (business_safety) - Market.data_posture permits the operation; budget-scenario optimize additionally requires data_posture == OPEN, else ERR_MARKET_POSTURE_BLOCKED (409)"
        excluded_because:
          difficulty_instance: budget_scenario_optimize_requires_open_market_posture
          rationale: >-
            That instance walks the SAME optimize call across three postures of a DIFFERENT entity (RESTRICTED, FROZEN, OPEN) and asserts both the refusals and the success, which is the cross-entity validation claim in both directions.
  - section: endpoints
    note: >-
      57 endpoints across 13 collections. The action_endpoint row of the guide is exercised by the state_machines section above (seal, reopen, fit, validate, publish, start, assign-cells, optimize, revert-optimization, approve all appear there with their preconditions), so this section covers the remaining endpoint SHAPES: partial update, bulk list action, cross-reference link, conditional action and computed read.
    instances:
      - name: patch_media_channel_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - "endpoints PATCH /mmm/media-channels/{id} input [status?, adstock_decay_rate?, adstock_max_lag_periods?, saturation_half_point_cents?, response_ceiling_units?, min_spend_cents?, max_spend_cents?], roles [DataEngineer]"
          - "entities.MediaChannel common_fields true - id, created_at, updated_at, version"
          - "entities.MediaChannel.status constraints one of {ACTIVE, PAUSED, RETIRED}"
        distinguishing_aspect: |
          A PATCH is a genuine partial update: sending only the two spend bounds leaves decay, lag, half
          point, ceiling and status byte-identical while bumping version to 2 and moving updated_at away
          from created_at, and a second PATCH carrying only status leaves the new bounds intact at version
          3 - so an implementation that treats absent keys as nulls fails immediately.
          
        test_recipe:
          setup:
            - "Market US_CORE and channel A_SEARCH created with adstock_decay_rate 0.50, adstock_max_lag_periods 2, saturation_half_point_cents 200000, response_ceiling_units 1200, min_spend_cents 200000, max_spend_cents 3000000 and the default status ACTIVE, at version 1."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
          trigger:
            - call: "PATCH /mmm/media-channels/${cha}"
              payload: { min_spend_cents: 300000, max_spend_cents: 2500000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "PATCH /mmm/media-channels/${cha}"
              payload: { status: "PAUSED" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "GET /mmm/media-channels/${cha}"
              as: Auditor
              as_user_id: "au-1"
          assert:
            - "Call 1 returns 200 with data.min_spend_cents == 300000, data.max_spend_cents == 2500000 and data.version == 2."
            - "Call 1 leaves data.adstock_decay_rate == 0.50, data.adstock_max_lag_periods == 2, data.saturation_half_point_cents == 200000, data.response_ceiling_units == 1200 and data.status == ACTIVE untouched."
            - "Call 1 returns data.updated_at strictly later than data.created_at, and data.created_at unchanged from the create response."
            - "Call 2 returns 200 with data.status == PAUSED and data.version == 3, and data.min_spend_cents is still 300000."
            - "Call 3 confirms the accumulated state: min_spend_cents 300000, max_spend_cents 2500000, status PAUSED, version 3, market_id ${mkt} and channel_code A_SEARCH."
            - "Neither PATCH changed data.channel_code or data.market_id - they are not in the endpoint's input at all."
      - name: assign_cells_bulk_rejects_the_whole_list_on_one_unavailable_cell
        claim_type: bulk_action
        grounds:
          - "endpoints POST /mmm/experiments/{id}/assign-cells input [treatment_cell_ids, control_cell_ids] - a list action over GeoCell rows"
          - "validations priority 45 (state) - every listed GeoCell has assignment_state == UNASSIGNED, else ERR_GEO_CELL_UNAVAILABLE (409)"
          - "state_machines GeoCell UNASSIGNED -> TREATMENT/CONTROL side_effects - Market.held_out_population += population"
        distinguishing_aspect: |
          The bulk assignment is all-or-nothing, not skip-and-continue: a list whose control entry is
          already CONTROL for another experiment returns 409 ERR_GEO_CELL_UNAVAILABLE and leaves the
          innocent treatment cell in the SAME request still UNASSIGNED, with the market counter unmoved at
          200000; retrying with two free cells then assigns both in one call.
          
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000 and four geo cells GC01..GC04 of population 100000 each. Channels A_SEARCH and B_SOCIAL."
            - "Experiment E1 on A_SEARCH is GEO_HOLDOUT, DESIGN_LOCKED and has already assigned GC01 as treatment and GC02 as control, so Market.held_out_population is 200000 and GC03 and GC04 are still UNASSIGNED."
            - "Experiment E2 on B_SOCIAL is GEO_HOLDOUT and DESIGN_LOCKED with nothing assigned."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chb: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC01", population: 100000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc1: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC02", population: 100000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc2: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC03", population: 100000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc3: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC04", population: 100000 }
              as: DataEngineer
              as_user_id: "de-1"
