  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_frozen_beats_insufficient_stock
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - errors[ERR_MACHINE_FROZEN]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          Category pair business_safety (priority 7, ERR_MACHINE_FROZEN) vs business_fiscal
          (priority 15, ERR_INSUFFICIENT_STOCK): a sale on a FROZEN machine that ALSO requests
          more units than on_hand returns ERR_MACHINE_FROZEN, proving safety outranks the fiscal
          stock check.
        test_recipe:
          setup:
            - "Machine FROZEN by a blocking ticket; slot has on_hand 0; sale requests qty 5 (both checks would fail)."
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "PP Host", contact_email: "pp@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "PP1", name: "PP Item", category: "SNACK", unit_cost_cents: 30, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
