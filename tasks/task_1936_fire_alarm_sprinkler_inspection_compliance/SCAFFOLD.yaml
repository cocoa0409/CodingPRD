    side_effects: []
  - method: GET
    path: "/fire-compliance/marshal-reports"
    description: "Filtered list of marshal reports (event_id? revision_of_id? status?)"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: ["event_id?", "revision_of_id?", "status?", "limit?", "offset?"]
