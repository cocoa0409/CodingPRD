  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: optimistic_concurrency_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[bom-create-stale-product]"]
        distinguishing_aspect: "Creating scan with stale expected_product_version returns ERR_STALE_VERSION"
        excluded_because:
          difficulty_instance: errors / error_stale_version_triggerable
          rationale: "Already covered as §1.9 errors instance"

      - name: cascading_side_effects_license_override
        claim_type: cascade_chain
        grounds: ["endpoints[POST /oss-components/{componentId}/override-classification].side_effects"]
        distinguishing_aspect: "License override cascades to BomEntry → BillOfMaterials → Product"
        excluded_because:
          difficulty_instance: transitive_cascade / license_override_cascade_depth_2
          rationale: "Already covered as §1.8 difficulty instance"

      - name: derived_field_reconciliation_product_counts
        claim_type: derived_field_reconciliation
        grounds: [entities.Product.fields.total_dependency_count, entities.Product.fields.high_severity_vulnerability_count]
        distinguishing_aspect: "Product counts stay consistent with underlying BOM entries and findings"
        test_recipe:
          setup:
            - "Product with completed scan (5 components, 2 copyleft)"
            - "1 HIGH vulnerability confirmed"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "DERIVED"
                product_name: "Derived Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_derived_id: "$.data.id"
                prod_derived_v: "$.data.version"
            - call: "POST /oss-products/${prod_derived_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_derived_v}"
              as: ComplianceAnalyst
              captures:
                scan_derived_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_derived_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-DERIVED"
                severity: "HIGH"
                cvss_score: 7.5
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/test@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_derived_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_derived_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_derived_id}/vulnerability-findings/${finding_derived_id}/confirm"
              as: SecurityAnalyst
          trigger:
            - call: "GET /oss-products/${prod_derived_id}"
              as: ComplianceAnalyst
              captures:
                prod_derived: "$.data"
          assert:
            - "prod_derived.total_dependency_count == 5"
            - "prod_derived.copyleft_dependency_count == 2"
            - "prod_derived.high_severity_vulnerability_count == 1"

      - name: scheduled_deferred_action_expiry
        claim_type: scheduled_actions
        grounds: [entities.LicenseApprovalRequest.fields.expiry_at, entities.ReleaseGate.fields.evaluation_expires_at]
        distinguishing_aspect: "Time-based expiry transitions happen automatically when clock advances"
        test_recipe:
          setup:
            - "LicenseApprovalRequest approved at 2026-08-01 with expiry 2026-10-30"
            - "ReleaseGate evaluated at 2026-08-01 with expiry 2026-08-31"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:00Z"
              as: PlatformAdmin
            - call: "POST /oss-products"
              payload:
                product_code: "SCHEDULED"
                product_name: "Scheduled Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_sched_id: "$.data.id"
                prod_sched_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/restricted@1.0.0"
                component_name: "restricted"
                version: "1.0.0"
                declared_license_spdx: "CC-BY-NC-4.0"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_sched_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_sched_v}"
              as: ComplianceAnalyst
              captures:
                scan_sched_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_sched_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_sched_id}/license-approvals"
              as: ComplianceAnalyst
              captures:
                approval_sched_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_sched_id}/license-approvals/${approval_sched_id}/assign-legal"
              as: LegalCounsel
            - call: "POST /oss-products/${prod_sched_id}/license-approvals/${approval_sched_id}/legal-decision"
              payload:
                legal_decision: "APPROVE"
              as: LegalCounsel
            - call: "POST /oss-products/${prod_sched_id}/license-approvals/${approval_sched_id}/engineering-decision"
              payload:
                engineering_decision: "APPROVE"
              as: EngineeringManager
            - call: "GET /oss-products/${prod_sched_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_sched_id: "$.data[0].id"
                bom_sched_v: "$.data[0].version"
            - call: "POST /oss-products/${prod_sched_id}/boms/${bom_sched_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_sched_id}/release-gates"
              payload:
                bom_id: "${bom_sched_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_sched_id: "$.data.id"
            - call: "POST /oss-products/${prod_sched_id}/release-gates/${gate_sched_id}/evaluate"
              payload:
                expected_bom_version: "${bom_sched_v}"
              as: ReleaseManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-09-01T00:00:00Z"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_sched_id}/license-approvals/${approval_sched_id}"
              as: ComplianceAnalyst
              captures:
                approval_after: "$.data"
            - call: "GET /oss-products/${prod_sched_id}/release-gates/${gate_sched_id}"
              as: ReleaseManager
              captures:
                gate_after: "$.data"
          assert:
            - "approval_after.status == EXPIRED (expiry_at 2026-10-30 not yet reached, but check gate)"
            - "gate_after.gate_status == EXPIRED (evaluation_expires_at 2026-08-31 reached)"

      - name: selector_policy_component_filtering
        claim_type: selector_policy
        grounds: ["endpoints[GET /oss-components]", entities.Component.fields.effective_classification]
        distinguishing_aspect: "GET /oss-components filters by effective_classification with explicit enum"
        test_recipe:
          setup:
            - "Components with PERMISSIVE, WEAK_COPYLEFT, STRONG_COPYLEFT classifications"
          setup_api_calls:
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/mit@1.0.0"
                component_name: "mit"
                version: "1.0.0"
                declared_license_spdx: "MIT"
              as: ComplianceAnalyst
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/lgpl@1.0.0"
                component_name: "lgpl"
                version: "1.0.0"
                declared_license_spdx: "LGPL-2.1"
              as: ComplianceAnalyst
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/gpl@1.0.0"
                component_name: "gpl"
                version: "1.0.0"
                declared_license_spdx: "GPL-3.0"
              as: ComplianceAnalyst
          trigger:
            - call: "GET /oss-components?effective_classification=PERMISSIVE"
              as: ComplianceAnalyst
              captures:
                permissive_list: "$.data"
            - call: "GET /oss-components?effective_classification=WEAK_COPYLEFT"
              as: ComplianceAnalyst
              captures:
                weak_list: "$.data"
            - call: "GET /oss-components?effective_classification=STRONG_COPYLEFT"
              as: ComplianceAnalyst
              captures:
                strong_list: "$.data"
          assert:
            - "permissive_list contains only components with effective_classification == PERMISSIVE"
            - "weak_list contains only components with effective_classification == WEAK_COPYLEFT"
            - "strong_list contains only components with effective_classification == STRONG_COPYLEFT"

  # ===========================================================================
  # Section: consistency_model — immediate consistency
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_product_posture
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Product.fields.compliance_posture]
        distinguishing_aspect: "Product posture change visible immediately in same request response"
        test_recipe:
          setup:
            - "Product COMPLIANT, scan queued with PROHIBITED component"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "IMMEDIATE"
                product_name: "Immediate Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_imm_id: "$.data.id"
                prod_imm_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/wtfpl@1.0.0"
                component_name: "wtfpl"
                version: "1.0.0"
                declared_license_spdx: "WTFPL"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_imm_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_imm_v}"
              as: ComplianceAnalyst
              captures:
                scan_imm_id: "$.data.id"
          trigger:
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_imm_id}"
              as: PlatformAdmin
              captures:
                scan_result: "$.data"
            - call: "GET /oss-products/${prod_imm_id}"
              as: ComplianceAnalyst
              captures:
                prod_imm: "$.data"
          assert:
            - "scan_result.status == COMPLETED"
            - "prod_imm.compliance_posture == BLOCKED"
            - "Consistency: posture change visible immediately after scan completes (no eventual lag)"
