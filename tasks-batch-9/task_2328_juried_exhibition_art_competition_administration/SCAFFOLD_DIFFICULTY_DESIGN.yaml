      - name: conflict_declaration_voids_score_and_reopens_quorum_shortfall
        grounds:
          - endpoints[POST /jurors/{id}/conflict-declarations]
          - entities.Score.fields.voided_by_conflict
          - entities.ConflictDeclaration.fields.voided_score_count
          - calculations.artwork_round_mean
          - entities.JuryRound.fields.quorum_shortfall_count
          - validations[priority=38]
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: |
          Depth-4 chain in the jury domain, each hop caused by the previous: the declaration voids
          the declaring juror's score, the voided score shrinks the artwork's valid_score_count from
          2 to 1 and lifts provisional_mean_score 7.00 -> 8.00, the shrunken count raises the round's
          quorum_shortfall_count to 1, and that shortfall is what makes SCORING_COMPLETE fail.
