# =============================================================================
# Scaffold: Segment Leaderboards, Subscription Features & Privacy Zones
# (fitness-activity platform with segment matching, leaderboard integrity,
#  subscription gating, privacy zones, clubs/challenges/virtual events,
#  safety beacon + heat map, data export and account erasure)
# =============================================================================

scenario: |
  Segment Leaderboards, Subscription Features & Privacy Zones (Strava): activity
  upload from devices and applications with duplicate detection and
  cross-device reconciliation, segment creation and matching where activities
  are compared against user-defined route sections, leaderboard integrity
  including flagging of impossible efforts, vehicle-assisted activities and
  category corrections, subscription gating of leaderboards, route planning
  and training analysis with free tier boundaries, privacy zones hiding start
  and end points near a home address with route obfuscation, club, challenge
  and virtual event administration with participation rules, safety features
  including beacon sharing and heat map aggregation with opt-out, athlete data
  export and account deletion obligations

domain_name: segment-leaderboards-privacy
api_prefix: /v1

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email address (lowercased); uniqueness enforced globally" }
      - { name: display_name, type: string, source: input, description: "Public display name; max 60 chars" }
      - { name: home_lat, type: number, source: input, description: "Home latitude used as privacy-zone anchor; -90..90" }
      - { name: home_lng, type: number, source: input, description: "Home longitude used as privacy-zone anchor; -180..180" }
      - { name: tier, type: enum, source: input, description: "FREE | SUMMIT — subscription tier at registration; Subscription governs effective tier afterwards", default: "FREE", constraints: "enum {FREE, SUMMIT}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELETED — lifecycle of the athlete account", default: "ACTIVE", constraints: "enum {ACTIVE, DELETED}" }
      - { name: heatmap_opt_out, type: boolean, source: input, description: "When true, athlete's completed activities are excluded from heatmap aggregation contributions", default: false }
      - { name: safety_score, type: integer, source: computed, description: "Starts at 100; minus 10 per UPHELD flag (floor 0), plus 5 per REJECTED flag (cap 100); drives auto-hide of activities at score < 50", default: 100 }

  - name: Subscription
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; owning athlete" }
      - { name: plan, type: enum, source: input, description: "SUMMIT_MONTHLY | SUMMIT_ANNUAL — subscribed plan", constraints: "enum {SUMMIT_MONTHLY, SUMMIT_ANNUAL}" }
      - { name: started_at, type: datetime, source: input, description: "Subscription period start (ISO8601 UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Subscription period end; must be strictly after started_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED | LAPSED — ACTIVE while current_utc < expires_at and not cancelled", default: "ACTIVE", constraints: "enum {ACTIVE, CANCELLED, LAPSED}" }
      - { name: cancel_reason, type: string, source: input, description: "Optional free-text reason recorded at cancellation", default: null }

  - name: PrivacyZone
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; owning athlete (exactly one zone per athlete, enforced by uniqueness)" }
      - { name: center_lat, type: number, source: input, description: "Zone center latitude; -90..90" }
      - { name: center_lng, type: number, source: input, description: "Zone center longitude; -180..180" }
      - { name: radius_m, type: integer, source: input, description: "Zone radius in meters; 200..2000 inclusive" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED", default: "ACTIVE", constraints: "enum {ACTIVE, DISABLED}" }

  - name: Activity
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; uploading athlete (path-scoped)" }
      - { name: device_source, type: string, source: input, description: "Originating device or application tag, e.g. 'wahoo-elemnt', 'garmin-edge', 'mobile-app'" }
      - { name: sport_type, type: enum, source: input, description: "RIDE | RUN | VIRTUAL_RIDE | VIRTUAL_RUN | SWIM | EBikeRide — declared sport category", constraints: "enum {RIDE, RUN, VIRTUAL_RIDE, VIRTUAL_RUN, SWIM, EBikeRide}" }
      - { name: started_at, type: datetime, source: input, description: "Activity start instant (ISO8601 UTC)" }
      - { name: duration_s, type: integer, source: input, description: "Elapsed duration in seconds; must be > 0" }
      - { name: distance_m, type: number, source: input, description: "Total distance in meters; must be > 0" }
      - { name: track_points, type: array, source: input, description: "Ordered array of {lat, lng, t_offset_s}; polyline used for segment matching and privacy clipping; must contain >= 2 points" }
      - { name: start_lat, type: number, source: input, description: "Raw start latitude" }
      - { name: start_lng, type: number, source: input, description: "Raw start longitude" }
      - { name: end_lat, type: number, source: input, description: "Raw end latitude" }
      - { name: end_lng, type: number, source: input, description: "Raw end longitude" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied duplicate-detection key; unique per athlete among non-REJECTED activities" }
      - { name: effort_hints, type: array, source: input, description: "Optional array of {segment_id, elapsed_time_s, elevation_gain_m} per-segment timing captured by the device; when present for a matched segment, these values author the SegmentEffort. When absent, the default whole-activity effort is derived per segment_matching", default: [] }
      - { name: duplicate_of_id, type: string, source: system, description: "FK -> Activity.id; set when status=DUPLICATE pointing at the canonical activity (the candidate with earliest created_at); null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "PROCESSING | COMPLETED | DUPLICATE | REJECTED — upload lifecycle; DUPLICATE merges into canonical activity per cross-device reconciliation", default: "PROCESSING", constraints: "enum {PROCESSING, COMPLETED, DUPLICATE, REJECTED}" }
      - { name: flag_status, type: enum, source: system, description: "NONE | FLAGGED | CLEARED | CONFIRMED — leaderboard-integrity dimension evolving independently of status", default: "NONE", constraints: "enum {NONE, FLAGGED, CLEARED, CONFIRMED}" }
      - { name: auto_hidden, type: boolean, source: system, description: "True while owner athlete.safety_score < 50; hides activity from public reads and from segment-match sweeps", default: false }
      - { name: corrected_sport_type, type: enum, source: input, description: "Owner- or admin-supplied category correction; when set, effort eligibility is computed against corrected_sport_type", default: null, constraints: "enum {RIDE, RUN, VIRTUAL_RIDE, VIRTUAL_RUN, SWIM, EBikeRide}" }
      - { name: obfuscated_track, type: array, source: computed, description: "Public route = track_points minus head/tail while within any ACTIVE PrivacyZone (route obfuscation); recomputed on zone or track change" }
      - { name: obfuscated_start_lat, type: number, source: computed, description: "Latitude of first surviving track point outside all ACTIVE zones; null if fully swallowed" }
      - { name: obfuscated_start_lng, type: number, source: computed, description: "Longitude of first surviving track point outside all ACTIVE zones; null if fully swallowed" }
      - { name: obfuscated_end_lat, type: number, source: computed, description: "Latitude of last surviving track point outside all ACTIVE zones; null if fully swallowed" }
      - { name: obfuscated_end_lng, type: number, source: computed, description: "Longitude of last surviving track point outside all ACTIVE zones; null if fully swallowed" }
      - { name: elevation_gain_m, type: number, source: computed, description: "Denormalized sum of SegmentEffort.elevation_gain_m over this activity's efforts in ELIGIBLE status; drives segment-total invariant" }

  - name: Segment
    parent: Athlete
    common_fields: true
    fields:
      - { name: creator_id, type: string, source: input, description: "FK -> Athlete.id; athlete who authored the segment" }
      - { name: name, type: string, source: input, description: "Segment name; 3..80 chars; unique among non-RETIRED segments sharing the same sport_type" }
      - { name: sport_type, type: enum, source: input, description: "RIDE | RUN | SWIM — the segment's category; efforts only match same-category (or corrected same-category) activities", constraints: "enum {RIDE, RUN, SWIM}" }
      - { name: start_lat, type: number, source: input, description: "Section start latitude" }
      - { name: start_lng, type: number, source: input, description: "Section start longitude" }
      - { name: end_lat, type: number, source: input, description: "Section end latitude" }
      - { name: end_lng, type: number, source: input, description: "Section end longitude" }
      - { name: distance_m, type: number, source: input, description: "Section length in meters; must be > 0" }
      - { name: city, type: string, source: input, description: "City label used for heatmap aggregation grouping" }
      - { name: hazard_index, type: integer, source: input, description: "0..10 safety index; > 0 marks segment hazardous (downhill risk); hazardous segments are excluded from leaderboards and heatmap aggregation" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED — cyclic: RETIRED may return to ACTIVE only while total effort count is zero", default: "DRAFT", constraints: "enum {DRAFT, ACTIVE, RETIRED}" }
      - { name: effort_count, type: integer, source: system, description: "Total SegmentEffort rows (any flag_status) matched to this segment; cyclic re-activation gate", default: 0 }

  - name: SegmentEffort
    parent: Segment
    common_fields: true
    fields:
      - { name: activity_id, type: string, source: system, description: "FK -> Activity.id; source activity" }
      - { name: segment_id, type: string, source: system, description: "FK -> Segment.id; matched segment" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; denormalized owner for leaderboard queries" }
      - { name: elapsed_time_s, type: integer, source: system, description: "Effort time in seconds; from Activity.effort_hints when a hint exists for this segment, else derived per segment_matching; >= 1" }
      - { name: distance_m, type: number, source: system, description: "Copied from Segment.distance_m at match time" }
      - { name: elevation_gain_m, type: number, source: system, description: "From Activity.effort_hints when present, else 0; >= 0" }
      - { name: avg_speed_kmh, type: number, source: computed, description: "= distance_m / elapsed_time_s * 3.6, rounded to 2dp half-up; integrity basis for speed checks" }
      - { name: flag_status, type: enum, source: system, description: "ELIGIBLE | FLAGGED | EXCLUDED — FLAGGED by impossible-speed/vehicle checks, EXCLUDED by upheld flags or hazardous-category corrections", default: "ELIGIBLE", constraints: "enum {ELIGIBLE, FLAGGED, EXCLUDED}" }
      - { name: exclusion_reason, type: enum, source: system, description: "SPEED_IMPOSSIBLE | VEHICLE_ASSISTED | CATEGORY_MISMATCH | SEGMENT_HAZARDOUS | FLAG_UPHELD — why the effort left the leaderboard; null while ELIGIBLE", default: null, constraints: "enum {SPEED_IMPOSSIBLE, VEHICLE_ASSISTED, CATEGORY_MISMATCH, SEGMENT_HAZARDOUS, FLAG_UPHELD, null}" }
      - { name: rank_snapshot, type: integer, source: computed, description: "1-based rank of this effort among ELIGIBLE efforts on the same segment ordered by elapsed_time_s ASC, effort created_at ASC; snapshot refreshed on every leaderboard-relevant mutation" }

  - name: Flag
    parent: SegmentEffort
    common_fields: true
    fields:
      - { name: effort_id, type: string, source: input, description: "FK -> SegmentEffort.id; the effort under review" }
      - { name: reporter_id, type: string, source: input, description: "FK -> Athlete.id; athlete filing the flag" }
      - { name: reason, type: enum, source: input, description: "IMPOSSIBLE_TIME | VEHICLE_ASSISTED | WRONG_CATEGORY — flag grounds", constraints: "enum {IMPOSSIBLE_TIME, VEHICLE_ASSISTED, WRONG_CATEGORY}" }
      - { name: note, type: string, source: input, description: "Optional free text; max 500 chars", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | UPHELD | REJECTED — adjudication outcome", default: "OPEN", constraints: "enum {OPEN, UPHELD, REJECTED}" }

  - name: Club
    parent: Athlete
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Athlete.id; club founder and administrator" }
      - { name: name, type: string, source: input, description: "Club name; 3..60 chars; globally unique among non-ARCHIVED clubs" }
      - { name: sport_type, type: enum, source: input, description: "RIDE | RUN | SWIM | MULTI — club focus", constraints: "enum {RIDE, RUN, SWIM, MULTI}" }
      - { name: join_policy, type: enum, source: input, description: "OPEN | APPROVAL — OPEN auto-approves joins, APPROVAL parks membership in PENDING", constraints: "enum {OPEN, APPROVAL}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED — archiving a club cascades to challenges and events", default: "ACTIVE", constraints: "enum {ACTIVE, ARCHIVED}" }

  - name: ClubMembership
    parent: Club
    common_fields: true
    fields:
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; parent club (path-scoped)" }
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; joining athlete" }
      - { name: role, type: enum, source: system, description: "MEMBER | ADMIN — owner joins as ADMIN; later joins are MEMBER", default: "MEMBER", constraints: "enum {MEMBER, ADMIN}" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | REMOVED | LEFT — participation state within the club", default: "PENDING", constraints: "enum {PENDING, ACTIVE, REMOVED, LEFT}" }

  - name: Challenge
    parent: Club
    common_fields: true
    fields:
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; owning club (path-scoped)" }
      - { name: name, type: string, source: input, description: "Challenge name; 3..80 chars" }
      - { name: goal_type, type: enum, source: input, description: "DISTANCE_M | ELEVATION_M | ACTIVE_DAYS — aggregation metric", constraints: "enum {DISTANCE_M, ELEVATION_M, ACTIVE_DAYS}" }
      - { name: goal_target, type: number, source: input, description: "Target value for goal_type; must be > 0" }
      - { name: start_date, type: string, source: input, description: "Challenge window start date YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Challenge window end date YYYY-MM-DD (inclusive); must be >= start_date" }
      - { name: join_mode, type: enum, source: input, description: "OPEN | INVITE — OPEN allows any ACTIVE club member to join; INVITE restricts to members invited by an ADMIN", constraints: "enum {OPEN, INVITE}" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | CANCELLED — challenge lifecycle driven by the logical clock and club posture", default: "DRAFT", constraints: "enum {DRAFT, ACTIVE, CLOSED, CANCELLED}" }

  - name: ChallengeParticipation
    parent: Challenge
    common_fields: true
    fields:
      - { name: challenge_id, type: string, source: system, description: "FK -> Challenge.id; parent challenge (path-scoped)" }
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; participating athlete" }
      - { name: status, type: enum, source: system, description: "JOINED | WITHDRAWN | COMPLETED — COMPLETED is automatic when progress reaches goal_target", default: "JOINED", constraints: "enum {JOINED, WITHDRAWN, COMPLETED}" }
      - { name: progress_value, type: number, source: system, description: "Running progress toward goal_target accumulated from the athlete's COMPLETED activities inside [start_date, end_date]; rules per Challenge.progress_calculation", default: 0 }
      - { name: joined_at, type: datetime, source: system, description: "Server timestamp of join" }

  - name: VirtualEvent
    parent: Club
    common_fields: true
    fields:
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; hosting club (path-scoped)" }
      - { name: name, type: string, source: input, description: "Event name; 3..80 chars" }
      - { name: segment_id, type: string, source: input, description: "FK -> Segment.id; the segment raced; must be ACTIVE and hazard_index == 0 at creation" }
      - { name: scheduled_at, type: datetime, source: input, description: "Event start instant (ISO8601 UTC); must be strictly in the future relative to the logical clock" }
      - { name: capacity, type: integer, source: input, description: "Maximum RSVPs; 1..500" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | CANCELLED | COMPLETED", default: "PUBLISHED", constraints: "enum {PUBLISHED, CANCELLED, COMPLETED}" }
      - { name: rsvp_count, type: integer, source: system, description: "Count of EventRSVP rows in GOING status; capacity gate", default: 0 }

  - name: EventRSVP
    parent: VirtualEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> VirtualEvent.id; parent event (path-scoped)" }
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; responding athlete" }
      - { name: status, type: enum, source: system, description: "GOING | DECLINED — cyclic: DECLINED may return to GOING while the event is PUBLISHED and under capacity", default: "GOING", constraints: "enum {GOING, DECLINED}" }

  - name: SafetyContact
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; owning athlete (path-scoped)" }
      - { name: contact_email, type: string, source: input, description: "Beacon recipient email; unique per athlete" }
      - { name: label, type: string, source: input, description: "Contact label; max 40 chars" }

  - name: BeaconSession
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; sharing athlete (path-scoped)" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp of beacon activation" }
      - { name: last_location, type: object, source: system, description: "Latest {lat, lng} ping; null until first ping", default: null }
      - { name: status, type: enum, source: system, description: "LIVE | ENDED — one LIVE session per athlete at a time", default: "LIVE", constraints: "enum {LIVE, ENDED}" }

  - name: HeatmapCell
    parent: null
    common_fields: true
    fields:
      - { name: city, type: string, source: system, description: "City grouping key taken from the contributing activity's matched segments" }
      - { name: sport_type, type: enum, source: system, description: "RIDE | RUN — aggregation bucket; only these two sport types contribute to heat maps", constraints: "enum {RIDE, RUN}" }
      - { name: contribution_count, type: integer, source: system, description: "Number of contributing athlete-activities (see heatmap_contribution); cell surfaces publicly only when >= MIN_CELL_COUNT", default: 0 }

  - name: RoutePlan
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; planning athlete (path-scoped)" }
      - { name: name, type: string, source: input, description: "Plan name; 1..80 chars" }
      - { name: waypoints, type: array, source: input, description: "Ordered [{lat, lng}]; 2..50 points" }
      - { name: distance_m, type: number, source: input, description: "Planned route distance in meters; > 0" }
      - { name: week_start, type: string, source: input, description: "YYYY-MM-DD of the Monday of the training week this plan counts against (free-tier weekly cap accounting)" }
      - { name: estimated_load_score, type: number, source: computed, description: "Non-linear training-load estimate over planned distance and the athlete's recent activity base (see route_load_score)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Athlete
    initial_state: ACTIVE
    terminal_states: [DELETED]
    transitions:
      - from: ACTIVE
        to: DELETED
        trigger: "DELETE /v1/athletes/{id}"
        actor: Athlete
        preconditions:
          - "athlete_id in path must equal X-User-ID (self-deletion only)"
        side_effects:
          - "PII scrub: email overwritten to 'deleted-{id}@erased.invalid', display_name overwritten to 'Deleted Athlete'"
          - "All Athlete SegmentEffort rows: flag_status -> EXCLUDED with exclusion_reason unchanged-if-set else FLAG_UPHELD"
          - "All athlete Activities: status -> REJECTED (COMPLETED only; DUPLICATE/REJECTED untouched)"
          - "All OPEN Flags whose reporter_id == athlete: status -> REJECTED"
          - "All ACTIVE ClubMembership rows: status -> LEFT"
          - "All JOINED ChallengeParticipation rows: status -> WITHDRAWN"
          - "All GOING EventRSVP rows: status -> DECLINED (host event rsvp_count -= 1 per row)"
          - "All LIVE BeaconSession rows: status -> ENDED"
          - "Clubs owned by the athlete: status -> ARCHIVED (with full Club archive cascade)"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED, LAPSED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{id}/cancel"
        actor: "Athlete | PlatformAdmin"
        preconditions:
          - "subscription.athlete_id == X-User-ID (when actor is Athlete; PlatformAdmin may cancel any)"
        side_effects:
          - "Feature gating flips immediately: leaderboard full-board reads, route-plan creation, and beacon activation become FREE-tier gated for the owner"
        note: "At most one subscription with status == ACTIVE exists per athlete at any time (enforced at creation; ERR_INVALID_STATE otherwise)"

      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic on read when logical current_utc >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Feature gating flips immediately as for CANCELLED"
        note: "Lazy expiry: the flip happens on the first read or write that touches the subscription after expiry; tests use the clock endpoint to cross the boundary"

  - entity: PrivacyZone
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /v1/privacy-zones/{id}/disable"
        actor: Athlete
        preconditions:
          - "zone.athlete_id == X-User-ID"
        side_effects:
          - "For every Activity of the owner: recompute route obfuscation with this zone excluded (obfuscated_track / obfuscated_start_* / obfuscated_end_*)"

      - from: DISABLED
        to: ACTIVE
        trigger: "POST /v1/privacy-zones/{id}/enable"
        actor: Athlete
        preconditions:
          - "zone.athlete_id == X-User-ID"
        side_effects:
          - "For every Activity of the owner: recompute route obfuscation with this zone included"

  - entity: Activity
    initial_state: PROCESSING
    terminal_states: [DUPLICATE, REJECTED]
    note: "Two parallel dimensions: status (lifecycle) x flag_status (leaderboard integrity). They evolve independently except where noted."
    transitions:
      - from: PROCESSING
        to: COMPLETED
        trigger: "system (automatic at end of POST /v1/athletes/{id}/activities when no duplicate detected)"
        actor: system
        preconditions: []
        side_effects:
          - "Run route obfuscation against the owner's ACTIVE PrivacyZone -> obfuscated_* fields"
          - "Run segment match sweep: for each ACTIVE, hazard_index == 0 Segment whose sport_type == activity sport category, create a SegmentEffort (status ELIGIBLE, flag_status ELIGIBLE) and increment Segment.effort_count; then run speed_and_vehicle_checks over the new efforts"
          - "Run Challenge progress accumulation for the owner's JOINED participations whose window covers started_at"
          - "Run heatmap contribution for RIDE/RUN activities"

      - from: PROCESSING
        to: DUPLICATE
        trigger: "system (automatic at upload when another non-REJECTED Activity of the same athlete exists with same idempotency_key, or with same device_source and |started_at delta| <= 120s and |distance_m delta| <= 5% of the earlier activity's distance_m)"
        actor: system
        preconditions: []
        side_effects:
          - "duplicate_of_id := canonical (earlier-created) activity id"
          - "No segment sweep, no challenge accumulation, no heatmap contribution"

      - from: PROCESSING
        to: REJECTED
        trigger: "system (upload payload violates referential or shape rules beyond field validation, e.g. track_points unusable)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COMPLETED
        to: REJECTED
        trigger: "system (owner account deletion cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Owner's ELIGIBLE SegmentEffort rows -> EXCLUDED (see Athlete ACTIVE->DELETED)"

    # flag_status dimension (entity: Activity, parallel axis)
  - entity: Activity
    field: flag_status
    initial_state: NONE
    terminal_states: [CONFIRMED]
    transitions:
      - from: NONE
        to: FLAGGED
        trigger: "POST /v1/efforts/{id}/flags creates an OPEN flag on any effort of this activity"
        actor: Athlete
        preconditions:
          - "target effort's activity.status == COMPLETED"
          - "target effort's activity.flag_status != CONFIRMED"
          - "reporter != activity owner"
          - "no OPEN flag already exists on the same effort"
        side_effects:
          - "All ELIGIBLE efforts of the activity: flag_status -> FLAGGED"

      - from: FLAGGED
        to: CLEARED
        trigger: "POST /v1/flags/{id}/reject (last OPEN flag of the activity resolved REJECTED)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "All FLAGGED efforts of the activity: flag_status -> ELIGIBLE"
          - "athlete.safety_score := min(100, safety_score + 5)"

      - from: FLAGGED
        to: CONFIRMED
        trigger: "POST /v1/flags/{id}/uphold (first OPEN flag of the activity resolved UPHELD)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "All FLAGGED efforts of the activity: flag_status -> EXCLUDED with exclusion_reason FLAG_UPHELD"
          - "athlete.safety_score := max(0, safety_score - 10)"
          - "If athlete.safety_score < 50: every COMPLETED activity of the athlete gets auto_hidden = true; auto_hidden activities stop matching new segments and are excluded from public reads"

  - entity: Segment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/segments/{id}/activate"
        actor: Athlete
        preconditions:
          - "segment.creator_id == X-User-ID"
          - "segment.hazard_index == 0 (ERR_SAFETY_VIOLATION otherwise; hazardous segments never appear on leaderboards)"
        side_effects:
          - "Retroactive match sweep: every COMPLETED, non-auto-hidden Activity whose effective category matches this segment's sport_type (RIDE segments also match EBikeRide activities) gets an effort created per segment_matching (with speed_and_vehicle_checks); Segment.effort_count updated"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /v1/segments/{id}/retire"
        actor: Athlete
        preconditions:
          - "segment.creator_id == X-User-ID"
        side_effects:
          - "All ELIGIBLE SegmentEffort rows on the segment: flag_status -> EXCLUDED, exclusion_reason SEGMENT_HAZARDOUS"
          - "Activity.elevation_gain_m of each affected activity recomputed"
          - "HeatmapCell contribution_count recomputed for affected (city, sport_type) cells"
          - "Segment drops out of future match sweeps"

      - from: DRAFT
        to: RETIRED
        trigger: "POST /v1/segments/{id}/retire"
        actor: Athlete
        preconditions:
          - "segment.creator_id == X-User-ID"
        side_effects:
          - "No effort exclusion (a DRAFT segment has no efforts); Segment drops out of future match sweeps"
        note: "Discarded-draft path"

      - from: RETIRED
        to: ACTIVE
        trigger: "POST /v1/segments/{id}/activate"
        actor: Athlete
        preconditions:
          - "segment.creator_id == X-User-ID"
          - "segment.effort_count == 0 (cycle allowed only before any effort has ever been recorded)"
          - "segment.hazard_index == 0"
        side_effects: []
        note: "Cyclic edge: once effort_count > 0 the segment can never re-activate"

  - entity: SegmentEffort
    initial_state: ELIGIBLE
    terminal_states: [EXCLUDED]
    transitions:
      - from: ELIGIBLE
        to: FLAGGED
        trigger: "system (speed_and_vehicle_checks fail, or a Flag is created against the effort)"
        actor: system
        preconditions: []
        side_effects:
          - "exclusion_reason set when auto-flagged (SPEED_IMPOSSIBLE or VEHICLE_ASSISTED); null when community-flagged"
          - "rank_snapshot recomputed for remaining ELIGIBLE efforts on the segment"

      - from: FLAGGED
        to: ELIGIBLE
        trigger: "system (all flags on the effort resolved REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "exclusion_reason := null"
          - "rank_snapshot recomputed for ELIGIBLE efforts on the segment"

      - from: FLAGGED
        to: EXCLUDED
        trigger: "system (any flag on the effort resolved UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "exclusion_reason := FLAG_UPHELD"
          - "rank_snapshot recomputed for remaining ELIGIBLE efforts on the segment"
          - "Host Activity.elevation_gain_m recomputed"

      - from: ELIGIBLE
        to: EXCLUDED
        trigger: "system (category correction makes effective activity category incompatible with segment.sport_type; or segment retired; or owner account deleted)"
        actor: system
        preconditions: []
        side_effects:
          - "exclusion_reason := CATEGORY_MISMATCH | SEGMENT_HAZARDOUS | FLAG_UPHELD as applicable"
          - "rank_snapshot recomputed for remaining ELIGIBLE efforts on the segment"
          - "Host Activity.elevation_gain_m recomputed"

  - entity: Flag
    initial_state: OPEN
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /v1/flags/{id}/uphold"
        actor: Moderator
        preconditions: []
        side_effects:
          - "Effort FLAGGED -> EXCLUDED (FLAG_UPHELD)"
          - "Host activity flag_status FLAGGED -> CONFIRMED with athlete safety_score penalty and possible auto-hide cascade"

      - from: OPEN
        to: REJECTED
        trigger: "POST /v1/flags/{id}/reject"
        actor: Moderator
        preconditions: []
        side_effects:
          - "If no other OPEN flags on the effort's activity: effort FLAGGED -> ELIGIBLE, activity flag_status FLAGGED -> CLEARED, reporter's target athlete safety_score += 5 (cap 100)"

  - entity: Club
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /v1/clubs/{id}/archive (owner) or system (owner deletion cascade)"
        actor: Athlete
        preconditions:
          - "manual: club.owner_id == X-User-ID"
        side_effects:
          - "All PENDING or ACTIVE ClubMembership rows: status -> REMOVED"
          - "All DRAFT or ACTIVE Challenge rows of the club: status -> CANCELLED"
          - "All PUBLISHED VirtualEvent rows of the club: status -> CANCELLED (rsvp_count retained for audit)"

  - entity: ClubMembership
    initial_state: PENDING
    terminal_states: [REMOVED, LEFT]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (join_policy == OPEN auto-approves at join) or POST /v1/clubs/{id}/memberships/{id}/approve"
        actor: Athlete
        preconditions:
          - "manual approve: caller is an ACTIVE membership with role ADMIN of the same club"
        side_effects: []

      - from: PENDING
        to: REMOVED
        trigger: "POST /v1/clubs/{id}/memberships/{id}/remove (admin) or system (club archive / athlete deletion)"
        actor: Athlete
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /v1/clubs/{id}/memberships/{id}/remove (admin) or system (club archive)"
        actor: Athlete
        preconditions:
          - "manual: caller is ACTIVE ADMIN of the same club; cannot remove the club owner's membership"
        side_effects:
          - "Athlete's JOINED participations in this club's challenges: status -> WITHDRAWN"
          - "Athlete's GOING RSVPs in this club's events: status -> DECLINED (event rsvp_count -= 1)"

      - from: ACTIVE
        to: LEFT
        trigger: "POST /v1/clubs/{id}/memberships/{id}/leave (self) or system (athlete deletion)"
        actor: Athlete
        preconditions:
          - "membership.athlete_id == X-User-ID"
        side_effects:
          - "Same withdrawal cascade as REMOVED"

  - entity: Challenge
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/clubs/{id}/challenges/{id}/start"
        actor: Athlete
        preconditions:
          - "caller is an ACTIVE ClubMembership of this club with role == ADMIN"
          - "club.status == ACTIVE"
          - "logical clock date <= end_date"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "system (automatic on read when logical clock date > end_date) — lazy close"
        actor: system
        preconditions: []
        side_effects: []
        note: "Lazy close: flip observed on next read of the challenge"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /v1/clubs/{id}/challenges/{id}/cancel or system (club archive cascade)"
        actor: Athlete
        preconditions:
          - "manual: caller is ACTIVE ADMIN of the club"
        side_effects:
          - "All JOINED participations: status -> WITHDRAWN"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/clubs/{id}/challenges/{id}/cancel or system (club archive cascade)"
        actor: Athlete
        preconditions:
          - "manual: caller is ACTIVE ADMIN of the club"
        side_effects:
          - "All JOINED participations: status -> WITHDRAWN"

  - entity: ChallengeParticipation
    initial_state: JOINED
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: JOINED
        to: WITHDRAWN
        trigger: "POST /v1/challenges/{id}/participations/{id}/withdraw (self) or system cascades (membership removal, challenge cancel, account deletion)"
        actor: Athlete
        preconditions:
          - "manual: participation.athlete_id == X-User-ID"
        side_effects: []

      - from: JOINED
        to: COMPLETED
        trigger: "system (automatic when progress_value >= goal_target after a challenge progress accumulation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VirtualEvent
    initial_state: PUBLISHED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /v1/clubs/{id}/events/{id}/cancel (club admin) or system (club archive cascade)"
        actor: Athlete
        preconditions:
          - "manual: caller is ACTIVE ADMIN of the club"
        side_effects: []

      - from: PUBLISHED
        to: COMPLETED
        trigger: "system (automatic on read when logical current_utc > scheduled_at) — lazy completion"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EventRSVP
    initial_state: GOING
    terminal_states: []
    transitions:
      - from: GOING
        to: DECLINED
        trigger: "POST /v1/events/{id}/rsvps/{id}/decline (self) or system cascades (membership removal, account deletion)"
        actor: Athlete
        preconditions:
          - "manual: rsvp.athlete_id == X-User-ID"
        side_effects:
          - "event.rsvp_count -= 1"

      - from: DECLINED
        to: GOING
        trigger: "POST /v1/events/{id}/rsvps/{id}/rejoin (self)"
        actor: Athlete
        preconditions:
          - "rsvp.athlete_id == X-User-ID"
          - "event.status == PUBLISHED"
          - "event.rsvp_count < event.capacity"
        side_effects:
          - "event.rsvp_count += 1"
        note: "Cyclic edge bounded by capacity"

  - entity: BeaconSession
    initial_state: LIVE
    terminal_states: [ENDED]
    transitions:
      - from: LIVE
        to: ENDED
        trigger: "POST /v1/athletes/{id}/beacon_sessions/{id}/stop or system (account deletion cascade)"
        actor: Athlete
        preconditions:
          - "manual: session.athlete_id == X-User-ID"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: privacy-zone-update-stale-athlete
    parent_entity: Athlete
    write_endpoint: "PUT /v1/privacy-zones/{id}"
    occ_field: "expected_athlete_version"
    description: |
      Updating a PrivacyZone against an Athlete whose version has advanced since
      the client last observed it is rejected with ERR_STALE_VERSION. The zone
      mutation re-obfuscates every activity of the athlete (a cascading write on
      the athlete aggregate), so the client must present the athlete version it
      based the edit on; a second writer that already moved the athlete aggregate
      (e.g. by disabling the same zone) makes the presented version stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: segment_matching
    trigger: "Activity COMPLETED (upload sweep) and Segment DRAFT->ACTIVE (retroactive sweep)"
    algorithm: aggregation
    input_set: "ACTIVE, hazard_index == 0 segments whose sport_type matches the activity's effective category (corrected_sport_type if set, else sport_type). RIDE segments additionally match EBikeRide activities. VIRTUAL_RIDE/VIRTUAL_RUN activities match RIDE/RUN segments. SWIM matches SWIM only. The activity must be COMPLETED and not auto_hidden. Per athlete, a DRAFT segment by the same creator with the same (name, sport_type) as an ACTIVE or RETIRED segment is rejected with ERR_UNIQUE_VIOLATION."
    formula: |
      For each matched segment create one SegmentEffort:
        if activity.effort_hints contains a hint with segment_id == segment.id:
          elapsed_time_s = hint.elapsed_time_s; elevation_gain_m = hint.elevation_gain_m
        else:
          elapsed_time_s = activity.duration_s (whole-activity default); elevation_gain_m = 0
        distance_m = segment.distance_m (copied at match time)
      Segment.effort_count incremented per created effort.
      Then speed_and_vehicle_checks runs over each new effort.
    precision: "integer seconds; hint values used verbatim"
    variants: []

  - name: route_obfuscation
    trigger: "Activity upload completion; PrivacyZone create/update/enable/disable on the owner"
    algorithm: geometric_filter
    input_set: "The activity's ordered track_points and every ACTIVE PrivacyZone of the owner (DISABLED zones excluded)"
    formula: |
      surviving = []
      for p in track_points (ordered):
        inside_any = any(haversine_m(p.lat, p.lng, z.center_lat, z.center_lng) <= z.radius_m
                         for z in ACTIVE zones of activity owner)
        if not inside_any:
          surviving.append(p)
      obfuscated_track = surviving
      obfuscated_start_* = first point of surviving (null if empty)
      obfuscated_end_*   = last point of surviving (null if empty)
    constants:
      EARTH_RADIUS_M: 6371000
    precision: "haversine computed in double precision; containment uses <="
    variants:
      - name: full_swallow
        when: "every track point lies inside at least one ACTIVE zone"
        difference: "obfuscated_track is [] and obfuscated_start_*/end_* are null; the activity still completes and matches segments (matching uses raw track_points, not the obfuscated route)"

  - name: effort_rank_snapshot
    trigger: "Any change to the ELIGIBLE effort set of a segment (new effort, flag transitions, exclusion cascades)"
    algorithm: aggregation
    input_set: "SegmentEffort rows of the segment with flag_status == ELIGIBLE only"
    formula: |
      ordered = sort(eligible_efforts, by = (elapsed_time_s ASC, created_at ASC))
      for i, e in ordered: e.rank_snapshot = i + 1
    precision: "integer ranks, 1-based; ties broken by created_at ASC (never by id)"
    variants: []

  - name: speed_and_vehicle_checks
    trigger: "SegmentEffort creation (upload sweep, retroactive activation sweep)"
    algorithm: threshold
    input_set: "The new effort's distance_m (copied from segment), elapsed_time_s, and the activity's effective sport category (corrected_sport_type if set, else sport_type)"
    constants:
      MAX_SPEED_RIDE_KMH: 80
      MAX_SPEED_RUN_KMH: 30
      MAX_SPEED_SWIM_KMH: 10
      MAX_SPEED_EBIKE_KMH: 45
      MAX_SPEED_VIRTUAL_KMH: 100
      ASSIST_FACTOR_RIDE: 0.8
      ASSIST_FACTOR_RUN: 0.8
      ASSIST_FACTOR_SWIM: 0.8
      ASSIST_FACTOR_EBIKE: 0.7
      ASSIST_FACTOR_VIRTUAL: 0.9
    formula: |
      cat = effective_category(activity)   # corrected_sport_type or sport_type
      expected_min_time_s = (segment.distance_m * 3.6 / MAX_SPEED_for(cat)) * ASSIST_FACTOR_for(cat)
        where MAX_SPEED_for: RIDE->80, RUN->30, SWIM->10, EBikeRide->45, VIRTUAL_RIDE->100, VIRTUAL_RUN->100
        and ASSIST_FACTOR_for: RIDE->0.8, RUN->0.8, SWIM->0.8, EBikeRide->0.7, VIRTUAL_RIDE->0.9, VIRTUAL_RUN->0.9
      avg_speed_kmh = round_half_up(distance_m / elapsed_time_s * 3.6, 2)
      if elapsed_time_s < expected_min_time_s:
        effort.flag_status = FLAGGED; exclusion_reason = SPEED_IMPOSSIBLE
        activity.flag_status = FLAGGED (if currently NONE)
      else if cat == "EBikeRide" and segment.sport_type == "RIDE":
        effort.flag_status = FLAGGED; exclusion_reason = VEHICLE_ASSISTED
        activity.flag_status = FLAGGED (if currently NONE)
      Boundary: elapsed_time_s exactly == expected_min_time_s is NOT impossible (strict <).
      Example (RIDE, distance 500m, assist 0.8): expected_min = 500*3.6/80*0.8 = 18s; elapsed 17 flags, 18 passes.
      Example (VIRTUAL_RIDE, distance 500m): expected_min = 500*3.6/100*0.9 = 16.2s; elapsed 16 flags, 17 passes.
    precision: "avg_speed_kmh rounded to 2 decimal places, round_half_up; expected_min_time_s compared in unrounded double precision"
    variants:
      - name: vehicle_assist
        when: "effective category is EBikeRide and the matched segment is RIDE"
        difference: "effort flagged VEHICLE_ASSISTED instead of speed-checked against RIDE limits; uses MAX_SPEED_EBIKE_KMH for the speed half of the check"

  - name: challenge_progress
    trigger: "Activity transitions PROCESSING -> COMPLETED for an athlete with JOINED ChallengeParticipation rows"
    algorithm: aggregation
    input_set: |
      For each JOINED participation whose challenge window [start_date, end_date] covers
      activity.started_at's UTC date; only COMPLETED activities of the athlete that are
      not auto_hidden and whose flag_status is in {NONE, CLEARED} contribute.
      Each activity contributes at most once per challenge.
    formula: |
      Depending on challenge.goal_type:
        DISTANCE_M:   progress_value = sum(activity.distance_m) over contributing activities
        ELEVATION_M:  progress_value = sum(host activity.elevation_gain_m) over contributing activities
        ACTIVE_DAYS:  progress_value = count(distinct UTC calendar dates of contributing activities)
      if progress_value >= goal_target: participation.status = COMPLETED
    precision: "exact arithmetic on integers/floats as stored; boundary >= is inclusive"
    variants:
      - name: late_join_baseline
        when: "athlete joins the challenge after the challenge window has already begun (or after qualifying activities exist)"
        difference: "Retroactive join sweep counts only qualifying activities whose completion instant (the logical-clock time when the activity reached COMPLETED) is strictly after participation.joined_at; activities completed before joined_at contribute 0. Two athletes with identical activity histories but different join instants end with different progress_value."

  - name: segment_overlap_check
    trigger: "Segment activation (DRAFT -> ACTIVE or RETIRED -> ACTIVE)"
    algorithm: interval_merge
    input_set: "All ACTIVE segments with the same sport_type as the candidate segment"
    constants:
      OVERLAP_EPSILON_M: 50
    formula: |
      For each other ACTIVE segment S2 with same sport_type:
        d_start = haversine_m(candidate.start_lat, candidate.start_lng, S2.start_lat, S2.start_lng)
        d_end   = haversine_m(candidate.end_lat,   candidate.end_lng,   S2.end_lat,   S2.end_lng)
        if d_start < OVERLAP_EPSILON_M and d_end < OVERLAP_EPSILON_M:
          reject activation with ERR_SEGMENT_OVERLAP
      Boundary: exactly == OVERLAP_EPSILON_M on either endpoint is NOT an overlap (strict <).
    precision: "haversine double precision"
    variants: []

  - name: event_time_overlap_check
    trigger: "VirtualEvent creation"
    algorithm: interval_merge
    input_set: "All PUBLISHED VirtualEvents of the same club"
    constants:
      EVENT_WINDOW_S: 3600
    formula: |
      Each event occupies the half-open interval [scheduled_at, scheduled_at + EVENT_WINDOW_S).
      The new event is rejected with ERR_EVENT_TIME_OVERLAP when its interval intersects
      any existing PUBLISHED event's interval of the same club:
        new_start < existing_end and existing_start < new_end  (half-open intersection)
      Back-to-back scheduling (new_start == existing_end) is allowed — no buffer.
    precision: "second-precision instants"
    variants: []

  - name: heatmap_contribution
    trigger: "Activity COMPLETED (sport RIDE or RUN); athlete heatmap_opt_out change; activity exclusion cascades (flag upheld, account deletion, auto-hide); segment retire (cell recompute)"
    algorithm: aggregation
    input_set: "COMPLETED, non-auto-hidden activities of the athlete with flag_status in {NONE, CLEARED}, sport_type in {RIDE, RUN}, and athlete.heatmap_opt_out == false; the contributing cell's city comes from any matched segment's city, defaulting to 'UNMAPPED' when the activity matched no segment"
    formula: |
      contribution per activity = 1 toward HeatmapCell(city, sport_type)
      Recompute contribution_count as the exact count of qualifying contributions.
      A cell is returned by GET /v1/heatmap only when contribution_count >= MIN_CELL_COUNT.
    constants:
      MIN_CELL_COUNT: 3
    precision: "integer counts; boundary >= MIN_CELL_COUNT is inclusive"
    variants:
      - name: opt_out_withdrawal
        when: "athlete toggles heatmap_opt_out from false to true"
        difference: "all of the athlete's existing contributions are withdrawn immediately (counts decremented), versus new-upload contribution which increments"

  - name: route_load_score
    trigger: "RoutePlan creation"
    algorithm: projection
    input_set: "The plan's distance_m and the athlete's COMPLETED activities (any sport) whose started_at falls in the trailing 28 days before the plan's week_start"
    constants:
      PLAN_LOAD_DIVISOR: 1000
      PLAN_ACTIVITY_DIVISOR: 2000
      CAP_RATIO: 1.5
      CAP_BONUS: 25
    formula: |
      recent_distance_m = sum(distance_m of qualifying activities)   # 0 when none
      raw = plan.distance_m / PLAN_LOAD_DIVISOR + recent_distance_m / PLAN_ACTIVITY_DIVISOR
      if recent_distance_m > 0 and plan.distance_m > recent_distance_m * CAP_RATIO:
        raw += CAP_BONUS
      estimated_load_score = round_half_up(raw, 1)
      Evaluation order is pinned: recent_distance_m is computed FIRST, then raw, then the
      conditional spike bonus keyed on recent_distance_m — removing the circular-looking
      dependency between the bonus and the base sum.
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: free_tier_weekly_route_cap
    trigger: "RoutePlan creation by an athlete without an ACTIVE Subscription"
    algorithm: threshold
    input_set: "The athlete's RoutePlan rows whose week_start equals the new plan's week_start"
    constants:
      FREE_WEEKLY_ROUTE_CAP: 3
    formula: |
      existing = count(RoutePlan of athlete with same week_start)
      if existing >= FREE_WEEKLY_ROUTE_CAP: reject with ERR_FREE_TIER_ROUTE_CAP
      Boundary: creating the 3rd plan (existing == 2) succeeds; the 4th (existing == 3) fails.
    precision: "integer count; >= boundary"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per RBAC matrix; entity_backed ownership rules (athlete acts on own resources; club-admin actions require an ACTIVE membership with role ADMIN of that club)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (athlete, zone, activity, segment, effort, flag, club, membership, challenge, participation, event, rsvp, session); auto_hidden activities read as ERR_NOT_FOUND to non-owners"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced FK targets exist (creator_id, reporter_id, segment_id, athlete_id in joins)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "creation endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the operation: flag only efforts of COMPLETED activities whose flag_status != CONFIRMED; uphold/reject only OPEN flags; activate only DRAFT or zero-effort RETIRED segments; join only ACTIVE challenges; RSVP only PUBLISHED events; stop/ping only LIVE beacons; challenge/event actions require club ACTIVE (else ERR_CLUB_ARCHIVED); second ACTIVE subscription per athlete rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Club not ARCHIVED for club-scoped writes (join, challenge create/start/cancel, event create/cancel)"
    error_id: ERR_CLUB_ARCHIVED
    http_status: 409
    applies_to: "club-scoped write endpoints"

  - priority: 7
    category: business_safety
    check: "Safety rules: segment activation requires hazard_index == 0; beacon creation requires >= 1 SafetyContact of the athlete; auto_hidden activities excluded from public reads and segment sweeps"
    error_id: ERR_SAFETY_VIOLATION
    http_status: 422
    applies_to: "segment activate, beacon create"

  - priority: 8
    category: business_temporal
    check: "Temporal windows: challenge end_date >= start_date and start only while clock date <= end_date; event scheduled_at strictly after logical now; RSVP create/rejoin only while clock <= scheduled_at and event PUBLISHED"
    error_id: ERR_WINDOW_VIOLATION
    http_status: 422
    applies_to: "challenge create/start, event create, rsvp create/rejoin"

  - priority: 9
    category: business_constraint
    check: "Temporal-overlap resource conflicts: segment activation rejected when another ACTIVE same-sport segment has both endpoints within OVERLAP_EPSILON_M (50m, strict <); event creation rejected when its half-open [scheduled_at, scheduled_at+3600s) intersects another PUBLISHED event of the same club"
    error_id: "ERR_SEGMENT_OVERLAP / ERR_EVENT_TIME_OVERLAP"
    http_status: 409
    applies_to: "segment activate, event create"

  - priority: 10
    category: business_constraint
    check: "Structural uniqueness and membership constraints: email unique; one privacy zone per athlete; club name unique among non-ARCHIVED; segment (name, sport_type) unique among segments in {DRAFT, ACTIVE, RETIRED} (no re-creation of a taken name); contact_email unique per athlete; one LIVE beacon per athlete; reporter != effort owner (ERR_FLAG_SELF); no second OPEN flag on same effort; no duplicate club membership (ERR_DUPLICATE_MEMBERSHIP) / challenge participation (ERR_ALREADY_JOINED) / event RSVP per athlete"
    error_id: "ERR_UNIQUE_VIOLATION / ERR_DUPLICATE_MEMBERSHIP / ERR_ALREADY_JOINED"
    http_status: 409
    applies_to: "creation and join endpoints"

  - priority: 11
    category: business_constraint
    check: "Duplicate upload detection: same idempotency_key (non-REJECTED) for the athlete, or same device_source with |started_at delta| <= 120s and |distance_m delta| <= 5% of the earlier activity's distance_m — default mode completes as DUPLICATE (201, duplicate_of_id set to the earliest-created candidate); strict_duplicate=true forces the error"
    error_id: ERR_DUPLICATE_ACTIVITY
    http_status: 409
    applies_to: "activity upload"

  - priority: 12
    category: business_constraint
    check: "Capacity constraints: event RSVP create/rejoin rejected when event.rsvp_count >= event.capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "rsvp create, rsvp rejoin"

  - priority: 13
    category: business_fiscal
    check: "Subscription gating: leaderboard reads with limit > 10 require the requester to hold an ACTIVE subscription; route-plan creation beyond the free weekly cap requires an ACTIVE subscription; beacon creation requires an ACTIVE subscription. Order within this priority: the free-tier route cap is evaluated before the generic subscription gate."
    error_id: "ERR_FREE_TIER_ROUTE_CAP / ERR_SUBSCRIPTION_REQUIRED"
    http_status: 402
    applies_to: "GET /v1/segments/{id}/leaderboard (limit > 10), POST /v1/athletes/{id}/route_plans, POST /v1/athletes/{id}/beacon_sessions"

  - priority: 14
    category: business_referential
    check: "Cross-entity consistency at write time: event.segment_id must reference an ACTIVE, hazard_index == 0 segment; corrected_sport_type must be a valid enum different from the activity's current effective category"
    error_id: ERR_INCONSISTENT_REFERENCE
    http_status: 422
    applies_to: "event create, activity correct_category"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Athlete ---
  - method: POST
    path: "/v1/athletes"
    description: "Register an athlete"
    roles: [Athlete, PlatformAdmin]
    code: 201
    input: [email, display_name, home_lat, home_lng, "tier?", "heatmap_opt_out?"]
    output: Athlete
    side_effects: ["status=ACTIVE, safety_score=100, version=1"]

  - method: GET
    path: "/v1/athletes/{id}"
    description: "Get an athlete"
    roles: [Athlete, PlatformAdmin, Moderator]
    code: 200
    input: []
    output: Athlete
    side_effects: ["Lazy subscription lapse evaluation for the athlete's subscriptions"]

  - method: GET
    path: "/v1/athletes/{id}/export"
    description: "Athlete data export: profile, activities (raw track), efforts, segments created, memberships, participations, RSVPs, zones, contacts, subscriptions"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: "{ profile: object, activities: array, efforts: array, segments: array, memberships: array, participations: array, rsvps: array, privacy_zones: array, safety_contacts: array, subscriptions: array }"
    side_effects: []

  - method: DELETE
    path: "/v1/athletes/{id}"
    description: "Delete (erase) the athlete account; runs the full erasure cascade"
    roles: [Athlete]
    code: 200
    input: []
    output: Athlete
    side_effects: ["Athlete -> DELETED with PII scrub and full cascade per state machine"]

  # --- Subscription ---
  - method: POST
    path: "/v1/athletes/{id}/subscriptions"
    description: "Create a subscription for an athlete"
    roles: [Athlete, PlatformAdmin]
    code: 201
    input: [plan, started_at, expires_at]
    output: Subscription
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/v1/athletes/{id}/subscriptions"
    description: "List subscriptions of an athlete"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: "Subscription[]"
    side_effects: ["Lazy lapse evaluation before listing"]

  - method: GET
    path: "/v1/subscriptions/{id}"
    description: "Get a subscription"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Lazy lapse evaluation"]

  - method: POST
    path: "/v1/subscriptions/{id}/cancel"
    description: "Cancel an active subscription (owner only)"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: ["cancel_reason?"]
    output: Subscription
    side_effects: ["status -> CANCELLED; feature gating flips to FREE for owner"]

  # --- PrivacyZone ---
  - method: POST
    path: "/v1/athletes/{id}/privacy_zones"
    description: "Create the athlete's privacy zone (one per athlete)"
    roles: [Athlete, PlatformAdmin]
    code: 201
    input: [center_lat, center_lng, radius_m]
