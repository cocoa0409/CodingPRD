# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances. Grounds resolve into
# SCAFFOLD.yaml §1.1–§1.7. All numeric asserts are code-computed literals.
# Logical clock startup default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: contract_seat_charge_provisional_vs_final
        grounds:
          - calculations.seat_base_charge
          - calculations.invoice_total
          - entities.Invoice.fields.total_cents
          - entities.SeatAdjustment.fields.effective_at
        distinguishing_aspect: "On the Contract billing domain: PROVISIONAL charges the current 20-seat snapshot at full period rate (95000) while FINAL prorates by 450 seat-days over 30 days (71250) — same contract, same period, different totals."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Client active. Contract SILVER, seat_count 10, per_seat_rate_cents 5000, no add-ons, activated (period 2026-06-01..2026-07-01)."
            - "Seat adjustment +10 effective 2026-06-16 (seat_count now 20)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /clients"
              payload: { company_name: "Acme", primary_contact_email: "a@acme.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 10, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
              captures: { c_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: ServiceManager
            - call: "POST /contracts/${contract_id}/seat-adjustments"
              payload: { delta: 10, effective_at: "2026-06-16T00:00:00Z", expected_contract_version: "${c_v}" }
              as: ServiceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /contracts/${contract_id}/invoices"
              payload: { variant: "PROVISIONAL" }
              as: ServiceManager
              captures: { prov_total: $.data.total_cents, prov_base: $.data.base_seat_charge_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /contracts/${contract_id}/invoices"
              payload: { variant: "FINAL" }
              as: ServiceManager
              captures: { final_total: $.data.total_cents, final_days: $.data.total_seat_days }
          assert:
            - "PROVISIONAL Invoice.base_seat_charge_cents == 100000 and total_cents == 95000"
            - "FINAL Invoice.total_seat_days == 450 and base_seat_charge_cents == 75000 and total_cents == 71250"
            - "prov_total (95000) != final_total (71250)"

      - name: ticket_labor_estimated_vs_actual
        grounds:
          - calculations.ticket_billable_minutes
          - entities.Ticket.fields.billable_minutes
          - state_machines.Dispatch.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "On the Ticket labor domain (a different entity from the Contract charge): billable_minutes is the P2 ESTIMATED default 120 before any dispatch completes and the ACTUAL sum 200 afterward."
        test_recipe:
          setup:
            - "Client + SILVER contract active; technician; P2 ticket assigned (IN_PROGRESS), no completed dispatch yet."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Beta", primary_contact_email: "b@beta.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "Tara Tech", hourly_rate_cents: 9000 }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P2", subject: "email down" }
              as: ServiceManager
              captures: { ticket_id: $.data.id }
            - call: "POST /tickets/${ticket_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "GET /tickets/${ticket_id}"
              payload: {}
              as: Dispatcher
              captures: { est_minutes: $.data.billable_minutes }
            - call: "POST /tickets/${ticket_id}/dispatches"
              payload: { technician_id: "${tech_id}", mode: "REMOTE", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Dispatcher
              captures: { dispatch_id: $.data.id }
            - call: "POST /dispatches/${dispatch_id}/complete"
              payload: { logged_minutes: 200 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /tickets/${ticket_id}"
              payload: {}
              as: Dispatcher
              captures: { act_minutes: $.data.billable_minutes }
          assert:
            - "Before dispatch completion: Ticket.billable_minutes == 120 (ESTIMATED, PRIORITY_ESTIMATE_MINUTES[P2])"
            - "After dispatch completion: Ticket.billable_minutes == 200 (ACTUAL, sum of logged_minutes)"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_tiered_discount_and_addons
        grounds:
          - calculations.invoice_total
          - entities.Contract.fields.backup_addon
          - entities.Contract.fields.security_addon
          - entities.Invoice.fields.volume_discount_cents
        distinguishing_aspect: "Mode (a): a >=3-input non-linear formula — base(seat_count*rate) minus a tiered volume discount selected by seat_count (30 -> 0.10 tier) plus conditional backup+security add-on charges = 204000."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Client active. Contract SILVER, seat_count 30, per_seat_rate_cents 5000, backup_addon true, security_addon true, activated. No ticket overage."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /clients"
              payload: { company_name: "Gamma", primary_contact_email: "g@gamma.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 30, per_seat_rate_cents: 5000, backup_addon: true, security_addon: true }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /contracts/${contract_id}/invoices"
              payload: { variant: "PROVISIONAL" }
              as: ServiceManager
              captures: { total: $.data.total_cents }
          assert:
            - "Invoice.base_seat_charge_cents == 150000"
            - "Invoice.volume_discount_cents == 15000 (seat_count_snapshot 30 -> tier [25,49] -> 0.10)"
            - "Invoice.addon_charge_cents == 69000 (30*800 backup + 30*1500 security)"
            - "Invoice.overage_charge_cents == 0 and Invoice.total_cents == 204000"

      - name: procurement_total_round_per_line_then_sum
        grounds:
          - calculations.order_total
          - entities.ProcurementOrder.fields.total_cents
          - entities.ProcurementOrder.fields.line_items
        distinguishing_aspect: "Mode (b): nested rounding where order matters — round_half_up per line item after tax (366 + 367 = 733) is pinned; the sum-then-round alternative (round(667*1.10)=734) is a different cent."
        test_recipe:
          setup:
            - "Client with ample credit. Procurement order with two lines (333 x1) and (334 x1), tax_rate 0.10."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Delta", primary_contact_email: "d@delta.test", credit_limit_cents: 1000000 }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /procurement-orders"
              payload: { client_id: "${client_id}", line_items: [ { description: "cable", unit_price_cents: 333, qty: 1 }, { description: "clip", unit_price_cents: 334, qty: 1 } ], tax_rate: 0.10 }
              as: AccountManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /procurement-orders/${order_id}"
              payload: {}
              as: AccountManager
              captures: { total: $.data.total_cents }
          assert:
            - "ProcurementOrder.total_cents == 733 (round(333*1.10)=366 + round(334*1.10)=367)"
            - "total_cents != 734 (the sum-then-round value is explicitly NOT used)"

  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_cyclic_resolve_reopen_resolve
        grounds:
          - state_machines.Ticket.IN_PROGRESS_to_RESOLVED
          - state_machines.Ticket.RESOLVED_to_IN_PROGRESS
          - entities.Ticket.fields.status
        distinguishing_aspect: "Ticket is cyclic: RESOLVED transitions back to IN_PROGRESS on reopen, so RESOLVED is reached twice on one ticket — not a linear pipeline."
        test_recipe:
          setup:
            - "Client + SILVER contract active; technician; P3 ticket assigned (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Eps", primary_contact_email: "e@eps.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "Ty Tech", hourly_rate_cents: 8000 }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P3", subject: "printer" }
              as: ServiceManager
              captures: { ticket_id: $.data.id }
            - call: "POST /tickets/${ticket_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /tickets/${ticket_id}/resolve"
              payload: {}
              as: Dispatcher
              captures: { s1: $.data.status }
            - call: "POST /tickets/${ticket_id}/reopen"
              payload: {}
              as: Dispatcher
              captures: { s2: $.data.status }
            - call: "POST /tickets/${ticket_id}/resolve"
              payload: {}
              as: Dispatcher
              captures: { s3: $.data.status }
          assert:
            - "After first resolve: Ticket.status == RESOLVED"
            - "After reopen: Ticket.status == IN_PROGRESS (cycle back)"
            - "After second resolve: Ticket.status == RESOLVED (RESOLVED entered twice)"

      - name: quote_branch_and_revert_to_draft
        grounds:
          - state_machines.Quote.SENT_to_DRAFT
          - state_machines.Quote.SENT_to_ACCEPTED
          - entities.Quote.fields.status
        distinguishing_aspect: "Quote (a different entity from Ticket) branches from SENT: request-revision reverts SENT->DRAFT while accept goes SENT->ACCEPTED, so DRAFT is reachable after SENT — a revert loop, not linear."
        test_recipe:
          setup:
            - "Client active. PROJECT quote DRAFT with one line item, valid_until 2026-12-31."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Zeta", primary_contact_email: "z@zeta.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /quotes"
              payload: { client_id: "${client_id}", quote_type: "PROJECT", title: "migration", line_items: [ { description: "labor", unit_price_cents: 100000, qty: 1 } ], valid_until: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: AccountManager
              captures: { s1: $.data.status }
            - call: "POST /quotes/${quote_id}/request-revision"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { s2: $.data.status }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: AccountManager
              captures: { s3: $.data.status }
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { s4: $.data.status }
          assert:
            - "After first send: Quote.status == SENT"
            - "After request-revision: Quote.status == DRAFT (revert edge)"
            - "After second send: Quote.status == SENT; after accept: Quote.status == ACCEPTED"

  - rule_id: transitive_cascade
    instances:
      - name: client_offboard_depth3_contract_asset_patch_ticket
        grounds:
          - state_machines.Client.ACTIVE_to_OFFBOARDED
          - state_machines.Contract.ACTIVE_to_TERMINATED
          - state_machines.Asset.ACTIVE_to_RETIRED
          - state_machines.PatchJob.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Depth-3+ chain from Client offboard: offboard->Contract TERMINATED->Asset RETIRED->PatchJob CANCELLED, each hop caused strictly by the previous mutation (not a fan-out from offboard)."
        test_recipe:
          setup:
            - "Client active; SILVER contract active; asset assigned (ACTIVE); one SCHEDULED patch job on the asset; one NEW ticket referencing the asset."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Eta", primary_contact_email: "h@eta.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", label: "HQ", address: "1 Main" }
              as: ServiceManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /assets"
              payload: { client_id: "${client_id}", site_id: "${site_id}", asset_type: "LAPTOP", hostname: "lap-01" }
              as: ServiceManager
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/assign-contract"
              payload: { contract_id: "${contract_id}" }
              as: ServiceManager
            - call: "POST /assets/${asset_id}/patch-jobs"
              payload: { window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-10T02:00:00Z" }
              as: Dispatcher
              captures: { patch_id: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P3", subject: "won't boot", asset_id: "${asset_id}" }
              as: Dispatcher
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/offboard"
              payload: {}
              as: ServiceManager
              captures: { client_status: $.data.status }
          assert:
            - "Client.status == OFFBOARDED"
            - "Contract.${contract_id}.status == TERMINATED (link1)"
            - "Asset.${asset_id}.monitoring_status == RETIRED (link2, caused by contract termination)"
            - "PatchJob.${patch_id}.status == CANCELLED (link3, caused by asset retirement)"
            - "Ticket.${ticket_id}.status == CANCELLED (caused by asset retirement)"

      - name: dispatch_complete_depth2_ticket_contract_accrual
        grounds:
          - state_machines.Dispatch.SCHEDULED_to_COMPLETED
          - state_machines.Ticket.IN_PROGRESS_to_RESOLVED
          - entities.Contract.fields.period_ticket_minutes
        distinguishing_aspect: "Depth-2 chain from a different trigger (dispatch complete): complete->Ticket RESOLVED->Contract.period_ticket_minutes accrual (90), where the contract accrual is caused by the ticket resolve, not by the dispatch directly."
        test_recipe:
          setup:
            - "Client + SILVER contract active; technician; P2 ticket assigned (IN_PROGRESS); contract period_ticket_minutes 0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Theta", primary_contact_email: "t@theta.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "Ike Tech", hourly_rate_cents: 9000 }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P2", subject: "vpn" }
              as: ServiceManager
              captures: { ticket_id: $.data.id }
            - call: "POST /tickets/${ticket_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /tickets/${ticket_id}/dispatches"
              payload: { technician_id: "${tech_id}", mode: "REMOTE", scheduled_start: "2026-05-01T05:00:00Z", scheduled_end: "2026-05-01T06:30:00Z", resolves_ticket: true }
              as: Dispatcher
              captures: { dispatch_id: $.data.id }
          trigger:
            - call: "POST /dispatches/${dispatch_id}/complete"
              payload: { logged_minutes: 90 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { dstatus: $.data.status }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ServiceManager
              captures: { ptm: $.data.period_ticket_minutes }
          assert:
            - "Dispatch.status == COMPLETED"
            - "Ticket.${ticket_id}.status == RESOLVED (link1, caused by dispatch complete)"
            - "Contract.period_ticket_minutes == 90 (link2, caused by ticket resolve accruing ACTUAL billable_minutes)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_state_precedes_technician_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_TICKET_NOT_DISPATCHABLE]
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: "Pair (state, business_temporal): a dispatch create on a NEW ticket with a double-booked technician fails ERR_TICKET_NOT_DISPATCHABLE (priority 5) before ERR_TECHNICIAN_DOUBLE_BOOKED (priority 7) is ever evaluated."
        test_recipe:
          setup:
            - "Client + SILVER contract active; technician; ticket A assigned (IN_PROGRESS) with an ONSITE dispatch 08:00-09:00 occupying the tech; ticket B still NEW."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Iota", primary_contact_email: "i@iota.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "Uma Tech", hourly_rate_cents: 9000 }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P2", subject: "A" }
              as: ServiceManager
              captures: { ticket_a: $.data.id }
            - call: "POST /tickets/${ticket_a}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /tickets/${ticket_a}/dispatches"
              payload: { technician_id: "${tech_id}", mode: "ONSITE", scheduled_start: "2026-05-01T08:00:00Z", scheduled_end: "2026-05-01T09:00:00Z" }
              as: Dispatcher
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P2", subject: "B" }
              as: ServiceManager
              captures: { ticket_b: $.data.id }
          trigger:
            - call: "POST /tickets/${ticket_b}/dispatches"
              payload: { technician_id: "${tech_id}", mode: "ONSITE", scheduled_start: "2026-05-01T08:30:00Z", scheduled_end: "2026-05-01T09:30:00Z" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "Response error_id == ERR_TICKET_NOT_DISPATCHABLE (state, priority 5) — NOT ERR_TECHNICIAN_DOUBLE_BOOKED (priority 7)"

      - name: place_order_referential_precedes_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_QUOTE_NOT_ACCEPTED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "Pair (business_referential, business_fiscal): placing an order that both links a non-ACCEPTED quote and exceeds credit fails ERR_QUOTE_NOT_ACCEPTED (priority 6) before ERR_CREDIT_LIMIT_EXCEEDED (priority 9)."
        test_recipe:
          setup:
            - "Client with credit_limit_cents 100. PROCUREMENT quote SENT (not accepted). Order linked to that quote, total 54000 (> credit)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Kappa", primary_contact_email: "k@kappa.test", credit_limit_cents: 100 }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /quotes"
              payload: { client_id: "${client_id}", quote_type: "PROCUREMENT", title: "laptops", line_items: [ { description: "laptop", unit_price_cents: 50000, qty: 1 } ], valid_until: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: AccountManager
            - call: "POST /procurement-orders"
              payload: { client_id: "${client_id}", quote_id: "${quote_id}", line_items: [ { description: "laptop", unit_price_cents: 50000, qty: 1 } ] }
              as: AccountManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /procurement-orders/${order_id}/place"
              payload: {}
              as: AccountManager
              captures: { err_id: $.data.error_id }
          assert:
            - "Response error_id == ERR_QUOTE_NOT_ACCEPTED (business_referential, priority 6) — NOT ERR_CREDIT_LIMIT_EXCEEDED (priority 9)"

  - rule_id: boundary_precision_check
    instances:
      - name: sla_response_breached_at_exact_due_instant
        grounds:
          - calculations.sla_deadlines
          - entities.Ticket.fields.sla_response_breached
          - entities.Ticket.fields.sla_response_due_at
        distinguishing_aspect: "Time-threshold boundary on GET /tickets/{id}: with no first response, sla_response_breached is false at 00:59:00 and flips true at exactly the due instant 01:00:00 (>= boundary, not >)."
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. SILVER contract active. P2 ticket created (created_at 2026-05-01T00:00:00Z, response target 60m -> due 2026-05-01T01:00:00Z), never assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /clients"
              payload: { company_name: "Lam", primary_contact_email: "l@lam.test" }
