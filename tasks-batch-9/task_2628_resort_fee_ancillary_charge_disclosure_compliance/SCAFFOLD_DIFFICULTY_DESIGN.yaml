            - call: "POST /fee-programs/${fp1}/publish"
              payload: { attestation_note: "Inclusion analysis reviewed for all three mandatory fees." }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /revenue-impact-models"
              payload: { property_id: "${p1}", fee_program_id: "${fp1}", scenario: "PARTIAL_ROLL_IN", variant: "RATE_PARITY", roll_in_fee_codes: ["DESTINATION", "WIFI_PREMIUM"] }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { rm_rp: $.data.id }
