              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${it1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-01", loss_type: "COLLISION", equipment_item_id: "${it1}" }
              as: Underwriter
              captures: { clm: $.data.id }
          trigger:
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "REPAIR" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
          assert:
            - "trigger[0] (X-User-Role UnderwritingManager) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED; Claim.${clm}.adjustment_status is still OPEN"
            - "trigger[1] (X-User-Role Underwriter) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED - the underwriter who reported the loss may not inspect it"
            - "trigger[2] (ClaimsAdjuster adj-1) HTTP status == 200; adjustment_status == INSPECTED, inspected_by_user_id == adj-1"
            - "trigger[3] HTTP status == 200; adjustment_status == REPAIR_APPROVED, declared_by_user_id == adj-1, settlement_amount_cents == 2900000"
            - "trigger[4] (X-User-Role ClaimsAdjuster, X-User-ID adj-2) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED - the role denial fires even though adj-2 is NOT the declaring adjuster, so priority 20 pre-empts priority 23"
            - "trigger[5] (X-User-Role Underwriter) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "trigger[6] (UnderwritingManager mgr-1) HTTP status == 200; adjustment_status == CLOSED, settlement_paid_cents == 2900000, settled_by_user_id == mgr-1"
            - "after trigger[6]: Policy.${pol}.incurred_loss_cents == 2900000 and CoveragePart.${cp}.aggregate_available_cents == 197100000"
            - "exactly one CLAIM_SETTLEMENT LedgerEntry exists: the three rejected settle attempts wrote nothing"

      - name: corner_policyholder_is_scoped_to_the_policy_that_is_its_own_identity
        claim_type: Ownership Scoping
        grounds:
          - rbac.Policyholder.identity
          - validations[priority=21]
          - errors[ERR_NOT_POLICY_OWNER]
        distinguishing_aspect: "A Policyholder whose X-User-ID is policy A's id reads A's premium-summary with 200 but gets 403 ERR_NOT_POLICY_OWNER on policy B's premium-summary and on filing a value report against B's reporting-form part, even though both endpoints list Policyholder among their roles."
