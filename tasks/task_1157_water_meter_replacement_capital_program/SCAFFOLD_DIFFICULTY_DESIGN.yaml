  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: budget_commit_create_cancel_conservation
        grounds:
          - calculations.budget_position
          - state_machines.WorkOrder.CREATED_to_CANCELLED
          - entities.Program.fields.budget_available_cents
        distinguishing_aspect: |
          Conserved quantity: budget cents. Forward action (work order create)
          commits 20000 (available 5000000 -> 4980000); compensating action
          (cancel) releases exactly 20000 — budget_available_cents returns to
          exactly 5000000 with zero drift, pinned by
          available == total - committed - spent.
        test_recipe:
          setup:
            - "Program budget_total_cents 5000000; wave OPEN; account with legacy meter installed; work order created (committed 20000)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-9201", service_address: "23 Cherry St", meter_location: "OUTSIDE", customer_name: "Pam", customer_phone: "555-9201", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-9201", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id } }
            - { call: "GET /api/programs/${prog}", payload: {}, as: ProgramManager, captures: { avail_mid: $.data.budget_available_cents } }
          trigger:
            - { call: "POST /api/work-orders/${wo}/cancel", payload: {}, as: Scheduler }
            - { call: "GET /api/programs/${prog}", payload: {}, as: ProgramManager }
          assert:
            - "after create: budget_committed_cents == 20000 and budget_available_cents == 4980000"
            - "after cancel (compensation): budget_committed_cents == 0 and budget_available_cents == 5000000 exactly (invariant restored)"
            - "invariant: budget_total_cents == budget_committed_cents + budget_spent_cents + budget_available_cents (5000000 == 0 + 0 + 5000000)"
            - "WorkOrder.${wo}.committed_amount_cents == 0 and lifecycle_status == CANCELLED"

      - name: wave_headcount_create_cancel_conservation
        grounds:
          - entities.Wave.fields.committed_count
          - state_machines.WorkOrder.CREATED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: wave headcount (integer count, not cents). Creating
          two work orders raises committed_count to 2; cancelling one restores it
          to exactly 1 — the count equals the number of live (non-CANCELLED) work
          orders at every step. Different conserved-quantity type from
          budget_commit_create_cancel_conservation.
        test_recipe:
          setup:
            - "Wave OPEN capacity 10; two work orders created (A and B) on two accounts"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-9202", service_address: "24 Cherry St", meter_location: "OUTSIDE", customer_name: "Quinn", customer_phone: "555-9202", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acctA: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-9202", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldmA: $.data.id } }
            - { call: "POST /api/meters/${oldmA}/install", payload: { service_account_id: "${acctA}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acctA}" }, as: Scheduler, captures: { woA: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-9203", service_address: "25 Cherry St", meter_location: "OUTSIDE", customer_name: "Rob", customer_phone: "555-9203", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acctB: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-9203", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldmB: $.data.id } }
            - { call: "POST /api/meters/${oldmB}/install", payload: { service_account_id: "${acctB}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acctB}" }, as: Scheduler, captures: { woB: $.data.id } }
          trigger:
            - { call: "POST /api/work-orders/${woA}/cancel", payload: {}, as: Scheduler }
            - { call: "GET /api/waves/${wave}", payload: {}, as: ProgramManager }
          assert:
            - "before cancel: Wave.${wave}.committed_count == 2"
            - "after cancelling WO A: Wave.${wave}.committed_count == 1 exactly"
            - "Wave.${wave}.completed_count == 0"
            - "ServiceAccount.${acctA}.status == ELIGIBLE (reverted; no other open work order)"
            - "ServiceAccount.${acctB}.status == IN_PROGRAM (unchanged)"



