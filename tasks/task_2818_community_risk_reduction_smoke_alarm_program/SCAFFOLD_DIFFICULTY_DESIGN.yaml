            - "HomeSafetyVisit.${v2_id}.scheduled_end_utc == 2026-08-03T15:20:00Z"
            - "CanvassRoute.${r1_id}.booked_slot_count == 2"
            - "CanvassRoute.${r2_id}.booked_slot_count == 0"
            - "CanvassRoute.${r1_id}.committed_minutes == 70"

      - name: grant_periods_are_closed_intervals_so_a_shared_end_date_overlaps
        grounds:
          - validations[priority 18 - business_temporal - ERR_GRANT_PERIOD_OVERLAP]
          - state_machines.PartnerGrant.DRAFT_to_ACTIVE
          - entities.PartnerGrant.fields.period_start_date
          - errors.ERR_GRANT_PERIOD_OVERLAP
        distinguishing_aspect: |
          A different resource entity (PartnerGrant funding capacity, not a crew calendar) and
          different interval semantics: CLOSED calendar-date intervals with no buffer, compared at
          day granularity. A candidate period starting exactly on the incumbent's end date overlaps
          on that single shared day and is refused, while starting one day later is admitted -
          the opposite of the half-open instant rule used for crew occupation.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One partner with three grants, all funding SMOKE_10YR: G-H1 covering 2026-01-01..2026-06-30 and already ACTIVE, G-TOUCH covering 2026-06-30..2026-12-31 in DRAFT, and G-NEXT covering 2026-07-01..2026-12-31 in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "ops@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p1_id}", grant_code: "G-H1", authorized_cents: 500000, period_start_date: "2026-01-01", period_end_date: "2026-06-30", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { g_h1_id: $.data.id }
            - call: "POST /crr/grants/${g_h1_id}/activate"
              payload: {}
              as: GrantOfficer
            - call: "POST /crr/grants"
              payload: { partner_id: "${p1_id}", grant_code: "G-TOUCH", authorized_cents: 500000, period_start_date: "2026-06-30", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { g_touch_id: $.data.id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p1_id}", grant_code: "G-NEXT", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { g_next_id: $.data.id }
          trigger:
            - call: "POST /crr/grants/${g_touch_id}/activate"
              payload: {}
              as: GrantOfficer
              captures: { err: $.data.error_id }
            - call: "POST /crr/grants/${g_next_id}/activate"
              payload: {}
              as: GrantOfficer
          assert:
            - "the G-TOUCH activation returns 409 with response.error_id == ERR_GRANT_PERIOD_OVERLAP"
            - "PartnerGrant.${g_touch_id}.status == DRAFT"
            - "the G-NEXT activation returns 200 and PartnerGrant.${g_next_id}.status == ACTIVE"
            - "PartnerGrant.${g_h1_id}.status == ACTIVE"
            - "PartnerGrant.${g_next_id}.available_cents == 500000"

      - name: zone_daily_slot_cap_is_pure_aggregate_capacity_without_intervals
        grounds:
          - validations[priority 24 - business_constraint - ERR_ZONE_DAILY_CAP_EXCEEDED]
          - entities.RiskZone.fields.daily_visit_cap
          - state_machines.CanvassRoute.PLANNED_to_PUBLISHED
          - errors.ERR_ZONE_DAILY_CAP_EXCEEDED
        distinguishing_aspect: |
          A third resource entity - RiskZone canvassing capacity - with no interval component at all:
          the cap sums planned_slots over every PUBLISHED or IN_PROGRESS route of the zone on one
          service_date, so two routes with completely disjoint windows (13:00-15:00 and 18:00-20:00)
          still collide once their slots exceed daily_visit_cap 3. Neither the crew buffer nor any
          date-interval comparison is involved.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One assessed TIER_2 zone with daily_visit_cap 3."
            - "Route R1 with 2 slots windowed 13:00-15:00Z is already PUBLISHED."
            - "Routes R2 (2 slots) and R3 (1 slot) are both PLANNED and windowed 18:00-20:00Z on the same service_date, so neither overlaps R1 in time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-CAP3", name: "Capped Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 3 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-C1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_id}", crew_id: "${crew_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T15:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r1_id: $.data.id }
            - call: "POST /crr/routes/${r1_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_id}", crew_id: "${crew_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T18:00:00Z", window_end_utc: "2026-08-03T20:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r2_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_id}", crew_id: "${crew_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T18:00:00Z", window_end_utc: "2026-08-03T20:00:00Z", planned_slots: 1 }
              as: CanvassCoordinator
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /crr/routes/${r2_id}/publish"
              payload: {}
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /crr/routes/${r3_id}/publish"
              payload: {}
              as: CanvassCoordinator
          assert:
            - "the R2 publish returns 409 with response.error_id == ERR_ZONE_DAILY_CAP_EXCEEDED"
            - "CanvassRoute.${r2_id}.status == PLANNED"
            - "the R3 publish returns 200 and CanvassRoute.${r3_id}.status == PUBLISHED"
            - "CanvassRoute.${r1_id}.status == PUBLISHED"
            - "RiskZone.${z_id}.daily_visit_cap == 3"
            - "RiskZone.${z_id}.assessment_status == TARGETED"

  - rule_id: compensating_invariant
    instances:
      - name: device_units_conserved_when_a_reserved_installation_is_voided
        grounds:
          - entities.DeviceLot.fields.on_hand_qty
          - entities.DeviceLot.fields.reserved_qty
          - entities.DeviceLot.fields.consumed_qty
          - state_machines.AlarmInstallation.RESERVED_to_VOIDED
          - endpoints[POST /crr/installations/{id}/void]
        distinguishing_aspect: |
          Conserved quantity: physical device units, expressed as
          on_hand_qty + consumed_qty == received_qty with reserved_qty a subset of on_hand_qty.
          Reserving earmarked one of the 10 on-hand units; voiding from RESERVED must release exactly
          that earmark, leaving the lot at on_hand 10 / reserved 0 / consumed 0 and status AVAILABLE.
          No money leaves the grant beyond the reservation release.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One TIER_2 zone, one crew, one ACTIVE UNIT_RATE grant authorised at 500000 cents and one smoke lot with received_qty 10 at 1850 cents."
            - "One household arrived at, then one SMOKE_10YR installation reserved, so the lot reads on_hand 10 / reserved 1 / consumed 0 (reserved units remain part of on_hand until commit) and the grant reads reserved 1921 / available 498079."
            - "The visit is deliberately left mid-flight (install_status SURVEYED) so the installation is still RESERVED, not committed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_b_id: $.data.id, z_b_v0: $.data.version }
            - call: "POST /crr/zones/${z_b_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_b_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_b_id: $.data.id }
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "ops@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p1_id}", grant_code: "G-UNIT-1", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { g1_id: $.data.id }
            - call: "POST /crr/grants/${g1_id}/activate"
              payload: {}
              as: GrantOfficer
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${g1_id}", sku: "SMK-10Y-A", device_type: "SMOKE_10YR", unit_cost_cents: 1850, received_qty: 10, expiry_date: "2028-06-30" }
              as: GrantOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "8 Cedar Way", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh_c_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r_b_id: $.data.id }
            - call: "POST /crr/routes/${r_b_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/visits"
              payload: { household_id: "${hh_c_id}", route_id: "${r_b_id}", scheduled_start_utc: "2026-08-03T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v_c_id: $.data.id }
            - call: "POST /crr/visits/${v_c_id}/arrive"
              payload: { occupant_present: true, pre_existing_working_smoke_alarms: 1, pre_existing_working_co_alarms: 0 }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_c_id}", device_type: "SMOKE_10YR", placement_location: "SLEEPING_AREA", storey: 1, device_lot_id: "${lot_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /crr/installations/${i_id}/void"
              payload: { voided_reason: "DEVICE_DEFECT" }
              as: GrantOfficer
          assert:
            - "AlarmInstallation.${i_id}.status == VOIDED"
            - "AlarmInstallation.${i_id}.voided_reason == DEVICE_DEFECT"
            - "AlarmInstallation.${i_id}.voided_at == 2026-08-01T00:00:00Z"
            - "DeviceLot.${lot_id}.on_hand_qty == 10"
            - "DeviceLot.${lot_id}.reserved_qty == 0"
            - "DeviceLot.${lot_id}.consumed_qty == 0"
            - "DeviceLot.${lot_id}.on_hand_qty + DeviceLot.${lot_id}.consumed_qty == DeviceLot.${lot_id}.received_qty and DeviceLot.${lot_id}.reserved_qty == 0"
            - "DeviceLot.${lot_id}.status == AVAILABLE"
            - "PartnerGrant.${g1_id}.reserved_cents == 0"
            - "PartnerGrant.${g1_id}.available_cents == 500000"
            - "HomeSafetyVisit.${v_c_id}.install_status == SURVEYED"

      - name: grant_money_conserved_when_a_committed_installation_is_voided
        grounds:
          - entities.PartnerGrant.fields.reserved_cents
          - entities.PartnerGrant.fields.committed_cents
          - entities.PartnerGrant.fields.available_cents
          - state_machines.AlarmInstallation.INSTALLED_to_VOIDED
          - calculations.installation_reimbursement
        distinguishing_aspect: |
          A different conserved quantity - grant money, expressed as
          reserved_cents + committed_cents + available_cents == authorized_cents - and a longer path:
          the 1921 cents travel available -> reserved (reservation) -> committed (the completion
          cascade) and must land back in available in full when the INSTALLED row is voided, with
          committed_cents returning to 0 and no residue in reserved_cents. The unit leg follows a
          second path: on_hand 10 -> 9 at commit and back to 10 on the void.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One TIER_2 zone, one crew, one ACTIVE UNIT_RATE grant authorised at 500000 cents and one smoke lot with received_qty 10 at 1850 cents."
            - "One household of 1 sleeping area / 1 storey arrived at with 1 pre-existing working smoke alarm, so a single installation satisfies the required coverage of 2."
            - "The visit is completed with install_outcome COMPLETE, so the installation is INSTALLED and the money has moved from reserved 1921 to committed 1921 with available 498079."
            - "No grant report has been compiled, so nothing is frozen against the installation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_b_id: $.data.id, z_b_v0: $.data.version }
            - call: "POST /crr/zones/${z_b_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_b_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_b_id: $.data.id }
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "ops@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p1_id}", grant_code: "G-UNIT-1", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { g1_id: $.data.id }
            - call: "POST /crr/grants/${g1_id}/activate"
              payload: {}
              as: GrantOfficer
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${g1_id}", sku: "SMK-10Y-A", device_type: "SMOKE_10YR", unit_cost_cents: 1850, received_qty: 10, expiry_date: "2028-06-30" }
              as: GrantOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "8 Cedar Way", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh_c_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r_b_id: $.data.id }
            - call: "POST /crr/routes/${r_b_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/visits"
              payload: { household_id: "${hh_c_id}", route_id: "${r_b_id}", scheduled_start_utc: "2026-08-03T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v_c_id: $.data.id }
            - call: "POST /crr/visits/${v_c_id}/arrive"
              payload: { occupant_present: true, pre_existing_working_smoke_alarms: 1, pre_existing_working_co_alarms: 0 }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_c_id}", device_type: "SMOKE_10YR", placement_location: "SLEEPING_AREA", storey: 1, device_lot_id: "${lot_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i_id: $.data.id }
            - call: "POST /crr/visits/${v_c_id}/education"
              payload: { education_outcome: "DELIVERED", topics_covered: ["ALARM_TESTING"], escape_plan_walkthrough: true }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/visits/${v_c_id}/complete"
              payload: { install_outcome: "COMPLETE", occupant_signature_name: "L. Osei" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
          trigger:
            - call: "POST /crr/installations/${i_id}/void"
              payload: { voided_reason: "WRONG_PLACEMENT" }
              as: GrantOfficer
          assert:
            - "AlarmInstallation.${i_id}.status == VOIDED"
            - "AlarmInstallation.${i_id}.voided_reason == WRONG_PLACEMENT"
            - "AlarmInstallation.${i_id}.reimbursable_cents == 1921"
            - "PartnerGrant.${g1_id}.reserved_cents == 0"
            - "PartnerGrant.${g1_id}.committed_cents == 0"
            - "PartnerGrant.${g1_id}.available_cents == 500000"
            - "PartnerGrant.${g1_id}.reserved_cents + PartnerGrant.${g1_id}.committed_cents + PartnerGrant.${g1_id}.available_cents == PartnerGrant.${g1_id}.authorized_cents"
            - "DeviceLot.${lot_id}.on_hand_qty == 10"
            - "DeviceLot.${lot_id}.consumed_qty == 0"
            - "DeviceLot.${lot_id}.reserved_qty == 0"
            - "HomeSafetyVisit.${v_c_id}.install_status == INSTALL_COMPLETE"
            - "HomeSafetyVisit.${v_c_id}.visit_status == COMPLETED"
