    - validations[priority=22]
    - calculations.cold_ischemia_time
    distinguishing_aspect: 'The per-segment rung fires first and alone: whole_minutes(23:16 - 06:00) =
      1036 plus CROSS_MATCH_HOLD_MINUTES 45 gives 1081, one minute over MAX_CIT_MINUTES 1080, while the
      chain budget of 2400 is nowhere near breached.'
