        distinguishing_aspect: |
          A PSU grant well inside a 100000-share delegation is still refused with
          ERR_DELEGATED_APPROVAL_BLOCKED because priority 56 runs before the delegation caps at
          68 and 70; the same grant approved through the BOARD path succeeds, proving the block
          attaches to the path rather than to the headroom.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; ACTIVE participant; CERTIFIED-independent PSU grant of 900 shares in PENDING_APPROVAL."
            - "ApprovalAuthority to officer-1 effective 2026-01-01..2026-12-31 with per_grant_share_cap 100000 and aggregate_share_cap 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
