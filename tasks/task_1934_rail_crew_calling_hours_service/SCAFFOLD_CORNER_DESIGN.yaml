        distinguishing_aspect: "Employee role with X-User-ID = E1 calling POST /api/employees/{E2}/lay-off -> ERR_NOT_RESOURCE_OWNER (403) — entity-backed identity check."
        test_recipe:
          setup: ["E1 and E2 exist, both AVAILABLE"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0301", full_name: "Owner Olga", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
