  # ============================================================ 3. Calculations
  - section: calculations
    instances:
      - name: deposit_floor_applies_below_percentage
        claim_type: constants_applied
        grounds: [calculations.preorder_deposit_calc, entities.MerchProgram.fields.deposit_floor_cents]
        distinguishing_aspect: "Price 1000 x qty 1 x 0.4 = 400 is below the 500 floor, so deposit_due_cents is exactly 500 and balance_due_cents exactly 500 — the max() constant, not the percentage, governs."
        test_recipe:
          setup: ["Program ACTIVE (floor 500); design APPROVED; variant M; campaign OPEN price 1000 deposit_pct 0.4 goal 1"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
