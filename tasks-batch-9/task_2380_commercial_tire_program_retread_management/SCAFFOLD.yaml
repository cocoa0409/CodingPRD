  # ---------------- Casing ----------------
  - method: POST
    path: "/casings"
    description: "Registers a casing (carcass) owned by a fleet, spec'd for one position class. intended_position plus fleet_account_id is the sole key used to resolve the governing TirePolicy for grading, retread candidacy and credit."
    roles: [DealerAdmin, TireTechnician]
    code: 201
    input: [fleet_account_id, casing_serial, brand, casing_spec_code, intended_position, scrap_weight_lbs, "retread_count?"]
    output: Casing
    side_effects: ["status defaults to ON_WHEEL", "casing_serial is globally unique"]

  - method: POST
    path: "/casings/{casing_id}/collect"
    description: "Records physical collection of a casing into a location's holding area."
    roles: [TireTechnician]
    code: 200
    input: [collected_at_location_id]
    output: Casing
    side_effects: ["Casing ON_WHEEL -> COLLECTED", "recomputes ServiceLocation.casings_in_holding_count", "increments Casing.version by 1"]

  - method: POST
    path: "/casings/{casing_id}/inspect"
    description: "Records a casing inspection grade. Grades A/B/C make the casing retread-eligible and accrue provisional casing credit; REJECT sends it to the scrap path with no accrual. Re-grading an already-INSPECTED casing supersedes the prior grade, so the request must carry the casing version the client observed (§1.2.1 casing-inspect-supersede)."
    roles: [CasingInspector]
    code: 200
    input: [grade, expected_casing_version]
    output: Casing
    side_effects:
      - "COLLECTED + grade IN {A,B,C} -> INSPECTED, posts an ACCRUAL CasingCreditEntry per calculations.casing_credit_accrual variant GRADE_PROVISIONAL"
      - "INSPECTED + grade IN {A,B,C} -> INSPECTED (supersede): posts a REVERSAL of the current provisional credit then a fresh ACCRUAL under the new grade"
      - "COLLECTED + grade == REJECT -> REJECTED with no ledger entry at all"
      - "sets inspected_by_user_id = X-User-ID (consumed by the scrap manifest segregation-of-duties check)"
      - "recomputes Casing.provisional_credit_cents and FleetAccount.casing_credit_balance_cents; increments FleetAccount.version by 1"
      - "increments Casing.version by 1"

  - method: POST
    path: "/casings/{casing_id}/reject"
    description: "Condemns an already-INSPECTED casing. The accrued credit is deliberately NOT reversed here; it stays on the fleet balance until the scrap manifest destruction is certified."
    roles: [CasingInspector]
    code: 200
    input: [rejection_reason]
    output: Casing
    side_effects: ["Casing INSPECTED -> REJECTED", "posts no ledger entry", "increments Casing.version by 1"]

  - method: GET
    path: "/casings/{casing_id}"
    description: "Reads one casing including inspection_grade, provisional_credit_cents and the OCC version."
    roles: [DealerAdmin, FleetManager, TireTechnician, CasingInspector, PlantScheduler, ComplianceOfficer]
    code: 200
    input: []
    output: Casing
    side_effects: []

  - method: GET
