        claim_type: role_exclusivity
        grounds:
          - roles.Developer.exclusive_operations
          - roles.HfaAllocationOfficer.exclusive_operations
          - roles.HfaComplianceOfficer.exclusive_operations
          - roles.BondTrustee.exclusive_operations
          - roles.SystemOperator
          - errors[ERR_FORBIDDEN_ROLE]
          - endpoints[POST /volume-cap-allocations/{id}/decision].roles
          - endpoints[POST /regulatory-agreements/{id}/record].roles
        distinguishing_aspect: |
          A cross-product denial sweep: the sponsor reaches for the award that only
          the allocation officer may sign, the trustee reaches for the covenant
          recording that only the compliance officer may sign, the allocation
          officer reaches for the sanction that belongs to compliance, and the
          compliance officer reaches for the clock. The two most interesting cells
          are the SystemOperator, whose shared_operations list is empty so even a
          plain project read is forbidden, and the BondTrustee, whose read surface
          deliberately omits the compliance families. The sweep closes with the
          rightful officer performing the very award that was just refused, proving
          the refusals left no partial state and are role-scoped rather than
          state-scoped.
