  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [MATCHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: POST /purchase-orders/{id}/send
        actor: AgencyOps
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "vendor.status == ACTIVE (else ERR_VENDOR_SUSPENDED)"
        side_effects: []
      - from: SENT
        to: ACKNOWLEDGED
        trigger: POST /purchase-orders/{id}/acknowledge
        actor: VendorRep
        preconditions:
          - "status == SENT (else ERR_INVALID_STATE)"
          - "X-User-ID == vendor_id of the order (else ERR_NOT_RESOURCE_OWNER)"
          - "vendor.status == ACTIVE (else ERR_VENDOR_SUSPENDED)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: DELIVERED
        trigger: POST /purchase-orders/{id}/deliver
        actor: VendorRep
        preconditions:
          - "status == ACKNOWLEDGED (else ERR_INVALID_STATE)"
          - "X-User-ID == vendor_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: DELIVERED
        to: INVOICED
        trigger: POST /purchase-orders/{id}/invoice
        actor: VendorRep
        preconditions:
          - "status == DELIVERED (else ERR_INVALID_STATE)"
          - "X-User-ID == vendor_id (else ERR_NOT_RESOURCE_OWNER)"
          - "abs(variance_pct) <= 10.0 routes to INVOICED; abs(variance_pct) > 10.0 routes to DISPUTED instead (this branch target is the divergent fork)"
        side_effects:
          - "invoiced_cents = payload.invoiced_cents; variance_pct recomputed"
          - "DALine mirror actual_cents = invoiced_cents, status -> ACTUALIZED; DA totals recomputed via da_totals_calc when DA editable"
      - from: DELIVERED
        to: DISPUTED
        trigger: POST /purchase-orders/{id}/invoice
        actor: VendorRep
        preconditions: ["abs(variance_pct) > 10.0 (computed on the submitted invoiced_cents)"]
        side_effects:
          - "invoiced_cents and variance_pct stored exactly as in the INVOICED branch"
          - "Cascade link 1 (of invoice trigger): this PO -> DISPUTED"
          - "Cascade link 2: DALine mirror status -> DISPUTED (actual_cents still recorded)"
          - "Cascade link 3: DA totals recomputed; when DA.status == FINAL it flips to DISPUTED"
      - from: DISPUTED
        to: INVOICED
        trigger: POST /purchase-orders/{id}/reinvoice
        actor: VendorRep
        preconditions:
          - "status == DISPUTED (else ERR_INVALID_STATE)"
          - "X-User-ID == vendor_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "invoiced_cents = payload.invoiced_cents; variance_pct recomputed; DALine mirror updated to ACTUALIZED with new actual; DA totals recomputed when editable"
      - from: INVOICED
        to: MATCHED
        trigger: POST /purchase-orders/{id}/match
        actor: AgencyFinance
        preconditions:
          - "status == INVOICED (else ERR_INVALID_STATE)"
          - "abs(variance_pct) <= 10.0 routes to MATCHED; abs(variance_pct) > 10.0 routes back to DISPUTED (fork; not an error)"
        side_effects: []
      - from: INVOICED
        to: DISPUTED
        trigger: POST /purchase-orders/{id}/match
        actor: AgencyFinance
        preconditions: ["abs(variance_pct) > 10.0"]
        side_effects: ["DALine mirror status -> DISPUTED; DA totals recomputed; when DA.status == FINAL it flips to DISPUTED"]
      - from: DRAFT
        to: CANCELLED
        trigger: POST /purchase-orders/{id}/cancel OR system via PortCall cancel cascade
        actor: AgencyOps
        preconditions: ["status in {DRAFT, SENT, ACKNOWLEDGED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "DALine mirror reversal: estimated_cents -> 0; DA totals recomputed via da_totals_calc when DA editable"
      - from: SENT
        to: CANCELLED
        trigger: POST /purchase-orders/{id}/cancel OR system via PortCall cancel cascade
        actor: AgencyOps
        preconditions: ["status in {DRAFT, SENT, ACKNOWLEDGED} (else ERR_INVALID_STATE)"]
        side_effects: ["as DRAFT -> CANCELLED"]
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: POST /purchase-orders/{id}/cancel OR system via PortCall cancel cascade
        actor: AgencyOps
        preconditions: ["status in {DRAFT, SENT, ACKNOWLEDGED} (else ERR_INVALID_STATE)"]
        side_effects: ["as DRAFT -> CANCELLED"]

