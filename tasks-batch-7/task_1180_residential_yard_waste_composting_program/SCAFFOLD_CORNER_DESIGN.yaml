            - { call: "POST /surge-events", payload: { zone_id: "${zone_u}", event_type: "LEAF_SURGE", service_date: "2026-11-07", capacity_slots: 5, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-11-01T00:00:00Z" }, as: ProgramAdmin, captures: { ev: $.data.id, ev_st1: $.data.status, ev_v: $.data.version } }
