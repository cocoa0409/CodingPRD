              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/claims/${claim_id}/transition"
              payload: { action: "APPROVE" }
              as: Insurer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # priority 5 state beats priority 16 business_fiscal"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: attendance_tier_boundary_10000_vs_10001
        grounds:
          - calculations.participation_fee
          - validations[priority=17]
        distinguishing_aspect: |
          Boundary on attendance metric via the contract SEND endpoint: at
          projected_attendance == 10000 the tier1 (0% uplift) applies; at 10001
          tier2 (10% uplift) applies. >= vs > on the tier threshold is exact.
        test_recipe:
          setup:
            - "Two stops on the same tour, one projected_attendance=10000, one 10001, identical base fees 2000000 and zero credit"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Boundary", exhibit_code: "BNDY-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 0 }
