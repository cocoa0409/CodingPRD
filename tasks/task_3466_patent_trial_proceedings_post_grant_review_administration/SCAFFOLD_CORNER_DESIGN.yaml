# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3466_patent_trial_proceedings_post_grant_review_administration
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# covers appear as `excluded_because:` stubs with no test_recipe.
# Logical clock default 2026-09-01T00:00:00Z; every recipe sets it explicitly.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: party_creation_returns_declared_fields_and_version_1
        claim_type: Creation
        grounds:
          - entities.Party
          - endpoints.POST_/ptab/parties
        distinguishing_aspect: "A party created with only name and party_type returns 201 with a server-minted UUID id, created_at equal to the logical clock, updated_at equal to created_at, version == 1, and counsel_firm null — status-like fields are never client-supplied because Party has none."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ptab/parties"
              payload: { name: "Acme IP Holdings", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { c_party_id: $.data.id, c_created: $.data.created_at, c_updated: $.data.updated_at, c_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Party.${c_party_id}.name == \"Acme IP Holdings\" and party_type == PATENT_OWNER and counsel_firm is null"
            - "created_at == 2026-09-01T00:00:00Z and updated_at == created_at and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: patent_retrieval_round_trips_all_declared_fields
        claim_type: Retrieval
        grounds:
          - entities.Patent
          - endpoints.GET_/ptab/patents/{patentId}
        distinguishing_aspect: "Every stored patent field round-trips through GET exactly as posted, with computed claims fields initialized from total_claims."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Owner party exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "Roundtrip Owner LLC", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { rt_owner_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000999", title: "Roundtrip Gear", issue_date: "2016-04-15T00:00:00Z", owner_id: "${rt_owner_id}", total_claims: 7 }
              as: PlatformAdmin
              captures: { rt_pat_id: $.data.id }
          trigger:
            - call: "GET /ptab/patents/${rt_pat_id}"
              payload: {}
              as: BoardPanel
          assert:
            - "the response status is 200"
            - "Patent.${rt_pat_id}.patent_number == \"US10000999\" and title == \"Roundtrip Gear\" and issue_date == 2016-04-15T00:00:00Z"
            - "Patent.${rt_pat_id}.status == ISSUED with claims_alive == 7, claims_cancelled_count == 0, claims_amended_count == 0, total_claims == 7"

      - name: petitions_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/ptab/petitions
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three petitions on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Petitioner PC and owner OC exist; three patents, each with one petition by PC (all FILED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PC Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OC Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { oc_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001001", title: "Petal A", issue_date: "2019-01-01T00:00:00Z", owner_id: "${oc_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pc_pat1: $.data.id, pc_pat1_v: $.data.version }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001002", title: "Petal B", issue_date: "2019-01-01T00:00:00Z", owner_id: "${oc_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pc_pat2: $.data.id, pc_pat2_v: $.data.version }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001003", title: "Petal C", issue_date: "2019-01-01T00:00:00Z", owner_id: "${oc_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pc_pat3: $.data.id, pc_pat3_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pc_pat1}", petitioner_id: "${pc_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US3000001" }], real_party_in_interest: "PC Corp", fee_paid_cents: 1900000, expected_patent_version: "${pc_pat1_v}" }
              as: Petitioner
              as_user_id: "${pc_id}"
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pc_pat2}", petitioner_id: "${pc_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US3000002" }], real_party_in_interest: "PC Corp", fee_paid_cents: 1900000, expected_patent_version: "${pc_pat2_v}" }
              as: Petitioner
              as_user_id: "${pc_id}"
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pc_pat3}", petitioner_id: "${pc_id}", review_type: "PGR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "PUBLIC_USE" }], prior_art: [{ reference_type: "PRODUCT", citation: "Model X sold 2018" }], real_party_in_interest: "PC Corp", fee_paid_cents: 1900000, expected_patent_version: "${pc_pat3_v}" }
              as: Petitioner
              as_user_id: "${pc_id}"
          trigger:
            - call: "GET /ptab/petitions"
              payload: { petitioner_id: "${pc_id}", limit: 2, offset: 0 }
              as: BoardPanel
              captures: { pg1: $.data }
          assert:
            - "page 1 returns exactly 2 data rows with total_count == 3 and has_more == true"
            - "GET with limit 2 and offset 2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "omitting limit/offset applies the envelope defaults (limit 10, offset 0) and returns all 3 rows with has_more == false"

      - name: petition_get_with_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/ptab/petitions/{petitionId}
          - errors[ERR_PETITION_NOT_FOUND]
        distinguishing_aspect: "A GET against a well-formed but non-existent petition id returns the typed 404, not a generic 400 or 500."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /ptab/petitions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardPanel
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PETITION_NOT_FOUND"

      - name: patent_create_missing_total_claims_rejected
        claim_type: Required Fields
        grounds:
          - entities.Patent.fields.total_claims
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "total_claims has no default and source input: omitting it fails schema validation with 400 before any state or business check."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Owner party exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "Schema Owner LLC", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { sc_owner_id: $.data.id }
          trigger:
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001010", title: "No Claims", issue_date: "2020-01-01T00:00:00Z", owner_id: "${sc_owner_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_VALIDATION"

      - name: oral_hearing_argument_minutes_defaults_to_60
        claim_type: Defaults
        grounds:
          - entities.OralHearing.fields.argument_minutes
        distinguishing_aspect: "Omitting argument_minutes on the hearing request applies the declared default 60; an explicit value overrides it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties PD/OD, patent (2 claims), petition by PD INSTITUTED (judge-rick)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PD Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pd_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OD Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { od_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001011", title: "Dial", issue_date: "2019-09-01T00:00:00Z", owner_id: "${od_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pd_pat: $.data.id, pd_pat_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pd_pat}", petitioner_id: "${pd_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US3000011" }], real_party_in_interest: "PD Corp", fee_paid_cents: 1900000, expected_patent_version: "${pd_pat_v}" }
              as: Petitioner
              as_user_id: "${pd_id}"
              captures: { pd_pet: $.data.id }
            - call: "POST /ptab/petitions/${pd_pet}/accord-filing-date"
              payload: {}
              as: BoardPanel
            - call: "POST /ptab/petitions/${pd_pet}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 65 }], lead_judge_user_id: "judge-rick" }
              as: BoardPanel
              captures: { pd_proc: $.data.proceeding_id }
          trigger:
            - call: "POST /ptab/proceedings/${pd_proc}/oral-hearings"
              payload: {}
              as: Petitioner
              as_user_id: "${pd_id}"
              captures: { pd_oh: $.data.id, pd_oh_min: $.data.argument_minutes }
          assert:
            - "the hearing is created 201 with argument_minutes == 60 (default applied)"
            - "OralHearing.${pd_oh}.status == REQUESTED and hearing_room_id is null and start_at is null and end_at is null"

      - name: institution_decision_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.InstitutionDecision
        distinguishing_aspect: "InstitutionDecision is common_fields: false — the record exposes id and created_at but no version or updated_at, and no endpoint exists to mutate it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties PE/OE, patent (2 claims), petition by PE accorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PE Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OE Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { oe_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001012", title: "Gauge", issue_date: "2018-01-01T00:00:00Z", owner_id: "${oe_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pe_pat: $.data.id, pe_pat_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pe_pat}", petitioner_id: "${pe_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "OBVIOUSNESS_103" }], prior_art: [{ reference_type: "PRINTED_PUBLICATION", citation: "Nature 2017" }], real_party_in_interest: "PE Corp", fee_paid_cents: 1900000, expected_patent_version: "${pe_pat_v}" }
              as: Petitioner
              as_user_id: "${pe_id}"
              captures: { pe_pet: $.data.id }
            - call: "POST /ptab/petitions/${pe_pet}/accord-filing-date"
              payload: {}
              as: BoardPanel
          trigger:
            - call: "POST /ptab/petitions/${pe_pet}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "OBVIOUSNESS_103", score: 55 }], lead_judge_user_id: "judge-sara" }
              as: BoardPanel
              captures: { pe_dec: $.data.decision_id }
            - call: "GET /ptab/petitions/${pe_pet}/institution-decision"
              payload: {}
              as: BoardPanel
              captures: { dec0_id: "$.data[0].id" }
          assert:
            - "the institution-decision sub-resource returns an array of length 1 with id == ${pe_dec}"
            - "the decision object carries id and created_at but has NO version field and NO updated_at field"
            - "decided_at == 2026-09-01T00:00:00Z (the logical clock), outcome == INSTITUTED, threshold_used == 40"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: accord_filing_date_stamps_accorded_date_from_logical_clock
        claim_type: Valid Transition
        grounds:
          - state_machines.Petition.transitions.FILED_to_NOTICE_ACCORDED
          - entities.Petition.fields.accorded_date
        distinguishing_aspect: "A successful accord moves FILED -> NOTICE_ACCORDED and stamps accorded_date with the current logical clock (not wall-clock), starting the 93-day institution window."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties PF/OF, patent (2 claims), petition by PF in FILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PF Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OF Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { of_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001013", title: "Hinge", issue_date: "2020-08-01T00:00:00Z", owner_id: "${of_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pf_pat: $.data.id, pf_pat_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pf_pat}", petitioner_id: "${pf_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US3000013" }], real_party_in_interest: "PF Corp", fee_paid_cents: 1900000, expected_patent_version: "${pf_pat_v}" }
              as: Petitioner
              as_user_id: "${pf_id}"
              captures: { pf_pet: $.data.id, pf_pet_status: $.data.status, pf_pet_filed: $.data.filing_date }
          trigger:
            - call: "POST /ptab/petitions/${pf_pet}/accord-filing-date"
              payload: {}
              as: BoardPanel
              captures: { pf_status: $.data.status, pf_accorded: $.data.accorded_date }
          assert:
            - "initial petition status == FILED and filing_date == 2026-09-01T00:00:00Z (initial state and clock-stamped receipt)"
            - "after accord: status == NOTICE_ACCORDED and accorded_date == 2026-09-01T00:00:00Z"

      - name: accord_on_already_accorded_petition_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Petition.transitions.FILED_to_NOTICE_ACCORDED
          - errors[ERR_PETITION_WRONG_STATE]
        distinguishing_aspect: "Repeating the same accord trigger after it succeeded is not a silent no-op: the second call is rejected because the petition left FILED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties PG/OG, patent (2 claims), petition by PG already NOTICE_ACCORDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PG Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OG Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { og_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001014", title: "Latch", issue_date: "2020-08-01T00:00:00Z", owner_id: "${og_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pg_pat: $.data.id, pg_pat_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pg_pat}", petitioner_id: "${pg_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US3000014" }], real_party_in_interest: "PG Corp", fee_paid_cents: 1900000, expected_patent_version: "${pg_pat_v}" }
              as: Petitioner
              as_user_id: "${pg_id}"
              captures: { pg_pet: $.data.id }
            - call: "POST /ptab/petitions/${pg_pet}/accord-filing-date"
              payload: {}
              as: BoardPanel
          trigger:
            - call: "POST /ptab/petitions/${pg_pet}/accord-filing-date"
              payload: {}
              as: BoardPanel
              captures: { err: $.data.error_id }
          assert:
            - "the second accord is rejected 409 with error_id == ERR_PETITION_WRONG_STATE"

      - name: decide_institution_before_accord_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Petition.transitions.NOTICE_ACCORDED_to_INSTITUTED
          - errors[ERR_PETITION_WRONG_STATE]
        distinguishing_aspect: "decide-institution on a FILED (never accorded) petition is rejected; the institution window has not even started because accorded_date is null."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties PH/OH, patent (2 claims), petition by PH in FILED (never accorded)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PH Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OH Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { oh_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001015", title: "Rivet", issue_date: "2020-08-01T00:00:00Z", owner_id: "${oh_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { ph_pat: $.data.id, ph_pat_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${ph_pat}", petitioner_id: "${ph_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US3000015" }], real_party_in_interest: "PH Corp", fee_paid_cents: 1900000, expected_patent_version: "${ph_pat_v}" }
              as: Petitioner
              as_user_id: "${ph_id}"
              captures: { ph_pet: $.data.id }
          trigger:
            - call: "POST /ptab/petitions/${ph_pet}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 80 }], lead_judge_user_id: "judge-tess" }
              as: BoardPanel
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PETITION_WRONG_STATE"
            - "Petition.${ph_pet}.status remains FILED and no Proceeding is created"

      - name: litigation_matter_terminal_states_lock_further_patches
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LitigationMatter
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once a matter reaches SETTLED (a terminal state), any further PATCH — including a legitimate-looking stay — is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties PI/OI, patent (2 claims), matter MI (defendant PI) patched to SETTLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PI Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OI Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { oi_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001016", title: "Clamp", issue_date: "2020-08-01T00:00:00Z", owner_id: "${oi_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pi_pat: $.data.id }
            - call: "POST /ptab/patents/${pi_pat}/litigation-matters"
              payload: { defendant_party_id: "${pi_id}", court_name: "N.D. Cal.", docket_number: "3:25-cv-00999", complaint_served_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pi_m: $.data.id, pi_m_v: $.data.version }
            - call: "PATCH /ptab/litigation-matters/${pi_m}"
              payload: { status: "SETTLED", expected_litigation_matter_version: "${pi_m_v}" }
              as: PlatformAdmin
              captures: { pi_m_v2: $.data.version }
          trigger:
            - call: "PATCH /ptab/litigation-matters/${pi_m}"
              payload: { status: "STAYED", expected_litigation_matter_version: "${pi_m_v2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE (terminal SETTLED admits no transitions)"
            - "LitigationMatter.${pi_m}.status remains SETTLED"

      - name: denied_petition_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
