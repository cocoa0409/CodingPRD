        excluded_because:
          difficulty_instance: admission_billable_nights_projected_versus_chronological_actual
          rationale: "That difficulty instance already pins both variants on one stay - forward_projected 7 at admission and chronological_actual 8 at a 15:00Z discharge - plus the reconciliation of the delta into Youth.cumulative_shelter_nights. A corner instance would re-run the identical two calls."

      - name: trafficking_risk_score_variants_diverge_once_a_contact_ages
