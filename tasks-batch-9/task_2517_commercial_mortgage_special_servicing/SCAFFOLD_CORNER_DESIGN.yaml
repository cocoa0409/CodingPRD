          assert:
            - "Probe 1 returns HTTP 422 with data.error_id == ERR_SUBJECT_REFERENCE_MISMATCH — both trust_q_id and plan_id exist, but the plan's loan belongs to trust P"
            - "WorkoutPlan.${plan_id}.status is still RECOMMENDED after the refusal: the RECOMMENDED -> CONSULTATION side effect did not fire"
            - "Probe 2 returns HTTP 201 with rights_type CONSENT_RIGHT, status PENDING and trust_id ${trust_p_id}"
            - "WorkoutPlan.${plan_id}.status is CONSULTATION after probe 2 and consent_requirement == CONSENT_RIGHT"

  - section: state_machines
    instances:
      - name: loan_master_servicing_to_special_servicing_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Loan.MASTER_SERVICING_to_SPECIAL_SERVICING
          - endpoints[POST /special-servicing/loans/{id}/servicing-status]
        distinguishing_aspect: "The declared trigger moves the loan's servicing dimension one step and leaves the payment dimension alone; the response is the updated Loan with version incremented by exactly one."
        test_recipe:
          setup:
            - "One loan in MASTER_SERVICING with one qualifying RECEIVERSHIP event."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id", version_before: "$.data.version" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "RECEIVERSHIP", occurred_on: "2026-07-10T00:00:00Z", evidence_note: "receiver appointed over the property" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { event_id: "$.data.id", triggers: "$.data.triggers_transfer" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING", note: "transferred on receivership" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { status_after: "$.data.servicing_status", version_after: "$.data.version" }
          assert:
            - "HTTP 200 with data.servicing_status == SPECIAL_SERVICING"
            - "data.version == 2 — exactly one increment over the version 1 read before the call"
            - "data.payment_status is still CURRENT: the servicing transition does not touch the payment dimension"
            - "data.transfer_event_code == RECEIVERSHIP"

      - name: loan_transfer_without_qualifying_event_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Loan.MASTER_SERVICING_to_SPECIAL_SERVICING
          - validations[priority=24]
          - calculations.transfer_event_qualification
          - errors.ERR_NO_QUALIFYING_TRANSFER_EVENT
        distinguishing_aspect: "An OTHER_MATERIAL_DEFAULT event exists on the loan, so the naive 'has an event' reading would let the transfer through; qualification is decided by triggers_transfer, which that code always sets false, and an IMMINENT_DEFAULT event without imminent_default_certified is equally inert."
        test_recipe:
          setup:
            - "One loan in MASTER_SERVICING carrying two non-qualifying events: OTHER_MATERIAL_DEFAULT, and IMMINENT_DEFAULT with imminent_default_certified false."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V2", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V02", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "OTHER_MATERIAL_DEFAULT", occurred_on: "2026-07-05T00:00:00Z", evidence_note: "deferred maintenance covenant breach" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { other_event_triggers: "$.data.triggers_transfer" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "IMMINENT_DEFAULT", occurred_on: "2026-07-06T00:00:00Z", evidence_note: "borrower letter, not yet certified", imminent_default_certified: false }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { imminent_event_triggers: "$.data.triggers_transfer" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { no_event_error: "$.data.error_id" }
          assert:
            - "Both events were created with HTTP 201 and triggers_transfer == false"
            - "The transfer returns HTTP 422 with data.error_id == ERR_NO_QUALIFYING_TRANSFER_EVENT"
            - "Loan.${loan_id}.servicing_status is still MASTER_SERVICING with transferred_to_special_on null and asset_business_plan_due_date null"
            - "Trust.${trust_id}.loans_in_special_servicing_count is still 0"

      - name: loan_transfer_side_effects_write_dates_and_trust_counter
        claim_type: side_effect_execution
        grounds:
          - state_machines.Loan.MASTER_SERVICING_to_SPECIAL_SERVICING
          - entities.Loan.fields.asset_business_plan_due_date
          - entities.Trust.fields.loans_in_special_servicing_count
        distinguishing_aspect: "All five declared side effects are checked in one shot: the earliest qualifying event is the one consumed (two qualifying events exist, and the one with the earlier occurred_on must be picked, never the later or a random one), the two dates are written from the clock, and the trust counter and version move."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One loan carrying two qualifying events: BANKRUPTCY occurred_on 2026-07-01 and RECEIVERSHIP occurred_on 2026-07-20."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V3", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", trust_version_before: "$.data.version" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V03", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "RECEIVERSHIP", occurred_on: "2026-07-20T00:00:00Z", evidence_note: "receiver appointed" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { later_event_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { earlier_event_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { code_after: "$.data.transfer_event_code", transferred_on: "$.data.transferred_to_special_on", abp_due: "$.data.asset_business_plan_due_date" }
            - call: "GET /special-servicing/loans/${loan_id}/transfer-events"
              payload: { event_code: "BANKRUPTCY" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { bankruptcy_consumed: "$.data[0].consumed_by_transfer" }
            - call: "GET /special-servicing/loans/${loan_id}/transfer-events"
              payload: { event_code: "RECEIVERSHIP" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { receivership_consumed: "$.data[0].consumed_by_transfer" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { ss_count: "$.data.loans_in_special_servicing_count", trust_version_after: "$.data.version" }
          assert:
            - "data.transfer_event_code == BANKRUPTCY — the earliest occurred_on among the qualifying unconsumed events, even though RECEIVERSHIP was recorded first"
            - "The BANKRUPTCY event has consumed_by_transfer == true and the RECEIVERSHIP event still has consumed_by_transfer == false"
            - "data.transferred_to_special_on == 2026-08-01T00:00:00Z (the logical clock, not occurred_on)"
            - "data.asset_business_plan_due_date == 2026-09-30T00:00:00Z — transferred_to_special_on plus 60 calendar days"
            - "Trust.${trust_id}.loans_in_special_servicing_count == 1 and Trust.version incremented from 1 to 2"

      - name: appraisal_accepted_directly_from_ordered_is_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.Appraisal
          - validations[priority=8]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "ORDERED -> ACCEPTED is not a declared pair, so the state gate at priority 8 refuses it before the segregation-of-duties check at priority 10 could ever apply; the appraisal must pass through RECEIVED where value_usd and as_of_date are captured."
        test_recipe:
          setup:
            - "One loan in SPECIAL_SERVICING with an appraisal left in ORDERED."
          setup_api_calls:
