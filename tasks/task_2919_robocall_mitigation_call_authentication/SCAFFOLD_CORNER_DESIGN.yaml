            - "BlockingDispute.${dispute_one}.state == WITHDRAWN after the withdraw, and BlockingEvent.${evt_id}.status is still BLOCKED"
            - "The refiling is 201 with data.state == FILED, data.customer_id == ${cust_id} and resolution_deadline_at == 2026-08-19T00:00:00Z"
            - "GET /rmd/blocking-disputes?blocking_event_id=${evt_id} returns total_count == 2"
            - "Provider.${prov_id}.blocking_false_positive_rate == 0.0000 (no dispute has been reversed)"

  - section: rbac
    instances:
      - name: missing_or_unknown_role_headers_are_unauthenticated
        claim_type: authentication
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
          - roles.Regulator
        distinguishing_aspect: "Authentication is header shape only and runs before every other rule: an absent role, an empty-string role, an empty-string user id and a role outside the seven declared names all return 401 on an endpoint that would otherwise have succeeded."
        test_recipe:
          setup:
            - "Empty database; clock at a fixed instant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /rmd/providers"
              payload: { legal_name: "No Header Voice", provider_type: "FACILITIES_BASED" }
              as: ""
              as_user_id: "reg-1"
              expect: { status: 401, error_id: ERR_UNAUTHENTICATED }
            - call: "POST /rmd/providers"
              payload: { legal_name: "No User Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              as_user_id: ""
              expect: { status: 401, error_id: ERR_UNAUTHENTICATED }
            - call: "POST /rmd/providers"
              payload: { legal_name: "Bogus Role Voice", provider_type: "FACILITIES_BASED" }
              as: Auditor
              as_user_id: "aud-1"
              expect: { status: 401, error_id: ERR_UNAUTHENTICATED }
            - call: "GET /rmd/providers"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              expect: { status: 401, error_id: ERR_UNAUTHENTICATED }
          assert:
            - "All four calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The empty X-User-Role and the empty X-User-ID are both 401 - an empty string is not a valid header value, and neither is the undeclared role Auditor"
            - "Reading GET /rmd/providers as Regulator afterwards returns total_count == 0, so none of the refused writes landed"

      - name: each_role_is_unauthorized_on_another_roles_exclusive_operation
        claim_type: exclusive_operation
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - roles.PolicyAdministrator
        distinguishing_aspect: "Every one of the seven roles is refused 403 on an operation another role owns exclusively, including the Regulator - the regulator's breadth over reads and adjudication does not extend to certificate issuance, so there is no super-role fallback."
        test_recipe:
          setup:
            - "One provider with one customer, so the foreign attempts have real target rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Role Boundary Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id, prov_v0: $.data.version }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Boundary Co", contact_email: "ops@boundary.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-2401", public_key_fingerprint: "fp-2401", not_before: "2026-08-01T00:00:00Z", not_after: "2027-08-01T00:00:00Z" }
              as: Regulator
              expect: { status: 403, error_id: ERR_UNAUTHORIZED }
            - call: "POST /rmd/providers"
              payload: { legal_name: "Policy Admin Overreach Voice", provider_type: "GATEWAY" }
              as: PolicyAdministrator
              expect: { status: 403, error_id: ERR_UNAUTHORIZED }
            - call: "POST /rmd/blocking-events"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025552001", analytics_score: 0.9000, reason: "ANALYTICS_SCORE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              expect: { status: 403, error_id: ERR_UNAUTHORIZED }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "CONTRACT_TERMS_PROHIBITION"], expected_provider_version: "${prov_v0}" }
              as: KycAnalyst
              as_user_id: "kyc-1"
              expect: { status: 403, error_id: ERR_UNAUTHORIZED }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Fraud Analyst Overreach Co", contact_email: "ops@overreach.example", kyc_evidence_level: "SELF_ATTESTED" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              expect: { status: 403, error_id: ERR_UNAUTHORIZED }
            - call: "POST /rmd/enforcement-actions"
              payload: { provider_id: "${prov_id}", basis: "UNFILED_PLAN", violation_count: 1, violation_days: 1, assessment_basis: "PER_VIOLATION" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 403, error_id: ERR_UNAUTHORIZED }
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: Caller
              as_user_id: "${cust_id}"
              expect: { status: 403, error_id: ERR_UNAUTHORIZED }
          assert:
            - "All seven attempts return HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "No side effect landed: GET /rmd/certificates?provider_id=${prov_id}, GET /rmd/mitigation-plans?provider_id=${prov_id}, GET /rmd/blocking-events?provider_id=${prov_id} and GET /rmd/enforcement-actions?provider_id=${prov_id} all return total_count == 0"
            - "GET /rmd/providers as Regulator returns total_count == 1 and GET /rmd/customers?provider_id=${prov_id} returns total_count == 1"
            - "Customer.${cust_id}.kyc_state is still PENDING"

      - name: provider_admin_and_caller_are_forbidden_outside_their_own_rows
        claim_type: resource_ownership
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - roles.ProviderAdmin
          - roles.Caller
        distinguishing_aspect: "Ownership is identity-to-row, not role-to-endpoint: a ProviderAdmin holding provider B's id is refused 403 on provider A's number assignment even though the role is listed, and a Caller holding customer B's id is refused on a block recorded against customer A - while the rightful owner's identical call succeeds."
        test_recipe:
          setup:
