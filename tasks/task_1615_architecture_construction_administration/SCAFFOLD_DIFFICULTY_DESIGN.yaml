# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Architecture Construction Administration — 22 instances across 9 rules.
# All recipes replay from empty-DB; the logical clock starts at
# 2026-08-01T00:00:00Z (the declared startup default) unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: retainage_mode_tiered_vs_reduction_divergence
        grounds:
          - calculations.payment_certification
          - entities.CaProject.fields.retainage_mode
          - entities.PaymentApplication.fields.certified_current_due_cents
        distinguishing_aspect: |
          Retainage dual-variant on the PaymentApplication (fiscal) domain: identical
          lines certified on two projects that differ only in retainage_mode produce
          different retainage_work_cents (550000 TIERED_MARGINAL vs 300000
          REDUCTION_AT_HALFWAY) — a 250000-cent cliff at the 50% threshold.
        test_recipe:
          setup:
            - "Two projects T (retainage_mode TIERED_MARGINAL) and R (retainage_mode REDUCTION_AT_HALFWAY), otherwise identical: contract sum 10000000, SOV A=6000000/B=4000000, billing PER_DIEM_PRORATED, grace 5."
            - "Each project has a REPORT_ISSUED PAYMENT_VERIFICATION visit (visit_date 2026-08-20, performed by user-arch-2, report issued by user-arch-lead)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj T", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5, review_window_days_submittal: 10, review_window_days_rfi: 7, field_report_window_days: 3 }
              as: FirmAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /ca/projects"
              payload: { name: "Proj R", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "REDUCTION_AT_HALFWAY", grace_days: 5, review_window_days_submittal: 10, review_window_days_rfi: 7, field_report_window_days: 3 }
              as: FirmAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /ca/projects/${pt_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/projects/${pr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${pt_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { vt_id: $.data.id }
            - call: "POST /ca/site-visits/${vt_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${vt_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/site-visits"
              payload: { project_id: "${pr_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { vr_id: $.data.id }
            - call: "POST /ca/site-visits/${vr_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${vr_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${pt_id}", period_ending_date: "2026-08-31", verification_visit_id: "${vt_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 6000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_t_id: $.data.id }
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${pr_id}", period_ending_date: "2026-08-31", verification_visit_id: "${vr_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 6000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_r_id: $.data.id }
          trigger:
            - call: "POST /ca/payment-applications/${app_t_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/payment-applications/${app_r_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "PaymentApplication.${app_t_id}.retainage_work_cents == 550000  # 0.10*5000000 + 0.05*1000000"
            - "PaymentApplication.${app_t_id}.certified_current_due_cents == 5450000"
            - "PaymentApplication.${app_r_id}.retainage_work_cents == 300000  # 0.05*6000000 (entire gross re-based)"
            - "PaymentApplication.${app_r_id}.certified_current_due_cents == 5700000"
            - "PaymentApplication.${app_t_id}.certified_current_due_cents - PaymentApplication.${app_r_id}.certified_current_due_cents == -250000"

      - name: invoice_billing_per_diem_vs_whole_month_divergence
        grounds:
          - calculations.additional_service_billing
          - entities.CaProject.fields.billing_method
          - entities.AdditionalServiceInvoice.fields.amount_cents
        distinguishing_aspect: |
          Billing dual-variant on the AdditionalServiceInvoice (professional-services
          billing) domain — a different entity domain than the retainage instance:
          identical 31 billable days yield 3720000 cents under PER_DIEM_PRORATED but
          6000000 cents under WHOLE_MONTH (ceil(31/30)=2 months).
        test_recipe:
          setup:
            - "Two ACTIVE projects D (billing_method PER_DIEM_PRORATED) and M (billing_method WHOLE_MONTH), otherwise identical: base SCD 2026-09-30, grace 5, no excusable delay -> horizon_start 2026-10-05."
            - "Logical clock 2026-11-05 (project ACTIVE, past horizon start -> EXTENDED_DURATION; horizon_end = 2026-11-05; window yields 31 billable days for period 2026-10-01..2026-11-30)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj D", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { pd_id: $.data.id }
            - call: "POST /ca/projects"
              payload: { name: "Proj M", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "WHOLE_MONTH", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /ca/projects/${pd_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/projects/${pm_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${pd_id}", period_start: "2026-10-01", period_end: "2026-11-30" }
              as: FirmAdmin
              captures: { inv_d_id: $.data.id }
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${pm_id}", period_start: "2026-10-01", period_end: "2026-11-30" }
              as: FirmAdmin
              captures: { inv_m_id: $.data.id }
          assert:
            - "AdditionalServiceInvoice.${inv_d_id}.billable_days == 31"
            - "AdditionalServiceInvoice.${inv_d_id}.amount_cents == 3720000  # 31 x 120000"
            - "AdditionalServiceInvoice.${inv_m_id}.billable_days == 31"
            - "AdditionalServiceInvoice.${inv_m_id}.amount_cents == 6000000  # ceil(31/30) x 3000000"
            - "AdditionalServiceInvoice.${inv_d_id}.status == DRAFT and AdditionalServiceInvoice.${inv_m_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: change_order_tiered_markup_mode_a
        grounds:
          - calculations.change_order_pricing
          - entities.ChangeOrder.fields.markup_cents
        distinguishing_aspect: |
          Mode (a) — a formula with non-linear interaction (marginal tier allocation +
          sign branch): net 12000000 splits across three tiers (500000 + 350000 + 80000
          = 930000 markup), while a deduct of -4000000 earns zero markup and a
          pure-time change of 0 nets a 0 total.
        test_recipe:
          setup:
            - "ACTIVE project (contract sum 10000000, SOV A=6000000/B=4000000)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CO", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Added steel canopy", net_cost_change_cents: 12000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co1_id: $.data.id }
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Deleted storefront", net_cost_change_cents: -4000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co2_id: $.data.id }
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Weather time extension", net_cost_change_cents: 0, time_extension_days: 20 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co3_id: $.data.id }
          assert:
            - "ChangeOrder.${co1_id}.markup_cents == 930000  # 0.10x5000000 + 0.07x5000000 + 0.04x2000000"
            - "ChangeOrder.${co1_id}.total_amount_cents == 12930000"
            - "ChangeOrder.${co2_id}.markup_cents == 0 and ChangeOrder.${co2_id}.total_amount_cents == -4000000"
            - "ChangeOrder.${co3_id}.markup_cents == 0 and ChangeOrder.${co3_id}.total_amount_cents == 0"

      - name: payapp_stored_materials_per_line_rounding_mode_b
        grounds:
          - calculations.payment_certification
          - entities.PaymentApplication.fields.retainage_stored_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins
          round-per-line-then-sum for stored-materials retainage. Three lines of
          105 cents each round to 11 cents per line (total 33); the non-conformant
          sum-then-round order yields round(31.5)=32 — a one-cent observable split.
        test_recipe:
          setup:
            - "ACTIVE TIERED_MARGINAL project with three SOV lines A=4000000, B=3000000, C=3000000 (sum 10000000)."
            - "REPORT_ISSUED PAYMENT_VERIFICATION visit (2026-08-20, performer user-arch-2, issuer user-arch-lead)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj R", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 4000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 3000000 }, { line_code: "C", description: "Finishes", scheduled_value_cents: 3000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v_id: $.data.id }
            - call: "POST /ca/site-visits/${v_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
          trigger:
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 1000000, stored_materials_cents: 105 }, { sov_line_code: "B", work_completed_this_period_cents: 1000000, stored_materials_cents: 105 }, { sov_line_code: "C", work_completed_this_period_cents: 1000000, stored_materials_cents: 105 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
            - call: "POST /ca/payment-applications/${app_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "PaymentApplication.${app_id}.retainage_stored_cents == 33  # round_half_up(10.5) per line x 3"
            - "PaymentApplication.${app_id}.retainage_work_cents == 300000  # 0.10 x 3000000 (below 5000000 threshold)"
            - "PaymentApplication.${app_id}.certified_current_due_cents == 2700282  # 3000000 - 300000 + (315 - 33)"

      - name: payapp_retainage_eval_order_after_incorporation_mode_c
        grounds:
          - calculations.payment_certification
          - calculations.contract_position
          - state_machines.ChangeOrder.OWNER_ACCEPTED_to_INCORPORATED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned evaluation order:
          after a ChangeOrder incorporation moves adjusted_contract_sum_cents (and thus
          the retainage threshold) to 16570000, certifying the next application must
          re-evaluate R(gross_prev) under the NEW threshold (8285000), yielding
          retainage_work_cents 464250 and certified_current_due_cents 4535750 —
          an implementation reusing the first application's snapshot diverges.
        test_recipe:
          setup:
            - "ACTIVE TIERED_MARGINAL project, contract sum 10000000, SOV A=9000000/B=1000000."
            - "Application 1 certified (period 2026-08-31, line A work 4000000) with verification visit V1 (2026-08-20)."
            - "Change order net +6000000 (markup 570000, total 6570000) incorporated; project version captured before incorporation."
            - "Second REPORT_ISSUED verification visit V2 (2026-09-15) for period 2026-09-30."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj E", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 9000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 1000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 4000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app1_id: $.data.id }
            - call: "POST /ca/payment-applications/${app1_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Added scope", net_cost_change_cents: 6000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co_id: $.data.id }
            - call: "POST /ca/change-orders/${co_id}/recommend"
              payload: { recommendation: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders/${co_id}/owner-decision"
              payload: { decision: "ACCEPT" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "GET /ca/projects/${p_id}"
              as: FirmAdmin
              captures: { p_v: $.data.version }
            - call: "POST /ca/change-orders/${co_id}/incorporate"
              payload: { expected_project_version: "${p_v}" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-09-15", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v2_id: $.data.id }
            - call: "POST /ca/site-visits/${v2_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v2_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
          trigger:
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-09-30", verification_visit_id: "${v2_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 5000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app2_id: $.data.id }
            - call: "POST /ca/payment-applications/${app2_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "PaymentApplication.${app1_id}.certified_current_due_cents == 3600000  # 4000000 - 400000"
            - "CaProject.${p_id}.adjusted_contract_sum_cents == 16570000"
            - "PaymentApplication.${app2_id}.gross_work_completed_cents == 9000000"
            - "PaymentApplication.${app2_id}.retainage_work_cents == 464250  # R(9000000)=828500+35750 minus R(4000000)=400000, both under threshold 8285000"
            - "PaymentApplication.${app2_id}.certified_current_due_cents == 4535750"
            - "PaymentApplication.${app2_id}.previous_application_id == ${app1_id}"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: submittal_revise_resubmit_cycle
        grounds:
          - state_machines.Submittal.UNDER_REVIEW_to_REVISE_AND_RESUBMIT
          - state_machines.Submittal.REVISE_AND_RESUBMIT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on Submittal: UNDER_REVIEW -> REVISE_AND_RESUBMIT ->
          UNDER_REVIEW -> APPROVED, with revision_number 1 -> 2 and a fresh
          received_at/due_at on the loop-back.
        test_recipe:
          setup:
            - "ACTIVE project with default 10-day submittal window; logical clock left at the 2026-08-01T00:00:00Z startup default."
            - "Submittal created (revision 1, UNDER_REVIEW, received 2026-08-01, due 2026-08-11)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj S", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id }
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "REVISE_AND_RESUBMIT", review_notes: "Stamp missing" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          trigger:
            - call: "POST /ca/submittals/${s_id}/resubmit"
              payload: {}
              as: Contractor
              as_user_id: "user-contractor-1"
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "APPROVED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "Submittal.${s_id}.status == APPROVED"
            - "Submittal.${s_id}.revision_number == 2"
            - "Submittal.${s_id}.credited_delay_days == 0  # resubmitted and re-reviewed at the same default clock date"
