      - name: payment_waterfall_overpayment_spills_to_negative_balance
        claim_type: Correct Result
        grounds:
          - calculations.payment_waterfall
          - calculations.balance_due
          - entities.PaymentScheduleItem.fields.allocated_cents
          - entities.Event.fields.balance_due_cents
        distinguishing_aspect: "Two schedule items 500000 + 300000 and payments summing 900000: item1 allocated 500000, item2 allocated 300000, 100000 overpay leaves balance_due_cents = estimated_total(0) - 900000 = -900000."
        test_recipe:
          setup: ["INQUIRY event (estimated_total 0), two schedule items 500000 then 300000, one 900000 payment applied."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "Over Co", event_date: "2028-11-01", setup_style: "THEATER", expected_attendance: 20, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2028-09-01", amount_due_cents: 500000 }
              as: AccountingClerk
              captures: { item1: $.data.id }
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Second", due_date: "2028-10-01", amount_due_cents: 300000 }
              as: AccountingClerk
              captures: { item2: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 900000, method: "WIRE", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
          assert:
            - "PaymentScheduleItem.${item1}.allocated_cents == 500000"
            - "PaymentScheduleItem.${item2}.allocated_cents == 300000"
            - "PaymentScheduleItem.${item1}.settled == true"
            - "PaymentScheduleItem.${item2}.settled == true"
            - "Event.${event_id}.balance_due_cents == -900000"

