              as: Operator
              as_user_id: "${op_id}"
              captures: { ev_ok_id: $.data.id }
          assert:
            - "first trigger call (20 days after) returns status 409 with data.error_id == ERR_REAPPLICATION_INTERVAL_CONFLICT"
            - "second trigger call (15 days before, back-dated) also returns status 409 with data.error_id == ERR_REAPPLICATION_INTERVAL_CONFLICT, proving the buffer is symmetric"
            - "third trigger call (exactly 21 days after) returns 201 and LandApplicationEvent.${ev_ok_id}.event_status == RECORDED"
            - "LandApplicationEvent.${ev_ok_id}.rate_gal_per_acre == 5000.00, n_applied_lbs == 780.00 and p2o5_applied_lbs == 500.00"
            - "Field.${fld_id}.last_application_on == 2026-07-26T00:00:00Z"
            - "FieldNutrientBudget.${bd_id}.applied_gallons_to_date == 350000.00 and remaining_gallons == 64396"
            - "exactly two LandApplicationEvent rows exist for budget ${bd_id}: ${ev_first_id} and ${ev_ok_id}"
      - name: permit_coverage_intervals_touch_without_overlapping
        grounds:
          - validations[priority=29]
          - errors.ERR_PERMIT_COVERAGE_OVERLAP
          - state_machines.Permit.DRAFT_APPLICATION_to_SUBMITTED
          - entities.Permit.fields.expiration_on
        distinguishing_aspect: |
          The contended resource is the operation's coverage timeline rather than a field, and the
          interval is half-open: a second permit starting 2030-06-01 (inside [2026-01-01, 2031-01-01))
          is rejected, while a third starting exactly 2031-01-01 — the incumbent's expiration instant —
          is accepted because the endpoint is excluded.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with permit_required true"
            - "Permit A of type GENERAL effective 2026-01-01, coverage_status COVERED, expiration_on 2031-01-01"
            - "Two further DRAFT_APPLICATION permits on the same operation: B effective 2030-06-01 and C effective 2031-01-01"
