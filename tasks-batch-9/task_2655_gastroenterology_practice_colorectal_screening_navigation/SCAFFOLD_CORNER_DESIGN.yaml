          - calculations.claim_pricing.variants
          - endpoints.POST_billing_claims_claim_id_reprice
        excluded_because:
          difficulty_instance: claim_provisional_versus_final_patient_share_diverges
          rationale: "Which variant is selected in which context - PROVISIONAL at booking create and FINAL at reprice - is asserted on the same claim row inside that depth instance, together with the reprice_count increment."
      - name: adr_attribution_variant_corner
        claim_type: variant_selection
        grounds:
          - calculations.adenoma_detection_rate.variants
          - entities.QualityPeriod.fields.attribution_basis
        excluded_because:
          difficulty_instance: adr_diverges_by_attribution_basis
          rationale: "Two quality periods over the same procedures under the two attribution bases, and the resulting divergence in adr_pct and benchmark_result, are the entire subject of that depth instance."
      - name: claim_line_rounding_precision_corner
        claim_type: precision
        grounds:
          - calculations.claim_pricing.precision
          - entities.BillingClaim.fields.coinsurance_cents
        excluded_because:
          difficulty_instance: claim_per_line_rounding_yields_39367
          rationale: "The per-line versus sum-then-round divergence at a half-cent boundary is pinned to the exact cent in that depth instance, which is the only place the 39367 against 39366 distinction can be made."
      - name: surveillance_nested_cap_constants_corner
        claim_type: constants_applied
        grounds:
          - calculations.surveillance_interval_months.constants
          - calculations.surveillance_interval_months.precision
        excluded_because:
          difficulty_instance: surveillance_interval_nested_min_selects_60_months
          rationale: "The three-stage nested min and the order in which RISK_TIER_CAP_MONTHS and the poor-prep cap apply are exercised at the 60-month selection point in that depth instance, which is where the constants become observable."

  - section: validations
    instances:
      - name: duplicate_mrn_and_duplicate_plan_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_33
          - errors.ERR_DUPLICATE_IDENTIFIER
        distinguishing_aspect: "Uniqueness is per-entity, not global: reusing MRN-0001 on a second Patient and reusing P1 on a second InsurancePlan both return ERR_DUPLICATE_IDENTIFIER 409, while reusing the same string as a Clinician npi is accepted because npi is a different uniqueness scope."
        test_recipe:
          setup:
            - "One plan P1 and one patient MRN-0001"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1980-02-02", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { eid1: $.data.error_id }
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Other Payer" }
              as: PracticeAdmin
              captures: { eid2: $.data.error_id }
            - call: "POST /clinicians"
              payload: { npi: "MRN-0001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST" }
              as: PracticeAdmin
              captures: { npi_ok: $.data.npi }
          assert:
            - "both duplicate calls return HTTP 409 with ${eid1} == ERR_DUPLICATE_IDENTIFIER and ${eid2} == ERR_DUPLICATE_IDENTIFIER"
            - "${npi_ok} == MRN-0001 with HTTP 201 - uniqueness is scoped to each entity's own field"
            - "exactly one Patient row and one InsurancePlan row exist, ${pt_id} and ${plan_id}"
      - name: duplicate_open_episode_is_scoped_to_the_indication
        claim_type: violation_to_error
        grounds:
          - validations.priority_34
          - errors.ERR_DUPLICATE_OPEN_EPISODE
        distinguishing_aspect: "The rule keys on (patient, indication, open clinical_status): a second SCREENING_AVERAGE_RISK episode is refused with 409 while a SURVEILLANCE episode for the same patient at the same instant is created, and after the first episode is closed the refused indication becomes available again."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one plan, one patient with one OPEN SCREENING_AVERAGE_RISK episode"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep1: $.data.id }
          trigger:
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { eid: $.data.error_id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SURVEILLANCE" }
              as: ReferralCoordinator
              captures: { ep2: $.data.id, el2: $.data.eligibility_status }
            - call: "POST /screening-episodes/${ep1}/close"
              payload: { reason: "PATIENT_DECLINED" }
              as: PatientNavigator
              captures: { cst: $.data.clinical_status }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep3: $.data.id }
          assert:
            - "the second SCREENING_AVERAGE_RISK create returns HTTP 409 with ${eid} == ERR_DUPLICATE_OPEN_EPISODE"
            - "${ep2} is created with HTTP 201 and ${el2} == ELIGIBLE"
            - "${cst} == CLOSED_DECLINED with closure_reason PATIENT_DECLINED"
            - "${ep3} is created with HTTP 201 once ${ep1} is no longer open"
            - "Patient.${pt_id}.open_episode_count == 2 at the end (${ep2} and ${ep3})"
      - name: override_range_beats_segregation_of_duties
        claim_type: priority_ordering
        grounds:
          - validations.priority_36
          - validations.priority_37
          - errors.ERR_OVERRIDE_OUT_OF_RANGE
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The performing endoscopist submitting an override of 140 months violates both rule 36 (140 > MAX_OVERRIDE_INTERVAL_MONTHS 120) and rule 37 (self-attestation), and the response is ERR_OVERRIDE_OUT_OF_RANGE 422 - the lower priority number wins; with 40 months the same caller then gets ERR_SEGREGATION_OF_DUTIES 403, and a second endoscopist succeeds."
