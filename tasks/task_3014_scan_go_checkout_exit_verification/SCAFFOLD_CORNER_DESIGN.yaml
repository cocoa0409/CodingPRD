  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: weighted_round_half_up_exactly_half_cent_rounds_up
        claim_type: precision
        grounds: [calculations.scan_line_gross]
        distinguishing_aspect: "227g at 199c/lb is exactly 99.5c (227*199/454 = 99.5); round_half_up must produce 100, not 99 (banker's/floor variants fail)."
        test_recipe:
          setup: ["Club, WEIGHTED item at 199c/lb, CLUB member, clock 12:00, session"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club RH", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "HAM", item_name: "Ham", pricing_mode: "WEIGHTED", price_per_pound_cents: 199 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", weight_grams: 227 }
              as: Member
              as_user_id: "${member_id}"
              captures: { gross: $.data.line_gross_cents }
          assert:
            - "gross == 100 (exactly-half rounds up)"

      - name: commenced_pounds_boundary_454_vs_455_grams
        claim_type: boundary
        grounds: [calculations.commenced_pound_units]
        distinguishing_aspect: "454g is exactly 1 commenced pound (20c savings at 20c/unit) while 455g crosses into 2 commenced pounds (40c savings) — ceil boundary at exactly LB_GRAMS."
        test_recipe:
          setup: ["Club, WEIGHTED item 100c/lb with offer 20c/unit limit 10 covering 2026, CLUB member, clock 12:00, session"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club CP", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "TURK", item_name: "Turkey", pricing_mode: "WEIGHTED", price_per_pound_cents: 100 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /clubs/${club_id}/instant-savings-offers"
              payload: { catalog_item_id: "${item_id}", discount_cents: 20, valid_from_iso: "2026-01-01T00:00:00Z", valid_to_iso: "2026-12-31T23:59:59Z", per_member_limit: 10 }
              as: ClubManager
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", weight_grams: 454 }
              as: Member
              as_user_id: "${member_id}"
              captures: { u1: $.data.offer_units_applied, s1: $.data.line_savings_cents }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", weight_grams: 455 }
              as: Member
              as_user_id: "${member_id}"
              captures: { u2: $.data.offer_units_applied, s2: $.data.line_savings_cents }
          assert:
            - "u1 == 1 and s1 == 20"
            - "u2 == 2 and s2 == 40"

      - name: offer_per_member_limit_exhaustion_across_lines
        claim_type: threshold
        grounds: [calculations.instant_savings_application]
        distinguishing_aspect: "per_member_limit 3 with two UNIT lines of qty 3 then qty 1: the first redeems all 3 (300c off at 100c/unit), the second redeems 0 — cumulative allowance accounting across lines."
        test_recipe:
          setup: ["Club, UNIT item 500c with offer 100c/unit limit 3, CLUB member, clock 12:00, session"]
