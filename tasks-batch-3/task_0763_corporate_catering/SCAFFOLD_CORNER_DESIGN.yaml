      - name: catering_pricing_round_then_sum_excluded
        claim_type: Correct Result
        grounds: [calculations.catering_client_charge]
        excluded_because:
          difficulty_instance: combinatorial_formula / catering_per_line_round_then_sum
          rationale: "Per-line round-then-sum pricing (666/120/786) is asserted by the named §1.8 instance."
      - name: session_food_cost_dual_variant_excluded
        claim_type: Variant Divergence
        grounds: [calculations.theoretical_food_cost, calculations.actual_food_cost]
        excluded_because:
          difficulty_instance: dual_variant_calc / session_theoretical_vs_actual_food_cost
          rationale: "Theoretical-vs-actual divergence (400 vs 500) is asserted by the named §1.8 instance."

