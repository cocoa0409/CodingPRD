            - "TOW kit with LINE-T, chassis CH-T1 and an APPLIANCE lot L-2211 of 20 pieces; the order is released to the line and advanced to APPLIANCE_INSTALL, where two installations of 5 and 3 pieces are booked from that lot; a SAFETY campaign over the lot is then opened, so both installations are RECALL_AFFECTED."
