          assert:
            - "FIXTURE — ${vs_live_padj} == 4875000 (1000 sellable at 5000 less the 125000 card fee), ${vs_live_pnet} == 4175000 == 4875000 - 500000 - 200000, ${vs_live_sold} == 400, and ${vs_conf_pnet} == 4375000 == 4875000 - 500000 - 0"
            - "DEFAULT IS TRAILING_SETTLED — ${vs_idx_default} == 0 and ${vs_idx_trailing} == 0: ${vs_settled_count} == 0, so the denominator is 0 and the shared tail returns 0 rather than dividing"
            - "EXPLICIT MARK_TO_MARKET — ${vs_idx_mtm} == 40 == ROUND_HALF_UP(100 * 1670000 / 4175000), where the live mark is ROUND_HALF_UP(4175000 * 400 / 1000) == 1670000 and the denominator is the live projection alone"
            - "THE CONFIRMED SHOW IS IN NEITHER VARIANT — ${vs_conf_id} is CONFIRMED, not ON_SALE or PERFORMED, so it never enters the numerator or the denominator; adding its 4375000 projection to the mark-to-market denominator would report 20 instead of 40"
            - "THE PERSISTED FIELD NEVER MARKS TO MARKET — ${vs_idx_persisted} == 0 even immediately after the MARK_TO_MARKET read; the variant is a read-time projection and the index is only written on POST /settlements/{id}/pay"
            - "THE EXPOSURE VIEW IS VARIANT-INDEPENDENT — ${vs_committed} == 1000000 (both accepted guarantees) and ${vs_util} == 20.00 in all three reads; selecting a valuation must not disturb the exposure book"

      - name: index_reconciles_when_a_live_show_becomes_settled
        claim_type: Reconciliation
        grounds:
          - "calculations.market_performance_index.variants"
          - "state_machines.Settlement.ARTIST_SIGNED_to_PAID"
          - "entities.Market.fields.performance_index"
        excluded_because:
          difficulty_instance: market_performance_index_trailing_settled_versus_mark_to_market
          rationale: "The switch itself is what the §1.8 instance drives: it pays a settlement, so the show leaves LIVE_SHOWS and enters SETTLED_SHOWS, and it asserts the persisted index before and after the pay together with both read-time variants around the switch — the delta on the ledger IS the change in Market.performance_index. Adding a corner instance would mean paying the same settlement against the same projection literals a second time."

  # ===========================================================================
  # SECTION 4 — validations
  # 45 rules in §1.4. The three per-rule rows (Violation -> Error,
  # Satisfaction -> Pass, Priority Ordering) plus the six pattern rows are all
  # walked below. Rules already driven to their error by another instance in
  # this file or in §1.8 are not re-driven here; the errors section closes the
  # loop and names, for every id in §1.6, the instance that triggers it.
  # AUDIT FINDING (recorded here because §1.9 is a §1.5 audit pass): the former
  # priority 31 / ERR_NO_ACCEPTED_OFFER was removed from §1.4 and §1.6. A show
  # reaches CONFIRMED only through POST /offers/{offer_id}/accept, so no call
  # can observe a CONFIRMED or PERFORMED show without an ACCEPTED offer and the
  # rule could never fire — an untriggerable error is worse than no error.
  # ===========================================================================
  - section: validations
    instances:
      - name: show_and_inventory_rule_violations_each_return_their_own_error_id
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=21]"
          - "validations[priority=22]"
          - "validations[priority=33]"
          - "validations[priority=45]"
          - "errors[ERR_INVALID_SHOW_WINDOW]"
          - "errors[ERR_EVENT_DATE_IN_PAST]"
          - "errors[ERR_INSUFFICIENT_TIER_INVENTORY]"
          - "errors[ERR_DUPLICATE_TIER_NAME]"
        distinguishing_aspect: "Four rules that a naive implementation collapses into one 400 are each driven to their own id and status: an incoherent window is 422 ERR_INVALID_SHOW_WINDOW (twice — once on load_in > event, once on announce > event, which is the clause most often dropped), a coherent window in the past is 422 ERR_EVENT_DATE_IN_PAST (the window rule at priority 21 must NOT swallow it), a duplicate tier name is 409 ERR_DUPLICATE_TIER_NAME and not 422, and an over-sale is 422 ERR_INSUFFICIENT_TIER_INVENTORY from both of its declared sites (a sale and a hold). Selling exactly available_qty in between proves the inventory rule is not off by one."
