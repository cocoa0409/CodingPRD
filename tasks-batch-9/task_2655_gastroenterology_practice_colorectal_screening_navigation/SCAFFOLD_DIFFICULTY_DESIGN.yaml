scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_provisional_versus_final_patient_share_diverges
        grounds:
          - calculations.claim_pricing
          - entities.BillingClaim.fields.patient_responsibility_cents
          - entities.ProcedureBooking.fields.planned_classification
          - entities.ProcedureBooking.fields.final_classification
          - state_machines.BillingClaim.PROVISIONAL_PRICED_to_REPRICED
        distinguishing_aspect: |
          This dual-variant calculation lives in the money domain on BillingClaim - the provisional
          variant prices the same colonoscopy at 8090 cents of patient responsibility under
          SCREENING_PREVENTIVE while the final variant prices it at 167740 cents under DIAGNOSTIC,
          because polypectomy is only known after the exam.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "Plan P1: preventive_coverage_pct 1.00, diagnostic_coinsurance_pct 0.20, deductible_cents 150000, out_of_pocket_max_cents 400000, polypectomy_carveout DIAGNOSTIC_CONVERTED, anesthesia_bundled false"
            - "Patient born 1975-04-10 (age 51, risk_tier AVERAGE) with an ELIGIBLE SCREENING_AVERAGE_RISK episode"
            - "MAC room block on 2026-09-15, window 13:00Z-21:00Z, turnover 15, in status COVERAGE_CONFIRMED"
            - "One booking at 13:00Z for 45 minutes, navigation_status PREP_CONFIRMED, booking IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health", preventive_coverage_pct: 1.00, diagnostic_coinsurance_pct: 0.20, deductible_cents: 150000, out_of_pocket_max_cents: 400000, polypectomy_carveout: "DIAGNOSTIC_CONVERTED", modifier_33_honored: true, anesthesia_bundled: false }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST", adr_benchmark_pct: 0.25, credential_status: "ACTIVE" }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Dr Bo Reyes", clinician_type: "ANESTHESIA", max_overlapping_rooms: 1 }
              as: PracticeAdmin
              captures: { anes_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions/${sess_id}/anesthesia-coverage"
              payload: { anesthesia_clinician_id: "${anes_id}", coverage_start_utc: "2026-09-15T13:00:00Z", coverage_end_utc: "2026-09-15T21:00:00Z" }
              as: PracticeAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_id: $.data.id }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_id}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v}" }
              as: ReferralCoordinator
              captures: { bk_id: $.data.id }
            - call: "GET /billing-claims"
              payload: { booking_id: "${bk_id}" }
              as: BillingSpecialist
              captures: { claim_id: "$.data[0].id", prov_share: "$.data[0].patient_responsibility_cents", prov_allowed: "$.data[0].allowed_amount_cents", prov_class: "$.data[0].classification" }
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "PHONE", acknowledged: true }
              as: PatientNavigator
            - call: "POST /screening-episodes/${ep_id}/prep-attestation"
              payload: { regimen_completed: true }
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /procedure-bookings/${bk_id}/check-in"
              payload: {}
              as: PatientNavigator
            - call: "POST /procedure-bookings/${bk_id}/start"
              payload: {}
              as: Endoscopist
              as_user_id: "${endo_id}"
          trigger:
            - call: "POST /procedure-bookings/${bk_id}/complete"
              payload: { prep_quality_bbps: 7, polyps_removed_count: 2, largest_polyp_mm: 6, specimen_count: 2 }
              as: Endoscopist
              as_user_id: "${endo_id}"
            - call: "POST /procedure-bookings/${bk_id}/pathology-reports"
              payload: { accession_number: "ACC-0001", specimens: [ { label: "A", histology: "TUBULAR_ADENOMA", size_mm: 6 }, { label: "B", histology: "TUBULAR_ADENOMA", size_mm: 4 } ], high_grade_dysplasia: false }
              as: Pathologist
              captures: { rep_id: $.data.id }
            - call: "POST /pathology-reports/${rep_id}/finalize"
              payload: {}
              as: Pathologist
          assert:
            - "${prov_share} == 8090"
            - "${prov_allowed} == 211200"
            - "${prov_class} == SCREENING_PREVENTIVE"
            - "ProcedureBooking.${bk_id}.planned_classification == SCREENING_PREVENTIVE"
            - "ProcedureBooking.${bk_id}.final_classification == DIAGNOSTIC"
            - "BillingClaim.${claim_id}.variant == FINAL"
            - "BillingClaim.${claim_id}.status == REPRICED"
            - "BillingClaim.${claim_id}.reprice_count == 1"
            - "BillingClaim.${claim_id}.complexity_tier == TIER_2"
            - "BillingClaim.${claim_id}.base_allowed_cents == 230200"
            - "BillingClaim.${claim_id}.allowed_amount_cents == 238700"
            - "BillingClaim.${claim_id}.deductible_applied_cents == 150000"
            - "BillingClaim.${claim_id}.coinsurance_cents == 17740"
            - "BillingClaim.${claim_id}.patient_responsibility_cents == 167740"
            - "BillingClaim.${claim_id}.plan_paid_cents == 70960"
      - name: adr_diverges_by_attribution_basis
        grounds:
          - calculations.adenoma_detection_rate
          - entities.QualityPeriod.fields.attribution_basis
          - entities.QualityPeriod.fields.adr_pct
          - state_machines.QualityPeriod.OPEN_to_LOCKED
        distinguishing_aspect: |
          This dual-variant calculation lives in the quality-measurement domain on QualityPeriod, not
          in the money domain - the identical pair of completed screening colonoscopies yields
          adr_pct 0.5000 over a denominator of 2 under PROCEDURE_DATE and adr_pct 1.0000 over a
          denominator of 1 under PATHOLOGY_FINALIZATION_DATE, because the second booking's report is
          finalized after the window closes.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-09-01T00:00:00Z"
            - "One endoscopist with adr_benchmark_pct 0.25, one anesthesia clinician, plan P1"
            - "Two patients, each with an ELIGIBLE SCREENING_AVERAGE_RISK episode"
            - "Booking A at 2026-09-15T13:00Z completed with an adenoma report finalized on 2026-09-20"
            - "Booking B at 2026-09-15T15:00Z completed with a NORMAL_MUCOSA report finalized on 2026-10-05, after the measurement window closes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health", diagnostic_coinsurance_pct: 0.20, deductible_cents: 150000 }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST", adr_benchmark_pct: 0.25 }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Dr Bo Reyes", clinician_type: "ANESTHESIA", max_overlapping_rooms: 1 }
              as: PracticeAdmin
              captures: { anes_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_a: $.data.id }
            - call: "POST /patients"
