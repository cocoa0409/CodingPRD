  - rule_id: boundary_precision_check
    instances:
      - name: acuity_tier_thresholds_at_six_seven_eleven_and_twelve
        grounds:
          - calculations.acuity_score_and_tier
          - entities.EmergencyEvaluation.fields.acuity_score
          - entities.EmergencyEvaluation.fields.acuity_tier
          - entities.EmergencyEvaluation.fields.recommended_status
        distinguishing_aspect: |
          Integer-threshold boundary on an inclusive lower bound: score 6 is LOW and score 7 is
          MODERATE, score 11 is MODERATE and score 12 is HIGH, so both TIER_MODERATE_MIN and
          TIER_HIGH_MIN are probed at threshold-1 and at threshold on the same patient.
        test_recipe:
          setup:
            - "One adult patient with no prior admissions, so prior_admission_count_30d is 0 and contributes nothing to any of the five scores."
            - "Logical clock fixed at 2026-09-03T08:00:00Z."
