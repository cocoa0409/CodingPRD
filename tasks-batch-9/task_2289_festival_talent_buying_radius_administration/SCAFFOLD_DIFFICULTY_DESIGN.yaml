  - rule_id: boundary_precision_check
    instances:

      - name: genre_share_exactly_at_cap_passes
        grounds:
          - calculations.genre_balance_share
          - validations[priority=72]
          - errors.ERR_GENRE_CAP_EXCEEDED
          - endpoints["POST /festival-ops/offers/{id}/issue"]
        distinguishing_aspect: |
          Metric: the genre share ratio, at exactly GENRE_CAP_PCT. The fixture is sized so the cap
          lands on a whole cent — allocatable 5000000 and 0.40 * 5000000 == 2000000 — so the pass
          case sits on the boundary and the fail case is one cent of numerator past it. A `>=`
          comparison instead of `>` flips the first issue from 201 to 409, and a share computed
          in floating point from a rounded percentage flips it too.
        test_recipe:
          setup:
            - "Festival with talent_budget_cents 5000000 and contingency_reserve_pct 0.00, so allocatable_budget_cents == 5000000 exactly."
            - "One tier at allocation_pct 1.00 (allocation_cents 5000000, max_slots 4) and one flagship stage."
            - "Three draw_score 80 artists — two LATIN, one POP — so every ceiling is max(500000, 80 * 25000) == 2000000 before the genre factor."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 5000000, contingency_reserve_pct: 0.00 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 4, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
