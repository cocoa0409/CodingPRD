  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: overfill_exact_max_fill_allowed
        grounds:
          - calculations.refill_charge
          - state_machines.RefillTicket.WEIGHED_to_FILLED
          - errors[ERR_OVERFILL_RISK]
        distinguishing_aspect: |
          Metric = propane pounds on the fill endpoint: max_fill_lbs =
          round_half_up(47.60 * 0.42, 2) = 19.99; a fill of exactly 19.99 lbs
          (equality) is allowed and charged, while 20.00 lbs (one centi-pound
          over) is rejected with ERR_OVERFILL_RISK.
        test_recipe:
          setup:
            - "Site S with active policy (no hazmat fee), 1 EMPTY customer cylinder (WC 47.60, TW 17.00)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Fill Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CF-901", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { c_id: $.data.id }
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { ta_id: $.data.id }
            - call: "POST /refill-tickets/${ta_id}/weigh"
              payload: { measured_tare_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { tb_id: $.data.id }
            - call: "POST /refill-tickets/${tb_id}/weigh"
              payload: { measured_tare_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /refill-tickets/${ta_id}/fill"
              payload: { post_weight_lbs: 36.99 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { ta_prop: $.data.propane_lbs, ta_chg: $.data.propane_charge_cents, ta_tot: $.data.total_cents, ta_st: $.data.status }
            - call: "POST /refill-tickets/${tb_id}/fill"
              payload: { post_weight_lbs: 37.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "ticket A: status == FILLED, propane_lbs == 19.99 (== max_fill_lbs, equality allowed)"
            - "ticket A: propane_charge_cents == 6727 (tier1 15.00*349=5235 + tier2 round_half_up(4.99*299)=1492), total_cents == 6727 (hazmat 0)"
            - "ticket B: error_id == ERR_OVERFILL_RISK (20.00 > 19.99)"

      - name: cash_variance_exactly_500_flags
        grounds:
          - calculations.reconciliation_expected_cash
          - state_machines.ReconciliationSession.OPEN_to_VARIANCE_FLAGGED
          - state_machines.ReconciliationSession.OPEN_to_BALANCED
        distinguishing_aspect: |
          Metric = cash cents on the count endpoint (different metric and
          endpoint than the overfill boundary): |variance| >= 500 is inclusive,
          so an overage of exactly 500 flags VARIANCE_FLAGGED while 499 closes
          BALANCED.
        test_recipe:
          setup:
            - "Site S with active policy, 1 FULL fleet cylinder, 1 EMPTY customer cylinder; one swap-with-return completed (expected cash 22705, expected cage 0 full / 1 empty); session created after the sale"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Var Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FV-901", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CV-901", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 23205, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { st1: $.data.status, cv1: $.data.cash_variance_cents }
            - call: "POST /reconciliation-sessions/${rs_id}/recount"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 23204, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { st2: $.data.status, cv2: $.data.cash_variance_cents }
          assert:
            - "count of 23205: cash_variance_cents == 500 and status == VARIANCE_FLAGGED (>= inclusive threshold)"
            - "count of 23204 after recount: cash_variance_cents == 499 and status == BALANCED"

      - name: certification_expiry_day_still_certified
        grounds:
          - calculations.cylinder_certification_expiry
          - state_machines.Cylinder.CERTIFIED_to_RECERT_DUE
          - entities.Cylinder.fields.certification_expires_on
        distinguishing_aspect: |
          Metric = calendar date via the clock endpoint and cylinder read
          (different metric than pounds or cents): on the day EQUAL to
          certification_expires_on the cylinder is still CERTIFIED; it flips to
          RECERT_DUE only when the current date is strictly greater.
        test_recipe:
          setup:
            - "Fleet cylinder with manufacture_date 2014-06-01 (certification_expires_on = 2026-06-01)"
          setup_api_calls:
            - call: "POST /cylinders"
              payload: { serial_number: "FE-901", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2014-06-01", initial_fill: FULL }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_exp0: $.data.certification_expires_on }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cylinders/${c_id}"
              as: PlatformAdmin
              captures: { st_eq: $.data.cert_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cylinders/${c_id}"
              as: PlatformAdmin
              captures: { st_gt: $.data.cert_status }
          assert:
            - "Cylinder.certification_expires_on == 2026-06-01 (manufacture + INITIAL_CERT_YEARS=12)"
            - "at clock 2026-06-01 (equal to expiry): cert_status == CERTIFIED (strict-greater rule)"
            - "at clock 2026-06-02 (one day past): cert_status == RECERT_DUE"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: exchange_create_blocked_by_leak_posture
        grounds:
          - calculations.site_sales_posture
          - errors[ERR_SALES_BLOCKED]
          - state_machines.LeakReport.REPORTED_to_CONFIRMED
        distinguishing_aspect: |
          Pair = ExchangeOrder depends on HostSite: order creation is rejected
          with ERR_SALES_BLOCKED while the site's derived sales_posture is
          SALES_BLOCKED, even though the ExchangeOrder row itself does not yet
          exist; after the leak resolves the same request succeeds.
        test_recipe:
          setup:
            - "Site S with active policy and 1 FULL fleet cylinder; a MINOR leak with quarantine_cage=true is REPORTED and CONFIRMED (posture SALES_BLOCKED)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Gate Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FG-901", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { fc_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech R", cert_level: VISUAL_ONLY }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /leak-reports"
              payload: { site_id: "${s_id}", severity: MINOR, quarantine_cage: true }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { lr_id: $.data.id }
            - call: "POST /leak-reports/${lr_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
            - call: "POST /certification-records"
              payload: { cylinder_id: "${fc_id}", method: VISUAL, outcome: PASS, note: "post-leak re-inspection" }
              as: Technician
              as_user_id: "${t_id}"
            - call: "POST /leak-reports/${lr_id}/resolve"
              payload: { resolution_note: "cage re-inspected, valve replaced" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_st: $.data.status }
          assert:
            - "while blocked: error_id == ERR_SALES_BLOCKED"
            - "after resolve (posture recomputed SALES_OPEN): exchange create succeeds with status == DRAFT"

      - name: refill_fill_requires_cylinder_certified
        grounds:
          - state_machines.RefillTicket.WEIGHED_to_FILLED
          - errors[ERR_CYLINDER_NOT_CERTIFIED]
          - calculations.cylinder_certification_expiry
        distinguishing_aspect: |
          Pair = RefillTicket depends on Cylinder (different pair than
          ExchangeOrder/HostSite): fill is rejected with
          ERR_CYLINDER_NOT_CERTIFIED when the cylinder's cert_status flipped to
          RECERT_DUE between ticket creation and fill — the ticket's own state
          (WEIGHED) is valid throughout.
        test_recipe:
          setup:
            - "Site S with active policy; CUSTOMER cylinder manufacture 2014-06-01 (expires 2026-06-01)"
            - "Ticket created and WEIGHED while the cylinder is still CERTIFIED (clock 2026-05-01)"
            - "Clock advanced to 2026-06-02 (cylinder now RECERT_DUE)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cert Gate Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
