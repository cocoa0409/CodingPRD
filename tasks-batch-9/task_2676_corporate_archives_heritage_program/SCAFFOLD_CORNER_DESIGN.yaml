  # ==========================================================================
  # §1.9 Section 7 — RBAC (Table 7)
  # role_model is segregation_of_duties, so both the plain role checks and the
  # X-User-ID collision checks are exercised.
  # ==========================================================================
  - section: RBAC
    instances:

      - name: rbac_archivist_cannot_publish_finding_aid_returns_unauthorized
