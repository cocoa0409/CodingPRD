            - "POST /turf/replacement-plans with a valid field_id but an unused capital_budget_id returns 404 ERR_CAPITAL_BUDGET_NOT_FOUND, and POST /turf/certification-packets with an unused governing_assessment_id returns 404 ERR_SAFETY_ASSESSMENT_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: maintenance_task_is_created_in_the_scheduled_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.MaintenanceTask
          - entities.MaintenanceTask.fields.status
        distinguishing_aspect: "A newly created MaintenanceTask has status SCHEDULED with started_at_utc, completed_at_utc and cancellation_reason all null; the same holds for SafetyAssessment RECORDED, UsageBooking SCHEDULED, CertificationPacket DRAFT, ReplacementPlan DRAFT/PENDING and CapitalBudget OPEN."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field and one TurfAgronomist; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
          trigger:
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "AERATION", scheduled_start_utc: "2026-08-10T08:00:00Z", scheduled_end_utc: "2026-08-10T10:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t1: $.data.id, t1_status: $.data.status }
          assert:
            - "MaintenanceTask.${t1}.status == \"SCHEDULED\""
            - "MaintenanceTask.${t1}.started_at_utc is null, completed_at_utc is null, cancellation_reason is null"
            - "Field.${f_new}.rest_debt_hours == 0.00 - merely scheduling a task credits nothing"
            - "a CapitalBudget created for fiscal_year 2027 has status \"OPEN\" and a ReplacementPlan created against it has funding_status \"DRAFT\""

      - name: maintenance_task_complete_without_start_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.MaintenanceTask
          - validations[priority=35]
          - errors[ERR_TASK_NOT_TRANSITIONABLE]
        distinguishing_aspect: "COMPLETE is not a declared trigger out of SCHEDULED: issuing it on a SCHEDULED task returns 409 ERR_TASK_NOT_TRANSITIONABLE, the task stays SCHEDULED, and no recovery-credit ledger entry is appended."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field, one TurfAgronomist and one SCHEDULED AERATION task 2026-08-10T08:00:00Z-2026-08-10T10:00:00Z."
            - "Clock advanced to 2026-08-10T10:00:00Z so the refusal cannot be blamed on a future completion timestamp."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "AERATION", scheduled_start_utc: "2026-08-10T08:00:00Z", scheduled_end_utc: "2026-08-10T10:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
          trigger:
            - call: "POST /turf/maintenance-tasks/${t1}/transition"
              payload: { action: "COMPLETE", completed_at_utc: "2026-08-10T10:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and response.data.error_id == \"ERR_TASK_NOT_TRANSITIONABLE\""
            - "MaintenanceTask.${t1}.status == \"SCHEDULED\" and completed_at_utc is null"
            - "GET /turf/usage-ledger-entries with field_id ${f_new} returns total_count 0"
            - "issuing START first and then COMPLETE succeeds, so the refusal is about the source state and not about the action"

      - name: maintenance_task_cancel_after_completion_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MaintenanceTask
          - validations[priority=35]
          - errors[ERR_TASK_NOT_TRANSITIONABLE]
        distinguishing_aspect: "COMPLETED is a terminal state: CANCEL, START and a second COMPLETE all return 409 ERR_TASK_NOT_TRANSITIONABLE, and completed_at_utc keeps its original value 2026-08-10T10:00:00Z."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field, one TurfAgronomist and one AERATION task 2026-08-10T08:00:00Z-2026-08-10T10:00:00Z."
            - "Clock at 2026-08-10T10:00:00Z; the task has been STARTed and then COMPLETEd with completed_at_utc 2026-08-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "AERATION", scheduled_start_utc: "2026-08-10T08:00:00Z", scheduled_end_utc: "2026-08-10T10:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/maintenance-tasks/${t1}/transition"
              payload: { action: "START" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "POST /turf/maintenance-tasks/${t1}/transition"
              payload: { action: "COMPLETE", completed_at_utc: "2026-08-10T10:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t1_completed: $.data.completed_at_utc }
