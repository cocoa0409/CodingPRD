          Metric: seats via POST /enrollments. With capacity 1 the first enrollment
          (enrolled_count 0 == capacity - 1) succeeds and the next (enrolled_count == capacity)
          is rejected — the boundary sits exactly at enrolled_count == capacity, unlike the
          minute and bps metrics of the other boundary instances.
        test_recipe:
          setup:
            - "LICENSED school; PUBLISHED offering capacity 1; two students"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 1, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu A", email: "sa@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sa: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu B", email: "sb@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sb: $.data.id } }
          trigger:
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sa}" }, as: Registrar, captures: { ea: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sb}" }, as: Registrar, captures: { err: $.data.error_id } }
            - { call: "GET /offerings/${off}", as: Registrar, captures: { ec: $.data.enrolled_count, sa2: $.data.seats_available } }
          assert:
            - "first enrollment succeeds and leaves seats_available == 0   # enrolled_count == capacity boundary reached"
            - "second enrollment: error_id == ERR_OFFERING_FULL (http 409)"
            - "CourseOffering.${off}: enrolled_count == 1 and seats_available == 0"

      - name: refund_tier_boundary_1000bps
        grounds:
          - calculations.refund_scheduled_cents
          - entities.Enrollment.fields.completion_fraction_bps
        distinguishing_aspect: |
          Metric: completion fraction in bps via POST /enrollments/{id}/withdraw. Tier
          boundaries are inclusive on the lower refund tier: f == 1000 bps yields the 90%
          tier (granted 41350) while f == 1003 bps falls to the 75% tier (granted 33625) —
          one boundary step changes the refund by 7725 cents. Distinct metric/endpoint from
          the seat-minute and pass-rate boundaries.
        test_recipe:
          setup:
            - "LICENSED school; course required 3000, tuition 50000; PUBLISHED offering capacity 2; students A (300 VERIFIED minutes -> f == 1000) and B (301 minutes -> f == 1003), both PAID 51500"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu A", email: "sa@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sa: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu B", email: "sb@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sb: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sa}" }, as: Registrar, captures: { ea: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sb}" }, as: Registrar, captures: { eb: $.data.id } }
            - { call: "POST /enrollments/${ea}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${eb}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${ea}/attendance-records", payload: { session_date: "2026-09-03", minutes: 300 }, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /enrollments/${eb}/attendance-records", payload: { session_date: "2026-09-03", minutes: 301 }, as: Instructor, as_user_id: "${ins}" }
          trigger:
            - { call: "POST /enrollments/${ea}/withdraw", payload: { reason: "VOLUNTARY", effective_date: "2026-09-04" }, as: Registrar }
            - { call: "POST /enrollments/${eb}/withdraw", payload: { reason: "VOLUNTARY", effective_date: "2026-09-04" }, as: Registrar }
            - { call: "GET /refund-requests?enrollment_id=${ea}", as: Registrar, captures: { rra: "$.data[0].id", fa: "$.data[0].completion_fraction_bps_at_withdrawal", ga: "$.data[0].granted_refund_cents" } }
            - { call: "GET /refund-requests?enrollment_id=${eb}", as: Registrar, captures: { rrb: "$.data[0].id", fb: "$.data[0].completion_fraction_bps_at_withdrawal", gb: "$.data[0].granted_refund_cents" } }
          assert:
            - "A: completion_fraction_bps_at_withdrawal == 1000 and granted_refund_cents == 41350   # f <= 1000 -> 90% tier (inclusive)"
            - "B: completion_fraction_bps_at_withdrawal == 1003 and granted_refund_cents == 33625   # f > 1000 -> 75% tier"
            - "both statutory variants equal 29900 — only the scheduled tier moved across the boundary"

  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_requires_offering_published
        grounds:
          - state_machines.CourseOffering.DRAFT_to_PUBLISHED
          - errors[ERR_OFFERING_NOT_OPEN]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair Enrollment -> CourseOffering: POST /enrollments is gated on the OFFERING's
          status (PUBLISHED); DRAFT rejects with ERR_OFFERING_NOT_OPEN, and the same call
          succeeds after publish. Distinct entity pair from the other instances.
        test_recipe:
          setup:
            - "LICENSED school; offering fully authorized but left in DRAFT; one student"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { err: $.data.error_id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id, ac: $.data.academic_status } }
          assert:
            - "while DRAFT: error_id == ERR_OFFERING_NOT_OPEN (http 409)"
            - "after publish: enrollment created with academic_status == ENROLLED and payment_status == PENDING"

      - name: publish_requires_course_state_authorization
        grounds:
          - state_machines.CourseOffering.DRAFT_to_PUBLISHED
          - errors[ERR_COURSE_NOT_AUTHORIZED_IN_STATE]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair CourseOffering -> CourseApproval: publish of an NM offering is rejected while
          the course holds only a TX approval (no APPROVED approval and no ACTIVE grant for
          NM); the instructor already holds an NM approval, isolating the course-authorization
          leg of the referential check.
        test_recipe:
          setup:
            - "LICENSED school; course ACTIVE with CourseApproval TX APPROVED only; instructor APPROVED in TX and NM; offering created for state NM"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap1: $.data.id } }
            - { call: "POST /instructor-approvals/${iap1}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "NM" }, as: Registrar, captures: { iap2: $.data.id } }
            - { call: "POST /instructor-approvals/${iap2}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "NM", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "DISTANCE" }, as: SchoolDirector, captures: { off: $.data.id } }
          trigger:
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COURSE_NOT_AUTHORIZED_IN_STATE (http 422)   # no APPROVED NM approval and no ACTIVE NM grant"
            - "CourseOffering.${off}.status remains DRAFT"

      - name: attempt_requires_seat_time_met
        grounds:
          - state_machines.ExamAttempt.SCHEDULED (initial)
          - state_machines.Enrollment.IN_PROGRESS_to_SEAT_TIME_MET
          - errors[ERR_SEAT_TIME_NOT_MET]
        distinguishing_aspect: |
          Pair ExamAttempt -> Enrollment: attempt creation is gated on the ENROLLMENT's
          academic_status == SEAT_TIME_MET; rejected from ENROLLED, allowed after the
          seat-time auto-transition. Distinct pair from the offering- and publish-gates.
        test_recipe:
          setup:
            - "LICENSED school; course required 60 min; PUBLISHED offering; one enrollment with zero attendance (ENROLLED); proctor instructor on staff"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-60", title: "Fast Course", course_type: "PRE_LICENSING", required_seat_minutes: 60, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Pat Proctor", license_number: "INS-002" }, as: Registrar, captures: { pro: $.data.id } }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id } }
          trigger:
            - { call: "POST /enrollments/${enr}/exam-attempts", payload: { scheduled_at: "2026-09-11T14:00:00Z", proctor_instructor_id: "${pro}" }, as: Registrar, captures: { err: $.data.error_id } }
            - { call: "POST /enrollments/${enr}/attendance-records", payload: { session_date: "2026-09-03", minutes: 60 }, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /enrollments/${enr}/exam-attempts", payload: { scheduled_at: "2026-09-11T14:00:00Z", proctor_instructor_id: "${pro}" }, as: Registrar, captures: { att: $.data.id, an: $.data.attempt_number } }
          assert:
            - "while ENROLLED: error_id == ERR_SEAT_TIME_NOT_MET (http 409)"
            - "after 60 VERIFIED minutes (SEAT_TIME_MET): attempt created with attempt_number == 1 and status == SCHEDULED"

      - name: publish_via_equivalency_grant_but_instructor_not_approved
        grounds:
          - state_machines.CourseOffering.DRAFT_to_PUBLISHED
          - state_machines.EquivalencyGrant (initial ACTIVE)
          - errors[ERR_INSTRUCTOR_NOT_APPROVED_IN_STATE]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair CourseOffering -> InstructorApproval: with an ACTIVE equivalency grant
          satisfying the course-authorization leg for NM, publish still fails on the
          instructor-approval leg (instructor APPROVED only in TX) — proving the two
          referential checks are independent and ordered (course authorization first).
        test_recipe:
          setup:
            - "LICENSED school; course ACTIVE with TX approval; ACTIVE EquivalencyGrant TX -> NM; instructor APPROVED in TX only; NM offering created"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector, captures: { cv: $.data.version } }
            - { call: "POST /equivalency-grants", payload: { course_id: "${crs}", home_state_code: "TX", recognized_state_code: "NM", expected_course_version: "${cv}" }, as: ComplianceOfficer, captures: { gr: $.data.id } }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "NM", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "DISTANCE" }, as: SchoolDirector, captures: { off: $.data.id } }
          trigger:
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector, captures: { err: $.data.error_id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "NM" }, as: Registrar, captures: { iap2: $.data.id } }
            - { call: "POST /instructor-approvals/${iap2}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector, captures: { ost: $.data.status } }
          assert:
            - "first publish: error_id == ERR_INSTRUCTOR_NOT_APPROVED_IN_STATE (http 422)   # grant satisfied course-auth; instructor leg failed"
            - "after NM instructor approval: publish succeeds, status == PUBLISHED         # grant-based authorization accepted"

  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: student_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_STUDENT_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource: Student; interval semantics: half-open [start_date, end_date) with
          adjacency ALLOWED — an offering starting 2026-09-10 does not collide with one
          ending 2026-09-10, but 2026-09-09 does. Different resource and semantics from the
          instructor rest-gap and proctor day-granularity rules.
        test_recipe:
          setup:
            - "LICENSED school; three PUBLISHED offerings of the same course with distinct instructors (rest-gap n/a): A 2026-09-01..2026-09-10, B 2026-09-10..2026-09-20, C 2026-09-09..2026-09-15; one student"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ins A", license_number: "INS-001" }, as: Registrar, captures: { i1: $.data.id } }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ins B", license_number: "INS-002" }, as: Registrar, captures: { i2: $.data.id } }
