scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on
  # DIFFERENT entity domains (risk scoring on IntakeAssessment vs
  # session entitlement on CareEpisode).
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_screening_vs_audit_variant_divergence
        grounds:
          - calculations.intake_risk_score
          - entities.IntakeAssessment.fields.risk_points
          - entities.IntakeAssessment.fields.risk_band
        distinguishing_aspect: |
          Same raw inputs (phq9=10, gad7=8, ideation=true, attempt=true) produce
          risk_points 54 / band HIGH under the persisted screening_variant
          (attempt multiplier applied, ideation bonus skipped via elif) versus
          risk_points 99 / band CRITICAL under the report-only audit_variant
          (bonus added BEFORE multiplier) — dual-variant logic on the
          IntakeAssessment domain.
        test_recipe:
          setup:
            - "One student S, one counselor C acting as screener; logical clock at default"
          setup_api_calls:
            - call: "POST /ucc/students"
              payload: { student_number: "S100", full_name: "Case One", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s_id: $.data.id }
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-1", full_name: "Screener One", specialties: ["TRIAGE"], weekly_individual_capacity: 10, max_caseload_risk_points: 500 }
              as: ClinicalDirector
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s_id}", screener_id: "${c_id}", phq9_score: 10, gad7_score: 8, ideation_flag: true, recent_attempt_flag: true }
              as: TriageScreener
              as_user_id: "${c_id}"
              captures: { ia_points: $.data.risk_points, ia_band: $.data.risk_band }
          assert:
            - "IntakeAssessment.risk_points == 54 (screening variant: (10+8)*3, ideation bonus skipped by elif)"
            - "IntakeAssessment.risk_band == HIGH"
            - "Audit-variant evaluation of the same inputs would be (10+8+15)*3 = 99 -> CRITICAL; the persisted record MUST NOT equal 99"

      - name: session_limit_standard_vs_intersession_variant_divergence
        grounds:
          - calculations.session_limit_for_episode
          - entities.CareEpisode.fields.session_limit
          - state_machines.IntakeAssessment.PENDING_to_SHORT_TERM_CARE
        distinguishing_aspect: |
          A MODERATE-band STUDENT_FEE episode created under a PUBLISHED policy
          with base_session_limit 8 receives session_limit 8 (standard_term
          variant); an identical student profile created in a term with NO
          published policy receives session_limit 6 (intersession_default
          variant, DEFAULT_INTERSESSION_BASE=6) — dual-variant logic on the
          CareEpisode domain, distinct from the IntakeAssessment domain of the
          sibling instance.
        test_recipe:
          setup:
            - "Counselor C exists; two MODERATE-band students S1 (term with published policy) and S2 (intersession term)"
            - "PUBLISHED policy for 2026-FALL with base_session_limit 8"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-2", full_name: "Counselor Two", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c2_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol_id: $.data.id }
            - call: "POST /ucc/policies/${pol_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S200", full_name: "Std Term", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s1_id: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "S201", full_name: "Intersession Term", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s2_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s1_id}", screener_id: "${c2_id}", phq9_score: 10, gad7_score: 5, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c2_id}"
              captures: { ia1_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s2_id}", screener_id: "${c2_id}", phq9_score: 10, gad7_score: 5, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c2_id}"
              captures: { ia2_id: $.data.id }
          trigger:
            - call: "POST /ucc/intake-assessments/${ia1_id}/complete"
              payload: { primary_counselor_id: "${c2_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c2_id}"
            - call: "POST /ucc/intake-assessments/${ia2_id}/complete"
              payload: { primary_counselor_id: "${c2_id}", academic_term: "2026-SUMMER" }
              as: TriageScreener
              as_user_id: "${c2_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s1_id}" }
              as: ClinicalDirector
              as_user_id: "${c2_id}"
              captures: { ep1_limit: "$.data[0].session_limit" }
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s2_id}" }
              as: ClinicalDirector
              as_user_id: "${c2_id}"
              captures: { ep2_limit: "$.data[0].session_limit" }
          assert:
            - "Episode(S1).session_limit == 8 (standard_term: base 8, MODERATE tier +0, STUDENT_FEE +0)"
            - "Episode(S2).session_limit == 6 (intersession_default: DEFAULT_INTERSESSION_BASE 6, MODERATE +0, STUDENT_FEE +0)"
            - "Episode(S1).session_limit != Episode(S2).session_limit"

  # =====================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # (a) multi-input non-linear: session_limit_for_episode (band tier ×
  #     funding adjust × floor).
  # (c) evaluation-order-pinned circular-looking: capacity_utilization_report
  #     (utilization depends on delivered and bookable, both computed in a
  #     pinned order; bps rounding applied last).
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_limit_tier_funding_floor_combinatorics
        grounds:
          - calculations.session_limit_for_episode
          - entities.CareEpisode.fields.session_limit
        distinguishing_aspect: |
          Mode (a) combinatorial: session_limit = max(MIN_LIMIT, tier_base(band)
          + funding_adjust(model)) — a 4×3 tier matrix with a floor; the four
          nested inputs (base_session_limit, band, funding_model, MIN_LIMIT)
          interact non-linearly (floor binds only for small bases).
        test_recipe:
          setup:
            - "PUBLISHED policy 2026-FALL base_session_limit 8; counselor C capacity 1000 risk points"
            - "Three students with band/funding combos exercised through episode creation: (LOW, INSURANCE), (MODERATE, INSURANCE); plus a HIGH-band student to evidence the routing branch of the tier matrix"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-3", full_name: "Counselor Three", specialties: ["GEN"], weekly_individual_capacity: 40, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c3_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol3_id: $.data.id }
            - call: "POST /ucc/policies/${pol3_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S300", full_name: "Low Ins", enrollment_status: "ENROLLED", funding_model: "INSURANCE" }
              as: FrontDesk
              captures: { s_li: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "S301", full_name: "High Split", enrollment_status: "ENROLLED", funding_model: "SPLIT" }
              as: FrontDesk
              captures: { s_hs: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "S303", full_name: "Mod Ins", enrollment_status: "ENROLLED", funding_model: "INSURANCE" }
              as: FrontDesk
              captures: { s_mi: $.data.id }
            # LOW band: phq9+gad7 in [0,15) no flags => 5
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s_li}", screener_id: "${c3_id}", phq9_score: 3, gad7_score: 2, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c3_id}"
              captures: { ia_li: $.data.id }
            # HIGH band: 35..59 => 20+20=40
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s_hs}", screener_id: "${c3_id}", phq9_score: 20, gad7_score: 20, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c3_id}"
              captures: { ia_hs: $.data.id }
            # MODERATE band: 15..34 => 10+8=18
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s_mi}", screener_id: "${c3_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c3_id}"
              captures: { ia_mi: $.data.id }
          trigger:
            - call: "POST /ucc/intake-assessments/${ia_li}/complete"
              payload: { primary_counselor_id: "${c3_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c3_id}"
            - call: "POST /ucc/intake-assessments/${ia_hs}/complete"
              payload: {}
              as: TriageScreener
              as_user_id: "${c3_id}"
            - call: "POST /ucc/intake-assessments/${ia_mi}/complete"
              payload: { primary_counselor_id: "${c3_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c3_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s_li}" }
              as: ClinicalDirector
              as_user_id: "${c3_id}"
              captures: { lim_li: "$.data[0].session_limit" }
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s_mi}" }
              as: ClinicalDirector
              as_user_id: "${c3_id}"
              captures: { lim_mi: "$.data[0].session_limit" }
            - call: "GET /ucc/referrals"
              payload: { student_id: "${s_hs}" }
              as: ReferralCoordinator
              captures: { ref_hs_status: "$.data[0].status" }
          assert:
            - "Episode(LOW,INSURANCE).session_limit == 5   # max(2, (8-2) + (-1))"
            - "Episode(MODERATE,INSURANCE).session_limit == 7   # max(2, 8 + (-1))"
            # HIGH band routes to COMMUNITY_REFERRAL (no episode) — the tier matrix entry
            # HIGH/INSURANCE == 11 exists in the formula even though routing bypasses it;
            # observable consequence: referral created PENDING, zero episodes for s_hs.
            - "Referral for s_hs exists with status PENDING (HIGH routing) and GET /ucc/episodes?student_id=s_hs returns an empty list"
      - name: capacity_report_evaluation_order_pinned
        grounds:
          - calculations.capacity_utilization_report
          - "endpoints[GET /ucc/reports/capacity]"
        distinguishing_aspect: |
          Mode (c) evaluation-order-pinned: utilization_bps depends on
          delivered_minutes and bookable_minutes, both derived aggregates; the
          formula pins (1) delivered from terminal COMPLETED sessions, (2)
          bookable from active counselors, (3) division + single half-up
          rounding to basis points LAST. With 2 active counselors at 10/week
          and 225 delivered minutes the result is exactly 125 bps — any other
          evaluation or rounding order yields a different integer.
        test_recipe:
          setup:
            - "PUBLISHED policy 2026-FALL base 8, strike limit 3, cancel window 24"
            - "Two active counselors A and B, weekly_individual_capacity 10 each"
            - "Student S with MODERATE STUDENT_FEE episode (limit 8) under counselor A"
            - "Four sessions booked, moved to the past via clock, completed: 3×60min + 1×45min"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-A", full_name: "Coun A", specialties: ["GEN"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { ca_id: $.data.id }
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-B", full_name: "Coun B", specialties: ["GEN"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol4_id: $.data.id }
            - call: "POST /ucc/policies/${pol4_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S400", full_name: "Rep Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s4_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s4_id}", screener_id: "${ca_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${ca_id}"
              captures: { ia4_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia4_id}/complete"
              payload: { primary_counselor_id: "${ca_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${ca_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s4_id}" }
              as: Counselor
              as_user_id: "${ca_id}"
              captures: { ep4_id: "$.data[0].id", ep4_v: "$.data[0].version" }
            - call: "POST /ucc/episodes/${ep4_id}/sessions"
              payload: { counselor_id: "${ca_id}", starts_at: "2026-08-02T14:00:00Z", duration_minutes: 60, expected_episode_version: "${ep4_v}" }
              as: FrontDesk
              captures: { ses1: $.data.id }
            - call: "POST /ucc/episodes/${ep4_id}/sessions"
              payload: { counselor_id: "${ca_id}", starts_at: "2026-08-02T16:00:00Z", duration_minutes: 60, expected_episode_version: "${ep4_v} + 1" }
              as: FrontDesk
              captures: { ses2: $.data.id }
            - call: "POST /ucc/episodes/${ep4_id}/sessions"
              payload: { counselor_id: "${ca_id}", starts_at: "2026-08-03T14:00:00Z", duration_minutes: 60, expected_episode_version: "${ep4_v} + 2" }
              as: FrontDesk
              captures: { ses3: $.data.id }
            - call: "POST /ucc/episodes/${ep4_id}/sessions"
              payload: { counselor_id: "${ca_id}", starts_at: "2026-08-03T16:00:00Z", duration_minutes: 45, expected_episode_version: "${ep4_v} + 3" }
              as: FrontDesk
              captures: { ses4: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ClinicalDirector
          trigger:
            - call: "POST /ucc/sessions/${ses1}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${ca_id}"
            - call: "POST /ucc/sessions/${ses2}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${ca_id}"
            - call: "POST /ucc/sessions/${ses3}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${ca_id}"
            - call: "POST /ucc/sessions/${ses4}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${ca_id}"
            - call: "GET /ucc/reports/capacity"
              payload: { academic_term: "2026-FALL" }
              as: ClinicalDirector
              as_user_id: "${ca_id}"
              captures: { rep_bps: $.data.utilization_bps, rep_deliv: $.data.delivered_minutes, rep_book: $.data.bookable_minutes }
          assert:
            - "report.delivered_minutes == 225   # 60+60+60+45"
            - "report.bookable_minutes == 18000 # 2 counselors * 10/wk * 60min * 15 wk"
            - "report.utilization_bps == 125     # round_half_up(10000*225/18000)=125"

  # =====================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on
  # DIFFERENT entities (CrisisVisit cycle; CommunityReferral loop).
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: crisis_visit_escalation_cycle
        grounds:
          - state_machines.CrisisVisit.STABILIZED_to_ESCALATED
          - state_machines.CrisisVisit.ESCALATED_to_STABILIZED
          - state_machines.CrisisVisit.STABILIZED_to_DISPOSITIONED
        distinguishing_aspect: |
          CrisisVisit has a genuine cycle STABILIZED -> ESCALATED -> STABILIZED
          (de-escalation loop) before terminal DISPOSITIONED — cyclic shape on
          the CrisisVisit entity, distinct from the referral loop entity.
        test_recipe:
          setup:
            - "CLAIMED WALK_IN shift by counselor C covering 2026-08-01; student S checked in"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-5", full_name: "Crisis Coun", specialties: ["CRISIS"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c5_id: $.data.id }
            - call: "POST /ucc/crisis-shifts"
              payload: { coverage_date: "2026-08-01", shift_kind: "WALK_IN", starts_at: "2026-08-01T08:00:00Z", ends_at: "2026-08-01T20:00:00Z" }
              as: ClinicalDirector
              captures: { sh5_id: $.data.id, sh5_v: $.data.version }
            - call: "POST /ucc/crisis-shifts/${sh5_id}/claim"
              payload: { expected_crisis_shift_version: "${sh5_v}" }
              as: Counselor
              as_user_id: "${c5_id}"
            - call: "POST /ucc/students"
              payload: { student_number: "S500", full_name: "Crisis Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s5_id: $.data.id }
            - call: "POST /ucc/crisis-visits"
              payload: { student_id: "${s5_id}", shift_id: "${sh5_id}", presenting_risk_band: "HIGH" }
              as: TriageScreener
              as_user_id: "${c5_id}"
              captures: { cv5_id: $.data.id }
            - call: "POST /ucc/crisis-visits/${cv5_id}/room"
              payload: {}
              as: Counselor
              as_user_id: "${c5_id}"
            - call: "POST /ucc/crisis-visits/${cv5_id}/stabilize"
              payload: {}
              as: Counselor
              as_user_id: "${c5_id}"
          trigger:
            - call: "POST /ucc/crisis-visits/${cv5_id}/escalate"
              payload: {}
              as: Counselor
              as_user_id: "${c5_id}"
              captures: { cv_st1: $.data.status }
            - call: "POST /ucc/crisis-visits/${cv5_id}/stabilize"
              payload: {}
              as: Counselor
              as_user_id: "${c5_id}"
              captures: { cv_st2: $.data.status }
            - call: "POST /ucc/crisis-visits/${cv5_id}/disposition"
              payload: { disposition: "RETURN_TO_CARE" }
              as: Counselor
              as_user_id: "${c5_id}"
              captures: { cv_st3: $.data.status, cv_disp: $.data.disposition }
          assert:
            - "after escalate: CrisisVisit.status == ESCALATED"
            - "after second stabilize: CrisisVisit.status == STABILIZED (cycle closed)"
            - "after disposition: CrisisVisit.status == DISPOSITIONED and disposition == RETURN_TO_CARE"
            - "a new CareEpisode for student S exists with status OPEN (RETURN_TO_CARE side effect)"
      - name: referral_decline_rematch_loop
        grounds:
          - state_machines.CommunityReferral.MATCHED_to_DECLINED
          - state_machines.CommunityReferral.DECLINED_to_PENDING
          - errors[ERR_REFERRAL_LOOP_EXHAUSTED]
        distinguishing_aspect: |
          CommunityReferral cycles PENDING -> MATCHED -> DECLINED -> PENDING up
          to 3 times before ERR_REFERRAL_LOOP_EXHAUSTED — a bounded cyclic
          machine on the referral entity, distinct from the CrisisVisit cycle.
        test_recipe:
          setup:
            - "HIGH-band student S routed to COMMUNITY_REFERRAL at intake; referral R created PENDING"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-6", full_name: "Coun Six", specialties: ["GEN"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c6_id: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "S600", full_name: "Ref Stud", enrollment_status: "ENROLLED", funding_model: "INSURANCE" }
              as: FrontDesk
              captures: { s6_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s6_id}", screener_id: "${c6_id}", phq9_score: 20, gad7_score: 20, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c6_id}"
              captures: { ia6_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia6_id}/complete"
              payload: {}
              as: TriageScreener
              as_user_id: "${c6_id}"
            - call: "GET /ucc/referrals"
              payload: { student_id: "${s6_id}" }
              as: ReferralCoordinator
              captures: { r6_id: "$.data[0].id" }
            - call: "POST /ucc/referrals/${r6_id}/match"
              payload: { provider_name: "ProvA", provider_specialty: "GEN" }
              as: ReferralCoordinator
          trigger:
            - call: "POST /ucc/referrals/${r6_id}/decline"
              payload: {}
              as: ReferralCoordinator
              captures: { r_st1: $.data.status }
            - call: "POST /ucc/referrals/${r6_id}/rematch"
              payload: {}
              as: ReferralCoordinator
              captures: { r_st2: $.data.status }
            - call: "POST /ucc/referrals/${r6_id}/match"
              payload: { provider_name: "ProvB", provider_specialty: "GEN" }
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/decline"
              payload: {}
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/rematch"
              payload: {}
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/match"
              payload: { provider_name: "ProvC", provider_specialty: "GEN" }
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/decline"
              payload: {}
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/rematch"
              payload: {}
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/match"
              payload: { provider_name: "ProvD", provider_specialty: "GEN" }
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/decline"
              payload: {}
              as: ReferralCoordinator
            - call: "POST /ucc/referrals/${r6_id}/rematch"
              payload: {}
              as: ReferralCoordinator
              captures: { err_loop: $.data.error_id }
          assert:
            - "first decline -> DECLINED; first rematch -> PENDING (loop count 1)"
            - "after 3 full decline/rematch loops the 4th rematch is rejected with ERR_REFERRAL_LOOP_EXHAUSTED"
            - "CommunityReferral.status remains DECLINED after the rejected rematch"

  # =====================================================================
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers,
  # one depth >= 3, one depth >= 2.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: noshow_strike_posture_future_session_cascade
        grounds:
          - state_machines.Session.SCHEDULED_to_NO_SHOW_CHARGED
          - state_machines.Student.CLEAR_to_SUSPENDED
          - calculations.no_show_strike_total
          - calculations.session_consumption_ledger
        distinguishing_aspect: |
          Depth-3 cascade triggered by mark-no-show: Session->NO_SHOW_CHARGED
          (link 1) recomputes no_show_strike_total causing
          Student CLEAR->SUSPENDED (link 2), whose side effect force-cancels
          every future SCHEDULED session of the student (link 3, each session
          mutation). Each link is caused by the previous link, not the
          original request.
        test_recipe:
          setup:
            - "PUBLISHED policy 2026-FALL strike limit 2, base 8, cancel window 24"
            - "Student S (MODERATE STUDENT_FEE, episode limit 8) with 3 future sessions booked: ses_past (to be no-showed), ses_f1, ses_f2"
            - "S already has 1 prior NO_SHOW_CHARGED in the term (strike count 1)"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-7", full_name: "Coun Seven", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c7_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 2, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol7_id: $.data.id }
            - call: "POST /ucc/policies/${pol7_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S700", full_name: "Cascade Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s7_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s7_id}", screener_id: "${c7_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c7_id}"
              captures: { ia7_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia7_id}/complete"
              payload: { primary_counselor_id: "${c7_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c7_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s7_id}" }
              as: Counselor
              as_user_id: "${c7_id}"
              captures: { ep7_id: "$.data[0].id", ep7_v: "$.data[0].version" }
            # session #1 in the past -> will become the first strike
            - call: "POST /ucc/episodes/${ep7_id}/sessions"
              payload: { counselor_id: "${c7_id}", starts_at: "2026-08-02T10:00:00Z", duration_minutes: 60, expected_episode_version: "${ep7_v}" }
              as: FrontDesk
              captures: { ses7a: $.data.id }
            # session #2 also past -> the second strike that trips SUSPENDED
            - call: "POST /ucc/episodes/${ep7_id}/sessions"
              payload: { counselor_id: "${c7_id}", starts_at: "2026-08-02T12:00:00Z", duration_minutes: 60, expected_episode_version: "${ep7_v} + 1" }
              as: FrontDesk
              captures: { ses7b: $.data.id }
            # two FUTURE sessions that the SUSPENDED cascade must cancel
            - call: "POST /ucc/episodes/${ep7_id}/sessions"
              payload: { counselor_id: "${c7_id}", starts_at: "2026-08-10T10:00:00Z", duration_minutes: 60, expected_episode_version: "${ep7_v} + 2" }
              as: FrontDesk
              captures: { ses7c: $.data.id }
            - call: "POST /ucc/episodes/${ep7_id}/sessions"
              payload: { counselor_id: "${c7_id}", starts_at: "2026-08-11T10:00:00Z", duration_minutes: 60, expected_episode_version: "${ep7_v} + 3" }
              as: FrontDesk
              captures: { ses7d: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /ucc/sessions/${ses7a}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${c7_id}"
          trigger:
            - call: "POST /ucc/sessions/${ses7b}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${c7_id}"
              captures: { ses7b_st: $.data.status }
            - call: "GET /ucc/students/${s7_id}"
              payload: {}
              as: ClinicalDirector
              as_user_id: "${c7_id}"
              captures: { s7_posture: $.data.booking_posture, s7_strikes: $.data.no_show_strike_count }
            - call: "GET /ucc/sessions/${ses7c}"
              payload: {}
              as: Counselor
              as_user_id: "${c7_id}"
              captures: { ses7c_st: $.data.status }
            - call: "GET /ucc/sessions/${ses7d}"
              payload: {}
              as: Counselor
              as_user_id: "${c7_id}"
              captures: { ses7d_st: $.data.status }
          assert:
            - "ses7b.status == NO_SHOW_CHARGED (link 1)"
            - "Student.no_show_strike_count == 2 and Student.booking_posture == SUSPENDED (link 2: strike recompute crossed limit 2)"
            - "ses7c.status == CANCELLED_TIMELY with cancellation_reason 'POLICY_SUSPENSION' (link 3a)"
            - "ses7d.status == CANCELLED_TIMELY (link 3b) — cascade reached depth 3"
      - name: referral_accept_episode_session_cascade
        grounds:
          - state_machines.CommunityReferral.MATCHED_to_ACCEPTED
          - state_machines.CareEpisode.OPEN_to_REFERRED_OUT
          - calculations.counselor_caseload_load
        distinguishing_aspect: |
          Depth-2 cascade triggered by referral acceptance: Referral
          MATCHED->ACCEPTED (link 1) flips the linked episode OPEN->
          REFERRED_OUT (link 2), whose side effect cancels the episode's
          remaining SCHEDULED sessions (link 3 of the propagation, second
          cascade instance overall with distinct trigger from the no-show
          cascade).
        test_recipe:
          setup:
            - "Student S with OPEN episode (MODERATE, INSURANCE, limit 7) and one future SCHEDULED session"
            - "Exhaustion-free: referral created manually via HIGH-band intake is not used; instead the episode is linked to a referral by first exhausting — simpler: use a HIGH-band student whose referral is pending AND who has no episode; instead use an OPEN episode then trigger EXHAUSTED path? No — use two students: S_open with OPEN episode + future session + a PENDING referral created by a second HIGH intake is impossible (one intake one disposition). Use: referral created at intake (HIGH), then acceptance cascade asserted on referral side; for the episode branch use an EXHAUSTED episode created via completions."
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-8", full_name: "Coun Eight", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c8_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 4, no_show_strike_limit: 5, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol8_id: $.data.id }
            - call: "POST /ucc/policies/${pol8_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S800", full_name: "Exhaust Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s8_id: $.data.id }
            # MODERATE band -> episode limit 4
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s8_id}", screener_id: "${c8_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c8_id}"
              captures: { ia8_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia8_id}/complete"
              payload: { primary_counselor_id: "${c8_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c8_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s8_id}" }
              as: Counselor
              as_user_id: "${c8_id}"
              captures: { ep8_id: "$.data[0].id", ep8_v: "$.data[0].version" }
            - call: "POST /ucc/episodes/${ep8_id}/sessions"
              payload: { counselor_id: "${c8_id}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep8_v}" }
              as: FrontDesk
              captures: { s8_a: $.data.id }
            - call: "POST /ucc/episodes/${ep8_id}/sessions"
              payload: { counselor_id: "${c8_id}", starts_at: "2026-08-02T11:00:00Z", duration_minutes: 60, expected_episode_version: "${ep8_v} + 1" }
              as: FrontDesk
              captures: { s8_b: $.data.id }
            - call: "POST /ucc/episodes/${ep8_id}/sessions"
              payload: { counselor_id: "${c8_id}", starts_at: "2026-08-02T13:00:00Z", duration_minutes: 60, expected_episode_version: "${ep8_v} + 2" }
              as: FrontDesk
              captures: { s8_c: $.data.id }
            - call: "POST /ucc/episodes/${ep8_id}/sessions"
              payload: { counselor_id: "${c8_id}", starts_at: "2026-08-02T15:00:00Z", duration_minutes: 60, expected_episode_version: "${ep8_v} + 3" }
              as: FrontDesk
              captures: { s8_d: $.data.id }
            # one extra future session to observe the EXHAUSTED cascade cancel
            - call: "POST /ucc/episodes/${ep8_id}/sessions"
              payload: { counselor_id: "${c8_id}", starts_at: "2026-08-12T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep8_v} + 4" }
              as: FrontDesk
              captures: { s8_e: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /ucc/sessions/${s8_a}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c8_id}"
            - call: "POST /ucc/sessions/${s8_b}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c8_id}"
            - call: "POST /ucc/sessions/${s8_c}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c8_id}"
            # 4th completion crosses limit 4 -> EXHAUSTED + exhaustion referral + cancel of s8_e
            - call: "POST /ucc/sessions/${s8_d}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c8_id}"
            - call: "GET /ucc/referrals"
              payload: { student_id: "${s8_id}" }
              as: ReferralCoordinator
              captures: { r8_id: "$.data[0].id" }
            - call: "POST /ucc/referrals/${r8_id}/match"
              payload: { provider_name: "ProvX", provider_specialty: "GEN" }
              as: ReferralCoordinator
          trigger:
            - call: "POST /ucc/referrals/${r8_id}/accept"
              payload: {}
              as: ReferralCoordinator
              captures: { r8_st: $.data.status }
            - call: "GET /ucc/episodes/${ep8_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c8_id}"
              captures: { ep8_st: $.data.status }
            - call: "GET /ucc/sessions/${s8_e}"
              payload: {}
              as: Counselor
              as_user_id: "${c8_id}"
              captures: { s8e_st: $.data.status }
          assert:
            - "Referral.status == ACCEPTED (trigger)"
            - "Episode.status == REFERRED_OUT (link: EXHAUSTED->REFERRED_OUT on accept)"
            - "ses_e.status == CANCELLED_TIMELY — cancelled by the EXHAUSTED cascade at the 4th completion (cancellation_reason 'EPISODE_EXHAUSTED'), proving the chain completion->ledger->episode->session fired end to end"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict: two dual-failure
  # scenarios over DIFFERENT error-category pairs.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: constraint_vs_fiscal_on_session_booking
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_SCHEDULE_CONFLICT]
          - errors[ERR_BOOKING_SUSPENDED]
        distinguishing_aspect: |
          Pair (business_constraint, business_fiscal): a booking request that
          violates BOTH the counselor-overlap constraint (p9) and the
          booking-posture fiscal gate (p11) in a single payload MUST be
          rejected with the constraint error ERR_SCHEDULE_CONFLICT — the
          scaffold pins business_constraint strictly before business_fiscal,
          so the fiscal error ERR_BOOKING_SUSPENDED is masked even though the
          student is SUSPENDED.
        test_recipe:
          setup:
            - "PUBLISHED policy base 4, strike limit 2, window 24"
            - "Student S9 (MODERATE STUDENT_FEE episode, limit 4) with 2 past sessions, both marked chargeable no-show -> strikes == 2 -> posture SUSPENDED (p11 armed)"
            - "Second student S9b (same counselor) holds a SCHEDULED session at 2026-08-05T09:00 booked AFTER the cascade (per-student cascade cannot touch it) — arms the p9 overlap for the trigger"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-9", full_name: "Coun Nine", specialties: ["GEN"], weekly_individual_capacity: 30, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c9_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 4, no_show_strike_limit: 2, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol9_id: $.data.id }
            - call: "POST /ucc/policies/${pol9_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S900", full_name: "Dual Fail", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s9_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s9_id}", screener_id: "${c9_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c9_id}"
              captures: { ia9_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia9_id}/complete"
              payload: { primary_counselor_id: "${c9_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c9_id}"
            # second student S9b under the SAME counselor: provides the
            # colliding SCHEDULED session that the SUSPENDED cascade on S9
            # cannot touch (cascade is per-student).
            - call: "POST /ucc/students"
              payload: { student_number: "S901", full_name: "Other Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s9b_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s9b_id}", screener_id: "${c9_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c9_id}"
              captures: { ia9b_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia9b_id}/complete"
              payload: { primary_counselor_id: "${c9_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c9_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s9b_id}" }
              as: Counselor
              as_user_id: "${c9_id}"
              captures: { ep9b_id: "$.data[0].id", ep9b_v: "$.data[0].version" }
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s9_id}" }
              as: Counselor
              as_user_id: "${c9_id}"
              captures: { ep9_id: "$.data[0].id", ep9_v: "$.data[0].version" }
            - call: "POST /ucc/episodes/${ep9_id}/sessions"
              payload: { counselor_id: "${c9_id}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep9_v}" }
              as: FrontDesk
              captures: { s9_a: $.data.id }
            - call: "POST /ucc/episodes/${ep9_id}/sessions"
              payload: { counselor_id: "${c9_id}", starts_at: "2026-08-02T11:00:00Z", duration_minutes: 60, expected_episode_version: "${ep9_v} + 1" }
              as: FrontDesk
              captures: { s9_b: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
            # Two chargeable no-shows -> strikes 2 -> SUSPENDED (limit 2)
            - call: "POST /ucc/sessions/${s9_a}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${c9_id}"
            - call: "POST /ucc/sessions/${s9_b}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${c9_id}"
            # S9 is now SUSPENDED. Book a FUTURE session for the OTHER student
            # S9b at 2026-08-05T09:00 — survives S9's cascade (per-student).
            - call: "POST /ucc/episodes/${ep9b_id}/sessions"
              payload: { counselor_id: "${c9_id}", starts_at: "2026-08-05T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep9b_v}" }
              as: FrontDesk
              captures: { s9b_ses: $.data.id }
            - call: "GET /ucc/episodes/${ep9_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c9_id}"
              captures: { ep9_v2: $.data.version }
          trigger:
            # Dual failure: (p9) counselor already holds S9b's session
            # [09:00,10:00) — new request 09:30 overlaps; AND (p11) S9's
            # posture is SUSPENDED. Constraint must mask fiscal.
            - call: "POST /ucc/episodes/${ep9_id}/sessions"
              payload: { counselor_id: "${c9_id}", starts_at: "2026-08-05T09:30:00Z", duration_minutes: 60, expected_episode_version: "${ep9_v2}" }
              as: FrontDesk
              captures: { err_dual: $.data.error_id }
          assert:
            - "error_id == ERR_SCHEDULE_CONFLICT — business_constraint (p9) masks business_fiscal (p11) even though the student is SUSPENDED"
            - "no Session is created for S9; CareEpisode(${ep9_id}).version unchanged by the rejected call"
            - "companion observation: the same booking at a NON-overlapping time (2026-08-05T11:00Z) would fail with ERR_BOOKING_SUSPENDED, proving both gates were armed"
      - name: business_safety_vs_business_referential_on_group_enrollment
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_RISK_BAND_VIOLATION]
          - errors[ERR_PROGRAM_NOT_OPEN]
        distinguishing_aspect: |
          Pair (business_safety, business_referential): enrolling a CRITICAL-
          band student (safety, p6) into a DRAFT program (referential/state
          gate, p14) violates both; safety outranks the program-state gate, so
          the winner is ERR_RISK_BAND_VIOLATION even though the program is
          also not OPEN.
        test_recipe:
          setup:
            - "CRITICAL-band student S (risk_points 60); GroupProgram G in DRAFT (never published)"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-10", full_name: "Coun Ten", specialties: ["GEN"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c10_id: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "S1000", full_name: "Crit Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s10_id: $.data.id }
            # CRITICAL: phq9+gad7=20 with attempt flag -> 60
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s10_id}", screener_id: "${c10_id}", phq9_score: 15, gad7_score: 5, ideation_flag: false, recent_attempt_flag: true }
              as: TriageScreener
              as_user_id: "${c10_id}"
              captures: { ia10_id: $.data.id, ia10_band: $.data.risk_band }
            - call: "POST /ucc/group-programs"
              payload: { title: "Stress Mgmt", facilitator_id: "${c10_id}", capacity: 6, meeting_day: "TUE", starts_at: "2026-09-01T17:00:00Z", weeks: 8, risk_band_ceiling: "HIGH" }
              as: Counselor
              as_user_id: "${c10_id}"
              captures: { g10_id: $.data.id }
          trigger:
            - call: "POST /ucc/group-programs/${g10_id}/enrollments"
              payload: { student_id: "${s10_id}" }
              as: FrontDesk
              captures: { err_dual2: $.data.error_id }
          assert:
            - "IntakeAssessment.risk_band == CRITICAL (60 = CRITICAL_MIN, inclusive lower edge)"
            - "error_id == ERR_RISK_BAND_VIOLATION — safety gate (p6) wins over program-not-OPEN (p14) even though both are violated"

  # =====================================================================
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT
  # metrics via DIFFERENT endpoints.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: risk_band_critical_min_inclusive_edge
        grounds:
          - calculations.intake_risk_score
          - entities.IntakeAssessment.fields.risk_band
        distinguishing_aspect: |
          Boundary on the risk_points metric via POST /ucc/intake-assessments:
          CRITICAL_MIN is inclusive (>=), so points == 60 yields CRITICAL while
          59 yields HIGH — exact boundary precision on band mapping.
        test_recipe:
          setup:
            - "Counselor C as screener; two students S59 and S60"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-11", full_name: "Coun Eleven", specialties: ["TRIAGE"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c11_id: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "S1159", full_name: "Edge59", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s59_id: $.data.id }
            - call: "POST /ucc/students"
              payload: { student_number: "S1160", full_name: "Edge60", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s60_id: $.data.id }
          trigger:
            # 59 points: phq9 20 + gad7 19 + ideation bonus 15 = 54? No — 20+19=39 already HIGH.
            # Construct exactly 59: 44 raw + 15 ideation = 59 (phq9 27 + gad7 17 = 44)
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s59_id}", screener_id: "${c11_id}", phq9_score: 27, gad7_score: 17, ideation_flag: true, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c11_id}"
              captures: { band59: $.data.risk_band, pts59: $.data.risk_points }
            # exactly 60: (15+5)*3 attempt = 60
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s60_id}", screener_id: "${c11_id}", phq9_score: 15, gad7_score: 5, ideation_flag: false, recent_attempt_flag: true }
              as: TriageScreener
              as_user_id: "${c11_id}"
              captures: { band60: $.data.risk_band, pts60: $.data.risk_points }
          assert:
            - "risk_points == 59 yields risk_band == HIGH (below CRITICAL_MIN)"
            - "risk_points == 60 yields risk_band == CRITICAL (>= CRITICAL_MIN, inclusive)"
      - name: session_limit_exact_crossing_on_consumption
        grounds:
          - calculations.session_consumption_ledger
          - state_machines.CareEpisode.OPEN_to_EXHAUSTED
          - errors[ERR_SESSION_LIMIT_REACHED]
        distinguishing_aspect: |
          Boundary on the sessions_consumed metric via POST
          /ucc/sessions/{id}/complete: with limit 2, the 2nd completion
          (consumed == limit exactly, >= semantics) flips the episode
          EXHAUSTED, and the next booking is rejected — the crossing happens
          AT equality, not above it.
        test_recipe:
          setup:
            - "PUBLISHED policy base_session_limit 4 -> LOW-band STUDENT_FEE episode limit = max(2, 4-2) = 2"
            - "Student with LOW band (limit exactly 2); 3 past sessions booked"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-12", full_name: "Coun Twelve", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c12_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 4, no_show_strike_limit: 5, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol12_id: $.data.id }
            - call: "POST /ucc/policies/${pol12_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S1200", full_name: "Limit Edge", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s12_id: $.data.id }
            # LOW: 3+2=5
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s12_id}", screener_id: "${c12_id}", phq9_score: 3, gad7_score: 2, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c12_id}"
              captures: { ia12_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia12_id}/complete"
              payload: { primary_counselor_id: "${c12_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c12_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s12_id}" }
              as: Counselor
              as_user_id: "${c12_id}"
              captures: { ep12_id: "$.data[0].id", ep12_v: "$.data[0].version", ep12_lim: "$.data[0].session_limit" }
            - call: "POST /ucc/episodes/${ep12_id}/sessions"
              payload: { counselor_id: "${c12_id}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep12_v}" }
              as: FrontDesk
              captures: { s12_a: $.data.id }
            - call: "POST /ucc/episodes/${ep12_id}/sessions"
              payload: { counselor_id: "${c12_id}", starts_at: "2026-08-02T11:00:00Z", duration_minutes: 60, expected_episode_version: "${ep12_v} + 1" }
              as: FrontDesk
              captures: { s12_b: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
          trigger:
            - call: "POST /ucc/sessions/${s12_a}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c12_id}"
            - call: "GET /ucc/episodes/${ep12_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c12_id}"
              captures: { ep12_st_mid: $.data.status }
            - call: "POST /ucc/sessions/${s12_b}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c12_id}"
            - call: "GET /ucc/episodes/${ep12_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c12_id}"
              captures: { ep12_st_end: $.data.status, ep12_consumed: $.data.sessions_consumed, ep12_v3: $.data.version }
            - call: "POST /ucc/episodes/${ep12_id}/sessions"
              payload: { counselor_id: "${c12_id}", starts_at: "2026-08-05T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep12_v3}" }
              as: FrontDesk
              captures: { err_lim: $.data.error_id }
          assert:
            - "session_limit == 2 (max(2, 4-2)+0 for LOW STUDENT_FEE)"
            - "after 1st completion: sessions_consumed == 1 and status == OPEN (below limit)"
            - "after 2nd completion: sessions_consumed == 2 == session_limit and status == EXHAUSTED (crossing AT equality, >= semantics)"
            - "subsequent booking fails with ERR_SESSION_LIMIT_REACHED"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency: two dependencies across
  # DIFFERENT entity pairs.
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: episode_close_blocked_by_scheduled_session
        grounds:
          - state_machines.CareEpisode.OPEN_to_CLOSED
          - entities.Session.fields.status
        distinguishing_aspect: |
          Pair CareEpisode->Session: the episode's OPEN->CLOSED transition is
          gated on the state of a DIFFERENT entity — no linked Session may be
          in {SCHEDULED, HELD}.
        test_recipe:
          setup:
            - "Student with OPEN episode and one future SCHEDULED session"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-13", full_name: "Coun Thirteen", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c13_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol13_id: $.data.id }
            - call: "POST /ucc/policies/${pol13_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S1300", full_name: "Close Block", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s13_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s13_id}", screener_id: "${c13_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c13_id}"
              captures: { ia13_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia13_id}/complete"
              payload: { primary_counselor_id: "${c13_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c13_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s13_id}" }
              as: Counselor
              as_user_id: "${c13_id}"
              captures: { ep13_id: "$.data[0].id", ep13_v: "$.data[0].version" }
            - call: "POST /ucc/episodes/${ep13_id}/sessions"
              payload: { counselor_id: "${c13_id}", starts_at: "2026-08-20T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep13_v}" }
              as: FrontDesk
              captures: { s13_a: $.data.id }
          trigger:
            - call: "POST /ucc/episodes/${ep13_id}/close"
              payload: {}
              as: Counselor
              as_user_id: "${c13_id}"
              captures: { err_close: $.data.error_id }
            - call: "POST /ucc/sessions/${s13_a}/cancel"
              payload: { cancellation_reason: "client request" }
              as: FrontDesk
            - call: "POST /ucc/episodes/${ep13_id}/close"
              payload: {}
              as: Counselor
              as_user_id: "${c13_id}"
              captures: { ep13_final: $.data.status }
          assert:
            - "first close fails with ERR_INVALID_STATE (a linked Session is SCHEDULED)"
            - "after the session is cancelled, close succeeds and Episode.status == CLOSED"
      - name: crisis_visit_room_requires_claimed_shift
        grounds:
          - state_machines.CrisisVisit.QUEUED_to_IN_ROOM
          - entities.CrisisShift.fields.status
        distinguishing_aspect: |
          Pair CrisisVisit->CrisisShift: a visit can only go IN_ROOM when its
          linked shift (different entity) is CLAIMED and the acting counselor
          is its claimed_by_id; releasing the shift first makes the room
          attempt fail the ownership gate (p2.5) with ERR_UNAUTHORIZED —
          distinct entity pair from CareEpisode->Session.
        test_recipe:
          setup:
            - "Shift claimed by counselor C; visit QUEUED; then shift RELEASED by C before rooming"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-14", full_name: "Coun Fourteen", specialties: ["CRISIS"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c14_id: $.data.id }
            - call: "POST /ucc/crisis-shifts"
              payload: { coverage_date: "2026-08-01", shift_kind: "WALK_IN", starts_at: "2026-08-01T08:00:00Z", ends_at: "2026-08-01T20:00:00Z" }
              as: ClinicalDirector
              captures: { sh14_id: $.data.id, sh14_v: $.data.version }
            - call: "POST /ucc/crisis-shifts/${sh14_id}/claim"
              payload: { expected_crisis_shift_version: "${sh14_v}" }
              as: Counselor
              as_user_id: "${c14_id}"
            - call: "POST /ucc/students"
              payload: { student_number: "S1400", full_name: "Visit Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s14_id: $.data.id }
            - call: "POST /ucc/crisis-visits"
              payload: { student_id: "${s14_id}", shift_id: "${sh14_id}", presenting_risk_band: "MODERATE" }
              as: TriageScreener
              as_user_id: "${c14_id}"
              captures: { cv14_id: $.data.id }
          trigger:
            - call: "POST /ucc/crisis-shifts/${sh14_id}/release"
              payload: {}
              as: Counselor
              as_user_id: "${c14_id}"
            - call: "POST /ucc/crisis-visits/${cv14_id}/room"
              payload: {}
              as: Counselor
              as_user_id: "${c14_id}"
              captures: { err_room: $.data.error_id }
          assert:
            - "after shift release, room attempt fails with ERR_UNAUTHORIZED (p2.5 ownership gate: claimed_by_id is null, actor is not the claimant)"
            - "CrisisVisit.status remains QUEUED"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with
  # DIFFERENT interval semantics on DIFFERENT resources.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: counselor_session_interval_overlap_half_open
        grounds:
          - validations[priority=9]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.Session.fields.starts_at
        distinguishing_aspect: |
          Resource = Counselor, interval semantics = half-open
          [starts_at, starts_at+duration): a second session beginning EXACTLY
          at the first session's end is legal (adjacent, no overlap), while
          one minute earlier collides — adjacency-legal semantics distinct
          from the shift-claim rule.
        test_recipe:
          setup:
            - "Student with OPEN episode (limit 8); counselor C; session 1 booked 09:00-10:00"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-15", full_name: "Coun Fifteen", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c15_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 5, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol15_id: $.data.id }
            - call: "POST /ucc/policies/${pol15_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S1500", full_name: "Overlap Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s15_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s15_id}", screener_id: "${c15_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c15_id}"
              captures: { ia15_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia15_id}/complete"
              payload: { primary_counselor_id: "${c15_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c15_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s15_id}" }
              as: Counselor
              as_user_id: "${c15_id}"
              captures: { ep15_id: "$.data[0].id", ep15_v: "$.data[0].version" }
            - call: "POST /ucc/episodes/${ep15_id}/sessions"
              payload: { counselor_id: "${c15_id}", starts_at: "2026-08-20T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep15_v}" }
              as: FrontDesk
          trigger:
            # overlapping: 09:59 start (1 minute before session 1 ends)
            - call: "POST /ucc/episodes/${ep15_id}/sessions"
              payload: { counselor_id: "${c15_id}", starts_at: "2026-08-20T09:59:00Z", duration_minutes: 60, expected_episode_version: "${ep15_v} + 1" }
              as: FrontDesk
              captures: { err_ov: $.data.error_id }
            # adjacent: exactly 10:00 start — must succeed under half-open semantics
            - call: "POST /ucc/episodes/${ep15_id}/sessions"
              payload: { counselor_id: "${c15_id}", starts_at: "2026-08-20T10:00:00Z", duration_minutes: 60, expected_episode_version: "${ep15_v} + 1" }
              as: FrontDesk
              captures: { ses15_adj: $.data.id }
          assert:
            - "booking at 09:59 fails with ERR_SCHEDULE_CONFLICT ([09:00,10:00) ∩ [09:59,10:59) ≠ ∅)"
            - "booking at exactly 10:00 succeeds (half-open adjacency is legal)"
      - name: crisis_shift_claim_overlap_aggregate_semantics
        grounds:
          - validations[priority=9]
          - state_machines.CrisisShift.UNCLAIMED_to_CLAIMED
          - errors[ERR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource = Counselor's claimed-shift set, interval semantics =
          any-overlap on [starts_at, ends_at) INCLUDING touching endpoints
          being legal but any interior intersection rejected across the
          claimant's whole shift portfolio (aggregate capacity 1 per instant)
          — a different resource entity (CrisisShift not Session) and
          different geometric treatment (whole-interval portfolio test vs
          pairwise half-open session test).
        test_recipe:
          setup:
            - "Counselor C has claimed shift A 08:00-12:00; shift B 12:00-16:00 exists (adjacent, legal); shift C 11:00-13:00 exists (straddles, illegal)"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-16", full_name: "Coun Sixteen", specialties: ["CRISIS"], weekly_individual_capacity: 10, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c16_id: $.data.id }
            - call: "POST /ucc/crisis-shifts"
              payload: { coverage_date: "2026-08-02", shift_kind: "WALK_IN", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T12:00:00Z" }
              as: ClinicalDirector
              captures: { shA_id: $.data.id, shA_v: $.data.version }
            - call: "POST /ucc/crisis-shifts"
              payload: { coverage_date: "2026-08-02", shift_kind: "WALK_IN", starts_at: "2026-08-02T12:00:00Z", ends_at: "2026-08-02T16:00:00Z" }
              as: ClinicalDirector
              captures: { shB_id: $.data.id, shB_v: $.data.version }
            - call: "POST /ucc/crisis-shifts"
              payload: { coverage_date: "2026-08-02", shift_kind: "AFTER_HOURS", starts_at: "2026-08-02T11:00:00Z", ends_at: "2026-08-02T13:00:00Z" }
              as: ClinicalDirector
              captures: { shC_id: $.data.id, shC_v: $.data.version }
            - call: "POST /ucc/crisis-shifts/${shA_id}/claim"
              payload: { expected_crisis_shift_version: "${shA_v}" }
              as: Counselor
              as_user_id: "${c16_id}"
          trigger:
            - call: "POST /ucc/crisis-shifts/${shC_id}/claim"
              payload: { expected_crisis_shift_version: "${shC_v}" }
              as: Counselor
              as_user_id: "${c16_id}"
              captures: { err_shc: $.data.error_id }
            - call: "POST /ucc/crisis-shifts/${shB_id}/claim"
              payload: { expected_crisis_shift_version: "${shB_v}" }
              as: Counselor
              as_user_id: "${c16_id}"
              captures: { shB_st: $.data.status }
          assert:
            - "claiming shift C (11:00-13:00) fails with ERR_SCHEDULE_CONFLICT (interior overlap with claimed 08:00-12:00)"
            - "claiming shift B (12:00-16:00, touching endpoint) succeeds — adjacency across the portfolio is legal"
            - "shift B status == CLAIMED and claimed_by_id == counselor C"

  # =====================================================================
  # Rule 9 — compensating_invariant: two invariants over DIFFERENT
  # conserved quantities.
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: noshow_charge_excuse_restores_consumption_and_strikes
        grounds:
          - state_machines.Session.SCHEDULED_to_NO_SHOW_CHARGED
          - state_machines.Session.NO_SHOW_CHARGED_to_NO_SHOW_EXCUSED
          - calculations.session_consumption_ledger
          - calculations.no_show_strike_total
        distinguishing_aspect: |
          Conserved quantity = (episode.sessions_consumed,
          student.no_show_strike_count) pair: forward NO_SHOW_CHARGED adds
          (+1,+1); compensating excuse removes (-1,-1); after the pair of
          actions both counters equal their pre-action values exactly — no
          drift in the consumption/strike ledger.
        test_recipe:
          setup:
            - "Student with OPEN episode (limit 8, consumed 0, strikes 0); one past session"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-17", full_name: "Coun Seventeen", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c17_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 8, no_show_strike_limit: 3, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol17_id: $.data.id }
            - call: "POST /ucc/policies/${pol17_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S1700", full_name: "Invariant Stud", enrollment_status: "ENROLLED", funding_model: "INSURANCE" }
              as: FrontDesk
              captures: { s17_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s17_id}", screener_id: "${c17_id}", phq9_score: 10, gad7_score: 8, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c17_id}"
              captures: { ia17_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia17_id}/complete"
              payload: { primary_counselor_id: "${c17_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c17_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s17_id}" }
              as: Counselor
              as_user_id: "${c17_id}"
              captures: { ep17_id: "$.data[0].id", ep17_v: "$.data[0].version" }
            - call: "POST /ucc/episodes/${ep17_id}/sessions"
              payload: { counselor_id: "${c17_id}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep17_v}" }
              as: FrontDesk
              captures: { ses17: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
          trigger:
            - call: "POST /ucc/sessions/${ses17}/mark-no-show"
              payload: { chargeable: true }
              as: Counselor
              as_user_id: "${c17_id}"
              captures: { ses17_billed: $.data.billed_amount_cents }
            - call: "GET /ucc/episodes/${ep17_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c17_id}"
              captures: { ep17_mid_consumed: $.data.sessions_consumed }
            - call: "GET /ucc/students/${s17_id}"
              payload: {}
              as: ClinicalDirector
              as_user_id: "${c17_id}"
              captures: { s17_mid_strikes: $.data.no_show_strike_count }
            - call: "POST /ucc/sessions/${ses17}/excuse"
              payload: {}
              as: ClinicalDirector
              as_user_id: "${c17_id}"
            - call: "GET /ucc/episodes/${ep17_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c17_id}"
              captures: { ep17_end_consumed: $.data.sessions_consumed }
            - call: "GET /ucc/students/${s17_id}"
              payload: {}
              as: ClinicalDirector
              as_user_id: "${c17_id}"
              captures: { s17_end_strikes: $.data.no_show_strike_count, s17_end_posture: $.data.booking_posture }
          assert:
            - "after charge: Session.billed_amount_cents == 6000 (NO_SHOW 7500 * INSURANCE share 0.80), consumed == 1, strikes == 1"
            - "after excuse: Session.billed_amount_cents == 0, episode.sessions_consumed == 0 (pre-action value), student.no_show_strike_count == 0"
            - "invariant holds: (consumed, strikes) after forward+compensate == (0, 0) == initial"
      - name: episode_exemption_conserves_completed_session_records
        grounds:
          - state_machines.CareEpisode.EXHAUSTED_to_OPEN
          - calculations.session_consumption_ledger
        distinguishing_aspect: |
          Conserved quantity = count of COMPLETED sessions (immutable history)
          and the ledger identity sessions_consumed == count({COMPLETED,
          NO_SHOW_CHARGED}): granting an exemption (EXHAUSTED->OPEN with
          limit += 4) MUST NOT mutate sessions_consumed or rewrite session
          history — the conserved quantity is the historical record itself,
          distinct from the strike/consumption pair of the sibling instance.
        test_recipe:
          setup:
            - "Student with LOW STUDENT_FEE episode under base 4 policy (limit 2); 2 completions -> EXHAUSTED; then exemption granted"
          setup_api_calls:
            - call: "POST /ucc/counselors"
              payload: { license_id: "LIC-18", full_name: "Coun Eighteen", specialties: ["GEN"], weekly_individual_capacity: 20, max_caseload_risk_points: 1000 }
              as: ClinicalDirector
              captures: { c18_id: $.data.id }
            - call: "POST /ucc/policies"
              payload: { academic_term: "2026-FALL", base_session_limit: 4, no_show_strike_limit: 5, late_cancel_window_hours: 24 }
              as: ClinicalDirector
              captures: { pol18_id: $.data.id }
            - call: "POST /ucc/policies/${pol18_id}/publish"
              payload: {}
              as: ClinicalDirector
            - call: "POST /ucc/students"
              payload: { student_number: "S1800", full_name: "Exempt Stud", enrollment_status: "ENROLLED", funding_model: "STUDENT_FEE" }
              as: FrontDesk
              captures: { s18_id: $.data.id }
            - call: "POST /ucc/intake-assessments"
              payload: { student_id: "${s18_id}", screener_id: "${c18_id}", phq9_score: 3, gad7_score: 2, ideation_flag: false, recent_attempt_flag: false }
              as: TriageScreener
              as_user_id: "${c18_id}"
              captures: { ia18_id: $.data.id }
            - call: "POST /ucc/intake-assessments/${ia18_id}/complete"
              payload: { primary_counselor_id: "${c18_id}", academic_term: "2026-FALL" }
              as: TriageScreener
              as_user_id: "${c18_id}"
            - call: "GET /ucc/episodes"
              payload: { student_id: "${s18_id}" }
              as: Counselor
              as_user_id: "${c18_id}"
              captures: { ep18_id: "$.data[0].id", ep18_v: "$.data[0].version" }
            - call: "POST /ucc/episodes/${ep18_id}/sessions"
              payload: { counselor_id: "${c18_id}", starts_at: "2026-08-02T09:00:00Z", duration_minutes: 60, expected_episode_version: "${ep18_v}" }
              as: FrontDesk
              captures: { s18_a: $.data.id }
            - call: "POST /ucc/episodes/${ep18_id}/sessions"
              payload: { counselor_id: "${c18_id}", starts_at: "2026-08-02T11:00:00Z", duration_minutes: 60, expected_episode_version: "${ep18_v} + 1" }
              as: FrontDesk
              captures: { s18_b: $.data.id }
            - call: "POST /ucc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /ucc/sessions/${s18_a}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c18_id}"
            - call: "POST /ucc/sessions/${s18_b}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c18_id}"
          trigger:
            - call: "GET /ucc/episodes/${ep18_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c18_id}"
              captures: { ep18_pre_st: $.data.status, ep18_pre_consumed: $.data.sessions_consumed }
            - call: "POST /ucc/episodes/${ep18_id}/exemptions"
              payload: {}
              as: ClinicalDirector
              as_user_id: "${c18_id}"
            - call: "GET /ucc/episodes/${ep18_id}"
              payload: {}
              as: Counselor
              as_user_id: "${c18_id}"
              captures: { ep18_post_st: $.data.status, ep18_post_consumed: $.data.sessions_consumed, ep18_post_limit: $.data.session_limit, ep18_exempt: $.data.exemption_granted }
            - call: "GET /ucc/sessions/${s18_a}"
              payload: {}
              as: Counselor
              as_user_id: "${c18_id}"
              captures: { s18a_st: $.data.status }
          assert:
            - "before exemption: status == EXHAUSTED, sessions_consumed == 2, session_limit == 2"
            - "after exemption: status == OPEN, exemption_granted == true, session_limit == 6 (2 + EXEMPTION_BONUS_SESSIONS 4)"
            - "sessions_consumed is UNCHANGED at 2 — the exemption extends the limit without rewriting history"
            - "session s18_a remains COMPLETED (historical record conserved)"
