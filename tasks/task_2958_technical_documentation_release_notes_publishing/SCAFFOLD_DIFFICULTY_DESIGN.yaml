  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: writer_window_half_open_with_leading_handoff_buffer
        grounds:
          - validations[priority=52]
          - entities.DocPlanItem.fields.window_start_date
          - entities.DocPlanItem.fields.window_end_date
          - errors.ERR_WRITER_WINDOW_OVERLAP
        distinguishing_aspect: |
          HALF-OPEN interval semantics with an asymmetric two-day buffer on the LEADING edge
          only, exercised across the exact tipping point: a window that merely touches the
          existing end (2026-08-14) is rejected, one day of gap (2026-08-15) is still rejected,
          and exactly two days of gap (2026-08-16) is admitted. The resource here is a HUMAN
          writer and the semantics are half-open, which is the deliberate counterpart to the
          closed-interval locale rule in the sibling instance.
        test_recipe:
          setup:
            - "One release train ATLAS 27.0, one SENIOR writer capacity 100."
            - "Plan item A: STANDARD, 6 pages, complexity 10, NEW_TOPIC, assigned 2026-08-03..2026-08-14 (load 26.00)."
            - "Plan item B: identical shape, still DRAFTED; three assignment attempts are made against it and only the last one may succeed (a failed assign leaves B untouched, so the same row can be retried)."
            - "Capacity is never the binding constraint: 26.00 + 26.00 = 52.00 against 100 points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "27.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
