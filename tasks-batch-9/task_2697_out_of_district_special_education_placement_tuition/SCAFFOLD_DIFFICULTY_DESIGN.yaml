      - name: payment_rollup_crosses_high_cost_trigger_and_creates_claim_then_student_rollup
        grounds:
          - state_machines.TuitionInvoice.UNPAID_to_PAID.CASCADE-B_LINK_2
          - state_machines.TuitionInvoice.UNPAID_to_PAID.CASCADE-B_LINK_3
          - state_machines.TuitionInvoice.UNPAID_to_PAID.CASCADE-B_LINK_4
          - calculations.funding_claim_reimbursable
          - entities.FundingClaim.fields.source
          - entities.Student.fields.high_cost_flag
        distinguishing_aspect: |
          A three-hop transitive chain triggered by a threshold that only the SECOND payment
          crosses: approving payment moves Placement.paid_total_ytd_cents (LINK 2), that counter
          crossing HIGH_COST_TRIGGER_CENTS (4000000) auto-creates a FundingClaim with
          source == AUTO_CASCADE (LINK 3), and that claim's existence sets
          Student.high_cost_flag and adds 382664 to projected_state_recovery_cents (LINK 4).
