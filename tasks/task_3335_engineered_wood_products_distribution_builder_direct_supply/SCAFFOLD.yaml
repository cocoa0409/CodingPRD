    code: 200
    input: []
    output: { fifo_value_cents: integer, weighted_avg_value_cents: integer, delta_cents: integer }
    side_effects: []

  - method: POST
    path: "/branches/{branch_id}/inventory-lots"
    description: "Receive an inventory lot at a branch (received_at stamped from logical clock)"
