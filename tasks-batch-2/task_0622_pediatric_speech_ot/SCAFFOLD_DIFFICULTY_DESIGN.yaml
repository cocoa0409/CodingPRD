            - "Authorization.${auth_id}.committed_visits == 0"
            - "Authorization.${auth_id}.available_visits == 2"

      - name: caseload_conserved_activate_then_hold
        grounds:
          - state_machines.PlanOfCare.DRAFT_to_ACTIVE
          - state_machines.PlanOfCare.ACTIVE_to_ON_HOLD
          - entities.Therapist.fields.current_caseload
        distinguishing_aspect: |
          Conserved quantity = Therapist.current_caseload (a DIFFERENT conserved
          quantity from the authorization visit pool). Activating a plan
          (caseload+1) followed by holding it (caseload-1) returns
          Therapist.current_caseload to its pre-activation value (0).
        test_recipe:
          setup:
