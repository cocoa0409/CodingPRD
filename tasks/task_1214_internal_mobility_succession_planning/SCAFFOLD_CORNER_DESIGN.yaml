        grounds: [state_machines.PostingApplication.OFFER_EXTENDED_to_OFFER_ACCEPTED, state_machines.Vacancy.OPEN_to_FILLED]
        distinguishing_aspect: "The full posting channel: ACCEPT flips the vacancy to FILLED with fill_source INTERNAL_POSTING, reactivates the role with the applicant as incumbent, closes the posting, and REJECTS the other in-flight application."
