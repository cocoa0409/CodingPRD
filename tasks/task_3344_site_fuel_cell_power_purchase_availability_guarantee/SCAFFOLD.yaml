scenario: |
  On-Site Fuel Cell Power Purchase & Availability Guarantee (Bloom Energy): customer site
  evaluation for electrical load, gas supply availability and installation footprint with
  interconnection review, power purchase agreements where the customer pays per kilowatt-hour
  with escalators and term commitments, output and efficiency guarantees with remedies when the
  system underperforms, fuel supply arrangements and pass-through of commodity costs with
  customer procurement options, permitting and utility interconnection including standby charges
  and exit fee exposure, service model with remote monitoring, module replacement and maintenance
  windows, resiliency configurations that operate through grid outages with islanding capability,
  contract transfer when a facility is sold or a tenant vacates.

domain_name: on-site-fuel-cell-power-purchase
api_prefix: /power

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Temporal windowing
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - multi_tenancy_isolation
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Customer facility name."
      - name: utility_territory
        type: string
        source: input
        description: "Interconnecting utility territory code, e.g. PGE_CA."
      - name: grid_tariff_rate_cents_per_kwh
        type: number
        source: input
        description: "Blended utility tariff the site pays when buying from the grid."
      - name: grid_outage_events_per_year
        type: integer
        source: input
        description: "Observed grid outage events per year at the site."
      - name: grid_annual_outage_hours
        type: number
        source: input
        description: "Total grid outage hours observed per year."
      - name: gas_commodity_rate_cents_per_therm
        type: number
        source: input
        description: "Prevailing local gas commodity index used as the default fuel basis."
      - name: expected_annual_site_load_kwh
        type: integer
        source: input
        description: "Total expected annual electrical load of the facility."
      - name: tax_rate_pct
        type: number
        source: input
        description: "Sales/use tax rate applied to charges and credits, as a fraction."
      - name: status
        type: enum
        source: computed
        description: "Site availability posture: SITE_ACTIVE | SITE_SUSPENDED."
        default: SITE_ACTIVE
        constraints: "enum {SITE_ACTIVE, SITE_SUSPENDED}"
      - name: lifecycle_state
        type: enum
        source: system
        description: "Resource draw dimension: RESOURCE_AVAILABLE | RESOURCE_DRAWING | RESOURCE_CLOSED."
        default: RESOURCE_AVAILABLE
        constraints: "enum {RESOURCE_AVAILABLE, RESOURCE_DRAWING, RESOURCE_CLOSED}"
      - name: active_ppa_count
        type: integer
        source: computed
        description: "Count of this site's PPAs whose state ∈ {PPA_ACTIVE, PPA_SUSPENDED}."
        default: 0
      - name: lifetime_customer_billable_cents
        type: integer
        source: computed
        description: "Sum of net_charge_cents over SETTLEMENT_APPLIED lines of PPAs at this site."
        default: 0
      - name: lifetime_availability_credit_cents
        type: integer
        source: computed
        description: "Sum of availability_credit_cents over SETTLEMENT_APPLIED lines of PPAs at this site."
        default: 0
      - name: lifetime_settled_kwh
        type: number
        source: computed
        description: "Sum of metered_kwh over SETTLEMENT_APPLIED lines of PPAs at this site."
        default: 0
      - name: total_contracted_kw
        type: integer
        source: computed
        description: "Sum of contracted_kw over this site's PPAs in state ∈ {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED}; compared against footprint_sqm * KW_PER_SQM."
        default: 0
      - name: total_contracted_kw
        type: integer
        source: computed
        description: "Sum of contracted_kw over this site's PPAs in state ∈ {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED}; compared against footprint_sqm * KW_PER_SQM."
        default: 0
      - name: contracted_purchase_cents
        type: integer
        source: computed
        description: "Sum over this site's PPAs in state ∈ {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED} of PPA.purchase_price_cents_per_kwh * PPA.contracted_kwh."
        default: 0
      - name: committed_feedstock_therms
        type: number
        source: computed
        description: "Sum over this site's PPAs in state ∈ {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED} of PPA.term_years * 365 * PPA.contracted_kwh / PPA.contracted_efficiency_kwh_per_therm."
        default: 0
      - name: initial_fuel_inventory_therms
        type: number
        source: computed
        description: "Opening on-site fuel inventory funded by the operator; not derived from PPAs."
        default: 0
      - name: draw_position_therms
        type: number
        source: computed
        description: "Remaining allocatable fuel pool: initial_fuel_inventory_therms + closed_deliveries_therms - consumed_therms."
        default: 0
      - name: current_avoided_fuel_cost_cents_per_therm
        type: number
        source: computed
        description: "Site's most recent CONFIRMED FuelDelivery.effective_commodity_rate_cents_per_therm; 0 when no confirmed delivery exists."
        default: 0
      - name: lifetime_settle_reconcile_count
        type: integer
        source: computed
        description: "Number of PpaAccrual rows in state ACCRUAL_RECONCILED whose site_id is this site."
        default: 0
      - name: allowed_downtime_hours_per_year
        type: number
        source: input
        description: "Contracted annual allowed downtime used by the availability guarantee."
      - name: reserved_capacity_hold_count
        type: integer
        source: computed
        description: "Number of SettlementAllowance rows of kind CAPACITY_ALLOWANCE consumed against deliveries at this site."
        default: 0
      - name: clearance_zone_used
        type: number
        source: computed
        description: "Sum of radius_buffer_m over this site's ServicePlans in lifecycle_state ∈ {SERVICE_ACTIVE, SERVICE_MAINTENANCE_WINDOW_OPEN}."
        default: 0
      - name: clearance_zone_capacity
        type: number
        source: input
        description: "Physical clearance-zone capacity for concurrent service footprints."
      - name: footprint_sqm
        type: number
        source: input
        description: "Installation footprint available for power modules."
      - name: standby_charge_cents_per_kw_month
        type: number
        source: input
        description: "Utility standby charge rate applied to contracted capacity."
      - name: interconnect_exit_fee_cents_per_kw
        type: number
        source: input
        description: "Interconnection exit fee exposure per kW of contracted capacity."

  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Customer legal entity name."
      - name: industry_code
        type: string
        source: input
        description: "Customer industry classification code."
      - name: credit_tier
        type: enum
        source: input
        description: "Credit tier: CREDIT_PRIME | CREDIT_STANDARD | CREDIT_SUBSTANDARD."
        constraints: "enum {CREDIT_PRIME, CREDIT_STANDARD, CREDIT_SUBSTANDARD}"
      - name: status
        type: enum
        source: computed
        description: "Relationship posture: CUSTOMER_ACTIVE | CUSTOMER_CREDIT_HOLD | CUSTOMER_SUSPENDED."
        default: CUSTOMER_ACTIVE
        constraints: "enum {CUSTOMER_ACTIVE, CUSTOMER_CREDIT_HOLD, CUSTOMER_SUSPENDED}"
      - name: renewal_stage
        type: enum
        source: computed
        description: "Independent relationship-review dimension: RENEWAL_NONE | RENEWAL_OFFERED | RENEWAL_ACCEPTED | RENEWAL_DECLINED."
        default: RENEWAL_NONE
        constraints: "enum {RENEWAL_NONE, RENEWAL_OFFERED, RENEWAL_ACCEPTED, RENEWAL_DECLINED}"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of net_charge_cents over SETTLEMENT_APPLIED lines of this customer's PPAs."
        default: 0
      - name: lifetime_settled_cents
        type: integer
        source: computed
        description: "Sum of metered_kwh * effective_tariff_cents_per_kwh over SETTLEMENT_APPLIED lines of this customer's PPAs."
        default: 0
      - name: lifetime_output_guarantee_credit_cents
        type: integer
        source: computed
        description: "Sum of output_guarantee_credit_cents over SETTLEMENT_APPLIED lines, plus applied OUTPUT_GUARANTEE_ACCRUAL amounts, for this customer's PPAs."
        default: 0
      - name: lifetime_availability_credit_cents
        type: integer
        source: computed
        description: "Sum of availability_credit_cents over SETTLEMENT_APPLIED lines of this customer's PPAs."
        default: 0
      - name: active_ppa_count
        type: integer
        source: computed
        description: "Count of this customer's PPAs whose state ∈ {PPA_ACTIVE, PPA_SUSPENDED}."
        default: 0
      - name: earned_customer_tokens
        type: integer
        source: computed
        description: "Sum of earned tokens across this customer's PPAs."
        default: 0
      - name: spent_customer_tokens
        type: integer
        source: computed
        description: "Sum of spent tokens across this customer's PPAs."
        default: 0
      - name: exposure_hold_pct
        type: number
        source: computed
        description: "Credit exposure hold fraction: 0.40 for CREDIT_SUBSTANDARD, 0.15 for CREDIT_STANDARD, 0.0 for CREDIT_PRIME."
        default: 0.0
      - name: hold_armed
        type: boolean
        source: computed
        description: "True while the customer's exposure hold has been armed by a freeze event."
        default: false
      - name: reconcile_cadence_slots
        type: integer
        source: computed
        description: "Independent cadence dimension: count of this customer's PPAs in {PPA_ACTIVE, PPA_SUSPENDED} minus count of this customer's PPAAccruals in ACCRUAL_OPEN."
        default: 0

  # ---------------------------------------------------------------------------
  - name: Ppa
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the facility the power system serves."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the offtaker of record."
      - name: term_years
        type: integer
        source: input
        description: "Term commitment in years."
        constraints: "enum {10, 12, 15, 20}"
      - name: contracted_kw
        type: integer
        source: input
        description: "Contracted system capacity in kW."
      - name: contracted_efficiency_kwh_per_therm
        type: number
        source: input
        description: "Guaranteed electrical efficiency in kWh generated per therm of fuel."
      - name: contracted_annual_kwh
        type: integer
        source: input
        description: "Guaranteed annual delivered output in kWh."
      - name: tariff_base_cents_per_kwh
        type: number
        source: input
        description: "Base energy rate at contract start, in cents per kWh."
      - name: escalator_pct
        type: number
        source: input
        description: "Annual escalation applied to the base rate as a fraction."
      - name: fuel_adder_cents_per_therm
        type: number
        source: input
        description: "Commodity adder applied to the site's gas index rate."
      - name: guaranteed_availability_pct
        type: number
        source: input
        description: "Guaranteed availability fraction (e.g. 0.97)."
      - name: guaranteed_delivery_kwh
        type: integer
        source: input
        description: "Annual guaranteed delivered output in kWh (output guarantee)."
      - name: customer_cure_deadline_days
        type: integer
        source: input
        description: "Days the customer has to cure a breach before an exit fee is charged."
      - name: fuel_responsibility
        type: enum
        source: input
        description: "Who sources gas: PPA_FUEL_INCLUDED | CUSTOMER_SOURCED_GAS."
        constraints: "enum {PPA_FUEL_INCLUDED, CUSTOMER_SOURCED_GAS}"
      - name: state
        type: enum
        source: computed
        description: "Contract state: PPA_DRAFT | PPA_ACTIVE | PPA_SUSPENDED | PPA_EXIT_PENDING | PPA_TERMINATED."
        default: PPA_DRAFT
        constraints: "enum {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED, PPA_EXIT_PENDING, PPA_TERMINATED}"
      - name: state_entered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the current state was entered."
      - name: effective_tariff_cents_per_kwh
        type: number
        source: computed
        description: "Escalated customer energy rate: tariff_base_cents_per_kwh * (1 + escalator_pct)^floor(cure_window_elapsed_days / 365)."
      - name: purchase_price_cents_per_kwh
        type: number
        source: computed
        description: "Operator purchase price basis used by the realized-purchase reconciliation."
      - name: availability_penalty_cents_per_kwh
        type: number
        source: computed
        description: "Rate credit applied per kWh when availability is short of guarantee."
      - name: effective_fuel_adder_cents_per_therm
        type: number
        source: computed
        description: "Fuel adder after escalation."
      - name: annual_customer_cost_cents
        type: integer
        source: computed
        description: "Annual customer cost basis for the site evaluation."
      - name: exit_fee_cents
        type: integer
        source: computed
        description: "Exit fee exposure when the contract terminates without cure."
      - name: realized_guarantee_credit_cents
        type: integer
        source: computed
        description: "Guarantee credit realized in the most recent applied settlement line."
      - name: lifetime_settled_kwh
        type: number
        source: computed
        description: "Sum of metered_kwh over this PPA's SETTLEMENT_APPLIED lines."
        default: 0
      - name: lifetime_settled_cents
        type: integer
        source: computed
        description: "Sum of net_charge_cents over this PPA's SETTLEMENT_APPLIED lines plus replayed PpaAccrual signed_amount_cents."
        default: 0
      - name: committed_kwh_remaining
        type: number
        source: computed
        description: "term_years * contracted_annual_kwh - lifetime_settled_kwh."
      - name: customer_earned_ppa_tokens
        type: integer
        source: computed
        description: "Tokens earned by the customer on this PPA (revised settlement periods)."
        default: 0
      - name: customer_spent_ppa_tokens
        type: integer
        source: computed
        description: "Tokens spent by the customer on this PPA (revisions, escalations, renewals)."
        default: 0
      - name: customer_earned_output_tokens
        type: integer
        source: computed
        description: "Output-guarantee tokens earned on this PPA."
        default: 0
      - name: customer_spent_output_tokens
        type: integer
        source: computed
        description: "Output-guarantee tokens spent on this PPA."
        default: 0
      - name: contract_basis
        type: enum
        source: computed
        description: "Transfer basis: PPA_BASIS_AS_BUILT | PPA_BASIS_TRANSFERRED."
        default: PPA_BASIS_AS_BUILT
        constraints: "enum {PPA_BASIS_AS_BUILT, PPA_BASIS_TRANSFERRED}"
      - name: transfer_stage
        type: enum
        source: computed
        description: "Transfer dimension evolving independently of state: TRANSFER_NONE | TRANSFER_BLOCKED."
        default: TRANSFER_NONE
        constraints: "enum {TRANSFER_NONE, TRANSFER_BLOCKED}"
      - name: originating_ppa_id
        type: string
        source: computed
        description: "FK -> Ppa.id; self-referential link to the PPA this contract was transferred from; null for as-built PPAs."
        default: null
      - name: assigned_service_plan_id
        type: string
        source: computed
        description: "FK -> ServicePlan.id; the service plan created by the activation cascade."
        default: null
      - name: output_guarantee_reserve_cents
        type: integer
        source: computed
        description: "Escrowed output-guarantee reserve: max(0, contracted_annual_kwh - actual_annual_output_kwh) * effective_tariff_cents_per_kwh."
        default: 0
      - name: capacity_guarantee_reserve_cents
        type: integer
        source: computed
        description: "Escrowed capacity-guarantee reserve: max(0, availability_shortfall_kwh) * availability_penalty_cents_per_kwh."
        default: 0
      - name: capacity_reserve_pre_cents
        type: integer
        source: input
        description: "Opening capacity-guarantee escrow the operator commits at contract signature; seeds capacity_guarantee_reserve_cents."
        default: 1000000
      - name: capacity_reserve_credits_cents
        type: integer
        source: computed
        description: "Sum of applied CAPACITY_ALLOWANCE amounts plus TRUEUP_ACCRUAL amounts charged against this PPA's capacity reserve."
        default: 0
      - name: loss_floor_cents
        type: integer
        source: input
        description: "Minimum capacity-guarantee exposure retained by the operator regardless of credits."
        default: 0

  # ---------------------------------------------------------------------------
  - name: ServicePlan
    parent: Ppa
    common_fields: true
    fields:
      - name: ppa_id
        type: string
        source: input
        description: "FK -> Ppa.id; the contract this service plan maintains."
      - name: remote_monitoring_status
        type: enum
        source: input
        description: "MONITORING_LINKED | MONITORING_DEGRADED."
        default: MONITORING_LINKED
        constraints: "enum {MONITORING_LINKED, MONITORING_DEGRADED}"
      - name: lifecycle_state
        type: enum
        source: computed
        description: "SERVICE_PLAN_DRAFT | SERVICE_ACTIVE | SERVICE_MAINTENANCE_WINDOW_OPEN | SERVICE_SUSPENDED | SERVICE_ARCHIVED."
        default: SERVICE_PLAN_DRAFT
        constraints: "enum {SERVICE_PLAN_DRAFT, SERVICE_ACTIVE, SERVICE_MAINTENANCE_WINDOW_OPEN, SERVICE_SUSPENDED, SERVICE_ARCHIVED}"
      - name: module_replacement_stage
        type: enum
        source: computed
        description: "Independent hardware dimension: REPLACEMENT_NONE | REPLACEMENT_SCHEDULED | REPLACEMENT_DISPATCHED | REPLACEMENT_BLOCKED."
        default: REPLACEMENT_NONE
        constraints: "enum {REPLACEMENT_NONE, REPLACEMENT_SCHEDULED, REPLACEMENT_DISPATCHED, REPLACEMENT_BLOCKED}"
      - name: radius_buffer_m
        type: number
        source: input
        description: "Clearance radius contribution of this service footprint."
      - name: monitoring_degraded_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the monitoring link last reported degraded; null when linked."
        default: null
      - name: monitoring_degraded_days
        type: number
        source: computed
        description: "current_utc - monitoring_degraded_at in days, floored; 0 when monitoring_degraded_at is null."
        default: 0
      - name: rollout_schedule_compliant
        type: boolean
        source: computed
        description: "True when maintenance windows of this site's open service plans are pairwise separated by at least MAINTENANCE_GAP_DAYS."
        default: true
      - name: window_start_iso8601
        type: datetime
        source: input
        description: "Maintenance window start (logical clock)."
        default: null
      - name: window_end_iso8601
        type: datetime
        source: input
        description: "Maintenance window end (logical clock)."
        default: null
      - name: dispatch_hold
        type: boolean
        source: computed
        description: "True while module replacement dispatch is held because monitoring_degraded_days > MODULE_DISPATCH_HOLD_DAYS."
        default: false

  # ---------------------------------------------------------------------------
  - name: FuelDelivery
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the facility receiving fuel."
      - name: sourcing_mode
        type: enum
        source: input
        description: "FIXED_PRICE_BLEND | INDEXED_BLEND."
        constraints: "enum {FIXED_PRICE_BLEND, INDEXED_BLEND}"
      - name: volume_therms
        type: number
        source: input
        description: "Scheduled fuel volume in therms."
      - name: index_rate_cents_per_therm
        type: number
        source: input
        description: "Indexed commodity rate; required when sourcing_mode = INDEXED_BLEND."
        default: null
      - name: fixed_price_cents_per_therm
        type: number
        source: input
        description: "Fixed contract price for the unhedged portion."
        default: 0
      - name: hedged_fraction
        type: number
        source: input
        description: "Fraction of volume priced at the fixed price; between 0 and 1 inclusive."
        default: 0
      - name: attesting_customer_id
        type: string
        source: input
        description: "FK -> Customer.id; customer attesting a self-sourced delivery; null for operator-sourced deliveries."
        default: null
      - name: delivered_at
        type: datetime
        source: input
        description: "Logical-clock instant the delivery occurred."
      - name: confirm_after_iso8601
        type: datetime
        source: input
        description: "Logical-clock instant before which confirmation is blocked."
      - name: lifecycle_state
        type: enum
        source: computed
        description: "DELIVERY_SCHEDULED | DELIVERY_IN_TRANSIT | DELIVERY_CONFIRMED | DELIVERY_CANCELLED | DELIVERY_SETTLED."
        default: DELIVERY_SCHEDULED
        constraints: "enum {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT, DELIVERY_CONFIRMED, DELIVERY_CANCELLED, DELIVERY_SETTLED}"
      - name: effective_commodity_rate_cents_per_therm
        type: number
        source: computed
        description: "hedged_fraction * fixed_price_cents_per_therm + (1 - hedged_fraction) * index_rate_cents_per_therm."
      - name: candidate_ppa_a_kwh
        type: number
        source: computed
        description: "volume_therms * contracted_efficiency_kwh_per_therm of the earliest-created ACTIVE PPA at this site."
        default: 0
      - name: candidate_ppa_b_kwh
        type: number
        source: computed
        description: "volume_therms * contracted_efficiency_kwh_per_therm of the PPA at this site with the smallest contracted_kw, excluding the selected PPA."
        default: 0
      - name: candidate_ppa_distance_km
        type: number
        source: computed
        description: "Predefined transfer distance in km for the candidate PPA selected for this delivery."
        default: 0
      - name: selected_ppa_id
        type: string
        source: computed
        description: "FK -> Ppa.id; the PPA awarded the delivery's output allocation."
        default: null
      - name: allocated_ppa_a_kwh
        type: number
        source: computed
        description: "Output kWh allocated to candidate PPA A under the ALLOCATION_ORDER basis."
        default: 0
      - name: allocated_ppa_b_kwh
        type: number
        source: computed
        description: "Output kWh allocated to candidate PPA B under the ALLOCATION_ORDER basis."
        default: 0
      - name: active_candidate_demands_at_site
        type: integer
        source: computed
        description: "Count of this site's FuelDeliveries in DELIVERY_SCHEDULED or DELIVERY_IN_TRANSIT, excluding this delivery."
        default: 0
      - name: hold_window_start_iso8601
        type: datetime
        source: input
        description: "Start of the hold/resource window this delivery occupies at the site; null when the delivery carries no window."
        default: null
      - name: hold_window_end_iso8601
        type: datetime
        source: input
        description: "End of the hold/resource window this delivery occupies at the site; null when the delivery carries no window."
        default: null
      - name: fuel_basis_rate_cents_per_therm
        type: number
        source: computed
        description: "Rate used for fuel pass-through on this delivery."
        default: 0

  # ---------------------------------------------------------------------------
  - name: SettlementLine
    parent: Ppa
    common_fields: true
    fields:
      - name: ppa_id
        type: string
        source: input
        description: "FK -> Ppa.id; the contract being settled."
      - name: period_start
        type: datetime
        source: input
        description: "Settlement period start (logical clock)."
      - name: period_end
        type: datetime
        source: input
        description: "Settlement period end (logical clock)."
      - name: metered_kwh
        type: number
        source: input
        description: "Metered delivered output for the period."
      - name: downtime_hours
        type: number
        source: input
        description: "Recorded unavailable hours in the period."
      - name: customer_index_cents_per_therm
        type: number
        source: input
        description: "Customer's own gas index rate; only meaningful when PPA.fuel_responsibility = CUSTOMER_SOURCED_GAS."
        default: null
      - name: customer_source_deadline_iso8601
        type: datetime
        source: input
        description: "Deadline by which the customer must attest a conforming gas index for the period."
      - name: hourly_settlement
        type: boolean
        source: input
        description: "Whether the period is settled on the hourly basis."
        default: false
      - name: expense_hold_days
        type: integer
        source: input
        description: "Placeholder rather than a real deferral; set to 0 to express no deferral."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "SETTLEMENT_DRAFT | SETTLEMENT_VALIDATED | SETTLEMENT_APPROVED | SETTLEMENT_APPLIED | SETTLEMENT_REVERSED."
        default: SETTLEMENT_DRAFT
        constraints: "enum {SETTLEMENT_DRAFT, SETTLEMENT_VALIDATED, SETTLEMENT_APPROVED, SETTLEMENT_APPLIED, SETTLEMENT_REVERSED}"
      - name: customer_sourced_index_cents_per_therm
        type: number
        source: computed
        description: "Normalized customer gas basis: min(customer_index_cents_per_therm, site.gas_commodity_rate_cents_per_therm * SOURCED_INDEX_CEILING_MULTIPLE)."
        default: 0
      - name: availability_credit_cents
        type: integer
        source: computed
        description: "Monthly availability escrow draw: AVAILABILITY_CREDIT_MONTHLY_DRAW_PCT * Ppa.capacity_guarantee_reserve_cents."
        default: 0
      - name: cap_side_pool_cents
        type: integer
        source: computed
        description: "Sum of this PPA's PpaAccrual signed_amount_cents with accrual_type ∈ {CHARGE_ACCRUAL, OUTPUT_GUARANTEE_ACCRUAL} and lifecycle_state = ACCRUAL_OPEN, in created_at ASC order."
        default: 0
      - name: output_guarantee_credit_cents
        type: integer
        source: computed
        description: "Guarantee remedy for the period: reserve draw plus the cap-side pool split."
        default: 0
      - name: resource_side_pool_cents
        type: integer
        source: computed
        description: "Sum of this PPA's PpaAccrual signed_amount_cents with accrual_type = CAPACITY_ACCRUAL and lifecycle_state = ACCRUAL_OPEN."
        default: 0
      - name: variable_energy_cents
        type: integer
        source: computed
        description: "metered_kwh * effective_tariff_cents_per_kwh."
        default: 0
      - name: fixed_purchase_cents
        type: integer
        source: computed
        description: "PPA.term_years * PPA.contracted_annual_kwh * PPA.purchase_price_cents_per_kwh / 12."
        default: 0
      - name: net_charge_cents
        type: integer
        source: computed
        description: "Recurring base reconciliation charge derived from the four pools."
        default: 0
      - name: net_charge_allocated_cents
        type: integer
        source: computed
        description: "net_charge_cents * min(committed_kwh_remaining, sum of allocated kWh over REVERSED lines in this period) / PPA.committed_kwh_remaining."
        default: 0
      - name: hourly_charge_cents
        type: integer
        source: computed
        description: "hourly_settlement ? (hourly_settlement_line_count / (hourly_settlement_line_count + 1)) * net_charge_cents : 0."
        default: 0
      - name: allocation_basis
        type: enum
        source: computed
        description: "UNIT_INDEX when a sibling line in the same period is REVERSED, otherwise ALLOCATION_ORDER."
        default: ALLOCATION_ORDER
        constraints: "enum {UNIT_INDEX, ALLOCATION_ORDER}"
      - name: escalated_rate_cents_per_kwh
        type: number
        source: computed
        description: "tariff_base_cents_per_kwh * (1 + escalator_pct)^floor(period_start minus ppa.state_entered_at in years)."
      - name: loss_component_cents
        type: integer
        source: computed
        description: "round_half_up(cap_side_pool_cents * LOSS_ALLOCATION_PCT, 2)."
        default: 0
      - name: component_sum_cents
        type: integer
        source: computed
        description: "Sum of the four escalation-step components each rounded to 2dp independently (the pinned per-line-then-sum order)."
        default: 0
      - name: single_round_cents
        type: integer
        source: computed
        description: "The same four escalation steps summed unrounded and rounded once at the end; differs from component_sum_cents by the rounding remainder."
        default: 0
      - name: expected_net_charge_cents
        type: integer
        source: computed
        description: "metered_kwh * escalated_rate_cents_per_kwh, rounded per the pinned rounding order."
        default: 0
      - name: index_basis_cents_per_therm
        type: number
        source: computed
        description: "min(site.gas_commodity_rate_cents_per_therm, Ppa.contract_index_ceiling_cents_per_therm)."
        default: 0
      - name: expected_net_low_cents
        type: integer
        source: computed
        description: "Provisional forecast of net charge at the current index, marked system-computed."
        default: 0
      - name: expected_net_high_cents
        type: integer
        source: computed
        description: "Provisional forecast of net charge at the index ceiling, marked system-computed."
        default: 0
      - name: target_ppa_id
        type: string
        source: computed
        description: "FK -> Ppa.id; the PPA a revision line was posted against when it differs from ppa_id; null otherwise."
        default: null

  # ---------------------------------------------------------------------------
  - name: PpaAccrual
    parent: null
    common_fields: true
    fields:
      - name: ppa_id
        type: string
        source: input
        description: "FK -> Ppa.id; the contract this accrual belongs to."
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the facility this accrual belongs to."
      - name: source_settlement_line_id
        type: string
        source: input
        description: "FK -> SettlementLine.id; the settlement line that created this accrual; null for capacity accruals."
        default: null
      - name: accrual_type
        type: enum
        source: input
        description: "CHARGE_ACCRUAL | OUTPUT_GUARANTEE_ACCRUAL | TRUEUP_ACCRUAL | CAPACITY_ACCRUAL."
        constraints: "enum {CHARGE_ACCRUAL, OUTPUT_GUARANTEE_ACCRUAL, TRUEUP_ACCRUAL, CAPACITY_ACCRUAL}"
      - name: amount_cents
        type: integer
        source: input
        description: "Nominal accrual amount."
      - name: lifecycle_state
        type: enum
        source: computed
        description: "ACCRUAL_OPEN | ACCRUAL_RECONCILED."
        default: ACCRUAL_OPEN
        constraints: "enum {ACCRUAL_OPEN, ACCRUAL_RECONCILED}"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "amount_cents for CHARGE_ACCRUAL and CAPACITY_ACCRUAL; -amount_cents for OUTPUT_GUARANTEE_ACCRUAL."
      - name: applied_allowance_id
        type: string
        source: computed
        description: "FK -> SettlementAllowance.id; the allowance applied to this accrual; null when none applied."
        default: null
      - name: period_anchor_iso8601
        type: datetime
        source: computed
        description: "Derived period anchor used for batch ordering."
        default: null

  # ---------------------------------------------------------------------------
  - name: SettlementAllowance
    parent: null
    common_fields: true
    fields:
      - name: ppa_id
        type: string
        source: input
        description: "FK -> Ppa.id; the contract this allowance belongs to."
      - name: allowance_kind
        type: enum
        source: input
        description: "AVOIDED_COST_ALLOWANCE | CAPACITY_ALLOWANCE."
        constraints: "enum {AVOIDED_COST_ALLOWANCE, CAPACITY_ALLOWANCE}"
      - name: amount_cents
        type: integer
        source: input
        description: "Nominal allowance amount in cents."
      - name: lifecycle_state
        type: enum
        source: computed
        description: "ALLOWANCE_ISSUED | ALLOWANCE_APPLIED."
        default: ALLOWANCE_ISSUED
        constraints: "enum {ALLOWANCE_ISSUED, ALLOWANCE_APPLIED}"
      - name: applied_direction
        type: enum
        source: computed
        description: "ALLOWANCE_APPLIED_AS_TIME | ALLOWANCE_APPLIED_AS_REVERSAL; null while ISSUED."
        default: null
        constraints: "enum {ALLOWANCE_APPLIED_AS_TIME, ALLOWANCE_APPLIED_AS_REVERSAL, null}"
      - name: applied_cap_cents
        type: integer
        source: computed
        description: "min(amount_cents, 2 * net_charge_cents of the applied line)."
        default: 0
      - name: applied_days
        type: integer
        source: computed
        description: "days = floor(applied_cap_cents / (daily_energy_cents + daily_fixed_cents)), floored at 1."
        default: 0
      - name: capped_daily_energy_cents
        type: integer
        source: computed
        description: "min(daily_energy_cents, DAILY_ENERGY_CAP_CENTS)."
        default: 0
      - name: applied_amount_cents
        type: integer
        source: computed
        description: "applied_days * (capped_daily_energy_cents + daily_fixed_cents)."
        default: 0
      - name: daily_energy_cents
        type: integer
        source: computed
        description: "daily_kwh * effective_tariff_cents_per_kwh of the target PPA."
        default: 0
      - name: daily_fixed_cents
        type: integer
        source: computed
        description: "daily_kw_charge_cents_per_kw * PPA.contracted_kw of the target PPA."
        default: 0
      - name: applied_to_accrual_id
        type: string
        source: computed
        description: "FK -> PpaAccrual.id; the accrual this allowance was applied to; null otherwise."
        default: null
      - name: applied_to_ppa_id
        type: string
        source: computed
        description: "FK -> Ppa.id; the PPA the first not-yet-reconciled accrual belongs to when applied as a reversal; null otherwise."
        default: null

  # ---------------------------------------------------------------------------
  - name: PpaTransition
    parent: Ppa
    common_fields: false
    fields:
      - name: ppa_id
        type: string
        source: input
        description: "FK -> Ppa.id; the contract whose state changed."
      - name: from_state
        type: string
        source: input
        description: "State before the transition."
      - name: to_state
        type: string
        source: input
        description: "State after the transition."
      - name: trigger_code
        type: string
        source: input
        description: "Business trigger code recorded for the transition."
      - name: actor_role
        type: string
        source: input
        description: "Role that drove the transition."
      - name: transition_reversed
        type: boolean
        source: computed
        description: "True when a later compensating transition reversed this record."
        default: false# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  # --- Non-linear machine #1 (cyclic): contract state with a cure revert ------
  - entity: Ppa
    initial_state: PPA_DRAFT
    terminal_states: [PPA_TERMINATED]
    transitions:
      - from: PPA_DRAFT
        to: PPA_ACTIVE
        trigger: "POST /power/ppas/{id}/activate"
        actor: SiteOperator
        preconditions:
          - "site.status == SITE_ACTIVE"
          - "customer.status == CUSTOMER_ACTIVE"
          - "term_years ∈ {10, 12, 15, 20}"
          - "site.active_ppa_count == 0 or site.lifecycle_state == RESOURCE_DRAWING"
          - "sum of contracted_kw of this site's PPAs in {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED} + this contracted_kw <= site.footprint_sqm * KW_PER_SQM"
        side_effects:
          - "HOP1: Ppa.state -> PPA_ACTIVE; Ppa.state_entered_at = current_utc; PpaTransition record appended (from_state PPA_DRAFT, to_state PPA_ACTIVE, trigger_code PPA_ACTIVATED)"
          - "HOP1: Site.lifecycle_state -> RESOURCE_DRAWING; Site.active_ppa_count += 1"
          - "HOP2: create ServicePlan (lifecycle_state SERVICE_PLAN_DRAFT, module_replacement_stage REPLACEMENT_NONE, radius_buffer_m 0.0, window_start_iso8601 null, window_end_iso8601 null, ppa_id = this PPA); Ppa.assigned_service_plan_id = new ServicePlan.id"
          - "HOP3: ServicePlan auto-transition SERVICE_PLAN_DRAFT -> SERVICE_ACTIVE (trigger ON_PLAN_CREATED); it does NOT enter a maintenance window because both window boundaries are null"
          - "HOP4: recompute Site.clearance_zone_used (the new plan contributes 0.0) and Site.draw_position_therms"
          - "HOP5: recompute Site.clearance_zone_used over ServicePlans in {SERVICE_ACTIVE, SERVICE_MAINTENANCE_WINDOW_OPEN}"
          - "recompute Site.contracted_purchase_cents, Site.committed_feedstock_therms, Site.draw_position_therms"
          - "recompute Ppa.effective_tariff_cents_per_kwh, Ppa.purchase_price_cents_per_kwh, Ppa.exit_fee_cents, Ppa.annual_customer_cost_cents, Ppa.committed_kwh_remaining, Ppa.loss_floor_cents"
          - "recompute Customer.active_ppa_count, Customer.reconcile_cadence_slots, Customer.hold_armed, Customer.exposure_hold_pct"
        note: "Activation cascade is the depth-5 chain used by difficulty rule transitive_cascade; each hop is caused by the previous hop, not by the original request."

      - from: PPA_ACTIVE
        to: PPA_SUSPENDED
        trigger: "POST /power/sites/{id}/freeze"
        actor: SiteOperator
        preconditions:
          - "site.status == SITE_ACTIVE"
          - "reason is one of FUEL_SHORTAGE, GRID_INTERCONNECT_FAILURE, NONPAYMENT, CUSTOMER_REQUEST"
        side_effects:
          - "Site.status -> SITE_SUSPENDED; Site.lifecycle_state unchanged"
          - "every PPA of this site with state PPA_ACTIVE -> PPA_SUSPENDED (PPA_SUSPENDED is reached but not terminal)"
          - "for each such PPA: its ServicePlan in {SERVICE_ACTIVE, SERVICE_MAINTENANCE_WINDOW_OPEN} -> SERVICE_SUSPENDED; site.clearance_zone_used recomputed"
          - "for each such ServicePlan: module_replacement_stage REPLACEMENT_SCHEDULED -> REPLACEMENT_BLOCKED"
          - "for each affected Customer: Customer.hold_armed = true when Customer.credit_tier == CREDIT_SUBSTANDARD, else unchanged; Customer.exposure_hold_pct recomputed"
          - "recompute Site.active_ppa_count, Site.contracted_purchase_cents, Site.committed_feedstock_therms"
          - "PpaTransition record appended for every suspended PPA (trigger_code SITE_FROZEN)"

      - from: PPA_SUSPENDED
        to: PPA_ACTIVE
        trigger: "POST /power/sites/{id}/unfreeze"
        actor: SiteOperator
        preconditions:
          - "site.status == SITE_SUSPENDED"
          - "no ServicePlan of this site is in SERVICE_MAINTENANCE_WINDOW_OPEN"
          - "Site.draw_position_therms >= MIN_RESUME_DRAW_THERMS"
        side_effects:
          - "Site.status -> SITE_ACTIVE"
          - "every PPA of this site with state PPA_SUSPENDED -> PPA_ACTIVE"
          - "for each restored PPA: ServicePlan SERVICE_SUSPENDED -> SERVICE_ACTIVE; Site.clearance_zone_used recomputed"
          - "Customer.hold_armed = false for every affected Customer whose credit_tier != CREDIT_SUBSTANDARD"
          - "PpaTransition record appended for every restored PPA (trigger_code SITE_UNFROZEN)"

      - from: PPA_ACTIVE
        to: PPA_EXIT_PENDING
        trigger: "POST /power/ppas/{id}/request-exit"
        actor: Customer
        preconditions:
          - "site.status == SITE_ACTIVE"
          - "count of this site's FuelDeliveries in {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT} == 0"
          - "customer_cure_deadline_days >= 1"
        side_effects:
          - "Ppa.state -> PPA_EXIT_PENDING; Ppa.state_entered_at = current_utc"
          - "Ppa.exit_fee_cents recomputed from exit_fee_cents_per_kw basis"
          - "PpaTransition record appended (trigger_code EXIT_REQUESTED)"
          - "deferred action armed: terminate at state_entered_at + customer_cure_deadline_days unless cured first"

      - from: PPA_SUSPENDED
        to: PPA_EXIT_PENDING
        trigger: "POST /power/ppas/{id}/request-exit"
        actor: Customer
        preconditions:
          - "count of this site's FuelDeliveries in {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT} == 0"
          - "customer_cure_deadline_days >= 1"
        side_effects:
          - "Ppa.state -> PPA_EXIT_PENDING; Ppa.state_entered_at = current_utc"
          - "Ppa.exit_fee_cents recomputed"
          - "PpaTransition record appended (trigger_code EXIT_REQUESTED_FROM_SUSPENDED)"

      - from: PPA_EXIT_PENDING
        to: PPA_ACTIVE
        trigger: "POST /power/ppas/{id}/cure"
        actor: Customer
        preconditions:
          - "current_utc <= Ppa.state_entered_at + customer_cure_deadline_days"
          - "site.status == SITE_ACTIVE"
        side_effects:
          - "Ppa.state -> PPA_ACTIVE (cyclic revert); Ppa.state_entered_at = current_utc"
          - "Ppa.exit_fee_cents = 0"
          - "the most recent PpaTransition for this PPA gets transition_reversed = true"
          - "PpaTransition record appended (trigger_code EXIT_CURED)"
        note: "This edge is the cycle that makes the Ppa machine non-linear: PPA_ACTIVE -> PPA_EXIT_PENDING -> PPA_ACTIVE."

      - from: PPA_EXIT_PENDING
        to: PPA_TERMINATED
        trigger: "POST /power/ppas/{id}/terminate"
        actor: Customer
        preconditions:
          - "current_utc > Ppa.state_entered_at + customer_cure_deadline_days"
        side_effects:
          - "Ppa.state -> PPA_TERMINATED (terminal); Ppa.state_entered_at = current_utc"
          - "Site.active_ppa_count -= 1"
          - "Site.lifecycle_state -> RESOURCE_AVAILABLE when Site.active_ppa_count == 0 and Site.draw_position_therms > 0"
          - "Ppa.assigned_service_plan_id's ServicePlan -> SERVICE_ARCHIVED; Site.clearance_zone_used recomputed"
          - "recompute Site.contracted_purchase_cents, Site.committed_feedstock_therms"
          - "recompute Customer.active_ppa_count, Customer.reconcile_cadence_slots"
          - "PpaTransition record appended (trigger_code PPA_TERMINATED)"
        note: "A second sequential terminate on the same PPA observes state PPA_TERMINATED and is rejected by the terminal-state precondition (ERR_ALREADY_TERMINAL); this is a state precondition, not a concurrency rule."

      - from: PPA_TERMINATED
        to: PPA_ACTIVE
        trigger: "POST /power/ppas/{id}/renew"
        actor: SiteOperator
        preconditions:
          - "customer.status == CUSTOMER_ACTIVE"
          - "customer.renewal_stage == RENEWAL_ACCEPTED"
          - "site.status == SITE_ACTIVE"
        side_effects:
          - "Ppa.state -> PPA_ACTIVE; Ppa.state_entered_at = current_utc"
          - "Site.lifecycle_state -> RESOURCE_DRAWING; Site.active_ppa_count += 1"
          - "Customer.renewal_stage RENEWAL_ACCEPTED -> RENEWAL_NONE"
          - "PpaTransition record appended (trigger_code PPA_RENEWED)"

  # --- Non-linear machine #2 (parallel dimensions + cyclic hardware axis) -----
  - entity: ServicePlan
    initial_state: SERVICE_PLAN_DRAFT
    terminal_states: [SERVICE_ARCHIVED]
    transitions:
      - from: SERVICE_PLAN_DRAFT
        to: SERVICE_ACTIVE
        trigger: "POST /power/ppas/{id}/activate (system)"
        actor: system
        preconditions: ["parent Ppa entered PPA_ACTIVE in the same transaction"]
        side_effects:
          - "ServicePlan.lifecycle_state -> SERVICE_ACTIVE"
          - "Site.clearance_zone_used recomputed"

      - from: SERVICE_ACTIVE
        to: SERVICE_MAINTENANCE_WINDOW_OPEN
        trigger: "system WINDOW_ENTERED_AT_CLOCK (both window boundaries are non-null and current_utc lies in [window_start_iso8601, window_end_iso8601))"
        actor: system
        preconditions:
          - "window_start_iso8601 <= current_utc <= window_end_iso8601"
          - "Site.clearance_zone_used + radius_buffer_m <= Site.clearance_zone_capacity"
        side_effects:
          - "ServicePlan.lifecycle_state -> SERVICE_MAINTENANCE_WINDOW_OPEN"
          - "Site.clearance_zone_used recomputed over {SERVICE_ACTIVE, SERVICE_MAINTENANCE_WINDOW_OPEN}"
          - "Ppa of this plan: effective_tariff_cents_per_kwh recomputed"
          - "Ppa of this plan: availability_penalty_cents_per_kwh recomputed"

      - from: SERVICE_MAINTENANCE_WINDOW_OPEN
        to: SERVICE_ACTIVE
        trigger: "POST /power/sites/{id}/unfreeze or system WINDOW_CLOSED_AT_CLOCK"
        actor: system
        preconditions: ["current_utc > window_end_iso8601 or an unfreeze was accepted"]
        side_effects:
          - "ServicePlan.lifecycle_state -> SERVICE_ACTIVE"
          - "Site.clearance_zone_used recomputed"
        note: "SERVICE_ACTIVE <-> SERVICE_MAINTENANCE_WINDOW_OPEN is a cycle — the plan can re-enter a maintenance window."

      - from: SERVICE_ACTIVE
        to: SERVICE_SUSPENDED
        trigger: "POST /power/sites/{id}/freeze or POST /power/customers/{id}/apply-exposure-hold (system)"
        actor: system
        preconditions: ["the parent Ppa left PPA_ACTIVE in the same transaction"]
        side_effects:
          - "ServicePlan.lifecycle_state -> SERVICE_SUSPENDED"
          - "Site.clearance_zone_used recomputed (a suspended plan releases its radius_buffer_m)"

      - from: SERVICE_MAINTENANCE_WINDOW_OPEN
        to: SERVICE_SUSPENDED
        trigger: "POST /power/sites/{id}/freeze or POST /power/customers/{id}/apply-exposure-hold (system)"
        actor: system
        preconditions: ["the parent Ppa left PPA_ACTIVE in the same transaction"]
        side_effects:
          - "ServicePlan.lifecycle_state -> SERVICE_SUSPENDED"
          - "Site.clearance_zone_used recomputed"

      - from: SERVICE_SUSPENDED
        to: SERVICE_ACTIVE
        trigger: "POST /power/sites/{id}/unfreeze or POST /power/customers/{id}/release-exposure-hold (system)"
        actor: system
        preconditions:
          - "the parent Ppa re-entered PPA_ACTIVE in the same transaction"
          - "Site.status == SITE_ACTIVE"
        side_effects:
          - "ServicePlan.lifecycle_state -> SERVICE_ACTIVE"
          - "Site.clearance_zone_used recomputed"
        note: "SERVICE_ACTIVE <-> SERVICE_SUSPENDED is a cycle on the plan's lifecycle dimension."

      - from: SERVICE_ACTIVE
        to: SERVICE_ARCHIVED
        trigger: "POST /power/ppas/{id}/terminate (system)"
        actor: system
        preconditions: ["parent Ppa entered PPA_TERMINATED"]
        side_effects: ["ServicePlan.lifecycle_state -> SERVICE_ARCHIVED; Site.clearance_zone_used recomputed"]

      - from: SERVICE_SUSPENDED
        to: SERVICE_ARCHIVED
        trigger: "POST /power/ppas/{id}/terminate (system)"
        actor: system
        preconditions: ["parent Ppa entered PPA_TERMINATED"]
        side_effects: ["ServicePlan.lifecycle_state -> SERVICE_ARCHIVED; Site.clearance_zone_used recomputed"]

      - from: SERVICE_MAINTENANCE_WINDOW_OPEN
        to: SERVICE_ARCHIVED
        trigger: "POST /power/ppas/{id}/terminate (system)"
        actor: system
        preconditions: ["parent Ppa entered PPA_TERMINATED"]
        side_effects: ["ServicePlan.lifecycle_state -> SERVICE_ARCHIVED; Site.clearance_zone_used recomputed"]

      # Independent hardware dimension on the same entity — parallel state axis.
      - from: REPLACEMENT_NONE
        to: REPLACEMENT_SCHEDULED
        trigger: "POST /power/ppas/{id}/service-plans/{id}/schedule-replacement"
        actor: ServiceEngineer
        preconditions:
          - "parent Ppa.state == PPA_ACTIVE"
          - "ServicePlan.lifecycle_state == SERVICE_ACTIVE"
          - "ServicePlan.monitoring_degraded_days <= MODULE_DISPATCH_HOLD_DAYS"
        side_effects: ["ServicePlan.module_replacement_stage -> REPLACEMENT_SCHEDULED"]

      - from: REPLACEMENT_SCHEDULED
        to: REPLACEMENT_DISPATCHED
        trigger: "POST /power/ppas/{id}/service-plans/{id}/dispatch-module-replacement"
        actor: ServiceEngineer
        preconditions:
          - "ServicePlan.module_replacement_stage == REPLACEMENT_SCHEDULED"
          - "parent Ppa.assigned_service_plan_id == this ServicePlan.id"
        side_effects:
          - "ServicePlan.module_replacement_stage -> REPLACEMENT_DISPATCHED"
          - "deferred action armed: revert to REPLACEMENT_NONE at dispatch + MODULE_REPLACEMENT_REVERT_HOURS"
        note: "REPLACEMENT_DISPATCHED -> REPLACEMENT_NONE via the deferred clock action gives this dimension a cycle."

      - from: REPLACEMENT_SCHEDULED
        to: REPLACEMENT_BLOCKED
        trigger: "POST /power/sites/{id}/freeze (system)"
        actor: system
        preconditions: ["Site.status -> SITE_SUSPENDED in the same transaction"]
        side_effects: ["ServicePlan.module_replacement_stage -> REPLACEMENT_BLOCKED"]

      - from: REPLACEMENT_BLOCKED
        to: REPLACEMENT_SCHEDULED
        trigger: "POST /power/sites/{id}/unfreeze (system)"
        actor: system
        preconditions:
          - "Site.status -> SITE_ACTIVE in the same transaction"
          - "ServicePlan.lifecycle_state == SERVICE_ACTIVE"
        side_effects: ["ServicePlan.module_replacement_stage -> REPLACEMENT_SCHEDULED"]

      - from: REPLACEMENT_DISPATCHED
        to: REPLACEMENT_NONE
        trigger: "system MODULE_REPLACEMENT_REVERT_HOURS elapsed"
        actor: system
        preconditions: ["current_utc >= dispatch_instant + MODULE_REPLACEMENT_REVERT_HOURS"]
        side_effects: ["ServicePlan.module_replacement_stage -> REPLACEMENT_NONE"]

  # --- Non-linear machine #3 (parallel dimensions): customer relationship -----
  - entity: Customer
    initial_state: CUSTOMER_ACTIVE
    terminal_states: []
    transitions:
      - from: CUSTOMER_ACTIVE
        to: CUSTOMER_CREDIT_HOLD
        trigger: "POST /power/customers/{id}/apply-exposure-hold"
        actor: CustomerService
        preconditions:
          - "customer.credit_tier != CREDIT_PRIME"
          - "customer.exposure_hold_pct > 0"
        side_effects:
          - "Customer.status -> CUSTOMER_CREDIT_HOLD; Customer.hold_armed = true"
          - "every PPA of this customer with state PPA_ACTIVE -> PPA_SUSPENDED"
          - "for each such PPA: ServicePlan SERVICE_ACTIVE -> SERVICE_SUSPENDED"
          - "Site.active_ppa_count recomputed for every affected Site"
          - "PpaTransition record appended for every suspended PPA"

      - from: CUSTOMER_CREDIT_HOLD
        to: CUSTOMER_ACTIVE
        trigger: "POST /power/customers/{id}/release-exposure-hold"
        actor: CustomerService
        preconditions:
          - "Customer.outstanding_balance_cents == 0"
          - "Site.status == SITE_ACTIVE for every Site of this customer's PPAs"
        side_effects:
          - "Customer.status -> CUSTOMER_ACTIVE; Customer.hold_armed = false"
          - "every PPA of this customer with state PPA_SUSPENDED -> PPA_ACTIVE"
          - "Site.active_ppa_count recomputed for every affected Site"

      - from: CUSTOMER_ACTIVE
        to: CUSTOMER_SUSPENDED
        trigger: "POST /power/sites/{id}/freeze"
        actor: SiteOperator
        preconditions: ["reason == NONPAYMENT or reason == CUSTOMER_REQUEST"]
        side_effects: ["Customer.status -> CUSTOMER_SUSPENDED"]

      - from: CUSTOMER_SUSPENDED
        to: CUSTOMER_ACTIVE
        trigger: "POST /power/sites/{id}/unfreeze"
        actor: SiteOperator
        preconditions: ["Site.status -> SITE_ACTIVE in the same transaction"]
        side_effects: ["Customer.status -> CUSTOMER_ACTIVE"]

      # Independent relationship-review dimension — parallel state axis.
      - from: RENEWAL_NONE
        to: RENEWAL_OFFERED
        trigger: "POST /power/customers/{id}/offer-renewal"
        actor: CustomerService
        preconditions:
          - "customer.status == CUSTOMER_ACTIVE"
          - "customer.active_ppa_count >= 1"
        side_effects: ["Customer.renewal_stage -> RENEWAL_OFFERED"]

      - from: RENEWAL_OFFERED
        to: RENEWAL_ACCEPTED
        trigger: "POST /power/customers/{id}/accept-renewal"
        actor: Customer
        preconditions: ["Customer.renewal_stage == RENEWAL_OFFERED"]
        side_effects:
          - "Customer.renewal_stage -> RENEWAL_ACCEPTED"
          - "Customer.lifetime_settled_cents += 0 (no monetary effect until POST /power/ppas/{id}/renew)"

      - from: RENEWAL_OFFERED
        to: RENEWAL_DECLINED
        trigger: "POST /power/customers/{id}/decline-renewal"
        actor: Customer
        preconditions: ["Customer.renewal_stage == RENEWAL_OFFERED"]
        side_effects:
          - "Customer.renewal_stage -> RENEWAL_DECLINED"
          - "PpaTransition record appended with trigger_code PPA_RENEWAL_REFUSED for every PPA of this customer in PPA_SUSPENDED"

      - from: RENEWAL_DECLINED
        to: RENEWAL_OFFERED
        trigger: "POST /power/customers/{id}/offer-renewal"
        actor: CustomerService
        preconditions:
          - "customer.status == CUSTOMER_ACTIVE"
          - "customer.active_ppa_count >= 1"
        side_effects: ["Customer.renewal_stage -> RENEWAL_OFFERED"]
        note: "RENEWAL_OFFERED -> RENEWAL_DECLINED -> RENEWAL_OFFERED is a cycle; the renewal dimension evolves independently of the relationship posture dimension."

      - from: RENEWAL_ACCEPTED
        to: RENEWAL_NONE
        trigger: "POST /power/ppas/{id}/renew (system)"
        actor: system
        preconditions: ["Ppa.state entered PPA_ACTIVE in the same transaction"]
        side_effects: ["Customer.renewal_stage -> RENEWAL_NONE"]

  # --- Machine: site posture + independent resource-draw dimension -----------
  - entity: Site
    initial_state: SITE_ACTIVE
    terminal_states: []
    transitions:
      - from: SITE_ACTIVE
        to: SITE_SUSPENDED
        trigger: "POST /power/sites/{id}/freeze"
        actor: SiteOperator
        preconditions: ["at least one PPA of this site is in state PPA_ACTIVE"]
        side_effects:
          - "Site.status -> SITE_SUSPENDED"
          - "every PPA of this site with state PPA_ACTIVE -> PPA_SUSPENDED (cascade carries on to ServicePlan and Customer)"

      - from: SITE_SUSPENDED
        to: SITE_ACTIVE
        trigger: "POST /power/sites/{id}/unfreeze"
        actor: SiteOperator
        preconditions:
          - "Site.draw_position_therms >= MIN_RESUME_DRAW_THERMS"
          - "every Customer of this site's suspended PPAs has renewal_stage != RENEWAL_DECLINED"
        side_effects:
          - "Site.status -> SITE_ACTIVE"
          - "every PPA of this site with state PPA_SUSPENDED -> PPA_ACTIVE (cascade)"

      # Independent dimension on the same entity: fuel resource draw posture.
      - from: RESOURCE_AVAILABLE
        to: RESOURCE_DRAWING
        trigger: "POST /power/sites/{id}/resource-holds"
        actor: SiteOperator
        preconditions:
          - "requested_therms <= Site.draw_position_therms"
          - "Site.status == SITE_ACTIVE"
          - "count of this site's FuelDeliveries in {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT} (excluding this delivery) < MAX_ACTIVE_DEMANDS_PER_SITE"
        side_effects:
          - "create a resource hold FuelDelivery (lifecycle_state DELIVERY_SCHEDULED, volume_therms = requested_therms)"
          - "Site.draw_position_therms -= requested_therms"
          - "Site.lifecycle_state -> RESOURCE_DRAWING"

      - from: RESOURCE_DRAWING
        to: RESOURCE_AVAILABLE
        trigger: "POST /power/sites/{id}/release-resource-hold"
        actor: SiteOperator
        preconditions: ["Site.active_ppa_count == 0"]
        side_effects:
          - "Site.draw_position_therms += released_therms of the most recently created open hold (created_at ASC tie-broken by created_at DESC is not used; ties break on the earlier created_at)"
          - "Site.lifecycle_state -> RESOURCE_AVAILABLE"

      - from: RESOURCE_DRAWING
        to: RESOURCE_CLOSED
        trigger: "POST /power/sites/{id}/freeze"
        actor: SiteOperator
        preconditions: ["reason == GRID_INTERCONNECT_FAILURE"]
        side_effects: ["Site.lifecycle_state -> RESOURCE_CLOSED"]

      - from: RESOURCE_CLOSED
        to: RESOURCE_AVAILABLE
        trigger: "POST /power/sites/{id}/unfreeze"
        actor: SiteOperator
        preconditions: ["interconnect_exit_fee is not settled — exit fee must be acknowledged"]
        side_effects: ["Site.lifecycle_state -> RESOURCE_AVAILABLE"]

  # --- Machine: fuel delivery custody (branching with cancellation) ----------
  - entity: FuelDelivery
    initial_state: DELIVERY_SCHEDULED
    terminal_states: [DELIVERY_CANCELLED, DELIVERY_SETTLED]
    transitions:
      - from: DELIVERY_SCHEDULED
        to: DELIVERY_IN_TRANSIT
        trigger: "POST /power/sites/{id}/fuel-deliveries/{id}/dispatch"
        actor: FuelCoordinator
        preconditions:
          - "site.status == SITE_ACTIVE"
          - "count of this site's FuelDeliveries in DELIVERY_IN_TRANSIT < MAX_ACTIVE_DEMANDS_PER_SITE"
        side_effects: ["FuelDelivery.lifecycle_state -> DELIVERY_IN_TRANSIT"]

      - from: DELIVERY_SCHEDULED
        to: DELIVERY_CANCELLED
        trigger: "POST /power/sites/{id}/fuel-deliveries/{id}/cancel"
        actor: FuelCoordinator
        preconditions: ["FuelDelivery.lifecycle_state == DELIVERY_SCHEDULED"]
        side_effects:
          - "FuelDelivery.lifecycle_state -> DELIVERY_CANCELLED (terminal)"
          - "Site.draw_position_therms += canceled volume_therms"
          - "Site.lifecycle_state -> RESOURCE_AVAILABLE when Site.active_ppa_count == 0"

      - from: DELIVERY_IN_TRANSIT
        to: DELIVERY_CANCELLED
        trigger: "POST /power/sites/{id}/fuel-deliveries/{id}/cancel"
        actor: FuelCoordinator
        preconditions: ["current_utc < confirm_after_iso8601"]
        side_effects:
          - "FuelDelivery.lifecycle_state -> DELIVERY_CANCELLED (terminal)"
          - "Site.draw_position_therms += volume_therms"

      - from: DELIVERY_IN_TRANSIT
        to: DELIVERY_CONFIRMED
        trigger: "POST /power/sites/{id}/fuel-deliveries/{id}/confirm"
        actor: FuelCoordinator
        preconditions:
          - "current_utc >= confirm_after_iso8601"
          - "FuelDelivery.volume_therms <= Site.draw_position_therms"
          - "when attesting_customer_id is set: that Customer.status == CUSTOMER_ACTIVE and PPA.fuel_responsibility == CUSTOMER_SOURCED_GAS for at least one ACTIVE PPA of this Site"
        side_effects:
          - "HOP1: FuelDelivery.lifecycle_state -> DELIVERY_CONFIRMED; FuelDelivery.fuel_basis_rate_cents_per_therm computed"
          - "HOP1: Site.current_avoided_fuel_cost_cents_per_therm = FuelDelivery.effective_commodity_rate_cents_per_therm"
          - "HOP2: create PpaAccrual (accrual_type CHARGE_ACCRUAL, lifecycle_state ACCRUAL_OPEN, ppa_id = selected PPA) for the first settlement line target"
          - "HOP3: create PpaAccrual (accrual_type CAPACITY_ACCRUAL, lifecycle_state ACCRUAL_OPEN, ppa_id = selected PPA)"
          - "HOP4: recompute Ppa.output_guarantee_reserve_cents and Ppa.capacity_guarantee_reserve_cents for selected_ppa_id"
          - "HOP5: recompute Site.committed_feedstock_therms, Site.draw_position_therms, Site.lifetime_availability_credit_cents"
          - "PpaTransition record is NOT created here (delivery custody is separate from contract state)"

      - from: DELIVERY_CONFIRMED
        to: DELIVERY_SETTLED
        trigger: "system SETTLEMENT_APPLY on the linked PPA"
        actor: system
        preconditions: ["the linked Ppa has at least one settlement line in SETTLEMENT_APPLIED"]
        side_effects:
          - "FuelDelivery.lifecycle_state -> DELIVERY_SETTLED (terminal)"
          - "recompute Site.lifetime_customer_billable_cents, Site.lifetime_settled_kwh"

  # --- Machine: settlement line lifecycle (linear, with reversal) ------------
  - entity: SettlementLine
    initial_state: SETTLEMENT_DRAFT
    terminal_states: [SETTLEMENT_REVERSED]
    transitions:
      - from: SETTLEMENT_DRAFT
        to: SETTLEMENT_VALIDATED
        trigger: "POST /power/ppas/{id}/settlement-lines/{id}/validate"
        actor: SettlementAnalyst
        preconditions:
          - "ppa.state ∈ {PPA_ACTIVE, PPA_SUSPENDED}"
          - "period_end > period_start"
          - "SettlementLine.cap_side_pool_cents > 0"
        side_effects:
          - "SettlementLine.status -> SETTLEMENT_VALIDATED"
          - "SettlementLine.net_charge_cents, expected_net_charge_cents computed"

      - from: SETTLEMENT_VALIDATED
        to: SETTLEMENT_APPROVED
        trigger: "POST /power/ppas/{id}/settlement-lines/{id}/approve"
        actor: SettlementApprover
        preconditions:
          - "SettlementLine.status == SETTLEMENT_VALIDATED"
          - "Ppa.state == PPA_ACTIVE (a contract in PPA_SUSPENDED or PPA_EXIT_PENDING cannot move a line forward)"
          - "a SettlementAllowance of kind CAPACITY_ALLOWANCE with lifecycle_state ALLOWANCE_ISSUED exists for this PPA"
        side_effects:
          - "SettlementLine.status -> SETTLEMENT_APPROVED"
          - "SettlementLine.availability_credit_cents, output_guarantee_credit_cents computed"

      - from: SETTLEMENT_APPROVED
        to: SETTLEMENT_APPLIED
        trigger: "POST /power/ppas/{id}/settlement-lines/{id}/settle"
        actor: SettlementApprover
        preconditions:
          - "SettlementLine.status == SETTLEMENT_APPROVED"
          - "SettlementLine.net_charge_cents - SettlementLine.output_guarantee_credit_cents <= Site.lifetime_customer_billable_cents + SETTLEMENT_CREDIT_CAP_CENTS"
        side_effects:
          - "HOP1: SettlementLine.status -> SETTLEMENT_APPLIED"
          - "HOP1: consume one SettlementAllowance: lifecycle_state -> ALLOWANCE_APPLIED, applied_direction ALLOWANCE_APPLIED_AS_TIME"
          - "HOP2: every open PpaAccrual of this PPA with lifecycle_state ACCRUAL_OPEN and created_at <= SettlementLine.created_at -> ACCRUAL_RECONCILIATION_DONE; PpaAccrual.lifecycle_state -> ACCRUAL_RECONCILED"
          - "HOP3: Site.lifetime_settle_reconcile_count += number of accruals reconciled in HOP2"
          - "HOP4: recompute Site.lifetime_customer_billable_cents, Site.lifetime_availability_credit_cents, Site.lifetime_settled_kwh"
          - "HOP4: recompute Customer.outstanding_balance_cents, Customer.lifetime_settled_cents, Customer.lifetime_output_guarantee_credit_cents, Customer.lifetime_availability_credit_cents, Customer.reconcile_cadence_slots"
          - "HOP4: recompute Ppa.lifetime_settled_kwh, Ppa.lifetime_settled_cents, Ppa.committed_kwh_remaining, Ppa.realized_guarantee_credit_cents"

      - from: SETTLEMENT_APPLIED
        to: SETTLEMENT_REVERSED
        trigger: "POST /power/ppas/{id}/settlement-lines/{id}/reverse"
        actor: SettlementApprover
        preconditions:
          - "SettlementLine.status == SETTLEMENT_APPLIED"
          - "current_utc <= SettlementLine.applied_at + SETTLEMENT_REVERSAL_WINDOW_DAYS"
        side_effects:
          - "HOP1: SettlementLine.status -> SETTLEMENT_REVERSED (terminal); SettlementLine.allocation_basis -> UNIT_INDEX"
          - "HOP2: the consumed SettlementAllowance is returned to ALLOWANCE_ISSUED when applied_direction == ALLOWANCE_APPLIED_AS_TIME"
          - "HOP2b: every PpaAccrual that this line reconciled (ACCURAL_RECONCILED with created_at <= this line's created_at) returns to ACCRUAL_OPEN, restoring the pool to its pre-settle value"
          - "HOP3: Ppa.lifetime_settled_cents -= SettlementLine.net_charge_cents; Ppa.committed_kwh_remaining += SettlementLine.metered_kwh"
          - "HOP3: Ppa.customer_earned_ppa_tokens += number of sibling lines in this period in state SETTLEMENT_REVERSED (token ledger credit for the correction)"
          - "HOP4: Site.lifetime_customer_billable_cents and Customer.outstanding_balance_cents recomputed (drift must be zero)"

  # --- Machine: accrual ledger (append-only, reconciled by settlement) -------
  - entity: PpaAccrual
    initial_state: ACCRUAL_OPEN
    terminal_states: [ACCRUAL_RECONCILED]
    transitions:
      - from: ACCRUAL_OPEN
        to: ACCRUAL_RECONCILED
        trigger: "POST /power/ppas/{id}/settlement-lines/{id}/settle (system)"
        actor: system
        preconditions: ["PpaAccrual.created_at <= the settling SettlementLine.created_at"]
        side_effects: ["PpaAccrual.lifecycle_state -> ACCRUAL_RECONCILED"]

      - from: ACCRUAL_OPEN
        to: ACCRUAL_RECONCILED
        trigger: "POST /power/ppas/{id}/reconcile-accruals"
        actor: SettlementAnalyst
        preconditions:
          - "current_utc >= PpaAccrual.created_at + ACCRUAL_RECONCILE_SLA_DAYS"
          - "exactly one accrual of this PPA is the earliest by created_at (created_at ASC, ties broken by created_at)"
        side_effects:
          - "the earliest OPEN accrual of this PPA -> ACCRUAL_RECONCILED"
          - "Site.lifetime_settle_reconcile_count += 1"
          - "recompute Customer.reconcile_cadence_slots"

  # --- Machine: allowance ledger ---------------------------------------------
  - entity: SettlementAllowance
    initial_state: ALLOWANCE_ISSUED
    terminal_states: [ALLOWANCE_APPLIED]
    transitions:
      - from: ALLOWANCE_ISSUED
        to: ALLOWANCE_APPLIED
        trigger: "POST /power/ppas/{id}/allowances/{id}/apply"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementAllowance.lifecycle_state == ALLOWANCE_ISSUED"
          - "PPA of this allowance has no SETTLEMENT_REVERSED line in the same period"
        side_effects:
          - "SettlementAllowance.lifecycle_state -> ALLOWANCE_APPLIED; applied_direction -> ALLOWANCE_APPLIED_AS_TIME"
          - "SettlementAllowance.applied_cap_cents, applied_days, capped_daily_energy_cents, applied_amount_cents computed"
          - "for a CAPACITY_ALLOWANCE: Site.reserved_capacity_hold_count += 1"

      - from: ALLOWANCE_ISSUED
        to: ALLOWANCE_APPLIED
        trigger: "POST /power/ppas/{id}/allowances/{id}/apply"
        actor: SettlementAnalyst
        preconditions:
          - "PPA of this allowance has at least one SETTLEMENT_REVERSED line in the same period"
          - "the allowance must target the first not-yet-reconciled PpaAccrual of the PPA"
        side_effects:
          - "SettlementAllowance.lifecycle_state -> ALLOWANCE_APPLIED; applied_direction -> ALLOWANCE_APPLIED_AS_REVERSAL"
          - "SettlementAllowance.applied_to_accrual_id = the first OPEN accrual by created_at ASC; applied_to_ppa_id = that accrual's ppa_id"
          - "that PpaAccrual.signed_amount_cents recorded as offset by the allowance amount"
          - "SettlementAllowance.applied_cap_cents, applied_days, capped_daily_energy_cents, applied_amount_cents computed"

# =============================================================================
# Concurrency Rules — true races only, resolved by OCC on the parent version
# =============================================================================
concurrency_rules:
  - rule_id: delivery-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /power/sites/{id}/fuel-deliveries"
    occ_field: "expected_site_version"
    description: |
      Creating a FuelDelivery against a Site whose version has advanced since the
      client last observed it is rejected. A second sequential create is otherwise
      legitimate — a site may hold many scheduled deliveries — so the only guard is
      the caller's observed Site version, which the earlier create (and its cascades
      into Site.draw_position_therms) has already bumped.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-line-create-stale-ppa
    parent_entity: Ppa
    write_endpoint: "POST /power/ppas/{id}/settlement-lines"
    occ_field: "expected_ppa_version"
    description: |
      Creating a SettlementLine against a Ppa whose version has advanced since the
      client last observed it is rejected. Sequential creation of a second period is
      otherwise legitimate, and the earlier create legitimately supersedes the
      caller's view because it rewrites the PPA's pool-derived fields.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allowance-issue-stale-ppa
    parent_entity: Ppa
    write_endpoint: "POST /power/ppas/{id}/allowances"
    occ_field: "expected_ppa_version"
    description: |
      Issuing a SettlementAllowance against a Ppa whose version has advanced since
      the client last observed it is rejected. Issuing a further allowance is
      otherwise legitimate, so the stale observed Ppa version is the sole guard.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:

  - name: composite_hedged_index_price
    trigger: "On FuelDelivery creation and on POST /power/sites/{id}/power/fuel-deliveries/{id}/confirm"
    algorithm: weighted_scoring
    formula: |
      effective_commodity_rate_cents_per_therm
        = hedged_fraction * fixed_price_cents_per_therm
        + (1 - hedged_fraction) * index_rate_cents_per_therm
      Evaluation order: the two products are computed first, then summed, then
      rounded once to 4 decimal places.
    input_set: "The FuelDelivery being priced. index_rate_cents_per_therm is required
      (and non-null) only when sourcing_mode = INDEXED_BLEND; for FIXED_PRICE_BLEND the
      index leg is forced to 0 and hedged_fraction is forced to 1."
    constants:
      INDEXED_BLEND_REQUIRES_INDEX: true
    precision: "4 decimal places, round_half_up"
    variants:
      - name: delivered_basis
        when: "FuelDelivery.lifecycle_state ∈ {DELIVERY_CONFIRMED, DELIVERY_SETTLED}"
        difference: "Uses the frozen index_rate_cents_per_therm captured at confirm time; later index movements do not re-price the delivery."
      - name: replayed_basis
        when: "FuelDelivery.lifecycle_state ∈ {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT} and the formula is re-evaluated for a what-if projection"
        difference: "Uses the site's current gas_commodity_rate_cents_per_therm as the index leg, so the same delivery yields a different rate before and after confirm."

  - name: fuel_adder_index_ceiling_rate
    trigger: "On Ppa activate, on ServicePlan maintenance-window open, and on POST /power/sites/_ops/recompute-index-bases"
    algorithm: constraint_propagation
    formula: |
      contract_index_ceiling_cents_per_therm = site.gas_commodity_rate_cents_per_therm * INDEX_CEILING_MULTIPLE
      effective_fuel_adder_cents_per_therm_unguarded = fuel_adder_cents_per_therm
      effective_fuel_adder_cents_per_therm = min(effective_fuel_adder_cents_per_therm_unguarded, HARD_CAP_CENTS_PER_THERM)
      # Site-side pool cascade: each PPA's capped adder propagates to the site aggregate.
      Site.current_avoided_fuel_cost_cents_per_therm = min(
        FuelDelivery.effective_commodity_rate_cents_per_therm,
        site.gas_commodity_rate_cents_per_therm * SOURCED_INDEX_CEILING_MULTIPLE)
      Site.contracted_purchase_cents = sum over PPAs in {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED}
        of Ppa.purchase_price_cents_per_kwh * Ppa.contracted_kwh
      Site.committed_feedstock_therms = sum over PPAs in {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED}
        of Ppa.term_years * 365 * Ppa.contracted_kwh / Ppa.contracted_efficiency_kwh_per_therm
    input_set: "All PPAs of the site regardless of ServicePlan state; ServicePlan
      maintenance windows are excluded from the fuel pool entirely."
    constants:
      HARD_CAP_CENTS_PER_THERM: 14.0
      INDEX_CEILING_MULTIPLE: 1.5
      SOURCED_INDEX_CEILING_MULTIPLE: 1.25
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional_basis
        when: "Ppa.state = PPA_DRAFT; the site's declared gas index is used without any confirmed delivery"
        difference: "The index leg equals site.gas_commodity_rate_cents_per_therm, so the projection is not yet anchored to a real delivery."
      - name: realized_basis
        when: "Ppa.state ∈ {PPA_ACTIVE, PPA_SUSPENDED}; the site's current_avoided_fuel_cost_cents_per_therm is used"
        difference: "The index leg equals the most recent CONFIRMED delivery, so the identical contract inputs produce a different adder leg than the provisional variant."

  - name: forward_looking_net_charge_basis
    trigger: "On POST /power/ppas/{id}/power/settlement-lines, and on every recompute of the line"
    algorithm: forward_looking
    formula: |
      cap_side_pool_cents      = sum over PpaAccrual(ppa) where accrual_type IN {CHARGE_ACCRUAL, OUTPUT_GUARANTEE_ACCRUAL}
                                 and lifecycle_state = ACCRUAL_OPEN, ordered by created_at ASC,
                                 of signed_amount_cents
      variable_energy_cents    = round_half_up(metered_kwh * effective_tariff_cents_per_kwh, 2)
                                 + round_half_up(metered_kwh * effective_fuel_adder_cents_per_therm
                                                 / contracted_efficiency_kwh_per_therm, 2)
      fixed_purchase_cents     = round_half_up(term_years * contracted_annual_kwh
                                               * purchase_price_cents_per_kwh / 12, 2)
      loss_component_cents     = round_half_up(cap_side_pool_cents * LOSS_ALLOCATION_PCT, 2)
      net_charge_cents         = round_half_up(cap_side_pool_cents, 2)
                                 + round_half_up(variable_energy_cents, 2)
                                 + round_half_up(fixed_purchase_cents, 2)
                                 + round_half_up(loss_component_cents, 2)
      Rounding order (pinned): each component is rounded to 2dp independently, floor
      by floor, and the rounded components are summed last. Summing all floors then
      rounding once would produce different cents.
    input_set: "Open accruals are included only when lifecycle_state = ACCRUAL_OPEN;
      ACCRUAL_RECONCILED accruals are excluded from cap_side_pool_cents but replay into
      Ppa.lifetime_settled_cents. Settlement lines in SETTLEMENT_DRAFT,
      SETTLEMENT_VALIDATED and SETTLEMENT_APPROVED all see the same pool."
    constants:
      LOSS_ALLOCATION_PCT: 0.04
      SETTLEMENT_CREDIT_CAP_CENTS: 50000000
    precision: "2 decimal places, round_half_up, rounded per floor then summed"
    variants:
      - name: draft_basis
        when: "SettlementLine.status ∈ {SETTLEMENT_DRAFT, SETTLEMENT_VALIDATED}"
        difference: "Includes accruals that are still ACCRUAL_OPEN at read time, so a later confirm of a delivery changes the draft figure."
      - name: locked_basis
        when: "SettlementLine.status ∈ {SETTLEMENT_APPROVED, SETTLEMENT_APPLIED}"
        difference: "Freezes cap_side_pool_cents at the value observed when the line left SETTLEMENT_VALIDATED; subsequent accrual reconciliation does not move it, so the same inputs produce a different total than draft_basis."

  - name: recurring_base_charge_pools
    trigger: "On SettlementLine validate/approve/settle"
    algorithm: waterfall_allocation
    formula: |
      resource_side_pool_cents = sum over PpaAccrual(ppa) where accrual_type = CAPACITY_ACCRUAL
                                 and lifecycle_state = ACCRUAL_OPEN of signed_amount_cents
      base_pool_after_resources    = max(0, cap_side_pool_cents - resource_side_pool_cents)
      loss_headroom_cents          = round_half_up(loss_component_cents, 2)
      pool_after_loss              = max(0, base_pool_after_resources - loss_headroom_cents)
      guaranteed_period_kwh = contracted_annual_kwh * period_days / 365
      actual_period_output_kwh = sum of metered_kwh over this PPA's SETTLEMENT_APPLIED lines
                                 whose period_start falls in [period_end - period_days, period_end)
      output_guarantee_shortfall_cents = round_half_up(
          max(0, guaranteed_period_kwh - actual_period_output_kwh) * effective_tariff_cents_per_kwh, 2)
      availability_shortfall_kwh   = max(0, (1 - guaranteed_availability_pct) * expected_annual_site_load_kwh)
      capacity_guarantee_shortfall_cents = round_half_up(availability_shortfall_kwh
          * availability_penalty_cents_per_kwh, 2)
      net_charge_cents = pool_after_loss - output_guarantee_shortfall_cents - capacity_guarantee_shortfall_cents
      Overflow rule: when both guaranteed_shortfall_cents sum to more than pool_after_loss,
      overflow_cents = total_shortfall - pool_after_loss and overflow_cents is carried as a
      balance on this line to the following period's cap_side_pool_cents.
    input_set: "period_days = (period_end - period_start) / 86400, floored. Actual period
      output is the sum of metered_kwh over this PPA's SETTLEMENT_APPLIED lines whose
      period_start falls in [period_end - period_days, period_end)."
    constants:
      AVAILABILITY_CREDIT_MONTHLY_DRAW_PCT: 0.60
    precision: "2 decimal places, round_half_up"
    variants:
      - name: marginal_basis
        when: "SettlementLine.allocation_basis == ALLOCATION_ORDER"
        difference: "Resources are charged at the marginal pool rate, yielding a smaller net charge for the same metered output."
      - name: apportioned_basis
        when: "SettlementLine.allocation_basis == UNIT_INDEX"
        difference: "Resources are apportioned across the period's lines by index, yielding a larger net charge for the same metered output."

  - name: guaranteeshed_remedy_credit
    trigger: "On SettlementLine approve and on POST /power/sites/_ops/recompute-index-bases"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): tiered remedy with nested min/max and a state branch.
      billed_monthly_charge_cents = round_half_up(net_charge_cents, 2)
      guaranteed_period_kwh = contracted_annual_kwh * period_days / 365
      actual_period_output_kwh = sum of metered_kwh over this PPA's SETTLEMENT_APPLIED lines
                                 whose period_start falls in [period_end - period_days, period_end)
      output_shortfall_cents = round_half_up(
          max(0, guaranteed_period_kwh - actual_period_output_kwh) * effective_tariff_cents_per_kwh, 2)
      energy_component_cents = round_half_up(
          output_shortfall_cents * ENERGY_REMEDY_PCT * min(1, billed_monthly_charge_cents
                                                          / OUTPUT_REMEDY_REFERENCE_CENTS), 2)
      if energy_component_cents <= OUTPUT_REMEDY_TIER0_CENTS:
          energy_component_cents = energy_component_cents * TIER0_PAYOUT_PCT
      else:
          energy_component_cents = min(energy_component_cents, OUTPUT_REMEDY_TIER1_CENTS)
      availability_component_cents = round_half_up(
          max(0, availability_shortfall_kwh * availability_penalty_cents_per_kwh), 2)
      if billed_monthly_charge_cents >= OUTPUT_REMEDY_TIER0_CENTS:
          tier_gate_pct = TIER1_PAYOUT_PCT
      else:
          tier_gate_pct = TIER0_PAYOUT_PCT
      output_guarantee_credit_cents = round_half_up(energy_component_cents * tier_gate_pct, 2)
                                      + round_half_up(availability_component_cents, 2)
      Remedy is capped by: min(output_guarantee_credit_cents, cap_side_pool_cents).
    input_set: "period_days = (period_end - period_start) / 86400, floored. actual_period_output_kwh
      is the sum of metered_kwh over SETTLEMENT_APPLIED lines whose period_start falls in
      [period_end - period_days, period_end); SETTLEMENT_REVERSED lines are excluded."
    constants:
      ENERGY_REMEDY_PCT: 0.92
      OUTPUT_REMEDY_REFERENCE_CENTS: 380000
      OUTPUT_REMEDY_TIER0_CENTS: 100000
      OUTPUT_REMEDY_TIER1_CENTS: 90000
      TIER0_PAYOUT_PCT: 1.35
      TIER1_PAYOUT_PCT: 0.80
      HIGH_LOAD_TIER_1_MULTIPLE: 1.75
      HIGH_LOAD_TIER_2_MULTIPLE: 1.55
    precision: "2 decimal places, round_half_up"
    variants:
      - name: monthly_proration
        when: "SettlementLine.hourly_settlement == false"
        difference: "The availability component uses the whole period's shortfall; the energy component uses the annualised output shortfall."
      - name: hourly_proration
        when: "SettlementLine.hourly_settlement == true"
        difference: "The energy component is multiplied by the sibling-ratio term (k / (k + 1)) where k is the count of the period's hourly lines, so the identical shortfall yields a smaller credit."

  - name: availability_guarantee_escrow_draw
    trigger: "On Ppa activate, on ServicePlan state change, and on SettlementLine approve"
    algorithm: threshold
    formula: |
      availability_shortfall_kwh = max(0, (1 - guaranteed_availability_pct) * expected_annual_site_load_kwh)
      availability_penalty_cents_per_kwh = round_half_up(
          grid_tariff_rate_cents_per_kwh * AVAILABILITY_PENALTY_MULTIPLE, 2)
      reserve_target_cents = round_half_up(
          availability_shortfall_kwh * availability_penalty_cents_per_kwh + loss_floor_cents, 2)
      monthly_draw_cents = round_half_up(
          reserve_target_cents * AVAILABILITY_CREDIT_MONTHLY_DRAW_PCT, 2)
      availability_credit_cents = round_half_up(monthly_draw_cents, 2)
    input_set: "expected_annual_site_load_kwh is the Site field; loss_floor_cents is the
      PPA field. Reserve target is never recomputed from a SETTLEMENT_REVERSED line."
    constants:
      AVAILABILITY_PENALTY_MULTIPLE: 1.20
      AVAILABILITY_CREDIT_MONTHLY_DRAW_PCT: 0.60
    precision: "2 decimal places, round_half_up"
    variants:
      - name: whole_facility_basis
        when: "SettlementLine.hourly_settlement == false"
        difference: "Shortfall is measured against the whole modelled facility load."
      - name: contracted_capacity_basis
        when: "SettlementLine.hourly_settlement == true"
        difference: "Shortfall is measured against contracted_kw * 8760 * (1 - availability_pct), which can be smaller or larger than the facility basis, so the identical site yields a different credit."

  - name: capacity_guarantee_reserve_floor
    trigger: "On Ppa activate, on SettlementLine settle, and on allowancing"
    algorithm: constraint_propagation
    formula: |
      capacity_reserve_credits_cents = sum of every applied SettlementAllowance.applied_amount_cents
                              for this PPA + every PpaAccrual.amount_cents for this PPA
                              with accrual_type = TRUEUP_ACCRUAL
      headroom_cents = capacity_reserve_pre_cents - loss_floor_cents
      Rejection rule: when capacity_reserve_credits_cents > headroom_cents the write is refused
      with ERR_GUARANTEE_FLOOR_BREACH and nothing is persisted.
      capacity_guarantee_reserve_cents = capacity_reserve_pre_cents - capacity_reserve_credits_cents
      Evaluation order (pinned): headroom is computed first, the rejection compares the whole
      accumulated credit figure against it, and only then is the persisted reserve written.
      A write that would take credits past the headroom never lands, so the persisted reserve
      can never fall below loss_floor_cents.
    input_set: "capacity_reserve_credits_cents includes CAPACITY_ALLOWANCE apply_as_time
      amounts plus TRUEUP_ACCRUAL amounts. A credit returned because its settlement line was
      reversed is excluded."
    constants:
      LOSS_FLOOR_STEP_CENTS: 100
      CAPACITY_RESERVE_FLOOR_PCT: 0.25
    precision: "integer cents, floor"
    variants:
      - name: applied_basis
        when: "Ppa.state ∈ {PPA_ACTIVE, PPA_SUSPENDED}"
        difference: "Credits applied to date are netted against the reserve."
      - name: forward_basis
        when: "Ppa.state = PPA_DRAFT; the reserve is projected rather than netted"
        difference: "credits_applied_cents is forced to 0, so the provisional reserve is strictly larger than the applied reserve for the same contract."

  - name: availability_cap_apportionment
    trigger: "On POST /power/ppas/{id}/allowances/{id}/apply and on SettlementLine approve"
    algorithm: waterfall_allocation
    formula: |
      daily_energy_cents = round_half_up(daily_kwh * effective_tariff_cents_per_kwh, 2)
      capped_daily_energy_cents = min(daily_energy_cents, DAILY_ENERGY_CAP_CENTS)
      daily_fixed_cents = round_half_up(daily_kw_charge_cents_per_kw * contracted_kw, 2)
      applied_cap_cents = min(allowance.amount_cents, 2 * net_charge_cents_of_applied_line)
      applied_days = max(1, floor(applied_cap_cents / (capped_daily_energy_cents + daily_fixed_cents)))
      applied_amount_cents = applied_days * (capped_daily_energy_cents + daily_fixed_cents)
      Boundary precision: applied_days uses floor, not round; and it is floored at 1 —
      an allowance whose cap is smaller than one day still buys exactly one day.
    input_set: "daily_kwh is the applied line's metered_kwh / 30. The cap is applied to the
      energy leg only; the fixed leg is never capped."
    constants:
      DAILY_ENERGY_CAP_CENTS: 250000
      DAILY_KWH_DIVISOR: 30
    precision: "integer cents and integer days, floor"
    variants:
      - name: whole_month_basis
        when: "allowance_kind == AVOIDED_COST_ALLOWANCE"
        difference: "The cap uses 2 * net_charge_cents of the applied line without the fixed-line cap."
      - name: per_day_basis
        when: "allowance_kind == CAPACITY_ALLOWANCE"
        difference: "The cap additionally floors applied_days at 1 and increments Site.reserved_capacity_hold_count, so the same amount buys a different number of days."

  - name: avoided_cost_credit_foldin
    trigger: "On POST /power/ppas/{id}/allowances/{id}/apply"
    algorithm: dual_variant
    formula: |
      # Chronological variant: add the new line's net charge on top of the
      # already-reduced running balance (which folds in every prior reversed line).
      chronological_delta_cents = line.net_charge_cents
      # Forward-looking variant: reduce the balance by replacing the reversed
      # line's net charge with the new line's net charge, ignoring the running fold.
      forward_delta_cents = line.net_charge_cents - reversed_line_gross_charge_cents
    input_set: "chronological folds the reversal of every prior REVERSED line in the period.
      forward-looking considers only the line named by the allowance."
    constants:
      NONE: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: chronological_folded
        when: "the period contains at least one SETTLEMENT_REVERSED line"
        difference: "Produces a strictly larger credit than forward-looking for identical evidence, because reversed lines are pre-netted."
      - name: forward_looking_gross
        when: "the period contains no SETTLEMENT_REVERSED line but the allowance targets a replacement line"
        difference: "Produces the net delta only, so the identical evidence credits less."

  - name: commitment_allocation_rights
    trigger: "On FuelDelivery create/confirm, on Ppa activate, and on Ppa terminate"
    algorithm: waterfall_allocation
    formula: |
      remaining_committed_kwh = term_years * contracted_annual_kwh - lifetime_settled_kwh
      party          = ppa_id + '-' + str(customer_id)
      party_committed_kwh = sum of remaining_committed_kwh over PPAs in {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED}
                            belonging to that party, treated as one member-level pool
      party_allocated_kwh = sum of allocation.allocated_kwh over allocations on this PPA
                            in allocations with a later period_end
      rights         = min(remaining_committed_kwh, max(0, party_committed_kwh - party_allocated_kwh))
      # Entity scoping: the member may hold one additional package beyond its PPA pool.
      # The sub-limit applies only when the package's start date is later than the
      # member's most recent allocation date.
      unit_ratio     = min(allocated_kwh / PPA.contracted_kw, SCOPE_RATIO_CEILING)
      weights        = {rights: 0.5, unit_ratio: 0.3, term_months: 0.2}
      score_dollars_cents = round_half_up(100 * sum(w * normalized(x) for x in weights), 2)
      Restricted-party cap: when allocation.party_effective_flag == "active", the allocation
      is additionally capped by the party's contracted commitment.
    input_set: "Only allocations whose period_end is later than the delivery's period are
      counted in party_allocated_kwh."
    constants:
      SCOPE_RATIO_CEILING: 3
      ALLOCATION_CEILING_PCT: 0.55
      FALLBACK_BINDING_PCT: 0.55
    precision: "2 decimal places, round_half_up"
    variants:
      - name: member_pool_basis
        when: "the customer holds at least two PPAs in {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED} at the site"
        difference: "Remaining kwh is pooled across the customer's contracts before the min() is taken."
      - name: package_basis
        when: "the customer holds exactly one PPA in {PPA_DRAFT, PPA_ACTIVE, PPA_SUSPENDED} at the site"
        difference: "Remaining kwh is read from the single contract, so the same delivery yields a smaller rights figure."

  - name: commitment_swap_netting
    trigger: "On allocation create and on allocation supersede"
    algorithm: dual_variant
    formula: |
      total_customer_settled_cents = sum over allocations of the customer's PPAs
                                     of allocation.settled_cents
      # Partition A: loop by the line's stored unit index, assigning each successive
      # allocation to the next PPA of the customer.
      partition_a_settled_cents = first_unsettled_allocation.settled_cents
      # Partition B: compare the candidate's committed_kwh_remaining against the
      # already-settled quantity.
      partition_b_settled_cents = total_customer_settled_cents - existing_settled_cents
      credit_cents = min(partition_a_settled_cents, partition_b_settled_cents)
      Boundary precision: the loop is over the customer's PPA membership order, not over
      index values; an index at the ceiling wraps to zero and must not be counted twice.
    input_set: "existing_settled_cents is the sum over SETTLEMENT_APPLIED lines of the
      superseded allocation's PPA; the superseding allocation is excluded."
    constants:
      EXCESS_ALLOCATION_TOLERANCE_PCT: 0.10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: total_basis
        when: "the customer's PPA count at the site is greater than 1"
        difference: "Partition B nets against the whole customer portfolio, producing a smaller credit."
      - name: per_contract_basis
        when: "the customer's PPA count at the site equals 1"
        difference: "Partition B nets only against the single contract, producing a larger credit."

  - name: charge_allocation_on_reversal
    trigger: "On POST /power/ppas/{id}/power/settlement-lines/{id}/reverse and on every recompute of a non-reversed sibling line in the same period"
    algorithm: allocation
    formula: |
      # MODE (c): circular-looking dependency, pinned evaluation order.
      # Step 1 (base only): the charge is derived from the four pools, ignoring the
      #   sibling reversal — this is the previous line's declared value.
      # Step 2 (allocation discount): the reversed sibling increases the period's
      #   allocation weight, which the allocation discount then keys on.
      # Step 3 (adjusted): net_charge_allocated_cents = net_charge_cents - discount_cents.
      discount_cents = round_half_up(charge_allocation_base_cents * allocation_discount_pct, 2)
      net_charge_allocated_cents = round_half_up(net_charge_cents, 2) - discount_cents
      allocation_discount_pct = min(ALLOCATION_DISCOUNT_CEILING_PCT,
                                    nonreversed_line_count / total_period_line_count)
      Evaluation order is pinned left-to-right as written: read the stored base allocation
      first, apply the discount second, and only then compare against the period cap. The
      adjusted figure must never be fed back into the discount computation.
    input_set: "nonreversed_line_count counts this PPA's lines in
      {SETTLEMENT_VALIDATED, SETTLEMENT_APPROVED, SETTLEMENT_APPLIED};
      total_period_line_count additionally counts this PPA's SETTLEMENT_REVERSED lines."
    constants:
      ALLOCATION_DISCOUNT_CEILING_PCT: 0.35
      PERIOD_ALLOCATION_CENT_CAP: 75000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: descending_chronological
        when: "the period's lines are recomputed in created_at ASC order"
        difference: "The discount for each line is computed against the running non-reversed count as it stood at that line."
      - name: descending_unit_index
        when: "the period's lines are recomputed in descending unit index (highest unit index first), used for the allocation-basis re-check"
        difference: "Each line sees the fully-adjusted period count immediately, so the first line processed is discounted less than under the chronological variant."

  - name: settlement_reversal_trueup
    trigger: "On POST /power/ppas/{id}/power/settlement-lines/{id}/reverse and on POST /power/ppas/{id}/reconcile-accruals"
    algorithm: chronological
    formula: |
      reversed_count      = count of lines in the PPA's most recent period with status SETTLEMENT_REVERSED
      open_count          = count of the PPA's PpaAccrual rows with lifecycle_state = ACCRUAL_OPEN
      trueup_amount_cents = if reversed_count > open_count
                            then round_half_up(net_charge_cents * TRUEUP_EXCESS_PCT, 2)
                            else 0
      # Create/update exactly one PpaAccrual(accrual_type = TRUEUP_ACCRUAL, ppa_id = this PPA)
      # in lifecycle_state ACCRUAL_OPEN carrying trueup_amount_cents.
      signed_amount_cents of a TRUEUP_ACCRUAL is +amount_cents.
      Boundary precision: the comparison is strict (>), not >=; equal counts produce zero
      true-up. The reversed_count and open_count are both read before any write in this
      request (snapshot semantics).
    input_set: "only SETTLEMENT_REVERSED lines in the PPA's most recent period count."
    constants:
      TRUEUP_EXCESS_PCT: 0.15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: per_line_trueup
        when: "the reversal is issued line-by-line"
        difference: "one true-up accrual is written per reversal, so the pool grows in repeated increments."
      - name: batch_trueup
        when: "the reversal is processed by POST /power/ppas/{id}/reconcile-accruals across a batch"
        difference: "a single true-up accrual is written for the whole batch, so the pool grows by one increment."

  - name: rollover_carry_pool
    trigger: "On POST /power/sites/_ops/rollover-period"
    algorithm: chronological
    formula: |
      # Batch process in a pinned order, recomputing the pool after each row.
      sort order: period_anchor_iso8601 ASC, then created_at ASC, then allocation_weight DESC
      for each row in that order:
          pool_cents = pool_cents - row.settled_cents
          if pool_cents < 0:
              row.settled_cents = row.settled_cents + pool_cents   # clamps the row
              pool_cents = 0
          row.status -> SETTLEMENT_APPLIED
      # Post-pass with a different tie-break:
      #   rows whose period_anchor_iso8601 ties are re-processed with last-updated
      #   ordering (updated_at ASC) instead of created_at ASC, so the same rows can
      #   settle against different opening pools and produce a different carry.
      # Ties are broken with created_at, never with id.
    input_set: "rows in SETTLEMENT_APPROVED whose period_anchor_iso8601 <= current_utc."
    constants:
      POOL_OPENING_CENTS: 500000
    precision: "integer cents, round_half_up"
    variants:
      - name: primary_ordering
        when: "the selected PPA is the one with the minimum created_at among candidates"
        difference: "Uses period_anchor_iso8601 ASC then created_at ASC."
      - name: fallback_ordering
        when: "no eligible row exists for the primary ordering (all candidates already settled)"
        difference: "Falls back to the row with the earliest created_at at the site and restarts the pool, so the same rows carry a different remainder."

  - name: purchase_leftover_days_rebate
    trigger: "On the last day of the contract term and on POST /power/sites/_ops/close-period"
    algorithm: chronological
    formula: |
      leftover_days = floor(term_years * 365) - sum of days already settled on this PPA
      unused_paid_cents = round_half_up(leftover_days_per_contract * purchase_price_cents_per_kwh * contracted_kw
                                        * DAILY_KW_HOURS, 2)
      rebate_cents = round_half_up(unused_paid_cents - used_paid_cents, 2)
      Sequence: settle the contract's daily modifications in created_at ASC order, then
      apply the leftover-days rebate as the final row. A rebate computed before the
      modifications settle yields a different figure than the same rebate computed after.
      Boundary precision: leftover_days uses floor, and a leftover_days of exactly 0
      produces rebate_cents == 0 rather than a negative figure.
    input_set: "used_paid_cents is the sum over SETTLEMENT_APPLIED lines of
      purchase_price_cents_per_kwh * metered_kwh; SETTLEMENT_REVERSED lines are excluded."
    constants:
      DAILY_KW_HOURS: 24
    precision: "2 decimal places, round_half_up"
    variants:
      - name: change_of_ownership_basis
        when: "Ppa.contract_basis == PPA_BASIS_TRANSFERRED"
        difference: "The rebate is apportioned between the transferring and receiving party, so the same contract pays a different rebate."
      - name: continuing_owner_basis
        when: "Ppa.contract_basis == PPA_BASIS_AS_BUILT"
        difference: "The rebate is paid wholly to the original party."

  - name: escalator_basis_proration
    trigger: "On SettlementLine create and on every recompute of the line"
    algorithm: tiered_pricing
    formula: |
      # MODE (b): nested rounding where order matters.
      # Pinned order: round each line to 2dp, THEN sum the rounded lines.
      line_cents   = round_half_up(min(days_in_line, remaining_days) * daily_rate_cents, 2)
      period_cents = sum of line_cents over the period's lines
      # period_start and period_end are half-open [start, end): a line ending exactly on
      # its successor's start does not double-count that instant.
      # The contact server time is authoritative; the comparison is at second granularity
      # after converting both endpoints to the site's local date.
      straddling_lines_cents = sum of line_cents for lines whose period_stay spans a month boundary
      if period_stays_crossing_boundary_count >= 1:
          straddling_tax_cents = round_half_up(straddling_lines_cents * tax_rate_pct, 2)
      else:
          straddling_tax_cents = 0
      elapsed_day_cents = round_half_up(years_elapsed_since_state_entered_at * contract_daily_rate_cents, 2)
      tax_delta_line_cents = round_half_up(TAX_DELTA_PCT * elapsed_day_cents, 2)
      expected_net_charge_cents = period_cents + straddling_tax_cents + tax_delta_line_cents
      Boundary precision: years_elapsed is floored, so a period starting exactly on the
      contract anniversary uses the un-escalated rate.
    input_set: "remaining_days is the PPA's committed_kwh_remaining / contracted_annual_kwh * 365."
    constants:
      TAX_DELTA_PCT: 0.06
    precision: "2 decimal places, round_half_up, per line then summed"
    variants:
      - name: reconciled_basis
        when: "the line's period_end has already passed"
        difference: "Uses TAX_DELTA_PCT in the delta term."
      - name: forecast_basis
        when: "the line's period_end is after current_utc"
        difference: "Replaces TAX_DELTA_PCT with TAX_DELTA_PCT * FORECAST_DISCOUNT_PCT, so the identical line yields a smaller expected charge."

  - name: output_shortfall_two_pools
    trigger: "On SettlementLine approve, and on POST /power/sites/_ops/rollover-period"
    algorithm: dual_variant
    formula: |
      # MODE: dual variant, two pools over the same inputs.
      # Variant (i) FORECAST pool: each shortfall unit is valued at the current
      #   effective_tariff_cents_per_kwh and the pool is credited once.
      guaranteed_period_kwh = contracted_annual_kwh * period_days / 365
      shortfall_kwh = max(0, guaranteed_period_kwh - actual_period_output_kwh)
      forecast_pool_cents = round_half_up(shortfall_kwh * effective_tariff_cents_per_kwh, 2)
      unit_pool_cents = sum over the period's lines of
                        round_half_up(shortfall_kwh
                                      * escalated_rate_cents_per_kwh
                                      * (line_metered_kwh / period_metered_kwh or 0), 2)
      # Two counter-pools must end equal:
      #   sum(unit_pool_cents) == forecast_pool_cents
      # Cap: the reserve funds at most capacity_guarantee_reserve_cents of the forecast pool.
      capped_forecast_pool_cents = min(forecast_pool_cents, capacity_guarantee_reserve_cents)
    input_set: "actual_period_output_kwh excludes SETTLEMENT_REVERSED lines within 15 days
      of the settling line; a line reversed after 15 days is outside the window."
    constants:
      FORECAST_WINDOW_DAYS: 15
      FORECAST_DISCOUNT_PCT: 0.85
    precision: "2 decimal places, round_half_up"
    variants:
      - name: index_forward_basis
        when: "the forecast window is still open at read time"
        difference: "Units are valued at the current index rate."
      - name: index_period_basis
        when: "the forecast window has closed"
        difference: "Units are valued at each line's own period rate, so the identical shortfall values differently."

  - name: home_availability_measure
    trigger: "On Ppa activate and on every settlement recompute"
    algorithm: aggregation
    formula: |
      # MODE (a): combinatorial with a state branch and nested min/max.
      year_start = current_utc year
      yr_kwh       = sum of metered_kwh over lines with period_start.clock_year == year_start
      prior_kwh    = sum of metered_kwh over lines with period_start.clock_year == year_start - 1
      own_yr_days  = sum of days represented by yr_kwh
      own_pr_days  = sum of days represented by prior_kwh
      if contracted_annual_kwh > 0:
          self_capacity  = 1
          self_load      = min(1.0, expected_annual_site_load_kwh / contracted_annual_kwh)
          pr_capacity    = 0
          pr_load        = 1.0
          cap_adds       = sum of max(0, contracted_kw) over the site's PPAs
          load_adds      = sum of max(0, contracted_kwh_remaining) over the site's PPAs
      else:
          self_capacity  = 0
          self_load      = 0
          pr_capacity    = 1
          pr_load        = min(1.0, contracted_annual_kwh / max(1, expected_annual_site_load_kwh))
          cap_adds       = 0
          load_adds      = 1
      year_availability_pct = (yr_kwh + cap_adds) / max(1, (own_yr_days + load_adds))
      prior_availability_pct = (prior_kwh + pr_capacity * cap_adds) / max(1, (own_pr_days + pr_load * load_adds))
      if year_availability_pct >= guaranteed_availability_pct:
          headroom_pct = min(0.2, year_availability_pct - guaranteed_availability_pct)
      else:
          headroom_pct = 0
      availability_ratio = min(1.0, year_availability_pct) + headroom_pct
      potential_availability_ratio = min(1.0, prior_availability_pct)
      expected_annual_site_kwh = expected_annual_site_load_kwh * availability_ratio
      expected_annual_site_prior_kwh = expected_annual_site_load_kwh * potential_availability_ratio
      # This is the plant's home-availability measure, distinct from
      # home_savings_cents and from average_availability_pct.
    input_set: "SETTLEMENT_REVERSED lines are excluded from both year and prior-year sums.
      SETTLEMENT_DRAFT lines are included in the current-year sum only when their
      period_start.clock_year equals the logical clock's year."
    constants:
      AVAILABILITY_HEADROOM_CEILING_PCT: 0.2
      AVAILABILITY_FALLBACK_PCT: 1.0
      PR_YEAR_LOAD_FALLBACK_PCT: 1.0
      SPECIAL_AGE_FALLBACK_PCT: 0.35
    precision: "availability fraction to 6 decimal places, kWh to 2 decimal places, round_half_up"
    variants:
      - name: current_year_basis
        when: "yr_kwh > 0"
        difference: "Availability is measured from the current contract year's metered output."
      - name: prior_year_basis
        when: "yr_kwh == 0"
        difference: "Availability falls back to the prior year's output, so the identical contract yields a different measure."

  - name: availability_savings_two_offtakers
    trigger: "On POST /power/ppas/{id}/allocate-output and on POST /power/sites/_ops/rollover-period"
    algorithm: waterfall_allocation
    formula: |
      # MODE (c): circular-looking dependency; evaluation order pinned.
      # Step 1: split the site's billed energy among the offtakers.
      # Step 2: the base savings is keyed on the split total and its tier.
      # Step 3: a rate-cap adjustment is applied keyed on the base.
      # Step 4: the hard cap clamps the final figure. Each step reads only the
      #         previous step's value; nothing is fed back.
      split_a_kwh, split_b_kwh = split(site_billed_kwh, offtaker_commitments)
      base_savings_cents = (split_a_kwh + split_b_kwh) * rate_difference_cents_per_kwh
      if base_savings_cents >= RATE_CAP_REFERENCE_CENTS:
          rate_cap_adjustment_cents = BASE_SAVINGS_REFERENCE_CENTS
      else:
          rate_cap_adjustment_cents = base_savings_cents / RATE_CAP_REFERENCE_CENTS * BASE_SAVINGS_REFERENCE_CENTS
      customer_savings_cents = base_savings_cents + rate_cap_adjustment_cents
      if customer_savings_cents > MAX_SAVINGS_CAP_CENTS:
          customer_savings_cents = MAX_SAVINGS_CAP_CENTS
      # Ties in offtaker ordering break on created_at ASC, never on per-offtaker id.
    input_set: "site_billed_kwh is the sum of metered_kwh over the site's lines in
      SETTLEMENT_APPLIED on the period being rolled; SETTLEMENT_REVERSED lines are excluded."
    constants:
      RATE_CAP_REFERENCE_CENTS: 300000
      BASE_SAVINGS_REFERENCE_CENTS: 2
      DEFAULT_RATE_DIFFERENCE_CENTS_PER_KWH: 2.2
      MAX_SAVINGS_CAP_CENTS: 1500000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: period_savings_basis
        when: "the offtakers' commitments are read at period_end"
        difference: "The split uses the commitments current at the period boundary."
      - name: as_of_execution_basis
        when: "the offtakers' commitments are read at the rollover execution instant"
        difference: "The split uses commitments current at execution, so a commitment change between period_end and execution shifts savings between offtakers."

  - name: transfer_contract_value
    trigger: "On POST /power/sites/{id}/transfer-ppa and on Ppa renew"
    algorithm: aggregation
    formula: |
      down_payment_1_cents = round_half_up(
          DOWN_PAYMENT_1_PCT * effective_tariff_cents_per_kwh * site.expected_annual_site_load_kwh, 2)
      down_payment_2_cents = round_half_up(
          DOWN_PAYMENT_2_PCT * fee_cents_per_therm * site.expected_annual_site_load_kwh
          / contracted_efficiency_kwh_per_therm, 2)
      down_payment_3_cents = round_half_up(
          DOWN_PAYMENT_3_PCT * site.grid_tariff_rate_cents_per_kwh * site.expected_annual_site_load_kwh, 2)
      down_payment_cents = down_payment_1_cents + down_payment_2_cents + down_payment_3_cents
      term_discount_cents = round_half_up(term_years * TERM_DISCOUNT_CENTS_PER_YEAR, 2)
      summer_pct  = 1 + SUMMER_HEAT_DELTA + SUMMER_HEAT_MAX * (site.grid_outage_events_per_year * SUMMER_HEAT_MULTIPLIER)
      winter_pct  = 1 + WINTER_HEAT_DELTA + WINTER_HEAT_MAX / max(1, site.grid_outage_events_per_year * WINTER_HEAT_DIVISOR)
      if period_start's month ∈ {6, 7, 8, 9}:
          heating_pct = summer_pct
          grid_fee_cents = round_half_up(SUMMER_GRID_FEE_CENTS, 2)
      else:
          heating_pct = winter_pct
          grid_fee_cents = 0
      heating_cents = round_half_up(heating_pct * has_heating * HEATING_BASE_CENTS, 2)
      baseline_pct = max(0, 1 - max(0, site.grid_annual_outage_hours / 8760 * BASELINE_DEGRADE_PCT))
      tax_cents = round_half_up(site.tax_rate_pct * (baseline_pct * annual_customer_cost_cents), 2)
      excise_cents = round_half_up((DEFAULT_EXCISE_RATE + site.tax_rate_pct) * annual_customer_cost_cents, 2)
      asset_owner_cost_cents = round_half_up(
          down_payment_cents - term_discount_cents + site.grid_outage_events_per_year * FIXED_LINE_CENTS, 2)
      buyer_cost_cents = round_half_up(
          down_payment_cents + tax_cents + heating_cents + grid_fee_cents
          + site.grid_outage_events_per_year * OTHER_CENTS - rebate_cents, 2)
      if site.grid_outage_events_per_year > OUTAGE_FIXED_LINE_THRESHOLD:
          fixed_line_cents = round_half_up(FIXED_LINE_CENTS * site.grid_outage_events_per_year, 2)
          other_cents      = round_half_up(OTHER_CENTS * site.grid_outage_events_per_year, 2)
      else:
          fixed_line_cents = 0
          other_cents      = 0
      Capital contribution / governing-law / escrow flags are all read from the SITE:
          escrow_flag = site.interconnect_exit_fee_cents_per_kw > 0
          contribution_flag = term_years >= CONTRIBUTION_TERM_YEARS
          governing_law_flag = site.utility_territory ends with "_CA"
    input_set: "Annual customer cost basis uses the site's expected_annual_site_load_kwh."
    constants:
      DOWN_PAYMENT_1_PCT: 0.055
      DOWN_PAYMENT_2_PCT: 0.035
      DOWN_PAYMENT_3_PCT: 0.02
      TERM_DISCOUNT_CENTS_PER_YEAR: 100
      SUMMER_HEAT_DELTA: 0.10
      SUMMER_HEAT_MAX: 0.35
      SUMMER_HEAT_MULTIPLIER: 0.018
      WINTER_HEAT_DELTA: 0.25
      WINTER_HEAT_MAX: 0.40
      WINTER_HEAT_DIVISOR: 2.0
      SUMMER_GRID_FEE_CENTS: 1000
      HEATING_BASE_CENTS: 100
      BASELINE_DEGRADE_PCT: 0.25
      DEFAULT_EXCISE_RATE: 0.0385
      FIXED_LINE_CENTS: 1000
      OTHER_CENTS: 1000
      OUTAGE_FIXED_LINE_THRESHOLD: 3
      CONTRIBUTION_TERM_YEARS: 15
      REBATE_CENTS: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: owner_basis
        when: "Ppa.contract_basis == PPA_BASIS_AS_BUILT"
        difference: "Excludes tax and the summer grid fee, so the identical contract values differently."
      - name: buyer_basis
        when: "Ppa.contract_basis == PPA_BASIS_TRANSFERRED"
        difference: "Adds tax, the summer grid fee and the heating charge, so the identical contract values higher."

  - name: upfront_exit_capacity_value
    trigger: "On POST /power/ppas/{id}/request-exit, on POST /power/sites/{id}/evaluate, and on Ppa terminate"
    algorithm: constraint_propagation
    formula: |
      contracted_capacity_kw = sum over the site's PPAs of contracted_kw
      standby_charge_cents = round_half_up(contracted_capacity_kw
                                           * site.standby_charge_cents_per_kw_month * 12, 2)
      exit_fee_cents = round_half_up(contracted_capacity_kw
                                     * site.interconnect_exit_fee_cents_per_kw, 2)
      # Boundary precision: the fee is charged per kW contracted, not per kW generated;
      # capacity is counted once per PPA.
    input_set: "the referred-to systems and their site fields are read at the contract's
      start instant, not at request time."
    constants:
      DEFAULT_STANDBY_MONTHS: 12
    precision: "2 decimal places, round_half_up"
    variants:
      - name: incremental_basis
        when: "the referred-to systems are read at contract start"
        difference: "Start-of-contract capacity is used."
      - name: recomputed_basis
        when: "the referred-to systems are read at request time"
        difference: "Current capacity is used, so a site whose capacity changed values differently."

  - name: current_escalated_rate
    trigger: "On Ppa activate, on ServicePlan window change, and on every SettlementLine recompute"
    algorithm: decay_function
    formula: |
      years_elapsed = floor(max(0, (current_utc - Ppa.state_entered_at) / 365 days))
      effective_tariff_cents_per_kwh = round_half_up(
          tariff_base_cents_per_kwh * (1 + escalator_pct) ** years_elapsed, 2)
      # Boundary precision: exactly one year after state_entered_at is 1.0 * (1 + esc);
      # one second before is 1.0. years_elapsed is floored, the rate is rounded once.
      # The contract's start time is its own state_entered_at, not the signer's local time.
    input_set: "state_entered_at is refreshed on every state change, so a cure or a renewal
      resets the escalation ladder."
    constants:
      NONE: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: annual_escalated
        when: "years_elapsed >= 1"
        difference: "The rate carries at least one escalation step."
      - name: base_rate
        when: "years_elapsed == 0"
        difference: "The rate equals tariff_base_cents_per_kwh exactly."

  - name: fixed_consideration_line
    trigger: "On POST /power/sites/{id}/evaluate and on POST /power/ppas/{id}/request-exit"
    algorithm: aggregation
    formula: |
      fixed_consideration_cents = round_half_up(
          committed_feedstock_therms * site.gas_commodity_rate_cents_per_therm, 2)
      # Boundary precision: the line is charged when the in-service date is on or before
      # the fixed-consideration cutoff. A date exactly on the cutoff is charged.
      # A date after the cutoff leaves the line at 0.
      line_status = IN_SERVICE if service_date <= fixed_consideration_cutoff_iso8601 else NOT_IN_SERVICE
    input_set: "committed_feedstock_therms is the Site field as declared."
    constants:
      NONE: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: in_service_basis
        when: "service_date <= fixed_consideration_cutoff_iso8601"
        difference: "The line is charged for the whole site."
      - name: not_in_service_basis
        when: "service_date > fixed_consideration_cutoff_iso8601"
        difference: "The line is zero, so the identical site values lower."

  - name: customer_token_ledger
    trigger: "On Ppa settlement-line reversal and on Customer reconcile"
    algorithm: aggregation
    formula: |
      Customer.earned_customer_tokens = sum over the customer's PPAs of Ppa.customer_earned_ppa_tokens
                                        + Ppa.customer_earned_output_tokens
      Customer.spent_customer_tokens  = sum over the customer's PPAs of Ppa.customer_spent_ppa_tokens
                                        + Ppa.customer_spent_output_tokens
      Customer.net_tokens = earned - spent
      # PPA reconciliation: when a reversal is posted, the customer earns 1 token and the
      # PPA's spent counter advances by 2, so the net customer figure can move backwards.
      # Token balances are derived, never stored.
    input_set: "token counters are read from the PPA; the customer's figure is derived."
    constants:
      EARNED_TOKEN_PER_REVERSAL: 1
      SPENT_TOKEN_PER_REVERSAL: 2
      TOKEN_FLOOR: 0
    precision: "integer tokens"
    variants:
      - name: earned_basis
        when: "the last operation on the PPA was a reversal"
        difference: "The earned counter advances by one."
      - name: spent_basis
        when: "the last operation on the PPA was a reconciliation"
        difference: "The spent counter advances by two, so two MsGS are required to settle a single earned token."

  - name: contract_extension_days
    trigger: "On Ppa cure and on SettlementLine reversal"
    algorithm: projection
    formula: |
      # Extension is granted only for downtime the customer's records do not corroborate.
      days_shortfall = max(0, allowed_downtime_hours_per_year - sum of downtime_hours of the
                              PPA's SETTLEMENT_APPLIED lines in the current contract year)
      if days_shortfall > 0:
          extension_days = min(EXTENSION_DAYS_MAX, floor(days_shortfall / HOURS_PER_DAY))
      else:
          extension_days = 0
      # Boundary precision: days_shortfall exactly 0 grants 0 days; one hour grants 0 days
      # because floor(1/24) == 0.
    input_set: "downtime_hours is read from SETTLEMENT_APPLIED lines only."
    constants:
      HOURS_PER_DAY: 24
      EXTENSION_DAYS_MAX: 30
    precision: "integer days, floor"
    variants:
      - name: measured_basis
        when: "the PPA has at least one SETTLEMENT_APPLIED line in the contract year"
        difference: "Extension is derived from measured downtime."
      - name: no_meter_basis
        when: "the PPA has no SETTLEMENT_APPLIED line in the contract year"
        difference: "days_shortfall equals allowed_downtime_hours_per_year, so the full allowance is granted as extension."# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  # --- priority 1: authentication ------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role value names a declared role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "For a role whose identity is entity_backed:<EntityName>, X-User-ID equals the id of an existing instance of that entity."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # --- priority 3: authorization -------------------------------------------
  - priority: 3
    category: auth
    check: "The acting role is listed in the endpoint's roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # --- priority 4: existence (left-to-right in path) -----------------------
  - priority: 4
    category: existence
    check: "The Site addressed by the path exists."
    error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /power/sites/{id}/freeze", "POST /power/sites/{id}/unfreeze", "POST /power/sites/{id}/resource-holds", "POST /power/sites/{id}/fuel-deliveries", "POST /power/sites/{id}/evaluate", "POST /power/sites/{id}/transfer-ppa", "GET /power/sites/{id}", "GET /power/sites/{id}/ppas", "GET /power/sites/{id}/fuel-deliveries"]
  - priority: 5
    category: existence
    check: "The Ppa addressed by the path exists, and when the path also addresses a Site, Ppa.site_id equals that site's id."
    error_id: ERR_PPA_NOT_FOUND
    http_status: 404
    applies_to: ["POST /power/ppas/{id}/activate", "POST /power/ppas/{id}/request-exit", "POST /power/ppas/{id}/cure", "POST /power/ppas/{id}/terminate", "POST /power/ppas/{id}/renew", "POST /power/ppas/{id}/settlement-lines", "POST /power/ppas/{id}/allowances", "POST /power/ppas/{id}/reconcile-accruals", "POST /power/ppas/{id}/service-plans", "POST /power/ppas/{id}/adjust-contract", "GET /power/ppas/{id}"]
  - priority: 6
    category: existence
    check: "The Customer addressed by the path exists."
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: ["POST /power/customers/{id}/apply-exposure-hold", "POST /power/customers/{id}/release-exposure-hold", "POST /power/customers/{id}/offer-renewal", "POST /power/customers/{id}/accept-renewal", "POST /power/customers/{id}/decline-renewal", "GET /power/customers/{id}"]
  - priority: 7
    category: existence
    check: "Every id referenced in the body or path that names a SettlementLine, SettlementAllowance, PpaAccrual, FuelDelivery, ServicePlan or Ppa exists; and Ppa.assigned_service_plan_id, ServicePlan.ppa_id, PpaTransition.ppa_id and Ppa.originating_ppa_id each resolve to a declared row when set."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /power/ppas/{id}/activate", "POST /power/ppas/{id}/service-plans", "POST /power/ppas/{id}/adjust-contract", "POST /power/_ops/recompute-index-bases"]
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /power/sites/{id}/fuel-deliveries/{id}/dispatch", "POST /power/sites/{id}/fuel-deliveries/{id}/confirm", "POST /power/sites/{id}/fuel-deliveries/{id}/cancel", "POST /power/ppas/{id}/settlement-lines/{id}/validate", "POST /power/ppas/{id}/settlement-lines/{id}/approve", "POST /power/ppas/{id}/settlement-lines/{id}/settle", "POST /power/ppas/{id}/settlement-lines/{id}/reverse", "POST /power/ppas/{id}/allowances/{id}/apply", "POST /power/ppas/{id}/service-plans/{id}/schedule-replacement", "POST /power/ppas/{id}/service-plans/{id}/dispatch-module-replacement"]

  # --- priority 8-10: state preconditions ----------------------------------
  - priority: 8
    category: state
    check: "The target resource is in a state that admits this operation; in particular a Ppa in PPA_TERMINATED admits no transition other than PPA_RENEWED, and a FuelDelivery in DELIVERY_CANCELLED or DELIVERY_SETTLED admits none."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "The operation is not a repeat of an operation that has already reached a terminal state for that resource."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: ["POST /power/ppas/{id}/terminate", "POST /power/sites/{id}/fuel-deliveries/{id}/cancel", "POST /power/ppas/{id}/settlement-lines/{id}/reverse"]
  - priority: 10
    category: state
    check: "The Site is not in SITE_SUSPENDED where the operation requires SITE_ACTIVE."
    error_id: ERR_SITE_FROZEN
    http_status: 409
    applies_to: ["POST /power/sites/{id}/resource-holds", "POST /power/ppas/{id}/activate", "POST /power/ppas/{id}/request-exit", "POST /power/ppas/{id}/service-plans/{id}/schedule-replacement"]

  # --- priority 11+: business rules ----------------------------------------
  - priority: 11
    category: business_safety
    check: "Maintenance windows of a site's service plans must be pairwise separated by at least MAINTENANCE_GAP_DAYS; when window_start_iso8601 is supplied, the new window must respect the gap against every open window at that site."
    error_id: ERR_WINDOW_VIOLATION
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/service-plans", "POST /power/sites/{id}/resource-holds"]
  - priority: 12
    category: business_safety
    check: "Clearance footprint: the site's summed service radius_buffer_m over plans in {SERVICE_ACTIVE, SERVICE_MAINTENANCE_WINDOW_OPEN} must not exceed clearance_zone_capacity."
    error_id: ERR_FOOTPRINT_EXCEEDED
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/service-plans", "POST /power/ppas/{id}/activate"]
  - priority: 13
    category: business_safety
    check: "The site's contracted capacity in kW must not exceed available installation footprint (footprint_sqm * KW_PER_SQM)."
    error_id: ERR_FOOTPRINT_EXCEEDED
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/activate", "POST /power/sites"]
  - priority: 14
    category: business_constraint
    check: "A delivery's confirm_after_iso8601 must be strictly before the current logical clock instant."
    error_id: ERR_CONFIRM_TOO_EARLY
    http_status: 422
    applies_to: ["POST /power/sites/{id}/fuel-deliveries/{id}/confirm"]
  - priority: 15
    category: business_constraint
    check: "The site's count of FuelDeliveries in {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT} must be strictly less than MAX_ACTIVE_DEMANDS_PER_SITE."
    error_id: ERR_SITE_DEMAND_LIMIT
    http_status: 422
    applies_to: ["POST /power/sites/{id}/fuel-deliveries", "POST /power/sites/{id}/resource-holds", "POST /power/sites/{id}/fuel-deliveries/{id}/dispatch"]
  - priority: 16
    category: business_constraint
    check: "A delivery's volume_therms must not exceed the site's draw_position_therms."
    error_id: ERR_INSUFFICIENT_DRAW_POSITION
    http_status: 422
    applies_to: ["POST /power/sites/{id}/fuel-deliveries", "POST /power/sites/{id}/resource-holds", "POST /power/sites/{id}/fuel-deliveries/{id}/confirm"]
  - priority: 17
    category: business_referential
    check: "When a delivery names an attesting customer, that customer must exist, be CUSTOMER_ACTIVE, and at least one PPA of the site must carry fuel_responsibility = CUSTOMER_SOURCED_GAS."
    error_id: ERR_CUSTOMER_SOURCING_UNVERIFIED
    http_status: 422
    applies_to: ["POST /power/sites/{id}/fuel-deliveries", "POST /power/sites/{id}/fuel-deliveries/{id}/confirm"]
  - priority: 18
    category: business_constraint
    check: "A settlement line's period_end must be strictly after its period_start."
    error_id: ERR_SETTLEMENT_PERIOD_INVALID
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/settlement-lines"]
  - priority: 19
    category: business_temporal
    check: "Settlement period_start values on one PPA must not overlap: a new line's [period_start, period_end) must be disjoint from every existing line on that PPA except lines in SETTLEMENT_REVERSED."
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/settlement-lines"]
  - priority: 20
    category: business_temporal
    check: "A settlement line's period_start must not fall before the PPA's state_entered_at."
    error_id: ERR_SETTLEMENT_PERIOD_BEFORE_ACTIVATION
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/settlement-lines"]
  - priority: 21
    category: business_temporal
    check: "A service-plan maintenance window must not overlap PPA_EXIT_PENDING cure windows at the same site except when window_start_iso8601 is strictly less than window_end_iso8601 and the plan belongs to the exiting PPA."
    error_id: ERR_EXIT_WINDOW_CONFLICT
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/service-plans", "POST /power/ppas/{id}/request-exit"]
  - priority: 22
    category: business_temporal
    check: "Resource-hold windows at a site must not overlap: the interval [hold_window_start_iso8601, hold_window_end_iso8601] of a new hold must be disjoint from every other open hold window at the same site, and windows that touch (one end equal to the other's start) are treated as overlapping, not as adjacent — closed-interval semantics."
    error_id: ERR_DELIVERY_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /power/sites/{id}/fuel-deliveries", "POST /power/sites/{id}/resource-holds"]
  - priority: 23
    category: business_constraint
    check: "A settlement line may only be validated when its ordinal within the PPA's period sequence is strictly greater than the ordinal of the PPA's most recently applied line."
    error_id: ERR_OUT_OF_ORDER
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/settlement-lines/{id}/validate"]
  - priority: 24
    category: business_constraint
    check: "A settlement line's allocation index must be strictly less than the PPA's consumed allocation count."
    error_id: ERR_ALLOCATION_LIMIT
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/settlement-lines/{id}/approve"]
  - priority: 25
    category: business_constraint
    check: "An allowance may only be issued when the PPA has at least one PpaAccrual in lifecycle_state ACCRUAL_OPEN."
    error_id: ERR_NO_ELIGIBLE_ACCRUAL
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/allowances"]
  - priority: 26
    category: business_fiscal
    check: "Capacity guarantee floor: accumulated capacity-reserve credits must not exceed capacity_reserve_pre_cents - loss_floor_cents; the write that would cross the headroom is rejected."
    error_id: ERR_GUARANTEE_FLOOR_BREACH
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/allowances/{id}/apply", "POST /power/ppas/{id}/settlement-lines/{id}/settle"]
  - priority: 27
    category: business_fiscal
    check: "The settlement credit cap: net_charge_cents minus output_guarantee_credit_cents must not exceed the customer's lifetime billable base plus SETTLEMENT_CREDIT_CAP_CENTS."
    error_id: ERR_BUMPER_EXCEEDED
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/settlement-lines/{id}/settle", "POST /power/ppas/{id}/allowances/{id}/apply"]

  # --- priority 28: optimistic concurrency ---------------------------------
  - priority: 28
    category: business_constraint
    check: "The expected_<parent>_version supplied with a write must equal the parent resource's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /power/sites/{id}/fuel-deliveries", "POST /power/ppas/{id}/settlement-lines", "POST /power/ppas/{id}/allowances"]

  # --- priority 29+: field-, range- and configuration-level checks ----------
  - priority: 29
    category: business_constraint
    check: "Every required input field is present with its declared type, every enum member is one of the declared values, and paired fields are supplied together (hold_window_start_iso8601 with hold_window_end_iso8601)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 30
    category: business_constraint
    check: "A PPA's term commitment must be one of the committed terms {10, 12, 15, 20}."
    error_id: ERR_TERM_COMMITMENT_INVALID
    http_status: 422
    applies_to: ["POST /power/ppas"]
  - priority: 31
    category: business_constraint
    check: "A PPA's declared efficiency and capacity must be positive: contracted_efficiency_kwh_per_therm > 0 and contracted_kw > 0."
    error_id: ERR_EFFICIENCY_INVALID
    http_status: 422
    applies_to: ["POST /power/ppas", "POST /power/ppas/{id}/adjust-contract"]
  - priority: 32
    category: business_constraint
    check: "A PPA's escalator must lie in [0, ESCALATOR_MAX_PCT] with ESCALATOR_MAX_PCT = 0.06."
    error_id: ERR_ESCALATOR_OUT_OF_RANGE
    http_status: 422
    applies_to: ["POST /power/ppas"]
  - priority: 33
    category: business_constraint
    check: "A delivery's fuel-sourcing configuration must be internally consistent: sourcing_mode = INDEXED_BLEND requires a non-null index leg, and sourcing_mode = FIXED_PRICE_BLEND requires hedged_fraction = 1."
    error_id: ERR_FUEL_SOURCING_MODE_INVALID
    http_status: 422
    applies_to: ["POST /power/sites/{id}/fuel-deliveries", "POST /power/sites/{id}/resource-holds"]
  - priority: 34
    category: business_constraint
    check: "An exposure hold may only be applied to a customer whose credit_tier is not CREDIT_PRIME, and a transfer may only be requested for a CREDIT_SUBSTANDARD customer whose hold is armed."
    error_id: ERR_CREDIT_TIER_INELIGIBLE
    http_status: 422
    applies_to: ["POST /power/customers/{id}/apply-exposure-hold", "POST /power/sites/{id}/transfer-ppa"]
  - priority: 35
    category: business_fiscal
    check: "The PPA's signed accrual sum for the period must be balanced after any true-up or allowancing write."
    error_id: ERR_ACCRUAL_UNBALANCED
    http_status: 422
    applies_to: ["POST /power/ppas/{id}/reconcile-accruals", "POST /power/ppas/{id}/allowances/{id}/apply"]
  - priority: 36
    category: business_constraint
    check: "A site unfreeze requires draw_position_therms to be at least MIN_RESUME_DRAW_THERMS."
    error_id: ERR_DRAW_POSITION_BELOW_RESUME
    http_status: 422
    applies_to: ["POST /power/sites/{id}/unfreeze"]
  - priority: 37
    category: state
    check: "A renewal accept or decline requires Customer.renewal_stage = RENEWAL_OFFERED."
    error_id: ERR_RENEWAL_STAGE_INVALID
    http_status: 409
    applies_to: ["POST /power/customers/{id}/accept-renewal", "POST /power/customers/{id}/decline-renewal"]
  - priority: 38
    category: state
    check: "A settlement-line reversal must be requested within SETTLEMENT_REVERSAL_WINDOW_DAYS of the line's applied instant."
    error_id: ERR_REVERSAL_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /power/ppas/{id}/settlement-lines/{id}/reverse"]
  - priority: 39
    category: state
    check: "A contract transfer, renewal or exit is refused while Ppa.transfer_stage is TRANSFER_BLOCKED."
    error_id: ERR_TRANSFER_BLOCKED
    http_status: 409
    applies_to: ["POST /power/sites/{id}/transfer-ppa", "POST /power/ppas/{id}/renew", "POST /power/ppas/{id}/request-exit"]

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:

  # --- Site -----------------------------------------------------------------
  - method: POST
    path: "/power/sites"
    description: "Register a customer facility for on-site fuel cell evaluation."
    roles: [SiteOperator]
    code: 201
    input: [name, utility_territory, grid_tariff_rate_cents_per_kwh, grid_outage_events_per_year, grid_annual_outage_hours, gas_commodity_rate_cents_per_therm, expected_annual_site_load_kwh, tax_rate_pct, allowed_downtime_hours_per_year, clearance_zone_capacity, footprint_sqm, standby_charge_cents_per_kw_month, interconnect_exit_fee_cents_per_kw]
    output: Site
    side_effects:
      - "status = SITE_ACTIVE; lifecycle_state = RESOURCE_AVAILABLE"
      - "initial_fuel_inventory_therms = INITIAL_FUEL_INVENTORY_THERMS"
      - "draw_position_therms = initial_fuel_inventory_therms"
      - "clearance_zone_used = 0; committed_feedstock_therms = 0; current_avoided_fuel_cost_cents_per_therm = 0"
      - "increments Site.version by 1"

  - method: GET
    path: "/power/sites"
    description: "List sites."
    roles: [SiteOperator, CustomerService, SettlementAnalyst, SettlementApprover, FuelCoordinator]
    code: 200
    input: ["status?", "lifecycle_state?", "limit?", "offset?"]
    output: "Site[]"
    side_effects: []

  - method: GET
    path: "/power/sites/{id}"
    description: "Get a site."
    roles: [SiteOperator, CustomerService, SettlementAnalyst, SettlementApprover, FuelCoordinator]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/power/sites/{id}/ppas"
    description: "List the PPAs hosted at a site (FK reverse-reachability for Ppa.site_id)."
    roles: [SiteOperator, CustomerService, SettlementAnalyst, SettlementApprover]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: "Ppa[]"
    side_effects: []

  - method: POST
    path: "/power/sites/{id}/evaluate"
    description: "Evaluate electrical load, gas supply availability, installation footprint, interconnection review and avoided feed-in tariff."
    roles: [SiteOperator]
    code: 200
    input: []
    output: { standby_charge_cents: integer, exit_fee_cents: integer, fixed_consideration_cents: integer, escalated_rate_cents_per_kwh: number }
    side_effects:
      - "computes current_escalated_rate, fixed_consideration_line, upfront_exit_capacity_value"
      - "increments Site.version by 1"

  - method: POST
    path: "/power/sites/{id}/freeze"
    description: "Suspend site operations; cascades to PPAs, service plans and customers."
    roles: [SiteOperator]
    code: 200
    input: [reason]
    output: Site
    side_effects:
      - "status → SITE_SUSPENDED"
      - "every PPA of this site in PPA_ACTIVE → PPA_SUSPENDED"
      - "every such PPA's ServicePlan in SERVICE_ACTIVE → SERVICE_MAINTENANCE_WINDOW_OPEN"
      - "every such ServicePlan in REPLACEMENT_SCHEDULED → REPLACEMENT_BLOCKED"
      - "Customer.hold_armed = true for affected CREDIT_SUBSTANDARD customers"
      - "increments Site.version by 1; increments each affected Ppa.version by 1"

  - method: POST
    path: "/power/sites/{id}/unfreeze"
    description: "Resume site operations; restores PPAs and service plans."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Site
    side_effects:
      - "status → SITE_ACTIVE"
      - "every PPA of this site in PPA_SUSPENDED → PPA_ACTIVE"
      - "every such PPA's ServicePlan in SERVICE_MAINTENANCE_WINDOW_OPEN → SERVICE_ACTIVE"
      - "increments Site.version by 1; increments each affected Ppa.version by 1"

  - method: POST
    path: "/power/sites/{id}/transfer-ppa"
    description: "Transfer a set of service contracts to a new owner; returns the transfer valuation."
    roles: [SiteOperator]
    code: 200
    input: [ppa_id, accepting_customer_id, transfer_basis]
    output: Ppa
    side_effects:
      - "computes transfer_contract_value"
      - "Ppa.customer_id → accepting_customer_id; Ppa.contract_basis → PPA_BASIS_TRANSFERRED"
      - "Ppa.customer_earned_output_tokens += TRANSFER_TOKEN_GRANT"
      - "increments Site.version by 1; increments Ppa.version by 1"

  # --- Customer ---------------------------------------------------------------
  - method: POST
    path: "/power/customers"
    description: "Create a customer offtaker."
    roles: [CustomerService]
    code: 201
    input: [name, industry_code, credit_tier]
    output: Customer
    side_effects:
      - "status = CUSTOMER_ACTIVE; renewal_stage = RENEWAL_NONE"
      - "exposure_hold_pct computed from credit_tier"
      - "increments Customer.version by 1"

  - method: GET
    path: "/power/customers"
    description: "List customers."
    roles: [CustomerService, SiteOperator, SettlementAnalyst]
    code: 200
    input: ["credit_tier?", "status?", "renewal_stage?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/power/customers/{id}"
    description: "Get a customer."
    roles: [CustomerService, SiteOperator, SettlementAnalyst]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/power/customers/{id}/ppas"
    description: "List the PPAs held by a customer (FK reverse-reachability for Ppa.customer_id)."
    roles: [CustomerService, SettlementAnalyst, SettlementApprover, Customer]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: "Ppa[]"
    side_effects: []

  - method: GET
    path: "/power/customers/{id}/fuel-deliveries"
    description: "List the deliveries a customer attested under its own-procurement option (reverse-reachability for FuelDelivery.attesting_customer_id)."
    roles: [CustomerService, FuelCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "FuelDelivery[]"
    side_effects: []

  - method: POST
    path: "/power/customers/{id}/apply-exposure-hold"
    description: "Arm the credit exposure hold; cascades to the customer's active PPAs and their service plans."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "status → CUSTOMER_CREDIT_HOLD; hold_armed = true"
      - "every PPA of this customer in PPA_ACTIVE → PPA_SUSPENDED"
      - "every such PPA's ServicePlan in SERVICE_ACTIVE → SERVICE_MAINTENANCE_WINDOW_OPEN"
      - "increments Customer.version by 1"

  - method: POST
    path: "/power/customers/{id}/release-exposure-hold"
    description: "Release the credit exposure hold."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "status → CUSTOMER_ACTIVE; hold_armed = false"
      - "every PPA of this customer in PPA_SUSPENDED → PPA_ACTIVE"
      - "increments Customer.version by 1"

  - method: POST
    path: "/power/customers/{id}/offer-renewal"
    description: "Offer a renewal to the customer."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects: ["renewal_stage → RENEWAL_OFFERED", "increments Customer.version by 1"]

  - method: POST
    path: "/power/customers/{id}/accept-renewal"
    description: "Customer accepts the renewal offer."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects: ["renewal_stage → RENEWAL_ACCEPTED", "increments Customer.version by 1"]

  - method: POST
    path: "/power/customers/{id}/decline-renewal"
    description: "Customer declines the renewal offer."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects: ["renewal_stage → RENEWAL_DECLINED", "increments Customer.version by 1"]

  # --- Ppa --------------------------------------------------------------------
  - method: POST
    path: "/power/ppas"
    description: "Draft a power purchase agreement."
    roles: [SiteOperator]
    code: 201
    input: [site_id, customer_id, term_years, contracted_kw, contracted_efficiency_kwh_per_therm, contracted_annual_kwh, tariff_base_cents_per_kwh, escalator_pct, fuel_adder_cents_per_therm, guaranteed_availability_pct, guaranteed_delivery_kwh, customer_cure_deadline_days, fuel_responsibility, loss_floor_cents, "capacity_reserve_pre_cents?"]
    output: Ppa
    side_effects:
      - "state = PPA_DRAFT; state_entered_at = current_utc"
      - "effective_tariff_cents_per_kwh = tariff_base_cents_per_kwh; purchase_price_cents_per_kwh = purchase_price basis"
      - "computes forward_looking_net_charge_basis, recurring_base_charge_pools, guaranteed_remedy_credit, availability_guarantee_escrow_draw"
      - "recompute Site.contracted_purchase_cents, Site.committed_feedstock_therms, Site.draw_position_therms"
      - "increments Ppa.version by 1; increments Site.version by 1"

  - method: GET
    path: "/power/ppas"
    description: "List PPAs."
    roles: [SiteOperator, CustomerService, SettlementAnalyst, SettlementApprover]
    code: 200
    input: ["site_id?", "customer_id?", "state?", "assigned_service_plan_id?", "originating_ppa_id?", "limit?", "offset?"]
    output: "Ppa[]"
    side_effects: []

  - method: GET
    path: "/power/ppas/{id}"
    description: "Get a PPA."
    roles: [SiteOperator, CustomerService, SettlementAnalyst, SettlementApprover, Customer]
    code: 200
    input: []
    output: Ppa
    side_effects: []

  - method: GET
    path: "/power/ppas/{id}/transfers"
    description: "List the PPAs transferred from this PPA (self-referential reverse-reachability)."
    roles: [SiteOperator, CustomerService]
    code: 200
    input: ["limit?", "offset?"]
    output: "Ppa[]"
    side_effects: []

  - method: POST
    path: "/power/ppas/{id}/activate"
    description: "Activate the contract; cascades into service plan creation and maintenance windows."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Ppa
    side_effects:
      - "state → PPA_ACTIVE"
      - "Site.lifecycle_state → RESOURCE_DRAWING"
      - "creates a ServicePlan in SERVICE_PLAN_DRAFT → SERVICE_ACTIVE → SERVICE_MAINTENANCE_WINDOW_OPEN when the window is open"
      - "recompute Site.clearance_zone_used, Customer.active_ppa_count"
      - "increments Ppa.version by 1; increments Site.version by 1"

  - method: POST
    path: "/power/ppas/{id}/request-exit"
    description: "Customer requests exit; opens the cure window."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Ppa
    side_effects:
      - "state → PPA_EXIT_PENDING"
      - "exit_fee_cents recomputed"
      - "increments Ppa.version by 1"

  - method: POST
    path: "/power/ppas/{id}/cure"
    description: "Customer cures the exit request inside the cure window; reverts to PPA_ACTIVE."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Ppa
    side_effects:
      - "state → PPA_ACTIVE (revert); exit_fee_cents = 0"
      - "recompute contract_extension_days, current_escalated_rate"
      - "increments Ppa.version by 1"

  - method: POST
    path: "/power/ppas/{id}/terminate"
    description: "Terminate the contract after the cure window lapses."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Ppa
    side_effects:
      - "state → PPA_TERMINATED"
      - "Site.active_ppa_count decremented; Site.lifecycle_state → RESOURCE_AVAILABLE when no active PPAs remain"
      - "the assigned ServicePlan → SERVICE_ARCHIVED"
      - "increments Ppa.version by 1; increments Site.version by 1"

  - method: POST
    path: "/power/ppas/{id}/renew"
    description: "Renew a terminated contract back into PPA_ACTIVE."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Ppa
    side_effects:
      - "state → PPA_ACTIVE; Site.lifecycle_state → RESOURCE_DRAWING"
      - "Customer.renewal_stage → RENEWAL_NONE"
      - "increments Ppa.version by 1"

  - method: POST
    path: "/power/ppas/{id}/adjust-contract"
    description: "Adjust contract terms after activation; the revised settlement arises from the change order."
    roles: [SiteOperator]
    code: 200
    input: [contracted_kw, contracted_annual_kwh, guaranteed_availability_pct, "target_ppa_id?"]
    output: Ppa
    side_effects:
      - "revises contracted_kw and contracted_annual_kwh"
      - "computes commitment_swap_netting against the target_ppa_id when supplied"
      - "increments Ppa.version by 1"

  # --- ServicePlan ------------------------------------------------------------
  - method: POST
    path: "/power/ppas/{id}/service-plans"
    description: "Create a service plan with remote monitoring, replacement scope and a maintenance window."
    roles: [ServiceEngineer]
    code: 201
    input: [remote_monitoring_status, radius_buffer_m, window_start_iso8601, window_end_iso8601]
    output: ServicePlan
    side_effects:
      - "lifecycle_state = SERVICE_PLAN_DRAFT"
      - "recompute Site.clearance_zone_used"
      - "increments Ppa.version by 1; increments Site.version by 1"

  - method: GET
    path: "/power/ppas/{id}/service-plans"
    description: "List service plans for a PPA (FK reverse-reachability for ServicePlan.ppa_id)."
    roles: [ServiceEngineer, SiteOperator, SettlementAnalyst]
    code: 200
    input: ["lifecycle_state?", "limit?", "offset?"]
    output: "ServicePlan[]"
    side_effects: []

  - method: GET
    path: "/power/ppas/{id}/service-plans/{id}"
    description: "Get a service plan."
    roles: [ServiceEngineer, SiteOperator]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []

  - method: POST
    path: "/power/ppas/{id}/service-plans/{id}/schedule-replacement"
    description: "Schedule a module replacement."
    roles: [ServiceEngineer]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["module_replacement_stage → REPLACEMENT_SCHEDULED", "increments Ppa.version by 1"]

  - method: POST
    path: "/power/ppas/{id}/service-plans/{id}/dispatch-module-replacement"
    description: "Dispatch the scheduled module replacement."
    roles: [ServiceEngineer]
    code: 200
    input: []
    output: ServicePlan
    side_effects:
      - "module_replacement_stage → REPLACEMENT_DISPATCHED"
      - "arms deferred revert to REPLACEMENT_NONE at dispatch + MODULE_REPLACEMENT_REVERT_HOURS"
      - "increments Ppa.version by 1"

  # --- FuelDelivery -----------------------------------------------------------
  - method: POST
    path: "/power/sites/{id}/fuel-deliveries"
    description: "Schedule a fuel delivery or the operator's initial fuel inventory."
    roles: [FuelCoordinator]
    code: 201
    input: [sourcing_mode, volume_therms, "index_rate_cents_per_therm?", "fixed_price_cents_per_therm?", "hedged_fraction?", "attesting_customer_id?", delivered_at, confirm_after_iso8601, "hold_window_start_iso8601?", "hold_window_end_iso8601?", expected_site_version]
    output: { id: string, version: integer, lifecycle_state: string, volume_therms: number, effective_commodity_rate_cents_per_therm: number, created_at: string, updated_at: string }
    side_effects:
      - "lifecycle_state = DELIVERY_SCHEDULED"
      - "computes composite_hedged_index_price"
      - "Site.draw_position_therms decremented by volume_therms"
      - "increments Site.version by 1"

  - method: GET
    path: "/power/sites/{id}/fuel-deliveries"
    description: "List fuel deliveries for a site (FK reverse-reachability for FuelDelivery.site_id)."
    roles: [FuelCoordinator, SiteOperator, SettlementAnalyst]
    code: 200
    input: ["lifecycle_state?", "attesting_customer_id?", "selected_ppa_id?", "limit?", "offset?"]
    output: "FuelDelivery[]"
    side_effects: []

  - method: GET
    path: "/power/sites/{id}/fuel-deliveries/{id}"
    description: "Get a fuel delivery."
    roles: [FuelCoordinator, SiteOperator]
    code: 200
    input: []
    output: FuelDelivery
    side_effects: []

  - method: POST
    path: "/power/sites/{id}/fuel-deliveries/{id}/dispatch"
    description: "Dispatch a scheduled delivery into custody."
    roles: [FuelCoordinator]
    code: 200
    input: []
    output: FuelDelivery
    side_effects: ["lifecycle_state → DELIVERY_IN_TRANSIT", "increments Site.version by 1"]

  - method: POST
    path: "/power/sites/{id}/fuel-deliveries/{id}/confirm"
    description: "Confirm custody; cascades into accruals and reserves."
    roles: [FuelCoordinator]
    code: 200
    input: []
    output: FuelDelivery
    side_effects:
      - "lifecycle_state → DELIVERY_CONFIRMED"
      - "Site.current_avoided_fuel_cost_cents_per_therm = effective_commodity_rate_cents_per_therm"
      - "creates a CHARGE_ACCRUAL and a CAPACITY_ACCRUAL"
      - "recompute Ppa.capacity_guarantee_reserve_cents, Ppa.output_guarantee_reserve_cents"
      - "increments Site.version by 1"

  - method: POST
    path: "/power/sites/{id}/fuel-deliveries/{id}/cancel"
    description: "Cancel a delivery before confirmation."
    roles: [FuelCoordinator]
    code: 200
    input: []
    output: FuelDelivery
    side_effects: ["lifecycle_state → DELIVERY_CANCELLED", "Site.draw_position_therms restored", "increments Site.version by 1"]

  - method: POST
    path: "/power/sites/{id}/resource-holds"
    description: "Consume the site's allocatable fuel pool into an in-service resource hold."
    roles: [SiteOperator]
    code: 201
    input: [requested_therms, window_start_iso8601, window_end_iso8601]
    output: FuelDelivery
    side_effects:
      - "creates a FuelDelivery in DELIVERY_SCHEDULED"
      - "Site.draw_position_therms decremented; Site.lifecycle_state → RESOURCE_DRAWING"
      - "increments Site.version by 1"

  - method: POST
    path: "/power/sites/{id}/release-resource-hold"
    description: "Release an in-service resource hold back to the allocatable pool."
    roles: [SiteOperator]
    code: 200
    input: [delivery_id]
    output: Site
    side_effects:
      - "the named FuelDelivery.lifecycle_state → DELIVERY_CANCELLED"
      - "Site.draw_position_therms incremented by the released volume_therms (no drift)"
      - "Site.lifecycle_state → RESOURCE_AVAILABLE"
      - "increments Site.version by 1"

  # --- SettlementLine ---------------------------------------------------------
  - method: POST
    path: "/power/ppas/{id}/settlement-lines"
    description: "Create a settlement period line."
    roles: [SettlementAnalyst]
    code: 201
    input: [period_start, period_end, metered_kwh, downtime_hours, "customer_index_cents_per_therm?", customer_source_deadline_iso8601, "hourly_settlement?", expected_ppa_version]
    output: SettlementLine
    side_effects:
      - "status = SETTLEMENT_DRAFT"
      - "computes forward_looking_net_charge_basis, recurring_base_charge_pools, escalator_basis_proration"
      - "increments Ppa.version by 1"

  - method: GET
    path: "/power/ppas/{id}/settlement-lines"
    description: "List settlement lines for a PPA (FK reverse-reachability for SettlementLine.ppa_id)."
    roles: [SettlementAnalyst, SettlementApprover, SiteOperator]
    code: 200
    input: ["status?", "allocation_basis?", "limit?", "offset?"]
    output: "SettlementLine[]"
    side_effects: []

  - method: GET
    path: "/power/ppas/{id}/settlement-lines/{id}"
    description: "Get a settlement line."
    roles: [SettlementAnalyst, SettlementApprover]
    code: 200
    input: []
    output: SettlementLine
    side_effects: []

  - method: POST
    path: "/power/ppas/{id}/settlement-lines/{id}/validate"
    description: "Validate a draft settlement line."
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: SettlementLine
    side_effects:
      - "status → SETTLEMENT_VALIDATED"
      - "computes expected_net_charge_cents"
      - "increments Ppa.version by 1"

  - method: POST
    path: "/power/ppas/{id}/settlement-lines/{id}/approve"
    description: "Approve a validated line and compute guarantee remedies."
    roles: [SettlementApprover]
    code: 200
    input: []
    output: SettlementLine
    side_effects:
      - "status → SETTLEMENT_APPROVED"
      - "computes guaranteed_remedy_credit, availability_guarantee_escrow_draw"
      - "increments Ppa.version by 1"

  - method: POST
    path: "/power/ppas/{id}/settlement-lines/{id}/settle"
    description: "Apply a line and reconcile the accrual ledger."
    roles: [SettlementApprover]
    code: 200
    input: []
    output: SettlementLine
    side_effects:
      - "status → SETTLEMENT_APPLIED"
      - "consumes one SettlementAllowance"
      - "every open PpaAccrual of this PPA → ACCRUAL_RECONCILED"
      - "recompute Site and Customer billable aggregates"
      - "increments Ppa.version by 1"

  - method: POST
    path: "/power/ppas/{id}/settlement-lines/{id}/reverse"
    description: "Reverse an applied line within the reversal window."
    roles: [SettlementApprover]
    code: 200
    input: []
    output: SettlementLine
    side_effects:
      - "status → SETTLEMENT_REVERSED; allocation_basis → UNIT_INDEX"
      - "consumed SettlementAllowance returned to ALLOWANCE_ISSUED"
      - "computes settlement_reversal_trueup, charge_allocation_on_reversal"
      - "increments Ppa.version by 1"

  # --- PpaAccrual -------------------------------------------------------------
  - method: POST
    path: "/power/ppa-accruals"
    description: "Post an accrual to a contract's ledger."
    roles: [SettlementAnalyst]
    code: 201
    input: [ppa_id, site_id, "source_settlement_line_id?", accrual_type, amount_cents, period_anchor_iso8601]
    output: PpaAccrual
    side_effects:
      - "lifecycle_state = ACCRUAL_OPEN"
      - "signed_amount_cents derived from accrual_type"
      - "increments Ppa.version by 1"

  - method: GET
    path: "/power/ppa-accruals"
    description: "List accruals, optionally filtered by contract."
    roles: [SettlementAnalyst, SettlementApprover, SiteOperator]
    code: 200
    input: ["ppa_id?", "site_id?", "accrual_type?", "lifecycle_state?", "source_settlement_line_id?", "applied_allowance_id?", "limit?", "offset?"]
    output: "PpaAccrual[]"
    side_effects: []

  - method: GET
    path: "/power/ppa-accruals/{id}"
    description: "Get an accrual."
    roles: [SettlementAnalyst, SettlementApprover]
    code: 200
    input: []
    output: PpaAccrual
    side_effects: []

  - method: GET
    path: "/power/ppa-accruals/{id}/applied-allowances"
    description: "List the allowances applied to an accrual (reverse-reachability for SettlementAllowance.applied_to_accrual_id)."
    roles: [SettlementAnalyst, SettlementApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "SettlementAllowance[]"
    side_effects: []

  - method: POST
    path: "/power/ppas/{id}/reconcile-accruals"
    description: "Reconcile the earliest stale accrual of a contract."
    roles: [SettlementAnalyst]
    code: 200
    input: ["accrual_id?"]
    output: PpaAccrual
    side_effects:
      - "the earliest OPEN accrual → ACCRUAL_RECONCILED"
      - "computes settlement_reversal_trueup"
      - "Site.lifetime_settle_reconcile_count incremented"
      - "increments Ppa.version by 1"

  # --- SettlementAllowance ----------------------------------------------------
  - method: GET
    path: "/power/ppas/{id}/fuel-deliveries"
    description: "List the fuel deliveries allocated to a contract (reverse-reachability for FuelDelivery.selected_ppa_id)."
    roles: [FuelCoordinator, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "FuelDelivery[]"
    side_effects: []

  - method: POST
    path: "/power/ppas/{id}/allowances"
    description: "Issue a settlement allowance against a contract."
    roles: [SettlementAnalyst]
    code: 201
    input: [allowance_kind, amount_cents, expected_ppa_version]
    output: SettlementAllowance
    side_effects:
      - "lifecycle_state = ALLOWANCE_ISSUED"
      - "increments Ppa.version by 1"

  - method: GET
    path: "/power/ppas/{id}/allowances"
    description: "List allowances for a PPA (FK reverse-reachability for SettlementAllowance.ppa_id)."
    roles: [SettlementAnalyst, SettlementApprover]
    code: 200
    input: ["allowance_kind?", "lifecycle_state?", "applied_to_accrual_id?", "applied_to_ppa_id?", "limit?", "offset?"]
    output: "SettlementAllowance[]"
    side_effects: []

  - method: GET
    path: "/power/ppas/{id}/allowances/{id}"
    description: "Get a settlement allowance."
    roles: [SettlementAnalyst, SettlementApprover]
    code: 200
    input: []
    output: SettlementAllowance
    side_effects: []

  - method: POST
    path: "/power/ppas/{id}/allowances/{id}/apply"
    description: "Apply an issued allowance to the contract ledger."
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: SettlementAllowance
    side_effects:
      - "lifecycle_state → ALLOWANCE_APPLIED"
      - "computes availability_cap_apportionment, avoided_cost_credit_foldin, capacity_guarantee_reserve_floor"
      - "increments Ppa.version by 1"

  # --- PpaTransition ----------------------------------------------------------
  - method: GET
    path: "/power/ppa-transitions"
    description: "List contract transition records."
    roles: [SiteOperator, CustomerService, SettlementAnalyst]
    code: 200
    input: ["to_state?", "limit?", "offset?"]
    output: "PpaTransition[]"
    side_effects: []

  - method: GET
    path: "/power/ppa-transitions/{id}"
    description: "Get a contract transition record."
    roles: [SiteOperator, SettlementAnalyst]
    code: 200
    input: []
    output: PpaTransition
    side_effects: []

  - method: GET
    path: "/power/ppas/{id}/transitions"
    description: "List transition records for a PPA (FK reverse-reachability for PpaTransition.ppa_id)."
    roles: [SiteOperator, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "PpaTransition[]"
    side_effects: []

  # --- Batch operations -------------------------------------------------------
  - method: POST
    path: "/power/_ops/recompute-index-bases"
    description: "Batch recompute of escalated rates, index bases and guarantee reserves across the portfolio."
    roles: [SiteOperator]
    code: 200
    input: ["site_id?"]
    output: "OpsRunResult"
    side_effects:
      - "computes fuel_adder_index_ceiling_rate, availability_guarantee_escrow_draw, guaranteed_remedy_credit"
      - "increments Site.version by 1"

  - method: POST
    path: "/power/_ops/rollover-period"
    description: "Batch settle eligible lines in the rollover period."
    roles: [SiteOperator]
    code: 200
    input: ["site_id?"]
    output: "OpsRunResult"
    side_effects:
      - "computes rollover_carry_pool, availability_savings_two_offtakers"
      - "rows in SETTLEMENT_APPROVED → SETTLEMENT_APPLIED in the pinned order"
      - "increments Site.version by 1"

  # --- Logical clock ----------------------------------------------------------
  - method: POST
    path: "/power/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any call the logical clock reads exactly that instant and never falls back to wall-clock time."
    roles: [SiteOperator]
    code: 200
    input: [current_utc]
    output: "ClockState"
    side_effects: ["logical clock set to current_utc"]# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or the role value is not a declared role, or an entity_backed role's X-User-ID does not match an existing instance of that entity."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."

  # --- not found -------------------------------------------------------------
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "No Site exists with the id addressed by the path."
  - id: ERR_PPA_NOT_FOUND
    http: 404
    condition: "No Ppa exists with the id addressed by the path, or the Ppa's site_id does not equal the site id in the path."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "No Customer exists with the id addressed by the path."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "An id in the body or path names a ServicePlan, FuelDelivery, SettlementLine, SettlementAllowance or PpaAccrual that does not exist or does not belong to the addressed parent."

  # --- invalid request -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, a field has the wrong type, or an enum member is not one of the declared values."
  - id: ERR_TERM_COMMITMENT_INVALID
    http: 422
    condition: "Ppa.term_years is not one of the committed terms {10, 12, 15, 20}."
  - id: ERR_EFFICIENCY_INVALID
    http: 422
    condition: "Ppa.contracted_efficiency_kwh_per_therm is <= 0, or Ppa.contracted_kw is <= 0."
  - id: ERR_ESCALATOR_OUT_OF_RANGE
    http: 422
    condition: "Ppa.escalator_pct is negative or exceeds ESCALATOR_MAX_PCT (0.06)."
  - id: ERR_FUEL_SOURCING_MODE_INVALID
    http: 422
    condition: "FuelDelivery.sourcing_mode = INDEXED_BLEND but index_rate_cents_per_therm is null, or sourcing_mode = FIXED_PRICE_BLEND but hedged_fraction is not 1."

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is in a state that does not admit this operation per §1.2."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The operation targets a resource already in a terminal state (PPA_TERMINATED, DELIVERY_CANCELLED, DELIVERY_SETTLED, SETTLEMENT_REVERSED, ALLOWANCE_APPLIED, ACCRUAL_RECONCILED)."
  - id: ERR_SITE_FROZEN
    http: 409
    condition: "The operation requires Site.status = SITE_ACTIVE but the site is SITE_SUSPENDED."
  - id: ERR_RENEWAL_STAGE_INVALID
    http: 409
    condition: "A renewal accept or decline is requested while Customer.renewal_stage is not RENEWAL_OFFERED."
  - id: ERR_REVERSAL_WINDOW_CLOSED
    http: 409
    condition: "A settlement line reversal is requested after applied_at + SETTLEMENT_REVERSAL_WINDOW_DAYS."
  - id: ERR_TRANSFER_BLOCKED
    http: 409
    condition: "A contract transfer, renewal or exit is requested while Ppa.transfer_stage = TRANSFER_BLOCKED."

  # --- business safety -------------------------------------------------------
  - id: ERR_WINDOW_VIOLATION
    http: 422
    condition: "The requested maintenance window is closer than MAINTENANCE_GAP_DAYS to an already open window at the same site."
  - id: ERR_FOOTPRINT_EXCEEDED
    http: 422
    condition: "Summed service radius or contracted capacity exceeds the site's clearance_zone_capacity or footprint_sqm * KW_PER_SQM."

  # --- business constraints --------------------------------------------------
  - id: ERR_CONFIRM_TOO_EARLY
    http: 422
    condition: "FuelDelivery confirmation attempted before confirm_after_iso8601."
  - id: ERR_SITE_DEMAND_LIMIT
    http: 422
    condition: "The site already holds MAX_ACTIVE_DEMANDS_PER_SITE fuel deliveries or resource holds in {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT}."
  - id: ERR_INSUFFICIENT_DRAW_POSITION
    http: 422
    condition: "The requested or confirmed fuel volume exceeds Site.draw_position_therms."
  - id: ERR_DRAW_POSITION_BELOW_RESUME
    http: 422
    condition: "Site unfreeze requested while draw_position_therms < MIN_RESUME_DRAW_THERMS."
  - id: ERR_CUSTOMER_SOURCING_UNVERIFIED
    http: 422
    condition: "A delivery names an attesting customer who is not CUSTOMER_ACTIVE, or no PPA of the site carries fuel_responsibility = CUSTOMER_SOURCED_GAS."
  - id: ERR_SETTLEMENT_PERIOD_INVALID
    http: 422
    condition: "SettlementLine.period_end is not strictly after SettlementLine.period_start."
  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 422
    condition: "The new settlement period [period_start, period_end) overlaps an existing non-reversed line on the same PPA."
  - id: ERR_SETTLEMENT_PERIOD_BEFORE_ACTIVATION
    http: 422
    condition: "SettlementLine.period_start falls before Ppa.state_entered_at."
  - id: ERR_EXIT_WINDOW_CONFLICT
    http: 422
    condition: "A service-plan maintenance window overlaps a PPA_EXIT_PENDING cure window at the same site for a different PPA."
  - id: ERR_DELIVERY_WINDOW_OVERLAP
    http: 422
    condition: "A fuel delivery window overlaps another open delivery window at the same site."
  - id: ERR_OUT_OF_ORDER
    http: 422
    condition: "A settlement line is validated while its ordinal is not strictly greater than the PPA's most recently applied line ordinal."
  - id: ERR_ALLOCATION_LIMIT
    http: 422
    condition: "A settlement line's allocation index is not strictly less than the PPA's consumed allocation count."
  - id: ERR_NO_ELIGIBLE_ACCRUAL
    http: 422
    condition: "A settlement allowance is issued while the PPA has no PpaAccrual in ACCRUAL_OPEN."
  - id: ERR_CREDIT_TIER_INELIGIBLE
    http: 422
    condition: "An exposure hold is applied to a customer whose credit_tier is CREDIT_PRIME, or a transfer is requested for a CREDIT_SUBSTANDARD customer without armed hold."

  # --- business fiscal -------------------------------------------------------
  - id: ERR_GUARANTEE_FLOOR_BREACH
    http: 422
    condition: "An allowance apply, true-up or settlement would drive capacity_guarantee_reserve_cents below the PPA's loss_floor_cents."
  - id: ERR_BUMPER_EXCEEDED
    http: 422
    condition: "net_charge_cents minus output_guarantee_credit_cents exceeds the customer's lifetime billable base plus SETTLEMENT_CREDIT_CAP_CENTS."
  - id: ERR_ACCRUAL_UNBALANCED
    http: 422
    condition: "The PPA's signed accrual sum for a period would not equal zero after a true-up or allowancing reconciliation."

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The expected_<parent>_version supplied with a write does not equal the parent resource's current version."

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:

  - name: SiteOperator
    description: "Owns sites, contracts and interconnection posture; the only role that can freeze or unfreeze a site or run batch operations."
    identity: opaque
    exclusive_operations:
      - "POST /power/sites"
      - "POST /power/sites/{id}/freeze"
      - "POST /power/sites/{id}/unfreeze"
      - "POST /power/sites/{id}/evaluate"
      - "POST /power/sites/{id}/transfer-ppa"
      - "POST /power/sites/{id}/resource-holds"
      - "POST /power/sites/{id}/release-resource-hold"
      - "POST /power/ppas"
      - "POST /power/ppas/{id}/activate"
      - "POST /power/ppas/{id}/request-exit"
      - "POST /power/ppas/{id}/cure"
      - "POST /power/ppas/{id}/terminate"
      - "POST /power/ppas/{id}/renew"
      - "POST /power/ppas/{id}/adjust-contract"
      - "POST /power/_ops/recompute-index-bases"
      - "POST /power/_ops/rollover-period"
      - "POST /power/_clock/set_current_utc"
    shared_operations:
      - "GET /power/sites"
      - "GET /power/sites/{id}"
      - "GET /power/sites/{id}/ppas"
      - "GET /power/sites/{id}/fuel-deliveries"
      - "GET /power/sites/{id}/fuel-deliveries/{id}"
      - "GET /power/ppas/{id}"
      - "GET /power/ppas/{id}/settlement-lines"
      - "GET /power/ppa-accruals"
      - "GET /power/ppa-transitions"
      - "GET /power/ppa-transitions/{id}"
      - "GET /power/ppas/{id}/transitions"

  - name: Customer
    description: "The offtaker entity itself; may only read its own contracts."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "GET /power/ppas/{id} when Ppa.customer_id equals X-User-ID"
      - "GET /power/customers/{id}/ppas when customerId equals X-User-ID"
    shared_operations: []

  - name: CustomerService
    description: "Owns customer relationship posture and the renewal review dimension."
    identity: opaque
    exclusive_operations:
      - "POST /power/customers"
      - "POST /power/customers/{id}/apply-exposure-hold"
      - "POST /power/customers/{id}/release-exposure-hold"
      - "POST /power/customers/{id}/offer-renewal"
      - "POST /power/customers/{id}/accept-renewal"
      - "POST /power/customers/{id}/decline-renewal"
    shared_operations:
      - "GET /power/customers"
      - "GET /power/customers/{id}"
      - "GET /power/customers/{id}/ppas"
      - "GET /power/sites/{id}"
      - "GET /power/ppas/{id}"
      - "GET /power/ppas/{id}/transfers"

  - name: FuelCoordinator
    description: "Owns gas supply sourcing, delivery custody and the site's allocatable fuel pool."
    identity: opaque
    exclusive_operations:
      - "POST /power/sites/{id}/fuel-deliveries"
      - "POST /power/sites/{id}/fuel-deliveries/{id}/dispatch"
      - "POST /power/sites/{id}/fuel-deliveries/{id}/confirm"
      - "POST /power/sites/{id}/fuel-deliveries/{id}/cancel"
    shared_operations:
      - "GET /power/sites/{id}"
      - "GET /power/sites"
      - "GET /power/sites/{id}/fuel-deliveries"
      - "GET /power/sites/{id}/fuel-deliveries/{id}"

  - name: ServiceEngineer
    description: "Owns remote monitoring, module replacement staging and maintenance windows."
    identity: opaque
    exclusive_operations:
      - "POST /power/ppas/{id}/service-plans"
      - "POST /power/ppas/{id}/service-plans/{id}/schedule-replacement"
      - "POST /power/ppas/{id}/service-plans/{id}/dispatch-module-replacement"
    shared_operations:
      - "GET /power/ppas/{id}/service-plans"
      - "GET /power/ppas/{id}/service-plans/{id}"
      - "GET /power/ppas/{id}"
      - "GET /power/sites/{id}"

  - name: SettlementAnalyst
    description: "Prepares settlement lines and accruals; makes a final decision on the ledger."
    identity: opaque
    exclusive_operations:
      - "POST /power/ppas/{id}/settlement-lines"
      - "POST /power/ppas/{id}/settlement-lines/{id}/validate"
      - "POST /power/ppa-accruals"
      - "POST /power/ppas/{id}/reconcile-accruals"
      - "POST /power/ppas/{id}/allowances"
      - "POST /power/ppas/{id}/allowances/{id}/apply"
    shared_operations:
      - "GET /power/ppas/{id}/settlement-lines"
      - "GET /power/ppas/{id}/settlement-lines/{id}"
      - "GET /power/ppa-accruals"
      - "GET /power/ppa-accruals/{id}"
      - "GET /power/ppas/{id}/allowances"
      - "GET /power/ppas/{id}/allowances/{id}"

  - name: SettlementApprover
    description: "Approves, applies and reverses settlement lines; cannot prepare the lines this role applies."
    identity: opaque
    exclusive_operations:
      - "POST /power/ppas/{id}/settlement-lines/{id}/approve"
      - "POST /power/ppas/{id}/settlement-lines/{id}/settle"
      - "POST /power/ppas/{id}/settlement-lines/{id}/reverse"
    shared_operations:
      - "GET /power/ppas/{id}/settlement-lines"
      - "GET /power/ppas/{id}/settlement-lines/{id}"
      - "GET /power/ppas/{id}/allowances"
      - "GET /power/ppa-accruals"