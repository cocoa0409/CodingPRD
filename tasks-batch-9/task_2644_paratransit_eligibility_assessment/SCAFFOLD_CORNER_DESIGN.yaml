      - name: duplicate_visitor_service_date_consumes_no_day_and_range_is_enforced
        claim_type: input_set_filtering
        grounds:
          - calculations.visitor_days_accounting
          - validations.priority_68.ERR_SERVICE_DATE_OUT_OF_RANGE
        distinguishing_aspect: "Step 4 is idempotent on duplicates — re-recording 2026-08-02 leaves days_used_365 at 2 and service_dates at length 2 — while the acceptance range is closed on both ends: 2026-07-31 (one day before visit_start_date) and 2026-10-31 (one day past clock + 90) are both ERR_SERVICE_DATE_OUT_OF_RANGE, and 2026-10-30 (exactly clock + 90) is accepted."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; OUT_OF_SERVICE_AREA rider with an ACTIVE visitor record, visit_start_date 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Yara Nasser", date_of_birth: "1985-05-15", residence_zone: "OUT_OF_SERVICE_AREA", mobility_aid: "NONE", home_agency_name: "Desert Regional" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applicants/${rider_id}/visitor-eligibilities"
              payload: { home_agency_name: "Desert Regional", home_agency_certification_provided: true, visit_start_date: "2026-08-01" }
              as: IntakeClerk
              captures: { vis_id: $.data.id }
            - call: "POST /visitor-eligibilities/${vis_id}/service-days"
              payload: { service_date: "2026-08-01" }
              as: IntakeClerk
            - call: "POST /visitor-eligibilities/${vis_id}/service-days"
              payload: { service_date: "2026-08-02" }
              as: IntakeClerk
              captures: { used_two: $.data.days_used_365 }
          trigger:
            - call: "POST /visitor-eligibilities/${vis_id}/service-days"
              payload: { service_date: "2026-08-02" }
