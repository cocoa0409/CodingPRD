  # ===========================================================================
  # CALCULATIONS (§1.3) - guide Table 3, per algorithm type and per variant
  # ===========================================================================
  - section: calculations
    instances:

      - name: facility_fee_combined_discount_is_capped_before_the_capacity_surcharge
        claim_type: constants_applied
        grounds:
          - "§1.3 facility_fee: combined_pct = min(MAX_COMBINED_DISCOUNT_PCT 0.30, multi_day_pct + nonprofit_pct); multi_day 0.15 at >= 5 performance days; nonprofit 0.20."
          - "§1.3 facility_fee: capacity_surcharge = max(0, seat_capacity - 1200) * 25, integer, added AFTER the single rounding step."
          - "§1.3 deposit_requirement: credit B -> 0.50, then ceil to the next multiple of 100."
        distinguishing_aspect: >-
          The only place where both discounts stack past the cap AND the surcharge
          applies, so it separates three plausible-but-wrong implementations at
          once: applying 0.35 uncapped (1892500), applying the surcharge before
          the discount (1927500 -> 1900... any pre-discount variant), and
          rounding the deposit down instead of ceiling it (1018750).
        test_recipe:
          setup:
            - "Opera House exists: seat_capacity 1500, base_facility_fee_cents 500000, load_in_day_fee_cents 200000, changeover_buffer_minutes 120, rigging 8000 kg, 600 A, 8 DMX universes, ACTIVE."
            - "Rental client 'Harbor Civic Chorus' exists: credit_rating B, is_nonprofit true, outstanding_balance_cents 0."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Opera House", seat_capacity: 1500, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 8000, house_power_amps: 600, dmx_universes: 8 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Harbor Civic Chorus", contact_email: "admin@harborchorus.example", credit_rating: "B", is_nonprofit: true }
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Harbor Chorus Festival Week", load_in_start_utc: "2026-11-01T08:00:00Z", performance_start_utc: "2026-11-03T19:00:00Z", performance_end_utc: "2026-11-07T22:00:00Z", load_out_end_utc: "2026-11-08T04:00:00Z", performance_day_count: 5, load_in_day_count: 2 }
              captures: { engagement_id: "$.data.id" }
          assert:
            - "base_cents = 500000*5 + 200000*2 = 2900000; multi_day 0.15 + nonprofit 0.20 = 0.35 is capped to 0.30, so discounted = round_half_up(2900000 * 0.70) = 2030000."
            - "capacity_surcharge = (1500 - 1200) * 25 = 7500, so facility_fee_cents == 2037500 (NOT 1892500, which is the uncapped-0.35 signature)."
            - "deposit_required_cents == 1018800: round_half_up(0.50 * 2037500) = 1018750, then ceil to the next multiple of 100 (1018750 is the un-ceilinged signature)."
            - "deposit_paid_cents == 0 and additional_equipment_cost_cents == 0, so the arrears branch of deposit_requirement was not taken (outstanding_balance_cents is 0)."

      - name: facility_fee_at_the_exact_three_performance_day_discount_boundary
        claim_type: tier_boundary
        grounds:
          - "§1.3 facility_fee: multi_day_pct = 0.15 if performance_day_count >= 5, 0.10 if >= 3, else 0.00."
          - "§1.3 facility_fee constants CAPACITY_SURCHARGE_FREE_SEATS 1200 (a 1200-seat hall pays no surcharge)."
        distinguishing_aspect: >-
          Pins the lower tier boundary of the tiered_pricing ladder with two
          engagements that differ ONLY in performance_day_count (2 vs 3) on the
          same hall and the same client, so the 10% step cannot be attributed to
          anything else. A `> 3` implementation prices the second booking at
          1500000 and a `>= 2` implementation discounts the first.
        test_recipe:
          setup:
            - "Grand Hall exists: 1200 seats (exactly the surcharge-free limit), base_facility_fee_cents 500000, load_in_day_fee_cents 200000, changeover_buffer_minutes 120."
            - "Rental client 'Meridian Dance Company' exists: credit_rating A, is_nonprofit false, outstanding 0, so the only discount in play is the multi-day one."
            - "A two-performance-day booking already exists (Oct 2-3 2026, load_in_day_count 0): base 1000000, no multi-day discount, facility_fee_cents 1000000, deposit_required_cents = ceil_100(round_half_up(0.25 * 1000000)) = 250000."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Two Day Run", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-03T22:00:00Z", load_out_end_utc: "2026-10-04T02:00:00Z", performance_day_count: 2, load_in_day_count: 0 }
              captures: { two_day_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Three Day Run", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-13T22:00:00Z", load_out_end_utc: "2026-10-14T02:00:00Z", performance_day_count: 3, load_in_day_count: 0 }
              captures: { three_day_id: "$.data.id" }
          assert:
            - "Three-day booking: base 1500000, multi_day_pct 0.10 at exactly 3 days, so facility_fee_cents == round_half_up(1500000 * 0.90) == 1350000, plus a 0 surcharge at 1200 seats."
            - "deposit_required_cents == 337500 (round_half_up(0.25 * 1350000) = 337500, already a multiple of 100)."
            - "The two-day booking created in setup still reports facility_fee_cents == 1000000 with no discount - the boundary is `>= 3`, not `>= 2`."
            - "Both bookings coexist: the second load-in (Oct 10) is far outside the first booking's load-out plus the 120-minute changeover buffer, so the priority-60 occupancy check passes."

      - name: facility_fee_and_deposit_use_round_half_up_at_the_exact_half_cent
        claim_type: precision
        grounds:
          - "§1.3 facility_fee precision: a single round_half_up applied to the discounted base BEFORE the surcharge is added."
          - "§1.3 deposit_requirement precision: round_half_up on the percentage step, THEN ceil to the next multiple of 100."
        distinguishing_aspect: >-
          Both money steps land on an exact .5 with an EVEN integer part, the one
          case where round-half-up and banker's rounding disagree: 850008.5 ->
          850009 (banker's 850008) and 212508.5 -> 212509 (banker's 212508).
          A 1201-seat hall adds the smallest possible non-zero surcharge (25) so
          the surcharge is proven to be outside the rounding step.
        test_recipe:
          setup:
            - "Half-Cent Hall exists: seat_capacity 1201, base_facility_fee_cents 200002, load_in_day_fee_cents 150000, changeover_buffer_minutes 60, rigging 5000 kg, 400 A, 4 DMX universes."
            - "Rental client 'Lakeshore Presenters LLC' exists: credit_rating A, is_nonprofit false, outstanding 0."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Half-Cent Hall", seat_capacity: 1201, base_facility_fee_cents: 200002, load_in_day_fee_cents: 150000, changeover_buffer_minutes: 60, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Lakeshore Presenters LLC", contact_email: "ap@lakeshore.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Lakeshore Five Night Stand", load_in_start_utc: "2026-11-01T08:00:00Z", performance_start_utc: "2026-11-02T19:00:00Z", performance_end_utc: "2026-11-06T22:00:00Z", load_out_end_utc: "2026-11-07T02:00:00Z", performance_day_count: 5, load_in_day_count: 0 }
              captures: { engagement_id: "$.data.id" }
          assert:
            - "base_cents = 200002 * 5 = 1000010; multi_day_pct 0.15 at 5 days, no nonprofit discount, so the discounted base is exactly 850008.5 cents."
            - "facility_fee_cents == 850034: round_half_up gives 850009, then + (1201 - 1200) * 25 = 25. A half-even implementation yields 850033."
            - "deposit_required_cents == 212600: round_half_up(0.25 * 850034) = round_half_up(212508.5) = 212509, then ceil to the next multiple of 100. Half-even (212508) also ceils to 212600, so the deposit assertion is confirmatory and the 850034 assertion is the discriminator."
            - "The surcharge is never rounded: 25 cents survives intact rather than being absorbed into the rounding step."

      - name: labor_estimate_at_call_minimum_and_at_exact_overtime_and_doubletime_thresholds
        claim_type: threshold_boundary
        grounds:
          - "§1.3 labor_cost: billable_h = max(h, call_minimum_hours); OVERTIME_THRESHOLD_HOURS 8; DOUBLETIME_THRESHOLD_HOURS 12; ot_h = min(max(billable_h - 8, 0), 12 - 8); dt_h = max(billable_h - 12, 0)."
          - "§1.1 Engagement.labor_estimate_total_cents sums calls with status IN {ESTIMATED, WORKED, RECONCILED}."
          - "§1.3 deposit_requirement returns 0 for PRESENTED engagements."
        distinguishing_aspect: >-
          Three calls on one engagement sit exactly on the three interesting
          points of the hour ladder: below the 4-hour call minimum (3 scheduled
          hours must be billed as 4), exactly at the 8-hour overtime threshold
          (no overtime yet) and exactly at the 12-hour doubletime threshold (four
          overtime hours, zero doubletime hours). Off-by-one comparisons on
          either threshold change at least one of the three figures.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' exist; a DRAFT PRESENTED engagement spans load-in 2026-10-01T00:00Z to load-out 2026-10-03T00:00Z with the performance on 2026-10-02T19:00Z-22:00Z, so every call window below is inside the occupancy window (priority-64 check satisfied)."
            - "UnionDepartment ELECTRICS exists with roster_size 10, straight_hourly_rate_cents 5000 and the defaulted rate card (overtime 1.5, doubletime 2.0, call_minimum_hours 4, meal penalty 3500)."
            - "The three windows below never overlap (Oct 1 08:00-11:00, Oct 2 00:00-08:00, Oct 2 08:00-20:00 - the last two only touch at 08:00), so the priority-70 crew aggregate stays at 2 of 10."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
