            - "${cnt} == 0 (feeder computed count reconciled)"
            - "${hp} == false (outage derived field reconciled)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: clustering_scada_trip_promotes_immediately
        claim_type: correct_result
        grounds:
          - calculations.clustering_promotion
          - entities.TroubleSignal.fields.signal_type
        distinguishing_aspect: "A single SCADA_TRIP promotes regardless of the numeric thresholds (S >= 1 branch)."
        test_recipe:
          setup: ["Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder thresholds 3/5; one SCADA_TRIP signal at 00:01Z"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm K1", event_type: "THUNDERSTORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - { call: "POST /om/trouble-signals", payload: { signal_type: "SCADA_TRIP", feeder_id: "${fd_id}", occurred_at: "2026-08-10T00:01:00Z" }, as: TelemetryGateway }
          trigger:
            - { call: "POST /om/storm-events/${ev_id}/run_clustering", payload: { feeder_id: "${fd_id}" }, as: Dispatcher, captures: { prom: $.data.promoted, cnt: $.data.clustered_signal_count } }
          assert:
            - "${prom} == true and ${cnt} == 1 — one SCADA_TRIP alone promotes (counts 0 last-gasps / 0 calls are below threshold yet S >= 1 fires)"

      - name: clustering_anchor_window_inclusive_end
        claim_type: input_set_filtering
        grounds:
          - calculations.clustering_promotion
        distinguishing_aspect: "The 60-minute anchor window includes a signal at exactly anchor+60min (inclusive end) but excludes anchor+61min; the excluded signal stays UNCLUSTERED for the next run."
        test_recipe:
          setup: ["Event ACTIVE; feeder default thresholds (5 calls); calls at 00:00, 00:01, 00:02, 00:03 and exactly 01:00 (anchor 00:00); a sixth call at 01:01"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm K2", event_type: "THUNDERSTORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - { call: "POST /om/trouble-signals", payload: { signal_type: "CUSTOMER_CALL", feeder_id: "${fd_id}", occurred_at: "2026-08-10T00:00:00Z" }, as: TelemetryGateway }
            - { call: "POST /om/trouble-signals", payload: { signal_type: "CUSTOMER_CALL", feeder_id: "${fd_id}", occurred_at: "2026-08-10T00:01:00Z" }, as: TelemetryGateway }
            - { call: "POST /om/trouble-signals", payload: { signal_type: "CUSTOMER_CALL", feeder_id: "${fd_id}", occurred_at: "2026-08-10T00:02:00Z" }, as: TelemetryGateway }
            - { call: "POST /om/trouble-signals", payload: { signal_type: "CUSTOMER_CALL", feeder_id: "${fd_id}", occurred_at: "2026-08-10T00:03:00Z" }, as: TelemetryGateway }
            - { call: "POST /om/trouble-signals", payload: { signal_type: "CUSTOMER_CALL", feeder_id: "${fd_id}", occurred_at: "2026-08-10T01:00:00Z" }, as: TelemetryGateway, captures: { sig5: $.data.id } }
            - { call: "POST /om/trouble-signals", payload: { signal_type: "CUSTOMER_CALL", feeder_id: "${fd_id}", occurred_at: "2026-08-10T01:01:00Z" }, as: TelemetryGateway, captures: { sig6: $.data.id } }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T01:02:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/storm-events/${ev_id}/run_clustering", payload: { feeder_id: "${fd_id}" }, as: Dispatcher, captures: { prom: $.data.promoted, cnt: $.data.clustered_signal_count } }
            - { call: "GET /om/trouble-signals/${sig6}", payload: {}, as: Dispatcher, captures: { d6: $.data.disposition } }
          assert:
            - "${prom} == true and ${cnt} == 5 — the call at exactly anchor+60min (01:00Z) is INCLUDED (inclusive end)"
            - "Signal ${sig6} at 01:01Z remains UNCLUSTERED (${d6} == UNCLUSTERED) — outside the anchored window, left for the next run"

      - name: etr_extension_cap_boundary_360
        claim_type: constants_applied
        grounds:
          - calculations.etr_revision_constraints
          - errors[ERR_ETR_EXTENSION_EXCEEDS_CAP]
        distinguishing_aspect: "An extension of exactly 360 minutes (== MAX_SINGLE_EXTENSION_MINUTES) is accepted; 361 minutes is rejected with ERR_ETR_EXTENSION_EXCEEDS_CAP."
        test_recipe:
          setup: ["Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {100, TREE} (current_etr 07:00Z, version 2); clock advanced to 01:00Z"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm K3", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - call: "POST /om/outages/${ot}/confirm"
              payload: { customers_affected: 100, cause_code: "TREE" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T01:00:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T13:00:00Z", revision_reason: "WEATHER_DELAY", expected_outage_version: "${ot_v}" }, as: Dispatcher, captures: { seq1: $.data.revision_seq } }
            - { call: "GET /om/outages/${ot}", payload: {}, as: Dispatcher, captures: { ot_v2: $.data.version } }
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T13:01:00Z", revision_reason: "CREW_DELAYED", expected_outage_version: "${ot_v2}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "Exactly at cap: +360 min (07:00Z -> 13:00Z) accepted, ${seq1} == 2"
            - "One minute over: +361 min (13:00Z -> 13:01Z) rejected with ${err} == ERR_ETR_EXTENSION_EXCEEDS_CAP"
            - "Outage.${ot}.current_etr remains \"2026-08-10T13:00:00Z\" after the rejected revision"

      - name: etr_lock_horizon_allows_only_nested_discovery
        claim_type: correct_result
        grounds:
          - calculations.etr_revision_constraints
          - errors[ERR_ETR_LOCKED_HORIZON]
        distinguishing_aspect: "Inside the 30-minute public-commit lock window before the current ETR, every reason except NESTED_DISCOVERED is rejected; NESTED_DISCOVERED succeeds."
        test_recipe:
          setup: ["Clock 2026-08-10T00:00:00Z; outage confirmed {100, TREE} (current_etr 07:00Z, version 2); clock advanced to 06:45Z (inside [06:30Z, 07:00Z] lock horizon)"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm K4", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - call: "POST /om/outages/${ot}/confirm"
              payload: { customers_affected: 100, cause_code: "TREE" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:45:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T08:00:00Z", revision_reason: "WEATHER_DELAY", expected_outage_version: "${ot_v}" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T08:00:00Z", revision_reason: "NESTED_DISCOVERED", expected_outage_version: "${ot_v}" }, as: Dispatcher, captures: { seq: $.data.revision_seq } }
            - { call: "GET /om/outages/${ot}", payload: {}, as: Dispatcher, captures: { etr: $.data.current_etr } }
          assert:
            - "${err} == ERR_ETR_LOCKED_HORIZON (WEATHER_DELAY inside the lock horizon)"
            - "NESTED_DISCOVERED is exempt: ${seq} == 2 and ${etr} == \"2026-08-10T08:00:00Z\""
            - "The failed first attempt did not consume a revision_seq or bump the outage version"

      - name: etr_backward_correction_only_pre_working
        claim_type: correct_result
        grounds:
          - calculations.etr_revision_constraints
          - errors[ERR_ETR_BACKWARD_FORBIDDEN]
        distinguishing_aspect: "A backward revision is allowed only with reason CORRECTION while the outage is CONFIRMED; the same backward move with WEATHER_DELAY is rejected."
        test_recipe:
          setup: ["Clock 2026-08-10T00:00:00Z; outage confirmed {100, TREE} (current_etr 07:00Z, v2); clock 01:00Z"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
