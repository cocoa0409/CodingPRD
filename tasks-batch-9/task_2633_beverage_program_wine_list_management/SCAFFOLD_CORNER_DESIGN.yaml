      - name: controller_owns_fiscal_approvals_and_others_cannot_approve
        claim_type: Exclusive Operations
        grounds:
          - rbac[Controller].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority 3]
          - validations[priority 34]
        distinguishing_aspect: >-
          Approval, reversal and settlement are Controller-exclusive while submission is shared, so the
          sommelier who proposed a write-off and the director who owns every other approval are both
          refused on it; the reversal is additionally gated on APPROVED state, which is checked only
          after the role passes.
        test_recipe:
          setup:
            - "Venue HRB, bin A1, a 12-bottle RED lot at 2400 cents, and a SUBMITTED 2-bottle spoilage write-off proposed by the venue sommelier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w1_id}", bin_id: "${bin1_id}", bottles_received: 12, unit_cost_cents: 2400, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /beverage-program/spoilage-write-offs"
              payload: { venue_id: "${v1_id}", lot_id: "${lot1_id}", bottles: 2, reason_code: "SPOILAGE", narrative: "Two corked bottles found in the cellar." }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /beverage-program/spoilage-write-offs/${wo_id}/approve"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/spoilage-write-offs/${wo_id}/reject"
              payload: { note: "Sommelier self-reject attempt." }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/spoilage-write-offs/${wo_id}/reverse"
              payload: { note: "Compliance reversal attempt." }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /beverage-program/spoilage-write-offs/${wo_id}/reverse"
              payload: { note: "Reverse before approval." }
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /beverage-program/spoilage-write-offs/${wo_id}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
          assert:
            - "the director approval and the sommelier rejection both return 403 ERR_FORBIDDEN_ROLE, leaving state SUBMITTED and cogs_cents 0"
            - "the ComplianceOfficer reversal returns 403 ERR_FORBIDDEN_ROLE (priority 3), NOT 409 ERR_WRITE_OFF_NOT_APPROVED"
            - "the same reversal attempted by the Controller returns 409 ERR_WRITE_OFF_NOT_APPROVED, proving the state check at priority 34 runs only after the role check"
            - "InventoryLot.${lot1_id}.bottles_on_hand is still 12 after all four refusals"
            - "the Controller approval returns 200 with state APPROVED, cogs_cents 4800 and bottles_on_hand 10"
      - name: compliance_officer_owns_licence_clearance_and_cannot_trade
        claim_type: Exclusive Operations
        grounds:
          - rbac[ComplianceOfficer].exclusive_operations
          - rbac[DistributorRep].exclusive_operations
