  - rule_id: compensating_invariant
    instances:

      - name: wire_mass_conserved_across_reservation_cancellation_and_completion
        conserved_quantity: "WireLot.received_kg == on_hand_kg + reserved_kg + consumed_kg, at 3 decimal places, after every posting"
        grounds:
          - calculations.wire_mass_required
          - calculations.wire_consumption_at_completion
          - state_machines.ProductionRun.FAI_PENDING_or_RUNNING_to_CANCELLED
          - state_machines.ProductionRun.RUNNING_to_COMPLETE
          - entities.WireLot.fields.on_hand_kg
          - entities.WireLot.fields.reserved_kg
          - entities.WireLot.fields.consumed_kg
        distinguishing_aspect: |
          The conserved quantity is MASS in kilograms. A cancellation must hand back the stored wire_reserved_kg
          verbatim (21.821 kg, not a recomputation), and a completion must split the reservation into 21.185 kg
          consumed plus 0.636 kg returned to stock, so the three-way ledger closes on 500.000 kg at every step.
          The scrap allowance is what makes drift visible: consuming the rounded reservation instead of the
          rounded actual usage would strand 0.636 kg.
        test_recipe:
          setup:
            - "An INDUSTRIAL program with design D1 PROTOTYPE_RELEASED (0.021185 kg per piece) and a CERTIFIED 500.000 kg heat."
            - "An ACTIVE setup S1 on COIL-12 in [2026-08-05T08:00Z, 12:00Z) at logical clock 2026-08-05T08:30:00Z."
