            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { pv1: $.data.version } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${pv1}" }, as: IntakeWorker, captures: { ep1: $.data.epoch, oc1: $.data.offers_created } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { pv2: $.data.version } }
