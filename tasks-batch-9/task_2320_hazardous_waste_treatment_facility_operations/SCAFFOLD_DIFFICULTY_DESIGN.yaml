  - rule_id: compensating_invariant
    instances:
      - name: container_void_restores_facility_mass_ledger
        grounds:
          - calculations.facility_mass_ledger
          - calculations.financial_assurance_requirement
          - state_machines.Container.FILLING_to_VOIDED
          - entities.Facility.fields.mass_ledger_kg
          - entities.Facility.fields.unallocated_receipt_kg
        distinguishing_aspect: |
          Conserved quantity = mass in kg: voiding a 200.0 kg container moves the identical figure from
          held_mass_kg back into unallocated_receipt_kg, so mass_ledger_kg stays exactly equal to
          received_mass_kg (1250.5) and closure_cost_estimate_cents returns to its pre-placement 26,250,000.
        test_recipe:
          setup:
            - "One received line of 1250.5 kg and one 200.0 kg container placed in an OPEN container area"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
