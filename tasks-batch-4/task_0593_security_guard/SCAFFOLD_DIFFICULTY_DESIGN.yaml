          trigger:
            - call: "POST /compliance-sweeps"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "compliance-sweep response: expired_credential_count == 1"
            - "compliance-sweep response: unassigned_shift_count == 1"
            - "compliance-sweep response: at_risk_site_count == 1"
            - "Credential.${lic_id}.status == EXPIRED"
