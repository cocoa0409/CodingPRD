  # ===========================================================================
  - section: consistency_model
    instances:
      - name: approve_cascade_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.ExpenseReport.SUBMITTED_to_APPROVED
          - entities.ExpenseReport.fields.status
        distinguishing_aspect: "The APPROVE response itself shows the report status APPROVED and total_reimbursable_cents; the trip ledger update is readable immediately after."
        test_recipe:
          setup: ["Approved CA trip budget 100000; SUBMITTED report with one out-of-pocket FLIGHT 30000."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm30@x.com", full_name: "CMgr30", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct30@x.com", full_name: "CTrav30", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Immediate Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "FLIGHT", claimed_amount_cents: 30000, cabin_class: "ECONOMY", scheduled_hours: 4, advance_days: 20 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports/${rpt_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /expense-reports/${rpt_id}/decision"
              payload: { decision: "APPROVE" }
