  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: aca_affordability_at_threshold_is_affordable
        grounds:
          - calculations.compute_aca_affordability
          - entities.Form1095C.affordability_indicator
          - validations[priority=4]
        distinguishing_aspect: |
          Numeric threshold crossing on the ACA affordability metric: lowest-cost
          self-only employee monthly 9000 vs threshold 9020 at income 100000 ->
          AFFORDABLE (<=); at income 99000 threshold 8930 -> UNAFFORDABLE. Boundary <=.
        test_recipe:
          setup:
            - "Employee monthly_household_income_cents 100000."
            - "MEDICAL SILVER EMPLOYEE_ONLY tier is_lowest_cost_self_only (monthly 30000, employer 0.70 -> emp 9000)."
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Ka Frost", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 100000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Silver PPO" }
              as: BenefitsAdmin
              captures: { silver_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${silver_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 30000, employer_contribution_pct: 0.70, is_lowest_cost_self_only: true }
              as: BenefitsAdmin
              captures: { silver_tier_id: $.data.id }
          trigger:
            - call: "POST /employees/${emp_id}/form-1095c"
              payload: { tax_year: 2026 }
              as: ComplianceOfficer
              captures: { ind: $.data.affordability_indicator, thr: $.data.affordability_threshold_cents, lc: $.data.lowest_cost_monthly_premium_cents }
          assert:
            - "Form1095C.lowest_cost_monthly_premium_cents == 9000"
            - "Form1095C.affordability_threshold_cents == 9020 (round_half_up(100000*0.0902))"
            - "Form1095C.affordability_indicator == AFFORDABLE (9000 <= 9020)"
            - "At income 99000 (threshold 8930) the indicator would be UNAFFORDABLE"

      - name: terminate_employee_with_zero_active_enrollments_empty_set
        grounds:
          - state_machines.Employee.ELIGIBLE_to_TERMINATED
          - entities.Enrollment.status
          - validations[priority=5]
        distinguishing_aspect: |
          Empty-collection edge on a DIFFERENT metric/endpoint: terminating an
          ELIGIBLE employee with ZERO ACTIVE enrollments succeeds with no supersede
          and zero TERM CarrierFeedRecords (empty cascade set).
        test_recipe:
          setup:
            - "Employee ELIGIBLE, no enrollments."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Lu Ames", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
          trigger:
            - call: "POST /employees/${emp_id}/terminate"
              payload: {}
              as: BenefitsAdmin
              captures: { st: $.data.eligibility_status }
            - call: "GET /carrier-feed-records?employee_id=${emp_id}"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "Employee.${emp_id}.eligibility_status == TERMINATED"
            - "Zero CarrierFeedRecord rows exist for ${emp_id} (empty cascade set)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
