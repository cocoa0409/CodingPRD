          assert:
            - "Settlement.${stl_a}: violation_days == 92, base_penalty_cents == 2000000 (min(250000 x 92, 500 x 4000) - the unit measure binds), mitigation_factor == 0.6000, adjusted_penalty_cents == 1200000, fee_cap_cents == 720000 (adjusted penalty is in the >= 1000000 tier, multiplier 0.60), allowed_fees_cents == 500000, state_share_cents == 900000, noticing_party_share_cents == 300000, total_settlement_cents == 1700000"
            - "first trigger call: HTTP 409 with error_id ERR_INDEMNITY_CAP_EXCEEDED (1200000 > the summed cap 1000000) and Settlement.${stl_a}.status still PROPOSED with executed_at null"
            - "Settlement.${stl_b}: mitigation_factor == 1.0000 (no pass-through obligation, so no warranty defense), adjusted_penalty_cents == 2000000, fee_cap_cents == 1200000, allowed_fees_cents == 500000, state_share_cents == 1500000, noticing_party_share_cents == 500000, total_settlement_cents == 2500000"
            - "second trigger call: HTTP 200 even though 2000000 exceeds the same 1000000 cap - the rule is gated on the warranty defense having been applied"
            - "Settlement.${stl_b}.status == EXECUTED, executed_by_user_id == rc_2, executed_at == 2026-08-01T00:00:00Z, and NoticeOfViolation.${notice_b}.status == SETTLED"

      - name: val_lab_tested_submit_requires_lab_basis_on_every_contributing_link
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=51]
          - errors[ERR_LAB_RESULT_MISSING]
        distinguishing_aspect: |
          A LAB_TESTED submission must find lab_result_ppm and lab_loq_ppm on every contributing
          MaterialChemical link, not merely on one of them; a single DECLARED link anywhere in the
          contributing set blocks the SUBMIT.
        excluded_because:
          difficulty_instance: lab_tested_submit_requires_lab_basis_on_every_link
          rationale: |
            That §1.8 cross_entity_state_dependency instance already walks a two-link product where
            one link is LAB_TESTED and the other DECLARED, asserts ERR_LAB_RESULT_MISSING on SUBMIT,
            then records the lab result on the second link and re-submits successfully. Adding a
            standalone corner would duplicate its calls verbatim.

      - name: val_bom_write_refused_while_product_on_enforcement_hold
        claim_type: conditional_validation
        grounds:
          - validations[priority=44]
          - errors[ERR_ENFORCEMENT_HOLD_FREEZE]
        distinguishing_aspect: |
          The freeze is conditional on compliance_posture, not on lifecycle_state: component and
          material-chemical writes that were legal a moment earlier start failing as soon as an open
          notice pushes the product to ENFORCEMENT_HOLD, and become legal again when the notice
          closes.
        excluded_because:
          difficulty_instance: bom_write_blocked_while_product_on_enforcement_hold
          rationale: |
            The §1.8 cross_entity_state_dependency instance already covers both directions - a
            successful component write before the notice, ERR_ENFORCEMENT_HOLD_FREEZE after it, and
            the same write succeeding again after DISMISS restores posture - so the conditional edge
            is fully pinned there.

      - name: val_placement_window_overlap_uses_closed_interval_semantics
        claim_type: temporal_validation
        grounds:
          - validations[priority=60]
          - errors[ERR_PLACEMENT_OVERLAP]
        distinguishing_aspect: |
          Placement windows are closed on both ends, so two windows that merely touch at an endpoint
          collide - the opposite of the half-open convention used elsewhere in the same scaffold.
        excluded_because:
          difficulty_instance: placement_closed_windows_collide_on_touching_endpoint
          rationale: |
            The §1.8 resource_temporal_overlap instance already asserts the touching-endpoint
            rejection plus the one-second-gap acceptance on the same channel, and contrasts it
            directly with the reformulation half-open rule.

      - name: val_reformulation_window_overlap_uses_half_open_semantics
        claim_type: temporal_validation
        grounds:
          - validations[priority=61]
          - errors[ERR_REFORMULATION_OVERLAP]
        distinguishing_aspect: |
          Reformulation windows are half-open, so a project starting exactly on the day a prior
          project ends is accepted for the same product/chemical pair.
        excluded_because:
          difficulty_instance: reformulation_half_open_windows_allow_touching_endpoint
          rationale: |
            That §1.8 instance is built precisely on this asymmetry: the touching pair is accepted
            while a one-day-earlier start is rejected with ERR_REFORMULATION_OVERLAP, in the same
            recipe as the closed-interval placement case.

      - name: val_complete_cure_after_deadline_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=62]
          - errors[ERR_CURE_WINDOW_CLOSED]
        distinguishing_aspect: |
          The cure window is inclusive of the deadline instant: COMPLETE_CURE at exactly
          cure_deadline_at succeeds, one second later it fails with ERR_CURE_WINDOW_CLOSED.
        excluded_because:
          difficulty_instance: complete_cure_at_exact_deadline_instant_then_one_second_later
          rationale: |
            The §1.8 boundary_precision_check instance drives the clock to the exact deadline and to
            deadline plus one second on two parallel notices, asserting the accepted and refused
            outcomes side by side, which is strictly stronger than a single-sided corner.

      - name: val_assessment_rejection_ceiling_enforced
        claim_type: aggregate_validation
        grounds:
          - validations[priority=83]
          - errors[ERR_REJECTION_LIMIT_REACHED]
        distinguishing_aspect: |
          rejection_count accumulates across reopen cycles and the REJECT action is refused once the
          ceiling is reached, forcing the analyst to open a fresh assessment.
        excluded_because:
          difficulty_instance: assessment_reject_reopen_cycle_hits_rejection_ceiling
          rationale: |
            The §1.8 non_linear_state_machine instance already loops SUBMIT/PEER_REVIEW/REJECT to the
            ceiling, asserting rejection_count at each pass and ERR_REJECTION_LIMIT_REACHED on the
            attempt past it.

      - name: val_open_settlement_conflict_precedes_absolute_fee_ceiling
        claim_type: priority_conflict
        grounds:
          - validations[priority=81]
          - validations[priority=90]
          - errors[ERR_OPEN_SETTLEMENT_EXISTS]
          - errors[ERR_FEE_REQUEST_EXCEEDS_CEILING]
        distinguishing_aspect: |
          A create that both duplicates an open settlement and requests fees above the absolute
          ceiling must report the lower-numbered uniqueness error, not the field-level ceiling error.
        excluded_because:
          difficulty_instance: open_settlement_conflict_beats_absolute_fee_ceiling
          rationale: |
            The §1.8 priority_pair_validation_conflict instance already fires the doubly-invalid
            create, asserts ERR_OPEN_SETTLEMENT_EXISTS, then isolates each rule so the ceiling error
            is observed on its own.

      - name: val_market_transition_blocked_while_posture_unresolved
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=84]
          - errors[ERR_PRODUCT_ON_ENFORCEMENT_HOLD]
        distinguishing_aspect: |
          MARKET is gated on the compliance dimension: it is refused both for the initial
          EXPOSURE_UNKNOWN posture and for ENFORCEMENT_HOLD, so lifecycle progress depends on
          evidence produced by a different entity graph.
        excluded_because:
          difficulty_instance: product_parallel_dimensions_evolve_independently
          rationale: |
            The §1.8 non_linear_state_machine instance drives both dimensions together and already
            asserts the ERR_PRODUCT_ON_ENFORCEMENT_HOLD refusals at EXPOSURE_UNKNOWN and at
            ENFORCEMENT_HOLD, plus the success once posture is CLEAR.

      - name: val_finalize_before_peer_review_reports_transition_error
        claim_type: priority_conflict
        grounds:
          - validations[priority=40]
          - validations[priority=55]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_PEER_REVIEW_REQUIRED]
        distinguishing_aspect: |
          FINALIZE from DRAFT is both an illegal transition and a missing-peer-review violation; the
          transition guard must win, while FINALIZE from SUBMITTED surfaces the peer-review error.
        excluded_because:
          difficulty_instance: finalize_from_draft_reports_illegal_transition_over_missing_peer_review
          rationale: |
            That §1.8 priority_pair_validation_conflict instance already contrasts the two source
            states in one recipe, which is the only way the ordering is observable.

      - name: val_placement_create_requires_approved_determination
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=71]
          - errors[ERR_DETERMINATION_NOT_APPROVED]
        distinguishing_aspect: |
          Placement work is gated on the parent determination reaching APPROVED, and that gate is
          checked after the overlap guard rather than before it.
        excluded_because:
          difficulty_instance: placement_overlap_reported_before_determination_not_approved
          rationale: |
            The §1.8 instance covers both the standalone refusal on a DRAFT determination and the
            ordering against ERR_PLACEMENT_OVERLAP, so a separate corner would only re-test the
            weaker half.

      - name: val_void_blocked_once_reformulation_consideration_was_delivered
        claim_type: conditional_validation
        grounds:
          - validations[priority=93]
          - errors[ERR_SETTLEMENT_NOT_VOIDABLE]
          - state_machines.Settlement.EXECUTED_to_VOID
          - state_machines.ReformulationProject.VERIFICATION_to_COMPLETED
        distinguishing_aspect: |
          VOID on an EXECUTED settlement is normally legal; it becomes illegal only for the
          conjunction the rule names - reformulation_commitment true AND a COMPLETED
          ReformulationProject on the same product naming the notice's chemical. The control settlement
          also carries reformulation_commitment true but has no completed project, and its VOID
          succeeds, so neither half of the conjunction alone can be what blocks the unwind.
        test_recipe:
          setup:
            - "Benzene is LISTED with NSRL 6.4 ug/day; the clock is 2026-08-01T00:00:00Z throughout."
            - "Product SKU-V93A carries one ACTIVE component of RM-V93 (disclosure VERIFIED, Benzene declared 800.0 ppm) at 0.25 g/unit with contact_factor 0.5, and a FINAL MODELED/ORAL assessment at 100.000 ug/day."
            - "A ReformulationProject on that link with target 8.0 ppm has been carried to COMPLETED, so the link now reads 8.0 ppm and verified_daily_exposure_ug is 1.000."
            - "Product SKU-V93B has no components and no reformulation project."
            - "Both notices allege 4000 units with earliest_violation_date 2026-05-01 and served_at 2026-07-01, and both settlements request 500000 in fees with reformulation_commitment true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
