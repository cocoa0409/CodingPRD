# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Traffic Calming Request & Neighborhood Speed Study
# 9 rules x 2 instances = 18 instances. All chains drive empty-DB -> setup
# state using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two dual-variant calculations on DIFFERENT
  # entity domains (speed-study scoring vs funding-cycle budget allocation).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: speed_score_provisional_vs_certified_input_filtering
        grounds:
          - calculations.study_aggregation
          - calculations.criteria_score
          - state_machines.SpeedStudy.COLLECTING_to_ANALYZED
          - state_machines.SpeedStudy.ANALYZED_to_CERTIFIED
        distinguishing_aspect: |
          Entity domain = SpeedStudy scoring. Two variants over IDENTICAL submitted
          observations diverge purely by input-set filtering: provisional (ALL 4
          observations, incl. one is_valid=false outlier) yields provisional_score
          50, while certified (3 valid only) yields certified_score 30 — and only
          the certified variant drives the request fork (here: 30 < 60 ->
          SCORE_INELIGIBLE).
        test_recipe:
          setup:
            - "Segment (limit 30 mph, 10 households, LOCAL, 0 crashes, 0 pedestrian generators)"
            - "6 residents H1..H6 on the segment; request PETITION_MET (required_signatures = ceil(10*0.6) = 6)"
            - "INITIAL study window 2026-08-03..2026-08-06 with 4 observations; the 4th (2026-08-06) is is_valid=false with p85 50.0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Maple Ave", speed_limit_mph: 30, household_count: 10, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "dv1-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "dv1-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "dv1-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R4", email: "dv1-r4@x.com", street_segment_id: "${seg}", household_ref: "H4" }, as: CityAdmin, captures: { r4: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R5", email: "dv1-r5@x.com", street_segment_id: "${seg}", household_ref: "H5" }, as: CityAdmin, captures: { r5: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R6", email: "dv1-r6@x.com", street_segment_id: "${seg}", household_ref: "H6" }, as: CityAdmin, captures: { r6: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm Maple Ave", requested_budget_cents: 500000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r4}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r5}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r6}" }
            - call: "POST /api/requests/${req}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-06" }
              as: TrafficEngineer
              captures: { study: $.data.id }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 1500, p85_speed_mph: 35.0, mean_speed_mph: 28.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 1500, p85_speed_mph: 35.0, mean_speed_mph: 28.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 1500, p85_speed_mph: 35.0, mean_speed_mph: 28.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-06", vehicle_count: 9000, p85_speed_mph: 50.0, mean_speed_mph: 44.0, is_valid: false }, as: TrafficEngineer }
          trigger:
            - call: "POST /api/speed-studies/${study}/analyze"
              payload: {}
              as: TrafficEngineer
              captures: { prov_score: $.data.provisional_score, prov_p85: $.data.provisional_p85_mph, prov_adv: $.data.provisional_avg_daily_volume }
            - call: "POST /api/speed-studies/${study}/certify"
              payload: {}
              as: TrafficEngineer
              captures: { cert_score: $.data.certified_score, cert_p85: $.data.certified_p85_mph, cert_adv: $.data.certified_avg_daily_volume }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: TrafficEngineer
              captures: { req_status: $.data.status, req_score: $.data.certified_score }
          assert:
            - "SpeedStudy.${study}.provisional_p85_mph == 38.8 (mean of 35,35,35,50 = 38.75 -> round_half_up 1dp)"
            - "SpeedStudy.${study}.provisional_avg_daily_volume == 3375 (mean of 1500,1500,1500,9000)"
            - "SpeedStudy.${study}.provisional_score == 50 (excess 8.8 -> 30 speed pts; adv 3375 -> 20 volume pts; 0 crash/ped)"
            - "SpeedStudy.${study}.certified_p85_mph == 35.0 AND certified_avg_daily_volume == 1500 (valid rows only)"
            - "SpeedStudy.${study}.certified_score == 30 (excess 5.0 -> 20; adv 1500 -> 10)"
            - "TrafficCalmingRequest.${req}.status == SCORE_INELIGIBLE AND certified_score == 30 (certified variant drives the fork, not provisional 50)"

      - name: budget_allocation_provisional_vs_final_on_plan_approval
        grounds:
          - calculations.citywide_ranking_waterfall
          - calculations.plan_approval_rebaseline
          - state_machines.TreatmentPlan.SUBMITTED_FOR_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity domain = FundingCycle budget accounting. The SAME request carries
          two allocation amounts: provisional 10750 (= 10000 + round(750.00)) from
          the planning estimate at publish, and final 12900 (= 12000 + round(900.00))
          from the approved plan estimate — identical request, different entity
          domain from speed scoring, and a different provisional-vs-final trigger.
        test_recipe:
          setup:
            - "Segment (limit 30, 4 households -> required_signatures = ceil(2.4) = 3, LOCAL), 3 residents"
            - "Request (requested_budget_cents 10000) RANKING_ELIGIBLE with certified_score 60"
            - "FundingCycle 2026 with budget_total_cents 50000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Oak St", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "dv2-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "dv2-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "dv2-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm Oak St", requested_budget_cents: 10000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - call: "POST /api/requests/${req}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { study: $.data.id }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/analyze", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/certify", payload: {}, as: TrafficEngineer }
            - call: "POST /api/funding-cycles"
              payload: { cycle_year: 2026, budget_total_cents: 50000 }
              as: CityAdmin
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /api/funding-cycles/${cyc}/publish-ranking"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: CityAdmin
            - call: "GET /api/requests/${req}"
              payload: {}
              as: CityAdmin
              captures: { alloc_before: $.data.allocated_cents, req_v: $.data.version, req_status: $.data.status }
            - call: "POST /api/requests/${req}/treatment-plans"
              payload: { treatment_type: "SPEED_HUMP", estimated_cost_cents: 12000, expected_request_version: "${req_v}" }
              as: TrafficEngineer
              as_user_id: "te-1"
              captures: { plan: $.data.id }
            - { call: "POST /api/treatment-plans/${plan}/submit-for-review", payload: {}, as: TrafficEngineer, as_user_id: "te-1" }
          trigger:
            - call: "POST /api/treatment-plans/${plan}/approve"
              payload: {}
              as: CityEngineer
              as_user_id: "ce-1"
            - call: "GET /api/requests/${req}"
              payload: {}
              as: CityAdmin
              captures: { alloc_after: $.data.allocated_cents }
            - call: "GET /api/funding-cycles/${cyc}"
              payload: {}
              as: CityAdmin
              captures: { committed: $.data.budget_committed_cents, available: $.data.budget_available_cents }
          assert:
            - "Before approval: TrafficCalmingRequest.${req}.allocated_cents == 10750 (provisional: 10000 + round_half_up(750.00)) AND status == FUNDED"
            - "After approval: TrafficCalmingRequest.${req}.allocated_cents == 12900 (final: 12000 + round_half_up(900.00))"
            - "FundingCycle.${cyc}.budget_committed_cents == 12900 AND budget_available_cents == 37100 (delta +2150 applied)"
            - "10750 != 12900 — the two variants price the identical request differently"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — mode (a) tiered multi-input scoring,
  # mode (b) pinned nested-rounding order in allocation. DIFFERENT modes.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: criteria_score_tiered_multi_input_mode_a
        grounds:
          - calculations.criteria_score
          - entities.StreetSegment.fields.crash_count_3yr
          - entities.StreetSegment.fields.pedestrian_generator_count
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — four tiered terms
          (speed-excess tiers, volume tiers, min-capped crash points, min-capped
          pedestrian points) summed under a 100 cap. Pinned inputs land mid-tier
          on every axis: excess 7.5 -> 30, adv 2500 -> 15, crashes 2 -> 10,
          generators 1 -> 10, total exactly 65 (no cap engagement).
        test_recipe:
          setup:
            - "Segment limit 30, 4 households (required = 3), crash_count_3yr = 2, pedestrian_generator_count = 1"
            - "Study observations: 3 valid days, vehicle_count 2500, p85 37.5, mean 30.0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Pine Ln", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 2, pedestrian_generator_count: 1 }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "cfa-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "cfa-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "cfa-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm Pine Ln", requested_budget_cents: 400000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - call: "POST /api/requests/${req}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { study: $.data.id }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 2500, p85_speed_mph: 37.5, mean_speed_mph: 30.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 2500, p85_speed_mph: 37.5, mean_speed_mph: 30.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 2500, p85_speed_mph: 37.5, mean_speed_mph: 30.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/analyze", payload: {}, as: TrafficEngineer }
          trigger:
            - call: "POST /api/speed-studies/${study}/certify"
              payload: {}
              as: TrafficEngineer
              captures: { score: $.data.certified_score }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: TrafficEngineer
              captures: { req_status: $.data.status }
          assert:
            - "SpeedStudy.${study}.certified_score == 65 (30 speed [excess 7.5 in 7-9.99 tier] + 15 volume [2000-2999 tier] + 10 crash [min(3,2)*5] + 10 pedestrian [min(2,1)*10])"
            - "TrafficCalmingRequest.${req}.status == RANKING_ELIGIBLE (65 >= 60)"

      - name: allocation_contingency_per_request_rounding_mode_b
        grounds:
          - calculations.citywide_ranking_waterfall
          - state_machines.FundingCycle.OPEN_to_RANKING_PUBLISHED
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — contingency is rounded
          per-request to integer cents THEN summed (1007c -> round_half_up(75.525)
          = 76c each; committed = 2*1083 = 2166). The rejected order (sum raw
          contingencies 151.05 then round once) would give 2165 — one cent of
          divergence the test pins to the per-request order.
        test_recipe:
          setup:
            - "Two segments A and B (limit 30, 4 households each, LOCAL, 0 crash/ped)"
            - "Request A and request B, each requested_budget_cents 1007, each certified_score 60"
            - "FundingCycle 2026 budget 100000; single publish ranks both (tie on score -> crash tie -> created_at ASC: A rank 1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Seg A", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { segA: $.data.id }
            - call: "POST /api/segments"
              payload: { name: "Seg B", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { segB: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "RA1", email: "cfb-ra1@x.com", street_segment_id: "${segA}", household_ref: "HA1" }, as: CityAdmin, captures: { ra1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "RA2", email: "cfb-ra2@x.com", street_segment_id: "${segA}", household_ref: "HA2" }, as: CityAdmin, captures: { ra2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "RA3", email: "cfb-ra3@x.com", street_segment_id: "${segA}", household_ref: "HA3" }, as: CityAdmin, captures: { ra3: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "RB1", email: "cfb-rb1@x.com", street_segment_id: "${segB}", household_ref: "HB1" }, as: CityAdmin, captures: { rb1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "RB2", email: "cfb-rb2@x.com", street_segment_id: "${segB}", household_ref: "HB2" }, as: CityAdmin, captures: { rb2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "RB3", email: "cfb-rb3@x.com", street_segment_id: "${segB}", household_ref: "HB3" }, as: CityAdmin, captures: { rb3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${segA}", title: "Req A", requested_budget_cents: 1007 }
              as: Resident
              as_user_id: "${ra1}"
              captures: { reqA: $.data.id }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${segB}", title: "Req B", requested_budget_cents: 1007 }
              as: Resident
              as_user_id: "${rb1}"
              captures: { reqB: $.data.id }
            - { call: "POST /api/requests/${reqA}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${reqA}/petition-signatures", payload: {}, as: Resident, as_user_id: "${ra1}" }
            - { call: "POST /api/requests/${reqA}/petition-signatures", payload: {}, as: Resident, as_user_id: "${ra2}" }
            - { call: "POST /api/requests/${reqA}/petition-signatures", payload: {}, as: Resident, as_user_id: "${ra3}" }
            - { call: "POST /api/requests/${reqB}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${reqB}/petition-signatures", payload: {}, as: Resident, as_user_id: "${rb1}" }
            - { call: "POST /api/requests/${reqB}/petition-signatures", payload: {}, as: Resident, as_user_id: "${rb2}" }
            - { call: "POST /api/requests/${reqB}/petition-signatures", payload: {}, as: Resident, as_user_id: "${rb3}" }
            - call: "POST /api/requests/${reqA}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { studyA: $.data.id }
            - { call: "POST /api/speed-studies/${studyA}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyA}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyA}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyA}/analyze", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyA}/certify", payload: {}, as: TrafficEngineer }
            - call: "POST /api/requests/${reqB}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { studyB: $.data.id }
            - { call: "POST /api/speed-studies/${studyB}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyB}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyB}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyB}/analyze", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${studyB}/certify", payload: {}, as: TrafficEngineer }
            - call: "POST /api/funding-cycles"
              payload: { cycle_year: 2026, budget_total_cents: 100000 }
              as: CityAdmin
              captures: { cyc: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /api/funding-cycles/${cyc}/publish-ranking"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: CityAdmin
            - call: "GET /api/funding-cycles/${cyc}"
              payload: {}
              as: CityAdmin
              captures: { committed: $.data.budget_committed_cents }
            - call: "GET /api/requests/${reqA}"
              payload: {}
              as: CityAdmin
              captures: { allocA: $.data.allocated_cents, rankA: $.data.citywide_rank, statusA: $.data.status }
            - call: "GET /api/requests/${reqB}"
              payload: {}
              as: CityAdmin
              captures: { allocB: $.data.allocated_cents, rankB: $.data.citywide_rank, statusB: $.data.status }
