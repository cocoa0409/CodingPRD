  # ===========================================================================
  # Section: calculations (claim-extraction-guide Table 3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: pasteurization_deviation_class_boundaries
        claim_type: boundary_edge
        grounds:
          - calculations.process_validation
          - entities.ProcessRun.fields.deviation_class
        distinguishing_aspect: |
          PASTEURIZATION threshold boundaries are inclusive as written:
          (min_temp 86.0 == setpoint - 2.0, time_below 60 == limit) -> MINOR;
          min_temp 85.9 -> MAJOR; min_temp at setpoint with time_below 30 ->
          MINOR because VALIDATED requires time_below_setpoint_seconds == 0,
          not <= 60.
        test_recipe:
          setup:
            - "Customer; PASTE formula (target 12.0, tol 0.3); three tanks with batches B1/B2/B3 each QA_PASSED and each with a RUNNING process run (setpoint 88.0 C / 30 s)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "DevCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "DV-P", name: "Dev Paste", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-DV1", capacity_liters: 5000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-DV2", capacity_liters: 5000 }, as: PlantManager, captures: { t2: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-DV3", capacity_liters: 5000 }, as: PlantManager, captures: { t3: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${t1}", planned_start_at: "2026-08-09T08:00:00Z", planned_end_at: "2026-08-09T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { b1: $.data.id } }
            - { call: "POST /v1/batches/${b1}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${b1}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${b1}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${b1}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { p1: $.data.id } }
            - { call: "POST /v1/process-runs/${p1}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${t2}", planned_start_at: "2026-08-09T08:00:00Z", planned_end_at: "2026-08-09T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { b2: $.data.id } }
            - { call: "POST /v1/batches/${b2}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${b2}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${b2}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${b2}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { p2: $.data.id } }
            - { call: "POST /v1/process-runs/${p2}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${t3}", planned_start_at: "2026-08-09T08:00:00Z", planned_end_at: "2026-08-09T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { b3: $.data.id } }
            - { call: "POST /v1/batches/${b3}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${b3}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${b3}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${b3}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { p3: $.data.id } }
            - { call: "POST /v1/process-runs/${p3}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /v1/process-runs/${p1}/complete", payload: { min_temp_c: 86.0, time_below_setpoint_seconds: 60 }, as: BlendOperator, as_user_id: "op-1", captures: { p1_status: $.data.status, p1_dev: $.data.deviation_class } }
            - { call: "POST /v1/process-runs/${p2}/complete", payload: { min_temp_c: 85.9, time_below_setpoint_seconds: 60 }, as: BlendOperator, as_user_id: "op-1", captures: { p2_status: $.data.status, p2_dev: $.data.deviation_class } }
            - { call: "POST /v1/process-runs/${p3}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 30 }, as: BlendOperator, as_user_id: "op-1", captures: { p3_status: $.data.status, p3_dev: $.data.deviation_class } }
            - { call: "GET /v1/batches/${b1}", payload: {}, as: Any, captures: { b1_status: $.data.status } }
          assert:
            - "p1_status == DEVIATED and p1_dev == MINOR (86.0 >= 88.0 - 2.0 inclusive; 60 <= 60 inclusive)"
            - "p2_status == DEVIATED and p2_dev == MAJOR (85.9 < 86.0 misses the MINOR floor)"
            - "p3_status == DEVIATED and p3_dev == MINOR (time_below 30 != 0 blocks VALIDATED even at setpoint temp)"
            - "b1_status == PROCESSING (DEVIATED leaves the batch awaiting disposition)"

      - name: hpp_deviation_class_boundaries
        claim_type: boundary_edge
        grounds:
          - calculations.process_validation
          - entities.ProcessRun.fields.deviation_class
        distinguishing_aspect: |
          HPP threshold boundaries: (min_pressure 580.0 == setpoint - 20,
          shortfall 30 == limit) -> MINOR; pressure at setpoint with shortfall
          31 -> MAJOR; pressure 579.9 with zero shortfall -> MAJOR. Same
          inclusive-comparison rule as PASTEURIZATION but on different inputs.
        test_recipe:
          setup:
            - "Customer; HPP formula (target 8.0, tol 0.3); three tanks with batches QA_PASSED and RUNNING HPP runs (setpoint 600.0 MPa / 180 s)"
          setup_api_calls:
