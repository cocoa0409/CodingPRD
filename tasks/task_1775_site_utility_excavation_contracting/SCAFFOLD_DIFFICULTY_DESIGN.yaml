  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pothole_perform_state_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.PotholeVerification.PLANNED_to_PERFORMED
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): performing a VERIFIED
          pothole violates state (ERR_INVALID_STATE, priority 6) and the
          expired-ticket safety gate (ERR_LOCATE_NOT_ACTIVE, priority 7); the
          state error MUST win. Pair distinct from the sibling instance's
          (business_referential vs business_fiscal).
        test_recipe:
          setup:
            - "Project P ACTIVE; ticket T submitted then ACTIVATED at 2026-08-03, later EXPIRED at 2026-08-31 (valid_until = legal_start + 672h); clock at 2026-09-01"
            - "Pothole PH already VERIFIED (performed and verified while the ticket was ACTIVE)"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-PR1", contract_ref: "C-900", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p_id}", locate_ticket_id: "${t_id}", station_label: "STA 10+00", expected_utility_type: WATER, method: VACUUM, design_depth_in: 60, design_offset_in: 12 }
              as: ProjectManager
              captures: { ph_id: $.data.id }
            - call: "POST /site-utility/pothole-verifications/${ph_id}/perform"
              payload: { measured_depth_in: 60, measured_offset_in: 12 }
              as: Foreman
            - call: "POST /site-utility/pothole-verifications/${ph_id}/verify"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /site-utility/pothole-verifications/${ph_id}/perform"
              payload: { measured_depth_in: 60, measured_offset_in: 12 }
              as: Foreman
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (http 409) — the state violation at priority 6 beats the safety violation at priority 7"
            - "PotholeVerification.${ph_id}.status == VERIFIED (no mutation)"
            - "LocateTicket.${t_id}.status == EXPIRED (the losing safety violation was also present)"

      - name: co_create_referential_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_fiscal): a CO
          create whose condition belongs to another project (ERR_CROSS_PROJECT_
          REFERENCE, priority 9) and whose provisional price 11125000 exceeds
          the cap 5000000 (ERR_PRICE_CAP_EXCEEDED, priority 11); the
          referential error MUST win. Pair distinct from the sibling's
          (state vs business_safety).
        test_recipe:
          setup:
            - "Projects P1 (single_co_cap_cents 5000000) and P2, both ACTIVE, both version 1"
            - "UnforeseenCondition C2 OPEN on P2"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P1-PR2", contract_ref: "C-1000", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /site-utility/projects"
              payload: { name: "P2-PR2", contract_ref: "C-1001", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p2_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "Gas Co", owner_type: GAS, min_notice_hours: 72, max_shutdown_hours: 4 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/unforeseen-conditions"
              payload: { project_id: "${p2_id}", condition_type: VOID, stop_work_required: false, description: "void under slab" }
              as: ProjectManager
              captures: { uc2_id: $.data.id }
          trigger:
            - call: "POST /site-utility/change-orders"
              payload: { project_id: "${p1_id}", unforeseen_condition_id: "${uc2_id}", utility_owner_id: "${o_id}", labor_hours: 1000.0, labor_rate_cents: 10000, equipment_hours: 0.0, equipment_rate_cents: 1, material_cost_cents: 0, expected_project_version: "${p1_v}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CROSS_PROJECT_REFERENCE (http 422) — priority 9 beats priority 11"
            - "The losing fiscal violation was present: provisional would be 11125000 > cap 5000000"
            - "No ChangeOrder is persisted for ${p1_id} (rejected request has no side effects; Project.${p1_id}.version unchanged at ${p1_v})"

