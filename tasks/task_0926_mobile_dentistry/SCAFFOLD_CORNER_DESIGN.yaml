  - section: rbac
    instances:

      - name: guardian_reading_another_familys_parent_report_returns_not_found_not_forbidden
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
          - roles.Guardian
          - entities.Report.fields.recipient_user_id
        distinguishing_aspect: "The confidentiality wall answers a Guardian who asks for a PARENT report addressed to a different recipient_user_id with HTTP 404 ERR_NOT_FOUND, deliberately NOT 403, while that same Guardian reads their own report with HTTP 200."
        test_recipe:
          setup:
            - "Clock at 2026-05-11T09:00:00Z, one OPEN ProgramPeriod, one SCHOOL site in CA and two STUDENT patients."
            - "Two GENERATED PARENT reports, one addressed to guardian-user-001 and one to guardian-user-002."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", household_size: 4 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { patient1_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-002", first_name: "Noah", last_name: "Park", date_of_birth: "2015-11-20", household_size: 3 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { patient2_id: $.data.id }
            - call: "POST /mobile-dentistry/reports"
              payload: { program_period_id: "${pp_id}", report_type: "PARENT", site_id: "${site_id}", patient_id: "${patient1_id}", recipient_user_id: "guardian-user-001" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { report1_id: $.data.id }
            - call: "POST /mobile-dentistry/reports/${report1_id}/generate"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /mobile-dentistry/reports"
              payload: { program_period_id: "${pp_id}", report_type: "PARENT", site_id: "${site_id}", patient_id: "${patient2_id}", recipient_user_id: "guardian-user-002" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { report2_id: $.data.id }
            - call: "POST /mobile-dentistry/reports/${report2_id}/generate"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
          trigger:
            - call: "GET /mobile-dentistry/reports/${report2_id}"
              payload: {}
              as: Guardian
              as_user_id: "guardian-user-001"
              captures: { err_id: $.data.error_id }
            - call: "GET /mobile-dentistry/reports/${report1_id}"
              payload: {}
              as: Guardian
              as_user_id: "guardian-user-001"
          assert:
            - "The first trigger call returns HTTP 404 with data.error_id == ERR_NOT_FOUND"
            - "The first trigger call does NOT return 403 and does NOT return ERR_UNAUTHORIZED"
            - "The second trigger call returns HTTP 200 with data.id == ${report1_id}"
            - "Report.${report1_id}.recipient_user_id == guardian-user-001"
            - "Report.${report2_id}.status == GENERATED"

