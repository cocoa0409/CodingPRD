              payload: { title_id: "${ti}", sample_url: "http://s/x1" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co1: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.35, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_TITLE_VERSION"

      - name: title_version_increments_on_open
        claim_type: optimistic_concurrency
        grounds: ["entities.Title.fields.status", "state_machines.Title.DRAFT_to_OPEN_FOR_AUDITION"]
        distinguishing_aspect: "A fresh Title has version 1; POST /titles/{id}/open increments version to 2 (every mutation bumps version by 1)."
        test_recipe:
          setup:
            - "A DRAFT title (version 1)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AX2", email: "ax2@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "XT2", isbn: "X2", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { v2: $.data.version }
          assert:
            - "v1 == 1"
            - "v2 == 2"

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: contract_accept_immediately_moves_title_to_production
        claim_type: immediate
        grounds: ["state_machines.Contract.OFFERED_to_ACCEPTED", "state_machines.Title.CASTING_to_IN_PRODUCTION"]
        distinguishing_aspect: "Accepting a contract (POST /contracts/{id}/respond ACCEPT) makes the Title's IN_PRODUCTION status visible immediately on the next read (immediate consistency)."
        test_recipe:
          setup:
            - "A title in CASTING with an OFFERED contract."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AY1", email: "ay1@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NY1", email: "ny1@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "YT1", isbn: "Y1", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/y1" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
          trigger:
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
          assert:
            - "Title.${ti}.status == IN_PRODUCTION"
            - "Contract.${co}.status == ACCEPTED"

  # =================================================================
  # Excluded (already covered by §1.8 difficulty instances)
  # =================================================================
  - section: calculations
    instances:
      - name: excluded_royalty_round_then_sum
        claim_type: Correct Result
        grounds: ["calculations.royalty_split"]
        excluded_because:
          difficulty_instance: combinatorial_formula / royalty_rounding_round_then_sum
          rationale: "Per-line round-then-sum correctness (statement_net_cents 8913) is asserted by the named §1.8 instance."
      - name: excluded_royalty_provisional_final_divergence
        claim_type: Variant Divergence
        grounds: ["calculations.royalty_split"]
        excluded_because:
          difficulty_instance: dual_variant_calc / royalty_statement_provisional_vs_final
          rationale: "PROVISIONAL vs FINAL narrator_royalty divergence (67500 vs 63450) is asserted by the named §1.8 instance."
      - name: excluded_effective_share_tier_cap
        claim_type: Constants Applied
        grounds: ["calculations.effective_narrator_share"]
        excluded_because:
          difficulty_instance: combinatorial_formula / effective_share_tiered_min_cap
          rationale: "Tier multiplier + exclusivity bonus + SHARE_CAP min clamp (0.50) is asserted by the named §1.8 instance."
      - name: excluded_per_hour_payment
        claim_type: Correct Result
        grounds: ["calculations.narrator_compensation"]
        excluded_because:
          difficulty_instance: dual_variant_calc / narrator_comp_per_hour_vs_royalty_share
          rationale: "PER_HOUR flat fee 212500 credited at FULL approval is asserted by the named §1.8 instance."
      - name: excluded_booked_days_aggregation
        claim_type: Correct Result
        grounds: ["calculations.active_booked_days"]
        excluded_because:
          difficulty_instance: compensating_invariant / booking_days_create_then_cancel_conserves_days
          rationale: "active_booked_days == 9 on create and 0 on cancel is asserted by the named §1.8 instance."
      - name: excluded_payout_ledger_balance
        claim_type: Correct Result
        grounds: ["calculations.payout_ledger_balance"]
        excluded_because:
          difficulty_instance: compensating_invariant / payout_ledger_pay_then_reverse_conserves_money
          rationale: "Balance credit on PAID and debit on REVERSED is asserted by the named §1.8 instance."
      - name: excluded_empty_sales_statement
        claim_type: Input Set Filtering
        grounds: ["calculations.royalty_split"]
        excluded_because:
          difficulty_instance: boundary_precision_check / royalty_statement_empty_sales_set
          rationale: "Empty included-sales set yielding all-zero cents is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
