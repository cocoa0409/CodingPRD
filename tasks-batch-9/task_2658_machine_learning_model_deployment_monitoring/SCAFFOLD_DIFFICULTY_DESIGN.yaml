              payload: { model_version_id: "${v2_id}", serving_endpoint_id: "${se2_id}", pattern: "SHADOW", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-09-30T00:00:00Z", expected_serving_endpoint_version: "${se2_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
