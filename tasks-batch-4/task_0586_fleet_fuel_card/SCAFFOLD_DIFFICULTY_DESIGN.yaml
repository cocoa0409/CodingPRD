              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "8888", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
