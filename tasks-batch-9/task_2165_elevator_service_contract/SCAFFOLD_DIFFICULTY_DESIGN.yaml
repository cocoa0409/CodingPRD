  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_penalty_on_draft_contract_with_no_cars
        grounds:
          - validations[priority=72]
          - validations[priority=120]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_NO_CARS_IN_SCOPE]
          - endpoints[POST /elevator-program/penalties]
        distinguishing_aspect: |
          Error-category pair `state` (priority 72, ERR_CONTRACT_NOT_ACTIVE) versus
          `business_fiscal` (priority 120, ERR_NO_CARS_IN_SCOPE): one request violates both, and the
          lower priority number must win, so the response is 409 ERR_CONTRACT_NOT_ACTIVE and never
          422 ERR_NO_CARS_IN_SCOPE.
        test_recipe:
          setup:
            - "One contract left in status DRAFT (never activated) and carrying zero ElevatorCar rows."
            - "Logical clock at 2026-09-01T00:00:00Z, so 2026-08 IS closed and the period check would pass."
            - "expected_contract_version is read fresh, so the OCC check at priority 60 also passes."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Lambda Annex", building_address: "11 Lambda Ct", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-l", contractor_user_id: "sc-l", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { kl_id: $.data.id }
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /elevator-program/contracts/${kl_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { kl_v: $.data.version }
          trigger:
            - call: "POST /elevator-program/penalties"
              payload: { contract_id: "${kl_id}", period_month: "2026-08", expected_contract_version: "${kl_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == \"ERR_CONTRACT_NOT_ACTIVE\""
            - "${err_id} != \"ERR_NO_CARS_IN_SCOPE\""
            - "ServiceContract.${kl_id}.status == \"DRAFT\""
            - "ServiceContract.${kl_id}.penalty_lifetime_assessed_cents == 0"
            - "GET /elevator-program/penalties?contract_id=${kl_id} returns an empty array with total_count == 0"

      - name: safety_beats_temporal_downtime_window_on_red_tagged_car
        grounds:
          - validations[priority=82]
          - validations[priority=100]
          - errors[ERR_CAR_RED_TAGGED]
          - errors[ERR_DOWNTIME_WINDOW_CONFLICT]
          - calculations.downtime_overlap_rule
          - endpoints[POST /elevator-program/downtime-windows]
        distinguishing_aspect: |
          A DIFFERENT error-category pair from the first instance: `business_safety` (priority 82,
          ERR_CAR_RED_TAGGED) versus `business_temporal` (priority 100,
          ERR_DOWNTIME_WINDOW_CONFLICT). The candidate window both overlaps an existing window on the
          car and targets a red-tagged car, and the safety error must win.
        test_recipe:
          setup:
            - "One ACTIVE contract with one car C1 holding a SCHEDULED REPAIR window 2026-09-10T08:00Z -> 2026-09-10T12:00Z."
            - "A FAIL inspection has driven C1.compliance_state to RED_TAGGED (and availability to OUT_OF_SERVICE); with only one car out of service the contract is still ACTIVE."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Mu Building", building_address: "12 Mu Pl", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-m", contractor_user_id: "sc-m", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { km_id: $.data.id }
            - call: "POST /elevator-program/contracts/${km_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${km_id}", car_code: "CAR-M1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { m1_id: $.data.id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${m1_id}", window_type: "REPAIR", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { wm_id: $.data.id }
            - call: "POST /elevator-program/inspections"
              payload: { car_id: "${m1_id}", inspection_type: "PERIODIC", scheduled_date: "2026-08-01" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { im_id: $.data.id }
            - call: "POST /elevator-program/inspections/${im_id}/record-result"
              payload: { result: "FAIL", deficiency_codes: ["BRK-02"] }
              as: StateInspector
