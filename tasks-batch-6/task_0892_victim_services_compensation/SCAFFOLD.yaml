# =============================================================================
# PRD Benchmark Seed Tables — Victim Services & Compensation Program (task_0892)
# Difficulty: Expert
# =============================================================================

scenario: |
  892. Victim Services & Compensation Program: victim intake & eligibility
  (crime/cooperation), claim (medical/lost-wage/funeral) & documentation,
  collateral-source offset & cap, award & disbursement,
  restitution-recovery/subrogation, notification (VINE) & advocacy, appeal,
  reporting

domain_name: victim-services-compensation
api_prefix: /compensation

complexity_profile:
  primary_archetype: ledger_reconciliation      # collateral-source offset & program-budget commit-vs-disburse
  secondary_archetype: compliance_audit          # eligibility gating, cooperation, segregation-of-duties, appeal
  complexity_layers:
    - dual_variant_calculation                   # provisional (declared/claimed) vs final (confirmed/verified)
    - cascading_side_effects                      # appeal-grant reopen cascade; pay/clawback ledger cascade
    - optimistic_concurrency                      # award create against stale Program budget version
    - derived_field_reconciliation                # program budget_committed / budget_disbursed / budget_recovered

  entity_topology: flat                          # peer entities linked by FK bodies; no nested resource URLs
  state_machine_shape: cyclic                    # VictimCase INELIGIBLE->UNDER_REVIEW (appeal); Claim DENIED->UNDER_REVIEW
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties              # appeals decider must differ from original denier (X-User-ID)
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true    # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program / fiscal-year fund name" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the fund covers" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total appropriated budget in cents", constraints: ">= 0" }
      - { name: overall_case_cap_cents, type: integer, source: input, description: "Maximum net award payable per case", constraints: ">= 0" }
      - { name: medical_cap_cents, type: integer, source: input, description: "Per-case aggregate cap for MEDICAL claims", constraints: ">= 0" }
      - { name: lost_wage_cap_cents, type: integer, source: input, description: "Per-case aggregate cap for LOST_WAGE claims", constraints: ">= 0" }
      - { name: funeral_cap_cents, type: integer, source: input, description: "Per-case aggregate cap for FUNERAL claims", constraints: ">= 0" }
      - { name: mental_health_cap_cents, type: integer, source: input, description: "Per-case aggregate cap for MENTAL_HEALTH claims", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Program lifecycle", constraints: "OPEN | CLOSED" }
      - { name: budget_committed_cents, type: integer, source: computed, description: "Forward-looking: sum of net_award_cents over Awards in {CALCULATED, APPROVED, FINALIZED}" }
      - { name: budget_disbursed_cents, type: integer, source: computed, description: "Chronological: sum of Disbursement.amount_cents where status == PAID" }
      - { name: budget_recovered_cents, type: integer, source: computed, description: "Sum of RecoveryReceipt.amount_cents where status == RECORDED, across the program's cases" }
      - { name: budget_available_cents, type: integer, source: computed, description: "= total_budget_cents - budget_committed_cents" }

  - name: VictimCase
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning compensation fund" }
      - { name: victim_name, type: string, source: input, description: "Victim / claimant full name" }
      - { name: incident_date, type: datetime, source: input, description: "Date the qualifying crime occurred (ISO-8601 date)" }
      - { name: crime_type, type: enum, source: input, description: "Qualifying crime category", constraints: "ASSAULT | HOMICIDE | DOMESTIC_VIOLENCE | DUI | ROBBERY | SEXUAL_ASSAULT | OTHER" }
      - { name: reported_to_le, type: boolean, source: input, description: "Whether the crime was reported to law enforcement" }
      - { name: le_report_date, type: datetime, source: input, description: "Date the crime was reported to law enforcement (optional)" }
      - { name: cooperation_status, type: enum, source: input, default: PENDING, description: "Cooperation with prosecution", constraints: "PENDING | COOPERATIVE | NONCOOPERATIVE" }
      - { name: filing_date, type: datetime, source: input, description: "Date the compensation claim was filed (ISO-8601 date)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Case lifecycle", constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | ELIGIBLE | INELIGIBLE | CLOSED" }
      - { name: eligibility_status, type: enum, source: computed, default: UNDETERMINED, description: "Eligibility determination outcome", constraints: "UNDETERMINED | ELIGIBLE | INELIGIBLE" }
      - { name: denied_at, type: datetime, source: system, description: "Logical-clock timestamp when the case was set INELIGIBLE (basis for appeal window)" }
      - { name: denied_by_user_id, type: string, source: system, description: "X-User-ID of the Adjudicator who set the case INELIGIBLE (segregation-of-duties basis)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> VictimCase.id; owning case" }
      - { name: category, type: enum, source: input, description: "Benefit category", constraints: "MEDICAL | LOST_WAGE | FUNERAL | MENTAL_HEALTH" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Claimed amount in cents (required for MEDICAL/FUNERAL/MENTAL_HEALTH; ignored for LOST_WAGE which is computed)", constraints: ">= 0" }
      - { name: weekly_wage_cents, type: integer, source: input, description: "Gross weekly wage in cents (LOST_WAGE only)", constraints: ">= 0" }
      - { name: num_weeks, type: integer, source: input, description: "Number of full weeks of wage loss (LOST_WAGE only)", constraints: ">= 0" }
      - { name: disability_start_date, type: datetime, source: input, description: "Wage-loss period start, inclusive (LOST_WAGE only)" }
      - { name: disability_end_date, type: datetime, source: input, description: "Wage-loss period end, EXCLUSIVE (LOST_WAGE only); half-open [start, end)" }
      - { name: verified_amount_cents, type: integer, source: input, description: "Documented/verified amount confirmed by Adjudicator at APPROVED transition", constraints: ">= 0" }
      - { name: assessed_base_cents, type: integer, source: computed, description: "Category base before collateral offset (see calc claim_assessed_base)" }
      - { name: collateral_offset_cents, type: integer, source: computed, description: "Collateral-source offset applied to this claim (see calc claim_net)" }
      - { name: net_claim_cents, type: integer, source: computed, description: "assessed_base_cents - collateral_offset_cents, floored at 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Claim lifecycle", constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | DENIED" }
      - { name: denied_at, type: datetime, source: system, description: "Logical-clock timestamp when the claim was DENIED (basis for appeal window)" }
      - { name: denied_by_user_id, type: string, source: system, description: "X-User-ID of the Adjudicator who DENIED the claim (segregation-of-duties basis)" }

  - name: CollateralSource
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; claim this collateral source offsets" }
      - { name: source_type, type: enum, source: input, description: "Collateral source kind", constraints: "HEALTH_INSURANCE | AUTO_INSURANCE | LIFE_INSURANCE | EMPLOYER_BENEFIT | RESTITUTION | OTHER_PUBLIC" }
      - { name: amount_cents, type: integer, source: input, description: "Amount payable by this collateral source in cents", constraints: ">= 0" }
      - { name: coverage_start_date, type: datetime, source: input, description: "Coverage period start, inclusive (optional)" }
      - { name: coverage_end_date, type: datetime, source: input, description: "Coverage period end, inclusive — CLOSED interval [start, end] (optional)" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "Collateral verification state", constraints: "DECLARED | CONFIRMED | WAIVED" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> VictimCase.id; case being compensated" }
      - { name: expected_program_version, type: integer, source: input, description: "OCC token: Program.version the client last observed (create only)" }
      - { name: gross_award_cents, type: integer, source: computed, description: "Sum over categories of min(category total, category cap) (see calc award_net)" }
      - { name: collateral_offset_cents, type: integer, source: computed, description: "Aggregate collateral offset already applied across the case's APPROVED claims" }
      - { name: net_award_cents, type: integer, source: computed, description: "min(gross_award_cents, Program.overall_case_cap_cents), floored at 0" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Disbursement.amount_cents where status == PAID for this award" }
      - { name: approval_status, type: enum, source: system, default: CALCULATED, description: "Approval axis (independent of payment_status)", constraints: "CALCULATED | APPROVED | FINALIZED" }
      - { name: payment_status, type: enum, source: computed, default: UNPAID, description: "Payment axis (independent of approval_status), derived from disbursements", constraints: "UNPAID | PARTIALLY_PAID | FULLY_PAID" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; award being paid" }
      - { name: payee_type, type: enum, source: input, description: "Payee category", constraints: "VICTIM | MEDICAL_PROVIDER | FUNERAL_HOME | MENTAL_HEALTH_PROVIDER" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: pay_run_date, type: datetime, source: input, description: "Scheduled pay-run date (ISO-8601 date); buffer basis for same-payee spacing" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Disbursement lifecycle", constraints: "SCHEDULED | PAID | VOID | CLAWED_BACK" }

  - name: RestitutionRecovery
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> VictimCase.id; case whose award is subrogated for recovery" }
      - { name: offender_name, type: string, source: input, description: "Offender ordered to pay restitution" }
      - { name: ordered_amount_cents, type: integer, source: input, description: "Court-ordered restitution amount in cents", constraints: ">= 0" }
      - { name: recovered_amount_cents, type: integer, source: computed, description: "Sum of RecoveryReceipt.amount_cents where status == RECORDED" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "Recovery lifecycle", constraints: "ORDERED | COLLECTING | SATISFIED | WRITTEN_OFF" }

  - name: RecoveryReceipt
    parent: null
    common_fields: true
    fields:
      - { name: recovery_id, type: string, source: system, description: "FK -> RestitutionRecovery.id; owning recovery (from path)" }
      - { name: amount_cents, type: integer, source: input, description: "Amount received against the restitution order in cents", constraints: "> 0" }
      - { name: received_date, type: datetime, source: input, description: "Date the payment was received (ISO-8601 date)" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "Receipt state", constraints: "RECORDED | VOID" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> VictimCase.id; case whose determination is appealed" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; specific denied claim under appeal (optional; must belong to case_id)" }
      - { name: appeal_reason, type: string, source: input, description: "Free-text basis for the appeal" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp when the appeal was filed (appeal-window check basis)" }
      - { name: status, type: enum, source: system, default: FILED, description: "Appeal lifecycle", constraints: "FILED | UNDER_REVIEW | GRANTED | DENIED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the AppealsOfficer who GRANTED/DENIED (must differ from denier)" }

  - name: Notification
    parent: null
    common_fields: false   # id, created_at only — append-only VINE/advocacy event log
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> VictimCase.id; case the notification concerns (set by cascade)" }
      - { name: channel, type: enum, source: system, description: "Delivery channel", constraints: "VINE | EMAIL | LETTER" }
      - { name: event_type, type: enum, source: system, description: "Notification trigger", constraints: "ELIGIBILITY_DECISION | CLAIM_DECISION | PAYMENT | APPEAL_DECISION | CASE_REOPENED" }
      - { name: message, type: string, source: system, description: "Human-readable notification body" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /compensation/programs/{id}/transition (to_status=CLOSED)"
        actor: ProgramAdmin
        preconditions:
          - "No Award for a case under this program in approval_status CALCULATED or APPROVED (ERR_INVALID_STATE) — only FINALIZED or none"
        side_effects:
          - "status=CLOSED; new case/award creation under this program is rejected with ERR_PROGRAM_CLOSED"

  - entity: VictimCase
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compensation/cases/{id}/transition (to_status=SUBMITTED)"
        actor: IntakeCounselor
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /compensation/cases/{id}/transition (to_status=UNDER_REVIEW)"
        actor: Adjudicator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /compensation/cases/{id}/transition (to_status=ELIGIBLE)"
        actor: Adjudicator
        preconditions:
          - "reported_to_le == true AND cooperation_status == COOPERATIVE (ERR_ELIGIBILITY_CRITERIA_NOT_MET)"
          - "filing_date is within FILING_DEADLINE_DAYS of incident_date, inclusive (ERR_FILING_DEADLINE_PASSED)"
        side_effects:
          - "eligibility_status=ELIGIBLE"
          - "Notification created {event_type: ELIGIBILITY_DECISION, channel: VINE}"
      - from: UNDER_REVIEW
        to: INELIGIBLE
        trigger: "POST /compensation/cases/{id}/transition (to_status=INELIGIBLE)"
        actor: Adjudicator
        preconditions: []
        side_effects:
          - "eligibility_status=INELIGIBLE"
          - "denied_at = current logical clock; denied_by_user_id = acting X-User-ID"
          - "Notification created {event_type: ELIGIBILITY_DECISION, channel: VINE}"
      - from: INELIGIBLE
        to: UNDER_REVIEW
        trigger: "system: Appeal GRANTED cascade (see Appeal.FILED/UNDER_REVIEW->GRANTED)"
        actor: system
        preconditions: []
        note: "Cyclic reopen — non-linear state machine (rule non_linear_state_machine)"
        side_effects:
          - "eligibility_status=UNDETERMINED; denied_at cleared"
          - "Cascade: each Claim of this case in DENIED -> UNDER_REVIEW (transitive_cascade origin)"
          - "Notification created {event_type: CASE_REOPENED, channel: VINE}"
      - from: ELIGIBLE
        to: CLOSED
        trigger: "POST /compensation/cases/{id}/transition (to_status=CLOSED)"
        actor: Adjudicator
        preconditions:
          - "Every Award for this case is FINALIZED with payment_status FULLY_PAID, or the case has no Award (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Claim
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compensation/claims/{id}/transition (to_status=SUBMITTED)"
        actor: IntakeCounselor
        preconditions:
          - "For LOST_WAGE: weekly_wage_cents, num_weeks, disability_start_date, disability_end_date present; for others: claimed_amount_cents present (ERR_VALIDATION)"
          - "For LOST_WAGE: disability period must not overlap another non-DENIED LOST_WAGE claim on the same case, half-open [start,end) (ERR_WAGE_PERIOD_OVERLAP)"
        side_effects:
          - "assessed_base_cents computed (calc claim_assessed_base)"
          - "collateral_offset_cents, net_claim_cents computed provisionally (calc claim_net, variant provisional)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /compensation/claims/{id}/transition (to_status=UNDER_REVIEW)"
        actor: Adjudicator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /compensation/claims/{id}/transition (to_status=APPROVED, verified_amount_cents)"
        actor: Adjudicator
        preconditions:
          - "Parent VictimCase.status == ELIGIBLE (ERR_CASE_NOT_ELIGIBLE) — cross_entity_state_dependency Claim->VictimCase"
          - "verified_amount_cents present for non-LOST_WAGE (ERR_VALIDATION)"
        side_effects:
          - "assessed_base_cents recomputed with verified figures; net_claim_cents recomputed (calc claim_net, variant final)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /compensation/claims/{id}/transition (to_status=DENIED)"
        actor: Adjudicator
        preconditions: []
        side_effects:
          - "net_claim_cents=0"
          - "denied_at = current logical clock; denied_by_user_id = acting X-User-ID"
          - "Notification created {event_type: CLAIM_DECISION, channel: EMAIL}"
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "system: parent VictimCase reopen cascade (INELIGIBLE->UNDER_REVIEW)"
        actor: system
        preconditions: []
        side_effects:
          - "denied_at cleared; denied_by_user_id cleared"

  - entity: CollateralSource
    initial_state: DECLARED
    terminal_states: [CONFIRMED, WAIVED]
    transitions:
      - from: DECLARED
        to: CONFIRMED
        trigger: "POST /compensation/collateral-sources/{id}/transition (to_status=CONFIRMED)"
        actor: Adjudicator
        preconditions:
          - "No other CONFIRMED CollateralSource of the same source_type on the same claim whose CLOSED coverage interval [start,end] overlaps this one (ERR_COLLATERAL_PERIOD_OVERLAP)"
        side_effects: []
      - from: DECLARED
        to: WAIVED
        trigger: "POST /compensation/collateral-sources/{id}/transition (to_status=WAIVED)"
        actor: Adjudicator
        preconditions: []
        side_effects: []

  - entity: Award
    initial_state: CALCULATED
    terminal_states: []
    note: "Two independent axes: approval_status (CALCULATED->APPROVED->FINALIZED) and payment_status (UNPAID->PARTIALLY_PAID->FULLY_PAID). Parallel dimensions — non_linear_state_machine."
    transitions:
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /compensation/awards/{id}/transition (to_status=APPROVED)"
        actor: Adjudicator
        preconditions:
          - "net_award_cents > 0 (ERR_NO_ELIGIBLE_CLAIMS)"
        side_effects:
          - "approval_status=APPROVED"
          - "Notification created {event_type: CLAIM_DECISION, channel: LETTER}"
      - from: APPROVED
        to: FINALIZED
        trigger: "POST /compensation/awards/{id}/transition (to_status=FINALIZED)"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "approval_status=FINALIZED"
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "system: Disbursement PAID bubble-up (0 < amount_paid_cents < net_award_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: FULLY_PAID
        trigger: "system: Disbursement PAID bubble-up (amount_paid_cents >= net_award_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_PAID
        to: PARTIALLY_PAID
        trigger: "system: Disbursement CLAWED_BACK bubble-up (amount_paid_cents drops below net_award_cents)"
        actor: system
        preconditions: []
        note: "payment_status axis is fully re-derived from PAID disbursements on every disbursement mutation (may revert)."
        side_effects: []

  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [VOID, CLAWED_BACK]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /compensation/disbursements/{id}/transition (to_status=PAID)"
        actor: FinanceOfficer
        preconditions:
          - "Parent Award.approval_status in {APPROVED, FINALIZED} (ERR_AWARD_NOT_APPROVED)"
        side_effects:
          - "Program.budget_disbursed_cents += amount_cents (transitive_cascade: Disbursement->Program)"
          - "Award.amount_paid_cents recomputed; Award.payment_status re-derived (bubble-up: Disbursement->Award)"
          - "Notification created {event_type: PAYMENT, channel: VINE}"
      - from: SCHEDULED
        to: VOID
        trigger: "POST /compensation/disbursements/{id}/transition (to_status=VOID)"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /compensation/disbursements/{id}/transition (to_status=CLAWED_BACK)"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Program.budget_disbursed_cents -= amount_cents (compensating_invariant: budget_disbursed conserved)"
          - "Award.amount_paid_cents recomputed; Award.payment_status re-derived"

  - entity: RestitutionRecovery
    initial_state: ORDERED
    terminal_states: [SATISFIED, WRITTEN_OFF]
    transitions:
      - from: ORDERED
        to: COLLECTING
        trigger: "POST /compensation/recoveries/{id}/transition (to_status=COLLECTING)"
        actor: RecoveryOfficer
        preconditions: []
        side_effects: []
      - from: COLLECTING
        to: SATISFIED
        trigger: "POST /compensation/recoveries/{id}/transition (to_status=SATISFIED)"
        actor: RecoveryOfficer
        preconditions:
          - "recovered_amount_cents >= ordered_amount_cents (ERR_INVALID_STATE)"
        side_effects: []
      - from: ORDERED
        to: WRITTEN_OFF
        trigger: "POST /compensation/recoveries/{id}/transition (to_status=WRITTEN_OFF)"
        actor: RecoveryOfficer
        preconditions: []
        side_effects: []
      - from: COLLECTING
        to: WRITTEN_OFF
        trigger: "POST /compensation/recoveries/{id}/transition (to_status=WRITTEN_OFF)"
        actor: RecoveryOfficer
        preconditions: []
        side_effects: []

  - entity: RecoveryReceipt
    initial_state: RECORDED
    terminal_states: [VOID]
    transitions:
      - from: RECORDED
        to: VOID
        trigger: "POST /compensation/receipts/{id}/transition (to_status=VOID)"
        actor: RecoveryOfficer
        preconditions: []
        side_effects:
          - "Parent RestitutionRecovery.recovered_amount_cents recomputed (excludes VOID)"
          - "Program.budget_recovered_cents -= amount_cents (compensating_invariant: budget_recovered conserved)"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /compensation/appeals/{id}/transition (to_status=UNDER_REVIEW)"
        actor: AppealsOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /compensation/appeals/{id}/transition (to_status=GRANTED)"
        actor: AppealsOfficer
        preconditions:
          - "acting X-User-ID != target case/claim denied_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = acting X-User-ID"
          - "Cascade origin (transitive_cascade depth>=3): VictimCase INELIGIBLE -> UNDER_REVIEW, which cascades its DENIED Claims -> UNDER_REVIEW, which clears each claim's denial fields"
          - "Notification created {event_type: APPEAL_DECISION, channel: VINE}"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /compensation/appeals/{id}/transition (to_status=DENIED)"
        actor: AppealsOfficer
        preconditions:
          - "acting X-User-ID != target case/claim denied_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = acting X-User-ID"
          - "Notification created {event_type: APPEAL_DECISION, channel: LETTER}"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: award-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /compensation/awards"
    occ_field: "expected_program_version"
    description: |
      Creating an Award commits net_award_cents against the Program budget and
      advances Program.version. A create whose expected_program_version is behind
      the Program's current version is rejected: the client's view of remaining
      budget is stale because another Award (for any case under the same program)
      has already committed budget since the client last read the Program.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_assessed_base
    trigger: "Claim SUBMITTED (provisional) and Claim APPROVED (final)"
    algorithm: threshold
    formula: |
      if category == LOST_WAGE:
        per_week = round_half_up( min(weekly_wage_cents * WAGE_REPLACEMENT_RATE, WEEKLY_MAX_CENTS) )
        assessed_base_cents = per_week * num_weeks          # ROUND PER WEEK, THEN MULTIPLY (pinned order)
      else:
        # provisional (at SUBMITTED): use claimed_amount_cents
        # final (at APPROVED): use verified_amount_cents
        assessed_base_cents = (variant provisional ? claimed_amount_cents : verified_amount_cents)
    input_set: "single Claim; LOST_WAGE uses weekly_wage_cents & num_weeks, others use claimed/verified"
    constants:
      WAGE_REPLACEMENT_RATE: 0.6667
      WEEKLY_MAX_CENTS: 120000
    precision: "integer cents; round_half_up applied to the per-week benefit BEFORE multiplying by num_weeks"
    variants:
      - { name: provisional, when: "Claim SUBMITTED", difference: "non-LOST_WAGE base = claimed_amount_cents" }
      - { name: final, when: "Claim APPROVED", difference: "non-LOST_WAGE base = verified_amount_cents" }

  - name: claim_net
    trigger: "Claim SUBMITTED (provisional) and Claim APPROVED (final)"
    algorithm: aggregation
    formula: |
      # provisional variant (at SUBMITTED): count DECLARED and CONFIRMED collateral
      # final variant (at APPROVED): count only CONFIRMED collateral (WAIVED/DECLARED excluded)
      offset = sum(cs.amount_cents for cs in CollateralSource
                   where cs.claim_id == claim.id and cs.status in OFFSET_STATUSES)
      collateral_offset_cents = offset
      net_claim_cents = max(0, assessed_base_cents - offset)
    input_set: "CollateralSource rows for the claim, filtered by status per variant"
    constants: {}
    precision: "integer cents; floored at 0"
    variants:
      - { name: provisional, when: "Claim SUBMITTED", difference: "OFFSET_STATUSES = {DECLARED, CONFIRMED}" }
      - { name: final, when: "Claim APPROVED", difference: "OFFSET_STATUSES = {CONFIRMED}" }

  - name: award_net
    trigger: "POST /compensation/awards (Award creation)"
    algorithm: threshold
    formula: |
      # Only APPROVED claims of the case contribute.
      for cat in {MEDICAL, LOST_WAGE, FUNERAL, MENTAL_HEALTH}:
        cat_total[cat] = sum(net_claim_cents for APPROVED claims of case where category==cat)
        cat_capped[cat] = min(cat_total[cat], program.<cat>_cap_cents)
      gross_award_cents = sum(cat_capped[cat] over all categories)
      collateral_offset_cents = sum(collateral_offset_cents for APPROVED claims of case)
      net_award_cents = max(0, min(gross_award_cents, program.overall_case_cap_cents))
    input_set: "APPROVED Claims of the case; excludes DRAFT/SUBMITTED/UNDER_REVIEW/DENIED"
    constants: {}
    precision: "integer cents; nested min: per-category cap then overall case cap"
    variants: []

  - name: program_budget_ledger
    trigger: "Award create/transition, Disbursement transition, RecoveryReceipt create/void"
    algorithm: aggregation
    formula: |
      budget_committed_cents = sum(net_award_cents for Awards of the program's cases
                                   where approval_status in {CALCULATED, APPROVED, FINALIZED})
      budget_disbursed_cents = sum(amount_cents for Disbursements where status == PAID)
      budget_recovered_cents = sum(amount_cents for RecoveryReceipts where status == RECORDED)
      budget_available_cents = total_budget_cents - budget_committed_cents
    input_set: "Awards, Disbursements, RecoveryReceipts scoped to the program's cases, filtered by status"
    constants: {}
    precision: "integer cents"
    variants:
      - { name: committed, when: "forward-looking exposure at award approval", difference: "sums net_award_cents of non-void Awards (commitment)" }
      - { name: disbursed, when: "chronological cash-out", difference: "sums amount_cents of PAID disbursements only (realized)" }

  - name: recovery_recovered
    trigger: "RecoveryReceipt create (RECORDED) and RecoveryReceipt VOID"
    algorithm: aggregation
    formula: |
      recovered_amount_cents = sum(r.amount_cents for RecoveryReceipt r
                                   where r.recovery_id == recovery.id and r.status == RECORDED)
    input_set: "RecoveryReceipt rows for the recovery with status RECORDED (VOID excluded)"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: eligibility_filing_window
    trigger: "VictimCase UNDER_REVIEW -> ELIGIBLE"
    algorithm: threshold
    formula: |
      days_elapsed = date(filing_date) - date(incident_date)   # in whole days
      timely = (0 <= days_elapsed <= FILING_DEADLINE_DAYS)      # inclusive at boundary
      if not timely: reject ERR_FILING_DEADLINE_PASSED
    input_set: "single VictimCase incident_date and filing_date"
    constants:
      FILING_DEADLINE_DAYS: 365
    precision: "whole days; boundary inclusive (day 365 timely, day 366 late)"
    variants: []

  - name: appeal_window
    trigger: "POST /compensation/appeals (Appeal creation)"
    algorithm: threshold
    formula: |
      basis = (claim_id given ? target_claim.denied_at : target_case.denied_at)
      days_elapsed = date(current_clock) - date(basis)
      if days_elapsed > APPEAL_WINDOW_DAYS: reject ERR_APPEAL_WINDOW_EXPIRED   # strictly greater than = expired
    input_set: "current logical clock vs the target's denied_at"
    constants:
      APPEAL_WINDOW_DAYS: 30
    precision: "whole days; day 30 still open, day 31 expired"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Acting role permitted for this operation per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "Path-referenced resources exist (validated left-to-right); body FK references exist", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: all }
  - { priority: 4, category: business_referential, check: "Body FK belongs to the correct scope: Appeal.claim_id must belong to Appeal.case_id; Claim.case_id program must be OPEN; collateral claim ownership", error_id: ERR_REFERENCE_MISMATCH, http_status: 409, applies_to: "POST /compensation/appeals, POST /compensation/claims, POST /compensation/collateral-sources" }
  - { priority: 5, category: state, check: "Target resource is in a valid state for the requested transition (from-state in state machine)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all */transition endpoints" }
  - { priority: 6, category: state, check: "Cross-entity state precondition: Claim->APPROVED requires case ELIGIBLE; Disbursement PAID requires Award APPROVED/FINALIZED; Award create requires case ELIGIBLE", error_id: "ERR_CASE_NOT_ELIGIBLE / ERR_AWARD_NOT_APPROVED", http_status: 409, applies_to: "POST /compensation/claims/{id}/transition, POST /compensation/disbursements, POST /compensation/disbursements/{id}/transition, POST /compensation/awards" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: AppealsOfficer deciding an appeal must differ (X-User-ID) from the Adjudicator who denied the case/claim", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /compensation/appeals/{id}/transition (GRANTED/DENIED)" }
  - { priority: 8, category: business_constraint, check: "Program not CLOSED when creating case/award under it", error_id: ERR_PROGRAM_CLOSED, http_status: 409, applies_to: "POST /compensation/cases, POST /compensation/awards" }
  - { priority: 9, category: business_referential, check: "OCC: expected_program_version equals Program.version at award create", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /compensation/awards" }
  - { priority: 10, category: business_temporal, check: "Appeal filed within APPEAL_WINDOW_DAYS of the target denied_at; eligibility filing within FILING_DEADLINE_DAYS", error_id: "ERR_APPEAL_WINDOW_EXPIRED / ERR_FILING_DEADLINE_PASSED", http_status: 422, applies_to: "POST /compensation/appeals, POST /compensation/cases/{id}/transition" }
  - { priority: 11, category: business_constraint, check: "Eligibility criteria: reported_to_le true AND cooperation_status COOPERATIVE to set ELIGIBLE", error_id: ERR_ELIGIBILITY_CRITERIA_NOT_MET, http_status: 422, applies_to: "POST /compensation/cases/{id}/transition (ELIGIBLE)" }
  - { priority: 12, category: business_constraint, check: "Temporal-overlap: LOST_WAGE disability periods (half-open) must not overlap on a case; same-type CONFIRMED collateral coverage (closed) must not overlap on a claim", error_id: "ERR_WAGE_PERIOD_OVERLAP / ERR_COLLATERAL_PERIOD_OVERLAP", http_status: 409, applies_to: "POST /compensation/claims/{id}/transition (SUBMITTED), POST /compensation/collateral-sources/{id}/transition (CONFIRMED)" }
  - { priority: 13, category: business_constraint, check: "Award has at least one eligible claim (net_award_cents > 0) to be APPROVED", error_id: ERR_NO_ELIGIBLE_CLAIMS, http_status: 422, applies_to: "POST /compensation/awards/{id}/transition (APPROVED)" }
  - { priority: 14, category: business_constraint, check: "Disbursement amount plus already-scheduled/paid disbursements must not exceed Award.net_award_cents", error_id: ERR_DISBURSEMENT_EXCEEDS_AWARD, http_status: 422, applies_to: "POST /compensation/disbursements" }
  - { priority: 15, category: business_fiscal, check: "Award net_award_cents + Program.budget_committed_cents must not exceed Program.total_budget_cents (<= allowed; over rejected)", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /compensation/awards" }
  - { priority: 16, category: business_constraint, check: "Field-level shape: required fields present, enums valid, amounts >= 0 (or > 0 where noted), pagination bounds", error_id: ERR_VALIDATION, http_status: 400, applies_to: all }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Program ---
  - { method: POST, path: "/compensation/programs", description: "Create a compensation program/fund", roles: [ProgramAdmin], code: 201, input: [name, fiscal_year, total_budget_cents, overall_case_cap_cents, medical_cap_cents, lost_wage_cap_cents, funeral_cap_cents, mental_health_cap_cents], output: Program, side_effects: ["status=OPEN; budgets zeroed; budget_available_cents=total_budget_cents"] }
  - { method: GET, path: "/compensation/programs/{id}", description: "Get a program", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: Program, side_effects: [] }
  - { method: GET, path: "/compensation/programs", description: "List programs (paginated) — reporting", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: POST, path: "/compensation/programs/{id}/transition", description: "Transition program (OPEN->CLOSED)", roles: [ProgramAdmin], code: 200, input: [to_status], output: Program, side_effects: ["per Program state machine"] }

  # --- VictimCase ---
  - { method: POST, path: "/compensation/cases", description: "Create a victim case (intake)", roles: [IntakeCounselor], code: 201, input: [program_id, victim_name, incident_date, crime_type, reported_to_le, "le_report_date?", "cooperation_status?", filing_date], output: VictimCase, side_effects: ["status=DRAFT; eligibility_status=UNDETERMINED"] }
  - { method: GET, path: "/compensation/cases/{id}", description: "Get a case", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: VictimCase, side_effects: [] }
  - { method: GET, path: "/compensation/cases", description: "List cases; filter by program_id (FK reverse-reachability) or status", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "VictimCase[]", side_effects: [] }
  - { method: POST, path: "/compensation/cases/{id}/transition", description: "Transition case (submit/review/determine/close)", roles: [IntakeCounselor, Adjudicator], code: 200, input: [to_status, "cooperation_status?"], output: VictimCase, side_effects: ["per VictimCase state machine; may create Notification"] }
  - { method: GET, path: "/compensation/cases/{id}/notifications", description: "List notifications for a case (FK reverse-reachability for Notification)", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["limit?", "offset?"], output: "Notification[]", side_effects: [] }

  # --- Claim ---
  - { method: POST, path: "/compensation/claims", description: "Create a claim under a case", roles: [IntakeCounselor], code: 201, input: [case_id, category, "claimed_amount_cents?", "weekly_wage_cents?", "num_weeks?", "disability_start_date?", "disability_end_date?"], output: Claim, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/compensation/claims/{id}", description: "Get a claim", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/compensation/claims", description: "List claims; filter by case_id (FK reverse-reachability), category, status", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["case_id?", "category?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/compensation/claims/{id}/transition", description: "Transition claim (submit/review/approve/deny)", roles: [IntakeCounselor, Adjudicator], code: 200, input: [to_status, "verified_amount_cents?"], output: Claim, side_effects: ["per Claim state machine; recomputes assessed_base_cents / net_claim_cents"] }

  # --- CollateralSource ---
  - { method: POST, path: "/compensation/collateral-sources", description: "Declare a collateral source against a claim", roles: [IntakeCounselor], code: 201, input: [claim_id, source_type, amount_cents, "coverage_start_date?", "coverage_end_date?"], output: CollateralSource, side_effects: ["status=DECLARED"] }
  - { method: GET, path: "/compensation/collateral-sources/{id}", description: "Get a collateral source", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: CollateralSource, side_effects: [] }
  - { method: GET, path: "/compensation/collateral-sources", description: "List collateral sources; filter by claim_id (FK reverse-reachability)", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["claim_id?", "status?", "limit?", "offset?"], output: "CollateralSource[]", side_effects: [] }
  - { method: POST, path: "/compensation/collateral-sources/{id}/transition", description: "Confirm or waive a collateral source", roles: [Adjudicator], code: 200, input: [to_status], output: CollateralSource, side_effects: ["per CollateralSource state machine"] }

  # --- Award ---
  - { method: POST, path: "/compensation/awards", description: "Create (calculate) an award for a case; commits budget and advances Program.version (OCC)", roles: [Adjudicator], code: 201, input: [case_id, expected_program_version], output: Award, side_effects: ["computes gross_award_cents/net_award_cents (calc award_net); approval_status=CALCULATED; payment_status=UNPAID; Program.budget_committed_cents += net_award_cents; increments Program.version by 1"] }
  - { method: GET, path: "/compensation/awards/{id}", description: "Get an award", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: Award, side_effects: [] }
  - { method: GET, path: "/compensation/awards", description: "List awards; filter by case_id (FK reverse-reachability)", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["case_id?", "limit?", "offset?"], output: "Award[]", side_effects: [] }
  - { method: POST, path: "/compensation/awards/{id}/transition", description: "Transition award approval axis (approve/finalize)", roles: [Adjudicator, FinanceOfficer], code: 200, input: [to_status], output: Award, side_effects: ["per Award approval axis; may create Notification"] }

  # --- Disbursement ---
  - { method: POST, path: "/compensation/disbursements", description: "Schedule a disbursement against an award", roles: [FinanceOfficer], code: 201, input: [award_id, payee_type, amount_cents, pay_run_date], output: Disbursement, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/compensation/disbursements/{id}", description: "Get a disbursement", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: Disbursement, side_effects: [] }
  - { method: GET, path: "/compensation/disbursements", description: "List disbursements; filter by award_id (FK reverse-reachability)", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["award_id?", "status?", "limit?", "offset?"], output: "Disbursement[]", side_effects: [] }
  - { method: POST, path: "/compensation/disbursements/{id}/transition", description: "Transition disbursement (pay/void/clawback)", roles: [FinanceOfficer], code: 200, input: [to_status], output: Disbursement, side_effects: ["per Disbursement state machine; ledger cascade to Program and Award"] }

  # --- RestitutionRecovery ---
  - { method: POST, path: "/compensation/recoveries", description: "Open a restitution/subrogation recovery for a case", roles: [RecoveryOfficer], code: 201, input: [case_id, offender_name, ordered_amount_cents], output: RestitutionRecovery, side_effects: ["status=ORDERED; recovered_amount_cents=0"] }
  - { method: GET, path: "/compensation/recoveries/{id}", description: "Get a recovery", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: RestitutionRecovery, side_effects: [] }
  - { method: GET, path: "/compensation/recoveries", description: "List recoveries; filter by case_id (FK reverse-reachability)", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["case_id?", "status?", "limit?", "offset?"], output: "RestitutionRecovery[]", side_effects: [] }
  - { method: POST, path: "/compensation/recoveries/{id}/transition", description: "Transition recovery (collecting/satisfied/written-off)", roles: [RecoveryOfficer], code: 200, input: [to_status], output: RestitutionRecovery, side_effects: ["per RestitutionRecovery state machine"] }

  # --- RecoveryReceipt (sub-resource under recovery) ---
  - { method: POST, path: "/compensation/recoveries/{id}/receipts", description: "Record a receipt against a recovery", roles: [RecoveryOfficer], code: 201, input: [amount_cents, received_date], output: RecoveryReceipt, side_effects: ["status=RECORDED; RestitutionRecovery.recovered_amount_cents += amount_cents; Program.budget_recovered_cents += amount_cents"] }
  - { method: GET, path: "/compensation/recoveries/{id}/receipts", description: "List receipts for a recovery (FK reverse-reachability for RecoveryReceipt)", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "RecoveryReceipt[]", side_effects: [] }
  - { method: POST, path: "/compensation/receipts/{id}/transition", description: "Void a receipt", roles: [RecoveryOfficer], code: 200, input: [to_status], output: RecoveryReceipt, side_effects: ["per RecoveryReceipt state machine; ledger reversal"] }

  # --- Appeal ---
  - { method: POST, path: "/compensation/appeals", description: "File an appeal of a case/claim denial", roles: [IntakeCounselor], code: 201, input: [case_id, "claim_id?", appeal_reason], output: Appeal, side_effects: ["status=FILED; filed_at = current logical clock"] }
  - { method: GET, path: "/compensation/appeals/{id}", description: "Get an appeal", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: GET, path: "/compensation/appeals", description: "List appeals; filter by case_id or claim_id (FK reverse-reachability)", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: ["case_id?", "claim_id?", "status?", "limit?", "offset?"], output: "Appeal[]", side_effects: [] }
  - { method: POST, path: "/compensation/appeals/{id}/transition", description: "Transition appeal (review/grant/deny)", roles: [AppealsOfficer], code: 200, input: [to_status], output: Appeal, side_effects: ["per Appeal state machine; GRANTED triggers reopen cascade"] }

  # --- Notification (read only; cascade-created) ---
  - { method: GET, path: "/compensation/notifications/{id}", description: "Get a notification", roles: [ProgramAdmin, IntakeCounselor, Adjudicator, FinanceOfficer, RecoveryOfficer, AppealsOfficer], code: 200, input: [], output: Notification, side_effects: [] }

  # --- Test-driving: logical clock ---
  - { method: POST, path: "/compensation/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set; drives denied_at, filed_at, created_at stamps"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, negative amount, or bad pagination bound" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "program_id does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "case id/case_id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id/claim_id does not resolve" }
  - { id: ERR_COLLATERAL_SOURCE_NOT_FOUND, http: 404, condition: "collateral source id does not resolve" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "award id/award_id does not resolve" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "disbursement id does not resolve" }
  - { id: ERR_RECOVERY_NOT_FOUND, http: 404, condition: "recovery id does not resolve" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "receipt id does not resolve" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal id does not resolve" }
  - { id: ERR_REFERENCE_MISMATCH, http: 409, condition: "Body FK exists but is out of scope (e.g., Appeal.claim_id not under Appeal.case_id)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not valid from the resource's current state" }
  - { id: ERR_CASE_NOT_ELIGIBLE, http: 409, condition: "Operation requires the parent VictimCase to be ELIGIBLE" }
  - { id: ERR_AWARD_NOT_APPROVED, http: 409, condition: "Disbursement requires the parent Award in APPROVED or FINALIZED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeals decider is the same user (X-User-ID) who denied the case/claim" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version behind current Program.version at award create" }
  - { id: ERR_PROGRAM_CLOSED, http: 409, condition: "Case/award creation attempted under a CLOSED program" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 422, condition: "filing_date more than FILING_DEADLINE_DAYS after incident_date at ELIGIBLE determination" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal filed more than APPEAL_WINDOW_DAYS after the target's denied_at" }
  - { id: ERR_ELIGIBILITY_CRITERIA_NOT_MET, http: 422, condition: "ELIGIBLE requested but reported_to_le false or cooperation_status not COOPERATIVE" }
  - { id: ERR_WAGE_PERIOD_OVERLAP, http: 409, condition: "LOST_WAGE disability period overlaps another non-DENIED LOST_WAGE claim on the case (half-open)" }
  - { id: ERR_COLLATERAL_PERIOD_OVERLAP, http: 409, condition: "Confirming a collateral source whose closed coverage interval overlaps another CONFIRMED same-type source on the claim" }
  - { id: ERR_NO_ELIGIBLE_CLAIMS, http: 422, condition: "Award APPROVED requested but net_award_cents == 0" }
  - { id: ERR_DISBURSEMENT_EXCEEDS_AWARD, http: 422, condition: "Scheduled + paid disbursements would exceed Award.net_award_cents" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Award net_award_cents + Program.budget_committed_cents exceeds Program.total_budget_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Configures programs/funds and the logical clock; performs reporting reads"
    identity: opaque
    exclusive_operations:
      - "POST /compensation/programs"
      - "POST /compensation/programs/{id}/transition"
      - "POST /compensation/_clock/set_current_utc"
    shared_operations:
      - "All GET reads"

  - name: IntakeCounselor
    description: "Intakes victims, files claims and collateral declarations, files appeals"
    identity: opaque
    exclusive_operations:
      - "POST /compensation/cases"
      - "POST /compensation/claims"
      - "POST /compensation/collateral-sources"
      - "POST /compensation/appeals"
    shared_operations:
      - "POST /compensation/cases/{id}/transition (to_status=SUBMITTED)"
      - "POST /compensation/claims/{id}/transition (to_status=SUBMITTED)"
      - "All GET reads"

  - name: Adjudicator
    description: "Reviews and determines eligibility, decides claims, confirms/waives collateral, calculates and approves awards"
    identity: opaque
    exclusive_operations:
      - "POST /compensation/cases/{id}/transition (to_status in UNDER_REVIEW/ELIGIBLE/INELIGIBLE/CLOSED)"
      - "POST /compensation/claims/{id}/transition (to_status in UNDER_REVIEW/APPROVED/DENIED)"
      - "POST /compensation/collateral-sources/{id}/transition"
      - "POST /compensation/awards"
      - "POST /compensation/awards/{id}/transition (to_status=APPROVED)"
    shared_operations:
      - "All GET reads"

  - name: FinanceOfficer
    description: "Finalizes awards and manages disbursements"
    identity: opaque
    exclusive_operations:
      - "POST /compensation/awards/{id}/transition (to_status=FINALIZED)"
      - "POST /compensation/disbursements"
      - "POST /compensation/disbursements/{id}/transition"
    shared_operations:
      - "All GET reads"

  - name: RecoveryOfficer
    description: "Runs restitution/subrogation recoveries and records/voids receipts"
    identity: opaque
    exclusive_operations:
      - "POST /compensation/recoveries"
      - "POST /compensation/recoveries/{id}/transition"
      - "POST /compensation/recoveries/{id}/receipts"
      - "POST /compensation/receipts/{id}/transition"
    shared_operations:
      - "All GET reads"

  - name: AppealsOfficer
    description: "Independent reviewer who decides appeals; barred by segregation-of-duties from deciding an appeal of their own denial"
    identity: opaque
    exclusive_operations:
      - "POST /compensation/appeals/{id}/transition"
    shared_operations:
      - "All GET reads"
