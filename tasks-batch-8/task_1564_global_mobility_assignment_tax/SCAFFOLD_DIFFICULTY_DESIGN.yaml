  - rule_id: non_linear_state_machine
    instances:
      - name: vendor_engagement_revision_cycle
        grounds:
          - state_machines.VendorEngagement.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.VendorEngagement.REVISION_REQUESTED_to_DRAFT_RETURNED
          - entities.VendorEngagement.fields.revision_count
        distinguishing_aspect: |
          VendorEngagement is cyclic: UNDER_REVIEW -> REVISION_REQUESTED ->
          DRAFT_RETURNED -> UNDER_REVIEW loops with revision_count incrementing per
          lap — a draft can bounce between vendor and reviewer any number of times
          before ACCEPTED -> FILED, unlike a linear pipeline.
        test_recipe:
          setup:
            - "Assignment exists in DRAFT (vendor coordination may start pre-approval); engagement created for 2026"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
