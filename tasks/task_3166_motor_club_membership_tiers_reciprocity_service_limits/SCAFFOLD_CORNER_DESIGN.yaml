        claim_type: computed_read
        grounds:
          - "endpoints.POST /motor-club/_clock/set_current_utc"
        distinguishing_aspect: "Before any set call the logical clock reads exactly 2026-09-01T00:00:00Z (the pinned startup default), so a membership enrolled with no clock call gets term_start_date 2026-09-01T00:00:00Z."
        test_recipe:
          setup: ["empty database; no clock call made before enrollment"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
          trigger:
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1_ts: $.data.term_start_date, m1_te: $.data.term_end_date }
          assert:
            - "term_start_date == 2026-09-01T00:00:00Z (default clock, not wall clock)"
            - "term_end_date == 2027-09-01T00:00:00Z (term_start + 365 days)"
      - name: memberships_list_pagination_envelope
        claim_type: pagination_with_filtering
        grounds:
          - "response_envelope"
          - "endpoints.GET /motor-club/memberships"
        distinguishing_aspect: "List responses carry the pinned envelope fields; with 3 memberships and limit 2: page 1 returns 2 rows with has_more true, page 2 (offset 2) returns 1 row with has_more false and total_count 3; status filter narrows the set."
        test_recipe:
          setup: ["3 memberships enrolled (one cancelled)"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "P One", primary_member_email: "p1@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "P Two", primary_member_email: "p2@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "P Three", primary_member_email: "p3@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
            - call: "POST /motor-club/memberships/${m1}/cancel"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "GET /motor-club/memberships"
              payload: { limit: 2, offset: 0 }
              as: MemberServicesRep
            - call: "GET /motor-club/memberships"
              payload: { limit: 2, offset: 2 }
              as: MemberServicesRep
            - call: "GET /motor-club/memberships"
              payload: { status: "CANCELLED" }
              as: MemberServicesRep
          assert:
            - "page 1: response_type array, total_count == 3, has_more == true, 2 rows"
            - "page 2: has_more == false, 1 row"
            - "status=CANCELLED filter returns exactly the cancelled membership"
      - name: dispatch_fail_terminal_rejected
        claim_type: conditional_action
        grounds:
          - "state_machines.Dispatch"
        distinguishing_aspect: "Failing a COMPLETED dispatch is rejected ERR_INVALID_STATE; terminal states absorb triggers."
        test_recipe:
          setup: ["Dispatch completed"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
