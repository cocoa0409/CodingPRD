# =============================================================================
# task_2468 — Retirement Plan Committee & Investment Menu Governance
# Seed tables §1.0–§1.7 (SCAFFOLD.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2468. Retirement Plan Committee & Investment Menu Governance (retirement plan
  fiduciary committee): committee charter, member appointment and fiduciary
  training with documented acceptance of responsibility, investment policy
  statement with selection criteria, benchmarks and watch-list triggers,
  quarterly investment review with performance, style drift, expense ratio and
  manager change analysis, fund replacement decisions with mapping strategy and
  participant notice requirements, target date suite selection with glidepath and
  custom versus off-the-shelf analysis, share class and revenue sharing review
  with fee levelization decisions, recordkeeper and advisor benchmarking with
  periodic request for proposal, meeting minutes and documentation for fiduciary
  defense

domain_name: retirement-plan-committee-governance
api_prefix: /governance

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_level: expert_plus          # above the §0.4 Expert band: 14 entities, 6 state machines (2 cyclic, 1 parallel-dimension, 1 fork-join), 12 calculations, 25 ordered validations
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency             # OCC on Plan.version and QuarterlyReview.version (create-with-supersede)
    - cascading_side_effects             # two independent depth-4 transitive chains
    - dual_variant_calculation           # composite score variants, levelization method variants, glidepath variants, tally basis variants
    - ops_run_checkpoint                 # POST /governance/plans/{planId}/advance-quarter advances the fiscal epoch and re-derives watch/training/accrual state

  entity_topology: flat
  # Every entity is addressed by its own top-level collection under /governance;
  # relationships are expressed exclusively through FK fields in request bodies
  # and through filtered-list reads. No entity id appears as a path prefix of
  # another entity's collection.

  state_machine_shape: cyclic
  # FundReplacementProposal: DRAFT → UNDER_REVIEW → REVISION_REQUESTED → DRAFT (revision loop)
  # QuarterlyReview:        FINALIZED → REOPENED → SCORING → PENDING_MINUTES → FINALIZED
  # Fund:                   two independent dimensions (menu_status × watch_status) on one row
  # CommitteeMember:        APPOINTED → {TRAINING_ASSIGNED, ACCEPTANCE_PENDING} → ACTIVE (fork-join)
  # Plan.menu_posture:      derived aggregate (OPEN/RESTRICTED/FROZEN) gating child operations

  relationship_patterns:
    - one_to_many            # Plan → Fund, AssetClassSlot, QuarterlyReview, CommitteeMeeting, ...
    - self_referential       # FundScorecard.supersedes_scorecard_id, FundReplacementProposal.superseded_by_proposal_id, ServiceProviderEngagement.successor_engagement_id
    - polymorphic            # Motion.subject_id resolves against Motion.subject_type
    - cross_aggregate        # FundReplacementProposal spans AssetClassSlot + two Funds + a Motion in a CommitteeMeeting

  role_model: segregation_of_duties
  # The consultant who drafts a proposal or scorecard may never approve it; the
  # chair who approves a replacement may never execute the mapping (Recordkeeper
  # only); a member whose affiliated_provider_role matches a motion's subject
  # provider must RECUSE instead of voting.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Plan (root)
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_name, type: string, source: input, description: "Plan sponsor legal name", constraints: "1..120 chars" }
      - { name: plan_name, type: string, source: input, description: "Plan display name", constraints: "1..120 chars" }
      - { name: plan_type, type: enum, source: input, description: "Plan tax code", constraints: "401K | 403B | 457B" }
      - { name: erisa_covered, type: boolean, source: input, default: true, description: "When true, QDIA-designated slot changes require the extended participant notice window" }
      - { name: participant_account_count, type: integer, source: input, description: "Number of participant accounts; per-capita levelization denominator", constraints: ">= 1" }
      - { name: menu_slot_capacity, type: integer, source: input, description: "Hard ceiling on the capacity triple: occupied + reserved + available menu positions always equals this value", constraints: "3..40" }
      - { name: fiscal_quarter_index, type: integer, source: system, default: 0, description: "Ops-run epoch; advanced only by POST /governance/plans/{planId}/advance-quarter" }
      - { name: charter_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ADOPTED | SUPERSEDED — committee charter lifecycle" }
      - { name: charter_adopted_quarter_index, type: integer, source: system, default: null, description: "fiscal_quarter_index at the most recent charter adoption" }
      - { name: quorum_min_voting_members, type: integer, source: input, default: 3, description: "Charter-set absolute quorum floor (set by charter/adopt)", constraints: "2..9" }
      - { name: voting_threshold_pct, type: number, source: input, default: 0.6000, description: "Charter-set support fraction a motion must reach to CARRY (4 decimal places)", constraints: "0.5000..1.0000" }
      - { name: max_voting_seats, type: integer, source: input, default: 7, description: "Charter-set ceiling on CommitteeSeat rows with voting == true", constraints: "2..11" }
      - { name: notice_lead_days_required, type: integer, source: input, default: 30, description: "Base participant-notice lead time in days for a fund change" }
      - { name: blackout_buffer_days, type: integer, source: input, default: 3, description: "Mandatory cooling buffer appended to a blackout window before the next window may open on this plan" }
      - { name: menu_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived aggregate gating all menu-mutating child operations; see calculations.menu_posture" }
      - { name: at_risk_slot_ratio, type: number, source: computed, description: "Fraction of non-RETIRED AssetClassSlot rows in {AT_RISK, PENDING_REPLACEMENT}, 4 decimal places" }
      - { name: occupied_menu_slots, type: integer, source: computed, description: "count(AssetClassSlot where status IN {ACTIVE, AT_RISK, PENDING_REPLACEMENT})" }
      - { name: reserved_menu_slots, type: integer, source: computed, description: "count(FundReplacementProposal where status IN {APPROVED, NOTICE_ISSUED}) — each in-flight replacement holds a second menu position" }
      - { name: available_menu_slots, type: integer, source: computed, description: "menu_slot_capacity - occupied_menu_slots - reserved_menu_slots; never negative" }
      - { name: draft_proposal_count, type: integer, source: computed, description: "count(FundReplacementProposal where status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, BLOCKED})" }
      - { name: total_plan_assets_cents, type: integer, source: computed, description: "Sum of Fund.plan_assets_cents over funds with menu_status IN {ACTIVE, PENDING_REMOVAL}" }
      - { name: revenue_credit_accrued_cents, type: integer, source: computed, description: "Cumulative revenue-sharing credit accrued across all quarters; monotonic non-decreasing" }
      - { name: revenue_credit_allocated_cents, type: integer, source: computed, description: "Cumulative credit consumed by POSTED FeeLevelizationRun rows, net of REVERSED ones" }
      - { name: revenue_credit_balance_cents, type: integer, source: computed, description: "revenue_credit_accrued_cents - revenue_credit_allocated_cents; conserved quantity for the post/reverse invariant" }
      - { name: fee_disclosure_status, type: enum, source: computed, default: "COMPLIANT", description: "COMPLIANT | RESTATEMENT_REQUIRED — flips to RESTATEMENT_REQUIRED when an APPROVED levelization run's credit pool basis goes stale" }
      - { name: documented_acceptance_count, type: integer, source: computed, description: "count(CommitteeMember where acceptance_signed_at IS NOT NULL and status IN {ACCEPTANCE_PENDING, ACTIVE}) — fiduciary-defense counter" }

  # -------------------------------------------------------------- CommitteeSeat
  - name: CommitteeSeat
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: seat_code, type: string, source: input, description: "Charter seat identifier", constraints: "unique per plan_id across seats with status != RETIRED" }
      - { name: seat_class, type: enum, source: input, description: "CHAIR | SPONSOR_FIDUCIARY | FINANCE | HR | PARTICIPANT_REP | INDEPENDENT" }
      - { name: voting, type: boolean, source: input, description: "Whether the seat carries a vote on motions" }
      - { name: status, type: enum, source: system, default: "VACANT", description: "VACANT | FILLED | SUSPENDED | RETIRED" }
      - { name: consecutive_vacant_quarters, type: integer, source: computed, default: 0, description: "Quarters this seat has been VACANT; incremented by advance-quarter, reset on appointment" }
      - { name: seat_index, type: integer, source: input, description: "Deterministic charter ordering key used for seat-scoped listing order", constraints: "unique per plan_id, >= 1" }

  # ------------------------------------------------------------ CommitteeMember
  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - { name: seat_id, type: string, source: input, description: "FK -> CommitteeSeat.id; the seat this appointment occupies" }
      - { name: person_name, type: string, source: input, description: "Appointee legal name" }
      - { name: person_email, type: string, source: input, description: "Appointee contact email", constraints: "unique per seat_id among appointments with status IN {APPOINTED, TRAINING_ASSIGNED, ACCEPTANCE_PENDING, ACTIVE}" }
      - { name: status, type: enum, source: system, default: "APPOINTED", description: "APPOINTED | TRAINING_ASSIGNED | ACCEPTANCE_PENDING | ACTIVE | RESIGNED | REMOVED | TERM_EXPIRED" }
      - { name: term_start_date, type: string, source: input, description: "Inclusive term start, ISO 8601 date (YYYY-MM-DD)" }
      - { name: term_end_date, type: string, source: input, description: "Inclusive term end, ISO 8601 date (YYYY-MM-DD); must be >= term_start_date" }
      - { name: acceptance_signed_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which documented acceptance of fiduciary responsibility was recorded" }
      - { name: acceptance_doc_ref, type: string, source: input, default: null, description: "Document reference for the signed acceptance of fiduciary responsibility" }
      - { name: fiduciary_training_status, type: enum, source: computed, default: "PENDING", description: "PENDING | CURRENT | EXPIRED — derived from this member's FiduciaryTrainingRecord rows; see calculations.fiduciary_training_status" }
      - { name: affiliated_provider_role, type: enum, source: input, default: "NONE", description: "NONE | RECORDKEEPER | ADVISOR | AUDITOR | CUSTODIAN — a non-NONE value forces RECUSE on motions whose subject involves that provider role" }
      - { name: independence_flag, type: boolean, source: computed, description: "true when affiliated_provider_role == NONE" }
      - { name: end_term_reason, type: enum, source: input, default: null, description: "RESIGNATION | REMOVAL_FOR_CAUSE | TERM_EXPIRY — recorded when the appointment leaves the active set" }
      - { name: votes_cast_count, type: integer, source: computed, default: 0, description: "Number of Motion.votes entries recorded for this member with vote IN {FOR, AGAINST, ABSTAIN}" }

  # ---------------------------------------------------- FiduciaryTrainingRecord
  - name: FiduciaryTrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> CommitteeMember.id; trainee" }
      - { name: module_code, type: enum, source: input, description: "FIDUCIARY_DUTIES | IPS_MECHANICS | FEE_BENCHMARKING | PROHIBITED_TRANSACTIONS", constraints: "unique per member_id among records with status IN {ASSIGNED, COMPLETED, WAIVED}" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED | COMPLETED | WAIVED | EXPIRED" }
      - { name: assigned_quarter_index, type: integer, source: system, description: "Plan.fiscal_quarter_index at assignment" }
      - { name: completed_quarter_index, type: integer, source: system, default: null, description: "Plan.fiscal_quarter_index at completion or waiver" }
      - { name: score_pct, type: integer, source: input, default: null, description: "Assessment score; >= 80 required for COMPLETED", constraints: "0..100" }
      - { name: waiver_basis, type: string, source: input, default: null, description: "Prior-certification reference required when outcome is WAIVED" }
      - { name: validity_quarters, type: integer, source: input, default: 8, description: "Quarters a COMPLETED/WAIVED module stays current before advance-quarter expires it", constraints: "1..20" }

  # ------------------------------------------------ InvestmentPolicyStatement
  - name: InvestmentPolicyStatement
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: approving_motion_id, type: string, source: system, default: null, description: "FK -> Motion.id; the CARRIED motion that adopted this IPS version" }
      - { name: version_label, type: string, source: input, description: "IPS version label, e.g. 'IPS-2026-A'", constraints: "unique per plan_id" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ADOPTED | SUPERSEDED | RETIRED — at most one ADOPTED row per plan_id" }
      - { name: scoring_variant, type: enum, source: input, description: "TRAILING_PERIOD | ROLLING_SINCE_WATCH — selects the composite-score variant for reviews pinned to this IPS" }
      - { name: watch_trigger_score_max, type: number, source: input, default: 40.00, description: "composite_score <= this value recommends WATCH (inclusive boundary)", constraints: "0.00..100.00" }
      - { name: remediation_trigger_score_max, type: number, source: input, default: 25.00, description: "composite_score <= this value recommends REMEDIATION (inclusive boundary); must be < watch_trigger_score_max" }
      - { name: cure_margin_points, type: number, source: input, default: 10.00, description: "Points above watch_trigger_score_max a watched fund must score to be recommended CLEAR" }
      - { name: expense_peer_multiple, type: number, source: input, default: 1.25, description: "A candidate fund fails selection criteria when net_expense_ratio_bps > peer_median_expense_bps * this multiple" }
      - { name: min_track_record_quarters, type: integer, source: input, default: 12, description: "Minimum Fund.track_record_quarters for menu eligibility" }
      - { name: style_drift_r2_floor, type: number, source: input, default: 0.8000, description: "Benchmark R-squared floor; below this the style component is penalised", constraints: "0.0000..1.0000" }
      - { name: watch_grace_quarters, type: integer, source: input, default: 2, description: "Consecutive breach quarters in REMEDIATION before TERMINATION_PENDING is recommended", constraints: "1..8" }
      - { name: weights, type: object, source: input, description: "Composite weights { performance, peer, expense, style, manager }; each 0.00..1.00 and the five MUST sum to exactly 1.00" }
      - { name: benchmark_map, type: object, source: input, description: "asset_class_code -> benchmark_code map used to validate FundScorecard benchmark inputs" }
      - { name: adopted_quarter_index, type: integer, source: system, default: null, description: "Plan.fiscal_quarter_index at adoption" }
      - { name: superseded_quarter_index, type: integer, source: system, default: null, description: "Plan.fiscal_quarter_index at supersession" }

  # ------------------------------------------------------------ AssetClassSlot
  - name: AssetClassSlot
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: ips_id, type: string, source: input, description: "FK -> InvestmentPolicyStatement.id; the IPS version that defined this slot (version pinning)" }
      - { name: asset_class_code, type: enum, source: input, description: "US_LARGE_CAP | US_SMALL_CAP | INTL_DEVELOPED | EMERGING_MKTS | CORE_BOND | TIPS | STABLE_VALUE | TARGET_DATE | REAL_ASSETS | SELF_DIRECTED", constraints: "unique per plan_id among slots with status != RETIRED" }
      - { name: designation, type: enum, source: input, description: "CORE | SPECIALTY | QDIA — at most one QDIA slot per plan among slots with status != RETIRED" }
      - { name: current_fund_id, type: string, source: system, default: null, description: "FK -> Fund.id; the fund currently seated in this slot" }
      - { name: status, type: enum, source: system, default: "EMPTY", description: "EMPTY | ACTIVE | AT_RISK | PENDING_REPLACEMENT | RETIRED" }
      - { name: at_risk_since_quarter_index, type: integer, source: system, default: null, description: "Plan.fiscal_quarter_index at which this slot entered AT_RISK" }
      - { name: status_before_last_review, type: enum, source: system, default: null, description: "EMPTY | ACTIVE | AT_RISK | PENDING_REPLACEMENT — snapshot written by review finalize before the cascade mutates status; read by review reopen to restore exactly" }
      - { name: slot_index, type: integer, source: input, description: "Deterministic menu ordering key; cascade iteration order for slot-level side effects", constraints: "unique per plan_id, >= 1" }

  # ------------------------------------------------------------------- Fund
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan whose candidate universe holds this fund" }
      - { name: ticker, type: string, source: input, description: "Fund ticker", constraints: "unique per plan_id among funds with menu_status != REMOVED" }
      - { name: fund_name, type: string, source: input, description: "Fund display name" }
      - { name: asset_class_code, type: enum, source: input, description: "Same enum as AssetClassSlot.asset_class_code; must match the slot it is seated in" }
      - { name: share_class_code, type: enum, source: input, description: "R1 | R3 | R6 | INSTITUTIONAL | ADMIN | INVESTOR" }
      - { name: gross_expense_ratio_bps, type: integer, source: input, description: "Gross expense ratio in basis points", constraints: "0..300" }
      - { name: net_expense_ratio_bps, type: integer, source: input, description: "Net expense ratio in basis points; must be <= gross_expense_ratio_bps", constraints: "0..300" }
      - { name: revenue_share_bps, type: integer, source: input, description: "12b-1 plus sub-TA revenue sharing paid to the plan in basis points", constraints: "0..100" }
      - { name: peer_median_expense_bps, type: integer, source: input, description: "Peer-group median expense ratio in basis points", constraints: "1..300" }
      - { name: track_record_quarters, type: integer, source: input, description: "Quarters of live track record", constraints: ">= 0" }
      - { name: manager_tenure_quarters, type: integer, source: input, description: "Quarters the current lead manager has run the strategy", constraints: ">= 0" }
      - { name: manager_change_flag, type: boolean, source: input, default: false, description: "true when a lead-manager change was announced in the current quarter" }
      - { name: style_drift_r2, type: number, source: input, description: "R-squared versus the mapped benchmark, 4 decimal places", constraints: "0.0000..1.0000" }
      - { name: plan_assets_cents, type: integer, source: input, description: "Plan assets invested in this fund; conserved across mapping execute/unwind", constraints: ">= 0" }
      - { name: menu_status, type: enum, source: system, default: "CANDIDATE", description: "CANDIDATE | ACTIVE | PENDING_REMOVAL | REMOVED — menu-membership dimension, evolves independently of watch_status" }
      - { name: watch_status, type: enum, source: system, default: "CLEAR", description: "CLEAR | WATCH | REMEDIATION | TERMINATION_PENDING — IPS surveillance dimension, evolves independently of menu_status" }
      - { name: watch_started_quarter_index, type: integer, source: system, default: null, description: "Plan.fiscal_quarter_index at which watch_status first left CLEAR in the current watch episode" }
      - { name: consecutive_breach_quarters, type: integer, source: computed, default: 0, description: "Consecutive FINALIZED reviews whose scorecard for this fund scored <= ips.watch_trigger_score_max; reset to 0 on a CLEAR recommendation" }
      - { name: latest_composite_score, type: number, source: computed, default: null, description: "composite_score of the SUBMITTED scorecard from the most recently FINALIZED review, 2 decimal places" }
      - { name: accrued_revenue_credit_cents, type: integer, source: computed, default: 0, description: "Cumulative revenue-sharing credit this fund has generated; never reduced once accrued" }
      - { name: credit_accrual_status, type: enum, source: computed, default: "NOT_ACCRUING", description: "NOT_ACCRUING | ACCRUING | CLOSED_OUT — NOT_ACCRUING while the fund is a CANDIDATE, ACCRUING once it is seated ACTIVE, CLOSED_OUT once menu_status becomes REMOVED" }
      - { name: levelized_credit_cents, type: integer, source: computed, default: 0, description: "Credit allocated to this fund by the most recent POSTED PRO_RATA FeeLevelizationRun" }
      - { name: watch_status_before_last_review, type: enum, source: system, default: null, description: "CLEAR | WATCH | REMEDIATION | TERMINATION_PENDING — snapshot written by review finalize before escalation; read by review reopen to restore exactly" }
      - { name: menu_status_before_last_review, type: enum, source: system, default: null, description: "CANDIDATE | ACTIVE | PENDING_REMOVAL | REMOVED — snapshot written by review finalize before the cascade mutates menu_status" }
      - { name: last_scored_quarter_index, type: integer, source: system, default: null, description: "quarter_index of the most recent FINALIZED review that scored this fund; reopen only reverts funds whose value equals the reopened review's quarter_index" }
      - { name: is_target_date_suite, type: boolean, source: input, default: false, description: "true when this row represents a target date suite rather than a single strategy" }
      - { name: glidepath_type, type: enum, source: input, default: null, description: "TO_RETIREMENT | THROUGH_RETIREMENT — required when is_target_date_suite is true" }
      - { name: construction, type: enum, source: input, default: null, description: "OFF_THE_SHELF | CUSTOM — required when is_target_date_suite is true" }
      - { name: equity_at_65_pct, type: number, source: input, default: null, description: "Equity allocation percentage at age 65, 2 decimal places; required when is_target_date_suite is true", constraints: "0.00..100.00" }
      - { name: landing_point_age, type: integer, source: input, default: null, description: "Age at which the glidepath reaches its terminal allocation; required when is_target_date_suite is true", constraints: "60..95" }
      - { name: glidepath_fit_score, type: number, source: computed, default: null, description: "Suite fit score, 2 decimal places; see calculations.glidepath_fit_score" }
      - { name: qdia_flag, type: boolean, source: computed, default: false, description: "true when this fund is seated in the plan's QDIA-designated slot" }

  # ---------------------------------------------------------- QuarterlyReview
  - name: QuarterlyReview
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: ips_id, type: string, source: system, description: "FK -> InvestmentPolicyStatement.id; IPS version pinned at open; criteria are read from this row for the whole review" }
      - { name: meeting_id, type: string, source: input, default: null, description: "FK -> CommitteeMeeting.id; the meeting at which this review is presented" }
      - { name: quarter_index, type: integer, source: input, description: "Fiscal quarter under review", constraints: "unique per plan_id among reviews with status != VOID" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SCORING | PENDING_MINUTES | FINALIZED | REOPENED | VOID" }
      - { name: scoring_variant, type: enum, source: system, description: "TRAILING_PERIOD | ROLLING_SINCE_WATCH — copied from the pinned IPS at open and immutable thereafter" }
      - { name: scorecard_count, type: integer, source: computed, default: 0, description: "count(FundScorecard where review_id == this.id and status != VOID)" }
      - { name: submitted_scorecard_count, type: integer, source: computed, default: 0, description: "count(FundScorecard where review_id == this.id and status == SUBMITTED)" }
      - { name: watch_additions_count, type: integer, source: computed, default: 0, description: "Funds moved out of CLEAR by this review's finalize cascade" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Number of times this review has been reopened" }
      - { name: finalized_quarter_index, type: integer, source: system, default: null, description: "Plan.fiscal_quarter_index at the most recent finalize" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent finalize" }

  # ------------------------------------------------------------- FundScorecard
  - name: FundScorecard
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> QuarterlyReview.id; the review this scorecard belongs to" }
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; the scored fund" }
      - { name: supersedes_scorecard_id, type: string, source: system, default: null, description: "FK -> FundScorecard.id; the prior SUBMITTED scorecard for the same (review_id, fund_id) that this row supersedes" }
      - { name: trailing_3y_return_bps, type: integer, source: input, description: "Annualised 3-year return in basis points" }
      - { name: trailing_5y_return_bps, type: integer, source: input, description: "Annualised 5-year return in basis points" }
      - { name: benchmark_3y_return_bps, type: integer, source: input, description: "Mapped benchmark 3-year return in basis points" }
      - { name: benchmark_5y_return_bps, type: integer, source: input, description: "Mapped benchmark 5-year return in basis points" }
      - { name: rolling_since_watch_return_bps, type: integer, source: input, default: null, description: "Annualised fund return since watch_started_quarter_index; required when the review's scoring_variant is ROLLING_SINCE_WATCH and the fund's watch_status != CLEAR" }
      - { name: rolling_since_watch_benchmark_bps, type: integer, source: input, default: null, description: "Annualised benchmark return over the same rolling window; required alongside rolling_since_watch_return_bps" }
      - { name: peer_rank_pct, type: integer, source: input, description: "Peer-group percentile rank where 1 is best and 100 is worst", constraints: "1..100" }
      - { name: style_drift_r2, type: number, source: input, description: "R-squared versus mapped benchmark for the quarter, 4 decimal places", constraints: "0.0000..1.0000" }
      - { name: net_expense_ratio_bps, type: integer, source: input, description: "Net expense ratio observed for the quarter in basis points" }
      - { name: peer_median_expense_bps, type: integer, source: input, description: "Peer median expense ratio for the quarter in basis points", constraints: ">= 1" }
      - { name: manager_tenure_quarters, type: integer, source: input, description: "Lead-manager tenure at quarter end" }
      - { name: manager_change_flag, type: boolean, source: input, default: false, description: "true when a lead-manager change occurred during the quarter" }
      - { name: performance_component, type: number, source: computed, description: "Performance subscore, 2 decimal places" }
      - { name: peer_component, type: number, source: computed, description: "Peer-rank subscore, 2 decimal places" }
      - { name: expense_component, type: number, source: computed, description: "Expense subscore, 2 decimal places" }
      - { name: style_component, type: number, source: computed, description: "Style-drift subscore, 2 decimal places" }
      - { name: manager_component, type: number, source: computed, description: "Manager-stability subscore, 2 decimal places" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite, 2 decimal places; see calculations.fund_composite_score" }
      - { name: watch_recommendation, type: enum, source: computed, description: "NONE | WATCH | REMEDIATION | TERMINATE — see calculations.watch_recommendation" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | SUPERSEDED | VOID" }

  # ---------------------------------------------------------- CommitteeMeeting
  - name: CommitteeMeeting
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: meeting_date, type: string, source: input, description: "Meeting date, ISO 8601 date (YYYY-MM-DD)", constraints: "unique per plan_id among meetings with status != VOID" }
      - { name: quarter_index, type: integer, source: input, description: "Fiscal quarter the meeting belongs to" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_SESSION | ADJOURNED | MINUTES_APPROVED | VOID" }
      - { name: attendee_member_ids, type: array, source: input, default: [], description: "CommitteeMember ids recorded present at convene; each must resolve to a member of a seat on this plan" }
      - { name: voting_attendee_count, type: integer, source: computed, default: 0, description: "Attendees that count toward quorum; see calculations.quorum_evaluation" }
      - { name: eligible_voting_seat_count, type: integer, source: computed, default: 0, description: "count(CommitteeSeat where plan_id == this.plan_id and voting == true and status == FILLED) evaluated at convene" }
      - { name: quorum_met, type: boolean, source: computed, default: false, description: "Snapshot quorum verdict recorded at convene and immutable thereafter" }
      - { name: charter_version_pinned, type: integer, source: system, default: null, description: "Plan.version observed at convene; approvals arising from this meeting re-validate against it" }
      - { name: minutes_doc_ref, type: string, source: input, default: null, description: "Minutes document reference recorded at minutes approval — the fiduciary-defense artifact" }
      - { name: minutes_approved_at, type: datetime, source: system, default: null, description: "Logical-clock instant of minutes approval" }
      - { name: carried_motion_count, type: integer, source: computed, default: 0, description: "count(Motion where meeting_id == this.id and status == CARRIED)" }

  # ------------------------------------------------------------------- Motion
  - name: Motion
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> CommitteeMeeting.id; the meeting in which the motion is moved" }
      - { name: subject_type, type: enum, source: input, description: "IPS_ADOPTION | FUND_REPLACEMENT | TARGET_DATE_SELECTION | FEE_LEVELIZATION | RFP_AWARD | WATCH_LIST_ACTION" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic reference resolved by subject_type: IPS_ADOPTION -> InvestmentPolicyStatement.id, FUND_REPLACEMENT -> FundReplacementProposal.id, TARGET_DATE_SELECTION -> Fund.id, FEE_LEVELIZATION -> FeeLevelizationRun.id, RFP_AWARD -> ServiceProviderEngagement.id, WATCH_LIST_ACTION -> Fund.id" }
      - { name: subject_provider_role, type: enum, source: computed, default: "NONE", description: "NONE | RECORDKEEPER | ADVISOR | AUDITOR | CUSTODIAN — for RFP_AWARD motions, the provider_role of the subject engagement; drives the recusal rule" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CARRIED | FAILED | TABLED | WITHDRAWN" }
      - { name: tally_basis, type: enum, source: input, default: "VOTES_CAST", description: "VOTES_CAST | ELIGIBLE_VOTERS — selects the tally denominator variant" }
      - { name: carried_threshold_pct, type: number, source: system, description: "Plan.voting_threshold_pct copied at motion open and immutable thereafter, 4 decimal places" }
      - { name: eligible_voter_count, type: integer, source: system, description: "CommitteeMeeting.voting_attendee_count copied at motion open" }
      - { name: votes, type: array, source: system, default: [], description: "Ordered vote log; each entry { member_id, vote (FOR | AGAINST | ABSTAIN | RECUSE), cast_at, recusal_basis }; at most one entry per member_id" }
      - { name: for_count, type: integer, source: computed, default: 0, description: "count(votes where vote == FOR)" }
      - { name: against_count, type: integer, source: computed, default: 0, description: "count(votes where vote == AGAINST)" }
      - { name: abstain_count, type: integer, source: computed, default: 0, description: "count(votes where vote == ABSTAIN)" }
      - { name: recuse_count, type: integer, source: computed, default: 0, description: "count(votes where vote == RECUSE)" }
      - { name: support_pct, type: number, source: computed, default: null, description: "Support fraction computed at close, 4 decimal places; see calculations.motion_tally" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which the motion left OPEN" }

  # ------------------------------------------------- FundReplacementProposal
  - name: FundReplacementProposal
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: slot_id, type: string, source: input, description: "FK -> AssetClassSlot.id; the menu slot whose occupant is being replaced" }
      - { name: outgoing_fund_id, type: string, source: input, description: "FK -> Fund.id; the fund currently seated in slot_id" }
      - { name: incoming_fund_id, type: string, source: input, description: "FK -> Fund.id; the candidate fund proposed to take the slot" }
      - { name: approving_motion_id, type: string, source: system, default: null, description: "FK -> Motion.id; the CARRIED FUND_REPLACEMENT motion authorising approval" }
      - { name: superseded_by_proposal_id, type: string, source: system, default: null, description: "FK -> FundReplacementProposal.id; the later proposal that superseded this one on the same slot" }
      - { name: rationale, type: string, source: input, description: "Committee rationale recorded for fiduciary defense", constraints: "10..500 chars" }
      - { name: mapping_strategy, type: enum, source: input, description: "DIRECT_MAP | MAP_TO_QDIA | REENROLLMENT" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | BLOCKED | APPROVED | NOTICE_ISSUED | EXECUTED | UNWOUND | WITHDRAWN | REJECTED" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Number of completed REVISION_REQUESTED -> DRAFT loops" }
      - { name: pre_block_status, type: enum, source: system, default: null, description: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED — snapshot written when a posture cascade forces BLOCKED; read to restore the exact prior status when the posture relaxes" }
      - { name: notice_lead_days_required, type: integer, source: computed, description: "Computed lead time in days; see calculations.notice_lead_days" }
      - { name: notice_delivered_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which the participant notice was issued" }
      - { name: blackout_start_at, type: datetime, source: input, default: null, description: "Inclusive start of the mapping blackout window (half-open interval start)" }
      - { name: blackout_end_at, type: datetime, source: input, default: null, description: "Exclusive end of the mapping blackout window (half-open interval end)" }
      - { name: mapped_assets_cents, type: integer, source: system, default: 0, description: "Outgoing fund assets snapshotted and moved at execute; restored verbatim at unwind" }
      - { name: pinned_plan_version, type: integer, source: system, description: "Plan.version observed by the creating client (the accepted expected_plan_version)" }
      - { name: pinned_ips_id, type: string, source: system, description: "FK -> InvestmentPolicyStatement.id; the ADOPTED IPS version at creation; approval re-validates that this is still the plan's ADOPTED IPS" }

  # -------------------------------------------------------- FeeLevelizationRun
  - name: FeeLevelizationRun
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: approving_motion_id, type: string, source: system, default: null, description: "FK -> Motion.id; the CARRIED FEE_LEVELIZATION motion authorising the posting" }
      - { name: quarter_index, type: integer, source: input, description: "Quarter whose accrued revenue sharing is being levelized", constraints: "unique per plan_id among runs with status != VOID" }
      - { name: method, type: enum, source: input, description: "PER_CAPITA | PRO_RATA — selects the allocation variant" }
      - { name: credit_pool_cents, type: integer, source: computed, description: "Pool snapshotted at creation; see calculations.levelized_fee_allocation" }
      - { name: pool_fund_ids, type: array, source: system, description: "Fund ids whose revenue sharing formed credit_pool_cents; the staleness basis for the fee-disclosure cascade" }
      - { name: per_account_cents, type: integer, source: computed, default: null, description: "PER_CAPITA only: floor(credit_pool_cents / Plan.participant_account_count)" }
      - { name: allocation_lines, type: array, source: computed, default: [], description: "PRO_RATA only: ordered entries { fund_id, basis_cents, allocated_cents } in allocation order" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "Sum of allocated amounts; debited from Plan.revenue_credit_balance_cents at post" }
      - { name: remainder_cents, type: integer, source: computed, default: 0, description: "credit_pool_cents - allocated_total_cents retained in the plan credit balance" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | APPROVED | RECALC_REQUIRED | POSTED | REVERSED | VOID" }
      - { name: posted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of posting" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of reversal" }

  # ------------------------------------------------ ServiceProviderEngagement
  - name: ServiceProviderEngagement
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; owning plan" }
      - { name: successor_engagement_id, type: string, source: system, default: null, description: "FK -> ServiceProviderEngagement.id; the engagement awarded to replace this one" }
      - { name: approving_motion_id, type: string, source: system, default: null, description: "FK -> Motion.id; the CARRIED RFP_AWARD motion that created this engagement" }
      - { name: provider_name, type: string, source: input, description: "Provider legal name" }
      - { name: provider_role, type: enum, source: input, description: "RECORDKEEPER | ADVISOR | AUDITOR | CUSTODIAN — at most one ACTIVE or UNDER_RFP engagement per (plan_id, provider_role)" }
      - { name: term_start_date, type: string, source: input, description: "Inclusive contract term start, ISO 8601 date" }
      - { name: term_end_date, type: string, source: input, description: "Inclusive contract term end, ISO 8601 date; must be >= term_start_date" }
      - { name: per_head_fee_cents, type: integer, source: input, description: "Annual per-participant hard-dollar fee in cents", constraints: ">= 0" }
      - { name: asset_based_bps, type: integer, source: input, description: "Annual asset-based fee in basis points", constraints: "0..200" }
      - { name: benchmark_percentile, type: integer, source: input, default: null, description: "Cost percentile versus peer plans where 100 is most expensive", constraints: "1..100" }
      - { name: last_benchmarked_quarter_index, type: integer, source: system, default: null, description: "Plan.fiscal_quarter_index of the most recent benchmarking" }
      - { name: last_rfp_quarter_index, type: integer, source: input, description: "Quarter index of the most recent completed RFP for this role; seeded at creation" }
      - { name: gross_cost_bps, type: integer, source: computed, default: null, description: "Total cost before revenue-credit offset; see calculations.total_provider_cost_bps" }
      - { name: fee_credit_tier, type: enum, source: computed, default: null, description: "TIER_A | TIER_B | TIER_C — selected from gross_cost_bps only, never re-selected from total_cost_bps" }
      - { name: total_cost_bps, type: integer, source: computed, default: null, description: "gross_cost_bps net of the tier credit offset; never negative" }
      - { name: rfp_required, type: boolean, source: computed, default: false, description: "Benchmarking verdict; see calculations.total_provider_cost_bps" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | UNDER_RFP | TERMINATED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # -------------------------------------------------------------------- Plan
  # Two independent dimensions on the Plan row:
  #   charter_status   : DRAFT -> ADOPTED -> SUPERSEDED -> ADOPTED (re-adoption cycle)
  #   menu_posture     : derived aggregate OPEN | RESTRICTED | FROZEN gating children
  - entity: Plan
    initial_state: DRAFT              # charter_status dimension
    terminal_states: []
    dimension: charter_status
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /governance/plans/{planId}/charter/adopt"
        actor: PlanSponsorAdmin
        preconditions:
          - "count(CommitteeSeat where plan_id == plan.id and voting == true and status != RETIRED) >= 2, else ERR_CHARTER_SEATS_INSUFFICIENT"
          - "count(CommitteeSeat where plan_id == plan.id and voting == true and status != RETIRED) <= max_voting_seats submitted in this request, else ERR_CHARTER_SEATS_INSUFFICIENT"
          - "quorum_min_voting_members <= max_voting_seats, else ERR_INVALID_REQUEST"
        side_effects:
          - "charter_status = ADOPTED; charter_adopted_quarter_index = fiscal_quarter_index"
          - "quorum_min_voting_members, voting_threshold_pct, max_voting_seats overwritten from the request body"
          - "menu_posture recomputed (calculations.menu_posture) — leaving FROZEN becomes possible once a charter exists AND an ADOPTED IPS exists"
          - "increments Plan.version by 1"

      - from: ADOPTED
        to: SUPERSEDED
        trigger: "POST /governance/plans/{planId}/charter/adopt (re-adoption of amended charter)"
        actor: PlanSponsorAdmin
        preconditions:
          - "No CommitteeMeeting on this plan with status == IN_SESSION, else ERR_MEETING_IN_SESSION"
        side_effects:
          - "Previous charter parameters archived: charter_status passes through SUPERSEDED and is immediately re-set to ADOPTED within the same request"
          - "Every Motion with status == OPEN on meetings of this plan -> TABLED (charter basis changed under them), ordered by Motion.created_at ASC"
          - "increments Plan.version by 1"
        note: "SUPERSEDED is a within-request pass-through state observable only in the audit trail; the response always shows ADOPTED."

      - from: SUPERSEDED
        to: ADOPTED
        trigger: "system (same request as the re-adoption above)"
        actor: system
        preconditions: []
        side_effects:
          - "charter_adopted_quarter_index = fiscal_quarter_index"

  - entity: Plan
    initial_state: FROZEN             # menu_posture dimension — a brand-new plan has no charter and no IPS
    terminal_states: []
    dimension: menu_posture
    transitions:
      - from: FROZEN
        to: OPEN
        trigger: "system (recompute after charter/adopt, IPS adopt, slot seat, review finalize, review reopen, proposal execute, member activate, advance-quarter, or POST /governance/plans/{planId}/menu-posture/recompute)"
        actor: system
        preconditions:
          - "charter_status == ADOPTED"
          - "exactly one InvestmentPolicyStatement with plan_id == plan.id and status == ADOPTED exists"
          - "count(CommitteeMember m JOIN CommitteeSeat s ON m.seat_id == s.id where s.plan_id == plan.id and s.voting == true and s.status == FILLED and m.status == ACTIVE) >= quorum_min_voting_members"
          - "at_risk_slot_ratio < 0.2500"
          - "fee_disclosure_status == COMPLIANT"
          - "No Fund on this plan with watch_status == TERMINATION_PENDING"
        side_effects: []

      - from: OPEN
        to: RESTRICTED
        trigger: "system (recompute, same trigger set as above)"
        actor: system
        preconditions:
          - "0.2500 <= at_risk_slot_ratio < 0.5000, OR at least one Fund on this plan has watch_status == TERMINATION_PENDING, OR fee_disclosure_status == RESTATEMENT_REQUIRED"
        side_effects:
          - "Every FundReplacementProposal on this plan with status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} whose incoming fund's asset_class_code equals the asset_class_code of any AssetClassSlot with status IN {AT_RISK, PENDING_REPLACEMENT} -> BLOCKED, iterated by AssetClassSlot.slot_index ASC then FundReplacementProposal.created_at ASC; pre_block_status snapshots the prior status"

      - from: RESTRICTED
        to: FROZEN
        trigger: "system (recompute, same trigger set as above)"
        actor: system
        preconditions:
          - "at_risk_slot_ratio >= 0.5000, OR charter_status != ADOPTED, OR no ADOPTED InvestmentPolicyStatement exists, OR active voting members < quorum_min_voting_members"
        side_effects:
          - "All menu-mutating endpoints reject with ERR_MENU_FROZEN (validations priority 44)"
          - "Every FundReplacementProposal on this plan with status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} -> BLOCKED with pre_block_status snapshotted"

      - from: RESTRICTED
        to: OPEN
        trigger: "system (recompute after review reopen, slot retire, proposal execute, or fee-levelization recompute)"
        actor: system
        preconditions:
          - "at_risk_slot_ratio < 0.2500 AND no Fund with watch_status == TERMINATION_PENDING AND fee_disclosure_status == COMPLIANT"
        side_effects:
          - "Every FundReplacementProposal with status == BLOCKED on this plan -> pre_block_status (exact restoration), iterated by created_at ASC; pre_block_status reset to null"

      - from: FROZEN
        to: RESTRICTED
        trigger: "system (recompute)"
        actor: system
        preconditions:
          - "charter_status == ADOPTED AND an ADOPTED IPS exists AND active voting members >= quorum_min_voting_members AND 0.2500 <= at_risk_slot_ratio < 0.5000"
        side_effects: []

      - from: OPEN
        to: FROZEN
        trigger: "system (recompute after member end-term or seat status change drops active voting members below quorum)"
        actor: system
        preconditions:
          - "charter_status != ADOPTED, OR no ADOPTED IPS, OR active voting members < quorum_min_voting_members, OR at_risk_slot_ratio >= 0.5000"
        side_effects:
          - "Every FundReplacementProposal with status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} -> BLOCKED with pre_block_status snapshotted"

  # ------------------------------------------------------------ CommitteeSeat
  - entity: CommitteeSeat
    initial_state: VACANT
    terminal_states: [RETIRED]
    transitions:
      - from: VACANT
        to: FILLED
        trigger: "POST /governance/committee-members"
        actor: PlanSponsorAdmin
        preconditions:
          - "seat.status == VACANT, else ERR_SEAT_NOT_VACANT"
          - "New appointment term [term_start_date, term_end_date] must not intersect any existing appointment on this seat with status IN {APPOINTED, TRAINING_ASSIGNED, ACCEPTANCE_PENDING, ACTIVE}; closed-interval arithmetic with adjacency forbidden (term_start_date must be >= prior.term_end_date + 1 day), else ERR_SEAT_TERM_OVERLAP"
          - "If seat.voting == true: count(CommitteeSeat where plan_id == seat.plan_id and voting == true and status == FILLED) + 1 <= Plan.max_voting_seats, else ERR_VOTING_SEATS_EXCEEDED"
        side_effects:
          - "seat.status = FILLED; consecutive_vacant_quarters = 0"
          - "New CommitteeMember created with status = APPOINTED"
          - "Plan.menu_posture recomputed"

      - from: FILLED
        to: VACANT
        trigger: "POST /governance/committee-members/{memberId}/end-term"
        actor: PlanSponsorAdmin
        preconditions:
          - "member.status IN {APPOINTED, TRAINING_ASSIGNED, ACCEPTANCE_PENDING, ACTIVE}"
        side_effects:
          - "seat.status = VACANT"
          - "Plan.documented_acceptance_count recomputed"
          - "Plan.menu_posture recomputed — may cascade OPEN -> FROZEN when active voting members drop below quorum_min_voting_members"

      - from: FILLED
        to: SUSPENDED
        trigger: "POST /governance/committee-seats/{seatId}/status with action == SUSPEND"
        actor: PlanSponsorAdmin
        preconditions:
          - "seat.status IN {VACANT, FILLED}, else ERR_INVALID_STATE_TRANSITION"
          - "No CommitteeMeeting on this plan with status == IN_SESSION, else ERR_MEETING_IN_SESSION"
        side_effects:
          - "Seat no longer counts toward eligible_voting_seat_count or quorum"
          - "Plan.menu_posture recomputed"

      - from: VACANT
        to: SUSPENDED
        trigger: "POST /governance/committee-seats/{seatId}/status with action == SUSPEND"
        actor: PlanSponsorAdmin
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: FILLED
        trigger: "POST /governance/committee-seats/{seatId}/status with action == REINSTATE"
        actor: PlanSponsorAdmin
        preconditions:
          - "An appointment on this seat with status IN {APPOINTED, TRAINING_ASSIGNED, ACCEPTANCE_PENDING, ACTIVE} exists"
        side_effects:
          - "Plan.menu_posture recomputed"

      - from: SUSPENDED
        to: VACANT
        trigger: "POST /governance/committee-seats/{seatId}/status with action == REINSTATE"
        actor: PlanSponsorAdmin
        preconditions:
          - "No appointment on this seat with status IN {APPOINTED, TRAINING_ASSIGNED, ACCEPTANCE_PENDING, ACTIVE}"
        side_effects: []

      - from: VACANT
        to: RETIRED
        trigger: "POST /governance/committee-seats/{seatId}/status with action == RETIRE"
        actor: PlanSponsorAdmin
        preconditions:
          - "seat.status IN {VACANT, SUSPENDED}, else ERR_SEAT_NOT_VACANT"
          - "count(CommitteeSeat where plan_id == seat.plan_id and voting == true and status != RETIRED) - (seat.voting ? 1 : 0) >= 2, else ERR_CHARTER_SEATS_INSUFFICIENT"
        side_effects:
          - "Plan.menu_posture recomputed"

      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /governance/committee-seats/{seatId}/status with action == RETIRE"
        actor: PlanSponsorAdmin
        preconditions:
          - "Same as VACANT -> RETIRED"
        side_effects:
          - "Plan.menu_posture recomputed"

  # ---------------------------------------------------------- CommitteeMember
  # Fork-join: APPOINTED -> {TRAINING_ASSIGNED, ACCEPTANCE_PENDING} -> ACTIVE.
  # The two branches carry DIFFERENT side-effect sets and either may run first;
  # ACTIVE requires both joins to have landed.
  - entity: CommitteeMember
    initial_state: APPOINTED
    terminal_states: [RESIGNED, REMOVED, TERM_EXPIRED]
    transitions:
      - from: APPOINTED
        to: TRAINING_ASSIGNED
        trigger: "POST /governance/training-records (first record for this member) — training branch"
        actor: PlanSponsorAdmin
        preconditions:
          - "member.status == APPOINTED, else no transition (record still created)"
        side_effects:
          - "FiduciaryTrainingRecord created with status = ASSIGNED, assigned_quarter_index = Plan.fiscal_quarter_index"
          - "member.fiduciary_training_status recomputed — stays PENDING until every required module has a CURRENT record"
          - "Branch-specific: NO change to Plan.documented_acceptance_count"

      - from: APPOINTED
        to: ACCEPTANCE_PENDING
        trigger: "POST /governance/committee-members/{memberId}/acceptance — acceptance branch"
        actor: CommitteeMember
        preconditions:
          - "X-User-ID == member.id (a member may only sign their own acceptance), else ERR_ACTOR_NOT_SELF"
          - "member.acceptance_signed_at IS NULL, else ERR_ACCEPTANCE_ALREADY_SIGNED"
        side_effects:
          - "acceptance_signed_at = logical clock now; acceptance_doc_ref stored"
          - "Branch-specific: Plan.documented_acceptance_count += 1"

      - from: TRAINING_ASSIGNED
        to: ACCEPTANCE_PENDING
        trigger: "POST /governance/committee-members/{memberId}/acceptance (acceptance branch joining after the training branch)"
        actor: CommitteeMember
        preconditions:
          - "X-User-ID == member.id, else ERR_ACTOR_NOT_SELF"
          - "member.acceptance_signed_at IS NULL, else ERR_ACCEPTANCE_ALREADY_SIGNED"
        side_effects:
          - "acceptance_signed_at stamped; Plan.documented_acceptance_count += 1"
          - "fiduciary_training_status retained (PENDING or CURRENT)"

      - from: ACCEPTANCE_PENDING
        to: ACTIVE
        trigger: "POST /governance/committee-members/{memberId}/activate (join point)"
        actor: PlanSponsorAdmin
        preconditions:
          - "member.acceptance_signed_at IS NOT NULL, else ERR_FIDUCIARY_ACCEPTANCE_MISSING"
          - "member.fiduciary_training_status == CURRENT — i.e. every module_code in {FIDUCIARY_DUTIES, IPS_MECHANICS} has a FiduciaryTrainingRecord with status IN {COMPLETED, WAIVED} that has not EXPIRED, else ERR_TRAINING_NOT_CURRENT"
          - "seat.status == FILLED, else ERR_SEAT_NOT_ACTIVE"
          - "Logical clock date within [term_start_date, term_end_date] inclusive, else ERR_TERM_NOT_IN_EFFECT"
        side_effects:
          - "member.status = ACTIVE — the member now counts toward quorum and may cast votes"
          - "Plan.menu_posture recomputed (FROZEN -> RESTRICTED/OPEN once active voting members reach quorum_min_voting_members)"

      - from: TRAINING_ASSIGNED
        to: ACTIVE
        trigger: "POST /governance/committee-members/{memberId}/activate"
        actor: PlanSponsorAdmin
        preconditions:
          - "Rejected unless acceptance_signed_at IS NOT NULL — a member in TRAINING_ASSIGNED has not signed acceptance, so this always returns ERR_FIDUCIARY_ACCEPTANCE_MISSING"
        side_effects: []
        note: "Declared explicitly so the fork-join has no silent path: the training branch alone can never reach ACTIVE."

      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /governance/committee-members/{memberId}/end-term with end_term_reason == RESIGNATION"
        actor: PlanSponsorAdmin
        preconditions:
          - "No Motion with status == OPEN on a meeting of this plan in which this member has already recorded a vote, else ERR_OPEN_MOTION_VOTE_LOCK"
        side_effects:
          - "seat.status = VACANT (cascade: CommitteeSeat FILLED -> VACANT)"
          - "member.votes_cast_count frozen; historical votes retained for fiduciary defense"
          - "Plan.documented_acceptance_count -= 1 when acceptance_signed_at was set"
          - "Plan.menu_posture recomputed"

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /governance/committee-members/{memberId}/end-term with end_term_reason == REMOVAL_FOR_CAUSE"
        actor: PlanSponsorAdmin
        preconditions:
          - "Same as ACTIVE -> RESIGNED"
        side_effects:
          - "Same as ACTIVE -> RESIGNED, plus all ASSIGNED FiduciaryTrainingRecord rows for this member -> EXPIRED"

      - from: APPOINTED
        to: REMOVED
        trigger: "POST /governance/committee-members/{memberId}/end-term with end_term_reason == REMOVAL_FOR_CAUSE"
        actor: PlanSponsorAdmin
        preconditions: []
        side_effects:
          - "seat.status = VACANT"

      - from: ACCEPTANCE_PENDING
        to: RESIGNED
        trigger: "POST /governance/committee-members/{memberId}/end-term with end_term_reason == RESIGNATION"
        actor: PlanSponsorAdmin
        preconditions: []
        side_effects:
          - "seat.status = VACANT; Plan.documented_acceptance_count -= 1"

      - from: ACTIVE
        to: TERM_EXPIRED
        trigger: "system (POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "Logical clock date > term_end_date at the moment advance-quarter runs"
        side_effects:
          - "end_term_reason = TERM_EXPIRY; seat.status = VACANT; seat.consecutive_vacant_quarters = 0 then incremented by the same run"
          - "Plan.menu_posture recomputed"

  # -------------------------------------------------- FiduciaryTrainingRecord
  - entity: FiduciaryTrainingRecord
    initial_state: ASSIGNED
    terminal_states: [EXPIRED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /governance/training-records/{recordId}/complete with outcome == COMPLETED"
        actor: CommitteeMember
        preconditions:
          - "X-User-ID == record.member_id, else ERR_ACTOR_NOT_SELF"
          - "score_pct IS NOT NULL and score_pct >= 80, else ERR_TRAINING_SCORE_INSUFFICIENT"
        side_effects:
          - "completed_quarter_index = Plan.fiscal_quarter_index"
          - "member.fiduciary_training_status recomputed (calculations.fiduciary_training_status)"

      - from: ASSIGNED
        to: WAIVED
        trigger: "POST /governance/training-records/{recordId}/complete with outcome == WAIVED"
        actor: PlanSponsorAdmin
        preconditions:
          - "waiver_basis IS NOT NULL and length >= 8, else ERR_INVALID_REQUEST"
          - "module_code != FIDUCIARY_DUTIES — the core duties module can never be waived, else ERR_MODULE_NOT_WAIVABLE"
        side_effects:
          - "completed_quarter_index = Plan.fiscal_quarter_index; score_pct remains null"
          - "member.fiduciary_training_status recomputed"

      - from: COMPLETED
        to: EXPIRED
        trigger: "system (POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "completed_quarter_index + validity_quarters <= Plan.fiscal_quarter_index after the increment"
        side_effects:
          - "member.fiduciary_training_status = EXPIRED"
          - "Cascade: every CommitteeMember whose fiduciary_training_status becomes EXPIRED and whose status == ACTIVE has its votes blocked (validations priority 50); Plan.menu_posture is NOT changed by expiry alone"

      - from: WAIVED
        to: EXPIRED
        trigger: "system (POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "completed_quarter_index + validity_quarters <= Plan.fiscal_quarter_index after the increment"
        side_effects:
          - "member.fiduciary_training_status = EXPIRED"

      - from: ASSIGNED
        to: EXPIRED
        trigger: "system (POST /governance/committee-members/{memberId}/end-term with end_term_reason == REMOVAL_FOR_CAUSE)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------- InvestmentPolicyStatement
  - entity: InvestmentPolicyStatement
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /governance/investment-policy-statements/{ipsId}/adopt"
        actor: CommitteeChair
        preconditions:
          - "Plan.charter_status == ADOPTED, else ERR_CHARTER_NOT_ADOPTED"
          - "Referenced Motion exists with subject_type == IPS_ADOPTION and subject_id == ips.id, else ERR_MOTION_SUBJECT_MISMATCH"
          - "Motion.status == CARRIED, else ERR_MOTION_NOT_CARRIED"
          - "Motion's meeting.status == MINUTES_APPROVED, else ERR_MINUTES_NOT_APPROVED"
          - "sum(weights.performance, weights.peer, weights.expense, weights.style, weights.manager) == 1.00 exactly, else ERR_IPS_WEIGHTS_INVALID"
          - "remediation_trigger_score_max < watch_trigger_score_max, else ERR_INVALID_REQUEST"
        side_effects:
          - "status = ADOPTED; adopted_quarter_index = Plan.fiscal_quarter_index; approving_motion_id stored"
          - "Any other InvestmentPolicyStatement on this plan with status == ADOPTED -> SUPERSEDED with superseded_quarter_index stamped"
          - "Every other InvestmentPolicyStatement on this plan with status == DRAFT -> RETIRED (ordered by created_at ASC)"
          - "Plan.menu_posture recomputed — FROZEN -> RESTRICTED/OPEN becomes possible"

      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system (adoption of a newer IPS version on the same plan)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_quarter_index = Plan.fiscal_quarter_index"
          - "QuarterlyReview rows already pinned to this ips_id keep using it (version pinning); new reviews pin the newly ADOPTED version"
          - "Every FundReplacementProposal with status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} whose pinned_ips_id == this ips.id must be revised before approval (validations priority 62: ERR_IPS_VERSION_STALE)"

      - from: DRAFT
        to: RETIRED
        trigger: "system (a sibling IPS version is adopted)"
        actor: system
        preconditions: []
        side_effects: []

  # ------------------------------------------------------------ AssetClassSlot
  - entity: AssetClassSlot
    initial_state: EMPTY
    terminal_states: [RETIRED]
    transitions:
      - from: EMPTY
        to: ACTIVE
        trigger: "POST /governance/asset-class-slots/{slotId}/seat-fund"
        actor: InvestmentConsultant
        preconditions:
          - "Plan.menu_posture != FROZEN, else ERR_MENU_FROZEN"
          - "slot.ips_id == the plan's currently ADOPTED InvestmentPolicyStatement.id, else ERR_IPS_VERSION_STALE"
          - "fund.plan_id == slot.plan_id, else ERR_CROSS_PLAN_REFERENCE"
          - "fund.asset_class_code == slot.asset_class_code, else ERR_ASSET_CLASS_MISMATCH"
          - "fund.menu_status == CANDIDATE, else ERR_FUND_NOT_CANDIDATE"
          - "Fund satisfies IPS selection criteria (calculations.ips_eligibility), else ERR_FUND_FAILS_IPS_CRITERIA"
          - "Plan.available_menu_slots >= 1, else ERR_MENU_CAPACITY_EXHAUSTED"
          - "If slot.designation == QDIA: fund.is_target_date_suite == true AND a CARRIED TARGET_DATE_SELECTION motion names this fund, else ERR_QDIA_REQUIRES_TARGET_DATE_SUITE"
        side_effects:
          - "slot.current_fund_id = fund.id; slot.status = ACTIVE"
          - "fund.menu_status CANDIDATE -> ACTIVE; fund.qdia_flag = (slot.designation == QDIA)"
          - "Plan.occupied_menu_slots += 1; Plan.available_menu_slots -= 1; Plan.total_plan_assets_cents recomputed"
          - "Plan.menu_posture recomputed"

      - from: ACTIVE
        to: AT_RISK
        trigger: "system (POST /governance/quarterly-reviews/{reviewId}/finalize cascade hop 2)"
        actor: system
        preconditions:
          - "The fund seated in this slot left watch_status CLEAR during hop 1 of the same finalize"
        side_effects:
          - "status_before_last_review = ACTIVE; at_risk_since_quarter_index = review.quarter_index"
          - "Plan.at_risk_slot_ratio recomputed, which drives the posture hop 3"

      - from: AT_RISK
        to: ACTIVE
        trigger: "system (finalize cascade when the seated fund's watch_recommendation cures it back to CLEAR, or POST /governance/quarterly-reviews/{reviewId}/reopen restoring status_before_last_review)"
        actor: system
        preconditions:
          - "Seated fund watch_status == CLEAR"
        side_effects:
          - "at_risk_since_quarter_index = null; Plan.at_risk_slot_ratio recomputed; Plan.menu_posture recomputed"

      - from: ACTIVE
        to: PENDING_REPLACEMENT
        trigger: "POST /governance/fund-replacements/{proposalId}/approve"
        actor: CommitteeChair
        preconditions:
          - "slot.status IN {ACTIVE, AT_RISK}, else ERR_SLOT_NOT_REPLACEABLE"
        side_effects:
          - "Plan.reserved_menu_slots += 1; Plan.available_menu_slots -= 1 (occupied unchanged) — the capacity invariant occupied + reserved + available == menu_slot_capacity holds"

      - from: AT_RISK
        to: PENDING_REPLACEMENT
        trigger: "POST /governance/fund-replacements/{proposalId}/approve"
        actor: CommitteeChair
        preconditions:
          - "slot.status IN {ACTIVE, AT_RISK}, else ERR_SLOT_NOT_REPLACEABLE"
        side_effects:
          - "Same as ACTIVE -> PENDING_REPLACEMENT"

      - from: PENDING_REPLACEMENT
        to: ACTIVE
        trigger: "POST /governance/fund-replacements/{proposalId}/execute, OR POST /governance/fund-replacements/{proposalId}/rescind-approval when the outgoing fund's watch_status == CLEAR"
        actor: Recordkeeper | CommitteeChair
        preconditions: []
        side_effects:
          - "On execute: current_fund_id = proposal.incoming_fund_id; Plan.reserved_menu_slots -= 1; Plan.available_menu_slots += 1"
          - "On rescind-approval: current_fund_id unchanged; Plan.reserved_menu_slots -= 1; Plan.available_menu_slots += 1 (exact restoration of the capacity triple)"

      - from: PENDING_REPLACEMENT
        to: AT_RISK
        trigger: "POST /governance/fund-replacements/{proposalId}/rescind-approval when the outgoing fund's watch_status != CLEAR"
        actor: CommitteeChair
        preconditions: []
        side_effects:
          - "Deterministic restoration rule: the slot returns to AT_RISK exactly when its seated fund's watch_status != CLEAR, otherwise to ACTIVE"
          - "Plan.reserved_menu_slots -= 1; Plan.available_menu_slots += 1"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /governance/asset-class-slots/{slotId}/retire"
        actor: PlanSponsorAdmin
        preconditions:
          - "slot.designation != QDIA, else ERR_QDIA_SLOT_REQUIRED"
          - "No FundReplacementProposal on this slot with status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, BLOCKED, APPROVED, NOTICE_ISSUED}, else ERR_SLOT_HAS_OPEN_PROPOSAL"
        side_effects:
          - "Seated fund (if any) menu_status ACTIVE -> PENDING_REMOVAL; slot.current_fund_id retained for audit"
          - "Plan.occupied_menu_slots -= 1; Plan.available_menu_slots += 1; Plan.at_risk_slot_ratio recomputed; Plan.menu_posture recomputed"

      - from: AT_RISK
        to: RETIRED
        trigger: "POST /governance/asset-class-slots/{slotId}/retire"
        actor: PlanSponsorAdmin
        preconditions:
          - "Same as ACTIVE -> RETIRED"
        side_effects:
          - "Same as ACTIVE -> RETIRED"

      - from: EMPTY
        to: RETIRED
        trigger: "POST /governance/asset-class-slots/{slotId}/retire"
        actor: PlanSponsorAdmin
        preconditions:
          - "slot.designation != QDIA, else ERR_QDIA_SLOT_REQUIRED"
        side_effects:
          - "Plan.at_risk_slot_ratio recomputed; Plan.menu_posture recomputed"

  # -------------------------------------------------- Fund (dimension 1 of 2)
  # menu_status and watch_status are INDEPENDENT dimensions on the same row:
  # a fund can be ACTIVE+REMEDIATION, CANDIDATE+CLEAR, PENDING_REMOVAL+WATCH,
  # etc. Neither dimension's transitions constrain the other's except where an
  # explicit precondition says so.
  - entity: Fund
    initial_state: CANDIDATE
    terminal_states: [REMOVED]
    dimension: menu_status
    transitions:
      - from: CANDIDATE
        to: ACTIVE
        trigger: "POST /governance/asset-class-slots/{slotId}/seat-fund OR POST /governance/funds/{fundId}/target-date-selection OR POST /governance/fund-replacements/{proposalId}/execute"
        actor: InvestmentConsultant | CommitteeChair | Recordkeeper
        preconditions:
          - "Fund satisfies IPS selection criteria at the moment of seating, else ERR_FUND_FAILS_IPS_CRITERIA"
        side_effects:
          - "credit_accrual_status = ACCRUING; qdia_flag set from the slot designation"

      - from: ACTIVE
        to: PENDING_REMOVAL
        trigger: "system (quarterly-review finalize cascade hop 1 when watch_recommendation == TERMINATE) OR POST /governance/asset-class-slots/{slotId}/retire"
        actor: system | PlanSponsorAdmin
        preconditions: []
        side_effects:
          - "menu_status_before_last_review snapshotted when driven by finalize"
          - "The fund continues to accrue revenue-sharing credit while PENDING_REMOVAL"

      - from: PENDING_REMOVAL
        to: REMOVED
        trigger: "POST /governance/fund-replacements/{proposalId}/execute (cascade hop 0)"
        actor: Recordkeeper
        preconditions:
          - "proposal.outgoing_fund_id == fund.id"
        side_effects:
          - "plan_assets_cents moved to the incoming fund in full (calculations.mapped_assets_transfer); this fund's plan_assets_cents = 0"
          - "hop 1: credit_accrual_status ACCRUING -> CLOSED_OUT; qdia_flag = false"
          - "hop 2 (caused by hop 1): every FeeLevelizationRun with plan_id == fund.plan_id, status == APPROVED, and fund.id IN pool_fund_ids -> RECALC_REQUIRED"
          - "hop 3 (caused by hop 2): Plan.fee_disclosure_status COMPLIANT -> RESTATEMENT_REQUIRED"
          - "hop 4 (caused by hop 3): every Motion with status == OPEN and subject_type == FEE_LEVELIZATION on this plan -> TABLED, ordered by Motion.created_at ASC"

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /governance/fund-replacements/{proposalId}/execute (cascade hop 0) when the outgoing fund was never marked PENDING_REMOVAL"
        actor: Recordkeeper
        preconditions:
          - "proposal.outgoing_fund_id == fund.id AND proposal.status == NOTICE_ISSUED"
        side_effects:
          - "Same hop 0 through hop 4 chain as PENDING_REMOVAL -> REMOVED"

      - from: REMOVED
        to: ACTIVE
        trigger: "POST /governance/fund-replacements/{proposalId}/unwind (compensating action)"
        actor: Recordkeeper
        preconditions:
          - "proposal.status == EXECUTED AND proposal.outgoing_fund_id == fund.id"
          - "Logical clock now < proposal.blackout_end_at, else ERR_UNWIND_WINDOW_CLOSED"
        side_effects:
          - "plan_assets_cents = proposal.mapped_assets_cents (restored verbatim); incoming fund plan_assets_cents -= proposal.mapped_assets_cents"
          - "credit_accrual_status CLOSED_OUT -> ACCRUING"
          - "Conservation invariant: sum over all Fund rows of plan_assets_cents is identical before execute and after unwind"

  # -------------------------------------------------- Fund (dimension 2 of 2)
  - entity: Fund
    initial_state: CLEAR
    terminal_states: []
    dimension: watch_status
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "system (POST /governance/quarterly-reviews/{reviewId}/finalize cascade hop 1)"
        actor: system
        preconditions:
          - "The fund's SUBMITTED scorecard in this review has watch_recommendation == WATCH"
        side_effects:
          - "watch_status_before_last_review = CLEAR; watch_started_quarter_index = review.quarter_index; last_scored_quarter_index = review.quarter_index"
          - "consecutive_breach_quarters += 1"
          - "hop 2 (caused by this change): the AssetClassSlot with current_fund_id == fund.id and status == ACTIVE -> AT_RISK"

      - from: WATCH
        to: REMEDIATION
        trigger: "system (finalize cascade hop 1)"
        actor: system
        preconditions:
          - "watch_recommendation IN {WATCH, REMEDIATION} on this review's scorecard AND consecutive_breach_quarters + 1 >= 2"
        side_effects:
          - "watch_status_before_last_review = WATCH; consecutive_breach_quarters += 1"
          - "hop 2: the seated slot stays AT_RISK (already AT_RISK); at_risk_since_quarter_index unchanged"

      - from: REMEDIATION
        to: TERMINATION_PENDING
        trigger: "system (finalize cascade hop 1)"
        actor: system
        preconditions:
          - "watch_recommendation == TERMINATE — i.e. consecutive_breach_quarters + 1 >= ips.watch_grace_quarters AND composite_score <= ips.watch_trigger_score_max"
        side_effects:
          - "watch_status_before_last_review = REMEDIATION; consecutive_breach_quarters += 1"
          - "menu_status ACTIVE -> PENDING_REMOVAL (menu dimension mutated by the watch dimension only in this one transition)"
          - "hop 3 (caused by the slot/posture recompute): Plan.menu_posture -> RESTRICTED at minimum, because a TERMINATION_PENDING fund exists"

      - from: WATCH
        to: CLEAR
        trigger: "system (finalize cascade hop 1 — cure)"
        actor: system
        preconditions:
          - "composite_score > ips.watch_trigger_score_max + ips.cure_margin_points"
        side_effects:
          - "watch_status_before_last_review = WATCH; watch_started_quarter_index = null; consecutive_breach_quarters = 0"
          - "hop 2: the seated slot AT_RISK -> ACTIVE"

      - from: REMEDIATION
        to: CLEAR
        trigger: "system (finalize cascade hop 1 — cure)"
        actor: system
        preconditions:
          - "composite_score > ips.watch_trigger_score_max + ips.cure_margin_points"
        side_effects:
          - "Same as WATCH -> CLEAR"

      - from: WATCH
        to: CLEAR
        trigger: "system (POST /governance/quarterly-reviews/{reviewId}/reopen — compensation)"
        actor: system
        preconditions:
          - "fund.last_scored_quarter_index == review.quarter_index"
        side_effects:
          - "watch_status = watch_status_before_last_review (exact restoration); consecutive_breach_quarters -= 1 with floor 0"
          - "menu_status = menu_status_before_last_review; slot.status = status_before_last_review"
          - "Plan.at_risk_slot_ratio and Plan.menu_posture recomputed; BLOCKED proposals restored to pre_block_status when the posture returns to OPEN"

      - from: TERMINATION_PENDING
        to: REMEDIATION
        trigger: "system (POST /governance/quarterly-reviews/{reviewId}/reopen — compensation)"
        actor: system
        preconditions:
          - "fund.last_scored_quarter_index == review.quarter_index"
        side_effects:
          - "Same exact-restoration rule as WATCH -> CLEAR on reopen"

  # ---------------------------------------------------------- QuarterlyReview
  # Cyclic: DRAFT -> SCORING -> PENDING_MINUTES -> FINALIZED -> REOPENED -> SCORING -> ...
  - entity: QuarterlyReview
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SCORING
        trigger: "system (first POST /governance/fund-scorecards for this review — auto transition)"
        actor: system
        preconditions:
          - "review.status IN {DRAFT, REOPENED}"
        side_effects:
          - "scorecard_count and submitted_scorecard_count recomputed"
          - "increments QuarterlyReview.version by 1"

      - from: REOPENED
        to: SCORING
        trigger: "system (next POST /governance/fund-scorecards after a reopen — auto transition, closes the cycle)"
        actor: system
        preconditions: []
        side_effects:
          - "increments QuarterlyReview.version by 1"

      - from: SCORING
        to: PENDING_MINUTES
        trigger: "POST /governance/quarterly-reviews/{reviewId}/present"
        actor: InvestmentConsultant
        preconditions:
          - "review.meeting_id IS NOT NULL, else ERR_REVIEW_MEETING_MISSING"
          - "The referenced CommitteeMeeting.status == IN_SESSION, else ERR_MEETING_NOT_IN_SESSION"
          - "meeting.quorum_met == true, else ERR_QUORUM_NOT_MET"
          - "Every AssetClassSlot on this plan with status IN {ACTIVE, AT_RISK, PENDING_REPLACEMENT} has a FundScorecard with status == SUBMITTED for its current_fund_id in this review, else ERR_SCORECARD_COVERAGE_INCOMPLETE"
          - "submitted_scorecard_count >= 1, else ERR_NO_SCORECARDS"
        side_effects:
          - "Review contents locked against new scorecards (validations priority 42)"

      - from: PENDING_MINUTES
        to: FINALIZED
        trigger: "POST /governance/quarterly-reviews/{reviewId}/finalize"
        actor: CommitteeChair
        preconditions:
          - "The referenced CommitteeMeeting.status == MINUTES_APPROVED, else ERR_MINUTES_NOT_APPROVED"
          - "review.ips_id == the plan's currently ADOPTED IPS id, else ERR_IPS_VERSION_STALE"
        side_effects:
          - "hop 0: status = FINALIZED; finalized_at = clock now; finalized_quarter_index = Plan.fiscal_quarter_index; for each SUBMITTED scorecard, Fund.latest_composite_score = scorecard.composite_score and Fund.last_scored_quarter_index = review.quarter_index"
          - "hop 1 (caused by hop 0's score write): each scored Fund's watch_status transitions per scorecard.watch_recommendation, iterated by AssetClassSlot.slot_index ASC for seated funds then Fund.created_at ASC for unseated funds; watch_additions_count counts funds that left CLEAR"
          - "hop 2 (caused by hop 1): each AssetClassSlot whose seated fund left CLEAR transitions ACTIVE -> AT_RISK (status_before_last_review snapshotted); slots whose fund cured go AT_RISK -> ACTIVE"
          - "hop 3 (caused by hop 2): Plan.at_risk_slot_ratio recomputed, driving Plan.menu_posture OPEN -> RESTRICTED at ratio >= 0.2500 and -> FROZEN at ratio >= 0.5000"
          - "hop 4 (caused by hop 3): every FundReplacementProposal in {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} matching the restricted asset classes -> BLOCKED with pre_block_status snapshotted"

      - from: FINALIZED
        to: REOPENED
        trigger: "POST /governance/quarterly-reviews/{reviewId}/reopen"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.fiscal_quarter_index - review.quarter_index <= 1, else ERR_QUARTER_CLOSED"
          - "reopen_count < 2, else ERR_REOPEN_LIMIT_REACHED"
          - "No FundReplacementProposal with status IN {APPROVED, NOTICE_ISSUED, EXECUTED} whose approving motion belongs to review.meeting_id, else ERR_REVIEW_DECISIONS_EXECUTED"
        side_effects:
          - "reopen_count += 1; finalized_at = null"
          - "Compensation cascade, exactly inverting the finalize cascade: every Fund with last_scored_quarter_index == review.quarter_index restores watch_status = watch_status_before_last_review and menu_status = menu_status_before_last_review, and consecutive_breach_quarters -= 1 (floor 0)"
          - "Each AssetClassSlot restores status = status_before_last_review"
          - "Plan.at_risk_slot_ratio and Plan.menu_posture recomputed; BLOCKED proposals restored to pre_block_status when the posture relaxes"
          - "Fund.latest_composite_score reverted to the composite_score from the most recent earlier FINALIZED review for that fund, or null when none exists"

      - from: DRAFT
        to: VOID
        trigger: "system (POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "review.quarter_index < Plan.fiscal_quarter_index - 1 after the increment AND review.status IN {DRAFT, SCORING}"
        side_effects:
          - "Every FundScorecard for this review -> VOID"

      - from: SCORING
        to: VOID
        trigger: "system (POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "Same as DRAFT -> VOID"
        side_effects:
          - "Every FundScorecard for this review -> VOID"

  # ------------------------------------------------------------- FundScorecard
  - entity: FundScorecard
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /governance/fund-scorecards (a later scorecard for the same review_id + fund_id)"
        actor: InvestmentConsultant
        preconditions:
          - "review.status IN {DRAFT, SCORING, REOPENED}, else ERR_REVIEW_NOT_SCORING"
        side_effects:
          - "The new row's supersedes_scorecard_id points at this row"
          - "submitted_scorecard_count unchanged (one SUBMITTED row per review_id + fund_id at all times)"

      - from: SUBMITTED
        to: VOID
        trigger: "system (owning QuarterlyReview transitions to VOID)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------- CommitteeMeeting
  - entity: CommitteeMeeting
    initial_state: SCHEDULED
    terminal_states: [MINUTES_APPROVED, VOID]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /governance/committee-meetings/{meetingId}/convene"
        actor: CommitteeChair
        preconditions:
          - "Plan.charter_status == ADOPTED, else ERR_CHARTER_NOT_ADOPTED"
          - "No other CommitteeMeeting on this plan with status == IN_SESSION, else ERR_MEETING_IN_SESSION"
          - "Every id in attendee_member_ids resolves to a CommitteeMember whose seat belongs to this plan, else ERR_RESOURCE_NOT_FOUND"
          - "The acting chair's X-User-ID appears in attendee_member_ids, else ERR_CHAIR_NOT_PRESENT"
        side_effects:
          - "eligible_voting_seat_count, voting_attendee_count and quorum_met computed and frozen (calculations.quorum_evaluation)"
          - "charter_version_pinned = Plan.version"
        note: "quorum_met == false does NOT block convening; it blocks presenting a review and carrying motions."

      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /governance/committee-meetings/{meetingId}/adjourn"
        actor: CommitteeChair
        preconditions:
          - "X-User-ID appears in attendee_member_ids, else ERR_CHAIR_NOT_PRESENT"
        side_effects:
          - "Every Motion on this meeting with status == OPEN -> WITHDRAWN, ordered by Motion.created_at ASC"
          - "For each such withdrawn FUND_REPLACEMENT motion, the subject proposal keeps its current status (no cascade)"

      - from: ADJOURNED
        to: MINUTES_APPROVED
        trigger: "POST /governance/committee-meetings/{meetingId}/minutes-approve"
        actor: CommitteeChair
        preconditions:
          - "minutes_doc_ref length >= 6, else ERR_INVALID_REQUEST"
          - "X-User-ID appears in attendee_member_ids AND that member's status == ACTIVE, else ERR_CHAIR_NOT_PRESENT"
          - "quorum_met == true, else ERR_QUORUM_NOT_MET"
        side_effects:
          - "minutes_approved_at = clock now; carried_motion_count frozen"
          - "Unlocks every downstream approval gated on ERR_MINUTES_NOT_APPROVED (IPS adopt, proposal approve, levelization approve, RFP award, review finalize)"

      - from: SCHEDULED
        to: VOID
        trigger: "system (POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "meeting.quarter_index < Plan.fiscal_quarter_index after the increment"
        side_effects:
          - "Any QuarterlyReview whose meeting_id points here has meeting_id reset to null"

  # ------------------------------------------------------------------- Motion
  - entity: Motion
    initial_state: OPEN
    terminal_states: [CARRIED, FAILED, TABLED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: CARRIED
        trigger: "POST /governance/motions/{motionId}/close"
        actor: CommitteeChair
        preconditions:
          - "meeting.status == IN_SESSION, else ERR_MEETING_NOT_IN_SESSION"
          - "meeting.quorum_met == true, else ERR_QUORUM_NOT_MET"
          - "Tally denominator > 0, else ERR_NO_ELIGIBLE_VOTERS"
          - "support_pct >= carried_threshold_pct (calculations.motion_tally)"
        side_effects:
          - "support_pct, for_count, against_count, abstain_count, recuse_count frozen; closed_at stamped"
          - "meeting.carried_motion_count += 1"

      - from: OPEN
        to: FAILED
        trigger: "POST /governance/motions/{motionId}/close"
        actor: CommitteeChair
        preconditions:
          - "meeting.status == IN_SESSION AND meeting.quorum_met == true AND denominator > 0"
          - "support_pct < carried_threshold_pct"
        side_effects:
          - "closed_at stamped"
          - "Cascade (depth 2): when subject_type == FUND_REPLACEMENT, the subject FundReplacementProposal transitions UNDER_REVIEW -> REJECTED; that rejection in turn releases nothing (no slot was reserved yet)"

      - from: OPEN
        to: TABLED
        trigger: "system (Plan charter re-adoption, OR the fee-disclosure cascade hop 4 on subject_type == FEE_LEVELIZATION)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at stamped; the motion can never be reopened — a new motion must be moved"

      - from: OPEN
        to: WITHDRAWN
        trigger: "system (POST /governance/committee-meetings/{meetingId}/adjourn with the motion still OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at stamped"

  # -------------------------------------------------- FundReplacementProposal
  # Non-linear: forward branches (REVISION_REQUESTED loop, BLOCKED detour with
  # exact-restore), a compensating reverse edge (EXECUTED -> UNWOUND), and two
  # distinct terminal rejections.
  - entity: FundReplacementProposal
    initial_state: DRAFT
    terminal_states: [EXECUTED, UNWOUND, WITHDRAWN, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /governance/fund-replacements/{proposalId}/submit"
        actor: InvestmentConsultant
        preconditions:
          - "Plan.menu_posture != FROZEN, else ERR_MENU_FROZEN"
          - "rationale length >= 40, else ERR_INVALID_REQUEST"
          - "incoming_fund.menu_status == CANDIDATE AND incoming_fund.asset_class_code == slot.asset_class_code, else ERR_ASSET_CLASS_MISMATCH"
          - "incoming_fund satisfies IPS selection criteria, else ERR_FUND_FAILS_IPS_CRITERIA"
          - "outgoing_fund_id == slot.current_fund_id, else ERR_OUTGOING_FUND_MISMATCH"
        side_effects:
          - "pinned_ips_id = the plan's currently ADOPTED IPS id; pinned_plan_version = Plan.version"
          - "notice_lead_days_required computed (calculations.notice_lead_days)"
          - "Plan.draft_proposal_count -= 1"

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /governance/fund-replacements/{proposalId}/request-revision"
        actor: CommitteeChair
        preconditions:
          - "revision_round < 3, else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "revision_round += 1"

      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /governance/fund-replacements/{proposalId}/revise"
        actor: InvestmentConsultant
        preconditions:
          - "Plan.menu_posture != FROZEN, else ERR_MENU_FROZEN"
          - "incoming_fund still satisfies IPS selection criteria against pinned_ips_id, else ERR_FUND_FAILS_IPS_CRITERIA"
        side_effects:
          - "notice_lead_days_required recomputed; pinned_plan_version refreshed to the current Plan.version"
        note: "Cycle: UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW, at most 3 laps."

      - from: DRAFT
        to: BLOCKED
        trigger: "system (quarterly-review finalize cascade hop 4)"
        actor: system
        preconditions:
          - "Plan.menu_posture became FROZEN or RESTRICTED in hop 3 AND (posture == FROZEN OR slot.status == AT_RISK)"
        side_effects:
          - "pre_block_status = DRAFT"

      - from: UNDER_REVIEW
        to: BLOCKED
        trigger: "system (quarterly-review finalize cascade hop 4)"
        actor: system
        preconditions:
          - "Same as DRAFT -> BLOCKED"
        side_effects:
          - "pre_block_status = UNDER_REVIEW"

      - from: REVISION_REQUESTED
        to: BLOCKED
        trigger: "system (quarterly-review finalize cascade hop 4)"
        actor: system
        preconditions:
          - "Same as DRAFT -> BLOCKED"
        side_effects:
          - "pre_block_status = REVISION_REQUESTED"

      - from: BLOCKED
        to: DRAFT
        trigger: "system (POST /governance/plans/{planId}/menu-posture/recompute or the reopen compensation, when the posture relaxes to OPEN)"
        actor: system
        preconditions:
          - "pre_block_status == DRAFT"
        side_effects:
          - "status = pre_block_status exactly; pre_block_status = null; revision_round untouched"

      - from: BLOCKED
        to: UNDER_REVIEW
        trigger: "system (menu-posture relaxation to OPEN)"
        actor: system
        preconditions:
          - "pre_block_status == UNDER_REVIEW"
        side_effects:
          - "status = pre_block_status exactly; pre_block_status = null"

      - from: BLOCKED
        to: REVISION_REQUESTED
        trigger: "system (menu-posture relaxation to OPEN)"
        actor: system
        preconditions:
          - "pre_block_status == REVISION_REQUESTED"
        side_effects:
          - "status = pre_block_status exactly; pre_block_status = null"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /governance/fund-replacements/{proposalId}/approve"
        actor: CommitteeChair
        preconditions:
          - "approving_motion_id references a Motion with status == CARRIED and subject_type == FUND_REPLACEMENT and subject_id == proposal.id, else ERR_MOTION_NOT_CARRIED"
          - "That motion's meeting.status == MINUTES_APPROVED, else ERR_MINUTES_NOT_APPROVED"
          - "pinned_ips_id == the plan's currently ADOPTED IPS id, else ERR_IPS_VERSION_STALE"
          - "Plan.available_menu_slots >= 1, else ERR_MENU_CAPACITY_EXHAUSTED"
          - "Plan.menu_posture != FROZEN, else ERR_MENU_FROZEN"
          - "No other FundReplacementProposal on the same slot_id with status IN {APPROVED, NOTICE_ISSUED}, else ERR_SLOT_HAS_OPEN_PROPOSAL"
        side_effects:
          - "slot.status -> PENDING_REPLACEMENT; Plan.reserved_menu_slots += 1; Plan.available_menu_slots -= 1"
          - "Every other FundReplacementProposal on the same slot_id with status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, BLOCKED} -> WITHDRAWN with superseded_by_proposal_id = this proposal id, ordered by created_at ASC"

      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /governance/fund-replacements/{proposalId}/rescind-approval"
        actor: CommitteeChair
        preconditions:
          - "notice_delivered_at IS NULL, else ERR_NOTICE_ALREADY_ISSUED"
        side_effects:
          - "Compensation: slot returns to ACTIVE when its seated fund watch_status == CLEAR, else AT_RISK; Plan.reserved_menu_slots -= 1; Plan.available_menu_slots += 1"
          - "approving_motion_id = null (the carried motion is spent and cannot be reused)"

      - from: APPROVED
        to: NOTICE_ISSUED
        trigger: "POST /governance/fund-replacements/{proposalId}/notice-issue"
        actor: Recordkeeper
        preconditions:
          - "Plan.fee_disclosure_status != RESTATEMENT_REQUIRED, else ERR_FEE_DISCLOSURE_RESTATEMENT_REQUIRED"
          - "blackout_start_at < blackout_end_at, else ERR_INVALID_REQUEST"
          - "No other FundReplacementProposal on this plan with status IN {NOTICE_ISSUED, EXECUTED} whose half-open blackout window [blackout_start_at, blackout_end_at) overlaps this one, else ERR_BLACKOUT_WINDOW_CONFLICT"
          - "blackout_start_at >= notice_delivered_at + notice_lead_days_required days, else ERR_NOTICE_PERIOD_NOT_ELAPSED"
        side_effects:
          - "notice_delivered_at = clock now; the blackout window is reserved for this plan"

      - from: NOTICE_ISSUED
        to: EXECUTED
        trigger: "POST /governance/fund-replacements/{proposalId}/execute"
        actor: Recordkeeper
        preconditions:
          - "Clock now >= notice_delivered_at + notice_lead_days_required days, else ERR_NOTICE_PERIOD_NOT_ELAPSED"
          - "Clock now >= blackout_start_at AND clock now < blackout_end_at, else ERR_BLACKOUT_WINDOW_CONFLICT"
          - "slot.status == PENDING_REPLACEMENT, else ERR_INVALID_STATE_TRANSITION"
          - "Plan.menu_posture != FROZEN, else ERR_MENU_FROZEN"
        side_effects:
          - "mapped_assets_cents = outgoing_fund.plan_assets_cents at this instant; assets moved to the incoming fund per mapping_strategy (calculations.mapped_assets_transfer)"
          - "Drives the depth-4 removal cascade documented on Fund menu_status PENDING_REMOVAL -> REMOVED (hops 1-4: credit close-out, levelization RECALC_REQUIRED, fee_disclosure_status RESTATEMENT_REQUIRED, OPEN fee motions TABLED)"
          - "slot.current_fund_id = incoming_fund_id; slot.status -> ACTIVE; Plan.reserved_menu_slots -= 1; Plan.available_menu_slots += 1"

      - from: EXECUTED
        to: UNWOUND
        trigger: "POST /governance/fund-replacements/{proposalId}/unwind"
        actor: PlanSponsorAdmin
        preconditions:
          - "Clock now < blackout_end_at, else ERR_UNWIND_WINDOW_CLOSED"
        side_effects:
          - "Compensating invariant: outgoing fund plan_assets_cents = mapped_assets_cents and incoming fund plan_assets_cents -= mapped_assets_cents, so the plan-wide asset total is bit-identical to the pre-execute total"
          - "outgoing fund menu_status REMOVED -> ACTIVE, credit_accrual_status CLOSED_OUT -> ACCRUING; incoming fund menu_status ACTIVE -> CANDIDATE"
          - "slot.current_fund_id = outgoing_fund_id; slot.status = ACTIVE"
          - "Plan.fee_disclosure_status RESTATEMENT_REQUIRED -> COMPLIANT only when no other EXECUTED proposal on this plan is still inside its blackout window; RECALC_REQUIRED levelization runs stay RECALC_REQUIRED (fee math must be re-derived by hand)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (the subject Motion closes FAILED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /governance/fund-replacements (a superseding create on the same slot_id) OR the approve-time supersede sweep"
        actor: InvestmentConsultant | system
        preconditions: []
        side_effects:
          - "superseded_by_proposal_id = the winning proposal id; Plan.draft_proposal_count -= 1"

  # -------------------------------------------------------- FeeLevelizationRun
  - entity: FeeLevelizationRun
    initial_state: DRAFT
    terminal_states: [REVERSED, VOID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /governance/fee-levelization-runs/{runId}/approve"
        actor: CommitteeChair
        preconditions:
          - "approving_motion_id references a CARRIED Motion with subject_type == FEE_LEVELIZATION and subject_id == run.id, else ERR_MOTION_NOT_CARRIED"
          - "That motion's meeting.status == MINUTES_APPROVED, else ERR_MINUTES_NOT_APPROVED"
          - "run.quarter_index == Plan.fiscal_quarter_index, else ERR_QUARTER_CLOSED"
          - "credit_pool_cents <= Plan.revenue_credit_balance_cents, else ERR_CREDIT_POOL_INSUFFICIENT"
          - "Every id in pool_fund_ids resolves to a Fund with plan_id == run.plan_id and credit_accrual_status == ACCRUING, else ERR_POOL_FUND_INELIGIBLE"
        side_effects:
          - "allocation_lines, per_account_cents, allocated_total_cents and remainder_cents frozen from calculations.levelized_fee_allocation"

      - from: APPROVED
        to: POSTED
        trigger: "POST /governance/fee-levelization-runs/{runId}/post"
        actor: Recordkeeper
        preconditions:
          - "Plan.fee_disclosure_status != RESTATEMENT_REQUIRED, else ERR_FEE_DISCLOSURE_RESTATEMENT_REQUIRED"
          - "allocated_total_cents + remainder_cents == credit_pool_cents, else ERR_ALLOCATION_NOT_BALANCED"
          - "credit_pool_cents <= Plan.revenue_credit_balance_cents re-checked at post time, else ERR_CREDIT_POOL_INSUFFICIENT"
        side_effects:
          - "Plan.revenue_credit_allocated_cents += allocated_total_cents; Plan.revenue_credit_balance_cents = accrued - allocated"
          - "Each pool Fund.levelized_credit_cents += its allocation line amount; each pool Fund.accrued_revenue_credit_cents -= that amount"
          - "posted_at = clock now"

      - from: APPROVED
        to: RECALC_REQUIRED
        trigger: "system (fund-removal cascade hop 2, or POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "A fund in pool_fund_ids reached menu_status REMOVED, or the plan's fiscal quarter advanced past run.quarter_index"
        side_effects:
          - "Ledger untouched — nothing was posted yet"

      - from: RECALC_REQUIRED
        to: DRAFT
        trigger: "POST /governance/fee-levelization-runs/{runId}/recompute"
        actor: InvestmentConsultant
        preconditions:
          - "run.quarter_index == Plan.fiscal_quarter_index, else ERR_QUARTER_CLOSED"
        side_effects:
          - "pool_fund_ids pruned to funds whose credit_accrual_status == ACCRUING; approving_motion_id = null (a fresh motion is required)"
          - "allocation_lines, per_account_cents, allocated_total_cents, remainder_cents recomputed"
        note: "Cycle: DRAFT -> APPROVED -> RECALC_REQUIRED -> DRAFT."

      - from: POSTED
        to: REVERSED
        trigger: "POST /governance/fee-levelization-runs/{runId}/reverse"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.fiscal_quarter_index - run.quarter_index <= 1, else ERR_QUARTER_CLOSED"
        side_effects:
          - "Compensating invariant: Plan.revenue_credit_allocated_cents -= allocated_total_cents and every pool Fund's levelized_credit_cents / accrued_revenue_credit_cents are restored to their pre-post values line by line, so accrued - allocated == balance still holds"
          - "reversed_at = clock now"

      - from: DRAFT
        to: VOID
        trigger: "system (POST /governance/plans/{planId}/advance-quarter)"
        actor: system
        preconditions:
          - "run.quarter_index < Plan.fiscal_quarter_index - 1 after the increment"
        side_effects: []

  # ------------------------------------------------ ServiceProviderEngagement
  - entity: ServiceProviderEngagement
    initial_state: PENDING
    terminal_states: [TERMINATED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /governance/service-provider-engagements/{engagementId}/benchmark"
        actor: InvestmentConsultant
        preconditions:
          - "term_start_date <= term_end_date, else ERR_INVALID_REQUEST"
          - "No other ServiceProviderEngagement on this plan with the same provider_role, status IN {PENDING, ACTIVE, UNDER_RFP}, and a term interval [term_start_date, term_end_date] overlapping this one, else ERR_ENGAGEMENT_TERM_OVERLAP"
        side_effects:
          - "gross_cost_bps, fee_credit_tier, total_cost_bps and rfp_required computed (calculations.total_provider_cost_bps)"
          - "last_benchmarked_quarter_index = Plan.fiscal_quarter_index"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /governance/service-provider-engagements/{engagementId}/benchmark (self-loop re-benchmark)"
        actor: InvestmentConsultant
        preconditions:
          - "Plan.fiscal_quarter_index > last_benchmarked_quarter_index, else ERR_BENCHMARK_ALREADY_CURRENT"
        side_effects:
          - "Cost figures and rfp_required recomputed; last_benchmarked_quarter_index = Plan.fiscal_quarter_index"

      - from: ACTIVE
        to: UNDER_RFP
        trigger: "system (a benchmark run that yields rfp_required == true)"
        actor: system
        preconditions:
          - "rfp_required == true"
        side_effects: []

      - from: UNDER_RFP
        to: SUPERSEDED
        trigger: "POST /governance/service-provider-engagements/{engagementId}/rfp-award"
        actor: PlanSponsorAdmin
        preconditions:
          - "approving_motion_id references a CARRIED Motion with subject_type == RFP_AWARD and subject_id == engagement.id, else ERR_MOTION_NOT_CARRIED"
          - "That motion's meeting.status == MINUTES_APPROVED, else ERR_MINUTES_NOT_APPROVED"
          - "No committee member with affiliated_provider_role == engagement.provider_role and status == ACTIVE voted FOR on that motion, else ERR_RECUSAL_REQUIRED"
          - "The successor engagement row exists, belongs to the same plan and provider_role, and has status == PENDING, else ERR_RESOURCE_NOT_FOUND"
        side_effects:
          - "successor_engagement_id = the awarded engagement id; successor transitions PENDING -> ACTIVE with last_rfp_quarter_index = Plan.fiscal_quarter_index"
          - "This row's term_end_date is clamped to the successor's term_start_date minus one day, preserving the no-overlap invariant"

      - from: UNDER_RFP
        to: ACTIVE
        trigger: "POST /governance/service-provider-engagements/{engagementId}/benchmark (incumbent retained after the RFP)"
        actor: InvestmentConsultant
        preconditions:
          - "rfp_required == false after recomputation"
        side_effects:
          - "last_rfp_quarter_index = Plan.fiscal_quarter_index; last_benchmarked_quarter_index = Plan.fiscal_quarter_index"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /governance/service-provider-engagements/{engagementId}/terminate"
        actor: PlanSponsorAdmin
        preconditions:
          - "provider_role != RECORDKEEPER OR another ServiceProviderEngagement on this plan with provider_role == RECORDKEEPER and status IN {PENDING, ACTIVE} exists, else ERR_RECORDKEEPER_REQUIRED"
          - "No FundReplacementProposal on this plan with status == NOTICE_ISSUED, else ERR_ENGAGEMENT_HAS_PENDING_MAPPING"
        side_effects:
          - "term_end_date clamped to the current logical date when it is later"

      - from: PENDING
        to: TERMINATED
        trigger: "POST /governance/service-provider-engagements/{engagementId}/terminate"
        actor: PlanSponsorAdmin
        preconditions:
          - "Same as ACTIVE -> TERMINATED"
        side_effects: []

concurrency_rules:
  - rule_id: proposal-create-stale-plan
    parent_entity: Plan
    child_entity: FundReplacementProposal
    write_endpoint: "POST /governance/fund-replacements"
    occ_field: expected_plan_version
    parent_version_field: "Plan.version"
    error_code: ERR_STALE_PLAN_VERSION
    http_status: 412
    description: >
      Creating a fund-replacement proposal is a create-with-supersede write: the new
      proposal both reads the plan's capacity triple (menu_slot_capacity, occupied,
      reserved, available), its menu_posture and its draft_proposal_count, and
      withdraws any prior DRAFT proposal on the same slot_id. The caller MUST pass
      expected_plan_version equal to the Plan.version it read. When
      expected_plan_version != Plan.version the request is rejected with 412 and
      ERR_STALE_PLAN_VERSION, and no proposal row and no withdrawal are written. On
      success the endpoint increments Plan.version by 1, so a second caller holding
      the same stale snapshot is rejected on its next attempt and must re-read the
      plan (which may now be FROZEN or capacity-exhausted) before retrying.
    validation_priority: 46

  - rule_id: scorecard-create-stale-review
    parent_entity: QuarterlyReview
    child_entity: FundScorecard
    write_endpoint: "POST /governance/fund-scorecards"
    occ_field: expected_review_version
    parent_version_field: "QuarterlyReview.version"
    error_code: ERR_STALE_REVIEW_VERSION
    http_status: 412
    description: >
      Submitting a fund scorecard supersedes the existing SUBMITTED scorecard for the
      same review_id + fund_id and recomputes the review's scorecard_count,
      submitted_scorecard_count and (on the first scorecard) its DRAFT -> SCORING or
      REOPENED -> SCORING auto transition. The caller MUST pass
      expected_review_version equal to the QuarterlyReview.version it read; a
      mismatch is rejected with 412 and ERR_STALE_REVIEW_VERSION with no scorecard
      written and no supersede applied. On success the endpoint increments
      QuarterlyReview.version by 1, so a consultant working from a snapshot taken
      before another consultant's submission must re-read the review — which may have
      moved to PENDING_MINUTES and now rejects new scorecards with
      ERR_REVIEW_NOT_SCORING at priority 42, ahead of the 412.
    validation_priority: 46

calculations:
  - calc_id: fund_composite_score
    name: "Fund composite score (dual-variant scorecard)"
    entity: FundScorecard
    pattern: weighted_scoring
    variant_selector: "InvestmentPolicyStatement.scoring_variant pinned on the owning QuarterlyReview.scoring_variant"
    inputs:
      - "scorecard.trailing_return_3y_bps, trailing_return_5y_bps, benchmark_return_3y_bps, benchmark_return_5y_bps"
      - "scorecard.rolling_since_watch_return_bps, rolling_since_watch_benchmark_bps"
      - "scorecard.peer_rank_pct (1.00 = best percentile, 100.00 = worst)"
      - "scorecard.net_expense_ratio_bps, peer_median_expense_bps"
      - "scorecard.style_drift_r2, ips.style_drift_r2_floor"
      - "scorecard.manager_tenure_quarters, manager_change_flag"
      - "ips.weights = {performance, peer_rank, expense, style, manager} — each 0.00..1.00, summing to exactly 1.00"
    formula: |
      STEP 1 — excess_bps (THE ONLY step that differs between variants):
        variant TRAILING_PERIOD:
          excess_bps = round_half_up(
              0.6 * (trailing_return_3y_bps - benchmark_return_3y_bps)
            + 0.4 * (trailing_return_5y_bps - benchmark_return_5y_bps), 0)
        variant ROLLING_SINCE_WATCH:
          requires fund.watch_started_quarter_index IS NOT NULL, else ERR_ROLLING_WINDOW_UNAVAILABLE
          excess_bps = rolling_since_watch_return_bps - rolling_since_watch_benchmark_bps
      STEP 2 — five component scores, each on 0.00..100.00:
        performance_component = clamp(50.00 + excess_bps / 10.0, 0.00, 100.00)
        peer_rank_component   = 100.00 - peer_rank_pct
        expense_component     = clamp(100.00 - max(0, net_expense_ratio_bps - peer_median_expense_bps) * 2.0, 0.00, 100.00)
        style_component       = 100.00 when style_drift_r2 >= ips.style_drift_r2_floor
                                else max(0.00, 100.00 - (ips.style_drift_r2_floor - style_drift_r2) * 500.0)
        manager_component     = min(40.00, manager_tenure_quarters * 2.0) when manager_change_flag == true
                                else min(100.00, 40.00 + manager_tenure_quarters * 3.0)
      STEP 3 — pinned rounding order: each component is rounded HALF_UP to 2 dp BEFORE weighting;
        the weighted sum is then rounded HALF_UP to 2 dp exactly once:
        composite_score = round_half_up(
              w.performance * performance_component
            + w.peer_rank   * peer_rank_component
            + w.expense     * expense_component
            + w.style       * style_component
            + w.manager     * manager_component, 2)
    variant_divergence: >
      The two variants share STEP 2 and STEP 3 verbatim and diverge only in how excess_bps
      is derived. TRAILING_PERIOD blends 3-year and 5-year excess at 60/40 and always
      applies. ROLLING_SINCE_WATCH ignores both trailing pairs and uses the single
      since-watch excess undiluted, which makes a recovering fund cure faster and a
      still-slipping fund terminate faster; it is only computable once the fund has a
      watch_started_quarter_index, so a CLEAR fund scored under this variant is a
      422 ERR_ROLLING_WINDOW_UNAVAILABLE rather than a silent fallback.
    boundary_notes:
      - "excess_bps == 0 gives performance_component exactly 50.00 (not 49.99, not 50.01)."
      - "net_expense_ratio_bps == peer_median_expense_bps gives expense_component exactly 100.00; every bp above median costs exactly 2.00 points."
      - "style_drift_r2 == floor is PASS (100.00); floor - 0.0001 gives 99.95."
      - "peer_rank_pct == 100.00 gives peer_rank_component exactly 0.00."
    determinism: "All arithmetic in decimal with 4 dp intermediates; no floating-point accumulation order dependence because the five weighted terms are summed in the fixed order performance, peer_rank, expense, style, manager."

  - calc_id: ips_eligibility
    name: "IPS selection-criteria gate for a candidate fund"
    entity: Fund
    pattern: multi_criteria_gate
    inputs:
      - "fund.track_record_quarters, ips.min_track_record_quarters"
      - "fund.net_expense_ratio_bps, fund.peer_median_expense_bps, ips.expense_peer_multiple"
      - "fund.style_drift_r2, ips.style_drift_r2_floor"
      - "fund.manager_change_flag, fund.manager_tenure_quarters"
    formula: |
      eligible = ALL of:
        (1) fund.track_record_quarters >= ips.min_track_record_quarters            [>= is inclusive]
        (2) fund.net_expense_ratio_bps <= floor(fund.peer_median_expense_bps * ips.expense_peer_multiple)
            -- the peer cap is FLOORED to whole bps before comparison, so with
               peer_median 40 and multiple 1.25 the cap is exactly 50 bps and 50 passes
        (3) fund.style_drift_r2 >= ips.style_drift_r2_floor                        [>= is inclusive]
        (4) fund.manager_change_flag == false OR fund.manager_tenure_quarters >= 4
      A false result raises 422 ERR_FUND_FAILS_IPS_CRITERIA naming the first failing
      criterion in the order (1), (2), (3), (4).
    boundary_notes:
      - "track_record_quarters == min_track_record_quarters passes; one less fails."
      - "The floor() on the expense cap is applied before, never after, the comparison."

  - calc_id: watch_recommendation
    name: "Watch-list trigger, escalation and cure decision"
    entity: FundScorecard
    pattern: threshold_ladder
    inputs:
      - "composite_score from calculations.fund_composite_score"
      - "ips.watch_trigger_score_max (default 40.00), ips.remediation_trigger_score_max (default 25.00), ips.cure_margin_points (default 10.00), ips.watch_grace_quarters (default 2)"
      - "fund.watch_status, fund.consecutive_breach_quarters"
      - "scorecard.manager_change_flag, scorecard.style_drift_r2, ips.style_drift_r2_floor"
    formula: |
      breach = (composite_score <= ips.watch_trigger_score_max)
               OR (style_drift_r2 < ips.style_drift_r2_floor)
               OR (manager_change_flag == true AND composite_score <= ips.watch_trigger_score_max + ips.cure_margin_points)
      Evaluate the ladder in this exact order and stop at the first match:
        (a) breach AND composite_score <= ips.remediation_trigger_score_max
              AND fund.consecutive_breach_quarters + 1 >= ips.watch_grace_quarters -> TERMINATE
        (b) breach AND composite_score <= ips.remediation_trigger_score_max        -> REMEDIATION
        (c) breach AND fund.watch_status IN {WATCH, REMEDIATION}
              AND fund.consecutive_breach_quarters + 1 >= ips.watch_grace_quarters -> REMEDIATION
        (d) breach                                                                  -> WATCH
        (e) NOT breach AND fund.watch_status IN {WATCH, REMEDIATION, TERMINATION_PENDING}
              AND composite_score > ips.watch_trigger_score_max + ips.cure_margin_points -> NONE (cure)
        (f) otherwise                                                               -> NONE (no change)
      Cure asymmetry: a fund enters WATCH at composite_score <= 40.00 but only leaves
      it at composite_score > 50.00 (40.00 + 10.00), so 40.01..50.00 keeps an existing
      WATCH fund on watch while never putting a CLEAR fund on watch.
    boundary_notes:
      - "composite_score == 40.00 is a breach (inclusive <=); 40.01 is not."
      - "composite_score == 25.00 is REMEDIATION-grade; 25.01 is WATCH-grade."
      - "composite_score == 50.00 does NOT cure a WATCH fund; 50.01 does."
      - "consecutive_breach_quarters + 1 uses the count INCLUDING the quarter being finalized."

  - calc_id: levelized_fee_allocation
    name: "Revenue-sharing credit levelization (combinatorial, pinned rounding order)"
    entity: FeeLevelizationRun
    pattern: allocation_with_remainder
    variant_selector: "FeeLevelizationRun.method"
    inputs:
      - "run.credit_pool_cents, run.pool_fund_ids"
      - "Plan.participant_account_count (N)"
      - "For each pool fund: fund.plan_assets_cents, fund.revenue_share_bps, fund.created_at"
      - "Plan.total_plan_assets_cents"
    formula: |
      PASS 1 — accrual floor (identical for both methods). For each pool fund, in
      fund.plan_assets_cents DESC, then fund.created_at ASC order:
        fund_accrual_cents = floor(fund.plan_assets_cents * fund.revenue_share_bps / 10000)
      eligible_pool_cents = min(run.credit_pool_cents, sum of fund_accrual_cents)
      PASS 2 — method-specific split of eligible_pool_cents:
        method PER_CAPITA:
          per_account_cents = floor(eligible_pool_cents / N)          [N == 0 -> ERR_NO_PARTICIPANT_ACCOUNTS]
          allocated_total_cents = per_account_cents * N
          remainder_cents = eligible_pool_cents - allocated_total_cents   [retained in the plan credit balance, never distributed]
          allocation_lines = one line per pool fund with
            amount_cents = floor(allocated_total_cents * fund_accrual_cents / sum_of_fund_accruals)
          any shortfall from those floors is added to remainder_cents
        method PRO_RATA:
          per_account_cents = null (not meaningful)
          For each pool fund: raw_i = eligible_pool_cents * fund.plan_assets_cents / Plan.total_plan_assets_cents
                              amount_cents = floor(raw_i)
          leftover = eligible_pool_cents - sum(amount_cents)
          WATERFALL: distribute leftover one cent at a time, iterating pool funds ordered by
            fund.plan_assets_cents DESC, then fund.created_at ASC, then fund.ticker ASC,
            wrapping around as many times as needed until leftover == 0
          allocated_total_cents = eligible_pool_cents; remainder_cents = 0
      PASS 3 — invariant check: allocated_total_cents + remainder_cents == eligible_pool_cents,
      else ERR_ALLOCATION_NOT_BALANCED.
    variant_divergence: >
      PER_CAPITA levels the credit per participant account and therefore leaves a
      deliberate un-distributed remainder (up to N-1 cents) parked in the plan balance;
      PRO_RATA levels by fund assets and distributes every cent through a
      largest-assets-first waterfall so remainder_cents is always exactly 0. The same
      pool can therefore produce two different allocated_total_cents values, and only
      PRO_RATA can hand a fund a cent it did not accrue.
    boundary_notes:
      - "floor() is applied at PASS 1 per fund BEFORE any pooling — never sum first and floor once."
      - "credit_pool_cents greater than the sum of accruals is silently capped by eligible_pool_cents; it is not an error."
      - "The waterfall order never falls back to id; ticker ASC is the final tie-break."
    determinism: "Sort keys are total and stable at every pass; no reliance on insertion order or on the server-minted id."

  - calc_id: glidepath_fit_score
    name: "Target-date suite glidepath fit (custom versus off-the-shelf)"
    entity: Fund
    pattern: penalty_scoring
    variant_selector: "Fund.glidepath_type (TO_RETIREMENT | THROUGH_RETIREMENT) combined with Fund.construction (CUSTOM | OFF_THE_SHELF)"
    inputs:
      - "fund.equity_at_65_pct, fund.landing_point_age, fund.net_expense_ratio_bps, fund.glidepath_type, fund.construction"
    formula: |
      Reference targets by glidepath_type:
        TO_RETIREMENT:      target_equity_at_65 = 35.0, target_landing_age = 65
        THROUGH_RETIREMENT: target_equity_at_65 = 50.0, target_landing_age = 80
      Cost allowance by construction:
        CUSTOM = 45 bps, OFF_THE_SHELF = 30 bps
      equity_gap  = abs(fund.equity_at_65_pct - target_equity_at_65)
      landing_gap = abs(fund.landing_point_age - target_landing_age)
      cost_penalty = max(0, fund.net_expense_ratio_bps - allowance) * 0.5
      glidepath_fit_score = max(0.00, round_half_up(
          100.00 - equity_gap * 1.5 - landing_gap * 2.0 - cost_penalty, 2))
    variant_divergence: >
      The four (glidepath_type x construction) combinations produce four different
      reference/allowance pairs from the same three fund inputs. A 45 bps CUSTOM
      THROUGH_RETIREMENT suite with 50.0% equity at 65 and a landing age of 80 scores a
      perfect 100.00, while that identical suite priced as OFF_THE_SHELF loses 7.50
      points of cost penalty, and the same 50.0% equity read against the
      TO_RETIREMENT reference loses a further 22.50 points of equity gap. Selection
      compares candidates only within the glidepath_type the committee moved.
    boundary_notes:
      - "net_expense_ratio_bps exactly equal to the allowance gives cost_penalty exactly 0.00."
      - "The max(0.00, ...) floor is applied AFTER rounding, so a raw -0.004 becomes 0.00 not -0.00."
    determinism: "Single rounding step; abs() before multiplication."

  - calc_id: target_date_suite_selection
    name: "QDIA target-date suite selection (deterministic selector)"
    entity: Fund
    pattern: candidate_selection
    inputs:
      - "All Fund rows on the plan with is_target_date_suite == true and menu_status == CANDIDATE"
      - "The glidepath_type named on the CARRIED TARGET_DATE_SELECTION motion"
      - "ips_eligibility, glidepath_fit_score"
    formula: |
      ELIGIBILITY FILTER — a candidate qualifies only when ALL hold:
        is_target_date_suite == true
        menu_status == CANDIDATE
        glidepath_type == the glidepath_type named on the motion
        calculations.ips_eligibility == true against the plan's ADOPTED IPS
        track_record_quarters >= 12
      RANKING — order the qualifying pool by:
        (1) glidepath_fit_score DESC
        (2) net_expense_ratio_bps ASC
        (3) track_record_quarters DESC
        (4) ticker ASC                     [total order; id is never consulted]
      The first row wins.
      EMPTY POOL — when no candidate qualifies the request fails with 422
      ERR_NO_ELIGIBLE_TARGET_DATE_SUITE and nothing is mutated; the QDIA slot keeps
      whatever fund it already had.
    boundary_notes:
      - "Two suites with identical fit and expense are separated by track record, then by ticker; the outcome never depends on creation order or on the server-minted id."

  - calc_id: total_provider_cost_bps
    name: "Service-provider total cost, fee-credit tier and RFP trigger (three pinned passes)"
    entity: ServiceProviderEngagement
    pattern: layered_derivation
    inputs:
      - "engagement.per_head_fee_cents, engagement.asset_based_bps, engagement.benchmark_percentile"
      - "engagement.last_rfp_quarter_index, Plan.fiscal_quarter_index"
      - "Plan.participant_account_count, Plan.total_plan_assets_cents, Plan.revenue_credit_balance_cents"
    formula: |
      PASS A — gross cost, in bps of plan assets:
        head_cost_cents = engagement.per_head_fee_cents * Plan.participant_account_count
        head_cost_bps   = round_half_up(head_cost_cents * 10000 / Plan.total_plan_assets_cents, 2)
                          [Plan.total_plan_assets_cents == 0 -> ERR_NO_PLAN_ASSETS]
        gross_cost_bps  = round_half_up(engagement.asset_based_bps + head_cost_bps, 2)
      PASS B — fee credit tier, derived from gross_cost_bps ONLY (never from total):
        gross_cost_bps <= 25.00 -> TIER_A, offset_bps = 0.00
        gross_cost_bps <= 45.00 -> TIER_B, offset_bps = 5.00
        otherwise               -> TIER_C, offset_bps = 12.00
        The offset is applied only when Plan.revenue_credit_balance_cents > 0; with a
        zero or negative balance the tier is still recorded but offset_bps is forced to 0.00.
      PASS C — total and RFP trigger:
        total_cost_bps = max(0.00, round_half_up(gross_cost_bps - offset_bps, 2))
        rfp_required = (engagement.benchmark_percentile >= 75.00)
                       OR (last_rfp_quarter_index IS NULL)
                       OR (Plan.fiscal_quarter_index - last_rfp_quarter_index >= 20)
                       OR (total_cost_bps > 60.00)
    variant_divergence: >
      Passes must run in the order A, B, C. Deriving the tier from total_cost_bps
      instead of gross_cost_bps would let a TIER_C engagement fall into TIER_B after its
      own offset was applied — a self-referential loop the pinned order forbids. The
      credit-balance gate means the identical engagement can be TIER_C with a 12.00 bps
      offset in one quarter and TIER_C with a 0.00 bps offset in the next, flipping
      rfp_required on the total_cost_bps > 60.00 arm without any fee change.
    boundary_notes:
      - "gross_cost_bps == 25.00 is TIER_A; 25.01 is TIER_B. gross_cost_bps == 45.00 is TIER_B; 45.01 is TIER_C."
      - "benchmark_percentile == 75.00 triggers an RFP (inclusive >=)."
      - "20 quarters is exactly 5 years; a gap of exactly 20 triggers, 19 does not."
      - "total_cost_bps == 60.00 does NOT trigger; 60.01 does."

  - calc_id: motion_tally
    name: "Motion tally (dual-variant denominator)"
    entity: Motion
    pattern: ratio_threshold
    variant_selector: "Motion.tally_basis"
    inputs:
      - "motion.votes[] with vote IN {FOR, AGAINST, ABSTAIN, RECUSE}"
      - "motion.eligible_voter_count (frozen when the motion was moved)"
      - "motion.carried_threshold_pct, meeting.quorum_met"
    formula: |
      for_count     = count(votes where vote == FOR)
      against_count = count(votes where vote == AGAINST)
      abstain_count = count(votes where vote == ABSTAIN)
      recuse_count  = count(votes where vote == RECUSE)
      variant VOTES_CAST:
        denominator = for_count + against_count + abstain_count      [RECUSE excluded entirely]
      variant ELIGIBLE_VOTERS:
        denominator = motion.eligible_voter_count - recuse_count     [recusals shrink the base]
      denominator <= 0 -> 422 ERR_NO_ELIGIBLE_VOTERS
      support_pct = round_half_up(for_count * 100.0 / denominator, 4)
      carried = (support_pct >= motion.carried_threshold_pct) AND meeting.quorum_met == true
    variant_divergence: >
      Under VOTES_CAST an absent voting member is invisible, so 2 FOR out of 3 cast is
      66.6667% and carries a 66.6667 threshold; under ELIGIBLE_VOTERS the same 2 FOR
      against 5 eligible non-recused seats is 40.0000% and fails. ABSTAIN is counted in
      the VOTES_CAST denominator (it dilutes support) but RECUSE never is, under either
      variant — a recusal is a removal from the body, an abstention is a cast vote.
    boundary_notes:
      - "support_pct is rounded to 4 dp BEFORE the >= comparison, so 66.66665 becomes 66.6667 and carries a 66.6667 threshold."
      - "support_pct exactly equal to carried_threshold_pct carries (inclusive >=)."
      - "A motion where every voter recused fails with ERR_NO_ELIGIBLE_VOTERS under both variants."

  - calc_id: quorum_evaluation
    name: "Meeting quorum determination"
    entity: CommitteeMeeting
    pattern: count_threshold
    inputs:
      - "meeting.attendee_member_ids"
      - "CommitteeMember rows and their CommitteeSeat rows"
      - "Plan.quorum_min_voting_members"
    formula: |
      eligible_voting_seat_count = count of CommitteeSeat rows on the plan where
        seat.status == FILLED AND seat.voting == true AND the seat's CommitteeMember
        has status == ACTIVE AND fiduciary_training_status == CURRENT
      voting_attendee_count = count of ids in attendee_member_ids whose member has
        status == ACTIVE, fiduciary_training_status == CURRENT and seat.voting == true
      quorum_met = (voting_attendee_count >= Plan.quorum_min_voting_members)
                   AND (voting_attendee_count * 2 > eligible_voting_seat_count)
      Both figures and quorum_met are frozen at convene time and are NOT recomputed if a
      member resigns mid-session.
    boundary_notes:
      - "The majority test is strict: 3 attendees of 6 eligible seats is NOT a majority (6 is not < 6); 4 of 6 is."
      - "A member whose training lapsed to EXPIRED counts toward neither figure, which can make quorum easier to reach by shrinking the eligible denominator — the quorum_min_voting_members floor prevents that from degenerating."

  - calc_id: menu_posture
    name: "Plan menu posture from at-risk slot ratio"
    entity: Plan
    pattern: ratio_ladder
    inputs:
      - "AssetClassSlot rows on the plan"
      - "Fund.watch_status for seated funds"
    formula: |
      denominator = count of slots with status IN {ACTIVE, AT_RISK, PENDING_REPLACEMENT}
      numerator   = count of those slots with status IN {AT_RISK, PENDING_REPLACEMENT}
      at_risk_slot_ratio = 0.0000 when denominator == 0, else round_half_up(numerator / denominator, 4)
      menu_posture, evaluated top down:
        Plan.charter_status != ADOPTED               -> FROZEN
        any seated Fund.watch_status == TERMINATION_PENDING and at_risk_slot_ratio >= 0.5000 -> FROZEN
        at_risk_slot_ratio >= 0.5000                 -> FROZEN
        at_risk_slot_ratio >= 0.2500                 -> RESTRICTED
        otherwise                                    -> OPEN
    boundary_notes:
      - "at_risk_slot_ratio == 0.2500 is RESTRICTED, 0.2499 is OPEN; 0.5000 is FROZEN, 0.4999 is RESTRICTED."
      - "With 4 counted slots, 1 at risk is exactly 0.2500 -> RESTRICTED; with 5 counted slots, 1 at risk is 0.2000 -> OPEN."
      - "A plan whose charter is not ADOPTED is FROZEN regardless of the ratio."

  - calc_id: notice_lead_days
    name: "Participant notice lead time for a mapping"
    entity: FundReplacementProposal
    pattern: additive_rule_stack
    inputs:
      - "Plan.notice_lead_days_required (base, default 30)"
      - "proposal.mapping_strategy, slot.designation, Plan.erisa_covered"
    formula: |
      lead = Plan.notice_lead_days_required
      lead += 30 when proposal.mapping_strategy == REENROLLMENT
      lead += 30 when slot.designation == QDIA AND Plan.erisa_covered == true
      lead += 15 when proposal.mapping_strategy == MAP_TO_QDIA AND slot.designation != QDIA
      notice_lead_days_required = lead
      The earliest legal execute instant is notice_delivered_at + lead days, compared
      with >= against the logical clock.
    boundary_notes:
      - "The additions stack: a REENROLLMENT into an ERISA QDIA slot is 30 + 30 + 30 = 90 days."
      - "Clock exactly at notice_delivered_at + lead days is legal (inclusive >=); one second earlier is ERR_NOTICE_PERIOD_NOT_ELAPSED."
      - "MAP_TO_QDIA and REENROLLMENT are mutually exclusive strategies, so the +15 and +30 REENROLLMENT arms never both apply."

  - calc_id: mapped_assets_transfer
    name: "Mapping asset conservation on execute and unwind"
    entity: FundReplacementProposal
    pattern: conservation_invariant
    inputs:
      - "outgoing_fund.plan_assets_cents, incoming_fund.plan_assets_cents, Plan.total_plan_assets_cents"
    formula: |
      ON EXECUTE:
        mapped_assets_cents = outgoing_fund.plan_assets_cents (captured, never recomputed later)
        DIRECT_MAP / MAP_TO_QDIA: incoming_fund.plan_assets_cents += mapped_assets_cents
        REENROLLMENT:             the QDIA fund of the plan receives mapped_assets_cents
                                  instead of incoming_fund (incoming_fund still becomes the seated fund)
        outgoing_fund.plan_assets_cents = 0
      ON UNWIND:
        the receiving fund's plan_assets_cents -= mapped_assets_cents
        outgoing_fund.plan_assets_cents = mapped_assets_cents
      INVARIANT (both directions): sum over all Fund rows of plan_assets_cents equals
      Plan.total_plan_assets_cents before and after, to the cent. No rounding occurs —
      the transfer is an exact integer move.
    boundary_notes:
      - "mapped_assets_cents == 0 is legal (an empty fund) and the invariant is trivially preserved."
      - "REENROLLMENT with no QDIA-designated slot on the plan fails with 422 ERR_QDIA_REQUIRES_TARGET_DATE_SUITE before anything moves."

  - calc_id: revenue_credit_ledger
    name: "Plan revenue-credit ledger invariant"
    entity: Plan
    pattern: conservation_invariant
    inputs:
      - "Plan.revenue_credit_accrued_cents, revenue_credit_allocated_cents, revenue_credit_balance_cents"
      - "Fund.accrued_revenue_credit_cents, Fund.levelized_credit_cents"
    formula: |
      revenue_credit_balance_cents = revenue_credit_accrued_cents - revenue_credit_allocated_cents
      This equality is re-asserted after every levelization post and reverse.
      POST:    allocated += run.allocated_total_cents; each pool fund moves its line
               amount from accrued_revenue_credit_cents into levelized_credit_cents
      REVERSE: allocated -= run.allocated_total_cents; each pool fund's two figures are
               restored line by line from run.allocation_lines
      A post that would drive revenue_credit_balance_cents below 0 is rejected at
      priority 82 with ERR_CREDIT_POOL_INSUFFICIENT before any field is written.
    boundary_notes:
      - "A post that lands the balance at exactly 0 is legal."
      - "Reversing a run twice is impossible: REVERSED is terminal."

  - calc_id: menu_slot_capacity
    name: "Menu slot capacity invariant"
    entity: Plan
    pattern: conservation_invariant
    inputs:
      - "Plan.menu_slot_capacity, occupied_menu_slots, reserved_menu_slots, available_menu_slots"
    formula: |
      occupied_menu_slots + reserved_menu_slots + available_menu_slots == menu_slot_capacity
      occupied = count of AssetClassSlot rows with status IN {ACTIVE, AT_RISK, PENDING_REPLACEMENT}
      reserved = count of FundReplacementProposal rows with status IN {APPROVED, NOTICE_ISSUED}
      Seating a fund moves one slot from available to occupied. Approving a proposal
      moves one from available to reserved. Executing or rescinding returns the reserved
      one to available. Retiring a slot returns an occupied one to available.
      A write that would push available_menu_slots below 0 is rejected at priority 80
      with ERR_MENU_CAPACITY_EXHAUSTED before any counter moves.
    boundary_notes:
      - "available_menu_slots == 0 blocks both seat-fund and approve; a rescind must free a slot first."
      - "Rescind-approval restores the triple to exactly its pre-approve values."

  - calc_id: fiduciary_training_status
    name: "Member fiduciary training currency"
    entity: CommitteeMember
    pattern: temporal_validity
    inputs:
      - "FiduciaryTrainingRecord rows for the member (module_code, status, completed_quarter_index, validity_quarters)"
      - "Plan.fiscal_quarter_index"
    formula: |
      A record is CURRENT when status IN {COMPLETED, WAIVED} AND
        Plan.fiscal_quarter_index - completed_quarter_index < record.validity_quarters
      Required module set: {FIDUCIARY_DUTIES, IPS_MECHANICS}
      fiduciary_training_status =
        CURRENT  when every required module has a CURRENT record
        EXPIRED  when every required module has a record but at least one is stale
                 (fiscal_quarter_index - completed_quarter_index >= validity_quarters)
        PENDING  otherwise (at least one required module has no COMPLETED/WAIVED record)
      FIDUCIARY_DUTIES can never be satisfied by a WAIVED record — a waiver on that
      module is rejected at 422 with ERR_MODULE_NOT_WAIVABLE, and a completion below the
      80.00 passing floor with ERR_TRAINING_SCORE_INSUFFICIENT.
    boundary_notes:
      - "A gap of exactly validity_quarters (8) is EXPIRED; 7 is still CURRENT."
      - "Training currency is recomputed on every advance-quarter, which can silently shrink a meeting's eligible_voting_seat_count for future meetings without touching already-convened ones."

validations:
  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty on every endpoint except POST /_clock/set_current_utc; X-User-Role must be one of the six roles in §1.7"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 20
    category: auth
    check: "X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 25
    category: auth
    check: "For the entity_backed roles CommitteeChair and CommitteeMember, X-User-ID must resolve to a CommitteeMember row whose seat belongs to the plan named or implied by the request. For CommitteeChair the resolved member's seat.seat_class must be CHAIR"
    error_id: ERR_ACTOR_NOT_COMMITTEE_MEMBER
    http_status: 403
    applies_to: "POST /governance/committee-meetings/{meetingId}/convene, /adjourn, /minutes-approve, POST /governance/motions/{motionId}/votes, /close, POST /governance/quarterly-reviews/{reviewId}/finalize, POST /governance/fund-replacements/{proposalId}/approve, /request-revision, /rescind-approval, POST /governance/fee-levelization-runs/{runId}/approve"

  - priority: 27
    category: auth
    check: "On POST /governance/motions/{motionId}/votes the vote's member_id must equal X-User-ID — no member may cast another member's vote, and the chair may not vote on behalf of an absentee"
    error_id: ERR_ACTOR_NOT_SELF
    http_status: 403
    applies_to: "POST /governance/motions/{motionId}/votes"

  - priority: 30
    category: existence
    check: "Every id in the path exists, validated left-to-right; then every id in the body (plan_id, seat_id, member_id, ips_id, slot_id, fund_id, review_id, meeting_id, motion_id, subject_id, outgoing_fund_id, incoming_fund_id, approving_motion_id, successor_engagement_id, supersedes_scorecard_id, pool_fund_ids[], attendee_member_ids[]) resolves to a live row, validated in that declared field order"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 35
    category: business_referential
    check: "Every referenced row must belong to the same Plan as the target of the write — slot.plan_id, fund.plan_id, review.plan_id, meeting.plan_id, run.plan_id and the seat behind a member_id must all resolve to one plan_id"
    error_id: ERR_CROSS_PLAN_REFERENCE
    http_status: 422
    applies_to: "all writes carrying two or more entity references"

  - priority: 38
    category: business_constraint
    check: "Request shape and field domains: enum values in range, non-negative money and bps integers, percentages within 0.00..100.00, decimal scale respected (2 dp for scores and percentages, 4 dp for style_drift_r2 and ratios), closed date intervals with start <= end, half-open blackout windows with start < end, IPS weights summing to exactly 1.00, rationale length >= 40 on submit, minutes_doc_ref length >= 6 on minutes-approve"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 42
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2. Specific state errors are raised in preference to the generic one when the situation matches: ERR_CHARTER_NOT_ADOPTED, ERR_MEETING_NOT_IN_SESSION, ERR_MEETING_IN_SESSION, ERR_REVIEW_NOT_SCORING, ERR_FUND_NOT_CANDIDATE, ERR_SLOT_NOT_REPLACEABLE, ERR_NOTICE_ALREADY_ISSUED; otherwise ERR_INVALID_STATE_TRANSITION"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 44
    category: business_safety
    check: "Plan.menu_posture must not be FROZEN for any menu-changing write (seat-fund, proposal submit/revise/approve/execute, target-date-selection, share-class-change). RESTRICTED blocks only writes touching an AT_RISK or PENDING_REPLACEMENT slot"
    error_id: ERR_MENU_FROZEN
    http_status: 409
    applies_to: "POST /governance/asset-class-slots/{slotId}/seat-fund, POST /governance/fund-replacements, /submit, /revise, /approve, /execute, POST /governance/funds/{fundId}/target-date-selection, /share-class-change"

  - priority: 46
    category: business_constraint
    check: "Optimistic concurrency: expected_plan_version must equal Plan.version on POST /governance/fund-replacements; expected_review_version must equal QuarterlyReview.version on POST /governance/fund-scorecards"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /governance/fund-replacements, POST /governance/fund-scorecards"
    note: "The review-scoped write raises ERR_STALE_REVIEW_VERSION at this same priority; both sit BELOW the state checks at 42, so a PENDING_MINUTES review rejects a stale scorecard with ERR_REVIEW_NOT_SCORING (409) rather than 412."

  - priority: 50
    category: business_safety
    check: "Every acting or voting CommitteeMember must have fiduciary_training_status == CURRENT and a non-null acceptance_signed_at. Applies to the chair convening or approving minutes, to each vote cast, and to the chair finalizing a review"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /governance/committee-meetings/{meetingId}/convene, /minutes-approve, POST /governance/motions/{motionId}/votes, POST /governance/quarterly-reviews/{reviewId}/finalize"

  - priority: 52
    category: business_safety
    check: "Conflict-of-interest recusal: a member whose affiliated_provider_role is non-null must vote RECUSE on any motion whose subject_type == RFP_AWARD and whose subject engagement has that same provider_role, and on any FEE_LEVELIZATION motion when independence_flag == false. A FOR, AGAINST or ABSTAIN vote from such a member is rejected, and rfp-award re-checks the closed tally"
    error_id: ERR_RECUSAL_REQUIRED
    http_status: 409
    applies_to: "POST /governance/motions/{motionId}/votes, POST /governance/service-provider-engagements/{engagementId}/rfp-award"

  - priority: 55
    category: business_safety
    check: "The candidate fund satisfies every IPS selection criterion (calculations.ips_eligibility) against the plan's ADOPTED IPS — or against proposal.pinned_ips_id on revise"
    error_id: ERR_FUND_FAILS_IPS_CRITERIA
    http_status: 422
    applies_to: "POST /governance/asset-class-slots/{slotId}/seat-fund, POST /governance/fund-replacements/{proposalId}/submit, /revise, POST /governance/funds/{fundId}/target-date-selection"

  - priority: 56
    category: business_referential
    check: "Asset-class and designation compatibility: the fund's asset_class_code equals the slot's asset_class_code; a QDIA slot accepts only a fund with is_target_date_suite == true"
    error_id: ERR_ASSET_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /governance/asset-class-slots/{slotId}/seat-fund, POST /governance/fund-replacements, /submit"

  - priority: 58
    category: business_safety
    check: "meeting.quorum_met == true (calculations.quorum_evaluation) before a motion may be closed, minutes approved, or a quarterly review presented"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /governance/motions/{motionId}/close, POST /governance/committee-meetings/{meetingId}/minutes-approve, POST /governance/quarterly-reviews/{reviewId}/present"

  - priority: 60
    category: business_referential
    check: "approving_motion_id references a Motion with status == CARRIED whose subject_type matches the target entity kind and whose subject_id equals the target row id"
    error_id: ERR_MOTION_NOT_CARRIED
    http_status: 409
    applies_to: "POST /governance/investment-policy-statements/{ipsId}/adopt, POST /governance/fund-replacements/{proposalId}/approve, POST /governance/fee-levelization-runs/{runId}/approve, POST /governance/service-provider-engagements/{engagementId}/rfp-award, POST /governance/funds/{fundId}/target-date-selection"

  - priority: 61
    category: business_safety
    check: "Fiduciary-defense documentation gate: the meeting behind the carried motion must have status == MINUTES_APPROVED before the decision it authorises may take effect"
    error_id: ERR_MINUTES_NOT_APPROVED
    http_status: 409
    applies_to: "POST /governance/investment-policy-statements/{ipsId}/adopt, POST /governance/fund-replacements/{proposalId}/approve, POST /governance/fee-levelization-runs/{runId}/approve, POST /governance/service-provider-engagements/{engagementId}/rfp-award, POST /governance/quarterly-reviews/{reviewId}/finalize"

  - priority: 62
    category: business_referential
    check: "The plan has exactly one InvestmentPolicyStatement with status == ADOPTED whenever an IPS-dependent write is attempted"
    error_id: ERR_NO_ADOPTED_IPS
    http_status: 409
    applies_to: "POST /governance/asset-class-slots, /seat-fund, POST /governance/quarterly-reviews, POST /governance/fund-replacements/{proposalId}/submit"

  - priority: 63
    category: business_referential
    check: "The pinned IPS id on the target row (review.ips_id, slot.ips_id, proposal.pinned_ips_id) still equals the plan's currently ADOPTED IPS id"
    error_id: ERR_IPS_VERSION_STALE
    http_status: 409
    applies_to: "POST /governance/quarterly-reviews/{reviewId}/finalize, POST /governance/fund-replacements/{proposalId}/approve, POST /governance/asset-class-slots/{slotId}/seat-fund"

  - priority: 65
    category: business_constraint
    check: "Uniqueness: (plan_id, seat_code) on CommitteeSeat; (plan_id, ticker) on Fund; (plan_id, asset_class_code, designation) on AssetClassSlot; (plan_id, quarter_index) on QuarterlyReview; (review_id, fund_id) among SUBMITTED FundScorecard rows; (member_id, module_code) among non-EXPIRED FiduciaryTrainingRecord rows; (plan_id, version_label) on InvestmentPolicyStatement; at most one QDIA-designated slot per plan"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "all create endpoints"

  - priority: 66
    category: business_constraint
    check: "A CommitteeSeat may hold at most one member whose term interval [term_start_date, term_end_date] is closed and non-overlapping with every other non-terminal member of that seat; adjacency is forbidden — a successor must start at least one day after the predecessor's term_end_date"
    error_id: ERR_SEAT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /governance/committee-members"

  - priority: 67
    category: business_constraint
    check: "A ServiceProviderEngagement's term interval [term_start_date, term_end_date] must not overlap another engagement on the same plan and provider_role whose status is in {PENDING, ACTIVE, UNDER_RFP}"
    error_id: ERR_ENGAGEMENT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /governance/service-provider-engagements, /benchmark"

  - priority: 70
    category: business_temporal
    check: "The participant notice period has fully elapsed: clock now >= notice_delivered_at + notice_lead_days_required days (calculations.notice_lead_days), and on notice-issue the requested blackout_start_at is no earlier than that instant"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /governance/fund-replacements/{proposalId}/notice-issue, /execute"

  - priority: 72
    category: business_temporal
    check: "Blackout windows are half-open [blackout_start_at, blackout_end_at) and must not overlap another NOTICE_ISSUED or EXECUTED proposal's window on the same plan; execute requires the clock to be inside the window; unwind requires the clock to still be inside it"
    error_id: ERR_BLACKOUT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /governance/fund-replacements/{proposalId}/notice-issue, /execute"

  - priority: 74
    category: business_temporal
    check: "Unwind is only legal while the clock is strictly before blackout_end_at"
    error_id: ERR_UNWIND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /governance/fund-replacements/{proposalId}/unwind"

  - priority: 75
    category: business_temporal
    check: "Quarter-window gates: a review may be reopened only while Plan.fiscal_quarter_index - review.quarter_index <= 1; a levelization run may be approved only in its own quarter and reversed only within one quarter of posting; a re-benchmark requires Plan.fiscal_quarter_index > last_benchmarked_quarter_index"
    error_id: ERR_QUARTER_CLOSED
    http_status: 409
    applies_to: "POST /governance/quarterly-reviews/{reviewId}/reopen, POST /governance/fee-levelization-runs/{runId}/approve, /recompute, /reverse"

  - priority: 76
    category: business_constraint
    check: "A review may be reopened at most twice (reopen_count < 2, ERR_REOPEN_LIMIT_REACHED) and never once any decision authorised at its meeting has reached APPROVED, NOTICE_ISSUED or EXECUTED (ERR_REVIEW_DECISIONS_EXECUTED); a proposal may cycle through revision at most three times (revision_round < 3, ERR_REVISION_LIMIT_REACHED)"
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /governance/quarterly-reviews/{reviewId}/reopen, POST /governance/fund-replacements/{proposalId}/request-revision"

  - priority: 78
    category: business_referential
    check: "Scorecard coverage: every AssetClassSlot with status IN {ACTIVE, AT_RISK, PENDING_REPLACEMENT} has a SUBMITTED FundScorecard for its current_fund_id in this review; at least one scorecard exists at all"
    error_id: ERR_SCORECARD_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /governance/quarterly-reviews/{reviewId}/present"

  - priority: 79
    category: business_constraint
    check: "A ROLLING_SINCE_WATCH scorecard requires the fund to have a non-null watch_started_quarter_index and both rolling_since_watch fields populated"
    error_id: ERR_ROLLING_WINDOW_UNAVAILABLE
    http_status: 422
    applies_to: "POST /governance/fund-scorecards"

  - priority: 80
    category: business_fiscal
    check: "Menu capacity: Plan.available_menu_slots >= 1 before a seat-fund or a proposal approval reserves a slot; the invariant occupied + reserved + available == menu_slot_capacity must hold after the write"
    error_id: ERR_MENU_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /governance/asset-class-slots/{slotId}/seat-fund, POST /governance/fund-replacements/{proposalId}/approve"

  - priority: 82
    category: business_fiscal
    check: "Credit pool solvency: run.credit_pool_cents <= Plan.revenue_credit_balance_cents at approve time and re-checked at post time; every pool fund must have credit_accrual_status == ACCRUING"
    error_id: ERR_CREDIT_POOL_INSUFFICIENT
    http_status: 409
    applies_to: "POST /governance/fee-levelization-runs/{runId}/approve, /post"

  - priority: 83
    category: business_fiscal
    check: "Allocation balance: allocated_total_cents + remainder_cents == the eligible pool, and every allocation line amount is non-negative"
    error_id: ERR_ALLOCATION_NOT_BALANCED
    http_status: 422
    applies_to: "POST /governance/fee-levelization-runs/{runId}/post"

  - priority: 84
    category: business_fiscal
    check: "Fee-disclosure integrity: Plan.fee_disclosure_status must not be RESTATEMENT_REQUIRED when issuing a participant notice or posting a levelization run"
    error_id: ERR_FEE_DISCLOSURE_RESTATEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /governance/fund-replacements/{proposalId}/notice-issue, POST /governance/fee-levelization-runs/{runId}/post"

  - priority: 85
    category: business_constraint
    check: "Share-class eligibility: a share-class change may only move to a class whose net_expense_ratio_bps is strictly lower and whose revenue_share_bps is less than or equal to the current class, and the fund must not be inside an APPROVED or NOTICE_ISSUED replacement proposal"
    error_id: ERR_SHARE_CLASS_INELIGIBLE
    http_status: 422
    applies_to: "POST /governance/funds/{fundId}/share-class-change"

  - priority: 86
    category: business_constraint
    check: "Training-module rules: FIDUCIARY_DUTIES may never be waived (ERR_MODULE_NOT_WAIVABLE); a COMPLETED record requires score_pct >= 80.00, else ERR_TRAINING_SCORE_INSUFFICIENT; a WAIVED record requires a waiver_basis of at least 12 characters"
    error_id: ERR_MODULE_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /governance/training-records, POST /governance/training-records/{recordId}/complete"

  - priority: 87
    category: business_safety
    check: "Fiduciary acceptance: a member cannot be activated without acceptance_signed_at and acceptance_doc_ref, regardless of training completion"
    error_id: ERR_FIDUCIARY_ACCEPTANCE_MISSING
    http_status: 409
    applies_to: "POST /governance/committee-members/{memberId}/activate"

  - priority: 88
    category: business_constraint
    check: "Structural minimums: a plan must retain at least one QDIA-designated slot and at least one PENDING or ACTIVE RECORDKEEPER engagement; a QDIA slot may not be retired and a sole recordkeeper may not be terminated"
    error_id: ERR_QDIA_SLOT_REQUIRED
    http_status: 409
    applies_to: "POST /governance/asset-class-slots/{slotId}/retire, POST /governance/service-provider-engagements/{engagementId}/terminate"

  - priority: 89
    category: business_referential
    check: "Open-work guards: a slot with an open proposal may not be retired; an engagement may not be terminated while a NOTICE_ISSUED mapping is outstanding; a seat may not be retired while it holds a non-terminal member"
    error_id: ERR_SLOT_HAS_OPEN_PROPOSAL
    http_status: 409
    applies_to: "POST /governance/asset-class-slots/{slotId}/retire, POST /governance/committee-seats/{seatId}/status, POST /governance/service-provider-engagements/{engagementId}/terminate"

  - priority: 90
    category: business_fiscal
    check: "Divisor sanity for the derived fee and cost math: Plan.participant_account_count > 0 before a PER_CAPITA levelization, Plan.total_plan_assets_cents > 0 before a provider benchmark, and a non-empty non-recused voting base before a motion tally"
    error_id: ERR_NO_PARTICIPANT_ACCOUNTS
    http_status: 422
    applies_to: "POST /governance/fee-levelization-runs, /approve, POST /governance/service-provider-engagements/{engagementId}/benchmark, POST /governance/motions/{motionId}/close"

endpoints:
  # ------------------------------------------------------- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, used by every notice-period, blackout-window and validity-window rule. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server never falls back to real wall-clock time. Time may be moved forward or backward."
    roles: [PlanSponsorAdmin, Recordkeeper, PlanAuditor]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "All temporal comparisons (notice lead time, blackout windows, unwind window, term intervals) read the new instant"
      - "No entity field is recomputed; fiduciary training currency is quarter-indexed and unaffected"

  # ------------------------------------------------------------------ Plan
  - method: POST
    path: "/governance/plans"
    description: "Register a retirement plan and its committee charter parameters in DRAFT charter status with a FROZEN menu posture"
    roles: [PlanSponsorAdmin]
    code: 201
    input: [plan_name, plan_sponsor_name, erisa_covered, participant_account_count, menu_slot_capacity, quorum_min_voting_members, voting_threshold_pct, max_voting_seats, "notice_lead_days_required?", "blackout_buffer_days?", "fiscal_quarter_index?"]
    output: Plan
    side_effects:
      - "charter_status = DRAFT; menu_posture = FROZEN; fee_disclosure_status = COMPLIANT"
      - "occupied_menu_slots = 0; reserved_menu_slots = 0; available_menu_slots = menu_slot_capacity"
      - "revenue_credit_accrued_cents = 0; revenue_credit_allocated_cents = 0; revenue_credit_balance_cents = 0"
      - "fiscal_quarter_index defaults to 0 (the epoch quarter of this plan's governance calendar)"

  - method: GET
    path: "/governance/plans"
    description: "List plans, optionally filtered by charter status or menu posture"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: ["charter_status?", "menu_posture?", "limit?", "offset?"]
    output: Plan[]
    side_effects: []

  - method: GET
    path: "/governance/plans/{planId}"
    description: "Read one plan with its charter parameters, capacity triple, credit ledger and derived menu posture"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: POST
    path: "/governance/plans/{planId}/charter/adopt"
    description: "Adopt or re-adopt the committee charter. Re-adoption supersedes the prior charter, tables every OPEN motion and re-freezes the menu until the posture is recomputed"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [quorum_min_voting_members, voting_threshold_pct, max_voting_seats, charter_doc_ref]
    output: Plan
    side_effects:
      - "charter_status DRAFT -> ADOPTED, or ADOPTED -> SUPERSEDED -> ADOPTED on re-adoption"
      - "Every Motion on this plan with status == OPEN -> TABLED, ordered by Motion.created_at ASC"
      - "menu_posture recomputed (calculations.menu_posture); a DRAFT charter forces FROZEN"
      - "increments Plan.version by 1"

  - method: POST
    path: "/governance/plans/{planId}/advance-quarter"
    description: "Advance the plan's fiscal quarter index by one, expiring stale training, voiding abandoned reviews, meetings and levelization runs, and marking approved runs for recalculation"
    roles: [PlanSponsorAdmin]
    code: 200
    input: []
    output: Plan
    side_effects:
      - "fiscal_quarter_index += 1"
      - "Every FiduciaryTrainingRecord whose completed_quarter_index is now at least validity_quarters old -> EXPIRED; each affected CommitteeMember.fiduciary_training_status recomputed (calculations.fiduciary_training_status)"
      - "Every SCHEDULED CommitteeMeeting from a prior quarter -> VOID, and any QuarterlyReview pointing at it has meeting_id reset to null"
      - "Every QuarterlyReview in {DRAFT, SCORING} older than one quarter -> VOID, and each of its SUBMITTED scorecards -> VOID"
      - "Every APPROVED FeeLevelizationRun from a prior quarter -> RECALC_REQUIRED; every DRAFT run older than one quarter -> VOID"
      - "Every CommitteeMember whose term_end_date has passed -> TERM_EXPIRED with end_term_reason = TERM_EXPIRED, and its seat FILLED -> VACANT with consecutive_vacant_quarters += 1"
      - "increments Plan.version by 1"

  - method: POST
    path: "/governance/plans/{planId}/menu-posture/recompute"
    description: "Recompute the at-risk slot ratio and menu posture, releasing BLOCKED replacement proposals back to their pre-block status when the posture relaxes to OPEN"
    roles: [PlanSponsorAdmin, InvestmentConsultant]
    code: 200
    input: []
    output: Plan
    side_effects:
      - "at_risk_slot_ratio and menu_posture recomputed (calculations.menu_posture)"
      - "When menu_posture becomes OPEN, every BLOCKED FundReplacementProposal on this plan is restored to pre_block_status exactly and pre_block_status is cleared, ordered by slot_index ASC then created_at ASC"
      - "increments Plan.version by 1"

  # --------------------------------------------------------- CommitteeSeat
  - method: POST
    path: "/governance/committee-seats"
    description: "Create a committee seat on a plan in VACANT status"
    roles: [PlanSponsorAdmin]
    code: 201
    input: [plan_id, seat_code, seat_class, voting, seat_index]
    output: CommitteeSeat
    side_effects:
      - "status = VACANT; consecutive_vacant_quarters = 0"
      - "Rejected with ERR_DUPLICATE_RESOURCE on a repeated (plan_id, seat_code), and when a voting seat would push the plan past Plan.max_voting_seats"

  - method: GET
    path: "/governance/committee-seats"
    description: "List committee seats, filterable by owning plan, seat class, voting flag and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: ["plan_id?", "seat_class?", "voting?", "status?", "limit?", "offset?"]
    output: CommitteeSeat[]
    side_effects: []

  - method: GET
    path: "/governance/committee-seats/{seatId}"
    description: "Read one committee seat"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: []
    output: CommitteeSeat
    side_effects: []

  - method: POST
    path: "/governance/committee-seats/{seatId}/status"
    description: "Suspend, reinstate or retire a seat"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [action, "reason?"]
    output: CommitteeSeat
    side_effects:
      - "action == SUSPEND: FILLED -> SUSPENDED, and the seated member keeps its status but stops counting toward quorum eligibility"
      - "action == REINSTATE: SUSPENDED -> FILLED when a non-terminal member still occupies the seat, else SUSPENDED -> VACANT"
      - "action == RETIRE: VACANT -> RETIRED only; a seat holding a non-terminal member is rejected with ERR_SLOT_HAS_OPEN_PROPOSAL"

  # ------------------------------------------------------- CommitteeMember
  - method: POST
    path: "/governance/committee-members"
    description: "Appoint a member to a seat for a closed term interval; the seat must be VACANT and the term must not overlap or abut any prior member of that seat"
    roles: [PlanSponsorAdmin]
    code: 201
    input: [seat_id, member_name, term_start_date, term_end_date, "affiliated_provider_role?", "independence_flag?"]
    output: CommitteeMember
    side_effects:
      - "status = APPOINTED; fiduciary_training_status = PENDING; acceptance_signed_at = null; votes_cast_count = 0"
      - "seat.status VACANT -> FILLED; seat.consecutive_vacant_quarters = 0"
      - "Rejected with ERR_SEAT_TERM_OVERLAP when the term interval overlaps or is adjacent to an existing member's closed interval on the same seat"

  - method: GET
    path: "/governance/committee-members"
    description: "List committee members, filterable by seat, status and training currency"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: ["seat_id?", "status?", "fiduciary_training_status?", "affiliated_provider_role?", "limit?", "offset?"]
    output: CommitteeMember[]
    side_effects: []

  - method: GET
    path: "/governance/committee-members/{memberId}"
    description: "Read one committee member with acceptance and training state"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []

  - method: POST
    path: "/governance/committee-members/{memberId}/acceptance"
    description: "Record the member's documented acceptance of fiduciary responsibility. The member signs for themselves"
    roles: [CommitteeMember, CommitteeChair]
    code: 200
    input: [acceptance_doc_ref]
    output: CommitteeMember
    side_effects:
      - "acceptance_signed_at = clock now; acceptance_doc_ref stored"
      - "status APPOINTED -> ACCEPTANCE_PENDING, or TRAINING_ASSIGNED -> ACCEPTANCE_PENDING when training was assigned first"
      - "Rejected with ERR_ACTOR_NOT_SELF when X-User-ID does not equal memberId"

  - method: POST
    path: "/governance/committee-members/{memberId}/activate"
    description: "Activate a member once BOTH the fiduciary training modules are current AND the documented acceptance is on file. Activation from TRAINING_ASSIGNED without acceptance always fails"
    roles: [PlanSponsorAdmin]
    code: 200
    input: []
    output: CommitteeMember
    side_effects:
      - "status ACCEPTANCE_PENDING -> ACTIVE"
      - "Plan.documented_acceptance_count += 1"
      - "Rejected with ERR_FIDUCIARY_ACCEPTANCE_MISSING from TRAINING_ASSIGNED, and with ERR_TRAINING_NOT_CURRENT when fiduciary_training_status != CURRENT"

  - method: POST
    path: "/governance/committee-members/{memberId}/end-term"
    description: "End a member's service by resignation or removal, vacating the seat"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [end_term_reason, "effective_date?"]
    output: CommitteeMember
    side_effects:
      - "end_term_reason == RESIGNED -> status RESIGNED; REMOVED -> status REMOVED"
      - "seat.status FILLED -> VACANT (or SUSPENDED -> VACANT); Plan.documented_acceptance_count -= 1 when the member was ACTIVE"
      - "Already-frozen meeting quorum figures are NOT recomputed; future meetings see the smaller eligible base"

  # ------------------------------------------------ FiduciaryTrainingRecord
  - method: POST
    path: "/governance/training-records"
    description: "Assign or waive a fiduciary training module for a member. FIDUCIARY_DUTIES can never be waived"
    roles: [PlanSponsorAdmin]
    code: 201
    input: [member_id, module_code, "status?", "waiver_basis?", "validity_quarters?"]
    output: FiduciaryTrainingRecord
    side_effects:
      - "status defaults to ASSIGNED with assigned_quarter_index = Plan.fiscal_quarter_index; status == WAIVED sets completed_quarter_index = Plan.fiscal_quarter_index and requires waiver_basis of at least 12 characters"
      - "member.status APPOINTED -> TRAINING_ASSIGNED on the first assignment; fiduciary_training_status recomputed"
      - "Rejected with ERR_MODULE_NOT_WAIVABLE when module_code == FIDUCIARY_DUTIES and status == WAIVED"

  - method: GET
    path: "/governance/training-records"
    description: "List fiduciary training records, filterable by member, module and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, PlanAuditor]
    code: 200
    input: ["member_id?", "module_code?", "status?", "limit?", "offset?"]
    output: FiduciaryTrainingRecord[]
    side_effects: []

  - method: GET
    path: "/governance/training-records/{recordId}"
    description: "Read one fiduciary training record"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, PlanAuditor]
    code: 200
    input: []
    output: FiduciaryTrainingRecord
    side_effects: []

  - method: POST
    path: "/governance/training-records/{recordId}/complete"
    description: "Record completion of an assigned training module with a score; 80.00 is the passing floor"
    roles: [PlanSponsorAdmin, CommitteeMember]
    code: 200
    input: [score_pct]
    output: FiduciaryTrainingRecord
    side_effects:
      - "status ASSIGNED -> COMPLETED; completed_quarter_index = Plan.fiscal_quarter_index"
      - "member.fiduciary_training_status recomputed; a member with every required module current becomes eligible for activation"
      - "score_pct < 80.00 is rejected with ERR_TRAINING_SCORE_INSUFFICIENT and the record stays ASSIGNED"

  # -------------------------------------------- InvestmentPolicyStatement
  - method: POST
