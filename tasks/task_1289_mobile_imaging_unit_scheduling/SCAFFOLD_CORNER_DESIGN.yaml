scaffold_corner_design:
  - section: entities
    instances:
      - name: facility_creation_echoes_fields_and_system_fields
        claim_type: creation
        grounds: [entities.ContractedFacility]
        distinguishing_aspect: "POST /api/facilities returns 201 with all input fields echoed plus server-minted id, created_at, updated_at, version == 1."
        test_recipe:
          setup: ["empty DB; clock default"]
          setup_api_calls:
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT", "MRI"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac: $.data.id, fac_v: $.data.version } }
          trigger: []
          assert:
            - "response 201; data.id is a UUID (${fac}); data.version == 1 (${fac_v})"
            - "data.name == 'Hospital A', data.pad_amps_available == 150, data.supported_modalities == [CT, MRI]"

      - name: facility_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ContractedFacility.fields.pad_amps_available, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required pad_amps_available rejects with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { err: $.data.error_id } }
          assert:
            - "ERR_INVALID_REQUEST (${err}), HTTP 400"

      - name: unit_invalid_modality_enum_rejected
        claim_type: type_constraints
        grounds: [entities.MobileImagingUnit.fields.modality, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "modality 'XRAY' is outside {MRI, CT, PET} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/units", payload: { unit_code: "MIU-X", modality: "XRAY", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { err: $.data.error_id } }
          assert:
            - "ERR_INVALID_REQUEST (${err}), HTTP 400"

      - name: site_day_get_missing_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SITE_DAY_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_SITE_DAY_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/site-days/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: OperationsDirector, captures: { err: $.data.error_id } }
          assert:
            - "ERR_SITE_DAY_NOT_FOUND (${err}), HTTP 404"

      - name: route_plan_computed_site_day_count
        claim_type: computed_fields
        grounds: [entities.RoutePlan.fields.site_day_count]
        distinguishing_aspect: "site_day_count is server-computed: 0 at plan creation, 2 after two site-day creations; client-supplied value is ignored."
        test_recipe:
          setup: ["unit + accreditation + facility + contract exist"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_DAY", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id, plan_cnt0: $.data.site_day_count } }
          trigger:
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-05", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector }
            - { call: "GET /api/route-plans/${plan}", payload: {}, as: OperationsDirector, captures: { plan_cnt2: $.data.site_day_count } }
          assert:
            - "At creation site_day_count == 0 (${plan_cnt0}); after two site days == 2 (${plan_cnt2})"

      - name: technologist_computed_dose_defaults_zero
        claim_type: defaults
        grounds: [entities.Technologist.fields.current_day_dose_msv, entities.Technologist.fields.monthly_dose_msv]
        distinguishing_aspect: "Fresh technologist has current_day_dose_msv == 0 and monthly_dose_msv == 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/technologists", payload: { full_name: "Tina Tech", modality_certs: ["CT"], home_base_name: "Depot", max_daily_drive_minutes: 240 }, as: OperationsDirector, captures: { tech: $.data.id } }
          trigger:
            - { call: "GET /api/technologists/${tech}", payload: {}, as: OperationsDirector, captures: { d_day: $.data.current_day_dose_msv, d_mon: $.data.monthly_dose_msv } }
          assert:
            - "current_day_dose_msv == 0 (${d_day}) and monthly_dose_msv == 0 (${d_mon})"

      - name: dose_record_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.RadiationDoseRecord]
        distinguishing_aspect: "RadiationDoseRecord is append-only (common_fields false): response carries id + created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "Day driven to IN_SERVICE; one appointment COMPLETED; technologist staffed"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_SCAN", day_rate_cents: 400000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd1: $.data.id } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
            - { call: "POST /api/technologists", payload: { full_name: "Tina Tech", modality_certs: ["CT"], home_base_name: "Depot", max_daily_drive_minutes: 240 }, as: OperationsDirector, captures: { tech: $.data.id } }
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd1}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd1}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg1: $.data.id } }
            - { call: "POST /api/site-days/${sd1}/depart", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs/${leg1}/arrive", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd1}/begin-setup", payload: {}, as: OperationsDirector }
            - { call: "POST /api/setup-checklists", payload: { site_day_id: "${sd1}", power_verify_passed: true, measured_amps: 140, pad_level_passed: true, chiller_passed: true, rf_shield_passed: true, network_link_passed: true, measured_uplink_mbps: 100 }, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd1}/mark-ready", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd1}/start-service", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-001", exam_type: "CT_HEAD", scheduled_start: "09:00", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap1: $.data.id } }
            - { call: "POST /api/appointments/${ap1}/confirm", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments/${ap1}/check-in", payload: {}, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments/${ap1}/begin-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/appointments/${ap1}/complete-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
          trigger:
            - { call: "POST /api/dose-records", payload: { appointment_id: "${ap1}", technologist_id: "${tech}", dose_msv: 1.8 }, as: Technologist, as_user_id: "${tech}", captures: { dr: $.data.id, drl: $.data.drl_exceeded } }
          assert:
            - "Response has id (${dr}) and created_at but no version and no updated_at keys"
            - "drl_exceeded == false (${drl}) for 1.8 <= DRL 2.0"

  - section: state_machines
    instances:
      - name: route_plan_starts_in_draft
        claim_type: initial_state
        grounds: [state_machines.RoutePlan]
        distinguishing_aspect: "A newly created RoutePlan has status DRAFT before any action."
        test_recipe:
          setup: ["unit exists"]
          setup_api_calls:
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
          trigger:
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan_status: $.data.status } }
          assert:
            - "RoutePlan.status == DRAFT (${plan_status})"

      - name: publish_empty_plan_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RoutePlan.DRAFT_to_PUBLISHED, "errors[ERR_EMPTY_ROUTE_PLAN]"]
        distinguishing_aspect: "Publish without any site day fails with ERR_EMPTY_ROUTE_PLAN."
        test_recipe:
          setup: ["unit + empty DRAFT plan"]
          setup_api_calls:
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
          trigger:
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector, captures: { err: $.data.error_id } }
          assert:
            - "ERR_EMPTY_ROUTE_PLAN (${err}), HTTP 409"

      - name: depart_dispatches_planned_transport_legs
        claim_type: side_effect_execution
        grounds: [state_machines.SiteDayAssignment.SCHEDULED_to_EN_ROUTE, state_machines.TransportLeg.PLANNED_to_DISPATCHED]
        distinguishing_aspect: "depart side effect flips the day's PLANNED legs to DISPATCHED in the same request."
        test_recipe:
          setup: ["SCHEDULED day with one PLANNED leg"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_DAY", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd1: $.data.id } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd1}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg1: $.data.id } }
          trigger:
            - { call: "POST /api/site-days/${sd1}/depart", payload: {}, as: OperationsDirector, captures: { sd_status: $.data.status } }
            - { call: "GET /api/transport-legs/${leg1}", payload: {}, as: OperationsDirector, captures: { leg_status: $.data.status } }
          assert:
            - "SiteDayAssignment.status == EN_ROUTE (${sd_status})"
            - "TransportLeg.status == DISPATCHED (${leg_status}) — cascade fired by depart"

      - name: begin_setup_before_leg_arrival_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.SiteDayAssignment.EN_ROUTE_to_SETTING_UP, "errors[ERR_TRANSPORT_NOT_ARRIVED]"]
        distinguishing_aspect: "begin-setup while the leg is still DISPATCHED fails with ERR_TRANSPORT_NOT_ARRIVED."
        test_recipe:
          setup: ["day EN_ROUTE with leg DISPATCHED (not yet ARRIVED)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_DAY", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd1: $.data.id } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd1}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd1}/depart", payload: {}, as: OperationsDirector }
          trigger:
            - { call: "POST /api/site-days/${sd1}/begin-setup", payload: {}, as: OperationsDirector, captures: { err: $.data.error_id } }
          assert:
            - "ERR_TRANSPORT_NOT_ARRIVED (${err}), HTTP 409"

      - name: complete_with_open_appointment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.SiteDayAssignment.IN_SERVICE_to_COMPLETED, "errors[ERR_OPEN_APPOINTMENTS]"]
        distinguishing_aspect: "complete is blocked while any appointment is non-terminal (one still CONFIRMED)."
        test_recipe:
          setup: ["day IN_SERVICE with one CONFIRMED appointment"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_SCAN", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd1: $.data.id } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
            - { call: "POST /api/technologists", payload: { full_name: "Tina Tech", modality_certs: ["CT"], home_base_name: "Depot", max_daily_drive_minutes: 240 }, as: OperationsDirector, captures: { tech: $.data.id } }
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd1}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd1}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg1: $.data.id } }
            - { call: "POST /api/site-days/${sd1}/depart", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs/${leg1}/arrive", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd1}/begin-setup", payload: {}, as: OperationsDirector }
            - { call: "POST /api/setup-checklists", payload: { site_day_id: "${sd1}", power_verify_passed: true, measured_amps: 140, pad_level_passed: true, chiller_passed: true, rf_shield_passed: true, network_link_passed: true, measured_uplink_mbps: 100 }, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd1}/mark-ready", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd1}/start-service", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-001", exam_type: "CT_HEAD", scheduled_start: "09:00", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap1: $.data.id } }
            - { call: "POST /api/appointments/${ap1}/confirm", payload: {}, as: OperationsDirector }
          trigger:
            - { call: "POST /api/site-days/${sd1}/complete", payload: {}, as: OperationsDirector, captures: { err: $.data.error_id } }
          assert:
            - "ERR_OPEN_APPOINTMENTS (${err}), HTTP 409 — CONFIRMED is not terminal"

      - name: start_service_without_staffing_rejected
        claim_type: precondition_enforcement
