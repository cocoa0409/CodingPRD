              captures: { s4_status: "$.data.status" }
            - call: "GET /qa-passes/${pass_id}"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-2"
              captures: { mid_points: "$.data.weighted_defect_points", mid_density: "$.data.defect_density" }
            - call: "POST /lqa-bugs/${bug_s4}/verify"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-2"
            - call: "POST /lqa-bugs/${bug_s1}/submit-fix"
              payload: {}
              as: TranslationVendor
            - call: "POST /lqa-bugs/${bug_s1}/verify"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-2"
              captures: { s1_final: "$.data.status" }
            - call: "POST /qa-passes/${pass_id}/close"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-2"
              captures: { close_status: "$.data.status", final_density: "$.data.defect_density" }
          assert:
            - "with all four bugs NEW the pass holds weighted_defect_points == 15 (8+4+2+1) and defect_density == 0.1500, so the first close returns HTTP 422 ERR_DEFECT_DENSITY_EXCEEDED"
            - "after REJECT on S2 and DUPLICATE on S3 those two weights leave the sum; after S4 reaches FIX_SUBMITTED it is STILL counted, so weighted_defect_points == 9 (8 TRIAGED + 1 FIX_SUBMITTED) and defect_density == 0.0900"
            - "verifying S4 and then S1 empties the open set: weighted_defect_points == 0 and defect_density == 0.0000"
            - "the final close returns HTTP 200 with status == CLOSED, closed_at_utc set to the logical clock and the density frozen at 0.0000"
            - "LqaBug.${bug_s3}.duplicate_of_bug_id == ${bug_s1} and its severity_weight of 2 never returns to the sum"
            - "log-and-verify are done by different users (lqa-1 logs, lqa-2 verifies), which is what keeps priority 37 quiet"

      - name: defect_density_rounds_to_four_decimals_half_up
