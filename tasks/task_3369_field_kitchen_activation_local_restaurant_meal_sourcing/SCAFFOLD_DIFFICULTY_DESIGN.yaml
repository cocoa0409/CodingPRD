              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "SOLAR", water_source: "PIPED", refrigeration_hours_available: 12, daily_capacity_meals: 800 }
              as: FieldCoordinator
              captures: { fk_id: "$.data.id" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "UTILITIES_PENDING" }
              as: FieldCoordinator
          trigger:
            - call: "POST /field-ops/field-kitchens/${fk_id}/inspections"
              payload: { power_source: "SOLAR", water_source: "PIPED", refrigeration_hours_available: 5, daily_capacity_meals: 800 }
              as: FoodSafetyOfficer
              captures: { score_5h: "$.data.food_safety_score" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "FOOD_SAFETY_CLEARED" }
              as: FoodSafetyOfficer
              captures: { err_gate: "$.data.error_id" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/inspections"
              payload: { power_source: "SOLAR", water_source: "PIPED", refrigeration_hours_available: 11, daily_capacity_meals: 800 }
              as: FoodSafetyOfficer
              captures: { score_11h: "$.data.food_safety_score" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "FOOD_SAFETY_CLEARED" }
              as: FoodSafetyOfficer
            - call: "POST /field-ops/field-kitchens/${fk_id}/inspections"
              payload: { power_source: "SOLAR", water_source: "PIPED", refrigeration_hours_available: 12, daily_capacity_meals: 800 }
              as: FoodSafetyOfficer
              captures: { score_12h: "$.data.food_safety_score" }
          assert:
            - "${score_5h} == 55"
            - "${score_11h} == 70"
            - "${score_12h} == 80"
            - "${err_gate} == \"ERR_FOOD_SAFETY_SCORE_TOO_LOW\""
            - "FieldKitchen.${fk_id}.site_status == \"FOOD_SAFETY_CLEARED\""

      - name: accountability_report_empty_delivery_set_returns_zero_not_an_error
        grounds:
          - calculations.incident_local_sourcing_ratio
          - entities.Incident.fields.local_sourcing_pct
          - entities.Incident.fields.cost_per_meal_cents
          - endpoints.GET /field-ops/incidents/{id}/accountability-report
        distinguishing_aspect: |
          With zero DELIVERED meal orders the accountability report returns HTTP 200 with
          local_sourcing_pct 0 and cost_per_meal_cents 0 rather than dividing by zero or returning a
          not-found, and the same read flips donor_report_flag from BELOW_LOCAL_SOURCING_TARGET to
          ON_TARGET only once the ratio reaches 30.
        test_recipe:
          setup:
            - "Incident ${inc_id} exists in MONITORING with no meal orders and no sourcing orders"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
          trigger:
            - call: "GET /field-ops/incidents/${inc_id}/accountability-report"
              as: DonorLiaison
              captures: { pct_empty: "$.data.local_sourcing_pct", cpm_empty: "$.data.cost_per_meal_cents", meals_empty: "$.data.delivered_meal_total", flag_empty: "$.data.donor_report_flag" }
          assert:
            - "${pct_empty} == 0"
            - "${cpm_empty} == 0"
            - "${meals_empty} == 0"
            - "${flag_empty} == \"BELOW_LOCAL_SOURCING_TARGET\""
            - "Incident.${inc_id}.spent_cents == 0"

  - rule_id: cross_entity_state_dependency
    instances:
