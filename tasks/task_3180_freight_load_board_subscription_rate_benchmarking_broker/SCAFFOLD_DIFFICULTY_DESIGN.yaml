          - state_machines.BrokerOrg
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (POST /credit-disputes/{id}/resolve with
          outcome=REMOVE): dispute RESOLVED_REMOVE -> CreditReportEvent REMOVED ->
          BrokerOrg credit recomputed (score drops below 40) -> BrokerOrg SUSPENDED with
          the full cascade — and the removed event's invoice moves from included to removed
          totals. Distinct trigger and distinct propagation path from the fraud cascade.
