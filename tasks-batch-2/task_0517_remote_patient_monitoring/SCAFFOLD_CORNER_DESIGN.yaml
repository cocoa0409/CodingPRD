            - "data.error_id == ERR_NOT_FOUND"

      - name: error_stale_version_finalize_already_covered
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - concurrency_rules[finalize-period-stale-version]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / finalize_invalid_state_beats_stale_version
          rationale: "OCC stale-version handling on finalize is exercised by the named §1.8 priority-pair instance (which constructs a stale version against the OPEN->FINALIZED transition)."

      - name: error_duplicate_mrn_already_implied
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "Creating a second patient with an mrn already held by an active patient returns ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["A patient with mrn M-DUP-1 already exists (active)."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-V7", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-DUP-1", full_name: "Dup A" }
              as: CareCoordinator
          trigger:
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-DUP-1", full_name: "Dup B" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_RESOURCE"

