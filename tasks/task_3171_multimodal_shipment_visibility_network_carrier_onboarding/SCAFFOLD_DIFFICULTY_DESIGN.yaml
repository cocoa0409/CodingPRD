      - name: testing_window_closed_interval_touching_endpoints_conflict
        grounds:
          - validations[priority=7]
          - state_machines.CarrierConnection.CREDENTIALS_SUBMITTED_to_TESTING
          - errors.ERR_TESTING_WINDOW_CONFLICT
        distinguishing_aspect: |
          Different interval semantics on a different resource: carrier
          certification windows are CLOSED intervals on the Carrier, so a
          second connection whose testing_window_start equals the first
          connection's testing_window_end (2026-09-05T00:00:00Z, touching
          endpoint) DOES conflict — the exact adjacency that half-open
          appointment windows permit.
        test_recipe:
          setup:
            - "Carrier with connection 1 in TESTING, window [2026-09-01T00:00, 2026-09-05T00:00] (closed). Connection 2 CREDENTIALS_SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "ClosedCo", scac_code: "CLSC" }
              as: NetworkOps
              captures: { cw_car_id: $.data.id }
            - call: "POST /carriers/${cw_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { cw_conn_1: $.data.id }
            - call: "POST /connections/${cw_conn_1}/submit-credentials"
              payload: { credential_ref: "vault://clsc-1" }
              as: CarrierRep
              as_user_id: "${cw_car_id}"
            - call: "POST /connections/${cw_conn_1}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-05T00:00:00Z" }
              as: NetworkOps
            - call: "POST /carriers/${cw_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { cw_conn_2: $.data.id }
            - call: "POST /connections/${cw_conn_2}/submit-credentials"
              payload: { credential_ref: "vault://clsc-2" }
              as: CarrierRep
              as_user_id: "${cw_car_id}"
          trigger:
            - call: "POST /connections/${cw_conn_2}/begin-testing"
              payload: { testing_window_start: "2026-09-05T00:00:00Z", testing_window_end: "2026-09-09T00:00:00Z" }
              as: NetworkOps
              captures: { cw_err: $.data.error_id }
            - call: "POST /connections/${cw_conn_2}/begin-testing"
              payload: { testing_window_start: "2026-09-06T00:00:00Z", testing_window_end: "2026-09-09T00:00:00Z" }
              as: NetworkOps
              captures: { cw_status: $.data.status }
          assert:
            - "begin-testing [2026-09-05T00:00, 2026-09-09T00:00] fails 409 with error_id ERR_TESTING_WINDOW_CONFLICT (touching closed endpoints conflict)"
            - "begin-testing [2026-09-06T00:00, 2026-09-09T00:00] succeeds with status TESTING (strictly after the prior closed window)"
            - "Connection.${cw_conn_1}.status remains TESTING throughout"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: confirm_then_reject_restores_po_confirmed_link_count
        grounds:
          - state_machines.ShipmentIdentityLink.PROPOSED_to_CONFIRMED
          - state_machines.ShipmentIdentityLink.CONFIRMED_to_REJECTED
          - entities.PurchaseOrder.fields.confirmed_link_count
        distinguishing_aspect: |
          Conserved quantity: a link-count integer. The forward action
          (confirm) increments PurchaseOrder.confirmed_link_count to 1 and the
          compensating action (reject from CONFIRMED) decrements it back to
          exactly the pre-confirm value 0 — the invariant
          confirmed_link_count == count(CONFIRMED links on PO) holds at every
          step including after compensation.
        test_recipe:
          setup:
            - "Connection TESTING. Shipper, PO (PO-3/BK-3/LAX), score-1.0 shipment, PROPOSED link. PO.confirmed_link_count == 0 before trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "InvCo", scac_code: "INVC" }
              as: NetworkOps
              captures: { ci_car_id: $.data.id }
            - call: "POST /carriers/${ci_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { ci_conn_id: $.data.id }
            - call: "POST /connections/${ci_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://invc" }
              as: CarrierRep
              as_user_id: "${ci_car_id}"
            - call: "POST /connections/${ci_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "InvShip" }
              as: PlatformAdmin
              captures: { ci_shp_id: $.data.id }
            - call: "POST /shippers/${ci_shp_id}/purchase-orders"
              payload: { po_number: "PO-3", destination_code: "LAX", booking_reference: "BK-3" }
              as: ShipperRep
              as_user_id: "${ci_shp_id}"
              captures: { ci_po_id: $.data.id, ci_po_v: $.data.version }
            - call: "POST /shippers/${ci_shp_id}/shipments"
              payload: { carrier_id: "${ci_car_id}", connection_id: "${ci_conn_id}", mode: "TRUCKLOAD", tracking_reference: "BK-3", mode_reference: "PRO-3", destination_code: "LAX", po_reference_claim: "PO-3", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${ci_shp_id}"
              captures: { ci_ship_id: $.data.id }
            - call: "POST /shipments/${ci_ship_id}/identity-links"
              payload: { purchase_order_id: "${ci_po_id}", expected_po_version: "${ci_po_v}" }
              as: NetworkOps
              captures: { ci_link_id: $.data.id }
          trigger:
            - call: "POST /identity-links/${ci_link_id}/confirm"
              payload: {}
              as: ShipperRep
              as_user_id: "${ci_shp_id}"
            - call: "GET /purchase-orders/${ci_po_id}"
              payload: {}
              as: ShipperRep
              as_user_id: "${ci_shp_id}"
              captures: { ci_count_mid: $.data.confirmed_link_count }
            - call: "POST /identity-links/${ci_link_id}/reject"
              payload: {}
              as: ShipperRep
              as_user_id: "${ci_shp_id}"
            - call: "GET /purchase-orders/${ci_po_id}"
              payload: {}
              as: ShipperRep
              as_user_id: "${ci_shp_id}"
            - call: "GET /shipments/${ci_ship_id}"
              payload: {}
              as: NetworkOps
          assert:
            - "after confirm, PurchaseOrder.${ci_po_id}.confirmed_link_count == 1 and Shipment identity_state == MATCHED_CONFIRMED"
            - "after the compensating reject, PurchaseOrder.${ci_po_id}.confirmed_link_count == 0 (restored exactly; no drift)"
            - "ShipmentIdentityLink.${ci_link_id}.status == REJECTED"
            - "Shipment.${ci_ship_id}.identity_state == UNRESOLVED (no non-REJECTED links remain)"

      - name: complete_then_void_restores_facility_dwell_and_exposure
        grounds:
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - state_machines.Appointment.COMPLETED_to_VOIDED
          - calculations.detention_exposure
          - entities.Facility.fields.detention_exposure_minutes
        distinguishing_aspect: |
          Conserved quantity: aggregated minutes (a different quantity type
          from the link-count invariant). Complete adds dwell 210 / exposure
          90 to the facility; void-completion subtracts exactly the same
          amounts, restoring total_dwell_minutes and
          detention_exposure_minutes to their pre-complete values of 0 and
          appointment_adherence_pct to null.
        test_recipe:
          setup:
            - "Facility ACTIVE with zero aggregates. Connection TESTING. TRUCKLOAD shipment. Appointment [2026-09-02T10:00, 2026-09-02T11:00) booked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "VoidCo", scac_code: "VOIC" }
              as: NetworkOps
              captures: { vi_car_id: $.data.id }
            - call: "POST /carriers/${vi_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { vi_conn_id: $.data.id }
            - call: "POST /connections/${vi_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://voic" }
              as: CarrierRep
              as_user_id: "${vi_car_id}"
            - call: "POST /connections/${vi_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "VoidShip" }
              as: PlatformAdmin
              captures: { vi_shp_id: $.data.id }
            - call: "POST /shippers/${vi_shp_id}/shipments"
              payload: { carrier_id: "${vi_car_id}", connection_id: "${vi_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-V", mode_reference: "PRO-V", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${vi_shp_id}"
              captures: { vi_ship_id: $.data.id }
            - call: "POST /facilities"
              payload: { facility_name: "Void DC", facility_type: "DESTINATION" }
              as: PlatformAdmin
              captures: { vi_fac_id: $.data.id, vi_fac_v: $.data.version }
            - call: "POST /facilities/${vi_fac_id}/appointments"
              payload: { shipment_id: "${vi_ship_id}", window_start: "2026-09-02T10:00:00Z", window_end: "2026-09-02T11:00:00Z", expected_facility_version: "${vi_fac_v}" }
              as: CarrierRep
              as_user_id: "${vi_car_id}"
              captures: { vi_appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${vi_appt_id}/complete"
              payload: { actual_arrival_at: "2026-09-02T11:30:00Z", actual_departure_at: "2026-09-02T15:00:00Z" }
              as: CarrierRep
              as_user_id: "${vi_car_id}"
            - call: "GET /facilities/${vi_fac_id}"
              payload: {}
              as: PlatformAdmin
              captures: { vi_dwell_mid: $.data.total_dwell_minutes }
            - call: "POST /appointments/${vi_appt_id}/void-completion"
              payload: {}
              as: NetworkOps
            - call: "GET /facilities/${vi_fac_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after complete, Facility.${vi_fac_id}.total_dwell_minutes == 210 and detention_exposure_minutes == 90 (arrival 11:30 outside window, free 120)"
            - "after void-completion, Facility.${vi_fac_id}.total_dwell_minutes == 0 and detention_exposure_minutes == 0 (exactly restored)"
            - "Appointment.${vi_appt_id}.status == VOIDED"
            - "Facility.${vi_fac_id}.appointment_adherence_pct is null again (denominator back to 0)"
