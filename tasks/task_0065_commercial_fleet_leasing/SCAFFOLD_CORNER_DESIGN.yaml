scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_vehicle_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Vehicle, endpoints]
        distinguishing_aspect: "POST /fleet/vehicles with vin+class returns 201; response carries server-minted id, status=AVAILABLE, odometer_miles=0, open_block_count=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINNEW0001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Vehicle.${veh_id}.status == AVAILABLE"
            - "Vehicle.${veh_id}.odometer_miles == 0"
            - "Vehicle.${veh_id}.open_block_count == 0"
            - "Vehicle.${veh_id}.version == 1"

      - name: create_lease_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Lease", "validations[priority=4]"]
        distinguishing_aspect: "POST /fleet/leases omitting overage_model (a source:input field with no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A lessee and a vehicle exist."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "RF Co", billing_email: "rf@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINRF00001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_vehicle_invalid_enum_class_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Vehicle.fields.class", "validations[priority=4]"]
        distinguishing_aspect: "POST /fleet/vehicles with class='SPACESHIP' (not in the allowed enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINENUM001", class: "SPACESHIP" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: driver_default_license_status_valid_on_create
        claim_type: Defaults
        grounds: [entities.Driver.fields.license_status]
        distinguishing_aspect: "POST /fleet/drivers without license_status applies the default license_status=VALID."
        test_recipe:
          setup: ["A lessee exists."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "DD Co", billing_email: "dd@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /fleet/drivers"
              payload: { lessee_id: "${lessee_id}", full_name: "Defaulted", license_number: "LIC-DD-1" }
              as: FleetManager
              captures: { driver_id: $.data.id }
          assert:
            - "Driver.${driver_id}.license_status == VALID"

      - name: vehicle_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Vehicle", "validations[priority=3]"]
        distinguishing_aspect: "GET /fleet/vehicles/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/vehicles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: lessee_outstanding_balance_reconciled_after_settlement
        claim_type: Computed Fields
        grounds: [entities.Lessee.fields.outstanding_balance_cents, state_machines.OverageSettlement.DRAFT_to_FINALIZED]
        distinguishing_aspect: "After finalizing a settlement with net_charge_cents=625000, GET /fleet/lessees/{id} shows outstanding_balance_cents=625000 (computed, input ignored)."
        test_recipe:
          setup: ["CONTRACT_FLAT lease driven to 85000, RETURN_INITIATED, settlement opened."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "Bal Co", billing_email: "bal@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINBAL0001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "CA", odometer_miles: 85000, segment_miles: 85000, harsh_events: 10, idle_minutes: 100, recorded_at: "2026-06-01T00:00:00Z" }
              as: TelematicsGateway
            - call: "POST /fleet/leases/${lease_id}/initiate-return"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/overage-settlements"
              payload: { lease_id: "${lease_id}" }
              as: FleetManager
              captures: { settlement_id: $.data.id }
            - call: "POST /fleet/overage-settlements/${settlement_id}/finalize"
              payload: {}
              as: FleetManager
          trigger:
            - call: "GET /fleet/lessees/${lessee_id}"
              payload: {}
              as: FleetManager
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "Lessee.${lessee_id}.outstanding_balance_cents == 625000"

  # =========================================================================
  - section: state_machines
    instances:
      - name: lease_cancel_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Lease.DRAFT_to_CANCELLED", "validations[priority=6]"]
        distinguishing_aspect: "cancel is defined only from DRAFT; calling it on an ACTIVE lease returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Lease activated (ACTIVE)."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "IS1 Co", billing_email: "is1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINIS10001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
          trigger:
            - call: "POST /fleet/leases/${lease_id}/cancel"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Lease.${lease_id}.status == ACTIVE"

      - name: maintenance_complete_twice_idempotency_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.MaintenanceOrder.IN_PROGRESS_to_COMPLETED", "validations[priority=6]"]
        distinguishing_aspect: "Completing an already-COMPLETED maintenance order a second time returns ERR_INVALID_STATE (409); total_cost_cents is not changed."
        test_recipe:
          setup: ["MaintenanceOrder started then completed (COMPLETED)."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "ID1 Co", billing_email: "id1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINID10001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/maintenance-orders"
              payload: { vehicle_id: "${veh_id}", kind: "PREVENTIVE", labor_cents: 5000, parts_cents: 3000, window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: FleetManager
              captures: { mo_id: $.data.id }
            - call: "POST /fleet/maintenance-orders/${mo_id}/start"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/maintenance-orders/${mo_id}/complete"
              payload: {}
              as: FleetManager
          trigger:
            - call: "POST /fleet/maintenance-orders/${mo_id}/complete"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "MaintenanceOrder.${mo_id}.total_cost_cents == 8000"

      - name: lease_terminal_closed_lockdown_rejects_cancel
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Lease", "validations[priority=6]"]
        distinguishing_aspect: "A CLOSED lease (terminal) rejects any further transition; cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Lease fully closed via finalized settlement (CLOSED)."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "TL1 Co", billing_email: "tl1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINTL10001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "CA", odometer_miles: 70000, segment_miles: 70000, recorded_at: "2026-06-01T00:00:00Z" }
              as: TelematicsGateway
            - call: "POST /fleet/leases/${lease_id}/initiate-return"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/overage-settlements"
              payload: { lease_id: "${lease_id}" }
              as: FleetManager
              captures: { settlement_id: $.data.id }
            - call: "POST /fleet/overage-settlements/${settlement_id}/finalize"
              payload: {}
              as: FleetManager
          trigger:
            - call: "POST /fleet/leases/${lease_id}/cancel"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Lease.${lease_id}.status == CLOSED"

      - name: initiate_return_blocked_by_assigned_allocation
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Lease.ACTIVE_to_RETURN_INITIATED", "validations[priority=13]"]
        distinguishing_aspect: "initiate-return is rejected with ERR_ACTIVE_ALLOCATION_EXISTS (409) while an Allocation on the lease is still ASSIGNED."
        test_recipe:
          setup: ["Lease ACTIVE with one ASSIGNED allocation and a VALID driver."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "AA1 Co", billing_email: "aa1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINAA10001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { lessee_id: "${lessee_id}", full_name: "AA D", license_number: "LIC-AA1" }
              as: FleetManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
              captures: { lease_v: $.data.version }
            - call: "POST /fleet/allocations"
              payload: { lease_id: "${lease_id}", driver_id: "${driver_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-10T00:00:00Z", expected_lease_version: "${lease_v}" }
              as: FleetManager
          trigger:
            - call: "POST /fleet/leases/${lease_id}/initiate-return"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ACTIVE_ALLOCATION_EXISTS"
            - "Lease.${lease_id}.status == ACTIVE"

      - name: approve_total_loss_estimate_returns_is_total_loss
        claim_type: Precondition Enforcement
        grounds: ["state_machines.RepairOrder.ASSESSED_to_APPROVED", "validations[priority=16]"]
        distinguishing_aspect: "approve on a RepairOrder whose estimate_cents (900000) > 0.8*insurance_cap_cents (800000) is rejected with ERR_IS_TOTAL_LOSS (409)."
        test_recipe:
          setup: ["RepairOrder ASSESSED with estimate_cents=900000, insurance_cap_cents=1000000."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "TLC Co", billing_email: "tlc@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINTLC0001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
              captures: { repair_id: $.data.id }
            - call: "POST /fleet/repair-orders/${repair_id}/assess"
              payload: { estimate_cents: 900000, insurance_cap_cents: 1000000 }
              as: FleetManager
          trigger:
            - call: "POST /fleet/repair-orders/${repair_id}/approve"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_IS_TOTAL_LOSS"

      - name: declare_total_loss_below_ratio_returns_not_total_loss
        claim_type: Precondition Enforcement
        grounds: ["state_machines.RepairOrder.ASSESSED_to_TOTAL_LOSS", "validations[priority=17]"]
        distinguishing_aspect: "declare-total-loss on a RepairOrder whose estimate_cents (300000) <= 0.8*insurance_cap_cents (640000) is rejected with ERR_NOT_TOTAL_LOSS (409)."
        test_recipe:
          setup: ["RepairOrder ASSESSED with estimate_cents=300000, insurance_cap_cents=800000."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "NTL Co", billing_email: "ntl@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINNTL0001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
              captures: { repair_id: $.data.id }
            - call: "POST /fleet/repair-orders/${repair_id}/assess"
              payload: { estimate_cents: 300000, insurance_cap_cents: 800000 }
              as: FleetManager
          trigger:
            - call: "POST /fleet/repair-orders/${repair_id}/declare-total-loss"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NOT_TOTAL_LOSS"

      - name: total_loss_settle_waterfall_overflow_charges_lessee
        claim_type: Side Effect Execution
        grounds: [state_machines.RepairOrder.TOTAL_LOSS_to_TOTAL_LOSS_SETTLED, calculations.collision_repair_waterfall, state_machines.Vehicle.IN_REPAIR_to_RETIRED]
        distinguishing_aspect: "settle-total-loss runs the INSURANCE_FIRST waterfall on est=550000/cap=500000/ded=100000 giving lessee_responsible_cents=50000, charges the lessee, and retires the vehicle."
        test_recipe:
          setup: ["INSURANCE_FIRST lease; RepairOrder ASSESSED est=550000 cap=500000 then declared TOTAL_LOSS."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "TLS Co", billing_email: "tls@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINTLS0001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "INSURANCE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
              captures: { repair_id: $.data.id }
            - call: "POST /fleet/repair-orders/${repair_id}/assess"
              payload: { estimate_cents: 550000, insurance_cap_cents: 500000 }
              as: FleetManager
            - call: "POST /fleet/repair-orders/${repair_id}/declare-total-loss"
              payload: {}
              as: FleetManager
          trigger:
            - call: "POST /fleet/repair-orders/${repair_id}/settle-total-loss"
              payload: {}
              as: FleetManager
          assert:
            - "RepairOrder.${repair_id}.lessee_responsible_cents == 50000"
            - "RepairOrder.${repair_id}.status == TOTAL_LOSS_SETTLED"
            - "Vehicle.${veh_id}.status == RETIRED"
            - "Lessee.${lessee_id}.outstanding_balance_cents == 50000"

      - name: initiate_return_freezes_fuel_cards
        claim_type: Side Effect Execution
        grounds: [state_machines.Lease.ACTIVE_to_RETURN_INITIATED, entities.FuelCard.fields.status]
        distinguishing_aspect: "initiate-return cascades ACTIVE FuelCards on the lease to FROZEN."
        test_recipe:
          setup: ["Lease ACTIVE with one ACTIVE fuel card; vehicle driven to 70000; no assigned allocations."]
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "FF Co", billing_email: "ff@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINFF00001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/fuel-cards"
