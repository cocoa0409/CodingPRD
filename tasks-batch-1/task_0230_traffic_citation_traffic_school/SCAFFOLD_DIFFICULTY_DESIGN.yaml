              as: CourtClerk
              captures: { d19: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d19}", citation_number: "C-CI2", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { c19: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c19}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c19}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-11T00:00:00Z" }
              as: CourtClerk
            - call: "POST /citations/${c19}/apply-late-penalty"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${c19}/payments"
              payload: { amount_cents: 30000, method: "CARD" }
              as: Driver
              as_user_id: "${d19}"
          trigger:
            - call: "POST /citations/${c19}/payments"
              payload: { amount_cents: 2000, method: "CARD" }
              as: Driver
