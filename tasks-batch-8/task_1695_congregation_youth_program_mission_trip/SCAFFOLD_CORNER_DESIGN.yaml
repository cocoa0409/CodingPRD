          - errors[ERR_PROGRAM_HAS_OPEN_TRIPS]
        distinguishing_aspect: "Registrations require REGISTRATION_OPEN (DRAFT trip rejects); chaperone-assignments reject a CANCELLED trip; program close is blocked while any trip is non-terminal (ERR_PROGRAM_HAS_OPEN_TRIPS), and once CLOSED the program rejects new trips (ERR_PROGRAM_NOT_OPEN)."
