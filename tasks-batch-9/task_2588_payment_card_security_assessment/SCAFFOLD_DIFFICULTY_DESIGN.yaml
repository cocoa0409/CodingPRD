  - rule_id: resource_temporal_overlap
    instances:

      - name: scan_window_half_open_adjacency_boundary
        grounds:
          - validations[priority=12]
          - calculations.scan_cycle_effective_findings
          - entities.ScanCycle.fields.window_end
          - entities.ScanCycle.fields.window_start
        distinguishing_aspect: |
          The contended resource is the engagement's quarterly scan calendar and the interval is half-open
          [window_start, window_start + 90 days): a cycle beginning one second before the incumbent's
          window_end is refused with ERR_SCAN_WINDOW_OVERLAP, while a cycle beginning at exactly that
          instant is accepted, so abutting windows share an endpoint without intersecting. An
          implementation that treats the window as closed on the right rejects the legal adjacent cycle.
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' (L1, approved_budget_amount 200000.00) is in SCOPING with lead assessor Dana Reyes."
            - "AsvVendor 'Northstar ASV' has approval_expires_at 2027-12-31T00:00:00Z, so at the clock 2026-08-01T00:00:00Z its effective_approval is APPROVED and the priority-7 vendor gate never fires."
            - "ScanCycle '2026-Q2' is SCHEDULED with window_start 2026-04-01T00:00:00Z, so its window_end is exactly 2026-06-30T00:00:00Z (April 30 + May 31 + June 29 = 90 days)."
            - "The engagement has no other scan cycle, so the only interval in contention is [2026-04-01T00:00:00Z, 2026-06-30T00:00:00Z)."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
