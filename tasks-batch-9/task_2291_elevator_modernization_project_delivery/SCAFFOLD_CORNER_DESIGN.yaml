  - section: errors
    instances:
      - name: project_read_with_no_role_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_AUTH
          - response_envelope
        distinguishing_aspect: "Band 1 runs before path resolution and before role membership: a read with no X-User-Role / X-User-ID header at all returns 401 ERR_MISSING_AUTH, not 403 and not 404."
        test_recipe:
          setup:
            - "One project exists so that the target path is otherwise valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /projects/${p_id}"
              as: NONE
              note: "sent with neither X-User-Role nor X-User-ID"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with success == false and data.error_id == ERR_MISSING_AUTH"
            - "The envelope still carries success, data and message keys - the error shape is the declared envelope, not a bare string"
            - "The same GET with X-User-Role: SurveyTechnician returns HTTP 200, proving the path itself resolves"
            - "A request carrying X-User-Role: Concierge (not one of the six declared roles) also returns 401 ERR_MISSING_AUTH, not 403"

      - name: approving_a_scope_option_below_the_recommended_tier_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors.ERR_SCOPE_TIER_BELOW_RECOMMENDATION
          - calculations.recommended_scope_tier
        distinguishing_aspect: "The countersigned survey's recommended tier is a floor, not advice: a car scoring 73.75 recommends CONTROLLER_DOOR, so approving a CONTROLLER_ONLY option is refused even though the option is well-formed, fully code-cleared and inside budget."
        test_recipe:
          setup:
            - "A jurisdiction with no code triggers at all (fire_service_required false, seismic_zone 0, door_protection_required false)."
            - "One car surveyed GOOD / GOOD / FAIR and countersigned, so final_score is 73.75 and recommended_scope_tier is CONTROLLER_DOOR."
            - "One SUBMITTED ScopeOption at tier CONTROLLER_ONLY, base_price_cents 5000000, with zero CodeTriggers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
