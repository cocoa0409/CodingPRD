              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { d1_status: $.data.status }
            - call: "GET /lifeline/enrollments/${enr_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { enr_ver: $.data.version }
            - call: "POST /lifeline/service-transfers"
              payload: { enrollment_id: "${enr_id}", target_provider_id: "${p2_id}", subscriber_consent_ref: "CONSENT-51", expected_enrollment_version: "${enr_ver}" }
              as: ProviderAgent
              as_user_id: "${p2_id}"
              captures: { e_request: $.data.error_id }
            - call: "POST /lifeline/service-transfers"
