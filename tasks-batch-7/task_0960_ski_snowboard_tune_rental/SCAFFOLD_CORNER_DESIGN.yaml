            - "${q7} == 31500 (round(7 x 5000 x 0.9); 7 days crosses the >= 7 tier)"

      - name: demo_credit_cap_aggregation
        claim_type: correct_result
        grounds: ["calculations.demo_upgrade_pricing"]
        distinguishing_aspect: "Two ACTIVE credits (5000 + 8000 = 13000) aggregate below the 30% cap (13500) on a DEMO unit (list 45000): applied 13000, due 32000."
        test_recipe:
