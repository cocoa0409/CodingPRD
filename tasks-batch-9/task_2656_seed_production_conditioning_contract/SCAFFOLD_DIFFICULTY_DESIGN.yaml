          - entities.ConditioningLine.fields.last_cleanout_variety_id
          - entities.ConditioningLine.fields.last_run_end_utc
        distinguishing_aspect: |
          A DIFFERENT RESOURCE (ConditioningLine) with the OPPOSITE interval convention: HALF-OPEN
          [window_start, window_end), so a zero-gap successor is accepted where the equipment calendar would
          have rejected it. On top of that, occupancy alone is not the whole rule: when the incoming lot's
          variety differs from the line's last_cleanout_variety_id a 60-minute cleanout buffer is required, so
          the identical zero-gap window is refused for a foreign variety and accepted an hour later.
