  - { error_id: ERR_INSPECTION_OVERDUE, http_status: 409, message: "Unit inspection is overdue", trigger: "validation priority 23" }
  - { error_id: ERR_REPAIR_ATTEMPT_LATE, http_status: 409, message: "Repair action is past its deadline", trigger: "validation priority 24" }
  - { error_id: ERR_LEAK_PERSISTS, http_status: 409, message: "Monitored concentration is still at or above the leak definition", trigger: "validation priority 24" }
