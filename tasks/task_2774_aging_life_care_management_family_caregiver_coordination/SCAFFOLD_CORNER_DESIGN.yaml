              as: CareManager
              as_user_id: "${cm_iris}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_iris}"
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_iris}", service_type: "CARE_COORDINATION", start_at: "2026-08-17T10:00:00Z", end_at: "2026-08-17T11:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_iris}"
              captures: { te: $.data.id, amt: $.data.billable_amount_cents }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_iris}"
          trigger:
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED", review_note: "Self-review attempt" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { err_asm: $.data.error_id }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "APPROVED" }
