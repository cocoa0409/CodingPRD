  # Table 2 (State Machines) - Season / Ensemble / SectionQuota / Member /
  # Audition / AuditionSlot / Placement / SeatAssignment / TuitionAccount /
  # EventParticipation, plus the `parallel` shape rows.
  - section: state_machines
    instances:
      - name: event_participation_initial_state_forks_on_event_kind
        claim_type: initial_state
        grounds:
          - state_machines.EventParticipation.initial_state
          - endpoints[POST /event-participations]
          - entities.EventParticipation.fields.tour_status
        distinguishing_aspect: |
          A freshly rostered participation always starts NOT_RECORDED x UNREVIEWED, but
          the third dimension forks on the parent event's kind: FESTIVAL seeds tour_status
          PENDING while CONCERT seeds NOT_APPLICABLE, so the tour ladder is unreachable for
          a non-travel event from the very first row.
        test_recipe:
          setup:
            - "One Season in IN_SEASON: its single Philharmonic ensemble has a VIOLIN quota"
            - "(min 1 / target 1 / max 2) filled by Ada Strings, whose placement was accepted,"
            - "so she holds an ACTIVE seat (priority 92 requires ensemble membership)."
            - "Two future events on that ensemble: a FESTIVAL (tour_cost_share_cents 50000,"
            - "chaperone_required true) and a CONCERT, on non-overlapping days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
