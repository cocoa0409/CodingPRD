            - call: "POST /pep/fiduciary-role-allocations"
              payload: { plan_document_id: "${plan_id}", service_provider_id: "${im_id}", fiduciary_role: "NON_FIDUCIARY_MINISTERIAL", effective_from: "2026-08-03", effective_to: "2026-10-31", expected_plan_document_version: "${plan_v4}" }
