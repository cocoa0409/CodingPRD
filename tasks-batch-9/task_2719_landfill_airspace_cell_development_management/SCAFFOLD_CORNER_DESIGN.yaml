          trigger:
            - call: "POST /landfills"
              payload: { name: "Copycat MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 100000, design_footprint_sf: 50000, planned_density_tons_per_cy: 0.80, annual_tonnage_forecast: 10000 }
              as: PlatformAdmin
              captures: { e_permit: $.data.error_id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 300, design_area_sf: 45001, liner_type: "GCL_ONLY", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-25T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { e_cell: $.data.error_id }
            - call: "POST /gas-wells"
              payload: { cell_id: "${c2_id}", well_code: "W-1", depth_ft: 70 }
              as: EnvironmentalManager
