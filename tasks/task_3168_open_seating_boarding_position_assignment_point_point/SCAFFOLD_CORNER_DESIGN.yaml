  # =============================================================
  # Section: calculations
  # =============================================================
  - section: calculations
    instances:
      - name: bag_fee_third_bag_charged
        claim_type: correct_result
        grounds: [ calculations.bag_fee_assessment ]
        distinguishing_aspect: "Waterfall: bags 1 and 2 are free (included_bags=2), bag 3 costs 7500 cents — fee attaches at k > included, not k >= included."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX (included_bags=2), leg L1, passenger PA with CHECKED_IN journey J1"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", included_bags: 2 }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKG", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j1}/check-in"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
          trigger:
            - call: "POST /ops/journeys/${j1}/bags"
              payload: { weight_lbs: 20 }
              as: GateAgent
              captures: { fee1: $.data.bag_fee_cents }
            - call: "POST /ops/journeys/${j1}/bags"
              payload: { weight_lbs: 20 }
              as: GateAgent
              captures: { fee2: $.data.bag_fee_cents }
            - call: "POST /ops/journeys/${j1}/bags"
              payload: { weight_lbs: 20 }
              as: GateAgent
              captures: { fee3: $.data.bag_fee_cents }
          assert:
            - "bag 1 bag_fee_cents == 0 and bag 2 bag_fee_cents == 0"
            - "bag 3 bag_fee_cents == 7500"

      - name: bag_overweight_rejected_before_fee
        claim_type: constants_applied
        grounds: [ "validations[priority=14]", "errors[ERR_BAG_OVERWEIGHT]" ]
        distinguishing_aspect: "A 60-lb bag against the default 50-lb station limit is rejected with ERR_BAG_OVERWEIGHT even though the journey still has free bag slots — weight gate precedes fee waterfall."
        test_recipe:
          setup: ["station DAL (bag_weight_limit_lbs=50)/HOU, fare FLEX, leg L1, passenger PA with CHECKED_IN journey J1"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", included_bags: 2 }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKO", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j1}/check-in"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
          trigger:
            - call: "POST /ops/journeys/${j1}/bags"
              payload: { weight_lbs: 60 }
              as: GateAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BAG_OVERWEIGHT with HTTP 422"
            - "no Bag row created for the journey"

      - name: routing_slack_min_over_pairs
        claim_type: correct_result
        grounds: [ calculations.routing_slack ]
        distinguishing_aspect: "slack_minutes is the minimum over consecutive pairs: legs 12:00-13:00 → 13:50 (slack 15) → 15:30-16:30 yields min(15, ...) — pinned at 15 for the first pair and 65 for the second → routing.slack_minutes == 15."
        test_recipe:
          setup: ["stations DAL/HOU/AUS (min_connection 30), aircraft N100, legs L1 DAL→HOU 12:00-13:00, L2 HOU→AUS 13:50-14:50 (turn_target 35 → slack = 50-35 = 15), L3 AUS→DAL 15:30-16:30 (gap 40, turn 35 → slack 5)"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "AUS", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_aus: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN2", origin_station_id: "${st_hou}", destination_station_id: "${st_aus}", scheduled_departure_utc: "2026-10-01T13:50:00Z", scheduled_arrival_utc: "2026-10-01T14:50:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l2: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN3", origin_station_id: "${st_aus}", destination_station_id: "${st_dal}", scheduled_departure_utc: "2026-10-01T15:30:00Z", scheduled_arrival_utc: "2026-10-01T16:30:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l3: $.data.id }
          trigger:
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac}", leg_ids: ["${l1}", "${l2}", "${l3}"] }
              as: OpsController
              captures: { slack: $.data.slack_minutes }
          assert:
            - "AircraftRouting.slack_minutes == 5 (min of slack 15 (pair 1: 13:50-13:00-35) and slack 5 (pair 2: 15:30-14:50-35))"
            - "routing_status == ACTIVE"

      - name: routing_turn_equality_allowed
        claim_type: boundary_edge
        grounds: [ calculations.routing_slack, "validations[priority=8]" ]
        distinguishing_aspect: "Half-open turn semantics: STD_next - STA_prev == turn_target_next exactly (slack 0) is VALID — routing creation succeeds with slack_minutes == 0."
        test_recipe:
          setup: ["stations DAL/HOU (min_connection 30), aircraft N100, L1 DAL→HOU 12:00-13:00, L2 HOU→DAL STD 13:35 turn_target 35 (exact equality)"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN2", origin_station_id: "${st_hou}", destination_station_id: "${st_dal}", scheduled_departure_utc: "2026-10-01T13:35:00Z", scheduled_arrival_utc: "2026-10-01T14:35:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l2: $.data.id }
          trigger:
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac}", leg_ids: ["${l1}", "${l2}"] }
              as: OpsController
              captures: { slack: $.data.slack_minutes, status: $.data.routing_status }
          assert:
            - "creation succeeds (201) with slack_minutes == 0 — equality is allowed (half-open), not a violation"
            - "routing_status == ACTIVE"

