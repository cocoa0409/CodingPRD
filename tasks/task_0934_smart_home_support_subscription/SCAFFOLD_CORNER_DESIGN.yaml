  - section: endpoints
    instances:
      - name: reschedule_moves_the_visit_and_frees_the_vacated_slot
        claim_type: Action endpoint
        grounds: ["endpoints[POST /smart-home-support/visits/{id}/reschedule]", "state_machines.VisitSlot.capacity.BOOKED_to_OPEN", "calculations.slot_capacity_counts"]
        distinguishing_aspect: "Rescheduling more than 24 hours ahead returns the old slot to OPEN, books the new one, re-copies scheduled_start_at to 2026-05-10T13:00:00.000Z, and keeps the technician's counters at total 2 / open 1 / booked 1 / blocked 0."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; a PRO plan; a household in NWA with an OWNER and an ACTIVE subscription; a technician in NWA with slots 09:00-11:00 and 13:00-15:00 on 2026-05-10; one escalated P1 ticket booked into the 09:00 slot."]
