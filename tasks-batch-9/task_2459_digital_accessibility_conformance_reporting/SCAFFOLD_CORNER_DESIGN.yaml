          - calculations.remediation_budget_allocation
        distinguishing_aspect: "Allocation against a train that holds no COMMITTED issue for the requested product returns ERR_NO_FUNDABLE_ISSUES 422 and leaves allocation_state UNALLOCATED, distinguishing an empty candidate set from a zero-budget allocation."
        test_recipe:
          setup:
            - "One product whose only issue is still OPEN (never triaged, never committed)"
            - "One release train with remediation_budget_cents 60327 in allocation_state UNALLOCATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 2, target_remediation_date: "2026-09-25", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "Train 2026.09", window_start: "2026-09-05", window_end: "2026-09-27", freeze_days: 2, effort_capacity_points: 10, remediation_budget_cents: 60327 }
              as: AccessibilityLead
              captures: { train_id: $.data.id }
          trigger:
            - call: "POST /release-trains/${train_id}/allocate-budget"
              payload: { product_id: "${prod_id}" }
              as: AccessibilityLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == ERR_NO_FUNDABLE_ISSUES"
            - "ReleaseTrain.${train_id}.allocation_state == UNALLOCATED"
            - "ReleaseTrain.${train_id}.unallocated_cents == 60327"
            - "KnownIssue.${iss_id}.funded_cents == 0"
            - "KnownIssue.${iss_id}.funding_state == UNFUNDED"

      - name: corner_criterion_above_standard_max_level_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - entities.Standard.fields.max_target_level
        distinguishing_aspect: "A level AAA criterion under a standard whose max_target_level is AA returns ERR_LEVEL_OR_SURFACE_UNSUPPORTED 422 — an enum-valid level that the parent standard nonetheless does not reach, which is why this is not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One standard with max_target_level AA and surface_scope WEB, holding no criteria"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "EN_301_549", title: "EN 301 549 harmonised", surface_scope: "WEB", max_target_level: "AA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.4.6", title: "Contrast Enhanced", level: "AAA", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == ERR_LEVEL_OR_SURFACE_UNSUPPORTED"
            - "GET /standards/${std_id}/criteria returns total_count == 0"

