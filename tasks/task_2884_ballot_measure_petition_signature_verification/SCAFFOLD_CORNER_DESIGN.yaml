      - name: circulation_deadline_boundary_and_closed_challenge_window
        claim_type: temporal_validation
        grounds:
          - validations[priority 14]
          - errors[ERR_CIRCULATION_DEADLINE_PASSED]
          - errors[ERR_CHALLENGE_WINDOW_CLOSED]
          - entities.Petition.circulation_deadline
        distinguishing_aspect: |
          Two petitions cleared on the same day share one 2027-01-28 deadline, and the same
          filing call is made on either side of it: at exactly the deadline it must succeed
          (the rule is "at or before"), one day later it must fail. Only a two-petition
          fixture can show both, because a successful filing leaves the petition in
          SIGNATURES_FILED where a second attempt would be refused by the state gate
          instead. The challenge probe then shows the other temporal window: a petition that
          holds no pending determination cannot be challenged at all, and the code is the
          window code rather than a state code.
        test_recipe:
          setup:
            - "Standard SOS-W with circulation_window_days 180. Both petitions are cleared at 2026-08-01T00:00:00Z, so both carry circulation_deadline 2027-01-28T00:00:00.000Z."
            - "One circulator c1 holds two ACTIVE assignments with disjoint, buffer-clearing intervals (2026-08-01..2026-08-10 for petA, 2026-08-20..2026-08-31 for petB); assignment intervals gate coverage, not the filing clock."
            - "Each petition has one AFFIDAVIT_VERIFIED batch with one line signed 2026-08-05, so nothing but the deadline can block filing."
