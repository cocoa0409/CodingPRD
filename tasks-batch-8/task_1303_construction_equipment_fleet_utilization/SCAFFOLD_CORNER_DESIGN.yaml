# =============================================================================
# Task 1303 — Construction Equipment Fleet & Utilization
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1-§1.7 per references/claim-extraction-guide.md.
# Sections: entities / state_machines / calculations / validations /
# endpoints / errors / rbac / cross_cutting_layers / consistency_model.
# `excluded_because:` stubs mark corners already covered by §1.8 instances.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: equipment_class_creation_returns_201_and_persists_fields
        claim_type: creation
        grounds: [entities.EquipmentClass, "endpoints[POST /fleet/equipment-classes]"]
        distinguishing_aspect: "POST with all 9 required inputs returns 201; the persisted class echoes every input field and carries version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-100", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec_id: $.data.id, ec_v: $.data.version }
          trigger:
            - call: "GET /fleet/equipment-classes/${ec_id}"
              as: FleetAdmin
          assert:
            - "POST returned 201 and GET returns class_code == EXC-100, daily_rate_cents == 15000, weekend_multiplier_bp == 5000, service_interval_hours == 250"
            - "version == 1 and id/created_at/updated_at are server-minted (input cannot set them)"

      - name: equipment_creation_sets_initial_parallel_dimensions
        claim_type: creation
        grounds: [entities.Equipment, state_machines.Equipment.availability_status, state_machines.Equipment.maintenance_status]
        distinguishing_aspect: "A newly registered unit starts in the parallel initial state (availability IDLE x maintenance SERVICE_OK) with zeroed meters."
        test_recipe:
          setup: ["Class EC2 exists"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-101", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec2_id: $.data.id }
          trigger:
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-100", class_id: "${ec2_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e100_avail: $.data.availability_status, e100_maint: $.data.maintenance_status, e100_hours: $.data.engine_hours_milli }
          assert:
            - "availability_status == IDLE and maintenance_status == SERVICE_OK (both initial states)"
            - "engine_hours_milli == 0 and hours_at_last_service_milli == 0 and hours_since_service_milli == 0"
            - "current_project_id == null, current_site_id == null, disposed_at == null, residual_value_cents == null"

      - name: project_creation_sets_initial_derived_fields
        claim_type: creation
        grounds: [entities.Project, state_machines.Project]
        distinguishing_aspect: "A new project starts OPEN with computed fields billed_total_cents == 0 and active_assignment_count == 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-INIT", name: "Init", equipment_budget_cents: 500000 }
              as: FleetAdmin
              captures: { prj_id: $.data.id, prj_status: $.data.status, prj_billed: $.data.billed_total_cents, prj_aac: $.data.active_assignment_count }
          trigger: []
          assert:
            - "status == OPEN (initial_state), billed_total_cents == 0, active_assignment_count == 0, version == 1"

      - name: assignment_creation_reserved_with_null_computed_fields
        claim_type: creation
        grounds: [entities.Assignment, state_machines.Assignment]
        distinguishing_aspect: "A new assignment starts RESERVED; close-derived computed fields are at their pre-CLOSED pins (billable_days 0, utilization fields null, close_reason null)."
        test_recipe:
          setup: ["Class, OPEN project (budget 100000000), OWNED equipment all exist"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-102", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec3_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-102", name: "P102", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p102_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-102", class_id: "${ec3_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e102_id: $.data.id, e102_v: $.data.version }
          trigger:
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e102_id}", project_id: "${p102_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e102_v}" }
              as: FleetAdmin
              captures: { a102_status: $.data.status, a102_bd: $.data.billable_days, a102_ue: $.data.utilization_elapsed_bp }
          assert:
            - "status == RESERVED (initial_state); activated_at == null and closed_at == null"
            - "billable_days == 0, idle_days == 0, engine_hours_billed_milli == 0 (pre-CLOSED pins)"
            - "utilization_elapsed_bp == null and utilization_billing_bp == null and close_reason == null"

      - name: mechanic_and_lowboy_creation_initial_states
        claim_type: creation
        grounds: [entities.Mechanic, entities.Lowboy, state_machines.Mechanic, state_machines.Lowboy]
        distinguishing_aspect: "Mechanic starts AVAILABLE with active_work_order_count 0; Lowboy starts AVAILABLE."
        test_recipe:
          setup: ["Project PH exists"]
          setup_api_calls:
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-HOME", name: "Home Yard", equipment_budget_cents: 1000000 }
              as: FleetAdmin
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-100", name: "Mac Hundred", home_project_id: "${ph_id}" }
              as: FleetAdmin
              captures: { m100_status: $.data.status, m100_count: $.data.active_work_order_count }
            - call: "POST /fleet/lowboys"
              payload: { lowboy_code: "LB-100", capacity_units: 1 }
              as: Dispatcher
              captures: { l100_status: $.data.status }
          assert:
            - "Mechanic.status == AVAILABLE and active_work_order_count == 0"
            - "Lowboy.status == AVAILABLE"

      - name: equipment_missing_required_date_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Equipment.fields.acquisition_date, "validations[priority=5]"]
        distinguishing_aspect: "Omitting required input acquisition_date on POST /fleet/equipment -> 400 ERR_INVALID_REQUEST (priority-5 well-formedness)."
        test_recipe:
          setup: ["Class EC6 exists"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-106", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec6_id: $.data.id }
          trigger:
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-106", class_id: "${ec6_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, useful_life_months: 48 }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400 (missing required acquisition_date)"

      - name: equipment_invalid_ownership_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Equipment.fields.ownership, "validations[priority=5]"]
        distinguishing_aspect: "ownership = LEASED (not in enum OWNED|RENTED) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Class EC7 exists"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-107", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec7_id: $.data.id }
          trigger:
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-107", class_id: "${ec7_id}", ownership: "LEASED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400 (enum violation)"

      - name: reading_delta_range_boundary_24000_ok_24001_rejected
        claim_type: type_constraints
        grounds: [entities.TelematicsReading.fields.engine_hours_delta_milli, "validations[priority=5]"]
        distinguishing_aspect: "engine_hours_delta_milli upper range edge: 24000 (== 24 h) accepted with 201, 24001 rejected 400 ERR_INVALID_REQUEST — exact integer range boundary."
        test_recipe:
          setup: ["Class EC8 (service_interval_hours 10000) and Equipment E108 exist"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-108", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec8_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-108", class_id: "${ec8_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e108_id: $.data.id }
          trigger:
            - call: "POST /fleet/equipment/${e108_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 24000, fuel_used_milliliters: 1000 }
              as: FleetAdmin
              captures: { r108_status: $.data.status }
            - call: "POST /fleet/equipment/${e108_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 24001, fuel_used_milliliters: 1000 }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "24000 milli accepted (201, status ACCEPTED)"
            - "24001 milli rejected: error_id == ERR_INVALID_REQUEST, http 400"

      - name: assignment_end_not_after_start_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Assignment.fields.end_date, "validations[priority=5]"]
        distinguishing_aspect: "end_date == start_date (empty half-open window) violates end_date > start_date -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Class, project, equipment exist; equipment version captured"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-109", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec9_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-109", name: "P109", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p109_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-109", class_id: "${ec9_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e109_id: $.data.id, e109_v: $.data.version }
          trigger:
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e109_id}", project_id: "${p109_id}", start_date: "2026-08-05", end_date: "2026-08-05", expected_equipment_version: "${e109_v}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400 (end_date must be > start_date)"
            - "Equipment.${e109_id}.availability_status == IDLE (no reservation created)"

      - name: transport_structural_constraints_rejected
        claim_type: type_constraints
        grounds: [entities.TransportJob.fields.to_project_id, entities.TransportJob.fields.arrive_at, "validations[priority=5]"]
        distinguishing_aspect: "Two structural rules: to_project_id == from_project_id rejected, and arrive_at <= depart_at rejected — both 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Class, projects PA/PB, lowboy, equipment IDLE at PA after a closed assignment"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-110", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec10_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-110A", name: "PA", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-110B", name: "PB", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /fleet/lowboys"
              payload: { lowboy_code: "LB-110", capacity_units: 1 }
              as: Dispatcher
              captures: { l110_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-110", class_id: "${ec10_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e110_id: $.data.id, e110_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e110_id}", project_id: "${pa_id}", start_date: "2026-08-03", end_date: "2026-08-06", expected_equipment_version: "${e110_v}" }
              as: FleetAdmin
              captures: { a110_id: $.data.id }
            - call: "POST /fleet/assignments/${a110_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a110_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/transport-jobs"
              payload: { equipment_id: "${e110_id}", from_project_id: "${pa_id}", to_project_id: "${pa_id}", lowboy_id: "${l110_id}", depart_at: "2026-08-12T08:00:00Z", arrive_at: "2026-08-12T12:00:00Z" }
              as: Dispatcher
              captures: { err1: $.data.error_id }
            - call: "POST /fleet/transport-jobs"
              payload: { equipment_id: "${e110_id}", from_project_id: "${pa_id}", to_project_id: "${pb_id}", lowboy_id: "${l110_id}", depart_at: "2026-08-12T12:00:00Z", arrive_at: "2026-08-12T08:00:00Z" }
              as: Dispatcher
              captures: { err2: $.data.error_id }
          assert:
            - "Same origin/destination: error_id == ERR_INVALID_REQUEST, http 400"
            - "arrive_at < depart_at: error_id == ERR_INVALID_REQUEST, http 400"
            - "Equipment.${e110_id}.availability_status == IDLE (neither attempt created a job)"

      - name: damage_line_items_cardinality_bounds
        claim_type: type_constraints
        grounds: [entities.DamageReport.fields.line_items, "validations[priority=5]"]
        distinguishing_aspect: "line_items cardinality 1..20: an empty array and a 21-item array are both rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Equipment E111 ON_RENT at project P111 via ACTIVE assignment"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-111", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec11_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-111", name: "P111", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p111_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-111", class_id: "${ec11_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e111_id: $.data.id, e111_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e111_id}", project_id: "${p111_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e111_v}" }
              as: FleetAdmin
              captures: { a111_id: $.data.id }
            - call: "POST /fleet/assignments/${a111_id}/activate"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/damage-reports"
              payload: { equipment_id: "${e111_id}", project_id: "${p111_id}", description: "empty items", abuse_flag: false, line_items: [] }
              as: FleetAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /fleet/damage-reports"
              payload: { equipment_id: "${e111_id}", project_id: "${p111_id}", description: "too many", abuse_flag: false, line_items: [{ description: "i1", amount_cents: 1 }, { description: "i2", amount_cents: 1 }, { description: "i3", amount_cents: 1 }, { description: "i4", amount_cents: 1 }, { description: "i5", amount_cents: 1 }, { description: "i6", amount_cents: 1 }, { description: "i7", amount_cents: 1 }, { description: "i8", amount_cents: 1 }, { description: "i9", amount_cents: 1 }, { description: "i10", amount_cents: 1 }, { description: "i11", amount_cents: 1 }, { description: "i12", amount_cents: 1 }, { description: "i13", amount_cents: 1 }, { description: "i14", amount_cents: 1 }, { description: "i15", amount_cents: 1 }, { description: "i16", amount_cents: 1 }, { description: "i17", amount_cents: 1 }, { description: "i18", amount_cents: 1 }, { description: "i19", amount_cents: 1 }, { description: "i20", amount_cents: 1 }, { description: "i21", amount_cents: 1 }] }
              as: FleetAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "0 items: error_id == ERR_INVALID_REQUEST, http 400"
            - "21 items: error_id == ERR_INVALID_REQUEST, http 400"

      - name: work_order_notes_default_and_damage_dispute_note_default
        claim_type: defaults
        grounds: [entities.WorkOrder.fields.notes, entities.DamageReport.fields.dispute_note, entities.TelematicsReading.fields.void_reason]
        distinguishing_aspect: "Fields declared with defaults: omitting notes on work-order create yields notes == \"\"; a freshly filed damage report has dispute_note == null; a fresh reading has void_reason == null."
        test_recipe:
          setup: ["Class, project, equipment exist"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-112", daily_rate_cents: 15000, external_daily_rate_cents: 18000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 2500, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec12_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-112", name: "P112", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p112_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-112", class_id: "${ec12_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e112_id: $.data.id, e112_v: $.data.version }
          trigger:
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e112_id}", kind: "REPAIR" }
              as: FleetAdmin
              captures: { w112_notes: $.data.notes }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e112_id}", project_id: "${p112_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e112_v}" }
              as: FleetAdmin
              captures: { a112_id: $.data.id }
            - call: "POST /fleet/assignments/${a112_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/damage-reports"
              payload: { equipment_id: "${e112_id}", project_id: "${p112_id}", description: "scratch", abuse_flag: false, line_items: [{ description: "paint", amount_cents: 500 }] }
              as: FleetAdmin
              captures: { d112_note: $.data.dispute_note }
            - call: "POST /fleet/equipment/${e112_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 1000, fuel_used_milliliters: 500 }
              as: FleetAdmin
              captures: { r112_void: $.data.void_reason }
          assert:
            - "WorkOrder.notes == \"\" (declared default applied when omitted)"
            - "DamageReport.dispute_note == null and TelematicsReading.void_reason == null (nullable defaults)"

      - name: assignment_charge_rows_are_immutable_without_version
        claim_type: immutability
        grounds: [entities.AssignmentCharge]
        distinguishing_aspect: "AssignmentCharge has common_fields: false — the posted charge row exposes id and created_at but NO version / updated_at fields, and no update endpoint exists."
        test_recipe:
          setup: ["Class, project (budget 100000000), OWNED equipment; ACTIVE assignment closed at 2026-08-04 posting one charge"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-113", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec13_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-113", name: "P113", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p113_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-113", class_id: "${ec13_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
