  # ==========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ot_threshold_exact_480_zero_ot
        grounds:
          - calculations.crew_daily_billing
          - entities.BillingRateSchedule.fields.ot_threshold_minutes
        distinguishing_aspect: |
          Metric: minutes at the OT threshold, endpoint POST /timesheets/{id}/certify.
          Exactly 480 min => ot == 0 (strictly-beyond semantics) => 140600; one
          minute later (481) => one OT minute priced 300c before premium => 140930.
          The >= vs > pin decides a 330-cent difference.
        test_recipe:
          setup: ["Event ACTIVE; request FULFILLED; one ARRIVED+CLEARED LINE crew with equipment 35000c/day; clock 2026-05-06T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
