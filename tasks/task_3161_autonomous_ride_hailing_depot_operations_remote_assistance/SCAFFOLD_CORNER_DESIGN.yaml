            - "the TerritoryPlanner call returns 201 with ServiceTerritory.${t_id}.region_code == \"PHX-METRO\""


  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: if_match_expansion_submit_stale_territory_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[request-expansion-stale-territory]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on the territory: submitting an expansion with a stale expected_territory_version is rejected with ERR_STALE_VERSION 412, while a freshly re-read version succeeds — a different parent entity than the vehicle OCC rule."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One territory with mapped_pct 50; the client has recorded territory.version as ${t_captured_v} and a mapping tick has since advanced it."]
          setup_api_calls:
            - *c_clock
            - call: "POST /fleet/territories"
              payload: { name: "Phoenix Metro", region_code: "PHX-METRO", mapped_pct: 50, validation_hours: 0, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t_id: $.data.id, t_captured_v: $.data.version }
            - call: "POST /fleet/territories/${t_id}/mapping-ticks"
              payload: { mapped_pct_delta: 10 }
              as: MappingEngineer
          trigger:
            - call: "POST /fleet/territories/${t_id}/expansion-requests"
              payload: { target_region_code: "PHX-NORTH", expected_territory_version: "${t_captured_v}" }
              as: TerritoryPlanner
              captures: { stale_err: $.data.error_id, territory_v_now: $.data.version }
            - call: "POST /fleet/territories/${t_id}/expansion-requests"
              payload: { target_region_code: "PHX-NORTH", expected_territory_version: "${t_captured_v} + 1" }
              as: TerritoryPlanner
              captures: { exp_id: $.data.id }
          assert:
            - "the stale submit returns error_id ERR_STALE_VERSION and http == 412"
            - "the fresh submit returns 201 with ServiceAreaExpansionRequest.${exp_id}.status == SUBMITTED"
            - "ServiceAreaExpansionRequest.${exp_id}.mapped_pct_at_submit == 60"

      - name: if_match_selector_picks_highest_battery_ties_broken_by_created_at
