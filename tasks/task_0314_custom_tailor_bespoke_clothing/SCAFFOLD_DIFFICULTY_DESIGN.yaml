  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_final_fail_remake_credit_fabric_risk_depth3
        grounds:
          - state_machines.Fitting.SCHEDULED_to_FAILED
          - state_machines.GarmentOrder.IN_FITTING_to_REMAKE
          - calculations.remake_compensation
          - calculations.customer_remake_risk
          - entities.Fabric.fields.bolt_meters_remaining
        distinguishing_aspect: |
          Depth-3 chain originating at record-outcome FAIL on a FINAL Fitting: Fitting->FAILED (A)
          forces GarmentOrder IN_FITTING->REMAKE (B), which itself mutates Customer credit/risk and
          Fabric bolt reservation (C); each link is caused by the previous, not by the trigger.
        test_recipe:
          setup:
            - "Order O5 at a SCHEDULED FINAL fitting, deposit paid, MASTER tailor, fabric bolt 100m @ 8000."
            - "Order locked 97500; meters 7.0 -> 7m reserved at confirm leaving 93m before remake."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Five", email: "c5.tc@x.com" }
              as: SalesAssociate
              captures: { c5_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c5_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp5_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool TC", price_per_meter_cents: 8000, bolt_meters_initial: 100 }
              as: ShopManager
              captures: { f5_id: $.data.id }
            - call: "POST /tailors"
              payload: { display_name: "Master TC", skill_tier: "MASTER" }
              as: ShopManager
              captures: { tm5_id: $.data.id }
            - call: "POST /fitting-rooms"
              payload: { room_name: "R TC", cleanup_buffer_minutes: 0 }
              as: ShopManager
              captures: { ro5_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c5_id}", measurement_profile_id: "${mp5_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o5_id: $.data.id }
            - call: "POST /orders/${o5_id}/option-lines"
              payload: { fabric_id: "${f5_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o5_id}/option-lines"
              payload: { fabric_id: "${f5_id}", option_code: "CONTRAST_LINING" }
              as: SalesAssociate
            - call: "POST /orders/${o5_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { o5_v_conf: $.data.version }
            - call: "POST /orders/${o5_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 48750 }
              as: SalesAssociate
            - call: "POST /orders/${o5_id}/fittings"
              payload: { tailor_id: "${tm5_id}", room_id: "${ro5_id}", milestone: "BASTED", start_at: "2026-07-01T09:00:00.000Z", end_at: "2026-07-01T10:00:00.000Z", expected_order_version: "${o5_v_conf}" }
              as: FittingSpecialist
              captures: { o5_fb: $.data.id, o5_v_b: $.data.version }
            - call: "POST /orders/${o5_id}/fittings/${o5_fb}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o5_id}/fittings"
              payload: { tailor_id: "${tm5_id}", room_id: "${ro5_id}", milestone: "FORWARD", start_at: "2026-07-02T09:00:00.000Z", end_at: "2026-07-02T10:00:00.000Z", expected_order_version: "${o5_v_b}" }
              as: FittingSpecialist
              captures: { o5_ff: $.data.id, o5_v_f: $.data.version }
            - call: "POST /orders/${o5_id}/fittings/${o5_ff}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o5_id}/fittings"
              payload: { tailor_id: "${tm5_id}", room_id: "${ro5_id}", milestone: "FINAL", start_at: "2026-07-03T09:00:00.000Z", end_at: "2026-07-03T10:00:00.000Z", expected_order_version: "${o5_v_f}" }
              as: FittingSpecialist
              captures: { o5_fn: $.data.id }
          trigger:
            - call: "POST /orders/${o5_id}/fittings/${o5_fn}/record-outcome"
