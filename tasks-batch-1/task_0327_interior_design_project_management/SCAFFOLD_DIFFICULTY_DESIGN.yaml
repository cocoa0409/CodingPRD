# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Interior Design Project Management — Expert
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every assert numeric literal was computed by code against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: hourly_fee_provisional_vs_final_diverge_on_project
        grounds:
          - calculations.design_fee_final
          - state_machines.TimeEntry.SUBMITTED_to_APPROVED
          - entities.Project.fields.design_fee_cents
        distinguishing_aspect: "On an HOURLY Project, provisional fee counts SUBMITTED+APPROVED billable time (3.5h -> 52500c) while final counts only APPROVED billable time (2.75h -> 41250c); the two variants diverge on the SAME Project's design fee."
        test_recipe:
          setup:
            - "An HOURLY Project (hourly_rate_cents=15000) driven to INSTALLATION: one APPROVED room, one DELIVERED order."
            - "Three billable TimeEntry: 50min and 95min APPROVED, 40min still SUBMITTED (so provisional 3.5h, final 2.75h)."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Acme", email: "acme1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Acme", client_user_id: "${cid}", brief_summary: "loft", budget_cents: 100000000, fee_model: "HOURLY", hourly_rate_cents: 15000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "HF-A", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/advance", payload: { to: "IN_DESIGN" }, as: Designer }
            - { call: "POST /projects/${pid}/advance", payload: { to: "PROCUREMENT" }, as: Designer }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 1, spec_note: "a" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv: $.data.version } }
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/ship", payload: {}, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/deliver", payload: {}, as: ProcurementCoordinator }
            - { call: "POST /projects/${pid}/advance", payload: { to: "INSTALLATION" }, as: ProcurementCoordinator }
            - { call: "POST /projects/${pid}/time-entries", payload: { designer_user_id: "d1", minutes: 50, billable: true }, as: Designer, captures: { t1: $.data.id } }
            - { call: "POST /projects/${pid}/time-entries", payload: { designer_user_id: "d1", minutes: 95, billable: true }, as: Designer, captures: { t2: $.data.id } }
            - { call: "POST /projects/${pid}/time-entries", payload: { designer_user_id: "d1", minutes: 40, billable: true }, as: Designer, captures: { t3: $.data.id } }
            - { call: "POST /time-entries/${t1}/approve", payload: {}, as: StudioAdmin }
            - { call: "POST /time-entries/${t2}/approve", payload: {}, as: StudioAdmin }
          trigger:
            - { call: "GET /projects/${pid}/fee-quote", payload: {}, as: StudioAdmin, captures: { open_fee: $.data.design_fee_cents } }
            - { call: "POST /projects/${pid}/close", payload: {}, as: StudioAdmin, captures: { final_fee: $.data.design_fee_cents } }
          assert:
            - "GET /projects/${pid}/fee-quote provisional design_fee_cents == 52500 (3.5h * 15000c, SUBMITTED+APPROVED billable)"
            - "After close, Project.${pid}.design_fee_cents == 41250 (2.75h * 15000c, APPROVED only)"
            - "Project.${pid}.status == CLOSED; the DELIVERED order O1 satisfies the close precondition"

      - name: markup_fee_provisional_vs_final_diverge_on_committed_base
        grounds:
          - calculations.design_fee_final
          - calculations.order_subtotal
          - entities.ProcurementOrder.fields.order_subtotal_cents
        distinguishing_aspect: "On a MARKUP Project, provisional fee bases markup on DRAFT+committed order subtotals (0.30*(64893+40000)=31468c) while final bases markup only on committed {ORDERED,IN_TRANSIT,DELIVERED} subtotals (0.30*64893=19468c); divergence is on the Project's procurement base, a different domain than the hourly time domain."
        test_recipe:
          setup:
            - "A MARKUP Project (markup_pct=0.30) with one APPROVED room and an ACTIVE vendor."
            - "Order O1 (subtotal 64893) is placed (ORDERED); order O2 (subtotal 40000) is still DRAFT."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Beta", email: "beta1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Beta", client_user_id: "${cid}", brief_summary: "villa", budget_cents: 100000000, fee_model: "MARKUP", markup_pct: 0.30 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V1", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "S-A", name: "Chair", category: "FURNITURE", list_unit_cost_cents: 12999, lead_time_days: 10 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "S-B", name: "Lamp", category: "LIGHTING", list_unit_cost_cents: 4550, lead_time_days: 5 }, as: StudioAdmin, captures: { f2: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "S-C", name: "Vase", category: "DECOR", list_unit_cost_cents: 899, lead_time_days: 2 }, as: StudioAdmin, captures: { f3: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "S-D", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 7 }, as: StudioAdmin, captures: { f4: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "Great Room", scope_note: "main", room_budget_cents: 5000000 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["oak"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 3, trade_discount_pct: 0.125, spec_note: "oak" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f2}", quantity: 7, trade_discount_pct: 0.175, spec_note: "brass" }, as: Designer, captures: { s2: $.data.id } }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f3}", quantity: 5, trade_discount_pct: 0.0, spec_note: "glass" }, as: Designer, captures: { s3: $.data.id } }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f4}", quantity: 2, trade_discount_pct: 0.0, spec_note: "linen" }, as: Designer, captures: { s4: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /selections/${s2}/specify", payload: {}, as: Designer }
            - { call: "POST /selections/${s3}/specify", payload: {}, as: Designer }
            - { call: "POST /selections/${s4}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s2}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s3}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv: $.data.version } }
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv}" }, as: ProcurementCoordinator }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o2: $.data.id } }
            - { call: "POST /orders/${o2}/lines", payload: { selection_id: "${s4}" }, as: ProcurementCoordinator }
          trigger:
            - { call: "GET /projects/${pid}/fee-quote", payload: {}, as: StudioAdmin, captures: { open_fee: $.data.design_fee_cents } }
          assert:
            - "ProcurementOrder.${o1}.order_subtotal_cents == 64893 (round-then-sum: 34122+26276+4495)"
            - "ProcurementOrder.${o2}.order_subtotal_cents == 40000"
            - "Provisional design_fee_cents on fee-quote == 31468 (0.30*(64893+40000) round_half_up)"
            - "Project.${pid}.committed_cents == 64893 (only the placed ORDERED order O1)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_subtotal_round_then_sum_pinned
        grounds:
          - calculations.order_subtotal
          - calculations.selection_line_net
          - entities.DesignSelection.fields.line_net_cents
        distinguishing_aspect: "Mode (b) nested-rounding-order: per-line round_half_up THEN integer sum yields 64893; the forbidden sum-then-round would yield 64894 (raw 64893.625). The scaffold pins round-then-sum, so the asserted subtotal is 64893."
        test_recipe:
          setup:
            - "Project (FLAT) with one APPROVED room; three SPECIFIED selections with fractional-cent line nets attached to a DRAFT order."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Cee", email: "cee1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Cee", client_user_id: "${cid}", brief_summary: "flat", budget_cents: 100000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "RC-A", name: "Chair", category: "FURNITURE", list_unit_cost_cents: 12999, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "RC-B", name: "Lamp", category: "LIGHTING", list_unit_cost_cents: 4550, lead_time_days: 1 }, as: StudioAdmin, captures: { f2: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "RC-C", name: "Vase", category: "DECOR", list_unit_cost_cents: 899, lead_time_days: 1 }, as: StudioAdmin, captures: { f3: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 3, trade_discount_pct: 0.125, spec_note: "a" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f2}", quantity: 7, trade_discount_pct: 0.175, spec_note: "b" }, as: Designer, captures: { s2: $.data.id } }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f3}", quantity: 5, trade_discount_pct: 0.0, spec_note: "c" }, as: Designer, captures: { s3: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /selections/${s2}/specify", payload: {}, as: Designer }
            - { call: "POST /selections/${s3}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s2}" }, as: ProcurementCoordinator }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s3}" }, as: ProcurementCoordinator }
          assert:
            - "DesignSelection.${s1}.line_net_cents == 34122 (round_half_up(12999*3*0.875)=round(34122.375))"
            - "DesignSelection.${s2}.line_net_cents == 26276 (round_half_up(4550*7*0.825)=round(26276.25))"
            - "DesignSelection.${s3}.line_net_cents == 4495"
            - "ProcurementOrder.${o1}.order_subtotal_cents == 64893 (round-then-sum, NOT 64894)"

      - name: budget_health_tiered_threshold_three_inputs
        grounds:
          - calculations.budget_health
          - entities.Project.fields.budget_status
          - entities.Project.fields.budget_remaining_cents
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: budget_status = tier( (committed_cents + design_fee_cents) / budget_cents ) selects among GREEN/AMBER/RED from three independent inputs; at committed=64893, FLAT fee=15107, budget=100000 utilization is exactly 0.80 -> GREEN (lower-tier-inclusive). Different mode and different metric than the round-then-sum instance."
        test_recipe:
          setup:
            - "FLAT Project (flat_fee_cents=15107, budget_cents=100000), one APPROVED room, ACTIVE vendor."
            - "One placed order with subtotal exactly 64893."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Dee", email: "dee1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Dee", client_user_id: "${cid}", brief_summary: "bud", budget_cents: 100000, fee_model: "FLAT", flat_fee_cents: 15107 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "BG-A", name: "Chair", category: "FURNITURE", list_unit_cost_cents: 12999, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "BG-B", name: "Lamp", category: "LIGHTING", list_unit_cost_cents: 4550, lead_time_days: 1 }, as: StudioAdmin, captures: { f2: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "BG-C", name: "Vase", category: "DECOR", list_unit_cost_cents: 899, lead_time_days: 1 }, as: StudioAdmin, captures: { f3: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 3, trade_discount_pct: 0.125, spec_note: "a" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f2}", quantity: 7, trade_discount_pct: 0.175, spec_note: "b" }, as: Designer, captures: { s2: $.data.id } }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f3}", quantity: 5, trade_discount_pct: 0.0, spec_note: "c" }, as: Designer, captures: { s3: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /selections/${s2}/specify", payload: {}, as: Designer }
            - { call: "POST /selections/${s3}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s2}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s3}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv}" }, as: ProcurementCoordinator }
          assert:
            - "Project.${pid}.committed_cents == 64893"
            - "Project.${pid}.budget_remaining_cents == 20000 (100000 - 64893 - 15107)"
            - "Project.${pid}.budget_status == GREEN (utilization exactly 0.80, lower-tier-inclusive)"
            - "Project.${pid}.posture == OPEN"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: revision_resubmit_cycle_increments_round_no
        grounds:
          - state_machines.RevisionRequest.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.RevisionRequest.CHANGES_REQUESTED_to_SUBMITTED
          - entities.RevisionRequest.fields.round_no
        distinguishing_aspect: "RevisionRequest is cyclic SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED; the second SUBMITTED arrival increments round_no to 2, proving a true loop on the RevisionRequest entity (not a linear pipeline)."
        test_recipe:
          setup:
            - "Project in IN_DESIGN with a room; a Client revision in CHANGES_REQUESTED after one round-trip."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Eve", email: "eve1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Eve", client_user_id: "${cid}", brief_summary: "rev", budget_cents: 10000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /projects/${pid}/advance", payload: { to: "IN_DESIGN" }, as: Designer }
            - { call: "POST /projects/${pid}/revisions", payload: { target_kind: "ROOM", target_id: "${rid}", note: "change drapes" }, as: Client, as_user_id: "${cid}", captures: { rev: $.data.id } }
            - { call: "POST /revisions/${rev}/submit", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /revisions/${rev}/request-changes", payload: {}, as: Designer }
          trigger:
            - { call: "POST /revisions/${rev}/submit", payload: {}, as: Client, as_user_id: "${cid}", captures: { st: $.data.status, rn: $.data.round_no } }
          assert:
            - "RevisionRequest.${rev}.status == SUBMITTED (looped back from CHANGES_REQUESTED)"
            - "RevisionRequest.${rev}.round_no == 2"

      - name: order_branch_deliver_vs_cancel_divergent_side_effects
        grounds:
          - state_machines.ProcurementOrder.ORDERED_to_IN_TRANSIT
          - state_machines.ProcurementOrder.ORDERED_to_CANCELLED
          - entities.DesignSelection.fields.status
        distinguishing_aspect: "ProcurementOrder branches from ORDERED: the IN_TRANSIT branch keeps attached selections ORDERED, the CANCELLED branch reverts them to SPECIFIED and recomputes committed_cents; divergent side-effect sets per branch on a different entity than RevisionRequest."
        test_recipe:
          setup:
            - "Two placed orders O1 and O2 (each ORDERED) on a FLAT project, each carrying one SPECIFIED selection."
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Fox", email: "fox1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Fox", client_user_id: "${cid}", brief_summary: "br", budget_cents: 100000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V1", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { v1: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V2", trade: "MILLWORK" }, as: ProcurementCoordinator, captures: { v2: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "BR-A", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 3 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "BR-B", name: "Table", category: "FURNITURE", list_unit_cost_cents: 30000, lead_time_days: 3 }, as: StudioAdmin, captures: { f2: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
