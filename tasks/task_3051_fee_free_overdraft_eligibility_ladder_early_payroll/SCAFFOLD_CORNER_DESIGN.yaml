scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: member_creation_persists_fields
        claim_type: creation
        grounds: ["entities.Member"]
        distinguishing_aspect: "POST /banking/members with all required fields returns 201 with system-minted id (prefix-free UUID), created_at, version 1, status ENROLLED, current_limit_cents 0."
        test_recipe:
          setup: ["empty database; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /banking/members"
              payload: { external_ref: "c1", full_name: "C One", enrolled_at: "2026-01-01T00:00:00Z" }
              as: ProgramOps
              captures: { c1_id: $.data.id, c1_status: $.data.status, c1_limit: $.data.current_limit_cents, c1_v: $.data.version }
          assert:
            - "Member.status == ENROLLED (initial state)"
            - "Member.current_limit_cents == 0 and consecutive_on_time_repayments == 0"
            - "Member.version == 1 and id is a UUID without a type prefix"

      - name: member_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Member", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required full_name yields ERR_INVALID_REQUEST (400); no member is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /banking/members"
              payload: { external_ref: "c2", enrolled_at: "2026-01-01T00:00:00Z" }
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: member_duplicate_external_ref_returns_duplicate
        claim_type: type_constraints
        grounds: ["entities.Member.fields.external_ref", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second member with the same external_ref is rejected with ERR_DUPLICATE (409) even though all other fields differ."
        test_recipe:
          setup: ["member c3 exists with external_ref dup-1"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "dup-1", full_name: "C Three", enrolled_at: "2026-01-01T00:00:00Z" }
              as: ProgramOps
          trigger:
            - call: "POST /banking/members"
              payload: { external_ref: "dup-1", full_name: "C Three Clone", enrolled_at: "2026-02-01T00:00:00Z" }
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE, http 409"

      - name: deposit_account_savings_excluded_from_cushion
        claim_type: type_constraints
        grounds: ["entities.DepositAccount.fields.account_type", "errors[ERR_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "SAVINGS accounts never participate in the cushion program: an advance on a SAVINGS account is rejected with ERR_LIMIT_EXCEEDED even when the member is ELIGIBLE."
        test_recipe:
          setup: ["member c4 ELIGIBLE with limit 2000 (2 settled qualifying deposits, tenure 365d) and a SAVINGS account"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c4", full_name: "C Four", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c4: $.data.id, c4_v0: $.data.version }
            - call: "POST /banking/members/${c4}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c4a: $.data.id }
            - call: "POST /banking/accounts/${c4a}/deposits"
              payload: { originator_id: "EMPC4", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c4-t1" }
              as: SponsorBankOps
              captures: { c4d1: $.data.id }
            - call: "POST /banking/accounts/${c4a}/deposits"
              payload: { originator_id: "EMPC4", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "c4-t2" }
              as: SponsorBankOps
              captures: { c4d2: $.data.id }
            - call: "POST /banking/deposits/${c4d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${c4d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${c4}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c4_v0}" }
              as: ProgramOps
            - call: "POST /banking/members/${c4}/accounts"
              payload: { account_type: "SAVINGS" }
              as: SponsorBankOps
              captures: { c4sav: $.data.id, c4sav_v: $.data.version }
          trigger:
            - call: "POST /banking/accounts/${c4sav}/advances"
              payload: { amount_cents: 500, idempotency_key: "c4-sav-adv", expected_account_version: "${c4sav_v}" }
              as: Member
              as_user_id: "${c4}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LIMIT_EXCEEDED (SAVINGS account has usable_cushion 0 regardless of member limit)"

      - name: ledger_entry_reverse_reachability_by_account
        claim_type: retrieval
        grounds: ["entities.LedgerEntry.fields.account_id"]
        distinguishing_aspect: "GET /banking/accounts/{id}/ledger-entries returns the entries posted against the account (reverse FK traversal), in this case the single DEPOSIT_SETTLEMENT entry."
        test_recipe:
          setup: ["member c5 with SPENDING account and one settled 10000 deposit"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c5", full_name: "C Five", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c5: $.data.id }
            - call: "POST /banking/members/${c5}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c5a: $.data.id }
            - call: "POST /banking/accounts/${c5a}/deposits"
              payload: { originator_id: "EMPC5", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c5-t1" }
              as: SponsorBankOps
              captures: { c5d1: $.data.id }
            - call: "POST /banking/deposits/${c5d1}/settle"
              payload: {}
              as: SponsorBankOps
          trigger:
            - call: "GET /banking/accounts/${c5a}/ledger-entries"
              payload: {}
              as: SponsorBankOps
              captures: { e0_type: "$.data[0].entry_type", e0_pl: "$.data[0].program_leg_cents", e0_bl: "$.data[0].bank_leg_cents" }
          assert:
            - "exactly 1 LedgerEntry exists for the account"
            - "entry_type == DEPOSIT_SETTLEMENT, program_leg_cents == 10000, bank_leg_cents == -10000"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent member id returns ERR_NOT_FOUND (404); a child under a wrong parent also reports the child as not found."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /banking/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: settle_before_settlement_date_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.DirectDeposit.RECEIVED_FILE_to_SETTLED", "errors[ERR_TEMPORAL_VIOLATION]"]
        distinguishing_aspect: "Settling a deposit whose settlement_date is in the future is rejected with ERR_TEMPORAL_VIOLATION; the deposit remains RECEIVED_FILE."
        test_recipe:
          setup: ["member c6 with SPENDING account; deposit settles 2026-09-10 (future)"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c6", full_name: "C Six", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c6: $.data.id }
            - call: "POST /banking/members/${c6}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c6a: $.data.id }
            - call: "POST /banking/accounts/${c6a}/deposits"
              payload: { originator_id: "EMPC6", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-09-10T00:00:00Z", trace_id: "c6-t1" }
              as: SponsorBankOps
              captures: { c6d1: $.data.id }
          trigger:
            - call: "POST /banking/deposits/${c6d1}/settle"
              payload: {}
              as: SponsorBankOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPORAL_VIOLATION, http 422"
            - "DirectDeposit.${c6d1}.status remains RECEIVED_FILE"

      - name: double_settle_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.DirectDeposit", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second settle on an already SETTLED deposit is rejected with ERR_INVALID_STATE and does not double-credit posted_balance_cents."
        test_recipe:
          setup: ["member c7 with SPENDING account; one deposit settled"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c7", full_name: "C Seven", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c7: $.data.id }
            - call: "POST /banking/members/${c7}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c7a: $.data.id }
            - call: "POST /banking/accounts/${c7a}/deposits"
              payload: { originator_id: "EMPC7", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c7-t1" }
              as: SponsorBankOps
              captures: { c7d1: $.data.id }
            - call: "POST /banking/deposits/${c7d1}/settle"
              payload: {}
              as: SponsorBankOps
          trigger:
            - call: "POST /banking/deposits/${c7d1}/settle"
              payload: {}
              as: SponsorBankOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "posted_balance_cents remains 10000 (no double credit)"

      - name: return_received_file_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DirectDeposit", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Return is legal only from POSTED_EARLY or SETTLED; returning a RECEIVED_FILE deposit fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["member c8 with SPENDING account; deposit in RECEIVED_FILE (settlement in past, never settled)"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c8", full_name: "C Eight", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c8: $.data.id }
            - call: "POST /banking/members/${c8}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c8a: $.data.id }
            - call: "POST /banking/accounts/${c8a}/deposits"
              payload: { originator_id: "EMPC8", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c8-t1" }
              as: SponsorBankOps
              captures: { c8d1: $.data.id }
          trigger:
            - call: "POST /banking/deposits/${c8d1}/return"
              payload: { return_code: "R01_INSUFFICIENT" }
              as: SponsorBankOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "no DepositReturn row created for the deposit"

      - name: write_off_before_aging_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.OverdraftAdvance", "errors[ERR_TEMPORAL_VIOLATION]"]
        distinguishing_aspect: "Write-off requires aging >= 60 days; at day 1 the write-off is rejected with ERR_TEMPORAL_VIOLATION and the advance remains OPEN."
        test_recipe:
          setup: ["member c9 ELIGIBLE, limit 2000; one OPEN advance 1000 created at clock 2026-09-01"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c9", full_name: "C Nine", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c9: $.data.id, c9_v0: $.data.version }
            - call: "POST /banking/members/${c9}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c9a: $.data.id }
            - call: "POST /banking/accounts/${c9a}/deposits"
              payload: { originator_id: "EMPC9", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c9-t1" }
              as: SponsorBankOps
              captures: { c9d1: $.data.id }
            - call: "POST /banking/accounts/${c9a}/deposits"
              payload: { originator_id: "EMPC9", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "c9-t2" }
              as: SponsorBankOps
              captures: { c9d2: $.data.id }
            - call: "POST /banking/deposits/${c9d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${c9d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${c9}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c9_v0}" }
              as: ProgramOps
            - call: "GET /banking/accounts/${c9a}"
              payload: {}
              as: ProgramOps
              captures: { c9a_v: $.data.version }
            - call: "POST /banking/accounts/${c9a}/advances"
              payload: { amount_cents: 1000, idempotency_key: "c9-a1", expected_account_version: "${c9a_v}" }
              as: Member
              as_user_id: "${c9}"
              captures: { c9adv: $.data.id }
          trigger:
            - call: "POST /banking/advances/${c9adv}/write-off"
              payload: { reason: "too early" }
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPORAL_VIOLATION, http 422"
            - "OverdraftAdvance.${c9adv}.status remains OPEN"

      - name: write_off_after_aging_resets_repayment_streak
        claim_type: side_effect_execution
        grounds: ["state_machines.OverdraftAdvance.OPEN_to_WRITTEN_OFF"]
        distinguishing_aspect: "After the clock passes created_at + 60 days the write-off succeeds, sets the advance WRITTEN_OFF, and resets member.consecutive_on_time_repayments to 0 — the compensation side effect of the ladder's streak."
        test_recipe:
          setup: ["member c10 ELIGIBLE, limit 2000; advance 1000 OPEN created 2026-09-01; clock advanced to 2026-11-15 (75 days later)"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c10", full_name: "C Ten", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c10: $.data.id, c10_v0: $.data.version }
            - call: "POST /banking/members/${c10}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c10a: $.data.id }
            - call: "POST /banking/accounts/${c10a}/deposits"
              payload: { originator_id: "EMPC10", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c10-t1" }
              as: SponsorBankOps
              captures: { c10d1: $.data.id }
            - call: "POST /banking/accounts/${c10a}/deposits"
              payload: { originator_id: "EMPC10", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "c10-t2" }
              as: SponsorBankOps
              captures: { c10d2: $.data.id }
            - call: "POST /banking/deposits/${c10d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${c10d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${c10}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c10_v0}" }
              as: ProgramOps
            - call: "GET /banking/accounts/${c10a}"
              payload: {}
              as: ProgramOps
              captures: { c10a_v: $.data.version }
            - call: "POST /banking/accounts/${c10a}/advances"
              payload: { amount_cents: 1000, idempotency_key: "c10-a1", expected_account_version: "${c10a_v}" }
              as: Member
              as_user_id: "${c10}"
              captures: { c10adv: $.data.id }
            - call: "POST /banking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: ProgramOps
          trigger:
            - call: "POST /banking/advances/${c10adv}/write-off"
              payload: { reason: "aged 75 days" }
              as: ProgramOps
              captures: { c10adv_status: $.data.status }
          assert:
            - "OverdraftAdvance.${c10adv}.status == WRITTEN_OFF"
            - "Member.${c10}.consecutive_on_time_repayments == 0"
            - "DepositAccount.${c10a}.outstanding_cushion_cents == 0 (written-off balance removed from outstanding)"

      - name: notify_on_effective_adjustment_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CushionLimitAdjustment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An INCREASE adjustment is created EFFECTIVE (terminal); calling notify on it is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["member c11 evaluated once (ENROLLED->ELIGIBLE), which creates an EFFECTIVE INCREASE adjustment"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c11", full_name: "C Eleven", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c11: $.data.id, c11_v0: $.data.version }
            - call: "POST /banking/members/${c11}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c11a: $.data.id }
            - call: "POST /banking/accounts/${c11a}/deposits"
              payload: { originator_id: "EMPC11", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c11-t1" }
              as: SponsorBankOps
              captures: { c11d1: $.data.id }
            - call: "POST /banking/accounts/${c11a}/deposits"
              payload: { originator_id: "EMPC11", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "c11-t2" }
              as: SponsorBankOps
              captures: { c11d2: $.data.id }
            - call: "POST /banking/deposits/${c11d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${c11d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${c11}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c11_v0}" }
              as: ProgramOps
            - call: "GET /banking/members/${c11}/limit-adjustments"
              payload: {}
              as: ProgramOps
              captures: { adj_id: "$.data[0].id", adj_status: "$.data[0].status" }
          trigger:
            - call: "POST /banking/limit-adjustments/${adj_id}/notify"
              payload: {}
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "the created adjustment has status == EFFECTIVE (INCREASE shortcut)"
            - "notify on it fails with ERR_INVALID_STATE (terminal state lockdown)"

      - name: resolve_balanced_run_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ReconciliationRun", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A run that auto-transitioned to BALANCED (discrepancy 0) cannot be resolved; resolve is legal only from DISCREPANCY."
        test_recipe:
          setup: ["run over an empty window with bank_reported_net_cents 0 -> BALANCED at creation"]
          setup_api_calls:
            - call: "POST /banking/reconciliation-runs"
              payload: { sponsor_bank_code: "SB-9", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z", bank_reported_net_cents: 0 }
              as: SponsorBankOps
              captures: { runB0: $.data.id, runB0_v: $.data.version, runB0_status: $.data.status }
          trigger:
            - call: "POST /banking/reconciliation-runs/${runB0}/resolve"
              payload: { expected_run_version: "${runB0_v}", resolution_note: "nothing to resolve" }
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "run status at creation == BALANCED"
            - "resolve fails with ERR_INVALID_STATE, http 409"

      - name: dispute_resolve_beyond_deadline_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Dispute", "calculations.calc_dispute_deadlines", "errors[ERR_TEMPORAL_VIOLATION]"]
        distinguishing_aspect: "Resolving a dispute after filed_at + 45 calendar days is rejected with ERR_TEMPORAL_VIOLATION; the dispute stays UNDER_REVIEW."
        test_recipe:
          setup: ["member c12 ELIGIBLE; deposit posted early then returned; dispute filed 2026-09-01; provisional credit issued; clock advanced to 2026-10-20 (49 days later)"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c12", full_name: "C Twelve", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c12: $.data.id, c12_v0: $.data.version }
            - call: "POST /banking/members/${c12}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c12a: $.data.id }
            - call: "POST /banking/accounts/${c12a}/deposits"
              payload: { originator_id: "EMPC12", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c12-t1" }
              as: SponsorBankOps
              captures: { c12d1: $.data.id }
            - call: "POST /banking/accounts/${c12a}/deposits"
              payload: { originator_id: "EMPC12", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "c12-t2" }
              as: SponsorBankOps
              captures: { c12d2: $.data.id }
            - call: "POST /banking/deposits/${c12d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${c12d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${c12}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c12_v0}" }
              as: ProgramOps
            - call: "POST /banking/accounts/${c12a}/deposits"
