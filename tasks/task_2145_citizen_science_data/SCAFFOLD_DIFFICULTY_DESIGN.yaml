              captures: { c1: $.data.id }
            - call: "POST /citizen-science/certifications/${c1}/complete-training"
              payload: { exam_score: 88 }
              as: Expert
              as_user_id: "${et}"
            - call: "POST /citizen-science/certifications/${c1}/grant"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Autumn Count", protocol_id: "${p1}", season_start_date: "2026-08-01", season_end_date: "2026-10-31", target_observations_per_site: 3 }
              as: ProgramAdmin
              captures: { cam1: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/sites"
              payload: { site_code: "S-HI", latitude: 44.0, longitude: -70.0, habitat_type: "WETLAND", priority_weight: 1.5 }
              as: ProgramAdmin
