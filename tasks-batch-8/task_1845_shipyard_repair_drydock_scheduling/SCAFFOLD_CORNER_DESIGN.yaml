  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: dockage_fee_loa_tier_boundary_100
        claim_type: constants_applied
        grounds: [calculations.calc_dockage_fee, entities.DockReservation.fields.dockage_fee_cents]
        distinguishing_aspect: "Tier boundary is inclusive upward: LOA exactly 100.0m selects the 1.25 multiplier (4 nights x 400000 x 1.25 = 2000000) while LOA 99.9m stays at 1.00 (1600000)."
        test_recipe:
          setup:
            - "Dock with daily_rate_cents 400000; vessel A LOA 100.0m with reservation 2026-08-01 -> 2026-08-05 (4 nights); vessel B LOA 99.9m with reservation 2026-08-06 -> 2026-08-10 (4 nights, clears A's buffer)"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MT Boundary", imo_number: "IMO9000003", length_m: 100.0, beam_m: 20.0, draft_m: 6.0, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { v_a: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MT Just Under", imo_number: "IMO9000004", length_m: 99.9, beam_m: 20.0, draft_m: 6.0, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { v_b: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${v_a}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_a: $.data.id, p_a_v: $.data.version }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${v_b}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_b: $.data.id, p_b_v: $.data.version }
          trigger:
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_a}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-05T00:00:00Z", expected_project_version: "${p_a_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { fee_a: $.data.dockage_fee_cents }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_b}", start_utc: "2026-08-06T00:00:00Z", end_utc: "2026-08-10T00:00:00Z", expected_project_version: "${p_b_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { fee_b: $.data.dockage_fee_cents }
          assert:
            - "captured fee_a == 2000000 (100.0m is >= 100 -> 1.25 multiplier)"
            - "captured fee_b == 1600000 (99.9m < 100 -> 1.00 multiplier)"
      - name: bid_total_excludes_cancelled_items
        claim_type: input_set_filtering
        grounds: [calculations.calc_bid_line_pricing, state_machines.WorkItem.PLANNED_to_CANCELLED]
        distinguishing_aspect: "The bid roll-up's input set excludes CANCELLED lines: after cancelling the 20000-cent line, submit-bid reports bid_total_cents 10000, not 30000."
        test_recipe:
          setup: ["DRAFT project with LUMP_SUM lines X (10000) and Y (20000); Y is cancelled while PLANNED"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
