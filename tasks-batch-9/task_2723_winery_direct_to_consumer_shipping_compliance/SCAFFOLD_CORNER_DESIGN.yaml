            - "the 20.000 L entry one second before the edge is excluded, and the 8.000 L entry belonging to Ben is excluded because the filter is per consumer"
            - "NM view: per_state.NM rolling liters 5.000 \u2014 the TX entries never leak across the state axis"
            - "unfiltered view: per_state carries BOTH keys at once with TX 4.250 and NM 5.000, proving the two periods are evaluated independently"
            - "all entries have order_id null so settled equals gross: rolling_liters_settled_by_state.TX == 4.250 and rolling_liters_settled_by_state.NM == 5.000"
