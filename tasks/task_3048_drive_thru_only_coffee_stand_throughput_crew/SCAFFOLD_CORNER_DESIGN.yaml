        distinguishing_aspect: "Derived-field reconciliation: lane_occupancy recomputes on create (MERGED window order), on merge (app order), on abandon (release), and on handoff (release) — verified at each step, including that QUEUED app orders are not counted."
        test_recipe:
          setup: ["Stand OPEN; app order created (QUEUED), then merged; window order created in lane B; app order abandoned."]
