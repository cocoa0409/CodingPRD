# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3150_medical_identification_membership_emergency_record_access
#
# Breadth probe: every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: member_enroll_returns_defaults_and_mints_identifier
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints.POST_/medical-id/members
        distinguishing_aspect: "Enrolling a STANDARD adult returns 201 with status ACTIVE, version 1, record_revision 0, balance_cents == 4000 (enrollment fee), wallet 0, first_lifetime_sync_order_consumed false, a MID-###### identifier_code, expires_on one year out, and system-stamped id/created_at/updated_at — none of them client-supplied."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z (no set_current_utc call needed). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /medical-id/members"
              payload: { full_name: "Nina New", email: "nina@x.com", membership_tier: "STANDARD", date_of_birth: "1990-05-05" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          assert:
            - "the response status is 201 with response_type object and meta.api_request_id present"
            - "Member.${m_id}.status == ACTIVE and version == 1"
            - "Member.${m_id}.member_type == ADULT (derived from date_of_birth vs the logical clock)"
            - "Member.${m_id}.balance_cents == 4000 (STANDARD enrollment fee) and wallet_credit_cents == 0"
            - "Member.${m_id}.record_revision == 0 and has_cognitive_condition == false and first_lifetime_sync_order_consumed == false"
            - "Member.${m_id}.identifier_code matches MID-###### and expires_on == 2027-09-01"

      - name: minor_enrollment_derives_member_type_minor
        claim_type: Computed Fields
        grounds:
          - entities.Member.fields.member_type
          - entities.Member.fields.date_of_birth
        distinguishing_aspect: "A date_of_birth less than 18 years before the logical enrollment date derives member_type == MINOR; the client cannot supply member_type — any input value is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/members"
              payload: { full_name: "Kid Minor", email: "kid@x.com", membership_tier: "STANDARD", date_of_birth: "2015-01-01" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.member_type == MINOR"
            - "Member.${m_id}.expires_on == 2027-09-01 (same term math as adults)"

      - name: lifetime_member_has_null_expires_on_and_never_suspends
        claim_type: Defaults
        grounds:
          - entities.Member.fields.expires_on
          - state_machines.Member.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "LIFETIME enrollment sets expires_on to null; advancing the logical clock two years never lapses the member — the sweep precondition membership_tier != LIFETIME excludes them."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. LIFETIME member enrolled."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Liz Life", email: "liz@x.com", membership_tier: "LIFETIME", date_of_birth: "1970-01-01" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Member.${m_id}.expires_on is null"
            - "Member.${m_id}.status == ACTIVE after the clock advance (no SUSPENDED sweep)"
            - "Member.${m_id}.balance_cents == 50000 (one-time LIFETIME enrollment fee, nothing more accrued)"

      - name: access_event_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.AccessEvent
        distinguishing_aspect: "AccessEvent declares common_fields: false — its read payload carries id and created_at but no updated_at and no version, and no update/delete endpoint exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member M; ACTIVE BASIC responder R expiring 2027-01-01."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Amy Audit", email: "amy@x.com", membership_tier: "STANDARD", date_of_birth: "1985-01-01" }
              as: PlatformAdmin
              captures: { m_code: $.data.identifier_code }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "Ems", credential_code: "EMS-IM-1", access_tier: "BASIC", expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-IM-1", identifier_code: "${m_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${r_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /medical-id/access-events/${ev_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response carries id and created_at"
            - "the response has no version key and no updated_at key (append-only event)"

      - name: members_list_paginates_with_filter_and_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/medical-id/members
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three members across two statuses, limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true; offset=2 returns 1 row with has_more == false; the status filter narrows the filtered set AND total_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three STANDARD members; member 3 cancelled."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "P One", email: "p1@x.com", membership_tier: "STANDARD", date_of_birth: "1980-01-01" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "P Two", email: "p2@x.com", membership_tier: "STANDARD", date_of_birth: "1980-01-02" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "P Three", email: "p3@x.com", membership_tier: "STANDARD", date_of_birth: "1980-01-03" }
              as: PlatformAdmin
              captures: { p3: $.data.id }
            - call: "POST /medical-id/members/${p3}/cancel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /medical-id/members"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /medical-id/members?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /medical-id/members?status=CANCELLED returns exactly 1 row (${p3}) with total_count == 1"
            - "GET /medical-id/members with no parameters returns 3 rows with defaults limit 10, offset 0"

      - name: get_unknown_member_returns_member_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/medical-id/members/{memberId}
          - errors.ERR_MEMBER_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated memberId produces the entity-specific 404 ERR_MEMBER_NOT_FOUND, not a generic 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /medical-id/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id == ERR_MEMBER_NOT_FOUND"

      - name: enroll_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.email
          - errors.ERR_INVALID_REQUEST
          - validations.priority_7_business_constraint
        distinguishing_aspect: "Omitting the required email field rejects enrollment with 400 ERR_INVALID_REQUEST; the same applies to a bad enum membership_tier."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /medical-id/members"
              payload: { full_name: "No Mail", membership_tier: "STANDARD", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_INVALID_REQUEST"
            - "POST /medical-id/members with membership_tier == GOLD likewise returns 400 ERR_INVALID_REQUEST (enum closure)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: order_full_happy_path_pending_to_shipped
        claim_type: Valid Transition
        grounds:
          - state_machines.ProductOrder.PENDING_to_CONFIRMED
          - state_machines.ProductOrder.CONFIRMED_to_ENGRAVED
          - state_machines.ProductOrder.ENGRAVED_to_SHIPPED
        distinguishing_aspect: "A MANUAL order walks PENDING -> CONFIRMED -> ENGRAVED -> SHIPPED; ship settles the balance (balance -= price) while enrollment fee remains."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member (balance 4000). Product at 2000. Order created."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "NK-1", product_name: "Necklace", base_price_cents: 2000, max_engrave_chars: 30 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Sara Ship", email: "sara@x.com", membership_tier: "STANDARD", date_of_birth: "1992-02-02" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/orders"
              payload: { product_id: "${prod}", engraving_text: "Sara N", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m}"
              captures: { o: $.data.id }
            - call: "GET /medical-id/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { mv: $.data.version }
            - call: "POST /medical-id/members/${m}/orders/${o}/confirm"
              payload: { expected_member_version: "${mv}" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /medical-id/members/${m}/orders/${o}/engrave"
              payload: {}
              as: FulfillmentAgent
              as_user_id: "fa-1"
            - call: "POST /medical-id/members/${m}/orders/${o}/ship"
              payload: {}
              as: FulfillmentAgent
              as_user_id: "fa-1"
          assert:
            - "ProductOrder.${o}.status == SHIPPED (terminal)"
            - "after confirm, balance was 4000 + 2000 == 6000; after ship, Member.${m}.balance_cents == 4000 (order settled)"

      - name: engrave_from_pending_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ProductOrder.CONFIRMED_to_ENGRAVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Skipping confirm and calling engrave on a PENDING order is rejected 409 ERR_INVALID_STATE; no state change and no side effects fire."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member with one PENDING MANUAL order."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "NK-2", product_name: "Necklace2", base_price_cents: 2000, max_engrave_chars: 30 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Skip State", email: "skip@x.com", membership_tier: "STANDARD", date_of_birth: "1992-02-02" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/orders"
              payload: { product_id: "${prod}", engraving_text: "Skip", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m}"
              captures: { o: $.data.id }
          trigger:
            - call: "POST /medical-id/members/${m}/orders/${o}/engrave"
              payload: {}
              as: FulfillmentAgent
              as_user_id: "fa-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE"
            - "ProductOrder.${o}.status remains PENDING"

      - name: terminal_directive_revoke_from_released_works_but_second_revoke_fails
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AdvanceDirective.RELEASED_to_REVOKED
          - state_machines.AdvanceDirective
        distinguishing_aspect: "REVOKED is terminal: a directive released by an access event can still be revoked (RELEASED -> REVOKED), but any further revoke attempt on the REVOKED directive is 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member with a VERIFIED COGNITIVE condition, one STORED EMERGENCY_ONLY directive, BASIC responder; access event escalates and releases the directive."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Donna Directive", email: "donna@x.com", membership_tier: "STANDARD", date_of_birth: "1965-06-06" }
              as: PlatformAdmin
              captures: { m: $.data.id, code: $.data.identifier_code }
            - call: "POST /medical-id/members/${m}/record-items"
              payload: { item_kind: "CONDITION", condition_kind: "COGNITIVE", label: "Dementia", detail: "d", severity: "HIGH", provider_document_ref: "doc-dd" }
              as: Member
              as_user_id: "${m}"
              captures: { it: $.data.id }
            - call: "GET /medical-id/members/${m}/record-items/${it}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { tk: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${tk}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/members/${m}/directives"
              payload: { directive_type: "POLST", document_ref: "polst-d", release_scope: "EMERGENCY_ONLY" }
              as: Member
              as_user_id: "${m}"
              captures: { dir: $.data.id }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "EmsD", credential_code: "EMS-D-9", access_tier: "BASIC", expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-D-9", identifier_code: "${code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${rid}"
          trigger:
            - call: "POST /medical-id/members/${m}/directives/${dir}/revoke"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /medical-id/members/${m}/directives/${dir}/revoke"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "before revoke, AdvanceDirective.${dir}.status == RELEASED (access released it)"
            - "first revoke returns 200 with status REVOKED"
            - "second revoke returns 409 ERR_INVALID_STATE (terminal lockdown)"

      - name: member_lapse_sweep_flips_status_and_cancels_pending_reminders
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Reminder.PENDING_to_CANCELLED
        distinguishing_aspect: "Advancing the clock to expires_on triggers the system sweep: member SUSPENDED, all PENDING reminders CANCELLED, one new LAPSE_WARNING reminder generated with due_on == expires_on."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member enrolled (expires 2027-09-01, PENDING RENEWAL + RECORD_UPDATE reminders)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Lena Lapsed", email: "lena2@x.com", membership_tier: "STANDARD", date_of_birth: "1988-08-08" }
              as: PlatformAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Member.${m}.status == SUSPENDED (boundary: expires_on == today is lapsed, sweep uses >=)"
            - "every reminder for ${m} with reminder_kind in {RENEWAL, RECORD_UPDATE} has status == CANCELLED"
            - "exactly one LAPSE_WARNING reminder exists with due_on == 2027-09-01 and status == PENDING"

      - name: supersede_from_pending_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.MedicalRecordItem.VERIFIED_to_SUPERSEDED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Only VERIFIED items can be superseded — superseding a PENDING_VERIFICATION item fails 409 regardless of a correct expected_member_version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member with one PENDING_VERIFICATION item."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Pend Pete", email: "pete@x.com", membership_tier: "STANDARD", date_of_birth: "1983-03-03" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/record-items"
              payload: { item_kind: "ALLERGY", label: "Latex", detail: "gloves", severity: "MEDIUM", provider_document_ref: "doc-lx" }
              as: Member
              as_user_id: "${m}"
              captures: { it: $.data.id }
            - call: "GET /medical-id/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { mv: $.data.version }
          trigger:
            - call: "POST /medical-id/members/${m}/record-items/${it}/supersede"
              payload: { replacement_label: "Latex2", replacement_detail: "x", provider_document_ref: "doc-lx2", expected_member_version: "${mv}" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE"
            - "MedicalRecordItem.${it}.status remains PENDING_VERIFICATION"

      - name: occ_stale_expected_member_version_returns_412
        claim_type: Precondition Enforcement
        grounds:
          - concurrency_rules[order-confirm-stale-member]
          - validations.priority_16_business_fiscal
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC negative path: a confirm carrying expected_member_version one behind the current Member.version is rejected 412 ERR_STALE_VERSION with no state change; replaying with the fresh version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member with a PENDING MANUAL order; member version v observed."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "OC-1", product_name: "Occ Band", base_price_cents: 1000, max_engrave_chars: 30 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Olga Occ", email: "olga@x.com", membership_tier: "STANDARD", date_of_birth: "1990-09-09" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/orders"
              payload: { product_id: "${prod}", engraving_text: "Olga", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m}"
              captures: { o: $.data.id }
            - call: "GET /medical-id/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { mv: $.data.version }
            - call: "POST /medical-id/members/${m}/contacts"
              payload: { contact_name: "Bump", phone: "+15550009999", priority_rank: 1 }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /medical-id/members/${m}/orders/${o}/confirm"
              payload: { expected_member_version: "${mv}" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
            - call: "GET /medical-id/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { mv2: $.data.version }
            - call: "POST /medical-id/members/${m}/orders/${o}/confirm"
              payload: { expected_member_version: "${mv2}" }
              as: Member
              as_user_id: "${m}"
          assert:
            - "the first confirm returns 412 with error_id == ERR_STALE_VERSION (contact create bumped Member.version between the read and the confirm)"
            - "ProductOrder.${o}.status remained PENDING after the 412"
            - "the retry with the fresh version returns 200 and ProductOrder.${o}.status == CONFIRMED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: premium_order_discount_applied_at_creation
        claim_type: Correct Result
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: "PREMIUM member's MANUAL order on a 10000-cent product prices at 8500 (15% off, round_half_up) — constants applied exactly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PREMIUM member; product at 10000 cents."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "PM-1", product_name: "Prem Band", base_price_cents: 10000, max_engrave_chars: 30 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Pam Premium", email: "pam@x.com", membership_tier: "PREMIUM", date_of_birth: "1986-06-06" }
              as: PlatformAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /medical-id/members/${m}/orders"
              payload: { product_id: "${prod}", engraving_text: "Pam", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m}"
              captures: { o: $.data.id }
          assert:
            - "ProductOrder.${o}.price_cents == 8500 (10000 * (1 - 0.15), whole cents)"

      - name: early_renewal_extends_from_existing_expiry_not_now
        claim_type: Correct Result
        grounds:
          - calculations.membership_fee
          - state_machines.Member.ACTIVE_to_ACTIVE
        distinguishing_aspect: "Renewing an ACTIVE STANDARD member six months before expiry extends expires_on from the OLD expiry (max(old, today) + 12 months), never shortening the term; balance increases by the 4000 renewal fee."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member enrolled (expires 2027-09-01, balance 4000)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Erin Early", email: "erin@x.com", membership_tier: "STANDARD", date_of_birth: "1994-04-04" }
              as: PlatformAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /medical-id/members/${m}/renew"
              payload: { amount_paid_cents: 4000 }
              as: Member
              as_user_id: "${m}"
          assert:
            - "Member.${m}.status == ACTIVE"
            - "Member.${m}.expires_on == 2028-09-01 (old expiry + 12 months, not today + 12)"
            - "Member.${m}.balance_cents == 8000 (4000 enrollment + 4000 renewal)"

      - name: record_update_reminder_reanchored_on_record_change
        claim_type: Input Set Filtering
        grounds:
          - calculations.reminder_schedule
        distinguishing_aspect: "The RECORD_UPDATE reminder's due_on tracks the latest record-change date + 180 days; adding a record item six months in re-anchors the reminder to the new change date, cancelling the stale PENDING one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member enrolled; RECORD_UPDATE reminder due 2027-02-28 (2026-09-01 + 180 days)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Ruth Remind", email: "ruth@x.com", membership_tier: "STANDARD", date_of_birth: "1989-09-09" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/members/${m}/record-items"
              payload: { item_kind: "MEDICATION", label: "Metformin", detail: "500mg", severity: "LOW", provider_document_ref: "doc-mf" }
              as: Member
              as_user_id: "${m}"
          assert:
            - "the original RECORD_UPDATE reminder (due_on 2027-02-28) has status == CANCELLED"
            - "a new PENDING RECORD_UPDATE reminder exists with due_on == 2027-06-30 (2027-01-01 + 180 days)"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_user_context_header_returns_400
        claim_type: Violation → Error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with an empty X-User-ID fails priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /medical-id/members"
              payload: {}
              as: PlatformAdmin
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: duplicate_email_rejected_on_enroll
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_EMAIL
          - entities.Member.fields.email
        distinguishing_aspect: "Email uniqueness is global: a second enrollment with the same email (different name) fails 409 ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One member with email dup@x.com."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "First Dup", email: "dup@x.com", membership_tier: "STANDARD", date_of_birth: "1980-01-01" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/members"
              payload: { full_name: "Second Dup", email: "dup@x.com", membership_tier: "PREMIUM", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_DUPLICATE_EMAIL"

      - name: contact_priority_conflict_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_12_business_constraint
          - errors.ERR_CONTACT_PRIORITY_CONFLICT
        distinguishing_aspect: "Two ACTIVE contacts with the same priority_rank for one member are rejected; after removing the first contact (status REMOVED), the rank frees up and a new contact may take it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member with one ACTIVE contact at priority_rank 1."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Connie Contact", email: "connie@x.com", membership_tier: "STANDARD", date_of_birth: "1981-01-01" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/contacts"
              payload: { contact_name: "First", phone: "+15551111111", priority_rank: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /medical-id/members/${m}/contacts"
              payload: { contact_name: "Second", phone: "+15552222222", priority_rank: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
            - call: "POST /medical-id/members/${m}/contacts/${c1}/remove"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /medical-id/members/${m}/contacts"
              payload: { contact_name: "Third", phone: "+15553333333", priority_rank: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { c3: $.data.id }
          assert:
            - "the duplicate-rank create returns 409 ERR_CONTACT_PRIORITY_CONFLICT"
            - "after removing the rank-1 contact, a new contact with priority_rank 1 succeeds (REMOVED contacts don't hold the rank)"

      - name: guardian_link_rejects_self_link_and_minor_guardian
        claim_type: Violation → Error
        grounds:
          - validations.priority_11_business_constraint
          - errors.ERR_GUARDIAN_LINK_INVALID
        distinguishing_aspect: "Guardian-link creation rejects (a) guardian_member_id == dependent id (self-link) and (b) a MINOR guardian — both 409 ERR_GUARDIAN_LINK_INVALID, distinct from existence errors."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Dependent D (MINOR) and a MINOR member K."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Dep One", email: "dep1@x.com", membership_tier: "STANDARD", date_of_birth: "2016-05-05" }
              as: PlatformAdmin
              captures: { d: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Kid Two", email: "kid2@x.com", membership_tier: "STANDARD", date_of_birth: "2015-05-05" }
              as: PlatformAdmin
              captures: { k: $.data.id }
          trigger:
            - call: "POST /medical-id/members/${d}/guardian-links"
              payload: { guardian_member_id: "${d}", relation_label: "self" }
              as: PlatformAdmin
              captures: { err_self: $.data.error_id }
            - call: "POST /medical-id/members/${d}/guardian-links"
              payload: { guardian_member_id: "${k}", relation_label: "sibling" }
              as: PlatformAdmin
              captures: { err_minor: $.data.error_id }
          assert:
            - "self-link returns 409 ERR_GUARDIAN_LINK_INVALID"
            - "MINOR guardian returns 409 ERR_GUARDIAN_LINK_INVALID (guardian must be member_type ADULT)"

      - name: renewal_insufficient_funds_returns_402
        claim_type: Violation → Error
        grounds:
          - validations.priority_15_business_fiscal
          - errors.ERR_INSUFFICIENT_FUNDS
        distinguishing_aspect: "A SUSPENDED STANDARD member with wallet 0 paying 3999 against a 4000 fee is rejected 402 ERR_INSUFFICIENT_FUNDS (boundary: exactly 4000 would succeed); the member stays SUSPENDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member enrolled then lapsed (clock at 2027-09-02)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Ian Insufficient", email: "ian@x.com", membership_tier: "STANDARD", date_of_birth: "1984-04-04" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/members/${m}/renew"
              payload: { amount_paid_cents: 3999 }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 402 with error_id == ERR_INSUFFICIENT_FUNDS"
            - "Member.${m}.status remains SUSPENDED"

      - name: dispute_against_other_members_item_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_14_business_referential
          - errors.ERR_RECORD_ITEM_NOT_DISPUTABLE
        distinguishing_aspect: "A dispute naming a record_item_id owned by a DIFFERENT member is rejected 409 ERR_RECORD_ITEM_NOT_DISPUTABLE — cross-member referential check, distinct from a plain 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Members A and B; B has a record item."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "A Member", email: "am@x.com", membership_tier: "STANDARD", date_of_birth: "1980-01-01" }
              as: PlatformAdmin
              captures: { a: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "B Member", email: "bm@x.com", membership_tier: "STANDARD", date_of_birth: "1980-01-02" }
              as: PlatformAdmin
              captures: { b: $.data.id }
            - call: "POST /medical-id/members/${b}/record-items"
              payload: { item_kind: "ALLERGY", label: "Iodine", detail: "contrast", severity: "HIGH", provider_document_ref: "doc-io" }
              as: Member
              as_user_id: "${b}"
              captures: { b_item: $.data.id }
          trigger:
            - call: "POST /medical-id/members/${a}/disputes"
              payload: { record_item_id: "${b_item}", claim_text: "not mine" }
              as: Member
              as_user_id: "${a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_RECORD_ITEM_NOT_DISPUTABLE"

      - name: manual_engraving_overflow_rejected_at_create
        claim_type: Violation → Error
        grounds:
          - validations.priority_13_business_constraint
          - errors.ERR_ENGRAVING_OVERFLOW
        distinguishing_aspect: "A MANUAL order whose engraving_text exceeds max_engrave_chars by exactly one character is rejected 422 at creation; exactly-at-limit succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member; product max_engrave_chars 5."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "SM-5", product_name: "Tiny", base_price_cents: 1500, max_engrave_chars: 5 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Edgar Engrave", email: "edgar@x.com", membership_tier: "STANDARD", date_of_birth: "1991-01-01" }
              as: PlatformAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /medical-id/members/${m}/orders"
              payload: { product_id: "${prod}", engraving_text: "123456", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
            - call: "POST /medical-id/members/${m}/orders"
              payload: { product_id: "${prod}", engraving_text: "12345", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m}"
              captures: { o: $.data.id }
          assert:
            - "6 chars against max 5 returns 422 ERR_ENGRAVING_OVERFLOW"
            - "exactly 5 chars succeeds (inclusive limit)"

      - name: hotline_lookup_requires_operator_id
        claim_type: Violation → Error
        grounds:
          - validations.priority_8_business_safety
          - entities.AccessEvent.fields.operator_id
        distinguishing_aspect: "A HOTLINE access event without operator_id is denied (DENIED event logged, ERR_RESPONDER_AUTH_FAILED); an IDENTIFIER lookup WITH operator_id is rejected 400 ERR_INVALID_REQUEST (operator_id must be null for IDENTIFIER)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member; ACTIVE FULL responder."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Hank Hotline", email: "hank@x.com", membership_tier: "STANDARD", date_of_birth: "1977-07-07" }
              as: PlatformAdmin
              captures: { code: $.data.identifier_code, m: $.data.id }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "EmsH", credential_code: "EMS-H-1", access_tier: "FULL", expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-H-1", identifier_code: "${code}", lookup_method: "HOTLINE" }
              as: HotlineOperator
              as_user_id: "op-9"
              captures: { err: $.data.error_id }
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-H-1", identifier_code: "${code}", lookup_method: "HOTLINE", operator_id: "op-9" }
              as: HotlineOperator
              as_user_id: "op-9"
              captures: { ev: $.data.id }
          assert:
            - "HOTLINE without operator_id is denied (403 ERR_RESPONDER_AUTH_FAILED or a DENIED AccessEvent with reason_code ERR_RESPONDER_AUTH_FAILED)"
            - "HOTLINE with operator_id succeeds 201 and AccessEvent.${ev}.lookup_method == HOTLINE with operator_id == op-9"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: dispatch_returns_sent_count_and_ids
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/medical-id/_reminders/dispatch
        distinguishing_aspect: "The ops-run dispatch returns the inline summary { sent_count, sent_reminder_ids } — a computed-read shape distinct from entity payloads."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member enrolled 2026-09-01 (RECORD_UPDATE reminder due 2027-02-28; RENEWAL due 2027-08-02). Clock advanced to 2027-03-01."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Deb Dispatch", email: "deb@x.com", membership_tier: "STANDARD", date_of_birth: "1987-07-07" }
