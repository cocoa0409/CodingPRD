  - method: GET
    path: "/api/training-sessions/{trainingSessionId}"
    description: "Get a training session"
    roles: [PlatformAdmin, WarrantyAdmin, AgencyAdmin]
    code: 200
    input: []
    output: TrainingSession
    side_effects: []

  - method: POST
    path: "/api/training-sessions/{trainingSessionId}/complete"
    description: "Complete a scheduled session at or after its date"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: TrainingSession
