    side_effects:
      - "sets status = DRAFT and every exposure figure to null"
    errors: [ERR_PRODUCT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_RECALL_ALREADY_OPEN]

  - method: GET
    path: /ladder-ops/recall-events/{id}
    roles: [SafetyDirector, ComplianceOfficer, Consumer]
    input: []
    output: RecallEvent
    side_effects: []
    errors: [ERR_RECALL_EVENT_NOT_FOUND]

  - method: GET
    path: /ladder-ops/recall-events
    roles: [SafetyDirector, ComplianceOfficer]
    input: ["product_id?", "status?", "remedy_type?", "limit?", "offset?"]
    output: RecallEvent[]
    side_effects: []
    errors: [ERR_INVALID_PAGINATION]

  - method: POST
    path: /ladder-ops/recall-events/{id}/announce
    roles: [SafetyDirector]
    input: []
    output: RecallEvent
    side_effects:
      - "status DRAFT -> ANNOUNCED; sets announced_at = logical clock"
      - "freezes both exposure variants and notification_coverage_pct per §1.3 recall_exposure_units, and sets units_remedied = 0 with units_outstanding = exposure_units_registered_basis"
      - "the product moves design_status DESIGN_FROZEN -> DESIGN_OBSOLETE and market_status -> RECALLED; every LISTED or SUSPENDED listing of the product moves to WITHDRAWN; in-scope registrations are stamped with recall_event_id; dhf_retention_until re-anchors per §1.3 dhf_retention_until"
    errors: [ERR_RECALL_EVENT_NOT_FOUND, ERR_RECALL_STATE_INVALID, ERR_RECALL_SCOPE_EMPTY]

  - method: POST
    path: /ladder-ops/recall-events/{id}/notify
    roles: [SafetyDirector, ComplianceOfficer]
    input: []
    output: RecallEvent
    side_effects:
      - "status ANNOUNCED -> IN_PROGRESS"
      - "every in-scope ConsumerRegistration moves REGISTERED -> NOTIFIED with notified_at = logical clock"
    errors: [ERR_RECALL_EVENT_NOT_FOUND, ERR_RECALL_STATE_INVALID]

  - method: POST
    path: /ladder-ops/recall-events/{id}/close
    roles: [SafetyDirector]
    input: []
    output: RecallEvent
    side_effects:
      - "status IN_PROGRESS -> CLOSED; sets closed_at = logical clock"
    errors: [ERR_RECALL_EVENT_NOT_FOUND, ERR_RECALL_STATE_INVALID, ERR_RECALL_UNITS_OUTSTANDING]

  # ------------------------------------------------------------------ Logical clock
  - method: POST
    path: /_clock/set_current_utc
    roles: [SystemOperator]
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "sets the deterministic logical clock that every *_at, *_until and *_due_at derivation reads"
      - "the clock defaults to 2026-08-01T00:00:00Z at process start; it never moves on its own and only this endpoint changes it"
    errors: [ERR_INVALID_REQUEST]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ------------------------------------------------------- auth (401 / 403)
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the nine §1.7 role names"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not in the target endpoint's roles list"
  - id: ERR_LISTING_BODY_MISMATCH
    http: 403
    condition: "a CertificationBody acts on a ListingRecord whose listing_body_id is not its own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the caller reviews a DesignRevision it submitted, or verifies a CorrectiveAction it authored"
  - id: ERR_SCRAP_REQUIRES_SAFETY_DIRECTOR
    http: 403
    condition: "disposition=SCRAP requested by a ProductionSupervisor; only SafetyDirector may scrap a quarantined lot"

  # ------------------------------------------------------- not found (404)
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "no Product matches the path id or the body product_id"
  - id: ERR_DESIGN_REVISION_NOT_FOUND
    http: 404
    condition: "no DesignRevision matches the path id, design_revision_id, frozen_revision_id or supersedes_revision_id"
  - id: ERR_PRODUCT_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no ProductDocument matches the path id"
  - id: ERR_TEST_BENCH_NOT_FOUND
    http: 404
    condition: "no TestBench matches the path id or the body test_bench_id"
  - id: ERR_BENCH_RESERVATION_NOT_FOUND
    http: 404
    condition: "no BenchReservation matches the path id or the body bench_reservation_id"
  - id: ERR_TEST_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "no TestCampaign matches the path id or the body test_campaign_id"
  - id: ERR_PRODUCTION_LOT_NOT_FOUND
    http: 404
    condition: "no ProductionLot matches the path id, production_lot_id or sampled_lot_id"
  - id: ERR_LISTING_BODY_NOT_FOUND
    http: 404
    condition: "no ListingBody matches the body listing_body_id"
  - id: ERR_LISTING_RECORD_NOT_FOUND
    http: 404
    condition: "no ListingRecord matches the path id or the body listing_record_id"
  - id: ERR_CONSUMER_REGISTRATION_NOT_FOUND
    http: 404
    condition: "no ConsumerRegistration matches the path id or the body consumer_registration_id"
  - id: ERR_FIELD_INCIDENT_NOT_FOUND
    http: 404
    condition: "no FieldIncident matches the path id or the body field_incident_id"
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http: 404
    condition: "no CorrectiveAction matches the path id or the body supersedes_action_id"
  - id: ERR_RECALL_EVENT_NOT_FOUND
    http: 404
    condition: "no RecallEvent matches the path id"

  # ------------------------------------------------------- request shape (400)
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is outside its declared set, a number is out of range, or a datetime is not ISO 8601"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative / non-integer on a list GET"
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "sample_window_start >= sample_window_end, or start_at >= end_at on a bench reservation"
  - id: ERR_DATE_IN_FUTURE
    http: 400
    condition: "purchase_date or occurred_at is later than the logical clock"

  # ------------------------------------------------------- optimistic concurrency (412)
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal the current Product.version on design-revision creation (§1.2.1 design-revision-create-stale-product)"
  - id: ERR_STALE_INCIDENT_VERSION
    http: 412
    condition: "expected_field_incident_version does not equal the current FieldIncident.version on corrective-action creation (§1.2.1 corrective-action-create-stale-incident)"

  # ------------------------------------------------------- state preconditions (409)
  - id: ERR_REVISION_STATE_INVALID
    http: 409
    condition: "the DesignRevision is not in the from-state the requested transition needs (submit needs DRAFT, review needs UNDER_REVIEW, revise needs CHANGES_REQUESTED)"
  - id: ERR_DOCUMENT_NOT_DRAFT
    http: 409
    condition: "approve requested on a ProductDocument that is already APPROVED or SUPERSEDED"
  - id: ERR_CAMPAIGN_STATE_INVALID
    http: 409
    condition: "the TestCampaign is not in the from-state the requested transition needs (start needs PLANNED; load tests and conclude need IN_PROGRESS)"
  - id: ERR_RESERVATION_NOT_HELD
    http: 409
    condition: "cancel or campaign start targets a BenchReservation that is already CONSUMED or CANCELLED"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "the ProductionLot is not in the from-state the requested transition needs (start-production needs OPEN; joint samples and release need IN_PROCESS; quarantine needs IN_PROCESS or RELEASED; disposition needs QUARANTINED)"
  - id: ERR_LISTING_STATE_INVALID
    http: 409
    condition: "list requested on a ListingRecord that is not APPLIED, or suspend requested on one that is not LISTED"
  - id: ERR_PRODUCT_STATE_INVALID
    http: 409
    condition: "the Product state dimension is wrong for the request (freeze-design needs design_status DRAFT; release-to-retail needs NOT_RELEASED; stop-ship needs RETAIL_RELEASED; resume-ship needs STOP_SHIP)"
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "the FieldIncident is not in the from-state the requested transition needs (investigate needs REPORTED; resolve-investigation needs UNDER_INVESTIGATION; corrective-action creation needs ROOT_CAUSE_IDENTIFIED)"
  - id: ERR_CORRECTIVE_ACTION_NOT_OPEN
    http: 409
    condition: "verify requested on a CorrectiveAction that is already VERIFIED or SUPERSEDED"
  - id: ERR_RECALL_STATE_INVALID
    http: 409
    condition: "the RecallEvent is not in the from-state the requested transition needs (announce needs DRAFT; notify needs ANNOUNCED; close needs IN_PROGRESS)"
  - id: ERR_REGISTRATION_NOT_NOTIFIED
    http: 409
    condition: "acknowledge requested on a ConsumerRegistration that is still REGISTERED or already ACKNOWLEDGED"

  # ------------------------------------------------------- safety gates (422)
  - id: ERR_NO_JOINT_SAMPLES
    http: 422
    condition: "release requested on a lot with zero JointIntegritySample rows (the empty-collection edge; conformance_index is null, not 0.00)"
  - id: ERR_JOINT_SAMPLE_COUNT_SHORT
    http: 422
    condition: "release requested with joint_sample_count below required_joint_sample_count = max(4, ceil(produced_units / 250))"
  - id: ERR_JOINT_INTEGRITY_FAILURE
    http: 422
    condition: "release or RELEASE disposition requested on a lot whose joint_fail_count is greater than 0"
  - id: ERR_CONFORMANCE_BELOW_MINIMUM
    http: 422
    condition: "release or RELEASE disposition requested with conformance_index below MIN_CONFORMANCE_INDEX (2.00)"
  - id: ERR_LABEL_SET_INCOMPLETE
    http: 422
    condition: "release-to-retail requested while one of the six REQUIRED_DOC_KINDS has no APPROVED ProductDocument for the product"
  - id: ERR_LABEL_PLACEMENT_INVALID
    http: 422
    condition: "a label kind carries no placement_zone (or a non-label kind carries one), a WARNING_LABEL has fewer than two pictograms, or an ASSEMBLY_INSTRUCTION_SHEET has includes_assembly_instructions false"

  # ------------------------------------------------------- referential integrity (409 / 422)
  - id: ERR_REVISION_PRODUCT_MISMATCH
    http: 409
    condition: "the named DesignRevision belongs to a different Product than the request's product"
  - id: ERR_AUDIT_SCOPE_MISMATCH
    http: 409
    condition: "a PERIODIC_AUDIT campaign names a ListingRecord or ProductionLot belonging to a different product"
  - id: ERR_AUDIT_FIELDS_MISMATCH
    http: 422
    condition: "purpose PERIODIC_AUDIT is missing listing_record_id / sampled_lot_id / a sample window, or a non-audit purpose supplies any of them"
  - id: ERR_SUPERSEDE_TARGET_MISMATCH
    http: 409
    condition: "supersedes_revision_id points at a revision of another product, or supersedes_action_id at an action on another incident"

  # ------------------------------------------------------- business constraints (409 / 422)
  - id: ERR_REVISION_NOT_APPROVED
    http: 409
    condition: "the pinned DesignRevision is not APPROVED, or it is APPROVED but already SUPERSEDED"
  - id: ERR_DESIGN_NOT_FROZEN
    http: 409
    condition: "the operation needs product.design_status == DESIGN_FROZEN and the product is still DRAFT or already DESIGN_OBSOLETE"
  - id: ERR_QUALIFYING_CAMPAIGN_MISSING
    http: 422
    condition: "no PASSED TestCampaign of the required purpose exists (DESIGN_QUALIFICATION for freeze-design, CERTIFICATION_LISTING on the frozen revision for listing)"
  - id: ERR_STANDARD_NOT_ACCREDITED
    http: 422
    condition: "the ListingRecord.standard_code is absent from the owning ListingBody.accredited_standards array"
  - id: ERR_NO_ACTIVE_LISTING
    http: 422
    condition: "release-to-retail requested while the product has no ListingRecord in status LISTED"
  - id: ERR_BENCH_CAPACITY_INSUFFICIENT
    http: 422
    condition: "the reserved TestBench.max_load_capacity_lb is below the product's required_test_load_lb"
  - id: ERR_PROCESS_TRACEABILITY_MISSING
    http: 422
    condition: "a FIBERGLASS_PULTRUSION lot has no pultrusion_batch_id, or an ALUMINUM_EXTRUSION lot has no extrusion_heat_number"
  - id: ERR_PRODUCED_UNITS_INVALID
    http: 422
    condition: "produced_units is not in 1..lot.planned_units"
  - id: ERR_LOT_NOT_SHIPPABLE
    http: 409
    condition: "a consumer registration names a lot that is still OPEN or IN_PROCESS, or already SCRAPPED"
  - id: ERR_REQUIRED_TESTS_MISSING
    http: 422
    condition: "conclude requested on a DESIGN_QUALIFICATION / CERTIFICATION_LISTING / INCIDENT_INVESTIGATION campaign missing a test_code from its product- and joint-type-derived required set"
  - id: ERR_AUDIT_SAMPLE_SHORT
    http: 422
    condition: "conclude requested on a PERIODIC_AUDIT campaign whose load_test_count is below its derived audit_sample_size"
  - id: ERR_RISK_SCORE_ABOVE_THRESHOLD
    http: 422
    condition: "resume-ship requested while product.risk_score_mitigated is at or above RISK_CLEAR_THRESHOLD (25.00)"
  - id: ERR_QUARANTINE_HOLD_PRESENT
    http: 409
    condition: "resume-ship requested while a lot of the product is still QUARANTINED or held_registration_count is greater than 0"
  - id: ERR_RECALL_ALREADY_OPEN
    http: 409
    condition: "a second RecallEvent is created for a product that already has one in DRAFT, ANNOUNCED or IN_PROGRESS"
  - id: ERR_RECALL_SCOPE_EMPTY
    http: 422
    condition: "announce requested when no lot of the product matches the recall's affected_revision_ids with status RELEASED or QUARANTINED and a non-null released_at"
  - id: ERR_RECALL_UNITS_OUTSTANDING
    http: 409
    condition: "close requested while units_outstanding is greater than 0 and the clock has not reached announced_at + MAX_RECALL_WINDOW_DAYS (365)"
  - id: ERR_REMEDY_CHOICE_MISMATCH
    http: 422
    condition: "the acknowledged remedy_choice differs from the linked RecallEvent.remedy_type"
  - id: ERR_FINDING_ROOT_CAUSE_MISMATCH
    http: 422
    condition: "finding ROOT_CAUSE_IDENTIFIED supplied without a root_cause_code, or finding NOT_SUBSTANTIATED supplied with one"
  - id: ERR_DESIGN_MARGIN_INSUFFICIENT
    http: 422
    condition: "structural_margin_pct is below MIN_STRUCTURAL_MARGIN_PCT (2.00) at submit, or rail_section_modulus_in3 is below MIN_SECTION_MODULUS_IN3 (0.180) at approval"

  # ------------------------------------------------------- temporal and uniqueness (409)
  - id: ERR_BENCH_WINDOW_CONFLICT
    http: 409
    condition: "a bench reservation collides with a HELD or CONSUMED reservation on the same bench under half-open-plus-cooldown semantics: new.start_at < existing.end_at + cooldown_minutes and new.end_at > existing.start_at"
  - id: ERR_AUDIT_WINDOW_OVERLAP
    http: 409
    condition: "a PERIODIC_AUDIT sample window collides with another audit window on the same listing record under closed-interval semantics: new.start <= existing.end and new.end >= existing.start (touching endpoints collide; no buffer)"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "a globally unique code repeats (model_code, bench_code, body_code, lot_code), a revision_label repeats within a product, or a sample_seq repeats within a lot"

# =============================================================================
# §1.7 RBAC Table
# =============================================================================
roles:

  - name: DesignEngineer
    identity: opaque
    description: "Authors products and design revisions and drafts label/packaging documents. Cannot approve its own work."
    exclusive_operations:
      - "POST /ladder-ops/products"
      - "POST /ladder-ops/design-revisions/{id}/submit"
      - "POST /ladder-ops/design-revisions/{id}/revise"
    shared_operations:
      - "POST /ladder-ops/design-revisions (with SafetyDirector for corrective-action drafting)"
      - "POST /ladder-ops/product-documents"
      - "POST /ladder-ops/corrective-actions"
      - "read endpoints for products, revisions, campaigns, incidents and corrective actions"

  - name: DesignApprover
    identity: opaque
    description: "Reviews revisions, freezes designs and verifies corrective actions. Segregation of duties: cannot review a revision it submitted, nor verify a corrective action it authored."
    exclusive_operations:
      - "POST /ladder-ops/design-revisions/{id}/review"
      - "POST /ladder-ops/products/{id}/freeze-design"
      - "POST /ladder-ops/corrective-actions/{id}/verify"
    shared_operations:
      - "read endpoints for products, revisions, campaigns, listings, incidents and corrective actions"

  - name: TestLabTechnician
    identity: opaque
    description: "Owns the test lab: benches, reservations, campaigns, load tests and joint pull samples."
    exclusive_operations:
      - "POST /ladder-ops/test-benches"
      - "POST /ladder-ops/bench-reservations"
      - "POST /ladder-ops/bench-reservations/{id}/cancel"
      - "POST /ladder-ops/test-campaigns/{id}/start"
      - "POST /ladder-ops/test-campaigns/{id}/load-tests"
      - "POST /ladder-ops/test-campaigns/{id}/conclude"
    shared_operations:
      - "POST /ladder-ops/test-campaigns (with ComplianceOfficer)"
      - "POST /ladder-ops/production-lots/{id}/joint-samples (with ProductionSupervisor)"
      - "read endpoints for products, revisions, benches, reservations, campaigns and lots"

  - name: ProductionSupervisor
    identity: opaque
    description: "Runs extrusion / pultrusion / assembly lots. May quarantine and may dispose QUARANTINED lots only by RELEASE — never by SCRAP."
    exclusive_operations:
      - "POST /ladder-ops/production-lots"
      - "POST /ladder-ops/production-lots/{id}/start-production"
      - "POST /ladder-ops/production-lots/{id}/release"
    shared_operations:
      - "POST /ladder-ops/production-lots/{id}/joint-samples (with TestLabTechnician)"
      - "POST /ladder-ops/production-lots/{id}/quarantine (with ComplianceOfficer and SafetyDirector)"
      - "POST /ladder-ops/production-lots/{id}/disposition, RELEASE only (SCRAP is SafetyDirector-only)"
      - "read endpoints for products, lots and joint samples"

  - name: ComplianceOfficer
    identity: opaque
    description: "Owns labeling approval, listing applications and retail release, plus consumer notification duty."
    exclusive_operations:
      - "POST /ladder-ops/product-documents/{id}/approve"
      - "POST /ladder-ops/listing-bodies"
      - "POST /ladder-ops/listing-records"
      - "POST /ladder-ops/products/{id}/release-to-retail"
      - "GET /ladder-ops/products/{id}/liability-dossier (shared with SafetyDirector)"
    shared_operations:
      - "POST /ladder-ops/products/{id}/stop-ship (with SafetyDirector)"
      - "POST /ladder-ops/test-campaigns (with TestLabTechnician)"
      - "POST /ladder-ops/production-lots/{id}/quarantine"
      - "POST /ladder-ops/consumer-registrations and .../acknowledge (on a consumer's behalf)"
      - "POST /ladder-ops/field-incidents"
      - "POST /ladder-ops/recall-events/{id}/notify"

  - name: CertificationBody
    identity: "entity_backed:ListingBody"
    description: "Third-party listing body. X-User-ID is a ListingBody.id; it may only act on ListingRecords whose listing_body_id equals its own id (ownership check at §1.4 priority 5)."
    exclusive_operations:
      - "POST /ladder-ops/listing-records/{id}/list"
      - "POST /ladder-ops/listing-records/{id}/suspend"
    shared_operations:
      - "read endpoints for products, listings, campaigns, load tests, lots and joint samples (audit evidence)"

  - name: Consumer
    identity: opaque
    description: "Retail purchaser. Registers a unit, reports a field incident and acknowledges a recall remedy; sees nothing about design, tests or production."
    exclusive_operations: []
    shared_operations:
      - "POST /ladder-ops/consumer-registrations"
      - "POST /ladder-ops/consumer-registrations/{id}/acknowledge"
      - "POST /ladder-ops/field-incidents"
      - "GET /ladder-ops/consumer-registrations/{id}"
      - "GET /ladder-ops/recall-events/{id}"

  - name: SafetyDirector
    identity: opaque
    description: "Product-safety authority: investigations, scrap authority, resume-ship authority and recall lifecycle."
    exclusive_operations:
      - "POST /ladder-ops/products/{id}/resume-ship"
      - "POST /ladder-ops/field-incidents/{id}/resolve-investigation"
      - "POST /ladder-ops/recall-events"
      - "POST /ladder-ops/recall-events/{id}/announce"
      - "POST /ladder-ops/recall-events/{id}/close"
      - "POST /ladder-ops/production-lots/{id}/disposition with disposition=SCRAP"
    shared_operations:
      - "POST /ladder-ops/products/{id}/stop-ship (with ComplianceOfficer)"
      - "POST /ladder-ops/production-lots/{id}/quarantine"
      - "POST /ladder-ops/field-incidents and .../investigate"
      - "POST /ladder-ops/corrective-actions (with DesignEngineer)"
      - "POST /ladder-ops/recall-events/{id}/notify"
      - "GET /ladder-ops/products/{id}/liability-dossier"

  - name: SystemOperator
    identity: opaque
    description: "Test-harness operator for the deterministic logical clock only; holds no business permission."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
