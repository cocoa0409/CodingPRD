      - name: compliance_report_cycles_variance_flagged_to_corrected_back_to_submitted
        claim_type: Cyclic loop and termination condition
        grounds:
          - complexity_profile.state_machine_shape_cyclic
          - state_machines.ComplianceReport.VARIANCE_FLAGGED_to_CORRECTED
          - state_machines.ComplianceReport.CORRECTED_to_SUBMITTED
          - endpoints.POST_/false-alarm-program/compliance-reports/{reportId}/correct
        distinguishing_aspect: "One correction traverses two transitions inside a single request: VARIANCE_FLAGGED -> CORRECTED -> SUBMITTED, so the observable end state is SUBMITTED again with correction_count 1, reviewed_at and variance_notes cleared, and variance_pct recomputed to 0.0000 — the loop is bounded by correction_count <= 2."
        test_recipe:
          setup:
            - "One DISPATCHED request exists in the period, so system_dispatch_count is 1; the company reports 10 dispatches, giving variance_count 9 and variance_pct 9.0000 > 0.1000. Clock 2026-09-30T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
