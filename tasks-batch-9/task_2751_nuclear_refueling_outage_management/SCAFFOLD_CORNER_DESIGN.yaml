      - name: cascade_results_are_visible_on_the_first_read_after_the_write
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "state_machines.RadiologicalWorkPermit.transitions[DRAFT->APPROVED].side_effects", "calculations.outage_dose_ledger"]
        distinguishing_aspect: "One permit approval writes a ledger row, two derived outage fields and a posture, and holds a sibling permit. Every one of those effects is readable on the first request that follows, with no retry and no stale intermediate value — the approval response itself already reports the permit as APPROVED."
        test_recipe:
          setup:
            - "Two rad areas at 25 mrem/hr with 2-hour buffers, CTMT-EL471 and CTMT-EL500."
            - "Outage UNIT_1 / 1R24 with dose_budget_total_mrem 900, driven to SCOPE_LOCKED with two APPROVED work orders."
            - "Permit A on CTMT-EL471: 5 workers, 5 h, shielding 0 -> per-worker 125.00, collective 625.00, contingency 125.00, committed 750.00, alara_review_required true."
            - "Permit B on CTMT-EL500: 4 workers, 3 h, shielding 0 -> committed 360.00, above the 200 mrem hold threshold, left DRAFT."
            - "Approving A leaves remaining 150.00 and a ratio of 150 / 900 = 0.1667 <= 0.25, so the posture flips NORMAL -> RESTRICTED and the cascade must hold permit B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "CTMT-EL471", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_a: "$.data.id" }
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "CTMT-EL500", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_b: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 900, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Survey A", estimated_hours: 60, estimated_cost_usd: 100000, estimated_dose_mrem: 100, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_a: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Survey B", estimated_hours: 60, estimated_cost_usd: 100000, estimated_dose_mrem: 100, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_b: "$.data.id" }
            - call: "POST /work-orders/${wo_a}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_a}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo_b}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_b}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo_a}/rwps"
              payload: { rad_area_id: "${ra_a}", worker_count: 5, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 5 }
              as: RadProtectionPlanner
              captures: { rwp_a: "$.data.id" }
            - call: "POST /work-orders/${wo_b}/rwps"
              payload: { rad_area_id: "${ra_b}", worker_count: 4, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 3 }
              as: RadProtectionPlanner
              captures: { rwp_b: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
          trigger:
            - call: "POST /rwps/${rwp_a}/approve"
              payload: { alara_review_reference: "ALARA-2026-0142" }
              as: RadProtectionManager
              captures: { a_status: "$.data.status" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { committed: "$.data.dose_committed_mrem", remaining: "$.data.dose_budget_remaining_mrem", posture: "$.data.alara_posture" }
            - call: "GET /rwps/${rwp_b}"
              payload: {}
              as: RadProtectionPlanner
              captures: { b_status: "$.data.status" }
            - call: "GET /rwps/${rwp_a}/dose-transactions"
              payload: {}
              as: RadProtectionManager
          assert:
            - "${a_status} == APPROVED in the write's own response, with committed_dose_mrem 750.00"
            - "${committed} == 750.00, ${remaining} == 150.00 and ${posture} == RESTRICTED on the very first read"
            - "${b_status} == HELD_FOR_ALARA on the very first read — the conditional cascade had already run inside the approve request"
            - "The dose-transaction list returns 1 row, direction COMMIT, amount_mrem 750.00, reason RWP_APPROVED, total_count 1"
            - "No assertion in this recipe needed a second attempt or a delay: the consistency model is immediate"
