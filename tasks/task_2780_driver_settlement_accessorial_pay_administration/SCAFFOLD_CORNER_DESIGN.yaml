      - name: per_mile_leg_uses_the_marginal_band_rate_above_the_break
        claim_type: tiered_pricing
        grounds:
          - calculations.linehaul_component_pay
          - entities.PayComponent.fields.rate_value
        excluded_because:
          difficulty_instance: combinatorial_formula / linehaul_band_max_and_tie_composite
          rationale: "That instance already pins the MILEAGE_BAND_BREAK 500 split and the LONG_HAUL_BUMP_CENTS 3 marginal rate together with the max() selection and the exact tie."
      - name: the_mileage_guide_selects_which_stored_mileage_column_pays
        claim_type: variant_selection
        grounds:
          - calculations.paid_miles_determination
          - entities.PayPackage.fields.mileage_guide
          - entities.Load.fields.applied_mileage_guide
        excluded_because:
          difficulty_instance: dual_variant_calc / paid_miles_guide_variant_practical_vs_hhg
          rationale: "That instance runs the identical load under PRACTICAL and under HHG and asserts the divergent paid_miles, amount and linehaul_line_type, which is the whole variant-selection claim."
