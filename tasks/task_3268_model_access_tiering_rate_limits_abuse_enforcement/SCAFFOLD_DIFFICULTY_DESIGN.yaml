# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3268_model_access_tiering_rate_limits_abuse_enforcement
# Nine Difficulty Rules × 2 instances each. Trimmed endpoint surface (40).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: tier_progression_forward_looking_vs_settled_only
        grounds:
          - calculations.tier_progression
          - entities.Organization.fields.tier
          - entities.Organization.fields.lifetime_spend_cents
          - endpoints.GET_/organizations/{id}
        distinguishing_aspect: |
          Entity domain = Organization tier projection. The forward_looking
          variant (GET with preview=true) counts PENDING payments toward the
          projection, while the settled_only variant (default GET, persisted
          tier) counts only SETTLED payments. With one 2_000_000-cent PENDING
          topup plus settled spend of 4_000_000 over 4 qualifying payments,
          the preview reports TIER_2 but the persisted tier remains TIER_1 —
          same underlying data, two variants, two different outputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization onboarded with four settled 1_000_000-cent topups (settled spend = 4_000_000 cents, count = 4) plus one PENDING topup of 2_000_000 cents; counting the PENDING payment would reach spend 6_000_000 and count 5, satisfying TIER_2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Tier Preview Corp" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /payment-events/${p2}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p3: $.data.id }
            - call: "POST /payment-events/${p3}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p4: $.data.id }
            - call: "POST /payment-events/${p4}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 2000000 }
              as: PlatformAdmin
              captures: { p_pending: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}?preview=true"
              payload: {}
              as: BillingContact
              captures: { preview_tier: $.data.tier }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: BillingContact
              captures: { settled_tier: $.data.tier, settled_spend: $.data.lifetime_spend_cents }
          assert:
            - "settled_spend == 4000000 and qualifying_payment_count == 4 on the persisted record"
            - "preview variant returns tier == TIER_2 (counts the PENDING 2_000_000 topup)"
            - "persisted Organization.tier == TIER_1 (settled_only variant; PENDING payment ignored)"
            - "preview_tier != settled_tier — same organization, two variants produce different tiers"

      - name: batch_discount_provisional_vs_finalized
        grounds:
          - calculations.batch_discount
          - entities.Invoice.fields.batch_discount_cents
          - endpoints.POST_/invoices/{id}/finalize
        distinguishing_aspect: |
          Entity domain = Invoice discount computation. The provisional_estimate
          variant recomputes discount on current DRAFT lines without persisting;
          the finalized variant locks the value onto the Invoice row. Because
          lines are fixed at invoice creation, the divergence is observable
          across time: while DRAFT, batch_discount_cents stays at its default 0
          (provisional — nothing persisted); after finalize, the same invoice
          reports the locked value 1050. Same line data, two variants, two
          different observable values.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE. Model version created with pricing {input: 300, output: 1500, cached: 30} cents/MTok. DRAFT invoice over [2026-09-01, 2026-09-02) created with two batch lines: 2_000_000 input tokens at 300 cents/MTok and 1_000_000 output tokens at 1500 cents/MTok."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Batch Discount Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /invoices"
              payload:
                organization_id: "${org_id}"
                period_start: "2026-09-01T00:00:00Z"
                period_end: "2026-09-02T00:00:00Z"
                lines:
                  - { model_version_id: "${mv_id}", kind: "INPUT_TOKENS", quantity: 2000000, rate_per_mtok_cents: 300, batch: true }
                  - { model_version_id: "${mv_id}", kind: "OUTPUT_TOKENS", quantity: 1000000, rate_per_mtok_cents: 1500, batch: true }
              as: BillingContact
              captures: { inv_id: $.data.id, draft_discount: $.data.batch_discount_cents }
          trigger:
            - call: "POST /invoices/${inv_id}/finalize"
              payload: {}
              as: BillingContact
              captures: { final_discount: $.data.batch_discount_cents, final_subtotal: $.data.subtotal_cents, final_total: $.data.total_cents }
          assert:
            - "while DRAFT the invoice reports batch_discount_cents == 0 (provisional variant: nothing persisted)"
            - "after finalize: Invoice.${inv_id}.subtotal_cents == 2100 (600 + 1500 per-line rounded)"
            - "Invoice.${inv_id}.batch_discount_cents == 1050 (round_half_up(2100 * 0.5))"
            - "Invoice.${inv_id}.total_cents == 1050 and status == FINALIZED — finalized variant persists; draft value 0 != finalized value 1050"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: rate_limit_enterprise_throttle_burst_interaction
        grounds:
          - calculations.rate_limit_for_window
          - entities.RateLimitWindow.fields.requests_used
          - entities.RateLimitWindow.fields.burst_credits_used
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. Inputs
          are the tier cap (from agreement.committed_tpm via ceil division), an
          active unrevoked THROTTLE flag (multiplies caps by 0.25 with floor),
          and the burst pool (sized 2 * effective rpm). The interaction is
          non-linear because the throttle factor applies to the base cap BEFORE
          burst pool sizing: an ENTERPRISE org with committed_tpm 8000 under
          THROTTLE sees effective rpm = floor(ceil(8000/1000) * 0.25) = 2 and
          burst pool = 2 * 2 = 4 — not 2 * 8 = 16 with throttle applied to
          admission afterwards.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE, ENTERPRISE via agreement with committed_tpm = 8000 (base rpm = 8, tpm = 8000). Abuse case ACTIONED with unrevoked THROTTLE action, so effective rpm = 2, effective tpm = 2000, burst pool = 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Throttle Interact Inc" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /enterprise-agreements"
              payload: { organization_id: "${org_id}", committed_tpm: 8000, dedicated_capacity_pct: 50, effective_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ea_id: $.data.id }
            - call: "POST /enterprise-agreements/${ea_id}/countersign"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { case_v: $.data.version }
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "THROTTLE", expected_abuse_case_version: "${case_v}" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:00:00Z", requests: 2, input_tokens: 1000, output_tokens: 500, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { ur1_id: $.data.id }
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:00:00Z", requests: 3, input_tokens: 500, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { ur2_id: $.data.id }
            - call: "GET /organizations/${org_id}/rate-limit-windows"
              payload: { model_version_id: "${mv_id}" }
              as: PlatformAdmin
          assert:
            - "first usage record admitted within throttled base cap: 2 <= effective rpm 2"
            - "second usage record admitted via burst: 3 requests over the base cap consume 3 burst credits"
            - "RateLimitWindow for 2026-09-01T00:00 has requests_used == 5 and burst_credits_used == 3"
            - "burst pool is 4 (2 * throttled rpm 2), proving throttle applies BEFORE pool sizing; an implementation sizing the pool from the unthrottled rpm 8 would allow 8 more requests, not 1 more"

      - name: invoice_pricing_per_line_rounding_order
        grounds:
          - calculations.invoice_pricing
          - entities.InvoiceLine.fields.amount_cents
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          "round each line amount half-up to integer cents first, then
          integer-sum into subtotal". Sum-quantities-then-round yields a
          different subtotal. With two lines of 1_500_000 tokens at 1 cent/MTok
          each: per-line rounding gives round_half_up(1.5) = 2 cents per line,
          subtotal 4 cents; sum-then-round gives round_half_up(3.0) = 3 cents.
          The two orders diverge by exactly 1 cent on this minimal input.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE. Model created with pricing {input: 1, output: 1, cached: 0} cents/MTok (extreme low rate to expose the rounding). DRAFT invoice over [2026-09-01, 2026-09-02) with two non-batch INPUT_TOKENS lines, each quantity = 1_500_000 at rate 1 cent/MTok."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Rounding Order LLC" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-haiku", version_tag: "4-5", pricing: { input_per_mtok_cents: 1, output_per_mtok_cents: 1, cached_per_mtok_cents: 0 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /invoices"
              payload:
                organization_id: "${org_id}"
                period_start: "2026-09-01T00:00:00Z"
                period_end: "2026-09-02T00:00:00Z"
                lines:
                  - { model_version_id: "${mv_id}", kind: "INPUT_TOKENS", quantity: 1500000, rate_per_mtok_cents: 1 }
                  - { model_version_id: "${mv_id}", kind: "INPUT_TOKENS", quantity: 1500000, rate_per_mtok_cents: 1 }
              as: BillingContact
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/finalize"
              payload: {}
              as: BillingContact
              captures: { subtotal: $.data.subtotal_cents, total: $.data.total_cents }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_id}" }
              as: BillingContact
          assert:
            - "each InvoiceLine.amount_cents == 2 (round_half_up(1500000 * 1 / 1000000) = round_half_up(1.5) = 2)"
            - "Invoice.${inv_id}.subtotal_cents == 4 (2 + 2; pinned per-line rounding)"
            - "sum-then-round would compute round_half_up(3.0) == 3 — the two orders diverge by exactly 1 cent on this input"
            - "Invoice.${inv_id}.total_cents == 4 (no batch lines, so discount is 0)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: model_version_draft_gated_revision_cycle
        grounds:
          - state_machines.ModelVersion.DRAFT_to_GATED
          - state_machines.ModelVersion.GATED_to_DRAFT
          - state_machines.ModelVersion.GATED_to_ACTIVE
        distinguishing_aspect: |
          Entity = ModelVersion; cycle is DRAFT -> GATED -> DRAFT on a failed
          safety verdict, and the loop can repeat until a verdict passes. The
          first evaluation (score 0.60 < 0.70 STANDARD threshold) FAILS and
          returns the model to DRAFT; a second evaluation on the same model
          (score 0.85) PASSES and releases it to ACTIVE. "GATED" is not a
          one-way gate — the failed-verdict back-edge distinguishes this from
          a linear pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Model version created (DRAFT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-opus", version_tag: "5-0", pricing: { input_per_mtok_cents: 1500, output_per_mtok_cents: 7500, cached_per_mtok_cents: 150 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /model-versions/${mv_id}/safety-evaluations"
              payload: { capability_class: "STANDARD" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { eval1_id: $.data.id }
            - call: "POST /safety-evaluations/${eval1_id}/submit-verdict"
              payload: { score: 0.60 }
              as: TrustLead
              as_user_id: "lead-1"
            - call: "GET /model-versions/${mv_id}"
              payload: {}
              as: PlatformAdmin
              captures: { status_after_fail: $.data.status }
          trigger:
            - call: "POST /model-versions/${mv_id}/safety-evaluations"
              payload: { capability_class: "STANDARD" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { eval2_id: $.data.id }
            - call: "POST /safety-evaluations/${eval2_id}/submit-verdict"
              payload: { score: 0.85 }
              as: TrustLead
              as_user_id: "lead-1"
            - call: "GET /model-versions/${mv_id}"
              payload: {}
              as: PlatformAdmin
              captures: { status_after_pass: $.data.status }
          assert:
            - "after the failing verdict, ModelVersion.${mv_id}.status == DRAFT (the GATED -> DRAFT back-edge)"
            - "a second evaluation can be opened on the same model (eval2 created from DRAFT — proving the cycle, not a dead end)"
            - "after the passing verdict, ModelVersion.${mv_id}.status == ACTIVE"
            - "SafetyEvaluation.${eval1_id}.status == FAILED and SafetyEvaluation.${eval2_id}.status == PASSED"

      - name: organization_status_branching_enforcement_paths
        grounds:
          - state_machines.Organization.ACTIVE_to_RESTRICTED
          - state_machines.Organization.RESTRICTED_to_SUSPENDED
          - state_machines.Organization.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Entity = Organization; the status machine is non-linear because the
          appeal path (SUSPENDED -> ACTIVE via grant) creates a back-edge, and
          enforcement transitions branch: RESTRICT can come from ACTIVE but
          SUSPEND can only come from RESTRICTED. Two separate abuse cases drive
          the same organization along ACTIVE -> RESTRICTED -> SUSPENDED —
          different severity cases take different paths through the state
          graph, and the appeal back-edge restores ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE. case_low (severity MEDIUM) claimed; case_high (severity HIGH) claimed by a different analyst."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Parallel Dims Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_low: $.data.id }
            - call: "POST /abuse-cases/${case_low}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { case_low_v: $.data.version }
            - call: "POST /abuse-cases/${case_low}/actions"
              payload: { action_type: "RESTRICT", expected_abuse_case_version: "${case_low_v}" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "HIGH" }
              as: TrustAnalyst
              captures: { case_high: $.data.id }
            - call: "POST /abuse-cases/${case_high}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-2"
              captures: { case_high_v: $.data.version }
          trigger:
            - call: "POST /abuse-cases/${case_high}/actions"
              payload: { action_type: "SUSPEND", expected_abuse_case_version: "${case_high_v}" }
              as: TrustAnalyst
              as_user_id: "analyst-2"
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: TrustLead
              captures: { final_status: $.data.status }
          assert:
            - "Organization.${org_id}.status == SUSPENDED (RESTRICTED -> SUSPENDED path taken via the second case)"
            - "Organization.status progressed ACTIVE -> RESTRICTED -> SUSPENDED across two independent cases — branching, not a single linear chain"
            - "SUSPEND directly from ACTIVE would be rejected (ERR_INVALID_STATE); only the RESTRICTED intermediate state admits it"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥ 2 instances, different triggers; depths >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: terminate_cascades_through_agreement_to_tier
        grounds:
          - state_machines.Organization.ACTIVE_to_TERMINATED
          - state_machines.EnterpriseAgreement.ACTIVE_to_TERMINATED
          - calculations.tier_progression
        distinguishing_aspect: |
          Depth 3 cascade from POST /abuse-cases/{id}/actions with TERMINATE:
          (1) Organization.status -> TERMINATED, (2) which itself triggers
          EnterpriseAgreement.status -> TERMINATED for all ACTIVE agreements,
          (3) which itself triggers tier_progression to recompute
          Organization.tier away from ENTERPRISE. Each link is caused by the
          previous link, not by the original action.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE with tier == ENTERPRISE via an ACTIVE enterprise agreement (settled spend 1_000_000, count 1). CRITICAL-severity case UNDER_REVIEW and claimed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Cascade Depth3 Inc" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /enterprise-agreements"
              payload: { organization_id: "${org_id}", committed_tpm: 10000, dedicated_capacity_pct: 25, effective_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ea_id: $.data.id }
            - call: "POST /enterprise-agreements/${ea_id}/countersign"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "CRITICAL" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "TERMINATE", expected_abuse_case_version: "${case_v}" }
              as: TrustLead
              as_user_id: "lead-1"
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: TrustLead
              captures: { org_status: $.data.status, org_tier: $.data.tier }
            - call: "GET /enterprise-agreements/${ea_id}"
              payload: {}
              as: TrustLead
              captures: { ea_status: $.data.status }
          assert:
            - "Organization.${org_id}.status == TERMINATED (link 1)"
            - "EnterpriseAgreement.${ea_id}.status == TERMINATED (link 2, caused by link 1)"
            - "Organization.${org_id}.tier == TIER_1 (link 3, caused by link 2 clearing enterprise_agreement_id; settled spend 1_000_000 with count 1 falls to TIER_1)"
            - "cascade is transitive: the TERMINATE action did not directly touch tier; the tier change is caused by the agreement termination"

      - name: restriction_cascades_through_queued_requests
        grounds:
          - state_machines.Organization.ACTIVE_to_RESTRICTED
          - state_machines.QueuedRequest.QUEUED_to_DROPPED
        distinguishing_aspect: |
          Depth 2 cascade from POST /abuse-cases/{id}/actions with RESTRICT:
          (1) Organization.status -> RESTRICTED, (2) which itself transitions
          every QUEUED QueuedRequest for the org to DROPPED. The queue cleanup
          is a side-effect of the status transition, not of the action
          endpoint directly — distinguishing it from a fan-out.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE with three QUEUED requests against a model. MEDIUM case UNDER_REVIEW and claimed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Queue Cascade Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /queued-requests"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", requests_cost: 1, tokens_cost: 100 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { q1: $.data.id }
            - call: "POST /queued-requests"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", requests_cost: 1, tokens_cost: 100 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { q2: $.data.id }
            - call: "POST /queued-requests"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", requests_cost: 1, tokens_cost: 100 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { q3: $.data.id }
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "RESTRICT", expected_abuse_case_version: "${case_v}" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
            - call: "GET /organizations/${org_id}/queued-requests"
              payload: { status: "DROPPED" }
              as: PlatformAdmin
          assert:
            - "Organization.${org_id}.status == RESTRICTED (link 1)"
            - "all three QueuedRequest rows (${q1}, ${q2}, ${q3}) have status == DROPPED (link 2, caused by link 1)"
            - "GET /organizations/${org_id}/queued-requests?status=DROPPED returns total_count == 3"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥ 2 instances, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_before_business_fiscal_on_payment_settle
        grounds:
          - validations.priority_5_state
          - validations.priority_14_business_fiscal
          - errors.ERR_INVALID_STATE
          - errors.ERR_INVALID_AMOUNT
        distinguishing_aspect: |
          Error-category pair: state vs business_fiscal. A settle attempt on
          an already-SETTLED REFUND payment (whose negative amount would also
          trip the sign rule if re-validated as a topup) must surface
          ERR_INVALID_STATE (priority 5), not ERR_INVALID_AMOUNT (priority 14).
          State preconditions always win.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization with a settled REFUND payment of -5000 cents (terminal SETTLED state; the negative amount is the fiscal-rule signature for non-REFUND kinds)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Priority Pair A Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "REFUND", amount_cents: -5000 }
              as: PlatformAdmin
              captures: { p_refund: $.data.id }
            - call: "POST /payment-events/${p_refund}/settle"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payment-events/${p_refund}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "second settle returns http 409 and error_id == ERR_INVALID_STATE (state beats fiscal)"
            - "the response is NOT ERR_INVALID_AMOUNT, even though a negative amount would trip the sign rule for any non-REFUND re-validation"

      - name: business_safety_before_business_constraint_on_usage
        grounds:
          - validations.priority_8_business_safety
          - validations.priority_9_business_constraint
          - errors.ERR_MODEL_UNAVAILABLE
          - errors.ERR_ORG_STATUS_BLOCKED
        distinguishing_aspect: |
          Error-category pair: business_safety vs business_constraint. A usage
          record posted by a RESTRICTED organization (priority 9 violation)
          against a SUNSET model version (priority 8 violation) must surface
          ERR_MODEL_UNAVAILABLE first — safety/compliance checks outrank
          org-status constraint checks.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-01T00:00:00Z. Organization RESTRICTED (via issued RESTRICT action). Model version SUNSET (deprecated 2026-09-01, sunset_at = 2026-10-01T00:00:00Z reached by the clock)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Priority Pair B Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-old", version_tag: "3-0", pricing: { input_per_mtok_cents: 100, output_per_mtok_cents: 500, cached_per_mtok_cents: 10 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /model-versions/${mv_id}/safety-evaluations"
              payload: { capability_class: "STANDARD" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { eval_id: $.data.id }
            - call: "POST /safety-evaluations/${eval_id}/submit-verdict"
              payload: { score: 0.80 }
              as: TrustLead
              as_user_id: "lead-1"
            - call: "POST /model-versions/${mv_id}/deprecate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { case_v: $.data.version }
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "RESTRICT", expected_abuse_case_version: "${case_v}" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-10-01T00:00:00Z", requests: 1, input_tokens: 10, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 422 and error_id == ERR_MODEL_UNAVAILABLE (business_safety priority 8 wins)"
            - "the response is NOT ERR_ORG_STATUS_BLOCKED, even though the RESTRICTED organization also violates priority 9"
            - "model auto-transitioned DEPRECATED -> SUNSET when the clock reached sunset_at"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥ 2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: tier_2_threshold_inclusive_boundary
        grounds:
          - calculations.tier_progression
          - endpoints.POST_/payment-events/{id}/settle
        distinguishing_aspect: |
          Metric = lifetime_spend_cents at the TIER_2 boundary of 5_000_000
          cents; endpoint = POST /payment-events/{id}/settle. The rule is >=
          (inclusive): settled spend of EXACTLY 5_000_000 with EXACTLY 5
          qualifying payments promotes to TIER_2; 4_999_999 with 5 payments
          does NOT.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. org_at has four settled 1_000_000-cent topups plus a fifth 1_000_000-cent payment PENDING (lands at exactly 5_000_000, count 5). org_below has four settled 1_000_000-cent topups plus a 999_999-cent payment PENDING (lands at 4_999_999, count 5)."
