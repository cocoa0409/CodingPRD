  - method: GET
    path: "/trustee/cases/{id}/fee_applications"
    description: "List fee applications of a case"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: ["status?", "applicant_role?"]
    output: "FeeApplication[]"
    side_effects: []

  - method: GET
    path: "/trustee/fee_applications/{id}"
