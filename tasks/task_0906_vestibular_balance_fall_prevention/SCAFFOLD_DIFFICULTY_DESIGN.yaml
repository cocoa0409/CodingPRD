scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fall_risk_screening_vs_clinical_on_assessment
        grounds:
          - calculations.fall_risk_score
          - entities.Assessment.fields.screening_score
          - entities.Assessment.fields.clinical_score
          - state_machines.Assessment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          On the SAME Assessment row the provisional screening_score (self-report only)
          and the final clinical_score (measured composite) are different numbers; the
          dual variant lives on the Assessment domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-01; one patient, referral, clinician; a DRAFT assessment with gait 0.55, tug 14.0, berg 18, meds 5, falls 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Ada Vestibule", date_of_birth: "1948-03-12", insurance_member_id: "MEM-906-01" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "recurrent falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "1234567890" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          assert:
            - "Assessment.${aid}.screening_score == 35"
            - "Assessment.${aid}.clinical_score == 110"
            - "Assessment.${aid}.fall_risk_tier == HIGH"
            - "Assessment.${aid}.screening_score != Assessment.${aid}.clinical_score"

      - name: estimated_vs_billed_responsibility_on_care_plan
        grounds:
          - calculations.care_plan_responsibility
          - entities.CarePlan.fields.estimated_patient_responsibility_cents
          - entities.CarePlan.fields.patient_responsibility_cents
          - state_machines.InsuranceAuthorization.PENDING_to_APPROVED
          - state_machines.Session.SCHEDULED_to_ATTENDED
        distinguishing_aspect: |
          The forward estimate (target_visits * per-visit copay) and the running billed
          total (sum of realized copays) are different numbers on the CarePlan domain —
          a different entity domain from the Assessment fall-risk dual variant.
        test_recipe:
          setup:
            - "ACTIVE HIGH-tier plan (target_visits 12); APPROVED authorization allowed 15000 / coinsurance 0.20; one scheduled session."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Ben Balance", date_of_birth: "1945-07-01", insurance_member_id: "MEM-906-02" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "dizziness" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "1234567891" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Balance Gym A", room_type: "BALANCE_GYM" }
              as: ClinicSupervisor
              captures: { roomid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
            - call: "POST /authorizations"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", payer_name: "Medicare", visits_authorized: 5, allowed_amount_cents: 15000, coinsurance_pct: 0.20 }
              as: IntakeCoordinator
              captures: { authid: $.data.id }
            - call: "POST /authorizations/${authid}/decision"
              payload: { decision: "APPROVE" }
              as: ClinicSupervisor
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /sessions/${sid}/attend"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          assert:
            - "CarePlan.${cpid}.estimated_patient_responsibility_cents == 36000"
            - "CarePlan.${cpid}.patient_responsibility_cents == 3000"
            - "CarePlan.${cpid}.estimated_patient_responsibility_cents != CarePlan.${cpid}.patient_responsibility_cents"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: clinical_score_tiered_composite_mode_a
        grounds:
          - calculations.fall_risk_score
          - entities.Assessment.fields.clinical_score
          - state_machines.Assessment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): a 5-input non-linear composite where each input selects a tiered point
          band (gait/tug/berg/meds/history) — mixed-tier inputs yield clinical_score 40 / MODERATE.
        test_recipe:
          setup:
            - "One DRAFT assessment with gait 0.90, tug 11.0, berg 30, meds 2, falls 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Cy Cochlea", date_of_birth: "1950-02-02", insurance_member_id: "MEM-906-03" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "unsteady" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr OT", discipline: "OT", npi: "1234567892" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.90, tug_seconds: 11.0, berg_balance_score: 30, medication_count: 2, self_report_fall_count: 1 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          assert:
            - "Assessment.${aid}.clinical_score == 40"
            - "Assessment.${aid}.fall_risk_tier == MODERATE"

      - name: copay_round_per_session_then_sum_mode_b
        grounds:
          - calculations.session_copay
          - calculations.care_plan_responsibility
          - entities.Session.fields.copay_cents
          - entities.CarePlan.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each session copay round_half_up(3333*0.20)=667
          is rounded first, THEN summed to 2001 over 3 visits; sum-then-round would give 2000.
        test_recipe:
          setup:
            - "ACTIVE plan; APPROVED authorization allowed 3333 / coinsurance 0.20 / 5 visits; three non-overlapping sessions, two already attended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Dot Dizzy", date_of_birth: "1946-05-05", insurance_member_id: "MEM-906-04" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "1234567893" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Gait Lab", room_type: "GAIT_LAB" }
              as: ClinicSupervisor
              captures: { roomid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
            - call: "POST /authorizations"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", payer_name: "Aetna", visits_authorized: 5, allowed_amount_cents: 3333, coinsurance_pct: 0.20 }
              as: IntakeCoordinator
              captures: { authid: $.data.id }
            - call: "POST /authorizations/${authid}/decision"
              payload: { decision: "APPROVE" }
              as: ClinicSupervisor
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T11:15:00Z", scheduled_end: "2026-06-01T12:15:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { s2: $.data.id }
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T12:30:00Z", scheduled_end: "2026-06-01T13:30:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { s3: $.data.id }
            - call: "POST /sessions/${s1}/attend"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /sessions/${s2}/attend"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          trigger:
            - call: "POST /sessions/${s3}/attend"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          assert:
            - "Session.${s1}.copay_cents == 667"
            - "CarePlan.${cpid}.patient_responsibility_cents == 2001"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: care_plan_active_reassessment_cycle
        grounds:
          - state_machines.CarePlan.ACTIVE_to_UNDER_REASSESSMENT
          - state_machines.CarePlan.UNDER_REASSESSMENT_to_ACTIVE
          - state_machines.Reassessment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          CarePlan cycles ACTIVE -> UNDER_REASSESSMENT -> ACTIVE (a revision loop, not a
          linear pipeline); after finalize the plan returns to ACTIVE with an updated tier.
        test_recipe:
          setup:
            - "ACTIVE HIGH-tier plan; a DRAFT reassessment created (plan now UNDER_REASSESSMENT) with low-risk re-measures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Eve Equil", date_of_birth: "1944-09-09", insurance_member_id: "MEM-906-05" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "vertigo" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "1234567894" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
            - call: "POST /care-plans/${cpid}/reassessments"
              payload: { clinician_id: "${clid}", gait_speed_m_s: 1.20, tug_seconds: 8.0, berg_balance_score: 55, medication_count: 0, self_report_fall_count: 0 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { reid: $.data.id }
          trigger:
            - call: "POST /reassessments/${reid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          assert:
            - "Reassessment.${reid}.status == FINALIZED"
            - "Reassessment.${reid}.clinical_score == 0"
            - "CarePlan.${cpid}.status == ACTIVE"
            - "CarePlan.${cpid}.fall_risk_tier == LOW"
            - "CarePlan.${cpid}.target_visits == 4"

      - name: session_attendance_billing_parallel
        grounds:
          - state_machines.Session.SCHEDULED_to_ATTENDED
          - state_machines.Session.ATTENDED_to_CANCELLED
          - entities.Session.fields.attendance_status
          - entities.Session.fields.billing_status
        distinguishing_aspect: |
          Session carries two independent dimensions: attendance (SCHEDULED->ATTENDED->CANCELLED)
          and billing (UNBILLED->BILLED->REVERSED) that advance separately on the same row.
        test_recipe:
          setup:
            - "ACTIVE plan; APPROVED auth allowed 15000 / 0.20; one scheduled session."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Fay Falls", date_of_birth: "1943-01-01", insurance_member_id: "MEM-906-06" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "balance" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "1234567895" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Balance Gym B", room_type: "BALANCE_GYM" }
              as: ClinicSupervisor
              captures: { roomid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
            - call: "POST /authorizations"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", payer_name: "Cigna", visits_authorized: 5, allowed_amount_cents: 15000, coinsurance_pct: 0.20 }
              as: IntakeCoordinator
              captures: { authid: $.data.id }
            - call: "POST /authorizations/${authid}/decision"
              payload: { decision: "APPROVE" }
              as: ClinicSupervisor
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /sessions/${sid}/attend"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /sessions/${sid}/cancel"
              payload: {}
              as: ClinicSupervisor
          assert:
            - "Session.${sid}.attendance_status == CANCELLED"
            - "Session.${sid}.billing_status == REVERSED"
            - "CarePlan.${cpid}.patient_responsibility_cents == 0"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_plan_cancels_sessions_releases_visits
        grounds:
          - state_machines.CarePlan.ACTIVE_to_DISCHARGED
          - state_machines.Session.SCHEDULED_to_CANCELLED
          - entities.InsuranceAuthorization.fields.visits_used
        distinguishing_aspect: |
          Depth-3 chain from discharge: CarePlan DISCHARGED -> its SCHEDULED Session CANCELLED
          -> that Session's Authorization.visits_used decremented; each hop caused by the prior.
        test_recipe:
          setup:
            - "ACTIVE plan; APPROVED auth (5 visits, 15000/0.20); session s1 attended (BILLED, visits_used=1), session s2 scheduled (visits_used=2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Gus Gait", date_of_birth: "1942-03-03", insurance_member_id: "MEM-906-07" }
