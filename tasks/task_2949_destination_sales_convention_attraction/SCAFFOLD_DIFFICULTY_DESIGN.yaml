              as: SalesManager
              as_user_id: "sales-11"
              captures: { bid_two_id: $.data.id }
            - call: "POST /bid-packages/${bid_two_id}/request-incentive"
              payload: { incentive_request_amount: 100.00, service_commitment_codes: ["CITY_SIGNAGE"] }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { cap_two_at_request: $.data.incentive_cap_amount }
