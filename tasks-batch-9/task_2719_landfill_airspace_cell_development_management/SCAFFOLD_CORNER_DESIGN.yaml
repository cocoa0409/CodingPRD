              captures: { est_state: $.data.status, est_cc: $.data.closure_cost_total, est_pc: $.data.post_closure_cost_total, est_req: $.data.required_assurance_amount, est_short: $.data.funding_shortfall }
            - call: "GET /landfills/${lf_id}"
              payload: {}
