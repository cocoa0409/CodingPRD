  # ===========================================================================
  - section: errors
    instances:

      - name: every_http_status_class_in_the_catalog_is_reachable_with_the_declared_status_code
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_MATERIAL_SPECIFICATION_NOT_FOUND
          - errors.ERR_DUPLICATE_MATERIAL_CODE
          - errors.ERR_TEST_CODE_NOT_IN_SPEC
        distinguishing_aspect: "The catalog spans six distinct HTTP statuses (401, 403, 400, 404, 409, 422) and an implementation that collapses them — returning 400 for every rejection, or 422 for every business conflict — passes error_id assertions while breaking every client. This instance walks one representative of each status class over a single two-entity fixture and pins BOTH the status and the error_id, so status/id drift in either direction is caught."
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z. One MaterialSpecification AB-ER-1 whose required_test_codes is [POTENCY] only, and one MaterialLot booked against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ER-1", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-ER-1", received_quantity_units: 100.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
          trigger:
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { e401: $.data.error_id }
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ER-2", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
              as: ProductionOperator
              captures: { e403: $.data.error_id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-ER-2", received_quantity_units: -5.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { e400: $.data.error_id }
            - call: "GET /material-specifications/00000000-0000-0000-0000-0000000000d2"
              payload: {}
              as: ProductionOperator
              captures: { e404: $.data.error_id }
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ER-1", material_type: "ENZYME", potency_min_pct: 80.0, potency_max_pct: 120.0, endotoxin_max_eu_per_ml: 5.0, purity_min_pct: 90.0, required_test_codes: ["POTENCY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { e409: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "STERILITY", measured_value: 0.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { e422: $.data.error_id }
            - call: "GET /material-specifications"
              payload: {}
              as: ProductionOperator
              captures: { specs_first: "$.data[0].material_code" }
          assert:
            - "the header-less read returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the ProductionOperator attempting specification registration returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "the negative received_quantity_units returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the unknown specification id returns HTTP 404 with error_id ERR_MATERIAL_SPECIFICATION_NOT_FOUND"
            - "re-registering material_code AB-ER-1 returns HTTP 409 with error_id ERR_DUPLICATE_MATERIAL_CODE, so a uniqueness clash is a conflict and not a 400"
            - "recording STERILITY against a specification whose required_test_codes is [POTENCY] returns HTTP 422 with error_id ERR_TEST_CODE_NOT_IN_SPEC, so an unprocessable-entity rejection is not folded into 400 or 409"
            - "all six responses carry response_type error with a non-empty data.message alongside data.error_id"
            - "after the six rejections the specification list still contains exactly one row (AB-ER-1) with total_count 1 — no rejected call persisted anything"

      - name: error_reagent_lot_state_invalid_on_a_second_disposition
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_REAGENT_LOT_STATE_INVALID
        excluded_because:
          difficulty_instance: reagent_lot_disposition_and_distribution_dimensions_move_independently
          rationale: "The §1.8 parallel-state instance drives a second disposition against an already-dispositioned lot and asserts HTTP 409 ERR_REAGENT_LOT_STATE_INVALID together with the untouched distribution_status."
      - name: error_material_lot_state_invalid_outside_the_investigation_cycle
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_MATERIAL_LOT_STATE_INVALID
        excluded_because:
          difficulty_instance: material_lot_oos_investigation_cycles_back_to_under_test
          rationale: "The §1.8 cyclic instance asserts ERR_MATERIAL_LOT_STATE_INVALID for a retest submitted from a state outside the UNDER_TEST→OOS_INVESTIGATION→UNDER_TEST loop."
      - name: error_acceptance_criteria_not_met_on_qualify
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_ACCEPTANCE_CRITERIA_NOT_MET
        excluded_because:
          difficulty_instance: acceptance_score_inclusive_at_exactly_85_00_and_unrounded_subscores_at_84_88
          rationale: "The §1.8 boundary instance drives QUALIFY at a weighted score of 84.88 and asserts HTTP 409 ERR_ACCEPTANCE_CRITERIA_NOT_MET immediately below the inclusive 85.00 bound."
      - name: error_environmental_nonconformance_on_release
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_ENVIRONMENTAL_NONCONFORMANCE
        excluded_because:
          difficulty_instance: state_precondition_priority_60_beats_environmental_nonconformance_priority_80
          rationale: "The §1.8 priority-pair instance reaches ERR_ENVIRONMENTAL_NONCONFORMANCE once the state precondition is satisfied, which is the only way this code can surface."
      - name: error_fill_line_conflict_on_scheduling
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_FILL_LINE_CONFLICT
        excluded_because:
          difficulty_instance: fill_line_changeover_buffer_closed_interval_symmetric_boundaries
          rationale: "The §1.8 temporal-overlap instance asserts ERR_FILL_LINE_CONFLICT at both symmetric edges of the changeover buffer."
      - name: error_chamber_capacity_exceeded_on_study_start
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_CHAMBER_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: stability_chamber_half_open_interval_with_aggregate_capacity_two
          rationale: "The §1.8 aggregate-capacity instance asserts ERR_CHAMBER_CAPACITY_EXCEEDED for the third overlapping study in one chamber."
      - name: error_allocation_shortfall_on_allocate
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_ALLOCATION_SHORTFALL
        excluded_because:
          difficulty_instance: product_not_cleared_priority_130_beats_allocation_shortfall_priority_140
          rationale: "The §1.8 priority-pair instance asserts ERR_ALLOCATION_SHORTFALL once the clearance gate at priority 130 is satisfied."
      - name: error_allocation_state_invalid_on_a_second_cancel
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_ALLOCATION_STATE_INVALID
        excluded_because:
          difficulty_instance: allocation_cancel_restores_reagent_lot_unit_conservation_with_replay
          rationale: "The §1.8 compensating-invariant instance asserts ERR_ALLOCATION_STATE_INVALID on the repeated cancel and shows the ledger did not drift."
      - name: error_malfunction_report_pending_on_complaint_close
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_MALFUNCTION_REPORT_PENDING
        excluded_because:
          difficulty_instance: complaint_fork_join_requires_both_branches_in_either_order
          rationale: "The §1.8 fork-join instance asserts ERR_MALFUNCTION_REPORT_PENDING for a close attempted before the reporting branch completes."

  # ===========================================================================
  - section: rbac
    instances:

      - name: platform_admin_holds_reference_data_only_and_every_decision_endpoint_returns_forbidden_role
        claim_type: Exclusive Operation Denial
        grounds:
          - roles.PlatformAdmin
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "PlatformAdmin is the trap role: it is the only role with an EMPTY exclusive_operations list, yet it is the most privileged-sounding name in the matrix, so an implementation that treats it as a superuser passes every other RBAC test. Every quality, regulatory and distribution decision endpoint must reject it, while the four reference-data and clock operations it shares must succeed for it."
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z. The positive half of the matrix is booked first — PlatformAdmin registers one MaterialSpecification, one ProductSpecification and one MaterialLot — so the denials that follow can quote a real observed specification version."
            - "The denials themselves need no fixtures: the role check at priority 20 runs ahead of path existence at priority 40, so unknown path ids are sufficient."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-RB-ADMIN", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
