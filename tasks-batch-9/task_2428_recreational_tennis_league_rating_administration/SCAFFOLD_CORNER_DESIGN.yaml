# SCAFFOLD_CORNER_DESIGN.yaml — task_2428 Recreational Tennis League & Rating Administration
# §1.9 breadth probe: one instance per applicable claim-extraction-guide row against §1.1-§1.7.
# Every setup chain composes only endpoints declared in SCAFFOLD.yaml §1.5.
# Logical clock starts at 2026-08-01T00:00:00Z; every chain re-pins it explicitly first.
# YAML anchors define each setup call once; later instances reuse them by alias.
scaffold_corner_design:
  - section: entities
    instances:
      - name: section_create_with_every_input_field_returns_full_config_and_zero_counters
        claim_type: Creation
        grounds:
          - entities.Section
          - endpoints.POST_/tennis/sections
        distinguishing_aspect: "Section is the rating and discipline authority: it carries both strike thresholds and all three temporal windows that later rules read. This pins that every supplied knob round-trips unmodified on the 201 body (no clamping of strike_limit against disqualification_strike_limit) and that all four system/computed fields are present at their declared baseline rather than absent."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned so created_at is deterministic."
          setup_api_calls:
            - &c_t0
              call: "POST /tennis/_clock/set_current_utc"
              payload: {current_utc: "2026-08-01T00:00:00Z"}
              as: SectionAdmin
          trigger:
            - call: "POST /tennis/sections"
              payload:
                code: "SOCAL-2026"
                name: "Southern California Section"
                season_year: 2026
                min_matches_for_playoff_eligibility: 1
                strike_limit: 3
                disqualification_strike_limit: 6
                scorecard_submission_window_hours: 48
                scorecard_dispute_window_hours: 24
                grievance_window_hours: 72
              as: SectionAdmin
          assert:
            - "HTTP 201"
            - "$.data.code == 'SOCAL-2026'"
            - "$.data.name == 'Southern California Section'"
            - "$.data.season_year == 2026"
            - "$.data.min_matches_for_playoff_eligibility == 1"
            - "$.data.strike_limit == 3"
            - "$.data.disqualification_strike_limit == 6"
            - "$.data.scorecard_submission_window_hours == 48"
            - "$.data.scorecard_dispute_window_hours == 24"
            - "$.data.grievance_window_hours == 72"
            - "$.data.rating_period_status == 'OPEN_SEASON'"
            - "$.data.recalc_run_index == 0"
            - "$.data.recalculated_player_count == 0"
            - "$.data.published_level_change_count == 0"
            - "$.data.version == 1"
            - "$.data.created_at == '2026-08-01T00:00:00Z'"
            - "$.data.updated_at == '2026-08-01T00:00:00Z'"
            - "$.response_type == 'object'"

      - name: section_create_omitting_all_six_optional_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Section
          - endpoints.POST_/tennis/sections
        distinguishing_aspect: "Six of Section's nine input fields carry defaults. Omitting all six at once — rather than one at a time — proves they are independent field-level defaults and not a single template, and pins the exact numbers (3 / 3 / 6 / 48 / 24 / 72) that the strike-ledger, scorecard-window and grievance-window rules later measure against."
        test_recipe:
          setup:
            - "Empty database; clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_t0
          trigger:
            - call: "POST /tennis/sections"
              payload:
                code: "NORCAL-2026"
                name: "Northern California Section"
                season_year: 2026
              as: SectionAdmin
          assert:
            - "HTTP 201"
            - "$.data.min_matches_for_playoff_eligibility == 3"
            - "$.data.strike_limit == 3"
            - "$.data.disqualification_strike_limit == 6"
            - "$.data.scorecard_submission_window_hours == 48"
            - "$.data.scorecard_dispute_window_hours == 24"
            - "$.data.grievance_window_hours == 72"
            - "$.data.rating_period_status == 'OPEN_SEASON'"
            - "$.data.recalc_run_index == 0"

      - name: league_get_returns_stored_ladder_config_and_four_zeroed_counters
        claim_type: Retrieval
        grounds:
          - entities.League
          - endpoints.GET_/tennis/leagues/{id}
        distinguishing_aspect: "League is the widest configuration entity (18 input fields plus four computed counters). A GET straight after creation must echo every stored knob AND expose all four counters at zero — registered_team_count, noncompliant_team_count, finalized_match_count, seeded_team_count — which is the reconciliation baseline every later ledger and cascade instance measures drift against."
        test_recipe:
          setup:
            - "A Section exists. A SECTION-tier parent league is created (parent_league_id is null iff tier == SECTION) and opened, so a DISTRICT child can hang under it."
          setup_api_calls:
            - *c_t0
            - &a_sec
              call: "POST /tennis/sections"
              payload:
                code: "SOCAL-2026"
                name: "Southern California Section"
                season_year: 2026
                min_matches_for_playoff_eligibility: 1
                strike_limit: 3
                disqualification_strike_limit: 6
                scorecard_submission_window_hours: 48
                scorecard_dispute_window_hours: 24
                grievance_window_hours: 72
              as: SectionAdmin
              captures: {sec_id: "$.data.id"}
            - &a_lgp
              call: "POST /tennis/leagues"
              payload:
                section_id: "${sec_id}"
                parent_league_id: null
                tier: "SECTION"
                ntrp_level: 3.5
                age_group: "AGE_18_OVER"
                format: "MENS_DOUBLES"
                lines_per_match: 3
                min_active_roster_size: 2
                max_roster_size: 14
                min_playoff_eligible_players: 1
                max_teams: 8
                advancement_slots: 1
                match_duration_minutes: 180
                allow_same_day_doubleheader: false
                registration_opens_at: "2026-08-01T00:00:00Z"
                registration_closes_at: "2026-12-01T00:00:00Z"
                roster_lock_at: "2026-12-01T00:00:00Z"
                season_end_at: "2026-12-31T00:00:00Z"
              as: SectionAdmin
              captures: {lgp_id: "$.data.id"}
            - &a_lgp_open
              call: "POST /tennis/leagues/${lgp_id}/open-registration"
              as: SectionAdmin
            - &a_lg
              call: "POST /tennis/leagues"
              payload:
                section_id: "${sec_id}"
                parent_league_id: "${lgp_id}"
                tier: "DISTRICT"
                ntrp_level: 3.5
                age_group: "AGE_18_OVER"
                format: "MENS_DOUBLES"
                lines_per_match: 3
                min_active_roster_size: 2
                max_roster_size: 14
                min_playoff_eligible_players: 1
                max_teams: 4
                advancement_slots: 1
                match_duration_minutes: 180
                allow_same_day_doubleheader: false
                registration_opens_at: "2026-08-01T00:00:00Z"
                registration_closes_at: "2026-08-10T00:00:00Z"
                roster_lock_at: "2026-08-10T00:00:00Z"
                season_end_at: "2026-09-30T00:00:00Z"
              as: SectionAdmin
              captures: {lg_id: "$.data.id"}
          trigger:
            - call: "GET /tennis/leagues/${lg_id}"
              as: LeagueCoordinator
          assert:
            - "HTTP 200"
            - "$.data.id == ${lg_id}"
            - "$.data.section_id == ${sec_id}"
            - "$.data.parent_league_id == ${lgp_id}"
            - "$.data.tier == 'DISTRICT'"
            - "$.data.ntrp_level == 3.5"
            - "$.data.age_group == 'AGE_18_OVER'"
            - "$.data.format == 'MENS_DOUBLES'"
            - "$.data.lines_per_match == 3"
            - "$.data.min_active_roster_size == 2"
            - "$.data.max_roster_size == 14"
            - "$.data.min_playoff_eligible_players == 1"
            - "$.data.max_teams == 4"
            - "$.data.advancement_slots == 1"
            - "$.data.match_duration_minutes == 180"
            - "$.data.allow_same_day_doubleheader == false"
            - "$.data.roster_lock_at == '2026-08-10T00:00:00Z'"
            - "$.data.season_end_at == '2026-09-30T00:00:00Z'"
            - "$.data.status == 'DRAFT'"
            - "$.data.registered_team_count == 0"
            - "$.data.noncompliant_team_count == 0"
            - "$.data.finalized_match_count == 0"
            - "$.data.seeded_team_count == 0"
            - "$.data.version == 1"

      - name: match_get_with_unresolvable_path_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Match
          - errors.ERR_NOT_FOUND
          - validations.priority_10
        distinguishing_aspect: "Match is the only entity with two parallel state dimensions, so a miss must be resolved by the path-id existence check at priority 10 BEFORE any state gate is consulted: a syntactically valid but unknown UUID yields 404 ERR_NOT_FOUND, never a 409 about schedule_status or result_status."
        test_recipe:
          setup:
            - "A league exists but no Match row has ever been created."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_lgp
            - *a_lgp_open
            - *a_lg
          trigger:
            - call: "GET /tennis/matches/11111111-2222-4333-8444-555555555555"
              as: LeagueCoordinator
          assert:
            - "HTTP 404"
            - "$.data == null"
            - "$.data.error_id == 'ERR_NOT_FOUND'"
            - "$.data.error_id != 'ERR_MATCH_SCHEDULE_STATE_INVALID'"
            - "$.data.message is a non-empty string"

      - name: league_create_missing_roster_lock_at_returns_422_validation
        claim_type: Required Fields
        grounds:
          - entities.League
          - errors.ERR_VALIDATION
          - validations.priority_13
        distinguishing_aspect: "roster_lock_at is one of League's nine no-default input fields and the only one the lock-rosters temporal precondition reads; omitting it must fail the schema gate at priority 13 rather than defaulting to registration_closes_at, and must fail before the priority-43 ladder check on parent_league_id can even be attempted."
        test_recipe:
          setup:
            - "A Section and an opened SECTION-tier parent league exist, so the referential and ladder checks would otherwise pass."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_lgp
            - *a_lgp_open
          trigger:
            - call: "POST /tennis/leagues"
              payload:
                section_id: "${sec_id}"
                parent_league_id: "${lgp_id}"
                tier: "DISTRICT"
                ntrp_level: 3.5
                age_group: "AGE_18_OVER"
                format: "MENS_DOUBLES"
                lines_per_match: 3
                registration_opens_at: "2026-08-01T00:00:00Z"
                registration_closes_at: "2026-08-10T00:00:00Z"
                season_end_at: "2026-09-30T00:00:00Z"
              as: SectionAdmin
          assert:
            - "HTTP 422"
            - "$.data == null"
            - "$.data.error_id == 'ERR_VALIDATION'"
            - "$.data.error_id != 'ERR_LEAGUE_LADDER_INVALID'"
            - "a follow-up GET /tennis/leagues with parent_league_id=${lgp_id} returns $.data.total_count == 0"

      - name: rating_assign_with_level_off_the_half_step_returns_invalid_rating_level
        claim_type: Type Constraints
        grounds:
          - entities.Player
          - errors.ERR_INVALID_RATING_LEVEL
          - validations.priority_15
        distinguishing_aspect: "The NTRP lattice is a numeric-range-plus-step constraint, not an enum, so it is enforced by the dedicated priority-15 rule and not by the priority-13 schema gate: level 3.7 is a well-typed number with a declared field name, and must still be refused with ERR_INVALID_RATING_LEVEL rather than ERR_VALIDATION."
        test_recipe:
          setup:
            - "A Section and one UNRATED player exist."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - &a_pa1
              call: "POST /tennis/players"
              payload: {section_id: "${sec_id}", full_name: "Adam Ace", birth_year: 1990, gender: "M"}
              as: SectionAdmin
              captures: {pa1_id: "$.data.id"}
          trigger:
            - call: "POST /tennis/players/${pa1_id}/ratings"
              payload: {source: "COMPUTER", level: 3.7}
              as: LeagueCoordinator
          assert:
            - "HTTP 422"
            - "$.data == null"
            - "$.data.error_id == 'ERR_INVALID_RATING_LEVEL'"
            - "$.data.error_id != 'ERR_VALIDATION'"
            - "a follow-up GET /tennis/players/${pa1_id} returns $.data.rating_type == 'UNRATED' and $.data.rating_level == null"

      - name: player_create_with_unknown_payload_field_returns_422_validation_and_stores_nothing
        claim_type: System Fields
        grounds:
          - entities.Player
          - errors.ERR_VALIDATION
          - validations.priority_13
        distinguishing_aspect: "Player's system fields are not merely ignored on input: priority 13 rejects ANY payload key outside the endpoint's declared input set, so seeding `rating_level` is a hard 422 rather than a silently-dropped field. This falsifies the permissive 'input ignored' reading and proves no partial row is written."
        test_recipe:
          setup:
            - "A Section exists."
          setup_api_calls:
            - *c_t0
            - *a_sec
          trigger:
            - call: "POST /tennis/players"
              payload:
                section_id: "${sec_id}"
                full_name: "Ghost Player"
                birth_year: 1990
                gender: "M"
                rating_level: 5.0
              as: SectionAdmin
          assert:
            - "HTTP 422"
            - "$.data == null"
            - "$.data.error_id == 'ERR_VALIDATION'"
            - "a follow-up GET /tennis/players with section_id=${sec_id} returns $.data.total_count == 0"

      - name: player_list_paginated_reports_full_total_count_on_every_page
        claim_type: Listing
        grounds:
          - entities.Player
          - endpoints.GET_/tennis/players
          - response_envelope.pagination_fields
        distinguishing_aspect: "Pagination metadata must describe the whole filtered result set, not the page returned. With exactly three players and limit=2, page one must report total_count 3 with has_more true and page two must return the single remainder with the SAME total_count 3 and has_more false — falsifying an implementation that recomputes total_count per page or derives has_more from items length alone."
        test_recipe:
          setup:
            - "Exactly three players are registered in one section."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - &a_pa2
              call: "POST /tennis/players"
              payload: {section_id: "${sec_id}", full_name: "Ben Baseline", birth_year: 1990, gender: "M"}
              as: SectionAdmin
              captures: {pa2_id: "$.data.id"}
            - &a_pf1
              call: "POST /tennis/players"
              payload: {section_id: "${sec_id}", full_name: "Fay Volley", birth_year: 1975, gender: "F"}
              as: SectionAdmin
              captures: {pf1_id: "$.data.id"}
          trigger:
            - call: "GET /tennis/players"
              payload: {section_id: "${sec_id}", limit: 2, offset: 0}
              as: SectionAdmin
          assert:
            - "HTTP 200"
            - "$.data.items has length 2"
            - "$.data.limit == 2"
            - "$.data.offset == 0"
            - "$.data.total_count == 3"
            - "$.data.has_more == true"
            - "a follow-up GET /tennis/players with section_id=${sec_id}, limit=2, offset=2 returns HTTP 200 with $.data.items length 1, $.data.total_count == 3, $.data.has_more == false"
            - "a follow-up GET /tennis/players with section_id=${sec_id}, gender=F returns $.data.total_count == 1 and the single item id == ${pf1_id}"

      - name: team_roster_counters_count_active_only_while_cap_counts_pending_too
        claim_type: Computed Fields
        grounds:
          - entities.Team
          - entities.RosterSpot
          - endpoints.GET_/tennis/teams/{id}
        distinguishing_aspect: "Team carries two roster measures over DIFFERENT state filters: active_roster_size counts only ACTIVE spots, while the League.max_roster_size cap counts PENDING plus ACTIVE. Adding two spots and activating only one must report active_roster_size 1 (not 2) and roster_compliant false against min_active_roster_size 2, proving the two filters are not the same aggregate."
        test_recipe:
          setup:
            - "A DISTRICT league in REGISTRATION_OPEN, a DRAFT team captained by Adam Ace, two COMPUTER_RATED 3.5 players. Both are added; only the first is activated. Every roster-spot add carries a freshly-read Team.version because both the add and the activation bump it."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - &a_fac
              call: "POST /tennis/facilities"
              payload: {section_id: "${sec_id}", name: "Balboa Tennis Center", court_count: 6, turnaround_buffer_minutes: 30, surface: "HARD"}
              as: SectionAdmin
              captures: {fac_id: "$.data.id"}
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - &a_lg_open
              call: "POST /tennis/leagues/${lg_id}/open-registration"
              as: SectionAdmin
            - *a_pa1
            - *a_pa2
            - &a_ra1
              call: "POST /tennis/players/${pa1_id}/ratings"
              payload: {source: "COMPUTER", level: 3.5}
              as: LeagueCoordinator
            - &a_ra2
              call: "POST /tennis/players/${pa2_id}/ratings"
              payload: {source: "COMPUTER", level: 3.5}
              as: LeagueCoordinator
            - &a_tma
              call: "POST /tennis/teams"
              payload: {league_id: "${lg_id}", name: "Baseline Bandits", home_facility_id: "${fac_id}"}
              as: Captain
              as_user_id: "${pa1_id}"
              captures: {tma_id: "$.data.id", tma_v0: "$.data.version"}
            - &a_xa1
              call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pa1_id}", expected_team_version: "${tma_v0}"}
              as: Captain
              as_user_id: "${pa1_id}"
              captures: {rsa1_id: "$.data.id"}
            - &a_ya1
              call: "POST /tennis/roster-spots/${rsa1_id}/activate"
              as: Captain
              as_user_id: "${pa1_id}"
            - &a_gta2
              call: "GET /tennis/teams/${tma_id}"
              as: Captain
              as_user_id: "${pa1_id}"
              captures: {tma_v2: "$.data.version"}
            - &a_xa2
              call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pa2_id}", expected_team_version: "${tma_v2}"}
              as: Captain
              as_user_id: "${pa1_id}"
              captures: {rsa2_id: "$.data.id"}
          trigger:
            - call: "GET /tennis/teams/${tma_id}"
              as: LeagueCoordinator
          assert:
            - "HTTP 200"
            - "$.data.active_roster_size == 1"
            - "$.data.playoff_eligible_roster_size == 0"
            - "$.data.roster_compliant == false"
            - "$.data.status == 'DRAFT'"
            - "$.data.captain_player_id == ${pa1_id}"
            - "$.data.advanced_from_team_id == null"
            - "$.data.playoff_seed == null"
            - "a follow-up GET /tennis/roster-spots/${rsa1_id} returns $.data.status == 'ACTIVE' and $.data.level_at_add == 3.5"
            - "a follow-up GET /tennis/roster-spots/${rsa2_id} returns $.data.status == 'PENDING' and $.data.level_at_add == null"
            - "a follow-up GET /tennis/roster-spots with team_id=${tma_id} returns $.data.total_count == 2"

      - name: committee_vote_exposes_no_version_and_second_ballot_is_rejected
        claim_type: Immutability
        grounds:
          - entities.CommitteeVote
          - errors.ERR_DUPLICATE_VOTE
          - validations.priority_49
        distinguishing_aspect: "CommitteeVote is the scaffold's only common_fields:false entity — an append-only audit record. It must expose no version field (so it can never join optimistic concurrency) and a second ballot from the same member must be refused with ERR_DUPLICATE_VOTE rather than overwriting the first, which is exactly what makes support_vote_count monotone and the quorum gate meaningful."
        test_recipe:
          setup:
            - "A rating appeal by Adam Ace is UNDER_REVIEW and committee member Mel Member has already cast a SUPPORT ballot."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_ra1
            - &a_chair
              call: "POST /tennis/players"
              payload: {section_id: "${sec_id}", full_name: "Cora Chair", birth_year: 1970, gender: "F"}
              as: SectionAdmin
              captures: {chair_id: "$.data.id"}
            - &a_cm1
              call: "POST /tennis/players"
              payload: {section_id: "${sec_id}", full_name: "Mel Member", birth_year: 1972, gender: "F"}
              as: SectionAdmin
              captures: {cm1_id: "$.data.id"}
            - &a_ap1
              call: "POST /tennis/rating-appeals"
              payload: {player_id: "${pa1_id}", direction: "UP", requested_level: 4.0, reason: "My computer rating understates my level."}
              as: Player
              as_user_id: "${pa1_id}"
              captures: {ap1_id: "$.data.id"}
            - &a_ap1_review
              call: "POST /tennis/rating-appeals/${ap1_id}/start-review"
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - &a_vote1
              call: "POST /tennis/committee-votes"
              payload: {subject_type: "RATING_APPEAL", subject_id: "${ap1_id}", vote: "SUPPORT", note: "Dynamic rating supports the move."}
              as: CommitteeMember
              as_user_id: "${cm1_id}"
              captures: {vote1_id: "$.data.id"}
          trigger:
            - call: "POST /tennis/committee-votes"
              payload: {subject_type: "RATING_APPEAL", subject_id: "${ap1_id}", vote: "OPPOSE", note: "Changed my mind."}
              as: CommitteeMember
              as_user_id: "${cm1_id}"
          assert:
            - "HTTP 409"
            - "$.data.error_id == 'ERR_DUPLICATE_VOTE'"
            - "a follow-up GET /tennis/committee-votes/${vote1_id} returns HTTP 200 with $.data.vote == 'SUPPORT' and $.data.note == 'Dynamic rating supports the move.'"
            - "that same GET response body has no key 'version'"
            - "that same GET response body has no key 'updated_at'"
            - "a follow-up GET /tennis/rating-appeals/${ap1_id} returns $.data.support_vote_count == 1 and $.data.oppose_vote_count == 0"
            - "a follow-up GET /tennis/players/${cm1_id}/committee-votes returns $.data.total_count == 1"

      - name: league_create_district_tier_with_null_parent_returns_league_ladder_invalid
        claim_type: Parent Relationships
        grounds:
          - entities.League.parent_league_id
          - errors.ERR_LEAGUE_LADDER_INVALID
          - validations.priority_43
        distinguishing_aspect: "The parent_league_id rule is biconditional — null iff tier == SECTION — so a DISTRICT league with a null parent silently severs the local/district/section advancement ladder at its root. Because parent_league_id is an OPTIONAL input with default null, the omission is schema-legal and must be caught by the priority-43 ladder rule, not by the priority-13 schema gate."
        test_recipe:
          setup:
            - "A Section exists; no parent league is created."
          setup_api_calls:
            - *c_t0
            - *a_sec
          trigger:
            - call: "POST /tennis/leagues"
              payload:
                section_id: "${sec_id}"
                tier: "DISTRICT"
                ntrp_level: 3.5
                age_group: "AGE_18_OVER"
                format: "MENS_DOUBLES"
                lines_per_match: 3
                registration_opens_at: "2026-08-01T00:00:00Z"
                registration_closes_at: "2026-08-10T00:00:00Z"
                roster_lock_at: "2026-08-10T00:00:00Z"
                season_end_at: "2026-09-30T00:00:00Z"
              as: SectionAdmin
          assert:
            - "HTTP 422"
            - "$.data.error_id == 'ERR_LEAGUE_LADDER_INVALID'"
            - "$.data.error_id != 'ERR_VALIDATION'"
            - "a follow-up GET /tennis/leagues with section_id=${sec_id} returns $.data.total_count == 0"

      - name: team_create_naming_a_facility_of_another_section_returns_section_scope_mismatch
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology.graph
          - errors.ERR_SECTION_SCOPE_MISMATCH
          - errors.ERR_FACILITY_SECTION_MISMATCH
          - validations.priority_12
          - validations.priority_42
        distinguishing_aspect: "A Team joins a League and a Facility that each hang off a Section, so cross-reference integrity must be checked along both edges — and the scaffold declares TWO rules for exactly this violation on POST /tennis/teams: priority 12 (ERR_SECTION_SCOPE_MISMATCH, 404) and priority 42 (ERR_FACILITY_SECTION_MISMATCH, 422). The ordered list makes 12 the winner, so the observable must be the 404, not the 422."
        test_recipe:
          setup:
            - "Two sections exist. The DISTRICT league lives in SOCAL-2026; the requested home facility lives in NORCAL-2026. The acting captain is a SOCAL player so no other check can fire first."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_ra1
            - &a_sec2
              call: "POST /tennis/sections"
              payload: {code: "NORCAL-2026", name: "Northern California Section", season_year: 2026}
              as: SectionAdmin
              captures: {sec2_id: "$.data.id"}
            - &a_fac2
              call: "POST /tennis/facilities"
              payload: {section_id: "${sec2_id}", name: "Golden Gate Courts", court_count: 4, turnaround_buffer_minutes: 30, surface: "CLAY"}
              as: SectionAdmin
              captures: {fac2_id: "$.data.id"}
          trigger:
