      - name: corner_rejected_adjudication_forks_the_inspection_and_escalates_findings
        claim_type: branching
        grounds:
          - state_machines.RegulatoryInspection.RESPONSE_SUBMITTED_to_RESPONSE_REJECTED
          - state_machines.InspectionFinding.OPEN_to_ESCALATED
          - state_machines.InspectionFinding.REMEDIATION_PLANNED_to_ESCALATED
          - calculations.store_compliance_posture
        distinguishing_aspect: "The adjudicate fork is decided by `decision` alone: REJECT sends the inspection to RESPONSE_REJECTED and escalates every non-terminal finding regardless of whether it was OPEN or REMEDIATION_PLANNED, which flips the store to FROZEN; the RESPONSE_REJECTED state then re-accepts a response, so the fork is re-enterable while CLOSED is not."
        test_recipe:
          setup:
            - "A CLOSED FAIL audit; an inspection with two findings (MAJOR/4 items and MINOR/1 item); finding_2 moved to REMEDIATION_PLANNED; a response submitted with the correct OCC version."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 2.0, penalty_per_violation_cents: 5000, penalty_max_cents: 2000000 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T09:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_1: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_1}/scan-lines"
              payload: { item_upc: "00000000002001", shelf_price_cents: 1000, register_price_cents: 1199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_1}/close"
              payload: { rate_variant: "GROSS_MISMATCH" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_outcome: $.data.outcome }
            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${audit_1}", inspector_ref: "INS-77", inspection_date: "2026-08-01T16:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_1: $.data.id }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [{ finding_code: "SHELF_TAG_MISMATCH", severity: "MAJOR", affected_item_count: 4 }, { finding_code: "UNIT_PRICE_FORMAT", severity: "MINOR", affected_item_count: 1 }] }
              as: ComplianceOfficer
              captures: { penalty_at_issue: $.data.penalty_exposure_cents }
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}/findings"
              as: ComplianceOfficer
              captures: { find_1: "$.data[0].id", find_2: "$.data[1].id" }
            - call: "POST /price-integrity/inspection-findings/${find_2}/transition"
              payload: { target_status: "REMEDIATION_PLANNED", remediation_action_code: "REPRINT_UNIT_PRICE" }
              as: ComplianceOfficer
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}"
              as: ComplianceOfficer
              captures: { insp_v: $.data.version }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/response"
              payload: { remediation_summary: "All tags reprinted overnight", expected_regulatory_inspection_version: "${insp_v}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_submitted: $.data.status }
          trigger:
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/adjudicate"
              payload: { decision: "REJECT", rejection_note: "Evidence photos undated" }
              as: ComplianceOfficer
              captures: { st_rejected: $.data.status, penalty_after: $.data.penalty_exposure_cents }
            - call: "GET /price-integrity/inspection-findings/${find_1}"
              as: ComplianceOfficer
              captures: { f1_status: $.data.status }
            - call: "GET /price-integrity/inspection-findings/${find_2}"
              as: ComplianceOfficer
              captures: { f2_status: $.data.status }
            - call: "GET /price-integrity/stores/${store_a}/compliance-summary"
              as: ComplianceOfficer
              captures: { posture: $.data.compliance_posture }
          assert:
            - "${audit_outcome} == FAIL (1 of 1 lines mismatched, 100.00 >= 2.0) and ${penalty_at_issue} == 81250 == FLOOR((3*5000*4 + 1*5000*1) * (100 + 25) / 100)"
            - "${st_submitted} == RESPONSE_SUBMITTED and ${st_rejected} == RESPONSE_REJECTED"
            - "${f1_status} == ESCALATED (from OPEN) and ${f2_status} == ESCALATED (from REMEDIATION_PLANNED) — both non-terminal branches escalate"
            - "InspectionFinding.${find_2}.remediation_action_code is still REPRINT_UNIT_PRICE — escalation does not erase the recorded plan"
            - "${penalty_after} == 81250: escalation changes no finding's status out of `considered`, so n stays 2 and the tier stays 100"
            - "${posture} == FROZEN because escalated_finding_count == 2 >= 1, even though open_finding_count == 0 and failed_audit_count_30d == 1"
            - "A second response with the refreshed version succeeds and returns status RESPONSE_SUBMITTED, proving RESPONSE_REJECTED is not terminal"

      - name: corner_parallel_axes_independence_excluded
        claim_type: parallel
        excluded_because:
          difficulty_instance: label_task_parallel_print_and_placement_axes_advance_independently
          rationale: "§1.8 already drives both LabelTask axes through every ordering and asserts the combined product state after each hop, which is exactly the `parallel` shape claim."

      - name: corner_cyclic_audit_reopen_loop_excluded
        claim_type: cyclic
        excluded_because:
          difficulty_instance: scanner_audit_close_reopen_close_cycle_recomputes_outcome
          rationale: "The close -> reopen -> close loop, its per-lap recomputation of error_rate_pct/outcome and the termination condition are fully asserted by that §1.8 instance."

      - name: corner_cascade_down_and_bubble_up_excluded
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: verify_placement_cascades_task_to_line_to_file_to_store_posture
          rationale: "The four-hop LabelTask -> PriceChangeLine -> PriceChangeFile -> Store chain covers both the downward cascade and the bubble-up to EXECUTED when verified_line_count reaches line_count."

      - name: corner_ledger_sync_backlog_counter_excluded
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: label_backlog_counter_survives_reject_replace_and_withdrawal
          rationale: "Store.label_backlog_count is the ledger-sync field, and that §1.8 instance reconciles it across reject, replace and supersede-withdrawal, including the pre/post equality check."

      - name: corner_cross_entity_suspension_cascade_excluded
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: audit_fail_cascades_action_to_associate_suspension_to_task_revert_to_store
          rationale: "The ScannerAudit FAIL -> AccountabilityAction -> Associate SUSPENDED -> LabelTask axis revert -> Store posture chain is the cross-entity side-effect claim, already asserted hop by hop with field values."

  # ===========================================================================
  - section: Calculations
    instances:
      - name: corner_unit_price_basis_rule_selects_the_divisor_and_the_fallback
        claim_type: constants_applied
        grounds:
          - calculations.unit_price_display
          - entities.Jurisdiction.fields.unit_price_uom_rule
          - entities.PriceChangeLine.fields.unit_price_basis_uom
        distinguishing_aspect: "Step 1 of unit_price_display picks the divisor from the jurisdiction rule and the uom family, never from the item: PER_SINGLE_ITEM divides by 1 (basis EACH), PER_100_COUNT divides a CT item by 100 (basis 100CT), and PER_100_COUNT applied to a WEIGHT item silently falls back to the canonical LB conversion using OZ_PER_LB."
        test_recipe:
          setup:
            - "Three jurisdictions with unit_price_decimal_places 2 and ROUND_HALF_UP, one store and one DRAFT file each."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
