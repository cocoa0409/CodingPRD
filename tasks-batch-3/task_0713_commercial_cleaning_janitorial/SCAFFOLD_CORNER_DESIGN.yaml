# =============================================================================
# task_0713 — §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable claims of §1.1–§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with legal_name+industry returns 201; lifecycle_stage=PROSPECT, health_score=100, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { legal_name: "Init Co", industry: "RETAIL" }
              as: SalesRep
              captures: { acct: "$.data.id" }
          assert:
            - "Account.${acct}.lifecycle_stage == PROSPECT"
            - "Account.${acct}.health_score == 100"
            - "Account.${acct}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_rfp_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.RfpOpportunity, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts/{id}/rfps without due_at returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Req Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "No due", estimated_total_sqft: 1000 }
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_account_invalid_enum_industry_returns_invalid_enum
        claim_type: Type Constraints
        grounds: [entities.Account, "validations[priority=6]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "industry='SPACEPORT' is outside {OFFICE,MEDICAL,INDUSTRIAL,RETAIL,EDUCATION} -> ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { legal_name: "Bad Enum", industry: "SPACEPORT" }
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_ENUM"

      - name: service_area_sqft_zero_returns_invalid_range
        claim_type: Type Constraints
        grounds: [entities.ServiceArea, "validations[priority=7]", "errors[ERR_INVALID_RANGE]"]
        distinguishing_aspect: "ServiceArea sqft=0 violates sqft>0 -> ERR_INVALID_RANGE (422)."
        test_recipe:
          setup: ["An OPEN RFP exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "SA Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "SA RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 1000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "Empty", sqft: 0, soil_level: "LIGHT", frequency_per_week: 1 }
              as: BidEstimator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_RANGE"

      - name: service_area_frequency_out_of_range_returns_invalid_range
        claim_type: Type Constraints
        grounds: [entities.ServiceArea, "validations[priority=7]", "errors[ERR_INVALID_RANGE]"]
        distinguishing_aspect: "frequency_per_week=8 violates 1..7 -> ERR_INVALID_RANGE (422)."
        test_recipe:
          setup: ["An OPEN RFP exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Freq Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Fq RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 1000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "TooOften", sqft: 5000, soil_level: "LIGHT", frequency_per_week: 8 }
              as: BidEstimator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_RANGE"

      - name: bid_estimate_id_system_minted_ignores_input_id
        claim_type: System Fields
        grounds: [entities.BidEstimate]
        distinguishing_aspect: "Server mints BidEstimate.id and version; client cannot set them. status defaults to DRAFT."
        test_recipe:
          setup: ["An OPEN RFP exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Sys Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Sy RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 5000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20 }
              as: BidEstimator
              captures: { bid: "$.data.id" }
          assert:
            - "BidEstimate.${bid}.status == DRAFT"
            - "BidEstimate.${bid}.version == 1"

      - name: loading_method_default_estimate_applied
        claim_type: Defaults
        grounds: [entities.BidEstimate.fields.loading_method]
        distinguishing_aspect: "Omitting loading_method defaults to ESTIMATE (round-then-sum), confirmed by 187.66 monthly hours on the standard area set."
        test_recipe:
          setup: ["RFP with two MEDIUM 10000@5 + HEAVY 4000@5; bid omits loading_method."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Def Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Df RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 24000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F1", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F2", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "RR", sqft: 4000, soil_level: "HEAVY", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20 }
              as: BidEstimator
              captures: { bid: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
          assert:
            - "BidEstimate.${bid}.loading_method == ESTIMATE"
            - "BidEstimate.${bid}.monthly_labor_hours == 187.66"

      - name: list_accounts_pagination_envelope
        claim_type: Listing
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two accounts exist."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "L1", industry: "OFFICE" }
              as: SalesRep
            - call: "POST /accounts"
              payload: { legal_name: "L2", industry: "RETAIL" }
              as: SalesRep
          trigger:
            - call: "GET /accounts"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == array"
            - "meta.total_count >= 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_walkthrough_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Walkthrough, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already-COMPLETED walkthrough returns ERR_INVALID_STATE (409); no second RFP transition."
        test_recipe:
          setup: ["A COMPLETED walkthrough on a BIDDING RFP."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "WtState Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Wt RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 1000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/site-contacts"
              payload: { full_name: "Kim", avail_start_at: "2026-03-02T08:00:00Z", avail_end_at: "2026-03-02T18:00:00Z" }
              as: SalesRep
              captures: { sc: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/walkthroughs"
              payload: { site_contact_id: "${sc}", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T10:00:00Z" }
              as: SalesRep
              captures: { wt: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/walkthroughs/${wt}/complete"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/walkthroughs/${wt}/complete"
              payload: {}
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: accept_proposal_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Proposal, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DRAFT (never SENT) proposal returns ERR_INVALID_STATE; only SENT->ACCEPTED is legal."
        test_recipe:
          setup: ["A DRAFT proposal that has not been sent."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "PState Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Ps RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 8000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F1", sqft: 8000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals"
              payload: { bid_estimate_id: "${bid}" }
              as: SalesRep
              captures: { prop: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/accept"
              payload: {}
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: terminal_renewed_cycle_cannot_lapse
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RenewalCycle, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RENEWED RenewalCycle is terminal; lapse on it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A RENEWED RenewalCycle on a SERVICING contract."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "RenTerm Co", industry: "OFFICE" }
