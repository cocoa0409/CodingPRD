          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_clock_sep30
            - *k_repB
            - *k_repB_accept
