# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of the claim-extraction-guide against §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ entities
  - section: entities
    instances:
      - name: create_site_returns_all_fields_and_envelope
        claim_type: Creation
        grounds: ["entities.SchoolSite", "endpoints"]
        distinguishing_aspect: "POST /nutrition/sites with required fields returns 201, a server-minted id, version==1, negative_balance_count==0, wrapped in the success envelope (response_type object)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /nutrition/sites", payload: { name: "Envelope School", site_code: "ENV-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id", v: "$.data.version" } }
          assert:
            - "HTTP status == 201"
            - "response_type == object and meta.api_request_id present"
            - "SchoolSite.${site_id}.version == 1"
            - "SchoolSite.${site_id}.negative_balance_count == 0"

      - name: get_student_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Student", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /nutrition/students/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /nutrition/students/00000000-0000-4000-8000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_site_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["entities.SchoolSite", "validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /nutrition/sites missing required site_code returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /nutrition/sites", payload: { name: "No Code" }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: list_students_pagination_shape
        claim_type: Listing
        grounds: ["entities.Student", "endpoints"]
        distinguishing_aspect: "GET /nutrition/students?site_id=&limit=&offset= returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One site with one student."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Pag", site_code: "PAG-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/students", payload: { site_id: "${site_id}", first_name: "P", last_name: "One", grade: "GRADES_K_5" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /nutrition/students", payload: { site_id: "${site_id}", limit: 10, offset: 0 }, as: PlatformAdmin }
          assert:
            - "response_type == array"
            - "meta pagination total_count == 1 and has_more == false"

      - name: forecast_par_computed_field_ignores_client_input
        claim_type: Computed Fields
        grounds: ["entities.ProductionRecord.fields.forecast_par_qty", "calculations.production_forecast_par"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / forecast_par_vs_served_on_production_record"
          rationale: "forecast_par_qty=round(planned_qty*0.9) correctness is asserted by that §1.8 instance."

  # ------------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: approve_menu_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.MenuCycle.UNDER_REVIEW_to_APPROVED", "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a MenuCycle that is still DRAFT (never submitted) returns ERR_INVALID_STATE (409); no APPROVED transition fires."
        test_recipe:
          setup: ["A DRAFT compliant menu (not submitted)."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "IS1", site_code: "IS1-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Ent", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Grn", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Fru", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
          trigger:
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "dir_9", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: void_already_voided_meal_rejected
        claim_type: Idempotency
        grounds: ["state_machines.MealTransaction.RECORDED_to_VOIDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding an already-VOIDED meal a second time returns ERR_INVALID_STATE (409); no second refund is applied."
        test_recipe:
          setup: ["A funded PAID student with one recorded reimbursable lunch that has been voided once."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "IV", site_code: "IV-1", negative_balance_allowed: true }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Ent", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Grn", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Fru", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_ent}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_grn}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_fru}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_milk}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "planner_1" }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "dir_1" }
            - { call: "POST /nutrition/production-records", payload: { site_id: "${site_id}", menu_cycle_id: "${mc_id}", service_date: "2026-04-15", meal_type: "LUNCH", planned_qty: 100 }, as: CafeteriaManager, captures: { pr_id: "$.data.id" } }
            - { call: "POST /nutrition/production-records/${pr_id}/prepare", payload: { prepared_qty: 100 }, as: CafeteriaManager }
            - { call: "POST /nutrition/students", payload: { site_id: "${site_id}", first_name: "V", last_name: "Twice", grade: "GRADES_9_12", eligibility_category: "PAID" }, as: PlatformAdmin, captures: { stu_id: "$.data.id" } }
            - { call: "POST /nutrition/students/${stu_id}/deposit", payload: { amount_cents: 5000 }, as: POSClerk }
            - { call: "POST /nutrition/meal-transactions", payload: { site_id: "${site_id}", student_id: "${stu_id}", production_record_id: "${pr_id}", service_date: "2026-04-15", meal_type: "LUNCH", selected_components: ["MEAT_MEAT_ALT","GRAINS","FRUIT"] }, as: POSClerk, captures: { mt_id: "$.data.id" } }
            - { call: "POST /nutrition/meal-transactions/${mt_id}/void", payload: {}, as: POSClerk }
          trigger:
            - { call: "POST /nutrition/meal-transactions/${mt_id}/void", payload: {}, as: POSClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: menu_reject_revert_cycle
        claim_type: cyclic
        grounds: ["state_machines.MenuCycle.UNDER_REVIEW_to_DRAFT"]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / menu_cycle_reject_revert_cycle"
          rationale: "The DRAFT<->UNDER_REVIEW cycle is exercised by that §1.8 instance."

  # -------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: inventory_depletion_draws_commodity_before_purchased
        claim_type: Correct Result
        grounds: ["calculations.inventory_depletion", "entities.InventoryLot.fields.lot_type", "entities.InventoryLot.fields.quantity_on_hand"]
        distinguishing_aspect: "Waterfall order: with a COMMODITY_USDA_FOODS entree lot (30) and a PURCHASED entree lot (30), preparing 40 entree units empties the commodity lot first (0, DEPLETED) then draws 10 from purchased (20)."
        test_recipe:
          setup: ["Compliant APPROVED lunch menu; entree has a 30-unit commodity lot and a 30-unit purchased lot; other components ample."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "WF", site_code: "WF-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Ent", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Grn", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Fru", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_ent}", lot_type: "COMMODITY_USDA_FOODS", quantity_received: 30, received_date: "2026-03-05" }, as: CafeteriaManager, captures: { lot_comm: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_ent}", lot_type: "PURCHASED", quantity_received: 30, received_date: "2026-03-06" }, as: CafeteriaManager, captures: { lot_purch: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_grn}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_fru}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_milk}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "planner_1" }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "dir_1" }
            - { call: "POST /nutrition/production-records", payload: { site_id: "${site_id}", menu_cycle_id: "${mc_id}", service_date: "2026-04-15", meal_type: "LUNCH", planned_qty: 40 }, as: CafeteriaManager, captures: { pr_id: "$.data.id" } }
          trigger:
            - { call: "POST /nutrition/production-records/${pr_id}/prepare", payload: { prepared_qty: 40 }, as: CafeteriaManager }
          assert:
            - "InventoryLot.${lot_comm}.quantity_on_hand == 0"
            - "InventoryLot.${lot_comm}.status == DEPLETED"
            - "InventoryLot.${lot_purch}.quantity_on_hand == 20"

      - name: menu_compliant_positive_computes_compliant
        claim_type: Correct Result
        grounds: ["calculations.meal_pattern_compliance", "entities.MenuCycle.fields.compliance_status"]
        distinguishing_aspect: "A lunch menu meeting all minimums (meat 2.0>=1, grain 1.0>=1 whole-grain-rich, fruit/veg 0.75>=0.75, milk present) computes compliance_status COMPLIANT at creation."
        test_recipe:
          setup: ["A site and four compliant food items."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Cmp", site_code: "CMP-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Ent", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Grn", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Fru", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
          trigger:
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id", comp: "$.data.compliance_status" } }
          assert:
            - "MenuCycle.${mc_id}.compliance_status == COMPLIANT"

  # ---------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: prepare_insufficient_inventory_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=20]", "errors[ERR_INSUFFICIENT_INVENTORY]"]
        distinguishing_aspect: "Preparing 100 entree units against a 10-unit entree lot returns ERR_INSUFFICIENT_INVENTORY (409); no lot is partially depleted."
        test_recipe:
          setup: ["Compliant APPROVED lunch menu; entree lot only 10 units; others ample."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "II", site_code: "II-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Ent", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Grn", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Fru", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_ent}", lot_type: "PURCHASED", quantity_received: 10, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_grn}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_fru}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_milk}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "planner_1" }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "dir_1" }
            - { call: "POST /nutrition/production-records", payload: { site_id: "${site_id}", menu_cycle_id: "${mc_id}", service_date: "2026-04-15", meal_type: "LUNCH", planned_qty: 100 }, as: CafeteriaManager, captures: { pr_id: "$.data.id" } }
          trigger:
            - { call: "POST /nutrition/production-records/${pr_id}/prepare", payload: { prepared_qty: 100 }, as: CafeteriaManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INSUFFICIENT_INVENTORY"
            - "HTTP status == 409"

      - name: meal_student_site_mismatch_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=12]", "errors[ERR_STUDENT_SITE_MISMATCH]"]
        distinguishing_aspect: "Recording a meal whose site_id differs from the student's own site_id returns ERR_STUDENT_SITE_MISMATCH (409)."
        test_recipe:
          setup: ["Two sites A and B; a PREPARED production at site A; a student belonging to site B."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "SA", site_code: "SA-1", negative_balance_allowed: true }, as: PlatformAdmin, captures: { site_a: "$.data.id" } }
            - { call: "POST /nutrition/sites", payload: { name: "SB", site_code: "SB-1", negative_balance_allowed: true }, as: PlatformAdmin, captures: { site_b: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Ent", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Grn", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Fru", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_a}", food_item_id: "${f_ent}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_a}", food_item_id: "${f_grn}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_a}", food_item_id: "${f_fru}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_a}", food_item_id: "${f_milk}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
