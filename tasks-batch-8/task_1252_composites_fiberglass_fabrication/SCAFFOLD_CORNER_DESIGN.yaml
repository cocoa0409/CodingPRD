            - { call: "POST /work-orders/${wo1}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo2}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo3}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
