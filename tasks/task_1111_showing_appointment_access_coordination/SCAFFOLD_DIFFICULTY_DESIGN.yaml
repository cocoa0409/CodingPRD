            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Eighteen", license_number: "LIC-LA-18", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Eighteen", license_number: "LIC-BA-18", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
