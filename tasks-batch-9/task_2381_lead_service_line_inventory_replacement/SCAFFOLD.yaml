# =============================================================================
# Task 2381 — Lead Service Line Inventory & Replacement (drinking water utility)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  2381. Lead Service Line Inventory & Replacement (drinking water utility): service line material
  inventory across utility-owned and customer-owned portions using records, predictive modeling and
  field verification, verification methods including visual inspection, potholing and water sampling
  with statistical validation, inventory publication and customer notification requirements for lead
  and unknown lines, replacement prioritization by material certainty, disadvantaged community status
  and coordination with street projects, full replacement policy addressing customer-side portions
  with cost, consent and access barriers, funding assembly across state revolving funds, grants and
  rates with equity requirements, sampling protocols, corrosion control treatment optimization and
  post-replacement flushing guidance, compliance deadlines and progress reporting

domain_name: lead-service-line-inventory
api_prefix: /lsl

complexity_profile:
  difficulty_level: expert_plus     # above §0.4 Expert: 12 entities / 63 endpoints / 57 errors / 47 validations / 10 calculations / 9 state machines
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every resource is addressed at its own top-level collection under /lsl (`/lsl/service-lines/{id}`,
  # `/lsl/replacement-orders/{id}`); parentage is expressed exclusively through FK fields in request
  # bodies, never through nested URL paths. `parent: null` on every entity.

  state_machine_shape: parallel
  # ServiceLine carries two independent axes (`inventory_state` × `replacement_state`); ReplacementOrder
  # carries two more (`fulfillment_state` × `consent_state`). Cycles exist inside VerificationAppointment
  # (NO_ACCESS→SCHEDULED), SamplingBatch (REJECTED→OPEN), CustomerNotification (RETURNED→DELIVERED),
  # ServiceLine.inventory_state (CLASSIFIED_VERIFIED→CLASSIFIED_PROVISIONAL) and
  # WaterSystem.inventory_status (PUBLISHED→AMENDMENT_PENDING→PUBLISHED). ReplacementOrder branches
  # fork-style on consent outcome into FULL vs PARTIAL scope with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # WaterSystem → ServiceLine / VerificationCrew / SamplingBatch / FundingSource / StreetProject
    - cross_aggregate      # CustomerNotification spans ServiceLine × InventoryPublication; ReplacementOrder spans ServiceLine × StreetProject × FundingSource

  role_model: segregation_of_duties
  # The InventoryAnalyst that drafted an InventoryPublication may not certify it; the ComplianceOfficer
  # that certifies may not have drafted. FieldTechnician identity is bound to a VerificationCrew row.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: WaterSystem
    parent: null
    common_fields: true
    fields:
      - { name: pwsid, type: string, source: input, description: "Public water system identifier; globally unique", constraints: "unique across WaterSystem" }
      - { name: system_name, type: string, source: input, description: "Utility display name" }
      - { name: compliance_deadline_date, type: string, source: input, description: "Regulatory date (YYYY-MM-DD) by which unknown_count must reach 0", constraints: "ISO date" }
      - { name: baseline_lead_and_grr_count, type: integer, source: input, default: 0, description: "Regulatory baseline count of LEAD+GRR lines used as the denominator of the mandated annual replacement rate", constraints: ">= 0" }
      - { name: disadvantaged_tract_codes, type: array, source: input, default: [], description: "Census tract codes designated disadvantaged; a ServiceLine whose census_tract_code is in this list gets disadvantaged_status true" }
      - { name: funding_mode, type: enum, source: input, default: WATERFALL, description: "Selects which funding_apportionment variant applies to every ReplacementOrder of this system", constraints: "WATERFALL | PRO_RATA" }
      - { name: cct_optimization_status, type: enum, source: input, default: NOT_REQUIRED, description: "Corrosion control treatment optimization posture", constraints: "NOT_REQUIRED | OPTIMIZED | PENDING_REOPTIMIZATION" }
      - { name: cct_orthophosphate_mg_l, type: number, source: input, default: null, description: "Orthophosphate residual target in mg/L; null when cct_optimization_status is NOT_REQUIRED", constraints: ">= 0" }
      - { name: cct_target_ph, type: number, source: input, default: null, description: "Corrosion control target pH", constraints: "6.0 .. 9.5 when non-null" }
      - { name: total_service_line_count, type: integer, source: computed, default: 0, description: "count of ServiceLine rows with water_system_id == this.id (no status filter; every line counts)" }
      - { name: lead_count, type: integer, source: computed, default: 0, description: "count of ServiceLine rows with water_system_id == this.id AND classification == LEAD" }
      - { name: grr_count, type: integer, source: computed, default: 0, description: "count of ServiceLine rows with water_system_id == this.id AND classification == GRR" }
      - { name: non_lead_count, type: integer, source: computed, default: 0, description: "count of ServiceLine rows with water_system_id == this.id AND classification == NON_LEAD" }
      - { name: unknown_count, type: integer, source: computed, default: 0, description: "count of ServiceLine rows with water_system_id == this.id AND classification == UNKNOWN" }
      - { name: unknown_share_pct, type: number, source: computed, default: 0.0, description: "0.00 when total_service_line_count == 0, else round(100 * unknown_count / total_service_line_count, 2)" }
      - { name: outstanding_notification_count, type: integer, source: computed, default: 0, description: "count of CustomerNotification rows whose ServiceLine.water_system_id == this.id AND state IN {PENDING, RETURNED}" }
      - { name: inventory_status, type: enum, source: system, default: DRAFT, description: "Inventory lifecycle posture of the whole system", constraints: "DRAFT | VALIDATION_PENDING | PUBLISHED | AMENDMENT_PENDING" }
      - { name: program_posture, type: enum, source: computed, description: "Derived gate over every replacement/publication write; see calculations.program_posture", constraints: "OPEN | RESTRICTED | FROZEN" }

  - name: ServiceLine
    parent: null
    common_fields: true
    fields:
      - { name: water_system_id, type: string, source: input, description: "FK -> WaterSystem.id" }
      - { name: street_project_id, type: string, source: input, default: null, description: "FK -> StreetProject.id; nullable; when set, the line participates in that paving project's coordination window" }
      - { name: address_label, type: string, source: input, description: "Service address label", constraints: "unique per (water_system_id, address_label)" }
      - { name: census_tract_code, type: string, source: input, description: "Census tract the premise sits in" }
      - { name: serves_sensitive_population, type: boolean, source: input, default: false, description: "True for schools, licensed child care and dialysis premises" }
      - { name: interior_diameter_mm, type: number, source: input, default: 19.0, description: "Interior diameter of the service line in millimetres; input to the flushing-guidance volume term", constraints: "> 0" }
      - { name: total_length_m, type: number, source: input, default: 15.0, description: "Combined utility-side + customer-side length in metres", constraints: "> 0" }
      - { name: disadvantaged_status, type: boolean, source: computed, default: false, description: "true when census_tract_code is a member of WaterSystem.disadvantaged_tract_codes at the time of the most recent classification recompute" }
      - { name: utility_side_material, type: enum, source: computed, default: UNKNOWN, description: "observed_material of the governing EvidenceItem for side == UTILITY under the active certainty_basis; UNKNOWN when no governing evidence exists", constraints: "LEAD | GRR | COPPER | PLASTIC | UNKNOWN" }
      - { name: customer_side_material, type: enum, source: computed, default: UNKNOWN, description: "observed_material of the governing EvidenceItem for side == CUSTOMER under the active certainty_basis; UNKNOWN when no governing evidence exists", constraints: "LEAD | GRR | COPPER | PLASTIC | UNKNOWN" }
      - { name: classification, type: enum, source: computed, default: UNKNOWN, description: "Worst-of-both-sides roll-up; see calculations.service_line_classification", constraints: "LEAD | GRR | NON_LEAD | UNKNOWN" }
      - { name: certainty_basis, type: enum, source: computed, default: RECORDS_BASIS, description: "RECORDS_BASIS while inventory_state == CLASSIFIED_PROVISIONAL or UNCLASSIFIED; FIELD_BASIS once inventory_state == CLASSIFIED_VERIFIED", constraints: "RECORDS_BASIS | FIELD_BASIS" }
      - { name: certainty_score, type: number, source: computed, default: 0.0, description: "0.00–100.00 material certainty; see calculations.service_line_certainty_score" }
      - { name: replacement_priority_score, type: number, source: computed, default: 0.0, description: "0.00–100.00 prioritization score; see calculations.replacement_priority_score" }
      - { name: consent_barrier_flag, type: boolean, source: computed, default: false, description: "true when the ReplacementOrder for this service_line_id with the greatest created_at has consent_state IN {DENIED, NO_RESPONSE}" }
      - { name: inventory_state, type: enum, source: system, default: UNCLASSIFIED, description: "Classification axis of the ServiceLine parallel state machine", constraints: "UNCLASSIFIED | CLASSIFIED_PROVISIONAL | CLASSIFIED_VERIFIED" }
      - { name: replacement_state, type: enum, source: system, default: NOT_REQUIRED, description: "Replacement axis of the ServiceLine parallel state machine; evolves independently of inventory_state", constraints: "NOT_REQUIRED | ELIGIBLE | IN_PROGRAM | REPLACED_PARTIAL | REPLACED_FULL" }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id" }
      - { name: source_type, type: enum, source: input, description: "Evidence provenance; fixes tier_rank and confidence_weight", constraints: "HISTORIC_RECORD | PREDICTIVE_MODEL | WATER_SAMPLING | VISUAL_INSPECTION | POTHOLE" }
      - { name: side, type: enum, source: input, description: "Which portion of the service line the observation covers", constraints: "UTILITY | CUSTOMER" }
      - { name: observed_material, type: enum, source: input, description: "Material observed for that side", constraints: "LEAD | GRR | COPPER | PLASTIC | UNKNOWN" }
      - { name: observed_at, type: datetime, source: input, description: "ISO 8601 UTC instant the observation was made; primary tie-break key of governing-evidence selection" }
      - { name: notes, type: string, source: input, default: null, description: "Free-text field notes" }
      - { name: tier_rank, type: integer, source: computed, description: "1 HISTORIC_RECORD, 2 PREDICTIVE_MODEL, 3 WATER_SAMPLING, 4 VISUAL_INSPECTION, 5 POTHOLE" }
      - { name: confidence_weight, type: number, source: computed, description: "0.40 HISTORIC_RECORD, 0.55 PREDICTIVE_MODEL, 0.70 WATER_SAMPLING, 0.85 VISUAL_INSPECTION, 1.00 POTHOLE" }
      - { name: origin, type: enum, source: system, default: MANUAL, description: "MANUAL when created through POST /lsl/evidence-items or a classification override; APPOINTMENT_CASCADE when synthesized by a VerificationAppointment completion; REPLACEMENT_CASCADE when synthesized by a ReplacementOrder completion", constraints: "MANUAL | APPOINTMENT_CASCADE | REPLACEMENT_CASCADE" }
      - { name: retracted, type: boolean, source: system, default: false, description: "true once retracted; retracted items are excluded from every governing-evidence selection" }
      - { name: retraction_reason, type: string, source: system, default: null, description: "Reason captured at retraction" }

  - name: VerificationCrew
    parent: null
    common_fields: true
    fields:
      - { name: water_system_id, type: string, source: input, description: "FK -> WaterSystem.id" }
      - { name: crew_name, type: string, source: input, description: "Crew display name" }
      - { name: shift_start_utc_time, type: string, source: input, description: "Daily shift open time as HH:MM UTC; appointment windows must sit inside the shift", constraints: "HH:MM 24h" }
      - { name: shift_end_utc_time, type: string, source: input, description: "Daily shift close time as HH:MM UTC", constraints: "HH:MM 24h, strictly greater than shift_start_utc_time" }
      - { name: daily_appointment_capacity, type: integer, source: input, description: "Maximum number of VerificationAppointment rows in state IN {SCHEDULED, ON_SITE, COMPLETED} whose window_start_utc falls on one UTC calendar date", constraints: ">= 1" }
      - { name: certified_methods, type: array, source: input, description: "Subset of {VISUAL_INSPECTION, POTHOLE, WATER_SAMPLING} the crew may be booked for", constraints: "non-empty" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Crew availability; INACTIVE crews block appointment arrival", constraints: "ACTIVE | INACTIVE" }
      - { name: scheduled_appointment_count, type: integer, source: computed, default: 0, description: "count of VerificationAppointment rows with crew_id == this.id AND state IN {SCHEDULED, ON_SITE}" }

  - name: VerificationAppointment
    parent: null
    common_fields: true
    fields:
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> VerificationCrew.id" }
      - { name: method, type: enum, source: input, description: "Verification method to be performed", constraints: "VISUAL_INSPECTION | POTHOLE | WATER_SAMPLING" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive start of the crew occupation interval" }
      - { name: window_end_utc, type: datetime, source: input, description: "Exclusive end of the crew occupation interval", constraints: "strictly greater than window_start_utc" }
      - { name: state, type: enum, source: system, default: SCHEDULED, description: "Appointment lifecycle with a NO_ACCESS→SCHEDULED reschedule cycle", constraints: "SCHEDULED | ON_SITE | COMPLETED | NO_ACCESS | ABANDONED" }
      - { name: attempt_count, type: integer, source: system, default: 1, description: "Number of site visits attempted; incremented by each reschedule out of NO_ACCESS" }
      - { name: barrier_reason, type: string, source: system, default: null, description: "Access-barrier reason captured on the NO_ACCESS transition", constraints: "LOCKED_PREMISE | OCCUPANT_REFUSED | UTILITY_CONFLICT | WEATHER" }
      - { name: observed_material, type: enum, source: system, default: null, description: "Material recorded at completion; copied onto the cascaded EvidenceItem", constraints: "LEAD | GRR | COPPER | PLASTIC | UNKNOWN" }
      - { name: observed_side, type: enum, source: system, default: null, description: "Side recorded at completion", constraints: "UTILITY | CUSTOMER" }
      - { name: emitted_evidence_item_id, type: string, source: system, default: null, description: "Id of the EvidenceItem synthesized by the completion cascade; null until COMPLETED" }

  - name: SamplingBatch
    parent: null
    common_fields: true
    fields:
      - { name: water_system_id, type: string, source: input, description: "FK -> WaterSystem.id" }
      - { name: stratum_code, type: string, source: input, description: "Sampling stratum label", constraints: "unique per (water_system_id, stratum_code)" }
      - { name: stratum_line_count, type: integer, source: input, description: "Population size of the stratum; drives required_sample_count", constraints: ">= 1" }
      - { name: samples, type: array, source: system, default: [], description: "Append-only embedded sample objects { sample_seq, service_line_id, lead_ppb, collected_at, sample_type, invalidated, invalidation_reason }; sample_seq starts at 1 and increments by 1 per accepted sample; sample_type IN {FIRST_DRAW, FIFTH_LITER}; invalidated defaults to false" }
      - { name: required_sample_count, type: integer, source: computed, description: "max(5, ceil(stratum_line_count * 0.05))" }
      - { name: valid_sample_count, type: integer, source: computed, default: 0, description: "count of samples[] entries with invalidated == false" }
      - { name: percentile_90_ppb, type: number, source: computed, default: null, description: "90th percentile lead concentration by nearest-rank over valid samples; null before validation" }
      - { name: exceedance_count, type: integer, source: computed, default: 0, description: "count of valid samples[] entries with lead_ppb > 15.0" }
      - { name: exceedance, type: boolean, source: computed, default: false, description: "percentile_90_ppb > 15.0 (strictly greater)" }
      - { name: classification_confidence, type: number, source: computed, default: null, description: "round(1 - exceedance_count / valid_sample_count, 4)" }
      - { name: state, type: enum, source: system, default: OPEN, description: "Statistical validation lifecycle with a REJECTED→OPEN resample cycle", constraints: "OPEN | VALIDATED | REJECTED" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times the batch has been reopened for resampling" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "CONFIDENCE_BELOW_FLOOR when validation resolved to REJECTED", constraints: "CONFIDENCE_BELOW_FLOOR" }

  - name: InventoryPublication
    parent: null
    common_fields: true
    fields:
      - { name: water_system_id, type: string, source: input, description: "FK -> WaterSystem.id" }
      - { name: basis, type: enum, source: input, description: "Which certainty variant the published counts were computed under", constraints: "RECORDS | FIELD_VERIFIED" }
      - { name: reporting_period_label, type: string, source: input, description: "Human label of the reporting period, e.g. 2026-H2" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the InventoryAnalyst that created the draft; segregation-of-duties key" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer that certified the draft" }
      - { name: state, type: enum, source: system, default: DRAFT, description: "Publication lifecycle", constraints: "DRAFT | CERTIFIED | PUBLISHED | SUPERSEDED" }
      - { name: pinned_lead_count, type: integer, source: computed, default: null, description: "WaterSystem.lead_count frozen at the moment of certification" }
      - { name: pinned_grr_count, type: integer, source: computed, default: null, description: "WaterSystem.grr_count frozen at the moment of certification" }
      - { name: pinned_unknown_count, type: integer, source: computed, default: null, description: "WaterSystem.unknown_count frozen at the moment of certification" }
      - { name: pinned_non_lead_count, type: integer, source: computed, default: null, description: "WaterSystem.non_lead_count frozen at the moment of certification" }
      - { name: notifiable_line_count, type: integer, source: computed, default: null, description: "pinned_lead_count + pinned_grr_count + pinned_unknown_count; the number of CustomerNotification rows the publish cascade must create" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical-clock instant the publication moved to PUBLISHED" }
      - { name: notification_due_at, type: datetime, source: computed, default: null, description: "published_at + 30 days; the deadline stamped onto every cascaded CustomerNotification" }
      - { name: supersede_reason, type: string, source: system, default: null, description: "AMENDED_BY_NEWER_PUBLICATION when superseded by a later PUBLISHED publication of the same water system", constraints: "AMENDED_BY_NEWER_PUBLICATION" }

  - name: CustomerNotification
    parent: null
    common_fields: true
    fields:
      - { name: service_line_id, type: string, source: system, description: "FK -> ServiceLine.id" }
      - { name: inventory_publication_id, type: string, source: system, description: "FK -> InventoryPublication.id" }
      - { name: notified_classification, type: enum, source: system, description: "ServiceLine.classification captured when the notification was created by the publish cascade", constraints: "LEAD | GRR | UNKNOWN" }
      - { name: state, type: enum, source: system, default: PENDING, description: "Notification lifecycle with a DELIVERED→RETURNED→DELIVERED redelivery cycle", constraints: "PENDING | DELIVERED | ACKNOWLEDGED | RETURNED" }
      - { name: delivery_channel, type: enum, source: system, default: null, description: "Channel of the most recent delivery attempt", constraints: "MAIL | EMAIL | DOOR_HANGER" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Instant of the most recent successful delivery" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Instant the customer acknowledged receipt" }
      - { name: return_reason, type: string, source: system, default: null, description: "Reason the delivery came back undeliverable", constraints: "ADDRESS_INVALID | REFUSED | VACANT" }
      - { name: delivery_attempt_count, type: integer, source: system, default: 0, description: "Number of delivery attempts made; incremented on every deliver transition" }
      - { name: due_at, type: datetime, source: computed, description: "InventoryPublication.notification_due_at of the parent publication" }
      - { name: overdue, type: boolean, source: computed, default: false, description: "true when logical clock now > due_at AND state IN {PENDING, RETURNED}" }

  - name: ReplacementOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id" }
      - { name: street_project_id, type: string, source: input, default: null, description: "FK -> StreetProject.id; nullable; when set the excavation window is checked against that project's moratorium and excavation capacity" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Total estimated replacement cost in cents; the amount apportioned across FundingSource rows", constraints: ">= 1" }
      - { name: excavation_start_date, type: string, source: input, description: "Inclusive first calendar date (YYYY-MM-DD) of the excavation window" }
      - { name: excavation_end_date, type: string, source: input, description: "Inclusive last calendar date (YYYY-MM-DD) of the excavation window", constraints: ">= excavation_start_date" }
      - { name: fulfillment_state, type: enum, source: system, default: DRAFT, description: "Work axis of the ReplacementOrder parallel state machine", constraints: "DRAFT | SCOPED | FUNDED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: consent_state, type: enum, source: system, default: NOT_REQUESTED, description: "Customer-side consent axis; evolves independently of fulfillment_state until the SCOPED fork consumes it", constraints: "NOT_REQUESTED | REQUESTED | GRANTED | DENIED | NO_RESPONSE" }
      - { name: scope, type: enum, source: computed, default: null, description: "FULL when consent_state == GRANTED at the SCOPED fork, PARTIAL when consent_state IN {DENIED, NO_RESPONSE}", constraints: "FULL | PARTIAL" }
      - { name: consent_barrier_reason, type: string, source: system, default: null, description: "Barrier recorded with a non-GRANTED consent response", constraints: "COST | REFUSED | NO_CONTACT | ACCESS_DENIED" }
      - { name: funding_allocations, type: array, source: computed, default: [], description: "Embedded apportionment rows { funding_source_id, allocated_cents, priority_rank, state } produced by the funding-plan commit; state is COMMITTED, DRAWN or RELEASED" }
      - { name: funding_mode_applied, type: enum, source: computed, default: null, description: "WaterSystem.funding_mode read at the funding-plan commit and frozen on the order", constraints: "WATERFALL | PRO_RATA" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "sum of funding_allocations[].allocated_cents whose state IN {COMMITTED, DRAWN}" }
      - { name: flushing_duration_minutes, type: integer, source: computed, default: null, description: "Post-replacement flushing guidance in whole minutes; see calculations.post_replacement_flushing_guidance" }
      - { name: replaced_sides, type: array, source: system, default: [], description: "Subset of {UTILITY, CUSTOMER} actually replaced, recorded at completion" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the order completed" }
      - { name: cancellation_reason, type: string, source: system, default: null, description: "Reason recorded on the compensating cancel transition" }

  - name: StreetProject
    parent: null
    common_fields: true
    fields:
      - { name: water_system_id, type: string, source: input, description: "FK -> WaterSystem.id" }
      - { name: project_name, type: string, source: input, description: "Paving/roadway project name" }
      - { name: moratorium_start_date, type: string, source: input, description: "Inclusive first calendar date of the post-paving cut moratorium (YYYY-MM-DD)" }
      - { name: moratorium_end_date, type: string, source: input, description: "Inclusive last calendar date of the moratorium", constraints: ">= moratorium_start_date" }
      - { name: paving_start_date, type: string, source: input, description: "Calendar date paving begins; drives the coordination tier of replacement_priority_score" }
      - { name: max_concurrent_excavations, type: integer, source: input, default: 1, description: "Maximum number of non-terminal ReplacementOrder excavation windows that may overlap on any single calendar date within this project", constraints: ">= 1" }
      - { name: active_excavation_order_count, type: integer, source: computed, default: 0, description: "count of ReplacementOrder rows with street_project_id == this.id AND fulfillment_state IN {SCHEDULED, IN_PROGRESS}" }

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - { name: water_system_id, type: string, source: input, description: "FK -> WaterSystem.id" }
      - { name: source_kind, type: enum, source: input, description: "Capital origin", constraints: "STATE_REVOLVING_FUND | FEDERAL_GRANT | RATE_REVENUE" }
      - { name: authorized_cents, type: integer, source: input, description: "Total authorized capital in cents; the conserved quantity of the funding invariant", constraints: ">= 1" }
      - { name: priority_rank, type: integer, source: input, description: "Waterfall fill order and pro-rata remainder-cent recipient order; lower fills first", constraints: ">= 1" }
      - { name: max_share_pct, type: number, source: input, default: 100.0, description: "Maximum percentage of any single order's estimated_cost_cents this source may fund", constraints: "0.0 < value <= 100.0" }
      - { name: equity_required_pct, type: number, source: input, default: 0.0, description: "Minimum percentage of this source's committed+drawn dollars that must sit on disadvantaged service lines", constraints: "0.0 <= value <= 100.0" }
      - { name: available_cents, type: integer, source: computed, description: "authorized_cents - committed_cents - drawn_cents" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "sum of ReplacementOrder.funding_allocations[].allocated_cents for this source with allocation state == COMMITTED" }
      - { name: drawn_cents, type: integer, source: computed, default: 0, description: "sum of ReplacementOrder.funding_allocations[].allocated_cents for this source with allocation state == DRAWN" }
      - { name: disadvantaged_committed_cents, type: integer, source: computed, default: 0, description: "Portion of committed_cents + drawn_cents whose ReplacementOrder.service_line_id resolves to a ServiceLine with disadvantaged_status == true" }
      - { name: disadvantaged_share_pct, type: number, source: computed, default: 0.0, description: "0.00 when committed_cents + drawn_cents == 0, else round(100 * disadvantaged_committed_cents / (committed_cents + drawn_cents), 2)" }
      - { name: equity_shortfall_cents, type: integer, source: computed, default: 0, description: "max(0, ceil((committed_cents + drawn_cents) * equity_required_pct / 100) - disadvantaged_committed_cents)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Only ACTIVE sources enter the apportionment candidate set", constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: ProgressReport
    parent: null
    common_fields: false      # append-only compliance artifact: id + created_at only, no update endpoint, no version
    fields:
      - { name: water_system_id, type: string, source: input, description: "FK -> WaterSystem.id" }
      - { name: period_start_date, type: string, source: input, description: "Inclusive first calendar date of the reporting period (YYYY-MM-DD)" }
      - { name: period_end_date, type: string, source: input, description: "Inclusive last calendar date of the reporting period", constraints: ">= period_start_date; must not overlap another ProgressReport of the same water system" }
      - { name: full_replacement_count, type: integer, source: computed, description: "count of ReplacementOrder rows for this system with fulfillment_state == COMPLETED, scope == FULL and completed_at date inside the period" }
      - { name: partial_replacement_count, type: integer, source: computed, description: "same filter with scope == PARTIAL" }
      - { name: disadvantaged_full_count, type: integer, source: computed, description: "subset of full_replacement_count whose ServiceLine.disadvantaged_status == true" }
      - { name: base_credit, type: number, source: computed, description: "full_replacement_count + round(0.5 * partial_replacement_count, 2)" }
      - { name: disadvantaged_share_pct, type: number, source: computed, description: "round(100 * disadvantaged_full_count / max(1, full_replacement_count), 2)" }
      - { name: equity_tier, type: enum, source: computed, description: "Tier selected from disadvantaged_share_pct in STEP 2 of calculations.compliance_credit", constraints: "TIER_A | TIER_B | TIER_C | TIER_D" }
      - { name: equity_multiplier, type: number, source: computed, description: "1.20 TIER_A, 1.10 TIER_B, 1.00 TIER_C, 0.90 TIER_D" }
      - { name: total_credit, type: number, source: computed, description: "round(base_credit * equity_multiplier, 2)" }
      - { name: mandated_annual_credit, type: integer, source: computed, description: "ceil(WaterSystem.baseline_lead_and_grr_count * 0.10)" }
      - { name: deferral_allowance, type: integer, source: computed, description: "Tier over total_credit: 3 when total_credit >= 20, 2 when total_credit >= 10, else 1" }
      - { name: shortfall_credit, type: number, source: computed, description: "round(max(0, mandated_annual_credit - deferral_allowance - total_credit), 2)" }
      - { name: compliance_status, type: enum, source: computed, description: "ON_TRACK when shortfall_credit == 0, else BEHIND", constraints: "ON_TRACK | BEHIND" }
      - { name: replaced_count, type: integer, source: computed, description: "count of ServiceLine rows for this system with replacement_state IN {REPLACED_FULL, REPLACED_PARTIAL} as of report creation" }
      - { name: baseline_denominator, type: integer, source: computed, description: "WaterSystem.lead_count + WaterSystem.grr_count + WaterSystem.unknown_count + replaced_count, evaluated at report creation" }
      - { name: replacement_progress_pct, type: number, source: computed, description: "100.00 when baseline_denominator == 0, else round(100 * replaced_count / baseline_denominator, 2)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- WaterSystem
  - entity: WaterSystem
    state_field: inventory_status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: VALIDATION_PENDING
        trigger: "POST /lsl/water-systems/{id}/advance-inventory-status with target_status = VALIDATION_PENDING"
        actor: ComplianceOfficer
        preconditions:
          - "water_system.inventory_status == DRAFT"
          - "water_system.total_service_line_count >= 1"
          - "no ServiceLine with water_system_id == water_system.id has inventory_state == UNCLASSIFIED"
        side_effects:
          - "recompute WaterSystem.program_posture per calculations.program_posture (leaving DRAFT lifts the STEP-1 FROZEN clause)"
          - "increments WaterSystem.version by 1"
      - from: VALIDATION_PENDING
        to: PUBLISHED
        trigger: "system — second link of the publish cascade fired by POST /lsl/inventory-publications/{id}/publish"
        actor: system
        preconditions:
          - "the publishing InventoryPublication.water_system_id == water_system.id"
          - "water_system.inventory_status IN {VALIDATION_PENDING, AMENDMENT_PENDING}"
        side_effects:
          - "recompute WaterSystem.outstanding_notification_count after the notification fan-out"
          - "recompute WaterSystem.program_posture"
          - "increments WaterSystem.version by 1"
      - from: PUBLISHED
        to: AMENDMENT_PENDING
        trigger: "system — third link of any classification-recompute cascade (evidence create, evidence retract, classification override, appointment completion, replacement completion)"
        actor: system
        preconditions:
          - "water_system.inventory_status == PUBLISHED"
          - "the recompute changed at least one ServiceLine.classification to a value different from its pre-recompute value"
        side_effects:
          - "recompute WaterSystem.program_posture — STEP 3 forces RESTRICTED while inventory_status == AMENDMENT_PENDING"
          - "increments WaterSystem.version by 1"
        note: "This is the cycle edge: PUBLISHED → AMENDMENT_PENDING → PUBLISHED once a newer publication publishes."
      - from: AMENDMENT_PENDING
        to: PUBLISHED
        trigger: "system — second link of the publish cascade fired by POST /lsl/inventory-publications/{id}/publish for a later publication of the same water system"
        actor: system
        preconditions:
          - "water_system.inventory_status == AMENDMENT_PENDING"
        side_effects:
          - "the prior InventoryPublication in state PUBLISHED for this water system transitions to SUPERSEDED with supersede_reason = AMENDED_BY_NEWER_PUBLICATION"
          - "recompute WaterSystem.outstanding_notification_count and WaterSystem.program_posture"
          - "increments WaterSystem.version by 1"

  # ----------------------------------------- ServiceLine axis A: inventory_state
  - entity: ServiceLine
    state_field: inventory_state
    shape: cyclic
    initial_state: UNCLASSIFIED
    terminal_states: []
    note: "Axis A of the ServiceLine parallel state machine. Evolves independently of axis B (replacement_state): a line may be CLASSIFIED_PROVISIONAL while already IN_PROGRAM, or CLASSIFIED_VERIFIED while still NOT_REQUIRED."
    transitions:
      - from: UNCLASSIFIED
        to: CLASSIFIED_PROVISIONAL
        trigger: "POST /lsl/evidence-items (first non-retracted EvidenceItem for this service_line_id) or POST /lsl/service-lines/{id}/classification-overrides"
        actor: InventoryAnalyst
        preconditions:
          - "service_line.inventory_state == UNCLASSIFIED"
        side_effects:
          - "set ServiceLine.certainty_basis = RECORDS_BASIS"
          - "recompute ServiceLine.disadvantaged_status, utility_side_material, customer_side_material, classification per calculations.service_line_classification"
          - "recompute ServiceLine.certainty_score per calculations.service_line_certainty_score and ServiceLine.replacement_priority_score per calculations.replacement_priority_score"
          - "bubble up: recompute WaterSystem.lead_count, grr_count, non_lead_count, unknown_count, total_service_line_count, unknown_share_pct"
          - "then recompute WaterSystem.program_posture from those refreshed counters"
          - "increments ServiceLine.version by 1"
      - from: CLASSIFIED_PROVISIONAL
        to: CLASSIFIED_PROVISIONAL
        trigger: "POST /lsl/evidence-items, POST /lsl/evidence-items/{id}/retract or POST /lsl/service-lines/{id}/classification-overrides on an already-provisional line"
        actor: InventoryAnalyst
        preconditions:
          - "service_line.inventory_state == CLASSIFIED_PROVISIONAL"
          - "after the write, the line does NOT hold both a UTILITY-side and a CUSTOMER-side non-retracted EvidenceItem with source_type IN {VISUAL_INSPECTION, POTHOLE}"
        side_effects:
          - "recompute classification and certainty_score under certainty_basis = RECORDS_BASIS"
          - "bubble up WaterSystem counters, then WaterSystem.program_posture"
          - "increments ServiceLine.version by 1"
      - from: CLASSIFIED_PROVISIONAL
        to: CLASSIFIED_VERIFIED
        trigger: "system — automatic immediately after any EvidenceItem insertion (manual, override, or APPOINTMENT_CASCADE) that leaves the line holding at least one non-retracted EvidenceItem with source_type IN {VISUAL_INSPECTION, POTHOLE} for side == UTILITY AND at least one for side == CUSTOMER"
        actor: system
        preconditions:
          - "service_line.inventory_state == CLASSIFIED_PROVISIONAL"
          - "the both-sides field-evidence predicate above holds after the insertion"
        side_effects:
          - "set ServiceLine.certainty_basis = FIELD_BASIS"
          - "recompute utility_side_material, customer_side_material, classification and certainty_score under FIELD_BASIS — the same evidence set now yields the field-verified variant"
          - "recompute ServiceLine.replacement_priority_score (certainty_bonus term switches on)"
          - "bubble up WaterSystem counters, then WaterSystem.program_posture; if WaterSystem.inventory_status == PUBLISHED and this recompute changed classification, WaterSystem.inventory_status → AMENDMENT_PENDING"
          - "increments ServiceLine.version by 1"
      - from: CLASSIFIED_VERIFIED
        to: CLASSIFIED_PROVISIONAL
        trigger: "system — automatic immediately after POST /lsl/evidence-items/{id}/retract removes the last non-retracted VISUAL_INSPECTION/POTHOLE EvidenceItem on either side"
        actor: system
        preconditions:
          - "service_line.inventory_state == CLASSIFIED_VERIFIED"
          - "after the retraction the both-sides field-evidence predicate no longer holds"
        side_effects:
          - "set ServiceLine.certainty_basis = RECORDS_BASIS"
          - "recompute classification and certainty_score under RECORDS_BASIS (the records-variant value returns)"
          - "recompute ServiceLine.replacement_priority_score"
          - "bubble up WaterSystem counters, then WaterSystem.program_posture; if WaterSystem.inventory_status == PUBLISHED and classification changed, WaterSystem.inventory_status → AMENDMENT_PENDING"
          - "increments ServiceLine.version by 1"
        note: "Cycle edge: CLASSIFIED_PROVISIONAL → CLASSIFIED_VERIFIED → CLASSIFIED_PROVISIONAL."

  # -------------------------------------- ServiceLine axis B: replacement_state
  - entity: ServiceLine
    state_field: replacement_state
    shape: cyclic
    initial_state: NOT_REQUIRED
    terminal_states: []
    note: "Axis B of the ServiceLine parallel state machine, driven by classification roll-ups and ReplacementOrder lifecycle, never by axis A directly."
    transitions:
      - from: NOT_REQUIRED
        to: ELIGIBLE
        trigger: "system — automatic at the end of any classification recompute that lands classification IN {LEAD, GRR, UNKNOWN}"
        actor: system
        preconditions:
          - "service_line.replacement_state == NOT_REQUIRED"
        side_effects:
          - "recompute ServiceLine.replacement_priority_score"
          - "increments ServiceLine.version by 1"
      - from: ELIGIBLE
        to: NOT_REQUIRED
        trigger: "system — automatic at the end of any classification recompute that lands classification == NON_LEAD"
        actor: system
        preconditions:
          - "service_line.replacement_state == ELIGIBLE"
        side_effects:
          - "set ServiceLine.replacement_priority_score = 0.00"
          - "increments ServiceLine.version by 1"
      - from: ELIGIBLE
        to: IN_PROGRAM
        trigger: "POST /lsl/replacement-orders"
        actor: ProgramAdministrator
        preconditions:
          - "service_line.replacement_state == ELIGIBLE"
          - "WaterSystem.inventory_status IN {PUBLISHED, AMENDMENT_PENDING}"
          - "WaterSystem.program_posture != FROZEN"
        side_effects:
          - "the new ReplacementOrder is created with fulfillment_state = DRAFT and consent_state = NOT_REQUESTED"
          - "increments ServiceLine.version by 1"
      - from: IN_PROGRAM
        to: REPLACED_FULL
        trigger: "POST /lsl/replacement-orders/{id}/complete on an order with scope == FULL"
        actor: ReplacementContractor
        preconditions:
          - "service_line.replacement_state == IN_PROGRAM"
          - "order.fulfillment_state == IN_PROGRESS"
        side_effects:
          - "one EvidenceItem with origin = REPLACEMENT_CASCADE, source_type = POTHOLE, observed_material = COPPER is synthesized per side in order.replaced_sides"
          - "that insertion recomputes ServiceLine.classification (→ NON_LEAD) and certainty_score"
          - "which bubbles up WaterSystem counters and then WaterSystem.program_posture"
          - "increments ServiceLine.version by 1"
      - from: IN_PROGRAM
        to: REPLACED_PARTIAL
        trigger: "POST /lsl/replacement-orders/{id}/complete on an order with scope == PARTIAL"
        actor: ReplacementContractor
        preconditions:
          - "service_line.replacement_state == IN_PROGRAM"
          - "order.fulfillment_state == IN_PROGRESS"
        side_effects:
          - "one EvidenceItem with origin = REPLACEMENT_CASCADE, source_type = POTHOLE, observed_material = COPPER is synthesized for side UTILITY only; the customer side keeps its prior governing evidence"
          - "that insertion recomputes ServiceLine.classification (customer side still LEAD/GRR/UNKNOWN → classification unchanged or still non-NON_LEAD) and certainty_score"
          - "which bubbles up WaterSystem counters and then WaterSystem.program_posture"
          - "increments ServiceLine.version by 1"
      - from: REPLACED_PARTIAL
        to: IN_PROGRAM
        trigger: "POST /lsl/replacement-orders (a follow-up order covering the customer-side portion)"
        actor: ProgramAdministrator
        preconditions:
          - "service_line.replacement_state == REPLACED_PARTIAL"
          - "service_line.classification IN {LEAD, GRR, UNKNOWN}"
          - "WaterSystem.program_posture != FROZEN"
        side_effects:
          - "increments ServiceLine.version by 1"
        note: "Cycle edge: IN_PROGRAM → REPLACED_PARTIAL → IN_PROGRAM."
      - from: IN_PROGRAM
        to: ELIGIBLE
        trigger: "POST /lsl/replacement-orders/{id}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "service_line.replacement_state == IN_PROGRAM"
          - "order.fulfillment_state IN {DRAFT, SCOPED, FUNDED, SCHEDULED}"
        side_effects:
          - "compensation — see ReplacementOrder cancel transition for the full funding release chain"
          - "increments ServiceLine.version by 1"

  # ------------------------------------------------- VerificationAppointment
  - entity: VerificationAppointment
    state_field: state
    shape: cyclic
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /lsl/verification-appointments/{id}/arrive"
        actor: FieldTechnician
        preconditions:
          - "appointment.state == SCHEDULED"
          - "X-User-ID == appointment.crew_id"
          - "VerificationCrew.{appointment.crew_id}.status == ACTIVE"
        side_effects:
          - "increments VerificationAppointment.version by 1"
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /lsl/verification-appointments/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "appointment.state == ON_SITE"
          - "X-User-ID == appointment.crew_id"
        side_effects:
          - "LINK 1 — create an EvidenceItem with service_line_id = appointment.service_line_id, source_type = appointment.method, side = observed_side, observed_material = observed_material, origin = APPOINTMENT_CASCADE; store its id in appointment.emitted_evidence_item_id"
          - "LINK 2 — that EvidenceItem insertion recomputes ServiceLine governing evidence, classification, certainty_score and replacement_priority_score, and may fire ServiceLine.inventory_state CLASSIFIED_PROVISIONAL → CLASSIFIED_VERIFIED"
          - "LINK 3 — the ServiceLine classification change bubbles up into WaterSystem.lead_count / grr_count / non_lead_count / unknown_count / unknown_share_pct and recomputes WaterSystem.program_posture"
          - "LINK 4 — if the refreshed WaterSystem.inventory_status was PUBLISHED and the classification changed, WaterSystem.inventory_status → AMENDMENT_PENDING, whose STEP-3 clause forces program_posture = RESTRICTED"
          - "recompute VerificationCrew.scheduled_appointment_count"
          - "increments VerificationAppointment.version by 1"
      - from: ON_SITE
        to: NO_ACCESS
        trigger: "POST /lsl/verification-appointments/{id}/no-access on an appointment with attempt_count < 3"
        actor: FieldTechnician
        preconditions:
          - "appointment.state == ON_SITE"
          - "appointment.attempt_count < 3"
          - "X-User-ID == appointment.crew_id"
        side_effects:
          - "set appointment.barrier_reason from the request"
          - "recompute VerificationCrew.scheduled_appointment_count"
          - "increments VerificationAppointment.version by 1"
      - from: ON_SITE
        to: ABANDONED
        trigger: "POST /lsl/verification-appointments/{id}/no-access on an appointment with attempt_count == 3"
        actor: FieldTechnician
        preconditions:
          - "appointment.state == ON_SITE"
          - "appointment.attempt_count == 3"
          - "X-User-ID == appointment.crew_id"
        side_effects:
          - "set appointment.barrier_reason from the request"
          - "recompute VerificationCrew.scheduled_appointment_count"
          - "increments VerificationAppointment.version by 1"
        note: "Branch of the same endpoint as ON_SITE → NO_ACCESS; the third exhausted attempt terminates the appointment instead of parking it."
      - from: NO_ACCESS
        to: SCHEDULED
        trigger: "POST /lsl/verification-appointments/{id}/reschedule"
        actor: ProgramAdministrator
        preconditions:
          - "appointment.state == NO_ACCESS"
          - "the new window passes the same crew shift, crew overlap and crew daily-capacity checks as creation"
        side_effects:
          - "set window_start_utc / window_end_utc from the request"
          - "appointment.attempt_count += 1"
          - "recompute VerificationCrew.scheduled_appointment_count"
          - "increments VerificationAppointment.version by 1"
        note: "Cycle edge: SCHEDULED → ON_SITE → NO_ACCESS → SCHEDULED."

  # ---------------------------------------------------------- SamplingBatch
  - entity: SamplingBatch
    state_field: state
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: VALIDATED
        trigger: "POST /lsl/sampling-batches/{id}/validate when calculations.sampling_statistical_validation yields classification_confidence >= 0.8000"
        actor: ComplianceOfficer
        preconditions:
          - "batch.state == OPEN"
          - "batch.valid_sample_count >= batch.required_sample_count"
          - "classification_confidence >= 0.8000"
        side_effects:
          - "persist percentile_90_ppb, exceedance_count, exceedance, classification_confidence"
          - "LINK 1 — when exceedance == true, WaterSystem.cct_optimization_status → PENDING_REOPTIMIZATION"
          - "LINK 2 — that WaterSystem change makes every subsequent POST /lsl/replacement-orders/{id}/schedule fail ERR_CCT_NOT_OPTIMIZED and multiplies calculations.post_replacement_flushing_guidance by 1.5"
          - "increments SamplingBatch.version by 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /lsl/sampling-batches/{id}/validate when calculations.sampling_statistical_validation yields classification_confidence < 0.8000"
        actor: ComplianceOfficer
        preconditions:
          - "batch.state == OPEN"
          - "batch.valid_sample_count >= batch.required_sample_count"
          - "classification_confidence < 0.8000"
        side_effects:
          - "persist percentile_90_ppb, exceedance_count, exceedance, classification_confidence"
          - "set rejection_reason = CONFIDENCE_BELOW_FLOOR"
          - "the batch remains non-VALIDATED, so InventoryPublication certification for this water system keeps failing ERR_UNVALIDATED_SAMPLING_STRATUM"
          - "increments SamplingBatch.version by 1"
        note: "Branch of the same endpoint as OPEN → VALIDATED, with a divergent side-effect set."
      - from: REJECTED
        to: OPEN
        trigger: "POST /lsl/sampling-batches/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "batch.state == REJECTED"
        side_effects:
          - "batch.reopen_count += 1"
          - "clear percentile_90_ppb, classification_confidence, rejection_reason back to null; exceedance → false and exceedance_count → 0"
          - "increments SamplingBatch.version by 1"
        note: "Cycle edge: OPEN → REJECTED → OPEN (resample round)."

  # ----------------------------------------------------- InventoryPublication
  - entity: InventoryPublication
    state_field: state
    shape: linear_with_supersede
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /lsl/inventory-publications/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "publication.state == DRAFT"
          - "X-User-ID != publication.drafted_by_user_id (segregation of duties)"
          - "WaterSystem.inventory_status IN {VALIDATION_PENDING, AMENDMENT_PENDING}"
          - "every SamplingBatch with water_system_id == publication.water_system_id has state == VALIDATED, and at least one such batch exists"
          - "no CustomerNotification whose ServiceLine.water_system_id == publication.water_system_id has overdue == true"
        side_effects:
          - "set certified_by_user_id = X-User-ID"
          - "version-pin pinned_lead_count / pinned_grr_count / pinned_unknown_count / pinned_non_lead_count from the live WaterSystem counters"
          - "set notifiable_line_count = pinned_lead_count + pinned_grr_count + pinned_unknown_count"
          - "increments InventoryPublication.version by 1"
      - from: CERTIFIED
        to: PUBLISHED
        trigger: "POST /lsl/inventory-publications/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "publication.state == CERTIFIED"
          - "publication.notifiable_line_count equals the current count of ServiceLine rows of this water system with classification IN {LEAD, GRR, UNKNOWN} (the pinned snapshot is still faithful)"
        side_effects:
          - "set published_at = logical clock now and notification_due_at = published_at + 30 days"
          - "LINK 1 — create exactly one CustomerNotification in state PENDING per ServiceLine of this water system with classification IN {LEAD, GRR, UNKNOWN}, each with notified_classification copied from the line and due_at = publication.notification_due_at"
          - "LINK 2 — that fan-out recomputes WaterSystem.outstanding_notification_count"
          - "LINK 3 — the refreshed counter recomputes WaterSystem.program_posture, which STEP 4 forces to RESTRICTED while any notification is PENDING or RETURNED"
          - "WaterSystem.inventory_status → PUBLISHED"
          - "any other InventoryPublication of this water system in state PUBLISHED → SUPERSEDED with supersede_reason = AMENDED_BY_NEWER_PUBLICATION"
          - "increments InventoryPublication.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — fired by a later publication of the same water system reaching PUBLISHED"
        actor: system
        preconditions:
          - "publication.state == PUBLISHED"
          - "another InventoryPublication with the same water_system_id and a greater created_at is transitioning to PUBLISHED"
        side_effects:
          - "set supersede_reason = AMENDED_BY_NEWER_PUBLICATION"
          - "CustomerNotification rows of the superseded publication keep their own state; they are NOT cancelled"
          - "increments InventoryPublication.version by 1"

  # ----------------------------------------------------- CustomerNotification
  - entity: CustomerNotification
    state_field: state
    shape: cyclic
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /lsl/customer-notifications/{id}/deliver"
        actor: CustomerRepresentative
        preconditions:
          - "notification.state == PENDING"
        side_effects:
          - "set delivery_channel and delivered_at from the request; delivery_attempt_count += 1"
          - "recompute WaterSystem.outstanding_notification_count, then WaterSystem.program_posture (RESTRICTED → OPEN once the counter reaches 0 and no other clause applies)"
          - "increments CustomerNotification.version by 1"
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /lsl/customer-notifications/{id}/acknowledge"
        actor: CustomerRepresentative
        preconditions:
          - "notification.state == DELIVERED"
        side_effects:
          - "set acknowledged_at from the request"
          - "increments CustomerNotification.version by 1"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /lsl/customer-notifications/{id}/return"
        actor: CustomerRepresentative
        preconditions:
          - "notification.state == DELIVERED"
        side_effects:
          - "set return_reason from the request; clear delivered_at back to null"
          - "recompute WaterSystem.outstanding_notification_count (the row re-enters the outstanding set), then WaterSystem.program_posture → RESTRICTED"
          - "increments CustomerNotification.version by 1"
        note: "Compensating edge for deliver: it must restore outstanding_notification_count to exactly its pre-deliver value."
      - from: RETURNED
        to: DELIVERED
        trigger: "POST /lsl/customer-notifications/{id}/deliver"
        actor: CustomerRepresentative
        preconditions:
          - "notification.state == RETURNED"
        side_effects:
          - "set delivery_channel and delivered_at from the request; delivery_attempt_count += 1; clear return_reason to null"
          - "recompute WaterSystem.outstanding_notification_count, then WaterSystem.program_posture"
          - "increments CustomerNotification.version by 1"
        note: "Cycle edge: PENDING → DELIVERED → RETURNED → DELIVERED."

  # ------------------------------- ReplacementOrder axis A: fulfillment_state
  - entity: ReplacementOrder
    state_field: fulfillment_state
    shape: branching_with_cycle
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    note: "Axis A of the ReplacementOrder parallel state machine. The DRAFT → SCOPED edge is a fork: the consent outcome selects the FULL or PARTIAL branch, and the two branches carry different side-effect sets."
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /lsl/replacement-orders/{id}/consent-response with outcome = GRANTED"
        actor: CustomerRepresentative
        preconditions:
          - "order.fulfillment_state == DRAFT"
          - "order.consent_state == REQUESTED"
        side_effects:
          - "FULL branch — set order.scope = FULL and order.consent_state = GRANTED"
          - "ServiceLine.consent_barrier_flag stays false; ServiceLine.replacement_priority_score is recomputed with no barrier penalty"
          - "increments ReplacementOrder.version by 1"
      - from: DRAFT
        to: SCOPED
        trigger: "POST /lsl/replacement-orders/{id}/consent-response with outcome IN {DENIED, NO_RESPONSE}"
        actor: CustomerRepresentative
        preconditions:
          - "order.fulfillment_state == DRAFT"
          - "order.consent_state == REQUESTED"
          - "barrier_reason is present in the request"
        side_effects:
          - "PARTIAL branch — set order.scope = PARTIAL, order.consent_state = outcome, order.consent_barrier_reason = barrier_reason"
          - "LINK 1 — ServiceLine.consent_barrier_flag → true (this order is the line's most recent order)"
          - "LINK 2 — that flag change recomputes ServiceLine.replacement_priority_score, subtracting the 8.00-point barrier penalty and then applying the disadvantaged equity floor"
          - "increments ReplacementOrder.version by 1"
        note: "Divergent branch of the same fork: the FULL branch touches no ServiceLine field, the PARTIAL branch mutates two."
      - from: SCOPED
        to: DRAFT
        trigger: "POST /lsl/replacement-orders/{id}/consent-request on an order whose consent_state == NO_RESPONSE (re-canvass round)"
        actor: CustomerRepresentative
        preconditions:
          - "order.fulfillment_state == SCOPED"
          - "order.consent_state == NO_RESPONSE"
        side_effects:
          - "clear order.scope and order.consent_barrier_reason; on the parallel consent axis order.consent_state NO_RESPONSE → REQUESTED"
          - "ServiceLine.consent_barrier_flag → false, which recomputes ServiceLine.replacement_priority_score and removes the 8.00-point barrier penalty"
          - "increments ReplacementOrder.version by 1"
        note: "Cycle edge on the fulfillment axis — DRAFT → SCOPED → DRAFT — driven entirely by the consent axis looping NO_RESPONSE → REQUESTED. A GRANTED or DENIED order has no such edge, so the loop is reachable only through the NO_RESPONSE outcome."
      - from: SCOPED
        to: FUNDED
        trigger: "POST /lsl/replacement-orders/{id}/funding-plan"
        actor: ProgramAdministrator
        preconditions:
          - "order.fulfillment_state == SCOPED"
          - "order.scope != null"
          - "WaterSystem.program_posture != FROZEN"
          - "calculations.funding_apportionment fully covers order.estimated_cost_cents"
          - "no ACTIVE FundingSource of this water system would end the commit with equity_shortfall_cents > 0"
        side_effects:
          - "set funding_mode_applied = WaterSystem.funding_mode and populate funding_allocations[] with state = COMMITTED rows per calculations.funding_apportionment"
          - "set allocated_total_cents = order.estimated_cost_cents"
          - "for every referenced FundingSource: committed_cents += allocated_cents, available_cents = authorized_cents - committed_cents - drawn_cents, disadvantaged_committed_cents / disadvantaged_share_pct / equity_shortfall_cents recomputed"
          - "recompute WaterSystem.program_posture from the refreshed FundingSource rows"
          - "increments ReplacementOrder.version by 1"
      - from: FUNDED
        to: SCHEDULED
        trigger: "POST /lsl/replacement-orders/{id}/schedule"
        actor: ReplacementContractor
        preconditions:
          - "order.fulfillment_state == FUNDED"
          - "WaterSystem.program_posture == OPEN"
          - "WaterSystem.cct_optimization_status != PENDING_REOPTIMIZATION"
          - "the requested excavation window clears the linked StreetProject moratorium and excavation-capacity checks"
        side_effects:
          - "set excavation_start_date / excavation_end_date from the request"
          - "recompute StreetProject.active_excavation_order_count"
          - "increments ReplacementOrder.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /lsl/replacement-orders/{id}/start"
        actor: ReplacementContractor
        preconditions:
          - "order.fulfillment_state == SCHEDULED"
        side_effects:
          - "recompute StreetProject.active_excavation_order_count"
          - "increments ReplacementOrder.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /lsl/replacement-orders/{id}/complete"
        actor: ReplacementContractor
        preconditions:
          - "order.fulfillment_state == IN_PROGRESS"
          - "replaced_sides == [UTILITY, CUSTOMER] when scope == FULL, or [UTILITY] when scope == PARTIAL"
        side_effects:
          - "set completed_at from the request and compute flushing_duration_minutes per calculations.post_replacement_flushing_guidance"
          - "LINK 1 — every funding_allocations[] row flips COMMITTED → DRAWN"
          - "LINK 2 — that flip moves each FundingSource's committed_cents into drawn_cents (committed_cents -= allocated, drawn_cents += allocated), leaving available_cents unchanged"
          - "LINK 3 — the refreshed FundingSource rows recompute disadvantaged_share_pct and equity_shortfall_cents"
          - "LINK 4 — a non-zero equity_shortfall_cents recomputes WaterSystem.program_posture to RESTRICTED"
          - "ServiceLine.replacement_state → REPLACED_FULL (scope FULL) or REPLACED_PARTIAL (scope PARTIAL), synthesizing exactly one REPLACEMENT_CASCADE EvidenceItem per entry of replaced_sides — each with source_type = POTHOLE, side = that entry, observed_material = COPPER, observed_at = completed_at, origin = REPLACEMENT_CASCADE — which then re-runs calculations.service_line_classification and calculations.service_line_certainty_score. A FULL replacement therefore lands field evidence on BOTH sides and drives inventory_state → CLASSIFIED_VERIFIED with classification NON_LEAD; a PARTIAL replacement lands it on the UTILITY side only, so the line stays CLASSIFIED_PROVISIONAL on RECORDS_BASIS and its classification does not move. REPLACED_FULL and REPLACED_PARTIAL are sticky: the NON_LEAD recompute does NOT drag replacement_state back to NOT_REQUIRED."
          - "recompute StreetProject.active_excavation_order_count"
          - "increments ReplacementOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /lsl/replacement-orders/{id}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "order.fulfillment_state == DRAFT"
        side_effects:
          - "set cancellation_reason; ServiceLine.replacement_state IN_PROGRAM → ELIGIBLE"
          - "increments ReplacementOrder.version by 1"
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /lsl/replacement-orders/{id}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "order.fulfillment_state == SCOPED"
        side_effects:
          - "set cancellation_reason; ServiceLine.replacement_state IN_PROGRAM → ELIGIBLE; ServiceLine.consent_barrier_flag and replacement_priority_score recomputed"
          - "increments ReplacementOrder.version by 1"
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /lsl/replacement-orders/{id}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "order.fulfillment_state == FUNDED"
        side_effects:
          - "COMPENSATION — every funding_allocations[] row flips COMMITTED → RELEASED"
          - "for every referenced FundingSource: committed_cents -= allocated_cents and available_cents = authorized_cents - committed_cents - drawn_cents, restoring available_cents to its exact pre-commit value"
          - "recompute disadvantaged_committed_cents / disadvantaged_share_pct / equity_shortfall_cents, then WaterSystem.program_posture"
          - "set allocated_total_cents = 0; ServiceLine.replacement_state IN_PROGRAM → ELIGIBLE"
          - "increments ReplacementOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lsl/replacement-orders/{id}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "order.fulfillment_state == SCHEDULED"
        side_effects:
          - "same COMPENSATION chain as FUNDED → CANCELLED, plus recompute StreetProject.active_excavation_order_count"
          - "increments ReplacementOrder.version by 1"

  # ---------------------------------- ReplacementOrder axis B: consent_state
  - entity: ReplacementOrder
    state_field: consent_state
    shape: cyclic
    initial_state: NOT_REQUESTED
    terminal_states: [GRANTED, DENIED]
    note: "Axis B of the ReplacementOrder parallel state machine. It advances while fulfillment_state is still DRAFT and is consumed by the DRAFT → SCOPED fork."
    transitions:
      - from: NOT_REQUESTED
        to: REQUESTED
        trigger: "POST /lsl/replacement-orders/{id}/consent-request"
        actor: CustomerRepresentative
        preconditions:
          - "order.consent_state == NOT_REQUESTED"
          - "order.fulfillment_state == DRAFT"
        side_effects:
          - "increments ReplacementOrder.version by 1"
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /lsl/replacement-orders/{id}/consent-response with outcome = GRANTED"
        actor: CustomerRepresentative
        preconditions:
          - "order.consent_state == REQUESTED"
        side_effects:
          - "see the DRAFT → SCOPED FULL branch on axis A"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /lsl/replacement-orders/{id}/consent-response with outcome = DENIED"
        actor: CustomerRepresentative
        preconditions:
          - "order.consent_state == REQUESTED"
          - "barrier_reason present"
        side_effects:
          - "see the DRAFT → SCOPED PARTIAL branch on axis A"
      - from: REQUESTED
        to: NO_RESPONSE
        trigger: "POST /lsl/replacement-orders/{id}/consent-response with outcome = NO_RESPONSE"
        actor: CustomerRepresentative
        preconditions:
          - "order.consent_state == REQUESTED"
          - "barrier_reason present"
        side_effects:
          - "see the DRAFT → SCOPED PARTIAL branch on axis A"
      - from: NO_RESPONSE
        to: REQUESTED
        trigger: "POST /lsl/replacement-orders/{id}/consent-request (re-canvass attempt)"
        actor: CustomerRepresentative
        preconditions:
          - "order.consent_state == NO_RESPONSE"
          - "order.fulfillment_state == SCOPED"
        side_effects:
          - "clear order.scope back to null and order.consent_barrier_reason back to null"
          - "ServiceLine.consent_barrier_flag → false and ServiceLine.replacement_priority_score recomputed without the barrier penalty"
          - "order.fulfillment_state SCOPED → DRAFT"
          - "increments ReplacementOrder.version by 1"
        note: "Cycle edge: REQUESTED → NO_RESPONSE → REQUESTED. DENIED is terminal on this axis; NO_RESPONSE is not."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: publication-create-stale-system
    parent_entity: WaterSystem
    write_endpoint: "POST /lsl/inventory-publications"
    occ_field: "expected_water_system_version"
    description: |
      Creating an InventoryPublication against a WaterSystem whose version has advanced since the
      client last observed it is rejected. A new DRAFT publication legitimately supersedes any prior
      DRAFT publication of the same water system (the prior DRAFT is discarded on the newer draft's
      creation), so the write is not blocked by any state precondition; the stale-version check is
      what prevents a client from drafting against counters it can no longer see.
    error_id: ERR_STALE_WATER_SYSTEM_VERSION
    http_status: 412

  - rule_id: override-create-stale-line
    parent_entity: ServiceLine
    write_endpoint: "POST /lsl/service-lines/{id}/classification-overrides"
    occ_field: "expected_service_line_version"
    description: |
      Recording a classification override against a ServiceLine whose version has advanced since the
      client last observed it is rejected. An override legitimately supersedes the prior governing
      evidence on the same side (it is inserted at the highest evidence tier), so a second override
      on the same side is a valid product operation and no state precondition rejects it; the
      stale-version check is what prevents an analyst from overriding a classification derived from
      evidence they never saw.
    error_id: ERR_STALE_SERVICE_LINE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: governing_evidence_selection
    trigger: "Sub-procedure invoked by service_line_classification and service_line_certainty_score; never exposed on its own"
    algorithm: selector_policy
    formula: |
      # Selector — fully pinned (eligibility filter, ranking expression, tie-break, empty-pool fallback).
      def governing(line, side, basis):
          # (a) eligibility filter
          pool = [e for e in EvidenceItem
                  if e.service_line_id == line.id
                  and e.side == side
                  and e.retracted == false
                  and e.source_type in ALLOWED_SOURCE_TYPES[basis]]
          # (b) ranking expression + (c) tie-break, in this exact order
          pool.sort(key=(tier_rank DESC, observed_at DESC, created_at DESC))
          # (d) empty-pool fallback
          return pool[0] if pool else null      # null means "no governing evidence for this side"
      # ALLOWED_SOURCE_TYPES:
      #   RECORDS_BASIS -> {HISTORIC_RECORD, PREDICTIVE_MODEL}
      #   FIELD_BASIS   -> {HISTORIC_RECORD, PREDICTIVE_MODEL, WATER_SAMPLING, VISUAL_INSPECTION, POTHOLE}
    input_set: "Non-retracted EvidenceItem rows of the line for the requested side, filtered by the basis-specific source_type set. Retracted rows never enter the pool."
    constants:
      TIER_RANK: { HISTORIC_RECORD: 1, PREDICTIVE_MODEL: 2, WATER_SAMPLING: 3, VISUAL_INSPECTION: 4, POTHOLE: 5 }
      CONFIDENCE_WEIGHT: { HISTORIC_RECORD: 0.40, PREDICTIVE_MODEL: 0.55, WATER_SAMPLING: 0.70, VISUAL_INSPECTION: 0.85, POTHOLE: 1.00 }
    precision: "tier_rank integer; confidence_weight exact 2-decimal constant"
    note: "The random `id` of an EvidenceItem is NEVER a ranking or tie-break input; `created_at DESC` is the final fallback."

  - name: service_line_classification
    trigger: "Every EvidenceItem insertion (manual, override, APPOINTMENT_CASCADE, REPLACEMENT_CASCADE), every EvidenceItem retraction, and every ServiceLine.certainty_basis flip"
    algorithm: constraint_propagation
    formula: |
      u = governing(line, UTILITY,  line.certainty_basis)
      c = governing(line, CUSTOMER, line.certainty_basis)
      utility_side_material  = u.observed_material if u else UNKNOWN
      customer_side_material = c.observed_material if c else UNKNOWN
      mats = [utility_side_material, customer_side_material]
      # Branch order is pinned — worst material wins, UNKNOWN outranks NON_LEAD.
      if   LEAD in mats: classification = LEAD
      elif GRR  in mats: classification = GRR
      elif UNKNOWN in mats: classification = UNKNOWN
      else: classification = NON_LEAD
      disadvantaged_status = line.census_tract_code in WaterSystem.disadvantaged_tract_codes
    input_set: "Governing evidence of both sides under the line's active certainty_basis; a side with no governing evidence contributes UNKNOWN."
    constants: {}
    precision: "enum, no rounding"

  - name: service_line_certainty_score
    trigger: "Every classification recompute (see service_line_classification trigger list); writes ServiceLine.certainty_score"
    algorithm: weighted_scoring
    formula: |
      def side_certainty(line, side, basis):
          g = governing(line, side, basis)
          if g is null: return 0.00
          if g.observed_material == UNKNOWN: return 0.00    # an UNKNOWN observation carries zero certainty
          return CONFIDENCE_WEIGHT[g.source_type]
      u = side_certainty(line, UTILITY,  line.certainty_basis)
      c = side_certainty(line, CUSTOMER, line.certainty_basis)
      certainty_score = round(100 * (0.60 * min(u, c) + 0.40 * max(u, c)), 2)
    input_set: "Exactly the two governing EvidenceItem rows selected under the active basis; all other evidence is ignored."
    constants:
      WEAK_SIDE_WEIGHT: 0.60
      STRONG_SIDE_WEIGHT: 0.40
    precision: "2 decimal places, round_half_up"
    variants:
      - name: RECORDS_BASIS
        when: "ServiceLine.inventory_state IN {UNCLASSIFIED, CLASSIFIED_PROVISIONAL}; also the basis an InventoryPublication with basis == RECORDS reports"
        difference: "Only HISTORIC_RECORD and PREDICTIVE_MODEL evidence may govern, so field observations of the same line are excluded from BOTH the material roll-up and the weight lookup. The identical evidence set therefore yields a lower certainty_score and can yield a different `classification` than the field variant."
      - name: FIELD_BASIS
        when: "ServiceLine.inventory_state == CLASSIFIED_VERIFIED; also the basis an InventoryPublication with basis == FIELD_VERIFIED reports"
        difference: "All five source types may govern, so a POTHOLE or VISUAL_INSPECTION observation outranks the records tier and supplies both the material and the (higher) weight."

  - name: replacement_priority_score
    trigger: "Every classification recompute, every ServiceLine.inventory_state transition, every ServiceLine.consent_barrier_flag change; writes ServiceLine.replacement_priority_score"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): five inputs, tiered selection, nested min/max, conditional branches,
      # and a floor that can override the penalty. STEP order is normative.
      STEP 1  material_points =
                 50.00                                        if classification == LEAD
                 35.00                                        if classification == GRR
                 round(40 * (1 - certainty_score / 100), 2)    if classification == UNKNOWN
                 0.00                                          if classification == NON_LEAD
      STEP 2  certainty_bonus  = 15.00 if inventory_state == CLASSIFIED_VERIFIED else 0.00
      STEP 3  equity_points    = 25.00 if disadvantaged_status == true else 0.00
      STEP 4  days_to_paving   = (StreetProject.paving_start_date - date(clock_now)) in whole days
              coordination_points =
                 0.00   if street_project_id == null or days_to_paving < 0
                 20.00  elif days_to_paving <= 90
                 12.00  elif days_to_paving <= 180
                 5.00   elif days_to_paving <= 365
                 0.00   else
      STEP 5  sensitive_points = 10.00 if serves_sensitive_population == true else 0.00
      STEP 6  raw       = material_points + certainty_bonus + equity_points + coordination_points + sensitive_points
      STEP 7  capped    = min(100.00, max(0.00, raw))
      STEP 8  barrier_penalty = 8.00 if consent_barrier_flag == true else 0.00
      STEP 9  penalized = round(capped - barrier_penalty, 2)
      STEP 10 equity_floor = 65.00 if (disadvantaged_status == true and classification IN {LEAD, GRR}) else 0.00
              # Reachable: a disadvantaged GRR line with no coordination and no sensitive population
              # scores 35 + 25 = 60.00 before the penalty, so the floor lifts it back to 65.00.
      STEP 11 replacement_priority_score = round(max(penalized, equity_floor), 2)
    input_set: "The line's own classification / certainty_score / inventory_state / disadvantaged_status / serves_sensitive_population / consent_barrier_flag plus the linked StreetProject.paving_start_date and the logical clock."
    constants:
      LEAD_POINTS: 50.00
      GRR_POINTS: 35.00
      UNKNOWN_BASE_POINTS: 40.00
      VERIFIED_BONUS: 15.00
      EQUITY_POINTS: 25.00
      SENSITIVE_POINTS: 10.00
      COORDINATION_TIERS: { "<=90": 20.00, "<=180": 12.00, "<=365": 5.00, "else": 0.00 }
      BARRIER_PENALTY: 8.00
      DISADVANTAGED_FLOOR: 65.00
      SCORE_CAP: 100.00
    precision: "2 decimal places, round_half_up; the cap is applied BEFORE the penalty and the floor AFTER it"

  - name: funding_apportionment
    trigger: "POST /lsl/replacement-orders/{id}/funding-plan (ReplacementOrder SCOPED → FUNDED)"
    algorithm: waterfall_allocation
    formula: |
      # Candidate pool — pinned eligibility filter, ranking and tie-break.
      candidates = [s for s in FundingSource
                    if s.water_system_id == line.water_system_id
                    and s.status == ACTIVE
                    and s.available_cents > 0]
      candidates.sort(key=(priority_rank ASC, created_at ASC))
      total = order.estimated_cost_cents
      if candidates is empty: raise ERR_FUNDING_INSUFFICIENT

      # ---- variant WATERFALL ----
      remaining = total
      rows = []
      for s in candidates:
          cap   = floor(total * s.max_share_pct / 100)        # FLOOR, computed on the ORDER TOTAL, per source
          alloc = min(remaining, s.available_cents, cap)      # nested min over three terms
          if alloc > 0: rows.append({funding_source_id: s.id, allocated_cents: alloc,
                                     priority_rank: s.priority_rank, state: COMMITTED})
          remaining -= alloc
      if remaining > 0: raise ERR_FUNDING_INSUFFICIENT

      # ---- variant PRO_RATA ----
      pool = sum(s.available_cents for s in candidates)
      if pool < total: raise ERR_FUNDING_INSUFFICIENT
      rows = []
      for s in candidates:                                    # already in (priority_rank ASC, created_at ASC) order
          share_exact  = total * s.available_cents / pool
          allocated    = round_half_up(share_exact)           # ROUND PER SOURCE FIRST — never sum-then-round
          rows.append({funding_source_id: s.id, allocated_cents: allocated,
                       priority_rank: s.priority_rank, state: COMMITTED})
      remainder = total - sum(r.allocated_cents for r in rows)   # reconcile AFTER per-source rounding
      rows[0].allocated_cents += remainder                       # rows[0] is the lowest priority_rank; remainder may be negative
      # max_share_pct is NOT applied in PRO_RATA.
    input_set: "ACTIVE FundingSource rows of the order's water system with available_cents > 0, in (priority_rank ASC, created_at ASC) order. SUSPENDED and CLOSED sources and sources with available_cents == 0 are excluded."
    constants:
      ROUNDING_ORDER: "round each source share to whole cents first, then push the whole-cent remainder onto the lowest priority_rank source"
      REJECTED_ALTERNATIVE: "summing exact shares and rounding the total once, or rounding a running cumulative share, are both explicitly NOT used"
    precision: "whole cents (integers); round_half_up on each per-source share"
    variants:
      - name: WATERFALL
        when: "WaterSystem.funding_mode == WATERFALL"
        difference: "Priority-ordered fill capped per source by floor(total * max_share_pct / 100); later sources may receive 0 and are then omitted from funding_allocations[] entirely."
        note: "Same order cost and same source pool as PRO_RATA yield a different number of rows and different per-source cents."
      - name: PRO_RATA
        when: "WaterSystem.funding_mode == PRO_RATA"
        difference: "Every candidate source receives a row proportional to its available_cents share of the pool, ignoring max_share_pct; the whole-cent remainder from per-source rounding lands on the lowest priority_rank source."

  - name: sampling_statistical_validation
    trigger: "POST /lsl/sampling-batches/{id}/validate"
    algorithm: threshold
    formula: |
      required_sample_count = max(5, ceil(stratum_line_count * SAMPLE_FRACTION))
      valid = [s for s in batch.samples if s.invalidated == false]
      valid.sort(key=(lead_ppb ASC, collected_at ASC))
      n = len(valid)
      if n < required_sample_count: raise ERR_SAMPLE_COUNT_INSUFFICIENT
      rank              = ceil(0.90 * n)                 # 1-based nearest-rank method
      percentile_90_ppb = valid[rank - 1].lead_ppb
      exceedance        = percentile_90_ppb > ACTION_LEVEL_PPB      # STRICTLY greater; exactly 15.0 is NOT an exceedance
      exceedance_count  = count(s in valid if s.lead_ppb > ACTION_LEVEL_PPB)
      classification_confidence = round(1 - exceedance_count / n, 4)
      state = VALIDATED if classification_confidence >= CONFIDENCE_FLOOR else REJECTED   # >= , so exactly 0.8000 validates
    input_set: "Embedded samples[] entries of this batch with invalidated == false. Invalidated samples are excluded from n, from the percentile rank and from exceedance_count."
    constants:
      SAMPLE_FRACTION: 0.05
      MIN_SAMPLE_COUNT: 5
      ACTION_LEVEL_PPB: 15.0
      PERCENTILE: 0.90
      CONFIDENCE_FLOOR: 0.8000
    precision: "percentile_90_ppb is the stored sample value verbatim (1 decimal); classification_confidence 4 decimal places, round_half_up"

  - name: post_replacement_flushing_guidance
    trigger: "POST /lsl/replacement-orders/{id}/complete (ReplacementOrder IN_PROGRESS → COMPLETED); writes ReplacementOrder.flushing_duration_minutes"
    algorithm: threshold
    formula: |
      STEP 1 radius_m           = line.interior_diameter_mm / 2000
      STEP 2 pipe_volume_liters = round(PI * radius_m^2 * line.total_length_m * 1000, 2)
      STEP 3 volume_minutes     = ceil(pipe_volume_liters * VOLUME_TURNOVERS / FLUSH_RATE_LPM)
      STEP 4 partial_penalty    = 15 if order.scope == PARTIAL else 0
      STEP 5 cct_multiplier     = 1.5 if WaterSystem.cct_optimization_status == PENDING_REOPTIMIZATION else 1.0
      STEP 6 flushing_duration_minutes = ceil((BASE_MINUTES + volume_minutes + partial_penalty) * cct_multiplier)
    input_set: "The replaced ServiceLine's geometry plus the order's scope plus the water system's corrosion-control posture at completion time."
    constants:
      PI: 3.141592653589793
      BASE_MINUTES: 30
      VOLUME_TURNOVERS: 3
      FLUSH_RATE_LPM: 20.0
      PARTIAL_PENALTY_MINUTES: 15
      REOPTIMIZATION_MULTIPLIER: 1.5
    precision: "pipe_volume_liters 2 decimal places round_half_up; volume_minutes and flushing_duration_minutes are whole minutes via ceil"

  - name: compliance_credit
    trigger: "POST /lsl/progress-reports"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (c): a circular-looking dependency. `total_credit` needs
      # `equity_multiplier`, whose tier LOOKS like it should key off `total_credit`; and
      # `deferral_allowance` DOES key off `total_credit`, which then feeds `shortfall_credit`.
      # The evaluation order below is normative and makes every value well-defined.
      STEP 1 base_credit = full_replacement_count + round(0.5 * partial_replacement_count, 2)
      STEP 2 disadvantaged_share_pct = round(100 * disadvantaged_full_count / max(1, full_replacement_count), 2)
             equity_tier / equity_multiplier are keyed on disadvantaged_share_pct ONLY — never on base_credit
             and never on total_credit:
                disadvantaged_share_pct >= 60.00 -> TIER_A, 1.20
                disadvantaged_share_pct >= 40.00 -> TIER_B, 1.10
                disadvantaged_share_pct >= 20.00 -> TIER_C, 1.00
                else                             -> TIER_D, 0.90
      STEP 3 total_credit = round(base_credit * equity_multiplier, 2)
      STEP 4 mandated_annual_credit = ceil(WaterSystem.baseline_lead_and_grr_count * MANDATED_RATE)
      STEP 5 deferral_allowance keyed on the STEP-3 total_credit:
                total_credit >= 20 -> 3
                total_credit >= 10 -> 2
                else               -> 1
      STEP 6 shortfall_credit = round(max(0, mandated_annual_credit - deferral_allowance - total_credit), 2)
             compliance_status = ON_TRACK if shortfall_credit == 0 else BEHIND
             # STEP 5 is evaluated exactly once, against the STEP-3 total_credit. It is NOT re-derived
             # from (total_credit + deferral_allowance) nor from shortfall_credit.
    input_set: "ReplacementOrder rows of the water system with fulfillment_state == COMPLETED whose completed_at calendar date is within [period_start_date, period_end_date] inclusive, partitioned by scope; disadvantaged_full_count is the FULL subset whose ServiceLine.disadvantaged_status == true. CANCELLED and IN_PROGRESS orders are excluded."
    constants:
      PARTIAL_CREDIT_WEIGHT: 0.5
      MANDATED_RATE: 0.10
      EQUITY_TIERS: { TIER_A: 1.20, TIER_B: 1.10, TIER_C: 1.00, TIER_D: 0.90 }
      DEFERRAL_TIERS: { ">=20": 3, ">=10": 2, "else": 1 }
    precision: "2 decimal places, round_half_up on base_credit, disadvantaged_share_pct, total_credit and shortfall_credit; mandated_annual_credit and deferral_allowance are integers"

  - name: inventory_progress_rate
    trigger: "POST /lsl/progress-reports; writes ProgressReport.replaced_count, baseline_denominator, replacement_progress_pct"
    algorithm: aggregation
    formula: |
      replaced_count = count(ServiceLine where water_system_id == report.water_system_id
                                          and replacement_state IN {REPLACED_FULL, REPLACED_PARTIAL})
      baseline_denominator = WaterSystem.lead_count + WaterSystem.grr_count
                           + WaterSystem.unknown_count + replaced_count
      replacement_progress_pct = 100.00 if baseline_denominator == 0
                                 else round(100 * replaced_count / baseline_denominator, 2)
    input_set: "All ServiceLine rows of the water system, evaluated at report creation time (no time window); NON_LEAD lines that were never replaced contribute to neither numerator nor denominator."
    constants: {}
    precision: "2 decimal places, round_half_up; the empty-universe case (baseline_denominator == 0) is defined as exactly 100.00, never a division by zero"

  - name: program_posture
    trigger: "Recomputed at the end of every WaterSystem counter refresh, every FundingSource ledger refresh, every CustomerNotification state change, every WaterSystem.inventory_status transition and every POST /lsl/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      # First matching STEP wins; evaluation order is normative.
      STEP 1 if inventory_status == DRAFT: return FROZEN
      STEP 2 if unknown_count > 0 and date(clock_now) > compliance_deadline_date: return FROZEN
      STEP 3 if inventory_status == AMENDMENT_PENDING: return RESTRICTED
      STEP 4 if outstanding_notification_count > 0: return RESTRICTED
      STEP 5 if exists FundingSource(water_system_id == this.id, status == ACTIVE, equity_shortfall_cents > 0): return RESTRICTED
      STEP 6 if unknown_share_pct > 10.00: return RESTRICTED      # strictly greater; exactly 10.00 does not restrict
      STEP 7 return OPEN
    input_set: "The water system's own inventory_status / unknown_count / unknown_share_pct / outstanding_notification_count / compliance_deadline_date plus its ACTIVE FundingSource rows plus the logical clock."
    constants:
      UNKNOWN_SHARE_RESTRICT_PCT: 10.00
    precision: "enum, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number checked first)
# =============================================================================
validations:
  - { priority: 10, category: auth,                  check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 20, category: auth,                  check: "The acting role appears in the called endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 30, category: business_constraint,   check: "Every non-optional field of the endpoint's input schema is present and of the declared type", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 32, category: business_constraint,   check: "Every enum-typed input value is a member of that field's declared constraint set", error_id: ERR_INVALID_ENUM_VALUE, http_status: 422, applies_to: "all write endpoints carrying enum inputs" }
  - { priority: 34, category: business_temporal,     check: "Interval inputs are coherent: window_end_utc > window_start_utc; excavation_end_date >= excavation_start_date; moratorium_end_date >= moratorium_start_date; period_end_date >= period_start_date; shift_end_utc_time > shift_start_utc_time", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: "POST /lsl/verification-appointments, POST /lsl/verification-appointments/{id}/reschedule, POST /lsl/replacement-orders, POST /lsl/replacement-orders/{id}/schedule, POST /lsl/street-projects, POST /lsl/progress-reports, POST /lsl/verification-crews" }
  - { priority: 36, category: business_constraint,   check: "limit is an integer in [1,100] and offset is an integer >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "all list endpoints" }
  - { priority: 40, category: existence,             check: "Every {id} path segment resolves to a live row, validated left-to-right", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 42, category: existence,             check: "Every foreign-key field in the request body resolves to a live row, validated in the order the fields appear in the endpoint's input list", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: "all write endpoints carrying FK inputs" }
  - { priority: 45, category: auth,                  check: "When the acting role is FieldTechnician, X-User-ID equals the target VerificationAppointment.crew_id", error_id: ERR_CREW_IDENTITY_MISMATCH, http_status: 403, applies_to: "POST /lsl/verification-appointments/{id}/arrive, POST /lsl/verification-appointments/{id}/complete, POST /lsl/verification-appointments/{id}/no-access" }
  - { priority: 48, category: auth,                  check: "The certifying ComplianceOfficer's X-User-ID differs from InventoryPublication.drafted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /lsl/inventory-publications/{id}/certify" }
  - { priority: 50, category: state,                 check: "expected_water_system_version equals the live WaterSystem.version", error_id: ERR_STALE_WATER_SYSTEM_VERSION, http_status: 412, applies_to: "POST /lsl/inventory-publications" }
  - { priority: 50, category: state,                 check: "expected_service_line_version equals the live ServiceLine.version", error_id: ERR_STALE_SERVICE_LINE_VERSION, http_status: 412, applies_to: "POST /lsl/service-lines/{id}/classification-overrides" }
  - { priority: 52, category: business_referential,  check: "ReplacementOrder.consent_state IN {GRANTED, DENIED, NO_RESPONSE} and ReplacementOrder.scope != null — the consent canvass must be resolved before any funding is assembled, and this referential check deliberately runs BEFORE the priority-55 fulfillment-state check so that an order still sitting in DRAFT is told why (consent) rather than merely that its state is wrong", error_id: ERR_CONSENT_NOT_RESOLVED, http_status: 409, applies_to: "POST /lsl/replacement-orders/{id}/funding-plan" }
  - { priority: 55, category: state,                 check: "WaterSystem.inventory_status permits the requested advance-inventory-status target", error_id: ERR_INVENTORY_STATE_INVALID, http_status: 409, applies_to: "POST /lsl/water-systems/{id}/advance-inventory-status" }
  - { priority: 55, category: state,                 check: "VerificationAppointment.state is the declared `from:` state of the requested transition", error_id: ERR_APPOINTMENT_STATE_INVALID, http_status: 409, applies_to: "POST /lsl/verification-appointments/{id}/arrive, .../complete, .../no-access, .../reschedule" }
  - { priority: 55, category: state,                 check: "SamplingBatch.state is the declared `from:` state of the requested transition (OPEN for samples/validate, REJECTED for reopen)", error_id: ERR_BATCH_STATE_INVALID, http_status: 409, applies_to: "POST /lsl/sampling-batches/{id}/samples, .../invalidate-sample, .../validate, .../reopen" }
  - { priority: 55, category: state,                 check: "InventoryPublication.state is the declared `from:` state of the requested transition", error_id: ERR_PUBLICATION_STATE_INVALID, http_status: 409, applies_to: "POST /lsl/inventory-publications/{id}/certify, POST /lsl/inventory-publications/{id}/publish" }
  - { priority: 55, category: state,                 check: "CustomerNotification.state is the declared `from:` state of the requested transition", error_id: ERR_NOTIFICATION_STATE_INVALID, http_status: 409, applies_to: "POST /lsl/customer-notifications/{id}/deliver, .../acknowledge, .../return" }
  - { priority: 55, category: state,                 check: "ReplacementOrder.fulfillment_state and consent_state are the declared `from:` states of the requested transition on their respective axis", error_id: ERR_ORDER_STATE_INVALID, http_status: 409, applies_to: "POST /lsl/replacement-orders/{id}/consent-request, .../consent-response, .../funding-plan, .../schedule, .../start, .../complete, .../cancel" }
  - { priority: 56, category: state,                 check: "The target ServiceLine.replacement_state is ELIGIBLE or REPLACED_PARTIAL", error_id: ERR_LINE_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /lsl/replacement-orders" }
  - { priority: 57, category: state,                 check: "The target EvidenceItem.retracted is false", error_id: ERR_EVIDENCE_ALREADY_RETRACTED, http_status: 409, applies_to: "POST /lsl/evidence-items/{id}/retract" }
  - { priority: 58, category: business_safety,       check: "WaterSystem.program_posture != FROZEN", error_id: ERR_PROGRAM_POSTURE_FROZEN, http_status: 409, applies_to: "POST /lsl/replacement-orders, POST /lsl/replacement-orders/{id}/funding-plan, POST /lsl/inventory-publications" }
  - { priority: 59, category: business_safety,       check: "WaterSystem.program_posture == OPEN", error_id: ERR_PROGRAM_POSTURE_RESTRICTED, http_status: 409, applies_to: "POST /lsl/replacement-orders/{id}/schedule" }
  - { priority: 60, category: business_referential,  check: "WaterSystem.inventory_status IN {PUBLISHED, AMENDMENT_PENDING} — a replacement order cannot precede inventory publication", error_id: ERR_INVENTORY_NOT_PUBLISHED, http_status: 409, applies_to: "POST /lsl/replacement-orders" }
  - { priority: 60, category: business_referential,  check: "At least one SamplingBatch exists for the water system and every one of them has state == VALIDATED", error_id: ERR_UNVALIDATED_SAMPLING_STRATUM, http_status: 409, applies_to: "POST /lsl/inventory-publications/{id}/certify" }
  - { priority: 60, category: business_referential,  check: "VerificationCrew.{appointment.crew_id}.status == ACTIVE", error_id: ERR_CREW_INACTIVE, http_status: 409, applies_to: "POST /lsl/verification-appointments/{id}/arrive" }
  - { priority: 60, category: business_referential,  check: "InventoryPublication.notifiable_line_count still equals the live count of ServiceLine rows of this water system with classification IN {LEAD, GRR, UNKNOWN}", error_id: ERR_PINNED_SNAPSHOT_STALE, http_status: 409, applies_to: "POST /lsl/inventory-publications/{id}/publish" }
  - { priority: 65, category: business_safety,       check: "WaterSystem.cct_optimization_status != PENDING_REOPTIMIZATION — excavation may not proceed while corrosion control is being re-optimized", error_id: ERR_CCT_NOT_OPTIMIZED, http_status: 422, applies_to: "POST /lsl/replacement-orders/{id}/schedule" }
  - { priority: 65, category: business_safety,       check: "No CustomerNotification of this water system has overdue == true", error_id: ERR_NOTIFICATION_OVERDUE_BLOCK, http_status: 409, applies_to: "POST /lsl/inventory-publications/{id}/certify" }
  - { priority: 70, category: business_constraint,   check: "pwsid is unique across WaterSystem", error_id: ERR_DUPLICATE_PWSID, http_status: 409, applies_to: "POST /lsl/water-systems" }
  - { priority: 70, category: business_constraint,   check: "(water_system_id, address_label) is unique across ServiceLine", error_id: ERR_DUPLICATE_ADDRESS_LABEL, http_status: 409, applies_to: "POST /lsl/service-lines" }
  - { priority: 70, category: business_constraint,   check: "(water_system_id, stratum_code) is unique across SamplingBatch", error_id: ERR_DUPLICATE_STRATUM_CODE, http_status: 409, applies_to: "POST /lsl/sampling-batches" }
  - { priority: 70, category: business_constraint,   check: "appointment.method is a member of VerificationCrew.certified_methods", error_id: ERR_CREW_METHOD_NOT_CERTIFIED, http_status: 422, applies_to: "POST /lsl/verification-appointments" }
  - { priority: 70, category: business_constraint,   check: "The window's UTC clock times sit inside [shift_start_utc_time, shift_end_utc_time] on a single UTC calendar date", error_id: ERR_CREW_OUTSIDE_SHIFT, http_status: 422, applies_to: "POST /lsl/verification-appointments, POST /lsl/verification-appointments/{id}/reschedule" }
  - { priority: 70, category: business_constraint,   check: "EvidenceItem.side matches the side the appointment recorded (observed_side) when the item is synthesized by a completion cascade, and a WATER_SAMPLING source_type may only carry side == UTILITY", error_id: ERR_EVIDENCE_SIDE_MISMATCH, http_status: 422, applies_to: "POST /lsl/evidence-items, POST /lsl/verification-appointments/{id}/complete" }
  - { priority: 70, category: business_constraint,   check: "replaced_sides equals [UTILITY, CUSTOMER] when scope == FULL and [UTILITY] when scope == PARTIAL", error_id: ERR_REPLACED_SIDES_MISMATCH, http_status: 422, applies_to: "POST /lsl/replacement-orders/{id}/complete" }
  - { priority: 70, category: business_constraint,   check: "valid_sample_count >= required_sample_count per calculations.sampling_statistical_validation", error_id: ERR_SAMPLE_COUNT_INSUFFICIENT, http_status: 422, applies_to: "POST /lsl/sampling-batches/{id}/validate" }
  - { priority: 70, category: existence,             check: "sample_seq resolves to an entry of SamplingBatch.samples", error_id: ERR_SAMPLE_NOT_FOUND, http_status: 404, applies_to: "POST /lsl/sampling-batches/{id}/invalidate-sample" }
  - { priority: 75, category: business_temporal,     check: "Half-open crew occupation with travel buffer — reject when new.window_start_utc < existing.window_end_utc + 45 minutes AND new.window_end_utc > existing.window_start_utc, over VerificationAppointment rows of the same crew_id with state IN {SCHEDULED, ON_SITE, COMPLETED}", error_id: ERR_CREW_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /lsl/verification-appointments, POST /lsl/verification-appointments/{id}/reschedule" }
  - { priority: 75, category: business_temporal,     check: "Closed inclusive date overlap against the linked StreetProject moratorium — reject when excavation_start_date <= moratorium_end_date AND excavation_end_date >= moratorium_start_date", error_id: ERR_MORATORIUM_CONFLICT, http_status: 409, applies_to: "POST /lsl/replacement-orders/{id}/schedule" }
  - { priority: 75, category: business_temporal,     check: "date(clock_now) <= WaterSystem.compliance_deadline_date", error_id: ERR_COMPLIANCE_DEADLINE_PASSED, http_status: 409, applies_to: "POST /lsl/inventory-publications/{id}/certify" }
  - { priority: 75, category: business_temporal,     check: "[period_start_date, period_end_date] does not overlap any existing ProgressReport of the same water system (closed inclusive comparison)", error_id: ERR_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /lsl/progress-reports" }
  - { priority: 75, category: business_temporal,     check: "to_iso8601 is greater than or equal to the current logical clock value", error_id: ERR_CLOCK_NOT_MONOTONIC, http_status: 422, applies_to: "POST /lsl/_clock/set_current_utc" }
  - { priority: 78, category: business_constraint,   check: "The count of VerificationAppointment rows of the same crew_id with state IN {SCHEDULED, ON_SITE, COMPLETED} whose window_start_utc falls on the requested UTC calendar date is strictly less than VerificationCrew.daily_appointment_capacity", error_id: ERR_CREW_DAILY_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /lsl/verification-appointments, POST /lsl/verification-appointments/{id}/reschedule" }
  - { priority: 78, category: business_constraint,   check: "For every calendar date in the requested closed excavation window, the count of other ReplacementOrder rows of the same street_project_id with fulfillment_state IN {SCHEDULED, IN_PROGRESS} whose closed excavation window includes that date is strictly less than StreetProject.max_concurrent_excavations", error_id: ERR_EXCAVATION_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /lsl/replacement-orders/{id}/schedule" }
  - { priority: 85, category: business_fiscal,       check: "No ACTIVE FundingSource of the water system would finish the commit with equity_shortfall_cents > 0", error_id: ERR_EQUITY_REQUIREMENT_BREACH, http_status: 422, applies_to: "POST /lsl/replacement-orders/{id}/funding-plan" }
  - { priority: 90, category: business_fiscal,       check: "calculations.funding_apportionment covers estimated_cost_cents in full from the ACTIVE candidate pool", error_id: ERR_FUNDING_INSUFFICIENT, http_status: 402, applies_to: "POST /lsl/replacement-orders/{id}/funding-plan" }

# =============================================================================
# §1.5 API Endpoint Table   (flat topology — every collection sits directly under /lsl)
# =============================================================================
endpoints:

  # ------------------------------------------------------------- WaterSystem
  - { method: POST, path: "/lsl/water-systems", description: "Register a public water system", roles: [ProgramAdministrator], code: 201, input: [pwsid, system_name, compliance_deadline_date, "baseline_lead_and_grr_count?", "disadvantaged_tract_codes?", "funding_mode?", "cct_optimization_status?", "cct_orthophosphate_mg_l?", "cct_target_ph?"], output: WaterSystem, side_effects: ["inventory_status = DRAFT", "program_posture computed to FROZEN via calculations.program_posture STEP 1"] }
  - { method: GET, path: "/lsl/water-systems", description: "List water systems", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician, CustomerRepresentative, ReplacementContractor], code: 200, input: ["inventory_status?", "program_posture?", "limit?", "offset?"], output: "WaterSystem[]", side_effects: [] }
  - { method: GET, path: "/lsl/water-systems/{id}", description: "Read one water system with its live counters and posture", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician, CustomerRepresentative, ReplacementContractor], code: 200, input: [], output: WaterSystem, side_effects: [] }
  - { method: POST, path: "/lsl/water-systems/{id}/advance-inventory-status", description: "Advance the system inventory lifecycle out of DRAFT", roles: [ComplianceOfficer], code: 200, input: [target_status], output: WaterSystem, side_effects: ["recompute program_posture", "increments WaterSystem.version by 1"] }
  - { method: PATCH, path: "/lsl/water-systems/{id}/funding-policy", description: "Switch the system's funding assembly mode between the priority waterfall and pro-rata apportionment; applies only to funding plans committed after this call, already-committed funding_allocations[] rows are untouched", roles: [ProgramAdministrator], code: 200, input: [funding_mode], output: WaterSystem, side_effects: ["selects the variant calculations.funding_apportionment applies on the next POST /lsl/replacement-orders/{id}/funding-plan", "increments WaterSystem.version by 1"] }
  - { method: PATCH, path: "/lsl/water-systems/{id}/corrosion-control", description: "Update corrosion control treatment optimization posture and targets", roles: [ComplianceOfficer], code: 200, input: [cct_optimization_status, "cct_orthophosphate_mg_l?", "cct_target_ph?"], output: WaterSystem, side_effects: ["recompute program_posture", "changes the cct_multiplier of calculations.post_replacement_flushing_guidance for later completions", "increments WaterSystem.version by 1"] }

  # ------------------------------------------------------------- ServiceLine
  - { method: POST, path: "/lsl/service-lines", description: "Add a service line to the inventory", roles: [InventoryAnalyst], code: 201, input: [water_system_id, address_label, census_tract_code, "street_project_id?", "serves_sensitive_population?", "interior_diameter_mm?", "total_length_m?"], output: ServiceLine, side_effects: ["inventory_state = UNCLASSIFIED, replacement_state = NOT_REQUIRED", "recompute WaterSystem.total_service_line_count, unknown_share_pct and program_posture"] }
  - { method: GET, path: "/lsl/service-lines", description: "List service lines, filterable by parent water system, street project and derived classification", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician, CustomerRepresentative, ReplacementContractor], code: 200, input: ["water_system_id?", "street_project_id?", "classification?", "inventory_state?", "replacement_state?", "disadvantaged_status?", "limit?", "offset?"], output: "ServiceLine[]", side_effects: [] }
  - { method: GET, path: "/lsl/service-lines/{id}", description: "Read one service line with its computed classification, certainty and priority", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician, CustomerRepresentative, ReplacementContractor], code: 200, input: [], output: ServiceLine, side_effects: [] }
  - { method: POST, path: "/lsl/service-lines/{id}/classification-overrides", description: "Analyst override asserting a definitive material for one side; inserts a POTHOLE-tier EvidenceItem and supersedes the prior governing evidence on that side", roles: [InventoryAnalyst], code: 200, input: [expected_service_line_version, side, asserted_material, justification], output: ServiceLine, side_effects: ["creates an EvidenceItem with source_type = POTHOLE, origin = MANUAL, observed_at = logical clock now", "recompute classification, certainty_score, replacement_priority_score", "may fire ServiceLine.inventory_state UNCLASSIFIED → CLASSIFIED_PROVISIONAL or CLASSIFIED_PROVISIONAL → CLASSIFIED_VERIFIED", "bubble up WaterSystem counters then program_posture", "increments ServiceLine.version by 1"] }

  # ------------------------------------------------------------ EvidenceItem
  - { method: POST, path: "/lsl/evidence-items", description: "Record records-based, predictive-model or field evidence for one side of a service line", roles: [InventoryAnalyst, FieldTechnician], code: 201, input: [service_line_id, source_type, side, observed_material, observed_at, "notes?"], output: EvidenceItem, side_effects: ["recompute the line's governing evidence, classification, certainty_score and replacement_priority_score", "may fire ServiceLine.inventory_state transitions", "bubble up WaterSystem counters then program_posture", "increments ServiceLine.version by 1"] }
  - { method: GET, path: "/lsl/evidence-items", description: "List evidence items, filterable by service line and provenance", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: ["service_line_id?", "source_type?", "side?", "retracted?", "origin?", "limit?", "offset?"], output: "EvidenceItem[]", side_effects: [] }
  - { method: GET, path: "/lsl/evidence-items/{id}", description: "Read one evidence item", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: [], output: EvidenceItem, side_effects: [] }
  - { method: POST, path: "/lsl/evidence-items/{id}/retract", description: "Retract an evidence item so it stops governing the line's classification", roles: [InventoryAnalyst], code: 200, input: [reason], output: EvidenceItem, side_effects: ["set retracted = true and retraction_reason", "recompute the line's classification and certainty_score", "may fire ServiceLine.inventory_state CLASSIFIED_VERIFIED → CLASSIFIED_PROVISIONAL", "bubble up WaterSystem counters then program_posture", "increments EvidenceItem.version by 1"] }

  # -------------------------------------------------------- VerificationCrew
  - { method: POST, path: "/lsl/verification-crews", description: "Register a field verification crew with its shift and certified methods", roles: [ProgramAdministrator], code: 201, input: [water_system_id, crew_name, shift_start_utc_time, shift_end_utc_time, daily_appointment_capacity, certified_methods], output: VerificationCrew, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/lsl/verification-crews", description: "List verification crews", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: ["water_system_id?", "status?", "limit?", "offset?"], output: "VerificationCrew[]", side_effects: [] }
  - { method: GET, path: "/lsl/verification-crews/{id}", description: "Read one verification crew", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: [], output: VerificationCrew, side_effects: [] }
  - { method: POST, path: "/lsl/verification-crews/{id}/status", description: "Activate or deactivate a crew", roles: [ProgramAdministrator], code: 200, input: [status], output: VerificationCrew, side_effects: ["INACTIVE crews cause POST /lsl/verification-appointments/{id}/arrive to fail ERR_CREW_INACTIVE", "increments VerificationCrew.version by 1"] }

  # -------------------------------------------------- VerificationAppointment
  - { method: POST, path: "/lsl/verification-appointments", description: "Book a crew window to verify a service line by visual inspection, potholing or water sampling", roles: [ProgramAdministrator, FieldTechnician], code: 201, input: [service_line_id, crew_id, method, window_start_utc, window_end_utc], output: VerificationAppointment, side_effects: ["state = SCHEDULED, attempt_count = 1", "recompute VerificationCrew.scheduled_appointment_count"] }
  - { method: GET, path: "/lsl/verification-appointments", description: "List verification appointments, filterable by crew and service line", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: ["crew_id?", "service_line_id?", "state?", "method?", "limit?", "offset?"], output: "VerificationAppointment[]", side_effects: [] }
  - { method: GET, path: "/lsl/verification-appointments/{id}", description: "Read one verification appointment", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: [], output: VerificationAppointment, side_effects: [] }
  - { method: POST, path: "/lsl/verification-appointments/{id}/arrive", description: "Crew arrives on site", roles: [FieldTechnician], code: 200, input: [], output: VerificationAppointment, side_effects: ["state SCHEDULED → ON_SITE", "increments VerificationAppointment.version by 1"] }
  - { method: POST, path: "/lsl/verification-appointments/{id}/complete", description: "Record the verified material and close the appointment", roles: [FieldTechnician], code: 200, input: [observed_side, observed_material], output: VerificationAppointment, side_effects: ["LINK 1 create EvidenceItem (origin APPOINTMENT_CASCADE)", "LINK 2 ServiceLine classification / certainty / priority recompute and possible CLASSIFIED_PROVISIONAL → CLASSIFIED_VERIFIED", "LINK 3 WaterSystem counter bubble-up and program_posture recompute", "LINK 4 WaterSystem PUBLISHED → AMENDMENT_PENDING when the classification changed", "recompute VerificationCrew.scheduled_appointment_count", "increments VerificationAppointment.version by 1"] }
  - { method: POST, path: "/lsl/verification-appointments/{id}/no-access", description: "Record an access barrier; parks the appointment at NO_ACCESS, or terminates it at ABANDONED on the third attempt", roles: [FieldTechnician], code: 200, input: [barrier_reason], output: VerificationAppointment, side_effects: ["state ON_SITE → NO_ACCESS when attempt_count < 3, else ON_SITE → ABANDONED", "recompute VerificationCrew.scheduled_appointment_count", "increments VerificationAppointment.version by 1"] }
  - { method: POST, path: "/lsl/verification-appointments/{id}/reschedule", description: "Re-book a NO_ACCESS appointment into a new crew window", roles: [ProgramAdministrator], code: 200, input: [window_start_utc, window_end_utc], output: VerificationAppointment, side_effects: ["state NO_ACCESS → SCHEDULED", "attempt_count += 1", "re-runs the crew shift, overlap-with-buffer and daily-capacity checks", "increments VerificationAppointment.version by 1"] }

  # ------------------------------------------------------------ SamplingBatch
  - { method: POST, path: "/lsl/sampling-batches", description: "Open a sampling batch for one statistical stratum", roles: [ComplianceOfficer], code: 201, input: [water_system_id, stratum_code, stratum_line_count], output: SamplingBatch, side_effects: ["state = OPEN", "required_sample_count computed as max(5, ceil(stratum_line_count * 0.05))"] }
  - { method: GET, path: "/lsl/sampling-batches", description: "List sampling batches", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: ["water_system_id?", "state?", "limit?", "offset?"], output: "SamplingBatch[]", side_effects: [] }
  - { method: GET, path: "/lsl/sampling-batches/{id}", description: "Read one sampling batch with its embedded samples and statistics", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, FieldTechnician], code: 200, input: [], output: SamplingBatch, side_effects: [] }
  - { method: POST, path: "/lsl/sampling-batches/{id}/samples", description: "Append one first-draw or fifth-litre sample result to an OPEN batch", roles: [FieldTechnician, ComplianceOfficer], code: 200, input: [service_line_id, lead_ppb, collected_at, sample_type], output: SamplingBatch, side_effects: ["append a samples[] entry with the next sample_seq and invalidated = false", "recompute valid_sample_count", "increments SamplingBatch.version by 1"] }
  - { method: POST, path: "/lsl/sampling-batches/{id}/invalidate-sample", description: "Void one sample so it leaves the statistical population", roles: [ComplianceOfficer], code: 200, input: [sample_seq, reason], output: SamplingBatch, side_effects: ["set that entry's invalidated = true and invalidation_reason", "recompute valid_sample_count", "increments SamplingBatch.version by 1"] }
  - { method: POST, path: "/lsl/sampling-batches/{id}/validate", description: "Run the statistical validation and resolve the batch to VALIDATED or REJECTED", roles: [ComplianceOfficer], code: 200, input: [], output: SamplingBatch, side_effects: ["persist percentile_90_ppb, exceedance_count, exceedance, classification_confidence per calculations.sampling_statistical_validation", "state → VALIDATED or REJECTED", "on the VALIDATED branch only, and only when exceedance == true, WaterSystem.cct_optimization_status → PENDING_REOPTIMIZATION; the REJECTED branch carries no corrosion-control side effect", "increments SamplingBatch.version by 1"] }
  - { method: POST, path: "/lsl/sampling-batches/{id}/reopen", description: "Reopen a REJECTED batch for another resample round", roles: [ComplianceOfficer], code: 200, input: [reason], output: SamplingBatch, side_effects: ["state REJECTED → OPEN", "reopen_count += 1", "clear percentile_90_ppb, classification_confidence, rejection_reason, exceedance", "increments SamplingBatch.version by 1"] }

  # ------------------------------------------------------ InventoryPublication
  - { method: POST, path: "/lsl/inventory-publications", description: "Draft an inventory publication for a reporting period; OCC-guarded on the water system version because the new draft supersedes any prior draft", roles: [InventoryAnalyst], code: 201, input: [water_system_id, basis, reporting_period_label, expected_water_system_version], output: InventoryPublication, side_effects: ["state = DRAFT, drafted_by_user_id = X-User-ID", "any prior DRAFT publication of this water system is discarded", "increments WaterSystem.version by 1"] }
  - { method: GET, path: "/lsl/inventory-publications", description: "List inventory publications", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, CustomerRepresentative], code: 200, input: ["water_system_id?", "state?", "basis?", "limit?", "offset?"], output: "InventoryPublication[]", side_effects: [] }
  - { method: GET, path: "/lsl/inventory-publications/{id}", description: "Read one inventory publication with its pinned counts", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, CustomerRepresentative], code: 200, input: [], output: InventoryPublication, side_effects: [] }
  - { method: POST, path: "/lsl/inventory-publications/{id}/certify", description: "Certify a drafted inventory; version-pins the counts. The drafting analyst may not certify", roles: [ComplianceOfficer], code: 200, input: [], output: InventoryPublication, side_effects: ["state DRAFT → CERTIFIED", "certified_by_user_id = X-User-ID", "pin pinned_lead_count / pinned_grr_count / pinned_unknown_count / pinned_non_lead_count and notifiable_line_count", "increments InventoryPublication.version by 1"] }
  - { method: POST, path: "/lsl/inventory-publications/{id}/publish", description: "Publish the certified inventory and fan out customer notifications for lead, GRR and unknown lines", roles: [ComplianceOfficer], code: 200, input: [], output: InventoryPublication, side_effects: ["state CERTIFIED → PUBLISHED, published_at and notification_due_at stamped", "LINK 1 create one PENDING CustomerNotification per LEAD/GRR/UNKNOWN line", "LINK 2 recompute WaterSystem.outstanding_notification_count", "LINK 3 recompute WaterSystem.program_posture → RESTRICTED", "WaterSystem.inventory_status → PUBLISHED", "prior PUBLISHED publication → SUPERSEDED", "increments InventoryPublication.version by 1"] }

  # ------------------------------------------------------ CustomerNotification
  - { method: GET, path: "/lsl/customer-notifications", description: "List customer notifications, filterable by service line and publication", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, CustomerRepresentative], code: 200, input: ["service_line_id?", "inventory_publication_id?", "state?", "overdue?", "limit?", "offset?"], output: "CustomerNotification[]", side_effects: [] }
  - { method: GET, path: "/lsl/customer-notifications/{id}", description: "Read one customer notification", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, CustomerRepresentative], code: 200, input: [], output: CustomerNotification, side_effects: [] }
  - { method: POST, path: "/lsl/customer-notifications/{id}/deliver", description: "Record a delivery attempt that reached the customer; valid from PENDING and from RETURNED", roles: [CustomerRepresentative], code: 200, input: [delivery_channel, delivered_at], output: CustomerNotification, side_effects: ["state → DELIVERED, delivery_attempt_count += 1, return_reason cleared", "recompute WaterSystem.outstanding_notification_count then program_posture", "increments CustomerNotification.version by 1"] }
  - { method: POST, path: "/lsl/customer-notifications/{id}/acknowledge", description: "Record the customer's acknowledgement", roles: [CustomerRepresentative], code: 200, input: [acknowledged_at], output: CustomerNotification, side_effects: ["state DELIVERED → ACKNOWLEDGED", "increments CustomerNotification.version by 1"] }
  - { method: POST, path: "/lsl/customer-notifications/{id}/return", description: "Record the notification as undeliverable, returning it to the outstanding set", roles: [CustomerRepresentative], code: 200, input: [return_reason], output: CustomerNotification, side_effects: ["state DELIVERED → RETURNED, delivered_at cleared", "recompute WaterSystem.outstanding_notification_count then program_posture → RESTRICTED", "increments CustomerNotification.version by 1"] }

  # --------------------------------------------------------- ReplacementOrder
  - { method: POST, path: "/lsl/replacement-orders", description: "Open a replacement order against an eligible service line", roles: [ProgramAdministrator], code: 201, input: [service_line_id, estimated_cost_cents, excavation_start_date, excavation_end_date, "street_project_id?"], output: ReplacementOrder, side_effects: ["fulfillment_state = DRAFT, consent_state = NOT_REQUESTED", "ServiceLine.replacement_state → IN_PROGRAM", "increments ServiceLine.version by 1"] }
  - { method: GET, path: "/lsl/replacement-orders", description: "List replacement orders, filterable by service line and street project", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, CustomerRepresentative, ReplacementContractor], code: 200, input: ["service_line_id?", "street_project_id?", "fulfillment_state?", "consent_state?", "scope?", "limit?", "offset?"], output: "ReplacementOrder[]", side_effects: [] }
  - { method: GET, path: "/lsl/replacement-orders/{id}", description: "Read one replacement order with its funding allocations and flushing guidance", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, CustomerRepresentative, ReplacementContractor], code: 200, input: [], output: ReplacementOrder, side_effects: [] }
  - { method: POST, path: "/lsl/replacement-orders/{id}/consent-request", description: "Request customer consent for the customer-side portion; also re-canvasses a NO_RESPONSE order", roles: [CustomerRepresentative], code: 200, input: [], output: ReplacementOrder, side_effects: ["consent_state NOT_REQUESTED → REQUESTED, or NO_RESPONSE → REQUESTED with fulfillment_state SCOPED → DRAFT, scope cleared and ServiceLine.consent_barrier_flag → false", "increments ReplacementOrder.version by 1"] }
  - { method: POST, path: "/lsl/replacement-orders/{id}/consent-response", description: "Record the consent outcome; the fork that selects FULL or PARTIAL scope", roles: [CustomerRepresentative], code: 200, input: [outcome, "barrier_reason?"], output: ReplacementOrder, side_effects: ["fulfillment_state DRAFT → SCOPED", "FULL branch on GRANTED; PARTIAL branch on DENIED/NO_RESPONSE which sets ServiceLine.consent_barrier_flag → true and recomputes replacement_priority_score", "increments ReplacementOrder.version by 1"] }
  - { method: POST, path: "/lsl/replacement-orders/{id}/funding-plan", description: "Assemble funding across state revolving funds, grants and rate revenue per the system's funding_mode", roles: [ProgramAdministrator], code: 200, input: [], output: ReplacementOrder, side_effects: ["fulfillment_state SCOPED → FUNDED", "populate funding_allocations[] per calculations.funding_apportionment, set funding_mode_applied and allocated_total_cents", "each FundingSource committed_cents / available_cents / disadvantaged_share_pct / equity_shortfall_cents recomputed", "recompute WaterSystem.program_posture", "increments ReplacementOrder.version by 1"] }
  - { method: POST, path: "/lsl/replacement-orders/{id}/schedule", description: "Schedule the excavation window, clearing corrosion-control, moratorium and street capacity gates", roles: [ReplacementContractor], code: 200, input: [excavation_start_date, excavation_end_date], output: ReplacementOrder, side_effects: ["fulfillment_state FUNDED → SCHEDULED", "recompute StreetProject.active_excavation_order_count", "increments ReplacementOrder.version by 1"] }
  - { method: POST, path: "/lsl/replacement-orders/{id}/start", description: "Break ground on a scheduled replacement", roles: [ReplacementContractor], code: 200, input: [], output: ReplacementOrder, side_effects: ["fulfillment_state SCHEDULED → IN_PROGRESS", "recompute StreetProject.active_excavation_order_count", "increments ReplacementOrder.version by 1"] }
  - { method: POST, path: "/lsl/replacement-orders/{id}/complete", description: "Close out the replacement, draw the committed funding and issue flushing guidance", roles: [ReplacementContractor], code: 200, input: [completed_at, replaced_sides], output: ReplacementOrder, side_effects: ["fulfillment_state IN_PROGRESS → COMPLETED, flushing_duration_minutes computed", "LINK 1 funding_allocations[] COMMITTED → DRAWN", "LINK 2 FundingSource committed_cents → drawn_cents", "LINK 3 disadvantaged_share_pct / equity_shortfall_cents recomputed", "LINK 4 WaterSystem.program_posture recomputed", "ServiceLine.replacement_state → REPLACED_FULL or REPLACED_PARTIAL, synthesizing one POTHOLE/COPPER REPLACEMENT_CASCADE EvidenceItem per replaced side which re-runs the classification recompute", "increments ReplacementOrder.version by 1"] }
  - { method: POST, path: "/lsl/replacement-orders/{id}/cancel", description: "Cancel a non-started order and release every committed dollar", roles: [ProgramAdministrator], code: 200, input: [reason], output: ReplacementOrder, side_effects: ["fulfillment_state → CANCELLED", "COMPENSATION funding_allocations[] COMMITTED → RELEASED, FundingSource committed_cents released back into available_cents", "equity_shortfall_cents and WaterSystem.program_posture recomputed", "ServiceLine.replacement_state IN_PROGRAM → ELIGIBLE", "increments ReplacementOrder.version by 1"] }

  # ------------------------------------------------------------ StreetProject
  - { method: POST, path: "/lsl/street-projects", description: "Register a paving project with its cut moratorium and excavation capacity", roles: [ProgramAdministrator], code: 201, input: [water_system_id, project_name, moratorium_start_date, moratorium_end_date, paving_start_date, "max_concurrent_excavations?"], output: StreetProject, side_effects: ["changes the coordination tier of calculations.replacement_priority_score for every linked service line"] }
  - { method: GET, path: "/lsl/street-projects", description: "List street projects", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, ReplacementContractor], code: 200, input: ["water_system_id?", "limit?", "offset?"], output: "StreetProject[]", side_effects: [] }
  - { method: GET, path: "/lsl/street-projects/{id}", description: "Read one street project", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer, ReplacementContractor], code: 200, input: [], output: StreetProject, side_effects: [] }

  # ------------------------------------------------------------ FundingSource
  - { method: POST, path: "/lsl/funding-sources", description: "Authorize a funding source with its waterfall priority, share cap and equity requirement", roles: [ProgramAdministrator], code: 201, input: [water_system_id, source_kind, authorized_cents, priority_rank, "max_share_pct?", "equity_required_pct?"], output: FundingSource, side_effects: ["available_cents = authorized_cents, committed_cents = 0, drawn_cents = 0, status = ACTIVE"] }
  - { method: GET, path: "/lsl/funding-sources", description: "List funding sources with their live ledgers", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer], code: 200, input: ["water_system_id?", "source_kind?", "status?", "limit?", "offset?"], output: "FundingSource[]", side_effects: [] }
  - { method: GET, path: "/lsl/funding-sources/{id}", description: "Read one funding source ledger", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer], code: 200, input: [], output: FundingSource, side_effects: [] }
  - { method: POST, path: "/lsl/funding-sources/{id}/status", description: "Suspend, close or reactivate a funding source; only ACTIVE sources enter the apportionment pool", roles: [ProgramAdministrator], code: 200, input: [status], output: FundingSource, side_effects: ["recompute WaterSystem.program_posture (a suspended source leaves the STEP-5 equity scan)", "increments FundingSource.version by 1"] }

  # ------------------------------------------------------------ ProgressReport
  - { method: POST, path: "/lsl/progress-reports", description: "File a compliance progress report for a closed reporting period", roles: [ComplianceOfficer], code: 201, input: [water_system_id, period_start_date, period_end_date], output: ProgressReport, side_effects: ["compute every field of calculations.compliance_credit and calculations.inventory_progress_rate; the row is immutable once created"] }
  - { method: GET, path: "/lsl/progress-reports", description: "List filed progress reports", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer], code: 200, input: ["water_system_id?", "compliance_status?", "limit?", "offset?"], output: "ProgressReport[]", side_effects: [] }
  - { method: GET, path: "/lsl/progress-reports/{id}", description: "Read one filed progress report", roles: [ProgramAdministrator, InventoryAnalyst, ComplianceOfficer], code: 200, input: [], output: ProgressReport, side_effects: [] }

  # --------------------------------------------- test-driving logical clock
  - method: POST
    path: "/lsl/_clock/set_current_utc"
    description: >
      Set the server's logical clock, which every deadline, overdue, coordination-tier and
      completed_at-window rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z;
      before any call to this endpoint the logical clock reads that default and never falls back to
      real wall-clock time. Movement is monotonic non-decreasing.
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects:
      - "recompute CustomerNotification.overdue for every notification"
      - "recompute WaterSystem.program_posture for every water system (calculations.program_posture STEP 2 is clock-dependent)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not listed in the endpoint's roles" }
  - { id: ERR_CREW_IDENTITY_MISMATCH, http: 403, condition: "A FieldTechnician acts on a VerificationAppointment whose crew_id differs from X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The ComplianceOfficer certifying an InventoryPublication is the same user id that drafted it" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required input field is absent or has the wrong JSON type" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1,100] or offset negative" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 422, condition: "An enum input carries a value outside its declared constraint set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "An interval input is inverted or degenerate (end before start, or window_end_utc == window_start_utc)" }
  - { id: ERR_WATER_SYSTEM_NOT_FOUND, http: 404, condition: "water_system_id in path or body does not resolve" }
  - { id: ERR_SERVICE_LINE_NOT_FOUND, http: 404, condition: "service_line_id in path or body does not resolve" }
  - { id: ERR_EVIDENCE_ITEM_NOT_FOUND, http: 404, condition: "evidence item id in path does not resolve" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "crew_id in path or body does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointment id in path does not resolve" }
  - { id: ERR_SAMPLING_BATCH_NOT_FOUND, http: 404, condition: "sampling batch id in path does not resolve" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "sample_seq does not match any entry of SamplingBatch.samples" }
  - { id: ERR_PUBLICATION_NOT_FOUND, http: 404, condition: "inventory publication id in path does not resolve" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "customer notification id in path does not resolve" }
  - { id: ERR_REPLACEMENT_ORDER_NOT_FOUND, http: 404, condition: "replacement order id in path does not resolve" }
  - { id: ERR_STREET_PROJECT_NOT_FOUND, http: 404, condition: "street_project_id in path or body does not resolve" }
  - { id: ERR_FUNDING_SOURCE_NOT_FOUND, http: 404, condition: "funding source id in path does not resolve" }
  - { id: ERR_PROGRESS_REPORT_NOT_FOUND, http: 404, condition: "progress report id in path does not resolve" }
  - { id: ERR_STALE_WATER_SYSTEM_VERSION, http: 412, condition: "expected_water_system_version does not equal the live WaterSystem.version on POST /lsl/inventory-publications" }
  - { id: ERR_STALE_SERVICE_LINE_VERSION, http: 412, condition: "expected_service_line_version does not equal the live ServiceLine.version on a classification override" }
  - { id: ERR_INVENTORY_STATE_INVALID, http: 409, condition: "The requested WaterSystem.inventory_status advance is not a declared transition from the current status" }
  - { id: ERR_APPOINTMENT_STATE_INVALID, http: 409, condition: "The appointment is not in the `from:` state the requested transition declares (includes acting on COMPLETED or ABANDONED)" }
  - { id: ERR_BATCH_STATE_INVALID, http: 409, condition: "The sampling batch is not in the `from:` state the requested transition declares (e.g. appending a sample to a VALIDATED batch, reopening an OPEN batch)" }
  - { id: ERR_PUBLICATION_STATE_INVALID, http: 409, condition: "The publication is not in the `from:` state the requested transition declares (includes certifying a CERTIFIED or SUPERSEDED publication)" }
  - { id: ERR_NOTIFICATION_STATE_INVALID, http: 409, condition: "The notification is not in the `from:` state the requested transition declares (e.g. acknowledging a PENDING notification, returning an ACKNOWLEDGED one)" }
  - { id: ERR_ORDER_STATE_INVALID, http: 409, condition: "The replacement order's fulfillment_state or consent_state is not the `from:` state of the requested transition (includes cancelling an IN_PROGRESS or COMPLETED order)" }
  - { id: ERR_LINE_NOT_ELIGIBLE, http: 409, condition: "A replacement order is opened against a ServiceLine whose replacement_state is not ELIGIBLE and not REPLACED_PARTIAL" }
  - { id: ERR_EVIDENCE_ALREADY_RETRACTED, http: 409, condition: "Retracting an EvidenceItem whose retracted flag is already true" }
  - { id: ERR_PROGRAM_POSTURE_FROZEN, http: 409, condition: "WaterSystem.program_posture == FROZEN blocks order creation, funding commitment and publication drafting" }
  - { id: ERR_PROGRAM_POSTURE_RESTRICTED, http: 409, condition: "WaterSystem.program_posture != OPEN blocks excavation scheduling" }
  - { id: ERR_INVENTORY_NOT_PUBLISHED, http: 409, condition: "A replacement order is opened while WaterSystem.inventory_status is DRAFT or VALIDATION_PENDING" }
  - { id: ERR_UNVALIDATED_SAMPLING_STRATUM, http: 409, condition: "Certifying a publication while the water system has zero sampling batches, or any batch in state OPEN or REJECTED" }
  - { id: ERR_CONSENT_NOT_RESOLVED, http: 409, condition: "Committing funding for an order whose consent_state is NOT_REQUESTED or REQUESTED, or whose scope is null" }
  - { id: ERR_CREW_INACTIVE, http: 409, condition: "Arriving on site with a VerificationCrew whose status is INACTIVE" }
  - { id: ERR_PINNED_SNAPSHOT_STALE, http: 409, condition: "Publishing a certified inventory whose notifiable_line_count no longer equals the live LEAD+GRR+UNKNOWN line count" }
  - { id: ERR_CCT_NOT_OPTIMIZED, http: 422, condition: "Scheduling an excavation while WaterSystem.cct_optimization_status == PENDING_REOPTIMIZATION" }
  - { id: ERR_NOTIFICATION_OVERDUE_BLOCK, http: 409, condition: "Certifying a publication while at least one CustomerNotification of the water system has overdue == true" }
  - { id: ERR_DUPLICATE_PWSID, http: 409, condition: "A WaterSystem with the same pwsid already exists" }
  - { id: ERR_DUPLICATE_ADDRESS_LABEL, http: 409, condition: "A ServiceLine with the same (water_system_id, address_label) already exists" }
  - { id: ERR_DUPLICATE_STRATUM_CODE, http: 409, condition: "A SamplingBatch with the same (water_system_id, stratum_code) already exists" }
  - { id: ERR_CREW_METHOD_NOT_CERTIFIED, http: 422, condition: "The requested appointment method is not in VerificationCrew.certified_methods" }
  - { id: ERR_CREW_OUTSIDE_SHIFT, http: 422, condition: "The appointment window falls outside the crew's daily shift, or straddles two UTC calendar dates" }
  - { id: ERR_EVIDENCE_SIDE_MISMATCH, http: 422, condition: "A WATER_SAMPLING evidence item carries side == CUSTOMER, or a completion cascade's observed_side contradicts the appointment method's admissible side" }
  - { id: ERR_REPLACED_SIDES_MISMATCH, http: 422, condition: "replaced_sides does not match the order's scope ([UTILITY, CUSTOMER] for FULL, [UTILITY] for PARTIAL)" }
  - { id: ERR_SAMPLE_COUNT_INSUFFICIENT, http: 422, condition: "valid_sample_count is strictly less than required_sample_count at validation time" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "The requested crew window collides with an existing appointment of the same crew once the 45-minute travel buffer is applied to the existing appointment's end" }
  - { id: ERR_MORATORIUM_CONFLICT, http: 409, condition: "The requested closed excavation date window intersects the linked StreetProject's closed moratorium window" }
  - { id: ERR_COMPLIANCE_DEADLINE_PASSED, http: 409, condition: "Certifying a publication after the water system's compliance_deadline_date" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "The requested progress-report period intersects an already-filed period of the same water system" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "to_iso8601 is earlier than the current logical clock value" }
  - { id: ERR_CREW_DAILY_CAPACITY_EXCEEDED, http: 409, condition: "The crew already holds daily_appointment_capacity appointments whose window_start_utc falls on the requested UTC calendar date" }
  - { id: ERR_EXCAVATION_CAPACITY_EXCEEDED, http: 409, condition: "Some calendar date in the requested excavation window already carries max_concurrent_excavations overlapping SCHEDULED/IN_PROGRESS orders on the same street project" }
  - { id: ERR_EQUITY_REQUIREMENT_BREACH, http: 422, condition: "The commit would leave an ACTIVE FundingSource with equity_shortfall_cents > 0" }
  - { id: ERR_FUNDING_INSUFFICIENT, http: 402, condition: "The ACTIVE candidate funding pool cannot cover estimated_cost_cents under the system's funding_mode" }

# =============================================================================
# §1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Utility program owner: registers systems, crews, street projects and funding sources, opens replacement orders, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /lsl/water-systems"
      - "PATCH /lsl/water-systems/{id}/funding-policy"
      - "POST /lsl/verification-crews"
      - "POST /lsl/verification-crews/{id}/status"
      - "POST /lsl/verification-appointments/{id}/reschedule"
      - "POST /lsl/street-projects"
      - "POST /lsl/funding-sources"
      - "POST /lsl/funding-sources/{id}/status"
      - "POST /lsl/replacement-orders"
      - "POST /lsl/replacement-orders/{id}/funding-plan"
      - "POST /lsl/replacement-orders/{id}/cancel"
      - "POST /lsl/_clock/set_current_utc"
    shared_operations:
      - "POST /lsl/verification-appointments (shared with FieldTechnician)"
      - "every GET listed in §1.5"

  - name: InventoryAnalyst
    description: "Builds the material inventory from records and predictive modelling and drafts publications; may never certify what they drafted"
    identity: opaque
    exclusive_operations:
      - "POST /lsl/service-lines"
      - "POST /lsl/service-lines/{id}/classification-overrides"
      - "POST /lsl/evidence-items/{id}/retract"
      - "POST /lsl/inventory-publications"
    shared_operations:
      - "POST /lsl/evidence-items (shared with FieldTechnician)"
      - "GET on water systems, service lines, evidence items, crews, appointments, sampling batches, publications, notifications, orders, street projects, funding sources, progress reports"

  - name: ComplianceOfficer
    description: "Regulatory signatory: advances the inventory lifecycle, runs statistical validation, certifies and publishes inventories, files progress reports"
    identity: opaque
    exclusive_operations:
      - "POST /lsl/water-systems/{id}/advance-inventory-status"
      - "PATCH /lsl/water-systems/{id}/corrosion-control"
      - "POST /lsl/sampling-batches"
      - "POST /lsl/sampling-batches/{id}/invalidate-sample"
      - "POST /lsl/sampling-batches/{id}/validate"
      - "POST /lsl/sampling-batches/{id}/reopen"
      - "POST /lsl/inventory-publications/{id}/certify"
      - "POST /lsl/inventory-publications/{id}/publish"
      - "POST /lsl/progress-reports"
    shared_operations:
      - "POST /lsl/sampling-batches/{id}/samples (shared with FieldTechnician)"
      - "GET on water systems, service lines, evidence items, crews, appointments, sampling batches, publications, notifications, orders, street projects, funding sources, progress reports"

  - name: FieldTechnician
    description: "Verification crew operating in the field; X-User-ID is the crew's own row id, so a technician may only drive appointments booked to that crew"
    identity: "entity_backed:VerificationCrew"
    exclusive_operations:
      - "POST /lsl/verification-appointments/{id}/arrive"
      - "POST /lsl/verification-appointments/{id}/complete"
      - "POST /lsl/verification-appointments/{id}/no-access"
    shared_operations:
      - "POST /lsl/verification-appointments (shared with ProgramAdministrator)"
      - "POST /lsl/evidence-items (shared with InventoryAnalyst)"
      - "POST /lsl/sampling-batches/{id}/samples (shared with ComplianceOfficer)"
      - "GET on water systems, service lines, evidence items, crews, appointments, sampling batches"

  - name: CustomerRepresentative
    description: "Customer-facing notification and consent desk"
    identity: opaque
    exclusive_operations:
      - "POST /lsl/customer-notifications/{id}/deliver"
      - "POST /lsl/customer-notifications/{id}/acknowledge"
      - "POST /lsl/customer-notifications/{id}/return"
      - "POST /lsl/replacement-orders/{id}/consent-request"
      - "POST /lsl/replacement-orders/{id}/consent-response"
    shared_operations:
      - "GET on water systems, service lines, publications, notifications, orders"

  - name: ReplacementContractor
    description: "Construction contractor that schedules, starts and closes out excavations"
    identity: opaque
    exclusive_operations:
      - "POST /lsl/replacement-orders/{id}/schedule"
      - "POST /lsl/replacement-orders/{id}/start"
      - "POST /lsl/replacement-orders/{id}/complete"
    shared_operations:
      - "GET on water systems, service lines, street projects, replacement orders"

