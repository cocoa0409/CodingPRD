      - name: a_served_non_renewal_ripens_when_the_clock_reaches_expiration
        claim_type: valid_transition
        grounds:
          - state_machines.Policy.transitions[IN_FORCE->NON_RENEWAL_PENDING]
          - state_machines.Policy.transitions[NON_RENEWAL_PENDING->NON_RENEWED]
          - state_machines.Assignment.transitions[POLICY_ISSUED->CLOSED]
          - errors[ERR_INVALID_POLICY_STATE]
        distinguishing_aspect: |
          The only clock-driven transition in the scaffold: serving the notice sets
          non_renewal_effective_date to the expiration date and the policy ripens to NON_RENEWED
          when the clock reaches it, observed on the next read - no second API call performs the
          transition. Serving twice on the same term is refused even while the notice is still
          pending, refused by the state machine itself rather than by a redundant counter guard.
