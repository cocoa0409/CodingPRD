  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: student_enrollment_periods_are_closed_intervals_touching_endpoints_collide
        grounds:
          - validations[priority=22]
          - errors.ERR_OVERLAPPING_ENROLLMENT_PERIOD
          - entities.EnrollmentCertification.fields.term_start_certified
          - entities.EnrollmentCertification.fields.term_end_certified
        distinguishing_aspect: |
          The per-student certified enrollment period is a CLOSED interval, so a second
          certification starting on the exact day the first one ends (2026-10-15) is
          rejected with 409 ERR_OVERLAPPING_ENROLLMENT_PERIOD; shifting the start by a
          single day to 2026-10-16 makes it legal. The overlap set is scoped to the
          student and to non-DRAFT, non-TERMINATED certifications, which is why both
          rows could be created in DRAFT before either was submitted.
        test_recipe:
          setup:
            - "Program BSN-UG APPROVED, clock at 2026-08-01."
