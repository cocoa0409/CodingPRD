              payload: {}
              as: LaborRelationsDirector
          trigger:
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: {"submitted_card_count": 40, "duplicate_card_count": 0, "undated_card_count": 0, "stale_card_count": 0, "nonunit_card_count": 0}
