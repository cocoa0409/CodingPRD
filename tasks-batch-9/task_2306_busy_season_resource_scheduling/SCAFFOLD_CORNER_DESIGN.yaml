      - name: offshore_review_owner_rules_reject_missing_present_ineligible_and_windowless
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - validations[priority=23]
          - errors[ERR_REVIEW_OWNER_REQUIRED]
          - errors[ERR_REVIEW_OWNER_NOT_ELIGIBLE]
          - errors[ERR_REVIEW_WINDOW_MISSING]
        distinguishing_aspect: |
          Review ownership is a biconditional (required for OFFSHORE, forbidden for DOMESTIC),
          the owner must be review_capable, and a ReviewCapacityWindow must already exist for
          the ISO week of the booking's last worked day — a booking ending 2026-08-15 charges
          week 2026-08-10, for which no window was created.
