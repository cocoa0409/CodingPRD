              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/renew"
              payload: { new_end_date: "2032-08-31", expected_agreement_version: "${agr_v}" }
              as: ProgramAdministrator
              captures: { ok_status: $.data.status }
            - call: "POST /licensing/agreements/${agr_id}/renew"
              payload: { new_end_date: "2032-08-31", expected_agreement_version: "${agr_v}" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "first renew succeeds (status RENEWED)"
            - "second renew with the same expected_agreement_version fails with ERR_STALE_VERSION (412) or ERR_INVALID_STATE (409) — the stale view is rejected deterministically, never applied twice"
      - name: entitlement_patch_stale_version_occ_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[entitlement-adjust-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Sequential OCC on LicenseEntitlement: a successful PATCH (quantity up) bumps version; a second PATCH carrying the pre-PATCH version fails with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE agreement with entitlement quantity 5 (no report under review); client holds version ent_v"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "OCC2 Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-OCC-2", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "OC2", name: "Occ Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: LicensingSpecialist
              captures: { ent_id: $.data.id, ent_v: $.data.version }
          trigger:
            - call: "PATCH /licensing/entitlements/${ent_id}"
              payload: { quantity: 8, expected_entitlement_version: "${ent_v}" }
              as: LicensingSpecialist
              captures: { new_qty: $.data.quantity }
            - call: "PATCH /licensing/entitlements/${ent_id}"
              payload: { quantity: 9, expected_entitlement_version: "${ent_v}" }
              as: LicensingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds: quantity == 8"
            - "second PATCH with the stale expected_entitlement_version fails with ERR_STALE_VERSION (412)"
      - name: grant_expiry_sweep_on_snapshot_creation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AssuranceBenefitGrant.ACTIVE_to_EXPIRED
        distinguishing_aspect: "The expiry sweep rides on position-snapshot creation: an ACTIVE grant with expires_on in the past is transitioned to EXPIRED as a side effect of POST /agreements/{id}/position-snapshots."
        test_recipe:
          setup: ["ACTIVE agreement with anniversary 1; ACTIVE grant expires_on 2026-12-31; clock at 2027-01-15; product SW1 with a 1-user deployment"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Sweep Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-SWP-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/benefit-grants"
              payload: { benefit_type: "SUPPORT_INCIDENT", quantity_granted: 2, expires_on: "2026-12-31" }
              as: LicensingSpecialist
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "SW1", name: "Sweep Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 1, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/position-snapshots"
              payload: { anniversary_id: "${ann_id}" }
              as: LicensingSpecialist
            - call: "GET /licensing/benefit-grants/${grant_id}"
              as: LicensingSpecialist
              captures: { g_status: $.data.status }
          assert:
            - "after snapshot creation, grant status == EXPIRED (swept by the snapshot side effect)"

