            - "PhasePackage.${ph_b_id}.ti_disbursed_usd == 0.00"
            - "PhasePackage.${ph_c_id}.ti_disbursed_usd == 0.00"
            - "PhasePackage.${ph_a_id}.ti_committed_usd == 114750.00"
