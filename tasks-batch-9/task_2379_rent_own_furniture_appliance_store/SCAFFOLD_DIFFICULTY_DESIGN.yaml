  - rule_id: compensating_invariant
    instances:

      - name: cash_conserved_when_a_payment_that_consumed_carried_credit_is_reversed
        grounds:
          - calculations.cash_allocation_identity
          - entities.RenewalPayment.fields.partial_credit_before_cents
          - endpoints["POST /renewal-payments/{id}/reverse"]
          - calculations.loyalty_points_identity
        distinguishing_aspect: |
          Conserved quantity 1 — MONEY. The named identity is sum(POSTED
          amount_cents) == rent_applied + late_fee_paid + reinstatement_fee_paid +
          partial_credit + customer_credit_contributed. The reversed payment had
          consumed 4000 cents of carried partial credit inside its rent pool, so
          restoring partial_credit_cents by subtracting
          allocation_partial_credit_cents (846) leaves 0 instead of 4000 and the
          identity drifts by exactly 4000 cents while every state field still
          looks correct. Only restoring partial_credit_before_cents balances it.
        test_recipe:
          setup:
            - "TX StateRtoRule and a TX store with one NEW 120000-cent FURNITURE unit"
            - "a VERIFIED customer with a WEEKLY x 52 agreement (renewal_rate_cents 5077) DELIVERED at 2026-08-01T00:00:00Z, period 1 due 2026-08-08T00:00:00Z"
            - "payment 1 of 4000 cents posted at 2026-08-01T00:00:00Z: no fees exist, so it advances 0 periods and parks 4000 cents in partial_credit_cents"
            - "payment 2 of 7000 cents posted at 2026-08-05T00:00:00Z: its rent pool is 7000 + 4000 = 11000, which advances 2 periods (10154 cents) and re-parks 846 cents, with partial_credit_before_cents recorded as 4000"
            - "no day-close has run, so the agreement never left CURRENT and no ReinstatementWindow exists"
          setup_api_calls:
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /stores/${store_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_id: $.data.id }
            - call: "POST /agreements/${agr_id}/delivery-orders"
              payload: { crew_id: "${crew_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_v1}" }
              as: StoreManager
              captures: { do_id: $.data.id }
            - call: "POST /delivery-orders/${do_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
            - call: "POST /agreements/${agr_id}/renewal-payments"
              payload: { amount_cents: 4000, payment_method: "CASH" }
              as: SalesAssociate
              captures: { pay1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agreements/${agr_id}/renewal-payments"
              payload: { amount_cents: 7000, payment_method: "ACH" }
              as: SalesAssociate
              captures: { pay2_id: $.data.id }
          trigger:
            - call: "POST /renewal-payments/${pay2_id}/reverse"
              payload: { reason: "NSF" }
              as: StoreManager
          assert:
            - "before the trigger the identity held at 11000: RenewalPayment.${pay2_id}.partial_credit_before_cents == 4000, allocation_rent_cents == 10154, allocation_partial_credit_cents == 846, periods_advanced == 2, days_late == 0, loyalty_points_awarded == 126, and Agreement.${agr_id}.rent_applied_cents 10154 + partial_credit_cents 846 == 11000"
            - "RenewalPayment.${pay2_id}.status == REVERSED, reversed_at == 2026-08-05T00:00:00Z and reversal_reason == NSF"
            - "conserved quantity — sum(amount_cents where status == POSTED) == 4000 == Agreement.${agr_id}.rent_applied_cents (0) + late_fee_paid_cents (0) + reinstatement_fee_paid_cents (0) + partial_credit_cents (4000) + customer_credit_contributed_cents (0)"
            - "Agreement.${agr_id}.partial_credit_cents == 4000 exactly — restored from partial_credit_before_cents, NOT 846 - 846 == 0"
            - "Agreement.${agr_id}.periods_paid == 0, current_period_due_at == 2026-08-08T00:00:00Z, paid_pct == 0.0000 and payment_status == CURRENT (it was never DELINQUENT, so no window is re-opened and cured_delinquency was false)"
            - "second conserved quantity — Customer.${cust_id}.loyalty_points_balance == 0 == the sum of all LoyaltyLedgerEntry.delta_points (+126 and -126), while loyalty_points_lifetime == 126 (only positive deltas) and loyalty_tier == STANDARD"
            - "RenewalPayment.${pay1_id}.status is still POSTED — reversing the newest payment never touches its predecessor"

      - name: units_in_customers_hands_conserved_across_swap_and_resolution
        grounds:
          - calculations.unit_possession_identity
          - endpoints["POST /service-tickets/{id}/resolve"]
          - state_machines.InventoryUnit.IN_SERVICE_to_AVAILABLE
          - entities.Store.fields.units_in_service_count
        distinguishing_aspect: |
          Conserved quantity 2 — a HEADCOUNT of physical units, not money: across
          the forward action (issue-swap) and its compensating action (resolve
          SWAPPED), Store.units_on_rent_count must read exactly 1 at all three
          observation points and must equal both the number of ON_RENT units and
          the number of agreements in DELIVERED/SERVICE_SWAP_PENDING, while
          units_in_service_count travels 0 -> 1 -> 0 and service_intake_open
          travels true -> false -> true. Decrementing on swap-out and
          incrementing on swap-in in the wrong order leaves the count at 0 or 2.
        test_recipe:
          setup:
            - "TX StateRtoRule and a TX store with service_bay_capacity 1"
            - "two NEW FURNITURE units of cash_price_cents 120000 (unit A and unit B)"
            - "a VERIFIED customer with a WEEKLY x 52 agreement on unit A, DELIVERED at 2026-08-01T00:00:00Z, so units_on_rent_count is 1, units_in_service_count is 0 and service_intake_open is true"
            - "a SCHEDULED MECHANICAL ServiceTicket on that agreement with window 2026-08-03T09:00:00Z .. 11:00:00Z, already advanced to SWAP_ISSUED against unit B"
          setup_api_calls:
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_a_id: $.data.id }
            - call: "POST /stores/${store_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0002", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_b_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_a_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /stores/${store_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_id: $.data.id }
            - call: "POST /agreements/${agr_id}/delivery-orders"
              payload: { crew_id: "${crew_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_v1}" }
              as: StoreManager
