            - call: POST /obstetric-units/${unit_id}/cesarean-readiness-drills
              payload: { drill_type: "DECISION_TO_INCISION", scheduled_for_utc: "2026-08-22T07:00:00Z", participant_staff_ids: ["${s_ob}", "${s_anes}"] }
              as: AnesthesiaLead
