          authorized_cents: 100000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 10500
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - DRUG_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 0
            transportation_score: 0
            health_score: 0
            work_history_score: 0
            documentation_score: 0
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_a: $.data.version
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_a}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: OWN_VEHICLE
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_a: $.data.version
      trigger:
      - call: POST /support-requests
        payload:
          participant_id: ${p1_id}
          grant_id: ${g1_id}
          category: TOOLS
          expected_grant_version: ${g1_v_a}
          line_items:
          - description: Framing nailer kit
            unit_cost_cents: 12000
            quantity: 1
          justification: Tool requirement for the carpentry placement
        as: CaseManager
        as_user_id: cm-1
        captures:
          sr1_id: $.data.id
      assert:
      - HTTP 409
      - data.error_id == "ERR_PARTICIPANT_CAP_EXCEEDED"
      - the raw line sum 12000 and the awarded 10200 are both below the cap; only total_charge_cents 10506 (10200
        + 306) exceeds 10500
      - GET /support-requests?participant_id=${p1_id} returns total_count == 0
      - GET /grants/${g1_id}/ledger returns open_request_count == 0 and available_cents == 100000
