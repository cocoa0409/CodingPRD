    output: StormEvent
    side_effects: ["increments downgrade_count on a WARNING -> WATCH move", "already-scheduled sweep deadlines are never recomputed"]
    gates: [G1, G2, G3, G5, G10]
  - method: POST
    path: "/property-care/storm-events/{id}/landfall"
    description: "Records landfall; settles every unswept response to MISSED_DEADLINE and moves the rest to AWAITING_ALL_CLEAR."
    roles: [StormCoordinator]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["sets landfall_recorded_at", "StormResponse SECURE_SWEEP_SCHEDULED -> MISSED_DEADLINE when past deadline and unswept", "SECURED / SECURED_LATE / MISSED_DEADLINE -> AWAITING_ALL_CLEAR"]
    gates: [G1, G2, G3, G5]
  - method: POST
    path: "/property-care/storm-events/{id}/all-clear"
    description: "Declares all-clear, the anchor for every post-storm assessment SLA."
    roles: [StormCoordinator]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["sets all_clear_at", "every AWAITING_ALL_CLEAR response moves to ASSESSMENT_DUE and receives assessment_deadline_at from calculation response_deadline, POST_STORM variant"]
    gates: [G1, G2, G3, G5]
  - method: POST
    path: "/property-care/storm-events/{id}/close"
    description: "Closes the storm event once every response is assessed."
    roles: [StormCoordinator]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["every ASSESSED response moves to CLOSED", "clears Property.storm_hold_flag where no other open response exists"]
    gates: [G1, G2, G3, G5]

  # ---------------- StormResponse ----------------
  - method: POST
    path: "/property-care/storm-events/{id}/responses"
    description: "Enrols a property in a storm response."
    roles: [StormCoordinator, Dispatcher]
    code: 201
    input: [property_id]
    output: StormResponse
    side_effects: ["status PENDING", "binds the property's non-cancelled Subscription when one exists"]
    gates: [G1, G2, G3, G10]
  - method: GET
    path: "/property-care/storm-responses"
    description: "Lists storm responses, filterable by storm event, property or subscription."
    roles: [StormCoordinator, Dispatcher, PlatformAdmin, AccountManager, FieldTech, Auditor, Owner]
    code: 200
    input: ["storm_event_id?", "property_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: StormResponse[]
    side_effects: []
    gates: [G1, G2]
  - method: GET
    path: "/property-care/storm-responses/{id}"
    description: "Reads one storm response with both deadline instants."
    roles: [StormCoordinator, Dispatcher, PlatformAdmin, AccountManager, FieldTech, Auditor, Owner]
    code: 200
    input: []
    output: StormResponse
    side_effects: []
    gates: [G1, G2, G3]
  - method: POST
    path: "/property-care/storm-responses/{id}/schedule-sweep"
    description: "Computes the pre-storm secure-sweep deadline from the landfall ETA and the tier at scheduling time, and creates the sweep visit."
    roles: [StormCoordinator, Dispatcher]
    code: 200
    input: [checklist_template_id, scheduled_start_at]
    output: StormResponse
    side_effects: ["runs calculation response_deadline, PRE_STORM variant", "creates a STORM_SECURE Visit with trigger_source STORM whose scheduled_end_at equals secure_sweep_deadline_at", "sets secure_sweep_visit_id and Property.storm_hold_flag true"]
    gates: [G1, G2, G3, G5, G6, G7, G10]
  - method: POST
    path: "/property-care/storm-responses/{id}/assessments"
    description: "Signs off the post-storm damage assessment. Segregation of duties: the signer must differ from the technician who performed the secure sweep. Optimistic-concurrency guarded."
    roles: [FieldTech, StormCoordinator]
    code: 200
    input: [damage_level, expected_storm_response_version]
    output: StormResponse
    side_effects: ["sets assessed_at, assessed_by_user_id and damage_level", "increments StormResponse.version by 1"]
    gates: [G1, G2, G3, G4, G5, G10]
  - method: POST
    path: "/property-care/storm-responses/{id}/close"
    description: "Closes an assessed response."
    roles: [StormCoordinator]
    code: 200
    input: []
    output: StormResponse
    side_effects: ["clears Property.storm_hold_flag when no other open response exists"]
    gates: [G1, G2, G3, G5]

  # ---------------- Invoice / InvoiceLine ----------------
  - method: POST
    path: "/property-care/billing-cycles/{id}/invoices"
    description: "Opens a draft invoice for a billing cycle and seeds the subscription-fee line."
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: []
    output: Invoice
    side_effects: ["status DRAFT", "property_id and owner_id copied from the cycle's subscription", "creates one ACTIVE SUBSCRIPTION_FEE InvoiceLine with amount_cents equal to BillingCycle.prorated_fee_cents", "runs calculation invoice_total"]
    gates: [G1, G2, G3, G9]
  - method: GET
    path: "/property-care/invoices"
    description: "Lists invoices, filterable by cycle, property or owner."
    roles: [AccountManager, PlatformAdmin, Owner, Auditor]
    code: 200
    input: ["billing_cycle_id?", "property_id?", "owner_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
    gates: [G1, G2]
  - method: GET
    path: "/property-care/invoices/{id}"
    description: "Reads one invoice with every step of the total pipeline exposed."
    roles: [AccountManager, PlatformAdmin, Owner, Auditor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
    gates: [G1, G2, G3]
  - method: POST
    path: "/property-care/invoices/{id}/lines"
    description: "Appends a line to a draft invoice."
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: [line_type, description, amount_cents, "taxable?", "visit_id?", "work_order_id?", "security_incident_id?", "mail_hold_id?"]
    output: InvoiceLine
    side_effects: ["sequence_index assigned in ascending created_at order", "runs calculation invoice_line_tax then the full invoice_total pipeline"]
    gates: [G1, G2, G3, G5, G10]
  - method: GET
    path: "/property-care/invoice-lines"
    description: "Lists invoice lines with every foreign key exposed as a filter."
    roles: [AccountManager, PlatformAdmin, Owner, Auditor]
    code: 200
    input: ["invoice_id?", "visit_id?", "work_order_id?", "security_incident_id?", "mail_hold_id?", "line_type?", "status?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
    gates: [G1, G2]
  - method: GET
    path: "/property-care/invoice-lines/{id}"
    description: "Reads one invoice line."
    roles: [AccountManager, PlatformAdmin, Owner, Auditor]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []
    gates: [G1, G2, G3]
  - method: POST
    path: "/property-care/invoice-lines/{id}/void"
    description: "Voids a line; the compensating action for the line-sum conservation invariant."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: ["status VOID, tax_cents set to 0", "re-runs the full invoice_total pipeline, restoring the pre-add totals exactly"]
    gates: [G1, G2, G3, G5]
  - method: POST
    path: "/property-care/invoices/{id}/issue"
    description: "Issues a draft invoice and freezes the line set."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["recomputes every step of calculation invoice_total", "sets issued_at"]
    gates: [G1, G2, G3, G5, G9]
  - method: POST
    path: "/property-care/invoices/{id}/pay"
    description: "Records a payment."
    roles: [AccountManager, PlatformAdmin, Owner]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["increases amount_paid_cents", "PARTIALLY_PAID below the balance, PAID at or above it", "sets paid_at when the balance reaches 0"]
    gates: [G1, G2, G3, G5, G9, G10]
  - method: POST
    path: "/property-care/invoices/{id}/dispute"
    description: "Owner disputes an issued invoice."
    roles: [Owner]
    code: 200
    input: ["resolution_note?"]
    output: Invoice
    side_effects: ["increments dispute_count"]
    gates: [G1, G2, G3, G5]
  - method: POST
    path: "/property-care/invoices/{id}/resolve-dispute"
    description: "Returns a disputed invoice to ISSUED and recomputes the total over the current line set."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["re-runs calculation invoice_total"]
    gates: [G1, G2, G3, G5]
  - method: POST
    path: "/property-care/invoices/{id}/void"
    description: "Voids an unpaid invoice and every line on it."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["every ACTIVE line transitions to VOID", "totals recomputed to 0"]
    gates: [G1, G2, G3, G5]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog (95 codes)
# ---------------------------------------------------------------------------
errors:
  # --- G1 auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles"
  # --- G2 role and scope ---
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an Owner acts on a Property, Invoice, AwayPeriod or WorkOrder whose owner_id differs from X-User-ID"
  - id: ERR_NOT_ASSIGNED_VENDOR
    http: 403
    condition: "a Vendor acts on a VendorAssignment whose vendor_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID signing a post-storm assessment equals StormResponse.swept_by_user_id"
  - id: ERR_WORK_ORDER_PIPELINE_MISMATCH
    http: 403
    condition: "an Owner approves a STORM-pipeline work order, or a StormCoordinator approves a ROUTINE-pipeline work order"
  # --- G3 existence ---
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path id does not resolve to a row of its declared entity"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "body field owner_id does not resolve"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "body field property_id does not resolve"
  - id: ERR_SERVICE_PLAN_NOT_FOUND
    http: 404
    condition: "body field service_plan_id does not resolve"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "body field checklist_template_id does not resolve"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "body field vendor_id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "body field invoice_id does not resolve"
  - id: ERR_LINKED_RESOURCE_NOT_FOUND
    http: 404
    condition: "an optional foreign key supplied in the body does not resolve"
  # --- G4 OCC ---
  - id: ERR_STALE_FINDING_VERSION
    http: 412
    condition: "expected_finding_version differs from Finding.version"
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
