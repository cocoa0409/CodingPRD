# =============================================================================
# Task 0653 — Epoxy & Garage-Floor Coating
# SCAFFOLD.yaml  (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  653. Epoxy & Garage-Floor Coating: measure & sq-ft/condition assessment, system/color
  (flake/metallic) selection, surface prep (grind/crack) scope, one-day install & cure
  window, quote & financing, warranty (hot-tire/peel), callback, referral

domain_name: epoxy-garage-coating
api_prefix: ""   # flat top-level collections (/projects, /customers, /crews, /warranties, ...); no shared path prefix

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation     # ESTIMATE quote vs FINAL (as-measured-on-site) quote
    - cascading_side_effects       # assessment -> prep scope -> quote -> install -> warranty
    - optimistic_concurrency       # OCC on Project.version for quote acceptance & install booking
    - rate_threshold_triggers      # volume discount tiers, condition-score prep tiers, warranty proration
    - scheduled_actions            # one-day install date + cure window deadlines on a logical clock

  entity_topology: hybrid
  # Project is the central lifecycle hub; Assessment / Quote / InstallJob / Warranty hang off it
  # (hierarchical), while Crew, CoatingSystem, ColorOption, FinancingPlan are flat catalogs
  # referenced by FK, and Referral cross-links two Customers + a Project.

  state_machine_shape: parallel
  # Project carries TWO independent dimensions (sales_status × build_status); WarrantyClaim is
  # cyclic (revision loop on callback); InstallJob is branching; Warranty is linear-with-revert.

  relationship_patterns:
    - one_to_many        # Customer -> Project, Project -> WarrantyClaim
    - cross_aggregate    # Referral references referrer Customer, referred Customer, and a Project
    - self_referential   # Referral.referrer_customer_id and referred_customer_id both -> Customer

  role_model: peer_roles
  # SalesRep owns quotes/assessments; Scheduler owns install booking & crews; WarrantyAgent owns
  # warranties/claims; Customer (entity_backed) owns accept/decline + referrals; PlatformAdmin opaque.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  # Catalog / configuration entities (flat, FK targets)
  # ---------------------------------------------------------------------------
  - name: CoatingSystem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Display name, e.g. 'Garage Flake Standard'" }
      - { name: family, type: enum, source: input, description: "FLAKE | METALLIC — drives cure window & complexity multiplier", constraints: "FLAKE or METALLIC" }
      - { name: sku, type: enum, source: input, description: "FLAKE_STANDARD | FLAKE_PREMIUM | METALLIC — selects per-sqft material rate", constraints: "FLAKE_STANDARD, FLAKE_PREMIUM, METALLIC" }
      - { name: requires_metallic_certified_crew, type: boolean, source: computed, description: "true iff family==METALLIC; install crew must carry metallic_certified=true" }
      - { name: active, type: boolean, source: input, description: "Whether selectable on new quotes", default: true }

  - name: ColorOption
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: coating_system_id, type: string, source: input, description: "FK -> CoatingSystem.id; the system this color blend belongs to" }
      - { name: name, type: string, source: input, description: "Color/flake blend name, e.g. 'Domino Flake'" }
      - { name: flake_blend_code, type: string, source: input, description: "Manufacturer blend code" }
      - { name: active, type: boolean, source: input, description: "Whether selectable", default: true }

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Plan label, e.g. '36mo 9.99%'" }
      - { name: apr_bps, type: integer, source: input, description: "Annual percentage rate in basis points (999 = 9.99%)", constraints: ">= 0, <= 3500" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly payments", constraints: ">= 1, <= 84" }
      - { name: min_principal_cents, type: integer, source: input, description: "Minimum financed amount eligible for this plan", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether offerable", default: true }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: metallic_certified, type: boolean, source: input, description: "Eligible to install METALLIC systems", default: false }
      - { name: max_sqft_per_day, type: integer, source: input, description: "Single-day install capacity ceiling in sqft", constraints: ">= 1" }
      - { name: active, type: boolean, source: input, description: "Whether bookable", default: true }

  # ---------------------------------------------------------------------------
  # Actor entity
  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when X-User-Role=Customer" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Customers" }
      - { name: referral_code, type: string, source: system, description: "Server-minted short code other customers cite to credit this customer" }
      - { name: account_credit_balance_cents, type: integer, source: computed, description: "Sum of earned-and-not-clawed referral credits; conserved quantity (see calc referral_credit_ledger)", default: 0 }

  # ---------------------------------------------------------------------------
  # Central lifecycle hub — TWO parallel state dimensions
  # ---------------------------------------------------------------------------
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the homeowner this job is for" }
      - { name: site_zip, type: string, source: input, description: "5-digit install site ZIP" }
      - { name: sales_status, type: enum, source: system, description: "LEAD | ASSESSED | QUOTED | ACCEPTED | DECLINED — sales pipeline dimension", constraints: "LEAD, ASSESSED, QUOTED, ACCEPTED, DECLINED" }
      - { name: build_status, type: enum, source: system, description: "PRE_BUILD | SCHEDULED | INSTALLED | CURING | COMPLETE | CANCELLED — fulfilment dimension, advances independently of sales_status", constraints: "PRE_BUILD, SCHEDULED, INSTALLED, CURING, COMPLETE, CANCELLED" }
      - { name: accepted_quote_id, type: string, source: system, description: "Pointer to the Quote.id whose acceptance moved sales_status to ACCEPTED; repointed to the FINAL quote at install completion; null before acceptance" }
      - { name: referral_id, type: string, source: system, description: "Pointer to the Referral.id set when this project was created citing a referral_code; null otherwise" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, increments by 1 on every mutation including cascades" }

  # ---------------------------------------------------------------------------
  # Assessment — sq-ft + condition; computes prep tier (grind/crack scope) used by quotes
  # ---------------------------------------------------------------------------
  - name: Assessment
    parent: Project
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the project measured" }
      - { name: measured_sqft, type: integer, source: input, description: "Tech-measured floor area in sqft", constraints: ">= 1" }
      - { name: oil_stain_pct, type: integer, source: input, description: "Percent of floor with oil staining 0..100", constraints: ">= 0, <= 100" }
      - { name: crack_density, type: integer, source: input, description: "Cracks per 100 sqft (capped at 50 for scoring)", constraints: ">= 0" }
      - { name: crack_linear_ft, type: integer, source: input, description: "Total measured crack length in linear feet (drives surface-prep crack scope)", constraints: ">= 0" }
      - { name: spalling, type: boolean, source: input, description: "Surface spalling present" }
      - { name: moisture_pct, type: integer, source: input, description: "Slab moisture reading 0..100", constraints: ">= 0, <= 100" }
      - { name: condition_score, type: integer, source: computed, description: "Weighted 0..100 score (see calc condition_score)" }
      - { name: prep_tier, type: enum, source: computed, description: "LIGHT | MODERATE | HEAVY grind/crack prep tier derived from condition_score thresholds", constraints: "LIGHT, MODERATE, HEAVY" }
      - { name: billable_crack_ft, type: integer, source: computed, description: "Crack feet billed beyond the tier allowance: max(0, crack_linear_ft - included_ft_for_tier)" }
      - { name: status, type: enum, source: system, description: "APPROVED | SUPERSEDED — a newly recorded assessment supersedes the prior APPROVED one; only one APPROVED assessment per project", constraints: "APPROVED, SUPERSEDED" }

  # ---------------------------------------------------------------------------
  # Quote — pricing with ESTIMATE vs FINAL variants + financing
  # ---------------------------------------------------------------------------
  - name: Quote
    parent: Project
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: assessment_id, type: string, source: input, description: "Reference to the APPROVED Assessment.id whose prep_tier/sqft/crack feed pricing (validated to exist and be APPROVED on this project)" }
      - { name: coating_system_id, type: string, source: input, description: "Reference to CoatingSystem.id; selected system (validated to exist)" }
      - { name: color_option_id, type: string, source: input, description: "Reference to ColorOption.id; selected color, must belong to coating_system_id (validated)" }
      - { name: financing_plan_id, type: string, source: input, description: "Reference to FinancingPlan.id; null = pay-in-full (validated to exist when present)" }
      - { name: install_season, type: enum, source: input, description: "PEAK | STANDARD | OFF season bucket the install is targeted for (drives labor seasonal multiplier)", constraints: "PEAK, STANDARD, OFF" }
      - { name: variant, type: enum, source: system, description: "ESTIMATE (priced from assessment sqft) | FINAL (re-priced from on-site as-measured sqft)", constraints: "ESTIMATE, FINAL" }
      - { name: priced_sqft, type: integer, source: computed, description: "billable_sqft used for this quote (max(measured,250))" }
      - { name: system_material_cents, type: integer, source: computed, description: "Material subtotal (see calc quote_pricing)" }
      - { name: prep_labor_cents, type: integer, source: computed, description: "Prep labor subtotal incl. crack adder and seasonal multiplier" }
      - { name: volume_discount_pct_bps, type: integer, source: computed, description: "Volume discount tier in bps (0/500/1000) keyed on system+prep subtotal" }
      - { name: discount_cents, type: integer, source: computed, description: "Discount amount applied" }
      - { name: mobilization_cents, type: integer, source: computed, description: "Flat trip fee 25000" }
      - { name: grand_total_cents, type: integer, source: computed, description: "Final price (see calc quote_pricing)" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Amortized monthly payment if financing_plan_id set, else 0 (see calc financing_payment)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | DECLINED | SUPERSEDED", constraints: "DRAFT, SENT, ACCEPTED, DECLINED, SUPERSEDED" }

  # ---------------------------------------------------------------------------
  # InstallJob — one-day install booked to a crew on a date; cure window deadlines
  # ---------------------------------------------------------------------------
  - name: InstallJob
    parent: Project
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the booked crew" }
      - { name: install_date, type: datetime, source: input, description: "Start instant of the one-day install (ISO 8601 UTC)" }
      - { name: install_end, type: datetime, source: computed, description: "install_date + INSTALL_DURATION_HOURS (8h)" }
      - { name: foot_traffic_ok_at, type: datetime, source: computed, description: "install_end + 24h" }
      - { name: vehicle_traffic_ok_at, type: datetime, source: computed, description: "install_end + 72h (+24h more for METALLIC) — hot-tire cure deadline" }
      - { name: as_measured_sqft, type: integer, source: input, description: "Crew's on-site verified sqft captured at completion; null until COMPLETED", constraints: ">= 1" }
      - { name: as_measured_crack_ft, type: integer, source: input, description: "Crew's on-site verified crack feet at completion; null until COMPLETED", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "BOOKED | IN_PROGRESS | COMPLETED | CURED | CANCELLED", constraints: "BOOKED, IN_PROGRESS, COMPLETED, CURED, CANCELLED" }

  # ---------------------------------------------------------------------------
  # Warranty — hot-tire/peel coverage created when an install cures
  # ---------------------------------------------------------------------------
  - name: Warranty
    parent: Project
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: install_job_id, type: string, source: input, description: "Pointer to the InstallJob.id whose cure created this warranty" }
      - { name: covered_install_price_cents, type: integer, source: computed, description: "FINAL quote grand_total_cents at cure time; basis for proration" }
      - { name: term_months, type: integer, source: system, description: "Coverage term in months", default: 180 }
      - { name: coverage_start_at, type: datetime, source: computed, description: "InstallJob.vehicle_traffic_ok_at (cure complete instant)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLAIM_OPEN | VOID — VOID on project cancellation", constraints: "ACTIVE, CLAIM_OPEN, VOID" }

  # ---------------------------------------------------------------------------
  # WarrantyClaim — callback; CYCLIC revision loop (NEEDS_INFO <-> SUBMITTED)
  # ---------------------------------------------------------------------------
  - name: WarrantyClaim
    parent: Warranty
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: warranty_id, type: string, source: input, description: "FK -> Warranty.id" }
      - { name: defect_type, type: enum, source: input, description: "HOT_TIRE | PEEL | OTHER", constraints: "HOT_TIRE, PEEL, OTHER" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant the claim was submitted" }
      - { name: months_elapsed, type: integer, source: computed, description: "Whole months from Warranty.coverage_start_at to reported_at (floor)" }
      - { name: prorated_credit_cents, type: integer, source: computed, description: "Approved peel/hot-tire payout (see calc warranty_proration); 0 until APPROVED" }
      - { name: revision_rounds, type: integer, source: computed, description: "Count of NEEDS_INFO -> SUBMITTED loops taken", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | NEEDS_INFO | APPROVED | REJECTED | CALLBACK_SCHEDULED | CLOSED", constraints: "SUBMITTED, NEEDS_INFO, APPROVED, REJECTED, CALLBACK_SCHEDULED, CLOSED" }

  # ---------------------------------------------------------------------------
  # Referral — cross-aggregate, self-referential (two Customers)
  # ---------------------------------------------------------------------------
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: referrer_customer_id, type: string, source: input, description: "FK -> Customer.id; the customer who owns the cited referral_code" }
      - { name: referred_customer_id, type: string, source: input, description: "FK -> Customer.id; the new customer; MUST differ from referrer_customer_id" }
      - { name: project_id, type: string, source: input, description: "Pointer to the referred customer's Project.id that may convert (validated to exist)" }
      - { name: credit_cents, type: integer, source: computed, description: "Credit value to be issued on conversion (REFERRAL_CREDIT_CENTS=15000)" }
      - { name: status, type: enum, source: system, description: "PENDING | CONVERTED | CLAWED_BACK | EXPIRED — CONVERTED on referred install COMPLETE, CLAWED_BACK if that project later CANCELLED", constraints: "PENDING, CONVERTED, CLAWED_BACK, EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Project: dimension 1 — sales_status (linear w/ DECLINE branch) ----
  - entity: Project
    field: sales_status
    initial_state: LEAD
    terminal_states: [DECLINED]
    note: "Sales pipeline. Independent of build_status (parallel dimensions on one entity)."
    transitions:
      - from: [LEAD, ASSESSED]
        to: ASSESSED
        trigger: "POST /projects/{id}/assessments"
        actor: SalesRep
        preconditions:
          - "Project.sales_status in {LEAD, ASSESSED} (re-measure allowed before QUOTED)"
        side_effects:
          - "Creates Assessment in APPROVED; computes condition_score, prep_tier, billable_crack_ft (calc condition_score)"
          - "Any prior APPROVED Assessment on the project -> SUPERSEDED"
          - "increments Project.version by 1"
      - from: ASSESSED
        to: QUOTED
        trigger: "POST /quotes/{id}/send (first SENT quote)"
        actor: SalesRep
        preconditions:
          - "Project.sales_status == ASSESSED"
          - "An APPROVED Assessment exists on the project"
        note: "Project moves to QUOTED on the FIRST send. Every send (first or later) increments Project.version because the project's current-offer set changed."
        side_effects:
          - "increments Project.version by 1 (on every send)"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Project.sales_status == QUOTED"
          - "Quote.status == SENT"
          - "Quote belongs to this Project"
          - "expected_project_version matches Project.version (OCC)"
        side_effects:
          - "Quote.status -> ACCEPTED; Project.accepted_quote_id set"
          - "All other SENT/DRAFT quotes on the project -> SUPERSEDED"
          - "If Project.referral_id set and its Referral.status==PENDING, Referral stays PENDING (converts only at install COMPLETE)"
          - "increments Project.version by 1"
      - from: [LEAD, ASSESSED, QUOTED]
        to: DECLINED
        trigger: "POST /projects/{id}/decline"
        actor: Customer
        preconditions:
          - "Project.sales_status in {LEAD, ASSESSED, QUOTED}"
          - "Project.build_status == PRE_BUILD (cannot decline once scheduled)"
        side_effects:
          - "All non-terminal Quotes on the project -> SUPERSEDED"
          - "increments Project.version by 1"

  # ---- Project: dimension 2 — build_status (branching w/ CANCELLED) ----
  - entity: Project
    field: build_status
    initial_state: PRE_BUILD
    terminal_states: [COMPLETE, CANCELLED]
    note: "Fulfilment dimension. Advances only after sales_status==ACCEPTED. Parallel to sales_status."
    transitions:
      - from: PRE_BUILD
        to: SCHEDULED
        trigger: "POST /projects/{id}/install-jobs"
        actor: Scheduler
        preconditions:
          - "Project.sales_status == ACCEPTED (cross-dimension guard)"
          - "Project.build_status == PRE_BUILD"
          - "Chosen Crew is metallic_certified if accepted quote's CoatingSystem.family==METALLIC"
          - "Crew has no other BOOKED/IN_PROGRESS InstallJob on the same UTC calendar day (ERR_CREW_DAY_DOUBLE_BOOKED — discrete day-bucket collision)"
          - "Customer has no other non-terminal InstallJob whose cure window [install_date, vehicle_traffic_ok_at) overlaps this one (ERR_SITE_CURE_WINDOW_OVERLAP — continuous half-open interval; touching endpoints do not overlap)"
          - "accepted quote priced_sqft <= Crew.max_sqft_per_day"
        side_effects:
          - "Creates InstallJob in BOOKED; computes install_end, foot_traffic_ok_at, vehicle_traffic_ok_at (calc cure_window)"
          - "increments Project.version by 1"
      - from: SCHEDULED
        to: INSTALLED
        trigger: "POST /install-jobs/{id}/complete"
        actor: Crew
        preconditions:
          - "Project.build_status == SCHEDULED"
          - "InstallJob.status == IN_PROGRESS"
        side_effects:
          - "InstallJob.status -> COMPLETED; captures as_measured_sqft, as_measured_crack_ft"
          - "Creates FINAL Quote (variant=FINAL) re-priced from as-measured sqft (calc quote_pricing)"
          - "Prior ACCEPTED ESTIMATE quote -> SUPERSEDED; Project.accepted_quote_id repointed to FINAL quote"
          - "increments Project.version by 1"
      - from: INSTALLED
        to: CURING
        trigger: "system on POST /install-jobs/{id}/complete (same call advances build to CURING)"
        actor: system
        preconditions:
          - "InstallJob.status == COMPLETED"
        note: "INSTALLED is a transient label set within the complete call; build_status lands on CURING."
        side_effects: []
      - from: CURING
        to: COMPLETE
        trigger: "POST /install-jobs/{id}/mark-cured (only at/after vehicle_traffic_ok_at)"
        actor: Scheduler
        preconditions:
          - "Project.build_status == CURING"
          - "logical clock now >= InstallJob.vehicle_traffic_ok_at"
        side_effects:
          - "InstallJob.status -> CURED"
          - "Creates Warranty in ACTIVE (covered_install_price_cents = FINAL quote grand_total_cents; coverage_start_at = vehicle_traffic_ok_at)"
          - "If Project.referral_id set and Referral.status==PENDING: Referral -> CONVERTED; referrer Customer.account_credit_balance_cents += 15000 (calc referral_credit_ledger)"
          - "increments Project.version by 1"
      - from: [PRE_BUILD, SCHEDULED, CURING]
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "Project.build_status in {PRE_BUILD, SCHEDULED, CURING}"
          - "expected_project_version matches Project.version (OCC)"
        side_effects:
          - "Any BOOKED/IN_PROGRESS InstallJob -> CANCELLED (frees crew day)"
          - "If a Warranty exists -> VOID"
          - "If Project.referral_id set and Referral.status==CONVERTED: Referral -> CLAWED_BACK; referrer Customer.account_credit_balance_cents -= 15000 (compensating)"
          - "increments Project.version by 1"

  # ---- Assessment: supersede mechanic (APPROVED -> SUPERSEDED) ----
  - entity: Assessment
    field: status
    initial_state: APPROVED
    terminal_states: [SUPERSEDED]
    note: "Each new assessment is born APPROVED and supersedes the prior APPROVED one."
    transitions:
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system on POST /projects/{id}/assessments (a newer assessment recorded)"
        actor: system
        preconditions:
          - "Assessment.status == APPROVED"
          - "A newer Assessment is being created on the same project"
        side_effects:
          - "Newer Assessment becomes the project's single APPROVED assessment"

  # ---- InstallJob: branching (BOOKED -> IN_PROGRESS -> COMPLETED -> CURED) + CANCELLED ----
  - entity: InstallJob
    field: status
    initial_state: BOOKED
    terminal_states: [CURED, CANCELLED]
    transitions:
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/start"
        actor: Crew
        preconditions:
          - "InstallJob.status == BOOKED"
          - "logical clock now >= InstallJob.install_date"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /install-jobs/{id}/complete"
        actor: Crew
        preconditions:
          - "InstallJob.status == IN_PROGRESS"
          - "as_measured_sqft provided and >= 1"
        side_effects:
          - "Drives Project.build_status SCHEDULED -> INSTALLED -> CURING"
          - "Creates FINAL Quote (cross-entity cascade)"
      - from: COMPLETED
        to: CURED
        trigger: "POST /install-jobs/{id}/mark-cured"
        actor: Scheduler
        preconditions:
          - "InstallJob.status == COMPLETED"
          - "logical clock now >= InstallJob.vehicle_traffic_ok_at"
        side_effects:
          - "Drives Project.build_status CURING -> COMPLETE; creates Warranty"
      - from: [BOOKED, IN_PROGRESS]
        to: CANCELLED
        trigger: "system on POST /projects/{id}/cancel"
        actor: system
        preconditions:
          - "InstallJob.status in {BOOKED, IN_PROGRESS}"
        side_effects:
          - "Frees the crew's install_date slot"

  # ---- Warranty: linear with VOID revert ----
  - entity: Warranty
    field: status
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: CLAIM_OPEN
        trigger: "POST /warranties/{id}/claims"
        actor: Customer
        preconditions:
          - "Warranty.status == ACTIVE"
          - "logical clock now < coverage_start_at + term_months (still in coverage window)"
        side_effects:
          - "Creates WarrantyClaim in SUBMITTED; computes months_elapsed"
      - from: CLAIM_OPEN
        to: ACTIVE
        trigger: "system when the open WarrantyClaim reaches CLOSED or REJECTED"
        actor: system
        preconditions:
          - "No other non-terminal WarrantyClaim on this warranty"
        side_effects: []
      - from: [ACTIVE, CLAIM_OPEN]
        to: VOID
        trigger: "system on POST /projects/{id}/cancel"
        actor: system
        preconditions:
          - "Owning Project transitions to CANCELLED"
        side_effects:
          - "Any non-terminal WarrantyClaim -> CLOSED"

  # ---- WarrantyClaim: CYCLIC (callback revision loop) ----
  - entity: WarrantyClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    note: "Cyclic: SUBMITTED -> NEEDS_INFO -> SUBMITTED loop on each callback round."
    transitions:
      - from: SUBMITTED
        to: NEEDS_INFO
        trigger: "POST /claims/{id}/review with action=REQUEST_INFO"
        actor: WarrantyAgent
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
        side_effects:
          - "Agent requests more evidence; claim awaits resubmission"
      - from: NEEDS_INFO
        to: SUBMITTED
        trigger: "POST /claims/{id}/resubmit"
        actor: Customer
        preconditions:
          - "WarrantyClaim.status == NEEDS_INFO"
        side_effects:
          - "increments WarrantyClaim.revision_rounds by 1 (cycle counter)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /claims/{id}/review with action=APPROVE"
        actor: WarrantyAgent
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "defect_type in {HOT_TIRE, PEEL} (OTHER cannot be approved for payout)"
        side_effects:
          - "Computes prorated_credit_cents (calc warranty_proration)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /claims/{id}/review with action=REJECT"
        actor: WarrantyAgent
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
        side_effects:
          - "prorated_credit_cents stays 0; bubbles Warranty CLAIM_OPEN -> ACTIVE"
      - from: APPROVED
        to: CALLBACK_SCHEDULED
        trigger: "POST /claims/{id}/schedule-callback"
        actor: WarrantyAgent
        preconditions:
          - "WarrantyClaim.status == APPROVED"
        side_effects: []
      - from: CALLBACK_SCHEDULED
        to: CLOSED
        trigger: "POST /claims/{id}/close"
        actor: WarrantyAgent
        preconditions:
          - "WarrantyClaim.status == CALLBACK_SCHEDULED"
        side_effects:
          - "Bubbles Warranty CLAIM_OPEN -> ACTIVE (compensation: re-arms coverage)"
      - from: [SUBMITTED, NEEDS_INFO, APPROVED, CALLBACK_SCHEDULED]
        to: CLOSED
        trigger: "system on owning Warranty -> VOID (POST /projects/{id}/cancel cascade)"
        actor: system
        preconditions:
          - "Owning Warranty transitions to VOID because its Project was cancelled"
        side_effects:
          - "Claim force-closed without payout (prorated_credit_cents stays 0)"

  # ---- Referral: lifecycle with claw-back compensation ----
  - entity: Referral
    field: status
    initial_state: PENDING
    terminal_states: [CLAWED_BACK, EXPIRED]
    transitions:
      - from: PENDING
        to: CONVERTED
        trigger: "system on referred Project build_status -> COMPLETE"
        actor: system
        preconditions:
          - "Referral.status == PENDING"
          - "Referred Project.build_status reaches COMPLETE"
        side_effects:
          - "referrer Customer.account_credit_balance_cents += credit_cents (15000)"
      - from: CONVERTED
        to: CLAWED_BACK
        trigger: "system on referred Project build_status -> CANCELLED"
        actor: system
        preconditions:
          - "Referral.status == CONVERTED"
        side_effects:
          - "referrer Customer.account_credit_balance_cents -= credit_cents (compensating invariant)"
      - from: PENDING
        to: EXPIRED
        trigger: "system on referred Project sales_status -> DECLINED"
        actor: system
        preconditions:
          - "Referral.status == PENDING"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-project
    parent_entity: Project
    write_endpoint: "POST /quotes/{id}/accept"
    occ_field: "expected_project_version"
    description: |
      Accepting a SENT Quote against a Project whose version has advanced since the
      client last observed it is rejected on a stale version. This captures the case
      where a newer SENT quote was issued on the same project (which supersedes prior
      quotes when accepted), so the client's view of the project — and of which quote
      is current — is stale. The OCC check reduces this to a deterministic stale-version
      comparison triggerable by two strictly sequential requests.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: project-cancel-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/cancel"
    occ_field: "expected_project_version"
    description: |
      Cancelling a Project whose version has advanced since the client last observed it
      is rejected on a stale version. A scheduling action (install-job booking) or a
      completion legitimately advanced the project between the client's read and this
      cancel; the cancel therefore acts on a stale view and is rejected. Reduces to a
      deterministic stale-version check across two strictly sequential requests.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (1) Condition score -> prep tier : weighted_scoring + threshold (Assessment domain) ---
  - name: condition_score
    trigger: "POST /projects/{id}/assessments (Project LEAD -> ASSESSED)"
    algorithm: weighted_scoring
    formula: |
      crack_norm = (min(crack_density, 50) / 50) * 100          # 0..100
      spall_pts  = 100 if spalling else 0
      raw = 0.30*oil_stain_pct + 0.40*crack_norm + 0.20*spall_pts + 0.10*moisture_pct
      condition_score = round_half_up(raw)                       # integer 0..100
      # prep_tier thresholds (>= boundaries, pinned):
      prep_tier = HEAVY    if condition_score >= 70
                  MODERATE if condition_score >= 35
                  LIGHT    otherwise
    input_set: "Single Assessment's input fields only; no cross-entity inputs."
    constants:
      W_OIL: 0.30
      W_CRACK: 0.40
      W_SPALL: 0.20
      W_MOIST: 0.10
      CRACK_DENSITY_CAP: 50
      TIER_HEAVY_MIN: 70
      TIER_MODERATE_MIN: 35
    precision: "round_half_up to integer score; tier comparison uses >= (inclusive lower bound)"

  # --- (2) Quote pricing : combinatorial (>=3 inputs, nested branches, pinned eval order) + DUAL VARIANT ---
  - name: quote_pricing
    trigger: "POST /projects/{id}/quotes (ESTIMATE) AND POST /install-jobs/{id}/complete (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # --- inputs differ by variant (this is the dual-variant axis) ---
      # ESTIMATE: sqft_in = Assessment.measured_sqft ; crack_ft_in = Assessment.crack_linear_ft
      # FINAL   : sqft_in = InstallJob.as_measured_sqft ; crack_ft_in = InstallJob.as_measured_crack_ft
      priced_sqft = max(sqft_in, MIN_BILLABLE_SQFT)              # small-job floor
      # system material (METALLIC carries a complexity multiplier on material only)
      base_material = SYSTEM_RATE[coating_system.sku] * priced_sqft
      system_material_cents = round_half_up(base_material * METALLIC_MULT) if coating_system.family==METALLIC
                              else base_material
      # prep labor: tier rate + crack adder beyond included, then seasonal multiplier on labor only
      base_labor = PREP_RATE[assessment.prep_tier] * priced_sqft
      included_ft = CRACK_INCLUDED_FT[assessment.prep_tier]
      extra_ft = max(0, crack_ft_in - included_ft)
      crack_add = extra_ft * CRACK_RATE_PER_FT
      prep_labor_cents = round_half_up((base_labor + crack_add) * SEASON_MULT[install_season])
      # PINNED EVALUATION ORDER: discount keyed on (system_material + prep_labor) BEFORE mobilization;
      # mobilization is added AFTER discount and is never discounted.
      pre_discount = system_material_cents + prep_labor_cents
      volume_pct = 0.10 if pre_discount >= 600000     # $6,000
                   0.05 if pre_discount >= 300000     # $3,000  (>= inclusive)
                   0.00 otherwise
      discount_cents = round_half_up(pre_discount * volume_pct)
      grand_total_cents = (pre_discount - discount_cents) + MOBILIZATION_CENTS
    input_set: "One Project's APPROVED Assessment (prep_tier) + selected CoatingSystem + install_season; sqft/crack source depends on variant."
    constants:
      SYSTEM_RATE: { FLAKE_STANDARD: 350, FLAKE_PREMIUM: 500, METALLIC: 800 }
      PREP_RATE: { LIGHT: 150, MODERATE: 275, HEAVY: 450 }
      CRACK_INCLUDED_FT: { LIGHT: 0, MODERATE: 10, HEAVY: 25 }
      CRACK_RATE_PER_FT: 900
      MIN_BILLABLE_SQFT: 250
      METALLIC_MULT: 1.20
      SEASON_MULT: { PEAK: 1.15, STANDARD: 1.00, OFF: 0.90 }
      MOBILIZATION_CENTS: 25000
      VOLUME_TIER_1_MIN: 300000
      VOLUME_TIER_2_MIN: 600000
    precision: "round_half_up to whole cents at each pinned step: material (after metallic mult), labor (after season mult), discount; mobilization is an exact constant added last"
    variants:
      - name: ESTIMATE
        when: "Quote created from the Assessment before install (POST /projects/{id}/quotes)"
        difference: "sqft_in = Assessment.measured_sqft, crack_ft_in = Assessment.crack_linear_ft; variant=ESTIMATE"
      - name: FINAL
        when: "Quote auto-created at install completion (POST /install-jobs/{id}/complete)"
        difference: "sqft_in = InstallJob.as_measured_sqft, crack_ft_in = InstallJob.as_measured_crack_ft; same formula, on-site numbers can diverge from estimate, producing a different grand_total_cents"

  # --- (3) Financing monthly payment : combinatorial (amortization branch on r==0; >=3 inputs) ---
  - name: financing_payment
    trigger: "On quote creation when financing_plan_id is set (ESTIMATE and FINAL)"
    algorithm: tiered_pricing
    formula: |
      # principal = the quote's grand_total_cents at creation
      r = (apr_bps / 10000) / 12                                 # monthly rate, decimal
      if r == 0:
        monthly_payment_cents = round_half_up(principal / term_months)
      else:
        monthly_payment_cents = round_half_up(
          principal * (r * (1+r)**term_months) / ((1+r)**term_months - 1) )
      # if financing_plan_id is null -> monthly_payment_cents = 0
    input_set: "Single Quote.grand_total_cents + chosen FinancingPlan.apr_bps + term_months."
    constants: {}
    precision: "round_half_up to whole cents on the final monthly payment; r computed at full double precision"

  # --- (4) Warranty proration : decay_function (WarrantyClaim domain) — DUAL-VARIANT by defect_type ---
  - name: warranty_proration
    trigger: "POST /claims/{id}/review with action=APPROVE (WarrantyClaim SUBMITTED -> APPROVED)"
    algorithm: decay_function
    formula: |
      months_elapsed = floor_whole_months(coverage_start_at -> reported_at)
      remaining = max(0, term_months - months_elapsed)
      defect_factor = PEEL_FACTOR     if defect_type == PEEL       # 1.00 — full delamination payout
                      HOT_TIRE_FACTOR if defect_type == HOT_TIRE   # 0.50 — partial (cosmetic lift) payout
      prorated_credit_cents = round_half_up(
          covered_install_price_cents * (remaining / term_months) * defect_factor)
      # term_months default 180; remaining clamped at 0 past term (no negative payout)
    input_set: "Single WarrantyClaim (defect_type) + its Warranty.covered_install_price_cents + coverage_start_at."
    constants:
      DEFAULT_TERM_MONTHS: 180
      PEEL_FACTOR: 1.00
      HOT_TIRE_FACTOR: 0.50
    precision: "round_half_up to whole cents on the final product; remaining floored at 0; months_elapsed is whole-month floor"
    variants:
      - name: PEEL
        when: "defect_type == PEEL"
        difference: "Full prorated payout (defect_factor=1.00): peel/delamination is a full-coat failure."
      - name: HOT_TIRE
        when: "defect_type == HOT_TIRE"
        difference: "Half prorated payout (defect_factor=0.50): hot-tire lift is a localized cosmetic defect, so for identical covered_install_price_cents and months_elapsed a HOT_TIRE claim pays exactly half what a PEEL claim pays."

  # --- (5) Cure window : interval projection with family-conditional extension ---
  - name: cure_window
    trigger: "POST /projects/{id}/install-jobs (InstallJob created)"
    algorithm: projection
    formula: |
      install_end = install_date + INSTALL_DURATION_HOURS hours
      foot_traffic_ok_at = install_end + FOOT_TRAFFIC_HOURS hours
      vehicle_base = install_end + VEHICLE_TRAFFIC_HOURS hours
      vehicle_traffic_ok_at = vehicle_base + (METALLIC_EXTRA_CURE_HOURS hours if accepted quote's
                              CoatingSystem.family == METALLIC else 0)
      # vehicle_traffic_ok_at is the hot-tire cure deadline; mark-cured is gated on it.
    input_set: "Single InstallJob.install_date + the accepted quote's CoatingSystem.family."
    constants:
      INSTALL_DURATION_HOURS: 8
      FOOT_TRAFFIC_HOURS: 24
      VEHICLE_TRAFFIC_HOURS: 72
      METALLIC_EXTRA_CURE_HOURS: 24
    precision: "exact datetime arithmetic in UTC; second-level precision"

  # --- (6) Referral credit ledger : aggregation over a conserved quantity ---
  - name: referral_credit_ledger
    trigger: "Referral PENDING -> CONVERTED (install COMPLETE) and CONVERTED -> CLAWED_BACK (project CANCELLED)"
    algorithm: aggregation
    formula: |
      Customer.account_credit_balance_cents =
        REFERRAL_CREDIT_CENTS * count(Referral r WHERE r.referrer_customer_id == Customer.id
                                       AND r.status == CONVERTED)
      # CONVERTED adds one credit; CLAWED_BACK removes it (count drops). Conserved invariant:
      # sum over all Customers of account_credit_balance_cents
      #   == REFERRAL_CREDIT_CENTS * count(all Referrals with status==CONVERTED)
    input_set: "All Referrals with status==CONVERTED grouped by referrer_customer_id; ordering irrelevant (count-based, commutative)."
    constants:
      REFERRAL_CREDIT_CENTS: 15000
    precision: "exact integer cents; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Customer acting on a Project/Quote/Warranty must own it (X-User-ID == Project.customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-owned endpoints: accept, decline, claim create, resubmit"
  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "Body reference fields resolve to existing rows (customer_id, crew_id, coating_system_id, color_option_id, financing_plan_id, assessment_id, project_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints with reference body fields"
  - priority: 6
    category: business_referential
    check: "color_option_id must belong to coating_system_id (ColorOption.coating_system_id == Quote.coating_system_id)"
    error_id: ERR_COLOR_SYSTEM_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/quotes"
  - priority: 7
    category: business_referential
    check: "Referral.referred_customer_id must differ from referrer_customer_id"
    error_id: ERR_SELF_REFERRAL
    http_status: 422
    applies_to: "POST /referrals"
  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: state
    check: "Cross-dimension guard: Project.build_status may not advance to SCHEDULED unless sales_status==ACCEPTED"
    error_id: ERR_SALES_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs"
  - priority: 10
    category: business_constraint
    check: "Quote's assessment_id must reference an APPROVED Assessment on the project (not SUPERSEDED)"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /projects/{id}/quotes"
  - priority: 11
    category: business_safety
    check: "METALLIC system install requires a metallic_certified crew"
    error_id: ERR_CREW_NOT_METALLIC_CERTIFIED
    http_status: 422
    applies_to: "POST /projects/{id}/install-jobs"
  - priority: 12
    category: business_temporal
    check: "Crew-day overlap (DISCRETE day-bucket): the chosen Crew may not already have a BOOKED/IN_PROGRESS InstallJob whose install_date is the same UTC calendar day (point collision on a day bucket; two jobs collide iff floor(install_date to day) is equal)"
    error_id: ERR_CREW_DAY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs"
  - priority: 13
    category: business_temporal
    check: "Site cure-window overlap (CONTINUOUS half-open interval): the new install's cure window [install_date, vehicle_traffic_ok_at) may not overlap the cure window of another non-terminal (BOOKED/IN_PROGRESS/COMPLETED) InstallJob belonging to a DIFFERENT project of the SAME Customer; touching endpoints (a.vehicle_traffic_ok_at == b.install_date) do NOT overlap"
    error_id: ERR_SITE_CURE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs"
  - priority: 14
    category: business_constraint
    check: "Accepted quote priced_sqft must not exceed Crew.max_sqft_per_day"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /projects/{id}/install-jobs"
  - priority: 15
    category: business_temporal
    check: "mark-cured allowed only when logical clock >= InstallJob.vehicle_traffic_ok_at"
    error_id: ERR_CURE_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /install-jobs/{id}/mark-cured"
  - priority: 16
    category: business_temporal
    check: "start allowed only when logical clock >= InstallJob.install_date"
    error_id: ERR_INSTALL_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /install-jobs/{id}/start"
  - priority: 17
    category: business_temporal
    check: "Warranty claim allowed only within coverage window (now < coverage_start_at + term_months)"
    error_id: ERR_COVERAGE_EXPIRED
    http_status: 409
    applies_to: "POST /warranties/{id}/claims"
  - priority: 18
    category: business_constraint
    check: "Only HOT_TIRE or PEEL claims may be approved for payout; OTHER cannot"
    error_id: ERR_DEFECT_NOT_COVERED
    http_status: 422
    applies_to: "POST /claims/{id}/review with action=APPROVE"
  - priority: 19
    category: business_fiscal
    check: "Financing plan eligibility: quote grand_total_cents >= plan.min_principal_cents"
    error_id: ERR_FINANCING_PRINCIPAL_TOO_LOW
    http_status: 422
    applies_to: "POST /projects/{id}/quotes"
  - priority: 20
    category: business_constraint
    check: "OCC: expected_project_version must equal Project.version on guarded writes"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/accept, POST /projects/{id}/cancel"
  - priority: 21
    category: business_constraint
    check: "Required body fields present and within declared constraints (sqft>=1, pct 0..100, etc.)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-04-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets logical clock used for install_date, cure deadlines, coverage windows"]

  # ---- Catalogs ----
  - method: POST
    path: "/coating-systems"
    description: "Create a coating system"
    roles: [PlatformAdmin]
    code: 201
    input: [name, family, sku, "active?"]
    output: CoatingSystem
    side_effects: ["requires_metallic_certified_crew computed = (family==METALLIC)"]
  - method: GET
    path: "/coating-systems/{id}"
    description: "Get a coating system"
    roles: [PlatformAdmin, SalesRep, Scheduler, WarrantyAgent, Customer]
    code: 200
    input: []
    output: CoatingSystem
    side_effects: []
  - method: POST
    path: "/color-options"
    description: "Create a color option under a coating system"
    roles: [PlatformAdmin]
    code: 201
    input: [coating_system_id, name, flake_blend_code, "active?"]
    output: ColorOption
    side_effects: []
  - method: GET
    path: "/coating-systems/{id}/color-options"
    description: "List color options belonging to a coating system (reverse-reachability for ColorOption.coating_system_id)"
    roles: [PlatformAdmin, SalesRep, Scheduler, WarrantyAgent, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ColorOption[]
    side_effects: []
  - method: POST
    path: "/financing-plans"
    description: "Create a financing plan"
    roles: [PlatformAdmin]
    code: 201
    input: [name, apr_bps, term_months, "min_principal_cents?", "active?"]
    output: FinancingPlan
    side_effects: []
  - method: POST
    path: "/crews"
    description: "Create an install crew"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "metallic_certified?", max_sqft_per_day, "active?"]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Get a crew"
    roles: [PlatformAdmin, Scheduler]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}/install-jobs"
    description: "List install jobs booked to a crew (reverse-reachability for InstallJob.crew_id)"
    roles: [PlatformAdmin, Scheduler]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallJob[]
    side_effects: []

  # ---- Customers ----
  - method: POST
    path: "/customers"
    description: "Create a customer; server mints referral_code, account_credit_balance_cents=0"
    roles: [PlatformAdmin, SalesRep]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["mints referral_code", "account_credit_balance_cents = 0"]
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (includes account_credit_balance_cents, referral_code)"
    roles: [PlatformAdmin, SalesRep, WarrantyAgent, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}/projects"
    description: "List a customer's projects (reverse-reachability for Project.customer_id)"
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/referrals"
    description: "List referrals where this customer is referrer or referred (reverse-reachability for Referral.referrer_customer_id and Referral.referred_customer_id)"
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: ["role?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  # ---- Projects ----
  - method: POST
    path: "/projects"
    description: "Create a project (LEAD/PRE_BUILD). Optional referral_code creates a Referral row."
    roles: [SalesRep]
    code: 201
    input: [customer_id, site_zip, "referral_code?"]
    output: Project
    side_effects:
      - "sales_status=LEAD, build_status=PRE_BUILD, version=1"
      - "If referral_code matches another Customer.referral_code: creates Referral (PENDING) and sets Project.referral_id"
  - method: GET
    path: "/projects/{id}"
    description: "Get a project (both status dimensions, version, accepted_quote_id, referral_id)"
    roles: [PlatformAdmin, SalesRep, Scheduler, WarrantyAgent, Customer]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/projects/{id}/assessments"
    description: "Record measurement & condition; computes condition_score, prep_tier, billable_crack_ft; supersedes prior assessment"
    roles: [SalesRep]
    code: 201
    input: [measured_sqft, oil_stain_pct, crack_density, crack_linear_ft, spalling, moisture_pct]
    output: Assessment
    side_effects:
      - "Project.sales_status {LEAD,ASSESSED} -> ASSESSED"
      - "Assessment created APPROVED; computes condition_score, prep_tier, billable_crack_ft (calc condition_score)"
      - "Prior APPROVED Assessment -> SUPERSEDED"
      - "increments Project.version by 1"
  - method: GET
    path: "/projects/{id}/assessments"
    description: "List assessments on a project (reverse-reachability for Assessment.project_id)"
    roles: [PlatformAdmin, SalesRep, Scheduler]
    code: 200
    input: ["limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/quotes"
    description: "Create an ESTIMATE quote priced from the APPROVED assessment (prep_tier + measured sqft + crack)"
    roles: [SalesRep]
    code: 201
    input: [assessment_id, coating_system_id, color_option_id, install_season, "financing_plan_id?"]
    output: Quote
    side_effects:
      - "variant=ESTIMATE, status=DRAFT"
      - "Prices system_material, prep_labor, discount, mobilization, grand_total (calc quote_pricing)"
      - "If financing_plan_id set: monthly_payment_cents (calc financing_payment)"
  - method: GET
    path: "/projects/{id}/quotes"
    description: "List quotes on a project, optionally filtered by variant (reverse-reachability for Quote.project_id)"
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: GET
    path: "/quotes/{id}"
    description: "Get a quote (all priced fields, variant, status, monthly_payment_cents)"
    roles: [PlatformAdmin, SalesRep, Scheduler, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a DRAFT quote to the customer; first send moves Project.sales_status ASSESSED -> QUOTED. Every send mutates the project's quote set and increments Project.version."
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "Quote.status DRAFT -> SENT"
      - "If first SENT quote on the project: Project.sales_status ASSESSED -> QUOTED"
      - "increments Project.version by 1 (on every send, since the project's current-offer set changed)"
  - method: POST
    path: "/quotes/{id}/accept"
    description: "Customer accepts a SENT quote (OCC-guarded on project version)"
    roles: [Customer]
    code: 200
    input: [expected_project_version]
    output: Quote
    side_effects:
      - "Quote.status -> ACCEPTED; Project.sales_status QUOTED -> ACCEPTED; Project.accepted_quote_id set"
      - "Other non-terminal quotes -> SUPERSEDED"
      - "increments Project.version by 1"
  - method: POST
    path: "/projects/{id}/decline"
    description: "Customer declines the project (sales_status -> DECLINED); expires a PENDING referral"
    roles: [Customer]
    code: 200
    input: []
    output: Project
    side_effects:
      - "sales_status -> DECLINED; non-terminal quotes -> SUPERSEDED"
      - "If referral PENDING -> EXPIRED"
      - "increments Project.version by 1"
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Admin cancels a project (build_status -> CANCELLED), OCC-guarded; voids warranty, claws back converted referral"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_project_version]
    output: Project
    side_effects:
      - "build_status -> CANCELLED; BOOKED/IN_PROGRESS InstallJob -> CANCELLED"
      - "Warranty -> VOID (non-terminal claims -> CLOSED)"
      - "If referral CONVERTED -> CLAWED_BACK; referrer credit -= 15000 (calc referral_credit_ledger)"
      - "increments Project.version by 1"

  # ---- Install jobs ----
  - method: POST
    path: "/projects/{id}/install-jobs"
    description: "Book the one-day install to a crew (build_status PRE_BUILD -> SCHEDULED)"
    roles: [Scheduler]
    code: 201
    input: [crew_id, install_date]
    output: InstallJob
    side_effects:
      - "InstallJob BOOKED; computes install_end, foot_traffic_ok_at, vehicle_traffic_ok_at (calc cure_window)"
      - "Project.build_status PRE_BUILD -> SCHEDULED; increments Project.version by 1"
  - method: GET
    path: "/projects/{id}/install-jobs"
    description: "List install jobs on a project (reverse-reachability for InstallJob.project_id)"
    roles: [PlatformAdmin, Scheduler, Crew]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallJob[]
    side_effects: []
  - method: POST
    path: "/install-jobs/{id}/start"
    description: "Crew starts the install (BOOKED -> IN_PROGRESS); only at/after install_date"
    roles: [Crew]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob.status -> IN_PROGRESS"]
  - method: POST
    path: "/install-jobs/{id}/complete"
    description: "Crew completes the install with on-site measurements (IN_PROGRESS -> COMPLETED); creates FINAL quote and advances build to CURING"
    roles: [Crew]
    code: 200
    input: [as_measured_sqft, as_measured_crack_ft]
    output: InstallJob
    side_effects:
      - "InstallJob.status -> COMPLETED; captures as_measured_sqft, as_measured_crack_ft"
      - "Creates FINAL Quote re-priced from on-site sqft (calc quote_pricing); prior ACCEPTED quote -> SUPERSEDED; Project.accepted_quote_id repointed"
      - "Project.build_status SCHEDULED -> INSTALLED -> CURING; increments Project.version by 1"
  - method: POST
    path: "/install-jobs/{id}/mark-cured"
    description: "Scheduler marks the install cured after the vehicle-traffic deadline (COMPLETED -> CURED); creates Warranty and may convert referral"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallJob
    side_effects:
      - "InstallJob.status -> CURED; Project.build_status CURING -> COMPLETE"
      - "Creates Warranty (ACTIVE); covered_install_price_cents = FINAL quote grand_total_cents"
      - "If referral PENDING -> CONVERTED; referrer credit += 15000 (calc referral_credit_ledger)"
      - "increments Project.version by 1"

  # ---- Warranties & claims ----
  - method: GET
    path: "/warranties/{id}"
    description: "Get a warranty"
    roles: [PlatformAdmin, WarrantyAgent, Customer]
    code: 200
    input: []
    output: Warranty
    side_effects: []
  - method: GET
    path: "/projects/{id}/warranties"
    description: "List warranties on a project (reverse-reachability for Warranty.project_id)"
    roles: [PlatformAdmin, WarrantyAgent, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Warranty[]
    side_effects: []
  - method: POST
    path: "/warranties/{id}/claims"
    description: "Customer files a warranty/callback claim (ACTIVE -> CLAIM_OPEN); computes months_elapsed"
    roles: [Customer]
    code: 201
    input: [defect_type]
    output: WarrantyClaim
    side_effects:
      - "Creates WarrantyClaim SUBMITTED; Warranty.status -> CLAIM_OPEN"
      - "Computes months_elapsed from coverage_start_at to clock now"
  - method: GET
    path: "/warranties/{id}/claims"
    description: "List claims on a warranty (reverse-reachability for WarrantyClaim.warranty_id)"
    roles: [PlatformAdmin, WarrantyAgent, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/claims/{id}"
    description: "Get a warranty claim (status, revision_rounds, prorated_credit_cents, months_elapsed)"
    roles: [PlatformAdmin, WarrantyAgent, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/claims/{id}/review"
    description: "Agent reviews a SUBMITTED claim: action REQUEST_INFO (->NEEDS_INFO), APPROVE (->APPROVED, computes prorated_credit), or REJECT (->REJECTED, bubbles Warranty to ACTIVE)"
    roles: [WarrantyAgent]
    code: 200
    input: [action]
    output: WarrantyClaim
    side_effects:
      - "action=REQUEST_INFO: status -> NEEDS_INFO"
      - "action=APPROVE: status -> APPROVED; prorated_credit_cents (calc warranty_proration); requires defect_type in {HOT_TIRE, PEEL}"
      - "action=REJECT: status -> REJECTED; Warranty CLAIM_OPEN -> ACTIVE"
  - method: POST
    path: "/claims/{id}/resubmit"
    description: "Customer resubmits (NEEDS_INFO -> SUBMITTED); increments revision_rounds (cycle)"
    roles: [Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status -> SUBMITTED; revision_rounds += 1"]
  - method: POST
    path: "/claims/{id}/schedule-callback"
    description: "Agent schedules the repair callback (APPROVED -> CALLBACK_SCHEDULED)"
    roles: [WarrantyAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status -> CALLBACK_SCHEDULED"]
  - method: POST
    path: "/claims/{id}/close"
    description: "Agent closes a scheduled callback (CALLBACK_SCHEDULED -> CLOSED); bubbles Warranty to ACTIVE"
    roles: [WarrantyAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status -> CLOSED; Warranty CLAIM_OPEN -> ACTIVE"]

  # ---- Referrals ----
  - method: POST
    path: "/referrals"
    description: "Create a referral linking referrer + referred customers and the referred project"
    roles: [SalesRep]
    code: 201
    input: [referrer_customer_id, referred_customer_id, project_id]
    output: Referral
    side_effects: ["status=PENDING; credit_cents=15000; sets Project.referral_id"]
  - method: GET
    path: "/referrals/{id}"
    description: "Get a referral"
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: []
    output: Referral
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on a project/quote/warranty they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body reference (customer/crew/coating_system/color/financing/assessment/project) does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field or value outside declared constraints (sqft>=1, pct 0..100, term bounds)" }
  - { id: ERR_COLOR_SYSTEM_MISMATCH, http: 422, condition: "Selected color_option_id does not belong to coating_system_id" }
  - { id: ERR_SELF_REFERRAL, http: 422, condition: "Referral referrer and referred customer are the same" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state (either status dimension)" }
  - { id: ERR_SALES_NOT_ACCEPTED, http: 409, condition: "Install booking attempted while sales_status != ACCEPTED" }
  - { id: ERR_ASSESSMENT_NOT_APPROVED, http: 409, condition: "Quote creation references an assessment that is SUPERSEDED or not on the project" }
  - { id: ERR_CREW_NOT_METALLIC_CERTIFIED, http: 422, condition: "METALLIC system booked to a crew without metallic_certified" }
  - { id: ERR_CREW_DAY_DOUBLE_BOOKED, http: 409, condition: "Crew already has a BOOKED/IN_PROGRESS install on the same UTC calendar day (discrete day-bucket point collision)" }
  - { id: ERR_SITE_CURE_WINDOW_OVERLAP, http: 409, condition: "New install's cure window [install_date, vehicle_traffic_ok_at) overlaps another non-terminal install of the same customer (continuous half-open interval overlap)" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 422, condition: "Accepted quote priced_sqft exceeds crew max_sqft_per_day" }
  - { id: ERR_CURE_WINDOW_NOT_ELAPSED, http: 409, condition: "mark-cured before logical clock reaches vehicle_traffic_ok_at" }
  - { id: ERR_INSTALL_DATE_NOT_REACHED, http: 409, condition: "start before logical clock reaches install_date" }
  - { id: ERR_COVERAGE_EXPIRED, http: 409, condition: "Warranty claim filed after coverage window (now >= coverage_start_at + term_months)" }
  - { id: ERR_DEFECT_NOT_COVERED, http: 422, condition: "Claim approve attempted for defect_type OTHER (only HOT_TIRE/PEEL payable)" }
  - { id: ERR_FINANCING_PRINCIPAL_TOO_LOW, http: 422, condition: "Quote grand_total_cents below the financing plan's min_principal_cents" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match Project.version on OCC-guarded write" }
  - { id: ERR_PROJECT_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted while build_status already terminal (COMPLETE or CANCELLED)" }
  - { id: ERR_DECLINE_AFTER_SCHEDULED, http: 409, condition: "Decline attempted after build_status left PRE_BUILD" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations admin; manages catalogs, the logical clock, and cancellations."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /coating-systems"
      - "POST /color-options"
      - "POST /financing-plans"
      - "POST /crews"
      - "POST /projects/{id}/cancel"
    shared_operations:
      - "GET on all resources"
      - "POST /customers"

  - name: SalesRep
    description: "Owns the sales pipeline: leads, assessments (incl. derived grind/crack prep scope), quotes, referrals."
    identity: opaque
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/assessments"
      - "POST /projects/{id}/quotes"
      - "POST /quotes/{id}/send"
      - "POST /referrals"
    shared_operations:
      - "POST /customers"
      - "GET on projects, quotes, assessments, customers, referrals, catalogs"

  - name: Scheduler
    description: "Owns install booking and crews."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/install-jobs"
      - "POST /install-jobs/{id}/mark-cured"
    shared_operations:
      - "GET on projects, install-jobs, crews, quotes, assessments, catalogs"

  - name: Crew
    description: "On-site install crew; starts and completes installs with on-site measurements."
    identity: entity_backed:Crew
    exclusive_operations:
      - "POST /install-jobs/{id}/start"
      - "POST /install-jobs/{id}/complete"
    shared_operations:
      - "GET on install-jobs"

  - name: WarrantyAgent
    description: "Owns warranties and the claim/callback lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/review (action REQUEST_INFO | APPROVE | REJECT)"
      - "POST /claims/{id}/schedule-callback"
      - "POST /claims/{id}/close"
    shared_operations:
      - "GET on warranties, claims, projects, customers"

  - name: Customer
    description: "Homeowner; accepts/declines quotes, files & resubmits warranty claims, owns referrals."
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /quotes/{id}/accept"
      - "POST /projects/{id}/decline"
      - "POST /warranties/{id}/claims"
      - "POST /claims/{id}/resubmit"
    shared_operations:
      - "GET on own projects, quotes, warranties, claims, install-jobs, referrals, catalogs"
