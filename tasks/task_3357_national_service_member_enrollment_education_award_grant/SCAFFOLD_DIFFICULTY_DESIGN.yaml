              captures: { slot_a: $.data.slot_id }
          trigger:
            - call: "POST /enrollments/${enr_a}/exit"
              payload: { exit_reason: "FOR_CAUSE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /members/${m_a}"
              payload: {}
              as: CNCSProgramOfficer
            - call: "GET /slots/${slot_a}"
              payload: {}
              as: CNCSProgramOfficer
            - call: "GET /education-awards"
              payload: { enrollment_id: "${enr_a}" }
              as: CNCSProgramOfficer
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_a}", term_category: "FULL_TIME", service_start_date: "2026-11-01", service_end_date: "2027-09-01", expected_award_version: "${award_v1} + 1" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "MemberEnrollment.${enr_a}.status == RELEASED_FOR_CAUSE and education_award_id is null"
            - "hop 2 (member): Member.${m_a}.status == DEBARRED and for_cause_release_count == 1"
            - "hop 2 (slot): PositionSlot.${slot_a} went FILLED -> VACATED, and hop 3 (refill evaluation): status == OPEN again with fill_count == 1 because the award is ACTIVE"
            - "no EducationAward exists for the enrollment (list filtered by enrollment_id returns 0 rows)"
            - "hop 2 consequence: re-enrolling the debarred member fails 422 with error_id == ERR_MEMBER_INELIGIBLE (even though a slot is OPEN)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_enrollment_state_beats_allowance_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=35]
          - errors.ERR_ENROLLMENT_NOT_ACTIVE
          - errors.ERR_ALLOWANCE_PERIOD_CAP_EXCEEDED
        distinguishing_aspect: "Category pair state vs business_fiscal: a payment of 200000 cents on a SUSPENDED enrollment violates both the ACTIVE-state precondition (priority 10) and the 100000 period cap (priority 35) — the state error ERR_ENROLLMENT_NOT_ACTIVE (409) must win, not the fiscal ERR_ALLOWANCE_PERIOD_CAP_EXCEEDED (422)."
        test_recipe:
          setup:
            - "Award ACTIVE; member A enrolled and ACTIVE; enrollment manually suspended by the org."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - *d_submit
            - *d_clock_close
            - *d_close
            - *d_award_4m
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - *d_enroll_a
            - call: "POST /enrollments/${enr_a}/suspend"
              payload: { reason: "Conduct investigation" }
              as: GranteeStaff
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /enrollments/${enr_a}/allowance-payments"
              payload: { amount_cents: 200000 }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENROLLMENT_NOT_ACTIVE"
            - "error_id != ERR_ALLOWANCE_PERIOD_CAP_EXCEEDED (state priority 10 beats fiscal priority 35)"
            - "MemberEnrollment.${enr_a}.allowance_paid_cents == 0 (no ledger movement on the rejected payment)"

      - name: flagged_check_safety_beats_slot_constraint
        grounds:
          - validations[priority=18]
          - validations[priority=28]
          - errors.ERR_CRIMINAL_CHECK_FLAGGED
          - errors.ERR_NO_OPEN_SLOT
        distinguishing_aspect: "Category pair business_safety vs business_constraint: member B's latest criminal check adjudicated FLAGGED (priority 18) AND the award has no OPEN FULL_TIME slot (priority 28) — enrollment creation must fail with ERR_CRIMINAL_CHECK_FLAGGED (422), not ERR_NO_OPEN_SLOT (409)."
        test_recipe:
          setup:
            - "Award with exactly 1 FULL_TIME slot, filled by member A (ACTIVE). Member B registered; B's check adjudicated FLAGGED (NSOPR FLAGGED, others CLEAR)."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - &d_app_1ft
              call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 2300000, slot_requests: [{ term_category: "FULL_TIME", count: 1 }], match_lines: [{ category: "CASH", amount_cents: 560000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - *d_submit
            - *d_clock_close
            - *d_close
            - &d_award_23m
