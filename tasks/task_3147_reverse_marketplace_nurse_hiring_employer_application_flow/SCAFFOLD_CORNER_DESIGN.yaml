              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_ev: $.data.error_id }
          assert:
            - "err_ev == ERR_FORBIDDEN"
            - "LicenseVerification.${lic_id}.status remains PENDING"

      - name: candidate_shared_read_scope_excludes_screenings
        claim_type: role_shared_operations
        grounds:
          - roles.Candidate
        distinguishing_aspect: "The Candidate can read own applications, interviews, offers, documents and placements, but GET /marketplace/screenings/{id} and GET /marketplace/applications/{id}/screenings are NOT in the Candidate's surface (Employer/PlatformAdmin only) — a Candidate read there is ERR_FORBIDDEN."
