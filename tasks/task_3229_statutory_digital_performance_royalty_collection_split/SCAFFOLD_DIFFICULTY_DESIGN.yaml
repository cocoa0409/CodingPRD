  - rule_id: transitive_cascade
    instances:
      - name: audit_shortfall_suspends_licensee_rejects_pipeline_reports
        grounds:
          - state_machines.AuditCase.FINDINGS_ISSUED_to_SETTLED
          - state_machines.Licensee.ACTIVE_to_SUSPENDED
          - state_machines.UsageReport.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Depth-4 chain from the record_recovery trigger: audit settles
          (link 1: recovery recorded, assessment not met) -> the settlement
          itself suspends the licensee (link 2) -> the suspension itself
          auto-rejects every SUBMITTED usage report (link 3) -> the licensee's
          new submission is refused with ERR_LICENSEE_NOT_ACTIVE (link 4,
          observable state consequence). Each link is caused by the previous
          link's mutation, not by the original API call.
        test_recipe:
          setup:
            - "Licensee L (ACTIVE) under Schedule NS-1; report C (2026-03-01..2026-03-31, 40000000 perfs) paid (due 104000)"
            - "AuditCase over March with findings issued: declared true 50000000 perfs -> assessed 84500"
            - "A second report D (2026-04-01..2026-04-30, 1000 perfs) sitting in SUBMITTED status"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
