          - "entities.ReplenishmentOrder.fields.credit_applied_cents"
        distinguishing_aspect: "Applying 400 of a 1000-cent balance to a 2000-cent OPEN order moves exactly 400 cents across all three derived fields (balance 600, due 1600, applied 400) and the order stays OPEN."
        test_recipe:
          setup:
            - "Order O1 (1 case base 1000) delivered then SETTLED; claim on O1 (10 units exp 2026-07-30) approved -> balance 1000, no OPEN order so nothing auto-applied"
