        distinguishing_aspect: |
          Entity pair (REOAsset, WorkoutPlan). Whether an REO acquisition is legal is decided by a
          field two hops away — the alternative_type of the WorkoutAlternative that the source plan
          selected. A plan that executed a MODIFICATION cannot yield a FORECLOSURE acquisition, and a
          plan that executed a FORECLOSURE cannot yield a DEED_IN_LIEU acquisition even though both
          types are REO-eligible in the abstract; only the exactly matching pair is accepted. The
          request body alone is identical in shape in all three probes.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "One trust with a 40,000,000.00 controlling class balance."
            - "Loan M with an EXECUTED plan whose selected alternative is MODIFICATION; loan F with an EXECUTED plan whose selected alternative is FORECLOSURE."
            - "Both loans hold a fresh ACCEPTED UPDATE appraisal as of 2026-08-01 so both executions were legal, and both plans were consented to by the controlling class."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-K1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
