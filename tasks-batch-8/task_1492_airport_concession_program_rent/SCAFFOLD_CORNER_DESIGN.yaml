            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst }
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 1200000, method: "ACH" }, as: Tenant, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/recalculate", payload: {}, as: ConcessionAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SETTLEMENT_STATE_FORBIDS"

      - name: resolve_resolved_violation_returns_violation_already_resolved
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_VIOLATION_ALREADY_RESOLVED]"]
        distinguishing_aspect: "Resolving an already-RESOLVED violation returns ERR_VIOLATION_ALREADY_RESOLVED."
        test_recipe:
          setup: ["ACTIVE lease; violation created and resolved"]
          setup_api_calls:
