              captures: { set_id: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Opera Guild School", account_kind: INSTITUTION, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 2, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
            - call: "POST /library/rental-orders/${o1}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rights-advisory-cases"
              payload: { account_id: "${acct_id}", work_id: "${work_id}", venue_kind: EDUCATIONAL, question: "Staged scene with costumes?" }
              as: RightsAdvisor
              captures: { case1: $.data.id }
          trigger:
            - call: "POST /library/rental-orders/${o1}/dispatch"
              payload: {}
              as: LibraryClerk
              captures: { err_open: $.data.error_id }
            - call: "POST /library/rights-advisory-cases/${case1}/decide"
              payload: { determination: "LICENSE_REQUIRED" }
              as: RightsAdvisor
            - call: "POST /library/rental-orders/${o1}/dispatch"
              payload: {}
              as: LibraryClerk
              captures: { err_lic: $.data.error_id }
            - call: "POST /library/rights-advisory-cases"
              payload: { account_id: "${acct_id}", work_id: "${work_id}", venue_kind: EDUCATIONAL, question: "Concert performance, no staging" }
              as: RightsAdvisor
              captures: { case2: $.data.id }
            - call: "POST /library/rights-advisory-cases/${case2}/decide"
              payload: { determination: "CLEARED" }
              as: RightsAdvisor
            - call: "POST /library/rental-orders/${o1}/dispatch"
              payload: {}
              as: LibraryClerk
              captures: { final_status: $.data.status }
          assert:
            - "case OPEN: dispatch error_id == ERR_RIGHTS_NOT_CLEARED (409)"
            - "case DECIDED LICENSE_REQUIRED: dispatch error_id == ERR_RIGHTS_NOT_CLEARED"
            - "after DECIDED CLEARED: RentalOrder.${o1}.status == DISPATCHED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_copy_half_open_adjacency
        grounds:
          - calculations.set_availability_projection
          - validations[priority=9]
          - errors[ERR_INSUFFICIENT_COPIES]
        distinguishing_aspect: |
          Half-open interval semantics on RentalSet copies: windows touching at a boundary
          ([08-05,09-04) and [09-04,10-04)) do NOT conflict, while a one-day-earlier checkout
          (09-03) DOES — adjacency is permitted, intersection by a single day is not.
        test_recipe:
          setup:
            - "1-copy set; O1 RESERVED [08-05, 09-04); O2 adjacent [09-04, 10-04); O3 overlapping [09-03, 10-03)"
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Pub Fifteen" }
              as: LibraryAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${pub_id}", title: "Solo Pieces", catalog_number: "P15-001", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { work_id: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${work_id}", set_code: "SET-1301", copy_count: 1, replacement_value_cents: 8000 }
              as: LibraryAdmin
              captures: { set_id: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Elm HS", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
            - call: "POST /library/rental-orders/${o1}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 1, checkout_date: "2026-09-04", due_date: "2026-10-04" }
              as: LibraryClerk
              captures: { o2: $.data.id }
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 1, checkout_date: "2026-09-03", due_date: "2026-10-03" }
              as: LibraryClerk
              captures: { o3: $.data.id }
          trigger:
            - call: "POST /library/rental-orders/${o2}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { o2_status: $.data.status }
            - call: "POST /library/rental-orders/${o3}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { err3: $.data.error_id }
          assert:
            - "adjacent (touch at 09-04): RentalOrder.${o2}.status == RESERVED"
            - "one-day overlap (09-03 checkout): error_id == ERR_INSUFFICIENT_COPIES"
      - name: perusal_hold_closed_interval_with_quarantine
        grounds:
          - state_machines.PerusalRequest.REQUESTED_to_APPROVED
          - validations[priority=11]
          - errors[ERR_PERUSAL_HOLD_CONFLICT]
        distinguishing_aspect: |
          Closed-interval + buffer semantics on the perusal resource (different entity than
          RentalSet, different arithmetic): after a hold [08-05, 08-29] (ship + 21d + 3d
          quarantine, both endpoints inclusive), a new perusal shipping 08-29 CONFLICTS
          (must satisfy new.hold_start > existing.hold_end), while 08-30 succeeds — touching
          is forbidden here, the exact opposite of the rental half-open rule.
        test_recipe:
          setup:
            - "Perusal PR1 approved+shipped 2026-08-05 → hold [08-05, 08-29]; PR2 (ship 08-29) and PR3 (ship 08-30) attempted"
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Pub Sixteen", allows_digital_perusal: true }
              as: LibraryAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${pub_id}", title: "Madrigals", catalog_number: "P16-001", ensemble_tier: CHAMBER, base_rental_rate_cents: 5000, sale_price_cents: 900, license_format: PRINT_AND_DIGITAL, perusal_allowed: true }
              as: LibraryAdmin
              captures: { work_id: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Choral Society School", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/perusal-requests"
              payload: { account_id: "${acct_id}", work_id: "${work_id}", format: PHYSICAL }
              as: LibraryClerk
              captures: { pr1: $.data.id }
            - call: "POST /library/perusal-requests/${pr1}/approve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/perusal-requests/${pr1}/ship"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/perusal-requests"
              payload: { account_id: "${acct_id}", work_id: "${work_id}", format: PHYSICAL }
              as: LibraryClerk
              captures: { pr2: $.data.id }
          trigger:
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/perusal-requests/${pr2}/approve"
              payload: {}
              as: LibraryClerk
              captures: { err_touch: $.data.error_id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/perusal-requests/${pr2}/approve"
              payload: {}
              as: LibraryClerk
              captures: { pr2_status: $.data.status, pr2_hold_start: $.data.hold_start }
          assert:
            - "ship on 08-29 (== prior hold_end): error_id == ERR_PERUSAL_HOLD_CONFLICT (closed interval, adjacency forbidden)"
            - "ship on 08-30 (hold_start > prior hold_end): PerusalRequest.${pr2}.status == APPROVED"
            - "PerusalRequest.${pr1}.hold_end == 2026-08-29T00:00:00Z"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: copy_pool_conserved_across_reserve_and_cancel
        grounds:
          - state_machines.RentalOrder.DRAFT_to_CANCELLED
          - state_machines.RentalOrder.RESERVED_to_CANCELLED
          - entities.RentalSet.fields.available_copy_count
        distinguishing_aspect: |
          Conserved quantity: RentalSet.available_copy_count. Reserve (forward) debits the pool
          30→25 and cancel (compensating) credits it back 25→30 — after the pair the pool equals
          its pre-action value exactly, and available_copy_count == copy_count - held lines holds.
        test_recipe:
          setup:
            - "30-copy set; order O1 reserved for 5; then cancelled; a second order O2 reserved for 5 and also cancelled"
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Pub Seventeen" }
              as: LibraryAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${pub_id}", title: "Trio", catalog_number: "P17-001", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { work_id: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${work_id}", set_code: "SET-1401", copy_count: 30, replacement_value_cents: 240000 }
              as: LibraryAdmin
              captures: { set_id: $.data.id, set_avail0: $.data.available_copy_count }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Birch HS", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 5, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
            - call: "POST /library/rental-orders/${o1}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "GET /library/rental-sets/${set_id}"
              as: LibraryClerk
              captures: { avail_after_reserve: $.data.available_copy_count }
          trigger:
            - call: "POST /library/rental-orders/${o1}/cancel"
              payload: {}
              as: LibraryClerk
            - call: "GET /library/rental-sets/${set_id}"
              as: LibraryClerk
              captures: { avail_after_cancel: $.data.available_copy_count }
          assert:
            - "after reserve: RentalSet.${set_id}.available_copy_count == 25 (30 - 5 held)"
            - "after cancel: RentalSet.${set_id}.available_copy_count == 30 (compensation restores exactly)"
            - "invariant: available_copy_count == copy_count - count(lines in RESERVED/DISPATCHED/ON_LOAN/OVERDUE) holds at every probe"
      - name: outstanding_balance_conserved_across_issue_and_waive
        grounds:
          - state_machines.DamageInvoice.DRAFT_to_ISSUED
          - state_machines.DamageInvoice.DISPUTED_to_RESOLVED_WAIVED
          - calculations.account_exposure
        distinguishing_aspect: |
          Conserved quantity (different type than copy pool — a monetary aggregate):
          CustomerAccount.settled_exposure_cents. Issue (forward) adds 2400; dispute+waive
          (compensating) removes it — after the full cycle settled exposure equals its
          pre-issue value to the cent (7800 → 7800), proving no drift in the ledger.
        test_recipe:
          setup:
            - "Account with RETURNED order (final fee 5400 settled) and DRAFT invoice 2400; settled exposure before issue == 5400"
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Pub Eighteen" }
              as: LibraryAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${pub_id}", title: "Bagatelles", catalog_number: "P18-001", ensemble_tier: CHAMBER, base_rental_rate_cents: 5400, sale_price_cents: 900, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { work_id: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${work_id}", set_code: "SET-1501", copy_count: 30, replacement_value_cents: 240000 }
              as: LibraryAdmin
              captures: { set_id: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Aspen College", account_kind: INSTITUTION, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
            - call: "POST /library/rental-orders/${o1}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o1}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o1}/confirm-receipt"
              payload: {}
              as: Customer
              as_user_id: "${acct_id}"
            - call: "POST /library/rental-orders/${o1}/check-in"
              payload: { line_grades: "C" }
              as: ReturnsClerk
            - call: "GET /library/rental-lines"
              payload: { rental_order_id: "${o1}" }
              as: BillingManager
              captures: { line1: "$.data[0].id" }
            - call: "GET /library/condition-reports"
              payload: { rental_line_id: "${line1}" }
              as: BillingManager
              captures: { rep1: "$.data[0].id" }
            - call: "POST /library/damage-invoices"
              payload: { rental_line_id: "${line1}", condition_report_id: "${rep1}" }
              as: BillingManager
              captures: { inv1: $.data.id }
            - call: "GET /library/customer-accounts/${acct_id}"
              as: BillingManager
              captures: { settled_before: $.data.settled_exposure_cents }
          trigger:
            - call: "POST /library/damage-invoices/${inv1}/issue"
              payload: {}
              as: BillingManager
            - call: "GET /library/customer-accounts/${acct_id}"
              as: BillingManager
              captures: { settled_issued: $.data.settled_exposure_cents }
            - call: "POST /library/rental-orders/${o1}/dispute"
              payload: {}
              as: Customer
              as_user_id: "${acct_id}"
            - call: "POST /library/damage-invoices/${inv1}/resolve"
              payload: { resolution: "RESOLVED_WAIVED" }
              as: BillingManager
            - call: "GET /library/customer-accounts/${acct_id}"
              as: BillingManager
              captures: { settled_after: $.data.settled_exposure_cents }
          assert:
            - "before issue: settled_exposure_cents == 5400"
            - "after issue: settled_exposure_cents == 7800 (5400 + 2400)"
            - "after dispute + waive: settled_exposure_cents == 5400 — compensation restores the pre-action value exactly (no drift)"
