              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Billing
          trigger:
            - call: "GET /quotes/${q}"
              payload: {}
              as: Billing
              captures: { st: $.data.status }
          assert:
            - "Quote.${q}.status == EXPIRED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: invoice_settlement_applies_deposit_oldest_first
        claim_type: Correct Result
        grounds: [calculations.invoice_settlement, entities.Invoice.fields.deposit_applied_cents, entities.Invoice.fields.net_due_cents]
        distinguishing_aspect: "invoice_settlement waterfall: invoice amount 35400 against a single HELD deposit 9000 -> deposit_applied_cents=9000, net_due_cents=26400."
        test_recipe:
          setup: ["A COMPLETED visit on a Maple agreement (per_visit 35400) with a HELD deposit 9000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Maple", contact_email: "c12@x.com", region_code: "EAST" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "9 Tall St", pane_count: 80, glass_sqft: 100.0, stories: 4, soft_wash_sqft: 400.0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["SOFT_WASH"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
