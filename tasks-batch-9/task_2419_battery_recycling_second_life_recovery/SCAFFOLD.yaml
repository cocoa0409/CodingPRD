scenario: |
  Generate task harder than expert level!

  2419. Battery Recycling & Second-Life Recovery (Redwood Materials style battery recycler): end-of-life battery intake from automakers, dismantlers and consumer channels with chemistry identification, state-of-charge discharge, safe transport packaging and hazardous material documentation, triage between refurbishment, second-life stationary use and material recovery, mechanical processing and hydrometallurgical recovery yields by metal with assay reconciliation, feedstock purchase pricing indexed to metal markets with quality adjustments, recycled content certification and battery passport data for downstream customers, permitting, air/water discharge compliance and residue disposal, capacity planning against a growing return stream

domain_name: battery-recycling-second-life-recovery
api_prefix: "/recycling"

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Pricing engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Peer entities linked by explicit foreign keys that cross aggregate boundaries in
  # both directions: Module points at both its Intake and (once charged) its RecoveryLot;
  # SupplierSettlement points at both Intake and Supplier; DischargeEvent points at both
  # PermitAllotment and RecoveryLot. Feedstock mass therefore flows Intake -> Module ->
  # RecoveryLot -> RecoveryOutput while money flows RecoveryOutput -> SupplierSettlement ->
  # Supplier, closing a cycle over the same rows.

  state_machine_shape: parallel
  # Intake carries two independent state dimensions on one row (custody_state x
  # compliance_state) and a custody cycle PACKAGED -> QUARANTINED -> IDENTIFIED ->
  # DISCHARGED -> PACKAGED. SupplierSettlement is cyclic
  # (DRAFT -> POSTED -> DISPUTED -> UMPIRE_ROUND -> DRAFT). Module is branching
  # (PENDING_TRIAGE forks to three queues with divergent side-effect sets).
  # ProcessingCampaign is compound (auto-CLOSED when every child lot is terminal).

  relationship_patterns:
    - one_to_many        # Intake -> Module, RecoveryLot -> RecoveryOutput, PermitAllotment -> DischargeEvent
    - cross_aggregate    # Module.lot_id crosses from the intake aggregate into the processing aggregate
    - polymorphic_free   # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # Ten narrow operational roles. Beyond role-level separation, the same X-User-ID that
  # submitted a HazmatManifest may not close it, and AssayTechnician (who books recovery
  # yields) may never post or void the settlement those yields price.

  consistency_model: immediate

difficulty_level: expert_plus
# 15 entities / 62 endpoints / 56 error codes / 8 calculations / 7 state machines.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Recycling campus name.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the campus.
        constraints: exactly 2 uppercase letters
      - name: status
        type: enum
        source: input
        description: Operating status of the campus. A SUSPENDED campus rejects new intakes.
        default: ACTIVE
        constraints: ACTIVE | SUSPENDED
      - name: mech_capacity_kg_per_day
        type: number
        source: input
        description: Mechanical (shredding) throughput ceiling used by the capacity projection.
        constraints: "> 0"
      - name: hydro_capacity_kg_per_day
        type: number
        source: input
        description: Hydrometallurgical throughput ceiling, reported by the capacity projection.
        constraints: "> 0"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Counterparty legal name.
      - name: channel
        type: enum
        source: input
        description: Return channel the feedstock arrives through.
        constraints: AUTOMAKER | DISMANTLER | CONSUMER_COLLECTION
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum unpaid payable the recycler will carry for this supplier.
        constraints: ">= 0"
      - name: contact_email
        type: string
        source: input
        description: Accounts-payable contact.
        default: null
      - name: payable_balance_cents
        type: integer
        source: computed
        description: Unpaid obligation ledger; maintained by settlement post / void / settle / apply-umpire.
        default: 0
      - name: paid_to_date_cents
        type: integer
        source: computed
        description: Cumulative cash paid out across SETTLED settlements.
        default: 0
      - name: credit_hold
        type: boolean
        source: computed
        description: True while payable_balance_cents > credit_limit_cents.
        default: false
      - name: quality_strike_count
        type: integer
        source: computed
        description: Count of logged quality incidents; feeds the quality_deduction_pct multiplier.
        default: 0

  - name: MetalIndexPrice
    parent: null
    common_fields: false
    fields:
      - name: metal
        type: enum
        source: input
        description: Metal the quote applies to.
        constraints: NI | CO | LI | CU | MN | GRAPHITE
      - name: effective_date
        type: datetime
        source: input
        description: ISO-8601 UTC instant (three fractional digits) from which the quote applies.
      - name: price_cents_per_kg
        type: integer
        source: input
        description: Index price in cents per contained kilogram.
        constraints: "> 0"
      - name: source_index
        type: string
        source: input
        description: Publishing index name.
        default: LME
    note: |
      Immutable configuration row (common_fields false -> id + created_at only, no update
      endpoint, no version). Uniqueness: (metal, effective_date) -> ERR_DUPLICATE_INDEX_PRICE.

  - name: Intake
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; counterparty that shipped the end-of-life batteries.
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; campus that took physical custody.
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant at creation; the PROVISIONAL price basis date.
      - name: declared_chemistry
        type: enum
        source: input
        description: Chemistry declared on the supplier's shipping paperwork.
        constraints: NMC622 | NCA | LMO | LFP
      - name: identified_chemistry
        type: enum
        source: computed
        description: Chemistry confirmed at the identification bench; null until identified.
        default: null
        constraints: NMC622 | NCA | LMO | LFP | null
      - name: gross_mass_kg
        type: number
        source: input
        description: Weighbridge gross mass including packaging.
        constraints: "> 0"
      - name: packaging_tare_kg
        type: number
        source: input
        description: Tare mass of drums/pallets.
        constraints: ">= 0 and < gross_mass_kg"
      - name: net_mass_kg
        type: number
        source: computed
        description: gross_mass_kg - packaging_tare_kg, rounded to 3 decimals half_up.
      - name: declared_ni_pct
        type: number
        source: input
        description: Declared nickel assay, mass percent of net_mass_kg.
        default: 0.0
        constraints: 0.0 <= v <= 100.0
      - name: declared_co_pct
        type: number
        source: input
        description: Declared cobalt assay, mass percent of net_mass_kg.
        default: 0.0
        constraints: 0.0 <= v <= 100.0
      - name: declared_li_pct
        type: number
        source: input
        description: Declared lithium assay, mass percent of net_mass_kg.
        default: 0.0
        constraints: 0.0 <= v <= 100.0
      - name: declared_cu_pct
        type: number
        source: input
        description: Declared copper assay, mass percent of net_mass_kg.
        default: 0.0
        constraints: 0.0 <= v <= 100.0
      - name: moisture_pct
        type: number
        source: input
        description: Measured free moisture, mass percent; drives quality_deduction_pct.
        default: 0.0
        constraints: 0.0 <= v <= 100.0
      - name: foreign_material_pct
        type: number
        source: input
        description: Measured non-battery foreign material, mass percent; drives quality_deduction_pct.
        default: 0.0
        constraints: 0.0 <= v <= 100.0
      - name: soc_pct
        type: number
        source: computed
        description: State of charge measured at the last discharge step; null before discharge.
        default: null
      - name: packaging_type
        type: string
        source: computed
        description: UN packaging selected at the packaging step; null before packaging.
        default: null
      - name: custody_state
        type: enum
        source: computed
        description: Physical custody dimension; independent of compliance_state.
        default: RECEIVED
        constraints: RECEIVED | IDENTIFIED | DISCHARGED | PACKAGED | RELEASED | QUARANTINED
      - name: compliance_state
        type: enum
        source: computed
        description: Hazardous-material documentation dimension; independent of custody_state.
        default: MANIFEST_DRAFT
        constraints: MANIFEST_DRAFT | MANIFEST_SUBMITTED | MANIFEST_CLOSED | MANIFEST_REJECTED
      - name: hold_reason
        type: enum
        source: computed
        description: Why custody_state is QUARANTINED; null whenever custody_state != QUARANTINED.
        default: null
        constraints: MANIFEST_REJECTED | SUPPLIER_CREDIT_HOLD | null
      - name: module_mass_total_kg
        type: number
        source: computed
        description: Sum of Module.mass_kg over all modules of this intake, 3 decimals half_up.
        default: 0.0
      - name: assigned_mass_kg
        type: number
        source: computed
        description: Sum of Module.mass_kg for modules whose status IN {CHARGED, CONSUMED}, 3 decimals half_up.
        default: 0.0
      - name: unassigned_mass_kg
        type: number
        source: computed
        description: module_mass_total_kg - assigned_mass_kg, 3 decimals half_up.
        default: 0.0
      - name: released_at
        type: datetime
        source: computed
        description: Logical-clock instant of the release step; null before release.
        default: null

  - name: HazmatManifest
    parent: Intake
    common_fields: true
    fields:
      - name: intake_id
        type: string
        source: input
        description: FK -> Intake.id; shipment this manifest documents.
      - name: un_number
        type: enum
        source: input
        description: UN dangerous-goods number for the packaged cells.
        constraints: UN3480 | UN3481 | UN3536
      - name: packing_group
        type: enum
        source: input
        description: Dangerous-goods packing group.
        constraints: I | II | III
      - name: transporter_name
        type: string
        source: input
        description: Licensed hazmat transporter.
      - name: revision
        type: integer
        source: computed
        description: 1 for the first manifest of an intake; previous revision + 1 for each resubmission.
        default: 1
      - name: status
        type: enum
        source: computed
        description: Document lifecycle.
        default: SUBMITTED
        constraints: SUBMITTED | CLOSED | REJECTED
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who submitted this manifest.
      - name: closed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who closed it; null until CLOSED.
        default: null
      - name: rejection_reason
        type: string
        source: computed
        description: Free-text reason recorded at rejection; null unless REJECTED.
        default: null

  - name: Module
    parent: Intake
    common_fields: true
    fields:
      - name: intake_id
        type: string
        source: input
        description: FK -> Intake.id; shipment this module was dismantled from.
      - name: lot_id
        type: string
        source: computed
        description: FK -> RecoveryLot.id; null until the module is charged into a lot, and reset to null when that lot is voided.
        default: null
      - name: serial_code
        type: string
        source: input
        description: Manufacturer module serial.
        constraints: unique per intake_id -> ERR_INVALID_REQUEST on duplicate
      - name: chemistry
        type: enum
        source: computed
        description: Copied from Intake.identified_chemistry at module creation.
        constraints: NMC622 | NCA | LMO | LFP
      - name: mass_kg
        type: number
        source: input
        description: Module mass.
        constraints: "> 0"
      - name: min_cell_capacity_pct
        type: number
        source: input
        description: Worst cell remaining capacity, percent of nameplate.
        constraints: 0.0 <= v <= 100.0
      - name: mean_cell_capacity_pct
        type: number
        source: input
        description: Mean cell remaining capacity, percent of nameplate.
        constraints: min_cell_capacity_pct <= v <= 100.0
      - name: cycle_count
        type: integer
        source: input
        description: Lifetime equivalent full cycles.
        default: 0
        constraints: ">= 0"
      - name: second_life_score
        type: number
        source: computed
        description: Score from the ACTIVE TriageDecision; null while status == PENDING_TRIAGE.
        default: null
      - name: grade
        type: enum
        source: computed
        description: Grade from the ACTIVE TriageDecision; null while status == PENDING_TRIAGE.
        default: null
        constraints: A | B | C | D | null
      - name: status
        type: enum
        source: computed
        description: Disposition lifecycle; branches at triage.
        default: PENDING_TRIAGE
        constraints: PENDING_TRIAGE | REFURB_QUEUE | SECOND_LIFE_QUEUE | RECOVERY_QUEUE | CHARGED | CONSUMED | SHIPPED
      - name: shipped_to
        type: string
        source: computed
        description: Customer name recorded when a REFURB_QUEUE or SECOND_LIFE_QUEUE module ships.
        default: null

  - name: TriageDecision
    parent: Module
    common_fields: true
    fields:
      - name: module_id
        type: string
        source: input
        description: FK -> Module.id; module this decision grades.
      - name: scoring_variant
        type: enum
        source: input
        description: Which state-of-health input the score uses.
        constraints: CONSERVATIVE | FLEET_AVERAGE
      - name: override_disposition
        type: enum
        source: input
        description: Operator override of the score-derived disposition; null means accept the derived value.
        default: null
        constraints: REFURBISH | SECOND_LIFE | MATERIAL_RECOVERY | null
      - name: score
        type: number
        source: computed
        description: module_second_life_score output, 2 decimals half_up.
      - name: grade
        type: enum
        source: computed
        description: Grade band of score.
        constraints: A | B | C | D
      - name: derived_disposition
        type: enum
        source: computed
        description: Disposition implied by grade before any override.
        constraints: REFURBISH | SECOND_LIFE | MATERIAL_RECOVERY
      - name: disposition
        type: enum
        source: computed
        description: override_disposition when supplied, otherwise derived_disposition.
        constraints: REFURBISH | SECOND_LIFE | MATERIAL_RECOVERY
      - name: status
        type: enum
        source: computed
        description: ACTIVE until voided by a manifest rejection cascade.
        default: ACTIVE
        constraints: ACTIVE | VOIDED
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the TriageEngineer who recorded the decision.

  - name: ProcessingLine
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; campus the line sits in.
      - name: line_code
        type: string
        source: input
        description: Line identifier on the plant floor.
      - name: line_type
        type: enum
        source: input
        description: MECHANICAL lines shred; HYDROMET lines leach and precipitate.
        constraints: MECHANICAL | HYDROMET
      - name: chemistry_family
        type: enum
        source: input
        description: Family the line is currently plumbed for; changed by the replumb endpoint.
        constraints: NICKEL_RICH | IRON_PHOSPHATE
      - name: throughput_kg_per_hour
        type: number
        source: input
        description: Nameplate throughput used to cap campaign planned_input_kg.
        constraints: "> 0"
      - name: changeover_buffer_hours
        type: integer
        source: input
        description: Idle hours required between campaigns of different chemistry families on this line.
        default: 6
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: A MAINTENANCE line accepts no campaign start.
        default: AVAILABLE
        constraints: AVAILABLE | MAINTENANCE

  - name: ProcessingCampaign
    parent: ProcessingLine
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: FK -> ProcessingLine.id; line the campaign occupies.
      - name: chemistry_family
        type: enum
        source: input
        description: Family this campaign runs; must equal the line's chemistry_family.
        constraints: NICKEL_RICH | IRON_PHOSPHATE
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the line occupation interval.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the line occupation interval.
        constraints: "> window_start"
      - name: planned_input_kg
        type: number
        source: input
        description: Feedstock mass the campaign plans to charge.
        constraints: "> 0"
      - name: committed_input_kg
        type: number
        source: computed
        description: Sum of RecoveryLot.charged_mass_kg over lots of this campaign whose status IN {OPEN, CHARGED, FINALIZED}, 3 decimals half_up.
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: Campaign lifecycle; CLOSED is derived from child lot states.
        default: SCHEDULED
        constraints: SCHEDULED | RUNNING | CLOSED | CANCELLED
      - name: cancel_reason
        type: string
        source: computed
        description: Reason recorded at cancellation; null unless CANCELLED.
        default: null

  - name: RecoveryLot
    parent: ProcessingCampaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> ProcessingCampaign.id; campaign the lot runs under.
      - name: lot_code
        type: string
        source: input
        description: Lot identifier printed on the charge sheet.
      - name: charged_mass_kg
        type: number
        source: computed
        description: Sum of Module.mass_kg for modules whose lot_id equals this lot and status IN {CHARGED, CONSUMED}, 3 decimals half_up.
        default: 0.0
      - name: residue_mass_kg
        type: number
        source: computed
        description: Weighed non-recovered residue supplied at finalization; null before FINALIZED.
        default: null
      - name: recovered_mass_kg
        type: number
        source: computed
        description: Sum of RecoveryOutput.recovered_mass_kg over this lot, 3 decimals half_up.
        default: 0.0
      - name: accounted_mass_kg
        type: number
        source: computed
        description: recovered_mass_kg + residue_mass_kg at finalization, 3 decimals half_up; null before FINALIZED.
        default: null
      - name: unaccounted_mass_kg
        type: number
        source: computed
        description: charged_mass_kg - accounted_mass_kg, 3 decimals half_up; null before FINALIZED.
        default: null
      - name: mass_balance_pct
        type: number
        source: computed
        description: accounted_mass_kg / charged_mass_kg * 100, 2 decimals half_up; null before FINALIZED.
        default: null
      - name: recycled_content_pct
        type: number
        source: computed
        description: recovered_mass_kg / charged_mass_kg * 100, 2 decimals half_up; null before FINALIZED.
        default: null
      - name: status
        type: enum
        source: computed
        description: Lot lifecycle.
        default: OPEN
        constraints: OPEN | CHARGED | FINALIZED | VOIDED
      - name: finalized_at
        type: datetime
        source: computed
        description: Logical-clock instant of finalization; the FINAL price basis date. Null before FINALIZED.
        default: null
      - name: void_reason
        type: string
        source: computed
        description: Reason recorded at voiding; null unless VOIDED.
        default: null

  - name: RecoveryOutput
    parent: RecoveryLot
    common_fields: false
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> RecoveryLot.id; lot this assay line belongs to.
      - name: metal
        type: enum
        source: input
        description: Recovered product stream.
        constraints: NI | CO | LI | CU | MN | GRAPHITE
      - name: recovered_mass_kg
        type: number
        source: input
        description: Contained mass recovered in this stream.
        constraints: "> 0"
      - name: assay_purity_pct
        type: number
        source: input
        description: Assayed purity of the stream.
        constraints: 0.0 < v <= 100.0
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the AssayTechnician who booked the line.
    note: |
      Append-only assay ledger (common_fields false -> id + created_at only, no version,
      no update or delete endpoint). Uniqueness: (lot_id, metal) -> ERR_INVALID_REQUEST.

  - name: SupplierSettlement
    parent: null
    common_fields: true
    fields:
      - name: intake_id
        type: string
        source: input
        description: FK -> Intake.id; feedstock shipment being paid for.
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; payee, copied from Intake.supplier_id at creation.
      - name: variant
        type: enum
        source: computed
        description: PROVISIONAL at creation; flips to FINAL when the contributing lot is finalized.
        default: PROVISIONAL
        constraints: PROVISIONAL | FINAL
      - name: price_basis_date
        type: datetime
        source: computed
        description: Intake.received_at while PROVISIONAL; RecoveryLot.finalized_at once FINAL.
      - name: line_breakdown
        type: array
        source: computed
        description: One object per payable metal { metal, contained_kg, unit_price_cents_per_kg, payable_share, line_cents }.
      - name: gross_cents
        type: integer
        source: computed
        description: Sum of line_breakdown[].line_cents, each already rounded to whole cents.
        default: 0
      - name: processing_fee_pct
        type: number
        source: computed
        description: Tier rate selected from PROCESSING_FEE_TIERS on gross_cents.
        default: 0.0
      - name: processing_fee_cents
        type: integer
        source: computed
        description: round_half_up(gross_cents * processing_fee_pct).
        default: 0
      - name: quality_deduction_pct
        type: number
        source: computed
        description: quality_deduction_pct calculation output, 4 decimals half_up.
        default: 0.0
      - name: quality_deduction_cents
        type: integer
        source: computed
        description: round_half_up(gross_cents * quality_deduction_pct).
        default: 0
      - name: pre_surcharge_net_cents
        type: integer
        source: computed
        description: gross_cents - processing_fee_cents - quality_deduction_cents.
        default: 0
      - name: hazmat_surcharge_cents
        type: integer
        source: computed
        description: Capped hazmat handling surcharge; see settlement_net_payable step 6.
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: pre_surcharge_net_cents - hazmat_surcharge_cents.
        default: 0
      - name: posted_amount_cents
        type: integer
        source: computed
        description: net_payable_cents frozen at POSTED; reset to 0 on void or apply-umpire.
        default: 0
      - name: max_variance_pp
        type: number
        source: computed
        description: assay_variance_pp maximum over payable metals, 2 decimals half_up; null while PROVISIONAL.
        default: null
      - name: dispute_round
        type: integer
        source: computed
        description: Number of disputes raised so far; capped at DISPUTE_ROUND_LIMIT.
        default: 0
      - name: dispute_reason
        type: string
        source: computed
        description: Reason from the most recent dispute; null before the first dispute.
        default: null
      - name: umpire_metal
        type: enum
        source: computed
        description: Metal the umpire re-assayed in the current round; null outside an umpire round.
        default: null
        constraints: NI | CO | LI | CU | null
      - name: umpire_contained_kg
        type: number
        source: computed
        description: Umpire contained mass for umpire_metal; overrides the recovered figure on apply-umpire.
        default: null
      - name: payment_reference
        type: string
        source: computed
        description: Cash payment reference recorded at settle; null unless SETTLED.
        default: null
      - name: void_reason
        type: string
        source: computed
        description: Reason recorded at void; null unless VOIDED.
        default: null
      - name: state
        type: enum
        source: computed
        description: Settlement lifecycle; cycles through dispute and umpire rounds back to DRAFT.
        default: DRAFT
        constraints: DRAFT | POSTED | DISPUTED | UMPIRE_ROUND | SETTLED | VOIDED

  - name: PermitAllotment
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; permitted campus.
      - name: medium
        type: enum
        source: input
        description: Environmental medium the permit governs.
        constraints: AIR | WATER
      - name: permit_no
        type: string
        source: input
        description: Regulator-issued permit number.
      - name: valid_from
        type: datetime
        source: input
        description: Inclusive first instant the permit covers.
      - name: valid_to
        type: datetime
        source: input
        description: Inclusive last instant the permit covers.
        constraints: "> valid_from"
      - name: daily_cap_kg
        type: number
        source: input
        description: Maximum POSTED discharge mass per calendar day (UTC) under this permit.
        constraints: "> 0"
      - name: consumed_kg
        type: number
        source: computed
        description: Sum of DischargeEvent.mass_kg for events of this allotment whose status == POSTED, 3 decimals half_up.
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: ACTIVE until suspended by a ComplianceOfficer or lazily expired by the clock.
        default: ACTIVE
        constraints: ACTIVE | SUSPENDED | EXPIRED
      - name: suspend_reason
        type: string
        source: computed
        description: Reason recorded at suspension; null unless SUSPENDED.
        default: null

  - name: DischargeEvent
    parent: PermitAllotment
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> PermitAllotment.id; permit the discharge is booked against.
      - name: lot_id
        type: string
        source: input
        description: FK -> RecoveryLot.id; lot whose residue or effluent this discharge came from.
      - name: event_date
        type: datetime
        source: input
        description: Instant of discharge; its UTC calendar date is the daily-cap bucket key.
      - name: mass_kg
        type: number
        source: input
        description: Discharged analyte mass.
        constraints: "> 0"
      - name: analyte
        type: enum
        source: input
        description: Regulated analyte discharged.
        constraints: NICKEL_DISSOLVED | FLUORIDE | TSS
      - name: status
        type: enum
        source: computed
        description: POSTED counts against the permit; VOIDED does not.
        default: POSTED
        constraints: POSTED | VOIDED
      - name: void_reason
        type: string
        source: computed
        description: Reason recorded at voiding; null unless VOIDED.
        default: null

  - name: BatteryPassport
    parent: RecoveryLot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> RecoveryLot.id; finalized lot the certificate covers.
      - name: passport_code
        type: string
        source: input
        description: Certificate code handed to the downstream customer.
        constraints: globally unique -> ERR_INVALID_REQUEST on duplicate
      - name: customer_name
        type: string
        source: input
        description: Downstream cathode or cell customer.
      - name: recycled_content_pct
        type: number
        source: computed
        description: Copied from RecoveryLot.recycled_content_pct at issuance.
      - name: metal_content
        type: array
        source: computed
        description: One object per RecoveryOutput of the lot { metal, recovered_mass_kg, assay_purity_pct }.
      - name: status
        type: enum
        source: computed
        description: Certificate lifecycle.
        default: ISSUED
        constraints: ISSUED | REVOKED
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: revoked_reason
        type: string
        source: computed
        description: Reason recorded at revocation; null unless REVOKED.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Intake carries TWO independent state dimensions on one row.
  # Dimension 1: custody_state (physical). Dimension 2: compliance_state (paperwork).
  # ---------------------------------------------------------------------------
  - entity: Intake
    dimension: custody_state
    initial_state: RECEIVED
    terminal_states: [RELEASED]
    transitions:
      - from: RECEIVED
        to: IDENTIFIED
        trigger: "POST /recycling/intakes/{intake_id}/identify-chemistry"
        actor: IntakeClerk
        preconditions:
          - "custody_state == RECEIVED"
        side_effects:
          - "sets identified_chemistry from the request body"
          - "increments Intake.version by 1 and refreshes Intake.updated_at"

      - from: IDENTIFIED
        to: DISCHARGED
        trigger: "POST /recycling/intakes/{intake_id}/discharge"
        actor: PlantOperator
        preconditions:
          - "custody_state == IDENTIFIED"
          - "identified_chemistry != null"
        side_effects:
          - "sets soc_pct from the measured reading in the request body"
          - "increments Intake.version by 1"

      - from: DISCHARGED
        to: DISCHARGED
        trigger: "POST /recycling/intakes/{intake_id}/discharge (re-measurement)"
        actor: PlantOperator
        preconditions:
          - "custody_state == DISCHARGED"
        side_effects:
          - "overwrites soc_pct with the new reading"
          - "increments Intake.version by 1"
        note: |
          Self-loop: a pack whose first reading was above SOC_PACKAGING_LIMIT_PCT is
          discharged further and re-measured. This is the only repeatable custody step.

      - from: DISCHARGED
        to: PACKAGED
        trigger: "POST /recycling/intakes/{intake_id}/package"
        actor: PlantOperator
        preconditions:
          - "custody_state == DISCHARGED"
          - "soc_pct != null and soc_pct <= SOC_PACKAGING_LIMIT_PCT (30.0) -- else ERR_SOC_ABOVE_PACKAGING_LIMIT"
        side_effects:
          - "sets packaging_type from the request body"
          - "increments Intake.version by 1"

      - from: PACKAGED
        to: RELEASED
        trigger: "POST /recycling/intakes/{intake_id}/release"
        actor: PlantOperator
        preconditions:
          - "custody_state == PACKAGED"
          - "compliance_state == MANIFEST_CLOSED -- cross-dimension guard; else ERR_INVALID_COMPLIANCE_STATE"
          - "Supplier(supplier_id).credit_hold == false -- else ERR_SUPPLIER_CREDIT_HOLD"
          - "a MetalIndexPrice row exists with effective_date <= received_at for every payable metal whose contained_kg * recovery_factor > 0 -- else ERR_INDEX_PRICE_UNAVAILABLE"
        side_effects:
          - "sets released_at = clock_now"
          - "creates a SupplierSettlement (variant PROVISIONAL, state DRAFT, supplier_id copied from Intake.supplier_id, price_basis_date = received_at) whose gross_cents/line_breakdown come from feedstock_payable_value[PROVISIONAL], quality_deduction_pct from quality_deduction_pct, and processing_fee_cents/hazmat_surcharge_cents/net_payable_cents from settlement_net_payable"
          - "increments Intake.version by 1"
        note: |
          The new settlement is a cascade-created child: it never appears in this response
          body and is discovered through GET /recycling/settlements?intake_id=...

      - from: IDENTIFIED
        to: QUARANTINED
        trigger: "system: HazmatManifest REJECTED cascade (link 2 of manifest_reject_quarantine_cascade)"
        actor: system
        preconditions:
          - "custody_state IN {IDENTIFIED, DISCHARGED, PACKAGED}"
        side_effects:
          - "sets hold_reason = MANIFEST_REJECTED"
          - "increments Intake.version by 1"
          - "because custody_state became QUARANTINED, every TriageDecision whose module_id belongs to this intake and whose status == ACTIVE becomes VOIDED and each such Module reverts to PENDING_TRIAGE with second_life_score = null and grade = null (link 3)"

      - from: DISCHARGED
        to: QUARANTINED
        trigger: "system: HazmatManifest REJECTED cascade (link 2 of manifest_reject_quarantine_cascade)"
        actor: system
        preconditions:
          - "custody_state IN {IDENTIFIED, DISCHARGED, PACKAGED}"
        side_effects:
          - "sets hold_reason = MANIFEST_REJECTED"
          - "increments Intake.version by 1"
          - "voids ACTIVE TriageDecisions of this intake's modules and reverts those modules to PENDING_TRIAGE (link 3)"

      - from: PACKAGED
        to: QUARANTINED
        trigger: "system: HazmatManifest REJECTED cascade (link 2 of manifest_reject_quarantine_cascade)"
        actor: system
        preconditions:
          - "custody_state IN {IDENTIFIED, DISCHARGED, PACKAGED}"
        side_effects:
          - "sets hold_reason = MANIFEST_REJECTED"
          - "increments Intake.version by 1"
          - "voids ACTIVE TriageDecisions of this intake's modules and reverts those modules to PENDING_TRIAGE (link 3)"

      - from: RECEIVED
        to: QUARANTINED
        trigger: "system: Supplier.credit_hold false->true cascade (link 4 of settlement_post_credit_hold_cascade)"
        actor: system
        preconditions:
          - "custody_state == RECEIVED"
          - "Supplier(supplier_id).credit_hold just became true"
        side_effects:
          - "sets hold_reason = SUPPLIER_CREDIT_HOLD"
          - "increments Intake.version by 1"

      - from: QUARANTINED
        to: IDENTIFIED
        trigger: "POST /recycling/intakes/{intake_id}/manifests (resubmission)"
        actor: ComplianceOfficer
        preconditions:
          - "custody_state == QUARANTINED"
          - "hold_reason == MANIFEST_REJECTED"
          - "compliance_state == MANIFEST_REJECTED"
        side_effects:
          - "clears hold_reason to null"
          - "increments Intake.version by 1"
        note: |
          Closes the custody cycle PACKAGED -> QUARANTINED -> IDENTIFIED -> DISCHARGED ->
          PACKAGED: the pack must be re-discharged and re-packaged after a rejected manifest.

      - from: QUARANTINED
        to: RECEIVED
        trigger: "system: Supplier.credit_hold true->false cascade on POST /recycling/settlements/{settlement_id}/settle"
        actor: system
        preconditions:
          - "custody_state == QUARANTINED"
          - "hold_reason == SUPPLIER_CREDIT_HOLD"
          - "Supplier(supplier_id).credit_hold just became false"
        side_effects:
          - "clears hold_reason to null"
          - "increments Intake.version by 1"

  - entity: Intake
    dimension: compliance_state
    initial_state: MANIFEST_DRAFT
    terminal_states: [MANIFEST_CLOSED]
    transitions:
      - from: MANIFEST_DRAFT
        to: MANIFEST_SUBMITTED
        trigger: "POST /recycling/intakes/{intake_id}/manifests"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_state == MANIFEST_DRAFT"
          - "custody_state IN {DISCHARGED, PACKAGED}"
        side_effects:
          - "creates HazmatManifest (status SUBMITTED, revision 1, submitted_by_user_id = X-User-ID)"
          - "increments Intake.version by 1"

      - from: MANIFEST_SUBMITTED
        to: MANIFEST_CLOSED
        trigger: "POST /recycling/intakes/{intake_id}/manifests/{manifest_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "manifest.status == SUBMITTED"
          - "custody_state == PACKAGED"
          - "X-User-ID != manifest.submitted_by_user_id -- else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets manifest.status = CLOSED and manifest.closed_by_user_id = X-User-ID"
          - "increments HazmatManifest.version and Intake.version by 1 each"

      - from: MANIFEST_SUBMITTED
        to: MANIFEST_REJECTED
        trigger: "POST /recycling/intakes/{intake_id}/manifests/{manifest_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "manifest.status == SUBMITTED"
          - "no Module of this intake has status IN {CHARGED, CONSUMED} -- else ERR_MODULES_ALREADY_COMMITTED"
        side_effects:
          - "link 1: sets manifest.status = REJECTED, manifest.rejection_reason, compliance_state = MANIFEST_REJECTED"
          - "link 2: because compliance_state became MANIFEST_REJECTED, custody_state moves to QUARANTINED with hold_reason = MANIFEST_REJECTED"
          - "link 3: because custody_state became QUARANTINED, every ACTIVE TriageDecision on this intake's modules becomes VOIDED and each affected Module reverts to PENDING_TRIAGE with second_life_score = null, grade = null"
          - "increments HazmatManifest.version and Intake.version by 1 each, and Module.version / TriageDecision.version by 1 for each row touched"

      - from: MANIFEST_REJECTED
        to: MANIFEST_SUBMITTED
        trigger: "POST /recycling/intakes/{intake_id}/manifests (resubmission)"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_state == MANIFEST_REJECTED"
          - "custody_state == QUARANTINED and hold_reason == MANIFEST_REJECTED"
        side_effects:
          - "creates a new HazmatManifest with revision = max(existing revision) + 1, status SUBMITTED"
          - "custody_state returns to IDENTIFIED and hold_reason is cleared"
          - "increments Intake.version by 1"
        note: "Closes the compliance cycle MANIFEST_SUBMITTED -> MANIFEST_REJECTED -> MANIFEST_SUBMITTED."

  - entity: Module
    initial_state: PENDING_TRIAGE
    terminal_states: [CONSUMED, SHIPPED]
    transitions:
      - from: PENDING_TRIAGE
        to: REFURB_QUEUE
        trigger: "POST /recycling/modules/{module_id}/triage-decisions with resolved disposition REFURBISH"
        actor: TriageEngineer
        preconditions:
          - "status == PENDING_TRIAGE"
          - "Intake(intake_id).custody_state IN {PACKAGED, RELEASED}"
          - "override_disposition == REFURBISH requires grade IN {A, B} -- else ERR_DISPOSITION_OVERRIDE_NOT_PERMITTED"
        side_effects:
          - "creates TriageDecision (status ACTIVE) and copies score/grade onto the module"
          - "branch-specific: module is reserved for whole-module refurbishment and is NOT chargeable into a RecoveryLot"
          - "increments Module.version by 1"

      - from: PENDING_TRIAGE
        to: SECOND_LIFE_QUEUE
        trigger: "POST /recycling/modules/{module_id}/triage-decisions with resolved disposition SECOND_LIFE"
        actor: TriageEngineer
        preconditions:
          - "status == PENDING_TRIAGE"
          - "Intake(intake_id).custody_state IN {PACKAGED, RELEASED}"
          - "override_disposition == SECOND_LIFE requires grade IN {A, B, C} -- else ERR_DISPOSITION_OVERRIDE_NOT_PERMITTED"
        side_effects:
          - "creates TriageDecision (status ACTIVE) and copies score/grade onto the module"
          - "branch-specific: module is reserved for stationary storage assembly and is NOT chargeable into a RecoveryLot"
          - "increments Module.version by 1"

      - from: PENDING_TRIAGE
        to: RECOVERY_QUEUE
        trigger: "POST /recycling/modules/{module_id}/triage-decisions with resolved disposition MATERIAL_RECOVERY"
        actor: TriageEngineer
        preconditions:
          - "status == PENDING_TRIAGE"
          - "Intake(intake_id).custody_state IN {PACKAGED, RELEASED}"
        side_effects:
          - "creates TriageDecision (status ACTIVE) and copies score/grade onto the module"
          - "branch-specific: module becomes chargeable into a RecoveryLot whose campaign chemistry_family matches CHEMISTRY_FAMILY_MAP[module.chemistry]"
          - "increments Module.version by 1"
        note: "Diamond fork: the three branches carry different downstream side-effect sets; only this branch feeds mass into the recovery ledger."

      - from: RECOVERY_QUEUE
        to: CHARGED
        trigger: "POST /recycling/lots/{lot_id}/charge"
        actor: PlantOperator
        preconditions:
          - "status == RECOVERY_QUEUE"
          - "Intake(intake_id).custody_state == RELEASED -- else ERR_INTAKE_NOT_RELEASED"
        side_effects:
          - "sets lot_id"
          - "adds mass_kg to RecoveryLot.charged_mass_kg, Intake.assigned_mass_kg and ProcessingCampaign.committed_input_kg, and subtracts it from Intake.unassigned_mass_kg"
          - "increments Module.version, Intake.version, RecoveryLot.version and ProcessingCampaign.version by 1 each"

      - from: CHARGED
        to: RECOVERY_QUEUE
        trigger: "system: RecoveryLot VOIDED cascade on POST /recycling/lots/{lot_id}/void"
        actor: system
        preconditions:
          - "status == CHARGED"
          - "RecoveryLot(lot_id).status just became VOIDED"
        side_effects:
          - "resets lot_id to null"
          - "subtracts mass_kg from Intake.assigned_mass_kg and adds it back to Intake.unassigned_mass_kg"
          - "increments Module.version and Intake.version by 1 each"

      - from: CHARGED
        to: CONSUMED
        trigger: "system: RecoveryLot FINALIZED cascade (link 2 of finalize_lot_recovery_cascade)"
        actor: system
        preconditions:
          - "status == CHARGED"
          - "RecoveryLot(lot_id).status just became FINALIZED"
        side_effects:
          - "increments Module.version by 1"
          - "because these modules became CONSUMED, each contributing Intake's DRAFT SupplierSettlement flips PROVISIONAL -> FINAL (link 3)"

      - from: REFURB_QUEUE
        to: SHIPPED
        trigger: "POST /recycling/modules/{module_id}/ship"
        actor: PlantOperator
        preconditions:
          - "status IN {REFURB_QUEUE, SECOND_LIFE_QUEUE} -- else ERR_MODULE_NOT_SHIPPABLE"
          - "Intake(intake_id).custody_state == RELEASED -- else ERR_INTAKE_NOT_RELEASED"
        side_effects:
          - "sets shipped_to from the request body"
          - "increments Module.version by 1"

      - from: SECOND_LIFE_QUEUE
        to: SHIPPED
        trigger: "POST /recycling/modules/{module_id}/ship"
        actor: PlantOperator
        preconditions:
          - "status IN {REFURB_QUEUE, SECOND_LIFE_QUEUE} -- else ERR_MODULE_NOT_SHIPPABLE"
          - "Intake(intake_id).custody_state == RELEASED -- else ERR_INTAKE_NOT_RELEASED"
        side_effects:
          - "sets shipped_to from the request body"
          - "increments Module.version by 1"

  - entity: ProcessingCampaign
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /recycling/campaigns/{campaign_id}/start"
        actor: PlantOperator
        preconditions:
          - "status == SCHEDULED"
          - "ProcessingLine(line_id).status == AVAILABLE -- else ERR_LINE_NOT_AVAILABLE"
          - "clock_now < window_end -- else ERR_CAMPAIGN_WINDOW_CLOSED"
        side_effects:
          - "increments ProcessingCampaign.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /recycling/campaigns/{campaign_id}/cancel"
        actor: PlantOperator
        preconditions:
          - "status == SCHEDULED"
          - "no RecoveryLot of this campaign has status IN {CHARGED, FINALIZED}"
        side_effects:
          - "sets cancel_reason; every OPEN RecoveryLot of the campaign becomes VOIDED with void_reason = 'CAMPAIGN_CANCELLED'"
          - "releases the line occupation window so a later campaign may reuse it"
          - "increments ProcessingCampaign.version by 1"

      - from: RUNNING
        to: CLOSED
        trigger: "system: bubble-up when the campaign's last non-terminal lot becomes terminal"
        actor: system
        preconditions:
          - "status == RUNNING"
          - "count(RecoveryLot where campaign_id == campaign.id) >= 1"
          - "every RecoveryLot of the campaign has status IN {FINALIZED, VOIDED}"
        side_effects:
          - "increments ProcessingCampaign.version by 1"
        note: "Compound/aggregate shape: campaign state is a function of its children's states."

  - entity: RecoveryLot
    initial_state: OPEN
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: OPEN
        to: CHARGED
        trigger: "POST /recycling/lots/{lot_id}/charge"
        actor: PlantOperator
        preconditions:
          - "status == OPEN -- else ERR_LOT_NOT_OPEN"
          - "expected_lot_version == RecoveryLot.version -- else ERR_STALE_LOT_VERSION"
          - "ProcessingCampaign(campaign_id).status == RUNNING -- else ERR_CAMPAIGN_NOT_RUNNING"
          - "every module in module_ids has status == RECOVERY_QUEUE -- else ERR_MODULE_NOT_IN_RECOVERY_QUEUE"
          - "every module's Intake.custody_state == RELEASED -- else ERR_INTAKE_NOT_RELEASED"
          - "CHEMISTRY_FAMILY_MAP[module.chemistry] == campaign.chemistry_family for every module -- else ERR_MODULE_CHEMISTRY_MISMATCH"
          - "campaign.committed_input_kg + sum(module.mass_kg) <= campaign.planned_input_kg -- else ERR_LOT_CHARGE_EXCEEDS_PLAN"
        side_effects:
          - "each module moves RECOVERY_QUEUE -> CHARGED with lot_id set"
          - "recomputes charged_mass_kg, Intake.assigned_mass_kg, Intake.unassigned_mass_kg and ProcessingCampaign.committed_input_kg"
          - "increments RecoveryLot.version by 1"
        note: "A lot already in CHARGED accepts no further charge call; additional mass requires a new lot."

      - from: CHARGED
        to: FINALIZED
        trigger: "POST /recycling/lots/{lot_id}/finalize"
        actor: AssayTechnician
        preconditions:
          - "status == CHARGED -- else ERR_LOT_NOT_CHARGED"
          - "count(RecoveryOutput where lot_id == lot.id) >= 1 -- else ERR_NO_RECOVERY_OUTPUTS"
          - "lot_mass_balance.mass_balance_pct >= MASS_BALANCE_FLOOR_PCT (97.00) -- else ERR_MASS_BALANCE_OUT_OF_TOLERANCE"
          - "every contributing Intake's SupplierSettlement has state == DRAFT -- else ERR_SETTLEMENT_NOT_DRAFT"
          - "a MetalIndexPrice row exists with effective_date <= clock_now for every payable metal with a RecoveryOutput line -- else ERR_INDEX_PRICE_UNAVAILABLE"
        side_effects:
          - "link 1: sets residue_mass_kg, recovered_mass_kg, accounted_mass_kg, unaccounted_mass_kg, mass_balance_pct, recycled_content_pct, finalized_at = clock_now"
          - "link 2: because the lot became FINALIZED, every Module with lot_id == lot.id and status == CHARGED becomes CONSUMED"
          - "link 3: because those modules became CONSUMED, each contributing Intake's DRAFT SupplierSettlement flips variant PROVISIONAL -> FINAL, re-prices via feedstock_payable_value[FINAL] + settlement_net_payable, sets price_basis_date = finalized_at and max_variance_pp via assay_variance_pp"
          - "link 4: because a settlement flipped to FINAL with max_variance_pp > SEVERE_VARIANCE_PP (2.00), Supplier.quality_strike_count increases by 1"
          - "bubble-up (conditional): if every RecoveryLot of the campaign is now terminal and the campaign is RUNNING, the campaign becomes CLOSED"
          - "increments RecoveryLot.version, and the version of every Module, SupplierSettlement, Supplier and ProcessingCampaign row touched, by 1 each"

      - from: OPEN
        to: VOIDED
        trigger: "POST /recycling/lots/{lot_id}/void"
        actor: PlantOperator
        preconditions:
          - "status IN {OPEN, CHARGED}"
        side_effects:
          - "sets void_reason"
          - "subtracts charged_mass_kg from ProcessingCampaign.committed_input_kg and resets charged_mass_kg to 0.0"
          - "increments RecoveryLot.version by 1"

      - from: CHARGED
        to: VOIDED
        trigger: "POST /recycling/lots/{lot_id}/void"
        actor: PlantOperator
        preconditions:
          - "status IN {OPEN, CHARGED}"
        side_effects:
          - "sets void_reason"
          - "every Module with lot_id == lot.id and status == CHARGED reverts to RECOVERY_QUEUE with lot_id = null"
          - "for each affected Intake, assigned_mass_kg decreases and unassigned_mass_kg increases by that module's mass_kg, keeping assigned_mass_kg + unassigned_mass_kg == module_mass_total_kg"
          - "subtracts the released mass from ProcessingCampaign.committed_input_kg and resets charged_mass_kg to 0.0"
          - "increments RecoveryLot.version, and the version of every Module, Intake and ProcessingCampaign row touched, by 1 each"

  - entity: SupplierSettlement
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /recycling/settlements/{settlement_id}/post"
        actor: SettlementAccountant
        preconditions:
          - "state == DRAFT -- else ERR_SETTLEMENT_NOT_DRAFT"
        side_effects:
          - "link 1: sets posted_amount_cents = net_payable_cents"
          - "link 2: because the settlement became POSTED, Supplier.payable_balance_cents increases by posted_amount_cents"
          - "link 3: because payable_balance_cents now exceeds Supplier.credit_limit_cents, Supplier.credit_hold flips false -> true"
          - "link 4: because credit_hold became true, every Intake of that supplier whose custody_state == RECEIVED becomes QUARANTINED with hold_reason = SUPPLIER_CREDIT_HOLD"
          - "increments SupplierSettlement.version, Supplier.version, and the version of every Intake row quarantined, by 1 each"

      - from: POSTED
        to: DISPUTED
        trigger: "POST /recycling/settlements/{settlement_id}/dispute"
        actor: SupplierRep
        preconditions:
          - "state == POSTED -- else ERR_SETTLEMENT_NOT_POSTED"
          - "X-User-ID == supplier_id -- else ERR_NOT_OWNER"
          - "variant == FINAL"
          - "max_variance_pp > DISPUTE_TOLERANCE_PP (0.50) -- else ERR_VARIANCE_WITHIN_TOLERANCE"
          - "dispute_round < DISPUTE_ROUND_LIMIT (3) -- else ERR_DISPUTE_ROUNDS_EXHAUSTED"
        side_effects:
          - "sets dispute_reason and increases dispute_round by 1"
          - "Supplier.payable_balance_cents is unchanged: a disputed amount is still owed"
          - "increments SupplierSettlement.version by 1"

      - from: DISPUTED
        to: UMPIRE_ROUND
        trigger: "POST /recycling/settlements/{settlement_id}/umpire-assay"
        actor: AssayTechnician
        preconditions:
          - "state == DISPUTED -- else ERR_SETTLEMENT_NOT_DISPUTED"
          - "a RecoveryOutput line exists for the requested metal on the contributing lot"
        side_effects:
          - "sets umpire_metal and umpire_contained_kg"
          - "increments SupplierSettlement.version by 1"

      - from: UMPIRE_ROUND
        to: DRAFT
        trigger: "POST /recycling/settlements/{settlement_id}/apply-umpire"
        actor: SettlementAccountant
        preconditions:
          - "state == UMPIRE_ROUND -- else ERR_SETTLEMENT_NOT_IN_UMPIRE_ROUND"
        side_effects:
          - "re-prices via feedstock_payable_value[FINAL] with umpire_contained_kg substituted for umpire_metal, then settlement_net_payable"
          - "Supplier.payable_balance_cents decreases by the old posted_amount_cents and posted_amount_cents resets to 0"
          - "because payable_balance_cents <= credit_limit_cents, Supplier.credit_hold flips true -> false and every Intake of that supplier whose custody_state == QUARANTINED and hold_reason == SUPPLIER_CREDIT_HOLD returns to RECEIVED with hold_reason cleared"
          - "increments SupplierSettlement.version, Supplier.version, and the version of every Intake row released, by 1 each"
        note: "Closes the settlement cycle DRAFT -> POSTED -> DISPUTED -> UMPIRE_ROUND -> DRAFT."

      - from: POSTED
        to: SETTLED
        trigger: "POST /recycling/settlements/{settlement_id}/settle"
        actor: SettlementAccountant
        preconditions:
          - "state == POSTED -- else ERR_SETTLEMENT_NOT_POSTED"
        side_effects:
          - "sets payment_reference"
          - "Supplier.paid_to_date_cents increases by posted_amount_cents and Supplier.payable_balance_cents decreases by the same amount"
          - "because payable_balance_cents <= credit_limit_cents, Supplier.credit_hold flips true -> false, and every Intake of that supplier whose custody_state == QUARANTINED and hold_reason == SUPPLIER_CREDIT_HOLD returns to RECEIVED with hold_reason cleared"
          - "increments SupplierSettlement.version, Supplier.version, and the version of every Intake row released, by 1 each"

      - from: POSTED
        to: VOIDED
        trigger: "POST /recycling/settlements/{settlement_id}/void"
        actor: SettlementAccountant
        preconditions:
          - "state == POSTED -- else ERR_SETTLEMENT_NOT_POSTED"
        side_effects:
          - "sets void_reason"
          - "Supplier.payable_balance_cents decreases by posted_amount_cents and posted_amount_cents resets to 0, restoring supplier_obligation_invariant"
          - "because payable_balance_cents <= credit_limit_cents, Supplier.credit_hold flips true -> false and SUPPLIER_CREDIT_HOLD quarantines are released to RECEIVED"
          - "increments SupplierSettlement.version, Supplier.version, and the version of every Intake row released, by 1 each"

  - entity: PermitAllotment
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /recycling/permit-allotments/{allotment_id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets suspend_reason"
          - "increments PermitAllotment.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at the start of POST /recycling/lots/{lot_id}/discharge-events"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "clock_now > valid_to"
        side_effects:
          - "increments PermitAllotment.version by 1"
          - "the triggering discharge-event request is then rejected with ERR_PERMIT_NOT_ACTIVE"
        note: "No wall-clock dependency: the logical clock is moved explicitly by POST /recycling/_clock/set_current_utc."

  - entity: DischargeEvent
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /recycling/discharge-events/{event_id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == POSTED -- else ERR_DISCHARGE_EVENT_NOT_POSTED"
        side_effects:
          - "sets void_reason"
          - "subtracts mass_kg from PermitAllotment.consumed_kg, restoring permit_allowance_invariant"
          - "increments DischargeEvent.version and PermitAllotment.version by 1 each"

  - entity: BatteryPassport
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /recycling/passports/{passport_id}/revoke"
        actor: CertificationOfficer
        preconditions:
          - "status == ISSUED -- else ERR_PASSPORT_NOT_ISSUED"
        side_effects:
          - "sets revoked_reason"
          - "increments BatteryPassport.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: module-create-stale-intake
    parent_entity: Intake
    write_endpoint: "POST /recycling/intakes/{intake_id}/modules"
    occ_field: "expected_intake_version"
    description: |
      Adding a Module to an Intake whose version has advanced since the client last
      observed it is rejected as a stale write. Module creation is legitimately
      repeatable - a dismantler books one module row per module pulled from the pack,
      and each insertion recomputes Intake.module_mass_total_kg and
      Intake.unassigned_mass_kg - so a second insertion carrying a fresh version
      would succeed on its own merits. Only the stale version distinguishes the
      rejected write.
    error_id: ERR_STALE_INTAKE_VERSION
    http_status: 412

  - rule_id: lot-charge-stale-lot
    parent_entity: RecoveryLot
    write_endpoint: "POST /recycling/lots/{lot_id}/charge"
    occ_field: "expected_lot_version"
    description: |
      Charging modules into a RecoveryLot whose version has advanced since the client
      last observed it is rejected as a stale write. The charge sheet is built from a
      read of the lot, and any accepted mutation of that lot (a prior charge, a void)
      invalidates the mass arithmetic the client based its module list on.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: module_second_life_score
    trigger: "POST /recycling/modules/{module_id}/triage-decisions (Module PENDING_TRIAGE -> one of the three queues); writes TriageDecision.score/grade/derived_disposition/disposition and Module.second_life_score/grade"
    algorithm: weighted_scoring
    formula: |
      # Steps run in this exact order.
      1. soh_input_pct = (scoring_variant == "CONSERVATIVE")
                            ? module.min_cell_capacity_pct
                            : module.mean_cell_capacity_pct
      2. cycle_penalty  = min(CYCLE_PENALTY_CAP_POINTS, module.cycle_count / CYCLES_PER_POINT)
      3. imbalance_penalty = (module.mean_cell_capacity_pct - module.min_cell_capacity_pct)
                             * IMBALANCE_WEIGHT
      4. score = round_half_up(soh_input_pct - cycle_penalty - imbalance_penalty, 2)
      5. grade = "A" if score >= 80.0
                 else "B" if score >= 70.0
                 else "C" if score >= 60.0
                 else "D"                       # all bounds are inclusive lower bounds
      6. derived_disposition = "REFURBISH"        if grade == "A"
                               "SECOND_LIFE"      if grade IN {"B", "C"}
                               "MATERIAL_RECOVERY" if grade == "D"
      7. disposition = override_disposition if override_disposition != null
                       else derived_disposition
    input_set: "Exactly one Module row, read at request time; no other module or lot participates."
    constants:
      CYCLE_PENALTY_CAP_POINTS: 20.0
      CYCLES_PER_POINT: 200
      IMBALANCE_WEIGHT: 0.80
      GRADE_A_FLOOR: 80.0
      GRADE_B_FLOOR: 70.0
      GRADE_C_FLOOR: 60.0
    precision: "score 2 decimal places, round_half_up; grade bands compare the rounded score"
    variants:
      - name: CONSERVATIVE
        when: "scoring_variant == CONSERVATIVE - warranty-grade assessment for resale"
        difference: "Uses min_cell_capacity_pct (worst cell) as soh_input_pct, which lowers the score and can drop the grade a band relative to FLEET_AVERAGE on identical module data."
      - name: FLEET_AVERAGE
        when: "scoring_variant == FLEET_AVERAGE - fleet-level screening"
        difference: "Uses mean_cell_capacity_pct as soh_input_pct, producing a strictly higher score whenever mean > min, so the same module can be graded A (REFURBISH) here and B (SECOND_LIFE) under CONSERVATIVE."

  - name: quality_deduction_pct
    trigger: "Evaluated inside settlement_net_payable step 4, i.e. on POST /recycling/intakes/{intake_id}/release (PROVISIONAL) and on the FINAL flip inside POST /recycling/lots/{lot_id}/finalize and POST /recycling/settlements/{settlement_id}/apply-umpire; writes SupplierSettlement.quality_deduction_pct"
    algorithm: threshold
    formula: |
      # Non-linear: three additive components, each individually capped, then a
      # multiplicative escalation gated on supplier state, then a global cap.
      base = 0.0
      if intake.identified_chemistry != intake.declared_chemistry:
          base = base + MISLABEL_PENALTY_PCT
      moisture_excess_pp = max(0.0, intake.moisture_pct - MOISTURE_FREE_PP)
      base = base + min(MOISTURE_COMPONENT_CAP, moisture_excess_pp * MOISTURE_RATE_PER_PP)
      foreign_excess_pp  = max(0.0, intake.foreign_material_pct - FOREIGN_FREE_PP)
      base = base + min(FOREIGN_COMPONENT_CAP, foreign_excess_pp * FOREIGN_RATE_PER_PP)
      if supplier.quality_strike_count >= STRIKE_ESCALATION_THRESHOLD:
          base = base * REPEAT_OFFENDER_MULTIPLIER
      quality_deduction_pct = round_half_up(min(TOTAL_DEDUCTION_CAP, base), 4)
    input_set: |
      The Intake row of this settlement plus the Supplier row read at the START of the
      request. Supplier.quality_strike_count is read before any strike this same request
      might add in finalize link 4, so the calculation never observes its own side effect.
    constants:
      MISLABEL_PENALTY_PCT: 0.04
      MOISTURE_FREE_PP: 2.0
      MOISTURE_RATE_PER_PP: 0.01
      MOISTURE_COMPONENT_CAP: 0.06
      FOREIGN_FREE_PP: 1.5
      FOREIGN_RATE_PER_PP: 0.02
      FOREIGN_COMPONENT_CAP: 0.05
      STRIKE_ESCALATION_THRESHOLD: 3
      REPEAT_OFFENDER_MULTIPLIER: 1.5
      TOTAL_DEDUCTION_CAP: 0.20
    precision: "4 decimal places, round_half_up"

  - name: feedstock_payable_value
    trigger: "POST /recycling/intakes/{intake_id}/release (variant PROVISIONAL) and the FINAL flip inside POST /recycling/lots/{lot_id}/finalize / POST /recycling/settlements/{settlement_id}/apply-umpire (variant FINAL); writes SupplierSettlement.line_breakdown and gross_cents"
    algorithm: tiered_pricing
    formula: |
      PAYABLE_METALS is iterated in the fixed order [NI, CO, LI, CU].

      for metal m in PAYABLE_METALS:
          if variant == "PROVISIONAL":
              contained_kg    = round_half_up(intake.net_mass_kg
                                              * intake.declared_<m>_pct / 100, 3)
              recovery_factor = NOMINAL_RECOVERY[intake.identified_chemistry][m]
              price_date      = intake.received_at
          else:                                     # variant == "FINAL"
              # Sum the lot's assay ledger, then apportion to this intake by charged mass.
              lot_recovered_kg = sum(RecoveryOutput.recovered_mass_kg
                                     for outputs of the contributing lot where metal == m)
              # Umpire substitution (apply-umpire only): when settlement.umpire_metal == m,
              # lot_recovered_kg is replaced by settlement.umpire_contained_kg.
              intake_share = sum(Module.mass_kg for modules of THIS intake whose
                                 lot_id == lot.id and status IN {CHARGED, CONSUMED})
                             / lot.charged_mass_kg
              contained_kg    = round_half_up(lot_recovered_kg * intake_share, 3)
              recovery_factor = 1.0                 # actual yields already net of recovery
              price_date      = lot.finalized_at
          if contained_kg * recovery_factor == 0:
              line_cents = 0                        # no index lookup performed
          else:
              unit_price_cents_per_kg =
                  MetalIndexPrice(metal == m, effective_date <= price_date)
                  ordered by effective_date DESC, then created_at DESC, take 1
                  -> if no such row: ERR_INDEX_PRICE_UNAVAILABLE
              line_cents = round_half_up(contained_kg * recovery_factor
                                         * unit_price_cents_per_kg * PAYABLE_SHARE[m], 0)
          append { metal: m, contained_kg, unit_price_cents_per_kg, payable_share,
                   line_cents } to line_breakdown
      gross_cents = sum(line_breakdown[].line_cents)
    input_set: |
      PROVISIONAL: the Intake's four declared assay percentages and its identified_chemistry
      recovery factors; no RecoveryOutput row participates.
      FINAL: every RecoveryOutput row of the single contributing lot whose metal is in
      PAYABLE_METALS (MN and GRAPHITE lines are recovered but never payable), apportioned
      by the intake's share of lot.charged_mass_kg. Modules counted for intake_share are
      those with status IN {CHARGED, CONSUMED}.
    constants:
      PAYABLE_METALS: [NI, CO, LI, CU]
      PAYABLE_SHARE: { NI: 0.70, CO: 0.70, LI: 0.55, CU: 0.40 }
      NOMINAL_RECOVERY:
        NMC622: { NI: 0.95, CO: 0.95, LI: 0.80, CU: 0.90 }
        NCA:    { NI: 0.95, CO: 0.90, LI: 0.80, CU: 0.90 }
        LMO:    { NI: 0.00, CO: 0.00, LI: 0.75, CU: 0.90 }
        LFP:    { NI: 0.00, CO: 0.00, LI: 0.75, CU: 0.90 }
    precision: |
      MANDATORY ROUNDING ORDER: each metal's line_cents is rounded to whole cents
      (round_half_up) FIRST, and gross_cents is the sum of those already-rounded lines.
      Summing the unrounded line values and rounding once at the end is WRONG and can
      differ by one or more cents. contained_kg is rounded to 3 decimals before pricing.
      When a lot's charged mass spans several intakes, contained_kg is apportioned
      pro-rata and the intake with the LATEST Intake.created_at absorbs the rounding
      remainder so the apportioned masses sum exactly to lot_recovered_kg (created_at is
      the tie-break input; the random `id` is never consulted).
    variants:
      - name: PROVISIONAL
        when: "Settlement created at intake release, before any material is processed."
        difference: "Prices the supplier's DECLARED assay times the chemistry's nominal recovery factor at the index quote effective on or before Intake.received_at."
      - name: FINAL
        when: "Settlement re-priced when the contributing lot is finalized (and again on apply-umpire)."
        difference: "Prices the ACTUAL RecoveryOutput masses with recovery_factor 1.0 at the index quote effective on or before RecoveryLot.finalized_at, so identical feedstock yields a different gross_cents than PROVISIONAL through three independent channels: assay truth, recovery factor and quote date."

  - name: settlement_net_payable
    trigger: "Runs immediately after feedstock_payable_value on POST /recycling/intakes/{intake_id}/release, on the FINAL flip inside POST /recycling/lots/{lot_id}/finalize, and on POST /recycling/settlements/{settlement_id}/apply-umpire; writes SupplierSettlement.processing_fee_pct/processing_fee_cents/quality_deduction_cents/pre_surcharge_net_cents/hazmat_surcharge_cents/net_payable_cents"
    algorithm: waterfall_allocation
    formula: |
      # The surcharge cap looks circular (the cap is a share of the net, and the net is
      # the pre-surcharge figure minus the surcharge). The order below is MANDATORY and
      # resolves it: the cap is taken on pre_surcharge_net_cents, never on the final net.
      step 1: gross_cents = feedstock_payable_value(variant).gross_cents
      step 2: processing_fee_pct = PROCESSING_FEE_TIERS lookup on gross_cents
                 gross_cents < 500000                      -> 0.12
                 500000 <= gross_cents < 2000000           -> 0.09
                 gross_cents >= 2000000                    -> 0.06
      step 3: processing_fee_cents = round_half_up(gross_cents * processing_fee_pct, 0)
      step 4: quality_deduction_pct = quality_deduction_pct calculation
              quality_deduction_cents = round_half_up(gross_cents * quality_deduction_pct, 0)
      step 5: pre_surcharge_net_cents = gross_cents - processing_fee_cents
                                                   - quality_deduction_cents
      step 6: hazmat_surcharge_cents = min(
                  HAZMAT_FLAT_CENTS + round_half_up(intake.net_mass_kg * HAZMAT_PER_KG_CENTS, 0),
                  round_half_up(pre_surcharge_net_cents * HAZMAT_CAP_PCT, 0) )
      step 7: net_payable_cents = pre_surcharge_net_cents - hazmat_surcharge_cents
    input_set: "One SupplierSettlement row plus its Intake and Supplier; no aggregation across settlements."
    constants:
      PROCESSING_FEE_TIERS: [{ upper_exclusive_cents: 500000, pct: 0.12 }, { upper_exclusive_cents: 2000000, pct: 0.09 }, { upper_exclusive_cents: null, pct: 0.06 }]
      HAZMAT_FLAT_CENTS: 2500
      HAZMAT_PER_KG_CENTS: 6
      HAZMAT_CAP_PCT: 0.05
    precision: "All money is whole cents; every intermediate rounding is round_half_up and is applied at the step shown, never deferred."

  - name: lot_mass_balance
    trigger: "POST /recycling/lots/{lot_id}/finalize (RecoveryLot CHARGED -> FINALIZED); writes RecoveryLot.recovered_mass_kg/accounted_mass_kg/unaccounted_mass_kg/mass_balance_pct/recycled_content_pct"
    algorithm: aggregation
    formula: |
      recovered_mass_kg   = round_half_up(sum(RecoveryOutput.recovered_mass_kg
                                              for ALL outputs where lot_id == lot.id), 3)
      accounted_mass_kg   = round_half_up(recovered_mass_kg + request.residue_mass_kg, 3)
      unaccounted_mass_kg = round_half_up(lot.charged_mass_kg - accounted_mass_kg, 3)
      mass_balance_pct    = round_half_up(accounted_mass_kg / lot.charged_mass_kg * 100, 2)
      recycled_content_pct= round_half_up(recovered_mass_kg / lot.charged_mass_kg * 100, 2)
      gate: mass_balance_pct >= MASS_BALANCE_FLOOR_PCT   # inclusive: exactly 97.00 passes
            else ERR_MASS_BALANCE_OUT_OF_TOLERANCE
    input_set: |
      Every RecoveryOutput row of this lot with no status filter (the ledger is append-only
      and immutable), across all six metals including the non-payable MN and GRAPHITE
      streams, plus lot.charged_mass_kg which counts Modules with status IN {CHARGED, CONSUMED}
      and lot_id == lot.id.
    constants:
      MASS_BALANCE_FLOOR_PCT: 97.00
      PASSPORT_MIN_CONTENT_PCT: 35.00
    precision: "masses 3 decimals round_half_up; percentages 2 decimals round_half_up"

  - name: assay_variance_pp
    trigger: "Computed on the FINAL flip inside POST /recycling/lots/{lot_id}/finalize and on POST /recycling/settlements/{settlement_id}/apply-umpire; writes SupplierSettlement.max_variance_pp and gates POST /recycling/settlements/{settlement_id}/dispute"
    algorithm: aggregation
    formula: |
      for metal m in PAYABLE_METALS ([NI, CO, LI, CU], fixed order):
          final_pct[m]   = final_contained_kg[m] / intake.net_mass_kg * 100
                           # final_contained_kg[m] is the FINAL line_breakdown entry's contained_kg
          variance_pp[m] = round_half_up(abs(intake.declared_<m>_pct - final_pct[m]), 2)
      max_variance_pp = max(variance_pp[m] over PAYABLE_METALS)   # ties are irrelevant: max of scalars
      dispute gate:  max_variance_pp >  DISPUTE_TOLERANCE_PP   # STRICT: exactly 0.50 is NOT disputable
      strike gate:   max_variance_pp >  SEVERE_VARIANCE_PP     # STRICT: exactly 2.00 adds no strike
    input_set: "The four declared assay percentages of the Intake and the four FINAL line_breakdown contained_kg values of the same settlement; MN and GRAPHITE never participate."
    constants:
      DISPUTE_TOLERANCE_PP: 0.50
      SEVERE_VARIANCE_PP: 2.00
      DISPUTE_ROUND_LIMIT: 3
    precision: "2 decimal places, round_half_up, per metal before the max is taken"

  - name: campaign_line_occupation
    trigger: "POST /recycling/campaigns - validated before the campaign row is created"
    algorithm: interval_merge
    formula: |
      Candidate interval C = [window_start, window_end)  (half-open).
      Incumbents = every ProcessingCampaign on the SAME line_id whose status IN
                   {SCHEDULED, RUNNING}, ordered by window_start ASC then created_at ASC.
      for each incumbent I = [I.window_start, I.window_end):
          if C.window_start < I.window_end and I.window_start < C.window_end:
              -> ERR_CAMPAIGN_WINDOW_CONFLICT          # strict half-open overlap
      # Adjacency: C.window_start == I.window_end touches but does not overlap.
      for each incumbent I where I.chemistry_family != C.chemistry_family:
          gap_hours = (C.window_start - I.window_end) in hours if C starts after I ends
                      else (I.window_start - C.window_end) in hours
          if gap_hours < line.changeover_buffer_hours:
              -> ERR_CHANGEOVER_BUFFER_VIOLATION
      # Same-family neighbours need NO gap: gap_hours == 0 is accepted.
      capacity: window_hours = (window_end - window_start) in hours
                if planned_input_kg > line.throughput_kg_per_hour * window_hours:
                    -> ERR_CAMPAIGN_CAPACITY_EXCEEDED   # strict >: equality is accepted
    input_set: "Campaigns on the same ProcessingLine with status IN {SCHEDULED, RUNNING}; CLOSED and CANCELLED campaigns free their window."
    constants:
      DEFAULT_CHANGEOVER_BUFFER_HOURS: 6
    precision: "Instants compared at millisecond resolution; gap_hours as an exact rational number of hours."

  - name: permit_daily_bucket_usage
    trigger: "POST /recycling/lots/{lot_id}/discharge-events - validated before the event row is created"
    algorithm: aggregation
    formula: |
      window gate (CLOSED interval, both ends inclusive):
          if not (allotment.valid_from <= request.event_date <= allotment.valid_to):
              -> ERR_PERMIT_WINDOW_EXCLUDED
      bucket_key = UTC calendar date of request.event_date
      bucket_used_kg = round_half_up(sum(DischargeEvent.mass_kg
                          for events where allotment_id == allotment.id
                          and status == POSTED
                          and UTC calendar date of event_date == bucket_key), 3)
      if round_half_up(bucket_used_kg + request.mass_kg, 3) > allotment.daily_cap_kg:
          -> ERR_DISCHARGE_DAILY_CAP_EXCEEDED     # strict >: exactly the cap is accepted
      on success: allotment.consumed_kg = round_half_up(allotment.consumed_kg
                                                        + request.mass_kg, 3)
    input_set: "POSTED DischargeEvent rows of the same allotment sharing the same UTC calendar date; VOIDED events are excluded and no other allotment's events participate."
    constants: {}
    precision: "masses 3 decimals round_half_up; bucket key is the UTC date, so 23:59:59.999Z and 00:00:00.000Z of the next day are different buckets"

  - name: facility_capacity_projection
    trigger: "GET /recycling/facilities/{facility_id}/capacity-projection"
    algorithm: forward_looking
    formula: |
      window_start_instant = clock_now - LOOKBACK_DAYS days
      baseline_kg_per_day = round_half_up(
          sum(Intake.net_mass_kg for intakes where facility_id == facility.id
              and custody_state IN {RECEIVED, IDENTIFIED, DISCHARGED, PACKAGED, RELEASED}
              and window_start_instant <= received_at <= clock_now)      # both ends inclusive
          / LOOKBACK_DAYS, 3)
      for d in 1..horizon_days:
          projected_kg[d] = round_half_up(baseline_kg_per_day
                                          * (1 + GROWTH_RATE_PER_DAY * d), 3)
      projected_input_kg = round_half_up(sum(projected_kg[d] for d in 1..horizon_days), 3)
      first_deficit_day  = the smallest d in 1..horizon_days with
                           projected_kg[d] > facility.mech_capacity_kg_per_day   # STRICT >
                           or null when no day qualifies
      first_deficit_date = clock_now + first_deficit_day days (null when no deficit)
      deficit_kg         = round_half_up(projected_kg[first_deficit_day]
                                         - facility.mech_capacity_kg_per_day, 3)
                           or 0.0 when first_deficit_day is null
    input_set: |
      Intakes of this facility whose custody_state is NOT QUARANTINED (quarantined mass is
      excluded from the return stream) and whose received_at falls in the closed 30-day
      lookback ending at clock_now. Intake rows are never deleted, so the projection is a
      pure function of the clock position and the intake ledger.
    constants:
      LOOKBACK_DAYS: 30
      GROWTH_RATE_PER_DAY: 0.004
    precision: "3 decimal places, round_half_up, applied per projected day BEFORE the horizon sum"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present, and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "SupplierRep acting on a settlement must satisfy X-User-ID == SupplierSettlement.supplier_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /recycling/settlements/{settlement_id}/dispute"

  - priority: 3
    category: auth
    check: "The X-User-ID closing a manifest must differ from HazmatManifest.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recycling/intakes/{intake_id}/manifests/{manifest_id}/close"

  - priority: 4
    category: business_constraint
    check: "Request body shape: required fields present, enums in range, numbers within declared constraints, arrays non-empty, uniqueness of (Module.serial_code per intake), (RecoveryOutput.lot_id, metal), (BatteryPassport.passport_code)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "Path resources exist, validated left to right: facility, supplier, intake, manifest, module, line, campaign, lot, settlement, allotment, discharge event, passport"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 6
    category: existence
    check: "Body foreign keys exist: Intake.supplier_id/facility_id, ProcessingLine.facility_id, ProcessingCampaign.line_id, DischargeEvent.allotment_id, every id in charge.module_ids, PermitAllotment.facility_id"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /recycling/intakes, POST /recycling/processing-lines, POST /recycling/campaigns, POST /recycling/permit-allotments, POST /recycling/lots/{lot_id}/charge, POST /recycling/lots/{lot_id}/discharge-events"

  - priority: 7
    category: state
    check: "expected_intake_version / expected_lot_version equals the parent's current version (see concurrency_rules)"
    error_id: "ERR_STALE_INTAKE_VERSION | ERR_STALE_LOT_VERSION"
    http_status: 412
    applies_to: "POST /recycling/intakes/{intake_id}/modules, POST /recycling/lots/{lot_id}/charge"

  - priority: 8
    category: state
    check: "Target resource is in a state from which this transition is declared in 1.2 (custody_state, compliance_state, manifest.status, module.status, lot.status, campaign.status, settlement.state, allotment.status, event.status, passport.status)"
    error_id: "ERR_INVALID_CUSTODY_STATE | ERR_INVALID_COMPLIANCE_STATE | ERR_MANIFEST_NOT_SUBMITTED | ERR_MODULE_NOT_TRIAGEABLE | ERR_MODULE_NOT_IN_RECOVERY_QUEUE | ERR_MODULE_NOT_SHIPPABLE | ERR_LOT_NOT_OPEN | ERR_LOT_NOT_CHARGED | ERR_CAMPAIGN_NOT_RUNNING | ERR_CAMPAIGN_NOT_SCHEDULED | ERR_SETTLEMENT_NOT_DRAFT | ERR_SETTLEMENT_NOT_POSTED | ERR_SETTLEMENT_NOT_DISPUTED | ERR_SETTLEMENT_NOT_IN_UMPIRE_ROUND | ERR_DISCHARGE_EVENT_NOT_POSTED | ERR_PASSPORT_NOT_ISSUED | ERR_PASSPORT_ALREADY_ISSUED | ERR_DISPUTE_ROUNDS_EXHAUSTED | ERR_LINE_HAS_RUNNING_CAMPAIGN"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 9
    category: business_safety
    check: "Regulatory and physical-safety gates: Facility.status == ACTIVE for new intakes; Intake.soc_pct <= 30.0 before packaging; PermitAllotment.status == ACTIVE (after lazy expiry) before a discharge event; ProcessingLine.status == AVAILABLE before a campaign start"
    error_id: "ERR_FACILITY_SUSPENDED | ERR_SOC_ABOVE_PACKAGING_LIMIT | ERR_PERMIT_NOT_ACTIVE | ERR_LINE_NOT_AVAILABLE"
    http_status: 422
    applies_to: "POST /recycling/intakes, POST /recycling/intakes/{intake_id}/package, POST /recycling/lots/{lot_id}/discharge-events, POST /recycling/campaigns/{campaign_id}/start"

  - priority: 10
    category: business_temporal
    check: "Interval geometry: campaign window overlap on a line, changeover buffer against a different-family neighbour, discharge event_date inside the permit's closed validity interval, campaign start before window_end"
    error_id: "ERR_CAMPAIGN_WINDOW_CONFLICT | ERR_CHANGEOVER_BUFFER_VIOLATION | ERR_PERMIT_WINDOW_EXCLUDED | ERR_CAMPAIGN_WINDOW_CLOSED"
    http_status: "409 for ERR_CAMPAIGN_WINDOW_CONFLICT, 422 for the rest"
    applies_to: "POST /recycling/campaigns, POST /recycling/campaigns/{campaign_id}/start, POST /recycling/lots/{lot_id}/discharge-events"

  - priority: 11
    category: business_constraint
    check: "Quantitative ceilings and floors: campaign planned_input_kg vs line capacity, charge mass vs planned_input_kg, discharge daily bucket vs daily_cap_kg, mass balance floor, at least one recovery output, recycled content floor for a passport, duplicate index quote, disposition override permitted for the grade, dispute variance above tolerance"
    error_id: "ERR_CAMPAIGN_CAPACITY_EXCEEDED | ERR_LOT_CHARGE_EXCEEDS_PLAN | ERR_DISCHARGE_DAILY_CAP_EXCEEDED | ERR_MASS_BALANCE_OUT_OF_TOLERANCE | ERR_NO_RECOVERY_OUTPUTS | ERR_RECYCLED_CONTENT_BELOW_MINIMUM | ERR_DUPLICATE_INDEX_PRICE | ERR_DISPOSITION_OVERRIDE_NOT_PERMITTED | ERR_VARIANCE_WITHIN_TOLERANCE"
    http_status: "422, except 409 for ERR_DUPLICATE_INDEX_PRICE"
    applies_to: "POST /recycling/campaigns, POST /recycling/lots/{lot_id}/charge, POST /recycling/lots/{lot_id}/discharge-events, POST /recycling/lots/{lot_id}/finalize, POST /recycling/lots/{lot_id}/passports, POST /recycling/metal-index-prices, POST /recycling/modules/{module_id}/triage-decisions, POST /recycling/settlements/{settlement_id}/dispute"

  - priority: 12
    category: business_referential
    check: "Cross-entity link integrity: module chemistry family matches the campaign, metal stream is recoverable on the line type, the module's intake has been released, no module of the intake is already committed to a lot, campaign chemistry_family equals the line's"
    error_id: "ERR_MODULE_CHEMISTRY_MISMATCH | ERR_METAL_NOT_RECOVERABLE_ON_LINE | ERR_INTAKE_NOT_RELEASED | ERR_MODULES_ALREADY_COMMITTED | ERR_CAMPAIGN_FAMILY_MISMATCH"
    http_status: "422, except 409 for ERR_MODULES_ALREADY_COMMITTED"
    applies_to: "POST /recycling/lots/{lot_id}/charge, POST /recycling/lots/{lot_id}/recovery-outputs, POST /recycling/modules/{module_id}/ship, POST /recycling/intakes/{intake_id}/manifests/{manifest_id}/reject, POST /recycling/campaigns"

  - priority: 13
    category: business_fiscal
    check: "Money gates evaluated last: the supplier is not on credit hold, and an index quote exists on or before the price basis date for every priced metal"
    error_id: "ERR_SUPPLIER_CREDIT_HOLD | ERR_INDEX_PRICE_UNAVAILABLE"
    http_status: "402 for ERR_SUPPLIER_CREDIT_HOLD, 422 for ERR_INDEX_PRICE_UNAVAILABLE"
    applies_to: "POST /recycling/intakes, POST /recycling/intakes/{intake_id}/release, POST /recycling/lots/{lot_id}/finalize"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving surface -------------------------------------------------
  - method: POST
    path: "/recycling/_clock/set_current_utc"
    description: "Move the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00.000Z; before any call to this endpoint every timestamp the server stamps and every window/expiry comparison uses that default, never real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets the logical clock used by received_at, released_at, finalized_at, issued_at, permit lazy expiry, campaign window checks and the capacity projection"]

  # ---- facilities -----------------------------------------------------------
  - method: POST
    path: "/recycling/facilities"
    description: "Register a recycling campus."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, mech_capacity_kg_per_day, hydro_capacity_kg_per_day, "status?"]
    output: Facility
    side_effects: []

  - method: GET
    path: "/recycling/facilities/{facility_id}"
    description: "Read one campus."
    roles: [PlatformAdmin, PlantOperator, ComplianceOfficer, IntakeClerk, AssayTechnician, SettlementAccountant, CertificationOfficer, TriageEngineer, MarketAnalyst]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/recycling/facilities/{facility_id}/capacity-projection"
    description: "Forward-looking return-stream projection against the campus mechanical ceiling."
    roles: [PlatformAdmin, PlantOperator, ComplianceOfficer]
    code: 200
    input: [horizon_days]
    output: "{ baseline_kg_per_day: number, horizon_days: integer, projected_input_kg: number, mech_capacity_kg_per_day: number, hydro_capacity_kg_per_day: number, first_deficit_day: integer, first_deficit_date: datetime, deficit_kg: number }"
    side_effects: ["runs facility_capacity_projection; no persisted state changes"]

  # ---- suppliers ------------------------------------------------------------
  - method: POST
    path: "/recycling/suppliers"
    description: "Register a feedstock counterparty."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, channel, credit_limit_cents, "contact_email?"]
    output: Supplier
    side_effects: []

  - method: GET
    path: "/recycling/suppliers/{supplier_id}"
    description: "Read one counterparty including its payable ledger and credit hold flag."
    roles: [PlatformAdmin, SettlementAccountant, ComplianceOfficer, IntakeClerk, PlantOperator, SupplierRep]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/recycling/suppliers/{supplier_id}/quality-strikes"
    description: "Log a feedstock quality incident against a counterparty (operator-facing quality register)."
    roles: [ComplianceOfficer]
    code: 200
    input: [incident_code]
    output: Supplier
    side_effects: ["increases Supplier.quality_strike_count by 1", "increments Supplier.version by 1"]

  # ---- metal index prices ---------------------------------------------------
  - method: POST
    path: "/recycling/metal-index-prices"
    description: "Publish an index quote for one metal effective from an instant."
    roles: [MarketAnalyst]
    code: 201
    input: [metal, effective_date, price_cents_per_kg, "source_index?"]
    output: MetalIndexPrice
    side_effects: ["rejects a duplicate (metal, effective_date) pair with ERR_DUPLICATE_INDEX_PRICE"]

  - method: GET
    path: "/recycling/metal-index-prices"
    description: "List index quotes, newest effective_date first."
    roles: [PlatformAdmin, MarketAnalyst, SettlementAccountant, AssayTechnician]
    code: 200
    input: ["metal?", "effective_on_or_before?", "limit?", "offset?"]
    output: MetalIndexPrice[]
    side_effects: []

  # ---- permits --------------------------------------------------------------
  - method: POST
    path: "/recycling/permit-allotments"
    description: "Record an air or water discharge permit allotment for a campus."
    roles: [ComplianceOfficer]
    code: 201
    input: [facility_id, medium, permit_no, valid_from, valid_to, daily_cap_kg]
    output: PermitAllotment
    side_effects: []

  - method: GET
    path: "/recycling/permit-allotments"
    description: "List permit allotments, filterable by campus and medium."
    roles: [PlatformAdmin, ComplianceOfficer, PlantOperator]
    code: 200
    input: ["facility_id?", "medium?", "status?", "limit?", "offset?"]
    output: PermitAllotment[]
    side_effects: []

  - method: GET
    path: "/recycling/permit-allotments/{allotment_id}"
    description: "Read one permit allotment including consumed_kg."
    roles: [PlatformAdmin, ComplianceOfficer, PlantOperator]
    code: 200
    input: []
    output: PermitAllotment
    side_effects: []

  - method: POST
    path: "/recycling/permit-allotments/{allotment_id}/suspend"
    description: "Suspend a permit allotment after a regulator finding."
    roles: [ComplianceOfficer]
    code: 200
    input: [suspend_reason]
    output: PermitAllotment
    side_effects: ["PermitAllotment ACTIVE -> SUSPENDED", "increments PermitAllotment.version by 1"]

  # ---- processing lines -----------------------------------------------------
  - method: POST
    path: "/recycling/processing-lines"
    description: "Commission a mechanical or hydrometallurgical line."
    roles: [PlatformAdmin]
    code: 201
    input: [facility_id, line_code, line_type, chemistry_family, throughput_kg_per_hour, "changeover_buffer_hours?", "status?"]
    output: ProcessingLine
    side_effects: []

  - method: GET
    path: "/recycling/processing-lines"
    description: "List lines, filterable by campus."
    roles: [PlatformAdmin, PlantOperator, AssayTechnician, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "line_type?", "limit?", "offset?"]
    output: ProcessingLine[]
    side_effects: []

  - method: GET
    path: "/recycling/processing-lines/{line_id}"
    description: "Read one line."
    roles: [PlatformAdmin, PlantOperator, AssayTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: ProcessingLine
    side_effects: []

  - method: POST
    path: "/recycling/processing-lines/{line_id}/replumb"
    description: "Re-plumb a line to the other chemistry family. Already-SCHEDULED campaigns keep the family they were scheduled with, which is what makes the changeover buffer between neighbouring campaigns observable."
    roles: [PlatformAdmin]
    code: 200
    input: [chemistry_family]
    output: ProcessingLine
    side_effects: ["sets ProcessingLine.chemistry_family", "rejected with ERR_LINE_HAS_RUNNING_CAMPAIGN when any ProcessingCampaign on this line has status == RUNNING", "increments ProcessingLine.version by 1"]

  # ---- intakes --------------------------------------------------------------
  - method: POST
    path: "/recycling/intakes"
    description: "Book an end-of-life battery shipment into custody; stamps received_at from the logical clock."
    roles: [IntakeClerk]
    code: 201
    input: [supplier_id, facility_id, declared_chemistry, gross_mass_kg, packaging_tare_kg, "declared_ni_pct?", "declared_co_pct?", "declared_li_pct?", "declared_cu_pct?", "moisture_pct?", "foreign_material_pct?"]
    output: Intake
    side_effects: ["custody_state = RECEIVED, compliance_state = MANIFEST_DRAFT", "computes net_mass_kg", "rejects when Facility.status == SUSPENDED or Supplier.credit_hold == true"]

  - method: GET
    path: "/recycling/intakes"
    description: "List intakes with filters and pagination."
    roles: [PlatformAdmin, IntakeClerk, PlantOperator, ComplianceOfficer, SettlementAccountant, TriageEngineer, SupplierRep]
    code: 200
    input: ["supplier_id?", "facility_id?", "custody_state?", "compliance_state?", "limit?", "offset?"]
    output: Intake[]
    side_effects: []

  - method: GET
    path: "/recycling/intakes/{intake_id}"
    description: "Read one intake including both state dimensions and the mass ledger."
    roles: [PlatformAdmin, IntakeClerk, PlantOperator, ComplianceOfficer, SettlementAccountant, TriageEngineer, AssayTechnician, SupplierRep]
    code: 200
    input: []
    output: Intake
    side_effects: []

  - method: POST
    path: "/recycling/intakes/{intake_id}/identify-chemistry"
    description: "Record the chemistry confirmed at the identification bench."
    roles: [IntakeClerk]
    code: 200
    input: [identified_chemistry]
    output: Intake
    side_effects: ["custody_state RECEIVED -> IDENTIFIED", "increments Intake.version by 1"]

  - method: POST
    path: "/recycling/intakes/{intake_id}/discharge"
    description: "Record a state-of-charge measurement after a discharge run; repeatable while DISCHARGED."
    roles: [PlantOperator]
    code: 200
    input: [soc_pct]
    output: Intake
    side_effects: ["custody_state IDENTIFIED -> DISCHARGED, or DISCHARGED -> DISCHARGED on re-measurement", "overwrites soc_pct", "increments Intake.version by 1"]

  - method: POST
    path: "/recycling/intakes/{intake_id}/package"
    description: "Pack the discharged cells into UN-approved packaging."
    roles: [PlantOperator]
    code: 200
    input: [packaging_type]
    output: Intake
    side_effects: ["custody_state DISCHARGED -> PACKAGED only when soc_pct <= 30.0", "increments Intake.version by 1"]

  - method: POST
    path: "/recycling/intakes/{intake_id}/manifests"
    description: "Submit (or resubmit after rejection) the hazardous-material manifest for a shipment."
    roles: [ComplianceOfficer]
    code: 201
    input: [un_number, packing_group, transporter_name]
    output: HazmatManifest
    side_effects: ["compliance_state MANIFEST_DRAFT -> MANIFEST_SUBMITTED, or MANIFEST_REJECTED -> MANIFEST_SUBMITTED with revision + 1", "on resubmission custody_state QUARANTINED -> IDENTIFIED and hold_reason is cleared", "records submitted_by_user_id from X-User-ID", "increments Intake.version by 1"]

  - method: GET
    path: "/recycling/intakes/{id}/manifests"
    description: "List every manifest revision of an intake, oldest revision first."
    roles: [PlatformAdmin, ComplianceOfficer, PlantOperator, IntakeClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HazmatManifest[]
    side_effects: []

  - method: POST
    path: "/recycling/intakes/{intake_id}/manifests/{manifest_id}/close"
    description: "Counter-sign and close a submitted manifest; the submitter may not close it."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: HazmatManifest
    side_effects: ["manifest SUBMITTED -> CLOSED, compliance_state -> MANIFEST_CLOSED", "records closed_by_user_id", "increments HazmatManifest.version and Intake.version by 1 each"]

  - method: POST
    path: "/recycling/intakes/{intake_id}/manifests/{manifest_id}/reject"
    description: "Reject a submitted manifest, quarantining the shipment and unwinding its triage decisions."
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_reason]
    output: HazmatManifest
    side_effects: ["manifest SUBMITTED -> REJECTED, compliance_state -> MANIFEST_REJECTED", "custody_state -> QUARANTINED with hold_reason MANIFEST_REJECTED", "every ACTIVE TriageDecision on this intake's modules -> VOIDED and those modules revert to PENDING_TRIAGE", "increments the version of every row touched by 1"]

  - method: POST
    path: "/recycling/intakes/{intake_id}/release"
    description: "Release a packaged, manifest-closed shipment for processing and cut its provisional settlement."
    roles: [PlantOperator]
    code: 200
    input: []
    output: Intake
    side_effects: ["custody_state PACKAGED -> RELEASED, sets released_at", "creates a PROVISIONAL DRAFT SupplierSettlement priced by feedstock_payable_value + settlement_net_payable (discoverable only via GET /recycling/settlements?intake_id=...)", "increments Intake.version by 1"]

  - method: POST
    path: "/recycling/intakes/{intake_id}/modules"
    description: "Book one dismantled module against a shipment. Optimistic-concurrency guarded on the intake."
    roles: [IntakeClerk]
    code: 201
    input: [serial_code, mass_kg, min_cell_capacity_pct, mean_cell_capacity_pct, expected_intake_version, "cycle_count?"]
    output: Module
    side_effects: ["copies Intake.identified_chemistry into Module.chemistry", "recomputes Intake.module_mass_total_kg and Intake.unassigned_mass_kg", "increments Intake.version by 1"]

  # ---- modules and triage ---------------------------------------------------
  - method: GET
    path: "/recycling/modules"
    description: "List modules, filterable by intake, lot and status."
    roles: [PlatformAdmin, IntakeClerk, TriageEngineer, PlantOperator, AssayTechnician, ComplianceOfficer]
    code: 200
    input: ["intake_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: Module[]
    side_effects: []

  - method: GET
    path: "/recycling/modules/{module_id}"
    description: "Read one module including its triage score and grade."
    roles: [PlatformAdmin, IntakeClerk, TriageEngineer, PlantOperator, AssayTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: Module
    side_effects: []

  - method: POST
    path: "/recycling/modules/{module_id}/triage-decisions"
    description: "Grade a module and route it to refurbishment, second-life or material recovery."
    roles: [TriageEngineer]
    code: 201
    input: [scoring_variant, "override_disposition?"]
    output: TriageDecision
    side_effects: ["runs module_second_life_score", "Module PENDING_TRIAGE -> REFURB_QUEUE | SECOND_LIFE_QUEUE | RECOVERY_QUEUE per the resolved disposition", "copies score and grade onto the module", "increments Module.version by 1"]

  - method: GET
    path: "/recycling/modules/{id}/triage-decisions"
    description: "List every triage decision recorded for a module, oldest first."
    roles: [PlatformAdmin, TriageEngineer, PlantOperator, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TriageDecision[]
    side_effects: []

  - method: POST
    path: "/recycling/modules/{module_id}/ship"
    description: "Ship a refurbished or second-life module to a downstream customer."
    roles: [PlantOperator]
    code: 200
    input: [customer_name]
    output: Module
    side_effects: ["Module REFURB_QUEUE | SECOND_LIFE_QUEUE -> SHIPPED", "sets shipped_to", "increments Module.version by 1"]

  # ---- campaigns and lots ---------------------------------------------------
  - method: POST
    path: "/recycling/campaigns"
    description: "Schedule a processing campaign occupying a line for a half-open window."
    roles: [PlantOperator]
    code: 201
    input: [line_id, chemistry_family, window_start, window_end, planned_input_kg]
    output: ProcessingCampaign
    side_effects: ["runs campaign_line_occupation (overlap, changeover buffer, capacity)", "status = SCHEDULED"]

  - method: GET
    path: "/recycling/campaigns"
    description: "List campaigns, filterable by line and status."
    roles: [PlatformAdmin, PlantOperator, AssayTechnician, ComplianceOfficer]
    code: 200
    input: ["line_id?", "status?", "limit?", "offset?"]
    output: ProcessingCampaign[]
    side_effects: []

  - method: GET
    path: "/recycling/campaigns/{campaign_id}"
    description: "Read one campaign including committed_input_kg."
    roles: [PlatformAdmin, PlantOperator, AssayTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: ProcessingCampaign
    side_effects: []

  - method: POST
    path: "/recycling/campaigns/{campaign_id}/start"
    description: "Start a scheduled campaign on an available line."
    roles: [PlantOperator]
    code: 200
    input: []
    output: ProcessingCampaign
    side_effects: ["ProcessingCampaign SCHEDULED -> RUNNING", "increments ProcessingCampaign.version by 1"]

  - method: POST
    path: "/recycling/campaigns/{campaign_id}/cancel"
    description: "Cancel a scheduled campaign and void its open lots."
    roles: [PlantOperator]
    code: 200
    input: [cancel_reason]
    output: ProcessingCampaign
    side_effects: ["ProcessingCampaign SCHEDULED -> CANCELLED", "every OPEN RecoveryLot of the campaign -> VOIDED", "frees the line window", "increments the version of every row touched by 1"]

  - method: POST
    path: "/recycling/campaigns/{campaign_id}/lots"
    description: "Open a recovery lot under a campaign."
    roles: [PlantOperator]
    code: 201
    input: [lot_code]
    output: RecoveryLot
    side_effects: ["status = OPEN, charged_mass_kg = 0.0", "increments ProcessingCampaign.version by 1"]

  - method: GET
    path: "/recycling/lots"
    description: "List recovery lots, filterable by campaign and status."
    roles: [PlatformAdmin, PlantOperator, AssayTechnician, ComplianceOfficer, CertificationOfficer, SettlementAccountant]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: RecoveryLot[]
    side_effects: []

  - method: GET
    path: "/recycling/lots/{lot_id}"
    description: "Read one recovery lot including the full mass-balance ledger."
    roles: [PlatformAdmin, PlantOperator, AssayTechnician, ComplianceOfficer, CertificationOfficer, SettlementAccountant]
    code: 200
    input: []
    output: RecoveryLot
    side_effects: []

  - method: POST
    path: "/recycling/lots/{lot_id}/charge"
    description: "Charge recovery-queued modules into an open lot. Optimistic-concurrency guarded on the lot."
    roles: [PlantOperator]
    code: 200
    input: [module_ids, expected_lot_version]
    output: RecoveryLot
    side_effects: ["RecoveryLot OPEN -> CHARGED", "each module RECOVERY_QUEUE -> CHARGED with lot_id set", "recomputes charged_mass_kg, Intake.assigned_mass_kg / unassigned_mass_kg and ProcessingCampaign.committed_input_kg", "increments RecoveryLot.version by 1"]

  - method: POST
    path: "/recycling/lots/{lot_id}/recovery-outputs"
    description: "Book one assayed recovery stream against a charged lot (append-only)."
    roles: [AssayTechnician]
    code: 201
    input: [metal, recovered_mass_kg, assay_purity_pct]
    output: RecoveryOutput
    side_effects: ["recomputes RecoveryLot.recovered_mass_kg", "rejects NI, CO or LI on a MECHANICAL line with ERR_METAL_NOT_RECOVERABLE_ON_LINE", "increments RecoveryLot.version by 1"]

  - method: GET
    path: "/recycling/lots/{id}/recovery-outputs"
    description: "List the assay ledger of a lot, oldest line first."
    roles: [PlatformAdmin, AssayTechnician, PlantOperator, SettlementAccountant, CertificationOfficer, ComplianceOfficer]
    code: 200
    input: ["metal?", "limit?", "offset?"]
    output: RecoveryOutput[]
    side_effects: []

  - method: POST
    path: "/recycling/lots/{lot_id}/finalize"
    description: "Close the assay ledger, reconcile mass balance and re-price the contributing settlements to FINAL."
    roles: [AssayTechnician]
    code: 200
    input: [residue_mass_kg]
    output: RecoveryLot
    side_effects: ["RecoveryLot CHARGED -> FINALIZED with the lot_mass_balance ledger", "every CHARGED module of the lot -> CONSUMED", "each contributing DRAFT settlement flips PROVISIONAL -> FINAL and is re-priced", "a supplier whose settlement lands with max_variance_pp > 2.00 gains a quality strike", "a RUNNING campaign whose lots are all terminal -> CLOSED", "increments the version of every row touched by 1"]

  - method: POST
    path: "/recycling/lots/{lot_id}/void"
    description: "Void a lot, returning its modules to the recovery queue."
    roles: [PlantOperator]
    code: 200
    input: [void_reason]
    output: RecoveryLot
    side_effects: ["RecoveryLot OPEN | CHARGED -> VOIDED", "each CHARGED module -> RECOVERY_QUEUE with lot_id cleared", "restores Intake.assigned_mass_kg / unassigned_mass_kg and ProcessingCampaign.committed_input_kg", "increments the version of every row touched by 1"]

  # ---- discharge compliance -------------------------------------------------
  - method: POST
    path: "/recycling/lots/{lot_id}/discharge-events"
    description: "Book an air or water discharge from a lot against a permit allotment."
    roles: [ComplianceOfficer]
    code: 201
    input: [allotment_id, event_date, mass_kg, analyte]
    output: DischargeEvent
    side_effects: ["lazily expires the allotment when clock_now > valid_to", "runs permit_daily_bucket_usage", "adds mass_kg to PermitAllotment.consumed_kg", "increments PermitAllotment.version by 1"]

  - method: GET
    path: "/recycling/discharge-events"
    description: "List discharge events, filterable by allotment and lot."
    roles: [PlatformAdmin, ComplianceOfficer, PlantOperator, AssayTechnician]
    code: 200
    input: ["allotment_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: DischargeEvent[]
    side_effects: []

  - method: GET
    path: "/recycling/discharge-events/{event_id}"
    description: "Read one discharge event."
    roles: [PlatformAdmin, ComplianceOfficer, PlantOperator, AssayTechnician]
    code: 200
    input: []
    output: DischargeEvent
    side_effects: []

  - method: POST
    path: "/recycling/discharge-events/{event_id}/void"
    description: "Void a mis-booked discharge event and return its allowance."
    roles: [ComplianceOfficer]
    code: 200
    input: [void_reason]
    output: DischargeEvent
    side_effects: ["DischargeEvent POSTED -> VOIDED", "subtracts mass_kg from PermitAllotment.consumed_kg", "increments DischargeEvent.version and PermitAllotment.version by 1 each"]

  # ---- passports ------------------------------------------------------------
  - method: POST
    path: "/recycling/lots/{lot_id}/passports"
    description: "Issue a recycled-content battery passport for a finalized lot."
    roles: [CertificationOfficer]
    code: 201
    input: [passport_code, customer_name]
    output: BatteryPassport
    side_effects: ["copies RecoveryLot.recycled_content_pct and the lot's assay ledger into the certificate", "rejects when recycled_content_pct < 35.00 or an ISSUED passport already exists for the lot"]

  - method: GET
    path: "/recycling/passports"
    description: "List battery passports, filterable by lot."
    roles: [PlatformAdmin, CertificationOfficer, ComplianceOfficer, SettlementAccountant, SupplierRep]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: BatteryPassport[]
    side_effects: []

  - method: GET
    path: "/recycling/passports/{passport_id}"
    description: "Read one battery passport."
    roles: [PlatformAdmin, CertificationOfficer, ComplianceOfficer, SettlementAccountant, SupplierRep]
    code: 200
    input: []
    output: BatteryPassport
    side_effects: []

  - method: POST
    path: "/recycling/passports/{passport_id}/revoke"
    description: "Revoke an issued passport."
    roles: [CertificationOfficer]
    code: 200
    input: [revoked_reason]
    output: BatteryPassport
    side_effects: ["BatteryPassport ISSUED -> REVOKED", "increments BatteryPassport.version by 1"]

  # ---- settlements ----------------------------------------------------------
  - method: GET
    path: "/recycling/settlements"
    description: "List settlements, filterable by intake, supplier, variant and state. The only discovery channel for the cascade-created settlement."
    roles: [PlatformAdmin, SettlementAccountant, SupplierRep, PlantOperator, AssayTechnician]
    code: 200
    input: ["intake_id?", "supplier_id?", "variant?", "state?", "limit?", "offset?"]
    output: SupplierSettlement[]
    side_effects: []

  - method: GET
    path: "/recycling/settlements/{settlement_id}"
    description: "Read one settlement including its per-metal line breakdown."
    roles: [PlatformAdmin, SettlementAccountant, SupplierRep, PlantOperator, AssayTechnician]
    code: 200
    input: []
    output: SupplierSettlement
    side_effects: []

  - method: POST
    path: "/recycling/settlements/{settlement_id}/post"
    description: "Post a draft settlement to the supplier's payable ledger."
    roles: [SettlementAccountant]
    code: 200
    input: []
    output: SupplierSettlement
    side_effects: ["SupplierSettlement DRAFT -> POSTED with posted_amount_cents frozen", "Supplier.payable_balance_cents increases", "credit_hold may flip true, quarantining the supplier's RECEIVED intakes", "increments the version of every row touched by 1"]

  - method: POST
    path: "/recycling/settlements/{settlement_id}/dispute"
    description: "Supplier disputes a posted final settlement whose assay variance exceeds tolerance."
    roles: [SupplierRep]
    code: 200
    input: [dispute_reason]
    output: SupplierSettlement
    side_effects: ["SupplierSettlement POSTED -> DISPUTED", "increases dispute_round by 1", "leaves Supplier.payable_balance_cents untouched", "increments SupplierSettlement.version by 1"]

  - method: POST
    path: "/recycling/settlements/{settlement_id}/umpire-assay"
    description: "Record an umpire laboratory result for one metal of a disputed settlement."
    roles: [AssayTechnician]
    code: 200
    input: [metal, umpire_contained_kg]
    output: SupplierSettlement
    side_effects: ["SupplierSettlement DISPUTED -> UMPIRE_ROUND", "sets umpire_metal and umpire_contained_kg", "increments SupplierSettlement.version by 1"]

  - method: POST
    path: "/recycling/settlements/{settlement_id}/apply-umpire"
    description: "Apply the umpire result, reverse the posted amount and return the settlement to draft."
    roles: [SettlementAccountant]
    code: 200
    input: []
    output: SupplierSettlement
    side_effects: ["SupplierSettlement UMPIRE_ROUND -> DRAFT", "re-prices FINAL with umpire_contained_kg substituted", "Supplier.payable_balance_cents decreases by the old posted_amount_cents and posted_amount_cents resets to 0", "clears credit_hold and releases SUPPLIER_CREDIT_HOLD quarantines when the balance falls back within the limit", "increments the version of every row touched by 1"]

  - method: POST
    path: "/recycling/settlements/{settlement_id}/settle"
    description: "Pay a posted settlement in cash."
    roles: [SettlementAccountant]
    code: 200
    input: [payment_reference]
    output: SupplierSettlement
    side_effects: ["SupplierSettlement POSTED -> SETTLED", "Supplier.paid_to_date_cents increases and payable_balance_cents decreases by posted_amount_cents", "clears credit_hold and releases SUPPLIER_CREDIT_HOLD quarantines when the balance falls back within the limit", "increments the version of every row touched by 1"]

  - method: POST
    path: "/recycling/settlements/{settlement_id}/void"
    description: "Void a posted settlement, reversing the payable ledger exactly."
    roles: [SettlementAccountant]
    code: 200
    input: [void_reason]
    output: SupplierSettlement
    side_effects: ["SupplierSettlement POSTED -> VOIDED", "Supplier.payable_balance_cents decreases by posted_amount_cents and posted_amount_cents resets to 0", "clears credit_hold and releases SUPPLIER_CREDIT_HOLD quarantines", "increments the version of every row touched by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "SupplierRep disputes a settlement whose supplier_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID closing a manifest equals its submitted_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, enum out of range, number outside its declared constraint, empty module_ids array, or a violated uniqueness constraint (Module.serial_code per intake, RecoveryOutput (lot_id, metal), BatteryPassport.passport_code)"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "facility_id in path or body matches no Facility"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "supplier_id in path or body matches no Supplier"
  - id: ERR_INTAKE_NOT_FOUND
    http: 404
    condition: "intake_id in path matches no Intake"
  - id: ERR_MANIFEST_NOT_FOUND
    http: 404
    condition: "manifest_id in path matches no HazmatManifest of that intake"
  - id: ERR_MODULE_NOT_FOUND
    http: 404
    condition: "module_id in path, or an id in charge.module_ids, matches no Module"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "line_id in path or body matches no ProcessingLine"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign_id in path matches no ProcessingCampaign"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lot_id in path matches no RecoveryLot"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "settlement_id in path matches no SupplierSettlement"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "allotment_id in path or body matches no PermitAllotment"
  - id: ERR_DISCHARGE_EVENT_NOT_FOUND
    http: 404
    condition: "event_id in path matches no DischargeEvent"
  - id: ERR_PASSPORT_NOT_FOUND
    http: 404
    condition: "passport_id in path matches no BatteryPassport"
  - id: ERR_STALE_INTAKE_VERSION
    http: 412
    condition: "expected_intake_version does not equal Intake.version on module creation"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal RecoveryLot.version on charge"
  - id: ERR_INVALID_CUSTODY_STATE
    http: 409
    condition: "The intake's custody_state has no declared transition for the requested custody step"
  - id: ERR_INVALID_COMPLIANCE_STATE
    http: 409
    condition: "The intake's compliance_state blocks the request, e.g. release while compliance_state != MANIFEST_CLOSED, or a first manifest submission while compliance_state != MANIFEST_DRAFT"
  - id: ERR_MANIFEST_NOT_SUBMITTED
    http: 409
    condition: "Close or reject targets a manifest whose status is not SUBMITTED"
  - id: ERR_MODULE_NOT_TRIAGEABLE
    http: 409
    condition: "Triage targets a module whose status is not PENDING_TRIAGE, or whose intake's custody_state is not in {PACKAGED, RELEASED}"
  - id: ERR_MODULE_NOT_IN_RECOVERY_QUEUE
    http: 409
    condition: "A module in charge.module_ids has status != RECOVERY_QUEUE"
  - id: ERR_MODULE_NOT_SHIPPABLE
    http: 409
    condition: "Ship targets a module whose status is not REFURB_QUEUE or SECOND_LIFE_QUEUE"
  - id: ERR_LOT_NOT_OPEN
    http: 409
    condition: "Charge targets a lot whose status is not OPEN"
  - id: ERR_LOT_NOT_CHARGED
    http: 409
    condition: "Finalize targets a lot whose status is not CHARGED, or a recovery-output line is booked against a lot that is not CHARGED"
  - id: ERR_CAMPAIGN_NOT_RUNNING
    http: 409
    condition: "Charge targets a lot whose campaign status is not RUNNING"
  - id: ERR_CAMPAIGN_NOT_SCHEDULED
    http: 409
    condition: "Start or cancel targets a campaign whose status is not SCHEDULED, or cancel is attempted while a lot of the campaign is CHARGED or FINALIZED"
  - id: ERR_SETTLEMENT_NOT_DRAFT
    http: 409
    condition: "Post targets a settlement whose state is not DRAFT, or finalize finds a contributing settlement whose state is not DRAFT"
  - id: ERR_SETTLEMENT_NOT_POSTED
    http: 409
    condition: "Dispute, settle or void targets a settlement whose state is not POSTED"
  - id: ERR_SETTLEMENT_NOT_DISPUTED
    http: 409
    condition: "Umpire-assay targets a settlement whose state is not DISPUTED"
  - id: ERR_SETTLEMENT_NOT_IN_UMPIRE_ROUND
    http: 409
    condition: "Apply-umpire targets a settlement whose state is not UMPIRE_ROUND"
  - id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http: 409
    condition: "Dispute is raised when dispute_round is already 3"
  - id: ERR_DISCHARGE_EVENT_NOT_POSTED
    http: 409
    condition: "Void targets a discharge event whose status is not POSTED"
  - id: ERR_PASSPORT_NOT_ISSUED
    http: 409
    condition: "Revoke targets a passport whose status is not ISSUED"
  - id: ERR_PASSPORT_ALREADY_ISSUED
    http: 409
    condition: "A second passport is issued for a lot that already has one with status ISSUED"
  - id: ERR_MODULES_ALREADY_COMMITTED
    http: 409
    condition: "Manifest rejection is attempted while a module of the intake has status CHARGED or CONSUMED"
  - id: ERR_LINE_HAS_RUNNING_CAMPAIGN
    http: 409
    condition: "A line is re-plumbed while one of its campaigns has status RUNNING"
  - id: ERR_FACILITY_SUSPENDED
    http: 422
    condition: "An intake is booked into a Facility whose status is SUSPENDED"
  - id: ERR_SOC_ABOVE_PACKAGING_LIMIT
    http: 422
    condition: "Packaging is attempted while soc_pct is null or greater than 30.0"
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 422
    condition: "A discharge event is booked against an allotment whose status is SUSPENDED, or EXPIRED after lazy expiry because clock_now > valid_to"
  - id: ERR_LINE_NOT_AVAILABLE
    http: 422
    condition: "A campaign is started on a line whose status is MAINTENANCE"
  - id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http: 409
    condition: "The proposed half-open window overlaps a SCHEDULED or RUNNING campaign on the same line"
  - id: ERR_CHANGEOVER_BUFFER_VIOLATION
    http: 422
    condition: "The proposed window is separated from a different-chemistry-family neighbour on the same line by fewer than changeover_buffer_hours hours"
  - id: ERR_CAMPAIGN_WINDOW_CLOSED
    http: 422
    condition: "A campaign start is attempted when clock_now >= window_end"
  - id: ERR_PERMIT_WINDOW_EXCLUDED
    http: 422
    condition: "event_date falls outside the permit's closed validity interval [valid_from, valid_to]"
  - id: ERR_CAMPAIGN_CAPACITY_EXCEEDED
    http: 422
    condition: "planned_input_kg exceeds throughput_kg_per_hour multiplied by the window length in hours"
  - id: ERR_LOT_CHARGE_EXCEEDS_PLAN
    http: 422
    condition: "committed_input_kg plus the charge mass exceeds the campaign's planned_input_kg"
  - id: ERR_DISCHARGE_DAILY_CAP_EXCEEDED
    http: 422
    condition: "POSTED mass already booked in the event's UTC calendar-day bucket plus the new mass exceeds daily_cap_kg"
  - id: ERR_MASS_BALANCE_OUT_OF_TOLERANCE
    http: 422
    condition: "mass_balance_pct computed at finalization is below 97.00"
  - id: ERR_NO_RECOVERY_OUTPUTS
    http: 422
    condition: "Finalize is attempted on a lot with zero RecoveryOutput lines"
  - id: ERR_RECYCLED_CONTENT_BELOW_MINIMUM
    http: 422
    condition: "A passport is requested for a lot whose recycled_content_pct is below 35.00"
  - id: ERR_DUPLICATE_INDEX_PRICE
    http: 409
    condition: "An index quote already exists for the same (metal, effective_date)"
  - id: ERR_DISPOSITION_OVERRIDE_NOT_PERMITTED
    http: 422
    condition: "override_disposition is REFURBISH while grade is not in {A, B}, or SECOND_LIFE while grade is D"
  - id: ERR_VARIANCE_WITHIN_TOLERANCE
    http: 422
    condition: "Dispute is raised while max_variance_pp is at or below 0.50"
  - id: ERR_MODULE_CHEMISTRY_MISMATCH
    http: 422
    condition: "A charged module's CHEMISTRY_FAMILY_MAP family differs from the campaign's chemistry_family"
  - id: ERR_METAL_NOT_RECOVERABLE_ON_LINE
    http: 422
    condition: "A NI, CO or LI recovery-output line is booked against a lot whose campaign runs on a MECHANICAL line"
  - id: ERR_INTAKE_NOT_RELEASED
    http: 422
    condition: "A module is charged or shipped while its intake's custody_state is not RELEASED"
  - id: ERR_CAMPAIGN_FAMILY_MISMATCH
    http: 422
    condition: "A campaign's chemistry_family differs from its line's chemistry_family"
  - id: ERR_SUPPLIER_CREDIT_HOLD
    http: 402
    condition: "An intake is booked for, or released on behalf of, a supplier whose credit_hold is true"
  - id: ERR_INDEX_PRICE_UNAVAILABLE
    http: 422
    condition: "No MetalIndexPrice row exists with effective_date on or before the price basis date for a metal whose contained mass is greater than zero"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Configures campuses, counterparties and processing lines, and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/facilities"
      - "POST /recycling/suppliers"
      - "POST /recycling/processing-lines"
      - "POST /recycling/processing-lines/{line_id}/replumb"
      - "POST /recycling/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: MarketAnalyst
    description: "Publishes metal index quotes that price feedstock."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/metal-index-prices"
    shared_operations:
      - "GET /recycling/metal-index-prices"
      - "GET /recycling/facilities/{facility_id}"

  - name: IntakeClerk
    description: "Books arriving shipments and dismantled modules; identifies chemistry."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/intakes"
      - "POST /recycling/intakes/{intake_id}/identify-chemistry"
      - "POST /recycling/intakes/{intake_id}/modules"
    shared_operations:
      - "GET /recycling/intakes, GET /recycling/intakes/{intake_id}, GET /recycling/intakes/{intake_id}/manifests"
      - "GET /recycling/modules, GET /recycling/modules/{module_id}"

  - name: PlantOperator
    description: "Runs the plant floor: discharge, packaging, release, campaigns, lots, charging, shipping."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/intakes/{intake_id}/discharge"
      - "POST /recycling/intakes/{intake_id}/package"
      - "POST /recycling/intakes/{intake_id}/release"
      - "POST /recycling/modules/{module_id}/ship"
      - "POST /recycling/campaigns"
      - "POST /recycling/campaigns/{campaign_id}/start"
      - "POST /recycling/campaigns/{campaign_id}/cancel"
      - "POST /recycling/campaigns/{campaign_id}/lots"
      - "POST /recycling/lots/{lot_id}/charge"
      - "POST /recycling/lots/{lot_id}/void"
    shared_operations:
      - "GET endpoints for intakes, modules, lines, campaigns, lots, recovery outputs, permits, discharge events, settlements"

  - name: ComplianceOfficer
    description: "Owns hazardous-material documentation, permits, discharge bookings and the supplier quality register."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/intakes/{intake_id}/manifests"
      - "POST /recycling/intakes/{intake_id}/manifests/{manifest_id}/close"
      - "POST /recycling/intakes/{intake_id}/manifests/{manifest_id}/reject"
      - "POST /recycling/permit-allotments"
      - "POST /recycling/permit-allotments/{allotment_id}/suspend"
      - "POST /recycling/lots/{lot_id}/discharge-events"
      - "POST /recycling/discharge-events/{event_id}/void"
      - "POST /recycling/suppliers/{supplier_id}/quality-strikes"
    shared_operations:
      - "GET endpoints for intakes, manifests, modules, triage decisions, lines, campaigns, lots, recovery outputs, permits, discharge events, passports"
    note: "Segregation of duties: the X-User-ID that submitted a manifest may not close it."

  - name: TriageEngineer
    description: "Grades modules and routes them between refurbishment, second life and material recovery."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/modules/{module_id}/triage-decisions"
    shared_operations:
      - "GET /recycling/modules, GET /recycling/modules/{module_id}, GET /recycling/modules/{module_id}/triage-decisions"
      - "GET /recycling/intakes, GET /recycling/intakes/{intake_id}"

  - name: AssayTechnician
    description: "Books recovery yields, finalizes lots and records umpire assays. May never touch the payable ledger."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/lots/{lot_id}/recovery-outputs"
      - "POST /recycling/lots/{lot_id}/finalize"
      - "POST /recycling/settlements/{settlement_id}/umpire-assay"
    shared_operations:
      - "GET endpoints for lots, recovery outputs, campaigns, lines, settlements, modules, intakes, discharge events, metal index prices"
    note: "Segregation of duties: cannot post, settle or void the settlement its yields price."

  - name: SettlementAccountant
    description: "Owns the payable ledger: post, apply-umpire, settle, void."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/settlements/{settlement_id}/post"
      - "POST /recycling/settlements/{settlement_id}/apply-umpire"
      - "POST /recycling/settlements/{settlement_id}/settle"
      - "POST /recycling/settlements/{settlement_id}/void"
    shared_operations:
      - "GET endpoints for settlements, suppliers, intakes, lots, recovery outputs, passports, metal index prices"
    note: "Segregation of duties: cannot book recovery outputs or finalize lots."

  - name: CertificationOfficer
    description: "Issues and revokes recycled-content battery passports for downstream customers."
    identity: opaque
    exclusive_operations:
      - "POST /recycling/lots/{lot_id}/passports"
      - "POST /recycling/passports/{passport_id}/revoke"
    shared_operations:
      - "GET /recycling/passports, GET /recycling/passports/{passport_id}"
      - "GET /recycling/lots, GET /recycling/lots/{lot_id}, GET /recycling/lots/{lot_id}/recovery-outputs"

  - name: SupplierRep
    description: "Counterparty representative. Reads its own shipments and settlements and disputes posted final settlements."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /recycling/settlements/{settlement_id}/dispute"
    shared_operations:
      - "GET /recycling/settlements, GET /recycling/settlements/{settlement_id}"
      - "GET /recycling/intakes, GET /recycling/intakes/{intake_id}"
      - "GET /recycling/suppliers/{supplier_id}"
      - "GET /recycling/passports, GET /recycling/passports/{passport_id}"
    note: "X-User-ID equals the acting Supplier.id; dispute requires X-User-ID == SupplierSettlement.supplier_id."

# =============================================================================
# Cross-cutting constants and named invariants referenced by 1.8 / 1.9
# =============================================================================
global_constants:
  SOC_PACKAGING_LIMIT_PCT: 30.0
  CHEMISTRY_FAMILY_MAP: { NMC622: NICKEL_RICH, NCA: NICKEL_RICH, LMO: NICKEL_RICH, LFP: IRON_PHOSPHATE }
  HYDROMET_ONLY_METALS: [NI, CO, LI]
  CLOCK_DEFAULT_UTC: "2026-08-01T00:00:00.000Z"

invariants:
  - name: supplier_obligation_invariant
    quantity: money (cents)
    formula: |
      Supplier.payable_balance_cents ==
          sum(SupplierSettlement.posted_amount_cents
              for settlements of that supplier whose state IN
              {POSTED, DISPUTED, UMPIRE_ROUND, SETTLED})
          - Supplier.paid_to_date_cents
    forward_action: "POST /recycling/settlements/{settlement_id}/post"
    compensating_actions: ["POST /recycling/settlements/{settlement_id}/void", "POST /recycling/settlements/{settlement_id}/apply-umpire"]

  - name: intake_mass_conservation_invariant
    quantity: feedstock mass (kg)
    formula: |
      Intake.assigned_mass_kg + Intake.unassigned_mass_kg == Intake.module_mass_total_kg
      for every Intake at all times
    forward_action: "POST /recycling/lots/{lot_id}/charge"
    compensating_actions: ["POST /recycling/lots/{lot_id}/void"]

  - name: permit_allowance_invariant
    quantity: permitted discharge allowance (kg)
    formula: |
      PermitAllotment.consumed_kg ==
          sum(DischargeEvent.mass_kg for events of that allotment whose status == POSTED)
    forward_action: "POST /recycling/lots/{lot_id}/discharge-events"
    compensating_actions: ["POST /recycling/discharge-events/{event_id}/void"]
