  - section: cross_cutting_layers
    instances:
      - name: occ_drawdown_create_stale_award_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[drawdown-create-stale-award]", "errors[ERR_STALE_AWARD_VERSION]"]
        distinguishing_aspect: "Two strictly sequential drawdown creates carrying the same expected_award_version: the first succeeds (and bumps the award version via the create side effect), the second is rejected 412 ERR_STALE_AWARD_VERSION — deterministically, with no parallelism."
        test_recipe:
          setup: ["ACTIVE LOC award (TRAVEL 100000, obligated 150000) with pool 150000 after posting; award version captured at vN"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
