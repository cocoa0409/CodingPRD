            - "Invoice.${inv_id}.fee_total_cents == 16500  (11 x round_half_up(10000*0.15)=1500)"
            - "Invoice.${inv_id}.discount_tier == 0.10 and discount_cents == 1650"
            - "Invoice.${inv_id}.amount_due_cents == 14850"
            - "Invoice.${inv_id}.payout_provisional_cents == 89980  (11 x 8180)"
            - "Invoice.${inv_id}.payout_final_cents == 91630  (110000 - 14850 - 3520)"
            - "payout_final_cents - payout_provisional_cents == 1650 == discount_cents (the two variants diverge by exactly the tier discount)"

      - name: reliability_provisional_vs_effective_with_recovery
        grounds:
