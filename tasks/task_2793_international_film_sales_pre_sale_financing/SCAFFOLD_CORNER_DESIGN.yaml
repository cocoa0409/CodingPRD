      - name: buyer_exposure_ceiling_at_exact_equality
        claim_type: violation_error
        excluded_because:
          difficulty_instance: buyer_exposure_limit_passes_at_exact_equality_and_fails_one_cent_over
          rationale: |
            Priority 100 is exercised at the exact limit and one cent past it by that §1.8 instance,
            including the pipeline aggregate that feeds it. Re-testing the same inequality here would add
            no claim beyond the boundary pair already pinned.

      - name: negotiation_round_limit_is_enforced_at_priority_ninety_four
        claim_type: violation_error
        excluded_because:
          difficulty_instance: contract_negotiation_cycles_offer_counter_offer_until_round_limit_while_other_axes_hold
          rationale: |
            ERR_NEGOTIATION_ROUND_LIMIT can only be reached by driving MAX_NEGOTIATION_ROUNDS counter
            rounds, which is exactly the loop that §1.8 instance walks; it asserts the last accepted round
            and the first rejected one, so the validation is already pinned at its boundary.

      - name: film_market_state_gate_outranks_the_buyer_exposure_gate
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: film_not_in_market_state_check_outranks_buyer_exposure_fiscal_check_on_offer
          rationale: |
            The 52-before-100 ordering needs a payload that violates both the film-state and the exposure
            rule at once; that §1.8 instance builds precisely that payload and also proves the ordering is
            not incidental by fixing each violation in turn.

      - name: buyer_blocked_check_outranks_the_meeting_slot_conflict
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: buyer_blocked_safety_check_outranks_meeting_table_temporal_conflict
          rationale: |
            Priority 62 versus 81 is demonstrated there on a doubly-invalid meeting request, with the
            follow-up that unblocking the buyer then surfaces the temporal conflict. Both error paths are
            already asserted.

      - name: screening_room_double_booking_is_rejected
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: screening_room_requires_exactly_thirty_minutes_turnaround_on_both_sides
          rationale: |
            ERR_SCREENING_ROOM_CONFLICT is asserted there at the 29-minute, 30-minute and negative-gap
            cases on both sides of an existing slot, which subsumes any plain overlap test.

      - name: meeting_table_conflict_and_buyer_minute_cap
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: meeting_tables_allow_touching_windows_but_cap_buyer_minutes_at_exactly_240
          rationale: |
            Both ERR_MEETING_SLOT_CONFLICT and ERR_MEETING_MINUTES_CAP_EXCEEDED are driven there, with
            back-to-back windows accepted and the 240-minute aggregate refused at 241, so priorities 81
            and 95 are covered together.

      - name: comparable_set_validations_at_priority_ninety_one_and_ninety_two
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: comparable_sample_boundary_at_min_sample_and_at_the_lookback_year_edge
          rationale: |
            ERR_NO_COMPARABLE_TITLES and ERR_INSUFFICIENT_COMP_SAMPLE both arise from the eligible-comp
            filter, and that §1.8 instance walks the filter at zero comps, at MIN_COMP_SAMPLE - 1 and at
            the COMP_LOOKBACK_YEARS edge, which is strictly more than a single violation test.

      - name: a_fully_compliant_slot_booking_passes_every_gate_in_the_ladder
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=52]
          - validations[priority=53]
          - validations[priority=82]
          - validations[priority=80]
        distinguishing_aspect: |
          The happy path must not be collateral damage of the four gates that guard it: an IN_MARKET film,
          an OPEN market, a window inside the market dates and a room whose only other booking clears the
          30-minute turnaround on both sides yields HTTP 201 and status HELD. An implementation that
          over-fires any of the four is detectable here rather than only on its own negative test.
        test_recipe:
