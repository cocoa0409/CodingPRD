# =============================================================================
# SCAFFOLD — task_3133_payer_contracted_home_complex_care_visits_risk
# Payer-Contracted In-Home Complex Care Visits & Risk Stratification
# =============================================================================

scenario: |
  Payer-Contracted In-Home Complex Care Visits & Risk Stratification (Landmark
  Health): member identification from health plan data using chronic condition
  burden and utilization history, engagement outreach to consent members into a
  supplemental home-based care program, visit scheduling with clinician routing
  across a geography and urgent visit capability, in-home assessment with
  medication reconciliation, safety evaluation and social needs screening,
  coordination with the member's existing primary care physician without
  replacing that relationship, twenty-four hour urgent response to avoid
  emergency department visits, capitated or shared-savings payment from the
  plan with performance measurement, care team composition across nurse
  practitioners, social workers and behavioral clinicians.

domain_name: payer-contracted-home-care
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
    - optimistic_concurrency
  entity_topology: flat            # peer entities with FK references; no nested URL paths beyond action sub-paths
  state_machine_shape: compound    # Enrollment gated by CareTeam + Visit gated by Clinician + Episode gated by Clock
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                  # VisitAssessment payload covers med-rec / safety / social-needs shapes
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CareProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program identifier, e.g. LANDMARK-TX-001" }
      - { name: display_name, type: string, source: input, description: "Human-readable program name" }
      - { name: service_geography_zips, type: array, source: input, description: "List of ZIP codes the program serves; drives clinician routing eligibility" }
      - { name: urgent_response_sla_hours, type: integer, source: input, default: 24, description: "Hours from urgent trigger to on-scene clinician; contractual SLA" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Logical clock position (days since program start); advances via /clock/advance" }

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - { name: care_program_id, type: string, source: input, description: "FK -> CareProgram.id" }
      - { name: payer_name, type: string, source: input, description: "Payer display name" }
      - { name: contract_effective_date, type: datetime, source: input, description: "ISO 8601 effective date" }
      - { name: contract_expiration_date, type: datetime, source: input, description: "ISO 8601 expiration date" }
      - { name: payment_model, type: enum, source: input, description: "CAPITATED | SHARED_SAVINGS — drives settlement calculation branch" }
      - { name: pmpm_rate_cents, type: integer, source: input, description: "Per-member-per-month capitation rate in cents (CAPITATED only; required iff payment_model == CAPITATED)" }
      - { name: shared_savings_baseline_pmpm_cents, type: integer, source: input, description: "Baseline medical cost used to compute savings (SHARED_SAVINGS only; required iff payment_model == SHARED_SAVINGS)" }
      - { name: shared_savings_split_pct, type: number, source: input, description: "Provider's share of savings, 0..1 (SHARED_SAVINGS only)" }
      - { name: quality_withhold_pct, type: number, source: input, default: 0.10, description: "Fraction of payment held pending performance measurement, 0..1" }
      - { name: min_performance_threshold, type: number, source: input, default: 0.80, description: "Minimum composite performance score to release withhold" }

  - name: PCPProvider
    parent: null
    common_fields: true
    fields:
      - { name: care_program_id, type: string, source: input, description: "FK -> CareProgram.id" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique within the program" }
      - { name: full_name, type: string, source: input, description: "PCP full name" }
      - { name: practice_name, type: string, source: input, description: "Practice name" }
      - { name: notification_opt_in, type: boolean, source: input, default: true, description: "Whether PCP receives visit summaries and urgent episode alerts" }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: care_program_id, type: string, source: input, description: "FK -> CareProgram.id" }
      - { name: full_name, type: string, source: input, description: "Clinician full name" }
      - { name: discipline, type: enum, source: input, description: "NP | SW | BH — nurse practitioner, social worker, behavioral health clinician" }
      - { name: home_zip, type: string, source: input, description: "Clinician's base ZIP for routing" }
      - { name: max_daily_visits, type: integer, source: input, description: "Max visits per calendar day; capacity gate" }
      - { name: active_daily_visit_count, type: integer, source: computed, default: 0, description: "Count of SCHEDULED + EN_ROUTE + IN_PROGRESS Visit rows plus DISPATCHED/ON_SCENE UrgentResponseEpisode rows currently assigned to this clinician on the current logical day" }
      - { name: urgent_response_qualified, type: boolean, source: input, default: false, description: "Whether this clinician can be dispatched to URGENT visits/episodes" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: care_program_id, type: string, source: input, description: "FK -> CareProgram.id" }
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id; member is attributed to exactly one contract" }
      - { name: member_external_id, type: string, source: input, description: "Payer-side member identifier (e.g. subscriber ID); unique within a PayerContract" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO 8601 date" }
      - { name: address_zip, type: string, source: input, description: "5-digit ZIP; drives clinician routing and eligibility" }
      - { name: pcp_provider_id, type: string, source: input, description: "FK -> PCPProvider.id; the member's existing PCP — this program does NOT replace the PCP" }
      - { name: chronic_condition_codes, type: array, source: input, description: "ICD-10 style codes contributing to burden score (subset of {CHF, COPD, CKD, DIABETES, DEMENTIA, DEPRESSION, HTN})" }
      - { name: prior_ed_visits_12mo, type: integer, source: input, description: "Count of ED visits in trailing 12 months (from payer data feed)" }
      - { name: prior_inpatient_admits_12mo, type: integer, source: input, description: "Count of inpatient admissions in trailing 12 months" }
      - { name: burden_score_provisional, type: number, source: computed, description: "Risk score from claims history alone, computed at member creation; see calculations.chronic_condition_burden_provisional" }
      - { name: burden_score_final, type: number, source: computed, description: "Risk score after first in-home assessment adds med-rec + safety + social-needs signals; null until then; see calculations.chronic_condition_burden_final" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | VERY_HIGH — derived from burden_score_final if set, else burden_score_provisional" }

  - name: MemberEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: outreach_channel, type: enum, source: input, description: "PHONE | MAIL | IN_PERSON | PCP_REFERRAL" }
      - { name: outreach_attempts, type: integer, source: computed, default: 0, description: "Count of successful record-attempt calls on this enrollment" }
      - { name: consent_recorded_at, type: datetime, source: system, description: "When CONSENTED transition occurred; null until consent" }
      - { name: consent_document_id, type: string, source: input, description: "Reference to the signed consent document; required at CONSENTED" }
      - { name: disenrollment_reason, type: enum, source: input, description: "MEMBER_REQUEST | PAYER_TERMINATION | DECEASED | MOVED_OUT_OF_AREA | NON_ENGAGEMENT" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED → OUTREACH → CONSENTED → ACTIVE → DISENROLLED; OUTREACH → DECLINED; DECLINED → OUTREACH (re-engagement); OUTREACH → OUTREACH (record-attempt cycle)" }
      - { name: is_current, type: boolean, source: computed, description: "True on at most one enrollment per member; on create of a new enrollment the prior is_current enrollment flips to false (CREATE-with-supersede — see concurrency_rules)" }

  - name: CareTeam
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> MemberEnrollment.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id (denormalized for direct lookup)" }
      - { name: primary_np_id, type: string, source: input, description: "FK -> Clinician.id (discipline must be NP); the lead clinician" }
      - { name: social_worker_id, type: string, source: input, description: "FK -> Clinician.id (discipline must be SW); optional until first assessment" }
      - { name: behavioral_clinician_id, type: string, source: input, description: "FK -> Clinician.id (discipline must be BH); optional until first assessment" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → SUSPENDED → ACTIVE (cyclic) → RETIRED" }
      - { name: composition_complete, type: boolean, source: computed, description: "True when primary_np_id, social_worker_id, and behavioral_clinician_id are all set" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> MemberEnrollment.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id (denormalized from enrollment)" }
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; assigned by selector at creation, never by client" }
      - { name: visit_type, type: enum, source: input, description: "INITIAL_ASSESSMENT | ROUTINE_FOLLOWUP | URGENT | POST_ED_FOLLOWUP" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 start of the visit window" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 end of the visit window; scheduled_end > scheduled_start" }
      - { name: actual_start, type: datetime, source: system, description: "When clinician marked IN_PROGRESS; null until then" }
      - { name: actual_end, type: datetime, source: system, description: "When clinician marked COMPLETED; null until then" }
      - { name: cancellation_reason, type: enum, source: input, description: "MEMBER_REQUEST | CLINICIAN_UNAVAILABLE | MEMBER_NO_SHOW | ENROLLMENT_ENDED" }
      - { name: reschedule_count, type: integer, source: computed, default: 0, description: "Number of times this visit has been rescheduled; capped at MAX_RESCHEDULES (2)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → EN_ROUTE → IN_PROGRESS → COMPLETED; SCHEDULED → CANCELLED; SCHEDULED → NO_SHOW; CANCELLED → SCHEDULED (reschedule cycle)" }

  - name: VisitAssessment
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id (denormalized from visit)" }
      - { name: medication_reconciliation, type: object, source: input, description: "{ medications_reviewed: integer, discrepancies_found: integer, high_risk_med_changes: integer }" }
      - { name: safety_evaluation, type: object, source: input, description: "{ fall_risk_score: integer 0..10, home_hazard_count: integer, adl_impairment_count: integer }" }
      - { name: social_needs_screening, type: object, source: input, description: "{ food_insecurity: boolean, housing_instability: boolean, transportation_barrier: boolean, social_isolation_score: integer 0..10 }" }
      - { name: pcp_coordination_note, type: string, source: input, description: "Free-text note describing PCP coordination; required for completion" }
      - { name: pcp_notified, type: boolean, source: computed, default: false, description: "Whether a visit-summary notification was dispatched to the member's PCP (system action after COMPLETED)" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → LOCKED (after risk snapshot recompute on visit completion)" }

  - name: UrgentResponseEpisode
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> MemberEnrollment.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id (denormalized from enrollment)" }
      - { name: trigger_source, type: enum, source: input, description: "MEMBER_CALL | PCP_ALERT | PLAN_ALERT | POST_ED_DISCHARGE" }
      - { name: triggered_at, type: datetime, source: system, description: "Logical clock time at episode creation" }
      - { name: sla_deadline, type: datetime, source: computed, description: "= triggered_at + CareProgram.urgent_response_sla_hours hours" }
      - { name: dispatched_clinician_id, type: string, source: system, description: "FK -> Clinician.id; assigned by selector at DISPATCHED transition" }
      - { name: on_scene_at, type: datetime, source: system, description: "When the dispatched clinician marked arrival; null until then" }
      - { name: resolved_outcome, type: enum, source: input, description: "AVOIDED_ED | REFERRED_TO_ED — recorded at resolution" }
      - { name: sla_met, type: boolean, source: computed, description: "on_scene_at <= sla_deadline; false if LAPSED or on_scene_at > sla_deadline" }
      - { name: status, type: enum, source: system, description: "TRIGGERED → DISPATCHED → ON_SCENE → RESOLVED; TRIGGERED → LAPSED (system auto when clock passes sla_deadline); DISPATCHED → LAPSED" }

  - name: PerformanceMeasurement
    parent: null
    common_fields: true
    fields:
      - { name: payer_contract_id, type: string, source: system, description: "FK -> PayerContract.id (derived via member)" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: period_index, type: integer, source: system, description: "CareProgram.current_period_index at the time the row was first written" }
      - { name: urgent_episodes_triggered, type: integer, source: computed, default: 0, description: "Count of UrgentResponseEpisode rows created for this member in this period (any non-terminal or terminal state)" }
      - { name: urgent_episodes_sla_met, type: integer, source: computed, default: 0, description: "Count where sla_met == true at resolution" }
      - { name: urgent_episodes_avoided_ed, type: integer, source: computed, default: 0, description: "Count where resolved_outcome == AVOIDED_ED" }
      - { name: visits_completed, type: integer, source: computed, default: 0, description: "Count of COMPLETED visits in period" }
      - { name: visits_no_show, type: integer, source: computed, default: 0, description: "Count of NO_SHOW visits in period" }
      - { name: visits_cancelled, type: integer, source: computed, default: 0, description: "Count of CANCELLED visits in period (not subsequently rescheduled)" }
      - { name: pcp_coordination_rate, type: number, source: computed, description: "Fraction of COMPLETED visits whose assessment has pcp_notified == true; 0 if no visits" }
      - { name: composite_score, type: number, source: computed, description: "See calculations.composite_performance_score" }

  - name: PayerSettlement
    parent: null
    common_fields: true
    fields:
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id" }
      - { name: period_index, type: integer, source: system, description: "CareProgram.current_period_index at settlement creation" }
      - { name: enrolled_member_count, type: integer, source: computed, description: "Members whose enrollment is ACTIVE at any point in the period (see calculations.enrolled_member_months)" }
      - { name: gross_capitation_cents, type: integer, source: computed, description: "Sum over enrolled members of pmpm_rate_cents (CAPITATED only; null on SHARED_SAVINGS)" }
      - { name: gross_savings_share_cents, type: integer, source: computed, description: "Provider's share of pooled savings (SHARED_SAVINGS only; null on CAPITATED)" }
      - { name: quality_withhold_cents, type: integer, source: computed, description: "Amount held back pending performance release" }
      - { name: withhold_released_cents, type: integer, source: computed, description: "Amount of withhold actually released based on composite performance; null until FINALIZED" }
      - { name: net_payment_cents, type: integer, source: computed, description: "Final amount payable to provider for this period; null until FINALIZED" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL → FINALIZED → PAID; PROVISIONAL → VOIDED" }

  - name: MedicalCost
    parent: null
    common_fields: true
    fields:
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: period_index, type: integer, source: input, description: "Period in which the cost was incurred" }
      - { name: amount_cents, type: integer, source: input, description: "Observed medical cost; >= 0" }
      - { name: incurred_date, type: datetime, source: input, description: "ISO 8601 date" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MemberEnrollment
    initial_state: IDENTIFIED
    terminal_states: [DISENROLLED]
    transitions:
      - from: IDENTIFIED
        to: OUTREACH
        trigger: "POST /enrollments/{enrollmentId}/begin-outreach"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == IDENTIFIED (ERR_ENROLLMENT_NOT_IDENTIFIED)"
          - "MemberEnrollment.is_current == true (ERR_ENROLLMENT_SUPERSEDED)"
        side_effects:
          - "outreach_attempts = 1 (initializes the counter)"

      - from: OUTREACH
        to: OUTREACH
        trigger: "POST /enrollments/{enrollmentId}/record-attempt"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == OUTREACH (ERR_ENROLLMENT_NOT_IN_OUTREACH)"
          - "outreach_attempts < MAX_OUTREACH_ATTEMPTS (ERR_OUTREACH_ATTEMPTS_EXHAUSTED)"
        side_effects:
          - "outreach_attempts += 1"
          - "If outreach_attempts reaches MAX_OUTREACH_ATTEMPTS (3): status auto-transitions to DECLINED with disenrollment_reason = NON_ENGAGEMENT"
        note: "Cyclic self-transition with a counter-driven auto-exit"

      - from: OUTREACH
        to: CONSENTED
        trigger: "POST /enrollments/{enrollmentId}/record-consent"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == OUTREACH (ERR_ENROLLMENT_NOT_IN_OUTREACH)"
          - "consent_document_id is present in payload (ERR_CONSENT_DOCUMENT_REQUIRED)"
        side_effects:
          - "consent_recorded_at = current logical clock"
          - "A new CareTeam is created with status DRAFT for this enrollment (enrollment_id, member_id set; clinician FKs all null)"

      - from: OUTREACH
        to: DECLINED
        trigger: "POST /enrollments/{enrollmentId}/record-decline"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == OUTREACH (ERR_ENROLLMENT_NOT_IN_OUTREACH)"
        side_effects: []

      - from: DECLINED
        to: OUTREACH
        trigger: "POST /enrollments/{enrollmentId}/begin-outreach"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == DECLINED (ERR_ENROLLMENT_NOT_DECLINED)"
          - "MemberEnrollment.is_current == true (ERR_ENROLLMENT_SUPERSEDED)"
        side_effects:
          - "outreach_attempts = 1 (counter reset on re-engagement)"
        note: "Cycle-closing edge — DECLINED → OUTREACH"

      - from: CONSENTED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollmentId}/activate"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == CONSENTED (ERR_ENROLLMENT_NOT_CONSENTED)"
          - "CareTeam.status == ACTIVE for the care team whose enrollment_id == this enrollment (ERR_CARE_TEAM_NOT_ACTIVE)"
        side_effects:
          - "MemberEnrollment becomes eligible for Visit creation and UrgentResponseEpisode creation"
          - "A PerformanceMeasurement row is created for (member.payer_contract_id, member.id, current_period_index) if none exists yet, with all counters at 0 and composite_score == 1.0 (all components fall back to 1.0 on empty denominators)"

      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /enrollments/{enrollmentId}/disenroll"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "disenrollment_reason is present (ERR_DISENROLLMENT_REASON_REQUIRED)"
        side_effects:
          - "All SCHEDULED Visit children of this enrollment → CANCELLED with cancellation_reason = ENROLLMENT_ENDED; each decrements its clinician.active_daily_visit_count by 1"
          - "CareTeam for this enrollment → RETIRED"
          - "is_current = false"
          - "PerformanceMeasurement for (member, current period): recomputed with this member excluded from enrolled_member_count"

      - from: CONSENTED
        to: DISENROLLED
        trigger: "POST /enrollments/{enrollmentId}/disenroll"
        actor: EngagementSpecialist
        preconditions:
          - "MemberEnrollment.status == CONSENTED (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "disenrollment_reason is present (ERR_DISENROLLMENT_REASON_REQUIRED)"
        side_effects:
          - "CareTeam for this enrollment → RETIRED"
          - "is_current = false"

  - entity: CareTeam
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /enrollments/{enrollmentId}/care-team/activate"
        actor: CareCoordinator
        preconditions:
          - "CareTeam.status == DRAFT (ERR_CARE_TEAM_NOT_DRAFT)"
          - "primary_np_id is set AND refers to a Clinician with discipline == NP AND status == ACTIVE (ERR_PRIMARY_NP_INVALID)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enrollments/{enrollmentId}/care-team/suspend"
        actor: CareCoordinator
        preconditions:
          - "CareTeam.status == ACTIVE (ERR_CARE_TEAM_NOT_ACTIVE)"
        side_effects:
          - "Subsequent POST /visits for this enrollment is rejected (ERR_CARE_TEAM_NOT_ACTIVE) while SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollmentId}/care-team/reinstate"
        actor: CareCoordinator
        preconditions:
          - "CareTeam.status == SUSPENDED (ERR_CARE_TEAM_NOT_SUSPENDED)"
        side_effects: []

      - from: ACTIVE
        to: RETIRED
        trigger: "system (cascade from MemberEnrollment ACTIVE→DISENROLLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: RETIRED
        trigger: "system (cascade from MemberEnrollment ACTIVE→DISENROLLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: RETIRED
        trigger: "system (cascade from MemberEnrollment CONSENTED→DISENROLLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /visits/{visitId}/depart"
        actor: Clinician
        preconditions:
          - "Visit.status == SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "Acting clinician's X-User-ID == Visit.clinician_id (ERR_NOT_ASSIGNED_CLINICIAN)"
        side_effects: []

      - from: EN_ROUTE
        to: IN_PROGRESS
        trigger: "POST /visits/{visitId}/arrive"
        actor: Clinician
        preconditions:
          - "Visit.status == EN_ROUTE (ERR_VISIT_NOT_EN_ROUTE)"
          - "Acting clinician's X-User-ID == Visit.clinician_id (ERR_NOT_ASSIGNED_CLINICIAN)"
        side_effects:
          - "actual_start = current logical clock"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /visits/{visitId}/complete"
        actor: Clinician
        preconditions:
          - "Visit.status == IN_PROGRESS (ERR_VISIT_NOT_IN_PROGRESS)"
          - "Acting clinician's X-User-ID == Visit.clinician_id (ERR_NOT_ASSIGNED_CLINICIAN)"
          - "A VisitAssessment with status == SUBMITTED exists for this visit (ERR_ASSESSMENT_NOT_SUBMITTED)"
          - "VisitAssessment.pcp_coordination_note is non-empty (ERR_PCP_COORDINATION_NOTE_REQUIRED)"
        side_effects:
          - "actual_end = current logical clock"
          - "clinician.active_daily_visit_count -= 1"
          - "VisitAssessment.status → LOCKED"
          - "Member.burden_score_final recomputed (calculations.chronic_condition_burden_final)"
          - "Member.risk_tier rederived from burden_score_final"
          - "VisitAssessment.pcp_notified = true if the member's PCPProvider.notification_opt_in == true"
          - "PerformanceMeasurement for (contract, member, current period): visits_completed += 1, pcp_coordination_rate recomputed, composite_score recomputed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{visitId}/cancel"
        actor: CareCoordinator
        preconditions:
          - "Visit.status == SCHEDULED (ERR_VISIT_NOT_CANCELLABLE)"
          - "cancellation_reason is present (ERR_CANCELLATION_REASON_REQUIRED)"
        side_effects:
          - "clinician.active_daily_visit_count -= 1"
          - "PerformanceMeasurement: visits_cancelled += 1, composite_score recomputed"

      - from: CANCELLED
        to: SCHEDULED
        trigger: "POST /visits/{visitId}/reschedule"
        actor: CareCoordinator
        preconditions:
          - "Visit.status == CANCELLED (ERR_VISIT_NOT_CANCELLED)"
          - "reschedule_count < MAX_RESCHEDULES (2) (ERR_MAX_RESCHEDULES_EXCEEDED)"
          - "scheduled_start / scheduled_end supplied in payload and do not overlap (half-open [start, end)) with any other SCHEDULED/EN_ROUTE/IN_PROGRESS visit assigned to the same clinician (ERR_VISIT_TIME_OVERLAP)"
          - "MemberEnrollment for this visit has status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "reschedule_count += 1"
          - "scheduled_start, scheduled_end updated to the new window"
          - "clinician.active_daily_visit_count += 1"
          - "PerformanceMeasurement: visits_cancelled -= 1, composite_score recomputed"
          - "increments Visit.version by 1"
        note: "Cycle-closing edge — CANCELLED → SCHEDULED enables the reschedule loop"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /visits/{visitId}/mark-no-show"
        actor: Clinician
        preconditions:
          - "Visit.status == SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "Acting clinician's X-User-ID == Visit.clinician_id (ERR_NOT_ASSIGNED_CLINICIAN)"
          - "current logical clock >= scheduled_end (ERR_VISIT_WINDOW_NOT_PAST)"
        side_effects:
          - "clinician.active_daily_visit_count -= 1"
          - "PerformanceMeasurement: visits_no_show += 1, composite_score recomputed"

  - entity: VisitAssessment
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /visits/{visitId}/assessment/submit"
        actor: Clinician
        preconditions:
          - "VisitAssessment.status == DRAFT (ERR_ASSESSMENT_NOT_DRAFT)"
          - "Visit.status == IN_PROGRESS (ERR_VISIT_NOT_IN_PROGRESS)"
          - "medication_reconciliation, safety_evaluation, and social_needs_screening are all present and fully populated (ERR_ASSESSMENT_INCOMPLETE)"
        side_effects: []

      - from: SUBMITTED
        to: LOCKED
        trigger: "system (cascade from Visit IN_PROGRESS→COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: UrgentResponseEpisode
    initial_state: TRIGGERED
    terminal_states: [RESOLVED, LAPSED]
    transitions:
      - from: TRIGGERED
        to: DISPATCHED
        trigger: "POST /urgent-episodes/{episodeId}/dispatch"
        actor: CareCoordinator
        preconditions:
          - "UrgentResponseEpisode.status == TRIGGERED (ERR_EPISODE_NOT_TRIGGERED)"
          - "current logical clock <= sla_deadline (ERR_SLA_ALREADY_LAPSED)"
        side_effects:
          - "Selector runs (calculations.urgent_clinician_selector): dispatched_clinician_id assigned"
          - "Dispatched clinician's active_daily_visit_count += 1"

      - from: DISPATCHED
        to: ON_SCENE
        trigger: "POST /urgent-episodes/{episodeId}/arrive"
        actor: Clinician
        preconditions:
          - "UrgentResponseEpisode.status == DISPATCHED (ERR_EPISODE_NOT_DISPATCHED)"
          - "Acting clinician's X-User-ID == dispatched_clinician_id (ERR_NOT_ASSIGNED_CLINICIAN)"
        side_effects:
          - "on_scene_at = current logical clock"
          - "sla_met = (on_scene_at <= sla_deadline)"

      - from: ON_SCENE
        to: RESOLVED
        trigger: "POST /urgent-episodes/{episodeId}/resolve"
        actor: Clinician
        preconditions:
          - "UrgentResponseEpisode.status == ON_SCENE (ERR_EPISODE_NOT_ON_SCENE)"
          - "resolved_outcome is present (ERR_RESOLUTION_OUTCOME_REQUIRED)"
          - "Acting clinician's X-User-ID == dispatched_clinician_id (ERR_NOT_ASSIGNED_CLINICIAN)"
        side_effects:
          - "Dispatched clinician's active_daily_visit_count -= 1"
          - "If resolved_outcome == AVOIDED_ED: PerformanceMeasurement.urgent_episodes_avoided_ed += 1"
          - "If sla_met == true: PerformanceMeasurement.urgent_episodes_sla_met += 1"
          - "PerformanceMeasurement.composite_score recomputed"
          - "If resolved_outcome == REFERRED_TO_ED: cascade creates a new Visit with visit_type == POST_ED_FOLLOWUP, status SCHEDULED, assigned to the care team's primary_np_id, window [now, now+72h]"

      - from: TRIGGERED
        to: LAPSED
        trigger: "system (auto when logical clock > sla_deadline AND status still TRIGGERED)"
        actor: system
        preconditions: []
        side_effects:
          - "sla_met = false"
          - "PerformanceMeasurement.composite_score recomputed (the lapsed episode remains in urgent_episodes_triggered but never increments urgent_episodes_sla_met, depressing the SLA ratio)"

      - from: DISPATCHED
        to: LAPSED
        trigger: "system (auto when logical clock > sla_deadline AND status still DISPATCHED)"
        actor: system
        preconditions: []
        side_effects:
          - "sla_met = false"
          - "Dispatched clinician's active_daily_visit_count -= 1"
          - "PerformanceMeasurement.composite_score recomputed"

  - entity: PayerSettlement
    initial_state: PROVISIONAL
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /payer-contracts/{contractId}/settlements/{settlementId}/finalize"
        actor: ContractAdministrator
        preconditions:
          - "PayerSettlement.status == PROVISIONAL (ERR_SETTLEMENT_NOT_PROVISIONAL)"
          - "PayerContract has not passed contract_expiration_date (ERR_CONTRACT_EXPIRED)"
        side_effects:
          - "withhold_released_cents computed from PerformanceMeasurement rows for the period"
          - "net_payment_cents finalized"

      - from: FINALIZED
        to: PAID
        trigger: "POST /payer-contracts/{contractId}/settlements/{settlementId}/mark-paid"
        actor: ContractAdministrator
        preconditions:
          - "PayerSettlement.status == FINALIZED (ERR_SETTLEMENT_NOT_FINALIZED)"
        side_effects: []

      - from: PROVISIONAL
        to: VOIDED
        trigger: "POST /payer-contracts/{contractId}/settlements/{settlementId}/void"
        actor: ContractAdministrator
        preconditions:
          - "PayerSettlement.status == PROVISIONAL (ERR_SETTLEMENT_NOT_PROVISIONAL)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{memberId}/enrollments"
    occ_field: "expected_member_version"
    description: |
      Creating a new MemberEnrollment against a Member whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a new enrollment (which
      legitimately supersedes the prior is_current enrollment under the
      CREATE-with-supersede rule) and the current writer's view of the member
      is therefore stale. The rejected client re-reads the member and decides
      whether the new enrollment obviates theirs.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: visit-reschedule-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /visits/{visitId}/reschedule"
    occ_field: "expected_visit_version"
    description: |
      Rescheduling a Visit whose version has advanced since the client last
      observed it is rejected. The prior cancel (or a system-side cascade
      from MemberEnrollment disenrollment) may have already updated the
      visit, so the current writer's stale view would corrupt the
      reschedule_count and the active_daily_visit_count decrement sequence.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: chronic_condition_burden_provisional
    trigger: "Member creation; recomputed when chronic_condition_codes, prior_ed_visits_12mo, or prior_inpatient_admits_12mo change"
    algorithm: weighted_scoring
    formula: |
      # Variant A (provisional): claims-history only, no in-home signals
      chronic_points = sum over chronic_condition_codes of CONDITION_WEIGHT[code]
      ed_points = prior_ed_visits_12mo * ED_VISIT_WEIGHT
      ip_points = prior_inpatient_admits_12mo * IP_ADMIT_WEIGHT
      burden_score_provisional = chronic_points + ed_points + ip_points
      # risk_tier derivation (same thresholds used for provisional and final)
      if burden_score_provisional >= TIER_VERY_HIGH_MIN: risk_tier = VERY_HIGH
      elif burden_score_provisional >= TIER_HIGH_MIN:    risk_tier = HIGH
      elif burden_score_provisional >= TIER_MEDIUM_MIN:  risk_tier = MEDIUM
      else:                                              risk_tier = LOW
    input_set: "All members regardless of enrollment status; only the provisional variant uses claims history alone"
    constants:
      ED_VISIT_WEIGHT: 3
      IP_ADMIT_WEIGHT: 5
      TIER_MEDIUM_MIN: 8
      TIER_HIGH_MIN: 15
      TIER_VERY_HIGH_MIN: 25
      CONDITION_WEIGHT: { CHF: 6, COPD: 5, CKD: 4, DIABETES: 3, DEMENTIA: 7, DEPRESSION: 2, HTN: 1 }
    precision: "integer points (no rounding)"
    variants:
      - name: provisional
        when: "Before the first COMPLETED INITIAL_ASSESSMENT for the member"
        difference: "Uses only claims history; ignores med-rec, safety, and social-needs signals"

  - name: chronic_condition_burden_final
    trigger: "Visit COMPLETED transition on each completed INITIAL_ASSESSMENT for the member; recomputed from the latest such assessment"
    algorithm: weighted_scoring
    formula: |
      # Variant B (final): claims history + in-home assessment signals
      base = chronic_condition_burden_provisional(member)
      a = the latest VisitAssessment (by visit.actual_end, ties broken by visit.created_at ASC)
          whose visit.visit_type == INITIAL_ASSESSMENT AND visit.status == COMPLETED
      med_rec_bonus = a.medication_reconciliation.discrepancies_found * MED_DISCREPANCY_WEIGHT
                  + a.medication_reconciliation.high_risk_med_changes * HIGH_RISK_MED_WEIGHT
      safety_bonus = a.safety_evaluation.fall_risk_score * FALL_RISK_WEIGHT
                  + a.safety_evaluation.home_hazard_count * HOME_HAZARD_WEIGHT
                  + a.safety_evaluation.adl_impairment_count * ADL_WEIGHT
      social_bonus = (1 if a.social_needs_screening.food_insecurity else 0) * FOOD_INSECURITY_WEIGHT
                  + (1 if a.social_needs_screening.housing_instability else 0) * HOUSING_WEIGHT
                  + (1 if a.social_needs_screening.transportation_barrier else 0) * TRANSPORT_WEIGHT
                  + a.social_needs_screening.social_isolation_score * ISOLATION_WEIGHT
      burden_score_final = base + med_rec_bonus + safety_bonus + social_bonus
      # risk_tier re-derivation
      if burden_score_final >= TIER_VERY_HIGH_MIN: risk_tier = VERY_HIGH
      elif burden_score_final >= TIER_HIGH_MIN:    risk_tier = HIGH
      elif burden_score_final >= TIER_MEDIUM_MIN:  risk_tier = MEDIUM
      else:                                        risk_tier = LOW
    input_set: "Members with at least one COMPLETED INITIAL_ASSESSMENT Visit whose VisitAssessment is LOCKED"
    constants:
      MED_DISCREPANCY_WEIGHT: 1
      HIGH_RISK_MED_WEIGHT: 2
      FALL_RISK_WEIGHT: 1
      HOME_HAZARD_WEIGHT: 1
      ADL_WEIGHT: 2
      FOOD_INSECURITY_WEIGHT: 2
      HOUSING_WEIGHT: 3
      TRANSPORT_WEIGHT: 1
      ISOLATION_WEIGHT: 1
      TIER_MEDIUM_MIN: 8
      TIER_HIGH_MIN: 15
      TIER_VERY_HIGH_MIN: 25
    precision: "integer points"
    variants:
      - name: final
        when: "After the first COMPLETED INITIAL_ASSESSMENT for the member"
        difference: "Adds med-rec, safety, and social-needs bonuses on top of the provisional base; produces a different (typically higher) burden_score and possibly a higher risk_tier for identical claims history"

  - name: composite_performance_score
    trigger: "Any update to PerformanceMeasurement counters (visit completed/cancelled/no-show, urgent episode created/resolved/lapsed)"
    algorithm: weighted_scoring
    formula: |
      # Four components, each in [0,1], weighted and combined
      sla_component            = urgent_episodes_sla_met / urgent_episodes_triggered            if urgent_episodes_triggered > 0 else 1.0
      ed_avoid_component       = urgent_episodes_avoided_ed / urgent_episodes_triggered         if urgent_episodes_triggered > 0 else 1.0
      visit_completion_component = visits_completed / (visits_completed + visits_no_show + visits_cancelled) if (visits_completed + visits_no_show + visits_cancelled) > 0 else 1.0
      pcp_component            = pcp_coordination_rate
      # Round each component to 4 decimal places BEFORE weighting (round_half_up);
      # then round the weighted sum to 4 decimal places AFTER weighting (round_half_up).
      # Collapsing the two-step rounding produces different cents downstream — pinned here.
      composite_score = round4( SLA_WEIGHT * round4(sla_component)
                      + ED_AVOID_WEIGHT * round4(ed_avoid_component)
                      + VISIT_COMPLETION_WEIGHT * round4(visit_completion_component)
                      + PCP_COORDINATION_WEIGHT * round4(pcp_component) )
    input_set: "PerformanceMeasurement rows for (contract, member, period)"
    constants:
      SLA_WEIGHT: 0.40
      ED_AVOID_WEIGHT: 0.30
      VISIT_COMPLETION_WEIGHT: 0.20
      PCP_COORDINATION_WEIGHT: 0.10
    precision: "4 decimal places per component (round_half_up), then 4 decimal places on the weighted sum (round_half_up)"

  - name: capitated_settlement_amount
    trigger: "PayerSettlement created at period close (CAPITATED contracts only); recomputed on enrollment changes during the period while PROVISIONAL"
    algorithm: aggregation
    formula: |
      # CAPITATED branch
      enrolled_member_count = count of Member rows where:
        - Member.payer_contract_id == this contract
        - exists a MemberEnrollment with status == ACTIVE at any point during the period
      gross_capitation_cents = enrolled_member_count * payer_contract.pmpm_rate_cents
      # Quality withhold — computed on the GROSS, rounded half-up at the aggregate
      quality_withhold_cents = round_half_up(gross_capitation_cents * payer_contract.quality_withhold_pct)
      # Withhold release decision at finalize time
      qualifying_member_count = count of PerformanceMeasurement rows for (contract, period) where composite_score >= payer_contract.min_performance_threshold
      release_fraction = qualifying_member_count / enrolled_member_count if enrolled_member_count > 0 else 0
      withhold_released_cents = round_half_up(quality_withhold_cents * release_fraction)
      # Net
      net_payment_cents = gross_capitation_cents - quality_withhold_cents + withhold_released_cents
    input_set: "Members attributed to this contract with ACTIVE enrollment at any point in the period; PerformanceMeasurement rows for the period"
    precision: "integer cents, round_half_up"

  - name: shared_savings_settlement_amount
    trigger: "PayerSettlement created at period close (SHARED_SAVINGS contracts only)"
    algorithm: aggregation
    formula: |
      # SHARED_SAVINGS branch — combinatorial, multi-step, evaluation order pinned
      # Step 1: per-member actual cost vs baseline (per-member rounding, then sum)
      for each member enrolled during the period:
        member_baseline_cents = payer_contract.shared_savings_baseline_pmpm_cents
        member_actual_cents   = sum of MedicalCost.amount_cents where MedicalCost.member_id == member.id
                                                                  AND MedicalCost.period_index == settlement.period_index
        member_delta_cents    = member_baseline_cents - member_actual_cents   # positive = savings
      # Step 2: pool deltas (losers offset winners)
      pooled_savings_cents = sum of member_delta_cents across enrolled members
      # Step 3: floor at zero — negative pooled savings produce no payment (and no clawback)
      if pooled_savings_cents <= 0:
        gross_savings_share_cents = 0
      else:
        gross_savings_share_cents = round_half_up(pooled_savings_cents * payer_contract.shared_savings_split_pct)
      # Step 4: quality withhold (same shape as capitated branch)
      quality_withhold_cents = round_half_up(gross_savings_share_cents * payer_contract.quality_withhold_pct)
      qualifying_member_count = count of PerformanceMeasurement rows for (contract, period) where composite_score >= payer_contract.min_performance_threshold
      release_fraction = qualifying_member_count / enrolled_member_count if enrolled_member_count > 0 else 0
      withhold_released_cents = round_half_up(quality_withhold_cents * release_fraction)
      net_payment_cents = gross_savings_share_cents - quality_withhold_cents + withhold_released_cents
      # Circular-look resolution: pooled_savings depends on member deltas, which do NOT
      # depend on the withhold. The evaluation order is: per-member delta → pool → split
      # → withhold → release. There is no true cycle; the order is pinned here so a
      # reader cannot accidentally compute the withhold before the pool.
    input_set: "Members attributed to this contract; MedicalCost rows for the period"
    precision: "integer cents, round_half_up"

  - name: routine_visit_clinician_selector
    trigger: "POST /visits (creating a SCHEDULED visit with visit_type != URGENT)"
    algorithm: constraint_propagation
    formula: |
      # Required discipline by visit_type
      required_discipline(visit_type):
        INITIAL_ASSESSMENT -> NP
        ROUTINE_FOLLOWUP   -> NP   # NPs preferred; SWs are NOT eligible for follow-up unless separately extended
        POST_ED_FOLLOWUP   -> NP
        URGENT             -> rejected at this selector (use urgent_clinician_selector via /urgent-episodes)
      # Eligibility filter
      candidates = Clinician rows where:
        - care_program_id == this visit's member's care_program_id
        - status == ACTIVE
        - home_zip IN CareProgram.service_geography_zips
        - discipline == required_discipline(visit_type)
        - active_daily_visit_count < max_daily_visits
      # Ranking expression: lowest active_daily_visit_count, then earliest clinician.created_at
      sort candidates by (active_daily_visit_count ASC, created_at ASC)
      # Fallback if empty: reject with ERR_NO_AVAILABLE_CLINICIAN
      # Note: id is NEVER used as a tie-break; created_at is the only fallback.
    input_set: "ACTIVE Clinician rows in the same CareProgram as the visit's member"
    constants: {}
    precision: "deterministic — no random inputs"

  - name: urgent_clinician_selector
    trigger: "UrgentResponseEpisode TRIGGERED → DISPATCHED transition"
    algorithm: constraint_propagation
    formula: |
      # Eligibility filter — STRICTER than routine
      candidates = Clinician rows where:
        - care_program_id == this episode's member's care_program_id
        - status == ACTIVE
        - urgent_response_qualified == true
        - home_zip IN CareProgram.service_geography_zips
        - active_daily_visit_count < max_daily_visits
      # Ranking expression: lowest active_daily_visit_count, then earliest clinician.created_at
      sort candidates by (active_daily_visit_count ASC, created_at ASC)
      # Fallback if empty: reject with ERR_NO_AVAILABLE_CLINICIAN; the SLA clock continues to run
      # Note: id is NEVER used as a tie-break.
    input_set: "ACTIVE urgent_response_qualified Clinician rows in the same CareProgram as the episode's member"
    constants: {}
    precision: "deterministic — no random inputs"

  - name: enrolled_member_months
    trigger: "PayerSettlement aggregation; PerformanceMeasurement reporting"
    algorithm: aggregation
    formula: |
      # A member counts as enrolled for the period iff:
      #   exists MemberEnrollment with:
      #     - member_id == member.id
      #     - status was ACTIVE at any point during the period
      # Period boundaries are defined by the CareProgram.current_period_index at the
      # settlement creation moment vs the previous settlement; for the first settlement,
      # the period is [program creation, current_period_index].
      enrolled_member_count = count of distinct member_id satisfying the above
    input_set: "MemberEnrollment rows for members attributed to this contract"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted to call this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-template IDs must resolve to existing resources, validated left-to-right"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path IDs

  - priority: 4
    category: existence
    check: "Body-supplied foreign keys must resolve (payer_contract_id, pcp_provider_id, member_id, enrollment_id, primary_np_id, social_worker_id, behavioral_clinician_id)"
    error_id: "ERR_{REFERENCED}_NOT_FOUND"
    http_status: 404
    applies_to: endpoints with body FK references

  - priority: 5
    category: state
    check: "Target resource must be in the expected state for this transition"
    error_id: "ERR_INVALID_STATE / ERR_{RESOURCE}_NOT_{EXPECTED_STATE}"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_safety
    check: "MemberEnrollment must be is_current == true for any state transition on it"
    error_id: ERR_ENROLLMENT_SUPERSEDED
    http_status: 409
    applies_to: "POST /enrollments/{id}/begin-outreach, record-attempt, record-consent, record-decline, activate, disenroll"

  - priority: 7
    category: business_safety
    check: "CareTeam must be ACTIVE for new Visit creation; primary_np discipline must be NP at care-team/activate"
    error_id: "ERR_CARE_TEAM_NOT_ACTIVE / ERR_PRIMARY_NP_INVALID"
    http_status: 409
    applies_to: "POST /visits, POST /enrollments/{id}/care-team/activate"

  - priority: 8
    category: business_safety
    check: "Acting clinician must be the assigned clinician for clinician-driven transitions"
    error_id: ERR_NOT_ASSIGNED_CLINICIAN
    http_status: 403
    applies_to: "POST /visits/{id}/depart, arrive, complete, mark-no-show; POST /urgent-episodes/{id}/arrive, resolve"

  - priority: 9
    category: business_constraint
    check: "Visit window must not overlap with another SCHEDULED/EN_ROUTE/IN_PROGRESS visit assigned to the same clinician (half-open interval [scheduled_start, scheduled_end))"
    error_id: ERR_VISIT_TIME_OVERLAP
    http_status: 409
    applies_to: "POST /visits, POST /visits/{id}/reschedule"

  - priority: 10
    category: business_constraint
    check: "Clinician capacity: active_daily_visit_count must be < max_daily_visits at assignment time; if the selector's candidate pool is empty, reject"
    error_id: ERR_NO_AVAILABLE_CLINICIAN
    http_status: 409
    applies_to: "POST /visits, POST /urgent-episodes/{id}/dispatch"

  - priority: 11
    category: business_temporal
    check: "Urgent dispatch must occur while current logical clock <= sla_deadline"
    error_id: ERR_SLA_ALREADY_LAPSED
    http_status: 409
    applies_to: "POST /urgent-episodes/{id}/dispatch"

  - priority: 12
    category: business_temporal
    check: "Mark-no-show requires the current logical clock to be at or past scheduled_end"
    error_id: ERR_VISIT_WINDOW_NOT_PAST
    http_status: 409
    applies_to: "POST /visits/{id}/mark-no-show"

  - priority: 13
    category: business_referential
    check: "A new MemberEnrollment cannot be created when the member's current version does not match expected_member_version — the caller must supersede via OCC with the latest member.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /members/{id}/enrollments"

  - priority: 14
    category: business_fiscal
    check: "PayerContract must not be expired at settlement finalization"
    error_id: ERR_CONTRACT_EXPIRED
    http_status: 409
    applies_to: "POST /payer-contracts/{id}/settlements/{id}/finalize"

  - priority: 15
    category: business_fiscal
    check: "Payment model consistency: CAPITATED requires pmpm_rate_cents; SHARED_SAVINGS requires shared_savings_baseline_pmpm_cents and shared_savings_split_pct"
    error_id: ERR_PAYMENT_MODEL_MISMATCH
    http_status: 400
    applies_to: "POST /payer-contracts"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Care Programs ---
  - method: POST
    path: "/care-programs"
    description: "Create a care program"
    roles: [PlatformAdmin]
    code: 201
    input: [program_code, display_name, service_geography_zips, "urgent_response_sla_hours?"]
    output: CareProgram
    side_effects: ["current_period_index = 0"]

  - method: GET
    path: "/care-programs"
    description: "List care programs"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, Clinician, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "CareProgram[]"
    side_effects: []

  - method: GET
    path: "/care-programs/{programId}"
    description: "Get a care program"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, Clinician, PerformanceAnalyst]
    code: 200
    input: []
    output: CareProgram
    side_effects: []

  - method: POST
    path: "/care-programs/{programId}/clock/advance"
    description: "Advance the program logical period forward by N days"
    roles: [PlatformAdmin]
    code: 200
    input: [by_days]
    output: CareProgram
    side_effects:
      - "current_period_index += by_days"
      - "Sweep UrgentResponseEpisodes in TRIGGERED or DISPATCHED whose sla_deadline has passed → LAPSED"

  # --- Payer Contracts ---
  - method: POST
    path: "/payer-contracts"
    description: "Create a payer contract"
    roles: [ContractAdministrator]
    code: 201
    input: [care_program_id, payer_name, contract_effective_date, contract_expiration_date, payment_model, "pmpm_rate_cents?", "shared_savings_baseline_pmpm_cents?", "shared_savings_split_pct?", "quality_withhold_pct?", "min_performance_threshold?"]
    output: PayerContract
    side_effects: []

  - method: GET
    path: "/payer-contracts"
    description: "List payer contracts"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "care_program_id?", "payment_model?"]
    output: "PayerContract[]"
    side_effects: []

  - method: GET
    path: "/payer-contracts/{contractId}"
    description: "Get a payer contract"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, PerformanceAnalyst]
    code: 200
    input: []
    output: PayerContract
    side_effects: []

  # --- Medical Costs (input to shared-savings settlement) ---
  - method: POST
    path: "/medical-costs"
    description: "Record an observed medical cost row"
    roles: [ContractAdministrator]
    code: 201
    input: [payer_contract_id, member_id, period_index, amount_cents, incurred_date]
    output: MedicalCost
    side_effects: []

  - method: GET
    path: "/medical-costs"
    description: "List medical cost rows"
    roles: [PlatformAdmin, ContractAdministrator, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "payer_contract_id?", "member_id?", "period_index?"]
    output: "MedicalCost[]"
    side_effects: []

  # --- PCP Providers ---
  - method: POST
    path: "/pcp-providers"
    description: "Register a PCP provider"
    roles: [PlatformAdmin]
    code: 201
    input: [care_program_id, npi, full_name, practice_name, "notification_opt_in?"]
    output: PCPProvider
    side_effects: []

  - method: GET
    path: "/pcp-providers"
    description: "List PCP providers"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist]
    code: 200
    input: ["limit?", "offset?", "care_program_id?"]
    output: "PCPProvider[]"
    side_effects: []

  - method: GET
    path: "/pcp-providers/{pcpId}"
    description: "Get a PCP provider"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist]
    code: 200
    input: []
    output: PCPProvider
    side_effects: []

  # --- Clinicians ---
  - method: POST
    path: "/clinicians"
    description: "Register a clinician"
    roles: [PlatformAdmin]
    code: 201
    input: [care_program_id, full_name, discipline, home_zip, max_daily_visits, "urgent_response_qualified?"]
    output: Clinician
    side_effects: ["status = ACTIVE", "active_daily_visit_count = 0"]

  - method: GET
    path: "/clinicians"
    description: "List clinicians"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, Clinician]
    code: 200
    input: ["limit?", "offset?", "care_program_id?", "discipline?", "status?"]
    output: "Clinician[]"
    side_effects: []

  - method: GET
    path: "/clinicians/{clinicianId}"
    description: "Get a clinician"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, Clinician]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  # --- Members ---
  - method: POST
    path: "/members"
    description: "Register a member from payer data feed"
    roles: [PlatformAdmin, EngagementSpecialist]
    code: 201
    input: [care_program_id, payer_contract_id, member_external_id, full_name, date_of_birth, address_zip, pcp_provider_id, chronic_condition_codes, prior_ed_visits_12mo, prior_inpatient_admits_12mo]
    output: Member
    side_effects:
      - "burden_score_provisional computed via calculations.chronic_condition_burden_provisional"
      - "risk_tier derived from burden_score_provisional"

  - method: GET
    path: "/members"
    description: "List members"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "care_program_id?", "payer_contract_id?", "pcp_provider_id?", "risk_tier?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/members/{memberId}"
    description: "Get a member"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, Clinician, PerformanceAnalyst]
    code: 200
    input: []
    output: Member
    side_effects: []

  # --- Member Enrollments ---
  - method: POST
    path: "/members/{memberId}/enrollments"
    description: "Create a new enrollment (CREATE-with-supersede; OCC on member)"
    roles: [EngagementSpecialist]
    code: 201
    input: [outreach_channel, expected_member_version]
    output: MemberEnrollment
    side_effects:
      - "status = IDENTIFIED, is_current = true, outreach_attempts = 0"
      - "Any prior MemberEnrollment for this member with is_current == true flips to is_current = false"
      - "increments Member.version by 1"

  - method: GET
    path: "/members/{memberId}/enrollments"
    description: "List enrollments for a member (sub-resource form of reverse-reachability)"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "MemberEnrollment[]"
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "Filtered list of all enrollments"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "member_id?", "status?", "is_current?"]
    output: "MemberEnrollment[]"
    side_effects: []

  - method: GET
    path: "/enrollments/{enrollmentId}"
    description: "Get an enrollment"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, PerformanceAnalyst]
    code: 200
    input: []
    output: MemberEnrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{enrollmentId}/begin-outreach"
    description: "Begin (or resume from DECLINED) outreach"
    roles: [EngagementSpecialist]
    code: 200
    input: []
    output: MemberEnrollment
    side_effects: ["status → OUTREACH; outreach_attempts = 1"]

  - method: POST
    path: "/enrollments/{enrollmentId}/record-attempt"
    description: "Record an outreach attempt (cyclic)"
    roles: [EngagementSpecialist]
    code: 200
    input: []
    output: MemberEnrollment
    side_effects: ["outreach_attempts += 1; auto-DECLINED at MAX_OUTREACH_ATTEMPTS (3)"]

  - method: POST
    path: "/enrollments/{enrollmentId}/record-consent"
    description: "Record member consent"
    roles: [EngagementSpecialist]
    code: 200
    input: [consent_document_id]
    output: MemberEnrollment
    side_effects:
      - "status → CONSENTED, consent_recorded_at = current logical clock"
      - "A new CareTeam is created in DRAFT status"

  - method: POST
    path: "/enrollments/{enrollmentId}/record-decline"
    description: "Record member decline"
    roles: [EngagementSpecialist]
    code: 200
    input: []
    output: MemberEnrollment
    side_effects: ["status → DECLINED"]

  - method: POST
    path: "/enrollments/{enrollmentId}/activate"
    description: "Activate enrollment (requires ACTIVE care team)"
    roles: [EngagementSpecialist]
    code: 200
    input: []
    output: MemberEnrollment
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/enrollments/{enrollmentId}/disenroll"
    description: "Disenroll member (cascades)"
    roles: [EngagementSpecialist]
    code: 200
    input: [disenrollment_reason]
    output: MemberEnrollment
    side_effects:
      - "status → DISENROLLED, is_current = false"
      - "All SCHEDULED Visit children → CANCELLED (cancellation_reason = ENROLLMENT_ENDED); each decrements its clinician.active_daily_visit_count"
      - "CareTeam for this enrollment → RETIRED"

  # --- Care Teams ---
  - method: GET
    path: "/enrollments/{enrollmentId}/care-team"
    description: "Get the care team for an enrollment (1:1 — returns array of length 0 or 1)"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, EngagementSpecialist, PerformanceAnalyst]
    code: 200
    input: []
    output: "CareTeam[]"
    side_effects: []

  - method: PUT
    path: "/enrollments/{enrollmentId}/care-team"
    description: "Assign or update care team members"
    roles: [CareCoordinator]
    code: 200
    input: ["primary_np_id?", "social_worker_id?", "behavioral_clinician_id?"]
    output: CareTeam
    side_effects:
      - "Validates each assigned clinician exists, is ACTIVE, and matches the required discipline"
      - "composition_complete recomputed"

  - method: POST
    path: "/enrollments/{enrollmentId}/care-team/activate"
    description: "Activate the care team"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: CareTeam
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/enrollments/{enrollmentId}/care-team/suspend"
    description: "Suspend the care team"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: CareTeam
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/enrollments/{enrollmentId}/care-team/reinstate"
    description: "Reinstate a suspended care team"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: CareTeam
    side_effects: ["status → ACTIVE"]

  # --- Visits ---
  - method: POST
    path: "/visits"
    description: "Schedule a new visit"
    roles: [CareCoordinator]
    code: 201
    input: [enrollment_id, visit_type, scheduled_start, scheduled_end]
    output: Visit
    side_effects:
      - "Selector runs (calculations.routine_visit_clinician_selector) — clinician_id assigned by server"
      - "status = SCHEDULED"
      - "assigned clinician.active_daily_visit_count += 1"
      - "URGENT visit_type is rejected at this endpoint; use POST /urgent-episodes instead"

  - method: GET
    path: "/visits"
    description: "List visits"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, Clinician, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "enrollment_id?", "member_id?", "clinician_id?", "status?", "visit_type?"]
    output: "Visit[]"
    side_effects: []

  - method: GET
    path: "/visits/{visitId}"
    description: "Get a visit"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, Clinician, PerformanceAnalyst]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/visits/{visitId}/depart"
    description: "Clinician departs for visit (SCHEDULED → EN_ROUTE)"
    roles: [Clinician]
    code: 200
    input: []
    output: Visit
    side_effects: ["status → EN_ROUTE"]

  - method: POST
    path: "/visits/{visitId}/arrive"
    description: "Clinician arrives (EN_ROUTE → IN_PROGRESS)"
    roles: [Clinician]
    code: 200
    input: []
    output: Visit
    side_effects: ["status → IN_PROGRESS", "actual_start = current logical clock"]

  - method: POST
    path: "/visits/{visitId}/assessment"
    description: "Create or update the visit's assessment (DRAFT)"
    roles: [Clinician]
    code: 200
    input: [medication_reconciliation, safety_evaluation, social_needs_screening, pcp_coordination_note]
    output: VisitAssessment
    side_effects: ["VisitAssessment persisted in DRAFT status"]

  - method: GET
    path: "/visits/{visitId}/assessment"
    description: "Get the visit's assessment (1:1 — returns array of length 0 or 1)"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, Clinician, PerformanceAnalyst]
    code: 200
    input: []
    output: "VisitAssessment[]"
    side_effects: []

  - method: POST
    path: "/visits/{visitId}/assessment/submit"
    description: "Submit the assessment (DRAFT → SUBMITTED)"
    roles: [Clinician]
    code: 200
    input: []
    output: VisitAssessment
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/visits/{visitId}/complete"
    description: "Complete the visit (IN_PROGRESS → COMPLETED; deep cascade)"
    roles: [Clinician]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "status → COMPLETED, actual_end = current logical clock"
      - "clinician.active_daily_visit_count -= 1"
      - "VisitAssessment.status → LOCKED"
      - "Member.burden_score_final recomputed (chronic_condition_burden_final)"
      - "Member.risk_tier rederived"
      - "VisitAssessment.pcp_notified = true if the member's PCPProvider.notification_opt_in == true"
      - "PerformanceMeasurement: visits_completed += 1, pcp_coordination_rate, composite_score recomputed"

  - method: POST
    path: "/visits/{visitId}/cancel"
    description: "Cancel a scheduled visit"
    roles: [CareCoordinator]
    code: 200
    input: [cancellation_reason]
    output: Visit
    side_effects:
      - "status → CANCELLED"
      - "clinician.active_daily_visit_count -= 1"
      - "PerformanceMeasurement: visits_cancelled += 1, composite_score recomputed"

  - method: POST
    path: "/visits/{visitId}/reschedule"
    description: "Reschedule a cancelled visit (CANCELLED → SCHEDULED; OCC)"
    roles: [CareCoordinator]
    code: 200
    input: [scheduled_start, scheduled_end, expected_visit_version]
    output: Visit
    side_effects:
      - "status → SCHEDULED, scheduled_start/end updated, reschedule_count += 1"
      - "clinician.active_daily_visit_count += 1"
      - "PerformanceMeasurement: visits_cancelled -= 1, composite_score recomputed"
      - "increments Visit.version by 1"

  - method: POST
    path: "/visits/{visitId}/mark-no-show"
    description: "Mark a scheduled visit as no-show (after scheduled_end)"
    roles: [Clinician]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "status → NO_SHOW"
      - "clinician.active_daily_visit_count -= 1"
      - "PerformanceMeasurement: visits_no_show += 1, composite_score recomputed"

  # --- Urgent Episodes ---
  - method: POST
    path: "/urgent-episodes"
    description: "Trigger a new urgent response episode"
    roles: [CareCoordinator, EngagementSpecialist]
    code: 201
    input: [enrollment_id, trigger_source]
    output: UrgentResponseEpisode
    side_effects:
      - "status = TRIGGERED, triggered_at = current logical clock"
      - "sla_deadline = triggered_at + CareProgram.urgent_response_sla_hours"
      - "PerformanceMeasurement: urgent_episodes_triggered += 1, composite_score recomputed"

  - method: GET
    path: "/urgent-episodes"
    description: "List urgent episodes"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, Clinician, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "enrollment_id?", "member_id?", "dispatched_clinician_id?", "status?"]
    output: "UrgentResponseEpisode[]"
    side_effects: []

  - method: GET
    path: "/urgent-episodes/{episodeId}"
    description: "Get an urgent episode"
    roles: [PlatformAdmin, ContractAdministrator, CareCoordinator, Clinician, PerformanceAnalyst]
    code: 200
    input: []
    output: UrgentResponseEpisode
    side_effects: []

  - method: POST
    path: "/urgent-episodes/{episodeId}/dispatch"
    description: "Dispatch a clinician to an urgent episode"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: UrgentResponseEpisode
    side_effects:
      - "Selector runs (calculations.urgent_clinician_selector) — dispatched_clinician_id assigned"
      - "status → DISPATCHED"
      - "dispatched clinician's active_daily_visit_count += 1"

  - method: POST
    path: "/urgent-episodes/{episodeId}/arrive"
    description: "Mark clinician on scene"
    roles: [Clinician]
    code: 200
    input: []
    output: UrgentResponseEpisode
    side_effects: ["status → ON_SCENE", "on_scene_at = current logical clock", "sla_met computed"]

  - method: POST
    path: "/urgent-episodes/{episodeId}/resolve"
    description: "Resolve an urgent episode"
    roles: [Clinician]
    code: 200
    input: [resolved_outcome]
    output: UrgentResponseEpisode
    side_effects:
      - "status → RESOLVED"
      - "dispatched clinician's active_daily_visit_count -= 1"
      - "If AVOIDED_ED: PerformanceMeasurement.urgent_episodes_avoided_ed += 1"
      - "If sla_met: PerformanceMeasurement.urgent_episodes_sla_met += 1"
      - "If REFERRED_TO_ED: cascade creates a POST_ED_FOLLOWUP Visit (SCHEDULED, window [now, now+72h], assigned to care team primary_np_id)"

  # --- Performance Measurements ---
  - method: GET
    path: "/performance-measurements"
    description: "List performance measurement rows"
    roles: [PlatformAdmin, ContractAdministrator, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "payer_contract_id?", "member_id?", "period_index?"]
    output: "PerformanceMeasurement[]"
    side_effects: []

  - method: GET
    path: "/performance-measurements/{measurementId}"
    description: "Get a single performance measurement"
    roles: [PlatformAdmin, ContractAdministrator, PerformanceAnalyst]
    code: 200
    input: []
    output: PerformanceMeasurement
    side_effects: []

  # --- Settlements ---
  - method: POST
    path: "/payer-contracts/{contractId}/settlements"
    description: "Generate a settlement for the current period"
    roles: [ContractAdministrator]
    code: 201
    input: []
    output: PayerSettlement
    side_effects:
      - "status = PROVISIONAL, period_index = current logical period"
      - "Runs calculations.capitated_settlement_amount OR calculations.shared_savings_settlement_amount based on contract.payment_model"

  - method: GET
    path: "/payer-contracts/{contractId}/settlements"
    description: "List settlements for a contract (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, ContractAdministrator, PerformanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PayerSettlement[]"
    side_effects: []

  - method: GET
    path: "/settlements/{settlementId}"
    description: "Get a settlement"
    roles: [PlatformAdmin, ContractAdministrator, PerformanceAnalyst]
    code: 200
    input: []
    output: PayerSettlement
    side_effects: []

  - method: POST
    path: "/payer-contracts/{contractId}/settlements/{settlementId}/finalize"
    description: "Finalize a settlement"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: PayerSettlement
    side_effects: ["status → FINALIZED", "withhold_released_cents computed", "net_payment_cents finalized"]

  - method: POST
    path: "/payer-contracts/{contractId}/settlements/{settlementId}/mark-paid"
    description: "Mark a finalized settlement paid"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: PayerSettlement
    side_effects: ["status → PAID"]

  - method: POST
    path: "/payer-contracts/{contractId}/settlements/{settlementId}/void"
    description: "Void a provisional settlement"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: PayerSettlement
    side_effects: ["status → VOIDED"]

  # --- Test-driving endpoints (per §1.5 priority ladder, rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary ISO 8601 timestamp. Default at startup is 2026-09-01T00:00:00Z (the server MUST NOT fall back to real wall-clock time before the first call)."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["Logical clock reassigned; downstream SLA/expiry checks read this clock"]

  - method: POST
    path: "/_clock/advance_hours"
    description: "Advance the logical clock by N hours; triggers LAPSED transitions on UrgentResponseEpisode when sla_deadline is crossed"
    roles: [PlatformAdmin]
    code: 200
    input: [by_hours]
    output: null
    side_effects: ["Sweep UrgentResponseEpisodes in TRIGGERED or DISPATCHED whose sla_deadline has passed → LAPSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }

  # --- Not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "CareProgram not found" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "PayerContract not found" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member not found" }
  - { id: ERR_PCP_NOT_FOUND, http: 404, condition: "PCPProvider not found" }
  - { id: ERR_CLINICIAN_NOT_FOUND, http: 404, condition: "Clinician not found" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "MemberEnrollment not found" }
  - { id: ERR_CARE_TEAM_NOT_FOUND, http: 404, condition: "CareTeam not found for this enrollment" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "Visit not found" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "VisitAssessment not found for this visit" }
  - { id: ERR_EPISODE_NOT_FOUND, http: 404, condition: "UrgentResponseEpisode not found" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "PayerSettlement not found" }
  - { id: ERR_MEASUREMENT_NOT_FOUND, http: 404, condition: "PerformanceMeasurement not found" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }
  - { id: ERR_PAYMENT_MODEL_MISMATCH, http: 400, condition: "CAPITATED contract requires pmpm_rate_cents; SHARED_SAVINGS requires shared_savings_baseline_pmpm_cents and shared_savings_split_pct" }
  - { id: ERR_CONSENT_DOCUMENT_REQUIRED, http: 400, condition: "consent_document_id missing at CONSENTED transition" }
  - { id: ERR_DISENROLLMENT_REASON_REQUIRED, http: 400, condition: "disenrollment_reason missing at DISENROLLED transition" }
  - { id: ERR_CANCELLATION_REASON_REQUIRED, http: 400, condition: "cancellation_reason missing at CANCELLED transition" }
  - { id: ERR_RESOLUTION_OUTCOME_REQUIRED, http: 400, condition: "resolved_outcome missing at RESOLVED transition" }
  - { id: ERR_PCP_COORDINATION_NOTE_REQUIRED, http: 400, condition: "pcp_coordination_note empty at visit completion" }
  - { id: ERR_ASSESSMENT_INCOMPLETE, http: 400, condition: "medication_reconciliation, safety_evaluation, or social_needs_screening missing/incomplete at assessment submit" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure" }
  - { id: ERR_ENROLLMENT_NOT_IDENTIFIED, http: 409, condition: "Enrollment must be IDENTIFIED for begin-outreach from initial state" }
  - { id: ERR_ENROLLMENT_NOT_DECLINED, http: 409, condition: "Enrollment must be DECLINED for re-engagement begin-outreach" }
  - { id: ERR_ENROLLMENT_NOT_IN_OUTREACH, http: 409, condition: "Enrollment must be OUTREACH for this transition" }
  - { id: ERR_ENROLLMENT_NOT_CONSENTED, http: 409, condition: "Enrollment must be CONSENTED for activate" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Enrollment must be ACTIVE for this operation" }
  - { id: ERR_ENROLLMENT_SUPERSEDED, http: 409, condition: "MemberEnrollment is_current == false; operation must target the current enrollment" }
  - { id: ERR_OUTREACH_ATTEMPTS_EXHAUSTED, http: 409, condition: "outreach_attempts reached MAX_OUTREACH_ATTEMPTS (3); enrollment auto-declined" }
  - { id: ERR_CARE_TEAM_NOT_DRAFT, http: 409, condition: "CareTeam must be DRAFT for activate" }
  - { id: ERR_CARE_TEAM_NOT_ACTIVE, http: 409, condition: "CareTeam must be ACTIVE for this operation" }
  - { id: ERR_CARE_TEAM_NOT_SUSPENDED, http: 409, condition: "CareTeam must be SUSPENDED for reinstate" }
  - { id: ERR_PRIMARY_NP_INVALID, http: 409, condition: "primary_np_id missing, clinician not ACTIVE, or discipline != NP" }
  - { id: ERR_VISIT_NOT_SCHEDULED, http: 409, condition: "Visit must be SCHEDULED for this transition" }
  - { id: ERR_VISIT_NOT_EN_ROUTE, http: 409, condition: "Visit must be EN_ROUTE for arrive" }
  - { id: ERR_VISIT_NOT_IN_PROGRESS, http: 409, condition: "Visit must be IN_PROGRESS for complete or assessment submission" }
  - { id: ERR_VISIT_NOT_CANCELLABLE, http: 409, condition: "Visit must be SCHEDULED to cancel" }
  - { id: ERR_VISIT_NOT_CANCELLED, http: 409, condition: "Visit must be CANCELLED to reschedule" }
  - { id: ERR_ASSESSMENT_NOT_DRAFT, http: 409, condition: "VisitAssessment must be DRAFT to submit" }
  - { id: ERR_ASSESSMENT_NOT_SUBMITTED, http: 409, condition: "VisitAssessment must be SUBMITTED before visit completion" }
  - { id: ERR_EPISODE_NOT_TRIGGERED, http: 409, condition: "UrgentResponseEpisode must be TRIGGERED for dispatch" }
  - { id: ERR_EPISODE_NOT_DISPATCHED, http: 409, condition: "UrgentResponseEpisode must be DISPATCHED for arrive" }
  - { id: ERR_EPISODE_NOT_ON_SCENE, http: 409, condition: "UrgentResponseEpisode must be ON_SCENE for resolve" }
  - { id: ERR_SETTLEMENT_NOT_PROVISIONAL, http: 409, condition: "PayerSettlement must be PROVISIONAL for finalize or void" }
  - { id: ERR_SETTLEMENT_NOT_FINALIZED, http: 409, condition: "PayerSettlement must be FINALIZED for mark-paid" }

  # --- Authorization/ownership ---
  - { id: ERR_NOT_ASSIGNED_CLINICIAN, http: 403, condition: "Acting clinician's X-User-ID does not match the assigned clinician_id for this visit/episode" }

  # --- Business ---
  - { id: ERR_NO_AVAILABLE_CLINICIAN, http: 409, condition: "Selector returned an empty candidate pool (capacity exhausted or no eligible clinician in geography)" }
  - { id: ERR_VISIT_TIME_OVERLAP, http: 409, condition: "Proposed visit window overlaps another SCHEDULED/EN_ROUTE/IN_PROGRESS visit assigned to the same clinician (half-open interval arithmetic)" }
  - { id: ERR_MAX_RESCHEDULES_EXCEEDED, http: 409, condition: "Visit.reschedule_count reached MAX_RESCHEDULES (2)" }
  - { id: ERR_SLA_ALREADY_LAPSED, http: 409, condition: "Current logical clock is past sla_deadline; dispatch would already be a SLA miss" }
  - { id: ERR_VISIT_WINDOW_NOT_PAST, http: 409, condition: "mark-no-show requires current logical clock >= scheduled_end" }
  - { id: ERR_CONTRACT_EXPIRED, http: 409, condition: "PayerContract has passed contract_expiration_date; finalization forbidden" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version; the client's view is stale" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational administrator for the care program; owns clinician/PCP/member reference data and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /care-programs"
      - "POST /care-programs/{id}/clock/advance"
      - "POST /pcp-providers"
      - "POST /clinicians"
      - "POST /_clock/set_current_utc"
      - "POST /_clock/advance_hours"
    shared_operations:
      - "GET endpoints (shared with most roles)"
      - "POST /members (shared with EngagementSpecialist)"

  - name: ContractAdministrator
    description: "Payer contract owner; manages contracts, medical costs, settlements; reads performance measurements"
    identity: opaque
    exclusive_operations:
      - "POST /payer-contracts"
      - "POST /medical-costs"
      - "POST /payer-contracts/{id}/settlements"
      - "POST /payer-contracts/{id}/settlements/{id}/finalize"
      - "POST /payer-contracts/{id}/settlements/{id}/mark-paid"
      - "POST /payer-contracts/{id}/settlements/{id}/void"
    shared_operations:
      - "GET endpoints (shared)"

  - name: EngagementSpecialist
    description: "Member-facing outreach and consent workflow owner; cannot schedule visits or administer contracts"
    identity: opaque
    exclusive_operations:
      - "POST /members/{id}/enrollments"
      - "POST /enrollments/{id}/begin-outreach"
      - "POST /enrollments/{id}/record-attempt"
      - "POST /enrollments/{id}/record-consent"
      - "POST /enrollments/{id}/record-decline"
      - "POST /enrollments/{id}/activate"
      - "POST /enrollments/{id}/disenroll"
    shared_operations:
      - "POST /members (shared with PlatformAdmin)"
      - "POST /urgent-episodes (shared with CareCoordinator)"
      - "GET endpoints (shared)"

  - name: CareCoordinator
    description: "Care team composition owner and visit scheduler; cannot record consent or complete visits"
    identity: opaque
    exclusive_operations:
      - "PUT /enrollments/{id}/care-team"
      - "POST /enrollments/{id}/care-team/activate"
      - "POST /enrollments/{id}/care-team/suspend"
      - "POST /enrollments/{id}/care-team/reinstate"
      - "POST /visits"
      - "POST /visits/{id}/cancel"
      - "POST /visits/{id}/reschedule"
      - "POST /urgent-episodes/{id}/dispatch"
    shared_operations:
      - "POST /urgent-episodes (shared with EngagementSpecialist)"
      - "GET endpoints (shared)"

  - name: Clinician
    description: "Field clinician (NP, SW, or BH); performs visits and urgent response. Identity-bound to a Clinician entity — X-User-ID must equal Clinician.id"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /visits/{id}/depart"
      - "POST /visits/{id}/arrive"
      - "POST /visits/{id}/assessment"
      - "POST /visits/{id}/assessment/submit"
      - "POST /visits/{id}/complete"
      - "POST /visits/{id}/mark-no-show"
      - "POST /urgent-episodes/{id}/arrive"
      - "POST /urgent-episodes/{id}/resolve"
    shared_operations:
      - "GET endpoints (shared)"

  - name: PerformanceAnalyst
    description: "Read-only consumer of performance measurements and settlements; no write access"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (shared)"
