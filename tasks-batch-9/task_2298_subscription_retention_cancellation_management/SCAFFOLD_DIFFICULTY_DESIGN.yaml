  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_parallel_axes_paused_while_past_due
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.CURRENT_to_PAST_DUE
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.lifecycle_state
          - entities.Subscription.fields.billing_state
        distinguishing_aspect: |
          Subscription carries two independent state dimensions: a PAUSE moves only
          lifecycle_state (ACTIVE -> PAUSED) while a soft decline moves only billing_state
          (CURRENT -> PAST_DUE), so the entity legitimately rests at PAUSED x PAST_DUE, and a
          RESUME returns lifecycle_state to ACTIVE while billing_state and grace_end_at stay untouched.
        test_recipe:
          setup:
            - "CORE exists (4999/2100, max_pause_cycles 3, allowed cadences 2/4/8 weeks)."
            - "Subscriber K subscribed to CORE on 2026-01-10 at 4-week cadence; its signup invoice is OPEN for 4999 cents and next_renewal_at is 2026-02-07."
