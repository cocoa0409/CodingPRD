  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_substantiation_blocks_the_audit_finalization_that_grades_partners
        grounds:
          - state_machines.ImpactAudit.IN_PROGRESS_to_FINALIZED
          - state_machines.MarketingClaim.SUBSTANTIATED_to_OVERSTATED
          - state_machines.ImpactSeason.FROZEN_to_FINALIZED
          - errors[ERR_CLAIM_WINDOW_UNSUBSTANTIATED]
        distinguishing_aspect: "The audit's valid transition to FINALIZED depends on MarketingClaim state rather than on the audit's own fields: while any season claim is OVERSTATED the finalization is refused, and flipping that one claim's state is what makes the identical finalization succeed."
        test_recipe:
          setup:
            - "A season forced FROZEN at 2026-09-01T00:00:00Z with one shipped distribution of 10000 units and an IN_PROGRESS audit."
            - "One claim of 12000 stated units against 11000 substantiated units, placed OVERSTATED by the derive-build carry-forward."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q2", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-08-31T00:00:00Z", freezes_at: "2026-09-01T00:00:00Z" }
