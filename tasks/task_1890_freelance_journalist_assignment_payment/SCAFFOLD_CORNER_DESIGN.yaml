scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: contributor_creation_defaults_and_computed
        claim_type: creation_defaults_computed
        grounds: [entities.Contributor]
        distinguishing_aspect: "POST /contributors applies defaults: status ACTIVE, ytd_gross_cents 0, reportable_threshold_crossed false, backup_withholding_flag false; server-stamped id/created_at/updated_at/version present and client-sent version ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
          trigger:
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "New Nell", email: "nell@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_nell: $.data.id }
          assert:
            - "Contributor.${c_nell}.status == ACTIVE"
            - "Contributor.${c_nell}.ytd_gross_cents == 0"
            - "Contributor.${c_nell}.reportable_threshold_crossed == false"
            - "Contributor.${c_nell}.backup_withholding_flag == false"
            - "Contributor.${c_nell}.version == 1 and id is a bare UUID without type prefix"

      - name: contributor_email_case_insensitive_uniqueness
        claim_type: uniqueness_constraint
        grounds: [entities.Contributor.fields.email, "validations[priority=14]"]
        distinguishing_aspect: "Second POST /contributors reusing the email with different case fails ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["DeskConfig bootstrapped; one contributor with email case@x.com"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Case One", email: "case@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
          trigger:
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Case Two", email: "CASE@x.com", tax_residency: "FOREIGN" }
              as: DeskAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_EMAIL"

      - name: rate_agreement_mode_exclusivity
        claim_type: type_constraints
        grounds: [entities.RateAgreement.fields.pricing_mode, "validations[priority=15]"]
        distinguishing_aspect: "PER_WORD agreement carrying flat_fee_cents too (both rate fields set) fails ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["DeskConfig; contributor exists at version 1"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Mode Max", email: "max@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_max: $.data.id, c_max_v: $.data.version }
          trigger:
            - call: "POST /freelance-desk/contributors/${c_max}/rate-agreements"
              payload: { pricing_mode: "PER_WORD", per_word_rate_cents: 75, flat_fee_cents: 50000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${c_max_v}" }
              as: DeskAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: assignment_min_word_count
        claim_type: type_constraints
        grounds: [entities.Assignment.fields.commissioned_word_count, "validations[priority=15]"]
        distinguishing_aspect: "commissioned_word_count == 99 (< 100 floor) fails ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["DeskConfig; contributor exists"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Word Wendy", email: "wendy@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_wendy: $.data.id }
          trigger:
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_wendy}", title: "t", brief: "b", commissioned_word_count: 99, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: ledger_entry_immutability
        claim_type: immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields false — only id + created_at, no version; no mutation endpoints exist (append-only log); GET list is the only access."
        test_recipe:
          setup: ["DeskConfig; a fully paid invoice so at least one ledger entry exists (reuse batch_release_depth2_cascade path abbreviated: FLAT 50000, W9 verified)"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Ledger Liz", email: "liz@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_liz: $.data.id, c_liz_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${c_liz}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 50000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${c_liz_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors/${c_liz}/tax-documents"
              payload: { doc_kind: "W9", tin_last4: "1212" }
              as: Contributor
              as_user_id: "${c_liz}"
              captures: { doc_liz: $.data.id }
            - call: "POST /freelance-desk/tax-documents/${doc_liz}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_liz}", title: "LS", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_liz: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_liz}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_liz}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${c_liz}"
            - call: "POST /freelance-desk/assignments/${asg_liz}/start"
              payload: {}
              as: Contributor
              as_user_id: "${c_liz}"
            - call: "POST /freelance-desk/assignments/${asg_liz}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_liz}"
            - call: "GET /freelance-desk/assignments/${asg_liz}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_liz1: "$.data[0].id", rep_liz2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_liz1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_liz2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/assignments/${asg_liz}/accept-for-publication"
              payload: { final_word_count: 100 }
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_liz}/invoices"
              payload: { fee_claim_cents: 50000, expense_claim_cents: 0 }
              as: Contributor
              as_user_id: "${c_liz}"
              captures: { inv_liz: $.data.id }
            - call: "POST /freelance-desk/invoices/${inv_liz}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/invoices/${inv_liz}/approve"
              payload: {}
              as: FinanceUser
              as_user_id: "fin-2"
            - call: "POST /freelance-desk/payment-batches"
              payload: { scheduled_pay_date: "2026-08-20T00:00:00Z" }
              as: FinanceUser
              captures: { batch_liz: $.data.id }
            - call: "POST /freelance-desk/payment-batches/${batch_liz}/add-invoice"
              payload: { invoice_id: "${inv_liz}" }
              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/payment-batches/${batch_liz}/lock"
              payload: {}
              as: FinanceUser
              as_user_id: "fin-1"
              captures: { batch_liz_v: $.data.version }
            - call: "POST /freelance-desk/payment-batches/${batch_liz}/release"
              payload: { expected_batch_version: "${batch_liz_v}" }
              as: FinanceUser
              as_user_id: "fin-2"
          trigger:
            - call: "GET /freelance-desk/contributors/${c_liz}/ledger-entries"
              payload: {}
              as: FinanceUser
              captures: { entry0: "$.data[0]" }
          assert:
            - "each returned LedgerEntry has id and created_at but no version or updated_at field"
            - "LedgerEntry.entry_kind IN {FEE_CREDIT, WITHHOLDING_DEBIT} with amounts 50000 and 0"
            - "LedgerEntry.posted_at is server-stamped (equals logical clock at release)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: contributor_terminated_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Contributor]
        distinguishing_aspect: "From TERMINATED no transitions exist: suspend and terminate both fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["DeskConfig; contributor terminated (ACTIVE -> TERMINATED)"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Term Tom", email: "tom@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_tom: $.data.id }
            - call: "POST /freelance-desk/contributors/${c_tom}/terminate"
              payload: {}
              as: DeskAdmin
          trigger:
            - call: "POST /freelance-desk/contributors/${c_tom}/suspend"
              payload: {}
              as: DeskAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: expense_decide_on_already_decided_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ExpenseClaim]
        distinguishing_aspect: "decide on a REJECTED (terminal) expense claim fails ERR_INVALID_STATE; idempotency violation (double decision) is rejected, not silently re-applied."
        test_recipe:
          setup: ["DeskConfig; contributor + FLAT agreement; assignment OFFERED; expense claim decided REJECT"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Exp Eve", email: "eve@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_eve: $.data.id, c_eve_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${c_eve}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 50000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${c_eve_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_eve}", title: "ES", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_eve: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_eve}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_eve}/expense-claims"
              payload: { category: "MEALS", requested_cents: 3000 }
              as: Contributor
              as_user_id: "${c_eve}"
              captures: { exp_eve: $.data.id }
            - call: "POST /freelance-desk/expense-claims/${exp_eve}/decide"
              payload: { decision: "REJECT" }
              as: Editor
          trigger:
            - call: "POST /freelance-desk/expense-claims/${exp_eve}/decide"
              payload: { decision: "APPROVE" }
              as: Editor
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "ExpenseClaim.${exp_eve}.status remains REJECTED"

      - name: assignment_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Assignment]
        distinguishing_aspect: "Newly created assignment starts at editorial_status DRAFT, payment_status UNINVOICED, agreed_fee_cents 0, final_fee_cents null, verification_cleared false, late_flag false."
        test_recipe:
          setup: ["DeskConfig; contributor exists"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Init Ivy", email: "ivy@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_ivy: $.data.id }
          trigger:
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_ivy}", title: "IS", brief: "b", commissioned_word_count: 500, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_ivy: $.data.id, asg_ivy_ed: $.data.editorial_status }
          assert:
            - "Assignment.${asg_ivy}.editorial_status == DRAFT"
            - "Assignment.${asg_ivy}.payment_status == UNINVOICED"
            - "Assignment.${asg_ivy}.agreed_fee_cents == 0 and final_fee_cents is null"
            - "Assignment.${asg_ivy}.late_flag == false and verification_cleared == false"

      - name: kill_from_terminal_rejected_after_flag_fails
        claim_type: invalid_transition
        grounds: [state_machines.Assignment]
        distinguishing_aspect: "Kill on REJECTED_AFTER_FLAG (terminal) fails ERR_INVALID_STATE; confirmed-violation assignments cannot also be killed for a fee."
        test_recipe:
          setup: ["DeskConfig; contributor with agreement; assignment driven UNDER_VERIFICATION, AI report FLAGGED then CONFIRMED_VIOLATION"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Term Ted", email: "ted@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_ted: $.data.id, c_ted_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${c_ted}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 50000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${c_ted_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_ted}", title: "TS", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_ted: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_ted}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_ted}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${c_ted}"
            - call: "POST /freelance-desk/assignments/${asg_ted}/start"
              payload: {}
              as: Contributor
              as_user_id: "${c_ted}"
            - call: "POST /freelance-desk/assignments/${asg_ted}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_ted}"
            - call: "GET /freelance-desk/assignments/${asg_ted}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_ted_ai: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_ted_ai}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 9000 }
              as: VerificationEditor
              as_user_id: "ve-rec"
            - call: "POST /freelance-desk/verification-reports/${rep_ted_ai}/adjudicate"
              payload: { outcome: "CONFIRMED_VIOLATION", adjudication_note: "confirmed" }
              as: VerificationEditor
              as_user_id: "ve-adj"
          trigger:
            - call: "POST /freelance-desk/assignments/${asg_ted}/kill"
              payload: {}
              as: Editor
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: tax_document_expiry_sweep
        claim_type: valid_transition
        grounds: [state_machines.TaxDocument.VERIFIED_to_EXPIRED, calculations.withholding_computation]
        distinguishing_aspect: "Advancing the logical clock past expires_at flips VERIFIED -> EXPIRED via the clock sweep; a subsequent invoice verification then withholds at the punitive branch (foreign statutory 30% instead of treaty 10%)."
        test_recipe:
          setup:
            - "DeskConfig defaults; FOREIGN contributor E with VERIFIED W8BEN (JP) submitted at 2026-08-01 (expires 2029-07-27 approx, 1095 days)"
            - "FLAT 100000 agreement; assignment accepted-for-publication; invoice SUBMITTED"
            - "clock advanced past expiry before invoice verify"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Expiry Eli", email: "eli@x.com", tax_residency: "FOREIGN" }
              as: DeskAdmin
              captures: { c_eli: $.data.id, c_eli_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${c_eli}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 100000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${c_eli_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors/${c_eli}/tax-documents"
              payload: { doc_kind: "W8BEN", treaty_country: "JP", tin_last4: "6666" }
              as: Contributor
              as_user_id: "${c_eli}"
              captures: { doc_eli: $.data.id }
            - call: "POST /freelance-desk/tax-documents/${doc_eli}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_eli}", title: "ES", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_eli: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_eli}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_eli}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${c_eli}"
            - call: "POST /freelance-desk/assignments/${asg_eli}/start"
              payload: {}
              as: Contributor
              as_user_id: "${c_eli}"
            - call: "POST /freelance-desk/assignments/${asg_eli}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_eli}"
            - call: "GET /freelance-desk/assignments/${asg_eli}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_eli1: "$.data[0].id", rep_eli2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_eli1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_eli2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/assignments/${asg_eli}/accept-for-publication"
              payload: { final_word_count: 100 }
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_eli}/invoices"
              payload: { fee_claim_cents: 100000, expense_claim_cents: 0 }
              as: Contributor
              as_user_id: "${c_eli}"
              captures: { inv_eli: $.data.id }
            - call: "POST /freelance-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-01T00:00:00Z" }
              as: DeskAdmin
          trigger:
            - call: "POST /freelance-desk/invoices/${inv_eli}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
              captures: { eli_wh: $.data.withholding_cents }
          assert:
            - "TaxDocument.${doc_eli}.status == EXPIRED (clock sweep on set_current_utc)"
            - "Invoice.${inv_eli}.withholding_cents == 30000 (statutory 30%, treaty doc expired)"

      - name: desk_config_double_bootstrap_rejected
        claim_type: invalid_transition
        grounds: ["errors[ERR_INVALID_STATE]", endpoints]
        distinguishing_aspect: "POST /desk-config a second time fails ERR_INVALID_STATE (singleton already initialized)."
        test_recipe:
          setup: ["DeskConfig already bootstrapped"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
          trigger:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: per_word_accepted_final_count_basis
        claim_type: variant_selection
        grounds: [calculations.assignment_fee_due]
        distinguishing_aspect: "Accepted-variant on PER_WORD uses final_word_count: 1400 final words at 75 c/word -> final_fee_cents 105000 even though agreed (commissioned 1200) was 90000."
        test_recipe:
          setup: ["DeskConfig; PER_WORD contributor (75 c/word, commissioned 1200); assignment UNDER_VERIFICATION with reports cleared"]
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Final Fay", email: "fay@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { c_fay: $.data.id, c_fay_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${c_fay}/rate-agreements"
              payload: { pricing_mode: "PER_WORD", per_word_rate_cents: 75, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${c_fay_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${c_fay}", title: "FS", brief: "b", commissioned_word_count: 1200, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_fay: $.data.id }
