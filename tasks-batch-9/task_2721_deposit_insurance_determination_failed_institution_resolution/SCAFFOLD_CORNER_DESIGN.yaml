            - "trigger[2]: 1 row, total_count == 1, \"$.data[0].id\" == '${fa_acct1_id}'"
            - "trigger[3]: 1 row, total_count == 1, \"$.data[0].id\" == '${fa_acct2_id}', \"$.data[0].insurance_status\" == 'PENDING'"
            - "trigger[4]: 1 row, total_count == 1, \"$.data[0].id\" == '${fa_acct2_id}' — the two dimensions intersect"
            - "trigger[5]: HTTP 200 with 0 rows, total_count == 0 — a valid enum member with no matches is an empty page, not an error"
            - "trigger[6]: 1 row, total_count == 2, has_more == false — the award never ran, so both accounts are still transition_status PENDING"

      - name: ownership_interests_are_readable_from_both_sides_of_the_junction
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /deposit-accounts/{id}/ownership-interests]
          - endpoints[GET /depositor-records/{id}/ownership-interests]
          - entities.OwnershipInterest.fields.interest_role
        distinguishing_aspect: "OwnershipInterest is a many-to-many junction with no version field, so the same three rows must be reachable from the account side (2 CO_OWNER rows on the joint account, 1 BENEFICIARY row on the trust account) and from the depositor side (Ilya holds 1 CO_OWNER row plus 1 BENEFICIARY row across two different accounts), and the interest_role filter narrows each view independently."
        test_recipe:
          setup:
            - "Institution 61071 is in PRE_FAILURE_MONITORING with three depositors: Ilya, Jun and the trust grantor Kemal."
            - "account JN-0001 is JOINT 12000000 titled to Kemal, carrying CO_OWNER rows Ilya 6000 bps and Jun 4000 bps (deliberately summing to 10000 so a later prepare would pass)."
            - "account TR-0001 is REVOCABLE_TRUST 8000000 titled to Kemal, carrying a single BENEFICIARY row for Ilya at 10000 bps."
            - "no determination is run — this instance is purely about junction readability."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61071", legal_name: "Junction Read Bank", charter_state: "OR", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 9000000 }
              as: ClosingManager
              captures: { jr_inst_id: $.data.id }
            - call: "POST /institutions/${jr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-JR-1", legal_name: "Ilya Volkov", depositor_type: "NATURAL_PERSON", contact_email: "ilya@example.com" }
              as: ClaimsAgent
              captures: { jr_ilya_id: $.data.id }
            - call: "POST /institutions/${jr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-JR-2", legal_name: "Jun Park", depositor_type: "NATURAL_PERSON", contact_email: "jun@example.com" }
              as: ClaimsAgent
              captures: { jr_jun_id: $.data.id }
            - call: "POST /institutions/${jr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-JR-3", legal_name: "Kemal Aslan", depositor_type: "NATURAL_PERSON", contact_email: "kemal@example.com" }
              as: ClaimsAgent
              captures: { jr_kemal_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${jr_inst_id}", primary_depositor_id: "${jr_kemal_id}", account_number: "JN-0001", ownership_category: "JOINT", balance_cents: 12000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { jr_joint_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${jr_inst_id}", primary_depositor_id: "${jr_kemal_id}", account_number: "TR-0001", ownership_category: "REVOCABLE_TRUST", balance_cents: 8000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { jr_trust_id: $.data.id }
            - call: "POST /deposit-accounts/${jr_joint_id}/ownership-interests"
              payload: { depositor_record_id: "${jr_ilya_id}", interest_role: "CO_OWNER", designated_share_bps: 6000 }
              as: ClaimsAgent
            - call: "POST /deposit-accounts/${jr_joint_id}/ownership-interests"
              payload: { depositor_record_id: "${jr_jun_id}", interest_role: "CO_OWNER", designated_share_bps: 4000 }
              as: ClaimsAgent
            - call: "POST /deposit-accounts/${jr_trust_id}/ownership-interests"
              payload: { depositor_record_id: "${jr_ilya_id}", interest_role: "BENEFICIARY", designated_share_bps: 10000 }
              as: ClaimsAgent
          trigger:
            - call: "GET /deposit-accounts/${jr_joint_id}/ownership-interests"
              as: ClaimsAgent
            - call: "GET /deposit-accounts/${jr_joint_id}/ownership-interests"
              payload: { interest_role: "BENEFICIARY" }
              as: ClaimsAgent
            - call: "GET /depositor-records/${jr_ilya_id}/ownership-interests"
              as: ClaimsAgent
            - call: "GET /depositor-records/${jr_ilya_id}/ownership-interests"
              payload: { interest_role: "CO_OWNER" }
              as: ClaimsAgent
            - call: "GET /depositor-records/${jr_jun_id}/ownership-interests"
              as: ClaimsAgent
            - call: "GET /deposit-accounts/${jr_joint_id}"
              as: ClaimsAgent
          assert:
            - "trigger[0]: 2 rows, total_count == 2, both interest_role == 'CO_OWNER', designated_share_bps values are 6000 and 4000, and no row carries a version field (OwnershipInterest has common_fields false)"
            - "trigger[1]: 0 rows, total_count == 0 — the joint account holds no beneficiary rows"
            - "trigger[2]: 2 rows, total_count == 2 — Ilya's CO_OWNER row on JN-0001 and BENEFICIARY row on TR-0001, i.e. the junction is readable from the depositor side too"
            - "trigger[3]: 1 row, total_count == 1, that row's deposit_account_id == '${jr_joint_id}'"
            - "trigger[4]: 1 row, total_count == 1, that row's designated_share_bps == 4000"
            - "trigger[5]: version == 3 — the account was created at version 1 and each of the two ownership-interest inserts incremented the parent account's version"

      - name: bid_withdrawal_frees_its_data_room_interval_for_a_later_bidder
        claim_type: conditional_action
        grounds:
          - endpoints[POST /bids/{id}/withdraw]
          - validations[priority=65]
          - state_machines.Bid.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: "The data-room conflict scan only considers Bid rows in {SUBMITTED, CONFORMING, NON_CONFORMING, WINNER, REJECTED}, so Lena's overlapping [09:30, 10:30] request is ERR_DATA_ROOM_WINDOW_CONFLICT (409) while Marcus's bid is SUBMITTED, and the identical request succeeds unchanged once Marcus withdraws — the freed interval is a side effect of the withdraw endpoint, not of any state change on the institution."
        test_recipe:
          setup:
            - "Institution 61072 is CLOSED_IN_RECEIVERSHIP with franchise_marketing_status OPEN and bid_deadline_at 2026-08-12T00:00:00Z."
            - "two QUALIFIED bidders exist: Marcus Trust (62011) and Lena Federal (62012)."
            - "Marcus submitted a WHOLE_BANK_PA bid reserving the data room for [2026-08-06T09:00:00Z, 2026-08-06T10:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61072", legal_name: "Data Room Bank", charter_state: "NV", book_asset_value_cents: 12000000, estimated_liquidation_recovery_cents: 5000000 }
              as: ClosingManager
              captures: { dr_inst_id: $.data.id }
            - call: "POST /institutions/${dr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-DR-1", legal_name: "Nadia Haddad", depositor_type: "NATURAL_PERSON", contact_email: "nadia@example.com" }
              as: ClaimsAgent
              captures: { dr_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${dr_inst_id}", primary_depositor_id: "${dr_dep_id}", account_number: "DR-0001", ownership_category: "SINGLE", balance_cents: 8000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${dr_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 8000000 }
              as: ClosingManager
              captures: { dr_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${dr_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${dr_inst_id}/close"
              as: ClosingManager
            - call: "POST /institutions/${dr_inst_id}/franchise-marketing"
              payload: { marketing_action: "OPEN", bid_deadline_at: "2026-08-12T00:00:00Z" }
              as: ResolutionAnalyst
            - call: "POST /bidders"
              payload: { legal_name: "Marcus Trust", cert_number: "62011", tier1_capital_ratio_bps: 1800, camels_composite: 2 }
              as: ResolutionAnalyst
              captures: { dr_marcus_id: $.data.id }
            - call: "POST /bidders/${dr_marcus_id}/qualification"
              payload: { decision: "QUALIFY" }
              as: ResolutionAnalyst
            - call: "POST /bidders"
              payload: { legal_name: "Lena Federal", cert_number: "62012", tier1_capital_ratio_bps: 2400, camels_composite: 1 }
              as: ResolutionAnalyst
              captures: { dr_lena_id: $.data.id }
            - call: "POST /bidders/${dr_lena_id}/qualification"
              payload: { decision: "QUALIFY" }
              as: ResolutionAnalyst
            - call: "POST /bids"
              payload: { institution_id: "${dr_inst_id}", bidder_id: "${dr_marcus_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 150, asset_discount_bps: 1000, asset_retention_pool_cents: 0, data_room_window_start: "2026-08-06T09:00:00Z", data_room_window_end: "2026-08-06T10:00:00Z" }
              as: Bidder
              as_user_id: "${dr_marcus_id}"
              captures: { dr_marcus_bid_id: $.data.id }
          trigger:
            - call: "POST /bids"
              payload: { institution_id: "${dr_inst_id}", bidder_id: "${dr_lena_id}", structure: "INSURED_DEPOSITS_ONLY_PA", deposit_premium_bps: 200, asset_discount_bps: 1200, asset_retention_pool_cents: 0, data_room_window_start: "2026-08-06T09:30:00Z", data_room_window_end: "2026-08-06T10:30:00Z" }
              as: Bidder
              as_user_id: "${dr_lena_id}"
              captures: { dr_conflict_err: $.data.error_id }
            - call: "POST /bids/${dr_marcus_bid_id}/withdraw"
              as: Bidder
              as_user_id: "${dr_marcus_id}"
            - call: "POST /bids"
              payload: { institution_id: "${dr_inst_id}", bidder_id: "${dr_lena_id}", structure: "INSURED_DEPOSITS_ONLY_PA", deposit_premium_bps: 200, asset_discount_bps: 1200, asset_retention_pool_cents: 0, data_room_window_start: "2026-08-06T09:30:00Z", data_room_window_end: "2026-08-06T10:30:00Z" }
              as: Bidder
              as_user_id: "${dr_lena_id}"
              captures: { dr_lena_bid_id: $.data.id }
            - call: "POST /bids/${dr_marcus_bid_id}/withdraw"
              as: Bidder
              as_user_id: "${dr_marcus_id}"
              captures: { dr_withdraw_err: $.data.error_id }
            - call: "GET /bids"
              payload: { institution_id: "${dr_inst_id}", status: "WITHDRAWN" }
              as: ResolutionAnalyst
          assert:
            - "trigger[0]: HTTP 409, data.error_id == 'ERR_DATA_ROOM_WINDOW_CONFLICT'"
            - "trigger[1]: HTTP 200, status == 'WITHDRAWN'"
            - "trigger[2]: HTTP 201, status == 'SUBMITTED', bidder_id == '${dr_lena_id}' — the freed interval is now reservable"
            - "trigger[3]: HTTP 409, data.error_id == 'ERR_BID_NOT_WITHDRAWABLE' — withdraw is not idempotent"
            - "trigger[4]: 1 row, total_count == 1, \"$.data[0].id\" == '${dr_marcus_bid_id}'"

