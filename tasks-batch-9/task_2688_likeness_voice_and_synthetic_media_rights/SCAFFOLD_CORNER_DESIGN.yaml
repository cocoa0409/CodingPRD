      - name: union_topup_side_effect_is_conditional_on_the_floor
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: union_floor_equality_produces_no_topup_entry
          rationale: >-
            The countersign transition's side effect list is conditional — the UNION_TOPUP compensation
            row is appended only when the union floor strictly exceeds the scaled amount. §1.8 already
            drives the three-way equality boundary (fee at, one cent below, and well below the floor)
            and asserts the exact entry counts, so a separate breadth instance would restate it.

      - name: revocation_cascade_reaches_the_removal_obligation
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: consent_revoke_five_hop_cascade_to_removal_obligation
          rationale: >-
            The full inclusion-side depth chain grant -> replica -> performance -> license -> removal
            obligation -> talent counters is the §1.8 transitive_cascade instance, asserted hop by hop
            at depth five. The breadth walk keeps only the conditional-cascade complement above.

      - name: death_record_adjusts_dependent_entities
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: death_record_three_hop_cascade_to_restricted_posture
          rationale: >-
            Recording a death mutates the Talent, then the EstateAuthority requirement on every open
            grant, then the derived rights_posture. §1.8 asserts each hop's fields including
            postmortem_rights_until, so the cross-entity row is covered there.

      - name: grant_and_talent_ledgers_track_every_compensation_row
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: ledger_sum_restored_after_provisional_accrual_is_reversed
          rationale: >-
            ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents are the two
            ancestor ledgers kept in step with the append-only entry list. §1.8's compensating_invariant
            instance reconciles both before, during and after a reversal.

      - name: legal_hold_release_reverses_its_own_side_effects
        claim_type: compensation
        excluded_because:
          difficulty_instance: legal_hold_counters_restored_while_removal_obligations_persist
          rationale: >-
            Placing and releasing a legal hold must leave legal_hold_asset_count and the asset's purge
            schedule exactly as they were, without disturbing the unrelated open removal obligations.
            §1.8 asserts the full before/after equality including the untouched counter.

      - name: replica_approval_is_guarded_by_the_grant_state
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: replica_approval_gated_on_consent_grant_status
          rationale: >-
            BUILT -> APPROVED_FOR_USE is guarded by the parent grant being ACTIVE, and §1.8 sweeps the
            guard across PENDING_COUNTERSIGN, SUSPENDED, EXPIRED and REVOKED parents while holding the
            replica's own state fixed.

      - name: revision_loop_has_a_termination_condition
        claim_type: cyclic
        excluded_because:
          difficulty_instance: performance_revision_cycle_terminates_at_round_cap
          rationale: >-
            GeneratedPerformance cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED and the loop
            must stop at MAX_REVISION_ROUNDS. §1.8 walks every round to the cap and asserts the
            terminal refusal, which is exactly this row's claim.

      - name: asset_purge_is_guarded_by_the_bound_replica
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: asset_purge_gated_on_bound_replica_status
          rationale: >-
            The second cross-entity guard — a source asset cannot be purged while any replica built
            from it is still usable — is asserted in §1.8 across the replica's states, including the
            retirement that unblocks the purge.

  - section: calculations
    instances:
      - name: retention_deadline_takes_the_earlier_of_statute_and_consent_end_plus_grace
        claim_type: correct_result
        grounds: [calculations.biometric_retention_deadline, entities.BiometricAsset.retention_until]
        distinguishing_aspect: >-
          The formula is a min() of two independently computed dates, so a single asset cannot show
          which arm won. Three assets are captured at the same clock — one where the statutory arm is
          earlier, one where consent-end-plus-grace is earlier, and one under a shorter statute in a
          second state — pinning both arms and the +7 day purge grace.
        test_recipe:
          setup:
            - "CA profile (365 statutory days, 30 grace) and NY profile (180 statutory days, 15 grace)"
            - "CA talent with a long grant (to 2027-08-01) and a short grant (to 2026-10-01); NY talent with a long grant"
