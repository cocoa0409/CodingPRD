# =============================================================================
# Scaffold: Debt Collection Agency (FDCPA) — Expert tier
# =============================================================================

scenario: |
  Debt Collection Agency (FDCPA): account placement & validation notice, consumer
  dispute & cease-communication, call-attempt cadence & time-of-day rules, payment
  plan & settlement (% offer), skip-tracing, statute-of-limitations & re-aging
  guardrail, credit-bureau furnish/dispute, recall/close & commission.

domain_name: debt-collection-agency
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit            # FDCPA regulatory gating with audit trail
  secondary_archetype: ledger_reconciliation     # commission GROSS vs NET; balance vs amount_collected
  complexity_layers:
    - cascading_side_effects        # recall → arrangement → payment → ledger
    - dual_variant_calculation      # commission GROSS/NET; payoff as-of-date variants
    - rate_threshold_triggers       # 7-in-7 cadence; 30-day validation window; SOL
    - derived_field_reconciliation  # balance_cents / amount_collected_cents / attempts_in_window_count

  entity_topology: flat
  # Peer entities linked by foreign keys (Creditor, Consumer, Account, and satellites);
  # no deep URL nesting — children carry account_id / consumer_id FKs and are reached
  # via filtered-list GETs.

  state_machine_shape: parallel
  # Account carries TWO independent state dimensions: work_status (placement lifecycle)
  # and contact_status (FDCPA communication posture). Dispute is cyclic (reopen loop).
  # PaymentArrangement is branching (PROPOSED → {ACCEPTED, REJECTED, COUNTERED}).

  relationship_patterns:
    - one_to_many        # Account → CommunicationAttempt, Dispute, PaymentArrangement, Payment
    - cross_aggregate    # BureauFurnishing/BureauDispute reference Account + Dispute across boundaries
    - flat_fk            # Account → Creditor, Consumer

  role_model: peer_roles
  # Creditor owns placement/recall; Collector works accounts (calls, arrangements);
  # ComplianceOfficer owns disputes/cease/furnishing; BureauOperator owns e-OSCAR;
  # System runs clock-driven sweeps.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Creditor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Original/owning creditor name" }
      - { name: commission_basis, type: enum, source: input, default: "GROSS_OF_FEES", description: "Commission variant for this creditor's accounts; one of GROSS_OF_FEES | NET_OF_FEES" }
      - { name: commission_rate_bps, type: integer, source: input, description: "Contingency commission rate in basis points (e.g., 2500 = 25.00%); 0..10000" }
      - { name: expense_recovery_cents, type: integer, source: input, default: 0, description: "Per-account agency expenses deducted before commission under NET_OF_FEES" }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consumer/debtor full name" }
      - { name: timezone_offset_minutes, type: integer, source: input, default: 0, description: "Consumer local-time offset from UTC in minutes (e.g., -300 for US Eastern standard); used for the 8am-9pm call window" }
      - { name: phone, type: string, source: input, required: false, description: "Best-known phone number; may be updated by skip-trace" }
      - { name: address, type: string, source: input, required: false, description: "Best-known mailing address; may be updated by skip-trace" }
      - { name: contactability, type: enum, source: system, default: "UNKNOWN", description: "UNKNOWN | LOCATED | UNLOCATABLE; set by skip-trace outcomes" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: creditor_id, type: string, source: input, description: "FK -> Creditor.id; owning creditor that placed this debt" }
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; the debtor" }
      - { name: original_principal_cents, type: integer, source: input, description: "Principal balance at placement; > 0" }
      - { name: balance_cents, type: integer, source: computed, description: "Current outstanding balance = original_principal_cents - amount_collected_cents - amount_settled_forgiven_cents" }
      - { name: amount_collected_cents, type: integer, source: computed, default: 0, description: "Sum of POSTED Payment.amount_cents on this account" }
      - { name: amount_settled_forgiven_cents, type: integer, source: computed, default: 0, description: "Principal forgiven by an ACCEPTED+FULFILLED settlement arrangement" }
      - { name: charge_off_date, type: datetime, source: input, description: "Date the original creditor charged off the debt (ISO 8601)" }
      - { name: last_payment_date, type: datetime, source: system, required: false, description: "Date of most recent POSTED payment; null if none; never written backward by re-aging" }
      - { name: sol_years, type: integer, source: input, description: "Statute-of-limitations length in whole years for this debt's jurisdiction; > 0" }
      - { name: sol_anchor_basis, type: enum, source: input, default: "CHARGE_OFF", description: "Which anchor starts the SOL clock: CHARGE_OFF | LAST_PAYMENT" }
      - { name: placement_date, type: datetime, source: system, description: "UTC timestamp account was placed (clock value at placement)" }
      - { name: validation_notice_sent_at, type: datetime, source: system, required: false, description: "UTC timestamp the §1692g validation notice was sent; null until sent" }
      - { name: validation_deadline, type: datetime, source: computed, required: false, description: "validation_notice_sent_at + 30 days; consumer dispute window closes at this instant (exclusive)" }
      - { name: work_status, type: enum, source: system, default: "PLACED", description: "Placement lifecycle: PLACED | VALIDATION_SENT | WORKING | RECALLED | CLOSED_PAID | CLOSED_UNCOLLECTIBLE" }
      - { name: contact_status, type: enum, source: system, default: "PRE_VALIDATION", description: "FDCPA communication posture (parallel dimension): PRE_VALIDATION | CONTACTABLE | VALIDATION_HELD | CEASED" }
      - { name: attempts_in_window_count, type: integer, source: computed, default: 0, description: "Count of CommunicationAttempt with outcome in {LOGGED, CONVERSATION} on this account whose attempted_at falls in the trailing 7-day window ending at the clock" }
      - { name: last_conversation_at, type: datetime, source: system, required: false, description: "attempted_at of the most recent CONVERSATION-outcome attempt; anchors the 7-day post-conversation cooldown; null if none" }
      - { name: commission_earned_cents, type: integer, source: computed, default: 0, description: "Commission earned to date per the creditor's commission_basis variant" }
      - { name: time_barred, type: boolean, source: computed, default: false, description: "True when the clock is at/after the SOL expiry instant derived from sol_anchor_basis" }

  - name: CommunicationAttempt
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account being contacted" }
      - { name: channel, type: enum, source: input, description: "PHONE | LETTER | EMAIL" }
      - { name: attempted_at, type: datetime, source: input, description: "UTC timestamp of the contact attempt; must be <= clock" }
      - { name: outcome, type: enum, source: input, description: "LOGGED (attempt, no answer) | CONVERSATION (spoke with consumer) | CANCELLED (scheduled then voided by cascade)" }
      - { name: counts_toward_cadence, type: boolean, source: computed, default: true, description: "Whether this attempt counts toward the 7-in-7 cadence cap; true for PHONE LOGGED/CONVERSATION, false for LETTER/EMAIL and CANCELLED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; disputed account" }
      - { name: dispute_type, type: enum, source: input, description: "VALIDATION (§1692g verification request) | ACCURACY (balance/ownership challenge)" }
      - { name: raised_at, type: datetime, source: system, description: "UTC timestamp dispute was raised (clock value)" }
      - { name: within_validation_window, type: boolean, source: computed, description: "True if raised_at < account.validation_deadline; a VALIDATION dispute inside the window holds collection" }
      - { name: resolution, type: enum, source: system, required: false, description: "VERIFIED | DELETED | null while open; VERIFIED resumes collection, DELETED closes account uncollectible" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | INVESTIGATING | RESOLVED | REOPENED" }

  - name: PaymentArrangement
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account the arrangement settles" }
      - { name: arrangement_type, type: enum, source: input, description: "PLAN (installments at full balance) | SETTLEMENT (lump or terms at a % of balance)" }
      - { name: offer_pct_bps, type: integer, source: input, required: false, description: "Settlement offer as basis points of balance_cents (e.g., 6000 = 60.00%); required for SETTLEMENT, ignored for PLAN; 1..10000" }
      - { name: settlement_amount_cents, type: integer, source: computed, required: false, description: "round_half_up(balance_cents * offer_pct_bps / 10000) at acceptance; the amount that fully satisfies the debt" }
      - { name: installment_count, type: integer, source: input, default: 1, description: "Number of installments; >= 1" }
      - { name: good_through, type: datetime, source: input, required: false, description: "Offer good-through date; payoff accrues admin fee per day between quote and this date" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | ACCEPTED | COUNTERED | REJECTED | FULFILLED | CANCELLED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account credited" }
      - { name: arrangement_id, type: string, source: input, required: false, description: "FK -> PaymentArrangement.id; optional arrangement this payment fulfills" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; > 0" }
      - { name: posted_at, type: datetime, source: system, description: "UTC timestamp the payment posted (clock value)" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REVERSED | VOIDED" }

  - name: SkipTrace
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; consumer being located" }
      - { name: result, type: enum, source: input, description: "LOCATED | NOT_FOUND" }
      - { name: new_phone, type: string, source: input, required: false, description: "Updated phone when LOCATED" }
      - { name: new_address, type: string, source: input, required: false, description: "Updated address when LOCATED" }

  - name: BureauFurnishing
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account whose tradeline is furnished" }
      - { name: bureau, type: enum, source: input, description: "EQUIFAX | EXPERIAN | TRANSUNION" }
      - { name: furnished_balance_cents, type: integer, source: system, description: "account.balance_cents captured at furnish time" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED | UPDATED | DELETED" }

  - name: BureauDispute
    parent: null
    common_fields: true
    fields:
      - { name: furnishing_id, type: string, source: input, description: "FK -> BureauFurnishing.id; the tradeline under e-OSCAR dispute" }
      - { name: opened_at, type: datetime, source: system, description: "UTC timestamp the e-OSCAR ACDV was opened (clock value)" }
      - { name: investigation_deadline, type: datetime, source: computed, description: "opened_at + 30 days; furnisher response due (exclusive)" }
      - { name: outcome, type: enum, source: system, required: false, description: "VERIFIED | CORRECTED | DELETED | null while open" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RESOLVED | REOPENED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- Account: work_status (placement lifecycle dimension) ----
  - entity: Account
    initial_state: PLACED
    terminal_states: [CLOSED_PAID, CLOSED_UNCOLLECTIBLE]
    note: "work_status is ONE of two parallel dimensions on Account; contact_status (below) evolves independently."
    transitions:
      - from: PLACED
        to: VALIDATION_SENT
        trigger: "POST /accounts/{id}/send-validation-notice"
        actor: Collector
        preconditions:
          - "validation_notice_sent_at is null (ERR_VALIDATION_ALREADY_SENT)"
        side_effects:
          - "validation_notice_sent_at = clock"
          - "validation_deadline = clock + 30 days"
          - "contact_status: PRE_VALIDATION -> CONTACTABLE"

      - from: VALIDATION_SENT
        to: WORKING
        trigger: "POST /accounts/{id}/begin-work"
        actor: Collector
        preconditions:
          - "contact_status != CEASED (ERR_CEASE_COMMUNICATION)"
          - "No OPEN/INVESTIGATING/REOPENED VALIDATION Dispute with within_validation_window=true (ERR_VALIDATION_HOLD)"
        side_effects: []

      - from: WORKING
        to: CLOSED_PAID
        trigger: "system (auto when balance_cents reaches 0 via payment posting or settlement fulfillment)"
        actor: system
        preconditions:
          - "balance_cents == 0"
        side_effects:
          - "Recompute commission_earned_cents"

      - from: ANY_NON_TERMINAL
        to: RECALLED
        trigger: "POST /accounts/{id}/recall"
        actor: Creditor
        preconditions:
          - "expected_account_version matches account.version (ERR_STALE_VERSION)"
          - "work_status not in {CLOSED_PAID, CLOSED_UNCOLLECTIBLE, RECALLED} (ERR_INVALID_STATE)"
        side_effects:
          - "increments Account.version by 1"
          - "CASCADE L1: every PaymentArrangement on this account with status in {PROPOSED, ACCEPTED, COUNTERED} -> CANCELLED"
          - "CASCADE L2: each just-CANCELLED arrangement voids its non-terminal Payments (status POSTED) -> VOIDED"
          - "CASCADE L3: each VOIDED payment subtracts its amount_cents from account.amount_collected_cents and re-adds to balance_cents (ledger restored)"

      - from: ANY_NON_TERMINAL
        to: CLOSED_UNCOLLECTIBLE
        trigger: "POST /accounts/{id}/close-uncollectible"
        actor: Creditor
        preconditions:
          - "work_status not in {CLOSED_PAID, CLOSED_UNCOLLECTIBLE} (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute commission_earned_cents (commission still earned on prior collections)"

      - from: WORKING
        to: CLOSED_UNCOLLECTIBLE
        trigger: "system (auto when an OPEN ACCURACY/VALIDATION Dispute resolves DELETED)"
        actor: system
        preconditions:
          - "Triggering Dispute.resolution == DELETED"
        side_effects:
          - "CASCADE: open BureauFurnishing rows for this account -> DELETED"

  # ---- Account: contact_status (FDCPA communication posture, parallel dimension) ----
  - entity: Account
    initial_state: PRE_VALIDATION
    terminal_states: [CEASED]
    note: "contact_status dimension; transitions are independent of work_status above except where noted."
    transitions:
      - from: PRE_VALIDATION
        to: CONTACTABLE
        trigger: "POST /accounts/{id}/send-validation-notice (same transition that moves work_status PLACED->VALIDATION_SENT)"
        actor: Collector
        preconditions: []
        side_effects: []

      - from: CONTACTABLE
        to: VALIDATION_HELD
        trigger: "POST /accounts/{id}/disputes with dispute_type=VALIDATION inside the validation window"
        actor: ComplianceOfficer
        preconditions:
          - "raised_at < validation_deadline (within_validation_window=true)"
        side_effects:
          - "CASCADE L1: contact_status -> VALIDATION_HELD"
          - "CASCADE L2: each CommunicationAttempt created against this account while VALIDATION_HELD with a cadence-counting channel is rejected (ERR_VALIDATION_HOLD) — collection communication paused until the dispute resolves VERIFIED"

      - from: VALIDATION_HELD
        to: CONTACTABLE
        trigger: "POST /disputes/{id}/resolve with resolution=VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "Dispute.dispute_type == VALIDATION"
        side_effects: []

      - from: PRE_VALIDATION
        to: CEASED
        trigger: "POST /accounts/{id}/cease-communication"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "CASCADE L1: contact_status -> CEASED"
          - "CASCADE L2: all CommunicationAttempt rows on this account with outcome=LOGGED that are still future-dated relative to clock are not applicable; subsequent attempt logging on a cadence-counting channel is rejected (ERR_CEASE_COMMUNICATION)"

      - from: CONTACTABLE
        to: CEASED
        trigger: "POST /accounts/{id}/cease-communication"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["contact_status -> CEASED"]

      - from: VALIDATION_HELD
        to: CEASED
        trigger: "POST /accounts/{id}/cease-communication"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["contact_status -> CEASED"]

  # ---- Dispute: cyclic (reopen loop) ----
  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED]
    note: "Cyclic: a RESOLVED dispute can be REOPENED, then RESOLVED again (different entity from Account/PaymentArrangement)."
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /disputes/{id}/investigate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "resolution in {VERIFIED, DELETED} provided in body (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolution = body.resolution"
          - "If VERIFIED and dispute_type=VALIDATION: account.contact_status VALIDATION_HELD -> CONTACTABLE"
          - "If DELETED: account.work_status -> CLOSED_UNCOLLECTIBLE (see Account cascade); open BureauFurnishing -> DELETED"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "resolution in {VERIFIED, DELETED} provided in body (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolution = body.resolution (same side effects as INVESTIGATING -> RESOLVED)"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /disputes/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "status == RESOLVED (ERR_INVALID_STATE)"
        side_effects:
          - "resolution = null"
          - "If dispute_type=VALIDATION and within_validation_window=true: account.contact_status -> VALIDATION_HELD again"

      - from: REOPENED
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "resolution in {VERIFIED, DELETED} provided in body (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolution = body.resolution (same side effects as INVESTIGATING -> RESOLVED)"

  # ---- PaymentArrangement: branching (PROPOSED -> {ACCEPTED, COUNTERED, REJECTED}) ----
  - entity: PaymentArrangement
    initial_state: PROPOSED
    terminal_states: [REJECTED, FULFILLED, CANCELLED]
    note: "Branching fork from PROPOSED with divergent side-effect sets; COUNTERED loops back to a new PROPOSED via re-propose."
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /arrangements/{id}/accept"
        actor: Collector
        preconditions:
          - "account.work_status == WORKING (ERR_ACCOUNT_NOT_WORKABLE)"
          - "account.time_barred == false OR arrangement_type != SETTLEMENT (ERR_TIME_BARRED)"
          - "For SETTLEMENT: offer_pct_bps >= settlement_floor_bps (ERR_SETTLEMENT_BELOW_FLOOR)"
        side_effects:
          - "For SETTLEMENT: settlement_amount_cents = round_half_up(balance_cents * offer_pct_bps / 10000)"
          - "No ledger change yet; fulfillment occurs when Payment(s) posted"

      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /arrangements/{id}/counter"
        actor: Collector
        preconditions:
          - "arrangement_type == SETTLEMENT (ERR_INVALID_STATE)"
        side_effects:
          - "Records counter; a new PaymentArrangement may be PROPOSED with revised offer_pct_bps"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /arrangements/{id}/reject"
        actor: Collector
        preconditions: []
        side_effects: []

      - from: COUNTERED
        to: REJECTED
        trigger: "POST /arrangements/{id}/reject"
        actor: Collector
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: FULFILLED
        trigger: "system (auto when posted Payments tied to this arrangement satisfy it)"
        actor: system
        preconditions:
          - "For SETTLEMENT: sum of POSTED Payment.amount_cents with arrangement_id == this >= settlement_amount_cents"
          - "For PLAN: sum of POSTED Payment.amount_cents with arrangement_id == this >= balance_cents at acceptance"
        side_effects:
          - "For SETTLEMENT: amount_settled_forgiven_cents += (balance_cents_at_acceptance - settlement_amount_cents); balance_cents -> 0"
          - "Account auto-closes CLOSED_PAID when balance_cents == 0"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (cascade from Account recall)"
        actor: system
        preconditions: []
        side_effects:
          - "Voids POSTED Payments tied to this arrangement (see Account RECALLED cascade L2/L3)"

      - from: PROPOSED
        to: CANCELLED
        trigger: "system (cascade from Account recall)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COUNTERED
        to: CANCELLED
        trigger: "system (cascade from Account recall)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Payment: linear with compensating reverse/void ----
  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED, VOIDED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: Collector
        preconditions:
          - "expected_account_version matches account.version (ERR_STALE_VERSION)"
          - "account.work_status not in {RECALLED, CLOSED_PAID, CLOSED_UNCOLLECTIBLE} (ERR_INVALID_STATE)"
        side_effects:
          - "increments Account.version by 1"
          - "COMPENSATION: account.amount_collected_cents -= amount_cents; balance_cents += amount_cents (conserved: balance_cents + amount_collected_cents constant)"
          - "Recompute commission_earned_cents, last_payment_date, time_barred"

      - from: POSTED
        to: VOIDED
        trigger: "system (cascade from Account recall via arrangement cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "account.amount_collected_cents -= amount_cents; balance_cents += amount_cents"

  # ---- BureauDispute: cyclic reinvestigation ----
  - entity: BureauDispute
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /bureau-disputes/{id}/resolve"
        actor: BureauOperator
        preconditions:
          - "outcome in {VERIFIED, CORRECTED, DELETED} provided in body (ERR_INVALID_REQUEST)"
        side_effects:
          - "outcome = body.outcome"
          - "If CORRECTED: furnishing.status -> UPDATED, furnishing.furnished_balance_cents = account.balance_cents"
          - "If DELETED: furnishing.status -> DELETED"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /bureau-disputes/{id}/reopen"
        actor: BureauOperator
        preconditions:
          - "status == RESOLVED (ERR_INVALID_STATE)"
        side_effects:
          - "outcome = null"

      - from: REOPENED
        to: RESOLVED
        trigger: "POST /bureau-disputes/{id}/resolve"
        actor: BureauOperator
        preconditions:
          - "outcome in {VERIFIED, CORRECTED, DELETED} provided in body (ERR_INVALID_REQUEST)"
        side_effects:
          - "outcome = body.outcome (same as OPEN -> RESOLVED)"

# -----------------------------------------------------------------------------
# Table 1.2.1: Concurrency Rules (OCC on parent.version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: recall-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/recall"
    occ_field: "expected_account_version"
    description: |
      Recalling an Account whose version has advanced since the client last
      observed it is rejected. A prior writer may have posted a payment or
      accepted a settlement (each bumps account.version), so the recalling
      client's view of which arrangements/payments would cascade-cancel is
      stale and the recall is refused until the client re-reads.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reverse-stale-account
    parent_entity: Account
    write_endpoint: "POST /payments/{id}/reverse"
    occ_field: "expected_account_version"
    description: |
      Reversing a Payment against an Account whose version advanced since the
      client last observed it is rejected. Another writer may have posted a
      further payment or closed the account (bumping account.version), so the
      ledger the reversal would compensate is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL-VARIANT #1 (Account domain, financial): commission GROSS vs NET ---
  - name: commission_earned
    trigger: "payment posting, payment reversal/void, account close, account recall"
    algorithm: aggregation
    formula: |
      collected = account.amount_collected_cents            # sum of POSTED Payment.amount_cents
      rate = creditor.commission_rate_bps / 10000
      # Per-payment rounding is pinned: round EACH posted payment's commission to
      # whole cents, THEN sum (round-per-line-then-sum). See combinatorial_formula (b).
      gross_commission = sum over each POSTED payment p of round_half_up(p.amount_cents * rate)
      if creditor.commission_basis == GROSS_OF_FEES:
        commission_earned_cents = gross_commission
      else:  # NET_OF_FEES
        net_base = max(0, collected - creditor.expense_recovery_cents)
        commission_earned_cents = round_half_up(net_base * rate)
    input_set: "POSTED payments only; REVERSED and VOIDED excluded"
    constants: {}
    precision: "whole cents, round_half_up"
    variants:
      - name: gross_of_fees
        when: "creditor.commission_basis == GROSS_OF_FEES"
        difference: "commission computed per posted payment on gross amount, each rounded then summed"
      - name: net_of_fees
        when: "creditor.commission_basis == NET_OF_FEES"
        difference: "expense_recovery_cents subtracted from total collected before applying rate, single rounding"

  # --- DUAL-VARIANT #2 (PaymentArrangement domain): payoff quote as-of-date ---
  - name: payoff_quote
    trigger: "GET /arrangements/{id}/payoff-quote"
    algorithm: threshold
    formula: |
      base = (arrangement_type == SETTLEMENT)
             ? round_half_up(account.balance_cents * offer_pct_bps / 10000)
             : account.balance_cents
      # Two valid as-of interpretations of the SAME arrangement produce different totals:
      if as_of == QUOTE_DATE:
        payoff_cents = base                              # no accrual; quote at today's clock
      else:  # GOOD_THROUGH
        days = floor((good_through - clock) / 1 day), min 0
        payoff_cents = base + days * ADMIN_FEE_PER_DAY_CENTS
    input_set: "single arrangement; account.balance_cents at quote time"
    constants:
      ADMIN_FEE_PER_DAY_CENTS: 50   # $0.50/day admin accrual to good_through
    precision: "whole cents, round_half_up"
    variants:
      - name: as_of_quote_date
        when: "as_of=QUOTE_DATE (default)"
        difference: "no per-day admin accrual"
      - name: as_of_good_through
        when: "as_of=GOOD_THROUGH"
        difference: "adds ADMIN_FEE_PER_DAY_CENTS per whole day from clock to good_through"

  # --- COMBINATORIAL (a): settlement floor — >=3 inputs, nested min/max, state branch ---
  - name: settlement_floor
    trigger: "arrangement accept (SETTLEMENT); validates offer_pct_bps"
    algorithm: tiered_pricing
    formula: |
      # Floor depends on debt age bucket, balance tier, AND prior-dispute flag (3+ inputs,
      # nested min/max + conditional branches on account state).
      age_days = floor((clock - account.charge_off_date) / 1 day)
      if age_days < 180:        age_floor_bps = 7000     # fresh debt, high floor
      elif age_days < 730:      age_floor_bps = 5000
      else:                     age_floor_bps = 3000     # aged debt, low floor
      balance_floor_bps = (account.balance_cents >= 1000000) ? 4000 : 6000   # >= $10,000 -> lower floor
      # The binding floor is the MAX of the two (most protective), then a dispute discount:
      floor_bps = max(age_floor_bps, balance_floor_bps)
      if account has any RESOLVED Dispute with resolution=VERIFIED:
        floor_bps = min(floor_bps + 1000, 10000)         # verified debt commands a higher floor
      settlement_floor_bps = floor_bps
    input_set: "single account; counts VERIFIED disputes"
    constants:
      FRESH_AGE_DAYS: 180
      AGED_AGE_DAYS: 730
      HIGH_BALANCE_CENTS: 1000000
    precision: "basis points, integer"

  # --- SOL / re-aging guardrail (Account, temporal) ---
  - name: sol_status
    trigger: "account create, payment posting, payment reversal, clock advance, settlement accept"
    algorithm: threshold
    formula: |
      # Re-aging guardrail: the SOL anchor is fixed by sol_anchor_basis and last_payment_date
      # is NEVER written backward. A new payment can move LAST_PAYMENT anchor forward but the
      # CHARGE_OFF anchor is immutable, so the basis choice changes the time_barred verdict.
      if account.sol_anchor_basis == CHARGE_OFF:
        anchor = account.charge_off_date
      else:  # LAST_PAYMENT
        anchor = account.last_payment_date or account.charge_off_date
      expiry = anchor + (account.sol_years years)         # exact instant
      time_barred = (clock >= expiry)                      # boundary: == expiry is barred
    input_set: "single account"
    constants: {}
    precision: "datetime comparison, instant-exact (>= expiry)"

  # --- Cadence: 7-in-7 trailing window count (CommunicationAttempt, threshold) ---
  - name: cadence_window_count
    trigger: "CommunicationAttempt log; clock advance"
    algorithm: aggregation
    formula: |
      window_start = clock - 7 days   # trailing 7-day window, half-open (window_start, clock]
      attempts_in_window_count = count of CommunicationAttempt a on this account where
        a.counts_toward_cadence == true
        AND a.outcome in {LOGGED, CONVERSATION}
        AND a.attempted_at > window_start
        AND a.attempted_at <= clock
      # Cap: the 7th counting attempt is allowed; the 8th in the window is rejected.
      # See boundary_precision_check and resource_temporal_overlap (post-conversation buffer).
    input_set: "CommunicationAttempt rows on one account, counting channels only"
    constants:
      WINDOW_DAYS: 7
      MAX_ATTEMPTS_PER_WINDOW: 7
    precision: "integer count; window boundary half-open (strictly after window_start, at-or-before clock)"

  # --- Balance reconciliation (Account, derived) ---
  - name: account_balance
    trigger: "payment posting, payment reverse/void, settlement fulfillment"
    algorithm: aggregation
    formula: |
      amount_collected_cents = sum of Payment.amount_cents where status == POSTED
      amount_settled_forgiven_cents = sum over FULFILLED SETTLEMENT arrangements of
        (balance_at_acceptance - settlement_amount_cents)
      balance_cents = max(0, original_principal_cents - amount_collected_cents - amount_settled_forgiven_cents)
      # Invariant (compensating): balance_cents + amount_collected_cents stays constant across a
      # POSTED->REVERSED->(re-post) cycle when no forgiveness occurs.
    input_set: "POSTED payments + FULFILLED settlements on one account"
    constants: {}
    precision: "whole cents"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced resources exist (path ids and body FKs), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing ids"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts/principal > 0, offer_pct_bps in 1..10000, rates in 0..10000"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "FDCPA cease-communication: once contact_status==CEASED, no cadence-counting CommunicationAttempt may be logged and begin-work is blocked"
    error_id: ERR_CEASE_COMMUNICATION
    http_status: 409
    applies_to: "POST /communication-attempts, POST /accounts/{id}/begin-work"

  - priority: 7
    category: business_safety
    check: "Validation hold: while an in-window VALIDATION dispute is unresolved (contact_status==VALIDATION_HELD), no cadence-counting attempt may be logged, begin-work is blocked, and tradelines may not be furnished"
    error_id: ERR_VALIDATION_HOLD
    http_status: 409
    applies_to: "POST /communication-attempts, POST /accounts/{id}/begin-work, POST /bureau-furnishings"

  - priority: 8
    category: business_temporal
    check: "Time-of-day window: a PHONE CommunicationAttempt's attempted_at converted to consumer local time must fall in [08:00:00, 21:00:00) (closed start, open end)"
    error_id: ERR_OUTSIDE_CALL_WINDOW
    http_status: 409
    applies_to: "POST /communication-attempts (channel=PHONE)"

  - priority: 9
    category: business_temporal
    check: "Post-conversation cooldown: a cadence-counting attempt whose attempted_at falls in [last_conversation_at, last_conversation_at + 7 days) is rejected"
    error_id: ERR_POST_CONVERSATION_COOLDOWN
    http_status: 409
    applies_to: "POST /communication-attempts (cadence-counting channels)"

  - priority: 10
    category: business_constraint
    check: "Cadence cap: logging a cadence-counting attempt that would make attempts_in_window_count exceed 7 in the trailing 7-day window is rejected (7th allowed, 8th rejected)"
    error_id: ERR_CADENCE_EXCEEDED
    http_status: 409
    applies_to: "POST /communication-attempts (cadence-counting channels)"

  - priority: 11
    category: business_temporal
    check: "SOL guardrail: accepting a SETTLEMENT arrangement on a time_barred account is rejected (collection on time-barred debt restricted)"
    error_id: ERR_TIME_BARRED
    http_status: 409
    applies_to: "POST /arrangements/{id}/accept (arrangement_type=SETTLEMENT)"

  - priority: 12
    category: business_fiscal
    check: "Settlement floor: a SETTLEMENT's offer_pct_bps below settlement_floor_bps is rejected"
    error_id: ERR_SETTLEMENT_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /arrangements/{id}/accept (arrangement_type=SETTLEMENT)"

  - priority: 13
    category: business_referential
    check: "Furnish guardrail: cannot furnish a tradeline for an account that is RECALLED/CLOSED_UNCOLLECTIBLE or has an unresolved ACCURACY/VALIDATION Dispute"
    error_id: ERR_FURNISH_BLOCKED
    http_status: 409
    applies_to: "POST /bureau-furnishings"

  - priority: 14
    category: business_referential
    check: "Payment.arrangement_id, if supplied, must reference an ACCEPTED arrangement on the same account"
    error_id: ERR_ARRANGEMENT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /payments"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock). Drives all deadline/window/SOL/cadence rules deterministically."
    roles: [System]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects:
      - "Logical clock = to_iso8601"
      - "Recompute time_barred, validation_deadline staleness, attempts_in_window_count on read"

  # ---- Creditor ----
  - method: POST
    path: "/creditors"
    description: "Create a Creditor (commission terms)"
    roles: [Creditor]
    code: 201
    input: ["name", "commission_basis?", "commission_rate_bps", "expense_recovery_cents?"]
    output: Creditor
    side_effects: []

  - method: GET
    path: "/creditors/{id}"
    description: "Get a Creditor"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: []
    output: Creditor
    side_effects: []

  # ---- Consumer ----
  - method: POST
    path: "/consumers"
    description: "Create a Consumer (debtor)"
    roles: [Creditor, Collector]
    code: 201
    input: ["full_name", "timezone_offset_minutes?", "phone?", "address?"]
    output: Consumer
    side_effects: ["contactability=UNKNOWN"]

  - method: GET
    path: "/consumers/{id}"
    description: "Get a Consumer"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: []
    output: Consumer
    side_effects: []

  - method: GET
    path: "/skip-traces/{id}"
    description: "Get a SkipTrace record"
    roles: [Collector, ComplianceOfficer, System]
    code: 200
    input: []
    output: SkipTrace
    side_effects: []

  - method: GET
    path: "/skip-traces"
    description: "List SkipTrace records (filter by consumer)"
    roles: [Collector, ComplianceOfficer, System]
    code: 200
    input: ["consumer_id?"]
    output: "SkipTrace[]"
    side_effects: []

  - method: POST
    path: "/skip-traces"
    description: "Record a skip-trace result for a consumer; LOCATED updates contact info"
    roles: [Collector]
    code: 201
    input: ["consumer_id", "result", "new_phone?", "new_address?"]
    output: SkipTrace
    side_effects:
      - "If result=LOCATED: consumer.phone/address updated when provided, consumer.contactability=LOCATED"
      - "If result=NOT_FOUND: consumer.contactability=UNLOCATABLE"

  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Place a new account (debt) with the agency"
    roles: [Creditor]
    code: 201
    input: ["creditor_id", "consumer_id", "original_principal_cents", "charge_off_date", "sol_years", "sol_anchor_basis?"]
    output: Account
    side_effects:
      - "work_status=PLACED, contact_status=PRE_VALIDATION"
      - "balance_cents=original_principal_cents, amount_collected_cents=0, amount_settled_forgiven_cents=0"
      - "placement_date=clock; compute time_barred via sol_status"

  - method: GET
    path: "/accounts/{id}"
    description: "Get an account (all computed fields)"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List accounts (filter by creditor or consumer)"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: ["creditor_id?", "consumer_id?", "work_status?", "contact_status?"]
    output: "Account[]"
    side_effects: []

  - method: POST
    path: "/accounts/{id}/send-validation-notice"
    description: "Send §1692g validation notice; opens 30-day dispute window"
    roles: [Collector]
    code: 200
    input: []
    output: Account
    side_effects:
      - "work_status PLACED -> VALIDATION_SENT; contact_status PRE_VALIDATION -> CONTACTABLE"
      - "validation_notice_sent_at=clock; validation_deadline=clock+30d"

  - method: POST
    path: "/accounts/{id}/begin-work"
    description: "Move account into active collection (WORKING)"
    roles: [Collector]
    code: 200
    input: []
    output: Account
    side_effects: ["work_status VALIDATION_SENT -> WORKING"]

  - method: POST
    path: "/accounts/{id}/cease-communication"
    description: "Record consumer cease-communication request; halts cadence-counting contact"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["contact_status -> CEASED"]

  - method: POST
    path: "/accounts/{id}/recall"
    description: "Creditor recalls the account; cascades cancel arrangements, void payments, restore ledger"
    roles: [Creditor]
    code: 200
    input: [expected_account_version]
    output: Account
    side_effects:
      - "increments Account.version by 1"
      - "work_status -> RECALLED"
      - "CASCADE: PROPOSED/ACCEPTED/COUNTERED arrangements -> CANCELLED; their POSTED payments -> VOIDED; ledger restored; recompute commission_earned_cents"

  - method: POST
    path: "/accounts/{id}/close-uncollectible"
    description: "Creditor closes account as uncollectible"
    roles: [Creditor]
    code: 200
    input: []
    output: Account
    side_effects: ["work_status -> CLOSED_UNCOLLECTIBLE; recompute commission_earned_cents"]

  # ---- CommunicationAttempt ----
  - method: POST
    path: "/communication-attempts"
    description: "Log a contact attempt (enforces cease, validation-hold, call-window, cooldown, cadence)"
    roles: [Collector]
    code: 201
    input: [account_id, channel, attempted_at, outcome]
    output: CommunicationAttempt
    side_effects:
      - "counts_toward_cadence computed; recompute account.attempts_in_window_count"
      - "If outcome=CONVERSATION: account.last_conversation_at=attempted_at"

  - method: GET
    path: "/communication-attempts/{id}"
    description: "Get a communication attempt"
    roles: [Collector, ComplianceOfficer, System]
    code: 200
    input: []
    output: CommunicationAttempt
    side_effects: []

  - method: GET
    path: "/communication-attempts"
    description: "List communication attempts (filter by account)"
    roles: [Collector, ComplianceOfficer, System]
    code: 200
    input: ["account_id?"]
    output: "CommunicationAttempt[]"
    side_effects: []

  # ---- Dispute ----
  - method: POST
    path: "/accounts/{id}/disputes"
    description: "Raise a dispute (VALIDATION or ACCURACY) against an account"
    roles: [ComplianceOfficer]
    code: 201
    input: [dispute_type]
    output: Dispute
    side_effects:
      - "raised_at=clock; within_validation_window computed"
      - "If VALIDATION and within_validation_window: account.contact_status -> VALIDATION_HELD"

  - method: GET
    path: "/disputes/{id}"
    description: "Get a dispute"
    roles: [Creditor, Collector, ComplianceOfficer, System]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes (filter by account)"
    roles: [Creditor, Collector, ComplianceOfficer, System]
    code: 200
    input: ["account_id?", "status?"]
    output: "Dispute[]"
    side_effects: []

  - method: POST
    path: "/disputes/{id}/investigate"
    description: "Move dispute to INVESTIGATING"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> INVESTIGATING"]

  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Resolve dispute VERIFIED (resume) or DELETED (close account uncollectible)"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution]
    output: Dispute
    side_effects:
      - "status -> RESOLVED; resolution set"
      - "VERIFIED + VALIDATION: contact_status VALIDATION_HELD -> CONTACTABLE"
      - "DELETED: account -> CLOSED_UNCOLLECTIBLE; open furnishings -> DELETED"

  - method: POST
    path: "/disputes/{id}/reopen"
    description: "Reopen a RESOLVED dispute (cyclic)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> REOPENED; resolution=null; re-hold contact if in-window VALIDATION"]

  # ---- PaymentArrangement ----
  - method: POST
    path: "/arrangements"
    description: "Propose a payment plan or settlement (% offer)"
    roles: [Collector]
    code: 201
    input: ["account_id", "arrangement_type", "offer_pct_bps?", "installment_count?", "good_through?"]
    output: PaymentArrangement
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/arrangements/{id}"
    description: "Get an arrangement"
    roles: [Creditor, Collector, ComplianceOfficer, System]
    code: 200
    input: []
    output: PaymentArrangement
    side_effects: []

  - method: GET
    path: "/arrangements"
    description: "List arrangements (filter by account)"
    roles: [Creditor, Collector, ComplianceOfficer, System]
    code: 200
    input: ["account_id?", "status?"]
    output: "PaymentArrangement[]"
    side_effects: []

  - method: GET
    path: "/arrangements/{id}/payoff-quote"
    description: "Computed payoff quote (as_of=QUOTE_DATE default or GOOD_THROUGH)"
    roles: [Creditor, Collector, ComplianceOfficer, System]
    code: 200
    input: ["as_of?"]
    output: "{ payoff_cents: integer, as_of: string }"
    side_effects: []

  - method: POST
    path: "/arrangements/{id}/accept"
    description: "Accept arrangement (enforces workable, SOL, settlement floor)"
    roles: [Collector]
    code: 200
    input: []
    output: PaymentArrangement
    side_effects:
      - "status PROPOSED -> ACCEPTED"
      - "For SETTLEMENT: settlement_amount_cents computed"

  - method: POST
    path: "/arrangements/{id}/counter"
    description: "Counter a proposed settlement"
    roles: [Collector]
    code: 200
    input: []
    output: PaymentArrangement
    side_effects: ["status PROPOSED -> COUNTERED"]

  - method: POST
    path: "/arrangements/{id}/reject"
    description: "Reject a proposed/countered arrangement"
    roles: [Collector]
    code: 200
    input: []
    output: PaymentArrangement
    side_effects: ["status -> REJECTED"]

  # ---- Payment ----
  - method: POST
    path: "/payments"
    description: "Post a payment to an account (optionally tied to an ACCEPTED arrangement)"
    roles: [Collector]
    code: 201
    input: ["account_id", "amount_cents", "arrangement_id?"]
    output: Payment
    side_effects:
      - "status=POSTED; posted_at=clock"
      - "account.amount_collected_cents += amount_cents; recompute balance_cents, commission_earned_cents, last_payment_date, time_barred"
      - "increments Account.version by 1"
      - "Auto-fulfill arrangement and auto-close account if balance_cents==0"

  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [Creditor, Collector, ComplianceOfficer, System]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments (filter by account or arrangement)"
    roles: [Creditor, Collector, ComplianceOfficer, System]
    code: 200
    input: ["account_id?", "arrangement_id?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/payments/{id}/reverse"
    description: "Reverse a posted payment (compensating ledger restoration)"
    roles: [Collector]
    code: 200
    input: [expected_account_version]
    output: Payment
    side_effects:
      - "status POSTED -> REVERSED"
      - "account.amount_collected_cents -= amount_cents; recompute balance, commission, last_payment_date, time_barred"
      - "increments Account.version by 1"

  # ---- BureauFurnishing ----
  - method: POST
    path: "/bureau-furnishings"
    description: "Furnish a tradeline to a bureau (enforces furnish guardrail)"
    roles: [ComplianceOfficer, BureauOperator]
    code: 201
    input: [account_id, bureau]
    output: BureauFurnishing
    side_effects: ["status=REPORTED; furnished_balance_cents=account.balance_cents"]

  - method: GET
    path: "/bureau-furnishings/{id}"
    description: "Get a furnishing"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: []
    output: BureauFurnishing
    side_effects: []

  - method: GET
    path: "/bureau-furnishings"
    description: "List furnishings (filter by account)"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: ["account_id?"]
    output: "BureauFurnishing[]"
    side_effects: []

  # ---- BureauDispute ----
  - method: POST
    path: "/bureau-disputes"
    description: "Open an e-OSCAR ACDV dispute on a furnished tradeline"
    roles: [BureauOperator]
    code: 201
    input: [furnishing_id]
    output: BureauDispute
    side_effects: ["status=OPEN; opened_at=clock; investigation_deadline=clock+30d"]

  - method: GET
    path: "/bureau-disputes/{id}"
    description: "Get a bureau dispute"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: []
    output: BureauDispute
    side_effects: []

  - method: GET
    path: "/bureau-disputes"
    description: "List bureau disputes (filter by furnishing)"
    roles: [Creditor, Collector, ComplianceOfficer, BureauOperator, System]
    code: 200
    input: ["furnishing_id?"]
    output: "BureauDispute[]"
    side_effects: []

  - method: POST
    path: "/bureau-disputes/{id}/resolve"
    description: "Resolve e-OSCAR dispute (VERIFIED | CORRECTED | DELETED)"
    roles: [BureauOperator]
    code: 200
    input: [outcome]
    output: BureauDispute
    side_effects:
      - "status -> RESOLVED; outcome set"
      - "CORRECTED: furnishing.status=UPDATED, furnished_balance_cents=account.balance_cents"
      - "DELETED: furnishing.status=DELETED"

  - method: POST
    path: "/bureau-disputes/{id}/reopen"
    description: "Reopen a RESOLVED e-OSCAR dispute (cyclic)"
    roles: [BureauOperator]
    code: 200
    input: []
    output: BureauDispute
    side_effects: ["status -> REOPENED; outcome=null"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/malformed or role unknown" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, non-positive amount/principal, offer_pct_bps out of 1..10000, missing resolution/outcome" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which this transition is defined" }
  - { id: ERR_VALIDATION_ALREADY_SENT, http: 409, condition: "Validation notice already sent for this account" }
  - { id: ERR_CEASE_COMMUNICATION, http: 409, condition: "Account contact_status==CEASED; cadence-counting attempt or begin-work blocked" }
  - { id: ERR_VALIDATION_HOLD, http: 409, condition: "Unresolved in-window VALIDATION dispute holds collection (attempt/begin-work/furnish blocked)" }
  - { id: ERR_OUTSIDE_CALL_WINDOW, http: 409, condition: "PHONE attempt local time outside [08:00:00, 21:00:00)" }
  - { id: ERR_POST_CONVERSATION_COOLDOWN, http: 409, condition: "Cadence-counting attempt within 7-day buffer after last_conversation_at" }
  - { id: ERR_CADENCE_EXCEEDED, http: 409, condition: "Cadence-counting attempt would exceed 7 attempts in trailing 7-day window" }
  - { id: ERR_TIME_BARRED, http: 409, condition: "Accepting a SETTLEMENT on a time_barred account is restricted" }
  - { id: ERR_SETTLEMENT_BELOW_FLOOR, http: 409, condition: "Settlement offer_pct_bps below computed settlement_floor_bps" }
  - { id: ERR_ACCOUNT_NOT_WORKABLE, http: 409, condition: "Arrangement accept requires account.work_status==WORKING" }
  - { id: ERR_FURNISH_BLOCKED, http: 409, condition: "Account RECALLED/CLOSED_UNCOLLECTIBLE or has unresolved dispute; tradeline may not be furnished" }
  - { id: ERR_ARRANGEMENT_NOT_ACCEPTED, http: 409, condition: "Payment.arrangement_id references a non-ACCEPTED arrangement or one on a different account" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match current account.version (OCC)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Creditor
    description: "Owning/placing creditor: places accounts, recalls, closes uncollectible, sets commission terms"
    identity: "entity_backed:Creditor"
    exclusive_operations:
      - "POST /creditors — create creditor"
      - "POST /accounts — place account"
      - "POST /accounts/{id}/recall — recall account"
      - "POST /accounts/{id}/close-uncollectible — close uncollectible"
    shared_operations:
      - "POST /consumers — create consumer (with Collector)"
      - "GET reads on creditors/consumers/accounts/disputes/arrangements/payments/furnishings/bureau-disputes"

  - name: Collector
    description: "Agency collector: sends validation notice, works accounts, logs calls, skip-traces, proposes/accepts arrangements, posts/reverses payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/send-validation-notice"
      - "POST /accounts/{id}/begin-work"
      - "POST /communication-attempts — log attempt"
      - "POST /skip-traces — record skip-trace"
      - "POST /arrangements — propose arrangement"
      - "POST /arrangements/{id}/accept | /counter | /reject"
      - "POST /payments — post payment"
      - "POST /payments/{id}/reverse"
    shared_operations:
      - "POST /consumers — create consumer (with Creditor)"
      - "GET reads on accounts/consumers/arrangements/payments/communication-attempts/skip-traces/disputes"

  - name: ComplianceOfficer
    description: "Compliance: raises/investigates/resolves disputes, records cease-communication, furnishes tradelines"
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/cease-communication"
      - "POST /accounts/{id}/disputes — raise dispute"
      - "POST /disputes/{id}/investigate | /resolve | /reopen"
    shared_operations:
      - "POST /bureau-furnishings — furnish tradeline (with BureauOperator)"
      - "GET reads on accounts/disputes/furnishings/bureau-disputes/communication-attempts/skip-traces"

  - name: BureauOperator
    description: "Credit-bureau interface: furnishes tradelines, opens/resolves/reopens e-OSCAR disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /bureau-disputes — open e-OSCAR dispute"
      - "POST /bureau-disputes/{id}/resolve | /reopen"
    shared_operations:
      - "POST /bureau-furnishings — furnish tradeline (with ComplianceOfficer)"
      - "GET reads on accounts/furnishings/bureau-disputes/consumers"

  - name: System
    description: "Automation/clock: sets logical clock, drives clock-based sweeps; opaque operator identity"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads across all resources"
