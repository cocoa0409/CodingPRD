            - call: "POST /manufacturers"
              payload: { name: "Overprice Motors", oem_code: "OVRP", region: "EU", independent_list_monthly_cents: 150000, independent_covered_system_count: 4, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
