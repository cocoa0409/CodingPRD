            - "HOP 2: DecisionDocument.${dec_id}.status == VACATED with binding_obligation_cents retained at 3487823"
            - "HOP 2a: MitigationCommitment.${mit1_id}.status == RELEASED and monitoring_status == RELEASED"
            - "HOP 2a: MitigationCommitment.${mit2_id}.status == RELEASED and monitoring_status == RELEASED"
            - "HOP 2b: ReviewOffice.${off_id}.binding_obligation_cents == 0"
            - "HOP 3: NepaDocument.${doc_id}.publication_status == DRAFT and comment_status == CLOSED"
            - "HOP 3: ProposedAction.${act_id}.review_stage == COMMENT_CLOSED"
            - "GET /proposed-actions/${act_id}/record-entries contains OBJECTION_RESOLVED followed by DECISION_VACATED"

