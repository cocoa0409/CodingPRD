              payload: { name: "C9", spec_territory_code: "CO", ship_to_territory_code: "CO" }
              as: AgencyAdmin
              captures: { c9: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c9}", principal_id: "${p3}", external_order_ref: "PO-D", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 60, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { od: $.data.id }
            - call: "POST /rep-agency/orders/${od}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p3}"
            - call: "POST /rep-agency/orders/${od}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p3}"
