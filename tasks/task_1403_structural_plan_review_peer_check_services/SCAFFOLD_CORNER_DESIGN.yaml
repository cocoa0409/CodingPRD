# =============================================================================
# §1.9 Scaffold Corner Design — Structural Plan Review & Peer Check Services
# Breadth coverage of every testable claim in §1.1–§1.7 that §1.8 does not
# already cover. Sections and claim_type values follow the claim-extraction
# guide taxonomy. Instances already exercised by §1.8 are emitted as
# excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: jurisdiction_creation_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.Jurisdiction.fields.free_resubmittal_cycles, entities.Jurisdiction.fields.requires_se_seal, entities.Jurisdiction.fields.allows_deferred_submittals]
        distinguishing_aspect: "Omitting optional jurisdiction fields yields defaults: free_resubmittal_cycles=2, requires_se_seal=false, allows_deferred_submittals=true; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "GET /plan-review/jurisdictions/${jur_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Jurisdiction.${jur_id}.free_resubmittal_cycles == 2"
            - "Jurisdiction.${jur_id}.requires_se_seal == false"
            - "Jurisdiction.${jur_id}.allows_deferred_submittals == true"
            - "Jurisdiction.${jur_id}.version == 1"

      - name: reviewer_creation_initializes_computed_load
        claim_type: computed_field
        grounds: [entities.Reviewer.fields.active_assignment_count]
        distinguishing_aspect: "A fresh reviewer has active_assignment_count == 0 (computed field initialized, not client-supplied)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Fresh Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PX", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "GET /plan-review/reviewers/${rev_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Reviewer.${rev_id}.active_assignment_count == 0"
            - "Reviewer.${rev_id}.max_concurrent_assignments == 3 (input default applied)"

      - name: engagement_creation_pins_jurisdiction_snapshot
        claim_type: computed_field
        grounds: [entities.Engagement.fields.pinned_ibc_edition, entities.Engagement.fields.pinned_fee_method, entities.Engagement.fields.pinned_turnaround_days]
        distinguishing_aspect: "All nine pinned_* fields are copied from the jurisdiction at creation, and estimated_fee_cents is computed in the same request (SQUARE_FOOTAGE path: 10000 sqft COMMERCIAL x 55 = 550000)."
        test_recipe:
          setup: ["Jurisdiction CA with SQUARE_FOOTAGE fee method, 20-day CALENDAR SLA"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2018", asce7_edition: "ASCE7_16", fee_method: "SQUARE_FOOTAGE", turnaround_days: 20, sla_mode: "CALENDAR", free_resubmittal_cycles: 1, requires_se_seal: true, allows_deferred_submittals: false }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Snap Reviewer", licenses: [{ state_code: "CA", license_type: "SE", license_number: "SE1", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Snapshot", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "III", scope: "FULL_REVIEW", declared_valuation_cents: 5000000, floor_area_sqft: 10000, requested_expedite: false }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
          assert:
            - "Engagement.${eng_id}.pinned_state_code == CA"
            - "Engagement.${eng_id}.pinned_ibc_edition == IBC_2018 and pinned_asce7_edition == ASCE7_16"
            - "Engagement.${eng_id}.pinned_fee_method == SQUARE_FOOTAGE and pinned_turnaround_days == 20 and pinned_sla_mode == CALENDAR"
            - "Engagement.${eng_id}.pinned_free_resubmittal_cycles == 1 and pinned_requires_se_seal == true and pinned_allows_deferred_submittals == false"
            - "Engagement.${eng_id}.estimated_fee_cents == 550000 (10000 sqft x 55 cents, scope 1.0, no expedite)"
            - "Engagement.${eng_id}.status == REGISTERED and cycle_count == 0"

      - name: engagement_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ENGAGEMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent engagement id returns 404 with ERR_ENGAGEMENT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /plan-review/engagements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ENGAGEMENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: engagement_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required jurisdiction_id in the create body yields ERR_INVALID_REQUEST (400) before any existence or state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plan-review/engagements"
              payload: { project_name: "No Jurisdiction", applicant_contact_id: "app-1", reviewer_of_record_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: engagement_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Engagement.fields.scope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "scope 'BOGUS' is not in {FULL_REVIEW, LATERAL_ONLY, PEER_REVIEW} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["jurisdiction + reviewer exist"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Enum Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE1", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Bad Enum", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "BOGUS", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: comment_response_is_immutable_event
        claim_type: immutability
        grounds: [entities.CommentResponse]
        distinguishing_aspect: "CommentResponse has common_fields=false: rows carry id and created_at only — no version or updated_at field — and no update endpoint exists."
        test_recipe:
          setup: ["engagement with cycle COMMENTS_ISSUED holding one OPEN comment"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Ev Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE2", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Event Log", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://ev-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "DETAILING", comment_text: "Missing lap splice length" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com: $.data.id }
            - call: "POST /plan-review/cycles/${cyc}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /plan-review/comments/${com}/responses"
              payload: { response_text: "Lap splice noted on S5.1" }
              as: Applicant
              as_user_id: "app-1"
              captures: { resp: $.data.id }
          assert:
            - "CommentResponse.${resp} has id and created_at but no version field and no updated_at field"
            - "CommentResponse.${resp}.responder_contact_id == app-1"
            - "GET /plan-review/comments/${com}/responses returns the row with comment_id == ${com}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cycle_starts_in_open_with_computed_due_at
        claim_type: initial_state
        grounds: [state_machines.ReviewCycle, calculations.turnaround_sla]
        distinguishing_aspect: "A new cycle is OPEN (not IN_REVIEW) until the first assignment; cycle_number is 1; received_at equals the logical clock."
        test_recipe:
          setup: ["engagement registered; clock set to 2026-08-03T10:00:00Z"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Init Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE3", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Initial", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://init-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id }
          assert:
            - "ReviewCycle.${cyc}.status == OPEN"
            - "ReviewCycle.${cyc}.cycle_number == 1"
            - "ReviewCycle.${cyc}.received_at == 2026-08-03T10:00:00Z"
            - "ReviewCycle.${cyc}.due_at == 2026-08-18T10:00:00Z (CALENDAR 15d)"
            - "ReviewCycle.${cyc}.is_on_time == null and completed_at == null (not yet completed)"
            - "Engagement.${eng_id}.status == IN_PROGRESS (first cycle auto-advances the engagement)"

      - name: approve_from_open_cycle_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReviewCycle, "errors[ERR_CYCLE_NOT_IN_REVIEW]"]
        distinguishing_aspect: "An OPEN cycle (no assignment yet) rejects approve with ERR_CYCLE_NOT_IN_REVIEW; no state change occurs."
        test_recipe:
          setup: ["engagement with an OPEN cycle"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Inv Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE4", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Invalid", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://inv-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /plan-review/cycles/${cyc}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CYCLE_NOT_IN_REVIEW"
            - "ReviewCycle.${cyc}.status == OPEN"

      - name: cancelled_engagement_is_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Engagement, "errors[ERR_ENGAGEMENT_NOT_ACTIVE]", "errors[ERR_ENGAGEMENT_NOT_AMENDABLE]"]
        distinguishing_aspect: "From CANCELLED no further transitions fire: cycle creation returns ERR_ENGAGEMENT_NOT_ACTIVE and amendment returns ERR_ENGAGEMENT_NOT_AMENDABLE."
        test_recipe:
          setup: ["engagement cancelled while REGISTERED (no cycles)"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Term Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE5", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Terminal", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/engagements/${eng_id}/cancel"
              payload: {}
              as: ReviewCoordinator
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://term-v1" }
              as: ReviewCoordinator
              captures: { err1: $.data.error_id }
            - call: "PUT /plan-review/engagements/${eng_id}"
              payload: { declared_valuation_cents: 40000000 }
              as: ReviewCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_ENGAGEMENT_NOT_ACTIVE"
            - "${err2} == ERR_ENGAGEMENT_NOT_AMENDABLE"
            - "Engagement.${eng_id}.status == CANCELLED"

      - name: verified_comment_rejects_reopen
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeficiencyComment, "errors[ERR_COMMENT_NOT_ADDRESSED]"]
        distinguishing_aspect: "VERIFIED is terminal for the response loop: reopen on a VERIFIED comment fails with ERR_COMMENT_NOT_ADDRESSED."
        test_recipe:
          setup: ["comment verified in cycle 2 (full respond/verify round complete)"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Lock Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE6", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Lockdown", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://lock-v1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "CALCULATION", comment_text: "Deflection check missing" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com: $.data.id }
            - call: "POST /plan-review/cycles/${cyc1}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/comments/${com}/responses"
              payload: { response_text: "Deflection check added" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://lock-v2" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments/${com}/verify"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /plan-review/comments/${com}/reopen"
              payload: { reopen_note: "changed my mind" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMMENT_NOT_ADDRESSED"
            - "DeficiencyComment.${com}.status == VERIFIED"

      - name: deferred_submittal_full_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.DeferredSubmittal]
        distinguishing_aspect: "The cyclic path REGISTERED -> SUBMITTED -> REJECTED -> SUBMITTED -> APPROVED all succeeds; pending count stays 1 through submit/reject and drops to 0 only at approve."
        test_recipe:
          setup: ["engagement IN_PROGRESS with an assigned in-review cycle"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS", allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Def Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE7", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Deferred Walk", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://def-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/deferred-submittals"
              payload: { engagement_id: "${eng_id}", item_type: "TRUSS", description: "Floor truss package" }
              as: Applicant
              as_user_id: "app-1"
              captures: { def1: $.data.id }
          trigger:
            - call: "POST /plan-review/deferred-submittals/${def1}/submit"
              payload: { documents_ref: "s3://truss-v1" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/deferred-submittals/${def1}/reject"
              payload: { rejection_reason: "Truss calcs missing connector design" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/deferred-submittals/${def1}/submit"
              payload: { documents_ref: "s3://truss-v2" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/deferred-submittals/${def1}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { pending: $.data.deferred_pending_count }
          assert:
            - "DeferredSubmittal.${def1}.status == APPROVED after the full resubmit loop"
            - "${pending} == 0"
            - "DeferredSubmittal.${def1}.documents_ref == s3://truss-v2 (resubmittal replaced it)"
            - "DeferredSubmittal.${def1}.rejection_reason == null (cleared on resubmit)"

      - name: record_transmit_completes_engagement_and_locks
        claim_type: valid_transition
        grounds: [state_machines.ReviewRecord, state_machines.Engagement.APPROVED_to_COMPLETED, "errors[ERR_RECORD_INVALID_STATE]"]
        distinguishing_aspect: "SEALED -> TRANSMITTED flips the engagement APPROVED -> COMPLETED in the same request; a second transmit is rejected with ERR_RECORD_INVALID_STATE."
        test_recipe:
          setup: ["engagement APPROVED with a SEALED record"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Tx Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE8", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Transmit", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://tx-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_id: "$.data[0].id" }
            - call: "POST /plan-review/records/${rec_id}/seal"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /plan-review/records/${rec_id}/transmit"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /plan-review/records/${rec_id}/transmit"
              payload: {}
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "ReviewRecord.${rec_id}.status == TRANSMITTED with transmitted_at set"
            - "Engagement.${eng_id}.status == COMPLETED"
            - "${err} == ERR_RECORD_INVALID_STATE (idempotency: second transmit rejected)"

      - name: release_of_non_active_assignment_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReviewAssignment, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Releasing an already-RELEASED assignment fails with ERR_INVALID_STATE_TRANSITION and does not double-decrement the reviewer load."
        test_recipe:
          setup: ["assignment released once already"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Rel Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE9", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Release", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://rel-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
              captures: { asg: $.data.id }
            - call: "POST /plan-review/assignments/${asg}/release"
              payload: {}
              as: ReviewCoordinator
          trigger:
            - call: "POST /plan-review/assignments/${asg}/release"
              payload: {}
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /plan-review/reviewers/${rev_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { load: $.data.active_assignment_count }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "${load} == 0 (no double decrement)"

      - name: supersede_completes_active_assignment
        claim_type: side_effect_execution
        grounds: [state_machines.ReviewCycle.COMMENTS_ISSUED_to_SUPERSEDED, state_machines.ReviewAssignment.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "When the resubmittal supersedes a COMMENTS_ISSUED cycle, its ACTIVE assignment becomes COMPLETED (not RELEASED) and the reviewer load drops."
        test_recipe:
          setup: ["cycle 1 COMMENTS_ISSUED with ACTIVE assignment; reviewer load == 1"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Sup Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE10", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Supersede", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://sup-v1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
              captures: { asg1: $.data.id }
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "DETAILING", comment_text: "Missing holdown schedule" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/cycles/${cyc1}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://sup-v2" }
              as: ReviewCoordinator
            - call: "GET /plan-review/assignments/${asg1}"
              payload: {}
              as: ReviewCoordinator
              captures: { asg1_status: $.data.status }
          assert:
