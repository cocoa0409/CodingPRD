      - name: calibration_rounds_each_corridor_before_the_aggregate_buffer
        grounds:
          - calculations.monitoring_threshold_calibration
          - entities.TransactionMonitoringProfile.fields.corridor_thresholds
          - entities.TransactionMonitoringProfile.fields.aggregate_usd_threshold
          - entities.TransactionMonitoringProfile.fields.hold_threshold_usd
          - state_machines.TransactionMonitoringProfile.PROVISIONAL_to_CALIBRATED
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER changes the answer: the three corridor raws sum
          to 2552595.245014285714... at full precision, so buffering the unrounded sum yields
          aggregate 2807854.77 while the pinned order (round each corridor to 2dp first, sum the
          rounded values to 2552595.25, then apply AGGREGATE_BUFFER 1.10 and round) yields
          2807854.78 - a one-cent discriminator that no smoke test can reach, and the count
          thresholds additionally use ceil (209.30 -> 210) rather than rounding.
