        distinguishing_aspect: |
          A five-year cumulative look-back yields max_points_allowed 0 for
          A430_CUMULATIVE_SI, and because priority 85 requires at least 1 allowable point the
          verification is refused with 422 ERR_STANDARD_PREREQUISITE_NOT_MET instead of
          silently verifying at 0 points; the standard stays SUBMITTED.
        test_recipe:
          setup:
            - "Community with cumulative_period_years 5; A430_CUMULATIVE_SI standard for cycle year 2026 claiming 90 points, submitted."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Short Lookback City", state_code: "TX", cid_number: "480009", freeboard_ft: 1.0, cumulative_period_years: 5 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_CUMULATIVE_SI", documentation_cycle_year: 2026, claimed_points: 90, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/higher-standards/${std_id}/verify"
              payload: { decision: "VERIFY" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_STANDARD_PREREQUISITE_NOT_MET'"
            - "HigherStandard.${std_id}.documentation_status == SUBMITTED"
            - "HigherStandard.${std_id}.max_points_allowed == 0"
            - "HigherStandard.${std_id}.verified_points == 0"
            - "Community.${comm_id}.crs_credit_points_verified == 0"

      - name: substantial_ratio_variants_disagree_on_the_same_ledger
        claim_type: variant_divergence
        grounds:
          - calculations.substantial_ratio.variants
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: si_ratio_cumulative_variant_yields_substantial
          rationale: |
            The paired §1.8 dual_variant_calc instances
            si_ratio_single_event_variant_yields_not_substantial and
            si_ratio_cumulative_variant_yields_substantial already run both methods over one
            identical ledger (35.00 vs 55.00 against the 50.00 threshold) and assert the
            opposite outcomes, which is exactly this claim plus the delta.

      - name: crs_class_variant_is_selected_by_the_lifecycle_step
        claim_type: variant_selection
        grounds:
          - calculations.crs_class_determination.variants
          - state_machines.CrsCycle
        excluded_because:
          difficulty_instance: crs_class_claimed_provisional_diverges_from_verified_final
          rationale: |
            That §1.8 instance drives submit (claimed_provisional written only to
            provisional_class) and certify (verified_final written to resulting_class and to
            Community.crs_class) on one cycle and asserts the two classes differ, covering
            both variant selection and the reconciliation delta.

      - name: minimum_counted_cost_constant_is_applied_inclusively
        claim_type: constants_applied
        grounds:
          - calculations.structure_improvement_aggregates.constants.MIN_COUNTED_COST_USD
          - entities.ImprovementRecord.fields.counted_in_cumulative
        excluded_because:
          difficulty_instance: counted_cost_threshold_includes_exactly_five_hundred_excludes_499_99
          rationale: |
            The inclusive boundary of MIN_COUNTED_COST_USD is that §1.8
            boundary_precision_check instance's subject: it appends 500.00 and 499.99 to the
            same structure and asserts counted_in_cumulative true and false respectively.

      - name: crs_class_threshold_is_inclusive_at_five_hundred_points
        claim_type: threshold_boundary
        grounds:
          - calculations.crs_class_determination.constants.CRS_POINTS_PER_CLASS
          - entities.CrsCycle.fields.provisional_class
        excluded_because:
          difficulty_instance: crs_class_boundary_exactly_five_hundred_points_yields_class_nine
          rationale: |
            That §1.8 boundary_precision_check instance already submits a cycle at exactly
            500 claimed points and asserts provisional_class 9, together with the 499-point
            neighbour that stays at class 10.

      - name: outreach_credit_uses_the_mean_of_rounded_area_coverages
        claim_type: weighted_scoring_precision
        grounds:
          - calculations.outreach_coverage_and_credit
          - calculations.higher_standard_credit
        excluded_because:
          difficulty_instance: outreach_score_is_mean_of_rounded_area_coverages_not_pooled_ratio
          rationale: |
            The normative step order (round per area first, then average, never pool
            numerators and denominators) is that §1.8 combinatorial_formula instance, which
            constructs two areas whose mean and pooled ratio straddle the 75.00 partial-credit
            tier so the two implementations award different points.

  # ===========================================================================
  - section: validations
    instances:

      - name: property_creation_on_a_pending_panel_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_44
          - errors.ERR_PANEL_NOT_EFFECTIVE
          - endpoints."POST /floodplain/properties"
        distinguishing_aspect: |
          A filed but never activated panel is PENDING_REVISION, so parcel creation against it
          returns 422 ERR_PANEL_NOT_EFFECTIVE — the panel exists (so this is not the
          priority-25 404) but is not yet the governing map.
        test_recipe:
          setup:
            - "Community; one panel filed and left in PENDING_REVISION."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_PANEL_NOT_EFFECTIVE'"
            - "FirmPanel.${panel_id}.status == PENDING_REVISION"

      - name: permit_approval_one_tenth_below_the_requirement_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_52
          - errors.ERR_ELEVATION_BELOW_REQUIRED
          - calculations.required_lowest_floor_elevation
        distinguishing_aspect: |
          A proposed lowest floor of 13.4 ft is exactly one tenth below the computed 13.5 ft
          requirement, so APPROVE returns 422 ERR_ELEVATION_BELOW_REQUIRED and the permit
          stays UNDER_REVIEW at revision_round 0 — the comparison is inclusive, so only a
          strictly deficient elevation is refused.
        test_recipe:
          setup:
            - "Canonical base fixture; permit submitted with proposed_lowest_floor_elevation_ft 13.4 (requirement 13.5)."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 20000.00, proposed_lowest_floor_elevation_ft: 13.4 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
          trigger:
            - call: "POST /floodplain/permits/${permit_id}/review"
              payload: { decision: "APPROVE" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_ELEVATION_BELOW_REQUIRED'"
            - "DevelopmentPermit.${permit_id}.status == UNDER_REVIEW"
            - "DevelopmentPermit.${permit_id}.required_lowest_floor_elevation_ft == 13.5"
            - "DevelopmentPermit.${permit_id}.revision_round == 0"

      - name: certificate_acceptance_with_a_negative_margin_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_52
          - errors.ERR_ELEVATION_BELOW_REQUIRED
          - calculations.certificate_datum_normalization
        distinguishing_aspect: |
          The same priority-52 row also guards certificate acceptance: a 13.4 ft NAVD88
          finished-construction survey yields freeboard_margin_ft -0.1, so ACCEPT is refused,
          the certificate stays SUBMITTED and the structure's lowest_floor_elevation_ft is
          never written.
        test_recipe:
          setup:
            - "Canonical base fixture; permit ISSUED with requirement 13.5; FINISHED_CONSTRUCTION certificate filed at 13.4 ft NAVD88."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
