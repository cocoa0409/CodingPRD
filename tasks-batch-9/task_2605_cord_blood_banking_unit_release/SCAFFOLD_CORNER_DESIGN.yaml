# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task 2605 (Cord Blood Banking & Unit Release)
# One section per row-group of references/claim-extraction-guide.md; every instance is either a
# concrete recipe or an `excluded_because` stub naming the SCAFFOLD_DIFFICULTY_DESIGN.yaml instance
# that already covers the corner. Every chain starts from an EMPTY database and opens with
# POST /_clock/set_current_utc {current_utc: "2026-08-01T00:00:00Z"}.
scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_enrollment_create_returns_declared_fields_and_system_defaults
        claim_type: creation
        grounds: "§1.1 Enrollment declares program_type / primary_parent_name / expected_delivery_date / collection_site_code as source: input and lifecycle_status, consent_status, consent_version, consent_amendment_count as source: system with defaults; §1.5 POST /cbb/enrollments returns 201."
        distinguishing_aspect: "Pure creation surface: asserts the 201 envelope and every declared field of a freshly created row, no state machine motion beyond the initial state."
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01", research_use_authorized: true, hla_typing_consent: true }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
          assert:
            - "HTTP 201 and the response body is the single-key envelope {data: {...}}"
            - "data.program_type == PRIVATE_FAMILY, data.primary_parent_name == Avery Lin, data.collection_site_code == SITE-01"
            - "data.research_use_authorized == true and data.hla_typing_consent == true (input values honoured, not overwritten by the declared defaults)"
            - "data.lifecycle_status == CONSENT_PENDING, data.consent_status == PENDING, data.consent_version == 0, data.consent_amendment_count == 0"
            - "data.consent_signed_at == null and data.withdrawal_reason_code == null"
            - "data.id is a bare UUID string with no entity prefix; data.created_at == 2026-08-01T00:00:00Z; data.version == 1"

      - name: corner_enrollment_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds: "§1.5 GET /cbb/enrollments/{id} returns Enrollment with code 200 and no side effects."
        distinguishing_aspect: "Read-after-write identity on the same row: the GET body must equal the POST body field for field, including version, proving no read-path recomputation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PUBLIC_DONATION enrollment created at that instant, version 1, never mutated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PUBLIC_DONATION", primary_parent_name: "Dana Ruiz", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-02" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
          trigger:
            - call: "GET /cbb/enrollments/${enr_id}"
              as: IntakeCoordinator
              as_user_id: "ic-001"
          assert:
            - "HTTP 200 and data.id == ${enr_id}"
            - "data.program_type == PUBLIC_DONATION, data.primary_parent_name == Dana Ruiz, data.collection_site_code == SITE-02"
            - "data.version == 1 and data.updated_at == data.created_at (a pure read mutates nothing)"

      - name: corner_enrollment_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: "§1.0 pagination_defaults {limit: 10, min: 1, max: 100, offset: 0}; §1.5 GET /cbb/enrollments is a paginated list ordered created_at ASC."
        distinguishing_aspect: "Pagination arithmetic on a 3-row set: limit/offset windowing plus the total_count and has_more contract, with the declared created_at ASC order."
        test_recipe:
          setup:
            - "Logical clock advanced through 2026-08-01T00:00:00Z, 00:01:00Z and 00:02:00Z."
            - "Three enrollments created one minute apart, so the declared created_at ASC order is A, B, C."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Parent A", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:01:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Parent B", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_b: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:02:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PUBLIC_DONATION", primary_parent_name: "Parent C", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_c: "$.data.id" }
          trigger:
            - call: "GET /cbb/enrollments?limit=2&offset=0"
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /cbb/enrollments?limit=2&offset=2"
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /cbb/enrollments"
              as: PlatformAdmin
              as_user_id: "admin-001"
          assert:
            - "first page: HTTP 200, len(data) == 2, data[0].id == ${enr_a}, data[1].id == ${enr_b}, total_count == 3, has_more == true"
            - "second page: len(data) == 1, data[0].id == ${enr_c}, total_count == 3, has_more == false"
            - "unparameterised call: len(data) == 3 (default limit 10 exceeds the row count), total_count == 3, has_more == false"

      - name: corner_unit_get_with_unknown_uuid_returns_unit_not_found
        claim_type: not_found
        grounds: "§1.6 ERR_UNIT_NOT_FOUND (404) — CordBloodUnit id in the path does not resolve."
        distinguishing_aspect: "404 surface on a well-formed but absent id, asserting the entity-specific code rather than a generic not-found."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "No CordBloodUnit row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cbb/units/00000000-0000-4000-8000-000000000000"
              as: MedicalDirector
              as_user_id: "md-001"
          assert:
            - "HTTP 404 with error.error_id == ERR_UNIT_NOT_FOUND"
            - "the body is the single-key {error: {...}} envelope and carries no data key"

      - name: corner_enrollment_create_without_expected_delivery_date_is_rejected
        claim_type: required_fields
        grounds: "§1.1 Enrollment.expected_delivery_date is source: input with no default; §1.4 priority 1 request_shape -> ERR_VALIDATION_FAILED (422)."
        distinguishing_aspect: "Missing-required-field surface: the request never reaches any business rule, so the highest-priority request_shape validation must answer."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
          assert:
            - "HTTP 422 with error.error_id == ERR_VALIDATION_FAILED"
            - "no Enrollment row is created: GET /cbb/enrollments returns total_count == 0"

      - name: corner_enrollment_create_omitting_consent_flags_applies_false_defaults
        claim_type: defaults
        grounds: "§1.1 Enrollment.research_use_authorized and .hla_typing_consent are source: input with default: false; §1.5 declares both as optional inputs."
        distinguishing_aspect: "Default application for omitted optional booleans — asserts false, not null and not absent, which is what the later PUBLIC listing gate reads."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PUBLIC_DONATION", primary_parent_name: "Dana Ruiz", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-02" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
          assert:
            - "HTTP 201 and data.research_use_authorized == false (present in the body, boolean false, not null)"
            - "data.hla_typing_consent == false"
            - "GET /cbb/enrollments/${enr_id} returns the same two false values"

      - name: corner_collection_net_volume_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds: "§1.1 Collection.net_volume_ml is source: computed; §1.3 collection_net_volume = round_half_up(collection_volume_ml - anticoagulant_volume_ml, 1)."
        distinguishing_aspect: "Computed-field authority: a hostile client-supplied net_volume_ml is discarded and the formula's value is stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T06:00:00Z."
            - "One CONSENTED PRIVATE_FAMILY enrollment (lifecycle KIT_DISPATCHED) with one DISPATCHED kit that expires 2026-11-29T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-aaa" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_id}", kit_lot_code: "LOT-1", courier_tracking_code: "TRK-1" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { kit_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL", net_volume_ml: 999.9 }
              as: CollectionSite
              as_user_id: "cs-001"
              captures: { col_id: "$.data.id" }
          assert:
            - "HTTP 201 and data.net_volume_ml == 105.0 (130.0 - 25.0), not the submitted 999.9"
            - "data.hours_to_receipt == null and data.received_at == null (both computed at receive, not at creation)"
            - "data.status == COLLECTED"

      - name: corner_storage_tank_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: "§1.1 StorageTank.status / last_temperature_c / last_reading_at are source: system, occupied_slots is source: computed, and common_fields: true supplies id / created_at / updated_at / version."
        distinguishing_aspect: "System-field authority on a root entity: id, version, created_at, status and occupied_slots are all server-owned and a client attempt to seed them is discarded."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-A", tank_class: "STANDARD", capacity_slots: 4, id: "11111111-1111-4111-8111-111111111111", created_at: "2000-01-01T00:00:00Z", version: 77, status: "OFFLINE", occupied_slots: 3 }
              as: FacilitiesEngineer
              as_user_id: "fe-001"
              captures: { tank_id: "$.data.id" }
          assert:
            - "HTTP 201 and data.id != 11111111-1111-4111-8111-111111111111"
            - "data.created_at == 2026-08-01T00:00:00Z (logical clock, not the submitted 2000-01-01)"
            - "data.version == 1 (not 77)"
            - "data.status == ONLINE (declared default, not the submitted OFFLINE)"
            - "data.occupied_slots == 0 (computed from zero units, not the submitted 3)"
            - "data.last_temperature_c == null and data.last_reading_at == null"

      - name: corner_enrollment_create_with_undeclared_program_type_is_rejected
        claim_type: type_constraints
        grounds: "§1.1 Enrollment.program_type constraints: one of {PRIVATE_FAMILY, PUBLIC_DONATION}; §1.4 priority 2 enum_domain -> ERR_VALIDATION_FAILED (422)."
        distinguishing_aspect: "Enum-domain rejection: the value is present and well typed but outside the declared domain, and it is refused before any business rule runs."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/enrollments"
              payload: { program_type: "RESEARCH_ONLY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-B", tank_class: "CRYO_DELUXE", capacity_slots: 4 }
              as: FacilitiesEngineer
              as_user_id: "fe-001"
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-C", tank_class: "STANDARD", capacity_slots: 0 }
              as: FacilitiesEngineer
              as_user_id: "fe-001"
          assert:
            - "the program_type call returns HTTP 422 with error.error_id == ERR_VALIDATION_FAILED"
            - "the tank_class call returns HTTP 422 with error.error_id == ERR_VALIDATION_FAILED"
            - "the capacity_slots == 0 call returns HTTP 422 with error.error_id == ERR_VALIDATION_FAILED (declared constraint >= 1)"
            - "GET /cbb/storage-tanks returns total_count == 0"

      - name: corner_quality_test_row_is_immutable_and_version_free
        claim_type: immutability
        grounds: "§1.1 QualityTest declares common_fields: false; §1.5 exposes only POST /cbb/quality-tests and reads (GET /cbb/quality-tests/{id}, GET /cbb/units/{id}/quality-tests) — no PATCH, PUT or DELETE."
        distinguishing_aspect: "The only common_fields: false entity in the scaffold: the row carries no version / updated_at, is never a target of an OCC rule, and is re-readable byte-identically."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T00:00:00Z."
            - "One CONSENTED PRIVATE_FAMILY enrollment whose collection was received (net_volume_ml 105.0, hours_to_receipt 19.00)."
            - "Its unit is VOLUME_REDUCED with one COMPLETED processing run (post_volume_ml 25.0, post_tnc_millions 1000) and no QualityTest row yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-aaa" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_id}", kit_lot_code: "LOT-1", courier_tracking_code: "TRK-1" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { kit_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              as_user_id: "cs-001"
              captures: { col_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/collections/${col_id}/receive"
              payload: { transport_temp_c: 20.0 }
              as: ProcessingTechnologist
              as_user_id: "pt-001"
            - call: "GET /cbb/collections/${col_id}/units"
              as: ProcessingTechnologist
              as_user_id: "pt-001"
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /cbb/processing-runs"
              payload: { unit_id: "${unit_id}", method: "HES_SEDIMENTATION", pre_tnc_millions: 1100 }
              as: ProcessingTechnologist
              as_user_id: "pt-001"
              captures: { run_id: "$.data.id" }
            - call: "POST /cbb/processing-runs/${run_id}/complete"
              payload: { outcome: "COMPLETED", post_volume_ml: 25.0, post_tnc_millions: 1000 }
              as: ProcessingTechnologist
              as_user_id: "pt-001"
          trigger:
            - call: "POST /cbb/quality-tests"
              payload: { unit_id: "${unit_id}", test_kind: "POST_PROCESSING", tnc_millions: 1000, cd34_thousands: 2400, viability_pct: 88.0, volume_ml: 25.0, sterility_result: "NEGATIVE" }
              as: ProcessingTechnologist
              as_user_id: "pt-001"
              captures: { qt_id: "$.data.id" }
            - call: "GET /cbb/quality-tests/${qt_id}"
              as: MedicalDirector
              as_user_id: "md-001"
          assert:
            - "HTTP 201 on creation; the response data has NO version key and NO updated_at key (common_fields: false)"
            - "data.created_at is absent as well — only the declared fields plus id are present"
            - "data.performed_at == 2026-08-11T00:00:00Z and data.performed_by_user_id == pt-001"
            - "data.outcome == PASS and data.failure_reason_codes == [] (PRIVATE_TIER: 1000 >= 400, 2400 >= 500, 88.0 >= 75.0, sterility NEGATIVE)"
            - "the GET body equals the POST body field for field"

      - name: corner_collection_against_unknown_kit_returns_kit_not_found
        claim_type: parent_relationships
        grounds: "§1.1 declares every entity with parent: null (flat topology), so the parent role is carried by declared FK fields — Collection.kit_id -> CollectionKit.id; §1.6 ERR_KIT_NOT_FOUND (404)."
        distinguishing_aspect: "FK-as-parent resolution failure: the body FK is validated before any kit-state or consent rule, so a bogus kit_id yields 404 rather than the 409 family."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-10T06:00:00Z."
            - "No CollectionKit and no Enrollment row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/collections"
              payload: { kit_id: "00000000-0000-4000-8000-0000000000ff", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              as_user_id: "cs-001"
            - call: "POST /cbb/storage-accounts"
              payload: { enrollment_id: "00000000-0000-4000-8000-0000000000fe", billing_contact_email: "a@example.com", plan_term_years: 5, prepaid_through_date: "2031-08-01T00:00:00Z" }
              as: BillingAdministrator
              as_user_id: "ba-001"
          assert:
            - "the collection call returns HTTP 404 with error.error_id == ERR_KIT_NOT_FOUND (not ERR_CONSENT_NOT_CURRENT and not ERR_INVALID_KIT_STATE)"
            - "the storage-account call returns HTTP 404 with error.error_id == ERR_ENROLLMENT_NOT_FOUND"
            - "no Collection and no StorageAccount row is created"

      - name: corner_kit_fk_is_reverse_reachable_and_scoped_per_enrollment
        claim_type: foreign_key_integrity
        grounds: "§1.0 complexity_profile.entity_topology: flat; §1.5 GET /cbb/enrollments/{id}/collection-kits is the reverse-navigation channel for the CollectionKit.enrollment_id FK."
        distinguishing_aspect: "Flat-topology cross-reference integrity: with two enrollments each owning one kit, every sub-resource listing returns exactly its own child and never the sibling's."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two CONSENTED PRIVATE_FAMILY enrollments, each owning exactly one DISPATCHED kit; neither has a StorageAccount."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Parent One", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_1: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_1}/consent"
              payload: { consent_document_hash: "hash-1" }
              as: ParentGuardian
              as_user_id: "${enr_1}"
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Parent Two", expected_delivery_date: "2026-08-12T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_2: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_2}/consent"
              payload: { consent_document_hash: "hash-2" }
              as: ParentGuardian
              as_user_id: "${enr_2}"
