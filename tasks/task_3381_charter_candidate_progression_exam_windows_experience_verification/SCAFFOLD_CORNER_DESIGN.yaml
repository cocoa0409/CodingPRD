  # ===========================================================================
  - section: calculations
    instances:
      - name: c_months_between_partial_month_precision
        claim_type: Precision
        grounds:
          - calculations.experience_months_evaluation
        distinguishing_aspect: "The day-compare rule decides whole months: 2024-01-15..2025-01-14 counts 11 (end day 14 < start day 15) while 2025-03-15..2026-03-15 counts 12 — provisional_months for the two non-overlapping segments is exactly 23, not 24."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A. Submission with two non-overlapping 80% segments: 2024-01-15..2025-01-14 and 2025-03-15..2026-03-15."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - call: "POST /charter/candidates/${cand_a}/experience-submissions"
              payload: { segments: [ { employer_name: "Gamma Partners", role_title: "Associate", start_date: "2024-01-15", end_date: "2025-01-14", qualifying_activity_pct: 80, hours: 1900 }, { employer_name: "Delta Investors", role_title: "Associate", start_date: "2025-03-15", end_date: "2026-03-15", qualifying_activity_pct: 80, hours: 2000 } ] }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_p: $.data.id }
            - call: "POST /charter/experience-submissions/${sub_p}/references"
              payload: { referee_name: "Ref One", referee_email: "ref1@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /charter/experience-submissions/${sub_p}/references"
              payload: { referee_name: "Ref Two", referee_email: "ref2@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
          trigger:
            - call: "POST /charter/experience-submissions/${sub_p}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { prov: $.data.provisional_months }
          assert:
            - "prov == 23 (11 months for the first segment by the day-compare rule, 12 for the second)"
            - "a reading without the day-compare correction would give 24 — the precision rule is load-bearing"

      - name: c_attempt_cap_counts_only_target_level_valid_attempts
        claim_type: Input Set Filtering
        grounds:
          - calculations.retake_eligibility_evaluation
          - errors.ERR_MAX_ATTEMPTS_REACHED
        distinguishing_aspect: "The attempts cap counts only attempts at the target level with validity IN {VALID, REINSTATED}: with max_attempts 1 on LEVEL_I, one FAIL exhausts the level and a later-window rebooking is 422 ERR_MAX_ATTEMPTS_REACHED."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A ENROLLED. LEVEL_I configured with max_attempts 1; windows WF [2027-03-01, 2027-03-15) and WL [2027-03-29, 2027-04-12). A sat WF and scored 600 (FAIL). Clock at 2027-03-16."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - call: "POST /charter/exam-levels"
              payload: { level_code: "LEVEL_I", mps_scaled_score: 700, max_attempts: 1, early_fee_cents: 94000, standard_fee_cents: 125000 }
              as: ProgramAdmin
              captures: { lvl1c: $.data.id }
            - call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1c}", window_opens_at: "2027-03-01T00:00:00Z", window_closes_at: "2027-03-15T00:00:00Z", scheduling_deadline_at: "2027-02-20T00:00:00Z", reschedule_deadline_at: "2027-03-08T00:00:00Z", early_fee_deadline_at: "2027-01-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { winf: $.data.id }
            - call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1c}", window_opens_at: "2027-03-29T00:00:00Z", window_closes_at: "2027-04-12T00:00:00Z", scheduling_deadline_at: "2027-04-01T00:00:00Z", reschedule_deadline_at: "2027-04-05T00:00:00Z", early_fee_deadline_at: "2027-03-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { winl: $.data.id }
            - *c_ctr2
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${winf}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_f: $.data.id }
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 94000 }
              as: ProgramAdmin
            - *c_clock_mar03
            - call: "POST /charter/appointments/${appt_f}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
            - call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_f}" }
              as: ProgramAdmin
              captures: { att_f: "$.data[0].id" }
            - *c_clock_mar16
            - call: "POST /charter/exam-attempts/${att_f}/score"
              payload: { scaled_score: 600 }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${winl}", test_center_id: "${ctr2}", exam_date: "2027-04-01", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_MAX_ATTEMPTS_REACHED (attempts_used 1 >= max_attempts 1)"
            - "the failed attempt remains VALID and counted: GET /charter/exam-attempts?candidate_id=${cand_a} shows 1 row with result FAIL"
            - "ProgramEnrollment.${enr_a}.lifetime_charges_cents unchanged at 129003 (no charge on the rejected booking)"

      - name: c_provisional_excludes_sub_threshold_segments
        claim_type: Input Set Filtering
        grounds:
          - calculations.experience_months_evaluation
          - entities.WorkExperienceSubmission.fields.provisional_months
        distinguishing_aspect: "Segments with qualifying_activity_pct < 50 drop out of BOTH variants, and exactly-50 qualifies (>= boundary): segments at 80% (12 months) and 49% (12 months) yield provisional_months 12, not 24."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A. Submission with segment Q1 2022-01-10..2023-01-10 at 50% and Q2 2023-02-10..2024-02-10 at 49%; two references attached."
          setup_api_calls:
