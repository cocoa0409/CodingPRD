  - rule_id: compensating_invariant
    instances:
      - name: voiding_a_final_assessment_restores_program_exposure_to_zero_and_unfreezes_posture
        grounds:
          - state_machines.ExposureAssessment.FINAL_to_VOID
          - entities.ComplianceProgram.fields.pra_exposure_cents
          - calculations.program_posture
          - state_machines.ExposureAssessment.DRAFT_to_FINAL
        distinguishing_aspect: |
          Conserved quantity: ComplianceProgram.pra_exposure_cents, the monetary ledger of FINAL
          litigation exposure. Finalizing adds 875000 (which lands exactly on the 80% freeze
          boundary against the 1093750 ceiling and flips the posture to FROZEN); voiding subtracts
          exactly the same 875000, returning the ledger to its pre-finalization 0 and the posture to
          RESTRICTED with zero drift.
        test_recipe:
          setup:
            - "One ComplianceProgram with exposure_ceiling_cents 1093750 and Jurisdiction IL (FULL, STATUTORY_PER_VIOLATION, 100000/500000, cure_period_days 0, no statutory cap)."
            - "A PUBLISHED policy, a PUBLISHED (IL, EMPLOYEE) notice and one ACTIVE in-house BiometricAsset."
            - "DataSubject EMP-0001 with one REVOKED ConsentRecord (whose auto accommodation is still merely REQUESTED, so it counts as a reckless unit) plus one SOLICITED record, and DataSubject EMP-0002 with one SOLICITED record: two negligent units and one reckless unit."
            - "One DRAFT ExposureAssessment created by po-1 under variant PER_VIOLATION_STACKED with exposure_cents 875000; ComplianceProgram.pra_exposure_cents is 0 and posture is RESTRICTED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
