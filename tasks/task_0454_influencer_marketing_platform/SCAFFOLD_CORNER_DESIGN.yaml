scaffold_corner_design:

  # =================================================================
  # Entities — creation / retrieval / required-fields / computed / type-constraints
  # =================================================================
  - section: entities
    instances:
      - name: create_brand_returns_201_with_computed_budget_fields
        claim_type: Creation
        grounds: [entities.Brand, 'endpoints[POST /brands]']
        distinguishing_aspect: "POST /brands with legal_name/contact_email/budget_cents returns 201; committed_cents==0 and available_budget_cents==budget_cents."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /brands"
              payload: { legal_name: "Acme", contact_email: "ops@acme.com", budget_cents: 250000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Brand.${brand_id}.committed_cents == 0"
            - "Brand.${brand_id}.available_budget_cents == 250000"
            - "Brand.${brand_id}.version == 1"

      - name: get_creator_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Creator, 'endpoints[GET /creators/{id}]']
        distinguishing_aspect: "GET /creators/{id} returns the stored creator with discovery_status NEW and brand_safety_status CLEAR before any snapshot/flag."
        test_recipe:
          setup: ["One creator registered, no snapshot, no flag"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { handle: "@plain", primary_platform: "INSTAGRAM" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
          trigger:
            - call: "GET /creators/${creator_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ds: $.data.discovery_status, bs: $.data.brand_safety_status }
          assert:
            - "data.discovery_status == 'NEW'"
            - "data.brand_safety_status == 'CLEAR'"
            - "data.ytd_paid_cents == 0"

      - name: list_creators_pagination_envelope
        claim_type: Listing
        grounds: [entities.Creator, 'endpoints[GET /creators]']
        distinguishing_aspect: "GET /creators returns a paginated array envelope with total_count and has_more reflecting the registered creators."
        test_recipe:
          setup: ["Two creators registered"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { handle: "@a", primary_platform: "INSTAGRAM" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { handle: "@b", primary_platform: "TIKTOK" }
              as: PlatformAdmin
          trigger:
            - call: "GET /creators"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == 'array'"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "len(data) == 1"

      - name: get_creator_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Creator, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /creators/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /creators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_NOT_FOUND'"

      - name: create_campaign_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Campaign, 'validations[priority=5]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /campaigns without campaign_budget_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A brand exists"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "B", contact_email: "b@b.com", budget_cents: 100000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "NoBudget", starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: campaign_requires_ftc_disclosure_default_true
        claim_type: Defaults
        grounds: [entities.Campaign.fields.requires_ftc_disclosure]
        distinguishing_aspect: "Omitting requires_ftc_disclosure on POST /campaigns applies the default true."
        test_recipe:
          setup: ["A brand exists"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "B", contact_email: "b@b.com", budget_cents: 100000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "Def", campaign_budget_cents: 50000, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp_id: $.data.id }
          assert:
            - "Campaign.${camp_id}.requires_ftc_disclosure == true"

      - name: ftc_disclosure_computed_from_caption
        claim_type: Computed Fields
        grounds: [entities.ContentSubmission.fields.has_ftc_disclosure, calculations.ftc_disclosure_detect]
        distinguishing_aspect: "On POST /content-submissions a caption containing '#ad' sets has_ftc_disclosure true; any client-supplied value is ignored (field is computed)."
        test_recipe:
          setup: ["ACTIVE contract with one deliverable (FTC required)"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "FC", contact_email: "f@f.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@ftc", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "FC", campaign_budget_cents: 200000, requires_ftc_disclosure: true, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 60000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 60000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/ftc", caption: "check this out #AD friends" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub_id: $.data.id, ftc: $.data.has_ftc_disclosure }
          assert:
            - "ContentSubmission.${sub_id}.has_ftc_disclosure == true"

      - name: creator_invalid_platform_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Creator.fields.primary_platform, 'validations[priority=5]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /creators with primary_platform 'FACEBOOK' (not in enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /creators"
              payload: { handle: "@bad", primary_platform: "FACEBOOK" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: audience_snapshot_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.AudienceSnapshot, 'endpoints[POST /creators/{id}/audience-snapshots]']
        distinguishing_aspect: "AudienceSnapshot has common_fields:false — no version field, no update endpoint; only id, created_at, and the recorded metrics."
        test_recipe:
          setup: ["One creator"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { handle: "@imm", primary_platform: "TIKTOK" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
          trigger:
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 1000, avg_engagement_rate: 0.05, estimated_reach: 500, fake_follower_pct: 0.05 }
              as: PlatformAdmin
              captures: { snap_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response data has id and created_at but no version field"

  # =================================================================
  # State machines — invalid transitions / terminal lockdown / idempotency / initial
  # =================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_campaign_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Campaign.DRAFT_to_CANCELLED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Cancelling a CANCELLED campaign returns ERR_INVALID_STATE (409); no defined transition from CANCELLED."
        test_recipe:
          setup: ["A DRAFT campaign, then cancelled"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "C", contact_email: "c@c.com", budget_cents: 100000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "X", campaign_budget_cents: 50000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${camp_id}/cancel"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/cancel"
              payload: { expected_campaign_version: "${cv1}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"

      - name: open_campaign_with_no_deliverables_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Campaign.DRAFT_to_OPEN, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Opening a DRAFT campaign that has zero deliverables fails the >=1-deliverable precondition with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT campaign with no deliverables"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "C", contact_email: "c@c.com", budget_cents: 100000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "ND", campaign_budget_cents: 50000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp_id: $.data.id, cv0: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"

      - name: settle_pending_payout_without_release_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Payout.RELEASED_to_SETTLED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Settling a PENDING (not RELEASED) payout returns ERR_INVALID_STATE (409); SETTLE is only defined from RELEASED."
        test_recipe:
          setup: ["W-9 creator with a FULFILLED contract and a PENDING (un-released) payout"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "P", contact_email: "p@p.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@pend", primary_platform: "YOUTUBE", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "P", campaign_budget_cents: 200000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "VIDEO", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 80000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 80000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/p0", caption: "ok" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /content-submissions/${sub_id}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { kv: $.data.version }
            - call: "POST /payouts"
              payload: { contract_id: "${contract_id}", expected_contract_version: "${kv}" }
              as: ComplianceOfficer
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /payouts/${payout_id}/settle"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"

      - name: file_voided_1099_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TaxForm1099.GENERATED_to_VOIDED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Filing a VOIDED 1099 returns ERR_INVALID_STATE (409); VOIDED is terminal."
        test_recipe:
          setup: ["A creator with a GENERATED 1099 (settled payout net 64000) then voided"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "T", contact_email: "t@t.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@void", primary_platform: "YOUTUBE", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "T", campaign_budget_cents: 200000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "VIDEO", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 80000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 80000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/v0", caption: "ok" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /content-submissions/${sub_id}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { kv: $.data.version }
            - call: "POST /payouts"
              payload: { contract_id: "${contract_id}", expected_contract_version: "${kv}" }
              as: ComplianceOfficer
              captures: { payout_id: $.data.id }
            - call: "POST /payouts/${payout_id}/release"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /payouts/${payout_id}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /creators/${creator_id}/tax-forms"
              payload: {}
              as: ComplianceOfficer
              captures: { form_id: "$.data[0].id" }
            - call: "POST /tax-forms/${form_id}/void"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /tax-forms/${form_id}/file"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"

      - name: new_offer_starts_in_offered_state
        claim_type: Initial State
        grounds: [state_machines.Offer, entities.Offer.fields.status]
        distinguishing_aspect: "A freshly created Offer has status OFFERED, round_count 0, last_actor equal to initiated_by (BRAND when a Brand opens it)."
        test_recipe:
          setup: ["OPEN campaign"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "O", contact_email: "o@o.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@init", primary_platform: "INSTAGRAM" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "O", campaign_budget_cents: 200000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 60000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
          trigger:
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 60000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id }
          assert:
            - "Offer.${offer_id}.status == OFFERED"
            - "Offer.${offer_id}.round_count == 0"
            - "Offer.${offer_id}.last_actor == BRAND"

      - name: counter_own_move_returns_wrong_turn
        claim_type: Precondition Enforcement
        grounds: [state_machines.Offer.OFFERED_to_COUNTERED, 'validations[priority=9]', 'errors[ERR_WRONG_TURN]']
        distinguishing_aspect: "The Brand (= last_actor after opening) trying to counter its own offer returns ERR_WRONG_TURN (409); the move must come from the opposite side."
        test_recipe:
          setup: ["OPEN campaign; Brand-opened offer (last_actor=BRAND)"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "WT", contact_email: "w@w.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@wt", primary_platform: "INSTAGRAM" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "WT", campaign_budget_cents: 200000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
