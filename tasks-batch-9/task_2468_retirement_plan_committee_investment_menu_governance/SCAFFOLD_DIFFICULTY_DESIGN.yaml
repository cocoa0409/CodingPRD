  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Two instances on DIFFERENT entities: (1) CommitteeMember fork-join with a
  # declared dead-end edge, (2) FundReplacementProposal revision cycle that
  # returns to a state it already occupied and is bounded by a counter.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: member_fork_join_training_and_acceptance_branches_order_independent
        grounds:
          - state_machines.CommitteeMember.APPOINTED_to_TRAINING_ASSIGNED
          - state_machines.CommitteeMember.APPOINTED_to_ACCEPTANCE_PENDING
          - state_machines.CommitteeMember.TRAINING_ASSIGNED_to_ACCEPTANCE_PENDING
          - state_machines.CommitteeMember.TRAINING_ASSIGNED_to_ACTIVE
          - state_machines.CommitteeMember.ACCEPTANCE_PENDING_to_ACTIVE
          - calculations.fiduciary_training_status
          - entities.CommitteeMember.fields.status
          - entities.CommitteeMember.fields.acceptance_signed_at
          - entities.CommitteeMember.fields.fiduciary_training_status
          - entities.Plan.fields.documented_acceptance_count
          - validations[priority=50]
          - validations[priority=87]
        distinguishing_aspect: |
          CommitteeMember is a fork-join, not a line: the training branch and the acceptance branch
          may be walked in either order (member A takes training first and reaches ACTIVE via
          TRAINING_ASSIGNED -> ACCEPTANCE_PENDING; member B signs acceptance first and reaches ACTIVE
          from ACCEPTANCE_PENDING while its later training records produce NO status change), and the
          join at /activate requires BOTH branches, so the training-only member is rejected with
          ERR_FIDUCIARY_ACCEPTANCE_MISSING and the acceptance-only member with ERR_TRAINING_NOT_CURRENT.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Plan with charter_status ADOPTED, max_voting_seats 2, quorum_min_voting_members 2."
            - "Two FILLED voting CommitteeSeat rows, each holding one CommitteeMember with status APPOINTED."
            - "Plan.documented_acceptance_count == 0; no FiduciaryTrainingRecord rows exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
              payload: { plan_name: "Granite 401(k) Plan", plan_sponsor_name: "Granite Rail Holdings", erisa_covered: true, participant_account_count: 100, menu_slot_capacity: 6, quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "CHAIR", seat_class: "CHAIR", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              captures: { seat_a_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "FIN-1", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
              captures: { seat_b_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, charter_doc_ref: "CHARTER-GR-V1" }
