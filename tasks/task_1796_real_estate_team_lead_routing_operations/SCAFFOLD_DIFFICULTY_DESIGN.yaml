            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead One", contact_phone: "+15125550070", contact_email: "l1@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead1: $.data.id } }
            - { call: "POST /crm/leads/${lead1}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:15:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead Two", contact_phone: "+15125550071", contact_email: "l2@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead2: $.data.id } }
            - { call: "POST /crm/leads/${lead2}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
