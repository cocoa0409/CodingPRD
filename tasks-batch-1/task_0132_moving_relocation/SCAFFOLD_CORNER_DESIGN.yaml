# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every active instance's setup_api_calls is empty-DB reachable via §1.5.
# excluded_because: stubs cite a §1.8 instance by name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_move_job_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.MoveJob, endpoints]
        distinguishing_aspect: "POST /move-jobs with required fields returns 201; job_status defaults QUOTING, payment_status UNPAID, stair_flights/long_carry_units default 0, version 1."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_cr@x.com", full_name: "Cr", origin_state_code: "CA", phone: "555-2000" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          assert:
            - "response.status == 201"
            - "MoveJob.${job_id}.job_status == QUOTING"
            - "MoveJob.${job_id}.payment_status == UNPAID"
            - "MoveJob.${job_id}.stair_flights == 0"
            - "MoveJob.${job_id}.version == 1"

      - name: get_move_job_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.MoveJob, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /move-jobs/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /move-jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_move_job_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.MoveJob, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /move-jobs missing service_type returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_mr@x.com", full_name: "Mr", origin_state_code: "CA", phone: "555-2100" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_move_job_invalid_enum_returns_422
        claim_type: Type Constraints
        grounds: [entities.MoveJob.fields.service_type, "validations[priority=9]", "errors[ERR_INVALID_FIELD]"]
        distinguishing_aspect: "POST /move-jobs with service_type='AIR' (not LOCAL/LONG_HAUL) returns ERR_INVALID_FIELD (422)."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_en@x.com", full_name: "En", origin_state_code: "CA", phone: "555-2200" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "AIR", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_FIELD"

      - name: duplicate_customer_email_returns_409
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.email, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second customer with an email already in use returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A customer with email dup@x.com already registered."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "First", origin_state_code: "CA", phone: "555-2300" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "Second", origin_state_code: "NY", phone: "555-2301" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: duplicate_truck_plate_returns_409
        claim_type: Type Constraints
        grounds: [entities.Truck.fields.plate, "errors[ERR_DUPLICATE_PLATE]"]
        distinguishing_aspect: "Registering a truck with an existing plate returns ERR_DUPLICATE_PLATE (409)."
        test_recipe:
          setup: ["A truck plate DUP-1 registered."]
          setup_api_calls:
            - call: "POST /trucks"
              payload: { plate: "DUP-1", capacity_cubic_feet: 2000, home_state_code: "CA" }
              as: Dispatcher
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /trucks"
              payload: { plate: "DUP-1", capacity_cubic_feet: 1000, home_state_code: "NY" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_PLATE"

      - name: computed_cubic_feet_rollup_input_ignored
        claim_type: Computed Fields
        grounds: [entities.InventorySurvey.fields.total_cubic_feet, calculations.cubic_feet_rollup]
        distinguishing_aspect: "total_cubic_feet and estimated_weight_lbs are server-computed: 2 items (sofa 2@35, box 40@3 = 190cf) yield total_cubic_feet 190, estimated_weight_lbs 1330."
        test_recipe:
          setup: ["A LOCAL job with a fresh survey."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_cf@x.com", full_name: "Cf", origin_state_code: "CA", phone: "555-2400" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "VIRTUAL" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "sofa", quantity: 2, cubic_feet_each: 35 }
              as: Estimator
          trigger:
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
          assert:
            - "InventorySurvey.${survey_id}.total_cubic_feet == 190"
            - "InventorySurvey.${survey_id}.estimated_weight_lbs == 1330"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_job_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.MoveJob.QUOTING_BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a job already in CANCELLED returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A QUOTING job already cancelled."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_cc@x.com", full_name: "Cc", origin_state_code: "CA", phone: "555-2500" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /move-jobs/${job_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /move-jobs/${job_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: revise_accepted_estimate_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Estimate.DRAFT_to_REVISED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revising an ACCEPTED estimate returns ERR_INVALID_STATE (409) — revise is only defined from DRAFT/REVISED."
        test_recipe:
          setup: ["A job with an ACCEPTED estimate (booked)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_ra@x.com", full_name: "Ra", origin_state_code: "CA", phone: "555-2600" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "NON_BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              as_user_id: "est-ra"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /estimates/${est_id}/revise"
              payload: { binding_type: "BINDING" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: complete_scheduled_dispatch_without_depart_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Dispatch.EN_ROUTE_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a SCHEDULED (not EN_ROUTE) dispatch returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED dispatch on a deposit-paid booked job."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_cs@x.com", full_name: "Cs", origin_state_code: "CA", phone: "555-2700" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "NON_BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              as_user_id: "est-cs"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /move-jobs/${job_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 10000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trucks"
              payload: { plate: "CS-TRK", capacity_cubic_feet: 2000, home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "CS Crew", head_count: 3, home_state_code: "CA" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /dispatches"
              payload: { move_job_id: "${job_id}", truck_id: "${truck_id}", crew_id: "${crew_id}", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T12:00:00Z", required_crew_size: 3 }
              as: Dispatcher
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /dispatches/${disp_id}/complete"
              payload: { actual_weight_lbs: 840 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: initial_state_of_new_estimate_is_draft
        claim_type: Initial State
        grounds: [state_machines.Estimate, entities.Estimate.fields.status]
        distinguishing_aspect: "A freshly generated estimate starts in status DRAFT with version 1."
        test_recipe:
          setup: ["A QUOTING job with a survey."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_is@x.com", full_name: "Is", origin_state_code: "CA", phone: "555-2800" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
          trigger:
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.status == DRAFT"
            - "Estimate.${est_id}.version == 1"

      - name: terminal_denied_claim_cannot_be_approved
        claim_type: Terminal State Lockdown
        grounds: [state_machines.DamageClaim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DENIED claim is terminal: approving it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A delivered job with a DENIED claim."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_td@x.com", full_name: "Td", origin_state_code: "CA", phone: "555-2900" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "NON_BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              as_user_id: "est-td"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /move-jobs/${job_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 10000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trucks"
              payload: { plate: "TD-TRK", capacity_cubic_feet: 2000, home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "TD Crew", head_count: 3, home_state_code: "CA" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /dispatches"
              payload: { move_job_id: "${job_id}", truck_id: "${truck_id}", crew_id: "${crew_id}", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T12:00:00Z", required_crew_size: 3 }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/depart"
              payload: {}
              as: Dispatcher
            - call: "POST /dispatches/${disp_id}/complete"
              payload: { actual_weight_lbs: 840 }
              as: Dispatcher
            - call: "POST /damage-claims"
              payload: { move_job_id: "${job_id}" }
              as: ClaimsAdjuster
              as_user_id: "adj-filer"
              captures: { claim_id: $.data.id }
            - call: "POST /damage-claims/${claim_id}/deny"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-approver"
          trigger:
            - call: "POST /damage-claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-approver"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: survey_locked_after_estimate_rejects_new_item
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=8]", "errors[ERR_SURVEY_LOCKED]", entities.InventorySurvey.fields.locked]
        distinguishing_aspect: "Adding a SurveyItem to a survey locked by a generated estimate returns ERR_SURVEY_LOCKED (409)."
        test_recipe:
          setup: ["A survey already used to generate an estimate (locked=true)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_sl@x.com", full_name: "Sl", origin_state_code: "CA", phone: "555-3000" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "lamp", quantity: 1, cubic_feet_each: 5 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SURVEY_LOCKED"

      - name: accept_supersedes_sibling_estimates
        claim_type: Side Effect Execution
        grounds: [state_machines.Estimate.DRAFT_or_REVISED_to_SUPERSEDED, state_machines.MoveJob.QUOTING_to_BOOKED]
        distinguishing_aspect: "Accepting one estimate sets a sibling DRAFT estimate of the same job to SUPERSEDED and books the job."
        test_recipe:
          setup: ["A job with TWO draft estimates from two different surveys."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_su@x.com", full_name: "Su", origin_state_code: "CA", phone: "555-3100" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { s1_id: $.data.id }
            - call: "POST /surveys/${s1_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${s1_id}", binding_type: "BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v1}" }
              as: Estimator
              as_user_id: "est-su"
              captures: { est1_id: $.data.id }
            - call: "GET /move-jobs/${job_id}"
              payload: {}
              as: Estimator
              captures: { job_v2: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "VIRTUAL" }
              as: Estimator
              captures: { s2_id: $.data.id }
            - call: "POST /surveys/${s2_id}/items"
