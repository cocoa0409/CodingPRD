          - state_machines.Candidacy.INFO_REQUESTED_to_SCREENING
        excluded_because:
          difficulty_instance: candidacy_info_request_revision_cycle_bounded
          rationale: |
            POST /candidacies/{id}/supplements is the single operation the plain Elector role owns
            exclusively, and the §1.8 instance already exercises it twice as that role - once per turn of
            the INFO_REQUESTED -> SCREENING revision loop - with the nominating elector's own X-User-ID,
            which simultaneously proves the role may perform its exclusive operation and that the
            entity_backed identity must equal nominated_by_elector_id. Everything else the role can do is
            a shared operation, so there is nothing left here to assert independently.

