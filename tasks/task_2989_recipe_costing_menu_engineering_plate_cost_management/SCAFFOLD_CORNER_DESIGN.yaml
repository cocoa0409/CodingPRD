              as: RecipeDeveloper
              captures: { mi_two: $.data.id }
            - call: "POST /culinary/menu-items/${mi_two}/plate-cost"
              as: CostAnalyst
              captures: { mi_plate: $.data.plate_cost_cents, mi_fcb: $.data.food_cost_bps, mi_cm: $.data.contribution_margin_cents, mi_state0: $.data.plate_cost_state }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-ONE", name: "One Component Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { one_id: $.data.id, one_v0: $.data.version }
            - call: "POST /culinary/recipes/${one_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${one_v0}" }
              as: RecipeDeveloper
              captures: { c_one: $.data.id }
            - call: "POST /culinary/recipes/${one_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${one_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${one_id}/activate"
              as: CulinaryDirector
              captures: { one_v_active: $.data.version }
          trigger:
            - call: "DELETE /culinary/recipe-components/${c_flour}"
              payload: { expected_recipe_version: "${two_v2}" }
              as: RecipeDeveloper
              captures: { d_status: $.data.status, d_removed: $.data.removed_at, d_ext: $.data.extended_cost_micros, d_seq: $.data.sequence_no }
            - call: "GET /culinary/recipes/${two_id}"
              as: RecipeDeveloper
              captures: { after_count: $.data.component_count, after_mask: $.data.allergen_mask, after_kcal: $.data.kcal_per_portion_micros, after_sodium: $.data.sodium_mcg_per_portion, after_batch: $.data.batch_cost_micros, after_state: $.data.cost_state, two_v3: $.data.version }
            - call: "GET /culinary/menu-items/${mi_two}"
              as: RecipeDeveloper
              captures: { mi_state1: $.data.plate_cost_state, mi_class1: $.data.margin_class, mi_plate1: $.data.plate_cost_cents }
            - call: "DELETE /culinary/recipe-components/${c_flour}"
              payload: { expected_recipe_version: "${two_v3}" }
              as: RecipeDeveloper
              captures: { e_already: $.data.error_id }
            - call: "DELETE /culinary/recipe-components/00000000-0000-4000-8000-00000000dead"
              payload: { expected_recipe_version: "${two_v3}" }
              as: RecipeDeveloper
              captures: { e_missing: $.data.error_id }
            - call: "DELETE /culinary/recipe-components/${c_one}"
              payload: { expected_recipe_version: "${one_v_active}" }
              as: RecipeDeveloper
              captures: { e_frozen: $.data.error_id }
            - call: "POST /culinary/recipes/${two_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { re_batch: $.data.batch_cost_micros, re_portion: $.data.portion_cost_micros, re_state: $.data.cost_state }
          assert:
            - "${two_batch} == 3985891 == 3880071 + 105820 (round-then-sum), ${two_portion} == 996473, ${two_mask} == 5 == 1|4, ${two_kcal} == 575000000, ${two_sodium} == 621000 and ${two_count} == 2"
            - "${flour_ap} == 200 (trim 10000, shrink 0 leave ap == ep), ${flour_unit} == 12000000 and ${flour_ext} == 105820"
            - "${mi_plate} == 103, ${mi_fcb} == 2575, ${mi_cm} == 297 and ${mi_state0} == FRESH"
            - "the delete returns 200 with ${d_status} == REMOVED, ${d_removed} == the logical clock, ${d_seq} == 2 still occupied and ${d_ext} == 105820 preserved — the historical extended cost is not zeroed"
            - "${after_count} == 1, ${after_mask} == 1 (GLUTEN dropped out), ${after_kcal} == 400000000, ${after_sodium} == 620000 and ${after_state} == STALE"
            - "${after_batch} == 3985891 — STILL the two-component figure: the delete recomputes the counters and the nutrition but deliberately NOT the cost, which is exactly what cost_state == STALE advertises"
            - "${mi_state1} == STALE and ${mi_class1} == UNCLASSIFIED while ${mi_plate1} == 103 is untouched — the cascade invalidates, it does not recompute"
            - "${e_already} == ERR_COMPONENT_ALREADY_REMOVED (409), not a second 200 and not a 404: the row exists, it is simply no longer ACTIVE"
            - "${e_missing} == ERR_COMPONENT_NOT_FOUND (404) for an id that was never minted"
            - "${e_frozen} == ERR_RECIPE_NOT_MUTABLE (409) — an ACTIVE recipe's component set may only be changed through a SpecChangeOrder"
            - "${re_batch} == 3880071, ${re_portion} == 970018 and ${re_state} == FRESH — only the roll-up reconciles the cost with the surviving component set"

      - name: the_allergen_nutrition_read_recomputes_live_and_persists_nothing
        claim_type: computed_read
        grounds:
          - endpoints[GET /culinary/recipes/{recipe_id}/allergen-nutrition]
          - calculations.allergen_nutrition_rollup
          - endpoints[POST /culinary/recipes/{recipe_id}/cost-rollup]
        distinguishing_aspect: "The divergence is created in a place the cascade does not reach: editing a CHILD sub-recipe recomputes the child's own mask and nutrition but never the parent's, so the parent's persisted figures are stale while the live walk sees the new allergen. The computed read returns the live figures, the following GET of the recipe still returns the stale ones, and a real cost-rollup of the parent is refused outright with ERR_COST_STALE — so the read is the only way to see the truth, and it writes nothing."
        test_recipe:
          setup:
            - "PEANUT-OIL (mask 8 PEANUT, 0 sodium, 8000000 micro-kcal, pack 946 at 12000000 micros), CHEDDAR-BLOCK (mask 1, 6200 sodium, 4000000 micro-kcal, pack 2268 at 22000000 micros) and WHEAT-FLOUR (mask 4, 20 sodium, 3500000 micro-kcal, pack 22680 at 12000000 micros), all PUBLISHED in MW."
            - "DRAFT child SUB-OIL (SUB_RECIPE, MILLILITER, batch 1000, portions 10) with PEANUT-OIL ep 100, rolled up under LATEST_PUBLISHED: batch 1268499, mask 8, batch kcal 800000000."
            - "DRAFT parent PLATE-DEEP (PLATED, EACH, batch 4, portions 4) with CHEDDAR ep 400 and a SUB_RECIPE component on SUB-OIL at ep 500, rolled up under the same basis."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "PEANUT-OIL", name: "Peanut Frying Oil", base_uom: "MILLILITER", pack_base_units: 946, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 8, kcal_per_base_unit_micros: 8000000, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { oil_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/ingredients"
