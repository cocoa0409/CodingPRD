            - { call: "POST /correspondent-banking/respondents/${r2_id}/nested-relationships", payload: { downstream_institution_name: "Kanal PSP BV", downstream_jurisdiction_code: "DE", relationship_type: "NESTED_PSP", discovery_source: "QUESTIONNAIRE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
