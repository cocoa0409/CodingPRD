          Both conditions are simultaneously true on the same submit: the invoice
          is CLOSED (priority 40, 409) and the logical clock is six days past
          dispute_deadline_at (priority 62, 422). The ladder must report the
          state violation, and the 422 must never surface. The pairing is
          deliberately counter-intuitive because the temporal fact is the older
          one — the deadline passed before the invoice was closed in wall-clock
          terms is what a naive "check dates first" implementation assumes.
