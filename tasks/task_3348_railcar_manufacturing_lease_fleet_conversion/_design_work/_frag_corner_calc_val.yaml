            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 5, planned_shop_days: 5, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
              captures: { po_status_reserved: $.data.status }
            - call: "GET /api/v1/components/${ws_id}"
              payload: {}
              as: ProductionPlanner
              captures: { on_hand_reserved: $.data.on_hand_qty, reserved_reserved: $.data.reserved_qty }
            - call: "POST /api/v1/production-orders/${po_id}/release"
