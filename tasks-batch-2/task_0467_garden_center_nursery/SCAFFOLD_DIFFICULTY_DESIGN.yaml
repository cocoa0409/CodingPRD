          trigger:
            - call: "POST /orders/${oid}/charge-account"
              payload: { expected_order_version: "${ov1}" }
              as: SalesClerk
          assert:
            - "Order.${oid}.payment_status == ON_ACCOUNT (net 10000 == limit 10000 is allowed, boundary inclusive)"
            - "Account.${aid}.outstanding_balance_cents == 10000"

      - name: vehicle_window_buffer_abuts_exactly_allowed
        grounds:
          - validations[priority=11]
          - entities.Vehicle.fields.turnaround_minutes
          - state_machines.Delivery.SCHEDULED_to_DISPATCHED
        distinguishing_aspect: |
          On POST /orders/{id}/deliveries, a second window whose start equals the first
          window's end PLUS turnaround buffer (busy interval is half-open
          [start, end+turnaround)) is allowed, but a start one minute earlier collides —
          an empty-gap boundary on the temporal metric, a distinct endpoint from the
          credit boundary.
        test_recipe:
          setup:
            - "Vehicle turnaround_minutes=30. Order A has a DELIVERED-path delivery booked [10:00,11:00) → busy until 11:30. Order B (different order) books on the same vehicle starting exactly 11:30."
          setup_api_calls:
