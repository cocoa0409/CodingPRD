            - { call: "POST /customer-orders", payload: { customer_id: "${cust_id}", product_code: "TIS_16", ordered_tons: 8.00, requested_ship_date: "2026-08-22", roll_width_mm: 2000, roll_diameter_mm: 1200, wrap_spec: "KRAFT_ONLY" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id", ord_v1: "$.data.version" } }
            - { call: "POST /customer-orders/${ord_id}/schedule", payload: { run_id: "${run_id}", expected_order_version: "${ord_v1}" }, as: MillPlanner, as_user_id: "mp_1" }
          trigger:
            - { call: "POST /pulp-batches/${pb_id}/divert", payload: {}, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "GET /paper-machines/${pm2_id}", payload: {}, as: MillPlanner, as_user_id: "mp_1", captures: { pm2_v_after: "$.data.version" } }
            - { call: "POST /paper-machines/${pm2_id}/runs", payload: { product_code: "TIS_16", pulp_batch_id: "${pb_id}", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-06T06:00:00Z", pulp_draw_tons: 10.000, expected_machine_version: "${pm2_v_after}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run2_id: "$.data.id" } }
          assert:
            - "PulpBatch.${pb_id}.status == DIVERTED AND PulpBatch.${pb_id}.final_accepted_tons == 0.000 AND PulpBatch.${pb_id}.available_tons == 0.000"
            - "hop 1: ProductionRun.${run_id}.run_status == ABORTED AND ProductionRun.${run_id}.quality_status == CONDEMNED"
            - "hop 2: CustomerOrder.${ord_id}.status == SUBMITTED AND CustomerOrder.${ord_id}.scheduled_run_id == null AND CustomerOrder.${ord_id}.deschedule_count == 1"
            - "hop 3: CustomerOrder.${ord_id}.allocated_tons == 0.000 AND CustomerOrder.${ord_id}.shortfall_tons == 8.00"
            - "hop 3: the third trigger call returns HTTP 201 and NOT data.error_id == \"ERR_MACHINE_WINDOW_CONFLICT\", proving the aborted run no longer occupies 2026-08-06T00:00:00Z..06:00:00Z on PM2"
