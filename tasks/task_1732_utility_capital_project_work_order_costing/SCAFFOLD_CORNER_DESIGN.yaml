        distinguishing_aspect: "Retirement requires the date to fall in the current OPEN period (2026-12-01 fails while 2026-08 is open); a successful retire locks the unit (second retire -> ERR_UNIT_ALREADY_RETIRED)."
        test_recipe:
          setup: ["CAPITAL work order closed out with one TRANSFORMER unit (120,000c), in-service period 2026-08 which is still open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-RET", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
