          trigger:
            - call: "POST /supplier-bookings"
              payload: { departure_id: "${dep_id}", supplier_id: "${sup_id}", service_window_start: "2026-11-03T00:00:00Z", service_window_end: "2026-11-06T00:00:00Z", room_block: 5, cost_cents: 250000 }
              as: Operator
              captures: { err: $.data.error_id }
            - call: "POST /supplier-bookings"
              payload: { departure_id: "${dep_id}", supplier_id: "${sup_id}", service_window_start: "2026-11-04T00:00:00Z", service_window_end: "2026-11-06T00:00:00Z", room_block: 5, cost_cents: 250000 }
              as: Operator
              captures: { adj_id: $.data.id, adj_status: $.data.status }
          assert:
            - "overlapping booking [11-03,11-06) -> response status 409, error_id == ERR_SUPPLIER_DOUBLE_BOOKED"
            - "adjacent booking [11-04,11-06) -> response status 201, SupplierBooking.status == HELD"

      - name: chaperone_closed_interval_buffer_rejects_adjacent_departure
        grounds:
          - validations[priority=10]
          - entities.Chaperone.fields.email
          - errors[ERR_CHAPERONE_UNAVAILABLE]
        distinguishing_aspect: |
          CLOSED interval plus CHAPERONE_REST_BUFFER_DAYS = 1 on resource Chaperone (a
          DIFFERENT resource and DIFFERENT semantics than Supplier's half-open no-buffer):
          the same-email chaperone already serves departure A [11-01,11-08]; adding them to
          departure B [11-09,11-16] is rejected (depart_B 11-09 <= return_A 11-08 + 1 day)
          with ERR_CHAPERONE_UNAVAILABLE.
        test_recipe:
          setup:
            - "Clock 2026-07-15. Two OPEN departures A [11-01,11-08] and B [11-09,11-16] under one leader."
            - "Chaperone chap@x.com already CONFIRMED on departure A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera16@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { depA: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-09T00:00:00Z", return_date: "2026-11-16T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { depB: $.data.id }
            - call: "POST /chaperones"
              payload: { departure_id: "${depA}", full_name: "Chap Person", email: "chap@x.com", role_type: "ADULT" }
              as: Operator
              captures: { chapA: $.data.id }
          trigger:
            - call: "POST /chaperones"
              payload: { departure_id: "${depB}", full_name: "Chap Person", email: "chap@x.com", role_type: "ADULT" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_CHAPERONE_UNAVAILABLE"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancellation_conserves_money_refund_plus_penalty_equals_paid
        grounds:
          - calculations.refund_amount
          - state_machines.Enrollment.PENDING_to_CANCELLED
          - entities.PaymentPlan.fields.amount_refunded_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = money (cents): cancelling a PARTIAL enrollment at tier 0.75
          leaves refund_amount(22500) + penalty_retained(7500) == amount_paid_cents(30000)
          exactly, recorded as Payment(REFUND, 22500) and Payment(PENALTY_RETAINED, 7500);
          no cent drifts.
        test_recipe:
          setup:
            - "Clock 2026-08-18 (tier 0.75). OPEN departure; enrollment; deposit 30000 paid (PARTIAL, amount_paid 30000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera17@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Nia Ba", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "FEMALE" }
              as: Operator
              captures: { enr_id: $.data.id, enr_ver: $.data.version }
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${enr_id}", installment_count: 1, expected_enrollment_version: "${enr_ver}" }
              as: Operator
              captures: { plan_id: $.data.id }
            - call: "POST /payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 30000, kind: "DEPOSIT" }
              as: Operator
          trigger:
            - call: "POST /enrollments/${enr_id}/cancel"
              payload: { reason: "traveler" }
              as: Operator
            - call: "GET /payment-plans/${plan_id}"
              payload: {}
              as: Operator
              captures: { refunded: $.data.amount_refunded_cents, pstat: $.data.status }
          assert:
            - "a Payment with kind == REFUND and amount_cents == 22500 exists on plan ${plan_id}"
            - "a Payment with kind == PENALTY_RETAINED and amount_cents == 7500 exists on plan ${plan_id}"
            - "PaymentPlan.${plan_id}.amount_refunded_cents == 22500"
            - "22500 (refund) + 7500 (penalty) == 30000 (amount_paid before cancel) — money conserved"

      - name: cancellation_conserves_seats_capacity_identity_holds
        grounds:
          - calculations.departure_seat_ledger
          - state_machines.Enrollment.PENDING_to_CANCELLED
          - entities.Departure.fields.available_seats
        distinguishing_aspect: |
          CONSERVED QUANTITY = seats (a DIFFERENT quantity than money): the identity
          capacity(30) == active_enrollment_count + free_spots_earned + available_seats holds
          before the cancel (1 + 0 + 29) and after the compensating cancel (0 + 0 + 30).
        test_recipe:
          setup:
            - "Clock 2026-08-18. OPEN departure capacity 30; one PENDING enrollment (active_enrollment_count 1, free_spots_earned 0, available_seats 29)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera18@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Ola Tu", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "FEMALE" }
              as: Operator
              captures: { enr_id: $.data.id }
            - call: "GET /departures/${dep_id}"
              payload: {}
              as: Operator
              captures: { avail_before: $.data.available_seats, active_before: $.data.active_enrollment_count }
          trigger:
            - call: "POST /enrollments/${enr_id}/cancel"
              payload: { reason: "traveler" }
              as: Operator
            - call: "GET /departures/${dep_id}"
              payload: {}
              as: Operator
              captures: { avail_after: $.data.available_seats, active_after: $.data.active_enrollment_count, fse_after: $.data.free_spots_earned }
          assert:
            - "before cancel: Departure.${dep_id} available_seats == 29, active_enrollment_count == 1, free_spots_earned == 0 (30 == 1 + 0 + 29)"
            - "after cancel: Departure.${dep_id} available_seats == 30, active_enrollment_count == 0, free_spots_earned == 0 (30 == 0 + 0 + 30)"
