              payload: { employer_id: "${emp_id}", full_name: "Ded Emp", email: "ded@x.test" }
              as: BenefitsAdmin
              captures: { emp_de_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_de_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "POST /benefits/enrollments/${enr_id}/terminate"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "After activate Employee.${emp_de_id}.total_weekly_deduction_cents was 1200"
            - "Enrollment.${enr_id}.lifecycle_status == TERMINATED"
            - "Employee.${emp_de_id}.total_weekly_deduction_cents == 0"
