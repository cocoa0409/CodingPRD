        distinguishing_aspect: "Each family has its OWN 404 code: nine reads with the same syntactically valid but absent id must return nine different error_ids, so a single shared ERR_NOT_FOUND fails this instance even though every status code is right."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; the portal contains no rows in any of the nine families."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
