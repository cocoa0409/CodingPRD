            - call: "POST /listings"
              payload: { lot_id: "${lot8_id}", asking_price_per_unit_cents: 9000 }
              as: BrokerOps
              captures: { lst8_id: $.data.id }
            - call: "POST /listings/${lst8_id}/activate"
