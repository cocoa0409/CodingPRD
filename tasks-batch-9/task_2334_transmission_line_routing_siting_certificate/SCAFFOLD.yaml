# =============================================================================
# Task 2334 — Transmission Line Routing & Siting Certificate
# Seed tables §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2334. Transmission Line Routing & Siting Certificate (electric transmission developer): need
  justification through planning studies with alternatives analysis including non-transmission
  options, route development with constraint mapping across land use, environmental, cultural and
  engineering criteria, public involvement with open houses, comment intake and route refinement,
  siting application to the state commission with alternate routes and impact assessments,
  intervention by landowners and interest groups with hearings and evidentiary proceedings,
  certificate conditions with mitigation commitments and construction constraints, easement
  acquisition with negotiated purchase and eminent domain proceedings where authorized, federal
  permits for crossings of public land and waterways, construction compliance monitoring against
  certificate conditions

domain_name: transmission-siting
api_prefix: /siting

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on EasementTract.version and SitingApplication.version
    - cascading_side_effects        # nonconformance -> index -> posture -> activities -> segments
    - dual_variant_calculation      # preliminary/certified score, negotiated/condemnation value, rolling/cumulative index
    - selector_policy               # best non-transmission alternative; refinement target segment

  entity_topology: flat
  # Peer collections under /siting with FK references in request bodies; no nested
  # ownership paths beyond sub-resource read projections.

  state_machine_shape: parallel
  # SitingApplication (review_status x record_status), EasementTract (acquisition_status x
  # payment_status) and Certificate (status x posture) each carry two independent dimensions;
  # Route, CertificateCondition and ConstructionActivity add revision cycles.

  relationship_patterns:
    - one_to_many          # Project -> PlanningStudy/Route/EasementTract; Route -> RouteSegment
    - cross_aggregate      # ConstructionActivity spans Certificate and RouteSegment; Nonconformance spans Certificate, CertificateCondition and ConstructionActivity
    - polymorphic          # Intervention.petitioner_kind selects between Landowner-backed and organization-backed petitioners

  role_model: segregation_of_duties
  # The Developer user that authored a PlanningStudy may not certify its sufficiency; the
  # CommissionStaff user that signs the decision may not be a user that presided over a held
  # hearing session on the same application.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # Deliberately above the §0.4 Expert band: 15 entities / 78 endpoints / 58 error codes /
  # 59 priority-ordered validations / 8 calculations (3 with divergent variants) /
  # 19 state-machine dimensions across 11 entities / 7 roles.
  # The surface is large because the coupling is: no route can be nominated without surviving the
  # comment-refinement cycle, no application can be filed without a segregated sufficiency
  # certification, and no construction activity can start without jointly satisfying
  # certificate posture, seasonal conditions, federal crossing permits, easement acquisition and
  # project escrow.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Transmission project name" }
      - { name: voltage_class, type: enum, source: input, description: "KV_138 | KV_345 | KV_500 — drives the constraint-score voltage multiplier", constraints: "KV_138 | KV_345 | KV_500" }
      - { name: jurisdiction_state, type: string, source: input, description: "Two-letter state code of the siting commission" }
      - { name: target_energization_at, type: datetime, source: input, description: "Contractual in-service date; compared against SitingApplication.decision_deadline_at" }
      - { name: stage, type: enum, source: system, default: "PLANNING", description: "PLANNING | ROUTING | APPLICATION_FILED | CERTIFICATED | CONSTRUCTION | ENERGIZED", constraints: "PLANNING | ROUTING | APPLICATION_FILED | CERTIFICATED | CONSTRUCTION | ENERGIZED" }
      - { name: schedule_posture, type: enum, source: computed, default: "ON_TRACK", description: "ON_TRACK | AT_RISK | CRITICAL — recomputed from SitingApplication.decision_deadline_at vs target_energization_at", constraints: "ON_TRACK | AT_RISK | CRITICAL" }
      - { name: right_of_way_hold, type: boolean, source: computed, default: false, description: "= (schedule_posture IN {AT_RISK, CRITICAL}); when true, new condemnation filings are refused" }
      - { name: escrow_funded_cents, type: integer, source: computed, default: 0, description: "Cumulative mitigation/right-of-way escrow deposited by the developer" }
      - { name: escrow_balance_cents, type: integer, source: computed, default: 0, description: "Undisbursed escrow; conserved invariant escrow_funded_cents == escrow_balance_cents + escrow_disbursed_cents" }
      - { name: escrow_disbursed_cents, type: integer, source: computed, default: 0, description: "Escrow paid out to landowners; restored on payment rescission" }
      - { name: easement_committed_cents, type: integer, source: computed, default: 0, description: "Sum over EasementTract.committed_cents of tracts with acquisition_status IN {AGREED, AWARDED}; each tract's own value is rounded before the sum" }

  - name: PlanningStudy
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: horizon_year, type: integer, source: input, description: "Planning horizon year of the need case" }
      - { name: reliability_deficit_mw, type: number, source: input, description: "Unserved capability the line must relieve; must be > 0", constraints: "> 0" }
      - { name: transmission_capex_cents, type: integer, source: input, description: "Capital cost of the transmission solution" }
      - { name: benefit_pv_cents, type: integer, source: input, description: "Present value of reliability + congestion benefits" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ALTERNATIVES_ANALYZED | CERTIFIED_SUFFICIENT | INSUFFICIENT", constraints: "DRAFT | ALTERNATIVES_ANALYZED | CERTIFIED_SUFFICIENT | INSUFFICIENT" }
      - { name: transmission_levelized_cents_per_mw, type: number, source: computed, description: "round_half_up(transmission_capex_cents / reliability_deficit_mw, 2); null before sufficiency certification" }
      - { name: benefit_ratio, type: number, source: computed, description: "round_half_up(benefit_pv_cents / transmission_capex_cents, 4); null before sufficiency certification" }
      - { name: need_margin_ratio, type: number, source: computed, description: "round_half_up((selected NTA levelized cost / transmission_levelized_cents_per_mw) * benefit_ratio, 4); null before sufficiency certification" }
      - { name: selected_nta_alternative_id, type: string, source: computed, description: "Alternative.id chosen by the §1.3 need_justification_margin selector (not a structural FK; the candidate set is read through GET /siting/planning-studies/{studyId}/alternatives); null before certification" }
      - { name: alternatives_screened_in_count, type: integer, source: computed, default: 0, description: "Count of Alternative rows on this study with screening_status == SCREENED_IN" }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the Developer that created the study" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the Developer that ran sufficiency certification; must differ from authored_by_user_id; null before certification" }

  - name: Alternative
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> PlanningStudy.id" }
      - { name: kind, type: enum, source: input, description: "TRANSMISSION | NON_TRANSMISSION | HYBRID — NON_TRANSMISSION and HYBRID are the non-wires candidate pool", constraints: "TRANSMISSION | NON_TRANSMISSION | HYBRID" }
      - { name: description, type: string, source: input, description: "Narrative of the alternative" }
      - { name: capex_cents, type: integer, source: input, description: "Capital cost of this alternative" }
      - { name: deliverable_mw, type: number, source: input, description: "Capability delivered; zero is rejected with ERR_ZERO_DELIVERABLE", constraints: "> 0" }
      - { name: levelized_cost_cents_per_mw, type: number, source: computed, description: "round_half_up(capex_cents / deliverable_mw, 2) — set at creation" }
      - { name: screening_status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | SCREENED_IN | SCREENED_OUT", constraints: "SUBMITTED | SCREENED_IN | SCREENED_OUT" }
      - { name: screen_reason, type: string, source: system, description: "Analyst rationale recorded by the screening decision; null while SUBMITTED" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: label, type: string, source: input, description: "Route label, e.g. 'Route A — river crossing'" }
      - { name: kind, type: enum, source: input, description: "PROPOSED | ALTERNATE — the public-involvement gates on nomination apply to PROPOSED only", constraints: "PROPOSED | ALTERNATE" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CONSTRAINT_MAPPED | PUBLISHED_FOR_COMMENT | REFINING | NOMINATED | CERTIFIED | REJECTED", constraints: "DRAFT | CONSTRAINT_MAPPED | PUBLISHED_FOR_COMMENT | REFINING | NOMINATED | CERTIFIED | REJECTED" }
      - { name: total_miles, type: number, source: computed, default: 0, description: "round_half_up(sum of RouteSegment.miles for this route, 2)" }
      - { name: segment_count, type: integer, source: computed, default: 0, description: "Count of RouteSegment rows on this route" }
      - { name: unsurveyed_segment_count, type: integer, source: computed, default: 0, description: "Count of RouteSegment rows on this route with survey_status == DESKTOP" }
      - { name: constraint_score_preliminary, type: number, source: computed, description: "PRELIMINARY variant of §1.3 route_constraint_score; null before the first constraint mapping" }
      - { name: constraint_score_certified, type: number, source: computed, description: "CERTIFIED variant of §1.3 route_constraint_score; null before the first constraint mapping" }
      - { name: constraint_density_certified, type: number, source: computed, description: "round_half_up(constraint_score_certified / total_miles, 2); gate value for nomination (<= 4.00)" }
      - { name: refinement_round, type: integer, source: system, default: 0, description: "Number of completed refinement cycles; hard cap of 3" }
      - { name: refinement_target_segment_id, type: string, source: system, description: "RouteSegment.id chosen by the §1.3 refinement_target_selection selector on the latest refinement (not a structural FK; segments are read through GET /siting/routes/{routeId}/segments)" }
      - { name: comment_window_closes_at, type: datetime, source: system, description: "Set by publication to logical_now + comment_window_days; null before publication" }
      - { name: open_house_held_count, type: integer, source: system, default: 0, description: "Number of open houses recorded against this route" }
      - { name: open_house_counties, type: array, source: system, default: [], description: "Distinct county strings of the recorded open houses, in insertion order" }

  - name: RouteSegment
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: sequence_index, type: integer, source: input, description: "1-based position along the route; unique per route", constraints: ">= 1, unique per route_id" }
      - { name: miles, type: number, source: input, description: "Segment length in miles", constraints: "> 0" }
      - { name: land_use_rating, type: integer, source: input, description: "Land-use constraint rating 0..5", constraints: "0..5" }
      - { name: environmental_rating, type: integer, source: input, description: "Environmental constraint rating 0..5", constraints: "0..5" }
      - { name: cultural_rating, type: integer, source: input, description: "Cultural/historic constraint rating 0..5", constraints: "0..5" }
      - { name: engineering_rating, type: integer, source: input, description: "Engineering/constructability constraint rating 0..5", constraints: "0..5" }
      - { name: survey_status, type: enum, source: input, default: "DESKTOP", description: "DESKTOP | FIELD_VERIFIED — DESKTOP segments take worst-case environmental and cultural ratings in the CERTIFIED score variant", constraints: "DESKTOP | FIELD_VERIFIED" }
      - { name: county, type: string, source: input, description: "County the segment crosses; open-house coverage is counted over distinct counties" }
      - { name: crew_capacity, type: integer, source: input, description: "Maximum peak crew count the segment can host across overlapping activity windows", constraints: ">= 0" }
      - { name: committed_crew_count, type: integer, source: computed, default: 0, description: "Sum of ConstructionActivity.crew_count over activities on this segment with status IN {SCHEDULED, IN_PROGRESS, SUSPENDED}" }
      - { name: construction_state, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | HALTED | COMPLETE", constraints: "PENDING | ACTIVE | HALTED | COMPLETE" }
      - { name: habitat_blackout, type: boolean, source: input, default: false, description: "True when the segment carries the sensitive-habitat flag that activates SEASONAL_BLACKOUT certificate conditions" }
      - { name: federal_crossing_kind, type: enum, source: input, default: "NONE", description: "NONE | PUBLIC_LAND | NAVIGABLE_WATERWAY | WETLAND", constraints: "NONE | PUBLIC_LAND | NAVIGABLE_WATERWAY | WETLAND" }
      - { name: federal_permit_status, type: enum, source: system, description: "NOT_REQUIRED | REQUIRED | APPLIED | ISSUED | DENIED — initialised NOT_REQUIRED when federal_crossing_kind == NONE, otherwise REQUIRED", constraints: "NOT_REQUIRED | REQUIRED | APPLIED | ISSUED | DENIED" }
      - { name: federal_permit_agency, type: enum, source: system, description: "BLM | USACE | USFS — recorded by the federal permit application; null while NOT_REQUIRED or REQUIRED", constraints: "BLM | USACE | USFS" }
      - { name: material_comment_count, type: integer, source: computed, default: 0, description: "Count of PublicComment rows with segment_id == this segment AND materiality == MATERIAL AND status == RECEIVED" }
      - { name: refinement_count, type: integer, source: system, default: 0, description: "Number of times this segment was the selected refinement target" }

  - name: PublicComment
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: segment_id, type: string, source: input, description: "FK -> RouteSegment.id; null for route-wide comments. MATERIAL comments must name a segment" }
      - { name: commenter_landowner_id, type: string, source: input, description: "FK -> Landowner.id; required when commenter_kind == LANDOWNER, null otherwise" }
      - { name: commenter_kind, type: enum, source: input, description: "LANDOWNER | AGENCY | PUBLIC", constraints: "LANDOWNER | AGENCY | PUBLIC" }
      - { name: commenter_name, type: string, source: input, description: "Display name recorded on the comment" }
      - { name: body, type: string, source: input, description: "Comment text" }
      - { name: materiality, type: enum, source: input, description: "MATERIAL | GENERAL — MATERIAL comments drive route refinement and block nomination while RECEIVED", constraints: "MATERIAL | GENERAL" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | ACKNOWLEDGED | INCORPORATED | DISMISSED", constraints: "RECEIVED | ACKNOWLEDGED | INCORPORATED | DISMISSED" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock reading at intake" }
      - { name: disposition_note, type: string, source: system, description: "Analyst note recorded by the disposition action; null while RECEIVED" }

  - name: SitingApplication
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: study_id, type: string, source: input, description: "FK -> PlanningStudy.id" }
      - { name: proposed_route_id, type: string, source: input, description: "FK -> Route.id; must be a NOMINATED route with kind == PROPOSED" }
      - { name: alternate_route_ids, type: array, source: system, description: "Snapshot at filing of ids of Routes on the project with kind == ALTERNATE and status == NOMINATED; at least one is required" }
      - { name: docket_number, type: string, source: input, description: "Commission docket identifier supplied by the filer" }
      - { name: filing_fee_cents, type: integer, source: input, description: "Fee tendered with the filing; must be >= FILING_FEE_MIN_CENTS", constraints: ">= 2500000" }
      - { name: review_status, type: enum, source: system, default: "FILED", description: "FILED | ACCEPTED | DEFICIENT | GRANTED | DENIED — dimension 1", constraints: "FILED | ACCEPTED | DEFICIENT | GRANTED | DENIED" }
      - { name: record_status, type: enum, source: system, default: "NOT_OPENED", description: "NOT_OPENED | SCHEDULING | EVIDENTIARY_REQUIRED | RECORD_OPEN | RECORD_CLOSED — dimension 2, evolves independently of review_status", constraints: "NOT_OPENED | SCHEDULING | EVIDENTIARY_REQUIRED | RECORD_OPEN | RECORD_CLOSED" }
      - { name: party_count, type: integer, source: computed, default: 0, description: "Count of Intervention rows on this application with status == GRANTED" }
      - { name: suspension_days, type: integer, source: system, default: 0, description: "Statutory suspension accumulated when the record becomes evidentiary" }
      - { name: decision_deadline_at, type: datetime, source: computed, description: "= filed_at + 365 days + suspension_days" }
      - { name: amendment_round, type: integer, source: system, default: 0, description: "Number of accepted amendments; hard cap of 2" }
      - { name: deficiency_note, type: string, source: system, description: "Reviewer note recorded with a DEFICIENT ruling; null otherwise" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock reading at filing" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing Developer; must differ from PlanningStudy.authored_by_user_id" }

  - name: HearingSession
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> SitingApplication.id" }
      - { name: kind, type: enum, source: input, description: "PREHEARING | EVIDENTIARY | PUBLIC_TESTIMONY", constraints: "PREHEARING | EVIDENTIARY | PUBLIC_TESTIMONY" }
      - { name: window_start_at, type: datetime, source: input, description: "Session start (closed interval, buffered)" }
      - { name: window_end_at, type: datetime, source: input, description: "Session end; must be strictly after window_start_at" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | HELD", constraints: "SCHEDULED | HELD" }
      - { name: presiding_user_id, type: string, source: system, description: "X-User-ID of the HearingExaminer that scheduled the session" }
      - { name: exhibits_admitted_count, type: integer, source: system, default: 0, description: "Exhibits admitted, recorded when the session is held" }

  - name: Intervention
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> SitingApplication.id" }
      - { name: petitioner_kind, type: enum, source: input, description: "LANDOWNER | INTEREST_GROUP", constraints: "LANDOWNER | INTEREST_GROUP" }
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id; required when petitioner_kind == LANDOWNER, must be null otherwise" }
      - { name: organization_name, type: string, source: input, description: "Interest-group name; required when petitioner_kind == INTEREST_GROUP, must be null otherwise" }
      - { name: grounds, type: string, source: input, description: "Asserted interest and grounds for intervention" }
      - { name: status, type: enum, source: system, default: "PETITIONED", description: "PETITIONED | GRANTED | DENIED", constraints: "PETITIONED | GRANTED | DENIED" }
      - { name: ruling_reason, type: string, source: system, description: "Reason recorded with the ruling; null while PETITIONED" }
      - { name: ruled_by_user_id, type: string, source: system, description: "X-User-ID of the CommissionStaff that ruled; null while PETITIONED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock reading at petition" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> SitingApplication.id" }
      - { name: certified_route_id, type: string, source: system, description: "FK -> Route.id" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | CLOSED — dimension 1", constraints: "ISSUED | CLOSED" }
      - { name: posture, type: enum, source: computed, default: "ACTIVE", description: "ACTIVE | STOP_WORK | REVOKED — dimension 2, derived from the two compliance indices", constraints: "ACTIVE | STOP_WORK | REVOKED" }
      - { name: eminent_domain_authorized, type: boolean, source: system, description: "Whether the order confers eminent-domain authority" }
      - { name: mitigation_base_cents, type: integer, source: system, description: "Mitigation commitment value fixed by the order" }
      - { name: escrow_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 — selected from mitigation_base_cents only", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: contingency_cents, type: integer, source: computed, description: "round_half_up(mitigation_base_cents * tier rate, 0)" }
      - { name: condition_surcharge_cents, type: integer, source: computed, description: "CONDITION_SURCHARGE_CENTS * count of conditions with severity_weight >= 4" }
      - { name: escrow_required_cents, type: integer, source: computed, description: "mitigation_base_cents + contingency_cents + condition_surcharge_cents" }
      - { name: compliance_index_rolling, type: number, source: computed, default: 100, description: "ROLLING variant of §1.3 certificate_compliance_index; gates posture" }
      - { name: compliance_index_cumulative, type: number, source: computed, default: 100, description: "CUMULATIVE variant of §1.3 certificate_compliance_index; gates revocation and closeout" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the CommissionStaff that signed the order" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock reading at issuance" }

  - name: CertificateCondition
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id" }
      - { name: code, type: string, source: system, description: "Condition code from the order, e.g. ENV-BLACKOUT-1" }
      - { name: category, type: enum, source: system, description: "ENVIRONMENTAL | CULTURAL | LAND_USE | ENGINEERING | PUBLIC_SAFETY", constraints: "ENVIRONMENTAL | CULTURAL | LAND_USE | ENGINEERING | PUBLIC_SAFETY" }
      - { name: constraint_kind, type: enum, source: system, description: "SEASONAL_BLACKOUT | CREW_LIMIT | NOTICE | MONITORING", constraints: "SEASONAL_BLACKOUT | CREW_LIMIT | NOTICE | MONITORING" }
      - { name: severity_weight, type: integer, source: system, description: "1..5 — multiplies nonconformance deductions and drives the escrow surcharge", constraints: "1..5" }
      - { name: blackout_start_mmdd, type: string, source: system, description: "Inclusive MM-DD start of the seasonal restriction; non-null only for SEASONAL_BLACKOUT" }
      - { name: blackout_end_mmdd, type: string, source: system, description: "Inclusive MM-DD end of the seasonal restriction; non-null only for SEASONAL_BLACKOUT" }
      - { name: crew_limit, type: integer, source: system, description: "Maximum peak crew the order allows per segment across overlapping activity windows; non-null only for CREW_LIMIT" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | VIOLATED | WAIVED", constraints: "ACTIVE | VIOLATED | WAIVED" }
      - { name: waiver_reason, type: string, source: system, description: "Reason recorded with a waiver; null otherwise" }

  - name: Landowner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Landowner of record" }
      - { name: email, type: string, source: input, description: "Notice email address" }
      - { name: mailing_address, type: string, source: input, description: "Statutory notice address" }

  - name: EasementTract
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: segment_id, type: string, source: input, description: "FK -> RouteSegment.id" }
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id" }
      - { name: parcel_number, type: string, source: input, description: "County parcel identifier" }
      - { name: acres, type: number, source: input, description: "Easement area in acres", constraints: "> 0" }
      - { name: per_acre_value_cents, type: integer, source: input, description: "Appraised fee value per acre" }
      - { name: easement_factor, type: number, source: input, description: "Fraction of fee value taken by the easement", constraints: "> 0 and <= 1" }
      - { name: structure_damages_cents, type: integer, source: input, default: 0, description: "Damages for structures and improvements; part of the negotiated offer only" }
      - { name: before_value_cents, type: integer, source: input, description: "Whole-property value before the taking; condemnation input only" }
      - { name: after_value_cents, type: integer, source: input, description: "Whole-property value after the taking; condemnation input only" }
      - { name: severance_damages_cents, type: integer, source: input, default: 0, description: "Severance damages; condemnation input only" }
      - { name: offer_round, type: integer, source: system, default: 0, description: "Number of offers extended; drives the escalation factor" }
      - { name: offered_compensation_cents, type: integer, source: computed, description: "NEGOTIATED_OFFER variant of §1.3 easement_compensation; null before the first offer" }
      - { name: agreed_compensation_cents, type: integer, source: computed, description: "Frozen copy of offered_compensation_cents when the landowner accepts; null otherwise" }
      - { name: award_cents, type: integer, source: computed, description: "CONDEMNATION_AWARD variant of §1.3 easement_compensation; null unless AWARDED" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "= agreed_compensation_cents when AGREED, award_cents when AWARDED, else 0" }
      - { name: acquisition_status, type: enum, source: system, default: "NOT_STARTED", description: "NOT_STARTED | OFFERED | AGREED | REJECTED | CONDEMNATION_FILED | AWARDED — dimension 1", constraints: "NOT_STARTED | OFFERED | AGREED | REJECTED | CONDEMNATION_FILED | AWARDED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | PAID | RESCINDED — dimension 2, evolves independently of acquisition_status", constraints: "UNPAID | PAID | RESCINDED" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Amount currently sitting with the landowner; zeroed by rescission" }
      - { name: paid_at, type: datetime, source: system, description: "Logical clock reading of the latest payment; the rescission window is measured from here" }
      - { name: court_docket_number, type: string, source: system, description: "Condemnation court docket; null unless a proceeding was filed" }
      - { name: deposit_cents, type: integer, source: system, description: "Deposit paid into court with the condemnation petition; earns statutory interest in the award" }

  - name: ConstructionActivity
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: segment_id, type: string, source: input, description: "FK -> RouteSegment.id" }
      - { name: activity_kind, type: enum, source: input, description: "CLEARING | FOUNDATION | STRINGING", constraints: "CLEARING | FOUNDATION | STRINGING" }
      - { name: crew_count, type: integer, source: input, description: "Crew committed for the whole window", constraints: ">= 1" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the half-open occupation window [window_start_at, window_end_at)" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive end of the occupation window; must be strictly after window_start_at" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | SUSPENDED | COMPLETE | CANCELLED", constraints: "SCHEDULED | IN_PROGRESS | SUSPENDED | COMPLETE | CANCELLED" }
      - { name: suspension_reason, type: string, source: system, description: "Set when a certificate posture cascade suspends the activity; null otherwise" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock reading of the first start" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock reading of completion" }

  - name: Nonconformance
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: condition_id, type: string, source: input, description: "FK -> CertificateCondition.id; must belong to certificate_id" }
      - { name: activity_id, type: string, source: input, description: "FK -> ConstructionActivity.id; optional, null for programme-level findings" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | SEVERE", constraints: "MINOR | MAJOR | SEVERE" }
      - { name: observation, type: string, source: input, description: "Monitor's field observation" }
      - { name: deduction_points, type: number, source: computed, description: "SEVERITY_POINTS[severity] * (1 + 0.2 * (condition.severity_weight - 1)), 2 decimals, frozen at creation" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CORRECTED | VOIDED", constraints: "OPEN | CORRECTED | VOIDED" }
      - { name: corrective_action, type: string, source: system, description: "Recorded with the correction; null otherwise" }
      - { name: observed_at, type: datetime, source: system, description: "Logical clock reading at filing" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Project
    dimension: stage
    initial_state: PLANNING
    terminal_states: [ENERGIZED]
    transitions:
      - from: PLANNING
        to: ROUTING
        trigger: "system event — first Route created on the project (POST /siting/routes)"
        actor: system
        preconditions: ["at least one PlanningStudy on the project has status == CERTIFIED_SUFFICIENT"]
        side_effects: ["Project.stage := ROUTING"]
      - from: ROUTING
        to: APPLICATION_FILED
        trigger: "system event — SitingApplication filed (POST /siting/applications)"
        actor: system
        preconditions: ["proposed route status == NOMINATED"]
        side_effects: ["Project.stage := APPLICATION_FILED", "recomputes Project.schedule_posture from the new decision_deadline_at", "recomputes Project.right_of_way_hold"]
      - from: APPLICATION_FILED
        to: CERTIFICATED
        trigger: "system event — Certificate issued (POST /siting/applications/{applicationId}/decision with outcome GRANT)"
        actor: system
        preconditions: ["application review_status == ACCEPTED", "application record_status == RECORD_CLOSED"]
        side_effects: ["Project.stage := CERTIFICATED", "certified route status := CERTIFIED", "all other NOMINATED routes on the project := REJECTED"]
      - from: CERTIFICATED
        to: CONSTRUCTION
        trigger: "system event — first ConstructionActivity started (POST /siting/construction-activities/{activityId}/start)"
        actor: system
        preconditions: ["Certificate.posture == ACTIVE"]
        side_effects: ["Project.stage := CONSTRUCTION"]
      - from: CONSTRUCTION
        to: ENERGIZED
        trigger: "POST /siting/certificates/{certificateId}/closeout"
        actor: CommissionStaff
        preconditions: ["every RouteSegment on the certified route has construction_state == COMPLETE", "zero Nonconformance rows with status == OPEN", "Certificate.compliance_index_cumulative >= 75.00", "Certificate.posture == ACTIVE"]
        side_effects: ["Project.stage := ENERGIZED", "Certificate.status := CLOSED", "remaining Project.escrow_balance_cents released (escrow_balance_cents := 0, escrow_funded_cents reduced by the released amount)"]

  - entity: PlanningStudy
    dimension: status
    initial_state: DRAFT
    terminal_states: [CERTIFIED_SUFFICIENT]
    transitions:
      - from: DRAFT
        to: ALTERNATIVES_ANALYZED
        trigger: "system event — an Alternative on the study is screened in (POST /siting/alternatives/{alternativeId}/screening with decision SCREEN_IN) bringing alternatives_screened_in_count to >= 1; the >= 2 count and the NON_TRANSMISSION/HYBRID requirement are enforced later, at certification, by ERR_INSUFFICIENT_ALTERNATIVES and ERR_NO_NONTRANSMISSION_ALTERNATIVE"
        actor: system
        preconditions: ["study status IN {DRAFT, INSUFFICIENT}"]
        side_effects: ["PlanningStudy.status := ALTERNATIVES_ANALYZED"]
      - from: ALTERNATIVES_ANALYZED
        to: CERTIFIED_SUFFICIENT
        trigger: "POST /siting/planning-studies/{studyId}/sufficiency-certification"
        actor: Developer
        preconditions: ["certifying X-User-ID differs from PlanningStudy.authored_by_user_id", "alternatives_screened_in_count >= 2", "the need_justification_margin selector finds at least one candidate", "computed need_margin_ratio >= 1.1500"]
        side_effects: ["computes transmission_levelized_cents_per_mw, benefit_ratio, need_margin_ratio and selected_nta_alternative_id", "PlanningStudy.status := CERTIFIED_SUFFICIENT", "certified_by_user_id := X-User-ID"]
      - from: ALTERNATIVES_ANALYZED
        to: INSUFFICIENT
        trigger: "POST /siting/planning-studies/{studyId}/sufficiency-certification with a computed need_margin_ratio below the threshold"
        actor: Developer
        preconditions: ["certifying X-User-ID differs from PlanningStudy.authored_by_user_id", "alternatives_screened_in_count >= 2", "the need_justification_margin selector finds at least one candidate", "computed need_margin_ratio < 1.1500"]
        side_effects: ["computes and stores all three ratios and selected_nta_alternative_id", "PlanningStudy.status := INSUFFICIENT", "certified_by_user_id := X-User-ID"]
        note: "The certification call succeeds (201) in both directions; the outcome is data-determined, not client-selected."
      - from: INSUFFICIENT
        to: ALTERNATIVES_ANALYZED
        trigger: "system event — a further Alternative is screened in (POST /siting/alternatives/{alternativeId}/screening)"
        actor: system
        preconditions: ["study status == INSUFFICIENT"]
        side_effects: ["PlanningStudy.status := ALTERNATIVES_ANALYZED", "need_margin_ratio, benefit_ratio, transmission_levelized_cents_per_mw and selected_nta_alternative_id cleared to null", "certified_by_user_id cleared to null"]
        note: "Cycle: a study may be re-analyzed and re-certified any number of times until it lands CERTIFIED_SUFFICIENT."

  - entity: Alternative
    dimension: screening_status
    initial_state: SUBMITTED
    terminal_states: [SCREENED_OUT]
    transitions:
      - from: SUBMITTED
        to: SCREENED_IN
        trigger: "POST /siting/alternatives/{alternativeId}/screening with decision SCREEN_IN"
        actor: RouteAnalyst
        preconditions: ["parent study status IN {DRAFT, ALTERNATIVES_ANALYZED, INSUFFICIENT}"]
        side_effects: ["increments PlanningStudy.alternatives_screened_in_count", "may bubble the study into ALTERNATIVES_ANALYZED"]
      - from: SUBMITTED
        to: SCREENED_OUT
        trigger: "POST /siting/alternatives/{alternativeId}/screening with decision SCREEN_OUT"
        actor: RouteAnalyst
        preconditions: ["parent study status IN {DRAFT, ALTERNATIVES_ANALYZED, INSUFFICIENT}"]
        side_effects: ["records screen_reason"]
      - from: SCREENED_IN
        to: SCREENED_OUT
        trigger: "POST /siting/alternatives/{alternativeId}/screening with decision SCREEN_OUT"
        actor: RouteAnalyst
        preconditions: ["parent study status != CERTIFIED_SUFFICIENT"]
        side_effects: ["decrements PlanningStudy.alternatives_screened_in_count", "records screen_reason"]

  - entity: Route
    dimension: status
    initial_state: DRAFT
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: CONSTRAINT_MAPPED
        trigger: "POST /siting/routes/{routeId}/constraint-mapping"
        actor: RouteAnalyst
        preconditions: ["route has at least 2 RouteSegment rows", "segment sequence_index values form a contiguous 1..N run", "every RouteSegment with federal_crossing_kind != NONE has federal_permit_status != DENIED"]
        side_effects: ["recomputes total_miles and segment_count", "computes constraint_score_preliminary and constraint_score_certified via §1.3 route_constraint_score", "computes constraint_density_certified", "Route.status := CONSTRAINT_MAPPED"]
      - from: CONSTRAINT_MAPPED
        to: CONSTRAINT_MAPPED
        trigger: "POST /siting/routes/{routeId}/constraint-mapping (re-map after segment edits)"
        actor: RouteAnalyst
        preconditions: ["same preconditions as the DRAFT transition"]
        side_effects: ["recomputes all four score/density fields from current segment data"]
        note: "Self-loop: re-mapping is the mechanism by which a refinement's survey upgrades are folded into the scores."
      - from: CONSTRAINT_MAPPED
        to: PUBLISHED_FOR_COMMENT
        trigger: "POST /siting/routes/{routeId}/publication"
        actor: Developer
        preconditions: ["Route.kind == PROPOSED", "constraint_score_certified is non-null", "comment_window_days between 30 and 90 inclusive"]
        side_effects: ["comment_window_closes_at := logical_now + comment_window_days", "Route.status := PUBLISHED_FOR_COMMENT"]
      - from: PUBLISHED_FOR_COMMENT
        to: REFINING
        trigger: "POST /siting/routes/{routeId}/refinements"
        actor: RouteAnalyst
        preconditions: ["Route.refinement_round < 3", "the refinement_target_selection selector finds at least one candidate segment"]
        side_effects: ["selects refinement_target_segment_id per §1.3 refinement_target_selection", "target segment survey_status := FIELD_VERIFIED and refinement_count incremented", "every PublicComment on the target segment with status == RECEIVED := INCORPORATED and the segment's material_comment_count recomputed", "Route.refinement_round incremented", "Route.status := REFINING"]
      - from: REFINING
        to: CONSTRAINT_MAPPED
        trigger: "POST /siting/routes/{routeId}/constraint-mapping"
        actor: RouteAnalyst
        preconditions: ["same preconditions as the DRAFT transition"]
        side_effects: ["recomputes all four score/density fields", "Route.status := CONSTRAINT_MAPPED"]
        note: "Cycle REFINING -> CONSTRAINT_MAPPED -> PUBLISHED_FOR_COMMENT -> REFINING, bounded by refinement_round <= 3."
      - from: PUBLISHED_FOR_COMMENT
        to: NOMINATED
        trigger: "POST /siting/routes/{routeId}/nomination"
        actor: Developer
        preconditions: ["Route.kind == PROPOSED", "logical_now >= comment_window_closes_at", "zero PublicComment rows on the route with materiality == MATERIAL AND status == RECEIVED", "open_house_held_count >= 2 across at least 2 distinct counties", "constraint_density_certified <= 4.00"]
        side_effects: ["Route.status := NOMINATED"]
      - from: CONSTRAINT_MAPPED
        to: NOMINATED
        trigger: "POST /siting/routes/{routeId}/nomination"
        actor: Developer
        preconditions: ["Route.kind == ALTERNATE", "constraint_density_certified <= 4.00"]
        side_effects: ["Route.status := NOMINATED"]
        note: "Conditional validation: the publication, comment-window and open-house gates apply to PROPOSED routes only."
      - from: NOMINATED
        to: CERTIFIED
        trigger: "system event — GRANT decision naming this route (POST /siting/applications/{applicationId}/decision)"
        actor: system
        preconditions: ["route is the application's proposed_route_id or a member of alternate_route_ids"]
        side_effects: ["Route.status := CERTIFIED", "Certificate created with certified_route_id := this route"]
      - from: NOMINATED
        to: REJECTED
        trigger: "system event — decision recorded on the application (POST /siting/applications/{applicationId}/decision)"
        actor: system
        preconditions: ["route was not the certified route"]
        side_effects: ["Route.status := REJECTED"]

  - entity: RouteSegment
    dimension: federal_permit_status
    initial_state: "NOT_REQUIRED when federal_crossing_kind == NONE, otherwise REQUIRED"
    terminal_states: [NOT_REQUIRED, ISSUED]
    transitions:
      - from: REQUIRED
        to: APPLIED
        trigger: "POST /siting/route-segments/{segmentId}/federal-permit-actions with action APPLY"
        actor: FederalPermitOfficer
        preconditions: ["federal_crossing_kind != NONE", "agency matches the crossing kind: PUBLIC_LAND -> BLM or USFS, NAVIGABLE_WATERWAY -> USACE, WETLAND -> USACE"]
        side_effects: ["federal_permit_status := APPLIED", "federal_permit_agency := agency"]
      - from: APPLIED
        to: ISSUED
        trigger: "POST /siting/route-segments/{segmentId}/federal-permit-actions with action ISSUE"
        actor: FederalPermitOfficer
        preconditions: ["federal_permit_status == APPLIED"]
        side_effects: ["federal_permit_status := ISSUED"]
      - from: APPLIED
        to: DENIED
        trigger: "POST /siting/route-segments/{segmentId}/federal-permit-actions with action DENY"
        actor: FederalPermitOfficer
        preconditions: ["federal_permit_status == APPLIED"]
        side_effects: ["federal_permit_status := DENIED", "any ConstructionActivity on the segment with status IN {SCHEDULED, IN_PROGRESS} := SUSPENDED with suspension_reason 'FEDERAL_PERMIT_DENIED' and the segment's committed_crew_count left unchanged (SUSPENDED still occupies its crew slots)"]
      - from: DENIED
        to: APPLIED
        trigger: "POST /siting/route-segments/{segmentId}/federal-permit-actions with action APPLY"
        actor: FederalPermitOfficer
        preconditions: ["federal_permit_status == DENIED"]
        side_effects: ["federal_permit_status := APPLIED", "federal_permit_agency := agency"]
        note: "Cycle: a denied crossing permit may be re-applied for after redesign."

  - entity: RouteSegment
    dimension: construction_state
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system event — first ConstructionActivity on the segment started"
        actor: system
        preconditions: ["Certificate.posture == ACTIVE"]
        side_effects: ["construction_state := ACTIVE"]
      - from: ACTIVE
        to: HALTED
        trigger: "system event — Certificate.posture becomes STOP_WORK or REVOKED"
        actor: system
        preconditions: ["segment has at least one ConstructionActivity that was suspended by the cascade"]
        side_effects: ["construction_state := HALTED"]
      - from: HALTED
        to: ACTIVE
        trigger: "system event — Certificate.posture returns to ACTIVE and a suspended activity on the segment is restarted"
        actor: system
        preconditions: ["Certificate.posture == ACTIVE"]
        side_effects: ["construction_state := ACTIVE"]
      - from: ACTIVE
        to: COMPLETE
        trigger: "system event — every ConstructionActivity on the segment reaches status IN {COMPLETE, CANCELLED} with at least one COMPLETE"
        actor: system
        preconditions: ["no activity on the segment has status IN {SCHEDULED, IN_PROGRESS, SUSPENDED}"]
        side_effects: ["construction_state := COMPLETE", "committed_crew_count := 0"]

  - entity: PublicComment
    dimension: status
    initial_state: RECEIVED
    terminal_states: [INCORPORATED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: ACKNOWLEDGED
        trigger: "POST /siting/public-comments/{commentId}/disposition with disposition ACKNOWLEDGE"
        actor: RouteAnalyst
        preconditions: ["parent Route.status IN {PUBLISHED_FOR_COMMENT, REFINING}"]
        side_effects: ["records disposition_note", "if materiality == MATERIAL, decrements the referenced segment's material_comment_count"]
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /siting/public-comments/{commentId}/disposition with disposition DISMISS"
        actor: RouteAnalyst
        preconditions: ["parent Route.status IN {PUBLISHED_FOR_COMMENT, REFINING}"]
        side_effects: ["records disposition_note", "if materiality == MATERIAL, decrements the referenced segment's material_comment_count"]
      - from: ACKNOWLEDGED
        to: INCORPORATED
        trigger: "system event — route refinement selects the segment this comment names"
        actor: system
        preconditions: ["comment names a segment"]
        side_effects: ["status := INCORPORATED"]
      - from: RECEIVED
        to: INCORPORATED
        trigger: "system event — route refinement selects the segment this comment names"
        actor: system
        preconditions: ["comment names a segment"]
        side_effects: ["status := INCORPORATED", "segment material_comment_count recomputed"]
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /siting/public-comments/{commentId}/disposition with disposition DISMISS"
        actor: RouteAnalyst
        preconditions: ["parent Route.status IN {PUBLISHED_FOR_COMMENT, REFINING}"]
        side_effects: ["records disposition_note"]

  - entity: SitingApplication
    dimension: review_status
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /siting/applications/{applicationId}/sufficiency-review with outcome ACCEPT"
        actor: CommissionStaff
        preconditions: ["application has at least one alternate_route_ids entry", "filing_fee_cents >= 2500000"]
        side_effects: ["review_status := ACCEPTED", "record_status := SCHEDULING", "increments SitingApplication.version by 1"]
      - from: FILED
        to: DEFICIENT
        trigger: "POST /siting/applications/{applicationId}/sufficiency-review with outcome REJECT"
        actor: CommissionStaff
        preconditions: ["deficiency_note supplied"]
        side_effects: ["review_status := DEFICIENT", "records deficiency_note", "increments SitingApplication.version by 1"]
      - from: DEFICIENT
        to: FILED
        trigger: "POST /siting/applications/{applicationId}/amendments"
        actor: Developer
        preconditions: ["amendment_round < 2", "expected_application_version matches SitingApplication.version"]
        side_effects: ["amendment_round incremented", "deficiency_note cleared", "review_status := FILED", "filed_at := logical_now and decision_deadline_at recomputed", "recomputes Project.schedule_posture and right_of_way_hold", "increments SitingApplication.version by 1"]
        note: "Cycle FILED -> DEFICIENT -> FILED, bounded by amendment_round <= 2."
      - from: ACCEPTED
        to: GRANTED
        trigger: "POST /siting/applications/{applicationId}/decision with outcome GRANT"
        actor: CommissionStaff
        preconditions: ["record_status == RECORD_CLOSED", "deciding X-User-ID is not the presiding_user_id of any HELD HearingSession on this application", "certified_route_id names the proposed route or one of the alternate routes"]
        side_effects: ["review_status := GRANTED", "Certificate created (ISSUED / ACTIVE) with its CertificateCondition set", "certified route := CERTIFIED, other NOMINATED routes on the project := REJECTED", "Project.stage := CERTIFICATED"]
      - from: ACCEPTED
        to: DENIED
        trigger: "POST /siting/applications/{applicationId}/decision with outcome DENY"
        actor: CommissionStaff
        preconditions: ["record_status == RECORD_CLOSED", "deciding X-User-ID is not the presiding_user_id of any HELD HearingSession on this application"]
        side_effects: ["review_status := DENIED", "all NOMINATED routes on the project := REJECTED"]

  - entity: SitingApplication
    dimension: record_status
    initial_state: NOT_OPENED
    terminal_states: [RECORD_CLOSED]
    transitions:
      - from: NOT_OPENED
        to: SCHEDULING
        trigger: "system event — sufficiency review accepts the application"
        actor: system
        preconditions: ["review_status transitions to ACCEPTED"]
        side_effects: ["record_status := SCHEDULING"]
      - from: SCHEDULING
        to: EVIDENTIARY_REQUIRED
        trigger: "system event — an Intervention is GRANTED bringing party_count to >= 2"
        actor: system
        preconditions: ["record_status == SCHEDULING"]
        side_effects: ["record_status := EVIDENTIARY_REQUIRED", "suspension_days := 90", "decision_deadline_at recomputed", "recomputes Project.schedule_posture and Project.right_of_way_hold"]
        note: "Cross-entity cascade origin: a granted second intervention lengthens the statutory clock and can flip the project to AT_RISK."
      - from: SCHEDULING
        to: RECORD_OPEN
        trigger: "system event — a HearingSession on the application is held"
        actor: system
        preconditions: ["record_status == SCHEDULING"]
        side_effects: ["record_status := RECORD_OPEN"]
      - from: EVIDENTIARY_REQUIRED
        to: RECORD_OPEN
        trigger: "system event — a HearingSession with kind == EVIDENTIARY is held"
        actor: system
        preconditions: ["record_status == EVIDENTIARY_REQUIRED"]
        side_effects: ["record_status := RECORD_OPEN"]
        note: "Guarded: while EVIDENTIARY_REQUIRED, holding a PREHEARING or PUBLIC_TESTIMONY session does not open the record."
      - from: RECORD_OPEN
        to: RECORD_CLOSED
        trigger: "POST /siting/applications/{applicationId}/record-closure"
        actor: HearingExaminer
        preconditions: ["no HearingSession on the application has status == SCHEDULED", "every Intervention on the application has status IN {GRANTED, DENIED}"]
        side_effects: ["record_status := RECORD_CLOSED", "increments SitingApplication.version by 1"]

  - entity: HearingSession
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /siting/hearing-sessions/{sessionId}/holding"
        actor: HearingExaminer
        preconditions: ["logical_now >= window_start_at", "application record_status IN {SCHEDULING, EVIDENTIARY_REQUIRED, RECORD_OPEN}"]
        side_effects: ["status := HELD", "exhibits_admitted_count recorded", "may advance application record_status to RECORD_OPEN"]

  - entity: Intervention
    dimension: status
    initial_state: PETITIONED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PETITIONED
        to: GRANTED
        trigger: "POST /siting/interventions/{interventionId}/ruling with ruling GRANT"
        actor: CommissionStaff
        preconditions: ["application record_status IN {SCHEDULING, EVIDENTIARY_REQUIRED, RECORD_OPEN}"]
        side_effects: ["status := GRANTED", "ruled_by_user_id := X-User-ID", "application party_count incremented", "may drive record_status to EVIDENTIARY_REQUIRED with the 90-day suspension cascade"]
      - from: PETITIONED
        to: DENIED
        trigger: "POST /siting/interventions/{interventionId}/ruling with ruling DENY"
        actor: CommissionStaff
        preconditions: ["ruling_reason supplied"]
        side_effects: ["status := DENIED", "ruled_by_user_id := X-User-ID"]

  - entity: Certificate
    dimension: status
    initial_state: ISSUED
    terminal_states: [CLOSED]
    transitions:
      - from: ISSUED
        to: CLOSED
        trigger: "POST /siting/certificates/{certificateId}/closeout"
        actor: CommissionStaff
        preconditions: ["posture == ACTIVE", "compliance_index_cumulative >= 75.00", "no OPEN Nonconformance", "all segments on the certified route COMPLETE"]
        side_effects: ["status := CLOSED", "Project.stage := ENERGIZED", "escrow balance released"]

  - entity: Certificate
    dimension: posture
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: STOP_WORK
        trigger: "system event — Nonconformance filed (POST /siting/nonconformances) drives compliance_index_rolling below 60.00 while compliance_index_cumulative stays >= 25.00"
        actor: system
        preconditions: ["posture == ACTIVE"]
        side_effects: ["posture := STOP_WORK", "referenced CertificateCondition.status := VIOLATED", "every ConstructionActivity on the certificate with status IN {SCHEDULED, IN_PROGRESS} := SUSPENDED with suspension_reason 'CERTIFICATE_STOP_WORK'", "each affected RouteSegment.construction_state := HALTED"]
      - from: STOP_WORK
        to: ACTIVE
        trigger: "system event — Nonconformance corrected (POST /siting/nonconformances/{nonconformanceId}/correction) lifting compliance_index_rolling back to >= 60.00"
        actor: system
        preconditions: ["compliance_index_cumulative >= 25.00"]
        side_effects: ["posture := ACTIVE", "condition status := ACTIVE when it has no remaining OPEN nonconformances", "suspended activities remain SUSPENDED until individually restarted"]
        note: "Cycle: posture oscillates with the rolling index; the cumulative index never recovers."
      - from: ACTIVE
        to: REVOKED
        trigger: "system event — Nonconformance filed driving compliance_index_cumulative below 25.00"
        actor: system
        preconditions: ["posture IN {ACTIVE, STOP_WORK}"]
        side_effects: ["posture := REVOKED", "all non-terminal ConstructionActivity rows := SUSPENDED", "affected RouteSegment.construction_state := HALTED"]
      - from: STOP_WORK
        to: REVOKED
        trigger: "system event — Nonconformance filed driving compliance_index_cumulative below 25.00"
        actor: system
        preconditions: ["posture == STOP_WORK"]
        side_effects: ["posture := REVOKED", "all non-terminal ConstructionActivity rows := SUSPENDED"]

  - entity: CertificateCondition
    dimension: status
    initial_state: ACTIVE
    terminal_states: [WAIVED]
    transitions:
      - from: ACTIVE
        to: VIOLATED
        trigger: "system event — Nonconformance filed against the condition"
        actor: system
        preconditions: ["condition status == ACTIVE"]
        side_effects: ["status := VIOLATED"]
      - from: VIOLATED
        to: ACTIVE
        trigger: "system event — the last OPEN Nonconformance on the condition is corrected"
        actor: system
        preconditions: ["no remaining Nonconformance with status == OPEN on the condition"]
        side_effects: ["status := ACTIVE"]
      - from: ACTIVE
        to: WAIVED
        trigger: "POST /siting/certificate-conditions/{conditionId}/waiver"
        actor: CommissionStaff
        preconditions: ["condition status == ACTIVE", "Certificate.posture != REVOKED", "waiver_reason supplied"]
        side_effects: ["status := WAIVED", "condition no longer constrains construction scheduling", "Certificate.condition_surcharge_cents and escrow_required_cents are NOT recomputed (the order's escrow is fixed at issuance)"]

  - entity: Landowner
    dimension: n/a
    initial_state: "n/a — Landowner carries no lifecycle state"
    terminal_states: []
    transitions: []

  - entity: EasementTract
    dimension: acquisition_status
    initial_state: NOT_STARTED
    terminal_states: [AGREED, AWARDED]
    transitions:
      - from: NOT_STARTED
        to: OFFERED
        trigger: "POST /siting/easement-tracts/{tractId}/offers"
        actor: Developer
        preconditions: ["expected_tract_version matches EasementTract.version", "Certificate on the tract's project has status == ISSUED and posture != REVOKED"]
        side_effects: ["offer_round incremented", "offered_compensation_cents computed via the NEGOTIATED_OFFER variant", "acquisition_status := OFFERED", "increments EasementTract.version by 1"]
      - from: OFFERED
        to: AGREED
        trigger: "POST /siting/easement-tracts/{tractId}/offer-response with response ACCEPT"
        actor: Landowner
        preconditions: ["acting X-User-ID == EasementTract.landowner_id", "acquisition_status == OFFERED"]
        side_effects: ["agreed_compensation_cents := offered_compensation_cents", "committed_cents := agreed_compensation_cents", "acquisition_status := AGREED", "Project.easement_committed_cents recomputed"]
      - from: OFFERED
        to: REJECTED
        trigger: "POST /siting/easement-tracts/{tractId}/offer-response with response REJECT"
        actor: Landowner
        preconditions: ["acting X-User-ID == EasementTract.landowner_id", "acquisition_status == OFFERED"]
        side_effects: ["acquisition_status := REJECTED"]
      - from: REJECTED
        to: OFFERED
        trigger: "POST /siting/easement-tracts/{tractId}/offers (sweetened offer)"
        actor: Developer
        preconditions: ["expected_tract_version matches EasementTract.version", "offer_round < 3"]
        side_effects: ["offer_round incremented", "offered_compensation_cents recomputed at the higher escalation factor", "acquisition_status := OFFERED", "increments EasementTract.version by 1"]
        note: "Cycle OFFERED -> REJECTED -> OFFERED, bounded by offer_round <= 3."
      - from: REJECTED
        to: CONDEMNATION_FILED
        trigger: "POST /siting/easement-tracts/{tractId}/condemnation"
        actor: Developer
        preconditions: ["Certificate.eminent_domain_authorized == true", "offer_round >= 2", "Project.right_of_way_hold == false", "court_docket_number and deposit_cents supplied"]
        side_effects: ["acquisition_status := CONDEMNATION_FILED", "records court_docket_number and deposit_cents"]
      - from: CONDEMNATION_FILED
        to: AWARDED
        trigger: "POST /siting/easement-tracts/{tractId}/award"
        actor: CommissionStaff
        preconditions: ["acquisition_status == CONDEMNATION_FILED", "before_value_cents > after_value_cents"]
        side_effects: ["award_cents computed via the CONDEMNATION_AWARD variant", "committed_cents := award_cents", "acquisition_status := AWARDED", "Project.easement_committed_cents recomputed"]

  - entity: EasementTract
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: []
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /siting/easement-tracts/{tractId}/payments"
        actor: Developer
        preconditions: ["acquisition_status IN {AGREED, AWARDED}", "Project.escrow_balance_cents >= committed_cents"]
        side_effects: ["paid_amount_cents := committed_cents", "paid_at := logical_now", "Project.escrow_balance_cents decreased and escrow_disbursed_cents increased by the same amount", "payment_status := PAID"]
      - from: PAID
        to: RESCINDED
        trigger: "POST /siting/easement-tracts/{tractId}/payment-rescission"
        actor: CommissionStaff
        preconditions: ["payment_status == PAID", "logical_now < paid_at + 30 days"]
        side_effects: ["paid_amount_cents := 0", "Project.escrow_balance_cents restored and escrow_disbursed_cents reduced by the rescinded amount", "payment_status := RESCINDED"]
      - from: RESCINDED
        to: PAID
        trigger: "POST /siting/easement-tracts/{tractId}/payments"
        actor: Developer
        preconditions: ["acquisition_status IN {AGREED, AWARDED}", "Project.escrow_balance_cents >= committed_cents"]
        side_effects: ["paid_amount_cents := committed_cents", "paid_at := logical_now", "escrow ledger debited again", "payment_status := PAID"]
        note: "Cycle PAID -> RESCINDED -> PAID; the escrow conservation invariant must hold after every step."

  - entity: ConstructionActivity
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /siting/construction-activities/{activityId}/start"
        actor: Developer
        preconditions: ["Certificate.posture == ACTIVE", "logical_now >= window_start_at", "the segment's EasementTract rows are all in acquisition_status IN {AGREED, AWARDED}", "the segment's federal_permit_status IN {NOT_REQUIRED, ISSUED}"]
        side_effects: ["status := IN_PROGRESS", "started_at := logical_now", "segment construction_state := ACTIVE", "Project.stage := CONSTRUCTION on the first start"]
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /siting/construction-activities/{activityId}/completion"
        actor: Developer
        preconditions: ["status == IN_PROGRESS", "no OPEN Nonconformance references this activity"]
        side_effects: ["status := COMPLETE", "completed_at := logical_now", "segment committed_crew_count reduced by crew_count", "segment may bubble to COMPLETE"]
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "system event — Certificate.posture leaves ACTIVE, or the segment's federal permit is denied"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["status := SUSPENDED", "suspension_reason recorded", "committed_crew_count unchanged"]
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system event — Certificate.posture leaves ACTIVE, or the segment's federal permit is denied"
        actor: system
        preconditions: ["status == IN_PROGRESS"]
        side_effects: ["status := SUSPENDED", "suspension_reason recorded", "segment construction_state := HALTED"]
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /siting/construction-activities/{activityId}/start"
        actor: Developer
        preconditions: ["Certificate.posture == ACTIVE", "the segment's federal_permit_status IN {NOT_REQUIRED, ISSUED}", "logical_now >= window_start_at"]
        side_effects: ["status := IN_PROGRESS", "suspension_reason cleared", "segment construction_state := ACTIVE"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /siting/construction-activities/{activityId}/cancellation"
        actor: Developer
        preconditions: ["status IN {SCHEDULED, SUSPENDED}"]
        side_effects: ["status := CANCELLED", "segment committed_crew_count reduced by crew_count"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /siting/construction-activities/{activityId}/cancellation"
        actor: Developer
        preconditions: ["status == SUSPENDED"]
        side_effects: ["status := CANCELLED", "segment committed_crew_count reduced by crew_count"]

  - entity: Nonconformance
    dimension: status
    initial_state: OPEN
    terminal_states: [CORRECTED, VOIDED]
    transitions:
      - from: OPEN
        to: CORRECTED
        trigger: "POST /siting/nonconformances/{nonconformanceId}/correction"
        actor: ComplianceMonitor
        preconditions: ["status == OPEN", "corrective_action supplied"]
        side_effects: ["status := CORRECTED", "compliance_index_rolling recomputed with the finding's deduction halved", "compliance_index_cumulative unchanged (corrections never restore cumulative credit)", "may return Certificate.posture to ACTIVE", "condition may return to ACTIVE"]
      - from: OPEN
        to: VOIDED
        trigger: "POST /siting/nonconformances/{nonconformanceId}/correction with void_finding true"
        actor: CommissionStaff
        preconditions: ["status == OPEN"]
        side_effects: ["status := VOIDED", "both compliance indices recomputed with the finding fully removed", "may return Certificate.posture to ACTIVE"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: tract-offer-supersede
    parent_entity: EasementTract
    write_endpoint: "POST /siting/easement-tracts/{tractId}/offers"
    occ_field: "expected_tract_version"
    description: |
      Extending an easement offer against a tract whose version has advanced since the client last
      observed it is rejected as stale. A new offer legitimately supersedes the prior one and
      recomputes offered_compensation_cents at the next escalation factor, so a writer holding an
      out-of-date view of the tract would otherwise silently overwrite an offer it never saw.
    error_id: ERR_STALE_TRACT_VERSION
    http_status: 412

  - rule_id: application-amendment-supersede
    parent_entity: SitingApplication
    write_endpoint: "POST /siting/applications/{applicationId}/amendments"
    occ_field: "expected_application_version"
    description: |
      Filing an amendment against an application whose version has advanced since the client last
      observed it is rejected as stale. An amendment legitimately supersedes the deficient filing,
      resets filed_at and recomputes decision_deadline_at, so a writer working from an out-of-date
      view of the docket would otherwise restart a statutory clock it never read.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: levelized_alternative_cost
    trigger: "On POST /siting/alternatives — frozen onto Alternative.levelized_cost_cents_per_mw at creation"
    algorithm: aggregation
    formula: |
      if deliverable_mw <= 0: reject with ERR_ZERO_DELIVERABLE
      levelized_cost_cents_per_mw = round_half_up(capex_cents / deliverable_mw, 2)
    input_set: "The single Alternative being created; the value is frozen and never recomputed."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: need_justification_margin
    trigger: "On POST /siting/planning-studies/{studyId}/sufficiency-certification"
    algorithm: threshold
    formula: |
      # step 1 — transmission solution unit cost
      transmission_levelized = round_half_up(transmission_capex_cents / reliability_deficit_mw, 2)

      # step 2 — benefit ratio of the transmission solution
      benefit_ratio = round_half_up(benefit_pv_cents / transmission_capex_cents, 4)

      # step 3 — SELECTOR: the most competitive non-wires alternative on the study
      candidates = [a for a in alternatives(study)
                    if a.kind IN {NON_TRANSMISSION, HYBRID}
                    and a.screening_status == SCREENED_IN]
      if candidates is empty: reject with ERR_NO_NONTRANSMISSION_ALTERNATIVE
      # ranking: cheapest levelized cost first (the hardest competitor for the wires solution)
      selected = min(candidates, key=(a.levelized_cost_cents_per_mw ASC, a.created_at ASC))
      selected_nta_alternative_id = selected.id

      # step 4 — margin: how much cheaper the wires solution is, weighted by its benefit ratio
      need_margin_ratio = round_half_up(
          (selected.levelized_cost_cents_per_mw / transmission_levelized) * benefit_ratio, 4)

      # step 5 — threshold applied to the ROUNDED ratio, not the raw quotient
      status = CERTIFIED_SUFFICIENT if need_margin_ratio >= NEED_MARGIN_THRESHOLD else INSUFFICIENT
    input_set: |
      Alternative rows whose study_id is this study AND kind IN {NON_TRANSMISSION, HYBRID} AND
      screening_status == SCREENED_IN. TRANSMISSION-kind alternatives and SUBMITTED / SCREENED_OUT
      rows are excluded from the candidate pool even though they still count toward the study's
      alternatives_screened_in_count gate.
    constants:
      NEED_MARGIN_THRESHOLD: 1.1500
      MIN_SCREENED_IN_ALTERNATIVES: 2
    precision: |
      transmission_levelized 2 dp round_half_up; benefit_ratio and need_margin_ratio 4 dp
      round_half_up. The threshold comparison uses the 4-dp rounded need_margin_ratio, so a raw
      quotient of 1.149975 rounds to 1.1500 and PASSES.
    selector_policy:
      eligibility: "kind IN {NON_TRANSMISSION, HYBRID} AND screening_status == SCREENED_IN"
      ranking: "levelized_cost_cents_per_mw ASC"
      tie_break: "created_at ASC"
      empty_pool_fallback: "reject the certification with ERR_NO_NONTRANSMISSION_ALTERNATIVE (422); the study stays in ALTERNATIVES_ANALYZED"

  - name: route_constraint_score
    trigger: "On POST /siting/routes/{routeId}/constraint-mapping"
    algorithm: weighted_scoring
    formula: |
      voltage_multiplier = { KV_138: 1.00, KV_345: 1.15, KV_500: 1.30 }[project.voltage_class]

      for each segment s on the route, ordered by sequence_index ASC:
          # variant-dependent effective ratings (see variants below)
          base = ( W_LAND_USE     * lu_eff
                 + W_ENVIRONMENTAL * env_eff
                 + W_CULTURAL      * cul_eff
                 + W_ENGINEERING   * eng_eff )
          base = min(base, BASE_SCORE_CAP)                 # cap applied per segment, BEFORE miles
          seg_score = round_half_up(s.miles * base * voltage_multiplier, 2)

      route_score = sum(seg_score)                          # sum of already-rounded segment scores
      total_miles = round_half_up(sum(s.miles), 2)
      constraint_density_certified = round_half_up(constraint_score_certified / total_miles, 2)
    input_set: "Every RouteSegment row on the route; there is no state filter — DRAFT-era segments count."
    constants:
      W_LAND_USE: 0.25
      W_ENVIRONMENTAL: 0.35
      W_CULTURAL: 0.25
      W_ENGINEERING: 0.15
      BASE_SCORE_CAP: 4.50
      DENSITY_LIMIT: 4.00
    precision: |
      Per-segment round_half_up to 2 dp, then sum the rounded segment scores (round-then-sum, NOT
      sum-then-round). Density is round_half_up to 2 dp and compared with <= 4.00.
    variants:
      - name: PRELIMINARY
        when: "Route.constraint_score_preliminary — the desk-study view used for internal comparison of routes"
        difference: "Uses each segment's stored land_use_rating, environmental_rating, cultural_rating and engineering_rating verbatim regardless of survey_status."
      - name: CERTIFIED
        when: "Route.constraint_score_certified — the filing-grade view; the only variant that feeds constraint_density_certified and the nomination gate"
        difference: |
          For segments with survey_status == DESKTOP, environmental_rating and cultural_rating are
          replaced by the worst-case value 5 (land-use and engineering ratings are unchanged).
          Segments with survey_status == FIELD_VERIFIED use their stored ratings, so the two
          variants coincide only when every segment is field-verified.

  - name: easement_compensation
    trigger: "On POST /siting/easement-tracts/{tractId}/offers (NEGOTIATED_OFFER) and POST /siting/easement-tracts/{tractId}/award (CONDEMNATION_AWARD)"
    algorithm: waterfall_allocation
    formula: |
      # ---- NEGOTIATED_OFFER ----
      land_value      = round_half_up(acres * per_acre_value_cents * easement_factor, 0)   # ROUND 1
      base_offer      = land_value + structure_damages_cents
      escalation      = { 1: 1.00, 2: 1.05, 3: 1.12 }[offer_round]
      offered_compensation_cents = round_half_up(base_offer * escalation, 0)               # ROUND 2

      # ---- CONDEMNATION_AWARD ----
      if before_value_cents <= after_value_cents: reject with ERR_NO_VALUE_DIMINUTION
      diminution        = before_value_cents - after_value_cents
      deposit_interest  = round_half_up(deposit_cents * STATUTORY_INTEREST_RATE, 0)
      award_cents       = diminution + severance_damages_cents + deposit_interest

      # ---- project roll-up ----
      Project.easement_committed_cents = sum over tracts with acquisition_status IN {AGREED, AWARDED}
                                         of tract.committed_cents      # each term already rounded
    input_set: |
      The single tract for the per-tract values. For the project roll-up: EasementTract rows on the
      project with acquisition_status IN {AGREED, AWARDED}; OFFERED, REJECTED, CONDEMNATION_FILED and
      NOT_STARTED tracts contribute nothing, and payment_status is irrelevant to the roll-up.
    constants:
      ESCALATION_ROUND_1: 1.00
      ESCALATION_ROUND_2: 1.05
      ESCALATION_ROUND_3: 1.12
      STATUTORY_INTEREST_RATE: 0.06
      MAX_OFFER_ROUNDS: 3
    precision: |
      Whole cents, round_half_up, with the ORDER OF ROUNDING PINNED: land_value is rounded before
      structure damages are added, and the escalation factor is applied to the already-rounded
      base_offer. Collapsing the two roundings into one final rounding changes the answer by one
      cent on fractional-acre tracts. Likewise the project roll-up sums per-tract rounded values.
    variants:
      - name: NEGOTIATED_OFFER
        when: "acquisition proceeds by negotiated purchase; recomputed on every offer round"
        difference: "Values the easement interest only (acres x per-acre value x easement factor) plus structure damages, then escalates by offer round. Ignores before/after whole-property values, severance damages and any court deposit."
      - name: CONDEMNATION_AWARD
        when: "acquisition proceeds by eminent domain; computed once when the court award is recorded"
        difference: "Values the taking as whole-property diminution (before - after) plus severance damages plus statutory interest on the court deposit. Ignores acres, per_acre_value_cents, easement_factor, structure_damages_cents and offer_round entirely, so the award and the last offer diverge on identical tract data."

  - name: mitigation_escrow_requirement
    trigger: "On POST /siting/applications/{applicationId}/decision with outcome GRANT — frozen onto the new Certificate"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED — the tier is selected from mitigation_base_cents ALONE
      escrow_tier = TIER_1 if mitigation_base_cents <  TIER_2_FLOOR_CENTS
               else TIER_2 if mitigation_base_cents <  TIER_3_FLOOR_CENTS
               else TIER_3
      rate = { TIER_1: 0.10, TIER_2: 0.14, TIER_3: 0.18 }[escrow_tier]

      contingency_cents = round_half_up(mitigation_base_cents * rate, 0)   # rate on the BASE only

      heavy_conditions = count(conditions on this certificate with severity_weight >= HEAVY_CONDITION_WEIGHT)
      condition_surcharge_cents = CONDITION_SURCHARGE_CENTS * heavy_conditions

      escrow_required_cents = mitigation_base_cents + contingency_cents + condition_surcharge_cents
    input_set: "The CertificateCondition rows created with the order; WAIVED conditions still count because the surcharge is fixed at issuance and never recomputed."
    constants:
      TIER_2_FLOOR_CENTS: 500000000
      TIER_3_FLOOR_CENTS: 2000000000
      TIER_1_RATE: 0.10
      TIER_2_RATE: 0.14
      TIER_3_RATE: 0.18
      HEAVY_CONDITION_WEIGHT: 4
      CONDITION_SURCHARGE_CENTS: 2500000
    precision: |
      Whole cents, round_half_up. Applying the contingency rate to (mitigation_base +
      condition_surcharge), or re-deriving the tier from the running total, both produce a different
      escrow_required_cents on the same order — the declared order above is the only correct one.

  - name: certificate_compliance_index
    trigger: "On POST /siting/nonconformances and POST /siting/nonconformances/{nonconformanceId}/correction"
    algorithm: decay_function
    formula: |
      # per-finding deduction, frozen at creation
      deduction_points = round_half_up( SEVERITY_POINTS[severity]
                                        * (1 + WEIGHT_STEP * (condition.severity_weight - 1)), 2 )

      # index variants over all findings on the certificate
      compliance_index_<variant> = max(0, round_half_up(100 - sum(effective_deduction), 2))

      # posture is derived AFTER both indices are refreshed, in this order
      posture = REVOKED   if compliance_index_cumulative <  REVOCATION_FLOOR
           else STOP_WORK if compliance_index_rolling    <  STOP_WORK_FLOOR
           else ACTIVE
    input_set: |
      Nonconformance rows on the certificate with status IN {OPEN, CORRECTED}. VOIDED findings are
      excluded from BOTH variants. Findings on WAIVED conditions still count — a waiver stops future
      constraint enforcement but does not erase recorded history.
    constants:
      SEVERITY_POINTS_MINOR: 4
      SEVERITY_POINTS_MAJOR: 12
      SEVERITY_POINTS_SEVERE: 30
      WEIGHT_STEP: 0.2
      CORRECTION_CREDIT_FACTOR: 0.5
      STOP_WORK_FLOOR: 60.00
      REVOCATION_FLOOR: 25.00
      CLOSEOUT_FLOOR: 75.00
    precision: "2 decimal places, round_half_up, floored at 0. Thresholds are strict: rolling exactly 60.00 stays ACTIVE, cumulative exactly 25.00 stays out of REVOKED."
    variants:
      - name: ROLLING
        when: "Certificate.compliance_index_rolling — the live construction-permission index that gates posture"
        difference: "effective_deduction = deduction_points for OPEN findings and deduction_points * 0.5 for CORRECTED findings, so correcting a finding restores half its penalty."
      - name: CUMULATIVE
        when: "Certificate.compliance_index_cumulative — the permanent record that gates revocation and closeout"
        difference: "effective_deduction = deduction_points for both OPEN and CORRECTED findings, so corrections never restore any credit. The two variants diverge the moment the first finding is corrected."

  - name: project_schedule_posture
    trigger: "On POST /siting/applications, POST /siting/applications/{applicationId}/amendments and whenever SitingApplication.suspension_days changes (intervention grant cascade)"
    algorithm: threshold
    formula: |
      slack_days = whole days from decision_deadline_at to Project.target_energization_at
      schedule_posture = CRITICAL if slack_days < 0
                    else AT_RISK  if slack_days < AT_RISK_SLACK_DAYS
                    else ON_TRACK
      Project.right_of_way_hold = (schedule_posture IN {AT_RISK, CRITICAL})
    input_set: "The project's most recently filed SitingApplication (the one whose review_status is not DENIED); projects with no application keep ON_TRACK / right_of_way_hold false."
    constants:
      AT_RISK_SLACK_DAYS: 180
    precision: "Whole days, truncated; both timestamps are UTC instants"

  - name: refinement_target_selection
    trigger: "On POST /siting/routes/{routeId}/refinements"
    algorithm: weighted_scoring
    formula: |
      candidates = [s for s in segments(route) if s.material_comment_count >= 1]
      if candidates is empty: reject with ERR_NO_REFINEMENT_TARGET
      target = max(candidates, key=(material_comment_count DESC,
                                    environmental_rating   DESC,
                                    sequence_index         ASC))
      target.survey_status := FIELD_VERIFIED
      target.refinement_count += 1
      every PublicComment with segment_id == target.id and status IN {RECEIVED, ACKNOWLEDGED}
          := INCORPORATED, then target.material_comment_count recomputed (to 0)
    input_set: "RouteSegment rows on the route whose material_comment_count (MATERIAL comments still in status RECEIVED) is at least 1."
    constants:
      MAX_REFINEMENT_ROUNDS: 3
    precision: "n/a — integer comparisons only"
    selector_policy:
      eligibility: "segment.material_comment_count >= 1"
      ranking: "material_comment_count DESC, then environmental_rating DESC"
      tie_break: "sequence_index ASC"
      empty_pool_fallback: "reject with ERR_NO_REFINEMENT_TARGET (409); the route stays PUBLISHED_FOR_COMMENT and refinement_round is not incremented"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles AND is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves to an existing row, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Every FK supplied in the request body resolves to an existing row (project_id, study_id, route_id, segment_id, landowner_id, application_id, certificate_id, condition_id, activity_id, certified_route_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 5
    category: validation
    check: "Required fields present; enums within their declared domains; numeric ranges honored (ratings 0..5, severity_weight 1..5, miles > 0, acres > 0, 0 < easement_factor <= 1, crew_count >= 1, sequence_index >= 1, reliability_deficit_mw > 0, comment_window_days 30..90, window_end_at strictly after window_start_at); Intervention.landowner_id required iff petitioner_kind == LANDOWNER and organization_name required iff petitioner_kind == INTEREST_GROUP; PublicComment.segment_id required when materiality == MATERIAL; PublicComment.commenter_landowner_id required iff commenter_kind == LANDOWNER"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: auth
    check: "A Landowner acting on an easement tract, offer response or their own comment must be the tract's landowner_id / the comment's commenter_landowner_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /siting/easement-tracts/{tractId}/offer-response, POST /siting/public-comments"

  - priority: 7
    category: state
    check: "expected_tract_version equals EasementTract.version (§1.2.1 tract-offer-supersede)"
    error_id: ERR_STALE_TRACT_VERSION
    http_status: 412
    applies_to: "POST /siting/easement-tracts/{tractId}/offers"

  - priority: 7
    category: state
    check: "expected_application_version equals SitingApplication.version (§1.2.1 application-amendment-supersede)"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /siting/applications/{applicationId}/amendments"

  - priority: 10
    category: state
    check: "The target row is in a state from which the requested transition exists (route status, application review_status/record_status, comment status, tract acquisition_status/payment_status, activity status, nonconformance status, alternative screening_status, session status, intervention status, condition status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: state
    check: "The target row is not already in a terminal state for the dimension being transitioned"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 12
    category: state
    check: "Publication, refinement and comment intake require Route.status IN {CONSTRAINT_MAPPED, PUBLISHED_FOR_COMMENT, REFINING} as applicable to the operation"
    error_id: ERR_ROUTE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /siting/routes/{routeId}/refinements, POST /siting/public-comments"

  - priority: 11
    category: state
    check: "A siting application requires its PlanningStudy to be CERTIFIED_SUFFICIENT"
    error_id: ERR_STUDY_NOT_SUFFICIENT
    http_status: 409
    applies_to: "POST /siting/applications"

  - priority: 12
    category: state
    check: "A siting application requires its proposed route to have kind == PROPOSED and status == NOMINATED"
    error_id: ERR_ROUTE_NOT_NOMINATED
    http_status: 409
    applies_to: "POST /siting/applications"

  - priority: 12
    category: state
    check: "A GRANT/DENY decision and a certificate closeout require record_status == RECORD_CLOSED"
    error_id: ERR_RECORD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /siting/applications/{applicationId}/decision"

  - priority: 12
    category: state
    check: "Record closure requires zero HearingSession rows with status == SCHEDULED"
    error_id: ERR_HEARING_STILL_SCHEDULED
    http_status: 409
    applies_to: "POST /siting/applications/{applicationId}/record-closure"

  - priority: 13
    category: state
    check: "Record closure requires every Intervention on the application to be ruled (GRANTED or DENIED)"
    error_id: ERR_INTERVENTION_UNRULED
    http_status: 409
    applies_to: "POST /siting/applications/{applicationId}/record-closure"

  - priority: 12
    category: business_temporal
    check: "A hearing session may only be held once logical_now >= window_start_at"
    error_id: ERR_SESSION_NOT_STARTED
    http_status: 409
    applies_to: "POST /siting/hearing-sessions/{sessionId}/holding"

  - priority: 14
    category: state
    check: "Operations that consume certificate authority require Certificate.posture == ACTIVE (activity start, activity creation, easement offer, condition waiver, closeout)"
    error_id: ERR_CERTIFICATE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /siting/construction-activities, POST /siting/construction-activities/{activityId}/start, POST /siting/certificates/{certificateId}/closeout, POST /siting/certificate-conditions/{conditionId}/waiver"

  - priority: 13
    category: state
    check: "No new easement offer, condemnation filing or condition waiver once Certificate.posture == REVOKED"
    error_id: ERR_CERTIFICATE_REVOKED
    http_status: 409
    applies_to: "POST /siting/easement-tracts/{tractId}/offers, POST /siting/easement-tracts/{tractId}/condemnation, POST /siting/certificate-conditions/{conditionId}/waiver"

  - priority: 20
    category: business_safety
    check: "A construction activity whose window overlaps an ACTIVE SEASONAL_BLACKOUT condition's [blackout_start_mmdd, blackout_end_mmdd] inclusive calendar range, on a segment with habitat_blackout == true, is refused. WAIVED blackout conditions do not constrain."
    error_id: ERR_SEASONAL_BLACKOUT_VIOLATION
    http_status: 422
    applies_to: "POST /siting/construction-activities"

  - priority: 21
    category: business_safety
    check: "An activity may not start while its segment's federal_permit_status IN {REQUIRED, APPLIED, DENIED}"
    error_id: ERR_FEDERAL_PERMIT_MISSING
    http_status: 422
    applies_to: "POST /siting/construction-activities/{activityId}/start"

  - priority: 21
    category: business_safety
    check: "The permit agency must match the crossing kind (PUBLIC_LAND -> BLM|USFS, NAVIGABLE_WATERWAY -> USACE, WETLAND -> USACE) and the segment must have federal_crossing_kind != NONE"
    error_id: ERR_FEDERAL_AGENCY_MISMATCH
    http_status: 422
    applies_to: "POST /siting/route-segments/{segmentId}/federal-permit-actions"

  - priority: 25
    category: business_safety
    check: "The Developer certifying a planning study's sufficiency must not be its authored_by_user_id"
    error_id: ERR_SELF_CERTIFICATION
    http_status: 403
    applies_to: "POST /siting/planning-studies/{studyId}/sufficiency-certification"

  - priority: 25
    category: business_safety
    check: "The Developer filing an application must not be the study's authored_by_user_id"
    error_id: ERR_SELF_CERTIFICATION
    http_status: 403
    applies_to: "POST /siting/applications"

  - priority: 25
    category: business_safety
    check: "The CommissionStaff user recording the decision must not be the presiding_user_id of any HELD HearingSession on the application"
    error_id: ERR_DECIDER_PRESIDED
    http_status: 403
    applies_to: "POST /siting/applications/{applicationId}/decision"

  - priority: 30
    category: business_constraint
    check: "Reject when the new session's buffered CLOSED interval [window_start_at - 120 minutes, window_end_at + 120 minutes] intersects the unbuffered closed interval [window_start_at, window_end_at] of any existing SCHEDULED or HELD session on the same application; touching endpoints count as intersecting"
    error_id: ERR_HEARING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /siting/hearing-sessions"

  - priority: 30
    category: business_constraint
    check: "For a new activity's HALF-OPEN window [window_start_at, window_end_at) on a segment, the sum of crew_count over activities on that segment whose half-open windows intersect it and whose status IN {SCHEDULED, IN_PROGRESS, SUSPENDED}, plus the new crew_count, must not exceed effective_limit = min(segment.crew_capacity, lowest crew_limit among ACTIVE CREW_LIMIT conditions on the certificate). Touching endpoints (one window ending exactly when the next begins) do NOT intersect."
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /siting/construction-activities"

  - priority: 30
    category: business_constraint
    check: "sequence_index must be unique within a route"
    error_id: ERR_SEGMENT_SEQUENCE_DUPLICATE
    http_status: 409
    applies_to: "POST /siting/route-segments"

  - priority: 30
    category: business_constraint
    check: "Constraint mapping requires at least 2 segments whose sequence_index values form a contiguous 1..N run"
    error_id: ERR_SEGMENT_SEQUENCE_GAP
    http_status: 422
    applies_to: "POST /siting/routes/{routeId}/constraint-mapping"

  - priority: 30
    category: business_constraint
    check: "Route.refinement_round must be < 3"
    error_id: ERR_REFINEMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /siting/routes/{routeId}/refinements"

  - priority: 30
    category: business_constraint
    check: "SitingApplication.amendment_round must be < 2"
    error_id: ERR_AMENDMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /siting/applications/{applicationId}/amendments"

  - priority: 30
    category: business_constraint
    check: "EasementTract.offer_round must be < 3"
    error_id: ERR_OFFER_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /siting/easement-tracts/{tractId}/offers"

  - priority: 30
    category: business_constraint
    check: "A project may not have two SitingApplication rows whose review_status is not GRANTED or DENIED"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /siting/applications"

  - priority: 35
    category: business_temporal
    check: "A public comment may not be intaken once logical_now >= Route.comment_window_closes_at"
    error_id: ERR_COMMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /siting/public-comments"

  - priority: 35
    category: business_temporal
    check: "Route nomination of a PROPOSED route requires logical_now >= comment_window_closes_at"
    error_id: ERR_COMMENT_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /siting/routes/{routeId}/nomination"

  - priority: 35
    category: business_temporal
    check: "A payment may only be rescinded while logical_now < paid_at + 30 days"
    error_id: ERR_RESCISSION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /siting/easement-tracts/{tractId}/payment-rescission"

  - priority: 41
    category: business_referential
    check: "A Nonconformance's condition_id must belong to its certificate_id, and its activity_id (when supplied) must belong to the same certificate"
    error_id: ERR_CONDITION_CERTIFICATE_MISMATCH
    http_status: 422
    applies_to: "POST /siting/nonconformances"

  - priority: 40
    category: business_referential
    check: "A ConstructionActivity's segment_id must belong to the Certificate's certified_route_id"
    error_id: ERR_SEGMENT_ROUTE_MISMATCH
    http_status: 422
    applies_to: "POST /siting/construction-activities"

  - priority: 40
    category: business_referential
    check: "An EasementTract's segment_id must belong to a Route whose project_id equals the tract's project_id"
    error_id: ERR_TRACT_SEGMENT_MISMATCH
    http_status: 422
    applies_to: "POST /siting/easement-tracts"

  - priority: 40
    category: business_referential
    check: "A RouteSegment's route and a PublicComment's segment must belong to the route named in the request"
    error_id: ERR_ROUTE_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /siting/public-comments, POST /siting/applications"

  - priority: 41
    category: business_referential
    check: "A SitingApplication's study_id and proposed_route_id must both belong to its project_id"
    error_id: ERR_STUDY_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /siting/applications"

  - priority: 46
    category: business_constraint
    check: "Route nomination requires constraint_density_certified <= 4.00"
    error_id: ERR_CONSTRAINT_DENSITY_EXCEEDED
    http_status: 422
    applies_to: "POST /siting/routes/{routeId}/nomination"

  - priority: 48
    category: business_constraint
    check: "Route nomination of a PROPOSED route requires zero MATERIAL comments still in status RECEIVED"
    error_id: ERR_MATERIAL_COMMENTS_OPEN
    http_status: 422
    applies_to: "POST /siting/routes/{routeId}/nomination"

  - priority: 47
    category: business_constraint
    check: "Route nomination of a PROPOSED route requires open_house_held_count >= 2 across at least 2 distinct counties"
    error_id: ERR_OPEN_HOUSE_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /siting/routes/{routeId}/nomination"

  - priority: 46
    category: business_constraint
    check: "Sufficiency certification requires alternatives_screened_in_count >= 2"
    error_id: ERR_INSUFFICIENT_ALTERNATIVES
    http_status: 422
    applies_to: "POST /siting/planning-studies/{studyId}/sufficiency-certification"

  - priority: 45
    category: business_constraint
    check: "Sufficiency certification requires at least one SCREENED_IN alternative of kind NON_TRANSMISSION or HYBRID (selector empty-pool fallback)"
    error_id: ERR_NO_NONTRANSMISSION_ALTERNATIVE
    http_status: 422
    applies_to: "POST /siting/planning-studies/{studyId}/sufficiency-certification"

  - priority: 45
    category: business_constraint
    check: "Refinement requires at least one segment with material_comment_count >= 1 (selector empty-pool fallback)"
    error_id: ERR_NO_REFINEMENT_TARGET
    http_status: 409
    applies_to: "POST /siting/routes/{routeId}/refinements"

  - priority: 45
    category: business_constraint
    check: "An Alternative's deliverable_mw must be strictly positive for the levelized cost to exist"
    error_id: ERR_ZERO_DELIVERABLE
    http_status: 422
    applies_to: "POST /siting/alternatives"

  - priority: 45
    category: business_constraint
    check: "A condemnation proceeding requires Certificate.eminent_domain_authorized == true and offer_round >= 2"
    error_id: ERR_EMINENT_DOMAIN_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /siting/easement-tracts/{tractId}/condemnation"

  - priority: 46
    category: business_constraint
    check: "A condemnation proceeding may not be filed while Project.right_of_way_hold == true"
    error_id: ERR_RIGHT_OF_WAY_HOLD
    http_status: 409
    applies_to: "POST /siting/easement-tracts/{tractId}/condemnation"

  - priority: 45
    category: business_constraint
    check: "A condemnation award requires before_value_cents > after_value_cents"
    error_id: ERR_NO_VALUE_DIMINUTION
    http_status: 422
    applies_to: "POST /siting/easement-tracts/{tractId}/award"

  - priority: 46
    category: business_referential
    check: "An activity may not start unless every EasementTract on its segment has acquisition_status IN {AGREED, AWARDED} and at least one such tract exists"
    error_id: ERR_EASEMENT_NOT_ACQUIRED
    http_status: 422
    applies_to: "POST /siting/construction-activities/{activityId}/start"

  - priority: 49
    category: state
    check: "Certificate closeout requires zero Nonconformance rows with status == OPEN"
    error_id: ERR_OPEN_NONCONFORMANCE
    http_status: 409
    applies_to: "POST /siting/certificates/{certificateId}/closeout, POST /siting/construction-activities/{activityId}/completion"

  - priority: 48
    category: state
    check: "Certificate closeout requires every segment on the certified route to have construction_state == COMPLETE"
    error_id: ERR_SEGMENTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /siting/certificates/{certificateId}/closeout"

  - priority: 47
    category: business_constraint
    check: "Certificate closeout requires compliance_index_cumulative >= 75.00"
    error_id: ERR_COMPLIANCE_TOO_LOW
    http_status: 422
    applies_to: "POST /siting/certificates/{certificateId}/closeout"

  - priority: 50
    category: business_fiscal
    check: "filing_fee_cents must be >= 2500000"
    error_id: ERR_FILING_FEE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /siting/applications"

  - priority: 51
    category: business_referential
    check: "An application must snapshot at least one NOMINATED ALTERNATE route on the project"
    error_id: ERR_NO_ALTERNATE_ROUTE
    http_status: 422
    applies_to: "POST /siting/applications"

  - priority: 50
    category: business_fiscal
    check: "Project.escrow_balance_cents must be >= EasementTract.committed_cents at payment time"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 402
    applies_to: "POST /siting/easement-tracts/{tractId}/payments"

  - priority: 50
    category: business_fiscal
    check: "An activity may not start unless Project.escrow_funded_cents >= Certificate.escrow_required_cents"
    error_id: ERR_ESCROW_UNDERFUNDED
    http_status: 402
    applies_to: "POST /siting/construction-activities/{activityId}/start"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: "/siting/projects"
    description: "List transmission projects"
    roles: &all_roles [Developer, RouteAnalyst, CommissionStaff, HearingExaminer, Landowner, FederalPermitOfficer, ComplianceMonitor]
    code: 200
    input: ["stage?", "jurisdiction_state?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/siting/projects/{projectId}"
    description: "Read one project with its escrow ledger and schedule posture"
    roles: *all_roles
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/siting/projects/{projectId}/planning-studies"
    description: "List the planning studies on a project (FK reverse lookup for PlanningStudy.project_id)"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlanningStudy[]
    side_effects: []

  - method: GET
    path: "/siting/projects/{projectId}/routes"
    description: "List the routes on a project (FK reverse lookup for Route.project_id)"
    roles: *all_roles
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: GET
    path: "/siting/planning-studies/{studyId}"
    description: "Read one planning study with its computed need ratios"
    roles: *all_roles
    code: 200
    input: []
    output: PlanningStudy
    side_effects: []

  - method: GET
    path: "/siting/planning-studies/{studyId}/alternatives"
    description: "List the alternatives on a study (FK reverse lookup for Alternative.study_id)"
    roles: *all_roles
    code: 200
    input: ["kind?", "screening_status?", "limit?", "offset?"]
    output: Alternative[]
    side_effects: []

  - method: GET
    path: "/siting/alternatives/{alternativeId}"
    description: "Read one alternative with its levelized cost"
    roles: *all_roles
    code: 200
    input: []
    output: Alternative
    side_effects: []

  - method: GET
    path: "/siting/routes/{routeId}"
    description: "Read one route with both constraint-score variants and the density gate value"
    roles: *all_roles
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: GET
    path: "/siting/routes/{routeId}/segments"
    description: "List the segments of a route in sequence order (FK reverse lookup for RouteSegment.route_id)"
    roles: *all_roles
    code: 200
    input: ["survey_status?", "construction_state?", "limit?", "offset?"]
    output: RouteSegment[]
    side_effects: []

  - method: GET
    path: "/siting/route-segments/{segmentId}"
    description: "Read one route segment with its permit, crew and comment counters"
    roles: *all_roles
    code: 200
    input: []
    output: RouteSegment
    side_effects: []

  - method: GET
    path: "/siting/public-comments"
    description: "List public comments (FK reverse lookup for PublicComment.route_id, segment_id and commenter_landowner_id)"
    roles: *all_roles
    code: 200
    input: ["route_id?", "segment_id?", "commenter_landowner_id?", "materiality?", "status?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []

  - method: GET
    path: "/siting/public-comments/{commentId}"
    description: "Read one public comment"
    roles: *all_roles
    code: 200
    input: []
    output: PublicComment
    side_effects: []

  - method: GET
    path: "/siting/applications"
    description: "List siting applications (FK reverse lookup for SitingApplication.project_id, study_id and proposed_route_id)"
    roles: *all_roles
    code: 200
    input: ["project_id?", "study_id?", "proposed_route_id?", "review_status?", "record_status?", "limit?", "offset?"]
    output: SitingApplication[]
    side_effects: []

  - method: GET
    path: "/siting/applications/{applicationId}"
    description: "Read one application with both status dimensions, party_count and decision_deadline_at"
    roles: *all_roles
    code: 200
    input: []
    output: SitingApplication
    side_effects: []

  - method: GET
    path: "/siting/applications/{applicationId}/hearing-sessions"
    description: "List the hearing sessions on an application (FK reverse lookup for HearingSession.application_id)"
    roles: *all_roles
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: HearingSession[]
    side_effects: []

  - method: GET
    path: "/siting/hearing-sessions/{sessionId}"
    description: "Read one hearing session"
    roles: *all_roles
    code: 200
    input: []
    output: HearingSession
    side_effects: []

  - method: GET
    path: "/siting/interventions"
    description: "List interventions (FK reverse lookup for Intervention.application_id and landowner_id)"
    roles: *all_roles
    code: 200
    input: ["application_id?", "landowner_id?", "status?", "petitioner_kind?", "limit?", "offset?"]
    output: Intervention[]
    side_effects: []

  - method: GET
    path: "/siting/interventions/{interventionId}"
    description: "Read one intervention petition and its ruling"
    roles: *all_roles
    code: 200
    input: []
    output: Intervention
    side_effects: []

  - method: GET
    path: "/siting/certificates"
    description: "List certificates (FK reverse lookup for Certificate.application_id and certified_route_id)"
    roles: *all_roles
    code: 200
    input: ["application_id?", "certified_route_id?", "status?", "posture?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: GET
    path: "/siting/certificates/{certificateId}"
    description: "Read one certificate with its escrow requirement and both compliance indices"
    roles: *all_roles
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/siting/certificates/{certificateId}/conditions"
    description: "List the conditions attached to a certificate, ordered created_at ASC (i.e. in the order the order's conditions array supplied them); FK reverse lookup for CertificateCondition.certificate_id"
    roles: *all_roles
    code: 200
    input: ["category?", "constraint_kind?", "status?", "limit?", "offset?"]
    output: CertificateCondition[]
    side_effects: []

  - method: GET
    path: "/siting/certificate-conditions/{conditionId}"
    description: "Read one certificate condition"
    roles: *all_roles
    code: 200
    input: []
    output: CertificateCondition
    side_effects: []

  - method: GET
    path: "/siting/landowners"
    description: "List landowners of record"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: Landowner[]
    side_effects: []

  - method: GET
    path: "/siting/landowners/{landownerId}"
    description: "Read one landowner"
    roles: *all_roles
    code: 200
    input: []
    output: Landowner
    side_effects: []

  - method: GET
    path: "/siting/easement-tracts"
    description: "List easement tracts (FK reverse lookup for EasementTract.project_id, segment_id and landowner_id)"
    roles: *all_roles
    code: 200
    input: ["project_id?", "segment_id?", "landowner_id?", "acquisition_status?", "payment_status?", "limit?", "offset?"]
    output: EasementTract[]
    side_effects: []

  - method: GET
    path: "/siting/easement-tracts/{tractId}"
    description: "Read one easement tract with both status dimensions and all compensation figures"
    roles: *all_roles
    code: 200
    input: []
