# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules × 2 instances = 18 instances. Grounds resolve into
# SCAFFOLD.yaml §1.1–§1.7. All setup_api_calls/trigger chains are executable
# from empty-DB using only §1.5 endpoints. Logical-clock default 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_provisional_vs_final
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.provisional_fee_cents
          - entities.Permit.fields.final_fee_cents
          - state_machines.Permit.OFFERED_to_ACTIVE
          - entities.Invoice.fields.amount_refunded_cents
        distinguishing_aspect: |
          On the Permit domain, the provisional variant charges the full-season gross (170000)
          at offer while the final variant prorates to the activation date (157066), and the
          12934-cent difference is refunded on the invoice — two variants, different numbers.
        test_recipe:
          setup:
            - "Marina season 2026-05-01..2026-10-31, liveaboard_cap 2. One SLIP/MEDIUM berth (max 40ft)."
            - "RESIDENT boater, 30ft vessel with holding tank, registration valid through 2026-12-31."
            - "Liveaboard permit OFFERED (provisional 170000 billed). Clock advanced to 2026-05-15 before payment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove Marina", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2, pumpout_interval_days: 30 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Rae Resident", email: "rae@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Otter", length_ft: 30, registration_number: "REG-1", registration_expiry_date: "2026-12-31", has_holding_tank: true }
              as: Boater
              as_user_id: "${boater_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026, is_liveaboard: true }
              as: Boater
              as_user_id: "${boater_id}"
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id, prov: $.data.provisional_fee_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Harbormaster
          trigger:
            - call: "POST /marina/invoices/${inv_id}/pay"
              payload: { amount_cents: 170000 }
              as: Boater
              as_user_id: "${boater_id}"
          assert:
            - "Permit.${permit_id}.provisional_fee_cents == 170000"
            - "Permit.${permit_id}.final_fee_cents == 157066"
            - "Permit.${permit_id}.status == ACTIVE"
            - "Invoice.${inv_id}.amount_refunded_cents == 12934"

      - name: derelict_cost_estimated_vs_actual
        grounds:
          - calculations.derelict_cost
          - entities.DerelictReport.fields.estimated_cost_cents
          - entities.DerelictReport.fields.actual_cost_cents
          - state_machines.DerelictReport.OPEN_to_NOTICE_SERVED
          - state_machines.DerelictReport.NOTICE_SERVED_to_IMPOUNDED
        distinguishing_aspect: |
          On the DerelictReport domain (different entity from permit fees), the estimated variant
          bills a flat 15000 at notice while the actual variant adds tow + per-day storage to 85000
          at impound — dual-variant cost accounting on a second, distinct subject.
        test_recipe:
          setup:
            - "Marina + RESIDENT boater + registered vessel."
            - "DerelictReport served on 2026-06-01 (estimated 15000), then impounded on 2026-06-11 (10 storage days -> actual 85000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Dana D", email: "dana@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Rustbucket", length_ft: 26, registration_number: "REG-9", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/derelict-reports"
              payload: { vessel_id: "${vessel_id}", reason: "abandoned, taking on water" }
              as: Harbormaster
              captures: { report_id: $.data.id }
            - call: "POST /marina/derelict-reports/${report_id}/serve-notice"
              payload: {}
              as: Harbormaster
              captures: { der_inv: $.data.invoice_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: Harbormaster
          trigger:
            - call: "POST /marina/derelict-reports/${report_id}/close"
              payload: { disposition: "IMPOUNDED" }
              as: Harbormaster
          assert:
            - "DerelictReport.${report_id}.estimated_cost_cents == 15000"
            - "DerelictReport.${report_id}.actual_cost_cents == 85000"
            - "DerelictReport.${report_id}.status == IMPOUNDED"
            - "Invoice.${der_inv}.amount_due_cents == 85000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_gross_tiered_multiplier_mode_a
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.provisional_fee_cents
          - entities.Boater.fields.residency_status
        distinguishing_aspect: |
          Mode (a): gross = tiered_rate(berth_type) * ceil(length_ft) * residency_multiplier + liveaboard_branch —
          three inputs with non-linear interaction; NON_RESIDENT mooring 24ft = round(2500*24*1.75) = 105000.
        test_recipe:
          setup:
            - "Marina + one MOORING/SMALL berth (max 30ft) + NON_RESIDENT boater + 24ft vessel (no holding tank)."
            - "Permit applied for MOORING/SMALL -> immediate OFFER, provisional computed on the response."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "MOORING", size_class: "SMALL", max_length_ft: 30 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Nate NonRes", email: "nate@example.com", residency_status: "NON_RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Gull", length_ft: 24, registration_number: "REG-2", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "MOORING", requested_size_class: "SMALL", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id }
          assert:
            - "Permit.${permit_id}.provisional_fee_cents == 105000"
            - "Permit.${permit_id}.fee_basis == NON_RESIDENT"
            - "Permit.${permit_id}.status == OFFERED"

      - name: permit_fee_proration_rounding_order_mode_b
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.final_fee_cents
          - state_machines.Permit.OFFERED_to_ACTIVE
        distinguishing_aspect: |
          Mode (b): proration rounds EACH component (length 110870 + liveaboard 46196) then sums to 157066;
          the sum-then-round alternative would give 157065 — the scaffold pins per-component-round-then-sum.
        test_recipe:
          setup:
            - "RESIDENT liveaboard permit on a SLIP/MEDIUM berth, 30ft vessel, activated on 2026-05-15."
            - "remaining_days=170, season_days=184; per-component rounding is the pinned order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2, pumpout_interval_days: 30 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Rae Resident", email: "rae@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Otter", length_ft: 30, registration_number: "REG-3", registration_expiry_date: "2026-12-31", has_holding_tank: true }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026, is_liveaboard: true }
              as: Harbormaster
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Harbormaster
          trigger:
            - call: "POST /marina/invoices/${inv_id}/pay"
              payload: { amount_cents: 170000 }
              as: Harbormaster
          assert:
            - "Permit.${permit_id}.final_fee_cents == 157066"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_active_suspended_active_cycle
        grounds:
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - state_machines.Permit.SUSPENDED_to_ACTIVE
          - calculations.pumpout_compliance
        distinguishing_aspect: |
          Permit is a cyclic machine: ACTIVE -> SUSPENDED (pump-out OVERDUE at run-maintenance) -> ACTIVE
          (a pump-out record restores compliance); the same entity revisits ACTIVE, not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE permit (activated 2026-05-15) with holding-tank vessel, pumpout_interval 30."
            - "Clock advanced to 2026-06-16 (32 days since activation) then run-maintenance -> SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2, pumpout_interval_days: 30 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Rae Resident", email: "rae@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Otter", length_ft: 30, registration_number: "REG-4", registration_expiry_date: "2026-12-31", has_holding_tank: true }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id, amt: $.data.provisional_fee_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/invoices/${inv_id}/pay"
              payload: { amount_cents: 120000 }
              as: Harbormaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas/${marina_id}/run-maintenance"
              payload: {}
              as: Harbormaster
          trigger:
            - call: "POST /marina/vessels/${vessel_id}/pump-out-records"
              payload: { pumpout_date: "2026-06-16" }
              as: Harbormaster
          assert:
            - "Permit.${permit_id}.status == ACTIVE"
            - "Vessel.${vessel_id}.pumpout_status == COMPLIANT"

      - name: derelict_report_branch_resolved_vs_impounded
        grounds:
          - state_machines.DerelictReport.NOTICE_SERVED_to_RESOLVED
          - state_machines.DerelictReport.NOTICE_SERVED_to_IMPOUNDED
        distinguishing_aspect: |
          DerelictReport forks from NOTICE_SERVED: the RESOLVED branch leaves the vessel REGISTERED while the
          IMPOUNDED branch drives Vessel -> REVOKED — divergent side-effect sets on a different entity than Permit.
        test_recipe:
          setup:
            - "Two vessels each with an OPEN derelict report served on 2026-06-01."
            - "Report A closed RESOLVED; report B closed IMPOUNDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Owner A", email: "a@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_a: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_a}", name: "VesselA", length_ft: 22, registration_number: "REG-A", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_a: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_a}", name: "VesselB", length_ft: 22, registration_number: "REG-B", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_b: $.data.id }
            - call: "POST /marina/derelict-reports"
              payload: { vessel_id: "${vessel_a}", reason: "unclaimed" }
              as: Harbormaster
              captures: { report_a: $.data.id }
            - call: "POST /marina/derelict-reports/${report_a}/serve-notice"
              payload: {}
              as: Harbormaster
            - call: "POST /marina/derelict-reports"
              payload: { vessel_id: "${vessel_b}", reason: "abandoned" }
              as: Harbormaster
              captures: { report_b: $.data.id }
            - call: "POST /marina/derelict-reports/${report_b}/serve-notice"
              payload: {}
              as: Harbormaster
            - call: "POST /marina/derelict-reports/${report_a}/close"
              payload: { disposition: "RESOLVED" }
              as: Harbormaster
          trigger:
            - call: "POST /marina/derelict-reports/${report_b}/close"
              payload: { disposition: "IMPOUNDED" }
              as: Harbormaster
          assert:
            - "DerelictReport.${report_a}.status == RESOLVED"
            - "Vessel.${vessel_a}.registration_status == REGISTERED"
            - "DerelictReport.${report_b}.status == IMPOUNDED"
            - "Vessel.${vessel_b}.registration_status == REVOKED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: derelict_impound_revoke_release_promote_depth4
        grounds:
          - state_machines.DerelictReport.NOTICE_SERVED_to_IMPOUNDED
          - state_machines.Permit.ACTIVE_to_REVOKED
          - state_machines.Berth.OCCUPIED_to_AVAILABLE
          - state_machines.Permit.WAITLISTED_to_OFFERED
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          One trigger (close IMPOUNDED) chains 4 caused hops: report->IMPOUNDED forces Vessel->REVOKED,
          which forces its Permit->REVOKED, which frees the Berth (OCCUPIED->AVAILABLE), which promotes the
          next WAITLISTED permit to OFFERED — each hop caused strictly by the prior, depth >= 3.
        test_recipe:
          setup:
            - "One SLIP/MEDIUM berth. permit1 ACTIVE on it (holder1, vessel1). permit2 WAITLISTED (holder2, vessel2, same type/size)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Holder One", email: "h1@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater1: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater1}", name: "V1", length_ft: 30, registration_number: "REG-C1", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel1: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater1}", vessel_id: "${vessel1}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit1: $.data.id, inv1: $.data.invoice_id }
            - call: "POST /marina/invoices/${inv1}/pay"
              payload: { amount_cents: 120000 }
              as: Harbormaster
            - call: "POST /marina/boaters"
              payload: { full_name: "Holder Two", email: "h2@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater2: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater2}", name: "V2", length_ft: 28, registration_number: "REG-C2", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel2: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater2}", vessel_id: "${vessel2}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit2: $.data.id }
            - call: "POST /marina/derelict-reports"
              payload: { vessel_id: "${vessel1}", reason: "sank at slip" }
              as: Harbormaster
              captures: { report_id: $.data.id }
            - call: "POST /marina/derelict-reports/${report_id}/serve-notice"
              payload: {}
              as: Harbormaster
          trigger:
            - call: "POST /marina/derelict-reports/${report_id}/close"
              payload: { disposition: "IMPOUNDED" }
              as: Harbormaster
          assert:
            - "Vessel.${vessel1}.registration_status == REVOKED"
            - "Permit.${permit1}.status == REVOKED"
            - "Permit.${permit2}.status == OFFERED"
            - "Permit.${permit2}.berth_id == ${berth_id}"
            - "Berth.${berth_id}.status == RESERVED"

      - name: transfer_old_permit_new_permit_new_invoice_depth2
        grounds:
          - state_machines.Permit.ACTIVE_to_TRANSFERRED
          - entities.Permit.fields.source
          - entities.Invoice.fields.invoice_type
        distinguishing_aspect: |
          A different trigger (transfer) chains: transfer mutates the old Permit->TRANSFERRED, which spawns a
          new ACTIVE Permit (source=TRANSFER), whose creation issues a TRANSFER Invoice for 5000 to the new
          holder — a billing propagation distinct from the derelict/waitlist cascade, depth >= 2.
        test_recipe:
          setup:
            - "permit1 ACTIVE on a SLIP/MEDIUM berth (holder1). Second boater holder2 exists as transfer target."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Holder One", email: "t1@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater1: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater1}", name: "V1", length_ft: 30, registration_number: "REG-T1", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel1: $.data.id }
