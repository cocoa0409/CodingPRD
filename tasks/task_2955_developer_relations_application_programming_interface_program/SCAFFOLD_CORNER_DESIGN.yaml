          setup:
            - "product PT has sustained_rpm_pool 3000 and monthly_call_pool 500000, with a GA version"
            - "three uncertified developers (trust 56, multiplier 0.75) each hold an APPROVED PARTNER application requesting 500000 monthly calls; desired sustained is floor(3000 * 0.75 * 1.0) = 2250"
