# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index (breadth)
# Weigh Station Bypass & Fleet Compliance Service
# Enumerates every testable claim of SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Names are unique across
# both files. Sections follow the claim-extraction-guide taxonomy.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: carrier_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Carrier, state_machines.Carrier]
        distinguishing_aspect: "POST /api/carriers returns 201 with server-managed defaults: status ENROLLED, eligibility_status NOT_EVALUATED, credit_balance_cents 0, credit_ledger [], closed_billing_periods [], version 1, server-minted UUID id and ISO8601 created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_status: $.data.status, car_posture: $.data.eligibility_status, car_balance: $.data.credit_balance_cents, car_v: $.data.version }
          assert:
            - "response 201; status == ENROLLED; eligibility_status == NOT_EVALUATED; credit_balance_cents == 0; credit_ledger == []; closed_billing_periods == []; version == 1"
            - "id is a type-prefix-free UUID; created_at has ISO8601 UTC form"

      - name: carrier_create_missing_dot_number_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Carrier.fields.dot_number, "validations[priority=17]"]
        distinguishing_aspect: "Omitting required input dot_number yields ERR_INVALID_REQUEST (400); no row created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/carriers"
              payload: { legal_name: "No Dot" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: carrier_create_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Carrier.fields.credit_balance_cents, entities.Carrier.fields.status]
        distinguishing_aspect: "Client-supplied computed/system fields (status, credit_balance_cents, version, credit_ledger) are ignored: the created carrier shows status ENROLLED, balance 0, version 1 regardless of input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling", status: "ACTIVE", credit_balance_cents: 9999, version: 42 }
              as: PlatformAdmin
              captures: { car_status: $.data.status, car_balance: $.data.credit_balance_cents, car_v: $.data.version }
          assert:
            - "201 created with status == ENROLLED, credit_balance_cents == 0, version == 1 (inputs silently ignored, not errors)"

      - name: carrier_duplicate_dot_number_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_DOT_NUMBER]"]
        distinguishing_aspect: "Second carrier with the same dot_number is rejected ERR_DUPLICATE_DOT_NUMBER (409)."
        test_recipe:
          setup: ["carrier with dot_number 100001 exists"]
          setup_api_calls:
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Copycat Lines" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_DOT_NUMBER (409)"

      - name: carrier_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_CARRIER_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/carriers/{random-uuid} yields ERR_CARRIER_NOT_FOUND (404) with the standard error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/carriers/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CARRIER_NOT_FOUND (404); envelope data carries error_id and message"

      - name: vehicle_gvwr_zero_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Vehicle.fields.gvwr_lbs, "validations[priority=17]"]
        distinguishing_aspect: "gvwr_lbs 0 violates the > 0 constraint -> ERR_INVALID_REQUEST (400), evaluated after ownership and carrier-state checks."
        test_recipe:
          setup: ["clock 2026-08-01; carrier ACTIVE (snapshot iss 30 approved)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 0 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); no vehicle row created"

      - name: bypass_event_immutability_common_fields
        claim_type: immutability
        grounds: [entities.BypassEvent]
        distinguishing_aspect: "BypassEvent is common_fields:false: the response carries id and created_at but NO version or updated_at, and no endpoint mutates a recorded event (immutable audit trail)."
        test_recipe:
          setup: ["clock 2026-08-05T12:00:00Z; full bypass-capable fixture (config PARTICIPATING, station, carrier ACTIVE, vehicle, subscription, ACTIVE credential)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA", requires_weight_clearance: true }
              as: StateProgramManager
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { participation_status: "PARTICIPATING", expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
            - call: "POST /api/stations"
              payload: { state_program_config_id: "${cfg_id}", station_code: "CA-S1", station_type: "FIXED_SCALE", supported_channel: "BOTH" }
              as: StateProgramManager
              captures: { st_id: $.data.id }
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-08-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh_id}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-05T10:00:00Z", measured_weight_lbs: 80000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { ev_id: $.data.id, ev_dec: $.data.decision }
          assert:
            - "201 response contains id and created_at but no version and no updated_at keys"
            - "decision == BYPASS_GRANTED; decision_reasons == []; ruleset_version == 2 (config created v1, patched once)"
            - "re-GET via /api/bypass-events?carrier_id shows the same decision (immutable)"

      - name: credential_duplicate_serial_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_DEVICE_SERIAL]"]
        distinguishing_aspect: "Reusing device_serial SN-0001 on a second credential (even for a different vehicle) -> ERR_DUPLICATE_DEVICE_SERIAL (409)."
        test_recipe:
          setup: ["clock 2026-08-01; carrier ACTIVE; vehicles VIN-0001 and VIN-0002; credential SN-0001 (TRANSPONDER) on VIN-0001"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh1: $.data.id }
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0002", plate_number: "P-2", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh2: $.data.id }
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh1}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
          trigger:
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh2}", device_type: "MOBILE_APP", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_DEVICE_SERIAL (409) — serial uniqueness is global, not per-vehicle"

      - name: credential_second_same_type_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=18]", "errors[ERR_CREDENTIAL_TYPE_ALREADY_ACTIVE]"]
        distinguishing_aspect: "A vehicle may hold one TRANSPONDER plus one MOBILE_APP, but a second non-DEACTIVATED TRANSPONDER -> ERR_CREDENTIAL_TYPE_ALREADY_ACTIVE (409)."
        test_recipe:
          setup: ["clock 2026-08-01; carrier ACTIVE; vehicle VIN-0001 with TRANSPONDER credential SN-0001 PROVISIONED"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh1: $.data.id }
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh1}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
          trigger:
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh1}", device_type: "MOBILE_APP", device_serial: "SN-0002" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred2: $.data.id }
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh1}", device_type: "TRANSPONDER", device_serial: "SN-0003" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { err: $.data.error_id }
          assert:
            - "MOBILE_APP credential SN-0002 created (201) — one per device_type allowed"
            - "second TRANSPONDER SN-0003 rejected ERR_CREDENTIAL_TYPE_ALREADY_ACTIVE (409)"

      - name: config_duplicate_state_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_STATE_CONFIG]"]
        distinguishing_aspect: "A second StateProgramConfig for state_code CA -> ERR_DUPLICATE_STATE_CONFIG (409)."
        test_recipe:
          setup: ["config CA exists"]
          setup_api_calls:
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA" }
              as: StateProgramManager
          trigger:
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA", random_pull_in_rate_bps: 500 }
              as: StateProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_STATE_CONFIG (409)"

      - name: station_duplicate_code_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_STATION_CODE]"]
        distinguishing_aspect: "station_code is globally unique across configs: a second CA-S1 under ANY config -> ERR_DUPLICATE_STATION_CODE (409)."
        test_recipe:
          setup: ["configs CA and NV; station CA-S1 under CA config"]
          setup_api_calls:
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA" }
              as: StateProgramManager
              captures: { cfg_ca: $.data.id }
            - call: "POST /api/state-program-configs"
              payload: { state_code: "NV" }
              as: StateProgramManager
              captures: { cfg_nv: $.data.id }
            - call: "POST /api/stations"
              payload: { state_program_config_id: "${cfg_ca}", station_code: "CA-S1", station_type: "FIXED_SCALE", supported_channel: "BOTH" }
              as: StateProgramManager
          trigger:
            - call: "POST /api/stations"
              payload: { state_program_config_id: "${cfg_nv}", station_code: "CA-S1", station_type: "WIM_ONLY", supported_channel: "MOBILE_APP" }
              as: StateProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_STATION_CODE (409)"

      - name: vehicle_duplicate_vin_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_VIN]"]
        distinguishing_aspect: "vin is globally unique across carriers: carrier B cannot register VIN-0001 -> ERR_DUPLICATE_VIN (409)."
        test_recipe:
          setup: ["clock 2026-08-01; carriers A (dot 100001) and B (dot 100002) both ACTIVE; carrier A has vehicle VIN-0001"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Carrier A" }
              as: PlatformAdmin
              captures: { carA: $.data.id, carA_v: $.data.version }
            - call: "POST /api/carriers"
              payload: { dot_number: "100002", legal_name: "Carrier B" }
              as: PlatformAdmin
              captures: { carB: $.data.id, carB_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${carA}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${carA_v}" }
              as: SafetyDataFeed
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${carB}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${carB_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${carA}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/carriers/${carB}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${carA}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${carA}"
          trigger:
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${carB}", vin: "VIN-0001", plate_number: "P-9", plate_state: "NV", home_state_code: "NV", gvwr_lbs: 60000 }
              as: CarrierManager
              as_user_id: "${carB}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_VIN (409)"
  - section: state_machines
    instances:
      - name: carrier_terminal_lockdown_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Carrier, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A TERMINATED carrier rejects every further transition (ACTIVE, SUSPENDED, TERMINATED) with ERR_INVALID_STATE_TRANSITION (409)."
        test_recipe:
          setup: ["clock 2026-08-01; carrier created"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "TERMINATED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); carrier remains TERMINATED"

      - name: carrier_terminate_cascades_children
        claim_type: side_effect_execution
        grounds: [state_machines.Carrier.ACTIVE_to_TERMINATED, state_machines.BypassCredential, state_machines.VehicleSubscription, state_machines.EligibilityOverride]
        distinguishing_aspect: "Terminating an ACTIVE carrier cascades: credential -> DEACTIVATED (CARRIER_TERMINATED), subscription -> CLOSED (TERMINATED_CARRIER), REQUESTED override -> REVOKED — all visible via the filtered list GETs."
        test_recipe:
          setup: ["clock 2026-08-01; carrier ACTIVE (iss 30); vehicle with subscription ACTIVE and credential ACTIVE; override REQUESTED [2026-09-01, 2026-10-01)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { car_v2: $.data.version }
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-08-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh_id}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/eligibility-overrides"
              payload: { carrier_id: "${car_id}", reason: "precautionary", start_date: "2026-09-01", end_date: "2026-10-01", expected_carrier_version: "${car_v2}" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { ov_id: $.data.id }
          trigger:
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "TERMINATED" }
              as: PlatformAdmin
            - call: "GET /api/bypass-credentials"
              payload: { carrier_id: "${car_id}" }
              as: PlatformAdmin
              captures: { cred_status: "$.data[0].status", cred_reason: "$.data[0].status_reason" }
            - call: "GET /api/vehicle-subscriptions"
