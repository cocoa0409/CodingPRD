  - section: cross_cutting_complexity_layers
    intent: >
      §0.2 declares four active layers. optimistic_concurrency needs one test per §1.2.1
      entry: the SealJob->VerificationReport rule is driven by the errors-section instance
      above, so the DuctSystem->SealJob rule is driven here, with the supersede semantics
      that motivate it. cascading_side_effects is covered twice in §1.8, but only for the
      asbestos and inspector chains — the POST-phase combustion failure chain is a third,
      independent cascade and is exercised here. rate_threshold_triggers has three distinct
      thresholds (latched target, windowed stall rate, instantaneous pressure cutoff); the
      cutoff sits in the errors section and the stall boundary in §1.8, so the latch and the
      flag reset are exercised here. dual_variant_calculation is fully covered by §1.8.
    instances:
      - name: stale_duct_system_version_loses_the_supersede_race
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[seal-job-create-stale-duct-system]
          - endpoints[POST /duct-sealing/seal-jobs]
          - state_machines.SealJob[SCHEDULED->ABORTED_SUPERSEDED]
        distinguishing_aspect: "This is the whole point of the first §1.2.1 rule: a second seal-job create legitimately SUPERSEDES the first, so a caller holding a stale DuctSystem.version would silently abort a job it never saw. The instance runs the same create three times — correct version (succeeds), the now-stale version (412), then the refreshed version (succeeds and supersedes) — and checks that the version moved by exactly one per accepted write and not at all on the 412."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one CLEARED duct system AHU-1 with an ACCEPTED PRE test (baseline 300.00) and one ACTIVE technician"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/record"
              payload: { measured_leakage_cfm: 300.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "ACCEPT", review_note: "baseline accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
          trigger:
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { v_a: $.data.version, active_a: $.data.active_seal_job_id }
            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "${tech1_id}", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T18:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${v_a}" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job1_id: $.data.id, job1_v: $.data.version, job1_status: $.data.status }
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { v_b: $.data.version, active_b: $.data.active_seal_job_id }
            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "${tech1_id}", scheduled_start_at: "2026-08-02T18:00:00Z", scheduled_end_at: "2026-08-02T22:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${v_a}" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /duct-sealing/seal-jobs/${job1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job1_after_412: $.data.status }
            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "${tech1_id}", scheduled_start_at: "2026-08-02T18:00:00Z", scheduled_end_at: "2026-08-02T22:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${v_b}" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job2_id: $.data.id, job2_status: $.data.status }
            - call: "GET /duct-sealing/seal-jobs/${job1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job1_final: $.data.status, job1_why: $.data.abort_reason }
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { v_c: $.data.version, active_c: $.data.active_seal_job_id }
            - call: "GET /duct-sealing/technicians/${tech1_id}"
              as: ProgramAdmin
              captures: { open_jobs: $.data.open_seal_job_count }
          assert:
            - "${active_a} == null before any job exists; the first create returns HTTP 201 with ${job1_status} == SCHEDULED and ${job1_v} == 1"
            - "${v_b} == ${v_a} + 1 and ${active_b} == ${job1_id}: POST /seal-jobs increments DuctSystem.version by exactly 1 and repoints active_seal_job_id"
            - "The second create with the now-stale ${v_a} returns HTTP 412 with ${e_stale} == ERR_STALE_DUCT_SYSTEM_VERSION"
            - "${job1_after_412} == SCHEDULED: the 412 did NOT supersede the first job — that is the loss the OCC guard exists to prevent"
            - "GET /duct-sealing/seal-jobs reports total_count == 1 immediately after the 412, and DuctSystem.version is still ${v_b}"
            - "The retry with ${v_b} returns HTTP 201 with ${job2_status} == SCHEDULED"
            - "${job1_final} == ABORTED_SUPERSEDED with ${job1_why} == 'superseded by a newer scheduled job'"
            - "${v_c} == ${v_b} + 1 and ${active_c} == ${job2_id}"
            - "${open_jobs} == 1: the supersede side effect decremented the count for the aborted job and incremented it for the new one"
            - "The two job windows are adjacent (18:00 end, 18:00 start) so ERR_TECHNICIAN_SCHEDULE_CONFLICT never fires and cannot mask the 412"

