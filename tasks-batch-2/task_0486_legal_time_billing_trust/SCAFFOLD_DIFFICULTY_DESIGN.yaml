  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: timekeeper_halfopen_time_overlap
        grounds:
          - validations[priority=11]
          - entities.TimeEntry.fields.worked_at
          - errors[ERR_TIME_OVERLAP]
        distinguishing_aspect: |
          Resource = Timekeeper, HALF-OPEN [worked_at, worked_at+minutes) interval semantics: a second
          entry whose interval overlaps the first for the SAME timekeeper is rejected, BUT a back-to-back
          entry that starts exactly when the first ends (touching endpoints) is ACCEPTED — adjacency is
          legal under half-open arithmetic.
        test_recipe:
          setup:
            - "PARTNER timekeeper; one CAPTURED time entry [09:00, 10:00) (min60) on an OPEN matter."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme Matter", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
          trigger:
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:30:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { err: $.data.error_id }
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T10:00:00Z", minutes: 30, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { ok_id: $.data.id }
          assert:
            - "overlapping entry [09:30,10:30) returns HTTP 409 error_id == ERR_TIME_OVERLAP"
            - "back-to-back entry [10:00,10:30) succeeds (201) — touching endpoint allowed (half-open)"

      - name: retainer_hold_closed_interval_touching_collides
        grounds:
          - validations[priority=12]
          - entities.RetainerHold.fields.hold_start_at
          - entities.RetainerHold.fields.hold_end_at
          - errors[ERR_HOLD_OVERLAP]
        distinguishing_aspect: |
          A DIFFERENT resource (ClientTrustLedger) with CLOSED [hold_start_at, hold_end_at] interval
          semantics: unlike the half-open time entries, two holds whose endpoints merely TOUCH
          (a.end == b.start) DO collide -> ERR_HOLD_OVERLAP. Different geometric adjacency treatment on a
          different resource entity.
        test_recipe:
          setup:
            - "Client trust ledger with one ACTIVE hold over [2026-06-01, 2026-06-10]."
          setup_api_calls:
            - call: "POST /firm/trust-accounts"
              payload: { name: "IOLTA Pool" }
              as: PlatformAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/trust-ledgers"
              payload: { trust_account_id: "${ta_id}", client_id: "${cl_id}", retainer_floor_cents: 0 }
              as: BillingClerk
              captures: { led_id: $.data.id }
            - call: "POST /firm/retainer-holds"
              payload: { client_trust_ledger_id: "${led_id}", amount_cents: 20000, hold_start_at: "2026-06-01T00:00:00Z", hold_end_at: "2026-06-10T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /firm/retainer-holds"
              payload: { client_trust_ledger_id: "${led_id}", amount_cents: 15000, hold_start_at: "2026-06-10T00:00:00Z", hold_end_at: "2026-06-20T00:00:00Z" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "touching hold starting exactly at 2026-06-10T00:00:00Z returns HTTP 409 error_id == ERR_HOLD_OVERLAP (closed interval, endpoints collide)"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: trust_reverse_preserves_three_way
        grounds:
          - state_machines.TrustTransaction.CONFIRMED_to_VOIDED
          - calculations.three_way_reconcile
          - entities.TrustAccount.fields.book_balance_cents
          - entities.ClientTrustLedger.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = trust three-way (book_balance_cents == sum of ClientTrustLedger
          balance_cents == bank_balance_cents). A confirmed 100000 DEPOSIT then its reversal leaves all
          three legs back at 0 — book - sum(ledgers) stays exactly 0 through the forward+compensating pair.
        test_recipe:
          setup:
            - "Trust account with one client sub-ledger; a CONFIRMED 100000 DEPOSIT (book=client=bank=100000)."
          setup_api_calls:
            - call: "POST /firm/trust-accounts"
              payload: { name: "IOLTA Pool" }
              as: PlatformAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/trust-ledgers"
              payload: { trust_account_id: "${ta_id}", client_id: "${cl_id}", retainer_floor_cents: 0 }
              as: BillingClerk
              captures: { led_id: $.data.id }
            - call: "POST /firm/trust-transactions"
              payload: { client_trust_ledger_id: "${led_id}", kind: "DEPOSIT", amount_cents: 100000, initiated_by_user_id: "clerk-1" }
              as: BillingClerk
              captures: { dep_id: $.data.id }
            - call: "POST /firm/trust-transactions/${dep_id}/confirm"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /firm/trust-transactions/${dep_id}/reverse"
              payload: {}
              as: Attorney
              as_user_id: "att-9"
            - call: "GET /firm/trust-accounts/${ta_id}/reconciliation"
              payload: {}
              as: BillingClerk
              captures: { book: $.data.leg_book_cents, client: $.data.leg_client_cents, bank: $.data.leg_bank_cents, rec: $.data.reconciled }
          assert:
            - "reconciliation leg_book_cents == 0 after reverse"
            - "reconciliation leg_client_cents == 0 after reverse"
            - "reconciliation leg_bank_cents == 0 after reverse"
            - "reconciliation reconciled == true (book == client == bank == 0; invariant preserved)"

      - name: payment_reverse_preserves_ar_identity
        grounds:
          - state_machines.Payment.APPLIED_to_REVERSED
          - calculations.ar_realization
          - entities.Client.fields.ar_balance_cents
          - entities.Invoice.fields.amount_paid_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = client A/R identity (Client.ar_balance_cents == sum over
          ISSUED/PARTIALLY_PAID invoices of total-paid-written_off). Applying a 50000 payment then
          reversing it returns ar_balance_cents to 50000 and the invoice to ISSUED — the A/R identity is
          conserved across the forward+compensating pair, distinct from the trust three-way.
        test_recipe:
          setup:
            - "ISSUED invoice total 50000; client ar_balance 50000 before any payment."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme Matter", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /firm/invoices/${inv_id}/payments"
              payload: { amount_cents: 50000, method: "CHECK" }
              as: BillingClerk
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /firm/payments/${pay_id}/reverse"
              payload: {}
              as: BillingClerk
            - call: "GET /firm/invoices/${inv_id}"
              payload: {}
              as: BillingClerk
              captures: { bstat: $.data.billing_status, paid: $.data.amount_paid_cents }
            - call: "GET /firm/clients/${cl_id}/ar-summary"
              payload: {}
              as: BillingClerk
              captures: { ar: $.data.ar_balance_cents }
          assert:
            - "Invoice.${inv_id}.amount_paid_cents == 0 after reversal"
            - "Invoice.${inv_id}.billing_status == ISSUED after reversal (un-PAID)"
            - "client ar-summary ar_balance_cents == 50000 after reversal (A/R identity restored)"
