      - name: stale_expected_escape_version_after_a_revised_apportionment_is_a_412_that_outranks_the_state_check
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - concurrency_rules[recovery-claim-stale-escape]
          - errors[ERR_STALE_ESCAPE_VERSION]
          - errors[ERR_ESCAPE_STATE_INVALID]
          - validations[priority=22]
          - validations[priority=34]
          - endpoints[POST /error-escapes/{id}/recovery-claim]
          - endpoints[GET /error-escapes/{id}]
          - endpoints[GET /error-escapes]
          - entities.ErrorEscape.fields.provisional_recovery_cents
          - entities.ErrorEscape.fields.printer_share_pct
          - calculations.cost_recovery_amount.variants.PROVISIONAL
          - state_machines.ErrorEscape.DISPUTED_to_ROOT_CAUSE_ASSIGNED
        distinguishing_aspect: |
          The second §1.2.1 concurrency rule, and the only place ERR_STALE_ESCAPE_VERSION
          is reachable. What makes it more than a version-equality check: the escape's
          version advanced through a CLAIM, a DISPUTE and a REVISED root-cause, so the
          stale value ${escape_v_a} is three writes behind and replaying it would bill
          the printer 207000 on an apportionment (PRINTER / 1.00) that has since been
          withdrawn in favour of SHARED / 0.40, whose correct provisional is 82800.
          The last call is the priority trap: replaying ${escape_v_c} once the claim has
          been raised is BOTH stale (priority 22) and state-invalid (priority 34, the
          escape is RECOVERY_CLAIMED), and the declared ladder makes it a 412, not a 409.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "A US CARTON asset (standard_unit_cost_cents 42) whose v1 was approved and then superseded by an approved v2, so v1 is OBSOLETE_PENDING."
            - "Printer Cascade Print Co created CERTIFIED with recovery_liability_cap_cents 5000000, far above every figure here, so no clamp can fire."
            - "An escape over 3000 units caught at PACKING - an EARLY stage, investigation fee 60000."
            - "The escape has already run OPEN -> ROOT_CAUSE_ASSIGNED (PRINTER / 1.00, version captured as escape_v_a) -> RECOVERY_CLAIMED (provisional 3000*42 == 126000 + 3000*7 == 21000 + 0 + 60000 == 207000) -> DISPUTED -> ROOT_CAUSE_ASSIGNED again (SHARED / 0.40, which cleared provisional_recovery_cents back to null)."
            - "escape_v_a is therefore three versions behind escape_v_b."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
