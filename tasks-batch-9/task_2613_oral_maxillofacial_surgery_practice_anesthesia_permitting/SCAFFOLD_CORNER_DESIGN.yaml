            - call: "POST /surgical-cases/${case_id}/confirm"
              payload: { expected_block_version: "${blk_v0}" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /block-times/${blk_id}"
              as: SchedulingCoordinator
              captures: { blk_v1: $.data.version }
            - call: "POST /surgical-cases/${case_id}/confirm"
              payload: { expected_block_version: "${blk_v1}" }
              as: SchedulingCoordinator
          assert:
            - "trigger[0]: HTTP 412 with data.error_id == ERR_STALE_BLOCK_VERSION; ${blk_v0} is the version from block creation and the hold already advanced it"
            - "after trigger[0]: BlockTime.${blk_id}.committed_minutes == 60, open_minutes == 180, utilization_pct == 25.00, version == ${blk_v1} (unchanged by the refusal)"
            - "trigger[2]: HTTP 200 with scheduling_status == CONFIRMED; the block version advances once more while committed_minutes stays 60"

      - name: stale_lot_version_blocks_a_second_reservation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
        distinguishing_aspect: "The first accepted reservation invalidates the availability snapshot the caller is still holding, so the second reservation quoting the same version is refused even though three units remain - stock is not the reason for the failure."
        test_recipe:
          setup:
            - "a non-consignment lot with 5 units and one DRAFT case"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
