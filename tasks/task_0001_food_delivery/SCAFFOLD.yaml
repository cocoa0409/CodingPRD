scenario: "Food delivery platforms are complex systems comprised of all elements, including restaurants, delivery riders, customers, platform customer service, food listing, order placement, rider dispatch, delivery order assignment, route merging, late delivery warnings, delivery fee calculation, fine deductions, returns, work orders, rider bonus tiers, and platform commission tiers. Introducing complex but real-world-adaptable computational rules"
domain_name: food-delivery-platform
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================
# §1.1 Entity-Relationship Table
# ============================================================
entities:
  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Restaurant display name
        constraints: "non-empty; max 120 chars; unique per active restaurant"
      - name: address
        type: string
        source: input
        description: Street address used to compute delivery distance
      - name: lat
        type: number
        source: input
        description: Latitude for distance calc; degrees
      - name: lng
        type: number
        source: input
        description: Longitude for distance calc; degrees
      - name: status
        type: enum
        source: system
        description: Lifecycle status
        constraints: "values: {PENDING_APPROVAL, ACTIVE, SUSPENDED, CLOSED}; initial=PENDING_APPROVAL"
        default: PENDING_APPROVAL
      - name: commission_rate_override
        type: number
        source: input
        description: Optional flat commission rate overriding tiered default; null means use tiered
        default: null
        constraints: "if set: 0.05 <= value <= 0.35"
      - name: pending_settlement_cents
        type: integer
        source: computed
        description: Unsettled earnings owed to restaurant; incremented by order delivery, decremented by platform settlement
        default: 0

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Rider's name
      - name: phone
        type: string
        source: input
        description: Contact phone
        constraints: "unique across all riders"
      - name: status
        type: enum
        source: system
        description: Availability state
        constraints: "values: {OFFLINE, AVAILABLE, ON_DELIVERY, SUSPENDED}; initial=OFFLINE"
        default: OFFLINE
      - name: on_time_rate
        type: number
        source: computed
        description: Fraction of last 30 completed deliveries that arrived on time; starts at 1.0 for new riders with fewer than 10 completions
        default: 1.0
        constraints: "0.0 <= value <= 1.0"
      - name: acceptance_rate
        type: number
        source: computed
        description: Fraction of last 30 dispatch offers the rider accepted
        default: 1.0
        constraints: "0.0 <= value <= 1.0"
      - name: rating
        type: number
        source: computed
        description: Average customer rating across last 30 completed deliveries on 0-5 scale
        default: 5.0
        constraints: "0.0 <= value <= 5.0"
      - name: bonus_tier
        type: enum
        source: computed
        description: Derived tier from composite score; recomputed on every completed delivery
        constraints: "values: {BRONZE, SILVER, GOLD, PLATINUM}"
        default: BRONZE
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: Rider's net earnings ledger (positive=earned, can go negative via fines)
        default: 0

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Customer name
      - name: phone
        type: string
        source: input
        description: Contact phone
        constraints: "unique"
      - name: address
        type: string
        source: input
        description: Delivery address
      - name: lat
        type: number
        source: input
        description: Latitude
      - name: lng
        type: number
        source: input
        description: Longitude
      - name: credit_balance_cents
        type: integer
        source: computed
        description: Platform credit from refunds/compensation; debited by subsequent orders before card charge
        default: 0
      - name: trust_score
        type: number
        source: computed
        description: Aggregated behavioral score 0.0-1.0; decreases on abusive returns, increases on good-faith ratings
        default: 1.0
        constraints: "0.0 <= value <= 1.0"

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: restaurant_id
        type: string
        source: input
        description: Owning Restaurant.id
      - name: name
        type: string
        source: input
        description: Dish name
      - name: price_cents
        type: integer
        source: input
        description: List price in cents
        constraints: "1 <= value <= 1000000"
      - name: is_listed
        type: boolean
        source: input
        description: Whether currently shown to customers
        default: true

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: Ordering Customer.id
      - name: restaurant_id
        type: string
        source: input
        description: Fulfilling Restaurant.id
      - name: status
        type: enum
        source: system
        description: Order lifecycle state
        constraints: "values: {PLACED, RESTAURANT_ACCEPTED, PREPARING, READY_FOR_PICKUP, PICKED_UP, DELIVERED, CANCELLED, REFUND_REQUESTED, REFUNDED}; initial=PLACED"
        default: PLACED
      - name: items
        type: array
        source: input
        description: Snapshot array of {menu_item_id, name, unit_price_cents, quantity}; immutable after creation
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of unit_price_cents*quantity across items; computed at placement
      - name: distance_km
        type: number
        source: computed
        description: Haversine distance Restaurant->Customer in km, rounded to 1 decimal
      - name: is_peak
        type: boolean
        source: computed
        description: Whether placement time falls in peak window (11:00-13:00 or 18:00-20:00 UTC); snapshot at placement
      - name: provisional_delivery_fee_cents
        type: integer
        source: computed
        description: Quoted at placement time; used for customer charge preview
      - name: final_delivery_fee_cents
        type: integer
        source: computed
        description: Reconciled at DELIVERED transition; may differ from provisional if route merging applies
        default: null
      - name: provisional_commission_cents
        type: integer
        source: computed
        description: Platform commission quoted at order placement using tiered rate snapshot
      - name: final_commission_cents
        type: integer
        source: computed
        description: Reconciled at DELIVERED; uses restaurant.commission_rate_override if set when delivered, else tiered
        default: null
      - name: promised_delivery_time
        type: datetime
        source: computed
        description: Placement time + 45 minutes; used for late-fine evaluation
      - name: actual_delivery_time
        type: datetime
        source: system
        description: Set at DELIVERED transition
        default: null
      - name: minutes_late
        type: integer
        source: computed
        description: floor((actual_delivery_time - promised_delivery_time) / 60); 0 if on-time or early
        default: null
      - name: payment_status
        type: enum
        source: system
        description: Parallel dimension tracking money flow independently of fulfillment status
        constraints: "values: {UNPAID, AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED, FULLY_REFUNDED, VOIDED}; initial=UNPAID"
        default: UNPAID
      - name: version
        type: integer
        source: system
        description: OCC version
        default: 1

  - name: Assignment
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: Order.id being delivered
        constraints: "unique among Assignment rows with status != CANCELLED (at most one active per order)"
      - name: rider_id
        type: string
        source: input
        description: Assigned Rider.id
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle
        constraints: "values: {OFFERED, ACCEPTED, PICKED_UP, DELIVERED, REJECTED, CANCELLED}; initial=OFFERED"
        default: OFFERED
      - name: offered_at
        type: datetime
        source: system
        description: When the platform dispatched to this rider
      - name: accepted_at
        type: datetime
        source: system
        description: Set on ACCEPTED transition
        default: null
      - name: picked_up_at
        type: datetime
        source: system
        description: Set on PICKED_UP transition
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: Set on DELIVERED transition
        default: null
      - name: route_group_id
        type: string
        source: system
        description: FK to RouteGroup.id if merged into a shared trip; null for solo deliveries
        default: null
      - name: final_delivery_fee_cents
        type: integer
        source: computed
        description: The rider-facing earnings portion of the delivery fee; reconciled on DELIVERED
        default: null

  - name: RouteGroup
    parent: null
    common_fields: false
    fields:
      - name: rider_id
        type: string
        source: input
        description: The rider carrying the merged route
      - name: assignment_ids
        type: array
        source: system
        description: Ordered list of Assignment.id merged into this route
      - name: merged_at
        type: datetime
        source: system
        description: When merge occurred
      - name: status
        type: enum
        source: system
        description: Aggregate route state
        constraints: "values: {ACTIVE, COMPLETED, ABANDONED}; initial=ACTIVE"
        default: ACTIVE

  - name: Fine
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: input
        description: Which entity the fine applies to
        constraints: "values: {RIDER, RESTAURANT, CUSTOMER}"
      - name: subject_id
        type: string
        source: input
        description: FK into the Rider/Restaurant/Customer table (polymorphic)
      - name: order_id
        type: string
        source: input
        description: Related Order.id
      - name: reason
        type: enum
        source: input
        description: Fine category
        constraints: "values: {LATE_DELIVERY, ABUSIVE_RETURN, RESTAURANT_STOCKOUT, RIDER_NO_SHOW}"
      - name: amount_cents
        type: integer
        source: computed
        description: Fine amount in cents; computed per category rules
        constraints: "amount_cents >= 0"
      - name: settlement_status
        type: enum
        source: system
        description: Whether deducted from subject's wallet/settlement
        constraints: "values: {PENDING, SETTLED, WAIVED}; initial=PENDING"
        default: PENDING

  - name: Return
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: Order.id being returned; order must be in DELIVERED
      - name: reason
        type: enum
        source: input
        description: Why the customer wants to return
        constraints: "values: {QUALITY_ISSUE, WRONG_ITEM, LATE, OTHER}"
      - name: requested_refund_cents
        type: integer
        source: input
        description: Customer-requested refund amount in cents
        constraints: "1 <= value <= order.subtotal_cents"
      - name: status
        type: enum
        source: system
        description: Return review state
        constraints: "values: {REQUESTED, APPROVED, REJECTED, ESCALATED}; initial=REQUESTED"
        default: REQUESTED
      - name: approved_refund_cents
        type: integer
        source: system
        description: Final refund amount after review
        default: null
      - name: reviewer_cs_user_id
        type: string
        source: input
        description: Opaque CS operator id who decided

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: opened_by_role
        type: enum
        source: input
        description: Which role opened the ticket
        constraints: "values: {CUSTOMER, RIDER, RESTAURANT, CUSTOMER_SERVICE}"
      - name: opened_by_id
        type: string
        source: input
        description: Id of the opener (Customer.id, Rider.id, Restaurant.id, or opaque CS id)
      - name: related_order_id
        type: string
        source: input
        description: Order.id this ticket references
        default: null
      - name: related_return_id
        type: string
        source: input
        description: Return.id this ticket references
        default: null
      - name: category
        type: enum
        source: input
        description: Problem category
        constraints: "values: {DELIVERY_LATE, FOOD_QUALITY, MISSING_ITEM, RIDER_BEHAVIOR, RESTAURANT_BEHAVIOR, PAYMENT_ISSUE, OTHER}"
      - name: status
        type: enum
        source: system
        description: Ticket lifecycle with revision cycle
        constraints: "values: {OPEN, UNDER_REVIEW, AWAITING_INFO, RESOLVED, ESCALATED, CLOSED}; initial=OPEN"
        default: OPEN
      - name: assigned_cs_user_id
        type: string
        source: system
        description: Opaque CS operator id assigned to handle
        default: null
      - name: resolution_notes
        type: string
        source: input
        description: Notes set at resolution
        default: null

# ============================================================
# §1.2 State Machine Table
# ============================================================
state_machines:
  - entity: Order
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED, REFUNDED]
    transitions:
      - from: PLACED
        to: RESTAURANT_ACCEPTED
        trigger: "POST /api/orders/{id}/accept"
        actor: Restaurant
        preconditions:
          - "Restaurant.id == Order.restaurant_id"
          - "Restaurant.status == ACTIVE"
          - "Order.status == PLACED"
        side_effects:
          - "set Order.updated_at"
          - "no change to payment_status (stays UNPAID; authorization happens on PLACED placement side-effect already)"
        note: "Restaurant confirms they will prepare the order"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel (by Customer or by Restaurant rejection)"
        actor: Customer
        preconditions:
          - "Order.status == PLACED"
        side_effects:
          - "Order.payment_status transitions UNPAID->VOIDED or AUTHORIZED->VOIDED"
          - "Customer.credit_balance_cents unchanged (no charge occurred)"
      - from: RESTAURANT_ACCEPTED
        to: PREPARING
        trigger: "POST /api/orders/{id}/start-preparing"
        actor: Restaurant
        preconditions:
          - "Order.status == RESTAURANT_ACCEPTED"
        side_effects:
          - "open a dispatch offer by POST /api/orders/{id}/dispatch (system); may merge into existing RouteGroup"
      - from: PREPARING
        to: READY_FOR_PICKUP
        trigger: "POST /api/orders/{id}/ready"
        actor: Restaurant
        preconditions:
          - "Order.status == PREPARING"
          - "there exists an Assignment A where A.order_id == Order.id AND A.status IN {ACCEPTED, PICKED_UP} (rider already accepted)"
        side_effects:
          - "notify assigned Rider"
      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /api/assignments/{id}/pickup (cascades)"
        actor: Rider
        preconditions:
          - "Order.status == READY_FOR_PICKUP"
          - "Assignment.status == ACCEPTED"
          - "Assignment.rider_id == acting Rider.id"
        side_effects:
          - "Assignment.status -> PICKED_UP (direct)"
          - "Assignment status change itself propagates: if Assignment.route_group_id is not null AND all peer assignments in route_group are PICKED_UP or later, RouteGroup remains ACTIVE"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /api/assignments/{id}/deliver (cascades to Order.DELIVERED)"
        actor: Rider
        preconditions:
          - "Order.status == PICKED_UP"
          - "Assignment.status == PICKED_UP"
        side_effects:
          - "Order.actual_delivery_time = now"
          - "recompute Order.final_delivery_fee_cents via calculation rule final_delivery_fee (route-merge-aware; see §1.3)"
          - "recompute Order.final_commission_cents via calculation rule final_commission (uses current restaurant.commission_rate_override if set)"
          - "Order.payment_status -> CAPTURED (unconditionally at delivery)"
          - "Order.minutes_late = max(0, floor((actual_delivery_time - promised_delivery_time)/60))"
          - "if Order.minutes_late > 0: create Fine(subject=RIDER, reason=LATE_DELIVERY, amount=late_delivery_fine calc) -> PENDING; that Fine creation itself triggers Rider.wallet_balance_cents -= amount and Rider.bonus_tier recompute (transitive: DELIVER -> Fine -> Rider wallet/tier)"
          - "Restaurant.pending_settlement_cents += (Order.subtotal_cents - Order.final_commission_cents)"
          - "Rider.wallet_balance_cents += Assignment.final_delivery_fee_cents"
          - "Rider.bonus_tier recompute"
      - from: DELIVERED
        to: REFUND_REQUESTED
        trigger: "POST /api/orders/{id}/returns (creates Return in REQUESTED)"
        actor: Customer
        preconditions:
          - "Order.status == DELIVERED"
          - "no existing Return with order_id == Order.id AND status IN {REQUESTED, APPROVED, ESCALATED}"
        side_effects:
          - "create Return row"
      - from: REFUND_REQUESTED
        to: REFUNDED
        trigger: "POST /api/returns/{id}/approve (cascades)"
        actor: CustomerService
        preconditions:
          - "Return.status == REQUESTED OR ESCALATED"
          - "Order.status == REFUND_REQUESTED"
        side_effects:
          - "Return.status -> APPROVED"
          - "Order.payment_status -> PARTIALLY_REFUNDED if approved_refund_cents < subtotal_cents, else FULLY_REFUNDED"
          - "Customer.credit_balance_cents += approved_refund_cents (transitive: RETURN_APPROVE -> Order refund -> Customer credit)"
          - "Restaurant.pending_settlement_cents -= approved_refund_cents"
          - "if Customer.trust_score < 0.5 AND reason == QUALITY_ISSUE: create Fine(subject=CUSTOMER, reason=ABUSIVE_RETURN, amount=approved_refund_cents) -> PENDING"
      - from: REFUND_REQUESTED
        to: DELIVERED
        trigger: "POST /api/returns/{id}/reject (revert loop)"
        actor: CustomerService
        preconditions:
          - "Return.status == REQUESTED OR ESCALATED"
        side_effects:
          - "Return.status -> REJECTED"
          - "Order.status reverts to DELIVERED (cycle)"
          - "no monetary change"

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DELIVERED, REJECTED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/assignments/{id}/accept"
        actor: Rider
        preconditions:
          - "Assignment.rider_id == acting Rider.id"
          - "Rider.status == AVAILABLE OR ON_DELIVERY (route merge allowed)"
          - "Order.status IN {RESTAURANT_ACCEPTED, PREPARING, READY_FOR_PICKUP}"
          - "no other Assignment exists with same order_id AND status IN {OFFERED, ACCEPTED, PICKED_UP}"
        side_effects:
          - "Rider.status -> ON_DELIVERY if was AVAILABLE"
          - "Rider.acceptance_rate recompute over last 30 offers"
          - "if Rider currently has an ACTIVE RouteGroup and this new Assignment's pickup is within 500m of an existing unpicked assignment's restaurant: attach to RouteGroup and set Assignment.route_group_id"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /api/assignments/{id}/reject OR 60s timeout via POST /api/_clock/advance"
        actor: Rider
        preconditions:
          - "Assignment.status == OFFERED"
        side_effects:
          - "Rider.acceptance_rate recompute"
          - "system creates a new Assignment offering the same Order.id to next best rider (see dispatch)"
      - from: ACCEPTED
        to: PICKED_UP
        trigger: "POST /api/assignments/{id}/pickup"
        actor: Rider
        preconditions:
          - "Assignment.status == ACCEPTED"
          - "Order.status == READY_FOR_PICKUP"
        side_effects:
          - "Assignment.picked_up_at = now"
          - "cascade: Order.status -> PICKED_UP"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /api/assignments/{id}/deliver"
        actor: Rider
        preconditions:
          - "Assignment.status == PICKED_UP"
          - "Order.status == PICKED_UP"
        side_effects:
          - "cascade: Order.status -> DELIVERED (see Order.PICKED_UP->DELIVERED chain for full effects)"
          - "if Assignment.route_group_id is not null AND all peer assignments DELIVERED: RouteGroup.status -> COMPLETED"
          - "Rider.status -> AVAILABLE only if no remaining ACTIVE assignments"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /api/assignments/{id}/cancel"
        actor: Rider
        preconditions:
          - "Assignment.status == ACCEPTED"
          - "Order.status != PICKED_UP"
        side_effects:
          - "create Fine(subject=RIDER, reason=RIDER_NO_SHOW, amount=500) -> PENDING; Fine creation transitively debits Rider.wallet_balance_cents and recomputes Rider.bonus_tier"
          - "system dispatches new Assignment for Order"

  - entity: Return
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW_PROXY
        trigger: "(not used — Return has no UNDER_REVIEW state; note placeholder)"
        actor: system
        preconditions: []
        side_effects: []
        note: "kept intentionally blank to document absence"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/returns/{id}/approve"
        actor: CustomerService
        preconditions:
          - "Return.status == REQUESTED OR ESCALATED"
          - "Order.status == REFUND_REQUESTED"
        side_effects:
          - "cascade to Order.REFUND_REQUESTED->REFUNDED (see Order machine)"
      - from: REQUESTED
        to: ESCALATED
        trigger: "POST /api/returns/{id}/escalate (revision loop — can return to REQUESTED via /reopen)"
        actor: CustomerService
        preconditions:
          - "Return.status == REQUESTED"
        side_effects:
          - "open WorkOrder(category=FOOD_QUALITY or similar, related_return_id=Return.id, status=OPEN)"
      - from: ESCALATED
        to: REQUESTED
        trigger: "POST /api/returns/{id}/reopen (cycle back)"
        actor: CustomerService
        preconditions:
          - "Return.status == ESCALATED"
        side_effects:
          - "WorkOrder.status -> CLOSED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/returns/{id}/reject"
        actor: CustomerService
        preconditions:
          - "Return.status == REQUESTED OR ESCALATED"
        side_effects:
          - "cascade to Order.REFUND_REQUESTED->DELIVERED (revert)"

  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /api/work-orders/{id}/assign"
        actor: CustomerService
        preconditions:
          - "WorkOrder.status == OPEN"
        side_effects:
          - "WorkOrder.assigned_cs_user_id = acting CS user id"
      - from: UNDER_REVIEW
        to: AWAITING_INFO
        trigger: "POST /api/work-orders/{id}/request-info"
        actor: CustomerService
        preconditions:
          - "WorkOrder.status == UNDER_REVIEW"
        side_effects: []
      - from: AWAITING_INFO
        to: UNDER_REVIEW
        trigger: "POST /api/work-orders/{id}/submit-info (cycle)"
        actor: Customer
        preconditions:
          - "WorkOrder.status == AWAITING_INFO"
          - "WorkOrder.opened_by_id == acting user's id (for CUSTOMER role)"
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /api/work-orders/{id}/resolve"
        actor: CustomerService
        preconditions:
          - "WorkOrder.status == UNDER_REVIEW"
          - "WorkOrder.assigned_cs_user_id != null"
          - "if WorkOrder.related_return_id is not null: corresponding Return.status IN {APPROVED, REJECTED}"
        side_effects: []
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /api/work-orders/{id}/escalate"
        actor: CustomerService
        preconditions:
          - "WorkOrder.status == UNDER_REVIEW"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /api/work-orders/{id}/resolve"
        actor: CustomerService
        preconditions:
          - "WorkOrder.status == ESCALATED"
        side_effects: []
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /api/work-orders/{id}/close"
        actor: CustomerService
        preconditions:
          - "WorkOrder.status == RESOLVED"
        side_effects: []

  - entity: Rider
    initial_state: OFFLINE
    terminal_states: [SUSPENDED]
    transitions:
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /api/riders/{id}/go-online"
        actor: Rider
        preconditions:
          - "Rider.status == OFFLINE"
        side_effects: []
      - from: AVAILABLE
        to: OFFLINE
        trigger: "POST /api/riders/{id}/go-offline"
        actor: Rider
        preconditions:
          - "Rider.status == AVAILABLE"
          - "no Assignment with rider_id == Rider.id AND status IN {OFFERED, ACCEPTED, PICKED_UP}"
        side_effects: []
      - from: AVAILABLE
        to: ON_DELIVERY
        trigger: "Assignment ACCEPTED cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_DELIVERY
        to: AVAILABLE
        trigger: "Assignment DELIVERED cascade when no remaining active assignments"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "POST /api/riders/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Rider.on_time_rate < 0.70 OR acceptance_rate < 0.50"
        side_effects: []

  - entity: Restaurant
    initial_state: PENDING_APPROVAL
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /api/restaurants/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Restaurant.status == PENDING_APPROVAL"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/restaurants/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Restaurant.status == ACTIVE"
        side_effects:
          - "reject all PLACED orders for this restaurant -> CANCELLED (fan-out, not counted as transitive cascade)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/restaurants/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Restaurant.status == SUSPENDED"
        side_effects: []

# ============================================================
# §1.2.1 Concurrency Rules
# ============================================================
concurrency_rules:
  - scenario: "Two riders accept the same OFFERED assignment set (same order_id dispatched to multiple riders) simultaneously"
    guarantee: "At most one Assignment per order reaches ACCEPTED/PICKED_UP/DELIVERED; the second accept is rejected"
    error_id: ERR_ORDER_ALREADY_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on (order_id, status IN {ACCEPTED, PICKED_UP, DELIVERED}) uniqueness"

  - scenario: "Restaurant accepts an order while customer cancels simultaneously"
    guarantee: "Exactly one transition succeeds; loser sees invalid-state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status; loser's precondition Order.status==PLACED fails"

  - scenario: "Two concurrent PATCH requests on Restaurant with the same version field"
    guarantee: "OCC rejects the stale write"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC on Restaurant.version"

  - scenario: "Two CS operators approve and reject the same Return simultaneously"
    guarantee: "Exactly one decision persists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Return.status"

  - scenario: "Customer creates second Return on same Order while first is in REQUESTED"
    guarantee: "Only one active Return per Order"
    error_id: ERR_DUPLICATE_RETURN
    http_status: 409
    serialization: "First-writer-wins on (order_id, status IN {REQUESTED, APPROVED, ESCALATED}) uniqueness"

# ============================================================
# §1.3 Calculation Rules Table
# ============================================================
calculations:
  - name: provisional_delivery_fee
    trigger: "on POST /api/orders (placement) — sets Order.provisional_delivery_fee_cents"
    algorithm: threshold
    formula: |
      base = 300  # cents
      distance_units = ceil(distance_km)           # whole-km bands; ceil(2.0)=2, ceil(2.01)=3
      distance_surcharge = distance_units * 120    # cents per band
      peak_surcharge = 200 if is_peak else 0       # cents
      fee_cents = base + distance_surcharge + peak_surcharge
      # NO route-merge discount at provisional time — the solo-rider estimate.
    input_set: "Order placement snapshot: distance_km (computed at placement), is_peak (computed at placement)"
    constants:
      BASE_CENTS: 300
      PER_KM_CENTS: 120
      PEAK_CENTS: 200
    precision: "integer cents (no rounding needed — all additions)"
    variants: []

  - name: final_delivery_fee
    trigger: "on Assignment DELIVERED transition — sets Order.final_delivery_fee_cents and Assignment.final_delivery_fee_cents"
    algorithm: threshold
    formula: |
      # Step 1: recompute solo-style fee from the SAME inputs snapshot as provisional
      base = 300
      distance_units = ceil(Order.distance_km)
      distance_surcharge = distance_units * 120
      peak_surcharge = 200 if Order.is_peak else 0
      solo_fee = base + distance_surcharge + peak_surcharge

      # Step 2: route-merge discount (this is what makes final differ from provisional)
      if Assignment.route_group_id is not null AND |route_group.assignment_ids| >= 2:
          merged_discount = floor(solo_fee * 0.25)   # 25% discount for merged legs, floor-round
          rider_fee = solo_fee - merged_discount
      else:
          rider_fee = solo_fee

      Order.final_delivery_fee_cents = rider_fee
      Assignment.final_delivery_fee_cents = rider_fee
    input_set: "Order.distance_km, Order.is_peak, Assignment.route_group_id, RouteGroup.assignment_ids count"
    constants:
      BASE_CENTS: 300
      PER_KM_CENTS: 120
      PEAK_CENTS: 200
      ROUTE_MERGE_DISCOUNT_RATE: 0.25
    precision: "integer cents; floor-round on discount"
    variants:
      - name: solo
        when: "Assignment has no route_group_id or route_group has only 1 assignment"
        difference: "no discount applied; rider_fee == solo_fee"
      - name: merged
        when: "Assignment.route_group_id set AND >=2 assignments in group"
        difference: "25% floor-rounded discount applied"

  - name: provisional_commission
    trigger: "on POST /api/orders (placement) — sets Order.provisional_commission_cents"
    algorithm: tiered_pricing
    formula: |
      # MARGINAL tier allocation — amount in each tier billed at that tier's rate.
      # Order of evaluation is fixed: tier1 first, remainder flows to tier2, then tier3.
      subtotal = Order.subtotal_cents
      tier1_cap = 20000  # cents (first $200)
      tier2_cap = 50000  # cents (total subtotal up to $500)
      tier1_rate = 0.15  # 15%
      tier2_rate = 0.18  # 18%
      tier3_rate = 0.22  # 22%
      tier1_amount = min(subtotal, tier1_cap)
      tier2_amount = max(0, min(subtotal, tier2_cap) - tier1_cap)
      tier3_amount = max(0, subtotal - tier2_cap)
      commission_cents = round_half_up(
          tier1_amount * tier1_rate +
          tier2_amount * tier2_rate +
          tier3_amount * tier3_rate
      )
      # Rounding policy: sum first (in float cents), THEN round to whole cents half-up.
      # Do NOT round each tier separately — the test generator pins this order.
    input_set: "Order.subtotal_cents at placement"
    constants:
      TIER1_CAP_CENTS: 20000
      TIER2_CAP_CENTS: 50000
      TIER1_RATE: 0.15
      TIER2_RATE: 0.18
      TIER3_RATE: 0.22
    precision: "integer cents, round_half_up after tier sum (not per-tier)"
    variants: []

  - name: final_commission
    trigger: "on Order.PICKED_UP->DELIVERED transition — sets Order.final_commission_cents"
    algorithm: tiered_pricing
    formula: |
      # Key divergence from provisional: if restaurant.commission_rate_override is non-null AT DELIVERY TIME,
      # apply a FLAT rate over subtotal. Otherwise fall back to the tiered formula above.
      # This produces a different number from provisional whenever the override was changed mid-order.
      subtotal = Order.subtotal_cents
      restaurant = Restaurant lookup by Order.restaurant_id
      if restaurant.commission_rate_override is not null:
          commission_cents = round_half_up(subtotal * restaurant.commission_rate_override)
      else:
          # tiered: same formula as provisional_commission
          tier1_amount = min(subtotal, 20000)
          tier2_amount = max(0, min(subtotal, 50000) - 20000)
          tier3_amount = max(0, subtotal - 50000)
          commission_cents = round_half_up(
              tier1_amount * 0.15 + tier2_amount * 0.18 + tier3_amount * 0.22
          )
    input_set: "Order.subtotal_cents (immutable), Restaurant.commission_rate_override (current value at delivery)"
    constants:
      TIER1_CAP_CENTS: 20000
      TIER2_CAP_CENTS: 50000
      TIER1_RATE: 0.15
      TIER2_RATE: 0.18
      TIER3_RATE: 0.22
    precision: "integer cents, round_half_up"
    variants:
      - name: tiered_default
        when: "Restaurant.commission_rate_override is null at delivery time"
        difference: "tiered calculation identical to provisional"
      - name: flat_override
        when: "Restaurant.commission_rate_override is set (e.g., 0.12) at delivery time"
        difference: "flat rate over entire subtotal; diverges from provisional when override changes mid-order"

  - name: late_delivery_fine
    trigger: "on Order.PICKED_UP->DELIVERED when Order.minutes_late > 0 — creates Fine"
    algorithm: threshold
    formula: |
      m = Order.minutes_late  # integer >= 1 at this trigger
      if m <= 10:
          fine_cents = 200     # flat $2.00
      elif m <= 30:
          fine_cents = 500 + 50 * (m - 10)
          # $5.00 base + $0.50/minute over 10m, so m=20 → 500+500 = 1000 cents
      else:  # m > 30
          fine_cents = min(Order.final_delivery_fee_cents, 1500) + 500
          # cap at final_delivery_fee (rider earnings clawback) PLUS $5.00 compensation
      # Customer side-effect handled in Order DELIVERED side_effects (credit_balance_cents)
    input_set: "Order.minutes_late, Order.final_delivery_fee_cents"
    constants:
      TIER1_MAX_MIN: 10
      TIER2_MAX_MIN: 30
      TIER1_FLAT_CENTS: 200
      TIER2_BASE_CENTS: 500
      TIER2_PER_MIN_CENTS: 50
      TIER3_COMPENSATION_CENTS: 500
      TIER3_FEE_CAP_CENTS: 1500
    precision: "integer cents"
    variants: []

  - name: rider_bonus_tier
    trigger: "on every Assignment.PICKED_UP->DELIVERED (recomputes Rider.bonus_tier) AND on every Fine creation with subject=RIDER"
    algorithm: weighted_scoring
    formula: |
      # Weighted composite score over last 30 completed deliveries.
      # Input set includes ONLY deliveries with Assignment.status == DELIVERED in the trailing window;
      # CANCELLED/REJECTED assignments are excluded from on_time_rate denominator but included in acceptance_rate's offer count.
      # Fines accrued in the same window are NOT used directly — they flow via on_time_rate (LATE_DELIVERY fines imply the delivery was late).
      score = round_half_up(
          0.6 * Rider.on_time_rate +
          0.3 * Rider.acceptance_rate +
          0.1 * (Rider.rating / 5.0),
          3  # 3 decimal places
      )
      if score >= 0.90: tier = PLATINUM
      elif score >= 0.80: tier = GOLD
      elif score >= 0.70: tier = SILVER
      else: tier = BRONZE
      # Boundary precision: >= is inclusive. score == 0.900 → PLATINUM (not GOLD).
    input_set: "Last 30 DELIVERED Assignment rows for Rider; offers count includes REJECTED+ACCEPTED; rating from Order ratings (not modeled as separate entity — provided by client at return-or-rate endpoint)"
    constants:
      W_ON_TIME: 0.6
      W_ACCEPTANCE: 0.3
      W_RATING: 0.1
      TIER_PLATINUM_MIN: 0.90
      TIER_GOLD_MIN: 0.80
      TIER_SILVER_MIN: 0.70
    precision: "score rounded to 3 decimal places, round_half_up; tier compared with >= inclusive"
    variants: []

  - name: restaurant_settlement_balance
    trigger: "on Order DELIVERED (credit), on Return APPROVED (debit), on POST /api/restaurants/{id}/settle (zero-out)"
    algorithm: aggregation
    formula: |
      # Running aggregate. NOT recomputed from scratch each time; incremental.
      # On Order DELIVERED: pending_settlement_cents += (subtotal_cents - final_commission_cents)
      # On Return APPROVED: pending_settlement_cents -= approved_refund_cents
      # On POST /restaurants/{id}/settle: pending_settlement_cents -> 0, emit a settlement event (not modeled as entity)
      # Aggregation source: Order rows with status == DELIVERED AND NOT FULLY_REFUNDED
      # Tie-break: n/a (commutative over fields), but ordering matters when ties in timestamps cause different intermediate visibility — NOT a concurrency hazard because all mutations are atomic per request.
    input_set: "Order rows with status == DELIVERED in [last_settlement_time, now); Return rows with status == APPROVED in same window"
    constants: {}
    precision: "integer cents"
    variants: []

# ============================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# ============================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in {Customer, Restaurant, Rider, PlatformAdmin, CustomerService}; X-User-ID header present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role has permission for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-parameter id resolves to a row (Restaurant, Rider, Customer, Order, Assignment, Return, WorkOrder), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params"

  - priority: 4
    category: existence
    check: "Every foreign-key id in request body resolves (customer_id, restaurant_id, menu_item_ids in Order.items, rider_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/orders, POST /api/assignments (dispatch), POST /api/work-orders"

  - priority: 5
    category: state
    check: "Entity-identity match: when X-User-Role == Customer, X-User-ID must equal Customer.id; Restaurant role must own the target resource (order.restaurant_id); Rider role must equal assignment.rider_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-scoped endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_referential
    check: "POST /api/orders: Restaurant.status == ACTIVE (cannot order from non-active restaurant) AND every MenuItem in items has is_listed == true AND MenuItem.restaurant_id == Order.restaurant_id"
    error_id: ERR_RESTAURANT_UNAVAILABLE
    http_status: 422
    applies_to: "POST /api/orders"

  - priority: 8
    category: business_safety
    check: "POST /api/riders/{id}/suspend: can only run when Rider.on_time_rate < 0.70 OR acceptance_rate < 0.50 (prevent punitive mis-use)"
    error_id: ERR_SUSPEND_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /api/riders/{id}/suspend"

  - priority: 9
    category: business_constraint
    check: "POST /api/assignments/{id}/accept: no other non-terminal Assignment exists for the same order_id"
    error_id: ERR_ORDER_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /api/assignments/{id}/accept"

  - priority: 10
    category: business_temporal
    check: "POST /api/returns: created within 24 hours of Order.actual_delivery_time"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/orders/{id}/returns"

  - priority: 11
    category: business_constraint
    check: "POST /api/orders/{id}/returns: no existing Return for this order with status IN {REQUESTED, APPROVED, ESCALATED}"
    error_id: ERR_DUPLICATE_RETURN
    http_status: 409
    applies_to: "POST /api/orders/{id}/returns"

  - priority: 12
    category: business_fiscal
    check: "POST /api/returns: requested_refund_cents <= Order.subtotal_cents AND requested_refund_cents >= 1"
    error_id: ERR_REFUND_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /api/orders/{id}/returns"

  - priority: 13
    category: business_fiscal
    check: "POST /api/returns/{id}/approve: approved_refund_cents <= Order.subtotal_cents AND <= requested_refund_cents AND >= 1"
    error_id: ERR_REFUND_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /api/returns/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "Order.items must be non-empty; each item quantity >= 1; subtotal_cents >= 100 (minimum order)"
    error_id: ERR_ORDER_INVALID
    http_status: 422
    applies_to: "POST /api/orders"

  - priority: 15
    category: business_constraint
    check: "OCC: if `version` supplied in body, must match current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 16
    category: business_referential
    check: "POST /api/work-orders/{id}/resolve: if related_return_id is set, corresponding Return.status must be in {APPROVED, REJECTED} (cross-entity gating)"
    error_id: ERR_RELATED_RETURN_UNRESOLVED
    http_status: 422
    applies_to: "POST /api/work-orders/{id}/resolve"

# ============================================================
# §1.5 API Endpoint Table
# ============================================================
endpoints:
  # --- Restaurants ---
  - method: POST
    path: "/api/restaurants"
    description: "Register a new restaurant (PENDING_APPROVAL)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, address, lat, lng, "commission_rate_override?"]
    output: Restaurant
    side_effects: []

  - method: GET
    path: "/api/restaurants"
    description: "List restaurants with filter/pagination"
    roles: [PlatformAdmin, Customer, Restaurant, Rider, CustomerService]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Restaurant[]"
    side_effects: []

  - method: GET
    path: "/api/restaurants/{id}"
    description: "Read a restaurant"
    roles: [PlatformAdmin, Customer, Restaurant, Rider, CustomerService]
    code: 200
    input: []
    output: Restaurant
    side_effects: []

  - method: PATCH
    path: "/api/restaurants/{id}"
    description: "Update mutable restaurant fields (address, lat, lng, commission_rate_override)"
    roles: [PlatformAdmin, Restaurant]
    code: 200
    input: ["address?", "lat?", "lng?", "commission_rate_override?", "version?"]
    output: Restaurant
    side_effects: []

  - method: POST
    path: "/api/restaurants/{id}/approve"
    description: "Approve a PENDING_APPROVAL restaurant to ACTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Restaurant
    side_effects: ["Restaurant.status PENDING_APPROVAL -> ACTIVE"]

  - method: POST
    path: "/api/restaurants/{id}/suspend"
    description: "Suspend an active restaurant; fans out cancel to its PLACED orders"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Restaurant
    side_effects: ["cancel all PLACED orders for restaurant"]

  - method: POST
    path: "/api/restaurants/{id}/reinstate"
    description: "Restore suspended restaurant to ACTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Restaurant
    side_effects: []

  - method: POST
    path: "/api/restaurants/{id}/settle"
    description: "Zero-out pending_settlement_cents (platform payout event)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Restaurant
    side_effects: ["Restaurant.pending_settlement_cents -> 0"]

  # --- Menu ---
  - method: POST
    path: "/api/restaurants/{id}/menu-items"
    description: "Create menu item"
    roles: [Restaurant, PlatformAdmin]
    code: 201
    input: [name, price_cents, "is_listed?"]
    output: MenuItem
    side_effects: []

  - method: PATCH
    path: "/api/menu-items/{id}"
    description: "Update menu item price/listing"
    roles: [Restaurant, PlatformAdmin]
    code: 200
    input: ["price_cents?", "is_listed?", "version?"]
    output: MenuItem
    side_effects: []

  - method: GET
    path: "/api/restaurants/{id}/menu-items"
    description: "List menu items, optional is_listed filter"
    roles: [PlatformAdmin, Customer, Restaurant, Rider, CustomerService]
    code: 200
    input: ["is_listed?", "limit?", "offset?"]
    output: "MenuItem[]"
    side_effects: []

  # --- Riders ---
  - method: POST
    path: "/api/riders"
    description: "Register rider"
    roles: [PlatformAdmin]
    code: 201
    input: [name, phone]
    output: Rider
    side_effects: []

  - method: GET
    path: "/api/riders/{id}"
    description: "Read rider"
    roles: [PlatformAdmin, Rider, CustomerService]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: POST
    path: "/api/riders/{id}/go-online"
    description: "Transition OFFLINE -> AVAILABLE"
    roles: [Rider]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: POST
    path: "/api/riders/{id}/go-offline"
    description: "Transition AVAILABLE -> OFFLINE"
    roles: [Rider]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: POST
    path: "/api/riders/{id}/suspend"
    description: "Suspend rider if performance thresholds breached"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Rider
    side_effects: []

  # --- Customers ---
  - method: POST
    path: "/api/customers"
    description: "Register customer"
    roles: [PlatformAdmin, CustomerService]
    code: 201
    input: [name, phone, address, lat, lng]
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/customers/{id}"
    description: "Read customer"
    roles: [PlatformAdmin, Customer, CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Orders ---
  - method: POST
    path: "/api/orders"
    description: "Place an order"
    roles: [Customer]
    code: 201
    input: [customer_id, restaurant_id, items]
    output: Order
    side_effects:
      - "compute subtotal_cents, distance_km, is_peak, provisional_delivery_fee, provisional_commission, promised_delivery_time"
      - "payment authorization (payment_status UNPAID->AUTHORIZED, debiting credit_balance first if any)"

  - method: GET
    path: "/api/orders/{id}"
    description: "Read order"
    roles: [PlatformAdmin, Customer, Restaurant, Rider, CustomerService]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/api/orders"
    description: "List orders filtered by customer_id, restaurant_id, rider_id, status; paginated"
    roles: [PlatformAdmin, Customer, Restaurant, Rider, CustomerService]
    code: 200
    input: ["customer_id?", "restaurant_id?", "rider_id?", "status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/api/orders/{id}/accept"
    description: "Restaurant accepts PLACED order"
    roles: [Restaurant]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.status PLACED -> RESTAURANT_ACCEPTED"]

  - method: POST
    path: "/api/orders/{id}/cancel"
    description: "Cancel a PLACED order (by customer or by restaurant reject)"
    roles: [Customer, Restaurant, CustomerService]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.status PLACED -> CANCELLED; Order.payment_status -> VOIDED"]

  - method: POST
    path: "/api/orders/{id}/start-preparing"
    description: "Restaurant begins prep; system also opens dispatch"
    roles: [Restaurant]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.status RESTAURANT_ACCEPTED -> PREPARING; system creates initial Assignment offer"]

  - method: POST
    path: "/api/orders/{id}/ready"
    description: "Restaurant marks ready for pickup"
    roles: [Restaurant]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.status PREPARING -> READY_FOR_PICKUP"]

  - method: POST
    path: "/api/orders/{id}/dispatch"
    description: "Trigger or re-trigger dispatch to next best rider (system/admin force)"
    roles: [PlatformAdmin, CustomerService]
    code: 201
    input: []
    output: Assignment
    side_effects: ["create new Assignment in OFFERED for best-ranked AVAILABLE rider"]

  - method: POST
    path: "/api/orders/{id}/returns"
    description: "Customer opens a return for a DELIVERED order"
    roles: [Customer]
    code: 201
    input: [reason, requested_refund_cents]
    output: Return
    side_effects: ["Order.status DELIVERED -> REFUND_REQUESTED; create Return in REQUESTED"]

  # --- Assignments ---
  - method: GET
    path: "/api/assignments/{id}"
    description: "Read assignment"
    roles: [PlatformAdmin, Rider, CustomerService]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/api/assignments/{id}/accept"
    description: "Rider accepts offer"
    roles: [Rider]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.status OFFERED -> ACCEPTED; Rider.status AVAILABLE -> ON_DELIVERY; optional RouteGroup merge"]

  - method: POST
    path: "/api/assignments/{id}/reject"
    description: "Rider rejects offer; system redispatches"
    roles: [Rider]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.status OFFERED -> REJECTED; spawn new Assignment offer"]

  - method: POST
    path: "/api/assignments/{id}/pickup"
    description: "Rider picks up from restaurant; cascades Order -> PICKED_UP"
    roles: [Rider]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.status ACCEPTED -> PICKED_UP; Order PICKED_UP"]

  - method: POST
    path: "/api/assignments/{id}/deliver"
    description: "Rider delivers; cascades Order -> DELIVERED and all fiscal side effects"
    roles: [Rider]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment.status PICKED_UP -> DELIVERED"
      - "Order.status PICKED_UP -> DELIVERED (full cascade per Order machine side_effects including Fine creation, wallet updates, bonus_tier recompute)"

  - method: POST
    path: "/api/assignments/{id}/cancel"
    description: "Rider abandons after acceptance; incurs RIDER_NO_SHOW fine"
    roles: [Rider]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.status ACCEPTED -> CANCELLED; create Fine; redispatch"]

  # --- Returns ---
  - method: GET
    path: "/api/returns/{id}"
    description: "Read return"
    roles: [PlatformAdmin, Customer, Restaurant, CustomerService]
    code: 200
    input: []
    output: Return
    side_effects: []

  - method: POST
    path: "/api/returns/{id}/approve"
    description: "CS approves return"
    roles: [CustomerService]
    code: 200
    input: [approved_refund_cents]
    output: Return
    side_effects: ["Return.status -> APPROVED; Order.status REFUND_REQUESTED -> REFUNDED; Customer.credit_balance_cents += approved_refund_cents"]

  - method: POST
    path: "/api/returns/{id}/reject"
    description: "CS rejects return"
    roles: [CustomerService]
    code: 200
    input: []
    output: Return
    side_effects: ["Return.status -> REJECTED; Order.status REFUND_REQUESTED -> DELIVERED (revert)"]

  - method: POST
    path: "/api/returns/{id}/escalate"
    description: "CS escalates to supervisor work-order"
    roles: [CustomerService]
    code: 200
    input: []
    output: Return
    side_effects: ["Return.status -> ESCALATED; create WorkOrder linked to this return"]

  - method: POST
    path: "/api/returns/{id}/reopen"
    description: "Bring escalated return back to REQUESTED"
    roles: [CustomerService]
    code: 200
    input: []
    output: Return
    side_effects: ["Return.status ESCALATED -> REQUESTED; close linked WorkOrder"]

  # --- Fines ---
  - method: GET
    path: "/api/fines/{id}"
    description: "Read a fine"
    roles: [PlatformAdmin, CustomerService, Rider, Restaurant, Customer]
    code: 200
    input: []
    output: Fine
    side_effects: []

  - method: GET
    path: "/api/fines"
    description: "List fines filtered by subject_type, subject_id, settlement_status"
    roles: [PlatformAdmin, CustomerService, Rider, Restaurant, Customer]
    code: 200
    input: ["subject_type?", "subject_id?", "settlement_status?", "limit?", "offset?"]
    output: "Fine[]"
    side_effects: []

  - method: POST
    path: "/api/fines/{id}/waive"
    description: "CS waives a pending fine"
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: Fine
    side_effects: ["Fine.settlement_status PENDING -> WAIVED; reverse any wallet/credit debit"]

  # --- Work Orders ---
  - method: POST
    path: "/api/work-orders"
    description: "Open a work order"
    roles: [Customer, Rider, Restaurant, CustomerService, PlatformAdmin]
    code: 201
    input: [opened_by_role, opened_by_id, category, "related_order_id?", "related_return_id?"]
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/api/work-orders/{id}"
    description: "Read work order"
    roles: [PlatformAdmin, CustomerService, Customer, Rider, Restaurant]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/api/work-orders/{id}/assign"
    description: "CS claims a work order"
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status OPEN -> UNDER_REVIEW; assigned_cs_user_id = caller"]

  - method: POST
    path: "/api/work-orders/{id}/request-info"
    description: "CS asks opener for info"
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status UNDER_REVIEW -> AWAITING_INFO"]

  - method: POST
    path: "/api/work-orders/{id}/submit-info"
    description: "Opener replies with info"
    roles: [Customer, Rider, Restaurant]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status AWAITING_INFO -> UNDER_REVIEW"]

  - method: POST
    path: "/api/work-orders/{id}/resolve"
    description: "CS resolves"
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: [resolution_notes]
    output: WorkOrder
    side_effects: ["WorkOrder.status -> RESOLVED (gated on related_return_id terminal)"]

  - method: POST
    path: "/api/work-orders/{id}/escalate"
    description: "CS escalates work order"
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status UNDER_REVIEW -> ESCALATED"]

  - method: POST
    path: "/api/work-orders/{id}/close"
    description: "CS closes resolved work order"
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder.status RESOLVED -> CLOSED"]

  # --- Clock and sweeps (testability) ---
  - method: POST
    path: "/api/_clock/advance"
    description: "Advance virtual wall-clock by N seconds (testability); drives 60s offer-timeout and return-window logic"
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: null
    side_effects: ["any OFFERED assignment whose offered_at + 60s <= now is auto-transitioned to REJECTED (with redispatch)"]

# ============================================================
# §1.6 Error Code Catalog
# ============================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint, or identity does not match resource owner"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced id does not exist (path param or body FK)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is allowed"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH"
  - id: ERR_ORDER_ALREADY_ASSIGNED
    http: 409
    condition: "Another Assignment for the same order_id is already in ACCEPTED/PICKED_UP/DELIVERED"
  - id: ERR_DUPLICATE_RETURN
    http: 409
    condition: "A Return for the same order_id is already active (REQUESTED/APPROVED/ESCALATED)"
  - id: ERR_RESTAURANT_UNAVAILABLE
    http: 422
    condition: "POST /api/orders: restaurant not ACTIVE, or a MenuItem is unlisted, or item/restaurant cross-reference mismatch"
  - id: ERR_SUSPEND_CRITERIA_NOT_MET
    http: 422
    condition: "Suspend attempted on a rider whose on_time_rate and acceptance_rate are within thresholds"
  - id: ERR_RETURN_WINDOW_EXPIRED
    http: 422
    condition: "Return requested more than 24h after actual_delivery_time"
  - id: ERR_REFUND_AMOUNT_INVALID
    http: 422
    condition: "Requested or approved refund amount out of range"
  - id: ERR_ORDER_INVALID
    http: 422
    condition: "Order items empty, quantity < 1, or subtotal below minimum"
  - id: ERR_RELATED_RETURN_UNRESOLVED
    http: 422
    condition: "WorkOrder resolve attempted while linked Return still in non-terminal state"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic input validation failure (type/format)"

# ============================================================
# §1.7 RBAC Matrix
# ============================================================
roles:
  - name: Customer
    description: "End user who places orders and can open returns/work-orders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/orders"
      - "POST /api/orders/{id}/cancel (as customer initiator while order in PLACED)"
      - "POST /api/orders/{id}/returns"
      - "POST /api/work-orders/{id}/submit-info (when opener was this Customer)"
    shared_operations:
      - "GET /api/restaurants, /api/restaurants/{id}"
      - "GET /api/restaurants/{id}/menu-items"
      - "GET /api/orders, /api/orders/{id}"
      - "GET /api/customers/{id} (must equal X-User-ID)"
      - "POST /api/work-orders"
      - "GET /api/work-orders/{id}"
      - "GET /api/fines, /api/fines/{id} (filtered to subject_id == X-User-ID)"

  - name: Restaurant
    description: "Food vendor that accepts orders and maintains menu"
    identity: "entity_backed:Restaurant"
    exclusive_operations:
      - "POST /api/restaurants/{id}/menu-items (must match X-User-ID)"
      - "PATCH /api/menu-items/{id} (must own)"
      - "POST /api/orders/{id}/accept (must match order.restaurant_id)"
      - "POST /api/orders/{id}/start-preparing"
      - "POST /api/orders/{id}/ready"
    shared_operations:
      - "PATCH /api/restaurants/{id} (must equal X-User-ID)"
      - "POST /api/orders/{id}/cancel (as restaurant reject while PLACED)"
      - "GET /api/orders, /api/orders/{id} (filter to restaurant_id)"
      - "POST /api/work-orders"
      - "POST /api/work-orders/{id}/submit-info"

  - name: Rider
    description: "Delivery courier"
    identity: "entity_backed:Rider"
    exclusive_operations:
      - "POST /api/riders/{id}/go-online (must equal X-User-ID)"
      - "POST /api/riders/{id}/go-offline"
      - "POST /api/assignments/{id}/accept (must match assignment.rider_id)"
      - "POST /api/assignments/{id}/reject"
      - "POST /api/assignments/{id}/pickup"
      - "POST /api/assignments/{id}/deliver"
      - "POST /api/assignments/{id}/cancel"
    shared_operations:
      - "GET /api/riders/{id} (must equal X-User-ID)"
      - "GET /api/orders (rider_id filter == X-User-ID)"
      - "GET /api/assignments/{id}"
      - "POST /api/work-orders"
      - "POST /api/work-orders/{id}/submit-info"

  - name: CustomerService
    description: "Platform customer service operator"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/returns/{id}/approve"
      - "POST /api/returns/{id}/reject"
      - "POST /api/returns/{id}/escalate"
      - "POST /api/returns/{id}/reopen"
      - "POST /api/fines/{id}/waive"
      - "POST /api/work-orders/{id}/assign"
      - "POST /api/work-orders/{id}/request-info"
      - "POST /api/work-orders/{id}/resolve"
      - "POST /api/work-orders/{id}/escalate"
      - "POST /api/work-orders/{id}/close"
    shared_operations:
      - "GET /api/orders, /api/returns/{id}, /api/work-orders/{id}, /api/fines"
      - "POST /api/customers (on behalf of customer)"
      - "POST /api/orders/{id}/cancel (on behalf of customer)"
      - "POST /api/orders/{id}/dispatch"

  - name: PlatformAdmin
    description: "Platform operator with superset of operational powers"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/restaurants"
      - "POST /api/restaurants/{id}/approve"
      - "POST /api/restaurants/{id}/suspend"
      - "POST /api/restaurants/{id}/reinstate"
      - "POST /api/restaurants/{id}/settle"
      - "POST /api/riders"
      - "POST /api/riders/{id}/suspend"
      - "POST /api/_clock/advance"
    shared_operations:
      - "All GET endpoints unrestricted"
      - "POST /api/customers"
      - "POST /api/orders/{id}/dispatch"
      - "POST /api/fines/{id}/waive"
      - "all work-order operational endpoints"
