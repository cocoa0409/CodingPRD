              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac}", department_id: "${dept}", window_start_date: "2026-09-01T00:00:00Z", window_end_date: "2026-09-07T23:59:59Z" }
              as: DepartmentManager
              as_user_id: "mgr_cath"
