          difficulty_instance: route_density_planned_vs_realized_diverge_on_same_schedule_set
          rationale: "That §1.8 instance reads density_planned_pct and density_realized_pct off the same route after each mutation and checks both against the hand-computed floor, which is exactly the computed-read claim for the only pair of computed read fields that has a client-supplied lookalike."

      - name: manifest_accept_is_allowed_only_from_the_sealed_state
        claim_type: conditional_action
        grounds:
          - endpoints["POST /waste-manifests/{id}/accept"]
          - state_machines.WasteManifest.SEALED_to_ACCEPTED
          - calculations.manifest_gallons_total
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Accept is gated on the manifest being SEALED, so calling it on an OPEN manifest is refused even though every other precondition (facility ACCEPTING, class accepted, a SERVICED visit present) already holds; after sealing, the same call succeeds and committed_gallons_today does not double-count because SEALED and ACCEPTED are both in the facility's input set."
        test_recipe:
          setup:
            - "Clock 2026-08-10T06:00:00Z (a Monday). Account, placeable site, MON route capacity 20, facility accepting BLACKWATER with cap 5000."
            - "CONSTRUCTION contract 40 / freq 3 quoted to 7 units with one ACTIVE schedule; one visit on 2026-08-10 dispatched and completed with 380 gallons."
            - "One OPEN manifest for that route and date, waste_class BLACKWATER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Ashgrove Sanitation", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Ashgrove Pad", jurisdiction_code: "OR-MU-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-11801", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-11801" }
              as: ComplianceOfficer
            - call: "POST /routes"
              payload: { route_code: "RT-MON-129", service_day: "MON", truck_capacity_units: 20, waste_capacity_gallons: 3000 }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /disposal-sites"
              payload: { site_code: "DS-ASH", daily_gallon_cap: 5000, accepted_waste_classes: ["BLACKWATER"], status: "ACCEPTING" }
              as: PlatformAdmin
              captures: { facility_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
            - call: "POST /service-schedules"
              payload: { contract_id: "${contract_id}", route_id: "${route_id}", service_day: "MON", window_start_minute: 480, window_end_minute: 600 }
              as: DispatchPlanner
              captures: { schedule_id: $.data.id }
            - call: "POST /service-visits"
              payload: { schedule_id: "${schedule_id}", visit_kind: "SERVICE", scheduled_date: "2026-08-10", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { visit_id: $.data.id }
            - call: "POST /service-visits/${visit_id}/dispatch"
              payload: {}
              as: DriverOperator
            - call: "POST /service-visits/${visit_id}/complete"
              payload: { gallons_pumped: 380 }
              as: DriverOperator
              captures: { visit_state: $.data.state }
            - call: "POST /waste-manifests"
              payload: { route_id: "${route_id}", disposal_site_id: "${facility_id}", manifest_date: "2026-08-10", waste_class: "BLACKWATER" }
              as: DriverOperator
              captures: { manifest_id: $.data.id, m_state_open: $.data.state, m_gallons_open: $.data.gallons_total }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: DriverOperator
              captures: { route_v: $.data.version }
          trigger:
            - call: "POST /waste-manifests/${manifest_id}/accept"
              payload: { acceptance_note: "too early" }
              as: ComplianceOfficer
              captures: { e_not_sealed: $.data.error_id }
            - call: "GET /disposal-sites/${facility_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { committed_before_seal: $.data.committed_gallons_today }
            - call: "POST /waste-manifests/${manifest_id}/seal"
              payload: { expected_route_version: "${route_v}" }
              as: DriverOperator
              captures: { m_state_sealed: $.data.state, m_gallons_sealed: $.data.gallons_total }
            - call: "GET /disposal-sites/${facility_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { committed_after_seal: $.data.committed_gallons_today }
            - call: "POST /waste-manifests/${manifest_id}/accept"
              payload: { acceptance_note: "weighed in at the gate" }
              as: ComplianceOfficer
              captures: { m_state_accepted: $.data.state, m_gallons_accepted: $.data.gallons_total }
            - call: "GET /disposal-sites/${facility_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { committed_after_accept: $.data.committed_gallons_today }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: DriverOperator
              captures: { route_v_after: $.data.version }
          assert:
            - "${visit_state} == SERVICED and ${m_state_open} == OPEN with ${m_gallons_open} == 380 — the manifest picks up the already-serviced visit at creation"
            - "${e_not_sealed} == ERR_INVALID_STATE_TRANSITION with HTTP 409 — accept from OPEN is refused although every other precondition holds"
            - "${committed_before_seal} == 0 — the refused accept committed nothing"
            - "${m_state_sealed} == SEALED and ${m_gallons_sealed} == 380"
            - "${committed_after_seal} == 380"
            - "${m_state_accepted} == ACCEPTED and ${m_gallons_accepted} == 380 — the frozen total is not recomputed on accept"
            - "${committed_after_accept} == 380 — no double count, because both SEALED and ACCEPTED manifests are in the facility's input set"
            - "${route_v_after} == ${route_v} + 1 — the seal bumped Route.version exactly once and the accept did not"

      - name: action_endpoints_run_their_transition_and_enforce_their_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /placement-permits/{id}/submit"]
          - endpoints["POST /placement-permits/{id}/reject"]
          - state_machines.PlacementPermit
        excluded_because:
          difficulty_instance: permit_reject_resubmit_cycle_increments_revision_round_to_limit
          rationale: "That §1.8 instance drives submit / reject / submit around the cycle, asserting the state after each action and the ERR_PERMIT_REVISION_LIMIT refusal at the cap, which covers both halves of the action-endpoint claim for this family."

  # ===========================================================================
  # Coverage note for this section: every id in §1.6 is triggered somewhere across
  # §1.8 + §1.9. The four header/identity codes live in the rbac section below;
  # ERR_INVALID_REQUEST, ERR_INVALID_STATE_TRANSITION, ERR_SITE_POSTURE_RESTRICTED,
  # ERR_ACCESS_WINDOW_VIOLATION, ERR_ROUTE_UNIT_CAPACITY_EXCEEDED,
  # ERR_DISPOSAL_CLASS_NOT_ACCEPTED, ERR_MANIFEST_NO_SERVICED_VISITS,
  # ERR_RECONCILIATION_NO_DEPLOYMENTS and ERR_DISPUTE_WINDOW_CLOSED live in the
  # validations section; the two 412 codes live in cross_cutting_complexity_layers;
  # the twelve 404s are swept in one instance here; the rest are stubbed to §1.8.
  - section: errors
    instances:
      - name: every_not_found_code_is_triggerable_with_an_unminted_id
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_ASSET_UNIT_NOT_FOUND]
          - errors[ERR_DISPOSAL_SITE_NOT_FOUND]
          - errors[ERR_ROUTE_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_DEPLOYMENT_NOT_FOUND]
          - errors[ERR_SCHEDULE_NOT_FOUND]
          - errors[ERR_VISIT_NOT_FOUND]
          - errors[ERR_MANIFEST_NOT_FOUND]
          - errors[ERR_CHARGE_NOT_FOUND]
        distinguishing_aspect: "All thirteen entities are addressed by the same opaque uuid shape, so a single unminted uuid probed against all twelve single-row reads must yield twelve DISTINCT error ids — an implementation that emits one generic ERR_NOT_FOUND, or that reuses the first entity's code, fails here and nowhere else."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. No domain rows are needed: every probe uses the canonical never-minted uuid 00000000-0000-0000-0000-000000000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "GET /rental-accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_account: $.data.error_id }
            - call: "GET /service-sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesRep
              captures: { e_site: $.data.error_id }
            - call: "GET /placement-permits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitCoordinator
              captures: { e_permit: $.data.error_id }
            - call: "GET /asset-units/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DispatchPlanner
              captures: { e_asset: $.data.error_id }
            - call: "GET /disposal-sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DriverOperator
              captures: { e_disposal: $.data.error_id }
            - call: "GET /routes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DispatchPlanner
              captures: { e_route: $.data.error_id }
            - call: "GET /rental-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesRep
              captures: { e_contract: $.data.error_id }
            - call: "GET /unit-deployments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DispatchPlanner
              captures: { e_deployment: $.data.error_id }
            - call: "GET /service-schedules/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DispatchPlanner
              captures: { e_schedule: $.data.error_id }
            - call: "GET /service-visits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DriverOperator
              captures: { e_visit: $.data.error_id }
            - call: "GET /waste-manifests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DriverOperator
              captures: { e_manifest: $.data.error_id }
            - call: "GET /charge-events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { e_charge: $.data.error_id }
          assert:
            - "${now} == 2026-08-03T08:00:00.000Z"
            - "${e_account} == ERR_ACCOUNT_NOT_FOUND, ${e_site} == ERR_SITE_NOT_FOUND, ${e_permit} == ERR_PERMIT_NOT_FOUND, ${e_asset} == ERR_ASSET_UNIT_NOT_FOUND"
            - "${e_disposal} == ERR_DISPOSAL_SITE_NOT_FOUND, ${e_route} == ERR_ROUTE_NOT_FOUND, ${e_contract} == ERR_CONTRACT_NOT_FOUND, ${e_deployment} == ERR_DEPLOYMENT_NOT_FOUND"
            - "${e_schedule} == ERR_SCHEDULE_NOT_FOUND, ${e_visit} == ERR_VISIT_NOT_FOUND, ${e_manifest} == ERR_MANIFEST_NOT_FOUND, ${e_charge} == ERR_CHARGE_NOT_FOUND"
            - "all twelve responses are HTTP 404 and all twelve error ids are pairwise distinct"

      - name: err_site_posture_blocked_and_err_account_billing_hold_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SITE_POSTURE_BLOCKED]
          - errors[ERR_ACCOUNT_BILLING_HOLD]
        excluded_because:
          difficulty_instance: activate_prefers_site_posture_blocked_over_account_billing_hold
          rationale: "Both codes are raised in isolation and jointly by that §1.8 instance, with the 409 and the 402 status codes asserted separately."

      - name: err_site_access_infeasible_and_err_unit_double_booked_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SITE_ACCESS_INFEASIBLE]
          - errors[ERR_UNIT_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: deployment_prefers_access_infeasible_over_unit_double_booked
          rationale: "That §1.8 instance triggers each of the two codes on its own after triggering both together, so the 422 and the 409 are each exercised."

      - name: err_route_window_conflict_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ROUTE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: route_visit_windows_use_twenty_minute_buffered_half_open_minute_intervals
          rationale: "That §1.8 instance raises the 409 at exact adjacency and inside the 20-minute buffer, and proves the pass side one minute outside it."

      - name: err_disposal_cap_exceeded_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DISPOSAL_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: disposal_daily_cap_boundary_accepts_load_at_cap_and_rejects_one_gallon_over
          rationale: "That §1.8 instance seals exactly at the daily cap and then one gallon over, raising the 422 at the boundary+1 only."

      - name: err_disposal_site_closed_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DISPOSAL_SITE_CLOSED]
        excluded_because:
          difficulty_instance: manifest_seal_depends_on_disposal_site_status_accepting
          rationale: "That §1.8 instance seals the identical manifest at a CLOSED and at an ACCEPTING facility, so the 409 is raised and its absence is confirmed."

      - name: err_route_suspended_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ROUTE_SUSPENDED]
        excluded_because:
          difficulty_instance: visit_dispatch_depends_on_route_status_being_active
          rationale: "That §1.8 instance dispatches a PLANNED visit on a route that is not ACTIVE and asserts the 409, then repeats the dispatch once the route is ACTIVE."

      - name: err_permit_revision_limit_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PERMIT_REVISION_LIMIT]
        excluded_because:
          difficulty_instance: permit_reject_resubmit_cycle_increments_revision_round_to_limit
          rationale: "That §1.8 instance walks the reject/resubmit cycle to the declared cap and asserts the 409 on the submit that would exceed it."

  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_shared_operations
        claim_type: shared_operations
        grounds:
          - roles.SalesRep.shared_operations
          - roles.PlatformAdmin.shared_operations
          - roles.CustomerContact.shared_operations
          - endpoints["POST /service-sites"]
          - endpoints["POST /rental-contracts"]
        distinguishing_aspect: "Two endpoints are shared by two different role pairs — POST /service-sites by SalesRep and PlatformAdmin, POST /rental-contracts by SalesRep and CustomerContact — so both members of each pair must succeed on the same account, which an implementation that collapses each endpoint to a single owning role cannot do."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. One RentalAccount, whose id doubles as the CustomerContact X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Ivyholt Event Group", account_type: "EVENT", credit_terms_days: 15 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Ivyholt Green", jurisdiction_code: "MD-BA-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_by_rep: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Ivyholt Annex", jurisdiction_code: "MD-BA-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: PlatformAdmin
              captures: { site_by_admin: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_by_rep}", contract_kind: "EVENT", term_start: "2026-08-03", term_end: "2026-08-20", headcount: 40, event_duration_hours: 6, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "EVENT_NA", ada_required: false }
              as: SalesRep
              captures: { contract_by_rep: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_by_admin}", contract_kind: "EVENT", term_start: "2026-08-03", term_end: "2026-08-20", headcount: 40, event_duration_hours: 6, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "EVENT_NA", ada_required: false }
              as: CustomerContact
              as_user_id: "${acct_id}"
              captures: { contract_by_customer: $.data.id }
            - call: "GET /service-sites/${site_by_rep}"
              payload: {}
              as: DriverOperator
              captures: { rep_site_account: $.data.account_id }
            - call: "GET /service-sites/${site_by_admin}"
              payload: {}
              as: PermitCoordinator
              captures: { admin_site_account: $.data.account_id }
            - call: "GET /rental-contracts"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              captures: { contracts: $.data }
          assert:
            - "both site creations return HTTP 201 with distinct ids ${site_by_rep} != ${site_by_admin}"
            - "both contract creations return HTTP 201 with distinct ids ${contract_by_rep} != ${contract_by_customer}"
            - "${rep_site_account} == ${acct_id} and ${admin_site_account} == ${acct_id} — both shared-operation writes landed on the same account"
            - "${contracts} has length 2 with total_count 2 — 'all GET reads' really is shared, since a DriverOperator, a PermitCoordinator and a ComplianceOfficer performed these reads"

