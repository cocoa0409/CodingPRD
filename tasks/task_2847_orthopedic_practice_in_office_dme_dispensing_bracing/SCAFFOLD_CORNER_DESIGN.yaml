      - name: corner_clinic_suspension_gates_fitting_and_reservation_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=31]
          - validations[priority=60]
          - errors[ERR_COMPLIANCE_HOLD_ACTIVE]
          - errors[ERR_CLINIC_DISPENSING_SUSPENDED]
          - calculations.clinic_dispensing_posture
          - state_machines.Clinic.RESTRICTED_to_SUSPENDED
          - state_machines.Clinic.SUSPENDED_to_RESTRICTED
        distinguishing_aspect: |
          Both gates depend on the state of an entity the request never names.
          The clinic is driven to SUSPENDED by two shelves emptying, and from
          then on two different requests fail for two different reasons: a
          fitting on the already-RESERVED sibling encounter is refused with
          ERR_COMPLIANCE_HOLD_ACTIVE, because the suspension stamped
          compliance_hold on that encounter, while a NEW reservation on a
          perfectly healthy third shelf is refused with
          ERR_CLINIC_DISPENSING_SUSPENDED, because the clinic-level posture is
          consulted directly. Restoring one shelf with a stock receipt reverses
          both: the clinic drops back to RESTRICTED, the hold is cleared, and
          the same fitting request that failed now succeeds -- the hold is
          derived state, not a flag that has to be cleared by hand.
        test_recipe:
          setup:
            - "one accredited SPINE clinic, an ordering physician, an attesting physician, one OFF_SHELF_ONLY fitter and one patient"
            - "three OFF_SHELF_PREFAB products in three DIFFERENT same_or_similar groups, each with its own shelf at par_min 1 / par_max 20; shelves 1 and 2 hold a single unit, shelf 3 holds two units"
