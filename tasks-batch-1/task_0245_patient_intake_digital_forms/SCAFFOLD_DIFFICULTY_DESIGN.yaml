# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Patient Intake & Digital Forms — EXPERT band
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. 9 rules x >=2 = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: copay_estimate_vs_finalized_diverge
        grounds:
          - calculations.estimate_copay
          - calculations.finalize_patient_responsibility
          - entities.Appointment.fields.provisional_copay_cents
          - entities.IntakeSession.fields.final_patient_responsibility_cents
        distinguishing_aspect: |
          Same visit: the forward-looking estimate_copay (Appointment domain) uses only
          plan_default_copay_cents=2500, while the chronological finalize on the same
          visit (IntakeSession domain, from the captured card) yields 9100 — different
          numbers for the same subject because the algorithms differ.
        test_recipe:
          setup:
            - "Clinic (PER_LINE_THEN_SUM, facility_fee 500), provider, patient, appointment with plan_default_copay_cents=2500."
            - "IntakeSession opened; InsuranceCard captured (copay 3000, coins 20, fac_coins 0, deductible 5000, allowed 8000); verified then resolved ELIGIBLE."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C1", form_expiration_hours: 72, copay_rounding: "PER_LINE_THEN_SUM", facility_fee_cents: 500 }
              as: ClinicAdmin
              captures: { c1: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c1}", full_name: "Dr A", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { prov: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c1}", legal_name: "Pat A", date_of_birth: "1990-01-01", phone: "555-0100" }
              as: FrontDeskStaff
              captures: { pat: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c1}", provider_id: "${prov}", patient_id: "${pat}", start_utc: "2026-06-10T10:00:00.000Z", end_utc: "2026-06-10T10:30:00.000Z", plan_default_copay_cents: 2500 }
              as: FrontDeskStaff
              captures: { appt: $.data.id, est: $.data.provisional_copay_cents }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${appt}" }
              as: FrontDeskStaff
              captures: { sess: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sess}", payer_name: "Acme", member_id: "M1", plan_copay_cents: 3000, plan_coinsurance_pct: 20, facility_coinsurance_pct: 0, remaining_deductible_cents: 5000, visit_allowed_amount_cents: 8000 }
              as: FrontDeskStaff
              captures: { card: $.data.id }
            - call: "POST /insurance-cards/${card}/verify"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /insurance-cards/${card}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
          assert:
            - "Appointment.${appt}.provisional_copay_cents == 2500"
            - "IntakeSession.${sess}.final_patient_responsibility_cents == 9100"
            - "IntakeSession.${sess}.final_patient_responsibility_cents != Appointment.${appt}.provisional_copay_cents"

      - name: questionnaire_provisional_vs_final_diverge
        grounds:
          - calculations.questionnaire_risk_score
          - entities.QuestionnaireResponse.fields.provisional_risk_score
          - entities.QuestionnaireResponse.fields.final_risk_score
          - state_machines.QuestionnaireResponse.SUBMITTED_to_FLAGGED
        distinguishing_aspect: |
          On the QuestionnaireResponse domain (NOT the copay/visit-cost domain): the
          provisional plain-sum score is 12 at SUBMIT, while the weighted final score is
          24 at ACCEPT (required sections x2), so the same answers produce different
          numbers and the final crosses HIGH_RISK_THRESHOLD into FLAGGED.
        test_recipe:
          setup:
            - "Clinic + provider with questionnaire_required_sections [ALLERGIES, MEDICATIONS, HISTORY]; patient; appointment; intake session."
            - "QuestionnaireResponse with answered_sections weights 4/3/5 on the three required keys, submitted."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C2", form_expiration_hours: 72 }
              as: ClinicAdmin
              captures: { c2: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c2}", full_name: "Dr B", required_consent_codes: [], questionnaire_required_sections: ["ALLERGIES", "MEDICATIONS", "HISTORY"] }
              as: ClinicAdmin
              captures: { provB: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c2}", legal_name: "Pat B", date_of_birth: "1985-02-02", phone: "555-0200" }
              as: FrontDeskStaff
              captures: { patB: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c2}", provider_id: "${provB}", patient_id: "${patB}", start_utc: "2026-06-11T09:00:00.000Z", end_utc: "2026-06-11T09:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptB: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptB}" }
              as: FrontDeskStaff
              captures: { sessB: $.data.id }
            - call: "POST /questionnaire-responses"
              payload: { intake_session_id: "${sessB}", answered_sections: [ { section_key: "ALLERGIES", risk_weight: 4 }, { section_key: "MEDICATIONS", risk_weight: 3 }, { section_key: "HISTORY", risk_weight: 5 } ] }
              as: Patient
              captures: { qr: $.data.id }
            - call: "POST /questionnaire-responses/${qr}/submit"
              payload: {}
              as: Patient
              captures: { prov_score: $.data.provisional_risk_score }
          trigger:
            - call: "POST /questionnaire-responses/${qr}/accept"
              payload: {}
              as: FrontDeskStaff
              captures: { fin_score: $.data.final_risk_score }
          assert:
            - "QuestionnaireResponse.${qr}.provisional_risk_score == 12"
            - "QuestionnaireResponse.${qr}.final_risk_score == 24"
            - "QuestionnaireResponse.${qr}.status == FLAGGED"
            - "QuestionnaireResponse.${qr}.high_risk_flag == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: copay_nested_minmax_mode_a
        grounds:
          - calculations.finalize_patient_responsibility
          - entities.InsuranceCard.fields.plan_coinsurance_pct
          - entities.InsuranceCard.fields.remaining_deductible_cents
          - entities.IntakeSession.fields.final_patient_responsibility_cents
        distinguishing_aspect: |
          Mode (a): finalize combines >=3 inputs with nested min/max — copay_leg=min(3000,8000),
          deductible_leg=min(5000,8000), coinsurance on above_deductible=max(8000-5000,0)=3000
          at 20% = 600, plus facility 500 => 9100; non-linear interaction of copay/deductible/coinsurance.
        test_recipe:
          setup:
            - "Clinic PER_LINE_THEN_SUM facility 500; provider no required forms; session; card copay 3000 / coins 20 / fac_coins 0 / deductible 5000 / allowed 8000."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C3", copay_rounding: "PER_LINE_THEN_SUM", facility_fee_cents: 500 }
              as: ClinicAdmin
              captures: { c3: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c3}", full_name: "Dr C", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provC: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c3}", legal_name: "Pat C", date_of_birth: "1980-03-03", phone: "555-0300" }
              as: FrontDeskStaff
              captures: { patC: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c3}", provider_id: "${provC}", patient_id: "${patC}", start_utc: "2026-06-12T10:00:00.000Z", end_utc: "2026-06-12T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptC: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptC}" }
              as: FrontDeskStaff
              captures: { sessC: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sessC}", payer_name: "Acme", member_id: "M3", plan_copay_cents: 3000, plan_coinsurance_pct: 20, facility_coinsurance_pct: 0, remaining_deductible_cents: 5000, visit_allowed_amount_cents: 8000 }
              as: FrontDeskStaff
              captures: { cardC: $.data.id }
            - call: "POST /insurance-cards/${cardC}/verify"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /insurance-cards/${cardC}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
          assert:
            - "IntakeSession.${sessC}.final_patient_responsibility_cents == 9100"
            - "IntakeSession.${sessC}.financial_status == COPAY_DUE"

      - name: copay_rounding_order_mode_b
        grounds:
          - calculations.copay_total_rounding
          - entities.Clinic.fields.copay_rounding
          - entities.InsuranceCard.fields.facility_coinsurance_pct
          - entities.IntakeSession.fields.final_patient_responsibility_cents
        distinguishing_aspect: |
          Mode (b): two fractional legs each ending in .5 (medical_coins=100.5, facility_coins=50.5).
          With clinic.copay_rounding=PER_LINE_THEN_SUM the total is 1662 (101+51 rounded per leg);
          SUM_THEN_ROUND would give 1661 — the pinned per-line order makes the value well-defined.
        test_recipe:
          setup:
            - "Clinic PER_LINE_THEN_SUM with facility_fee_cents 1010; provider no required forms; session."
            - "Card: copay 500 / coins 5 / fac_coins 5 / deductible 0 / allowed 2010 -> medical_coins=2010*5/100=100.5, facility_coins=1010*5/100=50.5."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C4", copay_rounding: "PER_LINE_THEN_SUM", facility_fee_cents: 1010 }
              as: ClinicAdmin
              captures: { c4: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c4}", full_name: "Dr D", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provD: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c4}", legal_name: "Pat D", date_of_birth: "1975-04-04", phone: "555-0400" }
              as: FrontDeskStaff
              captures: { patD: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c4}", provider_id: "${provD}", patient_id: "${patD}", start_utc: "2026-06-13T10:00:00.000Z", end_utc: "2026-06-13T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptD: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptD}" }
              as: FrontDeskStaff
              captures: { sessD: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sessD}", payer_name: "Acme", member_id: "M4", plan_copay_cents: 500, plan_coinsurance_pct: 5, facility_coinsurance_pct: 5, remaining_deductible_cents: 0, visit_allowed_amount_cents: 2010 }
              as: FrontDeskStaff
              captures: { cardD: $.data.id }
            - call: "POST /insurance-cards/${cardD}/verify"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /insurance-cards/${cardD}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
          assert:
            - "IntakeSession.${sessD}.final_patient_responsibility_cents == 1662"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: consent_revoke_reissue_cycle
        grounds:
          - state_machines.ConsentDocument.SIGNED_to_REVOKED
          - state_machines.ConsentDocument.REVOKED_to_PENDING
          - entities.ConsentDocument.fields.revision
        distinguishing_aspect: |
          ConsentDocument is cyclic: PENDING->SIGNED->REVOKED->PENDING returns to PENDING
          with revision incremented to 2 (not a linear pipeline) on the ConsentDocument entity.
        test_recipe:
          setup:
            - "Clinic; provider requiring [HIPAA_NPP]; session; one ConsentDocument HIPAA_NPP signed then revoked."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C5", form_expiration_hours: 72 }
              as: ClinicAdmin
              captures: { c5: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c5}", full_name: "Dr E", required_consent_codes: ["HIPAA_NPP"], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provE: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c5}", legal_name: "Pat E", date_of_birth: "1970-05-05", phone: "555-0500" }
              as: FrontDeskStaff
              captures: { patE: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c5}", provider_id: "${provE}", patient_id: "${patE}", start_utc: "2026-06-14T10:00:00.000Z", end_utc: "2026-06-14T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptE: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptE}" }
              as: FrontDeskStaff
              captures: { sessE: $.data.id }
            - call: "POST /consent-documents"
              payload: { intake_session_id: "${sessE}", consent_code: "HIPAA_NPP" }
              as: FrontDeskStaff
              captures: { cd: $.data.id }
            - call: "POST /consent-documents/${cd}/sign"
              payload: { signer_name: "Pat E" }
              as: Patient
            - call: "POST /consent-documents/${cd}/revoke"
              payload: {}
              as: Patient
          trigger:
            - call: "POST /consent-documents/${cd}/reissue"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "ConsentDocument.${cd}.status == PENDING"
            - "ConsentDocument.${cd}.revision == 2"

      - name: questionnaire_revise_cycle
        grounds:
          - state_machines.QuestionnaireResponse.SUBMITTED_to_FLAGGED
          - state_machines.QuestionnaireResponse.FLAGGED_to_DRAFT
          - entities.QuestionnaireResponse.fields.final_risk_score
        distinguishing_aspect: |
          QuestionnaireResponse is cyclic on a DIFFERENT entity than ConsentDocument:
          DRAFT->SUBMITTED->FLAGGED->DRAFT loops back to DRAFT with final_risk_score cleared to null.
        test_recipe:
          setup:
            - "Provider requires [ALLERGIES]; questionnaire weight 12 on ALLERGIES submitted then accepted into FLAGGED (final 24>=20)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C6", form_expiration_hours: 72 }
              as: ClinicAdmin
              captures: { c6: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c6}", full_name: "Dr F", required_consent_codes: [], questionnaire_required_sections: ["ALLERGIES"] }
              as: ClinicAdmin
              captures: { provF: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c6}", legal_name: "Pat F", date_of_birth: "1972-06-06", phone: "555-0600" }
              as: FrontDeskStaff
              captures: { patF: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c6}", provider_id: "${provF}", patient_id: "${patF}", start_utc: "2026-06-15T10:00:00.000Z", end_utc: "2026-06-15T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptF: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptF}" }
              as: FrontDeskStaff
              captures: { sessF: $.data.id }
            - call: "POST /questionnaire-responses"
              payload: { intake_session_id: "${sessF}", answered_sections: [ { section_key: "ALLERGIES", risk_weight: 12 } ] }
              as: Patient
              captures: { qrF: $.data.id }
            - call: "POST /questionnaire-responses/${qrF}/submit"
              payload: {}
              as: Patient
            - call: "POST /questionnaire-responses/${qrF}/accept"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /questionnaire-responses/${qrF}/revise"
              payload: {}
              as: Patient
          assert:
            - "QuestionnaireResponse.${qrF}.status == DRAFT"
            - "QuestionnaireResponse.${qrF}.final_risk_score == null"
            - "QuestionnaireResponse.${qrF}.high_risk_flag == false"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sign_last_consent_ready_enqueues_queue
        grounds:
          - state_machines.ConsentDocument.PENDING_to_SIGNED
          - state_machines.IntakeSession.IN_PROGRESS_to_READY_FOR_VISIT
          - calculations.forms_complete
          - entities.KioskQueueEntry.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from the consent SIGN trigger: sign -> session.forms_complete flips true
          -> session workflow_status IN_PROGRESS->READY_FOR_VISIT -> a KioskQueueEntry WAITING is
          auto-created and clinic.active_queue_count becomes 1; each link caused by the previous.
        test_recipe:
          setup:
            - "Provider requires [HIPAA_NPP], no questionnaire sections; session; card resolved ELIGIBLE with allowed 0 -> INSURED so financial gate met; one PENDING HIPAA_NPP consent."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C7", form_expiration_hours: 72, facility_fee_cents: 0 }
              as: ClinicAdmin
              captures: { c7: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c7}", full_name: "Dr G", required_consent_codes: ["HIPAA_NPP"], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provG: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c7}", legal_name: "Pat G", date_of_birth: "1968-07-07", phone: "555-0700" }
              as: FrontDeskStaff
              captures: { patG: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c7}", provider_id: "${provG}", patient_id: "${patG}", start_utc: "2026-06-16T10:00:00.000Z", end_utc: "2026-06-16T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptG: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptG}" }
              as: FrontDeskStaff
              captures: { sessG: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sessG}", payer_name: "Acme", member_id: "M7", plan_copay_cents: 0, plan_coinsurance_pct: 0, facility_coinsurance_pct: 0, remaining_deductible_cents: 0, visit_allowed_amount_cents: 0 }
              as: FrontDeskStaff
              captures: { cardG: $.data.id }
            - call: "POST /insurance-cards/${cardG}/verify"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /insurance-cards/${cardG}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
            - call: "POST /consent-documents"
              payload: { intake_session_id: "${sessG}", consent_code: "HIPAA_NPP" }
              as: FrontDeskStaff
              captures: { cdG: $.data.id }
          trigger:
            - call: "POST /consent-documents/${cdG}/sign"
              payload: { signer_name: "Pat G" }
              as: Patient
          assert:
            - "IntakeSession.${sessG}.forms_complete == true"
            - "IntakeSession.${sessG}.workflow_status == READY_FOR_VISIT"
            - "IntakeSession.${sessG}.financial_status == INSURED"
            - "There exists exactly one KioskQueueEntry with intake_session_id == ${sessG} and status == WAITING"
            - "Clinic.${c7}.active_queue_count == 1"

      - name: eligibility_ineligible_self_pay_cascade
        grounds:
          - state_machines.InsuranceCard.VERIFYING_to_INELIGIBLE
          - state_machines.IntakeSession.PENDING_ELIGIBILITY_to_SELF_PAY
          - calculations.finalize_patient_responsibility
          - entities.IntakeSession.fields.financial_status
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (resolve-eligibility INELIGIBLE): card ->INELIGIBLE
          -> session.final_patient_responsibility_cents recomputed at self-pay (allowed 8000 + facility 500 = 8500)
          -> session.financial_status ->SELF_PAY; each link caused by the previous.
        test_recipe:
          setup:
            - "Clinic facility 500; provider no required forms; session; card captured with allowed 8000; verified."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C8", facility_fee_cents: 500 }
              as: ClinicAdmin
              captures: { c8: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c8}", full_name: "Dr H", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provH: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c8}", legal_name: "Pat H", date_of_birth: "1966-08-08", phone: "555-0800" }
              as: FrontDeskStaff
              captures: { patH: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c8}", provider_id: "${provH}", patient_id: "${patH}", start_utc: "2026-06-17T10:00:00.000Z", end_utc: "2026-06-17T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptH: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptH}" }
              as: FrontDeskStaff
              captures: { sessH: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sessH}", payer_name: "Acme", member_id: "M8", plan_copay_cents: 3000, plan_coinsurance_pct: 20, facility_coinsurance_pct: 0, remaining_deductible_cents: 5000, visit_allowed_amount_cents: 8000 }
              as: FrontDeskStaff
              captures: { cardH: $.data.id }
            - call: "POST /insurance-cards/${cardH}/verify"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /insurance-cards/${cardH}/resolve-eligibility"
              payload: { outcome: "INELIGIBLE" }
              as: FrontDeskStaff
          assert:
            - "InsuranceCard.${cardH}.eligibility_status == INELIGIBLE"
            - "IntakeSession.${sessH}.final_patient_responsibility_cents == 8500"
            - "IntakeSession.${sessH}.financial_status == SELF_PAY"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_copay_capture
        grounds:
          - validations[priority=6]
          - validations[priority=15]
        distinguishing_aspect: |
          Error-category pair state(p6) vs business_fiscal(p15): a new copay authorization on a
          session that is BOTH not COPAY_DUE (already COPAY_SETTLED, a state failure) AND carries a
          wrong amount_cents (8000 != final 9100, a fiscal failure) must return the higher-priority
          state error ERR_COPAY_NOT_DUE, not ERR_COPAY_AMOUNT_MISMATCH.
        test_recipe:
          setup:
            - "Session driven to COPAY_SETTLED: final 9100, a CopayPayment authorized 9100 then captured (financial_status COPAY_SETTLED)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C9", copay_rounding: "PER_LINE_THEN_SUM", facility_fee_cents: 500 }
              as: ClinicAdmin
              captures: { c9: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c9}", full_name: "Dr I", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provI: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c9}", legal_name: "Pat I", date_of_birth: "1964-09-09", phone: "555-0900" }
              as: FrontDeskStaff
              captures: { patI: $.data.id }
            - call: "POST /appointments"
