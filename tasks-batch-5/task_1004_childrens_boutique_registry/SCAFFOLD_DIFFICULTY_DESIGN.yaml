scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: registry_completion_discount_final_variant_ignores_unlock_gate
        grounds:
          - calculations.registry_completion_discount
          - entities.Order.fields.completion_discount_cents
          - entities.Registry.fields.event_date
        distinguishing_aspect: "FINAL (order.created_at >= registry.event_date) grants 15% on still-needed registry lines regardless of completion_pct, so a registrant buying 3 of a 10000c SKU (desired 5, 0 gifted) on a non-unlocked registry gets completion_discount_cents == 4500; the identical PROVISIONAL cart before event_date would be 0. Registry-domain calc."
        test_recipe:
          setup:
            - "Store S open 09:00-20:00, 2 stations; SKU A base_price 10000, on_hand 100; Customer C BRONZE; Registry R (BABY_REGISTRY, registrant C, event_date 2026-07-10) ACTIVE with item A desired 5, no gifts (completion_pct 0, status ACTIVE); clock advanced to 2026-07-11."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-07-10T00:00:00Z", kind: "BABY_REGISTRY" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
            - call: "POST /registries/${r_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /registries/${r_id}/items"
              payload: { sku_id: "${a_id}", desired_qty: 5 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { item_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", registry_id: "${r_id}", lines: [ { sku_id: "${a_id}", qty: 3 } ], pickup_start: "2026-07-11T10:00:00Z", pickup_end: "2026-07-11T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.subtotal_cents == 30000"
            - "Order.${o_id}.completion_discount_cents == 4500"
            - "Order.${o_id}.applied_discount_cents == 4500"
            - "Order.${o_id}.total_before_credit_cents == 25500"

      - name: trade_in_final_valuation_applies_condition_cap
        grounds:
          - calculations.trade_in_valuation
          - entities.TradeIn.fields.quoted_value_cents
          - entities.TradeIn.fields.final_value_cents
          - entities.Customer.fields.store_credit_balance_cents
        distinguishing_aspect: "TradeIn FINAL applies CONDITION_CAP_CENTS[LIKE_NEW]=2500 that QUOTED ignores: for SKU base 10000, LIKE_NEW, quoted_value_cents==3000 but final_value_cents==2500 and the customer wallet is credited 2500. TradeIn-domain calc, distinct from the Registry dual-variant."
        test_recipe:
          setup:
            - "Store S; SKU A base_price 10000; Customer C with 0 store credit; TradeIn T submitted for A at LIKE_NEW (quoted 3000)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${c_id}", sku_id: "${a_id}", submitted_condition: "LIKE_NEW" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { t_id: $.data.id, quote: $.data.quoted_value_cents }
          trigger:
            - call: "POST /trade-ins/${t_id}/accept"
              payload: { inspected_condition: "LIKE_NEW" }
              as: StoreStaff
          assert:
            - "TradeIn.${t_id}.quoted_value_cents == 3000"
            - "TradeIn.${t_id}.final_value_cents == 2500"
            - "TradeIn.${t_id}.status == ACCEPTED"
            - "Customer.${c_id}.store_credit_balance_cents == 2500"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_loyalty_discount_rounded_per_line_then_summed
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.loyalty_discount_cents
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: "Mode (b) rounding order: GOLD (10%) on two 3333c lines gives round(333.3)+round(333.3)=333+333=666 per-line-then-summed, NOT round(6666*0.10)=667; loyalty_discount_cents==666 pins per-line rounding."
        test_recipe:
          setup:
            - "Store S; SKUs X and Y each base_price 3333, on_hand 100; Customer C seeded lifetime_spend 150000 -> GOLD tier."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "X", name: "Bib", category: "FEEDING", size_stage: "NEWBORN", base_price_cents: 3333, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { x_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "Y", name: "Hat", category: "CLOTHING", size_stage: "NEWBORN", base_price_cents: 3333, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { y_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", initial_lifetime_spend_cents: 150000 }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${x_id}", qty: 1 }, { sku_id: "${y_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Customer.${c_id}.loyalty_tier == GOLD"
            - "Order.${o_id}.subtotal_cents == 6666"
            - "Order.${o_id}.loyalty_discount_cents == 666"
            - "Order.${o_id}.applied_discount_cents == 666"
            - "Order.${o_id}.total_before_credit_cents == 6000"

      - name: consignor_payout_split_selection_and_fee_cap
        grounds:
          - calculations.consignor_payout
          - entities.ConsignmentItem.fields.payout_cents
          - entities.Customer.fields.store_credit_balance_cents
        distinguishing_aspect: "Mode (a) >=3-input nonlinear: split_pct = SEASON_SPLIT[IN_SEASON]0.60 + CONDITION_BONUS(LIKE_NEW)0.05 = 0.65 and processing_fee = min(round(10000*0.03)=300, cap 200)=200, so payout_cents = 6500 - 200 = 6300 (fee cap binds)."
        test_recipe:
          setup:
            - "Store S; OPEN shelf SH capacity 5; Customer C (consignor) with 0 credit; ConsignmentItem CI (LIKE_NEW, IN_SEASON, list 10000) displayed on SH."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /stores/${s_id}/consignment-shelves"
              payload: { shelf_code: "SH1", capacity: 5, season: "SPRING_SUMMER" }
              as: StoreStaff
              captures: { sh_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { consignor_customer_id: "${c_id}", store_id: "${s_id}", title: "Stroller", condition: "LIKE_NEW", season: "IN_SEASON", list_price_cents: 10000 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /consignment-items/${ci_id}/display"
              payload: { shelf_id: "${sh_id}", display_start: "2026-07-01T00:00:00Z", display_end: "2026-07-31T00:00:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /consignment-items/${ci_id}/sell"
              payload: { sale_price_cents: 10000 }
              as: StoreStaff
          assert:
            - "ConsignmentItem.${ci_id}.status == SOLD"
            - "ConsignmentItem.${ci_id}.payout_cents == 6300"
            - "Customer.${c_id}.store_credit_balance_cents == 6300"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: registry_cycles_unlocked_back_to_active_on_item_add
        grounds:
          - state_machines.Registry.COMPLETION_UNLOCKED_to_ACTIVE
          - calculations.registry_completion
          - entities.Registry.fields.completion_pct
        distinguishing_aspect: "Registry is cyclic: after a gift drives completion_pct to 0.80 (COMPLETION_UNLOCKED), adding item B (10000*3) grows desired_value to 80000 so completion_pct falls to 0.5 and status reverts COMPLETION_UNLOCKED -> ACTIVE (A<->B loop, not a linear pipeline)."
        test_recipe:
          setup:
            - "Registry R ACTIVE, registrant C; item A (SKU A 10000, desired 5); gift qty 4 -> fulfilled_value 40000, completion 0.80, status COMPLETION_UNLOCKED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "B", name: "Blanket", category: "NURSERY", size_stage: "NEWBORN", base_price_cents: 10000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { b_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
            - call: "POST /registries/${r_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /registries/${r_id}/items"
              payload: { sku_id: "${a_id}", desired_qty: 5 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { item_a: $.data.id }
            - call: "GET /registries/${r_id}"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { rv1: $.data.version }
            - call: "POST /registries/${r_id}/gifts"
              payload: { registry_item_id: "${item_a}", qty: 4, expected_registry_version: "${rv1}" }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /registries/${r_id}/items"
              payload: { sku_id: "${b_id}", desired_qty: 3 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "Registry.${r_id}.desired_value_cents == 80000"
            - "Registry.${r_id}.fulfilled_value_cents == 40000"
            - "Registry.${r_id}.completion_pct == 0.5"
            - "Registry.${r_id}.status == ACTIVE"

      - name: order_payment_axis_independent_of_fulfillment_axis
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.RESERVED_to_READY
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Order has parallel state dimensions: POST /pay moves payment_status UNPAID->PAID while leaving fulfillment_status at RESERVED, and POST /mark-ready then moves fulfillment_status->READY while payment_status stays PAID — the two axes advance independently on the same row."
        test_recipe:
          setup:
            - "Store S; SKU A on_hand 100; Customer C; Order O created (payment UNPAID, fulfillment RESERVED)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 5000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/pay"
              payload: { payment_method: "CARD" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/mark-ready"
              payload: {}
              as: StoreStaff
          assert:
            - "Order.${o_id}.payment_status == PAID"
            - "Order.${o_id}.fulfillment_status == READY"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: gift_cascade_registryitem_registry_customer_bonus
        grounds:
          - state_machines.Registry.ACTIVE_to_COMPLETION_UNLOCKED
          - entities.RegistryItem.fields.fulfilled_qty
          - entities.Registry.fields.completion_pct
          - entities.Customer.fields.loyalty_points
        distinguishing_aspect: "Depth-3 cascade from POST /gifts: RegistryGift -> RegistryItem.fulfilled_qty(4) -> Registry(completion 0.80, status COMPLETION_UNLOCKED) -> registrant Customer.loyalty_points += 250; each hop is caused by the prior hop's mutation."
        test_recipe:
          setup:
            - "Registry R ACTIVE, registrant C (loyalty_points 0); item A (SKU A 10000, desired 5, fulfilled 0)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
            - call: "POST /registries/${r_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /registries/${r_id}/items"
              payload: { sku_id: "${a_id}", desired_qty: 5 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { item_a: $.data.id }
            - call: "GET /registries/${r_id}"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /registries/${r_id}/gifts"
              payload: { registry_item_id: "${item_a}", qty: 4, expected_registry_version: "${rv1}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { g_id: $.data.id }
          assert:
            - "RegistryItem.${item_a}.fulfilled_qty == 4"
            - "Registry.${r_id}.completion_pct == 0.8"
            - "Registry.${r_id}.status == COMPLETION_UNLOCKED"
            - "Customer.${c_id}.loyalty_points == 250"

      - name: order_cancel_release_promotes_waitlisted_special_order
        grounds:
          - state_machines.Order.RESERVED_to_CANCELLED
          - state_machines.SpecialOrder.WAITLISTED_to_ALLOCATED
          - entities.SKU.fields.reserved_qty
          - entities.SpecialOrder.fields.status
        distinguishing_aspect: "Depth-2 cascade from a different trigger (POST /orders/{id}/cancel): Order cancel -> SKU.reserved_qty drops to 0 (available rises) -> the earliest WAITLISTED SpecialOrder for that SKU auto-promotes to ALLOCATED and re-reserves, leaving reserved_qty 1."
        test_recipe:
          setup:
            - "SKU A on_hand 1, reserved 0; Order O1 (C1) reserves 1 unit of A (reserved 1); SpecialOrder SO (C2) for A qty 1 is WAITLISTED (available 0)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 5000, initial_on_hand_qty: 1 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C1", email: "c1@x.com" }
              as: Anonymous
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C2", email: "c2@x.com" }
              as: Anonymous
              captures: { c2_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c2_id}", sku_id: "${a_id}", store_id: "${s_id}", qty: 1 }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /orders/${o1_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c1_id}"
          assert:
            - "SpecialOrder.${so_id}.status == ALLOCATED"
            - "SKU.${a_id}.reserved_qty == 1"
            - "SKU.${a_id}.on_hand_qty == 1"

  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_already_paid_state_beats_insufficient_credit_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_ORDER_ALREADY_PAID]
          - errors[ERR_INSUFFICIENT_STORE_CREDIT]
        distinguishing_aspect: "A single request violates state (order already PAID, priority 6) and business_fiscal (0 store credit, priority 13); the state error wins -> ERR_ORDER_ALREADY_PAID (state vs business_fiscal pair)."
        test_recipe:
          setup:
            - "Store S; SKU A base_price 5000 on_hand 100; Customer C with 0 store credit; Order O paid by CARD (payment PAID)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 5000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/pay"
              payload: { payment_method: "CARD" }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/pay"
              payload: { payment_method: "STORE_CREDIT" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_ORDER_ALREADY_PAID"
            - "response.http_status == 409"

      - name: pickup_outside_hours_temporal_beats_invalid_station_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_PICKUP_OUTSIDE_HOURS]
          - errors[ERR_INVALID_STATION]
        distinguishing_aspect: "A single POST /orders violates business_temporal (window 21:00-21:30 outside 09:00-20:00, priority 9) and business_constraint (station_no 5 > 2, priority 10); the temporal error wins -> ERR_PICKUP_OUTSIDE_HOURS (business_temporal vs business_constraint pair, distinct from state/fiscal)."
        test_recipe:
          setup:
            - "Store S open 09:00-20:00 with 2 stations; SKU A on_hand 100; Customer C."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", pickup_station_count: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 5000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T21:00:00Z", pickup_end: "2026-07-01T21:30:00Z", station_no: 5 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_PICKUP_OUTSIDE_HOURS"
            - "response.http_status == 422"

  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: completion_pct_exactly_080_unlocks_inclusive
        grounds:
          - calculations.registry_completion
          - state_machines.Registry.ACTIVE_to_COMPLETION_UNLOCKED
          - entities.Registry.fields.completion_pct
        distinguishing_aspect: "Numeric threshold on POST /registries/{id}/gifts: fulfilled_value 40000 / desired 50000 == 0.80 exactly unlocks (>= inclusive); qty 3 (0.60) would stay ACTIVE. Metric = completion_pct crossing."
        test_recipe:
          setup:
            - "Registry R ACTIVE; item A (SKU A 10000, desired 5); no gifts yet."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
            - call: "POST /registries/${r_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /registries/${r_id}/items"
              payload: { sku_id: "${a_id}", desired_qty: 5 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { item_a: $.data.id }
            - call: "GET /registries/${r_id}"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /registries/${r_id}/gifts"
              payload: { registry_item_id: "${item_a}", qty: 4, expected_registry_version: "${rv1}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "Registry.${r_id}.completion_pct == 0.8"
            - "Registry.${r_id}.status == COMPLETION_UNLOCKED"

      - name: empty_order_lines_rejected_at_create
        grounds:
          - validations[priority=5]
          - errors[ERR_EMPTY_ORDER]
          - entities.Order.fields.lines
        distinguishing_aspect: "Empty-collection boundary on a different endpoint/metric: POST /orders with lines == [] (zero-length) returns ERR_EMPTY_ORDER (422); metric is collection emptiness, not a numeric threshold."
        test_recipe:
          setup:
            - "Store S; Customer C."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_EMPTY_ORDER"
            - "response.http_status == 422"

  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_blocked_by_sku_insufficient_stock
        grounds:
          - validations[priority=12]
          - errors[ERR_INSUFFICIENT_STOCK]
          - entities.SKU.fields.on_hand_qty
          - entities.SKU.fields.reserved_qty
        distinguishing_aspect: "Order creation validity depends on SKU state: available = on_hand 1 - reserved 0 = 1 < requested qty 2 -> ERR_INSUFFICIENT_STOCK (Order->SKU pair)."
        test_recipe:
          setup:
            - "SKU A on_hand 1, reserved 0; Customer C; Store S."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 5000, initial_on_hand_qty: 1 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 2 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_INSUFFICIENT_STOCK"
            - "response.http_status == 409"

      - name: gift_blocked_by_registry_draft_state
        grounds:
          - validations[priority=6]
          - errors[ERR_REGISTRY_NOT_ACTIVE]
          - entities.Registry.fields.status
        distinguishing_aspect: "RegistryGift creation depends on Registry state: registry is DRAFT (not in {ACTIVE, COMPLETION_UNLOCKED}) so the gift is rejected with ERR_REGISTRY_NOT_ACTIVE (RegistryGift->Registry pair, distinct from Order->SKU)."
        test_recipe:
          setup:
            - "Registry R still DRAFT with item A (SKU A 10000, desired 5) added; not activated."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
            - call: "POST /registries/${r_id}/items"
              payload: { sku_id: "${a_id}", desired_qty: 5 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { item_a: $.data.id }
            - call: "GET /registries/${r_id}"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /registries/${r_id}/gifts"
              payload: { registry_item_id: "${item_a}", qty: 1, expected_registry_version: "${rv1}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_REGISTRY_NOT_ACTIVE"
            - "response.http_status == 409"

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pickup_window_buffer_conflict_same_station
        grounds:
          - validations[priority=11]
          - errors[ERR_PICKUP_SLOT_CONFLICT]
          - entities.Order.fields.pickup_start
          - entities.Order.fields.station_no
        distinguishing_aspect: "Store-station pickup uses half-open intervals plus a 15-min buffer: O1 ends 10:30, O2 starts 10:40 (gap 10 < 15) at the same station -> ERR_PICKUP_SLOT_CONFLICT. Interval semantics = pairwise buffer on Store stations."
        test_recipe:
          setup:
            - "Store S open 09:00-20:00 with 2 stations; SKU A on_hand 100; Order O1 pickup 10:00-10:30 station 1 (booked)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", pickup_station_count: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 5000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o1_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:40:00Z", pickup_end: "2026-07-01T11:00:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_PICKUP_SLOT_CONFLICT"
            - "response.http_status == 409"

      - name: shelf_capacity_overlap_conflict
        grounds:
          - validations[priority=11]
          - errors[ERR_SHELF_CAPACITY_EXCEEDED]
          - entities.ConsignmentShelf.fields.capacity
          - entities.ConsignmentItem.fields.display_start
        distinguishing_aspect: "ConsignmentShelf uses closed date windows with aggregate capacity: capacity-1 shelf already holds CI1 over Jul 1-31; displaying CI2 over Jul 15-Aug 15 overlaps -> 2 > 1 -> ERR_SHELF_CAPACITY_EXCEEDED. Interval semantics = aggregate capacity over closed intervals (distinct from the pickup buffer rule)."
        test_recipe:
          setup:
            - "Store S; OPEN shelf SH capacity 1; consignor C; CI1 (RECEIVED) displayed on SH over 2026-07-01..2026-07-31; CI2 (RECEIVED) not yet displayed."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /stores/${s_id}/consignment-shelves"
              payload: { shelf_code: "SH1", capacity: 1, season: "SPRING_SUMMER" }
              as: StoreStaff
              captures: { sh_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { consignor_customer_id: "${c_id}", store_id: "${s_id}", title: "Coat A", condition: "GOOD", season: "IN_SEASON", list_price_cents: 4000 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ci1_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { consignor_customer_id: "${c_id}", store_id: "${s_id}", title: "Coat B", condition: "GOOD", season: "IN_SEASON", list_price_cents: 4000 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ci2_id: $.data.id }
            - call: "POST /consignment-items/${ci1_id}/display"
              payload: { shelf_id: "${sh_id}", display_start: "2026-07-01T00:00:00Z", display_end: "2026-07-31T00:00:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /consignment-items/${ci2_id}/display"
              payload: { shelf_id: "${sh_id}", display_start: "2026-07-15T00:00:00Z", display_end: "2026-08-15T00:00:00Z" }
              as: StoreStaff
          assert:
            - "response.error_id == ERR_SHELF_CAPACITY_EXCEEDED"
            - "response.http_status == 409"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pay_credit_then_cancel_conserves_store_credit_balance
        grounds:
          - state_machines.Order.RESERVED_to_CANCELLED
          - entities.Customer.fields.store_credit_balance_cents
          - entities.Order.fields.store_credit_applied_cents
        distinguishing_aspect: "Conserved quantity = Customer.store_credit_balance_cents: STORE_CREDIT pay debits store_credit_applied_cents (6000) and cancel refunds exactly 6000, so balance returns to the pre-pay 10000 (balance_after == balance_before)."
        test_recipe:
          setup:
            - "Customer C seeded store_credit 10000; Store S; SKU A base_price 6000 on_hand 100; Order O (line A qty 1, subtotal 6000, BRONZE so no discount, total_before_credit 6000) paid via STORE_CREDIT (balance now 4000)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 6000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", initial_store_credit_cents: 10000 }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/pay"
              payload: { payment_method: "STORE_CREDIT" }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "Order.${o_id}.store_credit_applied_cents == 6000"
            - "Order.${o_id}.payment_status == REFUNDED"
            - "Customer.${c_id}.store_credit_balance_cents == 10000"

      - name: reserve_then_cancel_conserves_sku_inventory
        grounds:
          - state_machines.Order.RESERVED_to_CANCELLED
          - entities.SKU.fields.on_hand_qty
          - entities.SKU.fields.reserved_qty
        distinguishing_aspect: "Conserved quantity = SKU inventory (on_hand_qty, reserved_qty): order create reserves +2 and cancel releases -2 with no WAITLISTED promotion in play, so on_hand stays 5 and reserved_qty returns to 0 — a different conserved quantity than store credit."
        test_recipe:
          setup:
            - "SKU A on_hand 5, reserved 0, no waitlisted special orders; Order O (line A qty 2) created (reserved 2)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 5000, initial_on_hand_qty: 5 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 2 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "SKU.${a_id}.reserved_qty == 0"
            - "SKU.${a_id}.on_hand_qty == 5"
