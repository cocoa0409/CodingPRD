# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: create_permit_application_returns_computed_fields
        claim_type: Creation
        grounds:
          - entities.PermitApplication.fields.application_fee
          - entities.PermitApplication.fields.permit_class
          - entities.PermitApplication.fields.deposit_required
          - entities.PermitApplication.fields.required_coverage_min
        distinguishing_aspect: "POST /permit-applications with all required fields -> 201; permit_class=MEDIUM, application_fee=400.00 (no segments yet), deposit_required=500.00, required_coverage_min=1200000, status=DRAFT, applicant_user_id set to X-User-ID."
        test_recipe:
          setup: ["A venue and applicant exist."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org Z", contact_email: "z@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org Z", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 3000, occupy_start: "2026-06-20T10:00:00Z", occupy_end: "2026-06-20T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { app_id: $.data.id }
          assert:
            - "PermitApplication.${app_id}.status == DRAFT"
            - "PermitApplication.${app_id}.permit_class == MEDIUM"
            - "PermitApplication.${app_id}.application_fee == 400.00"
            - "PermitApplication.${app_id}.deposit_required == 500.00"
            - "PermitApplication.${app_id}.required_coverage_min == 1200000"
            - "PermitApplication.${app_id}.applicant_user_id == ${u}"

      - name: get_application_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /permit-applications/{nonexistent-uuid} -> ERR_APPLICATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /permit-applications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICATION_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_application_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.PermitApplication.fields.expected_attendance, "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "POST /permit-applications omitting expected_attendance is rejected (missing required input); no application created."
        test_recipe:
          setup: ["A venue and applicant exist."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org Y", contact_email: "y@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org Y", venue_id: "${venue_id}", event_kind: "FESTIVAL", occupy_start: "2026-06-21T10:00:00Z", occupy_end: "2026-06-21T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { err: $.data.error_id }
          assert:
            - "response is an error (4xx); no PermitApplication persisted"

      - name: list_applications_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /permit-applications returns response_type=array with pagination fields limit/offset/total_count/has_more present."
        test_recipe:
          setup: ["At least one application exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org X", contact_email: "x@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org X", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 500, occupy_start: "2026-06-22T10:00:00Z", occupy_end: "2026-06-22T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
          trigger:
            - call: "GET /permit-applications"
              payload: { limit: 10, offset: 0 }
              as: PermitOfficer
          assert:
            - "response_type == array; total_count >= 1; has_more is boolean; limit == 10; offset == 0"

      - name: venue_default_setup_buffer_applied
        claim_type: Defaults
        grounds: [entities.Venue.fields.setup_buffer_minutes]
        distinguishing_aspect: "Omitting setup_buffer_minutes on POST /venues -> default 60 applied on the created Venue."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
          assert:
            - "Venue.${venue_id}.setup_buffer_minutes == 60"
            - "Venue.${venue_id}.status == ACTIVE"
            - "Venue.${venue_id}.version == 1"

      - name: closure_schedule_default_min_gap
        claim_type: Defaults
        grounds: [entities.ClosureSchedule.fields.min_gap_minutes]
        distinguishing_aspect: "Omitting min_gap_minutes on POST /closure-schedules -> default 30 applied; status OPEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /closure-schedules"
              payload: { corridor_name: "Q St" }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
          assert:
            - "ClosureSchedule.${sched_id}.min_gap_minutes == 30"
            - "ClosureSchedule.${sched_id}.status == OPEN"

      - name: application_permit_class_large_computed
        claim_type: Computed Fields
        grounds: [calculations.permit_class_derivation, calculations.application_fee_calc, calculations.deposit_calc, calculations.coi_minimum_coverage]
        distinguishing_aspect: "Attendance 8000 -> permit_class LARGE, application_fee 3050.00 (with 4 segments), deposit_required 1500.00, required_coverage_min 1700000. Here tested at create (0 segments): fee 2850.00, deposit 1500.00, coverage 1700000."
        test_recipe:
          setup: ["A large venue and applicant exist."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Big Stadium", venue_type: "STADIUM", max_capacity: 20000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org W", contact_email: "w@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org W", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 8000, occupy_start: "2026-06-23T10:00:00Z", occupy_end: "2026-06-23T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { app_id: $.data.id }
          assert:
            - "PermitApplication.${app_id}.permit_class == LARGE"
            - "PermitApplication.${app_id}.application_fee == 2850.00 (900 base + 4000*0.20 + 3000*0.35, 0 segments)"
            - "PermitApplication.${app_id}.deposit_required == 1500.00"
            - "PermitApplication.${app_id}.required_coverage_min == 1700000"

      - name: create_application_wrong_venue_not_found
        claim_type: Parent Relationships
        grounds: [entities.PermitApplication.fields.venue_id, "errors[ERR_VENUE_NOT_FOUND]"]
        distinguishing_aspect: "POST /permit-applications referencing a non-existent venue_id -> ERR_VENUE_NOT_FOUND (404)."
        test_recipe:
          setup: ["An applicant exists; no venue with the referenced id."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { org_name: "Org V", contact_email: "v@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org V", venue_id: "00000000-0000-0000-0000-000000000000", event_kind: "PARADE", expected_attendance: 500, occupy_start: "2026-06-24T10:00:00Z", occupy_end: "2026-06-24T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VENUE_NOT_FOUND"

      - name: create_application_invalid_time_window_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=17]", "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "POST /permit-applications with occupy_end <= occupy_start -> ERR_INVALID_TIME_WINDOW (422)."
        test_recipe:
          setup: ["A venue and applicant exist."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org U", contact_email: "u@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org U", venue_id: "${venue_id}", event_kind: "PARADE", expected_attendance: 500, occupy_start: "2026-06-25T14:00:00Z", occupy_end: "2026-06-25T10:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_TIME_WINDOW"
            - "HTTP status == 422"

  # ==========================================================================
  - section: state_machines
    instances:
      - name: submit_from_conditionally_approved_returns_not_draft
        claim_type: Invalid Transitions
        grounds: [state_machines.PermitApplication.DRAFT_to_UNDER_REVIEW, "errors[ERR_APPLICATION_NOT_DRAFT]"]
        distinguishing_aspect: "submit-for-review on an already CONDITIONALLY_APPROVED application -> ERR_APPLICATION_NOT_DRAFT (409); status unchanged."
        test_recipe:
          setup: ["A CONDITIONALLY_APPROVED app (all four reviews APPROVED)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "R St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org T", contact_email: "t@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org T", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 3000, occupy_start: "2026-06-26T10:00:00Z", occupy_end: "2026-06-26T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "R 1-4", closure_start: "2026-06-26T09:00:00Z", closure_end: "2026-06-26T15:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${u}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rp: "$.data[0].id", rf: "$.data[1].id", re: "$.data[2].id", rw: "$.data[3].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rp}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rf}/approve"
              payload: { planned_personnel: 2, planned_hours: 6, hourly_rate: 60 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${re}/approve"
              payload: { planned_personnel: 1, planned_hours: 8, hourly_rate: 45 }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "POST /permit-applications/${app_id}/reviews/${rw}/approve"
              payload: { planned_personnel: 3, planned_hours: 4, hourly_rate: 40 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_v_now: $.data.version }
          trigger:
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v_now}" }
              as: Applicant
              as_user_id: "${u}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICATION_NOT_DRAFT"
            - "PermitApplication.${app_id}.status == CONDITIONALLY_APPROVED (unchanged)"

      - name: approve_review_already_approved_returns_not_pending
        claim_type: Idempotency
        grounds: [state_machines.DepartmentReview.PENDING_to_APPROVED, "errors[ERR_REVIEW_NOT_PENDING]"]
        distinguishing_aspect: "A second approve on an already-APPROVED review -> ERR_REVIEW_NOT_PENDING (409)."
        test_recipe:
          setup: ["A submitted app UNDER_REVIEW; POLICE already approved (others still PENDING so app stays UNDER_REVIEW)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "S St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org S", contact_email: "s@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org S", venue_id: "${venue_id}", event_kind: "RALLY", expected_attendance: 3000, occupy_start: "2026-06-27T10:00:00Z", occupy_end: "2026-06-27T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "S 1-4", closure_start: "2026-06-27T09:00:00Z", closure_end: "2026-06-27T15:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${u}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rp: "$.data[0].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rp}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
          trigger:
            - call: "POST /permit-applications/${app_id}/reviews/${rp}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REVIEW_NOT_PENDING"

      - name: finalize_debrief_from_closed_returns_not_open
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CleanupDebrief.OPEN_to_FINALIZED, "errors[ERR_DEBRIEF_NOT_OPEN]"]
        distinguishing_aspect: "A second finalize on an already-FINALIZED debrief -> ERR_DEBRIEF_NOT_OPEN (409); application stays CLOSED."
        test_recipe:
          setup: ["Reuse the depth-2 debrief cascade end-state (app CLOSED, debrief FINALIZED), then finalize again."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PLAZA", max_capacity: 5000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "T St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org R2", contact_email: "r2@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org R2", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 3000, occupy_start: "2026-06-28T10:00:00Z", occupy_end: "2026-06-28T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "T 1-4", closure_start: "2026-06-28T09:00:00Z", closure_end: "2026-06-28T15:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${u}"
            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rp: "$.data[0].id", rf: "$.data[1].id", re: "$.data[2].id", rw: "$.data[3].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rp}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rf}/approve"
              payload: { planned_personnel: 2, planned_hours: 6, hourly_rate: 60 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${re}/approve"
              payload: { planned_personnel: 1, planned_hours: 8, hourly_rate: 45 }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "POST /permit-applications/${app_id}/reviews/${rw}/approve"
              payload: { planned_personnel: 3, planned_hours: 4, hourly_rate: 40 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "POST /permit-applications/${app_id}/coi"
              payload: { carrier: "Acme", coverage_amount: 1200000, expires_at: "2027-01-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { coi_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/coi/${coi_id}/accept"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/deposit"
              payload: { amount: 500 }
              as: Applicant
              as_user_id: "${u}"
            - call: "POST /permit-applications/${app_id}/issue"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/debrief"
              payload: { actual_attendance: 3000, cleanup_charges: 0 }
              as: PermitOfficer
              captures: { debrief_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/debrief/${debrief_id}/finalize"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /permit-applications/${app_id}/debrief/${debrief_id}/finalize"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEBRIEF_NOT_OPEN"
            - "PermitApplication.${app_id}.status == CLOSED (unchanged)"

      - name: application_denied_by_veto_cascade
        claim_type: Cross-entity
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_DENIED
        excluded_because:
          difficulty_instance: transitive_cascade / veto_denies_releases_frees_venue_depth3
          rationale: "The veto->DENIED->segments RELEASED->venue freed cascade is asserted end-to-end by the named §1.8 depth-3 instance."

      - name: quorum_bubble_up_conditionally_approved
        claim_type: Bubble up
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_CONDITIONALLY_APPROVED
        excluded_because:
          difficulty_instance: combinatorial_formula / cost_recovery_round_per_line_then_overhead
          rationale: "The all-four-APPROVED -> parent auto CONDITIONALLY_APPROVED bubble-up plus Invoice creation is asserted by the named §1.8 instance."

  # ==========================================================================
  - section: calculations
    instances:
      - name: deposit_per_head_exceeds_floor
        claim_type: Correct Result
        grounds: [calculations.deposit_calc, entities.PermitApplication.fields.deposit_required]
        distinguishing_aspect: "For LARGE attendance 20000, per_head 0.10*20000=2000 exceeds the 1500 floor, so deposit_required == 2000.00 (max branch selects per-head, not floor)."
        test_recipe:
          setup: ["A stadium venue and applicant."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Mega", venue_type: "STADIUM", max_capacity: 50000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org Q", contact_email: "q@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org Q", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 20000, occupy_start: "2026-06-29T10:00:00Z", occupy_end: "2026-06-29T14:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { app_id: $.data.id }
          assert:
            - "PermitApplication.${app_id}.deposit_required == 2000.00"
            - "PermitApplication.${app_id}.required_coverage_min == 5000000 (capped)"

      - name: coi_coverage_floor_at_base
        claim_type: Constants Applied
        grounds: [calculations.coi_minimum_coverage]
        distinguishing_aspect: "For attendance 500 (<=1000), required_coverage_min floors at COI_BASE 1000000 (no per-head add)."
        test_recipe:
          setup: ["A venue and applicant."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
