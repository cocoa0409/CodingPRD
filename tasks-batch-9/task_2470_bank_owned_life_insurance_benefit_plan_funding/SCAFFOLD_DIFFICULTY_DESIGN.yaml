            - "ExchangeSurrenderAnalysis.${analysis_mec_id}.surrender_charge_usd == 30000.00"
            - "ExchangeSurrenderAnalysis.${analysis_mec_id}.tax_liability_usd == 81000.00"
            - "ExchangeSurrenderAnalysis.${analysis_mec_id}.net_proceeds_usd == 389000.00"

  - rule_id: combinatorial_formula
    instances:
      - name: capacity_tier_break_pinned_single_pass_evaluation
        grounds:
          - calculations.purchase_capacity_headroom
          - entities.PolicyPurchaseRequest.fields.base_ratio_bps
          - entities.PolicyPurchaseRequest.fields.effective_limit_pct
          - entities.PolicyPurchaseRequest.fields.headroom_usd
          - endpoints[GET /purchase-requests/{id}/capacity-projection]
        distinguishing_aspect: |
          Mode (c): the tier that selects effective_limit_pct is derived from base_ratio_bps
          measured against the BASE limit 250000000.00, and the pinned order forbids a second
          pass — at base_ratio_bps 6001 the projection reports effective_limit_pct 0.22 with
          aggregate_limit_usd 220000000.00 while base_ratio_bps stays 6001, not the 6819 a
          re-derivation against the narrowed limit would produce.
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00, so base_limit_usd is 250000000.00."
            - "No policies and no reserved premium anywhere, so committed_usd is 0.00."
            - "Carrier Sentinel with one GENERAL product (single_carrier_limit_bps 1500)."
            - "Two DRAFT purchase requests on that carrier: one with single_premium_usd 150000000.00 (base_ratio_bps exactly at TIER_1_BREAK_BPS) and one with 150012500.00 (one basis point past it)."
          setup_api_calls:
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-06-30T00:00:00Z", tier1_capital_usd: 1000000000.00, total_assets_usd: 12000000000.00 }
              as: TreasuryController
              captures: { cap_sn_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Sentinel Mutual Life", naic_code: "63333", am_best_rating: "A_PLUS", statutory_surplus_usd: 400000000.00, domicile_state: "IA" }
              as: PlatformAdmin
              captures: { carrier_sn_id: $.data.id }
            - call: "POST /product-types"
              payload: { carrier_id: "${carrier_sn_id}", product_name: "Sentinel GA BOLI", account_type: "GENERAL", mec_status: "NON_MEC", disclosed_me_charge_bps: 20, guaranteed_min_crediting_bps: 100 }
              as: PlatformAdmin
              captures: { prod_sn_ga_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Mara Quinn", employee_number: "E-3001", annual_salary_usd: 3000000.00, officer_flag: true }
              as: BenefitsAnalyst
              captures: { emp_quinn_id: $.data.id }
            - call: "POST /purchase-requests"
              payload: { carrier_id: "${carrier_sn_id}", product_type_id: "${prod_sn_ga_id}", employee_id: "${emp_quinn_id}", single_premium_usd: 150000000.00, face_amount_usd: 180000000.00, requested_effective_date: "2026-08-15T00:00:00Z" }
              as: BenefitsAnalyst
              captures: { pr_at_break_id: $.data.id }
            - call: "POST /purchase-requests"
              payload: { carrier_id: "${carrier_sn_id}", product_type_id: "${prod_sn_ga_id}", employee_id: "${emp_quinn_id}", single_premium_usd: 150012500.00, face_amount_usd: 180000000.00, requested_effective_date: "2026-08-15T00:00:00Z" }
              as: BenefitsAnalyst
              captures: { pr_past_break_id: $.data.id }
          trigger:
            - call: "GET /purchase-requests/${pr_at_break_id}/capacity-projection"
              payload: {}
              as: TreasuryController
            - call: "GET /purchase-requests/${pr_past_break_id}/capacity-projection"
              payload: {}
              as: TreasuryController
          assert:
            - "first trigger response data.committed_usd == 0.00"
            - "first trigger response data.base_limit_usd == 250000000.00"
            - "first trigger response data.prospective_usd == 150000000.00"
            - "first trigger response data.base_ratio_bps == 6000"
            - "first trigger response data.effective_limit_pct == 0.25"
            - "first trigger response data.aggregate_limit_usd == 250000000.00"
            - "first trigger response data.headroom_usd == 100000000.00"
            - "first trigger response data.carrier_concentration_bps == 1500"
            - "first trigger response data.single_carrier_limit_bps == 1500"
            - "second trigger response data.base_ratio_bps == 6001"
            - "second trigger response data.effective_limit_pct == 0.22"
            - "second trigger response data.aggregate_limit_usd == 220000000.00"
            - "second trigger response data.headroom_usd == 69987500.00"
            - "second trigger response data.base_ratio_bps != 6819 (no second pass against the narrowed aggregate limit)"
            - "second trigger response data.carrier_concentration_bps == 1500"
            - "PolicyPurchaseRequest.${pr_at_break_id}.status == DRAFT"
            - "PolicyPurchaseRequest.${pr_at_break_id}.headroom_usd == 0.00"

      - name: beneficiary_split_round_then_sum_signed_residual
        grounds:
          - calculations.death_benefit_split
          - entities.BeneficiaryAllocation.fields.gross_amount_usd
          - entities.DeathBenefitClaim.fields.survivor_entitlement_usd
          - state_machines.DeathBenefitClaim.distribution_status.NOT_STARTED_to_ALLOCATED
          - endpoints[POST /death-claims/{id}/seal-allocations]
        distinguishing_aspect: |
          Mode (b): survivor_entitlement_usd 3015000.08 is split 3333/3333/3334 bps by rounding
          each allocation to 2 decimals FIRST (1004899.53 + 1004899.53 + 1005201.03 = 3015000.09),
          then applying the NEGATIVE residual -0.01 to the greatest-bps allocation, which lands at
          1005201.02 — summing the unrounded shares and rounding the total would never produce a
          negative residual to place.
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00."
            - "Carrier Ironbridge AUTHORIZED with an APPROVED 2026 diligence review and one GENERAL NON_MEC product."
            - "Employee Okafor, officer, annual_salary_usd 2000000.00, with an EXECUTED consent covering 2026-08-01..2027-07-31."
            - "One policy for Okafor with face_amount_usd 5000000.00, single_premium_usd 1000000.00, issued 2026-08-15."
