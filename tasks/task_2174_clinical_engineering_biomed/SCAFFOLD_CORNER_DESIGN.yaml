            - "first attempt: Device.${dev_id}.security_state == UNASSESSED"
            - "SecurityFinding.${sf_id}.remediation_due_at == 2026-10-30T00:00:00.000Z"
            - "after resolve: SecurityFinding.${sf_id}.status == ACCEPTED_RISK"
            - "second attempt: HTTP status == 200 and Device.${dev_id}.security_state == ASSESSED_OK"
            - "Device.${dev_id}.operational_state == IN_SERVICE throughout (a MEDIUM finding never downs a unit)"

