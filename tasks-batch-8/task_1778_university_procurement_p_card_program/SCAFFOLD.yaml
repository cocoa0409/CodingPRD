# =============================================================================
# task_1778 — University Procurement & P-Card Program — Seed Tables (v1)
# =============================================================================

scenario: |
  University Procurement & P-Card Program (university purchasing office): requisition-to-PO workflow & approval thresholds, competitive bid/sole-source justification, contract review & terms negotiation, supplier diversity & sustainability goals, P-card issuance, limits & transaction reconciliation, grant-funded purchase allowability check, receiving/three-way match & invoice exception, surplus property disposal

domain_name: university-procurement
api_prefix: /

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - rate_threshold_triggers        # approval-chain tiers, P-card limits, bid threshold
    - cascading_side_effects         # contract terminate / vendor suspend / cycle close
    - derived_field_reconciliation   # grant ledger, card utilization, PO match posture
    - optimistic_concurrency         # OCC on Requisition / Contract / PCard versions
    - version_pinning_on_approval    # approval chain snapshot at submit; PO pins contract version
  entity_topology: flat              # peer entities joined by FK references, no URL nesting for ownership
  state_machine_shape: compound      # cyclic (Requisition, Contract), parallel dims (PurchaseOrder), guarded (grant/vendor gates)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # requester may not approve own requisition nor resolve own invoice exceptions
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Department display name" }
      - { name: cost_center, type: string, source: input, description: "Cost center code" }
      - { name: diversity_goal_pct, type: number, source: input, description: "Supplier-diversity spend goal as a fraction (e.g. 0.25)" }
      - { name: sustainability_goal_pct, type: number, source: input, description: "Sustainability spend goal as a fraction" }
      - { name: default_approval_limit_cents, type: integer, source: input, description: "Delegated authority ceiling applied at the DEPARTMENT approval step for requisitions of this department" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor legal name" }
      - { name: diversity_certification, type: enum, source: input, default: NONE, description: "NONE | WBE | MBE | DBE | VBE | SBE", constraints: "enum members: NONE, WBE, MBE, DBE, VBE, SBE" }
      - { name: sustainability_tier, type: enum, source: input, default: NONE, description: "NONE | BRONZE | SILVER | GOLD", constraints: "enum members: NONE, BRONZE, SILVER, GOLD" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Net payment terms in days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "initial ACTIVE; SUSPENDED via suspend; reinstated via reinstate" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: grant_code, type: string, source: input, description: "Sponsor award/grant code" }
      - { name: sponsor, type: string, source: input, description: "Sponsor organization name" }
      - { name: total_award_cents, type: integer, source: input, description: "Total awarded amount in cents" }
      - { name: f_and_a_rate, type: number, source: input, description: "Facilities & administrative (indirect cost) rate, e.g. 0.52" }
      - { name: equipment_cap_cents, type: integer, source: input, default: 500000, description: "Per-unit capitalization threshold: a line whose unit_price_cents is strictly greater is equipment excluded from the indirect base" }
      - { name: allowed_categories, type: array, source: input, description: "Array of allowable cost_category values: SUPPLIES | EQUIPMENT | TRAVEL | SERVICES | SOFTWARE" }
      - { name: budget_start, type: datetime, source: input, description: "Budget period start (inclusive), compared against the logical clock" }
      - { name: budget_end, type: datetime, source: input, description: "Budget period end (inclusive), compared against the logical clock" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "initial ACTIVE; CLOSED terminal" }
      - { name: spent_cents, type: integer, source: computed, description: "Settled charges: grant PO charges whose invoice is PAID, plus reconciled GRANT-allocation P-card debits (minus reversals)" }
      - { name: encumbered_cents, type: integer, source: computed, description: "Outstanding encumbrances: charge_cents of grant-funded Requisitions in APPROVED or PO_ISSUED whose PO is not fully paid and not CANCELLED" }
      - { name: provisional_remaining_cents, type: integer, source: computed, description: "Forward-looking variant: total_award_cents - spent_cents - encumbered_cents" }
      - { name: settled_remaining_cents, type: integer, source: computed, description: "Settled variant: total_award_cents - spent_cents (ignores encumbrances)" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; contract counterparty" }
      - { name: commodity_code, type: string, source: input, description: "Commodity code covered; exclusivity scope is (vendor_id, commodity_code)" }
      - { name: value_cents, type: integer, source: input, description: "Contract value ceiling in cents" }
      - { name: effective_start, type: datetime, source: input, description: "Effective period start (inclusive)" }
      - { name: effective_end, type: datetime, source: input, description: "Effective period end (exclusive) — half-open [start, end)" }
      - { name: terms_text, type: string, source: input, description: "Current negotiated terms text" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | IN_NEGOTIATION | REVIEW_APPROVED | EXECUTED | TERMINATED | SUPERSEDED", constraints: "initial DRAFT; TERMINATED and SUPERSEDED terminal" }
      - { name: negotiation_round, type: integer, source: computed, description: "Starts 0; increments by 1 on every UNDER_REVIEW -> IN_NEGOTIATION transition" }
      - { name: supersedes_contract_id, type: string, source: system, description: "Id of the Contract this amendment replaces when it executes; null on base contracts (reference to Contract.id, not a navigational FK)" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of EXECUTED transition; null until executed" }
      - { name: terminated_reason, type: string, source: system, description: "Reason recorded at termination; null otherwise" }

  - name: Requisition
    parent: null
    common_fields: true
    fields:
      - { name: requisition_number, type: string, source: system, description: "Human-readable sequential number RQ-000001 minted at creation" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning department" }
      - { name: requester_id, type: string, source: input, description: "Opaque id of the creating Requester (X-User-ID); ownership anchor for edit/submit/cancel and segregation-of-duties checks" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; suggested vendor (null while a competitive solicitation is pending award)" }
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; when set the requisition is grant-funded (null otherwise)" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; when set the purchase rides an existing contract (sourcing_method EXISTING_CONTRACT)" }
      - { name: lines, type: array, source: input, description: "Array of line objects {commodity_code, description, quantity, unit_price_cents, cost_category}; line_no assigned by array index starting at 0; cost_category enum SUPPLIES | EQUIPMENT | TRAVEL | SERVICES | SOFTWARE" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over lines of quantity * unit_price_cents (integer arithmetic, no rounding)" }
      - { name: has_grant_funding, type: boolean, source: computed, description: "true iff grant_id is set" }
      - { name: charge_cents, type: integer, source: computed, description: "Amount chargeable to the funding source: total_cents when ungrant-funded; for grant-funded requisitions total_cents + indirect per grant_charge calculation; computed at submit and re-computed on each resubmit" }
      - { name: sole_source_requested, type: boolean, source: input, default: false, description: "Requester asks to waive competition" }
      - { name: sole_source_justification, type: string, source: input, description: "Required non-empty when sole_source_requested is true and total_cents >= 500000" }
      - { name: sole_source_approved, type: boolean, source: system, default: false, description: "Set true when the SOLE_SOURCE chain step is approved; never reset once set" }
      - { name: sourcing_method, type: enum, source: computed, description: "EXISTING_CONTRACT when contract_id set at submit; SOLE_SOURCE when sole_source step approved; COMPETITIVE_BID when a solicitation is awarded; otherwise UNDETERMINED", constraints: "enum members: UNDETERMINED, EXISTING_CONTRACT, SOLE_SOURCE, COMPETITIVE_BID" }
      - { name: required_chain, type: array, source: computed, description: "Version-pinned snapshot of required approval step roles computed at submit per approval_chain_resolution; array of step codes DEPARTMENT | GRANT_COMPLIANCE | SOLE_SOURCE | PURCHASING | DIRECTOR | CONTRACT_REVIEW" }
      - { name: current_step_index, type: integer, source: computed, description: "Index into required_chain of the step currently awaiting decision; 0 at submit" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | APPROVED | PO_ISSUED | CANCELLED", constraints: "initial DRAFT; PO_ISSUED and CANCELLED terminal" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent submit; used by the anti-splitting rolling window" }
      - { name: returned_reason, type: string, source: system, description: "Reason supplied on the most recent return-step or cascade return; null otherwise" }

  - name: ApprovalRecord
    parent: null
    common_fields: false
    fields:
      - { name: requisition_id, type: string, source: system, description: "FK -> Requisition.id; the requisition this audit record belongs to" }
      - { name: step_index, type: integer, source: system, description: "Chain index this decision applied to" }
      - { name: step_role, type: string, source: system, description: "Chain step code decided (DEPARTMENT | GRANT_COMPLIANCE | SOLE_SOURCE | PURCHASING | DIRECTOR | CONTRACT_REVIEW)" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the deciding user (opaque operator id)" }
      - { name: decision, type: enum, source: system, description: "APPROVED | RETURNED", constraints: "enum members: APPROVED, RETURNED" }
      - { name: reason, type: string, source: system, description: "Return reason when decision is RETURNED; null otherwise" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decision" }

  - name: BidSolicitation
    parent: null
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: system, description: "FK -> Requisition.id; at most one non-CANCELLED solicitation per requisition" }
      - { name: response_deadline, type: datetime, source: input, description: "Quotes accepted while logical clock < response_deadline" }
      - { name: min_quotes, type: integer, source: input, default: 3, description: "Minimum eligible quotes required to award without an override_reason" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | AWARDED | CANCELLED", constraints: "initial OPEN; AWARDED and CANCELLED terminal" }
      - { name: awarded_quote_id, type: string, source: system, description: "Id of the awarded Quote; null until AWARDED (reference to Quote.id, not a navigational FK)" }
      - { name: awarded_at, type: datetime, source: system, description: "Logical-clock timestamp of award; null until AWARDED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: solicitation_id, type: string, source: system, description: "FK -> BidSolicitation.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; bidding vendor" }
      - { name: price_cents, type: integer, source: input, description: "Quoted total price in cents; must be > 0" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp at submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | AWARDED | NOT_AWARDED | DISQUALIFIED", constraints: "initial SUBMITTED; AWARDED/NOT_AWARDED/DISQUALIFIED terminal" }
      - { name: score, type: number, source: computed, description: "Weighted award score computed at solicitation close per award_score calculation; null before close" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: po_number, type: string, source: system, description: "Human-readable sequential number PO-000001 minted at issue" }
      - { name: requisition_id, type: string, source: system, description: "FK -> Requisition.id; source requisition" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; copied from requisition at issue" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; copied from requisition when present, else null" }
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; copied from requisition when present, else null" }
      - { name: lines, type: array, source: system, description: "Pinned copy of requisition lines at issue {line_no, commodity_code, description, quantity, unit_price_cents, cost_category}" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over pinned lines quantity * unit_price_cents" }
      - { name: charge_cents, type: integer, source: computed, description: "Copied from requisition.charge_cents at issue; the amount the grant ledger settles on first PAID invoice" }
      - { name: contract_version_pinned, type: integer, source: computed, description: "Contract.version observed at issue; null when contract_id is null" }
      - { name: fulfillment_status, type: enum, source: system, description: "ISSUED | PARTIALLY_RECEIVED | FULLY_RECEIVED | CANCELLED — parallel dimension 1, driven by receipts", constraints: "initial ISSUED; FULLY_RECEIVED and CANCELLED terminal" }
      - { name: match_status, type: enum, source: computed, description: "UNMATCHED | MATCHED | EXCEPTION | CLOSED — parallel dimension 2, derived from invoices and contract/receipt cascades", constraints: "UNMATCHED while no invoice exists; EXCEPTION while any invoice is EXCEPTION or a contract-termination flag is set; MATCHED when at least one invoice is PAYABLE or PAID and none is EXCEPTION; CLOSED when the PO is CANCELLED" }
      - { name: contract_terminated_flag, type: boolean, source: system, default: false, description: "Set true by the contract-termination cascade; forces match_status EXCEPTION regardless of invoices" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issue; used by diversity committed-basis reporting" }

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: system, description: "FK -> PurchaseOrder.id" }
      - { name: lines, type: array, source: input, description: "Array of {line_no, quantity}; quantity must be > 0; cumulative POSTED quantities per line may not exceed the PO line quantity" }
      - { name: received_by, type: string, source: system, description: "X-User-ID of the ReceivingClerk (opaque operator id)" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of posting" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED", constraints: "initial POSTED; VOIDED terminal" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: system, description: "FK -> PurchaseOrder.id" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; copied from the PO at creation" }
      - { name: invoice_number, type: string, source: input, description: "Supplier invoice number" }
      - { name: lines, type: array, source: input, description: "Array of {line_no, quantity, unit_price_cents}; line_no must exist on the PO" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over invoice lines of quantity * unit_price_cents" }
      - { name: total_variance_cents, type: integer, source: computed, description: "Sum of per-line price variances v_i per three_way_match; 0 when status had no price evaluation" }
      - { name: total_tolerance_cents, type: integer, source: computed, description: "Sum of per-line rounded tolerances t_i per three_way_match (rounding order pinned: round each t_i to integer cents BEFORE summing)" }
      - { name: status, type: enum, source: system, description: "PAYABLE | EXCEPTION | PAID | REJECTED", constraints: "set by the three-way match at creation; PAID and REJECTED terminal" }
      - { name: exception_reason, type: enum, source: system, description: "NONE | NO_RECEIPT | QTY_OVER_RECEIPT | PRICE_VARIANCE | CONTRACT_TERMINATED | RECEIPT_VOIDED; single highest-priority reason per three_way_match reason precedence", constraints: "enum members: NONE, NO_RECEIPT, QTY_OVER_RECEIPT, PRICE_VARIANCE, CONTRACT_TERMINATED, RECEIPT_VOIDED" }
      - { name: variance_accepted_by, type: string, source: system, description: "X-User-ID of the APClerk who accepted variance on resolve-exception; null otherwise" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment; null until PAID; used by diversity paid-basis reporting" }

  - name: PCard
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; issuing department" }
      - { name: cardholder_name, type: string, source: input, description: "Cardholder display name" }
      - { name: single_txn_limit_cents, type: integer, source: input, description: "Per-transaction debit ceiling (amount <= limit is allowed)" }
      - { name: monthly_limit_cents, type: integer, source: input, description: "Statement-cycle utilization ceiling (utilization + new debit <= limit is allowed)" }
      - { name: allowed_mccs, type: array, source: input, description: "Array of allowed merchant category code strings; empty array means no MCC restriction" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "initial ACTIVE; CLOSED terminal" }
      - { name: cycle_index, type: integer, source: system, description: "Statement-cycle counter; starts 0; increments on close-cycle" }
      - { name: consecutive_unreconciled_cycles, type: integer, source: system, description: "Count of consecutive closed cycles that contained unreconciled debits; reset to 0 by a clean close and by reinstate" }
      - { name: utilization_cents, type: integer, source: computed, description: "Current-cycle utilization per pcard_utilization: sum of DEBIT amounts in cycle_index with status POSTED, RECONCILED or DISPUTED, minus sum of CREDIT amounts in cycle_index not REVERSED; may go negative" }
      - { name: available_credit_cents, type: integer, source: computed, description: "monthly_limit_cents - utilization_cents" }

  - name: LimitElevation
    parent: null
    common_fields: true
    fields:
      - { name: pcard_id, type: string, source: system, description: "FK -> PCard.id" }
      - { name: elevated_single_txn_limit_cents, type: integer, source: input, description: "Temporary single-transaction limit during the window" }
      - { name: window_start, type: datetime, source: input, description: "Window start (inclusive); must be strictly before window_end" }
      - { name: window_end, type: datetime, source: input, description: "Window end (exclusive) — half-open [window_start, window_end)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED", constraints: "initial SCHEDULED; CANCELLED terminal; effectiveness is clock-evaluated (no EXPIRED state)" }

  - name: PCardTransaction
    parent: null
    common_fields: true
    fields:
      - { name: pcard_id, type: string, source: system, description: "FK -> PCard.id" }
      - { name: amount_cents, type: integer, source: input, description: "Transaction magnitude in cents; must be > 0 for both DEBIT and CREDIT" }
      - { name: entry_type, type: enum, source: input, description: "DEBIT | CREDIT (CREDIT is a merchant refund)", constraints: "enum members: DEBIT, CREDIT" }
      - { name: merchant_name, type: string, source: input, description: "Merchant descriptor (free text; not a Vendor reference)" }
      - { name: mcc_code, type: string, source: input, description: "Merchant category code; must be in card.allowed_mccs when that array is non-empty" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp of posting" }
      - { name: cycle_index, type: integer, source: system, description: "Card cycle_index captured at posting" }
      - { name: status, type: enum, source: system, description: "POSTED | RECONCILED | DISPUTED | REVERSED", constraints: "DEBIT starts POSTED; CREDIT starts RECONCILED; REVERSED terminal" }
      - { name: pre_dispute_status, type: enum, source: system, description: "POSTED | RECONCILED — status to restore on MERCHANT_FAVOR dispute resolution; null unless DISPUTED" }
      - { name: receipt_reference, type: string, source: system, description: "Receipt handle recorded at reconcile; null until reconciled" }
      - { name: allocation_type, type: enum, source: system, description: "GENERAL | GRANT — set at reconcile", constraints: "enum members: GENERAL, GRANT" }
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; required at reconcile when allocation_type is GRANT; null otherwise" }
      - { name: cost_category, type: enum, source: system, description: "SUPPLIES | EQUIPMENT | TRAVEL | SERVICES | SOFTWARE — set at reconcile; checked against grant.allowed_categories for GRANT allocations" }
      - { name: reconciled_at, type: datetime, source: system, description: "Logical-clock timestamp of reconciliation; null until reconciled" }

  - name: SurplusAsset
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "University asset tag" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning department" }
      - { name: description, type: string, source: input, description: "Asset description" }
      - { name: condition, type: enum, source: input, description: "NEW | GOOD | FAIR | POOR", constraints: "enum members: NEW, GOOD, FAIR, POOR" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Estimated fair value; drives sale floor and high-value role gating" }
      - { name: disposal_cost_cents, type: integer, source: input, default: 0, description: "Cost of disposal recoverable from proceeds before sharing" }
      - { name: status, type: enum, source: system, description: "DECLARED | LISTED | TRANSFERRED | SOLD | DONATED | SCRAPPED", constraints: "initial DECLARED; TRANSFERRED, SOLD, DONATED, SCRAPPED terminal" }
      - { name: declared_at, type: datetime, source: system, description: "Logical-clock timestamp of declaration; redistribution window is [declared_at, declared_at + 10 days)" }
      - { name: claiming_department_id, type: string, source: system, description: "FK -> Department.id; department that claimed the asset during redistribution; null unless TRANSFERRED" }
      - { name: sale_price_cents, type: integer, source: system, description: "Actual sale price; null unless SOLD" }
      - { name: buyer_name, type: string, source: system, description: "Buyer name recorded at sale; null unless SOLD" }
      - { name: recipient_name, type: string, source: system, description: "Recipient recorded at donation; null unless DONATED" }
      - { name: proceeds_cost_recovery_cents, type: integer, source: computed, description: "Waterfall bucket 1: min(disposal_cost_cents, sale_price_cents); null unless SOLD" }
      - { name: proceeds_dept_share_cents, type: integer, source: computed, description: "Waterfall bucket 2: round_half_up(0.50 * (sale_price_cents - proceeds_cost_recovery_cents)); null unless SOLD" }
      - { name: proceeds_central_share_cents, type: integer, source: computed, description: "Waterfall bucket 3: remainder = sale_price_cents - proceeds_cost_recovery_cents - proceeds_dept_share_cents (rounding remainder lands here); null unless SOLD" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Vendor
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/suspend"
        actor: ProcurementAdmin
        preconditions:
          - "Vendor is ACTIVE (ERR_VENDOR_STATE_INVALID)"
        side_effects:
          - "Every Quote with vendor_id == this vendor in status SUBMITTED whose solicitation is OPEN or CLOSED -> DISQUALIFIED"
          - "Each BidSolicitation in AWARDED whose awarded quote was just DISQUALIFIED -> CANCELLED"
          - "Each Requisition referenced by such a CANCELLED solicitation and currently SUBMITTED -> RETURNED with returned_reason VENDOR_SUSPENDED (approval progress discarded)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendors/{id}/reinstate"
        actor: ProcurementAdmin
        preconditions:
          - "Vendor is SUSPENDED (ERR_VENDOR_STATE_INVALID)"
        side_effects: []
        note: "Reinstatement does NOT resurrect DISQUALIFIED quotes or CANCELLED solicitations."

  - entity: Grant
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /grants/{id}/suspend"
        actor: GrantOfficer
        preconditions:
          - "Grant is ACTIVE (ERR_GRANT_STATE_INVALID)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /grants/{id}/reinstate"
        actor: GrantOfficer
        preconditions:
          - "Grant is SUSPENDED (ERR_GRANT_STATE_INVALID)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /grants/{id}/close"
        actor: GrantOfficer
        preconditions:
          - "Grant is ACTIVE (ERR_GRANT_STATE_INVALID)"
          - "encumbered_cents == 0 (ERR_GRANT_HAS_OPEN_ENCUMBRANCES)"
        side_effects: []

  - entity: Contract
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /contracts/{id}/submit-review"
        actor: ContractOfficer
        preconditions:
          - "Contract is DRAFT or IN_NEGOTIATION (ERR_CONTRACT_STATE_INVALID)"
        side_effects: []
      - from: IN_NEGOTIATION
        to: UNDER_REVIEW
        trigger: "POST /contracts/{id}/submit-review"
        actor: ContractOfficer
        preconditions:
          - "Contract is DRAFT or IN_NEGOTIATION (ERR_CONTRACT_STATE_INVALID)"
        side_effects: []
        note: "Resubmission after a negotiation round; the UNDER_REVIEW -> IN_NEGOTIATION -> UNDER_REVIEW cycle is the negotiation loop."
      - from: UNDER_REVIEW
        to: IN_NEGOTIATION
        trigger: "POST /contracts/{id}/negotiate"
        actor: ContractOfficer
        preconditions:
          - "Contract is UNDER_REVIEW (ERR_CONTRACT_STATE_INVALID)"
        side_effects:
          - "negotiation_round += 1"
      - from: UNDER_REVIEW
        to: REVIEW_APPROVED
        trigger: "POST /contracts/{id}/approve-review"
        actor: ContractOfficer
        preconditions:
          - "Contract is UNDER_REVIEW (ERR_CONTRACT_STATE_INVALID)"
        side_effects: []
      - from: REVIEW_APPROVED
        to: EXECUTED
        trigger: "POST /contracts/{id}/execute"
        actor: ProcurementDirector
        preconditions:
          - "Contract is REVIEW_APPROVED (ERR_CONTRACT_STATE_INVALID)"
          - "Vendor.status == ACTIVE (ERR_VENDOR_SUSPENDED)"
          - "effective_start < effective_end (ERR_INVALID_REQUEST)"
          - "No other EXECUTED Contract with same (vendor_id, commodity_code) whose half-open period overlaps this one, excluding the contract named by supersedes_contract_id (ERR_CONTRACT_OVERLAP)"
        side_effects:
          - "executed_at = logical clock"
          - "If supersedes_contract_id is set, that Contract (must be EXECUTED, else ERR_CONTRACT_STATE_INVALID) -> SUPERSEDED"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: ProcurementDirector
        preconditions:
          - "Contract is EXECUTED (ERR_CONTRACT_STATE_INVALID)"
        side_effects:
          - "terminated_reason recorded"
          - "Every PurchaseOrder with contract_id == this contract and fulfillment_status in {ISSUED, PARTIALLY_RECEIVED} gets contract_terminated_flag = true (match_status recomputes to EXCEPTION)"
          - "Every Invoice on such a PurchaseOrder in status PAYABLE -> EXCEPTION with exception_reason CONTRACT_TERMINATED (its PO's flag change is the direct cause)"
          - "Every Requisition with contract_id == this contract in status APPROVED (not yet PO_ISSUED) -> RETURNED with returned_reason CONTRACT_TERMINATED (caused by the contract termination itself)"
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system (an amendment contract naming this contract in supersedes_contract_id executes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Requisition
    field: status
    initial_state: DRAFT
    terminal_states: [PO_ISSUED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /requisitions/{id}/submit"
        actor: Requester
        preconditions:
          - "Requisition is DRAFT or RETURNED (ERR_REQUISITION_NOT_SUBMITTABLE)"
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
          - "lines non-empty, quantity > 0 and unit_price_cents >= 0 per line (ERR_INVALID_REQUEST)"
          - "If grant_id set: Grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE); every line cost_category in grant.allowed_categories (ERR_GRANT_CATEGORY_NOT_ALLOWABLE); budget_start <= clock <= budget_end (ERR_GRANT_BUDGET_PERIOD_EXPIRED)"
          - "If sole_source_requested and total_cents >= 500000: sole_source_justification non-empty (ERR_SOLE_SOURCE_JUSTIFICATION_REQUIRED); if sole_source_requested and total_cents < 500000: ERR_INVALID_REQUEST (sole source not applicable)"
          - "If contract_id set: Contract.status == EXECUTED (ERR_CONTRACT_NOT_EXECUTED)"
          - "If vendor_id set: Vendor.status == ACTIVE (ERR_VENDOR_SUSPENDED)"
          - "Anti-splitting: if contract_id is null and vendor_id is set and total_cents < 2500000, the sum of total_cents over this department's requisitions to the same vendor with submitted_at in [clock - 30 days, clock] and status in {SUBMITTED, APPROVED, PO_ISSUED}, plus this requisition's total_cents, must be < 2500000 (ERR_BID_SPLITTING_DETECTED)"
        side_effects:
          - "submitted_at = logical clock"
          - "required_chain recomputed and pinned per approval_chain_resolution; current_step_index = 0"
          - "charge_cents recomputed per grant_charge"
          - "If contract_id set: sourcing_method = EXISTING_CONTRACT"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /requisitions/{id}/submit"
        actor: Requester
        preconditions:
          - "Same as DRAFT -> SUBMITTED"
        side_effects:
          - "Same as DRAFT -> SUBMITTED (chain snapshot and charge recomputed; earlier ApprovalRecords are retained as audit)"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /requisitions/{id}/approve-step (not the last chain step)"
        actor: "DepartmentApprover | GrantOfficer | Buyer | ProcurementDirector | ContractOfficer (must match required_chain[current_step_index])"
        preconditions:
          - "Requisition is SUBMITTED (ERR_REQUISITION_NOT_IN_APPROVAL)"
          - "Acting role == required_chain[current_step_index] role (ERR_APPROVAL_STEP_MISMATCH)"
          - "actor X-User-ID != requester_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "DEPARTMENT step: department.default_approval_limit_cents >= total_cents (ERR_APPROVER_LIMIT_EXCEEDED)"
          - "PURCHASING step sourcing gate: if total_cents >= 2500000 and contract_id is null and sole_source_approved is false, an AWARDED BidSolicitation for this requisition must exist (ERR_SOURCING_REQUIRED)"
        side_effects:
          - "ApprovalRecord appended (decision APPROVED)"
          - "If step is SOLE_SOURCE: sole_source_approved = true and sourcing_method = SOLE_SOURCE"
          - "current_step_index += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /requisitions/{id}/approve-step (last chain step)"
        actor: "role matching required_chain[current_step_index]"
        preconditions:
          - "Same as step-advance transition"
          - "If grant_id set: grant.provisional_remaining_cents >= charge_cents (ERR_GRANT_BUDGET_EXCEEDED)"
        side_effects:
          - "ApprovalRecord appended (decision APPROVED)"
          - "If grant_id set: grant.encumbered_cents += charge_cents (recompute Grant derived fields)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /requisitions/{id}/return-step"
        actor: "role matching required_chain[current_step_index]"
        preconditions:
          - "Requisition is SUBMITTED (ERR_REQUISITION_NOT_IN_APPROVAL)"
          - "Acting role == required_chain[current_step_index] role (ERR_APPROVAL_STEP_MISMATCH)"
          - "actor X-User-ID != requester_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "ApprovalRecord appended (decision RETURNED with reason)"
          - "returned_reason = reason; current_step_index reset happens at resubmit"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /requisitions/{id}/cancel"
        actor: Requester
        preconditions:
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
          - "Requisition is DRAFT, RETURNED or APPROVED (ERR_REQUISITION_NOT_CANCELLABLE)"
        side_effects: []
      - from: RETURNED
        to: CANCELLED
        trigger: "POST /requisitions/{id}/cancel"
        actor: Requester
        preconditions:
          - "Same as DRAFT -> CANCELLED"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /requisitions/{id}/cancel"
        actor: Requester
        preconditions:
          - "Same as DRAFT -> CANCELLED"
        side_effects:
          - "If grant_id set: grant.encumbered_cents -= charge_cents (encumbrance released)"
      - from: APPROVED
        to: PO_ISSUED
        trigger: "POST /requisitions/{id}/issue-po"
        actor: Buyer
        preconditions:
          - "Requisition is APPROVED (ERR_REQUISITION_NOT_APPROVED)"
          - "vendor_id is set (ERR_SOURCING_REQUIRED when total_cents >= 2500000 without award/contract/sole-source — enforced earlier; here vendor presence is the check)"
          - "If contract_id set: Contract.status == EXECUTED (ERR_CONTRACT_NOT_EXECUTED) and effective_start <= clock < effective_end (ERR_CONTRACT_EXPIRED)"
        side_effects:
          - "PurchaseOrder created: lines pinned from requisition, charge_cents copied, contract_version_pinned = contract.version when contract_id set, issued_at = clock"
          - "Grant encumbrance unchanged (encumbrance transfers conceptually from requisition to PO)"

  - entity: BidSolicitation
    field: status
    initial_state: OPEN
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /solicitations/{id}/close"
        actor: Buyer
        preconditions:
          - "Solicitation is OPEN (ERR_SOLICITATION_NOT_OPEN)"
          - "logical clock >= response_deadline (ERR_SOLICITATION_DEADLINE_NOT_PASSED)"
        side_effects:
          - "score computed for every Quote per award_score (including DISQUALIFIED ones, which are then excluded from the eligible pool)"
      - from: CLOSED
        to: AWARDED
        trigger: "POST /solicitations/{id}/award"
        actor: ProcurementDirector
        preconditions:
          - "Solicitation is CLOSED (ERR_SOLICITATION_NOT_CLOSED)"
          - "Eligible pool = quotes in SUBMITTED whose vendor is ACTIVE; pool non-empty (ERR_NO_ELIGIBLE_QUOTES)"
          - "Eligible pool size >= min_quotes OR override_reason provided (ERR_INSUFFICIENT_QUOTES)"
          - "If quote_id provided and differs from the computed winner per award_score selector, override_reason is required (ERR_AWARD_NOT_TOP_SCORE)"
        side_effects:
          - "Winning Quote -> AWARDED; all other SUBMITTED quotes -> NOT_AWARDED"
          - "awarded_quote_id and awarded_at set"
          - "Requisition.vendor_id = winning quote's vendor_id; sourcing_method = COMPETITIVE_BID"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /solicitations/{id}/cancel or system (vendor suspension cascade)"
        actor: Buyer
        preconditions:
          - "Solicitation is OPEN or CLOSED (ERR_SOLICITATION_NOT_CANCELLABLE)"
        side_effects:
          - "All SUBMITTED quotes -> NOT_AWARDED"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /solicitations/{id}/cancel"
        actor: Buyer
        preconditions:
          - "Solicitation is OPEN or CLOSED (ERR_SOLICITATION_NOT_CANCELLABLE)"
        side_effects:
          - "All SUBMITTED quotes -> NOT_AWARDED"
      - from: AWARDED
        to: CANCELLED
        trigger: "system (vendor suspension cascade disqualifies the awarded quote)"
        actor: system
        preconditions: []
        side_effects:
          - "Referenced requisition in SUBMITTED -> RETURNED with returned_reason VENDOR_SUSPENDED"

  - entity: Quote
    field: status
    initial_state: SUBMITTED
    terminal_states: [AWARDED, NOT_AWARDED, DISQUALIFIED]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "system (solicitation award)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: NOT_AWARDED
        trigger: "system (solicitation award to another quote, or solicitation cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "system (vendor suspended while solicitation OPEN or CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWARDED
        to: DISQUALIFIED
        trigger: "system (vendor suspended after award)"
        actor: system
        preconditions: []
        side_effects:
          - "Owning solicitation AWARDED -> CANCELLED (cascade hop)"

  - entity: PurchaseOrder
    field: fulfillment_status
    initial_state: ISSUED
    terminal_states: [FULLY_RECEIVED, CANCELLED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_RECEIVED
        trigger: "POST /purchase-orders/{id}/receipts (some line still short of ordered quantity)"
        actor: ReceivingClerk
        preconditions:
          - "fulfillment_status is ISSUED or PARTIALLY_RECEIVED (ERR_PO_NOT_RECEIVABLE)"
          - "Per line: cumulative POSTED receipt quantity + new quantity <= ordered quantity (ERR_OVER_RECEIPT)"
        side_effects:
          - "fulfillment_status recomputed: FULLY_RECEIVED iff every line's cumulative POSTED quantity == ordered quantity, else PARTIALLY_RECEIVED"
      - from: PARTIALLY_RECEIVED
        to: FULLY_RECEIVED
        trigger: "POST /purchase-orders/{id}/receipts (completes all lines)"
        actor: ReceivingClerk
        preconditions:
          - "Same as ISSUED -> PARTIALLY_RECEIVED"
        side_effects: []
      - from: ISSUED
        to: PARTIALLY_RECEIVED
        trigger: "system (receipt void drops a fully-received PO back)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Void can also move FULLY_RECEIVED -> PARTIALLY_RECEIVED (see FULLY_RECEIVED -> PARTIALLY_RECEIVED)."
      - from: FULLY_RECEIVED
        to: PARTIALLY_RECEIVED
        trigger: "system (receipt void)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: Buyer
        preconditions:
          - "fulfillment_status == ISSUED and no POSTED receipts exist and no invoices exist (ERR_PO_NOT_CANCELLABLE)"
        side_effects:
          - "match_status -> CLOSED"
          - "If grant_id set: grant.encumbered_cents -= charge_cents"
          - "Source requisition PO_ISSUED -> APPROVED (re-issue becomes possible)"
      - from: ISSUED
        to: ISSUED
        trigger: "system (contract termination flag)"
        actor: system
        preconditions: []
        side_effects:
          - "contract_terminated_flag = true; match_status recomputes to EXCEPTION"
        note: "Parallel dimensions: receipts mutate fulfillment_status only; invoices/cascades mutate match_status only (except receipt void, which re-matches open invoices)."

  - entity: Receipt
    field: status
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /receipts/{id}/void"
        actor: ReceivingClerk
        preconditions:
          - "Receipt is POSTED (ERR_RECEIPT_NOT_VOIDABLE)"
        side_effects:
          - "PO fulfillment_status recomputed from remaining POSTED receipts (ISSUED iff none remain)"
          - "Every Invoice on the PO in status PAYABLE is re-matched; if any line's invoiced quantity now exceeds cumulative POSTED received quantity, invoice -> EXCEPTION with exception_reason RECEIPT_VOIDED"

  - entity: Invoice
    field: status
    initial_state: PAYABLE
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: PAYABLE
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: APClerk
        preconditions:
          - "Invoice is PAYABLE (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "paid_at = logical clock"
          - "If PO.grant_id set: grant.encumbered_cents -= po.charge_cents; grant.spent_cents += po.charge_cents"
          - "PO match_status recomputes (MATCHED)"
      - from: EXCEPTION
        to: PAYABLE
        trigger: "POST /invoices/{id}/resolve-exception with action ACCEPT_VARIANCE"
        actor: APClerk
        preconditions:
          - "Invoice is EXCEPTION (ERR_INVOICE_NOT_RESOLVABLE)"
          - "actor X-User-ID != source requisition.requester_id (ERR_SELF_RESOLUTION_FORBIDDEN)"
          - "Re-run of the three-way match against current POSTED receipts and PO prices passes (else invoice stays EXCEPTION)"
        side_effects:
          - "variance_accepted_by = actor X-User-ID"
          - "PO match_status recomputes"
      - from: EXCEPTION
        to: REJECTED
        trigger: "POST /invoices/{id}/resolve-exception with action REJECT_INVOICE"
        actor: APClerk
        preconditions:
          - "Invoice is EXCEPTION (ERR_INVOICE_NOT_RESOLVABLE)"
          - "actor X-User-ID != source requisition.requester_id (ERR_SELF_RESOLUTION_FORBIDDEN)"
        side_effects:
          - "PO match_status recomputes (a new invoice may now be created for the PO)"
      - from: PAYABLE
        to: EXCEPTION
        trigger: "system (receipt void re-match failure, or contract termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "exception_reason set to RECEIPT_VOIDED or CONTRACT_TERMINATED"
          - "PO match_status recomputes (EXCEPTION)"

  - entity: PCard
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pcards/{id}/suspend or system (close-cycle escalation)"
        actor: ProcurementAdmin
        preconditions:
          - "Card is ACTIVE (ERR_CARD_STATE_INVALID)"
        side_effects:
          - "Every LimitElevation of this card in SCHEDULED -> CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pcards/{id}/reinstate"
        actor: ProcurementAdmin
        preconditions:
          - "Card is SUSPENDED (ERR_CARD_STATE_INVALID)"
        side_effects:
          - "consecutive_unreconciled_cycles = 0"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /pcards/{id}/close"
        actor: ProcurementAdmin
        preconditions:
          - "Card is ACTIVE or SUSPENDED (ERR_CARD_STATE_INVALID)"
          - "No transactions in POSTED or DISPUTED (ERR_CARD_HAS_OPEN_TRANSACTIONS)"
        side_effects:
          - "Every LimitElevation in SCHEDULED -> CANCELLED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /pcards/{id}/close"
        actor: ProcurementAdmin
        preconditions:
          - "Same as ACTIVE -> CLOSED"
        side_effects:
          - "Every LimitElevation in SCHEDULED -> CANCELLED"

  - entity: LimitElevation
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pcard-elevations/{id}/cancel or system (card suspend/close cascade)"
        actor: ProcurementAdmin
        preconditions:
          - "Elevation is SCHEDULED (ERR_ELEVATION_STATE_INVALID)"
        side_effects: []

  - entity: PCardTransaction
    field: status
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: RECONCILED
        trigger: "POST /pcard-transactions/{id}/reconcile"
        actor: Cardholder
        preconditions:
          - "Transaction is POSTED (ERR_TXN_NOT_RECONCILABLE)"
          - "Card.status != CLOSED (ERR_CARD_CLOSED)"
          - "X-User-ID == pcard_id of the owning card (ERR_NOT_RESOURCE_OWNER)"
          - "receipt_reference non-empty (ERR_INVALID_REQUEST)"
          - "If allocation_type == GRANT: grant_id required and exists; Grant ACTIVE (ERR_GRANT_NOT_ACTIVE); cost_category in grant.allowed_categories (ERR_GRANT_CATEGORY_NOT_ALLOWABLE); budget period covers clock (ERR_GRANT_BUDGET_PERIOD_EXPIRED); grant.provisional_remaining_cents >= amount_cents (ERR_GRANT_BUDGET_EXCEEDED)"
        side_effects:
          - "receipt_reference, allocation_type, grant_id, cost_category, reconciled_at recorded"
          - "If allocation_type == GRANT: grant.spent_cents += amount_cents"
      - from: POSTED
        to: DISPUTED
        trigger: "POST /pcard-transactions/{id}/dispute"
        actor: Cardholder
        preconditions:
          - "Transaction is POSTED or RECONCILED (ERR_TXN_NOT_DISPUTABLE)"
          - "Card.status != CLOSED (ERR_CARD_CLOSED)"
          - "X-User-ID == pcard_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "pre_dispute_status = current status"
          - "Utilization unchanged: DISPUTED debits remain in utilization_cents"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /pcard-transactions/{id}/dispute"
        actor: Cardholder
        preconditions:
          - "Same as POSTED -> DISPUTED"
        side_effects:
          - "pre_dispute_status = RECONCILED"
      - from: DISPUTED
        to: REVERSED
        trigger: "POST /pcard-transactions/{id}/resolve-dispute with outcome CARDHOLDER_FAVOR"
        actor: ProcurementAdmin
        preconditions:
          - "Transaction is DISPUTED (ERR_TXN_NOT_DISPUTED)"
        side_effects:
          - "utilization_cents -= amount_cents (REVERSED debits leave utilization)"
          - "If pre_dispute_status == RECONCILED and allocation_type == GRANT: grant.spent_cents -= amount_cents (compensation)"
      - from: DISPUTED
        to: POSTED
        trigger: "POST /pcard-transactions/{id}/resolve-dispute with outcome MERCHANT_FAVOR and pre_dispute_status == POSTED"
        actor: ProcurementAdmin
        preconditions:
          - "Transaction is DISPUTED (ERR_TXN_NOT_DISPUTED)"
        side_effects:
          - "pre_dispute_status cleared; transaction must still be reconciled"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /pcard-transactions/{id}/resolve-dispute with outcome MERCHANT_FAVOR and pre_dispute_status == RECONCILED"
        actor: ProcurementAdmin
        preconditions:
          - "Transaction is DISPUTED (ERR_TXN_NOT_DISPUTED)"
        side_effects:
          - "pre_dispute_status cleared"

  - entity: SurplusAsset
    field: status
    initial_state: DECLARED
    terminal_states: [TRANSFERRED, SOLD, DONATED, SCRAPPED]
    transitions:
      - from: DECLARED
        to: TRANSFERRED
        trigger: "POST /surplus-assets/{id}/claim"
        actor: Requester
        preconditions:
          - "Asset is DECLARED (ERR_SURPLUS_NOT_CLAIMABLE)"
          - "logical clock < declared_at + 10 days (ERR_REDISTRIBUTION_WINDOW_EXPIRED)"
          - "claiming_department_id != asset.department_id (ERR_SELF_CLAIM_FORBIDDEN)"
        side_effects:
          - "claiming_department_id recorded; no proceeds are created"
      - from: DECLARED
        to: LISTED
        trigger: "POST /surplus-assets/{id}/list-for-sale"
        actor: SurplusManager
        preconditions:
          - "Asset is DECLARED (ERR_SURPLUS_NOT_LISTABLE)"
          - "logical clock >= declared_at + 10 days (ERR_REDISTRIBUTION_WINDOW_ACTIVE)"
        side_effects: []
      - from: LISTED
        to: SOLD
        trigger: "POST /surplus-assets/{id}/sell"
        actor: "SurplusManager | ProcurementDirector"
        preconditions:
          - "Asset is LISTED (ERR_SURPLUS_NOT_SELLABLE)"
          - "sale_price_cents >= max(2500, round_half_up(0.40 * estimated_value_cents)) (ERR_SALE_PRICE_BELOW_FLOOR)"
          - "If estimated_value_cents >= 5000000 the acting role must be ProcurementDirector (ERR_HIGH_VALUE_SALE_REQUIRES_DIRECTOR)"
        side_effects:
          - "Proceeds waterfall per surplus_proceeds_waterfall: proceeds_cost_recovery_cents, proceeds_dept_share_cents, proceeds_central_share_cents computed and stored"
      - from: LISTED
        to: DONATED
        trigger: "POST /surplus-assets/{id}/donate"
        actor: SurplusManager
        preconditions:
          - "Asset is LISTED (ERR_SURPLUS_NOT_DONATABLE)"
        side_effects:
          - "recipient_name recorded; no proceeds"
      - from: DECLARED
        to: SCRAPPED
        trigger: "POST /surplus-assets/{id}/scrap"
        actor: SurplusManager
        preconditions:
          - "Asset is DECLARED or LISTED (ERR_SURPLUS_NOT_SCRAPPABLE)"
        side_effects: []
      - from: LISTED
        to: SCRAPPED
        trigger: "POST /surplus-assets/{id}/scrap"
        actor: SurplusManager
        preconditions:
          - "Asset is DECLARED or LISTED (ERR_SURPLUS_NOT_SCRAPPABLE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; see SKILL.md §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: requisition-edit-stale-version
    parent_entity: Requisition
    write_endpoint: "PATCH /requisitions/{id}"
    occ_field: expected_requisition_version
    description: |
      Editing a Requisition whose version has advanced since the client last
      observed it (e.g., an approver acted, which bumps version) is rejected.
      The client must re-read and resubmit against the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-amend-stale-version
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/amend"
    occ_field: expected_contract_version
    description: |
      Creating an amendment against a Contract whose version has advanced since
      the client last observed it is rejected. A prior amendment created against
      the same contract legitimately supersedes the client's view, so the second
      create is refused with a stale-version error rather than producing two
      competing amendment drafts.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pcard-limit-stale-version
    parent_entity: PCard
    write_endpoint: "PATCH /pcards/{id}/limits"
    occ_field: expected_pcard_version
    description: |
      Changing P-card limits against a card whose version has advanced since the
      client last observed it (e.g., a close-cycle or another limits change
      bumped the version) is rejected; the client must re-read the card first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: requisition_total
    trigger: "requisition create, PATCH, and submit (charge recompute)"
    algorithm: aggregation
    formula: |
      total_cents = SUM over lines of (quantity * unit_price_cents)
      Integer arithmetic throughout; no rounding.
    input_set: "All lines on the requisition (any status)."
    precision: "integer cents"

  - name: approval_chain_resolution
    trigger: "requisition submit (DRAFT->SUBMITTED and RETURNED->SUBMITTED); snapshot pinned on required_chain"
    algorithm: threshold
    formula: |
      chain = [DEPARTMENT]
      if has_grant_funding:                chain.append(GRANT_COMPLIANCE)
      if sole_source_requested and total_cents >= T1:  chain.append(SOLE_SOURCE)
      if total_cents >= T1:                chain.append(PURCHASING)
      if total_cents >= T2:                chain.append(DIRECTOR)
      if total_cents >= T3:                chain.append(CONTRACT_REVIEW)
      # Thresholds are INCLUSIVE (>=). total_cents == 500000 exactly includes PURCHASING.
    input_set: "The requisition being submitted: total_cents, has_grant_funding, sole_source_requested."
    constants:
      T1_PURCHASING_CENTS: 500000      # $5,000
      T2_DIRECTOR_CENTS: 2500000       # $25,000 (== BID_THRESHOLD)
      T3_CONTRACT_REVIEW_CENTS: 10000000  # $100,000
    precision: "integer cents; inclusive thresholds"

  - name: grant_charge
    trigger: "requisition submit for grant-funded requisitions (stored on charge_cents)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED; each step depends on the previous:
      # (1) classify lines: equipment_excluded_cents = SUM over lines where
      #     cost_category == EQUIPMENT and unit_price_cents > equipment_cap_cents
      #     (STRICTLY greater; unit_price == cap is NOT excluded)
      #     of quantity * unit_price_cents
      # (2) direct_cents = total_cents
      # (3) indirect_cents = round_half_up(f_and_a_rate * (direct_cents - equipment_excluded_cents))
      # (4) charge_cents = direct_cents + indirect_cents
      # The allowability/budget check at final approval compares charge_cents
      # (NOT direct_cents) against grant.provisional_remaining_cents.
    input_set: "Grant-funded requisition lines; grant constants f_and_a_rate and equipment_cap_cents."
    constants:
      DEFAULT_EQUIPMENT_CAP_CENTS: 500000
    precision: "integer cents; round_half_up at step (3) only"

  - name: grant_budget_ledger
    trigger: "requisition final approval / cancel from APPROVED / PO cancel / invoice pay / pcard GRANT reconcile / pcard reversal"
    algorithm: aggregation
    formula: |
      spent_cents      = SUM of po.charge_cents over grant POs whose invoice is PAID
                       + SUM of reconciled GRANT-allocation DEBIT pcard amounts (REVERSED ones subtract back)
      encumbered_cents = SUM of charge_cents over grant Requisitions in APPROVED (encumber)
                       + SUM of po.charge_cents over grant POs not CANCELLED whose invoice is not PAID
      # i.e. encumbrance attaches at requisition approval, persists through PO issue,
      # and is released by PO cancel, requisition cancel-from-APPROVED, or invoice pay.
      provisional_remaining_cents = total_award_cents - spent_cents - encumbered_cents
      settled_remaining_cents     = total_award_cents - spent_cents
      INVARIANT (conserved): spent_cents + encumbered_cents + provisional_remaining_cents == total_award_cents
    input_set: "Grant requisitions in APPROVED or PO_ISSUED, grant POs not CANCELLED, PAID invoices, reconciled/REVERSED GRANT pcard transactions."
    precision: "integer cents"
    variants:
      - name: provisional
        when: "allowability checks (final approval, pcard reconcile) and forward planning"
        difference: "subtracts encumbered_cents in addition to spent_cents; equals settled only when nothing is encumbered"
      - name: settled
        when: "financial reporting of actually-incurred spend"
        difference: "subtracts only spent_cents; identical inputs yield a higher remaining whenever encumbrances exist"

  - name: three_way_match
    trigger: "invoice creation (POST /purchase-orders/{id}/invoices) and re-match on receipt void / resolve-exception"
    algorithm: tiered_pricing
    formula: |
      # (0) If the PO has no POSTED receipts at all: status EXCEPTION, reason NO_RECEIPT. Stop.
      # For each invoice line i (evaluated in line_no ASC):
      #   received_qty(i) = SUM of POSTED receipt quantities for line_no i
      #   if i.quantity > received_qty(i): line fails QTY_OVER_RECEIPT
      #   v_i = abs(i.unit_price_cents - po_line.unit_price_cents) * i.quantity
      #   t_i = round_half_up(MATCH_TOL_PCT * po_line.unit_price_cents * i.quantity)   # round PER LINE first
      #   if v_i > t_i: line fails PRICE_VARIANCE
      # Rounding order is PINNED: each t_i is rounded to integer cents BEFORE any summation.
      # total_variance_cents  = SUM(v_i)   (over all lines)
      # total_tolerance_cents = SUM(t_i)   (sum of already-rounded per-line tolerances)
      # Aggregate rule: if no per-line failure but total_variance_cents > total_tolerance_cents
      #   -> EXCEPTION with reason PRICE_VARIANCE.
      # Reason precedence (single exception_reason): NO_RECEIPT > QTY_OVER_RECEIPT > PRICE_VARIANCE;
      #   within a reason, the lowest failing line_no decides.
      # All lines clean and aggregate within tolerance -> PAYABLE, exception_reason NONE.
    input_set: "Invoice lines, pinned PO lines, POSTED receipts only (VOIDED excluded)."
    constants:
      MATCH_TOL_PCT: 0.02
    precision: "integer cents; per-line round_half_up before summation"

  - name: award_score
    trigger: "solicitation close (score computation) and award (winner selection)"
    algorithm: weighted_scoring
    formula: |
      # At close, for every quote q (any status at that moment):
      #   eligible(q): q.status == SUBMITTED and q.vendor.status == ACTIVE at award time
      #   price_score(q) = 100 * min_price / q.price_cents
      #     where min_price = minimum price_cents over quotes eligible AT CLOSE
      #     (SUBMITTED and vendor ACTIVE at close; pinned then, not re-derived later)
      #   diversity_points(q)  = 100 if vendor.diversity_certification != NONE else 0
      #   sustainability_points(q) = GOLD 100 | SILVER 60 | BRONZE 30 | NONE 0
      #   score(q) = round_half_up(W_PRICE * price_score + W_DIV * diversity_points + W_SUS * sustainability_points, 2 decimals)
      # Winner selector (deterministic): among eligible quotes, highest score;
      #   tie-break 1: earliest submitted_at (logical clock);
      #   tie-break 2: earliest created_at (wall). id is NEVER used.
    input_set: "Quotes of the solicitation; vendor certification/tier at close."
    constants:
      W_PRICE: 0.70
      W_DIVERSITY: 0.20
      W_SUSTAINABILITY: 0.10
      DEFAULT_MIN_QUOTES: 3
    precision: "2 decimal places, round_half_up, applied once at the end"

  - name: pcard_utilization
    trigger: "transaction post, reconcile, dispute, dispute resolution, close-cycle"
    algorithm: aggregation
    formula: |
      utilization_cents = SUM(amount_cents of DEBIT txns with cycle_index == card.cycle_index
                              and status in {POSTED, RECONCILED, DISPUTED})
                        - SUM(amount_cents of CREDIT txns with cycle_index == card.cycle_index
                              and status in {POSTED, RECONCILED, DISPUTED})
      available_credit_cents = monthly_limit_cents - utilization_cents
      # DISPUTED debits REMAIN in utilization (conservative). REVERSED txns leave utilization.
      # CREDIT refunds reduce utilization; utilization may go negative.
      # Posting gate for DEBIT: amount_cents <= effective_single_limit (elevation-aware)
      #   AND utilization_cents + amount_cents <= monthly_limit_cents  (INCLUSIVE boundary).
      INVARIANT (conserved): utilization_cents + available_credit_cents == monthly_limit_cents
    input_set: "Transactions of the card in the current cycle_index."
    precision: "integer cents"

  - name: effective_single_txn_limit
    trigger: "DEBIT transaction posting"
    algorithm: threshold
    formula: |
      active = the unique LimitElevation of the card with status SCHEDULED
               and window_start <= clock < window_end  (half-open; at most one can exist
               because elevation windows may not overlap and must keep a 7-day gap)
      effective_single_limit = active.elevated_single_txn_limit_cents if active else card.single_txn_limit_cents
      # Boundary: clock == window_start uses the ELEVATED limit; clock == window_end uses the BASE limit.
    input_set: "SCHEDULED elevations of the card; logical clock."
    precision: "integer cents"

  - name: reconciliation_aging
    trigger: "POST /pcards/{id}/close-cycle (ops-run checkpoint)"
    algorithm: threshold
    formula: |
      unreconciled = COUNT of DEBIT txns with cycle_index == card.cycle_index
                     and status in {POSTED, DISPUTED}
      if unreconciled > 0: consecutive_unreconciled_cycles += 1
      else:                consecutive_unreconciled_cycles = 0
      if consecutive_unreconciled_cycles >= SUSPEND_AFTER:  # INCLUSIVE threshold
        card -> SUSPENDED (cascade: SCHEDULED elevations -> CANCELLED)
      cycle_index += 1  (new cycle starts; old-cycle txns leave utilization)
    input_set: "Transactions of the closing cycle."
    constants:
      SUSPEND_AFTER: 2
    precision: "integer counts"

  - name: diversity_spend_ratio
    trigger: "GET /departments/{id}/diversity-report"
    algorithm: aggregation
    formula: |
      # basis == COMMITTED (default window: issued_at <= clock):
      #   total_spend   = SUM(total_cents) over POs of the department with fulfillment_status != CANCELLED
      #   diverse_spend = same set restricted to vendors with diversity_certification != NONE
      # basis == PAID (default window: paid_at <= clock):
      #   total_spend   = SUM(total_cents) over PAID invoices whose PO belongs to the department
      #   diverse_spend = same set restricted to diverse vendors
      # ratio = round_half_up(diverse_spend / total_spend, 4 decimals); total_spend == 0 -> ratio 0.0000
      # goal_met = ratio >= department.diversity_goal_pct
    input_set: "POs (committed) or PAID invoices (paid) of the department; optional [window_start, window_end] inclusive bounds on issued_at / paid_at."
    precision: "4 decimal places, round_half_up"
    variants:
      - name: committed
        when: "default; measures issued-PO commitment"
        difference: "counts POs at issue regardless of payment; identical data yields a HIGHER diverse share than paid when diverse-vendor invoices are unpaid"
      - name: paid
        when: "basis=PAID; measures settled spend"
        difference: "counts invoices only once PAID; same underlying purchases yield different ratio until invoices are paid"

  - name: anti_split_aggregate
    trigger: "requisition submit when contract_id is null and vendor_id set and total_cents < BID_THRESHOLD"
    algorithm: aggregation
    formula: |
      window = [clock - 30 days, clock]  (INCLUSIVE both ends, over submitted_at)
      rolling_sum = SUM(total_cents) over requisitions with same department_id and vendor_id,
                    status in {SUBMITTED, APPROVED, PO_ISSUED}, submitted_at in window
      if rolling_sum + this.total_cents >= BID_THRESHOLD:  # INCLUSIVE: equality triggers
        reject ERR_BID_SPLITTING_DETECTED
      # Requisitions riding a contract (contract_id set) never enter the sum and never trigger the check.
    input_set: "Same-department, same-vendor requisitions in window; DRAFT, RETURNED and CANCELLED excluded."
    constants:
      BID_THRESHOLD_CENTS: 2500000
      WINDOW_DAYS: 30
    precision: "integer cents"

  - name: surplus_proceeds_waterfall
    trigger: "POST /surplus-assets/{id}/sell (on success)"
    algorithm: waterfall_allocation
    formula: |
      cost_recovery = min(disposal_cost_cents, sale_price_cents)
      remainder     = sale_price_cents - cost_recovery
      dept_share    = round_half_up(DEPT_SHARE_PCT * remainder)      # rounding happens HERE
      central_share = remainder - dept_share                          # rounding remainder lands in central
      # Conserved: cost_recovery + dept_share + central_share == sale_price_cents
    input_set: "The sold asset's sale_price_cents and disposal_cost_cents."
    constants:
      DEPT_SHARE_PCT: 0.50
      MIN_SALE_FLOOR_CENTS: 2500
      EST_VALUE_FLOOR_PCT: 0.40
      HIGH_VALUE_SALE_CENTS: 5000000
    precision: "integer cents; round_half_up on dept_share only"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's allowed role set"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids (department_id, vendor_id, grant_id, contract_id, claiming_department_id) exist"
    error_id: "ERR_DEPARTMENT_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_REQUISITION_NOT_FOUND | ERR_SOLICITATION_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_PO_NOT_FOUND | ERR_RECEIPT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_PCARD_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_ELEVATION_NOT_FOUND | ERR_SURPLUS_ASSET_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body resource references"
  - priority: 4
    category: auth
    check: "Ownership: requester_id == X-User-ID on requisition PATCH/submit/cancel; pcard_id == X-User-ID on cardholder transaction operations"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "PATCH /requisitions/{id}, POST /requisitions/{id}/submit, POST /requisitions/{id}/cancel, POST /pcards/{id}/transactions, POST /pcard-transactions/{id}/reconcile, POST /pcard-transactions/{id}/dispute"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /requisitions/{id}, POST /contracts/{id}/amend, PATCH /pcards/{id}/limits"
  - priority: 6
    category: state
    check: "Lifecycle preconditions of the target resource (per §1.2), including approval step-role match on approve-step/return-step"
    error_id: "ERR_REQUISITION_NOT_SUBMITTABLE | ERR_REQUISITION_NOT_EDITABLE | ERR_REQUISITION_NOT_IN_APPROVAL | ERR_REQUISITION_NOT_CANCELLABLE | ERR_REQUISITION_NOT_APPROVED | ERR_APPROVAL_STEP_MISMATCH | ERR_CONTRACT_STATE_INVALID | ERR_SOLICITATION_NOT_OPEN | ERR_SOLICITATION_NOT_CLOSED | ERR_SOLICITATION_NOT_CANCELLABLE | ERR_PO_NOT_RECEIVABLE | ERR_PO_NOT_CANCELLABLE | ERR_PO_NOT_INVOICABLE | ERR_PO_INVOICING_CLOSED | ERR_RECEIPT_NOT_VOIDABLE | ERR_INVOICE_NOT_RESOLVABLE | ERR_INVOICE_NOT_PAYABLE | ERR_CARD_STATE_INVALID | ERR_CARD_NOT_ACTIVE | ERR_CARD_CLOSED | ERR_CARD_HAS_OPEN_TRANSACTIONS | ERR_TXN_NOT_RECONCILABLE | ERR_TXN_NOT_DISPUTABLE | ERR_TXN_NOT_DISPUTED | ERR_SURPLUS_NOT_CLAIMABLE | ERR_SURPLUS_NOT_LISTABLE | ERR_SURPLUS_NOT_SELLABLE | ERR_SURPLUS_NOT_DONATABLE | ERR_SURPLUS_NOT_SCRAPPABLE | ERR_GRANT_STATE_INVALID | ERR_VENDOR_STATE_INVALID | ERR_ELEVATION_STATE_INVALID"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance and segregation of duties: approver != requester; invoice-exception resolver != requester; surplus claimer != owning department; grant category allowability; grant budget period; MCC restriction; sole-source justification completeness"
    error_id: "ERR_SELF_APPROVAL_FORBIDDEN | ERR_SELF_RESOLUTION_FORBIDDEN | ERR_SELF_CLAIM_FORBIDDEN | ERR_GRANT_CATEGORY_NOT_ALLOWABLE | ERR_GRANT_BUDGET_PERIOD_EXPIRED | ERR_MCC_NOT_ALLOWED | ERR_SOLE_SOURCE_JUSTIFICATION_REQUIRED"
    http_status: "403 for the three SELF errors; 422 for the rest"
    applies_to: "approve-step, return-step, resolve-exception, claim, submit, reconcile, transaction post"
  - priority: 8
    category: business_temporal
    check: "Clock-driven rules: solicitation quote window and close deadline, contract effective period at issue-po, redistribution window on claim/list-for-sale, anti-splitting 30-day rolling aggregate"
    error_id: "ERR_SOLICITATION_EXPIRED | ERR_SOLICITATION_DEADLINE_NOT_PASSED | ERR_CONTRACT_EXPIRED | ERR_REDISTRIBUTION_WINDOW_EXPIRED | ERR_REDISTRIBUTION_WINDOW_ACTIVE | ERR_BID_SPLITTING_DETECTED"
    http_status: 409
    applies_to: "quotes, close, award, issue-po, claim, list-for-sale, submit"
  - priority: 9
    category: business_constraint
    check: "Structural constraints: contract period exclusivity, elevation window overlap and 7-day gap, one quote per vendor per solicitation, sourcing gate at PURCHASING step, eligible-quote pool and top-score rules at award, over-receipt, invoice line existence, elevation/limit consistency, grant close encumbrance"
    error_id: "ERR_CONTRACT_OVERLAP | ERR_ELEVATION_OVERLAP | ERR_ELEVATION_GAP_VIOLATION | ERR_DUPLICATE_QUOTE | ERR_SOURCING_REQUIRED | ERR_NO_ELIGIBLE_QUOTES | ERR_INSUFFICIENT_QUOTES | ERR_AWARD_NOT_TOP_SCORE | ERR_OVER_RECEIPT | ERR_INVOICE_LINE_UNKNOWN | ERR_LIMIT_INCONSISTENT | ERR_GRANT_HAS_OPEN_ENCUMBRANCES | ERR_SOLICITATION_NOT_ALLOWED | ERR_SOLICITATION_ALREADY_EXISTS"
    http_status: 409
    applies_to: "execute, elevations, quotes, approve-step, award, receipts, invoices, pcard create/limits, grant close"
  - priority: 10
    category: business_referential
    check: "Referenced-entity status: vendor ACTIVE for submit/quote/execute; grant ACTIVE for submit/reconcile; contract EXECUTED at submit and issue-po"
    error_id: "ERR_VENDOR_SUSPENDED | ERR_GRANT_NOT_ACTIVE | ERR_CONTRACT_NOT_EXECUTED"
    http_status: 409
    applies_to: "submit, quotes, execute, reconcile"
  - priority: 11
    category: business_fiscal
    check: "Money ceilings: department delegated limit at DEPARTMENT step, grant provisional remaining at final approval and GRANT reconcile, P-card single-transaction and monthly limits, surplus sale floor and high-value role gate"
    error_id: "ERR_APPROVER_LIMIT_EXCEEDED | ERR_GRANT_BUDGET_EXCEEDED | ERR_SINGLE_TXN_LIMIT_EXCEEDED | ERR_MONTHLY_LIMIT_EXCEEDED | ERR_SALE_PRICE_BELOW_FLOOR | ERR_HIGH_VALUE_SALE_REQUIRES_DIRECTOR"
    http_status: "422; ERR_GRANT_BUDGET_EXCEEDED is 402; ERR_HIGH_VALUE_SALE_REQUIRES_DIRECTOR is 403"
    applies_to: "approve-step, reconcile, transaction post, sell"
  - priority: 12
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, quantity/amount positive, effective_start < effective_end, window_start < window_end, limit within pagination bounds"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_PAGINATION_PARAMETERS"
    http_status: 400
    applies_to: "all"
    note: "Shape validation is listed last here because malformed bodies never reach business checks; implementations may short-circuit earlier but must never return a business error for a malformed body."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, or X-User-Role is not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint (including surplus high-value sales by SurplusManager use ERR_HIGH_VALUE_SALE_REQUIRES_DIRECTOR instead)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "X-User-ID does not match the owning requester_id / pcard_id" }
  # --- existence (404) ---
  - { id: ERR_DEPARTMENT_NOT_FOUND, http: 404, condition: "department_id does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "vendor_id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "grant_id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract_id does not exist" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "requisition id does not exist" }
  - { id: ERR_SOLICITATION_NOT_FOUND, http: 404, condition: "solicitation id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "quote id does not exist" }
  - { id: ERR_PO_NOT_FOUND, http: 404, condition: "purchase order id does not exist" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "receipt id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_PCARD_NOT_FOUND, http: 404, condition: "pcard id does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "pcard transaction id does not exist" }
  - { id: ERR_ELEVATION_NOT_FOUND, http: 404, condition: "limit elevation id does not exist" }
  - { id: ERR_SURPLUS_ASSET_NOT_FOUND, http: 404, condition: "surplus asset id does not exist" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  # --- lifecycle state (409) ---
  - { id: ERR_REQUISITION_NOT_SUBMITTABLE, http: 409, condition: "submit requires DRAFT or RETURNED" }
  - { id: ERR_REQUISITION_NOT_EDITABLE, http: 409, condition: "PATCH requires DRAFT or RETURNED" }
  - { id: ERR_REQUISITION_NOT_IN_APPROVAL, http: 409, condition: "approve-step/return-step require SUBMITTED" }
  - { id: ERR_REQUISITION_NOT_CANCELLABLE, http: 409, condition: "cancel requires DRAFT, RETURNED or APPROVED (not SUBMITTED, not terminal)" }
  - { id: ERR_REQUISITION_NOT_APPROVED, http: 409, condition: "issue-po requires APPROVED" }
  - { id: ERR_APPROVAL_STEP_MISMATCH, http: 409, condition: "Acting role does not match required_chain[current_step_index]" }
  - { id: ERR_CONTRACT_STATE_INVALID, http: 409, condition: "Contract transition invalid for current state" }
  - { id: ERR_SOLICITATION_NOT_OPEN, http: 409, condition: "Quote submission or close requires OPEN" }
  - { id: ERR_SOLICITATION_NOT_CLOSED, http: 409, condition: "Award requires CLOSED" }
  - { id: ERR_SOLICITATION_NOT_CANCELLABLE, http: 409, condition: "Cancel requires OPEN or CLOSED (AWARDED only via vendor-suspension cascade)" }
  - { id: ERR_PO_NOT_RECEIVABLE, http: 409, condition: "Receipt requires fulfillment ISSUED or PARTIALLY_RECEIVED" }
  - { id: ERR_PO_NOT_CANCELLABLE, http: 409, condition: "PO cancel requires ISSUED with no POSTED receipts and no invoices" }
  - { id: ERR_PO_NOT_INVOICABLE, http: 409, condition: "Invoice creation requires PO not CANCELLED" }
  - { id: ERR_PO_INVOICING_CLOSED, http: 409, condition: "An open (PAYABLE/EXCEPTION) invoice already exists, or a PAID invoice exists, for this PO" }
  - { id: ERR_RECEIPT_NOT_VOIDABLE, http: 409, condition: "Void requires POSTED" }
  - { id: ERR_INVOICE_NOT_RESOLVABLE, http: 409, condition: "resolve-exception requires EXCEPTION" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "pay requires PAYABLE" }
  - { id: ERR_CARD_STATE_INVALID, http: 409, condition: "suspend requires ACTIVE; reinstate requires SUSPENDED; close requires ACTIVE or SUSPENDED" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Transaction posting requires card ACTIVE (rejected on SUSPENDED)" }
  - { id: ERR_CARD_CLOSED, http: 409, condition: "Operation forbidden on a CLOSED card (reconcile/dispute and any card mutation)" }
  - { id: ERR_CARD_HAS_OPEN_TRANSACTIONS, http: 409, condition: "close requires no POSTED or DISPUTED transactions" }
  - { id: ERR_TXN_NOT_RECONCILABLE, http: 409, condition: "reconcile requires POSTED" }
  - { id: ERR_TXN_NOT_DISPUTABLE, http: 409, condition: "dispute requires POSTED or RECONCILED" }
  - { id: ERR_TXN_NOT_DISPUTED, http: 409, condition: "resolve-dispute requires DISPUTED" }
  - { id: ERR_SURPLUS_NOT_CLAIMABLE, http: 409, condition: "claim requires DECLARED" }
  - { id: ERR_SURPLUS_NOT_LISTABLE, http: 409, condition: "list-for-sale requires DECLARED" }
  - { id: ERR_SURPLUS_NOT_SELLABLE, http: 409, condition: "sell requires LISTED" }
  - { id: ERR_SURPLUS_NOT_DONATABLE, http: 409, condition: "donate requires LISTED" }
  - { id: ERR_SURPLUS_NOT_SCRAPPABLE, http: 409, condition: "scrap requires DECLARED or LISTED" }
  - { id: ERR_GRANT_STATE_INVALID, http: 409, condition: "suspend/reinstate/close invalid for current grant state" }
  - { id: ERR_VENDOR_STATE_INVALID, http: 409, condition: "suspend requires ACTIVE; reinstate requires SUSPENDED" }
  - { id: ERR_ELEVATION_STATE_INVALID, http: 409, condition: "cancel requires SCHEDULED" }
  # --- business safety / compliance ---
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Approver's X-User-ID equals requisition.requester_id" }
  - { id: ERR_SELF_RESOLUTION_FORBIDDEN, http: 403, condition: "Invoice-exception resolver's X-User-ID equals the source requisition's requester_id" }
  - { id: ERR_SELF_CLAIM_FORBIDDEN, http: 403, condition: "claiming_department_id equals the asset's owning department_id" }
  - { id: ERR_GRANT_CATEGORY_NOT_ALLOWABLE, http: 422, condition: "A line/transaction cost_category is not in grant.allowed_categories" }
  - { id: ERR_GRANT_BUDGET_PERIOD_EXPIRED, http: 422, condition: "Logical clock outside [budget_start, budget_end]" }
  - { id: ERR_MCC_NOT_ALLOWED, http: 422, condition: "mcc_code not in card.allowed_mccs (when the array is non-empty)" }
  - { id: ERR_SOLE_SOURCE_JUSTIFICATION_REQUIRED, http: 422, condition: "sole_source_requested with total_cents >= 500000 but empty sole_source_justification" }
  # --- business temporal ---
  - { id: ERR_SOLICITATION_EXPIRED, http: 409, condition: "Quote submission at or after response_deadline" }
  - { id: ERR_SOLICITATION_DEADLINE_NOT_PASSED, http: 409, condition: "close before response_deadline" }
  - { id: ERR_CONTRACT_EXPIRED, http: 409, condition: "issue-po when logical clock is outside [effective_start, effective_end)" }
  - { id: ERR_REDISTRIBUTION_WINDOW_EXPIRED, http: 409, condition: "claim at or after declared_at + 10 days" }
  - { id: ERR_REDISTRIBUTION_WINDOW_ACTIVE, http: 409, condition: "list-for-sale before declared_at + 10 days" }
  - { id: ERR_BID_SPLITTING_DETECTED, http: 409, condition: "Rolling 30-day same-vendor same-department sum plus this total >= 2500000 while this total < 2500000 and no contract" }
  # --- business constraint ---
  - { id: ERR_CONTRACT_OVERLAP, http: 409, condition: "Another EXECUTED contract with same (vendor_id, commodity_code) has an overlapping half-open period" }
  - { id: ERR_ELEVATION_OVERLAP, http: 409, condition: "New elevation window overlaps an existing SCHEDULED elevation on the card" }
  - { id: ERR_ELEVATION_GAP_VIOLATION, http: 409, condition: "Gap between the new window and an adjacent SCHEDULED elevation is < 7 days" }
  - { id: ERR_DUPLICATE_QUOTE, http: 409, condition: "Vendor already has a SUBMITTED quote on this solicitation" }
  - { id: ERR_SOURCING_REQUIRED, http: 409, condition: "PURCHASING step requires an AWARDED solicitation when total >= 2500000, no contract, and no approved sole source" }
  - { id: ERR_NO_ELIGIBLE_QUOTES, http: 409, condition: "Award with empty eligible pool" }
  - { id: ERR_INSUFFICIENT_QUOTES, http: 409, condition: "Eligible pool smaller than min_quotes and no override_reason" }
  - { id: ERR_AWARD_NOT_TOP_SCORE, http: 409, condition: "quote_id differs from computed winner and no override_reason" }
  - { id: ERR_OVER_RECEIPT, http: 422, condition: "Cumulative POSTED receipts would exceed ordered quantity on a line" }
  - { id: ERR_INVOICE_LINE_UNKNOWN, http: 422, condition: "Invoice line_no not present on the PO" }
  - { id: ERR_LIMIT_INCONSISTENT, http: 422, condition: "single_txn_limit_cents > monthly_limit_cents on card create or limits patch" }
  - { id: ERR_GRANT_HAS_OPEN_ENCUMBRANCES, http: 409, condition: "Grant close while encumbered_cents > 0" }
  - { id: ERR_SOLICITATION_NOT_ALLOWED, http: 409, condition: "Solicitation creation requires requisition SUBMITTED with total_cents >= 2500000 and no contract_id" }
  - { id: ERR_SOLICITATION_ALREADY_EXISTS, http: 409, condition: "A non-CANCELLED solicitation already exists for this requisition" }
  # --- business referential ---
  - { id: ERR_VENDOR_SUSPENDED, http: 409, condition: "Operation requires vendor ACTIVE (submit, quote, execute)" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "Operation requires grant ACTIVE (submit, reconcile)" }
  - { id: ERR_CONTRACT_NOT_EXECUTED, http: 409, condition: "Operation requires contract EXECUTED (submit with contract_id, issue-po)" }
  # --- business fiscal ---
  - { id: ERR_APPROVER_LIMIT_EXCEEDED, http: 422, condition: "department.default_approval_limit_cents < total_cents at the DEPARTMENT step" }
  - { id: ERR_GRANT_BUDGET_EXCEEDED, http: 402, condition: "charge_cents (or GRANT pcard amount) exceeds grant.provisional_remaining_cents" }
  - { id: ERR_SINGLE_TXN_LIMIT_EXCEEDED, http: 422, condition: "DEBIT amount_cents > effective single-transaction limit" }
  - { id: ERR_MONTHLY_LIMIT_EXCEEDED, http: 422, condition: "utilization_cents + amount_cents > monthly_limit_cents" }
  - { id: ERR_SALE_PRICE_BELOW_FLOOR, http: 422, condition: "sale_price_cents < max(2500, round_half_up(0.40 * estimated_value_cents))" }
  - { id: ERR_HIGH_VALUE_SALE_REQUIRES_DIRECTOR, http: 403, condition: "estimated_value_cents >= 5000000 and acting role is not ProcurementDirector" }
  # --- shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive quantity/amount, inverted window, sole-source below threshold" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit outside [1, 100] or offset < 0" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). All deadline/window/aging rules read this clock."
    roles: [ProcurementAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["current_utc updated; no entity is mutated"]

  # --- departments ---
  - method: POST
    path: "/departments"
    description: "Create a department"
    roles: [ProcurementAdmin]
    code: 201
    input: [name, cost_center, diversity_goal_pct, sustainability_goal_pct, default_approval_limit_cents]
    output: Department
    side_effects: []
  - method: GET
    path: "/departments"
    description: "List departments"
    roles: &all_roles [Requester, DepartmentApprover, Buyer, ProcurementDirector, ContractOfficer, GrantOfficer, APClerk, ReceivingClerk, Cardholder, SurplusManager, ProcurementAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Department[]"
    side_effects: []
  - method: GET
    path: "/departments/{id}"
    description: "Get a department"
    roles: *all_roles
    code: 200
    input: []
    output: Department
    side_effects: []
  - method: GET
    path: "/departments/{id}/diversity-report"
    description: "Computed supplier-diversity spend report for the department (committed or paid basis)"
    roles: *all_roles
    code: 200
    input: [basis, "window_start?", "window_end?"]
    output: { basis: string, diverse_spend_cents: integer, total_spend_cents: integer, ratio: number, goal_met: boolean }
    side_effects: ["runs diversity_spend_ratio"]

  # --- vendors ---
  - method: POST
    path: "/vendors"
    description: "Create a vendor"
    roles: [Buyer]
    code: 201
    input: [legal_name, "diversity_certification?", "sustainability_tier?", "payment_terms_days?"]
    output: Vendor
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/vendors"
    description: "List vendors"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Vendor[]"
    side_effects: []
  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor"
    roles: *all_roles
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors/{id}/quotes"
    description: "List quotes submitted by a vendor (reverse reachability for Quote.vendor_id)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "Quote[]"
    side_effects: []
  - method: POST
    path: "/vendors/{id}/suspend"
    description: "Suspend a vendor; cascades per Vendor state machine"
    roles: [ProcurementAdmin]
    code: 200
    input: ["reason?"]
    output: Vendor
    side_effects: ["vendor-suspension cascade: quotes DISQUALIFIED, awarded solicitations CANCELLED, requisitions RETURNED"]
  - method: POST
    path: "/vendors/{id}/reinstate"
    description: "Reinstate a suspended vendor"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # --- grants ---
  - method: POST
    path: "/grants"
    description: "Create a grant"
    roles: [GrantOfficer]
    code: 201
    input: [grant_code, sponsor, total_award_cents, f_and_a_rate, allowed_categories, budget_start, budget_end, "equipment_cap_cents?"]
    output: Grant
    side_effects: ["status = ACTIVE; spent/encumbered initialized to 0"]
  - method: GET
    path: "/grants"
    description: "List grants"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Grant[]"
    side_effects: []
  - method: GET
    path: "/grants/{id}"
    description: "Get a grant (includes computed ledger fields)"
    roles: *all_roles
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: GET
    path: "/grants/{id}/budget-ledger"
    description: "Computed grant budget ledger (both remaining-budget variants)"
    roles: *all_roles
    code: 200
    input: []
    output: { spent_cents: integer, encumbered_cents: integer, provisional_remaining_cents: integer, settled_remaining_cents: integer }
    side_effects: ["runs grant_budget_ledger"]
  - method: POST
    path: "/grants/{id}/suspend"
    description: "Suspend a grant (blocks new grant-funded submits and GRANT reconciles)"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: POST
    path: "/grants/{id}/reinstate"
    description: "Reinstate a suspended grant"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: POST
    path: "/grants/{id}/close"
    description: "Close a grant (requires zero encumbrance)"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: Grant
    side_effects: []

  # --- contracts ---
  - method: POST
    path: "/contracts"
    description: "Create a contract in DRAFT"
    roles: [ContractOfficer]
    code: 201
    input: [vendor_id, commodity_code, value_cents, effective_start, effective_end, "terms_text?"]
    output: Contract
    side_effects: ["status = DRAFT; negotiation_round = 0"]
  - method: GET
    path: "/contracts"
    description: "List contracts"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "vendor_id?", "status?"]
    output: "Contract[]"
    side_effects: []
  - method: GET
    path: "/contracts/{id}"
    description: "Get a contract"
    roles: *all_roles
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/contracts/{id}/submit-review"
    description: "Move DRAFT or IN_NEGOTIATION contract to UNDER_REVIEW"
    roles: [ContractOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/contracts/{id}/negotiate"
    description: "Open a negotiation round (UNDER_REVIEW -> IN_NEGOTIATION, round += 1)"
    roles: [ContractOfficer]
    code: 200
    input: ["note?"]
    output: Contract
    side_effects: ["negotiation_round += 1"]
  - method: POST
    path: "/contracts/{id}/approve-review"
    description: "Approve the review (UNDER_REVIEW -> REVIEW_APPROVED)"
    roles: [ContractOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/contracts/{id}/execute"
    description: "Execute an approved contract (exclusivity + vendor-active + supersede handling)"
    roles: [ProcurementDirector]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> EXECUTED; superseded contract -> SUPERSEDED; executed_at set"]
  - method: POST
    path: "/contracts/{id}/amend"
    description: "Create an amendment draft that supersedes this EXECUTED contract (OCC-guarded)"
    roles: [ContractOfficer]
    code: 201
    input: [expected_contract_version, effective_start, effective_end, "value_cents?", "terms_text?"]
    output: Contract
    side_effects:
      - "New Contract created in DRAFT with supersedes_contract_id = this contract's id, vendor/commodity inherited"
      - "increments Contract.version of the amended contract by 1"
  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate an EXECUTED contract (cascades to POs, invoices, requisitions)"
    roles: [ProcurementDirector]
    code: 200
    input: [reason]
    output: Contract
    side_effects: ["contract-termination cascade per Contract state machine"]

  # --- requisitions ---
  - method: POST
    path: "/requisitions"
    description: "Create a requisition in DRAFT"
    roles: [Requester]
    code: 201
    input: [department_id, requester_id, lines, "vendor_id?", "grant_id?", "contract_id?", "sole_source_requested?", "sole_source_justification?"]
    output: Requisition
    side_effects: ["status = DRAFT; total_cents computed; system fields stamped"]
  - method: GET
    path: "/requisitions"
    description: "List requisitions with filters"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "department_id?", "vendor_id?", "grant_id?", "contract_id?", "status?"]
    output: "Requisition[]"
    side_effects: []
  - method: GET
    path: "/requisitions/{id}"
    description: "Get a requisition"
    roles: *all_roles
    code: 200
    input: []
    output: Requisition
    side_effects: []
  - method: PATCH
    path: "/requisitions/{id}"
    description: "Edit a requisition in DRAFT or RETURNED (OCC-guarded, owner-only)"
    roles: [Requester]
    code: 200
    input: [expected_requisition_version, "lines?", "vendor_id?", "grant_id?", "contract_id?", "sole_source_requested?", "sole_source_justification?"]
    output: Requisition
    side_effects: ["total_cents recomputed when lines change; increments Requisition.version by 1"]
  - method: POST
    path: "/requisitions/{id}/submit"
    description: "Submit for approval (validations + chain snapshot + anti-split check)"
    roles: [Requester]
    code: 200
    input: []
    output: Requisition
    side_effects: ["status -> SUBMITTED; required_chain pinned; charge_cents computed; submitted_at set"]
  - method: POST
    path: "/requisitions/{id}/approve-step"
    description: "Approve the current chain step (advances step or reaches APPROVED)"
    roles: [DepartmentApprover, GrantOfficer, Buyer, ProcurementDirector, ContractOfficer]
    code: 200
    input: ["comment?"]
    output: Requisition
    side_effects: ["ApprovalRecord appended; on final step: encumbrance attaches for grant-funded requisitions"]
  - method: POST
    path: "/requisitions/{id}/return-step"
    description: "Return the requisition to the requester from the current chain step"
    roles: [DepartmentApprover, GrantOfficer, Buyer, ProcurementDirector, ContractOfficer]
    code: 200
    input: [reason]
    output: Requisition
    side_effects: ["ApprovalRecord appended (RETURNED); status -> RETURNED"]
  - method: POST
    path: "/requisitions/{id}/cancel"
    description: "Cancel from DRAFT, RETURNED or APPROVED (releases encumbrance from APPROVED)"
    roles: [Requester]
    code: 200
    input: []
    output: Requisition
    side_effects: ["status -> CANCELLED; grant encumbrance released when cancelling from APPROVED"]
  - method: GET
    path: "/requisitions/{id}/approvals"
    description: "List approval audit records for a requisition (chronological)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "ApprovalRecord[]"
    side_effects: []

  # --- solicitations & quotes ---
  - method: POST
    path: "/requisitions/{id}/solicitations"
    description: "Open a competitive solicitation for a requisition. Preconditions: requisition SUBMITTED, total_cents >= 2500000, contract_id null, and no existing non-CANCELLED solicitation (ERR_SOLICITATION_NOT_ALLOWED / ERR_SOLICITATION_ALREADY_EXISTS)"
    roles: [Buyer]
    code: 201
    input: [response_deadline, "min_quotes?"]
    output: BidSolicitation
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/requisitions/{id}/solicitations"
    description: "List solicitations of a requisition (reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "BidSolicitation[]"
    side_effects: []
  - method: GET
    path: "/solicitations/{id}"
    description: "Get a solicitation"
    roles: *all_roles
    code: 200
    input: []
    output: BidSolicitation
    side_effects: []
  - method: POST
    path: "/solicitations/{id}/quotes"
    description: "Submit a vendor quote while OPEN and before the deadline"
    roles: [Buyer]
    code: 201
    input: [vendor_id, price_cents]
    output: Quote
    side_effects: ["submitted_at = logical clock"]
  - method: GET
    path: "/solicitations/{id}/quotes"
    description: "List quotes of a solicitation"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "Quote[]"
    side_effects: []
  - method: POST
    path: "/solicitations/{id}/close"
    description: "Close the solicitation at/after the deadline; computes quote scores"
    roles: [Buyer]
    code: 200
    input: []
    output: BidSolicitation
    side_effects: ["award_score computed for all quotes"]
  - method: POST
    path: "/solicitations/{id}/award"
    description: "Award to the computed winner (or a documented override)"
    roles: [ProcurementDirector]
    code: 200
    input: ["quote_id?", "override_reason?"]
    output: BidSolicitation
    side_effects: ["winner AWARDED; others NOT_AWARDED; requisition vendor set; sourcing_method COMPETITIVE_BID"]
  - method: POST
    path: "/solicitations/{id}/cancel"
    description: "Cancel an OPEN or CLOSED solicitation"
    roles: [Buyer]
    code: 200
    input: []
    output: BidSolicitation
    side_effects: ["SUBMITTED quotes -> NOT_AWARDED"]

  # --- purchase orders, receipts, invoices ---
  - method: POST
    path: "/requisitions/{id}/issue-po"
    description: "Issue a PurchaseOrder from an APPROVED requisition"
    roles: [Buyer]
    code: 201
    input: []
    output: PurchaseOrder
    side_effects: ["requisition -> PO_ISSUED; contract_version_pinned when contract-linked"]
  - method: GET
    path: "/purchase-orders"
    description: "List purchase orders with filters"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "requisition_id?", "vendor_id?", "contract_id?", "grant_id?", "fulfillment_status?", "match_status?"]
    output: "PurchaseOrder[]"
    side_effects: []
  - method: GET
    path: "/purchase-orders/{id}"
    description: "Get a purchase order"
    roles: *all_roles
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []
  - method: POST
    path: "/purchase-orders/{id}/cancel"
    description: "Cancel an unreceived, uninvoiced PO (releases grant encumbrance)"
    roles: [Buyer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["fulfillment -> CANCELLED; match -> CLOSED; source requisition -> APPROVED"]
  - method: POST
    path: "/purchase-orders/{id}/receipts"
    description: "Post a (partial) receipt against PO lines"
    roles: [ReceivingClerk]
    code: 201
    input: [lines]
    output: Receipt
    side_effects: ["fulfillment_status recomputed"]
  - method: GET
    path: "/purchase-orders/{id}/receipts"
    description: "List receipts of a PO"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "Receipt[]"
    side_effects: []
  - method: POST
    path: "/receipts/{id}/void"
    description: "Void a posted receipt (recomputes fulfillment; re-matches PAYABLE invoices)"
    roles: [ReceivingClerk]
    code: 200
    input: []
    output: Receipt
    side_effects: ["fulfillment recompute; PAYABLE invoices re-matched (may become EXCEPTION/RECEIPT_VOIDED)"]
  - method: POST
    path: "/purchase-orders/{id}/invoices"
    description: "Create an invoice; the three-way match runs immediately (PAYABLE or EXCEPTION)"
    roles: [APClerk]
    code: 201
    input: [invoice_number, lines]
    output: Invoice
    side_effects: ["three_way_match; PO match_status recomputed"]
  - method: GET
    path: "/purchase-orders/{id}/invoices"
    description: "List invoices of a PO"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices with filters"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "vendor_id?", "status?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: *all_roles
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/resolve-exception"
    description: "Resolve an EXCEPTION invoice (ACCEPT_VARIANCE re-runs the match; REJECT_INVOICE terminates it). Resolver may not be the source requisition's requester."
    roles: [APClerk]
    code: 200
    input: [action, "comment?"]
    output: Invoice
    side_effects: ["ACCEPT_VARIANCE: re-match, then PAYABLE; REJECT_INVOICE: REJECTED; PO match_status recomputed"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay a PAYABLE invoice (settles grant charge on grant POs)"
    roles: [APClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> PAID; paid_at set; grant ledger settlement per grant_budget_ledger"]

  # --- p-cards ---
  - method: POST
    path: "/pcards"
    description: "Issue a P-card (id doubles as the cardholder identity for the Cardholder role)"
    roles: [ProcurementAdmin]
    code: 201
    input: [department_id, cardholder_name, single_txn_limit_cents, monthly_limit_cents, allowed_mccs]
    output: PCard
    side_effects: ["status = ACTIVE; cycle_index = 0; consecutive_unreconciled_cycles = 0"]
  - method: GET
    path: "/pcards"
    description: "List P-cards"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "department_id?", "status?"]
    output: "PCard[]"
    side_effects: []
  - method: GET
    path: "/pcards/{id}"
    description: "Get a P-card (includes computed utilization and available credit)"
    roles: *all_roles
    code: 200
    input: []
    output: PCard
    side_effects: []
  - method: PATCH
    path: "/pcards/{id}/limits"
    description: "Change card limits / MCC list (OCC-guarded)"
    roles: [ProcurementAdmin]
    code: 200
    input: [expected_pcard_version, "single_txn_limit_cents?", "monthly_limit_cents?", "allowed_mccs?"]
    output: PCard
    side_effects: ["increments PCard.version by 1"]
  - method: POST
    path: "/pcards/{id}/suspend"
    description: "Suspend a card (cancels SCHEDULED elevations)"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: PCard
    side_effects: ["SCHEDULED elevations -> CANCELLED"]
  - method: POST
    path: "/pcards/{id}/reinstate"
    description: "Reinstate a suspended card (resets the aging counter)"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: PCard
    side_effects: ["consecutive_unreconciled_cycles = 0"]
  - method: POST
    path: "/pcards/{id}/close"
    description: "Close a card (requires no open transactions)"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: PCard
    side_effects: ["SCHEDULED elevations -> CANCELLED"]
  - method: POST
    path: "/pcards/{id}/close-cycle"
    description: "Close the current statement cycle (ops-run checkpoint): ages unreconciled debits, escalates suspension at 2 consecutive unreconciled cycles, starts a new cycle"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: PCard
    side_effects: ["reconciliation_aging runs; possible auto-suspension + elevation cascade; cycle_index += 1"]
  - method: POST
    path: "/pcards/{id}/elevations"
    description: "Schedule a temporary single-transaction limit elevation window (no overlap; >= 7-day gaps)"
    roles: [ProcurementAdmin]
    code: 201
    input: [elevated_single_txn_limit_cents, window_start, window_end]
    output: LimitElevation
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/pcards/{id}/elevations"
    description: "List elevations of a card"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "LimitElevation[]"
    side_effects: []
  - method: POST
    path: "/pcard-elevations/{id}/cancel"
    description: "Cancel a scheduled elevation"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: LimitElevation
    side_effects: []

  # --- p-card transactions ---
  - method: POST
    path: "/pcards/{id}/transactions"
    description: "Post a transaction to a card (DEBIT checked against MCC + limits; CREDIT auto-reconciles)"
    roles: [Cardholder]
    code: 201
    input: [amount_cents, entry_type, merchant_name, mcc_code]
    output: PCardTransaction
    side_effects: ["posted_at = logical clock; cycle_index captured; utilization recomputed"]
  - method: GET
    path: "/pcards/{id}/transactions"
    description: "List transactions of a card"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PCardTransaction[]"
    side_effects: []
  - method: GET
    path: "/pcard-transactions"
    description: "List transactions with filters (reverse reachability for grant_id)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "pcard_id?", "grant_id?", "status?"]
    output: "PCardTransaction[]"
    side_effects: []
  - method: GET
    path: "/pcard-transactions/{id}"
    description: "Get a transaction"
    roles: *all_roles
    code: 200
    input: []
    output: PCardTransaction
    side_effects: []
  - method: POST
    path: "/pcard-transactions/{id}/reconcile"
    description: "Reconcile a POSTED transaction (receipt + allocation; GRANT allocation runs allowability checks and books grant spend)"
    roles: [Cardholder]
    code: 200
    input: [receipt_reference, allocation_type, "grant_id?", "cost_category?"]
    output: PCardTransaction
    side_effects: ["GRANT allocation: grant.spent_cents += amount_cents"]
  - method: POST
    path: "/pcard-transactions/{id}/dispute"
    description: "Dispute a POSTED or RECONCILED transaction"
    roles: [Cardholder]
    code: 200
    input: [reason]
    output: PCardTransaction
    side_effects: ["pre_dispute_status recorded; utilization unchanged"]
  - method: POST
    path: "/pcard-transactions/{id}/resolve-dispute"
    description: "Resolve a dispute (CARDHOLDER_FAVOR reverses; MERCHANT_FAVOR restores pre-dispute status)"
    roles: [ProcurementAdmin]
    code: 200
    input: [outcome]
    output: PCardTransaction
    side_effects: ["CARDHOLDER_FAVOR: REVERSED, utilization and grant spend compensated; MERCHANT_FAVOR: back to pre_dispute_status"]

  # --- surplus ---
  - method: POST
    path: "/surplus-assets"
    description: "Declare a surplus asset (opens the 10-day redistribution window)"
    roles: [SurplusManager]
    code: 201
    input: [asset_tag, department_id, description, condition, estimated_value_cents, "disposal_cost_cents?"]
    output: SurplusAsset
    side_effects: ["status = DECLARED; declared_at = logical clock"]
  - method: GET
    path: "/surplus-assets"
    description: "List surplus assets"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?", "department_id?", "claiming_department_id?", "status?"]
    output: "SurplusAsset[]"
    side_effects: []
  - method: GET
    path: "/surplus-assets/{id}"
    description: "Get a surplus asset"
    roles: *all_roles
    code: 200
    input: []
    output: SurplusAsset
    side_effects: []
  - method: POST
    path: "/surplus-assets/{id}/claim"
    description: "Claim an asset for another department during the redistribution window"
    roles: [Requester]
    code: 200
    input: [claiming_department_id]
    output: SurplusAsset
    side_effects: ["status -> TRANSFERRED; claiming_department_id recorded"]
  - method: POST
    path: "/surplus-assets/{id}/list-for-sale"
    description: "List an unclaimed asset for sale after the redistribution window"
    roles: [SurplusManager]
    code: 200
    input: []
    output: SurplusAsset
    side_effects: ["status -> LISTED"]
  - method: POST
    path: "/surplus-assets/{id}/sell"
    description: "Sell a listed asset (floor price; high-value assets need ProcurementDirector; proceeds waterfall)"
    roles: [SurplusManager, ProcurementDirector]
    code: 200
    input: [sale_price_cents, "buyer_name?"]
    output: SurplusAsset
    side_effects: ["surplus_proceeds_waterfall computes the three proceeds buckets"]
  - method: POST
    path: "/surplus-assets/{id}/donate"
    description: "Donate a listed asset"
    roles: [SurplusManager]
    code: 200
    input: [recipient_name]
    output: SurplusAsset
    side_effects: ["status -> DONATED"]
  - method: POST
    path: "/surplus-assets/{id}/scrap"
    description: "Scrap a declared or listed asset"
    roles: [SurplusManager]
    code: 200
    input: ["reason?"]
    output: SurplusAsset
    side_effects: ["status -> SCRAPPED"]

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Requester
    description: "Departmental user who creates and owns requisitions and claims surplus assets for a department"
    identity: opaque
    exclusive_operations:
      - "POST /requisitions — create requisition"
      - "PATCH /requisitions/{id} — edit own requisition in DRAFT/RETURNED"
      - "POST /requisitions/{id}/submit — submit own requisition"
      - "POST /requisitions/{id}/cancel — cancel own requisition"
      - "POST /surplus-assets/{id}/claim — claim for another department"
    shared_operations: ["GET read endpoints"]
  - name: DepartmentApprover
    description: "Department head; decides the DEPARTMENT chain step within the delegated limit"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /requisitions/{id}/approve-step", "POST /requisitions/{id}/return-step", "GET read endpoints"]
  - name: Buyer
    description: "Purchasing agent; owns vendors, solicitations, quotes, PO issue/cancel, and the PURCHASING chain step"
    identity: opaque
    exclusive_operations:
      - "POST /vendors — create vendor"
      - "POST /requisitions/{id}/solicitations — open solicitation"
      - "POST /solicitations/{id}/quotes — submit quote"
      - "POST /solicitations/{id}/close — close solicitation"
      - "POST /solicitations/{id}/cancel — cancel solicitation"
      - "POST /requisitions/{id}/issue-po — issue PO"
      - "POST /purchase-orders/{id}/cancel — cancel PO"
    shared_operations: ["POST /requisitions/{id}/approve-step", "POST /requisitions/{id}/return-step", "GET read endpoints"]
  - name: ProcurementDirector
    description: "Director; decides DIRECTOR and SOLE_SOURCE steps, executes/terminates contracts, awards solicitations, sells high-value surplus"
    identity: opaque
    exclusive_operations:
      - "POST /contracts/{id}/execute — execute contract"
      - "POST /contracts/{id}/terminate — terminate contract"
      - "POST /solicitations/{id}/award — award solicitation"
      - "High-value surplus sales (estimated_value_cents >= 5000000)"
    shared_operations: ["POST /requisitions/{id}/approve-step", "POST /requisitions/{id}/return-step", "POST /surplus-assets/{id}/sell", "GET read endpoints"]
  - name: ContractOfficer
    description: "Contracting officer; drafts, reviews, negotiates, and amends contracts; decides CONTRACT_REVIEW chain step"
    identity: opaque
    exclusive_operations:
      - "POST /contracts — create contract"
      - "POST /contracts/{id}/submit-review"
      - "POST /contracts/{id}/negotiate"
      - "POST /contracts/{id}/approve-review"
      - "POST /contracts/{id}/amend — create amendment (OCC-guarded)"
    shared_operations: ["POST /requisitions/{id}/approve-step", "POST /requisitions/{id}/return-step", "GET read endpoints"]
  - name: GrantOfficer
    description: "Grants compliance officer; administers grants and decides the GRANT_COMPLIANCE chain step"
    identity: opaque
    exclusive_operations:
      - "POST /grants — create grant"
      - "POST /grants/{id}/suspend, reinstate, close"
    shared_operations: ["POST /requisitions/{id}/approve-step", "POST /requisitions/{id}/return-step", "GET read endpoints"]
  - name: APClerk
    description: "Accounts payable clerk; creates invoices, resolves match exceptions, pays invoices"
    identity: opaque
    exclusive_operations:
      - "POST /purchase-orders/{id}/invoices — create invoice"
      - "POST /invoices/{id}/resolve-exception"
      - "POST /invoices/{id}/pay"
    shared_operations: ["GET read endpoints"]
  - name: ReceivingClerk
    description: "Receiving clerk; posts and voids receipts"
    identity: opaque
    exclusive_operations:
      - "POST /purchase-orders/{id}/receipts"
      - "POST /receipts/{id}/void"
    shared_operations: ["GET read endpoints"]
  - name: Cardholder
    description: "P-card holder; X-User-ID equals the PCard id — posts, reconciles, and disputes transactions on the own card only"
    identity: "entity_backed:PCard"
    exclusive_operations:
      - "POST /pcards/{id}/transactions — post to own card"
      - "POST /pcard-transactions/{id}/reconcile — own card's transactions"
      - "POST /pcard-transactions/{id}/dispute — own card's transactions"
    shared_operations: ["GET read endpoints"]
  - name: SurplusManager
    description: "Surplus property manager; declares, lists, sells (below high-value floor), donates, and scraps surplus"
    identity: opaque
    exclusive_operations:
      - "POST /surplus-assets — declare asset"
      - "POST /surplus-assets/{id}/list-for-sale"
      - "POST /surplus-assets/{id}/donate"
      - "POST /surplus-assets/{id}/scrap"
    shared_operations: ["POST /surplus-assets/{id}/sell (non-high-value)", "GET read endpoints"]
  - name: ProcurementAdmin
    description: "Procurement system administrator; manages departments, P-cards, elevations, vendor status, the logical clock, and dispute resolution"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /departments"
      - "POST /vendors/{id}/suspend, reinstate"
      - "POST /pcards — issue card"
      - "PATCH /pcards/{id}/limits (OCC-guarded)"
      - "POST /pcards/{id}/suspend, reinstate, close, close-cycle"
      - "POST /pcards/{id}/elevations; POST /pcard-elevations/{id}/cancel"
      - "POST /pcard-transactions/{id}/resolve-dispute"
    shared_operations: ["GET read endpoints"]
