            - "Lease.${lease_x}.lease_status == EXPIRED with rent_status FROZEN and one PENDING_INSPECTION ReversionAssessment"
            - "Lease.${lease_y}.insurance_status == LAPSED and lease_status == IN_DEFAULT, with one SERVED INSURANCE_LAPSE DefaultNotice whose served_by_user_id is SYSTEM and lessee_cure_deadline 2026-09-17T00:00:00Z"
