              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "EvidenceMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_e_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "CapClub", channel: "CLUB", deduction_validation_policy: "AGREEMENT_CAP" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_a_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_e_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_e_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_e_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_e_v: $.data.version }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_a_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_a_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_a_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_a_v: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_e_id}", name: "EvidenceMart Fall TPR", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_e_v}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_e_id: $.data.id }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_a_id}", name: "CapClub Fall TPR", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_a_v}" }
              as: KeyAccountManager
