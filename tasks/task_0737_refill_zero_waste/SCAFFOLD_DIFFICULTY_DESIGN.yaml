  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_fill
        grounds:
          - validations[priority=4]
          - validations[priority=9]
        distinguishing_aspect: >
          Error-category pair state (prio 4) vs business_fiscal (prio 9): filling a line whose order is
          still CART (state violation) while net 300 exceeds bin.on_hand_g 50 (fiscal violation) returns
          ERR_INVALID_ORDER_STATE, never ERR_INSUFFICIENT_STOCK.
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin on_hand only 50 (last_recount 50, reorder 0); BYO container tare 200; CART order with one PROVISIONAL line (est_gross 500); start-fill NOT called"
          setup_api_calls:
