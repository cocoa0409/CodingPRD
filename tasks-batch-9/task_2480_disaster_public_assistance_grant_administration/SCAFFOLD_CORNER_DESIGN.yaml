# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2480 — Disaster Public Assistance Grant Administration
#
# Section values are the nine sections of references/claim-extraction-guide.md;
# claim_type values are that guide's per-section table rows. Every numeric
# assert below was executed against the referenced calculations[].formula and
# its constants: before being written as a literal. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
#
# Error-catalog coverage map (§1.6, 62 ids). Every id is triggered by a named
# instance in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml (D = §1.8):
#   ERR_UNAUTHENTICATED                     -> missing_required_x_user_id_header_returns_unauthenticated
#   ERR_FORBIDDEN_ROLE                      -> applicant_agent_cannot_run_facility_screening
#   ERR_APPLICANT_SCOPE_VIOLATION           -> applicant_agent_cannot_amend_another_applicants_facility
#   ERR_*_NOT_FOUND (13 ids)                -> every_single_resource_get_with_unknown_id_returns_its_own_not_found
#                                              + facility_creation_with_unknown_applicant_id_returns_not_found
#   ERR_INVALID_REQUEST                     -> applicant_creation_missing_applicant_type_rejected,
#                                              disaster_invalid_incident_type_enum_rejected,
#                                              cost_line_item_type_to_foreign_key_pairing_rejected
#   ERR_INVALID_PAGINATION                  -> pagination_limit_and_offset_out_of_range_rejected
#   ERR_STALE_APPLICANT_VERSION             -> stale_applicant_version_on_drawdown_create_returns_412
#   ERR_STALE_PROJECT_VERSION               -> stale_project_version_on_deobligation_create_returns_412
#   ERR_PROJECT_INVALID_STATE               -> project_closed_is_terminal_and_rejects_further_actions (D also)
#   ERR_DISASTER_INVALID_STATE              -> once_only_actions_reject_their_second_invocation
#   ERR_DAMAGE_SITE_ALREADY_ADJUDICATED     -> once_only_actions_reject_their_second_invocation
#   ERR_CONTRACT_ALREADY_REVIEWED           -> once_only_actions_reject_their_second_invocation
#   ERR_COST_LINE_ITEM_LOCKED               -> cost_line_item_creation_and_review_locked_after_project_validation
#   ERR_FACILITY_AMENDMENT_LOCKED           -> facility_amendment_locked_by_validated_project
#   ERR_DRAWDOWN_INVALID_STATE              -> drawdown_refund_before_disbursement_rejected
#   ERR_DEOBLIGATION_NOT_FINAL              -> D / appeal_filing_blocked_by_unfinalized_determination
#   ERR_APPEAL_ALREADY_DECIDED              -> appeal_second_decision_rejected
#   ERR_REPORT_ALREADY_SUBMITTED            -> once_only_actions_reject_their_second_invocation
#   ERR_UNREVIEWED_COST_LINE_ITEMS          -> cost_review_with_unreviewed_line_rejected
#   ERR_OUTSIDE_INCIDENT_PERIOD             -> D / cost_line_item_temporal_priority_beats_safety_priority
#   ERR_APPEAL_WINDOW_EXPIRED               -> appeal_filed_after_window_expiry_rejected
#   ERR_INCIDENT_PERIOD_INVALID             -> incident_period_end_not_after_start_rejected
#   ERR_POLICY_NOT_EFFECTIVE_AT_INCIDENT    -> insurance_settlement_temporal_and_coverage_bounds_rejected
#   ERR_FACILITY_INELIGIBLE                 -> D / project_submit_safety_priority_beats_referential_priority
#   ERR_PNP_SBA_REFERRAL_REQUIRED           -> pnp_essential_non_critical_eligibility_without_sba_referral_rejected
#   ERR_PROCUREMENT_NONCOMPLIANT            -> contract_cost_line_procurement_gates_rejected
#   ERR_PROCUREMENT_REVIEW_PENDING          -> contract_cost_line_procurement_gates_rejected
#   ERR_INSURANCE_REQUIREMENT_UNMET         -> obligation_without_covering_flood_policy_rejected
#   ERR_APPLICANT_NOT_ELIGIBLE              -> project_submit_by_ineligible_applicant_rejected
#   ERR_DISASTER_NOT_OPEN                   -> D / project_obligate_blocked_by_closed_declaration
#   ERR_CROSS_APPLICANT_REFERENCE           -> cost_line_item_referencing_another_applicants_resource_rejected
#   ERR_PROJECT_REVIEWS_OPEN                -> D / close_obligations_blocked_by_open_project_review
#   ERR_DECLARATION_NUMBER_DUPLICATE        -> uniqueness_constraints_on_declaration_and_report_period_rejected
#   ERR_DUPLICATE_REPORT_PERIOD             -> uniqueness_constraints_on_declaration_and_report_period_rejected
#   ERR_INCIDENT_PERIOD_OVERLAP             -> D / incident_period_half_open_adjacency_allowed_overlap_rejected
#   ERR_LABOR_ENTRY_OVERLAP                 -> D / force_account_labor_rest_buffer_collision
#   ERR_EQUIPMENT_DAILY_HOURS_EXCEEDED      -> D / force_account_equipment_daily_hours_aggregate_capacity
#   ERR_RFI_ROUNDS_EXHAUSTED                -> D / project_rfi_cycle_bounded_at_two_rounds
#   ERR_MITIGATION_EXCEEDS_REPAIR           -> mitigation_request_above_repair_estimate_rejected
#   ERR_SEGREGATION_OF_DUTIES               -> disbursing_officer_cannot_be_the_obligating_officer,
#                                              adjudicator_cannot_decide_an_appeal_on_own_determination
#   ERR_SECOND_APPEAL_REQUIRES_FIRST_DENIED -> appeal_admissibility_second_duplicate_and_exhaustion_rejected
#   ERR_DUPLICATE_APPEAL                    -> appeal_admissibility_second_duplicate_and_exhaustion_rejected
#   ERR_APPEAL_LEVEL_EXHAUSTED              -> appeal_admissibility_second_duplicate_and_exhaustion_rejected
#   ERR_RELIEF_EXCEEDS_DEOBLIGATION         -> relief_bounds_at_filing_and_at_partial_grant_rejected
#   ERR_SETTLEMENT_EXCEEDS_COVERAGE         -> insurance_settlement_temporal_and_coverage_bounds_rejected
#   ERR_DEOBLIGATION_EXCEEDS_OBLIGATION     -> deobligation_above_remaining_obligation_rejected
#   ERR_DRAWDOWN_SUSPENDED                  -> D / drawdown_creation_blocked_by_suspended_applicant
#   ERR_DRAWDOWN_EXCEEDS_AVAILABLE          -> D / drawdown_request_exactly_equal_to_available_is_accepted
#   ERR_REFUND_EXCEEDS_DRAWDOWN             -> refund_above_disbursed_amount_rejected
#   ERR_NO_DOCUMENTED_COSTS                 -> D / closeout_request_on_empty_documented_cost_set_rejected
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: disaster_creation_returns_declared_defaults_and_zeroed_aggregates
        claim_type: creation
        grounds:
          - entities.Disaster
          - endpoints[POST /public-assistance/disasters]
          - state_machines.Disaster.initial_state
        distinguishing_aspect: "A declaration created with only the six required inputs comes back 201 with federal_cost_share_pct 0.75, small_project_threshold_cents 4000000, status DECLARED, every aggregate at 0 and indicator_met false."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4930", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Disaster.${disaster_id}.declaration_number == 'DR-4930'"
            - "Disaster.${disaster_id}.federal_cost_share_pct == 0.75 (declared default)"
            - "Disaster.${disaster_id}.small_project_threshold_cents == 4000000 (declared default)"
            - "Disaster.${disaster_id}.status == DECLARED"
            - "Disaster.${disaster_id}.total_validated_loss_cents == 0"
            - "Disaster.${disaster_id}.per_capita_impact_cents == 0"
            - "Disaster.${disaster_id}.indicator_met == false"
            - "Disaster.${disaster_id}.total_obligated_cents == 0"
            - "Disaster.${disaster_id}.total_drawn_cents == 0"
            - "Disaster.${disaster_id}.enhanced_monitoring_applicant_count == 0"
            - "Disaster.${disaster_id}.suspended_applicant_count == 0"
            - "Disaster.${disaster_id}.version == 1"

      - name: disaster_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /public-assistance/disasters/{disaster_id}]
          - entities.Disaster
        distinguishing_aspect: "GET /disasters/{id} echoes exactly the stored declaration: declaration_number DR-4931, state_code TX, incident_type WILDFIRE, both incident instants and population 500000, with no field mutated by the read."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "One declaration DR-4931 (TX / WILDFIRE, 2026-05-01T00:00:00Z through 2026-05-20T00:00:00Z, population 500000, federal share 0.90)."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4931", state_code: "TX", incident_type: "WILDFIRE", incident_start_at: "2026-05-01T00:00:00Z", incident_end_at: "2026-05-20T00:00:00Z", population: 500000, federal_cost_share_pct: 0.90 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
          trigger:
            - call: "GET /public-assistance/disasters/${disaster_id}"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor-1"
          assert:
            - "HTTP 200"
            - "response_type == 'object'"
            - "Disaster.${disaster_id}.declaration_number == 'DR-4931'"
            - "Disaster.${disaster_id}.state_code == 'TX'"
            - "Disaster.${disaster_id}.incident_type == WILDFIRE"
            - "Disaster.${disaster_id}.incident_start_at == '2026-05-01T00:00:00Z'"
            - "Disaster.${disaster_id}.incident_end_at == '2026-05-20T00:00:00Z'"
            - "Disaster.${disaster_id}.population == 500000"
            - "Disaster.${disaster_id}.federal_cost_share_pct == 0.90"
            - "Disaster.${disaster_id}.version == 1 (a read never bumps version)"

      - name: applicant_list_pagination_and_filter_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /public-assistance/applicants]
          - response_envelope.pagination_fields
          - entities.Applicant.fields.eligibility_status
        distinguishing_aspect: "With three applicants under one declaration, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns 1 row with has_more false, and eligibility_status=ELIGIBLE returns exactly the 1 determined applicant."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4932 with three applicants; only the first is determined ELIGIBLE."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4932", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_a_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "Coastal Tribal Nation", applicant_type: "TRIBE", population_served: 8000 }
              as: PlatformAdmin
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "State Transport Agency", applicant_type: "STATE_AGENCY", population_served: 900000 }
              as: PlatformAdmin
            - call: "POST /public-assistance/applicants/${applicant_a_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "Local government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "GET /public-assistance/applicants?disaster_id=${disaster_id}&limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /public-assistance/applicants?disaster_id=${disaster_id}&limit=2&offset=2"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /public-assistance/applicants?disaster_id=${disaster_id}&eligibility_status=ELIGIBLE"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "first call: HTTP 200, response_type == 'array', len(data) == 2, total_count == 3, has_more == true"
            - "second call: len(data) == 1, total_count == 3, has_more == false"
            - "third call: len(data) == 1, total_count == 1, has_more == false, data[0].id == ${applicant_a_id}"
            - "third call: data[0].eligibility_status == ELIGIBLE"

      - name: every_single_resource_get_with_unknown_id_returns_its_own_not_found
        claim_type: not_found
        grounds:
          - validations[priority 4]
          - errors[ERR_DISASTER_NOT_FOUND]
          - errors[ERR_APPLICANT_NOT_FOUND]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_DAMAGE_SITE_NOT_FOUND]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_COST_LINE_ITEM_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_DRAWDOWN_NOT_FOUND]
          - errors[ERR_PROGRESS_REPORT_NOT_FOUND]
          - errors[ERR_DEOBLIGATION_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
        distinguishing_aspect: "Each of the thirteen single-resource GETs answers an unknown uuid with its own entity-specific 404 id, never a generic ERR_NOT_FOUND and never 200 with a null body."
        test_recipe:
          setup:
            - "Empty database apart from the clock call; the uuid 00000000-0000-0000-0000-000000000000 exists in no table."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /public-assistance/disasters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_disaster: $.data.error_id }
            - call: "GET /public-assistance/applicants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_applicant: $.data.error_id }
            - call: "GET /public-assistance/facilities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_facility: $.data.error_id }
            - call: "GET /public-assistance/damage-sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_damage_site: $.data.error_id }
            - call: "GET /public-assistance/projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_project: $.data.error_id }
            - call: "GET /public-assistance/cost-line-items/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_line: $.data.error_id }
            - call: "GET /public-assistance/force-account-resources/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_resource: $.data.error_id }
            - call: "GET /public-assistance/contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_contract: $.data.error_id }
            - call: "GET /public-assistance/insurance-policies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_policy: $.data.error_id }
            - call: "GET /public-assistance/drawdowns/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_drawdown: $.data.error_id }
            - call: "GET /public-assistance/progress-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_report: $.data.error_id }
            - call: "GET /public-assistance/deobligations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_deobligation: $.data.error_id }
            - call: "GET /public-assistance/appeals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_appeal: $.data.error_id }
          assert:
            - "every call: HTTP 404 with response_type == 'error'"
            - "${err_disaster} == ERR_DISASTER_NOT_FOUND"
            - "${err_applicant} == ERR_APPLICANT_NOT_FOUND"
            - "${err_facility} == ERR_FACILITY_NOT_FOUND"
            - "${err_damage_site} == ERR_DAMAGE_SITE_NOT_FOUND"
            - "${err_project} == ERR_PROJECT_NOT_FOUND"
            - "${err_line} == ERR_COST_LINE_ITEM_NOT_FOUND"
            - "${err_resource} == ERR_RESOURCE_NOT_FOUND"
            - "${err_contract} == ERR_CONTRACT_NOT_FOUND"
            - "${err_policy} == ERR_POLICY_NOT_FOUND"
            - "${err_drawdown} == ERR_DRAWDOWN_NOT_FOUND"
            - "${err_report} == ERR_PROGRESS_REPORT_NOT_FOUND"
            - "${err_deobligation} == ERR_DEOBLIGATION_NOT_FOUND"
            - "${err_appeal} == ERR_APPEAL_NOT_FOUND"

      - name: applicant_creation_missing_applicant_type_rejected
        claim_type: required_fields
        grounds:
          - validations[priority 5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /public-assistance/applicants]
          - entities.Applicant.fields.applicant_type
        distinguishing_aspect: "applicant_type has source input and no default, so omitting it returns ERR_INVALID_REQUEST 422 and no Applicant row is created (the declaration's applicant list stays empty)."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4933 with no applicants yet."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4933", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", population_served: 120000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with ${err} == ERR_INVALID_REQUEST"
            - "GET /public-assistance/applicants?disaster_id=${disaster_id} -> total_count == 0"

      - name: facility_creation_omitted_flags_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.fields.in_active_use
          - entities.Facility.fields.legal_responsibility_documented
          - entities.Facility.fields.flood_zone
          - entities.Facility.fields.prior_disaster_flood_damage
          - endpoints[POST /public-assistance/facilities]
        distinguishing_aspect: "Omitting all four optional boolean flags yields in_active_use true, legal_responsibility_documented true, flood_zone false and prior_disaster_flood_damage false, with eligibility_status PENDING and screened_at null."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4934 with applicant 'City of Harborview' (LOCAL_GOVERNMENT)."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4934", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Facility.${facility_id}.in_active_use == true"
            - "Facility.${facility_id}.legal_responsibility_documented == true"
            - "Facility.${facility_id}.flood_zone == false"
            - "Facility.${facility_id}.prior_disaster_flood_damage == false"
            - "Facility.${facility_id}.eligibility_status == PENDING"
            - "Facility.${facility_id}.screening_failure_reason == null"
            - "Facility.${facility_id}.screened_at == null"
            - "Facility.${facility_id}.version == 1"

      - name: project_computed_basis_fields_start_zeroed_and_work_type_derived_at_submit
        claim_type: computed_fields
        grounds:
          - entities.Project.fields.work_type
          - entities.Project.fields.size_class
          - entities.Project.fields.eligible_cost_final_cents
          - endpoints[POST /public-assistance/projects]
          - state_machines.Project.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: "A freshly created category-C project carries size_class null, every basis and ledger integer 0, eligible_cost_final_cents null, federal_share_final_cents null and closeout_variance_cents null; work_type is only minted at submit, where category C yields PERMANENT."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4935, applicant ELIGIBLE, facility ELIGIBLE."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4935", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "Local government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
