            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "L1", rcv_cents: 50000, depreciation_pct: 10 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "v1", photo_count: 3 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /reports/${rpt_id}/qa-decision", payload: { decision: "REVISION_REQUESTED", qa_notes: "redo" }, as: QAReviewer, as_user_id: "${qa_id}" }
          assert:
            - "Report(${rpt_id}).status == REVISION_REQUESTED"
            - "Inspection(${insp_id}).status == REOPENED"
            - "Assignment(${asg_id}).work_status == FIELDWORK"
            - "Claim(${claim_id}).status == IN_PROGRESS"

      - name: payment_close_cascade_depth2
        grounds:
          - state_machines.FeeBill.APPROVED_to_PAID
          - state_machines.Assignment.BILLED_to_PAID
          - state_machines.Claim.SETTLED_to_CLOSED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (payment): FeeBill PAID -> (causes) Assignment
          billing_status PAID -> (causes) Claim CLOSED; distinct origin from the QA-revision cascade.
        test_recipe:
          setup:
            - "Field adjuster A, QA reviewer B; the claim's single assignment reached WORK_COMPLETE, its Report QA-APPROVED (Claim SETTLED), and a fee bill APPROVED"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A8", email: "a8@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /adjusters", payload: { full_name: "B8", email: "b8@x.com", adjuster_type: "STAFF", home_state: "FL" }, as: LicensingAdmin, captures: { qa_id: $.data.id } }
