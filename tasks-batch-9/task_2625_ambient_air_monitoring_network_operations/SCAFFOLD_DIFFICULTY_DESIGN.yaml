        grounds:
          - state_machines.ExceptionalEventDemonstration.SUBMITTED_to_CONCURRED
          - state_machines.EventExclusion.PROPOSED_to_EFFECTIVE
          - state_machines.DesignValue.PROVISIONAL_to_SUPERSEDED
          - calculations.batch_hour_accounting
          - entities.DesignValue.fields.stale_reason
        distinguishing_aspect: |
          Depth-4 chain from POST /exceptional-event-demonstrations/{id}/determination with CONCUR, each hop caused by the
          previous one and not by the original call: hop 1 CONCURRED -> hop 2 its PROPOSED EventExclusion becomes EFFECTIVE
          -> hop 3 that EFFECTIVE row re-runs batch_hour_accounting on 2024 Q3 (adjusted 2208 -> 2016) -> hop 4 the changed
