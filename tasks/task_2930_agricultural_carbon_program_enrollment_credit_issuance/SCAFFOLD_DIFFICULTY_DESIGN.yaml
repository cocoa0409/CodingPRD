            - "after revise: QuantificationRun.${r1_id}.net_removals_t == 283.360 (the calculation re-ran on re-entry and reproduced the same value from the unchanged packet set)"
            - "after the QUALIFIED opinion: Verification.${v2_id}.opinion == QUALIFIED and QuantificationRun.${r1_id}.status == SUBMITTED (the run did NOT advance)"
            - "after resample: Verification.${v2_id}.opinion == PENDING, Verification.${v2_id}.sample_pct == 40.00 and Verification.${v2_id}.resample_count == 1"
            - "after the POSITIVE opinion: Verification.${v2_id}.opinion == POSITIVE and QuantificationRun.${r1_id}.status == VERIFIED"
            - "QuantificationRun.${r1_id}.revision_count is still 1 (the QUALIFIED self-loop and the resample must not increment it)"
            - "Verification.${v1_id}.opinion is still ADVERSE and Verification.${v1_id}.resample_count == 0 (the first verification stayed terminal)"

      - name: data_packet_parallel_qc_and_completeness_axes
        grounds:
          - state_machines.DataPacket
          - calculations.data_packet_qc_score
          - entities.DataPacket.fields.qc_status
          - entities.DataPacket.fields.completeness_status
          - entities.DataPacket.fields.correction_count
          - endpoints[POST /data-packets/{data_packet_id}/correct]
        distinguishing_aspect: |
          DataPacket carries TWO independent state dimensions. The qc axis is driven only by the
          qc/correct/reject endpoints and cycles PENDING -> FLAGGED -> PENDING -> PASSED, while
          the completeness axis is re-derived from coverage_pct on create and on every correction
          and is never touched by a qc decision. The correction drops coverage 92.00 -> 80.00,
          which flips completeness COMPLETE -> PARTIAL and re-scores qc_score 96.00 -> 90.00, so
          the packet finishes in the combined state (qc PASSED, completeness PARTIAL) that a
          single-status implementation cannot represent.
