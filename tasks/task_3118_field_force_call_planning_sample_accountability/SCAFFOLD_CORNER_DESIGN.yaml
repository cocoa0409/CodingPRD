# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3118_field_force_call_planning_sample_accountability
#
# Breadth probe over §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. §1.8-covered corners appear as
# excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: region_create_returns_201_with_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Region
          - endpoints.POST_/field-force/regions
        distinguishing_aspect: "A region created with only region_code and name returns 201 with status ACTIVE, version 1, and server-minted id/created_at/updated_at."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /field-force/regions"
              payload: { region_code: "PNW-01", name: "Pacific Northwest" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Region.${r_id}.status == ACTIVE and version == 1"
            - "Region.${r_id}.id is a hyphenated UUID with no type prefix"
            - "created_at and updated_at are non-null ISO8601 with three fractional digits"

      - name: product_get_round_trips_storage_band_and_caps
        claim_type: Retrieval
        grounds:
          - entities.Product
          - endpoints.GET_/field-force/products/{id}
        distinguishing_aspect: "Every product configuration field (controlled flag, both caps, both temperature bounds) round-trips unchanged through GET."
        test_recipe:
          setup:
            - "One product registered."
          setup_api_calls:
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0100", brand_name: "Metabolex", controlled: true, per_visit_max_units: 3, annual_max_units_per_prescriber: 30, storage_temp_min_c: -20.0, storage_temp_max_c: -10.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /field-force/products/${p_id}"
              payload: {}
              as: FieldRep
              as_user_id: "any-rep-id"
          assert:
            - "the response status is 200"
            - "Product.${p_id}.controlled == true and per_visit_max_units == 3"
            - "Product.${p_id}.storage_temp_min_c == -20.0 and storage_temp_max_c == -10.0"

      - name: prescriber_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/field-force/prescribers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three prescribers listed with limit=2 return total_count 3 and has_more true; offset=2 returns 1 row with has_more false; unfiltered GET uses defaults limit=10 offset=0."
        test_recipe:
          setup:
            - "Three prescribers registered."
          setup_api_calls:
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2000000001", full_name: "Dr. A", state_license_number: "S-1", specialty_code: "207Q00000X" }
              as: PlatformAdmin
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2000000002", full_name: "Dr. B", state_license_number: "S-2", specialty_code: "207Q00000X" }
              as: PlatformAdmin
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2000000003", full_name: "Dr. C", state_license_number: "S-3", specialty_code: "207R00000X" }
              as: PlatformAdmin
          trigger:
            - call: "GET /field-force/prescribers"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with eligibility_status=PENDING_REVIEW returns all 3 rows (default status after registration)"

      - name: territory_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/field-force/territories/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A well-formed but unallocated UUID yields 404 ERR_NOT_FOUND — not 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /field-force/territories/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

      - name: territory_create_missing_budget_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Territory.fields.cycle_sample_budget_units
          - endpoints.POST_/field-force/regions/{regionId}/territories
          - validations[priority=4]
        distinguishing_aspect: "Omitting the required cycle_sample_budget_units fails with ERR_INVALID_REQUEST 400 before any state or business check runs."
        test_recipe:
          setup:
            - "One region exists."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "MT-01", name: "Mountain" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TX1", name: "No Budget", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: prescriber_status_input_ignored_defaults_to_pending_review
        claim_type: Defaults
        grounds:
          - entities.Prescriber.fields.eligibility_status
        distinguishing_aspect: "eligibility_status is never client-supplied: a fresh registration is PENDING_REVIEW regardless of any status field smuggled into the payload."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2100000001", full_name: "Dr. Default", state_license_number: "S-9", specialty_code: "207Q00000X", eligibility_status: "ELIGIBLE" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
          assert:
            - "Prescriber.${h_id}.eligibility_status == PENDING_REVIEW (client-supplied status ignored or rejected, never honored)"

      - name: target_entry_planned_calls_input_ignored_tier_mapping_applies
        claim_type: Computed Fields
        grounds:
          - entities.TargetListEntry.fields.planned_calls_per_cycle
          - calculations.territory_sample_allocation_rounding
        distinguishing_aspect: "planned_calls_per_cycle is computed from tier (A=12, B=6, C=2); a client-supplied value is ignored."
        test_recipe:
          setup:
            - "Region, territory (budget 100), prescriber, product exist."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "NW-02", name: "Northwest 2" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TT", name: "Tacoma", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2200000001", full_name: "Dr. Tier", state_license_number: "S-10", specialty_code: "207Q00000X" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0200", brand_name: "Tierol", controlled: false, per_visit_max_units: 5, annual_max_units_per_prescriber: 50, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /field-force/territories/${t_id}/target-list-entries"
              payload: { prescriber_id: "${h_id}", product_id: "${p_id}", tier: "B", planned_sample_units: 30, planned_calls_per_cycle: 99 }
              as: DistrictManager
              captures: { e_id: $.data.id }
          assert:
            - "TargetListEntry.${e_id}.planned_calls_per_cycle == 6 (tier B mapping; the 99 is ignored)"
            - "TargetListEntry.${e_id}.delivered_calls == 0 and delivered_sample_units == 0"

      - name: excursion_severity_input_ignored_computed_at_creation
        claim_type: Computed Fields
        grounds:
          - entities.TemperatureExcursion.fields.severity
          - calculations.temperature_excursion_severity
        distinguishing_aspect: "Observed 9.5C against a 2..8 band with 45 minutes gives outside=1.5, minutes>30 => MAJOR; a payload-supplied severity is ignored."
        test_recipe:
          setup:
            - "Rep and product (band 2..8) exist."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "NM-01", name: "New Mexico" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TAB", name: "Albuquerque", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /field-force/territories/${t_id}/representatives"
              payload: { employee_id: "E70001", full_name: "Rep Flo", hire_date: "2021-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0201", brand_name: "Thermol", controlled: false, per_visit_max_units: 5, annual_max_units_per_prescriber: 50, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /field-force/temperature-excursions"
              payload: { product_id: "${p_id}", location_type: "VEHICLE", observed_temp_c: 9.5, excursion_minutes: 45, severity: "MINOR" }
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { ex_id: $.data.id }
          assert:
            - "TemperatureExcursion.${ex_id}.severity == MAJOR (computed; client MINOR ignored)"
            - "TemperatureExcursion.${ex_id}.status == REPORTED"

      - name: enum_validation_rejects_unknown_tier_and_reason_code
        claim_type: Type Constraints
        grounds:
          - entities.TargetListEntry.fields.tier
          - entities.SampleTransfer.fields.reason_code
          - validations[priority=4]
        distinguishing_aspect: "tier 'D' and reason_code 'BECAUSE' are not enum members; both fail with ERR_INVALID_REQUEST 400 at the shape-check priority."
        test_recipe:
          setup:
            - "Territory, prescriber, product exist."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "OK-01", name: "Oklahoma" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TOK", name: "Oklahoma City", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2300000001", full_name: "Dr. Enum", state_license_number: "S-11", specialty_code: "207Q00000X" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0202", brand_name: "Enumol", controlled: false, per_visit_max_units: 5, annual_max_units_per_prescriber: 50, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /field-force/territories/${t_id}/target-list-entries"
              payload: { prescriber_id: "${h_id}", product_id: "${p_id}", tier: "D", planned_sample_units: 10 }
              as: DistrictManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: call_plan_publish_moves_draft_to_published_and_sets_territory_posture
        claim_type: Valid Transition
        grounds:
          - state_machines.CallPlan.DRAFT_to_PUBLISHED
          - endpoints.POST_/field-force/call-plans/{id}/publish
        distinguishing_aspect: "A DRAFT plan over a territory with one ACTIVE entry publishes cleanly: status PUBLISHED, published_at equals the logical clock, Territory.alignment_posture PUBLISHED."
        test_recipe:
          setup:
            - "Territory (budget 100) with one ACTIVE tier-C entry; DRAFT plan exists."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "MN-01", name: "Minnesota" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TMP", name: "Minneapolis", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2400000001", full_name: "Dr. Plan", state_license_number: "S-12", specialty_code: "207Q00000X" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0203", brand_name: "Planol", controlled: false, per_visit_max_units: 5, annual_max_units_per_prescriber: 50, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /field-force/territories/${t_id}/target-list-entries"
              payload: { prescriber_id: "${h_id}", product_id: "${p_id}", tier: "C", planned_sample_units: 10 }
              as: DistrictManager
              captures: { e_id: $.data.id }
            - call: "POST /field-force/call-plans"
              payload: { territory_id: "${t_id}", cycle_label: "2026-Q4", expected_territory_version: "${t_v}" }
              as: DistrictManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /field-force/call-plans/${plan_id}/publish"
              payload: {}
              as: DistrictManager
            - call: "GET /field-force/territories/${t_id}"
              payload: {}
              as: DistrictManager
          assert:
            - "CallPlan.${plan_id}.status == PUBLISHED and published_at == 2026-09-01T00:00:00Z (default clock)"
            - "Territory.${t_id}.alignment_posture == PUBLISHED"

      - name: publish_with_empty_target_list_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CallPlan.DRAFT_to_PUBLISHED
          - errors.ERR_EMPTY_TARGET_LIST
        distinguishing_aspect: "A territory whose only entry was never added (zero ACTIVE entries) cannot publish: ERR_EMPTY_TARGET_LIST 409."
        test_recipe:
          setup:
            - "Territory with NO target entries; DRAFT plan."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "IA-01", name: "Iowa" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TDM", name: "Des Moines", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /field-force/call-plans"
              payload: { territory_id: "${t_id}", cycle_label: "2026-Q4", expected_territory_version: "${t_v}" }
              as: DistrictManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /field-force/call-plans/${plan_id}/publish"
              payload: {}
              as: DistrictManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_EMPTY_TARGET_LIST"
            - "CallPlan.${plan_id}.status remains DRAFT"

      - name: double_complete_of_visit_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CallVisit.SCHEDULED_to_COMPLETED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The second complete on an already-COMPLETED visit is not idempotent: ERR_INVALID_STATE 409 and delivered_calls is not double-counted."
        test_recipe:
          setup:
            - "Rep, ELIGIBLE prescriber, published plan; visit completed once at default clock (scheduled 2026-08-31 08:00-09:00)."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "KS-01", name: "Kansas" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TWI", name: "Wichita", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /field-force/territories/${t_id}/representatives"
              payload: { employee_id: "E71001", full_name: "Rep Gus", hire_date: "2021-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2500000001", full_name: "Dr. Twice", state_license_number: "S-13", specialty_code: "207Q00000X" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /field-force/prescribers/${h_id}/verify-eligibility"
              payload: { outcome: "PASS" }
              as: ComplianceOfficer
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0204", brand_name: "Twicol", controlled: false, per_visit_max_units: 5, annual_max_units_per_prescriber: 50, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /field-force/territories/${t_id}/target-list-entries"
              payload: { prescriber_id: "${h_id}", product_id: "${p_id}", tier: "B", planned_sample_units: 20 }
              as: DistrictManager
              captures: { e_id: $.data.id }
            - call: "POST /field-force/call-plans"
              payload: { territory_id: "${t_id}", cycle_label: "2026-Q4", expected_territory_version: "${t_v}" }
              as: DistrictManager
              captures: { plan_id: $.data.id }
            - call: "POST /field-force/call-plans/${plan_id}/publish"
              payload: {}
              as: DistrictManager
              as_user_id: "${rep_id}"
            - call: "POST /field-force/call-visits"
              payload: { call_plan_id: "${plan_id}", target_list_entry_id: "${e_id}", scheduled_start: "2026-08-31T08:00:00Z", scheduled_end: "2026-08-31T09:00:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { v1: $.data.id }
            - call: "POST /field-force/call-visits/${v1}/complete"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /field-force/call-visits/${v1}/complete"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
            - call: "GET /field-force/target-list-entries/${e_id}"
              payload: {}
              as: DistrictManager
          assert:
            - "second complete returns 409 ERR_INVALID_STATE"
            - "TargetListEntry.${e_id}.delivered_calls == 1 (no double count)"

      - name: cancelled_visit_is_terminal_and_rejects_no_show
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CallVisit
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From CANCELLED (a terminal state) every trigger — including mark-no-show — fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Rep, ELIGIBLE prescriber, published plan; visit scheduled 2026-09-02 then cancelled."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "NE-09", name: "Nebraska" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TOM", name: "Omaha", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /field-force/territories/${t_id}/representatives"
              payload: { employee_id: "E71002", full_name: "Rep Han", hire_date: "2021-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /field-force/prescribers"
              payload: { npi_number: "2500000002", full_name: "Dr. Term", state_license_number: "S-14", specialty_code: "207Q00000X" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0205", brand_name: "Termol", controlled: false, per_visit_max_units: 5, annual_max_units_per_prescriber: 50, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /field-force/territories/${t_id}/target-list-entries"
              payload: { prescriber_id: "${h_id}", product_id: "${p_id}", tier: "C", planned_sample_units: 10 }
              as: DistrictManager
              captures: { e_id: $.data.id }
            - call: "POST /field-force/call-plans"
              payload: { territory_id: "${t_id}", cycle_label: "2026-Q4", expected_territory_version: "${t_v}" }
              as: DistrictManager
              captures: { plan_id: $.data.id }
            - call: "POST /field-force/call-plans/${plan_id}/publish"
              payload: {}
              as: DistrictManager
              as_user_id: "${rep_id}"
            - call: "POST /field-force/call-visits"
              payload: { call_plan_id: "${plan_id}", target_list_entry_id: "${e_id}", scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T09:00:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { v1: $.data.id }
            - call: "POST /field-force/call-visits/${v1}/cancel"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /field-force/call-visits/${v1}/mark-no-show"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "mark-no-show from CANCELLED returns 409 ERR_INVALID_STATE"
            - "CallVisit.${v1}.call_status remains CANCELLED"

