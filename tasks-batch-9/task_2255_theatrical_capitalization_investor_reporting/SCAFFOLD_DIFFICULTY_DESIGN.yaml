- rule_id: combinatorial_formula
  applies: true
  rationale: |
    Three distinct compound-formula shapes are present. (a) wrap_settlement's pool charge
    is a nested min(max(round(base * pct), floor), base) — three clamps that must compose
    in the declared order. (b) royalty_pool_split rounds per participant and then pins a
    signed residue on the highest-pool_points participant, so rounding order changes the
    per-participant cents. (c) break_even_analysis is circular: the royalty pool depends
    on adjusted gross, which depends on the gross being solved for, so a seeded
    monotone walk is required.
  instances:
  - name: pool_charge_nested_clamp_floor_then_cap_ordering
    grounds:
    - '§1.3 wrap_settlement: royalty_pool_cents = min(max(round(royalty_base_cents * pool_pct), pool_floor_cents), royalty_base_cents)'
    - §1.1 RoyaltyParticipant.min_guarantee_cents (aggregate floor 800,000)
    - §1.1 WeeklyWrap.royalty_pool_cents, .weekly_operating_profit_cents
    distinguishing_aspect: |
      Two wraps straddle the region where the clamps bind in opposite directions. With
      running expenses 59,750,000 the royalty base is 2,000,000, so 35% = 700,000 is
      below the 800,000 floor and the floor lifts the charge (profit 1,200,000). With
      running expenses 61,250,000 the base is only 500,000, so the floor (800,000)
      would exceed the base and the outer cap pulls the charge back down to exactly
      500,000 (profit 0, never negative). An implementation that applies min before
      max returns 500,000 in the first case and 500,000 in the second; one that omits
      the cap returns 800,000 in the second and a negative profit of -300,000.
    test_recipe:
      setup:
      - |-
        BASE chain on POOL basis through RUNNING, no wraps yet. Two consecutive weeks
        are certified with the same gross (65,000,000) and attendance (8,200) but
        running expenses chosen to place the royalty base on either side of the
        800,000 aggregate floor: W3 week ending 2026-09-06 with 59,750,000 (base
        2,000,000) and W4 week ending 2026-09-13 with 61,250,000 (base 500,000).
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Belasco House
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
        as: GeneralManager
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Ledger
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 2000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        captures:
          pr: $.data.id
      - call: POST /operating-budgets
        payload:
          production_id: ${pr}
          weekly_fixed_running_cost_cents: 32000000
          variable_cost_pct: 0.05
          performances_per_week: 8
        as: GeneralManager
        captures:
          ob: $.data.id
      - call: POST /operating-budgets/${ob}/activate
        payload: {}
        as: Comptroller
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: A. Author
          role: AUTHOR
          fixed_gross_pct: 0.04
          pool_points: 4
          min_guarantee_cents: 400000
        as: GeneralManager
        captures:
          rp1: $.data.id
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: C. Composer
          role: COMPOSER
