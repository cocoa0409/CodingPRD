      - name: outage_credit_variants_diverge_on_the_same_window
        claim_type: variant_divergence
        grounds:
          - calculations.outage_credit_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / outage_credit_provisional_event_level_vs_final_daily_prorated_diverge
          rationale: "Both variants and the exact delta on the same midnight-straddling window are computed and asserted by that §1.8 instance."

      - name: cell_availability_variant_selected_by_read_versus_write_path
        claim_type: variant_selection
        grounds:
          - calculations.cell_slot_availability.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / cell_availability_read_reports_waitlist_only_while_admission_path_reserves
          rationale: "That §1.8 instance pins which variant each path selects on identical stored data (advertised_strict on the read, admission_expiry_aware on the write)."

      - name: credit_ledger_reconciled_when_the_variant_switches
        claim_type: reconciliation
        grounds:
          - calculations.outage_credit_amount.variants
          - entities.Subscriber.fields.pending_credit_cents
        excluded_because:
          difficulty_instance: compensating_invariant / credit_ledger_conserved_when_a_submitted_outage_credit_is_rejected
          rationale: "The ledger movement on variant switch (pending_credit_cents released, credit_balance_cents debited or not) is asserted as a conservation invariant by that §1.8 instance."

      - name: cycle_charge_fills_the_overage_bucket_before_the_discount_band
        claim_type: waterfall_allocation
        grounds:
          - calculations.cycle_charge_with_overage_discount
        excluded_because:
          difficulty_instance: combinatorial_formula / cycle_charge_discount_band_keyed_on_gross_total_that_contains_the_overage_fee
          rationale: "The pinned evaluation order (overage fee, then gross total, then band, then single rounding) is the entire subject of that §1.8 instance."

      - name: beam_admission_threshold_at_exactly_the_oversubscription_limit
        claim_type: threshold
        grounds:
          - calculations.beam_weighted_oversubscription
        excluded_because:
          difficulty_instance: boundary_precision_check / activation_admitted_when_projected_ratio_lands_exactly_on_oversubscription_limit
          rationale: "projected_ratio exactly equal to the limit (admitted) versus one step above (rejected) is asserted by that §1.8 instance."

      - name: cell_slot_running_total_correct_after_add_and_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.cell_slot_availability
        excluded_because:
          difficulty_instance: compensating_invariant / cell_slot_ledger_conserved_across_activation_and_termination
          rationale: "The add-then-reverse conservation of committed / reserved / free counters is asserted end-to-end by that §1.8 instance."

  # ===================================================================================
  # SECTION 4 — validations
  # ===================================================================================
  - section: validations
    instances:

      - name: subscriber_creation_missing_x_user_id_header_returns_unauthenticated
        claim_type: violation_error
        grounds:
          - validations[priority=1]
          - 'errors[ERR_UNAUTHENTICATED]'
        distinguishing_aspect: "The priority-1 auth gate outranks everything: a body-valid POST /subscribers with no X-User-ID header returns 401 ERR_UNAUTHENTICATED and persists nothing, so the collection stays empty."
        test_recipe:
          setup:
            - "Clock set; no subscriber rows exist."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: "(none - the X-User-ID header is omitted entirely)"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 401"
            - "trigger response: data.error_id == ERR_UNAUTHENTICATED"
            - "trigger response: data.message is a non-empty string and data.error_id is present in the error envelope"
            - "GET /satellite-broadband/subscribers?limit=10 (as ProvisioningAgent) returns data.total_count == 0"

