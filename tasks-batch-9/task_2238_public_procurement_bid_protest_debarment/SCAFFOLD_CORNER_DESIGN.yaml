              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/solicitations/${c_s41_id}/addenda"
              payload: { summary: "adds a bypass pumping requirement", extends_bid_due_by_days: 0, acknowledgment_required: true, new_requirement_codes: [{ requirement_code: "REQ-ADD", description: "bypass pumping plan", materiality: "MATERIAL", is_waivable: false }] }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
