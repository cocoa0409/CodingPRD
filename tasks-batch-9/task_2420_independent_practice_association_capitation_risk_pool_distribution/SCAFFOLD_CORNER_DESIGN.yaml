          - errors.ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: |
          PhysicianMember's parent is the path agreement; an unknown
          agreementId must fail with 404 ERR_AGREEMENT_NOT_FOUND at priority 4,
          before the body is even validated, so a body that is ALSO missing
          full_name still returns the 404 rather than the 400.
        test_recipe:
          setup:
