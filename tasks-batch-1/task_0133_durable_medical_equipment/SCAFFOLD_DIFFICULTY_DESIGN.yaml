              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-09-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-4", length_of_need_months: 12, signed_date: "2026-08-20" }
              as: PhysicianUser
              captures: { cmn_id: $.data.id }
          trigger:
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CMN_REQUIRED (CMN still DRAFT, not ACTIVE)"
            - "HTTP status == 422"

      - name: activate_billing_requires_confirmed_delivery_pod
        grounds:
          - state_machines.DMEOrder.DELIVERED_to_ACTIVE
          - state_machines.Delivery.SCHEDULED_to_CONFIRMED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair DMEOrder -> Delivery (different pair from order->CMN): a
          DELIVERED order cannot reach activate-billing unless a CONFIRMED Delivery
          with pod_received==true exists. Reaching DELIVERED here requires a CONFIRMED
          delivery, so the negative is observed by attempting activate-billing from a
          state with a FAILED delivery (order never reached DELIVERED).
        test_recipe:
          setup:
            - "CAPPED_RENTAL order (no CMN/auth) READY_FOR_DELIVERY; a scheduled delivery is FAILED (no POD); order is still READY_FOR_DELIVERY (not DELIVERED)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat M", medicare_id: "MBI-M1", date_of_birth: "1938-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup M", ptan: "PTAN-M1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0012", description: "Wheelchair pod dep", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-10-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-10-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/fail"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (order is READY_FOR_DELIVERY, not DELIVERED, because the delivery FAILED)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_cycle_period_overlap_halfopen
        grounds:
          - validations[priority=9]
          - state_machines.RentalBillingCycle.NEW_to_BILLED
          - entities.RentalBillingCycle.fields.period_start_utc
        distinguishing_aspect: |
          On RentalBillingCycle, half-open [start,end) overlap: a back-billed cycle
          whose period_start_utc falls strictly inside an existing cycle's month is
          rejected ERR_CYCLE_OVERLAP, but an exactly-adjacent boundary (next month
          start == prior month end) is allowed.
        test_recipe:
          setup:
            - "CAPPED_RENTAL order monthly 10000 KX ACTIVE; one cycle posted with period_start 2026-01-01 (period_end 2026-02-01)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat N", medicare_id: "MBI-N1", date_of_birth: "1937-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup N", ptan: "PTAN-N1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0013", description: "Wheelchair overlap", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-01-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "Pat N" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: { period_start_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: { period_start_utc: "2026-01-15T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CYCLE_OVERLAP (2026-01-15 is inside [2026-01-01, 2026-02-01))"
            - "HTTP status == 422"

      - name: cpap_resupply_min_gap_buffer
        grounds:
          - validations[priority=10]
          - calculations.cpap_resupply_eligibility
          - state_machines.CPAPResupplyOrder.REQUESTED_to_SHIPPED
        distinguishing_aspect: |
          On CPAPResupplyOrder, a different interval semantics — a min-gap BUFFER of
          90 days between same-supply_kind shipments rather than a [start,end) span
          overlap: a second MASK resupply requested 30 days after the prior SHIPPED
          one is rejected ERR_RESUPPLY_TOO_SOON.
        test_recipe:
          setup:
            - "CPAP order; a MASK resupply shipped at 2026-01-01; a second MASK resupply requested at 2026-01-31 (30 days later)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat P", medicare_id: "MBI-P1", date_of_birth: "1936-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup P", ptan: "PTAN-P1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "E0601B", description: "CPAP device 2", billing_category: "CAPPED_RENTAL", purchase_price_cents: 80000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: true }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /cpap-resupply-orders"
              payload: { order_id: "${order_id}", supply_kind: "MASK", quantity: 1 }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { rs1_id: $.data.id }
            - call: "POST /cpap-resupply-orders/${rs1_id}/ship"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cpap-resupply-orders"
              payload: { order_id: "${order_id}", supply_kind: "MASK", quantity: 1 }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { rs2_id: $.data.id }
          trigger:
            - call: "POST /cpap-resupply-orders/${rs2_id}/ship"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_RESUPPLY_TOO_SOON (gap 30 days < 90)"
            - "HTTP status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: recoupment_ledger_cents_conserved
        grounds:
          - state_machines.Audit.OPEN_to_UPHELD
          - calculations.order_total_allowed
          - entities.ClaimLine.fields.allowed_amount_cents
        distinguishing_aspect: |
          Conserved quantity = the order ledger identity total_allowed_cents == sum
          of allowed_amount_cents over non-VOID ClaimLine rows. After recoupment the
          two negative RECOUPMENT lines exactly offset the voided originals so the
          identity holds with zero drift: total == -20000 == sum of the two -10000 lines.
        test_recipe:
          setup:
            - "CAPPED_RENTAL order monthly 10000 KX ACTIVE; 2 cycles posted (total 20000); audit OPEN reason OVERBILLED_PAST_CAP."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Q", medicare_id: "MBI-Q1", date_of_birth: "1935-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup Q", ptan: "PTAN-Q1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0014", description: "Wheelchair ledger", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-11-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-11-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "Pat Q" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /audits"
              payload: { order_id: "${order_id}", reason_code: "OVERBILLED_PAST_CAP" }
              as: PayerReviewer
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /audits/${audit_id}/uphold"
              payload: {}
              as: PayerReviewer
            - call: "GET /dme-orders/${order_id}"
              payload: {}
              as: PayerReviewer
              captures: { total_after: $.data.total_allowed_cents }
            - call: "GET /claim-lines?order_id=${order_id}"
              payload: {}
              as: PayerReviewer
          assert:
            - "DMEOrder.${order_id}.total_allowed_cents == -20000 after uphold"
            - "Sum of allowed_amount_cents over non-VOID ClaimLine rows for the order == -20000 (identity holds, no drift)"

      - name: cmn_supersede_active_count_conserved
        grounds:
          - state_machines.CMN.DRAFT_to_ACTIVE
          - state_machines.CMN.ACTIVE_to_SUPERSEDED
          - entities.CMN.fields.superseded_by_id
        distinguishing_aspect: |
          A different conserved quantity (a COUNT, not money): the number of ACTIVE
          CMN per order is invariant at exactly 1 across a supersede. Activating CMN#2
          flips CMN#1 ACTIVE->SUPERSEDED in the same step, so post-condition the order
          still has exactly one ACTIVE CMN and CMN#1.superseded_by_id == CMN#2.id.
        test_recipe:
          setup:
            - "CAPPED_RENTAL order with CMN#1 ACTIVE; CMN#2 created DRAFT for the same order."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat R", medicare_id: "MBI-R1", date_of_birth: "1934-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup R", ptan: "PTAN-R1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0015", description: "Wheelchair supersede", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-12-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-5", length_of_need_months: 12, signed_date: "2026-11-20" }
              as: PhysicianUser
              captures: { cmn1_id: $.data.id }
            - call: "POST /cmns/${cmn1_id}/activate"
              payload: { expected_order_version: "${order_v0}" }
              as: PhysicianUser
            - call: "GET /dme-orders/${order_id}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_v1: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-6", length_of_need_months: 24, signed_date: "2026-11-25" }
              as: PhysicianUser
              captures: { cmn2_id: $.data.id }
          trigger:
            - call: "POST /cmns/${cmn2_id}/activate"
              payload: { expected_order_version: "${order_v1}" }
              as: PhysicianUser
            - call: "GET /cmns/${cmn1_id}"
              payload: {}
              as: PhysicianUser
              captures: { cmn1_status: $.data.status, cmn1_super: $.data.superseded_by_id }
            - call: "GET /cmns?order_id=${order_id}&status=ACTIVE"
              payload: {}
              as: PhysicianUser
          assert:
            - "CMN.${cmn1_id}.status == SUPERSEDED"
            - "CMN.${cmn1_id}.superseded_by_id == ${cmn2_id}"
            - "Exactly one ACTIVE CMN remains for the order (count conserved at 1), and it is ${cmn2_id}"
