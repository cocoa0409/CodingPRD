  # ==========================================================================
  # RULE 4 — transitive_cascade
  # Instance (i) is triggered by a RETURN ScanEvent and is 4 hops deep.
  # Instance (ii) is triggered by a LossAssessment resolve (a different
  # transition on a different entity) and is 5 hops deep.
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_scan_promotes_cooperation_tier_which_reprices_the_next_accrual
        grounds:
          - state_machines.Keg.IN_TRADE_to_IN_SERVICE
          - calculations.cooperation_tier_promotion
          - calculations.return_incentive
          - entities.Distributor.fields.cooperation_tier
          - entities.Distributor.fields.on_time_return_pct
          - entities.ReturnIncentiveAccrual.fields.cooperation_multiplier_bp
        distinguishing_aspect: |
          Depth 4, triggered by POST /kegs/{keg_id}/scan with scan_point = RETURN:
          scan -> ReturnIncentiveAccrual minted (valued at the tier in force) ->
          Distributor return counters recomputed -> cooperation_tier promoted BRONZE to SILVER ->
          the NEXT return's accrual is valued with the new 11500 bp multiplier. The pinned
          order is the point: the third return, which is the one that earns the promotion, must
          still be paid at BRONZE (250), and only the fourth return sees SILVER (288). Promoting
          before valuing would pay 288 on the third accrual and total 1076 instead of 1038.
