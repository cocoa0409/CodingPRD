              captures: { fs_c1_id: $.data.id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_c_id}", state_program_id: "${sp_c_id}", effective_from: "2026-07-01", effective_to: "2026-12-31", membership_fee_cents: 260000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 11 }] }
              as: ProAdministrator
              as_user_id: "${pro_c_id}"
              captures: { fs_c2_id: $.data.id }
            - call: "GET /epr/pros/${pro_c_id}"
              payload: {}
              as: ProAdministrator
              as_user_id: "${pro_c_id}"
              captures: { pro_c_ver_1: $.data.version }
          trigger:
            - call: "POST /epr/fee-schedules/${fs_c1_id}/publish"
              payload: { expected_pro_version: "${pro_c_ver_1}" }
              as: ProAdministrator
              as_user_id: "${pro_c_id}"
            - call: "POST /epr/fee-schedules/${fs_c2_id}/publish"
              payload: { expected_pro_version: "${pro_c_ver_1}" }
              as: ProAdministrator
              as_user_id: "${pro_c_id}"
              captures: { e_occ1: $.data.error_id }
            - call: "GET /epr/pros/${pro_c_id}"
              payload: {}
              as: ProAdministrator
              as_user_id: "${pro_c_id}"
              captures: { pro_c_ver_2: $.data.version }
            - call: "POST /epr/fee-schedules/${fs_c2_id}/publish"
              payload: { expected_pro_version: "${pro_c_ver_2}" }
              as: ProAdministrator
              as_user_id: "${pro_c_id}"
          assert:
            - "First publish: HTTP 200 with FeeSchedule.${fs_c1_id}.status == PUBLISHED, version == 2 and Pro.${pro_c_id}.version == 2"
            - "Second publish with the stale ${pro_c_ver_1}: HTTP 412 with error_id == ERR_STALE_PRO_VERSION"
            - "After the rejection FeeSchedule.${fs_c2_id}.status is still DRAFT with version == 1 and Pro.${pro_c_id}.version is still 2 — a rejected OCC write consumes nothing"
            - "${pro_c_ver_2} == 2 and the retry returns HTTP 200 with FeeSchedule.${fs_c2_id}.status == PUBLISHED and Pro.${pro_c_id}.version == 3"
            - "FeeSchedule.${fs_c1_id}.status stays PUBLISHED — its closed window is not truncated by the later publication"

