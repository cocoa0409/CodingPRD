              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 115000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Eta", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-05-04T09:00:00Z", window_end: "2026-05-04T11:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders/${o_id}/confirm-installation"
              as: StoreManager
            - call: "POST /piano-dealer/service-plans"
              payload: { order_id: "${o_id}", tier: "STANDARD" }
              as: ServiceCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /piano-dealer/technicians"
              payload: { full_name: "Tim Tuner", certification_level: "MASTER" }
              as: StoreManager
              captures: { t_id: $.data.id }
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-03T09:00:00Z", window_end: "2026-06-03T10:00:00Z" }
              as: ServiceCoordinator
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-03T10:00:00Z", window_end: "2026-06-03T11:00:00Z" }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-03T10:00:01Z", window_end: "2026-06-03T11:00:00Z" }
              as: ServiceCoordinator
              captures: { v2: $.data.id }
          assert:
            - "First trigger (shared endpoint 10:00): error_id == ERR_TECHNICIAN_WINDOW_CONFLICT (closed intervals)"
            - "Second trigger (10:00:01 start): succeeds, ServiceVisit.${v2}.status == BOOKED"
            - "ServicePlan.${p_id}.visits_booked == 2"

  # ==================================================================
  # Rule 9: compensating_invariant (different conserved quantities)
  # ==================================================================
  - rule_id: compensating_invariant
    instances:
      - name: consignment_payout_sell_then_return_conserves_ledger
        grounds:
          - calculations.consignment_payout
          - state_machines.SalesOrder.fulfillment_status.INSTALLED_to_RETURNED
          - entities.Consignor.fields.outstanding_payout_cents
        distinguishing_aspect: |
          Conserved quantity: money — Consignor.outstanding_payout_cents. Forward action (full
          payment) posts +1600000; compensating action (complete-return) posts exactly -1600000,
          returning the ledger to 0 with zero drift. Invariant: outstanding == sum(payouts on
          non-returned sales) - sum(reversals).
        test_recipe:
          setup:
            - "GROSS_SPLIT consignor (commission 0.20); consignment instrument 2000000; order PAID_IN_FULL (outstanding 1600000), delivered 2026-05-10, INSTALLED same day"
          setup_api_calls:
            - call: "POST /piano-dealer/consignors"
              payload: { full_name: "Lena Ledger", email: "lena@x.com", commission_pct: 0.20, split_mode: "GROSS_SPLIT", payout_method: "ACH" }
              as: StoreManager
              captures: { g_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-L-1", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 2012, condition_grade: "GOOD", acquisition_type: "CONSIGNMENT", consignor_id: "${g_id}", list_price_cents: 2000000, floor_price_cents: 1500000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Perry Pair", email: "perry@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 2000000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 2015000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Theta", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-05-10T09:00:00Z", window_end: "2026-05-10T12:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders/${o_id}/confirm-installation"
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /piano-dealer/sales-orders/${o_id}/complete-return"
              as: StoreManager
          assert:
            - "Before return (after payment): Consignor.${g_id}.outstanding_payout_cents == 1600000"
            - "After complete-return: Consignor.${g_id}.outstanding_payout_cents == 0 (forward + compensating actions conserve the ledger)"
            - "SalesOrder.${o_id}.payment_status == REFUNDED and fulfillment_status == RETURNED"

      - name: visit_book_then_cancel_conserves_plan_credits
        grounds:
          - state_machines.ServiceVisit.BOOKED_to_CANCELLED
          - entities.ServicePlan.fields.visits_available
          - entities.ServicePlan.fields.visits_booked
        distinguishing_aspect: |
          Conserved quantity: visit credits (count, not money) — visits_used + visits_booked +
          visits_available == visits_total (4) at every step. Booking holds one credit
          (booked 1 / available 3); the compensating cancel releases it (booked 0 / available 4)
          with visits_used untouched.
        test_recipe:
          setup:
            - "INSTALLED order with STANDARD plan (visits_total 4, no visits yet); technician exists"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
