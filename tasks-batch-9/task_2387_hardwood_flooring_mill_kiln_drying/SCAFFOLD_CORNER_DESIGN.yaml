        grounds: ["errors[ERR_PRODUCT_LINE_POSTURE_BLOCKED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / prefinish_release_hold_blocked_by_restricted_product_line"
          rationale: "The named §1.8 instance raises ERR_PRODUCT_LINE_POSTURE_BLOCKED on release_hold against a RESTRICTED line."
