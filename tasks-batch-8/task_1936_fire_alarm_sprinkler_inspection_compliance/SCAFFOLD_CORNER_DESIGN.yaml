            - call: "POST /fire-compliance/modification-permits/${perm_id}/issue"
              payload: {}
              as: FireMarshal
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/modification-permits/${perm_id}/commence-work"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "ModificationPermit.${perm_id}.status == EXPIRED (sweep ran at clock set)"
            - "captured err == ERR_INVALID_STATE"
      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency_version
        grounds: ["concurrency_rules[plan-create-stale-property]"]
        distinguishing_aspect: "Property.version starts at 1 and increments by exactly 1 per mutation: after one plan create it is exactly 2."
        test_recipe:
          setup: ["Property with one plan created"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Version Co", state_license_no: "C-99995" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "1 Ver St", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, v0: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${v0}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "GET /fire-compliance/properties/${prop_id}"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { v1: $.data.version }
          assert:
            - "captured v0 == 1"
            - "captured v1 == 2 (incremented exactly once by the plan create)"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_in_same_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.ProtectedSystem.IN_SERVICE_to_DECOMMISSIONED]
        distinguishing_aspect: "immediate consistency: after decommission returns 200, a GET on the system and a GET on its devices in the SAME test step already reflect DECOMMISSIONED / REMOVED (no async lag)."
        test_recipe:
          setup: ["System with 2 devices, no open impairments/permits"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Immed Co", state_license_no: "C-99996" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "1 Immed St", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SPRINKLER_HEAD", serial_no: "SH-I1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "GAUGE_VALVE", serial_no: "GV-I1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /fire-compliance/systems/${sys_id}/decommission"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "GET /fire-compliance/systems/${sys_id}/devices"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "ProtectedSystem.${sys_id}.status == DECOMMISSIONED in decommission response"
            - "every device in the immediately-following GET list has status == REMOVED"
            - "ProtectedSystem.${sys_id}.impairment_status == OUT_OF_SERVICE"

