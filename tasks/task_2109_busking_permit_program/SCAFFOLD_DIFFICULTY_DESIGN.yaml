scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fee_variant_full_season_vs_prorated_on_identical_application_inputs
        grounds:
          - calculations.permit_fee_assessment
          - entities.FeeInvoice.fields.fee_variant
          - entities.FeeInvoice.fields.amount_due_cents
          - entities.FeeInvoice.fields.months_covered
          - entities.FeeInvoice.fields.coverage_start_month
          - state_machines.PermitApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          This dual variant lives in the MONEY domain (FeeInvoice): two applications with byte-identical
          act_type and amplification inputs produce gross_fee_cents 15000 on both, yet amount_due_cents
          16200 under FULL_SEASON and 6750 under PRORATED, because the only differing input is the
          logical-clock month at approval.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-15T09:00:00Z (month 3, at or before PRORATION_CUTOFF_MONTH)."
            - "One zone exists. Performer Mira has a STREET_THEATRE, non-amplified 2026 application that has been reviewed and approved, minting an INITIAL FeeInvoice."
            - "Clock then moves to 2026-08-01T00:00:00Z (month 8, after the cutoff). Performer Nell holds an identical STREET_THEATRE, non-amplified 2026 application, reviewed and waiting on a decision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T09:00:00Z" }
              as: PermitOfficer
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Mira Solt", stage_name: "Mira", email: "mira@example.org", act_type: "STREET_THEATRE" }
              as: PermitOfficer
              captures: { perf_m: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_m}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "STREET_THEATRE", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_m}"
              captures: { app_m: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_m}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_m}"
            - call: "POST /busking/permit-applications/${app_m}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_m}/decision"
              payload: { outcome: "APPROVED", decision_note: "March issue" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_m}"
              as: PermitOfficer
              captures: { permit_m: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_m}/fee-invoices"
              as: PermitOfficer
              captures: { inv_m: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /busking/performers"
              payload: { legal_name: "Nell Rourke", stage_name: "Nell", email: "nell@example.org", act_type: "STREET_THEATRE" }
              as: PermitOfficer
              captures: { perf_n: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_n}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "STREET_THEATRE", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_n}"
              captures: { app_n: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_n}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_n}"
            - call: "POST /busking/permit-applications/${app_n}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /busking/permit-applications/${app_n}/decision"
              payload: { outcome: "APPROVED", decision_note: "August issue" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_n}"
              as: PermitOfficer
              captures: { permit_n: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_n}/fee-invoices"
              as: PermitOfficer
              captures: { inv_n: "$.data[0].id" }
          assert:
            - 'FeeInvoice.${inv_m}.gross_fee_cents == 15000'
            - 'FeeInvoice.${inv_n}.gross_fee_cents == 15000'
            - 'FeeInvoice.${inv_m}.fee_variant == "FULL_SEASON"'
            - 'FeeInvoice.${inv_m}.months_covered == 12'
            - 'FeeInvoice.${inv_m}.coverage_start_month == 1'
            - 'FeeInvoice.${inv_m}.amount_due_cents == 16200'
            - 'FeeInvoice.${inv_n}.fee_variant == "PRORATED"'
            - 'FeeInvoice.${inv_n}.months_covered == 5'
            - 'FeeInvoice.${inv_n}.coverage_start_month == 8'
            - 'FeeInvoice.${inv_n}.amount_due_cents == 6750'
            - 'PermitApplication.${app_m}.assessed_fee_cents == 16200'
            - 'PermitApplication.${app_n}.assessed_fee_cents == 6750'

      - name: conduct_rolling_365_vs_career_weighted_divergence_on_one_history
        grounds:
          - calculations.performer_conduct_scoring
          - entities.Performer.fields.conduct_score
          - entities.Performer.fields.renewal_conduct_score
          - entities.Performer.fields.standing
          - state_machines.Complaint.TRIAGED_to_UPHELD
          - validations[priority=86]
        distinguishing_aspect: |
          This dual variant lives in the RISK-SCORING domain (Performer), not the money domain: one and
          the same two-complaint history yields conduct_score 88 with standing GOOD under ROLLING_365
          (the 2025 MAJOR has aged out) while renewal_conduct_score is 75 under CAREER_WEIGHTED (the
          same MAJOR still charges round_half_up(25/2) = 13).
        test_recipe:
          setup:
            - "Performer Cy holds a 2025 STREET_THEATRE permit that was approved and paid in February 2025 (FULL_SEASON, 16200 cents)."
            - "A MAJOR complaint was upheld against that permit at 2025-03-01T12:00:00Z (517 days before the assertion clock)."
            - "A MODERATE complaint was upheld at 2026-07-01T12:00:00Z (30 days before the assertion clock)."
            - "Logical clock ends at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-02-01T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Cy Bramble", stage_name: "Cy B", email: "cy@example.org", act_type: "STREET_THEATRE" }
              as: PermitOfficer
              captures: { perf_c: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_c}", requested_zone_id: "${z1}", season_year: 2025, requested_act_type: "STREET_THEATRE", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_c}"
              captures: { app_c: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_c}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_c}"
            - call: "POST /busking/permit-applications/${app_c}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_c}/decision"
              payload: { outcome: "APPROVED", decision_note: "Approved for 2025" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_c}"
              as: PermitOfficer
              captures: { permit_c: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_c}/fee-invoices"
              as: PermitOfficer
              captures: { inv_c: "$.data[0].id" }
            - call: "POST /busking/fee-invoices/${inv_c}/payments"
              payload: { amount_cents: 16200 }
              as: Performer
              as_user_id: "${perf_c}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T12:00:00Z" }
              as: PermitOfficer
            - call: "POST /busking/complaints"
              payload: { permit_id: "${permit_c}", category: "CONDUCT", description: "Aggressive solicitation outside the market hall" }
              as: Resident
              as_user_id: "resident-1"
              captures: { cmp_c1: "$.data.id" }
            - call: "POST /busking/complaints/${cmp_c1}/triage"
              payload: { severity: "MAJOR", route: "DIRECT" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/complaints/${cmp_c1}/adjudicate"
              payload: { outcome: "UPHELD", resolution_note: "Body-cam evidence accepted" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:00:00Z" }
              as: PermitOfficer
            - call: "POST /busking/complaints"
              payload: { permit_id: "${permit_c}", category: "NOISE", description: "Amplified backing track at midday" }
              as: Resident
              as_user_id: "resident-2"
              captures: { cmp_c2: "$.data.id" }
            - call: "POST /busking/complaints/${cmp_c2}/triage"
              payload: { severity: "MODERATE", route: "DIRECT" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/complaints/${cmp_c2}/adjudicate"
              payload: { outcome: "UPHELD", resolution_note: "Meter log accepted" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PermitOfficer
          trigger:
            - call: "POST /busking/ops-runs"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "GET /busking/performers/${perf_c}"
              as: PermitOfficer
          assert:
            - 'Complaint.${cmp_c1}.conduct_deduction == 25'
            - 'Complaint.${cmp_c2}.conduct_deduction == 12'
            - 'Performer.${perf_c}.conduct_score == 88'
            - 'Performer.${perf_c}.renewal_conduct_score == 75'
            - 'Performer.${perf_c}.standing == "GOOD"'
            - 'Performer.${perf_c}.upheld_complaint_count == 2'
            - 'Permit.${permit_c}.lifecycle_status == "EXPIRED"'

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_tier_and_admin_rate_keyed_on_pre_discount_gross
        grounds:
          - calculations.permit_fee_assessment
          - entities.FeeInvoice.fields.gross_fee_cents
          - entities.FeeInvoice.fields.discount_cents
          - entities.FeeInvoice.fields.admin_fee_cents
          - state_machines.PermitApplication.AUDITION_PASSED_to_APPROVED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. amount_due_cents feeds
          off a tier that is itself keyed on a fee figure, so the order must be pinned: tier and admin
          rate are both read off gross_fee_cents 24500 giving 24500 - 3675 + 1225 = 22050, whereas
          re-tiering on the post-discount 20825 (tier 2, admin 6 percent = 1250) would give 22075.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-15T09:00:00Z so the FULL_SEASON variant applies and the proration factor cannot mask the ordering bug."
            - "Performer Bo holds an AMPLIFIED_MUSIC application with amplification_requested true, so requires_audition is true; the panel has filed three passing scores and the sitting is finalized PASSED by officer-alpha."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T09:00:00Z" }
              as: PermitOfficer
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Bo Kestrel", stage_name: "Bo K", email: "bo@example.org", act_type: "AMPLIFIED_MUSIC" }
              as: PermitOfficer
              captures: { perf_b: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_b}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "AMPLIFIED_MUSIC", amplification_requested: true }
              as: Performer
              as_user_id: "${perf_b}"
              captures: { app_b: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_b}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_b}"
            - call: "POST /busking/permit-applications/${app_b}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/auditions"
              payload: { application_id: "${app_b}", scheduled_for: "2026-03-20T10:00:00Z" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { aud_b: "$.data.id" }
            - call: "POST /busking/auditions/${aud_b}/scores"
              payload: { technical_score: 9, suitability_score: 8, safety_score: 8 }
              as: AuditionPanelist
              as_user_id: "panelist-1"
            - call: "POST /busking/auditions/${aud_b}/scores"
              payload: { technical_score: 8, suitability_score: 8, safety_score: 7 }
              as: AuditionPanelist
              as_user_id: "panelist-2"
            - call: "POST /busking/auditions/${aud_b}/scores"
              payload: { technical_score: 7, suitability_score: 8, safety_score: 8 }
              as: AuditionPanelist
              as_user_id: "panelist-3"
            - call: "POST /busking/auditions/${aud_b}/finalize"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /busking/permit-applications/${app_b}/decision"
              payload: { outcome: "APPROVED", decision_note: "Panel passed" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_b}"
              as: PermitOfficer
              captures: { permit_b: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_b}/fee-invoices"
              as: PermitOfficer
              captures: { inv_b: "$.data[0].id" }
          assert:
            - 'Audition.${aud_b}.panel_score == 7.90'
            - 'Audition.${aud_b}.status == "PASSED"'
            - 'FeeInvoice.${inv_b}.gross_fee_cents == 24500'
            - 'FeeInvoice.${inv_b}.discount_cents == 3675'
            - 'FeeInvoice.${inv_b}.admin_fee_cents == 1225'
            - 'FeeInvoice.${inv_b}.amount_due_cents == 22050'
            - 'FeeInvoice.${inv_b}.fee_variant == "FULL_SEASON"'
            - 'Permit.${permit_b}.amplification_endorsed == true'

      - name: panel_score_rounds_each_panelist_before_averaging
        grounds:
          - calculations.audition_panel_score
          - entities.AuditionScore.fields.composite_score
          - entities.Audition.fields.panel_score
          - state_machines.Audition.SCHEDULED_to_FAILED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents-equivalent. Rounding each
          panelist composite first (7.14, 7.29, 6.29) and averaging the ROUNDED values gives
          panel_score 6.91; averaging the raw 50/7, 51/7, 44/7 and rounding once gives 6.90. Both
          fail the 7.00 threshold, so only the pinned order reproduces 6.91.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default."
            - "Performer Dari holds a CIRCUS_SKILL application, which forces requires_audition true even without amplification; the sitting is SCHEDULED and three panelists have filed scores (8,7,6), (7,8,7) and (6,6,7) in that order."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Dari Wend", stage_name: "Dari", email: "dari@example.org", act_type: "CIRCUS_SKILL" }
              as: PermitOfficer
              captures: { perf_d: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_d}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "CIRCUS_SKILL", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_d}"
              captures: { app_d: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_d}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_d}"
            - call: "POST /busking/permit-applications/${app_d}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/auditions"
              payload: { application_id: "${app_d}", scheduled_for: "2026-08-06T10:00:00Z" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { aud_d: "$.data.id" }
            - call: "POST /busking/auditions/${aud_d}/scores"
              payload: { technical_score: 8, suitability_score: 7, safety_score: 6 }
              as: AuditionPanelist
              as_user_id: "panelist-1"
              captures: { sc_d1: "$.data.id" }
            - call: "POST /busking/auditions/${aud_d}/scores"
              payload: { technical_score: 7, suitability_score: 8, safety_score: 7 }
              as: AuditionPanelist
              as_user_id: "panelist-2"
              captures: { sc_d2: "$.data.id" }
            - call: "POST /busking/auditions/${aud_d}/scores"
              payload: { technical_score: 6, suitability_score: 6, safety_score: 7 }
              as: AuditionPanelist
              as_user_id: "panelist-3"
              captures: { sc_d3: "$.data.id" }
          trigger:
            - call: "POST /busking/auditions/${aud_d}/finalize"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "GET /busking/auditions/${aud_d}/scores"
              as: PermitOfficer
          assert:
            - 'AuditionScore.${sc_d1}.composite_score == 7.14'
            - 'AuditionScore.${sc_d2}.composite_score == 7.29'
            - 'AuditionScore.${sc_d3}.composite_score == 6.29'
            - 'Audition.${aud_d}.score_count == 3'
            - 'Audition.${aud_d}.panel_score == 6.91'
            - 'Audition.${aud_d}.status == "FAILED"'
            - 'PermitApplication.${app_d}.status == "AUDITION_FAILED"'

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_revision_loop_cycles_back_to_submitted_until_limit
        grounds:
          - state_machines.PermitApplication.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.PermitApplication.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.PermitApplication.SUBMITTED_to_UNDER_REVIEW
          - entities.PermitApplication.fields.revision_count
          - concurrency_rules[application-revision-stale-version]
          - validations[priority=82]
        distinguishing_aspect: |
          Non-linearity on the PermitApplication entity is a genuine CYCLE: CHANGES_REQUESTED ->
          SUBMITTED -> UNDER_REVIEW -> CHANGES_REQUESTED is traversed twice, revision_count climbing
          0 -> 1 -> 2, and the third lap is refused with ERR_REVISION_LIMIT_EXCEEDED while the
          application stays in UNDER_REVIEW.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default."
            - "Performer Ada holds an ACOUSTIC_MUSIC 2026 application that has been submitted, reviewed into UNDER_REVIEW, and routed to CHANGES_REQUESTED once, with revision_count still 0."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", email: "ada@example.org", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { perf_a: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_a}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "ACOUSTIC_MUSIC", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_a}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_a}/decision"
              payload: { outcome: "CHANGES_REQUESTED", decision_note: "Attach the public liability certificate" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permit-applications/${app_a}"
              as: PermitOfficer
              captures: { av1: "$.data.version" }
          trigger:
            - call: "POST /busking/permit-applications/${app_a}/revisions"
              payload: { expected_application_version: "${av1}" }
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_a}/decision"
              payload: { outcome: "CHANGES_REQUESTED", decision_note: "Certificate expired last month" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permit-applications/${app_a}"
              as: PermitOfficer
              captures: { av2: "$.data.version" }
            - call: "POST /busking/permit-applications/${app_a}/revisions"
              payload: { expected_application_version: "${av2}" }
              as: Performer
