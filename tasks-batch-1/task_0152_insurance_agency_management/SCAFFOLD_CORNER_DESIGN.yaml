              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOTHING_PAYABLE (net_payable_cents == 0)"

      - name: carrier_not_active_on_bind
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_CARRIER_NOT_ACTIVE]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / bind_blocked_by_suspended_carrier
          rationale: "ERR_CARRIER_NOT_ACTIVE is asserted as the failure of the named §1.8 instance."

      - name: renewal_term_not_adjacent_error
