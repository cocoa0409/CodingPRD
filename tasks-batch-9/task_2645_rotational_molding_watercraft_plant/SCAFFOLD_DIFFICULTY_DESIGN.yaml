              payload: { production_order_id: "${po_b}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T13:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_b_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po_c}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_c_v1: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po_c}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:30:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_c_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /molding-cycles?production_order_id=${po_b}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po_b}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "CONFLICT CALL (both members live): the first POST /molding-cycles returns 409 with data.error_id == \"ERR_ORDER_NOT_SCHEDULABLE\" — member A at priority 34 wins over member B at priority 62. PO-P1-B is DRAFT (34 trips) AND the requested arm-1 window 09:30-10:30 overlaps CYC-P1-A's buffered 09:00-10:00 span (62 trips)."
            - "the winner is NOT \"ERR_OVEN_WINDOW_CONFLICT\": both members carry http_status 409, so the response status cannot be what distinguishes them — only the error_id can, which is exactly what makes this pair worth pinning"
            - "nothing between the two members interfered: priority 58 passes because cooling_mode FORCED_AIR equals CoolingBay.airflow_mode, priority 59 passes because SIZE_CLASS_ORDER[MID] 2 <= SIZE_CLASS_ORDER[OVERSIZE] 4, and priorities 32 and 33 pass because OV-1 is OPERATIONAL and CB-1 is OPERATIONAL"
            - "CONTROL A (member A alone): the second POST /molding-cycles — same DRAFT order, but arm 2 and a non-overlapping 13:00 window — also returns 409 \"ERR_ORDER_NOT_SCHEDULABLE\", so member A alone reproduces the conflict call's observable outcome"
            - "CONTROL B (member B alone): the third POST /molding-cycles — the RELEASED order PO-P1-C over the same conflicting arm-1 09:30 window — returns 409 with data.error_id == \"ERR_OVEN_WINDOW_CONFLICT\". This is the falsifying half: member B WAS live in the conflict call and was suppressed purely by priority order, not by being satisfied."
            - "CONTROL B also proves the mould pool never masked the pair: MLD-P1A is excluded by the half-open overlap [09:00, 10:30) vs [09:30, 11:00) while MLD-P1B remains eligible, so priority 70 ERR_NO_ELIGIBLE_MOLD and ERR_MOLD_WINDOW_CONFLICT are both vacuous"
            - "TERMINAL: GET /molding-cycles?production_order_id=${po_b} returns 0 rows, ProductionOrder.${po_b}.status is still \"DRAFT\" and ProductionOrder.${po_b}.version == ${po_b_v1} — all three rejections were pure, writing no cycle and bumping no version, and CYC-P1-A is still \"SCHEDULED\""

      - name: pair2_regrind_limit_beats_resin_insufficient
        grounds:
          - validations[priority=52]
          - validations[priority=72]
          - calculations.cycle_regrind_percentage
          - calculations.resin_mass_ledger
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
          - errors.ERR_RESIN_INSUFFICIENT
        distinguishing_aspect: |
          A DIFFERENT category pair from PAIR-1: BUSINESS_SAFETY (priority 52,
          ERR_REGRIND_LIMIT_EXCEEDED, 422) against BUSINESS_FISCAL (priority
          72, ERR_RESIN_INSUFFICIENT, 409) on POST /resin-charges. Because the
          two members also differ in HTTP status, this instance pins the
          product-safety-before-money ordering at the status-code level as well
          as the error_id level: a 409 anywhere in the conflict case would mean
          the money check ran first.
        test_recipe:
          setup:
            - "ProductModel PM-P2-KM with nominal_charge_kg 24.000, charge_tolerance_pct 5.00 and max_regrind_pct 30.00; Mold MLD-P2-1 with cavity_count 1 and nominal_charge_kg 24.000 == 24.000 * 1."
            - "TWO qualified ResinLots identical on grade, additive package, colour, melt index and regrind_pct_by_mass, differing only in mass: LOT-P2-BIG with received_kg 500.000 and LOT-P2-SMALL with received_kg 10.000. Only LOT-P2-BIG clears the release gate round(24.000 * 0.95, 3) == 22.800, which is why the order can be released at all; LOT-P2-SMALL is unqualified on mass but still status AVAILABLE, so it can be named in a charge request."
            - "PO-P2 (ordered_qty 1) is released and holds one SCHEDULED cycle CYC-P2 (OV-1 arm 1, 09:00-10:00, cooling 30, FORCED_AIR) with charged_mass_kg 0.000 and cycle_regrind_pct 0.00 and NO ResinCharge rows, so every regrind computation below sees the candidate charge alone."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-P2-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "OCHRE", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 300000, warranty_basis: "FLAT", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-P2-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-1", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-1", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-RES-1", full_name: "Rita Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-OPR-1", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-P2", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-P2-BIG", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "OCHRE", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2035-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_big: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-P2-SMALL", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "OCHRE", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 10.000, expires_on: "2035-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_small: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-P2", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
          trigger:
            - call: "GET /resin-lots/${lot_small}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { small_v1: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_small}", charge_kg: 24.000, regrind_kg: 12.000, expected_resin_lot_version: "${small_v1}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_small}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { small_v2: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_small}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${small_v2}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_big}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { big_v1: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_big}", charge_kg: 24.000, regrind_kg: 12.000, expected_resin_lot_version: "${big_v1}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-charges?molding_cycle_id=${cyc}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /resin-lots/${lot_small}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "CONFLICT CALL (both members live): charging 24.000 kg with 12.000 kg regrind from LOT-P2-SMALL returns 422 with data.error_id == \"ERR_REGRIND_LIMIT_EXCEEDED\". Member A trips because the post-add blend is round(12.000 / 24.000 * 100, 2) == 50.00 > max_regrind_pct 30.00, and member B trips because LOT-P2-SMALL.available_kg 10.000 < charge_kg 24.000."
            - "the HTTP status is 422 and NOT 409: had the fiscal member at priority 72 been evaluated first the response would have been 409 ERR_RESIN_INSUFFICIENT, so status and error_id agree on the same verdict — product safety is decided before mass availability"
            - "priority 51 ERR_RESIN_LOT_NOT_QUALIFIED is vacuous by construction (LOT-P2-SMALL matches the model on resin_grade, additive_package_code, colour and the inclusive melt-index band), so nothing between the members can be mistaken for the winner"
            - "CONTROL B (member B alone): charging 24.000 kg with 2.400 kg regrind from LOT-P2-SMALL — blend round(2.400 / 24.000 * 100, 2) == 10.00 <= 30.00, so member A is satisfied — returns 409 with data.error_id == \"ERR_RESIN_INSUFFICIENT\". Member B was therefore genuinely live in the conflict call and was suppressed by priority order alone."
            - "CONTROL A (member A alone): charging 24.000 kg with 12.000 kg regrind from LOT-P2-BIG — available_kg 500.000 >= 24.000, so member B is satisfied — returns 422 with data.error_id == \"ERR_REGRIND_LIMIT_EXCEEDED\", reproducing the conflict call's outcome from member A alone"
            - "TERMINAL: GET /resin-charges?molding_cycle_id=${cyc} returns 0 rows; MoldingCycle.${cyc}.charged_mass_kg == 0.000 and cycle_regrind_pct == 0.00; ResinLot.${lot_small} still reads available_kg 10.000 / reserved_kg 0.000 / consumed_kg 0.000 == received_kg 10.000 and ResinLot.${lot_big} still reads available_kg 500.000 / reserved_kg 0.000 — three rejected requests moved no mass and left no partial charge row"

      - name: pair5_storage_review_incomplete_beats_warranty_term_expired
        grounds:
          - validations[priority=55]
          - validations[priority=64]
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - calculations.warranty_payout
          - errors.ERR_STORAGE_REVIEW_INCOMPLETE
          - errors.ERR_WARRANTY_TERM_EXPIRED
        distinguishing_aspect: |
          A THIRD category pair, unused by PAIR-1 and PAIR-2: BUSINESS_SAFETY
          (priority 55, ERR_STORAGE_REVIEW_INCOMPLETE, 409) against
          BUSINESS_TEMPORAL (priority 64, ERR_WARRANTY_TERM_EXPIRED, 422) on
          POST /warranty-claims/{id}/approve. It is also the only one of the
          three instances whose suppressed member is a guard buried INSIDE a
          calculation (warranty_payout STEP 0), so a naive implementation that
          computes the payout before running the validation ladder returns 422
          here — the pinned answer is 409.
