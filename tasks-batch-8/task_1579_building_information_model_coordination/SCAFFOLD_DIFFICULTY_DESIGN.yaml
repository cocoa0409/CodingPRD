  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_start_requires_federated_model_frozen
        grounds:
          - state_machines.ClashDetectionRun.QUEUED_to_RUNNING
          - state_machines.FederatedModel.FROZEN_to_ASSEMBLED
        distinguishing_aspect: |
          Entity pair ClashDetectionRun -> FederatedModel: a run created while its
          federated model was FROZEN becomes unstartable after the model is unfrozen
          (ERR_FED_NOT_FROZEN at start), and start succeeds again only after a re-freeze
          restores FROZEN. The run's own status (QUEUED) never changed — the gate lives
          entirely on the parent assembly's state.
        test_recipe:
          setup:
            - "Project P, partner P1, M1 ACCEPTED, F1 FROZEN; run R1 created (QUEUED) while F1 FROZEN"
            - "F1 then unfrozen (ASSEMBLED)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CE1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/unfreeze", payload: {}, as: VDCManager }
          trigger:
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator, captures: { run_status: $.data.status } }
          assert:
            - "first start: error_id == ERR_FED_NOT_FROZEN (409); run stays QUEUED"
            - "after re-freeze: start succeeds, ClashDetectionRun.${r1}.status == RUNNING"
            - "FederatedModel.${f1}.is_stale == false after the re-freeze (members re-pinned)"

      - name: handover_ready_requires_asbuilts_verified
        grounds:
          - state_machines.HandoverPackage.ASSEMBLING_to_READY
          - state_machines.AsBuiltModel.SUBMITTED_to_FIELD_VERIFIED
        distinguishing_aspect: |
          Entity pair HandoverPackage -> AsBuiltModel (different from CE1's
          Run -> FederatedModel): mark-ready is rejected with ERR_AS_BUILTS_NOT_VERIFIED
          while the project's only as-built is merely SUBMITTED, and succeeds after that
          as-built is FIELD_VERIFIED — the handover's own fields are unchanged.
        test_recipe:
          setup:
            - "Project P at CLOSEOUT; M1 ACCEPTED; F1 RELEASED; takeoff T1 APPROVED"
            - "As-built AB1 on M1 in SUBMITTED; handover H1 in ASSEMBLING referencing T1"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CE2" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
