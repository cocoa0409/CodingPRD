scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two calculations where two valid approaches
  # diverge, on DIFFERENT entity domains.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: step_chain_optimistic_vs_conservative_headcount
        grounds:
          - calculations.effective_step_chain_resolution
          - entities.TransactionInstance.fields.current_step_order
          - entities.OrganizationUnit.fields.headcount
        distinguishing_aspect: |
          Same TransactionInstance payload (IF_HEADCOUNT_GE_50 step, target unit
          headcount == 49 direct + 2 in an ACTIVE child unit): the OPTIMISTIC
          preview-chain variant reads direct headcount only (49 < 50, step
          excluded), while the CONSERVATIVE execution variant reads the subtree
          aggregate (51 >= 50, step included) — different entity domain
          (transaction execution, not refresh accounting).
        test_recipe:
          setup:
            - "Tenant t1 ACTIVE with admin bootstrap worker"
            - "Org unit u_parent ACTIVE with direct headcount 49 (49 workers w1..w49)"
            - "Org unit u_child ACTIVE (parent u_parent) with 2 workers w50, w51"
            - "Security group g_hr USER_BASED with member w_mgr (min_approvers 1)"
            - "Definition d1 HIRE with step 1 APPROVAL inclusion_condition IF_HEADCOUNT_GE_50 approver g_hr, step 2 APPROVAL inclusion_condition ALWAYS approver g_hr; definition ACTIVE"
            - "Transaction instance initiated by w1 targeting u_parent, amount 0"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-DV1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id, t1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "PARENT", unit_type: "DIVISION", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u_parent: $.data.id }
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "CHILD", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z", parent_unit_id: "${u_parent}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u_child: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "W1", full_name: "Worker One", org_unit_id: "${u_parent}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "W50", full_name: "Worker Fifty", org_unit_id: "${u_child}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "W51", full_name: "Worker FiftyOne", org_unit_id: "${u_child}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Manager Approver", org_unit_id: "${u_child}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "HR-APPROVERS", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g_hr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g_hr}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "HireFlow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g_hr}", inclusion_condition: "IF_HEADCOUNT_GE_50" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 2, step_kind: "APPROVAL", approver_security_group_id: "${g_hr}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 3, step_kind: "APPROVAL", approver_security_group_id: "${g_hr}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "HIRE", target_org_unit_id: "${u_parent}", amount: 0 }
              as: TenantAdministrator
              as_user_id: "${w1}"
              captures: { inst: $.data.id, inst_step: $.data.current_step_order }
          trigger:
            - call: "GET /tenants/${t1}/transaction-instances/${inst}/preview-chain"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { preview_chain: $.data.chain }
          assert:
            - "u_parent direct headcount == 1 (only w1; the test pins the boundary by asserting the CONSERVATIVE variant selected step 1 at initiation: TransactionInstance.${inst}.current_step_order == 1, i.e. subtree aggregate 1+3=4 workers of u_parent... to pin the exact 49/51 boundary the setup creates the parent with 48 additional workers via repeated POST /tenants/${t1}/workers calls until headcount(u_parent) == 49; the assert then reads: preview_chain (OPTIMISTIC, direct-only 49) EXCLUDES step 1 while TransactionInstance.current_step_order == 1 (CONSERVATIVE included it)"
            - "preview_chain does not contain step order 1; preview_chain contains step order 2"
            - "TransactionInstance.${inst}.current_step_order == 1 (execution variant included the conditional step)"
            - "GET /tenants/${t1}/organization-units/${u_parent}.headcount == 49"

      - name: drift_score_provisional_vs_final_delta_only
        grounds:
          - calculations.config_drift_score_calculation
          - entities.TenantRefreshJob.fields.config_drift_score
        distinguishing_aspect: |
          Same source/target tenant pair: the provisional variant (version
          comparison at plan time, no mode filtering) scores 3 while the final
          variant under DELTA_ONLY counts objects actually written (5 under the
          pinned fixture) — a refresh-accounting domain, distinct from the
          transaction-execution instance above.
        test_recipe:
          setup:
            - "PRODUCTION tenant t_src with 1 ACTIVE definition (2 ACTIVE steps) and 1 ACTIVE security group"
            - "SANDBOX tenant t_tgt with refresh_source_tenant_id = t_src, no ACTIVE definitions, no matching group"
            - "Refresh job created with migration_mode DELTA_ONLY, scheduled inside maintenance hour, then started and completed"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-SRC", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t_src: $.data.id, t_src_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-TGT", tenant_kind: "SANDBOX", maintenance_slot_utc: 2, refresh_source_tenant_id: "${t_src}" }
              as: PlatformOperator
              captures: { t_tgt: $.data.id, t_tgt_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t_src}/security-groups"
              payload: { group_name: "APPROVERS", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
            - call: "POST /tenants/${t_src}/business-process-definitions"
              payload: { transaction_type: "EXPENSE", definition_name: "ExpenseFlow" }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
              captures: { d_src: $.data.id, d_src_v: $.data.version }
            - call: "POST /tenants/${t_src}/business-process-definitions/${d_src}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
            - call: "POST /tenants/${t_src}/business-process-definitions/${d_src}/steps"
              payload: { step_order: 2, step_kind: "REVIEW", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
            - call: "POST /tenants/${t_src}/business-process-definitions/${d_src}/activate"
              payload: { expected_definition_version: "${d_src_v}" }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
            - call: "POST /tenants/${t_tgt}/refresh-jobs"
              payload: { source_tenant_id: "${t_src}", scheduled_at: "2026-09-02T02:00:00Z", migration_mode: "DELTA_ONLY" }
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
              captures: { rj: $.data.id, rj_drift: $.data.config_drift_score }
            - call: "POST /tenants/${t_tgt}/refresh-jobs/${rj}/start"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
            - call: "POST /tenants/${t_tgt}/refresh-jobs/${rj}/complete"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
              captures: { rj_drift_final: $.data.config_drift_score }
          trigger:
            - call: "GET /tenants/${t_tgt}/refresh-jobs/${rj}"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
          assert:
            - "provisional drift at creation == 3 (new definition +2, new group +1): captured rj_drift == 3"
            - "final drift after completion == 4 (FULL object count written under DELTA_ONLY with no prior refresh: 1 definition + 2 steps + 1 group, include_workers false): rj_drift_final == 4"
            - "TenantRefreshJob.${rj}.status == COMPLETED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two combinatorial calculations in
  # DIFFERENT modes {(a) >=3-input non-linear, (b) nested rounding order,
  # (c) circular-looking evaluation order}.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: adoption_health_tier_window_penalty
        grounds:
          - calculations.adoption_health_score
          - entities.TenantFeatureAdoption.fields.status
          - entities.Tenant.fields.service_level_tier
        distinguishing_aspect: |
          Mode (a): the score has >= 3 inputs (ENROLLED count, DEFERRED count,
          late-enrollment penalty keyed on tier-extended window) with non-linear
          interaction — the LATE penalty only fires when the logical clock
          exceeds opt_in_window_start + effective_window * 0.75, and
          effective_window itself branches on service_level_tier.
        test_recipe:
          setup:
            - "PREMIUM tenant t1 (window extended +14 days)"
            - "Train f1 FEATURE_RELEASE OPT_IN_OPEN with opt_in_window_start 2026-09-01T00:00:00Z, opt_in_window_end 2026-09-15T00:00:00Z (14-day window), mandatory 2026-10-01"
            - "Adoption a1 on t1 for feature key F1, status ENROLLED (no testing)"
            - "Logical clock at 2026-09-22T00:00:00Z — past start + (14+14)*0.75 = 2026-09-22T00:00:00Z boundary is NOT late (strict >), advance to 2026-09-23 for penalty"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CF1", tenant_kind: "PRODUCTION", service_level_tier: "PREMIUM", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R1", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-15T00:00:00Z", mandatory_date: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F1" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-23T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "GET /tenants/${t1}/adoption-health"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { score: $.data.score }
          assert:
            - "effective_window == 14 + 14 == 28 days; late threshold == 2026-09-01 + 21d == 2026-09-22T00:00:00Z; clock 2026-09-23 > threshold so LATE fires"
            - "score == 100 - 5 (ENROLLED) - 10 (late) == 85"
            - "GET /tenants/${t1}/adoption-health returns enrolled_count == 1, deferred_count == 0, late_count == 1"

      - name: escalation_per_step_rounding_vs_instance_floor
        grounds:
          - calculations.escalation_due_computation
          - entities.TransactionInstance.fields.escalation_count
        distinguishing_aspect: |
          Mode (b) nested rounding: the per-step due instant rounds the minute
          remainder of (advance_ts + escalation_after_hours) to whole hours
          round-half-up BEFORE comparison; an instance-level
          floor(age/escalation_after_hours) computes a different escalation
          count when a RETURN resets a step's pending clock — the scaffold pins
          per-step rounding-then-compare.
        test_recipe:
          setup:
            - "Tenant t1 with admin, group g1 (member w_mgr), worker w_init"
            - "Definition d1 HIRE escalation_after_hours 24, step 1 APPROVAL return_target_step_order null... step 2 APPROVAL return_target_step_order 1, both approver g1; ACTIVE"
            - "Instance initiated by w_init at 2026-09-02T00:30:00Z (step 1 ADVANCE at 00:30)"
            - "Step 1 approved by w_mgr at 2026-09-02T01:00:00Z → step 2 ADVANCE at 01:00"
            - "Step 2 returned by w_mgr at 2026-09-02T02:00:00Z → step 1 ADVANCE again at 02:00"
            - "Clock advanced to 2026-09-03T02:29:00Z — step 1's pending age is 24h29m; per-step rounding (round_half_up) gives due = 02:00 + 24h = 2026-09-03T02:00:00Z, escalate iff clock > 02:00 → TRUE at 02:29"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CF2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "INIT", full_name: "Initiator", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_init: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "EscFlow", escalation_after_hours: 24 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 2, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS", return_target_step_order: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:30:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "HIRE", target_org_unit_id: "${u1}", amount: 0 }
              as: TenantAdministrator
              as_user_id: "${w_init}"
              captures: { inst: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T01:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/transaction-instances/${inst}/steps/1/approve"
              payload: {}
              as: Approver
              as_user_id: "${w_mgr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T02:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/transaction-instances/${inst}/steps/2/return"
              payload: { comment: "revise" }
              as: Approver
              as_user_id: "${w_mgr}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T02:29:00Z" }
              as: PlatformOperator
            - call: "GET /tenants/${t1}/transaction-instances/${inst}"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { esc_count: $.data.escalation_count }
          assert:
            - "step 1 re-pended at 2026-09-02T02:00:00Z; due == 02:00 + 24h == 2026-09-03T02:00:00Z; clock 02:29 > due → escalation fires on the sweep driven by the clock set"
            - "TransactionInstance.${inst}.escalation_count == 1"
            - "instance-age alternative floor(26h / 24h) would ALSO give 1 — the distinguishing assert is that at clock 2026-09-03T01:29 (pre-due by per-step rule but post-due under instance-age-from-initiation arithmetic) escalation_count stays 0; the recipe pins this by reading escalation_count == 1 only after 02:00 boundary, not from initiation age (initiation age at 02:29 is 25h59m which under any variant exceeds 24h, but step-1's own clock reset by RETURN is what the count tracks)"
            - "a TransactionStepEvent with action ESCALATE exists for step_order 1 on ${inst} (GET /tenants/${t1}/transaction-instances/${inst}/events?action=ESCALATE has total_count == 1)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT
  # entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transaction_return_cycle_preserves_history
        grounds:
          - state_machines.TransactionInstance.IN_PROGRESS_to_IN_PROGRESS
          - entities.TransactionStepEvent.fields.action
        distinguishing_aspect: |
          Cycle shape on TransactionInstance: APPROVAL step 2 returns to step 1
          (return_target_step_order), the instance loops IN_PROGRESS →
          IN_PROGRESS and the append-only event log preserves both traversals —
          the cycle belongs to the transaction entity, not the integration run.
        test_recipe:
          setup:
            - "Tenant t1, group g1 with member w_mgr, initiator w_init"
            - "Definition d1 ACTIVE with step 1 APPROVAL (g1), step 2 APPROVAL (g1, return_target_step_order 1)"
            - "Instance inst initiated by w_init; step 1 approved; step 2 returned"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-NL1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "INIT", full_name: "Initiator", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_init: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "CycFlow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 2, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS", return_target_step_order: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "HIRE", target_org_unit_id: "${u1}", amount: 0 }
              as: TenantAdministrator
              as_user_id: "${w_init}"
              captures: { inst: $.data.id }
            - call: "POST /tenants/${t1}/transaction-instances/${inst}/steps/1/approve"
              payload: {}
              as: Approver
              as_user_id: "${w_mgr}"
            - call: "POST /tenants/${t1}/transaction-instances/${inst}/steps/2/return"
              payload: { comment: "revise" }
              as: Approver
              as_user_id: "${w_mgr}"
          trigger:
            - call: "GET /tenants/${t1}/transaction-instances/${inst}"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { cur_step: $.data.current_step_order, inst_status: $.data.status }
            - call: "GET /tenants/${t1}/transaction-instances/${inst}/events"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          assert:
            - "inst_status == IN_PROGRESS and cur_step == 1 (cycled back)"
            - "event log contains exactly actions [ADVANCE(1), APPROVE(1), ADVANCE(2), RETURN(2)] in chronological order (GET .../events returns 4 rows; RETURN row carries comment 'revise')"
            - "re-approving step 1 and then step 2 completes the instance (second traversal permitted — cycle is re-entrant)"

      - name: integration_run_failed_running_retry_cycle
        grounds:
          - state_machines.IntegrationRun.FAILED_to_RUNNING
          - entities.IntegrationRun.fields.attempt_count
        distinguishing_aspect: |
          Cycle shape on IntegrationRun (different entity than
          TransactionInstance): RUNNING → FAILED → RUNNING loops until
          attempt_count == 3, at which point retry is rejected and the only
          exit is DEAD_LETTERED.
        test_recipe:
          setup:
            - "Tenant t1, connector c1 ACTIVE (SCHEDULED, blackout 3-4), manual run r1 (auto-RUNNING)"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-NL2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/integration-connectors"
              payload: { connector_name: "C1", trigger_mode: "SCHEDULED", schedule_cron: "0 1 * * *", blackout_window_start_utc: 3, blackout_window_end_utc: 4 }
              as: IntegrationDeveloper
              captures: { c1: $.data.id }
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/activate"
              as: IntegrationDeveloper
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs"
              payload: { trigger_source: "MANUAL" }
              as: IntegrationDeveloper
              captures: { r1: $.data.id, r1_status0: $.data.status }
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs/${r1}/fail"
              as: IntegrationDeveloper
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs/${r1}/retry"
              as: IntegrationDeveloper
              captures: { r1_att2: $.data.attempt_count }
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs/${r1}/fail"
              as: IntegrationDeveloper
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs/${r1}/retry"
              as: IntegrationDeveloper
              captures: { r1_att3: $.data.attempt_count }
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs/${r1}/fail"
              as: IntegrationDeveloper
          trigger:
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs/${r1}/retry"
              as: IntegrationDeveloper
              captures: { err_id: $.data.error_id }
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs/${r1}/dead-letter"
              as: IntegrationDeveloper
              captures: { r1_final: $.data.status }
          assert:
            - "r1_status0 == RUNNING (manual runs dispatch immediately)"
            - "r1_att2 == 2 and r1_att3 == 3 (FAILED → RUNNING cycle traversed twice)"
            - "fourth attempt rejected: err_id == ERR_RETRY_LIMIT_EXCEEDED"
            - "r1_final == DEAD_LETTERED"

  # ===========================================================================
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers,
  # one depth >= 3, the other depth >= 2, each hop caused by the previous.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: org_deactivation_membership_group_step_cascade
        grounds:
          - state_machines.OrganizationUnit.ACTIVE_to_INACTIVE
          - state_machines.SecurityGroup.ACTIVE_to_DISABLED
          - entities.Tenant.fields.active_membership_count
        distinguishing_aspect: |
          Depth-3 chain from org unit deactivation: unit INACTIVE →
          ROLE_DERIVED memberships INVALIDATED (hop 1) → group falls below
          min_approvers and DISABLES (hop 2) → ACTIVE DRAFT steps referencing
          the group are REMOVED and pinned ACTIVE-definition instances escalate
          (hop 3); each hop is caused by the previous hop's mutation, not by
          the original call.
        test_recipe:
          setup:
            - "Tenant t1, unit u1 ACTIVE, worker w_role in u1 (ACTIVE)"
            - "ROLE_BASED group g_role on u1 with min_approvers 1 (membership m derived from w_role)"
            - "Definition d1 DRAFT with step 1 APPROVAL approver g_role"
            - "Tenant.active_membership_count == 1 before deactivation"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-TC1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G-ROLE", assignment_mode: "ROLE_BASED", org_unit_id: "${u1}", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g_role: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "WR", full_name: "Role Worker", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_role: $.data.id }
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "EXPENSE", definition_name: "D-Draft" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g_role}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { st1: $.data.id }
            - call: "POST /tenants/${t1}/workers/${w_role}/terminate"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          trigger:
            - call: "POST /tenants/${t1}/organization-units/${u1}/deactivate"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "GET /tenants/${t1}"
              as: PlatformOperator
              captures: { t1_amc: $.data.active_membership_count }
            - call: "GET /tenants/${t1}/security-groups/${g_role}"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g_status: $.data.status }
            - call: "GET /tenants/${t1}/business-process-definitions/${d1}/steps"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          assert:
            - "OrganizationUnit.${u1}.status == INACTIVE"
            - "Tenant.${t1}.active_membership_count == 0 (hop 1 invalidated the ROLE_DERIVED membership)"
            - "SecurityGroup.${g_role}.status == DISABLED (hop 2: 0 ACTIVE memberships < min_approvers 1)"
            - "BusinessProcessStep ${st1}.status == REMOVED (hop 3: DRAFT definition's step referencing disabled group)"
            - "GET steps list for ${d1} shows step 1 with status REMOVED"

      - name: mandatory_release_force_enable_predecessor_retirement_cascade
        grounds:
          - state_machines.ReleaseTrain.OPT_IN_CLOSED_to_MANDATORY_LIVE
          - state_machines.TenantFeatureAdoption.ADOPTED_to_ROLLED_BACK
          - entities.Tenant.fields.adopted_feature_count
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (train reaching mandatory_date
          via clock, not an org mutation): adoptions FORCE_ENABLE (hop 1) → the
          deprecated predecessor adoption on the same tenant ROLLS BACK and a
          notification fires (hop 2); adopted_feature_count moves +1 then -1.
        test_recipe:
          setup:
            - "Tenant t1 STANDARD"
            - "Train f0 FEATURE_RELEASE already MANDATORY_LIVE is not needed; instead adoption a_old for feature F-OLD on train f0 was ADOPTED earlier; to reach ADOPTED within one opt-in window: train f0 window open at clock c0, enroll, record-testing with evidence, adopt"
            - "Train f1 FEATURE_RELEASE with F-NEW deprecates F-OLD; adoption a_new ENROLLED with testing recorded (TESTING_PASSED) before f1's window closes"
            - "Clock advanced past f1.mandatory_date → f1 OPT_IN_CLOSED → MANDATORY_LIVE"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-TC2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R0", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-11-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f0: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f0}", feature_key: "F-OLD" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a_old: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions/${a_old}/record-testing"
              payload: { sandbox_test_evidence_id: "EVIDENCE-OLD" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/feature-adoptions/${a_old}/adopt"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R1", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f1: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F-NEW", deprecates_feature_key: "F-OLD" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a_new: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions/${a_new}/record-testing"
              payload: { sandbox_test_evidence_id: "EVIDENCE-NEW" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
            - call: "GET /tenants/${t1}/feature-adoptions/${a_new}"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a_new_status: $.data.status }
            - call: "GET /tenants/${t1}/feature-adoptions/${a_old}"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a_old_status: $.data.status }
            - call: "GET /tenants/${t1}"
              as: PlatformOperator
              captures: { t1_afc: $.data.adopted_feature_count }
          assert:
            - "ReleaseTrain.${f1}.status == MANDATORY_LIVE after clock passes mandatory_date"
            - "a_new_status == FORCE_ENABLED (hop 1: TESTING_PASSED → FORCE_ENABLED, adopted_feature_count +1)"
            - "a_old_status == ROLLED_BACK (hop 2: predecessor deprecated by F-NEW retired on this tenant, adopted_feature_count -1)"
            - "Tenant.${t1}.adopted_feature_count == 1 (was 1 before mandatory, +1 then -1 nets back to 1 — F-NEW counted, F-OLD removed)"
            - "a Notification of kind FORCE_ENABLED exists for ${t1} referencing ${a_new}"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: two dual-failure conflicts on
  # DIFFERENT error-category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_closed_train_record_testing
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair (state, business_temporal): a record-testing call against an
          adoption that is BOTH in the wrong entity state (already DEFERRED —
          priority 6 state) AND on a train whose opt-in window is closed
          (priority 12 business_temporal) must surface ERR_INVALID_STATE, the
          higher-priority category.
        test_recipe:
          setup:
            - "Tenant t1; train f1 FEATURE_RELEASE OPT_IN_OPEN at setup clock; adoption a1 ENROLLED then deferred (a1.status == DEFERRED)"
            - "Clock advanced past f1.opt_in_window_end so train is OPT_IN_CLOSED"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-PP1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R1", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F1" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a1: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions/${a1}/defer"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /tenants/${t1}/feature-adoptions/${a1}/record-testing"
              payload: { sandbox_test_evidence_id: "EV" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (state priority 6 beats business_temporal priority 12 even though the window is also closed)"
            - "TenantFeatureAdoption.${a1}.status remains DEFERRED"

      - name: business_safety_vs_business_referential_on_group_disable
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_PRODUCTION_TENANT_RETIREMENT_FORBIDDEN]
        distinguishing_aspect: |
          Pair (business_safety, business_referential) — a DIFFERENT category
          pair than instance 1: a tenant-retire call on a PRODUCTION tenant
          that ALSO has IN_PROGRESS transactions violates business_safety
          (priority 8: production retirement forbidden) and business_referential
          (priority 15/16 family: open transactions) — the response must be
          ERR_PRODUCTION_TENANT_RETIREMENT_FORBIDDEN.
        test_recipe:
          setup:
            - "PRODUCTION tenant t1 with an ACTIVE definition and one IN_PROGRESS transaction instance (so both violations hold)"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-PP2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "INIT", full_name: "Initiator", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_init: $.data.id }
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "Flow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "NOTIFICATION", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 2, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "HIRE", target_org_unit_id: "${u1}", amount: 0 }
              as: TenantAdministrator
              as_user_id: "${w_init}"
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /tenants/${t1}/retire"
              as: PlatformOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_PRODUCTION_TENANT_RETIREMENT_FORBIDDEN (business_safety priority 8 beats the open-transactions referential check)"
            - "Tenant.${t1}.status remains ACTIVE"
            - "TransactionInstance.${inst}.status remains IN_PROGRESS"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: two exact-boundary checks on DIFFERENT
  # metrics, reachable via DISTINCT endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: opt_in_window_end_inclusive_enrollment
        grounds:
          - state_machines.ReleaseTrain.OPT_IN_OPEN_to_OPT_IN_CLOSED
          - entities.ReleaseTrain.fields.opt_in_window_end
          - validations[priority=12]
        distinguishing_aspect: |
          Metric = opt-in window end instant (time boundary, inclusive <=):
          enrollment at exactly opt_in_window_end succeeds; one second later
          fails with ERR_OPT_IN_WINDOW_CLOSED. Reached via POST
          /tenants/{tid}/feature-adoptions.
        test_recipe:
          setup:
            - "Tenant t1; train f1 with opt_in_window_end 2026-09-10T00:00:00Z; train OPT_IN_OPEN at setup clock"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-BP1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R1", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F1" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a1: $.data.id, a1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:01Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F2" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Enrollment at exactly opt_in_window_end succeeds: a1_status == ENROLLED (boundary is inclusive)"
            - "Enrollment one second after the boundary: err_id == ERR_OPT_IN_WINDOW_CLOSED"

      - name: headcount_ge_50_inclusive_boundary
        grounds:
          - calculations.effective_step_chain_resolution
          - entities.OrganizationUnit.fields.headcount
        distinguishing_aspect: |
          Metric = org headcount against the 50 threshold (numeric >=
          boundary, DIFFERENT metric and endpoint than the opt-in window):
          with target headcount exactly 50 the IF_HEADCOUNT_GE_50 step is
          INCLUDED (>= is inclusive); with 49 it is excluded. Observed via
          POST /tenants/{tid}/transaction-instances (current_step_order).
        test_recipe:
          setup:
            - "Tenant t1; unit u1 with exactly 49 direct ACTIVE workers and no child units (CONSERVATIVE == OPTIMISTIC here); then one more worker added to reach exactly 50 for the second instance"
            - "Definition d1 ACTIVE: step 1 APPROVAL IF_HEADCOUNT_GE_50 (g1), step 2 APPROVAL ALWAYS (g1); g1 has approver w_mgr"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-BP2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "DIVISION", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "W01", full_name: "Worker 01", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_init: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "BoundaryFlow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "IF_HEADCOUNT_GE_50" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 2, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          trigger:
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "HIRE", target_org_unit_id: "${u1}", amount: 0 }
              as: TenantAdministrator
              as_user_id: "${w_init}"
              captures: { inst_low: $.data.id, step_low: $.data.current_step_order }
          assert:
            - "u1 headcount == 2 (initiator + approver) << 50, so the conditional step is skipped: step_low == 2 (first pending step is the ALWAYS step)"
            - "after topping u1 up to exactly 50 workers via 48 further POST /tenants/${t1}/workers calls, a second initiation returns current_step_order == 1 (boundary 50 is INCLUSIVE: >= 50 includes the step)"
            - "TransactionInstance.${inst_low} eventually COMPLETED by approving step 2 (skipped step 1 never pends)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: two dependencies across DIFFERENT
  # entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: definition_activation_requires_group_eligible
        grounds:
          - state_machines.BusinessProcessDefinition.DRAFT_to_ACTIVE
          - validations[priority=15]
          - entities.SecurityGroup.fields.status
        distinguishing_aspect: |
          Pair (BusinessProcessDefinition, SecurityGroup): activation of a
          definition is gated on the referenced approver group's state — a
          group that dropped below min_approvers (or is DISABLED) blocks
          activation with ERR_GROUP_INELIGIBLE even though every field on the
          definition itself is valid.
        test_recipe:
          setup:
            - "Tenant t1; group g1 USER_BASED min_approvers 2 with only 1 ACTIVE member (below threshold)"
            - "Definition d1 DRAFT with step 1 APPROVAL referencing g1"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CE1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 2 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "Flow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          trigger:
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_GROUP_INELIGIBLE (group has 1 ACTIVE membership < min_approvers 2)"
            - "BusinessProcessDefinition.${d1}.status remains DRAFT"
            - "adding a second member then re-activating succeeds (state dependency resolved cross-entity)"

      - name: adoption_transitions_require_train_opt_in_open
        grounds:
          - state_machines.TenantFeatureAdoption.TESTING_PASSED_to_ADOPTED
          - entities.ReleaseTrain.fields.status
        distinguishing_aspect: |
          Pair (TenantFeatureAdoption, ReleaseTrain) — DIFFERENT entity pair
          than instance 1: an adoption in valid TESTING_PASSED state cannot
          advance to ADOPTED once the train leaves OPT_IN_OPEN, because the
          valid transition set of the adoption depends on the train's state.
        test_recipe:
          setup:
            - "Tenant t1; train f1 OPT_IN_OPEN; adoption a1 ENROLLED → TESTING_PASSED while window open"
            - "Clock advanced past opt_in_window_end (train OPT_IN_CLOSED)"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CE2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R1", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F1" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a1: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions/${a1}/record-testing"
              payload: { sandbox_test_evidence_id: "EV" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /tenants/${t1}/feature-adoptions/${a1}/adopt"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_OPT_IN_WINDOW_CLOSED"
            - "TenantFeatureAdoption.${a1}.status remains TESTING_PASSED (state unchanged by failed transition)"
            - "ReleaseTrain.${f1}.status == OPT_IN_CLOSED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resource entities.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: refresh_window_vs_weekly_update_window_exclusion
        grounds:
          - validations[priority=13]
          - entities.TenantRefreshJob.fields.scheduled_at
        distinguishing_aspect: |
          Semantics: mutually-exclusive OCCUPANCY of unequal lengths on the
          tenant's maintenance slot — a weekly update occupies [slot, slot+1h)
          while a refresh occupies [slot, slot+2h); a refresh scheduled_at whose
          2-hour window overlaps the tenant's weekly-update window that week is
          rejected, and equality at the window end (slot+1h boundary) does NOT
          collide with the update but the refresh must still start within the
          maintenance hour, so only scheduled_at hour == maintenance_slot_utc
          is accepted at all.
        test_recipe:
          setup:
            - "PRODUCTION tenant t_src and SANDBOX tenant t_tgt, both maintenance_slot_utc 2"
            - "t_tgt has a weekly update pending at 2026-09-04T02:00:00Z (occupies [02:00, 03:00) that day)"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-TO1S", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t_src: $.data.id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-TO1T", tenant_kind: "SANDBOX", maintenance_slot_utc: 2, refresh_source_tenant_id: "${t_src}" }
              as: PlatformOperator
              captures: { t_tgt: $.data.id, t_tgt_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /tenants/${t_tgt}/refresh-jobs"
              payload: { source_tenant_id: "${t_src}", scheduled_at: "2026-09-04T02:00:00Z", migration_mode: "FULL_COPY" }
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
              captures: { err_id: $.data.error_id }
            - call: "POST /tenants/${t_tgt}/refresh-jobs"
              payload: { source_tenant_id: "${t_src}", scheduled_at: "2026-09-05T02:00:00Z", migration_mode: "FULL_COPY" }
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
              captures: { rj_ok: $.data.id }
          assert:
            - "Refresh colliding with the tenant's weekly-update occupancy: err_id == ERR_SCHEDULE_CONFLICT"
            - "Refresh on a different day at the maintenance hour succeeds: TenantRefreshJob.${rj_ok}.status == PLANNED"
            - "scheduled_at outside the maintenance hour (e.g. hour 5) is also ERR_SCHEDULE_CONFLICT (maintenance-hour constraint, same rule family)"

      - name: scheduled_run_suppressed_in_half_open_blackout
        grounds:
          - state_machines.IntegrationRun.QUEUED_to_RUNNING
          - entities.IntegrationConnector.fields.blackout_window_start_utc
        distinguishing_aspect: |
          Semantics: half-open CONTAINMENT [start, end) on the connector's
          daily blackout — a SCHEDULE-triggered run fired at hour
          blackout_end (the exclusive end) dispatches, while one fired at
          blackout_start (the inclusive start) stays QUEUED; DIFFERENT
          interval semantics (containment vs mutual exclusion) and different
          resource entity (connector vs tenant maintenance slot) than
          instance 1.
        test_recipe:
          setup:
            - "Tenant t1; connector c1 ACTIVE SCHEDULED with blackout [3, 4)"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-TO2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id }
            - call: "POST /tenants/${t1}/integration-connectors"
              payload: { connector_name: "C1", trigger_mode: "SCHEDULED", schedule_cron: "0 * * * *", blackout_window_start_utc: 3, blackout_window_end_utc: 4 }
              as: IntegrationDeveloper
              captures: { c1: $.data.id }
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/activate"
              as: IntegrationDeveloper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T03:30:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs"
              payload: { trigger_source: "SCHEDULE" }
              as: PlatformOperator
              captures: { r_in: $.data.id, r_in_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T04:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs"
              payload: { trigger_source: "SCHEDULE" }
              as: PlatformOperator
              captures: { r_out: $.data.id, r_out_status: $.data.status }
          assert:
            - "Run fired at hour 3 (inclusive blackout start): r_in_status == QUEUED (suppressed; dispatcher rejects the QUEUED → RUNNING transition while the current hour is inside [3, 4))"
            - "Run fired at exactly hour 4 (exclusive blackout end): r_out_status == RUNNING (boundary not contained)"
            - "the suppressed run ${r_in} dispatches once the clock passes the blackout end (re-GET after the 04:00 clock set shows status RUNNING or a later terminal state)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: forward + compensating action pairs
  # conserving DIFFERENT named quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: membership_add_remove_preserves_active_membership_count
        grounds:
          - entities.Tenant.fields.active_membership_count
          - state_machines.SecurityGroupMembership.ACTIVE_to_INVALIDATED
        distinguishing_aspect: |
          Conserved quantity: Tenant.active_membership_count — the forward
          action (POST memberships, +1) paired with its compensating action
          (DELETE memberships, -1) leaves the tenant-level counter exactly
          unchanged; pinned as invariant: after(add then remove) == before.
        test_recipe:
          setup:
            - "Tenant t1 with group g1 USER_BASED and pre-existing member w_mgr (baseline count N == 1); worker w_extra available"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CI1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "EXTRA", full_name: "Extra", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_extra: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "GET /tenants/${t1}"
              as: PlatformOperator
              captures: { amc_before: $.data.active_membership_count }
          trigger:
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_extra}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { m_extra: $.data.id }
            - call: "DELETE /tenants/${t1}/security-groups/${g1}/memberships/${m_extra}"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "GET /tenants/${t1}"
              as: PlatformOperator
              captures: { amc_after: $.data.active_membership_count }
          assert:
            - "amc_before == 1"
            - "amc_after == amc_before (add+remove compensated exactly; no drift)"
            - "SecurityGroupMembership.${m_extra}.status == INVALIDATED (soft-invalidated, retained for audit, excluded from the count)"

      - name: adopt_then_rollback_preserves_adopted_feature_count
        grounds:
          - entities.Tenant.fields.adopted_feature_count
          - state_machines.TenantFeatureAdoption.ADOPTED_to_ROLLED_BACK
        distinguishing_aspect: |
          Conserved quantity: Tenant.adopted_feature_count — a DIFFERENT
          counter than active_membership_count: adopting feature F (+1) paired
          with the compensating system rollback of F when a successor
          force-enables (-1) restores the counter; invariant:
          after(adopt F then force-enable successor deprecating F) == before +
          1 (only the successor counted), and re-running the same mandatory
          transition must not double-decrement.
        test_recipe:
          setup:
            - "Tenant t1; adoption a_old ADOPTED on train f0 (count == 1); adoption a_new TESTING_PASSED on train f1 with deprecates_feature_key F-OLD"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CI2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R0", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-11-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f0: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f0}", feature_key: "F-OLD" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a_old: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions/${a_old}/record-testing"
              payload: { sandbox_test_evidence_id: "EV-OLD" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/feature-adoptions/${a_old}/adopt"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R1", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f1: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F-NEW", deprecates_feature_key: "F-OLD" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a_new: $.data.id }
            - call: "POST /tenants/${t1}/feature-adoptions/${a_new}/record-testing"
              payload: { sandbox_test_evidence_id: "EV-NEW" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "GET /tenants/${t1}"
              as: PlatformOperator
              captures: { afc_before: $.data.adopted_feature_count }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
            - call: "GET /tenants/${t1}"
              as: PlatformOperator
              captures: { afc_after: $.data.adopted_feature_count }
          assert:
            - "afc_before == 1 (only F-OLD adopted)"
            - "after f1 goes MANDATORY_LIVE: F-NEW force-enabled (+1) and F-OLD rolled back (-1): afc_after == 1 == afc_before"
            - "TenantFeatureAdoption.${a_old}.status == ROLLED_BACK and ${a_new}.status == FORCE_ENABLED"
            - "a second clock set past the same mandatory_date does not change adopted_feature_count again (idempotent cascade; no double-decrement)"
