          - "errors[ERR_DUPLICATE_SERVICE_DATE]"
        distinguishing_aspect: "An exact duplicate (member_ref, service_date, evidence_code) within the SAME batch is rejected at create time with ERR_DUPLICATE_SERVICE_DATE (cross-batch duplicates surface as screen dispositions instead — see supplemental_window_and_cross_batch_duplicate_dispositions)."
        test_recipe:
          setup: ["ADMIN fixture: run POPULATED; batch RECEIVED with one record {M1, 2025-06-01, A1C}"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
