        distinguishing_aspect: |
          A partial payment leaves the statement ISSUED with amount_paid_cents accumulated; a second payment
          covering the remainder flips it to PAID. Basis 1000000 → royalty 60000 + ad 20000 = total 80000;
          pay 30000 then 50000.
