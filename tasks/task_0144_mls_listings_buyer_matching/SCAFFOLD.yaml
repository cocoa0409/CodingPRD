scenario: |
  MLS Listings & Buyer Matching: dual agents (Listing/Buyer), showing appointments, Lockbox,
  Offer/Counter/Multiple Offer, Contingency (Inspection/Appraisal/Financing), Co-op commission.

domain_name: "mls-listings-buyer-matching"
api_prefix: "/listings"

complexity_profile:
  primary_archetype: "multi_party_negotiation"
  secondary_archetype: "temporal_windowing"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "selector_policy"
    - "scheduled_deferred_actions"
    - "dual_variant_calculation"

  entity_topology: "graph"
  state_machine_shape: "cyclic"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "peer_roles"
  consistency_model: "immediate"

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agent
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Agent full legal name as filed with the MLS."
      - name: brokerage_name
        type: string
        source: input
        description: "Name of the brokerage employing the agent."
      - name: agent_role
        type: enum
        source: input
        description: "Side of transaction the agent represents."
        constraints: "values: LISTING_AGENT, BUYER_AGENT, DUAL_AGENT"
      - name: license_number
        type: string
        source: input
        description: "State real-estate license number; unique across active agents."
      - name: brokerage_split_pct
        type: number
        source: input
        description: "Fraction of the side's commission that goes to the agent. Brokerage keeps the remainder."
        constraints: "0 < x <= 1.0; stored to 4 decimals; default 0.70"
        default: 0.70
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the agent record."
        default: ACTIVE
        constraints: "values: ACTIVE, SUSPENDED"

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - name: listing_agent_id
        type: string
        source: input
        description: "Agent.id of the LISTING_AGENT (or DUAL_AGENT acting on listing side)."
      - name: address_line
        type: string
        source: input
        description: "Street address for display."
      - name: zip_code
        type: string
        source: input
        description: "5-digit ZIP code used for buyer-matching geography filter."
        constraints: "exactly 5 digits"
      - name: list_price_cents
        type: integer
        source: input
        description: "Asking price in whole US cents."
        constraints: "x >= 1_000_000 (i.e., >= $10,000)"
      - name: bedrooms
        type: integer
        source: input
        description: "Number of bedrooms."
        constraints: "0 <= x <= 20"
      - name: bathrooms
        type: number
        source: input
        description: "Number of bathrooms; halves allowed (e.g., 2.5)."
        constraints: "0 <= x <= 20; multiples of 0.5"
      - name: features
        type: array
        source: input
        description: "Tags describing amenities (e.g., POOL, GARAGE, FIREPLACE). Used by feature_fit."
      - name: co_op_pct
        type: number
        source: input
        description: "Co-op (buyer-side) commission rate offered to the buyer's brokerage as a fraction of accepted price."
        constraints: "0 <= x <= 0.06; stored to 4 decimals"
      - name: total_commission_pct
        type: number
        source: input
        description: "Total commission rate (listing-side + buyer-side combined) as a fraction of accepted price."
        constraints: "co_op_pct <= x <= 0.10"
      - name: status
        type: enum
        source: computed
        description: "Posture of the listing. Computed via state machine."
        default: ACTIVE
        constraints: "values: ACTIVE, UNDER_CONTRACT, SOLD, WITHDRAWN, EXPIRED"
      - name: accepted_offer_id
        type: string
        source: computed
        description: "Offer.id of the currently accepted offer; null when no accepted offer."
        default: null
      - name: showing_count
        type: integer
        source: computed
        description: "Number of ShowingAppointment rows in SCHEDULED or COMPLETED state for this listing. Recomputed on every showing transition."
        default: 0

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: buyer_agent_id
        type: string
        source: input
        description: "Agent.id of the BUYER_AGENT (or DUAL_AGENT acting on buyer side)."
      - name: full_name
        type: string
        source: input
        description: "Buyer's full name."
      - name: max_price_cents
        type: integer
        source: input
        description: "Upper bound the buyer is willing to pay (whole cents)."
      - name: min_price_cents
        type: integer
        source: input
        description: "Lower bound the buyer is willing to consider; used to detect mis-priced matches."
        constraints: "min_price_cents <= max_price_cents"
      - name: min_bedrooms
        type: integer
        source: input
        description: "Minimum bedroom requirement."
        constraints: "0 <= x <= 20"
      - name: min_bathrooms
        type: number
        source: input
        description: "Minimum bathroom requirement; multiples of 0.5."
      - name: desired_zips
        type: array
        source: input
        description: "List of 5-digit ZIPs the buyer wants. Non-empty."
      - name: desired_features
        type: array
        source: input
        description: "Tags the buyer prefers; subset overlap with listing.features feeds feature_fit."
      - name: status
        type: enum
        source: computed
        description: "Buyer record posture. SOLD set when an offer they made closes."
        default: ACTIVE
        constraints: "values: ACTIVE, SOLD, WITHDRAWN"

  - name: Lockbox
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "Listing.id this lockbox is mounted on. Exactly one active lockbox per listing."
      - name: serial_number
        type: string
        source: input
        description: "Physical serial; unique across all lockboxes regardless of status."
      - name: access_code
        type: string
        source: system
        description: "6-digit numeric code regenerated on every successful access grant. Server-minted."
      - name: code_rotated_at
        type: datetime
        source: system
        description: "Timestamp of most recent access_code regeneration."
      - name: status
        type: enum
        source: computed
        description: "Lockbox posture."
        default: ARMED
        constraints: "values: ARMED, DISARMED, RETIRED"

  - name: ShowingAppointment
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "Listing.id being shown."
      - name: buyer_agent_id
        type: string
        source: input
        description: "Agent.id of the buyer's agent requesting the showing."
      - name: buyer_id
        type: string
        source: input
        description: "Buyer.id the agent is showing the listing to."
      - name: start_at
        type: datetime
        source: input
        description: "Showing window start (inclusive)."
      - name: end_at
        type: datetime
        source: input
        description: "Showing window end (exclusive)."
        constraints: "end_at > start_at; (end_at - start_at) >= 15 min and <= 4 hours"
      - name: status
        type: enum
        source: computed
        description: "Appointment posture."
        default: REQUESTED
        constraints: "values: REQUESTED, SCHEDULED, COMPLETED, CANCELLED, NO_SHOW"
      - name: lockbox_access_granted_at
        type: datetime
        source: system
        description: "When the access code was vended to the buyer agent. Null until access granted."
        default: null

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "Listing.id this offer is for."
      - name: buyer_id
        type: string
        source: input
        description: "Buyer.id making the offer."
      - name: offer_price_cents
        type: integer
        source: input
        description: "Buyer's offered price in whole cents."
        constraints: "x > 0"
      - name: earnest_money_cents
        type: integer
        source: input
        description: "Earnest money deposit in whole cents."
        constraints: "x >= 0; x <= offer_price_cents"
      - name: estimated_seller_concessions_cents
        type: integer
        source: input
        description: "Estimated concessions the seller will give back at close (e.g., credits)."
        default: 0
      - name: round_no
        type: integer
        source: computed
        description: "Negotiation round counter starting at 1; increments by 1 on each accepted counter rebound to a new offer."
        default: 1
      - name: parent_counter_id
        type: string
        source: input
        description: "Counter.id this offer was generated in response to; null for the first offer in a chain."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Offer posture."
        default: SUBMITTED
        constraints: "values: SUBMITTED, COUNTERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED"
      - name: expires_at
        type: datetime
        source: input
        description: "Wall-clock deadline after which the offer auto-EXPIRES if still SUBMITTED."
      - name: provisional_net_to_seller_cents
        type: integer
        source: computed
        description: "Provisional net-to-seller computed at acceptance time; see calculations.offer_net_to_seller (provisional variant)."
        default: null

  - name: Counter
    parent: null
    common_fields: false
    fields:
      - name: offer_id
        type: string
        source: input
        description: "Offer.id this counter responds to. Immutable."
      - name: counter_price_cents
        type: integer
        source: input
        description: "Seller's counter price in whole cents. Immutable."
      - name: counter_concessions_cents
        type: integer
        source: input
        description: "Seller-proposed concessions adjustment in cents. Immutable."
      - name: counter_expires_at
        type: datetime
        source: input
        description: "Deadline for the buyer to respond (rebound with new Offer or accept). Immutable."
      - name: status
        type: enum
        source: computed
        description: "Counter posture; settled by buyer action or expiration sweep."
        default: OPEN
        constraints: "values: OPEN, REBOUND, EXPIRED, WITHDRAWN"

  - name: Contingency
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "Offer.id this contingency is attached to. Only ACCEPTED offers may carry active contingencies."
      - name: kind
        type: enum
        source: input
        description: "Type of contingency."
        constraints: "values: INSPECTION, APPRAISAL, FINANCING"
      - name: deadline_at
        type: datetime
        source: input
        description: "Wall-clock deadline by which the contingency must be SATISFIED or WAIVED. Past deadline_at auto-fails the contingency."
      - name: status
        type: enum
        source: computed
        description: "Contingency lifecycle."
        default: PENDING
        constraints: "values: PENDING, SATISFIED, WAIVED, FAILED"

  - name: CommissionSplit
    parent: null
    common_fields: false
    fields:
      - name: listing_id
        type: string
        source: input
        description: "Listing.id this split is for."
      - name: offer_id
        type: string
        source: input
        description: "Offer.id at the moment of SOLD transition."
      - name: sale_price_cents
        type: integer
        source: computed
        description: "Final sale price = accepted offer_price_cents at the time of SOLD."
      - name: gross_commission_cents
        type: integer
        source: computed
        description: "Total commission pool. See calculations.co_op_commission_split."
      - name: listing_side_cents
        type: integer
        source: computed
        description: "Listing-side commission portion."
      - name: buyer_side_cents
        type: integer
        source: computed
        description: "Buyer-side (co-op) commission portion."
      - name: listing_agent_cents
        type: integer
        source: computed
        description: "Listing agent's take after applying their brokerage_split_pct."
      - name: listing_brokerage_cents
        type: integer
        source: computed
        description: "Listing brokerage's take."
      - name: buyer_agent_cents
        type: integer
        source: computed
        description: "Buyer agent's take after applying their brokerage_split_pct."
      - name: buyer_brokerage_cents
        type: integer
        source: computed
        description: "Buyer brokerage's take."
      - name: variant
        type: enum
        source: computed
        description: "Whether this is the provisional snapshot (at acceptance) or the final snapshot (at SOLD)."
        constraints: "values: PROVISIONAL, FINAL"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    initial_state: ACTIVE
    terminal_states: [SOLD, WITHDRAWN, EXPIRED]
    transitions:
      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "POST /listings/{id}/offers/{offer_id}/accept"
        actor: ListingAgent
        preconditions:
          - "Listing.status == ACTIVE"
          - "Offer.status == SUBMITTED"
          - "Offer.listing_id == Listing.id"
          - "Offer.expires_at > now()"
        side_effects:
          - "Offer.status := ACCEPTED"
          - "Listing.accepted_offer_id := Offer.id"
          - "All other Offer rows with listing_id==Listing.id and status==SUBMITTED transition to REJECTED (multiple-offer auto-rejection)"
          - "All Counter rows whose offer_id is in the just-rejected offer set and status==OPEN transition to WITHDRAWN"
          - "Recompute Offer.provisional_net_to_seller_cents via calculations.offer_net_to_seller (PROVISIONAL variant)"
          - "Emit CommissionSplit row with variant=PROVISIONAL via calculations.co_op_commission_split"

      - from: UNDER_CONTRACT
        to: SOLD
        trigger: "POST /listings/{id}/close"
        actor: ListingAgent
        preconditions:
          - "Listing.status == UNDER_CONTRACT"
          - "Every Contingency with offer_id == Listing.accepted_offer_id has status IN {SATISFIED, WAIVED}"
        side_effects:
          - "Offer (accepted_offer_id).status := ACCEPTED stays — terminal for offer"
          - "Buyer (Offer.buyer_id).status := SOLD"
          - "Emit CommissionSplit row with variant=FINAL via calculations.co_op_commission_split"
          - "All open ShowingAppointment rows (status IN {REQUESTED, SCHEDULED}) for this listing transition to CANCELLED"
          - "Lockbox attached to this listing transitions to RETIRED"

      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: "POST /listings/{id}/contingencies/{contingency_id}/fail OR sweep advances clock past Contingency.deadline_at with status==PENDING"
        actor: BuyerAgent | system
        preconditions:
          - "Listing.status == UNDER_CONTRACT"
          - "Target Contingency.status was PENDING and transitions to FAILED"
        side_effects:
          - "Listing.accepted_offer_id := null"
          - "Offer (former accepted).status := WITHDRAWN"
          - "All other PENDING contingencies on the same offer transition to FAILED"
          - "No CommissionSplit FINAL row emitted; PROVISIONAL row remains but is marked stale via Listing.updated_at refresh"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /listings/{id}/withdraw"
        actor: ListingAgent
        preconditions:
          - "Listing.status == ACTIVE"
          - "No Offer with listing_id==Listing.id and status==SUBMITTED exists (must reject or expire submitted offers first)"
        side_effects:
          - "All ShowingAppointment rows with listing_id==Listing.id and status IN {REQUESTED, SCHEDULED} transition to CANCELLED"
          - "Lockbox attached transitions to DISARMED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock advance: now() >= Listing.created_at + 180 days AND Listing.status==ACTIVE"
        actor: system
        preconditions:
          - "Listing.status == ACTIVE"
          - "now() - Listing.created_at >= 180 days"
        side_effects:
          - "All open ShowingAppointment rows transition to CANCELLED"
          - "All SUBMITTED Offer rows transition to EXPIRED"
          - "All OPEN Counter rows transition to EXPIRED"
          - "Lockbox attached transitions to DISARMED"
        note: "Driven by POST /_clock/advance + POST /_sweep/run."

  - entity: Offer
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /listings/{listing_id}/offers/{id}/counter"
        actor: ListingAgent
        preconditions:
          - "Offer.status == SUBMITTED"
          - "Listing.status == ACTIVE"
          - "Offer.expires_at > now()"
          - "counter_price_cents > 0 and counter_expires_at > now()"
        side_effects:
          - "Create Counter row with status=OPEN tied to this Offer"

      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /listings/{listing_id}/offers/{id}/rebound"
        actor: BuyerAgent
        preconditions:
          - "Offer.status == COUNTERED"
          - "Counter (parent_counter_id == Counter.id and status==OPEN) exists"
          - "now() < Counter.counter_expires_at"
        side_effects:
          - "Original Counter.status := REBOUND"
          - "Create a NEW Offer row whose parent_counter_id == rebounded Counter.id, round_no = previous Offer.round_no + 1, status=SUBMITTED"
          - "Original Offer remains in terminal-for-this-round state COUNTERED → REBOUND? No: the original Offer stays COUNTERED. The chain advances via the new Offer row."
        note: "Cyclic state machine: a chain of Offers with monotonically increasing round_no captures negotiation rounds. Each new Offer is a fresh row in SUBMITTED state, so SUBMITTED→COUNTERED→(new Offer)→SUBMITTED forms the cycle at the *chain* level even though no single Offer row revisits SUBMITTED."

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /listings/{listing_id}/offers/{id}/accept"
        actor: ListingAgent
        preconditions:
          - "Offer.status == SUBMITTED"
          - "Listing.status == ACTIVE"
          - "Offer.expires_at > now()"
        side_effects:
          - "Triggers Listing ACTIVE → UNDER_CONTRACT cascade (see Listing transitions)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /listings/{listing_id}/offers/{id}/reject OR cascade from accepting a sibling offer"
        actor: ListingAgent | system
        preconditions:
          - "Offer.status == SUBMITTED"
        side_effects:
          - "Any OPEN Counter rows tied to this Offer transition to WITHDRAWN"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /listings/{listing_id}/offers/{id}/withdraw"
        actor: BuyerAgent
        preconditions:
          - "Offer.status == SUBMITTED"
          - "Caller is the BUYER_AGENT for Buyer.id == Offer.buyer_id"
        side_effects:
          - "Any OPEN Counter rows tied to this Offer transition to WITHDRAWN"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system clock advance: now() >= Offer.expires_at AND Offer.status==SUBMITTED"
        actor: system
        preconditions:
          - "Offer.status == SUBMITTED"
          - "now() >= Offer.expires_at"
        side_effects:
          - "Any OPEN Counter rows tied to this Offer transition to WITHDRAWN"

  - entity: ShowingAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /listings/{listing_id}/showings/{id}/approve"
        actor: ListingAgent
        preconditions:
          - "ShowingAppointment.status == REQUESTED"
          - "Listing.status == ACTIVE"
          - "Lockbox attached to listing has status == ARMED"
          - "No other ShowingAppointment row with same listing_id and status IN {SCHEDULED} has [start_at, end_at) overlapping (half-open intervals; adjacency at start_at == other.end_at OR end_at == other.start_at is allowed)"
        side_effects:
          - "Listing.showing_count := count of ShowingAppointment rows with this listing_id and status IN {SCHEDULED, COMPLETED}"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /listings/{listing_id}/showings/{id}/complete"
        actor: BuyerAgent
        preconditions:
          - "ShowingAppointment.status == SCHEDULED"
          - "ShowingAppointment.lockbox_access_granted_at IS NOT NULL"
          - "now() >= ShowingAppointment.end_at"
        side_effects:
          - "Listing.showing_count refreshed (no net change but updated_at refreshes)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /listings/{listing_id}/showings/{id}/cancel"
        actor: ListingAgent | BuyerAgent
        preconditions:
          - "ShowingAppointment.status == SCHEDULED"
          - "now() < ShowingAppointment.start_at"
        side_effects:
          - "Listing.showing_count decremented"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /listings/{listing_id}/showings/{id}/cancel"
        actor: ListingAgent | BuyerAgent
        preconditions:
          - "ShowingAppointment.status == REQUESTED"
        side_effects: []

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system clock advance: now() >= ShowingAppointment.end_at AND lockbox_access_granted_at IS NULL"
        actor: system
        preconditions:
          - "ShowingAppointment.status == SCHEDULED"
          - "now() >= ShowingAppointment.end_at"
          - "ShowingAppointment.lockbox_access_granted_at IS NULL"
        side_effects:
          - "Listing.showing_count decremented (was previously included)"

  - entity: Contingency
    initial_state: PENDING
    terminal_states: [SATISFIED, WAIVED, FAILED]
    transitions:
      - from: PENDING
        to: SATISFIED
        trigger: "POST /listings/{listing_id}/contingencies/{id}/satisfy"
        actor: BuyerAgent
        preconditions:
          - "Contingency.status == PENDING"
          - "Listing.status == UNDER_CONTRACT"
          - "now() < Contingency.deadline_at"
        side_effects: []

      - from: PENDING
        to: WAIVED
        trigger: "POST /listings/{listing_id}/contingencies/{id}/waive"
        actor: BuyerAgent
        preconditions:
          - "Contingency.status == PENDING"
          - "Listing.status == UNDER_CONTRACT"
        side_effects: []

      - from: PENDING
        to: FAILED
        trigger: "POST /listings/{listing_id}/contingencies/{id}/fail OR clock sweep now() >= deadline_at while PENDING"
        actor: BuyerAgent | system
        preconditions:
          - "Contingency.status == PENDING"
        side_effects:
          - "Triggers Listing UNDER_CONTRACT → ACTIVE cascade (see Listing transitions): accepted offer withdrawn, sibling PENDING contingencies all FAILED, listing returns to market"

  - entity: Lockbox
    initial_state: ARMED
    terminal_states: [RETIRED]
    transitions:
      - from: ARMED
        to: DISARMED
        trigger: "POST /listings/{listing_id}/lockbox/disarm OR cascade from Listing WITHDRAWN/EXPIRED"
        actor: ListingAgent | system
        preconditions:
          - "Lockbox.status == ARMED"
        side_effects: []

      - from: DISARMED
        to: ARMED
        trigger: "POST /listings/{listing_id}/lockbox/arm"
        actor: ListingAgent
        preconditions:
          - "Lockbox.status == DISARMED"
          - "Listing.status == ACTIVE"
        side_effects:
          - "access_code regenerated (server-minted 6-digit string)"
          - "code_rotated_at := now()"

      - from: ARMED
        to: RETIRED
        trigger: "cascade from Listing SOLD"
        actor: system
        preconditions:
          - "Lockbox.status == ARMED"
        side_effects: []

      - from: DISARMED
        to: RETIRED
        trigger: "POST /listings/{listing_id}/lockbox/retire"
        actor: ListingAgent
        preconditions:
          - "Lockbox.status == DISARMED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two ListingAgents accept different offers on the same listing simultaneously"
    guarantee: "At most one Offer.status reaches ACCEPTED; the loser sees the listing already UNDER_CONTRACT."
    error_id: ERR_LISTING_ALREADY_UNDER_CONTRACT
    http_status: 409
    serialization: "First-writer-wins on Listing.status ACTIVE→UNDER_CONTRACT"

  - scenario: "ListingAgent accepts offer while BuyerAgent withdraws the same offer simultaneously"
    guarantee: "Exactly one wins; if withdraw lands first, accept returns the state error; if accept lands first, withdraw fails because Offer is no longer SUBMITTED."
    error_id: ERR_OFFER_NOT_SUBMITTED
    http_status: 409
    serialization: "First-writer-wins on Offer.status"

  - scenario: "Two BuyerAgents request overlapping showings on the same listing and both are approved simultaneously"
    guarantee: "At most one SCHEDULED showing can occupy any [start_at, end_at) interval; the second approval sees the overlap and is rejected."
    error_id: ERR_SHOWING_TIME_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on inserting into the SCHEDULED interval set"

  - scenario: "Concurrent PATCH on Listing fields (price change + feature edit) using stale version"
    guarantee: "Optimistic concurrency: only the request whose version matches Listing.version succeeds; the stale one is rejected."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Version-field CAS on Listing.version"

  - scenario: "Two contingencies (e.g., INSPECTION and APPRAISAL) on the same accepted offer reach their deadlines in the same sweep"
    guarantee: "The sweep processes contingencies in deterministic order (sorted by Contingency.created_at ascending, then id ascending); the first to FAIL triggers the Listing rebound, and the second sees Listing.status already ACTIVE and is recorded as FAILED via the cascade rather than via a fresh trigger."
    error_id: ERR_CONTINGENCY_ALREADY_FAILED
    http_status: 409
    serialization: "Deterministic order: (created_at, id) ascending"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: buyer_match_score
    trigger: "GET /buyers/{id}/matches OR GET /listings/{id}/buyer-matches"
    algorithm: weighted_scoring
    formula: |
      # All percentages are computed against the listing's list_price_cents.
      # Returns a score in [0, 100], two decimal places, round_half_up.

      def fit_price(listing, buyer):
          if buyer.min_price_cents <= listing.list_price_cents <= buyer.max_price_cents:
              return 100.0
          # Outside range: linearly decay over a 10% band, floored at 0.
          if listing.list_price_cents > buyer.max_price_cents:
              over = listing.list_price_cents - buyer.max_price_cents
              band = max(1, buyer.max_price_cents // 10)  # 10% band
              return max(0.0, 100.0 - (over / band) * 100.0)
          # listing.list_price_cents < buyer.min_price_cents
          under = buyer.min_price_cents - listing.list_price_cents
          band = max(1, buyer.min_price_cents // 10)
          return max(0.0, 100.0 - (under / band) * 100.0)

      def fit_location(listing, buyer):
          return 100.0 if listing.zip_code in buyer.desired_zips else 0.0

      def fit_bed_bath(listing, buyer):
          bed_ok = listing.bedrooms >= buyer.min_bedrooms
          bath_ok = listing.bathrooms >= buyer.min_bathrooms
          if bed_ok and bath_ok:
              return 100.0
          if bed_ok or bath_ok:
              return 50.0
          return 0.0

      def fit_features(listing, buyer):
          desired = set(buyer.desired_features)
          if not desired:
              return 100.0
          overlap = desired.intersection(set(listing.features))
          return round((len(overlap) / len(desired)) * 100.0, 4)

      # Pinned weight order and rounding: round_half_up on the FINAL sum only.
      raw = (W_PRICE * fit_price + W_LOC * fit_location +
             W_BB * fit_bed_bath + W_FEAT * fit_features)
      return round_half_up(raw, 2)
    input_set: "Single (Listing, Buyer) pair where Listing.status==ACTIVE and Buyer.status==ACTIVE."
    constants:
      W_PRICE: 0.40
      W_LOC: 0.25
      W_BB: 0.20
      W_FEAT: 0.15
    precision: "2 decimal places, round_half_up applied once to the final weighted sum."
    variants: []

  - name: buyer_match_ranking
    trigger: "GET /buyers/{id}/matches (returns ranked candidate listings) OR GET /listings/{id}/buyer-matches (returns ranked candidate buyers)"
    algorithm: weighted_scoring
    formula: |
      # Build the candidate set:
      #   For /buyers/{id}/matches: all Listing rows with status==ACTIVE.
      #   For /listings/{id}/buyer-matches: all Buyer rows with status==ACTIVE.
      # Compute buyer_match_score for each candidate.
      # Eligibility filter: drop candidates with score < CUTOFF.
      # Ranking: sort by (score DESC, created_at ASC, id ASC).
      # Tie-break: created_at ASC then id ASC (lexicographic).
      # Empty pool: return empty array (HTTP 200, data=[]) — NOT an error.
      return [c for c, s in sorted(scored, key=lambda x: (-x[1], x[0].created_at, x[0].id)) if s >= CUTOFF]
    input_set: "Listing.status==ACTIVE for buyer-side query; Buyer.status==ACTIVE for listing-side query."
    constants:
      CUTOFF: 50.0
    precision: "Cutoff comparison uses the same 2-decimal rounded score; ties broken deterministically."
    variants: []

  - name: co_op_commission_split
    trigger: "Listing transition ACTIVE→UNDER_CONTRACT (variant=PROVISIONAL) and UNDER_CONTRACT→SOLD (variant=FINAL)"
    algorithm: tiered_pricing
    formula: |
      # Inputs (cents): sale_price = accepted Offer.offer_price_cents
      # rates: listing.total_commission_pct (e.g., 0.06), listing.co_op_pct (e.g., 0.025)
      # splits: listing_agent.brokerage_split_pct, buyer_agent.brokerage_split_pct
      #
      # Rounding policy (PINNED):
      #   Step 1: Compute gross at FULL precision; round_half_up to whole cents.
      #   Step 2: Compute buyer_side_cents = round_half_up(sale_price * co_op_pct).
      #   Step 3: listing_side_cents = gross_commission_cents - buyer_side_cents
      #           (residual goes to listing side — never rounded twice).
      #   Step 4: Apply brokerage_split_pct to each side:
      #             listing_agent_cents   = round_half_up(listing_side_cents * listing_agent.brokerage_split_pct)
      #             listing_brokerage_cents = listing_side_cents - listing_agent_cents
      #             buyer_agent_cents     = round_half_up(buyer_side_cents * buyer_agent.brokerage_split_pct)
      #             buyer_brokerage_cents = buyer_side_cents - buyer_agent_cents
      #
      # Pinned order: Step 1 → 2 → 3 → 4. NEVER compute listing_side independently.
      # The residual-assignment in Step 3 guarantees gross = listing_side + buyer_side exactly (no penny drift).

      gross_commission_cents     = round_half_up(sale_price * total_commission_pct)
      buyer_side_cents           = round_half_up(sale_price * co_op_pct)
      listing_side_cents         = gross_commission_cents - buyer_side_cents
      listing_agent_cents        = round_half_up(listing_side_cents * la.brokerage_split_pct)
      listing_brokerage_cents    = listing_side_cents - listing_agent_cents
      buyer_agent_cents          = round_half_up(buyer_side_cents * ba.brokerage_split_pct)
      buyer_brokerage_cents      = buyer_side_cents - buyer_agent_cents
    input_set: "The Listing's accepted Offer at the trigger moment; the listing_agent referenced by Listing.listing_agent_id; the buyer_agent referenced by Buyer.buyer_agent_id (for the accepted Offer's Buyer)."
    constants: {}
    precision: "All cents are integers; intermediate rounding pinned per the formula. round_half_up everywhere."
    variants:
      - name: PROVISIONAL
        when: "Computed at ACTIVE→UNDER_CONTRACT using accepted Offer.offer_price_cents and the LISTING_AGENT / BUYER_AGENT current at that moment."
        difference: "Buyer agent identity and brokerage_split_pct are captured at acceptance time and stored on the CommissionSplit row. Subsequent agent edits do NOT mutate this row."
      - name: FINAL
        when: "Computed at UNDER_CONTRACT→SOLD using accepted Offer.offer_price_cents at SOLD time and the agents' CURRENT brokerage_split_pct as of SOLD."
        difference: "If a brokerage_split_pct changed between acceptance and close, FINAL diverges from PROVISIONAL even though sale_price is identical. The PROVISIONAL row is NOT updated; both rows coexist."

  - name: offer_net_to_seller
    trigger: "Offer SUBMITTED→ACCEPTED (PROVISIONAL); recomputed at UNDER_CONTRACT→SOLD using actuals (FINAL)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL (at acceptance):
      provisional_net = (
          offer_price_cents
          - estimated_seller_concessions_cents
          - round_half_up(offer_price_cents * listing.co_op_pct)
          - round_half_up(offer_price_cents * (listing.total_commission_pct - listing.co_op_pct))
      )

      # FINAL (at close):
      final_net = (
          accepted_offer.offer_price_cents
          - actual_seller_concessions_cents     # = sum of Counter.counter_concessions_cents along the negotiation chain, capped at offer_price_cents
          - buyer_side_cents                    # from CommissionSplit FINAL row
          - listing_side_cents                  # from CommissionSplit FINAL row
      )
    input_set: "For PROVISIONAL, only fields known at acceptance. For FINAL, also the resolved CommissionSplit FINAL row."
    constants: {}
    precision: "Whole cents; round_half_up on each commission term."
    variants:
      - name: PROVISIONAL
        when: "At Offer SUBMITTED→ACCEPTED."
        difference: "Uses estimated_seller_concessions_cents from the Offer and commission rates from the Listing — both as of acceptance."
      - name: FINAL
        when: "At Listing UNDER_CONTRACT→SOLD."
        difference: "Uses actual_seller_concessions_cents = SUM(Counter.counter_concessions_cents for Counter rows along the negotiation chain reaching the accepted Offer, status == REBOUND, ordered by created_at ASC), capped at offer_price_cents. Final commission cents come from the FINAL CommissionSplit row. The two variants can differ because (a) actual concessions may exceed the original estimate and (b) brokerage_split_pct changes shift commission distribution."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of {ListingAgent, BuyerAgent, MlsAdmin}"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID header present and resolves to an existing Agent row (or opaque MlsAdmin id) consistent with X-User-Role"
    error_id: ERR_AUTH_INVALID
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role permitted to call this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path resources exist (Listing → Offer → Counter / Contingency / ShowingAppointment / Lockbox), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Cross-aggregate ownership: the acting agent must be the LISTING_AGENT (or DUAL_AGENT on listing side) of the Listing for listing-side actions; BUYER_AGENT (or DUAL_AGENT on buyer side) of the Buyer.buyer_agent_id for buyer-side actions"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "POST listing-side and buyer-side action endpoints"

  - priority: 6
    category: state
    check: "Target entity in correct state for the requested transition (see §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "Listing already UNDER_CONTRACT when ACCEPT is requested on a sibling offer"
    error_id: ERR_LISTING_ALREADY_UNDER_CONTRACT
    http_status: 409
    applies_to: "POST /listings/{id}/offers/{offer_id}/accept"

  - priority: 8
    category: state
    check: "Offer is no longer SUBMITTED when accept/counter/withdraw/reject is requested"
    error_id: ERR_OFFER_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /listings/{id}/offers/{offer_id}/{accept|counter|reject|withdraw}"

  - priority: 9
    category: state
    check: "Lockbox.status != ARMED when arm/access is requested in a way that requires the opposite state"
    error_id: ERR_LOCKBOX_STATE
    http_status: 409
    applies_to: "lockbox endpoints"

  - priority: 10
    category: business_safety
    check: "Lockbox must be ARMED before a showing can be approved (so the buyer agent can be vended an access code)"
    error_id: ERR_LOCKBOX_NOT_ARMED
    http_status: 409
    applies_to: "POST /listings/{id}/showings/{showing_id}/approve"

  - priority: 11
    category: business_referential
    check: "On showing approval, no overlapping SCHEDULED showing for the same listing using half-open intervals [start_at, end_at). Adjacency at start==other.end (or end==other.start) is allowed."
    error_id: ERR_SHOWING_TIME_OVERLAP
    http_status: 409
    applies_to: "POST /listings/{id}/showings/{showing_id}/approve"

  - priority: 12
    category: business_referential
    check: "Counter rebound: counter_expires_at must not have passed"
    error_id: ERR_COUNTER_EXPIRED
    http_status: 409
    applies_to: "POST /listings/{id}/offers/{offer_id}/rebound"

  - priority: 13
    category: business_temporal
    check: "Offer.expires_at must be strictly in the future at creation and at accept time"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /listings/{id}/offers and POST /listings/{id}/offers/{offer_id}/accept"

  - priority: 14
    category: business_temporal
    check: "Contingency.deadline_at must be strictly after the accepted Offer's acceptance time and strictly in the future on creation"
    error_id: ERR_CONTINGENCY_DEADLINE_INVALID
    http_status: 422
    applies_to: "POST /listings/{id}/contingencies"

  - priority: 15
    category: business_constraint
    check: "Listing fields: list_price_cents >= 1_000_000; co_op_pct in [0, 0.06]; total_commission_pct in [co_op_pct, 0.10]"
    error_id: ERR_INVALID_LISTING_FIELDS
    http_status: 422
    applies_to: "POST /listings and PATCH /listings/{id}"

  - priority: 16
    category: business_constraint
    check: "Buyer fields: min_price_cents <= max_price_cents; desired_zips non-empty"
    error_id: ERR_INVALID_BUYER_FIELDS
    http_status: 422
    applies_to: "POST /buyers and PATCH /buyers/{id}"

  - priority: 17
    category: business_fiscal
    check: "Offer.earnest_money_cents <= Offer.offer_price_cents and Offer.estimated_seller_concessions_cents <= Offer.offer_price_cents"
    error_id: ERR_INVALID_OFFER_FISCAL
    http_status: 422
    applies_to: "POST /listings/{id}/offers"

  - priority: 18
    category: business_constraint
    check: "ShowingAppointment duration in [15 min, 4 hours]; start_at strictly in the future at request time"
    error_id: ERR_INVALID_SHOWING_WINDOW
    http_status: 422
    applies_to: "POST /listings/{id}/showings"

  - priority: 19
    category: business_constraint
    check: "Optimistic concurrency: PATCH/PUT requires `version` matching stored version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /listings/{id}, PATCH /buyers/{id}, PATCH /agents/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Agents ---
  - method: POST
    path: "/agents"
    description: "Register a new agent (LISTING_AGENT, BUYER_AGENT, or DUAL_AGENT)."
    roles: [MlsAdmin]
    code: 201
    input: ["full_name", "brokerage_name", "agent_role", "license_number", "brokerage_split_pct?"]
    output: Agent
    side_effects: []

  - method: GET
    path: "/agents/{id}"
    description: "Fetch an agent."
    roles: [ListingAgent, BuyerAgent, MlsAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: PATCH
    path: "/agents/{id}"
    description: "Update brokerage_split_pct or status. Requires version."
    roles: [MlsAdmin]
    code: 200
    input: ["brokerage_split_pct?", "status?", "version"]
    output: Agent
    side_effects: []

  # --- Listings ---
  - method: POST
    path: "/listings"
    description: "Create a new active listing."
    roles: [ListingAgent]
    code: 201
    input: [listing_agent_id, address_line, zip_code, list_price_cents, bedrooms, bathrooms, features, co_op_pct, total_commission_pct]
    output: Listing
    side_effects:
      - "listing_agent_id must equal X-User-ID"

  - method: GET
    path: "/listings/{id}"
    description: "Fetch a listing."
    roles: [ListingAgent, BuyerAgent, MlsAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/listings"
    description: "List listings with optional filters."
    roles: [ListingAgent, BuyerAgent, MlsAdmin]
    code: 200
    input: ["status?", "zip_code?", "min_price_cents?", "max_price_cents?", "limit?", "offset?"]
    output: "Listing[]"
    side_effects: []

  - method: PATCH
    path: "/listings/{id}"
    description: "Edit price, features, commission rates, status. OCC via version."
    roles: [ListingAgent]
    code: 200
    input: ["list_price_cents?", "features?", "co_op_pct?", "total_commission_pct?", "version"]
    output: Listing
    side_effects: []

  - method: POST
    path: "/listings/{id}/withdraw"
    description: "Withdraw an ACTIVE listing from market."
    roles: [ListingAgent]
    code: 200
    input: [version]
    output: Listing
    side_effects:
      - "All open ShowingAppointment rows for the listing transition to CANCELLED"
      - "Lockbox transitions to DISARMED"

  - method: POST
    path: "/listings/{id}/close"
    description: "Close an UNDER_CONTRACT listing (mark SOLD)."
    roles: [ListingAgent]
    code: 200
    input: [version]
    output: Listing
    side_effects:
      - "Emit FINAL CommissionSplit"
      - "Buyer.status := SOLD"
      - "Lockbox.status := RETIRED"
      - "All open ShowingAppointments → CANCELLED"

  - method: GET
    path: "/listings/{id}/buyer-matches"
    description: "Ranked candidate buyers for this listing using buyer_match_score with weights from §1.3."
    roles: [ListingAgent, MlsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "object[]  # {buyer_id, score}"
    side_effects: []

  # --- Buyers ---
  - method: POST
    path: "/buyers"
    description: "Register a buyer profile."
    roles: [BuyerAgent]
    code: 201
    input: [buyer_agent_id, full_name, max_price_cents, min_price_cents, min_bedrooms, min_bathrooms, desired_zips, desired_features]
    output: Buyer
    side_effects:
      - "buyer_agent_id must equal X-User-ID"

  - method: GET
    path: "/buyers/{id}"
    description: "Fetch a buyer."
    roles: [BuyerAgent, MlsAdmin]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  - method: PATCH
    path: "/buyers/{id}"
    description: "Edit buyer preferences; OCC via version."
    roles: [BuyerAgent]
    code: 200
    input: ["max_price_cents?", "min_price_cents?", "min_bedrooms?", "min_bathrooms?", "desired_zips?", "desired_features?", "status?", "version"]
    output: Buyer
    side_effects: []

  - method: GET
    path: "/buyers/{id}/matches"
    description: "Ranked candidate listings for this buyer."
    roles: [BuyerAgent, MlsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "object[]  # {listing_id, score}"
    side_effects: []

  # --- Lockbox ---
  - method: POST
    path: "/listings/{listing_id}/lockbox"
    description: "Mount a lockbox on an ACTIVE listing."
    roles: [ListingAgent]
    code: 201
    input: [serial_number]
    output: Lockbox
    side_effects:
      - "Server mints initial access_code"

  - method: POST
    path: "/listings/{listing_id}/lockbox/arm"
    description: "Arm (or re-arm) the lockbox; rotates access_code."
    roles: [ListingAgent]
    code: 200
    input: []
    output: Lockbox
    side_effects:
      - "access_code regenerated, code_rotated_at := now()"

  - method: POST
    path: "/listings/{listing_id}/lockbox/disarm"
    description: "Disarm the lockbox."
    roles: [ListingAgent]
    code: 200
    input: []
    output: Lockbox
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/lockbox/retire"
    description: "Retire a DISARMED lockbox."
    roles: [ListingAgent]
    code: 200
    input: []
    output: Lockbox
    side_effects: []

  # --- Showings ---
  - method: POST
    path: "/listings/{listing_id}/showings"
    description: "Request a showing window."
    roles: [BuyerAgent]
    code: 201
    input: [buyer_agent_id, buyer_id, start_at, end_at]
    output: ShowingAppointment
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/showings/{id}/approve"
    description: "Listing agent approves the showing; checks lockbox ARMED and time-overlap."
    roles: [ListingAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects:
      - "Listing.showing_count incremented"
      - "lockbox_access_granted_at := now(); lockbox access_code is delivered in response body"

  - method: POST
    path: "/listings/{listing_id}/showings/{id}/complete"
    description: "Buyer agent reports the showing as completed."
    roles: [BuyerAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/showings/{id}/cancel"
    description: "Cancel a REQUESTED or SCHEDULED showing."
    roles: [ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects:
      - "If was SCHEDULED, Listing.showing_count decremented"

  # --- Offers ---
  - method: POST
    path: "/listings/{listing_id}/offers"
    description: "Submit a new offer (round 1) or a rebound offer (round N+1 via parent_counter_id)."
    roles: [BuyerAgent]
    code: 201
    input: ["buyer_id", "offer_price_cents", "earnest_money_cents", "estimated_seller_concessions_cents?", "expires_at", "parent_counter_id?"]
    output: Offer
    side_effects: []

  - method: GET
    path: "/listings/{listing_id}/offers"
    description: "List offers on a listing, optionally filtered by status."
    roles: [ListingAgent, MlsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Offer[]"
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/offers/{id}/accept"
    description: "Listing agent accepts an offer. Cascades to reject siblings, withdraw their counters, transition listing to UNDER_CONTRACT, emit PROVISIONAL CommissionSplit."
    roles: [ListingAgent]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "All other SUBMITTED offers on this listing → REJECTED"
      - "Their OPEN counters → WITHDRAWN"
      - "Listing.status := UNDER_CONTRACT; Listing.accepted_offer_id := offer.id"
      - "Emit CommissionSplit variant=PROVISIONAL"
      - "Offer.provisional_net_to_seller_cents computed"

  - method: POST
    path: "/listings/{listing_id}/offers/{id}/reject"
    description: "Listing agent rejects an offer."
    roles: [ListingAgent]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "Any OPEN counter tied to this offer → WITHDRAWN"

  - method: POST
    path: "/listings/{listing_id}/offers/{id}/withdraw"
    description: "Buyer agent withdraws their own offer."
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "Any OPEN counter tied to this offer → WITHDRAWN"

  - method: POST
    path: "/listings/{listing_id}/offers/{id}/counter"
    description: "Listing agent issues a counter on a SUBMITTED offer."
    roles: [ListingAgent]
    code: 201
    input: [counter_price_cents, counter_concessions_cents, counter_expires_at]
    output: Counter
    side_effects:
      - "Offer.status := COUNTERED"

  - method: POST
    path: "/listings/{listing_id}/offers/{id}/rebound"
    description: "Buyer agent rebounds (responds with a new offer) to an OPEN counter on a COUNTERED offer."
    roles: [BuyerAgent]
    code: 201
    input: ["offer_price_cents", "earnest_money_cents", "estimated_seller_concessions_cents?", "expires_at"]
    output: Offer
    side_effects:
      - "Original Counter.status := REBOUND"
      - "New Offer.round_no := previous Offer.round_no + 1; parent_counter_id := rebounded counter.id"

  # --- Contingencies ---
  - method: POST
    path: "/listings/{listing_id}/contingencies"
    description: "Attach a contingency (INSPECTION/APPRAISAL/FINANCING) to the accepted offer."
    roles: [BuyerAgent]
    code: 201
    input: [offer_id, kind, deadline_at]
    output: Contingency
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/contingencies/{id}/satisfy"
    description: "Mark contingency SATISFIED."
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Contingency
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/contingencies/{id}/waive"
    description: "Waive contingency."
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Contingency
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/contingencies/{id}/fail"
    description: "Fail a contingency; cascades the listing back to ACTIVE."
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Contingency
    side_effects:
      - "Listing.status := ACTIVE; sibling PENDING contingencies → FAILED; accepted Offer → WITHDRAWN"

  # --- CommissionSplit (read-only) ---
  - method: GET
    path: "/listings/{listing_id}/commission-splits"
    description: "Return all CommissionSplit rows for a listing (PROVISIONAL and FINAL)."
    roles: [ListingAgent, MlsAdmin]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: "CommissionSplit[]"
    side_effects: []

  # --- Test harness endpoints (REQUIRED for test reachability) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock to a given ISO 8601 timestamp."
    roles: [MlsAdmin]
    code: 200
    input: [to]
    output: "object  # {now}"
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Run the deferred-action sweep. Auto-expires Offers, Counters, Contingencies, Listings whose deadlines have passed, in deterministic order. Also auto-transitions SCHEDULED showings to NO_SHOW when end_at is past and access was not granted."
    roles: [MlsAdmin]
    code: 200
    input: []
    output: "object  # {expired_offers, expired_counters, failed_contingencies, expired_listings, no_show_showings}"
    side_effects:
      - "Triggers all time-gated transitions defined in §1.2 in deterministic order: (entity_type ordinal {Contingency=1, Offer=2, Counter=3, ShowingAppointment=4, Listing=5}, created_at ASC, id ASC)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_AUTH_INVALID
    http: 401
    condition: "X-User-ID does not resolve to a valid Agent (or MlsAdmin id), or role mismatch"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to call this endpoint"
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "Caller's agent id is not the LISTING_AGENT of the Listing (listing-side action) or the BUYER_AGENT of the Buyer (buyer-side action)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in correct state for the requested transition (generic)"
  - id: ERR_LISTING_ALREADY_UNDER_CONTRACT
    http: 409
    condition: "Listing is no longer ACTIVE when accept is attempted on a sibling offer"
  - id: ERR_OFFER_NOT_SUBMITTED
    http: 409
    condition: "Offer is not in SUBMITTED state when accept/counter/withdraw/reject is requested"
  - id: ERR_LOCKBOX_STATE
    http: 409
    condition: "Lockbox state is wrong for the requested transition (e.g., arm an ARMED box; retire an ARMED box)"
  - id: ERR_LOCKBOX_NOT_ARMED
    http: 409
    condition: "Lockbox not ARMED when a showing approval is attempted"
  - id: ERR_SHOWING_TIME_OVERLAP
    http: 409
    condition: "Approving a showing whose [start_at, end_at) overlaps an existing SCHEDULED showing on the same listing"
  - id: ERR_COUNTER_EXPIRED
    http: 409
    condition: "Counter rebound attempted after counter_expires_at"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Offer expires_at <= now() at creation or accept time"
  - id: ERR_CONTINGENCY_DEADLINE_INVALID
    http: 422
    condition: "Contingency deadline_at not strictly in the future, or not after accepted offer's acceptance time"
  - id: ERR_INVALID_LISTING_FIELDS
    http: 422
    condition: "Listing fields out of allowed range (price too low, co_op_pct > 0.06, total_commission_pct outside [co_op_pct, 0.10])"
  - id: ERR_INVALID_BUYER_FIELDS
    http: 422
    condition: "Buyer fields invalid (min_price_cents > max_price_cents; empty desired_zips)"
  - id: ERR_INVALID_OFFER_FISCAL
    http: 422
    condition: "earnest_money_cents > offer_price_cents OR estimated_seller_concessions_cents > offer_price_cents"
  - id: ERR_INVALID_SHOWING_WINDOW
    http: 422
    condition: "Showing duration outside [15 min, 4 hours] or start_at not strictly in the future"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided `version` does not match stored version on PATCH/PUT"
  - id: ERR_CONTINGENCY_ALREADY_FAILED
    http: 409
    condition: "Concurrent contingency fail attempts; loser sees the listing already returned to ACTIVE via cascade"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ListingAgent
    description: "Acts on the listing side: creates and edits Listings, manages Lockbox, approves Showings, issues Counters, accepts/rejects Offers, closes Listings."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /listings"
      - "PATCH /listings/{id}"
      - "POST /listings/{id}/withdraw"
      - "POST /listings/{id}/close"
      - "POST /listings/{id}/lockbox*"
      - "POST /listings/{id}/showings/{showing_id}/approve"
      - "POST /listings/{id}/offers/{offer_id}/accept"
      - "POST /listings/{id}/offers/{offer_id}/reject"
      - "POST /listings/{id}/offers/{offer_id}/counter"
    shared_operations:
      - "GET /listings, GET /listings/{id}"
      - "GET /agents/{id}"
      - "POST /listings/{id}/showings/{showing_id}/cancel (with BuyerAgent)"

  - name: BuyerAgent
    description: "Acts on the buyer side: creates Buyer profiles, requests Showings, submits Offers, rebounds Counters, withdraws Offers, manages Contingencies."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /buyers"
      - "PATCH /buyers/{id}"
      - "POST /listings/{id}/showings (request)"
      - "POST /listings/{id}/showings/{showing_id}/complete"
      - "POST /listings/{id}/offers"
      - "POST /listings/{id}/offers/{offer_id}/withdraw"
      - "POST /listings/{id}/offers/{offer_id}/rebound"
      - "POST /listings/{id}/contingencies"
      - "POST /listings/{id}/contingencies/{contingency_id}/{satisfy|waive|fail}"
    shared_operations:
      - "GET /listings, GET /listings/{id}"
      - "GET /buyers/{id}"
      - "POST /listings/{id}/showings/{showing_id}/cancel (with ListingAgent)"

  - name: MlsAdmin
    description: "Operational role: onboards agents, runs the deferred-action sweep, reads cross-cutting reports (commission splits, all offers)."
    identity: "opaque"
    exclusive_operations:
      - "POST /agents"
      - "PATCH /agents/{id}"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET /listings, GET /listings/{id}, GET /listings/{listing_id}/offers"
      - "GET /agents/{id}"
      - "GET /buyers/{id}"
      - "GET /listings/{listing_id}/commission-splits"
      - "GET /listings/{listing_id}/buyer-matches and GET /buyers/{id}/matches"
