    roles: [Homeowner, InsuranceAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["basis?"]
    output: { policy_id: string, basis: string, total_value_cents: integer, total_covered_cents: integer, coverage_gap_cents: integer, item_count: integer, schedule_required_unscheduled_count: integer }
    side_effects: []

  - method: POST
    path: "/vault/packages"
    description: "Opens a documentation package in DRAFT against a policy."
    roles: [Homeowner]
    code: 201
    input: [household_id, policy_id]
    output: DocumentationPackage
    side_effects: []

  - method: GET
    path: "/vault/packages/{package_id}"
    description: "Reads one package. From GENERATED onward every snapshot total is frozen."
    roles: [Homeowner, InsuranceAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: DocumentationPackage
    side_effects: []

  - method: GET
    path: "/vault/packages"
    description: "Lists packages. Reverse-reachability channel for DocumentationPackage.household_id, policy_id and superseded_by_package_id."
    roles: [Homeowner, InsuranceAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["household_id?", "policy_id?", "superseded_by_package_id?", "status?", "limit?", "offset?"]
    output: DocumentationPackage[]
    side_effects: []

  - method: POST
    path: "/vault/packages/{package_id}/generate"
    description: "Freezes the snapshot. OCC parent is the Household. Blocked while the household is RESTRICTED."
    roles: [Homeowner]
    code: 200
    input: [expected_household_version]
    output: DocumentationPackage
    side_effects:
      - "runs calculations.package_totals_snapshot and creates one immutable PackageLine per eligible item"
      - "runs the four-hop supersede cascade on state_machines.DocumentationPackage.status DRAFT -> GENERATED"
      - "Subscription.packages_used_this_period incremented"
      - "increments Household.version by 1, DocumentationPackage.version by 1 and Subscription.version by 1"

  - method: POST
    path: "/vault/packages/{package_id}/deliver"
    description: "Delivers the frozen package to a recipient. Snapshot totals are not recomputed."
    roles: [Homeowner, InsuranceAgent]
    code: 200
    input: [recipient_ref]
    output: DocumentationPackage
    side_effects:
      - "delivered_at := now"
      - "increments DocumentationPackage.version by 1"

  - method: GET
    path: "/vault/package-lines/{package_line_id}"
    description: "Reads one frozen package line."
    roles: [Homeowner, InsuranceAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: PackageLine
    side_effects: []

  - method: GET
    path: "/vault/package-lines"
    description: "Lists package lines. Reverse-reachability channel for PackageLine.package_id and item_id."
    roles: [Homeowner, InsuranceAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["package_id?", "item_id?", "stale?", "limit?", "offset?"]
    output: PackageLine[]
    side_effects: []

  - method: POST
    path: "/vault/claims"
    description: "Opens a loss claim against a frozen evidence package and freezes every CATALOGED item in the affected rooms. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [Homeowner]
    code: 201
    input: [household_id, package_id, policy_id, loss_date, peril, settlement_basis, affected_room_ids, "deductible_mode?"]
    output: LossClaim
    side_effects:
      - "rejected at ladder rung 14 with ERR_INVALID_STATE when the referenced package is not in status GENERATED or DELIVERED, or when policy_id does not equal the package's policy_id"
      - "runs the records-freeze cascade: items CATALOGED -> FROZEN, Household.frozen_item_count and records_freeze_active updated"
      - "any PROPOSED EstatePlan holding an allocation on a frozen item is pushed back to DRAFT and those allocations get blocked := true"
      - "increments Household.version by 1 and every frozen Item.version by 1"

  - method: GET
    path: "/vault/claims/{claim_id}"
    description: "Reads one claim."
    roles: [Homeowner, ClaimsAdjuster, InsuranceAgent, PlatformAdmin]
    code: 200
    input: []
    output: LossClaim
    side_effects: []

  - method: GET
    path: "/vault/claims"
    description: "Lists claims. Reverse-reachability channel for LossClaim.household_id, package_id and policy_id."
    roles: [Homeowner, ClaimsAdjuster, InsuranceAgent, PlatformAdmin]
    code: 200
    input: ["household_id?", "package_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: LossClaim[]
    side_effects: []

  - method: POST
    path: "/vault/claims/{claim_id}/lines"
    description: "Adds a per-item settlement line. Requires the item's evidence tier to reach PHOTO_SERIAL. The item need NOT sit in the claim's affected_room_ids - only items in those rooms are records-frozen, so a claimed item outside them stays editable and its evidence can still be deleted. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [Homeowner]
    code: 201
    input: [item_id, claimed_quantity]
    output: ClaimLine
    side_effects:
      - "LossClaim.line_count incremented"
      - "increments LossClaim.version by 1"

  - method: GET
    path: "/vault/claim-lines/{claim_line_id}"
    description: "Reads one claim line with its settlement arithmetic."
    roles: [Homeowner, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []

  - method: GET
    path: "/vault/claim-lines"
    description: "Lists claim lines. Reverse-reachability channel for ClaimLine.claim_id and item_id."
    roles: [Homeowner, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["claim_id?", "item_id?", "status?", "limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  - method: POST
    path: "/vault/claims/{claim_id}/submit"
    description: "Submits the claim and runs calculations.claim_settlement_allocation across every line. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [Homeowner]
    code: 200
    input: []
    output: LossClaim
    side_effects:
      - "writes gross_value_cents, capped_value_cents, deductible_share_cents and net_settlement_cents on every line"
      - "increments LossClaim.version by 1 and every ClaimLine.version by 1"

  - method: POST
    path: "/vault/claim-lines/{claim_line_id}/adjudicate"
    description: "The adjuster approves or denies one line. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "denial_reason?"]
    output: ClaimLine
    side_effects:
      - "bubbles the claim SUBMITTED -> UNDER_REVIEW on the first adjudication and SUPPLEMENT_REQUESTED -> UNDER_REVIEW when no APPEALED line remains"
      - "may auto-transition the claim UNDER_REVIEW -> DENIED when every line is denied"
      - "increments ClaimLine.version by 1 and LossClaim.version by 1"

  - method: POST
    path: "/vault/claim-lines/{claim_line_id}/appeal"
    description: "The homeowner appeals a denied line, bounded by MAX_APPEALS_PER_LINE. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [Homeowner]
    code: 200
    input: ["appeal_note?"]
    output: ClaimLine
    side_effects:
      - "appeal_count incremented; denial_reason cleared; claim UNDER_REVIEW -> SUPPLEMENT_REQUESTED"
      - "increments ClaimLine.version by 1 and LossClaim.version by 1"

  - method: POST
    path: "/vault/claims/{claim_id}/settle"
    description: "Settles the claim, re-running the deductible allocation over the APPROVED subset and releasing the records freeze. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: LossClaim
    side_effects:
      - "total_settlement_cents written; every frozen item returns to CATALOGED"
      - "increments LossClaim.version by 1, Household.version by 1 and every unfrozen Item.version by 1"

  - method: POST
    path: "/vault/claims/{claim_id}/withdraw"
    description: "Compensating action for opening a claim: unfreezes exactly the items this claim froze. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [Homeowner]
    code: 200
    input: ["withdraw_reason?"]
    output: LossClaim
    side_effects:
      - "every item with frozen_by_claim_id == this claim returns to CATALOGED; Household.frozen_item_count restored"
      - "ACTIVE share grants scoped to this claim become VOIDED_BY_SCOPE with voided_reason SCOPE_DELETED"
      - "increments LossClaim.version by 1 and Household.version by 1"

  - method: POST
    path: "/vault/estate-plans"
    description: "Opens an estate or downsizing disposition plan in DRAFT."
    roles: [Homeowner]
    code: 201
    input: [household_id, executor_member_id, "valuation_mode?"]
    output: EstatePlan
    side_effects:
      - "rejected at ladder rung 14 with ERR_INVALID_STATE when the household already holds an EstatePlan whose status is in {DRAFT, PROPOSED, APPROVED}; a household may hold at most one live plan so Item.allocated_quantity is unambiguous"
      - "unallocated_item_count initialised to the count of CATALOGED items in the household"

  - method: GET
    path: "/vault/estate-plans/{estate_plan_id}"
    description: "Reads one estate plan with its fair-division verdict."
    roles: [Homeowner, EstateExecutor, PlatformAdmin]
    code: 200
    input: []
    output: EstatePlan
    side_effects: []

  - method: GET
    path: "/vault/estate-plans"
    description: "Lists estate plans. Reverse-reachability channel for EstatePlan.household_id, executor_member_id and approved_by_member_id."
    roles: [Homeowner, EstateExecutor, PlatformAdmin]
    code: 200
    input: ["household_id?", "executor_member_id?", "approved_by_member_id?", "status?", "limit?", "offset?"]
    output: EstatePlan[]
    side_effects: []

  - method: POST
    path: "/vault/estate-plans/{estate_plan_id}/allocations"
    description: "Allocates units of an item to an heir or a disposition. OCC parent is the EstatePlan."
    roles: [EstateExecutor]
    code: 201
    input: [item_id, disposition, quantity, expected_estate_plan_version, "heir_member_id?"]
    output: Allocation
    side_effects:
      - "allocated_value_cents computed; Item.allocated_quantity increased; EstatePlan.unallocated_item_count recomputed"
      - "increments EstatePlan.version by 1 and Item.version by 1"

  - method: GET
    path: "/vault/allocations/{allocation_id}"
    description: "Reads one allocation."
    roles: [Homeowner, EstateExecutor, PlatformAdmin]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: GET
    path: "/vault/allocations"
    description: "Lists allocations. Reverse-reachability channel for Allocation.estate_plan_id, item_id and heir_member_id."
    roles: [Homeowner, EstateExecutor, PlatformAdmin]
    code: 200
    input: ["estate_plan_id?", "item_id?", "heir_member_id?", "disposition?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  - method: DELETE
    path: "/vault/allocations/{allocation_id}"
    description: "Compensating action for allocation creation; on a PROPOSED plan it also forces the plan back to DRAFT."
    roles: [EstateExecutor]
    code: 200
    input: []
    output: Allocation
    side_effects:
      - "Item.allocated_quantity decreased by exactly this row's quantity; EstatePlan.unallocated_item_count recomputed"
      - "EstatePlan PROPOSED -> DRAFT with balance_spread_pct := null and balanced := false"
      - "increments EstatePlan.version by 1 and Item.version by 1"

  - method: POST
    path: "/vault/estate-plans/{estate_plan_id}/propose"
    description: "Proposes the plan after the conservation check and runs the fair-division balance. Legal from DRAFT and from PROPOSED; a re-proposal may supply a different valuation_mode to rescore the same allocations."
    roles: [EstateExecutor]
    code: 200
    input: ["valuation_mode?"]
    output: EstatePlan
    side_effects:
      - "valuation_mode := body value when supplied, otherwise unchanged"
      - "runs calculations.estate_fair_division_balance under valuation_mode; writes balance_spread_pct and balanced"
      - "increments EstatePlan.version by 1"

  - method: POST
    path: "/vault/estate-plans/{estate_plan_id}/approve"
    description: "The homeowner approves the executor's plan. Segregation of duties bars the executor from approving their own plan."
    roles: [Homeowner]
    code: 200
    input: ["override_unbalanced?"]
    output: EstatePlan
    side_effects:
      - "approved_by_member_id := X-User-ID"
      - "increments EstatePlan.version by 1"

  - method: POST
    path: "/vault/estate-plans/{estate_plan_id}/execute"
    description: "Executes the dispositions; the four-hop cascade disposes items and releases their scheduled allowance."
    roles: [EstateExecutor]
    code: 200
    input: []
    output: EstatePlan
    side_effects:
      - "runs the four-hop execute cascade on state_machines.EstatePlan.status APPROVED -> EXECUTED"
      - "increments EstatePlan.version, each disposed Item.version, Policy.version and Household.version by 1"

  - method: POST
    path: "/vault/share-grants"
    description: "Issues a time-boxed, redaction-scoped share link. Blocked while the household is RESTRICTED."
    roles: [Homeowner]
    code: 201
    input: [household_id, scope_kind, recipient_ref, redaction_level, starts_at, expires_at, "scope_room_id?", "scope_package_id?", "scope_claim_id?", "access_cap?"]
    output: ShareGrant
    side_effects:
      - "share_token minted; Household.active_share_count incremented"
      - "increments Household.version by 1"

  - method: GET
    path: "/vault/share-grants/{share_grant_id}"
    description: "Reads one share grant including its access meter."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: ShareGrant
    side_effects: []

  - method: GET
    path: "/vault/share-grants"
    description: "Lists share grants. Reverse-reachability channel for ShareGrant.household_id, scope_room_id, scope_package_id and scope_claim_id."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: ["household_id?", "scope_room_id?", "scope_package_id?", "scope_claim_id?", "status?", "limit?", "offset?"]
    output: ShareGrant[]
    side_effects: []

  - method: POST
    path: "/vault/share-grants/{share_grant_id}/revoke"
    description: "Revokes a share grant. On the WRITE_GATE_EXCLUSION_LIST."
    roles: [Homeowner]
    code: 200
    input: []
    output: ShareGrant
    side_effects:
      - "status := REVOKED; Household.active_share_count decremented"
      - "increments ShareGrant.version by 1 and Household.version by 1"

  - method: GET
    path: "/vault/shared/{share_token}"
    description: "Redeems a share link and returns the scoped, redacted projection. Increments access_count before rendering."
    roles: [Anonymous, InsuranceAgent, ClaimsAdjuster]
    code: 200
    input: []
    output: { share_grant_id: string, scope_kind: string, redaction_level: string, access_count: integer, access_cap: integer, household_name: string, rows: array, total_effective_value_cents: integer }
    side_effects:
      - "access_count incremented by 1; the grant transitions ACTIVE -> EXHAUSTED when the post-increment count equals access_cap"
      - "increments ShareGrant.version by 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or unrecognised, or X-User-ID missing for a non-Anonymous role (ladder rung 1)."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles (ladder rung 2)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong JSON type, empty required array, unparseable datetime, inspection_end_at <= inspection_start_at, expires_at <= starts_at, byte_size < 1, access_cap < 1, or a duplicate Member.email (ladder rung 3)."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "A value outside the declared member set of one of the enum fields listed in ladder rung 4's closed iff-list."
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "A household id in the path or body does not resolve (ladder rungs 5 and 6)."
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "An item id in the path does not resolve (ladder rung 5)."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Any other referenced resource - member, room, subscription, policy, package, package line, appraiser, appraisal, claim, claim line, estate plan, allocation, share grant, asset, or a member of affected_room_ids - does not resolve (ladder rungs 5 and 6)."
  - id: ERR_SHARE_TOKEN_UNKNOWN
    http: 404
    condition: "The {share_token} path segment matches no ShareGrant row (ladder rung 7). Deliberately distinct from ERR_SHARE_GRANT_INACTIVE so a recipient with no grant is distinguishable from one whose grant died."
  - id: ERR_HOUSEHOLD_SCOPE_VIOLATION
    http: 403
    condition: "The acting member's household_id does not match the target resource's household, an Appraiser acts on an appraisal that is not theirs, or a member_role-gated operation is attempted by the wrong member_role (ladder rung 8)."
  - id: ERR_SHARE_GRANT_INACTIVE
    http: 403
    condition: "The resolved ShareGrant is REVOKED, EXPIRED, EXHAUSTED, VOIDED_BY_SCOPE, outside its half-open window, or has access_count >= access_cap (ladder rung 9)."
  - id: ERR_VAULT_READ_ONLY
    http: 403
    condition: "Household.write_gate_state == READ_ONLY and the endpoint is a mutating /vault endpoint outside WRITE_GATE_EXCLUSION_LIST (ladder rung 10)."
  - id: ERR_REFRESH_OVERDUE
    http: 403
    condition: "Household.write_gate_state == RESTRICTED and the endpoint is in RESTRICTED_GATE_BLOCK_LIST (ladder rung 11)."
  - id: ERR_ITEM_FROZEN
    http: 409
    condition: "The target item is FROZEN by an open loss claim and the endpoint is an ordinary item edit (ladder rung 12)."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target entity already sits in a terminal state of the axis the request would move (ladder rung 13)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition has no matching from-state, or one of its cross-entity preconditions fails (ladder rung 14)."
  - id: ERR_APPRAISER_SCOPE_MISMATCH
    http: 422
    condition: "The appraiser's scope_categories do not contain the CategorySchedule.appraisal_scope of the item's category (ladder rung 15)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The appraiser is linked to the member who declared the item's value, or the estate executor tries to approve their own plan (ladder rung 16)."
  - id: ERR_APPRAISAL_WINDOW_CONFLICT
    http: 409
    condition: "The requested inspection window, widened by APPRAISAL_BUFFER_HOURS on both sides, intersects an existing REQUESTED or CERTIFIED appraisal window on the same item (ladder rung 17)."
  - id: ERR_SHARE_WINDOW_OVERLAP
    http: 409
    condition: "An ACTIVE share grant with the same (household_id, recipient_ref) already occupies an intersecting half-open [starts_at, expires_at) window (ladder rung 18)."
  - id: ERR_SHARE_WINDOW_TOO_LONG
    http: 422
    condition: "expires_at - starts_at is strictly greater than SHARE_MAX_DURATION_DAYS (90) days (ladder rung 19)."
  - id: ERR_EVIDENCE_TIER_INSUFFICIENT
    http: 422
    condition: "The item's evidence_tier rank is below CLAIM_MIN_EVIDENCE_TIER_RANK (2 = PHOTO_SERIAL) when adding a claim line (ladder rung 20)."
  - id: ERR_APPRAISAL_REQUIRED
    http: 422
    condition: "The item's valuation_state is APPRAISAL_REQUIRED - a declared value at or above 1000000 cents with no certified, unexpired appraisal (ladder rung 21)."
  - id: ERR_SERIAL_REQUIRED
    http: 422
    condition: "The category's CategorySchedule.serial_required is true and no serial_number was supplied (ladder rung 22)."
  - id: ERR_DUPLICATE_SERIAL
    http: 409
    condition: "Another DRAFT/CATALOGED/FROZEN item in the same household already carries this serial_number (ladder rung 23)."
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "Item.quantity outside [1, 999], Allocation.quantity < 1, or ClaimLine.claimed_quantity outside [1, Item.quantity] (ladder rung 24)."
  - id: ERR_ALLOCATION_OVER_QUANTITY
    http: 409
    condition: "The allocation would push Item.allocated_quantity above Item.quantity, breaking the estate conservation invariant (ladder rung 25)."
  - id: ERR_ITEM_NOT_DISPOSABLE
    http: 409
    condition: "The item being allocated is FROZEN by a claim or carries a REQUESTED appraisal hold (ladder rung 26)."
  - id: ERR_PLAN_NOT_FULLY_ALLOCATED
    http: 422
    condition: "EstatePlan.unallocated_item_count > 0 at propose time (ladder rung 27)."
  - id: ERR_PLAN_UNBALANCED
    http: 409
    condition: "EstatePlan.balanced is false and the approve request did not set override_unbalanced (ladder rung 28)."
  - id: ERR_DUPLICATE_CLAIM_LINE
    http: 409
    condition: "A ClaimLine already exists for this (claim_id, item_id) pair (ladder rung 29)."
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "ClaimLine.appeal_count has already reached MAX_APPEALS_PER_LINE (2) (ladder rung 30)."
  - id: ERR_PACKAGE_EMPTY
    http: 422
    condition: "No item qualifies for the package snapshot - the empty-set boundary of package generation (ladder rung 31)."
  - id: ERR_QUOTA_EXCEEDED
    http: 402
    condition: "The create would push item count, asset count or stored bytes past the tier's quota (ladder rung 32)."
  - id: ERR_DOWNGRADE_BLOCKED_BY_USAGE
    http: 409
    condition: "Current usage exceeds a quota of the tier being moved to, on change-tier or reinstate (ladder rung 33)."
  - id: ERR_NO_APPRAISAL_CREDITS
    http: 402
    condition: "Subscription.appraisal_credits_remaining is 0 when requesting an appraisal (ladder rung 34)."
  - id: ERR_PACKAGE_QUOTA_EXCEEDED
    http: 402
    condition: "The tier's included_packages_per_period has already been consumed this period (ladder rung 35)."
  - id: ERR_ALLOWANCE_EXCEEDED
    http: 409
    condition: "The requested scheduled_value_cents is strictly greater than Policy.scheduled_remaining_cents (ladder rung 36)."
  - id: ERR_ALLOWANCE_BELOW_CONSUMED
    http: 409
    condition: "A policy patch would set scheduled_allowance_cents strictly below the already-consumed total (ladder rung 37)."
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not equal Policy.version on POST /vault/items/{item_id}/schedule (ladder rung 38)."
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version does not equal Subscription.version on POST /vault/subscriptions/{subscription_id}/change-tier (ladder rung 38)."
  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version does not equal Household.version on POST /vault/packages/{package_id}/generate (ladder rung 38)."
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_estate_plan_version does not equal EstatePlan.version on POST /vault/estate-plans/{estate_plan_id}/allocations (ladder rung 38)."

roles:
  - name: Anonymous
    description: "Unauthenticated caller. Registers the first member of a household and redeems share links."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /vault/members (self-registration, household_id omitted)"
      - "GET /vault/shared/{share_token}"

  - name: Homeowner
    description: "The OWNER member of a household. Full control of the vault: catalogue, valuation, scheduling, packages, claims, estate plans and sharing."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /vault/households"
      - "POST /vault/subscriptions"
      - "POST /vault/subscriptions/{subscription_id}/change-tier"
      - "POST /vault/subscriptions/{subscription_id}/attest-refresh"
      - "POST /vault/subscriptions/{subscription_id}/reinstate"
      - "POST /vault/items/{item_id}/schedule"
      - "POST /vault/items/{item_id}/unschedule"
      - "POST /vault/items/{item_id}/replace"
      - "DELETE /vault/assets/{asset_id}"
      - "POST /vault/appraisals"
      - "POST /vault/packages"
      - "POST /vault/packages/{package_id}/generate"
      - "POST /vault/claims"
      - "POST /vault/claims/{claim_id}/lines"
      - "POST /vault/claims/{claim_id}/submit"
      - "POST /vault/claims/{claim_id}/withdraw"
      - "POST /vault/claim-lines/{claim_line_id}/appeal"
      - "POST /vault/estate-plans"
      - "POST /vault/estate-plans/{estate_plan_id}/approve"
      - "POST /vault/share-grants"
      - "POST /vault/share-grants/{share_grant_id}/revoke"
    shared_operations:
      - "POST /vault/members (adding a household member)"
      - "POST /vault/rooms, POST /vault/items, PATCH /vault/items/{item_id}, POST /vault/items/{item_id}/declare-value, POST /vault/items/{item_id}/assets"
      - "POST /vault/policies, POST /vault/packages/{package_id}/deliver"
      - "every GET under /vault except the platform-only household list"

  - name: HouseholdMember
    description: "A LIMITED member of the household. May catalogue and photograph items but may not schedule coverage, run claims, share, or touch the subscription."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /vault/rooms, POST /vault/items, PATCH /vault/items/{item_id}, POST /vault/items/{item_id}/declare-value, POST /vault/items/{item_id}/assets"
      - "GET on members, rooms, items, assets, subscriptions, households and category schedules"

  - name: Appraiser
    description: "A credentialed external appraiser. Sees the items assigned to them and certifies values within their credential scope."
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /vault/appraisals/{appraisal_id}/certify"
    shared_operations:
      - "GET /vault/items/{item_id}, GET /vault/items, GET /vault/assets, GET /vault/assets/{asset_id}"
      - "GET /vault/appraisals/{appraisal_id}, GET /vault/appraisals, GET /vault/appraisers/{appraiser_id}, GET /vault/appraisers"

  - name: InsuranceAgent
    description: "The carrier's agent. Maintains the policy terms and receives documentation packages; may read valuation data but never edits the inventory."
    identity: "opaque"
    exclusive_operations:
      - "PATCH /vault/policies/{policy_id}"
    shared_operations:
      - "POST /vault/policies, POST /vault/packages/{package_id}/deliver"
      - "GET on households, policies, coverage-gap, packages, package lines, claims, appraisals, category schedules"
      - "GET /vault/shared/{share_token}"

  - name: ClaimsAdjuster
    description: "The carrier's adjuster. Adjudicates individual claim lines and settles claims; cannot create or edit inventory or claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /vault/claim-lines/{claim_line_id}/adjudicate"
      - "POST /vault/claims/{claim_id}/settle"
    shared_operations:
      - "GET on households, items, assets, policies, coverage-gap, packages, package lines, claims and claim lines"
      - "GET /vault/shared/{share_token}"

  - name: EstateExecutor
    description: "The member designated as executor on an estate plan. Builds and executes the disposition plan but may never approve it - that is the homeowner's act."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /vault/estate-plans/{estate_plan_id}/allocations"
      - "DELETE /vault/allocations/{allocation_id}"
      - "POST /vault/estate-plans/{estate_plan_id}/propose"
      - "POST /vault/estate-plans/{estate_plan_id}/execute"
    shared_operations:
      - "GET on members, rooms, items, households, estate plans and allocations"

  - name: PlatformAdmin
    description: "Operator of the service. Owns the configuration tables, the billing lifecycle, appraisal voiding and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /vault/category-schedules"
      - "POST /vault/appraisers"
      - "POST /vault/appraisals/{appraisal_id}/void"
      - "POST /vault/subscriptions/{subscription_id}/billing-event"
      - "GET /vault/households (platform-wide list)"
    shared_operations:
      - "every GET under /vault"

rbac_notes: |
  Same endpoint, two roles, different visibility: GET /vault/items/{item_id} is legal for
  Homeowner, HouseholdMember, EstateExecutor, InsuranceAgent, ClaimsAdjuster, Appraiser and
  PlatformAdmin, but HouseholdMember and Appraiser receive the row with serial_number
  redacted to null unless the item's evidence_tier is DOCUMENTED, and InsuranceAgent and
  ClaimsAdjuster receive it with declared_by_member_id redacted to null. Homeowner and
  PlatformAdmin see the row unredacted. The two segregation-of-duties rules both live at
  ladder rung 16: an Appraiser linked to the member who declared a value may not appraise
  that item, and the EstateExecutor named on a plan may not approve it.
