            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_a_id}/start-fabrication"
              payload: { expected_joint_version: "${joint_a_v}" }
              as: WeldLead
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_b_id}/start-fabrication"
