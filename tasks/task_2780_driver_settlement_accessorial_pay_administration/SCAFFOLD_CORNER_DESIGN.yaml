      - name: revenue_percent_leg_is_round_half_up_at_the_exact_half_cent
        claim_type: precision
        grounds:
          - calculations.linehaul_component_pay
          - entities.Load.fields.linehaul_pay_cents
          - entities.Load.fields.linehaul_line_type
          - entities.PayComponent.fields.rate_value
        distinguishing_aspect: |
          2500 basis points of 100002 cents is exactly 25000.5, which round_half_up must lift to 25001, while
          2500 basis points of 100001 is 25000.25 and must stay 25000. Both beat the 17400 per-mile leg, so both
          loads are typed LINEHAUL_PERCENT with quantity 1. Banker's rounding would give 25000 for the first
          load and truncation would give 25000 for both, so the pair separates all three rounding modes.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_PR ACTIVE on a LEASED_OPERATOR PRACTICAL package with PER_MILE 58 and REVENUE_PERCENT 2500 bps"
