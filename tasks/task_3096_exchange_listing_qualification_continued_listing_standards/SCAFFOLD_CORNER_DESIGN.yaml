  - section: errors
    instances:

      - name: error_catalog_triggerability_covered_by_scatter
        claim_type: Violation → Error
        grounds:
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_OWNERSHIP_MISMATCH
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_TIER_TRANSFER_TARGET_INVALID
          - errors.ERR_NO_STANDARD_MET
          - errors.ERR_LISTING_NOT_FOUND
          - errors.ERR_DEFICIENCY_NOT_FOUND
