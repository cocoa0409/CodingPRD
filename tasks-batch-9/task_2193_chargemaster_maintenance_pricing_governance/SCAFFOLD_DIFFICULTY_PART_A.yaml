      - name: combinatorial_formula__mode_b_round_per_line_then_average_variance_rollup
        grounds:
          - calculations.charge_capture_variance_summary
          - calculations.charge_capture_variance_summary.variants.round_per_line_then_average
          - entities.CapturedCharge.fields.line_variance_bp
          - entities.CapturedCharge.fields.expected_charge_cents
          - entities.CapturedCharge.fields.match_status
          - entities.ChargeCaptureBatch.fields.mean_line_variance_bp
          - entities.ChargeCaptureBatch.fields.total_expected_charge_cents
          - entities.ChargeCaptureBatch.fields.total_posted_charge_cents
          - state_machines.ChargeCaptureBatch.INGESTED_to_RECONCILING
        distinguishing_aspect: |
          This is mode (b) — nested rounding whose ORDER changes the answer: the four
          scored lines round to 195, -234, 0 and 5 bp, whose mean -34/4 = -8.5 rounds
          half-up away from zero to the pinned mean_line_variance_bp == -9, while the
          aggregate-then-round alternative round_half_up((6911628 - 6912000) * 10000 /
          6912000) yields -1 and a banker's-rounding mean would yield -8; all three are
          distinguishable in one reconcile pass.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z."
            - "Facility VAR with rounding_mode = NEAREST_CENT and aggregate_markup_limit_bp = 40000."
            - "Department LAB (manager_user_id = u_dm_lab, capture_hold false)."
            - "RevenueCode 0300 ACTIVE, one ACTIVE COST_PLUS_MARKUP PriceRule with the default tiers."
            - "One ChargeItem CDM-3000 (cost_basis_cents 40000, medicare_rate_cents 20000, market_p75_cents 200000, no companion) repriced to gross_charge_cents = 128000 and driven to lifecycle_status = ACTIVE."
            - "One INGESTED ChargeCaptureBatch over the closed window 2026-06-01..2026-06-30 holding five lines on distinct encounters: (q1, posted 130500), (q1, posted 125000), (q50, posted 6400000), (q2, posted 256128) all on CDM-3000, plus one line on the non-existent CDM-9999 (q2, posted 77000) that will resolve to UNKNOWN_CODE."
          setup_api_calls:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Variance Regional", cms_certification_number: "CCN-2193-V", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
