          setup:
            - "RS-STD-2026, the four SUMMER periods and ServiceAccount ACC-1008 exist; the master meter MTR-G-1 has reads 100000 / 104000 / 108000 / 112000 / 153000 and four ISSUED bills totalling 60569 cents."
