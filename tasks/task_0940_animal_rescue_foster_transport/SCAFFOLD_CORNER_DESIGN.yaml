              as: Veterinarian
              captures: { med_id: $.data.id }
          trigger:
            - call: "POST /rescue/contributions/${c}/redesignate"
              payload: { designated_program: "MEDICAL_FUND", restriction_category: "MEDICAL" }
              as: FinanceOfficer
              captures: { redes1: $.data.redesignation_count, prog1: $.data.designated_program }
            - call: "POST /rescue/medical-records/${med_id}/complete"
              payload: {}
