              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "STACK-3", temperature_c: 17.0, relative_humidity_pct: 46.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Procurement", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 3 }
