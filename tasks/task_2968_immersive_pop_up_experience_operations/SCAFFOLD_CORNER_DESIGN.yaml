      - name: cross_entity_state_gates_refuse_with_their_own_error_ids
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 80]
          - errors[ERR_VENUE_LEASE_NOT_ACTIVE]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_RUN_NOT_CLEARED]
          - errors[ERR_RUN_SUSPENDED]
        distinguishing_aspect: |
          Each of these four refusals is about the state of a DIFFERENT row than the one named in
          the path: opening a run reads its venue, creating a submission reads its agreement,
          confirming an order reads its run's clearance dimension, and releasing a slot reads that
          same dimension for a different reason. All four sit at priority 80, after the target's own
          state check at 70, so the target itself is in a perfectly legal state every time — an
          implementation that only validates the path row reports success or the wrong 409.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation but WITHOUT activating the lease, so the venue is PERMIT_ISSUED; plus one room, one released 20-seat slot, a guest and a PENDING order. A second agreement is created and left DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
