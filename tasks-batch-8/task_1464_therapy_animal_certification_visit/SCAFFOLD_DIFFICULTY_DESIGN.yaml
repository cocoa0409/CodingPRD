            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TX2" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev X2", email: "evx2@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2027-06-30", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-X2", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h}", captures: { p: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t}", evaluation_id: "${e}" }, as: ProgramAdmin, captures: { c: $.data.id } }
            - { call: "POST /v1/certifications/${c}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2028-07-02T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_sweeps/run", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/certifications/${c}/renew", payload: {}, as: ProgramAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2028-07-01", valid_until: "2031-06-30", veterinarian_name: "Dr V2" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/certifications/${c}/renew", payload: {}, as: ProgramAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_VACCINATION_EXPIRED (rabies record lapsed: valid_until 2027-06-30 < today 2028-07-02)"
            - "err2 == ERR_RENEWAL_VISIT_MINIMUM_NOT_MET (vaccination gate now passes; failure advances to the visit-count constraint, proving the cross-entity gate moved)"

      - name: evaluation_request_requires_handler_active
        grounds:
          - validations[priority=7]
          - state_machines.Handler.ACTIVE_to_SUSPENDED
          - errors[ERR_HANDLER_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair = Evaluation -> Handler (distinct from Visit->Certification and
          Certification->VaccinationRecord): POST /v1/evaluations is rejected
          with ERR_HANDLER_NOT_ACTIVE while the handler is SUSPENDED, and
          succeeds after reinstatement with the team still FORMING.
        test_recipe:
          setup:
            - "Handler h APPROVED then SUSPENDED; animal a; team t FORMING"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H X3", email: "hx3@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
