# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# pet-boarding-daycare-kennel. Walks the claim-extraction-guide sections against
# SCAFFOLD.yaml §1.1–§1.7. Every active instance's setup_api_calls drives empty-DB
# -> precondition using only §1.5 endpoints; formula-derived asserts are literals.
# Corners already covered by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ----------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: create_owner_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Owner.fields.status, endpoints]
        distinguishing_aspect: "POST /facilities/{id}/owners with full_name/email/phone -> 201; status=ACTIVE and wallet_credit_cents=0 are server-set, id/created_at/version present."
        test_recipe:
          setup: ["A facility exists"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Ent-1" }
              as: FacilityManager
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Cre Owner", email: "cre@x.com", phone: "555-1000" }
              as: FacilityManager
              captures: { own: $.data.id, st: $.data.status, w: $.data.wallet_credit_cents, v: $.data.version }
          assert:
            - "Owner.${own}.status == ACTIVE"
            - "Owner.${own}.wallet_credit_cents == 0"
            - "Owner.${own}.version == 1"

      - name: pet_size_class_computed_from_weight
        claim_type: Computed Fields
        grounds: [entities.Pet.fields.size_class]
        distinguishing_aspect: "weight_kg 18 -> size_class MEDIUM is server-computed; a client-supplied size_class is ignored (no such input field)."
        test_recipe:
          setup: ["A facility and owner exist"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Ent-2" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sz Owner", email: "sz@x.com", phone: "555-1001" }
              as: FacilityManager
              captures: { own: $.data.id }
          trigger:
            - call: "POST /owners/${own}/pets"
              payload: { name: "Sized", species: "DOG", weight_kg: 18 }
              as: FacilityManager
              captures: { pet: $.data.id, sc: $.data.size_class, vs: $.data.vaccination_status }
          assert:
            - "Pet.${pet}.size_class == MEDIUM"
            - "Pet.${pet}.vaccination_status == MISSING (default before any record)"

      - name: get_pet_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /pets/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB except a facility"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Ent-3" }
              as: FacilityManager
          trigger:
            - call: "GET /pets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, http 404"

      - name: create_pet_missing_required_weight_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /owners/{id}/pets omitting weight_kg -> 422 ERR_INVALID_REQUEST (weight_kg has no default and source input)."
        test_recipe:
          setup: ["A facility and owner exist"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Ent-4" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Req Owner", email: "req@x.com", phone: "555-1002" }
              as: FacilityManager
              captures: { own: $.data.id }
          trigger:
            - call: "POST /owners/${own}/pets"
              payload: { name: "NoWeight", species: "DOG" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 422"

      - name: create_pet_nonpositive_weight_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "weight_kg <= 0 (e.g. 0) -> 422 ERR_INVALID_REQUEST; numeric range boundary on a different field than required-field presence."
        test_recipe:
          setup: ["A facility and owner exist"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Ent-5" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Zw Owner", email: "zw@x.com", phone: "555-1003" }
              as: FacilityManager
              captures: { own: $.data.id }
          trigger:
            - call: "POST /owners/${own}/pets"
              payload: { name: "ZeroW", species: "DOG", weight_kg: 0 }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 422"

      - name: vaccination_record_immutable_no_version
        claim_type: Immutability
        grounds: [entities.VaccinationRecord]
        distinguishing_aspect: "VaccinationRecord has common_fields:false — it exposes id and created_at but no version field and no update endpoint; a newer same-vaccine record supersedes instead of mutating."
        test_recipe:
          setup: ["A pet with one RABIES record"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Ent-6" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Im Owner", email: "im@x.com", phone: "555-1004" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Imm", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2026-01-01", expires_on: "2028-01-01" }
              as: FacilityManager
              captures: { v2: $.data.id }
            - call: "GET /pets/${pet}/vaccinations"
              payload: {}
              as: FacilityManager
          assert:
            - "GET /pets/${pet}/vaccinations returns two records; the first RABIES record has superseded == true"

  # ----------------------------------------------------------- State Machines
  - section: state_machines
    instances:
      - name: reservation_initial_state_requested
        claim_type: Initial State
        grounds: [state_machines.Reservation, entities.Reservation.fields.status]
        distinguishing_aspect: "A freshly created reservation has status == REQUESTED."
        test_recipe:
          setup: ["A facility, owner, pet exist"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-SM-1", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sm Owner", email: "sm1@x.com", phone: "555-2000" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "P", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { pet: $.data.id }
          trigger:
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "DAYCARE", start_date: "2026-03-01", end_date: "2026-03-01" }
              as: FacilityManager
              captures: { res: $.data.id, st: $.data.status }
          assert:
            - "Reservation.${res}.status == REQUESTED"

      - name: check_in_from_requested_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.REQUESTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling check_in on a REQUESTED (not CONFIRMED) reservation -> 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["A REQUESTED reservation"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-SM-2", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sm2 Owner", email: "sm2@x.com", phone: "555-2001" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "P2", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "DAYCARE", start_date: "2026-03-01", end_date: "2026-03-01" }
              as: FacilityManager
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/check_in"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"

      - name: cancel_from_cancelled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Reservation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on an already CANCELLED reservation -> ERR_INVALID_STATE; CANCELLED is terminal."
        test_recipe:
          setup: ["A reservation cancelled from REQUESTED"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-SM-3", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sm3 Owner", email: "sm3@x.com", phone: "555-2002" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "P3", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "DAYCARE", start_date: "2026-03-01", end_date: "2026-03-01" }
              as: FacilityManager
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"

      - name: renew_active_package_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Package.EXPIRED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "renew on an ACTIVE (not EXPIRED) package -> ERR_INVALID_STATE; renew is only defined from EXPIRED."
        test_recipe:
          setup: ["An ACTIVE package"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-SM-4" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sm4 Owner", email: "sm4@x.com", phone: "555-2003" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/packages"
              payload: { tier: "DAYCARE_10", cycle_start_date: "2026-01-01", auto_renew: true }
              as: FacilityManager
              captures: { pkg: $.data.id }
          trigger:
            - call: "POST /packages/${pkg}/renew"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"

      - name: renew_expired_without_autorenew_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Package.EXPIRED_to_ACTIVE, "validations[priority=22]", "errors[ERR_RENEWAL_NOT_ALLOWED]"]
        distinguishing_aspect: "renew on an EXPIRED package with auto_renew==false -> ERR_RENEWAL_NOT_ALLOWED (precondition, not invalid-state)."
        test_recipe:
          setup: ["An EXPIRED package whose auto_renew is false (clock advanced past cycle)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-SM-5" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sm5 Owner", email: "sm5@x.com", phone: "555-2004" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/packages"
              payload: { tier: "DAYCARE_10", cycle_start_date: "2026-01-01", auto_renew: false }
              as: FacilityManager
              captures: { pkg: $.data.id }
            - call: "POST /facilities/${fac}/_clock/advance"
              payload: { to_date: "2026-02-15" }
              as: FacilityManager
          trigger:
            - call: "POST /packages/${pkg}/renew"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RENEWAL_NOT_ALLOWED, http 409"

      - name: no_show_too_early_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.CONFIRMED_to_NO_SHOW, "validations[priority=19]", "errors[ERR_NO_SHOW_TOO_EARLY]"]
        distinguishing_aspect: "mark_no_show while current_date <= start_date -> ERR_NO_SHOW_TOO_EARLY."
        test_recipe:
          setup: ["A CONFIRMED reservation whose start_date is in the future relative to current_date"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-SM-6", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sm6 Owner", email: "sm6@x.com", phone: "555-2005" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "P6", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Pen-S6", kind: "DAYCARE_PEN", size_class: "LARGE", daycare_capacity: 5 }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "DAYCARE", start_date: "2026-06-01", end_date: "2026-06-01" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version }
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${res_v}" }
              as: FacilityManager
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/mark_no_show"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_SHOW_TOO_EARLY, http 409"

      - name: vaccination_expiry_flips_status_on_clock
        claim_type: Side Effect Execution
        grounds: [state_machines.Pet.vaccination_status_VALID_to_EXPIRED, entities.Pet.fields.vaccination_status]
        distinguishing_aspect: "Advancing the clock past a required vaccine's expires_on flips Pet.vaccination_status VALID -> EXPIRED."
        test_recipe:
          setup: ["A CAT VALID with RABIES+FVRCP both expiring 2026-01-15; clock at 2026-01-01"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-SM-7" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Sm7 Owner", email: "sm7@x.com", phone: "555-2006" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "P7", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-01-01", expires_on: "2026-01-15" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-01-01", expires_on: "2026-01-15" }
              as: FacilityManager
          trigger:
            - call: "POST /facilities/${fac}/_clock/advance"
              payload: { to_date: "2026-02-01" }
              as: FacilityManager
            - call: "GET /pets/${pet}"
              payload: {}
              as: FacilityManager
              captures: { vs: $.data.vaccination_status }
          assert:
            - "Pet.${pet}.vaccination_status == EXPIRED after the clock advance"

      - name: confirm_cascade_assignment_occupied
        claim_type: Side Effect Execution
        grounds: [state_machines.RunAssignment.HELD_to_OCCUPIED]
        excluded_because:
          difficulty_instance: transitive_cascade / confirm_cascade_reservation_assignment_run_depth3
          rationale: "The HELD->OCCUPIED side-effect and the run-busy hop are asserted by the named §1.8 cascade instance."

  # ----------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: deposit_policy_none_is_zero
        claim_type: Constants Applied
        grounds: [calculations.deposit_amount, entities.Facility.fields.deposit_policy]
        distinguishing_aspect: "deposit_policy NONE -> policy_factor 0 -> deposit_cents 0 regardless of service/size/nights."
        test_recipe:
          setup: ["Facility deposit_policy NONE; OVERNIGHT LARGE 2n reservation"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Calc-1", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Ca Owner", email: "ca1@x.com", phone: "555-3000" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Big", species: "CAT", weight_kg: 35 }
              as: FacilityManager
              captures: { pet: $.data.id }
          trigger:
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-03-01", end_date: "2026-03-03" }
              as: FacilityManager
              captures: { res: $.data.id, dep: $.data.deposit_cents }
          assert:
            - "Reservation.${res}.deposit_cents == 0"

      - name: reservation_total_loyalty_tier2_at_30000
        claim_type: Correct Result
        grounds: [calculations.reservation_total]
        distinguishing_aspect: "OVERNIGHT LARGE 5n lodging 32500 -> tier 0.10 -> discount 3250 -> total 29250 (tier-2 threshold exactly at 30000, no add-ons, not redeemed)."
        test_recipe:
          setup: ["OVERNIGHT LARGE 5n reservation confirmed (NONE policy), checked in, no add-ons"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Calc-2", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Ca2 Owner", email: "ca2@x.com", phone: "555-3001" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "L5", species: "CAT", weight_kg: 35 }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Suite-C2", kind: "OVERNIGHT_SUITE", size_class: "LARGE" }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-01-05", end_date: "2026-01-10" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version }
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${res_v}" }
              as: FacilityManager
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: FacilityManager
            - call: "POST /facilities/${fac}/_clock/advance"
              payload: { to_date: "2026-01-05" }
              as: FacilityManager
            - call: "POST /reservations/${res}/check_in"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/check_out"
              payload: {}
              as: FacilityManager
              captures: { total: $.data.total_cents }
          assert:
            - "Reservation.${res}.total_cents == 29250"

      - name: group_score_lenient_passes_strict_fails
        claim_type: Variant Divergence
        grounds: [calculations.group_compatibility_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_provisional_vs_final_same_lead_tier
          rationale: "Grouping strict-vs-lenient divergence is the dual-variant signature exercised structurally by §1.8 Rule 1 / Rule 6 capacity & grouping instances; the strict-fail path is asserted via ERR_GROUP_INCOMPATIBLE below."

      - name: group_incompatible_reactive_rejected
        claim_type: Correct Result
        grounds: [calculations.group_compatibility_score, "validations[priority=14]", "errors[ERR_GROUP_INCOMPATIBLE]"]
        distinguishing_aspect: "Candidate REACTIVE MEDIUM joining a pen already holding a CALM SMALL scores 5 (size_gap 1*2 + temp 1*3), exceeding STRICT_MAX 4 -> ERR_GROUP_INCOMPATIBLE."
        test_recipe:
          setup: ["DAYCARE_PEN cap 5 with one HELD CALM SMALL pet on 2026-02-25; a REACTIVE MEDIUM pet wants the same pen/date"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Calc-4", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Ca4 Owner", email: "ca4@x.com", phone: "555-3003" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Calm", species: "CAT", weight_kg: 6, temperament: "CALM" }
              as: FacilityManager
              captures: { petCalm: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Reac", species: "CAT", weight_kg: 18, temperament: "REACTIVE" }
              as: FacilityManager
              captures: { petReac: $.data.id }
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Pen-C4", kind: "DAYCARE_PEN", size_class: "LARGE", daycare_capacity: 5 }
              as: FacilityManager
