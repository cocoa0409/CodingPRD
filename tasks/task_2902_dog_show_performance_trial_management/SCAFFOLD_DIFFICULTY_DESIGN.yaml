              payload: { show_id: "${show_id}", entry_id: "${e1_id}", filed_by_handler_id: "${h1_id}", protest_type: "JUDGING_PROCEDURE", statement: "Winner was moved up after the ribbons were handed out", deposit_cents: 5000 }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /dog-shows/protests/${p1_id}/begin-review"
              payload: {}
              as: SanctionOfficer
              as_user_id: "so-beta"
          trigger:
            - call: "POST /dog-shows/protests/${p1_id}/decide"
              payload: { decision: "UPHOLD", resolution_code: "VACATE_PLACEMENT" }
              as: SanctionOfficer
              as_user_id: "so-beta"
          assert:
            - "Protest.${p1_id}.status == UPHELD"
            - "Protest.${p1_id}.resolution_code == VACATE_PLACEMENT"
            - "Protest.${p1_id}.deposit_refunded == true"
            - "Entry.${e1_id}.entry_status == JUDGED"
            - "Entry.${e1_id}.placement == null"
            - "Entry.${e1_id}.points_awarded == 0"
            - "Entry.${e2_id}.placement == 1"
            - "Entry.${e2_id}.points_awarded == 2"
            - "Entry.${e3_id}.placement == 2"
            - "Entry.${e4_id}.placement == 3"
            - "Entry.${e5_id}.placement == null"
            - "ShowClass.${c1_id}.counted_dog_count == 5"
            - "ShowClass.${c1_id}.base_points == 2"
            - "Dog.${d1_id}.championship_points_total == 0"
            - "Dog.${d1_id}.majors_count == 0"
            - "Dog.${d2_id}.championship_points_total == 2"
            - "Dog.${d2_id}.majors_count == 1"
            - "Dog.${d3_id}.championship_points_total == 0"
            - "Show.${show_id}.points_awarded_total == 2"
            - "Show.${show_id}.status == COMPLETED"
            - "RegistryFiling.${f1_id}.filing_status == PENDING"
            - "RegistryFiling.${f1_id}.amendment_count == 1"
            - "RegistryFiling.${f1_id}.championship_points_total_filed == 2"
            - "RegistryFiling.${f1_id}.title_records_count == 0"
          notes: |
              The vacated entry keeps entry_status JUDGED, so counted_dog_count stays 5 and POINTS_TABLE still
              yields 2; MAJOR_MIN_POINTS is 2, so the major moves from dog 1 to dog 2 rather than disappearing, and
              CHAMPION_TITLE_POINTS (3) is still out of reach for everybody, which keeps title_records_count at 0.

