              payload: { owner_id: "${owner_id}", parcel_number: "APN-9001", street_address: "90 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "NO_VIOLATION" }
              as: CodeOfficer
          trigger:
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with HTTP 422"
            - "error_id == ERR_NO_SUBSTANTIATION (Inspection.${insp_id}.outcome == NO_VIOLATION blocks issuance)"

      - name: demolition_requires_property_vacant
