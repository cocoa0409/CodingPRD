        distinguishing_aspect: "qualified_aums = floor(carrying_capacity_aums * factor), so a LIVESTOCK property of 401 AUMs yields 300 (floor of 300.75), never 301; the identical 401 as LAND yields 401 because the LAND factor is exactly 1.0."
        test_recipe:
          setup:
            - "One permittee with two base properties of identical carrying capacity and different types"
          setup_api_calls:
            - call: "POST /permittees"
              payload: { name: "Floor Probe Ranch", contact_email: "floorprobe@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
