  # ===========================================================================
  # Rule 8 — resource_temporal_overlap, different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: recon_window_half_open_adjacency
        grounds:
          - validations[priority=11]
          - entities.ReconciliationRun.fields.period_end
        distinguishing_aspect: |
          Half-open interval semantics on ReconciliationRun (resource =
          sponsor_bank_code): a run starting exactly at a prior non-terminal
          run's period_end is ALLOWED ([a,b) adjacency), while overlapping by
          one day is a conflict — boundary precision on interval geometry.
        test_recipe:
          setup:
            - "run A created for SB-1 over [2026-08-01, 2026-08-08) with bank_reported_net -15000 against +15000 of settled program entries -> DISCREPANCY (non-terminal, blocks overlap)"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m20", full_name: "M Twenty", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m20: $.data.id }
            - call: "POST /banking/members/${m20}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a20: $.data.id }
            - call: "POST /banking/accounts/${a20}/deposits"
              payload: { originator_id: "EMP20", originator_type: "PAYROLL", amount_cents: 15000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "m20-t1" }
              as: SponsorBankOps
              captures: { m20d1: $.data.id }
            - call: "POST /banking/deposits/${m20d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/reconciliation-runs"
              payload: { sponsor_bank_code: "SB-1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z", bank_reported_net_cents: -15000 }
              as: SponsorBankOps
              captures: { runA: $.data.id, runA_status: $.data.status }
          trigger:
            - call: "POST /banking/reconciliation-runs"
              payload: { sponsor_bank_code: "SB-1", period_start: "2026-08-08T00:00:00Z", period_end: "2026-08-15T00:00:00Z", bank_reported_net_cents: 0 }
              as: SponsorBankOps
              captures: { runB: $.data.id }
            - call: "POST /banking/reconciliation-runs"
              payload: { sponsor_bank_code: "SB-1", period_start: "2026-08-07T00:00:00Z", period_end: "2026-08-20T00:00:00Z", bank_reported_net_cents: 0 }
              as: SponsorBankOps
              captures: { err: $.data.error_id }
          assert:
            - "run A status == DISCREPANCY (program_net 15000 + bank_reported -15000 = 30000 discrepancy... pinned: discrepancy_cents == 30000) and non-terminal"
            - "run B [08-08, 08-15) created successfully — half-open adjacency to A's period_end is allowed"
            - "run C [08-07, 08-20) rejected with ERR_WINDOW_OVERLAP (overlaps non-terminal run A)"
            - "http status == 409"

      - name: deposit_inflight_buffer_conflict
        grounds:
          - validations[priority=11]
          - entities.DirectDeposit.fields.settlement_date
        distinguishing_aspect: |
          Buffered-window aggregate-capacity semantics (different interval
          treatment from the half-open recon case, different resource =
          (DepositAccount, originator_id)): at most ONE in-flight deposit per
          account+originator with settlement dates within +/-3 days; distance
          exactly 4 days is allowed, exactly 3 days is a conflict, and the
          buffer does not apply across different originators.
        test_recipe:
          setup:
            - "member m17 with SPENDING account; in-flight deposit settles 2026-09-10 (RECEIVED_FILE)"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m17", full_name: "M Seventeen", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m17: $.data.id }
            - call: "POST /banking/members/${m17}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a17: $.data.id }
            - call: "POST /banking/accounts/${a17}/deposits"
              payload: { originator_id: "EMP17", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-09-10T00:00:00Z", trace_id: "m17-t1" }
              as: SponsorBankOps
              captures: { m17d1: $.data.id }
          trigger:
            - call: "POST /banking/accounts/${a17}/deposits"
              payload: { originator_id: "EMP17", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-09-14T00:00:00Z", trace_id: "m17-t2" }
              as: SponsorBankOps
              captures: { m17d2: $.data.id }
            - call: "POST /banking/accounts/${a17}/deposits"
              payload: { originator_id: "EMP17", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-09-13T00:00:00Z", trace_id: "m17-t3" }
              as: SponsorBankOps
              captures: { err: $.data.error_id }
            - call: "POST /banking/accounts/${a17}/deposits"
              payload: { originator_id: "EMP-OTHER", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-09-11T00:00:00Z", trace_id: "m17-t4" }
              as: SponsorBankOps
              captures: { m17d4: $.data.id }
          assert:
            - "deposit at distance 4 days (09-14 vs 09-10) is accepted (boundary allowed)"
            - "deposit at distance 3 days (09-13 vs 09-10) is rejected with ERR_WINDOW_OVERLAP"
            - "deposit from a DIFFERENT originator 1 day away (EMP-OTHER on 09-11) is accepted — buffer is per (account, originator)"

  # ===========================================================================
  # Rule 9 — compensating_invariant, different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cushion_outstanding_conserved_across_borrow_repay
        grounds:
          - entities.DepositAccount.fields.outstanding_cushion_cents
          - calculations.calc_repayment_waterfall
        distinguishing_aspect: |
          Conserved quantity: account.outstanding_cushion_cents. Forward action
          (advance 2000) followed by its compensating action (qualifying deposit
          settle repaying the full 2000) returns outstanding_cushion_cents to
          its pre-borrow value 0, and principal == sum(allocations) for the
          REPAID advance.
        test_recipe:
          setup:
            - "member m18 ELIGIBLE, limit 2000, no advances (outstanding 0)"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m18", full_name: "M Eighteen", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m18: $.data.id, m18_v0: $.data.version }
            - call: "POST /banking/members/${m18}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a18: $.data.id }
            - call: "POST /banking/accounts/${a18}/deposits"
              payload: { originator_id: "EMP18", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "m18-t1" }
              as: SponsorBankOps
              captures: { m18d1: $.data.id }
            - call: "POST /banking/accounts/${a18}/deposits"
              payload: { originator_id: "EMP18", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "m18-t2" }
              as: SponsorBankOps
              captures: { m18d2: $.data.id }
            - call: "POST /banking/deposits/${m18d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m18d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m18}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m18_v0}" }
              as: ProgramOps
            - call: "GET /banking/accounts/${a18}"
              payload: {}
              as: ProgramOps
              captures: { a18_v1: $.data.version, a18_out0: $.data.outstanding_cushion_cents }
            - call: "POST /banking/accounts/${a18}/advances"
              payload: { amount_cents: 2000, idempotency_key: "m18-a1", expected_account_version: "${a18_v1}" }
              as: Member
              as_user_id: "${m18}"
              captures: { m18adv: $.data.id }
            - call: "POST /banking/accounts/${a18}/deposits"
              payload: { originator_id: "EMP18", originator_type: "PAYROLL", amount_cents: 5000, settlement_date: "2026-09-01T00:00:00Z", trace_id: "m18-t3" }
              as: SponsorBankOps
              captures: { m18d3: $.data.id }
          trigger:
            - call: "POST /banking/deposits/${m18d3}/settle"
              payload: {}
              as: SponsorBankOps
          assert:
            - "pre-borrow outstanding_cushion_cents == 0"
            - "after settle: DepositAccount.${a18}.outstanding_cushion_cents == 0 (conserved)"
            - "OverdraftAdvance.${m18adv}.principal_cents == 2000 == sum of its RepaymentAllocation.amount_cents"
            - "OverdraftAdvance.${m18adv}.status == REPAID and on_time == true"

      - name: ledger_double_entry_parity_conserved
        grounds:
          - entities.LedgerEntry.fields.program_leg_cents
          - entities.LedgerEntry.fields.bank_leg_cents
          - state_machines.ReconciliationRun
        distinguishing_aspect: |
          Conserved quantity: signed double-entry parity — a different conserved
          quantity from cushion outstanding. Every LedgerEntry satisfies
          program_leg_cents + bank_leg_cents == 0, and resolving a DISCREPANCY
          run posts an ADJUSTMENT that drives the run's net (program + bank
          reported + adjustment) back to 0.
        test_recipe:
          setup:
            - "member m19 with settled payroll deposit 10000 (LedgerEntry DEPOSIT_SETTLEMENT program +10000 / bank -10000, status SETTLED, posted_at in window)"
            - "run over [2026-08-01, 2026-09-01) with bank_reported_net_cents == -9000 (bank claims 1000 less) -> discrepancy_cents == 1000 -> DISCREPANCY"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m19", full_name: "M Nineteen", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m19: $.data.id }
            - call: "POST /banking/members/${m19}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a19: $.data.id }
            - call: "POST /banking/accounts/${a19}/deposits"
              payload: { originator_id: "EMP19", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "m19-t1" }
              as: SponsorBankOps
              captures: { m19d1: $.data.id }
            - call: "POST /banking/deposits/${m19d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/reconciliation-runs"
              payload: { sponsor_bank_code: "SB-1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", bank_reported_net_cents: -9000 }
              as: SponsorBankOps
              captures: { run19: $.data.id, run19_status: $.data.status, run19_v0: $.data.version }
          trigger:
            - call: "POST /banking/reconciliation-runs/${run19}/resolve"
              payload: { expected_run_version: "${run19_v0}", resolution_note: "bank missed one deposit leg" }
              as: ProgramOps
              captures: { run19_after: $.data.status }
          assert:
            - "run created with status == DISCREPANCY and discrepancy_cents == 1000"
            - "every LedgerEntry in the window satisfies program_leg_cents + bank_leg_cents == 0 (per-entry parity)"
            - "resolve creates an ADJUSTMENT entry with program_leg_cents == -1000 and bank_leg_cents == +1000 linked to account ${a19}"
            - "after resolve: ReconciliationRun.${run19}.status == RESOLVED and program_net_cents + bank_reported_net_cents + adjustment_program_leg == 0"
