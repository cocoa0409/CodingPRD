              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
            - call: "POST /dealer-network/dealers/${dealer_id}/activate"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/coop-claims"
              payload: { dealer_id: "${dealer_id}", amount_cents: 50, description: "Spring flyer", activity_date: "2026-08-20T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /dealer-network/dealers/${dealer_id}"
              as: RegionManager
              captures: { bal0: $.data.coop_balance_cents, pend0: $.data.coop_pending_cents }
          trigger:
            - call: "POST /dealer-network/coop-claims/${claim_id}/approve"
              payload: {}
              as: ChannelDirector
            - call: "GET /dealer-network/dealers/${dealer_id}"
              as: RegionManager
              captures: { bal1: $.data.coop_balance_cents, pend1: $.data.coop_pending_cents }
            - call: "POST /dealer-network/coop-claims/${claim_id}/pay"
              payload: {}
              as: ChannelDirector
