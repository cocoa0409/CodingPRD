      - name: rate_center_revert_from_transitional_restores_initial_acceptance
        claim_type: Valid Transition
        grounds: ["state_machines.RateCenter.transitions.TRANSITIONAL_to_NON_POOLED", "entities.RateCenter.fields.accepts_initial_requests"]
        distinguishing_aspect: "REVERT walks the pooling axis backwards to NON_POOLED and, because jeopardy_flag is false, the computed accepts_initial_requests flips back to true - pooling_effective_at is never stamped because COMPLETE_POOLING never ran."
        test_recipe:
          setup: ["Rate center COLUMBUS under NPA 614 (no blocks, so no jeopardy) was moved to TRANSITIONAL by BEGIN_POOLING, which turned accepts_initial_requests false."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/rate-centers/${rc_id}/pooling-transitions"
              payload: { action: "BEGIN_POOLING" }
              as: NumberingAdministrator
              captures: { transitional_accepts: "$.data.accepts_initial_requests" }
          trigger:
            - call: "POST /numbering/rate-centers/${rc_id}/pooling-transitions"
              payload: { action: "REVERT" }
              as: NumberingAdministrator
          assert:
            - "${transitional_accepts} == false while the rate center was TRANSITIONAL"
            - "HTTP 200, RateCenter.pooling_status == \"NON_POOLED\", accepts_initial_requests == true, jeopardy_flag == false"
            - "RateCenter.pooling_effective_at is null, last_donation_block_count == 0, donation_shortfall_count == 0, version == 3"

