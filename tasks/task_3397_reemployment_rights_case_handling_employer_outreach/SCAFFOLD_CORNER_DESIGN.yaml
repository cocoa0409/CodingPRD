      - name: referral_return_resubmit_cycle_ignores_window
        claim_type: Valid Transition
        grounds:
          - state_machines.Referral.SUBMITTED_to_RETURNED_FOR_INFO
          - state_machines.Referral.RETURNED_FOR_INFO_to_SUBMITTED
          - state_machines.Referral.SUBMITTED_to_ACKNOWLEDGED
        distinguishing_aspect: "The cyclic RETURNED_FOR_INFO -> SUBMITTED edge is not window-checked: resubmission succeeds at clock +40 days past escalation even though the first submission's 30-day window has closed; submitted_at keeps its first-submission value."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Escalated case with a DRAFT referral."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
            - *c_assign
            - *c_round
            - call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "ESCALATION_PENDING" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/referrals"
              payload: { case_id: "${case_id}", agency: "DOL_VETS", summary: "Informal resolution failed." }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rf_id: $.data.id }
            - call: "POST /reemployment/referrals/${rf_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramCoordinator
            - call: "POST /reemployment/referrals/${rf_id}/state"
              payload: { to_status: "RETURNED_FOR_INFO", info_request_note: "Attach the member's orders." }
              as: AgencyReviewer
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/referrals/${rf_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramCoordinator
              captures: { resub_status: $.data.status }
            - call: "POST /reemployment/referrals/${rf_id}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: AgencyReviewer
          assert:
            - "the RETURNED_FOR_INFO note was stored: info_request_note == \"Attach the member's orders.\""
            - "resubmission at 2026-10-11 (40 days after escalation) succeeds: resub_status == SUBMITTED"
            - "submitted_at remains the first-submission instant 2026-09-01T00:00:00Z"
            - "final status after agency acknowledgement == ACKNOWLEDGED and the case remains REFERRED"

      - name: statement_lapses_and_renews_with_fresh_expiry
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StatementOfSupport.SIGNED_to_LAPSED
          - state_machines.StatementOfSupport.LAPSED_to_SIGNED
          - calculations.lazy_expiry
        distinguishing_aspect: "At clock == expires_on the statement still reads SIGNED (strictly-greater comparison); one second past it reads LAPSED; the renewal edge stamps a fresh signed_on and expires_on 24 months out."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer with a signed 24-month statement (expires 2028-09-01T00:00:00Z)."
          setup_api_calls:
            - *c_clock
            - *c_emp
