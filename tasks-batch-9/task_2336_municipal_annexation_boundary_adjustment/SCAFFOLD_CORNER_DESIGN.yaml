          - state_machines.AnnexationCase.EFFECTIVE_to_DE_ANNEXED
          - calculations.tax_roll_proration
        distinguishing_aspect: |
          With de_annexation_refund_basis WHOLE_QUARTER and a de-annexation effective 2027-05-20,
          quarters_remaining is 3, so the refund is round_half_up(224,658 * 3 / 4) = 168,494 cents
          — the whole of the quarter containing 20 May is refunded. Under DAILY_PRORATION the same
          predecessor tax and the same date would refund only round_half_up(224,658 * 226 / 365)
