              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: ["WINDOW"] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
            - call: "GET /api/orders/${order_id}/permit-applications"
              as: PermitCoordinator
              captures: { app_id: "$.data[0].id" }
            - call: "POST /api/permit-applications/${app_id}/approve"
              payload: {}
              as: PermitCoordinator
            - call: "POST /api/orders/${order_id}/payments"
              payload: { amount_cents: 120298, method: "CARD", idempotency_key: "dep-1" }
              as: FinanceManager
            - call: "POST /api/orders/${order_id}/schedule"
              payload: { scheduled_date: "2026-08-10", crew_id: "crew-1" }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/payments"
              payload: { amount_cents: 79702, method: "CASH", idempotency_key: "pay-2" }
              as: FinanceManager
          trigger:
            - call: "POST /api/orders/${order_id}/cancel"
              payload: { reason: "found a better offer" }
              as: SalesRep
          assert:
            - "Order.${order_id}.status == CANCELLED"
            - "collected_cents == 200000 (120298 + 79702)"
            - "retained_cents == 65200 = admin 5000 + permit 21000 + restock round(392000*0.10)=39200"
            - "refunded_cents == 134800 and 134800 + 65200 == 200000 (cash conservation holds)"
            - "a REFUND Payment of 134800 exists under GET /api/orders/${order_id}/payments"

      - name: rto_default_receivable_conservation
        grounds:
          - calculations.rto_delinquency_evaluation
          - state_machines.RtoContract.DELINQUENT_to_DEFAULTED
          - entities.RtoContract.fields.written_off_cents
        distinguishing_aspect: |
          Conserved quantity = CONTRACT PRINCIPAL: across payments, late-fee
          accrual and DEFAULT, amount_applied_cents + remaining_balance_cents +
          written_off_cents == total_contract_cents (20000 + 0 + 925290 ==
          945290); quantity differs from cancel_refund_cash_conservation.
