            - "Four windows W1..W4 on P each rooms_allocated 1, rate 15000, covering Oct 1-5."
            - "Customer C already has 3 ACCEPTED bids (W1..W3 consumed) within the trailing 30 days; C.fraud_score 0."
            - "A fourth PENDING FIXED bid on NB7 remains."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
