              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "595-95-9595", primary_owner_name: "Owner One" }
              as: TransferAgentOperator
              captures: { acc_one: $.data.id }
            - call: "POST /shareholder-accounts/${acc_one}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "606-06-0607", primary_owner_name: "Owner Two" }
              as: TransferAgentOperator
              captures: { acc_two: $.data.id }
            - call: "POST /shareholder-accounts/${acc_two}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_two}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 1000.00 }
              as: AccountHolder
              as_user_id: "${acc_one}"
              captures: { err_id: $.data.error_id }
            - call: "POST /trades"
              payload: { account_id: "${acc_one}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 1000.00 }
              as: AccountHolder
              as_user_id: "${acc_one}"
              captures: { t_own: $.data.id }
          assert:
            - "the cross-account capture returns HTTP 403 with error_id ERR_ACCOUNT_OWNERSHIP_REQUIRED"
            - "the own-account capture returns HTTP 201 and Trade.${t_own}.account_id == ${acc_one}"
            - "Trade.${t_own}.captured_by_user_id == ${acc_one}"
            - "GET /trades with account_id ${acc_two} returns total_count 0"

