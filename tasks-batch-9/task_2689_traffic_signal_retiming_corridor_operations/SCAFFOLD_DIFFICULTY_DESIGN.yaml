scaffold_difficulty_design:

  # =============================================================================================
  # RULE 1 — dual_variant_calc
  # =============================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: corridor_priority_score_screening_vs_programming_variant_divergence
        grounds:
          - calculations.corridor_priority_score
          - calculations.corridor_avg_plan_age_days
          - calculations.intersection_timing_plan_age_days
          - calculations.corridor_complaint_count_12mo
          - entities.Corridor.fields.priority_score_variant
          - state_machines.Corridor.UNSCREENED_to_SCREENED
          - state_machines.Corridor.SCREENED_to_SELECTED
        distinguishing_aspect: |
          The divergence is produced by the MEMBER-INCLUSION PREDICATE (screening drops BLOCKED
          members from numerator and denominator; programming keeps them), so on one corridor whose
          only READY member was just retimed (age 0) and whose only BLOCKED member was never retimed
          (age 3650) the same stored rows yield priority_score 24.75 under SCREENING and 81.00 under
          PROGRAMMING — a 56.25-point spread on identical data.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z for the whole chain."
            - "Intersection i1 is READY (detection FULL, comm ONLINE) and has already been retimed by an implemented project on corridor c1, so its last_retimed_at == 2026-08-01T00:00:00Z and timing_plan_age_days == 0."
            - "Intersection i2 is BLOCKED (detection_status FAILED) and was never retimed, so timing_plan_age_days == 3650 (NEVER_RETIMED_AGE_DAYS)."
            - "Corridor c2 is ARTERIAL with annual_volume_change_pct 12.0 and holds both i1 (sequence_index 1) and i2 (sequence_index 2)."
            - "c2 carries exactly 3 COORDINATION complaints, all OPEN, all received at 2026-08-01T00:00:00Z (inside the closed 365-day window)."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 12, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 4.0, ped_clear_sec: 17.8, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/implement"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 3rd Ave", controller_type: "LEGACY_170", detection_status: "FAILED", comm_status: "ONLINE", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i2_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd Extended", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 12.0 }
              as: SignalOpsAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c2_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c2_id}/members"
              payload: { intersection_id: "${i2_id}", sequence_index: 2, distance_from_prev_ft: 2640 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada Reyes", email: "ada.reyes@example.org", contact_pref: "EMAIL" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c2_id}", category: "COORDINATION", narrative: "Stopping at every signal northbound in the morning." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c2_id}", category: "COORDINATION", narrative: "Green wave breaks at 3rd Ave." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c2_id}", category: "COORDINATION", narrative: "Offsets feel wrong in the PM peak too." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
          trigger:
            - call: "POST /signal-ops/corridors/${c2_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { c2_screen_score: $.data.priority_score, c2_screen_age: $.data.avg_plan_age_days, c2_screen_variant: $.data.priority_score_variant }
            - call: "POST /signal-ops/corridors/${c2_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programming variant confirms the corridor" }
              as: SignalOpsAdmin
              captures: { c2_prog_score: $.data.priority_score, c2_prog_age: $.data.avg_plan_age_days }
          assert:
            - "${c2_screen_age} == 0.00"
            - "${c2_screen_score} == 24.75"
            - "${c2_screen_variant} == SCREENING"
            - "${c2_prog_age} == 1825.00"
            - "${c2_prog_score} == 81.00"
            - "Corridor.${c2_id}.priority_score == 81.00"
            - "Corridor.${c2_id}.priority_score_variant == PROGRAMMING"
            - "Corridor.${c2_id}.avg_plan_age_days == 1825.00"
            - "Corridor.${c2_id}.complaint_count_12mo == 3"
            - "Corridor.${c2_id}.member_count == 2"
            - "Corridor.${c2_id}.selection_status == SELECTED"
            - "${c2_prog_score} - ${c2_screen_score} == 56.25"
            - "Intersection.${i1_id}.timing_plan_age_days == 0"
            - "Intersection.${i2_id}.timing_plan_age_days == 3650"

      - name: performance_evaluation_provisional_unweighted_vs_certified_weighted_variants
        grounds:
          - calculations.corridor_performance_metrics
          - entities.PerformanceEvaluation.fields.metric_variant
          - entities.PerformanceEvaluation.fields.included_after_run_count
          - state_machines.PerformanceEvaluation.PROVISIONAL_to_CERTIFIED
          - state_machines.RetimingProject.FIELD_TUNING_to_EVALUATION
          - concurrency_rules[timing-plan-create-stale-project]
        distinguishing_aspect: |
          Two independent axes diverge at once — the AFTER inclusion predicate (provisional takes ALL
          AFTER runs, certified only those with recorded_at >= last_tuning_completed_at) and the MEAN
          definition (unweighted arithmetic vs arrivals-weighted) — so the same two BEFORE and two
          AFTER rows yield delay_reduction_pct 22.73 provisional versus 24.70 certified and
          included_after_run_count 2 versus 1.
        test_recipe:
          setup:
            - "Corridor c1 (ARTERIAL, volume 20.0) with the single member i1 is SELECTED; project p1 has been implemented."
            - "BEFORE travel-time runs: NB duration 320 / stops 5 / aog 4 / arrivals 12, and SB duration 340 / stops 7 / aog 3 / arrivals 18."
            - "Clock moved to 2026-08-05T10:00:00Z, field tuning STARTed, AFTER run R1 (NB, 260 s, 3 stops, 8 aog, 10 arrivals) recorded at 2026-08-05T10:00:00Z."
            - "Clock moved to 2026-08-06T10:00:00Z, field tuning COMPLETEd so last_tuning_completed_at == 2026-08-06T10:00:00Z, then AFTER run R2 (NB, 250 s, 2 stops, 9 aog, 10 arrivals) recorded at 2026-08-06T10:00:00Z."
            - "A PROVISIONAL PerformanceEvaluation has been created and its metric fields captured."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "SB", started_at: "2026-07-15T09:00:00Z", duration_sec: 340, stops_count: 7, arrivals_on_green_count: 3, total_arrivals: 18 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 12, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 4.0, ped_clear_sec: 17.8, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/implement"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects/${p1_id}/field-tuning"
              payload: { action: "START" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "AFTER", direction: "NB", started_at: "2026-08-05T09:00:00Z", duration_sec: 260, stops_count: 3, arrivals_on_green_count: 8, total_arrivals: 10 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T10:00:00Z" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects/${p1_id}/field-tuning"
              payload: { action: "COMPLETE" }
              as: SignalOpsAdmin
              captures: { p1_v_ft: $.data.version }
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "AFTER", direction: "NB", started_at: "2026-08-06T09:00:00Z", duration_sec: 250, stops_count: 2, arrivals_on_green_count: 9, total_arrivals: 10 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/performance-evaluations"
              payload: { expected_project_version: "${p1_v_ft}" }
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { ev1_id: $.data.id, ev1_variant: $.data.metric_variant, ev1_mb: $.data.mean_travel_time_before_sec, ev1_ma: $.data.mean_travel_time_after_sec, ev1_delay: $.data.delay_reduction_pct, ev1_sa: $.data.total_stops_after, ev1_sr: $.data.stops_reduction_pct, ev1_aoga: $.data.aog_pct_after, ev1_n: $.data.included_after_run_count }
          trigger:
            - call: "POST /signal-ops/performance-evaluations/${ev1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
          assert:
            - "${ev1_variant} == PROVISIONAL_UNWEIGHTED"
            - "${ev1_mb} == 330.00"
            - "${ev1_ma} == 255.00"
            - "${ev1_delay} == 22.73"
            - "${ev1_sa} == 5"
            - "${ev1_sr} == 58.33"
            - "${ev1_aoga} == 85.00"
            - "${ev1_n} == 2"
            - "PerformanceEvaluation.${ev1_id}.status == CERTIFIED"
            - "PerformanceEvaluation.${ev1_id}.metric_variant == CERTIFIED_WEIGHTED"
            - "PerformanceEvaluation.${ev1_id}.mean_travel_time_before_sec == 332.00"
            - "PerformanceEvaluation.${ev1_id}.mean_travel_time_after_sec == 250.00"
            - "PerformanceEvaluation.${ev1_id}.delay_reduction_pct == 24.70"
            - "PerformanceEvaluation.${ev1_id}.total_stops_before == 12"
            - "PerformanceEvaluation.${ev1_id}.total_stops_after == 2"
            - "PerformanceEvaluation.${ev1_id}.stops_reduction_pct == 83.33"
            - "PerformanceEvaluation.${ev1_id}.aog_pct_before == 23.33"
            - "PerformanceEvaluation.${ev1_id}.aog_pct_after == 90.00"
            - "PerformanceEvaluation.${ev1_id}.included_after_run_count == 1"
            - "PerformanceEvaluation.${ev1_id}.certified_by_user_id == cert-1"

  # =============================================================================================
  # RULE 2 — combinatorial_formula
  # =============================================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: split_rescale_round_each_phase_then_apply_single_residual
        grounds:
          - calculations.timing_plan_split_rescale
          - calculations.corridor_coordinated_cycle_length
          - calculations.intersection_recommended_cycle_length
          - entities.PhaseSplit.fields.effective_split_sec
          - entities.TimingPlan.fields.effective_split_total_sec
          - state_machines.TimingPlan.DRAFT_to_COORDINATED
        distinguishing_aspect: |
          Order-of-operations mode: the formula pins round_half_up PER PHASE first and then applies the
          single residual to the greatest-min_green phase, so drafted splits {21,21,22,22} at cycle 105
          must land on exactly {26,25,27,27}; the truncate-then-distribute alternative would produce
          {25,28,26,26} and a sum-then-round alternative would produce non-integer per-phase seconds.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL, volume 20.0) SELECTED with the single READY member i1 (max_cycle_length_sec 150)."
            - "Project p1 in PLAN_DEVELOPMENT with one BEFORE turning movement count phase_volumes {1:350, 2:500, 4:250, 6:180} (critical flow ratio 0.7111, recommended cycle 105) and one BEFORE travel-time run."
            - "DRAFT plan pl1 with drafted cycle_length_sec 90 and four phase splits {1:21 minG 10, 2:21 minG 15, 4:22 minG 12, 6:22 minG 10}; drafted split total 86."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { tmc1_cfr: $.data.critical_flow_ratio_sum, tmc1_rec: $.data.recommended_cycle_sec }
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
