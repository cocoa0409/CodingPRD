# =============================================================================
# Task 1813 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >=2 instances. All fixture arithmetic pre-computed.
# Logical clock default: 2026-08-01T00:00:00Z (see SCAFFOLD.yaml §1.5 clock).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1 --
  - rule_id: dual_variant_calc
    instances:
      - name: termination_credit_proration_divergence
        grounds:
          - calculations.termination_credit
          - entities.LicenseAgreement.fields.termination_credit_cents
          - state_machines.LicenseAgreement.EXECUTED_to_TERMINATED
        distinguishing_aspect: |
          LicenseAgreement-domain dual variant: two licenses identical in every
          input (same slot, same window, same 900000-cent flat fee, same
          termination instant 2026-09-20) differ ONLY in proration_mode;
          DAILY_PRORATION yields credit 400000 while MONTHLY_PRORATION yields
          300000 (40 remaining days = 1 full 30-day block out of ceil(90/30)=3).
        test_recipe:
          setup:
            - "Holder H, title T, platform P exist"
            - "Slot S: T/H, US/en/SVOD, sellable [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z)"
            - "L1: direct non-exclusive FLAT_FEE 900000 license on S, window [2026-08-01T00:00:00Z, 2026-10-30T00:00:00Z), proration_mode DAILY_PRORATION"
            - "L2: identical to L1 except proration_mode MONTHLY_PRORATION"
            - "Logical clock advanced to 2026-09-20T00:00:00Z (both licenses EXECUTED, not expired)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-10-30T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 900000, proration_mode: "DAILY_PRORATION" }, as: RightsManager, captures: { l1_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-10-30T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 900000, proration_mode: "MONTHLY_PRORATION" }, as: RightsManager, captures: { l2_id: $.data.id } }
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: RightsManager }
          trigger:
            - { call: "POST /licensing/license-agreements/${l1_id}/terminate", as: RightsManager, captures: { l1_credit: $.data.termination_credit_cents, l1_status: $.data.license_status } }
            - { call: "POST /licensing/license-agreements/${l2_id}/terminate", as: RightsManager, captures: { l2_credit: $.data.termination_credit_cents, l2_status: $.data.license_status } }
          assert:
            - "LicenseAgreement.${l1_id}.termination_credit_cents == 400000   # round(900000 * 40/90)"
            - "LicenseAgreement.${l2_id}.termination_credit_cents == 300000   # round(900000 * floor(40/30)/ceil(90/30)) = 900000/3"
            - "LicenseAgreement.${l1_id}.license_status == TERMINATED and LicenseAgreement.${l2_id}.license_status == TERMINATED"

      - name: statement_attribution_mode_divergence
        grounds:
          - calculations.statement_attribution
          - entities.RoyaltyStatement.fields.attribution_mode
        distinguishing_aspect: |
          RoyaltyStatement-domain dual variant (different entity domain than
          termination_credit_proration_divergence): over the SAME two submitted
          reports, BY_REPORT_DATE includes both (both submitted inside September)
          for holder_due 2000, while BY_USAGE_PERIOD includes only the report
          whose usage period intersects September, for holder_due 1500.
        test_recipe:
          setup:
            - "Holder H (royalty_share_pct 100), title T, platform P, slot S (US/en/SVOD, rights [2026-08-01, 2027-08-01))"
            - "License L: direct non-exclusive REVENUE_SHARE 50% on S, window [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z)"
            - "R1: usage [2026-08-01, 2026-08-31], gross 1000, submitted at clock 2026-09-02 -> payable 500"
            - "R2: usage [2026-08-15, 2026-09-15], gross 3000, submitted at clock 2026-09-20 -> payable 1500"
            - "Clock at 2026-09-30T00:00:00Z"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: RightsManager }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", gross_revenue_cents: 1000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r1_id: $.data.id } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v2: $.data.version } }
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: RightsManager }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", gross_revenue_cents: 3000, expected_license_version: "${l_v2}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: RightsManager }
          trigger:
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st_a: $.data.id, st_a_due: $.data.holder_royalty_due_cents, st_a_gross: $.data.gross_revenue_cents } }
            - { call: "POST /licensing/royalty-statements/${st_a}/finalize", as: FinanceAnalyst, as_user_id: "fin-ana-1" }
            - { call: "POST /licensing/royalty-statements/${st_a}/mark-paid", as: FinanceController, as_user_id: "fin-ctl-1" }
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", attribution_mode: "BY_USAGE_PERIOD" }, as: FinanceAnalyst, captures: { st_b: $.data.id, st_b_due: $.data.holder_royalty_due_cents, st_b_gross: $.data.gross_revenue_cents } }
          assert:
            - "RoyaltyStatement.${st_a}.gross_revenue_cents == 4000 and holder_royalty_due_cents == 2000   # R1(500)+R2(1500) net, holder 100%"
            - "RoyaltyStatement.${st_b}.gross_revenue_cents == 3000 and holder_royalty_due_cents == 1500   # only R2's usage intersects September"
            - "RoyaltyStatement.${st_a}.statement_status == PAID   # PAID statements do not block the overlapping-period creation of ${st_b}"

  # ---------------------------------------------------------------- Rule 2 --
  - rule_id: combinatorial_formula
    instances:
      - name: recoupment_waterfall_min_interaction
        grounds:
          - calculations.recoupment_split
          - entities.LicenseAgreement.fields.outstanding_recoupment_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: payable =
          max(0, accrued - min(accrued, outstanding)) with conditional on
          fee_model; across three reports the min() binds differently
          (full withhold 60000, exact-exhaustion withhold 40000, zero withhold).
        test_recipe:
          setup:
            - "Holder H, title T, platform P, slot S (US/en/SVOD, rights [2026-08-01, 2027-08-01))"
            - "MG license L: minimum_guarantee_cents 100000, revenue_share_pct 50, window [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z), EXECUTED at default clock"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 100000, revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-15T00:00:00Z", gross_revenue_cents: 120000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r1_applied: $.data.recoupment_applied_cents, r1_payable: $.data.payable_cents } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v2: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-16T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 80000, expected_license_version: "${l_v2}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r2_applied: $.data.recoupment_applied_cents, r2_payable: $.data.payable_cents } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v3: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-20T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 10000, expected_license_version: "${l_v3}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r3_applied: $.data.recoupment_applied_cents, r3_payable: $.data.payable_cents } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { fin_recouped: $.data.recouped_cents, fin_payable: $.data.royalty_payable_cents, fin_outstanding: $.data.outstanding_recoupment_cents } }
          assert:
            - "R1: recoupment_applied_cents == 60000 and payable_cents == 0          # accrued 60000 fully withheld"
            - "R2: recoupment_applied_cents == 40000 and payable_cents == 0          # min(40000, outstanding 40000)"
            - "R3: recoupment_applied_cents == 0 and payable_cents == 5000           # outstanding exhausted"
            - "LicenseAgreement.${l_id}: recouped_cents == 100000, royalty_payable_cents == 5000, outstanding_recoupment_cents == 0"

      - name: statement_per_report_rounding_order
        grounds:
          - calculations.statement_attribution
          - entities.RoyaltyStatement.fields.studio_net_royalty_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order (different mode than instance
          recoupment_waterfall_min_interaction): scaffold pins round-per-report
          then sum. Two 1-cent reports at 50%: per-report rounding gives
          1+1 = 2; summing raw gross first would give round(2 * 0.5) = 1.
        test_recipe:
          setup:
            - "Holder H (share 100), title T, platform P, slot S (rights [2026-08-01, 2027-08-01))"
            - "REVENUE_SHARE 50% license L on S, window [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z)"
            - "Two SUBMITTED reports R1, R2 with gross_revenue_cents == 1 each, both submitted at the default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 1, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r1_accrued: $.data.royalty_accrued_cents } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v2: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-15T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 1, expected_license_version: "${l_v2}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r2_accrued: $.data.royalty_accrued_cents } }
          trigger:
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st_id: $.data.id, st_net: $.data.studio_net_royalty_cents, st_due: $.data.holder_royalty_due_cents } }
          assert:
            - "R1.royalty_accrued_cents == 1 and R2.royalty_accrued_cents == 1   # round_half_up(1 * 0.5) per report"
            - "RoyaltyStatement.${st_id}.studio_net_royalty_cents == 2           # sum of per-report rounded payable values"
            - "RoyaltyStatement.${st_id}.holder_royalty_due_cents == 2           # NOT round(2 * 0.5) = 1"
            - "Both reports included: submitted_at == 2026-08-01T00:00:00Z equals period_end and the interval is closed"

      - name: package_discount_evaluation_order
        grounds:
          - calculations.package_volume_discount
          - entities.AvailPackage.fields.discount_cents
          - entities.LicenseAgreement.fields.allocated_fee_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order
          (different mode than the other two instances): the discount tier is
          keyed on the GROSS guaranteed total of accepted lines (2100000 ->
          10%), never on the net total (1890000 would be 5%); pro-rata
          allocation is per-line rounded with the remainder pinned to the
          lowest-index accepted line.
        test_recipe:
          setup:
            - "Holder H, title T, platform P (SVOD)"
            - "Slots S1 SVOD, S2 AVOD, S3 TVOD (US/en, rights [2026-08-01, 2027-08-01))"
            - "Package PKG for P, offer_expires_at 2026-12-01T00:00:00Z, lines: L1 S1 FLAT_FEE 1500000; L2 S2 MINIMUM_GUARANTEE 600000 share 40; L3 S3 REVENUE_SHARE 25 (guaranteed 0); all windows [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z), non-exclusive"
            - "PKG is OFFERED"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s1_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s2_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "TVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s3_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s1_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 1500000 }, { slot_id: "${s2_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 600000, revenue_share_pct: 40 }, { slot_id: "${s3_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 25 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s1_id}", "${s2_id}", "${s3_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { pkg_status: $.data.package_status, pkg_disc_pct: $.data.discount_pct, pkg_disc: $.data.discount_cents, pkg_net: $.data.net_total_cents, lic1_id: "$.data.lines[0].created_license_id", lic2_id: "$.data.lines[1].created_license_id", lic3_id: "$.data.lines[2].created_license_id" } }
            - { call: "GET /licensing/license-agreements/${lic1_id}", as: RightsManager, captures: { lic1_fee: $.data.allocated_fee_cents } }
            - { call: "GET /licensing/license-agreements/${lic2_id}", as: RightsManager, captures: { lic2_fee: $.data.allocated_fee_cents } }
            - { call: "GET /licensing/license-agreements/${lic3_id}", as: RightsManager, captures: { lic3_fee: $.data.allocated_fee_cents } }
          assert:
            - "AvailPackage.${pkg_id}.package_status == ACCEPTED"
            - "discount_pct == 10   # keyed on GROSS 2100000 (>= 2000000); net-keying would give 5"
            - "discount_cents == 210000 and net_total_cents == 1890000"
            - "LicenseAgreement.${lic1_id}.allocated_fee_cents == 1350000   # 1500000 - round(210000*1500000/2100000)"
            - "LicenseAgreement.${lic2_id}.allocated_fee_cents == 540000    # 600000 - round(210000*600000/2100000)"
            - "LicenseAgreement.${lic3_id}.allocated_fee_cents == 0         # REVENUE_SHARE guarantees nothing"
            - "All three licenses have license_status == EXECUTED and package_id == ${pkg_id}"

  # ---------------------------------------------------------------- Rule 3 --
  - rule_id: non_linear_state_machine
    instances:
      - name: rights_slot_encumber_release_cycle
        grounds:
          - state_machines.RightsSlot.AVAILABLE_to_ENCUMBERED
          - state_machines.RightsSlot.ENCUMBERED_to_AVAILABLE
        distinguishing_aspect: |
          Cyclic machine on RightsSlot: AVAILABLE -> ENCUMBERED -> AVAILABLE ->
          ENCUMBERED is exercised twice around the loop (license create /
          terminate / license create), proving the loop is re-enterable rather
          than a one-way pipeline.
        test_recipe:
          setup:
            - "Holder H, title T, platform P, slot S (US/en/SVOD, rights [2026-08-01, 2027-08-01))"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id, st0: $.data.slot_status } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { l1_id: $.data.id } }
            - { call: "GET /licensing/rights-slots/${s_id}", as: RightsManager, captures: { st1: $.data.slot_status } }
            - { call: "POST /licensing/license-agreements/${l1_id}/terminate", as: RightsManager }
            - { call: "GET /licensing/rights-slots/${s_id}", as: RightsManager, captures: { st2: $.data.slot_status } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 200000 }, as: RightsManager, captures: { l2_id: $.data.id } }
            - { call: "GET /licensing/rights-slots/${s_id}", as: RightsManager, captures: { st3: $.data.slot_status } }
          assert:
            - "slot_status sequence: AVAILABLE (create) -> ENCUMBERED (exclusive L1) -> AVAILABLE (L1 terminated) -> ENCUMBERED (exclusive L2)"
            - "captured: st0 == AVAILABLE, st1 == ENCUMBERED, st2 == AVAILABLE, st3 == ENCUMBERED"
            - "LicenseAgreement.${l1_id}.license_status == TERMINATED; TERMINATED L1 does not block L2's creation"

      - name: delivery_batch_reject_resubmit_cycle
        grounds:
          - state_machines.DeliveryBatch.QUEUED_to_REJECTED
          - state_machines.DeliveryBatch.REJECTED_to_QUEUED
          - state_machines.DeliveryBatch.QUEUED_to_DELIVERED
        distinguishing_aspect: |
          Cyclic machine on DeliveryBatch (different entity than RightsSlot):
          QUEUED -> REJECTED -> QUEUED -> DELIVERED; the REJECTED -> QUEUED
          resubmit edge (not a terminal dead end) is what makes the machine
          non-linear, and attempt_count accumulates across the loop.
        test_recipe:
          setup:
            - "Platform P requires profiles [4K_HDR, CC_EN] with metadata spec MEC-2.3"
            - "Holder/title/slot and a direct FLAT_FEE 100000 license L (window [2026-08-01T00:00:00Z, 2027-01-01T00:00:00Z), EXECUTED)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR", "CC_EN"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches", payload: { license_id: "${l_id}", asset_manifest: ["4K_HDR"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { b_id: $.data.id, st_q: $.data.delivery_status } }
          trigger:
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager, captures: { st_r: $.data.delivery_status, miss: $.data.missing_profiles, att1: $.data.attempt_count } }
            - { call: "POST /licensing/delivery-batches/${b_id}/resubmit", payload: { asset_manifest: ["4K_HDR", "CC_EN"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { st_q2: $.data.delivery_status } }
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager, captures: { st_d: $.data.delivery_status, att2: $.data.attempt_count, miss2: $.data.missing_profiles } }
          assert:
            - "st_q == QUEUED (initial), st_r == REJECTED, st_q2 == QUEUED (cycle edge), st_d == DELIVERED"
            - "after first submit: missing_profiles == [CC_EN]; after second: missing_profiles == []"
            - "attempt_count == 1 after first submit and == 2 after the second (loop accumulates)"

  # ---------------------------------------------------------------- Rule 4 --
  - rule_id: transitive_cascade
    instances:
      - name: slot_withdraw_block_package_expire_chain
        grounds:
          - state_machines.RightsSlot.AVAILABLE_to_WITHDRAWN
          - state_machines.AvailPackage.OFFERED_to_EXPIRED
        distinguishing_aspect: |
          Depth-3 chain triggered by slot WITHDRAW: (hop1) OFFERED line on the
          slot -> BLOCKED; (hop2) the single-line package whose every line is
          now BLOCKED auto-EXPIRES; (hop3) the package's expiry flips its
          non-LICENSED lines to NOT_SELECTED. The two-line package stops at
          hop1 (still OFFERED), proving the hop2 rule is conditional.
        test_recipe:
          setup:
            - "Holder H, title T, platform P; slots S1 (US/en/SVOD) and S2 (US/en/AVOD), rights [2026-08-01, 2027-08-01)"
            - "P1: OFFERED package with a single line on S1 (FLAT 100000, window [2026-09-01, 2026-12-01))"
            - "P2: OFFERED package with lines on S1 and S2 (same terms)"
            - "Both offers expire 2026-12-01T00:00:00Z; S1/S2 AVAILABLE (no licenses)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s1_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s2_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "P1", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s1_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 100000 } ] }, as: RightsManager, captures: { p1_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${p1_id}/offer", as: RightsManager }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "P2", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s1_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, { slot_id: "${s2_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 80000 } ] }, as: RightsManager, captures: { p2_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${p2_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/rights-slots/${s1_id}/withdraw", as: RightsManager, captures: { s1_status: $.data.slot_status } }
            - { call: "GET /licensing/avail-packages/${p1_id}", as: RightsManager, captures: { p1_status: $.data.package_status, p1_line0: "$.data.lines[0].line_status" } }
            - { call: "GET /licensing/avail-packages/${p2_id}", as: RightsManager, captures: { p2_status: $.data.package_status, p2_line0: "$.data.lines[0].line_status", p2_line1: "$.data.lines[1].line_status" } }
          assert:
            - "RightsSlot.${s1_id}.slot_status == WITHDRAWN"
            - "P1: package_status == EXPIRED and lines[0].line_status == NOT_SELECTED   # hop1 BLOCKED -> hop2 all-blocked EXPIRED -> hop3 NOT_SELECTED"
            - "P2: package_status == OFFERED, lines[0].line_status == BLOCKED, lines[1].line_status == OFFERED   # chain stops at hop1 when a sibling line survives"

      - name: license_terminate_frees_slot_unblocks_line_chain
        grounds:
          - state_machines.LicenseAgreement.EXECUTED_to_TERMINATED
          - state_machines.RightsSlot.ENCUMBERED_to_AVAILABLE
          - state_machines.TakedownNotice.SCHEDULED_to_EXECUTED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (manual license terminate vs
          slot withdraw): terminate -> exclusive slot ENCUMBERED->AVAILABLE
          (hop1) -> BLOCKED line on a still-OFFERED package restored to OFFERED
          (hop2); as a sibling hop-1 effect of the same termination the license's
          SCHEDULED takedown notice is executed immediately.
        test_recipe:
          setup:
            - "Holder H, title T, platform P; slot S3 (US/en/TVOD, rights [2026-08-01, 2027-08-01))"
            - "P3: OFFERED package with a line on S3 (FLAT 50000, window [2026-10-01T00:00:00Z, 2027-01-01T00:00:00Z), non-exclusive), expiry 2026-12-01"
            - "L: direct EXCLUSIVE FLAT_FEE 200000 license on S3, window [2026-08-01T00:00:00Z, 2026-11-01T00:00:00Z) — created AFTER P3 was offered, so P3's line is BLOCKED and S3 ENCUMBERED"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "TVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s3_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "P3", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s3_id}", license_start: "2026-10-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 50000 } ] }, as: RightsManager, captures: { p3_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${p3_id}/offer", as: RightsManager }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s3_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-11-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 200000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "GET /licensing/avail-packages/${p3_id}", as: RightsManager, captures: { mid_line: "$.data.lines[0].line_status" } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/terminate", as: RightsManager, captures: { l_status: $.data.license_status } }
            - { call: "GET /licensing/rights-slots/${s3_id}", as: RightsManager, captures: { s3_status: $.data.slot_status } }
            - { call: "GET /licensing/avail-packages/${p3_id}", as: RightsManager, captures: { end_line: "$.data.lines[0].line_status", p3_status: $.data.package_status } }
            - { call: "GET /licensing/takedown-notices?license_id=${l_id}", as: RightsManager, captures: { notice_status: "$.data[0].notice_status" } }
          assert:
            - "mid_line == BLOCKED and end_line == OFFERED   # terminate -> slot AVAILABLE -> line restored"
            - "RightsSlot.${s3_id}.slot_status == AVAILABLE"
            - "LicenseAgreement.${l_id}.license_status == TERMINATED"
            - "TakedownNotice for ${l_id}: notice_status == EXECUTED (immediate takedown on termination)"
            - "AvailPackage.${p3_id}.package_status == OFFERED throughout (single surviving line keeps it offerable)"

  # ---------------------------------------------------------------- Rule 5 --
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_terminal_license_report
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_LICENSE_NOT_REPORTABLE]
          - errors[ERR_NONPOSITIVE_REVENUE]
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_fiscal (p9): one request
          violates both (license TERMINATED, gross_revenue_cents negative);
          the state error ERR_LICENSE_NOT_REPORTABLE must win.
        test_recipe:
          setup:
            - "Holder/title/platform/slot and a REVENUE_SHARE 50 license L (window [2026-08-01T00:00:00Z, 2027-01-01T00:00:00Z)) that has been TERMINATED"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${l_id}/terminate", as: RightsManager, captures: { lt_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: -500, expected_license_version: "${lt_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LICENSE_NOT_REPORTABLE (state, p4) — NOT ERR_NONPOSITIVE_REVENUE (fiscal, p9)"
            - "HTTP status == 409"

      - name: temporal_beats_constraint_on_license_create
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_WINDOW_OUTSIDE_RIGHTS]
          - errors[ERR_EXCLUSIVITY_CONFLICT]
        distinguishing_aspect: |
          Error-category pair business_temporal (p7) vs business_constraint
          (p8) — a different pair than state/fiscal: the candidate window both
          exceeds the slot's rights period AND overlaps an existing exclusive
          license; ERR_WINDOW_OUTSIDE_RIGHTS must win.
        test_recipe:
          setup:
            - "Holder/title/platform and slot S (US/en/SVOD, rights [2026-08-01T00:00:00Z, 2027-01-01T00:00:00Z))"
            - "Existing EXCLUSIVE license A on S, window [2026-09-01T00:00:00Z, 2026-11-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-01-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-11-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { la_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-10-01T00:00:00Z", license_end: "2027-02-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 50000 }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_OUTSIDE_RIGHTS (temporal, p7) — NOT ERR_EXCLUSIVITY_CONFLICT (constraint, p8)"
            - "HTTP status == 422; no second license created (list by slot_id still has exactly 1 row)"

  # ---------------------------------------------------------------- Rule 6 --
  - rule_id: boundary_precision_check
    instances:
      - name: recoupment_exact_equality_boundary
        grounds:
          - calculations.recoupment_split
          - entities.RevenueReport.fields.recoupment_applied_cents
        distinguishing_aspect: |
          Money boundary on the revenue-reports endpoint: accrued royalty
          exactly EQUALS the outstanding minimum guarantee (50000 == 50000);
          the min() must take the full amount (no off-by-one-cent residue) and
          the NEXT report must pay out in full.
        test_recipe:
          setup:
            - "MG license L: minimum_guarantee_cents 50000, revenue_share_pct 50, window [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 50000, revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 100000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r1_applied: $.data.recoupment_applied_cents, r1_payable: $.data.payable_cents } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v2: $.data.version, out_after1: $.data.outstanding_recoupment_cents } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-15T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 4000, expected_license_version: "${l_v2}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r2_applied: $.data.recoupment_applied_cents, r2_payable: $.data.payable_cents } }
          assert:
            - "R1: recoupment_applied_cents == 50000 and payable_cents == 0   # exact equality: withhold the full 50000, not 49999"
            - "after R1: outstanding_recoupment_cents == 0                    # boundary lands exactly on zero"
            - "R2: recoupment_applied_cents == 0 and payable_cents == 2000    # post-exhaustion reports pay in full"

      - name: offer_expiry_exact_instant_boundary
        grounds:
          - state_machines.AvailPackage.OFFERED_to_EXPIRED
          - validations[priority=4]
          - errors[ERR_PACKAGE_NOT_OFFERED]
        distinguishing_aspect: |
          Timestamp boundary on the accept endpoint (different metric —
          instants, not cents — and different endpoint than
          recoupment_exact_equality_boundary): at clock == offer_expires_at
          -1s the accept succeeds; at clock == offer_expires_at exactly the
          sweep has already expired the package (half-open: now >= expiry) and
          the accept fails with ERR_PACKAGE_NOT_OFFERED.
        test_recipe:
          setup:
            - "Holder/title/platform; slots SA (SVOD) and SB (AVOD), rights [2026-08-01, 2027-08-01)"
            - "PA and PB: OFFERED packages (one FLAT_FEE 10000 line each on SA / SB, window [2026-09-15T00:00:00Z, 2026-12-15T00:00:00Z)), both with offer_expires_at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { sa_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { sb_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PA", offer_expires_at: "2026-09-01T00:00:00Z", lines: [ { slot_id: "${sa_id}", license_start: "2026-09-15T00:00:00Z", license_end: "2026-12-15T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pa_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pa_id}/offer", as: RightsManager }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PB", offer_expires_at: "2026-09-01T00:00:00Z", lines: [ { slot_id: "${sb_id}", license_start: "2026-09-15T00:00:00Z", license_end: "2026-12-15T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pb_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pb_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T23:59:59Z" }, as: RightsManager }
            - { call: "POST /licensing/avail-packages/${pa_id}/accept", payload: { accepted_slot_ids: ["${sa_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { pa_status: $.data.package_status } }
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RightsManager }
            - { call: "POST /licensing/avail-packages/${pb_id}/accept", payload: { accepted_slot_ids: ["${sb_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "GET /licensing/avail-packages/${pb_id}", as: RightsManager, captures: { pb_status: $.data.package_status } }
          assert:
            - "PA accept at 2026-08-31T23:59:59Z succeeds: package_status == ACCEPTED"
            - "PB accept at exactly offer_expires_at fails: error_id == ERR_PACKAGE_NOT_OFFERED (HTTP 409)"
            - "PB.package_status == EXPIRED after the sweep (now >= offer_expires_at, half-open expiry)"

  # ---------------------------------------------------------------- Rule 7 --
  - rule_id: cross_entity_state_dependency
    instances:
      - name: license_activation_requires_delivered_batch
        grounds:
          - state_machines.LicenseAgreement.EXECUTED_to_ACTIVE
          - errors[ERR_DELIVERY_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair LicenseAgreement <- DeliveryBatch: activation is gated on
          a DIFFERENT entity's state (a DELIVERED batch must exist); a REJECTED
          batch does not satisfy the gate, and only after the batch cycle
          reaches DELIVERED does the same activate call succeed.
        test_recipe:
          setup:
            - "Platform P requires [4K_HDR], spec MEC-2.3; license L (FLAT_FEE 100000, window [2026-08-01T00:00:00Z, 2027-01-01T00:00:00Z)) EXECUTED at default clock (start already reached)"
            - "Batch B for L with manifest [HD_ONLY] submitted and REJECTED"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches", payload: { license_id: "${l_id}", asset_manifest: ["HD_ONLY"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { b_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager, captures: { b_st: $.data.delivery_status } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/activate", as: RightsManager, captures: { err: $.data.error_id } }
            - { call: "POST /licensing/delivery-batches/${b_id}/resubmit", payload: { asset_manifest: ["4K_HDR"], metadata_spec_version: "MEC-2.3" }, as: RightsManager }
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager, captures: { b_st2: $.data.delivery_status } }
            - { call: "POST /licensing/license-agreements/${l_id}/activate", as: RightsManager, captures: { l_status: $.data.license_status, l_act: $.data.activated_at } }
          assert:
            - "first activate: error_id == ERR_DELIVERY_INCOMPLETE (HTTP 422) — batch b_st == REJECTED does not satisfy the gate"
            - "after resubmit+submit: b_st2 == DELIVERED"
            - "second activate: license_status == ACTIVE and activated_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: package_accept_requires_slot_available
        grounds:
          - state_machines.AvailPackage.OFFERED_to_ACCEPTED
          - errors[ERR_LINE_BLOCKED]
        distinguishing_aspect: |
          Entity pair AvailPackage <- RightsSlot (different pair than
          License<-Batch): a line whose slot became ENCUMBERED after the offer
          is BLOCKED, and accepting it must fail even though the package itself
          is in the correct OFFERED state.
        test_recipe:
          setup:
            - "Slot S (US/en/SVOD, rights [2026-08-01, 2027-08-01)); package P with one line on S (FLAT 80000, window [2026-10-01T00:00:00Z, 2027-01-01T00:00:00Z)), OFFERED, expiry 2026-12-01"
            - "Direct EXCLUSIVE license on S (window [2026-08-01T00:00:00Z, 2026-11-01T00:00:00Z)) encumbers S and BLOCKs P's line"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "P", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-10-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 80000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-11-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 200000 }, as: RightsManager, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "GET /licensing/avail-packages/${pkg_id}", as: RightsManager, captures: { pkg_status: $.data.package_status } }
          assert:
            - "error_id == ERR_LINE_BLOCKED (HTTP 409)"
            - "package remains OFFERED (no partial accept, no license created from the blocked line)"

  # ---------------------------------------------------------------- Rule 8 --
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_window_exclusive_half_open_overlap
        grounds:
          - calculations.slot_conflict_check
          - errors[ERR_EXCLUSIVITY_CONFLICT]
        distinguishing_aspect: |
          Interval semantics #1 — HALF-OPEN [start, end) on the same
          title/territory/language/window cell: a candidate starting exactly at
          the existing exclusive license's end is adjacent and SUCCEEDS, while
          one day of true overlap is rejected; exclusivity on either side is
          what arms the check.
        test_recipe:
          setup:
            - "Slot S (US/en/SVOD, rights [2026-08-01, 2027-08-01)); exclusive license A on S with window [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { la_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-12-01T00:00:00Z", license_end: "2027-03-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 50000 }, as: RightsManager, captures: { lb_id: $.data.id, lb_status: $.data.license_status } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-11-30T00:00:00Z", license_end: "2027-02-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 50000 }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "adjacent candidate (start == A.end) is CREATED: license_status == EXECUTED   # half-open: [09-01,12-01) and [12-01,03-01) share no instant"
            - "overlapping candidate (start 2026-11-30 < A.end) is rejected: error_id == ERR_EXCLUSIVITY_CONFLICT (HTTP 409)"

      - name: cross_window_holdback_buffered_closed_interval
        grounds:
          - calculations.holdback_derivation
          - errors[ERR_HOLDBACK_CONFLICT]
          - entities.LicenseAgreement.fields.holdback_until
        distinguishing_aspect: |
          Interval semantics #2 — CLOSED, BUFFERED cross-window interval on a
          DIFFERENT resource pairing (SVOD license blocking the AVOD slot, not
          same-cell): an exclusive SVOD license ending 2026-12-01 holds back
          AVOD until 2026-12-31 (buffer 30d); a candidate starting exactly AT
          holdback_until still conflicts (closed end), while one starting the
          next day succeeds — the opposite adjacency behavior of the half-open
          same-cell rule.
        test_recipe:
          setup:
            - "Slots SV (SVOD) and AV (AVOD), same title/territory US/language en, rights [2026-08-01, 2028-01-01)"
            - "Exclusive SVOD license L on SV, window [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z) -> holdback_until == 2026-12-31T00:00:00Z (SVOD blocks AVOD with 30-day buffer)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "AVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2028-01-01T00:00:00Z" }, as: RightsManager, captures: { sv_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2028-01-01T00:00:00Z" }, as: RightsManager, captures: { av_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${sv_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 300000 }, as: RightsManager, captures: { l_id: $.data.id, l_holdback: $.data.holdback_until } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${av_id}", platform_id: "${p_id}", license_start: "2026-12-31T00:00:00Z", license_end: "2027-03-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 40000 }, as: RightsManager, captures: { err1: $.data.error_id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${av_id}", platform_id: "${p_id}", license_start: "2027-01-01T00:00:00Z", license_end: "2027-04-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 40000 }, as: RightsManager, captures: { av2_id: $.data.id, av2_status: $.data.license_status } }
          assert:
            - "L.holdback_until == 2026-12-31T00:00:00Z   # license_end 2026-12-01 + 30-day SVOD buffer"
            - "candidate starting exactly AT holdback_until (2026-12-31) is rejected: error_id == ERR_HOLDBACK_CONFLICT (closed interval end)"
            - "candidate starting 2027-01-01 (> holdback_until) is CREATED: license_status == EXECUTED"
            - "holdback applies even though both candidates are non-exclusive"

  # ---------------------------------------------------------------- Rule 9 --
  - rule_id: compensating_invariant
    instances:
      - name: report_reverse_restores_recoupment_invariant
        grounds:
          - calculations.recoupment_split
          - state_machines.RevenueReport.SUBMITTED_to_REVERSED
          - entities.LicenseAgreement.fields.recouped_cents
        distinguishing_aspect: |
          Conserved quantity = money (integer cents): after booking R1 and R2
          and then reversing R1, the invariant recouped_cents +
          royalty_payable_cents == sum of royalty_accrued_cents over SUBMITTED
          reports must hold exactly (40000 + 0 == 40000) — the reversal
          replays the waterfall over the remaining reports, it does not merely
          subtract.
        test_recipe:
          setup:
            - "MG license L: minimum_guarantee_cents 100000, revenue_share_pct 50, window [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z)"
            - "R1 gross 120000 booked (applied 60000), then R2 gross 80000 booked (applied 40000) -> recouped 100000"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 100000, revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-15T00:00:00Z", gross_revenue_cents: 120000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r1_id: $.data.id } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v2: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-16T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 80000, expected_license_version: "${l_v2}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/revenue-reports/${r1_id}/reverse", as: FinanceAnalyst, captures: { r1_status: $.data.report_status } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { rec: $.data.recouped_cents, pay: $.data.royalty_payable_cents, out: $.data.outstanding_recoupment_cents } }
          assert:
            - "RevenueReport.${r1_id}.report_status == REVERSED"
            - "license recouped_cents == 40000   # replay of remaining {R2}: min(40000, 100000), NOT 100000 - 60000 shortcut artifacts"
            - "license royalty_payable_cents == 0"
            - "license outstanding_recoupment_cents == 60000"
            - "invariant holds: recouped_cents + royalty_payable_cents (40000) == sum(royalty_accrued_cents over SUBMITTED reports) (40000)"

      - name: license_terminate_restores_slot_availability_invariant
        grounds:
          - state_machines.RightsSlot.AVAILABLE_to_ENCUMBERED
          - state_machines.RightsSlot.ENCUMBERED_to_AVAILABLE
          - state_machines.LicenseAgreement.EXECUTED_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity = slot availability predicate (a count-derived
          state, not money): slot is ENCUMBERED iff >=1 EXECUTED/ACTIVE
          exclusive license references it; two overlapping-window-free
          exclusive licenses pin the counter at 2, and only the SECOND
          compensating terminate returns the slot to AVAILABLE — partial
          compensation must not flip the predicate.
        test_recipe:
          setup:
            - "Slot S (US/en/SVOD, rights [2026-08-01, 2027-08-01)); L1 exclusive [2026-08-01, 2026-12-01), L2 exclusive [2026-12-01, 2027-04-01) — adjacent, both created"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id, st0: $.data.slot_status } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { l1_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-12-01T00:00:00Z", license_end: "2027-04-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { l2_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l1_id}/terminate", as: RightsManager }
            - { call: "GET /licensing/rights-slots/${s_id}", as: RightsManager, captures: { st_mid: $.data.slot_status } }
            - { call: "POST /licensing/license-agreements/${l2_id}/terminate", as: RightsManager }
            - { call: "GET /licensing/rights-slots/${s_id}", as: RightsManager, captures: { st_end: $.data.slot_status } }
          assert:
            - "st0 == AVAILABLE (zero exclusive licenses)"
            - "st_mid == ENCUMBERED after terminating L1 — L2 still EXECUTED, so the predicate holds (count 1 > 0)"
            - "st_end == AVAILABLE after terminating L2 — full compensation restores the initial predicate value"
            - "both licenses TERMINATED; invariant: ENCUMBERED iff count(EXECUTED|ACTIVE exclusive licenses on S) > 0 holds at every step"
