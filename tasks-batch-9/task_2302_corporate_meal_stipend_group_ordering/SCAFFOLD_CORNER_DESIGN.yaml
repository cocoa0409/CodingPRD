            - { call: "GET /employee-groups/${grp_id}", as: BenefitsController, captures: { grp_v2: $.data.version } }
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "MISSING_ITEM", claimed_cents: 1088, line_index: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /budget-rules/${rule2_id}/activate", payload: { expected_employee_group_version: "${grp_v2}" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { e_rule: $.data.error_id } }
            - { call: "POST /budget-rules/${rule2_id}/activate", payload: { expected_employee_group_version: "${grp_v2}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /credit-claims/${claim_id}/resolve", payload: { decision: "APPROVE", expected_order_version: "${ord_v}", approved_cents: 1088, routing_basis: "EMPLOYEE_FIRST" }, as: BenefitsController, as_user_id: "ctrl-resolver" }
            - { call: "POST /credit-claims/${claim_id}/settle", as: BenefitsController, as_user_id: "ctrl-resolver", captures: { e_settle: $.data.error_id } }
            - { call: "POST /credit-claims/${claim_id}/settle", as: BenefitsController, as_user_id: "ctrl-settler" }
            - { call: "GET /credit-claims/${claim_id}/refund-entries", as: BenefitsController }
          assert:
            - "e_rule == ERR_SEGREGATION_OF_DUTIES with HTTP 409 and BudgetRule.${rule2_id}.status stays DRAFT"
            - "the ctrl-approver activation is 200, so the refusal was identity-based: BudgetRule.${rule2_id}.status becomes ACTIVE and ${rule_id} becomes SUPERSEDED"
            - "the resolve is 200 with CreditClaim.${claim_id}.status == ROUTED_EMPLOYEE_FIRST, employee_refund_cents == 0, employer_credit_cents == 1088 and resolved_by_user_id == ctrl-resolver"
            - "e_settle == ERR_SEGREGATION_OF_DUTIES with HTTP 409 and the claim is still ROUTED_EMPLOYEE_FIRST with no ledger rows written"
            - "the ctrl-settler settle is 200 with status SETTLED and Order.${ord_id}.settlement_status == PARTIALLY_REFUNDED"
            - "the ledger listing returns total_count 1 with direction EMPLOYER_CREDIT, amount_cents 1088 and reason CLAIM_SETTLEMENT"

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: all_three_occ_rules_reject_their_stale_version_and_bump_exactly_one_on_success
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.order-place-stale-period
          - concurrency_rules.claim-resolve-stale-order
          - concurrency_rules.rule-activate-stale-group
          - errors.ERR_STALE_PERIOD_VERSION
          - errors.ERR_STALE_ORDER_VERSION
          - errors.ERR_STALE_EMPLOYEE_GROUP_VERSION
        distinguishing_aspect: "Each §1.2.1 rule is exercised on its own declared write endpoint with the version its client read one step too early: 412 ERR_STALE_PERIOD_VERSION, 412 ERR_STALE_ORDER_VERSION and 412 ERR_STALE_EMPLOYEE_GROUP_VERSION; the re-read value then succeeds, and each success bumps the parent version by exactly one while each rejection bumps nothing."
        test_recipe:
          setup:
            - "Acme Corp program; Engineering group created at version 1 (captured as grp_v); rule 1 drafted by ctrl-drafter and activated by ctrl-approver, taking the group to version 2; a second rule also drafted by ctrl-drafter is still DRAFT with effective_from 2026-08-01."
            - "HQ Lobby; Thai Garden; Ada with a personal card; OPEN 2026-08 period captured at version 1 (per_v1); daily_meal_limit is 3 and two DRAFT 1000-cent orders exist for Monday 2026-08-03 at 12:00Z and 13:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 3, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 3, monthly_allocation_cents: 60000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule2_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T13:00:00Z", lines: [ { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord2_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}", captures: { ord1_v_pre: $.data.version } }
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}", captures: { e_period: $.data.error_id } }
            - { call: "GET /benefit-periods/${per_id}", as: ProgramAdmin, captures: { per_v2: $.data.version } }
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_v2}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /credit-claims", payload: { order_id: "${ord1_id}", claim_type: "MISSING_ITEM", claimed_cents: 1088, line_index: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { claim_id: $.data.id } }
            - { call: "POST /credit-claims/${claim_id}/resolve", payload: { decision: "APPROVE", expected_order_version: "${ord1_v_pre}", approved_cents: 1088, routing_basis: "EMPLOYEE_FIRST" }, as: BenefitsController, as_user_id: "ctrl-resolver", captures: { e_order: $.data.error_id } }
            - { call: "GET /orders/${ord1_id}", as: BenefitsController, captures: { ord1_v_now: $.data.version } }
            - { call: "POST /credit-claims/${claim_id}/resolve", payload: { decision: "APPROVE", expected_order_version: "${ord1_v_now}", approved_cents: 1088, routing_basis: "EMPLOYEE_FIRST" }, as: BenefitsController, as_user_id: "ctrl-resolver" }
            - { call: "POST /budget-rules/${rule2_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver", captures: { e_group: $.data.error_id } }
            - { call: "GET /employee-groups/${grp_id}", as: BenefitsController, captures: { grp_v2: $.data.version } }
            - { call: "POST /budget-rules/${rule2_id}/activate", payload: { expected_employee_group_version: "${grp_v2}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
          assert:
            - "e_period == ERR_STALE_PERIOD_VERSION with HTTP 412, because the first place already moved BenefitPeriod.${per_id}.version from 1 to 2"
            - "the retry with per_v2 succeeds and BenefitPeriod.${per_id}.version becomes 3 with reserved_cents 3574 and available_cents 46426"
            - "e_order == ERR_STALE_ORDER_VERSION with HTTP 412, because confirm and deliver each bumped Order.${ord1_id}.version after ord1_v_pre was read"
            - "the retry with ord1_v_now is 200 and CreditClaim.${claim_id}.status == ROUTED_EMPLOYEE_FIRST with employer_credit_cents 1088"
            - "e_group == ERR_STALE_EMPLOYEE_GROUP_VERSION with HTTP 412, because activating rule 1 already moved EmployeeGroup.${grp_id}.version from 1 to 2"
            - "the retry with grp_v2 is 200, EmployeeGroup.${grp_id}.version becomes 3, BudgetRule.${rule2_id}.status is ACTIVE and ${rule_id} is SUPERSEDED"
            - "none of the three 412 responses changed any version, status or money field"

      - name: admin_fee_rate_steps_down_once_month_to_date_capture_reaches_exactly_100000
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.admin_fee_assessment
          - calculations.imputed_income_accrual
          - entities.MealProgram.fields.mtd_employer_captured_cents
          - entities.Employee.fields.ytd_imputed_cents
        distinguishing_aspect: "The tier input excludes the order being priced, so a first order that captures exactly 100000 still pays the 0.05 rate (5000), and the very next order pays 0.04 on 1787 (71, not the 89 that the 0.05 rate would give); the same delivery pushes ytd_imputed_cents past 1000 and raises the W2_IMPUTED flag."
        test_recipe:
          setup:
            - "Acme Corp program with default taxable_benefit_method DE_MINIMIS_EXCLUSION; Executives rule with per_meal_cap_cents 200000, daily_meal_limit 5 and monthly_allocation_cents 500000; HQ Lobby; Thai Garden; Cleo with a personal card; OPEN 2026-08 period."
            - "Two DRAFT orders for Monday 2026-08-03 exist: a 91609-cent banquet at 12:00Z (tax 8016, delivery 0 above the 3500 free threshold, service 375 after the clamp-then-25%-discount, covered_base 100000) and a 1000-cent lunch at 13:00Z (tax 88, delivery 599, service 100, covered_base 1787)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Executives", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 200000, daily_meal_limit: 5, monthly_allocation_cents: 500000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Cleo Noether", email: "cleo@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Board Banquet", unit_price_cents: 91609, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T13:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord2_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "GET /meal-programs/${prog_id}", as: BenefitsController }
            - { call: "GET /benefit-periods/${per_id}", as: ProgramAdmin, captures: { per_v2: $.data.version } }
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_v2}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord2_id}/confirm", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /orders/${ord2_id}/deliver", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "GET /employees/${emp_id}", as: BenefitsController }
            - { call: "GET /employees/${emp_id}/imputed-income-records", payload: { tax_month: "2026-08" }, as: BenefitsController }
          assert:
            - "Order.${ord1_id}.covered_base_cents == 100000 with tax_cents 8016, delivery_fee_cents 0 and service_fee_cents 375"
            - "Order.${ord1_id}.employer_covered_cents == 100000, employee_card_cents == 0 and admin_fee_cents == 5000, because mtd_employer_captured_cents was 0 when the fee was assessed"
            - "after the first delivery MealProgram.${prog_id}.mtd_employer_captured_cents == 100000, exactly on the tier boundary"
            - "Order.${ord2_id}.employer_covered_cents == 1787 and admin_fee_cents == 71, which is round_half_up(1787 * 0.04) and not the 89 the 0.05 tier would produce"
            - "Employee.${emp_id}.ytd_imputed_cents == 98000, the sum of max(0, 100000 - 2000) and max(0, 1787 - 2000)"
            - "Employee.${emp_id}.w2_flag == W2_IMPUTED because 98000 >= 1000"
            - "the 2026-08 imputed record shows method DE_MINIMIS_EXCLUSION, gross_employer_paid_cents 101787 and taxable_cents 98000 at status ACCRUING"

      - name: corner_both_taxable_method_variants_are_exercised
        claim_type: dual_variant_calculation
        grounds:
          - calculations.imputed_income_accrual
          - entities.MealProgram.fields.taxable_benefit_method
        excluded_because:
          difficulty_instance: imputed_taxable_method_pinned_per_record_diverges_by_2000
          rationale: "That §1.8 instance runs the same delivery under DE_MINIMIS_EXCLUSION and FULL_INCLUSION and pins the exact 2000-cent delta, which is the dual-variant claim plus the pinning moment."

      - name: corner_one_write_fans_out_through_the_whole_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Order.PLACED_to_CONFIRMED
          - state_machines.Order.CONFIRMED_to_DELIVERED
        excluded_because:
          difficulty_instance: deliver_cascades_period_program_imputed_record_and_flips_employee_flag
          rationale: "The §1.8 instance verifies the four-level cascade of a single deliver end-to-end, including the ordering sensitivity between the imputed accrual and the employee flag."

      - name: corner_derived_totals_are_recomputed_when_their_source_changes
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Employee.fields.ytd_imputed_cents
          - entities.ImputedIncomeRecord.fields.taxable_cents
        excluded_because:
          difficulty_instance: refund_pulls_ytd_imputed_back_below_threshold_and_restores_flag_to_none
          rationale: "That §1.8 instance mutates the source rows with a refund and asserts the derived total and its threshold flag are re-derived downward rather than latched, which is the strongest form of the reconciliation claim."

