      - name: retailer_display_closed_interval_with_changeover_buffer
        resource_entity: Retailer
        interval_semantics: "closed [display_from, display_until] on the (retailer_id, label_grant_id, channel) triple; the requested interval is widened BACKWARDS by CHANGEOVER_BUFFER_DAYS = 7 and both the buffer and both endpoints are inclusive; capacity is effectively 1 per triple"
        grounds:
          - validations.priority_67_ERR_DISPLAY_WINDOW_CONFLICT
          - validations.priority_66_ERR_DISPLAY_WINDOW_OUTSIDE_VALIDITY
          - entities.RetailerDisplayAuthorization.fields.channel
          - calculations.retailer_participation_tier
        distinguishing_aspect: |
          Opposite interval semantics to the lab case: intervals are CLOSED and the exclusion zone is
          asymmetric — the requested window is widened backwards by 7 inclusive days, so a window
          starting exactly 7 days after the previous window's display_until still conflicts while one
          second later is accepted. The overlap key also includes the channel, so the same instants on
