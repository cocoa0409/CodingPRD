# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Film/TV Production Scheduling — task_0143
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty Rules.
# Every grounds[] ref resolves into SCAFFOLD.yaml; every setup_api_calls/trigger
# chain is executable from empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assignment_estimate_vs_actual_diverges
        grounds:
          - calculations.estimated_assignment_cost
          - calculations.actual_assignment_cost
          - entities.Assignment.fields.estimated_cost_cents
          - entities.Assignment.fields.paid_cost_cents
          - state_machines.Assignment.UNPAID_to_APPROVED
        distinguishing_aspect: >
          On the Assignment domain, the booking-time forward estimate (251000:
          base 200000 + SAG fringe 51000, no penalties/hours) and the approval-time
          actual (278500: base 200000 + OT 25000 + meal 2500 + fringe 51000) are
          produced by two different algorithms and differ by 27500.
        test_recipe:
          setup:
            - "ACTIVE production with budget 1000000 cents and a SAG_AFTRA fringe (1800 bps, flat 15000)."
            - "One SAG crew member, daily_rate 200000, union SAG_AFTRA."
            - "One IN_PROGRESS shooting day with the crew booked, checked in, and checked out at 13.0 hours with 1 meal break."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature A", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "FRINGES", estimated_cents: 200000 }
              as: LineProducer
            - call: "POST /union-fringes"
              payload: { production_id: "${prod_id}", union_code: "SAG_AFTRA", fringe_rate_bps: 1800, pension_health_flat_cents: 15000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead Actor", role_title: "Lead", daily_rate_cents: 200000, is_sag_aftra: true, union_code: "SAG_AFTRA" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-07-01", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-07-01T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { asg_id: $.data.id, est_cost: $.data.estimated_cost_cents }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-07-01T06:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg_id}/check-in"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg_id}/check-out"
              payload: { wrap_time: "2026-07-01T19:00:00.000Z", meal_breaks_taken: 1 }
              as: FirstAD
              captures: { meal_pen: $.data.meal_penalty_cents, fringe: $.data.fringe_cents }
          trigger:
            - call: "POST /assignments/${asg_id}/approve-pay"
              payload: {}
              as: PayrollCoordinator
              captures: { paid: $.data.paid_cost_cents }
          assert:
            - "Assignment.${asg_id}.estimated_cost_cents == 251000"
            - "Assignment.${asg_id}.paid_cost_cents == 278500"
            - "Assignment.${asg_id}.estimated_cost_cents != Assignment.${asg_id}.paid_cost_cents"

      - name: residual_marginal_vs_naive_flat_rate
        grounds:
          - calculations.residual_accrual
          - entities.ResidualEvent.fields.residual_amount_cents
          - entities.Production.fields.residual_reserve_cents
        distinguishing_aspect: >
          On the Production/ResidualEvent domain, the second event's residual under
          the cumulative-marginal tier schedule is 600000 (it straddles the
          tier1->tier2 boundary), whereas a naive per-event flat tier1 rate would
          yield 480000 — a 120000 divergence on a different entity than the Assignment calc.
        test_recipe:
          setup:
            - "A production (any status) with two ResidualEvents: event1 gross 80,000,000 then event2 gross 40,000,000."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature R", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /residual-events"
              payload: { production_id: "${prod_id}", market: "THEATRICAL", gross_receipts_cents: 80000000, event_date: "2026-01-31" }
              as: PayrollCoordinator
              captures: { ev1_id: $.data.id, res1: $.data.residual_amount_cents }
          trigger:
            - call: "POST /residual-events"
              payload: { production_id: "${prod_id}", market: "SVOD", gross_receipts_cents: 40000000, event_date: "2026-02-28" }
              as: PayrollCoordinator
              captures: { ev2_id: $.data.id, res2: $.data.residual_amount_cents }
          assert:
            - "ResidualEvent.${ev1_id}.residual_amount_cents == 960000"
            - "ResidualEvent.${ev2_id}.residual_amount_cents == 600000"
            - "Production.${prod_id}.residual_reserve_cents == 1560000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: actual_cost_nonlinear_multi_input
        grounds:
          - calculations.actual_assignment_cost
          - calculations.meal_penalty
          - calculations.turnaround_penalty
          - entities.Assignment.fields.paid_cost_cents
        distinguishing_aspect: >
          Mode (a): actual_assignment_cost combines >=3 inputs with non-linear
          interaction — base 200000 + overtime 25000 (max(0,13-12)*1.5*hourly) +
          meal 6000 (2 missed) + turnaround 200000 (breach) + fringe 51000 = 482000,
          not a simple sum of base+fringe.
        test_recipe:
          setup:
            - "ACTIVE production, SAG fringe (1800 bps, flat 15000), budget 1000000."
            - "One SAG crew (rate 200000) wraps an earlier day at 23:00, then is booked next day at 06:00 (7h rest, < 10h turnaround)."
            - "Second day checked out at 13.0 hours with 0 meal breaks (2 missed meals)."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature C", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 800000 }
              as: LineProducer
            - call: "POST /union-fringes"
              payload: { production_id: "${prod_id}", union_code: "SAG_AFTRA", fringe_rate_bps: 1800, pension_health_flat_cents: 15000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 200000, is_sag_aftra: true, union_code: "SAG_AFTRA" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-07-01", day_number: 1 }
              as: FirstAD
              captures: { day1_id: $.data.id, day1_v: $.data.version }
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-07-02", day_number: 2 }
              as: FirstAD
              captures: { day2_id: $.data.id, day2_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day1_id}", crew_member_id: "${crew_id}", call_time: "2026-07-01T13:00:00.000Z", expected_shooting_day_version: "${day1_v}" }
              as: FirstAD
              captures: { asg1_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day1_id}", general_call_time: "2026-07-01T13:00:00.000Z" }
              as: FirstAD
              captures: { cs1_id: $.data.id }
            - call: "POST /call-sheets/${cs1_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day1_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg1_id}/check-in"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg1_id}/check-out"
              payload: { wrap_time: "2026-07-01T23:00:00.000Z", meal_breaks_taken: 2 }
              as: FirstAD
            - call: "POST /shooting-days/${day1_id}/wrap"
              payload: {}
              as: FirstAD
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day2_id}", crew_member_id: "${crew_id}", call_time: "2026-07-02T06:00:00.000Z", expected_shooting_day_version: "${day2_v}" }
              as: FirstAD
              captures: { asg2_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day2_id}", general_call_time: "2026-07-02T06:00:00.000Z" }
              as: FirstAD
              captures: { cs2_id: $.data.id }
            - call: "POST /call-sheets/${cs2_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day2_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg2_id}/check-in"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg2_id}/check-out"
              payload: { wrap_time: "2026-07-02T19:00:00.000Z", meal_breaks_taken: 0 }
              as: FirstAD
              captures: { meal2: $.data.meal_penalty_cents, turn2: $.data.turnaround_penalty_cents }
          trigger:
            - call: "POST /assignments/${asg2_id}/approve-pay"
              payload: {}
              as: PayrollCoordinator
              captures: { paid2: $.data.paid_cost_cents }
          assert:
            - "Assignment.${asg2_id}.meal_penalty_cents == 6000"
            - "Assignment.${asg2_id}.turnaround_penalty_cents == 200000"
            - "Assignment.${asg2_id}.paid_cost_cents == 482000"

      - name: union_fringe_round_then_add_order
        grounds:
          - calculations.union_fringe_accrual
          - entities.Assignment.fields.fringe_cents
          - entities.UnionFringe.fields.fringe_rate_bps
          - entities.UnionFringe.fields.pension_health_flat_cents
        distinguishing_aspect: >
          Mode (b): nested rounding order is pinned to round-the-percentage-term-
          then-add-the-flat-term. For an IATSE rate of 100000 at 1200 bps + flat
          8000, the percentage term rounds to 12000 and the fringe is 20000; an
          add-then-round ordering on different inputs would diverge — the scaffold pins one order.
        test_recipe:
          setup:
            - "ACTIVE production with an IATSE fringe (1200 bps, flat 8000)."
            - "One IATSE crew (rate 100000) booked, checked in, and checked out at 8.0 hours."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature F", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /union-fringes"
              payload: { production_id: "${prod_id}", union_code: "IATSE", fringe_rate_bps: 1200, pension_health_flat_cents: 8000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Gaffer", role_title: "Gaffer", daily_rate_cents: 100000, is_sag_aftra: false, union_code: "IATSE" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-07-05", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-07-05T08:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { asg_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-07-05T08:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg_id}/check-in"
              payload: {}
              as: FirstAD
          trigger:
            - call: "POST /assignments/${asg_id}/check-out"
              payload: { wrap_time: "2026-07-05T16:00:00.000Z", meal_breaks_taken: 2 }
              as: FirstAD
              captures: { fringe: $.data.fringe_cents }
          assert:
            - "Assignment.${asg_id}.fringe_cents == 20000"
            - "Assignment.${asg_id}.meal_penalty_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_parallel_attendance_and_payment
        grounds:
          - state_machines.Assignment.SCHEDULED_to_CHECKED_IN
          - state_machines.Assignment.CHECKED_IN_to_WRAPPED
          - state_machines.Assignment.UNPAID_to_APPROVED
          - entities.Assignment.fields.attendance_status
          - entities.Assignment.fields.payment_status
        distinguishing_aspect: >
          Assignment carries two independent state dimensions: attendance_status
          advances SCHEDULED->CHECKED_IN->WRAPPED via FirstAD while payment_status
          stays UNPAID, and only then does payment_status advance UNPAID->APPROVED
          via PayrollCoordinator — the two axes evolve on the same row independently.
        test_recipe:
          setup:
            - "ACTIVE production, SAG fringe, one SAG crew booked on an IN_PROGRESS day."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /union-fringes"
              payload: { production_id: "${prod_id}", union_code: "SAG_AFTRA", fringe_rate_bps: 1800, pension_health_flat_cents: 15000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 200000, is_sag_aftra: true, union_code: "SAG_AFTRA" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-07-10", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-07-10T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { asg_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-07-10T06:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day_id}/start"
              payload: {}
              as: FirstAD
          trigger:
            - call: "POST /assignments/${asg_id}/check-in"
              payload: {}
              as: FirstAD
              captures: { att1: $.data.attendance_status, pay1: $.data.payment_status }
            - call: "POST /assignments/${asg_id}/check-out"
              payload: { wrap_time: "2026-07-10T18:00:00.000Z", meal_breaks_taken: 1 }
              as: FirstAD
              captures: { att2: $.data.attendance_status, pay2: $.data.payment_status }
            - call: "POST /assignments/${asg_id}/approve-pay"
              payload: {}
              as: PayrollCoordinator
              captures: { att3: $.data.attendance_status, pay3: $.data.payment_status }
          assert:
            - "after check-in: Assignment.${asg_id}.attendance_status == CHECKED_IN and payment_status == UNPAID"
            - "after check-out: Assignment.${asg_id}.attendance_status == WRAPPED and payment_status == UNPAID"
            - "after approve-pay: Assignment.${asg_id}.attendance_status == WRAPPED and payment_status == APPROVED"

      - name: callsheet_publish_revise_cycle
        grounds:
          - state_machines.CallSheet.DRAFT_to_PUBLISHED
          - state_machines.CallSheet.PUBLISHED_to_REVISED
          - state_machines.CallSheet.REVISED_to_PUBLISHED
          - entities.CallSheet.fields.revision_number
        distinguishing_aspect: >
          On the CallSheet entity (distinct from Assignment), the machine is cyclic:
          PUBLISHED->REVISED->PUBLISHED can repeat, incrementing revision_number each
          revise; after two revise+republish cycles revision_number is 2.
        test_recipe:
          setup:
            - "ACTIVE production with one shooting day that has an assignment and a DRAFT call sheet."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature CS", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Grip", role_title: "Grip", daily_rate_cents: 100000, is_sag_aftra: false, union_code: "NONE" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-07-12", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-07-12T07:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-07-12T07:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
          trigger:
            - call: "POST /call-sheets/${cs_id}/revise"
              payload: {}
              as: FirstAD
              captures: { rev1: $.data.revision_number, st1: $.data.status }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
              captures: { st2: $.data.status }
            - call: "POST /call-sheets/${cs_id}/revise"
              payload: {}
              as: FirstAD
              captures: { rev2: $.data.revision_number }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
              captures: { st3: $.data.status }
          assert:
            - "after first revise: CallSheet.${cs_id}.status == REVISED and revision_number == 1"
            - "after re-publish: CallSheet.${cs_id}.status == PUBLISHED"
            - "after second revise: CallSheet.${cs_id}.revision_number == 2"
            - "final CallSheet.${cs_id}.status == PUBLISHED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: markpaid_cascades_production_then_budget_lines
        grounds:
          - state_machines.Assignment.APPROVED_to_PAID
          - entities.Production.fields.actual_cost_cents
          - entities.BudgetLine.fields.actual_cents
          - entities.BudgetLine.fields.variance_cents
          - calculations.production_budget_variance
        distinguishing_aspect: >
          Depth-3 chain from mark-paid: Assignment payment APPROVED->PAID mutates
          Production.actual_cost_cents (+278500); that production change drives the
          BELOW_THE_LINE_LABOR BudgetLine.actual_cents (+227500 = paid-fringe) and
          FRINGES BudgetLine.actual_cents (+51000); each BudgetLine change in turn
          recomputes its variance_cents — three caused hops.
        test_recipe:
          setup:
            - "ACTIVE production budget 1000000, SAG fringe (1800 bps, flat 15000)."
            - "BELOW_THE_LINE_LABOR line estimated 500000, FRINGES line estimated 100000."
            - "SAG crew (rate 200000) wrapped at 13.0h / 1 meal, payment APPROVED (paid_cost 278500, fringe 51000)."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Feature CASC", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
              captures: { btl_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "FRINGES", estimated_cents: 100000 }
              as: LineProducer
              captures: { fr_id: $.data.id }
            - call: "POST /union-fringes"
              payload: { production_id: "${prod_id}", union_code: "SAG_AFTRA", fringe_rate_bps: 1800, pension_health_flat_cents: 15000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 200000, is_sag_aftra: true, union_code: "SAG_AFTRA" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-07-15", day_number: 1 }
              as: FirstAD
