  # ========================================================== Table 6: errors
  - section: errors
    instances:
      - name: every_path_id_miss_raises_its_own_entity_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SAMPLE_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_SHOT_ITEM_NOT_FOUND]
          - errors[ERR_ASSET_NOT_FOUND]
          - errors[ERR_RETOUCH_TASK_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "Five reads against a well-formed but unknown id must each return 404 with the code of their own entity - a single generic ERR_REFERENCE_NOT_FOUND for path ids would fail this."
        test_recipe:
          setup:
            - "Empty database beyond the clock; no sample, booking, item, asset or task exists."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "GET /studio/samples/00000000-0000-4000-8000-0000000000a1"
              as: StudioAdmin
            - call: "GET /studio/talent-bookings/00000000-0000-4000-8000-0000000000a2"
              as: StudioAdmin
            - call: "GET /studio/shot-list-items/00000000-0000-4000-8000-0000000000a3"
              as: StudioAdmin
            - call: "GET /studio/assets/00000000-0000-4000-8000-0000000000a4"
              as: StudioAdmin
            - call: "GET /studio/retouch-tasks/00000000-0000-4000-8000-0000000000a5"
              as: StudioAdmin
          assert:
            - "first call: status == 404 and error_id == \"ERR_SAMPLE_NOT_FOUND\""
            - "second call: status == 404 and error_id == \"ERR_BOOKING_NOT_FOUND\""
            - "third call: status == 404 and error_id == \"ERR_SHOT_ITEM_NOT_FOUND\""
            - "fourth call: status == 404 and error_id == \"ERR_ASSET_NOT_FOUND\""
            - "fifth call: status == 404 and error_id == \"ERR_RETOUCH_TASK_NOT_FOUND\""

      - name: uniqueness_collisions_split_between_the_code_and_style_number_errors
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_CODE]
          - errors[ERR_DUPLICATE_STYLE_NUMBER]
          - validations[priority=34]
          - validations[priority=35]
        distinguishing_aspect: "vendor_code, AssetProfile.category and Sample.barcode collisions all raise ERR_DUPLICATE_CODE, while a repeated style_number raises the dedicated ERR_DUPLICATE_STYLE_NUMBER - two different 409 codes off one uniqueness family."
        test_recipe:
          setup:
            - "Vendor NRTH, AssetProfile APPAREL_TOP, style TOP1001 and sample SMP-1001 already exist."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
