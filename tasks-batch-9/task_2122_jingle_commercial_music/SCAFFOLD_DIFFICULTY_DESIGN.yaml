        grounds:
          - validations[priority=65]
          - errors[ERR_MUSICIAN_TURNAROUND_CONFLICT]
          - entities.MusicianBooking.fields.musician_id
          - entities.Musician.fields.full_name
        distinguishing_aspect: |
          A different resource entity, Musician, with different interval geometry:
          the occupied interval is inflated by a closed 60-minute buffer on both
          sides, so a gap of exactly 60 minutes is accepted while a gap of 30
          minutes is rejected with ERR_MUSICIAN_TURNAROUND_CONFLICT — a rule that
          would not fire at all under the room's zero-buffer half-open arithmetic.
