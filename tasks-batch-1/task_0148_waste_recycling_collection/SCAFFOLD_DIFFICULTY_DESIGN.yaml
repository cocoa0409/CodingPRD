            - call: "POST /routes/${troute_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${tpk_id}/complete"
              payload: { expected_cart_version: "${tcart_v}" }
              as: Driver
            - call: "POST /pickups/${tpk_id}/weight-ticket"
              payload: { gross_weight_lbs: 250, diverted: false }
              as: Driver
            - call: "POST /routes"
              payload: { service_date: "2026-05-16T00:00:00Z", stream: "RECYCLE", assigned_driver_id: "drv-8" }
              as: Dispatcher
              captures: { rroute_id: $.data.id }
            - call: "POST /routes/${rroute_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { rstop_id: $.data.id }
            - call: "POST /stops/${rstop_id}/pickups"
              payload: { cart_id: "${rcart_id}" }
              as: Dispatcher
              captures: { rpk_id: $.data.id }
            - call: "POST /routes/${rroute_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${rroute_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${rpk_id}/complete"
              payload: { expected_cart_version: "${rcart_v}" }
              as: Driver
            - call: "POST /pickups/${rpk_id}/weight-ticket"
              payload: { gross_weight_lbs: 250, diverted: true }
              as: Driver
            - call: "POST /accounts/${acct_id}/diversion-periods"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: Billing
              captures: { dp_id: $.data.id }
            - call: "POST /diversion-periods/${dp_id}/finalize"
