  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: patron_slot_windows_overlap_rejected_half_open
        grounds:
          - validations[priority=12]
          - entities.TimedEntrySlot.fields.starts_at
          - entities.TimedEntrySlot.fields.ends_at
        distinguishing_aspect: |
          Interval semantics: half-open [starts_at, ends_at) on the patron's own slot timeline; a
          second order whose slot window strictly overlaps an existing CONFIRMED order's window is
          rejected with ERR_SLOT_OVERLAP, while exactly-adjacent windows (end==start) are allowed.
        test_recipe:
          setup:
            - "Patron P; slot A 10:00..12:00Z CONFIRMED order; slot B 11:00..13:00Z (overlaps A)."
            - "DRAFT order O2 on slot B for same patron P."
