              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_d18: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_d18}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d18}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d18}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d18}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d18}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-H001", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/shift-windows"
              payload: { establishment_id: "${est_id}", start_utc: "2026-09-02T06:00:00Z", end_utc: "2026-09-02T14:00:00Z", shift_type: "SLAUGHTER", planned_line_count: 1 }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { sw_id: $.data.id, sw_v1: $.data.version }
            - call: "POST /inspection/shift-windows/${sw_id}/assignments"
              payload: { inspector_id: "${insp_id}", line_index: 1, start_utc: "2026-09-02T06:00:00Z", end_utc: "2026-09-02T10:00:00Z", expected_shift_window_version: "${sw_v1}" }
              as: ProgramAdministrator
              captures: { a1: $.data.id }
            - call: "POST /inspection/shift-assignments/${a1}/confirm"
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection/shift-windows/${sw_id}/verify-coverage"
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection/shift-windows/${sw_id}"
              as: ProgramAdministrator
              captures: { gap_p_base: $.data.provisional_gap_minutes, gap_f_base: $.data.final_gap_minutes, sw_v2: $.data.version }
          trigger:
            - call: "POST /inspection/shift-windows/${sw_id}/assignments"
              payload: { inspector_id: "${insp_id}", line_index: 1, start_utc: "2026-09-02T10:00:00Z", end_utc: "2026-09-02T14:00:00Z", expected_shift_window_version: "${sw_v2}" }
              as: ProgramAdministrator
              captures: { a2: $.data.id }
            - call: "POST /inspection/shift-assignments/${a2}/cancel"
              as: ProgramAdministrator
            - call: "POST /inspection/shift-windows/${sw_id}/verify-coverage"
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection/shift-windows/${sw_id}"
              as: ProgramAdministrator
              captures: { gap_p_after: $.data.provisional_gap_minutes, gap_f_after: $.data.final_gap_minutes, w_status: $.data.status }
          assert:
            - "captured gap_p_base == 240 and gap_f_base == 240 (baseline before the create)"
            - "captured gap_p_after == 240 and gap_f_after == 240 (create+cancel pair conserves both gap variants)"
            - "ShiftAssignment.${a2}.status == CANCELLED (compensating action recorded)"
            - "captured w_status == COVERAGE_GAP_FLAGGED (state returned to the pre-create status, not silently advanced)"

      - name: nr_issue_then_vacate_conserves_open_count
        grounds:
          - state_machines.NoncomplianceRecord.APPEALED_to_VACATED
          - entities.Establishment.fields.open_nr_count
          - state_machines.Appeal.FILED_to_VACATED
        distinguishing_aspect: "Conserved quantity = Establishment.open_nr_count (a count, not minutes): issue(+1) then appeal-VACATE(-1) returns the count to its baseline 0 and the NR drops out of every derived metric; sibling invariant conserves interval minutes."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Establishment granted with zero NRs (baseline open_nr_count == 0 captured). Inspector A issues; reviewer B decides."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/establishments"
              payload: { name: "D19 Swine Plant", species_classes: ["SWINE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-I001", species_qualifications: ["SWINE"] }
              as: ProgramAdministrator
              captures: { insp_a: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Sue Supervisor", badge_number: "B-I002", species_qualifications: ["SWINE"] }
              as: ProgramAdministrator
              captures: { insp_b: $.data.id }
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
              captures: { open_base: $.data.open_nr_count }
          trigger:
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_a}", regulation_family: "SANITATION", description: "floor pooling in cooler", observed_at: "2026-09-01T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { nr1: $.data.id }
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
              captures: { open_mid: $.data.open_nr_count }
            - call: "POST /inspection/appeals"
              payload: { noncompliance_record_id: "${nr1}", grounds: "grounds-text-vac" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ap1: $.data.id }
            - call: "POST /inspection/appeals/${ap1}/decide"
              payload: { outcome: "VACATE" }
              as: SupervisoryReviewer
              as_user_id: "${insp_b}"
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
              captures: { open_after: $.data.open_nr_count, life_after: $.data.lifetime_risk_score }
          assert:
            - "captured open_base == 0"
            - "captured open_mid == 1 (issuance raised the conserved quantity)"
            - "captured open_after == 0 (vacate compensated exactly)"
            - "captured life_after == 0 (VACATED NRs are excluded from lifetime risk as well)"
            - "NoncomplianceRecord.${nr1}.status == VACATED"
