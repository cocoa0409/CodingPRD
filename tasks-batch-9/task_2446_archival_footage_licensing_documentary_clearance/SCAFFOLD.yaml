# =============================================================================
# task_2446 — Archival Footage Licensing & Documentary Clearance
# Seed tables §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2446. Archival Footage Licensing & Documentary Clearance (documentary production company): footage identification with archive research, source availability and rights holder identification, license negotiation by media, term, territory and duration with rate cards and most favored nations issues, music clearance across master and publishing rights with festival versus all-media windows, fair use analysis for unlicensed material with legal opinion letters supporting the assessment, subject releases, life rights and depiction agreements with negotiated approvals, errors and omissions insurance application with the clearance chart and legal review, cue sheet and rights chart maintenance for delivery to distributors, expiring license tracking with renewal or replacement before rights lapse

domain_name: archival-clearance
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Peer top-level collections joined by explicit FK fields. Asset↔Archive is
  # many-to-many through SourceCandidate and again through License; a single
  # Asset carries multiple rights legs held by different Archives, and a single
  # Archive supplies many Assets across many Productions. No URL nesting is
  # used for identity — every entity is addressed at its own top-level path.

  state_machine_shape: cyclic
  # License negotiation rounds cycle QUOTED→COUNTERED→QUOTED; SubjectRelease
  # cycles SENT→REVISION_REQUESTED→SENT; License cycles ACTIVE→EXPIRING→ACTIVE
  # through renewal; EOApplication cycles BOUND→REMEDIATION_REQUIRED→BOUND.
  # Asset additionally carries two independent state dimensions
  # (licensing_status × depiction_status) and EOApplication a fork-join over
  # two review dimensions.

  relationship_patterns:
    - one_to_many        # Production→Asset, License→NegotiationRound, FairUseAnalysis→OpinionLetter
    - many_to_many       # Asset↔Archive via SourceCandidate and via License
    - cross_aggregate    # License↔RateCard, EOApplication↔ClearanceChart↔Asset versions
    - polymorphic        # SubjectRelease attaches to a Production or to a single Asset

  role_model: segregation_of_duties
  # The LegalCounsel user who signed an ISSUED opinion letter pinned into the
  # clearance chart may not record the E&O legal review for that chart.

  consistency_model: immediate

difficulty_level: expert_plus
# 13 entities / 47 endpoints / 39 error codes / 9 calculations / 11 state
# machines. Density, not volume, carries the difficulty: the MFN benchmark makes
# an already-executed sibling license's fee move retroactively, the E&O premium
# pins a per-asset-then-sum rounding order that differs by one cent from the
# naive order, and a single sweep call propagates five hops across five entities.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Documentary title" }
      - { name: delivery_deadline_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the distributor delivery is contractually due" }
      - { name: festival_premiere_date, type: string, source: input, default: null, description: "ISO date of festival premiere; null when the film has no festival window" }
      - { name: eo_carrier_name, type: string, source: input, default: "UNASSIGNED", description: "Errors & omissions carrier the application will be filed with" }
      - { name: status, type: enum, source: system, default: DEVELOPMENT, description: "DEVELOPMENT | CLEARANCE | LOCKED | DELIVERED | ABANDONED", constraints: "see state_machines.Production" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | BLOCKED — derived from child Asset statuses by calculations.production_clearance_posture; gates chart pinning, E&O submission and delivery validation" }
      - { name: asset_count, type: integer, source: computed, default: 0, description: "Count of Asset rows with production_id == this id (no status filter)" }
      - { name: cleared_asset_count, type: integer, source: computed, default: 0, description: "Count of Asset rows with production_id == this id AND licensing_status == CLEARED" }
      - { name: open_asset_count, type: integer, source: computed, default: 0, description: "Count of Asset rows with production_id == this id AND licensing_status IN {UNCLEARED, IN_NEGOTIATION, PARTIALLY_CLEARED, LAPSED}" }
      - { name: committed_fee_cents, type: integer, source: computed, default: 0, description: "Licence money ledger; invariant pinned in calculations.production_committed_fee_ledger" }
      - { name: sweep_epoch, type: integer, source: computed, default: 0, description: "Incremented by one on every successful POST /productions/{id}/rights-sweep" }

  - name: Archive
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rights holder / archive name" }
      - { name: holder_type, type: enum, source: input, description: "FILM_ARCHIVE | NEWS_ARCHIVE | STUDIO | RECORD_LABEL | MUSIC_PUBLISHER | INDIVIDUAL" }
      - { name: mfn_policy, type: enum, source: input, default: NONE, description: "NONE | RATE_MFN — RATE_MFN holders may demand most-favored-nations parity on a licence" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED blocks licence execution against this holder" }

  - name: RateCard
    parent: Archive
    common_fields: true
    fields:
      - { name: archive_id, type: string, source: system, description: "FK -> Archive.id; taken from the path, never from the body" }
      - { name: base_rate_per_30s_cents, type: integer, source: input, description: "List rate per 30-second billable unit, in cents" }
      - { name: minimum_fee_cents, type: integer, source: input, description: "Fee floor applied when window_class == ALL_MEDIA_WINDOW" }
      - { name: festival_minimum_fee_cents, type: integer, source: input, description: "Fee floor applied when window_class == FESTIVAL_ONLY" }
      - { name: tier1_max_seconds, type: integer, source: input, default: 30, description: "Upper bound (inclusive) of duration tier 1" }
      - { name: tier2_max_seconds, type: integer, source: input, default: 120, description: "Upper bound (inclusive) of duration tier 2" }
      - { name: tier2_rate_multiplier, type: number, source: input, default: 1.25, description: "Rate multiplier when duration_seconds falls in tier 2" }
      - { name: tier3_rate_multiplier, type: number, source: input, default: 1.60, description: "Rate multiplier when duration_seconds exceeds tier2_max_seconds" }
      - { name: media_multiplier_theatrical, type: number, source: input, default: 1.40, description: "Multiplier applied when License.media == THEATRICAL" }
      - { name: media_multiplier_broadcast, type: number, source: input, default: 1.15, description: "Multiplier applied when License.media == BROADCAST" }
      - { name: media_multiplier_streaming, type: number, source: input, default: 1.30, description: "Multiplier applied when License.media == STREAMING" }
      - { name: media_multiplier_all_media, type: number, source: input, default: 1.75, description: "Multiplier applied when License.media == ALL_MEDIA" }
      - { name: territory_multiplier_world, type: number, source: input, default: 1.50, description: "Multiplier applied when License.territory == WORLD" }
      - { name: territory_multiplier_domestic, type: number, source: input, default: 1.00, description: "Multiplier applied when License.territory == DOMESTIC" }
      - { name: term_multiplier_per_year, type: number, source: input, default: 0.20, description: "Additive uplift per licence year beyond the first" }
      - { name: festival_window_multiplier, type: number, source: input, default: 0.35, description: "Window multiplier when window_class == FESTIVAL_ONLY" }
      - { name: all_media_window_multiplier, type: number, source: input, default: 1.00, description: "Window multiplier when window_class == ALL_MEDIA_WINDOW" }
      - { name: effective_from_date, type: string, source: input, description: "ISO date this card takes effect" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED — at most one ACTIVE card per Archive (see state_machines.RateCard)" }

  - name: Asset
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; taken from the path, never from the body" }
      - { name: asset_type, type: enum, source: input, description: "ARCHIVAL_FOOTAGE | MUSIC — MUSIC requires two rights legs (MASTER and PUBLISHING), ARCHIVAL_FOOTAGE requires one (FOOTAGE)" }
      - { name: title, type: string, source: input, description: "Shot or cue title as it appears on the cue sheet" }
      - { name: timecode_in_seconds, type: integer, source: input, description: "Cut-in point in whole seconds; >= 0" }
      - { name: timecode_out_seconds, type: integer, source: input, description: "Cut-out point in whole seconds; must exceed timecode_in_seconds" }
      - { name: duration_seconds, type: integer, source: computed, description: "= timecode_out_seconds - timecode_in_seconds" }
      - { name: usage_purpose, type: enum, source: input, description: "CRITICAL_COMMENTARY | ILLUSTRATIVE_BACKGROUND — selects the fair-use weighting variant" }
      - { name: depiction_subject_key, type: string, source: input, default: null, description: "Stable key for the identifiable person depicted; null when nobody is identifiable" }
      - { name: pd_attestation_reference, type: string, source: input, default: null, description: "Public-domain attestation document reference; non-null asserts the PUBLIC_DOMAIN route" }
      - { name: selected_source_candidate_id, type: string, source: computed, default: null, description: "FK -> SourceCandidate.id; null until POST /assets/{id}/select-source runs" }
      - { name: rights_basis, type: enum, source: computed, default: UNDETERMINED, description: "UNDETERMINED | LICENSED | FAIR_USE | PUBLIC_DOMAIN — precedence pinned in calculations.asset_clearance_rollup step 1" }
      - { name: licensing_status, type: enum, source: computed, default: UNCLEARED, description: "Dimension A of the parallel Asset machine: UNCLEARED | IN_NEGOTIATION | PARTIALLY_CLEARED | CLEARED | LAPSED" }
      - { name: depiction_status, type: enum, source: computed, default: NOT_REQUIRED, description: "Dimension B of the parallel Asset machine: NOT_REQUIRED | PENDING | OBTAINED | BLOCKED" }
      - { name: lapse_count, type: integer, source: computed, default: 0, description: "Incremented by one each time licensing_status leaves CLEARED because coverage was lost" }

  - name: SourceCandidate
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; taken from the path, never from the body" }
      - { name: archive_id, type: string, source: input, description: "FK -> Archive.id; the holder that claims to control this element" }
      - { name: availability_status, type: enum, source: input, description: "AVAILABLE | ELEMENT_MISSING | RIGHTS_UNCLEAR | WITHDRAWN — only AVAILABLE candidates are selectable" }
      - { name: quoted_rate_per_30s_cents, type: integer, source: input, description: "Research-stage verbal quote per 30s unit, in cents; the selection ranking key" }
      - { name: provenance_confidence, type: integer, source: input, description: "Archivist confidence in chain of title, integer 0..100" }
      - { name: selection_status, type: enum, source: system, default: NOT_SELECTED, description: "NOT_SELECTED | SELECTED | REJECTED — select-source promotes one and rejects the rest" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; MUST equal the referenced Asset's production_id (validations priority 17)" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; the footage shot or music cue being licensed" }
      - { name: archive_id, type: string, source: input, description: "FK -> Archive.id; the rights holder being licensed. For a FOOTAGE leg it MUST equal the archive_id of the Asset's SELECTED SourceCandidate (validations priority 13)" }
      - { name: rate_card_id, type: string, source: computed, description: "FK -> RateCard.id; the archive's single ACTIVE RateCard at creation time" }
      - { name: rights_leg, type: enum, source: input, description: "FOOTAGE | MASTER | PUBLISHING — FOOTAGE only for ARCHIVAL_FOOTAGE assets, MASTER/PUBLISHING only for MUSIC assets" }
      - { name: media, type: enum, source: input, description: "THEATRICAL | BROADCAST | STREAMING | ALL_MEDIA" }
      - { name: territory, type: enum, source: input, description: "WORLD | DOMESTIC" }
      - { name: window_class, type: enum, source: input, description: "FESTIVAL_ONLY | ALL_MEDIA_WINDOW — selects the dual-variant fee branch" }
      - { name: term_months, type: integer, source: input, description: "Licence term in whole months; >= 1" }
      - { name: term_start_date, type: string, source: input, description: "ISO date the term opens (inclusive)" }
      - { name: term_end_date, type: string, source: input, description: "ISO date the term closes (EXCLUSIVE): the term is the half-open interval [term_start_date, term_end_date). Supplied by the client and cross-checked against term_months (validations priority 37)" }
      - { name: billable_units, type: integer, source: computed, description: "= ceil(Asset.duration_seconds / 30)" }
      - { name: rate_card_fee_cents, type: integer, source: computed, description: "Output of calculations.license_rate_card_fee_cents; recomputed on renewal" }
      - { name: current_proposed_fee_cents, type: integer, source: computed, default: null, description: "proposed_fee_cents of the most recent NegotiationRound on this licence; initialised to rate_card_fee_cents at creation" }
      - { name: mfn_requested, type: boolean, source: input, default: false, description: "True when the holder demands most-favored-nations parity across sibling legs of the same Asset" }
      - { name: mfn_benchmark_fee_cents, type: integer, source: computed, default: 0, description: "Output of step 2 of calculations.mfn_adjusted_fee_cents at execution" }
      - { name: mfn_topup_cents, type: integer, source: computed, default: 0, description: "Cumulative retroactive uplift received because a sibling leg executed at a higher unit rate" }
      - { name: executed_fee_cents, type: integer, source: computed, default: null, description: "Binding fee once the licence reaches EXECUTED; the quantity the Production ledger sums" }
      - { name: round_count, type: integer, source: computed, default: 0, description: "Count of NegotiationRound rows with license_id == this id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | QUOTED | COUNTERED | EXECUTED | ACTIVE | EXPIRING | EXPIRED | TERMINATED | LAPSED" }
      - { name: termination_reason, type: string, source: computed, default: null, description: "Free text captured on the TERMINATED transition" }

  - name: NegotiationRound
    parent: License
    common_fields: false
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; taken from the path, never from the body" }
      - { name: round_number, type: integer, source: computed, description: "= License.round_count before this round, plus one" }
      - { name: party, type: enum, source: input, description: "LICENSOR | PRODUCER — LICENSOR rounds may only be posted by the owning RightsHolderRep, PRODUCER rounds only by ClearanceSupervisor" }
      - { name: proposed_fee_cents, type: integer, source: input, description: "Fee this party puts on the table, in cents; >= 0" }
      - { name: note, type: string, source: input, default: null, description: "Deal-memo note" }
      - { name: license_status_after, type: enum, source: computed, description: "License.status immediately after this round landed" }
      - { name: license_version_after, type: integer, source: computed, description: "License.version immediately after this round landed; the value the next optimistic-concurrency call must send" }

  - name: FairUseAnalysis
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; taken from the path, never from the body" }
      - { name: transformative_score, type: integer, source: input, description: "Factor 1 favourability, integer 0..100 (higher favours fair use)" }
      - { name: nature_score, type: integer, source: input, description: "Factor 2 favourability, integer 0..100" }
      - { name: amount_used_score, type: integer, source: input, description: "Factor 3 favourability, integer 0..100" }
      - { name: market_harm_score, type: integer, source: input, description: "Factor 4 favourability, integer 0..100 (higher means LESS market harm)" }
      - { name: weighting_variant, type: enum, source: computed, description: "TRANSFORMATIVE_WEIGHTED | MARKET_HARM_WEIGHTED — chosen from Asset.usage_purpose" }
      - { name: strength_score, type: number, source: computed, description: "Output of calculations.fair_use_strength_score, 4 decimal places" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: decision_rationale, type: string, source: computed, default: null, description: "Rationale text captured on the ACCEPTED / REJECTED transition" }

  - name: OpinionLetter
    parent: FairUseAnalysis
    common_fields: true
    fields:
      - { name: fair_use_analysis_id, type: string, source: system, description: "FK -> FairUseAnalysis.id; taken from the path, never from the body" }
      - { name: counsel_firm, type: string, source: input, description: "Firm issuing the opinion" }
      - { name: letter_reference, type: string, source: input, description: "Counsel's own letter reference number" }
      - { name: risk_rating, type: enum, source: input, description: "LOW | MODERATE | HIGH" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the LegalCounsel operator that created the letter; the segregation-of-duties key" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | WITHDRAWN" }
      - { name: withdrawal_reason, type: string, source: computed, default: null, description: "Reason text captured on the WITHDRAWN transition" }

  - name: SubjectRelease
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; taken from the path, never from the body" }
      - { name: asset_id, type: string, source: input, default: null, description: "FK -> Asset.id; null when the release covers the film generally rather than one shot" }
      - { name: subject_person_key, type: string, source: input, description: "Stable key identifying the depicted person; the depiction-window conflict key" }
      - { name: release_type, type: enum, source: input, description: "SUBJECT_RELEASE | LIFE_RIGHTS | DEPICTION_AGREEMENT" }
      - { name: approval_rights, type: enum, source: input, default: NONE, description: "NONE | ROUGH_CUT_APPROVAL | FINAL_APPROVAL — non-NONE grants the subject a negotiated approval over the cut" }
      - { name: depiction_from_date, type: string, source: input, description: "ISO date, first day of the depicted period (inclusive)" }
      - { name: depiction_to_date, type: string, source: input, description: "ISO date, last day of the depicted period (inclusive); must not precede depiction_from_date" }
      - { name: revision_round_count, type: integer, source: computed, default: 0, description: "Number of times this release has entered REVISION_REQUESTED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SENT | REVISION_REQUESTED | SIGNED | REFUSED | APPROVAL_GRANTED | APPROVAL_WITHHELD" }
      - { name: cut_reference, type: string, source: computed, default: null, description: "Cut identifier recorded when the approval decision was taken" }

  - name: ClearanceChart
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; taken from the path, never from the body" }
      - { name: chart_label, type: string, source: input, description: "Human label, e.g. 'v3 pre-E&O'" }
      - { name: pinned_rows, type: array, source: computed, description: "One object per Asset of the production at pin time: { asset_id, asset_version, rights_basis, licensing_status, depiction_status, license_ids }, ordered by Asset.created_at ASC" }
      - { name: pinned_row_count, type: integer, source: computed, description: "Length of pinned_rows" }
      - { name: pinned_opinion_letter_ids, type: array, source: computed, description: "Ids of every OpinionLetter with status ISSUED backing a pinned row whose rights_basis == FAIR_USE, ordered by OpinionLetter.created_at ASC" }
      - { name: music_leg_gap_count, type: integer, source: computed, description: "Count of pinned rows whose Asset.asset_type == MUSIC and whose covered rights legs do not include both MASTER and PUBLISHING" }
      - { name: status, type: enum, source: system, default: PINNED, description: "PINNED | STALE | SUPERSEDED" }

  - name: EOApplication
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; taken from the path, never from the body" }
      - { name: clearance_chart_id, type: string, source: input, description: "FK -> ClearanceChart.id; the chart the underwriter and counsel review" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Requested per-claim coverage limit in cents; >= 100000 (validations priority 43)" }
      - { name: retention_cents, type: integer, source: input, description: "Self-insured retention in cents; >= 0 and strictly less than coverage_limit_cents" }
      - { name: premium_cents, type: integer, source: computed, default: null, description: "Output of calculations.eo_premium_cents, stamped on the SUBMITTED transition" }
      - { name: legal_review_status, type: enum, source: computed, default: PENDING, description: "Review dimension 1: PENDING | PASSED | FAILED" }
      - { name: underwriting_review_status, type: enum, source: computed, default: PENDING, description: "Review dimension 2: PENDING | PASSED | FAILED" }
      - { name: legal_reviewer_user_id, type: string, source: computed, default: null, description: "X-User-ID of the LegalCounsel operator that recorded the LEGAL review" }
      - { name: underwriting_reviewer_user_id, type: string, source: computed, default: null, description: "X-User-ID of the ClearanceSupervisor operator that recorded the UNDERWRITING review" }
      - { name: policy_number, type: string, source: computed, default: null, description: "Carrier policy number captured on the BOUND transition" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | IN_REVIEW | CLEARED_TO_BIND | BOUND | REMEDIATION_REQUIRED | DECLINED" }

  - name: DeliveryPackage
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; taken from the path, never from the body" }
      - { name: clearance_chart_id, type: string, source: input, description: "FK -> ClearanceChart.id; the chart whose rows become the delivered rights chart" }
      - { name: distributor_name, type: string, source: input, description: "Distributor receiving the cue sheet and rights chart" }
      - { name: window_class, type: enum, source: input, description: "FESTIVAL_ONLY | ALL_MEDIA_WINDOW — the window the distributor is buying" }
      - { name: cue_sheet_row_count, type: integer, source: computed, description: "Count of pinned chart rows whose Asset.asset_type == MUSIC" }
      - { name: rights_chart_row_count, type: integer, source: computed, description: "Count of pinned chart rows (all asset types)" }
      - { name: music_leg_gap_count, type: integer, source: computed, description: "Copied from the referenced ClearanceChart at validation time" }
      - { name: suspension_reason, type: string, source: computed, default: null, description: "Reason text stamped when a delivered package is suspended by a rights sweep" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | VALIDATED | DELIVERED | SUSPENDED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Production
    initial_state: DEVELOPMENT
    terminal_states: [DELIVERED, ABANDONED]
    transitions:
      - from: DEVELOPMENT
        to: CLEARANCE
        trigger: "POST /productions/{id}/state with to_status=CLEARANCE"
        actor: ProductionAdmin
        preconditions: []
        side_effects: ["recompute posture via calculations.production_clearance_posture (0 assets => OPEN)"]
      - from: CLEARANCE
        to: LOCKED
        trigger: "POST /productions/{id}/state with to_status=LOCKED"
        actor: ProductionAdmin
        preconditions:
          - "Production.posture == OPEN, else ERR_PRODUCTION_POSTURE_RESTRICTED / ERR_PRODUCTION_POSTURE_BLOCKED"
          - "At least one EOApplication with production_id == this id AND status == BOUND, else ERR_EO_NOT_BOUND"
        side_effects: []
      - from: LOCKED
        to: DELIVERED
        trigger: "POST /productions/{id}/state with to_status=DELIVERED"
        actor: ProductionAdmin
        preconditions:
          - "At least one DeliveryPackage with production_id == this id AND status == DELIVERED, else ERR_NO_DELIVERED_PACKAGE"
        side_effects: []
      - from: LOCKED
        to: CLEARANCE
        trigger: "system, during POST /productions/{id}/rights-sweep step 4, when recomputed posture != OPEN"
        actor: system
        preconditions: ["recomputed Production.posture IN {RESTRICTED, BLOCKED}"]
        side_effects: ["Production.version += 1"]
        note: "Hop 3 of the sweep cascade — caused by the posture recomputation, not directly by the sweep call."
      - from: DEVELOPMENT
        to: ABANDONED
        trigger: "POST /productions/{id}/state with to_status=ABANDONED"
        actor: ProductionAdmin
        preconditions: []
        side_effects: []
      - from: CLEARANCE
        to: ABANDONED
        trigger: "POST /productions/{id}/state with to_status=ABANDONED"
        actor: ProductionAdmin
        preconditions:
          - "No License with production_id == this id AND status IN {EXECUTED, ACTIVE, EXPIRING}, else ERR_LICENSES_STILL_LIVE"
        side_effects: []

  - entity: Archive
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /archives/{id}/state with to_status=SUSPENDED"
        actor: ProductionAdmin
        preconditions: []
        side_effects: ["Licences already EXECUTED/ACTIVE/EXPIRING are unaffected; only new executions are blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /archives/{id}/state with to_status=ACTIVE"
        actor: ProductionAdmin
        preconditions: []
        side_effects: []
        note: "Cyclic — a holder can be suspended during a chain-of-title dispute and reinstated."

  - entity: RateCard
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, during POST /archives/{id}/rate-cards, when the incoming card's effective_from_date >= this card's effective_from_date"
        actor: system
        preconditions: ["this card is the archive's only card with status == ACTIVE"]
        side_effects: ["RateCard.version += 1; the incoming card is created with status ACTIVE"]
        note: "Guarantees at most one ACTIVE RateCard per Archive, so 'the archive's rate card' is a deterministic single row. When the incoming card's effective_from_date is EARLIER than the existing ACTIVE card's, the incoming card is instead created directly in SUPERSEDED and this transition does not fire."

  - entity: Asset
    initial_state: UNCLEARED
    terminal_states: []
    note: |
      PARALLEL DIMENSIONS on one row. Dimension A is `licensing_status`
      (UNCLEARED | IN_NEGOTIATION | PARTIALLY_CLEARED | CLEARED | LAPSED),
      dimension B is `depiction_status` (NOT_REQUIRED | PENDING | OBTAINED |
      BLOCKED). The two dimensions never share a state name, advance on
      disjoint trigger sets, and are both required to be favourable before the
      Production posture reads OPEN. `initial_state` above names dimension A's
      initial state; dimension B initialises to PENDING when
      depiction_subject_key is non-null at creation and to NOT_REQUIRED
      otherwise.
    transitions:
      - from: UNCLEARED
        to: IN_NEGOTIATION
        trigger: "system, on POST /licenses (a licence for this asset now exists in DRAFT)"
        actor: system
        preconditions: ["recomputed licensing_status per calculations.asset_clearance_rollup == IN_NEGOTIATION"]
        side_effects: ["Asset.version += 1", "recompute Production.open_asset_count and Production.posture"]
        note: "Dimension A."
      - from: IN_NEGOTIATION
        to: PARTIALLY_CLEARED
        trigger: "system, on POST /licenses/{id}/state with to_status=EXECUTED for one leg of a MUSIC asset"
        actor: system
        preconditions: ["covered_legs is a non-empty strict subset of required_legs"]
        side_effects: ["Asset.version += 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension A."
      - from: PARTIALLY_CLEARED
        to: CLEARED
        trigger: "system, on POST /licenses/{id}/state with to_status=EXECUTED for the remaining leg"
        actor: system
        preconditions: ["covered_legs is a superset of required_legs"]
        side_effects: ["Asset.rights_basis = LICENSED", "Asset.version += 1", "Production.cleared_asset_count += 1 and open_asset_count -= 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension A."
      - from: IN_NEGOTIATION
        to: CLEARED
        trigger: "system, on POST /licenses/{id}/state with to_status=EXECUTED for the single FOOTAGE leg, or on POST /fair-use-analyses/{id}/state with to_status=ACCEPTED"
        actor: system
        preconditions: ["covered_legs is a superset of required_legs, OR an ACCEPTED FairUseAnalysis exists for this asset"]
        side_effects: ["Asset.rights_basis = LICENSED or FAIR_USE per calculations.asset_clearance_rollup step 1", "Asset.version += 1", "Production.cleared_asset_count += 1 and open_asset_count -= 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension A."
      - from: UNCLEARED
        to: CLEARED
        trigger: "system, on POST /fair-use-analyses/{id}/state with to_status=ACCEPTED for an asset with no licences"
        actor: system
        preconditions: ["an ACCEPTED FairUseAnalysis exists for this asset"]
        side_effects: ["Asset.rights_basis = FAIR_USE", "Asset.version += 1", "Production.cleared_asset_count += 1 and open_asset_count -= 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension A. Hop 3 of the opinion-letter cascade runs this transition in reverse."
      - from: CLEARED
        to: LAPSED
        trigger: "system, on licence expiry during POST /productions/{id}/rights-sweep, on POST /licenses/{id}/state with to_status=TERMINATED, or on FairUseAnalysis ACCEPTED->REJECTED"
        actor: system
        preconditions: ["rights_basis recomputes to UNDETERMINED AND covered_legs is empty"]
        side_effects: ["Asset.lapse_count += 1", "Asset.rights_basis = UNDETERMINED", "Asset.version += 1", "Production.cleared_asset_count -= 1 and open_asset_count += 1", "recompute Production.posture (a single LAPSED asset forces BLOCKED)", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension A. Hop 2 of the sweep cascade and hop 3 of the opinion-letter cascade."
      - from: CLEARED
        to: PARTIALLY_CLEARED
        trigger: "system, on licence expiry or termination of ONE leg of a MUSIC asset while the other leg stays live"
        actor: system
        preconditions: ["covered_legs is a non-empty strict subset of required_legs"]
        side_effects: ["Asset.lapse_count += 1", "Asset.rights_basis = UNDETERMINED", "Asset.version += 1", "Production.cleared_asset_count -= 1 and open_asset_count += 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension A."
      - from: LAPSED
        to: CLEARED
        trigger: "system, on POST /licenses/{id}/state with to_status=EXECUTED for a replacement licence"
        actor: system
        preconditions: ["covered_legs is a superset of required_legs"]
        side_effects: ["Asset.rights_basis = LICENSED", "Asset.version += 1", "Production.cleared_asset_count += 1 and open_asset_count -= 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension A. lapse_count is a historical counter and is NOT decremented."
      - from: PENDING
        to: OBTAINED
        trigger: "system, on POST /subject-releases/{id}/state with to_status=SIGNED where the release's asset_id == this asset"
        actor: system
        preconditions: ["the signing SubjectRelease references this asset"]
        side_effects: ["Asset.version += 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension B."
      - from: OBTAINED
        to: BLOCKED
        trigger: "system, on POST /subject-releases/{id}/state with to_status=APPROVAL_WITHHELD"
        actor: system
        preconditions: ["the release withholding approval references this asset"]
        side_effects: ["Asset.version += 1", "recompute Production.posture (a single BLOCKED asset forces BLOCKED)", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension B."
      - from: PENDING
        to: BLOCKED
        trigger: "system, on POST /subject-releases/{id}/state with to_status=REFUSED"
        actor: system
        preconditions: ["the refusing SubjectRelease references this asset"]
        side_effects: ["Asset.version += 1", "recompute Production.posture", "every PINNED ClearanceChart pinning this asset flips to STALE"]
        note: "Dimension B."

  - entity: License
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED, LAPSED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /licenses/{id}/negotiation-rounds with party=LICENSOR"
        actor: RightsHolderRep
        preconditions:
          - "expected_license_version == License.version, else ERR_STALE_LICENSE_VERSION"
          - "X-User-ID == License.archive_id, else ERR_ARCHIVE_OWNERSHIP_MISMATCH"
          - "License.round_count < 6, else ERR_NEGOTIATION_ROUND_LIMIT"
        side_effects: ["NegotiationRound created with round_number = round_count + 1", "License.round_count += 1", "License.current_proposed_fee_cents = proposed_fee_cents", "License.version += 1"]
      - from: QUOTED
        to: COUNTERED
        trigger: "POST /licenses/{id}/negotiation-rounds with party=PRODUCER"
        actor: ClearanceSupervisor
        preconditions:
          - "expected_license_version == License.version, else ERR_STALE_LICENSE_VERSION"
          - "License.round_count < 6, else ERR_NEGOTIATION_ROUND_LIMIT"
        side_effects: ["NegotiationRound created", "License.round_count += 1", "License.current_proposed_fee_cents = proposed_fee_cents", "License.version += 1"]
      - from: COUNTERED
        to: QUOTED
        trigger: "POST /licenses/{id}/negotiation-rounds with party=LICENSOR"
        actor: RightsHolderRep
        preconditions:
          - "expected_license_version == License.version, else ERR_STALE_LICENSE_VERSION"
          - "X-User-ID == License.archive_id, else ERR_ARCHIVE_OWNERSHIP_MISMATCH"
          - "License.round_count < 6, else ERR_NEGOTIATION_ROUND_LIMIT"
        side_effects: ["NegotiationRound created", "License.round_count += 1", "License.current_proposed_fee_cents = proposed_fee_cents", "License.version += 1"]
        note: "CYCLE — QUOTED->COUNTERED->QUOTED repeats until one side executes or the 6-round ceiling lapses the licence."
      - from: QUOTED
        to: EXECUTED
        trigger: "POST /licenses/{id}/state with to_status=EXECUTED"
        actor: ClearanceSupervisor
        preconditions:
          - "License.status == QUOTED, else ERR_LICENSE_NOT_QUOTED"
          - "Archive.status == ACTIVE for License.archive_id, else ERR_ARCHIVE_SUSPENDED"
          - "Production.status == CLEARANCE, else ERR_INVALID_STATE_TRANSITION"
          - "no term overlap per validations[priority=21], else ERR_LICENSE_TERM_OVERLAP"
        side_effects:
          - "executed_fee_cents, mfn_benchmark_fee_cents set per calculations.mfn_adjusted_fee_cents"
          - "Production.committed_fee_cents += executed_fee_cents"
          - "each MFN peer whose unit rate is now below this licence's unit rate receives mfn_topup_cents, its executed_fee_cents rises, its version increments, and Production.committed_fee_cents rises by the same top-up (peers processed created_at ASC)"
          - "recompute Asset.licensing_status / rights_basis; that recomputation drives the Asset dimension-A transition, which in turn recomputes Production posture and counters and flips PINNED charts to STALE"
          - "License.version += 1"
      - from: QUOTED
        to: LAPSED
        trigger: "POST /licenses/{id}/state with to_status=LAPSED"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["recompute Asset.licensing_status", "License.version += 1"]
      - from: COUNTERED
        to: LAPSED
        trigger: "POST /licenses/{id}/state with to_status=LAPSED"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["recompute Asset.licensing_status", "License.version += 1"]
      - from: EXECUTED
        to: ACTIVE
        trigger: "system, step 1 of POST /productions/{id}/rights-sweep"
        actor: system
        preconditions: ["License.term_start_date <= the logical clock's date"]
        side_effects: ["License.version += 1"]
      - from: ACTIVE
        to: EXPIRING
        trigger: "system, step 3 of POST /productions/{id}/rights-sweep"
        actor: system
        preconditions: ["0 <= (term_end_date - clock date) in whole days <= 60"]
        side_effects: ["License.version += 1"]
      - from: EXPIRING
        to: ACTIVE
        trigger: "POST /licenses/{id}/renew"
        actor: ClearanceSupervisor
        preconditions:
          - "0 <= (term_end_date - clock date) in whole days <= 60, else ERR_OUTSIDE_RENEWAL_WINDOW"
          - "additional_term_months >= 1, else ERR_INVALID_RENEWAL_TERM"
        side_effects: ["term_months and term_end_date extended", "rate_card_fee_cents recomputed", "executed_fee_cents += renewal_delta_cents", "Production.committed_fee_cents += renewal_delta_cents", "License.version += 1"]
        note: "CYCLE — a licence can be renewed repeatedly, oscillating ACTIVE->EXPIRING->ACTIVE."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, step 2 of POST /productions/{id}/rights-sweep"
        actor: system
        preconditions: ["the logical clock's date >= term_end_date (half-open term)"]
        side_effects: ["Production.committed_fee_cents -= executed_fee_cents", "recompute Asset.licensing_status; the resulting Asset transition drives the posture / delivery / E&O hops", "License.version += 1"]
      - from: EXPIRING
        to: EXPIRED
        trigger: "system, step 2 of POST /productions/{id}/rights-sweep"
        actor: system
        preconditions: ["the logical clock's date >= term_end_date"]
        side_effects: ["Production.committed_fee_cents -= executed_fee_cents", "recompute Asset.licensing_status", "License.version += 1"]
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /licenses/{id}/state with to_status=TERMINATED"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["termination_reason stored", "Production.committed_fee_cents -= executed_fee_cents (exact compensation, including any mfn_topup_cents this licence received)", "recompute Asset.licensing_status", "License.version += 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licenses/{id}/state with to_status=TERMINATED"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["termination_reason stored", "Production.committed_fee_cents -= executed_fee_cents", "recompute Asset.licensing_status", "License.version += 1"]
      - from: EXPIRING
        to: TERMINATED
        trigger: "POST /licenses/{id}/state with to_status=TERMINATED"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["termination_reason stored", "Production.committed_fee_cents -= executed_fee_cents", "recompute Asset.licensing_status", "License.version += 1"]

  - entity: FairUseAnalysis
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fair-use-analyses/{id}/state with to_status=SUBMITTED"
        actor: LegalCounsel
        preconditions: []
        side_effects: ["FairUseAnalysis.version += 1"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /fair-use-analyses/{id}/state with to_status=ACCEPTED"
        actor: LegalCounsel
        preconditions:
          - "strength_score >= 0.6000, else ERR_FAIR_USE_SCORE_INSUFFICIENT"
          - "at least one OpinionLetter with fair_use_analysis_id == this id AND status == ISSUED, else ERR_NO_ISSUED_OPINION_LETTER"
        side_effects: ["decision_rationale stored", "Asset.rights_basis = FAIR_USE and licensing_status recomputed to CLEARED", "Production.cleared_asset_count += 1, open_asset_count -= 1, posture recomputed", "PINNED charts pinning the asset flip to STALE", "FairUseAnalysis.version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fair-use-analyses/{id}/state with to_status=REJECTED"
        actor: LegalCounsel
        preconditions: []
        side_effects: ["decision_rationale stored", "FairUseAnalysis.version += 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /fair-use-analyses/{id}/state with to_status=DRAFT"
        actor: LegalCounsel
        preconditions: []
        side_effects: ["FairUseAnalysis.version += 1"]
        note: "CYCLE — counsel reworks the four-factor assessment and resubmits."
      - from: ACCEPTED
        to: REJECTED
        trigger: "system, on POST /opinion-letters/{id}/state with to_status=WITHDRAWN when no other ISSUED letter backs this analysis"
        actor: system
        preconditions: ["count of OpinionLetter rows for this analysis with status == ISSUED drops to 0"]
        side_effects: ["decision_rationale = 'AUTO: supporting opinion letter withdrawn'", "Asset dimension-A recomputation runs (CLEARED -> LAPSED)", "FairUseAnalysis.version += 1"]
        note: "Hop 2 of the opinion-letter cascade."

  - entity: OpinionLetter
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /opinion-letters/{id}/state with to_status=ISSUED"
        actor: LegalCounsel
        preconditions:
          - "parent FairUseAnalysis.status == SUBMITTED, else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["OpinionLetter.version += 1"]
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /opinion-letters/{id}/state with to_status=WITHDRAWN"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "withdrawal_reason stored"
          - "if this was the last ISSUED letter, parent FairUseAnalysis goes ACCEPTED -> REJECTED (hop 2)"
          - "that rejection recomputes the Asset to LAPSED (hop 3)"
          - "that lapse recomputes Production.cleared_asset_count / open_asset_count and posture (hop 4)"
          - "that posture change flips every PINNED ClearanceChart of the production to STALE (hop 5)"
          - "OpinionLetter.version += 1"

  - entity: SubjectRelease
    initial_state: DRAFT
    terminal_states: [REFUSED, APPROVAL_WITHHELD]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /subject-releases/{id}/state with to_status=SENT"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["SubjectRelease.version += 1"]
      - from: SENT
        to: SIGNED
        trigger: "POST /subject-releases/{id}/state with to_status=SIGNED"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["if asset_id is non-null the Asset dimension-B moves PENDING -> OBTAINED", "recompute Production.posture", "SubjectRelease.version += 1"]
      - from: SENT
        to: REVISION_REQUESTED
        trigger: "POST /subject-releases/{id}/state with to_status=REVISION_REQUESTED"
        actor: ClearanceSupervisor
        preconditions:
          - "revision_round_count < 3, else ERR_RELEASE_REVISION_LIMIT"
        side_effects: ["revision_round_count += 1", "SubjectRelease.version += 1"]
      - from: REVISION_REQUESTED
        to: SENT
        trigger: "POST /subject-releases/{id}/state with to_status=SENT"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["SubjectRelease.version += 1"]
        note: "CYCLE — negotiated approvals bounce between the subject's counsel and the production up to 3 revision rounds."
      - from: SENT
        to: REFUSED
        trigger: "POST /subject-releases/{id}/state with to_status=REFUSED"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["if asset_id is non-null the Asset dimension-B moves PENDING -> BLOCKED", "recompute Production.posture", "SubjectRelease.version += 1"]
      - from: SIGNED
        to: APPROVAL_GRANTED
        trigger: "POST /subject-releases/{id}/state with to_status=APPROVAL_GRANTED"
        actor: ClearanceSupervisor
        preconditions:
          - "approval_rights != NONE, else ERR_NO_APPROVAL_RIGHTS"
        side_effects: ["cut_reference stored", "SubjectRelease.version += 1"]
      - from: SIGNED
        to: APPROVAL_WITHHELD
        trigger: "POST /subject-releases/{id}/state with to_status=APPROVAL_WITHHELD"
        actor: ClearanceSupervisor
        preconditions:
          - "approval_rights != NONE, else ERR_NO_APPROVAL_RIGHTS"
        side_effects: ["cut_reference stored", "if asset_id is non-null the Asset dimension-B moves OBTAINED -> BLOCKED", "recompute Production.posture", "SubjectRelease.version += 1"]

  - entity: ClearanceChart
    initial_state: PINNED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PINNED
        to: STALE
        trigger: "system, whenever the version of any Asset named in pinned_rows advances"
        actor: system
        preconditions: ["exists a pinned row whose row.asset_version != Asset.version"]
        side_effects: ["ClearanceChart.version += 1"]
      - from: PINNED
        to: SUPERSEDED
        trigger: "system, on POST /productions/{id}/clearance-charts for the same production"
        actor: system
        preconditions: []
        side_effects: ["ClearanceChart.version += 1"]
      - from: STALE
        to: SUPERSEDED
        trigger: "system, on POST /productions/{id}/clearance-charts for the same production"
        actor: system
        preconditions: []
        side_effects: ["ClearanceChart.version += 1"]

  - entity: EOApplication
    initial_state: DRAFT
    terminal_states: [DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /eo-applications/{id}/state with to_status=SUBMITTED"
        actor: ClearanceSupervisor
        preconditions:
          - "referenced ClearanceChart.status == PINNED, else ERR_CHART_STALE / ERR_CHART_SUPERSEDED"
          - "Production.posture != BLOCKED per validations[priority=14], else ERR_PRODUCTION_POSTURE_BLOCKED (RESTRICTED is acceptable here; only VALIDATED -> DELIVERED and CLEARANCE -> LOCKED demand OPEN)"
          - "coverage_limit_cents > retention_cents, else ERR_COVERAGE_LIMIT_INVALID"
        side_effects: ["premium_cents = calculations.eo_premium_cents", "legal_review_status = PENDING and underwriting_review_status = PENDING (the fork)", "EOApplication.version += 1"]
        note: "FORK — SUBMITTED opens two independent review dimensions that are joined at CLEARED_TO_BIND."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /eo-applications/{id}/reviews (first review of either type)"
        actor: LegalCounsel | ProductionAdmin
        preconditions:
          - "the addressed review dimension is still PENDING, else ERR_REVIEW_ALREADY_RECORDED"
          - "for review_type=LEGAL: X-User-ID must differ from every issued_by_user_id in the chart's pinned_opinion_letter_ids, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["the addressed dimension becomes PASSED or FAILED", "the reviewer's X-User-ID is stored", "EOApplication.version += 1"]
      - from: IN_REVIEW
        to: CLEARED_TO_BIND
        trigger: "system, on POST /eo-applications/{id}/reviews once both dimensions are PASSED"
        actor: system
        preconditions: ["legal_review_status == PASSED AND underwriting_review_status == PASSED"]
        side_effects: ["EOApplication.version += 1"]
        note: "JOIN branch — the PASS/PASS path. Side-effect set differs from the DECLINED branch: no premium adjustment, application stays bindable."
      - from: IN_REVIEW
        to: DECLINED
        trigger: "system, on POST /eo-applications/{id}/reviews when either dimension becomes FAILED"
        actor: system
        preconditions: ["legal_review_status == FAILED OR underwriting_review_status == FAILED"]
        side_effects: ["premium_cents reset to null", "EOApplication.version += 1"]
        note: "JOIN branch — the FAIL path, with a divergent side-effect set (premium voided)."
      - from: SUBMITTED
        to: DECLINED
        trigger: "system, on POST /eo-applications/{id}/reviews when the very first review recorded is a FAIL"
        actor: system
        preconditions: ["the first review recorded has outcome == FAIL"]
        side_effects: ["premium_cents reset to null", "EOApplication.version += 1"]
        note: "The single call moves SUBMITTED -> IN_REVIEW -> DECLINED; the observable end state is DECLINED."
      - from: CLEARED_TO_BIND
        to: BOUND
        trigger: "POST /eo-applications/{id}/state with to_status=BOUND"
        actor: ProductionAdmin
        preconditions:
          - "policy_number present in the body, else ERR_INVALID_REQUEST"
          - "referenced ClearanceChart.status == PINNED, else ERR_CHART_STALE"
        side_effects: ["policy_number stored", "EOApplication.version += 1"]
      - from: BOUND
        to: REMEDIATION_REQUIRED
        trigger: "system, when a DeliveryPackage of this production moves DELIVERED -> SUSPENDED"
        actor: system
        preconditions: ["a DeliveryPackage of the same production just entered SUSPENDED"]
        side_effects: ["EOApplication.version += 1"]
        note: "Hop 5 of the sweep cascade — caused by the DeliveryPackage suspension (hop 4), not directly by the sweep call."
      - from: REMEDIATION_REQUIRED
        to: BOUND
        trigger: "POST /eo-applications/{id}/state with to_status=BOUND"
        actor: ProductionAdmin
        preconditions:
          - "Production.posture == OPEN, else ERR_PRODUCTION_POSTURE_BLOCKED"
        side_effects: ["EOApplication.version += 1"]
        note: "CYCLE — remediated coverage can be re-bound."

  - entity: DeliveryPackage
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /delivery-packages/{id}/state with to_status=VALIDATED"
        actor: ClearanceSupervisor
        preconditions:
          - "Production.posture != BLOCKED per validations[priority=14], else ERR_PRODUCTION_POSTURE_BLOCKED (a RESTRICTED production may still validate a package; it may not deliver one)"
          - "referenced ClearanceChart.status == PINNED, else ERR_CHART_STALE"
          - "chart.music_leg_gap_count == 0, else ERR_CUE_SHEET_INCOMPLETE"
          - "if window_class == ALL_MEDIA_WINDOW, every License of the production with status IN {EXECUTED, ACTIVE, EXPIRING} has window_class == ALL_MEDIA_WINDOW, else ERR_WINDOW_CLASS_INSUFFICIENT"
        side_effects: ["cue_sheet_row_count, rights_chart_row_count, music_leg_gap_count stamped from the chart", "DeliveryPackage.version += 1"]
      - from: VALIDATED
        to: DELIVERED
        trigger: "POST /delivery-packages/{id}/state with to_status=DELIVERED"
        actor: ClearanceSupervisor
        preconditions:
          - "Production.posture == OPEN per validations[priority=15], else ERR_PRODUCTION_POSTURE_RESTRICTED"
          - "referenced ClearanceChart.status == PINNED, else ERR_CHART_STALE"
          - "an EOApplication of this production with status == BOUND exists per validations[priority=28], else ERR_EO_NOT_BOUND"
        side_effects: ["DeliveryPackage.version += 1"]
      - from: DELIVERED
        to: SUSPENDED
        trigger: "system, during POST /productions/{id}/rights-sweep step 4c, or during the POST /opinion-letters/{id}/state to_status=WITHDRAWN cascade, whenever the recomputed Production.posture is BLOCKED"
        actor: system
        preconditions: ["Production.posture recomputed to BLOCKED"]
        side_effects: ["suspension_reason = 'AUTO: production posture BLOCKED at sweep epoch <n>'", "every BOUND EOApplication of the production moves to REMEDIATION_REQUIRED (hop 5)", "DeliveryPackage.version += 1"]
        note: "Hop 4 of the sweep cascade — caused by the posture change (hop 3)."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /delivery-packages/{id}/state with to_status=WITHDRAWN"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["DeliveryPackage.version += 1"]
      - from: VALIDATED
        to: WITHDRAWN
        trigger: "POST /delivery-packages/{id}/state with to_status=WITHDRAWN"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["DeliveryPackage.version += 1"]
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /delivery-packages/{id}/state with to_status=WITHDRAWN"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects: ["DeliveryPackage.version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: chart-pin-stale-production
    parent_entity: Production
    write_endpoint: "POST /productions/{id}/clearance-charts"
    occ_field: "expected_production_version"
    description: |
      Pinning a new ClearanceChart against a Production whose version has
      advanced since the client last read it is rejected. A fresh chart
      legitimately supersedes the prior PINNED chart, so the second writer's
      request would otherwise succeed on its own terms while silently
      discarding a chart the first writer just pinned; the stale-version check
      is what forces the second writer to re-read the production first.
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412

  - rule_id: negotiation-round-stale-license
    parent_entity: License
    write_endpoint: "POST /licenses/{id}/negotiation-rounds"
    occ_field: "expected_license_version"
    description: |
      Posting a negotiation round against a License whose version has advanced
      since the client last read it is rejected. Each round legitimately
      supersedes the standing proposal by overwriting
      License.current_proposed_fee_cents, so a writer working from an outdated
      view of the deal would replace a counter it never saw; the stale-version
      check makes that rejection deterministic.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: license_rate_card_fee_cents
    trigger: "POST /licenses (stamped on License.rate_card_fee_cents at creation); recomputed inside POST /licenses/{id}/renew with the extended term_months"
    algorithm: tiered_pricing
    formula: |
      # Inputs, all pinned to exact field names:
      #   d  = Asset.duration_seconds              (Asset referenced by License.asset_id)
      #   rc = the RateCard row at License.rate_card_id
      billable_units = ceil(d / 30)                       # stored on License.billable_units

      # Duration tier — INCLUSIVE upper bounds. d == rc.tier1_max_seconds stays in tier 1.
      if   d <= rc.tier1_max_seconds:  rate_multiplier = 1.00
      elif d <= rc.tier2_max_seconds:  rate_multiplier = rc.tier2_rate_multiplier
      else:                            rate_multiplier = rc.tier3_rate_multiplier

      media_multiplier = { THEATRICAL: rc.media_multiplier_theatrical,
                           BROADCAST:  rc.media_multiplier_broadcast,
                           STREAMING:  rc.media_multiplier_streaming,
                           ALL_MEDIA:  rc.media_multiplier_all_media }[License.media]

      territory_multiplier = { WORLD:    rc.territory_multiplier_world,
                               DOMESTIC: rc.territory_multiplier_domestic }[License.territory]

      # Term uplift: the first licence year is free of uplift.
      term_years  = ceil(License.term_months / 12)
      term_factor = 1 + rc.term_multiplier_per_year * max(0, term_years - 1)

      # WINDOW BRANCH — the dual-variant switch (see `variants` below).
      if License.window_class == FESTIVAL_ONLY:
          window_multiplier = rc.festival_window_multiplier
          fee_floor_cents   = rc.festival_minimum_fee_cents
      else:                                    # ALL_MEDIA_WINDOW
          window_multiplier = rc.all_media_window_multiplier
          fee_floor_cents   = rc.minimum_fee_cents

      # ROUNDING ORDER IS PINNED: multiply every factor in full precision and
      # round EXACTLY ONCE, at the end, before the floor comparison.
      raw = rc.base_rate_per_30s_cents * billable_units * rate_multiplier
            * media_multiplier * territory_multiplier * term_factor * window_multiplier
      rate_card_fee_cents = max(round_half_up(raw), fee_floor_cents)
    input_set: "Exactly one Asset (License.asset_id) and exactly one RateCard (License.rate_card_id, the archive's single row with status == ACTIVE at License creation time, resolved via the selector in validations[priority=18]). No aggregation over other licences."
    constants:
      SECONDS_PER_BILLABLE_UNIT: 30
      MONTHS_PER_TERM_YEAR: 12
    precision: "Integer cents. One round_half_up on the product, then max() against the window's floor. Rounding each factor separately is WRONG."
    variants:
      - name: festival_window
        when: "License.window_class == FESTIVAL_ONLY (film is only cleared for festival exhibition)"
        difference: "Uses rc.festival_window_multiplier (default 0.35) and floors at rc.festival_minimum_fee_cents. For a 45s BROADCAST/WORLD/36-month licence on a card with base 60000, minimum 150000, festival minimum 40000 this yields 126788 cents."
      - name: all_media_window
        when: "License.window_class == ALL_MEDIA_WINDOW (film is cleared for all media)"
        difference: "Uses rc.all_media_window_multiplier (default 1.00) and floors at rc.minimum_fee_cents. Identical inputs as above yield 362250 cents — a 235462-cent divergence on the same asset, media, territory and term."

  - name: mfn_adjusted_fee_cents
    trigger: "POST /licenses/{id}/state with to_status=EXECUTED (the QUOTED -> EXECUTED transition)"
    algorithm: constraint_propagation
    formula: |
      # This is the most-favored-nations settlement. It LOOKS circular — a
      # licence's binding fee depends on the highest per-unit rate among MFN
      # siblings on the same Asset, and those siblings' fees in turn depend on
      # this licence — so the evaluation order below is PINNED and the
      # dependency is resolved against already-persisted values only.

      # STEP 1 — own base, no MFN input at all.
      base_fee_cents = max(License.current_proposed_fee_cents, License.rate_card_fee_cents)

      # STEP 2 — benchmark from ALREADY-EXECUTED siblings only.
      if License.mfn_requested == false:
          mfn_benchmark_fee_cents = 0
      else:
          peers = [ L for L in License
                    where L.asset_id == License.asset_id
                      and L.id != License.id
                      and L.mfn_requested == true
                      and L.status IN {EXECUTED, ACTIVE, EXPIRING} ]
          if peers is empty:
              mfn_benchmark_fee_cents = 0
          else:
              peer_unit_rate = max over peers of (L.executed_fee_cents / L.billable_units)   # full precision
              mfn_benchmark_fee_cents = round_half_up(peer_unit_rate * License.billable_units)
          # NOTE: peers contribute their PERSISTED executed_fee_cents (a step-3
          # output of an earlier execution). No peer fee is recomputed here, so
          # the apparent cycle terminates after one pass.

      # STEP 3 — this licence's binding fee.
      executed_fee_cents = max(base_fee_cents, mfn_benchmark_fee_cents)
      own_unit_rate = executed_fee_cents / License.billable_units                # full precision

      # STEP 4 — retroactive upward propagation to under-paid siblings.
      # Peers are processed in created_at ASC order.
      for P in peers ordered by P.created_at ASC:
          if (P.executed_fee_cents / P.billable_units) < own_unit_rate:
              target_cents = round_half_up(own_unit_rate * P.billable_units)
              topup        = target_cents - P.executed_fee_cents
              P.mfn_topup_cents   += topup
              P.executed_fee_cents = target_cents
              P.version           += 1
              Production.committed_fee_cents += topup
      # Downward adjustment never happens: MFN parity, once granted, is not clawed back.
    input_set: "Peer set = License rows sharing asset_id, with mfn_requested == true and status IN {EXECUTED, ACTIVE, EXPIRING}, excluding the licence being executed. DRAFT / QUOTED / COUNTERED / EXPIRED / TERMINATED / LAPSED siblings are excluded."
    constants: {}
    precision: "Unit rates are compared in full precision (no intermediate rounding). Every cents value written to a row is round_half_up to an integer."
    variants:
      - name: first_leg_execution
        when: "No MFN peer of the asset has executed yet"
        difference: "mfn_benchmark_fee_cents == 0 and step 4 is a no-op; executed_fee_cents == base_fee_cents."
      - name: later_leg_execution
        when: "At least one MFN peer of the asset is already EXECUTED/ACTIVE/EXPIRING"
        difference: "executed_fee_cents can be lifted above both the negotiated proposal and the rate card, and step 4 can retroactively raise a sibling that was already executed — so the SAME two licences executed in the opposite order produce a different pair of executed_fee_cents values with the same Production ledger total."

  - name: eo_premium_cents
    trigger: "POST /eo-applications/{id}/state with to_status=SUBMITTED (the DRAFT -> SUBMITTED transition)"
    algorithm: aggregation
    formula: |
      # Nested rounding where the ORDER MATTERS. The pinned order is
      # ROUND-PER-ASSET-THEN-SUM. Summing the un-rounded loadings and rounding
      # once at the end is WRONG and differs by up to n/2 cents.
      BASE_RATE              = 0.0125
      RETENTION_CREDIT_RATE  = 0.30
      MIN_PREMIUM_CENTS      = 25000
      RISK_WEIGHT = { LICENSED: 0.010, FAIR_USE: 0.045, PUBLIC_DOMAIN: 0.004 }
      DEPICTION_SURCHARGE = 0.008

      base_premium_cents = round_half_up(EOApplication.coverage_limit_cents * BASE_RATE)

      loading_total_cents = 0
      for row in ClearanceChart(EOApplication.clearance_chart_id).pinned_rows
               ordered by Asset.created_at ASC:
          if row.licensing_status != CLEARED:  continue        # only cleared rows are rated
          w = RISK_WEIGHT[row.rights_basis]
          if row.depiction_status == OBTAINED
             and exists SubjectRelease R with R.asset_id == row.asset_id
                 and R.status IN {SIGNED, APPROVAL_GRANTED}
                 and R.approval_rights != NONE:
              w = w + DEPICTION_SURCHARGE
          asset_loading_cents = round_half_up(EOApplication.coverage_limit_cents * w)   # ROUND HERE, per asset
          loading_total_cents = loading_total_cents + asset_loading_cents               # SUM AFTER rounding

      retention_credit_cents = round_half_up(EOApplication.retention_cents * RETENTION_CREDIT_RATE)

      premium_cents = max(base_premium_cents + loading_total_cents - retention_credit_cents,
                          MIN_PREMIUM_CENTS)
    input_set: "Only the pinned_rows of the referenced ClearanceChart whose licensing_status == CLEARED. Assets created after the chart was pinned are NOT rated, even though they exist on the production."
    constants:
      BASE_RATE: 0.0125
      RETENTION_CREDIT_RATE: 0.30
      MIN_PREMIUM_CENTS: 25000
      RISK_WEIGHT_LICENSED: 0.010
      RISK_WEIGHT_FAIR_USE: 0.045
      RISK_WEIGHT_PUBLIC_DOMAIN: 0.004
      DEPICTION_SURCHARGE: 0.008
    precision: "Integer cents throughout. round_half_up is applied (a) once to the base premium, (b) once PER rated asset, (c) once to the retention credit. Worked example: coverage_limit_cents = 1000040 with two CLEARED/LICENSED assets and retention_cents = 0 gives base 12501, per-asset loading 10000 each (1000040*0.010 = 10000.4), total premium 32501. The forbidden sum-then-round order gives 32502."

  - name: fair_use_strength_score
    trigger: "POST /assets/{id}/fair-use-analyses (stamped on FairUseAnalysis.strength_score at creation)"
    algorithm: weighted_scoring
    formula: |
      # The weighting vector is selected from the PARENT ASSET's usage_purpose,
      # never from the request body.
      if Asset.usage_purpose == CRITICAL_COMMENTARY:
          weighting_variant = TRANSFORMATIVE_WEIGHTED
          W = { transformative: 0.45, nature: 0.10, amount_used: 0.15, market_harm: 0.30 }
      else:                        # ILLUSTRATIVE_BACKGROUND
          weighting_variant = MARKET_HARM_WEIGHTED
          W = { transformative: 0.20, nature: 0.10, amount_used: 0.20, market_harm: 0.50 }

      score_raw = W.transformative * (transformative_score / 100)
                + W.nature        * (nature_score        / 100)
                + W.amount_used   * (amount_used_score   / 100)
                + W.market_harm   * (market_harm_score   / 100)
      strength_score = round_half_up(score_raw, 4)      # 4 decimal places
    input_set: "The four factor scores on this FairUseAnalysis row plus Asset.usage_purpose. No aggregation across analyses; a REJECTED->DRAFT revision creates no new row, so re-submission re-uses the same stored score."
    constants:
      ACCEPT_THRESHOLD: 0.6000
    precision: "4 decimal places, round_half_up. The ACCEPTED transition requires strength_score >= 0.6000 — inclusive at the boundary."
    variants:
      - name: transformative_weighted
        when: "Asset.usage_purpose == CRITICAL_COMMENTARY"
        difference: "Weights 0.45/0.10/0.15/0.30. Factors (90, 60, 40, 50) score 0.6750 and clear the 0.6000 threshold."
      - name: market_harm_weighted
        when: "Asset.usage_purpose == ILLUSTRATIVE_BACKGROUND"
        difference: "Weights 0.20/0.10/0.20/0.50. The SAME factors (90, 60, 40, 50) score 0.5700 and are refused with ERR_FAIR_USE_SCORE_INSUFFICIENT — identical inputs, opposite outcome."

  - name: asset_clearance_rollup
    trigger: "system, after every POST /licenses, POST /licenses/{id}/state, POST /licenses/{id}/renew, POST /fair-use-analyses/{id}/state, POST /opinion-letters/{id}/state, POST /subject-releases/{id}/state and every step of POST /productions/{id}/rights-sweep that touched a licence of the asset"
    algorithm: aggregation
    formula: |
      required_legs = {MASTER, PUBLISHING}  if Asset.asset_type == MUSIC
                    = {FOOTAGE}             if Asset.asset_type == ARCHIVAL_FOOTAGE

      covered_legs = { L.rights_leg for L in License
                       where L.asset_id == Asset.id
                         and L.status IN {EXECUTED, ACTIVE, EXPIRING} }

      # STEP 1 — rights_basis, strict precedence, first match wins.
      if Asset.pd_attestation_reference is not null:                     rights_basis = PUBLIC_DOMAIN
      elif exists FairUseAnalysis F with F.asset_id == Asset.id
           and F.status == ACCEPTED:                                     rights_basis = FAIR_USE
      elif covered_legs is a superset of required_legs:                  rights_basis = LICENSED
      else:                                                              rights_basis = UNDETERMINED

      # STEP 2 — lapse accounting. THIS RUNS BEFORE STEP 3 and the ORDER MATTERS:
      # the incremented lapse_count is an input to step 3's LAPSED branch, so a
      # single request both records the lapse and reports it.
      if previous licensing_status == CLEARED and rights_basis == UNDETERMINED:
          Asset.lapse_count += 1

      # STEP 3 — licensing_status (dimension A), strict precedence, first match wins.
      if rights_basis != UNDETERMINED:                                   licensing_status = CLEARED
      elif Asset.lapse_count > 0 and covered_legs is empty:              licensing_status = LAPSED
      elif covered_legs is not empty:                                    licensing_status = PARTIALLY_CLEARED
      elif exists License L with L.asset_id == Asset.id
           and L.status IN {DRAFT, QUOTED, COUNTERED}:                   licensing_status = IN_NEGOTIATION
      else:                                                              licensing_status = UNCLEARED
    input_set: "Licences of this asset filtered to status IN {EXECUTED, ACTIVE, EXPIRING} for coverage and to {DRAFT, QUOTED, COUNTERED} for negotiation detection. EXPIRED, TERMINATED and LAPSED licences contribute to neither set."
    constants: {}
    precision: "Set comparison only; no arithmetic. A MUSIC asset holding only the MASTER leg is PARTIALLY_CLEARED, never CLEARED — the empty-vs-partial-vs-full leg set is the boundary."

  - name: production_clearance_posture
    trigger: "system, after every mutation that changes any Asset.licensing_status or Asset.depiction_status of the production, after POST /productions/{id}/clearance-charts, and in step 4 of POST /productions/{id}/rights-sweep"
    algorithm: threshold
    formula: |
      A = Asset rows with production_id == Production.id
      asset_count         = count(A)
      cleared_asset_count = count(a in A where a.licensing_status == CLEARED)
      open_asset_count    = count(a in A where a.licensing_status IN {UNCLEARED, IN_NEGOTIATION, PARTIALLY_CLEARED, LAPSED})
      blocked_count       = count(a in A where a.depiction_status == BLOCKED)
      lapsed_count        = count(a in A where a.licensing_status == LAPSED)
      pending_depiction   = count(a in A where a.depiction_status == PENDING)

      if asset_count == 0:                              posture = OPEN
      elif blocked_count > 0 or lapsed_count > 0:        posture = BLOCKED
      elif open_asset_count == 0 and pending_depiction == 0:
                                                        posture = OPEN
      elif open_asset_count * 4 <= asset_count:          posture = RESTRICTED
      else:                                              posture = BLOCKED
      # Integer arithmetic on purpose: `open_asset_count * 4 <= asset_count` is
      # the >= 75%-cleared test. 1 open of 4 assets => 4 <= 4 => RESTRICTED;
      # 2 open of 4 => 8 <= 4 false => BLOCKED.
    input_set: "Every Asset of the production, no status filter on the population; the counters above apply the status filters. Assets of other productions never contribute."
    constants:
      RESTRICTED_OPEN_RATIO_DENOMINATOR: 4
    precision: "Integer counts only. Evaluation order is top-to-bottom, first match wins; a single BLOCKED depiction or a single LAPSED licence outranks any ratio."

  - name: production_committed_fee_ledger
    trigger: "system, on every License transition that enters or leaves {EXECUTED, ACTIVE, EXPIRING}, on every MFN top-up, and on every renewal delta"
    algorithm: aggregation
    formula: |
      # INVARIANT (must hold after every request, checked as an equality):
      Production.committed_fee_cents
        == sum of L.executed_fee_cents
           for L in License where L.production_id == Production.id
                             and L.status IN {EXECUTED, ACTIVE, EXPIRING}

      # Maintained incrementally:
      #   QUOTED   -> EXECUTED    : += executed_fee_cents
      #   MFN top-up on peer P    : += topup   (P stays inside the summed set)
      #   renewal                 : += renewal_delta_cents
      #   * -> TERMINATED         : -= executed_fee_cents   (compensating action)
      #   ACTIVE/EXPIRING -> EXPIRED : -= executed_fee_cents
      # EXECUTED -> ACTIVE and ACTIVE -> EXPIRING move a licence WITHIN the
      # summed set and therefore change nothing.
    input_set: "Licences of this production with status IN {EXECUTED, ACTIVE, EXPIRING}. DRAFT/QUOTED/COUNTERED licences have executed_fee_cents == null and are excluded; EXPIRED/TERMINATED/LAPSED are excluded."
    constants: {}
    precision: "Integer cents. Conserved quantity #1: executing a licence and then terminating it MUST return committed_fee_cents to the exact pre-execution value, with no residue from rounding."

  - name: production_asset_count_ledger
    trigger: "system, on every Asset creation and on every recomputation of Asset.licensing_status"
    algorithm: aggregation
    formula: |
      # INVARIANT (must hold after every request):
      Production.cleared_asset_count + Production.open_asset_count == Production.asset_count
      # because licensing_status is total over
      # {CLEARED} ∪ {UNCLEARED, IN_NEGOTIATION, PARTIALLY_CLEARED, LAPSED}.
      #
      # Maintained incrementally:
      #   Asset created                      : asset_count += 1, open_asset_count += 1
      #   licensing_status -> CLEARED        : cleared += 1, open -= 1
      #   licensing_status leaves CLEARED    : cleared -= 1, open += 1
    input_set: "Every Asset of the production, partitioned by licensing_status with no other filter."
    constants: {}
    precision: "Integer counts. Conserved quantity #2: issuing an opinion letter and accepting the analysis (cleared += 1) followed by withdrawing that letter (cleared -= 1) MUST return cleared_asset_count and open_asset_count to their exact pre-issue values while asset_count never moves."

  - name: rights_sweep_epoch
    trigger: "POST /productions/{id}/rights-sweep"
    algorithm: chronological
    formula: |
      now_date = date part of the logical clock (see POST /_clock/set_current_utc;
                 startup default 2026-08-01T00:00:00Z)
      Production.sweep_epoch += 1
      L = License rows with production_id == Production.id

      # STEP 1 — activation. Order: created_at ASC.
      for lic in L where lic.status == EXECUTED and lic.term_start_date <= now_date:
          lic.status = ACTIVE

      # STEP 2 — expiry. Half-open term [term_start_date, term_end_date):
      # coverage ends AT 00:00 on term_end_date, so equality expires.
      # Order: created_at ASC. Re-reads the status set produced by step 1, so a
      # licence can activate and expire inside one sweep.
      for lic in L where lic.status IN {ACTIVE, EXPIRING} and now_date >= lic.term_end_date:
          lic.status = EXPIRED
          Production.committed_fee_cents -= lic.executed_fee_cents

      # STEP 3 — expiry warning. Order: created_at ASC.
      for lic in L where lic.status == ACTIVE
                     and 0 <= (lic.term_end_date - now_date) in whole days <= RENEWAL_WINDOW_DAYS:
          lic.status = EXPIRING

      # STEP 4 — cascade. Recompute in this exact order:
      #   (a) asset_clearance_rollup for every Asset touched by steps 1-3
      #   (b) production_clearance_posture
      #   (c) if posture == BLOCKED: every DeliveryPackage in DELIVERED -> SUSPENDED
      #       (order created_at ASC)
      #   (d) for every package just suspended: every BOUND EOApplication of the
      #       production -> REMEDIATION_REQUIRED
      #   (e) if Production.status == LOCKED and posture != OPEN: LOCKED -> CLEARANCE
    input_set: "Only licences whose production_id equals the swept production. Steps are applied in the numbered order; within a step, rows are processed created_at ASC (never by id)."
    constants:
      RENEWAL_WINDOW_DAYS: 60
      CLOCK_STARTUP_DEFAULT: "2026-08-01T00:00:00Z"
    precision: "Whole-day date arithmetic on ISO dates. Boundary: exactly 60 whole days before term_end_date flags EXPIRING; 61 days does not. now_date == term_end_date EXPIRES (half-open interval)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
# Domain ordering rationale: this is a legal-clearance surface, so after the
# generic auth/existence/payload/OCC band the order is
#   state -> production posture gate -> referential integrity ->
#   legal safety (segregation of duties, opinion letters, cue sheet) ->
#   structural constraints (limits, uniqueness) ->
#   temporal conflicts (licence term overlap, depiction windows) ->
#   fiscal checks last.
# A film cannot be "cheaply" delivered without a legal basis, so no fiscal
# rule ever pre-empts a clearance-safety rule.
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "when X-User-Role == RightsHolderRep, X-User-ID equals the archive_id of the License (or of the Archive) addressed by the request — a rep may only act on its own archive's licences"
    error_id: ERR_ARCHIVE_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /licenses/{id}/negotiation-rounds, POST /licenses/{id}/state, GET /licenses/{id}, GET /archives/{id}/rate-cards"

  - priority: 5
    category: existence
    check: "the path-parameter resource exists (Production, Archive, Asset, License, FairUseAnalysis, OpinionLetter, SubjectRelease, ClearanceChart, EOApplication, DeliveryPackage)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with an {id} path parameter"

  - priority: 6
    category: existence
    check: "every FK supplied in the request body resolves to an existing row, validated left-to-right in the order the fields are declared in the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /licenses, POST /assets/{id}/source-candidates, POST /productions/{id}/eo-applications, POST /productions/{id}/delivery-packages, POST /productions/{id}/subject-releases"

  - priority: 7
    category: business_constraint
    check: "request body is well-formed: required fields present, enums within their declared domain, integers non-negative, ISO-8601 dates parseable, timecode_out_seconds > timecode_in_seconds, term_months >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 8
    category: state
    check: "expected_production_version equals the target Production's current version"
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412
    applies_to: "POST /productions/{id}/clearance-charts"

  - priority: 9
    category: state
    check: "expected_license_version equals the target License's current version"
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412
    applies_to: "POST /licenses/{id}/negotiation-rounds"

  - priority: 10
    category: state
    check: "the requested transition (to_status, or the implicit transition of an action endpoint) is declared for the resource's current state in §1.2. TWO EXCEPTIONS, both of which yield a more specific error instead of ERR_INVALID_STATE_TRANSITION: (a) for POST /licenses/{id}/state with to_status=EXECUTED from a status outside {QUOTED}, ERR_LICENSE_NOT_QUOTED (priority 12) is returned; (b) for POST /eo-applications/{id}/state with to_status=BOUND from a status outside {CLEARED_TO_BIND, REMEDIATION_REQUIRED}, ERR_REVIEWS_INCOMPLETE (priority 44) is returned"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /productions/{id}/state, POST /archives/{id}/state, POST /licenses/{id}/state, POST /fair-use-analyses/{id}/state, POST /opinion-letters/{id}/state, POST /subject-releases/{id}/state, POST /eo-applications/{id}/state, POST /delivery-packages/{id}/state"

  - priority: 11
    category: state
    check: "the parent Production is in a state that accepts new clearance work: Production.status IN {DEVELOPMENT, CLEARANCE} for asset/licence/release/analysis creation; a LOCKED, DELIVERED or ABANDONED production accepts no new assets or licences"
    error_id: ERR_PRODUCTION_NOT_IN_CLEARANCE
    http_status: 409
    applies_to: "POST /productions/{id}/assets, POST /licenses, POST /productions/{id}/subject-releases, POST /assets/{id}/fair-use-analyses"

  - priority: 12
    category: state
    check: "License.status == QUOTED before EXECUTED, and a licence may only be renewed from status IN {ACTIVE, EXPIRING}"
    error_id: ERR_LICENSE_NOT_QUOTED
    http_status: 409
    applies_to: "POST /licenses/{id}/state (to_status=EXECUTED), POST /licenses/{id}/renew"

  - priority: 13
    category: state
    check: "for a FOOTAGE leg the Asset has exactly one SourceCandidate with selection_status == SELECTED, and the licence's archive_id equals that candidate's archive_id"
    error_id: ERR_NO_SELECTED_SOURCE
    http_status: 409
    applies_to: "POST /licenses"

  - priority: 14
    category: state
    check: "Production.posture != BLOCKED before a clearance chart may be pinned, an E&O application submitted, or a delivery package validated"
    error_id: ERR_PRODUCTION_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /productions/{id}/clearance-charts, POST /eo-applications/{id}/state (to_status=SUBMITTED), POST /delivery-packages/{id}/state (to_status=VALIDATED)"

  - priority: 15
    category: state
    check: "Production.posture == OPEN (not merely non-BLOCKED) before a DeliveryPackage may transition VALIDATED -> DELIVERED, and before a Production may transition CLEARANCE -> LOCKED"
    error_id: ERR_PRODUCTION_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /delivery-packages/{id}/state (to_status=DELIVERED), POST /productions/{id}/state (to_status=LOCKED)"

  - priority: 16
    category: business_referential
    check: "the referenced Archive has status == ACTIVE; a SUSPENDED archive may not receive a new licence, may not be executed against, and may not have a new rate card issued"
    error_id: ERR_ARCHIVE_SUSPENDED
    http_status: 409
    applies_to: "POST /licenses, POST /licenses/{id}/state (to_status IN {QUOTED, EXECUTED}), POST /archives/{id}/rate-cards"

  - priority: 17
    category: business_referential
    check: "the referenced Asset belongs to the referenced Production, and the referenced ClearanceChart belongs to the Production being addressed"
    error_id: ERR_ASSET_PRODUCTION_MISMATCH
    http_status: 422
    applies_to: "POST /licenses, POST /productions/{id}/subject-releases"

  - priority: 18
    category: business_referential
    check: "the Archive named on the licence has exactly one RateCard with status == ACTIVE whose effective_from_date <= the licence's term_start_date; that card is the one stamped onto License.rate_card_id"
    error_id: ERR_NO_ACTIVE_RATE_CARD
    http_status: 422
    applies_to: "POST /licenses, POST /licenses/{id}/renew"

  - priority: 19
    category: business_referential
    check: "the referenced ClearanceChart belongs to the Production of the E&O application or delivery package"
    error_id: ERR_CHART_PRODUCTION_MISMATCH
    http_status: 422
    applies_to: "POST /productions/{id}/eo-applications, POST /productions/{id}/delivery-packages"

  - priority: 20
    category: business_referential
    check: "the referenced ClearanceChart has NOT gone STALE — its status must not be STALE (a chart goes STALE when any pinned row's asset_version no longer matches the live Asset.version); a STALE chart cannot back an E&O submission or a delivery validation. Status SUPERSEDED is handled by priority 21, not here"
    error_id: ERR_CHART_STALE
    http_status: 409
    applies_to: "POST /eo-applications/{id}/state (to_status=SUBMITTED), POST /delivery-packages/{id}/state (to_status=VALIDATED)"

  - priority: 21
    category: business_referential
    check: "the referenced ClearanceChart is not SUPERSEDED by a later pinning on the same production"
    error_id: ERR_CHART_SUPERSEDED
    http_status: 409
    applies_to: "POST /eo-applications/{id}/state (to_status=SUBMITTED), POST /delivery-packages/{id}/state (to_status=VALIDATED)"

  - priority: 22
    category: business_safety
    check: "a FairUseAnalysis may only be ACCEPTED when at least one OpinionLetter on it has status == ISSUED — an unlicensed asset never becomes cleared on a bare score"
    error_id: ERR_NO_ISSUED_OPINION_LETTER
    http_status: 409
    applies_to: "POST /fair-use-analyses/{id}/state (to_status=ACCEPTED)"

  - priority: 23
    category: business_safety
    check: "segregation of duties — the LegalCounsel X-User-ID that issued the OpinionLetter (OpinionLetter.issued_by_user_id) may not be the X-User-ID that records the legal review on the E&O application, and the legal reviewer may not also record the underwriting review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /eo-applications/{id}/reviews"

  - priority: 24
    category: business_safety
    check: "the review_type has not already been recorded on this E&O application"
    error_id: ERR_REVIEW_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /eo-applications/{id}/reviews"

  - priority: 25
    category: business_safety
    check: "review_type == LEGAL may only be recorded by LegalCounsel and review_type == UNDERWRITING only by ClearanceSupervisor"
    error_id: ERR_REVIEW_TYPE_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /eo-applications/{id}/reviews"

  - priority: 26
    category: business_safety
    check: "every MUSIC asset pinned on the chart carries BOTH a MASTER and a PUBLISHING covered leg — ClearanceChart.music_leg_gap_count must be 0 before a delivery package is validated"
    error_id: ERR_CUE_SHEET_INCOMPLETE
    http_status: 409
    applies_to: "POST /delivery-packages/{id}/state (to_status=VALIDATED)"

  - priority: 27
    category: business_safety
    check: "the DeliveryPackage's window_class is covered by every licence backing its pinned rows: a package with window_class == ALL_MEDIA_WINDOW may not rest on a licence whose window_class == FESTIVAL_ONLY"
    error_id: ERR_WINDOW_CLASS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /delivery-packages/{id}/state (to_status=VALIDATED)"

  - priority: 28
    category: business_safety
    check: "the production has a BOUND EOApplication before a DeliveryPackage may transition VALIDATED -> DELIVERED"
    error_id: ERR_EO_NOT_BOUND
    http_status: 409
    applies_to: "POST /delivery-packages/{id}/state (to_status=DELIVERED)"

  - priority: 29
    category: business_safety
    check: "the production has at least one DELIVERED DeliveryPackage before it may transition LOCKED -> DELIVERED"
    error_id: ERR_NO_DELIVERED_PACKAGE
    http_status: 409
    applies_to: "POST /productions/{id}/state (to_status=DELIVERED)"

  - priority: 30
    category: business_safety
    check: "a SubjectRelease may only transition SIGNED -> APPROVAL_GRANTED or SIGNED -> APPROVAL_WITHHELD when approval_rights != NONE; a release granting no approval rights has no approval to give"
    error_id: ERR_NO_APPROVAL_RIGHTS
    http_status: 409
    applies_to: "POST /subject-releases/{id}/state"

  - priority: 31
    category: business_safety
    check: "a Production may not transition to ABANDONED while any of its licences is in status IN {EXECUTED, ACTIVE, EXPIRING}"
    error_id: ERR_LICENSES_STILL_LIVE
    http_status: 409
    applies_to: "POST /productions/{id}/state (to_status=ABANDONED)"

  - priority: 32
    category: business_constraint
    check: "at least one SourceCandidate of the Asset has availability_status == AVAILABLE before a source may be selected"
    error_id: ERR_NO_AVAILABLE_SOURCE
    http_status: 409
    applies_to: "POST /assets/{id}/select-source"

  - priority: 33
    category: business_constraint
    check: "the negotiation round's party matches the acting role: party == LICENSOR requires X-User-Role == RightsHolderRep, party == PRODUCER requires X-User-Role IN {ProductionAdmin, ClearanceSupervisor}"
    error_id: ERR_PARTY_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /licenses/{id}/negotiation-rounds"

  - priority: 34
    category: business_constraint
    check: "License.round_count < 6 — a licence supports at most six negotiation rounds before it must be executed or terminated"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /licenses/{id}/negotiation-rounds"

  - priority: 35
    category: business_constraint
    check: "SubjectRelease.revision_round_count < 3 — at most three revision cycles before the release must be signed or refused"
    error_id: ERR_RELEASE_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /subject-releases/{id}/state (to_status=REVISION_REQUESTED)"

  - priority: 36
    category: business_constraint
    check: "a MUSIC asset requires rights_leg IN {MASTER, PUBLISHING}; an ARCHIVAL_FOOTAGE asset requires rights_leg == FOOTAGE"
    error_id: ERR_MUSIC_LEG_REQUIRED
    http_status: 422
    applies_to: "POST /licenses"

  - priority: 37
    category: business_temporal
    check: "term_start_date < term_end_date and the term_months field is consistent with the whole-month span between them"
    error_id: ERR_TERM_DATES_INVALID
    http_status: 422
    applies_to: "POST /licenses"

  - priority: 38
    category: business_temporal
    check: "no existing License on the same asset_id with the same rights_leg, an overlapping media (identical, or either side == ALL_MEDIA) and an overlapping territory (identical, or either side == WORLD), in status IN {DRAFT, QUOTED, COUNTERED, EXECUTED, ACTIVE, EXPIRING}, has a term half-open interval [term_start_date, term_end_date) that intersects the requested one. Adjacency is allowed: a term starting exactly on an existing term's end date does NOT overlap."
    error_id: ERR_LICENSE_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /licenses, POST /licenses/{id}/renew"

  - priority: 39
    category: business_temporal
    check: "no existing SubjectRelease for the same subject_person_key on the same production, in status IN {SENT, REVISION_REQUESTED, SIGNED, APPROVAL_GRANTED}, has a CLOSED depiction window [depiction_from_date, depiction_to_date] that intersects the requested window after the requested window is widened by a 30-day quiet buffer on each side"
    error_id: ERR_DEPICTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /productions/{id}/subject-releases"

  - priority: 40
    category: business_temporal
    check: "renewal is only permitted when the whole-day distance from the logical clock date to License.term_end_date is between 0 and 60 inclusive"
    error_id: ERR_OUTSIDE_RENEWAL_WINDOW
    http_status: 409
    applies_to: "POST /licenses/{id}/renew"

  - priority: 41
    category: business_temporal
    check: "additional_term_months >= 1"
    error_id: ERR_INVALID_RENEWAL_TERM
    http_status: 422
    applies_to: "POST /licenses/{id}/renew"

  - priority: 42
    category: business_fiscal
    check: "FairUseAnalysis.strength_score >= 0.6000 before the analysis may be ACCEPTED"
    error_id: ERR_FAIR_USE_SCORE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /fair-use-analyses/{id}/state (to_status=ACCEPTED)"

  - priority: 43
    category: business_fiscal
    check: "coverage_limit_cents >= 100000 and retention_cents < coverage_limit_cents on an E&O application"
    error_id: ERR_COVERAGE_LIMIT_INVALID
    http_status: 422
    applies_to: "POST /productions/{id}/eo-applications"

  - priority: 44
    category: business_fiscal
    check: "an E&O application may only be BOUND from CLEARED_TO_BIND, which requires BOTH legal_review_status == PASSED AND underwriting_review_status == PASSED (the join of the two parallel review branches)"
    error_id: ERR_REVIEWS_INCOMPLETE
    http_status: 409
    applies_to: "POST /eo-applications/{id}/state (to_status IN {CLEARED_TO_BIND, BOUND})"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# All paths are flat top-level collections; nested paths are used only for
# creation-in-parent-context and for FK reverse-reachability sub-resource GETs.
endpoints:

  # --- Production ----------------------------------------------------------
  - method: POST
    path: "/productions"
    description: "Open a documentary production file."
    roles: [ProductionAdmin]
    code: 201
    input: ["title", "delivery_deadline_date", "festival_premiere_date?", "eo_carrier_name?"]
    output: Production
    side_effects:
      - "status = DEVELOPMENT, posture = OPEN"
      - "asset_count = cleared_asset_count = open_asset_count = 0, committed_fee_cents = 0, sweep_epoch = 0"
      - "version = 1"

  - method: GET
    path: "/productions/{id}"
    description: "Read a production including its derived posture and ledger counters."
    roles: [ProductionAdmin, ClearanceSupervisor, ArchiveResearcher, LegalCounsel]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: POST
    path: "/productions/{id}/state"
    description: "Drive the production lifecycle: DEVELOPMENT -> CLEARANCE -> LOCKED -> DELIVERED, LOCKED -> CLEARANCE, or -> ABANDONED."
    roles: [ProductionAdmin, ClearanceSupervisor]
    code: 200
    input: ["to_status", "reason?"]
    output: Production
    side_effects:
      - "validates the transition against §1.2 Production"
      - "CLEARANCE -> LOCKED requires posture == OPEN (validations priority 15)"
      - "LOCKED -> DELIVERED requires at least one DELIVERED DeliveryPackage (priority 29)"
      - "-> ABANDONED requires no live licence (priority 31) and terminates every DRAFT/QUOTED/COUNTERED licence of the production"
      - "increments Production.version by 1"

  - method: GET
    path: "/productions/{id}/clearance-charts"
    description: "List every clearance chart ever pinned for the production, newest first. FK reverse-reachability for ClearanceChart.production_id."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClearanceChart[]
    side_effects: []

  # --- Archive & RateCard --------------------------------------------------
  - method: POST
    path: "/archives"
    description: "Register a footage or music rights holder."
    roles: [ArchiveResearcher, ProductionAdmin]
    code: 201
    input: ["name", "holder_type", "mfn_policy?"]
    output: Archive
    side_effects:
      - "status = ACTIVE, mfn_policy defaults to NONE"
      - "version = 1"

  - method: GET
    path: "/archives/{id}"
    description: "Read an archive."
    roles: [ProductionAdmin, ClearanceSupervisor, ArchiveResearcher, RightsHolderRep, LegalCounsel]
    code: 200
    input: []
    output: Archive
    side_effects: []

  - method: POST
    path: "/archives/{id}/state"
    description: "Suspend or reinstate an archive (ACTIVE <-> SUSPENDED, a cycle)."
    roles: [ClearanceSupervisor]
    code: 200
    input: ["to_status", "reason?"]
    output: Archive
    side_effects:
      - "SUSPENDED blocks new licences and executions against this archive (validations priority 16)"
      - "existing EXECUTED/ACTIVE licences are untouched"
      - "increments Archive.version by 1"

  - method: POST
    path: "/archives/{id}/rate-cards"
    description: "Publish a rate card for the archive. Supersedes the archive's current ACTIVE card so exactly one card is ACTIVE at any time."
    roles: [ArchiveResearcher, RightsHolderRep]
    code: 201
    input: ["base_rate_per_30s_cents", "minimum_fee_cents", "festival_minimum_fee_cents", "effective_from_date", "tier1_max_seconds?", "tier2_max_seconds?", "tier2_rate_multiplier?", "tier3_rate_multiplier?", "media_multiplier_theatrical?", "media_multiplier_broadcast?", "media_multiplier_streaming?", "media_multiplier_all_media?", "territory_multiplier_world?", "territory_multiplier_domestic?", "term_multiplier_per_year?", "festival_window_multiplier?", "all_media_window_multiplier?"]
    output: RateCard
    side_effects:
      - "any previously ACTIVE RateCard of this archive transitions ACTIVE -> SUPERSEDED"
      - "new card status = ACTIVE; omitted multipliers take their declared defaults"
      - "rejected with ERR_ARCHIVE_SUSPENDED when the archive is SUSPENDED"

  - method: GET
    path: "/archives/{id}/rate-cards"
    description: "List the archive's rate cards, ACTIVE first then SUPERSEDED by effective_from_date DESC. FK reverse-reachability for RateCard.archive_id."
    roles: [ArchiveResearcher, ProductionAdmin, ClearanceSupervisor, RightsHolderRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  - method: GET
    path: "/archives/{id}/source-candidates"
    description: "List every source candidate that names this archive as the holding institution. FK reverse-reachability for SourceCandidate.archive_id."
    roles: [ArchiveResearcher, ProductionAdmin, ClearanceSupervisor]
    code: 200
    input: ["availability_status?", "selection_status?", "limit?", "offset?"]
    output: SourceCandidate[]
    side_effects: []

  # --- Asset & SourceCandidate --------------------------------------------
  - method: POST
    path: "/productions/{id}/assets"
    description: "Log a footage or music asset identified during archive research."
    roles: [ArchiveResearcher, ProductionAdmin]
    code: 201
    input: ["asset_type", "title", "timecode_in_seconds", "timecode_out_seconds", "usage_purpose", "depiction_subject_key?", "pd_attestation_reference?"]
    output: Asset
    side_effects:
      - "duration_seconds = timecode_out_seconds - timecode_in_seconds"
      - "rights_basis = UNDETERMINED (or PUBLIC_DOMAIN when pd_attestation_reference is supplied), licensing_status = UNCLEARED, depiction_status = NOT_REQUIRED (or PENDING when depiction_subject_key is supplied), lapse_count = 0"
      - "runs asset_clearance_rollup, then production_clearance_posture"
      - "Production.asset_count += 1 and open_asset_count += 1 (or cleared_asset_count += 1 when the attestation clears it on sight); increments Production.version by 1"
      - "marks every PINNED ClearanceChart of the production STALE only if a pinned row's asset changed — a brand-new asset alone does NOT stale a chart"

  - method: GET
    path: "/assets/{id}"
    description: "Read an asset with its two independent status dimensions."
    roles: [ProductionAdmin, ClearanceSupervisor, ArchiveResearcher, LegalCounsel]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/assets"
    description: "Filtered asset list. FK reverse-reachability for Asset.production_id and Asset.selected_source_candidate_id."
    roles: [ProductionAdmin, ClearanceSupervisor, ArchiveResearcher, LegalCounsel]
    code: 200
    input: ["production_id?", "selected_source_candidate_id?", "asset_type?", "licensing_status?", "depiction_status?", "rights_basis?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: POST
    path: "/assets/{id}/source-candidates"
    description: "Record a candidate print/element found at an archive, with its availability and provenance confidence."
    roles: [ArchiveResearcher]
    code: 201
    input: ["archive_id", "availability_status", "quoted_rate_per_30s_cents?", "provenance_confidence?"]
    output: SourceCandidate
    side_effects:
      - "selection_status = NOT_SELECTED"

  - method: GET
    path: "/assets/{id}/source-candidates"
    description: "List the asset's source candidates, created_at ASC. FK reverse-reachability for SourceCandidate.asset_id."
    roles: [ArchiveResearcher, ProductionAdmin, ClearanceSupervisor]
    code: 200
    input: ["availability_status?", "selection_status?", "limit?", "offset?"]
    output: SourceCandidate[]
    side_effects: []

  - method: POST
    path: "/assets/{id}/select-source"
    description: "Select the source element the licence will be cut against. Requires an AVAILABLE candidate."
    roles: [ArchiveResearcher, ClearanceSupervisor]
    code: 200
    input: [source_candidate_id]
    output: Asset
    side_effects:
      - "rejected with ERR_NO_AVAILABLE_SOURCE when no candidate of the asset has availability_status == AVAILABLE (validations priority 32)"
      - "chosen candidate selection_status = SELECTED; any previously SELECTED candidate becomes REJECTED"
      - "Asset.selected_source_candidate_id = source_candidate_id; increments Asset.version by 1"

  # --- License & NegotiationRound -----------------------------------------
  - method: POST
    path: "/licenses"
    description: "Open a licence negotiation for one rights leg of one asset with one archive. The rate card fee is stamped at creation."
    roles: [ProductionAdmin, ClearanceSupervisor]
    code: 201
    input: [production_id, asset_id, archive_id, rights_leg, media, territory, window_class, term_months, term_start_date, term_end_date, "mfn_requested?"]
    output: License
    side_effects:
      - "resolves rate_card_id to the archive's single ACTIVE RateCard effective on or before term_start_date (validations priority 18)"
      - "runs license_rate_card_fee_cents; stamps billable_units and rate_card_fee_cents"
      - "current_proposed_fee_cents = rate_card_fee_cents, round_count = 0, mfn_topup_cents = 0, executed_fee_cents = null, status = DRAFT"
      - "mfn_requested defaults to true when the archive's mfn_policy == RATE_MFN, else false"
      - "runs asset_clearance_rollup (UNCLEARED -> IN_NEGOTIATION) then production_clearance_posture; increments Asset.version and Production.version by 1"
      - "enforces the half-open term-overlap rule (validations priority 38) and the leg/asset_type rule (priority 36)"

  - method: GET
    path: "/licenses/{id}"
    description: "Read a licence with its negotiated, rate-card, MFN and executed fee fields."
    roles: [ProductionAdmin, ClearanceSupervisor, RightsHolderRep, LegalCounsel]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licenses"
    description: "Filtered licence list. FK reverse-reachability for License.production_id, License.asset_id, License.archive_id and License.rate_card_id."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel, ArchiveResearcher]
    code: 200
    input: ["production_id?", "asset_id?", "archive_id?", "rate_card_id?", "rights_leg?", "status?", "term_end_on_or_before?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/licenses/{id}/negotiation-rounds"
    description: "Record one negotiation round (a quote from the licensor or a counter from the producer). Optimistically concurrent on the licence's version."
    roles: [ProductionAdmin, ClearanceSupervisor, RightsHolderRep]
    code: 201
    input: [party, proposed_fee_cents, expected_license_version, "note?"]
    output: NegotiationRound
    side_effects:
      - "412 ERR_STALE_LICENSE_VERSION when expected_license_version != License.version"
      - "round_number = License.round_count + 1; License.round_count += 1"
      - "License.current_proposed_fee_cents = proposed_fee_cents"
      - "party == LICENSOR drives DRAFT -> QUOTED or COUNTERED -> QUOTED; party == PRODUCER drives QUOTED -> COUNTERED"
      - "stamps license_status_after and license_version_after onto the round"
      - "increments License.version by 1"

  - method: GET
    path: "/licenses/{id}/negotiation-rounds"
    description: "Replay the negotiation history, round_number ASC. FK reverse-reachability for NegotiationRound.license_id."
    roles: [ProductionAdmin, ClearanceSupervisor, RightsHolderRep, LegalCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: NegotiationRound[]
    side_effects: []

  - method: POST
    path: "/licenses/{id}/state"
    description: "Execute, activate, expire, or terminate a licence. EXECUTED settles the most-favored-nations parity."
    roles: [ClearanceSupervisor, ProductionAdmin, RightsHolderRep]
    code: 200
    input: [to_status, "reason?"]
    output: License
    side_effects:
      - "QUOTED -> EXECUTED runs mfn_adjusted_fee_cents: stamps executed_fee_cents and mfn_benchmark_fee_cents, retroactively raises under-paid MFN peers' executed_fee_cents and mfn_topup_cents, and adds every increment to Production.committed_fee_cents"
      - "-> TERMINATED debits Production.committed_fee_cents by exactly this licence's executed_fee_cents (compensating action) and stamps termination_reason"
      - "runs asset_clearance_rollup then production_clearance_posture; marks affected PINNED charts STALE"
      - "increments License.version, Asset.version and Production.version by 1"

  - method: POST
    path: "/licenses/{id}/renew"
    description: "Extend an ACTIVE or EXPIRING licence before its rights lapse. Only permitted inside the 60-day renewal window."
    roles: [ClearanceSupervisor]
    code: 200
    input: [additional_term_months]
    output: License
    side_effects:
      - "rejected with ERR_OUTSIDE_RENEWAL_WINDOW when the clock is more than 60 whole days before term_end_date (validations priority 40)"
      - "term_months += additional_term_months, term_end_date is advanced by additional_term_months calendar months, and license_rate_card_fee_cents is re-run against the new term"
      - "renewal_delta_cents = max(0, new rate_card_fee_cents - old rate_card_fee_cents) is added to executed_fee_cents and to Production.committed_fee_cents"
      - "status EXPIRING -> ACTIVE (a cycle back into the live band)"
      - "re-checks the term-overlap rule against sibling licences (priority 38)"
      - "increments License.version and Production.version by 1"

  # --- FairUseAnalysis & OpinionLetter ------------------------------------
  - method: POST
    path: "/assets/{id}/fair-use-analyses"
    description: "Open a four-factor fair-use analysis for unlicensed material. The weighting variant is chosen from the asset's usage_purpose."
    roles: [LegalCounsel]
    code: 201
    input: [transformative_score, nature_score, amount_used_score, market_harm_score]
    output: FairUseAnalysis
    side_effects:
      - "weighting_variant = TRANSFORMATIVE_WEIGHTED when Asset.usage_purpose == CRITICAL_COMMENTARY, else MARKET_HARM_WEIGHTED"
      - "runs fair_use_strength_score; stamps strength_score to 4 decimal places"
      - "status = DRAFT"

  - method: GET
    path: "/fair-use-analyses/{id}"
    description: "Read a fair-use analysis with its weighting variant and strength score."
    roles: [LegalCounsel, ClearanceSupervisor, ProductionAdmin]
    code: 200
    input: []
    output: FairUseAnalysis
    side_effects: []

  - method: GET
    path: "/assets/{id}/fair-use-analyses"
    description: "List the asset's fair-use analyses, created_at ASC. FK reverse-reachability for FairUseAnalysis.asset_id."
    roles: [LegalCounsel, ClearanceSupervisor, ProductionAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FairUseAnalysis[]
    side_effects: []

  - method: POST
    path: "/fair-use-analyses/{id}/state"
    description: "Submit, accept, or reject a fair-use analysis. ACCEPTED is what makes an unlicensed asset cleared."
    roles: [LegalCounsel, ClearanceSupervisor]
    code: 200
    input: [to_status, "decision_rationale?"]
    output: FairUseAnalysis
    side_effects:
      - "-> ACCEPTED requires strength_score >= 0.6000 (validations priority 42) and at least one ISSUED OpinionLetter (priority 22)"
      - "-> ACCEPTED sets Asset.rights_basis = FAIR_USE and licensing_status = CLEARED via asset_clearance_rollup, then production_clearance_posture; Production.cleared_asset_count += 1 and open_asset_count -= 1"
      - "ACCEPTED -> REJECTED reverses the rollup, increments Asset.lapse_count when coverage is empty, and restores the two counters exactly"
      - "REJECTED -> DRAFT re-opens the analysis for revision (a cycle)"
      - "increments FairUseAnalysis.version, Asset.version and Production.version by 1"

  - method: POST
    path: "/fair-use-analyses/{id}/opinion-letters"
    description: "Attach outside counsel's opinion letter to a submitted analysis. The issuing X-User-ID is recorded for segregation of duties."
    roles: [LegalCounsel]
    code: 201
    input: [counsel_firm, letter_reference, risk_rating]
    output: OpinionLetter
    side_effects:
      - "issued_by_user_id = the request's X-User-ID"
      - "status = DRAFT"

  - method: GET
    path: "/fair-use-analyses/{id}/opinion-letters"
    description: "List the analysis's opinion letters, created_at ASC. FK reverse-reachability for OpinionLetter.fair_use_analysis_id."
    roles: [LegalCounsel, ClearanceSupervisor, ProductionAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OpinionLetter[]
    side_effects: []

  - method: POST
    path: "/opinion-letters/{id}/state"
    description: "Issue or withdraw an opinion letter. Withdrawal detonates a five-hop clearance cascade."
    roles: [LegalCounsel]
    code: 200
    input: [to_status, "withdrawal_reason?"]
    output: OpinionLetter
    side_effects:
      - "DRAFT -> ISSUED makes the parent analysis acceptable"
      - "ISSUED -> WITHDRAWN cascades: (1) every ACCEPTED analysis of this letter with no other ISSUED letter becomes REJECTED, (2) the asset re-rolls to PARTIALLY_CLEARED/UNCLEARED/LAPSED, (3) Production counters and posture are recomputed, (4) DELIVERED DeliveryPackages of the production are SUSPENDED, (5) BOUND EOApplications become REMEDIATION_REQUIRED"
      - "increments OpinionLetter.version, FairUseAnalysis.version, Asset.version and Production.version by 1"

  # --- SubjectRelease ------------------------------------------------------
  - method: POST
    path: "/productions/{id}/subject-releases"
    description: "Paper a subject release, life-rights grant, or depiction agreement, optionally scoped to one asset and always scoped to a depiction window."
    roles: [ProductionAdmin, ClearanceSupervisor]
    code: 201
    input: [subject_person_key, release_type, depiction_from_date, depiction_to_date, "asset_id?", "approval_rights?"]
    output: SubjectRelease
    side_effects:
      - "approval_rights defaults to NONE"
      - "status = DRAFT, revision_round_count = 0"
      - "enforces the buffered depiction-window rule (validations priority 39)"
      - "when asset_id is supplied, the asset must belong to this production (priority 17) and its depiction_status becomes PENDING"

  - method: GET
    path: "/subject-releases/{id}"
    description: "Read a release with its approval rights and depiction window."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel]
    code: 200
    input: []
    output: SubjectRelease
    side_effects: []

  - method: GET
    path: "/subject-releases"
    description: "Filtered release list. FK reverse-reachability for SubjectRelease.production_id and SubjectRelease.asset_id."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel]
    code: 200
    input: ["production_id?", "asset_id?", "subject_person_key?", "release_type?", "status?", "limit?", "offset?"]
    output: SubjectRelease[]
    side_effects: []

  - method: POST
    path: "/subject-releases/{id}/state"
    description: "Send, revise, sign, refuse, or resolve the negotiated approval on a release."
    roles: [ProductionAdmin, ClearanceSupervisor]
    code: 200
    input: [to_status, "cut_reference?", "reason?"]
    output: SubjectRelease
    side_effects:
      - "SENT <-> REVISION_REQUESTED is a cycle capped at 3 revisions (validations priority 35)"
      - "-> SIGNED sets the linked Asset.depiction_status = OBTAINED when approval_rights == NONE, otherwise leaves it PENDING pending the approval decision"
      - "SIGNED -> APPROVAL_GRANTED sets Asset.depiction_status = OBTAINED; SIGNED -> APPROVAL_WITHHELD and -> REFUSED set it BLOCKED"
      - "runs production_clearance_posture (a single BLOCKED depiction forces posture BLOCKED)"
      - "increments SubjectRelease.version, Asset.version and Production.version by 1"

  # --- ClearanceChart ------------------------------------------------------
  - method: POST
    path: "/productions/{id}/clearance-charts"
    description: "Pin the clearance chart / rights chart: a version-locked snapshot of every asset's rights basis and covered legs. Optimistically concurrent on the production's version."
    roles: [ClearanceSupervisor, LegalCounsel]
    code: 201
    input: [chart_label, expected_production_version]
    output: ClearanceChart
    side_effects:
      - "412 ERR_STALE_PRODUCTION_VERSION when expected_production_version != Production.version"
      - "rejected with ERR_PRODUCTION_POSTURE_BLOCKED when posture == BLOCKED (validations priority 14)"
      - "pinned_rows snapshots {asset_id, asset_version, rights_basis, licensing_status, depiction_status, covered_legs, license_ids} per asset, ordered by Asset.created_at ASC; pinned_row_count = its length"
      - "pinned_opinion_letter_ids collects every ISSUED OpinionLetter backing a FAIR_USE row"
      - "music_leg_gap_count counts MUSIC rows missing MASTER or PUBLISHING coverage"
      - "any previously PINNED or STALE chart of the production transitions to SUPERSEDED"
      - "status = PINNED; increments Production.version by 1"

  - method: GET
    path: "/clearance-charts/{id}"
    description: "Read a pinned chart, including whether it has since gone STALE."
    roles: [ClearanceSupervisor, LegalCounsel, ProductionAdmin]
    code: 200
    input: []
    output: ClearanceChart
    side_effects: []

  # --- EOApplication -------------------------------------------------------
  - method: POST
    path: "/productions/{id}/eo-applications"
    description: "Start an errors-and-omissions insurance application against a pinned clearance chart."
    roles: [ProductionAdmin, ClearanceSupervisor]
    code: 201
    input: [clearance_chart_id, coverage_limit_cents, retention_cents]
    output: EOApplication
    side_effects:
      - "validates the chart belongs to this production (priority 19) and the coverage limit (priority 43)"
      - "status = DRAFT, legal_review_status = PENDING, underwriting_review_status = PENDING, premium_cents = null, policy_number = null"

  - method: GET
    path: "/eo-applications/{id}"
    description: "Read an E&O application with both review branches and the rated premium."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel]
    code: 200
    input: []
    output: EOApplication
    side_effects: []

  - method: GET
    path: "/eo-applications"
    description: "Filtered E&O list. FK reverse-reachability for EOApplication.production_id and EOApplication.clearance_chart_id."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel]
    code: 200
    input: ["production_id?", "clearance_chart_id?", "status?", "limit?", "offset?"]
    output: EOApplication[]
    side_effects: []

  - method: POST
    path: "/eo-applications/{id}/reviews"
    description: "Record one of the two parallel review branches (legal or underwriting). Segregation of duties applies."
    roles: [LegalCounsel, ClearanceSupervisor]
    code: 200
    input: [review_type, outcome, "notes?"]
    output: EOApplication
    side_effects:
      - "review_type == LEGAL requires LegalCounsel; UNDERWRITING requires ClearanceSupervisor (validations priority 25)"
      - "403 ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID issued any OpinionLetter pinned on the application's chart, or already recorded the other review branch (priority 23)"
      - "stamps legal_review_status / underwriting_review_status and legal_reviewer_user_id / underwriting_reviewer_user_id"
      - "when both branches are PASSED, IN_REVIEW -> CLEARED_TO_BIND (the join); when the first recorded review FAILS, SUBMITTED -> DECLINED; when the second FAILS, IN_REVIEW -> DECLINED"
      - "increments EOApplication.version by 1"

  - method: POST
    path: "/eo-applications/{id}/state"
    description: "Submit for rating, bind the policy, decline, or re-open for remediation."
    roles: [ProductionAdmin, ClearanceSupervisor]
    code: 200
    input: [to_status, "policy_number?", "reason?"]
    output: EOApplication
    side_effects:
      - "DRAFT -> SUBMITTED runs eo_premium_cents against the chart's pinned rows and stamps premium_cents, then forks into IN_REVIEW with both branches PENDING"
      - "-> SUBMITTED requires the chart to be PINNED and not SUPERSEDED (priorities 20, 21) and posture != BLOCKED (priority 14)"
      - "-> BOUND requires CLEARED_TO_BIND with both branches PASSED (priority 44) and stamps policy_number"
      - "-> DECLINED is the divergent branch: it clears premium_cents to null and forbids any delivery"
      - "REMEDIATION_REQUIRED -> BOUND re-binds the same policy once the lapse is cured, a cycle; premium_cents and both review statuses are retained, not re-rated"
      - "increments EOApplication.version by 1"

  # --- DeliveryPackage -----------------------------------------------------
  - method: POST
    path: "/productions/{id}/delivery-packages"
    description: "Assemble the distributor delivery package: cue sheet plus rights chart, drawn from a pinned clearance chart."
    roles: [ProductionAdmin, ClearanceSupervisor]
    code: 201
    input: [clearance_chart_id, distributor_name, window_class]
    output: DeliveryPackage
    side_effects:
      - "cue_sheet_row_count = the chart's MUSIC pinned rows, rights_chart_row_count = the chart's pinned_row_count, music_leg_gap_count copied from the chart"
      - "status = DRAFT"

  - method: GET
    path: "/delivery-packages/{id}"
    description: "Read a delivery package with its cue-sheet and rights-chart row counts."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel]
    code: 200
    input: []
    output: DeliveryPackage
    side_effects: []

  - method: GET
    path: "/delivery-packages"
    description: "Filtered delivery list. FK reverse-reachability for DeliveryPackage.production_id and DeliveryPackage.clearance_chart_id."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel]
    code: 200
    input: ["production_id?", "clearance_chart_id?", "status?", "limit?", "offset?"]
    output: DeliveryPackage[]
    side_effects: []

  - method: POST
    path: "/delivery-packages/{id}/state"
    description: "Validate, deliver, suspend, or withdraw a delivery package."
    roles: [ClearanceSupervisor, ProductionAdmin]
    code: 200
    input: [to_status, "reason?"]
    output: DeliveryPackage
    side_effects:
      - "-> VALIDATED enforces music_leg_gap_count == 0 (priority 26) and window-class sufficiency (priority 27) after the chart-freshness checks (priorities 20, 21)"
      - "-> DELIVERED requires posture == OPEN (priority 15) and a BOUND EOApplication (priority 28)"
      - "DELIVERED -> SUSPENDED is system-driven only (rights-sweep step 4c or the opinion-letter withdrawal cascade) and stamps suspension_reason; it is not requestable through this endpoint"
      - "increments DeliveryPackage.version by 1"

  # --- Ops / test-driving --------------------------------------------------
  - method: POST
    path: "/productions/{id}/rights-sweep"
    description: "Run the expiring-license sweep: activate, expire, flag EXPIRING, then cascade to assets, posture, delivery packages and E&O. Idempotent per clock instant apart from sweep_epoch."
    roles: [ClearanceSupervisor, ProductionAdmin]
    code: 200
    input: []
    output: "{ sweep_epoch: integer, activated_license_ids: string[], expired_license_ids: string[], expiring_license_ids: string[], lapsed_asset_ids: string[], suspended_delivery_package_ids: string[], remediated_eo_application_ids: string[], production_posture: string, committed_fee_cents: integer }"
    side_effects:
      - "runs rights_sweep_epoch steps 1-4 in the pinned order, each step created_at ASC"
      - "debits Production.committed_fee_cents for every expired licence"
      - "increments Production.sweep_epoch and Production.version by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to wall-clock time."
    roles: [ProductionAdmin, ClearanceSupervisor, LegalCounsel, ArchiveResearcher, RightsHolderRep]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "all subsequent date comparisons (renewal window, term activation and expiry, depiction windows) use this instant"
      - "does not itself run any sweep or recomputation"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_ARCHIVE_OWNERSHIP_MISMATCH
    http: 403
    condition: "a RightsHolderRep acts on a licence or rate card belonging to an archive other than its own X-User-ID"
  - id: ERR_PARTY_ROLE_MISMATCH
    http: 403
    condition: "negotiation round party == LICENSOR from a producer-side role, or party == PRODUCER from a RightsHolderRep"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID recording an E&O review issued an opinion letter pinned on the application's chart, or already recorded the other review branch"
  - id: ERR_REVIEW_TYPE_ROLE_MISMATCH
    http: 403
    condition: "review_type == LEGAL recorded by a non-LegalCounsel role, or review_type == UNDERWRITING recorded by a non-ClearanceSupervisor role"

  # --- existence ----------------------------------------------------------
  - id: ERR_PRODUCTION_NOT_FOUND
    http: 404
    condition: "no Production with the given id"
  - id: ERR_ARCHIVE_NOT_FOUND
    http: 404
    condition: "no Archive with the given id"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "no Asset with the given id"
  - id: ERR_SOURCE_CANDIDATE_NOT_FOUND
    http: 404
    condition: "no SourceCandidate with the given id, or it belongs to a different asset"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "no License with the given id"
  - id: ERR_FAIR_USE_ANALYSIS_NOT_FOUND
    http: 404
    condition: "no FairUseAnalysis with the given id"
  - id: ERR_OPINION_LETTER_NOT_FOUND
    http: 404
    condition: "no OpinionLetter with the given id"
  - id: ERR_SUBJECT_RELEASE_NOT_FOUND
    http: 404
    condition: "no SubjectRelease with the given id"
  - id: ERR_CLEARANCE_CHART_NOT_FOUND
    http: 404
    condition: "no ClearanceChart with the given id"
  - id: ERR_EO_APPLICATION_NOT_FOUND
    http: 404
    condition: "no EOApplication with the given id"
  - id: ERR_DELIVERY_PACKAGE_NOT_FOUND
    http: 404
    condition: "no DeliveryPackage with the given id"

  # --- payload ------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, negative money or duration, unparseable date, timecode_out_seconds <= timecode_in_seconds, or term_months < 1"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_PRODUCTION_VERSION
    http: 412
    condition: "expected_production_version does not match the Production's current version when pinning a clearance chart"
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_license_version does not match the License's current version when appending a negotiation round"

  # --- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested to_status is not reachable from the resource's current state, including any attempt to leave a terminal state"
  - id: ERR_PRODUCTION_NOT_IN_CLEARANCE
    http: 409
    condition: "new assets, licences, releases or analyses requested on a production whose status is not DEVELOPMENT or CLEARANCE"
  - id: ERR_LICENSE_NOT_QUOTED
    http: 409
    condition: "execution requested on a licence that is not QUOTED, or renewal requested on a licence that is not ACTIVE or EXPIRING"
  - id: ERR_NO_SELECTED_SOURCE
    http: 409
    condition: "a FOOTAGE licence requested for an asset with no SELECTED source candidate, or naming an archive other than the selected candidate's archive"
  - id: ERR_NO_AVAILABLE_SOURCE
    http: 409
    condition: "source selection requested when no candidate of the asset has availability_status == AVAILABLE"
  - id: ERR_ARCHIVE_SUSPENDED
    http: 409
    condition: "a licence, execution, or rate card requested against an Archive whose status is SUSPENDED"
  - id: ERR_PRODUCTION_POSTURE_BLOCKED
    http: 409
    condition: "chart pinning, E&O submission, or delivery validation requested while Production.posture == BLOCKED"
  - id: ERR_PRODUCTION_POSTURE_RESTRICTED
    http: 409
    condition: "delivery or production lock requested while Production.posture == RESTRICTED (non-blocking gaps remain, so OPEN is required)"
  - id: ERR_CHART_STALE
    http: 409
    condition: "the referenced ClearanceChart has status STALE because a pinned row's asset_version no longer matches the live Asset.version"
  - id: ERR_CHART_SUPERSEDED
    http: 409
    condition: "the referenced ClearanceChart has been superseded by a later pinning on the same production"
  - id: ERR_NO_ISSUED_OPINION_LETTER
    http: 409
    condition: "acceptance requested on a fair-use analysis with no OpinionLetter in status ISSUED"
  - id: ERR_REVIEW_ALREADY_RECORDED
    http: 409
    condition: "the same review_type recorded twice on one E&O application"
  - id: ERR_REVIEWS_INCOMPLETE
    http: 409
    condition: "binding requested before both legal_review_status and underwriting_review_status are PASSED"
  - id: ERR_EO_NOT_BOUND
    http: 409
    condition: "delivery requested with no BOUND EOApplication on the production"
  - id: ERR_NO_DELIVERED_PACKAGE
    http: 409
    condition: "production delivery requested with no DeliveryPackage in status DELIVERED"
  - id: ERR_CUE_SHEET_INCOMPLETE
    http: 409
    condition: "delivery validation requested while a pinned MUSIC row is missing its MASTER or PUBLISHING leg (music_leg_gap_count > 0)"
  - id: ERR_WINDOW_CLASS_INSUFFICIENT
    http: 409
    condition: "an ALL_MEDIA_WINDOW delivery package rests on a licence whose window_class is FESTIVAL_ONLY"
  - id: ERR_NO_APPROVAL_RIGHTS
    http: 409
    condition: "an approval decision requested on a release whose approval_rights == NONE"
  - id: ERR_LICENSES_STILL_LIVE
    http: 409
    condition: "abandonment requested while a licence of the production is EXECUTED, ACTIVE or EXPIRING"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 409
    condition: "a seventh negotiation round requested on one licence"
  - id: ERR_RELEASE_REVISION_LIMIT
    http: 409
    condition: "a fourth revision cycle requested on one subject release"
  - id: ERR_LICENSE_TERM_OVERLAP
    http: 409
    condition: "the requested half-open term intersects a live sibling licence on the same asset with the same rights leg and overlapping media and territory (adjacency at the boundary date is allowed)"
  - id: ERR_DEPICTION_WINDOW_CONFLICT
    http: 409
    condition: "the requested depiction window, widened by the 30-day quiet buffer, intersects a live release for the same subject_person_key on the same production"
  - id: ERR_OUTSIDE_RENEWAL_WINDOW
    http: 409
    condition: "renewal requested when the logical clock is more than 60 whole days before term_end_date"

  # --- referential / semantic --------------------------------------------
  - id: ERR_ASSET_PRODUCTION_MISMATCH
    http: 422
    condition: "the referenced Asset does not belong to the referenced Production"
  - id: ERR_CHART_PRODUCTION_MISMATCH
    http: 422
    condition: "the referenced ClearanceChart does not belong to the addressed Production"
  - id: ERR_NO_ACTIVE_RATE_CARD
    http: 422
    condition: "the archive has no RateCard with status ACTIVE whose effective_from_date is on or before the licence's term_start_date"
  - id: ERR_MUSIC_LEG_REQUIRED
    http: 422
    condition: "rights_leg FOOTAGE requested for a MUSIC asset, or MASTER/PUBLISHING requested for an ARCHIVAL_FOOTAGE asset"
  - id: ERR_TERM_DATES_INVALID
    http: 422
    condition: "term_start_date >= term_end_date, or term_months inconsistent with the whole-month span between them"
  - id: ERR_INVALID_RENEWAL_TERM
    http: 422
    condition: "additional_term_months is absent, zero, or negative"
  - id: ERR_FAIR_USE_SCORE_INSUFFICIENT
    http: 422
    condition: "acceptance requested on a fair-use analysis whose strength_score is below 0.6000"
  - id: ERR_COVERAGE_LIMIT_INVALID
    http: 422
    condition: "coverage_limit_cents < 100000 or retention_cents >= coverage_limit_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ProductionAdmin
    description: "The production's own clearance producer: opens the production file, logs assets, opens licences, papers releases, assembles delivery packages and files the E&O application."
    identity: opaque
    exclusive_operations:
      - "POST /productions"
      - "POST /productions/{id}/state (to_status IN {CLEARANCE, ABANDONED})"
    shared_operations:
      - "POST /archives"
      - "POST /productions/{id}/assets"
      - "POST /licenses"
      - "POST /licenses/{id}/negotiation-rounds (party=PRODUCER only)"
      - "POST /licenses/{id}/state"
      - "POST /productions/{id}/subject-releases"
      - "POST /subject-releases/{id}/state"
      - "POST /productions/{id}/eo-applications"
      - "POST /eo-applications/{id}/state"
      - "POST /productions/{id}/delivery-packages"
      - "POST /delivery-packages/{id}/state"
      - "POST /productions/{id}/rights-sweep"
      - "POST /_clock/set_current_utc"
      - "all GET reads except GET /archives/{id}/source-candidates"

  - name: ArchiveResearcher
    description: "Footage researcher who identifies assets, logs source candidates at holding archives, and maintains archive rate cards."
    identity: opaque
    exclusive_operations:
      - "POST /assets/{id}/source-candidates"
    shared_operations:
      - "POST /archives"
      - "POST /archives/{id}/rate-cards"
      - "POST /productions/{id}/assets"
      - "POST /assets/{id}/select-source"
      - "POST /_clock/set_current_utc"
      - "GET /productions/{id}, GET /assets, GET /assets/{id}, GET /assets/{id}/source-candidates, GET /archives/{id}, GET /archives/{id}/rate-cards, GET /archives/{id}/source-candidates, GET /licenses"

  - name: ClearanceSupervisor
    description: "Head of clearances: suspends archives, executes and renews licences, pins the clearance chart, records the underwriting review, and gates delivery."
    identity: opaque
    exclusive_operations:
      - "POST /archives/{id}/state"
      - "POST /licenses/{id}/renew"
      - "POST /productions/{id}/state (to_status IN {LOCKED, DELIVERED})"
      - "POST /eo-applications/{id}/reviews (review_type=UNDERWRITING only)"
    shared_operations:
      - "POST /licenses"
      - "POST /licenses/{id}/negotiation-rounds (party=PRODUCER only)"
