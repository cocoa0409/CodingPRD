          Conserved quantity 1 — the per-ticket fare identity
          sum(Coupon.allocated_amount_minor) + Ticket.unallocated_residual_minor ==
          Ticket.total_fare_minor. It reads 12000+66601+21399+0 == 100000 after the FINAL run
          and 0+0+0+100000 == 100000 after the compensating void-proration, with zero drift
          even though the SPA_FLAT coupon was allocated off the top rather than by weight.
