  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_date_must_equal_visit_date_point_overlap
        grounds:
          - state_machines.Visit.SCHEDULED_to_DISPATCHED
          - validations[priority=13]
          - entities.CrewRoute.fields.route_date
        distinguishing_aspect: "CrewRoute occupies a single calendar-day point: a visit may only be dispatched onto a route whose route_date EXACTLY equals visit.scheduled_date (point-equality interval semantics); a route dated 2026-05-02 rejects a 2026-05-01 visit with ERR_REGION_MISMATCH."
        test_recipe:
          setup:
            - "An OPEN route in NE01 dated 2026-05-02; a SCHEDULED RECURRING visit dated 2026-05-01 in NE01."
