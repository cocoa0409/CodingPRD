scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_family_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Family.fields.autopay_enabled
          - entities.Family.fields.account_credit_cents
          - entities.Family.fields.status
        distinguishing_aspect: "POST /families with email+family_name -> 201; autopay_enabled=false, account_credit_cents=0, payment_method_on_file=false, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /families"
              payload: { email: "new@x.com", family_name: "New" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
          assert:
            - "Family.${fam_id}.status == ACTIVE"
            - "Family.${fam_id}.autopay_enabled == false"
            - "Family.${fam_id}.account_credit_cents == 0"
            - "Family.${fam_id}.payment_method_on_file == false"

      - name: family_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /families/{bogus-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /families/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

      - name: create_section_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=20]"]
        distinguishing_aspect: "POST /sections omitting monthly_tuition_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A term, room, instructor exist."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "I", email: "i1@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, capacity_cap: 20 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: create_section_invalid_age_band_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=20]", entities.ClassSection.fields.max_age]
        distinguishing_aspect: "POST /sections with max_age < min_age -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A term, room, instructor exist."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "T2", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R2", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "I2", email: "i2@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 12, max_age: 8, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: computed_age_as_of_cutoff_floor
        claim_type: Computed Fields
        grounds: [calculations.student_age_as_of_cutoff, entities.Student.fields.age_as_of_cutoff]
        distinguishing_aspect: "A student born 2018-06-01 against age_cutoff_date 2026-02-01 computes age_as_of_cutoff=7 (birthday not yet reached in the cutoff year -> floored)."
        test_recipe:
          setup: ["Term with age_cutoff_date 2026-02-01; a family; placement evaluated when enrolling into a section min_age 6 max_age 8."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Age T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Age R", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Age I", email: "agei@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "BALLET", required_level: "PETITE", min_age: 6, max_age: 8, monthly_tuition_cents: 5000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "agefam@x.com", family_name: "Age" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Young", birth_date: "2018-06-01", level: "PETITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.placement_status == CONFIRMED"
            - "Student.${stu_id}.age_as_of_cutoff == 7"

      - name: attendance_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Attendance.common_fields]
        distinguishing_aspect: "Attendance is common_fields:false (only id, created_at) — corrections go through POST /attendance/{id}/amend, not a generic update; the entity carries no version field."
        test_recipe:
          setup: ["A confirmed enrollment with one session; one PRESENT attendance marked."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Att T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Att R", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Att I", email: "atti@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "attfam@x.com", family_name: "Att" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "Att Kid", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/attendance"
              payload: { session_id: "${sess_id}", occurred_on: "2026-02-02", result: "PRESENT" }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { att_id: $.data.id }
          assert:
            - "Attendance.${att_id}.result == PRESENT"
            - "Attendance.${att_id}.makeup_eligible == false"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_dropped_enrollment_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Enrollment.PENDING_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_before_fiscal_on_enrollment_confirm
          rationale: "The state-precondition rejection of a confirm against a DROPPED enrollment is asserted there."

      - name: lock_already_locked_team_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CompetitionTeam.FORMING_to_LOCKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Locking a team already LOCKED -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A team locked once."]
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Lk", min_level: "NOVICE", roster_cap: 5 }
              as: StudioAdmin
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/lock"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /teams/${team_id}/lock"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "CompetitionTeam.${team_id}.status == LOCKED"

      - name: open_term_requires_scheduled_section
        claim_type: precondition_violation
        grounds: [state_machines.Term.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening a term with no SCHEDULED section (precondition fails) -> ERR_INVALID_STATE (409); term stays DRAFT."
        test_recipe:
          setup: ["A DRAFT term with NO sections."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Empty T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Term.${term_id}.status == DRAFT"

      - name: terminal_recital_complete_blocks_further_transition
        claim_type: terminal_lockdown
        grounds: [state_machines.Recital.ON_SALE_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After a recital is COMPLETED, calling open-sales again -> ERR_INVALID_STATE; COMPLETED is terminal."
        test_recipe:
          setup: ["Term OPEN; recital ON_SALE; clock advanced past show; recital completed."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Comp R T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "CRR", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "CRI", email: "cri@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /terms/${term_id}/recitals"
              payload: { name: "Final", show_datetime: "2026-06-20T19:00:00Z", total_seats: 5, ticket_price_cents: 2000, free_tickets_per_family: 0 }
              as: StudioAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recitals/${rec_id}/open-sales"
              payload: {}
              as: StudioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /recitals/${rec_id}/complete"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /recitals/${rec_id}/open-sales"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Recital.${rec_id}.status == COMPLETED"

      - name: term_close_blocked_by_unpaid_invoice
        claim_type: precondition_violation
        grounds: [state_machines.Term.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a term with an OPEN (non-PAID/VOID) invoice -> ERR_INVALID_STATE; term stays OPEN."
        test_recipe:
          setup: ["Term OPEN; a family with a CONFIRMED enrollment and an OPEN invoice generated."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Close T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "CT R", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "CT I", email: "cti@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "ctfam@x.com", family_name: "CT" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "CT Kid", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
            - call: "POST /invoices/generate"
              payload: { family_id: "${fam_id}", term_id: "${term_id}", billing_month: "2026-02" }
              as: StudioAdmin
          trigger:
            - call: "POST /terms/${term_id}/close"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Term.${term_id}.status == OPEN"

      - name: waitlist_assignment_when_section_full
        claim_type: valid_transition
        grounds: [state_machines.Enrollment.PENDING_to_WAITLISTED, entities.Enrollment.fields.waitlist_rank]
        distinguishing_aspect: "Enrolling into a FULL section (cap 1, already filled) yields placement_status WAITLISTED with waitlist_rank 1."
        test_recipe:
          setup: ["Section cap 1, one CONFIRMED enrollment occupying it (section FULL); a second student to enroll."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "WL T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "WL R", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "WL I", email: "wli@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 1 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "wlfam@x.com", family_name: "WL" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "WL One", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "WL Two", birth_date: "2014-02-01", level: "ELITE" }
              as: StudioAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec_id}" }
              as: StudioAdmin
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${s2_id}", section_id: "${sec_id}" }
              as: StudioAdmin
              captures: { enr2_id: $.data.id }
          assert:
            - "Enrollment.${enr2_id}.placement_status == WAITLISTED"
            - "Enrollment.${enr2_id}.waitlist_rank == 1"

      - name: invoice_void_restores_credit
        claim_type: compensation
        grounds: [state_machines.Invoice.OPEN_to_VOID, entities.Family.fields.account_credit_cents]
        distinguishing_aspect: "Voiding an OPEN invoice that applied 1500 credit returns 1500 to Family.account_credit_cents (credit conserved)."
        test_recipe:
          setup: ["Term OPEN; family with 1500 account credit and a CONFIRMED enrollment; invoice generated applying credit."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "Void T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "VR", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "VI", email: "vi@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "vfam@x.com", family_name: "V" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/credit"
              payload: { amount_cents: 1500 }
              as: StudioAdmin
            - call: "POST /families/${fam_id}/students"
              payload: { full_name: "V Kid", birth_date: "2014-01-01", level: "ELITE" }
              as: StudioAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
            - call: "POST /invoices/generate"
              payload: { family_id: "${fam_id}", term_id: "${term_id}", billing_month: "2026-02" }
              as: StudioAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: StudioAdmin
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "Family.${fam_id}.account_credit_cents == 1500"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: invoice_credit_waterfall_partial
        claim_type: Correct Result
        grounds: [calculations.invoice_totals, entities.Invoice.fields.credit_applied_cents, entities.Invoice.fields.amount_due_cents]
        distinguishing_aspect: "Family with 3000 credit, one CONFIRMED enrollment tuition 8000 -> credit_applied_cents=3000, amount_due_cents=5000; leftover credit 0."
        test_recipe:
          setup: ["Term OPEN; family with 3000 credit; one student CONFIRMED in an 8000 class."]
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "WF T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "WFR", capacity: 10 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "WFI", email: "wfi@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
            - call: "POST /terms/${term_id}/open"
              payload: {}
              as: StudioAdmin
            - call: "POST /families"
              payload: { email: "wffam@x.com", family_name: "WF" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/credit"
