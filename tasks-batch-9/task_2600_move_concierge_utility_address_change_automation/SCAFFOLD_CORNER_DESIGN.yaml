  - section: endpoints
    instances:

      - name: standard_crud_referral_partner_create_and_read_round_trip
        claim_type: standard_crud
        grounds:
          - "endpoints[POST /referral-partners]"
          - "endpoints[GET /referral-partners/{id}]"
          - entities.ReferralPartner.fields.partner_status
          - entities.ReferralPartner.fields.rev_share_pct
        distinguishing_aspect: |
          The reference-data write nothing else round-trips: a 4-decimal rate and a payout model
          whose sibling amount field must keep its default, read back through the GET to prove the
          representation survives storage (0.3000 must not come back as 0.3 rounded to a different
          scale, and bounty_cents must be 0 rather than null).
        test_recipe:
          setup:
            - "An empty partner table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /referral-partners"
              payload: { name: "Skyline Fiber", vertical: "INTERNET", payout_model: "REV_SHARE_PCT", rev_share_pct: 0.3000, attribution_window_days: 14, attribution_basis: "PLACEMENT_ACCEPTANCE", monthly_placement_cap: 5 }
              as: PlatformAdmin
              captures: { pa_id: $.data.id }
            - call: "GET /referral-partners/${pa_id}"
              payload: {}
              as: MoveOpsAgent
          assert:
            - "trigger call 1 returns HTTP 201 with data.partner_status == ACTIVE, data.bounty_cents == 0 and data.version == 1"
            - "trigger call 2 returns HTTP 200 with the identical id, name Skyline Fiber, vertical INTERNET, payout_model REV_SHARE_PCT, rev_share_pct 0.3000, attribution_window_days 14, attribution_basis PLACEMENT_ACCEPTANCE and monthly_placement_cap 5"
            - "the read reports the same created_at and updated_at as the write and leaves version at 1"
            - "the success envelope of both calls carries meta.api_request_id and meta.api_request_timestamp with response_type set for the endpoint"

      - name: cross_reference_link_mapping_prefers_the_default_carrier_over_the_better_rank
        claim_type: cross_reference_link
        grounds:
          - "endpoints[POST /provider-service-territories]"
          - "endpoints[GET /provider-service-territories]"
          - "endpoints[POST /moves/{id}/provider-mapping]"
          - entities.ProviderServiceTerritory.fields.priority_rank
          - entities.ProviderServiceTerritory.fields.is_default_carrier
        distinguishing_aspect: |
          The junction entity's selection order asserted where its two clauses disagree: the
          winning territory is chosen by is_default_carrier DESC before priority_rank ASC, so a
          default carrier at rank 5 must beat a non-default at rank 1. The created order's
          territory_id and provider_id must both name the winner, which is what makes the
          many-to-many link observable from the order rather than only from the territory list.
        test_recipe:
          setup:
            - "Two electric providers, both covering postal 30302: the better-ranked one is not the default carrier, the worse-ranked one is."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
