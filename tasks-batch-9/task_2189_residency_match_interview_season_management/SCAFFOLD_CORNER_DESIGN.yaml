      - name: closing_a_wave_expires_the_issued_and_the_waitlisted_invitation_together
        claim_type: side_effect_execution
        grounds:
          - state_machines.InterviewWave.RELEASED->CLOSED
          - state_machines.InterviewInvitation.ISSUED->EXPIRED
          - state_machines.InterviewInvitation.WAITLISTED->EXPIRED
        distinguishing_aspect: >
