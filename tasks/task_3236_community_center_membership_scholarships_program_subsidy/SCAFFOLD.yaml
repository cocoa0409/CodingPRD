# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role lacks permission, or Member acts on a resource they do not own, or non-admin creates BLACKOUT reservation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, dropin_capacity > capacity, licensed childcare program without ratio" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_BRANCH_NOT_FOUND, http: 404, condition: "branch_id body FK does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member_id / primary_member_id / donor_member_id / renter_member_id does not resolve" }
  - { id: ERR_CATEGORY_NOT_FOUND, http: 404, condition: "category_id does not resolve, or belongs to a different branch than the membership" }
  - { id: ERR_SPACE_NOT_FOUND, http: 404, condition: "space_id does not resolve" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "session_id does not resolve" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "renews_application_id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in a state that forbids the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member email already registered in this association" }
  - { id: ERR_DUPLICATE_BRANCH_CODE, http: 409, condition: "Branch code already used in this association" }
  - { id: ERR_DUPLICATE_DRAFT, http: 409, condition: "A draft already exists for this membership and period_month" }
  - { id: ERR_DUPLICATE_ACTIVE_AWARD, http: 409, condition: "Membership already has an APPROVED scholarship application" }
  - { id: ERR_CAMPAIGN_ALREADY_ACTIVE, http: 409, condition: "Association already has an ACTIVE campaign" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Donation receive requires campaign status ACTIVE" }
  - { id: ERR_HOUSEHOLD_CAP_EXCEEDED, http: 409, condition: "member_ids violate category max_adults / max_dependents given member ages" }
  - { id: ERR_DOCUMENTATION_MISSING, http: 400, condition: "documentation array empty or lacks TAX_RETURN / PAY_STUB / BENEFITS_LETTER" }
  - { id: ERR_AWARD_INELIGIBLE, http: 409, condition: "income_ratio >= 0.80; application must be denied, not approved" }
  - { id: ERR_POOL_EXHAUSTED, http: 409, condition: "branch.scholarship_pool_available_cents < award_obligation_cents at approve time" }
  - { id: ERR_POOL_WOULD_GO_NEGATIVE, http: 409, condition: "SCHOLARSHIP refund would make branch pool available negative" }
  - { id: ERR_HOLD_WINDOW_INVALID, http: 409, condition: "hold duration < 30 days or > 180 days, or hold_until not in the future" }
  - { id: ERR_HOLD_ALLOWANCE_EXCEEDED, http: 409, condition: "requested hold would push trailing-12-month hold days beyond 120" }
  - { id: ERR_REINSTATE_WINDOW_PASSED, http: 409, condition: "reinstate attempted more than 90 days after lapse, or FAILED drafts remain unsettled" }
  - { id: ERR_REGISTRATION_WINDOW_CLOSED, http: 409, condition: "session registration not open (before member_opens_on or session not in REG_OPEN)" }
  - { id: ERR_MEMBER_PRIORITY_ONLY, http: 409, condition: "member-priority window active; only HOME_MEMBER registrants accepted" }
  - { id: ERR_MEMBER_ONLY_PROGRAM, http: 409, condition: "program.member_only and registrant_class is NON_MEMBER or RECIPROCITY_VISITOR" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "session closed to waitlist (REG_CLOSED) while a registration is attempted" }
  - { id: ERR_RATIO_CAPACITY_EXCEEDED, http: 409, condition: "licensed childcare ratio would be exceeded (staff removal below required level) " }
  - { id: ERR_TIME_RANGE_INVALID, http: 400, condition: "end <= start on session dates/times or reservation times" }
  - { id: ERR_SPACE_CONFLICT, http: 409, condition: "reservation overlaps an APPROVED reservation on the same space, buffers included; or APPROVED BLACKOUT covers the interval" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_PARTICIPANT_AGE_INVALID, http: 409, condition: "participant age outside program [min_age, max_age] at session start_on" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssociationAdmin
    description: "Association-level administrator; owns campaigns, associations, cross-branch governance, BLACKOUT reservations, donation refunds, the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /associations"
      - "POST /branches"
      - "POST /campaigns, /campaigns/{id}/activate, /campaigns/{id}/close"
      - "POST /donations/{id}/refund"
      - "POST /_clock/set_current_utc"
      - "BLACKOUT reservation creation"
    shared_operations:
      - "read endpoints across the association"
      - "membership create/update, draft creation/fail, donation receive"

  - name: BranchDirector
    description: "Branch executive; adjudicates scholarships, approves reservations, reinstates memberships"
    identity: "opaque"
    exclusive_operations:
      - "POST /scholarship-applications/{id}/review | request-info | approve | deny"
      - "POST /reservations/{id}/approve | deny"
      - "POST /memberships/{id}/reinstate"
    shared_operations:
      - "membership hold/resume/cancel, session management, donation pledge/receive, draft settle/fail"

  - name: ProgramCoordinator
    description: "Runs programs and sessions at a branch"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs (create program)"
      - "POST /sessions/{id}/staff"
      - "POST /sessions/{id}/close-registration"
    shared_operations:
      - "session create/cancel, registration create/cancel, reservation request/cancel"

  - name: FrontDesk
    description: "Front-desk staff; registers members, takes payments, books on behalf"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "member registration, membership create, registration create/cancel, draft settle, donation pledge, scholarship application submit on behalf"

  - name: Member
    description: "An entity-backed member acting on their own resources"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /scholarship-applications/{id}/submit-info (applicant only)"
    shared_operations:
      - "own membership create/hold/resume/cancel, own registrations create/cancel, own application submit, reads of own resources"

  - name: BoardMember
    description: "Association/branch board volunteer; read-only governance visibility"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "read-only GETs on associations, branches, campaigns, donations, categories, programs, sessions"
