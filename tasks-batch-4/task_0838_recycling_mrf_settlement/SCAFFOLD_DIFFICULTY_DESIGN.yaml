  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: downtime_closed_interval_adjacency_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_DOWNTIME_OVERLAP]
          - entities.DowntimeEvent.fields.start_at
        distinguishing_aspect: |
          Resource SortLine, closed-interval semantics: an existing downtime [08:00,10:00] and a
          new event [10:00,11:00] share the endpoint 10:00; because downtime intervals are closed,
          adjacency counts as a conflict -> ERR_DOWNTIME_OVERLAP.
        test_recipe:
          setup:
            - "SortLine with one downtime event [2026-03-01T08:00Z, 2026-03-01T10:00Z]."
          setup_api_calls:
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/downtime-events"
              payload: { sort_line_id: "${sl_id}", start_at: "2026-03-01T08:00:00Z", end_at: "2026-03-01T10:00:00Z", reason: "jam" }
              as: SortManager
              captures: { dt1_id: $.data.id }
          trigger:
            - call: "POST /mrf/downtime-events"
              payload: { sort_line_id: "${sl_id}", start_at: "2026-03-01T10:00:00Z", end_at: "2026-03-01T11:00:00Z", reason: "maintenance" }
              as: SortManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DOWNTIME_OVERLAP"
            - "http_status == 409"

      - name: index_half_open_interior_overlap_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_INDEX_WINDOW_OVERLAP]
          - state_machines.CommodityIndex.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Resource CommodityIndex (per commodity), half-open [start,end) semantics: publishing a
          second OCC window [03-10,03-20) that interior-overlaps an existing PUBLISHED [03-01,03-15)
          is rejected; unlike downtime, an adjacent window [03-15,03-20) would be allowed.
        test_recipe:
          setup:
            - "OCC index [03-01,03-15) 8000 PUBLISHED; a second OCC DRAFT index [03-10,03-20) 8100 created."
          setup_api_calls:
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-03-15T00:00:00Z" }
              as: CommodityTrader
              captures: { idx1_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx1_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8100, effective_start: "2026-03-10T00:00:00Z", effective_end: "2026-03-20T00:00:00Z" }
              as: CommodityTrader
              captures: { idx2_id: $.data.id }
          trigger:
            - call: "POST /mrf/commodity-indices/${idx2_id}/publish"
              payload: {}
              as: CommodityTrader
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INDEX_WINDOW_OVERLAP"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_bale_conserves_load_tonnage
        grounds:
          - state_machines.Bale.BALED_to_VOIDED
          - calculations.load_mass_balance
          - entities.InboundLoad.fields.unbaled_remaining_tons
          - entities.InboundLoad.fields.net_tons
        distinguishing_aspect: |
          Conserved quantity = tonnage: with net_tons=20, a bale of 8 tons drops
          unbaled_remaining_tons to 12; voiding it restores unbaled_remaining_tons to 20, keeping
          net_tons invariant (baled+residual+unbaled == 20 throughout).
        test_recipe:
          setup:
            - "PUBLISHED OCC index covers clock; load net_tons=20 audited; one OCC bale net_tons=8 (unbaled_remaining_tons=12)."
          setup_api_calls:
