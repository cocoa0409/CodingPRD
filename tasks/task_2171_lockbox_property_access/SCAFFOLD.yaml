# =============================================================================
# task_2171 — Real Estate Lockbox & Property Access Control
# Seed tables (§1.0–§1.7). Difficulty target: beyond Expert.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2171. Real Estate Lockbox & Property Access Control
  (Supra/SentriLock style system): lockbox inventory & assignment to listings, access credential
  issuance by association membership status, one-day/temporary code generation & audit trail,
  access log review after incidents, lost/stolen box replacement & billing, lockbox removal at
  closing & recovery rate, contractor/vendor limited access windows, integration with showing
  appointments

domain_name: lockbox-property-access
api_prefix: ""   # flat topology — every entity owns a top-level collection segment

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: flat
  # Peer collections joined by foreign keys; no nesting in URL paths.

  state_machine_shape: cyclic
  # Lockbox (IN_STOCK→ASSIGNED→PLACED→ASSIGNED→IN_STOCK, MISSING→QUARANTINE→IN_STOCK),
  # AccessCredential (ACTIVE↔SUSPENDED), IncidentReview (EVIDENCE_LOCKED→CLOSED→EVIDENCE_LOCKED),
  # Listing (ACTIVE↔UNDER_CONTRACT) are cyclic; LockboxPlacement additionally carries two
  # independent parallel dimensions (placement_status × billing_status).

  relationship_patterns:
    - one_to_many          # Association→Member/Lockbox/Listing/Contractor
    - many_to_many         # AccessGrant joins Contractor × Listing × Lockbox
    - self_referential     # AccessGrant.supersedes_grant_id -> AccessGrant.id
    - cross_aggregate      # AccessEvent references Lockbox, AccessCredential, AccessGrant,
                           # ShowingAppointment and IncidentReview across aggregates

  role_model: segregation_of_duties
  # The SecurityAuditor who opens an IncidentReview may never be the auditor who closes it, and
  # no AssociationAdmin may open or close a review at all.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "REALTOR association name" }
      - { name: jurisdiction_code, type: string, source: input, description: "State/county code, e.g. WA-KING" }
      - { name: temp_code_daily_limit, type: integer, source: input, default: 3, description: "Max ONE_DAY_MEMBER grants a Member may self-issue per UTC calendar day", constraints: ">= 0" }
      - { name: temp_code_overage_fee_cents, type: integer, source: input, default: 500, description: "Fee charged when an AssociationAdmin issues a ONE_DAY_MEMBER grant for a Member already at the daily limit" }
      - { name: removal_grace_days, type: integer, source: input, default: 3, description: "Whole days after a Listing closes before its LockboxPlacement removal_deadline elapses" }
      - { name: late_removal_daily_fee_cents, type: integer, source: input, default: 1500, description: "Per-late-day base fee used by late_removal_penalty" }
      - { name: late_removal_cap_cents, type: integer, source: input, default: 15000, description: "Cap on the base component of late_removal_penalty" }
      - { name: credential_cap_per_member, type: integer, source: input, default: 2, description: "Maximum count of AccessCredential rows in status ACTIVE per Member before the supersede rule kicks in" }
      - { name: grant_buffer_minutes, type: integer, source: input, default: 15, description: "Minutes appended to every APPROVED AccessGrant window when testing lockbox occupation overlap" }
      - { name: recovery_target_pct, type: number, source: input, default: 95.00, description: "Board target for on-time lockbox recovery; reported, never enforced" }
      - { name: lockbox_total_count, type: integer, source: computed, description: "count(Lockbox where association_id = this.id AND status != RETIRED)" }
      - { name: boxes_in_field_count, type: integer, source: computed, description: "count(Lockbox where association_id = this.id AND status IN {ASSIGNED, PLACED})" }
      - { name: unplaced_inventory_count, type: integer, source: computed, description: "count(Lockbox where association_id = this.id AND status IN {IN_STOCK, ASSIGNED}) — conserved quantity of compensating_invariant #1" }
      - { name: missing_box_count, type: integer, source: computed, description: "count(Lockbox where association_id = this.id AND status == MISSING)" }
      - { name: active_placement_count, type: integer, source: computed, description: "count(LockboxPlacement whose Lockbox.association_id = this.id AND placement_status IN {PLACED, REMOVAL_DUE, DELINQUENT})" }
      - { name: delinquent_placement_count, type: integer, source: computed, description: "count(LockboxPlacement whose Lockbox.association_id = this.id AND placement_status == DELINQUENT)" }
      - { name: recovery_rate_pct, type: number, source: computed, description: "lockbox_recovery_rate calculation, closing_cohort variant, window [clock_now - 90 days, clock_now]" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — association_posture calculation; gates placement and grant creation", constraints: "OPEN | RESTRICTED | FROZEN" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique within the association" }
      - { name: dues_paid_through, type: string, source: input, description: "ISO date (YYYY-MM-DD) through which association dues are paid" }
      - { name: membership_status, type: enum, source: system, description: "PENDING | ACTIVE | PROBATION | SUSPENDED | EXPIRED | TERMINATED", constraints: "PENDING | ACTIVE | PROBATION | SUSPENDED | EXPIRED | TERMINATED" }
      - { name: active_credential_count, type: integer, source: computed, description: "count(AccessCredential where member_id = this.id AND status == ACTIVE) — conserved quantity of compensating_invariant #3" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "member_statement_balance calculation over BillingCharge rows with status IN {PENDING, INVOICED} — conserved quantity of compensating_invariant #2" }
      - { name: loss_report_count, type: integer, source: computed, description: "count(Lockbox where assigned_member_id = this.id AND status IN {MISSING, QUARANTINE}) counted BEFORE the loss report under evaluation" }
      - { name: temp_codes_issued_today, type: integer, source: computed, description: "count(AccessGrant where issued_by_member_id = this.id AND grant_type == ONE_DAY_MEMBER AND status != DENIED AND date(created_at) == date(clock_now))" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: company_name, type: string, source: input, description: "Vendor company name" }
      - { name: insurance_expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD) on which the vendor's liability insurance lapses" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED" }

  - name: Lockbox
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: serial_number, type: string, source: input, description: "Hardware serial; unique within association_id" }
      - { name: model, type: enum, source: input, description: "LB_STD | LB_PRO", constraints: "LB_STD | LB_PRO" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Board-published replacement cost of this hardware model", constraints: "> 0" }
      - { name: in_service_since, type: string, source: input, description: "ISO date (YYYY-MM-DD) the unit entered service; depreciation clock for the depreciated_book variant" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | ASSIGNED | PLACED | MISSING | QUARANTINE | RETIRED", constraints: "IN_STOCK | ASSIGNED | PLACED | MISSING | QUARANTINE | RETIRED" }
      - { name: assigned_member_id, type: string, source: system, description: "FK -> Member.id; null while IN_STOCK or RETIRED" }
      - { name: current_listing_id, type: string, source: system, description: "FK -> Listing.id; null unless status == PLACED" }
      - { name: loss_type, type: enum, source: system, description: "LOST | STOLEN; set on REPORT_LOST / REPORT_STOLEN, cleared on QUARANTINE -> IN_STOCK", constraints: "LOST | STOLEN" }
      - { name: police_report_number, type: string, source: input, description: "Filed police report reference; only accepted with action REPORT_STOLEN" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: listing_agent_id, type: string, source: input, description: "FK -> Member.id; the only Member who may place a box or issue grants on this listing" }
      - { name: address_line, type: string, source: input, description: "Street address of the property" }
      - { name: mls_number, type: string, source: input, description: "MLS identifier; unique within association_id" }
      - { name: concurrent_showing_limit, type: integer, source: input, default: 1, description: "Max CONFIRMED ShowingAppointments whose closed intervals may overlap", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_CONTRACT | CLOSED | WITHDRAWN", constraints: "ACTIVE | UNDER_CONTRACT | CLOSED | WITHDRAWN" }
      - { name: close_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) recorded on CLOSE; drives removal_deadline" }

  - name: LockboxPlacement
    parent: null
    common_fields: true
    fields:
      - { name: lockbox_id, type: string, source: input, description: "FK -> Lockbox.id" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: placed_by_member_id, type: string, source: system, description: "FK -> Member.id; copied from X-User-ID (Member) or from Lockbox.assigned_member_id (AssociationAdmin)" }
      - { name: placement_status, type: enum, source: system, description: "Removal dimension: PLACED | REMOVAL_DUE | REMOVED | DELINQUENT", constraints: "PLACED | REMOVAL_DUE | REMOVED | DELINQUENT" }
      - { name: billing_status, type: enum, source: system, description: "Independent money dimension: NONE | ACCRUED | SETTLED", constraints: "NONE | ACCRUED | SETTLED" }
      - { name: placed_at, type: datetime, source: system, description: "Logical clock value when the placement was created" }
      - { name: removal_deadline, type: datetime, source: computed, description: "(Listing.close_date or clock date of WITHDRAW) + Association.removal_grace_days at 00:00:00.000Z; null while placement_status == PLACED" }
      - { name: removed_at, type: datetime, source: system, description: "Logical clock value when action REMOVE was recorded; null otherwise" }
      - { name: late_days, type: integer, source: computed, description: "max(0, ceil_days(clock_now - removal_deadline)) while DELINQUENT; frozen at the value used for the accrued charge once billing_status == ACCRUED" }
      - { name: on_time, type: boolean, source: computed, description: "true when removed_at is non-null AND (removal_deadline is null OR removed_at <= removal_deadline)" }

  - name: AccessCredential
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: credential_type, type: enum, source: input, description: "KEY_APP | KEY_FOB", constraints: "KEY_APP | KEY_FOB" }
      - { name: expires_at, type: datetime, source: input, description: "ISO 8601 UTC instant at which the credential lapses" }
      - { name: status, type: enum, source: system, description: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | EXPIRED | REVOKED", constraints: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | EXPIRED | REVOKED" }
      - { name: suspended_by_cascade, type: boolean, source: system, default: false, description: "true when the SUSPENDED state was produced by a Member cascade rather than an explicit SUSPEND action; only these are restored on member REINSTATE" }
      - { name: supersede_reason, type: string, source: system, description: "Set to CREDENTIAL_CAP_SUPERSEDE when this credential was revoked to make room for a newer issuance" }

  - name: AccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: lockbox_id, type: string, source: input, description: "FK -> Lockbox.id; must currently be PLACED on listing_id" }
      - { name: issued_by_member_id, type: string, source: system, description: "FK -> Member.id; X-User-ID for Member callers, Listing.listing_agent_id for AssociationAdmin callers" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; required for grant_type == CONTRACTOR_WINDOW, forbidden otherwise" }
      - { name: supersedes_grant_id, type: string, source: input, description: "FK -> AccessGrant.id; the APPROVED grant this issuance replaces on approval" }
      - { name: grant_type, type: enum, source: input, description: "ONE_DAY_MEMBER | CONTRACTOR_WINDOW | INSPECTOR", constraints: "ONE_DAY_MEMBER | CONTRACTOR_WINDOW | INSPECTOR" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of the access window" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC exclusive end of the access window" }
      - { name: max_uses, type: integer, source: input, default: 1, description: "Number of GRANTED access events before the grant auto-transitions to CONSUMED", constraints: ">= 1" }
      - { name: uses_count, type: integer, source: computed, description: "count(AccessEvent where grant_id = this.id AND outcome == GRANTED)" }
      - { name: access_code, type: string, source: system, description: "Six-digit display code; audit metadata only, never an input to any business decision" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | REVOKED | EXPIRED | CONSUMED", constraints: "REQUESTED | APPROVED | DENIED | REVOKED | EXPIRED | CONSUMED" }

  - name: ShowingAppointment
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: showing_member_id, type: string, source: input, description: "FK -> Member.id; the buyer-side agent who will attend" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the showing window; closed interval" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the showing window; closed interval" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW", constraints: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: access_event_count, type: integer, source: computed, description: "count(AccessEvent where matched_appointment_id = this.id)" }
      - { name: cancel_reason, type: enum, source: system, description: "AGENT_CANCELLED | ACCESS_LOST — ACCESS_LOST is written only by a cascade", constraints: "AGENT_CANCELLED | ACCESS_LOST" }

  - name: AccessEvent
    parent: null
    common_fields: false
    fields:
      - { name: lockbox_id, type: string, source: input, description: "FK -> Lockbox.id" }
      - { name: credential_id, type: string, source: input, description: "FK -> AccessCredential.id; null when the device saw no credential" }
      - { name: grant_id, type: string, source: input, description: "FK -> AccessGrant.id; null when the device saw no temporary code" }
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; snapshot of Lockbox.current_listing_id at occurred_at" }
      - { name: matched_appointment_id, type: string, source: computed, description: "FK -> ShowingAppointment.id; the showing this GRANTED event is attributed to, else null" }
      - { name: incident_review_id, type: string, source: computed, description: "FK -> IncidentReview.id; stamped when a review locks evidence over this event" }
      - { name: actor_type, type: enum, source: input, description: "MEMBER | CONTRACTOR | UNKNOWN as declared by the device gateway", constraints: "MEMBER | CONTRACTOR | UNKNOWN" }
      - { name: occurred_at, type: datetime, source: input, description: "ISO 8601 UTC instant of the attempt; defaults to the logical clock when omitted" }
      - { name: outcome, type: enum, source: computed, description: "GRANTED | DENIED_BOX_MISSING | DENIED_CREDENTIAL_INACTIVE | DENIED_OUTSIDE_WINDOW | DENIED_NO_CREDENTIAL — derived by the pinned ladder in access_outcome_resolution", constraints: "GRANTED | DENIED_BOX_MISSING | DENIED_CREDENTIAL_INACTIVE | DENIED_OUTSIDE_WINDOW | DENIED_NO_CREDENTIAL" }
      - { name: after_hours, type: boolean, source: computed, description: "true when hour_utc(occurred_at) < 8 OR hour_utc(occurred_at) >= 20" }
      - { name: risk_weight, type: number, source: computed, description: "OUTCOME_WEIGHT[outcome] * (1.5 if after_hours else 1.0) * ACTOR_MULTIPLIER[actor_type], rounded half up to 2 decimals" }

  - name: IncidentReview
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; null when the review is scoped to a lockbox only" }
      - { name: lockbox_id, type: string, source: input, description: "FK -> Lockbox.id; null when the review is scoped to a listing only" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of the audited event window" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC inclusive end of the audited event window" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the SecurityAuditor who created the review" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the SecurityAuditor who closed it; must differ from opened_by_user_id" }
      - { name: status, type: enum, source: system, description: "OPEN | EVIDENCE_LOCKED | CLOSED", constraints: "OPEN | EVIDENCE_LOCKED | CLOSED" }
      - { name: event_count, type: integer, source: computed, description: "count(AccessEvent where incident_review_id = this.id) after evidence lock; 0 while OPEN" }
      - { name: risk_score, type: number, source: computed, description: "incident_risk_score calculation over the locked evidence set; 0.00 while OPEN" }
      - { name: severity, type: enum, source: computed, description: "LOW | ELEVATED | CRITICAL from risk_score thresholds", constraints: "LOW | ELEVATED | CRITICAL" }
      - { name: findings, type: string, source: input, description: "Auditor narrative; mandatory non-empty when severity == CRITICAL at CLOSE" }

  - name: BillingCharge
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the member the charge lands on" }
      - { name: lockbox_id, type: string, source: system, description: "FK -> Lockbox.id; null for TEMP_CODE_OVERAGE" }
      - { name: placement_id, type: string, source: system, description: "FK -> LockboxPlacement.id; set only for LATE_REMOVAL" }
      - { name: charge_type, type: enum, source: system, description: "REPLACEMENT | LATE_REMOVAL | TEMP_CODE_OVERAGE", constraints: "REPLACEMENT | LATE_REMOVAL | TEMP_CODE_OVERAGE" }
      - { name: amount_cents, type: integer, source: computed, description: "Output of replacement_charge_amount, late_removal_penalty, or Association.temp_code_overage_fee_cents" }
      - { name: variant_applied, type: enum, source: computed, description: "FLAT_SCHEDULE | DEPRECIATED_BOOK | NOT_APPLICABLE — which replacement_charge_amount variant produced amount_cents", constraints: "FLAT_SCHEDULE | DEPRECIATED_BOOK | NOT_APPLICABLE" }
      - { name: basis, type: string, source: computed, description: "Human-readable derivation string, e.g. 'base=7500 tier=T2 admin_fee=375'" }
      - { name: status, type: enum, source: system, description: "PENDING | INVOICED | PAID | WAIVED | VOID", constraints: "PENDING | INVOICED | PAID | WAIVED | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members — system auto-transition evaluated inside the creating request"
        actor: system
        preconditions: ["dues_paid_through (at 23:59:59.999Z) > clock_now"]
        side_effects: ["membership_status := ACTIVE", "Member.version stays 1 (auto-transition is part of creation)"]
      - from: PENDING
        to: EXPIRED
        trigger: "POST /members — system auto-transition evaluated inside the creating request"
        actor: system
        preconditions: ["dues_paid_through (at 23:59:59.999Z) <= clock_now"]
        side_effects: ["membership_status := EXPIRED", "Member.version stays 1"]
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /members/{memberId}/membership-events event_type=PLACE_ON_PROBATION"
        actor: AssociationAdmin
        preconditions: ["membership_status == ACTIVE", "expected_member_version == Member.version"]
        side_effects: ["Member.version += 1", "AccessCredentials are NOT touched — PROBATION keeps credentials ACTIVE"]
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /members/{memberId}/membership-events event_type=REINSTATE"
        actor: AssociationAdmin
        preconditions: ["membership_status == PROBATION", "expected_member_version == Member.version"]
        side_effects: ["Member.version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{memberId}/membership-events event_type=SUSPEND"
        actor: AssociationAdmin
        preconditions: ["membership_status IN {ACTIVE, PROBATION}", "expected_member_version == Member.version"]
        side_effects:
          - "CASCADE HOP 1 — every AccessCredential with member_id = this member AND status == ACTIVE becomes SUSPENDED with suspended_by_cascade := true; Member.active_credential_count recomputed"
          - "CASCADE HOP 2 — because those credentials left ACTIVE, every AccessGrant with issued_by_member_id = this member AND status IN {REQUESTED, APPROVED} becomes REVOKED"
          - "CASCADE HOP 3 — because those grants were revoked, every ShowingAppointment with showing_member_id = this member AND status IN {REQUESTED, CONFIRMED} AND window_start > clock_now becomes CANCELLED with cancel_reason := ACCESS_LOST"
          - "Member.version += 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /members/{memberId}/membership-events event_type=SUSPEND"
        actor: AssociationAdmin
        preconditions: ["membership_status == PROBATION", "expected_member_version == Member.version"]
        side_effects: ["Identical three-hop cascade as ACTIVE -> SUSPENDED", "Member.version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{memberId}/membership-events event_type=REINSTATE"
        actor: AssociationAdmin
        preconditions: ["membership_status == SUSPENDED", "expected_member_version == Member.version"]
        side_effects:
          - "COMPENSATION — every AccessCredential with member_id = this member AND status == SUSPENDED AND suspended_by_cascade == true AND expires_at > clock_now returns to ACTIVE with suspended_by_cascade := false"
          - "Member.active_credential_count recomputed; compensating_invariant #3 requires it to equal its pre-SUSPEND value"
          - "Revoked AccessGrants and cancelled ShowingAppointments are NOT restored"
          - "Member.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /members/{memberId}/membership-events event_type=EXPIRE, or POST /associations/{associationId}/compliance-runs step 3 when dues_paid_through (23:59:59.999Z) < clock_now"
        actor: AssociationAdmin | system
        preconditions: ["membership_status IN {ACTIVE, PROBATION}"]
        side_effects:
          - "every AccessCredential with member_id = this member AND status == ACTIVE becomes SUSPENDED with suspended_by_cascade := true"
          - "Member.version += 1"
      - from: PROBATION
        to: EXPIRED
        trigger: "POST /members/{memberId}/membership-events event_type=EXPIRE, or compliance-run step 3"
        actor: AssociationAdmin | system
        preconditions: ["membership_status == PROBATION"]
        side_effects: ["ACTIVE credentials become SUSPENDED with suspended_by_cascade := true", "Member.version += 1"]
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /members/{memberId}/membership-events event_type=RENEW with paid_through_date"
        actor: AssociationAdmin
        preconditions: ["membership_status == EXPIRED", "paid_through_date (23:59:59.999Z) > clock_now", "expected_member_version == Member.version"]
        side_effects:
          - "dues_paid_through := paid_through_date"
          - "every AccessCredential with member_id = this member AND status == SUSPENDED AND suspended_by_cascade == true AND expires_at > clock_now returns to ACTIVE"
          - "Member.version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /members/{memberId}/membership-events event_type=TERMINATE"
        actor: AssociationAdmin
        preconditions: ["membership_status IN {ACTIVE, PROBATION, SUSPENDED, EXPIRED}", "no Lockbox has assigned_member_id = this member with status IN {ASSIGNED, PLACED, MISSING}", "expected_member_version == Member.version"]
        side_effects: ["every AccessCredential with member_id = this member AND status != REVOKED becomes REVOKED", "Member.active_credential_count := 0", "Member.version += 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /members/{memberId}/membership-events event_type=TERMINATE"
        actor: AssociationAdmin
        preconditions: ["same as ACTIVE -> TERMINATED"]
        side_effects: ["same as ACTIVE -> TERMINATED"]
      - from: EXPIRED
        to: TERMINATED
        trigger: "POST /members/{memberId}/membership-events event_type=TERMINATE"
        actor: AssociationAdmin
        preconditions: ["same as ACTIVE -> TERMINATED"]
        side_effects: ["same as ACTIVE -> TERMINATED"]

  - entity: Lockbox
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STOCK
        to: ASSIGNED
        trigger: "POST /lockboxes/{lockboxId}/state action=ASSIGN"
        actor: AssociationAdmin
        preconditions:
          - "expected_lockbox_version == Lockbox.version"
          - "Member exists and Member.association_id == Lockbox.association_id"
          - "Member.membership_status IN {ACTIVE, PROBATION} else ERR_MEMBER_NOT_ELIGIBLE"
          - "Member.outstanding_balance_cents == 0 else ERR_MEMBER_BALANCE_DELINQUENT"
        side_effects: ["assigned_member_id := member_id", "Association.boxes_in_field_count += 1", "Association.unplaced_inventory_count unchanged", "Lockbox.version += 1"]
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /lockboxes/{lockboxId}/state action=ASSIGN with a different member_id (reassignment supersedes the prior holder)"
        actor: AssociationAdmin
        preconditions: ["expected_lockbox_version == Lockbox.version", "same Member eligibility and balance checks as IN_STOCK -> ASSIGNED"]
        side_effects: ["assigned_member_id := member_id", "Association counts unchanged", "Lockbox.version += 1"]
        note: "Self-loop; the OCC rule lockbox-reassign-stale-lockbox guards it."
      - from: ASSIGNED
        to: PLACED
        trigger: "POST /lockbox-placements"
        actor: Member | AssociationAdmin
        preconditions:
          - "Listing.status == ACTIVE"
          - "Listing.association_id == Lockbox.association_id"
          - "Association.posture != FROZEN else ERR_ASSOCIATION_FROZEN"
          - "Lockbox.assigned_member_id == X-User-ID when the caller is a Member"
        side_effects:
          - "LockboxPlacement created with placement_status = PLACED, billing_status = NONE, placed_at = clock_now"
          - "current_listing_id := listing_id"
          - "Association.unplaced_inventory_count -= 1"
          - "Association.active_placement_count += 1"
          - "Association.posture recomputed"
          - "Lockbox.version += 1"
      - from: PLACED
        to: ASSIGNED
        trigger: "POST /lockbox-placements/{placementId}/state action=REMOVE"
        actor: Member | AssociationAdmin
        preconditions: ["placement.placement_status IN {PLACED, REMOVAL_DUE, DELINQUENT}", "placement.placed_by_member_id == X-User-ID when the caller is a Member", "expected_placement_version == LockboxPlacement.version"]
        side_effects:
          - "placement.placement_status := REMOVED, removed_at := clock_now, on_time recomputed"
          - "current_listing_id := null"
          - "Association.unplaced_inventory_count += 1 (compensating_invariant #1 closes here)"
          - "Association.active_placement_count -= 1; delinquent_placement_count recomputed; posture recomputed; recovery_rate_pct recomputed"
          - "Lockbox.version += 1"
      - from: ASSIGNED
        to: IN_STOCK
        trigger: "POST /lockboxes/{lockboxId}/state action=RETURN"
        actor: AssociationAdmin | Member
        preconditions: ["no LockboxPlacement for this lockbox has placement_status IN {PLACED, REMOVAL_DUE, DELINQUENT}", "assigned_member_id == X-User-ID when the caller is a Member", "expected_lockbox_version == Lockbox.version"]
        side_effects: ["assigned_member_id := null", "Association.boxes_in_field_count -= 1", "Lockbox.version += 1"]
      - from: ASSIGNED
        to: MISSING
        trigger: "POST /lockboxes/{lockboxId}/state action=REPORT_LOST or action=REPORT_STOLEN"
        actor: AssociationAdmin | Member
        preconditions: ["assigned_member_id == X-User-ID when the caller is a Member", "police_report_number present iff action == REPORT_STOLEN", "expected_lockbox_version == Lockbox.version"]
        side_effects:
          - "loss_type := LOST | STOLEN; police_report_number stored"
          - "BillingCharge(charge_type=REPLACEMENT, member_id=assigned_member_id, lockbox_id=this) created with amount_cents from replacement_charge_amount and status PENDING"
          - "Member.outstanding_balance_cents recomputed by member_statement_balance"
          - "Association.missing_box_count += 1; boxes_in_field_count -= 1; unplaced_inventory_count -= 1; posture recomputed"
          - "Lockbox.version += 1"
      - from: PLACED
        to: MISSING
        trigger: "POST /lockboxes/{lockboxId}/state action=REPORT_LOST or action=REPORT_STOLEN"
        actor: AssociationAdmin | Member
        preconditions: ["assigned_member_id == X-User-ID when the caller is a Member", "police_report_number present iff action == REPORT_STOLEN", "expected_lockbox_version == Lockbox.version"]
        side_effects:
          - "All direct effects of ASSIGNED -> MISSING (replacement charge, balance, association counters)"
          - "CASCADE HOP 1 — the LockboxPlacement with lockbox_id = this and placement_status IN {PLACED, REMOVAL_DUE} becomes DELINQUENT"
          - "CASCADE HOP 2 — because that placement became DELINQUENT, every AccessGrant with lockbox_id = this and status IN {REQUESTED, APPROVED} becomes REVOKED"
          - "CASCADE HOP 3 — because those grants were revoked, every ShowingAppointment on the placement's listing_id with status IN {REQUESTED, CONFIRMED} and window_start > clock_now becomes CANCELLED with cancel_reason := ACCESS_LOST"
          - "current_listing_id := null; Association.delinquent_placement_count and posture recomputed"
          - "Lockbox.version += 1"
      - from: MISSING
        to: QUARANTINE
        trigger: "POST /lockboxes/{lockboxId}/state action=RECOVER"
        actor: AssociationAdmin
        preconditions: ["status == MISSING", "expected_lockbox_version == Lockbox.version"]
        side_effects:
          - "COMPENSATION HOP 1 — the BillingCharge with lockbox_id = this AND charge_type == REPLACEMENT AND status IN {PENDING, INVOICED} becomes VOID"
          - "COMPENSATION HOP 2 — because that charge left the open set, Member.outstanding_balance_cents is recomputed and returns to its pre-report value (compensating_invariant #2)"
          - "Association.missing_box_count -= 1; posture recomputed"
          - "Lockbox.version += 1"
      - from: QUARANTINE
        to: IN_STOCK
        trigger: "POST /lockboxes/{lockboxId}/state action=RETURN"
        actor: AssociationAdmin
        preconditions: ["status == QUARANTINE", "expected_lockbox_version == Lockbox.version"]
        side_effects: ["loss_type := null; police_report_number := null", "assigned_member_id := null", "Association.unplaced_inventory_count += 1", "Lockbox.version += 1"]
      - from: QUARANTINE
        to: RETIRED
        trigger: "POST /lockboxes/{lockboxId}/state action=RETIRE"
        actor: AssociationAdmin
        preconditions: ["status IN {IN_STOCK, MISSING, QUARANTINE}", "expected_lockbox_version == Lockbox.version"]
        side_effects: ["assigned_member_id := null", "Association.lockbox_total_count -= 1", "posture recomputed", "Lockbox.version += 1"]
      - from: MISSING
        to: RETIRED
        trigger: "POST /lockboxes/{lockboxId}/state action=RETIRE"
        actor: AssociationAdmin
        preconditions: ["status == MISSING", "expected_lockbox_version == Lockbox.version"]
        side_effects: ["Association.missing_box_count -= 1; lockbox_total_count -= 1; posture recomputed", "the REPLACEMENT BillingCharge is NOT voided", "Lockbox.version += 1"]
      - from: IN_STOCK
        to: RETIRED
        trigger: "POST /lockboxes/{lockboxId}/state action=RETIRE"
        actor: AssociationAdmin
        preconditions: ["status == IN_STOCK", "expected_lockbox_version == Lockbox.version"]
        side_effects: ["Association.unplaced_inventory_count -= 1; lockbox_total_count -= 1", "Lockbox.version += 1"]

  - entity: Listing
    initial_state: ACTIVE
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "POST /listings/{listingId}/state action=MARK_UNDER_CONTRACT"
        actor: Member | AssociationAdmin
        preconditions: ["status == ACTIVE", "listing_agent_id == X-User-ID when caller is a Member", "expected_listing_version == Listing.version"]
        side_effects: ["Listing.version += 1", "existing placements and grants are untouched"]
      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: "POST /listings/{listingId}/state action=REACTIVATE (deal fell through)"
        actor: Member | AssociationAdmin
        preconditions: ["status == UNDER_CONTRACT", "expected_listing_version == Listing.version"]
        side_effects: ["Listing.version += 1"]
        note: "Cycle ACTIVE -> UNDER_CONTRACT -> ACTIVE."
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "POST /listings/{listingId}/state action=CLOSE with close_date"
        actor: Member | AssociationAdmin
        preconditions: ["status == UNDER_CONTRACT", "close_date present", "expected_listing_version == Listing.version"]
        side_effects:
          - "close_date stored"
          - "CASCADE HOP 1 — the LockboxPlacement on this listing with placement_status == PLACED becomes REMOVAL_DUE with removal_deadline := close_date + Association.removal_grace_days at 00:00:00.000Z"
          - "CASCADE HOP 2 — because that placement entered REMOVAL_DUE, every AccessGrant with listing_id = this and status IN {REQUESTED, APPROVED} becomes REVOKED"
          - "CASCADE HOP 3 — because those grants were revoked, every ShowingAppointment on this listing with status IN {REQUESTED, CONFIRMED} and window_start > clock_now becomes CANCELLED with cancel_reason := ACCESS_LOST"
          - "Association.recovery_rate_pct recomputed"
          - "Listing.version += 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/state action=WITHDRAW"
        actor: Member | AssociationAdmin
        preconditions: ["status IN {ACTIVE, UNDER_CONTRACT}", "expected_listing_version == Listing.version"]
        side_effects: ["Identical three-hop cascade as UNDER_CONTRACT -> CLOSED, except removal_deadline := date(clock_now) + Association.removal_grace_days at 00:00:00.000Z", "Listing.version += 1"]
      - from: UNDER_CONTRACT
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/state action=WITHDRAW"
        actor: Member | AssociationAdmin
        preconditions: ["status == UNDER_CONTRACT", "expected_listing_version == Listing.version"]
        side_effects: ["same as ACTIVE -> WITHDRAWN"]

  - entity: LockboxPlacement
    initial_state: PLACED
    terminal_states: [REMOVED]
    transitions:
      - from: PLACED
        to: REMOVAL_DUE
        trigger: "Listing CLOSE / WITHDRAW cascade hop 1"
        actor: system
        preconditions: ["placement_status == PLACED"]
        side_effects: ["removal_deadline computed", "LockboxPlacement.version += 1"]
      - from: REMOVAL_DUE
        to: DELINQUENT
        trigger: "POST /associations/{associationId}/compliance-runs step 4 when removal_deadline < clock_now"
        actor: system
        preconditions: ["placement_status == REMOVAL_DUE", "removal_deadline < clock_now"]
        side_effects:
          - "late_days computed and frozen"
          - "billing_status := ACCRUED and a BillingCharge(charge_type=LATE_REMOVAL, placement_id=this, lockbox_id, member_id=placed_by_member_id) is created with amount_cents from late_removal_penalty, status PENDING"
          - "Member.outstanding_balance_cents recomputed"
          - "Association.delinquent_placement_count += 1; posture recomputed"
          - "LockboxPlacement.version += 1"
      - from: PLACED
        to: DELINQUENT
        trigger: "Lockbox REPORT_LOST / REPORT_STOLEN cascade hop 1"
        actor: system
        preconditions: ["placement_status IN {PLACED, REMOVAL_DUE}"]
        side_effects: ["billing_status stays NONE — a missing box accrues a REPLACEMENT charge, never a LATE_REMOVAL charge", "Association.delinquent_placement_count += 1; posture recomputed", "LockboxPlacement.version += 1"]
      - from: REMOVAL_DUE
        to: REMOVED
        trigger: "POST /lockbox-placements/{placementId}/state action=REMOVE"
        actor: Member | AssociationAdmin
        preconditions: ["placement_status IN {PLACED, REMOVAL_DUE, DELINQUENT}", "expected_placement_version == LockboxPlacement.version"]
        side_effects: ["removed_at := clock_now; on_time computed", "Lockbox PLACED -> ASSIGNED", "Association.recovery_rate_pct recomputed", "LockboxPlacement.version += 1"]
      - from: DELINQUENT
        to: REMOVED
        trigger: "POST /lockbox-placements/{placementId}/state action=REMOVE"
        actor: Member | AssociationAdmin
        preconditions: ["placement_status == DELINQUENT", "expected_placement_version == LockboxPlacement.version"]
        side_effects: ["removed_at := clock_now; on_time := false", "billing_status stays ACCRUED — removal never voids an accrued LATE_REMOVAL charge", "Association.delinquent_placement_count -= 1; posture recomputed", "LockboxPlacement.version += 1"]
      - from: PLACED
        to: REMOVED
        trigger: "POST /lockbox-placements/{placementId}/state action=REMOVE (early removal, no deadline ever set)"
        actor: Member | AssociationAdmin
        preconditions: ["placement_status == PLACED", "expected_placement_version == LockboxPlacement.version"]
        side_effects: ["removed_at := clock_now; on_time := true (removal_deadline is null)", "Lockbox PLACED -> ASSIGNED", "LockboxPlacement.version += 1"]
      - from: NONE
        to: ACCRUED
        trigger: "billing_status dimension — LATE_REMOVAL charge created by compliance-run step 4"
        actor: system
        preconditions: ["billing_status == NONE"]
        side_effects: ["independent of placement_status; a placement may be DELINQUENT with billing_status NONE (missing-box path) or REMOVED with billing_status ACCRUED"]
      - from: ACCRUED
        to: SETTLED
        trigger: "POST /billing-charges/{chargeId}/state action=PAY or action=WAIVE on the linked LATE_REMOVAL charge"
        actor: AssociationAdmin
        preconditions: ["billing_status == ACCRUED"]
        side_effects: ["placement_status is not modified", "LockboxPlacement.version += 1"]
      - from: ACCRUED
        to: NONE
        trigger: "POST /billing-charges/{chargeId}/state action=VOID on the linked LATE_REMOVAL charge"
        actor: AssociationAdmin
        preconditions: ["billing_status == ACCRUED"]
        side_effects: ["Member.outstanding_balance_cents recomputed", "LockboxPlacement.version += 1"]

  - entity: AccessCredential
    initial_state: PENDING_ACTIVATION
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /access-credentials/{credentialId}/state action=ACTIVATE"
        actor: AssociationAdmin
        preconditions:
          - "status == PENDING_ACTIVATION"
          - "Member.membership_status IN {ACTIVE, PROBATION} else ERR_MEMBER_NOT_ELIGIBLE"
          - "expires_at > clock_now else ERR_INVALID_WINDOW"
          - "expected_credential_version == AccessCredential.version"
        side_effects: ["Member.active_credential_count += 1", "AccessCredential.version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /access-credentials/{credentialId}/state action=SUSPEND, or Member SUSPEND/EXPIRE cascade hop 1"
        actor: AssociationAdmin | system
        preconditions: ["status == ACTIVE"]
        side_effects: ["suspended_by_cascade := true only on the cascade path", "Member.active_credential_count -= 1", "AccessCredential.version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /access-credentials/{credentialId}/state action=REINSTATE, or Member REINSTATE/RENEW compensation"
        actor: AssociationAdmin | system
        preconditions: ["status == SUSPENDED", "Member.membership_status IN {ACTIVE, PROBATION}", "expires_at > clock_now"]
        side_effects: ["suspended_by_cascade := false", "Member.active_credential_count += 1", "AccessCredential.version += 1"]
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /access-credentials/{credentialId}/state action=REVOKE, Member TERMINATE cascade, or credential-cap supersede inside POST /access-credentials"
        actor: AssociationAdmin | system
        preconditions: ["status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"]
        side_effects: ["supersede_reason := CREDENTIAL_CAP_SUPERSEDE on the supersede path", "Member.active_credential_count recomputed", "AccessCredential.version += 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /access-credentials/{credentialId}/state action=REVOKE or Member TERMINATE cascade"
        actor: AssociationAdmin | system
        preconditions: ["status == SUSPENDED"]
        side_effects: ["Member.active_credential_count unchanged", "AccessCredential.version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /associations/{associationId}/compliance-runs step 2 when expires_at <= clock_now"
        actor: system
        preconditions: ["status IN {ACTIVE, SUSPENDED}", "expires_at <= clock_now"]
        side_effects: ["Member.active_credential_count recomputed", "AccessCredential.version += 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /associations/{associationId}/compliance-runs step 2 when expires_at <= clock_now"
        actor: system
        preconditions: ["status == SUSPENDED", "expires_at <= clock_now"]
        side_effects: ["AccessCredential.version += 1"]

  - entity: AccessGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED, CONSUMED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /access-grants/{grantId}/state action=APPROVE"
        actor: AssociationAdmin
        preconditions:
          - "status == REQUESTED"
          - "grant_type == CONTRACTOR_WINDOW implies Contractor.status == ACTIVE AND Contractor.insurance_expires_on (23:59:59.999Z) >= window_end else ERR_CONTRACTOR_INSURANCE_EXPIRED"
          - "Association.posture != FROZEN else ERR_ASSOCIATION_FROZEN; posture == RESTRICTED blocks grant_type == CONTRACTOR_WINDOW with ERR_ASSOCIATION_RESTRICTED"
          - "no other AccessGrant with the same lockbox_id and status == APPROVED occupies an overlapping interval under half-open buffered semantics else ERR_GRANT_WINDOW_CONFLICT"
          - "expected_grant_version == AccessGrant.version"
        side_effects:
          - "access_code minted"
          - "if supersedes_grant_id is set and that grant.status == APPROVED, it becomes REVOKED"
          - "Listing.version += 1 (the listing's access surface changed)"
          - "AccessGrant.version += 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /access-grants/{grantId}/state action=DENY"
        actor: AssociationAdmin
        preconditions: ["status == REQUESTED", "expected_grant_version == AccessGrant.version"]
        side_effects: ["Member.temp_codes_issued_today recomputed — DENIED grants leave the daily-limit count", "AccessGrant.version += 1"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /access-grants/{grantId}/state action=REVOKE, or a Lockbox / Listing / Member cascade hop 2"
        actor: AssociationAdmin | Member | system
        preconditions: ["status IN {REQUESTED, APPROVED}"]
        side_effects: ["Listing.version += 1 on the explicit-action path", "AccessGrant.version += 1"]
      - from: APPROVED
        to: CONSUMED
        trigger: "POST /_devices/access-attempts producing outcome GRANTED that raises uses_count to max_uses"
        actor: system
        preconditions: ["status == APPROVED", "uses_count + 1 >= max_uses"]
        side_effects: ["uses_count recomputed", "AccessGrant.version += 1"]
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /associations/{associationId}/compliance-runs step 1 when window_end <= clock_now"
        actor: system
        preconditions: ["status == APPROVED", "window_end <= clock_now"]
        side_effects: ["AccessGrant.version += 1"]
      - from: REQUESTED
        to: EXPIRED
        trigger: "POST /associations/{associationId}/compliance-runs step 1 when window_end <= clock_now"
        actor: system
        preconditions: ["status == REQUESTED", "window_end <= clock_now"]
        side_effects: ["AccessGrant.version += 1"]

  - entity: ShowingAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /showing-appointments/{appointmentId}/state action=CONFIRM"
        actor: Member | AssociationAdmin
        preconditions:
          - "status == REQUESTED"
          - "Listing.status IN {ACTIVE, UNDER_CONTRACT}"
          - "a LockboxPlacement exists with listing_id = Listing.id AND placement_status == PLACED else ERR_SHOWING_NO_LOCKBOX"
          - "count of other CONFIRMED ShowingAppointments on this listing whose closed interval [window_start, window_end] intersects this one < Listing.concurrent_showing_limit else ERR_SHOWING_CAPACITY_EXCEEDED"
          - "expected_appointment_version == ShowingAppointment.version"
        side_effects: ["ShowingAppointment.version += 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /showing-appointments/{appointmentId}/state action=COMPLETE"
        actor: Member | AssociationAdmin
        preconditions: ["status == CONFIRMED", "access_event_count >= 1 else ERR_INVALID_STATE", "expected_appointment_version == ShowingAppointment.version"]
        side_effects: ["ShowingAppointment.version += 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /showing-appointments/{appointmentId}/state action=MARK_NO_SHOW"
        actor: Member | AssociationAdmin
        preconditions: ["status == CONFIRMED", "window_end <= clock_now else ERR_INVALID_STATE", "access_event_count == 0 else ERR_INVALID_STATE", "expected_appointment_version == ShowingAppointment.version"]
        side_effects: ["ShowingAppointment.version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /showing-appointments/{appointmentId}/state action=CANCEL, or a Lockbox / Listing / Member cascade hop 3"
        actor: Member | AssociationAdmin | system
        preconditions: ["status IN {REQUESTED, CONFIRMED}"]
        side_effects: ["cancel_reason := AGENT_CANCELLED on the explicit path, ACCESS_LOST on the cascade path", "ShowingAppointment.version += 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /showing-appointments/{appointmentId}/state action=CANCEL, or a Lockbox / Listing / Member cascade hop 3"
        actor: Member | AssociationAdmin | system
        preconditions: ["status == CONFIRMED"]
        side_effects: ["cancel_reason set as above", "ShowingAppointment.version += 1"]

  - entity: IncidentReview
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: EVIDENCE_LOCKED
        trigger: "POST /incident-reviews/{reviewId}/state action=LOCK_EVIDENCE"
        actor: SecurityAuditor
        preconditions: ["status == OPEN", "expected_review_version == IncidentReview.version"]
        side_effects:
          - "every AccessEvent whose lockbox_id == review.lockbox_id (when set) or listing_id == review.listing_id (when set) AND occurred_at within [window_start, window_end] gets incident_review_id := review.id"
          - "event_count, risk_score and severity computed by incident_risk_score"
          - "IncidentReview.version += 1"
      - from: EVIDENCE_LOCKED
        to: CLOSED
        trigger: "POST /incident-reviews/{reviewId}/state action=CLOSE with findings"
        actor: SecurityAuditor
        preconditions:
          - "status == EVIDENCE_LOCKED"
          - "X-User-ID != opened_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "severity == CRITICAL implies findings is a non-empty string else ERR_INVALID_REQUEST"
          - "expected_review_version == IncidentReview.version"
        side_effects: ["closed_by_user_id := X-User-ID", "findings stored", "IncidentReview.version += 1"]
      - from: CLOSED
        to: EVIDENCE_LOCKED
        trigger: "POST /incident-reviews/{reviewId}/state action=REOPEN"
        actor: SecurityAuditor
        preconditions: ["status == CLOSED", "expected_review_version == IncidentReview.version"]
        side_effects:
          - "closed_by_user_id := null"
          - "evidence set re-stamped and risk_score / severity recomputed over any AccessEvent that has since landed inside [window_start, window_end]"
          - "IncidentReview.version += 1"
        note: "Cycle EVIDENCE_LOCKED -> CLOSED -> EVIDENCE_LOCKED; CLOSED is not terminal."

  - entity: BillingCharge
    initial_state: PENDING
    terminal_states: [PAID, WAIVED, VOID]
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "POST /billing-charges/{chargeId}/state action=INVOICE"
        actor: AssociationAdmin
        preconditions: ["status == PENDING", "expected_charge_version == BillingCharge.version"]
        side_effects: ["Member.outstanding_balance_cents unchanged — PENDING and INVOICED are both in the open set", "BillingCharge.version += 1"]
      - from: INVOICED
        to: PAID
        trigger: "POST /billing-charges/{chargeId}/state action=PAY"
        actor: AssociationAdmin
        preconditions: ["status IN {PENDING, INVOICED}", "expected_charge_version == BillingCharge.version"]
        side_effects: ["Member.outstanding_balance_cents recomputed (line leaves the open set)", "linked LockboxPlacement.billing_status ACCRUED -> SETTLED", "BillingCharge.version += 1"]
      - from: PENDING
        to: WAIVED
        trigger: "POST /billing-charges/{chargeId}/state action=WAIVE"
        actor: AssociationAdmin
        preconditions: ["status IN {PENDING, INVOICED}", "expected_charge_version == BillingCharge.version"]
        side_effects: ["Member.outstanding_balance_cents recomputed", "linked LockboxPlacement.billing_status ACCRUED -> SETTLED", "BillingCharge.version += 1"]
      - from: PENDING
        to: VOID
        trigger: "POST /billing-charges/{chargeId}/state action=VOID, or the Lockbox MISSING -> QUARANTINE compensation hop 1"
        actor: AssociationAdmin | system
        preconditions: ["status IN {PENDING, INVOICED}"]
        side_effects: ["Member.outstanding_balance_cents recomputed", "linked LockboxPlacement.billing_status ACCRUED -> NONE", "BillingCharge.version += 1"]

  - entity: Contractor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contractors/{contractorId}/state action=SUSPEND"
        actor: AssociationAdmin
        preconditions: ["status == ACTIVE", "expected_contractor_version == Contractor.version"]
        side_effects:
          - "Already-APPROVED AccessGrants are NOT revoked; suspension only blocks future approvals via the priority-50 safety gate"
          - "Contractor.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contractors/{contractorId}/state action=REACTIVATE"
        actor: AssociationAdmin
        preconditions: ["status == SUSPENDED", "expected_contractor_version == Contractor.version"]
        side_effects: ["Contractor.version += 1"]
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE; neither state is terminal."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: grant-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /access-grants"
    occ_field: "expected_listing_version"
    description: |
      Creating an AccessGrant against a Listing whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has already issued and
      had approved a grant on the same listing — an approval legitimately supersedes the prior
      grant and bumps Listing.version — so the current writer's view of the listing's access
      surface is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: credential-issue-stale-member
    parent_entity: Member
    write_endpoint: "POST /access-credentials"
    occ_field: "expected_member_version"
    description: |
      Issuing an AccessCredential against a Member whose version has advanced since the client
      last observed it is rejected. Issuance is legitimately repeatable — once the member holds
      Association.credential_cap_per_member ACTIVE credentials, a further issuance supersedes the
      earliest-created ACTIVE one — so a second issuance carrying the pre-issuance member version
      is acting on a stale view of the member's credential set.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lockbox-reassign-stale-lockbox
    parent_entity: Lockbox
    write_endpoint: "POST /lockboxes/{lockboxId}/state"
    occ_field: "expected_lockbox_version"
    description: |
      Driving a Lockbox state action with a version the client observed before an earlier action
      landed is rejected. Reassignment (ASSIGNED -> ASSIGNED with a different member_id) is
      legitimately repeatable and supersedes the prior holder, so the stale-version check is the
      only thing that separates a deliberate reassignment from one issued against an outdated
      view of the unit.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: replacement_charge_amount
    trigger: "Lockbox ASSIGNED|PLACED -> MISSING (POST /lockboxes/{lockboxId}/state action=REPORT_LOST or REPORT_STOLEN) — writes BillingCharge.amount_cents and BillingCharge.variant_applied"
    algorithm: decay_function
    formula: |
      # Step 1 — pick the variant. The two variants are BOTH defensible readings of the
      # board's replacement policy and produce different money for the same unit on the
      # same day; the selector is pinned here and nowhere else.
      if loss_type == "STOLEN" and police_report_number is not null:
          variant = "DEPRECIATED_BOOK"
      else:
          variant = "FLAT_SCHEDULE"

      # Step 2 — FLAT_SCHEDULE: full published cost, escalated by the holder's history.
      # prior_loss_count = count(Lockbox where assigned_member_id == member.id
      #                          and status IN {MISSING, QUARANTINE}) evaluated BEFORE
      #                    this report flips the current unit to MISSING.
      if variant == "FLAT_SCHEDULE":
          repeat_multiplier = 1.00 if prior_loss_count == 0
                              else 1.50 if prior_loss_count == 1
                              else 2.00
          amount_cents = round_half_up(replacement_cost_cents * repeat_multiplier)

      # Step 3 — DEPRECIATED_BOOK: straight-line monthly depreciation, capped, then the
      # theft security offset. repeat_multiplier is deliberately NOT applied here.
      else:
          months_in_service = floor(days_between(in_service_since, date(clock_now)) / 30)
          depreciation = min(DEPRECIATION_CAP, months_in_service * MONTHLY_DEPRECIATION_RATE)
          amount_cents = round_half_up(replacement_cost_cents
                                       * (1 - depreciation)
                                       * THEFT_SECURITY_OFFSET)
    input_set: "Exactly one Lockbox — the unit named in the path — plus the Member in Lockbox.assigned_member_id. Lockboxes already in status MISSING/QUARANTINE/RETIRED never enter (the transition is unreachable from those states)."
    constants:
      MONTHLY_DEPRECIATION_RATE: 0.02
      DEPRECIATION_CAP: 0.60
      THEFT_SECURITY_OFFSET: 0.50
      REPEAT_TIER_1_MULTIPLIER: 1.50
      REPEAT_TIER_2_MULTIPLIER: 2.00
    precision: "Whole cents, round_half_up applied ONCE at the end of the selected branch."
    variants:
      - name: flat_schedule
        when: "loss_type == LOST, or loss_type == STOLEN with no police_report_number"
        difference: "Charges the full published replacement_cost_cents and escalates it by the holder's prior loss history; ignores age of the unit entirely."
      - name: depreciated_book
        when: "loss_type == STOLEN and police_report_number is present"
        difference: "Charges depreciated book value halved by the theft security offset and ignores prior loss history; a 12-month-old 12000-cent unit yields 4560 where flat_schedule yields 12000."

  - name: lockbox_recovery_rate
    trigger: "GET /associations/{associationId}/recovery-summary (variant selected by query field) and POST /associations/{associationId}/compliance-runs step 5, which writes Association.recovery_rate_pct using the closing_cohort variant over [clock_now - 90 days, clock_now]"
    algorithm: aggregation
    formula: |
      # closing_cohort — "of the deals that closed in this window, how many boxes came
      # back on time?"  Denominator is anchored on the LISTING's close_date.
      if variant == "closing_cohort":
          denom_set = { p in LockboxPlacement :
                          Listing[p.listing_id].status == "CLOSED"
                          and window_start <= Listing[p.listing_id].close_date <= window_end }
          numer_set = { p in denom_set : p.placement_status == "REMOVED" and p.on_time == true }

      # removal_activity — "of the boxes whose removal came due in this window, how many
      # actually came back?"  Denominator is anchored on placement activity, includes
      # WITHDRAWN listings, and counts a late removal as a success.
      else:  # variant == "removal_activity"
          denom_set = { p in LockboxPlacement :
                          (p.placement_status == "REMOVED" and window_start <= p.removed_at <= window_end)
                          or (p.placement_status == "DELINQUENT" and window_start <= p.removal_deadline <= window_end) }
          numer_set = { p in denom_set : p.placement_status == "REMOVED" }

      denominator_count = count(denom_set)
      numerator_count   = count(numer_set)
      if denominator_count == 0:
          recovery_rate_pct = 0.00          # empty-set boundary: zero, never null, never an error
      else:
          recovery_rate_pct = round_half_up(numerator_count * 100 / denominator_count, 2)
    input_set: "LockboxPlacement rows whose Lockbox.association_id == the association in the path. Placements with placement_status IN {PLACED, REMOVAL_DUE} are in NEITHER set under either variant. Ordering is irrelevant (pure counts)."
    constants:
      DEFAULT_WINDOW_DAYS: 90
    precision: "2 decimal places, round_half_up; the empty denominator yields exactly 0.00."
    variants:
      - name: closing_cohort
        when: "GET /associations/{associationId}/recovery-summary with variant omitted or variant=closing_cohort; also the variant written into Association.recovery_rate_pct"
        difference: "Denominator = placements on CLOSED listings whose close_date is in the window; a WITHDRAWN listing's placement never counts, and a late removal counts as a miss."
      - name: removal_activity
        when: "GET /associations/{associationId}/recovery-summary with variant=removal_activity"
        difference: "Denominator = placements that were removed or fell delinquent inside the window regardless of listing status; a late removal counts as a success. The same three placements yield 50.00 under closing_cohort and 66.67 here."

  - name: incident_risk_score
    trigger: "IncidentReview OPEN -> EVIDENCE_LOCKED and CLOSED -> EVIDENCE_LOCKED (POST /incident-reviews/{reviewId}/state) — writes IncidentReview.risk_score, .severity and .event_count"
    algorithm: weighted_scoring
    formula: |
      # Evidence set: every AccessEvent stamped with this review's id by the lock step,
      # i.e. matching the review's lockbox_id (when set) or listing_id (when set) with
      # window_start <= occurred_at <= window_end (both bounds inclusive).
      for each event e in evidence_set:
          e.risk_weight = round_half_up(
              OUTCOME_WEIGHT[e.outcome]
              * (AFTER_HOURS_MULTIPLIER if e.after_hours else 1.0)
              * ACTOR_MULTIPLIER[e.actor_type], 2)

      base = sum(e.risk_weight for e in evidence_set)          # per-event rounding, then sum

      unmatched_showing_count = count(e in evidence_set where
                                      e.outcome == "GRANTED"
                                      and e.actor_type == "MEMBER"
                                      and e.matched_appointment_id is null)
      raw = base + UNMATCHED_SHOWING_PENALTY * unmatched_showing_count

      risk_score = min(SCORE_CEILING, max(SCORE_FLOOR, round_half_up(raw, 2)))
      severity   = "CRITICAL" if risk_score >= CRITICAL_THRESHOLD
                   else "ELEVATED" if risk_score >= ELEVATED_THRESHOLD
                   else "LOW"
    input_set: "AccessEvent rows stamped with incident_review_id == this review. Events outside [window_start, window_end], events on other lockboxes/listings, and events that landed after the lock are excluded until a REOPEN re-stamps the set."
    constants:
      OUTCOME_WEIGHT: { GRANTED: 2, DENIED_OUTSIDE_WINDOW: 9, DENIED_NO_CREDENTIAL: 12, DENIED_CREDENTIAL_INACTIVE: 18, DENIED_BOX_MISSING: 25 }
      ACTOR_MULTIPLIER: { MEMBER: 1.0, CONTRACTOR: 1.25, UNKNOWN: 2.0 }
      AFTER_HOURS_MULTIPLIER: 1.5
      UNMATCHED_SHOWING_PENALTY: 10
      SCORE_FLOOR: 0.00
      SCORE_CEILING: 100.00
      ELEVATED_THRESHOLD: 35.00
      CRITICAL_THRESHOLD: 70.00
    precision: "Per-event risk_weight rounded half up to 2 decimals FIRST, then summed; the final score is rounded half up to 2 decimals and clamped into [0.00, 100.00]. Thresholds use >= (a score of exactly 70.00 is CRITICAL)."

  - name: member_statement_balance
    trigger: "Any mutation that creates, voids, waives, pays or invoices a BillingCharge for the member — writes Member.outstanding_balance_cents"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: the administration surcharge is applied and rounded
      # PER CHARGE LINE, and the rounded line totals are then summed. Summing the raw
      # amounts first and rounding once at the end is explicitly NOT the rule — two
      # 1500-cent lines yield 3076 here and 3075 under sum-then-round.
      open_lines = [ c for c in BillingCharge
                     if c.member_id == member.id and c.status IN {"PENDING", "INVOICED"} ]
      outstanding_balance_cents = sum( round_half_up(c.amount_cents * (1 + ADMIN_SURCHARGE_RATE))
                                       for c in open_lines )
    input_set: "BillingCharge rows for this member with status IN {PENDING, INVOICED}. PAID, WAIVED and VOID lines leave the open set immediately and stop contributing. Order of summation does not affect the result because every line is rounded before it is added."
    constants:
      ADMIN_SURCHARGE_RATE: 0.025
    precision: "Whole cents. round_half_up applied once per line, never to the aggregate."

  - name: late_removal_penalty
    trigger: "LockboxPlacement REMOVAL_DUE -> DELINQUENT inside POST /associations/{associationId}/compliance-runs step 4 — writes BillingCharge.amount_cents and BillingCharge.basis for charge_type LATE_REMOVAL"
    algorithm: tiered_pricing
    formula: |
      # The tier looks circular — the administration fee is a percentage of a tier that is
      # itself selected from an amount that the fee contributes to. The evaluation order is
      # pinned so the value is well defined: the tier is keyed on base_cents ONLY, and
      # total_cents is derived last. Keying the tier on total_cents is the wrong reading.
      late_days   = max(0, ceil_days(clock_now - removal_deadline))
      base_cents  = min(association.late_removal_cap_cents,
                        late_days * association.late_removal_daily_fee_cents)

      tier = "T1" if base_cents <= TIER_1_CEILING_CENTS
             else "T2" if base_cents <= TIER_2_CEILING_CENTS
             else "T3"
      admin_fee_pct   = TIER_FEE_PCT[tier]
      admin_fee_cents = round_half_up(base_cents * admin_fee_pct)
      total_cents     = base_cents + admin_fee_cents
      basis           = "base=" + base_cents + " tier=" + tier + " admin_fee=" + admin_fee_cents
    input_set: "One LockboxPlacement whose placement_status is REMOVAL_DUE and whose removal_deadline is strictly before clock_now, plus the Association config. Placements already DELINQUENT are skipped — the penalty is computed once and frozen with late_days."
    constants:
      TIER_1_CEILING_CENTS: 4500
      TIER_2_CEILING_CENTS: 10500
      TIER_FEE_PCT: { T1: 0.00, T2: 0.05, T3: 0.10 }
    precision: "Whole cents; ceil_days rounds any partial day UP to a whole day; round_half_up applied only to admin_fee_cents."

  - name: association_posture
    trigger: "Recomputed at the end of every Lockbox transition, every LockboxPlacement transition and every compliance run — writes Association.posture"
    algorithm: threshold
    formula: |
      active_placement_count     = count(LockboxPlacement p where Lockbox[p.lockbox_id].association_id == A.id
                                         and p.placement_status IN {"PLACED", "REMOVAL_DUE", "DELINQUENT"})
      delinquent_placement_count = count(LockboxPlacement p where Lockbox[p.lockbox_id].association_id == A.id
                                         and p.placement_status == "DELINQUENT")
      delinquent_ratio = delinquent_placement_count / max(1, active_placement_count)

      # Checked in this order; the first match wins.
      if missing_box_count >= FROZEN_MISSING_BOXES or delinquent_ratio >= FROZEN_DELINQUENT_RATIO:
          posture = "FROZEN"
      elif missing_box_count >= RESTRICTED_MISSING_BOXES or delinquent_ratio >= RESTRICTED_DELINQUENT_RATIO:
          posture = "RESTRICTED"
      else:
          posture = "OPEN"
    input_set: "All Lockbox rows with this association_id excluding RETIRED, and all LockboxPlacement rows reachable through them."
    constants:
      FROZEN_MISSING_BOXES: 3
      FROZEN_DELINQUENT_RATIO: 0.50
      RESTRICTED_MISSING_BOXES: 1
      RESTRICTED_DELINQUENT_RATIO: 0.25
    precision: "delinquent_ratio is a real number compared with >=; no rounding is applied before the comparison."

  - name: access_outcome_resolution
    trigger: "POST /_devices/access-attempts — writes AccessEvent.outcome, .after_hours, .listing_id and .matched_appointment_id"
    algorithm: resolution_ladder
    formula: |
      # First matching rung wins; the ladder is evaluated top to bottom.
      if lockbox.status == "MISSING":                         outcome = "DENIED_BOX_MISSING"
      elif credential_id is not null and credential.status != "ACTIVE":
                                                              outcome = "DENIED_CREDENTIAL_INACTIVE"
      elif grant_id is not null and (grant.status != "APPROVED"
                                     or not (grant.window_start <= occurred_at < grant.window_end)):
                                                              outcome = "DENIED_OUTSIDE_WINDOW"
      elif credential_id is null and grant_id is null:        outcome = "DENIED_NO_CREDENTIAL"
      else:                                                   outcome = "GRANTED"

      after_hours = (hour_utc(occurred_at) < AFTER_HOURS_START_HOUR
                     or hour_utc(occurred_at) >= AFTER_HOURS_END_HOUR)
      listing_id  = lockbox.current_listing_id

      # Showing attribution: only GRANTED events attach to a showing.
      if outcome == "GRANTED" and credential_id is not null and listing_id is not null:
          candidates = { a in ShowingAppointment :
                           a.listing_id == listing_id
                           and a.status == "CONFIRMED"
                           and a.showing_member_id == credential.member_id
                           and a.window_start <= occurred_at <= a.window_end }
          # eligibility filter above; ranking = window_start ASC; tie-break = created_at ASC;
          # empty candidate set => matched_appointment_id = null (never an error)
          matched_appointment_id = first(sort(candidates, by window_start ASC, then created_at ASC))
      else:
          matched_appointment_id = null
    input_set: "The single Lockbox named in the request, the AccessCredential and AccessGrant named in the request when present, and CONFIRMED ShowingAppointments on the lockbox's current listing."
    constants:
      AFTER_HOURS_START_HOUR: 8
      AFTER_HOURS_END_HOUR: 20
    precision: "Grant windows are half-open [window_start, window_end); showing windows are closed [window_start, window_end]. after_hours uses the UTC hour field only."

  - name: grant_occupation_overlap
    trigger: "AccessGrant REQUESTED -> APPROVED (POST /access-grants/{grantId}/state action=APPROVE) — decides ERR_GRANT_WINDOW_CONFLICT"
    algorithm: interval_merge
    formula: |
      # A lockbox is occupied for the grant window PLUS a mandatory service buffer, and the
      # occupied interval is HALF-OPEN: an interval that starts exactly where another ends
      # does not collide.
      buffer = association.grant_buffer_minutes minutes
      occupied(g) = [ g.window_start , g.window_end + buffer )      # half-open
      conflict = exists g2 in AccessGrant where
                    g2.id != g.id
                    and g2.lockbox_id == g.lockbox_id
                    and g2.status == "APPROVED"
                    and occupied(g) intersects occupied(g2)
      # intersects(a, b) == (a.start < b.end) and (b.start < a.end)
    input_set: "AccessGrant rows on the same lockbox_id with status == APPROVED. REQUESTED, DENIED, REVOKED, EXPIRED and CONSUMED grants never occupy the unit."
    constants:
      DEFAULT_BUFFER_MINUTES: 15
    precision: "Minute resolution; comparisons are strict (<) on both sides, so a window starting exactly at another's buffered end is accepted."

  - name: showing_capacity_overlap
    trigger: "ShowingAppointment REQUESTED -> CONFIRMED (POST /showing-appointments/{appointmentId}/state action=CONFIRM) — decides ERR_SHOWING_CAPACITY_EXCEEDED"
    algorithm: interval_merge
    formula: |
      # Showings use CLOSED intervals and an aggregate capacity, not a buffer: touching
      # endpoints DO collide, and up to concurrent_showing_limit overlaps are tolerated.
      overlaps = count( a2 in ShowingAppointment where
                          a2.id != a.id
                          and a2.listing_id == a.listing_id
                          and a2.status == "CONFIRMED"
                          and a.window_start <= a2.window_end
                          and a2.window_start <= a.window_end )     # closed intersection
      reject when overlaps >= Listing.concurrent_showing_limit
    input_set: "ShowingAppointment rows on the same listing_id with status == CONFIRMED. REQUESTED, CANCELLED, COMPLETED and NO_SHOW rows do not consume capacity."
    constants:
      DEFAULT_CONCURRENT_SHOWING_LIMIT: 1
    precision: "Closed-interval comparison uses <=, so an appointment starting at the exact minute another ends counts as an overlap. The reject test uses >= against the limit."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of AssociationAdmin, Member, SecurityAuditor, LockboxDevice AND is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 10
    category: existence
    check: "Every path id resolves, left to right"
    error_id: ERR_ASSOCIATION_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_LOCKBOX_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_CHARGE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 15
    category: existence
    check: "Every foreign key supplied in the body resolves, checked in the order the endpoint's input list declares them"
    error_id: ERR_ASSOCIATION_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_LOCKBOX_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /members, POST /contractors, POST /lockboxes, POST /listings, POST /lockbox-placements, POST /access-credentials, POST /access-grants, POST /showing-appointments, POST /incident-reviews, POST /_devices/access-attempts, POST /lockboxes/{lockboxId}/state"

  - priority: 20
    category: business_constraint
    check: "Request body shape: required fields present, enum members legal, integers within their declared constraints, ISO 8601 timestamps parseable, pagination limit within [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  - priority: 25
    category: auth
    check: "Member ownership — a Member caller may only act on resources they own: Listing.listing_agent_id == X-User-ID, Lockbox.assigned_member_id == X-User-ID, LockboxPlacement.placed_by_member_id == X-User-ID, ShowingAppointment.showing_member_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /listings, POST /listings/{listingId}/state, POST /lockboxes/{lockboxId}/state, POST /lockbox-placements, POST /lockbox-placements/{placementId}/state, POST /access-grants, POST /access-grants/{grantId}/state, POST /showing-appointments, POST /showing-appointments/{appointmentId}/state"

  - priority: 30
    category: auth
    check: "Segregation of duties — the SecurityAuditor closing an IncidentReview must not be the auditor recorded in opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incident-reviews/{reviewId}/state action=CLOSE"

  - priority: 35
    category: state
    check: "Optimistic concurrency — every supplied expected_<parent>_version equals the current version of the addressed parent entity"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /access-grants, POST /access-credentials, POST /members/{memberId}/membership-events, POST /contractors/{contractorId}/state, POST /lockboxes/{lockboxId}/state, POST /listings/{listingId}/state, POST /lockbox-placements/{placementId}/state, POST /access-credentials/{credentialId}/state, POST /access-grants/{grantId}/state, POST /showing-appointments/{appointmentId}/state, POST /incident-reviews/{reviewId}/state, POST /billing-charges/{chargeId}/state"

  - priority: 40
    category: state
    check: "The addressed entity is in a state from which the requested action has a declared transition in §1.2. For POST /lockbox-placements the addressed entity is the Lockbox: a unit in IN_STOCK, MISSING, QUARANTINE or RETIRED fails here, whereas a unit already in PLACED is deferred to the ERR_PLACEMENT_ALREADY_ACTIVE check at priority 70. This row also outranks the evidence-immutability row at priority 85, so LOCK_EVIDENCE against a review that is already EVIDENCE_LOCKED returns ERR_INVALID_STATE, not ERR_EVIDENCE_LOCKED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every /state and /membership-events action endpoint, POST /lockbox-placements"

  - priority: 42
    category: state
    check: "Cross-entity state precondition on the referenced Member — the Member whose credential is being activated, or who is receiving a lockbox assignment, has membership_status IN {ACTIVE, PROBATION}"
    error_id: ERR_MEMBER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /lockboxes/{lockboxId}/state action=ASSIGN, POST /access-credentials/{credentialId}/state action=ACTIVATE, POST /access-credentials/{credentialId}/state action=REINSTATE"

  - priority: 45
    category: state
    check: "Terminal lockdown — a Lockbox in RETIRED, a Listing in CLOSED or WITHDRAWN, a LockboxPlacement in REMOVED, an AccessCredential in REVOKED or EXPIRED, an AccessGrant in DENIED/REVOKED/EXPIRED/CONSUMED, a ShowingAppointment in COMPLETED/CANCELLED/NO_SHOW, a BillingCharge in PAID/WAIVED/VOID and a Member in TERMINATED accept no further action"
    error_id: ERR_ENTITY_TERMINAL
    http_status: 409
    applies_to: "every /state and /membership-events action endpoint"

  - priority: 50
    category: business_safety
    check: "Physical-safety gate — the addressed Lockbox is not in status MISSING when a placement, grant or showing operation depends on it; and a CONTRACTOR_WINDOW grant's Contractor has status ACTIVE with insurance_expires_on (at 23:59:59.999Z) >= window_end"
    error_id: ERR_LOCKBOX_MISSING | ERR_CONTRACTOR_INSURANCE_EXPIRED
    http_status: 409
    applies_to: "POST /lockbox-placements, POST /access-grants, POST /access-grants/{grantId}/state action=APPROVE"

  - priority: 55
    category: business_safety
    check: "Association posture gate — posture == FROZEN blocks placement creation and grant creation/approval; posture == RESTRICTED blocks only grant_type == CONTRACTOR_WINDOW"
    error_id: ERR_ASSOCIATION_FROZEN | ERR_ASSOCIATION_RESTRICTED
    http_status: 409
    applies_to: "POST /lockbox-placements, POST /access-grants, POST /access-grants/{grantId}/state action=APPROVE"

  - priority: 60
    category: business_temporal
    check: "Window geometry — window_start < window_end; ONE_DAY_MEMBER and INSPECTOR grants span at most 24 hours; CONTRACTOR_WINDOW grants span at most 7 days; approving a grant must not collide with another APPROVED grant on the same lockbox under half-open buffered semantics; confirming a showing must not exceed the listing's concurrent_showing_limit under closed-interval semantics"
    error_id: ERR_INVALID_WINDOW | ERR_GRANT_WINDOW_TOO_LONG | ERR_GRANT_WINDOW_CONFLICT | ERR_SHOWING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /access-grants, POST /access-grants/{grantId}/state action=APPROVE, POST /showing-appointments, POST /showing-appointments/{appointmentId}/state action=CONFIRM, POST /access-credentials/{credentialId}/state action=ACTIVATE"

  - priority: 65
    category: business_constraint
    check: "Quota and uniqueness — a Member caller may not exceed Association.temp_code_daily_limit ONE_DAY_MEMBER grants per UTC day; Lockbox.serial_number is unique within its association; Listing.mls_number is unique within its association; Member.email is unique within its association"
    error_id: ERR_TEMP_CODE_LIMIT_REACHED | ERR_DUPLICATE_SERIAL | ERR_DUPLICATE_MLS_NUMBER
    http_status: 409
    applies_to: "POST /access-grants (Member callers only), POST /lockboxes, POST /listings, POST /members"

  - priority: 70
    category: business_referential
    check: "Linkage integrity — an AccessGrant's lockbox_id must be the lockbox of a LockboxPlacement with placement_status == PLACED on the grant's listing_id; a ShowingAppointment confirmation requires such a placement; a second placement may not be opened for a lockbox that already has one in {PLACED, REMOVAL_DUE, DELINQUENT}"
    error_id: ERR_LOCKBOX_NOT_ON_LISTING | ERR_SHOWING_NO_LOCKBOX | ERR_PLACEMENT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /access-grants, POST /showing-appointments/{appointmentId}/state action=CONFIRM, POST /lockbox-placements"

  - priority: 75
    category: business_fiscal
    check: "Member solvency — a Member with outstanding_balance_cents > 0 may not receive a new lockbox assignment"
    error_id: ERR_MEMBER_BALANCE_DELINQUENT
    http_status: 402
    applies_to: "POST /lockboxes/{lockboxId}/state action=ASSIGN"

  - priority: 80
    category: business_fiscal
    check: "Charge adjustability — a BillingCharge already in PAID, WAIVED or VOID accepts no further money action; a REPLACEMENT charge whose lockbox has been RETIRED may not be voided"
    error_id: ERR_CHARGE_NOT_ADJUSTABLE
    http_status: 409
    applies_to: "POST /billing-charges/{chargeId}/state"

  - priority: 85
    category: business_constraint
    check: "Evidence immutability — an AccessEvent already carrying a non-null incident_review_id may not be pulled into a second review, so POST /incident-reviews whose scope and window would re-stamp such an event is rejected. (LOCK_EVIDENCE against a non-OPEN review is caught earlier by priority 40.)"
    error_id: ERR_EVIDENCE_LOCKED
    http_status: 409
    applies_to: "POST /incident-reviews"

  - priority: 90
    category: business_temporal
    check: "Recovery window — a Lockbox may only be RECOVERed while it is MISSING; once RETIRED the recovery path is closed"
    error_id: ERR_RECOVERY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /lockboxes/{lockboxId}/state action=RECOVER"

# =============================================================================
# §1.5 API Endpoint Table  (flat topology — api_prefix is empty)
# =============================================================================
endpoints:
  # ---- Association ---------------------------------------------------------
  - method: POST
    path: "/associations"
    description: "Register a REALTOR association and its lockbox policy configuration"
    roles: [AssociationAdmin]
    code: 201
    input: [name, jurisdiction_code, "temp_code_daily_limit?", "temp_code_overage_fee_cents?", "removal_grace_days?", "late_removal_daily_fee_cents?", "late_removal_cap_cents?", "credential_cap_per_member?", "grant_buffer_minutes?", "recovery_target_pct?"]
    output: Association
    side_effects: ["posture initialised to OPEN", "all computed counters initialised to 0", "recovery_rate_pct initialised to 0.00"]

  - method: GET
    path: "/associations/{associationId}"
    description: "Read one association with its live counters and posture"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: Association
    side_effects: []

  - method: GET
    path: "/associations/{associationId}/recovery-summary"
    description: "Computed read: lockbox recovery rate for a window under the requested variant (closing_cohort default)"
    roles: [AssociationAdmin, SecurityAuditor]
    code: 200
    input: ["variant?", "window_start?", "window_end?"]
    output: "{ variant: string, window_start: string, window_end: string, denominator_count: integer, numerator_count: integer, recovery_rate_pct: number, recovery_target_pct: number, posture: string }"
    side_effects: []

  - method: POST
    path: "/associations/{associationId}/compliance-runs"
    description: "Ops-run checkpoint. Executes, in this pinned order: (1) expire AccessGrants whose window_end <= clock_now; (2) expire AccessCredentials whose expires_at <= clock_now; (3) expire Members whose dues_paid_through has lapsed, cascading their ACTIVE credentials to SUSPENDED; (4) flip REMOVAL_DUE placements past removal_deadline to DELINQUENT and accrue their LATE_REMOVAL charges; (5) recompute recovery_rate_pct and posture. Within each step rows are processed by created_at ASC."
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: "{ run_at: string, expired_grant_count: integer, expired_credential_count: integer, expired_member_count: integer, delinquent_placement_count: integer, accrued_charge_count: integer, recovery_rate_pct: number, posture: string }"
    side_effects: ["AccessGrant APPROVED|REQUESTED -> EXPIRED", "AccessCredential ACTIVE|SUSPENDED -> EXPIRED", "Member ACTIVE|PROBATION -> EXPIRED with credential cascade", "LockboxPlacement REMOVAL_DUE -> DELINQUENT with billing_status NONE -> ACCRUED and a LATE_REMOVAL BillingCharge", "Member.outstanding_balance_cents recomputed", "Association.recovery_rate_pct and posture recomputed"]

  # ---- Member --------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Enroll a member; the system auto-transitions PENDING -> ACTIVE or PENDING -> EXPIRED from dues_paid_through inside this request"
    roles: [AssociationAdmin]
    code: 201
    input: [association_id, full_name, email, dues_paid_through]
    output: Member
    side_effects: ["membership_status resolved by the PENDING auto-transition", "active_credential_count = 0, outstanding_balance_cents = 0"]

  - method: GET
    path: "/members/{memberId}"
    description: "Read one member with live balance and credential counters"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members, filterable by association and membership status"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["association_id?", "membership_status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{memberId}/membership-events"
    description: "Drive the Member state machine: RENEW, PLACE_ON_PROBATION, SUSPEND, REINSTATE, EXPIRE, TERMINATE"
    roles: [AssociationAdmin]
    code: 200
    input: [event_type, "paid_through_date?", "reason?", expected_member_version]
    output: Member
    side_effects: ["increments Member.version by 1", "SUSPEND fires the three-hop credential -> grant -> appointment cascade", "REINSTATE and RENEW restore credentials with suspended_by_cascade == true", "TERMINATE revokes every credential"]

  # ---- Contractor ----------------------------------------------------------
  - method: POST
    path: "/contractors"
    description: "Register a vendor authorised for contractor access windows"
    roles: [AssociationAdmin]
    code: 201
    input: [association_id, company_name, insurance_expires_on]
    output: Contractor
    side_effects: ["status initialised to ACTIVE"]

  - method: GET
    path: "/contractors/{contractorId}"
    description: "Read one contractor"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: Contractor
    side_effects: []

  - method: GET
    path: "/contractors"
    description: "List contractors, filterable by association and status"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["association_id?", "status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []

  - method: POST
    path: "/contractors/{contractorId}/state"
    description: "Suspend or reactivate a vendor (action: SUSPEND | REACTIVATE)"
    roles: [AssociationAdmin]
    code: 200
    input: [action, expected_contractor_version]
    output: Contractor
    side_effects: ["increments Contractor.version by 1"]

  # ---- Lockbox -------------------------------------------------------------
  - method: POST
    path: "/lockboxes"
    description: "Intake a lockbox into association inventory (status IN_STOCK)"
    roles: [AssociationAdmin]
    code: 201
    input: [association_id, serial_number, model, replacement_cost_cents, in_service_since]
    output: Lockbox
    side_effects: ["Association.lockbox_total_count += 1", "Association.unplaced_inventory_count += 1"]

  - method: GET
    path: "/lockboxes/{lockboxId}"
    description: "Read one lockbox"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: Lockbox
    side_effects: []

  - method: GET
    path: "/lockboxes"
    description: "List lockboxes, filterable by association, holder, current listing and status"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["association_id?", "assigned_member_id?", "current_listing_id?", "status?", "limit?", "offset?"]
    output: Lockbox[]
    side_effects: []

  - method: POST
    path: "/lockboxes/{lockboxId}/state"
    description: "Drive the Lockbox state machine (action: ASSIGN | RETURN | REPORT_LOST | REPORT_STOLEN | RECOVER | RETIRE). ASSIGN requires member_id; REPORT_STOLEN requires police_report_number."
    roles: [AssociationAdmin, Member]
    code: 200
    input: [action, "member_id?", "police_report_number?", expected_lockbox_version]
    output: Lockbox
    side_effects: ["increments Lockbox.version by 1", "REPORT_LOST / REPORT_STOLEN create a REPLACEMENT BillingCharge via replacement_charge_amount and fire the placement -> grant -> appointment cascade", "RECOVER voids the open REPLACEMENT charge and restores Member.outstanding_balance_cents", "Association counters and posture recomputed"]

  # ---- Listing -------------------------------------------------------------
  - method: POST
    path: "/listings"
    description: "Create a listing owned by a member agent"
    roles: [AssociationAdmin, Member]
    code: 201
    input: [association_id, listing_agent_id, address_line, mls_number, "concurrent_showing_limit?"]
    output: Listing
    side_effects: ["status initialised to ACTIVE"]

  - method: GET
    path: "/listings/{listingId}"
    description: "Read one listing"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/listings"
    description: "List listings, filterable by association, agent and status"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["association_id?", "listing_agent_id?", "status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/listings/{listingId}/state"
    description: "Drive the Listing state machine (action: MARK_UNDER_CONTRACT | REACTIVATE | CLOSE | WITHDRAW). CLOSE requires close_date."
    roles: [AssociationAdmin, Member]
    code: 200
    input: [action, "close_date?", expected_listing_version]
    output: Listing
    side_effects: ["increments Listing.version by 1", "CLOSE and WITHDRAW fire the placement -> grant -> appointment cascade and set removal_deadline", "Association.recovery_rate_pct recomputed"]

  # ---- LockboxPlacement ----------------------------------------------------
  - method: POST
    path: "/lockbox-placements"
    description: "Place an assigned lockbox on an active listing"
    roles: [AssociationAdmin, Member]
    code: 201
    input: [lockbox_id, listing_id]
    output: LockboxPlacement
    side_effects: ["Lockbox ASSIGNED -> PLACED with current_listing_id set", "Association.unplaced_inventory_count -= 1", "Association.active_placement_count += 1 and posture recomputed"]

  - method: GET
    path: "/lockbox-placements/{placementId}"
    description: "Read one placement with both status dimensions"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: LockboxPlacement
    side_effects: []

  - method: GET
    path: "/lockbox-placements"
    description: "List placements, filterable by lockbox, listing, placing member and either status dimension"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["lockbox_id?", "listing_id?", "placed_by_member_id?", "placement_status?", "billing_status?", "limit?", "offset?"]
    output: LockboxPlacement[]
    side_effects: []

  - method: POST
    path: "/lockbox-placements/{placementId}/state"
    description: "Record physical removal of the lockbox from the property (action: REMOVE)"
    roles: [AssociationAdmin, Member]
    code: 200
    input: [action, expected_placement_version]
    output: LockboxPlacement
    side_effects: ["increments LockboxPlacement.version by 1", "Lockbox PLACED -> ASSIGNED", "Association.unplaced_inventory_count += 1, delinquent_placement_count, recovery_rate_pct and posture recomputed"]

  # ---- AccessCredential ----------------------------------------------------
  - method: POST
    path: "/access-credentials"
    description: "Issue a keyholder credential to a member. When the member already holds Association.credential_cap_per_member ACTIVE credentials, the earliest-created ACTIVE one (created_at ASC) is revoked with supersede_reason CREDENTIAL_CAP_SUPERSEDE."
    roles: [AssociationAdmin]
    code: 201
    input: [member_id, credential_type, expires_at, expected_member_version]
    output: AccessCredential
    side_effects: ["increments Member.version by 1", "status initialised to PENDING_ACTIVATION", "credential-cap supersede may revoke the earliest ACTIVE credential and recompute Member.active_credential_count"]

  - method: GET
    path: "/access-credentials/{credentialId}"
    description: "Read one credential"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: AccessCredential
    side_effects: []

  - method: GET
    path: "/access-credentials"
    description: "List credentials, filterable by member, status and type"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["member_id?", "status?", "credential_type?", "limit?", "offset?"]
    output: AccessCredential[]
    side_effects: []

  - method: POST
    path: "/access-credentials/{credentialId}/state"
    description: "Drive the credential state machine (action: ACTIVATE | SUSPEND | REINSTATE | REVOKE)"
    roles: [AssociationAdmin]
    code: 200
    input: [action, expected_credential_version]
    output: AccessCredential
    side_effects: ["increments AccessCredential.version by 1", "Member.active_credential_count recomputed"]

  # ---- AccessGrant ---------------------------------------------------------
  - method: POST
    path: "/access-grants"
    description: "Request a temporary access code: a one-day member code, an inspector code, or a contractor window. A Member caller is capped at Association.temp_code_daily_limit ONE_DAY_MEMBER grants per UTC day; an AssociationAdmin may issue past that cap, which accrues a TEMP_CODE_OVERAGE charge instead of failing."
    roles: [AssociationAdmin, Member]
    code: 201
    input: [listing_id, lockbox_id, grant_type, window_start, window_end, "contractor_id?", "max_uses?", "supersedes_grant_id?", expected_listing_version]
    output: AccessGrant
    side_effects: ["increments Listing.version by 1", "status initialised to REQUESTED", "an over-cap admin issuance creates a TEMP_CODE_OVERAGE BillingCharge of Association.temp_code_overage_fee_cents and recomputes Member.outstanding_balance_cents"]

  - method: GET
    path: "/access-grants/{grantId}"
    description: "Read one grant"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: AccessGrant
    side_effects: []

  - method: GET
    path: "/access-grants"
    description: "List grants, filterable by listing, lockbox, issuer, contractor, superseded grant, type and status"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["listing_id?", "lockbox_id?", "issued_by_member_id?", "contractor_id?", "supersedes_grant_id?", "grant_type?", "status?", "limit?", "offset?"]
    output: AccessGrant[]
    side_effects: []

  - method: POST
    path: "/access-grants/{grantId}/state"
    description: "Approve, deny or revoke a grant (action: APPROVE | DENY | REVOKE). APPROVE runs the insurance gate, the posture gate and the half-open buffered lockbox-occupation check."
    roles: [AssociationAdmin, Member]
    code: 200
    input: [action, expected_grant_version]
    output: AccessGrant
    side_effects: ["increments AccessGrant.version by 1", "APPROVE mints access_code, revokes any supersedes_grant_id target and increments Listing.version by 1"]

  # ---- ShowingAppointment --------------------------------------------------
  - method: POST
    path: "/showing-appointments"
    description: "Request a showing window on a listing for a buyer-side agent"
    roles: [AssociationAdmin, Member]
    code: 201
    input: [listing_id, showing_member_id, window_start, window_end]
    output: ShowingAppointment
    side_effects: ["status initialised to REQUESTED", "access_event_count = 0"]

  - method: GET
    path: "/showing-appointments/{appointmentId}"
    description: "Read one showing appointment"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects: []

  - method: GET
    path: "/showing-appointments"
    description: "List showings, filterable by listing, showing agent and status"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["listing_id?", "showing_member_id?", "status?", "limit?", "offset?"]
    output: ShowingAppointment[]
    side_effects: []

  - method: POST
    path: "/showing-appointments/{appointmentId}/state"
    description: "Drive the showing state machine (action: CONFIRM | CANCEL | COMPLETE | MARK_NO_SHOW). CONFIRM runs the closed-interval capacity check and requires a PLACED lockbox on the listing."
    roles: [AssociationAdmin, Member]
    code: 200
    input: [action, expected_appointment_version]
    output: ShowingAppointment
    side_effects: ["increments ShowingAppointment.version by 1", "CANCEL by explicit action sets cancel_reason AGENT_CANCELLED"]

  # ---- AccessEvent ---------------------------------------------------------
  - method: POST
    path: "/_devices/access-attempts"
    description: "Device-gateway ingress for a physical access attempt at a lockbox. The outcome is derived by access_outcome_resolution, never supplied. occurred_at defaults to the logical clock when omitted."
    roles: [LockboxDevice]
    code: 201
    input: [lockbox_id, actor_type, "credential_id?", "grant_id?", "occurred_at?"]
    output: AccessEvent
    side_effects: ["AccessEvent appended (immutable)", "a GRANTED event on a grant raises uses_count and may drive APPROVED -> CONSUMED", "a GRANTED event matched to a CONFIRMED showing raises ShowingAppointment.access_event_count"]

  - method: GET
    path: "/access-events/{eventId}"
    description: "Read one access-log entry"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: AccessEvent
    side_effects: []

  - method: GET
    path: "/access-events"
    description: "Access-log review: list events filterable by lockbox, credential, grant, listing, matched showing, stamping incident review and outcome"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["lockbox_id?", "credential_id?", "grant_id?", "listing_id?", "matched_appointment_id?", "incident_review_id?", "outcome?", "limit?", "offset?"]
    output: AccessEvent[]
    side_effects: []

  # ---- IncidentReview ------------------------------------------------------
  - method: POST
    path: "/incident-reviews"
    description: "Open a post-incident access-log review scoped to a lockbox and/or a listing over an inclusive event window"
    roles: [SecurityAuditor]
    code: 201
    input: [association_id, window_start, window_end, "listing_id?", "lockbox_id?"]
    output: IncidentReview
    side_effects: ["status initialised to OPEN", "opened_by_user_id := X-User-ID", "risk_score 0.00, event_count 0, severity LOW"]

  - method: GET
    path: "/incident-reviews/{reviewId}"
    description: "Read one incident review with its scored evidence set"
    roles: [AssociationAdmin, SecurityAuditor]
    code: 200
    input: []
    output: IncidentReview
    side_effects: []

  - method: GET
    path: "/incident-reviews"
    description: "List incident reviews, filterable by association, listing, lockbox and status"
    roles: [AssociationAdmin, SecurityAuditor]
    code: 200
    input: ["association_id?", "listing_id?", "lockbox_id?", "status?", "limit?", "offset?"]
    output: IncidentReview[]
    side_effects: []

  - method: POST
    path: "/incident-reviews/{reviewId}/state"
    description: "Drive the review state machine (action: LOCK_EVIDENCE | CLOSE | REOPEN). CLOSE enforces segregation of duties against opened_by_user_id and requires findings when severity is CRITICAL."
    roles: [SecurityAuditor]
    code: 200
    input: [action, "findings?", expected_review_version]
    output: IncidentReview
    side_effects: ["increments IncidentReview.version by 1", "LOCK_EVIDENCE and REOPEN stamp AccessEvent.incident_review_id and recompute event_count, risk_score and severity"]

  # ---- BillingCharge -------------------------------------------------------
  - method: GET
    path: "/billing-charges/{chargeId}"
    description: "Read one charge with its derivation basis and applied variant"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: []
    output: BillingCharge
    side_effects: []

  - method: GET
    path: "/billing-charges"
    description: "List charges, filterable by member, lockbox, placement, type and status"
    roles: [AssociationAdmin, Member, SecurityAuditor]
    code: 200
    input: ["member_id?", "lockbox_id?", "placement_id?", "charge_type?", "status?", "limit?", "offset?"]
    output: BillingCharge[]
    side_effects: []

  - method: POST
    path: "/billing-charges/{chargeId}/state"
    description: "Money action on a charge (action: INVOICE | PAY | WAIVE | VOID)"
    roles: [AssociationAdmin]
    code: 200
    input: [action, expected_charge_version]
    output: BillingCharge
    side_effects: ["increments BillingCharge.version by 1", "Member.outstanding_balance_cents recomputed", "linked LockboxPlacement.billing_status moves ACCRUED -> SETTLED (PAY/WAIVE) or ACCRUED -> NONE (VOID)"]

  # ---- Logical clock (test-driving) ---------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [AssociationAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; expiries and delinquency are realised only by the next compliance run"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller's role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member caller acting on a listing, lockbox, placement or showing they do not own" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The auditor closing an incident review is the same user who opened it" }
  - { id: ERR_ASSOCIATION_NOT_FOUND, http: 404, condition: "association_id in path or body does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "memberId / member_id / listing_agent_id / showing_member_id does not resolve" }
  - { id: ERR_CONTRACTOR_NOT_FOUND, http: 404, condition: "contractorId / contractor_id does not resolve" }
  - { id: ERR_LOCKBOX_NOT_FOUND, http: 404, condition: "lockboxId / lockbox_id does not resolve" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "listingId / listing_id does not resolve" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "placementId does not resolve" }
  - { id: ERR_CREDENTIAL_NOT_FOUND, http: 404, condition: "credentialId / credential_id does not resolve" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "grantId / grant_id / supersedes_grant_id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointmentId does not resolve" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "eventId does not resolve" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "reviewId does not resolve" }
  - { id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "chargeId does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, illegal enum member, out-of-range integer, unparseable timestamp, pagination outside [1,100]/offset<0, CONTRACTOR_WINDOW without contractor_id, REPORT_STOLEN without police_report_number, or CLOSE of a CRITICAL review without findings" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the addressed parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "No declared transition exists from the entity's current state for the requested action" }
  - { id: ERR_ENTITY_TERMINAL, http: 409, condition: "The addressed entity is already in a terminal state" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 409, condition: "Referenced member's membership_status is not in {ACTIVE, PROBATION}" }
  - { id: ERR_LOCKBOX_MISSING, http: 409, condition: "The addressed lockbox is in status MISSING and cannot back a placement, grant or showing" }
  - { id: ERR_CONTRACTOR_INSURANCE_EXPIRED, http: 409, condition: "Contractor is SUSPENDED, or insurance_expires_on falls before the grant's window_end" }
  - { id: ERR_ASSOCIATION_FROZEN, http: 409, condition: "Association.posture == FROZEN blocks placement and grant operations" }
  - { id: ERR_ASSOCIATION_RESTRICTED, http: 409, condition: "Association.posture == RESTRICTED blocks CONTRACTOR_WINDOW grants specifically" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start >= window_end, or a credential's expires_at is not in the future at activation" }
  - { id: ERR_GRANT_WINDOW_TOO_LONG, http: 422, condition: "ONE_DAY_MEMBER/INSPECTOR window exceeds 24 hours, or CONTRACTOR_WINDOW exceeds 7 days" }
  - { id: ERR_GRANT_WINDOW_CONFLICT, http: 409, condition: "Approving the grant would overlap another APPROVED grant on the same lockbox under half-open buffered semantics" }
  - { id: ERR_SHOWING_CAPACITY_EXCEEDED, http: 409, condition: "Confirming the showing would exceed Listing.concurrent_showing_limit under closed-interval overlap" }
  - { id: ERR_TEMP_CODE_LIMIT_REACHED, http: 409, condition: "Member caller already issued Association.temp_code_daily_limit ONE_DAY_MEMBER grants today" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_number already exists within the association" }
  - { id: ERR_DUPLICATE_MLS_NUMBER, http: 409, condition: "mls_number already exists within the association" }
  - { id: ERR_LOCKBOX_NOT_ON_LISTING, http: 409, condition: "The grant's lockbox has no PLACED placement on the grant's listing" }
  - { id: ERR_SHOWING_NO_LOCKBOX, http: 409, condition: "Confirming a showing on a listing that has no PLACED lockbox placement" }
  - { id: ERR_PLACEMENT_ALREADY_ACTIVE, http: 409, condition: "The lockbox already has a placement in {PLACED, REMOVAL_DUE, DELINQUENT}" }
  - { id: ERR_MEMBER_BALANCE_DELINQUENT, http: 402, condition: "Assigning a lockbox to a member whose outstanding_balance_cents > 0" }
  - { id: ERR_CHARGE_NOT_ADJUSTABLE, http: 409, condition: "Money action on a charge already PAID, WAIVED or VOID" }
  - { id: ERR_EVIDENCE_LOCKED, http: 409, condition: "Opening an IncidentReview whose scope and window cover AccessEvents already stamped with another review id" }
  - { id: ERR_RECOVERY_WINDOW_CLOSED, http: 409, condition: "RECOVER requested on a lockbox that is not MISSING" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssociationAdmin
    description: "Association staff: owns inventory, membership, credentials, grant approval, billing and the ops-run checkpoint. May never open or close an incident review."
    identity: "opaque"
    exclusive_operations:
      - "POST /associations"
      - "POST /associations/{associationId}/compliance-runs"
      - "POST /members"
      - "POST /members/{memberId}/membership-events"
      - "POST /contractors"
      - "POST /contractors/{contractorId}/state"
      - "POST /lockboxes"
      - "POST /access-credentials"
      - "POST /access-credentials/{credentialId}/state"
      - "POST /billing-charges/{chargeId}/state"
      - "POST /_clock/set_current_utc"
      - "POST /lockboxes/{lockboxId}/state with action IN {ASSIGN, RECOVER, RETIRE}"
      - "POST /access-grants/{grantId}/state with action IN {APPROVE, DENY}"
      - "POST /access-grants over Association.temp_code_daily_limit (accrues TEMP_CODE_OVERAGE instead of failing)"
    shared_operations:
      - "POST /listings, POST /listings/{listingId}/state (shared with Member)"
      - "POST /lockbox-placements, POST /lockbox-placements/{placementId}/state (shared with Member)"
      - "POST /showing-appointments, POST /showing-appointments/{appointmentId}/state (shared with Member)"
      - "POST /access-grants, POST /access-grants/{grantId}/state action=REVOKE (shared with Member)"
      - "POST /lockboxes/{lockboxId}/state with action IN {RETURN, REPORT_LOST, REPORT_STOLEN} (shared with Member)"
      - "All GET endpoints except none — reads everything"
      - "GET /associations/{associationId}/recovery-summary (shared with SecurityAuditor)"

  - name: Member
    description: "Licensed keyholder agent. Holds lockboxes, places them on their own listings, issues temporary codes and books showings. Cannot approve grants, cannot touch billing, cannot audit."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "None — every Member operation is also available to AssociationAdmin, but only a Member is subject to the ownership check and the temp_code_daily_limit quota"
    shared_operations:
      - "POST /listings, POST /listings/{listingId}/state (own listings only)"
      - "POST /lockbox-placements, POST /lockbox-placements/{placementId}/state (own lockbox / own placement only)"
      - "POST /lockboxes/{lockboxId}/state with action IN {RETURN, REPORT_LOST, REPORT_STOLEN} (own lockbox only)"
      - "POST /access-grants (own listings only, capped by temp_code_daily_limit)"
      - "POST /access-grants/{grantId}/state action=REVOKE (own listing's grants only)"
      - "POST /showing-appointments, POST /showing-appointments/{appointmentId}/state"
      - "GET /associations/{associationId}, GET /members, GET /members/{memberId}, GET /contractors, GET /contractors/{contractorId}, GET /lockboxes, GET /lockboxes/{lockboxId}, GET /listings, GET /listings/{listingId}, GET /lockbox-placements, GET /lockbox-placements/{placementId}, GET /access-credentials, GET /access-credentials/{credentialId}, GET /access-grants, GET /access-grants/{grantId}, GET /showing-appointments, GET /showing-appointments/{appointmentId}, GET /access-events, GET /access-events/{eventId}, GET /billing-charges, GET /billing-charges/{chargeId}"

  - name: SecurityAuditor
    description: "Independent association compliance officer. Opens, locks and closes incident reviews over the access log. Segregated from AssociationAdmin: cannot mutate inventory, membership, credentials, grants or money."
    identity: "opaque"
    exclusive_operations:
      - "POST /incident-reviews"
      - "POST /incident-reviews/{reviewId}/state"
    shared_operations:
      - "GET /incident-reviews, GET /incident-reviews/{reviewId} (shared with AssociationAdmin)"
      - "GET /associations/{associationId}/recovery-summary (shared with AssociationAdmin)"
      - "All read endpoints over members, contractors, lockboxes, listings, placements, credentials, grants, showings, access events and billing charges"

  - name: LockboxDevice
    description: "The lockbox hardware gateway. Its only capability is appending an access attempt to the audit log; the server derives the outcome."
    identity: "opaque"
    exclusive_operations:
      - "POST /_devices/access-attempts"
    shared_operations: []
