# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner Design (Coverage Index)
# task_1302_neighborhood_pet_sitting_cooperative
# Breadth coverage of every §1.1–§1.7 claim not already probed by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections and claim_type values follow
# references/claim-extraction-guide.md. excluded_because stubs cite §1.8
# instance names that already exercise the corner.
#
# The PINNED READING for the mutual-vouch bootstrap documented at the top of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml applies identically here (founding clique of
# three; reciprocal rows accepted as mutual-confirmation rows;
# ERR_REFEREE_NOT_VETTED remains enforced for non-mutual non-VETTED referees).
# Default logical clock 2026-08-01T00:00:00Z per the §1.5 clock endpoint.
#
# Known scaffold coverage note: ERR_NO_CHECKIN has no reachable trigger under
# the declared §1.2/§1.5 surface (checkout requires status IN_PROGRESS, which
# itself requires a prior CHECK_IN), so no instance claims it — documented here
# per the SKILL's honesty rule rather than papered over with a broken chain.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: member_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Member, "endpoints[POST /coop/members]"]
        distinguishing_aspect: "POST /coop/members with only required inputs returns 201 with vetting_status APPLIED, reliability_score 50, both credit fields 0.00, mediator_flag defaulted false, version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["Empty DB; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { display_name: "Solo Applicant", email: "solo@coop.test", address_block: "MAPLE-100", phone: "+15550301" }
              as: Anonymous
              captures: { m_id: $.data.id, m_status: $.data.vetting_status, m_score: $.data.reliability_score, m_flag: $.data.mediator_flag }
          assert:
            - "response 201; Member.${m_id}.vetting_status == APPLIED"
            - "Member.${m_id}.reliability_score == 50 and credit_balance_hours == 0.00 and provisional_credit_hours == 0.00"
            - "Member.${m_id}.mediator_flag == false (default applied when omitted)"
            - "Member.${m_id}.version == 1 and id/created_at/updated_at are server-stamped (created_at == 2026-08-01T00:00:00Z logical clock)"
            - "GET /coop/members/${m_id} as CoopAdmin returns the same field values (retrieval)"

      - name: member_creation_missing_required_email_returns_400
        claim_type: required_fields
        grounds: [entities.Member.fields.email, "validations[priority=17]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field email is rejected with 400 ERR_INVALID_REQUEST; no member row is persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { display_name: "No Email", address_block: "MAPLE-100", phone: "+15550302" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /coop/members as CoopAdmin returns total_count == 0"

      - name: pet_profile_creation_system_fields
        claim_type: system_fields
        grounds: [entities.PetProfile, "endpoints[POST /coop/members/{memberId}/pet-profiles]"]
        distinguishing_aspect: "Pet creation derives owner_member_id from X-User-ID (not from the path or payload), defaults active to true, and returns 201 with all eight care fields persisted verbatim."
        test_recipe:
          setup: ["Founders F1/F2/F3 VETTED (canonical mutual-vouch bootstrap)"]
          setup_api_calls:
            - &mk_f1
              call: "POST /coop/members"
              payload: { display_name: "Founder One", email: "f1@coop.test", address_block: "MAPLE-100", phone: "+15550101" }
              as: Anonymous
              captures: { f1_id: $.data.id }
            - &mk_f2
              call: "POST /coop/members"
              payload: { display_name: "Founder Two", email: "f2@coop.test", address_block: "MAPLE-100", phone: "+15550102" }
              as: Anonymous
              captures: { f2_id: $.data.id }
            - &mk_f3
              call: "POST /coop/members"
              payload: { display_name: "Founder Three", email: "f3@coop.test", address_block: "MAPLE-100", phone: "+15550103", mediator_flag: true }
              as: Anonymous
              captures: { f3_id: $.data.id }
            - &ref_f1f2
              call: "POST /coop/members/${f1_id}/references"
              payload: { referee_member_id: "${f2_id}", relationship_years: 5, attestation_text: "Known neighbor for five years." }
              as: CoopAdmin
              captures: { ref_f1f2: $.data.id }
            - &ref_f1f3
              call: "POST /coop/members/${f1_id}/references"
              payload: { referee_member_id: "${f3_id}", relationship_years: 4, attestation_text: "Known neighbor for four years." }
              as: CoopAdmin
              captures: { ref_f1f3: $.data.id }
            - &ref_f2f1
              call: "POST /coop/members/${f2_id}/references"
              payload: { referee_member_id: "${f1_id}", relationship_years: 5, attestation_text: "Known neighbor for five years." }
              as: CoopAdmin
              captures: { ref_f2f1: $.data.id }
            - &ref_f2f3
              call: "POST /coop/members/${f2_id}/references"
              payload: { referee_member_id: "${f3_id}", relationship_years: 3, attestation_text: "Known neighbor for three years." }
              as: CoopAdmin
              captures: { ref_f2f3: $.data.id }
            - &ref_f3f1
              call: "POST /coop/members/${f3_id}/references"
              payload: { referee_member_id: "${f1_id}", relationship_years: 4, attestation_text: "Known neighbor for four years." }
              as: CoopAdmin
              captures: { ref_f3f1: $.data.id }
            - &ref_f3f2
              call: "POST /coop/members/${f3_id}/references"
              payload: { referee_member_id: "${f2_id}", relationship_years: 3, attestation_text: "Known neighbor for three years." }
              as: CoopAdmin
              captures: { ref_f3f2: $.data.id }
            - &liab_f1
              call: "POST /coop/members/${f1_id}/accept-liability"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
            - &liab_f2
              call: "POST /coop/members/${f2_id}/accept-liability"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
            - &liab_f3
              call: "POST /coop/members/${f3_id}/accept-liability"
              payload: {}
              as: Member
              as_user_id: "${f3_id}"
            - &sub_f1
              call: "POST /coop/members/${f1_id}/submit-references"
              payload: {}
              as: CoopAdmin
            - &sub_f2
              call: "POST /coop/members/${f2_id}/submit-references"
              payload: {}
              as: CoopAdmin
            - &sub_f3
              call: "POST /coop/members/${f3_id}/submit-references"
              payload: {}
              as: CoopAdmin
            - &acc_f1f2
              call: "POST /coop/member-references/${ref_f1f2}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f1f3
              call: "POST /coop/member-references/${ref_f1f3}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f2f1
              call: "POST /coop/member-references/${ref_f2f1}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f2f3
              call: "POST /coop/member-references/${ref_f2f3}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f3f1
              call: "POST /coop/member-references/${ref_f3f1}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f3f2
              call: "POST /coop/member-references/${ref_f3f2}/accept"
              payload: {}
              as: CoopAdmin
            - &fin_f1
              call: "POST /coop/members/${f1_id}/finalize-vetting"
              payload: {}
              as: CoopAdmin
            - &fin_f2
              call: "POST /coop/members/${f2_id}/finalize-vetting"
              payload: {}
              as: CoopAdmin
            - &fin_f3
              call: "POST /coop/members/${f3_id}/finalize-vetting"
              payload: {}
              as: CoopAdmin
          trigger:
            - &pet_f1
              call: "POST /coop/members/${f1_id}/pet-profiles"
              payload: { pet_name: "Biscuit", species: "DOG", routine_notes: "Feed twice daily, walk morning.", medical_notes: "No medications.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${f1_id}"
              captures: { pet1_id: $.data.id, pet_owner: $.data.owner_member_id }
          assert:
            - "response 201; PetProfile.${pet1_id}.owner_member_id == ${f1_id} (system-derived from X-User-ID)"
            - "PetProfile.${pet1_id}.active == true (system default) and species == DOG"
            - "GET /coop/pet-profiles/${pet1_id} returns the stored emergency_vet_* and routine/medical notes verbatim"

      - name: holiday_window_enabled_default_true
        claim_type: defaults
        grounds: [entities.HolidayWindow.fields.enabled, "endpoints[POST /coop/holiday-windows]"]
        distinguishing_aspect: "Omitting the optional enabled input yields enabled == true; the row is retrievable and listed under enabled=true."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/holiday-windows"
              payload: { name: "Labor Day", window_start: "2026-09-07T00:00:00Z", window_end: "2026-09-08T00:00:00Z", demand_multiplier: 1.5 }
              as: CoopAdmin
              captures: { w_id: $.data.id, w_enabled: $.data.enabled }
          assert:
            - "response 201; HolidayWindow.${w_id}.enabled == true (default applied)"
            - "GET /coop/holiday-windows?enabled=true contains ${w_id}"

      - name: sitting_request_computed_fields_at_posting
        claim_type: computed_fields
        grounds: [entities.SittingRequest.fields.credit_hours_offered, entities.SittingRequest.fields.expires_at, calculations.credit_hours_offered]
        distinguishing_aspect: "Posting computes and locks credit_hours_offered (4h x 1.0 == 4.00 with no windows) and derives expires_at == start_at - 4h == 2026-09-10T06:00:00Z; both are computed fields the client cannot set."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
          trigger:
            - &req_a
              call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-09-10T10:00:00Z", end_at: "2026-09-10T14:00:00Z", instructions: "Canonical 4h sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { req_id: $.data.id, req_v: $.data.version, req_offered: $.data.credit_hours_offered, req_exp: $.data.expires_at }
          assert:
            - "SittingRequest.${req_id}.credit_hours_offered == 4.00 (computed, locked at posting)"
            - "SittingRequest.${req_id}.expires_at == 2026-09-10T06:00:00Z (start_at - 4h)"
            - "SittingRequest.${req_id}.status == OPEN (initial state) and owner_member_id == ${f1_id} and version == 1"

      - name: immutable_entry_log_and_ledger_entry
        claim_type: immutability
        grounds: [entities.EntryLog, entities.CreditLedgerEntry]
        distinguishing_aspect: "common_fields: false entities expose id/created_at but NO version or updated_at, and §1.5 declares no update/delete endpoint for either; responses for both lack those fields."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1; canonical request accepted (F2 sitter); one PET_FED entry logged"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - &claim_f2
              call: "POST /coop/sitting-requests/${req_id}/claims"
              payload: { message: "Happy to sit Biscuit" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { claim_id: $.data.id }
            - &accept_a
              call: "POST /coop/sitting-requests/${req_id}/claims/${claim_id}/accept"
              payload: { expected_sitting_request_version: "${req_v}" }
              as: Member
              as_user_id: "${f1_id}"
            - &get_asg
              call: "GET /coop/sitting-requests/${req_id}/assignment"
              as: CoopAdmin
              captures: { asg_id: "$.data[0].id" }
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "PET_FED", occurred_at: "2026-09-10T12:00:00Z", notes: "Half cup kibble" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { entry_id: $.data.id }
            - call: "GET /coop/members/${f2_id}/credit-ledger"
              as: CoopAdmin
          assert:
            - "EntryLog.${entry_id} response contains id and created_at but no version and no updated_at keys"
            - "Credit ledger rows (JOINING_GRANT +10.0) contain id and created_at but no version and no updated_at keys"
            - "EntryLog.${entry_id}.actor_member_id == ${f2_id} (system-set from X-User-ID)"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID path id returns 404 ERR_NOT_FOUND per the left-to-right existence rule."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /coop/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 404 with error_id == ERR_NOT_FOUND"

      - name: nested_claim_on_missing_request_returns_404
        claim_type: parent_relationships
        grounds: ["validations[priority=3]", entities.SittingClaim.fields.sitting_request_id]
        distinguishing_aspect: "POST /coop/sitting-requests/{nonexistent}/claims validates path resources left-to-right and 404s on the missing parent before any claim field validation."
        test_recipe:
          setup: ["One applicant exists (claim actor)"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { display_name: "Claimant", email: "claimant@coop.test", address_block: "MAPLE-100", phone: "+15550303" }
              as: Anonymous
              captures: { x_id: $.data.id }
          trigger:
            - call: "POST /coop/sitting-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/claims"
              payload: { message: "Claiming a ghost request" }
              as: Member
              as_user_id: "${x_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 404 with error_id == ERR_NOT_FOUND (parent request resolved first)"

      - name: pet_profile_invalid_enum_species_returns_400
        claim_type: type_constraints
        grounds: [entities.PetProfile.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "species is a closed enum {DOG, CAT, BIRD, RABBIT, OTHER}; 'DINOSAUR' is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One applicant exists"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { display_name: "Pet Owner", email: "owner@coop.test", address_block: "MAPLE-100", phone: "+15550304" }
              as: Anonymous
              captures: { x_id: $.data.id }
          trigger:
            - call: "POST /coop/members/${x_id}/pet-profiles"
              payload: { pet_name: "Rex", species: "DINOSAUR", routine_notes: "Roam free.", medical_notes: "None.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${x_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /coop/members/${x_id}/pet-profiles returns empty array"

      - name: holiday_window_multiplier_out_of_range_returns_400
        claim_type: type_constraints
        grounds: [entities.HolidayWindow.fields.demand_multiplier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "demand_multiplier is constrained to [1.0, 3.0]: 3.5 is rejected with 400 while exactly 3.0 is accepted (inclusive upper bound)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/holiday-windows"
              payload: { name: "TooHot", window_start: "2026-12-24T00:00:00Z", window_end: "2026-12-26T00:00:00Z", demand_multiplier: 3.5 }
              as: CoopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /coop/holiday-windows"
              payload: { name: "MaxOK", window_start: "2026-12-24T00:00:00Z", window_end: "2026-12-26T00:00:00Z", demand_multiplier: 3.0 }
              as: CoopAdmin
              captures: { w_id: $.data.id }
          assert:
            - "3.5 -> 400 ERR_INVALID_REQUEST; 3.0 -> 201 with HolidayWindow.${w_id}.demand_multiplier == 3.0"

      - name: reciprocal_reference_linkage_on_mutual_accept
        claim_type: computed_fields
        grounds: [entities.MemberReference.fields.reciprocal_reference_id, state_machines.MemberReference.transitions.PENDING_to_ACCEPTED]
        distinguishing_aspect: "When the reverse reference is ACCEPTED, the system sets BOTH rows' reciprocal_reference_id to link the pair — ref(F1<-F2).reciprocal_reference_id == id of ref(F2<-F1) and vice versa."
        test_recipe:
          setup: ["Founders F1/F2/F3 VETTED via the mutual clique (all six references ACCEPTED)"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
          trigger:
            - call: "GET /coop/member-references/${ref_f1f2}"
              as: CoopAdmin
              captures: { link_fwd: $.data.reciprocal_reference_id }
            - call: "GET /coop/member-references/${ref_f2f1}"
              as: CoopAdmin
              captures: { link_rev: $.data.reciprocal_reference_id }
          assert:
            - "MemberReference.${ref_f1f2}.reciprocal_reference_id == ${ref_f2f1}"
            - "MemberReference.${ref_f2f1}.reciprocal_reference_id == ${ref_f1f2}"
            - "Both rows status == ACCEPTED with decided_at non-null"
  # ===========================================================================
  # Section: state_machines (Table 2 claims)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: claim_reject_then_reaccept_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SittingClaim.transitions.PENDING_to_REJECTED, state_machines.SittingClaim.transitions.PENDING_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: after the owner rejects a PENDING claim, a subsequent accept of the same claim fails 409 ERR_INVALID_STATE (repeat-trigger idempotency rejection); the request stays OPEN and its version is unchanged by the failed accept."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1; canonical request OPEN; F2's claim PENDING"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - call: "POST /coop/sitting-requests/${req_id}/claims/${claim_id}/reject"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
            - call: "GET /coop/sitting-requests/${req_id}"
              as: CoopAdmin
              captures: { req_v_now: $.data.version }
          trigger:
            - call: "POST /coop/sitting-requests/${req_id}/claims/${claim_id}/accept"
              payload: { expected_sitting_request_version: "${req_v_now}" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_INVALID_STATE (claim REJECTED is terminal)"
            - "SittingClaim.${claim_id}.decided_at non-null; SittingRequest.${req_id}.status == OPEN and no SittingAssignment exists for it"

      - name: withdraw_accepted_claim_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SittingClaim.transitions.PENDING_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdraw is declared only from PENDING; withdrawing an ACCEPTED claim (post-acceptance) fails 409 ERR_INVALID_STATE and leaves the assignment CONFIRMED."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1; canonical sit accepted (claim ACCEPTED, assignment CONFIRMED)"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
