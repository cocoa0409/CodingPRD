            - "e_sod_certify != \"ERR_EMPTY_MEASURE_DENOMINATOR\" and e_sod_certify != \"ERR_MEASURE_PERIOD_NOT_CLOSED\" — priority 10 outranks the whole priority-16 reporting family"
            - "HTTP 409 and e_denominator == \"ERR_EMPTY_MEASURE_DENOMINATOR\" from the clean identity (episiotomy_denominator == 0), which is the id §1.4 orders ahead of the still-open period per empty_measure_denominator_at_priority_16_outranks_the_still_open_reporting_period"
            - "snap_status_final == \"DRAFT\" and certified_at_final is null — neither refusal froze the row"
            - "LaborEncounter.${enc_id}.review_required == false after the case close — the review is CLOSED and no event remains open"
      - name: cross_unit_references_are_refused_on_bed_attachment_escalation_targets_and_or_room_mobilization
        claim_type: peer_roles
        grounds:
          - complexity_profile.role_model=segregation_of_duties
          - validations[priority=7]
          - errors[ERR_CROSS_UNIT_REFERENCE]
          - endpoints[POST /labor-encounters/{encounterId}/assign-bed]
          - endpoints[POST /fetal-monitoring-assessments/{assessmentId}/escalate]
          - endpoints[POST /emergency-cesareans/{eventId}/mobilize-team]
          - entities.Bed.unit_id
          - entities.StaffMember.unit_id
          - entities.LaborEncounter.unit_id
        distinguishing_aspect: |
          The scaffold has no tenant header and no unit-scoped role: every one of the six roles addresses
          every unit, so the ONLY thing keeping unit B's beds and staff out of unit A's encounters is the
          priority-7 referential rung. This instance drives the three applies_to arms that no other §1.8 or
          §1.9 instance reaches — the LDR bed on assign-bed, the notified_staff_id on fetal escalate, and
          the or_bed_id on mobilize-team — and each probe is deliberately built so that a DIFFERENT error
          would answer if priority 7 were missing or ordered late: the foreign LDR bed is AVAILABLE and of
          type LDR (so 8.07's ERR_BED_TYPE_NOT_ELIGIBLE cannot mask it), the foreign notified staff holds
          no shift at all (so 11.2's ERR_ESCALATION_TARGET_INELIGIBLE is the fallback), and the
          mobilize-team roster is three unit-A staff with NO ACTIVE shifts on a CATEGORY_1_CRASH event
          (so 8.08's ERR_SHIFT_NOT_ACTIVE and 11.4's team-composition id are both armed and must stay
          silent). Every probe is paired with the same call re-aimed at a same-unit row, which proves the
          refusal is about the unit edge and not about the endpoint being broken. Shared-read admission
          for all six roles is owned by
          corner:rbac / every_exclusive_operation_denies_the_other_five_roles_while_the_shared_reads_admit_all_six;
          what is new here is that identical privileges do NOT imply identical reach.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. TWO units created by the same PerinatalSafetyOfficer identity:
            unit A "Fallowmere Crossing Womens Hospital LDR" and unit B "Wickersham Fields Womens Hospital
            LDR" — the same actor owns both, so nothing about the acting identity distinguishes them.
            Unit A gets one LDR bed (LDR-01) and three staff: rn_charge_a (RN_LABOR_DELIVERY, fetal cert
            ADVANCED) on an ACTIVE CHARGE shift — which is what satisfies priority 12 for the assessment
            interpreter without any CareAssignment — plus anes_a (ANESTHESIOLOGIST) and neo_a
            (NEONATAL_RESUSCITATOR) who are deliberately left with NO shift rows at all. Unit B gets an
            LDR bed (LDR-01), an OR room (OR-01) and one staff member rn_b (RN_LABOR_DELIVERY, ADVANCED)
            with no shift either. One encounter lives on unit A (parity 1, 39 weeks) and is still in
            ANTEPARTUM with no bed. Unit B holds no encounter whatsoever, so its beds stay AVAILABLE and
            its staff stay unbooked for the whole run.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Fallowmere Crossing Womens Hospital LDR", licensed_ldr_beds: 8, licensed_or_rooms: 2 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_a: $.data.id }
            - call: POST /obstetric-units
              payload: { unit_name: "Wickersham Fields Womens Hospital LDR", licensed_ldr_beds: 6, licensed_or_rooms: 2 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_b: $.data.id }
            - call: POST /obstetric-units/${unit_a}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_a_ldr: $.data.id }
            - call: POST /obstetric-units/${unit_b}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_b_ldr: $.data.id }
            - call: POST /obstetric-units/${unit_b}/beds
              payload: { bed_label: "OR-01", bed_type: "OR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_b_or: $.data.id }
            - call: POST /obstetric-units/${unit_a}/staff-members
              payload: { full_name: "Marguerite Vanterpool RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_charge_a: $.data.id }
            - call: POST /obstetric-units/${unit_a}/staff-members
              payload: { full_name: "Teodoro Blankenbaker MD", staff_role: "ANESTHESIOLOGIST", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: true }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { anes_a: $.data.id }
            - call: POST /obstetric-units/${unit_a}/staff-members
              payload: { full_name: "Serafina Odenkirk NNP", staff_role: "NEONATAL_RESUSCITATOR", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { neo_a: $.data.id }
            - call: POST /obstetric-units/${unit_b}/staff-members
              payload: { full_name: "Cordelia Wrenfield RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_b: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_a}", staff_id: "${rn_charge_a}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_a_charge: $.data.id }
            - call: POST /shift-assignments/${shift_a_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_a}", patient_record_code: "PRC-FALL-7701", parity: 1, gestational_age_weeks: 39 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_a: $.data.id }
          trigger:
            - call: POST /labor-encounters/${enc_a}/assign-bed
              payload: { bed_id: "${bed_b_ldr}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_bed_cross: $.data.error_id }
            - call: GET /beds/${bed_b_ldr}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { bed_b_status: $.data.status }
            - call: POST /labor-encounters/${enc_a}/assign-bed
              payload: { bed_id: "${bed_a_ldr}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_bed: $.data.bed_id }
            - call: POST /fetal-monitoring-assessments
              payload: { encounter_id: "${enc_a}", interpreted_by_staff_id: "${rn_charge_a}", category: "CATEGORY_II", baseline_rate_bpm: 138, variability: "MINIMAL", recurrent_decelerations: true }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { assess_a: $.data.id, assess_due: $.data.escalation_due_at }
            - call: POST /fetal-monitoring-assessments/${assess_a}/escalate
              payload: { target_tier: 1, notified_staff_id: "${rn_b}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_esc_cross: $.data.error_id }
            - call: POST /fetal-monitoring-assessments/${assess_a}/escalate
              payload: { target_tier: 1, notified_staff_id: "${rn_charge_a}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { esc_status: $.data.escalation_status, esc_tier: $.data.escalation_tier_high_water }
            - call: POST /emergency-cesareans
              payload: { encounter_id: "${enc_a}", urgency_class: "CATEGORY_1_CRASH", triggering_assessment_id: "${assess_a}" }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { ev_a: $.data.id, ev_status: $.data.status }
            - call: POST /emergency-cesareans/${ev_a}/mobilize-team
              payload: { or_bed_id: "${bed_b_or}", staff_ids: ["${anes_a}", "${neo_a}", "${rn_charge_a}"] }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { e_mob_cross: $.data.error_id }
            - call: GET /emergency-cesareans/${ev_a}
              payload: {}
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { ev_status_after: $.data.status, ev_or_bed: $.data.or_bed_id }
            - call: GET /beds/${bed_b_or}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { bed_b_or_status: $.data.status }
          assert:
            - "HTTP 422 and e_bed_cross == \"ERR_CROSS_UNIT_REFERENCE\" — bed ${bed_b_ldr} exists and is an AVAILABLE LDR bed, so priority 4 and priority 8.07 both pass; only its unit_id disqualifies it"
            - "e_bed_cross != \"ERR_BED_NOT_FOUND\" and e_bed_cross != \"ERR_BED_TYPE_NOT_ELIGIBLE\" — a foreign bed must not be reported as missing or as the wrong type"
            - "bed_b_status == \"AVAILABLE\" — the refused call left unit B's inventory untouched, so no bed was flipped to OCCUPIED before the unit check ran"
            - "HTTP 200 and enc_bed == \"${bed_a_ldr}\" — the identical call with unit A's own LDR bed succeeds, proving the endpoint itself is healthy"
            - "assess_due == \"2026-08-01T06:20:00Z\" — assessed_at defaults to clock_now 06:00 plus ESCALATION_DUE_MINUTES[CATEGORY_II] = 20, so both escalate probes arrive inside the inclusive tier-1 window"
            - "HTTP 422 and e_esc_cross == \"ERR_CROSS_UNIT_REFERENCE\" — ${rn_b} exists (priority 4 passes) and belongs to unit B"
            - "e_esc_cross != \"ERR_ESCALATION_TARGET_INELIGIBLE\" — ${rn_b} ALSO holds no CHARGE-slot ACTIVE shift, so the priority-11.2 id is armed and must lose to priority 7"
            - "HTTP 200, esc_status == \"TIER_1_NOTIFIED\" and esc_tier == 1 — the same tier-1 call aimed at unit A's own CHARGE nurse is accepted"
            - "HTTP 201 and ev_status == \"DECISION_DECLARED\" — the crash event is declared on unit A's encounter"
            - "HTTP 422 and e_mob_cross == \"ERR_CROSS_UNIT_REFERENCE\" — OR-01 belongs to unit B; the or_bed_id arm of priority 7 is a different field on a different entity from the assign-bed arm"
            - "e_mob_cross != \"ERR_SHIFT_NOT_ACTIVE\" and e_mob_cross != \"ERR_CESAREAN_TEAM_INCOMPLETE\" and e_mob_cross != \"ERR_OR_BED_UNAVAILABLE\" — the roster [${anes_a}, ${neo_a}, ${rn_charge_a}] has no SURGICAL_TECH and two members with no shift at all, so 8.08 and 11.4 are both armed; priority 7 answers first"
            - "e_mob_cross != \"ERR_CESAREAN_READINESS_NOT_MET\" — CATEGORY_1_CRASH bypasses the readiness gate on this drill-less unit, so that id could never have answered here anyway"
            - "ev_status_after == \"DECISION_DECLARED\" and ev_or_bed is null — the refused mobilization wrote nothing: no OR bed, no mobilized_staff_ids, no transition"
            - "bed_b_or_status == \"AVAILABLE\" — unit B's OR room was never reserved by unit A's crash case"

      - name: shared_operation_admission_for_the_two_deliberately_zero_exclusive_roles
        claim_type: Shared Operation Access
        grounds:
          - roles[BedsideNurse].exclusive_operations
          - roles[AnesthesiaLead].exclusive_operations
          - roles[PatientAccessCoordinator]
          - endpoints[GET /obstetric-units/{unitId}]
          - endpoints[POST /shift-assignments]
        excluded_because:
          difficulty_instance: corner:rbac / every_exclusive_operation_denies_the_other_five_roles_while_the_shared_reads_admit_all_six
          rationale: |
            BedsideNurse and AnesthesiaLead carry deliberately EMPTY exclusive_operations lists, so their
            positive claim is entirely about shared operations — and the matrix instance already exercises
            exactly that: it reads GET /obstetric-units/{unitId} as BedsideNurse and as
            PatientAccessCoordinator (200 for both) and creates a ShiftAssignment as AnesthesiaLead (201),
            which is the only write AnesthesiaLead shares. A separate instance would re-issue the same
            three calls with the same expected outcomes, so the positive half of Table 7's first bullet
            stays where the negative half is, keeping the admit/deny pairing inside one recipe.

      - name: header_and_permission_gating_ahead_of_existence_checks_is_asserted_in_the_validation_ladder
        claim_type: Exclusive Operation Denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
          - errors[ERR_UNKNOWN_ROLE]
        excluded_because:
          difficulty_instance: corner:validations / insufficient_permissions_at_priority_2_outranks_a_nonexistent_bed_id_at_priority_3
          rationale: |
            The ordering claims around authorization — a missing or unparseable X-User-Role answering 400
            ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER at priority 1, an unrecognised role string answering
            ERR_UNKNOWN_ROLE before the permission test, and a 403 outranking a nonexistent path id at
            priority 3 — are ladder claims, not role claims, and both are already pinned by the two
            validations instances cited above (see also
            corner:validations / unknown_x_user_role_is_rejected_at_priority_1_before_the_permission_check_at_priority_2).
            The rbac section deliberately asserts only the WHO of each denial and leaves the WHEN to the
            priority ladder, so the same 403 is not re-litigated in two sections.

  # ===========================================================================
  # SECTION 8 — cross-cutting complexity layers.
  # complexity_profile.complexity_layers declares exactly four layers:
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation
  # and rate_threshold_triggers. The claim_type values below are the layer
  # names verbatim, as the claim-extraction guide's Table 8 keys them. Per that
  # table, optimistic_concurrency owes one stale-version test per §1.2.1
  # concurrency_rules entry (there are four rules over four write endpoints),
  # cascading_side_effects owes an N-level chain plus ordering sensitivity plus
  # partial-failure handling, dual_variant_calculation owes both variants and
  # the delta, and rate_threshold_triggers owes a cumulative boundary, an
  # instantaneous boundary and a reset.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_unit_version_is_refused_on_both_declared_unit_scoped_writes_while_the_refreshed_version_passes
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers=optimistic_concurrency
          - concurrency_rules[induction-hold-stale-unit]
          - concurrency_rules[snapshot-create-stale-unit]
          - validations[priority=6]
          - errors[ERR_STALE_UNIT_VERSION]
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - endpoints[POST /obstetric-units/{unitId}/quality-measure-snapshots]
          - endpoints[PATCH /obstetric-units/{unitId}]
          - entities.ObstetricUnit.version
        distinguishing_aspect: |
          ObstetricUnit is the only entity in §1.2.1 that is the OCC parent of TWO different write
          endpoints, and they are as unrelated as two endpoints can be: a PatientAccessCoordinator freezing
          a bed-minute projection, and a PerinatalSafetyOfficer minting a reporting snapshot. Both declare
          expected_unit_version, so one shared counter serialises them, and this instance proves that by
          walking a single unit through four consecutive version values: read v0, bump it with the one
          endpoint whose declared purpose is "increments unit.version (so a stale expected_unit_version is
          observable)", refuse the hold at v0, accept the hold at v1 — which itself bumps to v2 — then
          refuse the snapshot at the NOW-stale v1 and accept it at v2. The refusal-then-acceptance pairing
          on each endpoint is what makes the 412 attributable to staleness rather than to the payload, and
          the second refusal is the sharper of the two because v1 was a perfectly valid version one call
          earlier: an implementation that compares against "some version this client has seen" instead of
          "the current version" passes the first probe and fails the second. Both probes are also proved
          write-free (the booking stays REQUESTED with a null projection; the snapshot list stays empty),
          which rules out the read-modify-write-then-check ordering.
        test_recipe:
          setup: |
            Clock starts at 2026-08-01T05:45:00Z. One unit "Thornapple Landing Womens Hospital LDR" with
            two LDR beds (LDR-01, LDR-02) and no encounters at all. Because a hold is gated at priority
            8.02 on staffing_posture IN {OPEN, RATIO_STRAINED} and the posture derivation freezes
            inductions while cesarean_readiness_state == NOT_READY, the unit must first be lifted off
            NOT_READY: two staff members are created and a DECISION_TO_INCISION drill is scheduled for
            05:50, started at 05:50, documented at 06:00 with a passing 3-minute simulated interval and
            validated by the PerinatalSafetyOfficer (whose X-User-ID differs from the documenter, clearing
            SOD-2). With a current VALIDATED drill but no ACTIVE OR_STANDBY shift the readiness state is
            DEGRADED, which the posture derivation does NOT freeze, so with a coverage deficit of 0.0 and
            two AVAILABLE LDR beds the posture is OPEN and turnover_buffer_minutes is 45 for the rest of
            the run. The clock is then set to 06:00 and one REQUESTED InductionBooking is filed for
            2026-08-02T08:00:00Z, indication POST_DATES_41W (priority_class MEDICALLY_INDICATED) with
            expected_labor_minutes 720, so a successful hold must freeze projected_occupancy_minutes at
            720 + 45 = 765 against a day budget of 2400. Every other rung above priority 6 on both
            endpoints is deliberately left unarmed so that the only thing being measured is the version
            comparison.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T05:45:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Thornapple Landing Womens Hospital LDR", licensed_ldr_beds: 6, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Isolde Vantongeren MD", staff_role: "ANESTHESIOLOGIST", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: true }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { anes_staff: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Cormac Halvorsen MD", staff_role: "OB_ATTENDING", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { ob_staff: $.data.id }
            - call: POST /obstetric-units/${unit_id}/cesarean-readiness-drills
              payload: { drill_type: "DECISION_TO_INCISION", scheduled_for_utc: "2026-08-01T05:50:00Z", participant_staff_ids: ["${anes_staff}", "${ob_staff}"] }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { drill_id: $.data.id }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T05:50:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /cesarean-readiness-drills/${drill_id}/start
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /cesarean-readiness-drills/${drill_id}/document
              payload: { decision_at: "2026-08-01T05:52:00Z", incision_at: "2026-08-01T05:55:00Z", documented_by_staff_id: "${anes_staff}" }
              as: AnesthesiaLead
              as_user_id: "anesthesia-lead-01"
            - call: POST /cesarean-readiness-drills/${drill_id}/validate
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-THRN-2101", gestational_age_weeks: 41, indication_code: "POST_DATES_41W", requested_start_utc: "2026-08-02T08:00:00Z", expected_labor_minutes: 720 }
              as: PatientAccessCoordinator
              as_user_id: "access-coord-01"
              captures: { booking_id: $.data.id }
          trigger:
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coord-01"
              captures: { v_stale: $.data.version }
            - call: PATCH /obstetric-units/${unit_id}
              payload: { max_daily_induction_bed_minutes: 2400 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { v_fresh: $.data.version }
            - call: POST /induction-bookings/${booking_id}/hold-capacity
              payload: { bed_id: "${bed_ldr1}", expected_unit_version: "${v_stale}" }
              as: PatientAccessCoordinator
              as_user_id: "access-coord-01"
              captures: { e_stale_hold: $.data.error_id }
            - call: GET /induction-bookings/${booking_id}
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coord-01"
              captures: { bk_status_after_refusal: $.data.status, bk_proj_after_refusal: $.data.projected_occupancy_minutes }
            - call: POST /induction-bookings/${booking_id}/hold-capacity
              payload: { bed_id: "${bed_ldr1}", expected_unit_version: "${v_fresh}" }
              as: PatientAccessCoordinator
              as_user_id: "access-coord-01"
              captures: { bk_status_held: $.data.status, bk_proj_held: $.data.projected_occupancy_minutes, bk_hold_expires: $.data.hold_expires_at }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { v_after_hold: $.data.version }
            - call: POST /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: { period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-07-02T00:00:00Z", expected_unit_version: "${v_fresh}" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { e_stale_snap: $.data.error_id }
            - call: GET /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: { period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-07-02T00:00:00Z", expected_unit_version: "${v_after_hold}" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { snap_status: $.data.status, snap_ntsv_den: $.data.ntsv_cesarean_denominator, snap_ntsv_rate: $.data.ntsv_cesarean_rate_pct }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { v_final: $.data.version }
          assert:
            - "v_fresh == v_stale + 1 — one unit write advances the counter by exactly one, which is the premise every OCC claim below rests on"
            - "HTTP 412 and e_stale_hold == \"ERR_STALE_UNIT_VERSION\" — the §1.2.1 rule induction-hold-stale-unit fires at priority 6 on its declared write_endpoint and occ_field"
            - "bk_status_after_refusal == \"REQUESTED\" and bk_proj_after_refusal is null — the refused hold neither moved the booking nor froze a projection, so the version check ran before any mutation"
            - "HTTP 200, bk_status_held == \"CAPACITY_HELD\", bk_proj_held == 765 (expected_labor_minutes 720 + the OPEN-posture turnover_buffer_minutes 45 frozen at hold time) and bk_hold_expires == \"2026-08-01T08:00:00Z\" (clock_now + HOLD_TTL_MINUTES 120)"
            - "v_after_hold == v_fresh + 1 — the accepted hold is itself a unit write, so the version the client just used successfully is already stale"
            - "HTTP 412 and e_stale_snap == \"ERR_STALE_UNIT_VERSION\" — the second declared rule snapshot-create-stale-unit rejects v_fresh, a value that was CURRENT one call earlier; the same error_id is shared by both rules because both name the same parent entity"
            - "e_stale_snap != \"ERR_MEASURE_PERIOD_NOT_CLOSED\" and e_stale_snap != \"ERR_INVALID_MEASURE_WINDOW\" — priority 6 precedes the priority-14.2 window rung on this endpoint"
            - "the GET /obstetric-units/${unit_id}/quality-measure-snapshots list answers 200 with meta.total_count == 0 — the refused snapshot left no DRAFT row behind"
            - "HTTP 201, snap_status == \"DRAFT\", snap_ntsv_den == 0 and snap_ntsv_rate is null — the same window and the same payload succeed once the version is refreshed, so the 412 was about staleness alone"
            - "v_final == v_after_hold + 1 — snapshot creation increments unit.version too, so every write on both endpoints participates in the same counter"

      - name: the_encounter_and_activation_scoped_occ_rules_are_asserted_inside_the_priority_ladder
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[care-assignment-create-stale-encounter]
          - concurrency_rules[bundle-rescind-stale-activation]
          - errors[ERR_STALE_ENCOUNTER_VERSION]
          - errors[ERR_STALE_ACTIVATION_VERSION]
          - validations[priority=6]
        excluded_because:
          difficulty_instance: corner:validations / stale_encounter_version_at_priority_6_outranks_the_cross_unit_shift_reference_at_priority_7
          rationale: |
            The other two §1.2.1 rules are already driven end-to-end by the validations section, which is
            where their sharper claim lives: the stale-version refusal must OUTRANK a lower rung on the same
            call. stale_encounter_version_at_priority_6_outranks_the_cross_unit_shift_reference_at_priority_7
            drives POST /care-assignments with expected_encounter_version while a priority-7 violation is
            also armed, and
            corner:validations / stale_activation_version_at_priority_6_outranks_the_missing_rescind_reason_at_priority_9
            does the same for the rescind endpoint's expected_activation_version against a priority-9
            omission. Both include the refreshed-version success, so re-driving them here would add a third
            and fourth copy of the same 412 with a weaker premise. What was NOT covered there is the unit
            counter shared by two endpoints, which is why only that rule got a fresh instance above.

      - name: magnesium_step_completion_cascades_five_levels_from_one_checklist_item_to_a_frozen_induction_projection
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers=cascading_side_effects
          - state_machines.SafetyBundleActivation[ACTIVATED->STAGE_1_IN_PROGRESS]
          - calculations.bundle_checklist_template
          - calculations.encounter_required_coverage_units
          - calculations.care_assignment_unit_debit
          - calculations.unit_posture_derivation
          - calculations.induction_capacity_projection
          - validations[priority=8.02]
          - validations[priority=8.05]
          - endpoints[POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete]
          - endpoints[GET /obstetric-units/{unitId}/coverage-report]
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
        distinguishing_aspect: |
          §1.2 spells this chain out as the scaffold's canonical CASCADE and it is the only one that starts
          from a single nested child row: completing ONE BundleChecklistItem whose step_code is
          MAGNESIUM_LOADED sets encounter.magnesium_infusion_active, which the coverage calculation reads as
          a TIER_IV trigger AND as an independent one-to-one trigger, which re-prices the covering
          CareAssignment in place, which leaves the encounter's assigned units below its required units, which
          raises unit.coverage_deficit_units, which re-derives staffing_posture, which re-derives
          turnover_buffer_minutes, which is FROZEN into the projected_occupancy_minutes of a completely
          unrelated InductionBooking held afterwards. Five entities and two aggregates deep from one nested
          POST, with a numeric fingerprint at every level (0.5 -> 2.0 debit; 0.0 -> 2.0 deficit;
          45 -> 75 buffer; 765 -> 795 projection), which is what makes the chain falsifiable rather than
          merely plausible. The recipe also pins the two properties Table 8 asks for beyond the chain
          itself: ORDERING — MAGNESIUM_LOADED is completed OUT OF SEQUENCE, as the first completion on the
          activation, so it both fires the ACTIVATED -> STAGE_1_IN_PROGRESS transition and carries the
          magnesium flip in one call (TIER_III floor and TIER_IV magnesium clause resolve to TIER_IV by the
          max rule), and when its predecessor ANTIHYPERTENSIVE_GIVEN lands afterwards the advisory
          due_at_sequence_anchored of the ALREADY-COMPLETED magnesium row must be rewritten to
          predecessor_completed_at + 60 while nothing in the cascade re-fires — the debit, the deficit and
          the posture must all hold still, which is the ordering-sensitivity claim in its sharpest form
          (a chain that re-applies its side effects on the second completion would double the debit);
          and PARTIAL FAILURE — a stage-2 item completed first is refused at priority 8.05 and provably
          writes nothing anywhere in the chain, so no level of the cascade can run on a rejected call.
        test_recipe:
          setup: |
            Clock starts at 2026-08-01T05:45:00Z. One unit "Ravensworth Glen Womens Hospital LDR" with three
            LDR beds (LDR-01..LDR-03). Because the last level of the cascade is measured on an induction
            hold, and holds are frozen while cesarean_readiness_state == NOT_READY, the unit is first lifted
            off NOT_READY exactly as the concurrency instance above does it: a DECISION_TO_INCISION drill
            with participants anes (ANESTHESIOLOGIST) and ob (OB_ATTENDING) is scheduled for 05:50, started
            at 05:50, documented at 06:00 with a passing 3-minute interval by anes and validated by the
            officer, leaving readiness DEGRADED (no ACTIVE OR_STANDBY shift) — the branch the posture
            derivation does not freeze. One bedside nurse, rn_bed (RN_LABOR_DELIVERY, ADVANCED), holds an
            ACTIVE BEDSIDE shift 05:00-15:00 whose capacity_units_effective snapshots at
            min(BASE_CAPACITY_UNITS[BEDSIDE] 4.0, CERT_CAP_UNITS[ADVANCED] 4.0) - 0 admin - 0 focus = 4.0.
            TWO encounters share that one shift through RATIO_SHARED CareAssignments: enc_x (parity 1,
            39 weeks, singleton vertex, no prior cesarean) is TIER_I in ANTEPARTUM and therefore prices at
            1.0 * 0.5 = 0.5, and enc_sib (parity 0, 39 weeks, prior_cesarean true) is TIER_II in ANTEPARTUM
            and prices at round_half_up(1.5 * 0.5, 1) = 0.8; the shift's assigned_acuity_load_units starts
            at 1.3 with a deficit of 0.0, so the unit begins at posture OPEN with turnover_buffer_minutes 45.
            A SEVERE_HYPERTENSION bundle is activated on enc_x from a severe-range reading (168/112), which
            mints the four-item template — ANTIHYPERTENSIVE_GIVEN (seq 1, gate 1), MAGNESIUM_LOADED (seq 2,
            gate 1), REPEAT_BP (seq 3, gate 2), OB_AT_BEDSIDE (seq 4, gate 2) — and leaves the activation in
            ACTIVATED, a status the coverage calculation deliberately does NOT read, so enc_x is still
            TIER_I at 0.5. Two InductionBookings for 2026-08-02 wait in REQUESTED on the sidelines: bk_pr
            (38 weeks, ELECTIVE_NO_INDICATION) whose priority_class computes to PATIENT_REQUEST, and bk_mi
            (41 weeks, POST_DATES_41W) whose priority_class computes to MEDICALLY_INDICATED, both with
            expected_labor_minutes 720. They are the downstream witnesses: at posture OPEN both could hold,
            and after the cascade only one of them can.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T05:45:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Ravensworth Glen Womens Hospital LDR", licensed_ldr_beds: 6, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-03", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed3: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Perpetua Lindqvist RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_bed: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Ignatius Solberg MD", staff_role: "ANESTHESIOLOGIST", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: true }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { anes_staff: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Wilhelmina Trescothick MD", staff_role: "OB_ATTENDING", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { ob_staff: $.data.id }
            - call: POST /obstetric-units/${unit_id}/cesarean-readiness-drills
              payload: { drill_type: "DECISION_TO_INCISION", scheduled_for_utc: "2026-08-01T05:50:00Z", participant_staff_ids: ["${anes_staff}", "${ob_staff}"] }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
