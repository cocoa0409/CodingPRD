  - rule_id: compensating_invariant
    instances:
      - name: draw_reversal_restores_reserve_money_exactly
        grounds:
          - calculations.service_reserve_conservation
          - calculations.service_reserve_balance
          - entities.ServiceAgreement.fields.reserve_available_cents
          - entities.ServiceAgreement.fields.reserve_committed_accrual_cents
          - entities.ConsumableDraw.fields.reverses_draw_id
        distinguishing_aspect: |
          Conserved quantity: reserve MONEY in cents, pinned as invariant A
          `reserve_committed_accrual_cents + reserve_available_cents == reserve_funded_cents`. A draw
          of 3 units at catalog 500000 commits 1830000 and leaves 10370000 available; its reversal
          returns both figures to 0 and 12200000 exactly, with settlement_variance_cents back to 0 and
          no rounding residue from the 1533600-cent settled line.
