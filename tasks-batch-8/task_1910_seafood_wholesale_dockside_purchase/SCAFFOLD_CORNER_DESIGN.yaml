  - section: validations
    instances:
      - name: val_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected before any role, existence, or business check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vessels/00000000-0000-0000-0000-000000000000", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — auth (priority 1) precedes not-found (priority 4)"

      - name: val_wrong_role_returns_403
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "GradingInspector calling a DockBuyer/VesselAgent endpoint is rejected with 403 before body validation."
        test_recipe:
          setup: ["Vessel and catch area exist"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
          trigger:
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: GradingInspector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403); no ticket created"

      - name: val_vessel_agent_cannot_land_others_ticket
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_OWNERSHIP_MISMATCH]"
          - "roles[VesselAgent]"
        distinguishing_aspect: "Entity-backed ownership: a VesselAgent whose X-User-ID is vessel A cannot land vessel B's ticket; DockBuyer (opaque) can land any."
        test_recipe:
          setup: ["Vessels A and B; ticket for vessel B in DRAFT"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-A", home_port: "Gloucester" }, as: OperationsManager, captures: { va_id: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "FV Borealis", registration_number: "REG-B", home_port: "New Bedford" }, as: OperationsManager, captures: { vb_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${vb_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: VesselAgent, as_user_id: "${va_id}", captures: { err: $.data.error_id } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: VesselAgent, as_user_id: "${vb_id}", captures: { ok_status: $.data.status } }
          assert:
            - "Vessel A's agent: error_id == ERR_OWNERSHIP_MISMATCH (403), ticket stays DRAFT"
            - "Vessel B's agent (owner): succeeds, status == LANDED"

      - name: val_sod_quote_creator_cannot_self_approve_volatility
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]"
          - "state_machines.MarketQuote"
        distinguishing_aspect: "Segregation of duties: the OperationsManager user who created a volatile quote (15.00% move) cannot approve it; a different user must."
        test_recipe:
          setup: ["Species COD; PUBLISHED GRADE_A quote 1000 (08-01); DRAFT quote 1150 (08-02) created by om_1"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1000 }, as: OperationsManager, captures: { q1_id: $.data.id } }
            - { call: "POST /market-quotes/${q1_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager, as_user_id: "om_0" }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_v2: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-02", price_per_kg_cents: 1150 }, as: OperationsManager, as_user_id: "om_1", captures: { q2_id: $.data.id } }
            - { call: "POST /market-quotes/${q2_id}/publish", payload: { expected_species_version: "${sp_v2}" }, as: OperationsManager, as_user_id: "om_1", captures: { q2_status: $.data.status } }
          trigger:
            - { call: "POST /market-quotes/${q2_id}/approve-volatility", payload: {}, as: OperationsManager, as_user_id: "om_1", captures: { err: $.data.error_id } }
            - { call: "POST /market-quotes/${q2_id}/approve-volatility", payload: {}, as: OperationsManager, as_user_id: "om_2", captures: { ok_status: $.data.status } }
          assert:
            - "q2_status == PENDING_APPROVAL after publish (15.00% >= 10.00%)"
            - "Approve by creator om_1: error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (403), status unchanged"
            - "Approve by om_2: status == PUBLISHED and MarketQuote.${q1_id} becomes SUPERSEDED"

      - name: val_yield_outside_range_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_YIELD]"
          - "entities.GradeAssessment.fields.yield_pct"
        distinguishing_aspect: "yield_pct must satisfy 0 < y <= 1: 0 and 1.01 both fail; exactly 1.00 is accepted."
        test_recipe:
          setup: ["Ticket LANDED with two lines"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
