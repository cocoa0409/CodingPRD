            - "hop 2: Order.${ord_h1_id}.fulfillment_status == ZONE_CLEARED and Order.${ord_h2_id}.fulfillment_status == ZONE_CLEARED"
            - "hop 2: Order.${ord_h1_id}.zone_hold_minutes == 8 and Order.${ord_h2_id}.zone_hold_minutes == 6 (distinct per-order accruals from one grant)"
            - "hop 3: Store.${store_id}.unassigned_order_count == 2"
            - "ServiceAddress.${addr_h_id}.drive_time_estimate_minutes == 41 and grid_miles == 11.34, unchanged by the override"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: dispatch_state_error_outranks_cash_limit_error_on_depart
        grounds:
          - validations.priority_12
          - validations.priority_38
          - errors.ERR_INVALID_DISPATCH_STATE
          - errors.ERR_CASH_LIMIT_REACHED
          - state_machines.Dispatch.RETURNED
          - entities.Driver.fields.cash_posture
        distinguishing_aspect: |
          Departing an already RETURNED dispatch whose driver is sitting exactly
          at the store cash limit violates BOTH priority 12 (state, 409
          ERR_INVALID_DISPATCH_STATE) and priority 38 (business_fiscal, 402
          ERR_CASH_LIMIT_REACHED). The §1.4 ladder is the single authority, so the
          409 must win and the 402 must not be reported. The two candidate
          responses differ in HTTP status as well as error_id, so an
          implementation that checks money before state is unambiguously caught.
        test_recipe:
          setup:
            - "A store whose cash_limit_cents is exactly 2900."
            - "One QUALIFIED insured CAR driver and a CAR cost model."
            - "A CASH order totalling 2900, delivered on a one-stop dispatch which has already RETURNED, so the driver's cash_on_hand_cents is 2900 and cash_posture is DROP_REQUIRED."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, promise_minutes: 30, delivery_fee_cents: 399, cash_limit_cents: 2900, hot_bag_count: 4, max_stacked_stops: 3, handoff_minutes_per_stop: 6, dispatch_reset_buffer_minutes: 10, service_posture: "OPEN" }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Oak St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a_id: $.data.id }
            - call: "POST /store-ops/vehicle-cost-models"
              payload: { store_id: "${store_id}", vehicle_class: "CAR", per_delivery_cents: 150, tier1_cap_miles: 5.00, tier1_per_mile_cents: 62, tier2_per_mile_cents: 41, min_reimbursement_per_stop_cents: 100, effective_from: "2026-07-01T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { cm_car_id: $.data.id }
            - call: "POST /store-ops/drivers"
