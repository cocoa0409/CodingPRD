# =============================================================================
# Task 1804 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: ["entities.Customer.fields.status", "entities.Customer.fields.ytd_spend_cents", "entities.Customer.fields.opening_ytd_spend_cents"]
        distinguishing_aspect: "Omitting opening_ytd_spend_cents defaults it to 0 and ytd_spend_cents computes to 0; status defaults to ACTIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
          trigger:
            - { call: "POST /fluid-power/customers", payload: { full_name: "Defaults Co", email: "d@d.com", credit_limit_cents: 500000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id", ytd: "$.data.ytd_spend_cents", st: "$.data.status" } }
          assert:
            - "Customer.${cust_id}.ytd_spend_cents == 0 and status == ACTIVE"
            - "response includes server-minted id (UUID without type prefix), created_at, updated_at, version == 1"

      - name: cylinder_create_with_out_of_range_seal_kit_rejected
        claim_type: type_constraints
        grounds: ["entities.Cylinder.fields.seal_kit_id", "errors[ERR_SEAL_KIT_INCOMPATIBLE]", "validations[priority=9]"]
        distinguishing_aspect: "Cylinder bore 80mm with a kit rated for 120-200mm bores violates kit compatibility at creation (safety, 422) — cross-entity validation between Cylinder and SealKit."
        test_recipe:
          setup: ["shop; wide kit (120-200mm); customer"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-120-PU", bore_min_mm: 120, bore_max_mm: 200, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "PHOSPHATE_ESTER", "WATER_GLYCOL"], price_cents: 32000, material: "PU" }, as: ShopAdmin, captures: { wide_kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
          trigger:
            - call: "POST /fluid-power/cylinders"
              payload: { customer_id: "${cust_id}", serial_number: "CYL-X01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${wide_kit_id}" }
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "rejected with ERR_SEAL_KIT_INCOMPATIBLE (422): bore 80 outside kit range [120, 200]"
            - "no cylinder is persisted (GET /fluid-power/cylinders?customer_id=${cust_id} total_count == 0)"

      - name: cylinder_create_with_fluid_incompatible_kit_rejected
        claim_type: type_constraints
        grounds: ["entities.SealKit.fields.fluid_compat", "errors[ERR_SEAL_KIT_INCOMPATIBLE]"]
        distinguishing_aspect: "PHOSPHATE_ESTER fluid with an NBR kit listing only [MINERAL_OIL, WATER_GLYCOL] fails fluid compatibility — same error id, disjoint trigger dimension (fluid, not bore)."
        test_recipe:
          setup: ["shop; NBR kit fluids [MINERAL_OIL, WATER_GLYCOL]; customer"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
          trigger:
            - call: "POST /fluid-power/cylinders"
              payload: { customer_id: "${cust_id}", serial_number: "CYL-X02", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "PHOSPHATE_ESTER", seal_kit_id: "${kit_id}" }
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "rejected with ERR_SEAL_KIT_INCOMPATIBLE (422): PHOSPHATE_ESTER not in kit fluid_compat"

      - name: inventory_item_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404), not a null body."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
          trigger:
            - call: "GET /fluid-power/inventory-items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "returns ERR_NOT_FOUND with http 404"

      - name: work_order_create_computed_input_ignored
        claim_type: computed_fields
        grounds: ["entities.WorkOrder.fields.status", "entities.WorkOrder.fields.cleanliness_passed"]
        distinguishing_aspect: "Client-supplied values for system/computed fields (status, cleanliness_passed, final_total_cents) are ignored on creation: the new work order starts INTAKE with cleanliness_passed false regardless."
        test_recipe:
          setup: ["shop; kit; customer; cylinder"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-X03", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
          trigger:
            - call: "POST /fluid-power/work-orders"
              payload: { cylinder_id: "${cyl_id}", tier: "STANDARD", promised_hours: 96, complaint: "slow leak", status: "CERTIFIED", cleanliness_passed: true, final_total_cents: 1 }
              as: ServiceAdvisor
              captures: { wo_status: "$.data.status", wo_clean: "$.data.cleanliness_passed", wo_final: "$.data.final_total_cents" }
          assert:
            - "WorkOrder created with status == INTAKE (not client-supplied CERTIFIED)"
            - "cleanliness_passed == false and final_total_cents == null (client values ignored)"

      - name: quote_creation_stamps_pin_and_tier_snapshot
        claim_type: computed_fields
        grounds: ["entities.Quote.fields.pinned_teardown_version", "entities.Quote.fields.tier_snapshot", "entities.Quote.fields.teardown_report_id"]
        distinguishing_aspect: "Quote creation system-stamps teardown_report_id, pinned_teardown_version (== current report version 1) and tier_snapshot (== work order tier EMERGENCY) — none are client inputs."
        test_recipe:
          setup: ["WO in QUOTE_DRAFT with teardown report v1; tier EMERGENCY promised 12h"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-X04", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EMERGENCY", promised_hours: 12, complaint: "down machine" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: false, tube_needed: false, honing_passes: 0, estimated_labor_hours: 2.0 }, as: Technician, as_user_id: "${tech1_id}", captures: { report_id: "$.data.id" } }
          trigger:
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id", pin: "$.data.pinned_teardown_version", snap: "$.data.tier_snapshot", tr: "$.data.teardown_report_id", prov: "$.data.provisional_total_cents" } }
          assert:
            - "Quote.${quote_id}.pinned_teardown_version == 1 and teardown_report_id == ${report_id}"
            - "tier_snapshot == EMERGENCY (snapshot survives later WO changes)"
            - "provisional_total_cents == 71280  # labor_raw=2.0*14500*1.75=50750.0 exact; supplies_raw=2030.0 exact; 18500+50750+2030"

      - name: exchange_unit_created_in_pool
        claim_type: initial_state
        grounds: ["entities.ExchangeUnit.fields.status"]
        distinguishing_aspect: "A newly created exchange unit starts IN_POOL with null work_order_id and null credit fields."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
          trigger:
            - { call: "POST /fluid-power/exchange-units", payload: { bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", unit_price_cents: 250000 }, as: ShopAdmin, captures: { unit_id: "$.data.id", st: "$.data.status" } }
          assert:
            - "ExchangeUnit.${unit_id}.status == IN_POOL, work_order_id == null, provisional_credit_cents == null"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: complete_scrap_without_authorization_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.WorkOrder.SCRAP_AUTHORIZED_to_SCRAPPED", "errors[ERR_SCRAP_NOT_AUTHORIZED]"]
        distinguishing_aspect: "complete-scrap from QUOTE_SENT (skipping authorize-scrap) fails with ERR_SCRAP_NOT_AUTHORIZED; the work order stays QUOTE_SENT."
        test_recipe:
          setup: ["WO in QUOTE_SENT"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-S01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: false, tube_needed: false, honing_passes: 0, estimated_labor_hours: 1.0 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
          trigger:
            - call: "POST /fluid-power/work-orders/${wo_id}/complete-scrap"
              payload: { disposal_method: "certified recycler" }
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "rejected with ERR_SCRAP_NOT_AUTHORIZED (409); WorkOrder.${wo_id}.status remains QUOTE_SENT"

      - name: start_repair_before_approval_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.WorkOrder.APPROVED_to_IN_REPAIR", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start-repair while the work order is QUOTE_SENT (quote not yet approved) is an invalid transition: ERR_INVALID_STATE, no status change."
        test_recipe:
          setup: ["WO in QUOTE_SENT"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-S02", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: false, tube_needed: false, honing_passes: 0, estimated_labor_hours: 1.0 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
          trigger:
            - call: "POST /fluid-power/work-orders/${wo_id}/start-repair"
              payload: {}
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "rejected with ERR_INVALID_STATE (409); WorkOrder.${wo_id}.status remains QUOTE_SENT"

      - name: scrap_path_cascades_and_terminal_lockdown
        claim_type: side_effect_execution
        grounds: ["state_machines.WorkOrder.QUOTE_SENT_to_SCRAP_AUTHORIZED", "state_machines.WorkOrder.SCRAP_AUTHORIZED_to_SCRAPPED", "state_machines.Quote.SENT_to_REJECTED_SCRAP", "state_machines.Cylinder.ACTIVE_to_RETIRED", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "authorize-scrap cascades the SENT quote to REJECTED_SCRAP; complete-scrap retires the cylinder; once SCRAPPED the work order is terminally locked (cancel -> ERR_ALREADY_TERMINAL)."
        test_recipe:
          setup: ["WO in QUOTE_SENT"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-S03", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "cracked barrel" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: false, tube_needed: true, tube_cut_length_mm: 600, honing_passes: 0, estimated_labor_hours: 3.0 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
          trigger:
            - { call: "POST /fluid-power/work-orders/${wo_id}/authorize-scrap", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /fluid-power/quotes/${quote_id}", payload: {}, as: ServiceAdvisor, captures: { q_status: "$.data.status" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/complete-scrap", payload: { disposal_method: "certified recycler" }, as: ServiceAdvisor, captures: { wo_status: "$.data.status" } }
            - { call: "GET /fluid-power/cylinders/${cyl_id}", payload: {}, as: ServiceAdvisor, captures: { cyl_status: "$.data.status" } }
            - call: "POST /fluid-power/work-orders/${wo_id}/cancel"
              payload: {}
              as: ShopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "after authorize-scrap: Quote.${quote_id}.status == REJECTED_SCRAP"
            - "after complete-scrap: WorkOrder.${wo_id}.status == SCRAPPED and Cylinder.${cyl_id}.status == RETIRED"
            - "cancel on SCRAPPED work order rejected with ERR_ALREADY_TERMINAL (409)"

      - name: work_order_cancel_supersedes_sent_quote
        claim_type: side_effect_execution
        grounds: ["state_machines.WorkOrder.QUOTE_SENT_to_CANCELLED", "state_machines.Quote.SENT_to_SUPERSEDED"]
        distinguishing_aspect: "Cancelling a QUOTE_SENT work order cascades the SENT quote to SUPERSEDED (terminal); a later approve attempt on it fails ERR_QUOTE_NOT_APPROVABLE."
        test_recipe:
          setup: ["WO in QUOTE_SENT"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-S04", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
