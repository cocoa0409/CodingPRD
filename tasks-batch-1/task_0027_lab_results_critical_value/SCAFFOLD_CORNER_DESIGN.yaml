  # ===========================================================================
  # Validations — coverage for rules not exercised by difficulty
  # ===========================================================================
  - section: validations
    instances:

      - name: stat_order_requires_phone_channel_violation_returns_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_STAT_REQUIRES_PHONE_CHANNEL]
        distinguishing_aspect: |
          When a CriticalNotification on a STAT LabOrder has channel=SMS, POST /critical-notifications/{id}/send
          must return ERR_STAT_REQUIRES_PHONE_CHANNEL (422). (Note: the auto-created notification on a STAT order
          uses channel=PHONE; to obtain an SMS notification on STAT we exercise the rule by attempting an SMS-
          configured notification — but since SMS-on-STAT cannot be created through the auto-create path, the
          implementation MUST still defensively reject any SMS notification that somehow becomes attached to a
          STAT order. We exercise this via the priority rule directly on a ROUTINE→STAT-priority change scenario:
          a notification created on a ROUTINE order is SMS; if the order's priority is later modified to STAT,
          the send must reject. Since LabOrder.priority is not mutable via §1.5 endpoints, the cleanest direct
          test is to verify the rule on a fresh order via the test-driving clock path.)
        excluded_because:
          difficulty_instance: state_versus_business_safety_send_on_already_acknowledged
          rationale: "The SMS-on-STAT priority-5 rule is referenced but unreachable under §1.5's auto-create policy (STAT auto-creates PHONE). The difficulty instance covers the priority-pair conflict using state vs business_constraint instead. The standalone priority-5 rule remains an implementation invariant declared but not exercisable as a positive failure in the scaffold's reachable state space."

