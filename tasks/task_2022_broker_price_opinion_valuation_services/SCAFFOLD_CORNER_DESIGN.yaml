              as: Broker
              as_user_id: "${brk_t2}"
              captures: { cv3: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_t2}/comparables/${cv1}/select"
              payload: {}
              as: Broker
              as_user_id: "${brk_t2}"
            - call: "POST /bpo/valuation-orders/${ord_t2}/comparables/${cv2}/select"
              payload: {}
              as: Broker
              as_user_id: "${brk_t2}"
            - call: "POST /bpo/valuation-orders/${ord_t2}/comparables/${cv3}/select"
              payload: {}
              as: Broker
              as_user_id: "${brk_t2}"
            - call: "POST /bpo/valuation-orders/${ord_t2}/photos"
              payload: { photo_kind: "FRONT", file_url: "https://x/f.jpg", captured_at: "2026-08-01T01:00:00Z" }
              as: Broker
              as_user_id: "${brk_t2}"
            - call: "POST /bpo/valuation-orders/${ord_t2}/photos"
              payload: { photo_kind: "STREET", file_url: "https://x/s.jpg", captured_at: "2026-08-01T01:01:00Z" }
              as: Broker
              as_user_id: "${brk_t2}"
            - call: "POST /bpo/valuation-orders/${ord_t2}/fee-lines"
              payload: { fee_kind: "BASE", description: "Base", amount_cents: 10000 }
              as: Broker
              as_user_id: "${brk_t2}"
            - call: "POST /bpo/valuation-orders/${ord_t2}/report"
              payload: {}
              as: Broker
              as_user_id: "${brk_t2}"
            - call: "POST /bpo/valuation-orders/${ord_t2}/qc/open"
              payload: {}
              as: QCReviewer
