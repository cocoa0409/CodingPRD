        grounds:
          - state_machines.Community.facility.CONVERSION_PENDING_to_PERM_CONVERTED
          - state_machines.Community.management.DEVELOPER_SELF_MANAGED_to_PM_MANAGED
          - calculations.stabilized_valuation
          - validations.priority_40_declared_transition_state
          - errors.ERR_INVALID_MANAGEMENT_STATE
          - errors.ERR_INVALID_FACILITY_STATE
        distinguishing_aspect: |
          Permanent conversion depends on four facts spread over three state dimensions of the same
          community plus a computed valuation: lifecycle_status STABILIZED, facility_status
          CONVERSION_PENDING, management_mode PM_MANAGED, and a TRAILING_ACTUAL loan_to_value_bps at or
          below 6500. Three of the four already hold — the LTV is 5931 against an 80000000 facility with
          three ACTIVE leases — so the request fails purely on the management dimension, which no
          leasing action ever moves. Executing the property-management transition (effective_from at or
          before the clock, so it lands on PM_MANAGED rather than PM_TRANSITION_PENDING) is the only
          thing that changes, and the identical conversion request then succeeds and becomes terminal.
