            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-WE", authorized_amount_cents: 50000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-05-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-31T23:59:59Z", lines: [ { line_type: "DEVICE", unit_price_cents: 100, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_ok: $.data.id } }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-06-01T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 100, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_bad: $.data.id } }
          trigger:
            - { call: "POST /api/claims/${cl_ok}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { st_ok: $.data.status } }
            - { call: "POST /api/claims/${cl_bad}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { err: $.data.error_id } }
          assert:
            - "${st_ok} == SUBMITTED  # service_date == valid_until is inside the inclusive window"
            - "${err} == ERR_FUNDING_WINDOW_INVALID  # one second past the window"

      - name: val_trial_convert_exact_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_TRIAL_EXPIRED]", state_machines.DeviceOrder.ACTIVE_to_CONVERTED]
        distinguishing_aspect: "Convert at now == trial_ends_at succeeds (boundary inclusive); one second later fails ERR_TRIAL_EXPIRED."
        test_recipe:
          setup: ["two TRIAL orders (trial_days 14) allocated at default clock 2026-05-01, so trial_ends_at = 2026-05-15T00:00:00Z for both"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Trial Edge", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-TB1", condition: "NEW" }, as: ClinicAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-TB2", condition: "NEW" }, as: ClinicAdmin, captures: { u2: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14 }, as: VisionSpecialist, captures: { o1: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14 }, as: VisionSpecialist, captures: { o2: $.data.id } }
            - { call: "POST /api/device-orders/${o1}/allocate", payload: { device_unit_id: "${u1}" }, as: VisionSpecialist }
            - { call: "POST /api/device-orders/${o2}/allocate", payload: { device_unit_id: "${u2}" }, as: VisionSpecialist }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: ClinicAdmin }
            - { call: "POST /api/device-orders/${o1}/convert", payload: {}, as: VisionSpecialist, captures: { st1: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:01Z" }, as: ClinicAdmin }
            - { call: "POST /api/device-orders/${o2}/convert", payload: {}, as: VisionSpecialist, captures: { err2: $.data.error_id } }
          assert:
            - "${st1} == CONVERTED  # now == trial_ends_at is allowed"
            - "${err2} == ERR_TRIAL_EXPIRED  # one second later rejects"

