        distinguishing_aspect: |
          Depth-3 chain from POST /api/tracks/{id}/block: track BLOCKED causes
          the release asset revert (link 1: LOCKED -> DRAFT), the asset revert
          causes the distribution unschedule (link 2: SCHEDULED -> PLANNED),
          which causes the in-flight delivery to cancel (link 3: TRANSMITTED ->
          CANCELLED). Each hop is caused by the previous link, not by the block.
        test_recipe:
          setup:
            - "Label defaults; funded contract (advance 0); SINGLE release SCHEDULED with one delivery TRANSMITTED (not yet acknowledged)"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label T1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist T1", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-T1", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TT1", duration_seconds: 200, isrc: "USRC10000041" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-T1", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager }
            - { call: "POST /api/distributors", payload: { label_id: "${label_id}", name: "DSP-T1", channel_type: "DSP" }, as: LabelAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/deliveries", payload: { distributor_ids: ["${dist_id}"] }, as: MarketingManager, captures: { del_id: "$.data[0].id" } }
            - { call: "POST /api/asset-deliveries/${del_id}/transmit", payload: {}, as: MarketingManager }
          trigger:
            - { call: "POST /api/tracks/${trk_id}/block", payload: {}, as: AnRManager }
          assert:
            - "Track.${trk_id}.status == BLOCKED"
            - "Link 1: Release.${rel_id}.asset_status == DRAFT (was LOCKED)"
            - "Link 2: Release.${rel_id}.distribution_status == PLANNED (was SCHEDULED)"
            - "Link 3: AssetDelivery.${del_id}.status == CANCELLED (was TRANSMITTED)"

      - name: royalty_finalize_cascades_statement_waterfall_payout_flip
        grounds:
          - state_machines.RoyaltyRun.CALCULATED_to_FINALIZED
          - state_machines.RoyaltyStatement.PROVISIONAL_to_FINAL
          - state_machines.RecoupmentAccount.RECOUPING_to_EARNING
          - calculations.recoupment_waterfall
        distinguishing_aspect: |
          Depth-3 chain from POST /api/royalty-runs/{id}/finalize (different
          trigger than track block): run FINALIZED causes statements PROVISIONAL
          -> FINAL (link 1), each finalized statement applies the waterfall to
          its contract's RecoupmentAccount (link 2: advance bucket 100000 -> 0),
          and the account reaching zero flips payout_status RECOUPING ->
          EARNING (link 3).
        test_recipe:
          setup:
            - "Label defaults; MASTER_ONLY contract, advance 100000 disbursed (advance bucket 100000); SINGLE release LIVE; one STREAMING report gross 1000000 units 10000 period 2026-Q3; run CALCULATED (statement PROVISIONAL, earned 140000)"
