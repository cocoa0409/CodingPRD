            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
