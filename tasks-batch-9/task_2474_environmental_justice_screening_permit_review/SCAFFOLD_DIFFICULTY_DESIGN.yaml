            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_d_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 7.20, statewide_percentile: 40.00, county_percentile: 30.00, vintage_year: 2024, expected_screening_area_version: "${area_d_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { ind_d_pm25_id: $.data.id, area_d_v1: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_d_id}", indicator_code: "ASTHMA_ED_RATE", category: "HEALTH", raw_value: 74.00, statewide_percentile: 90.00, county_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_d_v1}" }
