      - name: only_the_matching_consultation_type_may_be_concluded
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=14]
          - errors["ERR_CONSULTATION_TYPE_MISMATCH"]
          - state_machines[entity=Consultation]
        distinguishing_aspect: >-
          Both concluding endpoints leave the SAME source state (UNDER_REVIEW),
          so the state rung at priority 9 cannot separate them; only the
          consultation_type set way back at the effect determination can. That
          makes this a pure type gate at 422 rather than a 409, and it must be
          checked on both endpoints in mirror image.
        test_recipe:
