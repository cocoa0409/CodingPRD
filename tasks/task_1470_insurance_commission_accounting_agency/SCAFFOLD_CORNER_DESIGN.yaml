            - "OVERRIDE amount_cents == 1200000 (raw 1200000 below the 1650000 cap)"

      - name: balance_after_cancel_reflects_earned_only
        claim_type: derived_field_reconciliation
        grounds: ["calculations.producer_balance_recompute"]
        excluded_because:
          difficulty_instance: "transitive_cascade / voluntary_cancel_suspends_producer"
