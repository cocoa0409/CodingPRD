            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_hazcom_id: $.data.id }
            - call: "POST /written-programs/${wp_hazcom_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
