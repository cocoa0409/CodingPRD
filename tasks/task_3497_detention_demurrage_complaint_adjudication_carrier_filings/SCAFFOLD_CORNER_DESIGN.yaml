            - "GET /fmc/carrier-agreements/${ag_id} shows monitoring_reports == [] and market_concentration_hhi == null"

      - name: duplicate_congestion_report_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_DUPLICATE_CONGESTION_REPORT
        distinguishing_aspect: "The (port_code, terminal_code, week_start) triple is unique: the second identical report fails 409 ERR_DUPLICATE_CONGESTION_REPORT even though the capacity ceiling is nowhere near."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSAV", terminal_code: "TERM-1", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 100, gate_closures_hours: 0, vessel_dwell_hours_avg: 20.0 }
              as: CommissionDocket
          trigger:
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSAV", terminal_code: "TERM-1", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 50, gate_closures_hours: 1, vessel_dwell_hours_avg: 22.0 }
              as: CommissionDocket
              captures: { error_id: $.data.error_id }
          assert:
            - "the duplicate fails: 409 ERR_DUPLICATE_CONGESTION_REPORT"
            - "the same port/week under a DIFFERENT terminal (TERM-2) would be accepted — uniqueness is per triple"

      - name: duplicate_bond_ref_rejected_on_same_license
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_DUPLICATE_BOND_REF
        distinguishing_aspect: "bond_ref is unique per license: appending B1 twice fails 409 ERR_DUPLICATE_BOND_REF and the license's coverage is unchanged."
        test_recipe:
          setup:
            - "NVOCC carrier with a PENDING_BOND license already holding bond B1 (coverage 1000000)."
          setup_api_calls:
            - *c_clock
            - call: "POST /fmc/carriers"
              payload: { org_name: "Refcheck Forwarders", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/oti-licenses"
              payload: { license_type: "NVOCC" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Pacific Surety", coverage_cents: 1000000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Atlantic Surety", coverage_cents: 7000000 }
