          assert:
            - "reconcile response: expired_measure_ids == [${m_id}], expired_directive_ids == [${d_id}], review_closed_packet_ids == [${pkt_id}]"
            - "post-reconcile: measure EXPIRED, directive EXPIRED, packet REVIEW_CLOSED (all three clock gates fired in one call; inclusive boundaries at effective_to/review_closes_at)"
            - "case.active_supportive_measure_count back to 0 and exposure score recomputed (directive no longer ACTIVE)"

      - name: audit_trail_order_and_staff_only
        claim_type: computed_read
        grounds: [entities.CaseEvent, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "The append-only CaseEvent log records each intake transition in order with logical-clock timestamps; Party role is denied (audit confidentiality) with 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["case driven RECEIVED -> JURISDICTION_REVIEW -> AWAITING_FORMAL_COMPLAINT -> INVESTIGATION at default clock"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
          trigger:
            - { call: "GET /api/cases/${case_id}/events", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { e0: "$.data[0].event_type", e3: "$.data[3].event_type" } }
            - { call: "GET /api/cases/${case_id}/events", as: Party, as_user_id: "${comp_id}", captures: { err: $.data.error_id } }
          assert:
            - "events[0].event_type == REPORT_RECEIVED and events[3].event_type == FORMAL_COMPLAINT_FILED (append-only, chronological: REPORT_RECEIVED, JURISDICTION_REVIEW_STARTED, JURISDICTION_CONFIRMED, FORMAL_COMPLAINT_FILED, NOTICE_SENT for auto ALLEGATIONS)"
            - "every event occurred_at == 2026-08-01T00:00:00Z (logical clock) with actor_role/actor_id populated"
            - "Party read of the audit trail rejected 403 ERR_FORBIDDEN_ROLE"

      - name: retention_purge_seven_year_inclusive_boundary
        claim_type: conditional_action
        grounds: [entities.CaseEvent, calculations.calc_case_exposure_score, state_machines.Case]
        distinguishing_aspect: "Retention rule boundary: purge-run at 2033-08-03T00:00:00Z deletes events of the case closed exactly 2026-08-03T00:00:00Z (closed_at + 7y <= now, inclusive) but retains the case closed one day later; case rows and statistics survive the purge (only events are deleted)."
        test_recipe:
          setup: ["case A dismissed at 2026-08-03T00:00:00Z; case B dismissed at 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: false, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_a: $.data.id }
            - { call: "POST /api/cases/${case_a}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CaseAdministrator }
            - { call: "POST /api/cases/${case_a}/dismiss", payload: { dismissal_reason: "MANDATORY_NO_JURISDICTION", refer_to_conduct: false }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: CaseAdministrator }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-16T22:00:00Z", occurred_in_program_activity: false, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_b: $.data.id }
            - { call: "POST /api/cases/${case_b}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: CaseAdministrator }
            - { call: "POST /api/cases/${case_b}/dismiss", payload: { dismissal_reason: "MANDATORY_NO_JURISDICTION", refer_to_conduct: false }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2033-08-03T00:00:00Z" }, as: CaseAdministrator }
          trigger:
            - { call: "POST /api/records/purge-run", as: CaseAdministrator, captures: { purged_cases: $.data.purged_case_ids, purged_count: $.data.purged_event_count } }
            - { call: "GET /api/cases/${case_a}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { a_st: $.data.status } }
            - { call: "GET /api/cases/${case_a}/events", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /api/cases/${case_b}/events", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          assert:
            - "purged_case_ids contains ${case_a} but NOT ${case_b} (A's closed_at + 7 years == now exactly, inclusive; B is one day short)"
            - "GET case A still 200 with status DISMISSED (case row retained; only CaseEvent rows purged)"
            - "case A events list empty; case B events list non-empty (4 events retained)"

      - name: determination_and_sanction_readback_after_issue
        claim_type: standard_crud
        grounds: [entities.Determination, entities.Sanction]
        distinguishing_aspect: "Read-back of issued determination and its sanction rows: final_severity_score 15, final_tier TIER_1, appeal_deadline exactly issued_at + 5 days, sanction WARNING ACTIVE with null duration_days - the stored record matches the computation, not just the write response."
