          rationale: "The provisional-versus-final royalty pair is the domain's headline dual-variant calculation and is pinned there with both variants diverging on one quote. This file covers the remaining rounding corner of the same layer in the_royalty_true_up_is_a_difference_of_two_independently_rounded_figures and the credit branch in the_ninety_day_remake_window_binds_one_policy_and_not_the_other."

