  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_limit_offset_total_count_has_more
        claim_type: listing
        grounds: ["endpoints[GET /fleet/equipment-classes]", response_envelope]
        distinguishing_aspect: "Pagination envelope: 3 classes with limit=2 -> page 1 has 2 items, total_count == 3, has_more == true; offset=2 -> 1 item, has_more == false. Defaults (limit 10) apply when params omitted."
        test_recipe:
          setup: ["Three equipment classes EC-A, EC-B, EC-C"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EC-A", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EC-B", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EC-C", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/equipment-classes?limit=2&offset=0"
              as: FleetAdmin
            - call: "GET /fleet/equipment-classes?limit=2&offset=2"
              as: FleetAdmin
            - call: "GET /fleet/equipment-classes"
              as: FleetAdmin
          assert:
            - "Page 1: data array length == 2, total_count == 3, has_more == true"
            - "Page 2 (offset 2): data array length == 1, total_count == 3, has_more == false"
            - "Omitted params: default limit 10 -> all 3 rows, has_more == false"

      - name: equipment_list_filter_by_availability_status
        claim_type: listing
        grounds: ["endpoints[GET /fleet/equipment]"]
        distinguishing_aspect: "Filter param availability_status=ON_RENT returns only the ON_RENT unit, excluding the IDLE unit — query filter actually narrows the result set."
        test_recipe:
          setup: ["Class C501, project P501 (budget 100000000); E501a IDLE; E501b ON_RENT via ACTIVE assignment"]
