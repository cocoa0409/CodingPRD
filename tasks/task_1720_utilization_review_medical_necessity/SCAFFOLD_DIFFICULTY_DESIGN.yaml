              as: URNurse
              captures: { rev_met: $.data.id }
            - call: "POST /api/admission-reviews/${rev_met}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /api/utilization-cases/${case_id}/condition-code-44-requests"
              payload: { rationale: "Attempt while criteria met.", service_lines: [{ description: "Room", charge_cents: 200000, rate_milli: 500 }], expected_case_version: "${case_v2}" }
              as: URNurse
              captures: { err: $.data.error_id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "MCG", severity_of_illness_points: 2, intensity_of_service_points: 2, comorbidity_count: 0, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_nm: $.data.id }
            - call: "POST /api/admission-reviews/${rev_nm}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
