              payload: { dealer_id: "${dealer_pr}", drop_id: "${drop_pr}", requested_units: 5 }
              as: Dealer
              as_user_id: "${dealer_pr}"
              captures: { err_probation: $.data.error_id }
          assert:
            - "Dealer.${dealer_pr}.status == PROBATION with infraction_points == 8 before the trigger"
            - "403 and err_probation == ERR_DEALER_NOT_AUTHORIZED"
            - "GET /drinkware/launch-allocations?dealer_id=${dealer_pr} returns 0 rows (no REQUESTED row persisted)"
            - "the same request from an AUTHORIZED dealer succeeds (proven by sibling instances) — the drop being open and credit sufficient does not rescue a PROBATION dealer"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: print_slot_half_open_touching_and_changeover_buffer
        grounds:
          - calculations.print_slot_overlap
          - entities.PrintSlot.fields.station_code
        distinguishing_aspect: |
          PrintSlot resource with HALF-OPEN semantics plus a conditional 20-minute
          cross-technology changeover buffer: same-technology windows may touch endpoints
          (10:00 == 10:00 allowed) but not intersect; a PAD window starting 10 minutes after
          a LASER window ends conflicts, while exactly 20 minutes is allowed.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Station L-7 empty; all windows on 2026-09-12."
          setup_api_calls:
            - *d_clock_sep1
          trigger:
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-7", technology: "LASER", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T10:00:00Z", capacity_minutes: 60 }
              as: ProductionLead
              captures: { s1: $.data.id }
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-7", technology: "LASER", window_start: "2026-09-12T10:00:00Z", window_end: "2026-09-12T11:00:00Z", capacity_minutes: 60 }
              as: ProductionLead
              captures: { s2: $.data.id }
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-7", technology: "LASER", window_start: "2026-09-12T09:30:00Z", window_end: "2026-09-12T10:30:00Z", capacity_minutes: 60 }
              as: ProductionLead
              captures: { err_s3: $.data.error_id }
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-7", technology: "PAD", window_start: "2026-09-12T10:10:00Z", window_end: "2026-09-12T11:00:00Z", capacity_minutes: 50 }
              as: ProductionLead
              captures: { err_s4: $.data.error_id }
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-7", technology: "PAD", window_start: "2026-09-12T11:20:00Z", window_end: "2026-09-12T12:20:00Z", capacity_minutes: 60 }
              as: ProductionLead
              captures: { s5: $.data.id }
          assert:
            - "s1 and s2 both 201: [09:00,10:00) and [10:00,11:00) touch endpoints and coexist (half-open semantics)"
            - "err_s3 == ERR_SLOT_OVERLAP_CONFLICT (409): [09:30,10:30) intersects both existing LASER windows"
            - "err_s4 == ERR_SLOT_OVERLAP_CONFLICT (409): PAD at 10:10 leaves only a 10-minute changeover after the 10:00 LASER end (< 20)"
            - "s5 201: PAD at 11:20 leaves exactly the 20-minute changeover after the 11:00 LASER end — the buffer boundary is inclusive"
            - "GET /drinkware/print-slots?station_code=L-7 returns exactly 3 rows"

      - name: inspector_closed_interval_and_travel_buffer
        grounds:
          - calculations.inspection_schedule_conflict
          - entities.DealerApplication.fields.inspector_user_id
        distinguishing_aspect: |
          Inspector-calendar resource (different entity than PrintSlot) with CLOSED-interval
          semantics plus an unconditional 60-minute travel buffer: two windows sharing an
          endpoint conflict outright (09:00 belongs to both), and a 59-minute gap conflicts
          while exactly 60 minutes is allowed — opposite adjacency rule from print slots.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Four PENDING dealers with four open applications (a1..a4), all assigned to inspector fi-9; visits on 2026-09-03."
          setup_api_calls:
