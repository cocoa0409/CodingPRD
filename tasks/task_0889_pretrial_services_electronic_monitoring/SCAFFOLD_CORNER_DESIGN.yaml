scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: defendant_create_defaults_indigent_false
        claim_type: Defaults
        grounds: [entities.Defendant.fields.indigent]
        distinguishing_aspect: "Omitting indigent on POST /defendants applies the default false; a subsequent fee assessment uses the ASSESSED variant."
        test_recipe:
          setup: ["No prior data."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-DEF1", full_name: "Deff Ault", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id, ind: $.data.indigent }
          trigger:
            - call: "GET /defendants/${def_id}"
              payload: {}
              as: IntakeOfficer
              captures: { ind2: $.data.indigent, status: $.data.supervision_status }
          assert:
            - "Defendant.${def_id}.indigent == false"
            - "Defendant.${def_id}.supervision_status == PRETRIAL_PENDING"

      - name: defendant_get_not_found
        claim_type: Not Found
        grounds: [entities.Defendant]
        distinguishing_aspect: "GET /defendants/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /defendants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response HTTP status == 404"

      - name: defendant_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Defendant]
        distinguishing_aspect: "GET /defendants returns a paginated array envelope carrying total_count and has_more; limit 1 over two defendants yields has_more true."
        test_recipe:
          setup: ["Two defendants exist."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-PG1", full_name: "Pa One", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
            - call: "POST /defendants"
              payload: { case_number: "C-PG2", full_name: "Pa Two", date_of_birth: "1990-01-02" }
              as: IntakeOfficer
          trigger:
            - call: "GET /defendants"
              payload: { limit: 1, offset: 0 }
              as: IntakeOfficer
          assert:
            - "response meta pagination total_count >= 2"
            - "response has_more == true when limit 1 and at least 2 defendants exist"

      - name: assessment_create_missing_required_returns_validation
        claim_type: Required Fields
        grounds: [entities.RiskAssessment.fields.instrument_type]
        distinguishing_aspect: "POST /assessments omitting the required instrument_type returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One defendant exists."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-REQ1", full_name: "Reg Quire", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response HTTP status == 400"

      - name: assessment_create_invalid_instrument_enum
        claim_type: Type Constraints
        grounds: [entities.RiskAssessment.fields.instrument_type]
        distinguishing_aspect: "POST /assessments with instrument_type not in {SCREENING, FULL} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["One defendant exists."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-ENM1", full_name: "En Um", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "QUICK", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"
            - "response HTTP status == 422"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: assessment_invalid_transition_draft_to_approved
        claim_type: invalid_transition
        grounds: [state_machines.RiskAssessment.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Approving a DRAFT assessment (skipping SUBMITTED) is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One defendant; a DRAFT assessment."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-INV1", full_name: "Iva Lid", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response HTTP status == 409"

      - name: assessment_terminal_lockdown_rejected
        claim_type: terminal_state
        grounds: [state_machines.RiskAssessment.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "From terminal APPROVED, any further transition (to REJECTED) is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An APPROVED assessment (submitted by one officer, approved by another)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-TRM1", full_name: "Ter Minal", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
          trigger:
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "REJECTED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response HTTP status == 409"

      - name: checkin_complete_sets_completed_at
        claim_type: valid_transition
        grounds: [state_machines.CheckIn.SCHEDULED_to_COMPLETED, entities.CheckIn.fields.completed_at]
        distinguishing_aspect: "A SCHEDULED check-in transitioned to COMPLETED sets status COMPLETED and stamps completed_at."
        test_recipe:
          setup: ["A defendant with a SCHEDULED check-in due at a future instant."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-CHK1", full_name: "Chk In", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /check-ins"
              payload: { defendant_id: "${def_id}", due_at: "2026-06-10T12:00:00Z" }
              as: SupervisingOfficer
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /check-ins/${ci_id}/transition"
              payload: { to_status: "COMPLETED" }
              as: SupervisingOfficer
              captures: { st: $.data.status, comp: $.data.completed_at }
          assert:
            - "CheckIn.${ci_id}.status == COMPLETED"
            - "CheckIn.${ci_id}.completed_at is non-null"

      - name: checkin_mark_missed_before_due_time_not_reached
        claim_type: precondition_enforcement
        grounds: [state_machines.CheckIn.SCHEDULED_to_MISSED, "validations[priority=11]"]
        distinguishing_aspect: "Marking a check-in MISSED while the clock is still at or before due_at is rejected with ERR_PRECONDITION_TIME_NOT_REACHED (409)."
        test_recipe:
          setup: ["A SCHEDULED check-in due well after the default clock (2026-05-01)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-MSS1", full_name: "Mis Sed", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /check-ins"
              payload: { defendant_id: "${def_id}", due_at: "2026-06-10T12:00:00Z" }
              as: SupervisingOfficer
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /check-ins/${ci_id}/transition"
              payload: { to_status: "MISSED" }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_PRECONDITION_TIME_NOT_REACHED"
            - "response HTTP status == 409"

      - name: courtevent_fta_before_grace_time_not_reached
        claim_type: precondition_enforcement
        grounds: [state_machines.CourtEvent.SCHEDULED_to_FTA, "validations[priority=11]"]
        distinguishing_aspect: "Marking a court event FTA before hearing_at + FTA_GRACE_HOURS is rejected with ERR_PRECONDITION_TIME_NOT_REACHED (409)."
        test_recipe:
          setup: ["A SCHEDULED court event whose hearing_at is in the future relative to the default clock."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-FTG1", full_name: "Ft Grace", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /court-events"
              payload: { defendant_id: "${def_id}", hearing_at: "2026-06-20T09:00:00Z" }
              as: SupervisingOfficer
              captures: { ce_id: $.data.id }
          trigger:
            - call: "POST /court-events/${ce_id}/transition"
              payload: { to_status: "FTA" }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_PRECONDITION_TIME_NOT_REACHED"
            - "response HTTP status == 409"

      - name: em_suspend_resume_cycle_keeps_unit_assigned
        claim_type: cyclic
        grounds: [state_machines.EMEnrollment.ACTIVE_to_SUSPENDED, state_machines.EMEnrollment.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "An ACTIVE enrollment suspended then resumed returns to ACTIVE and keeps its device unit assigned (available_units stays 0 throughout)."
        test_recipe:
          setup: ["An ACTIVE enrollment on a total_units-1 pool for an ACTIVE, GPS-ordered defendant."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-SUS1", full_name: "Su Spend", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["GPS_MONITORING"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /em-devices"
              payload: { model_name: "GT-SR", total_units: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id }
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
          trigger:
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "SUSPENDED" }
              as: SupervisingOfficer
              captures: { st_susp: $.data.status }
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
              captures: { st_resume: $.data.status }
            - call: "GET /em-devices/${dev_id}"
              payload: {}
              as: SupervisingOfficer
              captures: { avail: $.data.available_units }
          assert:
            - "EMEnrollment.${enr_id}.status == ACTIVE after resume"
            - "EMDevice.${dev_id}.available_units == 0 (unit stays assigned across suspend/resume)"

      - name: drugtest_positive_cascades_violation
        claim_type: side_effect_execution
        grounds: [state_machines.DrugTest.COLLECTED_to_RESULT_POSITIVE, entities.ViolationEvent.fields.violation_type]
        distinguishing_aspect: "A drug test moved COLLECTED->RESULT_POSITIVE auto-creates a ViolationEvent {violation_type: POSITIVE_TEST, status: REPORTED} for the defendant."
        test_recipe:
          setup: ["An ACTIVE, DRUG_TESTING-ordered defendant with a SCHEDULED test, collected."]
          setup_api_calls:
            - call: "POST /testing-sites"
              payload: { name: "PosSite", slot_capacity: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /defendants"
              payload: { case_number: "C-POS1", full_name: "Po Sitive", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["DRUG_TESTING"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /drug-tests"
              payload: { defendant_id: "${def_id}", site_id: "${site_id}", test_kind: "DRUG", slot_start: "2026-06-05T10:00:00Z" }
              as: SupervisingOfficer
              captures: { dt_id: $.data.id }
            - call: "POST /drug-tests/${dt_id}/transition"
              payload: { to_status: "COLLECTED" }
              as: SupervisingOfficer
          trigger:
            - call: "POST /drug-tests/${dt_id}/transition"
              payload: { to_status: "RESULT_POSITIVE" }
              as: SupervisingOfficer
              captures: { st: $.data.status }
          assert:
            - "DrugTest.${dt_id}.status == RESULT_POSITIVE"
            - "GET /defendants/${def_id}/violations returns a ViolationEvent with violation_type == POSITIVE_TEST and status == REPORTED and source_ref == ${dt_id}"

      - name: release_order_denied_then_vacate_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ReleaseOrder.PROPOSED_to_DENIED]
        distinguishing_aspect: "A DENIED (terminal) release order cannot be VACATED; ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PROPOSED release order transitioned to DENIED."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-DEN1", full_name: "De Nied", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "DETAIN", ordered_conditions: [] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "DENIED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
          trigger:
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "VACATED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response HTTP status == 409"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: curfew_ping_at_home_true_no_violation
        claim_type: computed_field
        grounds: [calculations.curfew_ping_evaluation, entities.LocationPing.fields.is_curfew_violation]
        distinguishing_aspect: "A ping inside a curfew window but with at_home=true has is_curfew_violation == false and creates no ViolationEvent."
        test_recipe:
          setup: ["An ACTIVE enrollment with a Monday curfew window [1200,1320)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-HOM1", full_name: "Ho Me", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["GPS_MONITORING", "CURFEW"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /em-devices"
              payload: { model_name: "GT-Home", total_units: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id, enr_v0: $.data.version }
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
            - call: "GET /em-enrollments/${enr_id}"
              payload: {}
              as: SupervisingOfficer
              captures: { enr_v1: $.data.version }
            - call: "POST /em-enrollments/${enr_id}/curfew-windows"
              payload: { expected_enrollment_version: "${enr_v1}", day_of_week: 0, start_minute: 1200, end_minute: 1320 }
              as: SupervisingOfficer
          trigger:
            - call: "POST /em-enrollments/${enr_id}/pings"
              payload: { pinged_at: "2026-06-01T21:00:00Z", at_home: true }
              as: SupervisingOfficer
              captures: { flag: $.data.is_curfew_violation }
          assert:
            - "the ping at 2026-06-01T21:00:00Z has is_curfew_violation == false"
            - "GET /defendants/${def_id}/violations returns zero ViolationEvent with violation_type == CURFEW"

      - name: courtevent_reminder_due_at_computed
        claim_type: computed_field
        grounds: [entities.CourtEvent.fields.reminder_due_at, entities.CourtEvent.fields.reminder_lead_days]
        distinguishing_aspect: "reminder_due_at equals hearing_at minus reminder_lead_days whole days (2026-06-20T09:00Z, lead 3 -> 2026-06-17T09:00Z)."
        test_recipe:
          setup: ["One defendant."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-REM1", full_name: "Re Mind", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /court-events"
              payload: { defendant_id: "${def_id}", hearing_at: "2026-06-20T09:00:00Z", reminder_lead_days: 3 }
              as: SupervisingOfficer
              captures: { reminder: $.data.reminder_due_at }
          assert:
            - "CourtEvent reminder_due_at == 2026-06-17T09:00:00.000Z"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: assessment_approve_by_submitter_returns_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", entities.RiskAssessment.fields.submitted_by_user_id]
        distinguishing_aspect: "Approving a SUBMITTED assessment with the same X-User-ID that submitted it returns ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup: ["A SUBMITTED assessment whose submitted_by_user_id is u_same."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-SOD1", full_name: "So Duty", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_same"
          trigger:
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_same"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "response HTTP status == 409"

      - name: violation_adjudicate_by_reporter_returns_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", entities.ViolationEvent.fields.reported_by_user_id]
        distinguishing_aspect: "Adjudicating an UNDER_REVIEW violation with the same X-User-ID that reported it returns ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup: ["A violation reported by u_rep and moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-SOD2", full_name: "So Two", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /violations"
              payload: { defendant_id: "${def_id}", violation_type: "OTHER", severity: "MINOR" }
              as: SupervisingOfficer
              as_user_id: "u_rep"
              captures: { v_id: $.data.id }
            - call: "POST /violations/${v_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: JudicialOfficer
              as_user_id: "u_judge"
          trigger:
            - call: "POST /violations/${v_id}/transition"
              payload: { to_status: "ADJUDICATED_SANCTION" }
              as: JudicialOfficer
              as_user_id: "u_rep"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "response HTTP status == 409"

      - name: drugtest_without_condition_returns_condition_not_ordered
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", entities.ReleaseOrder.fields.ordered_conditions]
        distinguishing_aspect: "Scheduling a drug test for a defendant whose ORDERED release lacks DRUG_TESTING returns ERR_CONDITION_NOT_ORDERED (409), even when the site has ample capacity."
        test_recipe:
          setup: ["An ACTIVE defendant whose release ordered_conditions is [CHECK_IN] only; a site with slot_capacity 5."]
          setup_api_calls:
            - call: "POST /testing-sites"
              payload: { name: "FreeSite", slot_capacity: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /defendants"
              payload: { case_number: "C-COND1", full_name: "Con Dish", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["CHECK_IN"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
          trigger:
            - call: "POST /drug-tests"
              payload: { defendant_id: "${def_id}", site_id: "${site_id}", test_kind: "DRUG", slot_start: "2026-06-05T10:00:00Z" }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_CONDITION_NOT_ORDERED"
            - "response HTTP status == 409"

  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: em_activate_no_device_returns_no_device_available
        claim_type: conditional_action
        grounds: ["validations[priority=12]", entities.EMDevice.fields.available_units]
        distinguishing_aspect: "Activating an enrollment for an ACTIVE, GPS-ordered defendant on an exhausted pool (available_units 0) returns ERR_NO_DEVICE_AVAILABLE (409) — the pure fiscal path, with state and safety checks passing."
        test_recipe:
          setup: ["An ACTIVE, GPS-ordered defendant; a device pool total_units 0; a PENDING enrollment on it."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-NODV1", full_name: "No Dev", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["GPS_MONITORING"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /em-devices"
              payload: { model_name: "GT-Empty", total_units: 0 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
