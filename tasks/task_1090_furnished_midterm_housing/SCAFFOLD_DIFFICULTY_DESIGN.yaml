              as: Host
              as_user_id: "${host_id}"
              captures: { unit1_id: $.data.id }
            - call: "POST /units/${unit1_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U16b", address: "16b St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit2_id: $.data.id }
            - call: "POST /units/${unit2_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit1_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
