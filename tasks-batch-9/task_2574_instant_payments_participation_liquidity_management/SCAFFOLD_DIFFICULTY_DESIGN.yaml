  - rule_id: resource_temporal_overlap
    instances:
      - name: segment_policy_windows_adjacent_admitted_overlap_rejected
        grounds:
          - validations[priority=82]
          - errors[ERR_POLICY_WINDOW_OVERLAP]
          - entities.CustomerSegmentPolicy.fields.effective_from
          - entities.CustomerSegmentPolicy.fields.effective_to
          - concurrency_rules.segment-policy-supersede-stale-participant
        distinguishing_aspect: |
          Half-open interval semantics on a scarce resource keyed by (participant_id, segment): a
          window starting at exactly the incumbent's effective_to is adjacent and admitted, while
          one starting a single minute earlier overlaps and is refused - and because every accepted
          publication bumps Participant.version, the third attempt must also carry a freshly read
          expected_participant_version, so the overlap check and the OCC check are exercised in the
          same chain without either masking the other.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a prefunded position account of 1,200,000,000 cents."
            - "Policy P1 for segment CORPORATE covers the half-open window 2026-08-01T00:00:00Z to 2026-09-01T00:00:00Z."
            - "Policy P2 for the same segment starts at exactly 2026-09-01T00:00:00Z with no effective_to and was admitted as adjacent."
            - "Each publication re-reads Participant.version, which the previous publication incremented."
            - "The clock stays at 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v1: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_participant_version: "${pa_v1}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /participants/${pa_id}"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { pa_v2: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 300000000, daily_aggregate_limit_cents: 600000000, rolling_window_count_limit: 6, rolling_window_amount_limit_cents: 500000000, effective_from: "2026-09-01T00:00:00Z", expected_participant_version: "${pa_v2}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /participants/${pa_id}"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { pa_v3: $.data.version }
          trigger:
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 400000000, daily_aggregate_limit_cents: 700000000, rolling_window_count_limit: 7, rolling_window_amount_limit_cents: 600000000, effective_from: "2026-08-31T23:59:00Z", expected_participant_version: "${pa_v3}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
          assert:
            - "P2 was admitted with HTTP 201: a window whose effective_from equals the incumbent's effective_to is adjacent, not overlapping"
            - "CustomerSegmentPolicy.${p1_id}.effective_to == 2026-09-01T00:00:00Z and superseded_at == null (adjacency does not supersede anything)"
            - "The trigger returns HTTP 409 with error_id == ERR_POLICY_WINDOW_OVERLAP; one minute earlier is an overlap of P1"
            - "Exactly 2 CustomerSegmentPolicy rows exist for participant ${pa_id} after the trigger"
            - "Participant.${pa_id}.version is unchanged by the refused publication, so ${pa_v3} is still current"
            - "The overlap key is (participant_id, segment): the same rejected window published for segment CONSUMER instead, carrying the still-current expected_participant_version, returns HTTP 201"
            - "Refusing the overlap is not a version problem: repeating the trigger with a deliberately stale expected_participant_version of ${pa_v1} returns HTTP 412 ERR_STALE_PARTICIPANT_VERSION rather than the 409"

      - name: outage_stabilization_buffer_blocks_early_redeclaration
        grounds:
          - validations[priority=83]
          - errors[ERR_OUTAGE_WINDOW_CONFLICT]
          - global_constants.OUTAGE_STABILIZATION_BUFFER_MINUTES
          - state_machines.OutageEvent.DECLARED_to_RESOLVED
        distinguishing_aspect: |
          A different overlap geometry from the policy case: outage intervals are CLOSED on both
          ends, and a RESOLVED event keeps reserving the half-open range (ended_at, ended_at + 15
          minutes) even though it is no longer DECLARED. So the blocking resource is a window that
          extends past the end of the record that owns it, and the buffer edge is inclusive-admit:
          exactly ended_at + 15 minutes is accepted while ended_at + 14 minutes is refused.
