        distinguishing_aspect: "Client reads aircraft.version (v0), a grounding squawk bumps it, then booking create carrying the stale v0 -> ERR_STALE_AIRCRAFT_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE enrollment; an aircraft the client observed at version v0; the aircraft then grounded (version advanced) before the booking create."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Occ User", email: "occ@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "iriso@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NOCC", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id, ac_v0: $.data.version }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /flight-school/squawks"
              payload: { aircraft_id: "${ac_id}", description: "Stall warning inop", is_grounding: true }
              as: Mechanic
          trigger:
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${ac_v0}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 data.error_id == ERR_STALE_AIRCRAFT_VERSION"
            - "Aircraft.${ac_id}.version > ${ac_v0} (advanced by the grounding)"

      - name: occ_matching_aircraft_version_on_booking_create_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-aircraft]", "validations[priority=5]"]
        distinguishing_aspect: "Supplying the current observed aircraft version (v0, no intervening mutation) on a booking create against an AVAILABLE aircraft succeeds (201, REQUESTED)."
        test_recipe:
          setup: ["ACTIVE enrollment; AVAILABLE aircraft observed at its current version (no intervening grounding)."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Okk User", email: "okk@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "irisok@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NOKK", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id, ac_v0: $.data.version }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${ac_v0}" }
              as: Dispatcher
              captures: { bk_id: $.data.id }
          assert:
            - "HTTP 201; Booking.${bk_id}.status == REQUESTED and estimated_cost_cents == 42000"

      - name: deposit_dual_variant_settlement_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.deposit_settlement]
        excluded_because:
          difficulty_instance: dual_variant_calc / deposit_settlement_provisional_vs_final
          rationale: "Provisional-hold vs final-consume settlement is asserted by the named §1.8 instance."

      - name: grounding_cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Aircraft.AVAILABLE_to_GROUNDED]
        excluded_because:
          difficulty_instance: transitive_cascade / grounding_cascade_squawk_aircraft_booking_deposit
          rationale: "The grounding cascade chain is asserted end-to-end by the named §1.8 instance."

