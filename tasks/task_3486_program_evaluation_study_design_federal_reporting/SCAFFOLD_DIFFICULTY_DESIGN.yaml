              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /evaluation/studies/${study_id}/irb-protocols"
              payload: { title: "Protocol P2", estimated_burden_minutes: 320 }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { irb2: $.data.id }
            - call: "POST /evaluation/irb-protocols/${irb2}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
          trigger:
            - call: "POST /evaluation/irb-protocols/${irb2}/decision"
              payload: { decision: "APPROVED", approval_start: "2027-06-01T00:00:00Z", approval_end: "2028-05-31T00:00:00Z" }
              as: IRBReviewer
              as_user_id: "irb-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /evaluation/irb-protocols/${irb2}/decision"
              payload: { decision: "APPROVED", approval_start: "2027-09-01T00:00:00Z", approval_end: "2028-08-31T00:00:00Z" }
              as: IRBReviewer
              as_user_id: "irb-1"
          assert:
            - "Overlapping window [2027-06-01, 2028-05-31) vs [2026-09-01, 2027-09-01): error_id == ERR_IRB_WINDOW_OVERLAP; P2 stays SUBMITTED"
            - "Adjacent window [2027-09-01, 2028-08-31) (start == prior end, half-open): decision succeeds, IRBProtocol.${irb2}.status == APPROVED"
            - "IRBProtocol.${irb2}.consent_form_version == 1 (approved without a modifications cycle)"

