          - errors.ERR_NO_CONSENTING_INTEREST
          - state_machines.Afe.ELECTIONS_OPEN_to_FAILED
        distinguishing_aspect: |
          The FAILED branch of the AFE machine is reachable only when 0.000000 <
          consent_working_interest_pct < minimum_consent_pct: with no operator on the well and both
          non-operator holders electing NON_CONSENT the tally is exactly 0.000000, so closure returns
          ERR_NO_CONSENTING_INTEREST (422) instead of transitioning to FAILED.
