scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Entities — creation, required fields, defaults, computed, immutability
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: wedding_create_minimum_fields_returns_201
        claim_type: creation
        grounds:
          - entities.Wedding
          - endpoints[POST /weddings]
        distinguishing_aspect: |
          POST /weddings with all required fields (couple_user_id, title, ceremony_at,
          rsvp_deadline_at) returns 201 with a Wedding entity whose status==DRAFT,
          version==1, seating_dirty==false, total_capacity==0.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_min", title: "Min Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_min"
              captures: { w_id: $.data.id, w_status: $.data.status, w_version: $.data.version, w_dirty: $.data.seating_dirty, w_cap: $.data.total_capacity }
          assert:
            - "HTTP status == 201."
            - "Wedding.${w_id}.status == DRAFT, version == 1, seating_dirty == false, total_capacity == 0."
            - "Wedding.${w_id}.id is a server-minted UUID (no type prefix)."

      - name: wedding_create_missing_title_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Wedding.fields.title
          - endpoints[POST /weddings]
          - validations[priority=16]
        distinguishing_aspect: |
          POST /weddings without the required `title` field returns 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_nm", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_nm"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400."
            - "error_id == ERR_INVALID_REQUEST."

      - name: guest_create_default_plus_one_allowed_false
        claim_type: defaults
        grounds:
          - entities.Guest.fields.plus_one_allowed
          - endpoints[POST /weddings/{id}/guests]
        distinguishing_aspect: |
          POST /weddings/{id}/guests without `plus_one_allowed` defaults to false; subsequent
          POST /guests/{id}/plus-ones is rejected with ERR_PLUS_ONE_NOT_ALLOWED.
        test_recipe:
          setup:
            - "Wedding in any non-archived state with no MealOptions yet."
          setup_api_calls:
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_def", title: "Default Test", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_def"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Default", email: "default@example.com" }
              as: Couple
              as_user_id: "couple_def"
              captures: { g_id: $.data.id, g_plus_one: $.data.plus_one_allowed }
          trigger:
            - call: "POST /guests/${g_id}/plus-ones"
              payload: { full_name: "Should Fail" }
              as: Couple
              as_user_id: "couple_def"
              captures: { err_id: $.data.error_id }
          assert:
            - "Guest.${g_id}.plus_one_allowed == false (default applied)."
            - "POST /guests/${g_id}/plus-ones returned 422 with error_id == ERR_PLUS_ONE_NOT_ALLOWED."

      - name: guest_invitation_token_server_minted
        claim_type: system_fields
        grounds:
          - entities.Guest.fields.invitation_token
        distinguishing_aspect: |
          invitation_token is source=system; client-supplied invitation_token in the
          request body is IGNORED, server mints its own.
        test_recipe:
          setup:
            - "Wedding present."
          setup_api_calls:
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_tok", title: "Tok Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_tok"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Tok", email: "tok@example.com" }
              as: Couple
              as_user_id: "couple_tok"
              captures: { g_id: $.data.id, g_tok: $.data.invitation_token }
          assert:
            - "Guest.${g_id}.invitation_token is a non-empty server-minted string (not equal to any client input — none was sent)."

  # ---------------------------------------------------------------------------
  # State Machines — invalid transitions, terminal lockdown
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: open_rsvp_from_rsvp_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Wedding.transitions.DRAFT_to_RSVP_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Wedding already in RSVP_OPEN cannot be re-opened — POST /weddings/{id}/open-rsvp
          rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Wedding W_open in RSVP_OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_op", title: "Op Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_op"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_op"
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_op"
          trigger:
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_op"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409; error_id == ERR_INVALID_STATE."

      - name: archived_wedding_rejects_all_mutations
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Wedding.terminal_states
          - validations[priority=4]
          - errors[ERR_WEDDING_ARCHIVED]
        distinguishing_aspect: |
          ARCHIVED Wedding rejects every child mutation (e.g., POST /weddings/{id}/guests)
          with ERR_WEDDING_ARCHIVED.
        test_recipe:
          setup:
            - "Wedding W_arch progressed to SEATED then archived (ceremony_at < current_utc)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_ar", title: "Ar Wedding", ceremony_at: "2027-03-01T18:00:00Z", rsvp_deadline_at: "2027-02-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_ar"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_ar"
            - call: "POST /weddings/${w_id}/tables"
              payload: { table_number: 1, capacity: 4, kids_only: false }
              as: Couple
              as_user_id: "couple_ar"
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_ar"
            - call: "POST /weddings/${w_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_ar"
              captures: { w_v_close: $.data.version }
            - call: "POST /weddings/${w_id}/finalize-seating"
              payload: { expected_wedding_version: "${w_v_close}" }
              as: Couple
              as_user_id: "couple_ar"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings/${w_id}/archive"
              payload: {}
              as: Couple
              as_user_id: "couple_ar"
          trigger:
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Late", email: "late@example.com" }
              as: Couple
              as_user_id: "couple_ar"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409; error_id == ERR_WEDDING_ARCHIVED."

      - name: close_rsvp_auto_declines_invited_guests
        claim_type: side_effect_execution
        grounds:
          - state_machines.Wedding.transitions.RSVP_OPEN_to_RSVP_CLOSED
          - state_machines.Guest.transitions.INVITED_to_DECLINED
        distinguishing_aspect: |
          POST /weddings/{id}/close-rsvp cascades: every Guest still INVITED
          auto-transitions to DECLINED with meal_option_id cleared.
        test_recipe:
          setup:
            - "Wedding W_cls in RSVP_OPEN with one Guest G_inv still INVITED and one Guest G_att ATTENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_cls", title: "Cls Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_cls"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_cls"
              captures: { meal_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Inv", email: "inv@example.com" }
              as: Couple
              as_user_id: "couple_cls"
              captures: { g_inv_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Att", email: "att@example.com" }
              as: Couple
              as_user_id: "couple_cls"
              captures: { g_att_id: $.data.id }
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_cls"
            - call: "POST /guests/${g_att_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: Couple
              as_user_id: "couple_cls"
          trigger:
            - call: "POST /weddings/${w_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_cls"
            - call: "GET /guests/${g_inv_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_cls"
              captures: { st_inv_after: $.data.rsvp_status }
            - call: "GET /guests/${g_att_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_cls"
              captures: { st_att_after: $.data.rsvp_status }
          assert:
            - "Guest.${g_inv_id}.rsvp_status == DECLINED and meal_option_id == null (auto-cascade)."
            - "Guest.${g_att_id}.rsvp_status == ATTENDING (unchanged — was not INVITED)."

      - name: error_stale_version_on_finalize_seating
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[finalize-seating-stale-wedding]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC stale-version on POST /weddings/{id}/finalize-seating: the Couple's
          expected_wedding_version is stale because a guest's late RSVP cascaded and
          bumped wedding.version between the read and the finalize submit.
        test_recipe:
          setup:
            - "Wedding W_stale in RSVP_CLOSED with one ATTENDING guest and one Table; the Couple has captured wedding.version, then a Couple-driven decline cascade bumped wedding.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_st", title: "St Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_st"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_st"
              captures: { meal_id: $.data.id }
            - call: "POST /weddings/${w_id}/tables"
              payload: { table_number: 1, capacity: 2, kids_only: false }
              as: Couple
              as_user_id: "couple_st"
              captures: { t_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Stay", email: "stay@example.com" }
              as: Couple
              as_user_id: "couple_st"
              captures: { g_stay_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Drop", email: "drop@example.com" }
              as: Couple
              as_user_id: "couple_st"
              captures: { g_drop_id: $.data.id }
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_st"
            - call: "POST /guests/${g_stay_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: Couple
              as_user_id: "couple_st"
            - call: "POST /guests/${g_drop_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: Couple
              as_user_id: "couple_st"
            - call: "POST /weddings/${w_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_st"
              captures: { w_v_close: $.data.version }
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w_id}", table_id: "${t_id}", assignee_type: "GUEST", assignee_id: "${g_stay_id}" }
              as: Couple
              as_user_id: "couple_st"
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w_id}", table_id: "${t_id}", assignee_type: "GUEST", assignee_id: "${g_drop_id}" }
              as: Couple
              as_user_id: "couple_st"
              captures: { w_v_observed: $.data.created_at }    # note: we instead read wedding directly below
            - call: "GET /weddings/${w_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_st"
              captures: { w_v_pre_decline: $.data.version }
            - call: "POST /guests/${g_drop_id}/rsvp"
              payload: { attending: false }
              as: Couple
              as_user_id: "couple_st"
          trigger:
            - call: "POST /weddings/${w_id}/finalize-seating"
              payload: { expected_wedding_version: "${w_v_pre_decline}" }
              as: Couple
              as_user_id: "couple_st"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 412; error_id == ERR_STALE_VERSION."
            - "Wedding.${w_id}.status remains RSVP_CLOSED (no transition)."

  # ---------------------------------------------------------------------------
  # Calculations — claims not covered by §1.8
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: meal_count_aggregation_excludes_declined
        claim_type: input_set_filtering
        grounds:
          - calculations.meal_count_aggregation
        distinguishing_aspect: |
          Source rows with rsvp_status==DECLINED do NOT contribute to count(M); only
          ATTENDING rows do.
        test_recipe:
          setup:
            - "Wedding W_excl in RSVP_OPEN with two guests on meal M_excl: G_yes (ATTENDING), G_no (DECLINED with meal_option_id cleared by transition)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_ex", title: "Ex Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_ex"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "EXCL", label: "Excl", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_ex"
              captures: { meal_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Yes", email: "yes@example.com" }
              as: Couple
              as_user_id: "couple_ex"
              captures: { g_yes_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "No", email: "no@example.com" }
              as: Couple
              as_user_id: "couple_ex"
              captures: { g_no_id: $.data.id }
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_ex"
            - call: "POST /guests/${g_yes_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: Couple
              as_user_id: "couple_ex"
            - call: "POST /guests/${g_no_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: Couple
              as_user_id: "couple_ex"
            - call: "POST /guests/${g_no_id}/rsvp"
              payload: { attending: false }
              as: Couple
              as_user_id: "couple_ex"
          trigger:
            - call: "GET /weddings/${w_id}/meal-summary"
              payload: {}
              as: Couple
              as_user_id: "couple_ex"
              captures: { summary: $.data }
          assert:
            - "count for meal_option_id=${meal_id} == 1 (G_yes only; G_no excluded as DECLINED)."
            - "total_attendees == 1."

      - name: purchase_aggregation_chronological_tie_break_by_created_at
        claim_type: chronological_order_sensitivity
        grounds:
          - calculations.registry_purchase_aggregation
        distinguishing_aspect: |
          Two purchases with the SAME occurred_at on a RegistryItem (target_quantity=1)
          are classified by created_at ASC tie-break (NEVER id). The earlier-created
          row gets CONFIRMED, the later-created PENDING_REVIEW.
        test_recipe:
          setup:
            - "Wedding W_chr in RSVP_OPEN with RegistryItem R_chr (target_quantity=1) and zero purchases."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_ch", title: "Ch Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_ch"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_ch"
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_ch"
            - call: "POST /weddings/${w_id}/registry-items"
              payload: { sku: "MIXER", title: "Mixer", target_quantity: 1, unit_price_cents: 9000 }
              as: Couple
              as_user_id: "couple_ch"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /registry-items/${r_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "M1", purchaser_name: "Hal", quantity: 1, occurred_at: "2027-02-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p_first_id: $.data.id, p_first_status: $.data.status }
            - call: "POST /registry-items/${r_id}/purchases"
              payload: { platform_code: "STORE_B", external_purchase_id: "M2", purchaser_name: "Ivy", quantity: 1, occurred_at: "2027-02-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p_second_id: $.data.id, p_second_status: $.data.status, p_second_dup: $.data.dup_of_purchase_id }
          assert:
            - "Purchase.${p_first_id}.status == CONFIRMED (created_at earlier wins the tie)."
            - "Purchase.${p_second_id}.status == PENDING_REVIEW."
            - "Purchase.${p_second_id}.dup_of_purchase_id == ${p_first_id}."

      - name: thank_you_completion_empty_set_returns_one_hundred
        claim_type: boundary_zero
        grounds:
          - calculations.thank_you_completion_score
        distinguishing_aspect: |
          Empty-set boundary: N_total==0 short-circuits to completion_pct==100.00 and
          is_complete==false (since N_total>0 part of is_complete fails).
        test_recipe:
          setup:
            - "Wedding W_zero in DRAFT (or any state) with no registry items or no confirmed purchases."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_zr", title: "Zr Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_zr"
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /weddings/${w_id}/thank-you-report"
              payload: {}
              as: Couple
              as_user_id: "couple_zr"
              captures: { rpt: $.data }
          assert:
            - "Response.data.n_total == 0; n_sent == 0; n_drafted == 0; n_pending == 0."
            - "Response.data.completion_pct == 100.00 (empty-set short-circuit)."
            - "Response.data.is_complete == false."

      - name: purchase_idempotent_replay_same_quantity
        claim_type: idempotency
        grounds:
          - validations[priority=14]
          - entities.Purchase.fields.external_purchase_id
        distinguishing_aspect: |
          POSTing the same (platform_code, external_purchase_id) twice with the same
          quantity is idempotent: returns the existing Purchase, RegistryItem
          aggregates unchanged on the replay.
        test_recipe:
          setup:
            - "Wedding W_idem in RSVP_OPEN with RegistryItem R_idem (target_quantity=5) and one purchase P_idem already CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_id", title: "Id Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_id"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_id"
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_id"
            - call: "POST /weddings/${w_id}/registry-items"
