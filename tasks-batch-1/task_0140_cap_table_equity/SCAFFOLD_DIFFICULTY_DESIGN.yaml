scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: exercise_spread_in_the_money_vs_underwater
        grounds:
          - calculations.exercise_spread
          - state_machines.Exercise.PENDING_to_SETTLED
          - entities.Exercise.fields.spread_cents
        distinguishing_aspect: |
          Two valid spread readings on the Exercise domain: in-the-money
          (fmv>strike → positive bargain element) vs at/under-water
          (fmv<=strike → spread floored to 0). Same settle path, different
          spread_cents; this is the Exercise-domain dual-variant, distinct from
          the SecurityClass-domain waterfall variant below.
        test_recipe:
          setup:
            - "OPEN cap table; one COMMON class; one EFFECTIVE valuation fmv=500c; one ACTIVE pool; one ACTIVE fully-vested grant strike=100c (in-the-money); a second ACTIVE fully-vested grant strike=800c (under-water)"
            - "clock at 2026-06-01 so both grants are fully vested"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "Acme", authorized_shares: 10000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Common", class_type: "COMMON", original_issue_price_cents: 0, liquidation_pref_multiple: 0 }
              as: Administrator
              captures: { common: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Emp One", holder_type: "EMPLOYEE", email: "e1@x.com", is_us_taxpayer: true }
              as: Administrator
              captures: { sh1: $.data.id }
            - call: "POST /valuations"
              payload: { cap_table_id: "${ct}", fmv_per_share_cents: 500, valuation_date: "2020-01-01T00:00:00Z", expires_at: "2020-12-31T00:00:00Z" }
              as: Administrator
              captures: { val1: $.data.id }
            - call: "POST /valuations/${val1}/approve"
              payload: {}
              as: BoardApprover
            - call: "POST /option-pools"
              payload: { cap_table_id: "${ct}", authorized_shares: 1000000 }
              as: Administrator
              captures: { pool: $.data.id }
            - call: "POST /option-grants"
              payload: { cap_table_id: "${ct}", option_pool_id: "${pool}", shareholder_id: "${sh1}", security_class_id: "${common}", valuation_id: "${val1}", share_count: 1000, strike_price_cents: 100, grant_date: "2020-01-01T00:00:00Z", vesting_months: 48, cliff_months: 12, vesting_style: "GRADED" }
              as: Administrator
              captures: { g_itm: $.data.id }
            - call: "POST /option-grants/${g_itm}/approve"
              payload: {}
              as: BoardApprover
              as_user_id: "approver-1"
            - call: "POST /option-grants"
              payload: { cap_table_id: "${ct}", option_pool_id: "${pool}", shareholder_id: "${sh1}", security_class_id: "${common}", valuation_id: "${val1}", share_count: 1000, strike_price_cents: 800, grant_date: "2020-01-01T00:00:00Z", vesting_months: 48, cliff_months: 12, vesting_style: "GRADED" }
              as: Administrator
              captures: { g_uw: $.data.id }
            - call: "POST /option-grants/${g_uw}/approve"
              payload: {}
              as: BoardApprover
              as_user_id: "approver-1"
            - call: "POST /exercises"
              payload: { cap_table_id: "${ct}", option_grant_id: "${g_itm}", share_count: 1000 }
              as: Administrator
              captures: { ex_itm: $.data.id }
            - call: "POST /exercises"
              payload: { cap_table_id: "${ct}", option_grant_id: "${g_uw}", share_count: 1000 }
              as: Administrator
              captures: { ex_uw: $.data.id }
          trigger:
            - call: "POST /exercises/${ex_itm}/settle"
              payload: {}
              as: Administrator
              captures: { itm_spread: $.data.spread_cents }
            - call: "POST /exercises/${ex_uw}/settle"
              payload: {}
              as: Administrator
              captures: { uw_spread: $.data.spread_cents }
          assert:
            - "Exercise.${ex_itm}.spread_cents == 400000"
            - "Exercise.${ex_uw}.spread_cents == 0"

      - name: waterfall_non_participating_vs_participating_capped
        grounds:
          - calculations.liquidation_waterfall
          - state_machines.LiquidationEvent.DRAFT_to_COMPUTED
          - entities.WaterfallDistribution.fields.total_paid_cents
        distinguishing_aspect: |
          Two valid waterfall readings on the SecurityClass domain:
          non-participating preferred (takes the GREATER of pref OR pro-rata,
          does not double-dip) vs participating-capped (takes pref AND pro-rata
          up to a cap). Different total_paid_cents for the SAME class shape;
          this is the SecurityClass-domain dual-variant, a different entity
          domain than the Exercise-spread variant above.
        test_recipe:
          setup:
            - "Cap table A: Series A non-participating 1x pref, 100000 shares oip=500c; Common 400000 shares; proceeds 200,000,000c"
            - "Cap table B: Series A participating 1x pref cap 2x, 100000 shares oip=500c; Common 400000 shares; proceeds 200,000,000c"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "NonPart Co", authorized_shares: 10000000 }
              as: Administrator
              captures: { ctn: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ctn}", name: "Series A", class_type: "PREFERRED", original_issue_price_cents: 500, liquidation_pref_multiple: 1.0, participating: false }
              as: Administrator
              captures: { n_a: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ctn}", name: "Common", class_type: "COMMON", original_issue_price_cents: 0, liquidation_pref_multiple: 0, seniority_below_class_id: "${n_a}" }
              as: Administrator
              captures: { n_c: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ctn}", legal_name: "Inv", holder_type: "INVESTOR", email: "inv@n.com" }
              as: Administrator
              captures: { n_inv: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ctn}", legal_name: "Founder", holder_type: "FOUNDER", email: "f@n.com" }
              as: Administrator
              captures: { n_fnd: $.data.id }
            - call: "POST /share-issuances"
              payload: { cap_table_id: "${ctn}", security_class_id: "${n_a}", shareholder_id: "${n_inv}", share_count: 100000, price_paid_cents: 50000000 }
              as: Administrator
            - call: "POST /share-issuances"
              payload: { cap_table_id: "${ctn}", security_class_id: "${n_c}", shareholder_id: "${n_fnd}", share_count: 400000, price_paid_cents: 0 }
              as: Administrator
            - call: "POST /liquidation-events"
              payload: { cap_table_id: "${ctn}", total_proceeds_cents: 200000000 }
              as: Administrator
              captures: { n_ev: $.data.id }
            - call: "POST /liquidation-events/${n_ev}/compute"
              payload: {}
              as: BoardApprover
            - call: "POST /cap-tables"
              payload: { company_name: "Part Co", authorized_shares: 10000000 }
              as: Administrator
              captures: { ctp: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ctp}", name: "Series A", class_type: "PREFERRED", original_issue_price_cents: 500, liquidation_pref_multiple: 1.0, participating: true, participation_cap_multiple: 2.0 }
              as: Administrator
              captures: { p_a: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ctp}", name: "Common", class_type: "COMMON", original_issue_price_cents: 0, liquidation_pref_multiple: 0, seniority_below_class_id: "${p_a}" }
              as: Administrator
              captures: { p_c: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ctp}", legal_name: "Inv", holder_type: "INVESTOR", email: "inv@p.com" }
              as: Administrator
              captures: { p_inv: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ctp}", legal_name: "Founder", holder_type: "FOUNDER", email: "f@p.com" }
              as: Administrator
              captures: { p_fnd: $.data.id }
            - call: "POST /share-issuances"
              payload: { cap_table_id: "${ctp}", security_class_id: "${p_a}", shareholder_id: "${p_inv}", share_count: 100000, price_paid_cents: 50000000 }
              as: Administrator
            - call: "POST /share-issuances"
              payload: { cap_table_id: "${ctp}", security_class_id: "${p_c}", shareholder_id: "${p_fnd}", share_count: 400000, price_paid_cents: 0 }
              as: Administrator
            - call: "POST /liquidation-events"
              payload: { cap_table_id: "${ctp}", total_proceeds_cents: 200000000 }
              as: Administrator
              captures: { p_ev: $.data.id }
            - call: "POST /liquidation-events/${p_ev}/compute"
              payload: {}
              as: BoardApprover
          trigger:
            - call: "GET /liquidation-events/${n_ev}/distributions"
              payload: {}
              as: Auditor
            - call: "GET /liquidation-events/${p_ev}/distributions"
              payload: {}
              as: Auditor
          assert:
            - "non-participating WaterfallDistribution for class ${n_a} total_paid_cents == 50000000 (pref only, no Pass-2 share)"
            - "non-participating WaterfallDistribution for class ${n_c} total_paid_cents == 150000000"
            - "participating-capped WaterfallDistribution for class ${p_a} total_paid_cents == 80000000 (50M pref + 30M participation)"
            - "participating-capped WaterfallDistribution for class ${p_c} total_paid_cents == 120000000"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: conversion_shares_min_of_cap_and_discount_price
        grounds:
          - calculations.conversion_shares
          - state_machines.SafeNote.OUTSTANDING_to_CONVERTED
          - entities.SafeNote.fields.converted_share_count
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — effective_price =
          min(discount_price, cap_price) where cap_price = valuation_cap /
          fully_diluted_shares; converted shares = floor(invested /
          effective_price). The nested min over two priced candidates is the
          non-linear interaction. Distinct mode from the round-per-item-then-sum
          instance below.
        test_recipe:
          setup:
            - "OPEN cap table with fully_diluted_shares == 1,000,000 from issued common; one OUTSTANDING SAFE principal=2,000,000c discount=0.20 cap=600,000,000c; target PREFERRED priced round PPS=1000c"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "ConvCo", authorized_shares: 10000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Common", class_type: "COMMON", original_issue_price_cents: 100, liquidation_pref_multiple: 0 }
              as: Administrator
              captures: { common: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Founder", holder_type: "FOUNDER", email: "f@conv.com" }
              as: Administrator
              captures: { fnd: $.data.id }
            - call: "POST /share-issuances"
              payload: { cap_table_id: "${ct}", security_class_id: "${common}", shareholder_id: "${fnd}", share_count: 1000000, price_paid_cents: 100000000 }
              as: Administrator
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Series Seed", class_type: "PREFERRED", original_issue_price_cents: 1000, liquidation_pref_multiple: 1.0, participating: false }
              as: Administrator
              captures: { pref: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Angel", holder_type: "INVESTOR", email: "a@conv.com" }
              as: Administrator
              captures: { ang: $.data.id }
            - call: "POST /safe-notes"
              payload: { cap_table_id: "${ct}", shareholder_id: "${ang}", instrument_type: "SAFE", principal_cents: 2000000, valuation_cap_cents: 600000000, discount_pct: 0.20, issue_date: "2025-01-01T00:00:00Z" }
              as: Administrator
              captures: { note: $.data.id }
            - call: "POST /safe-notes/${note}/submit-terms"
              payload: {}
              as: Administrator
            - call: "POST /safe-notes/${note}/execute"
              payload: {}
              as: BoardApprover
            - call: "GET /safe-notes/${note}"
              payload: {}
              as: BoardApprover
              captures: { note_v: $.data.version }
          trigger:
            - call: "POST /safe-notes/${note}/convert"
              payload: { target_class_id: "${pref}", expected_note_version: "${note_v}" }
              as: BoardApprover
              captures: { conv_shares: $.data.converted_share_count }
          assert:
            - "discount_price = 1000*(1-0.20) = 800c; cap_price = 600000000/1000000 = 600c; cap binds (min is 600c)"
            - "SafeNote.${note}.converted_share_count == 3333 (floor(2000000/600))"
            - "SafeNote.${note}.status == CONVERTED"

      - name: fully_diluted_round_per_note_then_sum
        grounds:
          - calculations.fully_diluted_count
          - state_machines.SafeNote.NEGOTIATING_to_OUTSTANDING
          - entities.CapTable.fields.fully_diluted_shares
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — each OUTSTANDING note's
          as-converted shares are FLOORED per-note BEFORE summing into
          fully_diluted_shares ("round per item then sum"), not summed-then-
          floored. floor(1000000/300)+floor(1000000/300) = 3333+3333 = 6666,
          NOT floor(2000000/300) = 6666 only coincidentally — the scaffold pins
          per-item-then-sum. Distinct mode from the nested-min formula above.
        test_recipe:
          setup:
            - "OPEN cap table; 1,000,000 issued common (fd base 1,000,000); EFFECTIVE valuation fmv=300c; two OUTSTANDING SAFEs each principal=1,000,000c cap=300,000,000c discount=0 → each as-converts at the EFFECTIVE 300c implied price"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "FdCo", authorized_shares: 10000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Common", class_type: "COMMON", original_issue_price_cents: 100, liquidation_pref_multiple: 0 }
              as: Administrator
              captures: { common: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Founder", holder_type: "FOUNDER", email: "f@fd.com" }
              as: Administrator
              captures: { fnd: $.data.id }
            - call: "POST /share-issuances"
              payload: { cap_table_id: "${ct}", security_class_id: "${common}", shareholder_id: "${fnd}", share_count: 1000000, price_paid_cents: 100000000 }
              as: Administrator
            - call: "POST /valuations"
              payload: { cap_table_id: "${ct}", fmv_per_share_cents: 300, valuation_date: "2025-01-01T00:00:00Z", expires_at: "2025-12-31T00:00:00Z" }
              as: Administrator
              captures: { val: $.data.id }
            - call: "POST /valuations/${val}/approve"
              payload: {}
              as: BoardApprover
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Angel A", holder_type: "INVESTOR", email: "a@fd.com" }
              as: Administrator
              captures: { ang_a: $.data.id }
            - call: "POST /safe-notes"
              payload: { cap_table_id: "${ct}", shareholder_id: "${ang_a}", instrument_type: "SAFE", principal_cents: 1000000, valuation_cap_cents: 300000000, discount_pct: 0, issue_date: "2025-02-01T00:00:00Z" }
              as: Administrator
              captures: { note_a: $.data.id }
            - call: "POST /safe-notes/${note_a}/submit-terms"
              payload: {}
              as: Administrator
            - call: "POST /safe-notes/${note_a}/execute"
              payload: {}
              as: BoardApprover
            - call: "POST /safe-notes"
              payload: { cap_table_id: "${ct}", shareholder_id: "${ang_a}", instrument_type: "SAFE", principal_cents: 1000000, valuation_cap_cents: 300000000, discount_pct: 0, issue_date: "2025-02-01T00:00:00Z" }
              as: Administrator
              captures: { note_b: $.data.id }
            - call: "POST /safe-notes/${note_b}/submit-terms"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /safe-notes/${note_b}/execute"
              payload: {}
              as: BoardApprover
            - call: "GET /cap-tables/${ct}"
              payload: {}
              as: BoardApprover
              captures: { fd: $.data.fully_diluted_shares }
          assert:
            - "each note as-converts at 300c → floor(1000000/300) == 3333 per note"
            - "CapTable.${ct}.fully_diluted_shares == 1006666 (1000000 + 3333 + 3333, per-note floor then sum)"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: safe_note_revision_cycle_draft_negotiating
        grounds:
          - state_machines.SafeNote.DRAFT_to_NEGOTIATING
          - state_machines.SafeNote.NEGOTIATING_to_DRAFT
          - entities.SafeNote.fields.status
        distinguishing_aspect: |
          SafeNote has a true cycle DRAFT -> NEGOTIATING -> DRAFT (revise loop)
          before binding; the entity returns to a prior state. This non-linear
          machine belongs to SafeNote, a different entity than the OptionGrant
          branching machine below.
        test_recipe:
          setup:
            - "OPEN cap table; one DRAFT SAFE"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "CycleCo", authorized_shares: 1000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Angel", holder_type: "INVESTOR", email: "a@cy.com" }
              as: Administrator
              captures: { ang: $.data.id }
            - call: "POST /safe-notes"
              payload: { cap_table_id: "${ct}", shareholder_id: "${ang}", instrument_type: "SAFE", principal_cents: 500000, discount_pct: 0.10, issue_date: "2025-01-01T00:00:00Z" }
              as: Administrator
              captures: { note: $.data.id }
            - call: "POST /safe-notes/${note}/submit-terms"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /safe-notes/${note}/revise"
              payload: {}
              as: Administrator
              captures: { after_revise: $.data.status }
            - call: "POST /safe-notes/${note}/submit-terms"
              payload: {}
              as: Administrator
              captures: { after_resubmit: $.data.status }
          assert:
            - "SafeNote.${note}.status == DRAFT after revise (cycled back)"
            - "SafeNote.${note}.status == NEGOTIATING after resubmit (cycle re-entered)"

      - name: option_grant_branching_active_to_cancelled_vs_exercised
        grounds:
          - state_machines.OptionGrant.ACTIVE_to_CANCELLED
          - state_machines.OptionGrant.ACTIVE_to_EXERCISED
          - entities.OptionGrant.fields.status
        distinguishing_aspect: |
          OptionGrant forks from ACTIVE into divergent terminals with different
          side-effect sets: ACTIVE->CANCELLED returns share_count to the pool;
          ACTIVE->EXERCISED mints shares into the class and does NOT return them.
          Branching machine on OptionGrant, a different entity than SafeNote.
        test_recipe:
          setup:
            - "OPEN cap table; COMMON class; EFFECTIVE valuation; two pools each authorized 1000; one ACTIVE fully-vested grant of 1000 per pool (cancel branch + exercise branch)"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "BranchCo", authorized_shares: 10000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Common", class_type: "COMMON", original_issue_price_cents: 0, liquidation_pref_multiple: 0 }
              as: Administrator
              captures: { common: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Emp", holder_type: "EMPLOYEE", email: "e@br.com" }
              as: Administrator
              captures: { sh: $.data.id }
            - call: "POST /valuations"
              payload: { cap_table_id: "${ct}", fmv_per_share_cents: 200, valuation_date: "2020-01-01T00:00:00Z", expires_at: "2020-12-31T00:00:00Z" }
              as: Administrator
              captures: { val: $.data.id }
            - call: "POST /valuations/${val}/approve"
              payload: {}
              as: BoardApprover
            - call: "POST /option-pools"
              payload: { cap_table_id: "${ct}", authorized_shares: 1000 }
              as: Administrator
              captures: { pool_c: $.data.id }
            - call: "POST /option-grants"
              payload: { cap_table_id: "${ct}", option_pool_id: "${pool_c}", shareholder_id: "${sh}", security_class_id: "${common}", valuation_id: "${val}", share_count: 1000, strike_price_cents: 200, grant_date: "2020-01-01T00:00:00Z", vesting_months: 48, cliff_months: 12, vesting_style: "GRADED" }
              as: Administrator
              captures: { g_cancel: $.data.id }
            - call: "POST /option-grants/${g_cancel}/approve"
              payload: {}
              as: BoardApprover
              as_user_id: "approver-1"
            - call: "POST /option-pools"
              payload: { cap_table_id: "${ct}", authorized_shares: 1000 }
              as: Administrator
              captures: { pool_e: $.data.id }
            - call: "POST /option-grants"
              payload: { cap_table_id: "${ct}", option_pool_id: "${pool_e}", shareholder_id: "${sh}", security_class_id: "${common}", valuation_id: "${val}", share_count: 1000, strike_price_cents: 200, grant_date: "2020-01-01T00:00:00Z", vesting_months: 48, cliff_months: 12, vesting_style: "GRADED" }
              as: Administrator
              captures: { g_exer: $.data.id }
            - call: "POST /option-grants/${g_exer}/approve"
              payload: {}
              as: BoardApprover
              as_user_id: "approver-1"
            - call: "POST /exercises"
              payload: { cap_table_id: "${ct}", option_grant_id: "${g_exer}", share_count: 1000 }
              as: Administrator
              captures: { ex: $.data.id }
          trigger:
            - call: "POST /option-grants/${g_cancel}/cancel"
              payload: {}
              as: Administrator
              captures: { cancel_status: $.data.status }
            - call: "POST /exercises/${ex}/settle"
              payload: {}
              as: Administrator
            - call: "GET /option-grants/${g_exer}"
              payload: {}
              as: Administrator
              captures: { exer_status: $.data.status }
          assert:
            - "OptionGrant.${g_cancel}.status == CANCELLED; OptionPool.${pool_c}.available_shares == 1000 (returned)"
            - "OptionGrant.${g_exer}.status == EXERCISED; OptionPool.${pool_e}.available_shares == 0 (NOT returned)"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: exercise_settle_depth3_grant_class_table
        grounds:
          - state_machines.Exercise.PENDING_to_SETTLED
          - entities.SecurityClass.fields.shares_outstanding
          - entities.CapTable.fields.issued_shares
        distinguishing_aspect: |
          Depth-3 cascade from a SINGLE trigger (settle): (1) settle bumps
          grant.exercised_shares, which (2) causes SecurityClass.shares_outstanding
          to rise, which (3) causes CapTable.issued_shares to recompute. Each
          link is caused by the prior link, not by the settle directly. Origin
          transition is Exercise PENDING->SETTLED.
        test_recipe:
          setup:
            - "OPEN cap table; COMMON class shares_outstanding=0; EFFECTIVE valuation; ACTIVE fully-vested grant 1000 strike=100; one PENDING exercise of 1000"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "CascadeCo", authorized_shares: 10000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /security-classes"
