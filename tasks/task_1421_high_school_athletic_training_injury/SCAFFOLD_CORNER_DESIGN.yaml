            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: ARM_HAND, injury_type: SPRAIN, severity: MINOR, mechanism: "swing", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: false }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "GET /rtp-protocols/${rtp}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st: $.data.current_stage, hist: $.data.stage_history } }
          assert:
