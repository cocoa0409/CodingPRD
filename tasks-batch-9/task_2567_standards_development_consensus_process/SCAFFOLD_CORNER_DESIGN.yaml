              payload: { membership_id: "${m1}", position: "AFFIRMATIVE" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { v1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m2}", position: "AFFIRMATIVE" }
              as: CommitteeMember
              as_user_id: "${p2}"
              captures: { v2: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m3}", position: "NEGATIVE", comment_text: "Clause 12 torque ceiling is unsafe", clause_reference: "12" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { v3: $.data.id }
            - call: "POST /sdo/ballots/${b1}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${p1}"
          trigger:
            - call: "PATCH /sdo/memberships/${m2}"
              payload: { status: "SUSPENDED" }
              as: StandardsStaff
            - call: "PATCH /sdo/memberships/${m2}"
              payload: { status: "ACTIVE" }
              as: StandardsStaff
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/votes/${v3}/adjudicate"
              payload: { resolution: "NON_PERSUASIVE", adjudication_rationale: "The ceiling matches the referenced test method" }
              as: CommitteeChair
              as_user_id: "${p1}"
          assert:
            - 'after the suspension: TechnicalCommittee.${c1}.status == SUSPENDED and balance_status == UNBALANCED'
            - 'after the suspension: WorkItem.${w1}.consensus_gate == BLOCKED (two blockers: draft and committee)'
            - 'after the restoration: TechnicalCommittee.${c1}.balance_status == BALANCED but status == SUSPENDED'
            - 'after the restoration: WorkItem.${w1}.consensus_gate == BLOCKED'
            - 'after the re-activation: TechnicalCommittee.${c1}.status == ACTIVE'
            - 'after the re-activation: WorkItem.${w1}.consensus_gate == BLOCKED (the COMMENT_RESOLUTION draft still holds it)'
            - 'after the re-activation: WorkItem.${w1}.unresolved_negative_count == 1'
            - 'after the adjudication: Draft.${d1}.status == PUBLIC_REVIEW_READY'
            - 'after the adjudication: WorkItem.${w1}.unresolved_negative_count == 0'
            - 'after the adjudication: WorkItem.${w1}.consensus_gate == OPEN'

      - name: a_rand_commitment_lifts_the_block_without_granting_clearance
        claim_type: aggregation
        grounds:
          - calculations.patent_clearance_evaluation
          - state_machines[WorkItem].IP_BLOCKED_to_IP_DISCLOSED
          - endpoints[POST /sdo/patent-disclosures/{patentDisclosureId}/commitment]
        distinguishing_aspect: "ip_status is an any-blocking aggregate over every disclosure plus the call-for-patents latch: a NON_ESSENTIAL disclosure never blocks (IP_DISCLOSED), a later ESSENTIAL one with no commitment does (IP_BLOCKED), and a RAND commitment on it returns the work item to IP_DISCLOSED — not IP_CLEARED — because progress_status is still IN_DEVELOPMENT so the call for patents has not closed."
        test_recipe:
          setup:
            - "Three participants on distinct employer codes in three distinct interest categories (PRODUCER/ACME, USER/CITYW, GENERAL_INTEREST/SAFEL)."
            - "Committee TC-14 chaired by the PRODUCER with all three appointed as voting members, activated so balance_status is BALANCED."
            - "Work item STD-1400 scope-approved onto TC-14 and carrying revision-1 draft d1 of 40 clauses."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "Work item STD-1400 is IN_DEVELOPMENT with ip_status IP_PENDING and no disclosures on file."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
