  - rule_id: transitive_cascade
    instances:

      - name: remittance_acceptance_cascades_membership_team_league_match
        grounds:
          - state_machines.FeeRemittance.SUBMITTED_to_ACCEPTED
          - state_machines.Membership.PENDING_REMITTANCE_to_SANCTIONED
          - state_machines.Team.PROVISIONAL_to_CONFIRMED
          - state_machines.League.BYLAWS_ADOPTED_to_SANCTIONED
          - state_machines.Match.DRAFT_to_SCHEDULED
          - entities.League.fields.confirmed_team_count
        distinguishing_aspect: |
          One POST /fee-remittances/{id}/national-decision propagates four entity types deep -
          FeeRemittance -> Membership (hop 1) -> Team (hop 2) -> League (hop 3) -> Match (hop 4)
          - and the terminal hop is only reached because confirmed_team_count arrives at
          declared_team_count 2 inside the same request.
        test_recipe:
          setup:
            - "One league on CONFIG-B with two teams, four adult memberships and a two-week schedule whose matches are still DRAFT."
            - "The remittance listing all four memberships is SUBMITTED with declared_amount_cents 12400; every membership is PENDING_REMITTANCE, both teams PROVISIONAL, the league BYLAWS_ADOPTED."
            - "Member.national_member_number is null on all six members."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
            - call: "POST /members"
