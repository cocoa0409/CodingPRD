            - { call: "POST /locker/animals/${anB}/receive", payload: { tag_id: "TAG-B", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${anB}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${anB}/weigh", payload: { hanging_weight_lbs: 201.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${anB}/shares", payload: { owner_customer_id: "${cB}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${cB}", captures: { sB: $.data.id } }
            - { call: "POST /locker/animals/${anB}/shares/finalize", payload: {}, as: PlantOperator }
          trigger:
            - { call: "GET /locker/invoices", payload: { share_id: "${sA}" }, as: PlantOperator, captures: { procA: "$.data[0].processing_fee_cents" } }
            - { call: "GET /locker/invoices", payload: { share_id: "${sB}" }, as: PlantOperator, captures: { procB: "$.data[0].processing_fee_cents" } }
          assert:
            - "invoice A processing_fee_cents == 17000 (200 * 85, entirely in tier 1)"
            - "invoice B processing_fee_cents == 17075 (17000 + 1.0 * 75; marginal rate applies only above 200)"

      - name: cancel_refund_window_boundary
        claim_type: correct_result
        grounds: [calculations.cancel_refund_policy]
        distinguishing_aspect: "Cancellation exactly 7 days before the appointment refunds the full deposit; 6 days before forfeits it entirely."
        test_recipe:
          setup: ["c1, c2 ACTIVE; CapacityDay 2026-08-20 cap 2; two confirmed BEEF head 1 appointments (A for c1, B for c2, 15000 each)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { cA: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { cB: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${cA}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${cA}", captures: { apptA: $.data.id } }
            - { call: "POST /locker/appointments/${apptA}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${cA}" }
            - { call: "POST /locker/appointments", payload: { customer_id: "${cB}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${cB}", captures: { apptB: $.data.id } }
            - { call: "POST /locker/appointments/${apptB}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${cB}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/appointments/${apptA}/cancel", payload: {}, as: Customer, as_user_id: "${cA}", captures: { refA: $.data.refund_cents, stA: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/appointments/${apptB}/cancel", payload: {}, as: Customer, as_user_id: "${cB}", captures: { refB: $.data.refund_cents, stB: $.data.status } }
          assert:
            - "A cancelled 7 days out: refund_cents == 15000 (full), status CANCELLED"
            - "B cancelled 6 days out: refund_cents == 0 (forfeited), status CANCELLED"
            - "both cancellations void their EXPECTED animals and release 1 head each (day booked_head back to 0)"

      - name: provisional_estimate_weight_formula
        claim_type: variant_selection
        grounds: [calculations.invoice_settlement]
        excluded_because:
          difficulty_instance: invoice_provisional_vs_final_settlement
          rationale: "Provisional vs final variant computation and the estimate formula (live 1200 * 0.62 * 0.5) are asserted with literals there."

