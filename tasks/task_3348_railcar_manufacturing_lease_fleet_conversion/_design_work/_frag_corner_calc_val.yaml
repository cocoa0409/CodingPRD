            - "Substitutes WS-220 WHEELSET cost 18000 and CS-220 CASTING cost 40000 each carry on_hand_qty 100, so the priority-13 substitute-stock test passes for a 5-car order."
            - "SOLD order of 5 cars, planned_shop_days 5, horizon 2026-09-01..2026-10-01 == 30 days >= worst_lead max(ceil(30/4), ceil(45/2)) == 23."
