      - name: return_quantity_cumulative_exceeded
        claim_type: aggregate_validation
        grounds: ["errors[ERR_RETURN_QUANTITY_EXCEEDED]"]
        distinguishing_aspect: "Two partial returns of 2 on a 3-unit line each pass; the third return of 1 is rejected because the CUMULATIVE count (4 > 3) exceeds the line quantity."
        test_recipe:
