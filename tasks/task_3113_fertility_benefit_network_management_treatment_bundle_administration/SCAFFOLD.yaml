  - method: POST
    path: "/pathway-requests/{id}/activate"
    description: "Activate an approved pathway"
    roles: [CareAdvocate]
    code: 200
    input: []
    output: PathwayRequest
    side_effects: ["pathway_status APPROVED -> ACTIVE; Member.pathway_selected recomputed; version incremented"]

  - method: POST
    path: "/pathway-requests/{id}/complete"
    description: "Complete an active pathway"
    roles: [CareAdvocate]
    code: 200
    input: []
    output: PathwayRequest
    side_effects: ["pathway_status ACTIVE -> COMPLETED; Member.pathway_selected recomputed; version incremented"]

  - method: POST
    path: "/pathway-requests/{id}/withdraw"
    description: "Withdraw a pathway request"
    roles: [CareAdvocate]
    code: 200
    input: []
    output: PathwayRequest
    side_effects: ["pathway_status -> WITHDRAWN (from DRAFT, CLINICAL_REVIEW, APPROVED or ACTIVE); Member.pathway_selected recomputed; version incremented"]

  # --- Claim ---------------------------------------------------------------
  - method: POST
    path: "/claims"
    description: "Submit a claim against a bundle component"
    roles: [ClinicCoordinator, ClaimsProcessor, SpecialtyPharmacist]
    code: 201
    input: [member_id, preauthorization_id, "treatment_cycle_id?", service_category, billed_cents, service_date_iso]
    output: Claim
    side_effects:
      - "claim_status=RECEIVED; allowed_cents=0; adjudication_basis=null; pended_reason=null"
      - "member_cost_share_cents set to the PROVISIONAL variant reading"
      - "member_accumulator_before_cents computed; member_accumulator_after_cents left at the before value"

  - method: GET
    path: "/claims/{id}"
    description: "Read one claim"
    roles: [ClaimsProcessor, ClaimsReviewer, CareAdvocate, Member, ClinicCoordinator, NetworkManager]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims"
    roles: [ClaimsProcessor, ClaimsReviewer, CareAdvocate, ClinicCoordinator, NetworkManager, PlanAdministrator]
    code: 200
    input: ["member_id?", "preauthorization_id?", "treatment_cycle_id?", "service_category?", "claim_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/adjudicate"
    description: "Adjudicate a claim against its authorization's bundle components"
    roles: [ClaimsProcessor]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim_status -> ADJUDICATED"
      - "allowed_cents computed via claim_allowed_amount; adjudication_basis set"
      - "member_cost_share_cents recomputed with the FINAL variant"
      - "plan_paid_cents = allowed_cents - member_cost_share_cents"
      - "member_accumulator_after_cents = member_accumulator_before_cents + member_cost_share_cents"
      - "version incremented"

  - method: POST
    path: "/claims/{id}/deny"
    description: "Deny a claim whose authorization window has closed"
    roles: [ClaimsProcessor]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_status -> DENIED; plan_paid_cents and member_cost_share_cents recomputed to 0; version incremented"]

  - method: POST
    path: "/claims/{id}/pay"
    description: "Pay an adjudicated claim, pinning the authorization version it is drawn against"
    roles: [ClaimsProcessor]
    code: 200
    input: [expected_preauthorization_version]
    output: Claim
    side_effects:
      - "claim_status -> PAID"
      - "BundleEntitlement.pharmacy_consumed_cents and pharmacy_remaining_cents recomputed when service_category is MEDICATION"
      - "Preauthorization.version incremented; version incremented"

  - method: POST
    path: "/claims/{id}/appeal"
    description: "Appeal a denied claim"
    roles: [CareAdvocate]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_status DENIED -> APPEALED; version incremented"]

  - method: POST
    path: "/claims/{id}/appeal-decide"
    description: "Decide an appeal, requiring a reviewer different from the last adjudicator"
    roles: [ClaimsReviewer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim_status APPEALED -> ADJUDICATED"
      - "allowed_cents, member_cost_share_cents and plan_paid_cents recomputed with the FINAL variants"
      - "version incremented"

  - method: POST
    path: "/claims/{id}/reverse"
    description: "Reverse a paid claim inside its reversal window"
    roles: [ClaimsProcessor]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim_status PAID -> REVERSED"
      - "member_accumulator_after_cents reset to member_accumulator_before_cents"
      - "TreatmentCycle.consumption_marker -> UNCONSUMED; Preauthorization.consumed_cycles decremented and consumption_status recomputed"
      - "BundleEntitlement cycle counters and pharmacy counters recomputed; version incremented"

  # --- OutcomeRecord -------------------------------------------------------
  - method: GET
    path: "/outcome-records/{id}"
    description: "Read one outcome record"
    roles: [NetworkManager, ClinicalReviewer, ClinicCoordinator, PlanAdministrator]
    code: 200
    input: []
    output: OutcomeRecord
    side_effects: []

  - method: GET
    path: "/outcome-records"
    description: "List outcome records"
    roles: [NetworkManager, ClinicalReviewer, ClinicCoordinator, PlanAdministrator, CareAdvocate]
    code: 200
    input: ["clinic_id?", "treatment_cycle_id?", "member_id?", "outcome_status?", "limit?", "offset?"]
    output: OutcomeRecord[]
    side_effects: []

  - method: POST
    path: "/outcome-records/{id}/amend"
    description: "Amend a recorded outcome inside the amendment window"
    roles: [NetworkManager]
    code: 200
    input: [live_birth, births_count, multiple_birth, gestational_weeks, amendment_reason]
    output: OutcomeRecord
    side_effects:
      - "outcome_status -> AMENDED; amendment_reason set"
      - "Clinic.cycles_reported and derived quality rates recomputed in place at the amended values"
      - "Member.live_births_recorded recomputed"
      - "Clinic posture may move PROBATION -> CONTRACTED; version incremented"

  - method: POST
    path: "/outcome-records/{id}/void"
    description: "Void an outcome record that no paid claim depends on"
    roles: [NetworkManager]
    code: 200
    input: [void_reason]
    output: OutcomeRecord
    side_effects:
      - "outcome_status -> VOIDED (terminal)"
      - "Clinic.cycles_reported recomputed excluding this record; derived rates recomputed"
      - "Member.live_births_recorded recomputed; version incremented"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header absent or not one of the roles declared in §1.7" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the calling role is not permitted for this operation" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "the caller's X-User-ID equals the decision_actor already recorded for this resource, violating the segregation-of-duties rule at priority 5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a foreign key supplied in the request body does not resolve to an existing row" }
  - { id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "the employer-account id in the path does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "the member id in the path does not resolve" }
  - { id: ERR_ADVOCATE_NOT_FOUND, http: 404, condition: "the care-advocate id in the path does not resolve" }
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "the clinic id in the path does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "the clinic-contract id in the path does not resolve" }
  - { id: ERR_BUNDLE_NOT_FOUND, http: 404, condition: "the bundle-entitlement id in the path does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "the treatment-plan id in the path does not resolve" }
  - { id: ERR_PREAUTH_NOT_FOUND, http: 404, condition: "the pre-authorization id in the path does not resolve" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "the treatment-cycle id in the path does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "the claim id in the path does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required input field is missing, a value falls outside its declared enum, or an interval end precedes its start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state from which the requested transition is declared, including any transition attempted from a terminal state" }
  - { id: ERR_DUPLICATE_OPERATION, http: 409, condition: "the idempotency-protected operation has already been carried out for this resource — a second outcome record for one cycle, a second decision on one authorization, a second amendment of one outcome record" }
  - { id: ERR_NO_ADVOCATE_CANDIDATE, http: 422, condition: "the advocate selector's eligibility filter yields an empty candidate set" }
  - { id: ERR_ADVOCATE_CREDENTIAL_LAPSED, http: 422, condition: "the assigned care advocate's credential has expired at the logical clock, or the advocate has reached caseload_limit" }
  - { id: ERR_CLINIC_NOT_CONTRACTED, http: 422, condition: "the selected clinic is not CONTRACTED, has no contract covering the logical clock, or has no negotiated rate for the member's bundle type" }
  - { id: ERR_CLINIC_CONTRACT_FROZEN, http: 422, condition: "the clinic's active contract is FROZEN by a quality breach at the instant the covered service is authorized" }
  - { id: ERR_BENEFIT_INACTIVE, http: 422, condition: "the employer account sponsoring the resource is SUSPENDED, or the bundle entitlement is not ACTIVE" }
  - { id: ERR_BUNDLE_EXHAUSTED, http: 422, condition: "the bundle's cycle allowance and pharmacy pool are both exhausted, either before the request or in consequence of it" }
  - { id: ERR_NO_REMAINING_ALLOWANCE, http: 422, condition: "the requested action exceeds the carried allowance of its bundle — plan cycle allowance, life-path route allowance, or specialty-pharmacy pool" }
  - { id: ERR_CLINICAL_CRITERIA_NOT_MET, http: 422, condition: "clinical_criteria_score is below the approval floor of 70 at the exact boundary" }
  - { id: ERR_SEQUENCE_OUT_OF_ORDER, http: 422, condition: "the cycle's sequence index is not greater than the largest existing cycle index for the plan, or a cycle attempts an out-of-order retrieval while an earlier cycle is still live" }
  - { id: ERR_SURRENDER_ROUTE_CONFLICT, http: 409, condition: "the requested surrender route's carrier kind disagrees with an overlapping route already on file for this member" }
  - { id: ERR_CYCLE_SLOT_OVERLAP, http: 409, condition: "the requested cycle's stimulation interval is less than the plan's configured minimum inter-cycle spacing after the prior cycle's transfer instant" }
  - { id: ERR_PREAUTH_WINDOW_OUTSIDE_COVERAGE, http: 422, condition: "the authorization window derived at approval would extend past the end of the clinic contract's coverage" }
  - { id: ERR_BUNDLE_PRICE_UNPINNED, http: 422, condition: "the bundle price for the member's bundle type has not been pinned because no active contract rate applies" }
  - { id: ERR_PHARMACY_POOL_EXHAUSTED, http: 422, condition: "the bundle's specialty-pharmacy pool has no remaining cents, and the order declares specialty_drug true" }
  - { id: ERR_REVERSAL_WINDOW_CLOSED, http: 422, condition: "the paid claim is outside its reversal window" }
  - { id: ERR_AMENDMENT_WINDOW_CLOSED, http: 422, condition: "the outcome record is outside its amendment window" }
  - { id: ERR_DONOR_AGENCY_REQUIRED, http: 400, condition: "a DONOR_EGG or DONOR_SPERM pathway request is filed without donor_agency_ref" }
  - { id: ERR_SURROGACY_CARRIER_REQUIRED, http: 400, condition: "a SURROGACY pathway request is filed without gestational_carrier_ref" }
  - { id: ERR_PLAN_VERSION_STALE, http: 412, condition: "expected_treatment_plan_version does not match the current TreatmentPlan.version" }
  - { id: ERR_PREAUTH_VERSION_STALE, http: 412, condition: "expected_preauthorization_version does not match the current Preauthorization.version" }
  - { id: ERR_CYCLE_VERSION_STALE, http: 412, condition: "expected_treatment_cycle_version does not match the current TreatmentCycle.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Member
    description: "The employee whose fertility benefit is being administered; reads own resources only"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET /members/{id}"
      - "GET /treatment-plans/{id}"
      - "GET /preauthorizations/{id}"
      - "GET /claims/{id}"
      - "GET /medication-orders/{id}"
      - "GET /pathway-requests/{id}"
      - "GET /treatment-cycles/{id}"
      - "GET /members/{id}/surrender-routes"
      - "GET /care-advocates"
      - "GET /care-advocates/{id}"
      - "GET /surrender-routes"

  - name: CareAdvocate
    description: "Guides a member through intake, clinic selection and treatment planning; owns plan creation and pathway filing"
    identity: "entity_backed:CareAdvocate"
    exclusive_operations:
      - "POST /treatment-plans"
      - "POST /treatment-plans/{id}/select-clinic"
      - "POST /treatment-plans/{id}/preauthorizations"
      - "POST /treatment-plans/{id}/resubmit-plan"
      - "POST /treatment-plans/{id}/abandon"
      - "POST /preauthorizations/{id}/revise-request"
      - "POST /pathway-requests"
      - "POST /pathway-requests/{id}/activate"
      - "POST /pathway-requests/{id}/complete"
      - "POST /pathway-requests/{id}/withdraw"
      - "POST /claims/{id}/appeal"
      - "POST /members/{id}/select-clinic"
      - "POST /members/{id}/surrender-routes"
    shared_operations:
      - "POST /members"
      - "POST /members/{id}/complete-intake"
      - "POST /members/{id}/complete-care"
      - "POST /medication-orders"

  - name: ClinicalReviewer
    description: "Renders clinical appropriateness decisions on authorizations and pathway requests"
    identity: "opaque"
    exclusive_operations:
      - "POST /preauthorizations/{id}/begin-clinical-review"
      - "POST /preauthorizations/{id}/decide"
      - "POST /pathway-requests/{id}/begin-clinical-review"
      - "POST /pathway-requests/{id}/decide"
    shared_operations:
      - "GET /members"
      - "GET /members/{id}"
      - "GET /preauthorizations"
      - "GET /preauthorizations/{id}"
      - "GET /pathway-requests/{id}"
      - "GET /clinics"
      - "GET /clinics/{id}"
      - "GET /bundle-entitlements/{id}"
      - "GET /bundle-entitlements"

  - name: ClinicCoordinator
    description: "Clinical operations staff at a contracted clinic; drives cycle progression and reports outcomes"
    identity: "entity_backed:Clinic"
    exclusive_operations:
      - "POST /treatment-plans/{id}/treatment-cycles"
      - "POST /treatment-cycles/{id}/start-stimulation"
      - "POST /treatment-cycles/{id}/record-retrieval"
      - "POST /treatment-cycles/{id}/record-fertilization"
      - "POST /treatment-cycles/{id}/record-transfer"
      - "POST /treatment-cycles/{id}/record-outcome"
      - "POST /treatment-cycles/{id}/cancel"
      - "POST /clinics/{id}/report-outcome"
      - "POST /claims"
    shared_operations:
      - "GET /treatment-cycles"
      - "GET /treatment-cycles/{id}"
      - "GET /outcome-records"
      - "GET /clinics"
      - "GET /members/{id}"

  - name: SpecialtyPharmacist
    description: "Dispenses fertility medications from the specialty pharmacy network"
    identity: "opaque"
    exclusive_operations:
      - "POST /medication-orders/{id}/dispense"
      - "POST /medication-orders/{id}/ship"
      - "POST /medication-orders/{id}/deliver"
      - "POST /medication-orders/{id}/cancel"
    shared_operations:
      - "POST /medication-orders"
      - "POST /claims"
      - "GET /medication-orders"
      - "GET /medication-orders/{id}"
      - "GET /preauthorizations/{id}"
      - "GET /bundle-entitlements/{id}"

  - name: ClaimsProcessor
    description: "Adjudicates, pays, denies and reverses claims against bundle components"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/adjudicate"
      - "POST /claims/{id}/deny"
      - "POST /claims/{id}/pay"
      - "POST /claims/{id}/reverse"
    shared_operations:
      - "POST /claims"
      - "GET /claims"
      - "GET /claims/{id}"
      - "GET /clinic-contracts"
      - "GET /bundle-entitlements"
      - "GET /bundle-entitlements/{id}"

  - name: ClaimsReviewer
    description: "Decides claim appeals; must differ from the original adjudicator"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/appeal-decide"
    shared_operations:
      - "GET /claims"
      - "GET /claims/{id}"

  - name: NetworkManager
    description: "Contracts clinics, curates the network on quality data, and administers advocate availability"
    identity: "opaque"
    exclusive_operations:
      - "POST /clinics"
      - "POST /clinics/{id}/contracts"
      - "POST /clinic-contracts/{id}/activate"
      - "POST /clinic-contracts/{id}/terminate"
      - "POST /clinics/{id}/suspend"
      - "POST /clinics/{id}/terminate"
      - "POST /clinics/{id}/quality-recompute"
      - "POST /outcome-records/{id}/amend"
      - "POST /outcome-records/{id}/void"
    shared_operations:
      - "POST /members/{id}/assign-advocate"
      - "GET /clinics"
      - "GET /clinics/{id}"
      - "GET /clinic-contracts"
      - "GET /clinic-contracts/{id}"
      - "GET /outcome-records"
      - "GET /outcome-records/{id}"
      - "GET /care-advocates"

  - name: PlanAdministrator
    description: "Designs employer benefit bundles and administers accounts and advocates"
    identity: "opaque"
    exclusive_operations:
      - "POST /employer-accounts"
      - "POST /employer-accounts/{id}/suspend"
      - "POST /employer-accounts/{id}/reactivate"
      - "POST /bundle-entitlements"
      - "POST /bundle-entitlements/{id}/activate"
      - "POST /bundle-entitlements/{id}/reinstate"
      - "POST /care-advocates"
    shared_operations:
      - "POST /members"
      - "POST /members/{id}/assign-advocate"
      - "POST /members/{id}/complete-intake"
      - "POST /members/{id}/complete-care"
      - "GET /employer-accounts"
      - "GET /employer-accounts/{id}"
      - "GET /bundle-entitlements"
      - "GET /treatment-plans"