              captures: { t_peak: $.data.peak_case_load, t_delivery_cases: $.data.planned_delivery_cases, t_service: $.data.planned_service_minutes, t_drive: $.data.planned_drive_minutes, t_break: $.data.planned_break_minutes, t_duty: $.data.planned_duty_minutes, t_total_miles: $.data.total_miles, t_loaded: $.data.loaded_miles, t_empty: $.data.empty_miles, t_end: $.data.planned_end_at }
