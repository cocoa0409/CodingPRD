            - "After reversing ${a2}: status == REVERSED, ChickBatch.${cb1}.unassigned_chicks == 4262, GrowerPlacementOrder.${o2}.allocated_chicks == 0, remaining_need == 4250, status == CONFIRMED"
            - "Conservation after the reversal: 9262 == 4262 + 5000 (REVERSED assignments are excluded from the assigned sum)"
            - "Re-run allocation: only ${o2} is eligible (${o1} is FULFILLED) and DeliveryAssignment.${a3} grants exactly 4200 again (42 whole boxes), NOT 4250 and NOT 4262"
            - "ChickBatch.${cb1}.unassigned_chicks is back to 62; conservation 9262 == 62 + 5000 + 4200 with no drift"
