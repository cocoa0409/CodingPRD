            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:01:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:02:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f2: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:03:00Z" }
