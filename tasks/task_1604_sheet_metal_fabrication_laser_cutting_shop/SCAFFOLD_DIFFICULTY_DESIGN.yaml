              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 100, bbox_height_mm: 100, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "ANODIZING", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /fab/orders/${order_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "GET /fab/orders/${order_id}/routing-steps"
              payload: {}
              as: ProductionPlanner
              captures: { laser_step: "$.data[0].id" }
            - call: "POST /fab/routing-steps/${laser_step}/complete"
              payload: {}
              as: MachineOperator
            - call: "POST /fab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T23:59:59Z" }
              as: ShopManager
          trigger:
            - call: "POST /fab/orders/${order_id}/receive-outside"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /fab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: ShopManager
            - call: "POST /fab/orders/${order_id}/receive-outside"
              payload: {}
              as: ProductionPlanner
          assert:
            - "at due-1s: ERR_VENDOR_LEAD_TIME_NOT_ELAPSED"
            - "at exactly due_date: receive succeeds (inclusive >= boundary)"
            - "FabricationOrder.${order_id}.status == INSPECTION"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: scrap_credit_post_then_void_conserves_balance
        grounds:
          - calculations.scrap_credit_posting
          - state_machines.ScrapCredit.POSTED_to_VOID
          - concurrency_rules[credit-void-stale-customer]
        distinguishing_aspect: |
          Conserved quantity = Customer.scrap_credit_balance_cents: posting a
          credit (+N) followed by voiding it (-N) returns the balance to its
          exact prior value; the void also increments Customer.version (OCC)
          without perturbing the invariant.
        test_recipe:
          setup:
            - "Customer balance B0 = 0; one drop-off sheet posted for +58"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-TI", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Sigma", email: "s@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
              captures: { sheet_id: $.data.id }
            - call: "POST /fab/scrap-credits"
              payload: { customer_id: "${cust_id}", sheet_stock_id: "${sheet_id}" }
              as: InventoryClerk
              captures: { credit_id: $.data.id, posted_amt: $.data.credit_cents }
            - call: "GET /fab/customers/${cust_id}"
              payload: {}
              as: ShopManager
              captures: { bal_after_post: $.data.scrap_credit_balance_cents, cust_v: $.data.version }
          trigger:
            - call: "POST /fab/scrap-credits/${credit_id}/void"
              payload: { expected_customer_version: "${cust_v}" }
              as: ShopManager
              captures: { void_status: $.data.status }
            - call: "GET /fab/customers/${cust_id}"
              payload: {}
              as: ShopManager
              captures: { bal_after_void: $.data.scrap_credit_balance_cents }
          assert:
            - "balance after post == 58; balance after void == 0 (B0 restored exactly)"
            - "ScrapCredit.${credit_id}.status == VOID"
            - "Customer.version incremented by each balance mutation (post +1 from credit cascade, void +1)"

      - name: order_cancel_restores_stock_and_releases_capacity
        grounds:
          - state_machines.FabricationOrder.NESTED_to_CANCELLED
          - calculations.capacity_booking
        distinguishing_aspect: |
          Conserved quantity = AVAILABLE stock area per grade+thickness and
          machine booked minutes: accept consumes a sheet and books minutes;
          cancelling the NESTED order restores the parent sheet to AVAILABLE
          and scraps the generated remnant, returning total available area and
          booked minutes to their pre-accept values (distinct conserved
          quantities from the credit-balance instance).
        test_recipe:
          setup:
            - "Exactly one full sheet; quote accepted (sheet consumed, remnant created, laser minutes booked); order still NESTED"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-TJ", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Tau", email: "tau@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
              captures: { sheet_id: $.data.id }
            - call: "POST /fab/machines"
              payload: { name: "L11", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 300, bbox_height_mm: 200, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 10 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /fab/orders/${order_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - call: "GET /fab/sheet-stock/${sheet_id}"
              payload: {}
              as: InventoryClerk
              captures: { sheet_status: $.data.status }
            - call: "GET /fab/sheet-stock"
              payload: { source_order_id: "${order_id}" }
              as: InventoryClerk
              captures: { remnant_status: "$.data[0].status" }
            - call: "GET /fab/orders/${order_id}/routing-steps"
              payload: {}
              as: ProductionPlanner
              captures: { step_statuses: "$.data[0].status" }
          assert:
            - "SheetStock.${sheet_id}.status == AVAILABLE (parent restored)"
            - "generated REMNANT row status == SCRAPPED (not returned to pool)"
            - "RoutingStep rows for the order are removed or in terminal SKIPPED with minutes released (subsequent Tiny-capacity order would succeed)"
            - "FabricationOrder.${order_id}.committed_total_cents == 0 and status == CANCELLED"
