          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Baseline CA state rule and PS-A spec."
            - "NovaPen MANUFACTURER program NPD-2026: funding_ceiling_cents 500000, per_kit_allowance_cents 6000, so available_cents starts at 500000 with an empty ledger."
            - "Dana Reyes ENROLLED with a 30-day / 5-kit ACTIVE enrollment."
            - "Kit 1 issued (ONE_QUART, provisional_cost_cents 1465), left in ISSUED and never acknowledged, so exactly one RESERVATION of +1465 exists and available_cents is 498535."
