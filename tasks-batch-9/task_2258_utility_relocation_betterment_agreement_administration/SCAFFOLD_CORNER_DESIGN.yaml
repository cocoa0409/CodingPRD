          setup: ["Two conflicts on two facilities of one project; conflict B declares depends_on_conflict_id = conflict A. Both have a resolution selected; A is a RELOCATE left at RESOLUTION_SELECTED, B is a PROTECT_IN_PLACE ready to certify."]
