# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over SCAFFOLD.yaml sections 1.1-1.7 per the claim-extraction
# guide. Instances already exercised by section 1.8 appear as
# excluded_because stubs. All chains replay from empty-DB via section 1.5
# endpoints; logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: building_create_applies_config_defaults
        claim_type: defaults
        grounds: ['entities.Building.fields.audit_retention_days', 'entities.Building.fields.ops_run_index']
        distinguishing_aspect: "Omitting every optional config field yields the declared defaults and system initializers."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Defaults Hall" }
              as: SecurityAdmin
              captures: { b: $.data.id }
          trigger:
            - call: "GET /buildings/${b}"
              as: SecurityAdmin
          assert:
            - "audit_retention_days == 90, alert_escalation_minutes == 30, vendor_badge_pool_max == 10, default_propped_threshold_seconds == 120"
            - "base_fee_cents == 15000, per_door_fee_cents == 7500, per_key_reissue_fee_cents == 2500, emergency_surcharge_pct == 20"
            - "business_open_utc == '08:00', business_close_utc == '18:00', ops_run_index == 0, version == 1"

      - name: door_create_inherits_building_propped_threshold
        claim_type: defaults
        grounds: ['entities.Door.fields.propped_threshold_seconds', 'entities.Building.fields.default_propped_threshold_seconds']
        distinguishing_aspect: "A door created without propped_threshold_seconds copies the building default (150); one created with an explicit value keeps it."
        test_recipe:
          setup: ["Building B with default_propped_threshold_seconds 150; hierarchy M -> C1"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Inherit House", default_propped_threshold_seconds: 150 }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-A", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { da: $.data.id, da_thr: $.data.propped_threshold_seconds }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-B", key_node_id: "${c1}", propped_threshold_seconds: 45 }
              as: SecurityAdmin
              captures: { db_thr: $.data.propped_threshold_seconds }
          assert:
            - "da_thr == 150 (inherited from building default)"
            - "db_thr == 45 (explicit override wins)"
            - "Door.${da}.hardware_status == OPERATIONAL and core_status == ACTIVE and open_since == null (initial state)"

      - name: resident_missing_unit_label_returns_invalid_request
        claim_type: required_fields
        grounds: ['entities.Person.fields.unit_label', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "unit_label is conditionally required iff kind == RESIDENT; omitting it fails creation."
        test_recipe:
          setup: ["Building B exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Required House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
          trigger:
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "No Unit", kind: "RESIDENT" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: credential_duplicate_serial_rejected
        claim_type: type_constraints
        grounds: ['entities.Credential.fields.serial_no', 'errors[ERR_SERIAL_EXISTS]']
        distinguishing_aspect: "serial_no is unique per building; the second create with the same serial fails while a different serial succeeds."
        test_recipe:
          setup: ["Building B; hierarchy M -> C1; credential K-1 created on C1"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Serial House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "K-1", type: "METAL_KEY" }
              as: FrontDesk
          trigger:
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "K-1", type: "FOB" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SERIAL_EXISTS (http 422)"
            - "GET /credentials?building_id=${b} -> total_count == 1"

      - name: door_code_duplicate_in_same_building_rejected
        claim_type: type_constraints
        grounds: ['entities.Door.fields.door_code', 'errors[ERR_DOOR_CODE_EXISTS]']
        distinguishing_aspect: "door_code uniqueness is scoped per building: duplicate in the same building fails."
        test_recipe:
          setup: ["Building B; hierarchy M -> C1; door D-1 exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "DoorCode House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
          trigger:
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DOOR_CODE_EXISTS (http 422)"

      - name: key_node_level_skip_and_bad_root_rejected
        claim_type: type_constraints
        grounds: ['errors[ERR_KEY_HIERARCHY_INVALID]', 'validations[priority=8]']
        distinguishing_aspect: "Level adjacency is strict (GRAND_MASTER->MASTER->SUB_MASTER->CHANGE) and a root may only be GRAND_MASTER or MASTER."
        test_recipe:
          setup: ["Building B; root GM (GRAND_MASTER) exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Hierarchy House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "GRAND_MASTER", label: "GM" }
              as: SecurityAdmin
              captures: { gm: $.data.id }
          trigger:
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${gm}", level: "CHANGE", label: "SKIP" }
              as: SecurityAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "CHANGE", label: "ROOT-CHANGE" }
              as: SecurityAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_KEY_HIERARCHY_INVALID (GRAND_MASTER -> CHANGE skips two levels)"
            - "err2 == ERR_KEY_HIERARCHY_INVALID (root level CHANGE not allowed)"

      - name: door_pinned_to_non_change_node_rejected
        claim_type: type_constraints
        grounds: ['errors[ERR_KEY_HIERARCHY_INVALID]', 'entities.Door.fields.key_node_id']
        distinguishing_aspect: "Doors pin to CHANGE-level nodes only; pinning to a MASTER node fails."
        test_recipe:
          setup: ["Building B; hierarchy node M (MASTER root) exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Pin House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${m}" }
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_KEY_HIERARCHY_INVALID (http 422)"

      - name: credential_create_status_input_ignored
        claim_type: system_fields
        grounds: ['entities.Credential.fields.status']
        distinguishing_aspect: "Client-supplied system fields are ignored: a credential created with status: ISSUED still starts IN_STOCK with null holder."
        test_recipe:
          setup: ["Building B; hierarchy M -> C1"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "System Field House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "X-1", type: "FOB", status: "ISSUED" }
              as: FrontDesk
              captures: { st: $.data.status, holder: $.data.holder_person_id }
          assert:
            - "st == IN_STOCK (input ignored)"
            - "holder == null"

      - name: access_event_has_no_version_or_update_surface
        claim_type: immutability
        grounds: ['entities.AccessEvent']
        distinguishing_aspect: "AccessEvent is append-only (common_fields false): rows carry id/created_at but no updated_at/version, and no mutation endpoint exists."
        test_recipe:
          setup: ["Building B; M -> C1; door D1; staff S1 with FOB K-1; group G covering D1+S1 24h"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Audit House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "K-1", type: "FOB" }
              as: FrontDesk
              captures: { k1: $.data.id }
            - call: "POST /credentials/${k1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /access-groups"
              payload: { building_id: "${b}", name: "All", door_ids: ["${d1}"], person_ids: ["${s1}"], days_of_week: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"], window_start_utc: "00:00", window_end_utc: "23:59" }
              as: SecurityAdmin
          trigger:
            - call: "POST /doors/${d1}/access-checks"
              payload: { credential_id: "${k1}", mode: "RECORDED" }
              as: SecurityOfficer
              captures: { ev: $.data.access_event_id }
            - call: "GET /access-events/${ev}"
              as: SecurityOfficer
              captures: { ev_keys: $.data }
          assert:
            - "AccessEvent.${ev} has outcome == GRANTED, occurred_at == 2026-08-01T08:00:00Z, archived == false"
            - "AccessEvent.${ev} exposes no version and no updated_at member (append-only)"

      - name: door_get_nonexistent_not_found
        claim_type: not_found
        grounds: ['errors[ERR_NOT_FOUND]', 'validations[priority=3]']
        distinguishing_aspect: "A well-formed but unknown door id yields ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Building B exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Ghost House" }
              as: SecurityAdmin
          trigger:
            - call: "GET /doors/00000000-0000-0000-0000-000000000000"
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: credential_issue_from_issued_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Credential.IN_STOCK_to_ISSUED', 'errors[ERR_CREDENTIAL_NOT_ISSUABLE]']
        distinguishing_aspect: "Issue is defined only from IN_STOCK; an ISSUED credential rejects a second issue."
        test_recipe:
          setup: ["Building B; M -> C1; resident R1 and R2; FOB F-1 issued to R1"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "SM House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res Two", kind: "RESIDENT", unit_label: "U-2" }
              as: FrontDesk
              captures: { r2: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "F-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
          trigger:
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r2}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDENTIAL_NOT_ISSUABLE (http 409)"
            - "Credential.${f1}.holder_person_id == ${r1} (unchanged)"

      - name: credential_return_from_stock_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Credential.ISSUED_to_IN_STOCK', 'errors[ERR_CREDENTIAL_NOT_ISSUED]']
        distinguishing_aspect: "Return is defined only from ISSUED; an IN_STOCK credential rejects return."
        test_recipe:
          setup: ["Building B; M -> C1; F-1 in stock"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "SM House 2" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "F-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /credentials/${f1}/return"
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDENTIAL_NOT_ISSUED (http 409)"
            - "Credential.${f1}.status == IN_STOCK (unchanged)"

      - name: incident_reopen_from_open_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Incident.RESOLVED_to_UNDER_REVIEW', 'errors[ERR_INCIDENT_INVALID_STATE]']
        distinguishing_aspect: "Reopen is defined only from RESOLVED/DISMISSED; an OPEN incident rejects reopen."
        test_recipe:
          setup: ["Building B; M -> C1; staff S1 holds K-1 (FOB on C1); K-1 reported lost -> incident OPEN"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Reopen House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "K-1", type: "FOB" }
              as: FrontDesk
              captures: { k1: $.data.id }
            - call: "POST /credentials/${k1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /credentials/${k1}/report-lost"
              as: FrontDesk
            - call: "GET /incidents?credential_id=${k1}"
              as: SecurityOfficer
              captures: { inc: "$.data[0].id" }
          trigger:
            - call: "POST /incidents/${inc}/reopen"
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INCIDENT_INVALID_STATE (http 409)"
            - "Incident.${inc}.status == OPEN (unchanged)"

      - name: campaign_cancel_with_active_work_rejected
        claim_type: precondition_enforcement
        grounds: ['state_machines.RekeyCampaign.APPROVED_to_CANCELLED', 'errors[ERR_CAMPAIGN_HAS_ACTIVE_WORK]']
        distinguishing_aspect: "An APPROVED campaign with a work order IN_PROGRESS cannot be cancelled."
        test_recipe:
          setup: ["Building B; M -> C1; door D1 on C1; campaign on C1 approved; its work order started"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Cancel House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /rekey-campaigns"
              payload: { building_id: "${b}", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { camp: $.data.id }
            - call: "POST /rekey-campaigns/${camp}/approve"
              as: SecurityAdmin
            - call: "GET /work-orders?campaign_id=${camp}"
              as: SecurityOfficer
              captures: { wo: "$.data[0].id" }
            - call: "POST /work-orders/${wo}/start"
              as: SecurityOfficer
          trigger:
            - call: "POST /rekey-campaigns/${camp}/cancel"
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CAMPAIGN_HAS_ACTIVE_WORK (http 409)"
            - "RekeyCampaign.${camp}.status == IN_PROGRESS (unchanged; auto-advanced by the work-order start)"

      - name: work_order_complete_from_open_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.MaintenanceWorkOrder.IN_PROGRESS_to_COMPLETED', 'errors[ERR_WORK_ORDER_INVALID_STATE]']
        distinguishing_aspect: "Complete is defined only from IN_PROGRESS; an OPEN order rejects completion."
        test_recipe:
          setup: ["Building B; M -> C1; door D1; manual work order WO created OPEN"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "WO House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /work-orders"
              payload: { building_id: "${b}", door_id: "${d1}", type: "HARDWARE_REPAIR", scheduled_start: "2026-08-01T10:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }
              as: SecurityOfficer
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/complete"
              payload: { actual_cost_cents: 5000 }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_WORK_ORDER_INVALID_STATE (http 409)"
            - "MaintenanceWorkOrder.${wo}.status == OPEN (unchanged)"

      - name: charge_pay_from_draft_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Charge.ISSUED_to_PAID', 'errors[ERR_CHARGE_INVALID_STATE]']
        distinguishing_aspect: "Pay is defined only from ISSUED; a DRAFT settlement charge rejects payment."
        test_recipe:
          setup: ["Building B; M -> C1; resident R1 (deposit 1000) held FOB F-1 and moved out; settlement charge DRAFT"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Pay House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
