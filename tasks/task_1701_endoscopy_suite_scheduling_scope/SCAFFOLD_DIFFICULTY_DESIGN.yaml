      - name: inadequate_prep_abort_cascades_to_anesthesia_minutes
        grounds:
          - state_machines.ProcedureBooking.IN_PROGRESS_to_ABORTED_PREP_INADEQUATE
          - state_machines.AnesthesiaAssignment.CONFIRMED_to_CANCELLED
          - calculations.anesthesia_minutes_ledger
          - entities.AnesthesiaProvider.fields.scheduled_minutes
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (abort, not culture result): abort mutates
          the booking (link 1: IN_PROGRESS -> ABORTED_PREP_INADEQUATE); the booking transition
          cancels the CONFIRMED AnesthesiaAssignment (link 2); the assignment cancellation
          releases minutes on AnesthesiaProvider.scheduled_minutes (link 3: 85 -> 35).
        test_recipe:
          setup:
            - "Patient P (1990-05-05), provider DR1, types COLONO (base 40) and EGD (base 25, CLEAR_LIQUIDS, family/adr false, GASTROSCOPE), rooms RA and RB (STANDARD), anesthesia provider AP1, scopes SCA (COLONOSCOPE) and SGB (GASTROSCOPE)"
            - "Ba: COLONO/MAC at 2026-08-06T09:00 in RA (procedure 50) with assignment Aa on AP1 (minutes 50)"
            - "Bb: EGD/MAC at 2026-08-06T11:00 in RB (procedure 35) with assignment Ab on AP1 (minutes 35; AP1.scheduled_minutes == 85)"
            - "Ba checked in at 09:00, Aa CONFIRMED, started with SCA, assessed inadequate (1,2,2 sum 5)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M4101", full_name: "Pat Ab", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Ab", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "EGD", display_name: "Upper endoscopy", base_duration_minutes: 25, prep_protocol: "CLEAR_LIQUIDS", colonoscopy_family: false, adr_relevant: false, required_scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { t_egd: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RA", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { ra: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RB", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rb: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-providers", payload: { full_name: "Ann Esthesia" }, as: UnitAdmin, captures: { ap1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-A", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sca: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SG-B", scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { sgb: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${ra}", scheduled_start: "2026-08-06T09:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { ba: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_egd}", room_id: "${rb}", scheduled_start: "2026-08-06T11:00:00Z", indication: "DIAGNOSTIC", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { bb: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${ba}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { aa: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${bb}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { ab: $.data.id } }
            - { call: "GET /endoscopy/anesthesia-providers/${ap1}", payload: {}, as: UnitAdmin, captures: { ap_min_pre: $.data.scheduled_minutes } }
            - { call: "POST /endoscopy/bookings/${ba}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${ba}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/anesthesia-assignments/${aa}/confirm", payload: {}, as: AnesthesiaProvider, as_user_id: "${ap1}" }
            - { call: "POST /endoscopy/bookings/${ba}/start", payload: { scope_id: "${sca}" }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "POST /endoscopy/bookings/${ba}/record-prep-assessment", payload: { bbps_left: 1, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${dr1}" }
          trigger:
            - { call: "POST /endoscopy/bookings/${ba}/abort", payload: { reason: "prep inadequate" }, as: Endoscopist, as_user_id: "${dr1}", captures: { ba_status: $.data.status } }
            - { call: "GET /endoscopy/anesthesia-assignments/${aa}", payload: {}, as: UnitAdmin, captures: { aa_status: $.data.status } }
            - { call: "GET /endoscopy/anesthesia-providers/${ap1}", payload: {}, as: UnitAdmin, captures: { ap_min_post: $.data.scheduled_minutes } }
          assert:
            - "Booking ${ba}.status == ABORTED_PREP_INADEQUATE (link 1)"
            - "Assignment ${aa}.status == CANCELLED (link 2: caused by the booking transition, not by any direct call on the assignment)"
            - "AnesthesiaProvider ${ap1}.scheduled_minutes == 35 after the cascade (link 3: 85 - 50 released; Ab's 35 remain)"
            - "Before the abort: scheduled_minutes == 85 (50 + 35)"
            - "GET /endoscopy/scopes/${sca}.status == AWAITING_REPROCESS (sibling fan-out of the abort)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_procedure_start
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.ProcedureBooking
        distinguishing_aspect: |
          Error-category pair (state, business_safety): the start request violates both —
          booking is CANCELLED (state, priority 7) and the explicit scope's storage is expired
          (business_safety, priority 8). The state error ERR_BOOKING_NOT_CHECKED_IN must win.
          Sibling instances use different category pairs (existence vs business_temporal;
          business_temporal vs business_constraint).
        test_recipe:
          setup:
            - "Patient, provider DR1, COLONO type, room R_STD, scope S_E whose cycle dried 2026-08-01T08:26:00Z (storage_expires_at 2026-08-04T08:26:00Z)"
            - "Booking B (COLONO/NONE, scheduled 2026-08-02T09:00:00Z) created and then CANCELLED"
            - "Logical clock at 2026-08-04T09:00:00Z — past the scope expiry, so the safety violation is also present in the same request"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M5001", full_name: "Pat S", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
