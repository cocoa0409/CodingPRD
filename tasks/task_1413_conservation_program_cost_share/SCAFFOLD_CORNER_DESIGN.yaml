  # ============================================================ calculations
  - section: calculations
    instances:
      - name: ranking_waterfall_skip_and_shadow
        claim_type: waterfall_allocation
        grounds: [calculations.ranking_selection_waterfall]
        distinguishing_aspect: "Waterfall skips a non-fitting application and continues: scores 90/60/35 with estimates 600000/500000/250000 against pool 900000 -> A SELECTED, B NOT_SELECTED (500000 > 300000 shadow remainder), C SELECTED (250000 <= 300000). Selection mutates NO pool fields (shadow accounting only)."
        test_recipe:
          setup:
            - "Pool GENERAL 900000; rates COVER_CROP 15000 and WATERING_FACILITY 250000; three applicants/apps: A COVER_CROP 40ac (600000, verified {40,30,20} -> 90), B WATERING_FACILITY 2 (500000, verified {30,20,10} -> 60), C WATERING_FACILITY 1 (250000, verified {20,10,10} -> 35)"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 900000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "WATERING_FACILITY", unit: "EACH", standard_rate_cents: 250000, hu_rate_cents: 300000, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WATER_QUALITY", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WILDLIFE", weight: 0.5, max_points: 20 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-500"] }, as: ProgramAdmin, captures: { aa: $.data.id } }
            - { call: "POST /eqip/applicants", payload: { legal_name: "B", hu_category: "NONE", parcel_ids: ["P-501"] }, as: ProgramAdmin, captures: { ab: $.data.id } }
            - { call: "POST /eqip/applicants", payload: { legal_name: "C", hu_category: "NONE", parcel_ids: ["P-502"] }, as: ProgramAdmin, captures: { ac: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${aa}", parcel_id: "P-500", planned_practices: [ { practice_code: "COVER_CROP", quantity: 40 } ], self_reported_answers: { SOIL_HEALTH: 40, WATER_QUALITY: 30, WILDLIFE: 20 } }, as: Applicant, as_user_id: "${aa}", captures: { appa: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${ab}", parcel_id: "P-501", planned_practices: [ { practice_code: "WATERING_FACILITY", quantity: 2 } ], self_reported_answers: { SOIL_HEALTH: 30, WATER_QUALITY: 20, WILDLIFE: 10 } }, as: Applicant, as_user_id: "${ab}", captures: { appb: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${ac}", parcel_id: "P-502", planned_practices: [ { practice_code: "WATERING_FACILITY", quantity: 1 } ], self_reported_answers: { SOIL_HEALTH: 20, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: Applicant, as_user_id: "${ac}", captures: { appc: $.data.id } }
            - { call: "POST /eqip/applications/${appa}/submit", payload: {}, as: Applicant, as_user_id: "${aa}" }
            - { call: "POST /eqip/applications/${appb}/submit", payload: {}, as: Applicant, as_user_id: "${ab}" }
            - { call: "POST /eqip/applications/${appc}/submit", payload: {}, as: Applicant, as_user_id: "${ac}" }
            - { call: "POST /eqip/applications/${appa}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 40, WATER_QUALITY: 30, WILDLIFE: 20 } }, as: ConservationPlanner }
            - { call: "POST /eqip/applications/${appb}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 30, WATER_QUALITY: 20, WILDLIFE: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/applications/${appc}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 20, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin, captures: { rk: $.data.ranked_count, sc: $.data.selected_count, ns: $.data.not_selected_count } }
            - { call: "GET /eqip/applications/${appa}", payload: {}, as: ProgramAdmin, captures: { sta: $.data.status, fpa: $.data.funded_pool_id } }
            - { call: "GET /eqip/applications/${appb}", payload: {}, as: ProgramAdmin, captures: { stb: $.data.status } }
            - { call: "GET /eqip/applications/${appc}", payload: {}, as: ProgramAdmin, captures: { stc: $.data.status, fpc: $.data.funded_pool_id } }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { oblig: $.data.obligated_cents, avail: $.data.available_cents } }
          assert:
            - "rk == 3, sc == 2, ns == 1"
            - "sta == SELECTED (fpa == ${pool}); stb == NOT_SELECTED (skipped: 500000 > 300000 shadow); stc == SELECTED (fpc == ${pool}, 250000 <= 300000)"
            - "pool fields UNMUTATED by ranking: oblig == 0, avail == 900000 (shadow accounting; funds move only at obligate)"

      - name: ranking_tie_break_estimated_obligation_then_created_at
        claim_type: waterfall_allocation
        grounds: [calculations.ranking_selection_waterfall]
        distinguishing_aspect: "Tie on ranking_score (both 50) breaks by estimated_obligation_cents ASC, NOT by creation order: X created first (300000) vs Y (250000) against pool 300000 -> Y SELECTED, X NOT_SELECTED. A created_at-first rule would select X instead."
        test_recipe:
          setup: ["pool GENERAL 300000; app X (created first): FENCE 1000 -> est 300000, verified score 50; app Y: WATERING_FACILITY 1 -> est 250000, verified score 50"]
