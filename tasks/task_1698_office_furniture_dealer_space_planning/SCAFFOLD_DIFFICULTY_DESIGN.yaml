# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1698: office furniture dealer & space planning
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: liquidation_estimate_vs_final_credit
        grounds:
          - calculations.liquidation_credit_valuation
          - entities.LiquidationLot.fields.estimated_credit_cents
          - entities.LiquidationLot.fields.final_credit_cents
          - state_machines.LiquidationLot.OFFERED_to_APPRAISED
          - state_machines.LiquidationLot.APPRAISED_to_CREDIT_ISSUED
        distinguishing_aspect: |
          Dual-variant valuation on the LiquidationLot (credit domain): the same lot
          yields 600000 cents under the estimated variant (grade-B assumption with
          20% haircut) and 800000 cents under the final variant (appraised value
          minus 15% liquidation fee minus grade-A refurbishment), a different entity
          domain than the OrderLine lead-time variant pair.
        test_recipe:
          setup:
            - "Dealership with capacity 100; customer C; a liquidation lot of 10 items in OFFERED (estimated_credit_cents computed at offer)"
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/liquidation-lots"
              payload: { customer_id: "${c_id}", description: "10 used task chairs", item_count: 10 }
              as: AccountExecutive
              captures: { lot_id: $.data.id, lot_v: $.data.version, lot_est: $.data.estimated_credit_cents }
            - call: "POST /api/liquidation-lots/${lot_id}/appraise"
              payload: { condition_grade: "A", appraised_value_cents: 1000000, expected_lot_version: "${lot_v}" }
              as: LiquidationAppraiser
              as_user_id: "la-1"
          trigger:
            - call: "POST /api/liquidation-lots/${lot_id}/issue_credit"
              payload: {}
              as: FinanceManager
              as_user_id: "fm-1"
              captures: { lot_final: $.data.final_credit_cents }
            - call: "GET /api/customers/${c_id}"
              payload: {}
              as: FinanceManager
              captures: { c_balance: $.data.liquidation_credit_balance_cents }
          assert:
            - "captured lot_est == 600000 (10 items x 75000 x 0.8, grade-B assumed)"
            - "captured lot_final == 800000 (round_half_up(1000000 x 0.85) - 5000 x 10)"
            - "lot_est != lot_final for identical lot data (600000 vs 800000)"
            - "captured c_balance == 800000"

      - name: orderline_provisional_vs_confirmed_promise
        grounds:
          - calculations.lead_time_provisional
          - calculations.lead_time_confirmed
          - entities.OrderLine.fields.provisional_promise_date
          - entities.OrderLine.fields.confirmed_promise_date
          - state_machines.ProjectOrder.SUBMITTED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Dual-variant promise date on the OrderLine (scheduling domain): identical
          configuration (STEELCASE base 30 + options 5 + 10 = 45 days) yields
          2026-09-17 provisionally (calendar days from submit 2026-08-03) but
          2026-10-07 confirmed (business days from acknowledgment 2026-08-05);
          different entity domain than the LiquidationLot valuation pair.
        test_recipe:
          setup:
            - "Dealership, customer, ACTIVE STATE contract (effective 2026-08-01..2026-12-31), APPROVED plan with one typical, STEELCASE SEATING series base 30 days with options ARMS(+5d) and FABRIC3(+10d)"
            - "Order with one line (qty 1, options ARMS+FABRIC3); clock at 2026-08-03 (Monday) for submit"
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "STATE", pricing_tiers: [ { category: "SEATING", min_qty: 1, discount_pct: 40 } ], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ Floor 3" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 10, target_budget_cents_per_instance: 500000 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ANS", base_list_price_cents: 100000, base_lead_time_days: 30, option_catalog: [ { option_code: "ARMS", price_uplift_pct: 10, extra_lead_days: 5 }, { option_code: "FABRIC3", price_uplift_pct: 5, extra_lead_days: 10 } ] }
              as: DealerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s_id}", quantity: 1, selected_options: ["ARMS", "FABRIC3"] }
              as: AccountExecutive
              captures: { l_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /api/project-orders/${o_id}/submit"
              payload: {}
              as: AccountExecutive
            - call: "GET /api/order-lines/${l_id}"
              payload: {}
              as: AccountExecutive
              captures: { prov_date: $.data.provisional_promise_date, prov_days: $.data.provisional_lead_time_days }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DealerAdmin
          trigger:
            - call: "POST /api/project-orders/${o_id}/acknowledge"
              payload: {}
              as: ManufacturerRep
            - call: "GET /api/order-lines/${l_id}"
              payload: {}
              as: AccountExecutive
              captures: { conf_date: $.data.confirmed_promise_date, conf_days: $.data.confirmed_lead_time_days }
          assert:
            - "captured prov_days == 45 and captured conf_days == 45 (same lead-day count, STEELCASE additive 30+5+10)"
            - "captured prov_date == '2026-09-17' (submit 2026-08-03 + 45 calendar days)"
            - "captured conf_date == '2026-10-07' (ack 2026-08-05 + 45 business days)"
            - "prov_date != conf_date for identical configuration data"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: contract_tiered_net_price_mode_a
        grounds:
          - calculations.contract_net_unit_price
          - calculations.configured_unit_list_price
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — option uplift compounds
          the list price, tier selection switches on (category, quantity) with a
          highest-min_qty-wins rule, and the MAX_DISCOUNT_PCT clamp caps the result;
          qty 25 hits the 45% tier (net 60500) while qty 24 falls to the 40% tier
          (net 66000), so the cheaper unit price comes from the larger order.
        test_recipe:
          setup:
            - "Dealership, customer, ACTIVE contract with SEATING tiers [{min_qty 1, 40%},{min_qty 25, 45%}] default 30%, APPROVED plan, STEELCASE SEATING series base 100000 with ARMS +10% option"
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "COOP", pricing_tiers: [ { category: "SEATING", min_qty: 1, discount_pct: 40 }, { category: "SEATING", min_qty: 25, discount_pct: 45 } ], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ Floor 3" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 10, target_budget_cents_per_instance: 500000 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ANS", base_list_price_cents: 100000, base_lead_time_days: 30, option_catalog: [ { option_code: "ARMS", price_uplift_pct: 10, extra_lead_days: 5 } ] }
              as: DealerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s_id}", quantity: 25, selected_options: ["ARMS"] }
              as: AccountExecutive
              captures: { l25_unit_list: $.data.unit_list_price_cents, l25_unit_net: $.data.unit_net_price_cents, l25_total: $.data.line_total_cents }
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s_id}", quantity: 24, selected_options: ["ARMS"] }
              as: AccountExecutive
              captures: { l24_unit_net: $.data.unit_net_price_cents }
          assert:
            - "captured l25_unit_list == 110000 (100000 x 1.10)"
            - "captured l25_unit_net == 60500 (45% tier at qty 25; 110000 x 0.55)"
            - "captured l25_total == 1512500"
            - "captured l24_unit_net == 66000 (40% tier at qty 24; 110000 x 0.60)"
            - "l25_unit_net < l24_unit_net (non-linear quantity interaction)"

      - name: order_rollup_pinned_evaluation_mode_c
        grounds:
          - calculations.order_total_rollup
          - entities.ProjectOrder.fields.install_fee_cents
          - entities.ProjectOrder.fields.credit_applied_cents
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to a fixed evaluation order —
          the fee band is selected by total_LIST, applied to total_NET, and the credit
          cap is 25% of (net + fee) computed BEFORE credit is deducted; with
          total_list 5150000 the 8% band applies (fee 245800), the cap is 829575, and
          a 900000 credit attempt is rejected even though the customer balance covers it.
        test_recipe:
          setup:
            - "Dealership (credit_cap_pct default 25), customer, ACTIVE contract (SEATING 40/45 tiers, TABLES 35%), APPROVED plan, two series; order with line1: 25x SEATING @110000 list and line2: 12x TABLES @200000 list"
            - "Customer holds 1225000 credit from an issued lot (appraised 1500000 grade A, 10 items)"
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "STATE", pricing_tiers: [ { category: "SEATING", min_qty: 1, discount_pct: 40 }, { category: "SEATING", min_qty: 25, discount_pct: 45 }, { category: "TABLES", min_qty: 1, discount_pct: 35 } ], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ Floor 3" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 10, target_budget_cents_per_instance: 500000 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ANS", base_list_price_cents: 100000, base_lead_time_days: 30, option_catalog: [ { option_code: "ARMS", price_uplift_pct: 10, extra_lead_days: 5 } ] }
              as: DealerAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "MILLERKNOLL", category: "TABLES", series_code: "MK-TB", base_list_price_cents: 200000, base_lead_time_days: 20, option_catalog: [] }
              as: DealerAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s1_id}", quantity: 25, selected_options: ["ARMS"] }
              as: AccountExecutive
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s2_id}", quantity: 12, selected_options: [] }
              as: AccountExecutive
            - call: "POST /api/liquidation-lots"
              payload: { customer_id: "${c_id}", description: "Trade-in lot", item_count: 10 }
              as: AccountExecutive
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /api/liquidation-lots/${lot_id}/appraise"
              payload: { condition_grade: "A", appraised_value_cents: 1500000, expected_lot_version: "${lot_v}" }
              as: LiquidationAppraiser
              as_user_id: "la-1"
            - call: "POST /api/liquidation-lots/${lot_id}/issue_credit"
              payload: {}
              as: FinanceManager
              as_user_id: "fm-1"
            - call: "POST /api/project-orders/${o_id}/submit"
              payload: {}
              as: AccountExecutive
              captures: { o_list: $.data.total_list_cents, o_net: $.data.total_net_cents, o_fee: $.data.install_fee_cents, o_grand: $.data.grand_total_cents }
          trigger:
            - call: "POST /api/project-orders/${o_id}/apply_credit"
              payload: { amount_cents: 900000 }
              as: FinanceManager
              captures: { cap_err: $.data.error_id }
            - call: "POST /api/project-orders/${o_id}/apply_credit"
              payload: { amount_cents: 829575 }
              as: FinanceManager
              captures: { o_credit: $.data.credit_applied_cents, o_grand2: $.data.grand_total_cents }
            - call: "GET /api/customers/${c_id}"
              payload: {}
              as: FinanceManager
              captures: { c_balance: $.data.liquidation_credit_balance_cents }
          assert:
            - "captured o_list == 5150000 (2750000 + 2400000) -> >= 5000000 so the 8% fee band applies"
            - "captured o_net == 3072500 and o_fee == 245800 (8% of net, NOT 12% which would be 368700)"
            - "captured o_grand == 3322300 before credit"
            - "captured cap_err == 'ERR_CREDIT_CAP_EXCEEDED' (900000 > cap 829575 even though balance 1225000 covers it)"
            - "captured o_credit == 829575 and captured o_grand2 == 2488725"
            - "captured c_balance == 395425 (1225000 - 829575)"

      - name: per_line_rounding_mode_b
        grounds:
          - calculations.per_line_extension_rounding
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — the NET UNIT price is rounded to
          whole cents before quantity extension; base 10101 at 45% discount gives
          unit_net 5556 (round_half_up of 5555.55) and line_total 16668, whereas the
          forbidden sum-then-round order would yield 16667.
        test_recipe:
          setup:
            - "Dealership, customer, ACTIVE contract with SEATING tier {min_qty 1, 45%}, APPROVED plan, SEATING series base_list_price_cents 10101"
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "NEGOTIATED", pricing_tiers: [ { category: "SEATING", min_qty: 1, discount_pct: 45 } ], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ Floor 3" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 10, target_budget_cents_per_instance: 500000 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ODD", base_list_price_cents: 10101, base_lead_time_days: 14, option_catalog: [] }
              as: DealerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s_id}", quantity: 3, selected_options: [] }
              as: AccountExecutive
              captures: { l_unit: $.data.unit_net_price_cents, l_total: $.data.line_total_cents }
          assert:
            - "captured l_unit == 5556 (round_half_up(10101 x 0.55) = round_half_up(5555.55))"
            - "captured l_total == 16668 (5556 x 3); the forbidden sum-then-round order would give 16667"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: spaceplan_revision_cycle
        grounds:
          - state_machines.SpacePlan.APPROVED_to_IN_REVISION
          - state_machines.SpacePlan.IN_REVISION_to_SUBMITTED
          - entities.SpacePlan.fields.revision_no
          - entities.SpacePlan.fields.approved_version
        distinguishing_aspect: |
          Cyclic machine on SpacePlan: APPROVED -> IN_REVISION -> SUBMITTED -> APPROVED
          loops with revision_no incrementing and the approved_version pin cleared then
          re-pinned; a different entity than the ManufacturerClaim negotiation cycle.
        test_recipe:
          setup:
            - "Dealership, customer; plan with one typical, approved once (cycle position APPROVED, revision_no 1)"
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ Floor 3" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 10, target_budget_cents_per_instance: 500000 }
              as: Designer
              captures: { t_id: $.data.id }
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
              captures: { p_v1: $.data.version, p_av1: $.data.approved_version }
          trigger:
            - call: "POST /api/space-plans/${p_id}/revise"
              payload: {}
              as: Designer
              captures: { rev_no: $.data.revision_no, rev_status: $.data.status }
            - call: "PATCH /api/typicals/${t_id}"
              payload: { quantity: 12 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
              captures: { p_v2: $.data.version, p_av2: $.data.approved_version, final_status: $.data.status }
          assert:
            - "captured rev_status == 'IN_REVISION' and captured rev_no == 2 (cycle APPROVED -> IN_REVISION)"
            - "captured final_status == 'APPROVED' (cycle closed IN_REVISION -> SUBMITTED -> APPROVED)"
            - "captured p_av1 == captured p_v1 (approval pins the version observed at approval)"
            - "captured p_av2 == captured p_v2 and p_av2 != p_av1 (revision + edits advanced the version, approval re-pinned it)"
      - name: claim_negotiation_cycle
        grounds:
          - state_machines.ManufacturerClaim.SETTLEMENT_OFFERED_to_SUBMITTED
