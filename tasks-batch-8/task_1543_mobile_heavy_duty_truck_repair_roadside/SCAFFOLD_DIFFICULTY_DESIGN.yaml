  - rule_id: transitive_cascade
    instances:
      - name: cascade_invoice_issue_suspends_fleet_and_expires_dispatches
        grounds:
          - state_machines.Invoice
          - state_machines.FleetAccount.ACTIVE_to_SUSPENDED
          - state_machines.Dispatch.PROPOSED_to_EXPIRED
          - calculations.fleet_mtd_spend
          - entities.ServiceCall.fields.hold_reason
        distinguishing_aspect: |
          Depth-4 cascade originating at invoice ISSUE: (1) fleet mtd += 200995 (200000 -> 400995);
          (2) mtd > cap 300000 -> fleet SUSPENDED/CREDIT_HOLD; (3) fleet's calls in
          {RECEIVED, TRIAGED, DISPATCHED} get hold_reason = FLEET_CREDIT_HOLD; (4) their PROPOSED
          dispatches EXPIRE and DISPATCHED calls revert to TRIAGED. Each hop is caused by the
          previous one, not by the issue call directly.
