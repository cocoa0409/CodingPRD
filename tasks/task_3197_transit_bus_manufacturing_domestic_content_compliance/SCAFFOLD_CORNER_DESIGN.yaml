      - name: nonpositive_fiscal_values_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_FISCAL_VIOLATION]"]
        distinguishing_aspect: "Contract with base_quantity 0 or non-positive price fails ERR_FISCAL_VIOLATION (422); warranty claim with claimed_amount_cents 0 fails the same way."
        test_recipe:
          setup: ["ACTIVE agency"]
