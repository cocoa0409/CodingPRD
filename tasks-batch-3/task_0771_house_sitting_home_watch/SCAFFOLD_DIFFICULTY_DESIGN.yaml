              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 2 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
