      - name: solid_construction_lot_branches_from_drawn_straight_to_extruded
        claim_type: valid_transition
        grounds:
          - state_machines.ProductionLot.transitions.DRAWN_to_EXTRUDED
          - state_machines.ProductionLot.transitions.DRAWN_to_STRANDED
          - entities.CatalogProduct.fields.conductor_construction
          - errors[ERR_INVALID_LOT_STATE]
        distinguishing_aspect: "conductor_construction == SOLID is the fork guard: the DRAWN -> STRANDED hop is unavailable for a solid conductor (ERR_INVALID_LOT_STATE) while DRAWN -> EXTRUDED, which is unavailable for stranded SKUs, is the one that fires."
        test_recipe:
          setup:
            - "SKU THHN-12-SOL identical to the stranded building wire except conductor_construction == SOLID; lot LOT-S drawn but not stranded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
