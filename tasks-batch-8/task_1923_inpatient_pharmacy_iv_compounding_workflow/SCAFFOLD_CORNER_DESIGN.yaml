              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOOD_SESSION_OUTSIDE_WINDOW (422); session remains SCHEDULED"
      - name: error_drug_discontinued_on_verify
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRUG_DISCONTINUED]", "validations[priority=31]"]
        distinguishing_aspect: "Verify an order whose drug was PATCHed to DISCONTINUED after order creation -> ERR_DRUG_DISCONTINUED (422)."
        test_recipe:
          setup: ["Order PENDING for drug D; D then discontinued"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr DD", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat DD", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugDD", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "PATCH /pharmacy/drug-products/${drug_id}"
              payload: { status: "DISCONTINUED" }
