# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Sidewalk Repair & Cost-Share Program
#
# Breadth probe complementing SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Walks the
# claim-extraction-guide taxonomy (entities / state_machines / calculations /
# validations / endpoints / errors / rbac / cross_cutting_complexity_layers /
# consistency_model) against this scaffold's §1.1–§1.7 surface.
#
# Corner instances: 80 active + 8 excluded_because stubs (§1.8-covered errors).
#
# Audit findings — two catalogued errors are UNREACHABLE by construction under
# this scaffold's own §1.1–§1.4 rules, so no corner instance can trigger them
# without a broken fixture (recording the finding instead of fabricating one):
#   * ERR_ZERO_SCOPE_AREA — Defect.area_sqft is constrained > 0 and enforced at
#     priority 0 (ERR_INVALID_REQUEST); the sum over any non-empty defect set at
#     lien creation can therefore never be 0.
#   * ERR_LIEN_ALREADY_EXISTS — POST /lien-cases requires the notice in
#     CITY_REPAIR_COMPLETED and its side effect flips the notice to LIENED, so a
#     second create always fails the priority-5 state check (notice no longer
#     CITY_REPAIR_COMPLETED) before the priority-10 one-lien-per-notice
#     uniqueness check can be reached with a live non-terminal lien.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: cycle_creation_applies_system_fields
        claim_type: system_fields
        grounds:
          - entities.ProgramCycle.fields.committed_cents
          - entities.ProgramCycle.fields.disbursed_cents
          - entities.ProgramCycle.fields.available_cents
          - entities.ProgramCycle.fields.status
          - "endpoints.POST /program-cycles"
        distinguishing_aspect: |
          A newly created cycle carries only system-managed values for its computed
          fields: committed_cents 0, disbursed_cents 0, available_cents equal to the
          appropriation, status OPEN, version 1, and created_at stamped from the
          logical clock startup default 2026-08-01T00:00:00Z — client input cannot
          set any of them.
        test_recipe:
          setup:
            - "empty DB; logical clock untouched (startup default 2026-08-01T00:00:00Z)"
          setup_api_calls: []
          trigger:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 5000000 }, as: ProgramCoordinator, captures: { c_status: "$.data.status", c_version: "$.data.version", c_created: "$.data.created_at", c_committed: "$.data.committed_cents", c_disbursed: "$.data.disbursed_cents", c_available: "$.data.available_cents" } }
          assert:
            - "c_status == OPEN (initial state)"
            - "c_version == 1 and c_created == 2026-08-01T00:00:00Z (system-minted)"
            - "c_committed == 0 and c_disbursed == 0 and c_available == 5000000"

      - name: parcel_creation_computes_owner_responsibility
        claim_type: computed_fields
        grounds:
          - calculations.owner_responsibility_determination
          - entities.PropertyParcel.fields.owner_responsibility_pct
          - entities.PropertyParcel.fields.delinquency_flag
        distinguishing_aspect: |
          owner_responsibility_pct is computed by ordinance at creation: 100 for a
          private parcel and 0 for a city-owned parcel (is_city_owned true), and
          delinquency_flag initializes to false on both.
        test_recipe:
          setup:
            - "one registered owner"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ora Ort", mailing_address: "40 Ort St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
          trigger:
            - { call: "POST /parcels", payload: { parcel_number: "P-E1", owner_id: "${owner_id}", street_address: "40 Ort St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { pct_private: "$.data.owner_responsibility_pct", flag_private: "$.data.delinquency_flag" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-E2", owner_id: "${owner_id}", street_address: "City Lot", street_class: "LOCAL", is_city_owned: true }, as: ProgramCoordinator, captures: { pct_city: "$.data.owner_responsibility_pct", flag_city: "$.data.delinquency_flag" } }
          assert:
            - "pct_private == 100 and flag_private == false"
            - "pct_city == 0 and flag_city == false (city self-repairs)"

      - name: property_owner_defaults_hardship_none
        claim_type: defaults
        grounds:
          - entities.PropertyOwner.fields.hardship_tier
          - "endpoints.POST /property-owners"
        distinguishing_aspect: |
          Omitting the optional hardship_tier on owner registration applies the
          declared default NONE, which later drives zero hardship bonus in
          cost_share_pct and no deadline extension in compliance_deadline.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /property-owners", payload: { full_name: "Pat Pine", mailing_address: "41 Pine St" }, as: ProgramCoordinator, captures: { tier: "$.data.hardship_tier" } }
          assert:
            - "tier == NONE (default applied when the optional field is omitted)"

      - name: notice_defaults_base_deadline_45
        claim_type: defaults
        grounds:
          - entities.RepairNotice.fields.base_deadline_days
          - calculations.compliance_deadline
          - entities.RepairNotice.fields.compliance_deadline
        distinguishing_aspect: |
          Omitting base_deadline_days applies the default 45; issuing at the
          startup clock default 2026-08-01T00:00:00Z with a NONE-hardship owner
          yields compliance_deadline exactly 2026-09-15T00:00:00Z (45 days, no
          hardship extension).
        test_recipe:
          setup:
            - "owner NONE; parcel; segment; one OPEN defect; DRAFT notice created without base_deadline_days"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Quinn Quail", mailing_address: "42 Quail St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-E3", owner_id: "${owner_id}", street_address: "42 Quail St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-E3-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id", base_days: "$.data.base_deadline_days" } }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1", captures: { issued: "$.data.issued_at", deadline: "$.data.compliance_deadline" } }
          assert:
            - "base_days == 45 (default applied)"
            - "issued == 2026-08-01T00:00:00Z and deadline == 2026-09-15T00:00:00Z"

      - name: parcel_missing_street_class_rejected
        claim_type: required_fields
        grounds:
          - entities.PropertyParcel.fields.street_class
          - validations[priority=0]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          street_class is a required input with no default; omitting it fails
          request-shape validation at priority 0 with ERR_INVALID_REQUEST (400)
          before any authz or FK lookup decides the request.
        test_recipe:
          setup:
            - "one registered owner"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Rita Rye", mailing_address: "43 Rye St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
          trigger:
            - { call: "POST /parcels", payload: { parcel_number: "P-E4", owner_id: "${owner_id}", street_address: "43 Rye St" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (missing required field street_class)"

      - name: invalid_enums_and_shapes_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=0]
          - errors[ERR_INVALID_REQUEST]
          - entities.PropertyParcel.fields.street_class
          - entities.ProgramCycle.fields.window_start_date
          - entities.ProgramCycle.fields.appropriation_cents
          - entities.Defect.fields.area_sqft
        distinguishing_aspect: |
          Four request-shape violations each return ERR_INVALID_REQUEST (400):
          an undeclared enum member (street_class HIGHWAY), an inverted cycle
          window (start >= end), a non-positive appropriation (0), and a
          non-positive defect area (0).
        test_recipe:
          setup:
            - "one owner and one parcel exist for the defect-shape probe"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Sal Sage", mailing_address: "44 Sage St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-E5", owner_id: "${owner_id}", street_address: "44 Sage St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
          trigger:
            - { call: "POST /parcels", payload: { parcel_number: "P-E6", owner_id: "${owner_id}", street_address: "45 Bad St", street_class: "HIGHWAY" }, as: ProgramCoordinator, captures: { err_enum: "$.data.error_id" } }
            - { call: "POST /program-cycles", payload: { cycle_year: 2027, window_start_date: "2027-06-30", window_end_date: "2027-01-01", appropriation_cents: 1000000 }, as: ProgramCoordinator, captures: { err_window: "$.data.error_id" } }
            - { call: "POST /program-cycles", payload: { cycle_year: 2028, window_start_date: "2028-01-01", window_end_date: "2028-12-31", appropriation_cents: 0 }, as: ProgramCoordinator, captures: { err_approp: "$.data.error_id" } }
            - { call: "POST /defects", payload: { segment_id: "00000000-0000-0000-0000-000000000000", defect_type: "SPALLING", area_sqft: 0 }, as: Inspector, as_user_id: "insp-1", captures: { err_area: "$.data.error_id" } }
          assert:
            - "err_enum == ERR_INVALID_REQUEST (HIGHWAY not in LOCAL|COLLECTOR|ARTERIAL)"
            - "err_window == ERR_INVALID_REQUEST (window_start_date >= window_end_date)"
            - "err_approp == ERR_INVALID_REQUEST (appropriation_cents must be > 0)"
            - "err_area == ERR_INVALID_REQUEST (area_sqft must be > 0; priority 0 fires before the segment existence check)"

      - name: parcel_get_returns_stored_fields
        claim_type: retrieval
        grounds:
          - "endpoints.GET /parcels/{id}"
          - entities.PropertyParcel.fields.parcel_number
          - entities.PropertyParcel.fields.is_corner_lot
        distinguishing_aspect: |
          GET /parcels/{id} returns the stored row with every input field intact
          and defaults materialized (is_corner_lot false when omitted), wrapped in
          the §1.0 success envelope (response_type object, meta.api_request_id
          present).
        test_recipe:
          setup:
            - "one owner and one parcel registered"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Tom Tam", mailing_address: "46 Tam St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-E7", owner_id: "${owner_id}", street_address: "46 Tam St", street_class: "COLLECTOR" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
          trigger:
            - { call: "GET /parcels/${parcel_id}", as: ProgramCoordinator, captures: { pnum: "$.data.parcel_number", sclass: "$.data.street_class", corner: "$.data.is_corner_lot", pct: "$.data.owner_responsibility_pct", rtype: "$.response_type", rid: "$.meta.api_request_id" } }
          assert:
            - "pnum == P-E7 and sclass == COLLECTOR and corner == false (default) and pct == 100"
            - "rtype == object and rid is a non-empty string (success envelope per §1.0)"

      - name: parcel_list_pagination_and_filter
        claim_type: listing
        grounds:
          - "endpoints.GET /parcels"
          - entities.PropertyParcel.fields.owner_id
        distinguishing_aspect: |
          GET /parcels supports the owner_id filter and limit/offset pagination:
          with two parcels for one owner, limit=1 returns exactly one row per page
          and the two pages are disjoint and jointly cover both parcels.
        test_recipe:
          setup:
            - "one owner with two registered parcels"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ula Ulm", mailing_address: "47 Ulm St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-E8A", owner_id: "${owner_id}", street_address: "47 Ulm St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_a: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-E8B", owner_id: "${owner_id}", street_address: "48 Ulm St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_b: "$.data.id" } }
          trigger:
            - { call: "GET /parcels?owner_id=${owner_id}&limit=1&offset=0", as: ProgramCoordinator, captures: { page1: "$.data", p1_row: "$.data[0].id", rtype1: "$.response_type" } }
            - { call: "GET /parcels?owner_id=${owner_id}&limit=1&offset=1", as: ProgramCoordinator, captures: { page2: "$.data", p2_row: "$.data[0].id" } }
          assert:
            - "rtype1 == array and len(page1) == 1 and len(page2) == 1 (limit honored)"
            - "p1_row != p2_row and {p1_row, p2_row} == {parcel_a, parcel_b} (pages disjoint and complete)"

      - name: flat_topology_body_fk_existence
        claim_type: fk_integrity
        grounds:
          - validations[priority=4]
          - entities.PropertyParcel.fields.owner_id
          - entities.SidewalkSegment.fields.parcel_id
          - entities.Defect.fields.segment_id
          - errors[ERR_PROPERTY_OWNER_NOT_FOUND]
          - errors[ERR_PARCEL_NOT_FOUND]
          - errors[ERR_SEGMENT_NOT_FOUND]
        distinguishing_aspect: |
          Flat topology: body-carried foreign keys are existence-validated at
          priority 4 — parcel creation with a non-existent owner_id returns
          ERR_PROPERTY_OWNER_NOT_FOUND, segment creation with a non-existent
          parcel_id returns ERR_PARCEL_NOT_FOUND, defect creation with a
          non-existent segment_id returns ERR_SEGMENT_NOT_FOUND (all 404).
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /parcels", payload: { parcel_number: "P-E9", owner_id: "00000000-0000-0000-0000-000000000000", street_address: "49 Nowhere St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { err_owner: "$.data.error_id" } }
            - { call: "POST /segments", payload: { parcel_id: "00000000-0000-0000-0000-000000000000", segment_code: "S-E9-1", length_ft: 10, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { err_parcel: "$.data.error_id" } }
            - { call: "POST /defects", payload: { segment_id: "00000000-0000-0000-0000-000000000000", defect_type: "SPALLING", area_sqft: 10 }, as: Inspector, as_user_id: "insp-1", captures: { err_segment: "$.data.error_id" } }
          assert:
            - "err_owner == ERR_PROPERTY_OWNER_NOT_FOUND"
            - "err_parcel == ERR_PARCEL_NOT_FOUND"
            - "err_segment == ERR_SEGMENT_NOT_FOUND"

      - name: inspection_record_has_no_version
        claim_type: immutability
        grounds:
          - entities.InspectionRecord
          - "endpoints.POST /repair-notices/{id}/inspections"
        distinguishing_aspect: |
          InspectionRecord is the only entity with common_fields: false — its
          creation response carries id and created_at but no version/updated_at,
          and §1.5 declares no update or delete endpoint for it (append-only log).
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice issued"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Vic Viburnum", mailing_address: "50 Vib St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-E10", owner_id: "${owner_id}", street_address: "50 Vib St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-E10-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2", captures: { rec_id: "$.data.id", rec_created: "$.data.created_at", rec_result: "$.data.result", rec_inspector: "$.data.inspector_id" } }
          assert:
            - "rec_id is a UUID and rec_created == 2026-08-01T00:00:00Z (logical clock)"
            - "rec_result == PASS and rec_inspector == insp-2 (system-stamped from X-User-ID)"
            - "response data contains no version and no updated_at keys (common_fields: false)"

  # ===========================================================================
  # Section: state_machines (Table 2 claims)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: inventory_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.SidewalkSegment
          - state_machines.Defect
          - state_machines.RepairNotice
          - entities.SidewalkSegment.fields.open_defect_count
        distinguishing_aspect: |
          Fresh entities land in their declared initial states: a new segment is
          IN_SERVICE with open_defect_count 0 and both condition indexes 0; the
          first defect on it is OPEN and flips the segment to FLAGGED with
          open_defect_count 1; a new notice is DRAFT with appeal_status NONE.
        test_recipe:
          setup:
            - "owner and parcel registered"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Wes Wattle", mailing_address: "51 Wat St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S1", owner_id: "${owner_id}", street_address: "51 Wat St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
          trigger:
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S1-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id", seg_status: "$.data.status", seg_odc: "$.data.open_defect_count", seg_cs: "$.data.condition_screening", seg_cw: "$.data.condition_area_weighted" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 10 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id", d_status: "$.data.status" } }
            - { call: "GET /segments/${segment_id}", as: ProgramCoordinator, captures: { seg_status2: "$.data.status", seg_odc2: "$.data.open_defect_count" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { n_status: "$.data.status", n_appeal: "$.data.appeal_status" } }
          assert:
            - "seg_status == IN_SERVICE and seg_odc == 0 and seg_cs == 0 and seg_cw == 0"
            - "d_status == OPEN (initial defect state)"
            - "seg_status2 == FLAGGED and seg_odc2 == 1 (first-defect cascade)"
            - "n_status == DRAFT and n_appeal == NONE"

      - name: appeal_on_draft_notice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RepairNotice.ISSUED_to_UNDER_APPEAL
          - errors[ERR_INVALID_NOTICE_STATE]
        distinguishing_aspect: |
          Appeal is declared only from ISSUED; calling it on a DRAFT notice is
          rejected with ERR_INVALID_NOTICE_STATE (409) even though the acting
          owner owns the parcel and the window check would pass.
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice created and left DRAFT"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ada Aspen", mailing_address: "52 Aspen St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S2", owner_id: "${owner_id}", street_address: "52 Aspen St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S2-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/appeal", payload: { grounds: "too early" }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_NOTICE_STATE (appeal requires ISSUED, notice is DRAFT)"

      - name: resubmit_on_submitted_application_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CostShareApplication.RETURNED_to_SUBMITTED
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: |
          Resubmit is declared only from RETURNED; calling it on a SUBMITTED
          application (which the owner owns) fails with
          ERR_INVALID_APPLICATION_STATE (409).
        test_recipe:
          setup:
            - "OPEN cycle; owner/parcel/defect; notice issued; application created (SUBMITTED)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Ben Beech", mailing_address: "53 Beech St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S3", owner_id: "${owner_id}", street_address: "53 Beech St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S3-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
