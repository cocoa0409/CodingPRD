              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am}" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/chambers/${ch1}/decommission"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
