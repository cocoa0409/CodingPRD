              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/_ops/run_cycle"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/reimbursement-claims/${eclaim}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { e_err: $.data.error_id }
          assert:
            - "e_err == ERR_STALE_REFERENCE (certification no longer CURRENT at decision time)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: criterion_window_half_open_adjacency
        grounds:
          - validations[priority=10]
          - entities.LadderCriterion.fields.effective_until
        distinguishing_aspect: |
          Half-open interval semantics on LadderCriterion: a new CN_II window
          [2027-01-01, 2027-07-01) against an existing [2026-01-01, 2027-01-01)
          is ADJACENT (a.until == b.from) and MUST be accepted, while
          [2026-12-31, ...) overlapping by one second MUST be rejected —
          geometric adjacency is not overlap.
        test_recipe:
          setup:
            - "Existing CN_II criterion covering [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 78, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 32000, effective_from: "2027-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 79, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 33000, effective_from: "2026-12-31T23:59:59Z", effective_until: null }
              as: ProgramAdmin
              captures: { ovl_err: $.data.error_id }
          assert:
            - "adjacent window accepted: adj_id is a non-null id (201 created)"
            - "ovl_err == ERR_CRITERION_WINDOW_OVERLAP (one-second overlap into the open-ended window rejected)"

      - name: certification_renewal_temporal_supersede_same_track
        grounds:
          - entities.Certification.fields.renewal_of_id
          - validations[priority=17]
          - state_machines.Certification.CURRENT_to_LAPSED
        distinguishing_aspect: |
          Different resource (Certification, not LadderCriterion) and different
          semantics — aggregate-capacity style currency cap rather than geometric
          window adjacency: a nurse may not hold two CURRENT certifications of the
          SAME track with overlapping [obtained_on, expires_on) intervals; the
          renewal is accepted only after the prior credential has LAPSED (or its
          expiry is at-or-before the new start, where adjacency is not overlap).
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse T holds CURRENT BASIC cert [2024-01-01, 2027-01-01)"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-T", full_name: "Nurse T", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { nt_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nt_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2024-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { tc1: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nt_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 45000, obtained_on: "2026-06-01T00:00:00Z", expires_on: "2029-06-01T00:00:00Z", renewal_of_id: "${tc1}" }
              as: ProgramAdmin
              captures: { t_err: $.data.error_id }
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/_ops/run_cycle"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nt_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 45000, obtained_on: "2027-01-02T00:00:00Z", expires_on: "2030-01-02T00:00:00Z", renewal_of_id: "${tc1}" }
              as: ProgramAdmin
              captures: { t_renewed: $.data.id }
          assert:
            - "t_err == ERR_CERTIFICATION_OVERLAP (overlapping CURRENT same-track renewal rejected)"
            - "after the ops sweep lapses the original (clock past 2027-01-01), the renewal POST succeeds and t_renewed is a non-null id"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_approve_pay_conserves_unit_committed_pool
        grounds:
          - calculations.calc_budget_commitment
          - state_machines.ReimbursementClaim.APPROVED_to_PAID
        distinguishing_aspect: |
          Conserved quantity = unit committed pool composition: approve adds
          approved_amount to committed; pay removes exactly the same amount —
          the pair (approve, pay) leaves BudgetLine.committed_cents equal to its
          pre-approve value plus zero net drift from the claim itself.
        test_recipe:
          setup:
            - "Clock 2026-08-01; budget line ICU-4W FY2027; committed baseline C0 == 0"
            - "Nurse U with CURRENT SPECIALTY cert; claim 90000 submitted"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/budget-lines"
              payload: { unit: "ICU-4W", fiscal_year: 2027, allocated_cents: 9000000 }
              as: ProgramAdmin
              captures: { ubl: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-U", full_name: "Nurse U", hire_date: "2021-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { nu_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nu_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 120000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { uc: $.data.id }
            - call: "GET /clinical-ladder/certifications/${uc}/certification-bonuses"
              payload: {}
              as: ProgramAdmin
              captures: { ub: "$.data[0].id" }
            - call: "POST /clinical-ladder/certification-bonuses/${ub}/pay"
              payload: {}
              as: PayrollOfficer
            - call: "GET /clinical-ladder/budget-lines/${ubl}"
              payload: {}
              as: ProgramAdmin
              captures: { u_committed0: $.data.committed_cents }
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${uc}", claimed_amount_cents: 90000 }
              as: Nurse
              as_user_id: "${nu_id}"
              captures: { uclaim: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/reimbursement-claims/${uclaim}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { u_approved_amt: $.data.approved_amount_cents }
            - call: "GET /clinical-ladder/budget-lines/${ubl}"
              payload: {}
              as: ProgramAdmin
              captures: { u_committed1: $.data.committed_cents }
            - call: "POST /clinical-ladder/reimbursement-claims/${uclaim}/pay"
              payload: {}
              as: PayrollOfficer
            - call: "GET /clinical-ladder/budget-lines/${ubl}"
              payload: {}
              as: ProgramAdmin
              captures: { u_committed2: $.data.committed_cents }
          assert:
            - "u_committed0 == 0 (bonus already paid leaves pool)"
            - "u_approved_amt == 90000 and u_committed1 == 90000"
            - "u_committed2 == 0 (approve+pay pair conserves the pool at zero net drift)"

      - name: bonus_accrue_clawback_conserves_nurse_risk_parity
        grounds:
          - calculations.calc_retention_risk
          - state_machines.CertificationBonus.ACCRUED_to_CLAWED_BACK
        distinguishing_aspect: |
          Different conserved quantity — nurse-level accrual parity instead of
          unit money: bonus accrual does not change retention_risk_score, while a
          direct claw-back of an ACCRUED (unpaid) bonus adds exactly +5 and a
          subsequent revocation-free re-accrual path is closed; the conserved
          invariant is risk == pre-accrual value until a compensating event
          (verified participation) subtracts exactly 6 per event.
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse S freshly created (risk 0)"
            - "Certification accrues bonus (risk unchanged == 0)"
            - "Direct claw-back of ACCRUED bonus (risk == 5)"
            - "One participation event verified (risk == max(0, 5-6) == 0, clamped at CAP_MIN)"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-S", full_name: "Nurse S", hire_date: "2022-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { ns_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${ns_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sc: $.data.id }
            - call: "GET /clinical-ladder/nurses/${ns_id}"
              payload: {}
              as: ProgramAdmin
              captures: { ns_risk0: $.data.retention_risk_score }
            - call: "GET /clinical-ladder/certifications/${sc}/certification-bonuses"
              payload: {}
              as: ProgramAdmin
              captures: { sb: "$.data[0].id" }
          trigger:
            - call: "POST /clinical-ladder/certification-bonuses/${sb}/claw-back"
              payload: { clawback_reason: "duplicate accrual" }
              as: ProgramAdmin
            - call: "GET /clinical-ladder/nurses/${ns_id}"
              payload: {}
              as: ProgramAdmin
              captures: { ns_risk1: $.data.retention_risk_score }
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${ns_id}", event_kind: "EBP_RESEARCH", points: 3, occurred_on: "2026-05-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${ns_id}"
              captures: { spe: $.data.id }
            - call: "POST /clinical-ladder/participation-events/${spe}/verify"
              payload: {}
              as: ProgramAdmin
            - call: "GET /clinical-ladder/nurses/${ns_id}"
              payload: {}
              as: ProgramAdmin
              captures: { ns_risk2: $.data.retention_risk_score }
          assert:
            - "ns_risk0 == 0 (accrual conserved risk at pre-accrual value)"
            - "ns_risk1 == 5 (clawback bump exactly +5)"
            - "ns_risk2 == 0 (verified event -6 clamps at CAP_MIN 0; clawback+verify pair returns risk to its conserved floor)"
