# =============================================================================
# §1.8 Scaffold Difficulty Design — School Threat Assessment Team
# Test Targeting Index: 2 instances per Difficulty Rule (§0.5), each grounded
# in SCAFFOLD.yaml §1.1–§1.7. All times use the logical clock (server default
# 2026-08-01T00:00:00Z). Opaque-role user ids (ta_1, tl_1, ic_1, da_1, ...)
# are literal operator ids; SoD tests pin them deliberately.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: assessment_standard_vs_expedited_divergence
        grounds:
          - calculations.assessment_risk_score
          - entities.RiskAssessment.fields.variant
          - state_machines.RiskAssessment
        distinguishing_aspect: |
          Entity domain RiskAssessment: identical factors input scored by the
          STANDARD variant yields 96/IMMINENT while the EXPEDITED variant
          (WEAPON_ACCESS/PLAN_SPECIFICITY only, x1.5, bonus 15) yields 15/LOW —
          two valid algorithms over the same inputs produce different numbers.
        test_recipe:
          setup:
            - "One case in UNDER_ASSESSMENT (screening SUBSTANTIVE with 3 true factors)"
            - "Logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "North HS", school_code: "NHS", enrollment_count: 1200 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-100", reporter_channel: "TIP_LINE", summary: "tip about violent plan" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "standard triage" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 3 }, { factor_code: "BEHAVIORAL_ESCALATION", severity: 3 }, { factor_code: "PEER_REPORTS", severity: 2 }, { factor_code: "SUPERVISION_GAP", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id, ra_std_score: $.data.raw_score, ra_std_level: $.data.risk_level }
          trigger:
            - call: "PUT /risk-assessments/${ra_id}"
              payload: { variant: "EXPEDITED" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_exp_score: $.data.raw_score, ra_exp_level: $.data.risk_level }
          assert:
            - "STANDARD create response: raw_score == 96, risk_level == IMMINENT (30+30+10+16 + 10 bonus)"
            - "PUT to EXPEDITED with unchanged factors: raw_score == 15, risk_level == LOW (0 counted factors x1.5 + 15 bonus)"
            - "RiskAssessment.${ra_id}.factors unchanged after the PUT (only variant replaced)"

      - name: monitoring_cadence_mode_divergence
        grounds:
          - calculations.monitoring_next_due_date
          - entities.ManagementPlan.fields.cadence_mode
          - state_machines.MonitoringCheckIn.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Entity domain ManagementPlan/MonitoringCheckIn (different from the
          RiskAssessment domain of the sibling instance): with anchor 2026-08-01,
          cadence 7 and an early completion on 2026-08-03, FROM_COMPLETION yields
          next due 2026-08-10 while FIXED_ANCHOR yields 2026-08-08 (the smallest
          grid date strictly after completion).
        test_recipe:
          setup:
            - "Two cases (A and B) both in PLAN_ACTIVE with MODERATE risk (score 30) and cadence_days 7; A's plan FROM_COMPLETION, B's plan FIXED_ANCHOR; both activated at 2026-08-01 so each has one auto-created check-in due 2026-08-08"
            - "Clock then advanced to 2026-08-03 (before either due date; no MISS sweep fires)"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "South MS", school_code: "SMS", enrollment_count: 800 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-200", reporter_channel: "STAFF_REFERRAL", summary: "case A" }
              as: IntakeCoordinator
              captures: { case_a: $.data.id }
            - call: "POST /threat-cases/${case_a}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_a}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_a}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_a: $.data.id }
            - call: "POST /risk-assessments/${ra_a}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_a}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_a}", cadence_mode: "FROM_COMPLETION", cadence_days: 7, conditions: ["weekly counselor check"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_a: $.data.id }
            - call: "GET /threat-cases/${case_a}"
              as: TeamLead
              captures: { case_a_v: $.data.version }
            - call: "POST /management-plans/${plan_a}/activate"
              payload: { expected_threat_case_version: "${case_a_v}" }
              as: TeamLead
              as_user_id: tl_1
            - call: "GET /threat-cases/${case_a}/monitoring-check-ins"
              as: ThreatAssessor
              captures: { chk_a : "$.data[0].id" }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-201", reporter_channel: "STAFF_REFERRAL", summary: "case B" }
              as: IntakeCoordinator
              captures: { case_b: $.data.id }
            - call: "POST /threat-cases/${case_b}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_b}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_b}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_b: $.data.id }
            - call: "POST /risk-assessments/${ra_b}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_b}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_b}", cadence_mode: "FIXED_ANCHOR", cadence_days: 7, conditions: ["weekly counselor check"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_b: $.data.id }
            - call: "GET /threat-cases/${case_b}"
              as: TeamLead
              captures: { case_b_v: $.data.version }
            - call: "POST /management-plans/${plan_b}/activate"
              payload: { expected_threat_case_version: "${case_b_v}" }
              as: TeamLead
              as_user_id: tl_1
            - call: "GET /threat-cases/${case_b}/monitoring-check-ins"
              as: ThreatAssessor
              captures: { chk_b : "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /monitoring-check-ins/${chk_a}/complete"
              payload: { outcome: "ON_TRACK", notes: "ok" }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /monitoring-check-ins/${chk_b}/complete"
              payload: { outcome: "ON_TRACK", notes: "ok" }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "GET /threat-cases/${case_a}/monitoring-check-ins"
              payload: { status: "SCHEDULED" }
              as: ThreatAssessor
              captures: { next_a_due : "$.data[0].due_date" }
            - call: "GET /threat-cases/${case_b}/monitoring-check-ins"
              payload: { status: "SCHEDULED" }
              as: ThreatAssessor
              captures: { next_b_due : "$.data[0].due_date" }
          assert:
            - "Case A successor check-in due_date == 2026-08-10 (FROM_COMPLETION: 2026-08-03 + 7)"
            - "Case B successor check-in due_date == 2026-08-08 (FIXED_ANCHOR: smallest 2026-08-01 + k*7 strictly after 2026-08-03)"
            - "The two due dates differ (2026-08-10 != 2026-08-08) for identical completion inputs"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_weighted_bonus_clamp_tiers
        grounds:
          - calculations.assessment_risk_score
          - entities.RiskAssessment.fields.raw_score
        distinguishing_aspect: |
          Mode (a): the formula combines >= 3 inputs (6 factor weights x severity
          0..3 plus a conditional sev-3 bonus) with non-linear interaction —
          conditional bonus branch, nested min/max clamp to [0,100], and tiered
          level selection; EXPEDITED also exercises the pinned round-half-up of
          the x1.5 product (52.5 -> 53).
        test_recipe:
          setup:
            - "One case in UNDER_ASSESSMENT; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "East HS", school_code: "EHS", enrollment_count: 1500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-300", reporter_channel: "TIP_LINE", summary: "combinatorial scoring" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "URGENT", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
          trigger:
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "PLAN_SPECIFICITY", severity: 3 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id, score_a: $.data.raw_score, level_a: $.data.risk_level }
            - call: "PUT /risk-assessments/${ra_id}"
              payload: { variant: "EXPEDITED", factors: [ { factor_code: "WEAPON_ACCESS", severity: 1 }, { factor_code: "PLAN_SPECIFICITY", severity: 1 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { score_b: $.data.raw_score, level_b: $.data.risk_level }
          assert:
            - "STANDARD with PLAN_SPECIFICITY sev 3: raw_score == 55 (45 + 10 bonus), risk_level == HIGH"
            - "EXPEDITED with WEAPON_ACCESS sev 1 + PLAN_SPECIFICITY sev 1: raw_score == 53 ((20+15) x 1.5 = 52.5, round_half_up), risk_level == HIGH"

      - name: annual_report_per_school_then_district_rounding
        grounds:
          - calculations.district_annual_report
        distinguishing_aspect: |
          Mode (b) nested rounding: the district rate rounds each per-school rate
          to 2 decimals FIRST and then averages (66.67), which differs from the
          raw-count aggregate (4/7 -> 57.14); the scaffold pins the per-school-
          first order and the zero-case school exclusion.
        test_recipe:
          setup:
            - "Schools A, B, C, D exist; logical clock set to 2026-03-01 (inside school year 2025-2026 = [2025-08-01, 2026-08-01))"
            - "A: 3 cases (2 SUBSTANTIVE, 1 NON_SUBSTANTIVE); B: 3 cases (1 SUBSTANTIVE, 2 NON_SUBSTANTIVE); C: 1 case (SUBSTANTIVE); D: 0 cases"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "School A", school_code: "SA", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { sch_a: $.data.id }
            - call: "POST /schools"
              payload: { name: "School B", school_code: "SB", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { sch_b: $.data.id }
            - call: "POST /schools"
              payload: { name: "School C", school_code: "SC", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { sch_c: $.data.id }
            - call: "POST /schools"
              payload: { name: "School D", school_code: "SD", enrollment_count: 500 }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_a}", subject_alias: "STU-A1", reporter_channel: "TIP_LINE", summary: "a1" }
              as: IntakeCoordinator
              captures: { ca1: $.data.id }
            - call: "POST /threat-cases/${ca1}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${ca1}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_a}", subject_alias: "STU-A2", reporter_channel: "TIP_LINE", summary: "a2" }
              as: IntakeCoordinator
              captures: { ca2: $.data.id }
            - call: "POST /threat-cases/${ca2}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${ca2}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_a}", subject_alias: "STU-A3", reporter_channel: "STAFF_REFERRAL", summary: "a3" }
              as: IntakeCoordinator
              captures: { ca3: $.data.id }
            - call: "POST /threat-cases/${ca3}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${ca3}/screening"
              payload: { threat_of_violence: true, weapon_mention: false, target_identified: false, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_b}", subject_alias: "STU-B1", reporter_channel: "TIP_LINE", summary: "b1" }
              as: IntakeCoordinator
              captures: { cb1: $.data.id }
            - call: "POST /threat-cases/${cb1}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${cb1}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_b}", subject_alias: "STU-B2", reporter_channel: "TIP_LINE", summary: "b2" }
              as: IntakeCoordinator
              captures: { cb2: $.data.id }
            - call: "POST /threat-cases/${cb2}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${cb2}/screening"
              payload: { threat_of_violence: true, weapon_mention: false, target_identified: false, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_b}", subject_alias: "STU-B3", reporter_channel: "TIP_LINE", summary: "b3" }
              as: IntakeCoordinator
              captures: { cb3: $.data.id }
            - call: "POST /threat-cases/${cb3}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${cb3}/screening"
              payload: { threat_of_violence: true, weapon_mention: false, target_identified: false, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_c}", subject_alias: "STU-C1", reporter_channel: "STAFF_REFERRAL", summary: "c1" }
              as: IntakeCoordinator
              captures: { cc1: $.data.id }
            - call: "POST /threat-cases/${cc1}/triage"
              payload: { triage_priority: "URGENT", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${cc1}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
          trigger:
            - call: "GET /annual-reports/district"
              payload: { school_year: "2025-2026" }
              as: TeamLead
              captures: { rep_total: $.data.total_cases, rep_subst: $.data.substantiated_cases, rep_rate: $.data.district_substantiation_rate }
          assert:
            - "report.total_cases == 7 and report.substantiated_cases == 4"
            - "report.per_school has exactly 3 entries (school D with 0 cases is excluded)"
            - "per-school rates: A == 66.67, B == 33.33, C == 100.00"
            - "district_substantiation_rate == 66.67 (mean of rounded per-school rates; raw-count aggregation would give 57.14)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: threat_case_close_reopen_cycle
        grounds:
          - state_machines.ThreatCase.PLAN_ACTIVE_to_CLOSED_MANAGED
          - state_machines.ThreatCase.CLOSED_MANAGED_to_TRIAGED
          - state_machines.MonitoringCheckIn.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          ThreatCase is cyclic with branching: the closed state is reversible
          (CLOSED_MANAGED -> TRIAGED on reopen) and closure cascades to
          SCHEDULED check-ins (CANCELLED) and plans (CLOSED); reopen clears
          closed_at/retention_purge_after back to null.
        test_recipe:
          setup:
            - "Case in PLAN_ACTIVE (MODERATE score 30, default cadence 14, FROM_COMPLETION) with one auto-created SCHEDULED check-in due 2026-08-15; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "West HS", school_code: "WHS", enrollment_count: 900 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-400", reporter_channel: "TIP_LINE", summary: "cycle case" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", conditions: ["counselor check"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_id: $.data.id }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_v: $.data.version }
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${case_v}" }
              as: TeamLead
              as_user_id: tl_1
          trigger:
            - call: "POST /threat-cases/${case_id}/close"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
              captures: { closed_status: $.data.status, closed_purge_after: $.data.retention_purge_after }
            - call: "GET /threat-cases/${case_id}/monitoring-check-ins"
              payload: { status: "CANCELLED" }
              as: TeamLead
              captures: { cancelled_count: $.data }
            - call: "POST /threat-cases/${case_id}/reopen"
              payload: {}
              as: IntakeCoordinator
              captures: { reopened_status: $.data.status }
          assert:
            - "close response: status == CLOSED_MANAGED, retention_purge_after == 2027-08-01 (2026-08-01 + 365 default retention days)"
            - "after close: GET monitoring-check-ins?status=CANCELLED returns exactly 1 item (the auto-created SCHEDULED check-in was cancelled by the cascade)"
            - "GET management-plans?status=CLOSED returns exactly 1 item (ACTIVE plan cascaded to CLOSED)"
            - "reopen response: status == TRIAGED, closed_at == null, retention_purge_after == null, consecutive_missed_count == 0, escalation_flag == false"

      - name: assessment_submit_return_loop
        grounds:
          - state_machines.RiskAssessment.DRAFT_to_SUBMITTED
          - state_machines.RiskAssessment.SUBMITTED_to_DRAFT
          - state_machines.RiskAssessment.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          RiskAssessment is cyclic (DRAFT -> SUBMITTED -> DRAFT revision loop)
          on a different entity than ThreatCase; after a return, the assessor
          updates factors via PUT (scores recomputed) and the loop closes with
          finalization that propagates risk_level to the case.
        test_recipe:
          setup:
            - "One case in UNDER_ASSESSMENT; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Central HS", school_code: "CHS", enrollment_count: 1100 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-500", reporter_channel: "STAFF_REFERRAL", summary: "revision loop" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { st1: $.data.status }
            - call: "POST /risk-assessments/${ra_id}/return"
              payload: { return_reason: "needs more interview data" }
              as: TeamLead
              as_user_id: tl_1
              captures: { st2: $.data.status }
            - call: "PUT /risk-assessments/${ra_id}"
              payload: { factors: [ { factor_code: "WEAPON_ACCESS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { score2: $.data.raw_score, level2: $.data.risk_level }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
              captures: { st3: $.data.status }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_level: $.data.risk_level }
          assert:
            - "first submit: status == SUBMITTED; return: status == DRAFT (loop back)"
            - "PUT after return recomputes: raw_score == 40, risk_level == HIGH (WEAPON_ACCESS sev 2)"
            - "finalize after re-submit: status == FINALIZED"
            - "ThreatCase.${case_id}.risk_level == HIGH after finalization"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: finalize_imminent_referral_escalation_cascade
        grounds:
          - state_machines.RiskAssessment.SUBMITTED_to_FINALIZED
          - state_machines.ManagementPlan
          - entities.Referral.fields.auto_created
        distinguishing_aspect: |
          Depth-4 chain triggered by IMMINENT finalization (different trigger
          than the clock-driven sibling): finalize -> ThreatCase.risk_level =
          IMMINENT -> auto-create URGENT LAW_ENFORCEMENT Referral -> case
          escalation_flag = true -> ACTIVE ManagementPlan.needs_review = true;
          each hop is caused by the previous link, and the prior FINALIZED
          assessment is SUPERSEDED.
        test_recipe:
          setup:
            - "Case in PLAN_ACTIVE: MODERATE assessment (30) finalized and plan (default cadence) activated at 2026-08-01; no referrals exist"
            - "A second DRAFT assessment with IMMINENT-scoring factors is submitted"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "North MS", school_code: "NMS", enrollment_count: 700 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-600", reporter_channel: "TIP_LINE", summary: "cascade case" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_old: $.data.id }
            - call: "POST /risk-assessments/${ra_old}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_old}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", conditions: ["counselor check"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_id: $.data.id }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_v: $.data.version }
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${case_v}" }
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "WEAPON_ACCESS", severity: 2 }, { factor_code: "PLAN_SPECIFICITY", severity: 2 }, { factor_code: "GRIEVANCE_HISTORY", severity: 1 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_new: $.data.id }
            - call: "POST /risk-assessments/${ra_new}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
          trigger:
            - call: "POST /risk-assessments/${ra_new}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
              captures: { fin_status: $.data.status, fin_score: $.data.raw_score, fin_level: $.data.risk_level }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_level: $.data.risk_level, case_esc: $.data.escalation_flag }
            - call: "GET /threat-cases/${case_id}/risk-assessments"
              payload: { status: "SUPERSEDED" }
              as: TeamLead
              captures: { superseded_id : "$.data[0].id" }
            - call: "GET /threat-cases/${case_id}/referrals"
              payload: { referral_type: "LAW_ENFORCEMENT", status: "SENT" }
              as: TeamLead
              captures: { le_ref_id : "$.data[0].id", le_ref_auto : "$.data[0].auto_created", le_ref_urgency : "$.data[0].urgency" }
            - call: "GET /threat-cases/${case_id}/management-plans"
              payload: { status: "ACTIVE" }
              as: TeamLead
              captures: { plan_needs_review : "$.data[0].needs_review" }
          assert:
            - "finalize response: status == FINALIZED, raw_score == 80, risk_level == IMMINENT"
            - "ThreatCase.${case_id}: risk_level == IMMINENT, escalation_flag == true"
            - "GET risk-assessments?status=SUPERSEDED returns exactly the old assessment ${ra_old} (superseded_at set)"
            - "GET referrals?referral_type=LAW_ENFORCEMENT&status=SENT returns exactly 1 auto-created URGENT referral (auto_created == true, urgency == URGENT)"
            - "GET management-plans?status=ACTIVE returns the plan with needs_review == true (escalation propagated to the plan)"

      - name: missed_checkin_counter_escalation_cascade
        grounds:
          - state_machines.MonitoringCheckIn.SCHEDULED_to_MISSED
          - state_machines.MonitoringCheckIn.MISSED_to_SCHEDULED
          - entities.ThreatCase.fields.consecutive_missed_count
        distinguishing_aspect: |
          Depth-2 chain triggered by clock advance (different trigger than
          finalization): clock -> check-in MISSED -> case.consecutive_missed_count
          += 1 -> at count >= 2 the case.escalation_flag flips true with an
          ESCALATION_RAISED audit event; reschedule in between does NOT reset
          the counter.
        test_recipe:
          setup:
            - "Case in PLAN_ACTIVE (MODERATE, default cadence 14) with one auto-created check-in due 2026-08-15; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "South HS", school_code: "SHS", enrollment_count: 1300 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-700", reporter_channel: "TIP_LINE", summary: "miss cascade" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", conditions: ["counselor check"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_id: $.data.id }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_v: $.data.version }
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${case_v}" }
              as: TeamLead
              as_user_id: tl_1
            - call: "GET /threat-cases/${case_id}/monitoring-check-ins"
              as: ThreatAssessor
              captures: { chk_id : "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { misses_1: $.data.consecutive_missed_count, esc_1: $.data.escalation_flag }
            - call: "POST /monitoring-check-ins/${chk_id}/reschedule"
              payload: { new_due_date: "2026-08-16" }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { misses_2: $.data.consecutive_missed_count, esc_2: $.data.escalation_flag }
            - call: "GET /threat-cases/${case_id}/audit-events"
              payload: { action: "ESCALATION_RAISED" }
              as: TeamLead
          assert:
            - "after first clock advance: check-in ${chk_id} is MISSED, consecutive_missed_count == 1, escalation_flag == false"
            - "reschedule succeeds (MISSED -> SCHEDULED) and does not reset the counter"
            - "after second clock advance: consecutive_missed_count == 2, escalation_flag == true"
            - "GET audit-events?action=ESCALATION_RAISED returns exactly 1 event"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: reentry_approve_state_error_beats_sod
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.ReEntryPlan.PROPOSED_to_DENIED
        distinguishing_aspect: |
          Error-category pair state vs business_safety: approving a DENIED
          re-entry plan as the SAME user who proposed it violates both the
          PROPOSED-state precondition (priority 4) and segregation of duties
          (priority 5); the state error ERR_REENTRY_NOT_PROPOSED wins.
        test_recipe:
          setup:
            - "Case in REMOVED (removed from UNDER_ASSESSMENT by TeamLead tl_1)"
            - "Re-entry plan proposed by ThreatAssessor ta_1, then DENIED by TeamLead tl_1"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln HS", school_code: "LHS", enrollment_count: 1000 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-800", reporter_channel: "TIP_LINE", summary: "priority case" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
