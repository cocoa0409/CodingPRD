            - "Candidate.${cand2}.status == NOT_SELECTED"
            - "Case.${c_id}.status == APPOINTED"
            - "Case.${c_id}.appointed_neutral_id == ${n1}"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fee_charge_state_precedes_insufficient_deposit
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_DEPOSIT]
        distinguishing_aspect: |
          A FILED case receiving a 50_000_000-cent fee charge against a zero balance violates
          BOTH state (priority 6, case not APPOINTED/HEARING) and business_fiscal (priority 10,
          amount > balance); state wins => ERR_INVALID_STATE, not ERR_INSUFFICIENT_DEPOSIT.
        test_recipe:
          setup:
            - "A rostered ARBITRATOR and a freshly FILED case (never advanced to SELECTION)"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb Fin", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "StateFisc", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id, cv1: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/fee-charges"
              payload: { neutral_id: "${n_id}", hours: 1000, expected_case_version: "${cv1}" }
              as: CaseAdministrator
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: hearing_notice_precedes_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_HEARING_NOTICE_TOO_SHORT]
          - errors[ERR_HEARING_OVERLAP]
        distinguishing_aspect: |
          A second hearing that both under-notices (start < clock+7d) AND overlaps an existing
          hearing violates business_temporal (priority 8) and business_constraint (priority 9);
          temporal wins => ERR_HEARING_NOTICE_TOO_SHORT, a different category pair than state/fiscal.
        test_recipe:
          setup:
            - "Appointed ARBITRATION case in HEARING; clock 2026-06-01; one SCHEDULED hearing 2026-06-15 09:00-11:00"
            - "Clock then advanced to 2026-06-14 so 2026-06-15 is inside the 7-day notice window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /neutrals"
              payload: { full_name: "Arb Tmp", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "TmpCon", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-15T09:00:00Z", end_at: "2026-06-15T11:00:00Z", location: "Room A" }
              as: CaseAdministrator
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: CaseAdministrator
          trigger:
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T12:00:00Z", location: "Room B" }
              as: CaseAdministrator
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_HEARING_NOTICE_TOO_SHORT"

