  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: coverage_closed_interval_adjacency_overlaps
        grounds:
          - validations[priority=18]
          - entities.Coverage.fields.effective_date
          - entities.Coverage.fields.term_date
          - errors[ERR_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          Coverage intervals are CLOSED [effective_date, term_date]: a new
          coverage whose effective_date == an existing coverage's term_date
          (2026-06-30) is rejected (shared endpoint counts), but a gap of one day
          (2026-07-01) is accepted.
        test_recipe:
          setup:
            - "Coverage A for patient+plan spans 2026-01-01..2026-06-30 (ACTIVE at default clock)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Ov", date_of_birth: "1980-01-01", email: "ov@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-06-30" }
              as: FrontOffice
              captures: { covA_id: $.data.id }
          trigger:
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "SECONDARY", subscriber_id: "S1", effective_date: "2026-06-30", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { err: $.data.error_id }
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "SECONDARY", subscriber_id: "S1", effective_date: "2026-07-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { covC_id: $.data.id }
          assert:
            - "Adjacent coverage (effective 2026-06-30) -> HTTP 409, response.data.error_id == ERR_COVERAGE_OVERLAP"
            - "Gapped coverage (effective 2026-07-01) -> HTTP 201, Coverage created"

      - name: membership_half_open_interval_adjacency_allowed
        grounds:
          - validations[priority=19]
          - entities.Membership.fields.period_start
          - entities.Membership.fields.period_end
          - errors[ERR_MEMBERSHIP_OVERLAP]
        distinguishing_aspect: |
          Membership intervals are HALF-OPEN [period_start, period_end): a new
          membership starting exactly at an existing one's period_end (2026-08-01)
          is ACCEPTED (adjacency, unlike coverage), while an interior overlap
          (2026-07-01) is rejected.
        test_recipe:
          setup:
            - "Membership M1 spans 2026-05-01..2026-08-01 at default clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingManager
            - call: "POST /patients"
              payload: { full_name: "Pat Mo", date_of_birth: "1980-01-01", email: "mo@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /membership-plans"
              payload: { name: "Basic", annual_fee_cents: 30000, billing_period: "MONTHLY" }
              as: BillingManager
              captures: { mp_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pid}", membership_plan_id: "${mp_id}", period_start: "2026-05-01", period_end: "2026-08-01" }
              as: FrontOffice
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { patient_id: "${pid}", membership_plan_id: "${mp_id}", period_start: "2026-08-01", period_end: "2026-11-01" }
              as: FrontOffice
              captures: { m2: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pid}", membership_plan_id: "${mp_id}", period_start: "2026-07-01", period_end: "2026-10-01" }
              as: FrontOffice
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent membership (start 2026-08-01) -> HTTP 201, Membership created"
            - "Interior membership (start 2026-07-01) -> HTTP 409, response.data.error_id == ERR_MEMBERSHIP_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: insurance_reversal_conserves_benefits_pool
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - entities.Coverage.fields.benefits_used_cents
        distinguishing_aspect: |
          Conserved quantity = Coverage.benefits_used_cents (insurance benefit
          pool): 0 -> 57500 (post) -> 0 (reverse). The reversal leaves the pool
          exactly at its pre-post value with zero drift.
        test_recipe:
          setup:
            - "Crown claim adjudicated (benefits_used 57500, deductible_met 5000, patient balance 72500); then reverse the EOB payment."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Rv", date_of_birth: "1980-01-01", email: "rv@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, deductible_cents: 5000, major_coinsurance_pct: 50 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 57500, claim_id: "${claim_id}", is_denial: false, eob_lines: [ { cdt_code: "D2740", allowed_cents: 120000, paid_cents: 57500, deductible_applied_cents: 5000 } ] }
              as: BillingManager
              as_user_id: "mgr_bob"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              as: BillingManager
          assert:
            - "Coverage.${cov_id}.benefits_used_cents == 0 after reversal (restored to pre-post value)"
            - "Coverage.${cov_id}.deductible_met_cents == 0 after reversal"
            - "Claim.${claim_id}.status == SUBMITTED and paid_insurance_cents == 0 after reversal"
            - "Patient.${pid}.balance_cents == 0 after reversal"

      - name: patient_payment_reversal_conserves_patient_dues
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - state_machines.Claim.ADJUDICATED_to_CLOSED
          - entities.Patient.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = Patient.balance_cents (patient dues ledger, a
          different quantity than the benefits pool): 72500 -> 0 (patient pays)
          -> 72500 (reverse). No drift; the claim also reverts CLOSED->ADJUDICATED.
        test_recipe:
          setup:
            - "Crown claim adjudicated (patient portion 72500); patient pays 72500 (claim CLOSED); then reverse the patient payment."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Pr", date_of_birth: "1980-01-01", email: "pr@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, deductible_cents: 5000, major_coinsurance_pct: 50 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 57500, claim_id: "${claim_id}", is_denial: false, eob_lines: [ { cdt_code: "D2740", allowed_cents: 120000, paid_cents: 57500, deductible_applied_cents: 5000 } ] }
              as: BillingManager
              as_user_id: "mgr_bob"
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "PATIENT", amount_cents: 72500, claim_id: "${claim_id}" }
              as: Patient
              as_user_id: "${pid}"
              captures: { ppay_id: $.data.id }
          trigger:
            - call: "POST /payments/${ppay_id}/reverse"
              as: BillingManager
          assert:
            - "Patient.${pid}.balance_cents == 72500 after reversal (restored to pre-patient-payment value)"
            - "Claim.${claim_id}.patient_paid_cents == 0 and status == ADJUDICATED after reversal"
