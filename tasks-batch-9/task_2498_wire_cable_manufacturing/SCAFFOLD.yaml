scenario: |
  Generate task harder than expert level!

  2498. Wire & Cable Manufacturing (wire and cable manufacturer): copper and aluminum rod procurement with metal price pass-through mechanisms in customer pricing, drawing, stranding and insulation extrusion with dimensional and concentricity control, compound formulation for insulation and jacket by application rating with flame and temperature performance, cable testing including spark testing, high potential testing and partial discharge for medium voltage products, listing agency certification with follow-up factory inspections, reel management, cut-to-length service and reel return programs, product marking and traceability requirements for building wire, inventory positioning by construction market demand and metal price volatility

domain_name: wire-cable-manufacturing
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # flat: 13 peer entities linked by explicit foreign keys; every collection is a
  # top-level path (`/production-lots`, `/reels`, `/shipments`). Only append-only
  # children (FactoryInspection, CableTest, ReelReturn) are addressed as
  # sub-resources of their parent, and never nested two levels deep.

  state_machine_shape: cyclic
  # cyclic + parallel: ProductionLot carries two independent dimensions
  # (process_state x quality_state) with a NONCONFORMING -> REWORK -> PENDING loop
  # that rewinds process_state; Reel cycles AVAILABLE -> LOADED -> SHIPPED ->
  # RETURN_PENDING -> AVAILABLE; ListingCertification cycles
  # ACTIVE -> VARIATION_NOTICE -> ACTIVE and SUSPENDED -> ACTIVE; CustomerOrder
  # carries parallel pricing_status x fulfillment_status dimensions.

  relationship_patterns:
    - one_to_many        # CustomerOrder -> ProductionLot, ListingCertification -> FactoryInspection
    - cross_aggregate    # ProductionLot -> RodPurchaseLot (metal mass ledger), Reel -> Customer (deposit ledger)
    - self_referential   # ProductionLot line occupancy is checked against sibling ProductionLot windows on the same line_code

  role_model: segregation_of_duties
  # The QualityEngineer who recorded any CableTest on a lot may not be the
  # QualityEngineer who releases that lot (ERR_SEGREGATION_OF_DUTIES).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MetalPriceQuote
    parent: null
    common_fields: false
    fields:
      - name: metal
        type: enum
        source: input
        description: Metal the settlement price applies to
        constraints: "one of {COPPER, ALUMINUM}"
      - name: effective_date
        type: string
        source: input
        description: Settlement date the quote applies to, format YYYY-MM-DD
        constraints: "unique together with metal; ERR_DUPLICATE_METAL_QUOTE on repeat"
      - name: settlement_price_usd_per_lb
        type: number
        source: input
        description: Published settlement price in USD per pound, 2 decimal places
        constraints: "> 0"
      - name: source
        type: enum
        source: input
        description: Publication the quote was taken from
        default: COMEX
        constraints: "one of {COMEX, LME, MW_TRANSACTION}"

  - name: RodPurchaseLot
    parent: null
    common_fields: true
    fields:
      - name: metal
        type: enum
        source: input
        description: Metal of the purchased rod
        constraints: "one of {COPPER, ALUMINUM}"
      - name: supplier_code
        type: string
        source: input
        description: Rod mill supplier code
      - name: rod_diameter_mm
        type: number
        source: input
        description: As-received rod diameter in millimetres
        constraints: "> 0"
      - name: heat_number
        type: string
        source: input
        description: Mill heat number, first half of every downstream traceability_code
      - name: purchase_weight_lbs
        type: number
        source: input
        description: As-received rod mass in pounds; the conserved total of the metal mass ledger
        constraints: "> 0"
      - name: purchase_price_usd_per_lb
        type: number
        source: input
        description: Paid rod price in USD per pound
        constraints: "> 0"
      - name: pricing_basis
        type: enum
        source: input
        description: Basis the rod purchase price was struck on
        constraints: "one of {SPOT, MONTH_AVG}"
      - name: received_date
        type: string
        source: input
        description: Receiving date, format YYYY-MM-DD
      - name: remaining_lbs
        type: number
        source: computed
        description: "Uncommitted rod mass; initialised to purchase_weight_lbs (calculations.rod_mass_ledger)"
        default: 0
      - name: committed_lbs
        type: number
        source: computed
        description: "Rod mass committed to ProductionLots that are neither scrapped nor cancelled (calculations.rod_mass_ledger)"
        default: 0
      - name: scrapped_lbs
        type: number
        source: computed
        description: "Rod mass written off by SCRAPPED dispositions (calculations.rod_mass_ledger)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: Rod lot lifecycle state
        default: RECEIVED
        constraints: "one of {RECEIVED, CONSUMED, QUARANTINED}"

  - name: Compound
    parent: null
    common_fields: true
    fields:
      - name: compound_code
        type: string
        source: input
        description: Internal formulation code
      - name: layer_role
        type: enum
        source: input
        description: Which cable layer this compound is formulated for
        constraints: "one of {INSULATION, JACKET}"
      - name: temp_rating_c
        type: integer
        source: input
        description: Continuous temperature rating in degrees Celsius
        constraints: "one of {60, 75, 90, 105}"
      - name: flame_test
        type: enum
        source: input
        description: Highest flame test the formulation is qualified against
        constraints: "one of {NONE, VW_1, FT4, CT}"
      - name: max_voltage_v
        type: integer
        source: input
        description: Maximum voltage rating the formulation is qualified for
        constraints: "one of {600, 5000, 15000, 35000}"
      - name: wet_rated
        type: boolean
        source: input
        description: Whether the formulation is qualified for wet locations
        default: false
      - name: filler_pct
        type: number
        source: input
        description: Mineral filler loading percentage
        default: 0
        constraints: "0 <= filler_pct <= 40"
      - name: qualification_date
        type: string
        source: computed
        description: Date of the most recent qualification, format YYYY-MM-DD; null while DRAFT
      - name: suspension_reason
        type: string
        source: computed
        description: Reason recorded by the most recent suspension; null when never suspended
      - name: status
        type: enum
        source: computed
        description: Formulation qualification state
        default: DRAFT
        constraints: "one of {DRAFT, QUALIFIED, SUSPENDED}"

  - name: ListingCertification
    parent: null
    common_fields: true
    fields:
      - name: agency
        type: enum
        source: input
        description: Listing agency that owns the file
        constraints: "one of {UL, CSA, ETL}"
      - name: file_number
        type: string
        source: input
        description: Agency file number, printed verbatim in required_marking_text
      - name: product_family_code
        type: string
        source: input
        description: Agency product family the file covers
      - name: initial_listing_date
        type: string
        source: input
        description: Date the file was first listed, format YYYY-MM-DD
      - name: inspection_interval_days
        type: integer
        source: input
        description: Follow-up factory inspection interval in days
        default: 90
        constraints: ">= 30"
      - name: last_inspection_date
        type: string
        source: computed
        description: inspection_date of the most recently recorded FactoryInspection; null before the first one
      - name: next_inspection_due_date
        type: string
        source: computed
        description: "last_inspection_date + inspection_interval_days (calculations.inspection_cadence); null before the first inspection"
      - name: open_variation_count
        type: integer
        source: computed
        description: Number of FactoryInspection rows on this file with status OPEN
        default: 0
      - name: status
        type: enum
        source: computed
        description: Listing file state
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, VARIATION_NOTICE, SUSPENDED}"

  - name: FactoryInspection
    parent: ListingCertification
    common_fields: true
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> ListingCertification.id; the listing file inspected"
      - name: inspection_date
        type: string
        source: input
        description: Date the follow-up inspection took place, format YYYY-MM-DD
      - name: inspector_code
        type: string
        source: input
        description: Agency inspector code
      - name: findings_count
        type: integer
        source: input
        description: Number of findings written up
        constraints: ">= 0"
      - name: outcome
        type: enum
        source: input
        description: Inspector's disposition of the visit
        constraints: "one of {PASS, VARIATION, SUSPEND}"
      - name: corrective_action_due_date
        type: string
        source: computed
        description: "inspection_date + 30 days when outcome != PASS, else null (calculations.inspection_cadence)"
      - name: status
        type: enum
        source: computed
        description: Whether the findings of this visit are still open
        default: CLOSED
        constraints: "one of {OPEN, CLOSED}"

  - name: CatalogProduct
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: Catalog SKU code
        constraints: "unique; ERR_DUPLICATE_PRODUCT_CODE on repeat"
      - name: awg_size
        type: string
        source: input
        description: Conductor size label printed in required_marking_text, e.g. "12" or "4/0"
      - name: conductor_metal
        type: enum
        source: input
        description: Conductor metal; selects which MetalPriceQuote series prices this product
        constraints: "one of {COPPER, ALUMINUM}"
      - name: conductor_construction
        type: enum
        source: input
        description: Conductor construction; SOLID skips the stranding step
        constraints: "one of {SOLID, STRANDED_7, STRANDED_19, COMPRESSED_37}"
      - name: application_rating
        type: enum
        source: input
        description: Application rating the construction is sold against
        constraints: "one of {THHN, THWN_2, XHHW_2, USE_2, MV_105, SOOW}"
      - name: voltage_class
        type: enum
        source: input
        description: Voltage class; drives voltage_rating_v, hipot level and partial-discharge requirement
        constraints: "one of {LV_600, MV_5KV, MV_15KV, MV_35KV}"
      - name: temp_rating_c
        type: integer
        source: input
        description: Temperature rating claimed on the print
        constraints: "one of {60, 75, 90, 105}"
      - name: insulation_thickness_mils
        type: number
        source: input
        description: Nominal insulation wall thickness in mils
        constraints: "> 0"
      - name: min_wall_pct
        type: number
        source: input
        description: Minimum wall as a percentage of insulation_thickness_mils
        default: 90
        constraints: "80 <= min_wall_pct <= 100"
      - name: concentricity_min_pct
        type: number
        source: input
        description: Minimum accepted concentricity percentage
        default: 85
        constraints: "50 <= concentricity_min_pct <= 100"
      - name: conductor_lbs_per_kft
        type: number
        source: input
        description: Metal content in pounds per 1000 feet; the pass-through multiplier and the rod-consumption factor
        constraints: "> 0"
      - name: insulation_compound_id
        type: string
        source: input
        description: "FK -> Compound.id; must have layer_role INSULATION"
      - name: jacket_compound_id
        type: string
        source: input
        description: "FK -> Compound.id; nullable; must have layer_role JACKET when present"
        default: null
      - name: listing_certification_id
        type: string
        source: input
        description: "FK -> ListingCertification.id; the listing file this SKU is built under"
      - name: base_target_kft
        type: number
        source: input
        description: Baseline finished-goods inventory target in thousands of feet
        constraints: "> 0"
      - name: demand_index
        type: number
        source: input
        description: Construction-market demand index for this SKU
        default: 1.0
        constraints: "> 0"
      - name: pinned_insulation_compound_version
        type: integer
        source: computed
        description: Compound.version of insulation_compound_id captured at release; null while DRAFT
      - name: pinned_jacket_compound_version
        type: integer
        source: computed
        description: Compound.version of jacket_compound_id captured at release; null when no jacket or while DRAFT
      - name: voltage_rating_v
        type: integer
        source: computed
        description: "Volt value derived from voltage_class (calculations.required_marking_text constants)"
      - name: marking_required
        type: boolean
        source: computed
        description: "true iff application_rating IN {THHN, THWN_2, XHHW_2, USE_2} (building wire)"
      - name: pd_test_required
        type: boolean
        source: computed
        description: "true iff voltage_class IN {MV_5KV, MV_15KV, MV_35KV}"
      - name: required_marking_text
        type: string
        source: computed
        description: "Exact surface print string every lot must carry (calculations.required_marking_text)"
      - name: volatility_index
        type: number
        source: computed
        description: "Metal price volatility of conductor_metal at the last reposition run (calculations.metal_volatility_index)"
        default: 0
      - name: target_inventory_kft
        type: number
        source: computed
        description: "Repositioned inventory target (calculations.inventory_reposition_target)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: SKU release state
        default: DRAFT
        constraints: "one of {DRAFT, RELEASED, SUSPENDED, OBSOLETE}"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: account_code
        type: string
        source: input
        description: Customer account code
      - name: name
        type: string
        source: input
        description: Customer legal name
      - name: market_region
        type: enum
        source: input
        description: Construction market region
        constraints: "one of {NORTHEAST, SOUTHEAST, MIDWEST, WEST}"
      - name: credit_limit_usd
        type: number
        source: input
        description: Total credit exposure ceiling in USD
        constraints: ">= 0"
      - name: pass_through_enabled
        type: boolean
        source: input
        description: Whether metal price pass-through applies to this account
        default: true
      - name: reel_program
        type: enum
        source: input
        description: Reel return program the account is enrolled in
        default: RETURNABLE
        constraints: "one of {RETURNABLE, NON_RETURNABLE}"
      - name: open_ar_usd
        type: number
        source: computed
        description: "Sum of invoice_amount_usd over the account's Shipments with status INVOICED (calculations.customer_credit_exposure)"
        default: 0
      - name: deposit_charged_total_usd
        type: number
        source: computed
        description: "Lifetime sum of reel deposits charged to the account (conserved total of the deposit ledger)"
        default: 0
      - name: reel_deposit_balance_usd
        type: number
        source: computed
        description: "Deposits still outstanding on reels the account holds (calculations.reel_deposit_refund)"
        default: 0
      - name: credit_memo_balance_usd
        type: number
        source: computed
        description: "Deposit refunds credited back to the account (calculations.reel_deposit_refund)"
        default: 0
      - name: forfeited_deposit_total_usd
        type: number
        source: computed
        description: "Deposit value forfeited on late or damaged returns (calculations.reel_deposit_refund)"
        default: 0
      - name: credit_exposure_usd
        type: number
        source: computed
        description: "open_ar_usd + reel_deposit_balance_usd - credit_memo_balance_usd (calculations.customer_credit_exposure)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: Account state; CREDIT_HOLD blocks new shipments
        default: ACTIVE
        constraints: "one of {ACTIVE, CREDIT_HOLD}"

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the ordering account"
      - name: product_id
        type: string
        source: input
        description: "FK -> CatalogProduct.id; the ordered SKU"
      - name: order_number
        type: string
        source: input
        description: Customer purchase order number
      - name: ordered_kft
        type: number
        source: input
        description: Ordered length in thousands of feet
        constraints: "> 0"
      - name: price_basis
        type: enum
        source: input
        description: Metal pass-through basis; selects the shipment_invoice_amount variant
        constraints: "one of {ORDER_DATE_LOCK, SHIP_DATE_FLOAT}"
      - name: conversion_price_usd_per_kft
        type: number
        source: input
        description: Non-metal conversion price per thousand feet
        constraints: "> 0"
      - name: cut_to_length_service
        type: boolean
        source: input
        description: Whether the order is shipped as discrete cut lengths
        default: false
      - name: requested_cut_lengths_ft
        type: array
        source: input
        description: Ordered list of requested cut segment lengths in feet; required and non-empty when cut_to_length_service is true
        default: []
      - name: order_date
        type: string
        source: input
        description: Effective pricing date of the order, format YYYY-MM-DD; selects the metal quote and may be earlier than the logical-clock date
      - name: quoted_metal_price_usd_per_lb
        type: number
        source: computed
        description: "Metal price selected at order creation (calculations.order_quoted_total); the locked price for ORDER_DATE_LOCK invoices"
      - name: quoted_unit_price_usd_per_kft
        type: number
        source: computed
        description: "Quoted unit price, 4 decimal places (calculations.order_quoted_total)"
      - name: quoted_subtotal_usd
        type: number
        source: computed
        description: "Pre-surcharge quoted extension, 2 decimal places; the tier key for the volatility surcharge"
      - name: quoted_surcharge_usd
        type: number
        source: computed
        description: "Metal volatility surcharge on the quote (calculations.order_quoted_total)"
      - name: quoted_total_usd
        type: number
        source: computed
        description: "quoted_subtotal_usd + quoted_cut_fee_usd + quoted_surcharge_usd (calculations.order_quoted_total)"
      - name: quoted_cut_fee_usd
        type: number
        source: computed
        description: "Cut-to-length service fee on the quote (calculations.order_quoted_total)"
        default: 0
      - name: shipped_kft
        type: number
        source: computed
        description: Sum of shipped_length_ft / 1000 over the order's Shipments
        default: 0
      - name: invoiced_total_usd
        type: number
        source: computed
        description: Sum of invoice_amount_usd over the order's Shipments with status INVOICED
        default: 0
      - name: hold_reason
        type: string
        source: computed
        description: Reason recorded when pricing_status moved to HELD; null otherwise
      - name: pricing_status
        type: enum
        source: computed
        description: Pricing dimension of the order state
        default: QUOTED
        constraints: "one of {QUOTED, LOCKED, HELD, INVOICED}"
      - name: fulfillment_status
        type: enum
        source: computed
        description: Fulfillment dimension of the order state, independent of pricing_status
        default: OPEN
        constraints: "one of {OPEN, PARTIALLY_SHIPPED, FULFILLED, CANCELLED}"

  - name: ProductionLot
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> CatalogProduct.id; the SKU being manufactured"
      - name: rod_lot_id
        type: string
        source: input
        description: "FK -> RodPurchaseLot.id; the rod the conductor is drawn from"
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; nullable for stock production"
        default: null
      - name: lot_code
        type: string
        source: input
        description: Plant lot code, second half of traceability_code
      - name: planned_length_ft
        type: number
        source: input
        description: Planned finished length in feet
        constraints: "> 0"
      - name: line_code
        type: string
        source: input
        description: Extrusion line the lot occupies; the resource key for line occupancy conflicts
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Start of the lot's occupancy of line_code, ISO 8601 UTC
      - name: scheduled_end_at
        type: datetime
        source: input
        description: End of the lot's occupancy of line_code, ISO 8601 UTC
        constraints: "must be strictly after scheduled_start_at"
      - name: consumed_rod_lbs
        type: number
        source: computed
        description: "round(planned_length_ft / 1000 * CatalogProduct.conductor_lbs_per_kft, 2) (calculations.rod_mass_ledger)"
      - name: measured_min_wall_mils
        type: number
        source: computed
        description: Minimum insulation wall recorded at the EXTRUSION step; null before it
      - name: measured_max_wall_mils
        type: number
        source: computed
        description: Maximum insulation wall recorded at the EXTRUSION step; null before it
      - name: measured_avg_od_mm
        type: number
        source: computed
        description: Average finished outside diameter recorded at the EXTRUSION step; null before it
      - name: concentricity_pct
        type: number
        source: computed
        description: "round(100 * measured_min_wall_mils / measured_max_wall_mils, 2) (calculations.lot_dimensional_conformance)"
      - name: surface_marking_text
        type: string
        source: computed
        description: Surface print recorded at the EXTRUSION step; must equal CatalogProduct.required_marking_text when marking_required
      - name: traceability_code
        type: string
        source: computed
        description: "RodPurchaseLot.heat_number + '-' + lot_code (calculations.traceability_code)"
      - name: packaged_length_ft
        type: number
        source: computed
        description: Length already loaded onto reels
        default: 0
      - name: rework_count
        type: integer
        source: computed
        description: Number of REWORK dispositions applied to this lot
        default: 0
      - name: released_by_user_id
        type: string
        source: computed
        description: X-User-ID of the QualityEngineer who released the lot; null before release
      - name: process_state
        type: enum
        source: computed
        description: Manufacturing dimension of the lot state
        default: QUEUED
        constraints: "one of {QUEUED, DRAWN, STRANDED, EXTRUDED, TESTED, PACKAGED, SHIPPED, SCRAP_CLOSED}"
      - name: quality_state
        type: enum
        source: computed
        description: Quality dimension of the lot state, independent of process_state
        default: PENDING
        constraints: "one of {PENDING, CONFORMING, NONCONFORMING, REWORK, QUARANTINED, SCRAPPED}"

  - name: CableTest
    parent: ProductionLot
    common_fields: false
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; the lot under test"
      - name: test_type
        type: enum
        source: input
        description: Electrical test performed
        constraints: "one of {SPARK, HIPOT, PARTIAL_DISCHARGE}"
      - name: operator_user_id
        type: string
        source: system
        description: X-User-ID of the QualityEngineer who recorded the test; blocks that user from releasing the lot
      - name: test_voltage_kv
        type: number
        source: input
        description: Applied test voltage in kilovolts; null for SPARK and PARTIAL_DISCHARGE rows
        default: null
        constraints: "> 0 when present; mandatory when test_type is HIPOT"
      - name: faults_detected
        type: integer
        source: input
        description: Spark-test fault count
        default: 0
        constraints: ">= 0"
      - name: breakdown_detected
        type: boolean
        source: input
        description: Whether the high-potential test broke down
        default: false
      - name: pd_level_pc
        type: number
        source: input
        description: Partial discharge level in picocoulombs; required for PARTIAL_DISCHARGE tests
        default: null
      - name: duration_sec
        type: integer
        source: input
        description: Test duration in seconds
        constraints: "> 0"
      - name: tested_at
        type: datetime
        source: system
        description: Logical-clock instant the test was recorded, ISO 8601 UTC
      - name: result
        type: enum
        source: computed
        description: "Pass/fail verdict (calculations.cable_test_result)"
        constraints: "one of {PASS, FAIL}"

  - name: Reel
    parent: null
    common_fields: true
    fields:
      - name: reel_serial
        type: string
        source: input
        description: Reel serial number
      - name: reel_type
        type: enum
        source: input
        description: Reel type; selects the deposit refund variant
        constraints: "one of {WOOD_RETURNABLE, STEEL_RETURNABLE, NON_RETURNABLE}"
      - name: deposit_usd
        type: number
        source: input
        description: Deposit charged to the customer when the reel ships
        constraints: ">= 0; must be exactly 0 when reel_type is NON_RETURNABLE"
      - name: capacity_ft
        type: number
        source: input
        description: Maximum loadable length in feet
        constraints: "> 0"
      - name: current_lot_id
        type: string
        source: computed
        description: "FK -> ProductionLot.id; nullable; the lot currently loaded on the reel"
        default: null
      - name: held_by_customer_id
        type: string
        source: computed
        description: "FK -> Customer.id; nullable; the account holding the reel while it is out"
        default: null
      - name: loaded_length_ft
        type: number
        source: computed
        description: Length currently loaded on the reel
        default: 0
      - name: occupancy_start_at
        type: datetime
        source: input
        description: Start of the current occupancy window, taken verbatim from the load request
      - name: occupancy_end_at
        type: datetime
        source: computed
        description: Planned end of the current occupancy window, taken from the load request
      - name: shipped_at
        type: datetime
        source: computed
        description: Logical-clock instant the reel shipped; the day-count origin for refunds
      - name: returned_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent return; the exclusive lower bound for the next occupancy
      - name: cycle_count
        type: integer
        source: computed
        description: Number of completed ship-and-return cycles
        default: 0
      - name: last_return_condition
        type: enum
        source: computed
        description: Condition recorded on the most recent return; null when never returned
        constraints: "one of {GOOD, DAMAGED}"
      - name: status
        type: enum
        source: computed
        description: Reel lifecycle state
        default: AVAILABLE
        constraints: "one of {AVAILABLE, LOADED, SHIPPED, RETURN_PENDING, DAMAGED, RETIRED}"

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; the order being shipped against"
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; the lot being shipped"
      - name: reel_id
        type: string
        source: input
        description: "FK -> Reel.id; the reel the lot ships on"
      - name: shipped_length_ft
        type: number
        source: input
        description: Shipped length in feet
        constraints: "> 0"
      - name: cuts_count
        type: integer
        source: input
        description: Number of cut segments produced for cut-to-length orders
        default: 0
        constraints: ">= 0"
      - name: ship_date
        type: string
        source: input
        description: Effective ship date, format YYYY-MM-DD; anchors the SHIP_DATE_FLOAT window and may be earlier than the logical-clock date
      - name: deposit_charged_usd
        type: number
        source: computed
        description: Reel deposit charged to the customer by this shipment
        default: 0
      - name: metal_price_used_usd_per_lb
        type: number
        source: computed
        description: "Metal price the invoice was struck on (calculations.shipment_invoice_amount); null before invoicing"
      - name: price_variant_applied
        type: enum
        source: computed
        description: Which invoice variant produced the amounts; null before invoicing
        constraints: "one of {ORDER_DATE_LOCK, SHIP_DATE_FLOAT}"
      - name: unit_price_usd_per_kft
        type: number
        source: computed
        description: "Invoiced unit price, 4 decimal places (calculations.shipment_invoice_amount)"
      - name: extended_amount_usd
        type: number
        source: computed
        description: "Metal-and-conversion extension, 2 decimal places; the surcharge tier key"
      - name: cut_fee_usd
        type: number
        source: computed
        description: "Cut-to-length service fee on this shipment"
        default: 0
      - name: volatility_surcharge_usd
        type: number
        source: computed
        description: "Metal volatility surcharge on this shipment (calculations.shipment_invoice_amount)"
        default: 0
      - name: invoice_amount_usd
        type: number
        source: computed
        description: "extended_amount_usd + cut_fee_usd + volatility_surcharge_usd; null before invoicing"
      - name: invoice_date
        type: string
        source: computed
        description: Date the invoice was struck, format YYYY-MM-DD; null before invoicing
      - name: status
        type: enum
        source: computed
        description: Shipment lifecycle state
        default: STAGED
        constraints: "one of {STAGED, INVOICED}"

  - name: ReelReturn
    parent: Reel
    common_fields: false
    fields:
      - name: reel_id
        type: string
        source: input
        description: "FK -> Reel.id; the returned reel"
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the shipment that sent the reel out"
      - name: returned_date
        type: string
        source: input
        description: Date the reel came back, format YYYY-MM-DD
      - name: condition
        type: enum
        source: input
        description: Condition the reel came back in
        constraints: "one of {GOOD, DAMAGED}"
      - name: days_out
        type: integer
        source: computed
        description: "Whole days from date(Reel.shipped_at) to returned_date (calculations.reel_deposit_refund)"
      - name: refund_usd
        type: number
        source: computed
        description: "Deposit refunded to the customer (calculations.reel_deposit_refund)"
      - name: forfeited_usd
        type: number
        source: computed
        description: "Reel.deposit_usd - refund_usd (calculations.reel_deposit_refund)"
      - name: refund_variant_applied
        type: enum
        source: computed
        description: Which refund schedule produced refund_usd
        constraints: "one of {FLAT_STEP, DAILY_DECAY, NONE}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RodPurchaseLot
    initial_state: RECEIVED
    terminal_states: [CONSUMED, QUARANTINED]
    transitions:
      - from: RECEIVED
        to: CONSUMED
        trigger: "system: POST /production-lots leaves remaining_lbs == 0"
        actor: system
        preconditions:
          - "remaining_lbs == 0 after the allocation"
        side_effects:
          - "status := CONSUMED"
          - "version incremented by 1"
        note: "Auto-transition evaluated after the metal mass ledger update of the same request."
      - from: RECEIVED
        to: QUARANTINED
        trigger: "system: POST /production-lots/{id}/disposition with disposition=SCRAPPED pushed scrapped_lbs over the alert threshold"
        actor: system
        preconditions:
          - "round(100 * scrapped_lbs / purchase_weight_lbs, 2) > SCRAP_ALERT_PCT (10.0) after the scrap posting"
        side_effects:
          - "status := QUARANTINED"
          - "version incremented by 1"
          - "cascade: every OTHER ProductionLot with rod_lot_id == this lot and quality_state == PENDING, processed created_at ASC, gets quality_state := QUARANTINED (its process_state is untouched)"
        note: "Second hop of the scrap cascade; caused by the scrapped_lbs mutation, not by the disposition request itself."

  - entity: Compound
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: QUALIFIED
        trigger: "POST /compounds/{id}/qualify"
        actor: ProcessEngineer
        preconditions:
          - "status == DRAFT or status == SUSPENDED"
        side_effects:
          - "qualification_date := the current logical UTC date (YYYY-MM-DD)"
          - "status := QUALIFIED"
          - "version incremented by 1"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /compounds/{id}/qualify (re-qualification after suspension)"
        actor: ProcessEngineer
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "qualification_date := the current logical UTC date (YYYY-MM-DD)"
          - "status := QUALIFIED"
          - "version incremented by 1"
        note: "Cycle: DRAFT -> QUALIFIED -> SUSPENDED -> QUALIFIED. Re-qualification bumps version, so CatalogProducts pinned to the pre-suspension version become stale."
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /compounds/{id}/suspend"
        actor: QualityEngineer
        preconditions:
          - "status == QUALIFIED"
        side_effects:
          - "suspension_reason := payload suspension_reason; status := SUSPENDED; version incremented by 1"
          - "cascade hop 1: every CatalogProduct with insulation_compound_id == this compound or jacket_compound_id == this compound and status == RELEASED, processed created_at ASC, gets status := SUSPENDED"
          - "cascade hop 2: caused by each product suspension, every CustomerOrder with product_id == that product and fulfillment_status IN {OPEN, PARTIALLY_SHIPPED} and pricing_status IN {QUOTED, LOCKED}, processed created_at ASC, gets pricing_status := HELD and hold_reason := 'COMPOUND_SUSPENDED'"
          - "cascade hop 3: caused by each order hold, every ProductionLot with order_id == that order and quality_state == PENDING and process_state NOT IN {SHIPPED, SCRAP_CLOSED}, processed created_at ASC, gets quality_state := QUARANTINED"

  - entity: ListingCertification
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /listing-certifications/{id}/inspections with outcome=PASS"
        actor: CertificationOfficer
        preconditions:
          - "status == PENDING"
          - "inspection_date >= initial_listing_date"
        side_effects:
          - "last_inspection_date := inspection_date; next_inspection_due_date := inspection_date + inspection_interval_days"
          - "status := ACTIVE"
          - "version incremented by 1"
      - from: ACTIVE
        to: VARIATION_NOTICE
        trigger: "POST /listing-certifications/{id}/inspections with outcome=VARIATION"
        actor: CertificationOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "the created FactoryInspection gets status OPEN and corrective_action_due_date := inspection_date + 30 days"
          - "open_variation_count incremented by 1; last_inspection_date and next_inspection_due_date recomputed"
          - "status := VARIATION_NOTICE"
          - "version incremented by 1"
        note: "Products stay RELEASED under a variation notice; only SUSPENDED freezes the downstream chain."
      - from: VARIATION_NOTICE
        to: ACTIVE
        trigger: "POST /listing-certifications/{id}/reinstate"
        actor: CertificationOfficer
        preconditions:
          - "status == VARIATION_NOTICE or status == SUSPENDED"
          - "no OPEN FactoryInspection on this file has corrective_action_due_date earlier than the current logical date (validations[priority=46])"
        side_effects:
          - "every FactoryInspection on this file with status == OPEN, processed created_at ASC, gets status := CLOSED; open_variation_count := 0"
          - "status := ACTIVE; version incremented by 1"
        note: "Cycle: ACTIVE -> VARIATION_NOTICE -> ACTIVE."
      - from: VARIATION_NOTICE
        to: SUSPENDED
        trigger: "POST /listing-certifications/{id}/inspections with outcome=VARIATION while open_variation_count >= 1, or outcome=SUSPEND"
        actor: CertificationOfficer
        preconditions:
          - "status == VARIATION_NOTICE"
        side_effects:
          - "the created FactoryInspection gets status OPEN; open_variation_count incremented by 1"
          - "status := SUSPENDED; version incremented by 1"
          - "the SUSPENDED cascade hops 1-3 described on the ACTIVE -> SUSPENDED transition run identically"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /listing-certifications/{id}/inspections with outcome=SUSPEND"
        actor: CertificationOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "the created FactoryInspection gets status OPEN and corrective_action_due_date := inspection_date + 30 days; open_variation_count incremented by 1"
          - "last_inspection_date := inspection_date; next_inspection_due_date := inspection_date + inspection_interval_days"
          - "status := SUSPENDED; version incremented by 1"
          - "cascade hop 1: caused by the SUSPENDED transition, every CatalogProduct with listing_certification_id == this file and status == RELEASED, processed created_at ASC, gets status := SUSPENDED"
          - "cascade hop 2: caused by each product suspension, every CustomerOrder with product_id == that product and fulfillment_status IN {OPEN, PARTIALLY_SHIPPED} and pricing_status IN {QUOTED, LOCKED}, processed created_at ASC, gets pricing_status := HELD and hold_reason := 'CERTIFICATION_SUSPENDED'"
          - "cascade hop 3: caused by each order hold, every ProductionLot with order_id == that order and quality_state == PENDING and process_state NOT IN {SHIPPED, SCRAP_CLOSED}, processed created_at ASC, gets quality_state := QUARANTINED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /listing-certifications/{id}/reinstate"
        actor: CertificationOfficer
        preconditions:
          - "status == SUSPENDED"
          - "no OPEN FactoryInspection on this file has corrective_action_due_date earlier than the current logical date (validations[priority=46])"
        side_effects:
          - "every FactoryInspection on this file with status == OPEN, processed created_at ASC, gets status := CLOSED; open_variation_count := 0"
          - "status := ACTIVE; version incremented by 1"
          - "cascade hop 1: caused by the ACTIVE transition, every CatalogProduct with listing_certification_id == this file and status == SUSPENDED, processed created_at ASC, is re-evaluated: if pinned_insulation_compound_version == current Compound.version of insulation_compound_id AND (jacket_compound_id is null OR pinned_jacket_compound_version == current Compound.version of jacket_compound_id) then status := RELEASED, else status := OBSOLETE"
          - "cascade hop 2: caused by each product that returned to RELEASED, every CustomerOrder with product_id == that product and pricing_status == HELD, processed created_at ASC, gets pricing_status := LOCKED and hold_reason := null; orders whose product became OBSOLETE stay HELD"
          - "cascade hop 3: caused by each order that returned to LOCKED, every ProductionLot with order_id == that order and quality_state == QUARANTINED, processed created_at ASC, gets quality_state := PENDING"

  - entity: FactoryInspection
    initial_state: CLOSED
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /listing-certifications/{id}/reinstate (the parent file's reinstatement closes each of its OPEN variations)"
        actor: CertificationOfficer
        preconditions:
          - "status == OPEN"
          - "parent ListingCertification.status IN {VARIATION_NOTICE, SUSPENDED}"
          - "corrective_action_due_date >= the current logical date"
        side_effects:
          - "status := CLOSED; version incremented by 1"
        note: "Rows created with outcome=PASS are born CLOSED; rows created with outcome IN {VARIATION, SUSPEND} are born OPEN."

  - entity: CatalogProduct
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /catalog-products/{id}/release"
        actor: ProcessEngineer
        preconditions:
          - "status == DRAFT"
          - "Compound(insulation_compound_id).status == QUALIFIED"
          - "jacket_compound_id is null OR Compound(jacket_compound_id).status == QUALIFIED"
          - "Compound(insulation_compound_id).temp_rating_c >= temp_rating_c AND max_voltage_v >= voltage_rating_v AND (application_rating NOT IN {THHN, THWN_2} OR flame_test == VW_1)"
          - "ListingCertification(listing_certification_id).status == ACTIVE"
        side_effects:
          - "pinned_insulation_compound_version := Compound(insulation_compound_id).version"
          - "pinned_jacket_compound_version := Compound(jacket_compound_id).version when jacket_compound_id is not null, else stays null"
          - "status := RELEASED; version incremented by 1"
      - from: RELEASED
        to: SUSPENDED
        trigger: "system: cascade hop 1 of Compound QUALIFIED -> SUSPENDED or ListingCertification -> SUSPENDED"
        actor: system
        preconditions:
          - "status == RELEASED"
        side_effects:
          - "status := SUSPENDED; version incremented by 1"
          - "triggers cascade hop 2 on this product's CustomerOrders (see ListingCertification ACTIVE -> SUSPENDED)"
      - from: SUSPENDED
        to: RELEASED
        trigger: "system: cascade hop 1 of ListingCertification SUSPENDED|VARIATION_NOTICE -> ACTIVE with matching pinned compound versions"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "pinned compound versions equal the current Compound.version values"
        side_effects:
          - "status := RELEASED; version incremented by 1"
      - from: SUSPENDED
        to: OBSOLETE
        trigger: "system: cascade hop 1 of ListingCertification SUSPENDED|VARIATION_NOTICE -> ACTIVE with a stale pinned compound version"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "pinned_insulation_compound_version != current Compound.version of insulation_compound_id, OR pinned_jacket_compound_version != current Compound.version of jacket_compound_id"
        side_effects:
          - "status := OBSOLETE; version incremented by 1"
        note: "Stale-reference detection: a compound re-qualified during the suspension window bumped its version, so the pinned print is no longer the qualified formulation."

  - entity: CustomerOrder
    initial_state: QUOTED
    initial_states: { pricing_status: QUOTED, fulfillment_status: OPEN }
    terminal_states: [CANCELLED]
    transitions:
      - from: QUOTED
        to: LOCKED
        dimension: pricing_status
        trigger: "POST /customer-orders/{id}/price-lock"
        actor: BillingAnalyst
        preconditions:
          - "pricing_status == QUOTED"
          - "fulfillment_status IN {OPEN, PARTIALLY_SHIPPED}"
        side_effects:
          - "pricing_status := LOCKED; version incremented by 1"
      - from: QUOTED
        to: HELD
        dimension: pricing_status
        trigger: "system: cascade hop 2 of a CatalogProduct RELEASED -> SUSPENDED"
        actor: system
        preconditions:
          - "pricing_status == QUOTED"
          - "fulfillment_status IN {OPEN, PARTIALLY_SHIPPED}"
        side_effects:
          - "pricing_status := HELD; hold_reason set by the cascade; version incremented by 1"
          - "triggers cascade hop 3 on this order's ProductionLots"
      - from: LOCKED
        to: HELD
        dimension: pricing_status
        trigger: "system: cascade hop 2 of a CatalogProduct RELEASED -> SUSPENDED"
        actor: system
        preconditions:
          - "pricing_status == LOCKED"
          - "fulfillment_status IN {OPEN, PARTIALLY_SHIPPED}"
        side_effects:
          - "pricing_status := HELD; hold_reason set by the cascade; version incremented by 1"
          - "triggers cascade hop 3 on this order's ProductionLots"
      - from: HELD
        to: LOCKED
        dimension: pricing_status
        trigger: "system: cascade hop 2 of a CatalogProduct SUSPENDED -> RELEASED"
        actor: system
        preconditions:
          - "pricing_status == HELD"
        side_effects:
          - "pricing_status := LOCKED; hold_reason := null; version incremented by 1"
          - "triggers cascade hop 3 releasing this order's QUARANTINED ProductionLots"
      - from: LOCKED
        to: INVOICED
        dimension: pricing_status
        trigger: "system: POST /shipments/{id}/invoice completes the order"
        actor: system
        preconditions:
          - "pricing_status == LOCKED"
          - "fulfillment_status == FULFILLED after this invoice"
          - "every Shipment of this order has status == INVOICED"
        side_effects:
          - "pricing_status := INVOICED; version incremented by 1"
      - from: OPEN
        to: PARTIALLY_SHIPPED
        dimension: fulfillment_status
        trigger: "POST /shipments"
        actor: ShippingClerk
        preconditions:
          - "fulfillment_status == OPEN"
          - "shipped_kft after this shipment < ordered_kft"
        side_effects:
          - "shipped_kft increased by shipped_length_ft / 1000; fulfillment_status := PARTIALLY_SHIPPED; version incremented by 1"
      - from: OPEN
        to: FULFILLED
        dimension: fulfillment_status
        trigger: "POST /shipments"
        actor: ShippingClerk
        preconditions:
          - "fulfillment_status == OPEN"
          - "shipped_kft after this shipment == ordered_kft"
        side_effects:
          - "shipped_kft increased by shipped_length_ft / 1000; fulfillment_status := FULFILLED; version incremented by 1"
      - from: PARTIALLY_SHIPPED
        to: FULFILLED
        dimension: fulfillment_status
        trigger: "POST /shipments"
        actor: ShippingClerk
        preconditions:
          - "fulfillment_status == PARTIALLY_SHIPPED"
          - "shipped_kft after this shipment == ordered_kft"
        side_effects:
          - "shipped_kft increased by shipped_length_ft / 1000; fulfillment_status := FULFILLED; version incremented by 1"
      - from: OPEN
        to: CANCELLED
        dimension: fulfillment_status
        trigger: "POST /customer-orders/{id}/cancel"
        actor: BillingAnalyst
        preconditions:
          - "fulfillment_status == OPEN"
          - "no Shipment exists with order_id == this order"
        side_effects:
          - "fulfillment_status := CANCELLED; version incremented by 1"
          - "compensating cascade: every ProductionLot with order_id == this order and process_state == QUEUED, processed created_at ASC, gets process_state := SCRAP_CLOSED while quality_state is left at PENDING (nothing was produced, so nothing is scrapped), and its consumed_rod_lbs moves from RodPurchaseLot.committed_lbs back to RodPurchaseLot.remaining_lbs (never to scrapped_lbs: a QUEUED lot has not been drawn), bumping that rod lot's version by 1"
        note: "The compensating half of the metal mass ledger: purchase_weight_lbs == remaining_lbs + committed_lbs + scrapped_lbs holds throughout and remaining_lbs returns to its pre-allocation value."

  - entity: ProductionLot
    initial_state: QUEUED
    initial_states: { process_state: QUEUED, quality_state: PENDING }
    terminal_states: [SCRAP_CLOSED]
    transitions:
      - from: QUEUED
        to: DRAWN
        dimension: process_state
        trigger: "POST /production-lots/{id}/process-steps with step=DRAWING"
        actor: ProcessEngineer
        preconditions:
          - "process_state == QUEUED"
          - "quality_state IN {PENDING, REWORK}"
          - "CatalogProduct(product_id).status == RELEASED"
        side_effects:
          - "process_state := DRAWN; version incremented by 1"
      - from: DRAWN
        to: STRANDED
        dimension: process_state
        trigger: "POST /production-lots/{id}/process-steps with step=STRANDING"
        actor: ProcessEngineer
        preconditions:
          - "process_state == DRAWN"
          - "CatalogProduct(product_id).conductor_construction != SOLID"
        side_effects:
          - "process_state := STRANDED; version incremented by 1"
        note: "Branch point: SOLID constructions go DRAWN -> EXTRUDED and never enter STRANDED."
      - from: DRAWN
        to: EXTRUDED
        dimension: process_state
        trigger: "POST /production-lots/{id}/process-steps with step=EXTRUSION"
        actor: ProcessEngineer
        preconditions:
          - "process_state == DRAWN"
          - "CatalogProduct(product_id).conductor_construction == SOLID"
          - "surface_marking_text in the payload equals CatalogProduct.required_marking_text when marking_required is true"
        side_effects:
          - "measurements and surface_marking_text stored; concentricity_pct computed"
          - "process_state := EXTRUDED; version incremented by 1"
          - "quality_state := NONCONFORMING when concentricity_pct < CatalogProduct.concentricity_min_pct, else quality_state stays PENDING (the minimum-wall gate is re-checked only at release)"
      - from: STRANDED
        to: EXTRUDED
        dimension: process_state
        trigger: "POST /production-lots/{id}/process-steps with step=EXTRUSION"
        actor: ProcessEngineer
        preconditions:
          - "process_state == STRANDED"
          - "surface_marking_text in the payload equals CatalogProduct.required_marking_text when marking_required is true"
        side_effects:
          - "measurements and surface_marking_text stored; concentricity_pct computed"
          - "process_state := EXTRUDED; version incremented by 1"
          - "quality_state := NONCONFORMING when concentricity_pct < CatalogProduct.concentricity_min_pct, else quality_state stays PENDING (the minimum-wall gate is re-checked only at release)"
      - from: EXTRUDED
        to: TESTED
        dimension: process_state
        trigger: "system: POST /production-lots/{id}/tests completes the INLINE test set"
        actor: system
        preconditions:
          - "process_state == EXTRUDED"
          - "the LATEST CableTest row (max tested_at, tie-break created_at DESC) for SPARK and for HIPOT each has result PASS - these two are the inline line tests, so they alone gate the process dimension"
          - "PARTIAL_DISCHARGE is an OFF-LINE laboratory test and is deliberately NOT part of this promotion, so an MV lot can reach TESTED while its PD result is still outstanding; release then refuses it at validations[priority=54]"
          - "superseded FAIL rows do NOT block this promotion - they are retained and are caught instead at release by validations[priority=56]"
        side_effects:
          - "process_state := TESTED; version incremented by 1"
      - from: TESTED
        to: PACKAGED
        dimension: process_state
        trigger: "POST /reels/{id}/load"
        actor: ShippingClerk
        preconditions:
          - "process_state == TESTED"
          - "quality_state == CONFORMING"
        side_effects:
          - "process_state := PACKAGED; version incremented by 1; packaged_length_ft is NOT re-derived here - it was fixed by the QualityEngineer at release"
      - from: PACKAGED
        to: SHIPPED
        dimension: process_state
        trigger: "POST /shipments"
        actor: ShippingClerk
        preconditions:
          - "process_state == PACKAGED"
          - "quality_state == CONFORMING"
        side_effects:
          - "process_state := SHIPPED; version incremented by 1"
      - from: EXTRUDED
        to: STRANDED
        dimension: process_state
        trigger: "POST /production-lots/{id}/disposition with disposition=REWORK"
        actor: QualityEngineer
        preconditions:
          - "process_state == EXTRUDED"
          - "quality_state == NONCONFORMING"
          - "rework_count < REWORK_LIMIT (2)"
          - "CatalogProduct(product_id).conductor_construction != SOLID"
        side_effects:
          - "measured_min_wall_mils, measured_max_wall_mils, measured_avg_od_mm, concentricity_pct, surface_marking_text := null"
          - "rework_count incremented by 1; process_state := STRANDED; quality_state := REWORK then immediately PENDING within the same request"
          - "version incremented by 1"
        note: "Rewind cycle: EXTRUDED -> STRANDED -> EXTRUDED. SOLID constructions rewind to DRAWN instead."
      - from: EXTRUDED
        to: DRAWN
        dimension: process_state
        trigger: "POST /production-lots/{id}/disposition with disposition=REWORK"
        actor: QualityEngineer
        preconditions:
          - "process_state == EXTRUDED"
          - "quality_state == NONCONFORMING"
          - "rework_count < REWORK_LIMIT (2)"
          - "CatalogProduct(product_id).conductor_construction == SOLID"
        side_effects:
          - "measurements and surface_marking_text cleared; rework_count incremented by 1"
          - "process_state := DRAWN; quality_state := REWORK then immediately PENDING within the same request"
          - "version incremented by 1"
      - from: EXTRUDED
        to: SCRAP_CLOSED
        dimension: process_state
        trigger: "POST /production-lots/{id}/disposition with disposition=SCRAPPED"
        actor: QualityEngineer
        preconditions:
          - "process_state IN {DRAWN, STRANDED, EXTRUDED, TESTED}"
          - "quality_state == NONCONFORMING"
        side_effects:
          - "process_state := SCRAP_CLOSED; quality_state := SCRAPPED; version incremented by 1"
          - "cascade hop 1: consumed_rod_lbs moves from RodPurchaseLot.committed_lbs to RodPurchaseLot.scrapped_lbs; that rod lot's version incremented by 1"
          - "cascade hop 2: caused by the scrapped_lbs mutation, the rod lot auto-transitions RECEIVED -> QUARANTINED when round(100 * scrapped_lbs / purchase_weight_lbs, 2) > 10.0"
          - "cascade hop 3: caused by the rod lot QUARANTINED transition, every other ProductionLot on that rod lot with quality_state == PENDING, processed created_at ASC, gets quality_state := QUARANTINED"
      - from: QUEUED
        to: SCRAP_CLOSED
        dimension: process_state
        trigger: "system: compensating cascade of POST /customer-orders/{id}/cancel"
        actor: system
        preconditions:
          - "process_state == QUEUED"
          - "the owning order's fulfillment_status became CANCELLED in this request"
        side_effects:
          - "process_state := SCRAP_CLOSED; quality_state left at PENDING; version incremented by 1"
          - "consumed_rod_lbs moves from RodPurchaseLot.committed_lbs back to RodPurchaseLot.remaining_lbs (not to scrapped_lbs); that rod lot's version incremented by 1"
        note: "The only route into SCRAP_CLOSED that records no scrap: nothing had been drawn, so the metal returns to the available bucket."
      - from: PENDING
        to: NONCONFORMING
        dimension: quality_state
        trigger: "system: dimensional gate failure at EXTRUSION, or a CableTest with result FAIL"
        actor: system
        preconditions:
          - "quality_state == PENDING"
        side_effects:
          - "quality_state := NONCONFORMING; version incremented by 1"
      - from: PENDING
        to: CONFORMING
        dimension: quality_state
        trigger: "POST /production-lots/{id}/release"
        actor: QualityEngineer
        preconditions:
          - "quality_state == PENDING"
          - "process_state == TESTED"
          - "concentricity_pct >= CatalogProduct.concentricity_min_pct AND measured_min_wall_mils >= round(insulation_thickness_mils * min_wall_pct / 100, 2)"
          - "surface_marking_text == CatalogProduct.required_marking_text when marking_required is true"
          - "ListingCertification(CatalogProduct.listing_certification_id).status == ACTIVE"
          - "X-User-ID differs from every operator_user_id on this lot's CableTests"
        side_effects:
          - "released_by_user_id := X-User-ID; packaged_length_ft := payload packaged_length_ft; quality_state := CONFORMING; process_state stays TESTED; version incremented by 1"
      - from: NONCONFORMING
        to: PENDING
        dimension: quality_state
        trigger: "POST /production-lots/{id}/disposition with disposition=REWORK"
        actor: QualityEngineer
        preconditions:
          - "quality_state == NONCONFORMING"
          - "rework_count < REWORK_LIMIT (2)"
        side_effects:
          - "quality_state passes through REWORK and ends at PENDING in the same request; rework_count incremented by 1"
        note: "The REWORK value is observable only as the transient the disposition response reports in quality_state history; the persisted end state is PENDING."
      - from: NONCONFORMING
        to: SCRAPPED
        dimension: quality_state
        trigger: "POST /production-lots/{id}/disposition with disposition=SCRAPPED"
        actor: QualityEngineer
        preconditions:
          - "quality_state == NONCONFORMING"
        side_effects:
          - "quality_state := SCRAPPED plus the three cascade hops listed on EXTRUDED -> SCRAP_CLOSED"
      - from: PENDING
        to: QUARANTINED
        dimension: quality_state
        trigger: "system: cascade hop 3 of a CustomerOrder pricing hold, or cascade hop 3 of a RodPurchaseLot quarantine"
        actor: system
        preconditions:
          - "quality_state == PENDING"
          - "process_state NOT IN {SHIPPED, SCRAP_CLOSED}"
        side_effects:
          - "quality_state := QUARANTINED; version incremented by 1"
      - from: QUARANTINED
        to: PENDING
        dimension: quality_state
        trigger: "system: cascade hop 3 of a CustomerOrder HELD -> LOCKED"
        actor: system
        preconditions:
          - "quality_state == QUARANTINED"
          - "the owning order's pricing_status returned to LOCKED in this request"
        side_effects:
          - "quality_state := PENDING; version incremented by 1"

  - entity: Reel
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: LOADED
        trigger: "POST /reels/{id}/load"
        actor: ShippingClerk
        preconditions:
          - "status == AVAILABLE"
          - "loaded_length_ft + load_length_ft <= capacity_ft"
          - "returned_at is null OR occupancy_start_at >= returned_at (half-open occupancy: a load starting exactly at the previous return instant is accepted)"
          - "ProductionLot(lot_id).process_state == TESTED AND quality_state == CONFORMING"
        side_effects:
          - "current_lot_id := lot_id; loaded_length_ft increased by load_length_ft; occupancy_start_at and occupancy_end_at stored"
          - "status := LOADED; version incremented by 1"
          - "the loaded ProductionLot transitions TESTED -> PACKAGED"
      - from: LOADED
        to: SHIPPED
        trigger: "POST /shipments"
        actor: ShippingClerk
        preconditions:
          - "status == LOADED"
          - "current_lot_id == payload lot_id"
        side_effects:
          - "held_by_customer_id := CustomerOrder.customer_id; shipped_at := logical clock; status := SHIPPED; version incremented by 1"
          - "Customer.deposit_charged_total_usd and Customer.reel_deposit_balance_usd each increased by deposit_usd"
      - from: SHIPPED
        to: RETURN_PENDING
        trigger: "POST /shipments/{id}/invoice"
        actor: BillingAnalyst
        preconditions:
          - "status == SHIPPED"
          - "reel_type IN {WOOD_RETURNABLE, STEEL_RETURNABLE}"
        side_effects:
          - "status := RETURN_PENDING; version incremented by 1"
      - from: SHIPPED
        to: RETIRED
        trigger: "POST /shipments/{id}/invoice"
        actor: BillingAnalyst
        preconditions:
          - "status == SHIPPED"
          - "reel_type == NON_RETURNABLE"
        side_effects:
          - "status := RETIRED; version incremented by 1"
        note: "Non-returnable reels leave the pool at invoicing; their deposit_usd is 0 so the deposit ledger is untouched."
      - from: RETURN_PENDING
        to: AVAILABLE
        trigger: "POST /reels/{id}/returns with condition=GOOD"
        actor: ShippingClerk
        preconditions:
          - "status == RETURN_PENDING"
          - "returned_date >= date(shipped_at)"
        side_effects:
          - "returned_at := logical clock; last_return_condition := GOOD; cycle_count incremented by 1"
          - "current_lot_id := null; held_by_customer_id := null; loaded_length_ft := 0; status := AVAILABLE; version incremented by 1"
          - "cascade hop 1: Customer.reel_deposit_balance_usd decreased by deposit_usd, credit_memo_balance_usd increased by refund_usd, forfeited_deposit_total_usd increased by forfeited_usd"
          - "cascade hop 2: caused by the ledger mutation, credit_exposure_usd is recomputed and the Customer auto-transitions CREDIT_HOLD -> ACTIVE when credit_exposure_usd <= credit_limit_usd"
        note: "Cycle: AVAILABLE -> LOADED -> SHIPPED -> RETURN_PENDING -> AVAILABLE, with cycle_count as the loop counter."
      - from: RETURN_PENDING
        to: DAMAGED
        trigger: "POST /reels/{id}/returns with condition=DAMAGED"
        actor: ShippingClerk
        preconditions:
          - "status == RETURN_PENDING"
          - "cycle_count < REEL_CYCLE_LIMIT (10)"
        side_effects:
          - "returned_at := logical clock; last_return_condition := DAMAGED; cycle_count incremented by 1; refund_usd is 0 and the whole deposit is forfeited"
          - "current_lot_id := null; held_by_customer_id := null; loaded_length_ft := 0; status := DAMAGED; version incremented by 1"
          - "the same two customer-ledger cascade hops as the GOOD return run, with refund_usd 0"
      - from: RETURN_PENDING
        to: RETIRED
        trigger: "POST /reels/{id}/returns with condition=DAMAGED on a reel at the cycle limit"
        actor: ShippingClerk
        preconditions:
          - "status == RETURN_PENDING"
          - "cycle_count >= REEL_CYCLE_LIMIT (10)"
        side_effects:
          - "same ledger and field effects as RETURN_PENDING -> DAMAGED, but status := RETIRED"

  - entity: Shipment
    initial_state: STAGED
    terminal_states: [INVOICED]
    transitions:
      - from: STAGED
        to: INVOICED
        trigger: "POST /shipments/{id}/invoice"
        actor: BillingAnalyst
        preconditions:
          - "status == STAGED"
          - "CustomerOrder(order_id).pricing_status IN {QUOTED, LOCKED}"
        side_effects:
          - "metal_price_used_usd_per_lb, price_variant_applied, unit_price_usd_per_kft, extended_amount_usd, cut_fee_usd, volatility_surcharge_usd, invoice_amount_usd and invoice_date set by calculations.shipment_invoice_amount"
          - "status := INVOICED; version incremented by 1"
          - "CustomerOrder.invoiced_total_usd increased by invoice_amount_usd; pricing_status := INVOICED when the order is FULFILLED and all its shipments are INVOICED"
          - "Customer.open_ar_usd increased by invoice_amount_usd; credit_exposure_usd recomputed; Customer auto-transitions ACTIVE -> CREDIT_HOLD when credit_exposure_usd > credit_limit_usd"
          - "Reel transitions SHIPPED -> RETURN_PENDING (returnable) or SHIPPED -> RETIRED (non-returnable)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lot-create-stale-rod-lot
    parent_entity: RodPurchaseLot
    write_endpoint: "POST /production-lots"
    occ_field: "expected_rod_lot_version"
    description: |
      Creating a ProductionLot against a RodPurchaseLot whose version has
      advanced since the client last read it is rejected. Allocating rod to a
      second lot is legitimate on its own (the rod lot stays RECEIVED and may
      still hold enough remaining_lbs), so the write cannot be resolved by a
      state precondition: the guard is the stale version the client carries.
    error_id: ERR_STALE_ROD_LOT_VERSION
    http_status: 412
  - rule_id: shipment-create-stale-order
    parent_entity: CustomerOrder
    write_endpoint: "POST /shipments"
    occ_field: "expected_order_version"
    description: |
      Creating a Shipment against a CustomerOrder whose version has advanced
      since the client last read it is rejected. Partial shipments are
      legitimate, so a second create against the same order would otherwise
      succeed against a stale view of shipped_kft and pricing_status.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: required_marking_text
    trigger: "POST /catalog-products (side effect: required_marking_text, voltage_rating_v, marking_required, pd_test_required)"
    algorithm: string_composition
    formula: |
      voltage_rating_v = VOLTAGE_MAP[voltage_class]
      marking_required = application_rating IN {THHN, THWN_2, XHHW_2, USE_2}
      pd_test_required = voltage_class IN {MV_5KV, MV_15KV, MV_35KV}
      required_marking_text =
        ListingCertification(listing_certification_id).agency + " " +
        ListingCertification(listing_certification_id).file_number + " " +
        awg_size + "AWG " + application_rating + " " +
        str(temp_rating_c) + "C " + str(voltage_rating_v) + "V"
      # Example: "UL E12345 12AWG THHN 90C 600V"
    input_set: "The CatalogProduct being created plus its ListingCertification row; single space between every token, no trailing space"
    constants:
      VOLTAGE_MAP: { LV_600: 600, MV_5KV: 5000, MV_15KV: 15000, MV_35KV: 35000 }
    precision: "exact string equality; ProductionLot.surface_marking_text is compared with == (case-sensitive)"

  - name: traceability_code
    trigger: "POST /production-lots (side effect: traceability_code)"
    algorithm: string_composition
    formula: |
      traceability_code = RodPurchaseLot(rod_lot_id).heat_number + "-" + lot_code
    input_set: "The rod lot referenced by rod_lot_id and the lot_code of the lot being created"
    precision: "exact string equality"

  - name: order_quoted_total
    trigger: "POST /customer-orders (side effects: quoted_metal_price_usd_per_lb, quoted_unit_price_usd_per_kft, quoted_subtotal_usd, quoted_cut_fee_usd, quoted_surcharge_usd, quoted_total_usd)"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - metal price selector (ORDER_DATE_LOCK reference price; also
      # recorded for SHIP_DATE_FLOAT orders so the quote is comparable).
      candidates = MetalPriceQuote rows where
                     metal == CatalogProduct(product_id).conductor_metal
                     AND effective_date <= order_date
      rank        = effective_date DESC, then created_at DESC
      quoted_metal_price_usd_per_lb = candidates[0].settlement_price_usd_per_lb
      if candidates is empty -> reject with ERR_NO_METAL_QUOTE (no order is created)

      # STEP 2 - pass-through unit price.
      base = BASE_METAL_PRICE[conductor_metal]
      pass_through = 0 if Customer(customer_id).pass_through_enabled is false
                     else conductor_lbs_per_kft * (quoted_metal_price_usd_per_lb - base)
      quoted_unit_price_usd_per_kft = round_half_up(conversion_price_usd_per_kft + pass_through, 4)

      # STEP 3 - extension. cut_to_length orders extend PER REQUESTED SEGMENT and
      # round each segment to cents BEFORE summing (pinned order).
      if cut_to_length_service:
        quoted_subtotal_usd = sum over requested_cut_lengths_ft in list order of
                                round_half_up(quoted_unit_price_usd_per_kft * seg_ft / 1000, 2)
        quoted_cut_fee_usd  = round_half_up(CUT_FEE_USD_PER_CUT * len(requested_cut_lengths_ft), 2)
      else:
        quoted_subtotal_usd = round_half_up(quoted_unit_price_usd_per_kft * ordered_kft, 2)
        quoted_cut_fee_usd  = 0.00

      # STEP 4 - volatility surcharge. The tier is keyed on quoted_subtotal_usd
      # ONLY (pre-surcharge, pre-cut-fee). Reading the tier off quoted_total_usd
      # would be circular; this evaluation order is the pinned resolution.
      pct = 0.020 if quoted_subtotal_usd < 5000
            else 0.015 if quoted_subtotal_usd < 25000
            else 0.010
      quoted_surcharge_usd = round_half_up(quoted_subtotal_usd * pct, 2)

      # STEP 5 - total.
      quoted_total_usd = round_half_up(quoted_subtotal_usd + quoted_cut_fee_usd + quoted_surcharge_usd, 2)
    input_set: "All MetalPriceQuote rows for the product's conductor_metal with effective_date <= order_date (no status filter: quotes are immutable); the ordered SKU; the ordering Customer"
    constants:
      BASE_METAL_PRICE: { COPPER: 3.00, ALUMINUM: 1.00 }
      CUT_FEE_USD_PER_CUT: 12.50
      SURCHARGE_TIER_1_CEILING: 5000
      SURCHARGE_TIER_2_CEILING: 25000
      SURCHARGE_PCT_TIER_1: 0.020
      SURCHARGE_PCT_TIER_2: 0.015
      SURCHARGE_PCT_TIER_3: 0.010
    precision: "unit price 4 decimals round_half_up; every money field 2 decimals round_half_up; tier selected from the rounded quoted_subtotal_usd"

  - name: shipment_invoice_amount
    trigger: "POST /shipments/{id}/invoice (side effects: metal_price_used_usd_per_lb, price_variant_applied, unit_price_usd_per_kft, extended_amount_usd, cut_fee_usd, volatility_surcharge_usd, invoice_amount_usd, invoice_date)"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - variant-dependent metal price (see variants below).
      # STEP 2 - unit price, same pass-through shape as the quote.
      base = BASE_METAL_PRICE[CatalogProduct.conductor_metal]
      pass_through = 0 if Customer.pass_through_enabled is false
                     else conductor_lbs_per_kft * (metal_price_used_usd_per_lb - base)
      unit_price_usd_per_kft = round_half_up(CustomerOrder.conversion_price_usd_per_kft + pass_through, 4)

      # STEP 3 - extension with PINNED rounding order.
      if CustomerOrder.cut_to_length_service:
        # round each cut segment to cents, THEN sum. Summing the unrounded
        # segment amounts and rounding once is a different number and is wrong.
        extended_amount_usd = sum over the first cuts_count entries of
                                CustomerOrder.requested_cut_lengths_ft, in list order, of
                                round_half_up(unit_price_usd_per_kft * seg_ft / 1000, 2)
        cut_fee_usd = round_half_up(CUT_FEE_USD_PER_CUT * cuts_count, 2)
      else:
        extended_amount_usd = round_half_up(unit_price_usd_per_kft * shipped_length_ft / 1000, 2)
        cut_fee_usd = 0.00

      # STEP 4 - surcharge tier keyed on extended_amount_usd only.
      pct = 0.020 if extended_amount_usd < 5000
            else 0.015 if extended_amount_usd < 25000
            else 0.010
      volatility_surcharge_usd = round_half_up(extended_amount_usd * pct, 2)

      # STEP 5 - invoice.
      invoice_amount_usd = round_half_up(extended_amount_usd + cut_fee_usd + volatility_surcharge_usd, 2)
      invoice_date = date(logical clock)
    input_set: "The shipment being invoiced, its order, the order's SKU and customer, and (SHIP_DATE_FLOAT only) the MetalPriceQuote rows for the SKU's conductor_metal with effective_date inside the float window"
    constants:
      BASE_METAL_PRICE: { COPPER: 3.00, ALUMINUM: 1.00 }
      CUT_FEE_USD_PER_CUT: 12.50
      FLOAT_WINDOW_DAYS: 5
      FLOAT_MIN_QUOTES: 3
    precision: "metal price and window mean 4 decimals round_half_up; unit price 4 decimals round_half_up; money 2 decimals round_half_up"
    variants:
      - name: order_date_lock
        when: "CustomerOrder.price_basis == ORDER_DATE_LOCK"
        difference: "metal_price_used_usd_per_lb := CustomerOrder.quoted_metal_price_usd_per_lb (the price pinned at order creation); no quote lookup happens at invoice time, so later settlements never move the invoice. price_variant_applied := ORDER_DATE_LOCK."
      - name: ship_date_float
        when: "CustomerOrder.price_basis == SHIP_DATE_FLOAT"
        difference: "metal_price_used_usd_per_lb := round_half_up(arithmetic mean of settlement_price_usd_per_lb over MetalPriceQuote rows where metal == conductor_metal AND Shipment.ship_date - 4 days <= effective_date <= Shipment.ship_date, 4). Fewer than FLOAT_MIN_QUOTES (3) rows in that inclusive 5-calendar-day window rejects the invoice with ERR_INSUFFICIENT_PRICE_HISTORY and leaves the shipment STAGED. price_variant_applied := SHIP_DATE_FLOAT. Identical shipment rows therefore invoice at different amounts under the two variants."

  - name: reel_deposit_refund
    trigger: "POST /reels/{id}/returns (side effects: days_out, refund_usd, forfeited_usd, refund_variant_applied, Customer deposit ledger fields)"
    algorithm: decay_function
    formula: |
      days_out = (returned_date - date(Reel.shipped_at)) in whole calendar days
      if condition == DAMAGED:                          # from the request payload
        refund_usd = 0.00
        refund_variant_applied = NONE
      else: variant schedule below
      forfeited_usd = round_half_up(Reel.deposit_usd - refund_usd, 2)
      # Customer ledger, applied in this order:
      reel_deposit_balance_usd   -= Reel.deposit_usd
      credit_memo_balance_usd    += refund_usd
      forfeited_deposit_total_usd += forfeited_usd
      # Ledger invariant that must hold after every return:
      # deposit_charged_total_usd == reel_deposit_balance_usd
      #                              + credit_memo_balance_usd
      #                              + forfeited_deposit_total_usd
    input_set: "The returned Reel, the Shipment named in the payload, and the holding Customer; no other reels enter the computation"
    constants:
      FLAT_FULL_DAYS: 90
      FLAT_HALF_DAYS: 180
      DECAY_PER_DAY: 0.004
      DECAY_FLOOR_PCT: 0.30
    precision: "money 2 decimals round_half_up; the decay percentage is not rounded before it multiplies the deposit"
    variants:
      - name: flat_step
        when: "Reel.reel_type == WOOD_RETURNABLE and condition == GOOD"
        difference: "refund_usd = deposit_usd when days_out <= 90; round_half_up(deposit_usd * 0.50, 2) when 90 < days_out <= 180; 0.00 when days_out > 180. refund_variant_applied := FLAT_STEP."
      - name: daily_decay
        when: "Reel.reel_type == STEEL_RETURNABLE and condition == GOOD"
        difference: "pct = max(0.30, 1 - 0.004 * days_out); refund_usd = round_half_up(deposit_usd * pct, 2). refund_variant_applied := DAILY_DECAY. At days_out = 120 a 450.00 deposit refunds 234.00 here versus 225.00 under flat_step."
      - name: none
        when: "Reel.reel_type == NON_RETURNABLE or condition == DAMAGED"
        difference: "refund_usd = 0.00 and the whole deposit_usd is forfeited. refund_variant_applied := NONE."

  - name: lot_dimensional_conformance
    trigger: "POST /production-lots/{id}/process-steps with step=EXTRUSION (side effects: concentricity_pct, quality_state)"
    algorithm: threshold
    formula: |
      # In-line (extrusion-time) gate: CONCENTRICITY ONLY.
      concentricity_pct = round_half_up(100 * measured_min_wall_mils / measured_max_wall_mils, 2)
      quality_state := PENDING if concentricity_pct >= CatalogProduct.concentricity_min_pct
                       else NONCONFORMING

      # End-of-line (release-time) gate: MINIMUM WALL, re-checked independently.
      # Splitting the two checks across the two endpoints is deliberate: a lot can
      # be concentric yet under-walled, so it passes extrusion and testing and is
      # only stopped by validations[priority=52] at release.
      min_wall_required_mils = round_half_up(
        CatalogProduct.insulation_thickness_mils * CatalogProduct.min_wall_pct / 100, 2)
      release_conforming = concentricity_pct >= CatalogProduct.concentricity_min_pct
                           AND measured_min_wall_mils >= min_wall_required_mils
    input_set: "Only the measurements supplied by this EXTRUSION step and the three tolerance fields on the lot's CatalogProduct"
    precision: "concentricity 2 decimals round_half_up; both comparisons are >= (a lot exactly at the limit conforms)"

  - name: cable_test_result
    trigger: "POST /production-lots/{id}/tests (side effects: CableTest.result, ProductionLot.quality_state, ProductionLot.process_state)"
    algorithm: threshold
    formula: |
      if test_type == SPARK:
        result = PASS if faults_detected <= SPARK_MAX_FAULTS (0) else FAIL
      if test_type == HIPOT:
        result = FAIL if breakdown_detected is true
                 else (PASS if test_voltage_kv >= HIPOT_REQUIRED_KV[voltage_class] else FAIL)
      if test_type == PARTIAL_DISCHARGE:
        result = PASS if pd_level_pc <= PD_LIMIT_PC[voltage_class] else FAIL
      # after the row is written:
      if result == FAIL and ProductionLot.quality_state == PENDING:
        ProductionLot.quality_state := NONCONFORMING
      if result == PASS and the LATEST row for SPARK and the LATEST row for HIPOT are both PASS:
        ProductionLot.process_state := TESTED   (from EXTRUDED)
      inline test set   = {SPARK, HIPOT}                 # gates the EXTRUDED -> TESTED promotion
      release test set  = {SPARK, HIPOT} plus {PARTIAL_DISCHARGE} when CatalogProduct.pd_test_required
      # The two sets differ on purpose: spark and hipot are 100-percent inline
      # line tests, while partial discharge is an off-line laboratory test on MV
      # cable whose result can lag the line. So an MV lot reaches TESTED on the
      # inline pair alone, and validations[priority=54] is what refuses to
      # RELEASE it until the PD row exists and passes.
      # A re-test supersedes its predecessor for the PROMOTION decision only. The
      # superseded FAIL row is never deleted, and validations[priority=56] still
      # refuses release for any lot carrying a FAIL row - so a lot that failed a
      # test can be re-tested back to TESTED but can never be released, only
      # reworked and scrapped. That asymmetry is deliberate.
    input_set: "The CableTest row being written plus every existing CableTest row on the same lot; the promotion decision reads only the latest SPARK row and the latest HIPOT row (max tested_at, tie-break created_at DESC), validations[priority=54] reads the latest row per release-required type, and validations[priority=56] reads every row"
    constants:
      SPARK_MAX_FAULTS: 0
      HIPOT_REQUIRED_KV: { LV_600: 2.5, MV_5KV: 15.0, MV_15KV: 35.0, MV_35KV: 70.0 }
      PD_LIMIT_PC: { MV_5KV: 5.0, MV_15KV: 5.0, MV_35KV: 3.0 }
    precision: "pd_level_pc compared at 1 decimal place with <= (exactly at the limit passes); faults_detected compared with <="

  - name: rod_mass_ledger
    trigger: "POST /production-lots, POST /production-lots/{id}/disposition, POST /customer-orders/{id}/cancel (side effects: RodPurchaseLot.remaining_lbs, committed_lbs, scrapped_lbs, status; ProductionLot.consumed_rod_lbs)"
    algorithm: aggregation
    formula: |
      consumed_rod_lbs = round_half_up(planned_length_ft / 1000 * CatalogProduct.conductor_lbs_per_kft, 2)

      on lot create:            remaining_lbs -= consumed_rod_lbs
                                committed_lbs += consumed_rod_lbs
      on disposition SCRAPPED:  committed_lbs -= consumed_rod_lbs
                                scrapped_lbs  += consumed_rod_lbs
      on order cancel, for each QUEUED lot of the order (created_at ASC):
                                committed_lbs -= consumed_rod_lbs
                                remaining_lbs += consumed_rod_lbs

      # Conserved quantity, checked after every one of the three mutations:
      purchase_weight_lbs == remaining_lbs + committed_lbs + scrapped_lbs
      scrap_pct = round_half_up(100 * scrapped_lbs / purchase_weight_lbs, 2)
    input_set: "One RodPurchaseLot row and the ProductionLot rows allocated from it; lots with process_state SCRAP_CLOSED contribute to scrapped_lbs only through the mutation that closed them"
    constants:
      SCRAP_ALERT_PCT: 10.0
    precision: "all mass fields 2 decimals round_half_up; remaining_lbs may never go negative (ERR_INSUFFICIENT_ROD_QUANTITY guards the create)"

  - name: customer_credit_exposure
    trigger: "POST /shipments, POST /shipments/{id}/invoice, POST /reels/{id}/returns, PATCH /customers/{id} (side effects: Customer.open_ar_usd, reel_deposit_balance_usd, credit_memo_balance_usd, credit_exposure_usd, status)"
    algorithm: aggregation
    formula: |
      open_ar_usd = sum of invoice_amount_usd over Shipments whose order_id belongs to
                    this customer and whose status == INVOICED
      credit_exposure_usd = round_half_up(open_ar_usd + reel_deposit_balance_usd
                                          - credit_memo_balance_usd, 2)
      status := CREDIT_HOLD when credit_exposure_usd > credit_limit_usd
      status := ACTIVE      when credit_exposure_usd <= credit_limit_usd
      # Strictly greater than: exposure exactly equal to the limit stays ACTIVE.
    input_set: "Shipments with status INVOICED only (STAGED shipments do not count toward AR); reel deposits on reels with status IN {SHIPPED, RETURN_PENDING}"
    precision: "2 decimals round_half_up; the threshold comparison is > (equality keeps the account ACTIVE)"

  - name: metal_volatility_index
    trigger: "POST /inventory/reposition (side effect: CatalogProduct.volatility_index)"
    algorithm: aggregation
    formula: |
      window = MetalPriceQuote rows where metal == CatalogProduct.conductor_metal
               AND effective_date <= as_of_date,
               ordered effective_date DESC then created_at DESC,
               truncated to the first VOLATILITY_WINDOW_QUOTES (10) rows
      if len(window) < VOLATILITY_MIN_QUOTES (3): volatility_index = 0.0000
      else:
        volatility_index = round_half_up(
          (max(window.settlement_price_usd_per_lb) - min(window.settlement_price_usd_per_lb))
          / (sum(window.settlement_price_usd_per_lb) / len(window)), 4)
    input_set: "Up to the 10 most recent immutable quotes for the product's conductor_metal at or before as_of_date; no other metal's quotes enter"
    constants:
      VOLATILITY_WINDOW_QUOTES: 10
      VOLATILITY_MIN_QUOTES: 3
    precision: "4 decimals round_half_up; the mean is not rounded before the division"

  - name: inventory_reposition_target
    trigger: "POST /inventory/reposition (side effect: CatalogProduct.target_inventory_kft)"
    algorithm: constraint_propagation
    formula: |
      # Runs for each in-scope CatalogProduct in created_at ASC order, after that
      # product's volatility_index has been refreshed by metal_volatility_index.
      demand_multiplier = 0.30 if demand_index < 0.80
                          else 1.00 if demand_index <= 1.20
                          else 1.80
      volatility_damper = 1 - min(0.40, 0.80 * volatility_index)
      raw = base_target_kft * demand_multiplier * volatility_damper
      floor_kft   = round_half_up(base_target_kft * 0.25, 1)
      ceiling_kft = round_half_up(base_target_kft * 1.50, 1)
      target_inventory_kft = round_half_up(min(max(raw, floor_kft), ceiling_kft), 1)
    input_set: "CatalogProduct rows with status == RELEASED, restricted to product_ids when that filter is supplied; DRAFT, SUSPENDED and OBSOLETE SKUs are skipped and keep their previous target"
    constants:
      DEMAND_LOW_CEILING: 0.80
      DEMAND_HIGH_CEILING: 1.20
      DEMAND_MULT_LOW: 0.30
      DEMAND_MULT_MID: 1.00
      DEMAND_MULT_HIGH: 1.80
      VOLATILITY_WEIGHT: 0.80
      VOLATILITY_DAMPER_CAP: 0.40
      FLOOR_FACTOR: 0.25
      CEILING_FACTOR: 1.50
    precision: "target 1 decimal round_half_up; volatility_damper uses the already-rounded 4-decimal volatility_index and is NOT rounded itself; the clamp is applied before the final rounding"

  - name: inspection_cadence
    trigger: "POST /listing-certifications/{id}/inspections (side effects: ListingCertification.last_inspection_date, next_inspection_due_date, open_variation_count; FactoryInspection.corrective_action_due_date, status)"
    algorithm: interval_merge
    formula: |
      # Cadence guard (closed buffer around the previous visit):
      if last_inspection_date is not null
         and inspection_date < last_inspection_date + INSPECTION_MIN_GAP_DAYS (60 days):
        reject with ERR_INSPECTION_WINDOW_CONFLICT
      # A visit exactly INSPECTION_MIN_GAP_DAYS after the previous one is accepted.
      last_inspection_date     = inspection_date
      next_inspection_due_date = inspection_date + inspection_interval_days
      corrective_action_due_date = inspection_date + CAP_DAYS (30) when outcome != PASS else null
      status = CLOSED when outcome == PASS else OPEN
      open_variation_count = count of FactoryInspection rows on this file with status == OPEN
    input_set: "The certification row and its existing FactoryInspection rows; only the row with the maximum inspection_date (tie-break created_at DESC) defines last_inspection_date"
    constants:
      INSPECTION_MIN_GAP_DAYS: 60
      CAP_DAYS: 30
    precision: "whole calendar days, dates in YYYY-MM-DD; the gap comparison is strict < (a visit exactly 60 days later is accepted)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty (X-User-ID may be omitted only where §1.7 marks the role as not requiring an audit id)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; a Customer may only read or mutate CustomerOrders whose customer_id equals X-User-ID, and Shipments and Reels linked to those orders"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "Request body shape: required fields present, types correct, enum members valid, numeric constraints from §1.1 satisfied, scheduled_end_at strictly after scheduled_start_at, requested_cut_lengths_ft non-empty when cut_to_length_service is true, pd_level_pc present when test_type is PARTIAL_DISCHARGE, test_voltage_kv present when test_type is HIPOT, deposit_usd exactly 0 when reel_type is NON_RETURNABLE (ERR_REEL_DEPOSIT_MISMATCH), limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 30
    category: existence
    check: "Every referenced resource exists, validated path segments left to right and then body foreign keys in the order rod_lot_id, product_id, order_id, lot_id, reel_id, shipment_id, customer_id, insulation_compound_id, jacket_compound_id, listing_certification_id"
    error_id: ERR_ROD_LOT_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_REEL_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_COMPOUND_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 33
    category: business_constraint
    check: "Uniqueness: (metal, effective_date) on MetalPriceQuote; product_code on CatalogProduct"
    error_id: ERR_DUPLICATE_METAL_QUOTE | ERR_DUPLICATE_PRODUCT_CODE
    http_status: 409
    applies_to: "POST /metal-price-quotes, POST /catalog-products"

  - priority: 35
    category: state
    check: "OCC: expected_rod_lot_version equals RodPurchaseLot.version; expected_order_version equals CustomerOrder.version"
    error_id: ERR_STALE_ROD_LOT_VERSION | ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /production-lots, POST /shipments"

  - priority: 40
    category: state
    check: "The target resource is in a state that permits the requested transition per §1.2 (compound status, certification status, product status, lot process_state and quality_state, reel status, shipment status, order pricing_status and fulfillment_status)"
    error_id: ERR_INVALID_COMPOUND_STATE | ERR_INVALID_CERTIFICATION_STATE | ERR_INVALID_PRODUCT_STATE | ERR_INVALID_LOT_STATE | ERR_INVALID_REEL_STATE | ERR_INVALID_ORDER_STATE | ERR_SHIPMENT_ALREADY_INVOICED
    http_status: 409
    applies_to: all

  - priority: 42
    category: state
    check: "POST /shipments is refused while the order's pricing_status == HELD"
    error_id: ERR_ORDER_PRICING_HELD
    http_status: 409
    applies_to: "POST /shipments"

  - priority: 44
    category: state
    check: "POST /customer-orders/{id}/cancel is refused when any Shipment references the order"
    error_id: ERR_ORDER_HAS_SHIPMENTS
    http_status: 409
    applies_to: "POST /customer-orders/{id}/cancel"

  - priority: 46
    category: state
    check: "POST /listing-certifications/{id}/reinstate is refused when any OPEN FactoryInspection on the file has corrective_action_due_date earlier than the current logical date - the 30-day corrective action window lapsed, so the agency requires a fresh inspection rather than a reinstatement"
    error_id: ERR_OPEN_VARIATION_UNRESOLVED
    http_status: 409
    applies_to: "POST /listing-certifications/{id}/reinstate"

  - priority: 50
    category: business_safety
    check: "Marking and traceability: when CatalogProduct.marking_required is true, the EXTRUSION step payload must carry surface_marking_text exactly equal to CatalogProduct.required_marking_text, and lot release requires the stored surface_marking_text to still match"
    error_id: ERR_MARKING_MISMATCH
    http_status: 422
    applies_to: "POST /production-lots/{id}/process-steps, POST /production-lots/{id}/release"

  - priority: 52
    category: business_safety
    check: "Lot release requires concentricity_pct >= concentricity_min_pct and measured_min_wall_mils >= round(insulation_thickness_mils * min_wall_pct / 100, 2)"
    error_id: ERR_DIMENSIONAL_NONCONFORMANCE
    http_status: 422
    applies_to: "POST /production-lots/{id}/release"

  - priority: 54
    category: business_safety
    check: "Lot release requires the LATEST CableTest row for each release-required test type to exist and be PASS: SPARK and HIPOT always, plus PARTIAL_DISCHARGE when pd_test_required is true. Because PARTIAL_DISCHARGE is not part of the EXTRUDED -> TESTED promotion set, this rung is what an MV lot sitting at TESTED without a PD result hits."
    error_id: ERR_REQUIRED_TESTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /production-lots/{id}/release"

  - priority: 56
    category: business_safety
    check: "Lot release is refused when any CableTest on the lot has result FAIL"
    error_id: ERR_LOT_TEST_FAILED
    http_status: 422
    applies_to: "POST /production-lots/{id}/release"

  - priority: 57
    category: auth
    check: "Segregation of duties: the X-User-ID releasing a lot must differ from every operator_user_id on that lot's CableTests"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /production-lots/{id}/release"

  - priority: 58
    category: business_safety
    check: "A REWORK disposition is refused once rework_count has reached REWORK_LIMIT (2); the lot must be scrapped"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /production-lots/{id}/disposition"

  - priority: 60
    category: business_temporal
    check: "Extrusion line occupancy: [scheduled_start_at, scheduled_end_at] on the same line_code must clear every other ProductionLot with process_state NOT IN {SHIPPED, SCRAP_CLOSED} by at least CHANGEOVER_BUFFER_MINUTES (30) at both ends — reject when new_start < other_end + 30min AND other_start < new_end + 30min"
    error_id: ERR_LINE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /production-lots"

  - priority: 62
    category: business_temporal
    check: "Reel occupancy is half-open with no buffer: a load is refused when returned_at is not null and occupancy_start_at < returned_at (a load starting exactly at returned_at is accepted)"
    error_id: ERR_REEL_OCCUPANCY_OVERLAP
    http_status: 409
    applies_to: "POST /reels/{id}/load"

  - priority: 64
    category: business_temporal
    check: "Inspection cadence: inspection_date must be >= last_inspection_date + 60 days when a previous inspection exists"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /listing-certifications/{id}/inspections"

  - priority: 65
    category: business_referential
    check: "Compound qualification and rating: product release requires both compounds QUALIFIED (ERR_COMPOUND_NOT_QUALIFIED) and the insulation compound's temp_rating_c >= product temp_rating_c, max_voltage_v >= voltage_rating_v, and flame_test == VW_1 for THHN and THWN_2 (ERR_COMPOUND_RATING_INSUFFICIENT)"
    error_id: ERR_COMPOUND_NOT_QUALIFIED | ERR_COMPOUND_RATING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /catalog-products/{id}/release"

  - priority: 66
    category: business_referential
    check: "Listing certification must be ACTIVE to release a SKU and to release a lot"
    error_id: ERR_CERTIFICATION_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /catalog-products/{id}/release, POST /production-lots/{id}/release"

  - priority: 70
    category: business_constraint
    check: "Reel capacity: loaded_length_ft + load_length_ft <= capacity_ft"
    error_id: ERR_REEL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /reels/{id}/load"

  - priority: 72
    category: business_constraint
    check: "Shipment quantity: CustomerOrder.shipped_kft + shipped_length_ft / 1000 <= ordered_kft, and shipped_length_ft <= ProductionLot.packaged_length_ft"
    error_id: ERR_SHIPMENT_EXCEEDS_ORDER
    http_status: 422
    applies_to: "POST /shipments"

  - priority: 75
    category: business_fiscal
    check: "Rod availability: RodPurchaseLot.remaining_lbs >= consumed_rod_lbs of the lot being created"
    error_id: ERR_INSUFFICIENT_ROD_QUANTITY
    http_status: 422
    applies_to: "POST /production-lots"

  - priority: 77
    category: business_fiscal
    check: "Metal price availability: at least one MetalPriceQuote at or before order_date for the SKU's conductor_metal (order create); at least 3 quotes inside the inclusive 5-day float window (SHIP_DATE_FLOAT invoice)"
    error_id: ERR_NO_METAL_QUOTE | ERR_INSUFFICIENT_PRICE_HISTORY
    http_status: 422
    applies_to: "POST /customer-orders, POST /shipments/{id}/invoice"

  - priority: 80
    category: business_fiscal
    check: "Credit: the shipping account's status must be ACTIVE and credit_exposure_usd + Reel.deposit_usd must not exceed credit_limit_usd"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /shipments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint, /_ namespace) -------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every date/datetime default and every window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server never falls back to real wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock advanced or rewound; subsequent created_at, order_date, ship_date, tested_at, invoice_date and returned_date defaults derive from it"]

  # --- metal price quotes ----------------------------------------------------
  - method: POST
    path: "/metal-price-quotes"
    description: "Records an immutable daily settlement price for copper or aluminum rod. (metal, effective_date) is unique."
    roles: [ProcurementBuyer, PlantAdmin]
    code: 201
    input: [metal, effective_date, settlement_price_usd_per_lb, "source?"]
    output: MetalPriceQuote
    side_effects: []

  - method: GET
    path: "/metal-price-quotes"
    description: "Lists settlement prices, newest effective_date first, for pass-through and float-window inspection."
    roles: [ProcurementBuyer, ProcessEngineer, BillingAnalyst, PlantAdmin]
    code: 200
    input: ["metal?", "effective_date_from?", "effective_date_to?", "limit?", "offset?"]
    output: MetalPriceQuote[]
    side_effects: []

  # --- rod purchase lots ----------------------------------------------------
  - method: POST
    path: "/rod-purchase-lots"
    description: "Receives a copper or aluminum rod lot into inventory with its heat number and purchase basis."
    roles: [ProcurementBuyer, PlantAdmin]
    code: 201
    input: [metal, supplier_code, rod_diameter_mm, heat_number, purchase_weight_lbs, purchase_price_usd_per_lb, pricing_basis, received_date]
    output: RodPurchaseLot
    side_effects: ["remaining_lbs initialised to purchase_weight_lbs; committed_lbs and scrapped_lbs initialised to 0.00; status RECEIVED"]

  - method: GET
    path: "/rod-purchase-lots/{id}"
    description: "Returns one rod lot including its remaining, committed and scrapped mass buckets and version."
    roles: [ProcurementBuyer, ProcessEngineer, QualityEngineer, PlantAdmin]
    code: 200
    input: []
    output: RodPurchaseLot
    side_effects: []

  - method: GET
    path: "/rod-purchase-lots"
    description: "Lists rod lots, filterable by metal and status, created_at ASC."
    roles: [ProcurementBuyer, ProcessEngineer, QualityEngineer, PlantAdmin]
    code: 200
    input: ["metal?", "status?", "limit?", "offset?"]
    output: RodPurchaseLot[]
    side_effects: []

  # --- compounds ------------------------------------------------------------
  - method: POST
    path: "/compounds"
    description: "Registers an insulation or jacket compound formulation with its temperature, flame and voltage performance."
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [compound_code, layer_role, temp_rating_c, flame_test, max_voltage_v, "wet_rated?", "filler_pct?"]
    output: Compound
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/compounds/{id}"
    description: "Returns one compound formulation with its qualification status and version."
    roles: [ProcessEngineer, QualityEngineer, CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: Compound
    side_effects: []

  - method: POST
    path: "/compounds/{id}/qualify"
    description: "Qualifies a DRAFT or SUSPENDED compound for production use, stamping the qualification date from the logical clock."
    roles: [ProcessEngineer, PlantAdmin]
    code: 200
    input: []
    output: Compound
    side_effects: ["status QUALIFIED; qualification_date set; suspension_reason cleared; version bumped (a re-qualification therefore invalidates SKU pins taken against the earlier version)"]

  - method: POST
    path: "/compounds/{id}/suspend"
    description: "Suspends a QUALIFIED compound, cascading to every SKU that uses it as insulation or jacket."
    roles: [ProcessEngineer, QualityEngineer, PlantAdmin]
    code: 200
    input: [suspension_reason]
    output: Compound
    side_effects: ["status SUSPENDED; every RELEASED CatalogProduct referencing this compound moves to SUSPENDED; their QUOTED and LOCKED CustomerOrders move pricing_status HELD with hold_reason COMPOUND_SUSPENDED; their QUEUED ProductionLots move quality_state QUARANTINED"]

  # --- listing certifications and factory inspections -----------------------
  - method: POST
    path: "/listing-certifications"
    description: "Opens a listing agency file for a product family with its follow-up inspection interval."
    roles: [CertificationOfficer, PlantAdmin]
    code: 201
    input: [agency, file_number, product_family_code, initial_listing_date, "inspection_interval_days?"]
    output: ListingCertification
    side_effects: ["status PENDING; open_variation_count 0; inspection_interval_days defaults to 90"]

  - method: GET
    path: "/listing-certifications/{id}"
    description: "Returns one listing file with its inspection cadence fields and version."
    roles: [CertificationOfficer, ProcessEngineer, QualityEngineer, PlantAdmin]
    code: 200
    input: []
    output: ListingCertification
    side_effects: []

  - method: POST
    path: "/listing-certifications/{id}/inspections"
    description: "Records a follow-up factory inspection visit and applies its outcome to the listing file. Requires at least 60 days since the previous visit."
    roles: [CertificationOfficer, PlantAdmin]
    code: 201
    input: [inspection_date, inspector_code, findings_count, outcome]
    output: FactoryInspection
    side_effects: ["inspection_cadence recomputed; PENDING file becomes ACTIVE on a PASS; VARIATION outcome moves the file to VARIATION_NOTICE and opens a 30-day corrective action; SUSPEND outcome moves the file to SUSPENDED and cascades to its SKUs, their orders and their lots"]

  - method: GET
    path: "/listing-certifications/{id}/inspections"
    description: "Lists the follow-up inspection visits recorded against one listing file, inspection_date ASC then created_at ASC."
    roles: [CertificationOfficer, ProcessEngineer, QualityEngineer, PlantAdmin]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: FactoryInspection[]
    side_effects: []

  - method: POST
    path: "/listing-certifications/{id}/reinstate"
    description: "Reinstates a SUSPENDED or VARIATION_NOTICE listing file once every open variation is closed."
    roles: [CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: ListingCertification
    side_effects: ["status ACTIVE; each SUSPENDED CatalogProduct on this file is re-released when both pinned compound versions still match, otherwise it becomes OBSOLETE; orders held with hold_reason CERTIFICATION_SUSPENDED return to LOCKED; QUARANTINED lots of re-released SKUs return to PENDING"]

  # --- catalog products -----------------------------------------------------
  - method: POST
    path: "/catalog-products"
    description: "Defines a wire or cable SKU: conductor, construction, application rating, voltage class, wall tolerances and the compounds and listing file it is built to."
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [product_code, awg_size, conductor_metal, conductor_construction, application_rating, voltage_class, temp_rating_c, insulation_thickness_mils, conductor_lbs_per_kft, insulation_compound_id, "jacket_compound_id?", listing_certification_id, base_target_kft, "min_wall_pct?", "concentricity_min_pct?", "demand_index?"]
    output: CatalogProduct
    side_effects: ["voltage_rating_v, marking_required, pd_test_required and required_marking_text computed; volatility_index 0.0000; target_inventory_kft initialised to base_target_kft; status DRAFT"]

  - method: GET
    path: "/catalog-products/{id}"
    description: "Returns one SKU with its computed marking text, pinned compound versions, volatility index and inventory target."
    roles: [ProcessEngineer, QualityEngineer, CertificationOfficer, ShippingClerk, BillingAnalyst, PlantAdmin]
    code: 200
    input: []
    output: CatalogProduct
    side_effects: []

  - method: GET
    path: "/catalog-products"
    description: "Lists SKUs, filterable by the compounds and listing file they depend on, created_at ASC."
    roles: [ProcessEngineer, QualityEngineer, CertificationOfficer, ShippingClerk, BillingAnalyst, PlantAdmin]
    code: 200
    input: ["insulation_compound_id?", "jacket_compound_id?", "listing_certification_id?", "status?", "application_rating?", "limit?", "offset?"]
    output: CatalogProduct[]
    side_effects: []

  - method: POST
    path: "/catalog-products/{id}/release"
    description: "Releases a DRAFT or SUSPENDED SKU for order entry and production, pinning the compound versions it was qualified against."
    roles: [ProcessEngineer, PlantAdmin]
    code: 200
    input: []
    output: CatalogProduct
    side_effects: ["status RELEASED; pinned_insulation_compound_version and pinned_jacket_compound_version set from the current compound versions"]

  # --- inventory positioning ------------------------------------------------
  - method: POST
    path: "/inventory/reposition"
    description: "Recomputes each RELEASED SKU's metal volatility index and inventory target from construction-market demand and metal price history, in created_at ASC order."
    roles: [ProcessEngineer, PlantAdmin]
    code: 200
    input: [as_of_date, "product_ids?"]
    output: "{ as_of_date: string, evaluated_count: integer, skipped_count: integer, product_ids: string[] }"
    side_effects: ["metal_volatility_index and inventory_reposition_target applied to each RELEASED SKU in scope; volatility_index and target_inventory_kft updated; non-RELEASED SKUs keep their previous target"]

  # --- customers ------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Opens a distributor or contractor account with its credit limit, metal pass-through election and reel program."
    roles: [BillingAnalyst, PlantAdmin]
    code: 201
    input: [account_code, name, market_region, credit_limit_usd, "pass_through_enabled?", "reel_program?"]
    output: Customer
    side_effects: ["all ledger fields initialised to 0.00; status ACTIVE"]

  - method: GET
    path: "/customers/{id}"
    description: "Returns one account with its AR, reel deposit, credit memo and forfeiture ledger plus computed credit exposure."
    roles: [BillingAnalyst, ShippingClerk, PlantAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: PATCH
    path: "/customers/{id}"
    description: "Adjusts an account's credit limit, pass-through election or reel program and re-evaluates its credit standing."
    roles: [BillingAnalyst, PlantAdmin]
    code: 200
    input: ["credit_limit_usd?", "pass_through_enabled?", "reel_program?"]
    output: Customer
    side_effects: ["customer_credit_exposure recomputed; status flips to CREDIT_HOLD when exposure exceeds the new limit and back to ACTIVE when it does not"]

  # --- customer orders ------------------------------------------------------
  - method: POST
    path: "/customer-orders"
    description: "Books an order against a RELEASED SKU and quotes it with the metal pass-through, cut-to-length fee and volatility surcharge."
    roles: [BillingAnalyst, PlantAdmin]
    code: 201
    input: [customer_id, product_id, order_number, ordered_kft, price_basis, conversion_price_usd_per_kft, order_date, "cut_to_length_service?", "requested_cut_lengths_ft?"]
    output: CustomerOrder
    side_effects: ["order_quoted_total computed into quoted_metal_price_usd_per_lb, quoted_unit_price_usd_per_kft, quoted_subtotal_usd, quoted_cut_fee_usd, quoted_surcharge_usd and quoted_total_usd; pricing_status QUOTED; fulfillment_status OPEN; shipped_kft 0.000"]

  - method: GET
    path: "/customer-orders/{id}"
    description: "Returns one order with its quote breakdown, pricing_status, fulfillment_status and version."
    roles: [BillingAnalyst, ShippingClerk, ProcessEngineer, PlantAdmin, Customer]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []

  - method: GET
    path: "/customer-orders"
    description: "Lists orders, filterable by account and SKU, created_at ASC."
    roles: [BillingAnalyst, ShippingClerk, ProcessEngineer, PlantAdmin, Customer]
    code: 200
    input: ["customer_id?", "product_id?", "pricing_status?", "fulfillment_status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []

  - method: POST
    path: "/customer-orders/{id}/price-lock"
    description: "Confirms the quoted price basis for a QUOTED order, or releases a HELD order back to LOCKED once the blocking compound or listing issue is resolved."
    roles: [BillingAnalyst, PlantAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["pricing_status LOCKED; hold_reason cleared"]

  - method: POST
    path: "/customer-orders/{id}/cancel"
    description: "Cancels an order that has not shipped and returns the rod mass its queued lots had committed."
    roles: [BillingAnalyst, PlantAdmin]
    code: 200
    input: ["reason?"]
    output: CustomerOrder
    side_effects: ["fulfillment_status CANCELLED; pricing_status left unchanged; each QUEUED ProductionLot of the order moves process_state SCRAP_CLOSED with quality_state PENDING preserved and its consumed_rod_lbs is moved from the rod lot's committed_lbs back to remaining_lbs (compensating reversal, no scrap recorded)"]

  # --- production lots ------------------------------------------------------
  - method: POST
    path: "/production-lots"
    description: "Schedules a production lot on an extrusion line, drawing rod mass from a received rod lot. Requires the rod lot's current version."
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [product_id, rod_lot_id, "order_id?", lot_code, planned_length_ft, line_code, scheduled_start_at, scheduled_end_at, expected_rod_lot_version]
    output: ProductionLot
    side_effects: ["rod_mass_ledger moves consumed_rod_lbs from the rod lot's remaining_lbs to committed_lbs and bumps its version; traceability_code composed from the rod heat number and lot_code; process_state QUEUED; quality_state PENDING; rework_count 0"]

  - method: GET
    path: "/production-lots/{id}"
    description: "Returns one production lot with its measurements, concentricity, marking text, traceability code and both state dimensions."
    roles: [ProcessEngineer, QualityEngineer, ShippingClerk, CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: ProductionLot
    side_effects: []

  - method: GET
    path: "/production-lots"
    description: "Lists production lots, filterable by SKU, rod lot, order and line, created_at ASC."
    roles: [ProcessEngineer, QualityEngineer, ShippingClerk, CertificationOfficer, PlantAdmin]
    code: 200
    input: ["product_id?", "rod_lot_id?", "order_id?", "line_code?", "process_state?", "quality_state?", "limit?", "offset?"]
    output: ProductionLot[]
    side_effects: []

  - method: POST
    path: "/production-lots/{id}/process-steps"
    description: "Records completion of a DRAWING, STRANDING or EXTRUSION step. The EXTRUSION step carries the wall and diameter measurements and the surface marking that was printed."
    roles: [ProcessEngineer, PlantAdmin]
    code: 200
    input: [step, "measured_min_wall_mils?", "measured_max_wall_mils?", "measured_avg_od_mm?", "surface_marking_text?"]
    output: ProductionLot
    side_effects: ["process_state advances DRAWN, STRANDED then EXTRUDED; on EXTRUSION lot_dimensional_conformance computes concentricity_pct and sets quality_state NONCONFORMING when concentricity is below the SKU limit (the minimum-wall check is deferred to release, so a concentric but under-walled lot still passes this step); surface_marking_text stored and checked against the SKU's required_marking_text when marking_required"]

  - method: POST
    path: "/production-lots/{id}/tests"
    description: "Records a spark, high-potential or partial-discharge test on an extruded lot. The operator is taken from X-User-ID."
    roles: [QualityEngineer, PlantAdmin]
    code: 201
    input: [test_type, duration_sec, "test_voltage_kv?", "faults_detected?", "breakdown_detected?", "pd_level_pc?"]
    output: CableTest
    side_effects: ["cable_test_result decides PASS or FAIL; a FAIL moves the lot's quality_state to NONCONFORMING; once the latest row per required test_type is PASS the process_state moves EXTRUDED to TESTED while quality_state stays PENDING until the QualityEngineer releases the lot; superseded FAIL rows are retained and block release at validations[priority=56]"]

  - method: GET
    path: "/production-lots/{id}/tests"
    description: "Lists the electrical tests recorded on one lot, created_at ASC."
    roles: [QualityEngineer, ProcessEngineer, CertificationOfficer, PlantAdmin]
    code: 200
    input: ["test_type?", "result?", "limit?", "offset?"]
    output: CableTest[]
    side_effects: []

  - method: POST
    path: "/production-lots/{id}/disposition"
    description: "Dispositions a nonconforming lot for rework or scrap. Rework is refused once the rework limit of 2 is reached."
    roles: [QualityEngineer, PlantAdmin]
    code: 200
    input: [disposition, "rewind_to?", "reason?"]
    output: ProductionLot
    side_effects: ["REWORK increments rework_count, rewinds process_state to DRAWN or STRANDED, clears the extrusion measurements and returns quality_state to PENDING; SCRAPPED sets process_state SCRAP_CLOSED, moves consumed_rod_lbs from the rod lot's committed_lbs to scrapped_lbs, and quarantines the rod lot with its remaining queued sibling lots once scrap passes 10 percent of the purchase weight"]

  - method: POST
    path: "/production-lots/{id}/release"
    description: "Releases a tested lot to packaging. Requires conforming dimensions, the complete PASS test set, matching product marking, an ACTIVE listing file, and a releaser who did not run any of the lot's tests."
    roles: [QualityEngineer, PlantAdmin]
    code: 200
    input: [packaged_length_ft]
    output: ProductionLot
    side_effects: ["quality_state CONFORMING with process_state left at TESTED until a reel is loaded; packaged_length_ft stored from the payload; released_by_user_id set from X-User-ID"]

  # --- reels ---------------------------------------------------------------
  - method: POST
    path: "/reels"
    description: "Registers a wood returnable, steel returnable or non-returnable reel with its deposit and capacity. A non-returnable reel must carry a zero deposit."
    roles: [ShippingClerk, PlantAdmin]
    code: 201
    input: [reel_serial, reel_type, deposit_usd, capacity_ft]
    output: Reel
    side_effects: ["status AVAILABLE; loaded_length_ft 0; cycle_count 0"]

  - method: GET
    path: "/reels/{id}"
    description: "Returns one reel with its occupancy window, holder, cycle count and status."
    roles: [ShippingClerk, BillingAnalyst, ProcessEngineer, PlantAdmin]
    code: 200
    input: []
    output: Reel
    side_effects: []

  - method: GET
    path: "/reels"
    description: "Lists reels, filterable by the lot loaded on them and the account holding them, created_at ASC."
    roles: [ShippingClerk, BillingAnalyst, ProcessEngineer, PlantAdmin]
    code: 200
    input: ["status?", "reel_type?", "current_lot_id?", "held_by_customer_id?", "limit?", "offset?"]
    output: Reel[]
    side_effects: []

  - method: POST
    path: "/reels/{id}/load"
    description: "Loads a packaged lot onto an available reel for a stated occupancy start. The occupancy window is half-open: a load starting exactly at the previous return instant is accepted."
    roles: [ShippingClerk, PlantAdmin]
    code: 200
    input: [lot_id, load_length_ft, occupancy_start_at]
    output: Reel
    side_effects: ["status LOADED; current_lot_id and loaded_length_ft set; occupancy_start_at recorded; occupancy_end_at, shipped_at and returned_at cleared; the loaded ProductionLot moves process_state TESTED -> PACKAGED"]

  # --- shipments ------------------------------------------------------------
  - method: POST
    path: "/shipments"
    description: "Stages a shipment of a loaded reel against an order, charging the reel deposit to the account. Requires the order's current version."
    roles: [ShippingClerk, PlantAdmin]
    code: 201
    input: [order_id, lot_id, reel_id, shipped_length_ft, ship_date, "cuts_count?", expected_order_version]
    output: Shipment
    side_effects: ["status STAGED; deposit_charged_usd taken from the reel; reel moves to SHIPPED (or RETIRED for a non-returnable reel) with shipped_at and occupancy_end_at set and cycle_count incremented; lot process_state SHIPPED; order shipped_kft increased, fulfillment_status PARTIALLY_SHIPPED or FULFILLED, version bumped; customer deposit_charged_total_usd and reel_deposit_balance_usd increased and customer_credit_exposure recomputed"]

  - method: GET
    path: "/shipments/{id}"
    description: "Returns one shipment with the metal price and variant used, its extension, fee, surcharge and invoice amount."
    roles: [ShippingClerk, BillingAnalyst, PlantAdmin, Customer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/shipments"
    description: "Lists shipments, filterable by order, lot and reel, created_at ASC."
    roles: [ShippingClerk, BillingAnalyst, PlantAdmin, Customer]
    code: 200
    input: ["order_id?", "lot_id?", "reel_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/shipments/{id}/invoice"
    description: "Invoices a staged shipment, pricing the metal content either at the order-date lock or at the mean of the five-day float window ending on the ship date."
    roles: [BillingAnalyst, PlantAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["shipment_invoice_amount computes metal_price_used_usd_per_lb, price_variant_applied, unit_price_usd_per_kft, extended_amount_usd, cut_fee_usd, volatility_surcharge_usd and invoice_amount_usd; status INVOICED; invoice_date set; order invoiced_total_usd increased and pricing_status INVOICED once fully shipped; customer open_ar_usd increased and customer_credit_exposure recomputed"]

  # --- reel returns ---------------------------------------------------------
  - method: POST
    path: "/reels/{id}/returns"
    description: "Receives a returnable reel back from the customer and settles its deposit under the reel type's refund schedule."
    roles: [ShippingClerk, PlantAdmin]
    code: 201
    input: [shipment_id, returned_date, condition]
    output: ReelReturn
    side_effects: ["reel_deposit_refund computes days_out, refund_usd, forfeited_usd and refund_variant_applied; reel status AVAILABLE, DAMAGED or RETIRED with returned_at set and loaded_length_ft cleared; customer reel_deposit_balance_usd decreased, credit_memo_balance_usd and forfeited_deposit_total_usd increased, credit_exposure_usd recomputed and status re-evaluated"]

  - method: GET
    path: "/reels/{id}/returns"
    description: "Lists the return events recorded against one reel, created_at ASC."
    roles: [ShippingClerk, BillingAnalyst, PlantAdmin]
    code: 200
    input: ["condition?", "limit?", "offset?"]
    output: ReelReturn[]
    side_effects: []

  - method: GET
    path: "/shipments/{id}/reel-returns"
    description: "Lists the reel return events settled against one shipment, created_at ASC."
    roles: [ShippingClerk, BillingAnalyst, PlantAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReelReturn[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication, authorization, request shape -------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed for the endpoint, or a Customer touches an order, shipment or reel that does not belong to its own account"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID releasing a production lot also appears as operator_user_id on one of that lot's CableTest rows"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum member, out-of-range number, scheduled_end_at not after scheduled_start_at, empty requested_cut_lengths_ft on a cut-to-length order, pd_level_pc missing on a PARTIAL_DISCHARGE test, or pagination limit outside 1..100"

  # --- not found -------------------------------------------------------------
  - id: ERR_ROD_LOT_NOT_FOUND
    http: 404
    condition: "rod_lot_id or path id does not match any RodPurchaseLot"
  - id: ERR_COMPOUND_NOT_FOUND
    http: 404
    condition: "insulation_compound_id, jacket_compound_id or path id does not match any Compound"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "listing_certification_id or path id does not match any ListingCertification"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id or path id does not match any CatalogProduct"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id or path id does not match any Customer"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id or path id does not match any CustomerOrder"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lot_id or path id does not match any ProductionLot"
  - id: ERR_REEL_NOT_FOUND
    http: 404
    condition: "reel_id or path id does not match any Reel"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment_id or path id does not match any Shipment"

  # --- uniqueness ------------------------------------------------------------
  - id: ERR_DUPLICATE_METAL_QUOTE
    http: 409
    condition: "A MetalPriceQuote already exists for that (metal, effective_date) pair"
  - id: ERR_DUPLICATE_PRODUCT_CODE
    http: 409
    condition: "A CatalogProduct already exists with that product_code"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_ROD_LOT_VERSION
    http: 412
    condition: "expected_rod_lot_version does not equal the RodPurchaseLot's current version"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the CustomerOrder's current version"

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_COMPOUND_STATE
    http: 409
    condition: "Qualifying an already QUALIFIED compound, or suspending a compound that is not QUALIFIED"
  - id: ERR_INVALID_CERTIFICATION_STATE
    http: 409
    condition: "Recording an inspection on a SUSPENDED listing file, or reinstating a file that is already ACTIVE or still PENDING"
  - id: ERR_INVALID_PRODUCT_STATE
    http: 409
    condition: "Releasing a SKU that is already RELEASED or OBSOLETE, or ordering against a SKU that is not RELEASED"
  - id: ERR_INVALID_LOT_STATE
    http: 409
    condition: "A process step, test, disposition, release, load or shipment is requested from a lot process_state or quality_state that does not permit it (for example testing a lot that is not EXTRUDED, dispositioning a lot whose quality_state is not NONCONFORMING, or loading a lot that is not PACKAGED)"
  - id: ERR_INVALID_REEL_STATE
    http: 409
    condition: "Loading a reel that is not AVAILABLE, shipping a reel that is not LOADED, or returning a reel that is not RETURN_PENDING"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "Price-locking an order that is already LOCKED or INVOICED, cancelling an order that is already CANCELLED or FULFILLED, or shipping against a CANCELLED order"
  - id: ERR_ORDER_PRICING_HELD
    http: 409
    condition: "A shipment is staged while the order's pricing_status is HELD because its compound or listing file was suspended"
  - id: ERR_ORDER_HAS_SHIPMENTS
    http: 409
    condition: "Cancellation is attempted on an order that already has at least one Shipment"
  - id: ERR_SHIPMENT_ALREADY_INVOICED
    http: 409
    condition: "Invoicing a shipment whose status is already INVOICED"
  - id: ERR_OPEN_VARIATION_UNRESOLVED
    http: 409
    condition: "Reinstating a listing file while an OPEN FactoryInspection's 30-day corrective_action_due_date has already lapsed against the logical clock"

  # --- product safety and compliance ----------------------------------------
  - id: ERR_MARKING_MISMATCH
    http: 422
    condition: "The surface marking printed on a lot of a marking-required SKU does not exactly equal the SKU's required_marking_text"
  - id: ERR_DIMENSIONAL_NONCONFORMANCE
    http: 422
    condition: "Release is attempted while concentricity_pct is below concentricity_min_pct or measured_min_wall_mils is below the required minimum wall"
  - id: ERR_REQUIRED_TESTS_INCOMPLETE
    http: 422
    condition: "Release is attempted before a PASS exists for every required test type (spark, high potential, and partial discharge for medium-voltage SKUs)"
  - id: ERR_LOT_TEST_FAILED
    http: 422
    condition: "Release is attempted on a lot that carries at least one FAIL CableTest row"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 422
    condition: "A REWORK disposition is requested when rework_count has already reached 2"
  - id: ERR_COMPOUND_NOT_QUALIFIED
    http: 422
    condition: "SKU release is attempted while its insulation or jacket compound is not QUALIFIED"
  - id: ERR_COMPOUND_RATING_INSUFFICIENT
    http: 422
    condition: "The insulation compound's temperature rating, voltage ceiling or flame test does not cover the SKU's application rating"
  - id: ERR_CERTIFICATION_NOT_ACTIVE
    http: 422
    condition: "SKU release or lot release is attempted while the listing file is PENDING, VARIATION_NOTICE or SUSPENDED"

  # --- temporal / occupancy --------------------------------------------------
  - id: ERR_LINE_SCHEDULE_CONFLICT
    http: 409
    condition: "The requested extrusion line window does not clear an existing live lot on the same line by the 30-minute changeover buffer at both ends"
  - id: ERR_REEL_OCCUPANCY_OVERLAP
    http: 409
    condition: "A reel load starts before the instant the reel was last returned"
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "An inspection is recorded fewer than 60 days after the file's last inspection_date"

  # --- capacity and quantity constraints ------------------------------------
  - id: ERR_REEL_CAPACITY_EXCEEDED
    http: 422
    condition: "loaded_length_ft plus the requested load_length_ft exceeds the reel's capacity_ft"
  - id: ERR_REEL_DEPOSIT_MISMATCH
    http: 422
    condition: "A NON_RETURNABLE reel is registered with a non-zero deposit_usd, or a returnable reel with a zero deposit_usd"
  - id: ERR_SHIPMENT_EXCEEDS_ORDER
    http: 422
    condition: "The shipment would push the order past ordered_kft, or shipped_length_ft exceeds the lot's packaged_length_ft"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_INSUFFICIENT_ROD_QUANTITY
    http: 422
    condition: "The rod lot's remaining_lbs is less than the mass the new production lot would consume"
  - id: ERR_NO_METAL_QUOTE
    http: 422
    condition: "No MetalPriceQuote exists for the SKU's conductor metal at or before the order_date"
  - id: ERR_INSUFFICIENT_PRICE_HISTORY
    http: 422
    condition: "A SHIP_DATE_FLOAT invoice finds fewer than 3 quotes in the inclusive 5-day window ending on the ship date"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "The account is on CREDIT_HOLD, or staging the shipment would push credit exposure past credit_limit_usd"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant systems administrator. Holds every operation for setup and recovery, and is the only role that may move the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5"

  - name: ProcurementBuyer
    description: "Buys copper and aluminum rod and publishes the daily settlement prices that drive pass-through pricing."
    identity: "opaque"
    exclusive_operations:
      - "POST /metal-price-quotes"
      - "POST /rod-purchase-lots"
    shared_operations:
      - "GET /metal-price-quotes"
      - "GET /rod-purchase-lots"
      - "GET /rod-purchase-lots/{id}"

  - name: ProcessEngineer
    description: "Owns compound formulation, SKU definition, extrusion scheduling, the drawing/stranding/extrusion steps and inventory positioning."
    identity: "opaque"
    exclusive_operations:
      - "POST /compounds"
      - "POST /compounds/{id}/qualify"
      - "POST /catalog-products"
      - "POST /catalog-products/{id}/release"
      - "POST /inventory/reposition"
      - "POST /production-lots"
      - "POST /production-lots/{id}/process-steps"
    shared_operations:
      - "POST /compounds/{id}/suspend"
      - "GET /compounds/{id}"
      - "GET /catalog-products, GET /catalog-products/{id}"
      - "GET /production-lots, GET /production-lots/{id}, GET /production-lots/{id}/tests"
      - "GET /listing-certifications/{id}, GET /listing-certifications/{id}/inspections"
      - "GET /metal-price-quotes, GET /rod-purchase-lots, GET /rod-purchase-lots/{id}"
      - "GET /customer-orders, GET /customer-orders/{id}"
      - "GET /reels, GET /reels/{id}"

  - name: QualityEngineer
    description: "Runs spark, high-potential and partial-discharge tests, dispositions nonconforming lots and releases conforming lots. Cannot release a lot it tested."
    identity: "opaque"
    exclusive_operations:
      - "POST /production-lots/{id}/tests"
      - "POST /production-lots/{id}/disposition"
      - "POST /production-lots/{id}/release"
    shared_operations:
      - "POST /compounds/{id}/suspend"
      - "GET /compounds/{id}"
      - "GET /catalog-products, GET /catalog-products/{id}"
      - "GET /production-lots, GET /production-lots/{id}, GET /production-lots/{id}/tests"
      - "GET /listing-certifications/{id}, GET /listing-certifications/{id}/inspections"
      - "GET /rod-purchase-lots, GET /rod-purchase-lots/{id}"

  - name: CertificationOfficer
    description: "Maintains listing agency files and records the agency's follow-up factory inspections, variations and reinstatements."
    identity: "opaque"
    exclusive_operations:
      - "POST /listing-certifications"
      - "POST /listing-certifications/{id}/inspections"
      - "POST /listing-certifications/{id}/reinstate"
    shared_operations:
      - "GET /listing-certifications/{id}, GET /listing-certifications/{id}/inspections"
      - "GET /compounds/{id}"
      - "GET /catalog-products, GET /catalog-products/{id}"
      - "GET /production-lots, GET /production-lots/{id}, GET /production-lots/{id}/tests"

  - name: ShippingClerk
    description: "Manages the reel fleet, loads packaged lots, stages shipments and receives returned reels. Never prices or invoices."
    identity: "opaque"
    exclusive_operations:
      - "POST /reels"
      - "POST /reels/{id}/load"
      - "POST /shipments"
      - "POST /reels/{id}/returns"
    shared_operations:
      - "GET /reels, GET /reels/{id}, GET /reels/{id}/returns"
      - "GET /shipments, GET /shipments/{id}, GET /shipments/{id}/reel-returns"
      - "GET /customers/{id}"
      - "GET /customer-orders, GET /customer-orders/{id}"
      - "GET /catalog-products, GET /catalog-products/{id}"
      - "GET /production-lots, GET /production-lots/{id}"

  - name: BillingAnalyst
    description: "Opens accounts, books and prices orders, invoices shipments and settles reel deposits against credit. Never touches production or reels."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "PATCH /customers/{id}"
      - "POST /customer-orders"
      - "POST /customer-orders/{id}/price-lock"
      - "POST /customer-orders/{id}/cancel"
      - "POST /shipments/{id}/invoice"
    shared_operations:
      - "GET /customers/{id}"
      - "GET /customer-orders, GET /customer-orders/{id}"
      - "GET /shipments, GET /shipments/{id}, GET /shipments/{id}/reel-returns"
      - "GET /reels, GET /reels/{id}, GET /reels/{id}/returns"
      - "GET /catalog-products, GET /catalog-products/{id}"
      - "GET /metal-price-quotes"

  - name: Customer
    description: "Distributor or contractor account. X-User-ID is the Customer id; may read only its own account, orders and shipments."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET /customers/{id} (own account only)"
      - "GET /customer-orders, GET /customer-orders/{id} (own orders only)"
      - "GET /shipments, GET /shipments/{id} (own shipments only)"
