              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 2, elapsed_seconds: 240, instantaneous_leakage_cfm: 200.0, injection_pressure_pa: 720.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${job_id}/leakage-samples"
              payload: { sample_seq: 3, elapsed_seconds: 480, instantaneous_leakage_cfm: 120.0, injection_pressure_pa: 730.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre_abort_working: $.data.working_leakage_cfm25, pre_abort_reduction: $.data.sealed_leakage_reduction_cfm, pre_abort_baseline: $.data.baseline_leakage_cfm25 }
          trigger:
            - call: "POST /duct-sealing/seal-jobs/${job_id}/abort"
              payload: { abort_reason: "homeowner stopped work mid-run" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job_status: $.data.status, job_abort_reason: $.data.abort_reason }
          assert:
            - "Pre-abort ledger: ${pre_abort_working} == 120.00, ${pre_abort_reduction} == 180.00, ${pre_abort_baseline} == 300.00, and 120.00 + 180.00 == 300.00"
            - "${job_status} == ABORTED_MANUAL and ${job_abort_reason} == 'homeowner stopped work mid-run'"
            - "DuctSystem.${ds1_id}.working_leakage_cfm25 == 300.00 and sealed_leakage_reduction_cfm == 0.00 (identity restored: 300.00 + 0.00 == 300.00)"
            - "DuctSystem.${ds1_id}.baseline_leakage_cfm25 == 300.00 (unchanged by the compensation)"
            - "DuctSystem.${ds1_id}.seal_status == SEAL_PENDING and active_seal_job_id == null"
            - "DuctSystem.${ds1_id}.eligibility_status == ELIGIBLE (the abort does not exclude the system)"
            - "Technician.${tech1_id}.open_seal_job_count == 0"
            - "GET /duct-sealing/seal-jobs/${job_id}/leakage-samples still returns 3 rows (sample history is immutable)"
            - "SealJob.${job_id}.current_leakage_cfm == 120.0 and sample_count == 3 (the job keeps its own run record)"

