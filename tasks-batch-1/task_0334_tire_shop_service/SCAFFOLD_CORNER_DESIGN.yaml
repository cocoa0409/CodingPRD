              as: ServiceAdvisor
              captures: { veh_b: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_a}", vehicle_id: "${veh_b}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VEHICLE_NOT_OWNED"

