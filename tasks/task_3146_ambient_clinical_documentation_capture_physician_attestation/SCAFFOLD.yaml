    roles: [PlatformAdmin, Physician, ComplianceOfficer]
    code: 200
    input: ["encounter_status?"]
    output: Encounter[]
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/patients/{id}/consents"
    description: "List consents of a patient"
    roles: [Patient, Physician, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: AmbientConsent[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/physicians"
    description: "Register a physician"
    roles: [PlatformAdmin]
    code: 201
    input: [npi, full_name, specialty_code]
    output: Physician
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/physicians/{id}"
    description: "Read one physician"
    roles: [PlatformAdmin, Physician, ComplianceOfficer, QAAuditor]
    code: 200
    input: []
    output: Physician
    side_effects: []
  - method: PATCH
    path: "/ambient-clinical-documentation/physicians/{id}"
    description: "Update physician status (suspend/reactivate)"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Physician
    side_effects: ["increments Physician.version by 1"]
  - method: GET
    path: "/ambient-clinical-documentation/physicians/{id}/encounters"
    description: "List encounters of a physician"
    roles: [Physician, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["encounter_status?"]
    output: Encounter[]
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/physicians/{id}/note-drafts"
    description: "List note drafts authored by a physician"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: NoteDraft[]
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/physicians/{id}/attestations"
    description: "List attestations by a physician"
    roles: [Physician, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Attestation[]
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/physicians/{id}/documentation-metrics"
    description: "List documentation metrics of a physician"
    roles: [Physician, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["period_start?", "status?"]
    output: DocumentationMetric[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/physicians/{id}/documentation-metrics/recompute"
    description: "Create-if-absent and recompute the metric row for the calendar month containing period_start; finalize=true locks it"
    roles: [Physician, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [period_start, "finalize?"]
    output: DocumentationMetric
    side_effects: ["documentation_time provisional/final/after_hours recomputed", "FINAL when finalize=true"]
  - method: POST
    path: "/ambient-clinical-documentation/qa-auditors"
    description: "Register a QA auditor"
    roles: [PlatformAdmin]
    code: 201
    input: [employee_code, full_name, specialty_codes]
    output: QAAuditor
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/qa-auditors/{id}"
    description: "Read one QA auditor"
    roles: [QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: QAAuditor
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/qa-auditors/{id}/qa-samples"
    description: "List QA samples assigned to an auditor"
    roles: [QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: QASample[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/note-templates"
    description: "Create a note template"
    roles: [PlatformAdmin]
    code: 201
    input: [specialty_code, template_version, field_specs, "completeness_multiplier?", "low_confidence_threshold?", "active?"]
    output: NoteTemplate
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/note-templates/{id}"
    description: "Read one note template"
    roles: [PlatformAdmin, Physician, ComplianceOfficer, QAAuditor, Patient]
    code: 200
    input: []
    output: NoteTemplate
    side_effects: []
  - method: PATCH
    path: "/ambient-clinical-documentation/note-templates/{id}"
    description: "Activate/deactivate a template"
    roles: [PlatformAdmin]
    code: 200
    input: [active]
    output: NoteTemplate
    side_effects: ["increments NoteTemplate.version by 1"]
  - method: GET
    path: "/ambient-clinical-documentation/note-templates/{id}/note-drafts"
    description: "List drafts created from a template"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: NoteDraft[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/encounters"
    description: "Create an encounter (creating physician must be the attending physician)"
    roles: [Physician]
    code: 201
    input: [patient_id, physician_id, "scheduled_start?"]
    output: Encounter
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/encounters/{id}"
    description: "Read one encounter"
    roles: [Physician, Patient, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Encounter
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/encounters/{id}/start"
    description: "Start the encounter (encounter_status SCHEDULED -> IN_PROGRESS)"
    roles: [Physician]
    code: 200
    input: []
    output: Encounter
    side_effects: ["started_at := now", "increments Encounter.version by 1"]
  - method: POST
    path: "/ambient-clinical-documentation/encounters/{id}/complete"
    description: "Complete the encounter; allowed even before documentation is attested (after-hours charting)"
    roles: [Physician]
    code: 200
    input: []
    output: Encounter
    side_effects: ["ended_at := now", "increments Encounter.version by 1"]
  - method: POST
    path: "/ambient-clinical-documentation/encounters/{id}/cancel"
    description: "Cancel the encounter; cascades consent EXPIRED and purges in-flight captures"
    roles: [Physician, ComplianceOfficer]
    code: 200
    input: ["cancel_reason?"]
    output: Encounter
    side_effects: ["consent GRANTED -> EXPIRED", "captures RECORDING/PAUSED -> PURGED", "increments Encounter.version by 1"]
  - method: GET
    path: "/ambient-clinical-documentation/encounters/{id}/consents"
    description: "List consents of an encounter"
    roles: [Patient, Physician, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: AmbientConsent[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/encounters/{id}/consents"
    description: "Grant ambient consent for the encounter (signage required; one GRANTED consent per encounter)"
    roles: [Patient, ComplianceOfficer]
    code: 201
    input: [patient_id, signage_posted, captured_via]
    output: AmbientConsent
    side_effects: ["granted_at := now"]
  - method: POST
    path: "/ambient-clinical-documentation/consents/{id}/opt-out"
    description: "Patient opt-out; triggers the purge/invalidate/demote cascade"
    roles: [Patient]
    code: 200
    input: ["reason?"]
    output: AmbientConsent
    side_effects: ["capture purge cascade", "AUDIO field invalidation", "draft demotion to DRAFT"]
  - method: POST
    path: "/ambient-clinical-documentation/consents/{id}/revoke"
    description: "Compliance revocation; same cascade as opt-out"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: AmbientConsent
    side_effects: ["capture purge cascade", "AUDIO field invalidation", "draft demotion to DRAFT"]
  - method: GET
    path: "/ambient-clinical-documentation/encounters/{id}/audio-captures"
    description: "List audio captures of an encounter"
    roles: [Physician, Patient, ComplianceOfficer, QAAuditor, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: AudioCapture[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/encounters/{id}/audio-captures"
    description: "Start an ambient audio capture (requires IN_PROGRESS encounter, GRANTED consent, no active capture, 60s gap buffer)"
    roles: [Physician]
    code: 201
    input: [planned_retention_days]
    output: AudioCapture
    side_effects: ["started_at := now", "encounter.audio_status := RECORDING_ACTIVE"]
  - method: GET
    path: "/ambient-clinical-documentation/audio-captures/{id}"
    description: "Read one audio capture"
    roles: [Physician, ComplianceOfficer, QAAuditor, PlatformAdmin]
    code: 200
    input: []
    output: AudioCapture
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/audio-captures/{id}/pause"
    description: "Pause recording"
    roles: [Physician]
    code: 200
    input: []
    output: AudioCapture
    side_effects: ["pause interval opens"]
  - method: POST
    path: "/ambient-clinical-documentation/audio-captures/{id}/resume"
    description: "Resume recording"
    roles: [Physician]
    code: 200
    input: []
    output: AudioCapture
    side_effects: ["pause interval closes; recorded_seconds conserved across the pause/resume pair"]
  - method: POST
    path: "/ambient-clinical-documentation/audio-captures/{id}/stop"
    description: "Stop recording; finalizes recorded_seconds excluding paused time"
    roles: [Physician]
    code: 200
    input: []
    output: AudioCapture
    side_effects: ["ended_at := now", "recorded_seconds finalized", "encounter.audio_status := AUDIO_STOPPED"]
  - method: POST
    path: "/ambient-clinical-documentation/audio-captures/{id}/purge"
    description: "Compliance purge of a CAPTURED or TRANSCRIBED capture (blocked by legal hold)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AudioCapture
    side_effects: ["purge_reason := MANUAL"]
  - method: POST
    path: "/ambient-clinical-documentation/audio-captures/{id}/legal-hold"
    description: "Set or clear a legal hold"
    roles: [ComplianceOfficer]
    code: 200
    input: [hold]
    output: AudioCapture
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/audio-captures/{id}/segments"
    description: "Append a speaker segment; half-open intervals must be pairwise disjoint within the capture"
    roles: [Physician]
    code: 201
    input: [start_offset_ms, end_offset_ms, speaker_role, base_confidence]
    output: SpeakerSegment
    side_effects: ["effective_confidence computed"]
  - method: GET
    path: "/ambient-clinical-documentation/audio-captures/{id}/segments"
    description: "List speaker segments of a capture (empty after purge)"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["speaker_role?"]
    output: SpeakerSegment[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/segments/{id}/reassign-speaker"
    description: "Reassign a segment's speaker role; increments reassignment_count and decays effective_confidence"
    roles: [Physician]
    code: 200
    input: [new_speaker_role]
    output: SpeakerSegment
    side_effects: ["reassignment_count += 1", "effective_confidence recomputed", "increments SpeakerSegment.version by 1"]
  - method: GET
    path: "/ambient-clinical-documentation/encounters/{id}/note-drafts"
    description: "List note drafts of an encounter"
    roles: [Physician, Patient, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: NoteDraft[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/encounters/{id}/note-drafts"
    description: "Generate a note draft from a template; supersedes (voids) any existing non-terminal draft; OCC on the encounter"
    roles: [Physician]
    code: 201
    input: [template_id, expected_encounter_version]
    output: NoteDraft
    side_effects:
      - "existing draft in DRAFT|EDITED|IN_REVIEW|AMENDED -> VOID"
      - "NoteField rows seeded from template field_specs (value null, source SYSTEM)"
      - "completeness_score computed"
      - "encounter.documentation_status := DRAFTING"
      - "increments Encounter.version by 1"
  - method: GET
    path: "/ambient-clinical-documentation/note-drafts/{id}"
    description: "Read one note draft (includes computed completeness and billing totals)"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: NoteDraft
    side_effects: []
  - method: PATCH
    path: "/ambient-clinical-documentation/note-drafts/{id}"
    description: "Edit draft fields (OCC on the draft); moves IN_REVIEW -> EDITED"
    roles: [Physician]
    code: 200
    input: [expected_note_draft_version, field_updates]
    output: NoteDraft
    side_effects: ["edited fields become MANUAL/validated", "completeness_score recomputed", "increments NoteDraft.version by 1"]
  - method: POST
    path: "/ambient-clinical-documentation/note-drafts/{id}/submit-review"
    description: "Submit draft for review (DRAFT|EDITED|AMENDED -> IN_REVIEW)"
    roles: [Physician]
    code: 200
    input: []
    output: NoteDraft
    side_effects: ["encounter.documentation_status := IN_REVIEW"]
  - method: POST
    path: "/ambient-clinical-documentation/note-drafts/{id}/regenerate"
    description: "Pull fresh content from the transcript (IN_REVIEW -> DRAFT); requires GRANTED consent and TRANSCRIBED audio"
    roles: [Physician]
    code: 200
    input: []
    output: NoteDraft
    side_effects: ["non-MANUAL fields refilled with source AUDIO", "regeneration_count += 1", "completeness_score recomputed", "increments NoteDraft.version by 1"]
  - method: POST
    path: "/ambient-clinical-documentation/note-drafts/{id}/attest"
    description: "Physician attestation; the note enters the legal record; unconfirmed suggestions expire; QA sampling and metric counters update"
    roles: [Physician]
    code: 200
    input: []
    output: NoteDraft
    side_effects:
      - "Attestation created (INITIAL or AMENDMENT)"
      - "SUGGESTED/MODIFIED suggestions -> EXPIRED"
      - "billing variants recomputed"
      - "DocumentationMetric.notes_attested += 1 (row auto-created for the attestation month)"
      - "LOW_CONFIDENCE QASample auto-queued when completeness_at_attestation < template.low_confidence_threshold"
  - method: POST
    path: "/ambient-clinical-documentation/note-drafts/{id}/amend"
    description: "Open an amendment cycle on an attested note (compensates the attestation metric increment)"
    roles: [Physician]
    code: 200
    input: []
    output: NoteDraft
    side_effects: ["amendment_count += 1", "DocumentationMetric.notes_attested -= 1"]
  - method: POST
    path: "/ambient-clinical-documentation/note-drafts/{id}/void"
    description: "Void a non-terminal draft"
    roles: [Physician, ComplianceOfficer]
    code: 200
    input: []
    output: NoteDraft
    side_effects: ["encounter.documentation_status := NOT_STARTED when no other active draft"]
  - method: GET
    path: "/ambient-clinical-documentation/note-drafts/{id}/fields"
    description: "List the discrete fields of a draft"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["source?", "validated?"]
    output: NoteField[]
    side_effects: []
  - method: GET
    path: "/ambient-clinical-documentation/note-drafts/{id}/attestations"
    description: "List attestations of a draft (append-only legal record)"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Attestation[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/note-drafts/{id}/code-suggestions"
    description: "Generate a batch of order/diagnosis/billing code suggestions; ranks assigned; max 8 active per draft"
    roles: [Physician]
    code: 201
    input: [suggestions]
    output: CodeSuggestion[]
    side_effects: ["line_total_cents computed per BILLING suggestion", "ranks assigned (confidence DESC, created_at ASC)", "billing variants recomputed"]
  - method: GET
    path: "/ambient-clinical-documentation/note-drafts/{id}/code-suggestions"
    description: "List code suggestions of a draft"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "code_type?"]
    output: CodeSuggestion[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/code-suggestions/{id}/confirm"
    description: "Clinician confirmation of a suggestion (required before it enters the record)"
    roles: [Physician]
    code: 200
    input: []
    output: CodeSuggestion
    side_effects: ["confirmed_by := caller", "billing variants recomputed"]
  - method: POST
    path: "/ambient-clinical-documentation/code-suggestions/{id}/reject"
    description: "Reject a suggestion"
    roles: [Physician]
    code: 200
    input: []
    output: CodeSuggestion
    side_effects: ["billing variants recomputed"]
  - method: POST
    path: "/ambient-clinical-documentation/code-suggestions/{id}/modify"
    description: "Modify a suggested code before confirming"
    roles: [Physician]
    code: 200
    input: [new_code_value, "new_quantity?"]
    output: CodeSuggestion
    side_effects: ["line_total_cents recomputed", "billing variants recomputed"]
  - method: POST
    path: "/ambient-clinical-documentation/note-drafts/{id}/qa-samples"
    description: "Manually queue a QA sample; creator is recorded for segregation of duties"
    roles: [ComplianceOfficer, QAAuditor]
    code: 201
    input: ["auditor_id?"]
    output: QASample
    side_effects: ["created_by_user_id := caller X-User-ID"]
  - method: GET
    path: "/ambient-clinical-documentation/note-drafts/{id}/qa-samples"
    description: "List QA samples of a draft"
    roles: [Physician, QAAuditor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: QASample[]
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/qa-samples/{id}/assign"
    description: "Assign a queued sample to a specialty-matched active auditor"
    roles: [QAAuditor, ComplianceOfficer]
    code: 200
    input: [auditor_id]
    output: QASample
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/qa-samples/{id}/score"
    description: "Assigned auditor scores the sample (base weights)"
    roles: [QAAuditor]
    code: 200
    input: [accuracy_score, completeness_score, timeliness_score]
    output: QASample
    side_effects: ["composite_score computed", "last_scorer_id := caller"]
  - method: POST
    path: "/ambient-clinical-documentation/qa-samples/{id}/appeal"
    description: "Author physician appeals a score (max 2 appeals)"
    roles: [Physician]
    code: 200
    input: ["reason?"]
    output: QASample
    side_effects: ["appeal_count += 1"]
  - method: POST
    path: "/ambient-clinical-documentation/qa-samples/{id}/rescore"
    description: "A different auditor rescores after appeal (appeal weights)"
    roles: [QAAuditor]
    code: 200
    input: [accuracy_score, completeness_score, timeliness_score]
    output: QASample
    side_effects: ["composite_score recomputed with appeal weights"]
  - method: POST
    path: "/ambient-clinical-documentation/qa-samples/{id}/close"
    description: "Close a scored or rescored sample"
    roles: [QAAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: QASample
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Startup default is 2026-09-01T00:00:00Z; the logical clock never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/ambient-clinical-documentation/_audio/simulate-transcription"
    description: "Test-driving endpoint: deterministically advance a CAPTURED audio capture to TRANSCRIBED (requires GRANTED consent)"
    roles: [PlatformAdmin]
    code: 200
    input: [audio_capture_id]
    output: "{ audio_capture_id: string, status: string }"
    side_effects: ["AudioCapture CAPTURED -> TRANSCRIBED"]
  - method: POST
    path: "/ambient-clinical-documentation/_maintenance/run-retention-sweep"
    description: "Test-driving endpoint: expire TRANSCRIBED captures past retention (no legal hold) and expire GRANTED consents on CANCELLED encounters"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_capture_ids: array, expired_consent_ids: array }"
    side_effects: ["TRANSCRIBED -> RETENTION_EXPIRED when eligible", "GRANTED consent on CANCELLED encounter -> EXPIRED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the endpoint, or entity-backed ownership check failed (wrong patient/physician/auditor)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not resolve (checked left-to-right)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown payload key, malformed value, or out-of-domain enum"
  - id: ERR_SPEAKER_ROLE_INVALID
    http: 400
    condition: "speaker_role / new_speaker_role not in PHYSICIAN|PATIENT|CAREGIVER|OTHER"
  - id: ERR_TEMPLATE_FIELD_MISMATCH
    http: 422
    condition: "field_updates reference a field_key absent from the draft's template field_specs"
  - id: ERR_CODE_VALUE_MALFORMED
    http: 422
    condition: "code_value fails ^[A-Z][0-9A-Z.]{2,15}$"
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "Audio capture start without a GRANTED AmbientConsent on the encounter"
  - id: ERR_CONSENT_NOT_ACTIVE
    http: 422
    condition: "Draft create/regenerate/attest or transcription while consent is absent, OPTED_OUT, REVOKED, or EXPIRED"
  - id: ERR_LEGAL_HOLD_ACTIVE
    http: 422
    condition: "Purge or retention expiry attempted on a capture under legal hold"
  - id: ERR_PHYSICIAN_NOT_ACTIVE
    http: 422
    condition: "Attestation by a SUSPENDED physician"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a from-state of the requested transition (generic state violation)"
  - id: ERR_ENCOUNTER_NOT_IN_PROGRESS
    http: 409
    condition: "Audio capture or segment append requires the encounter IN_PROGRESS"
  - id: ERR_NOTE_LOCKED
    http: 409
    condition: "PATCH on an ATTESTED or VOID note draft (amend first)"
  - id: ERR_CODE_SUGGESTION_LOCKED
    http: 409
    condition: "Confirm/reject/modify on a suggestion whose draft is ATTESTED or VOID"
  - id: ERR_QA_HOLD_ACTIVE
    http: 409
    condition: "Attestation while a QASample of the draft is ASSIGNED"
  - id: ERR_METRIC_PERIOD_CLOSED
    http: 409
    condition: "Recompute against a FINAL DocumentationMetric row"
  - id: ERR_SIGNAGE_NOT_POSTED
    http: 422
    condition: "Consent grant with signage_posted != true"
  - id: ERR_DUPLICATE_CONSENT
    http: 409
    condition: "Second GRANTED consent for the same encounter"
  - id: ERR_CAPTURE_ACTIVE_EXISTS
    http: 409
    condition: "Starting a capture while another capture of the encounter is RECORDING or PAUSED"
  - id: ERR_TEMPLATE_INACTIVE
    http: 422
    condition: "Draft creation from an inactive template"
  - id: ERR_NO_TRANSCRIBED_AUDIO
    http: 422
    condition: "Draft creation or regenerate without any TRANSCRIBED capture"
  - id: ERR_NOTE_INCOMPLETE
    http: 422
    condition: "Attestation with completeness_score < 80"
  - id: ERR_CODE_LIMIT_EXCEEDED
    http: 422
    condition: "Suggestion batch would push active suggestions beyond 8"
  - id: ERR_QA_MAX_APPEALS
    http: 422
    condition: "Appeal when appeal_count >= 2"
  - id: ERR_QA_SELF_REVIEW_FORBIDDEN
    http: 403
    condition: "Creator scoring own sample, or last scorer attempting the rescore"
  - id: ERR_AUDITOR_SPECIALTY_MISMATCH
    http: 422
    condition: "Assigned auditor's specialty_codes do not cover the draft template's specialty_code"
  - id: ERR_CAPTURE_GAP_VIOLATION
    http: 409
    condition: "New capture starts < 60 seconds after the previous capture's ended_at on the encounter"
  - id: ERR_SEGMENT_OVERLAP
    http: 409
    condition: "Speaker segment half-open interval collides with an existing segment of the capture"
  - id: ERR_BILLING_CAP_EXCEEDED
    http: 422
    condition: "Confirming a billing suggestion would push the confirmed total above 10000000 cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch on expected_note_draft_version or expected_encounter_version"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Patient
    description: "The patient; grants and opts out of ambient consent for their own encounters"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /ambient-clinical-documentation/consents/{id}/opt-out"
    shared_operations:
      - "POST /ambient-clinical-documentation/encounters/{id}/consents (with ComplianceOfficer; own patient_id only)"
      - "GET consent / encounter / audio-capture / note-draft listings for own data"
  - name: Physician
    description: "Attending physician; runs encounters, recording, note drafting/editing/attestation, code confirmation, QA appeals"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "encounter lifecycle (create/start/complete), audio capture lifecycle, segment management"
      - "note draft create/edit/submit/regenerate/attest/amend (author only)"
      - "code suggestion generation/confirmation/rejection/modification (author only)"
      - "POST /ambient-clinical-documentation/qa-samples/{id}/appeal (author only)"
    shared_operations:
      - "POST /ambient-clinical-documentation/encounters/{id}/cancel (with ComplianceOfficer)"
      - "POST /ambient-clinical-documentation/note-drafts/{id}/void (with ComplianceOfficer)"
      - "documentation-metrics read/recompute (with ComplianceOfficer, PlatformAdmin)"
  - name: QAAuditor
    description: "Quality assurance auditor; scores and rescores assigned samples; may queue manual samples but never score own creations"
    identity: "entity_backed:QAAuditor"
    exclusive_operations:
      - "POST /ambient-clinical-documentation/qa-samples/{id}/score"
      - "POST /ambient-clinical-documentation/qa-samples/{id}/rescore"
    shared_operations:
      - "POST /ambient-clinical-documentation/note-drafts/{id}/qa-samples (with ComplianceOfficer)"
      - "POST /ambient-clinical-documentation/qa-samples/{id}/assign and /close (with ComplianceOfficer)"
      - "read access to drafts, fields, segments, attestations for review"
  - name: ComplianceOfficer
    description: "Compliance operator; consent revocation, legal holds, purges, manual QA queueing; cannot author or score clinical content"
    identity: "opaque"
    exclusive_operations:
      - "POST /ambient-clinical-documentation/consents/{id}/revoke"
      - "POST /ambient-clinical-documentation/audio-captures/{id}/purge"
      - "POST /ambient-clinical-documentation/audio-captures/{id}/legal-hold"
    shared_operations:
      - "POST /ambient-clinical-documentation/encounters/{id}/consents (with Patient)"
      - "encounter cancel, draft void, QA queue/assign/close (with Physician / QAAuditor)"
  - name: PlatformAdmin
    description: "Platform operator; registries (patients, physicians, auditors, templates) and test-driving endpoints (clock, transcription simulation, retention sweep)"
    identity: "opaque"
    exclusive_operations:
      - "POST/PATCH patient, physician, qa-auditor, note-template registries"
      - "POST /ambient-clinical-documentation/_clock/set_current_utc"
      - "POST /ambient-clinical-documentation/_audio/simulate-transcription"
      - "POST /ambient-clinical-documentation/_maintenance/run-retention-sweep"
    shared_operations:
      - "read access across registries and listings"
