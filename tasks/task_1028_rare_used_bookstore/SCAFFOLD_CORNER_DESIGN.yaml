# =============================================================================
# Task 1028 — §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 claims)
# Taxonomy sections/claim_types from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: patron_create_returns_201_with_envelope
        claim_type: Creation
        grounds: ["entities.Patron", "endpoints"]
        distinguishing_aspect: "POST /patrons with display_name+email returns 201, response_type=object, data.id present, status=ACTIVE, store_credit_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { display_name: "Nora", email: "nora.cr@x.com" }
              as: StoreClerk
              captures: { p_id: $.data.id }
          assert:
            - "response.response_type == object"
            - "Patron.${p_id}.status == ACTIVE"
            - "Patron.${p_id}.store_credit_cents == 0"
            - "Patron.${p_id}.consignor_payable_cents == 0"

      - name: patron_default_commission_defaults_030
        claim_type: Defaults
        grounds: ["entities.Patron.fields.default_commission_pct"]
        distinguishing_aspect: "Omitting default_commission_pct applies the default 0.30."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { display_name: "Molly", email: "molly.df@x.com" }
              as: StoreClerk
              captures: { p_id: $.data.id }
          assert:
            - "Patron.${p_id}.default_commission_pct == 0.30"

      - name: book_item_consignor_copied_from_lot
        claim_type: Computed Fields
        grounds: ["entities.BookItem.fields.consignor_id"]
        distinguishing_aspect: "BookItem.consignor_id is copied from its IntakeLot.consignor_id at creation, not taken from the request body."
        test_recipe:
          setup: ["A consignment lot for a known patron."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Leopold", email: "leo.cp@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "The Dead", author: "James Joyce", comp_median_cents: 3000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
          assert:
            - "BookItem.${b_id}.consignor_id == ${p_id}"
            - "BookItem.${b_id}.status == INTAKE"

      - name: sale_order_status_defaults_draft_system_field
        claim_type: System Fields
        grounds: ["entities.SaleOrder.fields.status"]
        distinguishing_aspect: "SaleOrder.status is system-set to DRAFT at creation; a status supplied in the body is ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sale-orders"
              payload: { channel: "ONLINE", line_items: [] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          assert:
            - "SaleOrder.${so_id}.status == DRAFT"

      - name: get_book_item_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_BOOK_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "GET /book-items/{unknown} returns ERR_BOOK_ITEM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /book-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BOOK_ITEM_NOT_FOUND"
            - "http_status == 404"

      - name: patron_create_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /patrons without the required email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { display_name: "NoEmail" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: intake_book_items_pagination_shape
        claim_type: Listing
        grounds: ["endpoints", "response_envelope"]
        distinguishing_aspect: "GET /book-items returns response_type=array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["One lot with one book item."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Araby", author: "James Joyce", comp_median_cents: 2000 }
              as: StoreClerk
          trigger:
            - call: "GET /book-items"
              payload: {}
              as: StoreClerk
          assert:
            - "response.response_type == array"
            - "response.meta or pagination includes total_count and has_more"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: grade_twice_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.BookItem.INTAKE_to_GRADED", "errors[ERR_ITEM_NOT_GRADED]"]
        distinguishing_aspect: "Grading an already-GRADED item (status != INTAKE) is rejected with 409; no re-grade permitted."
        test_recipe:
          setup: ["A GRADED book item."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Eveline", author: "James Joyce", comp_median_cents: 2500 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
          trigger:
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "FINE" }
              as: Appraiser
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ITEM_NOT_GRADED"
            - "http_status == 409"

      - name: settle_rejected_lot_returns_409_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.IntakeLot.DRAFT_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED lot is terminal; POST /settle on it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A REJECTED IntakeLot."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/reject"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /intake-lots/${lot_id}/settle"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: void_pending_offer_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.BuybackOffer.ACCEPTED_to_VOIDED", "errors[ERR_OFFER_NOT_VOIDABLE]"]
        distinguishing_aspect: "Voiding a PENDING (never accepted) offer is rejected with ERR_OFFER_NOT_VOIDABLE (409)."
        test_recipe:
          setup: ["A PENDING buyback offer above the auto-approve limit."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Gerty", email: "gerty.vo@x.com" }
              as: StoreClerk
              captures: { p_id: $.data.id }
            - call: "POST /buyback-offers"
              payload: { patron_id: "${p_id}", offer_value_cents: 9000 }
              as: StoreClerk
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /buyback-offers/${offer_id}/void"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OFFER_NOT_VOIDABLE"
            - "http_status == 409"

      - name: refund_non_confirmed_order_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.SaleOrder.CONFIRMED_to_REFUNDED", "errors[ERR_ORDER_NOT_CONFIRMED]"]
        distinguishing_aspect: "Refunding a DRAFT (never confirmed) order returns ERR_ORDER_NOT_CONFIRMED (409)."
        test_recipe:
          setup: ["A DRAFT SaleOrder."]
          setup_api_calls:
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/refund"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_CONFIRMED"
            - "http_status == 409"

  # ------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: first_edition_true_when_printing_1_and_stated
        claim_type: Correct Result
        grounds: ["calculations.first_edition_determination", "entities.BookItem.fields.is_first_edition"]
        distinguishing_aspect: "printing_number 1 + stated_first_edition true -> is_first_edition true at grade time."
        test_recipe:
          setup: ["An INTAKE book stated first edition, printing 1."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Ulysses 1922", author: "James Joyce", comp_median_cents: 50000, printing_number: 1, stated_first_edition: true }
              as: StoreClerk
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "FINE" }
              as: Appraiser
          assert:
            - "BookItem.${b_id}.is_first_edition == true"
            - "BookItem.${b_id}.condition_grade == FINE"

      - name: first_edition_false_when_printing_2
        claim_type: Correct Result
        grounds: ["calculations.first_edition_determination"]
        distinguishing_aspect: "Boundary: printing_number 2 with stated_first_edition true -> is_first_edition false (FIRST_EDITION_MAX_PRINTING=1)."
        test_recipe:
          setup: ["An INTAKE book stated first edition but printing 2."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Ulysses 2pr", author: "James Joyce", comp_median_cents: 50000, printing_number: 2, stated_first_edition: true }
              as: StoreClerk
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "FINE" }
              as: Appraiser
          assert:
            - "BookItem.${b_id}.is_first_edition == false"

      - name: shipping_cost_floor_applies_at_min_weight
        claim_type: Correct Result
        grounds: ["calculations.shipping_cost"]
        distinguishing_aspect: "Boundary: weight 500g (== FREE_WEIGHT_GRAMS) zone 1 uninsured -> steps 0, carriage clamps to floor 500 -> shipping_cost_cents 500."
        test_recipe:
          setup: ["A SaleOrder to attach a shipment."]
          setup_api_calls:
            - call: "POST /sale-orders"
              payload: { channel: "ONLINE", line_items: [] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/shipment"
              payload: { packing_station_label: "SF", weight_grams: 500, zone: 1, insured: false, pack_start: "2026-07-01T08:00:00.000Z", pack_end: "2026-07-01T08:30:00.000Z" }
              as: StoreClerk
              captures: { sh_id: $.data.id }
          assert:
            - "Shipment.${sh_id}.shipping_cost_cents == 500"

      - name: buyback_just_over_limit_stays_pending
        claim_type: Correct Result
        grounds: ["calculations.buyback_auto_approval"]
        distinguishing_aspect: "Boundary: offer_value_cents 5001 (> AUTO_APPROVE_LIMIT_CENTS 5000) stays PENDING, auto_approved false."
        test_recipe:
          setup: ["A Patron."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Buck", email: "buck.bb@x.com" }
              as: StoreClerk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /buyback-offers"
              payload: { patron_id: "${p_id}", offer_value_cents: 5001 }
              as: StoreClerk
              captures: { offer_id: $.data.id }
          assert:
            - "BuybackOffer.${offer_id}.status == PENDING"
            - "BuybackOffer.${offer_id}.auto_approved == false"

  # -------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: confirm_insufficient_store_credit_returns_402
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_INSUFFICIENT_STORE_CREDIT]"]
        distinguishing_aspect: "Applying more store credit than the buyer holds returns ERR_INSUFFICIENT_STORE_CREDIT (402)."
        test_recipe:
          setup: ["A LISTED shelved (ON_SHELF) shop item and a buyer patron with 0 store credit; a DRAFT order applying 500 credit."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Buyer Zero", email: "bz.credit@x.com" }
              as: Manager
              captures: { buyer_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Counterparts", author: "James Joyce", comp_median_cents: 4000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 6000 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { shop_status: "ON_SHELF", expected_catalog_listing_version: "${cl_v}" }
              as: StoreClerk
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", buyer_patron_id: "${buyer_id}", store_credit_applied_cents: 500, line_items: [ { book_item_id: "${b_id}", sale_price_cents: 6000, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_STORE_CREDIT"
            - "http_status == 402"

      - name: fair_capacity_exceeded_across_tables_returns_409
        claim_type: Aggregate validation
        grounds: ["validations[priority=9]", "errors[ERR_FAIR_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Capacity check is aggregate across tables: capacity 3, a slot on T1 (count 2) then an overlapping slot on T2 (count 2) sums to 4 > 3 -> ERR_FAIR_CAPACITY_EXCEEDED (no booth-table overlap, so the temporal check passes)."
        test_recipe:
          setup: ["A FairEvent capacity 3 with a RESERVED slot on T1 count 2 over [10:00,12:00)."]
          setup_api_calls:
            - call: "POST /fair-events"
              payload: { name: "Cap Fair", table_capacity: 3 }
              as: Manager
              captures: { fair_id: $.data.id }
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-13T10:00:00.000Z", window_end: "2026-07-13T12:00:00.000Z", display_item_count: 2 }
              as: StoreClerk
          trigger:
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T2", window_start: "2026-07-13T10:30:00.000Z", window_end: "2026-07-13T11:30:00.000Z", display_item_count: 2 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FAIR_CAPACITY_EXCEEDED"
            - "http_status == 409"

      - name: booth_overlap_same_table_returns_409
        claim_type: Temporal validation
        grounds: ["validations[priority=8]", "errors[ERR_BOOTH_SLOT_CONFLICT]"]
        distinguishing_aspect: "Overlap on the same table with capacity to spare still fails: capacity 10, slot T1 [10:00,12:00) then overlapping T1 [11:00,13:00) -> ERR_BOOTH_SLOT_CONFLICT."
        test_recipe:
          setup: ["A FairEvent capacity 10 with a RESERVED slot on T1 over [10:00,12:00)."]
          setup_api_calls:
            - call: "POST /fair-events"
              payload: { name: "Overlap Fair", table_capacity: 10 }
              as: Manager
              captures: { fair_id: $.data.id }
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-14T10:00:00.000Z", window_end: "2026-07-14T12:00:00.000Z", display_item_count: 1 }
              as: StoreClerk
          trigger:
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-14T11:00:00.000Z", window_end: "2026-07-14T13:00:00.000Z", display_item_count: 1 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BOOTH_SLOT_CONFLICT"
            - "http_status == 409"

      - name: booth_window_end_before_start_returns_invalid_request
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "window_end <= window_start on a booth slot returns ERR_INVALID_WINDOW (400)."
        test_recipe:
          setup: ["A FairEvent."]
          setup_api_calls:
            - call: "POST /fair-events"
              payload: { name: "Bad Window Fair", table_capacity: 5 }
              as: Manager
              captures: { fair_id: $.data.id }
          trigger:
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-15T12:00:00.000Z", window_end: "2026-07-15T10:00:00.000Z" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_WINDOW"
            - "http_status == 400"

      - name: duplicate_email_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second Patron with an existing email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A Patron with a known email."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "First", email: "dup@x.com" }
              as: StoreClerk
          trigger:
            - call: "POST /patrons"
              payload: { display_name: "Second", email: "dup@x.com" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"
            - "http_status == 409"

      - name: duplicate_listing_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_LISTING]"]
        distinguishing_aspect: "Creating a second CatalogListing for an item that already has one returns ERR_DUPLICATE_LISTING (409)."
        test_recipe:
          setup: ["An APPRAISED item already carrying a CatalogListing."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Grace", author: "James Joyce", comp_median_cents: 3500 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 5000 }
              as: StoreClerk
          trigger:
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 5500 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_LISTING"
            - "http_status == 409"

  # -------------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: appraiser_cannot_confirm_sale_order
        claim_type: Authorization denial
        grounds: ["roles.Appraiser", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Confirm is Manager-exclusive; an Appraiser calling POST /sale-orders/{id}/confirm gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["A DRAFT SaleOrder."]
          setup_api_calls:
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Appraiser
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "http_status == 403"

      - name: storeclerk_cannot_settle_lot
        claim_type: Authorization denial
        grounds: ["roles.StoreClerk", "roles.Manager", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Lot settlement is Manager-exclusive; a StoreClerk calling POST /intake-lots/{id}/settle gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["A DRAFT IntakeLot."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /intake-lots/${lot_id}/settle"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "http_status == 403"

      - name: missing_role_header_returns_unauthenticated
        claim_type: Authentication
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no/invalid X-User-Role header returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { display_name: "Ghost", email: "ghost.h@x.com" }
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "http_status == 400"

  # --------------------------------------------------- Cross-cutting: OCC layer
  - section: cross_cutting_complexity_layers
    instances:
      - name: appraisal_create_stale_book_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appraisal-create-stale-book]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on BookItem.version: after one appraisal issues (version advances), a second create still carrying the pre-issue version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A GRADED book item; b_v captured before the first appraisal issues."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "A Painful Case", author: "James Joyce", comp_median_cents: 4200 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
          trigger:
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "RETAIL_REPLACEMENT", expected_book_item_version: "${b_v}" }
              as: Appraiser
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: amend_stale_agreement_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[amend-stale-agreement]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ConsignmentAgreement.version: after one amend (version advances), a second amend carrying the pre-amend version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A PROPOSED agreement; ag_v0 captured at creation."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Cyril", email: "cyril.oc@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Clay", author: "James Joyce", comp_median_cents: 3000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30 }
              as: Manager
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /consignment-agreements/${ag_id}/amend"
              payload: { commission_pct: 0.25, expected_consignment_agreement_version: "${ag_v0}" }
              as: Manager
          trigger:
            - call: "POST /consignment-agreements/${ag_id}/amend"
              payload: { commission_pct: 0.20, expected_consignment_agreement_version: "${ag_v0}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: listing_update_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[listing-update-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CatalogListing.version: after one PATCH (version advances), a second PATCH carrying the pre-patch version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An APPRAISED item with a DRAFT/DRAFT listing; cl_v0 captured at creation."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "The Boarding House", author: "James Joyce", comp_median_cents: 3300 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 4800 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v0: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { online_status: "LIVE", expected_catalog_listing_version: "${cl_v0}" }
              as: StoreClerk
          trigger:
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { list_price_cents: 5200, expected_catalog_listing_version: "${cl_v0}" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

  # ------------------------------------------------------------ Errors coverage
  - section: errors
    instances:
      - name: activate_agreement_item_not_appraised_returns_409
        claim_type: violation_to_error
        grounds: ["state_machines.ConsignmentAgreement.PROPOSED_to_ACTIVE", "errors[ERR_ITEM_NOT_APPRAISED]"]
        distinguishing_aspect: "Activating an agreement whose BookItem is only GRADED (not APPRAISED/LISTED) returns ERR_ITEM_NOT_APPRAISED (409)."
        test_recipe:
          setup: ["A PROPOSED agreement on a GRADED (not appraised) item."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Simon", email: "simon.er@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Ivy Day", author: "James Joyce", comp_median_cents: 2800 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30 }
              as: Manager
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /consignment-agreements/${ag_id}/activate"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ITEM_NOT_APPRAISED"
            - "http_status == 409"

      - name: settle_lot_items_not_appraised_returns_409
        claim_type: violation_to_error
        grounds: ["state_machines.IntakeLot.DRAFT_to_SETTLED", "errors[ERR_LOT_ITEMS_NOT_APPRAISED]"]
        distinguishing_aspect: "Settling a lot with an item still INTAKE/GRADED (not APPRAISED) returns ERR_LOT_ITEMS_NOT_APPRAISED (409)."
        test_recipe:
          setup: ["A DRAFT lot with one GRADED (not appraised) item."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "A Mother", author: "James Joyce", comp_median_cents: 2600 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
          trigger:
            - call: "POST /intake-lots/${lot_id}/settle"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_LOT_ITEMS_NOT_APPRAISED"
            - "http_status == 409"

      - name: settle_empty_lot_returns_409
        claim_type: violation_to_error
        grounds: ["state_machines.IntakeLot.DRAFT_to_SETTLED", "errors[ERR_EMPTY_LOT]"]
        distinguishing_aspect: "Settling a lot with no BookItems returns ERR_EMPTY_LOT (409)."
        test_recipe:
          setup: ["A DRAFT lot with zero items."]
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /intake-lots/${lot_id}/settle"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_LOT"
            - "http_status == 409"

      - name: credit_already_spent_void_returns_402
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_CREDIT_ALREADY_SPENT]"]
        distinguishing_aspect: "Voiding an accepted buyback after the credit was spent (balance < credit_amount_cents) returns ERR_CREDIT_ALREADY_SPENT (402)."
        test_recipe:
          setup: ["A patron who accepted a 3000 buyback then spent 3000 store credit on a confirmed order, leaving balance 0."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Bloom", email: "bloom.cs@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /buyback-offers"
              payload: { patron_id: "${p_id}", offer_value_cents: 3000 }
              as: StoreClerk
              captures: { offer_id: $.data.id }
            - call: "POST /buyback-offers/${offer_id}/accept"
              payload: {}
              as: Manager
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Wandering Rocks", author: "James Joyce", comp_median_cents: 5000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "FINE" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 10000 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { shop_status: "ON_SHELF", expected_catalog_listing_version: "${cl_v}" }
              as: StoreClerk
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", buyer_patron_id: "${p_id}", store_credit_applied_cents: 3000, line_items: [ { book_item_id: "${b_id}", sale_price_cents: 10000, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /buyback-offers/${offer_id}/void"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CREDIT_ALREADY_SPENT"
            - "http_status == 402"

  # ------------------------------------------------------ excluded_because stubs
  - section: state_machines
    instances:
      - name: sale_confirm_cascade_sets_book_sold_stub
        claim_type: Side Effect Execution
        grounds: ["state_machines.SaleOrder.DRAFT_to_CONFIRMED"]
        excluded_because:
          difficulty_instance: transitive_cascade / sale_confirm_depth3_book_listing_agreement_payable
          rationale: "The full confirm cascade (BookItem->CatalogListing->ConsignmentAgreement->payable) is asserted by that §1.8 instance."

      - name: intake_reject_voids_appraisal_stub
        claim_type: Side Effect Execution
        grounds: ["state_machines.IntakeLot.DRAFT_to_REJECTED"]
        excluded_because:
          difficulty_instance: transitive_cascade / intake_reject_depth2_book_withdrawn_appraisal_voided
          rationale: "Reject cascade to WITHDRAWN + Appraisal VOIDED is asserted by that §1.8 instance."

      - name: booth_adjacency_accepted_stub
        claim_type: Temporal validation
        grounds: ["validations[priority=8]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / booth_slot_half_open_adjacency_accepted
          rationale: "Half-open adjacency-accepted boundary is asserted by that §1.8 instance."
