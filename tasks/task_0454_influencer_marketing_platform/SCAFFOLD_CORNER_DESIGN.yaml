        distinguishing_aspect: "Brand B opening Brand A's campaign returns ERR_NOT_RESOURCE_OWNER (403); entity_backed ownership compares X-User-ID to campaign.brand_id."
        test_recipe:
          setup: ["Brand A owns a DRAFT campaign with one deliverable; Brand B is a different brand"]
