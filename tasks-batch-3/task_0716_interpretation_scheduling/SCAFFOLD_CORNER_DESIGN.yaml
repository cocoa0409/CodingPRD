      - name: client_no_show_charges_fee
        claim_type: Side Effect Execution
        grounds: ["state_machines.Session.CONNECTING_to_CLIENT_NO_SHOW", "calculations.no_show_fee", "entities.InterpretationRequest.fields.cancellation_fee_cents"]
        distinguishing_aspect: "Marking CLIENT no-show on a connecting med-phone session charges 50% of the 1950c minimum block = 975c into request.cancellation_fee_cents and sets billing_status BILLABLE."
        test_recipe:
