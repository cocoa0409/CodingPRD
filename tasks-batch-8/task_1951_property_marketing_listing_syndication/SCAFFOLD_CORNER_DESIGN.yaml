  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_and_pagination
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /agents]"]
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id present, response_type array, and limit/offset/total_count/has_more pagination fields."
        test_recipe:
          setup: ["Three agents created"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "A1", license_number: "LIC-1", email: "a1@x.com" }, as: MarketingDirector }
            - { call: "POST /agents", payload: { full_name: "A2", license_number: "LIC-2", email: "a2@x.com" }, as: MarketingDirector }
            - { call: "POST /agents", payload: { full_name: "A3", license_number: "LIC-3", email: "a3@x.com" }, as: MarketingDirector }
          trigger:
            - { call: "GET /agents", payload: { limit: 2, offset: 0 }, as: MarketingDirector }
          assert:
            - "response_type == 'array', data has 2 items, total_count == 3, has_more == true"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "offset 2 page has 1 item and has_more == false"

      - name: listings_filter_by_lifecycle_status
        claim_type: listing
        grounds: ["endpoints[GET /listings]"]
        distinguishing_aspect: "lifecycle_status filter returns only matching listings."
        test_recipe:
          setup: ["Two listings; second one driven to ACTIVE"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
