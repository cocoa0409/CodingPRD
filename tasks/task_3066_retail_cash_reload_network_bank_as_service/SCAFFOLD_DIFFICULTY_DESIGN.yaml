      - name: float_window_buffer_overlap_asymmetry
        grounds:
          - validations[priority=29]
          - state_machines.FloatWindow.REQUESTED_to_CONFIRMED
          - entities.FloatWindow.fields.buffer_minutes
          - errors[ERR_FLOAT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Buffer-inflated closed-interval semantics on the FloatWindow resource:
          occupancy runs from start minus buffer to end plus buffer, so two closed
          windows separated by exactly the buffer are rejected while the same pair
          separated by buffer plus one minute is accepted — distinct arithmetic from
          the half-open window rule above.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T12:00:00Z. Program, brand, retailer agreement (per-txn limit 15000), location QM-001."
