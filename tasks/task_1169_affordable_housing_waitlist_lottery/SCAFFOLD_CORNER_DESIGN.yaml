  # ===========================================================================
  # Section: rbac (Table 7 claims)
  # ===========================================================================
  - section: rbac
    instances:
      - name: unrecognized_role_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "An X-User-Role value that names no declared role ('Wizard') is an authentication failure (401), not an authorization failure."
        test_recipe:
          setup: ["empty database; request carries X-User-Role: Wizard"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Seed", address_line: "0 Seed St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
          trigger:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: Wizard
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED with http status 401 (priority 1, before role authorization)"

      - name: applicant_cannot_create_unit_returns_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.HousingDeveloper
          - roles.Applicant
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "POST /units is HousingDeveloper-exclusive; an Applicant caller is rejected with ERR_UNAUTHORIZED_ROLE (403)."
        test_recipe:
          setup: ["one property and one applicant exist"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Cal C", email: "c11@x.com" }
              as: Anonymous
              captures: { ap: "$.data.id" }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${p}", unit_number: "101", bedroom_count: "ONE_BR", ami_tier: "AMI_50" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_UNAUTHORIZED_ROLE (403); the unit is not created"

      - name: marketing_coordinator_cannot_open_campaign
        claim_type: action_role_mapping_denied
        grounds:
          - roles.MarketingCoordinator
          - roles.HousingDeveloper
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "On the shared transition endpoint the action-to-role mapping holds: ANNOUNCE is MarketingCoordinator-only while OPEN is HousingDeveloper-only; the crossed call is rejected and the straight call succeeds."
        test_recipe:
          setup: ["ANNOUNCED campaign; clock at 2026-06-10 (inside window)"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HousingDeveloper
          trigger:
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: MarketingCoordinator
              captures: { err1: "$.data.error_id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: HousingDeveloper
              captures: { err2: "$.data.error_id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
              captures: { st: "$.data.status" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
              captures: { st2: "$.data.status" }
          assert:
            - "OPEN by MarketingCoordinator -> ERR_UNAUTHORIZED_ROLE (${err1}); ANNOUNCE by HousingDeveloper -> ERR_UNAUTHORIZED_ROLE (${err2})"
            - "ANNOUNCE by MarketingCoordinator succeeds (${st} == ANNOUNCED); subsequent OPEN by HousingDeveloper succeeds (${st2} == OPEN)"

      - name: applicant_cannot_verify_own_claim
        claim_type: action_role_mapping_denied
        grounds:
          - roles.Applicant
          - roles.ApplicationClerk
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "VERIFY on the shared claim transition endpoint is ApplicationClerk-only — even the owning Applicant is rejected."
        test_recipe:
          setup: ["OPEN campaign; application with one PENDING LOCAL_RESIDENT claim"]
          setup_api_calls:
