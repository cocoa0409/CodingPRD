              payload: { policy_id: "${pol_id}", event_id: "${ev_id}", structural_damage_cents: 1000000, cosmetic_damage_cents: 0, contents_damage_cents: 0, loss_of_use_cents: 0, expected_event_version: "${ev_v2}" }
              as: ClaimAdjuster
              as_user_id: "adj-1"
              captures: { locked_fnol_err: $.data.error_id }
          assert:
            - "${cl_final} == 235000000 and ${ev_status} == \"CAPACITY_EXHAUSTED\" with ${ev_ced} == 45000000 and ${ev_unc} == 90000000"
            - "${no_pool_err} == \"ERR_NO_ASSESSABLE_INSURERS\" with HTTP 409 - a 0.0 market share is excluded from the pool even though the insurer is COMPLIANT and ACTIVE"
            - "${lv_status} == \"ASSESSMENT_LEVIED\" with ${lv_load} == 1800000 and ${lv_total} == 91800000 (90,000,000 x LOADING_RATE_SMALL 0.02)"
            - "the allocation list has total_count == 1: ${al_ins} == \"${ins_b}\", ${al_amt} == 91800000, ${al_abs} == true and ${al_snap} == 5.0 - the sole assessable insurer carries the whole assessment regardless of its 5% share, because denom is the assessable sum and not 100"
            - "${locked_err} == \"ERR_EVENT_ASSESSMENT_LOCKED\" with HTTP 409 - the reopen would move an aggregate the allocations already depend on"
            - "${locked_fnol_err} == \"ERR_EVENT_ASSESSMENT_LOCKED\" - the lock outranks the duplicate-claim rule on a new FNOL too"

      - name: reinsurance_tower_shape_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_LAYER_INDEX
          - errors.ERR_LAYER_ATTACHMENT_GAP
        distinguishing_aspect: "Layer indices are unique per treaty_year and each higher index must attach at or above the previous index's exhaustion point, so index 1 cannot be repeated inside 2026 while the same index 1 is free in 2025, and an index 2 attaching one cent below 150,000,000 is refused."
        test_recipe:
          setup:
            - "One 2026 layer at index 1 attaching at 100,000,000 with a 50,000,000 limit, so the tower is exhausted at 150,000,000"
          setup_api_calls:
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 1, attachment_point_cents: 100000000, limit_cents: 50000000, ceded_pct: 0.90 }
              as: ProgramAdmin
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 1, attachment_point_cents: 200000000, limit_cents: 50000000, ceded_pct: 0.50 }
              as: ProgramAdmin
              captures: { dup_err: $.data.error_id }
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 2, attachment_point_cents: 149999999, limit_cents: 100000000, ceded_pct: 0.80 }
              as: ProgramAdmin
              captures: { gap_err: $.data.error_id }
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2025, layer_index: 1, attachment_point_cents: 50000000, limit_cents: 25000000, ceded_pct: 0.60 }
              as: ProgramAdmin
              captures: { old_id: $.data.id, old_idx: $.data.layer_index }
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 2, attachment_point_cents: 150000000, limit_cents: 100000000, ceded_pct: 0.80 }
              as: ProgramAdmin
              captures: { l2: $.data.id, l2_attach: $.data.attachment_point_cents }
          assert:
            - "${dup_err} == \"ERR_DUPLICATE_LAYER_INDEX\" with HTTP 409 - uniqueness is scoped to the treaty_year"
            - "${gap_err} == \"ERR_LAYER_ATTACHMENT_GAP\" with HTTP 422 - one cent below the previous layer's 150,000,000 exhaustion point is a downward overlap"
            - "${old_idx} == 1 - the same index is free inside a different treaty_year"
            - "${l2_attach} == 150000000 - attaching exactly at the exhaustion point is accepted, and the 2026 tower now has two layers"

  - section: rbac
    instances:
      - name: policy_side_roles_each_perform_their_own_exclusive_operations
        claim_type: role_permitted_operations
        grounds:
          - roles.ProgramAdmin
          - roles.ParticipatingInsurer
          - roles.Policyholder
          - roles.ClaimAdjuster
        distinguishing_aspect: "Every exclusive operation on the coverage side of the program is accepted for its own role: ProgramAdmin enrols the insurer and declares the event, Policyholder alone declares a retrofit and answers the mandatory offer, ParticipatingInsurer alone binds, and ClaimAdjuster alone posts the provisional adjustment."
        test_recipe:
          setup:
            - "Empty database at the default 2026-08-01T00:00:00Z clock"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Role Walk Insurance", naic_code: "22030", market_share_pct: 3.0 }
