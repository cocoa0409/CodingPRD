        (412) as well, showing the guard applies to both registration kinds on the same endpoint.
  - name: stale_expected_activity_version_on_signup_create_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - §1.2.1 rule activity-signup-stale-activity (write_endpoint POST /activity-signups, occ_field expected_activity_version,
      error ERR_STALE_ACTIVITY_VERSION, 412)
    - §1.3 activity_seat_allocation (booked_count versus capacity)
