              as: TreasuryOfficer
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Win Athlete", portal_user_id: "ath-win", sport: "BASEBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
