              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/external-companies"
              payload: { name: "Northwind Industries", ticker: "NWI", is_public: true, is_competitor: false, gross_revenue_cents: 500000000000 }
              as: GovernanceStaff
              captures: { co1_id: $.data.id }
            - call: "POST /governance/external-companies"
              payload: { name: "Cascade Logistics", ticker: "CSL", is_public: true, is_competitor: false, gross_revenue_cents: 300000000000 }
              as: GovernanceStaff
              captures: { co2_id: $.data.id }
            - call: "POST /governance/external-directorships"
              payload: { external_company_id: "${co1_id}", start_on: "2023-01-01", director_id: "${dir_id}", seat_role: "DIRECTOR" }
              as: GovernanceStaff
              captures: { ed1_id: $.data.id }
            - call: "POST /governance/external-directorships"
              payload: { external_company_id: "${co2_id}", start_on: "2024-01-01", director_id: "${dir_id}", seat_role: "DIRECTOR" }
              as: GovernanceStaff
              captures: { ed2_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "BUSINESS_ORIENTATION_101", category: "BUSINESS_ORIENTATION", is_required: true, credit_hours: 0.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item1_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "BOARD_PORTAL_ACCESS", category: "DOCUMENT_ACCESS", is_required: true, credit_hours: 0.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item2_id: $.data.id }
          trigger:
            - call: "POST /governance/onboarding-items/${item1_id}/complete"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/onboarding-items/${item2_id}/complete"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/directors/${dir_id}/seat"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/external-directorships/${ed2_id}/end"
              payload: { end_on: "2026-08-01" }
              as: GovernanceStaff
          assert:
            - "Before any trigger call: Director.${dir_id}.service_status == \"ONBOARDING\", compliance_status == \"OVERBOARDED\", onboarding_status == \"NOT_STARTED\", onboarding_completion_pct == 0.00, external_public_board_count == 2"
            - "After completing item1: onboarding_status == \"IN_PROGRESS\", onboarding_completion_pct == 50.00, service_status == \"ONBOARDING\", compliance_status == \"OVERBOARDED\""
            - "After completing item2: onboarding_status == \"COMPLETE\", onboarding_completion_pct == 100.00, service_status == \"ONBOARDING\", compliance_status == \"OVERBOARDED\""
            - "After the seat call: service_status == \"SEATED\", onboarding_status == \"COMPLETE\", compliance_status == \"OVERBOARDED\""
            - "After ending ed2: compliance_status == \"COMPLIANT\", external_public_board_count == 1, service_status == \"SEATED\", onboarding_status == \"COMPLETE\""
            - "ExternalDirectorship.${ed1_id}.status == \"ACTIVE\" and ExternalDirectorship.${ed2_id}.status == \"ENDED\""

