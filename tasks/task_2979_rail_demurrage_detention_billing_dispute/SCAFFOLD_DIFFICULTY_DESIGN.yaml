              payload: { appeal_narrative: "The full detention was carrier-caused." }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "state 0, before the forward action: Invoice total_gross_cents 47550, total_credit_cents 0, total_net_cents 47550, status PARTIALLY_DISPUTED; charge DISPUTED with credit_applied_cents 0; Customer.credit_balance_cents 0"
            - "state 1, after the forward decide: dispute DECIDED with allowed_credit_cents 30908; charge ADJUSTED with credit_applied_cents 30908 and net_amount_cents 16642; Invoice total_credit_cents 30908 and total_net_cents 16642 and status ADJUSTED; Customer.credit_balance_cents 30908"
            - "state 2, after the compensating appeal: charge DISPUTED with credit_applied_cents back to 0 and net_amount_cents back to 47550; Invoice total_credit_cents back to 0, total_net_cents back to 47550 and status back to PARTIALLY_DISPUTED; Customer.credit_balance_cents back to 0"
            - "state 2 is byte-identical to state 0 on every money field of all three entities"
            - "the invariant total_net_cents + total_credit_cents == total_gross_cents == 47550 holds in state 0, state 1 and state 2"
            - "total_gross_cents was 47550 at all three checkpoints: no transition may touch it"
            - "the compensation is NOT a rollback: DemurrageDispute.${dsp_id} advanced to APPEALED with round_number 2, decision PENDING, allowance_pct null and allowed_credit_cents 0, and Invoice.version increased twice"
            - "DemurrageCharge.${chg_id}.gross_amount_cents was 47550 at all three checkpoints"
            - "Customer.${cust_id}.dispute_posture went UNDER_REVIEW -> CLEAR -> UNDER_REVIEW across the three states"

      - name: void_restores_average_agreement_day_ledger_identity
        grounds:
          - state_machines.PlacementCycle.RELEASED_to_VOIDED
          - calculations.average_agreement_credit
          - entities.AverageAgreement.fields.credit_days_earned
          - entities.AverageAgreement.fields.debit_days_incurred
          - entities.AverageAgreement.fields.net_days
        distinguishing_aspect: |
          A non-money invariant on a different entity: the day-ledger identity
          net_days == credit_days_earned - debit_days_incurred, plus the stronger
          claim that both sides are RECOMPUTED FROM SCRATCH rather than
          incremented. The forward action (releasing a long-held car) drives the
          ledger from (2, 0, 2) to (2, 3, -1); the compensating action
          (POST .../void on that same cycle) must return it to exactly (2, 0, 2)
          — which an increment-based implementation cannot do, because it has no
          record of how many days the voided charge had contributed.
        test_recipe:
