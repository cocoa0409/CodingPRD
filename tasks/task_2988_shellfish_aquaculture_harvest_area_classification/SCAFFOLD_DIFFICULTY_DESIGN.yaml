            - "RainfallEvent.${rain}.triggered_closure == true and RainfallEvent.${rain}.voided_authorization_count == 0"
            - "After the rainfall event GrowingArea.${area}.last_closure_started_at == 2026-07-15T00:00:00Z and closure_reopen_eligible_at == 2026-07-19T00:00:00Z and consecutive_clean_samples == 0"
            - "After the three clean samples GrowingArea.${area}.consecutive_clean_samples == 3 and accepted_sample_count == 8"
            - "After the three clean samples GrowingArea.${area}.geometric_mean_mpn == 2.8, p90_mpn == 5.2 and eligible_classification == APPROVED (no sample sweep: 2.8 <= 14.0)"
            - "After the reopen GrowingArea.${area}.harvest_status == OPEN, consecutive_clean_samples == 0 and closure_reopen_eligible_at == null"
            - "After the reopen GrowingArea.${area}.classification == CONDITIONALLY_APPROVED (unchanged across the whole close/open cycle)"
