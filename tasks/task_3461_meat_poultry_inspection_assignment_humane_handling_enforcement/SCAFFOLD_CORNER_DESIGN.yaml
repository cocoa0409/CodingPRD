  - section: errors
    instances:
      - name: invalid_enum_member_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "An out-of-enum species_classes member (\"DUCK\") is a 400 ERR_INVALID_REQUEST, not a 422 and not a silent coercion."
        test_recipe:
          setup: ["Clock default. Empty database otherwise."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /inspection/establishments"
              payload: { name: "Duck Plant", species_classes: ["DUCK"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

