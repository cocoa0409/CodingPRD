  - method: GET
    path: /energy-ops/benchmark-report
    purpose: "energy performance benchmarking across the stores of one peer group with outlier investigation"
    roles: [PlatformAdmin, EnergyManager, EnergyAnalyst]
    input: ["climate_zone", "store_format", "outliers_only?"]
    output: { climate_zone: string, store_format: string, peer_group_count: integer, peer_group_median_eui: number, outlier_count: integer, stores: array }
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    notes: |
      Computes calculations.store_eui_benchmark for every store of the requested
      peer group. Each element of `stores` carries store_id, code,
      eui_kbtu_per_sqft, benchmark_percentile, benchmark_outlier_flag,
      peer_median_eui and outlier_threshold_eui (the last two are per-store
      because the peer median excludes the subject store). peer_group_median_eui
      is the median over the whole group, reported for context only.

  # ------------------------------------------------------------ mutations -----
  - method: POST
    path: /energy-ops/stores
    purpose: "register a store in the energy management portfolio"
    roles: [PlatformAdmin]
    input: [code, climate_zone, store_format, floor_area_sqft, "blended_rate_usd_per_kwh?", "override_budget_kwh_month?", "lighting_on_time_local?", "lighting_off_time_local?", "daylight_harvest_enabled?", "occupancy_control_enabled?"]
    output: Store
    side_effects:
      - "persists the store with bms_status NOT_DEPLOYED, energy_posture NORMAL, version 1"
      - "applies the declared defaults for every omitted optional field"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: /energy-ops/setpoint-standards
    purpose: "draft a setpoint standard for a climate zone / store format / season scope"
    roles: [EnergyManager]
    input: [climate_zone, store_format, season, cooling_setpoint_f, heating_setpoint_f, deadband_f, lighting_lux_target, "supersedes_standard_id?"]
    output: SetpointStandard
    side_effects:
      - "persists the standard in DRAFT with revision 1"
      - "when supersedes_standard_id is supplied the predecessor is recorded but NOT yet superseded"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STANDARD_NOT_FOUND, ERR_DUPLICATE_STANDARD_SCOPE]

  - method: POST
    path: /energy-ops/setpoint-standards/{id}/publish
    purpose: "publish a drafted standard, superseding its predecessor and degrading the stores bound to it"
    roles: [EnergyManager]
    input: []
    output: SetpointStandard
    side_effects:
      - "DRAFT -> PUBLISHED with published_at_iso = clock and published_by_user_id = X-User-ID"
      - "cascade link 1: the predecessor named by supersedes_standard_id moves PUBLISHED -> SUPERSEDED"
      - "cascade link 2: every Store bound to that predecessor with bms_status ACTIVE moves to DEGRADED"
      - "cascade link 3: each affected Store recomputes energy_posture (NORMAL -> CONSTRAINED)"
      - "cascade link 4: each affected Store's PROPOSED retrofit projects get escalated_review = true"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STANDARD_NOT_FOUND, ERR_STANDARD_STATE_INVALID, ERR_STANDARD_NOT_PUBLISHED]

  - method: POST
    path: /energy-ops/stores/{id}/bms-commissioning
    purpose: "bind a published setpoint standard to a store and start commissioning"
    roles: [EnergyManager]
    input: [standard_id, expected_store_version]
    output: Store
    side_effects:
      - "bms_status NOT_DEPLOYED|ACTIVE|DEGRADED -> COMMISSIONING"
      - "sets active_standard_id = standard_id"
      - "increments Store.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STORE_NOT_FOUND, ERR_STANDARD_NOT_FOUND, ERR_BMS_STATE_INVALID, ERR_STALE_STORE_VERSION, ERR_FOOD_SAFETY_HOLD, ERR_STANDARD_NOT_PUBLISHED, ERR_STANDARD_SCOPE_MISMATCH]

  - method: POST
    path: /energy-ops/stores/{id}/bms-activation
    purpose: "activate a commissioned building management system"
    roles: [EnergyManager]
    input: []
    output: Store
    side_effects:
      - "bms_status COMMISSIONING -> ACTIVE"
      - "recomputes energy_posture"
      - "increments Store.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STORE_NOT_FOUND, ERR_BMS_STATE_INVALID, ERR_STANDARD_NOT_PUBLISHED]

  - method: POST
    path: /energy-ops/stores/{id}/utility-accounts
    purpose: "attach a utility account with its live and candidate rate schedules"
    roles: [EnergyManager]
    input: [utility_name, rate_schedule_code, rate_family, demand_charge_per_kw, rate_on_peak, rate_off_peak, "ratchet_peak_kw?", "candidate_rate_schedule_code?", "candidate_rate_family?", "candidate_demand_charge_per_kw?", "candidate_rate_on_peak?", "candidate_rate_off_peak?"]
    output: UtilityAccount
    side_effects:
      - "persists the account with tariff_state STABLE, dr_enrollment_state ENROLLED, dr_optout_count 0, dr_incentive_accrued_usd 0.00, version 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STORE_NOT_FOUND]

  - method: POST
    path: /energy-ops/utility-accounts/{id}/demand-intervals
    purpose: "bulk-ingest metered demand intervals for peak monitoring and baselining"
    roles: [BmsGateway, EnergyAnalyst]
    input: [intervals]
    output: DemandInterval[]
    side_effects:
      - "persists one immutable DemandInterval per element of `intervals`, in the order supplied, each with created_at stamped from the clock"
      - "no recompute of any bill is triggered: recompute is explicit"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ACCOUNT_NOT_FOUND]
    notes: |
      `intervals` is a non-empty array of objects with keys interval_start_iso,
      kw_demand, is_on_peak and optional is_dr_event_day. The batch is
      all-or-nothing: if any element fails schema validation the whole request is
      rejected with ERR_INVALID_REQUEST and nothing is persisted.

  - method: POST
    path: /energy-ops/utility-accounts/{id}/tariff-switch
    purpose: "schedule a rate-schedule switch to the account's candidate tariff"
    roles: [EnergyManager]
    input: [effective_from_iso, expected_utility_account_version]
    output: UtilityAccount
    side_effects:
      - "sets tariff_state = PENDING_SWITCH and tariff_switch_effective_from_iso = effective_from_iso"
      - "increments UtilityAccount.version by 1"
      - "a switch scheduled while tariff_state is already PENDING_SWITCH supersedes the pending one (same fields overwritten); tariff_locked_until_iso is untouched here"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ACCOUNT_NOT_FOUND, ERR_STALE_ACCOUNT_VERSION, ERR_TARIFF_LOCK_ACTIVE, ERR_TARIFF_SWITCH_NOT_JUSTIFIED]

  - method: POST
    path: /energy-ops/utility-accounts/{id}/utility-bills
    purpose: "record a utility bill as received from the utility"
    roles: [EnergyAnalyst]
    input: [period_start_iso, period_end_iso, on_peak_kwh, off_peak_kwh, billed_kwh, billed_peak_kw, billed_amount_usd]
    output: UtilityBill
    side_effects:
      - "persists the bill in RECEIVED with every recomputed_* field null"
      - "no calculation runs at creation: validation is an explicit action"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ACCOUNT_NOT_FOUND]

  - method: POST
    path: /energy-ops/utility-bills/{id}/recompute
    purpose: "validate a bill by recomputing it from the account's rate schedule and metered intervals"
    roles: [EnergyAnalyst]
    input: []
    output: UtilityBill
    side_effects:
      - "writes recomputed_energy_cost_usd, recomputed_demand_cost_usd, recomputed_rider_cost_usd, recomputed_surcharge_usd, recomputed_amount_usd, billable_demand_kw, peak_basis and variance_pct per calculations.bill_recompute_total"
      - "RECEIVED -> VALIDATED when abs(variance_pct) <= 2.00, else RECEIVED -> VARIANCE_FLAGGED"
      - "sets recomputed_by_user_id = X-User-ID, which is the segregation-of-duties basis for the later adjustment"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BILL_NOT_FOUND, ERR_BILL_STATE_INVALID, ERR_DEMAND_DATA_MISSING]

  - method: POST
    path: /energy-ops/utility-bills/{id}/dispute
    purpose: "open a dispute against a variance-flagged bill"
    roles: [EnergyAnalyst]
    input: [dispute_reason]
    output: UtilityBill
    side_effects:
      - "VARIANCE_FLAGGED -> DISPUTED and stores dispute_reason"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BILL_NOT_FOUND, ERR_BILL_STATE_INVALID]

  - method: POST
    path: /energy-ops/utility-bills/{id}/adjustment
    purpose: "authorize the adjusted amount settled with the utility"
    roles: [EnergyManager]
    input: [adjusted_amount_usd]
    output: UtilityBill
    side_effects:
      - "DISPUTED -> ADJUSTED, stores adjusted_amount_usd and adjusted_by_user_id = X-User-ID"
      - "the bill becomes eligible for calculations.store_eui_benchmark"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BILL_NOT_FOUND, ERR_SEGREGATION_OF_DUTIES, ERR_BILL_STATE_INVALID, ERR_TARIFF_SWITCH_IN_PROGRESS]

  - method: POST
    path: /energy-ops/utility-accounts/{id}/demand-response-events
    purpose: "enroll the account in a demand-response curtailment event"
    roles: [EnergyManager]
    input: [program_code, curtailment_start_iso, curtailment_end_iso, target_reduction_kw]
    output: DemandResponseEvent
    side_effects:
      - "persists the event with event_state SCHEDULED and settlement_state PENDING"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ACCOUNT_NOT_FOUND, ERR_DR_ENROLLMENT_SUSPENDED, ERR_DR_WINDOW_CONFLICT]

  - method: POST
    path: /energy-ops/demand-response-events/{id}/notify
    purpose: "accept the utility's event notification and freeze the baseline"
    roles: [EnergyManager]
    input: []
    output: DemandResponseEvent
    side_effects:
      - "SCHEDULED -> NOTIFIED, writes baseline_kw per calculations.dr_baseline_kw and notified_at_iso = clock"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DR_EVENT_NOT_FOUND, ERR_DR_EVENT_STATE_INVALID, ERR_DR_ENROLLMENT_SUSPENDED, ERR_BASELINE_DATA_INSUFFICIENT]

  - method: POST
    path: /energy-ops/demand-response-events/{id}/activate
    purpose: "start curtailment, putting the store into a CURTAILED posture"
    roles: [EnergyManager]
    input: []
    output: DemandResponseEvent
    side_effects:
      - "NOTIFIED -> ACTIVE"
      - "the owning store's energy_posture is recomputed to CURTAILED"
      - "the store's ACTIVE SCHEDULE_EXTEND lighting overrides are revoked with revoke_source SYSTEM_POSTURE, releasing their projected_kwh"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DR_EVENT_NOT_FOUND, ERR_DR_EVENT_STATE_INVALID, ERR_FOOD_SAFETY_HOLD, ERR_CURTAILMENT_NOT_ELAPSED]

  - method: POST
    path: /energy-ops/demand-response-events/{id}/settle
    purpose: "settle event performance and accrue the incentive or penalty"
    roles: [EnergyAnalyst]
    input: []
    output: DemandResponseEvent
    side_effects:
      - "settlement_state PENDING -> SETTLED, leaving event_state at COMPLETED"
      - "writes total_reduction_kwh, performance_pct, incentive_usd and penalty_usd per calculations.dr_event_settlement"
      - "credits UtilityAccount.dr_incentive_accrued_usd by exactly incentive_usd"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DR_EVENT_NOT_FOUND, ERR_SETTLEMENT_STATE_INVALID, ERR_CURTAILMENT_NOT_ELAPSED]

  - method: POST
    path: /energy-ops/demand-response-events/{id}/reverse-settlement
    purpose: "reverse a settled event after a utility recalculation"
    roles: [EnergyManager]
    input: [reversal_reason]
    output: DemandResponseEvent
    side_effects:
      - "settlement_state SETTLED -> REVERSED, leaving event_state at COMPLETED"
      - "debits UtilityAccount.dr_incentive_accrued_usd by exactly this event's incentive_usd"
      - "retains incentive_usd, penalty_usd and performance_pct as evidence"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DR_EVENT_NOT_FOUND, ERR_SETTLEMENT_STATE_INVALID]

  - method: POST
    path: /energy-ops/stores/{id}/refrigeration-cases
    purpose: "register a refrigerated case with its alarm thresholds"
    roles: [PlatformAdmin, EnergyManager]
    input: [case_code, case_type, product_class, alarm_high_f, alarm_low_f, product_value_usd]
    output: RefrigerationCase
    side_effects:
      - "persists the case in ARMED with consecutive_breach_count 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STORE_NOT_FOUND, ERR_BMS_NOT_COMMISSIONED]

  - method: POST
    path: /energy-ops/refrigeration-cases/{id}/readings
    purpose: "ingest a case temperature reading and drive breach, excursion and posture evaluation"
    roles: [BmsGateway]
    input: [temp_f, reading_iso]
    output: { case_id: string, monitoring_state: string, consecutive_breach_count: integer, last_reading_temp_f: number, last_reading_iso: string, excursion_id: string, excursion_state: string, exposure_minutes: integer, peak_temp_f: number, mandatory_disposition: string, store_energy_posture: string, dr_events_opted_out: integer, overrides_revoked: integer }
    side_effects:
      - "updates the case's last_reading_temp_f, last_reading_iso and consecutive_breach_count"
      - "cascade link 1: the GRACE_READINGS-th consecutive breach moves the case ARMED -> ALARM and opens a TempExcursion in OPEN"
      - "cascade link 2: a further breach can move the excursion to ESCALATED or DISPOSITION_REQUIRED per calculations.excursion_exposure"
      - "cascade link 3: the owning store recomputes energy_posture (CONSTRAINED on alarm, LOCKED on escalation)"
      - "cascade link 4: on LOCKED, NOTIFIED demand-response events of the store's account move to OPTED_OUT with opt_out_reason FOOD_SAFETY_POSTURE and ACTIVE SCHEDULE_EXTEND overrides are revoked"
      - "cascade link 5: each opt-out increments UtilityAccount.dr_optout_count and suspends dr_enrollment_state at DR_OPTOUT_SUSPEND_COUNT"
      - "excursion_id and the excursion_* fields are null when no non-CLOSED excursion exists after the reading"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CASE_NOT_FOUND, ERR_STORE_SCOPE_VIOLATION]

  - method: POST
    path: /energy-ops/refrigeration-cases/{id}/monitoring-state
    purpose: "bypass a case for service or rearm it afterwards"
    roles: [MaintenanceTech]
    input: [target_state]
    output: RefrigerationCase
    side_effects:
      - "ARMED -> BYPASSED or BYPASSED -> ARMED, resetting consecutive_breach_count to 0"
      - "a BYPASSED case is excluded from excursion evaluation but still stores readings"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CASE_NOT_FOUND, ERR_CASE_STATE_INVALID]

  - method: POST
    path: /energy-ops/excursions/{id}/acknowledge
    purpose: "store-side acknowledgement of an open excursion"
    roles: [StoreManager]
    input: []
    output: TempExcursion
    side_effects:
      - "OPEN -> ACKNOWLEDGED and sets acknowledged_by_user_id = X-User-ID"
      - "a subsequent breaching reading reverts ACKNOWLEDGED -> OPEN"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EXCURSION_NOT_FOUND, ERR_STORE_SCOPE_VIOLATION, ERR_EXCURSION_STATE_INVALID]

  - method: POST
    path: /energy-ops/excursions/{id}/document-disposition
    purpose: "record the food-safety disposition and corrective action"
    roles: [FoodSafetyOfficer]
    input: [disposition, corrective_action_note]
    output: TempExcursion
    side_effects:
      - "stores disposition, corrective_action_note, documented_by_user_id = X-User-ID and documented_at_iso = clock"
      - "does NOT change state: documentation and closure are separate steps"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EXCURSION_NOT_FOUND, ERR_EXCURSION_STATE_INVALID, ERR_DISPOSITION_MANDATE_VIOLATION]

  - method: POST
    path: /energy-ops/excursions/{id}/close
    purpose: "close a documented excursion and release the food-safety posture"
    roles: [FoodSafetyOfficer]
    input: []
    output: TempExcursion
    side_effects:
      - "any non-CLOSED state -> CLOSED with closed_at_iso = clock"
      - "cascade: the owning case rearms ALARM -> ARMED when no other non-CLOSED excursion remains, resetting consecutive_breach_count"
      - "cascade: the owning store recomputes energy_posture, releasing LOCKED"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EXCURSION_NOT_FOUND, ERR_EXCURSION_STATE_INVALID, ERR_FOOD_SAFETY_DOC_INCOMPLETE]

  - method: POST
    path: /energy-ops/stores/{id}/lighting-overrides
    purpose: "request a lighting schedule, daylight-harvest or occupancy override"
    roles: [StoreManager]
    input: [zone, override_type, start_iso, end_iso, zone_load_kw, requested_reason]
    output: LightingOverride
    side_effects:
      - "computes projected_kwh per calculations.lighting_override_projection and charges it against Store.override_kwh_used_month"
      - "persists the override in ACTIVE when start_iso <= clock < end_iso, otherwise in SCHEDULED"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STORE_NOT_FOUND, ERR_STORE_SCOPE_VIOLATION, ERR_FOOD_SAFETY_HOLD, ERR_BMS_NOT_COMMISSIONED, ERR_OVERRIDE_WINDOW_CONFLICT, ERR_OVERRIDE_BUDGET_EXCEEDED]

  - method: POST
    path: /energy-ops/lighting-overrides/{id}/revoke
    purpose: "revoke an override and release its energy budget"
    roles: [EnergyManager]
    input: []
    output: LightingOverride
    side_effects:
      - "SCHEDULED|ACTIVE -> REVOKED with revoke_source USER and revoked_by_user_id = X-User-ID"
      - "releases projected_kwh from Store.override_kwh_used_month"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OVERRIDE_NOT_FOUND, ERR_OVERRIDE_STATE_INVALID]

  - method: POST
    path: /energy-ops/stores/{id}/fault-diagnostics
    purpose: "record an automated fault detection and diagnostic result"
    roles: [BmsGateway, MaintenanceTech]
    input: [equipment_ref, equipment_class, fault_code, severity, occurrence_count, affected_load_kw]
    output: FaultDiagnostic
    side_effects:
      - "computes fault_score per calculations.fault_score and persists the fault in DETECTED with detected_at_iso = clock"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STORE_NOT_FOUND, ERR_BMS_NOT_COMMISSIONED]

  - method: POST
    path: /energy-ops/fault-diagnostics/{id}/triage
    purpose: "triage a fault into a maintenance work order or suppress it"
    roles: [MaintenanceTech]
    input: [outcome]
    output: { fault_id: string, fault_state: string, fault_score: number, work_order_id: string, work_order_priority: string, work_order_state: string, store_bms_status: string, store_energy_posture: string, urgent_work_order_count: integer, escalated_retrofit_count: integer }
    side_effects:
      - "outcome WORK_ORDER: DETECTED -> TRIAGED and creates a MaintenanceWorkOrder in OPEN with priority URGENT when fault_score >= 70.0 else ROUTINE"
      - "cascade link 2: an URGENT work order increments Store.urgent_work_order_count and, for equipment_class REFRIGERATION, moves the store's bms_status ACTIVE -> DEGRADED"
      - "cascade link 3: the store recomputes energy_posture (NORMAL -> CONSTRAINED)"
      - "cascade link 4: every PROPOSED retrofit project of the store gets escalated_review = true"
      - "outcome SUPPRESS: DETECTED -> SUPPRESSED, no work order; work_order_* fields are null"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FAULT_NOT_FOUND, ERR_FAULT_STATE_INVALID, ERR_FAULT_SUPPRESSION_FORBIDDEN]
    notes: "outcome is one of WORK_ORDER | SUPPRESS"

  - method: POST
    path: /energy-ops/work-orders/{id}/schedule
    purpose: "schedule or reschedule a maintenance work order window"
    roles: [MaintenanceTech]
    input: [scheduled_start_iso, scheduled_end_iso]
    output: MaintenanceWorkOrder
    side_effects:
      - "OPEN -> SCHEDULED, or SCHEDULED -> SCHEDULED when rescheduling"
      - "stores scheduled_start_iso and scheduled_end_iso"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_WORK_ORDER_NOT_FOUND, ERR_WORK_ORDER_STATE_INVALID, ERR_WORK_ORDER_WINDOW_CONFLICT, ERR_WORK_ORDER_CAPACITY_EXCEEDED]

  - method: POST
    path: /energy-ops/work-orders/{id}/complete
    purpose: "complete a work order, resolving its fault and releasing the store posture"
    roles: [MaintenanceTech]
    input: [completion_note]
    output: MaintenanceWorkOrder
    side_effects:
      - "OPEN|SCHEDULED -> COMPLETED with completed_at_iso = clock"
      - "cascade link 1: the owning fault moves TRIAGED -> RESOLVED"
      - "cascade link 2: Store.urgent_work_order_count decrements for an URGENT work order"
      - "cascade link 3: the store recomputes energy_posture; bms_status stays DEGRADED until an explicit recommission"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_WORK_ORDER_NOT_FOUND, ERR_WORK_ORDER_STATE_INVALID]

  - method: POST
    path: /energy-ops/stores/{id}/retrofit-projects
    purpose: "propose a capital retrofit measure and score it on simple payback"
    roles: [EnergyAnalyst, EnergyManager]
    input: [measure_type, capex_usd, projected_annual_savings_kwh]
    output: RetrofitProject
    side_effects:
      - "computes annual_savings_usd, payback_years and priority_score under the simple_payback variant"
      - "persists the project in PROPOSED with priority_basis SIMPLE_PAYBACK, escalated_review false and proposed_by_user_id = X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STORE_NOT_FOUND]

  - method: POST
    path: /energy-ops/retrofit-projects/{id}/approve
    purpose: "approve or reject a proposed retrofit, re-scoring it on the risk-adjusted variant"
    roles: [EnergyManager]
    input: [decision]
    output: RetrofitProject
    side_effects:
      - "decision APPROVE: PROPOSED -> APPROVED, priority_basis -> RISK_ADJUSTED, annual_savings_usd / payback_years / priority_score rewritten under the risk_adjusted variant"
      - "decision REJECT: PROPOSED -> REJECTED with priority_basis left at SIMPLE_PAYBACK"
      - "sets approved_by_user_id = X-User-ID in both cases"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RETROFIT_NOT_FOUND, ERR_SEGREGATION_OF_DUTIES, ERR_RETROFIT_STATE_INVALID, ERR_BMS_NOT_COMMISSIONED]
    notes: "decision is one of APPROVE | REJECT"

  - method: POST
    path: /energy-ops/retrofit-projects/{id}/submit-measurement
    purpose: "submit measurement-and-verification data and verify the realized savings"
    roles: [EnergyAnalyst]
    input: [install_completed_iso, baseline_period_kwh, post_period_kwh, mv_period_days]
    output: RetrofitProject
    side_effects:
      - "writes adjusted_baseline_kwh, measured_savings_kwh and realization_rate per calculations.measured_savings_verification"
      - "realization_rate >= 0.8000: -> VERIFIED and credits Store.verified_savings_kwh_ytd by exactly measured_savings_kwh"
      - "realization_rate < 0.8000: -> SHORTFALL_REVIEW with no ledger credit"
      - "recomputes Store.portfolio_realization_rate in both branches"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RETROFIT_NOT_FOUND, ERR_RETROFIT_STATE_INVALID, ERR_MV_PERIOD_TOO_SHORT]

  - method: POST
    path: /energy-ops/retrofit-projects/{id}/revoke-verification
    purpose: "revoke a verification after a measurement error, compensating the savings ledger"
    roles: [EnergyManager]
    input: [revocation_reason]
    output: RetrofitProject
    side_effects:
      - "VERIFIED -> SHORTFALL_REVIEW and stores revocation_reason"
      - "debits Store.verified_savings_kwh_ytd by exactly this project's measured_savings_kwh"
      - "recomputes Store.portfolio_realization_rate"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RETROFIT_NOT_FOUND, ERR_RETROFIT_STATE_INVALID]

  - method: POST
    path: /energy-ops/_clock/set_current_utc
    purpose: "set the logical clock and run the scheduled-action sweep"
    roles: [PlatformAdmin]
    input: [current_utc]
    output: { current_utc: string, dr_events_completed: integer, overrides_activated: integer, overrides_expired: integer, stores_posture_recomputed: integer }
    side_effects:
      - "sets the logical clock used by every timestamp, window and trailing-window comparison in this API"
      - "sweep step 1: every DemandResponseEvent with event_state ACTIVE and curtailment_end_iso <= the new clock moves to COMPLETED, leaving settlement_state PENDING"
      - "sweep step 2: every LightingOverride with state SCHEDULED whose start_iso <= new clock < end_iso moves to ACTIVE"
      - "sweep step 3: every LightingOverride with state SCHEDULED or ACTIVE whose end_iso <= the new clock moves to EXPIRED, keeping its projected_kwh charged"
      - "sweep step 4: every store touched by steps 1-3 recomputes energy_posture"
      - "the sweep is idempotent: setting the clock to the same value twice reports zeros on the second call"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    description: |
      Sets the logical clock. The default clock value at server start is
      2026-08-01T00:00:00Z; every calculation, window comparison and
      created_at/updated_at stamp reads this clock rather than wall time.

# =============================================================================
# 1.6 Error Catalog  (50 errors; every one is triggerable from §1.5)
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "authentication required"
    triggered_by: "missing or empty X-User-ID header on any endpoint"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "role not permitted for this operation"
    triggered_by: "the caller's role is not in the endpoint's roles list"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "request payload failed validation"
    triggered_by: "missing required field, unknown enum member, out-of-range or wrong-precision number, malformed datetime, end <= start, override window longer than 12 hours, heating setpoint at or above the cooling setpoint, empty intervals batch"
  - error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    message: "store not found"
    triggered_by: "unknown store id in the path"
  - error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    message: "setpoint standard not found"
    triggered_by: "unknown standard id in the path, in body standard_id or in body supersedes_standard_id"
  - error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    message: "utility account not found"
    triggered_by: "unknown utility account id in the path"
  - error_id: ERR_BILL_NOT_FOUND
    http_status: 404
    message: "utility bill not found"
    triggered_by: "unknown utility bill id in the path"
  - error_id: ERR_DR_EVENT_NOT_FOUND
    http_status: 404
    message: "demand response event not found"
    triggered_by: "unknown demand-response event id in the path"
  - error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    message: "refrigeration case not found"
    triggered_by: "unknown refrigeration case id in the path"
  - error_id: ERR_EXCURSION_NOT_FOUND
    http_status: 404
    message: "temperature excursion not found"
    triggered_by: "unknown excursion id in the path"
  - error_id: ERR_OVERRIDE_NOT_FOUND
    http_status: 404
    message: "lighting override not found"
    triggered_by: "unknown lighting override id in the path"
  - error_id: ERR_FAULT_NOT_FOUND
    http_status: 404
    message: "fault diagnostic not found"
    triggered_by: "unknown fault diagnostic id in the path"
  - error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    message: "maintenance work order not found"
    triggered_by: "unknown work order id in the path"
  - error_id: ERR_RETROFIT_NOT_FOUND
    http_status: 404
    message: "retrofit project not found"
    triggered_by: "unknown retrofit project id in the path"
  - error_id: ERR_STORE_SCOPE_VIOLATION
    http_status: 403
    message: "caller may only act on its own store"
    triggered_by: "a StoreManager or BmsGateway acting on a store other than the one named by its X-User-ID, directly or through a case or account"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "the same user may not perform both steps of this control"
    triggered_by: "the bill recomputer authorizing its adjustment, or the retrofit proposer approving or rejecting it"
  - error_id: ERR_BMS_STATE_INVALID
    http_status: 409
    message: "building management system is not in a state that permits this action"
    triggered_by: "activating a store that is not COMMISSIONING, or commissioning a store that is already COMMISSIONING"
  - error_id: ERR_STANDARD_STATE_INVALID
    http_status: 409
    message: "setpoint standard is not in a state that permits this action"
    triggered_by: "publishing a standard that is already PUBLISHED or SUPERSEDED"
  - error_id: ERR_BILL_STATE_INVALID
    http_status: 409
    message: "utility bill is not in a state that permits this action"
    triggered_by: "recomputing a bill that is not RECEIVED, disputing a bill that is not VARIANCE_FLAGGED, adjusting a bill that is not DISPUTED, or any action on a VALIDATED or ADJUSTED bill"
  - error_id: ERR_DR_EVENT_STATE_INVALID
    http_status: 409
    message: "demand response event is not in a state that permits this action"
    triggered_by: "notifying an event that is not SCHEDULED, activating an event that is not NOTIFIED, or any action on a COMPLETED or OPTED_OUT event"
  - error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    message: "settlement dimension is not in a state that permits this action"
    triggered_by: "settling an event whose event_state is not COMPLETED, settling an already SETTLED event, or reversing a settlement that is PENDING or already REVERSED"
  - error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    message: "refrigeration case is not in a state that permits this action"
    triggered_by: "bypassing a case in ALARM, rearming a case that is already ARMED, or requesting a target_state equal to the current monitoring_state"
  - error_id: ERR_EXCURSION_STATE_INVALID
    http_status: 409
    message: "excursion is not in a state that permits this action"
    triggered_by: "acknowledging an excursion that is not OPEN, or documenting or closing a CLOSED excursion"
  - error_id: ERR_OVERRIDE_STATE_INVALID
    http_status: 409
    message: "lighting override is not in a state that permits revocation"
    triggered_by: "revoking an EXPIRED or already REVOKED override"
  - error_id: ERR_FAULT_STATE_INVALID
    http_status: 409
    message: "fault diagnostic is not in a state that permits triage"
    triggered_by: "triaging a fault that is TRIAGED, SUPPRESSED or RESOLVED"
  - error_id: ERR_WORK_ORDER_STATE_INVALID
    http_status: 409
    message: "work order is not in a state that permits this action"
    triggered_by: "scheduling or completing a COMPLETED work order"
  - error_id: ERR_RETROFIT_STATE_INVALID
    http_status: 409
    message: "retrofit project is not in a state that permits this action"
    triggered_by: "approving a project that is not PROPOSED, submitting a measurement for a PROPOSED or REJECTED project, or revoking a verification on a project that is not VERIFIED"
  - error_id: ERR_STALE_STORE_VERSION
    http_status: 412
    message: "store has been modified since it was read"
    triggered_by: "expected_store_version does not equal the store's current version (concurrency_rules.store-commissioning-stale-version)"
  - error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    message: "utility account has been modified since it was read"
    triggered_by: "expected_utility_account_version does not equal the account's current version (concurrency_rules.tariff-switch-stale-account-version)"
  - error_id: ERR_FOOD_SAFETY_HOLD
    http_status: 409
    message: "store energy posture blocks this energy program action"
    triggered_by: "activating a demand-response event while the store is LOCKED or CURTAILED, or creating a lighting override or starting a commissioning while the store is LOCKED"
  - error_id: ERR_DISPOSITION_MANDATE_VIOLATION
    http_status: 422
    message: "product disposition must be DISCARD for this excursion"
    triggered_by: "documenting RETAIN on an excursion whose mandatory_disposition is DISCARD"
  - error_id: ERR_FOOD_SAFETY_DOC_INCOMPLETE
    http_status: 422
    message: "excursion cannot be closed before disposition and corrective action are documented"
    triggered_by: "closing an excursion whose disposition or corrective_action_note is null"
  - error_id: ERR_FAULT_SUPPRESSION_FORBIDDEN
    http_status: 422
    message: "fault score is too high to suppress"
    triggered_by: "triaging with outcome SUPPRESS on a fault whose fault_score is >= 50.0"
  - error_id: ERR_STANDARD_NOT_PUBLISHED
    http_status: 409
    message: "setpoint standard is not published"
    triggered_by: "commissioning against a DRAFT or SUPERSEDED standard, activating a store whose bound standard has become SUPERSEDED, or publishing a standard whose predecessor is not PUBLISHED"
  - error_id: ERR_STANDARD_SCOPE_MISMATCH
    http_status: 422
    message: "setpoint standard scope does not match the store"
    triggered_by: "commissioning with a standard whose climate_zone or store_format differs from the store's"
  - error_id: ERR_BMS_NOT_COMMISSIONED
    http_status: 409
    message: "store has no active building management system"
    triggered_by: "creating a refrigeration case, fault diagnostic or lighting override, or approving a retrofit, while the store's bms_status is NOT_DEPLOYED or COMMISSIONING"
  - error_id: ERR_DR_ENROLLMENT_SUSPENDED
    http_status: 409
    message: "utility account is suspended from the demand response program"
    triggered_by: "creating or notifying an event on an account whose dr_enrollment_state is SUSPENDED"
  - error_id: ERR_TARIFF_SWITCH_IN_PROGRESS
    http_status: 409
    message: "bill adjustment is blocked while a tariff switch is pending"
    triggered_by: "adjusting a bill on an account whose tariff_state is PENDING_SWITCH"
  - error_id: ERR_DUPLICATE_STANDARD_SCOPE
    http_status: 409
    message: "a standard already covers this climate zone, store format and season"
    triggered_by: "drafting a standard whose (climate_zone, store_format, season) triple already has a DRAFT or PUBLISHED standard, without naming that standard in supersedes_standard_id"
  - error_id: ERR_OVERRIDE_WINDOW_CONFLICT
    http_status: 409
    message: "lighting override window overlaps an existing override for this zone"
    triggered_by: "a SCHEDULED or ACTIVE override of the same store and zone whose half-open window intersects the requested one"
  - error_id: ERR_DR_WINDOW_CONFLICT
    http_status: 409
    message: "demand response window overlaps or is too close to another event"
    triggered_by: "a SCHEDULED, NOTIFIED or ACTIVE event of the same account whose closed window intersects the requested one, or whose curtailment_end_iso is less than 240 minutes before the requested curtailment_start_iso"
  - error_id: ERR_WORK_ORDER_WINDOW_CONFLICT
    http_status: 409
    message: "work order window overlaps another scheduled order on this equipment"
    triggered_by: "another SCHEDULED work order on the same equipment_ref whose closed window intersects the requested one"
  - error_id: ERR_BASELINE_DATA_INSUFFICIENT
    http_status: 422
    message: "no eligible interval available to compute the demand response baseline"
    triggered_by: "notify when every candidate interval is off-peak, on a DR event day, or at/after curtailment_start_iso"
  - error_id: ERR_DEMAND_DATA_MISSING
    http_status: 422
    message: "no metered demand interval in the billing period"
    triggered_by: "recompute when the eligible interval set under the account's rate_family is empty"
  - error_id: ERR_CURTAILMENT_NOT_ELAPSED
    http_status: 422
    message: "curtailment window has not been reached or has not elapsed"
    triggered_by: "activating before curtailment_start_iso or settling before curtailment_end_iso"
  - error_id: ERR_TARIFF_LOCK_ACTIVE
    http_status: 409
    message: "account is inside its tariff lock window"
    triggered_by: "a tariff switch while the clock is before tariff_locked_until_iso, or an effective_from_iso at or before the clock"
  - error_id: ERR_MV_PERIOD_TOO_SHORT
    http_status: 422
    message: "measurement period is too short to verify savings"
    triggered_by: "mv_period_days below 60, or install_completed_iso after the clock"
  - error_id: ERR_OVERRIDE_BUDGET_EXCEEDED
    http_status: 422
    message: "override would exceed the store's monthly energy allowance"
    triggered_by: "the month's charged projected_kwh plus this override exceeding override_budget_kwh_month"
  - error_id: ERR_WORK_ORDER_CAPACITY_EXCEEDED
    http_status: 422
    message: "too many work orders already scheduled in this window at this store"
    triggered_by: "2 or more other SCHEDULED work orders of the same store already overlapping the requested window"
  - error_id: ERR_TARIFF_SWITCH_NOT_JUSTIFIED
    http_status: 422
    message: "projected savings do not justify the tariff switch"
    triggered_by: "annual_delta_usd greater than -2500.00, or a missing candidate rate schedule, or no VALIDATED / ADJUSTED reference bill"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - role: PlatformAdmin
    kind: opaque
    description: "portfolio administrator; onboards stores and cases and owns the logical clock"
    exclusive_operations:
      - "POST /energy-ops/stores"
      - "POST /energy-ops/_clock/set_current_utc"
    shared_operations:
      - "POST /energy-ops/stores/{id}/refrigeration-cases (with EnergyManager)"
      - "every GET endpoint except tariff-comparison and benchmark-report, which it shares with EnergyManager and EnergyAnalyst"
  - role: EnergyManager
    kind: opaque
    description: "owns setpoint standards, BMS deployment, tariff strategy, demand-response participation and capital approvals"
    exclusive_operations:
      - "POST /energy-ops/setpoint-standards"
      - "POST /energy-ops/setpoint-standards/{id}/publish"
      - "POST /energy-ops/stores/{id}/bms-commissioning"
      - "POST /energy-ops/stores/{id}/bms-activation"
      - "POST /energy-ops/stores/{id}/utility-accounts"
      - "POST /energy-ops/utility-accounts/{id}/tariff-switch"
      - "POST /energy-ops/utility-bills/{id}/adjustment"
      - "POST /energy-ops/utility-accounts/{id}/demand-response-events"
      - "POST /energy-ops/demand-response-events/{id}/notify"
      - "POST /energy-ops/demand-response-events/{id}/activate"
      - "POST /energy-ops/demand-response-events/{id}/reverse-settlement"
      - "POST /energy-ops/lighting-overrides/{id}/revoke"
      - "POST /energy-ops/retrofit-projects/{id}/approve"
      - "POST /energy-ops/retrofit-projects/{id}/revoke-verification"
    shared_operations:
      - "POST /energy-ops/stores/{id}/refrigeration-cases (with PlatformAdmin)"
      - "POST /energy-ops/stores/{id}/retrofit-projects (with EnergyAnalyst)"
      - "all read endpoints"
  - role: EnergyAnalyst
    kind: opaque
    description: "validates bills, settles demand-response performance and verifies measured savings"
    exclusive_operations:
      - "POST /energy-ops/utility-accounts/{id}/utility-bills"
      - "POST /energy-ops/utility-bills/{id}/recompute"
      - "POST /energy-ops/utility-bills/{id}/dispute"
      - "POST /energy-ops/demand-response-events/{id}/settle"
      - "POST /energy-ops/retrofit-projects/{id}/submit-measurement"
    shared_operations:
      - "POST /energy-ops/utility-accounts/{id}/demand-intervals (with BmsGateway)"
      - "POST /energy-ops/stores/{id}/retrofit-projects (with EnergyManager)"
      - "all read endpoints"
  - role: StoreManager
    kind: entity_backed:Store
    description: "store-level operator; X-User-ID is the id of the store the caller manages"
    exclusive_operations:
      - "POST /energy-ops/stores/{id}/lighting-overrides"
      - "POST /energy-ops/excursions/{id}/acknowledge"
    shared_operations:
      - "read endpoints, restricted to its own store by validations priority 52"
  - role: FoodSafetyOfficer
    kind: opaque
    description: "owns food-safety documentation and excursion closure"
    exclusive_operations:
      - "POST /energy-ops/excursions/{id}/document-disposition"
      - "POST /energy-ops/excursions/{id}/close"
    shared_operations:
      - "read endpoints except tariff-comparison and benchmark-report"
  - role: MaintenanceTech
    kind: opaque
    description: "services refrigeration and HVAC equipment; triages faults and executes work orders"
    exclusive_operations:
      - "POST /energy-ops/refrigeration-cases/{id}/monitoring-state"
      - "POST /energy-ops/fault-diagnostics/{id}/triage"
      - "POST /energy-ops/work-orders/{id}/schedule"
      - "POST /energy-ops/work-orders/{id}/complete"
    shared_operations:
      - "POST /energy-ops/stores/{id}/fault-diagnostics (with BmsGateway)"
      - "read endpoints except tariff-comparison and benchmark-report"
  - role: BmsGateway
    kind: entity_backed:Store
    description: "the store's building management system gateway; X-User-ID is the id of the store it serves"
    exclusive_operations:
      - "POST /energy-ops/refrigeration-cases/{id}/readings"
    shared_operations:
      - "POST /energy-ops/utility-accounts/{id}/demand-intervals (with EnergyAnalyst)"
      - "POST /energy-ops/stores/{id}/fault-diagnostics (with MaintenanceTech)"
      - "GET /energy-ops/stores/{id}, GET /energy-ops/stores/{id}/refrigeration-cases, GET /energy-ops/stores/{id}/fault-diagnostics, GET /energy-ops/refrigeration-cases/{id}, GET /energy-ops/utility-accounts/{id}/demand-intervals, all restricted to its own store"
