  - rule_id: combinatorial_formula
    instances:
      - name: performance_bond_tiered_with_default_surcharge
        grounds: [calculations.performance_bond_amount, entities.HarvestContract.fields.required_bond_amount_cents, entities.Buyer.fields.prior_defaults]
        distinguishing_aspect: "Mode (a) combinatorial: bond = tiered percentage of awarded value (10%/7%/5% at 10M/50M breakpoints) multiplied by (1 + 0.25*prior_defaults) then clamped to [500000, 10000000] — three inputs with non-linear interaction; identical 8000000-cent awards produce 800000 for a clean buyer vs 1200000 for a buyer with 2 prior defaults."
        test_recipe:
          setup: ["Two LUMP_SUM sales each awarded at 8000000 cents: one to buyer with prior_defaults 0, one to buyer with prior_defaults 2; each sale on its own stand with certified cruise and APPROVED prescription"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/buyers", payload: { company_name: "Blue Mill", license_no: "B-100" }, as: PlatformAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /forestry/buyers", payload: { company_name: "Red Mill", license_no: "B-200", prior_defaults: 2 }, as: PlatformAdmin, captures: { b2_id: "$.data.id" } }
