          6882323.5 and 6036712.5 sum to exactly 12919036.0 before rounding. Rounding each
          line first (the pinned order) yields 6882324 + 6036713 = 12919037; summing the raw
          products and rounding once yields 12919036. The scaffold demands 12919037, so a
          sum-then-round implementation is caught by a one-cent gap that no other instance
          in this file can expose.
