  # =========================================================================
  - section: complexity_layers
    instances:

      - name: corner_stale_expected_student_version_is_returned_as_a_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-student]
          - errors[ERR_STALE_STUDENT_VERSION]
          - validations[priority 7 ERR_STALE_STUDENT_VERSION]
          - endpoints[POST /mep/service-plans]
          - endpoints[PATCH /mep/students/{student_id}]
        distinguishing_aspect: "The declared concurrency rule is exercised end to end on its own write_endpoint: a plan create carrying the pre-PATCH Student.version returns 412 ERR_STALE_STUDENT_VERSION and writes nothing, the identical call carrying the current version returns 201, and Student.version increments on the PATCH and again on the successful create - so the token is single-use."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "one ENROLLED Student, whose version is captured at version 1 and then advanced by an unrelated PATCH"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 9 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id, stu_v1: $.data.version }
            - call: "PATCH /mep/students/${stu_id}"
              payload: { school_days_interrupted: 10 }
              as: ServiceCoordinator
              captures: { stu_v2: $.data.version }
          trigger:
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUMMER_PROGRAM", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v1}" }
              as: ServiceCoordinator
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUMMER_PROGRAM", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v2}" }
              as: ServiceCoordinator
              captures: { plan_id: $.data.id, plan_alloc: $.data.allocated_hours }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v3: $.data.version }
          assert:
            - "${stu_v1} == 1 and ${stu_v2} == 2 - the PATCH incremented Student.version"
            - "first create: HTTP 412 with data.error_id == ERR_STALE_STUDENT_VERSION"
            - "first create wrote nothing: GET /mep/service-plans filtered by student_id ${stu_id} returns 0 rows, Student.${stu_id}.service_status is still UNSERVED and version is still ${stu_v2}"
            - "second create: HTTP 201 with ServicePlan.${plan_id}.status == DRAFT, priority_tier == NON_PFS and allocated_hours == 75.00"
            - "second create: Student.${stu_id}.service_status == PLAN_DRAFTED and ${stu_v3} == 3 - the successful write incremented the version again"
            - "replaying the second create with ${stu_v2} would now also be stale, so the accepted token was single-use"

      - name: corner_stale_expected_area_version_is_returned_as_a_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-area]
          - errors[ERR_STALE_AREA_VERSION]
          - validations[priority 7 ERR_STALE_AREA_VERSION]
          - endpoints[POST /mep/recruiter-assignments]
          - endpoints[PATCH /mep/areas/{area_id}]
        distinguishing_aspect: "The second declared concurrency rule guards a different parent with a different error code: an assignment create carrying the pre-PATCH AgriculturalArea.version returns 412 ERR_STALE_AREA_VERSION and leaves assigned_primary_slots_used at 0, while the same call carrying the current version returns 201 and itself bumps the area version again."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with recruiter_capacity 3, captured at version 1, then patched to recruiter_capacity 4"
            - "one ACTIVE Recruiter"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id, area_v1: $.data.version }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "PATCH /mep/areas/${area_id}"
              payload: { recruiter_capacity: 4 }
              as: StateProgramAdmin
              captures: { area_v2: $.data.version }
          trigger:
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v2}" }
              as: StateProgramAdmin
              captures: { asg_id: $.data.id, asg_status: $.data.status }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v3: $.data.version, slots_after: $.data.assigned_primary_slots_used }
          assert:
            - "${area_v1} == 1 and ${area_v2} == 2 - the PATCH incremented AgriculturalArea.version"
            - "first create: HTTP 412 with data.error_id == ERR_STALE_AREA_VERSION"
            - "first create wrote nothing: GET /mep/recruiter-assignments filtered by area_id ${area_id} returns 0 rows, AgriculturalArea.${area_id}.assigned_primary_slots_used == 0 and version is still ${area_v2}"
            - "second create: HTTP 201 with RecruiterAssignment.${asg_id}.status == PLANNED and coverage_role == PRIMARY"
            - "second create: ${area_v3} == 3, AgriculturalArea.${area_id}.assigned_primary_slots_used == 1, recruiter_capacity is still 4 and Recruiter.${rec_a_id}.active_assignment_count == 1"

      - name: corner_approval_chain_propagates_through_four_levels
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /mep/coes/{coe_id}/approve]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_coe_approval_walks_four_hops_to_reallocated_plan_hours
          rationale: "That instance verifies the four-hop chain end to end from one approve call, asserting the certificate, the new term, the student's eligibility and PFS fields, and the reallocated plan hours."

      - name: corner_both_pfs_variants_produce_their_declared_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.pfs_priority_score.variants
          - calculations.coe_eligibility_window.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / coe_window_provisional_move_anchored_vs_final_residency_anchored
          rationale: "That instance asserts both eligibility-window variants and the delta between them on one certificate, which is the layer's 'both variants plus the switch delta' claim."

      - name: corner_derived_ledger_fields_are_correct_after_create_and_after_removal
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.student_service_hours_ledger
          - entities.Student.fields.total_service_hours_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / student_hours_and_credits_ledger_returns_to_its_exact_pre_create_decimals_after_reversal
          rationale: "That instance asserts the derived hours and credits aggregates immediately after the source delivery is created and again after it is removed by reversal, with no residual drift."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: corner_approve_response_already_carries_every_cascaded_value
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /mep/coes/{coe_id}/approve]
          - calculations.coe_eligibility_window
          - entities.EligibilityTerm
          - entities.Student.fields.eligibility_expires_on
        distinguishing_aspect: "Consistency is immediate, not eventual: the approve call's own 200 response body already contains eligibility_start_on, eligibility_end_on and age_out_capped, and reads issued straight afterwards - with no sweep, no retry and no delay - already show the new EligibilityTerm, the student's ELIGIBLE status and the reallocated plan hours."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "one ENROLLED Student born 2010-03-20 with a VERIFIED 2026-06-15 move and a supporting INITIAL interview"
            - "one SUBMITTED certificate with residency_date 2026-07-01 and qc_hold_exempt true"
            - "one DRAFT SUMMER_PROGRAM ServicePlan created before the approval"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "PARENT", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Parent confirms apple harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
