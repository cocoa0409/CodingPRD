          assert:
            - "case COMPLETED (${c_status}); source Account.${a1}.status == CLOSED (${a1_status})"
            - "receiving rows mirror source exactly: AFTER_TAX 600000/500000/100, EMPLOYER_PRETAX 2000000/0/60, PRE_TAX 8000000/0/100, ROTH 1000000/800000/100 (from ${recv_rows})"
            - "source rows all zeroed (from ${src_rows})"
            - "INVARIANT: SUM(balance_cents) over both accounts before == after == 11600000; SUM(basis_cents) before == after == 1300000"
            - "no tax form exists for a non-taxable transfer: GET /v1/tax-forms?rollover_case_id=${c1} returns total_count == 0"

      - name: disbursement_cancel_restores_exactly
        grounds:
          - state_machines.Disbursement.PENDING_to_CANCELLED
          - calculations.source_allocation
        distinguishing_aspect: |
          Conserved quantity: per-account balance restoration under forward+compensating
          action (distinct from the sibling's cross-account aggregate). Assembling then
          cancelling a 1,000,000 partial disbursement returns every money source to its
          exact pre-issue value, and the disbursement snapshot satisfies the decomposition
          identity gross == withholding + net (1,000,000 == 175,926 + 824,074).
        test_recipe:
          setup:
            - "Plan A, clock 2026-05-01; P1 SEPARATED SINGLE; canonical A1"
            - "Partial INDIRECT case (1,000,000) approved by proc-1; disbursement PENDING assembled by proc-2"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", requested_amount_cents: 1000000, withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "ACH" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { disb: "$.data.id", g: "$.data.gross_cents", w: "$.data.withholding_cents", n: "$.data.net_cents" } }
          trigger:
            - { call: "POST /v1/disbursements/${disb}/cancel", payload: {}, as: RolloverProcessor, as_user_id: "proc-2", captures: { d_status: "$.data.status" } }
            - { call: "GET /v1/accounts/${a1}/source-balances", as: RolloverProcessor, captures: { rows: "$.data" } }
            - { call: "GET /v1/rollover-cases/${c1}", as: RolloverProcessor, captures: { c_status: "$.data.status" } }
          assert:
            - "snapshot identity: gross ${g} == 1000000 == withholding ${w} (175926) + net ${n} (824074)"
            - "Disbursement.${disb}.status == CANCELLED (${d_status})"
            - "INVARIANT: sources exactly restored — PRE_TAX 8000000/0, EMPLOYER_PRETAX 2000000/0 (vested_pct 60), ROTH 1000000/800000, AFTER_TAX 600000/500000 (from ${rows})"
            - "case remains ELIGIBLE (${c_status}) — a fresh disbursement may be assembled after compensation"
