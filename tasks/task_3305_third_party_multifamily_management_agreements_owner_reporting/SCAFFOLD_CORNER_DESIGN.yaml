  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_header_missing_beats_role_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with NO X-User-Role header at all (which would also fail the role check) returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), never ERR_FORBIDDEN_FOR_ROLE — priority 1 beats priority 2."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "NoHdr LP" }
              as: ""
              captures: { err_auth: $.data.error_id }
          assert:
            - "Request without X-User-Role returns error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400), not ERR_FORBIDDEN_FOR_ROLE"

      - name: existence_check_left_to_right_owner_before_property
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /mgmt/owners/{nonexistent-owner}/properties returns ERR_NOT_FOUND for the owner segment (path validated left-to-right) regardless of body validity."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mgmt/owners/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/properties"
              payload: { name: "Ghost", unit_count: 10 }
              as: PortfolioManager
              captures: { err_lr: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: sod_violation_when_submitter_approves_own_budget
        claim_type: conditional_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: "Segregation of duties: an approve call whose X-User-ID equals the submitter's user id is rejected with ERR_SOD_VIOLATION; a different OwnerRep user id approves cleanly. (SoD is keyed on the acting user id, not merely the role.)"
        test_recipe:
          setup:
            - "Owner OS; Agreement AGS ACTIVE; Property PS MANAGED (zero-balance onboarding, one resident); budget BS created and submitted by PropertyAccountant acting with X-User-ID 'acct-sod-1'"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "SoD Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { os_id: $.data.id }
            - call: "POST /mgmt/owners/${os_id}/properties"
              payload: { name: "SoD Property", unit_count: 20 }
              as: PortfolioManager
              captures: { ps_id: $.data.id }
            - call: "POST /mgmt/owners/${os_id}/agreements"
              payload: { property_id: "${ps_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { ags_id: $.data.id, ags_v: $.data.version }
            - call: "POST /mgmt/agreements/${ags_id}/activate"
              payload: { expected_agreement_version: "${ags_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${ps_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { obs_id: $.data.id }
            - call: "POST /mgmt/properties/${ps_id}/residents"
              payload: { unit_label: "S1", full_name: "Res S", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obs_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obs_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obs_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obs_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obs_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/budgets"
              payload: { property_id: "${ps_id}", fiscal_year: 2027, kind: ANNUAL, operating_revenue_cents: 3000000, operating_expense_cents: 2000000, capex_total_cents: 100000 }
              as: PropertyAccountant
              captures: { bs_id: $.data.id }
            - call: "POST /mgmt/budgets/${bs_id}/submit"
              payload: {}
              as: PropertyAccountant
          trigger:
            - call: "POST /mgmt/budgets/${bs_id}/approve"
              payload: {}
              as: OwnerRep
              as_user_id: "${os_id}"
              captures: { bs_status: $.data.status, bs_decider: $.data.decided_by }
          assert:
            - "Budget.${bs_id}.status == APPROVED and decided_by == the OwnerRep's X-User-ID (${os_id})"
            - "decided_by != the submitting PropertyAccountant's X-User-ID (SoD recorded, distinct actors)"

      - name: restate_blocked_once_report_delivered
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_BOOKS_LOCKED]
