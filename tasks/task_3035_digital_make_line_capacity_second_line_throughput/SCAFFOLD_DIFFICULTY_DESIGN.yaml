            - "Logical clock at 2026-09-01T09:30:00Z. Store S14. BOWL on chicken (par 5000, hold 60min)."
            - "Chicken batch 1300g cooked 09:00. One order consumes 120g, then clock crosses discard_at so the batch expires and suppression_state -> SUPPRESSED_ALL."
          setup_api_calls:
