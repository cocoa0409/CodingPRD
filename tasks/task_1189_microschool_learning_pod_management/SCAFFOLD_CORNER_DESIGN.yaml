  # =====================================================================
  # Section 5: Endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: response_envelope_object_shape
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "All success responses include meta.api_request_id, meta.api_request_timestamp, response_type, data."
        test_recipe:
          setup: ["FacilitySite exists."]
          setup_api_calls:
            - call: "POST /facility-sites"
              payload: { site_name: "RE", address_line1: "x", jurisdiction_code: "AZ", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 10, indoor_sqft: 500 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /facility-sites/${site_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response body contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'object' for single-resource GET"

      - name: error_envelope_shape
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "Error responses contain meta, response_type='error', data.error_id, data.message."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pods/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PodOperator
          assert:
            - "response_type == 'error'"
            - "data.error_id == 'ERR_NOT_FOUND'"
            - "data.message is a non-empty string"

      - name: occ_stale_version_on_seat_enroll
        claim_type: occ_stale_version_conflict
        grounds: ["concurrency_rules[seat-enroll-stale-pod]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second enroll call carrying expected_pod_version captured before a prior successful enroll returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Pod ACTIVE with capacity >= 2; two RESERVED seats; client captured pod version V0 before first enroll."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, two RESERVED seats
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PodOperator
              captures: { pod_v0: $.data.version }
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat1}/enroll"
              payload: { expected_pod_version: "${pod_v0}" }
              as: Family
              as_user_id: "${fam1_id}"
            - call: "POST /pods/${pod_id}/seats/${seat2}/enroll"
              payload: { expected_pod_version: "${pod_v0}" }
              as: Family
              as_user_id: "${fam2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First enroll succeeds; Pod.version advances to pod_v0+1"
            - "Second enroll with the stale pod_v0 returns HTTP 412 ERR_STALE_VERSION"

      - name: occ_stale_version_on_pod_dissolve
        claim_type: occ_stale_version_conflict
        grounds: ["concurrency_rules[pod-dissolve-stale-pod]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Dissolve call carrying an expected_pod_version captured before any subsequent mutation returns 412."
        test_recipe:
          setup: ["Pod ACTIVE; client captures pod version V0; another writer enrolls a seat (bumps version)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PodOperator
              captures: { pod_v0: $.data.version }
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/enroll"
              payload: { expected_pod_version: "${pod_v0}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "POST /pods/${pod_id}/dissolve"
              payload: { expected_pod_version: "${pod_v0}", dissolution_reason: "stale" }
              as: PodOperator
              captures: { err: $.data.error_id }
          assert:
            - "Dissolve returns HTTP 412 ERR_STALE_VERSION"

