          trigger:
            - { call: "POST /itad/recyclers", payload: { name: "RecRB", certification_standard: "R2", certification_expires_at: "2027-05-01T00:00:00Z", accepted_categories: ["OTHER"], daily_intake_capacity_kg: 1000 }, as: AccountManager, as_user_id: "${acct}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED and HTTP status 403"

      - name: destruction_technician_cannot_verify
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "POST /itad/sanitizations/{id}/verify is exclusive to ComplianceOfficer; a DestructionTechnician caller is rejected 403 before any state or segregation check."
