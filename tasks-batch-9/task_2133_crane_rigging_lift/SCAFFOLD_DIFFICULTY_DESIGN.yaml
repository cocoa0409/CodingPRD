  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: crane_reserved_hours_conserved_across_configure_then_cancel
        grounds:
          - calculations.crane_reserved_hours
          - entities.Crane.fields.reserved_hours_total
          - entities.Crane.fields.active_plan_count
          - state_machines.LiftPlan.SURVEYED_to_CONFIGURED
          - state_machines.LiftPlan.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity #1 is a TIME ledger: Crane.reserved_hours_total, pinned as
          SUM over LiftPlan where crane_id == Crane.id and plan_status IN {CONFIGURED,
          PENDING_ENGINEERING, APPROVED, RELEASED} of (window_end - window_start) in hours.
          Configure debits 10.0 hours and the compensating cancel must return the ledger to
          exactly 0.0 with active_plan_count 0 and status AVAILABLE — no drift, no residue.
        test_recipe:
          setup:
            - "A freshly registered 150-ton crane has reserved_hours_total 0.0, active_plan_count 0 and status AVAILABLE."
            - "A SURVEYED plan with one ACTIVE sling covers 2026-09-10T06:00:00Z to 2026-09-10T16:00:00Z, exactly 10.0 hours."
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 3500, proximity_to_energized_lines_ft: 120 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /cranes"
              payload: { model_code: "RT-150", class_tons: 150, gross_weight_lb: 90000, counterweight_lb: 40000, outrigger_pad_area_sqft: 30.0, max_line_pull_lb: 20000, rated_max_wind_mph: 30, annual_inspection_expires_on: "2027-06-30T00:00:00Z", mob_demob_cents: 250000, hourly_rate_cents: 45375 }
              as: Dispatcher
              captures: { crane_id: $.data.id, hours_at_create: $.data.reserved_hours_total, status_at_create: $.data.status }
            - call: "POST /load-chart-entries"
              payload: { crane_id: "${crane_id}", configuration: "MAIN_BOOM", boom_length_ft: 100, radius_ft: 35, gross_capacity_lb: 100000 }
              as: Dispatcher
            - call: "POST /personnel"
              payload: { full_name: "Ray Kolb", role_type: "OPERATOR", certification_number: "NCCCO-88421", certification_expires_on: "2027-03-31T00:00:00Z", endorsement_class_tons: 200 }
              as: Dispatcher
              captures: { op_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dina Ruiz", role_type: "RIGGER", certification_number: "NCCER-5510", certification_expires_on: "2027-04-30T00:00:00Z", rigger_level: "BASIC" }
              as: Dispatcher
              captures: { rig_id: $.data.id }
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-5001", gear_type: "SLING", rated_wll_lb: 30000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "acceptance" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_v: $.data.version }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-6500", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 3500, access_notes: "pier apron", mat_inventory_available: true }
              as: Dispatcher
              captures: { plan_v1: $.data.version }
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 4, sling_angle_deg: 60, expected_gear_version: "${gear_v}" }
              as: Dispatcher
              captures: { ga_id: $.data.id }
          trigger:
            - call: "POST /lift-plans/${plan_id}/configure"
              payload: { crane_id: "${crane_id}", operator_id: "${op_id}", rigger_id: "${rig_id}", configuration: "MAIN_BOOM", boom_length_ft: 100, radius_ft: 35, parts_of_line: 8, block_weight_lb: 2000, jib_weight_lb: 0, aux_head_weight_lb: 0, expected_lift_plan_version: "${plan_v1}" }
              as: Dispatcher
            - call: "GET /cranes/${crane_id}"
              payload: {}
              as: Dispatcher
              captures: { hours_mid: $.data.reserved_hours_total, count_mid: $.data.active_plan_count, status_mid: $.data.status }
            - call: "POST /lift-plans/${plan_id}/cancel"
              payload: { reason: "outage window slipped" }
              as: Dispatcher
            - call: "GET /cranes/${crane_id}"
              payload: {}
              as: Dispatcher
              captures: { hours_after: $.data.reserved_hours_total, count_after: $.data.active_plan_count, status_after: $.data.status }
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_committed_after: $.data.committed_assignment_count }
          assert:
            - "${hours_at_create} == 0.0 and ${status_at_create} == AVAILABLE"
            - "${hours_mid} == 10.0, ${count_mid} == 1, ${status_mid} == RESERVED"
            - "${hours_after} == 0.0   (exactly the pre-configure value, not 0.01 and not 10.0)"
            - "${count_after} == 0 and ${status_after} == AVAILABLE"
            - "${gear_committed_after} == 0 and GearAssignment.${ga_id}.status == RELEASED"
            - "LiftPlan.${plan_id}.plan_status == CANCELLED"

      - name: customer_open_receivable_conserved_across_issue_then_void
        grounds:
          - calculations.customer_open_receivable
          - entities.Customer.fields.open_receivable_cents
          - entities.Customer.fields.invoice_count
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity #2 is a MONEY ledger of a completely different type from the crane
          hour ledger: Customer.open_receivable_cents, pinned as SUM(Invoice.total_cents) over
          invoices with status IN {ISSUED, DISPUTED}. Issuing debits 1011734 cents and the
          compensating void must return it to exactly 0, while invoice_count stays at 1 because
          voided invoices are still counted.
        test_recipe:
          setup:
            - "The canonical STANDARD 150-ton job has run to CLOSED with 3.25 billable standby hours."
            - "A DRAFT HOURLY invoice for that job totals 1011734 cents; the customer's open_receivable_cents is still 0 and invoice_count is 1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators", billing_terms: "NET_30" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
