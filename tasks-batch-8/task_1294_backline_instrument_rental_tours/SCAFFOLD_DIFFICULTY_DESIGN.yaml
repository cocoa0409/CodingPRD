              as: LogisticsCoordinator
              captures: { ovr1: $.data.id }
            - call: "POST /backline/tours/${ovt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-16T00:00:00Z", load_in_ts: "2026-08-16T10:00:00Z" }
