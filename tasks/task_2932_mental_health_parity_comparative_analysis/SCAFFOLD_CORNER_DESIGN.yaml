          - state_machines.RegulatorRequest.INSUFFICIENT_RESPONSE_to_RESPONDED
          - entities.RegulatorRequest.fields.regulator_round
        distinguishing_aspect: "INSUFFICIENT adjudication returns the request to a respondable state and increments regulator_round to 1; the plan year stays UNDER_REGULATOR_REVIEW rather than closing."
        test_recipe:
