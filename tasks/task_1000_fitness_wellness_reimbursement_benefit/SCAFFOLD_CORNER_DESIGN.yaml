          trigger:
            - { call: "POST /api/claims/${c_id}/resubmit", payload: {}, as: Member, as_user_id: "${m_id}", captures: { c_state: $.data.review_status, c_cnt: $.data.resubmission_count } }
            - { call: "POST /api/claims/${c_id}/resubmit", payload: {}, as: Member, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "first resubmit succeeds: review_status == UNDER_REVIEW, resubmission_count == 1"
            - "second resubmit error_id == ERR_CLAIM_NOT_REVIEWABLE"

  - section: consistency_model
    instances:
      - name: write_read_immediate_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a created employer is fully visible in the very next GET within the same clock tick, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "READBACK", funding_model: "PAY_AS_YOU_GO" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
          trigger:
            - { call: "GET /api/employers/${emp_id}", payload: {}, as: Auditor, captures: { e_name: $.data.name, e_model: $.data.funding_model, e_v: $.data.version } }
          assert:
            - "name == READBACK; funding_model == PAY_AS_YOU_GO; version == 1"
