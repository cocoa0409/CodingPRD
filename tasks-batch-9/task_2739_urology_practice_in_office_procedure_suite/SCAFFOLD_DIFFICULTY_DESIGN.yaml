  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: ci_consignment_unit_conservation_cancel_vs_noshow
        grounds:
          - entities.ConsignmentLot.fields.quantity_available
          - entities.ConsignmentLot.fields.quantity_wasted
          - state_machines[ProcedureCase.schedule_status].transitions[cancel].side_effects
          - state_machines[ProcedureCase.schedule_status].transitions[no-show].side_effects
          - state_machines[ConsignmentLot.billing_status]
          - calculations.consignment_billing
        distinguishing_aspect: |
          The invariant is a UNIT LEDGER over one lot:
          quantity_received == quantity_available + quantity_reserved +
          quantity_consumed + quantity_wasted + quantity_returned, and it must hold
          after two different compensating paths that treat the same reserved unit
          oppositely. Cancel is a TRUE reversal (the unit returns to available and
          the lot goes back to a pristine CONSIGNED / 0-cents state), while no-show
          is a LOSSY compensation (the unit is destroyed into quantity_wasted, so
          available can never recover) — and the billing basis stays PROVISIONAL
          with 0 cents while billing_status nevertheless advances to
          PARTIALLY_INVOICED, because the PROVISIONAL variant sums only RESERVED
          lines. The other compensating instance conserves a visit ledger instead
          of units, and its reversal is partial rather than total.
        test_recipe:
          setup:
            - "one urologist, one scheduler, one procedure nurse"
            - "patient Dario Vess, egfr 60"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
            - "type PROSTATE_BIOPSY: base 30, cleanup LOW, consignment_required true, single_use_device_sku BX-NEEDLE-18G, no scope, no antibiotic, required_prep_codes []"
            - "one lot: 10 units at unit_price_cents 1999, lot_expires_on 2027-06-30"
            - "case A is cancelled from DRAFT, so it never takes a room block and the room version is untouched"
            - "case B is scheduled, then the clock is pushed 16 minutes past its start so the NO_SHOW_GRACE_MIN 15 gate opens"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Nina Park", npi: "1000000003", role_type: "RN" }
              as: PracticeAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4217", full_name: "Dario Vess", date_of_birth: "1961-01-09", primary_urologist_id: "${uro_id}", egfr: 60 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v1: $.data.version }
            - call: "POST /urology/procedure-types"
              payload: { code: "PROSTATE_BIOPSY", base_minutes: 30, cleanup_class: "LOW", allowed_room_type: "CYSTO_SUITE", requires_scope: false, requires_antibiotic: false, consignment_required: true, single_use_device_sku: "BX-NEEDLE-18G", required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/consignment-lots"
              payload: { supplier_name: "Meridian Devices", sku: "BX-NEEDLE-18G", device_class: "BIOPSY_NEEDLE", quantity_received: 10, unit_price_cents: 1999, lot_expires_on: "2027-06-30" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_a_id: $.data.id }
            - call: "POST /urology/procedure-cases/${case_a_id}/device-reservation"
              payload: { consignment_lot_id: "${lot_id}", quantity: 1, expected_lot_version: "${lot_v1}" }
              as: ProcedureNurse
              as_user_id: "${rn_id}"
          trigger:
            - call: "POST /urology/procedure-cases/${case_a_id}/cancel"
              payload: { cancel_reason_code: "PATIENT_REQUEST" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "GET /urology/consignment-lots/${lot_id}"
              payload: {}
              as: ProcedureNurse
              as_user_id: "${rn_id}"
              captures: { lot_v_after_cancel: $.data.version }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_b_id: $.data.id }
            - call: "POST /urology/procedure-cases/${case_b_id}/device-reservation"
              payload: { consignment_lot_id: "${lot_id}", quantity: 1, expected_lot_version: "${lot_v_after_cancel}" }
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "POST /urology/procedure-cases/${case_b_id}/schedule"
              payload: { expected_room_version: "${room_v1}" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:16:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases/${case_b_id}/no-show"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "GET /urology/consignment-lots/${lot_id}"
              payload: {}
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "GET /urology/procedure-cases/${case_b_id}"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
          assert:
            - "immediately after the setup reservation the lot reads quantity_available == 9, quantity_reserved == 1, billed_amount_cents == 2369 (round_half_up(1999 * 1.185) on one 1-unit line), billing_basis == \"PROVISIONAL\" and billing_status == \"CONSIGNED\""
            - "trigger call 1 returns schedule_status == \"CANCELLED\", cancel_reason_code == \"PATIENT_REQUEST\" and device_state == \"RELEASED\""
            - "trigger call 2 (total reversal): quantity_available == 10, quantity_reserved == 0, quantity_wasted == 0, quantity_consumed == 0, billed_amount_cents == 0 and billing_status == \"CONSIGNED\" — indistinguishable from the pristine lot except for version"
            - "trigger call 7 returns schedule_status == \"NO_SHOW\", cancel_reason_code == \"NO_SHOW_GRACE_ELAPSED\" and device_state == \"WASTED\""
            - "trigger call 8 (lossy compensation): quantity_available == 9, quantity_reserved == 0, quantity_wasted == 1, quantity_consumed == 0, quantity_returned == 0, billed_amount_cents == 0, billing_basis == \"PROVISIONAL\" and billing_status == \"PARTIALLY_INVOICED\""
            - "the ledger identity holds after both paths: 10 == 10 + 0 + 0 + 0 + 0 after the cancel and 10 == 9 + 0 + 0 + 1 + 0 after the no-show"
            - "trigger call 9 returns device_lot_id == the ${lot_id} value and device_quantity == 1 (the no-showed case keeps its audit trail even though the unit is gone)"
            - "an implementation that treats no-show as a cancel restores quantity_available to 10 and leaves billing_status CONSIGNED, failing trigger call 8"

      - name: ci_referral_visit_ledger_conservation
        grounds:
          - state_machines[PelvicHealthReferral.status]
          - entities.PelvicHealthReferral.fields.visits_authorized
          - entities.PelvicHealthReferral.fields.visits_forfeited
          - calculations.recall_due_date.constants.PROGRAM_VISIT_CAP
          - calculations.recall_due_date.constants.THERAPY_START_WINDOW_DAYS
          - endpoints[POST /urology/pelvic-health-referrals/{id}/visits]
        distinguishing_aspect: |
          The invariant is a VISIT ledger:
          visits_authorized == visits_used + visits_remaining + visits_forfeited,
          held across a PARTIAL compensation (VOID_LAST gives back exactly one
          visit and drags the status backwards from COMPLETED to ACCEPTED) followed
          by a TERMINAL one (WITHDRAW converts whatever remains into
          visits_forfeited rather than returning it). Unlike the consignment
          instance nothing is ever restored to a pristine state: the ledger
          rebalances between three buckets while the total stays 2, and
          first_visit_date must be re-derived rather than cleared.
        test_recipe:
          setup:
            - "one urologist with ultrasound_accreditation_expires_on 2027-03-31 (a URODYNAMICS_LAB case checks the provider gate at priority 43)"
            - "one scheduler, one procedure nurse, one pelvic health coordinator"
