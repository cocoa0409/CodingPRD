              captures: { region_v: $.data.version }
            - call: "POST /listing-agreements"
              payload: { client_id: "${client_id}", list_price_cents: 60000000, list_fee_rate_pct: 0.0125, service_tier: "FULL_SERVICE", expected_region_version: "${region_v}" }
              as: ListingAgent
              as_user_id: "${agent_lead}"
              captures: { agreement_id: $.data.id }
          trigger:
            - call: "POST /listing-agreements/${agreement_id}/publish"
              payload: {}
              as: AssociateAgent
              as_user_id: "${agent_assoc}"
