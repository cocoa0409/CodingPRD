              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19SD-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /inspection-records"
              payload: { unit_id: "${unit_id}", inspection_date: "2026-08-15", ansi_standard_ref: "ANSI A92.22", result: "PASS" }
              as: YardTechnician
              as_user_id: "yt-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /inspection-records/${rec_id}/certify"
