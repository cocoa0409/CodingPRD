          - state_machines.SaleOrder.UNPAID_to_PAID
          - entities.SaleOrder.late_fee_cents
        distinguishing_aspect: >
          The threshold is strictly temporal and the assessment is once-only: a sweep at exactly
          payment_due_at returns an empty list and leaves late_fee_cents 0, a sweep one second
          later assesses 44805 on pre_fee_total_cents 2987000 (never on total_due_cents), and a
