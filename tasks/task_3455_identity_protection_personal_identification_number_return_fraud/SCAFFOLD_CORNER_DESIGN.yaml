            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpB}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 100000, bank_product: "NONE", dependents: [{ dependent_tin: "900000013", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpB}" }
