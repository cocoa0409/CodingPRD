scaffold_corner_design:

  # ===================================================================
  - section: entities
    instances:
      - name: create_center_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Center, endpoints]
        distinguishing_aspect: "POST /centers with name + cacfp_tier returns 201 and applies late-pickup defaults (grace 5, fee 1500, block 15) when omitted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id, grace: $.data.late_pickup_grace_minutes }
          assert:
            - "Center.${c_id}.late_pickup_grace_minutes == 5"
            - "Center.${c_id}.late_pickup_fee_per_block_cents == 1500"
            - "Center.${c_id}.late_pickup_block_minutes == 15"
            - "Center.${c_id}.version == 1"

      - name: get_center_not_found
        claim_type: Not Found
        grounds: [entities.Center, endpoints]
        distinguishing_aspect: "GET /centers/{non-existent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /centers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CenterDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_classroom_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Classroom
          - validations[priority=19]
        distinguishing_aspect: "POST /centers/{id}/classrooms missing licensed_capacity returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one center"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_classroom_invalid_enum_age_band_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Classroom.fields.age_band
          - validations[priority=19]
        distinguishing_aspect: "POST classroom with age_band not in {INFANT,TODDLER,PRESCHOOL} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one center"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "SCHOOLAGE", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: child_sibling_group_defaults_to_self
        claim_type: Defaults
        grounds: [entities.Child.fields.sibling_group_id, endpoints]
        distinguishing_aspect: "POST /children with sibling_group_id omitted self-anchors: returned sibling_group_id equals the child's own id and enrolls_in_cacfp defaults true."
        test_recipe:
          setup: ["a family"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id, sg: $.data.sibling_group_id, cacfp: $.data.enrolls_in_cacfp }
          assert:
            - "Child.${kid_id}.sibling_group_id == ${kid_id}"
            - "Child.${kid_id}.enrolls_in_cacfp == true"

      - name: classroom_status_field_system_generated
        claim_type: System Fields
        grounds: [entities.Classroom.fields.status, entities.Classroom.fields.active_enrollment_count]
        distinguishing_aspect: "On classroom create, status is system-set OPEN and active_enrollment_count 0 regardless of any input attempting to set them."
        test_recipe:
          setup: ["a center"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, st: $.data.status, cnt: $.data.active_enrollment_count }
          assert:
            - "Classroom.${room_id}.status == OPEN"
            - "Classroom.${room_id}.active_enrollment_count == 0"

  # ===================================================================
  - section: state_machines
    instances:
      - name: accept_enrollment_from_active_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Enrollment.OFFERED_to_ACCEPTED
          - validations[priority=7]
        distinguishing_aspect: "Accepting an already-ACTIVE enrollment is undefined from ACTIVE -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["an ACTIVE enrollment"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CenterDirector
          trigger:
            - call: "POST /enrollments/${enr_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: enrollment_initial_state_is_offered
        claim_type: initial_state
        grounds: [state_machines.Enrollment, entities.Enrollment.fields.status]
        distinguishing_aspect: "A newly created enrollment starts in OFFERED with sibling_discount_pct 0 and monthly_net_tuition_cents 0 (unpriced until ACTIVE)."
        test_recipe:
          setup: ["a classroom and child"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_id: $.data.id, st: $.data.status }
          assert:
            - "Enrollment.${enr_id}.status == OFFERED"
            - "Enrollment.${enr_id}.monthly_net_tuition_cents == 0"

      - name: terminal_graduated_locked_down
        claim_type: terminal_state
        grounds:
          - state_machines.Enrollment
          - validations[priority=7]
        distinguishing_aspect: "From terminal GRADUATED no transition is possible: a subsequent withdraw returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["an ACTIVE enrollment then GRADUATED"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CenterDirector
            - call: "POST /enrollments/${enr_id}/graduate"
              payload: {}
              as: CenterDirector
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: CenterDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: graduate_bubbles_capacity_decrement_and_status_reopen
        claim_type: side_effect_execution
        grounds: [state_machines.Enrollment.ACTIVE_to_GRADUATED, entities.Classroom.fields.active_enrollment_count, entities.Classroom.fields.status]
        distinguishing_aspect: "Graduating the sole ACTIVE enrollment in a capacity-1 (FULL) classroom decrements active_enrollment_count to 0 and flips Classroom.status back to OPEN."
        test_recipe:
          setup: ["capacity-1 classroom with one ACTIVE enrollment (FULL)"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 1, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CenterDirector
          trigger:
            - call: "POST /enrollments/${enr_id}/graduate"
              payload: {}
              as: CenterDirector
              captures: { st: $.data.status }
          assert:
            - "Classroom.${room_id}.active_enrollment_count == 0"
            - "Classroom.${room_id}.status == OPEN"

      - name: waitlist_convert_consumes_offer_to_converted
        claim_type: valid_transition
        grounds: [state_machines.WaitlistEntry.OFFERED_to_CONVERTED, endpoints]
        distinguishing_aspect: "Creating an enrollment with waitlist_entry_id pointing at an OFFERED non-expired entry transitions that WaitlistEntry to CONVERTED."
        test_recipe:
          setup: ["a promoted (OFFERED) waitlist entry within its TTL"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: CenterDirector
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 1, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /classrooms/${room_id}/waitlist"
              payload: { child_id: "${kid_id}" }
              as: CenterDirector
              captures: { wl_id: $.data.id }
            - call: "POST /classrooms/${room_id}/waitlist/promote"
              payload: {}
              as: CenterDirector
          trigger:
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}", waitlist_entry_id: "${wl_id}" }
              as: CenterDirector
              captures: { enr_id: $.data.id }
          assert:
            - "WaitlistEntry.${wl_id}.status == CONVERTED"
            - "Enrollment.${enr_id}.status == OFFERED"

      - name: waitlist_withdraw_by_parent_valid
        claim_type: valid_transition
        grounds: [state_machines.WaitlistEntry.WAITING_to_WITHDRAWN]
        distinguishing_aspect: "Parent owning the child withdraws a WAITING entry -> status WITHDRAWN."
        test_recipe:
          setup: ["a WAITING entry for the parent's child"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 1, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { kid_id: $.data.id }
            - call: "POST /classrooms/${room_id}/waitlist"
              payload: { child_id: "${kid_id}" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { wl_id: $.data.id }
          trigger:
            - call: "POST /waitlist-entries/${wl_id}/withdraw"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
              captures: { st: $.data.status }
          assert:
            - "WaitlistEntry.${wl_id}.status == WITHDRAWN"

      - name: convert_expired_offer_returns_offer_expired
        claim_type: precondition_enforcement
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_CONVERTED
          - validations[priority=8]
          - errors[ERR_OFFER_EXPIRED]
        distinguishing_aspect: "Creating an enrollment against an OFFERED entry after offer_expires_at returns ERR_OFFER_EXPIRED (409)."
        test_recipe:
          setup: ["a promoted OFFERED entry; clock advanced past its TTL"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: CenterDirector
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 1, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /classrooms/${room_id}/waitlist"
              payload: { child_id: "${kid_id}" }
              as: CenterDirector
              captures: { wl_id: $.data.id }
            - call: "POST /classrooms/${room_id}/waitlist/promote"
              payload: {}
              as: CenterDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:00:00Z" }
              as: CenterDirector
          trigger:
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}", waitlist_entry_id: "${wl_id}" }
              as: CenterDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OFFER_EXPIRED"

      - name: payment_drives_invoice_to_paid_bubble_up
        claim_type: bubble_up
        grounds: [state_machines.Invoice.ISSUED_to_PAID, entities.Invoice.fields.amount_paid_cents]
        distinguishing_aspect: "A payment bringing amount_paid_cents to total_cents auto-transitions the Invoice ISSUED->PAID."
        test_recipe:
          setup: ["an ISSUED invoice with total 120000"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CenterDirector
            - call: "POST /families/${fam_id}/invoices"
              payload: { billing_month: "2026-03" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
              captures: { inv_v: $.data.version }
          trigger:
            - call: "POST /payments"
              payload: { invoice_id: "${inv_id}", amount_cents: 120000, method: "CARD", expected_invoice_version: "${inv_v}" }
              as: BillingAdmin
          assert:
            - "Invoice.${inv_id}.status == PAID"
            - "Invoice.${inv_id}.amount_paid_cents == 120000"

      - name: void_paid_invoice_excluded
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=17]
          - errors[ERR_INVOICE_HAS_PAYMENTS]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_void_paid_invoice
          rationale: "Voiding a PAID invoice is asserted in the §1.8 priority-pair instance, where state (ERR_INVALID_STATE) wins over the has-payments fiscal check; the fiscal rule alone is exercised by void_issued_invoice_with_partial_payment below."

  # ===================================================================
  - section: calculations
    instances:
      - name: late_pickup_one_minute_over_grace_charges_one_block
        claim_type: Boundary
        grounds: [calculations.late_pickup_fine]
        distinguishing_aspect: "raw_late 6 min, grace 5 -> billable 1 min -> ceil(1/15)=1 block -> fine 1500; late_pickup_minutes 1."
        test_recipe:
          setup: ["ACTIVE enrollment; check-in at 17:00; check-out at 17:06 (6 min late)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T16:00:00Z" }
              as: CenterDirector
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I", late_pickup_grace_minutes: 5, late_pickup_fee_per_block_cents: 1500, late_pickup_block_minutes: 15 }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
