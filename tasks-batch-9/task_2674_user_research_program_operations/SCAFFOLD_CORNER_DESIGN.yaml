    instances:
      - name: screen_score_hard_gate_and_partial_credit
        claim_type: Correct Result
        grounds:
          - calculations.screen_score
          - state_machines[Recruitment.status] INVITED -> SCREENED_IN
          - state_machines[Recruitment.status] INVITED -> SCREENED_OUT
        distinguishing_aspect: "Three invitations score 0.00, 55.00 and 90.00 from the same criteria: the disqualifying answer short-circuits everything else, the wrong locale leaves 55.00 just under SCREEN_IN_MIN, and the target-answer term is capped at 40.00 even with a third matching answer."
        test_recipe:
          setup:
            - "FIELDING INTERVIEW study, target 3, criteria segment POWER_USER / locale en-US / targets [A1, A2] / disqualifier X9"
            - "Three invited participants with different screening answers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Screening rules", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "Who should we talk to about exports?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
            - call: "POST /research-requests/${req_id}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /participant-pools"
              payload: { name: "Screening pool", pool_type: "CUSTOMER_LIST", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 100000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-901", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-902", segment: "POWER_USER", locale: "de-DE", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p2_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-903", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p3_id: $.data.id }
            - call: "POST /studies"
              payload: { research_request_id: "${req_id}", participant_pool_id: "${pool_id}", method: "INTERVIEW", target_participant_count: 3, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1", "A2"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 5000, fielding_start: "2026-08-03T00:00:00Z", fielding_end: "2026-08-21T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { study_id: $.data.id }
            - call: "PUT /studies/${study_id}/guide"
              payload: { guide_version_label: "G1", guide_question_count: 6 }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /studies/${study_id}/guide/approve"
