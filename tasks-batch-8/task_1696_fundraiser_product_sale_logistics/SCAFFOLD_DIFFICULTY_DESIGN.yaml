# =============================================================================
# §1.8 Scaffold Difficulty Design — Fundraiser Product Sale Logistics
# 21 instances across the nine Difficulty Rules (§0.5).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: proceeds_split_provisional_vs_final_rounding_divergence
        grounds:
          - calculations.provisional_proceeds_credit
          - calculations.final_settlement
          - entities.StudentGroup.fields.provisional_proceeds_cents
          - entities.StudentGroup.fields.final_proceeds_cents
          - entities.Campaign.fields.general_fund_cents
        distinguishing_aspect: |
          Order/StudentGroup money domain (distinct from the SupplierOrder procurement domain of the
          sibling instance): identical order data produces 498 cents provisionally (per-line
          round_half_up then sum, posted at submit) versus 499 cents finally (unrounded per-line
          shares summed across the group, rounded once at close) — the variants diverge by exactly 1.
        test_recipe:
          setup:
            - "campaign OPEN (window 2026-08-01..2026-08-20, default bps 5000), group G, product P price 999 cost 500 bps 3333 case 12, seller S in G"
            - "three orders of quantity 1 of P, each submitted and fully paid (999 CASH, cleared)"
            - "campaign driven ORDERING_CLOSED -> supplier order (3 requested -> 1 case -> 12 units, ack cost 500, delivered 12) -> event -> sort -> distribution -> reconcile -> CLOSED"
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 999, supplier_unit_cost_cents: 500, case_pack_size: 12, profit_share_bps: 3333 }
              as: FundraiserAdmin
              captures: { p1: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { sA: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam1", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
              captures: { o1: $.data.id }
            - { call: "POST /fundraiser/orders/${o1}/submit", payload: {}, as: GroupCoordinator }
            - call: "POST /fundraiser/payments"
              payload: { order_id: "${o1}", amount_cents: 999, method: "CASH" }
              as: Treasurer
              as_user_id: "treas-1"
              captures: { pay1: $.data.id }
            - { call: "POST /fundraiser/payments/${pay1}/clear", payload: {}, as: Treasurer, as_user_id: "treas-1" }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam2", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
              captures: { o2: $.data.id }
            - { call: "POST /fundraiser/orders/${o2}/submit", payload: {}, as: GroupCoordinator }
            - call: "POST /fundraiser/payments"
              payload: { order_id: "${o2}", amount_cents: 999, method: "CASH" }
              as: Treasurer
              as_user_id: "treas-1"
              captures: { pay2: $.data.id }
            - { call: "POST /fundraiser/payments/${pay2}/clear", payload: {}, as: Treasurer, as_user_id: "treas-1" }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam3", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
              captures: { o3: $.data.id }
            - { call: "POST /fundraiser/orders/${o3}/submit", payload: {}, as: GroupCoordinator }
            - call: "POST /fundraiser/payments"
              payload: { order_id: "${o3}", amount_cents: 999, method: "CASH" }
              as: Treasurer
              as_user_id: "treas-1"
              captures: { pay3: $.data.id }
            - { call: "POST /fundraiser/payments/${pay3}/clear", payload: {}, as: Treasurer, as_user_id: "treas-1" }
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: FundraiserAdmin }
            - { call: "POST /fundraiser/campaigns/${camp}/close-ordering", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/supplier-orders"
              payload: { campaign_id: "${camp}" }
              as: FundraiserAdmin
              captures: { so1: $.data.id }
            - { call: "POST /fundraiser/supplier-orders/${so1}/submit", payload: {}, as: FundraiserAdmin, as_user_id: "admin-1" }
            - { call: "POST /fundraiser/supplier-orders/${so1}/acknowledge", payload: { confirmed_delivery_date: "2026-09-05T00:00:00Z", line_costs: [ { product_id: "${p1}", unit_cost_actual_cents: 500 } ] }, as: SupplierRep, as_user_id: "supp-1" }
            - { call: "POST /fundraiser/supplier-orders/${so1}/deliver", payload: { actual_delivery_date: "2026-09-05T00:00:00Z", delivered: [ { product_id: "${p1}", delivered_units: 12 } ] }, as: SupplierRep, as_user_id: "supp-2" }
            - call: "POST /fundraiser/distribution-events"
              payload: { campaign_id: "${camp}", venue: "Gym", window_start: "2026-09-06T15:00:00Z", window_end: "2026-09-06T18:00:00Z", slot_capacity: 2 }
              as: GroupCoordinator
              captures: { ev1: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/generate-sort-tickets", payload: {}, as: GroupCoordinator }
            - call: "GET /fundraiser/sort-tickets"
              payload: { campaign_id: "${camp}" }
              as: GroupCoordinator
              captures: { t1: "$.data[0].id" }
            - { call: "POST /fundraiser/sort-tickets/${t1}/verify", payload: { verified_qty: 3 }, as: GroupCoordinator }
            - { call: "POST /fundraiser/campaigns/${camp}/mark-sorted", payload: {}, as: GroupCoordinator }
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T16:00:00Z" }, as: FundraiserAdmin }
            - { call: "POST /fundraiser/distribution-events/${ev1}/complete", payload: {}, as: GroupCoordinator }
            - { call: "POST /fundraiser/campaigns/${camp}/complete-distribution", payload: {}, as: GroupCoordinator }
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T00:00:00Z" }, as: FundraiserAdmin }
            - { call: "POST /fundraiser/campaigns/${camp}/reconcile", payload: {}, as: FundraiserAdmin }
            - call: "GET /fundraiser/groups/${gA}"
              payload: {}
              as: Treasurer
              captures: { prov_before_close: $.data.provisional_proceeds_cents }
            - { call: "POST /fundraiser/campaigns/${camp}/close", payload: {}, as: Treasurer, as_user_id: "treas-1" }
          trigger:
            - call: "GET /fundraiser/groups/${gA}"
              payload: {}
              as: Treasurer
            - call: "GET /fundraiser/campaigns/${camp}"
              payload: {}
              as: Treasurer
          assert:
            - "captured prov_before_close == 498 (three per-line credits of round_half_up(499*3333/10000)=166)"
            - "StudentGroup.${gA}.provisional_proceeds_cents == 498"
            - "StudentGroup.${gA}.final_proceeds_cents == 499 (round_half_up(1497*3333/10000) once)"
            - "StudentGroup.${gA}.proceeds_balance_cents == 499"
            - "Campaign.${camp}.general_fund_cents == 998 (total_net 1497 - group share 499 - family credits 0)"
            - "ledger of group ${gA} contains a FINAL_TRUE_UP_CREDIT entry with amount_cents == 1"
            - "Campaign.${camp}.status == CLOSED"

      - name: supplier_cost_estimate_vs_actual_divergence
        grounds:
          - calculations.supplier_cost
          - calculations.supplier_aggregation_case_pack
          - entities.SupplierOrder.fields.estimated_cost_cents
          - entities.SupplierOrder.fields.actual_cost_cents
        distinguishing_aspect: |
          SupplierOrder procurement domain (distinct from the proceeds domain): for identical
          quantities the estimated variant prices 36 case-rounded units at the 600-cent catalog
          snapshot (21600) while the actual variant prices 36 delivered units at the 625-cent
          supplier-confirmed cost (22500) — a 900-cent divergence from the same order book.
        test_recipe:
          setup:
            - "campaign OPEN, group G, product P price 1000 cost 600 case 12, seller S"
            - "two submitted orders of quantity 13 and 12 (unpaid — aggregation ignores payment state)"
            - "ordering closed; supplier order created, submitted, acknowledged at 625, delivered 36"
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
              captures: { p1: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { sA: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam1", lines: [ { product_id: "${p1}", quantity: 13 } ] }
              as: GroupCoordinator
              captures: { o1: $.data.id }
            - { call: "POST /fundraiser/orders/${o1}/submit", payload: {}, as: GroupCoordinator }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam2", lines: [ { product_id: "${p1}", quantity: 12 } ] }
              as: GroupCoordinator
              captures: { o2: $.data.id }
            - { call: "POST /fundraiser/orders/${o2}/submit", payload: {}, as: GroupCoordinator }
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: FundraiserAdmin }
            - { call: "POST /fundraiser/campaigns/${camp}/close-ordering", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/supplier-orders"
              payload: { campaign_id: "${camp}" }
              as: FundraiserAdmin
              captures: { so1: $.data.id }
            - call: "GET /fundraiser/supplier-orders/${so1}/lines"
              payload: {}
              as: FundraiserAdmin
              captures: { sol1: "$.data[0].id" }
            - { call: "POST /fundraiser/supplier-orders/${so1}/submit", payload: {}, as: FundraiserAdmin, as_user_id: "admin-1" }
            - call: "GET /fundraiser/supplier-orders/${so1}"
              payload: {}
              as: FundraiserAdmin
              captures: { est_at_submit: $.data.estimated_cost_cents }
            - { call: "POST /fundraiser/supplier-orders/${so1}/acknowledge", payload: { confirmed_delivery_date: "2026-09-05T00:00:00Z", line_costs: [ { product_id: "${p1}", unit_cost_actual_cents: 625 } ] }, as: SupplierRep, as_user_id: "supp-1" }
            - { call: "POST /fundraiser/supplier-orders/${so1}/deliver", payload: { actual_delivery_date: "2026-09-05T00:00:00Z", delivered: [ { product_id: "${p1}", delivered_units: 36 } ] }, as: SupplierRep, as_user_id: "supp-2" }
          trigger:
            - call: "GET /fundraiser/supplier-orders/${so1}"
              payload: {}
              as: FundraiserAdmin
            - call: "GET /fundraiser/supplier-orders/${so1}/lines"
              payload: {}
              as: FundraiserAdmin
          assert:
            - "SupplierOrderLine.${sol1}.requested_units == 25"
            - "SupplierOrderLine.${sol1}.ordered_cases == 3 (ceil(25/12))"
            - "SupplierOrderLine.${sol1}.ordered_units == 36"
            - "captured est_at_submit == 21600 (36 * 600 estimated)"
            - "SupplierOrder.${so1}.estimated_cost_cents == 21600"
            - "SupplierOrder.${so1}.actual_cost_cents == 22500 (36 * 625 actual)"
            - "SupplierOrderLine.${sol1}.shortage_units == 0"
            - "SupplierOrder.${so1}.status == DELIVERED"

  - rule_id: combinatorial_formula
    instances:
      - name: return_credit_tiered_fee_waive_and_availability
        grounds:
          - calculations.return_credit
          - entities.ReturnRequest.fields.refund_cents
          - entities.ReturnRequest.fields.restocking_fee_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: refund = quantity * price minus a
          per-unit fee that is conditionally zero by reason, gated by the elapsed-days window and
          capped by available quantity net of sibling open returns; UNSOLD qty 2 at price 1000
          yields fee 200 and refund 1800.
        test_recipe:
          setup:
            - "campaign driven to DISTRIBUTION_COMPLETE with one order qty 3 (price 1000, cost 600, default bps 5000) fully paid; distribution_completed_at = 2026-09-06T16:00:00Z"
            - "clock at 2026-09-11T12:00:00Z (day 5 of the 7-day return window)"
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
              captures: { p1: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { sA: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam1", lines: [ { product_id: "${p1}", quantity: 3 } ] }
              as: GroupCoordinator
              captures: { o1: $.data.id }
            - { call: "POST /fundraiser/orders/${o1}/submit", payload: {}, as: GroupCoordinator }
            - call: "POST /fundraiser/payments"
              payload: { order_id: "${o1}", amount_cents: 3000, method: "CASH" }
              as: Treasurer
              as_user_id: "treas-1"
              captures: { pay1: $.data.id }
            - { call: "POST /fundraiser/payments/${pay1}/clear", payload: {}, as: Treasurer, as_user_id: "treas-1" }
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: FundraiserAdmin }
            - { call: "POST /fundraiser/campaigns/${camp}/close-ordering", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/supplier-orders"
              payload: { campaign_id: "${camp}" }
              as: FundraiserAdmin
              captures: { so1: $.data.id }
            - { call: "POST /fundraiser/supplier-orders/${so1}/submit", payload: {}, as: FundraiserAdmin, as_user_id: "admin-1" }
            - { call: "POST /fundraiser/supplier-orders/${so1}/acknowledge", payload: { confirmed_delivery_date: "2026-09-05T00:00:00Z", line_costs: [ { product_id: "${p1}", unit_cost_actual_cents: 600 } ] }, as: SupplierRep, as_user_id: "supp-1" }
            - { call: "POST /fundraiser/supplier-orders/${so1}/deliver", payload: { actual_delivery_date: "2026-09-05T00:00:00Z", delivered: [ { product_id: "${p1}", delivered_units: 12 } ] }, as: SupplierRep, as_user_id: "supp-2" }
            - call: "POST /fundraiser/distribution-events"
              payload: { campaign_id: "${camp}", venue: "Gym", window_start: "2026-09-06T15:00:00Z", window_end: "2026-09-06T18:00:00Z", slot_capacity: 2 }
              as: GroupCoordinator
              captures: { ev1: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/generate-sort-tickets", payload: {}, as: GroupCoordinator }
            - call: "GET /fundraiser/sort-tickets"
              payload: { campaign_id: "${camp}" }
              as: GroupCoordinator
              captures: { t1: "$.data[0].id" }
            - { call: "POST /fundraiser/sort-tickets/${t1}/verify", payload: { verified_qty: 3 }, as: GroupCoordinator }
            - { call: "POST /fundraiser/campaigns/${camp}/mark-sorted", payload: {}, as: GroupCoordinator }
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T16:00:00Z" }, as: FundraiserAdmin }
            - { call: "POST /fundraiser/distribution-events/${ev1}/complete", payload: {}, as: GroupCoordinator }
            - { call: "POST /fundraiser/campaigns/${camp}/complete-distribution", payload: {}, as: GroupCoordinator }
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T12:00:00Z" }, as: FundraiserAdmin }
            - call: "GET /fundraiser/orders/${o1}/lines"
              payload: {}
              as: GroupCoordinator
              captures: { l1: "$.data[0].id" }
          trigger:
            - call: "POST /fundraiser/return-requests"
              payload: { seller_id: "${sA}", order_id: "${o1}", order_line_id: "${l1}", quantity: 2, reason: "UNSOLD" }
              as: GroupCoordinator
              as_user_id: "coord-1"
              captures: { rr1: $.data.id }
            - { call: "POST /fundraiser/return-requests/${rr1}/approve", payload: {}, as: Treasurer, as_user_id: "treas-2" }
            - { call: "POST /fundraiser/return-requests/${rr1}/receive", payload: { disposition: "RESTOCKABLE" }, as: Treasurer, as_user_id: "treas-2" }
            - call: "GET /fundraiser/return-requests/${rr1}"
              payload: {}
              as: Treasurer
            - call: "GET /fundraiser/products/${p1}"
              payload: {}
              as: Treasurer
            - call: "GET /fundraiser/groups/${gA}"
              payload: {}
              as: Treasurer
          assert:
            - "ReturnRequest.${rr1}.restocking_fee_cents == 200 (2 * round_half_up(1000 * 1000/10000))"
            - "ReturnRequest.${rr1}.refund_cents == 1800 (2*1000 - 200)"
            - "ReturnRequest.${rr1}.status == RECEIVED_RESTOCKED"
            - "ledger of group ${gA} contains RETURN_DEBIT with amount_cents == -400 (round_half_up(2*(1000-600)*5000/10000))"
            - "StudentGroup.${gA}.proceeds_balance_cents == 200 (provisional 600 - 400)"
            - "Product.${p1}.restocked_units == 2 and Product.${p1}.distributed_units == 1 and Product.${p1}.surplus_units == 9"
            - "Order.${o1}.fulfillment_status == PARTIALLY_RETURNED"

      - name: group_share_sum_then_round_beats_per_line_sum
        grounds:
          - calculations.final_settlement
          - calculations.provisional_proceeds_credit
          - entities.StudentGroup.fields.final_proceeds_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: provisional rounds each line
          (round_half_up(149.5)=150 twice -> 300) while final sums unrounded shares and rounds once
          (round_half_up(299.0)=299); the scaffold pins per-line-then-sum for provisional and
          sum-then-round for final, so the group sees a -1 TRUE_UP debit.
        test_recipe:
          setup:
            - "campaign OPEN (default bps 5000), group G, product P price 899 cost 600 case 12 (bps inherited 5000), seller S"
            - "two submitted+paid orders of quantity 1 each; campaign driven to CLOSED"
          setup_api_calls:
