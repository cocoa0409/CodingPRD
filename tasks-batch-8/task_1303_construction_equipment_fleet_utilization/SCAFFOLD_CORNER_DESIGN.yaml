            - "Mechanic.${m204_id}.status == AVAILABLE (unchanged)"

      - name: lowboy_out_of_service_cycle_and_on_haul_lockout
        claim_type: invalid_transition
        grounds: [state_machines.Lowboy.AVAILABLE_to_OUT_OF_SERVICE, state_machines.Lowboy.OUT_OF_SERVICE_to_AVAILABLE, state_machines.Lowboy.AVAILABLE_to_ON_Haul]
        distinguishing_aspect: "OUT_OF_SERVICE is reachable only from AVAILABLE: a lowboy ON_Haul (after depart) rejects out-of-service with 409 ERR_INVALID_STATE; the OUT_OF_SERVICE -> AVAILABLE return path works."
        test_recipe:
          setup: ["Class, projects P205A/P205B, lowboy L205, equipment E205 IDLE at P205A after closed assignment; transport T205 created and DEPARTED (L205 ON_Haul)"]
