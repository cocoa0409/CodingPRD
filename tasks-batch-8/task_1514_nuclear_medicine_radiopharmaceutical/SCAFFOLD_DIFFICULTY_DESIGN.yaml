            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-1", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
