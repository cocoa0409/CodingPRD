    description: "Renew a package: apply rollover cap then grant new credits."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Package
    side_effects: ["package_rollover calc", "CreditLedgerEntry(ROLLOVER_FORFEIT) if over cap, then CreditLedgerEntry(GRANT)", "advance current_cycle_end", "increments Package.version by 1"]
  - method: POST
    path: "/practice/packages/{id}/suspend"
    description: "Suspend a package (freeze credits)."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Package
    side_effects: ["set package_status = SUSPENDED", "increments Package.version by 1"]
  - method: POST
    path: "/practice/packages/{id}/resume"
    description: "Resume a suspended package."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Package
    side_effects: ["set package_status = ACTIVE", "increments Package.version by 1"]
  - method: POST
    path: "/practice/packages/{id}/cancel-membership"
    description: "Cancel a membership; convert remaining credits to wallet credit."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Package
    side_effects: ["convert credit_balance_sessions to Client.wallet_credit_cents via CreditLedgerEntry(EXPIRE)", "set package_status = CANCELLED", "increments Package.version by 1", "increments Client.version by 1"]

  # ---- CommissionTier ----
  - method: POST
