            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_b}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-10-01T00:00:00Z", validity_days: 60, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
