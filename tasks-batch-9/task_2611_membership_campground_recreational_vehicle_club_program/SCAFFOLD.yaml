errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Member acts on a membership, reservation, dues invoice, transfer request or exception whose Membership.member_id differs from X-User-ID"
  - id: ERR_NOT_PARK_MANAGER
    http: 403
    condition: "a ParkManager acts on a park (directly or via a window, inspection, project or reservation) whose id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding X-User-ID equals the X-User-ID that created the capital project or submitted the transfer request"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "no Membership row for the supplied membership id"
  - id: ERR_TIER_NOT_FOUND
    http: 404
    condition: "no MembershipTier row for the supplied tier id"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "no Member row for the supplied member_id or to_member_id"
  - id: ERR_PARK_NOT_FOUND
    http: 404
    condition: "no Park row for the supplied park id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no Reservation row for the supplied reservation id"
  - id: ERR_DUES_INVOICE_NOT_FOUND
    http: 404
    condition: "no DuesInvoice row for the supplied invoice id"
  - id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http: 404
    condition: "no TransferRequest row for the supplied request id"
  - id: ERR_MAINTENANCE_WINDOW_NOT_FOUND
    http: 404
    condition: "no MaintenanceWindow row for the supplied window id"
  - id: ERR_CAPITAL_PROJECT_NOT_FOUND
    http: 404
    condition: "no CapitalProject row for the supplied project id"
  - id: ERR_OCCUPANCY_EXCEPTION_NOT_FOUND
    http: 404
    condition: "no OccupancyException row for the supplied exception id"
  - id: ERR_AFFILIATE_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no AffiliateAgreement row for the supplied affiliate_agreement_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required body field missing, enum value outside its declared set, negative integer amount, malformed ISO date, or departure_date not strictly after arrival_date"
  - id: ERR_STALE_MEMBERSHIP_VERSION
    http: 412
    condition: "expected_membership_version on POST /transfer-requests does not equal the membership's current version"
  - id: ERR_STALE_PARK_VERSION
    http: 412
    condition: "expected_park_version on POST /capital-projects/{id}/decision does not equal the park's current version"
  - id: ERR_INVALID_RESERVATION_STATE
    http: 409
    condition: "the reservation's status has no declared transition for the requested action (e.g. check-in from WAITLISTED, extension from CONFIRMED, survey before COMPLETED, cancellation of a COMPLETED stay)"
  - id: ERR_INVALID_PARK_STATE
    http: 409
    condition: "the park's park_status has no declared transition for the requested action (e.g. season-opening an already OPEN park, inspecting a SEASONAL_CLOSED park)"
  - id: ERR_INVALID_MAINTENANCE_STATE
    http: 409
    condition: "activation of a window that is not SCHEDULED, or completion of a window that is not ACTIVE"
  - id: ERR_INVALID_TRANSFER_STATE
    http: 409
    condition: "a decision is submitted on a transfer request that is not SUBMITTED"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "the requested affiliate agreement new_status is not reachable from its current status"
  - id: ERR_EXCEPTION_ALREADY_DECIDED
    http: 409
    condition: "a decision is submitted on an occupancy exception that is already GRANTED or DENIED"
  - id: ERR_DUES_INVOICE_NOT_PAYABLE
    http: 409
    condition: "payment against an invoice that is not OPEN or PAST_DUE, or a reversal against an invoice that is not PAID"
  - id: ERR_MEMBERSHIP_NOT_ACTIVE
    http: 409
    condition: "the acting membership's membership_status is SUSPENDED, TRANSFER_PENDING or TERMINATED"
  - id: ERR_AFFILIATE_AGREEMENT_INACTIVE
    http: 409
    condition: "the target park's affiliate agreement is DRAFT, SUSPENDED or EXPIRED"
  - id: ERR_PARK_NOT_OPEN
    http: 422
    condition: "the target park's park_status is SEASONAL_CLOSED or MAINTENANCE_HOLD"
  - id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http: 409
    condition: "a requested or extended night falls inside the closed inclusive interval of a SCHEDULED or ACTIVE maintenance window"
  - id: ERR_ABSOLUTE_OCCUPANCY_CAP
    http: 422
    condition: "the merged occupancy run would exceed ABSOLUTE_MAX_RUN_NIGHTS; not liftable by an occupancy exception"
  - id: ERR_ADVANCE_WINDOW_EXCEEDED
    http: 422
    condition: "arrival_date is further ahead than min(tier.advance_window_days, agreement.advance_window_cap_days) days from the current logical date"
  - id: ERR_STAY_OUTSIDE_SEASON
    http: 422
    condition: "a requested night falls outside the park's [season_open_date, season_close_date] window"
  - id: ERR_STAY_LENGTH_EXCEEDED
    http: 422
    condition: "a new booking's merged occupancy run exceeds tier.max_consecutive_stay_nights with no GRANTED exception, or the stay exceeds the affiliate agreement's per_stay_night_cap; an extension that overruns the tier limit opens an OccupancyException instead of raising this error"
  - id: ERR_OUT_AND_BACK_VIOLATION
    http: 422
    condition: "the gap between the previous stay's departure_date and this arrival_date is fewer than tier.min_out_nights_between_stays nights"
  - id: ERR_OVERLAPPING_STAY
    http: 409
    condition: "the requested half-open night set intersects another active stay of the same membership at any park"
  - id: ERR_AFFILIATE_TIER_INELIGIBLE
    http: 422
    condition: "the booking tier has affiliate_access_enabled false, or its tier_rank is below the agreement's min_tier_rank"
  - id: ERR_AFFILIATE_QUOTA_EXHAUSTED
    http: 422
    condition: "the agreement's nights_consumed_ytd plus the quota nights this stay would consume exceeds annual_member_night_quota"
  - id: ERR_RESALE_NOT_PERMITTED
    http: 422
    condition: "transfer_type RESALE on a tier whose resale_allowed is false"
  - id: ERR_RESALE_HOLD_ACTIVE
    http: 422
    condition: "transfer_type RESALE before purchased_at + RESALE_HOLD_DAYS has elapsed"
  - id: ERR_TRANSFER_LIMIT_REACHED
    http: 422
    condition: "the membership's transfer_count has already reached MAX_TRANSFERS_PER_CHAIN"
  - id: ERR_TRANSFER_BLOCKED_OPEN_RESERVATIONS
    http: 409
    condition: "the membership still holds a PENDING, CONFIRMED, WAITLISTED, CHECKED_IN or EXTENSION_REVIEW reservation"
  - id: ERR_DUES_NOT_CURRENT
    http: 409
    condition: "the booking membership's dues_status is DELINQUENT or WRITTEN_OFF, or a transfer is submitted or decided while dues_status is anything other than CURRENT"
  - id: ERR_CLASS_A_RESTRICTED_IN_GRACE
    http: 422
    condition: "a membership in dues_status GRACE books or extends at a CLASS_A park"
  - id: ERR_ENTITLEMENT_NIGHTS_EXHAUSTED
    http: 422
    condition: "the requested nights would push nights_used_<park_class> past the tier's per-class entitlement or annual_nights_used past annual_total_night_cap"
  - id: ERR_NO_TRANSIENT_CAPACITY
    http: 409
    condition: "no transient-pool site is free on every requested night of a public booking"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "the payment amount_cents is not exactly the invoice's outstanding amount_cents + late_fee_cents - paid_amount_cents"
  - id: ERR_REINSTATEMENT_FEE_REQUIRED
    http: 422
    condition: "reinstatement attempted with a non-zero dues_balance_cents or with reinstatement_fee_paid_cents not equal to REINSTATEMENT_FEE_CENTS"

roles:
  - name: Member
    description: "A natural person who holds one or more memberships; books stays, pays dues, extends stays, submits surveys and initiates transfers"
    identity: "entity_backed:Member"
    exclusive_operations: ["POST /reservations", "POST /reservations/{id}/extensions", "POST /reservations/{id}/satisfaction-surveys", "POST /transfer-requests"]
    shared_operations: ["POST /dues-invoices/{id}/payments", "POST /reservations/{id}/cancellation", "POST /reservations/{id}/check-in", "POST /reservations/{id}/check-out", "GET /memberships/{id}", "GET /memberships/{id}/dues-invoices", "GET /memberships/{id}/satisfaction-surveys", "GET /members/{id}", "GET /dues-invoices/{id}", "GET /reservations/{id}", "GET /reservations/{id}/satisfaction-surveys", "GET /reservations/{id}/occupancy-exceptions", "GET /occupancy-exceptions/{id}", "GET /transfer-requests/{id}", "GET /membership-tiers/{id}", "GET /membership-tiers", "GET /parks/{id}", "GET /parks", "POST /_clock/set_current_utc"]
  - name: ParkManager
    description: "Operator of a single park; opens and closes the season, schedules and runs maintenance, files amenity inspections and proposes capital projects for that park only"
    identity: "entity_backed:Park"
    exclusive_operations: ["POST /maintenance-windows", "POST /maintenance-windows/{id}/activation", "POST /maintenance-windows/{id}/completion"]
    shared_operations: ["POST /parks/{id}/season-openings", "POST /parks/{id}/season-closures", "POST /parks/{id}/amenity-inspections", "POST /capital-projects", "POST /reservations/{id}/check-in", "POST /reservations/{id}/check-out", "GET /parks/{id}", "GET /parks", "GET /parks/{id}/amenity-inspections", "GET /parks/{id}/satisfaction-surveys", "GET /parks/{id}/maintenance-windows", "GET /parks/{id}/capital-projects", "GET /capital-projects/{id}", "GET /reservations", "GET /reservations/{id}", "GET /reservations/{id}/satisfaction-surveys", "GET /reservations/{id}/occupancy-exceptions", "GET /membership-tiers/{id}", "GET /membership-tiers", "POST /_clock/set_current_utc"]
  - name: ClubAdmin
    description: "Club headquarters operator; sells memberships, runs the dues and reinvestment cycles, decides transfers and capital projects, and administers parks and affiliate agreements"
    identity: "opaque"
    exclusive_operations: ["POST /membership-tiers", "POST /members", "POST /memberships", "POST /memberships/{id}/suspension", "POST /memberships/{id}/reinstatement", "POST /dues-invoices/{id}/payment-reversals", "POST /ops/annual-dues-run", "POST /ops/dues-delinquency-run", "POST /parks", "POST /affiliate-agreements", "POST /affiliate-agreements/{id}/status-changes", "POST /transfer-requests/{id}/decision", "POST /capital-projects/{id}/decision", "POST /ops/reinvestment-runs", "GET /memberships", "GET /transfer-requests"]
    shared_operations: ["POST /dues-invoices/{id}/payments", "POST /reservations/{id}/cancellation", "POST /parks/{id}/season-openings", "POST /parks/{id}/season-closures", "POST /capital-projects", "GET /members/{id}", "GET /memberships/{id}", "GET /memberships/{id}/dues-invoices", "GET /memberships/{id}/satisfaction-surveys", "GET /dues-invoices/{id}", "GET /parks/{id}", "GET /parks", "GET /parks/{id}/amenity-inspections", "GET /parks/{id}/satisfaction-surveys", "GET /parks/{id}/maintenance-windows", "GET /parks/{id}/capital-projects", "GET /capital-projects/{id}", "GET /reservations", "GET /reservations/{id}", "GET /reservations/{id}/satisfaction-surveys", "GET /reservations/{id}/occupancy-exceptions", "GET /occupancy-exceptions/{id}", "GET /transfer-requests/{id}", "GET /affiliate-agreements/{id}", "GET /membership-tiers/{id}", "GET /membership-tiers", "POST /_clock/set_current_utc"]
  - name: ComplianceOfficer
    description: "Independent policy reviewer; decides long-term-occupancy exceptions and may audit amenity standards, but can neither book stays nor move money"
    identity: "opaque"
    exclusive_operations: ["POST /occupancy-exceptions/{id}/decision"]
    shared_operations: ["POST /parks/{id}/amenity-inspections", "GET /parks/{id}", "GET /parks", "GET /parks/{id}/amenity-inspections", "GET /parks/{id}/satisfaction-surveys", "GET /parks/{id}/maintenance-windows", "GET /reservations/{id}/satisfaction-surveys", "GET /reservations/{id}/occupancy-exceptions", "GET /occupancy-exceptions/{id}", "GET /affiliate-agreements/{id}", "GET /membership-tiers/{id}", "GET /membership-tiers", "POST /_clock/set_current_utc"]
  - name: TransientGuest
    description: "Member of the public booking a paid nightly stay out of the transient pool; never waitlisted, never entitled to member-pool sites"
    identity: "opaque"
    exclusive_operations: ["POST /transient-reservations"]
    shared_operations: ["POST /reservations/{id}/cancellation", "GET /reservations/{id}", "GET /parks/{id}", "POST /_clock/set_current_utc"]
