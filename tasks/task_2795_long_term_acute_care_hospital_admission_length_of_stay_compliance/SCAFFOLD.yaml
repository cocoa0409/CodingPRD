scenario: |
  2795. Long-Term Acute Care Hospital Admission & Length-of-Stay Compliance (long-term acute care
  hospital): referral screening against admission criteria for prolonged mechanical ventilation and
  complex wounds, patient-level criteria for site-neutral versus standard payment, length-of-stay
  tracking against the average length-of-stay threshold, discharge payment percentage and short-stay
  outlier calculation, 25-percent rule referral source monitoring by referring hospital, weaning
  protocol progression and interdisciplinary team documentation, readmission-within-interruption-window
  recombination of stays, denial risk review and physician documentation queries

domain_name: ltch-admission-los-compliance
api_prefix: /ltch

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every URL is one or two segments
  # under /ltch (collection or collection/{id}[/action]). No deep nesting.

  state_machine_shape: cyclic
  # Referral self-loops through INFO_REQUESTED; Stay carries two independent status
  # dimensions (clinical_status x payment_review_status) and cycles
  # ADMITTED -> DISCHARGED -> ADMITTED via recombination; WeaningPlan cycles
  # PROGRESSING -> REGRESSED -> PROGRESSING; DenialRiskReview cycles
  # OPEN -> QUERIES_ISSUED -> OPEN.

  relationship_patterns:
    - one_to_many
    - self_referential        # Stay.interrupted_parent_stay_id -> Stay.id
    - cross_aggregate         # PaymentDetermination reads WeaningPlan + Referral state

  role_model: segregation_of_duties
  # Two enforced separations, both keyed on X-User-ID:
  #   (1) the analyst who priced a PaymentDetermination may not finalize it;
  #   (2) the nurse who issued a DocumentationQuery may not close it.

  consistency_model: immediate

  difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ReferringHospital
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the referring acute-care hospital.
        constraints: 1..120 chars, required
      - name: npi
        type: string
        source: input
        description: National Provider Identifier of the referring hospital.
        constraints: exactly 10 digits, unique across ReferringHospital
      - name: hospital_type
        type: enum
        source: input
        description: Referral source classification driving the referral-share threshold.
        constraints: "one of {ACUTE_CARE, CRITICAL_ACCESS}"
      - name: is_colocated
        type: boolean
        source: input
        description: True when this hospital hosts the LTCH as a hospital-within-a-hospital.
        default: false
      - name: threshold_pct
        type: number
        source: computed
        description: >-
          Referral-share ceiling for this hospital: EXPANDED_REFERRAL_THRESHOLD_PCT (50.00) when
          is_colocated is true OR hospital_type == CRITICAL_ACCESS, else
          BASE_REFERRAL_THRESHOLD_PCT (25.00). See calculations.referral_source_share.
        constraints: 2 decimal places
      - name: admissions_in_period
        type: integer
        source: computed
        description: >-
          Count of Stay rows whose cost_reporting_period_id is the single CostReportingPeriod with
          status OPEN, whose referral's referring_hospital_id is this hospital, and whose
          counts_toward_admission_threshold is true. Reset to 0 for every ReferringHospital when a
          new CostReportingPeriod is created.
        default: 0
      - name: share_pct
        type: number
        source: computed
        description: >-
          admissions_in_period / CostReportingPeriod.total_admissions * 100, rounded half-up to 2
          decimals; 0.00 when total_admissions == 0. See calculations.referral_source_share.
        default: 0.00
      - name: monitoring_state
        type: enum
        source: computed
        description: >-
          25-percent-rule posture derived from share_pct vs threshold_pct, guarded by
          MIN_ADMISSIONS_FOR_MONITORING. Gates POST /ltch/referrals/{id}/admit.
        default: COMPLIANT
        constraints: "one of {COMPLIANT, WARNING, BREACHED}"

  - name: CostReportingPeriod
    parent: null
    common_fields: true
    fields:
      - name: period_label
        type: string
        source: input
        description: Human label of the cost reporting period.
        constraints: 1..40 chars, unique
      - name: start_date
        type: string
        source: input
        description: Inclusive first calendar date (YYYY-MM-DD) of the period.
      - name: end_date
        type: string
        source: input
        description: Inclusive last calendar date (YYYY-MM-DD) of the period; must be > start_date.
      - name: status
        type: enum
        source: computed
        description: OPEN while accruing admissions and payments; CLOSED after operator close.
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: total_admissions
        type: integer
        source: computed
        description: >-
          Count of Stay rows with cost_reporting_period_id == this period and
          counts_toward_admission_threshold == true. Conserved quantity of
          calculations.referral_source_share.
        default: 0
      - name: total_payment_cents
        type: integer
        source: computed
        description: >-
          Sum of PaymentDetermination.total_payment_cents over determinations with status FINAL
          whose stay belongs to this period. Maintained incrementally by finalize (+) and void (-);
          see calculations.period_payment_rollup for the pinned rounding order.
        default: 0
      - name: final_determination_count
        type: integer
        source: computed
        description: Number of PaymentDetermination rows with status FINAL in this period.
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which status became CLOSED; null while OPEN.

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: Medical record number.
        constraints: 1..24 chars, unique across Patient
      - name: full_name
        type: string
        source: input
        description: Patient legal name.
        constraints: 1..120 chars
      - name: birth_date
        type: string
        source: input
        description: Date of birth (YYYY-MM-DD).
      - name: primary_payer
        type: enum
        source: input
        description: Payer whose payment rules apply to this patient's stays.
        constraints: "one of {MEDICARE_FFS, MEDICARE_ADVANTAGE, COMMERCIAL}"
      - name: open_referral_count
        type: integer
        source: computed
        description: >-
          Number of Referral rows for this patient whose status is in
          {RECEIVED, INFO_REQUESTED, CRITERIA_MET}. Never exceeds 1 because referral creation
          supersedes any prior open referral (see concurrency_rules.referral-create-supersede-patient).
        default: 0

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: National Provider Identifier of the physician.
        constraints: exactly 10 digits, unique across Physician
      - name: full_name
        type: string
        source: input
        description: Physician legal name.
        constraints: 1..120 chars
      - name: specialty
        type: enum
        source: input
        description: Clinical specialty of record.
        constraints: "one of {PULMONOLOGY, INFECTIOUS_DISEASE, WOUND_CARE, INTERNAL_MEDICINE}"
      - name: credential_status
        type: enum
        source: computed
        description: >-
          ACTIVE physicians may close weaning plans and answer documentation queries; SUSPENDED
          physicians may not. Toggled by POST /ltch/physicians/{id}/credential-status.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: AdmissionCriteriaSet
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Version label of the admission criteria set.
        constraints: 1..40 chars, unique
      - name: effective_from
        type: string
        source: input
        description: >-
          Inclusive first calendar date (YYYY-MM-DD) on which this set may be pinned by screening.
          Must be strictly greater than the effective_from of every ACTIVE set.
      - name: pmv_min_vent_hours
        type: integer
        source: input
        description: Minimum ventilator hours in the prior acute stay for the PMV admission track.
        constraints: 1..1000
      - name: pmv_min_icu_days
        type: integer
        source: input
        description: Minimum prior-acute ICU days for the PMV admission track.
        constraints: 0..60
      - name: wound_min_stage
        type: integer
        source: input
        description: Minimum wound stage for the COMPLEX_WOUND admission track.
        constraints: 1..4
      - name: wound_min_count
        type: integer
        source: input
        description: Minimum qualifying wound count for the COMPLEX_WOUND admission track.
        constraints: 1..20
      - name: status
        type: enum
        source: computed
        description: >-
          ACTIVE for the newest set; creating a newer set flips every older set to SUPERSEDED, which
          invalidates referrals that pinned it (ERR_CRITERIA_SET_SUPERSEDED at admit).
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"

  - name: DrgRateEntry
    parent: null
    common_fields: false
    fields:
      - name: drg_code
        type: string
        source: input
        description: MS-LTC-DRG code.
        constraints: 3..5 chars, unique across DrgRateEntry
      - name: relative_weight
        type: number
        source: input
        description: MS-LTC-DRG relative weight applied to the standard federal rate.
        constraints: "> 0, at most 4 decimal places"
      - name: alos_days
        type: integer
        source: input
        description: >-
          MS-LTC-DRG average length of stay in days; drives sso_threshold_days and the LTCH
          per-diem divisor.
        constraints: 1..120
      - name: standard_federal_rate_cents
        type: integer
        source: input
        description: LTCH PPS standard federal payment rate in whole cents.
        constraints: "> 0"
      - name: ipps_comparable_per_diem_cents
        type: integer
        source: input
        description: IPPS-comparable per-diem amount in whole cents, used by the short-stay outlier cap.
        constraints: "> 0"
      - name: ipps_comparable_full_cents
        type: integer
        source: input
        description: Full IPPS-comparable amount in whole cents; caps both SSO and site-neutral payment.
        constraints: "> 0"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the referred patient.
      - name: referring_hospital_id
        type: string
        source: input
        description: FK -> ReferringHospital.id; the source hospital counted by the 25-percent rule.
      - name: drg_rate_id
        type: string
        source: input
        description: FK -> DrgRateEntry.id; anticipated MS-LTC-DRG for this referral.
      - name: pinned_criteria_set_id
        type: string
        source: computed
        description: >-
          FK -> AdmissionCriteriaSet.id; pinned by POST /ltch/referrals/{id}/screen to the criteria
          set selected by calculations.referral_screening_evaluation. Null until first screen.
      - name: vent_hours_at_referral
        type: number
        source: input
        description: Ventilator hours accrued during the immediately preceding acute stay; null means missing.
        constraints: ">= 0 when present"
      - name: icu_days_at_referral
        type: integer
        source: input
        description: ICU days in the immediately preceding acute stay; null means missing.
        constraints: ">= 0 when present"
      - name: wound_stage
        type: integer
        source: input
        description: Highest wound stage documented at referral; null means missing.
        constraints: 0..4 when present
      - name: wound_count
        type: integer
        source: input
        description: Number of qualifying complex wounds at referral; null means missing.
        constraints: 0..20 when present
      - name: prior_acute_discharge_at
        type: datetime
        source: input
        description: ISO 8601 UTC discharge instant of the immediately preceding acute stay; null means missing.
      - name: data_complete
        type: boolean
        source: computed
        description: >-
          True when vent_hours_at_referral, icu_days_at_referral, wound_stage, wound_count and
          prior_acute_discharge_at are all non-null.
        default: false
      - name: missing_fields
        type: array
        source: computed
        description: Names of the screening inputs that were null at the most recent screen evaluation.
      - name: qualifying_track
        type: enum
        source: computed
        description: Admission track resolved by calculations.referral_screening_evaluation.
        default: NONE
        constraints: "one of {PMV, COMPLEX_WOUND, NONE}"
      - name: status
        type: enum
        source: computed
        description: Screening lifecycle; see state_machines.Referral.
        default: RECEIVED
        constraints: "one of {RECEIVED, INFO_REQUESTED, CRITERIA_MET, CRITERIA_NOT_MET, ADMITTED, WITHDRAWN, SUPERSEDED}"
      - name: screened_count
        type: integer
        source: computed
        description: Number of screen/submit-info evaluations performed on this referral.
        default: 0

  - name: Stay
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: computed
        description: FK -> Patient.id; copied from the admitting referral.
      - name: referral_id
        type: string
        source: computed
        description: FK -> Referral.id; the referral that produced this stay.
      - name: cost_reporting_period_id
        type: string
        source: computed
        description: >-
          FK -> CostReportingPeriod.id; the single period with status OPEN covering the admission
          date, selected at admit.
      - name: interrupted_parent_stay_id
        type: string
        source: computed
        description: >-
          FK -> Stay.id; set on the child stay when POST /ltch/stays/{id}/recombine folds it into an
          earlier stay of the same patient. Null otherwise.
      - name: admitted_at
        type: datetime
        source: input
        description: >-
          Admission instant, ISO 8601 UTC with three fractional digits. Optional on
          POST /ltch/referrals/{id}/admit: when omitted it defaults to the current logical instant,
          and when supplied it may be backdated for late data entry but must not be after the current
          logical instant nor before the referral's prior_acute_discharge_at.
      - name: discharged_at
        type: datetime
        source: system
        description: >-
          Logical-clock instant at discharge, or the interruption's left_at when an interruption
          window expires. Reset to null when the stay is reopened by recombination.
      - name: resumed_at
        type: datetime
        source: system
        description: Child stay's admitted_at, stamped on the parent when a recombination reopens it; null otherwise.
      - name: clinical_status
        type: enum
        source: computed
        description: Clinical dimension of the stay; see state_machines.Stay.
        default: ADMITTED
        constraints: "one of {ADMITTED, INTERRUPTED, DISCHARGED, RECOMBINED}"
      - name: payment_review_status
        type: enum
        source: computed
        description: >-
          Payment dimension of the stay, evolving independently of clinical_status: PENDING before
          any determination, PRICED while a DRAFT determination exists, FINALIZED once one is FINAL.
        default: PENDING
        constraints: "one of {PENDING, PRICED, FINALIZED}"
      - name: carried_los_days
        type: integer
        source: computed
        description: >-
          Covered days already banked from this stay's pre-recombination segment, frozen at the
          moment of recombination. See calculations.covered_los_days.
        default: 0
      - name: interruption_days_total
        type: integer
        source: computed
        description: Sum of interruption_days over this stay's InterruptionEvent rows with status RETURNED.
        default: 0
      - name: interruption_count
        type: integer
        source: computed
        description: Number of InterruptionEvent rows on this stay in any status.
        default: 0
      - name: covered_los_days
        type: integer
        source: computed
        description: Covered length of stay in days; null until discharge. See calculations.covered_los_days.
      - name: sso_threshold_days
        type: integer
        source: computed
        description: floor(SSO_ALOS_FRACTION * alos_days) of the DRG in force; null until discharge.
      - name: short_stay_outlier_applied
        type: boolean
        source: computed
        description: True when covered_los_days <= sso_threshold_days at discharge; null until discharge.
      - name: discharge_payment_pct
        type: number
        source: computed
        description: >-
          Percentage of the full MS-LTC-DRG amount payable at discharge, excluding high-cost outlier;
          see calculations.discharge_payment_percentage. Null until a determination exists.
      - name: discharge_disposition
        type: enum
        source: input
        description: Discharge destination; INTERRUPTION_EXPIRED is stamped by the system only.
        constraints: "one of {HOME, HOME_HEALTH, SNF, IRF, ACUTE_TRANSFER, EXPIRED, INTERRUPTION_EXPIRED}"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: Estimated cost of the stay in whole cents, supplied at discharge; drives the high-cost outlier.
        constraints: ">= 0"
      - name: counts_toward_admission_threshold
        type: boolean
        source: computed
        description: >-
          True while this stay counts as an admission for the 25-percent rule; set false when the
          stay is recombined into an earlier stay.
        default: true
      - name: admitted_with_override
        type: boolean
        source: computed
        description: True when admission proceeded under a compliance override of a BREACHED referral source.
        default: false
      - name: override_reason
        type: string
        source: computed
        description: Free-text justification recorded when admitted_with_override is true; null otherwise.

  - name: WeaningPlan
    parent: null
    common_fields: true
    fields:
      - name: stay_id
        type: string
        source: input
        description: FK -> Stay.id; the stay this weaning plan governs (at most one plan per stay).
      - name: closed_by_physician_id
        type: string
        source: computed
        description: FK -> Physician.id; the physician who closed the plan. Null while open.
      - name: protocol_label
        type: string
        source: input
        description: Weaning protocol identifier.
        default: STANDARD_SBT
        constraints: 1..40 chars
      - name: vent_hours_total
        type: number
        source: computed
        description: >-
          Cumulative LTCH ventilator hours: create input plus every record-sbt call's
          vent_hours_since_last. Crossing VENT_HOURS_SITE_NEUTRAL_MIN flips the payment variant.
        default: 0
      - name: current_step
        type: integer
        source: computed
        description: Weaning progression step; +1 per tolerated SBT, -1 (floor 0) on regression.
        default: 0
      - name: sbt_attempt_count
        type: integer
        source: computed
        description: Total spontaneous-breathing-trial records on this plan.
        default: 0
      - name: consecutive_failed_sbt
        type: integer
        source: computed
        description: Consecutive FAILED SBT records; reset to 0 by a TOLERATED record.
        default: 0
      - name: max_tolerated_sbt_hours
        type: number
        source: computed
        description: Longest tolerated SBT duration in hours recorded on this plan.
        default: 0
      - name: liberation_eligible
        type: boolean
        source: computed
        description: True when current_step >= PROGRESSION_STEPS_REQUIRED; required for a LIBERATED close.
        default: false
      - name: last_progression_at
        type: datetime
        source: system
        description: >-
          Logical-clock instant of the most recent TOLERATED record; null until the first one. Opens
          the interdisciplinary-documentation window each progression must satisfy.
      - name: status
        type: enum
        source: computed
        description: Weaning lifecycle; see state_machines.WeaningPlan.
        default: SBT_TRIAL
        constraints: "one of {SBT_TRIAL, PROGRESSING, REGRESSED, LIBERATED, VENT_DEPENDENT}"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the plan reached LIBERATED or VENT_DEPENDENT.

  - name: IdtNote
    parent: null
    common_fields: false
    fields:
      - name: stay_id
        type: string
        source: input
        description: FK -> Stay.id; the stay documented by this interdisciplinary-team note.
      - name: discipline
        type: enum
        source: input
        description: >-
          Documenting discipline. PHYSICIAN, NURSING, RESPIRATORY_THERAPY and CASE_MANAGEMENT are the
          four disciplines required by calculations.denial_risk_score.
        constraints: "one of {PHYSICIAN, NURSING, RESPIRATORY_THERAPY, CASE_MANAGEMENT, NUTRITION, PT_OT}"
      - name: note_text
        type: string
        source: input
        description: Narrative content of the note.
        constraints: 1..2000 chars
      - name: goals_documented
        type: boolean
        source: input
        description: True when measurable weekly goals are recorded in this note.
        default: false
      - name: documented_at
        type: datetime
        source: system
        description: Logical-clock instant at which the note was filed; append-only.
      - name: week_index
        type: integer
        source: computed
        description: floor(day_count(stay.admitted_at, documented_at) / 7); 0 for the admission week.

  - name: InterruptionEvent
    parent: null
    common_fields: true
    fields:
      - name: stay_id
        type: string
        source: input
        description: FK -> Stay.id; the stay that was interrupted.
      - name: destination
        type: enum
        source: input
        description: Where the patient went during the interruption; determines window_days.
        constraints: "one of {ACUTE_CARE, IRF, SNF, HOME}"
      - name: left_at
        type: datetime
        source: input
        description: >-
          Instant at which the patient left the LTCH. Optional on POST /ltch/stays/{id}/interrupt and
          defaults to the current logical instant when omitted; a supplied value may be backdated to
          record an interruption discovered late, but never before the stay's admitted_at or resumed_at
          and never after the current logical instant (validations priority 14).
      - name: returned_at
        type: datetime
        source: system
        description: Logical-clock instant at which the patient returned; null while status is OPEN.
      - name: window_days
        type: integer
        source: computed
        description: >-
          INTERRUPTION_WINDOW_DAYS for this destination (ACUTE_CARE 9, IRF 27, SNF 27, HOME 3).
        constraints: "one of {3, 9, 27}"
      - name: interruption_days
        type: integer
        source: computed
        description: day_count(left_at, returned_at) in whole calendar days; null while status is OPEN.
      - name: within_window
        type: boolean
        source: computed
        description: True when interruption_days <= window_days; null while status is OPEN.
      - name: status
        type: enum
        source: computed
        description: >-
          OPEN while the patient is away; RETURNED when the patient came back inside the window;
          EXPIRED when the window had already lapsed at return, which discharges the stay.
        default: OPEN
        constraints: "one of {OPEN, RETURNED, EXPIRED}"

  - name: PaymentDetermination
    parent: null
    common_fields: true
    fields:
      - name: stay_id
        type: string
        source: computed
        description: FK -> Stay.id; the priced stay.
      - name: payment_variant
        type: enum
        source: computed
        description: >-
          Variant selected by patient-level criteria; see calculations.stay_payment_determination.
        constraints: "one of {STANDARD_LTCH_PPS, SITE_NEUTRAL}"
      - name: drg_code_used
        type: string
        source: computed
        description: Snapshot of the DrgRateEntry.drg_code in force when this determination was priced.
      - name: relative_weight_used
        type: number
        source: computed
        description: Snapshot of DrgRateEntry.relative_weight at pricing time.
      - name: alos_days_used
        type: integer
        source: computed
        description: Snapshot of DrgRateEntry.alos_days at pricing time.
      - name: ipps_per_diem_used_cents
        type: integer
        source: computed
        description: Snapshot of DrgRateEntry.ipps_comparable_per_diem_cents at pricing time.
      - name: ipps_full_used_cents
        type: integer
        source: computed
        description: Snapshot of DrgRateEntry.ipps_comparable_full_cents at pricing time.
      - name: covered_los_days_used
        type: integer
        source: computed
        description: Snapshot of Stay.covered_los_days at pricing time.
      - name: full_standard_amount_cents
        type: integer
        source: computed
        description: round_half_up(standard_federal_rate_cents * relative_weight_used), whole cents.
      - name: standard_variant_amount_cents
        type: integer
        source: computed
        description: >-
          Total payable under STANDARD_LTCH_PPS including any short-stay-outlier reduction and the
          high-cost outlier add-on; always computed even when SITE_NEUTRAL is selected.
      - name: site_neutral_variant_amount_cents
        type: integer
        source: computed
        description: >-
          Total payable under SITE_NEUTRAL including the high-cost outlier add-on; always computed
          even when STANDARD_LTCH_PPS is selected.
      - name: base_payment_cents
        type: integer
        source: computed
        description: Selected variant's payment before the high-cost outlier add-on.
      - name: outlier_payment_cents
        type: integer
        source: computed
        description: High-cost outlier add-on of the selected variant; see calculations.high_cost_outlier_payment.
      - name: total_payment_cents
        type: integer
        source: computed
        description: base_payment_cents + outlier_payment_cents of the selected variant, whole cents.
      - name: discharge_payment_pct
        type: number
        source: computed
        description: >-
          round_half_up(base_payment_cents / full_standard_amount_cents * 100, 2); mirrored onto
          Stay.discharge_payment_pct.
      - name: short_stay_outlier_applied
        type: boolean
        source: computed
        description: True when covered_los_days_used <= Stay.sso_threshold_days.
      - name: status
        type: enum
        source: computed
        description: DRAFT when priced, FINAL when accepted, VOIDED when superseded or reversed.
        default: DRAFT
        constraints: "one of {DRAFT, FINAL, VOIDED}"
      - name: priced_by_user_id
        type: string
        source: computed
        description: >-
          X-User-ID of the analyst who created this determination, or the literal "SYSTEM" for the
          determination auto-created by discharge. Segregation-of-duties counterpart of
          finalized_by_user_id.
      - name: finalized_by_user_id
        type: string
        source: computed
        description: X-User-ID of the analyst who finalized this determination; null while DRAFT or VOIDED.
      - name: recalculation_reason
        type: string
        source: input
        description: Why this determination re-prices the stay; null on the discharge-created determination.
      - name: void_reason
        type: string
        source: computed
        description: Why the determination was voided (analyst reason, "SUPERSEDED" or "RECOMBINED"); null otherwise.

  - name: DenialRiskReview
    parent: null
    common_fields: true
    fields:
      - name: stay_id
        type: string
        source: computed
        description: FK -> Stay.id; the stay under denial-risk review (at most one review per stay).
      - name: as_documented_score
        type: integer
        source: computed
        description: >-
          AS_DOCUMENTED variant of calculations.denial_risk_score - the risk implied by the chart as
          filed, ignoring query responses.
        default: 0
      - name: query_adjusted_score
        type: integer
        source: computed
        description: >-
          QUERY_ADJUSTED variant of calculations.denial_risk_score - as_documented minus
          ANSWERED_QUERY_CREDIT per answered query. Null until a rescore with answered_query_count > 0.
      - name: effective_score
        type: integer
        source: computed
        description: query_adjusted_score when answered_query_count > 0, else as_documented_score.
        default: 0
      - name: risk_band
        type: enum
        source: computed
        description: HIGH when effective_score >= 70, MODERATE when >= 40, else LOW.
        default: LOW
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: missing_discipline_count
        type: integer
        source: computed
        description: >-
          Of {PHYSICIAN, NURSING, RESPIRATORY_THERAPY, CASE_MANAGEMENT}, how many have zero IdtNote
          rows on this stay.
        default: 0
      - name: answered_query_count
        type: integer
        source: computed
        description: Number of DocumentationQuery rows on this review with status in {ANSWERED, CLOSED}.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Review lifecycle; see state_machines.DenialRiskReview.
        default: OPEN
        constraints: "one of {OPEN, QUERIES_ISSUED, CLEARED, ESCALATED, VOIDED}"
      - name: opened_by_user_id
        type: string
        source: computed
        description: X-User-ID that triggered the creating cascade, or "SYSTEM".
      - name: resolved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the compliance officer who cleared or escalated; null while unresolved.
      - name: resolution_note
        type: string
        source: input
        description: Narrative recorded at resolution; null while unresolved.

  - name: DocumentationQuery
    parent: null
    common_fields: true
    fields:
      - name: denial_risk_review_id
        type: string
        source: computed
        description: FK -> DenialRiskReview.id; the review that issued this query.
      - name: stay_id
        type: string
        source: computed
        description: FK -> Stay.id; copied from the issuing review for direct filtering.
      - name: answered_by_physician_id
        type: string
        source: computed
        description: FK -> Physician.id; the physician who answered; null until answered.
      - name: query_type
        type: enum
        source: input
        description: Documentation gap the query targets.
        constraints: "one of {VENT_WEANING_RATIONALE, WOUND_STAGING, IDT_PARTICIPATION, SITE_NEUTRAL_JUSTIFICATION}"
      - name: prompt_text
        type: string
        source: input
        description: Question posed to the physician.
        constraints: 1..1000 chars
      - name: response_text
        type: string
        source: input
        description: Physician's answer; null until answered.
        constraints: 1..2000 chars when present
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which the query was issued.
      - name: due_at
        type: datetime
        source: computed
        description: issued_at + QUERY_RESPONSE_WINDOW_HOURS (72h); answering after due_at is rejected.
      - name: answered_at
        type: datetime
        source: system
        description: Logical-clock instant of the physician's answer; null until answered.
      - name: status
        type: enum
        source: computed
        description: Query lifecycle; see state_machines.DocumentationQuery.
        default: ISSUED
        constraints: "one of {ISSUED, ANSWERED, CLOSED, EXPIRED, VOIDED}"
      - name: issued_by_user_id
        type: string
        source: computed
        description: >-
          X-User-ID that caused the query to be issued (the nurse who created it, or the user whose
          discharge cascade auto-issued it). Segregation-of-duties counterpart of closed_by_user_id.
      - name: closed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the nurse who closed the answered query; null until closed.

state_machines:
  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [CRITERIA_NOT_MET, ADMITTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: INFO_REQUESTED
        trigger: "POST /ltch/referrals/{id}/screen when data_complete resolves to false"
        actor: IntakeCoordinator
        preconditions:
          - "at least one AdmissionCriteriaSet with status ACTIVE and effective_from <= current logical date exists"
        side_effects:
          - "pinned_criteria_set_id := selected criteria set id (calculations.referral_screening_evaluation)"
          - "missing_fields := names of the null screening inputs; data_complete := false"
          - "screened_count += 1"
      - from: RECEIVED
        to: CRITERIA_MET
        trigger: "POST /ltch/referrals/{id}/screen when data_complete is true and qualifying_track != NONE"
        actor: IntakeCoordinator
        preconditions:
          - "at least one AdmissionCriteriaSet with status ACTIVE and effective_from <= current logical date exists"
        side_effects:
          - "pinned_criteria_set_id := selected criteria set id; qualifying_track := PMV or COMPLEX_WOUND"
          - "data_complete := true; missing_fields := []; screened_count += 1"
      - from: RECEIVED
        to: CRITERIA_NOT_MET
        trigger: "POST /ltch/referrals/{id}/screen when data_complete is true and qualifying_track == NONE"
        actor: IntakeCoordinator
        preconditions:
          - "at least one AdmissionCriteriaSet with status ACTIVE and effective_from <= current logical date exists"
        side_effects:
          - "qualifying_track := NONE; screened_count += 1; Patient.open_referral_count -= 1"
        note: "Terminal rejection; the patient no longer holds an open referral."
      - from: INFO_REQUESTED
        to: INFO_REQUESTED
        trigger: "POST /ltch/referrals/{id}/submit-info that still leaves at least one screening input null"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == INFO_REQUESTED"
        side_effects:
          - "supplied fields are overwritten; missing_fields recomputed; screened_count += 1"
        note: "Self-loop: the cyclic shape of this machine - a referral may bounce through INFO_REQUESTED any number of times."
      - from: INFO_REQUESTED
        to: CRITERIA_MET
        trigger: "POST /ltch/referrals/{id}/submit-info that completes the data and matches a track"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == INFO_REQUESTED"
        side_effects:
          - "pinned_criteria_set_id re-selected against the current logical date; qualifying_track set; screened_count += 1"
      - from: INFO_REQUESTED
        to: CRITERIA_NOT_MET
        trigger: "POST /ltch/referrals/{id}/submit-info that completes the data with no matching track"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == INFO_REQUESTED"
        side_effects:
          - "qualifying_track := NONE; screened_count += 1; Patient.open_referral_count -= 1"
      - from: CRITERIA_MET
        to: ADMITTED
        trigger: "POST /ltch/referrals/{id}/admit"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == CRITERIA_MET"
          - "AdmissionCriteriaSet(pinned_criteria_set_id).status == ACTIVE"
          - "exactly one CostReportingPeriod has status OPEN and its start_date <= current logical date <= end_date"
          - "ReferringHospital(referring_hospital_id).monitoring_state != BREACHED, unless the admit request supplies a non-empty override_reason (validations priority 12)"
          - "the patient has no Stay whose half-open interval [admitted_at, discharged_at) contains the current logical instant"
        side_effects:
          - "creates Stay with clinical_status ADMITTED, payment_review_status PENDING, admitted_at := the supplied admitted_at or the current logical instant when omitted, counts_toward_admission_threshold := true"
          - "Patient.open_referral_count -= 1"
          - "CostReportingPeriod.total_admissions += 1"
          - "ReferringHospital(referring_hospital_id).admissions_in_period += 1"
          - "share_pct and monitoring_state recomputed for every ReferringHospital with admissions_in_period > 0 (calculations.referral_source_share)"
      - from: CRITERIA_MET
        to: WITHDRAWN
        trigger: "POST /ltch/referrals/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status in {RECEIVED, INFO_REQUESTED, CRITERIA_MET}"
        side_effects:
          - "Patient.open_referral_count -= 1"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /ltch/referrals/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status in {RECEIVED, INFO_REQUESTED, CRITERIA_MET}"
        side_effects:
          - "Patient.open_referral_count -= 1"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /ltch/referrals/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status in {RECEIVED, INFO_REQUESTED, CRITERIA_MET}"
        side_effects:
          - "Patient.open_referral_count -= 1"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "system: POST /ltch/referrals creates a newer referral for the same patient"
        actor: system
        preconditions:
          - "the new referral's expected_patient_version matches Patient.version"
        side_effects:
          - "prior referral status := SUPERSEDED; Patient.open_referral_count stays at 1 (decrement for the superseded referral, increment for the new one)"
        note: "Create-with-supersede; the race is resolved by concurrency_rules.referral-create-supersede-patient."
      - from: INFO_REQUESTED
        to: SUPERSEDED
        trigger: "system: POST /ltch/referrals creates a newer referral for the same patient"
        actor: system
        preconditions:
          - "the new referral's expected_patient_version matches Patient.version"
        side_effects:
          - "prior referral status := SUPERSEDED; Patient.open_referral_count net unchanged"
      - from: CRITERIA_MET
        to: SUPERSEDED
        trigger: "system: POST /ltch/referrals creates a newer referral for the same patient"
        actor: system
        preconditions:
          - "the new referral's expected_patient_version matches Patient.version"
        side_effects:
          - "prior referral status := SUPERSEDED; Patient.open_referral_count net unchanged"

  - entity: Stay
    initial_state: ADMITTED
    terminal_states: [RECOMBINED]
    transitions:
      - from: ADMITTED
        to: INTERRUPTED
        trigger: "POST /ltch/stays/{id}/interrupt"
        actor: UtilizationReviewNurse
        preconditions:
          - "stay.clinical_status == ADMITTED"
          - "stay.interruption_count < MAX_INTERRUPTIONS_PER_STAY (3)"
          - "current logical instant > (latest RETURNED interruption's returned_at + INTERRUPTION_BUFFER_HOURS) - STRICTLY after, so exactly 24h later is refused (validations priority 15)"
          - "CostReportingPeriod(stay.cost_reporting_period_id).status == OPEN"
        side_effects:
          - "creates InterruptionEvent with status OPEN, left_at := the supplied left_at or the current logical instant when omitted, window_days from destination"
          - "stay.interruption_count += 1"
      - from: INTERRUPTED
        to: ADMITTED
        trigger: "POST /ltch/interruptions/{id}/return when interruption_days <= window_days"
        actor: UtilizationReviewNurse
        preconditions:
          - "interruption.status == OPEN and stay.clinical_status == INTERRUPTED"
        side_effects:
          - "interruption.status := RETURNED, returned_at := now, interruption_days and within_window computed"
          - "stay.interruption_days_total += interruption.interruption_days"
        note: "Cycle: a stay may leave and re-enter ADMITTED up to three times."
      - from: INTERRUPTED
        to: DISCHARGED
        trigger: "POST /ltch/interruptions/{id}/return when interruption_days > window_days"
        actor: UtilizationReviewNurse
        preconditions:
          - "interruption.status == OPEN and stay.clinical_status == INTERRUPTED"
        side_effects:
          - "interruption.status := EXPIRED, within_window := false"
          - "stay.discharged_at := interruption.left_at; discharge_disposition := INTERRUPTION_EXPIRED"
          - "covered_los_days, sso_threshold_days, short_stay_outlier_applied computed (calculations.covered_los_days)"
          - "cascade link 2: because the stay became DISCHARGED, a PaymentDetermination is created with status DRAFT and priced_by_user_id 'SYSTEM'"
          - "cascade link 3: because a determination now exists, a DenialRiskReview is opened (or rescored) with as_documented_score"
          - "cascade link 4: because the review's risk_band is HIGH, a DocumentationQuery of type IDT_PARTICIPATION is auto-issued"
        note: "estimated_cost_cents stays null here, so the outlier add-on is 0 for window-expiry discharges."
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /ltch/stays/{id}/discharge"
        actor: UtilizationReviewNurse
        preconditions:
          - "stay.clinical_status == ADMITTED"
          - "no InterruptionEvent on this stay has status OPEN"
          - "if a WeaningPlan exists for this stay, its status is LIBERATED or VENT_DEPENDENT"
          - "CostReportingPeriod(stay.cost_reporting_period_id).status == OPEN"
        side_effects:
          - "discharged_at := current logical instant; discharge_disposition and estimated_cost_cents stored"
          - "covered_los_days, sso_threshold_days, short_stay_outlier_applied computed"
          - "cascade link 2: because the stay became DISCHARGED, a PaymentDetermination (DRAFT, priced_by_user_id 'SYSTEM') is created and stay.payment_review_status := PRICED; discharge_payment_pct mirrored onto the stay"
          - "cascade link 3: because the determination was created, a DenialRiskReview is opened with as_documented_score and risk_band"
          - "cascade link 4: because risk_band == HIGH, a DocumentationQuery of type IDT_PARTICIPATION is auto-issued and the review moves to QUERIES_ISSUED"
      - from: DISCHARGED
        to: ADMITTED
        trigger: "system: POST /ltch/stays/{id}/recombine names this stay as interrupted_parent_stay_id"
        actor: system
        preconditions:
          - "parent.clinical_status == DISCHARGED"
          - "day_count(parent.discharged_at, child.admitted_at) <= RECOMBINATION_WINDOW_DAYS (3)"
          - "child.patient_id == parent.patient_id and child.cost_reporting_period_id == parent.cost_reporting_period_id"
        side_effects:
          - "carried_los_days := day_count(admitted_at, discharged_at); resumed_at := child.admitted_at; discharged_at := null; discharge_disposition := null"
          - "payment_review_status := PENDING"
          - "cascade link 2: because the parent reverted to PENDING, every PaymentDetermination on it in {DRAFT, FINAL} becomes VOIDED with void_reason 'RECOMBINED'"
          - "cascade link 3: because a FINAL determination was voided, CostReportingPeriod.total_payment_cents -= that determination's total_payment_cents and final_determination_count -= 1"
          - "cascade link 3b: because the determinations were voided, the parent's DenialRiskReview (if non-terminal) becomes VOIDED and its ISSUED/ANSWERED queries become VOIDED"
        note: "Cycle ADMITTED -> DISCHARGED -> ADMITTED; the reopened stay is discharged again later with combined LOS."
      - from: ADMITTED
        to: RECOMBINED
        trigger: "POST /ltch/stays/{id}/recombine (this stay is the child being folded in)"
        actor: UtilizationReviewNurse
        preconditions:
          - "child.clinical_status == ADMITTED and child.payment_review_status == PENDING"
          - "child has no InterruptionEvent with status OPEN"
          - "parent stay exists, is DISCHARGED, same patient, same period, within RECOMBINATION_WINDOW_DAYS"
        side_effects:
          - "interrupted_parent_stay_id := parent_stay_id; counts_toward_admission_threshold := false"
          - "cascade link 1b: because the child stopped counting, ReferringHospital.admissions_in_period -= 1 and CostReportingPeriod.total_admissions -= 1"
          - "cascade link 1c: because the denominator changed, share_pct and monitoring_state are recomputed for every ReferringHospital with admissions_in_period > 0"
        note: "Terminal for the child stay; no further clinical transitions are possible."

  - entity: Stay
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: PRICED
        trigger: "system: a PaymentDetermination with status DRAFT is created for this stay"
        actor: system
        preconditions:
          - "stay.clinical_status == DISCHARGED"
        side_effects:
          - "stay.discharge_payment_pct := determination.discharge_payment_pct"
        note: "payment_review_status is a second, independent status dimension on the same Stay row; it advances while clinical_status stays DISCHARGED."
      - from: PRICED
        to: FINALIZED
        trigger: "POST /ltch/payment-determinations/{id}/finalize"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "determination.status == DRAFT and determination.stay_id == this stay"
          - "no DocumentationQuery on this stay has status ISSUED"
          - "CostReportingPeriod(stay.cost_reporting_period_id).status == OPEN"
          - "X-User-ID != determination.priced_by_user_id"
        side_effects:
          - "CostReportingPeriod.total_payment_cents += determination.total_payment_cents; final_determination_count += 1"
      - from: FINALIZED
        to: PENDING
        trigger: "POST /ltch/payment-determinations/{id}/void on a FINAL determination"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "determination.status == FINAL"
          - "CostReportingPeriod(stay.cost_reporting_period_id).status == OPEN"
        side_effects:
          - "CostReportingPeriod.total_payment_cents -= determination.total_payment_cents; final_determination_count -= 1"
        note: "Compensating action of the FINALIZED transition; the period ledger must return to its pre-finalize value exactly."
      - from: PRICED
        to: PENDING
        trigger: "POST /ltch/payment-determinations/{id}/void on the stay's only DRAFT determination"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "determination.status == DRAFT and no other determination on the stay is DRAFT or FINAL"
        side_effects:
          - "stay.discharge_payment_pct := null"

  - entity: WeaningPlan
    initial_state: SBT_TRIAL
    terminal_states: [LIBERATED, VENT_DEPENDENT]
    transitions:
      - from: SBT_TRIAL
        to: PROGRESSING
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome TOLERATED"
        actor: UtilizationReviewNurse
        preconditions:
          - "plan.status in {SBT_TRIAL, PROGRESSING, REGRESSED}"
          - "at least one IdtNote with discipline RESPIRATORY_THERAPY and one with discipline PHYSICIAN on this stay whose documented_at >= (plan.last_progression_at, or plan.created_at when last_progression_at is null)"
        side_effects:
          - "current_step += 1; sbt_attempt_count += 1; consecutive_failed_sbt := 0"
          - "vent_hours_total += vent_hours_since_last; max_tolerated_sbt_hours := max(previous, sbt_hours)"
          - "last_progression_at := current logical instant; liberation_eligible := current_step >= PROGRESSION_STEPS_REQUIRED (2)"
      - from: PROGRESSING
        to: PROGRESSING
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome TOLERATED"
        actor: UtilizationReviewNurse
        preconditions:
          - "fresh RESPIRATORY_THERAPY and PHYSICIAN IdtNote rows exist on or after last_progression_at"
        side_effects:
          - "same as the SBT_TRIAL -> PROGRESSING effects; the documentation window restarts at the new last_progression_at"
      - from: PROGRESSING
        to: REGRESSED
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome FAILED reaching consecutive_failed_sbt >= 2"
        actor: UtilizationReviewNurse
        preconditions:
          - "plan.status in {SBT_TRIAL, PROGRESSING, REGRESSED}"
        side_effects:
          - "sbt_attempt_count += 1; consecutive_failed_sbt += 1; vent_hours_total += vent_hours_since_last"
          - "current_step := max(0, current_step - 1); liberation_eligible := current_step >= PROGRESSION_STEPS_REQUIRED"
      - from: REGRESSED
        to: PROGRESSING
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome TOLERATED"
        actor: UtilizationReviewNurse
        preconditions:
          - "fresh RESPIRATORY_THERAPY and PHYSICIAN IdtNote rows exist on or after last_progression_at (or plan.created_at)"
        side_effects:
          - "current_step += 1; consecutive_failed_sbt := 0; vent_hours_total += vent_hours_since_last; last_progression_at := now"
        note: "Cycle PROGRESSING -> REGRESSED -> PROGRESSING; weaning may oscillate indefinitely."
      - from: SBT_TRIAL
        to: SBT_TRIAL
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome FAILED while consecutive_failed_sbt would stay below 2"
        actor: UtilizationReviewNurse
        preconditions:
          - "plan.status in {SBT_TRIAL, PROGRESSING, REGRESSED}"
        side_effects:
          - "sbt_attempt_count += 1; consecutive_failed_sbt += 1; vent_hours_total += vent_hours_since_last"
        note: "A single failure does not regress the plan; only the second consecutive failure does."
      - from: PROGRESSING
        to: PROGRESSING
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome FAILED while consecutive_failed_sbt would stay below 2"
        actor: UtilizationReviewNurse
        preconditions:
          - "plan.status in {SBT_TRIAL, PROGRESSING, REGRESSED}"
        side_effects:
          - "sbt_attempt_count += 1; consecutive_failed_sbt += 1; vent_hours_total += vent_hours_since_last"
      - from: SBT_TRIAL
        to: REGRESSED
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome FAILED reaching consecutive_failed_sbt >= 2"
        actor: UtilizationReviewNurse
        preconditions:
          - "plan.status in {SBT_TRIAL, PROGRESSING, REGRESSED}"
        side_effects:
          - "sbt_attempt_count += 1; consecutive_failed_sbt += 1; vent_hours_total += vent_hours_since_last"
          - "current_step := max(0, current_step - 1) - already 0 for a plan that never progressed"
        note: "A plan that fails twice before ever progressing regresses exactly like one that had progressed; this keeps the FAILED path total from every non-terminal state."
      - from: REGRESSED
        to: REGRESSED
        trigger: "POST /ltch/weaning-plans/{id}/record-sbt with outcome FAILED"
        actor: UtilizationReviewNurse
        preconditions:
          - "plan.status in {SBT_TRIAL, PROGRESSING, REGRESSED}"
        side_effects:
          - "sbt_attempt_count += 1; consecutive_failed_sbt += 1; vent_hours_total += vent_hours_since_last; current_step := max(0, current_step - 1)"
      - from: PROGRESSING
        to: LIBERATED
        trigger: "POST /ltch/weaning-plans/{id}/close with outcome LIBERATED"
        actor: AttendingPhysician
        preconditions:
          - "plan.liberation_eligible == true"
          - "Physician(X-User-ID).credential_status == ACTIVE"
        side_effects:
          - "closed_by_physician_id := X-User-ID; closed_at := now"
      - from: SBT_TRIAL
        to: VENT_DEPENDENT
        trigger: "POST /ltch/weaning-plans/{id}/close with outcome VENT_DEPENDENT"
        actor: AttendingPhysician
        preconditions:
          - "Physician(X-User-ID).credential_status == ACTIVE"
        side_effects:
          - "closed_by_physician_id := X-User-ID; closed_at := now"
        note: "Permitted with fewer than MIN_SBT_ATTEMPTS_FOR_VENT_DEPENDENT (3) attempts, but that gap adds WEANING_GAP_WEIGHT to the denial-risk score."
      - from: REGRESSED
        to: VENT_DEPENDENT
        trigger: "POST /ltch/weaning-plans/{id}/close with outcome VENT_DEPENDENT"
        actor: AttendingPhysician
        preconditions:
          - "Physician(X-User-ID).credential_status == ACTIVE"
        side_effects:
          - "closed_by_physician_id := X-User-ID; closed_at := now"
      - from: PROGRESSING
        to: VENT_DEPENDENT
        trigger: "POST /ltch/weaning-plans/{id}/close with outcome VENT_DEPENDENT"
        actor: AttendingPhysician
        preconditions:
          - "Physician(X-User-ID).credential_status == ACTIVE"
        side_effects:
          - "closed_by_physician_id := X-User-ID; closed_at := now"

  - entity: InterruptionEvent
    initial_state: OPEN
    terminal_states: [RETURNED, EXPIRED]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /ltch/interruptions/{id}/return with day_count(left_at, now) <= window_days"
        actor: UtilizationReviewNurse
        preconditions:
          - "interruption.status == OPEN"
          - "current logical instant >= left_at"
        side_effects:
          - "returned_at := now; interruption_days := day_count(left_at, returned_at); within_window := true"
          - "stay.clinical_status := ADMITTED; stay.interruption_days_total += interruption_days"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /ltch/interruptions/{id}/return with day_count(left_at, now) > window_days"
        actor: UtilizationReviewNurse
        preconditions:
          - "interruption.status == OPEN"
          - "current logical instant >= left_at"
        side_effects:
          - "returned_at := now; interruption_days := day_count(left_at, returned_at); within_window := false"
          - "stay is discharged retroactively at left_at with disposition INTERRUPTION_EXPIRED, triggering the discharge cascade"

  - entity: PaymentDetermination
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /ltch/payment-determinations/{id}/finalize"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "determination.status == DRAFT"
          - "Stay(stay_id).clinical_status == DISCHARGED"
          - "no DocumentationQuery on Stay(stay_id) has status ISSUED"
          - "CostReportingPeriod of the stay has status OPEN"
          - "X-User-ID != priced_by_user_id (segregation of duties)"
        side_effects:
          - "finalized_by_user_id := X-User-ID"
          - "Stay.payment_review_status := FINALIZED"
          - "CostReportingPeriod.total_payment_cents += total_payment_cents; final_determination_count += 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /ltch/payment-determinations/{id}/void"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "determination.status == DRAFT"
          - "CostReportingPeriod of the stay has status OPEN"
        side_effects:
          - "void_reason := supplied reason; Stay.payment_review_status := PENDING when no other DRAFT or FINAL determination remains"
      - from: DRAFT
        to: VOIDED
        trigger: "system: POST /ltch/stays/{id}/payment-determinations supersedes this draft"
        actor: system
        preconditions:
          - "the superseding request carries a matching expected_stay_version"
        side_effects:
          - "void_reason := 'SUPERSEDED'"
        note: "Create-with-supersede; guarded by concurrency_rules.determination-create-supersede-stay."
      - from: FINAL
        to: VOIDED
        trigger: "POST /ltch/payment-determinations/{id}/void"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "determination.status == FINAL"
          - "CostReportingPeriod of the stay has status OPEN"
        side_effects:
          - "void_reason := supplied reason; Stay.payment_review_status := PENDING"
          - "CostReportingPeriod.total_payment_cents -= total_payment_cents; final_determination_count -= 1"
      - from: FINAL
        to: VOIDED
        trigger: "system: the stay is reopened by POST /ltch/stays/{id}/recombine"
        actor: system
        preconditions:
          - "the parent stay transitions DISCHARGED -> ADMITTED"
        side_effects:
          - "void_reason := 'RECOMBINED'; CostReportingPeriod.total_payment_cents -= total_payment_cents; final_determination_count -= 1"
          - "the stay's DenialRiskReview and its open queries are voided in turn"

  - entity: DenialRiskReview
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: QUERIES_ISSUED
        trigger: "POST /ltch/denial-risk-reviews/{id}/documentation-queries, or the auto-issue link of the discharge cascade"
        actor: UtilizationReviewNurse
        preconditions:
          - "review.status in {OPEN, QUERIES_ISSUED}"
          - "Stay(stay_id).clinical_status == DISCHARGED"
        side_effects:
          - "creates DocumentationQuery with status ISSUED, issued_at := now, due_at := now + 72h, issued_by_user_id := X-User-ID"
      - from: QUERIES_ISSUED
        to: OPEN
        trigger: "POST /ltch/denial-risk-reviews/{id}/rescore once no query remains in status ISSUED"
        actor: UtilizationReviewNurse
        preconditions:
          - "review.status == QUERIES_ISSUED"
        side_effects:
          - "every ISSUED query whose due_at < now becomes EXPIRED"
          - "as_documented_score and query_adjusted_score recomputed; effective_score and risk_band refreshed"
        note: "Cycle OPEN -> QUERIES_ISSUED -> OPEN; a review may issue several rounds of queries."
      - from: OPEN
        to: CLEARED
        trigger: "POST /ltch/denial-risk-reviews/{id}/resolve with outcome CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == OPEN"
          - "review.risk_band != HIGH"
          - "no DocumentationQuery on this review has status ISSUED"
        side_effects:
          - "resolved_by_user_id := X-User-ID; resolution_note stored"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /ltch/denial-risk-reviews/{id}/resolve with outcome ESCALATED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status in {OPEN, QUERIES_ISSUED}"
        side_effects:
          - "resolved_by_user_id := X-User-ID; resolution_note stored"
      - from: QUERIES_ISSUED
        to: ESCALATED
        trigger: "POST /ltch/denial-risk-reviews/{id}/resolve with outcome ESCALATED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status in {OPEN, QUERIES_ISSUED}"
        side_effects:
          - "resolved_by_user_id := X-User-ID; resolution_note stored"
      - from: OPEN
        to: VOIDED
        trigger: "system: the reviewed stay is reopened by recombination"
        actor: system
        preconditions:
          - "the stay's determinations were voided with void_reason 'RECOMBINED'"
        side_effects:
          - "every DocumentationQuery on this review in {ISSUED, ANSWERED} becomes VOIDED"
      - from: QUERIES_ISSUED
        to: VOIDED
        trigger: "system: the reviewed stay is reopened by recombination"
        actor: system
        preconditions:
          - "the stay's determinations were voided with void_reason 'RECOMBINED'"
        side_effects:
          - "every DocumentationQuery on this review in {ISSUED, ANSWERED} becomes VOIDED"
      - from: CLEARED
        to: VOIDED
        trigger: "system: the reviewed stay is reopened by recombination"
        actor: system
        preconditions:
          - "the stay's determinations were voided with void_reason 'RECOMBINED'"
        side_effects:
          - "every DocumentationQuery on this review in {ISSUED, ANSWERED} becomes VOIDED"
        note: "A resolved review is NOT immune to recombination: validation priority 22 forces a review to be CLEARED or ESCALATED before its determination can be finalized, so every FINAL determination that recombination has to unwind necessarily hangs off a resolved review. VOIDED is therefore the only true terminal state of this machine."
      - from: ESCALATED
        to: VOIDED
        trigger: "system: the reviewed stay is reopened by recombination"
        actor: system
        preconditions:
          - "the stay's determinations were voided with void_reason 'RECOMBINED'"
        side_effects:
          - "every DocumentationQuery on this review in {ISSUED, ANSWERED} becomes VOIDED"

  - entity: DocumentationQuery
    initial_state: ISSUED
    terminal_states: [CLOSED, EXPIRED, VOIDED]
    transitions:
      - from: ISSUED
        to: ANSWERED
        trigger: "POST /ltch/documentation-queries/{id}/answer"
        actor: AttendingPhysician
        preconditions:
          - "query.status == ISSUED"
          - "current logical instant <= due_at"
          - "Physician(X-User-ID).credential_status == ACTIVE"
        side_effects:
          - "answered_by_physician_id := X-User-ID; answered_at := now; response_text stored"
          - "DenialRiskReview.answered_query_count += 1"
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /ltch/documentation-queries/{id}/close"
        actor: UtilizationReviewNurse
        preconditions:
          - "query.status == ANSWERED"
          - "X-User-ID != issued_by_user_id (segregation of duties)"
        side_effects:
          - "closed_by_user_id := X-User-ID"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /ltch/denial-risk-reviews/{id}/rescore observes due_at < now"
        actor: system
        preconditions:
          - "query.status == ISSUED and due_at < current logical instant"
        side_effects:
          - "the query stops blocking payment finalization but keeps the review out of CLEARED unless rescored below HIGH"
      - from: ISSUED
        to: VOIDED
        trigger: "system: the query's review is voided by recombination"
        actor: system
        preconditions:
          - "DenialRiskReview.status becomes VOIDED"
        side_effects:
          - "no further transitions are possible"
      - from: ANSWERED
        to: VOIDED
        trigger: "system: the query's review is voided by recombination"
        actor: system
        preconditions:
          - "DenialRiskReview.status becomes VOIDED"
        side_effects:
          - "DenialRiskReview.answered_query_count is irrelevant once the review is VOIDED"

  - entity: CostReportingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /ltch/cost-reporting-periods/{id}/recompute-referral-shares"
        actor: ComplianceOfficer
        preconditions:
          - "period.status == OPEN"
        side_effects:
          - "share_pct, threshold_pct and monitoring_state recomputed for every ReferringHospital from the period's current total_admissions"
        note: "Idempotent operator sweep; recomputation from stored counters must agree with the incremental values maintained at admit."
      - from: OPEN
        to: CLOSED
        trigger: "POST /ltch/cost-reporting-periods/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "period.status == OPEN"
          - "every Stay in this period with clinical_status DISCHARGED has a PaymentDetermination with status FINAL"
        side_effects:
          - "status := CLOSED; closed_at := now"
          - "share_pct and monitoring_state recomputed one final time for every ReferringHospital"
          - "all further mutations on stays, determinations, notes and interruptions of this period are rejected with ERR_PERIOD_CLOSED"

concurrency_rules:
  - rule_id: determination-create-supersede-stay
    parent_entity: Stay
    write_endpoint: "POST /ltch/stays/{id}/payment-determinations"
    occ_field: "expected_stay_version"
    description: |
      Creating a re-priced PaymentDetermination against a Stay whose version has advanced since the
      analyst last observed it is rejected with a stale-version error. The product deliberately lets
      a new determination supersede the stay's existing DRAFT (void_reason 'SUPERSEDED'), so a writer
      holding an out-of-date view of the stay would otherwise silently discard a determination it
      never saw - including one produced by the discharge cascade or by an earlier re-price.
    error_id: ERR_STALE_STAY_VERSION
    http_status: 412
  - rule_id: referral-create-supersede-patient
    parent_entity: Patient
    write_endpoint: "POST /ltch/referrals"
    occ_field: "expected_patient_version"
    description: |
      Creating a Referral for a Patient whose version has advanced since the intake coordinator last
      observed it is rejected with a stale-version error. Referral creation legitimately supersedes
      any prior open referral for that patient (status SUPERSEDED), so a stale writer would cancel a
      referral it never observed; the version check turns that into a deterministic rejection.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

calculations:
  # Shared helpers used by every formula below.
  #   day_count(a, b)      = (utc_calendar_date(b) - utc_calendar_date(a)) in whole days; the
  #                          later day is NOT counted (a discharge on the admission date is 0 days).
  #   round_half_up(x)     = nearest whole cent, ties away from zero.
  #   round_half_up(x, 2)  = nearest 0.01, ties away from zero.
  #   "the DRG in force"   = DrgRateEntry(override_drg_rate_id) when the pricing request supplied
  #                          one, else DrgRateEntry(Referral(stay.referral_id).drg_rate_id).

  - name: referral_screening_evaluation
    trigger: "POST /ltch/referrals/{id}/screen and POST /ltch/referrals/{id}/submit-info"
    algorithm: threshold
    formula: |
      # (1) criteria-set selector - explicit eligibility, ranking, tie-break, empty fallback
      candidates = AdmissionCriteriaSet rows with status == ACTIVE
                   AND effective_from <= utc_calendar_date(current logical instant)
      ranked     = candidates ORDER BY effective_from DESC, created_at DESC
      if ranked is empty: reject with ERR_NO_EFFECTIVE_CRITERIA_SET
      cs = ranked[0]
      referral.pinned_criteria_set_id = cs.id

      # (2) completeness
      required_inputs = [vent_hours_at_referral, icu_days_at_referral, wound_stage,
                         wound_count, prior_acute_discharge_at]
      missing_fields = names of required_inputs that are null
      data_complete  = (missing_fields == [])
      if not data_complete:
          status = INFO_REQUESTED; qualifying_track = NONE; return

      # (3) track resolution - PMV wins over COMPLEX_WOUND when both match
      pmv_met   = vent_hours_at_referral >= cs.pmv_min_vent_hours
                  AND icu_days_at_referral >= cs.pmv_min_icu_days
      wound_met = wound_stage >= cs.wound_min_stage AND wound_count >= cs.wound_min_count
      qualifying_track = PMV          if pmv_met
                    else COMPLEX_WOUND if wound_met
                    else NONE
      status = CRITERIA_MET if qualifying_track != NONE else CRITERIA_NOT_MET
    input_set: >-
      Exactly one AdmissionCriteriaSet (status ACTIVE, effective_from on or before the current
      logical date, newest effective_from wins, created_at DESC breaks ties). Referral field values
      as of this call, including any values just supplied by submit-info.
    constants:
      PMV_TRACK_PRECEDENCE: "PMV is evaluated before COMPLEX_WOUND"
    precision: "integer comparisons; vent_hours_at_referral compared as a decimal number"
    variants:
      - name: initial_screen
        when: "POST /ltch/referrals/{id}/screen on a RECEIVED referral"
        difference: "pins pinned_criteria_set_id for the first time"
      - name: rescreen_after_info
        when: "POST /ltch/referrals/{id}/submit-info on an INFO_REQUESTED referral"
        difference: >-
          re-selects the criteria set against the CURRENT logical date, so a referral that bounced
          through INFO_REQUESTED after a new criteria set took effect is judged by the newer set

  - name: covered_los_days
    trigger: "Stay ADMITTED -> DISCHARGED and INTERRUPTED -> DISCHARGED transitions"
    algorithm: interval_merge
    formula: |
      segment_start = stay.resumed_at if stay.resumed_at is not null else stay.admitted_at
      segment_days  = day_count(segment_start, stay.discharged_at)
      covered_los_days   = stay.carried_los_days + segment_days - stay.interruption_days_total
      sso_threshold_days = floor(SSO_ALOS_FRACTION * drg.alos_days)     # 5/6, floored
      short_stay_outlier_applied = (covered_los_days <= sso_threshold_days)
    input_set: >-
      carried_los_days (0 unless a recombination froze an earlier segment), the current segment
      [segment_start, discharged_at) as whole calendar days, minus interruption_days_total which sums
      interruption_days over this stay's InterruptionEvent rows with status RETURNED only (OPEN and
      EXPIRED interruptions contribute 0).
    constants:
      SSO_ALOS_FRACTION: 0.8333333333333334   # exactly 5/6 before flooring
    precision: "whole days; floor() on the SSO threshold, never round"

  - name: stay_payment_determination
    trigger: >-
      Determination creation - the discharge cascade (Stay -> DISCHARGED) and
      POST /ltch/stays/{id}/payment-determinations
    algorithm: tiered_pricing
    formula: |
      drg = the DRG in force
      los = stay.covered_los_days
      full_standard_amount_cents = round_half_up(drg.standard_federal_rate_cents * drg.relative_weight)
      cost = COALESCE(stay.estimated_cost_cents, 0)

      # ---- step 1: patient-level variant selection ----
      referral = Referral(stay.referral_id)
      plan     = the WeaningPlan with stay_id == stay.id, or null
      vent_qualifies = (plan is not null AND plan.vent_hours_total >= VENT_HOURS_SITE_NEUTRAL_MIN)
      icu_qualifies  = (referral.icu_days_at_referral >= ICU_DAYS_SITE_NEUTRAL_MIN)
      prior_acute    = (referral.prior_acute_discharge_at is not null)
      payment_variant = STANDARD_LTCH_PPS if (prior_acute AND (vent_qualifies OR icu_qualifies))
                        else SITE_NEUTRAL

      # ---- step 2: STANDARD base - nested min over three candidates, branching on the SSO flag ----
      if stay.short_stay_outlier_applied:
          per_diem_component = round_half_up(full_standard_amount_cents / drg.alos_days * los)
          # ^ ONE rounding, applied to the whole product; never round the per-diem quotient first
          a = min(full_standard_amount_cents, per_diem_component)
          b = round_half_up(drg.ipps_comparable_per_diem_cents * los * SSO_IPPS_PER_DIEM_FACTOR)
          c = drg.ipps_comparable_full_cents
          standard_base_cents = min(a, b, c)
      else:
          standard_base_cents = full_standard_amount_cents

      # ---- step 3: SITE_NEUTRAL base ----
      site_neutral_base_cents = min(drg.ipps_comparable_full_cents, cost)

      # ---- step 4: both variants are always computed and stored ----
      standard_variant_amount_cents     = standard_base_cents     + outlier(standard_base_cents)
      site_neutral_variant_amount_cents = site_neutral_base_cents + outlier(site_neutral_base_cents)
      # outlier(...) is calculations.high_cost_outlier_payment

      # ---- step 5: selection ----
      base_payment_cents    = standard_base_cents if payment_variant == STANDARD_LTCH_PPS
                              else site_neutral_base_cents
      outlier_payment_cents = outlier(base_payment_cents)
      total_payment_cents   = base_payment_cents + outlier_payment_cents
    input_set: >-
      The stay's covered_los_days and estimated_cost_cents at determination time, the DRG in force
      (snapshotted onto the determination as drg_code_used / relative_weight_used / alos_days_used /
      ipps_per_diem_used_cents / ipps_full_used_cents), the admitting referral's
      icu_days_at_referral and prior_acute_discharge_at, and the stay's WeaningPlan vent_hours_total
      (null plan contributes no vent qualification).
    constants:
      VENT_HOURS_SITE_NEUTRAL_MIN: 96
      ICU_DAYS_SITE_NEUTRAL_MIN: 3
      SSO_IPPS_PER_DIEM_FACTOR: 1.20
    precision: "whole cents, round_half_up; percentages to 2 decimals"
    variants:
      - name: STANDARD_LTCH_PPS
        when: >-
          the referral records a prior acute discharge AND (icu_days_at_referral >= 3 OR the stay's
          weaning plan accumulated vent_hours_total >= 96)
        difference: >-
          pays the full MS-LTC-DRG amount, reduced to min(LTCH per-diem product capped at the full
          amount, 120% of the IPPS-comparable per diem, the full IPPS-comparable amount) when the
          stay is a short-stay outlier
      - name: SITE_NEUTRAL
        when: "the patient-level criteria above are not met"
        difference: >-
          pays min(full IPPS-comparable amount, estimated cost) and ignores the LTCH per-diem and
          the 120% IPPS cap entirely, so identical stay data yields a different number than the
          STANDARD variant computed on the same row

  - name: high_cost_outlier_payment
    trigger: "Called twice per determination (once per variant) inside stay_payment_determination"
    algorithm: threshold
    formula: |
      outlier(base_cents):
        # PINNED EVALUATION ORDER - the add-on must never re-enter its own threshold.
        step 1: threshold_cents = base_cents + FIXED_LOSS_AMOUNT_CENTS
        step 2: excess_cents    = COALESCE(stay.estimated_cost_cents, 0) - threshold_cents
        step 3: return 0 if excess_cents <= 0
                else round_half_up(OUTLIER_MARGINAL_COST_FACTOR * excess_cents)
      # The circular reading - threshold_cents = base + outlier + FIXED_LOSS, solved as a fixed
      # point - is FORBIDDEN. For base 6,000,000 and cost 12,000,000 the pinned order yields
      # 2,400,000 while the fixed point yields 1,333,333; only 2,400,000 is correct.
    input_set: "The variant's base payment and the stay's estimated_cost_cents (null treated as 0)."
    constants:
      FIXED_LOSS_AMOUNT_CENTS: 3000000
      OUTLIER_MARGINAL_COST_FACTOR: 0.80
    precision: "whole cents, round_half_up; result floored at 0"

  - name: discharge_payment_percentage
    trigger: "Determination creation; mirrored onto Stay.discharge_payment_pct"
    algorithm: aggregation
    formula: |
      discharge_payment_pct = round_half_up(base_payment_cents / full_standard_amount_cents * 100, 2)
      # base_payment_cents EXCLUDES outlier_payment_cents, so the percentage never exceeds 100.00
      # for a full-LOS standard stay and reads 100.00 exactly when no SSO reduction applied.
    input_set: "The selected variant's base payment and the full MS-LTC-DRG amount of the DRG in force."
    constants:
      PCT_SCALE: 100
    precision: "2 decimal places, round_half_up"

  - name: denial_risk_score
    trigger: >-
      DenialRiskReview creation inside the discharge cascade, re-pricing, and
      POST /ltch/denial-risk-reviews/{id}/rescore
    algorithm: weighted_scoring
    formula: |
      required_disciplines = {PHYSICIAN, NURSING, RESPIRATORY_THERAPY, CASE_MANAGEMENT}
      missing_discipline_count = count of d in required_disciplines having zero IdtNote rows
                                 with stay_id == review.stay_id and discipline == d
      plan = the WeaningPlan with stay_id == review.stay_id, or null
      weaning_gap = 1 if (plan is null
                          OR (plan.status == VENT_DEPENDENT AND plan.max_tolerated_sbt_hours == 0))
                    else 0
      # A stay with no weaning plan at all, and a ventilator-dependent stay that never tolerated a
      # single trial, are the two documented weaning gaps. (A VENT_DEPENDENT close always has
      # sbt_attempt_count >= 3 - validations priority 18 - so attempt count cannot be the gap.)
      det = the stay's PaymentDetermination with status in {DRAFT, FINAL} (at most one exists)
      sso_flag          = 1 if det.short_stay_outlier_applied else 0
      site_neutral_flag = 1 if det.payment_variant == SITE_NEUTRAL else 0
      los_excess        = max(0, det.covered_los_days_used - det.alos_days_used)

      raw = MISSING_DISCIPLINE_WEIGHT * missing_discipline_count
          + WEANING_GAP_WEIGHT       * weaning_gap
          + SSO_WEIGHT               * sso_flag
          + SITE_NEUTRAL_WEIGHT      * site_neutral_flag
          + LOS_EXCESS_WEIGHT        * los_excess

      answered_query_count = count of DocumentationQuery rows on this review
                             with status in {ANSWERED, CLOSED}
      as_documented_score  = min(100, max(0, round_half_up(raw)))
      query_adjusted_score = min(100, max(0, round_half_up(
                                 raw - ANSWERED_QUERY_CREDIT * answered_query_count)))
      effective_score = query_adjusted_score if answered_query_count > 0 else as_documented_score
      risk_band = HIGH     if effective_score >= HIGH_BAND_MIN
             else MODERATE if effective_score >= MODERATE_BAND_MIN
             else LOW
    input_set: >-
      IdtNote rows of the stay grouped by discipline (all statuses; notes are immutable), the stay's
      WeaningPlan status and max_tolerated_sbt_hours, the stay's non-voided PaymentDetermination, and the
      review's own DocumentationQuery rows counted only in status ANSWERED or CLOSED (ISSUED,
      EXPIRED and VOIDED queries earn no credit).
    constants:
      MISSING_DISCIPLINE_WEIGHT: 8
      WEANING_GAP_WEIGHT: 15
      SSO_WEIGHT: 20
      SITE_NEUTRAL_WEIGHT: 10
      LOS_EXCESS_WEIGHT: 0.5
      ANSWERED_QUERY_CREDIT: 12
      HIGH_BAND_MIN: 70
      MODERATE_BAND_MIN: 40
    precision: "integer score after round_half_up; clamped to [0, 100]"
    variants:
      - name: AS_DOCUMENTED
        when: "always computed; the only score available before any query is answered"
        difference: "ignores query responses entirely - the risk implied by the chart as filed"
      - name: QUERY_ADJUSTED
        when: "computed on every rescore; becomes effective_score once answered_query_count > 0"
        difference: >-
          subtracts ANSWERED_QUERY_CREDIT per answered query from the same raw total, so identical
          chart data yields a lower score and can drop the band from HIGH to MODERATE

  - name: referral_source_share
    trigger: >-
      Referral admit, stay recombination, and
      POST /ltch/cost-reporting-periods/{id}/recompute-referral-shares
    algorithm: aggregation
    formula: |
      denominator = period.total_admissions          # Stay rows in this period with
                                                     # counts_toward_admission_threshold == true
      for each ReferringHospital rh (every hospital with admissions_in_period > 0, plus any
      hospital whose counter just changed):
          rh.share_pct     = 0.00 if denominator == 0
                             else round_half_up(rh.admissions_in_period / denominator * 100, 2)
          rh.threshold_pct = EXPANDED_REFERRAL_THRESHOLD_PCT
                             if (rh.is_colocated OR rh.hospital_type == CRITICAL_ACCESS)
                             else BASE_REFERRAL_THRESHOLD_PCT
          if denominator < MIN_ADMISSIONS_FOR_MONITORING:
              rh.monitoring_state = COMPLIANT           # too few admissions to judge the mix
          elif rh.share_pct > rh.threshold_pct:
              rh.monitoring_state = BREACHED            # strictly greater - 25.00 is NOT a breach
          elif rh.share_pct > rh.threshold_pct - WARNING_MARGIN_PCT:
              rh.monitoring_state = WARNING
          else:
              rh.monitoring_state = COMPLIANT
    input_set: >-
      Stay rows whose cost_reporting_period_id == period.id AND
      counts_toward_admission_threshold == true, grouped by
      Referral(stay.referral_id).referring_hospital_id. Recombined stays are excluded from both
      numerator and denominator. share_pct is stored even when the small-denominator guard forces
      COMPLIANT.
    constants:
      BASE_REFERRAL_THRESHOLD_PCT: 25.00
      EXPANDED_REFERRAL_THRESHOLD_PCT: 50.00
      WARNING_MARGIN_PCT: 5.00
      MIN_ADMISSIONS_FOR_MONITORING: 4
    precision: "share_pct to 2 decimals, round_half_up; comparisons are strict >"

  - name: period_payment_rollup
    trigger: >-
      PaymentDetermination DRAFT -> FINAL (increment) and FINAL -> VOIDED (decrement), including the
      recombination-driven void; verified by POST /ltch/cost-reporting-periods/{id}/close
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: each determination's total_payment_cents was already rounded to
      # whole cents inside stay_payment_determination. The period total is the SUM OF THOSE
      # ALREADY-ROUNDED INTEGERS - never a re-derivation from unrounded per-diem products with a
      # single rounding at the end.
      period.total_payment_cents =
          sum(d.total_payment_cents
              for d in PaymentDetermination
              if d.status == FINAL
                 and Stay(d.stay_id).cost_reporting_period_id == period.id)
      period.final_determination_count = count of those same determinations

      # Incremental maintenance (must agree with the full recompute above at all times):
      #   finalize: total_payment_cents += d.total_payment_cents; final_determination_count += 1
      #   void:     total_payment_cents -= d.total_payment_cents; final_determination_count -= 1
      #
      # Worked divergence (see the SCAFFOLD_DIFFICULTY_DESIGN rounding instance): two DRG-573
      # short-stay standard determinations with unrounded per-diem products 1,384,615.3846 and
      # 1,661,538.4615 round to 1,384,615 and 1,661,538, giving a period total of 3,046,153.
      # Summing the unrounded products first (3,046,153.8461) and rounding once yields 3,046,154,
      # which is WRONG under this scaffold.
    input_set: >-
      PaymentDetermination rows with status FINAL only (DRAFT and VOIDED contribute 0), joined to
      stays whose cost_reporting_period_id is this period; ordering is irrelevant because integer
      addition is exact, which is precisely why the per-determination rounding must happen first.
    constants:
      ROUNDING_ORDER: "per_determination_then_sum"
    precision: "whole cents; no rounding at the period level"

  - name: weaning_vent_hours_total
    trigger: "WeaningPlan creation and every POST /ltch/weaning-plans/{id}/record-sbt"
    algorithm: aggregation
    formula: |
      vent_hours_total = create-time vent_hours_total input
                       + sum(vent_hours_since_last over every record-sbt call on this plan,
                             regardless of outcome)
      # Threshold consumed by stay_payment_determination:
      vent_qualifies = vent_hours_total >= VENT_HOURS_SITE_NEUTRAL_MIN     # 96, inclusive
    input_set: >-
      Every record-sbt call on the plan contributes its vent_hours_since_last, including FAILED
      trials; no decay and no reset - regression does not subtract ventilator hours.
    constants:
      VENT_HOURS_SITE_NEUTRAL_MIN: 96
    precision: "decimal hours, one decimal place; comparison is >= (95.0 does not qualify, 96.0 does)"

  - name: interruption_window_evaluation
    trigger: "POST /ltch/interruptions/{id}/return"
    algorithm: threshold
    formula: |
      window_days = INTERRUPTION_WINDOW_DAYS[interruption.destination]
      interruption_days = day_count(interruption.left_at, current logical instant)
      within_window = (interruption_days <= window_days)         # inclusive at the boundary
      if within_window:
          interruption.status = RETURNED
          stay.interruption_days_total += interruption_days
          stay.clinical_status = ADMITTED
      else:
          interruption.status = EXPIRED
          stay.discharged_at = interruption.left_at              # retroactive discharge
          stay.discharge_disposition = INTERRUPTION_EXPIRED
          # interruption_days are NOT added to interruption_days_total for an EXPIRED interruption
    input_set: >-
      The single InterruptionEvent addressed by the path, its destination-derived window, and the
      current logical instant. Interruption intervals are closed on both ends for buffer purposes
      (see validations priority 15) but the window comparison is inclusive.
    constants:
      INTERRUPTION_WINDOW_DAYS: { ACUTE_CARE: 9, IRF: 27, SNF: 27, HOME: 3 }
      INTERRUPTION_BUFFER_HOURS: 24
      MAX_INTERRUPTIONS_PER_STAY: 3
      RECOMBINATION_WINDOW_DAYS: 3
      QUERY_RESPONSE_WINDOW_HOURS: 72
      PROGRESSION_STEPS_REQUIRED: 2
    precision: "whole calendar days; comparison is <= (9 days is within a 9-day window, 10 is not)"

validations:
  # Ordered by ascending priority. The FIRST violated rule (lowest priority number) determines the
  # response; later rules are not evaluated. Every rule below is reachable.
  - priority: 1
    rule: >-
      Request body carries every non-optional field named in the endpoint's input contract, each
      field parses to its declared type, and every enum-typed field holds one of the declared
      literals (hospital_type, discipline, destination, discharge_disposition, outcome, credential).
    category: format
    error_id: ERR_VALIDATION
    applies_to: "all write endpoints"
  - priority: 2
    rule: >-
      The X-Role header names a declared role and that role is permitted to invoke the endpoint per
      the roles table.
    category: authorization
    error_id: ERR_UNAUTHORIZED
    applies_to: "all endpoints"
  - priority: 3
    rule: "Every entity id appearing in the request path exists."
    category: existence
    error_id: "ERR_REFERRAL_NOT_FOUND | ERR_STAY_NOT_FOUND | ERR_WEANING_PLAN_NOT_FOUND | ERR_INTERRUPTION_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_QUERY_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_HOSPITAL_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_CRITERIA_SET_NOT_FOUND | ERR_PHYSICIAN_NOT_FOUND"
    applies_to: "all endpoints with a path id"
  - priority: 4
    rule: >-
      Every foreign key supplied in the body resolves to an existing row (patient_id,
      referring_hospital_id, drg_rate_id, physician_id, cost_reporting_period_id,
      interrupted_parent_stay_id, referral_id, stay_id, review_id).
    category: existence
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_HOSPITAL_NOT_FOUND | ERR_DRG_RATE_NOT_FOUND | ERR_PHYSICIAN_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_STAY_NOT_FOUND | ERR_REFERRAL_NOT_FOUND"
    applies_to: "all write endpoints carrying foreign keys"
  - priority: 5
    rule: >-
      When the endpoint declares an optimistic-concurrency field, the supplied
      expected_stay_version / expected_patient_version equals the parent's current version.
    category: concurrency
    error_id: "ERR_STALE_STAY_VERSION | ERR_STALE_PATIENT_VERSION"
    applies_to: "POST /ltch/referrals, POST /ltch/stays/{id}/payment-determinations"
  - priority: 6
    rule: >-
      The subject entity occupies a state from which the requested trigger is declared in its state
      machine (screen only from RECEIVED, submit-info only from INFO_REQUESTED, admit only from
      CRITERIA_MET, interrupt only from ADMITTED, return only from OPEN, record-sbt only from
      SBT_TRIAL / PROGRESSING / REGRESSED, finalize only from DRAFT, answer only from ISSUED,
      close-query only from ANSWERED, resolve only from OPEN or QUERIES_ISSUED).
      CARVE-OUT: admit on a referral whose status is CRITERIA_NOT_MET is NOT reported here - that one
      case is deferred to priority 9 so the caller learns the clinical reason (no qualifying track)
      instead of a generic state error. Admit on a RECEIVED, INFO_REQUESTED, ADMITTED, WITHDRAWN or
      SUPERSEDED referral is still ERR_INVALID_STATE.
    category: state
    error_id: ERR_INVALID_STATE
    applies_to: "all transition endpoints"
  - priority: 7
    rule: >-
      The CostReportingPeriod that owns the affected stay is in status OPEN: a CLOSED period accepts
      no discharges, determinations, finalizations, voids or share recomputes, and closing an
      already-CLOSED period is refused (ERR_PERIOD_CLOSED). At admit there is no owning period yet -
      it is selected as the single OPEN period covering the admission date - so when no such period
      exists, whether because none covers that date or because the covering period is already CLOSED,
      the admission is refused with ERR_NO_OPEN_PERIOD.
    category: state
    error_id: "ERR_PERIOD_CLOSED | ERR_NO_OPEN_PERIOD"
    applies_to: >-
      POST /ltch/referrals/{id}/admit, POST /ltch/stays/{id}/discharge,
      POST /ltch/stays/{id}/payment-determinations,
      POST /ltch/payment-determinations/{id}/finalize,
      POST /ltch/payment-determinations/{id}/void,
      POST /ltch/cost-reporting-periods/{id}/recompute-referral-shares
  - priority: 8
    rule: >-
      At least one AdmissionCriteriaSet is ACTIVE with effective_from on or before the current
      logical date.
    category: business_referential
    error_id: ERR_NO_EFFECTIVE_CRITERIA_SET
    applies_to: "POST /ltch/referrals/{id}/screen, POST /ltch/referrals/{id}/submit-info"
  - priority: 9
    rule: >-
      Admission is permitted only when the referral's qualifying_track is PMV or COMPLEX_WOUND. A
      referral that screened CRITERIA_NOT_MET can never be admitted; priority 6 deliberately defers
      that status to this rule (see its carve-out) so the refusal names the clinical cause.
      (Patient-safety gate: it outranks the duplicate-admission check at priority 10, so a request
      that violates both returns this error, not ERR_PATIENT_ALREADY_ADMITTED.)
    category: business_safety
    error_id: ERR_REFERRAL_NOT_ELIGIBLE
    applies_to: "POST /ltch/referrals/{id}/admit"
  - priority: 10
    rule: >-
      The patient has no Stay with clinical_status ADMITTED or INTERRUPTED. A readmission is legal
      only after the prior stay reached DISCHARGED; folding it back into the earlier stay is a
      separate POST /ltch/stays/{id}/recombine call.
    category: business_referential
    error_id: ERR_PATIENT_ALREADY_ADMITTED
    applies_to: "POST /ltch/referrals/{id}/admit"
  - priority: 11
    rule: >-
      The new stay's occupancy interval must not overlap any existing non-recombined stay of the same
      patient. Patient occupancy is HALF-OPEN [admitted_at, discharged_at): a new admission whose
      admitted_at equals a prior stay's discharged_at is ADJACENT and allowed; one second earlier
      overlaps and is rejected. An open-ended stay (discharged_at null) occupies to positive infinity.
      The optional backdated admitted_at input is what makes a true overlap reachable.
    category: business_temporal
    error_id: ERR_PATIENT_STAY_OVERLAP
    applies_to: "POST /ltch/referrals/{id}/admit"
  - priority: 12
    rule: >-
      When the referral's ReferringHospital has monitoring_state BREACHED, the admit request must
      carry a non-empty override_reason; without it the admission is refused. Supplying the reason
      admits the stay with admitted_with_override true.
    category: business_constraint
    error_id: ERR_REFERRAL_SOURCE_BREACHED
    applies_to: "POST /ltch/referrals/{id}/admit"
  - priority: 13
    rule: >-
      admitted_at (supplied or defaulted from the logical clock) must be greater than or equal to the
      referral's prior_acute_discharge_at - an LTCH stay cannot begin before the acute discharge that
      feeds it - and must not be after the current logical instant.
    category: business_temporal
    error_id: "ERR_ADMISSION_BEFORE_ACUTE_DISCHARGE | ERR_ADMISSION_IN_FUTURE"
    applies_to: "POST /ltch/referrals/{id}/admit"
  - priority: 14
    rule: >-
      left_at (supplied or defaulted from the logical clock) must be greater than or equal to the
      stay's admitted_at and, when the stay has been resumed, greater than or equal to its resumed_at;
      it must also not be after the current logical instant. A backdated left_at is the only way an
      interruption can precede the admission, so this rule is only reachable through the optional
      left_at input.
    category: temporal
    error_id: ERR_INTERRUPTION_BEFORE_ADMISSION
    applies_to: "POST /ltch/stays/{id}/interrupt"
  - priority: 15
    rule: >-
      A new interruption's interval must clear every earlier interruption of the same stay by at
      least INTERRUPTION_BUFFER_HOURS. Interruption intervals are CLOSED on both ends
      [left_at, returned_at], so a left_at exactly 24h after a prior returned_at is rejected and one
      second later is accepted. (This temporal rule outranks the per-stay count cap at priority 16.)
    category: business_temporal
    error_id: ERR_INTERRUPTION_BUFFER_VIOLATION
    applies_to: "POST /ltch/stays/{id}/interrupt"
  - priority: 16
    rule: >-
      The stay has fewer than MAX_INTERRUPTIONS_PER_STAY (3) InterruptionEvent rows in status OPEN or
      RETURNED. EXPIRED interruptions still count.
    category: business_constraint
    error_id: ERR_INTERRUPTION_LIMIT_EXCEEDED
    applies_to: "POST /ltch/stays/{id}/interrupt"
  - priority: 17
    rule: >-
      Closing a weaning plan with outcome LIBERATED requires liberation_eligible true, i.e.
      current_step greater than or equal to PROGRESSION_STEPS_REQUIRED (2).
    category: business_safety
    error_id: ERR_WEANING_PROGRESSION_INSUFFICIENT
    applies_to: "POST /ltch/weaning-plans/{id}/close"
  - priority: 18
    rule: >-
      Closing a weaning plan with outcome VENT_DEPENDENT requires sbt_attempt_count greater than or
      equal to MIN_SBT_ATTEMPTS_FOR_VENT_DEPENDENT (3).
    category: business_safety
    error_id: ERR_INSUFFICIENT_SBT_ATTEMPTS
    applies_to: "POST /ltch/weaning-plans/{id}/close"
  - priority: 19
    rule: >-
      The physician closing a weaning plan must have specialty PULMONOLOGY and credential_status
      ACTIVE; the physician answering a documentation query must have credential_status ACTIVE
      regardless of specialty.
    category: business_referential
    error_id: ERR_PHYSICIAN_NOT_CREDENTIALED
    applies_to: "POST /ltch/weaning-plans/{id}/close, POST /ltch/documentation-queries/{id}/answer"
  - priority: 20
    rule: >-
      A stay that has a WeaningPlan cannot be discharged while that plan is in SBT_TRIAL,
      PROGRESSING or REGRESSED; close the plan first.
    category: business_referential
    error_id: ERR_WEANING_PLAN_OPEN
    applies_to: "POST /ltch/stays/{id}/discharge"
  - priority: 21
    rule: "A stay may hold at most one PaymentDetermination in status DRAFT or FINAL."
    category: business_constraint
    error_id: ERR_DETERMINATION_EXISTS
    applies_to: "POST /ltch/stays/{id}/payment-determinations"
  - priority: 22
    rule: >-
      Finalizing requires the stay's DenialRiskReview to be resolved (CLEARED or ESCALATED). A review
      still OPEN or QUERIES_ISSUED blocks the money.
    category: business_fiscal
    error_id: ERR_REVIEW_NOT_RESOLVED
    applies_to: "POST /ltch/payment-determinations/{id}/finalize"
  - priority: 23
    rule: >-
      Finalizing requires zero DocumentationQuery rows in status ISSUED on the stay's review. (This
      fiscal gate sits BELOW the DRAFT-state check at priority 6, so finalizing an already-FINAL
      determination that also has an open query returns ERR_INVALID_STATE, not this error.)
    category: business_fiscal
    error_id: ERR_OPEN_QUERIES_BLOCK_FINALIZE
    applies_to: "POST /ltch/payment-determinations/{id}/finalize"
  - priority: 24
    rule: >-
      Segregation of duties: the X-User-ID finalizing a determination must differ from its
      priced_by_user_id, the X-User-ID voiding a FINAL determination must differ from its
      finalized_by_user_id, and the X-User-ID closing a documentation query must differ from that
      query's issued_by_user_id. In every case both actors hold the same role, so only the identity
      differs.
    category: authorization
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: >-
      POST /ltch/payment-determinations/{id}/finalize,
      POST /ltch/payment-determinations/{id}/void,
      POST /ltch/documentation-queries/{id}/close
  - priority: 25
    rule: >-
      A query may be answered only within QUERY_RESPONSE_WINDOW_HOURS (72) of issued_at, measured
      inclusively; at exactly 72h the answer is accepted, one second later it is refused and the
      query is marked EXPIRED.
    category: business_temporal
    error_id: ERR_QUERY_RESPONSE_WINDOW_EXPIRED
    applies_to: "POST /ltch/documentation-queries/{id}/answer"
  - priority: 26
    rule: >-
      Recombination requires interrupted_parent_stay_id to reference a DIFFERENT stay of the SAME
      patient, in clinical_status DISCHARGED, whose discharged_at is no more than
      RECOMBINATION_WINDOW_DAYS (3) whole days before the child stay's admitted_at. At exactly 3 days
      the recombination is accepted; at 4 days it is refused.
    category: business_temporal
    error_id: ERR_RECOMBINATION_WINDOW_EXCEEDED
    applies_to: "POST /ltch/stays/{id}/recombine"
  - priority: 27
    rule: "Closing a period requires zero PaymentDetermination rows in status DRAFT on its stays."
    category: business_constraint
    error_id: ERR_PERIOD_HAS_DRAFT_DETERMINATIONS
    applies_to: "POST /ltch/cost-reporting-periods/{id}/close"
  - priority: 28
    rule: >-
      Closing a period requires the incrementally maintained ledger to equal the full recompute:
      total_payment_cents equals the sum of FINAL determination totals and
      final_determination_count equals their count.
    category: business_fiscal
    error_id: ERR_PERIOD_LEDGER_MISMATCH
    applies_to: "POST /ltch/cost-reporting-periods/{id}/close"
  - priority: 29
    rule: >-
      The logical clock is monotonic: the requested current_utc must be strictly after the current
      logical instant.
    category: business_temporal
    error_id: ERR_CLOCK_NOT_MONOTONIC
    applies_to: "POST /ltch/_clock/set_current_utc"
  - priority: 30
    rule: >-
      Uniqueness and non-overlap: DrgRateEntry.drg_code, ReferringHospital.npi, Physician.npi,
      Patient.mrn, AdmissionCriteriaSet.label and CostReportingPeriod.period_label are unique; a new
      AdmissionCriteriaSet.effective_from must be strictly after every ACTIVE set's effective_from;
      a new CostReportingPeriod [start_date, end_date] must not overlap an existing period and only
      one period may be OPEN at a time.
    category: business_constraint
    error_id: ERR_DUPLICATE_KEY
    applies_to: >-
      POST /ltch/drg-rates, POST /ltch/referring-hospitals, POST /ltch/physicians,
      POST /ltch/patients, POST /ltch/admission-criteria-sets, POST /ltch/cost-reporting-periods
  - priority: 31
    rule: >-
      A referral may not be admitted when its pinned_criteria_set_id references an
      AdmissionCriteriaSet whose status is SUPERSEDED; the referral must be re-screened against the
      current set first. Checked after the eligibility gate at priority 9, so a CRITERIA_NOT_MET
      referral pinned to a superseded set still returns ERR_REFERRAL_NOT_ELIGIBLE.
    category: business_referential
    error_id: ERR_CRITERIA_SET_SUPERSEDED
    applies_to: "POST /ltch/referrals/{id}/admit"
  - priority: 32
    rule: >-
      A TOLERATED spontaneous-breathing trial may be recorded only when the interdisciplinary team
      has documented the stay since the last progression: at least one IdtNote with discipline
      RESPIRATORY_THERAPY and one with discipline PHYSICIAN whose documented_at is greater than or
      equal to the plan's last_progression_at (or the plan's created_at before the first
      progression). A FAILED trial carries no documentation precondition.
    category: business_referential
    error_id: ERR_IDT_DOCUMENTATION_STALE
    applies_to: "POST /ltch/weaning-plans/{id}/record-sbt"

endpoints:
  # ---------------- reference data (ComplianceOfficer) ----------------
  - method: POST
    path: "/ltch/referring-hospitals"
    description: "Register a referring acute-care hospital as a referral source."
    roles: [ComplianceOfficer]
    code: 201
    input: [name, npi, hospital_type, "is_colocated?"]
    output: ReferringHospital
    side_effects:
      - "threshold_pct computed per calculations.referral_source_share (50.00 when is_colocated or CRITICAL_ACCESS, else 25.00)"
      - "admissions_in_period 0, share_pct 0.00, monitoring_state COMPLIANT"
  - method: GET
    path: "/ltch/referring-hospitals/{id}"
    description: "Read a referring hospital including its live 25-percent-rule posture."
    roles: [ComplianceOfficer, IntakeCoordinator, RevenueIntegrityAnalyst, UtilizationReviewNurse, AttendingPhysician]
    code: 200
    input: []
    output: ReferringHospital
    side_effects: []
  - method: POST
    path: "/ltch/patients"
    description: "Register a patient."
    roles: [ComplianceOfficer, IntakeCoordinator]
    code: 201
    input: [mrn, full_name, birth_date, primary_payer]
    output: Patient
    side_effects: ["open_referral_count 0"]
  - method: GET
    path: "/ltch/patients/{id}"
    description: "Read a patient, including the current version needed for referral creation."
    roles: [ComplianceOfficer, IntakeCoordinator, RevenueIntegrityAnalyst, UtilizationReviewNurse, AttendingPhysician]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: POST
    path: "/ltch/physicians"
    description: "Register a physician who may close weaning plans and answer documentation queries."
    roles: [ComplianceOfficer]
    code: 201
    input: [npi, full_name, specialty]
    output: Physician
    side_effects: ["credential_status ACTIVE"]
  - method: POST
    path: "/ltch/physicians/{id}/credential-status"
    description: "Suspend or reinstate a physician's credential."
    roles: [ComplianceOfficer]
    code: 200
    input: [credential_status]
    output: Physician
    side_effects:
      - "a SUSPENDED physician can no longer close weaning plans or answer queries (validations priority 19)"
  - method: POST
    path: "/ltch/drg-rates"
    description: "Load an immutable MS-LTC-DRG rate entry (relative weight, ALOS, federal and IPPS-comparable amounts)."
    roles: [ComplianceOfficer]
    code: 201
    input: [drg_code, relative_weight, alos_days, standard_federal_rate_cents, ipps_comparable_per_diem_cents, ipps_comparable_full_cents]
    output: DrgRateEntry
    side_effects: ["immutable: no update endpoint; determinations snapshot its values instead"]
  - method: POST
    path: "/ltch/admission-criteria-sets"
    description: "Publish a new admission criteria set; supersedes every older ACTIVE set."
    roles: [ComplianceOfficer]
    code: 201
    input: [label, effective_from, pmv_min_vent_hours, pmv_min_icu_days, wound_min_stage, wound_min_count]
    output: AdmissionCriteriaSet
    side_effects:
      - "every previously ACTIVE AdmissionCriteriaSet flips to SUPERSEDED"
      - "referrals pinned to a superseded set can no longer be admitted (ERR_CRITERIA_SET_SUPERSEDED)"
  - method: GET
    path: "/ltch/admission-criteria-sets/{id}"
    description: "Read a criteria set and observe whether a newer publication superseded it."
    roles: [ComplianceOfficer, IntakeCoordinator, RevenueIntegrityAnalyst, UtilizationReviewNurse, AttendingPhysician]
    code: 200
    input: []
    output: AdmissionCriteriaSet
    side_effects: []
  - method: POST
    path: "/ltch/cost-reporting-periods"
    description: "Open a cost reporting period; only one period may be OPEN at a time."
    roles: [ComplianceOfficer]
    code: 201
    input: [period_label, start_date, end_date]
    output: CostReportingPeriod
    side_effects:
      - "status OPEN, total_admissions 0, total_payment_cents 0, final_determination_count 0"
      - "every ReferringHospital.admissions_in_period reset to 0 and share_pct to 0.00"
  - method: GET
    path: "/ltch/cost-reporting-periods/{id}"
    description: "Read a period's admission counters and payment ledger."
    roles: [ComplianceOfficer, RevenueIntegrityAnalyst, IntakeCoordinator]
    code: 200
    input: []
    output: CostReportingPeriod
    side_effects: []
  - method: POST
    path: "/ltch/cost-reporting-periods/{id}/recompute-referral-shares"
    description: "Recompute every referring hospital's share_pct and monitoring_state from the period's admissions."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CostReportingPeriod
    side_effects:
      - "runs calculations.referral_source_share over every ReferringHospital"
      - "share_pct and monitoring_state rewritten; MIN_ADMISSIONS_FOR_MONITORING guard applied"
  - method: POST
    path: "/ltch/cost-reporting-periods/{id}/close"
    description: "Close the period after verifying the payment ledger reconciles with a full recompute."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CostReportingPeriod
    side_effects:
      - "status CLOSED, closed_at stamped from the logical clock"
      - "rejects with ERR_PERIOD_HAS_DRAFT_DETERMINATIONS or ERR_PERIOD_LEDGER_MISMATCH (validations priorities 27-28)"
      - "a CLOSED period refuses further admissions, discharges, pricing and voids (validations priority 7)"

  # ---------------- referral intake and screening ----------------
  - method: POST
    path: "/ltch/referrals"
    description: >-
      Create a referral for a patient. Requires the patient's observed version; creating a referral
      supersedes any prior open referral of that patient and bumps Patient.version.
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_id, referring_hospital_id, drg_rate_id, expected_patient_version, "vent_hours_at_referral?", "icu_days_at_referral?", "wound_stage?", "wound_count?", "prior_acute_discharge_at?"]
    output: Referral
    side_effects:
      - "any Referral of this patient in RECEIVED, INFO_REQUESTED or CRITERIA_MET flips to SUPERSEDED"
      - "increments Patient.version by 1"
      - "recomputes Patient.open_referral_count to 1"
      - "status RECEIVED, qualifying_track NONE, screened_count 0"
  - method: GET
    path: "/ltch/referrals/{id}"
    description: "Read a referral with its screening outcome."
    roles: [IntakeCoordinator, ComplianceOfficer, RevenueIntegrityAnalyst, UtilizationReviewNurse, AttendingPhysician]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/ltch/referrals"
    description: "List referrals, filterable by patient, referral source, anticipated DRG, pinned criteria set or status."
    roles: [IntakeCoordinator, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["patient_id?", "referring_hospital_id?", "drg_rate_id?", "pinned_criteria_set_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/ltch/referrals/{id}/screen"
    description: "Screen a RECEIVED referral against the effective admission criteria set."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "runs calculations.referral_screening_evaluation"
      - "pins pinned_criteria_set_id; sets data_complete, missing_fields, qualifying_track"
      - "status becomes INFO_REQUESTED, CRITERIA_MET or CRITERIA_NOT_MET; screened_count += 1"
  - method: POST
    path: "/ltch/referrals/{id}/submit-info"
    description: "Supply missing screening data on an INFO_REQUESTED referral and re-screen it."
    roles: [IntakeCoordinator]
    code: 200
    input: ["vent_hours_at_referral?", "icu_days_at_referral?", "wound_stage?", "wound_count?", "prior_acute_discharge_at?"]
    output: Referral
    side_effects:
      - "supplied fields overwrite the referral's null values"
      - "re-runs calculations.referral_screening_evaluation against the CURRENT logical date, re-pinning pinned_criteria_set_id"
      - "screened_count += 1; status may stay INFO_REQUESTED when data is still incomplete"
  - method: POST
    path: "/ltch/referrals/{id}/withdraw"
    description: "Withdraw a referral that will not be admitted."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "status WITHDRAWN (terminal); Patient.open_referral_count recomputed to 0"
  - method: POST
    path: "/ltch/referrals/{id}/admit"
    description: >-
      Admit a CRITERIA_MET referral, creating the Stay in the single OPEN cost reporting period.
      A BREACHED referral source requires override_reason.
    roles: [IntakeCoordinator]
    code: 201
    input: ["admitted_at?", "override_reason?"]
    output: Stay
    side_effects:
      - "creates a Stay with clinical_status ADMITTED, payment_review_status PENDING, admitted_at from the logical clock"
      - "referral status becomes ADMITTED; Patient.open_referral_count recomputed to 0"
      - "CostReportingPeriod.total_admissions += 1 and ReferringHospital.admissions_in_period += 1"
      - "re-runs calculations.referral_source_share for every ReferringHospital"
      - "admitted_with_override and override_reason recorded when the source was BREACHED"

  # ---------------- stay lifecycle ----------------
  - method: GET
    path: "/ltch/stays/{id}"
    description: "Read a stay with both status dimensions, LOS counters and its version for OCC."
    roles: [IntakeCoordinator, ComplianceOfficer, RevenueIntegrityAnalyst, UtilizationReviewNurse, AttendingPhysician]
    code: 200
    input: []
    output: Stay
    side_effects: []
  - method: GET
    path: "/ltch/stays"
    description: "List stays, filterable by patient, referral, period, recombination parent or either status dimension."
    roles: [IntakeCoordinator, ComplianceOfficer, RevenueIntegrityAnalyst, UtilizationReviewNurse]
    code: 200
    input: ["patient_id?", "referral_id?", "cost_reporting_period_id?", "interrupted_parent_stay_id?", "clinical_status?", "payment_review_status?", "limit?", "offset?"]
    output: Stay[]
    side_effects: []
  - method: POST
    path: "/ltch/stays/{id}/discharge"
    description: >-
      Discharge an ADMITTED stay, compute the covered LOS and short-stay-outlier flag, and run the
      four-level discharge cascade (price -> review -> query).
    roles: [UtilizationReviewNurse]
    code: 200
    input: [discharge_disposition, estimated_cost_cents]
    output: Stay
    side_effects:
      - "clinical_status DISCHARGED, discharged_at from the logical clock"
      - "runs calculations.covered_los_days, setting covered_los_days, sso_threshold_days and short_stay_outlier_applied"
      - "cascade level 2: creates a PaymentDetermination in DRAFT via calculations.stay_payment_determination with priced_by_user_id SYSTEM; payment_review_status becomes PRICED; Stay.discharge_payment_pct mirrored"
      - "cascade level 3: creates a DenialRiskReview in OPEN and scores it via calculations.denial_risk_score"
      - "cascade level 4: when risk_band is HIGH the review auto-issues a DocumentationQuery (query_type VENT_WEANING_RATIONALE, issued_by_user_id SYSTEM) and the review moves to QUERIES_ISSUED"
      - "increments Stay.version by 1"
  - method: POST
    path: "/ltch/stays/{id}/recombine"
    description: >-
      Fold a readmission back into an earlier discharged stay of the same patient when the
      readmission fell inside the interruption window.
    roles: [ComplianceOfficer]
    code: 200
    input: [interrupted_parent_stay_id]
    output: Stay
    side_effects:
      - "child stay clinical_status RECOMBINED (terminal), counts_toward_admission_threshold false"
      - "parent stay clinical_status DISCHARGED -> ADMITTED, discharged_at null, resumed_at = child's admitted_at, carried_los_days = parent's previous covered_los_days"
      - "every PaymentDetermination of the parent in DRAFT or FINAL becomes VOIDED with void_reason RECOMBINED; a FINAL one decrements CostReportingPeriod.total_payment_cents and final_determination_count"
      - "parent's DenialRiskReview becomes VOIDED and its ISSUED queries become VOIDED"
      - "CostReportingPeriod.total_admissions -= 1 and the child's ReferringHospital.admissions_in_period -= 1, then calculations.referral_source_share re-runs for every hospital"
      - "increments Stay.version by 1 on both stays"
  - method: POST
    path: "/ltch/stays/{id}/interrupt"
    description: "Record that the patient left the LTCH, opening an interruption window."
    roles: [UtilizationReviewNurse]
    code: 201
    input: [destination, "left_at?"]
    output: InterruptionEvent
    side_effects:
      - "stay clinical_status ADMITTED -> INTERRUPTED"
      - "left_at from the request or, when omitted, from the logical clock; window_days from INTERRUPTION_WINDOW_DAYS[destination]"
      - "Stay.interruption_count += 1"
  - method: GET
    path: "/ltch/stays/{id}/interruptions"
    description: "List the interruption events of a stay."
    roles: [UtilizationReviewNurse, ComplianceOfficer, RevenueIntegrityAnalyst, IntakeCoordinator]
    code: 200
    input: ["status?"]
    output: InterruptionEvent[]
    side_effects: []
  - method: POST
    path: "/ltch/interruptions/{id}/return"
    description: >-
      Record the patient's return and evaluate the interruption window; a lapsed window
      retroactively discharges the stay instead.
    roles: [UtilizationReviewNurse]
    code: 200
    input: []
    output: InterruptionEvent
    side_effects:
      - "runs calculations.interruption_window_evaluation"
      - "within window: status RETURNED, returned_at stamped, Stay.interruption_days_total += interruption_days, stay clinical_status back to ADMITTED"
      - "outside window: status EXPIRED, stay clinical_status DISCHARGED with discharged_at = left_at and discharge_disposition INTERRUPTION_EXPIRED; the discharge cascade runs with estimated_cost_cents left null"
  - method: POST
    path: "/ltch/stays/{id}/idt-notes"
    description: "File an immutable interdisciplinary-team note against a stay."
    roles: [UtilizationReviewNurse, AttendingPhysician]
    code: 201
    input: [discipline, note_text, "goals_documented?"]
    output: IdtNote
    side_effects:
      - "documented_at from the logical clock; week_index computed from the stay's admitted_at"
      - "append-only: no update or delete endpoint exists"
      - "a note in a previously missing required discipline lowers the next denial-risk rescore"
  - method: GET
    path: "/ltch/stays/{id}/idt-notes"
    description: "List a stay's interdisciplinary-team notes."
    roles: [UtilizationReviewNurse, AttendingPhysician, ComplianceOfficer, RevenueIntegrityAnalyst, IntakeCoordinator]
    code: 200
    input: ["discipline?"]
    output: IdtNote[]
    side_effects: []

  # ---------------- weaning protocol ----------------
  - method: POST
    path: "/ltch/stays/{id}/weaning-plans"
    description: "Open the ventilator weaning plan for a stay (at most one per stay)."
    roles: [UtilizationReviewNurse]
    code: 201
    input: ["protocol_label?", "vent_hours_total?"]
    output: WeaningPlan
    side_effects:
      - "status SBT_TRIAL, current_step 0, sbt_attempt_count 0, consecutive_failed_sbt 0"
      - "vent_hours_total seeded from the input (default 0) - the acute-stay hours are NOT carried over"
      - "rejects a second plan on the same stay with ERR_WEANING_PLAN_EXISTS"
  - method: GET
    path: "/ltch/weaning-plans/{id}"
    description: "Read a weaning plan's progression counters and cumulative ventilator hours."
    roles: [UtilizationReviewNurse, AttendingPhysician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: WeaningPlan
    side_effects: []
  - method: GET
    path: "/ltch/weaning-plans"
    description: "List weaning plans, filterable by stay, closing physician or status."
    roles: [UtilizationReviewNurse, AttendingPhysician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["stay_id?", "closed_by_physician_id?", "status?", "limit?", "offset?"]
    output: WeaningPlan[]
    side_effects: []
  - method: POST
    path: "/ltch/weaning-plans/{id}/record-sbt"
    description: "Record a spontaneous-breathing trial and advance or regress the protocol."
    roles: [UtilizationReviewNurse]
    code: 200
    input: [outcome, sbt_hours, vent_hours_since_last]
    output: WeaningPlan
    side_effects:
      - "sbt_attempt_count += 1; vent_hours_total += vent_hours_since_last (calculations.weaning_vent_hours_total)"
      - "outcome TOLERATED: current_step += 1, consecutive_failed_sbt 0, max_tolerated_sbt_hours = max(previous, sbt_hours), last_progression_at stamped, status PROGRESSING"
      - "outcome FAILED: consecutive_failed_sbt += 1; on the second consecutive failure current_step decreases by 1 (floor 0) and status becomes REGRESSED"
      - "liberation_eligible recomputed as current_step >= PROGRESSION_STEPS_REQUIRED"
  - method: POST
    path: "/ltch/weaning-plans/{id}/close"
    description: >-
      Close the weaning plan as LIBERATED or VENT_DEPENDENT. The acting AttendingPhysician's
      X-User-ID is recorded as closed_by_physician_id.
    roles: [AttendingPhysician]
    code: 200
    input: [outcome]
    output: WeaningPlan
    side_effects:
      - "status LIBERATED (requires liberation_eligible) or VENT_DEPENDENT (requires sbt_attempt_count >= 3)"
      - "closed_at stamped, closed_by_physician_id = X-User-ID"
      - "a closed plan no longer blocks discharge (validations priority 20)"

  # ---------------- payment determination ----------------
  - method: POST
    path: "/ltch/stays/{id}/payment-determinations"
    description: >-
      Re-price a discharged stay. Requires the stay version the analyst observed; the write
      supersedes any DRAFT determination on that stay and bumps Stay.version.
    roles: [RevenueIntegrityAnalyst]
    code: 201
    input: [expected_stay_version, recalculation_reason, "override_drg_rate_id?"]
    output: PaymentDetermination
    side_effects:
      - "any existing DRAFT determination on this stay flips to VOIDED with void_reason SUPERSEDED before the new row is written"
      - "runs calculations.stay_payment_determination and calculations.high_cost_outlier_payment, storing BOTH variant amounts plus the DRG value snapshots"
      - "runs calculations.discharge_payment_percentage and mirrors discharge_payment_pct onto the Stay"
      - "status DRAFT, priced_by_user_id = X-User-ID; Stay.payment_review_status PRICED"
      - "re-runs calculations.denial_risk_score on the stay's DenialRiskReview"
      - "increments Stay.version by 1"
  - method: GET
    path: "/ltch/stays/{id}/payment-determinations"
    description: "List the payment determinations of a stay, newest first."
    roles: [RevenueIntegrityAnalyst, ComplianceOfficer, IntakeCoordinator, UtilizationReviewNurse]
    code: 200
    input: ["status?"]
    output: PaymentDetermination[]
    side_effects: []
  - method: GET
    path: "/ltch/payment-determinations/{id}"
    description: "Read a determination with both variant amounts, the outlier add-on and the discharge payment percentage."
    roles: [RevenueIntegrityAnalyst, ComplianceOfficer, IntakeCoordinator, UtilizationReviewNurse, AttendingPhysician]
    code: 200
    input: []
    output: PaymentDetermination
    side_effects: []
  - method: POST
    path: "/ltch/payment-determinations/{id}/finalize"
    description: >-
      Accept a DRAFT determination once the denial-risk review is resolved and no query is still
      open. Must be performed by a different analyst than the one who priced it.
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: PaymentDetermination
    side_effects:
      - "status DRAFT -> FINAL, finalized_by_user_id = X-User-ID"
      - "CostReportingPeriod.total_payment_cents += total_payment_cents and final_determination_count += 1 (calculations.period_payment_rollup)"
      - "Stay.payment_review_status FINALIZED"
  - method: POST
    path: "/ltch/payment-determinations/{id}/void"
    description: "Reverse a DRAFT or FINAL determination, unwinding its contribution to the period ledger."
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: [void_reason]
    output: PaymentDetermination
    side_effects:
      - "status -> VOIDED with the supplied void_reason"
      - "when the determination was FINAL: CostReportingPeriod.total_payment_cents -= total_payment_cents and final_determination_count -= 1"
      - "Stay.payment_review_status back to PENDING and Stay.discharge_payment_pct cleared to null"

  # ---------------- denial risk review and documentation queries ----------------
  - method: GET
    path: "/ltch/stays/{id}/denial-risk-reviews"
    description: "List the denial-risk reviews of a stay (at most one live review per stay)."
    roles: [ComplianceOfficer, RevenueIntegrityAnalyst, UtilizationReviewNurse, AttendingPhysician, IntakeCoordinator]
    code: 200
    input: ["status?"]
    output: DenialRiskReview[]
    side_effects: []
  - method: GET
    path: "/ltch/denial-risk-reviews/{id}"
    description: "Read a denial-risk review with both score variants, the effective score and the risk band."
    roles: [ComplianceOfficer, RevenueIntegrityAnalyst, UtilizationReviewNurse, AttendingPhysician]
    code: 200
    input: []
    output: DenialRiskReview
    side_effects: []
  - method: POST
    path: "/ltch/denial-risk-reviews/{id}/rescore"
    description: "Re-run the denial-risk score after documentation or pricing changed."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DenialRiskReview
    side_effects:
      - "recomputes both variants of calculations.denial_risk_score, effective_score and risk_band"
      - "refreshes missing_discipline_count and answered_query_count"
  - method: POST
    path: "/ltch/denial-risk-reviews/{id}/documentation-queries"
    description: "Issue a physician documentation query from an open review."
    roles: [UtilizationReviewNurse]
    code: 201
    input: [query_type, prompt_text]
    output: DocumentationQuery
    side_effects:
      - "status ISSUED, issued_at from the logical clock, due_at = issued_at + 72h"
      - "review status OPEN -> QUERIES_ISSUED (already QUERIES_ISSUED reviews stay there)"
      - "issued_by_user_id = X-User-ID"
  - method: POST
    path: "/ltch/denial-risk-reviews/{id}/resolve"
    description: "Clear or escalate a review once every query has been dealt with."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, resolution_note]
    output: DenialRiskReview
    side_effects:
      - "outcome CLEARED or ESCALATED; resolved_by_user_id = X-User-ID; resolution_note stored"
      - "unblocks POST /ltch/payment-determinations/{id}/finalize (validations priority 22)"
  - method: GET
    path: "/ltch/documentation-queries/{id}"
    description: "Read a documentation query with its due_at and lifecycle status."
    roles: [ComplianceOfficer, UtilizationReviewNurse, AttendingPhysician, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: DocumentationQuery
    side_effects: []
  - method: GET
    path: "/ltch/documentation-queries"
    description: "List documentation queries, filterable by review, stay, answering physician or status."
    roles: [ComplianceOfficer, UtilizationReviewNurse, AttendingPhysician, RevenueIntegrityAnalyst]
    code: 200
    input: ["denial_risk_review_id?", "stay_id?", "answered_by_physician_id?", "status?", "limit?", "offset?"]
    output: DocumentationQuery[]
    side_effects: []
  - method: POST
    path: "/ltch/documentation-queries/{id}/answer"
    description: >-
      Answer an ISSUED query within the 72-hour response window. The acting AttendingPhysician's
      X-User-ID is recorded as answered_by_physician_id.
    roles: [AttendingPhysician]
    code: 200
    input: [response_text]
    output: DocumentationQuery
    side_effects:
      - "status ISSUED -> ANSWERED, answered_at stamped, answered_by_physician_id = X-User-ID"
      - "review answered_query_count += 1 and calculations.denial_risk_score re-runs, so risk_band may fall"
      - "past due_at the answer is refused and the query flips to EXPIRED (validations priority 25)"
  - method: POST
    path: "/ltch/documentation-queries/{id}/close"
    description: "Close an answered query as adequate."
    roles: [UtilizationReviewNurse]
    code: 200
    input: []
    output: DocumentationQuery
    side_effects:
      - "status ANSWERED -> CLOSED, closed_by_user_id = X-User-ID"
      - "the query keeps its answered-query credit in calculations.denial_risk_score"

  # ---------------- test-driving surface ----------------
  - method: POST
    path: "/ltch/_clock/set_current_utc"
    description: >-
      Set the server's logical clock, which every timestamp, window and deadline in this domain
      reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never
      falls back to wall-clock time. The new instant must be strictly after the current one.
    roles: [ComplianceOfficer, IntakeCoordinator, UtilizationReviewNurse, AttendingPhysician, RevenueIntegrityAnalyst]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects:
      - "all subsequent system-stamped datetimes read from this instant"
      - "no entity is mutated; expiries are evaluated lazily on the next relevant call"

errors:
  # ---- request / auth ----
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, out-of-range number, or an enum value outside the declared literals."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The X-User-Role header is absent, unknown, or not listed in the endpoint's roles."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID finalizing a determination equals its priced_by_user_id, or the X-User-ID voiding a FINAL determination equals its finalized_by_user_id."
  # ---- not found ----
  - id: ERR_HOSPITAL_NOT_FOUND
    http: 404
    condition: "No ReferringHospital with the given id."
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "No Patient with the given id."
  - id: ERR_PHYSICIAN_NOT_FOUND
    http: 404
    condition: "No Physician with the given id, or the acting AttendingPhysician's X-User-ID is not a Physician id."
  - id: ERR_DRG_RATE_NOT_FOUND
    http: 404
    condition: "No DrgRateEntry with the given drg_rate_id or override_drg_rate_id."
  - id: ERR_CRITERIA_SET_NOT_FOUND
    http: 404
    condition: "No AdmissionCriteriaSet with the given id."
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "No CostReportingPeriod with the given id."
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "No Referral with the given id."
  - id: ERR_STAY_NOT_FOUND
    http: 404
    condition: "No Stay with the given id, including a recombination parent that does not exist."
  - id: ERR_WEANING_PLAN_NOT_FOUND
    http: 404
    condition: "No WeaningPlan with the given id."
  - id: ERR_INTERRUPTION_NOT_FOUND
    http: 404
    condition: "No InterruptionEvent with the given id."
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "No PaymentDetermination with the given id."
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No DenialRiskReview with the given id."
  - id: ERR_QUERY_NOT_FOUND
    http: 404
    condition: "No DocumentationQuery with the given id."
  # ---- concurrency ----
  - id: ERR_STALE_STAY_VERSION
    http: 412
    condition: "expected_stay_version does not equal the stay's current version at POST /ltch/stays/{id}/payment-determinations."
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal the patient's current version at POST /ltch/referrals."
  # ---- state ----
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The subject entity's current state has no declared transition for the requested trigger (screening a non-RECEIVED referral, interrupting a DISCHARGED stay, finalizing a non-DRAFT determination, answering a non-ISSUED query, recording an SBT on a closed plan, and so on)."
  - id: ERR_PERIOD_CLOSED
    http: 409
    condition: "The CostReportingPeriod owning the affected stay is CLOSED, or the period being closed is already CLOSED."
  - id: ERR_NO_OPEN_PERIOD
    http: 422
    condition: "Admission was attempted while no OPEN CostReportingPeriod covers the admission date."
  # ---- screening and admission ----
  - id: ERR_NO_EFFECTIVE_CRITERIA_SET
    http: 422
    condition: "No AdmissionCriteriaSet is ACTIVE with effective_from on or before the current logical date."
  - id: ERR_REFERRAL_NOT_ELIGIBLE
    http: 422
    condition: "Admission was attempted on a referral whose qualifying_track is NONE."
  - id: ERR_CRITERIA_SET_SUPERSEDED
    http: 422
    condition: "Admission was attempted on a referral pinned to an AdmissionCriteriaSet whose status is SUPERSEDED."
  - id: ERR_PATIENT_ALREADY_ADMITTED
    http: 409
    condition: "The patient already has a Stay in clinical_status ADMITTED or INTERRUPTED."
  - id: ERR_PATIENT_STAY_OVERLAP
    http: 422
    condition: "The new stay's half-open occupancy interval overlaps an existing non-recombined stay of the same patient; exact adjacency is allowed."
  - id: ERR_REFERRAL_SOURCE_BREACHED
    http: 422
    condition: "The referring hospital's monitoring_state is BREACHED and no override_reason was supplied."
  - id: ERR_ADMISSION_BEFORE_ACUTE_DISCHARGE
    http: 422
    condition: "admitted_at would fall before the referral's prior_acute_discharge_at."
  - id: ERR_ADMISSION_IN_FUTURE
    http: 422
    condition: "A supplied admitted_at, or a supplied interruption left_at, is after the current logical instant."
  # ---- interruptions and recombination ----
  - id: ERR_INTERRUPTION_BEFORE_ADMISSION
    http: 422
    condition: "A supplied left_at precedes the stay's admitted_at or, for a resumed stay, its resumed_at."
  - id: ERR_INTERRUPTION_BUFFER_VIOLATION
    http: 422
    condition: "The new interruption starts within INTERRUPTION_BUFFER_HOURS of a previous interruption's returned_at, treating interruption intervals as closed on both ends."
  - id: ERR_INTERRUPTION_LIMIT_EXCEEDED
    http: 422
    condition: "The stay already has MAX_INTERRUPTIONS_PER_STAY (3) interruption events."
  - id: ERR_RECOMBINATION_WINDOW_EXCEEDED
    http: 422
    condition: "The recombination parent is not the same patient, is not DISCHARGED, is the child itself, or its discharged_at is more than RECOMBINATION_WINDOW_DAYS (3) days before the child's admitted_at."
  # ---- weaning and documentation ----
  - id: ERR_WEANING_PLAN_EXISTS
    http: 409
    condition: "The stay already has a WeaningPlan."
  - id: ERR_WEANING_PROGRESSION_INSUFFICIENT
    http: 422
    condition: "A LIBERATED close was attempted while liberation_eligible is false (current_step < 2)."
  - id: ERR_INSUFFICIENT_SBT_ATTEMPTS
    http: 422
    condition: "A VENT_DEPENDENT close was attempted with sbt_attempt_count < MIN_SBT_ATTEMPTS_FOR_VENT_DEPENDENT (3)."
  - id: ERR_PHYSICIAN_NOT_CREDENTIALED
    http: 422
    condition: "The acting physician has credential_status SUSPENDED, or lacks specialty PULMONOLOGY when closing a weaning plan."
  - id: ERR_IDT_DOCUMENTATION_STALE
    http: 422
    condition: "A TOLERATED SBT was recorded without a RESPIRATORY_THERAPY and a PHYSICIAN IdtNote dated on or after the plan's last_progression_at (or created_at before the first progression)."
  - id: ERR_WEANING_PLAN_OPEN
    http: 422
    condition: "Discharge was attempted while the stay's WeaningPlan is still SBT_TRIAL, PROGRESSING or REGRESSED."
  - id: ERR_QUERY_RESPONSE_WINDOW_EXPIRED
    http: 422
    condition: "The answer arrived after the query's due_at; the query is marked EXPIRED."
  # ---- pricing and ledger ----
  - id: ERR_DETERMINATION_EXISTS
    http: 409
    condition: "The stay already has a PaymentDetermination in status FINAL."
  - id: ERR_REVIEW_NOT_RESOLVED
    http: 422
    condition: "Finalization was attempted while the stay's DenialRiskReview is OPEN or QUERIES_ISSUED."
  - id: ERR_OPEN_QUERIES_BLOCK_FINALIZE
    http: 422
    condition: "Finalization was attempted while at least one DocumentationQuery on the review is still ISSUED."
  - id: ERR_PERIOD_HAS_DRAFT_DETERMINATIONS
    http: 422
    condition: "Period close was attempted while a stay in the period still has a DRAFT determination."
  - id: ERR_PERIOD_LEDGER_MISMATCH
    http: 409
    condition: "At period close the incrementally maintained total_payment_cents or final_determination_count disagrees with a full recompute over FINAL determinations."
  # ---- reference data ----
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Uniqueness or non-overlap violated: duplicate npi, mrn, drg_code, label or period_label; a criteria set effective_from not strictly after every ACTIVE set; an overlapping cost reporting period; or a second OPEN period."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "The requested current_utc is not strictly after the current logical instant."

roles:
  - name: ComplianceOfficer
    description: >-
      Owns reference data, the cost reporting period ledger, denial-risk review resolution and
      stay recombination. Cannot price or finalize payment and cannot file clinical records.
    identity: opaque
    exclusive_operations:
      - "POST /ltch/referring-hospitals"
      - "POST /ltch/physicians"
      - "POST /ltch/physicians/{id}/credential-status"
      - "POST /ltch/drg-rates"
      - "POST /ltch/admission-criteria-sets"
      - "POST /ltch/cost-reporting-periods"
      - "POST /ltch/cost-reporting-periods/{id}/recompute-referral-shares"
      - "POST /ltch/cost-reporting-periods/{id}/close"
      - "POST /ltch/stays/{id}/recombine"
      - "POST /ltch/denial-risk-reviews/{id}/rescore"
      - "POST /ltch/denial-risk-reviews/{id}/resolve"
    shared_operations:
      - "POST /ltch/patients"
      - "POST /ltch/_clock/set_current_utc"
      - "every GET endpoint"
  - name: IntakeCoordinator
    description: >-
      Receives referrals, screens them against the admission criteria and admits qualifying
      patients. Cannot document care, price stays or resolve reviews.
    identity: opaque
    exclusive_operations:
      - "POST /ltch/referrals"
      - "POST /ltch/referrals/{id}/screen"
      - "POST /ltch/referrals/{id}/submit-info"
      - "POST /ltch/referrals/{id}/withdraw"
      - "POST /ltch/referrals/{id}/admit"
    shared_operations:
      - "POST /ltch/patients"
      - "POST /ltch/_clock/set_current_utc"
      - "GET /ltch/referrals, GET /ltch/referrals/{id}, GET /ltch/stays, GET /ltch/stays/{id} and the other GET endpoints"
  - name: UtilizationReviewNurse
    description: >-
      Documents the stay: interdisciplinary notes, interruptions and returns, the weaning plan and
      its SBT records, discharge, and the issuing and closing of documentation queries. Cannot
      answer a query (only a physician can) and cannot price or finalize payment.
    identity: opaque
    exclusive_operations:
      - "POST /ltch/stays/{id}/discharge"
      - "POST /ltch/stays/{id}/interrupt"
      - "POST /ltch/interruptions/{id}/return"
      - "POST /ltch/stays/{id}/weaning-plans"
      - "POST /ltch/weaning-plans/{id}/record-sbt"
      - "POST /ltch/denial-risk-reviews/{id}/documentation-queries"
      - "POST /ltch/documentation-queries/{id}/close"
    shared_operations:
      - "POST /ltch/stays/{id}/idt-notes"
      - "POST /ltch/_clock/set_current_utc"
      - "every GET endpoint except GET /ltch/referrals and GET /ltch/cost-reporting-periods/{id}"
  - name: AttendingPhysician
    description: >-
      The credentialed physician of record. Closes weaning plans and answers documentation queries;
      X-User-ID is the Physician row's id, which is what gets stamped as closed_by_physician_id and
      answered_by_physician_id.
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /ltch/weaning-plans/{id}/close"
      - "POST /ltch/documentation-queries/{id}/answer"
    shared_operations:
      - "POST /ltch/stays/{id}/idt-notes"
      - "POST /ltch/_clock/set_current_utc"
      - "GET /ltch/stays/{id}, GET /ltch/weaning-plans, GET /ltch/documentation-queries and the other clinical GET endpoints"
  - name: RevenueIntegrityAnalyst
    description: >-
      Prices and re-prices discharged stays and moves determinations through the ledger. Two
      distinct analysts are required per determination: one prices, another finalizes.
    identity: opaque
    exclusive_operations:
      - "POST /ltch/stays/{id}/payment-determinations"
      - "POST /ltch/payment-determinations/{id}/finalize"
      - "POST /ltch/payment-determinations/{id}/void"
    shared_operations:
      - "POST /ltch/_clock/set_current_utc"
      - "every GET endpoint"
