    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: ClassEnrollment
    side_effects:
      - "status=DROPPED; session.live_enrollment_count recomputed by class_enrollment_count"

  - method: GET
    path: "/fitness/class-enrollments/{enrollmentId}"
    description: "Get one class enrollment"
    roles: [MembershipOwner, Instructor, PlatformAdmin]
    code: 200
    input: []
    output: ClassEnrollment
    side_effects: []

  # --- RefurbBatch -----------------------------------------------------------
  - method: POST
    path: "/fitness/refurb-batches"
