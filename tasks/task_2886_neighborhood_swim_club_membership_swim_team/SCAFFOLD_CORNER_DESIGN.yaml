            - "${m2_filled} == 4 == 2 + 2, and neither refused call left an assignment row or moved volunteer_slots_filled"

      - name: violation_to_error_season_scope_guards_on_status_and_cross_season_joins
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - validations[priority=73]
          - endpoints[POST /swim-club/swim-team-registrations]
          - endpoints[POST /swim-club/volunteer-assignments]
        distinguishing_aspect: |
          Two seasons coexist, which is what makes the scope rules falsifiable: an implementation that
          resolves "the season" by picking the only OPEN row, or by ignoring season_id once
          membership_id is known, passes every single-season test and fails here. The PLANNED season
          shows that season_id must be validated for status and not merely for existence, and the
          cross-season registration and assignment show that the mismatch is a 422 about the request's
          internal consistency, not a 404 and not a 409.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0 and waitlist_required false."
            - "Two seasons: 2027 (OPEN, window 2027-05-22 to 2027-09-06) and 2028 (created but left PLANNED, window 2028-05-20 to 2028-09-04)."
            - "One household with an invoiced ACTIVE 2027 membership and a PENDING 2027 MINI registration, plus one 2027 meet with an open roster."
            - "The clock sits at 2027-07-01T09:00Z, so the 2027 meet is still in the future."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2028, open_date: "2028-05-20", close_date: "2028-09-04", dues_due_date: "2028-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s28_id: $.data.id, s28_status_0: $.data.status }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Two Season Household", address_line: "261 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m27_id: $.data.id }
            - call: "POST /swim-club/memberships/${m27_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m27_id}", season_id: "${s27_id}", swimmer_name: "Priya Twoseason", swimmer_birthdate: "2016-04-04", squad: "MINI" }
              as: SwimTeamCoach
              captures: { r27_id: $.data.id }
            - call: "POST /swim-club/meets"
              payload: { season_id: "${s27_id}", name: "Cross Season Control Meet", start_iso: "2027-08-07T13:00:00Z", end_iso: "2027-08-07T18:00:00Z", expected_swimmers: 40, volunteer_slots_required: 6 }
              as: SwimTeamCoach
              captures: { meet27_id: $.data.id }
          trigger:
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s28_id}", join_date: "2028-05-20", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { err_not_open: $.data.error_id }
            - call: "POST /swim-club/seasons/${s28_id}/open"
              payload: {}
              as: PoolManager
              captures: { s28_status_1: $.data.status }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s28_id}", join_date: "2028-05-20", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m28_id: $.data.id, m28_dues: $.data.assessed_dues_cents }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m27_id}", season_id: "${s28_id}", swimmer_name: "Priya Twoseason", swimmer_birthdate: "2016-04-04", squad: "MINI" }
              as: SwimTeamCoach
              captures: { err_reg_mismatch: $.data.error_id }
            - call: "POST /swim-club/memberships/${m28_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m28_id}", season_id: "${s28_id}", swimmer_name: "Priya Twoseason", swimmer_birthdate: "2016-04-04", squad: "MINI" }
              as: SwimTeamCoach
              captures: { r28_id: $.data.id }
            - call: "POST /swim-club/volunteer-assignments"
              payload: { meet_id: "${meet27_id}", swim_team_registration_id: "${r28_id}", job_code: "MARSHAL" }
              as: SwimTeamCoach
              captures: { err_asg_mismatch: $.data.error_id }
            - call: "POST /swim-club/volunteer-assignments"
              payload: { meet_id: "${meet27_id}", swim_team_registration_id: "${r27_id}", job_code: "MARSHAL" }
              as: SwimTeamCoach
              captures: { a_ok_id: $.data.id }
          assert:
            - "${s28_status_0} == PLANNED at creation, and the 2028 membership attempt returns ${err_not_open} == ERR_SEASON_NOT_OPEN with HTTP 409 - existence alone is not enough"
            - "${s28_status_1} == OPEN after the open call, and the identical membership request then succeeds with ${m28_dues} == 30000, so the refusal was about status and nothing else"
            - "a second membership for the same household is accepted because ERR_DUPLICATE_MEMBERSHIP at priority 65 is scoped per season"
            - "${err_reg_mismatch} == ERR_SEASON_MISMATCH with HTTP 422: the 2027 membership cannot carry a 2028 registration even though both the membership and the season exist"
            - "the same registration payload against ${m28_id} is HTTP 201, isolating the mismatch to the season pairing"
            - "${err_asg_mismatch} == ERR_SEASON_MISMATCH with HTTP 422: the 2027 meet cannot be joined to the 2028 registration, and this is not ERR_REGISTRATION_NOT_FOUND"
            - "the same job for the 2027 registration is HTTP 201, so the meet and the job were never the problem"
            - "both seasons remain OPEN and independent: neither refusal changed any season row"

      - name: violation_to_error_money_ceilings_on_payments_and_reserve_draws
        claim_type: violation_to_error
        grounds:
          - validations[priority=82]
          - validations[priority=83]
          - validations[priority=84]
          - calculations.capital_reserve_position
          - endpoints[POST /swim-club/capital-projects/{id}/fund]
        distinguishing_aspect: |
          Three separate ceilings that a single "amount must be positive and not absurd" check would
          collapse into one. The payment ceiling is the membership's own balance; the reserve ceiling
          is a season-level pool shared by every project; the budget ceiling belongs to the project
          alone. The fixture makes the reserve and the budget disagree - the same 150000 draw is
          refused for insufficient reserve on one project and for exceeding the budget on another -
          so the two refusals cannot be produced by the same comparison.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0; one OPEN 2027 season with an empty capital reserve."
            - "One household with a membership joined on the season's open_date and invoiced after dues_due_date, so its balance is exactly 31050 (30000 unprorated dues + 1050 late penalty)."
            - "Projects are proposed by tr-001 and approved by bp-001, so priority 5 (segregation of duties) is satisfied on every approval."
            - "Every fund call reads the project's version from a fresh GET first, so priority 39 never fires."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id, s_res_0: $.data.reserve_contributions_cents, s_unalloc_0: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Ceiling Household", address_line: "271 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id, h_guest_owed_0: $.data.guest_fee_owed_cents }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-05-22", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_total: $.data.invoice_total_cents, m_balance_0: $.data.balance_due_cents }
          trigger:
            - call: "POST /swim-club/memberships/${m_id}/payments"
              payload: { amount_cents: 40000, allocation: "DUES" }
              as: Treasurer
              captures: { err_overpay_dues: $.data.error_id }
            - call: "POST /swim-club/households/${h_id}/payments"
              payload: { amount_cents: 5000, allocation: "GUEST_FEES" }
              as: Treasurer
              captures: { err_overpay_guest: $.data.error_id }
            - call: "POST /swim-club/seasons/${s27_id}/reserve-contributions"
              payload: { amount_cents: 100000, note: "First special assessment" }
              as: Treasurer
              captures: { s_res_1: $.data.reserve_contributions_cents, s_unalloc_1: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/capital-projects"
              payload: { funding_season_id: "${s27_id}", project_kind: "POOL_RESURFACING", title: "Resurface the main tank", budget_cents: 200000 }
              as: Treasurer
              as_user_id: tr-001
              captures: { p1_id: $.data.id, p1_status_0: $.data.status, p1_funded_0: $.data.funded_cents }
            - call: "POST /swim-club/capital-projects/${p1_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { p1_status_1: $.data.status }
            - call: "GET /swim-club/capital-projects/${p1_id}"
              payload: {}
              as: Treasurer
              captures: { p1_v1: $.data.version }
            - call: "POST /swim-club/capital-projects/${p1_id}/fund"
              payload: { draw_amount_cents: 150000, expected_capital_project_version: "${p1_v1}" }
              as: Treasurer
              captures: { err_reserve: $.data.error_id }
            - call: "POST /swim-club/seasons/${s27_id}/reserve-contributions"
              payload: { amount_cents: 100000, note: "Second special assessment" }
              as: Treasurer
              captures: { s_unalloc_2: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/capital-projects"
              payload: { funding_season_id: "${s27_id}", project_kind: "PUMP_REPLACEMENT", title: "Replace the circulation pump", budget_cents: 120000 }
              as: Treasurer
              as_user_id: tr-001
              captures: { p2_id: $.data.id }
            - call: "POST /swim-club/capital-projects/${p2_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { p2_status_1: $.data.status }
            - call: "GET /swim-club/capital-projects/${p2_id}"
              payload: {}
              as: Treasurer
              captures: { p2_v1: $.data.version }
            - call: "POST /swim-club/capital-projects/${p2_id}/fund"
              payload: { draw_amount_cents: 150000, expected_capital_project_version: "${p2_v1}" }
              as: Treasurer
              captures: { err_budget: $.data.error_id }
            - call: "GET /swim-club/capital-projects/${p1_id}"
              payload: {}
              as: Treasurer
              captures: { p1_v2: $.data.version }
            - call: "POST /swim-club/capital-projects/${p1_id}/fund"
              payload: { draw_amount_cents: 150000, expected_capital_project_version: "${p1_v2}" }
              as: Treasurer
              captures: { p1_status_2: $.data.status, p1_funded_1: $.data.funded_cents }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: Treasurer
              captures: { s_res_3: $.data.reserve_contributions_cents, s_unalloc_3: $.data.reserve_unallocated_cents }
          assert:
            - "${m_total} == 31050 == 30000 + round_half_up(30000 * 0.035) and ${m_balance_0} == 31050"
            - "${err_overpay_dues} == ERR_PAYMENT_EXCEEDS_BALANCE with HTTP 422: 40000 > 31050, and the ceiling is the balance rather than the invoice's dues line"
            - "${h_guest_owed_0} == 0, so ${err_overpay_guest} == ERR_PAYMENT_EXCEEDS_BALANCE too: paying 5000 against a zero guest-fee bucket is an overpayment, not a credit"
            - "${s_res_0} == 0 and ${s_unalloc_0} == 0 on a new season; after the first contribution ${s_res_1} == 100000 and ${s_unalloc_1} == 100000"
            - "${p1_status_0} == PROPOSED with ${p1_funded_0} == 0, and ${p1_status_1} == APPROVED once bp-001 decides tr-001's proposal"
            - "${err_reserve} == ERR_INSUFFICIENT_RESERVE with HTTP 402: 150000 > 100000 unallocated, even though 150000 <= the project's 200000 budget"
            - "${s_unalloc_2} == 200000 after the second contribution, so the reserve arm is now satisfied for a 150000 draw"
            - "${err_budget} == ERR_DRAW_EXCEEDS_BUDGET with HTTP 422 on project 2: the identical 150000 draw now passes the reserve test and fails the budget test, since 0 + 150000 > 120000"
            - "the same 150000 draw on project 1 is HTTP 200 with ${p1_status_2} == FUNDED and ${p1_funded_1} == 150000"
            - "${s_res_3} == 200000 (untouched by the draw) and ${s_unalloc_3} == 50000 == 200000 - 150000: the reserve identity holds and only the unallocated side moves"
            - "no refused call moved reserve_unallocated_cents, funded_cents, amount_paid_cents or balance_due_cents"

      - name: violation_to_error_a_full_squad_blocks_the_waitlisted_confirmation
        claim_type: violation_to_error
        grounds:
          - validations[priority=75]
          - state_machines[SwimTeamRegistration].WAITLISTED_to_CONFIRMED
          - endpoints[POST /swim-club/swim-team-registrations]
        distinguishing_aspect: |
          A full squad is not an error at creation: the twenty-first swimmer is admitted as WAITLISTED,
          and only the attempt to promote it raises the error. The occupancy count includes PENDING
          registrations, so the twenty incumbents were never confirmed - an implementation that counts
          only CONFIRMED rows would see an empty squad and promote the swimmer. The fixture also shows
          that withdrawing an incumbent frees the slot, proving the count is live rather than a
          high-water mark.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0, waitlist_required false and max_household_size 4."
            - "One OPEN 2027 season."
            - "Four households SF-1..SF-4, each with member_count 4 and an invoiced ACTIVE membership, each sponsoring five PENDING MINI registrations, so the MINI squad holds exactly SQUAD_CAPACITY[MINI] == 20 registrations in PENDING and none in CONFIRMED."
            - "A fifth household SF-5 with an invoiced ACTIVE membership and no registrations yet."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            # Households SF-1..SF-4 are built by the same three calls, with address_line
            # "281 Cedar Court" .. "284 Cedar Court" and primary_contact_name
            # "Squad Household SF-1" .. "SF-4". Only SF-1 is written out; SF-2, SF-3 and SF-4
            # repeat these three calls verbatim with those substitutions.
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Squad Household SF-1", address_line: "281 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_sf1_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_sf1_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_sf1_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_sf1_id}/invoice"
              payload: {}
              as: Treasurer
            # The twenty incumbent MINI registrations are created by repeating the call below for
            # n = 1..20 with swimmer_name "Mini Swimmer 01".."Mini Swimmer 20" and
            # swimmer_birthdate 2016-01-01 + (n - 1) days. Swimmers 01-05 belong to SF-1's
            # membership, 06-10 to SF-2's, 11-15 to SF-3's and 16-20 to SF-4's. Every one of the
            # twenty is born PENDING, and none of them is ever confirmed.
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_sf1_id}", season_id: "${s27_id}", swimmer_name: "Mini Swimmer 01", swimmer_birthdate: "2016-01-01", squad: "MINI" }
              as: SwimTeamCoach
              captures: { r_first_id: $.data.id, r_first_status: $.data.status }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Squad Household SF-5", address_line: "285 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_sf5_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_sf5_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_sf5_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_sf5_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_sf5_access: $.data.access_status, m_sf5_dues: $.data.dues_status }
            - call: "GET /swim-club/swim-team-registrations"
              payload: { season_id: "${s27_id}", squad: "MINI", status: "PENDING", limit: 100 }
              as: SwimTeamCoach
              captures: { pending_list: $.data }
          trigger:
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_sf5_id}", season_id: "${s27_id}", swimmer_name: "Mini Swimmer 21", swimmer_birthdate: "2016-01-21", squad: "MINI" }
              as: SwimTeamCoach
              captures: { r21_id: $.data.id, r21_status_0: $.data.status, r21_seq: $.data.squad_seq }
            - call: "POST /swim-club/swim-team-registrations/${r21_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
              captures: { err_squad: $.data.error_id }
            - call: "POST /swim-club/swim-team-registrations/${r_first_id}/transitions"
              payload: { to_status: "WITHDRAWN" }
              as: SwimTeamCoach
              captures: { r_first_status_1: $.data.status }
            - call: "POST /swim-club/swim-team-registrations/${r21_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
              captures: { r21_status_1: $.data.status }
          assert:
            - "${r_first_status} == PENDING and ${pending_list} holds exactly 20 MINI registrations, none of them CONFIRMED"
            - "${m_sf5_access} == ACTIVE and ${m_sf5_dues} == INVOICED, so the cross-entity preconditions on the CONFIRMED edge are satisfied and cannot explain any refusal"
            - "the twenty-first registration is HTTP 201, not an error, with ${r21_status_0} == WAITLISTED and ${r21_seq} == 1 (its own membership's first swimmer)"
            - "${err_squad} == ERR_SQUAD_FULL with HTTP 409 on the promotion attempt: the count of 20 PENDING registrations is what blocks it, so PENDING occupies a slot"
            - "${r_first_status_1} == WITHDRAWN, which removes one row from the occupancy filter"
            - "the retried promotion is HTTP 200 with ${r21_status_1} == CONFIRMED: 19 < 20, so the count is live and the swimmer moves WAITLISTED -> CONFIRMED without passing through PENDING"

      - name: violation_to_error_registration_confirm_reads_the_membership
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: registration_confirm_requires_membership_access_active_and_dues_invoiced
          rationale: |
            ERR_MEMBERSHIP_NOT_IN_GOOD_STANDING at priority 46 has its own dedicated §1.8 instance,
            which drives the registration CONFIRM edge through all four combinations of access_status
            and dues_status and separates the 409 from ERR_INVALID_TRANSITION. Repeating a single
            violation here would be strictly weaker.

      - name: violation_to_error_guard_shift_create_reads_two_certifications
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: guard_shift_confirm_requires_valid_lifeguard_and_cpr_certifications
          rationale: |
            ERR_CERT_NOT_VALID_FOR_SHIFT at priority 50 is covered by a §1.8 instance that walks the
            cert wall one certification at a time - missing, expired-before-the-shift-end, revoked and
            superseded - which subsumes any single-violation corner case here.

      - name: priority_ordering_closure_outranks_delinquency_on_a_party_request
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: facility_closed_outranks_dues_delinquent_on_party_reservation
          rationale: |
            The §1.8 priority-pair instance already constructs a single request that violates both
            priority 41 (ERR_FACILITY_CLOSED) and priority 80 (ERR_DUES_DELINQUENT), asserts the lower
            priority number wins, then repairs the posture and shows the same request now failing with
            the delinquency code. That is the complete priority_ordering claim for this pair.

        # NOTE: priority_ordering is also exercised inside several of the full instances above -
        # ERR_FACILITY_RESTRICTED beating ERR_GUEST_LIMIT_EXCEEDED, ERR_BATHER_CAPACITY_EXCEEDED
        # beating nothing because ERR_ZONE_DOUBLE_BOOKED was satisfied first, and
        # ERR_VOLUNTEER_SLOTS_FULL beating ERR_DUPLICATE_VOLUNTEER_ASSIGNMENT - but the two §1.8
        # instances are the ones that isolate a single request violating exactly two rules.

      - name: priority_ordering_cert_wall_outranks_the_rest_buffer
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: cert_wall_outranks_shift_rest_buffer_on_guard_shift_create
          rationale: |
            The §1.8 instance issues one POST /swim-club/guard-shifts that violates both priority 50
            (ERR_CERT_NOT_VALID_FOR_SHIFT) and priority 62 (ERR_SHIFT_REST_BUFFER_VIOLATION), pins the
            cert wall as the winner, then fixes the certification and shows the buffer error surface
            from the identical payload. It is also the only place ERR_SHIFT_REST_BUFFER_VIOLATION is
            triggered.

  # ---------------------------------------------------------------------------
  # Endpoints (guide Table 5)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: standard_crud_lifeguard_create_read_and_list_share_one_projection
        claim_type: standard_crud
        grounds:
          - endpoints[POST /swim-club/lifeguards]
          - endpoints[GET /swim-club/lifeguards/{id}]
          - endpoints[GET /swim-club/lifeguards]
          - entities.Lifeguard
        distinguishing_aspect: |
          The three reads of one resource must agree field for field, including the computed
          certification flags: an implementation that computes has_valid_lifeguard_cert only on the
          detail read, or that serialises a list row from a leaner projection, is caught by comparing
          the same guard through POST, GET by id and GET list after a certification is recorded. The
          list filters are also shown to compose rather than to override one another.
        test_recipe:
          setup:
            - "No season and no membership are needed: the lifeguard registry is season-independent."
            - "Three guards are hired; only the first is given a VALID LIFEGUARD certification."
            - "The clock sits at 2027-07-01T09:00Z so that expires_on 2028-05-31 is in the future."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Amara Vale", hire_date: "2026-05-01" }
              as: PoolManager
              captures: { lg1_id: $.data.id, lg1_name: $.data.full_name, lg1_hire: $.data.hire_date, lg1_emp: $.data.employment_status, lg1_hours: $.data.scheduled_hours, lg1_lgc: $.data.has_valid_lifeguard_cert, lg1_cprc: $.data.has_valid_cpr_cert, lg1_v0: $.data.version }
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Bo Ferrante", hire_date: "2026-05-02" }
              as: PoolManager
              captures: { lg2_id: $.data.id }
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Cleo Nakamura", hire_date: "2026-05-03" }
              as: PoolManager
              captures: { lg3_id: $.data.id }
            - call: "GET /swim-club/lifeguards/${lg1_id}"
              payload: {}
              as: PoolManager
              captures: { d_name: $.data.full_name, d_hire: $.data.hire_date, d_emp: $.data.employment_status, d_hours: $.data.scheduled_hours, d_lgc: $.data.has_valid_lifeguard_cert, d_v0: $.data.version }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "LIFEGUARD", issued_on: "2026-06-01", expires_on: "2028-05-31" }
              as: PoolManager
              captures: { c1_id: $.data.id }
            - call: "GET /swim-club/lifeguards/${lg1_id}"
              payload: {}
              as: PoolManager
              captures: { d_lgc_2: $.data.has_valid_lifeguard_cert, d_cprc_2: $.data.has_valid_cpr_cert, d_v1: $.data.version }
            - call: "GET /swim-club/lifeguards"
              payload: { limit: 2, offset: 0 }
              as: PoolManager
              captures: { page_1: $.data }
            - call: "GET /swim-club/lifeguards"
              payload: { limit: 2, offset: 2 }
              as: PoolManager
              captures: { page_2: $.data }
            - call: "GET /swim-club/lifeguards"
              payload: { employment_status: "ACTIVE", has_valid_lifeguard_cert: true }
              as: PoolManager
              captures: { page_filtered: $.data }
            - call: "GET /swim-club/lifeguards/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PoolManager
              captures: { err_missing: $.data.error_id }
          assert:
            - "the create is HTTP 201 with ${lg1_name} == Amara Vale, ${lg1_hire} == 2026-05-01, ${lg1_emp} == ACTIVE, ${lg1_hours} == 0, ${lg1_lgc} == false and ${lg1_cprc} == false, exactly the declared defaults"
            - "${d_name} == ${lg1_name}, ${d_hire} == ${lg1_hire}, ${d_emp} == ${lg1_emp}, ${d_hours} == ${lg1_hours}, ${d_lgc} == ${lg1_lgc} and ${d_v0} == ${lg1_v0}: the detail read is byte-identical to the create response"
            - "after the certification, ${d_lgc_2} == true while ${d_cprc_2} == false, and ${d_v1} == ${lg1_v0} + 1, because recording a certification bumps the guard's version"
            - "${page_1} holds exactly 2 rows and ${page_2} exactly 1, with total_count == 3 and has_more true then false; the union of ids is exactly {${lg1_id}, ${lg2_id}, ${lg3_id}}"
            - "every row in ${page_1} carries the same key set as the detail read, including has_valid_lifeguard_cert and has_valid_cpr_cert"
            - "${page_filtered} holds exactly one row, ${lg1_id}: the two filters are ANDed, so guards 2 and 3 are ACTIVE but uncertified and drop out"
            - "${err_missing} == ERR_LIFEGUARD_NOT_FOUND with HTTP 404 for a well-formed id that names no row"

      - name: computed_read_the_staffing_window_is_a_pure_projection_at_one_instant
        claim_type: computed_read
        grounds:
          - endpoints[GET /swim-club/seasons/{id}/staffing-window]
          - calculations.staffing_ratio_compliance
          - entities.GuardShift.fields.counts_toward_ratio
        distinguishing_aspect: |
          This read has no stored counterpart: every number it returns is derived at the instant named
          by at_iso, so the same season answers differently at 13:59Z, 14:00Z and 20:01Z with no write
          in between. Two rows are deliberately present that must NOT be counted - a SUPERVISOR shift
          (counts_toward_ratio false) and a SCHEDULED shift that was never confirmed - so a naive
          "count the season's shifts" implementation over-reports coverage and calls a short-staffed
          instant compliant. The endpoint is also proved side-effect free by re-reading it.
        test_recipe:
          setup:
            - "One COUPLE category with party_privileges true; one OPEN 2027 season with bather_load_capacity 120 and baseline_bather_load 0."
            - "One household with an invoiced ACTIVE membership and one REQUESTED PAVILION reservation 2027-07-15T14:00Z-20:00Z with 12 guests and 14 hosts, so the projected load is 26 and two guards are required."
            - "Three shifts: a CONFIRMED PRIMARY 13:00Z-21:00Z, a CONFIRMED SUPERVISOR 13:00Z-21:00Z and a SCHEDULED SECONDARY 13:00Z-21:00Z, each on its own lifeguard with both certifications valid."
            - "The clock sits at 2027-07-01T09:00Z; the read never depends on the clock, only on at_iso."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Window Household", address_line: "291 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_id}", zone: "PAVILION", start_iso: "2027-07-15T14:00:00Z", end_iso: "2027-07-15T20:00:00Z", guest_count: 12, host_party_size: 14 }
              as: PoolManager
              captures: { p_id: $.data.id, p_load: $.data.projected_bather_load, p_guards: $.data.required_guard_count }
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Primary Guard", hire_date: "2026-05-01" }
              as: PoolManager
              captures: { lg_p_id: $.data.id }
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Supervisor Guard", hire_date: "2026-05-02" }
              as: PoolManager
              captures: { lg_s_id: $.data.id }
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Unconfirmed Guard", hire_date: "2026-05-03" }
              as: PoolManager
              captures: { lg_u_id: $.data.id }
            # Each of the three guards receives the same two certifications; only the first
            # guard's calls are written out. Repeat both calls for ${lg_s_id} and ${lg_u_id}.
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg_p_id}", cert_type: "LIFEGUARD", issued_on: "2026-06-01", expires_on: "2028-05-31" }
              as: PoolManager
              captures: { c_p_lg_id: $.data.id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg_p_id}", cert_type: "CPR_AED", issued_on: "2026-06-01", expires_on: "2028-05-31" }
              as: PoolManager
              captures: { c_p_cpr_id: $.data.id }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg_p_id}", season_id: "${s27_id}", shift_role: "PRIMARY", start_iso: "2027-07-15T13:00:00Z", end_iso: "2027-07-15T21:00:00Z" }
              as: PoolManager
              captures: { sh_p_id: $.data.id, sh_p_counts: $.data.counts_toward_ratio }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg_s_id}", season_id: "${s27_id}", shift_role: "SUPERVISOR", start_iso: "2027-07-15T13:00:00Z", end_iso: "2027-07-15T21:00:00Z" }
              as: PoolManager
              captures: { sh_s_id: $.data.id, sh_s_counts: $.data.counts_toward_ratio }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg_u_id}", season_id: "${s27_id}", shift_role: "SECONDARY", start_iso: "2027-07-15T13:00:00Z", end_iso: "2027-07-15T21:00:00Z" }
              as: PoolManager
              captures: { sh_u_id: $.data.id, sh_u_status: $.data.status, sh_u_counts: $.data.counts_toward_ratio }
            - call: "POST /swim-club/guard-shifts/${sh_p_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: PoolManager
              captures: { sh_p_status: $.data.status }
            - call: "POST /swim-club/guard-shifts/${sh_s_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: PoolManager
              captures: { sh_s_status: $.data.status }
          trigger:
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-15T13:59:00Z" }
              as: PoolManager
              captures: { w_before: $.data }
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-15T14:00:00Z" }
              as: PoolManager
              captures: { w_start: $.data }
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-15T19:59:00Z" }
              as: PoolManager
              captures: { w_last: $.data }
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-15T20:00:00Z" }
              as: BoardPresident
              captures: { w_end: $.data }
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-15T21:00:00Z" }
              as: HealthInspector
              captures: { w_handover: $.data }
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-15T14:00:00Z" }
              as: PoolManager
              captures: { w_start_again: $.data }
            - call: "GET /swim-club/party-reservations/${p_id}"
              payload: {}
              as: PoolManager
              captures: { p_status_after: $.data.status }
          assert:
            - "${p_load} == 26 == 0 + 12 + 14 and ${p_guards} == 2 == max(1, ceil(26 / 25))"
            - "${sh_p_counts} == true, ${sh_s_counts} == false (SUPERVISOR never counts) and ${sh_u_counts} == true with ${sh_u_status} == SCHEDULED"
            - "${sh_p_status} == CONFIRMED and ${sh_s_status} == CONFIRMED"
            - "${w_before} reports bather_load 0 (baseline only), required_guard_count 0, scheduled_guard_count 1 and compliant true at 13:59Z: the party's interval is half-open on the left, so it has not started"
            - "${w_start} reports bather_load 26, required_guard_count 2, scheduled_guard_count 1 and compliant false: the SUPERVISOR shift and the SCHEDULED shift are both excluded, which is the whole point of the fixture"
            - "${w_last} reports the same figures as ${w_start} at 19:59Z, the last covered minute"
            - "${w_end} reports bather_load 0 and required_guard_count 0 at exactly 20:00Z, because the party interval is half-open on the right"
            - "${w_handover} still reports scheduled_guard_count 1 at exactly 21:00Z, because the SHIFT interval is closed and includes its own end instant - the deliberate asymmetry with the party interval"
            - "every response echoes season_id == ${s27_id} and the at_iso it was asked about"
            - "${w_start_again} is identical to ${w_start} and ${p_status_after} == REQUESTED: the computed read mutated nothing"

      - name: cross_reference_link_every_child_collection_is_reachable_from_its_parent
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /swim-club/certifications]
          - endpoints[GET /swim-club/guard-shifts]
          - endpoints[GET /swim-club/swim-team-registrations]
          - endpoints[GET /swim-club/volunteer-assignments]
        distinguishing_aspect: |
          The API exposes no nested routes, so every parent-to-child hop is a filtered list, and the
          filter must be a real predicate rather than decoration. Two parents of the same kind are
          always present, so an implementation that ignores the filter and returns the whole table is
          caught by the row counts. The junction entity is walked from BOTH sides - by meet_id and by
          swim_team_registration_id - which is the property that makes the many-to-many navigable.
        test_recipe:
          setup:
            - "One COUPLE category; one OPEN 2027 season."
            - "Two lifeguards, each with two certifications and one shift, so both certification and shift lists have two candidate parents."
            - "Two households, each with an invoiced ACTIVE membership and one MINI registration."
            - "Two meets, each with volunteer_slots_required 6, and four assignments: registration R1 works both meets, registration R2 works only meet M1."
            - "The clock sits at 2027-07-01T09:00Z."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Link Guard One", hire_date: "2026-05-01" }
              as: PoolManager
              captures: { lg1_id: $.data.id }
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Link Guard Two", hire_date: "2026-05-02" }
              as: PoolManager
              captures: { lg2_id: $.data.id }
            # Both guards receive a LIFEGUARD and a CPR_AED certification expiring 2028-05-31;
            # only guard one's two calls are written out. Repeat both for ${lg2_id}.
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "LIFEGUARD", issued_on: "2026-06-01", expires_on: "2028-05-31" }
              as: PoolManager
              captures: { c1_lg_id: $.data.id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "CPR_AED", issued_on: "2026-06-01", expires_on: "2028-05-31" }
              as: PoolManager
              captures: { c1_cpr_id: $.data.id }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg1_id}", season_id: "${s27_id}", shift_role: "PRIMARY", start_iso: "2027-07-15T13:00:00Z", end_iso: "2027-07-15T19:00:00Z" }
              as: PoolManager
              captures: { sh1_id: $.data.id }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg2_id}", season_id: "${s27_id}", shift_role: "SECONDARY", start_iso: "2027-07-15T13:00:00Z", end_iso: "2027-07-15T19:00:00Z" }
              as: PoolManager
