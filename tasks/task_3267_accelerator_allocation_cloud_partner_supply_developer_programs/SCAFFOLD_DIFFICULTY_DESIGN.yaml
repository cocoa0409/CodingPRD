  - name: evaluation_loan_approval_requires_qualified_partner_and_ring_fence
    grounds:
    - state_machines.EvaluationLoan.REQUESTED_to_APPROVED
    - entities.PartnerAccount.fields.qualification_status
    - entities.AcceleratorProduct.fields.reserved_evaluation_units
    - errors.ERR_QUALIFICATION_NOT_MET
    distinguishing_aspect: 'The depends-on pair is EvaluationLoan -> PartnerAccount: two loans for

      the same SKU and the same unit count are approved normally through the

      evaluation loop, but the loan whose partner never left APPLIED is

      refused with ERR_QUALIFICATION_NOT_MET while the product''s ring fence

      still moves for the qualified one.

