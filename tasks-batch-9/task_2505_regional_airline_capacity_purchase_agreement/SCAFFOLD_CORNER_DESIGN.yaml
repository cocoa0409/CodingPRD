              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-3202", seat: "CAPTAIN", hire_class_date: "2026-04-01" }
              as: RegionalOpsController
              captures: { p2: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
