  - rule_id: resource_temporal_overlap
    instances:
      - name: rig_window_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_RIG_DOUBLE_BOOKED]
          - calculations.rig_committed_hours
        distinguishing_aspect: |
          Resource: Subcontractor rig fleet. Interval semantics: half-open [start, end) — a new
          assignment starting exactly at the predecessor's window_end is LEGAL, while one
          overlapping by one hour is rejected with ERR_RIG_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Project SCOPED, plan APPROVED with planned_boring_count=2, borings B-1 and B-2 PLANNED; subcontractor with existing assignment on B-1 [2026-08-03T08:00, 2026-08-03T16:00)"
