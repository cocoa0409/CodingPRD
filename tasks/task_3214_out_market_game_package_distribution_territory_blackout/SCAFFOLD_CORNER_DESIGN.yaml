        captures:
          fin_len_probe: $.data.package_game_count
      - call: POST /week-slates/${slate_id}/reopen
        payload: {}
        as: LeagueOps
        captures:
          fin_after_reopen: $.data.finalized_game_ids
          cnt_after_reopen: $.data.package_game_count
      assert:
      - 'at slate creation: package_game_count == 0'
      - 'after two game creates: package_game_count == 2 (derived field reconciled on source growth)'
      - 'after finalize: finalized_game_ids holds both game ids'
      - 'after reopen: finalized_game_ids == [] and package_game_count == 2'
  - name: scheduled_transitions_fire_on_clock_advance
    claim_type: scheduled_actions
    grounds:
    - state_machines.RightsGrant.ACTIVE_to_EXPIRED
    - state_machines.StudentVerification.VERIFIED_to_EXPIRED
    - endpoints.POST_/_clock/set_current_utc
    distinguishing_aspect: "Setting the logical clock past a grant's effective_until flips it ACTIVE \u2192 EXPIRED (with the full cascade), and past a verification's valid_through flips it VERIFIED \u2192\
      \ EXPIRED \u2014 deferred actions execute at clock-set, not by wall-clock."
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; grant effective_until 2026-10-01T00:00:00Z; verification valid_through 2026-10-01T00:00:00Z.
