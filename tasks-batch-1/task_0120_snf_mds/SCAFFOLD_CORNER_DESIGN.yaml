scaffold_corner_design:

  # =====================================================================
  # Entities — creation, retrieval, listing, not-found, required fields,
  # defaults, computed/system fields, type constraints
  # =====================================================================
  - section: entities
    instances:
      - name: facility_create_returns_201_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Facility.fields.occupied_bed_count
          - entities.Facility.fields.health_inspection_rating
          - endpoints
        distinguishing_aspect: "POST /snf/facilities with required fields returns 201; occupied_bed_count==0, health_inspection_rating defaults to 3 when omitted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /snf/facilities"
              payload: { name: "Corner Fac", cms_certification_number: "CCN-COR1", certified_bed_count: 8 }
              as: Administrator
              captures: { fac_id: $.data.id, occ: $.data.occupied_bed_count, hir: $.data.health_inspection_rating }
          assert:
            - "response status == 201"
            - "Facility.${fac_id}.occupied_bed_count == 0"
            - "Facility.${fac_id}.health_inspection_rating == 3"

      - name: facility_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", entities.Facility]
        distinguishing_aspect: "GET /snf/facilities/{id} with a random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /snf/facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == 'ERR_NOT_FOUND'"

      - name: resident_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", entities.Resident.fields.medical_record_number]
        distinguishing_aspect: "POST /snf/residents omitting medical_record_number returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a facility exists"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "RC Fac", cms_certification_number: "CCN-RC1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /snf/residents"
              payload: { full_name: "No MRN", date_of_birth: "1940-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: resident_create_initial_status_prospective
        claim_type: Defaults
        grounds: [entities.Resident.fields.status]
        distinguishing_aspect: "A newly registered resident has status==PROSPECTIVE (system default)."
        test_recipe:
          setup: ["a facility exists"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "RS Fac", cms_certification_number: "CCN-RS1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /snf/residents"
              payload: { full_name: "New Res", medical_record_number: "MRN-RS1", date_of_birth: "1941-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id, st: $.data.status }
          assert:
            - "Resident.${res_id}.status == 'PROSPECTIVE'"

      - name: admission_create_invalid_payer_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", entities.Admission.fields.payer_source]
        distinguishing_aspect: "POST /snf/admissions with payer_source 'SELF_PAY' (not in enum) returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["facility, resident, PASRR"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "PE Fac", cms_certification_number: "CCN-PE1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "PE Res", medical_record_number: "MRN-PE1", date_of_birth: "1942-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
          trigger:
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "SELF_PAY", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: qualifying_stay_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.QualifyingStay, calculations.qualifying_stay_midnights]
        distinguishing_aspect: "QualifyingStay is common_fields:false — created via POST and fetched via GET /snf/qualifying-stays/{id}; midnights_count 4 persists; it carries id+created_at but no update endpoint or version field."
        test_recipe:
          setup: ["facility, resident"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "QSi Fac", cms_certification_number: "CCN-QSI1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "QSi Res", medical_record_number: "MRN-QSI1", date_of_birth: "1943-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id, mc: $.data.midnights_count }
            - call: "GET /snf/qualifying-stays/${qs_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { mc2: $.data.midnights_count }
          assert:
            - "QualifyingStay.${qs_id}.midnights_count == 4"

      - name: list_residents_by_facility_pagination_envelope
        claim_type: Listing
        grounds: [entities.Resident.fields.primary_facility_id, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /snf/residents?primary_facility_id=<fac> returns response_type array with total_count 1 and has_more false; FK reverse-reachability for Resident.primary_facility_id."
        test_recipe:
          setup: ["a facility with one resident"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "LR Fac", cms_certification_number: "CCN-LR1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "LR Res", medical_record_number: "MRN-LR1", date_of_birth: "1944-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /snf/residents?primary_facility_id=${fac_id}"
              payload: { primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response_type == 'array'"
            - "meta.total_count == 1"
            - "meta.has_more == false"

      - name: admission_medicare_covered_computed_true
        claim_type: Computed Fields
        grounds: [entities.Admission.fields.medicare_covered, calculations.qualifying_stay_midnights]
        distinguishing_aspect: "After activate, a MEDICARE_A admission linked to a qualifying (>=3 midnight) stay has medicare_covered==true (computed, client input ignored)."
        test_recipe:
          setup: ["Medicare admission with qualifying stay, PASRR CLEARED, activated"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "MC Fac", cms_certification_number: "CCN-MC1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "MC Res", medical_record_number: "MRN-MC1", date_of_birth: "1945-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
          trigger:
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
              captures: { mc: $.data.medicare_covered, st: $.data.status }
          assert:
            - "Admission.${adm_id}.medicare_covered == true"
            - "Admission.${adm_id}.status == 'ACTIVE'"

  # =====================================================================
  # State machines — initial state, invalid-from, terminal lockdown,
  # idempotency, valid transitions, branch side-effects
  # =====================================================================
  - section: state_machines
    instances:
      - name: claim_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Claim, entities.Claim.fields.status]
        distinguishing_aspect: "A newly created claim starts in DRAFT (initial_state)."
        test_recipe:
          setup: ["Medicare admission with SUBMITTED assessment"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "CI Fac", cms_certification_number: "CCN-CI1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/pdpm-rates"
              payload: { component: "PT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 7000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "OT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 6000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "SLP", case_mix_group: "SB", case_mix_index: 1.46, base_rate_cents: 2025, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NTA", case_mix_group: "NB", case_mix_index: 2.53, base_rate_cents: 8000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NURSING", case_mix_group: "NURS", case_mix_index: 1.00, base_rate_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/residents"
              payload: { full_name: "CI Res", medical_record_number: "MRN-CI1", date_of_birth: "1946-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { mds_id: $.data.id }
            - call: "POST /snf/assessments/${mds_id}/start"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/complete"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/submit"
              payload: {}
              as: MdsCoordinator
          trigger:
            - call: "POST /snf/admissions/${adm_id}/claims"
              payload: { driving_assessment_id: "${mds_id}", period_start_at: "2026-02-01T00:00:00Z", period_end_at: "2026-02-06T00:00:00Z" }
              as: BillingAnalyst
              captures: { claim_id: $.data.id, st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == 'DRAFT'"

      - name: claim_finalize_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.ESTIMATED_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling finalize on a DRAFT claim (not ESTIMATED) is an invalid-from transition -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["a DRAFT claim on a Medicare admission with SUBMITTED assessment"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "FD Fac", cms_certification_number: "CCN-FD1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/pdpm-rates"
              payload: { component: "PT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 7000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "OT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 6000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "SLP", case_mix_group: "SB", case_mix_index: 1.46, base_rate_cents: 2025, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NTA", case_mix_group: "NB", case_mix_index: 2.53, base_rate_cents: 8000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NURSING", case_mix_group: "NURS", case_mix_index: 1.00, base_rate_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/residents"
              payload: { full_name: "FD Res", medical_record_number: "MRN-FD1", date_of_birth: "1947-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { mds_id: $.data.id }
            - call: "POST /snf/assessments/${mds_id}/start"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/complete"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/submit"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/admissions/${adm_id}/claims"
              payload: { driving_assessment_id: "${mds_id}", period_start_at: "2026-02-01T00:00:00Z", period_end_at: "2026-02-06T00:00:00Z" }
              as: BillingAnalyst
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /snf/claims/${claim_id}/finalize"
              payload: {}
              as: BillingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"

      - name: care_plan_terminal_closed_lockdown_rejects_begin_review
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CarePlan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal CLOSED, begin-review is rejected 409 ERR_INVALID_STATE — terminal lockdown."
        test_recipe:
          setup: ["a PRIVATE admission with a care plan activated then closed"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "TL Fac", cms_certification_number: "CCN-TL1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "TL Res", medical_record_number: "MRN-TL1", date_of_birth: "1948-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "PRIVATE", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/care-plans"
              payload: { review_interval_days: 90 }
              as: Physician
              captures: { cp_id: $.data.id }
            - call: "POST /snf/care-plans/${cp_id}/goals"
              payload: { description: "Goal", target_date: "2026-03-01T00:00:00Z" }
              as: Physician
            - call: "POST /snf/care-plans/${cp_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /snf/care-plans/${cp_id}/close"
              payload: {}
              as: Physician
          trigger:
            - call: "POST /snf/care-plans/${cp_id}/begin-review"
              payload: {}
              as: Physician
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"

      - name: assessment_submit_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.MdsAssessment.COMPLETED_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED assessment a second time is rejected 409 ERR_INVALID_STATE (terminal SUBMITTED)."
        test_recipe:
          setup: ["Medicare admission with a SUBMITTED assessment"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "ID Fac", cms_certification_number: "CCN-ID1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "ID Res", medical_record_number: "MRN-ID1", date_of_birth: "1949-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
