            - "Segment.${sg}.member_count == 1"

  # =====================================================================
  # Errors
  # =====================================================================
  - section: errors
    instances:
      - name: error_campaign_not_open_on_pledge
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAMPAIGN_NOT_OPEN]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / gift_requires_campaign_open
          rationale: "ERR_CAMPAIGN_NOT_OPEN is exercised as the failure path of the named §1.8 cross-entity instance (gift against a CLOSED campaign); pledge variant is the same error condition."
      - name: error_stale_version_covered_by_occ_section
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: compensating_invariant / refund_conserves_campaign_raised_hard
          rationale: "ERR_STALE_VERSION OCC behavior is enumerated in the cross_cutting optimistic_concurrency section below; the refund/cancel happy paths that bump version are exercised in §1.8 refund cascades."
      - name: error_lapse_window_not_met
        claim_type: violation_to_error
        grounds: ["errors[ERR_LAPSE_WINDOW_NOT_MET]", "validations[priority=14]"]
        distinguishing_aspect: "flag-lapsed before the inactivity window is met returns ERR_LAPSE_WINDOW_NOT_MET (409)."
        test_recipe:
          setup: ["Clock 2026-01-01; OPEN campaign; donor lapse_threshold 365; gift ACKNOWLEDGED (ACTIVE, last_gift 2026-01-01); clock only 2026-02-01 (31 days, < 365)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DonorRelations
            - call: "POST /campaigns"
              payload: { name: "Lw", goal_cents: 1000000, starts_on: "2025-12-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Lw", email: "lw@x.com", lapse_threshold_days: 365 }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DonorRelations
