      - name: war_rate_takes_the_worse_port_tier_and_zero_when_cover_is_declined
        claim_type: correct_result
        grounds:
          - calculations.certificate_premium_components
          - entities.Port.fields.war_rate_multiplier
          - state_machines.Certificate.war_cover_status.PENDING_to_NOT_TAKEN
        distinguishing_aspect: |
          Two claims in one fixture that a naive rate model gets wrong: the war
          rate uses max(loading, discharge) multiplier — a GREEN load port
          cannot dilute an AMBER discharge port, so the war rate is
          round(0.600 * 1.5, 4) = 0.9000 and the war premium 1039.50, not
          693.00 and not the average 866.25 — while declining war and strikes
          on an identically-priced second certificate lands the war axis in the
          terminal NOT_TAKEN state with both components at exactly 0.00 and the
          base premium untouched at 5457.38.
        test_recipe:
          setup:
            - "loading port SGSIN GREEN (multiplier 1.0), discharge port NLRTM created directly at AMBER (multiplier 1.5)"
            - "two certificates on the same vessel and sailing date, each insuring 1155000.00"
            - "CERT-WAR requests war and strikes; CERT-NOWAR declines both"
