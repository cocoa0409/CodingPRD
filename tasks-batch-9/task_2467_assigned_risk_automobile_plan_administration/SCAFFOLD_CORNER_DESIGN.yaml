      - name: an_at_fault_closure_restarts_the_clean_years_curve
        claim_type: decay_function
        grounds:
          - calculations.clean_years_credited
          - endpoints[POST /plan/claims/{id}/closure].side_effects
          - errors[ERR_CLEAN_YEARS_INSUFFICIENT]
          - entities.Applicant.fields.last_chargeable_event_date
        distinguishing_aspect: |
          The clean-years clock is a decay curve with a reset event, and the reset arrives from a
          different entity: closing an AT-FAULT claim moves last_chargeable_event_date to the LOSS
          date, so a driver sitting at the 5-year cap drops to 0 in one write and the voluntary-market
          exit that would have been legal a moment earlier is refused. A not-at-fault closure would
          have left the curve untouched.
