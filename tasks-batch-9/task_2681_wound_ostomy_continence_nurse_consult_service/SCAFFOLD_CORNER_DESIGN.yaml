              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Pia Probe", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-rounds"
              payload: { round_type: "PREVALENCE", window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-02T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r1_id: "$.data.id" }
            - call: "POST /survey-rounds/${r1_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "Blanchable erythema over the right heel." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /survey-observations"
              payload: { survey_round_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc", unit_id: "${u1_id}", patient_id: "dddddddd-dddd-4ddd-8ddd-dddddddddddd", observer_nurse_id: "${n1_id}", observed_at: "2026-08-01T00:00:00Z", injury_present: false, classification: "NONE", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { err_round_first: "$.data.error_id" }
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${r1_id}", unit_id: "${u1_id}", patient_id: "dddddddd-dddd-4ddd-8ddd-dddddddddddd", observer_nurse_id: "eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee", observed_at: "2026-08-01T00:00:00Z", injury_present: false, classification: "NONE", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { err_patient_before_nurse: "$.data.error_id" }
            - call: "POST /dressing-protocols"
              payload: { consult_request_id: "ffffffff-ffff-4fff-8fff-ffffffffffff", formulary_product_id: "12121212-1212-4212-8212-121212121212", change_frequency_hours: 24, units_per_change: 1 }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { err_consult_before_product: "$.data.error_id" }
            - call: "POST /consult-requests/33333333-3333-4333-8333-333333333333/assign"
              payload: { assigned_nurse_id: "eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee" }
              as: WocProgramDirector
              captures: { err_path_before_body: "$.data.error_id" }
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee" }
              as: WocProgramDirector
              captures: { err_nurse_before_state: "$.data.error_id" }
          assert:
            - "Call 1 returns HTTP 404 with data.error_id == ERR_SURVEY_ROUND_NOT_FOUND — survey_round_id is declared before patient_id, so the unknown patient is never reported"
            - "Call 2 returns HTTP 404 with data.error_id == ERR_PATIENT_NOT_FOUND — patient_id is declared before observer_nurse_id"
            - "Call 3 returns HTTP 404 with data.error_id == ERR_CONSULT_NOT_FOUND — consult_request_id is declared before formulary_product_id, so the unknown product is never reported"
            - "Call 4 returns HTTP 404 with data.error_id == ERR_CONSULT_NOT_FOUND from the PATH id (priority 4), not ERR_NURSE_NOT_FOUND from the body (priority 5)"
            - "Call 5 returns HTTP 404 with data.error_id == ERR_NURSE_NOT_FOUND, NOT HTTP 409 ERR_CONSULT_INVALID_STATE — the body-FK existence check at priority 5 runs before the REQUESTED-cannot-be-assigned state gate at priority 10"
            - "Nothing was written: GET /survey-observations?survey_round_id=${r1_id} returns total_count == 0, SurveyRound.${r1_id}.observation_count == 0, GET /dressing-protocols returns total_count == 0"
            - "ConsultRequest.${c1_id}.status is still REQUESTED with assigned_nurse_id == null and version == 1, and WocNurse.${n1_id}.active_consult_load == 0"

      - name: missing_or_unknown_role_header_rejected_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[POST /units]
          - endpoints[GET /units]
        distinguishing_aspect: "Priority 1 fires before the role-membership check at priority 2, so a request with no auth headers and a request whose X-User-Role is a plausible but undeclared role name (OrthopedicTech) both return 401 ERR_UNAUTHENTICATED, never 403 ERR_UNAUTHORIZED — and reads are gated identically to writes."
        test_recipe:
          setup:
            - "One Unit U1 already exists, created by an authenticated WocProgramDirector."
            - "`as: Anonymous` below denotes a request sent with NEITHER the X-User-Role nor the X-User-ID header; `as: OrthopedicTech` denotes X-User-Role set to a string that is not one of the five declared roles."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "AUTH-U1", name: "Auth Probe Unit", bed_count: 10, rental_budget_cap_cents: 50000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
          trigger:
            - call: "POST /units"
              payload: { unit_code: "AUTH-U2", name: "Header-less Unit", bed_count: 10 }
              as: Anonymous
              captures: { err_no_header: "$.data.error_id" }
            - call: "POST /units"
              payload: { unit_code: "AUTH-U3", name: "Unknown Role Unit", bed_count: 10 }
              as: OrthopedicTech
              captures: { err_unknown_role: "$.data.error_id" }
            - call: "GET /units"
              payload: {}
              as: Anonymous
              captures: { err_read: "$.data.error_id" }
            - call: "GET /units"
              payload: {}
              as: MaterialsCoordinator
          assert:
            - "Call 1 returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "Call 2 returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED — an undeclared role name fails authentication at priority 1, it does not reach the priority-2 authorisation check and therefore never yields 403"
            - "Call 3 returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED — GET endpoints are covered by `applies_to: all`, so unauthenticated reads are refused too"
            - "Call 4 (control, an authenticated shared-read role) returns HTTP 200 with total_count == 1 and data[0].id == ${u1_id}"
            - "Neither AUTH-U2 nor AUTH-U3 was created: the Unit table still holds exactly one row after all four calls"

  # ==========================================================================
  # SECTION: rbac  (claim-extraction-guide Table 7). Five roles, role_model
  # segregation_of_duties. Covered here: every role can run its own exclusive
  # operations, cannot run another role's exclusive operations (403
  # ERR_UNAUTHORIZED), the two shared operations really are shared, and the
  # two segregation-of-duties facets that the validations section did not
  # already take (restage must be the ORIGINAL stager; the RCA lead must NOT
  # be the stager).
  # ==========================================================================
  - section: rbac
    instances:
      - name: unit_charge_cannot_perform_other_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles[UnitCharge].exclusive_operations
          - roles[WocNurse].exclusive_operations
          - roles[WocProgramDirector].exclusive_operations
          - roles[MaterialsCoordinator].exclusive_operations
          - roles[SystemOperator].exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "UnitCharge is refused on one exclusive operation of each of the other four roles (triage, unit creation, surface creation, clock movement) with 403 ERR_UNAUTHORIZED, while its own exclusive POST /patients and its shared GET both succeed in the same run — so the denial is role-scoped, not a blanket lockout."
        test_recipe:
          setup:
            - "Unit U1 exists, Patient P1 is ADMITTED on U1, and ConsultRequest C1 sits in REQUESTED (never triaged)."
            - "C1 is left in REQUESTED deliberately: the priority-2 role check must fire before the priority-10 state check, so the triage attempt below must return 403 and not 409."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "RBAC-U1", name: "RBAC Probe Med-Surg", bed_count: 20, rental_budget_cap_cents: 100000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "RBACMRN01", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Sacral redness that does not blanch." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { err_triage: "$.data.error_id" }
            - call: "POST /units"
              payload: { unit_code: "RBAC-U9", name: "Unit The Charge Nurse Should Not Create", bed_count: 8 }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { err_unit: "$.data.error_id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "RBAC-S9", surface_class: "FOAM_OVERLAY", daily_rate_cents: 4000, vendor_name: "Probe Rentals" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { err_surface: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { err_clock: "$.data.error_id" }
            - call: "POST /patients"
              payload: { mrn: "RBACMRN02", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p2_id: "$.data.id" }
            - call: "GET /consult-requests?requesting_unit_id=${u1_id}"
              payload: {}
              as: UnitCharge
              as_user_id: "${u1_id}"
          assert:
            - "Call 1 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — NOT 409 ERR_CONSULT_INVALID_STATE, because priority 2 precedes priority 10"
            - "Call 2 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED (POST /units is WocProgramDirector-exclusive)"
            - "Call 3 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED (POST /support-surfaces is MaterialsCoordinator-exclusive)"
            - "Call 4 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED (the clock is SystemOperator-exclusive)"
            - "Call 5 returns HTTP 201 — POST /patients is UnitCharge's own exclusive operation"
            - "Call 6 returns HTTP 200 with total_count == 1 and data[0].id == ${c1_id} — every GET is shared with UnitCharge"
            - "No denied call had any effect: ConsultRequest.${c1_id}.status == REQUESTED with acuity_score == null, priority_band == null and version == 1; the Unit table holds exactly one row; the SupportSurface table is empty"
            - "The clock never moved: Patient.${p2_id} was accepted with admitted_at == 2026-07-31T00:00:00Z, and a subsequent POST /patients carrying admitted_at == 2026-08-09T00:00:00Z would still fail the `admitted_at <= logical clock` constraint"

      - name: materials_coordinator_cannot_write_clinical_rows_while_order_creation_stays_shared
        claim_type: shared_operations
        grounds:
          - roles[MaterialsCoordinator].exclusive_operations
          - roles[MaterialsCoordinator].shared_operations
          - roles[WocNurse].shared_operations
          - endpoints[POST /support-surface-orders]
          - endpoints[POST /support-surface-orders/{order_id}/approve]
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /support-surface-orders is the one write both MaterialsCoordinator and WocNurse may issue, and the two orders it produces are byte-identical in their computed money fields; approve immediately afterwards is MaterialsCoordinator-only, so the same WocNurse who legitimately created an order is refused 403 on approving it."
        test_recipe:
          setup:
            - "Unit U1 has rental_budget_cap_cents 400000 and rental_available_cents 400000."
            - "Patient P1 is ADMITTED on U1; WocNurse N1 exists (TRAINEE is sufficient — order creation has no certification gate)."
            - "Two AVAILABLE support surfaces S1 and S2 both rent at 10000 cents/day."
            - "Unit.version has been read as ${uv1} so the approve below carries a live OCC token."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "RBAC-U2", name: "RBAC Probe Surgical", bed_count: 22, rental_budget_cap_cents: 400000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "RBACMRN03", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 1, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Rita Shared", home_unit_id: "${u1_id}", ce_credits: 12 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "RBAC-S1", surface_class: "LOW_AIR_LOSS", daily_rate_cents: 10000, vendor_name: "Probe Rentals" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "RBAC-S2", surface_class: "LOW_AIR_LOSS", daily_rate_cents: 10000, vendor_name: "Probe Rentals" }
              as: MaterialsCoordinator
              captures: { s2_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { uv1: "$.data.version" }
          trigger:
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "13131313-1313-4313-8313-131313131313", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_2", measured_area_cm2: 4.0, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}" }
              as: MaterialsCoordinator
              captures: { err_assessment: "$.data.error_id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Materials should not be able to open a consult." }
              as: MaterialsCoordinator
              captures: { err_consult: "$.data.error_id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-02T00:00:00Z", rental_end: "2026-08-05T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s2_id}", rental_start: "2026-08-02T00:00:00Z", rental_end: "2026-08-05T00:00:00Z", authorized_days: 3 }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { o2_id: "$.data.id" }
            - call: "POST /support-surface-orders/${o2_id}/approve"
              payload: { expected_unit_version: "${uv1}" }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { err_approve: "$.data.error_id" }
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${uv1}" }
              as: MaterialsCoordinator
          assert:
            - "Call 1 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — staging is WocNurse-exclusive, and the role check at priority 2 fires before the unknown consult_request_id would have produced a 404"
            - "Call 2 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — opening a consult is UnitCharge-exclusive"
            - "Call 3 returns HTTP 201 with billable_days == 3, projected_cost_cents == 30000, vendor_service_fee_cents == 2400 and authorized_cost_cents == 32400"
            - "Call 4 returns HTTP 201 with exactly the same computed money fields (billable_days == 3, projected_cost_cents == 30000, vendor_service_fee_cents == 2400, authorized_cost_cents == 32400) — the shared endpoint behaves identically for either role"
            - "Call 5 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — approve is MaterialsCoordinator-exclusive even for the WocNurse who created the order"
            - "Call 6 returns HTTP 200 with fulfillment_status == APPROVED and billing_status == ENCUMBERED"
            - "After call 6: Unit.${u1_id}.rental_encumbered_cents == 32400, rental_committed_cents == 0, rental_available_cents == 367600 and version == 2 (1 at creation, +1 from the single approve)"
            - "The refused approve left no trace: SupportSurfaceOrder.${o2_id}.fulfillment_status == REQUESTED, billing_status == UNBILLED, and SupportSurface.${s2_id}.status == AVAILABLE while SupportSurface.${s1_id}.status == IN_USE"
            - "No clinical row exists: GET /skin-assessments returns total_count == 0 and GET /consult-requests returns total_count == 0"

      - name: system_operator_cannot_read_or_write_business_rows_and_owns_the_clock
        claim_type: exclusive_operations
        grounds:
          - roles[SystemOperator].exclusive_operations
          - roles[SystemOperator].shared_operations
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
          - global_constants.DEFAULT_LOGICAL_CLOCK
        distinguishing_aspect: "SystemOperator declares an empty shared_operations list, so it is refused even on GET /units — and conversely the clock endpoint is refused to WocProgramDirector, whose 2026-08-10 request must leave the clock exactly where SystemOperator put it (2026-08-03), provable because admitted_at == 2026-08-02 is then accepted while admitted_at == 2026-08-04 is not."
        test_recipe:
          setup:
            - "Unit U1 and ADMITTED Patient P1 exist; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "RBAC-U3", name: "RBAC Probe Rehab", bed_count: 14, rental_budget_cap_cents: 100000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "RBACMRN04", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /units"
              payload: { unit_code: "RBAC-U8", name: "Unit The Operator Should Not Create", bed_count: 6 }
              as: SystemOperator
              captures: { err_unit: "$.data.error_id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_1", clinical_note: "The operator has no clinical authority." }
              as: SystemOperator
              captures: { err_consult: "$.data.error_id" }
            - call: "GET /units"
              payload: {}
              as: SystemOperator
              captures: { err_read: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: WocProgramDirector
              captures: { err_clock: "$.data.error_id" }
            - call: "POST /patients"
              payload: { mrn: "RBACMRN05", unit_id: "${u1_id}", admitted_at: "2026-08-02T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p2_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "RBACMRN06", unit_id: "${u1_id}", admitted_at: "2026-08-04T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { err_future_admit: "$.data.error_id" }
          assert:
            - "Call 1 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "Call 2 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "Call 3 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — SystemOperator's shared_operations list is empty, so it does not inherit the GET surface the other four roles share"
            - "Call 4 returns HTTP 200 — POST /_clock/set_current_utc is SystemOperator's only operation"
            - "Call 5 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — the clock is not a director privilege"
            - "Call 6 returns HTTP 201, proving the clock advanced to 2026-08-03T00:00:00Z (admitted_at == 2026-08-02T00:00:00Z would have been rejected at the default clock of 2026-08-01T00:00:00Z)"
            - "Call 7 returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST, proving the refused director clock-set never landed — the clock is still 2026-08-03T00:00:00Z, not 2026-08-10T00:00:00Z"
            - "The Unit table still holds exactly one row and GET /consult-requests (as WocProgramDirector) returns total_count == 0"
            - "Exactly two Patient rows exist: ${p1_id} and ${p2_id}; RBACMRN06 was never created"

      - name: restage_requires_the_original_stager_while_rca_lead_must_differ_from_it
        claim_type: Segregation of duties
        grounds:
          - validations[priority=30]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.SkinAssessment.DISPUTED_to_PENDING_VALIDATION
          - state_machines.PressureInjuryCase.RCA_REQUIRED_to_RCA_IN_PROGRESS
          - endpoints[POST /skin-assessments/{assessment_id}/restage]
          - endpoints[POST /pressure-injury-cases/{case_id}/rca-start]
        distinguishing_aspect: "Priority 30 points in OPPOSITE directions on the two endpoints it guards: restage demands X-User-ID == staged_by_nurse_id (a stranger is refused) while rca-start demands rca_lead_nurse_id != staged_by_nurse_id (the stager is refused) — and on the refused rca-start the stager is also uncertified, so the 422 must be ERR_SEGREGATION_OF_DUTIES (priority 30) and not ERR_NURSE_NOT_CERTIFIED (priority 32)."
        test_recipe:
          setup:
            - "Unit U1 exists; Patient P1 was admitted 2026-07-30T00:00:00Z on U1 with comorbidity_count 2 and device_related_risk false."
            - "WocNurse N1 (Sara Stager) is CANDIDATE — one sign-off then advance, so it can hold an assignment but is NOT certification-eligible as an RCA lead."
            - "WocNurse N2 (Vera Verifier) is CERTIFIED — 30 CE credits, two sign-offs, advance, certify (certification_eligibility_score 64.00)."
            - "ConsultRequest C1 (WOUND, reported_stage STAGE_3) was triaged and assigned to N1; N1 then filed SkinAssessment A1 on the SACRUM (observed_stage STAGE_3, 12.0 cm2, observed_at 2026-08-01T00:00:00Z), which auto-created PressureInjuryCase K1 (UNDETERMINED / OPEN)."
            - "The logical clock stays at its default 2026-08-01T00:00:00Z, which is past P1's POA window end of 2026-07-31T00:00:00Z, so declining the present-on-admission claim yields HAPI."
          setup_api_calls:
