  # ============================================================== VALIDATIONS
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without the X-User-Role header is rejected 400 before any role or existence check runs (the unit test strips the header; the as: field documents intent only)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [] }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400 (header stripped by the test harness)"

      - name: order_submit_unknown_id_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Submit against a well-formed but nonexistent order id returns 404 — existence (priority 4) precedes any state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/supply-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/submit", as: Patient, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: order_create_unknown_patient_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that does not resolve (patient_id) is a 404 even though all other payload fields are well-formed."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
          trigger:
            - { call: "POST /api/supply-orders", payload: { patient_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 2 } ], expected_patient_version: "${prog_v}" }, as: Patient, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404 (existence precedes the OCC version check)"

      - name: ownership_foreign_order_submit_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Patient B submitting patient A's order fails ownership (priority 3) before the order's own state is consulted."
        test_recipe:
          setup: ["program; patient A with a DRAFT May order; patient B"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat_a: $.data.id } }
            - { call: "GET /api/patients/${pat_a}", as: ProgramAdmin, captures: { pa_v: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat_a}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 2 } ], expected_patient_version: "${pa_v}" }, as: Patient, as_user_id: "${pat_a}", captures: { ord: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat B", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat_b: $.data.id } }
          trigger:
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP, http 403"

      - name: submit_while_training_returns_posture_error
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_POSTURE_NOT_ORDERABLE]", calculations.posture_derivation]
        distinguishing_aspect: "A TRAINING patient's DRAFT order passes existence/state/month checks but fails the posture gate: NOT_READY is not orderable."
        test_recipe:
          setup: ["program; TRAINING patient with a DRAFT May order"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 2 } ], expected_patient_version: "${pv}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_POSTURE_NOT_ORDERABLE, http 403"
            - "SupplyOrder.${ord}.order_status remains DRAFT"

      - name: month_order_exists_and_bad_window_battery
        claim_type: aggregate_validation
        grounds: ["errors[ERR_MONTH_ORDER_EXISTS]", "errors[ERR_INVALID_REQUEST]", state_machines.SupplyOrder]
