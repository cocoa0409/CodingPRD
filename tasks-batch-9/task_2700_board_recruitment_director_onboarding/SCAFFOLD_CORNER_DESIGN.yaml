  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_slate_version_is_refused_with_412_and_the_fresh_one_succeeds
        claim_type: optimistic_concurrency_stale_version
        grounds:
          - concurrency_rules.slate-nominee-add-stale-slate
          - validations.priority_30.ERR_STALE_SLATE_VERSION
          - endpoints.POST_/governance/slates/{slate_id}/nominees
        distinguishing_aspect: |
          The first nominee-add consumes version 1 and leaves the slate at version 2, so replaying the same
          expected_slate_version 1 returns 412 ERR_STALE_SLATE_VERSION with no nominee created; re-reading the
          slate and sending the current version succeeds. The check compares only the declared occ_field
          against NominationSlate.version.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, three SEATED independent incumbent directors and a DRAFT slate for cycle 2026 at version 1."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ada One", email: "ada@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ben Two", email: "ben@issuer.example", birth_date: "1969-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir2_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cai Three", email: "cai@issuer.example", birth_date: "1970-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir3_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${dir1_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom1_id: $.data.id }
          trigger:
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 2, incumbent_director_id: "${dir2_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { stale_slate_error_id: $.data.error_id }
            - call: "GET /governance/slates/${slate_id}"
              payload: {}
              as: GovernanceStaff
              captures: { slate_v2: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 2, incumbent_director_id: "${dir2_id}", expected_slate_version: "${slate_v2}" }
              as: GovernanceStaff
              captures: { nom2_id: $.data.id }
          assert:
            - "The replayed call returns HTTP 412 with data.error_id == \"ERR_STALE_SLATE_VERSION\""
            - "After the refusal NominationSlate.${slate_id}.nominee_count == 1 and version is unchanged at ${slate_v2}"
            - "The re-read reports version ${slate_v2} == ${slate_v1} + 1, proving the first add incremented it"
            - "The retried call returns HTTP 201 with SlateNominee.${nom2_id}.status == \"PROPOSED\" and NominationSlate.${slate_id}.nominee_count == 2"
            - "NominationSlate.${slate_id}.version is now ${slate_v2} + 1: every accepted write increments it"

      - name: a_stale_expected_committee_version_is_refused_with_412
        claim_type: optimistic_concurrency_stale_version
        grounds:
          - concurrency_rules.committee-assignment-create-stale-committee
          - validations.priority_30.ERR_STALE_COMMITTEE_VERSION
          - endpoints.POST_/governance/committees/{committee_id}/assignments
        distinguishing_aspect: |
          Creating an assignment increments Committee.version, so a second create built on the version read
          before the first returns 412 ERR_STALE_COMMITTEE_VERSION - even though seats are still available -
          and activating an assignment increments the version again, invalidating any client view taken
          before the activation.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, two SEATED independent directors and an AUDIT committee with authorized_seats 3 and min_seats 1 at version 1."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ada One", email: "ada@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ben Two", email: "ben@issuer.example", birth_date: "1969-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir2_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id, comm_v1: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir1_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v1}", seat_role: "CHAIR" }
              as: CorporateSecretary
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir2_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v1}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { stale_committee_error_id: $.data.error_id }
            - call: "GET /governance/committees/${comm_id}"
              payload: {}
              as: GovernanceStaff
              captures: { comm_v2: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir2_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v2}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { asg2_id: $.data.id }
            - call: "POST /governance/assignments/${asg1_id}/activate"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir1_id}", term_start_on: "2027-01-01", term_end_on: "2027-12-31", expected_committee_version: "${comm_v2}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { stale_after_activate_error_id: $.data.error_id }
          assert:
            - "The first retry-with-stale-version call returns HTTP 412 with data.error_id == \"ERR_STALE_COMMITTEE_VERSION\" and creates no assignment"
            - "The re-read reports version ${comm_v2} == ${comm_v1} + 1"
            - "The corrected call returns HTTP 201 with CommitteeAssignment.${asg2_id}.status == \"PROPOSED\""
            - "The activation returns HTTP 200 and Committee.${comm_id}.filled_seats == 1 with status \"AT_STRENGTH\""
            - "The post-activation call using ${comm_v2} returns HTTP 412 ERR_STALE_COMMITTEE_VERSION, proving the activation also incremented the version"

      - name: the_continuing_education_threshold_flips_exactly_on_the_cycle_deadline
        claim_type: rate_threshold_trigger_boundary
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.director_compliance_status
          - entities.GovernancePolicy.fields.education_hours_required
        distinguishing_aspect: |
          Two thresholds are crossed in one walk: the temporal one - the education leg only applies once
          clock_date reaches December 31 of the policy cycle_year, so 2026-12-30 is COMPLIANT and 2026-12-31
          is EDUCATION_DELINQUENT on the same 4.0 hours - and the cumulative one, where a second 4.0-hour
          module brings the total to exactly 8.0 and the strictly-less-than comparison clears the flag.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with the default education_hours_required 8.0."
            - "One SEATED director appointed 2021-01-01 with no outside boards and no compensation award, holding two CONTINUING_EDUCATION OnboardingItems of 4.0 credit hours each, the first already COMPLETED."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Edda Ucation", email: "edda@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "CE_AUDIT_TRENDS_2026", category: "CONTINUING_EDUCATION", is_required: false, credit_hours: 4.0, due_on: "2026-12-31" }
              as: GovernanceStaff
              captures: { ce1_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "CE_CYBER_BRIEFING_2026", category: "CONTINUING_EDUCATION", is_required: false, credit_hours: 4.0, due_on: "2026-12-31" }
              as: GovernanceStaff
              captures: { ce2_id: $.data.id }
            - call: "POST /governance/onboarding-items/${ce1_id}/complete"
              payload: {}
              as: GovernanceStaff
          trigger:
            - call: "POST /governance/_clock/set_current_utc"
              payload: { current_utc: "2026-12-30T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /governance/_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /governance/onboarding-items/${ce2_id}/complete"
              payload: {}
              as: GovernanceStaff
          assert:
            - "After the first clock move Director.${dir_id}.education_hours_cycle == 4.0 and compliance_status == \"COMPLIANT\" (2026-12-30 is before the deadline)"
            - "After the second clock move Director.${dir_id}.compliance_status == \"EDUCATION_DELINQUENT\" on the same 4.0 hours"
            - "Both clock responses report recomputed_director_count == 1"
            - "After completing the second module Director.${dir_id}.education_hours_cycle == 8.0 and compliance_status == \"COMPLIANT\", because the test is strictly less than 8.0"
            - "Director.${dir_id}.onboarding_status is still \"NOT_STARTED\" with onboarding_completion_pct 0.00 - both modules are optional, so the required denominator is zero"

      - name: cascading_side_effect_chains_are_exercised_end_to_end_elsewhere
        claim_type: cascading_side_effects_chain
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / supplemental_rescreen_not_independent_cascades_screen_to_candidate_to_nominee_to_slate_to_ballots
          rationale: "A five-hop chain is asserted hop by hop there, and the resignation instance covers the second, independently rooted chain."

      - name: dual_variant_calculation_layer_is_exercised_by_both_variant_pairs
        claim_type: dual_variant_both_variants
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / independence_bright_line_clears_what_enhanced_standard_disqualifies
          rationale: "That instance and its skills-matrix sibling run both variants of both dual-variant calculations over identical inputs and assert the divergence."

  - section: consistency_model
    instances:
      - name: derived_fields_are_visible_in_the_same_request_that_changes_them
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.director_onboarding_rollup
          - calculations.committee_seat_ledger
        distinguishing_aspect: |
          The declared consistency model is immediate, so no read-after-write delay is tolerated: the
          activation response itself already carries the new assignment status, and the very next read of the
          committee shows filled_seats 1 with the recomputed posture - there is no retry, no polling and no
          lagging denormalised copy anywhere in the chain from item completion to seat ledger.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "One director in ONBOARDING with a single required OnboardingItem, and an AUDIT committee with authorized_seats 3 and min_seats 1 carrying a PROPOSED CHAIR assignment for that director."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Vera Visible", email: "vera@issuer.example", birth_date: "1972-01-01", appointed_on: "2026-07-01", is_independent: true }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "BUSINESS_ORIENTATION_101", category: "BUSINESS_ORIENTATION", is_required: true, credit_hours: 2.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id, comm_v1: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir_id}", term_start_on: "2026-08-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v1}", seat_role: "CHAIR" }
              as: CorporateSecretary
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /governance/onboarding-items/${item_id}/complete"
              payload: {}
              as: GovernanceStaff
            - call: "GET /governance/directors/${dir_id}"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/directors/${dir_id}/seat"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/assignments/${asg_id}/activate"
              payload: {}
              as: CorporateSecretary
            - call: "GET /governance/committees/${comm_id}"
              payload: {}
              as: GovernanceStaff
          assert:
            - "The completion response is HTTP 200 and the immediately following director read already shows onboarding_status \"COMPLETE\" with onboarding_completion_pct 100.00 - no second read is needed"
            - "The seat response body itself carries service_status == \"SEATED\" for Director.${dir_id}"
            - "The activate response body itself carries status == \"ACTIVE\" and activated_at == \"2026-08-01T00:00:00Z\" for CommitteeAssignment.${asg_id}"
            - "The committee read immediately after activation shows filled_seats == 1 and status == \"AT_STRENGTH\" (min_seats met and an ACTIVE CHAIR present)"
            - "Committee.${comm_id}.version has been incremented twice since creation - once by the assignment create and once by the activation"
