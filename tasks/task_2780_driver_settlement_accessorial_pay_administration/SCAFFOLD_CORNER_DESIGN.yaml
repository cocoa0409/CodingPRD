          rationale: "That instance prepares STL_EARLY whose half-open period excludes the only load and asserts HTTP 422 with ERR_NO_SETTLEABLE_ACTIVITY, which is exactly the empty-accrual trigger."
      - name: a_load_already_on_a_statement_cannot_be_claimed_against
