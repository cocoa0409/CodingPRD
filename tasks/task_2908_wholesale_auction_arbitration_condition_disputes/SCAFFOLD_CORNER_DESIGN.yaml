        distinguishing_aspect: "One second before the current logical clock is refused with 409 ERR_CLOCK_NOT_MONOTONIC, while re-setting the clock to the very same instant is accepted — the guard is >=, not >."
        test_recipe:
          setup: ["The logical clock has been advanced to 2026-08-02T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { clock_after_setup: $.data.current_utc }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:59:59Z" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AuctionAdmin
              as_user_id: "admin-01"
          assert:
            - "the captured ${clock_after_setup} equals \"2026-08-02T00:00:00.000Z\""
            - "the backwards call returned HTTP 409 with ${err} == \"ERR_CLOCK_NOT_MONOTONIC\""
            - "the equal-instant call returned HTTP 200 with response.data.current_utc == \"2026-08-02T00:00:00.000Z\""

