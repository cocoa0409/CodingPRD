            - "SuspensionOrder.${order_vo1}.status == 'VACATED' with vacated_reason stored, and AlarmSite.${site_ov2}.lifted_suspension_count == 0"
            - "third trigger -> HTTP 201 for the exact 2026-04-20 .. 2026-05-20 window that was refused while O1 was PROPOSED (VACATED rows leave the candidate set)"
            - "the rebooked order must NOT collide with ${order_vo_next}: 2026-04-20 <= 2026-06-20 is true but 2026-05-21 <= 2026-05-20 is false"
            - "GET /false-alarm-program/suspension-orders?alarm_site_id=${site_ov2} returns total_count == 3: one VACATED and two PROPOSED covering 2026-04-20..2026-05-20 and 2026-05-21..2026-06-20"
            - "each accepted creation used the CURRENT AlarmSite.version (${site_ov2_v} then ${site_ov2_v2}), so priority 14 (ERR_STALE_ALARM_SITE_VERSION) never fires"

  - rule_id: compensating_invariant
    instances:
      - name: voiding_a_payment_on_the_last_legal_day_restores_both_sides_of_the_cash_identity
        grounds:
          - calculations.money_conservation_invariant
          - state_machines.PenaltyInvoice.PAID_to_UNPAID
          - "validations[priority=35]"
          - entities.AlarmSite.fields.credit_balance_cents
        distinguishing_aspect: >-
          A 20000-cent AUTO_WATERFALL payment settles a 5500-cent permit invoice and a 10500-cent fee
          invoice and parks 4000 as credit, so cash_in 20000 == cash_out 16000 + credit 4000; voiding it
          on 2026-02-12 (exactly tendered_on + 2 whole days, the inclusive edge of the void window) must
          drive every term of that identity back to 0 with no credit drift.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with free_alarm_allowance 0, single tier [1..null: 10000], permit_issue_fee_cents 5000, invoice_due_days 3650."
            - "One RESIDENTIAL AlarmSite with two ACTIVE ECV-callable contacts and one PERMITTED system, whose PERMIT_ISSUE_FEE invoice is 5000 + 500 admin = 5500 (the admin floor applies)."
            - "The incident of 2026-02-05 is determined COUNTED, producing a fee of 10000 and an invoice of 10000 + 500 admin = 10500; the site owes 16000."
            - "On 2026-02-10 a single 20000-cent CARD payment is posted with AUTO_WATERFALL: both invoices sit at collections_stage CURRENT, so the order is due_on ASC and the older permit invoice is settled first."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload:
                <<: *fs_base
                schedule_code: "FS-2507-MONEY"
                effective_from: "2026-02-01T00:00:00Z"
                free_alarm_allowance: 0
                invoice_due_days: 3650
                fee_tiers:
                  - {from_index: 1, to_index: null, base_fee_cents: 10000}
              as: ProgramAdministrator
              captures: {sched_mn: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_mn}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Ledger Alarm Monitoring", license_number: "AC-2507-MN", contact_email: "ops@ledger2507.example", contact_phone: "+15550114101", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_mn: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-MN-5-BALANCE-BND", street_address: "5 Balance Bnd", city: "Fairview", zip_code: "44023", occupancy_class: "RESIDENTIAL", police_beat: "B15"}, as: PermitClerk, captures: {site_mn: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_mn}", full_name: "Elle Ross", phone_number: "+15550114102", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {mc1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_mn}", full_name: "Finn Ross", phone_number: "+15550114103", relationship: "SPOUSE", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {mc2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_mn}", monitoring_company_id: "${company_mn}", system_type: "BURGLARY", zone_count: 6, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-20T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_mn: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys_mn}/approve-registration", payload: {}, as: PermitClerk}
            - {call: "GET /false-alarm-program/penalty-invoices?alarm_site_id=${site_mn}&kind=PERMIT_ISSUE_FEE", payload: {}, as: BillingClerk, captures: {inv_mn_permit: "$.data[0].id"}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-05T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys_mn}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{site_contact_id: "${mc1}", attempted_at: "2026-02-05T01:01:00Z", outcome: "NO_ANSWER"}, {site_contact_id: "${mc2}", attempted_at: "2026-02-05T01:03:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-02-05T01:00:00Z", idempotency_key: "mn-2507-1"}, as: AlarmCompanyOperator, as_user_id: "${company_mn}", captures: {dr_mn: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_mn}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_mn}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/false-alarm-incidents", payload: {dispatch_request_id: "${dr_mn}", cause_code: "OPERATOR_ERROR"}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507", captures: {inc_mn: $.data.id}}
            - {call: "POST /false-alarm-program/false-alarm-incidents/${inc_mn}/determination", payload: {determination: "COUNTED"}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "GET /false-alarm-program/penalty-invoices?false_alarm_incident_id=${inc_mn}", payload: {}, as: BillingClerk, captures: {inv_mn_fee: "$.data[0].id"}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-10T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/alarm-sites/${site_mn}", payload: {}, as: BillingClerk, captures: {site_mn_v: $.data.version}}
            - {call: "POST /false-alarm-program/payment-records", payload: {alarm_site_id: "${site_mn}", amount_cents: 20000, tendered_on: "2026-02-10T00:00:00Z", method: "CARD", allocation_mode: "AUTO_WATERFALL", expected_alarm_site_version: "${site_mn_v}"}, as: BillingClerk, captures: {pay_mn: $.data.id}}
            - {call: "GET /false-alarm-program/payment-allocations?payment_record_id=${pay_mn}", payload: {}, as: BillingClerk}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-12T00:00:00Z"}, as: ProgramAdministrator}
          trigger:
            - {call: "POST /false-alarm-program/payment-records/${pay_mn}/void", payload: {void_reason: "Card chargeback initiated by the issuer; funds never settled."}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/payment-allocations?payment_record_id=${pay_mn}", payload: {}, as: BillingClerk}
            - {call: "GET /false-alarm-program/alarm-sites/${site_mn}", payload: {}, as: BillingClerk}
            - {call: "GET /false-alarm-program/penalty-invoices?alarm_site_id=${site_mn}", payload: {}, as: BillingClerk}
          assert:
            - "before the void: PaymentRecord.${pay_mn}.status == 'APPLIED', amount_cents == 20000, credited_cents == 4000; two APPLIED PaymentAllocation rows of 5500 (${inv_mn_permit}) and 10500 (${inv_mn_fee}); both invoices PAID with outstanding_cents 0; AlarmSite.${site_mn}.credit_balance_cents == 4000 and outstanding_balance_cents == 0 - i.e. 20000 == 16000 + 4000"
            - "the void is accepted (HTTP 200) because the clock 2026-02-12 equals tendered_on 2026-02-10 + 2 whole days, the inclusive edge of the window"
            - "PaymentRecord.${pay_mn}.status == 'VOIDED' with voided_at == '2026-02-12T00:00:00Z' and void_reason stored"
            - "both PaymentAllocation rows have status == 'REVERSED', so cash_out becomes 0"
            - "PenaltyInvoice.${inv_mn_permit}: paid_cents == 0, outstanding_cents == 5500, payment_status == 'UNPAID'; PenaltyInvoice.${inv_mn_fee}: paid_cents == 0, outstanding_cents == 10500, payment_status == 'UNPAID'"
            - "AlarmSite.${site_mn}.credit_balance_cents == 0 exactly (the 4000 residual is withdrawn, not floored at some leftover) and outstanding_balance_cents == 16000"
            - "the identity holds after the compensating action: cash_in 0 == cash_out 0 + credit 0, and lifetime_assessed_cents is unchanged at 16000 because voiding a payment never re-assesses an invoice"

      - name: remanding_the_middle_incident_conserves_a_contiguous_index_set_and_returns_the_money_as_credit
