            - { call: "POST /api/contracts/${contract_x}/releases", payload: { project_id: "${proj_x}", title: "R-X", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_x}"] }, as: AnRManager, captures: { rel_x: $.data.id } }
