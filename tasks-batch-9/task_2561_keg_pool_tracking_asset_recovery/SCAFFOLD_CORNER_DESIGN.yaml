              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-03T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
