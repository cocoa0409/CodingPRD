      - name: endpoint_conditional_action_recount_cycle_is_gated_at_every_hop
        claim_type: conditional_action
        grounds: ["endpoints[POST /night-audit/settlement-batches/{id}/request-recount]", "endpoints[POST /night-audit/settlement-batches/{id}/redeclare]", "validations[priority=42]", "validations[priority=80]", "state_machines.SettlementBatch.status"]
        distinguishing_aspect: "Three actions share one batch and each is legal in exactly one state, so the cycle VARIANCE_FLAGGED to RECOUNT_REQUESTED to DECLARED to re-verified has a wrong-state error waiting at every hop, and the round counter is capped at two so the third recount is refused outright."
        test_recipe:
          setup: ["Standard property with settlement_variance_tolerance_amount 5.00; one ACTIVE outlet requiring shift settlement; date 2026-08-01 with one CLOSED CASH ticket of gross 128.00 transmitted at 20:00 and one CASH batch for the 14:00-22:00 shift declared at 100.00; the date walked to SETTLEMENT_REVIEW so the batch is VARIANCE_FLAGGED."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
