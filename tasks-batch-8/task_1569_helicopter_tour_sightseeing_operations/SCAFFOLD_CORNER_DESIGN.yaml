        grounds: ["errors[ERR_AIRCRAFT_TURN_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / aircraft_turn_buffer_vs_pilot_adjacency_semantics"
          rationale: "Triggered by the 08:39 departure inside the turn buffer in the named §1.8 instance; §1.9 adds the DELAY leg in validations.delay_into_turn_conflict_rejected."

      - name: error_complaint_flight_mismatch
        claim_type: violation_to_error
