          - calculations.clearance_risk_score.constants.SCORE_CAP
          - entities.GuildAgreement.fields.clearance_item_weights
          - entities.GuildAgreement.fields.clearance_escalation_score
          - entities.ClearanceReview.fields.risk_score
          - entities.ClearanceReview.fields.posture
