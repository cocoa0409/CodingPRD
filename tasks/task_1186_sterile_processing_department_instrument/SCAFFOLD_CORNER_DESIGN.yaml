          trigger:
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${uf}", case_id: "${cg}", justification: "short" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${uf}", case_id: "${cg}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { e2: "$.data.error_id" } }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${ud}", case_id: "${cg}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { e3: "$.data.error_id" } }
          assert:
            - "e1 == ERR_JUSTIFICATION_TOO_SHORT (input-shape gate fires before any state gate)"
            - "e2 == ERR_IUSS_TRAY_NOT_ELIGIBLE (tray AWAITING_DECONTAMINATION; tray state checked before the case gate)"
            - "e3 == ERR_CASE_TERMINAL_FOR_IUSS (tray eligible but case CANCELLED)"

      - name: loaner_state_gates_and_double_receive
        claim_type: invalid_transition
        grounds:
          - "state_machines.LoanerSet"
          - "errors[ERR_LOANER_NOT_RECEIVED]"
          - "errors[ERR_LOANER_NOT_BOOKED]"
        distinguishing_aspect: "mark-ready on a BOOKED loaner fails (ERR_LOANER_NOT_RECEIVED); after a successful receive, a second receive fails (ERR_LOANER_NOT_BOOKED); then mark-ready succeeds."
        test_recipe:
          setup: ["case CLN SCHEDULED (2026-05-10T09:00-10:00); loaner LN booked (tray_count 2, due_by 2026-05-09T09:00:00Z); technician A"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-LN", surgeon: "Dr L", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T10:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { cln: "$.data.id" } }
