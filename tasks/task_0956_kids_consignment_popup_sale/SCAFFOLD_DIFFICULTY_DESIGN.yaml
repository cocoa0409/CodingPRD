            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer, captures: { ev_v: $.data.version } }
            - { call: "POST /sale-events/${ev_id}/generate-settlements", payload: { expected_sale_event_version: "${ev_v}" }, as: EventOrganizer, captures: { s_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-07T15:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SETTLEMENT }, as: EventOrganizer }
            - { call: "GET /items/${item_id}", payload: {}, as: EventOrganizer }
            - { call: "GET /consignors/${c_id}", payload: {}, as: EventOrganizer }
            - { call: "GET /settlements/${s_id}", payload: {}, as: EventOrganizer }
          assert:
            - "Hop 1: Item.${item_id}.status == UNSOLD"
            - "Hop 2: Consignor.${c_id}.unsold_count == 1"
            - "Hop 3: Settlement.${s_id}.provisional_gross_cents == 0 and provisional_payout_cents == 0 (floor projection removed by the cascade, not by a direct write)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: voided_transaction_checkout_state_beats_tender
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_TRANSACTION_NOT_OPEN]
          - errors[ERR_INSUFFICIENT_TENDER]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): a checkout on a VOIDED
          transaction with tendered_cents 0 violates both the state rule (p5) and
          the fiscal rule (p9); the state error ERR_TRANSACTION_NOT_FOUND-free
          ERR_TRANSACTION_NOT_OPEN must win.
        test_recipe:
          setup:
            - "Event in SALE_ACTIVE; an OPEN transaction with no lines was voided by the cashier."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/void", payload: {}, as: Cashier }
          trigger:
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 0 }, as: Cashier, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSACTION_NOT_OPEN (state, priority 5) and http status == 409"
            - "error_id != ERR_INSUFFICIENT_TENDER (fiscal, priority 9, never evaluated)"

      - name: self_dealing_beats_inspection_deadline
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INSPECTION_SELF_DEALING]
          - errors[ERR_INSPECTION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal) — different pair than
          the state/fiscal conflict: an inspector linked to the item's consignor
          inspecting after the presale_start deadline violates both; the safety
          error ERR_INSPECTION_SELF_DEALING (p6) must win over
          ERR_INSPECTION_DEADLINE_PASSED (p7).
        test_recipe:
          setup:
            - "Event in INTAKE_OPEN with logical clock already past presale_start (organizer never advanced phases); consignor Jo's item is DROPPED_OFF; volunteer Jo-Vol is linked to consignor Jo."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Jo", email: "jo@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Jo Vol", email: "jov@x.com", linked_consignor_id: "${c_id}" }, as: Anonymous, captures: { v_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Blocks", category: TOYS, price_cents: 500 }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id } }
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T18:00:00Z" }, as: EventOrganizer }
          trigger:
            - { call: "POST /items/${item_id}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSPECTION_SELF_DEALING (safety, priority 6) and http status == 403"
            - "error_id != ERR_INSPECTION_DEADLINE_PASSED (temporal, priority 7) even though clock 2026-06-04T18:00:00Z >= presale_start"
            - "Item.${item_id}.status remains DROPPED_OFF"

  - rule_id: boundary_precision_check
    instances:
      - name: volunteer_discount_eight_hour_boundary
        grounds:
          - calculations.volunteer_discount_tier
          - entities.PresalePass.fields.discount_pct
        distinguishing_aspect: |
          Metric: completed hours (numeric threshold, >= semantics). A volunteer at
          exactly 8.00 hours earns the 15% pass; one at 7.50 hours earns 10% — the
          boundary is inclusive at 8.
        test_recipe:
          setup:
            - "Volunteer Uma completed two 4h shifts (8.00h); volunteer Oda completed 4h + 3.5h (7.50h); event in INTAKE_CLOSED."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Uma", email: "uma@x.com" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Oda", email: "oda@x.com" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Setup", start_time: "2026-05-28T09:00:00Z", end_time: "2026-05-28T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { shA: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Setup", start_time: "2026-05-29T09:00:00Z", end_time: "2026-05-29T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { shB: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Setup", start_time: "2026-05-29T13:00:00Z", end_time: "2026-05-29T16:30:00Z", capacity: 5 }, as: EventOrganizer, captures: { shC: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${shA}", volunteer_id: "${v1}" }, as: Volunteer, as_user_id: "${v1}", captures: { s1a: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${shB}", volunteer_id: "${v1}" }, as: Volunteer, as_user_id: "${v1}", captures: { s1b: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${shA}", volunteer_id: "${v2}" }, as: Volunteer, as_user_id: "${v2}", captures: { s2a: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${shC}", volunteer_id: "${v2}" }, as: Volunteer, as_user_id: "${v2}", captures: { s2b: $.data.id } }
            - { call: "POST /shift-signups/${s1a}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${s1a}/check-out", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${s1b}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${s1b}/check-out", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${s2a}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${s2a}/check-out", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${s2b}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${s2b}/check-out", payload: {}, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
          trigger:
            - { call: "POST /sale-events/${ev_id}/issue-presale-passes", payload: {}, as: EventOrganizer }
            - { call: "GET /presale-passes", payload: { sale_event_id: "${ev_id}", holder_id: "${v1}" }, as: EventOrganizer, captures: { p1: "$.data[0].discount_pct" } }
            - { call: "GET /presale-passes", payload: { sale_event_id: "${ev_id}", holder_id: "${v2}" }, as: EventOrganizer, captures: { p2: "$.data[0].discount_pct" } }
          assert:
            - "Uma (exactly 8.00 completed hours): pass discount_pct == 15 (boundary is >=, inclusive)"
            - "Oda (7.50 completed hours): pass discount_pct == 10"
            - "Volunteer.${v1}.completed_hours == 8.0 and Volunteer.${v2}.completed_hours == 7.5"

      - name: slot_capacity_full_at_equality
        grounds:
          - calculations.slot_capacity_check
          - entities.DropOffSlot.fields.booked_count
          - errors[ERR_SLOT_FULL]
        distinguishing_aspect: |
          Metric: booking count against capacity (zero-remaining edge, == full). A
          capacity-2 slot accepts the booking that brings booked_count to exactly 2
          and rejects the next with ERR_SLOT_FULL — reachable via POST
          /drop-off-bookings, a different endpoint and metric than the hours tier.
        test_recipe:
          setup:
            - "Event in INTAKE_OPEN; slot capacity 2; consignors P1, P2, P3 registered."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "P1", email: "p1@x.com" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "P2", email: "p2@x.com" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "P3", email: "p3@x.com" }, as: Anonymous, captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c1}" }, as: Consignor, as_user_id: "${c1}" }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c2}" }, as: Consignor, as_user_id: "${c2}" }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c3}" }, as: Consignor, as_user_id: "${c3}", captures: { err: $.data.error_id } }
            - { call: "GET /drop-off-slots", payload: { sale_event_id: "${ev_id}" }, as: EventOrganizer }
          assert:
            - "First two bookings succeed (booked_count reaches exactly capacity 2)"
            - "Third booking: error_id == ERR_SLOT_FULL, http status 409"
            - "DropOffSlot.${slot_id}.booked_count == 2 after the rejection (no drift)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: item_dropoff_requires_phase_and_checked_in_booking
        grounds:
          - state_machines.Item.TAGGED_to_DROPPED_OFF
          - errors[ERR_NO_CHECKED_IN_BOOKING]
          - errors[ERR_EVENT_PHASE_MISMATCH]
        distinguishing_aspect: |
          Entity pair Item -> DropOffBooking (plus SaleEvent phase): a TAGGED item
          cannot drop off while the consignor's booking is merely BOOKED; only the
          booking's transition to CHECKED_IN unlocks the item transition.
        test_recipe:
          setup:
            - "Event in INTAKE_OPEN; consignor Quy has a BOOKED (not checked-in) booking and a TAGGED item."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Quy", email: "quy@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Books", category: BOOKS, price_cents: 300 }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id } }
          trigger:
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
