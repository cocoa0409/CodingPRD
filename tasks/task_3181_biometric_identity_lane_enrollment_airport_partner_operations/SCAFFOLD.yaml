    path: "/venues"
    description: "Create a venue"
    roles: [VenueOps]
    code: 201
    input: [name, venue_type, city, state_code, "access_rule_mode?"]
    output: Venue
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/venues"
    description: "List venues"
    roles: [OpsAdmin, VenueOps, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Venue[]"
    side_effects: []

  - method: GET
    path: "/venues/{id}"
    description: "Get a venue"
    roles: [OpsAdmin, VenueOps, Member]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/venue-events"
    description: "Schedule a venue event; padded-window conflict check applies"
    roles: [VenueOps]
    code: 201
    input: [venue_id, name, start_time, end_time, buffer_hours]
    output: VenueEvent
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/venue-events"
    description: "List venue events (filterable by venue_id)"
    roles: [OpsAdmin, VenueOps, Member]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: "VenueEvent[]"
    side_effects: []

  - method: GET
    path: "/venue-events/{id}"
    description: "Get a venue event"
    roles: [OpsAdmin, VenueOps, Member]
    code: 200
    input: []
    output: VenueEvent
    side_effects: []

  - method: POST
    path: "/venue-events/{id}/cancel"
    description: "Cancel a SCHEDULED event (only before start)"
    roles: [VenueOps]
    code: 200
    input: []
    output: VenueEvent
    side_effects: ["event excluded from venue_event_payout events_count"]

  - method: POST
    path: "/venue-access"
    description: "Record a member's access attempt at a venue; age gate + active-event + status checks"
    roles: [Member]
    code: 201
    input: [venue_id, member_id]
    output: VenueAccessEvent
    side_effects: ["outcome ADMITTED or REJECTED recorded synchronously"]

  - method: GET
    path: "/venue-access-events"
    description: "List venue access events (filterable by venue_id, member_id)"
    roles: [OpsAdmin, VenueOps]
    code: 200
    input: ["venue_id?", "member_id?", "limit?", "offset?"]
    output: "VenueAccessEvent[]"
    side_effects: []

  # --- disputes ---
  - method: POST
    path: "/identity-disputes"
    description: "Open an identity dispute; suspends the member"
    roles: [ComplianceOfficer]
    code: 201
    input: [member_id, enrollment_id, reason]
    output: IdentityDispute
    side_effects: ["Member ACTIVE → SUSPENDED; DRAFT enrollments of the member → REJECTED; status = OPEN"]

  - method: GET
    path: "/identity-disputes"
    description: "List disputes (filterable by member_id)"
    roles: [OpsAdmin, ComplianceOfficer]
    code: 200
    input: ["member_id?", "enrollment_id?", "limit?", "offset?"]
    output: "IdentityDispute[]"
    side_effects: []

  - method: GET
    path: "/identity-disputes/{id}"
    description: "Get a dispute"
    roles: [OpsAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: IdentityDispute
    side_effects: []

  - method: POST
    path: "/identity-disputes/{id}/investigate"
    description: "Move an OPEN dispute to INVESTIGATING"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IdentityDispute
    side_effects: []

  - method: POST
    path: "/identity-disputes/{id}/resolve"
    description: "Resolve a dispute (RESOLVED_CLEAR | RESOLVED_CONFIRMED); resolver must differ from opener"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, resolution_note]
    output: IdentityDispute
    side_effects: ["CLEAR: member re-activated; CONFIRMED: member terminated with full cascade"]

  # --- biometric retention ---
  - method: POST
    path: "/members/{id}/biometric-deletion"
    description: "Manually delete a member's biometric data before the retention due date; blocked while a dispute is open; note mandatory"
    roles: [ComplianceOfficer, Member]
    code: 200
    input: [note]
    output: BiometricRetentionLog
    side_effects: ["BiometricRetentionLog(DELETED) appended; member deletion_due_at cleared; subsequent lane check-ins for the member are rejected ERR_BIOMETRIC_PURGED"]

  - method: GET
    path: "/biometric-retention-logs"
    description: "List retention audit log entries (filterable by member_id)"
    roles: [OpsAdmin, ComplianceOfficer]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: "BiometricRetentionLog[]"
    side_effects: []

  # --- settlements ---
  - method: POST
    path: "/partner-agreements/{id}/settlements"
    description: "Create an airport-fee settlement (calculation_variant=AIRPORT)"
    roles: [PartnerManager]
    code: 201
    input: [period_start, period_end, attributable_mrr_cents, verification_revenue_cents]
    output: AgreementSettlement
    side_effects: ["fee_cents computed per partner_monthly_fee base variant; status = DRAFT"]

  - method: POST
    path: "/venues/{id}/payout-settlements"
    description: "Create a venue payout settlement (calculation_variant=VENUE)"
    roles: [VenueOps]
    code: 201
    input: [period_start, period_end, verification_revenue_cents, events_count, venue_capacity_seats]
    output: AgreementSettlement
    side_effects: ["fee_cents computed per venue_event_payout variant; status = DRAFT"]

  - method: GET
    path: "/agreement-settlements"
    description: "List settlements (filterable by agreement_id, venue_id)"
    roles: [OpsAdmin, PartnerManager, VenueOps]
    code: 200
    input: ["agreement_id?", "venue_id?", "limit?", "offset?"]
    output: "AgreementSettlement[]"
    side_effects: []

  - method: GET
    path: "/venues/{id}/access-events"
    description: "List venue access events for a venue (FK reverse-reachability for VenueAccessEvent.venue_id)"
    roles: [OpsAdmin, VenueOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "VenueAccessEvent[]"
    side_effects: []

  - method: GET
    path: "/members/{id}/venue-access-events"
    description: "List venue access events for a member (FK reverse-reachability for VenueAccessEvent.member_id)"
    roles: [OpsAdmin, VenueOps, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "VenueAccessEvent[]"
    side_effects: []

  - method: GET
    path: "/members/{id}/biometric-retention-logs"
    description: "List retention audit entries for a member (FK reverse-reachability for BiometricRetentionLog.member_id)"
    roles: [OpsAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "BiometricRetentionLog[]"
    side_effects: []

  - method: GET
    path: "/agreement-settlements/{id}"
    description: "Get a settlement"
    roles: [OpsAdmin, PartnerManager, VenueOps]
    code: 200
    input: []
    output: AgreementSettlement
    side_effects: []

  - method: POST
    path: "/agreement-settlements/{id}/finalize"
    description: "Finalize a DRAFT settlement; freezes fee_cents; period must have ended"
    roles: [PartnerManager]
    code: 200
    input: []
    output: AgreementSettlement
    side_effects: ["fee_cents frozen"]

  - method: POST
    path: "/agreement-settlements/{id}/mark-paid"
    description: "Mark a FINALIZED settlement paid"
    roles: [PartnerManager]
    code: 200
    input: []
    output: AgreementSettlement
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint per §1.5 roles" }
  # --- not found ---
  - { id: ERR_AIRPORT_NOT_FOUND, http: 404, condition: "Airport id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "PartnerAgreement id does not exist" }
  - { id: ERR_LANE_NOT_FOUND, http: 404, condition: "Lane id does not exist" }
  - { id: ERR_KIOSK_NOT_FOUND, http: 404, condition: "Kiosk id does not exist" }
  - { id: ERR_ENROLLMENT_CENTER_NOT_FOUND, http: 404, condition: "EnrollmentCenter id does not exist" }
  - { id: ERR_AMBASSADOR_NOT_FOUND, http: 404, condition: "Ambassador id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "SubscriptionInvoice id does not exist" }
  - { id: ERR_FAMILY_GROUP_NOT_FOUND, http: 404, condition: "FamilyGroup id does not exist" }
  - { id: ERR_DISCOUNT_NOT_FOUND, http: 404, condition: "PartnerDiscount id or code does not exist" }
  - { id: ERR_LANE_VERIFICATION_NOT_FOUND, http: 404, condition: "LaneVerification id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Venue id does not exist" }
  - { id: ERR_VENUE_EVENT_NOT_FOUND, http: 404, condition: "VenueEvent id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "IdentityDispute id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "AgreementSettlement id does not exist" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state from which the requested transition does not exist (per §1.2), including terminal-state lockdown" }
  - { id: ERR_ENROLLMENT_NOT_IN_REVIEW, http: 409, condition: "review requires enrollment status FRAUD_REVIEW" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Operation requires member status ACTIVE (e.g., lane check-in, venue access, self-cancel, family attach)" }
  - { id: ERR_LANE_NOT_OPEN, http: 409, condition: "Lane check-in requires lane status OPEN" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the airport's agreement in ACTIVE status (lane open, kiosk activation, lane check-in)" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Lane check-in requires subscription in ACTIVE or PAST_DUE" }
  - { id: ERR_DISPUTE_NOT_CONFIRMED, http: 409, condition: "Admin termination requires a RESOLVED_CONFIRMED dispute on file" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  # --- business safety ---
  - { id: ERR_MEMBER_UNDERAGE, http: 422, condition: "Member younger than 18 at enrollment submission" }
  - { id: ERR_AGE_RULE_VIOLATION, http: 422, condition: "Venue access_rule_mode age gate not satisfied" }
  - { id: ERR_DOCUMENT_EXPIRED, http: 422, condition: "document_expiry is not strictly after the logical clock date (first enrollment)" }
  - { id: ERR_DOCUMENT_ALREADY_ENROLLED, http: 409, condition: "document_number already attached to an enrollment that reached DOCUMENT_VERIFIED" }
  - { id: ERR_TOO_MANY_REJECTED_ENROLLMENTS, http: 409, condition: "document_reject_count_90d >= 3: new submissions blocked" }
  - { id: ERR_BIOMETRIC_CAPTURE_FAILED, http: 422, condition: "biometric_capture_ok is false at capture" }
  - { id: ERR_DISPUTE_OPEN, http: 409, condition: "Biometric deletion blocked while an OPEN or INVESTIGATING dispute exists for the member" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Dispute resolver X-User-ID equals the opener's X-User-ID" }
  - { id: ERR_BIOMETRIC_PURGED, http: 409, condition: "Member's biometric data has been purged; lane check-in requires re-enrollment" }
  - { id: ERR_NO_ACTIVE_EVENT, http: 409, condition: "Venue access requires a SCHEDULED event whose window covers the logical clock" }
  # --- business constraint / fiscal ---
  - { id: ERR_VALIDATION, http: 400, condition: "Field-level validation failure (missing required field, rate outside (0, 0.30], position_index < 1, close_time <= open_time, end_time <= start_time, slots outside 2..3, resolution_note missing)" }
  - { id: ERR_DUPLICATE_AGREEMENT, http: 409, condition: "Airport already has a PartnerAgreement in DRAFT or ACTIVE status" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "iata_code / kiosk code / discount code already in use" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Opening the lane would push agreement.lane_capacity above staffing_footprint_seats * 4" }
  - { id: ERR_FAMILY_FULL, http: 422, condition: "FamilyGroup slots_used == slots_total" }
  - { id: ERR_DISCOUNT_EXHAUSTED, http: 422, condition: "PartnerDiscount redemptions_used == max_redemptions (status EXHAUSTED)" }
  - { id: ERR_DISCOUNT_EXPIRED, http: 422, condition: "Logical clock >= discount.expires_at at attach" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "Settlement finalize before period_end" }
  # --- business temporal ---
  - { id: ERR_AGREEMENT_NOT_YET_EFFECTIVE, http: 409, condition: "Agreement activation before effective_from" }
  - { id: ERR_AGREEMENT_EXPIRED, http: 409, condition: "Agreement re-activation at or after effective_to" }
  - { id: ERR_KIOSK_ACTIVATION_WINDOW_EXPIRED, http: 409, condition: "Kiosk enrollment completion more than 24h after kiosk activation" }
  - { id: ERR_ESCORT_WINDOW_EXPIRED, http: 409, condition: "Escort attempted more than 15 minutes after check-in (strictly after expires_at)" }
  - { id: ERR_EVENT_WINDOW_CONFLICT, http: 409, condition: "Venue event padded window overlaps another non-CANCELLED event at the venue" }
  - { id: ERR_EVENT_ALREADY_STARTED, http: 409, condition: "Cancelling a VenueEvent at or after its start_time" }
  # --- ambassador ---
  - { id: ERR_WRONG_AMBASSADOR, http: 409, condition: "Ambassador is not ACTIVE or is homed at a different airport than the lane" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "End user: enrolls, manages own subscription and family, checks in at lanes, accesses venues"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/register (self-registration; X-User-ID is the new member's id)"
      - "POST /enrollments, POST /enrollments/{id}/submit-document, .../capture-biometric, .../complete (own enrollments only)"
      - "POST /subscriptions, POST /subscriptions/{id}/attach-discount, .../detach-discount, .../change-plan, .../cancel (own subscription)"
      - "POST /family-groups/{id}/members, DELETE /family-groups/{id}/members/{memberId} (primary member of the group)"
      - "POST /lane-verifications (self)"
      - "POST /venue-access (self)"
    shared_operations:
      - "GET /members/{id}, GET /lanes, GET /lanes/{id}, GET /enrollments, GET /enrollments/{id}, GET /subscriptions, GET /subscriptions/{id}, GET /subscriptions/{id}/invoices, GET /subscription-invoices/{id}, GET /family-groups, GET /family-groups/{id}, GET /partner-discounts, GET /partner-discounts/{id}, GET /lane-verifications, GET /lane-verifications/{id}, GET /venues, GET /venues/{id}, GET /venue-events, GET /venue-events/{id}, POST /members/{id}/biometric-deletion (own data)"

  - name: Ambassador
    description: "Airport ambassador: escorts verified members from lane to screening"
    identity: "entity_backed:Ambassador"
    exclusive_operations:
      - "POST /lane-verifications/{id}/escort (must be the ambassador named on the verification)"
    shared_operations:
      - "GET /lanes, GET /lanes/{id}, GET /members/{id}, GET /lane-verifications, GET /lane-verifications/{id}"

  - name: OpsAdmin
    description: "Platform operations: airports, lanes, kiosks, enrollment centers, ambassadors, admin member actions, billing run, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc, POST /_fraud/watchlist, POST /_billing/record-payment, POST /_admin/members/{id}/suspend, POST /_admin/members/{id}/terminate"
      - "POST /airports, POST /airports/{id}/suspend, POST /airports/{id}/activate"
      - "POST /lanes, POST /lanes/{id}/open, POST /lanes/{id}/close"
      - "POST /kiosks, POST /kiosks/{id}/activate, POST /kiosks/{id}/suspend, POST /kiosks/{id}/retire"
      - "POST /enrollment-centers"
      - "POST /ambassadors, POST /ambassadors/{id}/suspend"
      - "POST /subscriptions/{id}/invoices/run-cycle"
    shared_operations:
      - "All GET list/read endpoints except role-scoped ones"

  - name: PartnerManager
    description: "Airport partner manager: agreements, settlements, discounts"
    identity: "opaque"
    exclusive_operations:
      - "POST /partner-agreements, POST /partner-agreements/{id}/activate, .../suspend, .../terminate"
      - "POST /partner-agreements/{id}/settlements"
      - "POST /agreement-settlements/{id}/finalize, POST /agreement-settlements/{id}/mark-paid"
      - "POST /partner-discounts, POST /partner-discounts/{id}/suspend"
    shared_operations:
      - "GET /airports, GET /airports/{id}, GET /partner-agreements, GET /partner-agreements/{id}, GET /lanes, GET /lanes/{id}, GET /kiosks, GET /kiosks/{id}, GET /enrollment-centers, GET /enrollment-centers/{id}, GET /ambassadors, GET /ambassadors/{id}, GET /partner-discounts, GET /partner-discounts/{id}, GET /agreement-settlements, GET /agreement-settlements/{id}"

  - name: ComplianceOfficer
    description: "Compliance: enrollment fraud review, identity disputes, biometric retention audit. Segregation of duties: the officer who opened a dispute cannot resolve it."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollments/{id}/review"
      - "POST /identity-disputes, POST /identity-disputes/{id}/investigate, POST /identity-disputes/{id}/resolve"
    shared_operations:
      - "GET /airports, GET /airports/{id}, GET /members, GET /members/{id}, GET /enrollments, GET /enrollments/{id}, GET /identity-disputes, GET /identity-disputes/{id}, GET /biometric-retention-logs, POST /members/{id}/biometric-deletion"

  - name: VenueOps
    description: "Venue operator: venues, events, venue payout settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /venues"
      - "POST /venue-events, POST /venue-events/{id}/cancel"
      - "POST /venues/{id}/payout-settlements"
    shared_operations:
      - "GET /venues, GET /venues/{id}, GET /venue-events, GET /venue-events/{id}, GET /venue-access-events, GET /agreement-settlements, GET /agreement-settlements/{id}"
