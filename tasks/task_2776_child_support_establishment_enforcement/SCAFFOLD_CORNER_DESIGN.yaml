      - name: income_band_boundary_at_four_hundred_thousand_stays_in_band_one
        claim_type: tiered_pricing
        grounds:
          - "calculations.guideline_support_obligation.constants.INCOME_TIER_BANDS"
          - "calculations.guideline_support_obligation.constants.BASIC_OBLIGATION_RATES"
          - "calculations.guideline_support_obligation.algorithm"
        distinguishing_aspect: >
          Combined income of exactly 400000 and of 400001 are run side by side. The
          band search is `FIRST band whose ceiling >= combined`, so 400000 is still
          band 1 at 0.28 and produces 84000, while a single extra cent crosses into
          band 2 at 0.25 and produces 75000 - one cent more income buys a 9000-cent
          cheaper order. Only one band's rate is ever applied: there is no blending
          and no per-band marginal split, so 400001 is charged 0.25 on the whole
          combined figure rather than 0.28 on the first 400000.
        test_recipe:
          setup:
            - "Empty database. Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Two cases, both NCPs earning 300000 VERIFIED_WAGE_RECORD, two children each."
            - "Case I CP income 100000 (combined exactly 400000, the band 1 ceiling)."
            - "Case J CP income 100001 (combined 400001, one cent into band 2)."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
