            - "the row carries only the two immutable common fields: the captured ${row_id} is a bare UUID and created_at is an ISO 8601 UTC instant - there is NO version field and NO updated_at on this entity"
            - "source_entity_type == QUOTE with source_entity_id == ${q1}, memo == 'quote_accepted' and occurred_at == the logical clock at acceptance (2026-08-01T00:00:00.000Z, the startup default)"
            - "the row is reachable ONLY through the territory sub-collection: §1.5 declares no POST, PATCH or DELETE on ledger entries and no top-level ledger list"
            - "filtering the sub-collection narrows without mutating: GET /blinds/territories/${t1}/ledger-entries?entry_type=REMAKE_CHARGEBACK returns total_count 0 while the unfiltered read still returns total_count 1"

  # -------------------------------------------------------------------
  # Guide section 2 - State Machines (Table 2) + state_machine_shape: parallel
  # -------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: every_declared_dimension_is_stamped_at_its_initial_state_by_creation
        claim_type: Initial State
        grounds:
          - state_machines.Lead.initial_state
          - state_machines.Consultation.initial_state
          - state_machines.SampleKit.initial_state
          - state_machines.Opening.initial_state
          - state_machines.Quote.initial_state
          - state_machines.InstallJob.commissioning_status
        distinguishing_aspect: "Nine of the ten dimensions are observable at their declared initial state right after creation, but Lead.NEW is NOT: the create request runs the routing selector inline, so the first observable lead status is already ROUTED. This corner pins which initial states are observable and which one is definitionally skipped."
        test_recipe:
          setup:
            - "One ACTIVE territory covering 30301 with default capacity 5."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "SHEERS-A", replacement_value_cents: 50000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { k1: $.data.id, kit_status: $.data.status }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "NATIONAL_CALL_CENTER", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { l1: $.data.id, lead_status: $.data.status }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id, consult_status: $.data.status }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Nook", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
