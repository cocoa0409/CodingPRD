# =============================================================================
# §1.9 Scaffold Corner Design — Hospital Price Transparency
# Enumerative breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: facility_create_applies_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Facility.fields.penalty_policy, entities.Facility.fields.shoppable_min_entries, entities.Facility.fields.attestation_status]
        distinguishing_aspect: "Omitting every optional field yields the documented defaults; system fields are server-minted with version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-E1", bed_count: 50 }, as: PlatformAdmin, captures: { pol: $.data.penalty_policy, smin: $.data.shoppable_min_entries, mmin: $.data.mandated_min_entries, mrec: $.data.min_records_per_cycle, disp: $.data.shoppable_display_enabled, att: $.data.attestation_status, ver: $.data.version, pen: $.data.penalty_accrued_cents } }
          trigger: []
          assert:
            - "penalty_policy == SIMPLE, shoppable_min_entries == 300, mandated_min_entries == 70, min_records_per_cycle == 1, shoppable_display_enabled == true"
            - "attestation_status == NONE and penalty_accrued_cents == 0 and version == 1"
            - "id is a server-minted UUID; created_at/updated_at populated with ISO8601 UTC"

      - name: facility_create_duplicate_ccn_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_CCN]", "validations[priority=6]"]
        distinguishing_aspect: "Second facility with the same cms_certification_number fails with ERR_DUPLICATE_CCN (409); the first is unaffected."
        test_recipe:
          setup: ["Facility F with CCN CCN-E2 exists"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-E2", bed_count: 50 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /transparency/facilities", payload: { name: "G", cms_certification_number: "CCN-E2", bed_count: 75 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_DUPLICATE_CCN (http 409)"]

      - name: payer_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Payer.fields.payer_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "payer_type is required input; omitting it fails ERR_INVALID_REQUEST (400) before any entity is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /transparency/payers", payload: { name: "PA" }, as: ContractManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (http 400)"]

      - name: payer_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Payer.fields.payer_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "payer_type outside {COMMERCIAL, MEDICARE_ADVANTAGE, MEDICAID_MANAGED} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "TRICARE" }, as: ContractManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (http 400)"]

      - name: service_item_duplicate_code_within_facility_rejected
        claim_type: type_constraints
        grounds: [entities.ServiceItem.fields.code, "errors[ERR_DUPLICATE_ITEM_CODE]"]
        distinguishing_aspect: "Code uniqueness is scoped to the facility: same code twice at one facility fails ERR_DUPLICATE_ITEM_CODE, while the same code at another facility succeeds."
        test_recipe:
          setup: ["Facilities F1, F2; item code 70551 exists at F1"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F1", cms_certification_number: "CCN-E3A", bed_count: 50 }, as: PlatformAdmin, captures: { f1: $.data.id } }
            - { call: "POST /transparency/facilities", payload: { name: "F2", cms_certification_number: "CCN-E3B", bed_count: 50 }, as: PlatformAdmin, captures: { f2: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${f1}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer }
          trigger:
            - { call: "POST /transparency/service-items", payload: { facility_id: "${f1}", code: "70551", code_type: "CPT", description: "MRI dup", service_class: "SHOPPABLE", gross_charge_cents: 110000 }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${f2}", code: "70551", code_type: "CPT", description: "MRI other facility", service_class: "SHOPPABLE", gross_charge_cents: 90000 }, as: TransparencyOfficer, captures: { ok_id: $.data.id } }
          assert:
            - "duplicate at F1: error_id == ERR_DUPLICATE_ITEM_CODE (http 409)"
            - "same code at F2: created successfully (tenant-scoped uniqueness)"

      - name: charge_record_create_snapshots_gross_and_computes_fields
        claim_type: computed_fields
        grounds: [entities.StandardChargeRecord.fields.gross_charge_cents, entities.StandardChargeRecord.fields.min_negotiated_cents, calculations.standard_charge_extrema]
        distinguishing_aspect: "gross_charge_cents is a server-side snapshot of the item at creation (not client input), and min/max/derived are computed: EXACT_MIN 40000 over a single DISCLOSE_ALLOWED 40% rate."
        test_recipe:
          setup: ["Facility F; payer PA; contract DISCLOSE_ALLOWED ACTIVE; item SI gross 100000; rate 40% ACTIVE; cycle CY OPEN"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-E4", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
          trigger:
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { g: $.data.gross_charge_cents, mn: $.data.min_negotiated_cents, mx: $.data.max_negotiated_cents, der: $.data.derived_disclosure_cents, meth: $.data.derivation_method, st: $.data.status } }
          assert:
            - "gross_charge_cents == 100000 (snapshot from item; no client input field exists for it)"
            - "min_negotiated_cents == 40000 and max_negotiated_cents == 40000 (floor(100000*40/100))"
            - "derived_disclosure_cents == 40000 and derivation_method == EXACT_MIN; status == DRAFT"

      - name: shoppable_list_create_computes_entry_aggregates
        claim_type: computed_fields
        grounds: [entities.ShoppableServiceList.fields.entry_count, entities.ShoppableServiceList.fields.mandated_entry_count, calculations.shoppable_count_aggregation]
        distinguishing_aspect: "entry_count and mandated_entry_count are computed from the entries array at creation: 2 entries, 1 mandated."
        test_recipe:
          setup: ["Facility F; items SI1 (mandated) and SI2 (not mandated), both SHOPPABLE"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-E5", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000, cms_shoppable_mandated: true }, as: TransparencyOfficer, captures: { si1: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70450", code_type: "CPT", description: "CT", service_class: "SHOPPABLE", gross_charge_cents: 80000 }, as: TransparencyOfficer, captures: { si2: $.data.id } }
          trigger:
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L", entries: [ { service_item_id: "${si1}", display_name: "MRI", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 }, { service_item_id: "${si2}", display_name: "CT", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 2 } ] }, as: TransparencyOfficer, captures: { ec: $.data.entry_count, mc: $.data.mandated_entry_count, st: $.data.status } }
          assert: ["entry_count == 2 and mandated_entry_count == 1 and status == DRAFT"]

      - name: service_item_list_pagination_interacts_with_filter
        claim_type: listing
        grounds: [response_envelope, "endpoints:GET /transparency/facilities/{id}/service-items"]
        distinguishing_aspect: "limit=1 pages a 2-item collection into two pages: page 1 has has_more=true, page 2 has has_more=false, total_count==2 on both; service_class filter narrows the set before pagination."
        test_recipe:
          setup: ["Facility F with 2 SHOPPABLE items and 1 ANCILLARY item"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-E6", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70450", code_type: "CPT", description: "CT", service_class: "SHOPPABLE", gross_charge_cents: 80000 }, as: TransparencyOfficer }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "J2400", code_type: "HCPCS", description: "Inj", service_class: "ANCILLARY", gross_charge_cents: 333, ancillary_inclusion: "ALWAYS_BUNDLED" }, as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/facilities/${fac}/service-items?limit=1&offset=0", as: Consumer }
            - { call: "GET /transparency/facilities/${fac}/service-items?limit=1&offset=1", as: Consumer }
            - { call: "GET /transparency/facilities/${fac}/service-items?service_class=ANCILLARY", as: Consumer }
          assert:
            - "page 1: exactly 1 element, total_count == 3, has_more == true (default limit is 10 when omitted; explicit limit=1 honored)"
            - "page 2 (offset=1): 1 element, total_count == 3, has_more == true; offset=2 would give has_more == false"
            - "filtered ANCILLARY: exactly 1 element, total_count == 1, has_more == false — filter applies before pagination"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: contract_terminal_lockdown_activate_after_terminate
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PayerContract, "errors[ERR_CONTRACT_ALREADY_TERMINAL]"]
        distinguishing_aspect: "From TERMINATED every action transition is rejected: activate returns ERR_CONTRACT_ALREADY_TERMINAL and no side effects fire."
        test_recipe:
          setup: ["Facility F; payer PA; contract C ACTIVE then TERMINATED"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM1", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { c: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${c}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${c}/terminate", as: ContractManager }
          trigger:
            - { call: "POST /transparency/payer-contracts/${c}/activate", as: ContractManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CONTRACT_ALREADY_TERMINAL (http 409); contract remains TERMINATED"]

      - name: contract_renegotiate_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PayerContract.ACTIVE_to_RENEGOTIATING, "errors[ERR_CONTRACT_ALREADY_TERMINAL]"]
        distinguishing_aspect: "renegotiate is defined only from ACTIVE; from DRAFT it fails ERR_CONTRACT_ALREADY_TERMINAL (non-ACTIVE guard)."
        test_recipe:
          setup: ["Facility F; payer PA; contract C DRAFT"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM2", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /transparency/payer-contracts/${c}/renegotiate", as: ContractManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CONTRACT_ALREADY_TERMINAL (http 409); contract remains DRAFT"]

      - name: cycle_freeze_blocked_below_record_floor
        claim_type: precondition_enforcement
        grounds: [state_machines.PublicationCycle.OPEN_to_FROZEN, calculations.cycle_posture_derivation, "errors[ERR_POSTURE_NOT_FREEZABLE]"]
        distinguishing_aspect: "With min_records_per_cycle == 2 and only 1 VALIDATED record, posture == COLLECTING and freeze fails; after the second validate, posture == FREEZABLE and freeze succeeds."
        test_recipe:
          setup: ["Facility F (min_records_per_cycle 2); contract+rate ACTIVE covering items SI1 and SI2; cycle CY OPEN with R1, R2 DRAFT"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM3", bed_count: 50, min_records_per_cycle: 2 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si1: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70450", code_type: "CPT", description: "CT", service_class: "SHOPPABLE", gross_charge_cents: 80000 }, as: TransparencyOfficer, captures: { si2: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si1}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si2}", rate_type: "PERCENT_OF_GROSS", rate_percent: 50 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si1}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si2}", discounted_cash_cents: 40000 }, as: TransparencyOfficer, captures: { r2: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { posture1: $.data.posture } }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /transparency/standard-charge-records/${r2}/validate", as: TransparencyOfficer }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { posture2: $.data.posture, cnt2: $.data.validated_record_count } }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { st: $.data.status } }
          assert:
            - "with 1 VALIDATED record: posture == COLLECTING and freeze fails ERR_POSTURE_NOT_FREEZABLE (409)"
            - "with 2 VALIDATED records: posture == FREEZABLE, validated_record_count == 2, freeze succeeds (status == FROZEN)"

      - name: cycle_publish_blocked_without_valid_file
        claim_type: precondition_enforcement
        grounds: [state_machines.PublicationCycle.FROZEN_to_PUBLISHED, calculations.cycle_posture_derivation, "errors[ERR_POSTURE_NOT_PUBLISHABLE]"]
        distinguishing_aspect: "A FROZEN cycle with no generated file has posture AWAITING_FILE; publish fails ERR_POSTURE_NOT_PUBLISHABLE. A FROZEN cycle whose SEALED file is INVALID (posture FILE_INVALID) also fails with the same error."
        test_recipe:
          setup: ["Facility F; contract+rate ACTIVE; item SI; cycle CY with one VALIDATED record, FROZEN; no file yet"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM4", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { posture: $.data.posture } }
            - { call: "POST /transparency/publication-cycles/${cy}/publish", as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert:
            - "posture == AWAITING_FILE (FROZEN with no SEALED file)"
            - "publish fails: error_id == ERR_POSTURE_NOT_PUBLISHABLE (409); cycle stays FROZEN"

      - name: cycle_supersede_cascade_on_next_publish
        claim_type: side_effect_execution
        grounds: [state_machines.PublicationCycle.PUBLISHED_to_SUPERSEDED, state_machines.StandardChargeRecord.PUBLISHED_to_SUPERSEDED, state_machines.MachineReadableFile.PUBLISHED_to_SUPERSEDED]
        distinguishing_aspect: "Publishing the September cycle supersedes the August cycle, its PUBLISHED record, and its PUBLISHED file in one cascade — the monthly versioning chain."
        test_recipe:
          setup:
            - "Facility F; contract+rate ACTIVE; item SI; cycle CY_A [2026-08-01, 2026-09-01) fully PUBLISHED with record R_A and file F_A; cycle CY_B [2026-09-01, 2026-10-01) FROZEN with VALIDATED record R_B and SEALED VALID file F_B"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM5", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cya: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cya}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { ra1: $.data.id } }
