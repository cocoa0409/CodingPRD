            - "AllocationEvent.${evq_id}.requests == [] — the rejected request left no residue"

      - name: plan_activate_gated_on_review_acknowledgement
        grounds:
          - state_machines.CorrectivePlan.PROPOSED_to_ACTIVE
          - errors[ERR_REVIEW_NOT_ACKNOWLEDGED]
          - endpoints.POST_/corrective-plans/{id}/activate
        distinguishing_aspect: "Dependency across the CorrectivePlan -> PerformanceReview pair (distinct from allocation_request_gated_on_wholesaler_status's event->wholesaler pair): plan activation is rejected while the parent review is PUBLISHED and succeeds only after the wholesaler acknowledges it."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to wholesaler WK (STANDARD); a 2026-Q3 review (distribution 50, share 30, no audits -> freshness 100.00) scores 59.00 and spawns a PROPOSED plan while the review is still PUBLISHED."
