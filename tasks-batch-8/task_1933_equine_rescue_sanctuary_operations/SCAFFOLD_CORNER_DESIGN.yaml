            - { call: "POST /rescue-ops/rehabilitation-plans", payload: { horse_id: "${h}", expected_horse_version: "${h_v}", goals: "plan B stale", target_body_condition_score: 6, planned_weeks: 6 }, as: Veterinarian, as_user_id: "${vet_id}", captures: { err: $.data.error_id } }
            - { call: "GET /rescue-ops/horses/${h}", as: Veterinarian, as_user_id: "${vet_id}", captures: { h_v2: $.data.version } }
            - { call: "POST /rescue-ops/rehabilitation-plans", payload: { horse_id: "${h}", expected_horse_version: "${h_v2}", goals: "plan B fresh", target_body_condition_score: 6, planned_weeks: 6 }, as: Veterinarian, as_user_id: "${vet_id}", captures: { plan_b: $.data.id } }
            - { call: "GET /rescue-ops/rehabilitation-plans/${plan_a}", as: Veterinarian, as_user_id: "${vet_id}", captures: { pa_st: $.data.status } }
          assert:
