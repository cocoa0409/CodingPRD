              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "INVARIANT-2", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "${treaty_id}" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /mortgage-insurance/loans/${loan_id}/amortization-milestones"
              payload: { current_upb_cents: 34500000 }
              as: Servicer
            - call: "POST /mortgage-insurance/claims"
              payload: { loan_id: "${loan_id}", event_kind: "FORECLOSURE", event_completed_utc: "2026-08-01T00:00:00Z", unpaid_principal_cents: 8000000, accrued_interest_cents: 1500000, allowable_advances_cents: 5000000, gross_proceeds_cents: 7000000, expenses_of_sale_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /mortgage-insurance/claims/${claim_id}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /mortgage-insurance/claims/${claim_id}/approve"
              payload: {}
              as: Underwriter
              captures: { claim_pre_v: $.data.version }
            - call: "GET /mortgage-insurance/loans/${loan_id}"
              payload: {}
              as: Underwriter
              captures: { loan_pre_settle_v: $.data.version }
            - call: "POST /mortgage-insurance/claims/${claim_id}/settle"
              payload: { settlement_option_kind: "CASH", expected_claim_version: "${claim_pre_v}", expected_loan_version: "${loan_pre_settle_v}" }
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans/${loan_id}/external-reports"
              payload: { verified_loan_amount_cents: 34000000, verified_property_value_cents: 39000000, post_origination_value_cents: 0, occupancy_reported: "OWNER_OCCUPIED", independent_validation_completed_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /mortgage-insurance/coverage-disputes"
              payload: { loan_id: "${loan_id}", lender_id: "${lender_id}", target_claim_id: "${claim_id}", grounds: "ORIGINATION_OMISSION", asserted_coverage_percent: 25 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { dispute_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-disputes/${dispute_id}/begin-review"
              payload: {}
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/lenders/${lender_id}/exposure-reconciliations"
              payload: { expected_loan_version: "${loan_pre_settle_v}", loan_id: "${loan_id}" }
              as: Underwriter
              captures: { contribution_after_settle: $.data.lender_contribution_cents }
          trigger:
            - call: "POST /mortgage-insurance/coverage-disputes/${dispute_id}/decide"
              payload: { decision: "RESCISSION_GRANTED", decision_reason: "Origination omission established on independent review" }
              as: MasterPolicyAdmin
          assert:
            - "Loan.${loan_id}.rescission_relief_status == NONE before the decision, so the rescission is permitted"
            - "Loan.${loan_id}.aggregate_ceded_cents was 5000000 immediately after settlement"
            - "Claim.${claim_id}.status == RESCINDED and Loan.${loan_id}.coverage_status == CANCELLED"
            - "after the rescission the loan's aggregate_ceded_cents == 0, so a fresh exposure reconciliation returns lender_contribution_cents == 2975000, exactly the value the lender held before any claim on this loan settled"
            - "the reversal subtracted exactly the ceded amount the settlement had added, leaving the exposure contribution with no drift"
