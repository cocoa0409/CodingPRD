            - "${s1_sub} == \"FIBER_DECLARED\" and ${s1_org} == \"ORIGIN_ISSUED\""
            - "${s2_sub} == \"FIBER_TEST_PENDING\" and ${s2_org} == \"ORIGIN_ISSUED\""
            - "${s3_sub} == \"FIBER_MISSTATED\" and ${s3_org} == \"ORIGIN_ISSUED\""
            - "${s4_sub} == \"FIBER_TEST_PENDING\" and ${s4_org} == \"ORIGIN_ISSUED\""
            - "${s5_sub} == \"FIBER_SUBSTANTIATED\" and ${s5_org} == \"ORIGIN_ISSUED\""
            - "${s6_sub} == \"FIBER_SUBSTANTIATED\" and ${s6_org} == \"ORIGIN_UNDETERMINED\""
            - "LabTest.${ft_id}.state == \"PASSED\" and LabTest.${ft_id}.attempt_no == 2"
            - "OriginDetermination.${od_id}.state == \"VOID\""
            - "Style.${style_id}.label_readiness == \"BLOCKED\""

      - name: label_spec_revision_cycle_returns_to_pending_approval_and_then_approves
        grounds:
          - state_machines[entity=LabelSpec]
          - endpoints[POST /labeling/label-specs/{id}/request-revision]
          - endpoints[PATCH /labeling/label-specs/{id}]
          - errors.ERR_LABEL_STATE_INVALID
          - entities.LabelSpec.fields.revision_note
          - entities.LabelSpec.fields.content_hash
        distinguishing_aspect: |
          The approval loop DRAFT -> PENDING_APPROVAL -> REVISION_REQUESTED -> DRAFT -> PENDING_APPROVAL -> APPROVED visits DRAFT and PENDING_APPROVAL twice, and the edge back to DRAFT is carried by the same PATCH that also serves DRAFT -> DRAFT, so a linear reading of the machine either forbids the second submit or lets PATCH mutate a row that is already awaiting approval; the cycle also proves content_hash is recomputed on the re-edit while revision_note survives the loop.
