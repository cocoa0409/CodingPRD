          One observations call chooses between two forks by score alone. Five MAJOR RECORDKEEPING
          observations give deduction 15 -> subscore 50.00 -> term 15.00 -> readiness_score exactly 85.00,
          which is >= NAI_THRESHOLD, so the engagement jumps straight to the terminal CLOSED_NAI with
          outcome_class NAI and response_due_at NULL — no OBSERVATIONS_ISSUED stop, no registrant
          response, and Facility.last_inspection_outcome is set immediately (unlike fork B, which defers
          it to the sweep).
