  - rule_id: transitive_cascade
    instances:
      - name: audit_material_defect_cascade_to_pool_rebalance
        grounds:
          - state_machines.AuditFinding.REBUTTED_to_UPHELD
          - state_machines.PostCloseAudit.FINDINGS_ISSUED_to_MATERIAL_DEFECT
          - state_machines.LoanFile.CLOSED_to_AUDIT_DEFECT
          - state_machines.SecuritizationPool.OPEN_to_REBALANCING
          - calculations.audit_grade
          - calculations.pool_metrics_recompute
        distinguishing_aspect: |
          Cascade depth 4, triggered from the audit aggregate: adjudicating one finding
          (AuditFinding) makes the audit terminal (PostCloseAudit), which defects the loan
          (LoanFile), which detaches it from and rebalances its pool
          (SecuritizationPool + pool_metrics_recompute). Four distinct entities move on one
          POST, and the fourth hop is a numeric recomputation, not just a state change.
        test_recipe:
          setup:
            - "A DSCR program, an investment borrower, and an OPEN pool PL-2026A with target_balance_cents 200000000."
            - "Loan A: 60000000 cents on an 80000000-cent property (LTV exactly 75.00, so no second valuation is required), interest-only at 8.750, lease rent 640000, market rent 620000."
            - "Loan A is driven all the way to CLOSED and assigned to the pool, so the pool reads 60000000 / 8.7500 / 1 member."
            - "An OPEN post-close audit on loan A with one MATERIAL finding (defect_score 6, grade C_MATERIAL) that has been rebutted once."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "DSCR", name: "Investor DSCR", min_dscr: 1.1000, max_ltv_pct: 85.00, min_fico: 660, min_reserves_months: 6, min_residual_income_cents: 0, second_valuation_ltv_threshold_pct: 75.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: true, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_ca_id: "$.data.id" }
            - call: "POST /borrowers"
              payload: { legal_name: "Gullane Holdings LLC", fico_score: 745, self_employed_flag: false, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 55 }
              as: LoanOfficer
              captures: { bor_ca_id: "$.data.id" }
            - call: "POST /securitization-pools"
              payload: { pool_code: "PL-2026A", investor_code: "INV-ATLAS", target_balance_cents: 200000000 }
              as: SecuritizationAnalyst
              captures: { pool_ca_id: "$.data.id", pool_ca_v0: "$.data.version" }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_ca_id}", program_id: "${prog_ca_id}", investor_code: "INV-ATLAS", loan_amount_cents: 60000000, purchase_price_cents: 80000000, property_value_cents: 80000000, occupancy: "INVESTMENT", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 20000, monthly_hoa_cents: 0, gross_market_rent_cents: 620000, lease_rent_cents: 640000 }
              as: LoanOfficer
              captures: { lf_ca_id: "$.data.id" }
            - call: "POST /loan-files/${lf_ca_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-7"
            - call: "POST /loan-files/${lf_ca_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_ca_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-ALPHA", effective_date: "2026-05-01T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_ca_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_ca_id}/receive"
              payload: { appraised_value_cents: 80000000 }
              as: AppraisalReviewer
            - call: "POST /valuation-orders/${vo_ca_id}/decision"
              payload: { decision: "ACCEPTED" }
              as: AppraisalReviewer
            - call: "POST /loan-files/${lf_ca_id}/points-and-fees-test"
              payload: {}
              as: Underwriter
              as_user_id: "uw-7"
            - call: "POST /loan-files/${lf_ca_id}/atr-determination"
              payload: {}
              as: Underwriter
              as_user_id: "uw-7"
            - call: "POST /loan-files/${lf_ca_id}/approve"
              payload: { approval_note: "DSCR 1.2367 clears the 1.1000 floor" }
              as: Underwriter
              as_user_id: "uw-7"
            - call: "POST /loan-files/${lf_ca_id}/close"
              payload: {}
              as: LoanOfficer
            - call: "POST /securitization-pools/${pool_ca_id}/loans"
              payload: { loan_file_id: "${lf_ca_id}", expected_pool_version: "${pool_ca_v0}" }
              as: SecuritizationAnalyst
            - call: "POST /post-close-audits"
              payload: { loan_file_id: "${lf_ca_id}", sample_reason: "RANDOM" }
              as: PostCloseAuditor
              captures: { aud_ca_id: "$.data.id" }
            - call: "POST /audit-findings"
              payload: { audit_id: "${aud_ca_id}", finding_code: "AF-INC-01", category: "INCOME_CALCULATION", severity: "MATERIAL" }
              as: PostCloseAuditor
              captures: { af_ca_id: "$.data.id" }
