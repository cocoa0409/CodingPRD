      - name: payment_on_fleet_bill_booking_not_due
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_PAYMENT_NOT_DUE]"]
        distinguishing_aspect: "Direct payment on a FLEET_BILL booking is rejected — that billing axis is settled only via invoices."
        test_recipe:
