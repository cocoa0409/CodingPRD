# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already carried by §1.8. Each active
# instance's setup_api_calls is a §1.5 reachability audit; excluded_because
# stubs point at the §1.8 instance that already exercises the corner.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_machine_defaults_mix_to_par
        claim_type: Defaults
        grounds: [entities.Machine.fields.current_mix_level_oz, entities.Machine.fields.mix_par_oz]
        distinguishing_aspect: "Creating a machine without initial_mix_oz sets current_mix_level_oz equal to mix_par_oz (800)."
        test_recipe:
          setup: ["No machine exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 800 }
              as: Manager
              captures: { m_id: $.data.id }
          assert:
            - "Machine.${m_id}.current_mix_level_oz == 800"
            - "Machine.${m_id}.sanitation_status == READY"
            - "Machine.${m_id}.version == 1"

      - name: create_topping_defaults_available
        claim_type: Creation
        grounds: [entities.Topping.fields.status, entities.Topping.fields.on_hand_units]
        distinguishing_aspect: "A new topping starts AVAILABLE with on_hand_units equal to initial_units (50)."
        test_recipe:
          setup: ["No topping exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /toppings"
              payload: { name: "Mochi", surcharge_cents: 30, initial_units: 50 }
              as: ShiftLead
              captures: { top_id: $.data.id }
          assert:
            - "Topping.${top_id}.status == AVAILABLE"
            - "Topping.${top_id}.on_hand_units == 50"

      - name: get_machine_not_found
        claim_type: Not Found
        grounds: ['errors[ERR_MACHINE_NOT_FOUND]']
        distinguishing_aspect: "GET on a non-existent machine id returns ERR_MACHINE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /machines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Cashier
          assert:
            - "response error_id == ERR_MACHINE_NOT_FOUND"

      - name: create_flavor_missing_required_price
        claim_type: Required Fields
        grounds: [entities.Flavor.fields.price_per_oz_cents, 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "POST /flavors omitting price_per_oz_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A machine exists."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", cost_per_oz_cents: 20 }
              as: ShiftLead
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: create_flavor_bad_machine_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Flavor.fields.machine_id, 'errors[ERR_MACHINE_NOT_FOUND]']
        distinguishing_aspect: "POST /flavors with an unresolvable machine_id returns ERR_MACHINE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flavors"
              payload: { machine_id: "00000000-0000-4000-8000-000000000000", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
          assert:
            - "response error_id == ERR_MACHINE_NOT_FOUND"

      - name: flavor_machine_id_reverse_reachable
        claim_type: Retrieval
        grounds: [entities.Flavor.fields.machine_id]
        distinguishing_aspect: "GET /flavors?machine_id lists the flavors loaded on a machine (FK reverse-reachability)."
        test_recipe:
          setup: ["A machine with one loaded flavor."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /flavors?machine_id=${m_id}"
              payload: { machine_id: "${m_id}" }
              as: Cashier
          assert:
            - "response data has exactly 1 flavor with id ${f_id}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: complete_cleaning_from_ready_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Machine.CLEANING_to_READY, 'errors[ERR_MACHINE_INVALID_STATE]']
        distinguishing_aspect: "complete-cleaning on a READY (not CLEANING) machine returns ERR_MACHINE_INVALID_STATE; no SanitationLog appended."
        test_recipe:
          setup: ["A READY machine."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /machines/${m_id}/complete-cleaning"
              payload: {}
              as: ShiftLead
          assert:
            - "response error_id == ERR_MACHINE_INVALID_STATE"

      - name: void_open_ticket_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SaleTicket.CHARGED_to_VOIDED, 'errors[ERR_TICKET_NOT_CHARGED]']
        distinguishing_aspect: "void on an OPEN (never charged) ticket returns ERR_TICKET_NOT_CHARGED."
        test_recipe:
          setup: ["An OPEN ticket with no lines."]
          setup_api_calls:
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sale-tickets/${t_id}/void"
              payload: {}
              as: ShiftLead
          assert:
            - "response error_id == ERR_TICKET_NOT_CHARGED"

      - name: double_checkout_rejected
        claim_type: idempotency
        grounds: [state_machines.SaleTicket.OPEN_to_CHARGED, 'errors[ERR_TICKET_NOT_OPEN]']
        distinguishing_aspect: "A second checkout on an already CHARGED ticket returns ERR_TICKET_NOT_OPEN."
        test_recipe:
          setup: ["A charged single-line ticket."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
          assert:
            - "response error_id == ERR_TICKET_NOT_OPEN"

      - name: cancel_fulfilled_catering_rejected
        claim_type: terminal_state
        grounds: [state_machines.CateringOrder.CONFIRMED_to_FULFILLED, 'errors[ERR_CATERING_INVALID_STATE]']
        distinguishing_aspect: "cancel on a FULFILLED (terminal) catering order returns ERR_CATERING_INVALID_STATE."
        test_recipe:
          setup: ["A resource; an order quoted, confirmed with deposit, and fulfilled."]
          setup_api_calls:
            - call: "POST /catering-resources"
              payload: { name: "Cart-1" }
              as: Manager
              captures: { r_id: $.data.id }
            - call: "POST /catering-orders"
              payload: { resource_id: "${r_id}", event_start: "2026-03-02T10:00:00Z", event_end: "2026-03-02T12:00:00Z", guest_count: 20, line_items: [ { qty: 1, unit_price_cents: 1000, discount_pct: 0 } ] }
              as: Cashier
              captures: { o_id: $.data.id }
            - call: "POST /catering-orders/${o_id}/quote"
              payload: {}
              as: Manager
            - call: "POST /catering-orders/${o_id}/confirm"
              payload: { deposit_paid_cents: 250 }
              as: Manager
            - call: "POST /catering-orders/${o_id}/fulfill"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /catering-orders/${o_id}/cancel"
              payload: {}
              as: Manager
          assert:
            - "response error_id == ERR_CATERING_INVALID_STATE"
            - "CateringOrder.${o_id}.status == FULFILLED"

      - name: rotate_out_already_rotated_flavor_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Flavor.LOADED_to_ROTATED_OUT, 'errors[ERR_FLAVOR_INVALID_STATE]']
        distinguishing_aspect: "rotate-out on a flavor already ROTATED_OUT returns ERR_FLAVOR_INVALID_STATE."
        test_recipe:
          setup: ["A machine with a flavor that has been rotated out once."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /flavors/${f_id}/rotate-out"
              payload: {}
              as: ShiftLead
          trigger:
            - call: "POST /flavors/${f_id}/rotate-out"
              payload: {}
              as: ShiftLead
          assert:
            - "response error_id == ERR_FLAVOR_INVALID_STATE"

      - name: addline_machine_cleaning_rejected
        claim_type: guarded_transition
        grounds: ['validations[priority=6]', state_machines.Machine.READY_to_CLEANING, 'errors[ERR_MACHINE_NOT_READY]']
        distinguishing_aspect: "Dispensing from a machine in CLEANING (not OUT_OF_SERVICE) also returns ERR_MACHINE_NOT_READY — a different producing state than the §1.8 OUT_OF_SERVICE case."
        test_recipe:
          setup: ["A machine put into CLEANING with a loaded flavor; an OPEN ticket."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /machines/${m_id}/start-cleaning"
              payload: {}
              as: ShiftLead
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 5.0 }
              as: Cashier
          assert:
            - "response error_id == ERR_MACHINE_NOT_READY"

      - name: complete_cleaning_restores_suspended_flavor
        claim_type: side_effect
        grounds: [state_machines.Machine.CLEANING_to_READY, state_machines.Flavor.SUSPENDED_to_LOADED]
        distinguishing_aspect: "After a machine goes OUT_OF_SERVICE (flavor SUSPENDED), start+complete cleaning returns the flavor to LOADED."
        test_recipe:
          setup: ["A machine overdue for cleaning with a suspended flavor (via check-sanitation at 05:00)."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T05:00:00Z" }
              as: Manager
            - call: "POST /machines/${m_id}/check-sanitation"
              payload: {}
              as: ShiftLead
            - call: "POST /machines/${m_id}/start-cleaning"
              payload: {}
              as: ShiftLead
          trigger:
            - call: "POST /machines/${m_id}/complete-cleaning"
              payload: {}
              as: ShiftLead
          assert:
            - "Machine.${m_id}.sanitation_status == READY"
            - "Flavor.${f_id}.status == LOADED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: waste_topping_cogs_retail_valuation
        claim_type: Correct Result
        grounds: [calculations.waste_valuation, entities.WasteEvent.fields.cogs_value_cents]
        distinguishing_aspect: "Topping waste of 3 units values COGS = 3*12 = 36c and RETAIL = 3*40 = 120c (topping branch of waste_valuation)."
        test_recipe:
          setup: ["A topping with 40c surcharge."]
          setup_api_calls:
            - call: "POST /toppings"
              payload: { name: "Peanuts", surcharge_cents: 40, initial_units: 50 }
              as: ShiftLead
              captures: { top_id: $.data.id }
          trigger:
            - call: "POST /waste-events"
              payload: { topping_id: "${top_id}", waste_units: 3, reason: "SPILL" }
              as: ShiftLead
              captures: { w_id: $.data.id }
          assert:
            - "WasteEvent.${w_id}.cogs_value_cents == 36"
            - "WasteEvent.${w_id}.retail_value_cents == 120"

      - name: reconciliation_cash_variance_computed
        claim_type: Correct Result
        grounds: [calculations.reconciliation_variance, entities.DailyReconciliation.fields.cash_variance_cents]
        distinguishing_aspect: "Counted cash 500 against one reconciled 402c ticket yields expected_revenue 402 and cash_variance 98."
        test_recipe:
          setup: ["One charged 402c ticket; a reconciliation opened."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
            - call: "POST /daily-reconciliations"
              payload: { business_date: "2026-03-01" }
              as: Manager
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /daily-reconciliations/${rec_id}/close"
              payload: { counted_cash_cents: 500 }
              as: Manager
          assert:
            - "DailyReconciliation.${rec_id}.expected_revenue_cents == 402"
            - "DailyReconciliation.${rec_id}.cash_variance_cents == 98"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: addline_insufficient_mix_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=12]', 'errors[ERR_INSUFFICIENT_MIX]']
        distinguishing_aspect: "A cup requesting net 10 oz from a machine holding only 5 oz of mix returns ERR_INSUFFICIENT_MIX (402)."
        test_recipe:
          setup: ["A READY machine with only 5 oz of mix; a loaded flavor; an OPEN ticket."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 5 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 10.0 }
              as: Cashier
          assert:
            - "response error_id == ERR_INSUFFICIENT_MIX"

      - name: catering_confirm_deposit_insufficient_when_state_ok
        claim_type: violation_to_error
        grounds: ['validations[priority=11]', 'errors[ERR_DEPOSIT_INSUFFICIENT]']
        distinguishing_aspect: "On a properly QUOTED order (state OK), confirming with deposit below required_deposit (0 < 250) returns ERR_DEPOSIT_INSUFFICIENT — isolates the fiscal check from the §1.8 priority-conflict."
        test_recipe:
          setup: ["A resource; an order quoted (invoice 1000, required deposit 250)."]
          setup_api_calls:
            - call: "POST /catering-resources"
              payload: { name: "Cart-1" }
              as: Manager
              captures: { r_id: $.data.id }
            - call: "POST /catering-orders"
              payload: { resource_id: "${r_id}", event_start: "2026-03-02T10:00:00Z", event_end: "2026-03-02T12:00:00Z", guest_count: 20, line_items: [ { qty: 1, unit_price_cents: 1000, discount_pct: 0 } ] }
              as: Cashier
              captures: { o_id: $.data.id }
            - call: "POST /catering-orders/${o_id}/quote"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /catering-orders/${o_id}/confirm"
              payload: { deposit_paid_cents: 0 }
              as: Manager
          assert:
            - "response error_id == ERR_DEPOSIT_INSUFFICIENT"
            - "CateringOrder.${o_id}.status == QUOTED"

      - name: invalid_window_end_before_start_rejected
        claim_type: type_constraint
        grounds: ['validations[priority=10]', 'errors[ERR_INVALID_WINDOW]', entities.MaintenanceWindow.fields.window_end]
        distinguishing_aspect: "A maintenance window with window_end <= window_start returns ERR_INVALID_WINDOW (400)."
        test_recipe:
          setup: ["A machine (version captured)."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { machine_id: "${m_id}", window_start: "2026-03-05T12:00:00Z", window_end: "2026-03-05T11:00:00Z", expected_machine_version: "${m_v}" }
              as: ShiftLead
          assert:
            - "response error_id == ERR_INVALID_WINDOW"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_machines_pagination_has_more
        claim_type: Listing
        grounds: [endpoints, entities.Machine.fields.name]
        distinguishing_aspect: "With two machines and limit=1, GET /machines reports has_more=true and total_count=2."
        test_recipe:
          setup: ["Two machines exist."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
            - call: "POST /machines"
              payload: { name: "Barrel-B", mix_par_oz: 1000 }
              as: Manager
          trigger:
            - call: "GET /machines?limit=1&offset=0"
              payload: { limit: 1, offset: 0 }
              as: Cashier
          assert:
            - "response meta pagination total_count == 2"
            - "response has_more == true"

      - name: voucher_redeem_reduces_checkout_total
        claim_type: Conditional action
        grounds: [entities.RewardVoucher.fields.status, entities.SaleTicket.fields.redeemed_voucher_id, calculations.sale_ticket_total]
        distinguishing_aspect: "Redeeming a 500c voucher on a 1100c cup yields quoted_total 600 and flips the voucher to REDEEMED."
        test_recipe:
          setup: ["A voucher issued via the punch cascade (loyalty seeded at 9, one reconciled ticket); a fresh 20 oz cup ticket for the same member."]
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { member_name: "Ada", initial_punch_count: 9 }
              as: Cashier
              captures: { la_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 2000, initial_mix_oz: 2000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: { loyalty_account_id: "${la_id}" }
              as: Cashier
              captures: { t1_id: $.data.id }
            - call: "POST /sale-tickets/${t1_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t1_id}/checkout"
              payload: {}
              as: Cashier
            - call: "POST /daily-reconciliations"
              payload: { business_date: "2026-03-01" }
              as: Manager
              captures: { rec_id: $.data.id }
            - call: "POST /daily-reconciliations/${rec_id}/close"
              payload: { counted_cash_cents: 402 }
              as: Manager
            - call: "GET /reward-vouchers?loyalty_account_id=${la_id}"
              payload: { loyalty_account_id: "${la_id}" }
              as: Cashier
              captures: { v_id: "$.data[0].id" }
            - call: "POST /sale-tickets"
              payload: { loyalty_account_id: "${la_id}" }
              as: Cashier
              captures: { t2_id: $.data.id }
            - call: "POST /sale-tickets/${t2_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 20.0 }
              as: Cashier
          trigger:
            - call: "POST /sale-tickets/${t2_id}/checkout"
              payload: { voucher_id: "${v_id}" }
              as: Cashier
          assert:
            - "SaleTicket.${t2_id}.quoted_total_cents == 600"
            - "SaleTicket.${t2_id}.redeemed_voucher_id == ${v_id}"
            - "RewardVoucher.${v_id}.status == REDEEMED"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: cashier_cannot_create_machine
        claim_type: rbac_denial
        grounds: [roles, 'errors[ERR_FORBIDDEN_ROLE]']
        distinguishing_aspect: "A Cashier calling the Manager-only POST /machines is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Cashier
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: cashier_cannot_close_reconciliation
        claim_type: rbac_denial
        grounds: [roles, 'errors[ERR_FORBIDDEN_ROLE]']
        distinguishing_aspect: "A Cashier calling the Manager-only reconciliation close is denied with ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["An OPEN reconciliation created by a Manager."]
          setup_api_calls:
            - call: "POST /daily-reconciliations"
              payload: { business_date: "2026-03-01" }
              as: Manager
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /daily-reconciliations/${rec_id}/close"
              payload: { counted_cash_cents: 0 }
              as: Cashier
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_maintenance_window_stale_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[maintenance-window-create-stale-machine]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "After one window bumps Machine.version 1→2, a second create still carrying expected_machine_version=1 (non-overlapping time) is refused with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A machine at version 1; window1 scheduled with the observed version, advancing the machine to version 2."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id, m_v1: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { machine_id: "${m_id}", window_start: "2026-03-05T10:00:00Z", window_end: "2026-03-05T11:00:00Z", expected_machine_version: "${m_v1}" }
              as: ShiftLead
          trigger:
            - call: "POST /maintenance-windows"
              payload: { machine_id: "${m_id}", window_start: "2026-03-20T10:00:00Z", window_end: "2026-03-20T11:00:00Z", expected_machine_version: "${m_v1}" }
              as: ShiftLead
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: occ_reconciliation_adjustment_stale_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[reconciliation-adjustment-stale]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "After one adjustment bumps DailyReconciliation.version 1→2, a second adjustment carrying expected_daily_reconciliation_version=1 is refused with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An OPEN reconciliation at version 1; one adjustment posted with the observed version (→ version 2)."]
          setup_api_calls:
            - call: "POST /daily-reconciliations"
              payload: { business_date: "2026-03-01" }
              as: Manager
              captures: { rec_id: $.data.id, r_v1: $.data.version }
            - call: "POST /daily-reconciliations/${rec_id}/adjustments"
              payload: { amount_cents: 100, reason: "till float", expected_daily_reconciliation_version: "${r_v1}" }
              as: Manager
          trigger:
            - call: "POST /daily-reconciliations/${rec_id}/adjustments"
              payload: { amount_cents: 50, reason: "second post", expected_daily_reconciliation_version: "${r_v1}" }
              as: Manager
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.LoyaltyAccount.fields.status]
        distinguishing_aspect: "A LoyaltyAccount created at version 1 is at version 2 after a suspend mutation."
        test_recipe:
          setup: ["An ACTIVE loyalty account."]
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { member_name: "Ada" }
              as: Cashier
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /loyalty-accounts/${la_id}/suspend"
              payload: {}
              as: Manager
          assert:
            - "LoyaltyAccount.${la_id}.version == 2"
            - "LoyaltyAccount.${la_id}.status == SUSPENDED"

      - name: void_restores_machine_mix_derived_field
        claim_type: derived_field_reconciliation
        grounds: [state_machines.SaleTicket.CHARGED_to_VOIDED, entities.Machine.fields.current_mix_level_oz]
        distinguishing_aspect: "A cup dispensing 7.3 oz drops mix 1000→992.7; voiding the charged ticket restores current_mix_level_oz to 1000."
        test_recipe:
          setup: ["A machine at 1000 oz, one loaded flavor, a charged single-line ticket dispensing 7.3 oz."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /sale-tickets/${t_id}/void"
              payload: {}
              as: ShiftLead
          assert:
            - "Machine.${m_id}.current_mix_level_oz == 1000"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: checkout_response_immediately_reflects_charge
        claim_type: immediate
        grounds: [entities.SaleTicket.fields.payment_status, entities.SaleTicket.fields.quoted_total_cents]
        distinguishing_aspect: "The checkout response body itself shows payment_status CHARGED and the computed quoted_total_cents (402) — no re-read needed."
        test_recipe:
          setup: ["A single-line ticket ready to charge."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
          trigger:
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
              captures: { charged_status: $.data.payment_status }
          assert:
            - "checkout response data.payment_status == CHARGED"
            - "checkout response data.quoted_total_cents == 402"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_allergen_conflict_on_addline
        claim_type: violation_to_error
        grounds: ['errors[ERR_ALLERGEN_CONFLICT]']
        excluded_because:
          difficulty_instance: addline_allergen_safety_beats_topping_constraint
          rationale: "The allergen-conflict error is asserted as the winning error of the §1.8 priority-conflict instance."
      - name: error_machine_not_ready_on_addline
        claim_type: violation_to_error
        grounds: ['errors[ERR_MACHINE_NOT_READY]']
        excluded_because:
          difficulty_instance: addline_requires_machine_ready
          rationale: "Machine-not-ready is asserted directly by the §1.8 cross-entity-dependency instance."
      - name: error_resource_double_booked_on_confirm
        claim_type: violation_to_error
        grounds: ['errors[ERR_RESOURCE_DOUBLE_BOOKED]']
        excluded_because:
          difficulty_instance: catering_halfopen_overlap_rejected
          rationale: "Double-booking is asserted by the §1.8 temporal-overlap instance."
