            - "expected_study_version 2 returns HTTP 412 with error.code == ERR_STALE_STUDY_VERSION"
            - "expected_study_version 4 - a version the study has never held - also returns HTTP 412 ERR_STALE_STUDY_VERSION; the check is equality, not 'not newer than'"
            - "expected_study_version 3 returns HTTP 201 with status == DRAFT and decision_confidence_before == 0.00"
            - "Replaying the same expected_study_version 3 immediately afterwards returns HTTP 412 ERR_STALE_STUDY_VERSION - the successful create incremented the study to 4"
            - "The final read shows version == 4 and exactly one Readout exists for the (study, decision) pair"
            - "Neither 412 created a Readout row and neither advanced Study.version"
