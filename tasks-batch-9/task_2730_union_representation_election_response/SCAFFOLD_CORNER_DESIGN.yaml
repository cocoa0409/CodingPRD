      - name: uniqueness_keys_are_scoped_exactly_as_declared
        claim_type: Violation → Error
        grounds:
          - validations[priority=23]
          - errors.ERR_DUPLICATE_CASE_NUMBER
          - errors.ERR_DUPLICATE_CLASSIFICATION_CODE
          - errors.ERR_DUPLICATE_SUPERVISOR
        distinguishing_aspect: |
          Three different scopes on one ladder row: case_number is global, Classification.code is unique per
          petition (so PROD may be created again on a second petition), and Supervisor uniqueness is the
          composite (petition_id, full_name, job_title) - the same person with a different job_title is a
          new row. An implementation that widens any of these keys fails at least one of the two positive
          controls.
        test_recipe:
          setup:
            - "petition A 07-RC-340316 in SCOPE_ANALYSIS with a PROD classification and supervisor Marta Kowalski, Shift Supervisor"
            - "petition B 07-RC-340317 in SCOPE_ANALYSIS with no classifications"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
