# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Community Center Program Registration & Operations
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: instructor_settlement_basis_divergence
        grounds:
          - calculations.instructor_settlement_pay
          - state_machines.InstructorContract.ACCEPTED_to_SETTLED
          - entities.InstructorContract.fields.settlement_basis
        distinguishing_aspect: |
          Same economics (two ENROLLED registrations each with net_paid 10000, 5000bp share, zero
          guarantee, four meetings held) settled under ENROLLMENT_BASIS on one session and
          ATTENDANCE_BASIS on another produce different payouts (10000 vs 5000) because the
          attendance-gated variant counts only the participant with attendance_pct >= 50.
          Entity domain: InstructorContract compensation.
        test_recipe:
          setup:
            - "Season FALL (resident window 2026-08-10, general 2026-08-17, closes 2026-09-15), PUBLISHED"
            - "Sessions SE (instructor I1, room R1) and SA (instructor I2, room R2), identical fees 10000/10000, capacity 5, min_enrollment 1, enrollment_check_at 2026-09-08T00:00:00Z, four meetings each 2026-09-20/27, 10-04/11 18:00-19:00Z"
            - "Contract CE on SE: ENROLLMENT_BASIS, 5000bp, guarantees 0, ACCEPTED; contract CA on SA: ATTENDANCE_BASIS, 5000bp, guarantees 0, ACCEPTED; both sessions PUBLISHED"
            - "Household HH (PENDING residency -> nonresident fee basis) with participants P1, P2; both registered and PAID 10000 into BOTH sessions (4 registrations)"
            - "VERIFIED safety forms for P1 and P2 for the season"
            - "Sweep at 2026-09-08 activates both sessions; at 2026-10-12 attendance on SA: P1 PRESENT all 4 meetings, P2 PRESENT only the first"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z", scholarship_budget_cents: 1000000 }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Multi Sport", category: "Sports", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Gym A", capacity: 50 }, as: ProgramCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Gym B", capacity: 50 }, as: ProgramCoordinator, captures: { r2: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Instructor One", email: "i1@x.com" }, as: ProgramCoordinator, captures: { i1: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Instructor Two", email: "i2@x.com" }, as: ProgramCoordinator, captures: { i2: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${i1}", title: "SE", capacity: 5, min_enrollment: 1, fee_resident_cents: 10000, fee_nonresident_cents: 10000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { se: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${i2}", title: "SA", capacity: 5, min_enrollment: 1, fee_resident_cents: 10000, fee_nonresident_cents: 10000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { sa: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${se}", instructor_id: "${i1}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ce: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${sa}", instructor_id: "${i2}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ATTENDANCE_BASIS }, as: ProgramCoordinator, captures: { ca: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${se}", room_id: "${r1}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${se}", room_id: "${r1}", starts_at: "2026-09-27T18:00:00Z", ends_at: "2026-09-27T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${se}", room_id: "${r1}", starts_at: "2026-10-04T18:00:00Z", ends_at: "2026-10-04T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${se}", room_id: "${r1}", starts_at: "2026-10-11T18:00:00Z", ends_at: "2026-10-11T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${sa}", room_id: "${r2}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator, captures: { am1: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sa}", room_id: "${r2}", starts_at: "2026-09-27T18:00:00Z", ends_at: "2026-09-27T19:00:00Z" }, as: ProgramCoordinator, captures: { am2: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sa}", room_id: "${r2}", starts_at: "2026-10-04T18:00:00Z", ends_at: "2026-10-04T19:00:00Z" }, as: ProgramCoordinator, captures: { am3: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sa}", room_id: "${r2}", starts_at: "2026-10-11T18:00:00Z", ends_at: "2026-10-11T19:00:00Z" }, as: ProgramCoordinator, captures: { am4: $.data.id } }
            - { call: "POST /instructor-contracts/${ce}/accept", payload: {}, as: Instructor, as_user_id: "${i1}" }
            - { call: "POST /instructor-contracts/${ca}/accept", payload: {}, as: Instructor, as_user_id: "${i2}" }
            - { call: "POST /class-sessions/${se}/publish", payload: {}, as: ProgramCoordinator, captures: { se_v: $.data.version } }
            - { call: "POST /class-sessions/${sa}/publish", payload: {}, as: ProgramCoordinator, captures: { sa_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "Household HH" }, as: HouseholdManager, captures: { hh: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hh}", full_name: "Pat One", birth_date: "2015-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hh}", captures: { p1: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hh}", full_name: "Pat Two", birth_date: "2016-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hh}", captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /registrations", payload: { session_id: "${se}", participant_id: "${p1}", expected_class_session_version: "${se_v}" }, as: HouseholdManager, as_user_id: "${hh}", captures: { re1: $.data.id } }
            - { call: "GET /class-sessions/${se}", as: ProgramCoordinator, captures: { se_v2: $.data.version } }
            - { call: "POST /registrations", payload: { session_id: "${se}", participant_id: "${p2}", expected_class_session_version: "${se_v2}" }, as: HouseholdManager, as_user_id: "${hh}", captures: { re2: $.data.id } }
            - { call: "POST /registrations", payload: { session_id: "${sa}", participant_id: "${p1}", expected_class_session_version: "${sa_v}" }, as: HouseholdManager, as_user_id: "${hh}", captures: { ra1: $.data.id } }
            - { call: "GET /class-sessions/${sa}", as: ProgramCoordinator, captures: { sa_v2: $.data.version } }
            - { call: "POST /registrations", payload: { session_id: "${sa}", participant_id: "${p2}", expected_class_session_version: "${sa_v2}" }, as: HouseholdManager, as_user_id: "${hh}", captures: { ra2: $.data.id } }
            - { call: "POST /registrations/${re1}/payment", payload: { amount_cents: 10000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${hh}" }
            - { call: "POST /registrations/${re2}/payment", payload: { amount_cents: 10000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${hh}" }
            - { call: "POST /registrations/${ra1}/payment", payload: { amount_cents: 10000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${hh}" }
            - { call: "POST /registrations/${ra2}/payment", payload: { amount_cents: 10000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${hh}" }
            - { call: "POST /safety-forms", payload: { participant_id: "${p1}", season_id: "${sn}", emergency_contact_name: "Guardian One", emergency_contact_phone: "555-1", signer_name: "Guardian One" }, as: HouseholdManager, as_user_id: "${hh}", captures: { f1: $.data.id } }
            - { call: "POST /safety-forms", payload: { participant_id: "${p2}", season_id: "${sn}", emergency_contact_name: "Guardian One", emergency_contact_phone: "555-1", signer_name: "Guardian One" }, as: HouseholdManager, as_user_id: "${hh}", captures: { f2: $.data.id } }
            - { call: "POST /safety-forms/${f1}/verify", payload: {}, as: FrontDeskStaff }
            - { call: "POST /safety-forms/${f2}/verify", payload: {}, as: FrontDeskStaff }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /seasons/${sn}/sweeps", payload: {}, as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-12T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /attendance-records", payload: { meeting_id: "${am1}", registration_id: "${ra1}", status: PRESENT }, as: Instructor, as_user_id: "${i2}" }
            - { call: "POST /attendance-records", payload: { meeting_id: "${am2}", registration_id: "${ra1}", status: PRESENT }, as: Instructor, as_user_id: "${i2}" }
            - { call: "POST /attendance-records", payload: { meeting_id: "${am3}", registration_id: "${ra1}", status: PRESENT }, as: Instructor, as_user_id: "${i2}" }
            - { call: "POST /attendance-records", payload: { meeting_id: "${am4}", registration_id: "${ra1}", status: PRESENT }, as: Instructor, as_user_id: "${i2}" }
            - { call: "POST /attendance-records", payload: { meeting_id: "${am1}", registration_id: "${ra2}", status: PRESENT }, as: Instructor, as_user_id: "${i2}" }
          trigger:
            - { call: "POST /class-sessions/${se}/complete", payload: {}, as: ProgramCoordinator }
            - { call: "POST /class-sessions/${sa}/complete", payload: {}, as: ProgramCoordinator }
            - { call: "GET /instructor-contracts/${ce}", as: ProgramCoordinator, captures: { ce_amt: $.data.settlement_amount_cents, ce_head: $.data.settlement_headcount } }
            - { call: "GET /instructor-contracts/${ca}", as: ProgramCoordinator, captures: { ca_amt: $.data.settlement_amount_cents, ca_head: $.data.settlement_headcount } }
          assert:
            - "InstructorContract.${ce}.status == SETTLED"
            - "InstructorContract.${ce}.settlement_headcount == 2"
            - "InstructorContract.${ce}.settlement_amount_cents == 10000  # 2 counted x round_half_up(10000*5000/10000)=5000"
            - "InstructorContract.${ce}.payout_cents == 10000"
            - "InstructorContract.${ca}.status == SETTLED"
            - "InstructorContract.${ca}.settlement_headcount == 1  # P1 4/4=100% qualifies; P2 1/4=25% < 50 excluded"
            - "InstructorContract.${ca}.settlement_amount_cents == 5000"
            - "InstructorContract.${ce}.settlement_amount_cents != InstructorContract.${ca}.settlement_amount_cents"

      - name: refund_voluntary_vs_admin_cancellation
        grounds:
          - calculations.registration_refund
          - state_machines.Registration.ENROLLED_to_DROPPED
          - state_machines.ClassSession.PUBLISHED_to_CANCELLED
        distinguishing_aspect: |
          Two registrations with identical net_paid (10000) on the same session refund differently:
          a VOLUNTARY drop after exactly one of four meetings is held refunds 50% (5000), while the
          subsequent ADMIN session cancellation refunds the survivor 100% (10000, held PENDING for finance approval at the review threshold).
          Entity domain: Registration/Household money — a different domain than instructor compensation.
        test_recipe:
          setup:
            - "Season PUBLISHED; session fee 10000/10000, capacity 5, min_enrollment 2, four meetings 2026-09-20..10-11"
            - "Households HA (PA) and HB (PB), each registered and PAID 10000"
            - "Clock at 2026-09-20T18:30:00Z: exactly one meeting held (starts_at <= now)"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Cooking", category: "Arts", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Kitchen", capacity: 50 }, as: ProgramCoordinator, captures: { rm: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Chef Ina", email: "ina@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "Cooking 101", capacity: 5, min_enrollment: 2, fee_resident_cents: 10000, fee_nonresident_cents: 10000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { ss: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${ss}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-09-27T18:00:00Z", ends_at: "2026-09-27T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-10-04T18:00:00Z", ends_at: "2026-10-04T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-10-11T18:00:00Z", ends_at: "2026-10-11T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /class-sessions/${ss}/publish", payload: {}, as: ProgramCoordinator, captures: { ss_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "HA" }, as: HouseholdManager, captures: { ha: $.data.id } }
            - { call: "POST /households", payload: { account_name: "HB" }, as: HouseholdManager, captures: { hb: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${ha}", full_name: "Part A", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${ha}", captures: { pa: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hb}", full_name: "Part B", birth_date: "1991-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hb}", captures: { pb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pa}", expected_class_session_version: "${ss_v}" }, as: HouseholdManager, as_user_id: "${ha}", captures: { ra: $.data.id } }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { ss_v2: $.data.version } }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pb}", expected_class_session_version: "${ss_v2}" }, as: HouseholdManager, as_user_id: "${hb}", captures: { rb: $.data.id } }
            - { call: "POST /registrations/${ra}/payment", payload: { amount_cents: 10000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${ha}" }
            - { call: "POST /registrations/${rb}/payment", payload: { amount_cents: 10000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${hb}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T18:30:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /registrations/${ra}/drop", payload: {}, as: HouseholdManager, as_user_id: "${ha}" }
            - { call: "POST /class-sessions/${ss}/cancel", payload: {}, as: ProgramCoordinator }
            - { call: "GET /payments", payload: {}, as: FinanceOfficer }
            - { call: "GET /registrations/${ra}", as: FinanceOfficer, captures: { ra_ref: $.data.refund_total_cents } }
            - { call: "GET /registrations/${rb}", as: FinanceOfficer, captures: { rb_ref: $.data.refund_total_cents, rb_pay: $.data.payment_status } }
            - { call: "GET /households/${ha}", as: FinanceOfficer, captures: { ha_cr: $.data.account_credit_cents } }
            - { call: "GET /households/${hb}", as: FinanceOfficer, captures: { hb_cr: $.data.account_credit_cents } }
          assert:
            - "Registration.${ra}.refund_total_cents == 5000  # VOLUNTARY, meetings_held=1 <= floor(4/2)=2 -> 50% of 10000"
            - "Registration.${ra}.payment_status == REFUNDED   # 5000 < 10000 threshold -> auto-approved"
            - "Household.${ha}.account_credit_cents == 5000"
            - "Registration.${rb}.refund_total_cents == 10000  # ADMIN_CANCELLATION -> 100%"
            - "Registration.${rb}.payment_status == REFUND_PENDING  # 10000 >= 10000 threshold -> PENDING until finance approval"
            - "Household.${hb}.account_credit_cents == 0       # not yet credited (refund pending)"
          # NOTE: a follow-on approve-refund completes the chain; see corner instance refund_pending_approval_credits_household.

  - rule_id: combinatorial_formula
    instances:
      - name: fee_calculation_multi_input_branching
        grounds:
          - calculations.registration_fee_calculation
          - entities.Registration.fields.fee_charged_cents
          - entities.Registration.fields.residency_at_registration
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with conditional branches on entity state (residency, scholarship
          approval, family count). A NONRESIDENT household with an APPROVED 25% scholarship and the
          family discount active pays 10126 on a 15001-cent base (scholarship step first:
          round_half_up(15001*0.75)=11251; family step second: round_half_up(11251*0.9)=10126);
          the same household's first two registrations pay 11251 (no family discount below threshold)
          and a RESIDENT control registration pays the untouched 10000 resident base.
        test_recipe:
          setup:
            - "Season with family_discount_threshold 3, family_discount_pct 10, scholarship_budget_cents 100000, PUBLISHED; general window open (clock 2026-08-17)"
            - "Three sessions S1/S2/S3 (fees 10000 resident / 15001 nonresident, capacity 5, min_enrollment 1), each PUBLISHED with meeting + ACCEPTED contract"
            - "Household HN verified NONRESIDENT with APPROVED 25% scholarship (commitment 5000) and participants P1, P2, P3; household HR verified RESIDENT with participant PR"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z", family_discount_threshold: 3, family_discount_pct: 10, scholarship_budget_cents: 100000 }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Tennis", category: "Sports", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Court 1", capacity: 50 }, as: ProgramCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Court 2", capacity: 50 }, as: ProgramCoordinator, captures: { r2: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Coach One", email: "c1@x.com" }, as: ProgramCoordinator, captures: { i1: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Coach Two", email: "c2@x.com" }, as: ProgramCoordinator, captures: { i2: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${i1}", title: "S1", capacity: 5, min_enrollment: 1, fee_resident_cents: 10000, fee_nonresident_cents: 15001, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${i1}", title: "S2", capacity: 5, min_enrollment: 1, fee_resident_cents: 10000, fee_nonresident_cents: 15001, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${i2}", title: "S3", capacity: 5, min_enrollment: 1, fee_resident_cents: 10000, fee_nonresident_cents: 15001, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${s1}", instructor_id: "${i1}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${s2}", instructor_id: "${i1}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${s3}", instructor_id: "${i2}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { c3: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${s1}", room_id: "${r1}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${s2}", room_id: "${r1}", starts_at: "2026-09-20T19:30:00Z", ends_at: "2026-09-20T20:30:00Z" }, as: ProgramCoordinator }
            - { call: "POST /class-meetings", payload: { session_id: "${s3}", room_id: "${r2}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${c1}/accept", payload: {}, as: Instructor, as_user_id: "${i1}" }
