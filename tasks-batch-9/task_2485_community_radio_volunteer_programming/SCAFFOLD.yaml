  - method: GET
    path: "/schedule-grids/{gridId}"
    entity: ScheduleGrid
    purpose: "Read one grid with its recomputed total_assigned_minutes and public_affairs_minutes_pct."
    roles: [ProgramDirector, CommitteeMember, Volunteer, ComplianceOfficer, DevelopmentCoordinator]
    input: []
    output: ScheduleGrid
    status: 200
    errors: [ERR_GRID_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/schedule-grids"
    entity: ScheduleGrid
    purpose: "List grids, filterable by construction state and season."
    roles: [ProgramDirector, CommitteeMember, Volunteer, ComplianceOfficer, DevelopmentCoordinator]
    input: ["status?", "season_code?", "limit?", "offset?"]
