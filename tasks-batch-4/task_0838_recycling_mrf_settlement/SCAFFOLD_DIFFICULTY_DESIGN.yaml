              as: ScaleOperator
              captures: { prov: $.data.provisional_adjustment_cents }
          assert:
            - "InboundLoad.${load_id}.provisional_adjustment_cents == 6000"

      - name: ship_empty_shipment_zero_bales_boundary
        grounds:
          - validations[priority=9]
          - errors[ERR_SHIPMENT_EMPTY]
          - state_machines.MillShipment.BUILDING_to_SHIPPED
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint (ship): a BUILDING shipment with zero
          STAGED bales is rejected with ERR_SHIPMENT_EMPTY; the boundary is the transition from
          0 to >=1 assigned bale.
        test_recipe:
          setup:
            - "MillShipment BUILDING with no bales assigned."
          setup_api_calls:
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 0 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 0 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/ship"
              payload: {}
              as: CommodityTrader
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHIPMENT_EMPTY"
            - "http_status == 422"

