  - rule_id: transitive_cascade
    instances:
      - name: reference_recant_cascades_five_links_to_seat_release
        grounds:
          - state_machines.Reference.ACCEPTED_to_RECANTED
          - state_machines.ExperienceRecord.VERIFIED_to_RECANTED
          - state_machines.Application.EXAM_APPROVED_to_DEFICIENT
          - state_machines.ExamAuthorization.APPROVED_TO_SIT_to_CANCELLED
          - state_machines.ExamAppointment.SCHEDULED_to_CANCELLED_BY_BOARD
          - calculations.experience_credit_evaluation
          - calculations.test_center_seat_ledger
          - validations[priority=32]
        distinguishing_aspect: |
          Five distinct entity types change in one request and each link is gated by the previous link's
          numeric outcome: Reference -> ExperienceRecord -> Application -> ExamAuthorization ->
          ExamAppointment plus the TestCenter seat ledger. Link 3 fires ONLY because the recomputed
          verified_experience_months (0) falls below MIN_EXPERIENCE_MONTHS (48); had the applicant held a
          second accepted reference worth 48 months, links 3-5 would not fire at all.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Kai Oduya' (applicant) and Engineer 'Mira Solt' (direct supervisor, ACTIVE STANDARD licence issued 2026-01-15) exist."
            - "Kai's STANDARD_EXAM application has EABET_ACCREDITED education and exactly one ExperienceRecord: RESPONSIBLE_CHARGE, post-degree, 2019-01..2022-12 (48 raw months, multiplier 1.00)."
            - "That record's single Reference (DIRECT_SUPERVISOR) has been ACCEPTED, so credited_months is 48 and verified_experience_months is 48 — exactly the MIN_EXPERIENCE_MONTHS floor."
            - "The 27500-cent assessment is paid; credit determination has run; the application is EXAM_APPROVED with one APPROVED_TO_SIT ExamAuthorization."
            - "TestCenter 'Portland PPC' has seat_labels [S1, S2] and holds one SCHEDULED appointment on seat S1 for 2026-09-10T08:00Z..16:00Z, so seats_committed is 1 and seats_available is 1."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Kai Oduya", email: "kai.oduya@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_kai: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Mira Solt", email: "mira.solt@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_mira: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_mira}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_mira: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_kai}", pathway: "STANDARD_EXAM", exam_code: "PE_CIVIL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_kai}"
              captures: { app_kai: $.data.id }
            - call: "POST /applications/${app_kai}/education-evaluation"
              payload: { degree_level: "BS", accreditation_finding: "EABET_ACCREDITED" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_kai}/experience-records"
              payload: { employer_name: "Rosewater Civil", position_title: "Engineer in Responsible Charge", period_start_month: "2019-01", period_end_month: "2022-12", responsibility_level: "RESPONSIBLE_CHARGE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_kai}"
              captures: { er_kai: $.data.id }
            - call: "POST /experience-records/${er_kai}/references"
              payload: { referee_engineer_id: "${eng_mira}", relationship: "DIRECT_SUPERVISOR" }
              as: Applicant
              as_user_id: "${eng_kai}"
              captures: { ref_kai: $.data.id }
            - call: "POST /applications/${app_kai}/payments"
              payload: { amount_cents: 27500 }
              as: Applicant
              as_user_id: "${eng_kai}"
            - call: "POST /applications/${app_kai}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${eng_kai}"
            - call: "POST /applications/${app_kai}/start-review"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /references/${ref_kai}/submit"
              payload: { evaluation_score: 5, months_confirmed: 48, responsibility_confirmed: true }
              as: SupervisingEngineer
              as_user_id: "${eng_mira}"
            - call: "POST /references/${ref_kai}/evaluate"
              payload: { decision: "ACCEPT" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_kai}/credit-determination"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_kai}/approve-exam"
              payload: {}
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { auth_kai: $.data.id }
            - call: "POST /test-centers"
              payload: { name: "Portland PPC", state_code: "OR", seat_labels: ["S1", "S2"], status: "OPEN" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { tc_pdx: $.data.id }
            - call: "POST /exam-appointments"
              payload: { exam_authorization_id: "${auth_kai}", test_center_id: "${tc_pdx}", seat_label: "S1", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z" }
              as: Applicant
              as_user_id: "${eng_kai}"
              captures: { appt_kai: $.data.id }
          trigger:
            - call: "POST /references/${ref_kai}/recant"
              payload: { recant_reason: "Supervision was indirect for the 2021-2022 portion" }
              as: SupervisingEngineer
              as_user_id: "${eng_mira}"
          assert:
            - "Reference.${ref_kai}.status == RECANTED"
            - "Reference.${ref_kai}.recant_reason == \"Supervision was indirect for the 2021-2022 portion\""
            - "ExperienceRecord.${er_kai}.verification_status == RECANTED"
            - "ExperienceRecord.${er_kai}.credited_months == 0"
            - "Application.${app_kai}.verified_experience_months == 0"
            - "Application.${app_kai}.status == DEFICIENT"
            - "ExamAuthorization.${auth_kai}.status == CANCELLED"
            - "ExamAppointment.${appt_kai}.status == CANCELLED_BY_BOARD"
            - "TestCenter.${tc_pdx}.seats_committed == 0"
            - "TestCenter.${tc_pdx}.seats_available == 2"
            - "Application.${app_kai}.provisional_experience_months == 48"

      - name: consent_order_execution_cascades_four_links_to_plan_void
        grounds:
          - state_machines.ConsentOrder.PROPOSED_to_EXECUTED
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.FirmRegistration.ACTIVE_to_LAPSED_NO_RESPONSIBLE_CHARGE
          - state_machines.PlanSubmission.DRAFT_to_VOIDED
          - calculations.firm_responsible_charge_posture
          - calculations.civil_penalty_assessment
          - concurrency_rules[consent-order-create-stale-case]
          - entities.Engineer.fields.active_license_number
        distinguishing_aspect: |
          A four-level chain on a completely different entity spine from the recant cascade
          (ConsentOrder -> License -> FirmRegistration -> PlanSubmission) whose last link is CONDITIONAL on
          child state: only DRAFT plan sets are voided, while an already SEALED plan set of the same firm is
          left untouched — so the cascade is selective, not a blanket sweep of the subtree.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Vale Osei' holds an ACTIVE STANDARD licence issued 2026-01-15."
            - "FirmRegistration 'Valeside Engineers LLC' is ACTIVE with Vale's licence in responsible charge and registration_expires_at 2027-08-01T00:00:00Z."
            - "Two plan sets exist under that firm: 'Water Main Phase 1' (4 sheets) already SEALED with Vale's licence, and 'Water Main Phase 2' (3 sheets) still DRAFT."
            - "A NEGLIGENCE Case against Vale's licence reached PROBABLE_CAUSE with aggravating 1 / mitigating 0 / violation_count 1, so penalty_factor is 1.25 and assessed_penalty_cents is 247500."
            - "A PROPOSED ConsentOrder for a 12-month SUSPENSION carries penalty_cents 247500 fully paid."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Vale Osei", email: "vale.osei@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_vale: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_vale}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_vale: $.data.id }
            - call: "POST /firm-registrations"
              payload: { firm_name: "Valeside Engineers LLC", state_code: "OR", responsible_charge_license_id: "${lic_vale}" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { firm_vs: $.data.id }
            - call: "POST /plan-submissions"
              payload: { firm_registration_id: "${firm_vs}", project_name: "Water Main Phase 1", sheet_count: 4 }
              as: FirmAdmin
              as_user_id: "${firm_vs}"
              captures: { ps_p1: $.data.id }
            - call: "POST /plan-submissions/${ps_p1}/seal"
              payload: { sealing_license_id: "${lic_vale}", responsible_charge_attested: true }
              as: Licensee
              as_user_id: "${eng_vale}"
            - call: "POST /plan-submissions"
              payload: { firm_registration_id: "${firm_vs}", project_name: "Water Main Phase 2", sheet_count: 3 }
              as: FirmAdmin
              as_user_id: "${firm_vs}"
              captures: { ps_p2: $.data.id }
            - call: "POST /cases"
              payload: { allegation_type: "NEGLIGENCE", complainant_name: "Ashford Water District", received_on: "2026-08-01T00:00:00Z", respondent_license_id: "${lic_vale}" }
              as: BoardInvestigator
              as_user_id: "INV-1"
              captures: { case_vale: $.data.id }
            - call: "POST /cases/${case_vale}/open-investigation"
              payload: {}
              as: BoardInvestigator
              as_user_id: "INV-1"
            - call: "POST /cases/${case_vale}/finding"
              payload: { finding: "PROBABLE_CAUSE", aggravating_factor_count: 1, mitigating_factor_count: 0, violation_count: 1 }
              as: BoardInvestigator
              as_user_id: "INV-1"
              captures: { case_vale_ver: $.data.version }
            - call: "POST /consent-orders"
              payload: { case_id: "${case_vale}", sanction_type: "SUSPENSION", suspension_months: 12, penalty_paid_cents: 247500, expected_case_version: "${case_vale_ver}" }
              as: BoardInvestigator
              as_user_id: "INV-1"
              captures: { co_vale: $.data.id }
          trigger:
            - call: "POST /consent-orders/${co_vale}/execute"
              payload: { executed_on: "2026-08-01T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
          assert:
            - "ConsentOrder.${co_vale}.status == EXECUTED"
            - "ConsentOrder.${co_vale}.penalty_cents == 247500"
            - "ConsentOrder.${co_vale}.executed_by_user_id == \"LIC-1\""
            - "Case.${case_vale}.sanction_status == CONSENT_EXECUTED"
            - "Case.${case_vale}.investigation_status == PROBABLE_CAUSE"
            - "License.${lic_vale}.status == SUSPENDED"
            - "License.${lic_vale}.suspension_ends_at == \"2027-08-01T00:00:00.000Z\""
            - "License.${lic_vale}.discipline_flag == true"
            - "FirmRegistration.${firm_vs}.status == LAPSED_NO_RESPONSIBLE_CHARGE"
            - "PlanSubmission.${ps_p2}.status == VOIDED"
            - "PlanSubmission.${ps_p1}.status == SEALED"
            - "Engineer.${eng_vale}.active_license_number == null"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_invalid_outranks_fee_unpaid
        grounds:
          - validations[priority=9]
          - validations[priority=44]
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - errors.ERR_APPLICATION_STATE_INVALID
          - errors.ERR_FEE_UNPAID
        distinguishing_aspect: |
          Priority 9 (state, 409) versus priority 44 (business_fiscal, 402) on the SAME endpoint with BOTH
          conditions simultaneously false: the application is in the terminal WITHDRAWN state AND its
          assessment of 27500 cents is entirely unpaid. A checker that validates money before state — the
          intuitive order, since a fee gate feels cheaper than a transition lookup — returns 402 instead of
          409. The two errors also differ in HTTP class, so the status code alone discriminates.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Lior Banda' has a STANDARD_EXAM application whose education has been evaluated EABET_ACCREDITED and which carries exactly one ExperienceRecord, so fee_assessment_cents is 27500."
            - "No payment has been recorded, so fee_paid_cents is 0."
            - "The applicant has already withdrawn the application from DRAFT, so status is the terminal WITHDRAWN."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Lior Banda", email: "lior.banda@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_lior: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_lior}", pathway: "STANDARD_EXAM", exam_code: "PE_CIVIL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_lior}"
              captures: { app_lior: $.data.id }
            - call: "POST /applications/${app_lior}/education-evaluation"
              payload: { degree_level: "BS", accreditation_finding: "EABET_ACCREDITED" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_lior}/experience-records"
              payload: { employer_name: "Banda Structural", position_title: "Project Engineer", period_start_month: "2019-01", period_end_month: "2022-12", responsibility_level: "RESPONSIBLE_CHARGE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_lior}"
              captures: { er_lior: $.data.id }
            - call: "POST /applications/${app_lior}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${eng_lior}"
          trigger:
            - call: "POST /applications/${app_lior}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${eng_lior}"
          assert:
            - "trigger[0] http_status == 409"
            - "trigger[0] response.error_id == \"ERR_APPLICATION_STATE_INVALID\""
            - "trigger[0] http_status != 402 and response.error_id != \"ERR_FEE_UNPAID\""
            - "Application.${app_lior}.status == WITHDRAWN"
            - "Application.${app_lior}.fee_assessment_cents == 27500"
            - "Application.${app_lior}.fee_paid_cents == 0"

      - name: seal_license_not_active_outranks_not_responsible_charge
        grounds:
          - validations[priority=11]
          - validations[priority=14]
          - errors.ERR_SEAL_LICENSE_NOT_ACTIVE
          - errors.ERR_NOT_RESPONSIBLE_CHARGE
          - state_machines.License.ACTIVE_to_REVOKED
          - calculations.civil_penalty_assessment
        distinguishing_aspect: |
          A same-HTTP-status pair: priority 11 (business_safety, 422) versus priority 14
          (business_referential, 422) on POST /plan-submissions/{id}/seal. Because both return 422 only the
          error_id distinguishes them, so a naive implementation that resolves the cheap in-request FK
          comparison (sealing_license_id vs the firm's responsible_charge_license_id) before the licence
          status lookup is invisible to status-code-only assertions. The revoked licence also happens not to
          be the firm's responsible charge, so both conditions are genuinely violated.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Rune Alvarez' holds an ACTIVE licence and is the responsible charge of ACTIVE FirmRegistration 'Runeworks PE'."
            - "Engineer 'Zoe Ferrand' holds a separate licence that has been REVOKED by an EXECUTED REVOCATION consent order (NEGLIGENCE case, 0 aggravating / 0 mitigating / 1 violation, so penalty_factor 1.00 and assessed_penalty_cents 198000, paid in full)."
            - "Zoe is NOT the responsible charge of 'Runeworks PE'."
            - "A DRAFT PlanSubmission 'Annex Slab' (5 sheets) was filed under 'Runeworks PE' AFTER the revocation, so the firm-lapse void cascade never touched it."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Rune Alvarez", email: "rune.alvarez@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_rune: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_rune}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_rune: $.data.id }
            - call: "POST /firm-registrations"
              payload: { firm_name: "Runeworks PE", state_code: "OR", responsible_charge_license_id: "${lic_rune}" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { firm_rn: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Zoe Ferrand", email: "zoe.ferrand@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_zoe: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_zoe}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_zoe: $.data.id }
            - call: "POST /cases"
              payload: { allegation_type: "NEGLIGENCE", complainant_name: "Harbor County", received_on: "2026-08-01T00:00:00Z", respondent_license_id: "${lic_zoe}" }
              as: BoardInvestigator
              as_user_id: "INV-2"
              captures: { case_zoe: $.data.id }
            - call: "POST /cases/${case_zoe}/open-investigation"
              payload: {}
              as: BoardInvestigator
              as_user_id: "INV-2"
            - call: "POST /cases/${case_zoe}/finding"
              payload: { finding: "PROBABLE_CAUSE", aggravating_factor_count: 0, mitigating_factor_count: 0, violation_count: 1 }
              as: BoardInvestigator
              as_user_id: "INV-2"
              captures: { case_zoe_ver: $.data.version }
            - call: "POST /consent-orders"
              payload: { case_id: "${case_zoe}", sanction_type: "REVOCATION", penalty_paid_cents: 198000, expected_case_version: "${case_zoe_ver}" }
              as: BoardInvestigator
              as_user_id: "INV-2"
              captures: { co_zoe: $.data.id }
            - call: "POST /consent-orders/${co_zoe}/execute"
              payload: { executed_on: "2026-08-01T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
            - call: "POST /plan-submissions"
              payload: { firm_registration_id: "${firm_rn}", project_name: "Annex Slab", sheet_count: 5 }
              as: FirmAdmin
              as_user_id: "${firm_rn}"
              captures: { ps_annex: $.data.id }
          trigger:
            - call: "POST /plan-submissions/${ps_annex}/seal"
              payload: { sealing_license_id: "${lic_zoe}", responsible_charge_attested: true }
              as: Licensee
              as_user_id: "${eng_zoe}"
          assert:
            - "trigger[0] http_status == 422"
            - "trigger[0] response.error_id == \"ERR_SEAL_LICENSE_NOT_ACTIVE\""
            - "trigger[0] response.error_id != \"ERR_NOT_RESPONSIBLE_CHARGE\""
            - "License.${lic_zoe}.status == REVOKED"
            - "ConsentOrder.${co_zoe}.penalty_cents == 198000"
            - "PlanSubmission.${ps_annex}.status == DRAFT"
            - "PlanSubmission.${ps_annex}.sealing_license_id == null"
            - "FirmRegistration.${firm_rn}.status == ACTIVE"

      - name: seat_window_conflict_outranks_no_seat_available
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - errors.ERR_SEAT_WINDOW_CONFLICT
          - errors.ERR_NO_SEAT_AVAILABLE
          - calculations.exam_seat_interval_conflict
          - calculations.test_center_seat_ledger
        distinguishing_aspect: |
          Two rules that share BOTH the 409 status and the same endpoint, separated by a single priority
          step (20 vs 21) and by category (business_temporal vs business_constraint). The test center has a
          single seat, so exhausting capacity and colliding on the seat interval are inseparable in the
