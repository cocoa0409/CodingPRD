            - { call: "POST /festival/submitters", payload: { legal_name: "Ann Ash", email: "ann@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Ledger A", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "A Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}", captures: { filmA: $.data.id } }
