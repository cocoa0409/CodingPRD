# =============================================================================
# Scholarship Review — Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the 9 Difficulty Rules.
# All grounds[] entries refer to elements declared in SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: score_aggregation_trimmed_vs_full_mean
        grounds:
          - calculations.aggregate_application_score
          - entities.Score.fields.is_outlier
          - entities.Application.fields.aggregated_score_x100
          - state_machines.Application.UNDER_REVIEW_to_REVIEW_COMPLETE
        distinguishing_aspect: |
          Two valid aggregation algorithms on the Score/Application domain produce different aggregated_score_x100 for
          identical 3-score inputs: trimmed_mean (drops |z|*100 > outlier_z_threshold_x100 outliers, then averages the
          rest) vs full_mean (averages all 3). With raw_total_x100 = (8000, 8500, 2000) and
          outlier_z_threshold_x100 = 100, trimmed_mean = 8250 while full_mean = 6167 — different results on the same
          inputs. Entity domain: Score/Application.
        test_recipe:
          setup:
            - "SchoolAdmin creates Scholarship S1 with rubric_weights={core:100}, outlier_z_threshold_x100=100, application_window_start='2026-05-12T00:00:00Z', application_window_end='2026-05-15T00:00:00Z', announcement_window_end='2026-05-20T00:00:00Z'"
            - "SchoolAdmin creates QuotaAllocation for S1 covering Student's slice with initial_slots=1 (and matches total_quota)"
            - "SchoolAdmin creates 4 Reviewers R1..R4 with department_code='CS' (different from student's department); set family_relation_student_ids=[] on all"
            - "POST /_clock/advance to=2026-05-12T01:00:00Z"
            - "Student creates Application A1 against S1 and submits it (eligibility passes)"
            - "POST /_clock/advance to=2026-05-15T00:00:00Z (window closes)"
            - "SchoolAdmin transitions S1 OPEN→REVIEWING"
            - "DeptOfficer passes preliminary review on A1"
            - "SchoolAdmin assigns reviewer_ids=[R1,R2,R3] to A1"
          trigger:
            - "Reviewer R1 POST score with core=80"
            - "Reviewer R2 POST score with core=85"
            - "Reviewer R3 POST score with core=20"
          assert:
            - "Application.status == 'REVIEW_COMPLETE'"
            - "Application.aggregated_score_x100 == 8250"
            - "Exactly one of the 3 Score rows has is_outlier==true (the one with criterion_scores.core==20)"
            - "Score(R1).is_outlier == false; Score(R2).is_outlier == false; Score(R3).is_outlier == true"

      - name: tax_withholding_per_component_vs_sum_then_round
        grounds:
          - calculations.tax_withholding
          - entities.DisbursementRecord.fields.tax_withheld_cents
          - entities.DisbursementRecord.fields.net_cents
          - state_machines.DisbursementPlan.FINANCE_APPROVED_to_EXECUTED
        distinguishing_aspect: |
          Two valid orderings on the DisbursementRecord domain produce a 1-cent divergence at boundary inputs:
          pinned 'round_per_component_then_sum' yields 1509 cents while the forbidden 'sum_then_round' yields 1508
          cents for gross=500250. Entity domain: DisbursementRecord — distinct from
          Application/Score covered by the trimmed_mean variant above.
        test_recipe:
          setup:
            - "SchoolAdmin creates Scholarship S2 with per_award_amount_cents=500250, total_quota=1, rubric_weights={core:100}, application_window 2026-05-12T00→2026-05-15T00, announcement 2026-05-20T00"
            - "QuotaAllocation initial_slots=1, sum matches"
            - "POST /_clock/advance to=2026-05-12T01:00:00Z"
            - "Student applies, submits; assignment + 3 scores (all 80, no outliers); Application AWARDED after rank_and_award"
            - "Advance clock to 2026-05-20T00; SchoolAdmin ANNOUNCED→FINALIZED"
            - "FinanceOfficer creates DisbursementPlan P, DeptOfficer approves, FinanceOfficer approves"
          trigger:
            - "FinanceOfficer POST /execute on P"
          assert:
            - "DisbursementRecord.tax_withheld_cents == 1509"
            - "DisbursementRecord.net_cents == 498741"
            - "DisbursementRecord.payment_channel matches DisbursementPlan.payment_channel (net 498741 < 1000000 routing threshold)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_tax_with_three_inputs_mode_a
        grounds:
          - calculations.tax_withholding
          - entities.DisbursementPlan.fields.total_gross_cents
          - state_machines.DisbursementPlan.FINANCE_APPROVED_to_EXECUTED
        distinguishing_aspect: |
          Mode (a): tax_withholding has ≥3 inputs (gross_cents, tier boundaries array, tier rates array) and a
          non-linear waterfall with nested min(gross_cents, hi) selection and conditional `if gross_cents <= lo:
          break`. The rate that applies depends on which interval gross_cents falls into — tiered-rate selection per
          §0.5 mode (a).
        test_recipe:
          setup:
            - "Create Scholarship S3 with per_award_amount_cents=5_000_000, total_quota=1, rubric_weights={core:100}, valid windows"
            - "Quota slice initial_slots=1"
            - "Student applies and is awarded (single applicant, single slot)"
            - "FINALIZED reached; DisbursementPlan created, dept-approved, finance-approved"
          trigger:
            - "FinanceOfficer POST /execute on the plan"
          assert:
            - "DisbursementRecord.gross_cents == 5000000"
            - "DisbursementRecord.tax_withheld_cents == 360000  # base 0 + 45000 + 300000 + 0 + surcharge 15000"
            - "DisbursementRecord.net_cents == 4640000"
            - "DisbursementRecord.payment_channel == 'BANK' because net 4640000 >= 1000000"

      - name: rounding_order_pinned_in_tax_withholding_mode_b
        grounds:
          - calculations.tax_withholding
          - calculations.tax_withholding
          - entities.DisbursementRecord.fields.tax_withheld_cents
        distinguishing_aspect: |
          Mode (b): tax_withholding's pinned 'round_per_component_then_sum' order genuinely differs from
          'sum_then_round' at boundary inputs (gross=500250 → 1509 vs 1508 cents). The scaffold pins the order
          explicitly. The mode is mode (b) — nested rounding where the order matters — distinct from the mode (a)
          tiered-rate instance above.
        test_recipe:
          setup:
            - "Reuse setup from tax_withholding_per_component_vs_sum_then_round (Scholarship S2, gross=500250)"
          trigger:
            - "FinanceOfficer POST /execute on the plan"
          assert:
            - "DisbursementRecord.tax_withheld_cents == 1509  # base (8 from 250 cents @ 3%) + surcharge (1501 from 500250*0.003 round_half_up)"
            - "DisbursementRecord.tax_withheld_cents != 1508  # the sum_then_round alternative would yield 1508 — forbidden"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_correction_cycle_revert
        grounds:
          - state_machines.Application.SUBMITTED_to_DEPT_PRELIM_REJECTED
          - state_machines.Application.DEPT_PRELIM_REJECTED_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_DRAFT
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The Application state machine contains TWO genuine cycles: (1) SUBMITTED→DRAFT→SUBMITTED via /modify
          (student edits), and (2) SUBMITTED→DEPT_PRELIM_REJECTED→SUBMITTED via /correct (rejection-and-correction).
          A→B→A revert loops on the Application entity — non-linear by §0.5 definition (cyclic shape).
        test_recipe:
          setup:
            - "Scholarship S4 with required_materials=[TRANSCRIPT, AWARD_CERT] and active OPEN window; quota allocated"
            - "Student applies (DRAFT), submits with both materials (SUBMITTED)"
            - "Advance clock past application_window_end; Scholarship→REVIEWING"
            - "DeptOfficer dept-reviews with decision=REJECT, comment='AWARD_CERT looks suspicious' (SUBMITTED→DEPT_PRELIM_REJECTED)"
          trigger:
            - "Student POST /correct with replaced_materials=[AWARD_CERT]"
            - "DeptOfficer POST /dept-review with decision=PASS, comment='Re-verified'"
          assert:
            - "After correct: Application.status == 'SUBMITTED' and dept_review_comment is null"
            - "After PASS: Application.status == 'DEPT_PRELIM_PASSED' and dept_review_comment == 'Re-verified'"
            - "Path traversed: SUBMITTED → DEPT_PRELIM_REJECTED → SUBMITTED → DEPT_PRELIM_PASSED — a non-linear A→B→A→C cycle on Application"

      - name: disbursement_plan_revert_cycle
        grounds:
          - state_machines.DisbursementPlan.DRAFT_to_DEPT_APPROVED
          - state_machines.DisbursementPlan.DEPT_APPROVED_to_DRAFT
        distinguishing_aspect: |
          The DisbursementPlan state machine contains a cycle DRAFT→DEPT_APPROVED→DRAFT via /revert (only by the
          original dept_approver_id). A→B→A revert loop on a different entity (DisbursementPlan) — satisfies the
          'different entities' clause from the Application cycle instance.
        test_recipe:
          setup:
            - "Scholarship S5 reaches FINALIZED state with 1 AWARDED Application"
            - "FinanceOfficer creates DisbursementPlan P (DRAFT)"
            - "DeptOfficer (acting_id=D1) approves at level=DEPT → DEPT_APPROVED"
          trigger:
            - "DeptOfficer (acting_id=D1) POST /revert on P"
          assert:
            - "DisbursementPlan.status == 'DRAFT'"
            - "DisbursementPlan.dept_approver_id is null"
            - "DisbursementPlan.total_gross_cents unchanged from create time (invariant)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: objection_upheld_revoke_and_promote_chain
        grounds:
          - state_machines.Objection.PENDING_to_UPHELD
          - state_machines.Application.AWARDED_to_REVOKED
          - state_machines.Application.REVIEW_COMPLETE_to_AWARDED
          - entities.QuotaAllocation.fields.filled_slots
        distinguishing_aspect: |
          Depth-3 transitive cascade: Objection.UPHELD (trigger) → Application X transitions AWARDED→REVOKED →
          which decrements QuotaAllocation.filled_slots AND promotes the highest-ranked NOT_AWARDED Application Y in
          the same slice to AWARDED (a SECOND state transition caused by the FIRST cascade, not by the original
          ruling) → that promotion increments QuotaAllocation.filled_slots back. Each link is caused by the previous
          link, not the original trigger.
        test_recipe:
          setup:
            - "Scholarship S6 reaches ANNOUNCED state with quota slice having current_slots=1, two REVIEW_COMPLETE applications: A (winner, score 9000) and B (runner-up, score 7000). A is AWARDED, B is NOT_AWARDED."
            - "Student submits Objection O on A with reason_code=MATERIAL_FALSE"
          trigger:
            - "SchoolAdmin POST /objections/O/rule with decision=UPHOLD, ruling_comment='Transcript forged'"
          assert:
            - "Objection.status == 'UPHELD'"
            - "Application(A).status == 'REVOKED' and Application(A).revocation_reason == 'OBJECTION_UPHELD'"
            - "Application(B).status == 'AWARDED' (cascade-promoted)"
            - "QuotaAllocation.filled_slots == 1 (decremented by A revoke, incremented by B promote — net 0 change from pre-ruling)"
            - "An ExternalSyncEvent(kind=IM_NOTIFY_OBJECTION_RULING) row exists"

      - name: scholarship_disbursed_cascade_chain
        grounds:
          - state_machines.Scholarship.FINALIZED_to_DISBURSED
          - state_machines.Application.AWARDED_to_DISBURSED
          - state_machines.DisbursementPlan.EXECUTED_to_ARCHIVED
        distinguishing_aspect: |
          Depth-3 cascade originating from a DIFFERENT trigger than the objection chain: Scholarship
          FINALIZED→DISBURSED (trigger) → each AWARDED Application transitions AWARDED→DISBURSED (caused by parent
          transition) → which itself causes the DisbursementPlan EXECUTED→ARCHIVED transition (because the system
          recognizes 'all AWARDED applications now disbursed'). Three serial hops, each link caused by the previous,
          originating from a Scholarship trigger.
        test_recipe:
          setup:
            - "Scholarship S7 FINALIZED with 1 AWARDED Application; DisbursementPlan executed (EXECUTED)"
          trigger:
            - "FinanceOfficer POST /scholarships/S7/state to_status=DISBURSED"
          assert:
            - "Scholarship.status == 'DISBURSED'"
            - "Application.status == 'DISBURSED' for every previously AWARDED application"
            - "DisbursementPlan.status == 'ARCHIVED'"
            - "An ExternalSyncEvent(kind=FINANCE_DISBURSED) exists for the Application"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_sod_violation
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SOD_VIOLATION
        distinguishing_aspect: |
          When a single request triggers BOTH an invalid-state check AND a segregation-of-duties violation, the
          state error wins (priority 6 < 8). Category pair: state (ERR_INVALID_STATE) vs business_safety
          (ERR_SOD_VIOLATION). Test: the plan is already in EXECUTED state (so approve-at-FINANCE is invalid-state)
          AND the requester is the SAME user as the existing dept_approver_id (so the SOD rule would also reject).
          The state check at priority 6 fires before SOD at priority 8.
        test_recipe:
          setup:
            - "Scholarship S8 reaches FINALIZED with 1 AWARDED Application; DisbursementPlan P walked through DRAFT→DEPT_APPROVED (by user U1) →FINANCE_APPROVED (by user U2) →EXECUTED (by U2)"
            - "DisbursementPlan.dept_approver_id == U1; DisbursementPlan.finance_approver_id == U2; DisbursementPlan.status == 'EXECUTED'"
          trigger:
            - "U1 (FinanceOfficer role) POST /disbursement-plans/P/approve with level=FINANCE — would violate SOD because U1 is already dept_approver_id, AND violates state because P is in EXECUTED (not DEPT_APPROVED)"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE' (state check at priority 6 wins over SOD check at priority 8)"

      - name: state_beats_dept_scope_mismatch
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
          - errors.ERR_DEPT_SCOPE_MISMATCH
        distinguishing_aspect: |
          When a DeptOfficer from a DIFFERENT department tries to dept-review an Application that is ALSO in the
          wrong state (e.g., already DEPT_PRELIM_PASSED), the state error wins (priority 6 < 10). Category pair:
          state (ERR_INVALID_STATE) vs business_referential (ERR_DEPT_SCOPE_MISMATCH) — different category pair
          from the SOD instance above.
        test_recipe:
          setup:
            - "Scholarship S9 in REVIEWING state with Application A1 in DEPT_PRELIM_PASSED state (already passed by its department's officer)"
            - "DeptOfficer D-OTHER from a different department_code than A1.student_department_code"
          trigger:
            - "D-OTHER POST /applications/A1/dept-review with decision=PASS, comment='retry'"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE' (because Application is no longer in SUBMITTED state — state check at priority 6 fires before scope check at priority 10)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: gpa_threshold_inclusive_boundary_on_submit
        grounds:
          - calculations.eligibility_check
          - entities.Scholarship.fields.gpa_threshold_x100
          - entities.Application.fields.student_gpa_x100
          - errors.ERR_ELIGIBILITY_FAIL
        distinguishing_aspect: |
          The GPA threshold is INCLUSIVE: student_gpa_x100 >= Scholarship.gpa_threshold_x100. A student with GPA
          exactly equal to the threshold MUST pass (boundary precision >= vs >). Reachable through POST
          /applications/{id}/submit. Metric: GPA — numeric threshold crossing.
        test_recipe:
          setup:
            - "Scholarship S10 with category=MERIT (so income check is skipped), gpa_threshold_x100=350, eligible_majors=[], eligible_grades=[], required_materials=[TRANSCRIPT], OPEN window"
            - "Student creates Application with student_gpa_x100=350 (EXACTLY at boundary), uploaded_materials=[TRANSCRIPT]"
          trigger:
            - "Student POST /applications/{id}/submit"
          assert:
            - "Response status == 200"
            - "Application.status == 'SUBMITTED' (boundary inclusive: 350 >= 350 passes)"

      - name: empty_eligible_majors_means_all_majors_on_submit
        grounds:
          - calculations.eligibility_check
          - entities.Scholarship.fields.eligible_majors
        distinguishing_aspect: |
          The empty-array semantics: when Scholarship.eligible_majors == [], EVERY major qualifies (empty-set
          fallback). Different metric (empty-collection edge, not numeric threshold). Reachable through endpoint
          POST /applications/{id}/submit. Test endpoint is shared with the GPA boundary test, but the predicate
          being exercised (set-membership-on-empty) is structurally distinct from the GPA numeric threshold.
        test_recipe:
          setup:
            - "Scholarship S11 with category=MERIT, eligible_majors=[] (empty array), eligible_grades=[], gpa_threshold_x100=0, required_materials=[TRANSCRIPT], OPEN window"
            - "Student with student_major='OBSCURE-XYZ' creates an Application with uploaded_materials=[TRANSCRIPT]"
          trigger:
            - "Student POST /applications/{id}/submit"
          assert:
            - "Response status == 200"
            - "Application.status == 'SUBMITTED' (empty eligible_majors permits ALL majors — empty-set fallback)"

      - name: outlier_z_strict_inequality_on_scores
        grounds:
          - calculations.aggregate_application_score
          - entities.Score.fields.is_outlier
          - entities.Scholarship.fields.outlier_z_threshold_x100
        distinguishing_aspect: |
          The outlier predicate uses STRICT inequality: |raw - mean| * 100 > outlier_z_threshold_x100 * stddev. A
          score whose deviation lands EXACTLY at the threshold is NOT trimmed. Metric: z-score boundary
          (strict-greater >). Endpoint: POST /applications/{id}/scores.
        test_recipe:
          setup:
            - "Scholarship S12 with outlier_z_threshold_x100=200, rubric_weights={core:100}"
            - "Application reaches UNDER_REVIEW with 3 reviewers"
            - "Set up raw_total_x100 values that are exactly symmetric — e.g., (5000, 5000, 5000): mean=5000, stddev=0, no scores are outliers (the formula guards stddev>0)"
          trigger:
            - "All 3 Reviewers post identical core=50 scores (raw_total_x100=5000 each)"
          assert:
            - "Application.status == 'REVIEW_COMPLETE'"
            - "Application.aggregated_score_x100 == 5000"
            - "All 3 Score rows have is_outlier == false (since stddev==0, the predicate stddev>0 short-circuits — boundary at stddev==0 means NO trimming)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_submit_requires_scholarship_open
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Scholarship.DRAFT_to_OPEN
          - errors.ERR_WINDOW_NOT_OPEN
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Application's DRAFT→SUBMITTED transition is gated by Scholarship.status==OPEN. Entity pair: (Application,
          Scholarship). If the Scholarship is still in DRAFT, the submit is rejected.
        test_recipe:
          setup:
            - "Scholarship S13 left in DRAFT (admin has not yet opened it)"
            - "Student creates Application A (DRAFT) — this is allowed even on a DRAFT scholarship? No: enforce that POST /applications is allowed only while Scholarship.status IN {OPEN}. Variant: skip the create, instead create the scholarship and admin opens it; then admin returns it to DRAFT? Not allowed in §1.2. Use the simpler setup: admin opens, student creates DRAFT app, admin advances clock past window_end and admin transitions Scholarship to REVIEWING. Now student tries to submit the still-DRAFT application."
            - "Final setup: Scholarship.status=REVIEWING (already past OPEN); Application A in DRAFT belonging to the student"
          trigger:
            - "Student POST /applications/A/submit"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE' (because Scholarship.status != OPEN — cross-entity state dependency: Application can only submit when its parent Scholarship is OPEN)"

      - name: application_disbursed_requires_disbursement_plan_executed
        grounds:
          - state_machines.Application.AWARDED_to_DISBURSED
          - state_machines.DisbursementPlan.FINANCE_APPROVED_to_EXECUTED
          - state_machines.Scholarship.FINALIZED_to_DISBURSED
          - errors.ERR_DISBURSEMENT_NOT_EXECUTED
        distinguishing_aspect: |
          Scholarship FINALIZED→DISBURSED (which cascades AWARDED→DISBURSED on every awarded Application) requires
          a DisbursementPlan in EXECUTED state. Entity pair: (Application, DisbursementPlan) — different second
          element from the (Application, Scholarship) instance above, so a different entity pair as Rule 7
          requires.
        test_recipe:
          setup:
            - "Scholarship S14 in FINALIZED state with 1 AWARDED Application"
            - "DisbursementPlan exists but is still in DEPT_APPROVED (NOT executed)"
          trigger:
            - "FinanceOfficer POST /scholarships/S14/state to_status=DISBURSED"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_DISBURSEMENT_NOT_EXECUTED'"
            - "Application.status remains 'AWARDED' (no cascade because plan not executed)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: scholarship_pair_half_open_window_overlap_blocks_create
        grounds:
          - validations[priority=24]
          - errors.ERR_SCHOLARSHIP_WINDOW_OVERLAP
          - entities.Scholarship.fields.application_window_start
          - entities.Scholarship.fields.application_window_end
        distinguishing_aspect: |
          Two Scholarships of the SAME category cannot have application_windows that overlap under half-open
          interval semantics [start, end). Boundary touching (a.end == b.start) is NOT a collision because the
          intervals are half-open. Resource entity: Scholarship. Interval semantics: half-open intervals, boundary
          touching allowed.
        test_recipe:
          setup:
            - "SchoolAdmin POST /scholarships creating S-A with category=MERIT, application_window 2026-06-01T00→2026-06-10T00"
          trigger:
            - "SchoolAdmin POST /scholarships creating S-B with category=MERIT, application_window 2026-06-05T00→2026-06-15T00 (overlap from 06-05 to 06-10)"
            - "Then SchoolAdmin POST /scholarships creating S-C with category=MERIT, application_window 2026-06-10T00→2026-06-20T00 (touching exactly at S-A.end)"
          assert:
            - "Create S-B → status 409 with error_id == 'ERR_SCHOLARSHIP_WINDOW_OVERLAP' (intervals strictly overlap)"
            - "Create S-C → status 201 (touching at boundary is permitted under half-open semantics)"

      - name: cross_application_buffered_overlap_blocks_submit
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - validations[priority=12]
          - errors.ERR_DUPLICATE_APPLICATION_CROSS
        distinguishing_aspect: |
          A student's two applications across SAME-category Scholarships collide under DIFFERENT interval
          semantics: closed-closed intervals each extended by a +3-day BUFFER. Two scholarships collide iff
          [a.start, a.end + 3d] ∩ [b.start, b.end + 3d] is non-empty. Resource entity: Application — and the
          interval geometry (buffered closed-closed) differs from the Scholarship-pair rule's half-open semantics.
        test_recipe:
          setup:
            - "SchoolAdmin creates S-D (category=NEED, window 2026-07-01T00→2026-07-05T00) and S-E (category=NEED, window 2026-07-09T00→2026-07-15T00). Note: S-D.end + 3d = 07-08T00, which is BEFORE S-E.start (07-09T00). Half-open semantics: no collision at create time. But with buffered overlap on application_window_end: [07-01, 07-08] and [07-09, 07-18] are disjoint. So no scholarship-level rejection at create. CORRECTION: pick S-E (2026-07-07T00→2026-07-15T00). S-D.end+3d = 07-08, S-E.start=07-07, S-E.end+3d=07-18 → [07-01,07-08] ∩ [07-07,07-18] non-empty (overlap [07-07,07-08]). But for scholarship-pair create, the simpler half-open check on raw windows (07-01→07-05 and 07-07→07-15) is disjoint, so create succeeds."
            - "POST /_clock/advance to=2026-07-02T00"
            - "Student creates+submits application against S-D (succeeds)"
            - "POST /_clock/advance to=2026-07-07T01:00:00Z (S-E now OPEN)"
            - "Student creates application against S-E (DRAFT — allowed)"
          trigger:
            - "Student POST /applications/{id}/submit on the S-E application"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_DUPLICATE_APPLICATION_CROSS' (buffered-closed overlap exists between S-D and S-E windows for this student)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: award_count_invariant_under_revoke_and_promote
        grounds:
          - state_machines.Application.AWARDED_to_REVOKED
          - state_machines.Application.REVIEW_COMPLETE_to_AWARDED
          - entities.QuotaAllocation.fields.filled_slots
          - state_machines.Objection.PENDING_to_UPHELD
        distinguishing_aspect: |
          Named conserved quantity (quota slot count): Σ QuotaAllocation.filled_slots over all slices ==
          count(Applications in status=AWARDED for this scholarship). The forward action (REVOKE due to objection)
          paired with the compensating action (cascade-promote next-ranked NOT_AWARDED in the same slice) MUST
          leave Σ filled_slots unchanged. Conserved quantity type: integer slot count.
        test_recipe:
          setup:
            - "Scholarship S15 reaches ANNOUNCED with one quota slice (current_slots=1) holding 1 AWARDED Application A and 1 NOT_AWARDED Application B (runner-up). Pre-state: Σ filled_slots = 1."
            - "Student submits Objection on A"
          trigger:
            - "SchoolAdmin POST /objections/{id}/rule decision=UPHOLD"
          assert:
            - "Application(A).status == 'REVOKED'"
            - "Application(B).status == 'AWARDED'"
            - "QuotaAllocation.filled_slots == 1  (unchanged from before)"
            - "Σ QuotaAllocation.filled_slots over all slices == count(Application.status=='AWARDED') == 1 (invariant pinned)"

      - name: disbursement_gross_invariant_under_approve_and_revert
        grounds:
          - state_machines.DisbursementPlan.DRAFT_to_DEPT_APPROVED
          - state_machines.DisbursementPlan.DEPT_APPROVED_to_DRAFT
          - entities.DisbursementPlan.fields.total_gross_cents
          - entities.DisbursementPlan.fields.total_tax_cents
        distinguishing_aspect: |
          Named conserved quantity (monetary aggregate): DisbursementPlan.total_gross_cents and total_tax_cents are
          snapshotted at create time and MUST NOT change across the round-trip DRAFT→DEPT_APPROVED→DRAFT. The
          forward action (dept approve) and the compensating action (dept revert) leave the named monetary
          quantities unchanged. Conserved quantity type: integer cents — distinct from the integer-slot-count
          invariant above.
        test_recipe:
          setup:
            - "Scholarship S16 FINALIZED with 2 AWARDED Applications, each per_award_amount_cents=1_000_000"
            - "FinanceOfficer creates DisbursementPlan P → total_gross_cents=2000000, total_tax_cents computed"
            - "Capture P_initial = (total_gross_cents, total_tax_cents)"
          trigger:
            - "DeptOfficer POST /approve level=DEPT on P"
            - "DeptOfficer POST /revert on P (compensating)"
          assert:
            - "DisbursementPlan.status == 'DRAFT'"
            - "DisbursementPlan.dept_approver_id is null"
            - "DisbursementPlan.total_gross_cents == 2000000 (== P_initial.total_gross_cents)"
            - "DisbursementPlan.total_tax_cents == P_initial.total_tax_cents (unchanged)"
