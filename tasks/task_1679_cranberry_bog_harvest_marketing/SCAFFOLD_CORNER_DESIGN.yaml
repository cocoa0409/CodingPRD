scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: season_created_with_setup_initial_state
        claim_type: creation
        grounds: ["entities.Season", "state_machines.Season"]
        distinguishing_aspect: "A created Season starts in SETUP with version 1 and a server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id", s_status: "$.data.status", s_v: "$.data.version" }
          assert:
            - "response status 201"
            - "Season.status == SETUP"
            - "Season.version == 1"
            - "Season.id is a UUID without any type prefix"

      - name: member_created_pending_initial_state
        claim_type: initial_state
        grounds: ["entities.Member", "state_machines.Member"]
        distinguishing_aspect: "A registered Member starts PENDING and cannot act until activated."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id", m_status: "$.data.status" }
          assert:
            - "Member.status == PENDING"

      - name: bog_default_frost_threshold_applied
        claim_type: defaults
        grounds: ["entities.Bog.fields.frost_damage_threshold_c"]
        distinguishing_aspect: "Omitting frost_damage_threshold_c applies the declared default -2.0."
        test_recipe:
          setup: ["member M100 exists (PENDING is enough for bog creation by admin-free grower flow: use ACTIVE to be safe)"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id", b_thresh: "$.data.frost_damage_threshold_c", b_status: "$.data.status" }
          assert:
            - "Bog.frost_damage_threshold_c == -2.0 (default applied)"
            - "Bog.status == ACTIVE (initial state)"

      - name: estimate_create_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: ["entities.YieldEstimate", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required estimated_barrels on estimate creation fails with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["ACTIVE member with ACTIVE bog and a SETUP season"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b1}", season_id: "${s1}" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: delivery_net_barrels_computed_with_precision
        claim_type: computed_fields
        grounds: ["entities.Delivery.fields.net_barrels", "calculations.delivery_grade_assignment"]
        distinguishing_aspect: "net_barrels is server-computed at receive: round2(100.55 - 20.25) == 80.30; clients cannot set it."
        test_recipe:
          setup: ["ACTIVE member, ACTIVE bog, OPEN season, station capacity 5000, SCHEDULED delivery"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 150 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
          trigger:
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 100.55, tare_barrels: 20.25 }
              as: StationOperator
              as_user_id: "${st1}"
              captures: { d_net: "$.data.net_barrels", d_status: "$.data.status" }
          assert:
            - "Delivery.${d1}.net_barrels == 80.30"
            - "Delivery.${d1}.status == RECEIVED"

      - name: get_bog_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but non-existent bog UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /coop/bogs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CoopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: create_member_with_id_input_ignored
        claim_type: system_fields
        grounds: ["entities.Member"]
        distinguishing_aspect: "A client-supplied id on creation is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
          assert:
            - "response status 201"
            - "returned Member.id != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2 (server-minted)"

      - name: quota_rows_computed_at_season_open
        claim_type: computed_fields
        grounds: ["entities.MemberQuota", "calculations.quota_base_barrels"]
        distinguishing_aspect: "MemberQuota rows (base/baseline variants, delivered 0, posture WITHIN_QUOTA, quota_locked false) exist only after season open and are computed, not inputtable."
        excluded_because:
          difficulty_instance: dual_variant_calc / quota_approved_estimate_vs_acreage_baseline
          rationale: "That instance drives season open and asserts base_quota_barrels == 2300 and baseline_quota_barrels == 2000, which is the computed-at-open claim."

      - name: delivery_create_with_unknown_bog_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Delivery.fields.bog_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a delivery referencing a non-existent bog_id is rejected with ERR_NOT_FOUND (existence priority 3)."
        test_recipe:
          setup: ["ACTIVE member, OPEN season, station"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
          trigger:
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 100 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: member_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds: ["state_machines.Member"]
        distinguishing_aspect: "ACTIVE -> SUSPENDED -> ACTIVE loop works; each transition returns the new status and bumps version."
        test_recipe:
          setup: ["member created PENDING then activated"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "SUSPENDED" }
              as: CoopAdmin
              captures: { st1: "$.data.status" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
              captures: { st2: "$.data.status", v2: "$.data.version" }
          assert:
            - "status after suspend == SUSPENDED"
            - "status after reinstate == ACTIVE"
            - "Member.version == 4 after create+3 transitions"

      - name: member_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Member", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: transition to ACTIVE from WITHDRAWN fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE member with no pipeline deliveries"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "WITHDRAWN" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: estimate_flagged_cannot_be_approved_directly
        claim_type: invalid_transition
        grounds: ["state_machines.YieldEstimate", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FLAGGED -> APPROVED is not a defined transition; the officer must wait for the grower's revise (FLAGGED -> SUBMITTED) first."
        test_recipe:
          setup: ["ACTIVE member, ACTIVE bog, SETUP season, estimate SUBMITTED then FLAGGED by FieldOfficer"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b1}", season_id: "${s1}", estimated_barrels: 2300 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { e1: "$.data.id" }
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "FLAGGED" }
              as: FieldOfficer
          trigger:
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "YieldEstimate.${e1}.status remains FLAGGED"

      - name: estimate_revise_replaces_value_and_counts
        claim_type: valid_transition
        grounds: ["state_machines.YieldEstimate.FLAGGED_to_SUBMITTED", "entities.YieldEstimate.fields.revision_count"]
        distinguishing_aspect: "Owner revise from FLAGGED returns the estimate to SUBMITTED, replaces estimated_barrels with revised_estimated_barrels, and increments revision_count."
        test_recipe:
          setup: ["estimate FLAGGED as in the sibling corner"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b1}", season_id: "${s1}", estimated_barrels: 2300 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { e1: "$.data.id" }
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "FLAGGED" }
              as: FieldOfficer
          trigger:
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "SUBMITTED", revised_estimated_barrels: 1800 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { e_status: "$.data.status", e_barrels: "$.data.estimated_barrels", e_rev: "$.data.revision_count" }
          assert:
            - "YieldEstimate.status == SUBMITTED"
            - "YieldEstimate.estimated_barrels == 1800"
            - "YieldEstimate.revision_count == 1"

      - name: ticket_expiry_sweep_via_logical_clock
        claim_type: valid_transition
        grounds: ["state_machines.HarvestTicket.REQUESTED_to_EXPIRED", "endpoints[\"POST /coop/_clock/set_current_utc\"]"]
        distinguishing_aspect: "Setting the logical clock past a REQUESTED ticket's window_start auto-expires it; subsequent approval fails with ERR_INVALID_STATE. Clock default before any set call is 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["ACTIVE member, ACTIVE bog, season 2026 (window 2026-09-15..2026-11-15), ticket REQUESTED for [2026-10-01T00:00Z, 2026-10-05T00:00Z)"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/harvest-tickets"
              payload: { bog_id: "${b1}", season_id: "${s1}", method: "DRY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { t1: "$.data.id" }
          trigger:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: CoopAdmin
            - call: "GET /coop/harvest-tickets/${t1}"
              payload: {}
              as: FieldOfficer
              captures: { t_status: "$.data.status" }
            - call: "POST /coop/harvest-tickets/${t1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "HarvestTicket.${t1}.status == EXPIRED after the clock sweep"
            - "approval of the expired ticket fails with error_id == ERR_INVALID_STATE"

      - name: delivery_grade_before_receive_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Delivery", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Grading a SCHEDULED delivery skips RECEIVED and fails with ERR_INVALID_STATE; no grade fields are written."
        test_recipe:
          setup: ["ACTIVE member, ACTIVE bog, OPEN season, station 5000, SCHEDULED delivery"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 150 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
          trigger:
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 9.0, foreign_matter_pct: 1.0 }
              as: StationOperator
              as_user_id: "${st1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Delivery.${d1}.grade remains null and status remains SCHEDULED"

      - name: pool_settle_terminal_lockdown_and_season_settled
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Pool", "state_machines.Season.HARVEST_CLOSED_to_SETTLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An empty pool settles with 0/0 inputs (final_rate 0, no distributions); the season then auto-settles; reopening a SETTLED pool fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE member, season OPEN with quota created, MAIN pool OPEN, no deliveries"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "CLOSED" }
              as: PoolManager
            - call: "GET /coop/pools/${p1}"
              payload: {}
              as: PoolManager
              captures: { p1_v: "$.data.version" }
          trigger:
            - call: "POST /coop/pools/${p1}/settle"
              payload: { realized_revenue: 0, operating_costs: 0, expected_pool_version: "${p1_v}" }
              as: PoolManager
              captures: { p_status: "$.data.status", p_rate: "$.data.final_rate_per_weighted_barrel" }
            - call: "GET /coop/seasons/${s1}"
              payload: {}
              as: PoolManager
              captures: { s_status: "$.data.status" }
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "OPEN" }
              as: PoolManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Pool.${p1}.status == SETTLED and final_rate_per_weighted_barrel == 0"
            - "Season.${s1}.status == SETTLED (auto bubble-up)"
            - "reopen from SETTLED fails with error_id == ERR_INVALID_STATE"

      - name: distribution_pay_before_approve_invalid_and_fk_reverse_list
