              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-01T08:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: insufficient_funds_on_rolling_award
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INSUFFICIENT_FUNDS]"]
        distinguishing_aspect: "Rolling award from an OPEN program: default award equals estimated_cost_cents (600000) and exceeds available_cents (100000) -> ERR_INSUFFICIENT_FUNDS; state preconditions all pass so the fiscal error surfaces."
