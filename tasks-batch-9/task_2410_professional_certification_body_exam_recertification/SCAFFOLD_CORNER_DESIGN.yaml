# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth test index
# Task: 2410 Professional Certification Body Exam & Recertification
#
# Derived exclusively from this task's SCAFFOLD.yaml (§1.0-§1.7). Every `call:`
# resolves to a §1.5 endpoint with a §1.7 role, every error_id appears verbatim
# in §1.6, and every `${var}` is bound by a `captures:` block earlier in the
# same instance. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# are recorded as `excluded_because:` stubs naming the §1.8 instance.
#
# Sections: entities, state_machines, calculations, validations, endpoints,
#           rbac, cross_cutting_complexity_layers, consistency_model.
#
# The guide's Errors section carries no claim_type table (it is a coverage
# requirement, not a claim family), so no `section: errors` block is emitted;
# error triggerability is asserted inside the validations, endpoints and rbac
# instances, each of which pins the error_id it expects and at least one
# error_id it must NOT return.
# =============================================================================
scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: program_creation_returns_201_with_draft_status_and_echoed_inputs
        claim_type: creation
        grounds:
          - entities.CertificationProgram
          - endpoints.POST_/programs
          - response_envelope.success
          - calculations.blueprint_posture
        distinguishing_aspect: |
          The creation response must echo every input field and simultaneously populate the four
          common_fields plus the six computed fields; a DRAFT programme with no items must
          already report blueprint_posture DEFICIENT rather than null, which distinguishes a
          genuinely computed posture from one that is only recalculated on item events.
        test_recipe:
          setup:
            - "Empty database. The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /programs"
              payload: {"limit": 1, "offset": 0}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
          assert:
            - "the response is 201 with response_type \"object\" and meta.api_request_id present"
            - "CertificationProgram.${prog_id}.name == \"Certified Practitioner X\", credential_code == \"CPX\", jta_version == \"JTA-2026.1\" and form_length == 2"
            - "CertificationProgram.${prog_id}.accepted_education_credentials == [\"BACHELOR\", \"MASTER\"] and domain_specs has 2 entries with weight_pct 60 and 40"
            - "CertificationProgram.${prog_id}.status == DRAFT and version == 1 with created_at and updated_at both stamped 2026-08-01T00:00:00Z"
            - "CertificationProgram.${prog_id}.operational_item_count == 0, deficient_domain_codes == [\"D1\", \"D2\"] and blueprint_posture == DEFICIENT"
            - "CertificationProgram.${prog_id}.verified_application_counter == 0 and certificants_issued_count == 0"
      - name: program_creation_applies_every_optional_default_when_the_input_is_omitted
        claim_type: defaults
        grounds:
          - entities.CertificationProgram.fields
          - endpoints.POST_/programs
        distinguishing_aspect: |
          Twenty-one optional inputs each carry a declared default; omitting all of them must
          produce exactly those literals rather than nulls, so the psychometric, eligibility,
          fiscal and recertification knobs are all observable from a minimal creation body.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /programs"
              payload: {"limit": 1, "offset": 0}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
          assert:
            - "CertificationProgram.${prog_id}.psychometric_stat_basis == OPERATIONAL_ONLY, min_discrimination == 0.15, min_p_value == 0.20 and max_p_value == 0.95"
            - "CertificationProgram.${prog_id}.min_responses_for_stats == 30 and form_retirement_tolerance_pct == 10"
            - "CertificationProgram.${prog_id}.min_panelists == 5, panel_trim_count == 1 and cut_score_sem_multiplier == 0.5"
            - "CertificationProgram.${prog_id}.education_recency_years == 10, min_experience_months == 24, audit_every_nth == 3 and eligibility_valid_days == 365"
            - "CertificationProgram.${prog_id}.exam_fee_cents == 45000, max_attempts_per_cycle == 3 and retake_wait_days == 45"
            - "CertificationProgram.${prog_id}.cycle_length_months == 36, required_ceu_credits == 60, ceu_credit_accrual_basis == STRICT_CYCLE, ceu_carryover_max_credits == 10 and recert_grace_days == 90"
      - name: program_retrieval_by_id_returns_the_stored_row_unchanged_by_activation
        claim_type: retrieval
        grounds:
          - endpoints.GET_/programs/{id}
          - state_machines.CertificationProgram.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          GET /programs/{id} must return the persisted row rather than a re-derived one: after
          activation the same id reports status ACTIVE and version 2 while every input field and
          created_at are byte-identical to the creation response.
        test_recipe:
          setup:
            - "One programme CPX created from the minimal body above and then activated by pa-1."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ItemSpecialist
              as_user_id: "isp-author"
          assert:
            - "the response is 200 and CertificationProgram.${prog_id}.status == ACTIVE with version == 2"
            - "CertificationProgram.${prog_id}.credential_code == \"CPX\" and form_length == 2 (inputs survive the transition)"
            - "CertificationProgram.${prog_id}.created_at is unchanged while updated_at advanced with the activation"
            - "CertificationProgram.${prog_id}.blueprint_posture == DEFICIENT (activation does not require a complete blueprint)"
      - name: program_listing_pages_three_rows_with_limit_two_and_reports_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/programs
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint must return the four declared pagination fields with total_count
          counting the whole filtered set rather than the page: limit 2 / offset 0 yields 2 rows
          with has_more true, and limit 2 / offset 2 yields the last row with has_more false.
        test_recipe:
          setup:
            - "Three DRAFT programmes exist: CPX, CPY and CPZ, created in that order."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { px_id: "$.data.id" }
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner Y", "credential_code": "CPY", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { py_id: "$.data.id" }
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner Z", "credential_code": "CPZ", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pz_id: "$.data.id" }
          trigger:
            - call: "GET /programs"
              payload: {"limit": 2, "offset": 0}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "GET /programs"
              payload: {"limit": 2, "offset": 2}
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "trigger[0] returns 2 rows with total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "trigger[1] returns 1 row with total_count == 3, limit == 2, offset == 2 and has_more == false"
            - "the union of both pages is exactly {${px_id}, ${py_id}, ${pz_id}} with no duplicate row"
            - "response_type is \"array\" on both pages"
      - name: program_lookup_with_an_unknown_id_returns_program_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - validations[priority=3]
          - response_envelope.error
        distinguishing_aspect: |
          An id that no row owns must produce the entity-specific 404 error_id in the error
          envelope, not a generic 404 body and not an empty 200.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX exists, so the collection is non-empty and the 404 cannot be an artefact of an empty table."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 404 with response_type \"error\" and ${err} == ERR_PROGRAM_NOT_FOUND"
            - "the error envelope carries a non-empty message field alongside error_id"
            - "CertificationProgram.${prog_id} is untouched and still ACTIVE"
      - name: program_creation_without_credential_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/programs
        distinguishing_aspect: |
          credential_code has source input and no default, so omitting it must fail the
          priority-7 shape check with 400 ERR_INVALID_REQUEST and create no row — it must not
          fall through to the priority-10 uniqueness check.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /programs"
              payload: {"limit": 1, "offset": 0}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 400 with ${err} == ERR_INVALID_REQUEST"
            - "${err} is not ERR_CREDENTIAL_CODE_TAKEN — the shape check runs before uniqueness"
            - "GET /programs afterwards returns total_count == 0"
      - name: program_creation_with_a_non_integer_form_length_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.CertificationProgram.fields.form_length
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          form_length is an integer field; a string that merely looks like a number must be
          rejected rather than coerced, so no programme is created with form_length 2 by
          accident.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /programs"
              payload: {"limit": 1, "offset": 0}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": "two", "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 400 with ${err} == ERR_INVALID_REQUEST"
            - "no CertificationProgram row exists afterwards: GET /programs returns total_count == 0"
      - name: program_computed_counters_stay_zero_until_the_events_that_move_them
        claim_type: computed_fields
        grounds:
          - entities.CertificationProgram.computed_fields.operational_item_count
          - entities.CertificationProgram.computed_fields.verified_application_counter
          - entities.CertificationProgram.computed_fields.certificants_issued_count
          - calculations.blueprint_posture
        distinguishing_aspect: |
          The six computed fields are derived, never supplied: a DRAFT item in the programme
          leaves operational_item_count at 0 because only the OPERATIONAL boundary moves it, and
          the application and certificant counters remain 0 because no application has been
          verified and no score reported.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (form_length 2, domains D1 60% and D2 40%, min_operational_items 1 each) and one Item in status DRAFT in domain D1."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "RECALL", "stem": "Draft item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Psychometrician
              as_user_id: "psy-1"
          assert:
            - "CertificationProgram.${prog_id}.operational_item_count == 0 even though one Item row exists"
            - "CertificationProgram.${prog_id}.deficient_domain_codes == [\"D1\", \"D2\"] and blueprint_posture == DEFICIENT"
            - "CertificationProgram.${prog_id}.verified_application_counter == 0 and certificants_issued_count == 0"
            - "Item.${item_id}.status == DRAFT and Item.${item_id}.p_value == null"
      - name: item_creation_with_status_and_p_value_supplied_leaves_the_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Item.fields.status
          - entities.Item.fields.p_value
          - entities.Item.fields.author_user_id
          - endpoints.POST_/items
        distinguishing_aspect: |
          status, p_value and author_user_id are system- or computed-sourced and are not in the
          endpoint's declared input; a body that smuggles them must not steer the row — the item
          still starts DRAFT with null statistics and author_user_id taken from the acting
          X-User-ID.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "RECALL", "stem": "Smuggled item", "status": "OPERATIONAL", "p_value": 0.5, "author_user_id": "someone-else"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
          assert:
            - "Item.${item_id}.status == DRAFT (the OPERATIONAL input is ignored or rejected, never honoured)"
            - "Item.${item_id}.p_value == null and Item.${item_id}.discrimination_index == null"
            - "Item.${item_id}.author_user_id == \"isp-author\" — taken from the acting X-User-ID, not from the body"
            - "Item.${item_id}.approver_user_ids == [] and Item.${item_id}.retired_at == null"
            - "CertificationProgram.${prog_id}.operational_item_count == 0"
      - name: item_creation_against_an_unknown_program_id_returns_program_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors.ERR_PROGRAM_NOT_FOUND
          - entities.Item.fields.program_id
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Item.program_id is an FK in a flat topology, so a syntactically valid but unknown
          parent id must be caught as a 404 referential failure rather than a 400 shape failure
          or an orphan row.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX exists but is deliberately not the parent cited by the trigger."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 40, "min_operational_items": 1}], "form_length": 2, "accepted_education_credentials": ["BACHELOR", "MASTER"]}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /items"
              payload: {"program_id": "00000000-0000-0000-0000-000000000000", "domain_code": "D1", "cognitive_level": "RECALL", "stem": "Orphan item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 404 with ${err} == ERR_PROGRAM_NOT_FOUND"
            - "${err} is not ERR_INVALID_REQUEST and not ERR_ITEM_DOMAIN_MISMATCH"
            - "GET /programs/${prog_id}/items returns total_count == 0 — no orphan Item was written"
      - name: certificant_certificate_number_and_issued_on_survive_a_cycle_close
        claim_type: immutability
        grounds:
          - entities.Certificant.fields.certificate_number
          - entities.Certificant.fields.issued_on
          - state_machines.RecertificationCycle.SATISFIED_to_CLOSED
          - endpoints.POST_/recertification-cycles/{id}/close
          - concurrency_rules.cycle-close-stale-certificant
        distinguishing_aspect: |
          Closing a satisfied cycle re-issues the credential period but must not re-mint
          identity: certificate_number and issued_on are written once at minting and stay fixed,
          while valid_through and current_cycle_id move to the successor cycle.
        test_recipe:
          setup:
            - "One ACTIVE Certificant CPX-2026-00001 (issued_on 2026-08-10, valid_through 2027-08-10) with cycle 1 OPEN, required_credits 12, ceu_credit_accrual_basis STRICT_CYCLE."
            - "One APPROVED CEUActivity of 12 credits inside the window, so cycle 1 reads credits_applied 12.00 and status SATISFIED. The Certificant version is captured as ${cert_v}."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12, "ceu_credit_accrual_basis": "STRICT_CYCLE"}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX operational item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "first submission"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 40, "correct_count": 24, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${item_id}"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-1", "mean_expected_pass_rate": 0.6}
              as: Panelist
