  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_buffered_half_open_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_TREATMENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource: Technician; interval semantics: half-open with a 15-minute
          travel buffer on BOTH sides — [start-15min, end+15min). A visit
          starting at 10:14 conflicts with a 09:00-10:00 visit (buffered to
          10:15) while 10:15 exactly touches the buffer edge and is ACCEPTED
          (half-open). Distinct semantics from the heat floor gap below.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope ROACHES, budget 1000000), units 101 and 102, one technician"
            - "Technician has CHEMICAL treatment on 101 window 2026-08-10T09:00-10:00Z"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Holly Court", address: "15 Holly St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { u101: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "102", floor: 1, stack_index: 2, bedrooms: 1 }, as: ProgramAdmin, captures: { u102: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${u101}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager }
          trigger:
            - { call: "POST /pest/units/${u102}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T10:14:00Z", window_end: "2026-08-10T11:00:00Z" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /pest/units/${u102}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T10:15:00Z", window_end: "2026-08-10T11:00:00Z" }, as: PropertyManager, captures: { tr_id: "$.data.id", tr_status: "$.data.status" } }
          assert:
            - "10:14 start: error_id == ERR_TREATMENT_WINDOW_CONFLICT (10:14 < buffered end 10:15)"
            - "10:15 start: succeeds with 201 and status == SCHEDULED (half-open: touching the buffer edge is not an intersection)"
      - name: heat_floor_gap_minimum_24h
        grounds:
          - validations[priority=9]
          - errors[ERR_HEAT_FLOOR_GAP_VIOLATION]
        distinguishing_aspect: |
          Resource: Property floor; interval semantics: minimum-start-gap rule
          (|start difference| >= 24h among non-terminal HEAT treatments) — a
          gap constraint, not an intersection test, on a different resource
          than the technician. 23h fails; exactly 24h passes.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope BED_BUGS, budget 1000000), units 101 and 102 both floor 1, technician"
            - "HEAT treatment on 101 window 2026-08-10T08:00-16:00Z with vacancy_attested true"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Ivy Court", address: "16 Ivy St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { u101: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "102", floor: 1, stack_index: 2, bedrooms: 1 }, as: ProgramAdmin, captures: { u102: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${u101}/treatments", payload: { technician_id: "${tech_id}", pest_type: "BED_BUGS", treatment_type: "HEAT", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T16:00:00Z", vacancy_attested: true }, as: PropertyManager }
          trigger:
            - { call: "POST /pest/units/${u102}/treatments", payload: { technician_id: "${tech_id}", pest_type: "BED_BUGS", treatment_type: "HEAT", window_start: "2026-08-11T07:00:00Z", window_end: "2026-08-11T15:00:00Z", vacancy_attested: true }, as: PropertyManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /pest/units/${u102}/treatments", payload: { technician_id: "${tech_id}", pest_type: "BED_BUGS", treatment_type: "HEAT", window_start: "2026-08-11T08:00:00Z", window_end: "2026-08-11T16:00:00Z", vacancy_attested: true }, as: PropertyManager, captures: { tr_id: "$.data.id", tr_status: "$.data.status" } }
          assert:
            - "start gap 23h: error_id == ERR_HEAT_FLOOR_GAP_VIOLATION (HTTP 409)"
            - "start gap exactly 24h: succeeds with 201 and status == SCHEDULED (>= 24h inclusive)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: lease_balance_assess_waive_invariant
        grounds:
          - calculations.lease_balance
          - state_machines.Chargeback.ASSESSED_to_DISPUTED
          - state_machines.Chargeback.DISPUTED_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity: lease outstanding_balance_cents (money). Forward
          action ASSESS (16125) paired with its compensating action WAIVE
          returns the balance to exactly its prior value 0 — the waiver fully
          unwinds the assessment with zero drift.
        test_recipe:
          setup:
            - "Property with ACTIVE contract, unit 101, lease cap 100000 addendum signed, resident R on that lease"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Juniper Court", address: "17 Juniper St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "GET /pest/leases/${lease_id}", payload: {}, as: BillingClerk, captures: { bal0: "$.data.outstanding_balance_cents" } }
            - { call: "POST /pest/leases/${lease_id}/chargebacks", payload: { kind: "NON_COMPLIANCE_FEE" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb_id: "$.data.id", cb_prov: "$.data.provisional_amount_cents" } }
            - { call: "GET /pest/leases/${lease_id}", payload: {}, as: BillingClerk, captures: { bal1: "$.data.outstanding_balance_cents" } }
            - { call: "POST /pest/chargebacks/${cb_id}/dispute", payload: { reason: "prep was done" }, as: Resident, as_user_id: "${res_id}", captures: { cb_v: "$.data.version" } }
          trigger:
            - { call: "POST /pest/chargebacks/${cb_id}/resolve-dispute", payload: { resolution: "WAIVED", expected_chargeback_version: "${cb_v}" }, as: ComplianceOfficer, as_user_id: "officer-9", captures: { cb_status: "$.data.status" } }
            - { call: "GET /pest/leases/${lease_id}", payload: {}, as: BillingClerk, captures: { bal2: "$.data.outstanding_balance_cents", delinq: "$.data.delinquent" } }
          assert:
            - "balance before assess == 0; after assess == 16125 (round_half_up(15000 * 1.075)); after WAIVED == 0 — invariant outstanding_balance_cents restored exactly"
            - "Chargeback.${cb_id}.status == WAIVED (terminal); WAIVED contributes 0 to the balance formula"
            - "Lease.${lease_id}.delinquent == false after the waiver"
      - name: technician_minutes_schedule_cancel_invariant
        grounds:
          - calculations.technician_booked_minutes
          - state_machines.Treatment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: technician booked_minutes (capacity-minutes, a
          different quantity than money). Scheduling a 60-minute treatment adds
          exactly 60; cancelling the same treatment releases exactly 60,
          returning booked_minutes to 0 with no residue.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope ROACHES, budget 1000000), unit 101, technician with booked_minutes 0"
          setup_api_calls:
