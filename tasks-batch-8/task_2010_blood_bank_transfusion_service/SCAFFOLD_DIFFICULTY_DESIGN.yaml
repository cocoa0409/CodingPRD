  - rule_id: boundary_precision_check
    instances:
      - name: return_thirty_minute_boundary
        grounds:
          - calculations.return_disposition
          - state_machines.IssueRecord.ISSUED_to_RETURNED
        distinguishing_aspect: |
          Metric = elapsed minutes on POST .../return: at exactly issued_at +
          30m00s the unit RESTOCKS (<= is inclusive); at +30m01s the identical
          request DISCARDS with a RETURNED_OVER_30MIN wastage record.
        test_recipe:
          setup:
            - "clock 2026-08-10T09:00:00Z; patient A POS with ACTIVE T&S; order (RBC x2) READY; U1/U2 (O NEG) RESERVED and both issued at 09:00 (I1, I2)"
