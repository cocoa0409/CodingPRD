              payload: { received_qty: 2 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 2 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id" }
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 2 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 2 } ] }
              as: PackStation
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
            - call: "POST /clients/${cli}/orders/${ord}/ship"
              payload: {}
