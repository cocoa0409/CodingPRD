            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${i2_id}", reference: "ASN-C202", units_received: 30, size_received: [{ size_code: "S", units: 6 }, { size_code: "M", units: 11 }, { size_code: "L", units: 9 }, { size_code: "XL", units: 4 }], receipt_date: "2026-08-01T00:00:00Z" }
