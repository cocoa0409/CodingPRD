          setup: ["OPEN class; PATCH with correct version succeeds; second PATCH replays the pre-success version"]
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "FK08", name: "FK Fleet 8", simulator_cost_per_hour_cents: 38000, ioe_hours_required: 8, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq: $.data.id } }
