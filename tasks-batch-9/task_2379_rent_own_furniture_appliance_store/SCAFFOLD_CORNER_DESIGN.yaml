  - section: cross_cutting_complexity_layers
    instances:

      - name: quote_issue_with_a_stale_agreement_version_is_rejected
        claim_type: optimistic_concurrency
        rule_id: quote-issue-stale-agreement
        grounds:
          - concurrency_rules[quote-issue-stale-agreement]
          - endpoints[POST /agreements/{id}/early-purchase-quotes]
          - calculations.early_purchase_payoff.variants[PCT_OF_REMAINING]
        distinguishing_aspect: |
          A posted payment bumps Agreement.version, so a quote request holding
          the version read at agreement creation is refused with 412
          ERR_STALE_AGREEMENT_VERSION and no quote row is written — precisely the
          case the guard exists for, since the payoff base
          (total_of_payments_cents - rent_applied_cents) has just moved. Retried
          against the re-read version the same request succeeds and pins
          rent_applied_snapshot_cents at the post-payment 5077, giving 145160.
        test_recipe:
          setup:
            - "one TX StateRtoRule (early_purchase_formula PCT_OF_REMAINING, early_purchase_pct 0.55)"
            - "one DELIVERED TX agreement, WEEKLY x 52 on a NEW FURNITURE unit of 120000 (rate 5077, total 269004)"
            - "the version read at creation captured as ${agr_v1}"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
