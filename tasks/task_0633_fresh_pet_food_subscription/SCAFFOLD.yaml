# =============================================================================
# Fresh Pet-Food Subscription (The Farmer's Dog / Ollie style)
# SCAFFOLD.yaml — §1.0–§1.7
# Expert difficulty band (§0.4)
# =============================================================================

scenario: |
  633. Fresh Pet-Food Subscription (The Farmer's Dog/Ollie style): pet profile &
  portion/calorie calculation, vet-formulated recipe & allergen, recurring delivery
  cadence & cold-pack shipping, plan resize on weight change, skip/pause/swap,
  billing & renewal, transition schedule, referral credit

domain_name: fresh-pet-food-subscription
api_prefix: /api

# =============================================================================
# Complexity Profile (§0.3) — structural DNA, Expert band (§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # estimate-vs-actual portion; provisional-vs-final pack billing
    - cascading_side_effects          # weight log -> portion recalc -> resize realize -> next order reprice
    - scheduled_deferred_actions      # delivery cadence, pause-until, plan resize effective date
    - derived_field_reconciliation    # referral credit ledger, account wallet balance, calorie target
    - optimistic_concurrency          # plan resize / order generate on a stale Subscription version

  entity_topology: flat
  # Peer collections under /api with FK references: /api/accounts, /api/pets,
  # /api/recipes, /api/subscriptions, /api/weight-logs, /api/orders,
  # /api/shipments, /api/referral-credits. No URL nesting; FK in body/filter.

  state_machine_shape: cyclic
  # Subscription has a cyclic ACTIVE<->PAUSED loop and a PAST_DUE->ACTIVE recovery
  # loop; Order has a branching skip/charge/retry path; Shipment is linear.

  relationship_patterns:
    - one_to_many        # Account -> Pet, Subscription, Order, ReferralCredit
    - cross_aggregate    # Subscription references shared Recipe configuration
    - self_referential   # ReferralCredit links referrer Account.id and referred Account.id; Account.referred_by_account_id -> Account.id

  role_model: peer_roles
  # PetParent owns their Account/Pet/Subscription; NutritionVet curates Recipes;
  # FulfillmentOps runs shipping/clock; BillingAdmin runs billing/renewal;
  # Anonymous registers + previews referral.

  consistency_model: immediate
  # All mutations and cascades complete atomically within the triggering request;
  # scheduled effects (resize effective date, pause-until, spoilage) are realized
  # by the /_clock advance endpoint plus the order/charge/deliver endpoints, not async.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --------------------------------------------------------------------------
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: email, type: string, source: input, description: "Login email; unique across accounts (case-insensitive)" }
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: country_code, type: enum, source: input, default: "US", description: "US | CA — gates allowed Recipe availability_regions" }
      - { name: referral_code, type: string, source: system, description: "Server-minted unique share code (uppercase 8-char) for this account's referral link" }
      - { name: referred_by_account_id, type: string, source: system, description: "FK -> Account.id; the referrer whose referral_code was supplied at register; null if organic" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Sum of GRANTED ReferralCredit.amount_cents paid to this account minus credit already consumed by PAID orders; never negative" }
      - { name: lifetime_referral_grants_cents, type: integer, source: computed, description: "Cumulative referrer_grant_cents ever GRANTED with this account as referrer; monotonic non-decreasing" }
      - { name: status, type: enum, source: system, description: "ACTIVE — accounts are ACTIVE for their whole lifetime in this version (single-value enum; referral_code resolution requires an ACTIVE referrer)" }

  # --------------------------------------------------------------------------
  - name: Pet
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account; must equal the acting PetParent" }
      - { name: name, type: string, source: input, description: "Pet name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT — selects calorie constant table" }
      - { name: sex, type: enum, source: input, description: "MALE | FEMALE" }
      - { name: birth_date, type: datetime, source: input, description: "ISO date; used to derive life_stage against logical clock" }
      - { name: current_weight_kg, type: number, source: computed, description: "Weight from the most recent APPLIED WeightLog by effective_date (tie-break created_at ASC); seeded from initial_weight_kg at create" }
      - { name: initial_weight_kg, type: number, source: input, description: "Body weight at registration in kilograms, > 0" }
      - { name: ideal_weight_kg, type: number, source: input, description: "Target healthy body weight in kilograms, > 0; drives weight-goal basis" }
      - { name: activity_level, type: enum, source: input, default: "MODERATE", description: "LOW | MODERATE | HIGH — selects activity multiplier" }
      - { name: neutered, type: boolean, source: input, default: true, description: "Affects resting-energy multiplier" }
      - { name: body_condition_goal, type: enum, source: input, default: "MAINTAIN", description: "LOSE | MAINTAIN | GAIN — weight-goal multiplier and basis selection" }
      - { name: allergen_exclusions, type: array, source: input, default: [], description: "Allergen tags the pet must avoid, e.g. [CHICKEN, BEEF, GRAIN]" }
      - { name: daily_calorie_target, type: number, source: computed, description: "Computed metabolizable-energy target in kcal/day; see calc daily_calorie_target" }
      - { name: life_stage, type: enum, source: computed, description: "PUPPY_KITTEN | ADULT | SENIOR derived from birth_date vs clock; alters life-stage multiplier" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED; ARCHIVED is terminal" }

  # --------------------------------------------------------------------------
  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Recipe display name (e.g. Turkey & Sweet Potato)" }
      - { name: species, type: enum, source: input, description: "DOG | CAT — must match Pet.species to be selectable" }
      - { name: kcal_per_gram, type: number, source: input, description: "Metabolizable energy density in kcal per gram, > 0; drives grams-per-day from calorie target" }
      - { name: price_per_100g_cents, type: integer, source: input, description: "Price in cents per 100 grams of cooked food, > 0" }
      - { name: ingredient_allergens, type: array, source: input, default: [], description: "Allergen tags present in this recipe, e.g. [CHICKEN, GRAIN]" }
      - { name: availability_regions, type: array, source: input, default: [], description: "Country codes where recipe ships, e.g. [US, CA]" }
      - { name: vet_formulated, type: boolean, source: input, default: false, description: "Whether a NutritionVet certified this recipe" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED; only PUBLISHED is selectable; RETIRED is terminal" }

  # --------------------------------------------------------------------------
  - name: Subscription
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account; must equal acting PetParent" }
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; the pet this plan feeds; pet must belong to account_id" }
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id; the currently selected PUBLISHED recipe" }
      - { name: cadence_days, type: integer, source: input, default: 28, description: "Delivery cadence in days; one of {14, 21, 28}" }
      - { name: pack_grams_per_day, type: number, source: computed, description: "round_half_up(daily_calorie_target / recipe.kcal_per_gram, 0); resized on weight change" }
      - { name: pack_total_grams, type: number, source: computed, description: "pack_grams_per_day * cadence_days" }
      - { name: cycle_price_cents, type: integer, source: computed, description: "Pre-credit price of one cycle's food; see calc cycle_price; estimate variant, re-derived on each resize" }
      - { name: transition_remaining_cycles, type: integer, source: computed, description: "Cycles still served under the transition blend; starts at TRANSITION_CYCLES on first activation, decremented per PAID order, floor 0" }
      - { name: pending_resize_grams_per_day, type: number, source: system, description: "Staged new pack_grams_per_day awaiting effective_at; null when no resize pending" }
      - { name: resize_effective_at, type: datetime, source: system, description: "Logical-clock instant at which pending_resize_grams_per_day is realized; null when no resize pending" }
      - { name: pause_until, type: datetime, source: system, description: "Logical-clock instant at which a PAUSED subscription auto-resumes on clock advance + order generate; null unless PAUSED with an end date" }
      - { name: next_order_date, type: datetime, source: computed, description: "Logical-clock date the next Order is due; advances by cadence_days when an order is generated, skipped, or settled PAID" }
      - { name: consecutive_failed_charges, type: integer, source: computed, description: "Count of consecutive FAILED order charges; reset to 0 on a PAID charge; drives PAST_DUE -> CANCELLED at limit" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | PAST_DUE | CANCELLED; CANCELLED is terminal" }

  # --------------------------------------------------------------------------
  - name: WeightLog
    parent: Pet
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; tie-break key for equal effective_date" }
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; the weighed pet" }
      - { name: weight_kg, type: number, source: input, description: "Recorded body weight in kilograms, > 0" }
      - { name: effective_date, type: datetime, source: input, description: "Logical-clock instant the reading applies from; must be <= current clock" }
      - { name: status, type: enum, source: system, description: "APPLIED | SUPERSEDED; the single latest effective_date (tie-break created_at ASC) is APPLIED, all others SUPERSEDED" }

  # --------------------------------------------------------------------------
  - name: Order
    parent: Subscription
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; owning subscription" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; denormalized owner for billing queries" }
      - { name: cycle_index, type: integer, source: system, description: "Monotonic per-subscription cycle number starting at 1; assigned at generation" }
      - { name: scheduled_ship_date, type: datetime, source: system, description: "Logical-clock date this order is scheduled to ship; equals subscription next_order_date at generation" }
      - { name: food_grams, type: number, source: computed, description: "Grams of food in this order = subscription pack_total_grams snapshotted at generation" }
      - { name: is_transition_cycle, type: boolean, source: computed, description: "True when generated while subscription transition_remaining_cycles > 0; flags the transition schedule blend" }
      - { name: food_subtotal_cents, type: integer, source: computed, description: "Pre-credit food cost (actual variant); see calc cycle_price applied to this order's snapshot" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Referral credit consumed against this order at charge time; <= wallet_credit_cents and <= food_subtotal_cents + shipping_cents" }
      - { name: shipping_cents, type: integer, source: computed, description: "Cold-pack shipping fee; see calc shipping_fee" }
      - { name: total_charged_cents, type: integer, source: computed, description: "food_subtotal_cents + shipping_cents - credit_applied_cents; never negative" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SKIPPED | CHARGING | PAID | FAILED; SKIPPED and PAID are terminal-for-cycle; FAILED may retry" }

  # --------------------------------------------------------------------------
  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the paid order being fulfilled" }
      - { name: coolant_packs, type: integer, source: computed, description: "Number of cold packs; see calc coolant_packs from food_grams and transit_days" }
      - { name: transit_days, type: integer, source: input, default: 2, description: "Carrier transit days, 1..5; drives coolant_packs and spoilage gate" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock instant the shipment left the depot; null until DISPATCHED" }
      - { name: status, type: enum, source: system, description: "PENDING | DISPATCHED | DELIVERED | SPOILED; DELIVERED and SPOILED are terminal" }

  # --------------------------------------------------------------------------
  - name: ReferralCredit
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: referrer_account_id, type: string, source: input, description: "FK -> Account.id; account that owns the redeemed referral_code" }
      - { name: referred_account_id, type: string, source: input, description: "FK -> Account.id; the newly registered account that supplied the code (also the beneficiary for make-good rows)" }
      - { name: amount_cents, type: integer, source: computed, description: "Credit value; see calc referral_credit" }
      - { name: beneficiary, type: enum, source: system, description: "REFERRER | REFERRED — which account this row pays out to" }
      - { name: reason, type: enum, source: system, description: "SIGNUP | MAKE_GOOD — SIGNUP for referral rows, MAKE_GOOD for spoilage compensation" }
      - { name: status, type: enum, source: system, description: "PENDING | GRANTED | REVOKED; SIGNUP rows PENDING until referred account's first PAID order; GRANTED is spendable; REVOKED is terminal" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --------------------------------------------------------------------------
  - entity: Subscription
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/subscriptions/{subscriptionId}/activate"
        actor: PetParent
        preconditions:
          - "Subscription.status == DRAFT (ERR_SUBSCRIPTION_NOT_DRAFT)"
          - "Referenced Pet.status == ACTIVE (ERR_PET_ARCHIVED) — cross-entity: Pet must be live to activate its plan"
          - "Referenced Recipe.status == PUBLISHED (ERR_RECIPE_NOT_PUBLISHED) — cross-entity: recipe must be live"
          - "Recipe.species == Pet.species (ERR_RECIPE_SPECIES_MISMATCH)"
          - "Recipe.ingredient_allergens disjoint from Pet.allergen_exclusions (ERR_ALLERGEN_CONFLICT)"
          - "Account.country_code in Recipe.availability_regions (ERR_RECIPE_REGION_UNAVAILABLE)"
        side_effects:
          - "transition_remaining_cycles set to TRANSITION_CYCLES (= 2)"
          - "pack_grams_per_day, pack_total_grams, cycle_price_cents computed from Pet.daily_calorie_target and Recipe"
          - "next_order_date set to current logical clock date"
          - "consecutive_failed_charges set to 0"
          - "increments Subscription.version by 1"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/subscriptions/{subscriptionId}/pause"
        actor: PetParent
        preconditions:
          - "Subscription.status == ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "No Order for this subscription is in CHARGING (ERR_ORDER_IN_FLIGHT)"
        side_effects:
          - "pause_until set to request resume_at when provided, else null (indefinite)"
          - "increments Subscription.version by 1"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/subscriptions/{subscriptionId}/resume OR system on order-generate when clock >= pause_until"
        actor: PetParent | system
        preconditions:
          - "Subscription.status == PAUSED (ERR_SUBSCRIPTION_NOT_PAUSED)"
        side_effects:
          - "pause_until cleared to null"
          - "next_order_date set to max(next_order_date, current clock date) so a paused-through window does not back-bill"
          - "increments Subscription.version by 1"

      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (order charge settled DECLINED during renewal)"
        actor: system
        preconditions:
          - "An Order for this subscription transitioned CHARGING -> FAILED"
        side_effects:
          - "consecutive_failed_charges incremented by 1"
          - "next_order_date left unchanged so the same cycle retries"
          - "increments Subscription.version by 1"

      - from: PAST_DUE
        to: ACTIVE
        trigger: "system (a retried order charge settled SUCCEEDED) — realized by POST /api/orders/{orderId}/settle-charge outcome=SUCCEEDED"
        actor: system
        preconditions:
          - "Subscription.status == PAST_DUE"
          - "A retried Order reached PAID"
        side_effects:
          - "consecutive_failed_charges reset to 0"
          - "next_order_date advanced by cadence_days"
          - "increments Subscription.version by 1"

      - from: PAST_DUE
        to: CANCELLED
        trigger: "system (consecutive_failed_charges reaches MAX_FAILED_CHARGES on the latest FAILED charge) — realized by POST /api/orders/{orderId}/settle-charge outcome=DECLINED"
        actor: system
        preconditions:
          - "consecutive_failed_charges >= MAX_FAILED_CHARGES (= 3) after the latest FAILED charge"
        side_effects:
          - "All SCHEDULED Orders for this subscription -> SKIPPED (conditional cascade: only non-terminal SCHEDULED orders)"
          - "pending_resize_grams_per_day, resize_effective_at -> null"
          - "If the owning account has NO PAID Order across all its subscriptions, its PENDING SIGNUP ReferralCredit rows (where it is referred_account_id) -> REVOKED (conditional cascade: only PENDING SIGNUP rows)"
          - "increments Subscription.version by 1"

      - from: [ACTIVE, PAUSED, PAST_DUE]
        to: CANCELLED
        trigger: "POST /api/subscriptions/{subscriptionId}/cancel"
        actor: PetParent
        preconditions:
          - "Subscription.status in {ACTIVE, PAUSED, PAST_DUE} (ERR_SUBSCRIPTION_ALREADY_CANCELLED)"
          - "No Order for this subscription is in CHARGING (ERR_ORDER_IN_FLIGHT)"
        side_effects:
          - "All SCHEDULED Orders for this subscription -> SKIPPED (conditional cascade: only SCHEDULED)"
          - "pending_resize_grams_per_day, resize_effective_at -> null"
          - "If the owning account has NO PAID Order across all its subscriptions, its PENDING SIGNUP ReferralCredit rows (where it is referred_account_id) -> REVOKED (conditional cascade: only PENDING SIGNUP rows)"
          - "increments Subscription.version by 1"

  # --------------------------------------------------------------------------
  - entity: Order
    field: status
    initial_state: SCHEDULED
    terminal_states: [SKIPPED, PAID]
    transitions:
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /api/orders/{orderId}/skip"
        actor: PetParent
        preconditions:
          - "Order.status == SCHEDULED (ERR_ORDER_NOT_SCHEDULED)"
          - "Parent Subscription.status in {ACTIVE, PAUSED} (ERR_SUBSCRIPTION_NOT_ACTIVE) — cross-entity guard"
          - "current clock date < Order.scheduled_ship_date (ERR_SKIP_WINDOW_CLOSED) — cannot skip on/after ship day"
        side_effects:
          - "Subscription.next_order_date advanced by cadence_days (this cycle is forgiven, no charge)"
          - "increments Subscription.version by 1"

      - from: SCHEDULED
        to: CHARGING
        trigger: "POST /api/orders/{orderId}/charge"
        actor: BillingAdmin | FulfillmentOps
        preconditions:
          - "Order.status == SCHEDULED (ERR_ORDER_NOT_SCHEDULED)"
          - "Parent Subscription.status in {ACTIVE, PAST_DUE} (ERR_SUBSCRIPTION_NOT_CHARGEABLE) — cross-entity guard; PAUSED cannot charge"
          - "current clock date >= Order.scheduled_ship_date (ERR_CHARGE_BEFORE_SHIP_DATE)"
        side_effects:
          - "credit_applied_cents, shipping_cents, total_charged_cents finalized from current wallet_credit_cents (calc order_charge_settlement)"

      - from: CHARGING
        to: PAID
        trigger: "POST /api/orders/{orderId}/settle-charge with outcome=SUCCEEDED"
        actor: BillingAdmin | FulfillmentOps
        preconditions:
          - "Order.status == CHARGING (ERR_ORDER_NOT_CHARGING)"
        side_effects:
          - "credit_applied_cents consumed from wallet (Account.wallet_credit_cents recomputed downward)"
          - "Subscription.consecutive_failed_charges reset to 0; if Subscription was PAST_DUE -> ACTIVE (cross-entity bubble-up)"
          - "Subscription.next_order_date advanced by cadence_days; transition_remaining_cycles decremented by 1 with floor 0"
          - "a Shipment is created in PENDING for this order"
          - "If this is the referred account's first PAID order: linked PENDING SIGNUP ReferralCredit rows -> GRANTED (cascade to ReferralCredit + both accounts' wallet/lifetime fields)"
          - "increments Subscription.version by 1"

      - from: CHARGING
        to: FAILED
        trigger: "POST /api/orders/{orderId}/settle-charge with outcome=DECLINED"
        actor: BillingAdmin | FulfillmentOps
        preconditions:
          - "Order.status == CHARGING (ERR_ORDER_NOT_CHARGING)"
        side_effects:
          - "Subscription.consecutive_failed_charges incremented; Subscription ACTIVE -> PAST_DUE (cross-entity)"
          - "If consecutive_failed_charges reaches MAX_FAILED_CHARGES: Subscription PAST_DUE -> CANCELLED cascade (transitive: charge fail -> PAST_DUE -> CANCELLED -> sibling SCHEDULED orders SKIPPED)"

      - from: FAILED
        to: CHARGING
        trigger: "POST /api/orders/{orderId}/retry-charge"
        actor: BillingAdmin
        preconditions:
          - "Order.status == FAILED (ERR_ORDER_NOT_FAILED)"
          - "Parent Subscription.status == PAST_DUE (ERR_SUBSCRIPTION_NOT_PAST_DUE) — cross-entity guard"
        side_effects:
          - "credit_applied_cents, shipping_cents, total_charged_cents re-finalized from current wallet_credit_cents"

  # --------------------------------------------------------------------------
  - entity: Shipment
    field: status
    initial_state: PENDING
    terminal_states: [DELIVERED, SPOILED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /api/shipments/{shipmentId}/dispatch"
        actor: FulfillmentOps
        preconditions:
          - "Shipment.status == PENDING (ERR_SHIPMENT_NOT_PENDING)"
          - "Parent Order.status == PAID (ERR_ORDER_NOT_PAID) — cross-entity guard; only paid food ships"
          - "coolant_packs >= required_coolant_for(transit_days) (ERR_INSUFFICIENT_COOLANT)"
        side_effects:
          - "dispatched_at set to current logical clock"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /api/shipments/{shipmentId}/deliver within the transit window"
        actor: FulfillmentOps
        preconditions:
          - "Shipment.status == DISPATCHED (ERR_SHIPMENT_NOT_DISPATCHED)"
          - "elapsed_days(dispatched_at -> current clock) <= transit_days (else the SPOILED transition fires, ERR_SHIPMENT_SPOILED)"
        side_effects: []

      - from: DISPATCHED
        to: SPOILED
        trigger: "POST /api/shipments/{shipmentId}/deliver when elapsed_days(dispatched_at -> clock) > transit_days"
        actor: FulfillmentOps
        preconditions:
          - "Shipment.status == DISPATCHED"
          - "elapsed_days(dispatched_at -> current clock) > transit_days"
        side_effects:
          - "A make-good MAKE_GOOD ReferralCredit row is created GRANTED to the owning account for the order's credit_applied_cents + total_charged_cents (full refund as wallet credit) — cross-entity compensation"

  # --------------------------------------------------------------------------
  - entity: Recipe
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/recipes/{recipeId}/publish"
        actor: NutritionVet
        preconditions:
          - "Recipe.status == DRAFT (ERR_RECIPE_NOT_DRAFT)"
        side_effects:
          - "Recipe becomes selectable by subscriptions"

      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /api/recipes/{recipeId}/retire"
        actor: NutritionVet
        preconditions:
          - "Recipe.status == PUBLISHED (ERR_RECIPE_NOT_PUBLISHED)"
        side_effects:
          - "Recipe can no longer be activated or swapped onto (existing snapshots are unaffected); a subsequent activate referencing this recipe is rejected by the DRAFT_to_ACTIVE referential gate"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-generate-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /api/subscriptions/{subscriptionId}/orders"
    occ_field: "expected_subscription_version"
    description: |
      Generating a new Order against a Subscription whose version has advanced
      since the client last observed it is rejected. A prior writer may have
      already generated the next cycle's Order (advancing next_order_date and the
      subscription version) or realized a staged resize; the current writer's view
      of cadence/grams/price is therefore stale and would mint a duplicate or
      mispriced cycle.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: resize-stage-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /api/subscriptions/{subscriptionId}/resize"
    occ_field: "expected_subscription_version"
    description: |
      Staging a plan resize against a Subscription whose version has advanced
      since the client last read it is rejected. Another writer may have already
      staged a resize or generated an order (both bump the subscription version),
      so the grams/price the current request computed against the prior snapshot
      are stale and must be recomputed from the current subscription state.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- 1. daily calorie target (Pet) — mode (a): >=3 inputs, nested multipliers
  - name: daily_calorie_target
    trigger: "Pet create; PATCH /api/pets/{id}; weight-log application cascade"
    algorithm: weighted_scoring
    formula: |
      # Resting Energy Requirement then layered multipliers (mode (a): nested, conditional, tiered).
      neuter_mult   = NEUTER_MULT          if neutered      else INTACT_MULT
      activity_mult = ACTIVITY_MULT[activity_level]
      stage_mult    = STAGE_MULT[life_stage]
      goal_mult     = GOAL_MULT[body_condition_goal]
      # weight-goal correction: if goal is LOSE/GAIN, basis is ideal_weight, else current_weight.
      basis_weight  = ideal_weight_kg if body_condition_goal in {LOSE, GAIN} else current_weight_kg
      RER_basis     = RER_COEFF[Pet.species] * (basis_weight ** 0.75)
      daily_calorie_target = round_half_up(
          RER_basis * neuter_mult * activity_mult * stage_mult * goal_mult, 0)
    input_set: "Single Pet; uses current_weight_kg (latest APPLIED WeightLog) and ideal_weight_kg"
    constants:
      RER_COEFF: { DOG: 70.0, CAT: 60.0 }
      NEUTER_MULT: 1.0
      INTACT_MULT: 1.2
      ACTIVITY_MULT: { LOW: 1.0, MODERATE: 1.2, HIGH: 1.5 }
      STAGE_MULT: { PUPPY_KITTEN: 1.6, ADULT: 1.0, SENIOR: 0.9 }
      GOAL_MULT: { LOSE: 0.8, MAINTAIN: 1.0, GAIN: 1.15 }
      LIFE_STAGE_BOUNDARIES: "age_years = floor((clock_date - birth_date) / 365); life_stage = PUPPY_KITTEN if age_years < 1; SENIOR if age_years >= 8; else ADULT. Boundaries inclusive at >= for SENIOR, strict < for PUPPY_KITTEN."
    precision: "integer kcal, round_half_up at the final step only"
    note: "Evaluation order pinned: compute life_stage from LIFE_STAGE_BOUNDARIES against the current clock, then RER_basis, THEN multiply the four multipliers left-to-right, THEN round once. Rounding any intermediate is forbidden."

  # --- 2. pack grams per day & cycle price (Subscription) — mode (b): rounding order pinned
  - name: cycle_price
    trigger: "Subscription activate; resize realization; swap-recipe; Order generation snapshot"
    algorithm: tiered_pricing
    formula: |
      # Mode (b): rounding order is load-bearing. Pinned: "round grams-per-day first, THEN scale".
      pack_grams_per_day = round_half_up(pet.daily_calorie_target / recipe.kcal_per_gram, 0)  # whole grams/day
      pack_total_grams   = pack_grams_per_day * subscription.cadence_days                      # exact integer
      hundreds           = pack_total_grams / 100.0                                            # may be fractional
      discount           = volume_discount(pack_total_grams)   # per VOLUME_TIERS
      tier_rate_cents    = recipe.price_per_100g_cents * (1 - discount)                        # not rounded yet
      cycle_price_cents  = round_half_up(hundreds * tier_rate_cents, 0)                         # round once, at the end
    input_set: "One Subscription + its Recipe + its Pet.daily_calorie_target"
    constants:
      VOLUME_TIERS: "pack_total_grams < 4000 -> 0.00; 4000 <= g < 8000 -> 0.05; g >= 8000 -> 0.10"
    precision: "cents, round_half_up; grams-per-day rounded first (whole grams), price rounded once at the end"
    variants:
      - name: estimate
        when: "computed at quote / DRAFT activation time onto Subscription.cycle_price_cents"
        difference: "Uses the live Pet.daily_calorie_target; not snapshotted; recomputed on every resize/swap"
      - name: actual
        when: "snapshotted onto an Order at generation as Order.food_subtotal_cents"
        difference: "Frozen onto the Order; a later weight change does NOT retro-price an already-generated SCHEDULED order"

  # --- 3. shipping fee (Order) — threshold/free-ship boundary
  - name: shipping_fee
    trigger: "Order charge (SCHEDULED->CHARGING) and retry (FAILED->CHARGING)"
    algorithm: threshold
    formula: |
      if order.food_subtotal_cents >= FREE_SHIP_THRESHOLD_CENTS:
        shipping_cents = 0
      else:
        shipping_cents = SHIP_BASE_CENTS
    input_set: "One Order's food_subtotal_cents"
    constants:
      SHIP_BASE_CENTS: 999
      FREE_SHIP_THRESHOLD_CENTS: 8000
    precision: "cents"
    note: "Boundary inclusive: food_subtotal_cents == 8000 ships free; 7999 pays 999."

  # --- 4. order charge settlement (Order) — mode (c): pinned eval order, circular-looking credit
  - name: order_charge_settlement
    trigger: "Order SCHEDULED->CHARGING and FAILED->CHARGING (retry)"
    algorithm: waterfall_allocation
    formula: |
      # Mode (c): credit_applied depends on (food_subtotal + shipping); shipping depends on food_subtotal;
      # credit cannot exceed the grand total. Evaluation order pinned:
      #   step 1: food_subtotal_cents := Order.food_subtotal_cents (already snapshotted)
      #   step 2: shipping_cents := shipping_fee(food_subtotal_cents)   # decided from PRE-credit subtotal
      #   step 3: gross := food_subtotal_cents + shipping_cents
      #   step 4: credit_applied_cents := min(account.wallet_credit_cents, gross)
      #   step 5: total_charged_cents := gross - credit_applied_cents     # never negative
    input_set: "One Order + owning Account.wallet_credit_cents at charge time"
    constants: {}
    precision: "cents; integer arithmetic, no rounding"
    note: "Pinned order: shipping decided from pre-credit subtotal, THEN credit applied to gross. Computing shipping after credit would change free-ship eligibility — forbidden."

  # --- 5. coolant packs (Shipment) — tiered by mass and transit days
  - name: coolant_packs
    trigger: "Shipment creation (on Order PAID); PATCH /api/shipments/{id} transit_days update before dispatch"
    algorithm: tiered_pricing
    formula: |
      mass_units = ceil(order.food_grams / COOLANT_GRAMS_PER_PACK)   # one pack per COOLANT_GRAMS_PER_PACK grams
      day_units  = max(0, transit_days - COOLANT_FREE_DAYS)          # extra pack per day beyond the free window
      coolant_packs = max(COOLANT_MIN, mass_units + day_units)
    input_set: "One Shipment's Order.food_grams and Shipment.transit_days"
    constants:
      COOLANT_GRAMS_PER_PACK: 4000
      COOLANT_FREE_DAYS: 2
      COOLANT_MIN: 1
    precision: "integer packs"
    note: "required_coolant_for(transit_days) used by the dispatch gate equals this same formula; dispatch rejects if stored coolant_packs < it."

  # --- 6. referral credit (ReferralCredit) — dual-variant vs cycle_price; lifetime cap
  - name: referral_credit
    trigger: "Account register with a valid referral_code (PENDING SIGNUP rows); referred account's first Order PAID (GRANT)"
    algorithm: aggregation
    formula: |
      # Two SIGNUP rows minted PENDING at register:
      referred_grant_cents = REFERRED_FLAT_CENTS                              # fixed welcome credit to the new account
      referrer_grant_cents = min(REFERRER_FLAT_CENTS,
                                 max(0, REFERRER_ANNUAL_CAP_CENTS - referrer.lifetime_referral_grants_cents))
      # On the referred account's first PAID order both rows flip PENDING->GRANTED and amounts lock.
      # referrer_grant is clamped so a referrer's lifetime grants never exceed REFERRER_ANNUAL_CAP_CENTS.
    input_set: "Referrer Account.lifetime_referral_grants_cents + the two new SIGNUP ReferralCredit rows"
    constants:
      REFERRED_FLAT_CENTS: 2000
      REFERRER_FLAT_CENTS: 1500
      REFERRER_ANNUAL_CAP_CENTS: 9000
    precision: "cents"
    note: "Conserved quantity: on each GRANT, referrer Account.lifetime_referral_grants_cents increases by exactly referrer_grant_cents and each beneficiary's wallet_credit_cents increases by that row's amount_cents. REVOKE reverses both."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: "all except POST /api/accounts/register, POST /api/referrals/redeem-preview, POST /_clock/set_current_utc, GET /_clock"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7; entity_backed PetParent owns the target account (X-User-ID == account_id of the resource) where ownership is required"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: existence
    check: "Path/body resources exist, validated left-to-right: accountId/account_id, then petId/pet_id/recipeId/recipe_id, then subscriptionId/subscription_id, then orderId/order_id, then shipmentId"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_PET_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition (see §1.2 preconditions per transition)"
    error_id: "ERR_SUBSCRIPTION_NOT_DRAFT | ERR_SUBSCRIPTION_NOT_ACTIVE | ERR_SUBSCRIPTION_NOT_PAUSED | ERR_SUBSCRIPTION_NOT_PAST_DUE | ERR_SUBSCRIPTION_NOT_CHARGEABLE | ERR_SUBSCRIPTION_ALREADY_CANCELLED | ERR_ORDER_NOT_SCHEDULED | ERR_ORDER_NOT_CHARGING | ERR_ORDER_NOT_FAILED | ERR_ORDER_NOT_PAID | ERR_SHIPMENT_NOT_PENDING | ERR_SHIPMENT_NOT_DISPATCHED | ERR_SHIPMENT_SPOILED | ERR_PET_ARCHIVED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "Cross-entity reference integrity at activation/swap: Recipe PUBLISHED, species match, region availability"
    error_id: "ERR_RECIPE_NOT_PUBLISHED | ERR_RECIPE_SPECIES_MISMATCH | ERR_RECIPE_REGION_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /api/subscriptions/{id}/activate, POST /api/subscriptions/{id}/swap-recipe"

  - priority: 6
    category: business_safety
    check: "Allergen safety: Recipe.ingredient_allergens must be disjoint from Pet.allergen_exclusions"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /api/subscriptions (create), POST /api/subscriptions/{id}/activate, POST /api/subscriptions/{id}/swap-recipe"

  - priority: 7
    category: business_temporal
    check: "Temporal window gates: skip only before scheduled_ship_date; weight-log effective_date <= clock; resize effective_at >= clock; charge only on/after ship date"
    error_id: "ERR_SKIP_WINDOW_CLOSED | ERR_WEIGHTLOG_FUTURE_DATED | ERR_RESIZE_EFFECTIVE_IN_PAST | ERR_CHARGE_BEFORE_SHIP_DATE"
    http_status: 422
    applies_to: "POST /api/orders/{id}/skip, POST /api/weight-logs, POST /api/subscriptions/{id}/resize, POST /api/orders/{id}/charge"

  - priority: 8
    category: business_constraint
    check: "Domain constraints: cadence_days in {14,21,28}; transit_days in 1..5; coolant sufficiency at dispatch; pet has no active subscription on archive"
    error_id: "ERR_INVALID_CADENCE | ERR_INVALID_TRANSIT_DAYS | ERR_INSUFFICIENT_COOLANT | ERR_PET_HAS_ACTIVE_SUBSCRIPTION"
    http_status: 422
    applies_to: "subscription create, shipment patch/dispatch, pet archive"

  - priority: 9
    category: business_constraint
    check: "OCC: expected_subscription_version must equal current Subscription.version on order-generate and resize"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /api/subscriptions/{id}/orders, POST /api/subscriptions/{id}/resize"

  - priority: 10
    category: business_fiscal
    check: "Email uniqueness at register; referral_code must resolve to an ACTIVE account and cannot be self-referral"
    error_id: "ERR_EMAIL_TAKEN | ERR_REFERRAL_CODE_INVALID | ERR_SELF_REFERRAL"
    http_status: 409
    applies_to: "POST /api/accounts/register"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock --------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute ISO-8601 UTC instant. Server startup default clock is 2026-01-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock. Advancing the clock only moves time; due scheduled effects (pause auto-resume, resize realization, shipment spoilage) are realized when the relevant business endpoint is next invoked."
    roles: [FulfillmentOps, BillingAdmin, NutritionVet, PetParent]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

  - method: GET
    path: "/_clock"
    description: "Read the current logical clock."
    roles: [FulfillmentOps, BillingAdmin, NutritionVet, PetParent, Anonymous]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # ---- Accounts & referral ----------------------------------------------
  - method: POST
    path: "/api/accounts/register"
    description: "Register a new Account. If referral_code is supplied and valid, two PENDING SIGNUP ReferralCredit rows (REFERRER + REFERRED) are minted and referred_by_account_id recorded."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, "country_code?", "referral_code?"]
    output: Account
    side_effects:
      - "Account created ACTIVE with server-minted referral_code"
      - "If referral_code valid: ReferralCredit REFERRER + REFERRED rows created PENDING reason=SIGNUP; referred_by_account_id set"

  - method: GET
    path: "/api/accounts/{accountId}"
    description: "Read an account, including computed wallet_credit_cents and lifetime_referral_grants_cents."
    roles: [PetParent, BillingAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/api/accounts"
    description: "List accounts; filter by referred_by_account_id to find referees of a referrer (reverse-reachability for Account.referred_by_account_id)."
    roles: [BillingAdmin]
    code: 200
    input: ["referred_by_account_id?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: POST
    path: "/api/referrals/redeem-preview"
    description: "Preview the credit a referral_code would yield without registering (referrer cap honored). Anonymous, no auth."
    roles: [Anonymous]
    code: 200
    input: [referral_code]
    output: "{ referrer_grant_cents: integer, referred_grant_cents: integer, referrer_account_id: string }"
    side_effects: []

  - method: GET
    path: "/api/referral-credits"
    description: "List ReferralCredit rows; filter by referrer_account_id OR referred_account_id (reverse-reachability for both FK roles), plus beneficiary/status."
    roles: [PetParent, BillingAdmin]
    code: 200
    input: ["referrer_account_id?", "referred_account_id?", "beneficiary?", "status?", "limit?", "offset?"]
    output: "ReferralCredit[]"
    side_effects: []

  - method: GET
    path: "/api/referral-credits/{referralCreditId}"
    description: "Read a single ReferralCredit row."
    roles: [PetParent, BillingAdmin]
    code: 200
    input: []
    output: ReferralCredit
    side_effects: []

  # ---- Recipes (config; vet-curated) ------------------------------------
  - method: POST
    path: "/api/recipes"
    description: "Create a Recipe in DRAFT."
    roles: [NutritionVet]
    code: 201
    input: [name, species, kcal_per_gram, price_per_100g_cents, "ingredient_allergens?", "availability_regions?", "vet_formulated?"]
    output: Recipe
    side_effects: ["Recipe created DRAFT"]

  - method: POST
    path: "/api/recipes/{recipeId}/publish"
    description: "Publish a DRAFT recipe so subscriptions may select it."
    roles: [NutritionVet]
    code: 200
    input: []
    output: Recipe
    side_effects: ["status DRAFT -> PUBLISHED"]

  - method: POST
    path: "/api/recipes/{recipeId}/retire"
    description: "Retire a PUBLISHED recipe (terminal). Existing subscriptions keep their snapshot but cannot be activated/swapped onto a RETIRED recipe."
    roles: [NutritionVet]
    code: 200
    input: []
    output: Recipe
    side_effects: ["status PUBLISHED -> RETIRED"]

  - method: GET
    path: "/api/recipes/{recipeId}"
    description: "Read a recipe."
    roles: [NutritionVet, PetParent, BillingAdmin]
    code: 200
    input: []
    output: Recipe
    side_effects: []

  - method: GET
    path: "/api/recipes"
    description: "List recipes; filter by species and status."
    roles: [NutritionVet, PetParent, BillingAdmin]
    code: 200
    input: ["species?", "status?", "limit?", "offset?"]
    output: "Recipe[]"
    side_effects: []

  # ---- Pets --------------------------------------------------------------
  - method: POST
    path: "/api/pets"
    description: "Create a Pet under the acting account; daily_calorie_target and life_stage computed on create."
    roles: [PetParent]
    code: 201
    input: [account_id, name, species, sex, birth_date, initial_weight_kg, ideal_weight_kg, "activity_level?", "neutered?", "body_condition_goal?", "allergen_exclusions?"]
    output: Pet
    side_effects: ["current_weight_kg seeded from initial_weight_kg; daily_calorie_target + life_stage computed"]

  - method: GET
    path: "/api/pets/{petId}"
    description: "Read a pet, including computed daily_calorie_target, current_weight_kg, life_stage."
    roles: [PetParent, NutritionVet, BillingAdmin]
    code: 200
    input: []
    output: Pet
    side_effects: []

  - method: GET
    path: "/api/pets"
    description: "List pets; filter by account_id (reverse-reachability for Pet.account_id) and status."
    roles: [PetParent, NutritionVet, BillingAdmin]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "Pet[]"
    side_effects: []

  - method: PATCH
    path: "/api/pets/{petId}"
    description: "Update mutable pet profile fields; recomputes daily_calorie_target."
    roles: [PetParent]
    code: 200
    input: ["activity_level?", "neutered?", "body_condition_goal?", "ideal_weight_kg?", "allergen_exclusions?"]
    output: Pet
    side_effects: ["daily_calorie_target recomputed (does NOT auto-resize active subscriptions)"]

  - method: POST
    path: "/api/pets/{petId}/archive"
    description: "Archive a pet (terminal). Allowed only when the pet has no ACTIVE/PAUSED/PAST_DUE subscription."
    roles: [PetParent]
    code: 200
    input: []
    output: Pet
    side_effects: ["status ACTIVE -> ARCHIVED"]

  # ---- Weight logs (drive resize) ---------------------------------------
  - method: POST
    path: "/api/weight-logs"
    description: "Record a body-weight reading for a pet. The reading with the latest effective_date (tie-break created_at ASC) becomes APPLIED and supersedes others; recomputes current_weight_kg and daily_calorie_target (cascade)."
    roles: [PetParent]
    code: 201
    input: [pet_id, weight_kg, "effective_date?"]
    output: WeightLog
    side_effects:
      - "New WeightLog persisted; the single latest-effective_date log is APPLIED, all others SUPERSEDED"
      - "Pet.current_weight_kg recomputed from the APPLIED log; Pet.daily_calorie_target recomputed (cascade)"

  - method: GET
    path: "/api/weight-logs"
    description: "List weight logs; filter by pet_id (reverse-reachability for WeightLog.pet_id) and status."
    roles: [PetParent, NutritionVet, BillingAdmin]
    code: 200
    input: ["pet_id?", "status?", "limit?", "offset?"]
    output: "WeightLog[]"
    side_effects: []

  - method: GET
    path: "/api/weight-logs/{weightLogId}"
    description: "Read a single weight log."
    roles: [PetParent, NutritionVet, BillingAdmin]
    code: 200
    input: []
    output: WeightLog
    side_effects: []

  # ---- Subscriptions -----------------------------------------------------
  - method: POST
    path: "/api/subscriptions"
    description: "Create a Subscription in DRAFT for a pet + recipe + cadence. Allergen disjointness and cadence validated at create."
    roles: [PetParent]
    code: 201
    input: [account_id, pet_id, recipe_id, "cadence_days?"]
    output: Subscription
    side_effects: ["Subscription DRAFT; estimate pack_grams_per_day/cycle_price computed for quote"]

  - method: GET
    path: "/api/subscriptions/{subscriptionId}"
    description: "Read a subscription, including computed pack/price/next_order_date/version."
    roles: [PetParent, BillingAdmin, FulfillmentOps]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions; filter by account_id (reverse-reachability for Subscription.account_id), pet_id (for Subscription.pet_id), recipe_id (for Subscription.recipe_id), status."
    roles: [PetParent, BillingAdmin, FulfillmentOps]
    code: 200
    input: ["account_id?", "pet_id?", "recipe_id?", "status?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: POST
    path: "/api/subscriptions/{subscriptionId}/activate"
    description: "Activate a DRAFT subscription. Runs full referential + allergen + region gate; sets transition window and next_order_date."
    roles: [PetParent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["DRAFT -> ACTIVE; transition_remaining_cycles = 2; grams/price/next_order_date set; increments Subscription.version by 1"]

  - method: POST
    path: "/api/subscriptions/{subscriptionId}/pause"
    description: "Pause an ACTIVE subscription, optionally until resume_at."
    roles: [PetParent]
    code: 200
    input: ["resume_at?"]
    output: Subscription
    side_effects: ["ACTIVE -> PAUSED; pause_until set; increments Subscription.version by 1"]

  - method: POST
    path: "/api/subscriptions/{subscriptionId}/resume"
    description: "Resume a PAUSED subscription immediately."
    roles: [PetParent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["PAUSED -> ACTIVE; pause_until cleared; next_order_date = max(next_order_date, clock); increments Subscription.version by 1"]

  - method: POST
    path: "/api/subscriptions/{subscriptionId}/swap-recipe"
    description: "Swap the subscription's recipe (re-runs referential + allergen + region gate, recomputes grams/price)."
    roles: [PetParent]
    code: 200
    input: [recipe_id]
    output: Subscription
    side_effects: ["recipe_id changed; pack/price recomputed; increments Subscription.version by 1"]

  - method: POST
    path: "/api/subscriptions/{subscriptionId}/resize"
    description: "Stage a plan resize. Recomputes pack_grams_per_day from the pet's CURRENT daily_calorie_target and stages it to take effect at effective_at (defaults to clock = immediate). OCC-guarded on subscription version."
    roles: [PetParent]
    code: 200
    input: [expected_subscription_version, "effective_at?"]
    output: Subscription
    side_effects:
      - "pending_resize_grams_per_day = recomputed grams; resize_effective_at = effective_at (>= clock)"
      - "If effective_at <= clock: realized immediately into pack_grams_per_day/pack_total_grams/cycle_price_cents"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/api/subscriptions/{subscriptionId}/cancel"
    description: "Cancel a subscription; cascades SCHEDULED orders to SKIPPED and REVOKES the account's PENDING SIGNUP referral credits if it never had a PAID order."
    roles: [PetParent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> CANCELLED; SCHEDULED orders -> SKIPPED; pending resize cleared; PENDING SIGNUP referral credits of the owning account REVOKED if no PAID order exists; increments Subscription.version by 1"]

  # ---- Orders ------------------------------------------------------------
  - method: POST
    path: "/api/subscriptions/{subscriptionId}/orders"
    description: "Generate the next cycle Order for a subscription due on/after next_order_date. OCC-guarded on subscription version. Realizes any due staged resize and any due pause-resume before snapshotting grams/price."
    roles: [BillingAdmin, FulfillmentOps]
    code: 201
    input: [expected_subscription_version]
    output: Order
    side_effects:
      - "If PAUSED and clock >= pause_until: subscription auto-resumes to ACTIVE first"
      - "Realizes due resize (resize_effective_at <= clock) into pack fields first"
      - "Order created SCHEDULED with cycle_index, scheduled_ship_date=next_order_date, food_grams, is_transition_cycle, food_subtotal_cents snapshotted"
      - "increments Subscription.version by 1"

  - method: GET
    path: "/api/orders/{orderId}"
    description: "Read an order with computed billing fields."
    roles: [PetParent, BillingAdmin, FulfillmentOps]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/api/orders"
    description: "List orders; filter by subscription_id (reverse-reachability for Order.subscription_id), account_id (for Order.account_id), status."
    roles: [PetParent, BillingAdmin, FulfillmentOps]
    code: 200
    input: ["subscription_id?", "account_id?", "status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/api/orders/{orderId}/skip"
    description: "Skip a SCHEDULED order before its ship date; advances next_order_date without charging."
    roles: [PetParent]
    code: 200
    input: []
    output: Order
    side_effects: ["SCHEDULED -> SKIPPED; subscription next_order_date += cadence_days; increments Subscription.version by 1"]

  - method: POST
    path: "/api/orders/{orderId}/charge"
    description: "Begin charging a SCHEDULED order (on/after ship date). Finalizes shipping + credit + total via order_charge_settlement."
    roles: [BillingAdmin, FulfillmentOps]
    code: 200
    input: []
    output: Order
    side_effects: ["SCHEDULED -> CHARGING; shipping/credit/total finalized"]

  - method: POST
    path: "/api/orders/{orderId}/settle-charge"
    description: "Settle a CHARGING order with a gateway outcome (SUCCEEDED or DECLINED)."
    roles: [BillingAdmin, FulfillmentOps]
    code: 200
    input: [outcome]
    output: Order
    side_effects:
      - "outcome=SUCCEEDED: CHARGING -> PAID; wallet credit consumed; Shipment PENDING created; PAST_DUE->ACTIVE recovery; SIGNUP referral GRANT on first paid order; next_order_date += cadence; transition cycles decremented"
      - "outcome=DECLINED: CHARGING -> FAILED; consecutive_failed_charges++; ACTIVE->PAST_DUE; at MAX_FAILED_CHARGES PAST_DUE->CANCELLED cascade"

  - method: POST
    path: "/api/orders/{orderId}/retry-charge"
    description: "Retry a FAILED order (only while subscription PAST_DUE). Re-finalizes settlement, moves to CHARGING."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["FAILED -> CHARGING; shipping/credit/total re-finalized"]

  # ---- Shipments ---------------------------------------------------------
  - method: GET
    path: "/api/shipments"
    description: "List shipments; filter by order_id (reverse-reachability for Shipment.order_id) and status."
    roles: [PetParent, FulfillmentOps, BillingAdmin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/api/shipments/{shipmentId}"
    description: "Read a shipment with computed coolant_packs."
    roles: [PetParent, FulfillmentOps, BillingAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: PATCH
    path: "/api/shipments/{shipmentId}"
    description: "Update transit_days on a PENDING shipment; recomputes coolant_packs."
    roles: [FulfillmentOps]
    code: 200
    input: [transit_days]
    output: Shipment
    side_effects: ["transit_days updated; coolant_packs recomputed"]

  - method: POST
    path: "/api/shipments/{shipmentId}/dispatch"
    description: "Dispatch a PENDING shipment (requires sufficient coolant_packs and PAID order)."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["PENDING -> DISPATCHED; dispatched_at set to clock"]

  - method: POST
    path: "/api/shipments/{shipmentId}/deliver"
    description: "Mark a DISPATCHED shipment DELIVERED, or SPOILED if delivered past the transit window (make-good credit issued on spoilage)."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "If elapsed_days <= transit_days: DISPATCHED -> DELIVERED"
      - "If elapsed_days > transit_days: DISPATCHED -> SPOILED; make-good MAKE_GOOD ReferralCredit GRANTED for credit_applied_cents + total_charged_cents to the owning account (compensation)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- Auth / request ----
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation, or entity_backed PetParent is not the owner of the target account" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or type mismatch" }

  # ---- Not found ----
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "accountId / account_id does not resolve" }
  - { id: ERR_PET_NOT_FOUND, http: 404, condition: "petId / pet_id does not resolve" }
  - { id: ERR_RECIPE_NOT_FOUND, http: 404, condition: "recipeId / recipe_id does not resolve" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscriptionId / subscription_id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId does not resolve" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipmentId does not resolve" }
  - { id: ERR_REFERRAL_CREDIT_NOT_FOUND, http: 404, condition: "referralCreditId does not resolve" }

  # ---- Subscription state ----
  - { id: ERR_SUBSCRIPTION_NOT_DRAFT, http: 409, condition: "Activate requires DRAFT" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Operation requires ACTIVE (pause; skip cross-entity guard)" }
  - { id: ERR_SUBSCRIPTION_NOT_PAUSED, http: 409, condition: "Resume requires PAUSED" }
  - { id: ERR_SUBSCRIPTION_NOT_PAST_DUE, http: 409, condition: "Retry-charge requires the subscription PAST_DUE" }
  - { id: ERR_SUBSCRIPTION_NOT_CHARGEABLE, http: 409, condition: "Charge requires subscription ACTIVE or PAST_DUE; PAUSED/DRAFT/CANCELLED cannot charge" }
  - { id: ERR_SUBSCRIPTION_ALREADY_CANCELLED, http: 409, condition: "Cancel/operate on a CANCELLED subscription" }
  - { id: ERR_PET_ARCHIVED, http: 409, condition: "Activating a subscription whose pet is ARCHIVED" }

  # ---- Order / shipment state ----
  - { id: ERR_ORDER_NOT_SCHEDULED, http: 409, condition: "Skip/charge requires a SCHEDULED order" }
  - { id: ERR_ORDER_NOT_CHARGING, http: 409, condition: "Settle requires a CHARGING order" }
  - { id: ERR_ORDER_NOT_FAILED, http: 409, condition: "Retry requires a FAILED order" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "Dispatch requires the parent order PAID" }
  - { id: ERR_ORDER_IN_FLIGHT, http: 409, condition: "Pause/cancel blocked because an order for this subscription is CHARGING" }
  - { id: ERR_CHARGE_BEFORE_SHIP_DATE, http: 422, condition: "Charge attempted before the order's scheduled_ship_date" }
  - { id: ERR_SHIPMENT_NOT_PENDING, http: 409, condition: "Dispatch requires a PENDING shipment" }
  - { id: ERR_SHIPMENT_NOT_DISPATCHED, http: 409, condition: "Deliver requires a DISPATCHED shipment" }
  - { id: ERR_SHIPMENT_SPOILED, http: 409, condition: "Shipment already SPOILED; no further transition" }

  # ---- Referential / safety ----
  - { id: ERR_RECIPE_NOT_DRAFT, http: 409, condition: "Publish requires the recipe in DRAFT" }
  - { id: ERR_RECIPE_NOT_PUBLISHED, http: 409, condition: "Selected recipe is not PUBLISHED (selection gate, or retire requires PUBLISHED)" }
  - { id: ERR_RECIPE_SPECIES_MISMATCH, http: 409, condition: "Recipe.species != Pet.species" }
  - { id: ERR_RECIPE_REGION_UNAVAILABLE, http: 409, condition: "Account.country_code not in Recipe.availability_regions" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 422, condition: "Recipe.ingredient_allergens intersects Pet.allergen_exclusions" }

  # ---- Temporal / constraint ----
  - { id: ERR_SKIP_WINDOW_CLOSED, http: 422, condition: "Skip attempted on/after scheduled_ship_date" }
  - { id: ERR_WEIGHTLOG_FUTURE_DATED, http: 422, condition: "WeightLog.effective_date is after the current clock" }
  - { id: ERR_RESIZE_EFFECTIVE_IN_PAST, http: 422, condition: "resize effective_at is before the current clock" }
  - { id: ERR_INVALID_CADENCE, http: 422, condition: "cadence_days not in {14,21,28}" }
  - { id: ERR_INVALID_TRANSIT_DAYS, http: 422, condition: "transit_days not in 1..5" }
  - { id: ERR_INSUFFICIENT_COOLANT, http: 422, condition: "Stored coolant_packs below required for transit_days at dispatch" }
  - { id: ERR_PET_HAS_ACTIVE_SUBSCRIPTION, http: 409, condition: "Archive blocked: pet has an ACTIVE/PAUSED/PAST_DUE subscription" }

  # ---- OCC / fiscal ----
  - { id: ERR_STALE_SUBSCRIPTION_VERSION, http: 412, condition: "expected_subscription_version != current Subscription.version" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "Register with an email already in use" }
  - { id: ERR_REFERRAL_CODE_INVALID, http: 409, condition: "referral_code does not resolve to an ACTIVE account" }
  - { id: ERR_SELF_REFERRAL, http: 409, condition: "referral_code resolves to the registering account itself" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PetParent
    description: "Account holder; owns their account, pets, subscriptions, orders (read), weight logs, referral credits."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /api/pets — create pet"
      - "PATCH /api/pets/{petId} — update pet"
      - "POST /api/pets/{petId}/archive — archive pet"
      - "POST /api/weight-logs — record weight"
      - "POST /api/subscriptions — create subscription"
      - "POST /api/subscriptions/{id}/activate — activate"
      - "POST /api/subscriptions/{id}/pause — pause"
      - "POST /api/subscriptions/{id}/resume — resume"
      - "POST /api/subscriptions/{id}/swap-recipe — swap recipe"
      - "POST /api/subscriptions/{id}/resize — resize plan"
      - "POST /api/subscriptions/{id}/cancel — cancel"
      - "POST /api/orders/{id}/skip — skip an order"
    shared_operations:
      - "GET reads of own account, pets, weight-logs, subscriptions, orders, shipments, recipes, referral-credits"
      - "POST /_clock/set_current_utc, GET /_clock"

  - name: NutritionVet
    description: "Curates and certifies recipes; reads pets/weight-logs for formulation review."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/recipes — create recipe"
      - "POST /api/recipes/{id}/publish — publish"
      - "POST /api/recipes/{id}/retire — retire"
    shared_operations:
      - "GET recipes, pets, weight-logs, subscriptions"
      - "POST /_clock/set_current_utc, GET /_clock"

  - name: BillingAdmin
    description: "Runs billing: order generation, charge, settle, retry; reads all accounts/orders/referral-credits."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/orders/{id}/retry-charge — retry failed charge"
      - "GET /api/accounts — list accounts"
    shared_operations:
      - "POST /api/subscriptions/{id}/orders — generate next order (shared with FulfillmentOps)"
      - "POST /api/orders/{id}/charge, POST /api/orders/{id}/settle-charge (shared with FulfillmentOps)"
      - "GET accounts, orders, subscriptions, shipments, recipes, pets, weight-logs, referral-credits"
      - "POST /_clock/set_current_utc, GET /_clock"

  - name: FulfillmentOps
    description: "Runs shipping: order generation, charge, settle, shipment dispatch/deliver, clock advance."
    identity: "opaque"
    exclusive_operations:
      - "PATCH /api/shipments/{id} — update transit_days"
      - "POST /api/shipments/{id}/dispatch — dispatch shipment"
      - "POST /api/shipments/{id}/deliver — deliver shipment"
    shared_operations:
      - "POST /api/subscriptions/{id}/orders — generate next order (shared with BillingAdmin)"
      - "POST /api/orders/{id}/charge, POST /api/orders/{id}/settle-charge (shared with BillingAdmin)"
      - "GET subscriptions, orders, shipments"
      - "POST /_clock/set_current_utc, GET /_clock"

  - name: Anonymous
    description: "Unauthenticated; registers accounts, previews referrals, reads the clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/accounts/register — register account"
      - "POST /api/referrals/redeem-preview — preview referral credit"
    shared_operations:
      - "GET /_clock"
