              as: AlumniRelationsStaff
              captures: { chair9_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Reunion 25", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { evb_id: $.data.id, evb_v: $.data.version }
            - call: "POST /alumni/events/${evb_id}/committee"
              payload: { name: "Committee" }
              as: AlumniRelationsStaff
              captures: { comb_id: $.data.id }
            - call: "POST /alumni/committees/${comb_id}/memberships"
              payload: { alumni_id: "${chair9_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem9_id: $.data.id }
            - call: "POST /alumni/memberships/${mem9_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair9_id}"
            - call: "POST /alumni/events/${evb_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${evb_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 1000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${evb_v}" }
              as: AlumniRelationsStaff
