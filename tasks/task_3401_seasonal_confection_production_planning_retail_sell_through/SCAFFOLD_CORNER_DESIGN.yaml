            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 10, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
