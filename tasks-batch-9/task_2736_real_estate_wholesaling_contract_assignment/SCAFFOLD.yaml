      - "live AssignmentOffers become LAPSED"
      - "PENDING_SETTLEMENT AssignmentAgreements become TERMINATED_UPSTREAM"
      - "affected CashBuyer committed capital and tier recomputed"
      - "EarnestMoneyDeposit moves from HELD to REFUNDED_TO_WHOLESALER"
      - "live TitleOrders become CANCELLED and release their funding windows"
