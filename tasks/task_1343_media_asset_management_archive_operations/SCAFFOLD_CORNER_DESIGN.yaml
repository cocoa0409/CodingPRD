              as_user_id: "lc-3"
            - call: "GET /archive/migration-jobs?asset_id=${asset_id}"
              as: ArchivistLead
              captures: { j_mid: "$.data[0].status" }
            - call: "POST /archive/legal-holds/${h2}/release"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-4"
            - call: "GET /archive/migration-jobs?asset_id=${asset_id}"
              as: ArchivistLead
              captures: { j_end: "$.data[0].status" }
          assert:
            - "After releasing H1 (H2 still ACTIVE): job status still HOLD_PAUSED, asset hold_status still HELD"
            - "After releasing H2 (last hold): job status == QUEUED, asset hold_status == CLEAR"

      - name: qc_rework_cap_forces_terminal_qc_failed
        claim_type: invalid_transition
        grounds:
          - "state_machines.DigitizationTicket.QC_REVIEW_to_QC_FAILED"
        distinguishing_aspect: "QC rework cap: qc-fail at rework_count 0 and 1 loops to QUEUED; the third qc-fail (rework_count == 2 == MAX_QC_REWORKS) sends the ticket to terminal QC_FAILED instead of QUEUED."
        test_recipe:
          setup: ["BETACAM_SP asset; workstation; ticket driven DIGITIZING → QC_REVIEW three times"]
          setup_api_calls:
            - call: "POST /archive/workstations"
              payload: { name: "WS-1", supported_formats: ["BETACAM_SP"] }
              as: SystemAdmin
              captures: { ws: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "VAULT" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "BETACAM_SP", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/digitization-tickets"
              payload: { asset_id: "${asset_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", output_format: "PRORES_FILE" }
              as: ArchivistLead
              captures: { t: $.data.id }
            - call: "POST /archive/digitization-tickets/${t}/assign"
              payload: { workstation_id: "${ws}" }
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/submit-qc"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/qc-fail"
              payload: { qc_notes: "bad audio" }
              as: LabTechnician
              captures: { s1: $.data.status, rw1: $.data.rework_count }
            - call: "POST /archive/digitization-tickets/${t}/assign"
              payload: { workstation_id: "${ws}" }
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/submit-qc"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/qc-fail"
              payload: { qc_notes: "bad video" }
              as: LabTechnician
              captures: { s2: $.data.status, rw2: $.data.rework_count }
            - call: "POST /archive/digitization-tickets/${t}/assign"
              payload: { workstation_id: "${ws}" }
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t}/submit-qc"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /archive/digitization-tickets/${t}/qc-fail"
              payload: { qc_notes: "still bad" }
              as: LabTechnician
              captures: { s3: $.data.status, rw3: $.data.rework_count }
          assert:
            - "First two qc-fails: status QUEUED with rework_count 1 then 2 (rework loop)"
            - "Third qc-fail at rework_count == 2: status == QC_FAILED (terminal), workstation_id null"

      - name: workstation_maintenance_blocked_while_busy
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Workstation.ACTIVE_to_MAINTENANCE"
          - "errors[ERR_WORKSTATION_BUSY]"
        distinguishing_aspect: "PATCH to MAINTENANCE while a ticket is ASSIGNED on the workstation → ERR_WORKSTATION_BUSY 409; after the ticket is cancelled the same PATCH succeeds."
        test_recipe:
          setup: ["Workstation with one ASSIGNED ticket"]
          setup_api_calls:
            - call: "POST /archive/workstations"
              payload: { name: "WS-1", supported_formats: ["BETACAM_SP"] }
              as: SystemAdmin
              captures: { ws: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "VAULT" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "BETACAM_SP", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/digitization-tickets"
              payload: { asset_id: "${asset_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", output_format: "PRORES_FILE" }
              as: ArchivistLead
              captures: { t: $.data.id }
            - call: "POST /archive/digitization-tickets/${t}/assign"
              payload: { workstation_id: "${ws}" }
              as: LabTechnician
          trigger:
            - call: "PATCH /archive/workstations/${ws}"
              payload: { status: "MAINTENANCE" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
            - call: "POST /archive/digitization-tickets/${t}/cancel"
              payload: {}
              as: ArchivistLead
            - call: "PATCH /archive/workstations/${ws}"
              payload: { status: "MAINTENANCE" }
              as: SystemAdmin
              captures: { st: $.data.status }
          assert:
            - "While ASSIGNED: error_id == ERR_WORKSTATION_BUSY, http 409"
            - "After ticket cancel: status == MAINTENANCE"

      - name: clock_default_is_fixed_epoch
        claim_type: scheduled_actions
        grounds:
          - "endpoints.\"POST /archive/_clock/set_current_utc\""
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z (never wall-clock): a grant with window_start 2026-01-01 is already effective at first read."
        test_recipe:
          setup: ["empty DB; no clock call issued"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id, created: $.data.created_at }
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
          trigger:
            - call: "GET /archive/assets/${asset_id}"
              as: ArchivistLead
              captures: { posture: $.data.rights_posture }
          assert:
            - "Asset.${asset_id}.created_at == 2026-08-01T00:00:00Z (default logical clock, not wall-clock)"
            - "rights_posture == CLEARED (window_start 2026-01-01 <= default clock < 2027-01-01)"

      - name: migration_supersede_marks_old_job
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.MigrationJob.QUEUED_to_SUPERSEDED"
        excluded_because:
          difficulty_instance: compensating_invariant / migration_supersede_cancel_conserves_tier_and_queue
          rationale: "Supersede cascade asserted in the named §1.8 instance."

