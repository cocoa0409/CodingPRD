              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall_id: $.data.id }
            - call: "POST /api/stalls/${stall_id}/ocpp-status"
              payload: { reported_status: "FAULTED" }
              as: StationController
          trigger:
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_id}", driver_id: "${drv_id}", is_roaming: false }
              as: Driver
              as_user_id: "${drv_id}"
