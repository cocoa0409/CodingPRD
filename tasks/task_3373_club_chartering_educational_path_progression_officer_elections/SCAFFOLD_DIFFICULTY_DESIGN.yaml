  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_quorum_check_on_second_close
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - state_machines.MeetingEvent.SCHEDULED_to_HELD
          - errors[ERR_INVALID_STATE]
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: |
          The conflict pairs the state category (priority 6, ERR_INVALID_STATE) against the
          business_constraint category (priority 13, ERR_QUORUM_NOT_MET): closing an already HELD
          meeting with attendance_count 3 violates both rules and must return ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Club Riverside Voices is ORGANIZING; Ada is ACTIVE and is a ClubOfficer for the club"
            - "One meeting is scheduled and closed as HELD with attendance_count 6"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-05T18:30:00Z", organizing_meeting_attendees: 9 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
            - call: "POST /toastmasters/memberships/${ms_ada_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_ada_id}"
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_id: "$.data.id" }
            - call: "POST /toastmasters/meetings/${mtg_id}/close"
