      - name: sending_an_order_form_as_a_non_owner_rep_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NOT_QUOTE_OWNER
          - validations.P7_resource_ownership
          - state_machines.OrderForm.GENERATED_to_OUT_FOR_SIGNATURE
        distinguishing_aspect: |
          Ownership is per user, not per role: a second SalesRep u-rep-2 holds the endpoint role yet
          cannot send u-rep-1's order form — the call fails with ERR_NOT_QUOTE_OWNER (403), the form
          stays GENERATED with sent_at null, and the owner's identical call then succeeds.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One quote owned by u-rep-1 with a single Premium Support line of quantity 10 at requested_discount_pct 0 (required_approval_level 0), submitted and auto-approved."
            - "One OrderForm generated from it, status GENERATED."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Owner Only", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id, q_owner: $.data.owner_rep_user_id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_status: $.data.status, q_v: $.data.version }
            - call: "POST /order-forms"
              payload: { quote_id: "${q_id}", signer_name: "Dana Reeves", signer_email: "dana.reeves@northwind.example", expected_quote_version: "${q_v}" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { of_id: $.data.id, of_status: $.data.status, of_sent: $.data.sent_at }
          trigger:
            - call: "POST /order-forms/${of_id}/send"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-2"
              captures: { err_id: $.data.error_id }
            - call: "GET /order-forms/${of_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { of_mid_status: $.data.status, of_mid_sent: $.data.sent_at }
            - call: "POST /order-forms/${of_id}/send"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { of_final_status: $.data.status, of_final_sent: $.data.sent_at }
          assert:
            - "${q_owner} == u-rep-1"
            - "${q_status} == APPROVED"
            - "${of_status} == GENERATED"
            - "${of_sent} == null"
            - "${err_id} == ERR_NOT_QUOTE_OWNER"
            - "HTTP status == 403"
            - "${of_mid_status} == GENERATED"
            - "${of_mid_sent} == null"
            - "${of_final_status} == OUT_FOR_SIGNATURE"
            - "${of_final_sent} == 2026-08-01T00:00:00.000Z"

      - name: revoking_another_directors_delegation_grant_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NOT_GRANT_GRANTOR
          - validations.P7_resource_ownership
          - state_machines.DelegationGrant.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Revocation is reserved to the grantor: u-dir-2 shares the SalesDirector role but is not
          grant.grantor_user_id, so the revoke fails with ERR_NOT_GRANT_GRANTOR (403) and the grant stays
          ACTIVE with revoked_at null until u-dir-1 revokes it.
        test_recipe:
          setup:
            - "The base configuration from the anchored chain."
            - "One DelegationGrant created by the sales director u-dir-1 to u-appr-a at tier_level 2 over [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z), status ACTIVE."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /delegation-grants"
              payload: { grantee_user_id: "u-appr-a", tier_level: 2, max_discount_pct: 0.20, starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z" }
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { g_id: $.data.id, g_grantor: $.data.grantor_user_id, g_status: $.data.status }
          trigger:
            - call: "POST /delegation-grants/${g_id}/revoke"
              payload: {}
              as: SalesDirector
              as_user_id: "u-dir-2"
              captures: { err_id: $.data.error_id }
            - call: "GET /delegation-grants"
              payload: { status: "ACTIVE" }
              as: SalesDirector
              as_user_id: "u-dir-2"
              captures: { active_count: $.total_count, active_id: "$.data[0].id" }
            - call: "POST /delegation-grants/${g_id}/revoke"
              payload: {}
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { g_final_status: $.data.status, g_revoked_at: $.data.revoked_at }
          assert:
            - "${g_grantor} == u-dir-1"
            - "${g_status} == ACTIVE"
            - "${err_id} == ERR_NOT_GRANT_GRANTOR"
            - "HTTP status == 403"
            - "${active_count} == 1"
            - "${active_id} == ${g_id}"
            - "${g_final_status} == REVOKED"
            - "${g_revoked_at} == 2026-08-01T00:00:00.000Z"

      - name: line_write_on_a_non_draft_quote_returns_quote_not_draft
        claim_type: violation_to_error
        grounds:
          - errors.ERR_QUOTE_NOT_DRAFT
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / resubmit_conflict_state_error_wins_over_margin_floor_breach
          rationale: "That instance triggers ERR_QUOTE_NOT_DRAFT from a line write against a PENDING_APPROVAL quote as the winning priority-8 error."
      - name: segregation_of_duties_and_delegation_scope_errors_are_triggerable
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_DELEGATION_SCOPE_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / step_decide_conflict_segregation_of_duties_wins_over_delegation_scope
          rationale: "That instance triggers ERR_SEGREGATION_OF_DUTIES with both violations present and then ERR_DELEGATION_SCOPE_EXCEEDED once the actor is changed."
      - name: booking_an_order_form_for_an_account_on_credit_hold_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ACCOUNT_CREDIT_HOLD
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_blocked_by_account_credit_hold_then_allowed_after_release
          rationale: "That instance triggers ERR_ACCOUNT_CREDIT_HOLD on POST /order-forms/{id}/book and then books successfully after the hold is cleared."
      - name: deciding_under_an_inactive_delegation_grant_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DELEGATION_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / step_decision_under_delegation_grant_at_exact_window_end_is_not_active
          rationale: "That instance triggers ERR_DELEGATION_NOT_ACTIVE at the exact ends_at instant and succeeds one second earlier."
      - name: overlapping_delegation_windows_are_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DELEGATION_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / delegation_grant_windows_overlap_rejected_adjacent_and_other_grantor_allowed
          rationale: "That instance triggers ERR_DELEGATION_WINDOW_OVERLAP and proves the adjacent and other-grantor cases are allowed."
      - name: price_hold_windows_inside_the_cooldown_are_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PRICE_HOLD_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / price_hold_windows_need_the_cooldown_gap_per_account_and_product
          rationale: "That instance triggers ERR_PRICE_HOLD_WINDOW_CONFLICT at cooldown day 30 and passes at day 31."

  # =========================================================================
  # Guide section 7 — From Table 7 (RBAC), role_model delegated_authority
  # =========================================================================
  - section: rbac
    instances:
      - name: sales_rep_cannot_activate_a_desk_policy
        claim_type: role_denied
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - endpoints.POST_/desk-policies/{id}/activate
          - validations.P2_role_authorisation
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Policy activation is exclusive to PlatformAdmin: the same call that succeeds for the admin
          returns ERR_FORBIDDEN_ROLE (403) for a SalesRep, and the target policy is left in DRAFT with
          activated_at null so no quote could pin it.
        test_recipe:
          setup:
            - "The base configuration from the anchored chain, whose FY26 policy is already ACTIVE."
            - "A second policy 'FY27 Rep Attempt' in DRAFT with no approval tiers."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /desk-policies"
              payload: { name: "FY27 Rep Attempt", margin_floor_pct: 0.35, absolute_margin_floor_pct: 0.22, quote_validity_days: 30, standard_payment_terms_days: 30, uplift_rate_per_30_days: 0.015, max_stack_discount_pct: 0.45, volume_rebate_tier1_min_cents: 5000000, volume_rebate_tier1_pct: 0.02, volume_rebate_tier2_min_cents: 25000000, volume_rebate_tier2_pct: 0.04, surge_window_days: 10, surge_sla_multiplier: 0.5, price_hold_cooldown_days: 30, exception_allowance_cents: 4000000, terms_review_risk_threshold: 30.0, terms_cfo_risk_threshold: 35.0 }
              as: PlatformAdmin
              captures: { pol3_id: $.data.id, pol3_status: $.data.status }
          trigger:
            - call: "POST /desk-policies/${pol3_id}/activate"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /desk-policies/${pol3_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pol3_after: $.data.status, pol3_activated: $.data.activated_at }
          assert:
            - "${pol3_status} == DRAFT"
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"
            - "${pol3_after} == DRAFT"
            - "${pol3_activated} == null"
            - "DeskPolicy.${pol_id}.status == ACTIVE"

      - name: legal_counsel_cannot_decide_an_approval_step
        claim_type: role_denied
        grounds:
          - roles.LegalCounsel.exclusive_operations
          - endpoints.POST_/approval-steps/{id}/decide
          - validations.P2_role_authorisation
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          LegalCounsel owns non-standard-term review and nothing on the discount chain: deciding an
          ApprovalStep returns ERR_FORBIDDEN_ROLE (403) at priority 2, before any approver-role or
          segregation-of-duties reasoning, and the step stays PENDING with acting_user_id null.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One quote with a single Premium Support line of quantity 10 at requested_discount_pct 0.20 — final_blended_discount_pct 0.200000 and required_approval_level 2 — submitted, so a PENDING level-1 step assigned DealDeskAnalyst exists."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Legal Overreach", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.20 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_status: $.data.status, q_level: $.data.required_approval_level }
            - call: "GET /approval-steps"
              payload: { decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step1_id: "$.data[0].id", step1_role: "$.data[0].assigned_role" }
          trigger:
            - call: "POST /approval-steps/${step1_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Legal signing off on pricing" }
              as: LegalCounsel
              as_user_id: "u-legal-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /approval-steps/${step1_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { step1_decision: $.data.decision, step1_actor: $.data.acting_user_id }
          assert:
            - "${q_status} == PENDING_APPROVAL"
            - "${q_level} == 2"
            - "${step1_role} == DealDeskAnalyst"
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"
            - "${step1_decision} == PENDING"
            - "${step1_actor} == null"

      - name: analyst_cannot_decide_a_director_level_step_without_a_delegation_grant
        claim_type: approval_chain
        grounds:
          - roles.DealDeskAnalyst.shared_operations
          - state_machines.ApprovalStep.PENDING_to_APPROVED
          - errors.ERR_APPROVER_ROLE_MISMATCH
          - entities.ApprovalStep.fields.assigned_role
        distinguishing_aspect: |
          Holding the endpoint role is not the same as being the assigned approver: u-desk-1 legitimately
          decides the level-1 step but the level-2 step it creates is assigned SalesDirector, so the same
          analyst is refused with ERR_APPROVER_ROLE_MISMATCH (403) and only the real director can clear
          it — no DelegationGrant exists to widen the analyst's authority.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; tier 2 requires SalesDirector."
            - "One quote with a single Premium Support line of quantity 10 at requested_discount_pct 0.20 (final_blended_discount_pct 0.200000, required_approval_level 2), submitted."
            - "The level-1 step already approved by u-desk-1, which created the PENDING level-2 step assigned SalesDirector."
            - "No DelegationGrant exists."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Chain Discipline", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.20 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_status: $.data.status, q_blended: $.data.final_blended_discount_pct }
            - call: "GET /approval-steps"
              payload: { decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step1_id: "$.data[0].id", req_id: "$.data[0].approval_request_id" }
            - call: "POST /approval-steps/${step1_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Desk review complete" }
              as: DealDeskAnalyst
              as_user_id: "u-desk-1"
              captures: { step1_decision: $.data.decision }
            - call: "GET /approval-steps"
              payload: { approval_request_id: "${req_id}", decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step2_id: "$.data[0].id", step2_level: "$.data[0].level", step2_role: "$.data[0].assigned_role" }
          trigger:
            - call: "POST /approval-steps/${step2_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Analyst self-escalating" }
              as: DealDeskAnalyst
              as_user_id: "u-desk-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /approval-steps/${step2_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Director approves" }
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { step2_decision: $.data.decision, step2_grant: $.data.delegation_grant_id, step2_actor: $.data.acting_user_id }
          assert:
            - "${q_status} == PENDING_APPROVAL"
            - "${q_blended} == 0.200000"
            - "${step1_decision} == APPROVED"
            - "${step2_level} == 2"
            - "${step2_role} == SalesDirector"
            - "${err_id} == ERR_APPROVER_ROLE_MISMATCH"
            - "HTTP status == 403"
            - "${step2_decision} == APPROVED"
            - "${step2_grant} == null"
            - "${step2_actor} == u-dir-1"
            - "Quote.${q_id}.status == APPROVED"
            - "ApprovalRequest.${req_id}.status == APPROVED"

      - name: quote_owner_cannot_decide_its_own_approval_step
        claim_type: segregation_of_duties
        grounds:
          - validations.P10_segregation_of_duties
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / step_decide_conflict_segregation_of_duties_wins_over_delegation_scope
          rationale: "That instance has the quote owner act on its own step and asserts ERR_SEGREGATION_OF_DUTIES ahead of the delegation-scope error."
      - name: delegatee_can_decide_a_step_inside_the_grant_window
        claim_type: delegated_authority
        grounds:
          - state_machines.ApprovalStep.PENDING_to_APPROVED
          - entities.ApprovalStep.fields.delegation_grant_id
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / step_decision_under_delegation_grant_at_exact_window_end_is_not_active
          rationale: "That instance has the delegatee decide successfully one second before ends_at, asserting delegation_grant_id and used_step_count, and fail at the boundary."

  # =========================================================================
  # Guide section 8 — From Cross-Cutting Complexity Layers
  # complexity_layers: optimistic_concurrency, cascading_side_effects,
  #                    dual_variant_calculation, rate_threshold_triggers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: renegotiate_with_a_stale_expected_quote_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.occ-renegotiate-stale-quote
          - endpoints.POST_/quotes/{id}/renegotiate
          - errors.ERR_STALE_QUOTE_VERSION
          - entities.Quote.fields.renegotiated_from_quote_id
        distinguishing_aspect: |
          The renegotiate clone is guarded by OCC on the source Quote.version: replaying the version the
          client saw at creation — already superseded by the line write — returns ERR_STALE_QUOTE_VERSION
          (412) and creates no clone, while the refreshed version produces a DRAFT clone carrying
          renegotiated_from_quote_id and bumps the source's renegotiation_count to 1.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One DRAFT quote created by u-rep-1 (its POST response version is the client's first read) with a single Core Platform line of quantity 10 at requested_discount_pct 0.10 added afterwards, which advances Quote.version."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Round One", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id, q_v0: $.data.version }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 10, requested_discount_pct: 0.10 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { q_v1: $.data.version, q_reneg_count: $.data.renegotiation_count }
          trigger:
            - call: "POST /quotes/${q_id}/renegotiate"
              payload: { expected_quote_version: "${q_v0}", term_months: 24 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /quotes"
              payload: { renegotiated_from_quote_id: "${q_id}" }
              as: DealDeskAnalyst
              captures: { clone_count_before: $.total_count }
            - call: "POST /quotes/${q_id}/renegotiate"
              payload: { expected_quote_version: "${q_v1}", term_months: 24 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { clone_id: $.data.id, clone_status: $.data.status, clone_source: $.data.renegotiated_from_quote_id, clone_term: $.data.term_months, clone_expires: $.data.expires_at }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { q_reneg_after: $.data.renegotiation_count, q_status_after: $.data.status }
            - call: "GET /quotes/${clone_id}/lines"
              payload: {}
              as: DealDeskAnalyst
              captures: { clone_line_count: $.total_count }
          assert:
            - "${q_reneg_count} == 0"
            - "${err_id} == ERR_STALE_QUOTE_VERSION"
            - "HTTP status == 412"
            - "${clone_count_before} == 0"
            - "${clone_status} == DRAFT"
            - "${clone_source} == ${q_id}"
            - "${clone_term} == 24"
            - "${clone_expires} == 2026-08-31T00:00:00.000Z"
            - "${clone_line_count} == 1"
            - "${q_reneg_after} == 1"
            - "${q_status_after} == DRAFT"

      - name: order_form_generation_with_a_stale_expected_quote_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.occ-order-form-supersede
          - endpoints.POST_/order-forms
          - errors.ERR_STALE_QUOTE_VERSION
        distinguishing_aspect: |
          Generation is self-invalidating under OCC: because the first POST /order-forms bumps
          Quote.version itself, replaying the very same expected_quote_version returns
          ERR_STALE_QUOTE_VERSION (412) and leaves the first form GENERATED with void_reason null — only
          after re-reading the quote does a second generate succeed and supersede it.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One quote with a single Premium Support line of quantity 10 at requested_discount_pct 0 (required_approval_level 0), submitted and auto-approved; the submit response version is the client's read."
            - "One OrderForm generated with that version, which advances Quote.version by one."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Papering", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_status: $.data.status, q_v1: $.data.version }
            - call: "POST /order-forms"
              payload: { quote_id: "${q_id}", signer_name: "Dana Reeves", signer_email: "dana.reeves@northwind.example", expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { of1_id: $.data.id, of1_status: $.data.status }
          trigger:
            - call: "POST /order-forms"
              payload: { quote_id: "${q_id}", signer_name: "Dana Reeves", signer_email: "dana.reeves@northwind.example", expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /order-forms/${of1_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { of1_mid_status: $.data.status, of1_mid_void: $.data.void_reason }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { q_v2: $.data.version }
            - call: "POST /order-forms"
              payload: { quote_id: "${q_id}", signer_name: "Dana Reeves", signer_email: "dana.reeves@northwind.example", expected_quote_version: "${q_v2}" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { of2_id: $.data.id, of2_status: $.data.status }
            - call: "GET /order-forms/${of1_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { of1_final_status: $.data.status, of1_final_void: $.data.void_reason }
          assert:
            - "${q_status} == APPROVED"
            - "${of1_status} == GENERATED"
            - "${err_id} == ERR_STALE_QUOTE_VERSION"
            - "HTTP status == 412"
            - "${of1_mid_status} == GENERATED"
            - "${of1_mid_void} == null"
            - "${of2_status} == GENERATED"
            - "${of1_final_status} == VOID"
            - "${of1_final_void} == SUPERSEDED_BY_NEW_ORDER_FORM"
            - "OrderForm.${of2_id}.generated_from_quote_version == ${q_v2}"

      - name: four_level_cascade_from_a_single_reopen_call
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Quote.CHANGES_REQUESTED_to_DRAFT
        excluded_because:
          difficulty_instance: transitive_cascade / reopen_cascade_four_levels_request_steps_terms_revrec
          rationale: "That instance verifies the whole reopen chain end to end: request CANCELLED, steps VOIDED, terms back to PENDING and the RevRecAssessment to STALE."
      - name: both_line_pricing_variants_diverge_on_the_same_quote
        claim_type: dual_variant_calculation
        grounds:
          - calculations.C1_line_pricing
        excluded_because:
          difficulty_instance: dual_variant_calc / tiered_line_pricing_whole_quantity_average_vs_marginal_progressive_money
          rationale: "That instance asserts both variants' totals and the delta between them on one band-straddling quote."
      - name: surge_adjusted_service_level_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.C5_service_levels_and_expiry
        excluded_because:
          difficulty_instance: boundary_precision_check / sla_sweep_at_exact_surge_adjusted_due_instant_is_not_a_breach
          rationale: "That instance sweeps at exactly sla_due_at (no breach) and one second later (breach), on the halved surge-window service level."

  # =========================================================================
  # Guide section 9 — From Consistency Model (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: line_write_recomputes_quote_totals_visible_to_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.C1_line_pricing
          - calculations.C2_order_totals
          - endpoints.PATCH_/quote-lines/{id}
        distinguishing_aspect: |
          There is no lag and no reconciliation job: the PATCH response already carries the recomputed
          line money, and the very next GET /quotes shows list_total_cents 2400000,
          final_net_total_cents 2160000 and final_margin_pct 0.722222 — identical to what the
          pricing-preview computes on demand.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One DRAFT quote, term_months 12, payment_terms_days 30, with a single Core Platform line of quantity 10 at requested_discount_pct 0.10 — band 1 (1-49) carries tier_discount_pct 0.00, so list 1200000, net 1080000, cost 300000."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Immediate Totals", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 10, requested_discount_pct: 0.10 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { q_net_before: $.data.final_net_total_cents, q_list_before: $.data.list_total_cents }
          trigger:
            - call: "PATCH /quote-lines/${line_id}"
              payload: { quantity: 20 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_list: $.data.extended_list_cents, line_cost: $.data.extended_cost_cents, line_net: $.data.final_net_cents, line_band: $.data.volume_tier_level_applied }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { q_list_after: $.data.list_total_cents, q_cost_after: $.data.cost_total_cents, q_net_after: $.data.final_net_total_cents, q_blended_after: $.data.final_blended_discount_pct, q_margin_after: $.data.final_margin_pct }
            - call: "GET /quotes/${q_id}/pricing-preview"
              payload: {}
              as: DealDeskAnalyst
              captures: { pv_net: $.data.final_net_total_cents, pv_margin: $.data.final_margin_pct, pv_level: $.data.required_approval_level }
          assert:
            - "${q_list_before} == 1200000"
            - "${q_net_before} == 1080000"
            - "${line_band} == 1"
            - "${line_list} == 2400000"
            - "${line_cost} == 600000"
            - "${line_net} == 2160000"
            - "${q_list_after} == 2400000"
            - "${q_cost_after} == 600000"
            - "${q_net_after} == 2160000"
            - "${q_blended_after} == 0.100000"
            - "${q_margin_after} == 0.722222"
            - "${pv_net} == 2160000"
            - "${pv_margin} == 0.722222"
            - "${pv_level} == 1"
