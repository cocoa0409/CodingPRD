        grounds: ["errors[ERR_LAB_REQUIRED_BEFORE_REFILL]"]
        excluded_because:
          difficulty_instance: refill_approval_requires_lab_reviewed_normal
          rationale: "Asserted as the blocked-approve failure path of that §1.8 instance."
      - name: error_provider_slot_overlap_covered
        claim_type: Violation to Error
        grounds: ["errors[ERR_PROVIDER_SLOT_OVERLAP]"]
        excluded_because:
