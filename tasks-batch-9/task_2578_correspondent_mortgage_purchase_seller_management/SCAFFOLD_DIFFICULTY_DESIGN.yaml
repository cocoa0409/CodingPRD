              captures: { c_be: $.data.id }
          assert:
            - "first call: HTTP 409 with error_id ERR_DELIVERY_WINDOW_OVERLAP"
            - "second call: HTTP 201, Commitment.${c_touch}.status == LOCKED (touching windows do not overlap)"
            - "third call: HTTP 201, Commitment.${c_be}.status == LOCKED and commitment_type BEST_EFFORTS (exempt in both directions)"
            - "Seller.${s1}.open_mandatory_exposure_cents == 80000000 (the two accepted MANDATORY lines only)"
            - "GET /correspondent/commitments?seller_id=${s1} returns total_count 3"

      - name: scorecard_periods_sharing_an_endpoint_date_overlap
        grounds:
          - validations.priority_48_ERR_SCORECARD_PERIOD_OVERLAP
          - entities.SellerScorecard.fields.period_start
          - entities.SellerScorecard.fields.period_end
        distinguishing_aspect: |
          Scorecard periods are CLOSED intervals, so the reservation semantics are
          the opposite of the delivery window: [2026-06-30, 2026-07-31] shares the
          single date 2026-06-30 with the existing [2026-06-01, 2026-06-30] period
          and is rejected with ERR_SCORECARD_PERIOD_OVERLAP, while
          [2026-07-01, 2026-07-31] is accepted — and the overlap check ignores
          status, so it fires against an OPEN scorecard just as it would against a
          CLOSED one.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
            - "Seller APPROVED / GOOD_STANDING"
            - "existing SellerScorecard with period 2026-06-01 .. 2026-06-30 in OPEN"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/scorecards"
              payload: { period_start: "2026-06-01", period_end: "2026-06-30" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { sc_base: $.data.id }
          trigger:
            - call: "POST /correspondent/sellers/${s1}/scorecards"
              payload: { period_start: "2026-06-30", period_end: "2026-07-31" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/scorecards"
              payload: { period_start: "2026-07-01", period_end: "2026-07-31" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { sc_ok: $.data.id }
          assert:
            - "first call: HTTP 409 with error_id ERR_SCORECARD_PERIOD_OVERLAP"
            - "second call: HTTP 201 with SellerScorecard.${sc_ok}.status == OPEN and period_start 2026-07-01"
            - "SellerScorecard.${sc_base}.status == OPEN and its period is unchanged"
            - "GET /correspondent/sellers/${s1}/scorecards returns total_count 2"

  - rule_id: compensating_invariant
    instances:
      - name: loan_rejection_restores_commitment_notional_identity
        grounds:
          - state_machines.Loan.SUSPENDED_to_REJECTED
          - validations.priority_62_ERR_NO_NON_CURABLE_DEFECT
          - calculations.defect_classification
          - entities.Commitment.fields.available_amount_cents
        distinguishing_aspect: |
          Rejecting a delivered loan must undo exactly the allocation the delivery
          made and nothing else: allocated_amount_cents returns from 40000000 to
          0, available_amount_cents returns from 60000000 to the full 100000000,
          the Commitment stays in LOCKED (a rejection is not a fill and not a
          pair-off), no pair-off fee is booked, and the conservation identity
          notional == allocated + fulfilled + paired_off + cancelled + available
          holds again at 100000000.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
            - "Seller APPROVED / GOOD_STANDING with mandatory_exposure_limit_cents 3000000000"
            - "Commitment MANDATORY notional 100000000 on CONF30F; before the trigger allocated 40000000 and available 60000000"
            - "Loan note 40000000 in SUSPENDED carrying one COMPLIANCE/HIGH defect classified NON_CURABLE (cure_deadline_at null)"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 100000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /correspondent/commitments/${c1}/loans"
              payload: { expected_commitment_version: "${cv1}", seller_loan_number: "HP-9001", note_amount_cents: 40000000, note_rate_pct: 6.500, fico: 720, ltv_pct: 82.5, occupancy: "PRIMARY", servicing_election: "RELEASED", escrow_balance_cents: 320000, closing_date: "2026-07-20", first_payment_due_date: "2026-09-01" }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { l1: $.data.id }
            - call: "POST /correspondent/loans/${l1}/review"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l1}/defects"
              payload: { defect_code: "CP-TRID-TOLERANCE-CURE-MISSING", category: "COMPLIANCE", severity: "HIGH" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /correspondent/loans/${l1}/reject"
              payload: { note: "non-curable TRID tolerance violation" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
          assert:
            - "Defect.${d1}.classification == NON_CURABLE and Defect.${d1}.cure_deadline_at == null and Defect.${d1}.status == OPEN"
            - "Loan.${l1}.purchase_status == REJECTED and Loan.${l1}.non_curable_defect_count == 1"
            - "Commitment.${c1}.allocated_amount_cents == 0"
            - "Commitment.${c1}.available_amount_cents == 100000000"
            - "Commitment.${c1}.fulfilled_amount_cents == 0 and paired_off_amount_cents == 0 and cancelled_amount_cents == 0"
            - "Commitment.${c1}.status == LOCKED and pair_off_fee_cents == 0"
            - "conservation: notional_amount_cents 100000000 == allocated 0 + fulfilled 0 + paired_off 0 + cancelled 0 + available 100000000"
            - "Seller.${s1}.open_mandatory_exposure_cents == 100000000 and Seller.${s1}.net_funded_cents == 0 and Seller.${s1}.fee_receivable_cents == 0"

      - name: tolerance_write_off_conserves_notional_without_pair_off_fee
        grounds:
          - state_machines.Commitment.LOCKED_to_FULFILLED
          - entities.Commitment.fields.tolerance_cents
          - entities.Commitment.fields.cancelled_amount_cents
          - calculations.pair_off_fee_cents
        distinguishing_aspect: |
          A 98000000 fill against a 100000000 MANDATORY line leaves a 2000000
          shortfall that sits exactly on tolerance_cents, so the purchase writes
          the residual off — cancelled_amount_cents 2000000, available 0, status
          FULFILLED, pair_off_fee_cents 0 — instead of leaving the line
          PARTIALLY_FULFILLED with 2000000 available or charging the 25000
          administrative fee. The conserved identity still sums to 100000000.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z at delivery, 2026-08-05T00:00:00Z at issuance and settlement"
            - "JUMBO30F product: base 100.500, min_fico 720, max_ltv 80.0, max_loan 250000000, MANDATORY only, PRIMARY only, srp 0.750, no LLPA rows"
            - "Commitment MANDATORY notional 100000000, window 2026-08-01 -> 2026-08-31 -> commitment_price_pct 100.630, tolerance_cents 2000000"
