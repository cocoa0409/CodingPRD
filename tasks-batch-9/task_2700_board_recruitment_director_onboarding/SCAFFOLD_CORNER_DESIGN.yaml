      - name: waiving_a_completed_onboarding_item_returns_item_state_invalid
        claim_type: invalid_transitions
        grounds:
          - state_machines.OnboardingItem.PENDING_to_WAIVED
          - errors[ERR_ONBOARDING_ITEM_STATE_INVALID]
          - validations.priority_40
        distinguishing_aspect: |
          COMPLETED and WAIVED are alternative terminal outcomes of the same PENDING row, so waiving an
          already COMPLETED item returns 409 ERR_ONBOARDING_ITEM_STATE_INVALID and waiver_reason stays null.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one Director in ONBOARDING with one required OnboardingItem already COMPLETED."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
