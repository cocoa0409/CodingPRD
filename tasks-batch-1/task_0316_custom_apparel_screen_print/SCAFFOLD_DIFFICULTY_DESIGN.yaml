              payload: { press_id: "${press_id}", window_start: "2026-06-02T10:00:00.000Z", window_end: "2026-06-02T12:00:00.000Z" }
              as: ShopManager
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-22T00:00:00.000Z" }
              as: ShopManager
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /orders/${o2}/production-runs"
              payload: { press_id: "${press_id}", window_start: "2026-06-02T11:00:00.000Z", window_end: "2026-06-02T13:00:00.000Z" }
