    ASC'
  roles:
  - ShedAdmin
  - IntakeClerk
  - StorageManager
  - QualityAssuranceManager
  - SalesManager
  code: 200
  input:
  - limit?
  - offset?
  output: StorageBin[]
  side_effects: []
- method: POST
  path: /potato-shed/growers/{id}/field-lots
  description: Field lot intake (INTAKE state, unbinned)
  roles:
  - IntakeClerk
  code: 201
  input:
  - variety
  - harvest_date
  - original_weight_cwt
  output: FieldLot
  side_effects: []
- method: GET
  path: /potato-shed/field-lots/{id}
