  - rule_id: compensating_invariant
    instances:

      - name: exception_revoke_restores_pressure_stage_and_relief_total
        grounds:
          - state_machines.ExceptionRequest.APPROVED_to_REVOKED
          - entities.Employee.fields.approved_relief_days_total
          - entities.PolicyCycle.fields.formal_action_total
          - calculations.relief_days_credited
          - calculations.non_compliance_pressure
        conserved_quantity: "Employee.approved_relief_days_total == sum(granted_relief_days of APPROVED requests), and PolicyCycle.formal_action_total == sum(Team.formal_action_count) over the cycle's teams"
        distinguishing_aspect: |
          Revocation is the exact inverse of approval across five levels: the relief
          is withdrawn from the already-settled week, the pressure climbs back to
          the same 4.00 it had before approval, the ladder re-enters the
          formal-action band and both counters return to 1 - no drift, no
          double-count, and approved_relief_days_total returns to 0 rather than
          staying at 2 or going negative. The one thing that is NOT restored is the
          EscalationCase identity: curing is terminal, so re-entry opens a new case
          whose prior_case_id points back.
        test_recipe:
          setup:
