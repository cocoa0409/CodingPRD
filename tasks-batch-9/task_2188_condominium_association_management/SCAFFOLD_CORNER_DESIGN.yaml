        distinguishing_aspect: "The same roster and the same 3500000-cent spendable balance report DEFICIENT at 2121 bp straight-line and ADEQUATE at exactly 7000 bp component-method, because the 35-years-remaining component contributes 1500000 under straight line and 0 under the 30-year horizon — and 7000 bp equal to the threshold must read ADEQUATE, not DEFICIENT."
        test_recipe:
          setup:
            - "An association with reserve_balance_cents 3500000 and no designations, holding an elevator (cost 30000000, life 50, age 25 -> 25 years remaining) and a roof (cost 12000000, life 40, age 5 -> 35 years remaining)."
