      - name: excluded_endpoint_conditional_action_tolling_two_branches
        claim_type: Conditional action
        grounds:
          - endpoints["POST /investigations/{id}/tolling"]
        distinguishing_aspect: |
          One endpoint carries three behaviours selected by the action and by the current state:
          SUSPEND, RESUME from TOLLED which accrues tolled days, and RESUME from PENDING_REVIEW
          which reopens the findings loop instead.
        excluded_because:
          difficulty_instance: "non_linear_state_machine / investigation_double_tolling_cycle_then_pending_review_revision_loop"
          rationale: |
            That instance drives every branch of the endpoint twice over, including the accrual
            arithmetic and the complaint-side effect of the revision branch, which is strictly
            more than a conditional-action corner probe would assert.

  # =========================================================================
  # Guide section 6 - Errors (§1.7, 74 codes; every code must be triggerable)
  # =========================================================================
  - section: errors
    instances:
      - name: every_path_id_family_reports_its_own_not_found_code
        claim_type: Error triggerable
        grounds:
          - validations[priority=3]
          - errors.ERR_ROOM_NOT_FOUND
          - errors.ERR_ALLEGATION_NOT_FOUND
          - errors.ERR_INVESTIGATION_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_DISCIPLINE_NOT_FOUND
          - errors.ERR_APPEAL_NOT_FOUND
          - errors.ERR_REINSTATEMENT_NOT_FOUND
          - errors.ERR_ALERT_NOT_FOUND
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_CHECKIN_NOT_FOUND
          - errors.ERR_DISCLOSURE_NOT_FOUND
        distinguishing_aspect: |
          The domain declares one not-found code per entity family and the priority-3 rule says the
          code is chosen by the path family, not by a generic fallback. Eleven reads and writes
          against the same syntactically valid but unknown id must therefore produce eleven
          different codes, all at HTTP 404. An implementation with a single shared not-found code,
          or one that resolves the id lazily and fails later with a state error, is caught here.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Sergeant Doyle, who provides the acting identity for the Supervisor-only route; no rooms, complaints, investigations, disciplines, appeals, alerts, plans, check-ins or disclosures exist."
            - "The literal 00000000-0000-0000-0000-000000000000 is used as the unknown id everywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
          trigger:
            - call: "GET /hearing-rooms/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SystemAdmin
              captures: { e_room: "$.data.error_id" }
            - call: "GET /allegations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsCustodian
              captures: { e_alleg: "$.data.error_id" }
            - call: "GET /investigations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsCustodian
              captures: { e_inv: "$.data.error_id" }
            - call: "GET /interview-sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsCustodian
              captures: { e_sess: "$.data.error_id" }
            - call: "GET /disciplines/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsCustodian
              captures: { e_disc: "$.data.error_id" }
            - call: "GET /appeals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsCustodian
              captures: { e_app: "$.data.error_id" }
            - call: "POST /reinstatements/00000000-0000-0000-0000-000000000000/finalize"
              payload: { interim_earnings_cents: 0 }
              as: AppealsOfficer
              captures: { e_reinst: "$.data.error_id" }
            - call: "GET /eis-alerts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SystemAdmin
              captures: { e_alert: "$.data.error_id" }
            - call: "GET /intervention-plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SystemAdmin
              captures: { e_plan: "$.data.error_id" }
            - call: "POST /check-ins/00000000-0000-0000-0000-000000000000/complete"
              payload: { outcome: "SATISFACTORY", notes: "No such check-in." }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { e_checkin: "$.data.error_id" }
            - call: "GET /credibility-disclosures/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsCustodian
              captures: { e_disc_rec: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404"
            - "${e_room} == ERR_ROOM_NOT_FOUND"
            - "${e_alleg} == ERR_ALLEGATION_NOT_FOUND"
            - "${e_inv} == ERR_INVESTIGATION_NOT_FOUND"
            - "${e_sess} == ERR_SESSION_NOT_FOUND"
            - "${e_disc} == ERR_DISCIPLINE_NOT_FOUND"
            - "${e_app} == ERR_APPEAL_NOT_FOUND"
            - "${e_reinst} == ERR_REINSTATEMENT_NOT_FOUND - path existence at priority 3 outranks the priority-13 earnings check, which the payload would otherwise satisfy anyway"
            - "${e_alert} == ERR_ALERT_NOT_FOUND"
            - "${e_plan} == ERR_PLAN_NOT_FOUND"
            - "${e_checkin} == ERR_CHECKIN_NOT_FOUND - path existence outranks the priority-6 plan-supervisor identity rule"
            - "${e_disc_rec} == ERR_DISCLOSURE_NOT_FOUND"
            - "no entity row was created by any of the eleven calls"

      - name: intake_routing_and_the_withdrawal_credential_have_their_own_codes
        claim_type: Error triggerable
        grounds:
          - errors.ERR_NO_INTAKE_UNIT
          - errors.ERR_INTAKE_CODE_MISMATCH
          - errors.ERR_ANONYMOUS_NOT_WITHDRAWABLE
          - endpoints["POST /complaints/{id}/withdraw"]
        distinguishing_aspect: |
          Three codes guard the two ends of the intake lifecycle and each needs a different world
          state. ERR_NO_INTAKE_UNIT needs a department with no internal affairs unit at all, which
          is only observable before the reference data is complete. The two withdrawal codes then
          separate a wrong credential at priority 6 from an anonymous complaint that has no
          credential at all at priority 12: the anonymous file passes the code check precisely
          because its stored code is null, and is refused one rung further down.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Only one PATROL_DIVISION unit with intake_enabled true exists at first, holding Sergeant Doyle; the INTERNAL_AFFAIRS unit is created mid-test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Reports not filed, but there is nowhere to route the file.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { e_no_ia: "$.data.error_id" }
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Reports not filed on the same shift.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { sup_c_id: $.data.id, sup_code: $.data.intake_reference_code }
            - call: "POST /complaints/${sup_c_id}/withdraw"
              payload: { intake_reference_code: "CMP-999999", withdrawal_reason: "Wrong credential presented." }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { e_code: "$.data.error_id" }
            - call: "POST /complaints"
              payload: { intake_channel: "ANONYMOUS", narrative: "Anonymous report of an injury caused by a takedown.", incident_datetime: "2026-07-18T20:00:00Z", alleged_injury: true, reported_allegation_types: ["EXCESSIVE_FORCE"], subject_unit_id: "${patrol_unit_id}" }
              as: Complainant
              captures: { anon_c_id: $.data.id }
            - call: "POST /complaints/${anon_c_id}/withdraw"
              payload: { intake_reference_code: "CMP-000002", withdrawal_reason: "Anonymous author changed their mind." }
              as: Complainant
              captures: { e_anon: "$.data.error_id" }
            - call: "POST /complaints/${sup_c_id}/withdraw"
              payload: { intake_reference_code: "${sup_code}", withdrawal_reason: "Correct credential presented." }
              as: Supervisor
              as_user_id: "${sup_id}"
          assert:
            - "call 1: HTTP 422 with ${e_no_ia} == ERR_NO_INTAKE_UNIT and no Complaint row created, so intake_sequence has not advanced"
            - "call 3: HTTP 201 with Complaint.${sup_c_id}.classification == CLASS_II, intake_sequence == 1 and intake_reference_code == CMP-000001"
            - "call 4: HTTP 403 with ${e_code} == ERR_INTAKE_CODE_MISMATCH; the complaint is still CLASSIFIED with closed_at null"
            - "call 5: HTTP 201 with Complaint.${anon_c_id}.classification == CLASS_I (alleged_injury forces it), status == CLASSIFIED (screening is only required for an anonymous CLASS_III), assigned_unit_id == ${ia_unit_id}, intake_sequence == 2 and intake_reference_code == null"
            - "call 6: HTTP 422 with ${e_anon} == ERR_ANONYMOUS_NOT_WITHDRAWABLE - the priority-6 credential check passes on a null stored code, so the priority-12 channel rule is what refuses it"
            - "call 7: HTTP 200 with Complaint.${sup_c_id}.status == WITHDRAWN, closed_at == 2026-08-01T00:00:00Z and retention_until == 2028-07-31T00:00:00Z"
            - "Complaint.${anon_c_id}.status is still CLASSIFIED after the refused withdrawal"

      - name: interview_and_findings_guards_fire_one_at_a_time_along_a_single_chain
        claim_type: Error triggerable
        grounds:
          - errors.ERR_INVALID_SESSION_WINDOW
          - errors.ERR_NO_INTERVIEW_HELD
          - errors.ERR_REPRESENTATION_NOT_PRESENT
          - errors.ERR_INTERVIEW_NOT_STARTED
          - errors.ERR_MAX_POSTPONEMENTS_REACHED
          - errors.ERR_SESSION_STATE_INVALID
          - errors.ERR_FINDINGS_INCOMPLETE
        distinguishing_aspect: |
          Seven codes protect the interview stage and each is only reachable from one precise world
          state, so they must be provoked in order along one chain. Two of them are ordering traps:
          a hold requested before the scheduled start while representation is still REP_REQUESTED
          must report the priority-9 representation code rather than the priority-11 not-started
          code, and findings submitted after the session exists but before it is held must report
          ERR_NO_INTERVIEW_HELD rather than an investigation-state error - scheduling alone already
          moved the investigation to IN_PROGRESS, so the priority-8 gate is satisfied while
          interview_held_count is still 0.
        test_recipe:
          setup:
            - "The logical clock starts at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes and Investigator Ahn (certification level 3); Patrol North holds Sergeant Doyle and Officer Vance."
            - "One hearing room, HQ / Interview 1, concurrent_capacity 1."
            - "A supervisor-channel complaint carries TWO allegations against Officer Vance, so a one-entry findings payload is incomplete by construction."
            - "MIN_NOTICE_HOURS is 48 and MAX_POSTPONEMENTS is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
