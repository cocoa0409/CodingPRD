            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Milo Minor", dob: "2008-08-02" }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Milo Minor", dob: "2008-08-02", guardian_full_name: "Pat Parent", guardian_consent: true, supervisor_waiver_id: "${sup}" }, as: GroupLeader, as_user_id: "${g}", captures: { m_minor: $.data.is_minor, m_sup: $.data.supervisor_waiver_id } }
          assert:
